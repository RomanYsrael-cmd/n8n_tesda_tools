mpetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no\nFDA notification,\no\nDOH and DTI Protocol and\nRequirements\no\nOSH policies and guidelines\no\nEnvironment Safety Rules and\nRegulations\no\nBasic Mathematics\n•\nPerform the following tasks;\no Following code of ethics\no Following salon policies and\nprocedures\no Advising client body and health care\nmaintenance\no Following salon form and records for\nmaintenance and inventories for\nsupplies, materials and equipment\no Checking, cleaning, recording,\nsanitizing and storing supplies,\nmaterials and equipment\no Checking, cleaning, recording\nsanitizing, sterilizing and storing\ntools\no Following and applying\nhousekeeping, safekeeping and 5S\nprinciples/procedures\no Segregating and disposing waste\nmaterials\no Cleaning and preparing workstation\no Recording filing and storing form,\nrecords and documents\no Complying PD 856 (code Sanitation\nof the Philippines), RA 9003 (Waste\nmanagement Program), FDA\n• Lecture/Review\n• Demonstration\n• Video Presentation\n• Self-Learning\n• Case\nstudy/demonstration\n• Group\ndemonstration\n• (SLE)Self Learning\nExperienced\n\n• Observation\n• Demonstration with\noral questioning\n• Practical/\nPerformance Test\n• Interview\n\n--- PDF PAGE 159 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n155\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nnotification, DOH, DTI and OSH\npolicies and guidelines\no Following Environment Safety Rules\nand regulations\no Applying basic mathematics\n\n--- PDF PAGE 160 ---\nTR – Barbering NC III Revision 01\nPromulgated (06/09/2020)\n156\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na.\nCourse design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\nb.\nTraining delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\nc.\nTraining can be done on actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology;\nd.\nAssessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\ne.\nAssessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence;\nf.\nTraining program allows for Recognition of Prior Learning (RPL) or current\ncompetencies;\ng.\nTraining completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency – based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or combination with other\nmodalities when designing and delivering training programs:\n\n 2.1 Institution-Based:\n\n•\nDual Training System (DTS)/Dualized training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP;\n\n•\nDistance learning is formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\naudio, video, computer technologies or other modern technology that\ncan be used to facilitate learning and formal and non-formal training.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of\nthe trainee through actual experience in the workplace to acquire\n\n--- PDF PAGE 161 ---\nTR – Barbering NC III Revision 01\nPromulgated (06/09/2020)\n157\nspecific competencies as prescribed in the training regulations. It is\nimperative that the deployment of trainees in the workplace is adhered\nto training programs agreed by the institution and enterprise and status\nand progress of trainees are closely monitored by the training\ninstitutions to prevent opportunity for work exploitation.\n\n•\nThe traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n 2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship – is based on training (and working)\nagreement between an apprentice and a master craftsperson wherein\nthe agreement may be written or oral and the master craftsperson\ncommits to training the apprentice in all the skills relevant to his or her\ntrade over a significant period of time, usually between one and four\nyears, while the apprentice commits to contributing productively to the\nwork of the business. Training is integrated into the production\nprocess and apprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training – where training is implemented within the\ncompany in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3 Community-Based – short term programs conducted by Non-\nGovernment Organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings such\nas barangay hall, basketball courts, etc. These programs can also be\nMobile Training Programs (MTP).\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this program must possess the following\nrequirements:\n\n•\nCompleted at least 10 years basic education or Holder of Alternative\nLearning Systems (ALS) certificate of completion with grade 10 equivalent;\n•\nBasic communication skills\n\n--- PDF PAGE 162 ---\nTR – Barbering NC III Revision 01\nPromulgated (06/09/2020)\n158\n3.4\nTOOLS, MATERIALS AND EQUIPMENT\n\nRecommended list of tools, equipment and materials for the training of 20 trainees\nfor BARBERING NC II.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used as\nalternatives. This also applies in consideration of community practices and their\navailability in the local market.\n\n FULL QUALIFICATION\n\nTOOLS\nQTY\nUNIT\n DESCRIPTION/SPECIFICATION\n10\nPCS.\nPaddle brush\n10\nPCS.\nWide tooth comb\n10\nPCS.\nTail comb\n20\nPCS.\nBarber comb (12 counts 7 ½ inches)\n5\nPCS.\nSqueezer\n20\nPCS.\nCutting scissor (shear) 12”\n20\nPCS.\nThinning scissor (taper shear) 6“\n20\nPCS.\nRazor (disposable)\n10\nUNIT\nHair Clipper (electrical)\n\nEQUIPMENT\nQTY\nUNIT\n DESCRIPTION/SPECIFICATION\n5\nUNIT\nHair Steamer (handy) (Electric ac 220-240V)\n5\nUNIT\nHair Blower (2200 watts)\n10\nUNIT\nTrolley (W 45cm x D 33cm x H 3cm)\n4\nUNIT\nClient chair (reclining) (2x4/WxH)\n2\nUNIT\nShampoo bowl with chair\n1\nUNIT\nUltraviolet lamp or Ultraviolet sterilizer\n\nPERSONAL PROTECTIVE CLOTHING\nQTY\nUNIT\n DESCRIPTION/SPECIFICATION\n100\nBOX\nFace Mask (100 pcs. Per box)\n20\nPCS.\nApron (16”x24”)\n20\nPCS.\nCutting cape (16”x24”)\n20\nPCS\nChemical Cape (16’x24’)\n20\nPCS.\nShoulder pad (6”x20”)\n20\nPAIRS\nEar pad (rubber)\n1\nBOX\nDisposable gloves (100 pcs. Per box) (Latex)\n20\nPCS.\nFace shield\n\nSUPPLIES AND MATERIALS\nQTY\nUNIT\n DESCRIPTION/SPECIFICATION\n20\nROLLS\nTissue paper (10mters)\n3\nGAL.\nShampoo (250ml.)\n3\nGAL.\nCond