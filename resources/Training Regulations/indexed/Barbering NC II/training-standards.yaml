Play\n• Practical exercises\n• Presentation\n6.3 Record and\npresent\ninformation\n• Lecture and discussion on:\no Reporting requirements to a range\nof audiences\no Recommendations for possible\nimprovements\n• Analysis and comparison of interim and\nfinal reports’ outcomes\n• Reporting of data findings\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 hours\n7. Practice\nOccupational\nSafety and\nHealth Policies\nand Procedures\n7.1 Identify OSH\ncompliance\nrequirements\n• Discussion regarding:\n- Hierarchy of Controls\n- Hazard Prevention and Controls\n- Work Standards and Procedures\n- Personal Protective Equipment\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 hour\n\n7.2 Prepare OSH\nrequirements for\ncompliance\n• Identification of required safety\nmaterials, tools and equipment\n• Handling of safety control resources\n\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n\n7.3 Perform tasks in\naccordance with\nrelevant OSH\npolicies and\nprocedures\n•\nDiscussion of General OSH Standards\nand Principles\n• Performing industry related work\nactivities in accordance with OSH\nStandards\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n2 hours\n\n--- PDF PAGE 115 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n111\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n8. Exercise\nEfficient and\nEffective\nSustainable\nPractices in the\nWorkplace\n8.1 Identify the\nefficiency and\neffectiveness of\nresource\nutilization\n- Discussion on the process how\nEnvironmental Policies coherence is\nachieved\n•\nDiscussion on Necessary Skills in\nresponse to changing environmental\npolicies needs\n-\nWaste Skills\n-\nEnergy Skills\n-\nWater Skills\n-\nBuilding Skills\n-\nTransport Skills\n-\nMaterial Skills\n• Lecture\n• Group Discussion\n• Simulation\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n\n8.2 Determine\ncauses of\ninefficiency\nand/or\nineffectiveness of\nresource\nutilization\n• Discussion of Environmental Protection\nand Resource Efficiency Targets\n• Analysis on the Relevant Work\nProcedure\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n\n8.3 Convey inefficient\nand ineffective\nenvironmental\npractices\n• Identification of (re)training needs and\nusage of environment friendly methods\nand technologies\n• Identification of environmental corrective\nactions\n• Practicing Environment Awareness\n• Lecture\n• Group Discussion\n• Role Play\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n9. Practice\nEntrepreneurial\nSkills in the\nWorkplace\n9.1 Apply\nentrepreneurial\nworkplace best\npractices\n\n• Case studies on Best entrepreneurial\npractices\n• Discussion on Quality procedures and\npractices\n• Case studies on Cost consciousness in\nresource utilization\n• Case Study\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n1 hour\n\n--- PDF PAGE 116 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n112\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n9.2 Communicate\nentrepreneurial\nworkplace best\npractices\n• Discussion on communicating\nentrepreneurial workplace best practices\n\n• Lecture/\nDiscussion\n• Written Test\n• Interview\n1 hour\n9.3 Implement cost-\neffective\noperations\n• Case studies on Preservation,\noptimization and judicious use of\nworkplace resources\n• Case Study\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n2 hours\n\n--- PDF PAGE 117 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n113\nCOMMON COMPETENCIES\n(24 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Maintain an\neffective\nrelationship with\nclients/\ncustomers (6\nhours)\n1.1 Maintain a\nprofessional\nimage\n\n• Lecture and discussion on the following\ntopics:\no Stance\no Posture\no Body language\no Grooming\no Standing orders\no Company policy and procedures\n• Maintain uniform and personal grooming\nin accordance with established policies\nand procedures\n• Maintain stance, posture, body language,\nand other personal presence in according\nto required standards\n• Keep visible work area tidy and\nuncluttered\n• Store equipment according to assignment\nrequirements\n• Lecture\n• Discussion\n• Group Work\n\n• Demonstration\nwith questioning\n• Observation with\nquestioning\n• Interviews/\nQuestioning\n\n 1 hour\n1.2 Meet client\nrequirements\n\n• Lecture and discussion on the following\ntopics:\n• Lecture\n• Discussion\n• Group Work\n\n• Demonstration\nwith questioning\n• Observation with\nquestioning\n• Interviews/\nQuestioning\n\n1 hour\n\n--- PDF PAGE 118 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n114\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Assignment instructions\no Post orders\no Reviewing assignment instructions\no Discussion techniques with\nclient/customer\no Implementing required changes\no Referral to appropriate\nemployer/personnel\no Clarification of client needs and\ninstructions\n•\nIdentify assignment instructions and\npost orders according to standard\nprocedures\n•\nAccomplish scope to modify\ninstructions/orders in the light of\nchanged situations\n•\nMeet client requirements according to\nthe assignment instructions\n•\nMonitor and appropriate action is taken\nin changes to client’s needs and\nrequirements\n•\nClear and comply with assignment\nrequirements of all communications with\nthe client or customer\n1.3 Build credibility\nwith clients\n\n•\nLecture and discussion on the following\ntopics:\no Interpersonal skills\no Customer service skills\no Telephone etiquette\no Maintaining records\n•\nAdhere to client expectations for\nreliability, punctuality and appearance\n• Lecture\n• Discussion\n• Group Work\n\n• Demonstration\nwith questioning\n• Observation with\nquestioning\n• Interviews/\nQuestioning\n\n1 hour\n\n--- PDF PAGE 119 ---\nTR – Barbering NC II Revision 01\nPromulgated (06/09/2020)\n115\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nIdentify, attend and record possible\ncauses of client/customer dissatisfaction\naccording to employer policy\n•\nInform client of all relevant security\nmatters in a timely manner and\naccording to agreed reporting\nprocedures\n1.4 Establish\nprofessional\nrelationship with\nthe client\n\n•\nLecture and discussion on the following\ntopics:\no Types of Client\no Main Components of Client\nRelationship\no Relative Intelligence\no Effect on Customer Satisfaction\no Benefits of Customer\nRelationship Management\no Improving Client Relationship\n• Demonstrate the ability to establish\nprofessional relationship with client\n• Demonstrate the ability of genuine\nconcern for the welfare of the clients\n• Demonstrate the ability required in\nhandling clients\n• Demonstrate the ability required in\nrendering client service skills\n• Lecture\n• Discussion\n• Group Work\n\n• Demonstration\nwith questioning\n• Observation with\nquestioning\n• Interviews/\nQuestioning\n\n1 hour\n1.5 Manage client\ninteractions\n\n•\nLecture and discussion on the following\ntopics:\no Manage client interactions\no Causes of client/customer\ndissatisfaction\no Assignment Instructions\no Reporting procedures\n•\nPerform the following skills:\n• Lecture\n• Discussion