y Rules and \nRegulations \n1.10 Basic Mathematics \n1.11 Client Consultation \n1.12 Hair Analysis \n1.12.1 Texture \n1.12.2 Type \n1.12.3Condition \n1.13 Scalp Analysis \n1.13.1  \nDifferent Scalp \nProblems \n1.13.2  \nDifferent Forms of \nAlopecia \n1.1 Following Code \nof Ethics \n1.2 Following salon \npolicies and \nprocedures \n1.3 Consulting and \nanalyzing client’s \nhair and scalp \ncondition \n1.4 Assisting and \nadvising client on \ndifferent hair and \nscalp treatment \n1.5 Understanding \nthe Anatomy of \nHeads, Scalp \nproblems and \nForms of \nAlopecia \n1.6 Assessing built of \nthe client \n1.7 Advising client to \nremove personal \naccessories \n1.8 Recording and \ndocumenting \nclient’s forms and \nrecords \n1.9 Complying PD \n856, RA 9003, \nFDA notification, \nDOH, DTI and \nOccupational \nSafety and \nHealth Policies \nand Guidelines\n\n--- PDF PAGE 61 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n57 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nspecification, DOH, DTI \nand OSH policies and \nguidelines \n1.14 Built of the Client \n1.15 Shampooing and \nConditioning \nprocedures \n \n2.Prepare work \nstation \n2.1 Appropriate tools and \nequipment, are \nprepared, checked \nrecorded and set \naccording to \nmanufacturer’s manual \nof instructions, FDA \nnotification, DOH, DTI \nand OSH policies and \nguidelines \n2.2 Appropriate supplies, \nmaterials and \ntreatment products   \nare prepared, checked \nand recorded in \naccordance with \nproduct specification \nwith FDA notification, \nDOH, DTI and OSH \npolicies and guidelines  \n2.3 Personal Protective \nEquipment \n(clothing/materials) is \nused in accordance \nwith hair and scalp \ntreatment procedures, \nDOH, DTI and OSH \npolicies and procedures \n2.4 Work station is \nensured of privacy, \nsafety practices and \ncleanliness in \naccordance