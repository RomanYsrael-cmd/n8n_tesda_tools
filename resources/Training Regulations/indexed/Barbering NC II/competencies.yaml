        "source_title": "PERFORM SHAVE AND STYLE BEARD AND MUSTACHE",
        "source_text": "--- PDF PAGE 87 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n83 \nUNIT OF COMPETENCY : PERFORM SHAVE AND STYLE BEARD AND        \nMUSTACHE \n \n \n \nUNIT CODE \n: SOC514321 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitude required to \nshave or design/style beard and mustache. It involves the \npreparation of client, the actual shaving, styling and designing \nbeards and mustache. Perform post service activity. It \nincludes practicing proper and ethical behavior in accordance \nwith code of ethics. \n \nELEMENT \nPERFORMANCE   \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Prepare \nworkstation \n1.1 \nSupplies and \nmaterials are \nprepared, checked and \nrecorded in \naccordance with \nshaving and styling \nbeard and mustache \nprocedure, FDA \nnotification following \nDOH, DTI and OSH \npolicies and guidelines \n1.2 \nShaving products \nform are prepared, \nchecked and recorded \nin accordance with \nshaving and styling \nbeard and mustache \nprocedure, product \nspecification with FDA \nnotification \n1.3 \nEquipment are \nprepared, checked, set \nand recorded \naccording to \nmanufacturer’s manual \nof instructions and \nshaving, styling beard \nand mustache \nprocedures \n1.4 \nCutting tools for \nshaving and styling \nare checked, \nprepared, recorded \nand sanitized in \naccordance with \nshaving and styling \nbeard and mustache \nprocedure, products \n1.1 \nCode of ethics \n1.2 \nFamiliarization of \nsalon policies and \nprocedures \n1.3 \nFamiliarization of \nForms and \nRecords \nProcedures of \nsupplies, \nmaterials, \nproducts, tools, \ncutting tools and \nequipment \n1.4 \nPD 856 (Sanitation \nCode of the \nPhilippines) \n1.5 \nFDA Notification \n1.6 \nDOH and DTI \nProtocol and \nRequirements \n1.7 \nOSH requirements \n1.8 \nEnvironment and \nSafety Regulations \n1.9 \nBasic Mathematics \n1.10 Salon Form and \nRecords \nProcedures of \nSupplies, \nMaterials, Tools, \nCutting tools and \nEquipment \n1.10.1 Supplies and \nMaterials \n1.10.1.1 Kinds and \nUses \n1.10.1.2 Product \nspecification/ \ninstruction \n1.1 Following Code \nof Ethics \n1.2 Following salon \npolicies and \nprocedures \n1.3 Following Salon \nForms and \nRecords \nProcedures of \nsupplies, \nmaterials, \nshaving tools, \ntools and \nequipment \n1.4 Preparing, \nchecking and \nrecording forms \nand records of \nsupplies, \nmaterials, \nshaving tools and \nequipment \n1.5 Preparing and \nchecking shaving \nproducts \n1.6 Providing PPE \n(clothing/ \nmaterials) \n1.7 Preparing \nworkstation \n1.8 Complying PD \n856, RA 9003, \nFDA notification, \nDOH, DTI and \nOSH \nrequirements\n\n--- PDF PAGE 88 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n84 \nELEMENT \nPERFORMANCE   \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nspecification following \nDOH, DTI and OSH \npolicies and guidelines \n1.5 \nPersonal Protective \nEquipment \n(clothing/materials) is \nused in accordance \nwith shaving and \nstyling beard and \nmustache procedures, \nDOH, DTI and OSH \npolicies and guidelines \n1.6 \nWork station is \nensured of privacy, \nsafety practices and \ncleanliness in \naccordance with \nestablished \nprocedures \n1.10.2 Tools and \nEquipment \n1.10.2.1 Kinds and \nUses \n1.10.2.2 \nManufacturer’s \nmanual of \nInstruction \n1.10.3 Cutting Tools for \nShaving and Styling \n1.10.3.1  \nKinds and Uses \n1.10.3.2  \nManufacturer’s \nManual of \ninstruction  \n1.10.4 Shaving \nproducts \n1.10.4.1  \nKinds and uses \n1.11 Kinds and Uses of \nPersonal \nProtective \nEquipment \n(clothing/materials \n1.12 5S principle \n1.13 Workstation \n1.14 Providing PPE \n(Clothing/ \nmaterials) \n1.15 Preparation and \nSet up of \nworkplace \n2.  Prepare \nclient \n2.1 Client’s safety and \ncomfort are ensured \nduring the entire \nprocess in accordance \nwith DOH, DTI and \nOSH policies and \nguidelines \n2.2 Client is consulted and \nassessed so that \nappropriate service \nrequirements shall be \nprovided \n2.3 Client’s beard and \nmustache are checked, \nanalyzed and agreed \nstyle, design and \ntrimming is agreed \n2.1 \nCode of Ethics \n2.2 \nFamiliarization of \nsalon policies and \nprocedures \n2.3 \nClient consultation \n2.4 \nFamiliarization of \nforms and records \nof client’s \ninformation \n2.5 \nPD 856 (Sanitation \nCode of the \nPhilippines)  \n2.6 \nRA 9003 \n(Ecological Waste \nManagement \nProgram Act of \n2000) \n2.1 Code of ethics \n2.2 Checking, \nassessing, \nanalyzing and \nconsulting client \nbeard and \nmustache \n2.3 Checking and \nrecording client’s \ninformation  \n2.4 Performing \nestablished \ndraping \nprocedures \n2.5 Using PPE \n(clothing/ \nmaterials)\n\n--- PDF PAGE 89 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n85 \nELEMENT \nPERFORMANCE   \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \naccording to service \nrequirements \n2.4 Client is advised to \nremove all personal \njewelries and \naccessories for \npersonal safekeeping \n2.5 Client’s Personal \nProtective Equipment \n(clothing/materials) is \nprovided in accordance \nwith shaving and \nstyling beard and \nmustache procedure, \nDOH, DTI and OSH \npolicies and guidelines \n2.6 Draping procedures \nare followed in \naccordance with \nestablished draping \nprocedures, DOH, DTI \nand OSH policies and \nguidelines \n2.7 First-aid, sanitizing or \nhygiene products are \nselected and prepared \nin accordance with \nshaving and styling \nbeard and mustache \nprocedure procedures \nproduct specification, \nDOH, DTI and OSH \npolicies and guidelines \n2.7 \nDOH and DTI \nProtocol and \nRequirements \n2.8 \nOSH requirements \n2.9 \nEnvironment \nSafety Rules and \nRegulations \n2.10 Basic mathematics \n2.11 Different beard \nand moustache \ndesigns/ styles \n2.12 Draping \nProcedures \n2.13 Using PPE \n(clothing/materials) \n \n \n2.6 Selecting and \npreparing first-\naid, sanitizing \nand hygiene \nproducts \n2.7 Complying PD \n856, RA 9003, \nFDA notification, \nDOH, DTI and \nOSH \nrequirements \n \n \n3. Shave and \ndesign/style \nbeard and \nmustache \n \n3.1 Supplies, materials and \ncutting tools are used in \naccordance with \nshaving and trimming \nprocedures for beard \nand mustache, \nmanufacturer’s manual \nof instruction with FDA \nnotification following \nDOH, DTI and OSH \npolicies and guidelines \n3.2 Shaving and trimming \ntechniques are applied \nboth on beard and \nmustache to remove \nbulk and or to give the \naccepted design and \nstyle in accordance with \n3.1 \nCode of Ethics \n3.2 \nCompliance to \nOperations Manual \nof Equipment \n3.3 \nPD 856 (Sanitation \nCode of the \nPhilippines)  \n3.4 \nRA 9003 \n(Ecological Waste \nManagement \nProgram Act of \n2000) \n3.5 \nFDA notification \n3.6 \nDOH and DTI \nProtocol and \nRequirements \n3.7 \nOSH requirements \n3.1 Following Code \nof ethics \n3.2 Using supplies, \nmaterials, cutting \ntools, shaving \nproducts and \nequipment \n3.3 Applying over-\ncomb technique \non shaving and \ntrimming \ntechnique on \nbeard and \nmustache \n3.4 Following \nestablished \nshaving and \nstyling beard and\n\n--- PDF PAGE 90 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n86 \nELEMENT \nPERFORMANCE   \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nestablished shaving \nand styling beard and \nmustache procedures \nproduct specification, \nmanufacturer’s manual \nof instruction with FDA \nnotification, DOH, DTI \nand OSH policies and \nguidelines \n3.3 Scissor over-comb \ntechniques are applied \nin a logical sequence to \nremove bulk and or \nshape beard and \nmustache \n3.4 Beard and moustache \nlines are defined \naccording to agreed \ndesign using \nappropriate cutting \ntools, products in \naccordance with \nestablished defining \nbeard procedures, and \nestablished designing \nbeard and mustache \nprocedures, following \nmanufacturer’s manual \nof instruction with FDA \nnotification, DOH, DTI \nand OSH policies and \nguidelines \n3.5 Excess hair is removed \nand finishing touches is \napplied according to \nagreed design following \nshaving, trimming, \nstyling and designing \nbeard and mustaches \nprocedures. \n3.6 When necessary, first-\naid treatment is \nprovided to the client or \nreferred to health \npersonnel \n3.8 \nEnvironment \nSafety Rules and \nRegulations \n3.9 \nBasic Mathematics \n3.10 Shave and \nDesign/Style \nBeard and \nmustache \n3.10.1 Over-comb \ntechniques \n3.10.2 Shaving/ \nOutline \nProcedures \n3.10.3 Defining \nBeard \n3.10.4 Established \ndesigning \nBeard and \nMustache \nprocedures  \n3.11  First Aid  \n3.12 \nUsing shaving \ntools and \nequipment \n3.13 \nOperating \nequipment \n \n \nmustache \nprocedures \n3.5 Following \nestablished \ndefining beard \nprocedures \n3.6 Following \nestablished \ndesigning beard \nand mustache \nprocedures \n3.7 Applying finishing \ntouches for beard \nand mustache \nprocedures \n3.8 Selecting and \npreparing first-\naid, sanitizing \nand hygiene \nproducts \n3.9 Complying PD \n856, RA 9003, \nFDA notification, \nDOH, DTI and \nOSH \nrequirements \n4.  Perform \npost-service \nactivities \n4.1 Client is advised on \nbeard and moustache \ncare and maintenance \naccording to product \nspecification \n4.1 \nCode of ethnics \n4.2 \nFamiliarization of \nSalon Policies and \nProcedures \n4.3 \nFamiliarization of \nSalon Forms and \n4.1 \nFollowing code \nof ethics \n4.2 \nFamiliarization \nsalon policies \nand procedures\n\n--- PDF PAGE 91 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n87 \nELEMENT \nPERFORMANCE   \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.2 Tools, equipment and \nimplements are cleaned, \nsanitized, replenished \nand stored in \naccordance with Shave \nand Style Beard and \nMustache procedures, \nmanufacturer’s manual \ninstructions, DOH, DTI  \nand OSH policies and \nguidelines \n4.3 Wastes materials are \nsegregated and \ndisposed properly \nfollowing Sanitation \nCode of the Philippines \n4.4 Workplace is cleaned, \nsanitized and prepared \nfor next service activity \n4.5 Documents are \nrecorded, filed and \nstored in accordance \nwith salon management \n \n           \nRecords \nProcedures for \nmaintenance and \nInventories of \nSupplies, \nMaterials, Tools, \nCutting tools and \nEquipment \n4.4 \nCompliance to \nOperations Manual \nof Equipment \n4.5 \nPD 856 (Sanitation \nCode of the \nPhilippines) \n4.6 \nRA. 0993 \n(Ecological Waste \nManagement \nProgram Act of \n2000) \n4.7 \nFDA Notification \n4.8 \nDOH and DTI \nProtocol and \nRequirements \n4.9 \nOSH requirements  \n4.10 Environment \nSafety Rules and \nRegulations          \n4.11 Basic Mathematics \n4.12 Hair Care \nMaintenance \nProgram \n4.13 Salon Record and \nForms Procedures \nfor Maintenance \nand Inventories of \nSupplies, \nMaterials, shaving \nproducts Tools, \nCutting Tools and \nEquipment \n4.13.1 Supplies and \nMaterials \n4.13.2 Tools and \nEquipment \n4.13.5 Cutting Tools \n4.13.6 Shaving \nProducts \n4.13.7 Housekeeping \nProcedures \n4.13.8 Safekeeping \nProcedures \n4.13.9 Method of \nSterilization \n4.3 \nAdvising client \nBeard and \nmustache care \nmaintenance \n4.4 \nFollowing Form \nand Records \nProcedures for \nMaintenance \nand inventories \nof Supplies, \nMaterials, \nCutting tools for \nshaving, tools \nand equipment \n4.5 \nChecking, \ncleaning, \nsanitizing \nrecording \nreplenishing \nand storing \nsupplies, \nmaterials and \nequipment \n4.6 \nChecking, \ncleaning, \nrecording, \nsanitizing, \nsterilizing and \nstoring tools  \n4.7 \nFollowing \nhousekeeping, \nsafekeeping \nprocedures and \n5S principles \n4.8 \nSegregating \nand disposing \nwaste materials \n4.9 \nCleaning, \nsanitizing and \npreparing \nworkstation \n4.10 Recording filing \nand storing \nform, records \nand documents \n4.11 Complying PD \n856 (code \nSanitation of the \nPhilippines), \nRA 9003 \n(Waste\n\n--- PDF PAGE 92 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n88 \nELEMENT \nPERFORMANCE   \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.13.10 5S Principles \n4.14 Waste materials \n4.15 Preparing and \ncleaning \nworkstation \n \n \n \nmanagement \nProgram) \nFDA \nnotification,  \nDOH, DTI and \nOSH policies \nand guidelines\n\n--- PDF PAGE 93 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n89 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Supplies/Materials \nMay include: \n1.1 \nAlcohol \n1.2 \nTissue \n1.3 \nFace Towel \n1.4 \nNapkin Cloth \n1.5 \nAfter Shave (liquid)  \n2. Shaving Product Form \nMay include: \n2.1 \nCream \n2.2 \nGel  \n2.3 \nMousse \n2.4 \nFoam \n3. Equipment \n \nMay include but not limited to: \n3.1 \nHair Clippers \n3.2 \nReclining chair \n3.3 \nTrolley \n3.4 \nHot Cab \n3.5 \nUltraviolet lamp or Ultraviolet sterilizer \n4. Cutting Tools   \nMay include:  \n4.1 \nCutting Scissor/shear \n4.2 \nRazor (disposable) \n4.3 \nHair Clippers \n5. Shaving and Styling  \nMay include: \n5.1 \nLessen the volume \n5.2 \nTotally shave \n5.3 \nRe-shape \n6. Personal Protective \nEquipment \n(clothing/materials) \nMay include but not limited to: \n6.1 \nNeck Strip (Cloth/tissue) \n6.2 \nCape \n6.3 \nTowel  \n6.4 \nApron \n6.5 \nFace Mask \n6.6 \nTissue paper \n6.7 \nFace shield \n7. Workstation \nMay include: \n7.1 Client chair \n7.2 Trolley \n7.3 Trash Bin \n7.4 Towel \n8.  Established Draping \nProcedures  \nMay include: \n8.1 Client is draped with bath towel with horizontal \nedge folded 2 inches outward \n8.2 Protective material is wrapped around the neck \n8.3 Cutting cape is wrapped around the shoulder \n9.  Established Shaving \nProcedures  \nMay include: \n9.1 \nLet the client seat on a comfortable position \n9.2 \nApply fresh headrest cover and adjust the \nheadrest to the proper height \n9.3 \nRecline the chair to a comfortable working angle\n\n--- PDF PAGE 94 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n90 \nVARIABLE \nRANGE \n9.4 \nApply shaving cream, lotion or gel according to \nproduct specification or manufacturer’s manual \nof instructions to retain moisture and reduce \nfriction of the blade against the skin. \n9.5 \nApply enough quantity of shaving cream into the \nhand and spread over the area to be shaved. \n9.6 \nStart at the neck, using the fingers and apply \nappropriate shaving stroke until you cover all the \nareas and rub for about 1 to 2 minutes until \nchosen texture is achieved. \n9.7 \nWhen using a straight razor, you can either use \na free hand or backhand stroke.  Hold the razor \nthen turn the client’s face to the left while you are \nstanding at the right side. \n9.8 \nCheck sharpness of the blade and replace if \nnecessary. \n9.9 \nBegin at the hairline at the right side. Stretch the \narea of the skin to be shaved then use a gliding \ndiagonal stroke and shave toward the corner of \nthe mouth to the jawbone. \n9.10 Remain in the same position and wipe the razor \nclean using a tissue paper. \n9.11 Stretch the skin and hold the razor in a \nbackhand position.  Using diagonal strokes, \nshave to the right side from the angle of the \nmouth down to the chin. \n9.12 Wipe the razor using a tissue paper. Maintaining \nthe same body position, hold the razor in the \nfreehand position. \n9.13 Shave the hair underneath the nostril using a \nslight diagonal strokes following the curves of \nthe face.  Use the fingers of the left hand to \nstretch the underlying skin.  \n9.14 Wipe the razor Stand to the right side of the \nclient and turn the client’s face upward to shave \nthe upper left lip \n9.15 Using a backhand position, push the tip of the \nnose lightly to the right using the thumb while the \nfingers of the left hand stretch the skin.  Shave \nthe upper left side of the tip. \n9.16 Gently turn the face of the client to the right, \nstretch the skin with the fingers of the left hand \nto prevent digging in along the ear. \n9.17 Stretch the skin and shave downward and \nslightly forward toward the corner of the mouth \nand jawbone \n9.18 Position yourself behind the client chair.  Hold \nthe razor for the reverse stroke.   Stretch the skin \nbelow the chin and shave upward on the lower \npart of the neck.  Stretch the skin away from the\n\n--- PDF PAGE 95 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n91 \nVARIABLE \nRANGE \nAdam’s apple and shave on a slight diagonal \nmanner. \n9.19 Stay behind the client’s chair. Cup the client’s \nchin, stretch the skin and reverse freehand \nstroke. \n9.20 To finish the shaving procedure, apply \nmoisturizing cream or lotion using manipulative \nrelaxing technique \n9.21 Remove cream residue using a tissue.  Moisten \na cotton ball with toner and pat gently all over \nthe face \n9.22 Apply moderately warm towel over the face \naccording to client’s requirements (it provides a \nrelaxing soothing effect) \n10. Over-Comb Techniques \nMay include: \n10.1 Scissor over-comb \n10.2 Clipper over-comb \n10.3 Clippers with knuckle  \n11. Established Designing \nBeard and Moustache \nProcedures \nMay include: \n11.1 Over-Comb Technique \n11.1.1 Wash facial hair with shampoo and rinse \nafterwards. Pat with towel to remove excess \nmoisture \n11.1.2 Comb the moustache using a fine-toothed \ncomb to brush the hair downward to make \nsure that you get balance trim \n11.1.3 Trim the moustache carefully and follow the \nshape of the client’s mouth to shape the \nbottom of the moustache \n11.1.4 Do not trim too far above the lip because \nhair will be a little shorter when it dries. \n11.1.5 To lessen the bulk of the moustache, \nreduce it by trimming the top layer using a \nmoustache trimmer or fine-tooth comb. \nGently lift the top layer then trim it evenly. \n11.1.6 Using moustache wax for styling purpose \n12. Established Defining \nBeard \nMay include: \n12.1 Using Scissor \n12.1.1 Using a comb, trim any hair which is on \nthe outside of the comb’s teeth. Begin by \ntrimming very short lengths of hair \n12.1.2 Continue trimming the beard according to \nthe client’s chosen length. Always comb \nthe beard to get an even trim. \n12.1.3 Comb the hair straight down and trim the \nhair that flows below the line of the lip \n12.1.4 Safely removed the hair on neck using a \ntrimmer or razor. \n12.2 Using Clipper \n12.2.1 Request the client to sit comfortably on\n\n--- PDF PAGE 96 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n92 \nVARIABLE \nRANGE \n           the chair \n12.2.2 Wash the beard thoroughly using \nshampoo     and conditioner.  Rinse well \nwith water then pat dry using towel. \n12.2.3 Comb the beard using fine-tooth comb to \nremove tangles and for easier trimming \n12.2.4 Start trimming using electric clipper; \nchoose appropriate guard to ensure the \nlength of the trim.  If the client chooses to \nremove the beard completely, leave the \nguard off.  Turn the trimmer on and trim \neach side of the client’s face using long \nsmooth strokes. \n12.2.5 Trim the mustache and chin.  Start under \nthe nose and move toward the corner of \nthe mouth then proceed down to the chin.  \nMake sure the client’s mouth is closed. \n12.2.6 Remove the guard from trimmer and trim \nalong the neckline to remove the \nremaining hair on the client’s neck  \n13. Moustache and Beard \nCare and Maintenance \nMay include; \n13.1 Shampoo and conditioner  \n13.2 After shave treatment  \n14. Waste Materials \nMay include: \n14.1 Biodegradable \n14.2 Non-biodegradable\n\n--- PDF PAGE 97 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n93 \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Consulted and prepared client according to job/service \nrequirements \n1.2 Prepared and used appropriate cutting tools, \nequipment and implements in accordance with Shave \nand Style Beard and Mustache procedures following \nproduct specification, manufacturer’s manual of \ninstructions, DOH, DTI and OSH requirements \n1.3 Prepared and used PPE (clothing/materials) in \naccordance with Shave and Style Beard and Mustache \nprocedures, DOH, DTI and OSH requirements  \n1.4 Performed shaving, styling and trimming according to \nagreed designed and style of beard and mustache \nfollowing Shave and Style Beard and Mustache \nprocedures, product specification, DOH, DTI and OSH \nrequirements \n1.5 Performed cross checking and applied appropriate \nfinishing touches. \n1.6 Followed safety precautions to clients during the entire \nprocess in accordance with DOH, DTI and OSH \npolicies and guidelines \n1.7 Applied appropriate measures in response to \nemergencies or unavoidable circumstances \n1.8 Performed post-service activities in accordance with \nShave and Style Beard and Mustache procedures, \nDOH, DTI and OSH policies and guidelines \n2.  Resource Implications \nThe following resources should be provided: \n2.1 Live Model  \n2.2 Supplies, materials, tools and implements relevant to \nthe activity to be performed \n2.3 Working area / facilities \n3.  Method of \nAssessment \nCompetency in this unit may be assessed through: \n3.1  Demonstration with Oral Questioning \n3.2  Portfolio \n3.3 Third -Party Report \n4.  Context of \nAssessment \n4.1 Competency may be assessed in the workplace or \nTESDA accredited assessment center\n",
