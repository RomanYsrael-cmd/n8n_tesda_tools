n \nVARIABLE \nRANGE \n1. Hair Condition \nMay include: \n1.1 \nPorous  \n1.2 \nSensitized \n1.3 \nDry \n1.4 \nOily \n1.5 \nNormal \n1.6 \nChemically treated \n2. Length \n \nMay include: \n2.1 \nShort \n2.2 \nMedium \n2.3 \nLong \n3. Hair Type  \nMay include: \n3.1 \nStraight \n3.2 \nCurly \n3.3 \nWavy \n3.4 \nFrizzy \n4. Texture \nMay include: \n4.1 \nFine \n4.2 \nMedium \n4.3 \nCoarse \n5. Scalp Condition \nMay include: \n5.1 \nOily \n5.2 \nNormal \n5.3 \nDandruff \n5.4 \nWith Irritation \n5.5 \nFlaking \n5.6 \nPost chemical service itch \n5.7 \nWith wounds \n6. Clients’ Built \nMay include: \n6.1 \nSmall \n6.2 \nMedium \n6.3 \nLarge \n6.4 \nExtra Large \n7. Established Hair \nShampooing and/or \nConditioning Procedures \nMay include: \n7.1 Comb/brush hair to free from entanglement   \nbefore actual shampooing and/or conditioning. \n7.2 Apply shampoo and/or conditioner according to \nthe clients’ hair length and volume, and type of \nservice.  \n7.3 Apply appropriate water temperature. \n7.4 Follow shampooing and/or conditioning \ntechnique. \n8. Tools and Equipment \nMay include but not limited to: \n8.1 \nSteamer \n8.2 \nBlower \n8.3 \nPaddle brush \n8.4 \nWide Toothed Comb \n8.5 \nTail comb\n\n--- PDF PAGE 66 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n62 \n8.6 \nMixing bowl (non-metallic) \n8.7 \nClamps  \n8.8 \nHair clips \n8.9 \nUltraviolet lamp or Ultraviolet sterilizer \n9. Supplies and Materials \nMay include: \n9.1 \nTissue Paper \n9.2 \nShampoo \n9.3 \nConditioner \n9.4 \nApplicator brush  \n9.5 \nHair and Scalp Treatment products \n10. Personal Protective \nClothing \nMay include but not limited to: \n10.1 Face mask \n10.2 Apron \n10.3 Cape \n10.4 Shoulder pad \n10.5 Bath Towel \n10.6 Face shield \n11. Workstation \nMay include: \n11.1 Shampoo bowl \n11.2 Client chair \n11.3 Trash Bin \n11.4 Trolley \n11.5 Towel \n11.6 Shampoo \n11.7 Conditioner \n11.8 Hair Blower \n11.9 Cape \n11.10 Apron \n12. Established Draping \nProcedures  \nMay include: \n12.1 Client is draped with bath towel with      \nhorizontal Edge folded 2 inches outward. \n12.2 Protective material/clothing is wrapped around \nthe neck. \n12.3 Appropriate Cape   is wrapped around the \nshoulder in accordance with type of service. \n13. Treatment Product \nMay include: \n13.1 \nCream Form \n13.2 \nLiquid Form \n13.3 \nGel Form \n14.  Established Hair and \nScalp Treatment \nProcedures  \nMay include: \n14.1 Apply treatment product according to product \nspecifications and manipulative relaxing motion \nis performed on hair and/or scalp. \n14.2 Expose hair or scalp to required source of heat \nwhen necessary, according to product \nspecifications and manufacturer’s manual \ninstructions \n14.3 Follow correct time requirement according to \nproduct specification and manufacturer’s \nmanual instructions. \n14.4 Client hair is rested after heat exposure      \naccording to the required allotted time.\n\n--- PDF PAGE 67 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n63 \n14.5 Rinse hair, towel or blow-dry  \n15. Manipulative Relaxing \nMotion \nMay include: \n15.1  Circular motion \n15.2  Pressing \n15.3  Sliding  \n16. Hair and Scalp \nMaintenance \nMay include: \n16.1    Hair and Scalp Frequent Treatment \n16.2    Other form of hair and scalp treatment  \n17. Waste Materials \nMay include: \n17.1    Biodegradable \n17.2    Non-Biodegradable\n\n--- PDF PAGE 68 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n64 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Ensured client’s safety and comfort during the entire \nprocess, in accordance with DOH, DTI and OSH protocols \nand guidelines. \n1.2 Prepared client through consultation, analyzing hair and \nrecording client’s form in accordance with salon policies \nand procedures. \n1.3 Prepared