        "source_text": "--- PDF PAGE 40 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n36 \nCOMMON COMPETENCIES \n \n \nUNIT OF COMPETENCY : MAINTAIN AN EFFECTIVE RELATIONSHIP WITH \nCLIENT/CUSTOMERS \n \n \n \nUNIT CODE \n: SOC514201 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required \nin building and maintaining effective relationship with \nclient/customers. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Maintain a \nprofessional   \nimage \n \n1.1 Uniform and personal \ngrooming maintained  \n1.2 Personal presence \nmaintained according \nto employer \nstandards \n1.3 Visible work area kept \ntidy and uncluttered \n1.4 Equipment stored \naccording to \nassignment \nrequirements \n1.1 Stance  \n1.2 Posture \n1.3 Grooming \n1.4 Standing Orders \n1.5 Company Policy and \nProcedures \n1.6 Role of a massage \npractitioner in the \nPhilippine \nhealthcare services \n1.1 Maintaining \nuniform and \npersonal grooming \nin accordance with \nestablished \npolicies and \nprocedures \n1.2 Maintaining \nstance, posture, \nbody language, \nand other personal \npresence in \naccording to \nrequired standards \n1.3 Keeping visible \nwork area tidy and \nuncluttered \n1.4 Storing equipment \naccording to \nassignment \nrequirements\n\n--- PDF PAGE 41 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n37 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Meet client \nrequirements \n2.1 Client requirements \nidentified and \nunderstood by referral \nto the assignment \ninstructions \n2.2 Client requirements \nmet according to the \nassignment instructions \n2.3 Changes to client’s \nneeds and \nrequirements \nmonitored and \nappropriate action \ntaken \n2.4 All communication with \nthe client or customer \nis clear and complies \nwith assignment \nrequirements \n \n \n2.1 Assignment \ninstructions \n2.2 Post orders \n2.3 Reviewing \nassignment \ninstructions \n2.4 Discussion \ntechniques with \nclient/customer \n2.5 Implementing \nrequired changes \n2.6 Referral to \nappropriate \nemployer/ personnel \n2.7 Clarification of client \nneeds and \ninstructions \n2.1 Identifying \nassignment \ninstructions and \npost orders \naccording to \nstandard \nprocedures \n2.2 Accomplishing \nscope to modify \ninstructions/orders \nin the light of \nchanged situations \n2.3 Meeting client \nrequirements \naccording to the \nassignment \ninstructions \n2.4 Monitoring and \nappropriating \naction is taken in \nchanges to client’s \nneeds and \nrequirements \n2.5 Clearing and \ncomplying with \nassignment \nrequirements of all \ncommunications \nwith the client or \ncustomer \n3. Build \ncredibility with \nclients \n3.1 Client expectations for \nreliability, punctuality \nand appearance \nadhered to \n3.2 Possible causes of \nclient dissatisfaction \nidentified, dealt with \nand recorded \naccording to employer \npolicy \n3.3 Client fully informed of \nall relevant security \nmatters in a timely \nmanner and according \nto agreed reporting \nprocedures \n3.1 Interpersonal skills \n3.2 Customer service \nskills \n3.3 Telephone etiquette \n3.4 Maintaining records \n3.1 Adhering to client \nexpectations for \nreliability, \npunctuality and \nappearance  \n3.2 Identifying, \nattending and \nrecording possible \ncauses of \nclient/customer \ndissatisfaction \naccording to \nemployer policy \n3.3 Informing client of \nall relevant security \nmatters in a timely \nmanner and \naccording to agreed \nreporting \nprocedures\n\n--- PDF PAGE 42 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n38 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4. Establish \nprofessional \nrelationship \nwith the \nclient \n4.1 Establish relationship \nwithin appropriate \nprofessional \nboundaries \n4.2 Build trust and respect \nthrough use of effective \ncommunication \ntechniques \n4.3 Identify and respond to \nclient special needs \n4.4 Communicate in ways \nthat take account of \ncultural considerations \n4.5 Exercise discretion and \nconfidentiality \n \n4.1 Types of client  \n4.2 Main components of \nclient relationship \n4.3 Relative intelligence \n4.4 Effect on customer \nsatisfaction \n4.5 Benefits of customer \nrelationship \nmanagement \n4.6 Improving client \nrelationship \nmanagement \n4.7 Occupational health \nand safety \n4.1 Demonstrating the \nability to establish \nprofessional \nrelationship with \nclient \n4.2 Demonstrating the \nability of genuine \nconcern for the \nwelfare of the \nclients \n4.3 Demonstrating the \nability required in \nhandling clients \n4.4 Demonstrating the \nability required in \nrendering client \nservice skills\n\n--- PDF PAGE 43 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n39 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n5. Manage \nclient \ninteractions \n5.1 Use a collaborative and \nperson-centered \napproach when working \nwith clients \n5.2 Use motivational \ninterviewing as a basis \nfor client interactions \n5.3 Seek client information \nrespectfully and \nsensitively, using \npurposeful, systematic \nand diplomatic \nquestions \n5.4 Support the client to \nidentify and articulate \nkey information that \nsupports the provision \nof service \n5.5 Encourage clients to \nvoice queries or \nconcerns and address \nthese appropriately \n5.6 Respond to difficult or \nchallenging behavior \nusing established \ntechniques \n5.7 Maintain professional \nintegrity and \nboundaries at all times \nWork within scope of \nrole and identify and \nrespond to situations \nwhere interactions \nsuggest the need for \nclient referral \n5.1 Manage client \ninteractions \n5.2 Causes of \nclient/customer \ndissatisfaction \n5.3 Assignment \nInstructions \n5.4 Reporting \nprocedures \n \n5.1 Demonstrating \nability to do \nattention to detail \nwhen completing \nclient/employer \ndocumentation \n5.2 Demonstrating the \nability to do \ninterpersonal and \ncommunication \nskills required in \nclient contact \nassignments \n5.3 Demonstrating \nability to do \ncustomer service \nskills required to \nmeet \nclient/customer \nneeds\n\n--- PDF PAGE 44 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n40 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n6. Provide \neffective \nresponses to \nclient \nenquiries \n6.1 Select the most \nappropriate mode of \ncommunication for the \ninformation being \nprovided \n6.2 Use language and \nterminology that the \nclient will understand \n6.3 Present information \nclearly and with \nsufficient detail to meet \nclient needs \nConfirm with client that \nthe information has \nbeen understood and \naddress any \nunresolved issues \n6.1 \nCommon industry \nand company \nservices, problems \nand solutions \n6.2 \nLegal and ethical \ncompany and \nindustry aspects \n6.3 \nClient motivations \nand expectations \n6.4 \nEffective \ncommunication \ntechniques \n6.5 \nIndustry ethics and \npractices \n6.6 \nDetailed product \nand service \nknowledge \n \n6.1 Using \ncommunication \nskills \n6.2 Using language \nskills \n6.3 Using numeracy \nskills \n6.4 Using technology \nskills \n6.5 Relating to \npeople from a \nrange of society, \ncultural and \nethnic \nbackgrounds\n\n--- PDF PAGE 45 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n41 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Personal Presence \n \nMay include: \n1.1 Stance \n1.2 Posture \n1.3 Body Language \n1.4 Demeanor \n1.5  Grooming \n2.  Employer Standards May include: \n2.1 Standing Orders \n2.2 Efficiency  \n2.3 Client turn-around time \n3. Client \nRequirements \nMay include: \n3.1   Assignment instructions (e.g. right products) \n3.2   Post Orders \n3.3   Scope to modify instructions/orders in light of changed \nsituations \n4. \nAssignment \nInstructions \nMay include: \n4.1   Writing \n4.2   Verbally \n4.3   Electronically \n5. Client’s Needs and \nRequirements \nMay include: \n5.1 Review of the client brief and/or assignment \ninstructions \n5.2 Discussion with the client/customer \n6. Appropriate Action \nMay include: \n6.1  Implementing required changes \n6.2  Referral to appropriate employer personnel \n6.3  Clarification of client needs and instructions \n7. \nClients \nMay include: \n7.1    All members of the public\n\n--- PDF PAGE 46 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n42 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1 Maintained a professional image. \n1.2 Interpreted client requirements from information \ncontained in the client brief and/or assignment \ninstructions. \n1.3 Dealt successfully with a variety of client interactions. \n1.4 Monitored and acted on varying client or customer \nneeds. \n1.5 Met client requirements. \n1.6 Built credibility with customers/clients. \n2. Resource \nImplications \n \nThe following resources should be provided: \n2.1 Assessment centers/venues \n2.2 Accredited assessors \n2.3 Evaluation reports \n2.4 Access to a relevant venue, equipment and materials \n2.5 Assignment instructions \n2.6 Logbooks \n2.7 Operational manuals and makers’/customers’ \ninstructions (if relevant) \n2.8 Assessment Instruments, including personal planner \nand assessment record book \n3. Methods of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Test/Examination \n3.2 Demonstration with questioning \n3.3 Observation \n4. Context of \nAssessment \n \n4.1   Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter\n",
