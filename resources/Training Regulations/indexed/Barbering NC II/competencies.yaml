        "source_text": "--- PDF PAGE 69 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n65 \nUNIT OF COMPETENCY : PERFORM BASIC HAIR COLORING \n \n \n \nUNIT CODE \n: SOC514319 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes in the \nperformance of basic hair coloring.  This involves preparing \nand assessing the client, analyzing \nhair, preparing \nappropriate basic coloring products, supplies and materials \nprior to treatment, the actual mixing and application of color \nand practice post service activity. It includes practicing good \nproper and ethical behavior according to code of ethics \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Prepare the \nclient \n1.1 Client is consulted for \npossible skin allergies \nand color options  \n1.2 Client’s hair texture, \ntype, conditions and \nscalp condition are \nanalyzed, identified, \nchecked and recorded \nin accordance with \nbasic hair coloring \nprocedures, DOH, DTI \nand OSH policies and \nguidelines \n1.3 Client is advised to \nremove all personal \njewelry and accessories \n1.4 Client is draped to avoid \nstain in accordance with   \nestablished draping \nprocedures, DOH, DTI \nand OSH policies and \nguidelines \n1.5 When necessary, \nclient’s hair is \nshampooed to remove \ndirt and build-up of \nstyling products and \nensure that the scalp \nwill not be scratched \n1.1 Codes of Ethic \n1.2 Familiarization \nSalon Policies and \nProcedures \n1.3 Familiarization \nclient’s form and \nrecords \n1.4 PD 856 (Sanitation \ncode of the \nPhilippines) \n1.5 RA 9003 (Ecological \nWaste management \nProgram Act of \n2000) \n1.6 DOH and DTI \nProtocol and \nRequirements \n1.7 Occupational Safety \nand Health Policies \nand Guidelines \n1.8 Environment Safety \nRules and \nRegulations \n1.9 Basic Mathematics \n1.10 Client consultatio