elaxing service \nprocedures \n3.8 Following time \nmanagement \n3.9 Acknowledging \nclients complain \n3.10 Complying PD \n856, RA 9003, \nFDA notification, \nDOH, DTI and \nOSH \nrequirements\n\n--- PDF PAGE 101 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n97 \nELEMENT \nPERFORMANCE  \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \nreferred to appropriate \nhealth personnel or \nreferred to appropriate \nhealth personnel \n4.  Perform \npost-service \nactivities \n4.1 Client is advised on \nbody and health care \nmaintenance in \naccordance with type of \nchair manipulative \nrelaxing services and \nprocedures, product \nspecification \n4.2 Supplies, materials, \nmassage products and \nequipment are checked, \ncleaned, sanitized, \nreplenished and stored \nin accordance with type \nof chair manipulative \nrelaxing services product \nspecification, \nmanufacturer’s manual \ninstructions, DOH, DTI \nand OSH policies and \nguidelines \n4.3 Wastes materials are \nsegregated and \ndisposed properly \nfollowing Sanitation \nCode of the Philippines \n4.4 Workplace is cleaned \nand prepared for next \nservice activity \n4.5 Documents are \nrecorded, filed and \nstored in accordance \nwith salon policies and \nprocedures \n \n4.1 \nCode of ethnics \n4.2 \nTime management \n4.3 \nFamiliarization on \nsalon Policies and \nProcedures \n4.4 \nFamiliarization of \nSalon Forms and \nRecords \nProcedures for \nMaintenance and \nInventories of \nSupplies, \nmaterials, Tools, \nManipulative \nRelaxing treatment \nand equipment \n4.5 \nPD 856 (Sanitation \nCode of the Phil’s) \n4.6 \nRA 9003 \n(Ecological Waste \nmanagement \nProgram Act of \n2000) \n4.7 \nFDA Notification \n4.8 \nDOH and DTI \nProtocol and \nRequirements \n4.9 \nOSH requirements \n4.10 Environment \nSafety Rules and \nRegulations \n4.11 Basic Mathematics \n4.12 Body and Health \nCare Maintenance \n4.13 Salon Forms and \nRecords \nProcedures for \nmaintenance and \ninventories of \nSupplies, \nmaterials, Tools, \nManipulative \nRelaxing Products \nand Equipment \n4.13.1  \nSupplies and \nMaterials \n4.1 Following code of \nethics \n4.2 Following salon \npolicies and \nprocedures \n4.3 Advising client \nbody and health \ncare \nmaintenance \n4.4 Following salon \nForm and \nRecords \nProcedures for \nmaintenance and \ninventories for \nsupplies, \nmaterials and \nequipment \n4.5 Checking, \ncleaning, \nrecording, \nsanitizing \nreplenishing and \nstoring supplies, \nmaterials and \nequipment \n4.6 Checking, \ncleaning, \nrecording \nsanitizing, \nsterilizing and \nstoring tools \n4.7 Following and \napplying \nhousekeeping, \nsafekeeping and \n5S \nprinciples/proced\nures \n4.8 Segregating and \ndisposing waste \nmaterials \n4.9 Cleaning and \npreparing \nworkstation \n4.10 Recording filing \nand storing\n\n--- PDF PAGE 102 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n98 \nELEMENT \nPERFORMANCE  \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n4.13.2 \nManipulative \nRelaxing products \n4.13.3  \nTools and \nEquipment \n4.13.4 \nHousekeeping \nProcedures \n4.13.5  \nSafekeeping \nProcedures \n4.13.6 \n5S Principles  \n4.14 Waste materials \n4.15Preparing \nWorkstation \nform, records \nand documents \n4.11 Complying PD \n856 (code \nSanitation of the \nPhilippines), RA \n9003  (Waste \nmanagement \nProgram),FDA \nnotification, \nDOH, DTI and \nOSH policies \nand guidelines\n\n--- PDF PAGE 103 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n99 \n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1 Supplies and Materials \nMay include: \n1.1 \nTowel \n1.2 \nPowder \n2 Type of Chair \nManipulative Relaxing \nServices  \nMay include: \n2.1 \nHead and scalp \n2.2 \nArms and back     \n3 Equipment \nMay include: \n3.1 Client chair (reclining chair) \n3.2 Stool \n4 Manipulative Relaxing \nProducts \nMay include: \n4.1 Lotion \n4.2 Powder \n4.3 Oil \n4.3.1   Aromatic Oil \n           4.3.2   Mentholated Oil \n           4.3.3   Herbal Oil \n5 Personal Protective \nEquipment \n(clothing/materials) \nMay include but not limited to: \n5.1 \nFace Towel \n5.2 \nGauze Mask \n5.3 \nHead Band \n5.4 \nApron \n5.5 \nFace shield \n6 Workstation \nMay include: \n6.1 \nClient chair (reclining chair) \n6.2 \nTowel \n6.3 \nTrolley \n7 Health and Body Condition  May include: \n7.1 \nHeart condition \n7.2 \nBlood pressure \n7.3 \nBone damage \n7.4 \nAny skin related disorder \n8 Manipulative Relaxing   \nMotion \nMay include: \n8.1 \nPressing \n8.2 \nSliding  \n8.3 \nCircular motion \n8.4 \nTapping  \n8.5 \nKneading  \n9 Manipulative Relaxing \nMotion technique  \n \nMay include: \n9.1 \n Soft Pressure \n9.2 \nHard Pressure \n10 Established Chair   \nManipulative Relaxing \nService Procedures \nMay include: \n10.1 SHOULDER \n         Begin with your hands parallel to each other and \nslide them down each side of the spine. in \nmanipulating relaxing technique all the way down \nto lower back and buttocks.  Then slide your hands \nup and all the way to the neck, over the shoulders\n\n--- PDF PAGE 104 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n100 \nVARIABLE \nRANGE \nand down the arms to the fingertips. Repeat this \nmotion at least six times. \n10.2 NECK AND HEAD \n         Maintain contact as you move up the spine to the \nneck.  Using light to moderate kneading work the \nmuscles along the sides and back of the neck, \nfrom the shoulder to the base of the skull and \nbelow the ears.  Pay special attention to the small \nmuscles at the base of the skull before working the \nhead.  Using fingertip strokes, run across the scalp \nfrom forehead to neck.  A zigzag movement with \nthe fingers can be done here, and often provide \nextra stimulation to the scalp as well as \ninvigorating the client.  This should be one minute \nto 90 seconds long. \n         Complete the manipulative relaxing service   with \nseveral relaxing motion from the shoulders to the \nhips a sort of conclusion stroke before helping the \nclient sit up from the chair \n11  Health/Body Care \nMaintenance \nMay include: \n11.1 Body Lotion \n11.2 Healthy Food \n12. Waste Materials \nMay include: \n12.1 Biodegradable  \n12.2 Non-Biodegradable\n\n--- PDF PAGE 105 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n101 \n EVIDENCE GUIDE    \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nConsulted client on the desired type of chair \nmanipulative relaxing services  \n1.2 \nPrepared and used supplies and materials according \nto product specification, DOH and OSH requirements \n1.3 \nManipulative relaxing products are used and applied \nto client in accordance with chair manipulative \nrelaxing procedures, product specification, FDA \nnotification, with DOH and OSH requirements  \n1.4 \nPerformed chair manipulative relaxing procedures \nand applied manipulative relaxing service motion and \ntechnique according to prescribed direction, product \nspecification with DOH and OSH requirements.  \n1.5 \nObserved timeline according to established chair \nmanipulative relaxing procedures, product \nspecification  \n1.6 \nEnsured client’s comfort and safety during the entire \nprocess in accordance with DOH and OSH \nrequirements \n1.7 \nAdvised clients on safety precautions after \nmanipulative relaxing procedures \n1.8 \nAcknowledged and responded to any pain or \ncomplains made by the client \n1.9 \nPerformed post-service activities in accordance with \nsalon management, DOH and OSH requirements \n2 . Resource \nImplications \nThe following resources should be provided: \n2.1  Model \n2.2  Tools, equipment and supplies/materials relevant to \nthe activity to be performed \n2.3    Work area/facilities \n3. Method of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration with Questioning \n3.2    Third-Party Report \n3.3     Portfolio \n4. Context of \nAssessment \n4.1 Competency may be assessed in the simulated work \narea or TESDA accredited assessment center\n",
