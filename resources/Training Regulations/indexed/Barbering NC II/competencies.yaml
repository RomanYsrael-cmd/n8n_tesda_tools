        "source_text": "--- PDF PAGE 78 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n74 \nUNIT OF COMPETENCY : PERFORM BASIC MEN’S HAIRCUTTING \n \n \n \nUNIT CODE \n: SOC514320 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitude in \nperforming basic men’s haircutting.  It involves conducting \nclient consultation, analyzing client’s hair, assessing client ‘s \nneeds, actual cutting of the hair, checking and applying \nfinishing touches and performing post-hair cutting activities. It \nincludes practicing proper and ethical behavior in accordance \nwith code of ethics. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Prepare \n     workstation \n1.1 Appropriate \nsupplies/materials are \nprepared, checked and \nrecorded in accordance \nwith basic men’s hair \ncutting procedures, \nproduct specification \nfollowing FDA \nnotification, DOH, DTI \nand OSH requirement \n1.2 Appropriate \nequipment, are \nprepared, sanitized, \nchecked, set and \nrecorded according to \nmanufacturer’s manual \nof instructions with \nFDA notification, DOH, \nDTI and OSH policies \nand procedures \n1.3 Appropriate \nhaircutting tools are \nchecked prepared \nrecorded, sanitized and \nsterilized in accordance \nwith basic men’s \nhaircutting procedures, \nproducts specification \nfollowing FDA \nnotification, DOH, DTI \nand OSH policies and \nguidelines \n1.4 Personal Protective \nEquipment \n(clothing/materials) is \nused in accordance \nwith hair cutting \n1.1 Code of ethics \n1.2 Familiarization of \nsalon policies and \nprocedures \n1.3 Familiarization of \nForms and Records \nProcedures of \nsupplies, materials, \ntools, cutting tools \nand equipment \n1.4 PD 856 (Sanitation \nCode of the \nPhilippines) \n1.5 RA 9003 (Ecological \nWaste Management \nProgram act of \n2000) \n1.6 FDA Notification \n1.7 DOH and DTI \nProtocol and \nRequirements \n1.8 OSH requirements \n1.9 Environment and \nSafety Regulations \n1.10 Basic Mathematics  \n1.11 Workstation  \n1.12 Salon Form and \nRecords of \nSupplies, materials, \nTools, Cutting tools \nand Equipment \n1.12.1 Supplies and \nMaterial  \n1.12.1.1. Kinds and \nUses \n1.12.1.2 Product \nSpecification/ \nInstruction \n1.1 Following Code \nof Ethics \n1.2 Following salon \npolicies and \nprocedures \n1.3 Following salon \nform and records \nprocedures of \nsupplies, \nmaterials, cutting \ntools, tools and \nequipment \n1.4 Preparing, \nsanitizing, \nchecking and \nrecording \nEquipment \nSupplies and \nmaterials \n1.5 Preparing, \nchecking \nrecording, \nsanitizing and \nsterilizing \nhaircutting tools \n1.6 Following Method \nof Sanitation \n1.7 Preparing, \nchecking and \nproviding \nPersonal \nprotective \nEquipment \n(clothing/ \nmaterials) \n1.8 Preparing \nWorkstation\n\n--- PDF PAGE 79 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n75 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nprocedures, DOH, DTI \nand OSH requirements \n1.5 Work station is \nensured of privacy, \nsafety practices and \ncleanliness in \naccordance with \nestablished procedures \n1.12.2 Tools and \nEquipment  \n1.12.2.1 Kinds and \nUses \n1.12.2.2 \nManufacturer’s \nManual of \nInstructions \n1.12.3 Cutting Tools \n1.12.3.1 Kinds and   \n         Uses \n1.13 Method   \n of Sanitation \n1.14 Kinds of Personal  \n        Protective  \n        Equipment  \n       (clothing/materials) \n1.15 Preparation and  \n        Set up of  \n        workplace \n1.16 Providing PPE  \n        (clothing/materials \n1.9 Following 5S \nPrinciples \n1.10 Complying PD \n856, RA 9003, \nFDA \nnotification, \nDOH, DTI and \nOSH policies \nand guidelines \n \n2.  Prepare \nclient \n2.1 Client consultation is \nperformed in 