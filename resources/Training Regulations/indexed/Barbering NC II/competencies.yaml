r \n5.2 \nShampoo bowl with chair \n5.3 \nTrolley \n5.4 \nTowel \n5.5 \nApron \n5.6 \nCape \n5.7 \nSpray gun \n6 \nHair Condition \nMay include: \n6.1 \nDry \n6.2 \nOily \n6.3 \nNormal \n6.4 \nChemically Treated \n7 \nTexture \nMay include: \n7.1 \nFine \n7.2 \nMedium \n7.3 \nCoarse \n8 \nLength \n \nMay include: \n8.1 \nShort \n8.2 \nMedium \n8.3 \nLong \n9 \nHair Type  \nMay include: \n9.1 \nStraight\n\n--- PDF PAGE 84 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n80 \nVARIABLE \nRANGE \n9.2 \nCurly \n9.3 \nWavy \n9.4 \nFrizzy \n10 \nScalp Condition \nMay include: \n10.1 Oily \n10.2 Normal \n10.3 Dandruff \n10.4 With Irritation \n10.5 Flaking \n10.6 Post chemical service itch \n10.7 With wounds \n10.8 Greasy or waxy \n11 \nShape of Face \n(Primary Shape) \nMay include: \n11.11 Round \n11.12 Square \n11.13 Triangular \n12 \nBuilt of the Client \nMay include: \n12.1 Small \n12.2 Medium \n12.3 Large \n12.4 Extra large \n13 \nHair Catalog  \nMay include: \n13.1 Men’s Cut Catalog \n13.2 Ladies Cut Catalog \n13.3 Kid’s Cut Catalog \n14 \nMen’s Hair Cut Styles  \nMay include:  \n14.1 Barber’s Cut  \n14.1.1 Under cut \n14.1.2 Crew Cut \n14.1.3 Flat Top \n14.1.4 Semi Barbers Cut \n14.1.5 Faded \n14.2 Semi Bald Cut/Skin Head \n14.3 Executive/Corporate Cut \n15 \nEstablished Draping \nProcedures  \nMay include: \n15.1 \nClient is draped with bath towel with horizontal \nedge folded 2 inches outward \n15.2 \nProtective material is wrapped around the neck \n15.3 \nCutting cape is wrapped around the shoulder \n16 Established hair \nshampooing and/or \nconditioning procedures  \nMay include: \n16.1 \nComb/brush hair to free from entanglement before \nactual shampooing and/or conditioning  \n16.2 \nApply amount of shampoo and/or conditioner \naccording to clients’ hair length and volume, and \ntype of service \n16.3 \nApply appropriate water temperature  \n16.4 \nFollow shampooing and/or conditioning technique \nand procedures  