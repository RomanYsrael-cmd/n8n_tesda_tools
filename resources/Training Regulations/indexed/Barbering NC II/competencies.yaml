air \ncoloring \n3.8 Complying PD \n856, RA 9003, \nFDA notification, \nDOH, DTI and \nOccupational\n\n--- PDF PAGE 72 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n68 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nto appropriate health \npersonnel \nEquipment \n(clothing/materials) \nSafety and \nHealth Policies \nand procedures \n4. Perform post-\nservice \nactivities \n4.1 Client is advised on hair \ncare maintenance in \naccordance with basic \nhair coloring procedures \n4.2 Tools, equipment and \nimplements are cleaned, \nsanitized recorded \nreplenished and stored \nin accordance with basic \nhair coloring procedures, \nmanufacturer’s manual \ninstructions DOH, DTI \nand OSH policies and \nguidelines \n4.3 Waste materials are \nsegregated and \ndisposed properly \nfollowing Sanitation \nCode of the Philippines \n4.4 Workplace is cleaned \nand prepared for next \nservice activity \n4.5 Documents are \nrecorded, filed and \nstored in accordance \nwith basic hair coloring \nprocedures \n \n \n4.1 Code of ethics \n4.2 Familiarization of   \nSalon Policies and \nProcedures \n4.3 Familiarization of \nHair Care product \nmaintenance \nSpecifications \n4.4 Familiarization of \nSalon Forms and \nRecords procedures \nfor Inventories and \nmaintenance of \nSupplies materials, \nTools and \nEquipment \n4.5 PD 856 Sanitation \ncode of the \nPhilippines. \n4.6 RA 9003 Waste \nManagement \nprogram  \n4.7 FDA notification  \n4.8 DOH and DTI \nProtocol and \nRequirements \n4.9 Occupational Health \n& Safety Policies \nand Guidelines \n4.10 Environment \nSafety rules and \nregulations \n4.11 Basic Mathematics \n4.12 Hair Care \nMaintenance \nInstruction \n4.13 Salon Forms and \nRecords for \nMaintenance and \nInventories of \nSupplies, \nmaterials, tools \nand equipment \n4.12.1 Tools and \nEquipment \n4.12.2 Supplies \nand Materials \n4.12.3 Coloring \nproducts \n4.1 Following code of \nethics \n4.2 Following salon \npolicies and \nprocedures \n4.3 Applying and \nstyling hair with \nstyling product \n4.4 Advising client on \nhair care \nmaintenance \n4.5 Following salon \nform and records \nprocedures for \nmaintenance and \ninventories of \nsupplies \nmaterials, \ncoloring products, \ntools and \nequipment \n4.6 Cleaning, \nsanitizing, \nrecording \nreplenishing and \nstoring tools \nequipment, \nsupplies and \nmaterials \n4.7 Following \nhousekeeping, \nsafekeeping and \n5S principles/ \nprocedures \n4.8 Segregating and \ndisposing waste \nmaterials \n4.9 Cleaning and \npreparing \nworkplace \n4.10 Recording, filing \nand storing \ndocuments \n4.11 Complying PD \n856, RA 9003, \nFDA \nnotification, \nDOH and\n\n--- PDF PAGE 73 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n69 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.12.4 5S \nPrinciples \n4.12.5  \nHousekeeping \nProcedures \n4.12.6 \nSafekeeping \nProcedures \n4.13 Waste Materials \n4.14 Workstation  \nOccupational \nSafety and \nHealth Policies \nand regulations\n\n--- PDF PAGE 74 ---\nTR – Barbering NC II Revision 01                    \nPromulgated (06/09/2020)             \n70 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nColor Options \nMay include: \n1.1 \nSemi - permanent              \n1.2 \nDemi -Permanent   \n1.3 \nPermanent  \n1.4 \nMetallic dyes  \n2. \nTexture \nMay include: \n2.1 \nFine \n2.2 \nMedium \n2.3 \nCoarse \n3. \nHair Type  \nMay include: \n3.1 \nStraight \n3.2 \nCurly \n3.3 \nWavy \n4. \nHair Conditions \nMay include: \n4.1 \nVirgin \n4.2 \nNormal \n4.3 \nOily \n4.4 \nDry \n4.5 \nPorous \n4.6 \nSensitized \n4.7 \nChemically treated   \n5. \nScalp Condition \nMay include: \n5.1 \nOily \n5.2 \nNormal \n5.3 \nDandruff \n5.4 \nWith Irritation  \n5.5 \nFlaking