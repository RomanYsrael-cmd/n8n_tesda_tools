  "source_text": "COMPETENCY MAP – SOCIAL AND OTHER COMMUNITY DEVELOPMENT SERVICES SECTOR\nBARBERING NC II\nCOMMON\nCOMPETENCIES\nBASIC\nCOMPETENCIES\n\n--- PDF PAGE 170 ---\nTR – Barbering NC III Revision 01\nPromulgated (06/09/2020)\n166\nPerform facial\ncleansing\nPerform temporary\nhair removal activity\nPerform body\nscrub\nPerform pre and\npost hair care\nactivities\nPerform hair and\nscalp treatment\nPerform basic\nhair coloring\nPerform basic\nhair bleaching\nPerform basic\nhair perming\nPerform hair\nstraightening\nPerform basic\nhaircutting\nPerform advanced\nand creative\nhaircutting\nPerform\nadvanced and\ncreative hair\ncoloring\nPerform advanced\nand creative hair\nperming\nPerform basic\nmen’s\nhaircutting\nPerform shave\nand style beard\nand mustache\nPerform chair\nmanipulative\nrelaxing services\nPerform\nmanicure and\npedicure\nPerform hand\nand foot spa\nPerform\npreparatory\nactivities\nPrepare appropriate\nproducts, tools and\nequipment\nPerform nail\nenhancement\ntechnology\nprocedures\nPerform post\nservice activities\nPerform\nadvanced nail\npolish\nprocedures\nApply facial\nmake-up\nPerform body\nbleach\n\nCORE\nCOMPETENCIES\n\n--- PDF PAGE 171 ---\nTR – Barbering NC III Revision 01\nPromulgated (06/09/2020)\n167\nGLOSSARY OF TERMS\n\nAniline\nDerivative\nTints\n-\nare also known as penetrating tints, synthetic, organic tints and\nperoxide or oxidation tints and are commonly called tints in the\nindustry\nBack Combing\n-\ncombing the short hair toward the scalp while the hair strand is held\nin a vertical position also called teasing\nBarbering\n-\nshould be done at eye level starting at the hairline. A method used\nin cutting the hair closed to the scalp and refer to as scissor over\ncomb\nBaseline\n-\nthe first/foundation line to be cut which subsequent sections are\ncut to\nBasic Hair\nShaping\n-\nshaping the hair that is not too long or too short to different head\nshape\nClippers\n-\nelectric razors mostly used to smoothen the back of the neck\nColor Fillers\n-\nare used if the hair is in damaged condition and there is doubt that\nthe color result will be an even shade\nColor Test/Tint\n-\na method of determining the action of color on a small strand of\nhair\nConditioner\n-\ncreams, waxes and oils which help protect and maintain the health\nand condition of the hair\nConditioning\n-\nthe application of special chemical agents to the hair to help restore\nits strength and give it body in order to protect it against possible\nbreakage\nCuticle\n-\nthe outer layer of the hair; the hard skin at the base of the fingernail\nDye\n-\nto color or stain the hair with tint\nElasticity\n-\nthe ability of the hair to stretch and return to its original form without\nbreaking\nEmulsifying\nAgent\n-\na substance used to form an emulsion, e.g. shampoo\nImplements\n-\na tool, utensil or other piece of equipment, especially as used for a\nparticular purpose\nFirst-Aid\n-\nmeans immediate assistance given in case of injury until medical\naid has been obtained\nGuideline\n-\na line to follow when shaping the balance of the hair\nHair Analysis\n-\nan examination to determine the condition of the hair prior to a hair\ntreatment\nHair Cutting\n-\na process of thinning, tapering and shortening the hair into different\nshapes or styles\nMedulla\n-\na hollow pith or core of the hair fiber\nPatch or Skin\nTest\n-\na procedure to test chemical reaction on scalp and skin\nPersonal\nProtective\nEquipment\n-\nmeans any clothing, device or other article that is intended to be\nworn or used by a worker to prevent injury or to facilitate rescue\nShimmering\n-\nshading or tinting parts of the hair to enhance the style\n\n--- PDF PAGE 172 ---\nTR – Barbering NC III Revision 01\nPromulgated (06/09/2020)\n168\nSlithering\n-\ntapering the hair to graduated length with scissors\nStraight Razor\n-\na razor with a rigid steel cutting blade hinged to a case that forms\na handle when the razor is open for use\nOccupational\nSafety & Health\n(OSH)\n-\nis define as the A.) promotion and maintenance of the highest\ndegree of physical, mental and social well-being of workers in all\noccupations B.) prevention among its workers of any departures\nfrom health cause by their working conditions; C.) protection\namong workers in their employment from risks usually from factors\nadverse health and; D.) placing and maintenance of the worker in\nan occupational environment adapted to his/her physiological\nability\nTaper\n-\nto diminish a strand of hair gradually toward the points by cutting.\nRemoving bulk from the ends of the hair\nThinning\n-\nremoving bulk from the hair\nTexture\n-\ncoarseness and fineness of the hair\nTexturizing\n-\nthinning or notching are used to create wispy or spiky effect.\nTrichologists\n-\na person trained in the science of caring for the hair\nTrichology\n-\nthe study of the structure and functions of the hair\nWig\n-\nan artificial covering for the head consisting of interwoven hair\nWorkplace\n-\nrefers to the office. Premises or worksite where a worker is\ntemporary or habitually assigned. Where is no a fixed or definite\nworkplace, the term shall include the place where the worker\nactually performs regular work, or where he regularly reports to\nrender service or to take assignment\n\n--- PDF PAGE 173 ---\nTR – Barbering NC III Revision 01\nPromulgated (06/09/2020)\n169\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) would like to\nextend sincerest thank you and appreciation to the representatives of business, industry,\nacademe and government agencies who provided their time and expertise in the\ndevelopment and validation of this Training Regulations.\n\nTHE TECHNICAL/INDUSTRY EXPERT AND REVIEW PANEL\n\nMANOLITO “Ching” D. DONDONILLA\nTechnical Expert/Member\nPhilippine International Cosmetologists Assn. (PICA)\n\n ANDREW I. GALINDON\nTechnical Expert/Board Member\nPhilippine International Cosmetologists Assn. (PICA)\n\n CRISTINA P. MARPURI\nTechnical Expert/Member\nPhilippine International Cosmetologists Assn. (PICA)\n\nThe PARTICIPANTS in the Validation of this Training Regulation\n\nName\nOrganization/Company\nMary Helen L. Reyes\nReyes Haircutters\nDanilo V. Romero\nReyes Haircutters\nAlejandro S. Dungo\nReyes Haircutters\nMarites R. Del Pilar\nReyes Haircutters\nAndy A. Pasion, Jr.\nAndy Pasion Asia Training Institute Inc.\nMa. Lea D. Ycoy\nAndy Pasion Asia Training Institute Inc.\nEdwin L. Labalan\nEdwin Lisa Brows & Aesthetics\nHarizon C. Olivar\nHarizon “Hanz” Olivar Salon\nNoroddin M. Manuel\nFelicitite Training Center Corporate\nCarla K. Gilhang\nDesigner’s Cave Salon Co.\nGloria R. Katipunan\nDesigner’s Cave Salon Co.\nJanuary C. Donato\nGraciella Beauty Salon\nShaylyn E. Reburiano\nUniminx\nRaul A. Reburiano, Jr.\nUnihair Expressions\nRolando R. Wong\nBeauty Kingdom\nCarmela B. Ocampo\nALS Cabuyao\nEvelyn M. Ebbat\nALS Cabuyao\n\nThe Participants in the National Validation of this Training Regulation\n• Members of the Philippine International Haircutters Association (PIHA)\n• Members of the Philippine International Cosmetologists Association (PICA)\n• Members of the Haircutters and Cosmetologists Association of the Philippines\n(HACAP)\n\n--- PDF PAGE 174 ---\nTR – Barbering NC III Revision 01\nPromulgated (06/09/2020)\n170\nThe Members of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\nQualifications and Standards Office (QSO)\n-\nMS. IMELDA B. TAGANAS, Executive Director\n\n•\nCompetency Standards Development Division\n-\nMS. MA. ISABEL G. GAMUROT, Division Chief\n-\nMR. EDWIN G. MAGLALANG\n-\nMS. BARBARA JANE B. REYES\n\n•\nCompetency Programs and Standards Development Division\n-\nMS. MERCEDES E. JAVIER, Division Chief\n-\nMR. BENEDICTO G. MAAYO\n-\nMR. ADRIAN BRIAN C. SABANAL\n\n--- PDF PAGE 175 ---\nTR – Barbering NC III Revision 01\nPromulgated (06/09/2020)\n171\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nBarbering NC II\nQualification Code:\nSOCBRB220\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./ Date\nDeployment Circular\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument\nCreated\nBarbering NC II\nTBR No. 2010-18\n11/25/2010\nN/A\n01\nDocument\nAmended\nBarbering NC II\nTBR No. 2020-30\n06/09/2020\nTESDA Circular\nNo. 108 series of 2020\nLegend: *Description Types\n-\nDocument Created\n-\nDocument Amended\n-\nDocument Superseded\n\n--- PDF PAGE 176 ---\nTraining Regulation are available in both printed and electronic copies\nfor more information, please contact:\nTechnical Education and Skills Development Authority (TESDA)\nTele Fax No.: 818-7728\nor visit our website: www.tesda.gov.ph",
