reneurial skills Manage and sustain effective communication strategies Manage and sustain high performing teams Evaluate higher order thinking skills and adjust problem solving techniques Advocate strategic thinking for global citizenship Incorporate innovation into work procedures Develop systems in managing and maintaining information Manage implementation of occupational safety and health programs in the workplace Manage implementation of environmental programs in the workplace Develop and sustain a high- performing enterprise Maintain an effective relationship with clients/customers Manage own performance Apply quality standards Maintain a safe, clean and efficient environment COMPETENCY MAP – SOCIAL AND OTHER COMMUNITY DEVELOPMENT SERVICES SECTOR --- PDF PAGE 170 --- TR – Barbering NC III Revision 01 Promulgated (06/09/2020) 166 Perform facial cleansing Perform temporary hair removal activity Perform body scrub Perform pre and post hair care activities Perform hair and scalp treatment Perform basic hair coloring Perform basic hair bleaching Perform basic hair perming Perform hair straightening Perform basic haircutting Perform advanced and creative haircutting Perform advanced and creative hair coloring Perform advanced and creative hair perming Perform basic men’s haircutting Perform shave and style beard and mustache Perform chair manipulative relaxing services Perform manicure and pedicure Perform hand and foot spa Perform preparatory activities Prepare appropriate products, tools and equipment Perform nail enhancement technology procedures Perform post service activities Perform advanced nail polish procedures Apply facial make-up Perform body bleach --- PDF PAGE 171 --- TR – Barbering NC III Revision 01 Promulgated (06/09/2020) 167 Aniline Derivative Tints - are also known as penetrating tints, synthetic, organic tints and peroxide or oxidation tints and are commonly called tints in the industry Back Combing - combing the short hair toward the scalp while the hair strand is held in a vertical position also called teasing Barbering - should be done at eye level starting at the hairline. A method used in cutting the hair closed to the scalp and refer to as scissor over comb Baseline - the first/foundation line to be cut which subsequent sections are cut to Basic Hair Shaping - shaping the hair that is not too long or too short to different head shape Clippers - electric razors mostly used to smoothen the back of the neck Color Fillers - are used if the hair is in damaged condition and there is doubt that the color result will be an even shade Color Test/Tint - a method of determining the action of color on a small strand of hair Conditioner - creams, waxes and oils which help protect and maintain the health and condition of the hair Conditioning - the application of special chemical agents to the hair to help restore its strength and give it body in order to protect it against possible breakage Cuticle - the outer layer of the hair; the hard skin at the base of the fingernail Dye - to color or stain the hair with tint Elasticity - the ability of the hair to stretch and return to its original form without breaking Emulsifying Agent - a substance used to form an emulsion, e.g. shampoo Implements - a tool, utensil or other piece of equipment, especially as used for a particular purpose First-Aid - means immediate assistance given in case of injury until medical aid has been obtained Guideline - a line to follow when shaping the balance of the hair Hair Analysis - an examination to determine the condition of the hair prior to a hair treatment Hair Cutting - a process of thinning, tapering and shortening the hair into different shapes or styles Medulla - a hollow pith or core of the hair fiber Patch or Skin Test - a procedure to test chemical reaction on scalp and skin Personal Protective Equipment - means any clothing, device or other article that is intended to be worn or used by a worker to prevent injury or to facilitate rescue Shimmering - shading or tinting parts of the hair to enhance the style --- PDF PAGE 172 --- TR – Barbering NC III Revision 01 Promulgated (06/09/2020) 168 Slithering - tapering the hair to graduated length with scissors Straight Razor - a razor with a rigid steel cutting blade hinged to a case that forms a handle when the razor is open for use Occupational Safety & Health (OSH) - is define as the A.) promotion and maintenance of the highest degree of physical, mental and social well-being of workers in all occupations B.) prevention among its workers of any departures from health cause by their working conditions; C.) protection among workers in their employment from risks usually from factors adverse health and; D.) placing and maintenance of the worker in an occupational environment adapted to his/her physiological ability Taper - to diminish a strand of hair gradually toward the points by cutting. Removing bulk from the ends of the hair Thinning - removing bulk from the hair Texture - coarseness and fineness of the hair Texturizing - thinning or notching are used to create wispy or spiky effect. Trichologists - a person trained in the science of caring for the hair Trichology - the study of the structure and functions of the hair Wig - an artificial covering for the head consisting of interwoven hair Workplace - refers to the office. Premises or worksite where a worker is temporary or habitually assigned. Where is no a fixed or definite workplace, the term shall include the place where the worker actually performs regular work, or where he regularly reports to render service or to take assignment --- PDF PAGE 173 --- TR – Barbering NC III Revision 01 Promulgated (06/09/2020) 169 The Technical Education and Skills Development Authority (TESDA) would like to extend sincerest thank you and appreciation to the representatives of business, industry, academe and government agencies who provided their time and expertise in the development and validation of this