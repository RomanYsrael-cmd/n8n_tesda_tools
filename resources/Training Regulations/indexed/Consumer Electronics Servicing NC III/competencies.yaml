  "source_section_text": "SECTION 2:\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, and core units\nof competency required for CONSUMER ELECTRONICS SERVICING NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311109\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto lead in the dissemination and discussion of ideas,\ninformation and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1. Appropriate communication method is selected\n1.2. Multiple operations involving several topics areas are\ncommunicated accordingly\n1.3. Questions are used to gain extra information\n1.4. Correct sources of information are identified\n1.5. Information is selected and organized correctly\n1.6. Verbal and written reporting is undertaken when\nrequired\n1.7. Communication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1. Response to workplace issues are sought\n2.2. Response to workplace issues are provided\nimmediately\n2.3. Constructive contributions are made to workplace\ndiscussions on such issues as production, quality and\nsafety\n2.4. Goals/objectives and action plan are undertaken in\nthe workplace are communicated\n3. Identify and\ncommunicate issues\narising in the workplace\n3.1. Issues and problems are identified as they arise\n3.2. Information regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3. Dialogue is initiated with appropriate personnel\n3.4. Communication problems and issues are raised as\nthey arise\n\n--- PDF PAGE 5 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\n--- PDF PAGE 6 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 4\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at\none time\n1.2.\nMade constructive contributions in workplace issues\n1.3.\nSought workplace issues effectively\n1.4.\nResponded to workplace issues promptly\n1.5.\nPresented information clearly and effectively written\nform\n1.6.\nUsed appropriate sources of information\n1.7.\nAsked appropriate questions\n1.8.\nProvided accurate information\n2. Underpinning\nknowledge\n2.1.\nOrganization requirements for written and electronic\ncommunication methods\n2.2.\nEffective verbal communication methods\n3. Underpinning\nSkills\n3.1.\nOrganize information\n3.2.\nUnderstand and convey intended meaning\n3.3.\nParticipate in variety of workplace discussions\n3.4.\nComply with organization requirements for the use\nof written and electronic communication methods\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nVariety of Information\n4.2.\nCommunication tools\n4.3.\nSimulated workplace\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nCompetency in this unit must be assessed through\n5.2.\nDirect Observation\n5.3.\nInterview\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in the workplace or\nin simulated workplace work environment\n\n--- PDF PAGE 7 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 5\n\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\nUNIT CODE\n : 500311110\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1.\nWork requirements are identified and presented to\nteam members\n1.2.\nReasons for instructions and requirements are\ncommunicated to team members\n1.3.\nTeam members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign responsibilities 2.1.\nDuties, and responsibilities are allocated having\nregard to the skills, knowledge and aptitude required\nto properly undertake the assigned task and\naccording to company policy\n2.2.\nDuties are allocated having regard to individual\npreference, domestic and personal considerations,\nwhenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1.\nPerformance expectations are established based on\nclient needs and according to assignment\nrequirements\n3.2.\nPerformance expectations are based on individual\nteam members duties and area of responsibility\n3.3.\nPerformance expectations are discussed and\ndisseminated to individual team members\n4. Supervised team\nperformance\n4.1.\nMonitoring of performance takes place against\ndefined performance criteria and/or assignment\ninstructions and corrective action taken if required\n4.2.\nTeam members are provided with feedback, positive\nsupport and advice on strategies to overcome any\ndeficiencies\n4.3.\nPerformance issues which cannot be rectified or\naddressed within the team are referenced to\nappropriate personnel according to employer policy\n4.4.\nTeam members are kept informed of any changes in\nthe priority allocated to assignments or tasks which\nmight impact on client/customer needs and\nsatisfaction\n4.5.\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6.\nFollow-up communication is provided on all issues\naffecting the team\n4.7.\nAll relevant documentation is completed in\naccordance with company procedures\n\n--- PDF PAGE 8 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 6\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s concerns\n2.1. Roster/shift details\n3. Monitor performance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 9 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 7\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n\n2. Underpinning\nKnowledge\n2.1. Company policies and procedures\n2.2. Relevant legal requirements\n2.3. How performance expectations are set\n2.4. Methods of Monitoring Performance\n2.5. Client expectations\n2.6. Team member’s duties and responsibilities\n3. Underpinning\nSkills\n3.1. Communication skills required for leading teams\n3.2. Informal performance counseling skills\n3.3. Team building skills\n3.4. Negotiating skills\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2. Materials relevant to the proposed activity or task\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context for\nAssessment\n6.1. Competency assessment may occur in workplace or\nany appropriately simulated work environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 10 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 8\n\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required to\ncollect information in order to negotiate to a desired outcome\nand participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan negotiations\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\nInformation on preparing for negotiation is\nidentified and included in the plan\nInformation on creating non verbal environments\nfor positive negotiating is identified and included in\nthe plan\nInformation on active listening is identified and\nincluded in the plan\nInformation on different questioning techniques is\nidentified and included in the plan\nInformation is checked to ensure it is correct and\nup-to- date\n2. Participate in\nnegotiations\n2.1\n\n2.2\n2.3\n\n2.4\n2.5\n\n2.6\n\nCriteria for successful outcome are agreed upon by\nall parties\nDesired outcome of all parties are considered\nAppropriate language is used throughout the\nnegotiation\nA variety of questioning techniques are used\nThe issues and processes are documented and\nagreed upon by all parties\nPossible solutions are discussed and their viability\nassessed\nAreas for agreement are confirmed and recorded\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 11 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 9\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 Self awareness\n1.4.2 Self esteem\n1.4.3 Objectivity\n1.4.4 Empathy\n1.4.5 Respect for others\nInterpersonal skills\n1.5.1 Listening/reflecting\n1.5.2 Non-verbal communication\n1.5.3 Assertiveness\n1.5.4 Behavior labeling\n1.5.5 Testing understanding\n1.5.6 Seeking information\n1.5.7 self disclosing\nAnalytic skills\n1.6.1 Observing differences between content\nand process\n1.6.2 Identifying bargaining information\n1.6.3 Applying strategies to manage process\n1.6.4 Applying steps in negotiating process\n1.6.5 Strategies to manage conflict\n1.6.6 Steps in negotiating process\n1.6.7 Options within organization and externally\nfor resolving conflict\n2. Non verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 12 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 10\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to\nachieve an agreed outcome\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies\nprocedures\n2.4 Problem solving strategies on how to deal with\nunexpected questions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning\nSkills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation\nprocess\n4.2 Human resources (negotiators)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context for\nAssessment\n6.1 Competency to be assessed in real work environment or\nin a simulated workplace setting.\n\n--- PDF PAGE 13 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 11\n\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including the\napplication of problem solving techniques and to determine\nand resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the problem\n1.1. Variances are identified from normal operating\nparameters; and product quality\n1.2. Extent, cause and nature of the problem are\ndefined through observation, investigation and\nanalytical techniques\n1.3. Problems are clearly stated and specified\n2. Determine\nfundamental causes\nof the problem\n2.1. Possible causes are identified based on\nexperience and the use of problem solving tools /\nanalytical techniques.\n2.2. Possible cause statements are developed based\non findings\n2.3. Fundamental causes are identified per results of\ninvestigation conducted\n3. Determine corrective\naction\n3.1. All possible options are considered for resolution\nof the problem\n3.2. Strengths and weaknesses of possible options\nare considered\n3.3. Corrective actions are determined to resolve the\nproblem and possible future causes\n3.4. Action plans are developed identifying\nmeasurable objectives, resource needs and\ntimelines in accordance with safety and operating\nprocedures\n4. Provide\nrecommendation/s to\nmanager\n4.1. Report on recommendations are prepared\naccording to procedures\n4.2. Recommendations are presented to appropriate\npersonnel.\n4.3. Recommendations are followed-up, if required\n\n--- PDF PAGE 14 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 12\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n1.6.\nGant chart, Pert CPM and graphs\n1.7.\nScattergrams\n2. Problem\n\n2.1.\nNon – routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and\nincidents\n3. Action plans\n\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCo-ordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n--- PDF PAGE 15 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 13\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may\nhave happened.\n2. Underpinning\nKnowledge\n2.1.\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2.\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of\nfundamental cause, determining the corrective\naction and provision of recommendations\n2.2.1.\nRelevant equipment and operational\nprocesses\n2.2.2.\nEnterprise goals, targets and measures\n2.2.3.\nEnterprise quality, OHS and environmental\nrequirement\n2.2.4.\nPrinciples of decision making strategies\nand techniques\n2.2.5.\nEnterprise information systems and data\ncollation\n2.2.6.\nIndustry codes and standards\n3. Underpinning\nSkills\n3.1.\nUsing range of formal problem solving techniques\n3.2.\nIdentifying and clarifying the nature of the problem\n3.3.\nDevising the best solution\n3.4.\nEvaluating the solution\n3.5.\nImplementation of a developed plan to rectify the\nproblem\n4. Resource\nImplications\n4.1.\nAssessment will require access to an operating\nplant over an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios /\ncase studies / what ifs will be required as well as\nbank of questions which will be used to probe the\nreason behind the observable action.\n\n--- PDF PAGE 16 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 14\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Case studies on solving problems in the workplace\n5.2. Observation\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n6. Context for\nAssessment\n6.1.\nIn all workplace, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n\n--- PDF PAGE 17 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 15\n\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE : 500311113\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nin the application of mathematical concepts and techniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given\ncondition\n1.2 Mathematical techniques are selected based\non the given problem\n\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on\nthe problem identified\n2.2 Mathematical computations are performed to the\nlevel of accuracy required for the problem\n2.3 Results of mathematical computation is\ndetermined and verified based on job\nrequirements\n3. Analyze results\n3.1 Result of application is reviewed based on\nexpected and required specifications and\noutcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 18 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 16\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical techniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical\ntechniques (e.g. recalculation, re-modeling)\n2.2 Report error to immediate superior for proper\naction\n\n--- PDF PAGE 19 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 17\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Underpinning\nKnowledge\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning\nSkills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 20 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 18\n\nUNIT OF COMPETENCY: USE RELEVANT TECHNOLOGIES\n\nUNIT CODE : 500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and\nattitude\nrequired\nin\nselecting,\nsourcing\nand\napplying\nappropriate and affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Study/select appropriate\ntechnology\n\n1.1 Usage of different technologies is determined\nbased on job requirements\n1.2 Appropriate technology is selected as per work\n specification\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in\ncarrying out function\n2.2 Applicable software and hardware are used as\nper task requirement\n2.3 Management concepts are observed and\npracticed as per established industry practices\n3. Maintain/enhance of\nrelevant technology\n3.1 Maintenance of technology is applied in\naccordance with the industry standard\noperating procedure, manufacturer’s\noperating guidelines and occupational health\nand safety procedure to ensure its operative\nability\n3.2 Updating of technology is maintained through\ncontinuing education or training in accordance\nwith job requirement\n3.3 Technology failure/ defect is immediately\nreported to the concern/responsible person or\nsection for appropriate action\n\n--- PDF PAGE 21 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 19\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance\nschedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 22 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 20\n\nEVIDENCE GUIDE\n\n2 1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nKnowledge\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning\nSkills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context for\nAssessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 23 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 21\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\n: USE HAND TOOLS\nUNIT CODE\n:\nELC724201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes on the safe\nuse, handling and maintenance of tools.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntasks to be undertaken\n1.1. Tasks to be undertaken are properly identified\n1.2. Appropriate hand tools are identified and\nselected according to the task requirements\n2. Prepare hand tools\n2.1. Appropriate hand tools are checked for proper\noperation and safety\n2.2. Unsafe or faulty tools are identified and marked for\nrepair according to standard company procedure\n3. Use appropriate hand\ntools and test equipment\n3.1. Tools are used according to tasks undertaken\n3.2. All safety procedures in using tools are observed\nat all times and appropriate personal protective\nequipment (PPE) are used\n3.3. Malfunctions, unplanned or unusual events are\nreported to the supervisor\n4. Maintain hand tools\n4.1. Tools are handled without damage according to\nprocedures\n4.2. Routine maintenance of tools undertaken\naccording to standard operational procedures,\nprinciples and techniques\n4.3. Tools are stored safely in appropriate locations in\naccordance with manufacturer’s specifications or\nstandard operating procedures\n\n--- PDF PAGE 24 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 22\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hand tools\n1.1.\nHand tools for adjusting, dismantling, assembling,\nfinishing, cutting. Tool set includes the following\nbut not limited to: screw drivers, pliers, punches,\nwrenches, files\n2. Personal Protective\nEquipment (PPE)\n2.1.\nGloves\n2.2.\nProtective eyewear\n2.3.\nApron/overall\n3. Maintenance\n3.1.\nCleaning\n3.2.\nLubricating\n3.3.\nTightening\n3.4.\nSimple tool repairs\n3.5.\nHand sharpening\n3.6.\nAdjustment using correct procedures\n\n--- PDF PAGE 25 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 23\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Demonstrated safe working practices at all times\n1.2. Communicated information about processes,\nevents or tasks being undertaken to ensure a\nsafe and efficient working environment\n1.3. Planned tasks in all situations and reviewed task\nrequirements as appropriate\n1.4. Performed all tasks to specification\n1.5. Maintained and stored tools in appropriate\nlocation\n2. Underpinning\nknowledge\n\n2.1. Safety\n2.1.1.\nSafety requirements in handling tools\n2.2. Tools :\n2.2.1. Function, Operation, Common faults\n2.3. Processes, Operations, Systems\n2.3.1.\nMaintenance of tools\n2.3.2.\nStorage of Tools\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction and numerical skills\n3.2. Communication skills\n3.3. Problem solving in emergency situation\n4. Method of assessment\nCompetency in this unit must be assessed through:\n4.1. Observation\n4.2. Oral questioning\n5. Resource Implication\n5.1. Tools may include the following but not limited to:\n5.1.1.\nscrew drivers\n5.1.2.\npliers\n5.1.3.\npunches\n5.1.4.\nwrenches, files\n6. Context of Assessment\n\n6.1. Assessment may be conducted in the workplace\nor in a simulated work environment\n\n--- PDF PAGE 26 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 24\n\nUNIT TITLE\n:\nPERFORM MENSURATION AND CALCULATION\nUNIT CODE\n: ELC311201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and values\nneeded identify, care, handle and use measuring instruments\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Select measuring\ninstruments\n1.1. Object or component to be measured is\nidentified according to procedures\n1.2. Correct specifications are obtained from relevant\nsource\n1.3. Measuring tools are selected in line with job\nrequirements\n2. Carry out measurements\nand calculation\n2.1. Appropriate measuring instrument is selected\nto achieve required outcome\n2.2. Accurate measurements are obtained for job\n2.3. Calculation needed to complete work tasks are\nperformed using the four basic process of\naddition (+), subtraction (-), multiplication (x),\nand division (/)\n2.4. Calculation involving fractions, percentages and\nmixed numbers are used to complete workplace\ntasks.\n2.5. Numerical computation is checked and corrected\nfor accuracy\n2.6. Instruments are read to the limit of accuracy of\nthe tool.\n3. Maintain measuring\ninstruments\n3.1. Measuring instruments are handled without\ndamage according to procedures\n3.2. Measuring instruments are cleaned before and\nafter using.\n3.3. Proper storage of instruments are undertaken\naccording to manufacturer’s specifications and\nstandard operating procedures.\n\n--- PDF PAGE 27 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 25\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring instruments\n1.1. Straight edge\n1.2. Torque gauge\n1.3. Try square\n1.4. Protractor\n1.5. Combination gauge\n1.6. Steel rule\n2. Calculation\n\nKinds of part mensuration includes the following\nbut not limited to\n2.1. Volume\n2.2. Area\n2.3. Displacement\n2.4. Inside diameter\n2.5. Circumference\n2.6. Length\n2.7. Thickness\n2.8. Outside diameter\n2.9. Taper\n2.10. Out of roundness\n\n--- PDF PAGE 28 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 26\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Selected proper measuring instruments\naccording to tasks\n1.2. Carried out measurement and calculations\n1.3. Maintained and stores instruments\n2. Underpinning knowledge\n2.1. Types of measuring instruments and their uses\n2.2. Safe handling procedures in using measuring\ninstruments\n2.3. Four fundamental operation of mathematics\n2.4. Formula for volume, area, perimeter and other\ngeometric figures\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction\n3.2. Communication skills\n3.3. Handling measuring instruments\n3.4. Performing mathematical calculations using\nthe four fundamental operations\n3.5. Visualizing objects and shapes\n3.6. Interpreting formulae\n4. Method of assessment\nCompetency in this unit must be assessed through:\n\n4.1. Observation\n4.2. Oral questioning\n5. Resource implication\n5.1. Place of assessment\n5.2. Measuring instruments\n5.3. Straight edge\n5.4. Torque gauge\n5.5. Try square\n5.6. Protractor\n5.7. Combination gauge\n5.8. Steel rule\n6. Context of Assessment\n6.1. Assessment may be conducted in the\nworkplace or in a simulated work environment\n\n--- PDF PAGE 29 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 27\n\nUNIT TITLE\n:\nPREPARE AND INTERPRET TECHNICAL DRAWING\nUNIT CODE\n: ELC311202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and values\nneeded to prepare/interpret diagrams, engineering abbreviation\nand drawings, symbols, dimension.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Identify different kinds of\ntechnical drawings\n1.1. Correct technical drawing is selected\naccording to job requirements.\n1.2. Technical drawings are segregated in\naccordance with the types and kinds of\ndrawings\n2. Interpret technical drawing\n2.1. Components, assemblies or objects are\nrecognized as required.\n2.2. Dimensions of the key features of the\nobjects depicted in the drawing are correctly\nidentified.\n2.3. Symbols used in the drawing are identified\nand interpreted correctly.\n2.4. Drawing is checked and validated against job\nrequirements or equipment in accordance\nwith standard operating procedures.\n3. Prepare/make changes to\nelectrical/electronic\nschematics and drawings\n3.1. Electrical/electronic schematic is drawn and\ncorrectly identified.\n3.2. Correct drawing is identified, equipment are\nselected and used in accordance with job\nrequirements.\n4. Store technical drawings and\nequipment /instruments\n4.1. Care and maintenance of drawings are\nundertaken according to company\nprocedures.\n4.2. Technical drawings are recorded and\ninventory is prepared in accordance with\ncompany procedures.\n4.3. Proper storage of instruments is undertaken\naccording to company procedures.\n\n--- PDF PAGE 30 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 28\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technical drawings\nTechnical drawings include the following but not\nlimited to:\n\n1.1. Schematic diagrams\n1.2. Charts\n1.3. Block diagrams\n1.4. Lay-out plans\n1.5. Location plans\n1.6. Process and instrumentation diagrams\n1.7. Loop diagrams\n1.8. System Control Diagrams\n2. Dimensions\nDimensions may include but not limited to:\n\n2.1. Length\n2.2. Width\n2.3. Height\n2.4. Diameter\n2.5. Angles\n3. Symbols\nMay include but not limited to:\n\n3.1. NEC- National Electric Code\n3.2. IEC -International Electrotechnical Commission\n3.3. ASME - American Society of Mechanical\nEngineers\n3.4. IEEE - Institute of Electrical and Electronics\nEngineers\n3.5. ISA - Instrumentation System and Automation\nSociety\n4. Instruments/Equipment\n4.1. Components/dividers\n4.2. Drawing boards\n4.3. Rulers\n4.4. T-square\n4.5. Calculator\n\n--- PDF PAGE 31 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 29\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetencies\nAssessment requires evidence that the candidate:\n\n1.1. Selected correct technical drawing in line with job\nrequirements\n1.2. Correctly identified the objects represented in the\ndrawing\n1.3. Identified and interpreted symbols used in the\ndrawing correctly\n1.4. Prepared/produced electrical/electronic drawings\nincluding all relevant specifications\n1.5. Stored diagrams/equipment\n2. Underpinning\nknowledge\n2.1. Drawing conventions\n2.2. Symbols\n2.3. Dimensioning Conventions\n2.4. Mark up/Notation of Drawings\n2.5. Mathematics\n2.5.1. Four fundamental operations\n2.5.2. Percentage\n2.5.3. Fraction\n2.5.4. Trigonometric Functions\n2.5.5. Algebra\n2.5.6. Geometry\n3. Underpinning skills\n3.1. Reading skills required to interpret work instruction\n3.2. Communication skills\n3.3. Interpreting electrical/electronic signs and symbols\n4. Method of assessment\nCompetency in this unit must be assessed through:\n\n4.1. Practical tasks involving interpretation of a range of\ntechnical drawings\n4.2. Oral questioning\n5. Resource implication\n5.1. Drawings\n5.2. Diagrams\n5.3. Charts\n5.4. Plans\n6. Context of Assessment\nAssessment may be conducted in the workplace or in a\nsimulated work environment\n\n--- PDF PAGE 32 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 30\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\nUNIT CODE\n:\nELC315202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and\nvalues needed to apply quality standards in the workplace.\nThe unit also includes the application of relevant safety\nprocedures and regulations, organization procedures and\ncustomer requirements\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Assess quality of\nreceived materials or\ncomponents\n1.1. Work instructions are obtained and work is carried\nout in accordance with standard operating\nprocedures\n1.2. Received materials or component parts are\nchecked against workplace standards and\nspecifications\n1.3. Faulty material or components related to work are\nidentified and isolated\n1.4. Faults and any identified causes are recorded\nand/or reported to the supervisor concerned in\naccordance with workplace procedures\n1.5. Faulty materials or components are replaced in\naccordance with workplace procedures\n2. Assess own work\n2.1. Documentation relative to quality within the\ncompany is identified and used\n2.2. Completed work is checked against workplace\nstandards relevant to the task undertaken\n2.3. Faulty pieces are identified and isolated\n2.4. Information on the quality and other indicators of\nproduction performance is recorded in accordance\nwith workplace procedures\n2.5. Deviations from specified quality standards,\ncauses are documented and reported in\naccordance with the workplace’ standards\noperating procedures\n3. Engage in quality\nimprovement\n3.1. Process improvement procedures are participated\nin relation to workplace assignment\n3.2. Work is carried out in accordance with process\nimprovement procedures\n3.3. Performance of operation or quality of product or\nservice to ensure customer satisfaction is\nmonitored\n\n--- PDF PAGE 33 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 31\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials/components\n1.1. Materials may include but not limited to:\n1.1.1. Wires\n1.1.2. Cables, soldering lead\n1.1.3. Electrical tape\n1.2. Components may include but not limited to:\n1.2.1. ICs\n1.2.2. Diodes\n2. Faults\nFaults may include but not limited to:\n2.1. Components/materials not according to\nspecification\n2.2. Components/materials contain manufacturing\ndefects\n2.3. Components/materials do not conform with\ngovernment regulation i.e., PEC, environmental\ncode\n2.4. Components/materials have safety defect\n3. Documentation\n3.1. Organization work procedures\n3.2. Manufacturer’s instruction manual\n3.3. Customer requirements\n3.4. Forms\n4. Quality standards\n4.1. Quality standards may relate but not limited to\nthe following:\n4.1.1. Materials\n4.1.2. Component parts\n4.1.3. Final product\n4.1.4. Production processes\n5. Customer\n5.1. Co-worker\n5.2. Supplier\n5.3. Client\n5.4. Organization receiving the product or service\n\n--- PDF PAGE 34 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 32\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Carried out work in accordance with the\ncompany’s standard operating procedures\n1.2. Performed task according to specifications\n1.3. Reported defects detected in accordance with\nstandard operating procedures\n1.4. Carried out work in accordance with the process\nimprovement procedures\n2. Underpinning knowledge\n2.1. Relevant production processes, materials and\nproducts\n2.2. Characteristics of materials/component parts\nused in electronic production processes\n2.3. Quality checking procedures\n2.4. Workplace procedures\n2.5. Safety and environmental aspects of production\nprocesses\n2.6. Fault identification and reporting\n2.7. Quality improvement process\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction\n3.2. Communication skills needed to interpret and\napply defined work procedures\n3.3. Carry out work in accordance with OHS policies\nand procedures\n4. Method of assessment\n4.1. The assessor may select two (2) of the following\nassessment methods to objectively assess the\ncandidate:\n4.1.1. Observation\n4.1.2. Questioning\n4.1.3. Practical demonstration\n5. Resource implication\n\n5.1. Materials and component parts and equipment to\nbe used in a real or simulated electronic\nproduction situation\n6. Context of Assessment\n\n6.1. Assessment may be conducted in the workplace\nor in a simulated environment.\n\n--- PDF PAGE 35 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 33\n\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\nUNIT CODE\n:\nELC311203\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and\nvalues needed to perform computer operations which include\ninputting, accessing, producing and transferring data using the\nappropriate hardware and software\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Plan and prepare\nfor task to be\nundertaken\n1.1. Requirements of task are determined according to job\nspecifications\n1.2. Appropriate hardware and software are selected according\nto task assigned and required outcome\n1.3. Task is planned to ensure OH & S guidelines and\nprocedures are followed\n2. Input data into\ncomputer\n2.1. Data are entered into the computer using appropriate\nprogram/application in accordance with company\nprocedures\n2.2. Accuracy of information is checked and information is saved\nin accordance with standard operating procedures\n2.3. Inputted data are stored in storage media according to\nrequirements\n2.4. Work is performed within ergonomic guidelines\n3. Access\ninformation using\ncomputer\n3.1. Correct program/application is selected based on job\nrequirements\n3.2. Program/application containing the information required is\naccessed according to company procedures\n3.3. Desktop icons are correctly selected, opened and closed\nfor navigation purposes\n3.4. Keyboard techniques are carried out in line with OH & S\nrequirements for safe use of keyboards\n4. Produce/output\ndata using\ncomputer system\n4.1. Entered data are processed using appropriate software\ncommands\n4.2. Data printed out as required using computer\nhardware/peripheral devices in accordance with standard\noperating procedures\n4.3. Files, data are transferred between compatible systems\nusing computer software, hardware/ peripheral devices in\naccordance with standard operating procedures\n5. Maintain computer\nequipment and\nsystems\n5.1. Systems for cleaning, minor maintenance and replacement\nof consumables are implemented\n5.2. Procedures for ensuring security of data, including regular\nback-ups and virus checks are implemented in accordance\nwith standard operating procedures\n5.3. Basic file maintenance procedures are implemented in line\nwith the standard operating procedures\n\n--- PDF PAGE 36 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 34\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and peripheral\ndevices\n1.1. Personal computers\n1.2. Networked systems\n1.3. Communication equipment\n1.4. Printers\n1.5. Scanners\n1.6. Keyboard\n1.7. Mouse\n2. Software\nSoftware include the following but not limited to:\n2.1. Word processing packages\n2.2. Data base packages\n2.3. Internet\n2.4. Spreadsheets\n3. OH & S guidelines\n3.1. OHS guidelines\n3.2.\nEnterprise procedures\n4. Storage media\nStorage media include the following but not limited to:\n4.1. diskettes\n4.2. CDs\n4.3. zip disks\n4.4. hard disk drives, local and remote\n5. Ergonomic guidelines\n5.1. Types of equipment used\n5.2. Appropriate furniture\n5.3. Seating posture\n5.4. Lifting posture\n5.5. Visual display unit screen brightness\n6. Desktop icons\nIcons include the following but not limited to:\n6.1. Directories/folders\n6.2. Files\n6.3. Network devices\n6.4. Recycle bin\n7. Maintenance\n7.1. Creating more space in the hard disk\n7.2. Reviewing programs\n7.3. Deleting unwanted files\n7.4. Backing up files\n7.5. Checking hard drive for errors\n7.6. Using up to date anti-virus programs\n7.7. Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 37 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 35\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Selected and used hardware components\ncorrectly and according to the task requirement\n1.2. Identified and explained the functions of both\nhardware and software used, their general\nfeatures and capabilities\n1.3. Produced accurate and complete data in\naccordance with the requirements\n1.4. Used appropriate devices and procedures to\ntransfer files/data accurately\n1.5. Maintained computer system\n2. Underpinning knowledge\n2.1. Basic ergonomics of keyboard and computer use\n2.2. Main types of computers and basic features of\ndifferent operating systems\n2.3. Main parts of a computer\n2.4. Storage devices and basic categories of memory\n2.5. Relevant types of software\n2.6. General security\n2.7. Viruses\n2.8. OH & S principles and responsibilities\n2.9. Calculating computer capacity\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction\n3.2. Communication skills\n4. Method of assessment\n4.1. The assessor may select two of the following\nassessment methods to objectively assess the\ncandidate:\n4.1.1. Observation\n4.1.2. Questioning\n4.1.3. Practical demonstration\n5. Resource implication\n5.1. Computer hardware with peripherals\n5.2. Appropriate software\n6. Context of Assessment\n6.1. Assessment may be conducted in the workplace\nor in a simulated environment\n\n--- PDF PAGE 38 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 36\n\nUNIT TITLE\n:\nTERMINATE AND CONNECT ELECTRICAL WIRING AND\nELECTRONICS CIRCUIT\nUNIT CODE\n:\nELC724202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, attitudes and values\nneeded to terminate and connect electrical wiring and\nelectronic circuits\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntermination/connection of\nelectrical\nwiring/electronics circuits\n1.1. Materials are checked according to specifications\nand tasks\n1.2. Appropriate tools and equipment are selected\naccording to tasks requirements\n1.3. Task is planned to ensure OH & S guidelines and\nprocedures are followed\n1.4. Electrical wiring/electronic circuits are correctly\nprepared for connecting/termination in accordance\nwith instructions and work site procedures\n2. Terminate/connect\nelectrical wiring/electronic\ncircuits\n2.1. Safety procedures in using tools are observed at all\ntimes and appropriate personal protective\nequipment are used\n2.2. Work is undertaken safely in accordance with the\nworkplace and standard procedures\n2.3. Appropriate range of methods in\ntermination/connection are used according to\nspecifications, manufacturer’s requirements and\nsafety\n2.4. Correct sequence of operation is followed\naccording to job specifications\n2.5. Accessories used are adjusted, if necessary\n2.6. Confirm termination/connection undertaken\nsuccessfully in accordance with job specification\n3. Test\ntermination/connections\nof electrical\nwiring/electronics circuits\n3.1. Testing of all completed termination/ connections of\nelectric wiring/electronic circuits is conducted for\ncompliance with specifications and regulations\nusing appropriate procedures and equipment\n3.2. Wiring and circuits are checked using specified\ntesting procedures\n3.3. Unplanned events or conditions are responded to\nin accordance with established procedures\n\n--- PDF PAGE 39 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 37\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\n1.1 Materials included the following but not limited to:\n1.1.1 Soldering lead\n1.1.2 Cables\n1.1.3 Wires\n2. Tools and equipment\n2.1 Tools for measuring, cutting, drilling,\nassembling/disassembling. Tool set includes the\nfollowing but not limited to:\n2.1.1 Pliers\n2.1.2 Cutters\n2.1.3 Screw drivers\n2.2 Equipment\n2.2.1 Soldering gun\n2.2.2 Multi-tester\n3. Personal protective\nequipment\n3.1 Goggles\n3.2 Gloves\n3.3 Apron/overall\n4. Methods\n4.1 Clamping\n4.2 Pin connection\n4.3 Soldered joints\n4.4 Plugs\n5. Accessories\n5.1 Accessories may include the following but not limited to:\n5.1.1 Brackets\n5.1.2 Clamps\n\n--- PDF PAGE 40 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 38\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n\n1.1. Undertook work safely and according to workplace\nand standard procedures\n1.2. Used appropriate termination/ connection methods\n1.3. Followed correct sequence in termination /\nconnection process\n1.4. Conducted testing of terminated connected\nelectrical wiring/electronic circuits using\nappropriate procedures and standards\n2. Underpinning knowledge\n2.1. Use of tools\n2.2. Use of test instruments/equipment\n2.3. Electrical theory\n2.4. Single phase AC principles\n2.5. Wiring techniques\n2.6. DC power supplies\n2.7. Soldering\n3. Underpinning skills\n3.1. Reading skills required to interpret work instruction\n3.2. Communication skills\n3.3. Soldering techniques\n4. Method of assessment\n4.1. The assessor may select two (2) of the following\nassessment methods to objectively assess the\ncandidate:\n4.1.1. Observation\n4.1.2. Oral Questioning\n4.1.3. Practical demonstration\n5. Resource implication\n5.1. Tools for measuring, cutting, drilling,\nassembling/disassembling, connecting. Tool set\nincludes the following but not limited to:\n5.1.1. Screw drivers\n5.1.2. Pliers\n5.1.3. Cutters\n6. Context of Assessment\n6.1. Assessment may be conducted in the workplace\nor in a simulated environment\n\n--- PDF PAGE 41 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 39\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nCOMMISSION CONSUMER ELECTRONIC PRODUCTS\nAND SYSTEMS\nUNIT CODE\n: ELC724326\nDESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto undertake commissioning of consumer electronic product\nsystems and associated basic circuits, components to\ncomply with predetermined parameters and standards.\n..\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1.\nPlan and prepare\nconsumer electronic\nproducts and\nsystems for\ncommissioning\n\n1.1\nCommissioning procedures are planned and prepared\nbased on OH&S policies and procedures and duplicate work\nis appropriately sequenced in accordance with requirements\n1.2\nAppropriate personnel are consulted to ensure the work is\ncoordinated effectively with others involved in the work site\n1.3\nCommissioning procedures are checked against requirements\n1.4\nMaterials necessary to complete the work are obtained in\naccordance with established procedures and checked\nagainst requirements\n1.5\nTools, equipment and testing devices needed to carry out the\ncommissioning work are obtained in accordance with\nestablished procedures and checked for correct operation and\nsafety\n1.6\nPreparatory work is checked to ensure no unnecessary\ndamage will occurred and process complies with requirements\n2\nCommission\nconsumer electronic\nproducts and\nsystem\n\n2.1\nOH&S policies and procedures are followed\n2.2\nCircuits are checked and isolated where necessary using\nspecified testing procedures\n2.3\nCommissioning activities are performed in accordance with\nrequirements, without damage or distortion to the surrounding\nenvironment or components\n2.4\nUnplanned events or conditions are responded to in\naccordance with established procedures\n2.5\nApproval is obtained from appropriate personnel in\naccordance with established procedures, from appropriate\npersonnel before any contingencies are implemented\n2.6\nOn-going checks of the quality of the work are undertaken in\naccordance with established procedures\n3\nInspect and\ndocument\ncompletion of work\n\n3.1\nFinal inspections and performance checks are undertaken to\nensure that the commissioning procedures of apparatus,\nassociated circuits and components conforms to\nrequirements\n3.2\nWork completion is documented and reported to personnel\nconcerned in accordance with established procedures\n\n--- PDF PAGE 42 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 40\n\nRANGE OF VARIABLES\n\n1. Commissioning\nprocedures\nMay include but not limited to:\n1.1 Inspection\n1.2 Testing\n2. OH&S policies\nand procedures\nArrangements of an organization or enterprise to meet their legal\nand ethical obligations of ensuring that the workplace is safe and\nwithout risk to health. This may include:\n2.1 Hazard and risk assessment mechanisms\n2.2 Implementation of safety regulations\n2.3 Safety training\n2.4 Safety systems incorporating,\n2.4.1\nWork clearance procedures\n2.4.2\nIsolation procedures\n2.4.3\nGas and vapor\n2.4.4\nMonitoring/testing procedures\n2.4.5\nUse of protective equipment and clothing\n2.5 Use of codes of practice\n\n3. Appropriate\nperson\nIndividuals with responsibilities for co-ordination, design installation,\nmaintenance, production, or servicing activities may include:\n3.1 Site managers\n3.2 Project managers\n3.3 Engineers and technicians\n3.4 Technical experts\n3.5 Line managers/supervisors\n3.6 Regulatory personnel\n3.7 Team leaders\n3.8 Other personnel designated by an organization or enterprise\n\n4. Established\nprocedures\nFormal arrangements of an organization, enterprise or statutory\nauthority on task performances.\n4.1 Quality assurance systems incorporating, for example:\n4.1.1\nSpecifications, requirements and procedures\n4.1.2\nWork orders / instructions\n4.1.3\nReporting procedures\n4.1.4\nImprovement mechanisms\n4.1.5\nCompliance requirements\n4.1.6\nSafety management\n4.2 Work clearance systems incorporating, for example:\n4.2.1\nWork permits\n4.2.2\nMonitoring and clearance procedures\n4.2.3\nIsolation procedures\n4.3 OH&S practices\n4.4 Procedures for operating safety systems, operating plant\nand equipment and reporting work activities\n4.5 Maintenance, modification or supply of relevant schematic\ndrawings and technical data\n4.6 Arrangements for dealing with emergency situations.\n\n--- PDF PAGE 43 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 41\n\n5. Unplanned\nevents or\nconditions\nMay include but not limited to:\n5.1 Accidents/incidents\n5.2 Brownout\n5.3 Equipment breakdown\n5.4 Force majeure e.g., earthquake, fire, typhoon\n6. Requirements\nRequirements may include:\n6.1 Statutory regulations\n6.2 Codes of practice\n6.3 Job specifications\n6.4 Procedures and work instructions\n6.5 Quality assurance systems\n6.6 Manufacturers’ specifications\n6.7 Maintenance manuals, schedules and specifications/\nstandards\n6.8 Circuit/cable schedules\n6.9 Design specifications\n6.10 Customer/client requirements and specifications\n6.11 National and State guidelines , policies and imperatives\nrelating to the environment\n7. Environmental\nRequirements\n7.1 Proper disposal of chemicals equipment and components\nshall be based on existing requirements of the law and\nchemicals waste management\n7.2 Non-biodegradable parts of materials shall be packed and\nlabeled properly for disposal.\n\n--- PDF PAGE 44 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 42\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Planned commissioning procedures in line with job\nrequirements\n1.2 Prepared/obtained materials, PPE, tools, equipment and\ntesting devices in line with established procedures\n1.3 Demonstrated compliance with safety regulations\napplicable to worksite operations\n1.4 Performed commissioning activities in line with established\nprocedures and job requirements\n1.5 Performed final inspection to ensure commissioning\nelectrical system meet job requirements\n1.6 Documented and reported completion of work to supervisor\nin line with established procedures\n1.7 Communicated effectively with others to ensure safe and\neffective work operations\n\n2. Underpinning\nknowledge and\nattitude\n2.1. Blueprint diagram reading\n2.2. Use of schematic diagram and interpreting schematic\nsymbols\n2.3. System and processes\n2.3.1. Troubleshooting analysis\n2.3.2. Fundamentals of electronics\n2.3.3. Fundamentals of Computer operation\n2.3.4. Fundamentals of microprocessors/microcontroller\n2.3.5. Fundamentals of building wiring\n2.3.6. Fundamentals of electromagnetic compatibility\n2.4. Operation of different consumer electronic products and\nsystems and accessories\n2.5. Safety\n2.5.1. Work safety requirements and economy of\nmaterials with durability\n2.5.2. Knowledge in 5S application and observation of\nrequired timeframe\n2.6. Materials, Tools and Equipment: Uses and Specifications\n2.6.1. Soldering materials adhesives and insulation\n2.6.2. Identification of appropriate tools, equipment and\ndevices\n2.7. Applied mathematics\n2.8. Laws and regulations\n2.8.1. RA 9292\n2.8.2. NTC Memorandum Circulars\n2.8.3. Local Ordinance\n2.8.4. DTI Regulations\n2.8.5. Philippine Electrical code\n2.8.6. Philippine Electronic code\n\n--- PDF PAGE 45 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 43\n\n3. Underpinning skills\n3.1. Work efficiency\n3.2. Communication skills in interpreting service manual and\ndealing with the client\n3.3. Troubleshooting technique and applied solutions in\nrepairing consumer electronic product and system\n3.4. Skills in the use and maintenance of test instruments,\ntools and equipment\n3.5. Applying work safety practices and time management\n3.6. Skills in operation of basic computer software application\n3.7. Interpreting schematic diagrams in relation to job\nrequirements\n4. Resource\nimplications\nIncludes but not limited to:\n4.1. Tools, equipment and test instruments\n4.2. Working table/bench\n4.3. Electronic supplies\n4.4. Diagram/manuals and other repair references of\nconsumer electronic product and systems\n4.5. Personal protective equipment (PPE)\n5. Method of\nassessment\nThe assessor must select at least two of the following\nassessment methods to objectively assess the candidate:\n5.1. Direct observation of application to tasks and questions\nrelated to underpinning knowledge\n5.2. Interview/ Oral questioning\n5.3. Case study/ Written Report\n5.4. Portfolio\n5.5. Third Party Report\n6. Context of\nassessment\n6.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 46 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 44\n\nUNIT OF COMPETENCY :\nDEVELOP SERVICING SYSTEMS FOR CONSUMER\nELECTRONIC PRODUCTS\nUNIT CODE\n: ELC724327\nDESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto develop servicing systems for consumer electronic\nproducts and associated circuits, including service\nschedules.\nELEMENTS\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1. Plan and prepare\nservicing system\n\n1.1 OH&S policies and procedures to be followed are planned and\nprepared, and work is sequence in accordance with requirements\n1.2 Appropriate personnel are consulted to ensure the programs for\nservicing and maintenance are coordinated effectively with others\ninvolved in the work site\n1.3 Programs to be developed for servicing and maintenance are\nchecked against job requirements\n1.4 Materials necessary to complete the work are identified and detailed\nin accordance with established procedures and checked against\njob requirements\n1.5 Tools, equipment and testing instruments needed to carry out the\nwork are identified and detailed in accordance with established\nprocedures\n\n2. Implement\nservicing system\n\n2.1 Normal function of consumer electronics products and\nassociated circuits are ascertained and detailed in accordance with\nrequirements\n2.2 Circuits isolation and specified testing procedures are detailed\nwhere necessary\n2.3 Servicing system on a trial basis is implemented\n2.4 Response to unplanned events or conditions in accordance with\nestablished procedures are detailed\n2.5 Approval to implement contingencies in accordance with\nestablished procedures from appropriate personnel are detailed\n2.6 Consumer electronic products and associated circuit servicing and\nmaintenance is implemented in accordance with requirements\n2.7 Identify and organize technique and approached for maintenance of\nservicing\n\n3. Evaluate and\ndocument\nservicing system\n\n3.1 Adjustments are made in accordance with established procedures,\nwhere necessary, to return apparatus and associated circuits to\nnormal operating conditions\n3.2 Faulty component(s) are rectified or replaced, without damage or\ndistortion to the surrounding environment\n3.3 On-going checks of the quality of the work are undertaken in\naccordance with established procedures\n3.4 Consumer electronic products and associated circuits are tested to\nensure safety of the installation\n3.5 Consumer electronic products and associated circuits are serviced\nin accordance with established procedures\n\n--- PDF PAGE 47 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 45\n\nRANGE OF VARIABLES\n\n1. OH&S policies and\nprocedures\nArrangements of an organization or enterprise to meet the legal\nand ethical obligations of ensuring that the workplace is safe and\nwithout risk to health. This may include:\n1.1 Hazardous and risk assessment mechanisms\n1.2 Implementation of safety regulations\n1.3 Safety training\n1.4 Safety systems incorporating,\n1.4.1\nWork clearance procedures\n1.4.2\nIsolation procedures\n1.4.3\nGas and vapor\n1.4.4\nMonitoring/testing procedures\n1.4.5\nUse of protective equipment and clothing\n1.5 Use of codes of practice\n2\nRequirements\nRequirements may include:\n2.1 Statutory regulations\n2.2 Codes of practice\n2.3 Job specifications\n2.4 Transport documentation\n2.5 Standards called-up in specifications\n2.6 Procedures and work instructions\n2.7 Quality assurance systems\n2.8 Manufacturers’ specifications\n2.9 Maintenance manuals, schedules and\nspecifications/standards\n2.10 Circuit/cable schedules\n2.11 Design specifications\n2.12 Customer/client requirements and specifications\n2.13 specified underpinning knowledge (specified in units’\nEvidence Guides)\n2.14 National and State guidelines , policies and imperatives\nrelating to the environment\n3\nAppropriate\npersonnel\nIndividuals with responsibilities for co-ordination, design\ninstallation, maintenance, production, or servicing activities may\ninclude:\n3.1 Site managers\n3.2 Project managers\n3.3 Engineers and technicians\n3.4 Technical experts\n3.5 Line managers/supervisors\n3.6 Regulatory personnel\n3.7 Team leaders\n3.8 Other personnel designated by an organization or\nenterprise\n\n--- PDF PAGE 48 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 46\n\n4\nEstablished\nprocedures\nFormal arrangements of an organization, enterprise or\nstatutory authority of how work is to be done. These may\ninclude, for example:\n4.1 Quality assurance systems incorporating, for example:\n4.1.1 Specifications, requirements and procedures\n4.1.2 Work orders / instructions\n4.1.3 Reporting procedures\n4.1.4 Improvement mechanisms\n4.1.5 Compliance requirements\n4.1.6 Safety management\n4.2 Work clearance systems incorporating, for example:\n4.2.1 Work permits\n4.2.2 Monitoring and clearance procedures\n4.2.3 Isolation procedures\n4.3 OH&S practices\n4.4 Procedures for operating safety systems, operating plant\nand equipment and reporting work activities\n4.5 Maintenance, modification or supply of relevant schematic\ndrawings and technical data\n4.6 Arrangements for dealing with emergency situations.\n\n5\nConsumer\nelectronics\nproducts\n5.1 Audio/Video products and systems\n5.2 Cellular phones\n5.3 Electrically controlled domestic appliances\n\n6\nUnplanned events\nor conditions\nMay include but not limited to:\n6.1 Accidents/incidents\n6.2 Brownout\n6.3 Equipment breakdown\n6.4 Force majeure e.g., earthquake, fire, typhoon\n\n--- PDF PAGE 49 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 47\n\nEVIDENCE GUIDE\n1\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Planned and prepared the servicing and maintenance\nsystem in accordance with OH&S policies and procedures\n1.2. Checked programs to be developed for servicing and\nmaintenance according to job requirements\n1.3. Identified and detailed tools, equipment and materials\nneeded to carry out work as specified in the user’s manual\nand established procedures\n1.4. Implemented consumer electronic products and\nassociated circuit servicing and maintenance in\naccordance with requirements\n1.5. Maintained records and documentation of servicing and\nmaintenance activities\n1.6. Reported quality management issues and responses in\naccordance with established procedures\n2\nUnderpinning\nknowledge and\nattitude\n2.1. Read blueprint diagram block diagram\n2.2. Use of schematic diagram and interpreting schematic\nsymbols and process flow\n2.3. System and process\n2.3.1. Fundamentals of maintaining and servicing Audio-\nVideo products and systems\n2.3.2. Fundamentals of maintaining in electronically\ncontrolled domestic appliances\n2.3.3. Fundamentals of maintaining cellular phones\n2.4. Safety\n2.4.1. Work safety requirements and economy of\nmaterials with durability\n2.4.2. Knowledge in 5S application and observation of\nrequired timeframe\n2.5. Materials, Tools and Equipment: Uses and Specifications\n2.5.1. Materials soldering adhesives and insulation\n2.5.2. Identification of appropriate tools, equipment and\ndevices\n2.6. Applied mathematics\n2.7. Laws and regulations\n2.7.1. RA 9292\n2.7.2. NTC Memorandum Circulars\n2.7.3. Local Ordinance\n2.7.4. DTI Regulations\n2.7.5. Philippine Electronics code\n2.7.6. Philippine Electrical code\n\n--- PDF PAGE 50 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 48\n\n3\nUnderpinning skills\n3.1. Work efficiency\n3.2. Communication skills in interpreting service manual and\ndealing with the client\n3.3. Troubleshooting techniques and applied solutions in\nrepairing consumer electronic products and systems\n3.4. Skills in the use and maintenance of test instruments,\ntools and equipment\n3.5. Application of work safety practices and time management\n3.6. Skills in operation of basic computer software application\n3.7. Drawing and interpreting schematic block diagrams and\nflowcharts relative to work flow\n4\nResource\nimplications\nIncludes but not limited to:\n4.1. Working table/bench\n4.2. Sufficient lighting and ventilation system\n4.3. Electronic supplies\n4.4. Diagram/manuals and other repair references of different\ncellular phone models\n5\nMethod of\nassessment\nThe assessor must select at least two of the following\nassessment methods to objectively assess the candidate:\n5.1. Direct observation of application to tasks and questions\nrelated to underpinning knowledge\n5.2. Case study/written report\n5.3. Portfolio\n5.4. Third Party Report\n6\nContext of\nassessment\n6.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 51 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 49\n\nUNIT OF COMPETENCY :\nTRAIN SERVICE TECHNICIANS\nUNIT CODE\n:\nELC724328\nDESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to train service technicians and apprentices.\n.\nELEMENTS\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1. Plan and prepare\ntraining activities\n\n1.1\nRequired tools, materials and equipment are prepared\nin the worksite.\n1.2\nStage of development is determined from discussion\nwith the service technician, observation of the service\ntechnician and/or a formal assessment being carried out\n1.3\nMeasures are taken to ensure that the service\ntechnician understands OH&S requirements and safe\nworking procedures and practices for the particular\nworksite and the activities to be undertaken\n1.4\nPreparation for particular training includes deciding\nwhich activities are to be undertaken by the service\ntechnician and the level of supervision is planned\n1.5\nConfirmation from the service technician is sought\nregarding the level of understanding of the training\nactivity to be performed\n2. Guide/mentor\nservice\ntechnicians\n\n2.1\nService technician is provided with clear instructions on\nthe work to be done and the respective responsibilities\nassociated with the work and others who are involved\n2.2\nService technician is guided/mentored and stage\ncheck is made at a level appropriate to the stage of\ndevelopment in accordance with industry standards\n2.3\nMeasures are taken to ensure that the service\ntechnician completes relevant documentation of the\nwork performed in accordance with established\nprocedures\n3 Document and\nprovide feedback\n\n3.1\nService technician’s progress is monitored in\naccordance with established procedures and\ndocumentation requirements\n3.2\nWork activities and assessment undertaken are\ndocumented and verified in accordance with established\nprocedures\n3.3\nAssessment feedback is provided to service technician\nand training evaluation report is submitted to\nresponsible person\n\n--- PDF PAGE 52 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 50\n\nRANGE OF VARIABLES\n\n1\nOH&S policies and\nprocedures\nArrangements of an organization or enterprise to meet their\nlegal and ethical obligations of ensuring the workplace is safe\nand without risk to health. This may include:\n1.1 Hazardous and risk assessment mechanisms\n1.2 Implementation of safety regulations\n1.3 Safety training\n1.4 Safety systems incorporating,\n1.4.1\nWork clearance procedures\n1.4.2\nIsolation procedures\n1.4.3\nGas and vapor\n1.4.4\nMonitoring/testing procedures\n1.4.5\nUse of protective equipment and clothing\n1.5 Use of codes of practice\n\n2\nTraining\n2.1 Knowledge training\n2.2 Skills training\n2.3 Attitudinal & work value training\n3\nMeasures\n3.1 Coaching\n3.2 Instructions\n3.3 Demonstrating\n3.4 Assessing\n4\nEstablished\nprocedures\nFormal arrangements of an organization, enterprise or\nstatutory authority of how work is to be done. These may\ninclude:\n4.1 Quality assurance systems incorporating, for example:\n4.1.1 Specifications, requirements and procedures\n4.1.2 Work orders / instructions\n4.1.3 Reporting procedures\n4.1.4 Improvement mechanisms\n4.1.5 Compliance requirements\n4.1.6 Safety management\n4.2 Work clearance systems incorporating, for example:\n4.2.1 Work permits\n4.2.2 Monitoring and clearance procedures\n4.2.3 Isolation procedures\n4.3 OH&S practices\n4.4 Procedures for operating safety systems, operating plant\nand equipment and reporting work activities\n4.5 Maintenance, modification or supply of relevant\nschematic drawings and technical data\n4.6 Arrangements for dealing with emergency situations.\n\n--- PDF PAGE 53 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 51\n\n5\nDocumentation\nrequirements\nRequirements may include:\n5.1\nGANTT chart\n5.2\nProgress chart/report\n5.3\nTraining evaluation report\n5.4\nTraining plan\n\n--- PDF PAGE 54 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 52\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nPlanned and prepared the training activities\n1.2.\nGuided/mentored the service technician\n1.3.\nMonitored and checked the performance of the service\ntechnician\n1.4.\nDocument the performance of the service technician\n1.5.\nProvided feedback to the service technician and training\nevaluation report is submitted to the responsible person\n2. Underpinning\nknowledge and\nattitude\n2.1.\nFundamentals of maintaining and servicing audio-video\nproducts and systems\n2.2.\nFundamentals of maintaining and servicing cellular\nphones\n2.3.\nFundamentals of maintaining and servicing of\nelectronically-controlled domestic appliances\n2.4.\nFundamentals of coaching and mentoring\n2.5.\nTheories of adult learning\n2.6.\nMethods of teaching\n\n3. Underpinning skills\n3.1.\nCommunicate effectively with trainees\n3.2.\nApplying effective techniques of coaching and mentoring\n3.3.\nDemonstrate skills in maintaining and servicing\n