        "source_text": "ELC724327\nDESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto develop servicing systems for consumer electronic\nproducts and associated circuits, including service\nschedules.\nELEMENTS\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1. Plan and prepare\nservicing system\n\n1.1 OH&S policies and procedures to be followed are planned and\nprepared, and work is sequence in accordance with requirements\n1.2 Appropriate personnel are consulted to ensure the programs for\nservicing and maintenance are coordinated effectively with others\ninvolved in the work site\n1.3 Programs to be developed for servicing and maintenance are\nchecked against job requirements\n1.4 Materials necessary to complete the work are identified and detailed\nin accordance with established procedures and checked against\njob requirements\n1.5 Tools, equipment and testing instruments needed to carry out the\nwork are identified and detailed in accordance with established\nprocedures\n\n2. Implement\nservicing system\n\n2.1 Normal function of consumer electronics products and\nassociated circuits are ascertained and detailed in accordance with\nrequirements\n2.2 Circuits isolation and specified testing procedures are detailed\nwhere necessary\n2.3 Servicing system on a trial basis is implemented\n2.4 Response to unplanned events or conditions in accordance with\nestablished procedures are detailed\n2.5 Approval to implement contingencies in accordance with\nestablished procedures from appropriate personnel are detailed\n2.6 Consumer electronic products and associated circuit servicing and\nmaintenance is implemented in accordance with requirements\n2.7 Identify and organize technique and approached for maintenance of\nservicing\n\n3. Evaluate and\ndocument\nservicing system\n\n3.1 Adjustments are made in accordance with established procedures,\nwhere necessary, to return apparatus and associated circuits to\nnormal operating conditions\n3.2 Faulty component(s) are rectified or replaced, without damage or\ndistortion to the surrounding environment\n3.3 On-going checks of the quality of the work are undertaken in\naccordance with established procedures\n3.4 Consumer electronic products and associated circuits are tested to\nensure safety of the installation\n3.5 Consumer electronic products and associated circuits are serviced\nin accordance with established procedures\n\n--- PDF PAGE 47 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 45\n\nRANGE OF VARIABLES\n\n1. OH&S policies and\nprocedures\nArrangements of an organization or enterprise to meet the legal\nand ethical obligations of ensuring that the workplace is safe and\nwithout risk to health. This may include:\n1.1 Hazardous and risk assessment mechanisms\n1.2 Implementation of safety regulations\n1.3 Safety training\n1.4 Safety systems incorporating,\n1.4.1\nWork clearance procedures\n1.4.2\nIsolation procedures\n1.4.3\nGas and vapor\n1.4.4\nMonitoring/testing procedures\n1.4.5\nUse of protective equipment and clothing\n1.5 Use of codes of practice\n2\nRequirements\nRequirements may include:\n2.1 Statutory regulations\n2.2 Codes of practice\n2.3 Job specifications\n2.4 Transport documentation\n2.5 Standards called-up in specifications\n2.6 Procedures and work instructions\n2.7 Quality assurance systems\n2.8 Manufacturers’ specifications\n2.9 Maintenance manuals, schedules and\nspecifications/standards\n2.10 Circuit/cable schedules\n2.11 Design specifications\n2.12 Customer/client requirements and specifications\n2.13 specified underpinning knowledge (specified in units’\nEvidence Guides)\n2.14 National and State guidelines , policies and imperatives\nrelating to the environment\n3\nAppropriate\npersonnel\n