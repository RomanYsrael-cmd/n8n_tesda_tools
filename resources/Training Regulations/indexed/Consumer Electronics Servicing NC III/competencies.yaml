        "source_text": "ELC724328\nDESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to train service technicians and apprentices.\n.\nELEMENTS\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1. Plan and prepare\ntraining activities\n\n1.1\nRequired tools, materials and equipment are prepared\nin the worksite.\n1.2\nStage of development is determined from discussion\nwith the service technician, observation of the service\ntechnician and/or a formal assessment being carried out\n1.3\nMeasures are taken to ensure that the service\ntechnician understands OH&S requirements and safe\nworking procedures and practices for the particular\nworksite and the activities to be undertaken\n1.4\nPreparation for particular training includes deciding\nwhich activities are to be undertaken by the service\ntechnician and the level of supervision is planned\n1.5\nConfirmation from the service technician is sought\nregarding the level of understanding of the training\nactivity to be performed\n2. Guide/mentor\nservice\ntechnicians\n\n2.1\nService technician is provided with clear instructions on\nthe work to be done and the respective responsibilities\nassociated with the work and others who are involved\n2.2\nService technician is guided/mentored and stage\ncheck is made at a level appropriate to the stage of\ndevelopment in accordance with industry standards\n2.3\nMeasures are taken to ensure that the service\ntechnician completes relevant documentation of the\nwork performed in accordance with established\nprocedures\n3 Document and\nprovide feedback\n\n3.1\nService technician’s progress is monitored in\naccordance with established procedures and\ndocumentation requirements\n3.2\nWork activities and assessment undertaken are\ndocumented and verified in accordance with established\nprocedures\n3.3\nAssessment feedback is provided to service technician\nand training evaluation report is submitted to\nresponsible person\n\n--- PDF PAGE 52 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 50\n\nRANGE OF VARIABLES\n\n1\nOH&S policies and\nprocedures\nArrangements of an organization or enterprise to meet their\nlegal and ethical obligations of ensuring the workplace is safe\nand without risk to health. This may include:\n1.1 Hazardous and risk assessment mechanisms\n1.2 Implementation of safety regulations\n1.3 Safety training\n1.4 Safety systems incorporating,\n1.4.1\nWork clearance procedures\n1.4.2\nIsolation procedures\n1.4.3\nGas and vapor\n1.4.4\nMonitoring/testing procedures\n1.4.5\nUse of protective equipment and clothing\n1.5 Use of codes of practice\n\n2\nTraining\n2.1 Knowledge training\n2.2 Skills training\n2.3 Attitudinal & work value training\n3\nMeasures\n3.1 Coaching\n3.2 Instructions\n3.3 Demonstrating\n3.4 Assessing\n4\nEstablished\nprocedures\nFormal arrangements of an organization, enterprise or\nstatutory authority of how work is to be done. These may\ninclude:\n4.1 Quality assurance systems incorporating, for example:\n4.1.1 Specifications, requirements and procedures\n4.1.2 Work orders / instructions\n4.1.3 Reporting procedures\n4.1.4 Improvement mechanisms\n4.1.5 Compliance requirements\n4.1.6 Safety management\n4.2 Work clearance systems incorporating, for example:\n4.2.1 Work permits\n4.2.2 Monitoring and clearance procedures\n4.2.3 Isolation procedures\n4.3 OH&S practices\n4.4 Procedures for operating safety systems, operating plant\nand equipment and reporting work activities\n4.5 Maintenance, modification or supply of relevant\nschematic drawings and technical data\n4.6 Arrangements for dealing with emergency situations.\n\n--- PDF PAGE 53 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 51\n\n5\nDocumentation\nrequirements\nRequirements may include:\n5.1\nGANTT chart\n5.2\nProgress chart/report\n5.3\nTraining evaluation report\n5.4\nTraining plan\n\n--- PDF PAGE 54 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 52\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nPlanned and prepared the training activities\n1.2.\nGuided/mentored the service technician\n1.3.\nMonitored and checked the performance of the service\ntechnician\n1.4.\nDocument the performance of the service technician\n1.5.\nProvided feedback to the service technician and training\nevaluation report is submitted to the responsible person\n2. Underpinning\nknowledge and\nattitude\n2.1.\nFundamentals of maintaining and servicing audio-video\nproducts and systems\n2.2.\nFundamentals of maintaining and servicing cellular\nphones\n2.3.\nFundamentals of maintaining and servicing of\nelectronically-controlled domestic appliances\n2.4.\nFundamentals of coaching and mentoring\n2.5.\nTheories of adult learning\n2.6.\nMethods of teaching\n\n3. Underpinning skills\n3.1.\nCommunicate effectively with trainees\n3.2.\nApplying effective techniques of coaching and mentoring\n3.3.\nDemonstrate skills in maintaining and servicing\nconsumer electronic products and system\n3.4.\nDemonstrate positive work values and attitudes\n3.5.\nEffectively deliver training in accordance to training plan\n3.6.\nDevelop training plan/lesson plan\n3.7.\nPerform trainee evaluation\n4. Resource\nimplications\nIncludes but not limited to:\n4.1. Writing table/bench\n4.2. Personal computer\n5. Method of\nassessment\nThe assessor must select at least two of the following\nassessment methods to objectively assess the candidate:\n5.1. Direct observation of application to tasks and questions\nrelated to underpinning knowledge\n5.2. Case study/written report\n5.3. Portfolio\n5.4. Third Party Report\n6. Context of\nassessment\n6.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 55 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 53"
      }
