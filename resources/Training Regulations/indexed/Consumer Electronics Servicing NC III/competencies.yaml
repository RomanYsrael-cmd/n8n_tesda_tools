          "source_text": "s)\n2.14 National and State guidelines , policies and imperatives\nrelating to the environment\n3\nAppropriate\npersonnel\nIndividuals with responsibilities for co-ordination, design\ninstallation, maintenance, production, or servicing activities may\ninclude:\n3.1 Site managers\n3.2 Project managers\n3.3 Engineers and technicians\n3.4 Technical experts\n3.5 Line managers/supervisors\n3.6 Regulatory personnel\n3.7 Team leaders\n3.8 Other personnel designated by an organization or\nenterprise\n\n--- PDF PAGE 48 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 46\n\n4\nEstablished\nprocedures\nFormal arrangements of an organization, enterprise or\nstatutory authority of how work is to be done. These may\ninclude, for example:\n4.1 Quality assurance systems incorporating, for example:\n4.1.1 Specifications, requirements and procedures\n4.1.2 Work orders / instructions\n4.1.3 Reporting procedures\n4.1.4 Improvement mechanisms\n4.1.5 Compliance requirements\n4.1.6 Safety management\n4.2 Work clearance systems incorporating, for example:\n4.2.1 Work permits\n4.2.2 Monitoring and clearance procedures\n4.2.3 Isolation procedures\n4.3 OH&S practices\n4.4 Procedures for operating safety systems, operating plant\nand equipment and reporting work activities\n4.5 Maintenance, modification or supply of relevant schematic\ndrawings and technical data\n4.6 Arrangements for dealing with emergency situations.\n\n5\nConsumer\nelectronics\nproducts\n5.1 Audio/Video products and systems\n5.2 Cellular phones\n5.3 Electrically controlled domestic appliances\n\n6\nUnplanned events\nor conditions\nMay include but not limited to:\n6.1 Accidents/incidents\n6.2 Brownout\n6.3 Equipment breakdown\n6.4 Force majeure e.g., earthquake, fire, typhoon\n\n--- PDF PAGE 49 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 47\n\nEVIDENCE GUIDE\n1\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Planned and prepared the servicing and maintenance\nsystem in accordance with OH&S policies and procedures\n1.2. Checked programs to be developed for servicing and\nmaintenance according to job requirements\n1.3. Identified and detailed tools, equipment and materials\nneeded to carry out work as specified in the user’s manual\nand established procedures\n1.4. Implemented consumer electronic products and\nassociated circuit servicing and maintenance in\naccordance with requirements\n1.5. Maintained records and documentation of servicing and\nmaintenance activities\n1.6. Reported quality management issues and responses in\naccordance with established procedures\n2\nUnderpinning\nknowledge and\nattitude\n2.1. Read blueprint diagram block diagram\n2.2. Use of schematic diagram and interpreting schematic\nsymbols and process flow\n2.3. System and process\n2.3.1. Fundamentals of maintaining and servicing Audio-\nVideo products and systems\n2.3.2. Fundamentals of maintaining in electronically\ncontrolled domestic appliances\n2.3.3. Fundamentals of maintaining cellular phones\n2.4. Safety\n2.4.1. Work safety requirements and economy of\nmaterials with durability\n2.4.2. Knowledge in 5S application and observation of\nrequired timeframe\n2.5. Materials, Tools and Equipment: Uses and Specifications\n2.5.1. Materials soldering adhesives and insulation\n2.5.2. Identification of appropriate tools, equipment and\ndevices\n2.6. Applied mathematics\n2.7. Laws and regulations\n2.7.1. RA 9292\n2.7.2. NTC Memorandum Circulars\n2.7.3. Local Ordinance\n2.7.4. DTI Regulations\n2.7.5. Philippine Electronics code\n2.7.6. Philippine Electrical code\n\n--- PDF PAGE 50 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 48\n\n3\nUnderpinning skills\n3.1. Work efficiency\n3.2. Communication skills in interpreting service manual and\ndealing with the client\n3.3. Troubleshooting techniques and applied solutions in\nrepairing consumer electronic products and systems\n3.4. Skills in the use and maintenance of test instruments,\ntools and equipment\n3.5. Application of work safety practices and time management\n3.6. Skills in operation of basic computer software application\n3.7. Drawing and interpreting schematic block diagrams and\nflowcharts relative to work flow\n4\nResource\nimplications\nIncludes but not limited to:\n4.1. Working table/bench\n4.2. Sufficient lighting and ventilation system\n4.3. Electronic supplies\n4.4. Diagram/manuals and other repair references of different\ncellular phone models\n5\nMethod of\nassessment\nThe assessor must select at least two of the following\nassessment methods to objectively assess the candidate:\n5.1. Direct observation of application to tasks and questions\nrelated to underpinning knowledge\n5.2. Case study/written report\n5.3. Portfolio\n5.4. Third Party Report\n6\nContext of\nassessment\n6.1. Competency maybe assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 51 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 49\n\nUNIT OF COMPETENCY :\nTRAIN SERVICE TECHNICIANS\nUNIT CODE\n:",
