ures \n3.4  Consumer electronic products and associated circuits are tested to \nensure safety of the installation  \n3.5  Consumer electronic products and associated circuits are serviced \nin accordance with established procedures\n\n--- PDF PAGE 47 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III   \n \n \n                        Page 45  \n \n \nRANGE OF VARIABLES \n \n1. OH&S policies and \nprocedures \nArrangements of an organization or enterprise to meet the legal \nand ethical obligations of ensuring that the workplace is safe and \nwithout risk to health. This may include: \n1.1 Hazardous and risk assessment mechanisms \n1.2 Implementation of safety regulations \n1.3 Safety training \n1.4 Safety systems incorporating, \n1.4.1 \nWork clearance procedures \n1.4.2 \nIsolation procedures \n1.4.3 \nGas and vapor \n1.4.4 \nMonitoring/testing procedures \n1.4.5 \nUse of protective equipment and clothing \n1.5 Use of codes of practice \n2 \nRequirements \nRequirements may include: \n2.1 Statutory regulations \n2.2 Codes of practice \n2.3 Job specifications \n2.4 Transport documentation \n2.5 Standards called-up in specifications  \n2.6 Procedures and work instructions \n2.7 Quality assurance systems \n2.8 Manufacturers’ specifications \n2.9 Maintenance manuals, schedules and \nspecifications/standards \n2.10 Circuit/cable schedules \n2.11 Design specifications \n2.12 Customer/client requirements and specifications \n2.13 specified underpinning knowledge (specified in units’ \nEvidence Guides) \n2.14 National and State guidelines , policies and imperatives \nrelating to the environment \n3 \nAppropriate \npersonnel \nIndividuals with responsibilities for co-ordination, design \ninstallation, maintenance, production, or servicing activities may \ninclude: \n3.1 Site managers \n3.2 Project managers \n3.3 Engineers and technicians \n3.4 Technical experts \n3.5 Line managers/supervisors \n3.6 Regulatory personnel \n3.7 Team leaders \n3.8 Other personnel designated by an organization or \nenterprise\n\n--- PDF PAGE 48 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III   \n \n \n                        Page 46  \n \n4 \nEstablished \nprocedures \nFormal arrangements of an organization, enterprise or \nstatutory authority of how work is to be done. These may \ninclude, for example: \n4.1 Quality assurance systems incorporating, for example: \n4.1.1 Specifications, requirements and procedures \n4.1.2 Work orders / instructions \n4.1.3 Reporting procedures \n4.1.4 Improvement mechanisms \n4.1.5 Compliance requirements \n4.1.6 Safety management \n4.2 Work clearance systems incorporating, for example: \n4.2.1 Work permits \n4.2.2 Monitoring and clearance procedures \n4.2.3 Isolation procedures \n4.3 OH&S practices \n4.4 Procedures for operating safety systems, operating plant \nand equipment and reporting work activities \n4.5 Maintenance, modification or supply of relevant schematic \ndrawings and technical data \n4.6 Arrangements for dealing with emergency situations. \n \n5 \nConsumer \nelectronics \nproducts \n5.1 Audio/Video products and systems \n5.2 Cellular phones \n5.3 Electrically controlled domestic appliances \n \n6 \nUnplanned events \nor conditions \nMay include but not limited to: \n6.1 Accidents/incidents  \n6.2 Brownout \n6.3 Equipment breakdown \n6.4 Force majeure e.g., earthquake, fire, typhoon\n\n--- PDF PAGE 49 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS - CONSU