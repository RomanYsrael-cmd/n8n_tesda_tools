        "source_text": "--- PDF PAGE 41 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III   \n \n \n                        Page 39  \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY  : \nCOMMISSION CONSUMER ELECTRONIC PRODUCTS \nAND SYSTEMS \nUNIT CODE \n:    ELC724326 \nDESCRIPTOR                    : This unit covers the knowledge, skills and attitudes required \nto undertake commissioning of consumer electronic product \nsystems and associated basic circuits, components to \ncomply with predetermined parameters and standards. \n.. \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized Bold terms are elaborated in the range of variables) \n1. \nPlan and prepare \nconsumer electronic \nproducts and \nsystems for \ncommissioning  \n \n1.1 \nCommissioning procedures are planned and prepared \nbased on OH&S policies and procedures and duplicate work \nis appropriately sequenced in accordance with requirements  \n1.2 \nAppropriate personnel are consulted to ensure the work is \ncoordinated effectively with others involved in the work site  \n1.3 \nCommissioning procedures are checked against requirements \n1.4 \nMaterials necessary to complete the work are obtained in \naccordance with established procedures and checked \nagainst requirements \n1.5 \nTools, equipment and testing devices needed to carry out the \ncommissioning work are obtained in accordance with \nestablished procedures and checked for correct operation and \nsafety  \n1.6 \nPreparatory work is checked to ensure no unnecessary \ndamage will occurred and process complies with requirements \n2 \nCommission \nconsumer electronic \nproducts and  \nsystem \n \n \n \n2.1 \nOH&S policies and procedures are followed  \n2.2 \nCircuits are checked and isolated where necessary using \nspecified testing procedures  \n2.3 \nCommissioning activities are performed in accordance with \nrequirements, without damage or distortion to the surrounding \nenvironment or components  \n2.4 \nUnplanned events or conditions are responded to in \naccordance with established procedures  \n2.5 \nApproval is obtained from appropriate personnel in \naccordance with established procedures, from appropriate \npersonnel before any contingencies are implemented  \n2.6 \nOn-going checks of the quality of the work are undertaken in \naccordance with established procedures \n3 \nInspect and \ndocument \ncompletion of work \n \n3.1 \nFinal inspections and performance checks are undertaken to \nensure that the commissioning procedures of apparatus, \nassociated circuits and components conforms to \nrequirements  \n3.2 \nWork completion is documented and reported to personnel \nconcerned in accordance with established procedures\n\n--- PDF PAGE 42 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III   \n \n \n                        Page 40  \n \nRANGE OF VARIABLES \n \n1. Commissioning \nprocedures \nMay include but not limited to: \n1.1 Inspection \n1.2 Testing  \n2. OH&S policies \nand procedures \nArrangements of an organization or enterprise to meet their legal \nand ethical obligations of ensuring that the workplace is safe and \nwithout risk to health. This may include: \n2.1 Hazard and risk assessment mechanisms \n2.2 Implementation of safety regulations \n2.3 Safety training \n2.4 Safety systems incorporating, \n2.4.1 \nWork clearance procedures \n2.4.2 \nIsolation procedures \n2.4.3 \nGas and vapor \n2.4.4 \nMonitoring/testing procedures \n2.4.5 \nUse of protective equipment and clothing \n2.5  Use of codes of practice \n \n3. Appropriate \nperson \nIndividuals with responsibilities for co-ordination, design installation, \nmaintenance, production, or servicing activities may include: \n3.1 Site managers \n3.2 Project managers \n3.3 Engineers and technicians \n3.4 Technical experts \n3.5 Line managers/supervisors \n3.6 Regulatory personnel \n3.7 Team leaders \n3.8 Other personnel designated by an organization or enterprise \n \n4. Established \nprocedures \nFormal arrangements of an organization, enterprise or statutory \nauthority on task performances. \n4.1 Quality assurance systems incorporating, for example: \n4.1.1 \nSpecifications, requirements and procedures \n4.1.2 \nWork orders / instructions \n4.1.3 \nReporting procedures \n4.1.4 \nImprovement mechanisms \n4.1.5 \nCompliance requirements \n4.1.6 \nSafety management \n4.2 Work clearance systems incorporating, for example: \n4.2.1 \nWork permits \n4.2.2 \nMonitoring and clearance procedures \n4.2.3 \nIsolation procedures \n4.3 OH&S practices \n4.4 Procedures for operating safety systems, operating plant \nand equipment and reporting work activities \n4.5 Maintenance, modification or supply of relevant schematic \ndrawings and technical data \n4.6 Arrangements for dealing with emergency situations.\n\n--- PDF PAGE 43 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III   \n \n \n                        Page 41  \n \n5. Unplanned \nevents or \nconditions \nMay include but not limited to: \n5.1 Accidents/incidents  \n5.2 Brownout \n5.3 Equipment breakdown \n5.4 Force majeure e.g., earthquake, fire, typhoon \n6. Requirements \nRequirements may include: \n6.1 Statutory regulations \n6.2 Codes of practice \n6.3 Job specifications \n6.4 Procedures and work instructions \n6.5 Quality assurance systems \n6.6 Manufacturers’ specifications \n6.7 Maintenance manuals, schedules and specifications/ \nstandards \n6.8 Circuit/cable schedules \n6.9 Design specifications \n6.10 Customer/client requirements and specifications \n6.11 National and State guidelines , policies and imperatives \nrelating to the environment \n7. Environmental \nRequirements \n7.1 Proper disposal of chemicals equipment and components \nshall be based on existing requirements of the law and \nchemicals waste management \n7.2 Non-biodegradable parts of materials shall be packed and \nlabeled properly for disposal.\n\n--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III   \n \n \n                        Page 42  \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Planned commissioning procedures in line with job \nrequirements \n1.2 Prepared/obtained materials, PPE, tools, equipment and \ntesting  devices in line with established procedures \n1.3 Demonstrated compliance with safety regulations \napplicable to worksite operations \n1.4 Performed commissioning activities in line with established  \nprocedures  and job requirements \n1.5 Performed final inspection to ensure commissioning \nelectrical system meet job requirements \n1.6 Documented and reported completion of work to supervisor \nin line with established procedures \n1.7 Communicated effectively with others to ensure safe and  \neffective work operations \n \n2. Underpinning \nknowledge and \nattitude \n2.1. Blueprint diagram reading \n2.2. Use of schematic diagram and interpreting schematic \nsymbols \n2.3. System and processes \n2.3.1. Troubleshooting analysis \n2.3.2. Fundamentals of electronics \n2.3.3. Fundamentals of Computer operation \n2.3.4. Fundamentals of microprocessors/microcontroller \n2.3.5. Fundamentals of building wiring \n2.3.6. Fundamentals of electromagnetic compatibility \n2.4. Operation of different consumer electronic products and \nsystems and accessories \n2.5. Safety \n2.5.1. Work safety requirements and economy of \nmaterials with durability \n2.5.2. Knowledge in 5S application and observation of \nrequired timeframe \n2.6. Materials, Tools and Equipment: Uses and Specifications \n2.6.1. Soldering materials adhesives and insulation \n2.6.2. Identification of appropriate tools, equipment and \ndevices \n2.7. Applied mathematics \n2.8. Laws and regulations \n2.8.1. RA 9292 \n2.8.2. NTC Memorandum Circulars \n2.8.3. Local Ordinance \n2.8.4. DTI Regulations \n2.8.5. Philippine Electrical code \n2.8.6. Philippine Electronic code\n\n--- PDF PAGE 45 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III   \n \n \n                        Page 43  \n \n \n3. Underpinning skills \n3.1. Work efficiency  \n3.2. Communication skills in interpreting service manual and \ndealing with the client \n3.3. Troubleshooting technique and applied solutions in \nrepairing consumer electronic product and system  \n3.4. Skills in the use  and maintenance of test instruments, \ntools and equipment  \n3.5. Applying work safety practices and time management \n3.6. Skills in operation of basic computer software application \n3.7. Interpreting schematic diagrams in relation to job \nrequirements\n4. Resource \nimplications \nIncludes but not limited to: \n4.1. Tools, equipment and test instruments  \n4.2. Working table/bench \n4.3. Electronic supplies \n4.4. Diagram/manuals and other repair references of \nconsumer electronic product and systems \n4.5. Personal protective equipment (PPE) \n5. Method of \nassessment \nThe assessor must select at least two of the following \nassessment methods to objectively assess the candidate: \n5.1. Direct observation of application to tasks and questions \nrelated to underpinning knowledge \n5.2. Interview/ Oral questioning  \n5.3. Case study/ Written Report \n5.4. Portfolio \n5.5. Third Party Report \n6. Context of \nassessment \n6.1. Competency maybe assessed in the workplace or in a \nsimulated workplace setting\n",
