  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: Consumer Electronics Servicing\nNC Level: NC III\n\nNominal Training Duration:\n36 hrs – Basic Competencies\n\n60 hrs – Common Competencies\n\n80 hrs – Core Competencies\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of a\nConsumer Electronics Technician, in accordance with industry standards. It covers the\nbasic & common competencies in addition to the core competencies such as\ncommissioning consumer electronic products and systems, developing servicing system\nfor consumer electronic products and training service technicians. The nominal duration\nof 176 hours covers the required units at NC III. TVET providers can however, offer a\nlonger, ladderized course covering both NC II and NC III basic, common and core units.\n\nBASIC COMPETENCIES\n36 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace\nprocesses.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group discussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance\nexpectation for team\nmembers.\n2.4 Supervise team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 56 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 54\n\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\ntools and techniques to\nsolve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3\nAnalyze results\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n2.1 Identify appropriate\ntechnology\n2.2 Apply relevant technology\n2.3 Maintain/enhance relevant\ntechnology\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n60 hrs\nNote:\nThose who have completed the course on Consumer Electronics Servicing NC II or have\nacquired the Consumer Electronics Servicing NC II qualification can skip this portion on\ncommon competencies\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Apply Quality\nStandards\n\n1.1 Asses quality of received\nmaterials\n1.2 Assess own work\n1.3 Engage in quality\nimprovement\n\n Field trip\n Symposium\n Film showing\n Simulation\n On the job\ntraining\n\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party\nreport\n\n2. Perform\nComputer\nOperation\n\n2.1 Plan and prepare for task\nto be undertaken\n2.2 Input data into computer\n2.3 Access information using\ncomputer\n2.4 Produce output/data using\ncomputer system\n2.5 Use basic functions of a\nweb browser to locate\ninformation\n2.6 Maintain computer\nequipment and systems\n\n• Modular\n• Film showing\n• Computer\nbased training\n(e-learning)\n• Project method\n• On the job\ntraining\n\n• Demonstration &\nquestioning\n• Observation &\nquestioning\n• Third party\nreport\n• Assessment of\noutput product\n• Portfolio\n• Computer-\nbased\nassessment\n\n--- PDF PAGE 57 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 55\n\n3.\nUse Hand\nTools\n\n3.1 Identify, explain and apply\nthe use of different types\nof hand tools\n3.2 Perform basic\nmaintenance and proper\nstorage of hand tools\naccording to the standard\noperating procedures\n3.3 Document and record the\nsequence of events in safe\nkeeping hand tools.\n\n Lecture /\nDemonstration\n Distance\neducation\n Film Showing\n\n Written/Oral\nexamination\n Practical\ndemonstration\n\n4.\nPerform\nMensurations\nand\nCalculation\n\n4.1 Select measuring\ninstruments;\n\n4.2 Carry-out measurements\nand calculations;\n\n Self- paced/\nmodular\n Demonstration\n Small group\ndiscussion\n Distance\neducation\n\n Written/Oral\nexamination\n Practical\ndemonstration\n\n5.\nInterpret\nTechnical\nDrawings\nAnd Plans\n\n5.1 Select and interpret\ntechnical drawing\n5.2 Perform freehand\nsketching\n\n Lecture/\ndemonstration\n Dualized\n Distance\nlearning\n\n Written /oral\n examinations\n Direct\n observation\n Project method\ninterview\n\n6.\nTerminate\nand Connect\nElectrical\nwiring and\nElectronic\nCircuit\n\n6.1 Terminate or join non-\nsoldered connections\n6.2 Terminate or join soldered\nconnections\n\n Film Viewing\n Individualized\nLearning\n Direct Student\nLaboratory\nExperience\n On the Job\nTraining\n Project\n Method\n\n Demonstration\nand Questioning\n Assessment of\nOutput Product\n\n--- PDF PAGE 58 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 56\n\nCORE COMPETENCIES\n80 hrs\n\nNote: This course design covers only NC level III core units.\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Commission\nConsumer\nElectronic\nProducts and\nSystems\n1.1 Read & interpret work\n instructions according to job\n requirements.\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Written exam\n• Practical exam\nObservation in\nworkplace\n• Interviews/\nquestioning\n1.2 Identify the tools, equipment,\n testing devices, & materials\n needed for loop checking.\n1.3 Identify the PPE & OHS\n policies & procedures required\n for the loop checking job.\n1.4 Commission of consumer\nelectronic products and\nsystems in accordance to\nindustry standards\n1.5 Evaluate commissioning\nactivity\n\n2. Develop\nServicing\nSystem for\nConsumer\nElectronic\nProducts\n\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Written exam\n• Practical exam\n• Observation in\nworkplace\n• Interviews/\nquestioning\n2.1 Identify the tools, equipment,\n testing devices, & materials\nand facilities needed for\nmaintenance repair.\n2.2 Identify the PPE & OHS\n policies & procedures required\n for the maintenance & repair\n job.\n2.3 Identify organized\nmaintenance and servicing\nprocedures\n2.4 Evaluate work activity\naccording to the procedures\n3. Train Service\nTechnician\n3.1 Develop training plan in\naccordance to workplace\nrequirement\n3.2 Conduct training of service\ntechnicians\n3.3 Evaluate progress of training\nin accordance to plan\n\n--- PDF PAGE 59 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 57\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of the competency-based\nTVET.\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and\nthe curriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nonly facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire a specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructors are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n--- PDF PAGE 60 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 58\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n•\nMust have completed Consumer Electronics Servicing NCII program\nor equivalent\n•\nMust have interest and potential in handling supervisory functions\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience and others that may be\nrequired from the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of\n\n25 trainees for Consumer Electronics Servicing NC III.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n\n1 pc\nLCD Projector\n10 pcs\nWhiteboard\nmarker, red\n\n1 pc\nLarge projection screen\n10 pcs\nWhiteboard\nmarker, black\n\n25 set Writing table and chair\n10 pcs\nWhiteboard\nmarker, blue\n\n1 pc\nLaptop computer\n5 pcs\nWhiteboard\neraser\n\n1 set\nAudio video system\n25 pcs\nFlow chat\ntemplate\n\n--- PDF PAGE 61 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 59\n\n3.5 TRAINING FACILITIES\n\nBased on class size of 25 students/trainees the space requirements for\n\nthe teaching/learning and circulation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nLecture Area\n5 x 8\n40\n1\n40\nLearning Resource Area\n4 x 5\n20\n1\n20\nWash ,Toilet & Locker Room\n2 x 5\n10\n2\n20\n Total\n80\nFacilities / Equipment /\nCirculation**\n\n30\nTotal Area\n110\n\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6 TRAINERS QUALIFICATIONS\n\nConsumer Electronics Technician NC III\n\nTrainer’s Qualification TQ III\n\n•\nMust be a holder of TESDA Consumer Electronics Servicing NCIV or equivalent\n•\nMust have completed Training Methodology III (TM III) course or equivalent\n•\n* Must have at least 2-years relevant industry experience.\n•\nMust be physically & mentally fit.\n\n* Optional: Only when required by the hiring institution.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\n\nachievement of units of competency. A certificate of achievement is issued for\n\neach unit of competency.\n\n--- PDF PAGE 62 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - CONSUMER ELECTRONICS SERVICING NC III\n\n Page 60"
