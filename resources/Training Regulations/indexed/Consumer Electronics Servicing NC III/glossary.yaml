      "term": "Page 63 SECTOR SPECIFIC",
      "definition": "1. Equipment - A component part of an installation used for a particular purpose. Equipment includes, but is not limited to, that contained in the following divisions. It will necessarily include new and emerging technologies: • Audio/visual equipment including televisions, radios, monitors, cameras, closed circuit television, mono and stereo sound systems, gaming machines, electronic display panels, cassette recorders, video cassette recorders, CDROM players, tape recorders, sound and video duplication equipment, digital versatile discs, digital audio tapes, professional and domestic speaker systems, mixer desks. • Appliances including portable electric tools, motor driven pumps, vacuum cleaners, food preparation equipment, hair dryers, refrigerators, washing machines, dish washers, paper shredders, water coolers, clothes dryers, pest exterminators, electric motor driven industrial tools and equipment, sanitary disposal units, radial and tangential fans and blowers. 2. Appliances - A fixed (for support only), hand-held (held in hand during normal use), portable (moved whilst in operation or easily moved from one place to another while connected to the supply) or stationary (can be moved, but not easily) consuming device, other than a lamp. 3. Competent person - A person who has the relevant competencies described in this competency 4. Component - That portion of a unit of equipment, which has been designed as a discrete unit and that can be identified as such. 5. Environment - The area surrounding the work site which can be directly or indirectly affected by occurrences at the work site. It includes the atmosphere, soils, drains, underground water tables, and the ecosystem. Protection of the environment would require the proper disposal of waste materials, restriction of burning off, the correct handling of toxic substances, the containment of CFCs and the like. 6. Established procedures - Formal arrangements of an organization, enterprise or statutory authority of how work is to be done. 7. Hazardous materials - Flammable gases and vapors and combustible dusts. 8. Modifications - To make changes to the physical parameters or operational function of a device, component or piece of equipment or apparatus. 9. Notification (notified) - Can include verbal, written, electronic or recorded information at completion of work which may be required to be completed in accordance with established procedures."
