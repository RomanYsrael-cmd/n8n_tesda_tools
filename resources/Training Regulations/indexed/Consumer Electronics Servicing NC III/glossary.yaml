      "term": "GENERAL",
      "definition": "1) Certification - is the process of verifying and validating the competencies of a person through assessment 2) Certificate of Competency (COC) – is a certification issued to individuals who pass the assessment for a single unit or cluster of units of competency 3) Common Competencies - are the skills and knowledge needed by all people working in a particular industry 4) Competency - is the possession and application of knowledge, skills and attitudes to perform work activities to the standard expected in the workplace 5) Competency Assessment - is the process of collecting evidence and making judgments on whether competency has been achieved 6) Competency Standard (CS) - is the industry-determined specification of competencies required for effective work performance 7) Context of Assessment - refers to the place where assessment is to be conducted or carried out 8) Core Competencies - are the specific skills and knowledge needed in a particular area of work - industry sector/occupation/job role 9) Critical aspects of competency - refers to the evidence that is essential for successful performance of the unit of competency 10) Elective Competencies - are the additional skills and knowledge required by the individual or enterprise for work 11) Elements - are the building blocks of a unit of competency. They describe in outcome terms the functions that a person performs in the workplace. 12) Evidence Guide - is a component of the unit of competency that defines or identifies the evidences required to determine the competence of the individual. It provides information on critical aspects of competency, underpinning knowledge, underpinning skills, resource implications, assessment method and context of assessment 13) Level - refers to the category of skills and knowledge required to do a job 14) Method of Assessment - refers to the ways of collecting evidence and when, evidence should be collected"
