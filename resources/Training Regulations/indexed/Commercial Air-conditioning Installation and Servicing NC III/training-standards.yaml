    "source_text": "3.1\nCURRICULUM DESIGN\n\n TESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core\nunits\nof\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology, communication/language and other academic subjects\nshall be contextualized. To this end, TVET providers shall develop a Contextual\nLearning Matrix (CLM) to include green technology, issues on health and drugs\nand catering to persons with disabilities (PWD’s) to accompany their curricula.\n\nCourse Title:\nCommercial Air-Conditioning Installation And Servicing\nPQF Level :\nNC III\nNominal Training\n 40 Hours (Basic)\nDuration: 40 Hours (Common)\n 240 Hours (Core)\n 320 Hours - Total\n 400 Hours – Supervised Industry Learning (SIL)\n\n ---------------------------------------------------------------------\n\n 720 Hours - Total training duration\n______\n* SIL can be delivered thru Dual Training System (DTS)/Dualized Training Program (DTP) or\nEnterprise-based Training\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, skills and\nattitudes applicable in installing, servicing and maintaining, troubleshooting and\nrepairing including starting-up, testing and commissioning commercial air-\nconditioning unit. This includes classroom learning activities and practical work\nin actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to\ndemonstrate the above-mentioned competencies to be employed. To obtain\nthis, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 89 ---\nTR-Commercial Air-Conditioning Installation and Servicing NC III (HVCCAC321) Promulgated: June 8, 2021\n\n85\nBASIC COMPETENCIES\n(40 Hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead\nworkplace\ncommunication\n1.1. Communicate\ninformation\nabout\nworkplace\nprocesses\n• Read\no Effective verbal communication methods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for written\nand electronic communication methods\n• Follow organization requirements for the use\nof written and electronic communication\nmethods\n• Perform exercises on understanding and\nconveying intended meaning scenario\n• Lecture\n• Demonstration\n• Practical exercises\n• Role Play\n• Written Test\n• Observation\n2 Hours\n1.2. Lead workplace\ndiscussions\n• Describe:\no Organizational policy on production, quality\nand safety\no Goals/ objectives and action plan setting\n• Read\no Effective verbal communication methods\n• Prepare/set action plans based on\norganizational goals and objectives\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n2 Hours\n1.3. Identify and\ncommunicate\nissues arising in\nthe workplace\n• Describe:\no Organizational policy in dealing with issues\nand problems\n• Read\no Effective verbal communication methods\n• Group discussion\n• Lecture\n• Oral evaluation\n• Written Test\n2 Hours\n2. Lead small\nteams\n2.1. Provide team\nleadership\n• Discussion of Company policies and\nprocedures\n• Read web pages on situational leadership\n• Role play on situational leadership\n• Group work\n• Role Play\n• Lecture/ Discussion\n• Individual Work\n• Role Play\n• Written Test\n1 Hour\n\n--- PDF PAGE 90 ---\nTR-Commercial Air-Conditioning Installation and Servicing NC III (HVCCAC321) Promulgated: June 8, 2021\n\n86\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2.2. Assign\nresponsibilities\n• Read web pages on performance\nmanagement\n• Case study on allocating roles and\nresponsibilities based on competencies of\ncurrent staff\n• Individual Work\n• Case Study\n• Role Play\n• Written Test\n1 Hour\n2.3. Set\nperformance\nexpectations for\nteam members\n• Role play to communicate performance\nexpectations with staff\n• Discussion on performance issues\n• Lecture/ Discussion\n• Role Play\n• Role Play\n• Written Test\n\n1 Hour\n2.4. Supervise team\nperformance\n• Discussion on performance monitoring\n• Role play on providing feedback on\nperformance\n• Role play on performance coaching\n• Discussion on keeping the team informed of\nteam performance\n• Case study on Team performance monitoring\nand feedback\n• Lecture/ Discussion\n• Role Play\n• Case Study\n• Role Play\n• Written Test\n1 Hour\n3. Apply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n3.1. Examine\nspecific\nworkplace\nstrategies\n• Show thorough knowledge and understanding\nof the process, normal operating parameters,\nand product quality to recognize non-standard\nsituations\n• Show mastery of the current industry\nhardware and software products and services\n• Discuss process of identification of\nfundamental causes of specific workplace\nchallenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and measures\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 91 ---\nTR-Commercial Air-Conditioning Installation and Servicing NC III (HVCCAC321) Promulgated: June 8, 2021\n\n87\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n- Enterprise quality OHS and environmental\nrequirement\n- Enterprise information systems and data\ncollation\n- Industry codes and standards\n\n3.2. Analyze the\ncauses of\nspecific\nworkplace\nchallenges\n• Show thorough knowledge and understanding\nof the process, normal operating parameters,\nand product quality to recognize non-standard\nsituations\n• Show mastery of the current industry\nhardware and software products and services\n• Discuss process of identification of\nfundamental causes of specific workplace\nchallenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and measures\n- Enterprise quality OHS and environmental\nrequirement\n- Enterprise information systems and data\ncollation\n- Industry codes and standards\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-solving\ntechniques\n• Formulate clear-cut findings on the nature of\neach identified workplace challenges\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 92 ---\nTR-Commercial Air-Conditioning Installation and Servicing NC III (HVCCAC321) Promulgated: June 8, 2021\n\n88\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3.3. Formulate\nresolutions to\nspecific\nworkplace\nchallenges\n• Show thorough knowledge and understanding\nof the process, normal operating parameters,\nand product quality to recognize non-standard\nsituations\n• Show mastery of the current industry\nhardware and software products and services\n• Discuss process of identification of\nfundamental causes of specific workplace\nchallenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product quality to\nrecognize non-standard situations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and measures\n- Enterprise quality OHS and environmental\nrequirement\n- Enterprise information systems and data\ncollation\n- Industry codes and standards\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-solving\ntechniques\n• Formulate clear-cut findings on the nature of\neach identified workplace challenges\n• Discus strategies on devising,\ncommunicating, implementing and evaluating\nstrategies and techniques in addressing\nspecific workplace challenges\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 93 ---\nTR-Commercial Air-Conditioning Installation and Servicing NC III (HVCCAC321) Promulgated: June 8, 2021\n\n89\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3.4. Implement\naction plans\nand\ncommunicate\nresults\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-solving\ntechniques\n• Formulate clear-cut findings on the nature of\neach identified workplace challenges\n• Discus strategies on devising,\ncommunicating, implementing and evaluating\nstrategies and techniques in addressing\nspecific workplace challenges\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n4. Work in a\nDiverse\nEnvironment\n4.1. Develop an\nindividual’s\ncultural\nawareness and\nsensitivity\n• Show understanding of cultural diversity in\nthe workplace\n• Recognize norms of behavior for interacting\nand dialogue with specific groups (e. g.,\nMuslims and other non-Christians, non-\nCatholics, tribes/ethnic groups, foreigners)\n• Demonstrate different methods of verbal and\nnon-verbal communication in a multicultural\nsetting\n• Apply cross-cultural communication skills (i.e.\ndifferent business customs, beliefs,\ncommunication strategies)\n• Show affective skills 