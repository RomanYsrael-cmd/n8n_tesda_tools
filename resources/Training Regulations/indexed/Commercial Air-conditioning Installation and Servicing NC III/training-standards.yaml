  "source_section_text": "SECTION 3. TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for COMMERCIAL AIR-CONDITIONING\nINSTALLATION AND SERVICING NC III.\n\n3.1\nCURRICULUM DESIGN\n\n TESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core\nunits\nof\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology, communication/language and other academic subjects\nshall be contextualized. To this end, TVET providers shall develop a Contextual\nLearning Matrix (CLM) to include green technology, issues on health and drugs\nand catering to persons with disabilities (PWD’s) to accompany their curricula.\n\nCourse Title:\nCommercial Air-Conditioning Installation And Servicing\nPQF Level :\nNC III\nNominal Training\n 40 Hours (Basic)\nDuration: 40 Hours (Common)\n 240 Hours (Core)\n 320 Hours - Total\n 400 Hours – Supervised Industry Learning (SIL)\n\n ---------------------------------------------------------------------\n\n 720 Hours - Total training duration\n______\n* SIL can be delivered thru Dual Training System (DTS)/Dualized Training Program (DTP) or\nEnterprise-based Training\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, skills and\nattitudes applicable in installing, servicing and maintaining, troubleshooting and\nrepairing including starting-up, testing and commissioning commercial air-\nconditioning unit. This includes classroom learning activities and practical work\nin actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to\ndemonstrate the above-mentioned competencies to be employed. To obtain\nthis, 