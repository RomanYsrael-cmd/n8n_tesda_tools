  "source_text": "COMPETENCY MAP - HVAC/R Sector\nCOMMERCIAL AIR-CONDITIONING INSTALLATION AND SERVICING NC\nIII\n\nCORE COMPETENCIES\n\nInstall window- type AC/\ndomestic refrigeration units\nService & maintain window-type\nAC/ domestic refrigeration units\nTroubleshoot window-type\nAC/domestic refrigeration\nsystems\nRecover & recycle refrigerant\nin window-type AC/domestic\nrefrigeration systems\nRepair & retrofit window-type\nAC/ domestic refrigeration\nsystems\nPerform Testing and\ncommissioning for window-\ntype AC/domestic refrigeration\nInstall package-type air-conditioning\nunit (PACU) / commercial\nrefrigeration equipment (CRE)\nInstall PACU/CRE electrical\nsystems\nInstall PACU/CRE piping\nsystems\nService & maintain PACU/CRE\nunits\nSurvey site for installation\nTroubleshoot PACU/CRE n systems\nRecover / recycle refrigerant\nin PACU/ CRE systems\nRepair & retrofit PACU/CRE\nsystems & its accessories\nPerform start-up, testing and\ncommissioning for PACU/CRE\nInstall transport air-\nconditioning\n& refrigeration units\nService & maintain transport AC\n& refrigeration units\nRecover & recycle\nrefrigerant in transport AC &\nrefrigeration systems\nTroubleshoot transport air-\nconditioning & refrigeration\nsystems\nPerform testing &\ncommissioning for transport AC\n& refrigeration\nInstall package-type air-\nconditioning unit (PACU)\nService & maintain PACU\nTroubleshoot and repair\nPACU\nPerform start-up, test and\ncommissioning for PACU\nService & maintain mobile air-\nconditioning (MAC) units\nInstall commercial refrigeration\nequipment (CRE)\nService & maintain CRE\nTroubleshoot and repair\nCRE\nPerform start-up, test and\ncommissioning for CRE\nTroubleshoot & repair mobile\nair-conditioning systems\nInstall commercial air-\nconditioning unit (CACU)\nService & maintain CACU\nTroubleshoot and repair\nCACU\nPerform start-up, testing\nand commissioning for\nCACU\nPerform start-up, test and\ncommissioning for mobile air-\nconditioning systems\nRepair & retrofit transport ac &\nrefrigeration systems & its\naccessories\nInstall domestic refrigeration and\nair-conditioning units\nService & maintain domestic\nrefrigeration and air-\nconditioning units\nTroubleshoot & repair\ndomestic refrigeration and\nair-conditioning units\n\nCOMMON COMPETENCIES\n\nPrepare materials and\ntools\nObserve procedures,\nspecifications & manuals of instructions\nPerform mensurations &\ncalculations\nPerform basic benchwork\nPerform basic electrical\nworks\nMaintain tools and\nequipment\nPerform housekeeping and safety\npractices\nDocument work\naccomplished\nInterpret technical\ndrawings and plans\n\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nParticipate in workplace\ncommunication\nLead workplace\ncommunication\nUtilize specialized communication\nskill\nManage and sustain effective\ncommunication strategies\nWork with others\nWork in team environment\nLead small teams\nDevelop and lead teams\nManage and sustain high\nperforming teams\nSolve/address routine\nproblems\nSolve/address general\nworkplace problems\nApply critical thinking and\nproblem solving techniques in\nthe workplace\nPerform higher order thinking\nprocesses and apply techniques\nin the workplace\nEvaluate higher order thinking\nskills and adjust problem solving\ntechniques\nEnhance self-management\nskills\nDevelop career and life\ndecisions\nWork in a diverse environment\nContribute to the practice of social\njustice in the workplace\nAdvocate strategic thinking for\nglobal citizenship\nSupport Innovation\nContribute to workplace\ninnovation\nPropose methods of applying\nlearning and innovation in the\norganization\nManage innovative work\ninstructions\nIncorporate innovation into work\nprocedures\nAccess and maintain\ninformation\nPresent relevant\ninformation\nUse information systematically\nManage and evaluate usage of\ninformation\nDevelop systems in managing,\nand maintaining information\nFollow occupational safety\nand health policies and\nprocedures\nPractice occupational safety\nand health policies and\nprocedures\nEvaluate occupational safety\nand health work practices\nLead in improvement of\nOccupational Safety and Health\nProgram, Policies and Procedures\nManage implementation of\noccupational safety and health\nprograms in the workplace\nApply environmental work\nstandards\nExercise efficient and\neffective sustainable\npractices in the workplace\nEvaluate environmental work\npractices\nLead towards improvement of\nenvironmental work programs,\npolicies and procedures\nManage implementation of\nenvironmental programs in the\nworkplace\nAdopt entrepreneurial\nmindset in the workplace\nPractice entrepreneurial\nskills in the workplace\nFacilitate entrepreneurial skills\nfor micro-small-medium\nenterprises (MSMEs)\nSustain entrepreneurial skills\nDevelop and sustain a high-\nperforming enterprise\n\nANNEX A\n\n--- PDF PAGE 127 ---\nTR-Commercial Air-Conditioning Installation and Servicing NC III (HVCCAC321) Promulgated: June 8, 2021\n 123\n\nGLOSSARY OF TERMS:\n\n1) Air Cooled Condensing Unit (ACCU)/OUTDOOR UNIT – an equipment that\ncondenses refrigerant vapor using air as the condensing medium. It consists of\ncompressor, condenser coil and fan motor\n\n2) Air Cooled Condenser – an equipment that condenses refrigerant vapor using air as\nthe condensing medium\n\n3) Air Handling Unit (AHU)/INDOOR UNIT – an air-conditioning component that\nconsists of a fan motor and an evaporator coil. It is this equipment used in air-\nconditioning that absorbs heat from the space\n\n4) Air Distribution – the process of distributing conditioned air into a confined space\n\n5) Check – to verify, inspect, or test an HVAC/R component for satisfactory condition\nwith the use of an instrument or a device\n\n6) Commercial Refrigeration - covers water coolers/ display coolers, vendo machine,\nbeverage machine icedrop/ice cream/ice cube vending machines\n\n7) Commissioning - process by which an equipment, facility, or plant (which is\ninstalled, or is complete or near completion) is tested to verify if it functions\naccording to its design objectives or specifications.\n\n8) Dehydration – the process of removing moisture from a refrigeration system\n\n9) Electric Heat Defrost – use of electric resistance heating coils to melt ice or frost\nfrom evaporators\n\n10) Evacuation – removal of air/any gas and moisture from a refrigeration system\n\n11) Evaporator – the component in a refrigeration system where liquid refrigerant is\nchanged into a vapor by the absorption of heat\n\n12) Fan – a mechanical device for moving air\n\n13) Fan Coil Unit (FCU) – an air-conditioning component that consists of a fan\nmotor and an evaporator coil\n\n14) Filter Drier – the component part used in air-conditioning or refrigeration system\nto filter and dehydrates refrigerant in the system\n\n15) Hot Gas Defrost – component part used to remove frosting on the evaporator\ncoil using hot gas refrigerant from the compressor\n\n16) Idler Pulley – a pulley used to maintain proper belt tension\n\n--- PDF PAGE 128 ---\nTR-Commercial Air-Conditioning Installation and Servicing NC III (HVCCAC321) Promulgated: June 8, 2021\n 124\n17) Inspect – determine the actual condition of HVAC/R component without the use of\ninstrument\n\n18) Interlocking – it is the action of interconnecting electric control wires to achieve a\nsequential action\n\n19) Leak Test – the procedure of determining/pin pointing leaks in a pressurized system\n\n20) Liquid Line Solenoid Valve – electrically operated valve that shuts-off the flow of\nthe refrigerant to the evaporator\n\n21) Metering Device – it is one of the major components in a refrigeration system used\nto regulate the flow of refrigerant into the evaporator\n\n22) Package Air-conditioning Unit (PACU)– an air-conditioning unit that contains the\ncompressor, water-cooled condenser, metering device and evaporator all of which is\nin one casing.\n\n23) Pull-out – to remove from a place of installation\n\n24) Pressure Test – a procedure whereby pressure is applied to the piping system, the\npurpose of which is to determine its soundness and stability\n\n25) Pump down – a process of using the compressor to pump and contain all the\nrefrigerant charge into the condenser and/or receiver\n\n26) Refrigerant Charging – the process of introducing into the system the proper\namount of refrigerant\n\n27) Retrofitting – a process of upgrading existing equipment or system using ozone\ndepleting substances to environmentally friendly refrigerant\n\n28) Service Mechanic – worker who possess basic skills related to HVAC/R system\n\n29) Sight Glass/Liquid Line Moisture Indicator – indicates refrigerant quality and\ncharge\n\n30) Split-type Air-conditioner – an air conditioning system that comes in two pieces:\none piece contains the compressor, condenser, and a fan; the other unit contains the\nevaporator and a fan. The condenser, installed outside the house, connects to\nseveral evaporators, one in each room to be cooled, mounted inside the house. Each\nevaporator is individually controlled, allowing different rooms or zones to be cooled to\nvarying degrees.\n\n31) Supervised Industry Learning – similar to on-the-job training – an approach in\ntraining designed to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations. Likewise, the term Supervised Industry Learning or SIL in\nreplacement of the term Supervised Industry Training (SIT) or On-the-Job Training\n(OJT) to provide more focus on the process of absorbing and retaining learner's\n\n--- PDF PAGE 129 ---\nTR-Commercial Air-Conditioning Installation and Servicing NC III (HVCCAC321) Promulgated: June 8, 2021\n 125\nenhanced competencies in a workplace and thus enable the learner to practice those\ncompetencies in a variety of workplace situation.\n\n32) Thermostat Expansion Valve (TXV) – a refrigerant control valve connected before\nan evaporator that regulates flow of refrigerant. Operated by temperature and\npressure, and reacts to the degree of gas superheat at the evaporator outlet through\na feeler bulb\n\n33) Transport Air-conditioning Unit – refers to an air-conditioning unit driven directly\nfrom the turning axle of the vehicle when they are in motion, or by the vehicle engine\nitself, or by a separate gasoline/diesel engine and/or electric motor mounted on the\nsame vehicle. It covers the land and marine/sea transports.\n\n34) Troubleshoot – the process of analyzing system defect or malfunction\n\n35) Vacuum – pressure lower than atmospheric pressure measured in inches of\nmercury. Complete vacuum is 29.92 in. mercury or at least 500 microns\n\n36) Water Treatment – the use of chemicals in water to prevent corrosion, formation of\nscales, algae growth and formation of slime\n\n37) Window Type Air-conditioning Unit – is a self-contained air-conditioning unit house\nin a single casing mounted in a wall or window opening\n\n38) Workmanlike-manner – quality of work within the accepted industry standard\n\n--- PDF PAGE 130 ---\nTR-Commercial Air-Conditioning Installation and Servicing NC III (HVCCAC321) Promulgated: June 8, 2021\n 126",
