        "evidence_guide": {
          "source_text": "1.\nCritical aspect of\ncompetency\nAssessment must show that the candidate:\n1.1\nPlanned and prepared for maintenance and repair.\n1.2\nMaintained computer systems and networks\n1.3\nDiagnosed faults of computer systems\n1.4\nRectified/corrected defects in computer systems and networks\n1.5\nInspected and tested the computer systems and networks\n2.\nUnderpinning\nknowledge\nIncludes but not limited to:\n2.1 Planning and preparing for maintenance\n2.2 Computer systems maintenance procedures\n2.2.1 PC systems\n2.2.2 Computer operations\n2.2.3 Electronic fault findings\n2.3 Use and operation of tools, instruments and testing devices\n2.4 Occupational health and safety policies and procedures\n2.5 Job service order forms or checklist\n2.6 Problem solving in emergency situation\n2.7 Procedures in maintenance scheduling\n2.8 Preventive maintenance of computer system and network\n2.8.1 Operating system update\n2.8.2 Back-up scheduling\n2.8.3 Creating restore point\n2.8.4 Guarding against virus\n2.8.5 Cleaning computer systems and networks\n2.9 Diagnostic procedures\n2.10 Identifying and isolating faults/problems\n2.10.1 Diagnostic software utilities\n2.10.2 Gathering of information\n2.11 Accomplished forms\n2.11.1 Diagnostic reports\n2.11.2 Proposal reports\n2.12 Defects in computer systems and networks\n2.13 Troubleshooting and repair techniques\n2.14 Problem solving in emergency situation\n2.15 Corrective action\n2.15.1 Hardware configuration\n2.15.2 Software configuration\n2.16 Testing methods and procedures\n2.17 Documentation and making reports\n2.18 Waste management\n2.19 OHS standards and 5S principles\n2.20 Practicing 3Rs – reduce, re-use, recycle/recover\n2.21 3Rs environmental policies\n2.22 Managing waste from electrical and electronic equipment (WEEE)\n\n3.\nUnderpinning\nskills\n3.1 Reading skills required to interpret work instructions\n3.2 Communication skills needed to interpret and define work\nprocedures\n3.3 Problem solving in emergency situation\n3.4 Network Cabling\n3.5 Connecting computers to wired and wireless LAN\n3.6 Removing viruses from infected machines\n\n--- PDF PAGE 55 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n53\n4.\nMethod of\nassessment\nThe assessor must select two of the following assessment methods to\nobjectively assess the candidate:\n4.1 Observation with oral Questioning\n4.2 Interview\n4.3 Portfolio\n\n5.\nResource\nImplication\nThe following resources MUST be provided:\n5.1 Tools\n5.2 Computers and peripherals\n5.3 Test instruments\n5.4 Materials\n5.5 PPE\n5.6 Technical manuals\n6.\nContext of\nAssessment\nAssessment may be conducted in the workplace or in a simulated\nenvironment\n\n--- PDF PAGE 56 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n54"
        },
        "source_text": "ELC724334\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes needed to\nmaintain and service computer systems and networks.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the range of Variables\n1. Plan and prepare for\nmaintenance and repair\n1.1. Maintenance and/or Diagnosis of faults is planned\nand prepared in line with job requirements.\n1.2. Tools, equipment and testing devices needed for\nthe maintenance are obtained and checked for\ncorrect operation and safety\n1.3. Materials necessary to complete the work are\nobtained in accordance with established procedures\nand checked against job requirements.\n1.4. OHS policies and procedures are followed in line\nwith job requirements.\n1.5. Computer systems and networks for maintenance\nare checked against job/service order or instructions\nand specifications.\n\n2. Maintain computer\nsystems and networks\n2.1. Appropriate personal protective equipment is\nused in line with standard procedures.\n2.2. Normal function of computer systems and networks\nare checked in accordance with manufacturer’s\ninstructions.\n2.3. Scheduled/periodic maintenance is performed in\naccordance with manufacturer’s requirements.\n2.4. Where necessary, needed repairs/replacements are\nmade in accordance with established procedures.\n2.5. Unplanned events or conditions are responded to in\naccordance with established procedures\n\n3. Diagnose faults of\ncomputer systems and\nnetworks\n3.1. Appropriate personal protective equipment is used\nin line with standard procedures.\n3.2. Faults or problems in the computer systems and\nnetworks are diagnosed according to requirements\nand in line with the standard procedures.\n3.3. Contingency measures are managed and\nimplemented in accordance with established\nprocedures\n3.4. Unplanned events or conditions are responded to in\naccordance with established procedures\n\n--- PDF PAGE 52 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n50\n\n4. Rectify/correct defects\nin computer systems\nand networks\n4.1. Appropriate personal protective equipment is used\nin line with standard procedures.\n4.2. Defective components or parts are replaced or\ncorrected without damage to the surrounding\nenvironment or services\n4.3. Adjustments, if necessary are made in accordance\nwith established procedures\n4.4. Unplanned events or conditions are responded to in\naccordance with established procedures.\n\n5. Inspect and test the\ncomputer systems and\nnetworks\n5.1. Final inspections are undertaken to ensure that the\ntesting conducted on the device conforms with the\nmanufacturer’s instruction/manual\n5.2. Computer systems and networks are\nchecked/tested to ensure safe operation.\n5.3. OHS standards and 5S principles are followed\naccording to enterprise policies\n5.4. Work site is cleaned and cleared of all debris and\nleft in safe condition in accordance with company\nprocedures\n5.5. Excess components and materials are disposed of based\non WEEE directives and 3Rs waste management\nprogram.\n5.6. Report is prepared and completed according to\ncompany requirements\n\n--- PDF PAGE 53 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n51\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools\nTools for: cutting, shaping, drilling, threading, tapping,\nfinishing, dismantling, and assembling. Tool set includes but\nnot limited to:\n1.1. Pliers (assorted)\n1.2. Screw drivers (assorted)\n1.3. Special tools\n1.4. Soldering iron/gun\n1.5. Wrenches\n1.6. Utility knife/stripper\n1.7. Hot air soldering station\n1.8. LAN Tester\n1.9. Crimping tools\n2. Equipment and testing\ndevices\n2.1. Equipment includes but not limited to:\n2.1.1. Maintenance bench\n2.1.2. Power supply equipment\n2.2. Testing devices include but not limited to:\n2.2.1. Multi-meter\n2.2.2. Calibrators\n2.2.3. Signal generator\n2.2.4. Oscilloscope\n2.2.5. Appropriate software\n3. Materials\nIncludes but not limited to:\n3.1. disks\n3.2. Connectors\n3.3. Adaptors\n3.4. Wires and cables\n3.5. Appropriate software\n3.6. Computer storage media\n4. OH & S policies and\nprocedures\n4.1. OH & S guidelines\n4.2. Philippine environmental standards\n5. Computer systems and\nnetworks\nIncludes but not limited to:\n5.1. Servers\n5.2. peripherals\n5.3. desktop computers\n5.4. network devices\n5.5. cables and connection\n6. Personal protective\nequipment\nIncludes but not limited to:\n6.1. Goggles/glasses\n6.2. Mask\n6.3. Gloves\n6.4. Anti-static wrist wrap\n7. Maintenance\n7.1. Software updates\n7.2. Hard disk maintenance\n7.3. File back-up/Restoration\n8. Faults and problems\n8.1. Network connectivity\n8.2. Software issues\n8.3. Hardware issues\n\n--- PDF PAGE 54 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n52\nEVIDENCE GUIDE\n\n1.\nCritical aspect of\ncompetency\nAssessment must show that the candidate:\n1.1\nPlanned and prepared for maintenance and repair.\n1.2\nMaintained computer systems and networks\n1.3\nDiagnosed faults of computer systems\n1.4\nRectified/corrected defects in computer systems and networks\n1.5\nInspected and tested the computer systems and networks\n2.\nUnderpinning\nknowledge\nIncludes but not limited to:\n2.1 Planning and preparing for maintenance\n2.2 Computer systems maintenance procedures\n2.2.1 PC systems\n2.2.2 Computer operations\n2.2.3 Electronic fault findings\n2.3 Use and operation of tools, instruments and testing devices\n2.4 Occupational health and safety policies and procedures\n2.5 Job service order forms or checklist\n2.6 Problem solving in emergency situation\n2.7 Procedures in maintenance scheduling\n2.8 Preventive maintenance of computer system and network\n2.8.1 Operating system update\n2.8.2 Back-up scheduling\n2.8.3 Creating restore point\n2.8.4 Guarding against virus\n2.8.5 Cleaning computer systems and networks\n2.9 Diagnostic procedures\n2.10 Identifying and isolating faults/problems\n2.10.1 Diagnostic software utilities\n2.10.2 Gathering of information\n2.11 Accomplished forms\n2.11.1 Diagnostic reports\n2.11.2 Proposal reports\n2.12 Defects in computer systems and networks\n2.13 Troubleshooting and repair techniques\n2.14 Problem solving in emergency situation\n2.15 Corrective action\n2.15.1 Hardware configuration\n2.15.2 Software configuration\n2.16 Testing methods and procedures\n2.17 Documentation and making reports\n2.18 Waste management\n2.19 OHS standards and 5S principles\n2.20 Practicing 3Rs – reduce, re-use, recycle/recover\n2.21 3Rs environmental policies\n2.22 Managing waste from electrical and electronic equipment (WEEE)\n\n3.\nUnderpinning\nskills\n3.1 Reading skills required to interpret work instructions\n3.2 Communication skills needed to interpret and define work\nprocedures\n3.3 Problem solving in emergency situation\n3.4 Network Cabling\n3.5 Connecting computers to wired and wireless LAN\n3.6 Removing viruses from infected machines\n\n--- PDF PAGE 55 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n53\n4.\nMethod of\nassessment\nThe assessor must select two of the following assessment methods to\nobjectively assess the candidate:\n4.1 Observation with oral Questioning\n4.2 Interview\n4.3 Portfolio\n\n5.\nResource\nImplication\nThe following resources MUST be provided:\n5.1 Tools\n5.2 Computers and peripherals\n5.3 Test instruments\n5.4 Materials\n5.5 PPE\n5.6 Technical manuals\n6.\nContext of\nAssessment\nAssessment may be conducted in the workplace or in a simulated\nenvironment\n\n--- PDF PAGE 56 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n54"
      }
