        "evidence_guide": {
          "source_text": "1 Critical aspects of\ncompetency\n1.1\nAssessment must show that the candidate:\n1.2\nSelected and used hardware components correctly and\naccording to the task requirement\n1.3\nused basic software applications to create new files and\ndocuments\n1.4\nProduced accurate and complete data in accordance with\nthe requirements\n1.5\nUsed appropriate devices and procedures to transfer\nfiles/data accurately\n1.6\nUsed basic functions of a www-browser to locate\ninformation.\n2 Underpinning\nknowledge\n2.1\nBasic ergonomics of keyboard and computer user\n2.2\nMain types of computers and basic features of different\noperating systems\n2.3\nMain parts of a computer\n2.4\nStorage devices and basic categories of memory\n2.5\nRelevant types of software\n2.6\nGeneral security, privacy legislation and copyright\n2.7\nViruses\n2.8\nOH & S principles and responsibilities\n2.9\nCalculating computer capacity\n2.10 Productivity Application\n2.11 Business Application\n2.12 System Software\n3 Underpinning\nskills\n3.1\nReading and comprehension skills required to interpret\nwork instruction and to interpret basic user manuals.\n3.2\nCommunication skills to identify lines of communication,\nrequest advice, follow instructions and receive feedback.\n3.3\nTechnology skills to use equipment safely including\nkeyboard skills.\n4 Method of\nassessment\nThe assessor may select two of the following assessment\nmethods to objectively assess the candidate:\n4.1\nDirect Observation and Oral Questioning\n4.2\nPractical demonstration\n5 Resource\nimplication\n5.1\nComputer hardware with peripherals\n5.2\nAppropriate software\n6 Context of\nAssessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 23 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n21\n\nUNIT TITLE\n:\nPERFORM MENSURATION AND CALCULATION\nUNIT CODE\n:"
        },
        "source_text": "ELC311203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, attitudes and values\nneeded to perform computer operations which include\ninputting, accessing, producing and transferring data using the\nappropriate hardware and software.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntask to be taken\nundertaken\n1.1. Requirements of task are determined in accordance\nwith the required output.\n1.2. Appropriate hardware and software are selected\naccording to task assigned and required outcome.\n1.3. Task is planned to ensure that OH & S guidelines\nand procedures are followed.\n1.4. Client -specific guidelines and procedures are\nfollowed.\n1.5. Required data security guidelines are applied in\naccordance with existing procedures.\n2. Input data into\ncomputer\n2.1. Data are entered into the computer using\nappropriate program/application in accordance with\ncompany procedures.\n2.2. Accuracy of information is checked and information\nis saved in accordance with standard operating\nprocedures.\n2.3. Inputted data is stored in storage media according\nto requirements.\n2.4. Work is performed within ergonomic guidelines.\n3. Access information\nusing computer\n3.1. Correct program/application is selected based on\njob requirements.\n3.2. Program/application containing the information\nrequired is accessed according to company\nprocedures.\n3.3. Desktop icons are correctly selected, opened and\nclosed for navigation purposes.\n3.4. Keyboard techniques are carried out in line with OH\n& S requirements for safe use of keyboards.\n\n--- PDF PAGE 20 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n18\n\n4. Produce output/ data\nusing computer system\n4.1. Entered data are processed using appropriate\nsoftware commands.\n4.2. Data are printed out as required using computer\nhardware /peripheral devices in accordance with\nstandard operating procedures.\n4.3. Files and data are transferred between compatible\nsystems using computer software,\nhardware/peripheral devices in accordance with\nstandard operating procedures.\n5. Use basic functions of\na www-browser to\nlocate information\n5.1. Information requirements for internet search are\nestablished.\n5.2. Browser is launched.\n5.3. Search engine is loaded.\n5.4. Appropriate search criteria/or URL of site is entered.\n5.5. Relevant links are followed to locate required\ninformation.\n5.6. Useful pages are bookmarked or printed as\nrequired.\n6. Maintain computer\nequipment and\nsystems\n6.1. Procedures for ensuring security of data, including\nregular back-ups and virus checks are implemented\nin accordance with standard operating procedures.\n6.2. Basic file maintenance procedures are\nimplemented in line with the standards operating\nprocedures.\n\n--- PDF PAGE 21 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Hardware and\nperipheral devices\n1.1 Personal computers\n1.2 Networked systems\n1.3 Communication equipment\n1.4 Printers\n1.5 Scanners\n1.6 Keyboard\n1.7 Mouse\n1.8\nVoice/Data logger\n2 Software\nSoftware includes the following but not limited to:\n2.1 Word processing packages\n2.2 Database packages\n2.3 Internet\n2.4 Spreadsheets\n2.5\nClient Specific Software\n3 OH & S guidelines\n3.1 OHS guidelines\n3.2\nEnterprise procedures\n4 Storage media\nStorage media include the following but not limited to:\n4.1 Diskettes\n4.2 CDs\n4.3 Zip disks\n4.4 hard disk drives, local and remote\n4.5\nOptical drives\n5 Ergonomic guidelines\n5.1 Types of equipment used\n5.2 Appropriate furniture\n5.3 Seating posture\n5.4 Lifting posture\n5.5\nVisual display unit screen brightness\n6 Desktop icons\nIcons include the following but not limited to:\n6.1 Directories/folders\n6.2 Files\n6.3 Network devices\n6.4 Recycle bin\n6.5\nProgram icons\n7 Maintenance\n7.1 Creating and managing more space in the hard disk\nand other peripherals\n7.2 Reviewing programs\n7.3 Deleting unwanted files\n7.4 Backing up files\n7.5 Checking hard drive for errors\n7.6 Using up to date anti-virus programs\n7.7\nCleaning dust from internal and external surfaces\n\n--- PDF PAGE 22 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n20\n\nEVIDENCE GUIDE\n\n1 Critical aspects of\ncompetency\n1.1\nAssessment must show that the candidate:\n1.2\nSelected and used hardware components correctly and\naccording to the task requirement\n1.3\nused basic software applications to create new files and\ndocuments\n1.4\nProduced accurate and complete data in accordance with\nthe requirements\n1.5\nUsed appropriate devices and procedures to transfer\nfiles/data accurately\n1.6\nUsed basic functions of a www-browser to locate\ninformation.\n2 Underpinning\nknowledge\n2.1\nBasic ergonomics of keyboard and computer user\n2.2\nMain types of computers and basic features of different\noperating systems\n2.3\nMain parts of a computer\n2.4\nStorage devices and basic categories of memory\n2.5\nRelevant types of software\n2.6\nGeneral security, privacy legislation and copyright\n2.7\nViruses\n2.8\nOH & S principles and responsibilities\n2.9\nCalculating computer capacity\n2.10 Productivity Application\n2.11 Business Application\n2.12 System Software\n3 Underpinning\nskills\n3.1\nReading and comprehension skills required to interpret\nwork instruction and to interpret basic user manuals.\n3.2\nCommunication skills to identify lines of communication,\nrequest advice, follow instructions and receive feedback.\n3.3\nTechnology skills to use equipment safely including\nkeyboard skills.\n4 Method of\nassessment\nThe assessor may select two of the following assessment\nmethods to objectively assess the candidate:\n4.1\nDirect Observation and Oral Questioning\n4.2\nPractical demonstration\n5 Resource\nimplication\n5.1\nComputer hardware with peripherals\n5.2\nAppropriate software\n6 Context of\nAssessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 23 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n21\n\nUNIT TITLE\n:\nPERFORM MENSURATION AND CALCULATION\nUNIT CODE\n:"
