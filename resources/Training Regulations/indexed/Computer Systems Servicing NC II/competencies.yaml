ibing and identifying semiconductor diode 2.4.24 testing semiconductor diode --- PDF PAGE 39 --- ___________________________________________________________________________________ TR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013 37 2.4.25 analyzing rectifier circuits 2.4.26 describing and identifying bipolar transistor 2.4.27 testing bipolar transistor 2.4.28 analyzing amplifier circuit 2.4.29 analyzing multi-vibrator circuit 2.4.30 describing and analyzing digital gate 2.4.31 testing logic gates 2.4.32 analyzing logic networks 2.4.33 analyzing sequence circuits 3 Required skills 3.1 Work efficiently & systematically 3.2 Communication skills 3.3 Use and maintenance of tools and equipment 3.4 Skills in testing electronic components 3.5 Work safety practices and time management 3.6 Problem solving skills 3.7 Reading skills 4 Method of assessment Competency may be assessed through two or more of the following methods: 4.1 Direct observation of application to tasks and questions related to required knowledge 4.2 Demonstration with oral questioning 4.3 Third party report 4.4 Written test 4.5 Portfolio 5 Resource implications The following resources must be provided: 5.1 Tools and equipment (see range of variables) 5.2 Working area/bench 5.3 Electronic components 5.4 Testing instruments and equipment 5.5 Assessment rating sheet 5.6 Reporting forms 6 Context of assessment 6.1 Assessment maybe conducted in the workplace or in a simulated workplace setting --- PDF PAGE 40 --- ___________________________________________________________________________________ TR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013 38 CORE COMPETENCIES UNIT TITLE : INSTALL AND CONFIGURE COMPUTER SYSTEMS UNIT CODE :"
