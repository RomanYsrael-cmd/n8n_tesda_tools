cords system are evaluated based on \nstandard procedures \n4.3 \nTest results/findings are documented for subsequent \ncomponents testing.\n\n--- PDF PAGE 36 ---\n___________________________________________________________________________________ \nTR - COMPUTER SYSTEMS SERVICING NC II                                          Amended - December 2013 \n34\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Responsible person \nRelevant personnel may include: \n1.1. Immediate supervisor \n1.2. Manager \n2. Testing criteria  \nTesting criteria may include: \n2.1. controls \n2.2. effectiveness \n2.3. efficiency \n2.4. bug detection \n2.5. functionality, including flow \n2.6. interoperability \n2.7. performance \n2.8. reliability \n2.9. operating parameters \n3. Testing methods  \nTesting methods may include: \n3.1. automated \n3.2. debugging \n3.3. inspection \n3.4. platform testing \n3.5. prototyping \n4. Types of electronic \ncomponents \n4.1. Passive components \n4.2. Active components \n4.3. Dynamic components \n4.4. Hybrid components \n5. Testing strategy  \nTesting strategy may be determined by: \n5.1. Passive testing \n5.2. Dynamic testing \n5.3. In-circuit testing \n6. Test and measuring \ninstruments \nTest and measuring instruments may include: \n6.1. Variable DC power supply \n6.2. Digital VOM \n6.3. analog VOM \n6.4. dual trace triggered oscilloscope \n6.5. function generator \n7. Tools  \nTools may include: \n7.1. set of pliers \n7.2.  set of screw drivers \n7.3. set of wrenches \n7.4.  Hand drills, \n7.5.  Hack saw \n7.6.  set of files \n7.7.  tin snip \n7.8. hammer\n\n--- PDF PAGE 37 ---\n___________________________________________________________________________________ \nTR - COMPUTER SYSTEMS SERVICING NC II                                          Amended - December 2013 \n35\n \n8. Records system \nRecords system may include: \n8.1. metadata that includes: \n8.1.1. description of fault \n8.1.2. identification of code \n8.1.3. user responses \n8.1.4. written or verbal comments \n8.1.5. quantitative data \n8.1.6. remedial action taken \n8.1.7. retest result \n8.1.8. date \n8.1.9. tester's details \n8.2. questionnaire \n8.3. survey\n\n--- PDF PAGE 38 ---\n___________________________________________________________________________________ \nTR - COMPUTER SYSTEMS SERVICING NC II                                          Amended - December 2013 \n36"
