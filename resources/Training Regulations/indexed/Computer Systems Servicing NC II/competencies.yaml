        "source_title": "SET-UP COMPUTER NETWORKS",
        "source_text": "--- PDF PAGE 44 ---\n___________________________________________________________________________________ \nTR - COMPUTER SYSTEMS SERVICING NC II                                          Amended - December 2013 \n42\nUNIT TITLE \n: \nSET-UP COMPUTER NETWORKS \nUNIT CODE \n: \nELC724332 \nUNIT DESCRIPTOR     : \nThis unit covers the outcomes required in setting-up computers \nnetworks for LANs and small-office home-office (SOHO) \nsystems. It consists of competencies to install network cables, \nset network configuration, set router/Wi-Fi/ wireless access \npoint/repeater configuration as well as to inspect and test the \nconfigured computer networks. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized items are elaborated in the range of Variables \n1 \nInstall network \ncables \n1.1 Cable routes are determined and planned in accordance \nwith network design and actual installation site. \n1.2 Network materials necessary to complete the work are \nidentified and obtained in accordance with established \nprocedures and checked against systems requirements  \n1.3 Tools, equipment and testing devices needed to carry \nout the installation work are obtained in accordance with \nestablished procedures and checked for correct \noperation and safety  \n1.4 Appropriate personal protective equipment is used \nand OHS policies and procedures are followed \n1.5 Copper cable splicing  is performed based on Electronic \nIndustries Alliance/Telecommunications Industry \nAssociation (EIA/TIA) standards \n1.6 Network cables and cable raceway are installed in \naccordance with established procedures and installation \nrequirements \n1.7 Installation work is performed and is checked to ensure \nno unnecessary damage has occurred and complies with \nrequirements \n1.8 OHS standards and 5S principles are followed according \nto enterprise requirements  \n1.9 Excess components and materials are disposed of based on \nWEEE directives and 3Rs waste management program.\n2 \nSet network \nconfiguration  \n2.1 Network connectivity of each terminal is checked in \naccordance with network design. \n2.2 Any fault or problem in the network system is diagnosed \nand remedied in line with the standard operating \nprocedures. \n2.3 Network interface card (NIC) settings are configured in \naccordance with network design. \n2.4 Communication checking between terminals are carried \nout in accordance with OS network configuration guides \n2.5 Unplanned events or conditions are responded to in \naccordance with established procedures\n\n--- PDF PAGE 45 ---\n___________________________________________________________________________________ \nTR - COMPUTER SYSTEMS SERVICING NC II                                          Amended - December 2013 \n43\n \n3 \nSet router/Wi-Fi/ \nwireless access \npoint/repeater \nconfiguration \n3.1 Client Device systems settings are configured in \naccordance with manufacturers’ instructions and end-\nuser preferences \n3.2 Local area network (LAN) port is configured in \naccordance with manufacturers’ instructions and network \ndesign \n3.3 Wide area network (WAN) port is configured in \naccordance with manufacturers’ instructions and network \ndesign  \n3.4 Wireless settings are configured in accordance \nmanufacturers’ instructions, network design and end-user \npreferences \n3.5 Security/Firewall/Advance settings are configured in \naccordance with manufacturers’ instructions and end-\nuser preferences  \n \n4 \nInspect and test \nthe configured \ncomputer \nnetworks \n4.1 Final inspections are undertaken to ensure that the \nconfiguration done on the computer networks conforms \nwith the manufacturer’s instruction/manual \n4.2 Computer networks are checked to ensure safe \noperation. \n4.3 Reports are prepared/completed according to company \nrequirements.\n\n--- PDF PAGE 46 ---\n___________________________________________________________________________________ \nTR - COMPUTER SYSTEMS SERVICING NC II                                          Amended - December 2013 \n44\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Network design \nMay include: \n1.1 \nNetwork topology \n1.2\nDistribution terminals\n2. Network materials \n2.1 \nCables \n2.1.1 Fiber optics  \n2.1.2 copper  \n2.2 \nterminals \n2.3 \ncable raceway/duct \n2.4 \nclamps \n2.5 \nfasteners \n2.6 \ninsulators \n2.7\nterminal box\n3. Tools, equipment and testing \ndevices \n3.1 \nProtective eyewear \n3.2 \nDigital multi-meter \n3.3 \nWire stripper with bolt cutter \n3.4 \nPliers (assorted) \n3.5 \nScrew drivers (assorted) \n3.6 \nLAN Tester \n3.7\nCrimping tools\n4. Appropriate personal \nprotective equipment \n4.1 \nGloves \n4.2 \nGoggles \n4.3\nWorking clothes\n5. OH&S policies and \nprocedures \n5.1 \nOccupational Health and Safety Laws \n5.2 \nPersonal Safety \n5.3 \nWorkplace Hazards \n5.4\nEnvironment Laws\n6. Splicing  \n6.1 \nstraight-through \n6.2 \ncross-talk \n6.3\nroll-over\n7. network cables \n7.1 \ncopper cable \n7.2\nfiber optic cable (terminated)\n8. Cable raceway \n8.1 \nslotted PVC \n8.2 \nmetallic raceway \n8.3\nflexible conduit\n9. Client device \n9.1 \nLaptop \n9.2 \nDesktop \n9.3 \nNetwork storage \n9.4\nNetwork printer\n10. installation requirement \n10.1 \nother requirements for fiber optic cable \ninstallation\n\n--- PDF PAGE 47 ---\n___________________________________________________________________________________ \nTR - COMPUTER SYSTEMS SERVICING NC II                                          Amended - December 2013 \n45\nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment must show that the candidate: \n1.1. \nInstalled network cables  \n1.2. \nSet network configuration \n1.3. \nSet router/Wi-Fi/ wireless access point/repeater configuration \n1.4.\nInspected and tested the configured computer networks  \n2. Underpinning \nknowledge \n2.1. \nComputer network concepts \n2.2. \nNetwork cable installation \n2.3. \nCopper cable splicing and cable testing \n2.4. \nFiber optic cables splicing and installation requirements \n2.5. \nnetwork design \no addressing \no subnetting \no topology \n2.6. \nIPV4 and IPV6 \n2.7. \nRouter/Wi-Fi/ wireless access point/repeater configuration  \n2.8. \nNetwork interface card (NIC) settings \n2.9. \nnetwork cables \n2.10. cable raceways/ducts \n2.11. Device systems settings configuration \n2.12. Local area network (LAN) port configuration  \n2.13. Wide area network (WAN) port configuration  \n2.14. Wireless settings configuration  \n2.15. Security/Firewall/Advance settings configuration \n2.16. Cloud computing \n2.17. Network connectivity testing \n2.18. Philippine Electrical Code relevant to data connection \n2.23. OHS standards and 5S principles \n2.24. Practicing 3Rs – reduce, re-use, recycle/recover \n2.25. 3Rs environmental policies \n2.19.\nManaging waste from electrical and electronic equipment (WEEE) \n3. Underpinning \nskills \n3.1. \nCable splicing \n3.2. \nCable troubleshooting \n3.3. \nSetting-up and configuring skills \n3.4. \nProblem solving skills \n3.5. \nDecision making skills \n3.6.\nDocumentation skills \n4. Method of \nassessment \nThe assessor may select any two of the following assessment methods \nto objectively assess the candidate: \n4.1. \nPractical Demonstration w/ oral questioning \n4.2. \nInterview  \n4.3. \nThird Party \n4.4.\nPortfolio \n5. Resource \nImplications \nThe following resources MUST be provided: \n5.1. \nPC or workstation \n5.2. \nNetwork cables and materials \n5.3. \nRouter/Wi-Fi/ wireless access point/repeater  \n5.4. \nTools and test instruments \n5.5. \nAppropriate software applications/programs \n5.6.\nPPE \n6. Context of \nAssessment \n6.1. \nAssessment may be conducted in the workplace or in a simulated \nenvironment\n",
