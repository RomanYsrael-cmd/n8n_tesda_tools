        "source_text": "--- PDF PAGE 40 ---\n___________________________________________________________________________________ \nTR - COMPUTER SYSTEMS SERVICING NC II                                          Amended - December 2013 \n38\n \nCORE COMPETENCIES \n \nUNIT TITLE \n: \nINSTALL AND CONFIGURE COMPUTER SYSTEMS  \nUNIT CODE \n: \nELC724331 \nUNIT DESCRIPTOR     : \nThis unit covers the outcomes required in installing and \nconfiguring desktop and workstation computers systems. It \nconsists of competencies to assemble computer hardware, \ninstall operating system and drivers for peripherals/devices, \nand install application software as well as to conduct testing \nand documentation. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  terms are elaborated in the Range of Variables \n1 Assemble computer \nhardware \n1.1 Unit assembly is planned and prepared to ensure OH&S \npolicies and procedures are followed in accordance \nwith systems requirements  \n1.2 Materials necessary to complete the work are identified \nand obtained in accordance with established procedures \nand checked against systems requirements  \n1.3 Tools, equipment and testing devices needed to carry \nout the installation work are obtained in accordance with \nestablished procedures and checked for correct \noperation and safety  \n1.4 Computer hardware is assembled in accordance with \nestablished procedures and systems requirements  \n1.5 Basic-input-output-system (BIOS) configuration is \nperformed in accordance with hardware requirements.\n2 Prepare installer \n2.1 Portable bootable devices are created in accordance \nwith software manufacturer instruction \n2.2 Customized installers are prepared in accordance with \nsoftware utilization guide and end user agreement. \n2.3 Installation of portable applications are carried out in \naccordance with software user guide and software \nlicense\n3 Install operating \nsystem and drivers \nfor peripherals/ \ndevices \n3.1 Operating system (OS) is installed in accordance with \nestablished installation procedures and to comply \nwith end-user requirements  \n3.2 Peripherals/devices drivers are installed and \nconfigured in accordance with manufacturer’s \ninstructions and/or OS installation procedures.  \n3.3 OS and drivers updates/patches are accessed and \ninstalled in accordance with manufacturer’s \nrecommendations and requirements  \n3.4 On-going checks of the quality of the work are \nundertaken in accordance with established procedures\n\n--- PDF PAGE 41 ---\n___________________________________________________________________________________ \nTR - COMPUTER SYSTEMS SERVICING NC II                                          Amended - December 2013 \n39\n \n4 Install application \nsoftware  \n4.1 Application software are installed based on software \ninstallation guides, end-user requirements and software \nlicense agreement \n4.2 Variation to application software installation is carried \nout in accordance to customer/client requirements  \n4.3 Software updates are accessed and installed in \naccordance with manufacturer’s recommendations and \nrequirements\n5 Conduct testing and \ndocumentation  \n5.1 Devices / systems and/or installation is tested to \ndetermine whether it conforms to requirements  \n5.2 Stress test is conducted to ensure reliability of \nequipment in accordance with manufacturer’s \ninstructions and system requirements \n5.3 5S and 3Rs are followed according to environmental \npolicies  \n5.4 Documentation in relation to the test is forwarded to \nappropriate personnel and/or authority in accordance \nwith requirements\n\n--- PDF PAGE 42 ---\n___________________________________________________________________________________ \nTR - COMPUTER SYSTEMS SERVICING NC II                                          Amended - December 2013 \n40\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. OH&S policies and \nprocedures \n1.1 \nOccupational Health and Safety Laws \n1.2 \nPersonal Safety \n1.3 \nWorkplace Hazards \n1.4\nEnvironment Laws \n2. Tools, equipment and \ntesting devices \n2.1 \nProtective eyewear \n2.2 \nDigital multi-meter \n2.3 \nWire stripper with bolt \ncutter \n2.4 \nPliers (assorted) \n2.5 \nScrew drivers \n(assorted) \n2.6 \nSoldering iron \n2.7 \nDesoldering tool \n2.8 \nAllen wrench (0.05 – \n0.25 inch) \n2.9\nFlashlight \n2.10 \nIC insertion/extraction \ntool \n2.11 \nMirror (inspection) \n2.12 \nRS 232 pin \ninsertion/extraction \ntool \n2.13 \nSharp pointed \ntweezers \n2.14 \nAntistatic wrist wrap \n2.15 \nLAN Tester \n2.16 \nCrimping tools \n3. Computer hardware \n3.1 \nMotherboard \n3.2 \nHard disk \n3.3 \nVideo card \n3.4\nSound card\n3.5 \nOptical disc drives \n3.6 \nMemory modules \n3.7 \nPower supply \n3.8\nCables and cords\n4. Operating system \n4.1 \nWindows \n4.2 \nMAC OS X \n4.3\nLinux \n5. Established installation \nprocedures \n5.1 \nAutomatic installation \n5.2 \nCustom installation \n5.3 \nInstallation from optical devices \n5.4 \nInstallation from portable devices \n5.5\nInstallation via network \n6. Peripherals/devices \n6.1 \nPrinter \n6.2 \nScanner \n6.3 \nInterface cards \n6.3.1 \nTV tuner \n6.3.2 \nvideo card \n6.3.3 \nsound card \n7. Application software \n7.1 \nProductivity tools \n7.2 \nUtilities \n7.2.1 Anti-virus \n7.2.2 Virtualization software \n7.2.3 Disk management software \n7.2.4 Optical disk burning tool \n7.3\nGames\n8. Stress test \nIncludes stress test on: \n8.1 \nprocessor \n8.2 \nvideo card \n8.3 \nmemory \n8.4\nhard disk\n\n--- PDF PAGE 43 ---\n___________________________________________________________________________________ \nTR - COMPUTER SYSTEMS SERVICING NC II                                          Amended - December 2013 \n41\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment must show that the candidate: \n1.1. \nAssembled computer hardware  \n1.2. \nInstalled operating system and drivers for peripherals/devices  \n1.3. \nInstalled application software  \n1.4.\nConducted testing and documentation  \n2. Underpinning \nknowledge \n2.1. \nTypes and parts of computers  \n2.2. \nComputer operating systems  \n \nWindows / MAC OS X /Linux \n2.3. \nPeripheral devices \n2.4. \nComputer systems design \n2.5. \nComputer assembly procedures \n2.6. \nInstallers preparation and OS installation procedures \n2.7. \nApplication and devices/drivers installation procedures \n2.8. \nDesktop PC interface/ hook up procedures \n2.9. \nPower ON self-test and BIOS configuration procedures \n2.10. Application packages & use of application programs  \n2.11. Multimedia systems \n2.12. Motherboards \n2.13. Multimedia storage devices:  \n2.14. Video cards \n2.15. Sound cards   \n2.16. Graphical user interface \n2.17. Disk management \n2.18. Use of utilities/software \n \nVirtualization software \n \nDisk management software \n \nAnti-virus / Diagnostic software \n \nDevice drivers \n2.19. Drivers/Software update procedures \n2.20. Application software license agreements \n2.21. Stress testing procedures \n2.22.\n5S and 3Rs environmental policies \n3 \nUnderpinning \nskills \n3.1 \nSafety handling of computer parts \n3.2 \nAssembling computer hardware \n3.3 \nTroubleshooting skills \n3.4 \nReading and writing skills \n4 \nMethod of \nassessment \nThe assessor may select any two of the following assessment methods to \nobjectively assess the candidate: \n4.1 \nPractical Demonstration w/ oral questioning \n4.2 \nInterview  \n4.3\nPortfolio\n5 \nResource \nImplications \nThe following resources MUST be provided: \n5.1 \nTools and test instruments \n5.2 \nPC or workstation \n5.3 \nComputer peripherals/devices \n5.4 \nAppropriate OS, drivers and software applications/programs \n6 \nContext of \nAssessment \n6.1 \nAssessment may be conducted in the workplace or in a simulated \nenvironment\n",
