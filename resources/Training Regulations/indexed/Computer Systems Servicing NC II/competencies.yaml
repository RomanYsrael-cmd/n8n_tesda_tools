          "source_text": "1. Critical aspects of\ncompetency\nAssessment must show that the candidate:\n1.1.\nSet-up user access\n1.2.\nConfigured network services\n1.3.\nPerformed testing, documentation and pre-\ndeployment procedures\n2. Underpinning knowledge\n2.1.\nNetwork operating system (NOS) features\n2.2.\nComputer servers and functions\n2.3.\nTypes of Network services\n2.4.\nUser access level configuration\n2.5.\nNetwork services configuration\n2.5.1. configuring web services\n2.5.2. configuring file sharing services\n2.5.3. configuring print sharing services\n2.6.\nWeb applications/technologies\n2.7.\nSetting-up client/user access and security\n2.8.\nSetting-up and configuring servers\n2.9.\nInstalling and configuring modules/add-ons\n2.10. Configuration of network services\n2.11. Testing procedures\n2.12. Pre-deployment procedures and practices\n2.13. Enterprise policies and procedures\n2.14. End user requirements\n2.15. Enterprise policies and procedures\n2.16. Documentation and making reports\n3. Underpinning skills\n3.1.\nSetting-up and configuring servers\n3.2.\nProblem solving skills\n3.3.\nDecision making skills\n3.4.\nReading and writing skills\n4. Method of assessment\nThe assessor may select any two of the following\nassessment methods to objectively assess the\ncandidate:\n4.1.\nPractical Demonstration w/ oral questioning\n4.2.\nInterview\n4.3.\nPortfolio\n\n5. Resource Implications\nThe following resources MUST be provided:\n5.1.\nPC or workstation network and server\n5.2.\nNetwork operating system (NOS)\n5.3.\nNetwork printer\n5.4.\nTools and test instruments\n5.5.\nAppropriate software applications/programs\n\n6. Context of Assessment\n6.1.\nAssessment may be conducted in the workplace\nor in a simulated environment\n\n--- PDF PAGE 51 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n49\nUNIT TITLE\n:\nMAINTAIN AND REPAIR COMPUTER SYSTEMS AND\nNETWORKS\nUNIT CODE\n:"
