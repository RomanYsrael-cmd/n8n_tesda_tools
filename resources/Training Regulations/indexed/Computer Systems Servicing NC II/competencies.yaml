  "source_section_text": "SECTION 2\n\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the core units of competency\nrequired for COMPUTER SYSTEMS SERVICING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto gather, interpret and convey information in response to\nworkplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning, active listening and speaking skills are\nused to gather and convey information\n1.3\nAppropriate medium is used to transfer information and ideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and storage of\ninformation are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace forms and\ndocuments\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms,\nsafety reports\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures,\nsignals, signs and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 6 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n4\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using communication equipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the formal\nor informal communication\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1. Effective communication\n2.2. Different modes of communication\n2.3. Written communication\n2.4. Organizational policies\n2.5. Communication procedures and systems\n2.6. Technology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning Skills\n3.1. Follow simple spoken language\n3.2. Perform routine workplace duties following simple\nwritten notices\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Estimate, calculate and record routine workplace\nmeasures\n3.6. Basic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7. Ability to relate to people of social range in the\nworkplace\n3.8. Gather and provide information in response to\nworkplace Requirements\n4. Resource\nImplications\n4.1. Fax machine\n4.2. Telephone\n4.3. Writing materials\n4.4. Internet\n5. Methods of\nAssessment\n5.1. Direct Observation\n5.2. Oral interview and written test\n6. Context of\nAssessment\n6.1. Competency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 7 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n5\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to identify\nrole and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1. The role and objective of the team is identified from\navailable sources of information\n1.2. Team parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role and\nresponsibility within\nteam\n2.1. Individual role and responsibilities within the team\nenvironment are identified\n2.2. Roles and responsibility of other team members are\nidentified and recognized\n2.3. Reporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1. Effective and appropriate forms of communications\nused and interactions undertaken with team members\nwho contribute to known team activities and objectives\n3.2. Effective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3. Observed protocols in reporting using standard\noperating procedures\n3.4. Contribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 8 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n6\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective\nof team\n1.1. Work activities in a team environment with enterprise\nor specific sector\n1.2. Limited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n2. Sources of\ninformation\n2.1. Standard operating and/or other workplace\nprocedures\n2.2. Job procedures\n2.3. Machine/equipment manufacturer’s specifications and\ninstructions\n2.4. Organizational or external personnel\n2.5. Client/supplier instructions\n2.6. Quality standards\n2.7. OHS and environmental standards\n3. Workplace context\n3.1. Work procedures and practices\n3.2. Conditions of work environments\n3.3. Legislation and industrial agreements\n3.4. Standard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5. Safety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 9 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n7\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Operated in a team to complete workplace activity\n1.2. Worked effectively with others\n1.3. Conveyed information in written or oral form\n1.4. Selected and used appropriate workplace language\n1.5. Followed designated work plan for the job\n1.6. Reported outcomes\n2. Underpinning\nKnowledge and\nAttitude\n2.1. Communication process\n2.2. Team structure\n2.3. Team roles\n2.4. Group planning and decision making\n3. Underpinning Skills\n3.1. Communicate appropriately, consistent with the\nculture of the workplace\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2. Materials relevant to the proposed activity or tasks\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Observation of the individual member in relation to\nthe work activities of the group\n5.2. Observation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context for\nAssessment\n6.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 10 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n8\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1.\nIntegrate personal\nobjectives with\norganizational goals\n1.1 Personal growth and work plans are pursued\ntowards improving the qualifications set for the\nprofession\n1.2 Intra- and interpersonal relationships is are\nmaintained in the course of managing oneself based\non performance evaluation\n1.3 Commitment to the organization and its goal is\ndemonstrated in the performance of duties\n2.\nSet and meet work\npriorities\n2.1 Competing demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2 Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3 Practices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n3.\nMaintain professional\ngrowth and\ndevelopment\n3.1 Trainings and career opportunities are identified\nand availed of based on job requirements\n3.2 Recognitions are sought/received and\ndemonstrated as proof of career advancement\n3.3 Licenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 11 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n9\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 12 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n10\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nKnowledge\n2.1 Work values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.5 Personal hygiene practices\n3. Underpinning Skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context of\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 13 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n11\n\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE : 500311108\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1 Safety regulations and workplace safety and hazard\ncontrol practices and procedures are clarified and\nexplained based on organization procedures\n1.2 Hazards/risks in the workplace and their\ncorresponding indicators are identified to minimize or\neliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3 Contingency measures during workplace accidents,\nfire and other emergencies are recognized and\nestablished in accordance with organization\nprocedures\n2. Evaluate hazards and\nrisks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are identified\nbased on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and relevant\nworkplace OHS legislation\n3. Control hazards and\nrisks\n3.1 Occupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2 Procedures for dealing with workplace accidents, fire\nand emergencies are followed in accordance with\norganization OHS policies\n3.3 Personal protective equipment (PPE) is correctly\nused in accordance with organization OHS procedures\nand practices\n3.4 Appropriate assistance is provided in the event of a\nworkplace emergency in accordance with established\norganization protocol\n4. Maintain OHS\nawareness\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 14 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4 Ergonomics\n2.4.1 Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 Calling emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n5. Emergency-related\ndrills and training\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n6. OHS personal\nrecords\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 15 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n13\n\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nKnowledge and\nAttitude\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Underpinning\nSkills\n3.1 Practice of personal hygiene\n3.1 Hazards/risks identification and control skills\n3.2 Interpersonal skills\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 16 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n14\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:\nELC315202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, attitudes and values\nneeded to apply quality standards in the workplace. The unit\nalso includes the application of relevant safety procedures and\nregulations,\norganization\nprocedures\nand\ncustomer\nrequirements.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess quality of\nreceived materials\n1.1. Work instruction is obtained and work is carried out in\naccordance with standard operating procedures.\n1.2. Received materials are checked against workplace\nstandards and specifications.\n1.3. Faulty materials related to work are identified and\nisolated.\n1.4. Faults and any identified causes are recorded and/or\nreported to the supervisor concerned in accordance\nwith workplace procedures.\n1.5. Faulty materials are replaced in accordance with\nworkplace procedures.\n2. Assess own work\n2.1. Documentation relative to quality within the company\nis identified and used.\n2.2. Completed work is checked against workplace\nstandards relevant to the task undertaken.\n2.3. Errors are identified and isolated.\n2.4. Information on the quality and other indicators of\nproduction performance are recorded in accordance\nwith workplace procedures.\n2.5. In cases of deviations from specific quality standards,\ncauses are documented and reported in accordance\nwith the workplace’ s standards operating procedures.\n3. Engage in quality\nimprovement\n3.1. Process improvement procedures are participated in\nrelative to workplace assignment.\n3.2. Work is carried out in accordance with process\nimprovement procedures.\n3.3. Performance of operation or quality of product of\nservice to ensure customer satisfaction is monitored.\n\n--- PDF PAGE 17 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Materials\n1.1\nMaterials may include but not limited to:\n1.1.1. Manuals\n1.1.2. Job orders\n1.1.3. Instructional videos\n2 Faults\n2.1\nFaults may include but not limited to:\n2.1.1. Materials not to specification\n2.1.2. Materials contain incorrect/outdated\ninformation\n2.1.3. Hardware defects\n2.1.4. Materials that do not conform with any\nregulatory agencies\n3 Documentation\n3.1\nOrganization work procedures\n3.2\nManufacturer’s instruction manual\n3.3\nCustomer requirements\n3.4\nForms\n4 Errors\n4.1\nErrors may be related but not limited to the\nfollowing:\n4.1.1. Deviation from the requirements of the Client\n4.1.2. Deviation from the requirement of the\norganization\n5 Quality standards\n\n5.1\nQuality standards may be related but not limited to\nthe following:\n5.1.1. Materials\n5.1.2. Hardware\n5.1.3. Final product\n5.1.4. Production processes\n5.1.5. Customer service\n6 Customer\n6.1\nCo-worker\n6.2\nSupplier/Vendor\n6.3\nClient\n6.4\nOrganization receiving the product or service\n\n--- PDF PAGE 18 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n16\n\nEVIDENCE GUIDE\n\n1 Critical aspect of\ncompetency\nAssessment must show that the candidate:\n1.1 Carried out work in accordance with the company’s\nstandard operating procedures\n1.2 Performed task according to specifications\n1.3 Reported defects detected in accordance with\nstandard operating procedures\n1.4 Carried out work in accordance with the process\nimprovement procedures\n2 Underpinning\nknowledge\n2.1 Relevant production processes, materials and\nproducts\n2.2 Characteristics of materials, software and hardware\nused in production processes\n2.3 Quality checking procedures\n2.4 Workplace procedures\n2.5 Safety and environmental aspects of production\nprocesses\n2.6 Fault identification and reporting\n2.7 Quality improvement processes\n3 Underpinning skills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills needed to interpret and apply\ndefined work procedures\n3.3 Carry out work in accordance with OHS policies and\nprocedures\n3.4 Critical thinking\n3.5 Solution providing and decision-making\n4 Method of\nassessment\nThe assessor must select two of the following to\nobjectively evaluate the candidate:\n4.1 Observation and oral questioning\n4.2 Third party report\n4.3 Portfolio\n4.4 Practical demonstration\n5 Resource implication\n5.1 Materials, software and hardware to be used in a real\nor simulated situation\n6 Context of\nAssessment\n6.1 Assessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 19 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n17\n\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\n\nUNIT CODE\n:\nELC311203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, attitudes and values\nneeded to perform computer operations which include\ninputting, accessing, producing and transferring data using the\nappropriate hardware and software.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntask to be taken\nundertaken\n1.1. Requirements of task are determined in accordance\nwith the required output.\n1.2. Appropriate hardware and software are selected\naccording to task assigned and required outcome.\n1.3. Task is planned to ensure that OH & S guidelines\nand procedures are followed.\n1.4. Client -specific guidelines and procedures are\nfollowed.\n1.5. Required data security guidelines are applied in\naccordance with existing procedures.\n2. Input data into\ncomputer\n2.1. Data are entered into the computer using\nappropriate program/application in accordance with\ncompany procedures.\n2.2. Accuracy of information is checked and information\nis saved in accordance with standard operating\nprocedures.\n2.3. Inputted data is stored in storage media according\nto requirements.\n2.4. Work is performed within ergonomic guidelines.\n3. Access information\nusing computer\n3.1. Correct program/application is selected based on\njob requirements.\n3.2. Program/application containing the information\nrequired is accessed according to company\nprocedures.\n3.3. Desktop icons are correctly selected, opened and\nclosed for navigation purposes.\n3.4. Keyboard techniques are carried out in line with OH\n& S requirements for safe use of keyboards.\n\n--- PDF PAGE 20 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n18\n\n4. Produce output/ data\nusing computer system\n4.1. Entered data are processed using appropriate\nsoftware commands.\n4.2. Data are printed out as required using computer\nhardware /peripheral devices in accordance with\nstandard operating procedures.\n4.3. Files and data are transferred between compatible\nsystems using computer software,\nhardware/peripheral devices in accordance with\nstandard operating procedures.\n5. Use basic functions of\na www-browser to\nlocate information\n5.1. Information requirements for internet search are\nestablished.\n5.2. Browser is launched.\n5.3. Search engine is loaded.\n5.4. Appropriate search criteria/or URL of site is entered.\n5.5. Relevant links are followed to locate required\ninformation.\n5.6. Useful pages are bookmarked or printed as\nrequired.\n6. Maintain computer\nequipment and\nsystems\n6.1. Procedures for ensuring security of data, including\nregular back-ups and virus checks are implemented\nin accordance with standard operating procedures.\n6.2. Basic file maintenance procedures are\nimplemented in line with the standards operating\nprocedures.\n\n--- PDF PAGE 21 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Hardware and\nperipheral devices\n1.1 Personal computers\n1.2 Networked systems\n1.3 Communication equipment\n1.4 Printers\n1.5 Scanners\n1.6 Keyboard\n1.7 Mouse\n1.8\nVoice/Data logger\n2 Software\nSoftware includes the following but not limited to:\n2.1 Word processing packages\n2.2 Database packages\n2.3 Internet\n2.4 Spreadsheets\n2.5\nClient Specific Software\n3 OH & S guidelines\n3.1 OHS guidelines\n3.2\nEnterprise procedures\n4 Storage media\nStorage media include the following but not limited to:\n4.1 Diskettes\n4.2 CDs\n4.3 Zip disks\n4.4 hard disk drives, local and remote\n4.5\nOptical drives\n5 Ergonomic guidelines\n5.1 Types of equipment used\n5.2 Appropriate furniture\n5.3 Seating posture\n5.4 Lifting posture\n5.5\nVisual display unit screen brightness\n6 Desktop icons\nIcons include the following but not limited to:\n6.1 Directories/folders\n6.2 Files\n6.3 Network devices\n6.4 Recycle bin\n6.5\nProgram icons\n7 Maintenance\n7.1 Creating and managing more space in the hard disk\nand other peripherals\n7.2 Reviewing programs\n7.3 Deleting unwanted files\n7.4 Backing up files\n7.5 Checking hard drive for errors\n7.6 Using up to date anti-virus programs\n7.7\nCleaning dust from internal and external surfaces\n\n--- PDF PAGE 22 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n20\n\nEVIDENCE GUIDE\n\n1 Critical aspects of\ncompetency\n1.1\nAssessment must show that the candidate:\n1.2\nSelected and used hardware components correctly and\naccording to the task requirement\n1.3\nused basic software applications to create new files and\ndocuments\n1.4\nProduced accurate and complete data in accordance with\nthe requirements\n1.5\nUsed appropriate devices and procedures to transfer\nfiles/data accurately\n1.6\nUsed basic functions of a www-browser to locate\ninformation.\n2 Underpinning\nknowledge\n2.1\nBasic ergonomics of keyboard and computer user\n2.2\nMain types of computers and basic features of different\noperating systems\n2.3\nMain parts of a computer\n2.4\nStorage devices and basic categories of memory\n2.5\nRelevant types of software\n2.6\nGeneral security, privacy legislation and copyright\n2.7\nViruses\n2.8\nOH & S principles and responsibilities\n2.9\nCalculating computer capacity\n2.10 Productivity Application\n2.11 Business Application\n2.12 System Software\n3 Underpinning\nskills\n3.1\nReading and comprehension skills required to interpret\nwork instruction and to interpret basic user manuals.\n3.2\nCommunication skills to identify lines of communication,\nrequest advice, follow instructions and receive feedback.\n3.3\nTechnology skills to use equipment safely including\nkeyboard skills.\n4 Method of\nassessment\nThe assessor may select two of the following assessment\nmethods to objectively assess the candidate:\n4.1\nDirect Observation and Oral Questioning\n4.2\nPractical demonstration\n5 Resource\nimplication\n5.1\nComputer hardware with peripherals\n5.2\nAppropriate software\n6 Context of\nAssessment\n6.1\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 23 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n21\n\nUNIT TITLE\n:\nPERFORM MENSURATION AND CALCULATION\nUNIT CODE\n: ELC311201\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes and values\nneeded identify, care, handle and use measuring instruments\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select measuring instruments\n1.1. Object or component to be measured is\nidentified\n1.2. Correct specifications are obtained from\nrelevant source\n1.3. Measuring tools are selected in line with job\nrequirements\n2. Carry out measurements and\ncalculation\n2.1. Appropriate measuring instrument is selected\nto achieve required outcome\n2.2. Accurate measurements are obtained for job\n2.3. Calculation needed to complete work tasks are\nperformed using the four basic process of\naddition (+), subtraction (-), multiplication (x),\nand division (/)\n2.4. Calculation involving fractions, percentages and\nmixed numbers are used to complete workplace\ntasks.\n2.5. Numerical computation is self-checked and\ncorrected for accuracy\n2.6. Instruments are read to the limit of accuracy of\nthe tool.\n3. Maintain measuring\ninstruments\n3.1. Measuring instruments are not dropped to avoid\ndamage\n3.2. Measuring instruments are cleaned before and\nafter using.\n3.3. Proper storage of instruments undertaken\naccording to manufacturer’s specifications and\nstandard operating procedures.\n\n--- PDF PAGE 24 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring instruments\n1.1. Straight edge\n1.2. Torque gauge\n1.3. Try square\n1.4. Protractor\n1.5. Combination gauge\n1.6. Steel rule\n2. Calculation\n\nKinds of part mensuration includes the following\nbut not limited to\n2.1. Volume\n2.2. Area\n2.3. Displacement\n2.4. Inside diameter\n2.5. Circumference\n2.6. Length\n2.7. Thickness\n2.8. Outside diameter\n2.9. Taper\n2.10. Out of roundness\n\n--- PDF PAGE 25 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n23\nEVIDENCE GUIDE\n\n1. Critical aspect of competency\nAssessment must show that the candidate:\n1.1. selected proper measuring instruments\naccording to tasks\n1.2. carried out measurement and calculations\n1.3. maintained and stores instruments\n2. Underpinning knowledge\n2.1. Types of measuring instruments and their\nuses\n2.2. Safe handling procedures in using\nmeasuring instruments\n2.3. Four fundamental operation of mathematics\n2.4. Formula for volume, area, perimeter and\nother geometric figures\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction\n3.2. Communication skills\n3.3. Handling measuring instruments\n3.4. Performing mathematical calculations using\nthe four fundamental operations\n3.5. Visualizing objects and shapes\n3.6. Interpreting formulae\n4. Method of assessment\nCompetency in this unit must be assessed\nthrough:\n\n4.1. Observation\n4.2. Oral questioning\n5. Resource implication\n5.1. Place of assessment\n5.2. Measuring instruments\n5.3. Straight edge\n5.4. Torque gauge\n5.5. Try square\n5.6. Protractor\n5.7. Combination gauge\n5.8. Steel rule\n6. Context of Assessment\n6.1 Assessment may be conducted in the\nworkplace or in a simulated environment\n\n--- PDF PAGE 26 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n24\nUNIT TITLE\n:\nPREPARE AND INTERPRET TECHNICAL DRAWING\nUNIT CODE\n: ELC311202\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes and values\nneeded to prepare/interpret diagrams, engineering abbreviation\nand drawings, symbols, dimension.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify different kinds of\ntechnical drawings\n1.1. Correct technical drawing is selected\naccording to job requirements.\n1.2. Technical drawings are segregated in\naccordance with the types and kinds of\ndrawings\n2. Interpret technical drawing\n2.1. Components, assemblies or objects are\nrecognized as required.\n2.2. Dimensions of the key features of the\nobjects depicted in the drawing are correctly\nidentified.\n2.3. Symbols used in the drawing are identified\nand interpreted correctly.\n2.4. Drawing is checked and validated against job\nrequirements or equipment in accordance\nwith standard operating procedures.\n3. Prepare/make changes to\nelectrical/electronic schematics\nand drawings\n3.1. Electrical/electronic schematic is drawn and\ncorrectly identified.\n3.2. Correct drawing is identified, equipment are\nselected and used in accordance with job\nrequirements.\n4. Store technical drawings and\nequipment /instruments\n4.1. Care and maintenance of drawings are\nundertaken according to company\nprocedures.\n4.2. Technical drawings are recorded and\ninventory is prepared in accordance with\ncompany procedures.\n4.3. Proper storage of instruments is undertaken\naccording to company procedures.\n\n--- PDF PAGE 27 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technical drawings\nMay include the following but not limited to:\n1.1. Schematic diagrams\n1.2. Charts\n1.3. Block diagrams\n1.4. Lay-out plans\n1.5. Location plans\n1.6. Process and instrumentation diagrams\n1.7. Loop diagrams\n1.8. System Control Diagrams\n2. Dimensions\nMay include but not limited to:\n\n2.1. Length\n2.2. Width\n2.3. Height\n2.4. Diameter\n2.5. Angles\n3. Symbols\nMay include but not limited to:\n\n3.1. NEC- National Electric Code\n3.2. IEC -International Electrotechnical\nCommission\n3.3. ASME - American Society of Mechanical\nEngineers\n3.4. IEEE - Institute of Electrical and\nElectronics Engineers\n3.5. ISA - Instrumentation System and\nAutomation Society\n4. Instruments/Equipment\n4.1. Components/dividers\n4.2. Drawing boards\n4.3. Rulers\n4.4. T-square\n4.5. Calculator\n\n--- PDF PAGE 28 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n26\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetencies\nAssessment must show that the candidate:\n\n1.1. selected correct technical drawing in line with\njob requirements\n1.2. correctly identified the objects represented in\nthe drawing\n1.3. identified and interpreted symbols used in the\ndrawing correctly\n1.4. prepared/produced electrical/electronic\ndrawings including all relevant specifications\n1.5. stored diagrams/equipment\n2. Underpinning knowledge\n2.1. Drawing conventions\n2.2. Symbols\n2.3. Dimensioning Conventions\n2.4. Mark up/Notation of Drawings\n2.5. Mathematics\n2.5.1. Four fundamental operations\n2.5.2. Percentage\n2.5.3. Fraction\n2.5.4. Trigonometric Functions\n2.5.5. Algebra\n2.5.6. Geometry\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction\n3.2. Communication skills\n3.3. Interpreting electrical/electronic signs and\nsymbols\n4. Method of assessment\nCompetency in this unit must be assessed through:\n\n4.1. Practical tasks involving interpretation of a\nrange of technical drawings\n4.2. Oral questioning\n5. Resource implication\n5.1. Drawings\n5.2. Diagrams\n5.3. Charts\n5.4. Plans\n6. Context of Assessment\n6.1 Assessment may be conducted in the\nworkplace or in a simulated environment\n\n--- PDF PAGE 29 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n27\nUNIT TITLE\n: USE HAND TOOLS\nUNIT CODE\n:\nELC724201\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes on the safe\nuse, handling and maintenance of tools.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for tasks to\nbe undertaken\n1.1. Tasks to be undertaken are properly identified\n1.2. Appropriate hand tools are identified and\nselected according to the task requirements\n2. Prepare hand tools\n2.1. Appropriate hand tools are checked for proper\noperation and safety\n2.2. Unsafe or faulty tools are identified and marked\nfor repair according to standard company\nprocedure\n3. Use appropriate hand tools\nand test equipment\n3.1. Tools are used according to tasks undertaken\n3.2. All safety procedures in using tools are\nobserved at all times and appropriate personal\nprotective equipment (PPE) are used\n3.3. Malfunctions, unplanned or unusual events are\nreported to the supervisor\n4. Maintain hand tools\n4.1. Tools are not dropped to avoid damage\n4.2. Routine maintenance of tools undertaken\naccording to standard operational procedures,\nprinciples and techniques\n4.3. Tools are stored safely in appropriate locations\nin accordance with manufacturer’s\nspecifications or standard operating procedures\n\n--- PDF PAGE 30 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n28\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hand tools\n1.1. Hand tools for adjusting, dismantling, assembling,\nfinishing, cutting. Tool set includes the following\nbut not limited to: screw drivers, pliers, punches,\nwrenches, files\n2. Personal Protective\nEquipment (PPE)\n2.1. Gloves\n2.2. Protective eyewear\n2.3. Apron/overall\n3. Maintenance\n3.1. Cleaning\n3.2. Lubricating\n3.3. Tightening\n3.4. Simple tool repairs\n3.5. Hand sharpening\n3.6. Adjustment using correct procedures\n\n--- PDF PAGE 31 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n29\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment must show that the candidate:\n\n1.1. Demonstrated safe working practices at all times\n1.2. Communicated information about processes,\nevents or tasks being undertaken to ensure a\nsafe and efficient working environment\n1.3. Planned tasks in all situations and reviewed task\nrequirements as appropriate\n1.4. Performed all tasks to specification\n1.5. Maintained and stored tools in appropriate\nlocation\n2. Underpinning knowledge\n\n2.1. Safety\n2.1.1. Safety requirements in handling tools\n2.2. Tools :\n2.2.1. Function, Operation, Common faults\n2.3. Processes, Operations, Systems\n2.3.1. Maintenance of tools\n2.3.2. Storage of Tools\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction and numerical skills\n3.2. Communication skills\n3.3. Problem solving in emergency situation\n4. Method of assessment\nCompetency in this unit must be assessed through:\n4.1. Observation\n4.2. Oral questioning\n5. Resource Implication\n5.1. Tools may include the following but not limited to:\n5.1.1. screw drivers\n5.1.2. pliers\n5.1.3. punches\n5.1.4. wrenches, files\n6. Context of Assessment\n\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 32 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n30\nUNIT TITLE\n:\nTERMINATE AND CONNECT ELECTRICAL WIRING AND\nELECTRONICS CIRCUIT\nUNIT CODE\n:\nELC724202\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and\nvalues needed to terminate and connect electrical wiring and\nelectronic circuits\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntermination/connection of\nelectrical\nwiring/electronics circuits\n1.1. Materials are checked according to specifications\nand tasks\n1.2. Appropriate tools and equipment are selected\naccording to tasks requirements\n1.3. Task is planned to ensure OH & S guidelines and\nprocedures are followed\n1.4. Electrical wiring/electronic circuits are correctly\nprepared for connecting/termination in accordance\nwith instructions and work site procedures\n2. Terminate/connect\nelectrical wiring/electronic\ncircuits\n2.1. Safety procedures in using tools are observed at all\ntimes and appropriate personal protective\nequipment are used\n2.2. All work undertaken safely in accordance with the\nworkplace and standard procedures\n2.3. Appropriate range of methods in\ntermination/connection are used according to\nspecifications, manufacturer’s requirements and\nsafety\n2.4. Correct sequence of operation is followed\n2.5. Accessories used are adjusted, if necessary\n2.6. Confirm termination/connection undertaken\nsuccessfully in accordance with job specification\n3. Test termination/\nconnections of electrical\nwiring/electronics circuits\n3.1. Testing of all completed termination/ connections of\nelectric wiring/electronic circuits is conducted for\ncompliance with specifications and regulations\nusing appropriate procedures and equipment\n3.2. Wiring and circuits are checked using specified\ntesting procedures\n3.3. Unplanned events or conditions are responded to\nin accordance with established procedures\n\n--- PDF PAGE 33 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n31\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\n1.1\nMaterials included the following but not\nlimited to:\n1.1.1 Soldering lead\n1.1.2 Cables\n1.1.3 Wires\n2. Tools and equipment\n2.1\nTools for measuring, cutting, drilling,\nassembling/disassembling. Tool set\nincludes the following but not limited to:\n2.1.1 Pliers\n2.1.2 Cutters\n2.1.3 Screw drivers\n2.2\nEquipment\n2.2.1 Soldering gun\n2.2.2 Multi-tester\n3. Personal protective equipment\n3.1\ngoggles\n3.2\ngloves\n3.3\napron/overall\n4. Methods\n4.1\nClamping\n4.2\nPin connection\n4.3\nSoldered joints\n4.4\nPlugs\n5. Accessories\n5.1\nAccessories may include the following\nbut not limited to:\n5.1.1 brackets\n5.1.2 clamps\n\n--- PDF PAGE 34 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n32\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment must show that the candidate:\n\n1.1. Undertook work safely and according to\nworkplace and standard procedures\n1.2. used appropriate termination/ connection\nmethods\n1.3. followed correct sequence in termination /\nconnection process\n1.4. conducted testing of terminated connected\nelectrical wiring/electronic circuits using\nappropriate procedures and standards\n2. Underpinning knowledge\n2.1. Use of tools\n2.2. Use of test instruments/equipment\n2.3. Electrical theory\n2.4. Single phase AC principles\n2.5. Wiring techniques\n2.6. DC power supplies\n2.7.\nSoldering\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction\n3.2. Communication skills\n3.3. Soldering techniques\n4. Method of assessment\n4.1. The assessor may select two (2) of the following\nassessment methods to objectively assess the\ncandidate:\n4.1.1. Observation\n4.1.2. Oral Questioning\n4.1.3. Practical demonstration\n5. Resource implication\n5.1. Tools for measuring, cutting, drilling,\nassembling/disassembling, connecting. Tool set\nincludes the following but not limited to:\n5.1.1. screw drivers\n5.1.2. pliers\n5.1.3. cutters\n6. Context of Assessment\n6.1. Assessment may be conducted in the workplace\nor in a simulated environment\n\n--- PDF PAGE 35 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n33\nUNIT OF COMPETENCY: TEST ELECTRONIC COMPONENTS\nUNIT CODE : ELC724205\nDESCRIPTON : This unit covers the knowledge, skills and attitudes required to\ntest electronic components. It includes competencies in\ndetermining the criteria for testing electronics components,\nplanning an approach for component testing, testing the\ncomponents and evaluating the testing process.\n\nELEMENTS\nPERFORMANCE CRITERIA\n(Italicized bold terms are elaborated in the range of variables)\n1. Determine criteria\nfor testing\nelectronics\ncomponents\n1.1\nWork instructions are obtained and clarified based on job\norder or client requirements\n1.2\nResponsible person is consulted for effective and proper\nwork coordination\n1.3 Data sheets/Application notes are obtained and interpreted\nbased on manufacturer’s specifications\n1.4 Testing criteria are defined to ensure that components\nmeet technical and quality requirements\n1.5 Document and communicate testing criteria to relevant\npersonnel\n2. Plan an approach\nfor component\ntesting\n2.1\nVarious testing methods are Identified based on types of\nelectronic components\n2.2\nCharacteristics and appropriateness of testing methods to be\nused during development and on completion is determined\n2.3\nTesting methods are considered/selected in relation to\nappropriate testing strategy\n2.4\nPlan for testing components is developed at specified points\nduring development and on completion\n2.5\nRequired test & measuring instruments and tools are\nprepared and checked in accordance with established\nprocedures\n2.6\nRecords system is established to document testing results,\nincluding problems and faults\n3. Test components\n3.1\nTesting methods are applied to ensure that products meet\ncreative, production and technical requirements\n3.2\nProblems and faults detected by testing are recorded and\nremedial steps taken in records system is documented\n3.3\nProblems and faults detected during testing are resolved in\naccordance with agreed project or industry practice\n3.4\nEvaluate final products against the previously determined\ncriteria\n3.5\nTesting process is documented and summarized evaluation\nreport is submitted to relevant personnel\n4. Evaluate the testing\nprocess\n4.1\nTesting methods that were successful and those that led to\ndifficulties are identified based on industry standards\n4.2\nTesting process and records system are evaluated based on\nstandard procedures\n4.3\nTest results/findings are documented for subsequent\ncomponents testing.\n\n--- PDF PAGE 36 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n34\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Responsible person\nRelevant personnel may include:\n1.1. Immediate supervisor\n1.2. Manager\n2. Testing criteria\nTesting criteria may include:\n2.1. controls\n2.2. effectiveness\n2.3. efficiency\n2.4. bug detection\n2.5. functionality, including flow\n2.6. interoperability\n2.7. performance\n2.8. reliability\n2.9. operating parameters\n3. Testing methods\nTesting methods may include:\n3.1. automated\n3.2. debugging\n3.3. inspection\n3.4. platform testing\n3.5. prototyping\n4. Types of electronic\ncomponents\n4.1. Passive components\n4.2. Active components\n4.3. Dynamic components\n4.4. Hybrid components\n5. Testing strategy\nTesting strategy may be determined by:\n5.1. Passive testing\n5.2. Dynamic testing\n5.3. In-circuit testing\n6. Test and measuring\ninstruments\nTest and measuring instruments may include:\n6.1. Variable DC power supply\n6.2. Digital VOM\n6.3. analog VOM\n6.4. dual trace triggered oscilloscope\n6.5. function generator\n7. Tools\nTools may include:\n7.1. set of pliers\n7.2. set of screw drivers\n7.3. set of wrenches\n7.4. Hand drills,\n7.5. Hack saw\n7.6. set of files\n7.7. tin snip\n7.8. hammer\n\n--- PDF PAGE 37 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n35\n\n8. Records system\nRecords system may include:\n8.1. metadata that includes:\n8.1.1. description of fault\n8.1.2. identification of code\n8.1.3. user responses\n8.1.4. written or verbal comments\n8.1.5. quantitative data\n8.1.6. remedial action taken\n8.1.7. retest result\n8.1.8. date\n8.1.9. tester's details\n8.2. questionnaire\n8.3. survey\n\n--- PDF PAGE 38 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n36\nEVIDENCE GUIDE\n\n1 Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nDetermined criteria for testing electronics components\n1.2\nPlanned an approach for component testing\n1.3\nTested components\n1.4\nEvaluated the testing process\n2 Required knowledge\nand attitude\n\n2.1\nMensuration/Mathematics\n2.1.1 Conversion of Units\n2.1.2 Applied Mathematics\n2.2\nSafety\n2.2.1 Work Safety requirements and economy of\nmaterials with durability\n2.2.2 Knowledge in 5S application and observation of\nrequired timeframe\n2.2.3 Knowledge of proper handling and disposal of\nchemicals\n2.3\nMaterials, tools and equipment uses and specifications\n2.3.1 Identification of hand and power tools\n2.3.2 Proper care and use of tools\n2.4\nSystems and Processes\n2.4.1\nPrinciples of electrical/electronic circuits\n2.4.2\nIdentifying sources of electricity\n2.4.3\nIdentifying conductors and insulators\n2.4.4\nDescribing resistance and identify resistors\n2.4.5\nSupplying different voltage using variable power\nsupply\n2.4.6\nMeasuring resistance using VOM\n2.4.7\nTesting resistors\n2.4.8\nMeasuring current and voltage using VOM\n2.4.9\nAnalyzing simple circuit using ohms and power\nlaw\n2.4.10 Analyzing series/parallel circuits using ohms and\npower law\n2.4.11 Describing alternating current circuits\n2.4.12 Observing waveform using oscilloscope\n2.4.13 generating waveform in various frequency using\nfunction generator\n2.4.14 Measuring frequency using oscilloscope\n2.4.15 Measuring capacitance using VOM\n2.4.16 Describing capacitance and identifying\ncapacitors\n2.4.17 Testing capacitors\n2.4.18 Analyzing series/parallel capacitances\n2.4.19 Describing inductance and identifying inductors\n2.4.20 Testing inductors\n2.4.21 analyzing series parallel inductors\n2.4.22 describing the characteristic of transformers\n2.4.23 describing and identifying semiconductor diode\n2.4.24 testing semiconductor diode\n\n--- PDF PAGE 39 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n37\n2.4.25 analyzing rectifier circuits\n2.4.26 describing and identifying bipolar transistor\n2.4.27 testing bipolar transistor\n2.4.28 analyzing amplifier circuit\n2.4.29 analyzing multi-vibrator circuit\n2.4.30 describing and analyzing digital gate\n2.4.31 testing logic gates\n2.4.32 analyzing logic networks\n2.4.33 analyzing sequence circuits\n3 Required skills\n\n3.1\nWork efficiently & systematically\n3.2\nCommunication skills\n3.3\nUse and maintenance of tools and equipment\n3.4\nSkills in testing electronic components\n3.5\nWork safety practices and time management\n3.6\nProblem solving skills\n3.7\nReading skills\n4 Method of\nassessment\n\nCompetency may be assessed through two or more of the\nfollowing methods:\n4.1\nDirect observation of application to tasks and questions\nrelated to required knowledge\n4.2\nDemonstration with oral questioning\n4.3\nThird party report\n4.4\nWritten test\n4.5\nPortfolio\n5 Resource\nimplications\n\nThe following resources must be provided:\n5.1\nTools and equipment (see range of variables)\n5.2\nWorking area/bench\n5.3\nElectronic components\n5.4\nTesting instruments and equipment\n5.5\nAssessment rating sheet\n5.6\nReporting forms\n6 Context of\nassessment\n6.1\nAssessment maybe conducted in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 40 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n38\n\nCORE COMPETENCIES\n\nUNIT TITLE\n:\nINSTALL AND CONFIGURE COMPUTER SYSTEMS\nUNIT CODE\n:\nELC724331\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required in installing and\nconfiguring desktop and workstation computers systems. It\nconsists of competencies to assemble computer hardware,\ninstall operating system and drivers for peripherals/devices,\nand install application software as well as to conduct testing\nand documentation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1 Assemble computer\nhardware\n1.1 Unit assembly is planned and prepared to ensure OH&S\npolicies and procedures are followed in accordance\nwith systems requirements\n1.2 Materials necessary to complete the work are identified\nand obtained in accordance with established procedures\nand checked against systems requirements\n1.3 Tools, equipment and testing devices needed to carry\nout the installation work are obtained in accordance with\nestablished procedures and checked for correct\noperation and safety\n1.4 Computer hardware is assembled in accordance with\nestablished procedures and systems requirements\n1.5 Basic-input-output-system (BIOS) configuration is\nperformed in accordance with hardware requirements.\n2 Prepare installer\n2.1 Portable bootable devices are created in accordance\nwith software manufacturer instruction\n2.2 Customized installers are prepared in accordance with\nsoftware utilization guide and end user agreement.\n2.3 Installation of portable applications are carried out in\naccordance with software user guide and software\nlicense\n3 Install operating\nsystem and drivers\nfor peripherals/\ndevices\n3.1 Operating system (OS) is installed in accordance with\nestablished installation procedures and to comply\nwith end-user requirements\n3.2 Peripherals/devices drivers are installed and\nconfigured in accordance with manufacturer’s\ninstructions and/or OS installation procedures.\n3.3 OS and drivers updates/patches are accessed and\ninstalled in accordance with manufacturer’s\nrecommendations and requirements\n3.4 On-going checks of the quality of the work are\nundertaken in accordance with established procedures\n\n--- PDF PAGE 41 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n39\n\n4 Install application\nsoftware\n4.1 Application software are installed based on software\ninstallation guides, end-user requirements and software\nlicense agreement\n4.2 Variation to application software installation is carried\nout in accordance to customer/client requirements\n4.3 Software updates are accessed and installed in\naccordance with manufacturer’s recommendations and\nrequirements\n5 Conduct testing and\ndocumentation\n5.1 Devices / systems and/or installation is tested to\ndetermine whether it conforms to requirements\n5.2 Stress test is conducted to ensure reliability of\nequipment in accordance with manufacturer’s\ninstructions and system requirements\n5.3 5S and 3Rs are followed according to environmental\npolicies\n5.4 Documentation in relation to the test is forwarded to\nappropriate personnel and/or authority in accordance\nwith requirements\n\n--- PDF PAGE 42 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n40\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OH&S policies and\nprocedures\n1.1\nOccupational Health and Safety Laws\n1.2\nPersonal Safety\n1.3\nWorkplace Hazards\n1.4\nEnvironment Laws\n2. Tools, equipment and\ntesting devices\n2.1\nProtective eyewear\n2.2\nDigital multi-meter\n2.3\nWire stripper with bolt\ncutter\n2.4\nPliers (assorted)\n2.5\nScrew drivers\n(assorted)\n2.6\nSoldering iron\n2.7\nDesoldering tool\n2.8\nAllen wrench (0.05 –\n0.25 inch)\n2.9\nFlashlight\n2.10\nIC insertion/extraction\ntool\n2.11\nMirror (inspection)\n2.12\nRS 232 pin\ninsertion/extraction\ntool\n2.13\nSharp pointed\ntweezers\n2.14\nAntistatic wrist wrap\n2.15\nLAN Tester\n2.16\nCrimping tools\n3. Computer hardware\n3.1\nMotherboard\n3.2\nHard disk\n3.3\nVideo card\n3.4\nSound card\n3.5\nOptical disc drives\n3.6\nMemory modules\n3.7\nPower supply\n3.8\nCables and cords\n4. Operating system\n4.1\nWindows\n4.2\nMAC OS X\n4.3\nLinux\n5. Established installation\nprocedures\n5.1\nAutomatic installation\n5.2\nCustom installation\n5.3\nInstallation from optical devices\n5.4\nInstallation from portable devices\n5.5\nInstallation via network\n6. Peripherals/devices\n6.1\nPrinter\n6.2\nScanner\n6.3\nInterface cards\n6.3.1\nTV tuner\n6.3.2\nvideo card\n6.3.3\nsound card\n7. Application software\n7.1\nProductivity tools\n7.2\nUtilities\n7.2.1 Anti-virus\n7.2.2 Virtualization software\n7.2.3 Disk management software\n7.2.4 Optical disk burning tool\n7.3\nGames\n8. Stress test\nIncludes stress test on:\n8.1\nprocessor\n8.2\nvideo card\n8.3\nmemory\n8.4\nhard disk\n\n--- PDF PAGE 43 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n41\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment must show that the candidate:\n1.1.\nAssembled computer hardware\n1.2.\nInstalled operating system and drivers for peripherals/devices\n1.3.\nInstalled application software\n1.4.\nConducted testing and documentation\n2. Underpinning\nknowledge\n2.1.\nTypes and parts of computers\n2.2.\nComputer operating systems\n•\nWindows / MAC OS X /Linux\n2.3.\nPeripheral devices\n2.4.\nComputer systems design\n2.5.\nComputer assembly procedures\n2.6.\nInstallers preparation and OS installation procedures\n2.7.\nApplication and devices/drivers installation procedures\n2.8.\nDesktop PC interface/ hook up procedures\n2.9.\nPower ON self-test and BIOS configuration procedures\n2.10. Application packages & use of application programs\n2.11. Multimedia systems\n2.12. Motherboards\n2.13. Multimedia storage devices:\n2.14. Video cards\n2.15. Sound cards\n2.16. Graphical user interface\n2.17. Disk management\n2.18. Use of utilities/software\n•\nVirtualization software\n•\nDisk management software\n•\nAnti-virus / Diagnostic software\n•\nDevice drivers\n2.19. Drivers/Software update procedures\n2.20. Application software license agreements\n2.21. Stress testing procedures\n2.22.\n5S and 3Rs environmental policies\n3\nUnderpinning\nskills\n3.1\nSafety handling of computer parts\n3.2\nAssembling computer hardware\n3.3\nTroubleshooting skills\n3.4\nReading and writing skills\n4\nMethod of\nassessment\nThe assessor may select any two of the following assessment methods to\nobjectively assess the candidate:\n4.1\nPractical Demonstration w/ oral questioning\n4.2\nInterview\n4.3\nPortfolio\n5\nResource\nImplications\nThe following resources MUST be provided:\n5.1\nTools and test instruments\n5.2\nPC or workstation\n5.3\nComputer peripherals/devices\n5.4\nAppropriate OS, drivers and software applications/programs\n6\nContext of\nAssessment\n6.1\nAssessment may be conducted in the workplace or in a simulated\nenvironment\n\n--- PDF PAGE 44 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n42\nUNIT TITLE\n:\nSET-UP COMPUTER NETWORKS\nUNIT CODE\n:\nELC724332\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required in setting-up computers\nnetworks for LANs and small-office home-office (SOHO)\nsystems. It consists of competencies to install network cables,\nset network configuration, set router/Wi-Fi/ wireless access\npoint/repeater configuration as well as to inspect and test the\nconfigured computer networks.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the range of Variables\n1\nInstall network\ncables\n1.1 Cable routes are determined and planned in accordance\nwith network design and actual installation site.\n1.2 Network materials necessary to complete the work are\nidentified and obtained in accordance with established\nprocedures and checked against systems requirements\n1.3 Tools, equipment and testing devices needed to carry\nout the installation work are obtained in accordance with\nestablished procedures and checked for correct\noperation and safety\n1.4 Appropriate personal protective equipment is used\nand OHS policies and procedures are followed\n1.5 Copper cable splicing is performed based on Electronic\nIndustries Alliance/Telecommunications Industry\nAssociation (EIA/TIA) standards\n1.6 Network cables and cable raceway are installed in\naccordance with established procedures and installation\nrequirements\n1.7 Installation work is performed and is checked to ensure\nno unnecessary damage has occurred and complies with\nrequirements\n1.8 OHS standards and 5S principles are followed according\nto enterprise requirements\n1.9 Excess components and materials are disposed of based on\nWEEE directives and 3Rs waste management program.\n2\nSet network\nconfiguration\n2.1 Network connectivity of each terminal is checked in\naccordance with network design.\n2.2 Any fault or problem in the network system is diagnosed\nand remedied in line with the standard operating\nprocedures.\n2.3 Network interface card (NIC) settings are configured in\naccordance with network design.\n2.4 Communication checking between terminals are carried\nout in accordance with OS network configuration guides\n2.5 Unplanned events or conditions are responded to in\naccordance with established procedures\n\n--- PDF PAGE 45 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n43\n\n3\nSet router/Wi-Fi/\nwireless access\npoint/repeater\nconfiguration\n3.1 Client Device systems settings are configured in\naccordance with manufacturers’ instructions and end-\nuser preferences\n3.2 Local area network (LAN) port is configured in\naccordance with manufacturers’ instructions and network\ndesign\n3.3 Wide area network (WAN) port is configured in\naccordance with manufacturers’ instructions and network\ndesign\n3.4 Wireless settings are configured in accordance\nmanufacturers’ instructions, network design and end-user\npreferences\n3.5 Security/Firewall/Advance settings are configured in\naccordance with manufacturers’ instructions and end-\nuser preferences\n\n4\nInspect and test\nthe configured\ncomputer\nnetworks\n4.1 Final inspections are undertaken to ensure that the\nconfiguration done on the computer networks conforms\nwith the manufacturer’s instruction/manual\n4.2 Computer networks are checked to ensure safe\noperation.\n4.3 Reports are prepared/completed according to company\nrequirements.\n\n--- PDF PAGE 46 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n44\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Network design\nMay include:\n1.1\nNetwork topology\n1.2\nDistribution terminals\n2. Network materials\n2.1\nCables\n2.1.1 Fiber optics\n2.1.2 copper\n2.2\nterminals\n2.3\ncable raceway/duct\n2.4\nclamps\n2.5\nfasteners\n2.6\ninsulators\n2.7\nterminal box\n3. Tools, equipment and testing\ndevices\n3.1\nProtective eyewear\n3.2\nDigital multi-meter\n3.3\nWire stripper with bolt cutter\n3.4\nPliers (assorted)\n3.5\nScrew drivers (assorted)\n3.6\nLAN Tester\n3.7\nCrimping tools\n4. Appropriate personal\nprotective equipment\n4.1\nGloves\n4.2\nGoggles\n4.3\nWorking clothes\n5. OH&S policies and\nprocedures\n5.1\nOccupational Health and Safety Laws\n5.2\nPersonal Safety\n5.3\nWorkplace Hazards\n5.4\nEnvironment Laws\n6. Splicing\n6.1\nstraight-through\n6.2\ncross-talk\n6.3\nroll-over\n7. network cables\n7.1\ncopper cable\n7.2\nfiber optic cable (terminated)\n8. Cable raceway\n8.1\nslotted PVC\n8.2\nmetallic raceway\n8.3\nflexible conduit\n9. Client device\n9.1\nLaptop\n9.2\nDesktop\n9.3\nNetwork storage\n9.4\nNetwork printer\n10. installation requirement\n10.1\nother requirements for fiber optic cable\ninstallation\n\n--- PDF PAGE 47 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n45\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment must show that the candidate:\n1.1.\nInstalled network cables\n1.2.\nSet network configuration\n1.3.\nSet router/Wi-Fi/ wireless access point/repeater configuration\n1.4.\nInspected and tested the configured computer networks\n2. Underpinning\nknowledge\n2.1.\nComputer network concepts\n2.2.\nNetwork cable installation\n2.3.\nCopper cable splicing and cable testing\n2.4.\nFiber optic cables splicing and installation requirements\n2.5.\nnetwork design\no addressing\no subnetting\no topology\n2.6.\nIPV4 and IPV6\n2.7.\nRouter/Wi-Fi/ wireless access point/repeater configuration\n2.8.\nNetwork interface card (NIC) settings\n2.9.\nnetwork cables\n2.10. cable raceways/ducts\n2.11. Device systems settings configuration\n2.12. Local area network (LAN) port configuration\n2.13. Wide area network (WAN) port configuration\n2.14. Wireless settings configuration\n2.15. Security/Firewall/Advance settings configuration\n2.16. Cloud computing\n2.17. Network connectivity testing\n2.18. Philippine Electrical Code relevant to data connection\n2.23. OHS standards and 5S principles\n2.24. Practicing 3Rs – reduce, re-use, recycle/recover\n2.25. 3Rs environmental policies\n2.19.\nManaging waste from electrical and electronic equipment (WEEE)\n3. Underpinning\nskills\n3.1.\nCable splicing\n3.2.\nCable troubleshooting\n3.3.\nSetting-up and configuring skills\n3.4.\nProblem solving skills\n3.5.\nDecision making skills\n3.6.\nDocumentation skills\n4. Method of\nassessment\nThe assessor may select any two of the following assessment methods\nto objectively assess the candidate:\n4.1.\nPractical Demonstration w/ oral questioning\n4.2.\nInterview\n4.3.\nThird Party\n4.4.\nPortfolio\n5. Resource\nImplications\nThe following resources MUST be provided:\n5.1.\nPC or workstation\n5.2.\nNetwork cables and materials\n5.3.\nRouter/Wi-Fi/ wireless access point/repeater\n5.4.\nTools and test instruments\n5.5.\nAppropriate software applications/programs\n5.6.\nPPE\n6. Context of\nAssessment\n6.1.\nAssessment may be conducted in the workplace or in a simulated\nenvironment\n\n--- PDF PAGE 48 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n46\nUNIT TITLE\n:\nSET-UP COMPUTER SERVERS\nUNIT CODE\n:\nELC724333\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes needed to\nset-up computer servers for LANs and SOHO systems. It\nconsists of competencies to set-up user access and configures\nnetwork services as well as to perform testing, documentation\nand pre-deployment procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Set-up user access\n1.1 User folder is created in accordance with\nnetwork operating system (NOS) features\n1.2 User access level is configured based on NOS\nfeatures and established network access\npolicies/end-user requirements.\n1.3 Security check is performed in accordance with\nestablished network access policies/end-user\nrequirements.\n\n2. Configure network services\n2.1. Normal functions of server are checked in\naccordance with manufacturer’s instructions\n2.2. Required modules /add-ons are\ninstalled/updated based on NOS installation\nprocedures\n2.3. Network services to be configured are\nconfirmed based on user/system requirements\n2.4. Operation of network services are checked\nbased on user/system requirements\n2.5. Unplanned events or conditions are responded\nto in accordance with established procedures\n\n3. Perform testing,\ndocumentation and pre-\ndeployment procedures\n3.1. Pre-deployment procedures is undertaken\nbased on enterprise policies and procedures\n3.2. Operation and security check are undertaken\nbased on end-user requirements\n3.3. Reports are prepared/completed according to\nenterprise policies and procedures.\n\n--- PDF PAGE 49 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n47\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Normal functions of server\n1.1\nno error on boot sequence\n1.2\nnetwork connectivity\n2. Network services\n2.1\nremote access\n2.2\ndomain controller\n2.3\nweb services\n2.4\ndatabase services\n2.5\nproxy server\n2.6\nfile, printer and other resources sharing\n3. pre-deployment procedures\n3.1\ninstallation of application\n3.2\npopulating database\n\n--- PDF PAGE 50 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n48\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment must show that the candidate:\n1.1.\nSet-up user access\n1.2.\nConfigured network services\n1.3.\nPerformed testing, documentation and pre-\ndeployment procedures\n2. Underpinning knowledge\n2.1.\nNetwork operating system (NOS) features\n2.2.\nComputer servers and functions\n2.3.\nTypes of Network services\n2.4.\nUser access level configuration\n2.5.\nNetwork services configuration\n2.5.1. configuring web services\n2.5.2. configuring file sharing services\n2.5.3. configuring print sharing services\n2.6.\nWeb applications/technologies\n2.7.\nSetting-up client/user access and security\n2.8.\nSetting-up and configuring servers\n2.9.\nInstalling and configuring modules/add-ons\n2.10. Configuration of network services\n2.11. Testing procedures\n2.12. Pre-deployment procedures and practices\n2.13. Enterprise policies and procedures\n2.14. End user requirements\n2.15. Enterprise policies and procedures\n2.16. Documentation and making reports\n3. Underpinning skills\n3.1.\nSetting-up and configuring servers\n3.2.\nProblem solving skills\n3.3.\nDecision making skills\n3.4.\nReading and writing skills\n4. Method of assessment\nThe assessor may select any two of the following\nassessment methods to objectively assess the\ncandidate:\n4.1.\nPractical Demonstration w/ oral questioning\n4.2.\nInterview\n4.3.\nPortfolio\n\n5. Resource Implications\nThe following resources MUST be provided:\n5.1.\nPC or workstation network and server\n5.2.\nNetwork operating system (NOS)\n5.3.\nNetwork printer\n5.4.\nTools and test instruments\n5.5.\nAppropriate software applications/programs\n\n6. Context of Assessment\n6.1.\nAssessment may be conducted in the workplace\nor in a simulated environment\n\n--- PDF PAGE 51 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n49\nUNIT TITLE\n:\nMAINTAIN AND REPAIR COMPUTER SYSTEMS AND\nNETWORKS\nUNIT CODE\n: ELC724334\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes needed to\nmaintain and service computer systems and networks.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the range of Variables\n1. Plan and prepare for\nmaintenance and repair\n1.1. Maintenance and/or Diagnosis of faults is planned\nand prepared in line with job requirements.\n1.2. Tools, equipment and testing devices needed for\nthe maintenance are obtained and checked for\ncorrect operation and safety\n1.3. Materials necessary to complete the work are\nobtained in accordance with established procedures\nand checked against job requirements.\n1.4. OHS policies and procedures are followed in line\nwith job requirements.\n1.5. Computer systems and networks for maintenance\nare checked against job/service order or instructions\nand specifications.\n\n2. Maintain computer\nsystems and networks\n2.1. Appropriate personal protective equipment is\nused in line with standard procedures.\n2.2. Normal function of computer systems and networks\nare checked in accordance with manufacturer’s\ninstructions.\n2.3. Scheduled/periodic maintenance is performed in\naccordance with manufacturer’s requirements.\n2.4. Where necessary, needed repairs/replacements are\nmade in accordance with established procedures.\n2.5. Unplanned events or conditions are responded to in\naccordance with established procedures\n\n3. Diagnose faults of\ncomputer systems and\nnetworks\n3.1. Appropriate personal protective equipment is used\nin line with standard procedures.\n3.2. Faults or problems in the computer systems and\nnetworks are diagnosed according to requirements\nand in line with the standard procedures.\n3.3. Contingency measures are managed and\nimplemented in accordance with established\nprocedures\n3.4. Unplanned events or conditions are responded to in\naccordance with established procedures\n\n--- PDF PAGE 52 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n50\n\n4. Rectify/correct defects\nin computer systems\nand networks\n4.1. Appropriate personal protective equipment is used\nin line with standard procedures.\n4.2. Defective components or parts are replaced or\ncorrected without damage to the surrounding\nenvironment or services\n4.3. Adjustments, if necessary are made in accordance\nwith established procedures\n4.4. Unplanned events or conditions are responded to in\naccordance with established procedures.\n\n5. Inspect and test the\ncomputer systems and\nnetworks\n5.1. Final inspections are undertaken to ensure that the\ntesting conducted on the device conforms with the\nmanufacturer’s instruction/manual\n5.2. Computer systems and networks are\nchecked/tested to ensure safe operation.\n5.3. OHS standards and 5S principles are followed\naccording to enterprise policies\n5.4. Work site is cleaned and cleared of all debris and\nleft in safe condition in accordance with company\nprocedures\n5.5. Excess components and materials are disposed of based\non WEEE directives and 3Rs waste management\nprogram.\n5.6. Report is prepared and completed according to\ncompany requirements\n\n--- PDF PAGE 53 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n51\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools\nTools for: cutting, shaping, drilling, threading, tapping,\nfinishing, dismantling, and assembling. Tool set includes but\nnot limited to:\n1.1. Pliers (assorted)\n1.2. Screw drivers (assorted)\n1.3. Special tools\n1.4. Soldering iron/gun\n1.5. Wrenches\n1.6. Utility knife/stripper\n1.7. Hot air soldering station\n1.8. LAN Tester\n1.9. Crimping tools\n2. Equipment and testing\ndevices\n2.1. Equipment includes but not limited to:\n2.1.1. Maintenance bench\n2.1.2. Power supply equipment\n2.2. Testing devices include but not limited to:\n2.2.1. Multi-meter\n2.2.2. Calibrators\n2.2.3. Signal generator\n2.2.4. Oscilloscope\n2.2.5. Appropriate software\n3. Materials\nIncludes but not limited to:\n3.1. disks\n3.2. Connectors\n3.3. Adaptors\n3.4. Wires and cables\n3.5. Appropriate software\n3.6. Computer storage media\n4. OH & S policies and\nprocedures\n4.1. OH & S guidelines\n4.2. Philippine environmental standards\n5. Computer systems and\nnetworks\nIncludes but not limited to:\n5.1. Servers\n5.2. peripherals\n5.3. desktop computers\n5.4. network devices\n5.5. cables and connection\n6. Personal protective\nequipment\nIncludes but not limited to:\n6.1. Goggles/glasses\n6.2. Mask\n6.3. Gloves\n6.4. Anti-static wrist wrap\n7. Maintenance\n7.1. Software updates\n7.2. Hard disk maintenance\n7.3. File back-up/Restoration\n8. Faults and problems\n8.1. Network connectivity\n8.2. Software issues\n8.3. Hardware issues\n\n--- PDF PAGE 54 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n52\nEVIDENCE GUIDE\n\n1.\nCritical aspect of\ncompetency\nAssessment must show that the candidate:\n1.1\nPlanned and prepared for maintenance and repair.\n1.2\nMaintained computer systems and networks\n1.3\nDiagnosed faults of computer systems\n1.4\nRectified/corrected defects in computer systems and networks\n1.5\nInspected and tested the computer systems and networks\n2.\nUnderpinning\nknowledge\nIncludes but not limited to:\n2.1 Planning and preparing for maintenance\n2.2 Computer systems maintenance procedures\n2.2.1 PC systems\n2.2.2 Computer operations\n2.2.3 Electronic fault findings\n2.3 Use and operation of tools, instruments and testing devices\n2.4 Occupational health and safety policies and procedures\n2.5 Job service order forms or checklist\n2.6 Problem solving in emergency situation\n2.7 Procedures in maintenance scheduling\n2.8 Preventive maintenance of computer system and network\n2.8.1 Operating system update\n2.8.2 Back-up scheduling\n2.8.3 Creating restore point\n2.8.4 Guarding against virus\n2.8.5 Cleaning computer systems and networks\n2.9 Diagnostic procedures\n2.10 Identifying and isolating faults/problems\n2.10.1 Diagnostic software utilities\n2.10.2 Gathering of information\n2.11 Accomplished forms\n2.11.1 Diagnostic reports\n2.11.2 Proposal reports\n2.12 Defects in computer systems and networks\n2.13 Troubleshooting and repair techniques\n2.14 Problem solving in emergency situation\n2.15 Corrective action\n2.15.1 Hardware configuration\n2.15.2 Software configuration\n2.16 Testing methods and procedures\n2.17 Documentation and making reports\n2.18 Waste management\n2.19 OHS standards and 5S principles\n2.20 Practicing 3Rs – reduce, re-use, recycle/recover\n2.21 3Rs environmental policies\n2.22 Managing waste from electrical and electronic equipment (WEEE)\n\n3.\nUnderpinning\nskills\n3.1 Reading skills required to interpret work instructions\n3.2 Communication skills needed to interpret and define work\nprocedures\n3.3 Problem solving in emergency situation\n3.4 Network Cabling\n3.5 Connecting computers to wired and wireless LAN\n3.6 Removing viruses from infected machines\n\n--- PDF PAGE 55 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n53\n4.\nMethod of\nassessment\nThe assessor must select two of the following assessment methods to\nobjectively assess the candidate:\n4.1 Observation with oral Questioning\n4.2 Interview\n4.3 Portfolio\n\n5.\nResource\nImplication\nThe following resources MUST be provided:\n5.1 Tools\n5.2 Computers and peripherals\n5.3 Test instruments\n5.4 Materials\n5.5 PPE\n5.6 Technical manuals\n6.\nContext of\nAssessment\nAssessment may be conducted in the workplace or in a simulated\nenvironment\n\n--- PDF PAGE 56 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n54"
