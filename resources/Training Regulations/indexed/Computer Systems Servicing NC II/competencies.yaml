        "evidence_guide": {
          "source_text": "1 Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nDetermined criteria for testing electronics components\n1.2\nPlanned an approach for component testing\n1.3\nTested components\n1.4\nEvaluated the testing process\n2 Required knowledge\nand attitude\n\n2.1\nMensuration/Mathematics\n2.1.1 Conversion of Units\n2.1.2 Applied Mathematics\n2.2\nSafety\n2.2.1 Work Safety requirements and economy of\nmaterials with durability\n2.2.2 Knowledge in 5S application and observation of\nrequired timeframe\n2.2.3 Knowledge of proper handling and disposal of\nchemicals\n2.3\nMaterials, tools and equipment uses and specifications\n2.3.1 Identification of hand and power tools\n2.3.2 Proper care and use of tools\n2.4\nSystems and Processes\n2.4.1\nPrinciples of electrical/electronic circuits\n2.4.2\nIdentifying sources of electricity\n2.4.3\nIdentifying conductors and insulators\n2.4.4\nDescribing resistance and identify resistors\n2.4.5\nSupplying different voltage using variable power\nsupply\n2.4.6\nMeasuring resistance using VOM\n2.4.7\nTesting resistors\n2.4.8\nMeasuring current and voltage using VOM\n2.4.9\nAnalyzing simple circuit using ohms and power\nlaw\n2.4.10 Analyzing series/parallel circuits using ohms and\npower law\n2.4.11 Describing alternating current circuits\n2.4.12 Observing waveform using oscilloscope\n2.4.13 generating waveform in various frequency using\nfunction generator\n2.4.14 Measuring frequency using oscilloscope\n2.4.15 Measuring capacitance using VOM\n2.4.16 Describing capacitance and identifying\ncapacitors\n2.4.17 Testing capacitors\n2.4.18 Analyzing series/parallel capacitances\n2.4.19 Describing inductance and identifying inductors\n2.4.20 Testing inductors\n2.4.21 analyzing series parallel inductors\n2.4.22 describing the characteristic of transformers\n2.4.23 describing and identifying semiconductor diode\n2.4.24 testing semiconductor diode\n\n--- PDF PAGE 39 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n37\n2.4.25 analyzing rectifier circuits\n2.4.26 describing and identifying bipolar transistor\n2.4.27 testing bipolar transistor\n2.4.28 analyzing amplifier circuit\n2.4.29 analyzing multi-vibrator circuit\n2.4.30 describing and analyzing digital gate\n2.4.31 testing logic gates\n2.4.32 analyzing logic networks\n2.4.33 analyzing sequence circuits\n3 Required skills\n\n3.1\nWork efficiently & systematically\n3.2\nCommunication skills\n3.3\nUse and maintenance of tools and equipment\n3.4\nSkills in testing electronic components\n3.5\nWork safety practices and time management\n3.6\nProblem solving skills\n3.7\nReading skills\n4 Method of\nassessment\n\nCompetency may be assessed through two or more of the\nfollowing methods:\n4.1\nDirect observation of application to tasks and questions\nrelated to required knowledge\n4.2\nDemonstration with oral questioning\n4.3\nThird party report\n4.4\nWritten test\n4.5\nPortfolio\n5 Resource\nimplications\n\nThe following resources must be provided:\n5.1\nTools and equipment (see range of variables)\n5.2\nWorking area/bench\n5.3\nElectronic components\n5.4\nTesting instruments and equipment\n5.5\nAssessment rating sheet\n5.6\nReporting forms\n6 Context of\nassessment\n6.1\nAssessment maybe conducted in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 40 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n38\n\nCORE COMPETENCIES\n\nUNIT TITLE\n:\nINSTALL AND CONFIGURE COMPUTER SYSTEMS\nUNIT CODE\n:"
