        "source_text": "--- PDF PAGE 48 ---\n___________________________________________________________________________________ \nTR - COMPUTER SYSTEMS SERVICING NC II                                          Amended - December 2013 \n46\nUNIT TITLE \n: \nSET-UP COMPUTER SERVERS \nUNIT CODE \n: \nELC724333 \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes needed to \nset-up computer servers for LANs and SOHO systems. It \nconsists of competencies to set-up user access and configures \nnetwork services as well as to perform testing, documentation \nand pre-deployment procedures. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Set-up user access \n1.1 User folder is created in accordance with \nnetwork operating system (NOS) features \n1.2 User access level is configured based on NOS \nfeatures and established network access \npolicies/end-user requirements. \n1.3 Security check is performed in accordance with \nestablished network access policies/end-user \nrequirements. \n \n2. Configure network services \n2.1. Normal functions of server are checked in \naccordance with manufacturer’s instructions \n2.2. Required modules /add-ons are \ninstalled/updated based on NOS installation \nprocedures \n2.3. Network services to be configured are \nconfirmed based on user/system requirements  \n2.4. Operation of network services are checked \nbased on user/system requirements  \n2.5. Unplanned events or conditions are responded \nto in accordance with established procedures  \n \n3. Perform testing, \ndocumentation and pre-\ndeployment procedures \n3.1. Pre-deployment procedures is undertaken \nbased on enterprise policies and procedures \n3.2. Operation and security check are undertaken \nbased on end-user requirements \n3.3. Reports are prepared/completed according to \nenterprise policies and procedures.\n\n--- PDF PAGE 49 ---\n___________________________________________________________________________________ \nTR - COMPUTER SYSTEMS SERVICING NC II                                          Amended - December 2013 \n47\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Normal functions of server \n1.1 \nno error on boot sequence \n1.2 \nnetwork connectivity \n2. Network services \n2.1 \nremote access \n2.2 \ndomain controller \n2.3 \nweb services \n2.4 \ndatabase services \n2.5 \nproxy server \n2.6 \nfile, printer and  other resources sharing \n3. pre-deployment procedures \n3.1 \ninstallation of application \n3.2 \npopulating database\n\n--- PDF PAGE 50 ---\n___________________________________________________________________________________ \nTR - COMPUTER SYSTEMS SERVICING NC II                                          Amended - December 2013 \n48\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment must show that the candidate: \n1.1. \nSet-up user access \n1.2. \nConfigured network services \n1.3. \nPerformed testing, documentation and pre-\ndeployment procedures \n2. Underpinning knowledge \n2.1. \nNetwork operating system (NOS) features \n2.2. \nComputer servers and functions \n2.3. \nTypes of Network services \n2.4. \nUser access level configuration \n2.5. \nNetwork services configuration \n2.5.1. configuring web services \n2.5.2. configuring file sharing services \n2.5.3. configuring print sharing services \n2.6. \nWeb applications/technologies \n2.7. \nSetting-up client/user access and security \n2.8. \nSetting-up and configuring servers \n2.9. \nInstalling and configuring modules/add-ons \n2.10. Configuration of network services \n2.11. Testing procedures \n2.12. Pre-deployment procedures and practices \n2.13. Enterprise policies and procedures \n2.14. End user requirements \n2.15. Enterprise policies and procedures \n2.16. Documentation and making reports \n3. Underpinning skills \n3.1. \nSetting-up and configuring servers \n3.2. \nProblem solving skills \n3.3. \nDecision making skills \n3.4. \nReading and writing skills \n4. Method of assessment \nThe assessor may select any two of the following \nassessment methods to objectively assess the \ncandidate: \n4.1. \nPractical Demonstration w/ oral questioning \n4.2. \nInterview  \n4.3. \nPortfolio \n \n5. Resource Implications \nThe following resources MUST be provided: \n5.1. \nPC or workstation network and server \n5.2. \nNetwork operating system (NOS) \n5.3. \nNetwork printer \n5.4. \nTools and test instruments \n5.5. \nAppropriate software applications/programs \n \n6. Context of Assessment \n6.1. \nAssessment may be conducted in the workplace \nor in a simulated environment\n",
