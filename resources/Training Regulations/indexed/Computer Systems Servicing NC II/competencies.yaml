        "source_text": "ELC724205\nDESCRIPTON : This unit covers the knowledge, skills and attitudes required to\ntest electronic components. It includes competencies in\ndetermining the criteria for testing electronics components,\nplanning an approach for component testing, testing the\ncomponents and evaluating the testing process.\n\nELEMENTS\nPERFORMANCE CRITERIA\n(Italicized bold terms are elaborated in the range of variables)\n1. Determine criteria\nfor testing\nelectronics\ncomponents\n1.1\nWork instructions are obtained and clarified based on job\norder or client requirements\n1.2\nResponsible person is consulted for effective and proper\nwork coordination\n1.3 Data sheets/Application notes are obtained and interpreted\nbased on manufacturer’s specifications\n1.4 Testing criteria are defined to ensure that components\nmeet technical and quality requirements\n1.5 Document and communicate testing criteria to relevant\npersonnel\n2. Plan an approach\nfor component\ntesting\n2.1\nVarious testing methods are Identified based on types of\nelectronic components\n2.2\nCharacteristics and appropriateness of testing methods to be\nused during development and on completion is determined\n2.3\nTesting methods are considered/selected in relation to\nappropriate testing strategy\n2.4\nPlan for testing components is developed at specified points\nduring development and on completion\n2.5\nRequired test & measuring instruments and tools are\nprepared and checked in accordance with established\nprocedures\n2.6\nRecords system is established to document testing results,\nincluding problems and faults\n3. Test components\n3.1\nTesting methods are applied to ensure that products meet\ncreative, production and technical requirements\n3.2\nProblems and faults detected by testing are recorded and\nremedial steps taken in records system is documented\n3.3\nProblems and faults detected during testing are resolved in\naccordance with agreed project or industry practice\n3.4\nEvaluate final products against the previously determined\ncriteria\n3.5\nTesting process is documented and summarized evaluation\nreport is submitted to relevant personnel\n4. Evaluate the testing\nprocess\n4.1\nTesting methods that were successful and those that led to\ndifficulties are identified based on industry standards\n4.2\nTesting process and records system are evaluated based on\nstandard procedures\n4.3\nTest results/findings are documented for subsequent\ncomponents testing.\n\n--- PDF PAGE 36 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n34\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Responsible person\nRelevant personnel may include:\n1.1. Immediate supervisor\n1.2. Manager\n2. Testing criteria\nTesting criteria may include:\n2.1. controls\n2.2. effectiveness\n2.3. efficiency\n2.4. bug detection\n2.5. functionality, including flow\n2.6. interoperability\n2.7. performance\n2.8. reliability\n2.9. operating parameters\n3. Testing methods\nTesting methods may include:\n3.1. automated\n3.2. debugging\n3.3. inspection\n3.4. platform testing\n3.5. prototyping\n4. Types of electronic\ncomponents\n4.1. Passive components\n4.2. Active components\n4.3. Dynamic components\n4.4. Hybrid components\n5. Testing strategy\nTesting strategy may be determined by:\n5.1. Passive testing\n5.2. Dynamic testing\n5.3. In-circuit testing\n6. Test and measuring\ninstruments\nTest and measuring instruments may include:\n6.1. Variable DC power supply\n6.2. Digital VOM\n6.3. analog VOM\n6.4. dual trace triggered oscilloscope\n6.5. function generator\n7. Tools\nTools may include:\n7.1. set of pliers\n7.2. set of screw drivers\n7.3. set of wrenches\n7.4. Hand drills,\n7.5. Hack saw\n7.6. set of files\n7.7. tin snip\n7.8. hammer\n\n--- PDF PAGE 37 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n35\n\n8. Records system\nRecords system may include:\n8.1. metadata that includes:\n8.1.1. description of fault\n8.1.2. identification of code\n8.1.3. user responses\n8.1.4. written or verbal comments\n8.1.5. quantitative data\n8.1.6. remedial action taken\n8.1.7. retest result\n8.1.8. date\n8.1.9. tester's details\n8.2. questionnaire\n8.3. survey\n\n--- PDF PAGE 38 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n36\nEVIDENCE GUIDE\n\n1 Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nDetermined criteria for testing electronics components\n1.2\nPlanned an approach for component testing\n1.3\nTested components\n1.4\nEvaluated the testing process\n2 Required knowledge\nand attitude\n\n2.1\nMensuration/Mathematics\n2.1.1 Conversion of Units\n2.1.2 Applied Mathematics\n2.2\nSafety\n2.2.1 Work Safety requirements and economy of\nmaterials with durability\n2.2.2 Knowledge in 5S application and observation of\nrequired timeframe\n2.2.3 Knowledge of proper handling and disposal of\nchemicals\n2.3\nMaterials, tools and equipment uses and specifications\n2.3.1 Identification of hand and power tools\n2.3.2 Proper care and use of tools\n2.4\nSystems and Processes\n2.4.1\nPrinciples of electrical/electronic circuits\n2.4.2\nIdentifying sources of electricity\n2.4.3\nIdentifying conductors and insulators\n2.4.4\nDescribing resistance and identify resistors\n2.4.5\nSupplying different voltage using variable power\nsupply\n2.4.6\nMeasuring resistance using VOM\n2.4.7\nTesting resistors\n2.4.8\nMeasuring current and voltage using VOM\n2.4.9\nAnalyzing simple circuit using ohms and power\nlaw\n2.4.10 Analyzing series/parallel circuits using ohms and\npower law\n2.4.11 Describing alternating current circuits\n2.4.12 Observing waveform using oscilloscope\n2.4.13 generating waveform in various frequency using\nfunction generator\n2.4.14 Measuring frequency using oscilloscope\n2.4.15 Measuring capacitance using VOM\n2.4.16 Describing capacitance and identifying\ncapacitors\n2.4.17 Testing capacitors\n2.4.18 Analyzing series/parallel capacitances\n2.4.19 Describing inductance and identifying inductors\n2.4.20 Testing inductors\n2.4.21 analyzing series parallel inductors\n2.4.22 describing the characteristic of transformers\n2.4.23 describing and identifying semiconductor diode\n2.4.24 testing semiconductor diode\n\n--- PDF PAGE 39 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n37\n2.4.25 analyzing rectifier circuits\n2.4.26 describing and identifying bipolar transistor\n2.4.27 testing bipolar transistor\n2.4.28 analyzing amplifier circuit\n2.4.29 analyzing multi-vibrator circuit\n2.4.30 describing and analyzing digital gate\n2.4.31 testing logic gates\n2.4.32 analyzing logic networks\n2.4.33 analyzing sequence circuits\n3 Required skills\n\n3.1\nWork efficiently & systematically\n3.2\nCommunication skills\n3.3\nUse and maintenance of tools and equipment\n3.4\nSkills in testing electronic components\n3.5\nWork safety practices and time management\n3.6\nProblem solving skills\n3.7\nReading skills\n4 Method of\nassessment\n\nCompetency may be assessed through two or more of the\nfollowing methods:\n4.1\nDirect observation of application to tasks and questions\nrelated to required knowledge\n4.2\nDemonstration with oral questioning\n4.3\nThird party report\n4.4\nWritten test\n4.5\nPortfolio\n5 Resource\nimplications\n\nThe following resources must be provided:\n5.1\nTools and equipment (see range of variables)\n5.2\nWorking area/bench\n5.3\nElectronic components\n5.4\nTesting instruments and equipment\n5.5\nAssessment rating sheet\n5.6\nReporting forms\n6 Context of\nassessment\n6.1\nAssessment maybe conducted in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 40 ---\n________