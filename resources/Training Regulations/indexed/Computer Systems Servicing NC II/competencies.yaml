24 testing semiconductor diode\n\n--- PDF PAGE 39 ---\n___________________________________________________________________________________ \nTR - COMPUTER SYSTEMS SERVICING NC II                                          Amended - December 2013 \n37\n2.4.25 analyzing rectifier circuits \n2.4.26 describing and identifying bipolar transistor \n2.4.27 testing bipolar transistor \n2.4.28 analyzing amplifier circuit \n2.4.29 analyzing multi-vibrator circuit \n2.4.30 describing and analyzing digital gate \n2.4.31 testing logic gates \n2.4.32 analyzing logic networks \n2.4.33 analyzing sequence circuits\n3 Required skills \n \n3.1 \nWork efficiently & systematically \n3.2 \nCommunication skills  \n3.3 \nUse and maintenance of tools and equipment \n3.4 \nSkills in testing electronic components \n3.5 \nWork safety practices and time management \n3.6 \nProblem solving skills \n3.7 \nReading skills \n4 Method of \nassessment \n \nCompetency may be assessed through two or more of the \nfollowing methods: \n4.1 \nDirect observation of application to tasks and questions \nrelated to required knowledge \n4.2 \nDemonstration with oral questioning \n4.3 \nThird party report \n4.4 \nWritten test \n4.5 \nPortfolio \n5 Resource \nimplications \n \nThe following resources must be provided: \n5.1 \nTools and equipment (see range of variables) \n5.2 \nWorking area/bench \n5.3 \nElectronic components \n5.4 \nTesting instruments and equipment \n5.5 \nAssessment rating sheet \n5.6 \nReporting forms \n6 Context of \nassessment \n6.1 \nAssessment maybe conducted in the workplace or in a \nsimulated workplace setting",
