  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Computer Systems Servicing NC II, the\ncandidate must demonstrate competence in all units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2\nThe qualification of Computer Systems Servicing NC II may be attained\nthrough:\n4.2.1\nAccumulation of Certificates of Competency (COCs) in all the\nfollowing units of competencies:\n\n4.2.1.1\nInstall and configure computer systems\n4.2.1.2\nSet-up computer networks\n4.2.1.3\nSet-up computer servers\n4.2.1.4\nMaintain and Repair Computer Systems and Networks\n\nSuccessful candidates shall be awarded a Certificate of\nCompetency (COC) in each of the core units.\n\nUpon accumulation and submission of all COCs acquired for the relevant units\nof competency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.3\nFor individuals, who already possess National Certificate (NC) or Certificate of\nCompetency (COC) along Computer Hardware Servicing NC II –\n4.3.1. Portfolio assessment is applicable for COC #1, COC #2 and COC #4,\nprovided the candidate is already employed and has related\nexperience for the past three (3) years or more along the qualification.\nHowever, if the assessor finds the evidences presented inadequate,\nhe may still require the candidate to undergo the practical\ndemonstration\nor\npresent\nother\nevidences\nin\nthe\nform\nof\nDemonstration, Third Party Report, etc. depending on the need for\nsupplementary evidences.\n4.3.2. Candidates are required to take assessment for COC #3 – “Set-up\ncomputer servers”.\n\n4.4\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.5\nThe following are qualified to apply for assessment and certification:\n\n4.5.1. Graduate of formal, non-formal, and informal including enterprise-\nbased training programs.\n\n4.5.2. Experienced workers (wage employed or self employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\n\n--- PDF PAGE 66 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n64\n"
}
