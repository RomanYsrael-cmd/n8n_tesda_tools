      "number": "25",
      "text": "Unit of Competency – is a component of the competency standards stating a specific key function or role in a particular job or occupation; it is the smallest component of achievement that can be assessed and certified under the PTQF 1. Computer System - The complete computer made up of the CPU, memory and related electronics (main cabinet), all the peripheral devices connected to it and its operating system. Computer systems fall into two broad divisions: clients and servers. Client machines fall into three categories from low to high end: laptop, desktop and workstation. Servers range from small to large: low-end servers, midrange servers and mainframes. 2. Computer Network, or simply a Network, is a collection of computers and other hardware interconnected by communication channels that allow sharing of resources and information. Where at least one process in one device is able to send/receive data to/from at least one process residing in a remote device, then the two devices are said to be in a network. It is a group of devices connected to each other. Networks may be classified into a wide variety of characteristics, such as the medium --- PDF PAGE 69 --- ___________________________________________________________________________________ TR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013 67 used to transport the data, communications protocol used, scale, topology, benefit, and organizational scope. 3. Configuration - The makeup of a system. To \"configure\" is to choose options in order to create a custom system. \"Configurability\" is a system's ability to be changed or customized. 4. Connector - Any plug and socket that links two devices together. Although taken for granted and rarely in the limelight, connectors are a huge industry, and the quality of these components is more critical than most people would imagine. When not designed or constructed properly, they often become the weakest element in an electronic system. 5. Display Adapter - A plug-in card in a desktop computer that converts the images created in the computer to the electronic signals required by the monitor. It determines the maximum resolution, refresh rate and number of colors that can be displayed, which the monitor must also be able to support. On many PC motherboards, the display adapter circuits are built into the chipset, and an AGP or PCI card is not required. 6. Expansion Board - A printed circuit board that plugs into an expansion slot and extends the computer's capability to control a peripheral device. All the boards (cards) that plug into a computer's bus are expansion boards, such as display adapters, disk controllers, network adapters and sound cards. 7. Expansion Bus - An input/output bus typically comprised of a series of slots on the motherboard. Expansion boards (cards) are plugged into the bus. ISA and PCI are the common expansion buses in a PC. 8. Graphical User Interface - A graphics-based user interface that incorporates movable windows, icons and a mouse. The ability to resize application windows and change style and size of fonts are the significant advantages of a GUI vs. a character-based interface. GUIs have become the standard way users interact with a computer, and the major GUIs are the Windows and Mac interfaces along with Motif for Unix and the GNOME and KDE interfaces for Linux. 9. LAN - a local area network (LAN) is a computer network that interconnects computers in a limited area such as a home, school, computer laboratory, or office building using network media. The defining characteristics of LANs, in contrast to wide area networks (WANs), include their usually higher data-transfer rates, smaller geographic area, and lack of a need for leased telecommunication lines."
    },
