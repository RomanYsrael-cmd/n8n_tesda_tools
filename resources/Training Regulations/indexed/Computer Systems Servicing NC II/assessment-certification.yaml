      "number": "16",
      "text": "User Interface - All graphics based today, the user interface includes the windows, menus and method of interaction between you and the computer. Prior to the Mac, Windows and Motif (UNIX) interfaces, all interaction was based on commands entered by the user. Operating systems may support optional interfaces and allow a new shell, or skin, to be used instead."
