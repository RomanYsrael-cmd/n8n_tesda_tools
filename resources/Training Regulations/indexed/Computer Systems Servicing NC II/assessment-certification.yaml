      "text": "Networks – see Computer Network."
    },
    {
      "number": "12",
      "text": "Operating System - The master control program that runs the computer. The first program loaded when the computer is turned on, its main part, the \"kernel,\" resides in memory at all times. The operating system sets the standards for all application programs that run in the computer. The applications \"talk to\" the operating system for all user interfaces and file management operations. --- PDF PAGE 70 --- ___________________________________________________________________________________ TR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013 68"
    },
    {
      "number": "13",
      "text": "Peripheral -Any hardware device connected to a computer, such as a monitor, keyboard, printer, disk, tape, graphics tablet, scanner, joy stick, paddle or mouse"
    },
    {
      "number": "14",
      "text": "Server - A computer system in a network that is shared by multiple users. Servers come in all sizes from x86-based PCs to IBM mainframes. A server may have a keyboard, monitor and mouse directly attached, or one keyboard, monitor and mouse may connect to any number of servers via a KVM switch. Servers may be also be accessed only through a network connection as well."
    },
    {
      "number": "15",
      "text": "Sound Card - Also called a \"sound board\" or \"audio adapter,\" it is a computer expansion board that records and plays back sound, providing inputs from a microphone or other sound source and outputs to speakers or an external amplifier. The de facto standard for sound card compatibility in PCs is Creative Labs' Sound Blaster."
    },
