      "text": "WEEE Directives - the prevention of waste electrical and electronic equipment (WEEE), and in addition, the reuse, recycling and other forms of recovery of such wastes so as to reduce the disposal of waste. It also seeks to improve the environmental performance of all operators involved in the life cycle of electrical and electronic equipment, e.g. producers, distributors and consumers and in particular those operators directly involved in the treatment of waste electrical and electronic equipment. --- PDF PAGE 71 --- ___________________________________________________________________________________ TR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013 69 The Technical Education and Skills Development Authority (TESDA) wishes to extend gratitude and appreciation to the many representatives of business, industry, academe and government agencies and labor groups who donated their time and expertise to the development and validation of these Training Regulations. • THE TECHNICAL EXPERT COMMITTEE ( 2012-2013) ENGR. ALEX S.E. SY - Chairperson President, CATIA Foundation, Inc. President, Electronic Industries Association of the Philippines, Inc. (EIAPI) MR. VICTOR GRUET - Member Proprietor, Symphony IT Consulting Secretary, Electronics Industries Association of the Philippines, Inc. (EIAPI) ENGR. EMMANUEL G. GONZALES - Member Academic Director MR. SEVERINO BURGOS - Member Supervising TESD Specialist MR. JULFORD ABASOLO – Member Supervising TESD Specialist • THE PANEL EXPERT ( VALIDATION) ENGR. RONALDO B. RACELIS Deputy Program Director, Technology Asian College (formerly ACSAT) MR. JAY J. CRISOSTOMO Trainer, Computer Systems ENGR. EMMANUEL G. GONZALES Academic Director MS. LUZ D.G. GALANG Trainer MR. EDWIN MENDOZA • ELECTRONIC INDUSTRIES ASSOCIATION OF THE PHILIPPINES, INC. • THE TESDA BOARD - STANDARDS SETTING AND SYSTEMS DEVELOPMENT • THE MANAGEMENT AND STAFF OF TESDA SECRETARIAT • Qualifications and Standards Office (QSO) • Competency Assessment 