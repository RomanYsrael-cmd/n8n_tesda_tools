    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for Computer Systems Servicing NC II.\n\n3.1.\nCURRICULUM DESIGN\n\nCourse Title:\nCOMPUTER SYSTEMS SERVICING NC Level: NC II\nTraining Hours:\n 40 Hours (Basic)\n 80 Hours (Common)\n160 Hours (CORE)\n------------------------------\n280 Hours – TOTAL\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\na Computer Systems Service Technician, in accordance with industry standards. It covers\nthe basic and common competencies in addition to the core competencies such as to\ninstall and configure computers systems, set-up computer networks and servers and to\nmaintain and repair computer systems and networks.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n(40 hours)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace\nmeeting and discussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth & safety\n4.1 Identify hazards and risks.\n4.2 Evaluate hazard and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational health\nand safety awareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 57 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n55\n\nCOMMON COMPETENCIES\n(80 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Apply\nQuality\nStandards\n\n1.1. Assess quality of received\nmaterials\n1.2. Assess own work\n1.3. Engage in quality\nimprovement\n\n Field trip\n Symposium\n Problem solving\n Simulation\n Individualize\nlearning\n On the job\ntraining\n Demonstration\n& questioning\n Observation &\nquestioning\n Third party\nreport\n2. Perform\nComputer\nOperation\n2.1. Plan and prepare for task to\nbe taken undertaken\n2.2. Input data into computer\n2.3. Access information using\ncomputer\n2.4. Produce output/ data using\ncomputer system\n2.5. Use basic functions of a\nwww-browser to locate\ninformation\n2.6. Maintain computer\nequipment and systems\n Modular\n Film showing\n Computer based\ntraining (e-\nlearning)\n Project method\n On the job\ntraining\n\n Demonstration\n& questioning\n Observation &\nquestioning\n Third party\nreport\n Assessment of\noutput product\n Portfolio\n Computer\nbased\nassessment\n3. Perform\nMensuratio\nn and\nCalculation\n3.1. Select measuring\ninstruments\n3.2. Carry out measurement\nand calculation\n3.3. Maintain measuring\ninstruments\n Self- paced/\nmodular\n Demonstration\n Small group\ndiscussion\n Distance\nlearning\n Written/Oral\nexamination\n Practical\ndemonstration\n\n4. Prepare and\nInterpret\nTechnical\nDrawings\n4.1. Identify different kinds of\ntechnical drawings\n4.2. Interpret technical drawing\n4.3. Prepare/make changes on\nelectrical/electronic\nschematic and drawings\n4.4. Store technical drawings\nand equipment/\ninstruments\n Lecture/\ndemonstration\n Dualized\ntraining\n Distance\nlearning\n Written /oral\n examinations\n Direct\n observation\n Project method\n interview\n5. Use Hand\nTools\n5.1. Plan and prepare for task to\nbe undertaken\n5.2. Prepare hand tools\n5.3. Use appropriate hand tools\nand equipment\n5.4. Maintain hand tools\n Lecture /\nDemonstration\n Distance\nlearning\n Film Showing\n\n Written/Oral\nexamination\n Practical\ndemonstration\n Observation &\nquestioning\n\n--- PDF PAGE 58 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n56\n\n6. Terminate\nand\nConnect\nElectrical\nwiring and\nElectronic\nCircuit\n6.1 Plan and prepare for\ntermination/connection of\nelectrical wiring/electronic\ncircuits\n6.2 Terminate/connect electrical\nwiring/electronic circuits\n6.3 Test termination/ connection\nof electrical wiring\n/electronics circuits\n Film Viewing\n Individualized\nLearning\n Direct Student\nLaboratory\nExperience\n On-the-Job\nTraining\n Project Method\n Demonstration\nand\nQuestioning\n Assessment of\nOutput Product\n7. Test\nelectronic\ncomponents\n\n7.1 Determine criteria for testing\nelectronics components\n7.2 Plan an approach for\ncomponent testing\n7.3 Test components\n7.4 Evaluate the testing process\n Film Viewing\n Individualized\nLearning\n Direct Student\nLaboratory\nExperience\n On-the-Job\nTraining\nProject Method\n Demonstration\nand\nQuestioning\n Assessment of\nOutput Product\n\nCORE COMPETENCIES\n(160 hours)\n\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Install and\nconfigure\ncomputer\nsystems\n1.1. Assemble computer\nhardware\n1.2. Install operating system and\ndrivers for peripherals/\ndevices.\n1.3. Install the computer\napplication software\n1.4. Conduct testing and\ndocumentation\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Written\nexamination\n• Practical\nexamination\n2. Set-up\ncomputer\nnetworks\n2.1. Install network cables\n2.2. Set network configuration\n2.3. Set router/Wi-Fi/ wireless\naccess point/repeater\nconfiguration\n2.4. Inspect and test the\nconfigured computer\nnetworks\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Written\nexamination\n• Practical\nexamination\n\n--- PDF PAGE 59 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n57\n3. Set-up\nComputer\nServers\n3.1. Set-up user access\n3.2. Configure network services\n3.3. Perform testing,\ndocumentation and pre-\ndeployment practices\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Written\nexamination\n• Practical\nexamination\n4. Maintain\nand repair\ncomputer\nsystems\nand\nnetworks\n4.1. Plan and prepare for\nmaintenance and repair\n4.2. Maintain computer systems\nand networks\n4.3. Diagnose faults of computer\nsystems\n4.4. Rectify/correct defects in\ncomputer systems\n4.5. Inspect and test the\ncomputer systems and\nnetworks\n\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Written\nexamination\n• Practical\nexamination\n\n--- PDF PAGE 60 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n58\n3.2.\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of the competency-based TVET.\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET systems recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilities the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire a specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructors are not in the same\nplace. Distance learning may employ correspondence study, or audio, video\nor computer technologies.\n\n--- PDF PAGE 61 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n59\n3.3.\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n• Can communicate either oral and written;\n• Must pass the trainability/aptitude test.\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the\ntrainees by the school or training center delivering the TVET program.\n\n3.4.\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\nCOMPUTER SYSTEMS SERVICING – NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor Computer Systems Servicing – NC II\n\nQUANTITY *\nTOOLS\n10 pieces\nScrewdriver (standard)\n10 pieces\nScrewdriver (Philips)\n10 pieces\nLong nose pliers\n10 pieces\nMechanical pliers\n10 sets\nAllen wrench\n10 pieces\nCrimping tools\n10 pieces\nSoldering iron\n10 pieces\nSolder sucker\n5 pieces\nWire stripper\n1 unit\nPortable electric hand drill\n1 set\nDrill bit\n5 sets\nPrecision screw drivers\n10 pcs\nAnti-static devices\n5 pcs\nFlash light/Head mounted light\n* Minimum quantity recommended for a Class size of 25 trainees\n\n--- PDF PAGE 62 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n60\n\nQUANTITY *\nEQUIPMENT\n26 units\nDesktop Computer\n10\nLaptop computer/Netbook\n10\nComputers for server\n10\nServer cabinet/Frame\n20 pcs\nPatch panel (48-ports)\n10 sets\nWorking tables\n1 unit\nInternet subscription (at least 2 MBPS)\n10 units\nUninterruptible Power Supply (UPS)\n10 unit\nHub / Switch\n2 units\nManaged switch\n1\nNetwork controller\n11\nADSL Router with Wi-Fi\n10\nWireless Access Point\n1 unit\nPC Video camera\n2 units\nExternal optical drive\n1 unit\nUSB External HD\n1 unit\nNetwork External HD\n1 unit\nscanner\n1 unit\nUSB printer\n1 unit\nNetwork printer\n11 pieces\nFlash disk / Memory stick\n10 units\nElectronic tester VOM\n5 units\nLAN Cable tester\n* Minimum quantity recommended for a Class size of 25 trainees\n\nQUANTITY\nMATERIALS\n400 pcs.\nRJ 45\n25 pcs.\nModular box (RJ45)\n20 pcs.\nRaceway or Slotted PVC 1.5” x 1.5” x 48”\n1 box\nUTP cable\n1 can\nContact cleaner\n1 piece\nWhiteboard\n1 lot\nFastener\n\n--- PDF PAGE 63 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n61\n1 spool\nFiller (lead-free)\n8 pcs\nFiber optic cable 2 meters (terminated)\n\nQUANTITY\nINSTALLERS / SOFTWARE\n26\nDesktop OS (license for proprietary software)\n10\nNetwork OS (license for proprietary software)\n26\nOffice productivity software (license for proprietary\nsoftware)\n26\nAnti-virus (license for proprietary software)\n5\nDisk utility software\n5\nVirtualization software (license for proprietary software)\n5\nDisk creator software\n5\nDisk image software\n•\nNOTE: For free Open source systems users - Institutions should own at least\none (1) valid license for the following: Desktop OS, Network OS, Office\nProductivity Software and Antivirus.\n\nQUANTITY\nRESOURCES / MANUALS\n26 pieces\nMotherboard’s manual and installer\n10 pieces\nDevice driver installer\n1 lot\nAssorted Computer book, PC Magazines and journals\n\n3.5.\nTRAINING FACILITIES\n\nThe Computer Systems Service Workshop must be in an infrastructure facility that is\ngenerally accepted to industry standards and practice. Based on class size of\nminimum of 25 student/trainees the space requirements for the teaching/ learning\nand circulation areas are as follows:\n\nTEACHING /\nLEARNING AREAS\nSIZE\n(in METER)\nAREA\n(in Sq. Meters)\nTOTAL AREA\n(in Sq. Meters)\n• laboratory\nand/or lecture\narea\n6 x 8\n48\n48\n•\nstorage area\n2 x 2\n4\n4\n• learning\nresource center\n4 x 5\n20\n20\n• equipment\ncirculation area\n\n20\n20\nTotal Workshop Area:\n92\n\n--- PDF PAGE 64 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n62\n\n3.6.\nTRAINERS QUALIFICATION\n\nCOMPUTER SYSTEMS SERVICING – NC II\n\nTRAINERS QUALIFICATION (TQ II)\n\n• Holder of National TVET Trainer’s Certificate (NTTC) Level 1\n• *Must have at least 2 years relevant job/industry experience\n\n*Optional. Only when required by the hiring institution.\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency.\n\nAs a matter of policy, graduates of programs registered with TESDA under\nthese training regulations are required to undergo mandatory national competency\nassessment upon completion of the program.\n\n--- PDF PAGE 65 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n63"
