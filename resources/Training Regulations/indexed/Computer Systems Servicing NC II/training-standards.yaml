standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET systems recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilities the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire a specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructors are not in the same\nplace. Distance learning may employ correspondence study, or audio, video\nor computer technologies.\n\n--- PDF PAGE 61 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n59\n3.3.\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n• Can communicate either oral and written;\n• Must pass the trainability/aptitude test.\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the\ntrainees by the school or training center delivering the TVET program.\n\n3.4.\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\nCOMPUTER SYSTEMS SERVICING – NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor Computer Systems Servicing – NC II\n\nQUANTITY *\nTOOLS\n10 pieces\nScrewdriver (standard)\n10 pieces\nScrewdriver (Philips)\n10 pieces\nLong nose pliers\n10 pieces\nMechanical pliers\n10 sets\nAllen wrench\n10 pieces\nCrimping tools\n10 pieces\nSoldering iron\n10 pieces\nSolder sucker\n5 pieces\nWire stripper\n1 unit\nPortable electric hand drill\n1 set\nDrill bit\n5 sets\nPrecision screw drivers\n10 pcs\nAnti-static devices\n5 pcs\nFlash light/Head mounted light\n* Minimum quantity recommended for a Class size of 25 trainees\n\n--- PDF PAGE 62 ---\n___________________________________________________________________________________\nTR - COMPUTER SYSTEMS SERVICING NC II Amended - December 2013\n60\n\nQUANTITY *\nEQUIPMENT\n26 units\nDesktop Computer\n10\nLaptop computer/Netbook\n10\nComputers for server\n10\nServer cabinet/Frame\n20 pcs\nPatch panel (48-ports)\n10 sets\nWorking tables\n1 unit\nInternet subscription (at least 2 MBPS)\n10 units\nUninterruptible Power Supply (UPS)\n10 unit\nHub / Switch\n2 units\nManaged switch\n1\nNetwork controller\n11\nADSL Router with Wi-Fi\n10\nWireless Access Point\n1 unit\nPC Video camera\n2 units\nExternal optical drive\n1 unit\nUSB External HD\n1 unit\nNetwork External HD\n1 unit\nscanner\n1 unit\nUSB printer\n1 unit\nNetwork printer\n11 pieces\nFlash disk / Memory stick\n10 units\nElectronic tester VOM\n5 units\nLAN Cable tester\n* Minimum quantity recommended for a Class size of 25 trainees\n\nQUANTITY\nMATERIALS\n400 pcs.\nRJ 45\n25 pcs.\nModular box (RJ45)\n20 pcs.\nRaceway or Slotted PVC 1.5” 