  "source_text": "SECTION 1 AUTOMOTIVE PAINTING NC II QUALIFICATION\n\nThe AUTOMOTIVE PAINTING NC II Qualification consists of competencies\nthat a person must achieve to remove paint from vehicle painted surfaces, prepare\nvehicle substrates for refinishing, mask vehicle panels and components, apply\nrefinishing primers to vehicle surfaces, repair body panel, apply surfacer to vehicle\nsurfaces and prepare and operate vehicle paint drying equipment.\n\nThis Qualification is packaged from the competency map of the Automotive and\nLand Transport Sector as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the\nworkplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nALT723211\nValidate vehicle specification\nALT832212\nMove and position vehicle\nALT723214\nUtilize automotive tools\nALT723215\nPerform mensuration and calculation\nALT723216\nUtilize workshop facilities and equipment\nALT723217\nPrepare servicing parts and consumables\nALT723218\nPrepare vehicle for servicing and releasing\n\nCODE NO.\nCORE COMPETENCIES\nALT713301\nRemove paint from vehicle painted surfaces\nALT713302\nPrepare panel for refinishing\nALT713303\nMask vehicle panels and components\nALT713304\nApply primer surfacer\nALT721307\nRepair body panel using filler\nALT713305\nPrepare and operate vehicle paint drying equipment\nALT713306\nSpray solid color paint\nALT713307\nPerform polishing\n\n--- PDF PAGE 6 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 2\nA person who has achieved this Qualification is competent to be:\n\n Automotive Body Painting Personnel\n Automotive Body Paint Refinishing Technician\n\n--- PDF PAGE 7 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 3"
}
