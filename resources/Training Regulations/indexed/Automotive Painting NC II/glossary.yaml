      "term": "Alternate Term(s): Flatting",
      "definition": "9. SEALANT A protective product applied by hand or machine to an automotive paint, which coats, seals and protects the surface. Normally contains silicones to maximize durability. 10. SOLID COLOR A coating, which contains colored pigments only, i.e., does not contain pigments such as aluminum and micas 11. SPRAY GUN A typical painter will use a high-pressure spray gun to apply coatings. High-pressure guns are powered by compressed air. The purpose of the gun is to turn the liquid paint into a mist (atomize) and propel the paint toward the surface to be painted. When the wet mist contacts the surface, some of it sticks and some of it bounces off of the surface. Under ideal conditions, only about 30% of the paint sprayed stick or is transferred to the surface using a high pressure spray gun. This is termed transfer efficiency; high-pressure spray guns have a maximum transfer efficiency of 30%. This means that if a gallon of paint can coat 300 square feet, it will only coat 90 square feet if applied with a high-pressure spray gun. 12. TACK CLOTH Cotton fabric, such as cheesecloth, lightly impregnated with a resin, used to remove dust from a surface after rubbing down and prior to further painting. Tack rags should be stored in an airtight container to conserve their tackiness. 13. WET SANDING A procedure of simultaneously sanding and rinsing an automotive finish to remove imperfections. Regarded as complicated and should only be attempted by professionals"
