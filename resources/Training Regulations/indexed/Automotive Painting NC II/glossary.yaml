  "source_text": "1. DEGREASING\nThe removal from the substrate of contaminants, which\nwould otherwise give rise to surface defects and\nperformance failures. e.g. poor adhesion\n\n2. DRYING\nThe process of change of a coating from the liquid to the\nsolid state by evaporation of solvent, chemical reaction of\nthe binding medium, or a combination of these processes.\nWhen drying takes place during exposure to air at normal\ntemperatures, it is called 'air-drying'; if it can be accelerated\nby the application of a moderate degree of heat it is called\n'Force-drying' (or Low-bake), as distinct from High-bake.\nAlternate Term(s): Binder, Air-drying, Force-drying, Stoving,\nLow-bake, High-bake\n\n3. FLASH-OFF TIME\nDwell time for solvent to evaporate from the paint surface\n\n4. MASKING\nTemporary covering of areas not to be painted\n\n5. POLISHING\nTerm is often used to describe the action of using a machine\nto buffer wheel a vehicle\n\n6. PRIMERS\nMaterial applied to the surface to seal, fill scratches and\nimprove adhesion of paint.\n\n7. PUTTY\nAlso known as body filler.\n\n8. SANDING\nAn abrasive process used to level a coated surface prior to\nthe application of a further coat.\nAlternate Term(s): Flatting\n\n9. SEALANT\nA protective product applied by hand or machine to an\nautomotive paint, which coats, seals and protects the\nsurface. Normally contains silicones to maximize durability.\n\n10. SOLID COLOR\nA coating, which contains colored pigments only, i.e., does\nnot contain pigments such as aluminum and micas\n\n11. SPRAY GUN\nA typical painter will use a high-pressure spray gun to apply\ncoatings. High-pressure guns are powered by compressed\nair. The purpose of the gun is to turn the liquid paint into a\nmist (atomize) and propel the paint toward the surface to be\npainted. When the wet mist contacts the surface, some of it\nsticks and some of it bounces off of the surface. Under ideal\nconditions, only about 30% of the paint sprayed stick or is\ntransferred to the surface using a high pressure spray gun.\nThis is termed transfer efficiency; high-pressure spray guns\nhave a maximum transfer efficiency of 30%. This means that\n\n--- PDF PAGE 186 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 182\nif a gallon of paint can coat 300 square feet, it will only coat\n90 square feet if applied with a high-pressure spray gun.\n\n12. TACK CLOTH\nCotton fabric, such as cheesecloth, lightly impregnated with\na resin, used to remove dust from a surface after rubbing\ndown and prior to further painting. Tack rags should be\nstored in an airtight container to conserve their tackiness.\n\n13. WET SANDING\nA procedure of simultaneously sanding and rinsing an\nautomotive finish to remove imperfections. Regarded as\ncomplicated and should only be attempted by professionals\n\n--- PDF PAGE 187 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 183",
