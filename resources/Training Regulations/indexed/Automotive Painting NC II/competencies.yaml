ous parts \nand \nconsumables \n1.9  Applying safety \npractices  \n1.10 Understanding \nsafety practices \n1.11 Following \nmanuals \n2.  Retrieve and \nwithdraw parts and \nconsumables \n2.1  Requisition slip is \nprepared according \nto identified parts \nand consumables. \n2.1  Job requirements \n2.2  Safety practices \n2.3  Understanding \nmanuals \n2.1  Reading and \ninterpreting \nrequisition slip\n\n--- PDF PAGE 66 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               62 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.2  Withdrawal of parts \nand materials are \nrecorded. \n2.3  Quantity of parts \nand consumables \nare validated \naccording to job \nrequirements. \n2.4  Parts and materials \nare handled \nfollowing safety \nprocedures. \n2.4  Hazardous parts \nand consumables \n2.5  Solid waste \nmanagement act \n(RA 6969) \n2.6  Wearing of PPE’s \n2.7  Updated types of \nparts & \nconsumables for \nproper usage \n2.2  Validating \nquantity of parts \nand materials \n2.3  Handling parts \nand \nconsumables \n3.  Complete work \nprocess \n3.1  Used parts and \nconsumables are \nlabeled and \nsegregated. \n3.2  Used parts are \npacked and \nreturned to \ncustomers. \n3.3  Consumables are \ncollected for \nrecycling. \n3.4  PPEs are worn \nfollowing OSHS. \n3.5  Wastes are \ndisposed according \nto RA 6969. \n3.1  Labeling and \nsegregation of \nused parts and \nconsumables \n3.2  Job requirements \n3.3  Safety practices \n3.4  3Rs \n3.5  Solid waste \nmanagement act \n(RA 6969) \n3.6  Wearing of PPE’s \n3.1  Waste \nsegregation and \ndisposal of parts \n& consumables \naccording to RA \n6969\n\n--- PDF PAGE 67 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               63 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Parts and consumables \nMay include: \n1.1   Engine oil \n1.2   Clutch fluid \n1.3   Transmission oil \n1.4   Differential oil \n1.5   Power steering fluid \n1.6   Brake fluid \n1.7   Engine coolant \n1.8   Engine oil filter \n1.9   Fuel filter \n1.10 Air cleaner element \n1.11 Feed pump strainer \n1.12 Sparkplugs (Gasoline engine) \n1.13 Battery \n1.14 Air cleaner \n1.15 Tire \n1.16 Wiper blade \n1.17 A/C pollen filter \n1.18 Bulb \n1.19 Brake pad/brake shoe \n1.20 Clutch lining \n2.  Determining parts and \nconsumables \nMay include: \n2.1   Quantity \n2.2   Quality \n3.  Indirect materials \nMay include: \n3.1   Rags \n3.2   Saw dust \n3.3   Cleaning fluids \n3.4   Sand paper \n4.  Hazardous parts \nconsumables \nMay include: \n4.1   Batteries \n4.2   Used oil \n4.3   Used fluids \n4.4   Used coolant \n4.5   Used parts \n4.6   Used oil filter \n5.  Wastes \nMay include: \n5.1   Contaminated consumables \n5.2   Contaminated parts\n\n--- PDF PAGE 68 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               64 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Identified parts and consumables \n1.2   Retrieved and withdrawn parts and consumables \n1.3   Completed work process \n1.4   Applied safety practices \n2.  Resource \nimplications \nThe following resources should be provided: \n2.1   Workplace: Real or simulated work area \n2.2   Materials relevant to the activity  \n2.3   Repair manuals and related reference materials \n3.  Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1   Direct observation  \n3.2   Interview \n3.3   Written examination \n3.4   Demonstration with oral questioning \n3.5   Third party report \n4.  Context of \nAssessment \n4.1   Competency may be assessed individually in the actual \nworkplace or through accredited institution.\n",
