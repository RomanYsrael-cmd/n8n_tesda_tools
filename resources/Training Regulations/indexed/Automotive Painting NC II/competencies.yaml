\ncriteria. \n2.2  Minor dent is \nrectified according \nto manufacturer’s \nspecifications. \n2.3  Body filler is mixed \naccording to \nmanufacturer \nspecifications. \n2.4  Filler is applied to \nrepaired panels \naccording to \nindustry criteria. \n2.5  Adhesives, \nincluding adhesion \npromoter/ primer \nsurfacer are applied \naccording to \nindustry criteria. \n2.6  Inspection is \nperformed to check \nif the body filler is \ncompletely dried \nfollowing workplace \nprocedures. \n2.7  Corrective \nmeasures are \napplied based on \nrepair manuals. \n2.8  Block sanding is \nperformed \naccording to \nindustry standard. \n2.9  Repairs are \ncompleted to pre-\npainting condition. \n2.1  Preparation of \ndamaged panels \n2.2  Pre-filler \napplication \nstandard \n2.3  Mixture of body \nfiller \n2.4  Thermoplastic \nwelding and \nfusion technique \n2.5  Use of adhesive \nand adhesive \nfusion promoter \n2.6  Types of plastic \nmaterial \n2.7  Repair quality \nrequirements \n2.8  Types of plastic \nadhesive \n2.9  Techniques in \nrectifying minor \ndent \n2.10 Arithmetic \noperations \n2.11 Formulation of \nfiller \n2.12 Weight of \nrequired filler \n2.13 Application \ntechnique for filler \n2.14 Industry criteria \n2.15 Repair \ncompletion \n2.16 OSHS \n2.17 Wearing of PPEs \n2.18 Attitude \n2.18.1 Patient \n2.18.2 Attention \nto details \n2.18.3 Time \nconscious \n2.18.4 Honest \n2.18.5 Resource-\nful \n2.1  Using basic \nmathematical \noperations, \nincluding \naddition, \nsubtraction, \nmultiplication \nand division, to \ncalculate ratios \nfor dilution \nrates.to: \ncalculate body \nfiller quantities \nand mix required \nratios \n2.2  Calculating \nsurface Area \n2.3  Using specialist \nbody repair tools \nand weighing \nscale for filler \n2.4  Mixing body filler \n2.5  Applying body \nfiller \n2.6  Rectifying minor \ndent \n2.7  Performing block \nsanding \n2.8  Conducting \ninspection and \nmonitoring \n2.9  Applying \ncorrective \nmeasures \n2.10 Completing \