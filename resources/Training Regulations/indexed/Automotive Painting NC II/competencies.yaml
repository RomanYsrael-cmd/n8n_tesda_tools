          "source_text": "1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Prepared for paint drying. \n1.1.1   Determined job requirements. \n1.1.2   Accessed and interpreted information on workplace \nprocedures and paint drying equipment operation. \n1.1.3   Identified hazards associated with the work and \nmanaged risks. \n1.1.4   Selected and inspected paint drying tools, materials \nand equipment. \n1.1.5   Worn personal protective equipment (PPEs). \n1.1.6   Planned work. \n \n1.2   Operated paint drying equipment and facilities. \n1.2.1   Prepared and set up paint drying equipment. \n1.2.2   Operated paint drying equipment and facilities. \n1.2.3   Monitored paint drying equipment and its \nperformance. \n1.2.4   Applied corrective action. \n \n1.3   Completed work processes. \n1.3.1   Made final inspection. \n1.3.2   Turned-over vehicle and components. \n1.3.3   Restored work area. \n1.3.4   Managed wastes. \n1.3.5   Checked and stored tools and equipment. \n1.3.6   Reported faulty tools and equipment. \n1.3.7   Accomplished workplace documents. \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Automotive repair workplace or simulated workplace \n2.2   Workplace instructions \n2.3   PPEs required for pre-repairs \n2.4   Three different vehicles with body components requiring \nremoval and storage \n2.5   Vehicle protection covers tools, equipment and material \nappropriate for removing and storing vehicle body \ncomponents \n2.6   Equipment user’s manual \n3.  Method of \nassessment \nCompetency should be assessed through:  \n3.1   Demonstration with Oral questioning \n3.3   Written exam \n3.4   Direct Observation \n4.  Context for \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.",
