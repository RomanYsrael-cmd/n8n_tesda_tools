        "source_text": "--- PDF PAGE 118 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               114 \n \nUNIT OF COMPETENCY \n: \nPERFORM POLISHING \n \n \n \nUNIT CODE \n: \nALT713307 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competency in performing polishing \nfor automotive body painting. It also involves skills in \napplying masking materials and handling of polishing \nequipment. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Assess painted \nsurface \n1.1  Adequate lighting \nsystem is used in \nassessing painted \nsurface. \n1.2 Assessment is \nconducted based \non manual. \n1.3  Polishing \nprocedure is \ndetermined and \nselected based on \nassessment. \n1.3 Repair procedure is \nselected based on \nassessment.  \n1.1  Types of lighting \nsources \n1.2  Use of adequate \nlighting system \n1.3  Assessment of \nlighting system \n1.4  Polishing \nprocedure \n1.5  Selection of \npolishing \nprocedure per \nselected repair \nprocedure \n1.6  Attitude \n1.6.1 Patient \n1.6.2 Honest \n1.6.3 Sense of \nQuality in \nWork  \n1.6.4 Thorough-\nness \n1.6.5 Dedication \nto Work \n1.6.6 Attentive to \ndetails \n1.1  Using adequate \nlighting system \n1.2  Determining \npolishing \nprocedure \n1.3  Selecting \npolishing and \nrepair \nprocedures. \n2.  Prepare surface for \npolishing \n2.1  Workplace is \nproperly cleaned as \nper polishing \ncompound \nmanufacturer \nspecification. \n2.2  Masking materials \nare applied on \nnecessary areas as \nper appropriate \nmasking \nprocedure. \n2.1  Cleaning of \nworkplace \n2.2  Compound \nmanufacturer \nspecification \n2.3  Types of masking \nmaterials \n2.4  Masking \nprocedure \n2.5  Positions for \npanel/surfaces \npolishing \n2.1  Cleaning \nworkplace \n2.2  Applying \nmasking \nmaterials \n2.3  Employing \nmasking \nprocedure \n2.4  Positioning \npanel/ surface to \npolish\n\n--- PDF PAGE 119 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               115 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.3  Panel/surface to \npolish is positioned \nas per polishing \nrequirements. \n2.6  Polishing \nrequirements \n2.7  OSHS \n2.8  5S of Good \nHousekeeping \n2.9  Attitude \n2.9.1 Patient \n2.9.2 Honest \n2.9.3 Sense of \nQuality in \nWork \n2.9.4 Thorough-\nness \n2.9.5 Dedication \nto Work \n2.9.6 Attentive to \ndetails \n2.5  Following \npolishing \nrequirements \n2.6  Practicing OSHS \n3.  Polish painted \nsurface \n3.1  Manual hand \npolishing is applied \non surface as per \njob requirements. \n3.2  Sanding is applied \non surface as per \njob requirements. \n3.3  Handling of \npolishing \nequipment, tools \nand materials is \ndone as per \nprocedures. \n3.4  Polishing is \nperformed as per \nprocedure. \n3.5  Polishing \ncompounds are \napplied as per \npolishing compound \nmanufacturer \nstandard. \n3.1  Kinds of paint \nrepair procedures \n3.2  Manual hand \npolishing \n3.3  Sanding \n3.4  Handling of \npolishing \nequipment, tools \nand materials \n3.5  Procedure in \nusing polisher \n3.6  Polishing \nprocedures \n3.7  Types of polishing \ncompounds \n3.8  Polishing pads \n3.8.1 Wool \n3.8.2 Foam \n3.9  Over-polishing \n3.10 Thin paint results \n3.11 OSHS on \npolishing painted \nsurface \n3.12 Attitude \n3.12.1 Patient \n3.12.2 Honest \n3.12.3 Sense of \nQuality in \nWork \n3.12.4 Thorough-\nness \n3.1  Applying manual \npolishing \n3.2  Applying sanding \nprocedures \n3.3  Handling \npolishing \nequipment, tools \nand materials \n3.4  Performing \npolishing work \n3.5  Applying \npolishing \ncompounds\n\n--- PDF PAGE 120 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               116 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.12.5 Dedication \nto Work \n3.12.6 Attentive \nto details \n4.  Clean polished \nsurface \n4.1  Adequate tap water \nfor washing and \ncleaning is used \nbased on workplace \nprocedure. \n4.2  Soft fine cloth or \nflannel cloth is used \nfor wiping based on \nworkplace \nprocedure. \n4.3  Surface is wiped-\ndried and cleaned \nbased on workplace \nprocedure. \n4.1  Procedure in \ncleaning polished \nsurface \n4.2  Washing and \ncleaning of \npolished surface \n4.3  Wiping using soft \nfine cloth \n4.4  Drying of surface \n4.5  Attitude \n4.5.1 Patient \n4.5.2 Honest \n4.5.3 Sense of \nQuality in \nWork \n4.5.4 Thorough-\nness  \n4.5.5 Dedication \nto Work \n4.5.6 Attentive to \ndetails \n4.1  Using tap water \nfor cleaning and \nwashing  \n4.2  Wiping polished \nsurface \n4.3  Drying polished \nsurface \n4.4  Using materials \nfor cleaning \npolished surface\n\n--- PDF PAGE 121 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               117 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Lighting system \nLighting system may include: \n1.1   800-1000 lux \n1.2   Natural sunlight \n2.  Polishing procedure \nPolishing procedure includes: \n2.1   Sanding and repainting with clear coat \n2.2   Sanding coarse \n2.3   Fine sanding \n2.4   Fine Polishing \n3.  Masking materials \nMasking materials may include: \n3.1   Masking paper/plastics \n3.2   Masking tapes for auto use \n3.3   Moulding tapes \n3.4   Fine line tapes \n3.5   Spray –type masking \n4.  Masking procedure \nMasking procedure may include: \n4.1   Reverse masking \n4.2   Masking non-removable parts \n4.3   Masking curved or complex areas or surfaces \n4.4   Masking for block painting \n4.5   Masking for spot repairs \n5.  Handling of polishing \nequipment \nHandling of polishing equipment may include: \n5.1   Angle of polishing \n5.2   Direction of rotation \n5.3   Strokes in polishing \n5.4   Speed of rotation \n5.5   Air pressure (pneumatic) \n6.  Polishing compounds \nPolishing compounds (liquid or paste) may include: \n6.1   Fine \n6.2   Medium \n6.3   Coarse\n\n--- PDF PAGE 122 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               118 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Assessed painted surface. \n1.1.1   Used adequate lighting system. \n1.1.2   Applied polishing procedure. \n \n1.2   Prepared surface for polishing. \n1.2.1   Cleaned workplace. \n1.2.2   Applied masking materials on necessary areas. \n1.2.3   Positioned panel/surface to polish. \n \n1.3   Polished painted surface. \n1.3.1   Applied manual hand polishing. \n1.3.2   Applied sanding on surface. \n1.3.3   Handled polishing equipment, tools and materials. \n1.3.4   Performed polishing. \n1.3.5   Applied polishing compounds. \n \n1.4   Cleaned polished surface. \n1.4.1   Used tap water for washing and cleaning. \n1.4.2   Used soft fine cloth or flannel cloth for wiping. \n1.4.3   Wiped-dried and cleaned surface. \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Materials relevant to the activity \n2.2   Appropriate tools, supplies and materials \n2.3   Real or simulated workplace \n2.4   First-aid kit \n2.5   Fire Extinguisher \n2.6   Working table \n3.  Method of \nassessment \nCompetency should be assessed through:  \n3.1   Demonstration with Oral questioning \n3.2   Written exam \n3.3   Direct Observation \n4.  Context for \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
