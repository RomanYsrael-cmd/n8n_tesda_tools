        "source_title": "REPAIR BODY PANEL USING FILLER",
        "source_text": "--- PDF PAGE 102 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               98 \n \nUNIT OF COMPETENCY \n: \nREPAIR BODY PANEL USING FILLER \n \n \n \nUNIT CODE \n: \nALT721307 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit describes the performance outcomes required \nto repair body panels using filler. It involves preparing for \nthe task, selecting and using specialist tools and \nequipment, identifying body filler type and specifications, \ncalculating and mixing body filler and applying it to \npanels, completing repairs to pre-paint condition, and \ncompleting workplace processes and documentation. It \nincludes simple, complex and vehicle thermoplastic body \npanels and components. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Prepare to repair \nbody panels using \nfiller \n1.1  Job requirements \nare determined \nfrom workplace \ninstructions. \n1.2  Manufacturer \nspecifications for \nbody filler \napplication and \nrelevant safety data \nsheets (SDS) are \nsourced and \ninterpreted. \n1.3  Materials, tools \nand equipment are \nselected and \nchecked for quality \nand serviceability. \n1.4  Hazards associated \nwith the work are \nidentified and risks \nare managed \nfollowing workplace \nprocedure. \n1.5  Work area is \nprepared and work \nis planned to \nminimize waste and \nuse time efficiently. \n1.6  Personal \nProtective \nEquipment (PPEs) \nare selected and \n1.1  Job requirements \n1.2  Manufacturer \nspecifications for \nbody filler \n1.3  Relevant topics \nfor safety data \nsheets(SDS) \n1.4  Materials, tools \nand equipment for \nputty application \n1.5  Work hazard \n1.6  Industry criteria \n1.7  Work plan \n1.8  Waste and time \nmanagement \n1.9  OSHS \n1.10 Wearing of PPEs \n1.11 Attitude: \n1.11.1 Patience \n1.11.2 Attention \nto details \n1.11.3 Time \nconscious \n1.11.4 Honest \n1.1  Locating \nappropriate \nsources of  \ninformation \nefficiently \n1.2  Clarifying \ninstructions and \nprocedures \n1.3  Determining job \nrequirements \n1.4  Sourcing \nmanufacturer \nspecifications \nand relevant \nSafety Data \nSheet \n1.5  Selecting and \nchecking of \nmaterials, tools \nand equipment \n1.6  Identifying work \nhazard \n1.7  Preparing work \narea \n1.8  Planning work  \n1.9  Wearing of PPEs\n\n--- PDF PAGE 103 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               99 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nworn following \nOSHS. \n2.  Carry out repair \nactivities using \nfiller \n2.1  Damaged panels \nare prepared \nfollowing industry \ncriteria. \n2.2  Minor dent is \nrectified according \nto manufacturer’s \nspecifications. \n2.3  Body filler is mixed \naccording to \nmanufacturer \nspecifications. \n2.4  Filler is applied to \nrepaired panels \naccording to \nindustry criteria. \n2.5  Adhesives, \nincluding adhesion \npromoter/ primer \nsurfacer are applied \naccording to \nindustry criteria. \n2.6  Inspection is \nperformed to check \nif the body filler is \ncompletely dried \nfollowing workplace \nprocedures. \n2.7  Corrective \nmeasures are \napplied based on \nrepair manuals. \n2.8  Block sanding is \nperformed \naccording to \nindustry standard. \n2.9  Repairs are \ncompleted to pre-\npainting condition. \n2.1  Preparation of \ndamaged panels \n2.2  Pre-filler \napplication \nstandard \n2.3  Mixture of body \nfiller \n2.4  Thermoplastic \nwelding and \nfusion technique \n2.5  Use of adhesive \nand adhesive \nfusion promoter \n2.6  Types of plastic \nmaterial \n2.7  Repair quality \nrequirements \n2.8  Types of plastic \nadhesive \n2.9  Techniques in \nrectifying minor \ndent \n2.10 Arithmetic \noperations \n2.11 Formulation of \nfiller \n2.12 Weight of \nrequired filler \n2.13 Application \ntechnique for filler \n2.14 Industry criteria \n2.15 Repair \ncompletion \n2.16 OSHS \n2.17 Wearing of PPEs \n2.18 Attitude \n2.18.1 Patient \n2.18.2 Attention \nto details \n2.18.3 Time \nconscious \n2.18.4 Honest \n2.18.5 Resource-\nful \n2.1  Using basic \nmathematical \noperations, \nincluding \naddition, \nsubtraction, \nmultiplication \nand division, to \ncalculate ratios \nfor dilution \nrates.to: \ncalculate body \nfiller quantities \nand mix required \nratios \n2.2  Calculating \nsurface Area \n2.3  Using specialist \nbody repair tools \nand weighing \nscale for filler \n2.4  Mixing body filler \n2.5  Applying body \nfiller \n2.6  Rectifying minor \ndent \n2.7  Performing block \nsanding \n2.8  Conducting \ninspection and \nmonitoring \n2.9  Applying \ncorrective \nmeasures \n2.10 Completing \nrepairs \n3.  Complete work \nprocesses \n3.1  Final inspection is \nmade to ensure the \n3.1  Procedures for \nfinal inspection of \n3.1  Filling out \nworkplace \ndocumentation\n\n--- PDF PAGE 104 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               100 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nsurface is ready for \nnext process. \n3.2  Vehicle and \ncomponents are \nturned-over to \nimmediate superior \nfor quality control \nfollowing workplace \nprocedure. \n3.3  Work area is \nrestored following \n5S of good \nhousekeeping. \n3.4  Wastes are \nmanaged following \nand regulations. \n3.5  Tools and \nequipment are \nchecked and stored \naccording to \nworkplace \nprocedures. \n3.6  Faulty tools and \nequipment are \nreported according \nto workplace \nprocedures. \n3.7  Workplace \ndocuments are \naccomplished \naccording to \nworkplace \nprocedures. \nprepared \nsubstrates \n3.2  Turn-over of \nvehicle \n3.3  Inspection and \nstorage of tools, \nmaterials and \nequipment \n3.4  Faulty and \ndefective tools \nand equipment \n3.5  Accomplishment \nof repair order \nand other forms \n3.6  Job done \n3.7  Restoration of \nwork area \n3.8  OSHS \n3.9  Wearing of PPEs \n3.10 3Rs \n3.11 5S of Good \nHousekeeping \n3.12 Waste \nmanagement \n3.13 Checking and \nstorage of tools \nand equipment \n3.14 Workplace \ndocuments \n3.15 Attitude \n3.15.1 Patience \n3.15.2 Attention \nto details \n3.15.3 Time \nconscious \n3.15.4 Honest \n3.2  Reporting issues \nor outcomes \n3.3  Conducting final \ninspection \n3.4  Performing \nvehicle turn-over \n3.5  Restoring work \narea \n3.6  Managing \nwastes \n3.7  Checking and \nstoring tools and \nequipment \n3.8  Reporting faulty \ntools and \nequipment \n3.9  Wearing of PPEs \n3.10 Applying safety \npractices\n\n--- PDF PAGE 105 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               101 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Job requirements \nJob requirements may include: \n1.1   Completing repairs to pre-paint condition \n1.2   Applying body filler \n1.3   Minor dent repair \n2.  Materials, tools, and \nequipment \nMaterials, tools, and equipment may include: \n2.1   Materials \n2.1.1   Adhesive \n2.1.2   Adhesion promoter \n2.1.3   Sand paper \n2.1.4   Sanding block \n2.1.5   Putty \n2.1.6   Hardener \n2.1.7   Cleaning rag \n2.1.8   Degreaser \n2.1.9   Thinner \n \n2.2   Tools \n2.2.1   Spatula \n2.2.2   Mixing board \n \n2.3   Equipment \n2.3.1   Weighing scale \n2.3.2   Vacuum cleaner \n2.3.4   Working table \n3.  Personal protective \nequipment (PPEs) \nPersonal protective equipment (PPEs) may include: \n3.1   Masks \n3.2   Coverall \n3.3   Apron \n4.  Panels \nPanels may include: \n4.1   Simple panels  \n4.2   Complex panels \n4.3   Thermoplastic panels \n5.  Preparation of damaged \npanels \nPreparation of damaged panels includes: \n5.1   Sanding \n5.2   Sanding block \n5.3   Positioning of body panel \n6.  Industry criteria \nIndustry criteria may include: \n6.1   Manufacturer specifications \n6.2   Repair manual \n6.3   Workplace procedures \n6.4   Safety and environmental requirements \n7.  Workplace documents \nWorkplace documents may include: \n7.1   Repair order \n7.2   Checklist sheet \n7.3   Inspection form\n\n--- PDF PAGE 106 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               102 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Prepared to repair body panels using filler. \n1.1.1   Determined job requirements. \n1.1.2   Sourced and interpreted manufacturer \nspecifications for body filler application and relevant \nsafety data sheets (SDS). \n1.1.3   Selected and checked materials, tools and \nequipment. \n1.1.4   Identified hazards associated with the work and \nmanaged risks. \n1.1.5   Prepared work area and planned work. \n1.1.6   Selected and worn personal protective equipment \n(PPEs). \n \n1.2   Carried out repair activities using filler. \n1.2.1   Prepared damaged panels. \n1.2.2   Rectified minor dent. \n1.2.3   Mixed body filler. \n1.2.4   Applied filler. \n1.2.5   Applied adhesives, including adhesion promoter/ \nprimer surfacer. \n1.2.6   Performed inspection. \n1.2.7   Applied corrective measures. \n1.2.8   Performed block sanding. \n1.2.9   Completed repairs to pre-painting condition. \n \n1.3   Completed work processes. \n1.3.1   Made final inspection. \n1.3.2   Turned-over vehicle and components. \n1.3.3   Restored work area. \n1.3.4   Managed wastes. \n1.3.5   Checked and stored tools and equipment. \n1.3.6   Reported faulty tools and equipment. \n1.3.7   Accomplished workplace documents. \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Automotive repair workplace or simulated workplace \n2.2   Workplace instructions \n2.3   PPE required for pre-repairs \n2.4   Three different vehicles with body components requiring \nremoval and storage \n2.5   Vehicle protection covers tools, equipment and material \nappropriate for removing and storing vehicle body \ncomponents \n2.6   SDS \n2.7   Repair manual \n2.8   TDS \n2.9   Manufacturer’s specification \n2.10 Training vehicle and body panel\n\n--- PDF PAGE 107 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               103 \n2.11 First-aid kit \n2.12 Working table \n3.  Method of \nassessment \nCompetency should be assessed through:  \n3.1   Demonstration with Oral questioning \n3.2   Written exam \n3.3   Direct Observation \n4.  Context for \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
