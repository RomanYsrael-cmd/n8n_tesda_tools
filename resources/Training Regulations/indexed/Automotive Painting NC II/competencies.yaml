(10/13/2020)               82 \nVARIABLE \nRANGE \n5.2   Trunk lid \n5.3   Door \n5.4   Roof \n5.5   Fender \n5.6   Quarter panel \n6.  Workplace documents \nWorkplace documents may include: \n6.1   Repair order \n6.2   Checklist sheet\n\n--- PDF PAGE 87 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               83 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Prepared for refinishing work. \n1.1   Determined job requirements. \n1.2   Accessed and interpreted preparation information. \n1.3   Selected and inspected refinishing materials, tools \nand equipment. \n1.4   Identified hazards associated with the work and \nmanaged risks. \n1.5   Selected and checked personal protective equipment \n(PPE). \n1.6   Planned work. \n \n1.2   Removed surface rust and apply primers. \n1.2.1   Removed surface rust and scale. \n1.2.2   Protected and removed panel substrate \ncomponents affected by application processes. \n1.2.3   Cleaned up surfaces to be painted and removed \ncontaminants. \n1.2.4   Conducted application of primer. \n1.2.5   Applied safety practices. \n \n1.3   Prepared primered and sealed surface for refinishing. \n1.3.1   Prepared surfaces to be refinished. \n1.3.2   Recorded and reported surface defects. \n1.3.3   Applied sealer. \n1.3.4   Performed inspection and monitoring. \n1.3.5   Applied safety practices. \n \n1.4   Completed work processes. \n1.4.1   Made final inspection and presented prepared \nsurface. \n1.4.2   Turned-over vehicle panels and documents. \n1.4.3   Restored work area. \n1.4.4   Managed wastes. \n1.4.5   Checked tools and equipment. \n1.4.6   Reported faulty tools and equipment. \n1.4.7   Checked and reported availability of materials. \n1.4.8   Accomplished workplace documents. \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Automotive repair workplace or simulated workplace \n2.2   Workplace instructions \n2.3   PPE required for pre-repairs \n2.4   Vehicle body panels \n2.5   Vehicle protection covers tools, equipment and material \n2.6   Repair manual \n2.7   Manufacturer’s specification \n2.8   SDS \n2.9   TDS\n\n--- PDF PAGE 88 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               84 \n2.10 First – Aid Kit \n2.11 Fire Extinguisher \n2.12 Working table \n3.  Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration with Oral questioning \n3.2   Written exam \n3.3   Direct Observation \n4.  Context for \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
