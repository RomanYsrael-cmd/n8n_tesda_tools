        "source_text": "--- PDF PAGE 7 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               3 \nSECTION 2 COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core \nunits of competency required in AUTOMOTIVE PAINTING NC II. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY \n: \nPARTICIPATE IN WORKPLACE \nCOMMUNICATION \n \n \n \nUNIT CODE \n: \n400311210 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes  \nrequired to gather, interpret and convey information \nin response to workplace requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Obtain and convey \nworkplace \ninformation \n1.1  Specific and \nrelevant information \nis accessed from \nappropriate \nsources. \n1.2  Effective \nquestioning,  active \nlistening and \nspeaking skills are \nused to gather and \nconvey information. \n1.3  Appropriate \nmedium is used to \ntransfer information \nand ideas. \n1.4  Appropriate non- \nverbal \ncommunication is \nused. \n1.5  Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are \nidentified and \nfollowed. \n1.6  Defined workplace \nprocedures for the \nlocation and \nstorage of \ninformation are \nused. \n1.1  Effective verbal \nand nonverbal \ncommunication \n1.2  Different modes \nof communication  \n1.3  Medium of \ncommunication in \nthe workplace \n1.4  Organizational \npolicies \n1.5  Communication \nprocedures and \nsystems \n1.6  Lines of \nCommunication \n1.7  Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities  \n1.8  Workplace \netiquette \n1.1  Following simple \nspoken language \n1.2  Performing \nroutine \nworkplace duties \nfollowing simple \nwritten notices \n1.3  Participating in \nworkplace \nmeetings and \ndiscussions \n1.4  Preparing work- \nrelated \ndocuments \n1.5  Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n1.6  Relating/ \nInteracting with \npeople of various \nlevels in the \nworkplace \n1.7  Gathering and \nproviding basic \ninformation in \nresponse to \nworkplace \nrequirements\n\n--- PDF PAGE 8 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               4 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.7  Personal interaction \nis carried out clearly \nand concisely. \n1.8  Basic business \nwriting skills \n1.9  Interpersonal \nskills in the \nworkplace \n1.10 Active-listening \nskills \n2.  Perform duties \nfollowing \nworkplace \ninstructions \n2.1  Written notices and \ninstructions are \nread and \ninterpreted in \naccordance with \norganizational \nguidelines. \n2.2  Routine written \ninstruction are \nfollowed based on \nestablished \nprocedures. \n2.3  Feedback is given \nto workplace \nsupervisor based \ninstructions/ \ninformation \nreceived. \n2.4  Workplace \ninteractions are \nconducted in a \ncourteous manner. \n2.5  Where necessary, \nclarifications about \nroutine workplace \nprocedures and \nmatters concerning \nconditions of \nemployment are \nsought and asked \nfrom appropriate \nsources. \n2.6  Meetings outcomes \nare interpreted and \nimplemented. \n2.1  Effective verbal \nand non-verbal \ncommunication \n2.2  Different modes \nof communication  \n2.3  Medium of \ncommunication in \nthe workplace \n2.4  Organizational/ \nWorkplace \npolicies \n2.5  Communication \nprocedures and \nsystems \n2.6  Lines of \ncommunication \n2.7  Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \n2.8  Effective \nquestioning \ntechniques \n(clarifying and \nprobing) \n2.9  Workplace \netiquette \n2.1  Following simple \nspoken \ninstructions \n2.2  Performing \nroutine