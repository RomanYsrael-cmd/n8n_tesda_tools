        "source_text": "--- PDF PAGE 73 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               69 \n \nCORE COMPETENCY \n \nUNIT OF COMPETENCY \n: \nREMOVE PAINT FROM VEHICLE SURFACES \n \n \n \nUNIT CODE \n: \nALT713301 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit describes the performance outcomes required to \nremove paint from vehicle painted surfaces using a variety \nof industry - approved methods and without causing \ndamage to vehicle and components. It involves preparing \nfor the task, selecting and using specialist tools, \nequipment and chemicals to remove paint from metal and \nplastic component surfaces in preparation for repairs or \nrefinishing, and completing workplace activities and \ndocuments. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Prepare to remove \npaint from vehicle \nsurface \n1.1  Job requirements \nare determined \nfrom workplace \ninstructions. \n1.2  Vehicle and \ncomponents are \ninspected to identify \ntype of paint used \nbased on industry \nestablished \nmethod. \n1.3  Paint removal \ninformation is \nlocated and \ninterpreted. \n1.4  Paint removal \nmaterials, tools \nand equipment are \nselected and \nchecked for quality \nand serviceability. \n1.5  Personal \nprotective \nequipment (PPEs) \nare selected and \nchecked for \nserviceability. \n1.6  Hazards associated \nwith the work are \nidentified and risks \nare managed. \n1.1  Job requirements \n1.2  Paint removal \ninformation \n1.3  Types and uses \nof tools, \nequipment, and \nmaterials in \nremoving paint \n1.4  Types of damage \nto vehicle relating \nto removal of \npaint \n1.5  Industry \nestablished \nmethod on \nidentifying \n1.6  Paint \nmanufacturer and \nworkplace paint \nremoval methods \nincluding: \n1.6.1 Chemical \nsubstance \n1.6.2 Machine \nsanding \n1.6.3 Sand \nblasting \n1.6.4 Hand \nsanding \n1.7  Effects of paint \nremoval methods \n1.1  Locating \nspecifications \nand relevant \ninformation \n1.2  Clarifying \ninstructions and \nprocedures \n1.3  Determining job \nrequirements \n1.4  Locating and \ninterpreting paint \nremoval \ninformation \n1.5  Selecting and \nchecking tools, \nequipment, and \nmaterials \n1.6  Identifying paint \nremoval methods \n1.7  Identifying \nhazards \n1.8  Managing risks \n1.9  Applying safety \npractices and \nusing PPEs \n1.10 Planning work  \n1.11 Practicing waste \nmanagement \n1.12 Preparing work \narea\n\n--- PDF PAGE 74 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               70 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.7  Work is planned to \nminimize waste and \ndamage to vehicle. \nto different \ncomponents of \nvehicle \n1.8  Work hazards \n1.9  Risk management \n1.10 Volume of \nrequired paint \nremover  \n1.11 Calculation of \nrequired materials \n1.12 Work planning \n1.13 OSHS \n1.14 Wearing of PPEs \n1.15 Waste \nmanagement \n1.16 Attitude: \n1.16.1 Patient \n1.16.2 Attention \nto details \n1.16.3 Time \nconscious \n1.16.4 Honest \n1.16.5 Resource-\nful \n1.13 Identifying \nhazards that may \naffect worker, \nvehicle and \nenvironment \n1.14 Skills on time \nmanagement \n2.  Remove paint \n2.1  Vehicle metal \nplastic \ncomponents and \naccessories \nrequiring paint \nremoval are \nidentified and \nprepared according \nto repair manual. \n2.2  Paint removal \nmethods are \nselected based on \njob requirement. \n2.3  Tools, materials \nand equipment are \nused following \nmanufacturer’s \nmanual. \n2.4  Paint removal \nactivities are \ncompleted based \non industry \ncriteria. \n2.5  Safety practices are \napplied following \nOSHS. \n2.1  Different vehicle \nmetal, plastic \ncomponents and \naccessories  \n2.2  Paint removal \nmethods \n2.3  Vehicle protection \nmethods and \ntechniques  \n2.4  Industry criteria \n2.5  Use of tools, \nmaterials and \nequipment for \npaint removal \n2.6  Adjustment of \nspeed of sanding \nmachine \n2.7  Ratio and \nProportion  \n2.8  Mensuration \n2.9  Scraping \ntechniques \n2.10 Completion \nactivities of paint \nremoval \n2.1  Using paint \nremoval, \nmaterials, tools \nand equipment \n2.2  Adjusting speed \nof sanding \nmachine \n2.3  Mensuration \nskills \n2.4  Ratio and \nproportion  \n2.5  Identifying and \npreparing vehicle \nmetal, plastic \ncomponents and \naccessories  \n2.6  Applying \nscraping \ntechnique \n2.7  Removing \nvehicle paint \n2.8  Completing paint \nremoval activities \n2.9  Applying safety \npractices \n2.10 Managing risk\n\n--- PDF PAGE 75 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               71 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.11 Hazards \nassociated with \nthe operation \n2.12 Risk \nManagement \n2.13 OSHS \n2.14 Wearing of PPEs \n2.15 Waste \nManagement \n2.16 Attitude: \n2.16.1 Patient \n2.16.2 Attention \nto details \n2.16.3 Time \nconscious \n2.16.4 Honest \n2.16.5 Resource-\nful \n2.11 Identifying \nhazards \n3.  Complete work \nprocesses \n3.1  Final inspection is \nmade following \nworkplace \nprocedure to \nensure work meets \nworkplace \nexpectations. \n3.2  Workplace \ndocuments are \naccomplished \naccording to \nworkplace \nprocedures. \n3.3  Vehicle documents \nare turned-over to \nimmediate superior \nfor quality control \nfollowing workplace \nprocedure. \n3.4  Work area is \nrestored following \n5S of good \nhousekeeping. \n3.5  Wastes are \nmanaged following \nenvironmental rules \nand regulations. \n3.6  Tools and \nequipment are \nchecked and stored \naccording to \n3.1  Procedures for \nfinal inspection of \nbody filler repair \n3.2  Turn-over of \nvehicle \n3.3  Accomplishment \nof repair order \nand other forms \n3.3.1 Job done \n3.3  Faulty tools and \nequipment \n3.4  Inspection and \nstorage tools, \nmaterials and \nequipment \n3.5  Inventory of tools, \nmaterials and \nequipment \n3.6  OSHS \n3.7  Wearing of PPEs \n3.8  3Rs \n3.9  5S of Good \nHousekeeping  \n3.10 Waste \nmanagement \n3.11 Workplace \ndocuments \n3.12 Attitude: \n3.12.1 Patient \n3.12.2 Attention \nto details \n3.1  Filling out \nworkplace \ndocumentation \n3.2  Conducting final \ninspection to \nvehicle panel \nsurfaces \n3.3  Performing \nvehicle and \ndocuments turn-\nover \n3.4  Restoring work \narea \n3.5  Managing \nwastes \n3.6  Reporting faulty \ntools and \nequipment \n3.7  Checking and \nstoring tools, \nmaterials and \nequipment \n3.8  Mathematical \nskills \n3.9  Wearing of PPEs \n3.10 Applying safety \npractices \n3.11 Accomplishing \nworkplace \ndocumentation\n\n--- PDF PAGE 76 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               72 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nworkplace \nprocedure. \n3.7  Faulty tools and \nequipment are \nreported according \nto workplace \nprocedures. \n3.8  Availability of \nmaterials are \nchecked and \nreported following \nworkplace \nprocedures. \n3.12.3 Time \nconscious \n3.12.4 Honest \n3.12.5 Resource-\nful\n\n--- PDF PAGE 77 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               73 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Job requirements \nJob requirement may include: \n1.1   Scrape to metal \n1.2   Sanding  \n1.3   Applying paint remover \n2.  Paint removal information \nPaint removal information may include:  \n2.1   Paint manufacturer specifications \n2.2   Workplace paint removal procedures \n2.3   Safety data sheets (SDS) \n3.  Materials, tools and \nequipment \nMaterials, tools and equipment may include:  \n \n3.1   Materials \n3.1.1   Paint thinner \n3.1.2   Abrasive papers \n3.1.3   Vehicle protection covers \n3.1.4   Masking tape \n3.1.5   Masking paper \n3.1.6   Paint remover \n3.1.7   Paint strip solution \n3.1.8   Sanding block \n3.1.9   Cap brush \n \n3.2   Tools \n3.2.1   Scraper \n3.2.2   Portable sander \n3.2.3   Steel Brush \n \n3.3   Equipment: \n3.3.1   Sanding machine \n3.3.2   Working table \n4.  Personal protective \nequipment (PPEs) \nPersonal protective equipment (PPEs) may include: \n4.1   Goggles \n4.2   Mask \n4.3   Solvent resistant gloves \n4.4   Spray suit \n4.5   Safety shoes \n5.  Metal, plastic components \nand accessories \nMetal, plastic components and accessories may include: \n5.1   Front fender \n5.2   Engine hood \n5.3   Trunk lid \n5.4   Door panel \n5.5   Front bumper \n5.6   Rear bumper \n5.7   Side mirror \n5.8   Door handle cover \n5.9   Roof \n5.10 Side skirt \n5.11 Spoiler\n\n--- PDF PAGE 78 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               74 \nVARIABLE \nRANGE \nGarnish \n6.  Paint removal methods \nPaint removal methods may include: \n6.1   Chemical substance application and manual \nscraping \n6.2   Machine and hand sanding \n7.  Industry criteria \nIndustry criteria may include: \n7.1   Manufacturer specifications \n7.2   Repair manual \n7.3   Workplace procedures \n7.4   Safety and environmental requirements \n8.  Workplace documents \nWorkplace documents may include: \n8.1   Repair order \n8.2   Inspection form \n8.3   Diagnostic sheet\n\n--- PDF PAGE 79 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               75 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Prepared to remove paint from vehicle surface. \n1.1.1   Determined job requirements. \n1.1.2   Inspected vehicle and components. \n1.1.3   Located and interpreted paint removal information. \n1.1.4   Selected and checked paint removal materials, \ntools and equipment. \n1.1.5   Selected and checked personal protective \nequipment (PPEs). \n1.1.6   Identified hazards associated with the work and \nmanaged risks. \n1.1.7   Planned work. \n \n1.2   Removed paint. \n1.2.1   Identified and prepared vehicle metal plastic \ncomponents and accessories requiring paint \nremoval. \n1.2.2   Selected paint removal methods. \n1.2.3   Used tools, materials and equipment. \n1.2.4   Completed paint removal activities. \n1.2.5   Applied safety practices. \n \n1.3   Completed work processes. \n1.3.1   Made final inspection. \n1.3.2   Accomplished workplace documents. \n1.3.3   Turned-over vehicle documents. \n1.3.4   Restored work area. \n1.3.5   Managed wastes. \n1.3.6   Checked and stored tools and equipment. \n1.3.7   Reported faulty tools and equipment. \n1.3.8   Checked and reported availability of materials. \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Automotive body and paint workplace or simulated \nworkplace \n2.2   Workplace instructions \n2.3   PPEs required for pre-repairs \n2.4   Training vehicle or body components \n2.5   Vehicle protection covers, tools, equipment and material \nappropriate for removing paint from body components. \n2.6   Storage area of disassembled parts \n2.7   Repair manuals \n2.8   Safety Data Sheets \n2.9   Manufacturer’s specifications \n2.10 First-aid Kit \n2.11 Fire Extinguisher \n2.12 Working table \n3.  Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration with Oral questioning\n\n--- PDF PAGE 80 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               76 \n3.2   Written exam \n3.3   Direct Observation \n4.  Context for \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
