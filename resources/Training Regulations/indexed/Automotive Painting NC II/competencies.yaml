azards associated with the work and \nmanaged risks. \n1.1.4   Identified and checked masking tools and \nequipment and personal protective equipment \n(PPEs). \n1.1.5   Planned work. \n \n1.2   Carried out masking activities. \n1.2.1   Identified and cleaned vehicle surfaces and \ncomponents that require masking. \n1.2.2   Carried out masking. \n1.2.3   Applied safety measures. \n \n1.3   Completed work processes. \n1.3.1   Made final inspection. \n1.3.2   Cleaned work area, disposed waste and non-\nrecyclable materials and collected recyclable \nmaterial. \n1.3.3   Checked and stored tools and equipment. \n1.3.4   Processed workplace documentation. \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Automotive repair workplace or simulated workplace \n2.2   Workplace instructions \n2.3   PPE required for pre-repairs \n2.4   Three different vehicles with body components requiring \nremoval and storage \n2.5   Vehicle protection covers tools, equipment and material \nappropriate for removing and storing vehicle body \ncomponents \n2.6   Repair manual \n2.7   Vehicle body panel \n2.8   First – aid kit \n2.9   Working table \n3.  Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration with Oral questioning \n3.2   Written exam \n3.3   Direct Observation \n4.  Context for \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
