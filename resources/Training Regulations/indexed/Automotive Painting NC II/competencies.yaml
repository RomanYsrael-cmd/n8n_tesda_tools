nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.2  Analysis \ntechniques are \napplied to assess \ndata/ information. \n2.3  Trends and \nanomalies are \nidentified. \n \n2.4  Data analysis \ntechniques and \nprocedures are \ndocumented. \n2.5  \nRecommendation\ns are made on \nareas of possible \nimprovement. \n2.2  Data analysis \ntechniques/ \nprocedures \n2.3  Reporting \nrequirements to \na range of \naudiences \n \n2.4  Legislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n2.5  Organisational \nvalues, ethics \nand codes of \nconduct \n2.2  Describing \ndata analysis \ntechniques/ \nprocedures \n2.3  Reporting \nrequirements to \na range of \naudiences \n2.4  Stating \nlegislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n2.5  Stating \norganisational \nvalues, ethics \nand codes of \nconduct \n3.  Record and \npresent \ninformation \n3.1  Studied data/ \ninformation are \nrecorded. \n3.2  \nRecommendation\ns are analysed for \naction to ensure \nthey are \ncompatible with \nthe project’s \nscope and terms \nof reference. \n3.3  Interim and final \nreports are \nanalysed and \noutcomes are \ncompared to the \ncriteria \nestablished at the \noutset. \n3.4  Findings are \npresented to \nstakeholders. \n3.1  Data analysis \ntechniques/ \nprocedures \n3.2  Reporting \nrequirements to \na range of \naudiences \n3.3  Legislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n3.4  Organisational \nvalues, ethics \nand codes of \nconduct \n3.1  Describing \ndata analysis \ntechniques/ \nprocedures \n3.2  Reporting \nrequirements to \na range of \naudiences \n3.3  Stating \nlegislation, \npolicy and \nprocedures \nrelating to the \nconduct of \nevaluations \n3.4  Stating \norganisational \nvalues, ethics \nand codes of \nconduct \npractices\n\n--- PDF PAGE 29 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               25 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Data analysis techniques \nMay include: \n1.1   Domain analysis \n1.2   Content analysis \n1.3   Comparison technique \n \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Determine data / information \n1.2   Studied and applied gathered data/information \n1.3   Recorded and studied data/information \n \nThese aspects may be best assessed using a range of \nscenarios what ifs as a stimulus with a walk through forming \npart of the response. These assessment activities should \ninclude a range of problems, including new, unusual and \nimprobable situations that may have happened. \n2.  Resource \nImplications \nSpecific resources for assessment \n2.1   Evidence of competent performance should be obtained \nby observing an individual in an information management \nrole within the workplace or operational or simulated \nenvironment. \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Written Test \n3.2   Interview \n3.3   Portfolio \n \nThe unit will be assessed in a holistic manner as is practical and \nmay be integrated with the assessment of other relevant units of \ncompetency. Assessment will occur over a range of situations, \nwhich will include disruptions to normal, smooth operation. \nSimulation may be required to allow for timely assessment of \nparts of this unit of competency. Simulation should be based on \nthe actual workplace and will include walk through of the \nrelevant competency components. \n4.  Context for \nAssessment \n4.1   In all workplace, it may be appropriate to assess this unit \nconcurrently with relevant teamwork or operation units.\n",
