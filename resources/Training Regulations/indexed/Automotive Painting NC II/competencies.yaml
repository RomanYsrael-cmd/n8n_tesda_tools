.4  Sanding  \n3.5  Performing \nfeather edging  \n3.6  Performing \ninspection and \nmonitoring  \n3.7  Addressing \nsurface defects  \n3.8  Applying safety \npractices \n4.  Complete work \nprocesses \n4.1  Final inspection is \nmade and prepared \nsurface is \npresented for next \nprocess based on \nindustry criteria. \n4.2  Vehicle panels and \ndocuments are \nturned-over to \nimmediate superior \nfor quality control \nfollowing workplace \nprocedure. \n4.3  Work area is \nrestored following \n5S of good \nhousekeeping. \n4.1  Procedures for \nfinal inspection of \nprepared \nsubstrates \n4.2  Turn-over of \nvehicle, \ncomponents and \ndocuments \n4.3  Inspection and \nstorage of tools, \nmaterials and \nequipment \n4.4  Faulty and \ndefective tools \nand equipment \n4.5  Accomplishment \nof workplace \ndocuments  \n4.1  Accomplishing \nworkplace \ndocuments \n4.2  Reporting issues \nor outcomes \n4.3  Conducting final \ninspection \n4.4  Performing \nvehicle turn-over \n4.5  Restoring work \narea \n4.6  Managing \nwastes \n4.7  Checking and \nstoring tools and \nequipment\n\n--- PDF PAGE 84 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               80 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.4  Wastes are \nmanaged following \nand regulations. \n4.5  Tools and \nequipment are \nchecked and stored \naccording to \nworkplace \nprocedures. \n4.6  Faulty tools and \nequipment are \nreported according \nto workplace \nprocedures. \n4.7  Availability of \nmaterials are \nchecked and \nreported according \nto workplace \nprocedures. \n4.8  Workplace \ndocuments are \naccomplished \naccording to \nworkplace \nprocedures. \n4.5.1 Job done \n4.6  OSHS \n4.7  Wearing of PPEs \n4.8  3Rs \n4.9  5S of Good \nHousekeeping  \n4.10 Waste \nmanagement \n4.11 Checking and \nstorage of tools \nand equipment \n4.12 Workplace