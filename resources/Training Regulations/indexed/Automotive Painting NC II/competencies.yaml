ing \nremoval and storage \n2.5   Vehicle protection covers tools, equipment and material \nappropriate for removing and storing vehicle body \ncomponents \n2.6   Training vehicle and body panel \n2.7   First-aid kit \n2.8   Working table \n3.  Method of \nassessment \nCompetency should be assessed through:  \n3.1   Demonstration with Oral questioning \n3.2   Written exam \n3.3   Direct Observation\n\n--- PDF PAGE 101 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               97 \n4.  Context for \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
