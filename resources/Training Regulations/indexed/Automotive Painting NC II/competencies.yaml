        "source_title": "PREPARE PANEL FOR REFINISHING",
        "source_text": "--- PDF PAGE 81 ---\nTR-Automotive Painting NC II Revision 01               Promulgated                (10/13/2020)               77 \n \nUNIT OF COMPETENCY \n: \nPREPARE PANEL FOR REFINISHING \n \n \n \nUNIT CODE \n: \nALT713302 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit describes the performance outcomes required to \nprepare panels for refinishing by removing surface rust \nand scale, and applying primers and fillers before the final \nrefinishing. It involves preparing for the task, selecting and \nusing specialist tools and equipment, selecting and using \nmaterials, \ncleaning \npanel \nsurfaces \naccording \nto \nmanufacturer specifications, and completing workplace \nprocesses and documentation. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Prepare for \nrefinishing work \n1.1  Job requirements \nare determined \nfrom workplace \ninstructions. \n1.2  Preparation \ninformation is \naccessed and \ninterpreted \naccording industry \ncriteria. \n1.3  Refinishing \nmaterials, tools \nand equipment are \nselected and \ninspected for quality \nand serviceability. \n1.4  Hazards associated \nwith the work are \nidentified and risks \nare managed. \n1.5  Personal protective \nequipment (PPEs) \nare selected and \nchecked for \nserviceability. \n1.6  Work is planned to \nidentify vehicle \npanel preparation \nmethods, minimize \nwaste, and prevent \ndamage to vehicle. \n1.1  Job requirements \n1.2  Preparation \ninformation \n1.3  Refinishing tools, \nequipment, and \nmaterials \n1.4  Chemical \nProperties \n1.5  Ratio and \nProportion \n1.6  Work hazards \n1.7  Risk management \n1.8  Work plan \n1.9  Substrate \npreparation \nmethods \n1.10 OSHS \n1.11 Wearing of PPEs \n1.12 Waste \nManagement \n1.13 3Rs \n1.14 5S of Good \nHousekeeping \n1.15 Attitude \n1.15.1 Patient \n1.15.2 Attention \nto details \n1.15.3 Time \nconscious \n1.15.4 Hones