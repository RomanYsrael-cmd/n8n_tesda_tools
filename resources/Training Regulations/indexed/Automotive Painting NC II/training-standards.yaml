le-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n1 Hour\n\n--- PDF PAGE 129 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 125\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Share experiences that show\nconfidence, and resilience in the\nface of setbacks and frustrations\nand other negative emotions and\nunpleasant situations in the\nworkplace\n\n4.2 Develop\nreflective\npractice\n• Enumerate strategies to improve\none’s attitude in the workplace\n• Explain Gibbs’ Reflective\nCycle/Model (Description,\nFeelings, Evaluation, Analysis,\nConclusion, and Action plan)\n• Use basic SWOT analysis as self-\nassessment strategy\n• Develop reflective practice through\nrealization of limitations, likes/\ndislikes; through showing of self-\nconfidence\n• Demonstrate self-acceptance and\nbeing able to accept challenges\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• 5 Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n1 Hour\n\n4.3 Boost self-\nconfidence and\ndevelop self-\nregulation\n• Describe the components of self-\nregulation based on Self-\nRegulation Theory (SRT)\n• Explain personality development\nconcepts\n• Cite self-help concepts (e. g., 7\nHabits by Stephen Covey,\ntransactional analysis, psycho-\nspiritual concepts)\n• Perform effective communication\nskills – reading, writing, conversing\nskills\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n1 Hour\n\n--- PDF PAGE 130 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 126\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAss