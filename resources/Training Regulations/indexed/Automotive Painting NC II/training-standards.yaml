ifferent Non-verbal\ncommunication\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 126 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 122\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nDemonstrate ability to relate to\npeople of social range in the\nworkplace\n•\nGather and provide information in\nresponse to workplace\nrequirements\n•\nComplete work related\ndocuments\n2. Work in a team\nenvironment\n2.1 Describe team\nrole and scope\n•\nDiscussion on team roles and\nscope\n•\nParticipate in the discussion:\no\nDefinition of Team\no\nDifference between team\nand group\no\nObjectives and goals of team\n•\nLocate needed information from\nthe different sources of\ninformation\n• Lecture/\nDiscussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 Hour\n\n2.2 Identify one’s\nrole and\nresponsibility\nwithin team\n•\nRole play:\no individual role and\nresponsibility\n•\nRole Play\no Understanding Individual\ndifferences\n•\nDiscussion on gender sensitivity\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n\n2.3 Work as a team\nmember\n• Participate in group planning\nactivities\n• Role play: Communication\nprotocols\n• Participate in the discussion of\nstandard work procedures and\npractices\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n\n--- PDF PAGE 127 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 123\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3. Solve/address\nroutine problems\n3.1 Identify routine\nproblems\n• Review of the current industry\nhardware and software products\nand services\n• Identify correctly the industry\nmaintenance, service and\nhelpdesk practices, processes and\nprocedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in\ndetermining basic malfunctions\nand resolutions to general\nproblems in the workplace\n• Analyze routine/procedural\nproblems\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n3.2 Look for\nsolutions to\nroutine\nproblems\n• Review of the current industry\nhardware and software products\nand services\n• Identify correctly the industry\nmaintenance, service and\nhelpdesk practices, processes and\nprocedures\n• Make use of the industry standard\ndiagnostic tools\n• Share best practices in\ndetermining basic malfunctions\nand resolutions to general\nproblems in the workplace\n• Formulate possible solutions to\nproblems and document\nprocedures for reporting\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n--- PDF PAGE 128 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 124\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.3 Recommend\nsolutions to\nproblems\n• Discuss standard operating\nprocedures and documentation\nprocesses\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n4. Develop Career\nand Life\nDecisions\n4.1 Manage one’s\nemotion\n• Demonstrate self-management\nstrategies that assist in regulating\nbehavior and achieving personal\nand learning goals\n• Explain enablers and barriers in\nachieving personal and career\ngoals\n• Identify techniques in handling\nnegative emotions and unpleasant\nsituation in the workplace such as\nfrustration, anger, worry, anxiety,\netc.\n• Manage properly one’s emotions\nand recognize situations that\ncannot be changed and accept\nthem and remain professional\n• Recall instances that demonstrate\nself- discipline, working\nindependently and showing\ninitiative to achieve personal and\ncareer goals\n• Discussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n1 Hour\n\n--- PDF PAGE 129 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 125\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Share experiences that show\nconfidence, and resilience in the\nface of setbacks and frustrations\nand other negative emotions and\nunpleasant situations in the\nworkplace\n\n4.2 Develop\nreflective\npractice\n• Enumerate strategies to improve\none’s attitude in the workplace\n• Explain Gibbs’ Reflective\nCycle/Model (Description,\nFeelings, Evaluation, Analysis,\nConclusion, and Action plan)\n• Use basic SWOT analysis as self-\nassessment strategy\n• Develop reflective practice through\nrealization of limitations, likes/\ndislikes; through showing of self-\nconfidence\n• Demonstrate self-acceptance and\nbeing able to accept challenges\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• 5 Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n1 Hour\n\n4.3 Boost self-\nconfidence and\ndevelop self-\nregulation\n• Describe the components of self-\nregulation based on Self-\nRegulation Theory (SRT)\n• Explain personality development\nconcepts\n• Cite self-help concepts (e. g., 7\nHabits by Stephen Covey,\ntransactional analysis, psycho-\nspiritual concepts)\n• Perform effective communication\nskills – reading, writing, conversing\nskills\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration\nor simulation