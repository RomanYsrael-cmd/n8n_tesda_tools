4 Clean polished\nsurface\n8.4.1 Discuss and explain the\nfollowing:\n• Procedure in cleaning\npolished surface\n• Washing and cleaning of\npolished surface\n• Wiping using soft fine cloth\n• Drying of surface\n• Attitude\n- Patient\n- Honest\n- Sense of Quality in Work\n- Thoroughness\n- Dedication to Work\n- Attentive to details\n8.4.2 Complete work processes\n• Lecture-discussion\n• Demonstration\n• Video presentation\n• Workshop visit\n• Demonstration\n• Written exam\n• Oral questioning\n\n--- PDF PAGE 172 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 168\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\nb. Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\ne. Assessment of competency takes the trainee’s knowledge and attitude\ninto account but requires evidence of actual performance of the\ncompetency as the primary source of evidence.\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of\ndelivery modes, both on-and off-the-job as long as the learning is\ndriven by the competency standards specified by the industry. The\nfollowing training modalities and their variations/components may be\nadopted singly or in combination with other modalities when\ndesigning and delivering training programs:\n\n2.1 School/Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\naudio, video, computer technologies or other modern technology that\ncan be used to facilitate learning and formal and non-formal training.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills\nof the trainee through actual experience in the workplace to acquire\nspecific competencies as prescribed in the training regulations. It is\nimperative that the deployment of trainees in the workplace is\nadhered to training programs agreed by the institution and enterprise\n\n--- PDF PAGE 173 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 169\nand status and progress of trainees are closely monitored by the\ntraining institutions to prevent opportunity for work exploitation.\n\n• The classroom-based or in-center instruction uses of learner-\ncentered methods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time, usually\nbetween one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by\nworking alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within\nthe company in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3 Community-Based – short term program conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings such\nas barangay hall, basketball courts, etc. These programs can also be\nmobile training program (MTP).\n\n--- PDF PAGE 174 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 170\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who would like to enroll in this program must possess the\nfollowing requirements:\n\n• *Must be holder of Automotive Servicing NC I\n• Basic communication skills\n• Basic mathematical skills\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the\ntrainees by the school or training center delivering the TVET program.\n\nNote:*National Certification in Automotive Servicing NC I can be obtained through\ndirect assessment applying the principle of recognition of prior learning (RPL).\n\n3.4\nLIST OF TOOLS, EQUIPMENT, AND MATERIALS\n\nAUTOMOTIVE PAINTING NC II\n\nRecommended list of tools, equipment and materials for the training of 20\ntrainees for Automotive Painting NC II.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used\nas alternatives. This also applies in consideration of community practices and their\navailability in the local market.\n\nA.\nFULL QUALIFICATION\n\nTOOLS\nQTY\nDESCRIPTION\n2 sets\nStandard technician hand tools (mechanical)\n2 pcs\nSingle-action sander\n2 pcs\nDouble-action sander\n20 pcs\nHand Sanding block\n20 pcs\nSpatula, plastic, 2”\n20 pcs\nSpatula, plastic, 3”\n20 pcs\nMixing plate, A4 size\n20 pcs\nPaint brush, 1”\n4 pcs\nCleaning cup, 600ml\n4 pcs\nCleaning tray, 12” x 20” x 3”\n4 pcs\nAir duster gun\n20 pcs\nMixing stick\n4 pcs\nMixing ratio stick\n4 pcs\nSteel ruler, 12”\n4 pcs\nCalculator, non-scientific\n4 sets\nMeasuring cups (small, medium, and large)\n\n--- PDF PAGE 175 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 171\n\nEQUIPMENT\nQTY\nDESCRIPTION\n1 unit\nAir compressor, 2 hp\n2 pcs\nAir pressure gauge\n2 units\nSpray gun\n2 units\nFilter regulator\n2 pcs\nAir hose reel\n2 units\nDust collector (for orbital sander)\n1 unit\nSander, single action\n1 unit\nSander, dual action\n1 unit\nSpray booth, standard size\n2 units\nMasking paper dispenser\n1 unit\nInfrared lamp\n2 units\nWeighing scale, 1,000g capacity\n2 units\nBuffing Machine\n\nMATERIALS\nQTY\nDESCRIPTION\n1 box\nSand paper #80\n1 box\nSand paper#120\n1 box\nSand paper #180\n1 box\nSand paper #240\n1 box\nSand paper #320\n1 box\nSand paper #400\n1 box\nSand paper #600\n1 box\nSand paper #1500\n1 box\nSand paper #2000\n1 unit\nBody shell\n50 pcs\nPaint strainer stand\n4 gal\nPutty\n4 L\nEtching primer\n4 L\nPrimer with hardener for metals\n8 L\nPrimer surfacer\n10 L\nPrimer surfacer reducer\n2 L\nPrimer surfacer hardener\n1 can\nDegreaser, 20L/can\n8 gal\nWashing thinner\n24 roll\nMasking tape 1\"\n2 rolls\nMasking paper\n20 pcs\nTraining panel\n10kg\nWhite rags\n20 pc\nPaint strainer\n20 pc\nFilter (cartridge)\n5 pc\nPaint brush 1\"\n2 boxes\nPaper towel\n6 L\nUrethane Solid color Paint (2K) with Hardener/Catalyst\n6 L\nUrethane Thinner\n\n--- PDF PAGE 176 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/202