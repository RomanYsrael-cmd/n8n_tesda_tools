    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for AUTOMOTIVE PAINTING NC II.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title:\nAUTOMOTIVE PAINTING\nNC Level\nNC II\n\nNominal Training Duration:\n\n37 Hours (Basic Competencies)\n\n162 Hours (Common Competencies)\n\n425 Hours (Core Competencies)\n\n624\n\n475 SIL\n\n1,099 TOTAL HOURS\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive painting in accordance with industry standards. It\ncovers specialized competencies such as removing paint from vehicle painted\nsurfaces, preparing panel for refinishing, masking vehicle panels and components,\napplying primer surfacer, repairing body panel using filler, preparing and operating\nvehicle paint drying equipment, spraying solid color paint, and polishing.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieve.\n\n--- PDF PAGE 124 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 120\n\nBASIC COMPETENCIES\n37 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNomi