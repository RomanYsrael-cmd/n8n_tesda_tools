in Automotive\nPainting NCII or *Automotive Body Painting Finishing NC III; and\n• Must have at least 48 hours of industry immersion in automotive painting\nwithin the last 2 years (industry training which includes structured training\nprogram inclusive of hands-on activities and observation in a workshop,\nand training certificates with number of hours)\n\nNote:* Automotive Body Painting/Finishing NC III is preferred but not\nmandatory.\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee is competent or not competent.\n\n--- PDF PAGE 178 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 174"
