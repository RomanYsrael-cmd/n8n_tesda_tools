  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the\nnational qualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the National Qualification of AUTOMOTIVE PAINTING NC II\nthe candidate must demonstrate competence in all units of competency\nlisted in Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.1.2 Assessment shall cover all competencies, with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.1.3 The following are qualified to apply for assessment and certification, as\nlong as they are holders of National Certificate in the amended\nAutomotive Servicing NC I:\n\n4.1.3.1 Graduates of WTR-registered program on Automotive Painting\nNC II, or graduates of NTR programs or formal/non-\nformal/informal including enterprise-based training programs\nrelated to automotive painting; or\n\n4.1.3.2 Candidates who gained competencies in implementing\nautomotive painting or any related field through informal training\nor previous work experiences for at least two (2) years within\nthe last five (5) years. A Certificate of Employment and Job\nDescription must be provided as proof.\n\n4.1.4 Current holders of National Certificate (NC) in AUTOMOTIVE BODY\nPAINTING/FINISHING NC II shall have their certificates renewed and\nconverted to the amended TR provided he/she has accumulated at least\ntwo (2) years within the last five (5) years work experience, practicing\nthe competencies prescribed in his/her certificate. A Certificate of\nEmployment and Job Description must be provided as proof. He/she\nmust be a holder of National Certificate in the amended Automotive\nServicing NC I.\n\nCurrent holders of National Certificate (NC) in AUTOMOTIVE BODY\nPAINTING/FINISHING NC II with no work experience of at least two (2)\nyears within the last five (5) years shall have to undergo reassessment\nin the amended Training Regulations upon expiration of their Certificate.\n\n--- PDF PAGE 179 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 175\nHe/she must be a holder of National Certificate in the amended\nAutomotive Servicing NC I.\n\n4.1.5 Current holders of Certificate of Competency (COC) in AUTOMOTIVE\nBODY PAINTING/FINISHING NC II, shall undergo reassessment in the\namended Training Regulations upon expiration of their Certificate/s.\nHe/she must be a holder of National Certificate in the amended\nAutomotive Servicing NC I.\n\n4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life\nexperiences may apply for recognition in a particular qualification\nthrough competency.\n\n4.1.7 The industry shall determine assessment and certification requirements\nfor each qualification with promulgated Training Regulations. It includes\nthe following:\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\nd. specific assessment and certification arrangements as by industry\n\n4.2.\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained prior\nto assessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited\nby TESDA is authorized to conduct competency assessment.\nAssessment centers undergo a quality assured procedure for\naccreditation before they are authorized by TESDA to manage the\nassessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to assess\nthe competencies of candidates for National Certification.\n\n--- PDF PAGE 180 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 176\n\nReceive and respond to\nworkplace communication\nParticipate in workplace\ncommunication\nLead workplace\ncommunication\n\nUtilize specialized\ncommunication skill\nManage and sustain effective\ncommunication strategies\nWork with others\nWork in a team environment\nLead small teams\nDevelop and lead teams\nManage and sustain high\nperforming teams\nSolve/address routine\nproblems\nSolve/address general\nworkplace problems\nApply critical thinking and\nproblem solving techniques in\nthe workplace\nPerform higher-order thinking\nprocesses and apply\ntechniques in the workplace\nEvaluate higher order thinking\nskills and adjust problem\nsolving techniques\nEnhance self-management\nskills\nDevelop career and life\ndecisions\nWork in a diverse\nenvironment\nContribute to the practice of\nsocial justice in the workplace\nAdvocate strategic thinking\nfor global citizenship\nSupport innovation