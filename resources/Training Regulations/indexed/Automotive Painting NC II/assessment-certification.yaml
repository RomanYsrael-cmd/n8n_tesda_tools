      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification of AUTOMOTIVE PAINTING NC II the candidate must demonstrate competence in all units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 Assessment shall cover all competencies, with basic and common integrated or assessed concurrently with the core units of competency. 4.1.3 The following are qualified to apply for assessment and certification, as long as they are holders of National Certificate in the amended Automotive Servicing NC I: 4.1.3.1 Graduates of WTR-registered program on Automotive Painting NC II, or graduates of NTR programs or formal/non- formal/informal including enterprise-based training programs related to automotive painting; or 4.1.3.2 Candidates who gained competencies in implementing automotive painting or any related field through informal training or previous work experiences for at least two (2) years within the last five (5) years. A Certificate of Employment and Job Description must be provided as proof. 4.1.4 Current holders of National Certificate (NC) in AUTOMOTIVE BODY PAINTING/FINISHING NC II shall have their certificates renewed and converted to the amended TR provided he/she has accumulated at least two (2) years within the last five (5) years work experience, practicing the competencies prescribed in his/her certificate. A Certificate of Employment and Job Description must be provided as proof. He/she must be a holder of National Certificate in the amended Automotive Servicing NC I. Current holders of National Certificate (NC) in AUTOMOTIVE BODY PAINTING/FINISHING NC II with no work experience of at least two (2) years within the last five (5) years shall have to undergo reassessment in the amended Training Regulations upon expiration of their Certificate. TR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 175 He/she must be a holder of National Certificate in the amended Automotive Servicing NC I. 4.1.5 Current holders of Certificate of Competency (COC) in AUTOMOTIVE BODY PAINTING/FINISHING NC II, shall undergo reassessment in the amended Training Regulations upon expiration of their Certificate/s. He/she must be a holder of National Certificate in the amended Automotive Servicing NC I. 4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through competency. 4.1.7 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations. It includes the following: a. entry requirements for candidates b. evidence gathering methods c. qualification requirements of competency assessors d. specific assessment and certification arrangements as by industry"
