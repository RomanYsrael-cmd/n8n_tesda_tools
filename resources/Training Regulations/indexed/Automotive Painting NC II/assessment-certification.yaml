tion Codes 3 up to 5\nDrive Passenger Bus\nDrive Straight Truck\nPerform Minor Maintenance and\nServicing on Vehicles Classified\nunder LTO Restriction Codes 6\nup to 8\nPerform Pre-and Post\nOperation Procedures Vehicles\nClassified under LTO\nRestriction Codes 6 up to 8\nObserve Road Health and\nSafety Practices\nDrive Articulated Vehicle\nPerform pre-delivery\ninspection\nPerform periodic maintenance\nof automotive engine\nPerform periodic maintenance\nof drive train\nPerform periodic maintenance\nof brake system\nPerform periodic maintenance\nof suspension system\nPerform periodic\nmaintenance of steering\nsystem\nService Automotive Battery\nService Ignition System\nTest and Repair Wiring/\nLighting System\nService Starting System\nService Charging System\nService Engine Mechanical\nSystem\nService Clutch System\nService Differential and Front\nAxle\nService Steering System\nService Brake System\nService Suspension System\nPerform Underchassis\nPreventive Maintenance\nOverhaul Manual\nTransmission\nTest and Repair Electrical\nSecurity System/Components\nService Electronic Engine\nManagement\nOverhaul Engines and\nAssociated Components\nService Automatic Transmission\nPerform Maintenance Service\nCheck-Up and Repair to Auto\nAC System\nRemove and Replace\nAutomotive Engine and\nEngine-Related Systems\nService and repair\nelectronically controlled\nsteering systems\nService and repair electronically\ncontrolled suspension systems\nRepair Instruments and warning\nsystems\nCarry out diagnostic\nprocedures\nService Diesel Engine\nManagement System\nService Electronic Body\nManagement System\nService Diesel Fuel Injection\nSystem Components\nService Electronic Drive\nManagement System\nService Emission Control\nSystem\nService and repair\nelectronically controlled anti-\nlock braking system\nService and repair\nelectronically operated\ntraction control System\nService and repair electronically\noperated stability control\nSystem\nPlan assessment activities and\nprocesses\nManage facility and inventory\nrequirements\nEstimate complex jobs\nEnsure a safe workplace\n\n--- PDF PAGE 184 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 180\n\nImplement continuous\nimprovement\nManage people performance\nPlan and manage compliance\nwith environmental regulations\nin a workplace or business\n\nService manual air-conditioner\nsystem\nDiagnose and repair\nmanual air-conditioner\nsystem\nRepair manual air-conditioner\ncompressor magnetic clutch\nDiagnose and repair ignition\nsystem\n\nDiagnose and repair starting\nsystem\nDiagnose and repair charging\nsystem\nDiagnose and repair body\nelectrical system\nRemove and store vehicle body\ncomponents\n\nReplace and repair vehicle body\npanels and components\nRepair vehicle body panels\nusing filler (rough finish)\nRemove paint from vehicle\npainted surfaces\nPrepare panel for\nrefinishing\nMask vehicle panels and\ncomponents\nApply primer surfacer\nRepair body panel using filler\nPrepare and operate vehicle\npaint drying equipment\n\nSpray solid color paint\nPerform polishing\n\n--- PDF PAGE 185 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 181\nGLOSSARY OF TERMS\n\n1. DEGREASING\nThe removal from the substrate of contaminants, which\nwould otherwise give rise to surface defects and\nperformance failures. e.g. poor adhesion\n\n2. DRYING\nThe process of change of a coating from the liquid to the\nsolid state by evaporation of solvent, chemical reaction of\nthe binding medium, or a combination of these processes.\nWhen drying takes place during exposure to air at normal\ntemperatures, it is called 'air-drying'; if it can be accelerated\nby the application of a moderate degree of heat it is called\n'Force-drying' (or Low-bake), as distinct from High-bake.\nAlternate Term(s): Binder, Air-drying, Force-drying, Stoving,\nLow-bake, High-bake\n\n3. FLASH-OFF TIME\nDwell time for solvent to evaporate from the paint surface\n\n4. MASKING\nTemporary covering of areas not to be painted\n\n5. POLISHING\nTerm is often used to describe the action of using a machine\nto buffer wheel a vehicle\n\n6. PRIMERS\nMaterial applied to the surface to seal, fill scratches and\nimprove adhesion of paint.\n\n7. PUTTY\nAlso known as body filler.\n\n8. SANDING\nAn abrasive process used to level a coated surface prior to\nthe application of a further coat.\nAlternate Term(s): Flatting\n\n9. SEALANT\nA protective product applied by hand or machine to an\nautomotive paint, which coats, seals and protects the\nsurface. Normally contains silicones to maximize durability.\n\n10. SOLID COLOR\nA coating, which contains colored pigments only, i.e., does\nnot contain pigments such as aluminum and micas\n\n11. SPRAY GUN\nA typical painter will use a high-pressure spray gun to apply\ncoatings. High-pressure guns are powered by compressed\nair. The purpose of the gun is to turn the liquid paint into a\nmist (atomize) and propel the paint toward the surface to be\npainted. When the wet mist contacts the surface, some of it\nsticks and some of it bounces off of the surface. Under ideal\nconditions, only about 30% of the paint sprayed stick or is\ntransferred to the surface using a high pressure spray gun.\nThis is termed transfer efficiency; high-pressure spray guns\nhave a maximum transfer efficiency of 30%. This means that\n\n--- PDF PAGE 186 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 182\nif a gallon of paint can coat 300 square feet, it will only coat\n90 square feet if applied with a high-pressure spray gun.\n\n12. TACK CLOTH\nCotton fabric, such as cheesecloth, lightly impregnated with\na resin, used to remove dust from a surface after rubbing\ndown and prior to further painting. Tack rags should be\nstored in an airtight container to conserve their tackiness.\n\n13. WET SANDING\nA procedure of simultaneously sanding and rinsing an\nautomotive finish to remove imperfections. Regarded as\ncomplicated and should only be attempted by professionals\n\n--- PDF PAGE 187 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 183\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nAutomotive Painting NC II\nQualification Code:\nALTATP220\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment Circular\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument\nCreated\nAutomotive Body\nPainting/Finishing NC II\nTBR No. 2004-20/\n12-09-2004\nN/A\n01\nDocument\nAmended\nAutomotive Painting NC II\nTBR No. 2020-44/\n10-13-2020\nTESDA Circular No.\n136 series of 2020\nLegend: *Description Types\n- Document Created\n- Document Amended\n- Document Superseded\n\n--- PDF PAGE 188 ---\nTR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 184\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) is\nparticularly grateful for the valuable technical support provided by the following\nindustry stakeholders for the review and development of this Training Regulations.\nThe time and inputs generously given during this undertaking are also highly\nappreciated and recognized as they made significant contributions to the constitution\nof this TR.\n\n• THE TECHNICAL EXPERT PANEL (TEP)\n\nMR. ROMMEL O. CABANELA\nTechnical Expert\nSuzuki Philippines Inc. (SPH)\nMR. MARLON G. PADAOAN\nTechnical Expert\nHonda Cars Phils. Inc. (HCPI)\n\nMR. ELMER B. DEL ROSARIO\nTechnical Expert\nToyota Motor Phils. Corp. (TMPC)\n\nMR. ALLEN RAYMUND A. RUFO\nTechnical Expert\nToyota Motor Phils. Corp. (TMPC)\n\nMR. GERARDO E. DAVID\nTechnical Expert\nUniversal Motors Corp. (UMC)\n\nMR. EDGARDO NAPIÑAS\nTechnical Expert\nToyota Motor Phils. Corp. (TMPC)\nMR. GIDEON C. BRUNO\nTechnical Expert\nMitsubishi Motors Phils. Corp. (MMPC)\n\nMR. MARLON V. SOLLEZA\nTechnical Expert\nAsian Carmakers Corporation\n\nMR. GIAN FRANCO R. COSICO\nTechnical Expert\nIsuzu Phil. Corp. (IPC)\n\nMR. ENRICO A. SURIA\nTe