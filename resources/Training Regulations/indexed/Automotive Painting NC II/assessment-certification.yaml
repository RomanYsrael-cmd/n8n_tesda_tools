    {
      "number": "1",
      "text": "DEGREASING The removal from the substrate of contaminants, which would otherwise give rise to surface defects and performance failures. e.g. poor adhesion"
    },
    {
      "number": "2",
      "text": "DRYING The process of change of a coating from the liquid to the solid state by evaporation of solvent, chemical reaction of the binding medium, or a combination of these processes. When drying takes place during exposure to air at normal temperatures, it is called 'air-drying'; if it can be accelerated by the application of a moderate degree of heat it is called 'Force-drying' (or Low-bake), as distinct from High-bake. Alternate Term(s): Binder, Air-drying, Force-drying, Stoving, Low-bake, High-bake"
    },
    {
      "number": "3",
      "text": "FLASH-OFF TIME Dwell time for solvent to evaporate from the paint surface"
    },
    {
      "number": "4",
      "text": "MASKING Temporary covering of areas not to be painted"
    },
    {
      "number": "5",
      "text": "POLISHING Term is often used to describe the action of using a machine to buffer wheel a vehicle"
    },
    {
      "number": "6",
      "text": "PRIMERS Material applied to the surface to seal, fill scratches and improve adhesion of paint."
    },
    {
      "number": "7",
      "text": "PUTTY Also known as body filler."
    },
    {
      "number": "8",
      "text": "SANDING An abrasive process used to level a coated surface prior to the application of a further coat. Alternate Term(s): Flatting"
    },
    {
      "number": "9",
      "text": "SEALANT A protective product applied by hand or machine to an automotive paint, which coats, seals and protects the surface. Normally contains silicones to maximize durability."
    },
    {
      "number": "10",
      "text": "SOLID COLOR A coating, which contains colored pigments only, i.e., does not contain pigments such as aluminum and micas"
    },
    {
      "number": "11",
      "text": "SPRAY GUN A typical painter will use a high-pressure spray gun to apply coatings. High-pressure guns are powered by compressed air. The purpose of the gun is to turn the liquid paint into a mist (atomize) and propel the paint toward the surface to be painted. When the wet mist contacts the surface, some of it sticks and some of it bounces off of the surface. Under ideal conditions, only about 30% of the paint sprayed stick or is transferred to the surface using a high pressure spray gun. This is termed transfer efficiency; high-pressure spray guns have a maximum transfer efficiency of 30%. This means that --- PDF PAGE 186 --- TR-Automotive Painting NC II Revision 01 Promulgated (10/13/2020) 182 if a gallon of paint can coat 300 square feet, it will only coat 90 square feet if applied with a high-pressure spray gun."
    },
    {
      "number": "12",
      "text": "TACK CLOTH Cotton fabric, such as cheesecloth, lightly impregnated with a resin, used to remove dust from a surface after rubbing down and prior to further painting. Tack rags should be stored in an airtight container to conserve their tackiness."
    },
