    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: FRONT OFFICE SERVICES\n\nNC Level: NC II\n\nNominal Training Duration: 18 Hours (Basic)\n 24 Hours (Common)\n\n 400 Hours (Core)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of Front\nOffice personnel in accordance with industry standards. It covers the basic, common and\ncore competencies on receiving and processing reservations, operating a computerized\nreservation system, providing reception and accommodation services, conducting night\naudit, providing club reception services and providing porter services.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Speak English at a basic\noperational level\n1.3 Complete relevant work\nrelated documents\n1.4 Participate in workplace\nmeeting and discussion\nGroup\ndiscussion\nInteraction\nPractice session\n\n•Demonstration\n• Observation\n• Interviews/\nQuestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam\n2.2 Describe work as a team\nmember\n2.3 Work effectively with\ncolleagues\n2.4 Work in socially diverse\nenvironment\nDiscussion\nInteraction\nSimulation\nGames\n\n•Demonstration\n• Observation\n• Interviews/\nQuestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and development\nDiscussion\nInteraction\nRole Play\n\n•Demonstration\n• Observation\n• Interviews/\nQuestioning\n\n--- PDF PAGE 59 ---\nTR - FRONT OFFICE SERVICES NC II (Amended)\nPromulgated December 2013\n 57\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\n4.4 Perform basic first-aid\nprocedures\nLecture-\nDiscussion\nPlant tour\nSymposium\n\n•Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate\nindustry\nknowledge\n1.1 Seek information on the\nindustry\n1.2 Update continuously\nrelevant industry\nknowledge\n1.3 Develop and update local\nknowledge\n1.4 Promote products and\nservices to customers\nLecture\nGroup\nDiscussion\nIndividual/Group\nAssignment\n\nField visit\nVideo\npresentation\nInterviews/\nQuestioning\nIndividual/Group\nProject or\nReport\n2. Observe\nworkplace\nhygiene\nprocedures\n2.1 Follow hygiene\nprocedures\n2.2 Identify and prevent\nhygiene risk\nLecture\nDemonstration\nRole-play\n\nCase study\nDemonstration\nWritten\nExamination\nInterviews/\nQuestioning\n3. Perform\ncomputer\noperations\n3.1 Plan and prepare task to\nbe undertaken\n3.2 Input data into a\ncomputer\n3.3 Assess information using\ncomputer\n3.4 Produce/ output data\nusing computer system\n3.5 Maintain computer\nsystem\nLecture\nGroup\nDiscussion\nTutorial or self-\npace\nDemonstration\n\nPractice session\nInterviews/\nQuestioning\nPractical\nDemonstration\nObservation\n4. Perform\nworkplace and\nsafety\npractices\n4.1 Practice workplace\nprocedures for health,\nsafety and security\npractices\n4.2 Perform child protection\nduties relevant to the\ntourism industry\n4.3 Observe and monitor\npeople\n4.4 Deal with emergency\nsituations\n4.5 Maintain safe personal\npresentation standards\n4.6 Maintain a safe and\nsecure workplace\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nWritten\nExamination\n\n--- PDF PAGE 60 ---\nTR - FRONT OFFICE SERVICES NC II (Amended)\nPromulgated December 2013\n 58\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Provide\neffective\ncustomer\nservice\n5.1 Greet customers\n5.2 Identify customer\n5.3 Deliver service to\ncustomer\n5.6 Handle queries through\nuse of common business\ntools and technology\n5.5 Handle complaints/\nconflict situations,\nevaluation and\nrecommendations\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nObservation\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nprocess\nreservations\n\n1.1 Receive reservation\nrequest\n1.2 Record details of\nreservation\n1.3 Update reservations\n1.4 Advise others on\nreservation details\nLecture\nDiscussion\nSupervised\nIndustry\nTraining (SIT)\n\nWritten exam\nInterviews\nQuestioning\nSimulation\nDemonstration\nObservation\nThird party\nRole-play\n2. Operate a\ncomputerized\nreservations\nsystem\n2.1 Computerize reservation\nsystem is operated based\non property standards.\n2.2 Create and process\nreservations\n2.3 Send and receive\nreservation\ncommunications\nLecture\nDiscussion\nSupervised\nIndustry\nTraining (SIT)\n\nWritten exam\nInterviews\nQuestioning\nSimulation\nDemonstration\nObservation\nThird party\nRole-play\n3. Provide\naccommodation\nreception\nservices\n3.1 Prepare reception area for\nguest arrival\n3.2 Welcome and register\nguests\n3.3 Computerize reservation\nsystem is operated\n3.4 Perform “During Stay”\nfunctions\n3.5 Organize guest departure\n3.6 Prepare front office records\nand reports\nLecture\nDiscussion\nSupervised\nIndustry\nTraining (SIT)\n\nWritten exam\nInterviews\nQuestioning\nSimulation\nDemonstration\nObservation\nThird party\nRole-play\n\n--- PDF PAGE 61 ---\nTR - FRONT OFFICE SERVICES NC II (Amended)\nPromulgated December 2013\n 59\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Conduct night\naudit\n4.1 Process internal financial\ntransactions\n4.2 Complete routine records\nand reports\nLecture\nDiscussion\nSupervised\nIndustry\nTraining (SIT)\n\nWritten exam\nInterviews\nQuestioning\nSimulation\nDemonstration\nObservation\nThird party\nRole-play\n\n5. Provide club\nreception\nservices\n5.1 Provide information on club\nservices and process\nmemberships\n5.2 Monitor entry to club\nLecture\nDiscussion\nSupervised\nIndustry\nTraining (SIT)\n\nWritten exam\nInterviews\nQuestioning\nSimulation\nDemonstration\nObservation\nThird party\nRole-play\n6. Provide\nconcierge and\nbell services\n6.1 Handle guest arrivals and\ndepartures\n6.2 Handle guest luggage\n6.3 Respond to request for\nconcierge services\n6.4 Manage intoxicated\npersons\nLecture\nDiscussion\nSupervised\nIndustry\nTraining (SIT)\n\nWritten exam\nInterviews\nQuestioning\nSimulation\nDemonstration\nObservation\nThird party\nRole-play\n7. Provide\ncashiering\nservices\n\n7.1 Prepare guest folio\n7.2 Collect cash, cash\nequivalents or non-cash\ntransactions\n7.3 Process receipts and\npayments\n7.4 Reconcile financial\ntransactions at the end of\nthe shift.\nLecture\nDiscussion\nSupervised\nIndustry\nTraining (SIT)\n\nWritten exam\nInterviews\nQuestioning\nSimulation\nDemonstration\nObservation\nThird party\nRole-play\n\n--- PDF PAGE 62 ---\nTR - FRONT OFFICE SERVICES NC II (Amended)\nPromulgated December 2013\n 60"
