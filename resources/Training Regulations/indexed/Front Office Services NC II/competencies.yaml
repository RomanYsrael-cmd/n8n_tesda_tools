  "source_section_text": "Section 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n4.2 The qualification for FRONT OFFICE SERVICES NC II may be attained through\ndemonstration of competence covering all the required core units of qualification.\n\n4.3 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including\nenterprise- based training programs\n4.4.2 Experienced workers (wage employed or self employed)\n4.5 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)\".\n\n--- PDF PAGE 66 ---\nTR - FRONT OFFICE SERVICES NC II (Amended)\nPromulgated December 2013\n 64\n\nBASIC\nCOMPETENCIES\nCOMPETENCY MAP - TOURISM Sector\n(Hotel and Restaurant)\nFRONT OFFICE SERVICES NC II\nDevelop and\nupdate industry\nknowledge\nPerform computer\noperations\nProvide effective\ncustomer service\nObserve\nworkplace\nhygiene\nprocedures\nPerform\nworkplace\nsafety practices\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nPrepare\nsandwiches\nOrganize\nand prepare\nfood\nPlan and control\nmenu based on\ncatering\nSelect, prepare\nand cook meat\nPackage prepare\nfoodstuffs\nEstablish and\nmaintain quality\ncontrol\nManage facilities\nassociated with\ncommercial\ncatering contracts\nApply\ncook-freeze\nproduction\nprocess\nOrganize\nbulk cooking\noperations\nPrepare\nhot and cold\ndesserts\nDevelop\nfood safety\nprogram\nPrepare\nchocolate and\nchocolate\nconfectionery\nReceive and\nstore kitchen\nsupplies\nDevelop menus\nto meet special\ndietary and\ncultural needs\nPrepare\npastry, cakes\nand yeast-based\nproducts\nPrepare\nvegetables, eggs\nand starch\nproducts\nPrepare\ncook and serve\nfood for menus\nSelect, prepare\nand serve\nspecialized food\nitem\nSelect\ncatering\nsystems\nOperate\nfast food\noutlet\nPrepare\nand cook\npoultry and game\nClean\nand maintain\nkitchen premises\nPlan, prepare\nand display\nbuffet\nPlan\nand prepare food\nfor buffets\nPlan\ncatering for an\nevent or function\nSelect, prepare\nand serve\nspecialist cuisines\nPresent food\nApply\nCook, chill\noperation\nprocesses\nPrepare\nand cook seafood\nPrepare\nappetizers and\nsalads\nPrepare\nportion controlled\nmeat cuts\nImplement\nfood safety\nprocedures\nPrepare food\naccording to\ndietary and\ncultural needs\nMonitor\ncatering revenue\nand costs\nApply\ncatering control\nprinciples\nReceive and\nprocess reservations\nHandle and\nserve cheese\nPrepare\nstocks, sauces\nand soups\nTransport and store\nfood in a safe and\nhygienic\nmanner\nOperate\ncomputerized\nreservations\nsystem\nProvide\naccommodation\nreception services\nConduct\nnight audit\nProvide\nclub reception\nservices\nProvide Concierge\nand\nbell services\nProvide Cashiering\nServices\nDemonstrate\nwork values\nPractice\nhousekeeping\nprocedures\n(5S)\nParticipate\nin workplace\ncommunication\nWork\nin team\nenvironment\nPractice\ncareer\nprofessionalism\nWork\nwith others\nDevelop and\npractice\nnegotiation\nskills\nUse\nmathematical\nconcepts and\ntechniques\nUse\nrelevant\ntechnologies\nSolve problems\nrelated to work\nactivities\nReceive and\nrespond to\nworkplace\ncommunication\nDevelop\nteams and\nindividuals\nUtilize\nspecialized\ncommunication\nskills\nPractice\noccupational\nhealth and\nsafety procedures\nLead\nworkplace\ncommunication\nCollect,\nanalyze and\norganize\ninformation\nPlan\nand organize\nwork\nApply\nproblem-\nsolving\ntechniques in\nthe workplace\nLead\nsmall teams\nPromote\nenvironmental\nprotection\nPerform basic cashiering\nand general control\nprocedures\nPerform basic\nmaintenance of machines\nand equipment\nPrepare and serve\ncoffee beverages\nTexture Milk\nPrepare Espresso\n\n--- PDF PAGE 67 ---\nTR - FRONT OFFICE SERVICES NC II (Amended)\nPromulgated December 2013\n 65\nDEFINITION OF TERMS\n\nCONCIERGE\n –\na front office section taking charge of guest inquiries,\nrequests and complaints.\n\nFRONT OFFICE AGENT\n –\na front office staff in-charge of accepting hotel\nreservations;\nregistering\nand\nchecking–out\nguest;\nhandling guest inquiries, request and complaints and\nF.O. Cashiering.\n\nRESERVATION\n –\nthe process of requesting for room accommodation in\nadvance in a hotel or other commercial establishment.\n\nELECTRONIC KEY CARD –\na computer generated electronic card used as guest\nroom key.\n\nBACK-OF-THE-HOUSE\n -\nnon-guest\ncontact\ndepartments\nsuch\nas\nAccounting/Finance\n\nPROPERTY STANDARDS - based according to the hotel, hotel school, training\ninstitution or similar/related commercial establishment.\n\n--- PDF PAGE 68 ---\nTR - FRONT OFFICE SERVICES NC II (Amended)\nPromulgated December 2013\n 66\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nREVIEW PANEL\n\nSANTOS BUENVENIDA ANABELLE O. MORENO\nProfessor\n Chair\nTourism Department\n Tourism Industry Board Foundation, Inc. (TIBFI)\nFar Eastern University\n University of the Philippines – Asian Institute of\nManila\n Tourism (UP-AIT)\nASEAN Master Trainer\n UP Diliman, Quezon City\n\n Past President, Association of Human Resources\n\n Managers for Hotels and Restaurants (AHRM)\n ASEAN Master Trainer\n\nMARTIN S. AGUILAR MICHELLE KAREN B. BARUC\nRooms Division Manager Instructor\nAzalea Residences Lyceum of the Philippines University (LPU)\nBaguio City Batangas City\nASEAN Master Assessor ASEAN Master Assessor\n\nFELIX B. CASIN\nAssistant 