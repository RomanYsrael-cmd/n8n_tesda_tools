candidate:\n1.1 \nHandled luggage services for guest arrivals and \ndepartures according to established standard \nprocedures \n1.2 \nCollected and transported guest luggage in \naccordance with established procedures and security \nrequirements \n1.3 \nProvided bell desk services in accordance with \nestablishment’s security and safety requirements \n1.4 \nShowed and explained room features upon guest’s \narrival following the standard procedures \n1.5 \nDemonstrated skills in interpersonal communication \nwith others in accordance with established standards \n2.  Required Knowledge \n2.1\nCommunication skills\n2.2 \nOccupational health and safety procedures for luggage \n2.3 \nKnowledge of a range of typical bell desk services \n2.4 \nProcedures and systems for the movement of    \nluggage \n2.5 \nFeatures of luggage storage systems \n3.  Required Skills\n3.1\nAbility to provide courteous and friendly service to \nguests \n3.2 \nAbility to safely handle luggage and use luggage \nstorage systems \n4. Resource Implications \nThe following resources should be provided:\n4.1 \nCurrent equipment and technology for moving \nbaggage  \n4.2 \nMultiple pieces of luggage \n4.3 \nBirdcage \n5.  Methods of \nAssessment \nCompetency in this unit may be assessed through:\n5.1 \nDirect observation of the candidate carrying and \nloading multiple pieces of luggage safely or answering \ncustomer requests \n5.2 \nOral or written questions to assess knowledge of \ntypical bell desk procedures and systems \n5.3 \nReview of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate \n5.4 \nProject or work activities that allow the candidate to \ndemonstrate safe working practices in the movement \nof baggage and to respond to a range of typical \ncustomer requirements \n6. Context for \nAssessment \n6.1     Assessment may be done in the workplace or \nsimulated workplace setting\n",
