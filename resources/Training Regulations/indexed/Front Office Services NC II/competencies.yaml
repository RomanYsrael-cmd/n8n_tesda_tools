        "source_title": "CONDUCT NIGHT AUDIT",
        "source_text": "--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08 \nTR - FRONT OFFICE SERVICES NC II   (Amended) \nPromulgated December 2013 \n            44 \nUNIT OF COMPETENCY \n: \nCONDUCT NIGHT AUDIT \n \nUNIT CODE \n: \nTRS5123108 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the skills and knowledge required \nto check and reconcile daily financial transactions and \nrecords, and produce reports relating to establishment \noperations and revenue.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Process internal \nfinancial transactions     \n \n1.1 \nTransactions are double checked to ensure that they \nhave posted in the property’s computerized system. \n1.2 \nFinancial and system discrepancies is identified and \nreconciled according to property standards. \n1.3 \nRoom rates and room status are verified and \nreconciled to guest of the property.   \n1.4 \nInternal financial system and control is suggested for \nimprovements in the property’s operation. \n2.  Complete routine \nrecords and reports \n2.1 \nRoutine records and reports are accurately \ncompleted within designated timelines  \n2.2 \nReports are promptly forwarded to the appropriate \nperson/department\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \nTR - FRONT OFFICE SERVICES NC II   (Amended) \nPromulgated December 2013 \n            45 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Transactions  \n \nMay include: \n1.1 \nFood and beverage \n1.2 \nMini-bar \n1.3 \nLaundry and other services \n1.4 \nInter-departmental vouchers \n2.  Financial \nDiscrepancies  \nMay include: \n2.1 \nIncorrect posting \n2.2 \nErrors in guest folios \n2.3 \nComputer errors  \n2.4 \nSystem glitches \n2.5 \nInterface errors between systems \n2.6 \nErrors in source documentation \n3.  Records and reports \nMay include: \n3.1 \nRoom rates \n3.2 \nOccupancy \n3.3 \nArrivals and departures \n3.4 \nSales performance \n3.5 \nBreakdown by department \n3.6 \nCommission earnings \n3.7 \nSupplier activity \n3.8 \nSales returns \n3.9 \nCommercial account activity  \n3.10 Foreign currency activities \n4. Financial systems  \n  \nMay include: \n4.1 \nPetty cash \n4.2 \nFloats \n4.3 \nDebtor control \n4.4 \nCashiering  \n4.5 \nBanking procedures\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \nTR - FRONT OFFICE SERVICES NC II   (Amended) \nPromulgated December 2013 \n            46 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated ability to check and balance a range \nof transactions following the standards procedures \n1.2 \nDemonstrated ability to identify and rectify  \ndiscrepancies in accordance with established \nstandards \n1.3 \nArticulated the night audit process impacts on overall \nfinancial management in accordance with established \nstandards \n1.4 \nDemonstrated skills on the use of current front office \ntechnology and equipment in accordance with \nenterprise requirements \n2.   Required Knowledge  \n2.1 \nFinancial reporting cycles and procedures in a front \noffice context \n2.2 \nImportance of financial checking and reporting \nprocesses in the overall financial management of an \nestablishment \n3.  Required  Skills \n3.1 \nTypical financial control processes and procedures as \nthey apply to front office operations \n3.2 \nIdentification and rectification of typical variances and \ndiscrepancies \n3.3 \nAuditing of transactions from several operating periods \n4.  Resource Implications  \nThe following resources should be provided: \n4.1 \nCurrent front office technology and equipment   \n4.2 \nA range of transaction documentation typical of a \ncommercial accommodation establishment \n5.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1 \nCopies of records checked by the candidate \n5.2 \nReview of reports and documentation produced by the \ncandidate \n5.3 \nOral or written questions to assess knowledge of \nprocesses and procedures \n5.4 \nReview of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate \n5.5 \nProblem solving \n5.6 \nRole plays \n5.7 \nSimulation \n6.  Context for \nAssessment \n6.1    Assessment may be done in the workplace or \nsimulated workplace environment\n",
