        "source_text": "--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08 \nTR - FRONT OFFICE SERVICES NC II   (Amended) \nPromulgated December 2013 \n            15 \nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY : \nDEVELOP AND UPDATE INDUSTRY KNOWLEDGE \n \nUNIT CODE \n \n: \nTRS311201 \n \nUNIT DESCRIPTOR \n: \nThis unit of competency deals with the knowledge, skills \nrequired to access, increases and update industry \nknowledge.  It includes seek information on the industry and \nupdate industry knowledge \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.  Seek information on \nthe industry \n1.1 \nSources of information on the industry are correctly \nidentified and accessed \n1.2 \nInformation to assist effective work performance is \nobtained in line with job requirements \n1.3 \nSpecific information on sector of work is accessed and \nupdated \n1.4 \nIndustry information is correctly applied to day-to-day \nwork activities \n2.  Update industry \nknowledge \n2.1 \nInformal and/or formal research is used to update \ngeneral knowledge of the industry \n2.2 \nUpdated knowledge is shared with customers and \ncolleagues as appropriate and incorporated into day-\nto-day working activities \n3.  Develop and update \nlocal knowledge \n3.1    Local knowledge is developed  to assist queries on \nlocal/national tourism industry \n3.2    Local knowledge is updated using informal and/or \nformal research  \n3.3    Contact with local communities is maintained \n4.  Promote  products and \nservices to customers \n \n4.1    Promotional initiatives are described that may be \nused to promote products and services \n4.2    Selling skills are applied according to customer  needs\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08 \nTR - FRONT OFFICE SERVICES NC II   (Amended) \nPromulgated December 2013 \n            16 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Information sources \nMay include:  \n1.1 \nmedia \n1.2 \nreference books \n1.3 \nlibraries \n1.4 \nunions \n1.5 \nindustry associations \n1.6 \nindustry journals \n1.7 \ninternet \n1.8 \npersonal observation and experience \n2.  Information to assist \neffective  work \nperformance \nMay include: \n2.1 \ndifferent sectors of the industry and the services \navailable in each sector \n2.2 \nrelationship between tourism and hospitality \n2.3 \nrelationship between the industry and other \nindustries \n2.4 \nindustry working conditions \n2.5 \nlegislation that affects the industry \n liquor \n health and safety \n hygiene \n gaming \n workers compensation \n consumer protection  \n duty of care \n building regulations \n2.6 \ntrade unions environmental issues and \nrequirements \n2.7 \nindustrial relations issues and major \norganizations \n2.8 \ncareer opportunities within the industry \n2.9 \nwork ethic required to work in the industry and \nindustry expectations of staff \n2.10 quality assurance \n \n3.  Informal and formal \nresearch \nMay include: \n3.1 Discussions with colleagues, management and \ncustomers \n3.2  Reading internal enterprise material about    \n       products and services \n3.3 Familiarity with customer comments including \ncomplaints \n3.4 Reading and researching product data and \ninformation\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08 \nTR - FRONT OFFICE SERVICES NC II   (Amended) \nPromulgated December 2013 \n            17 \nVARIABLE \nRANGE \n \n3.5    Conducting internal testing to determine \nquality and differentials \n3.6    General media research \n3.7    Developing and analyzing responses to \nquestionnaires \n3.8    Reading surveys and ratings \n4.  Promotional initiatives \nMay include: \n4.1    Media campaigns \n4.2    Internal promotions, including static displays, \ndemonstrations, tastings, videos, \ncompetitions, packages, events\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08 \nTR - FRONT OFFICE SERVICES NC II   (Amended) \nPromulgated December 2013 \n            18 \nEVIDENCE GUIDE \n \n1.  Critical aspects of  \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nKnew key sources of information on the industry \n1.2 \nUpdated industry knowledge \n1.3 \nAccessed and used industry information \n1.4 \nDeveloped and updated local knowledge \n1.5    Promoted products and services\n2.  Required Skills \n2.1 \nTime management \n2.2 \nReady skills needed to access industry information \n2.3 \nBasic competency skills needed to access the internet \n3.  Required Knowledge  \n3.1 \nOverview of quality assurance in the industry \n3.2 \nRole of individual staff members \n3.3 \nIndustry information sources \n4.  Resource Implications  \nThe following resources should be provided: \n4.1 \nSources of information on the industry \n4.2 \nIndustry knowledge \n5.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1 \nInterview/questions \n5.2 \nPractical demonstration \n5.3 \nPortfolio of industry information related to trainee’s \nwork \n6.  Context of Assessment 6.1 \nAssessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 \nAssessment activities are carried out through TESDA's \naccredited assessment center\n",
