        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and\nhazard control practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5\nApplied basic first-aid treatment\n1.6\nFollowed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.7\nUsed Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.8\nCompleted and updated OHS personal records in\naccordance with workplace requirements\n2. Required Knowledge\n\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n2.10 First Aid procedures and practices\n3. Required Skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n3.5 Safe manual handling of casualty\n4. Resource Implications\nThe following resources must be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\nTR - FRONT OFFICE SERVICES NC II (Amended)\nPromulgated December 2013\n 15\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nDEVELOP AND UPDATE INDUSTRY KNOWLEDGE\n\nUNIT CODE\n\n:"
