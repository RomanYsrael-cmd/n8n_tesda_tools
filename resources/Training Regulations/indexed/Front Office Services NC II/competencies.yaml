        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge on enterprise policies on\nguest and account management.\n1.2\nDemonstrated skills in interpersonal communication\nwith others in accordance with established standards\n1.3\nDemonstrated skills in numerical and financial\nmanagement skills.\n\n2. Required Knowledge\n2.1\nCommunication\n2.1.1 Interpersonal skills\n2.1.2 Communication\n2.2\nKnowledge of revenue recognition.\n2.3\nUnderstanding a computerized cashiering system.\n3. Required Skills\n3.1\nAbility to provide courteous and friendly service to\nguests\n3.2\nAbility to perform financial transactions and recording\nthe transaction in guest account.\n4. Resource Implications\nThe following resources should be provided:\n4.1\nCurrent equipment and technology for cashiering\n4.2\nSample receipts and forms.\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nDirect observation of the candidate\n5.2\nOral or written questions to assess knowledge\ncashiering functions.\n5.3\nReview of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n5.4\nProject or work activities that allow the candidate to\ndemonstrate financial transactions in guest account.\n6. Context of Assessment 6.1 Assessment may be done in the workplace or\nsimulated workplace setting\n\n--- PDF PAGE 58 ---\nTR - FRONT OFFICE SERVICES NC II (Amended)\nPromulgated December 2013\n 56"
