          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nHandled luggage services for guest arrivals and\ndepartures according to established standard\nprocedures\n1.2\nCollected and transported guest luggage in\naccordance with established procedures and security\nrequirements\n1.3\nProvided bell desk services in accordance with\nestablishment’s security and safety requirements\n1.4\nShowed and explained room features upon guest’s\narrival following the standard procedures\n1.5\nDemonstrated skills in interpersonal communication\nwith others in accordance with established standards\n2. Required Knowledge\n2.1\nCommunication skills\n2.2\nOccupational health and safety procedures for luggage\n2.3\nKnowledge of a range of typical bell desk services\n2.4\nProcedures and systems for the movement of\nluggage\n2.5\nFeatures of luggage storage systems\n3. Required Skills\n3.1\nAbility to provide courteous and friendly service to\nguests\n3.2\nAbility to safely handle luggage and use luggage\nstorage systems\n4. Resource Implications\nThe following resources should be provided:\n4.1\nCurrent equipment and technology for moving\nbaggage\n4.2\nMultiple pieces of luggage\n4.3\nBirdcage\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nDirect observation of the candidate carrying and\nloading multiple pieces of luggage safely or answering\ncustomer requests\n5.2\nOral or written questions to assess knowledge of\ntypical bell desk procedures and systems\n5.3\nReview of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n5.4\nProject or work activities that allow the candidate to\ndemonstrate safe working practices in the movement\nof baggage and to respond to a range of typical\ncustomer requirements\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or\nsimulated workplace setting\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\nTR - FRONT OFFICE SERVICES NC II (Amended)\nPromulgated December 2013\n 53\nUNIT OF COMPETENCY\n:\nPROVIDE CASHIERING SERVICES\n\nUNIT CODE\n:"
        },
        "source_text": "TRS5123109\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge,\nskills and attitudes in providing bell and concierge\nservices required for handling guest arrival and\ndepartures, handling guest luggage and responding to\nrequests for bell desk services.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Handle guest arrivals\nand departures\n\n1.1 Expected daily arrivals and departures and requests\nfor major guest movements are reviewed and planned\nin accordance with established standards\n1.2 Guests are welcomed promptly on arrival and directed\nto the appropriate area for registration\n1.3 Guests with luggage are assisted in accordance with\nestablished procedures and safety requirements\n1.4 Guests are escorted to rooms and where appropriate\ncourteously showed/explained the\nestablishment/room features in accordance with\nestablished procedures\n2. Handle guest luggage\n2.1 Guest luggage is safely transported and delivered to\nthe correct location within appropriate timeframes\n2.2 Luggage storage system is operated correctly and in\naccordance with established procedures and security\nrequirements\n2.3 Luggage is marked and accurately stored to allow for\neasy retrieval following the established procedures\n2.4 Luggage is placed correctly within the storage system\n3. Respond to request for\nconcierge services\n3.1 Concierge is provided promptly and in accordance\nwith establishment’s security and safety requirements\n3.2 Colleagues and other departments are liaised to\nensure effective response to concierge service\nrequests.\n4. Manage intoxicated\npersons\n4.1 Levels of intoxication of customers are determined\n4.2 Difficult situations are referred to an appropriate\nperson\n4.3 Appropriate procedures are applied to the situation\nand in accordance with enterprise policy\n4.4 Legislative requirements are applied\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\nTR - FRONT OFFICE SERVICES NC II (Amended)\nPromulgated December 2013\n 51\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Established procedures\nand safety\nrequirements for\nluggage\n\nMay include:\n1.1\nLuggage marking and tagging systems\n1.2\nCarrying capacities of luggage trolleys\n1.3\nDesignated routes for moving luggage through public\nareas\n1.4\nRestrictions on areas into which luggage can be taken\n1.5\nOrder in which luggage is to be moved\n1.6\nSafety standards for lifting heavy items.\n1.7\nSafe manual handling of luggage which includes\nloading and unloading luggage from vehicles and\nhandling fragile items.\n1.8\nProcedures for taking luggage from rooms\n1.9\nPlacement of luggage within rooms\n1.10 Group luggage procedures\n1.11 Handling protocols for dealing with group arrivals and\ndepartments.\n2. Establishment/room\nfeatures guests should\nbe advised\nMay include:\n2.1\nDining options within the establishment\n2.2\nSporting facilities\n2.3\nBusiness Center\n2.4\nFloor facilities\n2.5\nOperating procedures for room equipment such as\nphone, internet or TV\n2.6\nGeneral services such as laundry, valet\n2.7 Meal arrangements\n3. Concierge services\n\nMay include :\n3.1\nMail\n3.2\nMessages\n3.3\nOrganization of transport\n3.4\nLuggage pick up\n3.5\nPaging of guests\n3.6\nPreparation of guest information directories, normally\ndone at the reception area\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\nTR - FRONT OFFICE SERVICES NC II (Amended)\nPromulgated December 2013\n 52\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nHandled luggage services for guest arrivals and\ndepartures according to established standard\nprocedures\n1.2\nCollected and transported guest luggage in\naccordance with established procedures and security\nrequirements\n1.3\nProvided bell desk services in accordance with\nestablishment’s security and safety requirements\n1.4\nShowed and explained room features upon guest’s\narrival following the standard procedures\n1.5\nDemonstrated skills in interpersonal communication\nwith others in accordance with established standards\n2. Required Knowledge\n2.1\nCommunication skills\n2.2\nOccupational health and safety procedures for luggage\n2.3\nKnowledge of a range of typical bell desk services\n2.4\nProcedures and systems for the movement of\nluggage\n2.5\nFeatures of luggage storage systems\n3. Required Skills\n3.1\nAbility to provide courteous and friendly service to\nguests\n3.2\nAbility to safely handle luggage and use luggage\nstorage systems\n4. Resource Implications\nThe following resources should be provided:\n4.1\nCurrent equipment and technology for moving\nbaggage\n4.2\nMultiple pieces of luggage\n4.3\nBirdcage\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nDirect observation of the candidate carrying and\nloading multiple pieces of luggage safely or answering\ncustomer requests\n5.2\nOral or written questions to assess knowledge of\ntypical bell desk procedures and systems\n5.3\nReview of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate\n5.4\nProject or work activities that allow the candidate to\ndemonstrate safe working practices in the movement\nof baggage and to respond to a range of typical\ncustomer requirements\n6. Context for\nAssessment\n6.1 Assessment may be done in the workplace or\nsimulated workplace setting\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\nTR - FRONT OFFICE SERVICES NC II (Amended)\nPromulgated December 2013\n 53\nUNIT OF COMPETENCY\n:\nPROVIDE CASHIERING SERVICES\n\nUNIT CODE\n:"
