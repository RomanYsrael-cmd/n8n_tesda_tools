urately counted.  \n4.3 \nBalance of between computerized system and sum of \ncash and non-cash transactions is accurately \ndetermined, tallied and balanced.  \n4.4 \nTransactions are recorded and processed according to \nproperty standards.  \n4.5 \nCashier’s account is properly closed based on \nproperty standards. \n4.6 \nSource documents are properly filed and stored.\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08 \nTR - FRONT OFFICE SERVICES NC II   (Amended) \nPromulgated December 2013 \n            54 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Transactions \nMay include: \n1.1 \nCredit card \n1.2 \nChecks \n1.3 \nCash payout \n1.4 \nPosting charges \n1.5 \nAccount settlement \n1.6 \nAuditing accounts \n1.7 \nAccounts receivable \n1.8 \nAccounts payable \n1.9 \nDebit cards \n1.10 Deposits \n1.11 Advance payments \n1.12 Vouchers \n1.13 Company Charges \n1.14 Refunds \n1.15 Traveler check \n1.16 Foreign Currency \n1.17 Other financial Transactions \n2.  Non-cash documents \nMay include: \n1.1    Vouchers \n1.2    Posting charges \n1.3    Other financial transactions\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08 \nTR - FRONT OFFICE SERVICES NC II   (Amended) \nPromulgated December 2013 \n            55 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated knowledge on enterprise policies on \nguest and account management. \n1.2 \nDemonstrated skills in interpersonal communication \nwith others in accordance with established standards \n1.3 \nDemonstrated skills in numerical and financial \nmanagement skills. \n \n2.  Required Knowledge  \n2.1 \nCommunication \n2.1.1 Interpersonal skills \n2.1.2 Communication  \n2.2 \nKnowledge of revenue recognition. \n2.3 \nUnderstanding a computerized cashiering system.   \n3.  Required Skills \n3.1 \nAbility to provide courteous and friendly service to \nguests \n3.2 \nAbility to perform financial transactions and recording \nthe transaction in gue