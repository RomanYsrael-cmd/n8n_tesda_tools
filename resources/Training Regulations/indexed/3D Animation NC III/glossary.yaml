  "source_text": "DEFINITION OF TERMS \n \n \nGENERAL \n \n1) Certification - is the process of verifying and validating the competencies of a \nperson through assessment \n \n2) Certificate of Competency (COC) – is a certification issued to individuals who \npass the assessment for a single unit or cluster of units of competency \n \n3) Common Competencies - are the skills and knowledge needed by all people \nworking in a particular industry \n \n4) Competency - is the possession and application of knowledge, skills and \nattitudes to perform work activities to the standard expected in the workplace \n \n5) Competency Assessment - is the process of collecting evidence and making \njudgements on whether competency has been achieved \n \n6) Competency Standard (CS) - is the industry-determined specification of \ncompetencies required for effective work performance \n \n7) Context of Assessment - refers to the place where assessment is to be \nconducted or carried out \n \n8) Core Competencies - are the specific skills and knowledge needed in a particular \narea of work - industry sector/occupation/job role \n \n9) Critical aspects of competency - refers to the evidence that is essential for \nsuccessful performance of the unit of competency \n \n10) Elective Competencies - are the additional skills and knowledge required by \nthe individual or enterprise for work \n \n11) Elements - are the building blocks of a unit of competency. They describe in \n outcome terms the functions that a person performs in the workplace \n \n12) Evidence Guide - is a component of the unit of competency that defines or \nidentifies the evidences required to determine the competence of the individual. \nIt provides information on critical aspects of competency, underpinning \nknowledge, underpinning skills, resource implications, assessment method and \ncontext of assessment \n \n13) Level - refers to the category of skills and knowledge required to do a job \n \n14) Method of Assessment - refers to the ways of collecting evidence and when \nevidence should be collected\n\n--- PDF PAGE 100 ---\n____________________________________________________________________________________ 96 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \n15) National Certificate (NC) – is a certification issued to individuals who achieve \nall the required units of competency for a national qualification defined under the \nTraining Regulations. NCs are aligned to specific levels within the PTQF \n \n16) Performance Criteria - are evaluative statements that specify what is to be \nassessed and the required level of performance \n \n17) Qualifications - is a cluster of units of competencies that meets job roles and \nare significant in the workplace. It is also a certification awarded to a person on \nsuccessful completion of a course in recognition of having demonstrated \ncompetencies in an industry sector \n \n18) Range of Variables - describes the circumstances or context in which the work \nis to be performed \n \n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an \nindividual’s skills, knowledge and attitudes gained from life and work \nexperiences outside registered training programs \n \n20) Resource Implications - refers to the resources needed for the successful \nperformance of the work activity described in the unit of competency. It includes \nwork environment and conditions, materials, tools and equipment \n \n21) Basic Competencies - are the skills and knowledge that everyone needs for \nwork \n \n22) Training Regulations (TR) – refers to the document promulgated and issued by \nTESDA consisting of competency standards, national qualifications and training \nguidelines for specific sectors/occupations. The TR serve as basis for \nestablishment of qualification and certification under the PTQF. It also serves as \nguide for development of competency-based curricula and instructional materials \nincluding registration of TVET programs offered by TVET providers \n \n23) Unit of Competency – is a component of the competency standards stating a \nspecific key function or role in a particular job or occupation; it is the smallest \ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 101 ---\n____________________________________________________________________________________ 97 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nSECTOR SPECIFIC \n \n1. Animation – a simulation of movement created by displaying a series of pictures, \nor frames. Cartoons on television are one example of animation. Animation on \ncomputers is one of the chief ingredients of multimedia presentations. There are \nmany software applications that enable you to create animations that you can \ndisplay on a computer monitor. \n2. 3D Animation – the creation of moving pictures in a three-dimensional digital \nenvironment. This is done by sequencing consecutive images, or \"frames\", that \nsimulate motion by each image showing the next in a gradual progression of \nsteps, filmed by a virtual \"camera\" and then output to video by a rendering \nengine. \n3. Browser – a software package that provides the user interface for accessing \nInternet, intranet and extranet Web sites. \n4. Computer – a device that has the ability to accept data; internally store and \nexecute a program of instructions; perform mathematical, logical, and \nmanipulative operations on data; and report the results. \n5. Computer Terminal – any input/output device connected by telecommunications \nlinks to a computer. \n6. Data - objective measurements of the attributes (characteristics) of entities such \nas people, places, things, and events. \n7. Documentation – a collection of documents or information. \n8. Edit – to modify the form or format of data \n9. Ergonomics - the science and technology emphasizing the safety, comfort, and \nease of use of human-operated machines. The goal of ergonomics is to produce \nsystems that are user-friendly: safe, comfortable and easy to use. \n10. Information – data placed in a meaningful and useful context for an end user. \n11. Information and Communication Technology (ICT) - refers to technologies \nassociated with the transmission and exchange of data in the form of sound, text, \nvisual images, signals or any combination of those forms through the use of \ndigital technology. It encompasses such services as telecommunications, posts, \nmultimedia, electronic commerce, broadcasting, and information technology. \n12. Quality Assurance – methods for ensuring that information system are free from \nerrors and fraud and provide information products of high quality. \n13. Simulation - the process of imitating a real phenomenon with a set of \nmathematical formulas. Advanced computer programs can simulate weather \nconditions, chemical reactions, atomic reactions, and even biological processes. \n14. Software – computer programs and procedures concerned with the operation of \nan information system. \n15. Standards – measures of performance developed to evaluate the progress of a \nsystem toward its objectives \n16. System – an assembly of methods, procedures, or techniques unified by \nregulated interaction to form an organized whole \n17. User- friendly – a characteristic of human-operated equipment and systems that \nmakes them safe, comfortable, and easy to use.\n\n--- PDF PAGE 102 ---\n____________________________________________________________________________________ 98 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \n \n TRAINING REGULATIONS (TR) \n DOCUMENT REVISION HISTORY \n \n \nQualification Title : 3D Animation NC III \nQualification Code: ICT3DA318 \n \n \nRevision \nNo. \n \nDocument \nDescription Types* \nReplaces Version \n(TESDA Board \nResolution No./ \nDate) \nNew Version \n(TESDA Board \nResolution No./ \nDate) \n \nDeployment \nCircular \n00 \nDocument Created – \nAnimation NC III \nNot Applicable \nTB No. 2005-19/ \nNovember 10, 2005 \nNot Applicable \n01 \nDocument Amended – \n3D Animation NC III \n \nTB No. 2005-19/ \nNovember 10, 2005 \nTB No. 2007-22/ \nJuly 27, 2007 \nNot Applicable \n02 \nDocument Amended – \n3D Animation NC III \n \nTB No. 2007-22/ \nJuly 27, 2007 \nTB No. 2018-04/ \nFebruary 27, 2018 \nTESDA Circular \nNo. __ s. 2018 \n Legend: *Description Types \n- Document Created \n- Document Amended\n\n--- PDF PAGE 103 ---\n____________________________________________________________________________________ 99 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018"
