    {
      "term": "1. Animation – a simulation of movement created by displaying a series of pictures,",
      "definition": "or frames. Cartoons on television are one example of animation. Animation on computers is one of the chief ingredients of multimedia presentations. There are many software applications that enable you to create animations that you can display on a computer monitor. 2. 3D Animation – the creation of moving pictures in a three-dimensional digital environment. This is done by sequencing consecutive images, or \"frames\", that simulate motion by each image showing the next in a gradual progression of steps, filmed by a virtual \"camera\" and then output to video by a rendering engine. 3. Browser – a software package that provides the user interface for accessing Internet, intranet and extranet Web sites. 4. Computer – a device that has the ability to accept data; internally store and execute a program of instructions; perform mathematical, logical, and manipulative operations on data; and report the results. 5. Computer Terminal – any input/output device connected by telecommunications links to a computer. 6. Data - objective measurements of the attributes (characteristics) of entities such as people, places, things, and events. 7. Documentation – a collection of documents or information. 8. Edit – to modify the form or format of data 9. Ergonomics - the science and technology emphasizing the safety, comfort, and ease of use of human-operated machines. The goal of ergonomics is to produce systems that are user-friendly: safe, comfortable and easy to use. 10. Information – data placed in a meaningful and useful context for an end user. 11. Information and Communication Technology (ICT) - refers to technologies associated with the transmission and exchange of data in the form of sound, text, visual images, signals or any combination of those forms through the use of digital technology. It encompasses such services as telecommunications, posts, multimedia, electronic commerce, broadcasting, and information technology. 12. Quality Assurance – methods for ensuring that information system are free from errors and fraud and provide information products of high quality. 13. Simulation - the process of imitating a real phenomenon with a set of mathematical formulas. Advanced computer programs can simulate weather conditions, chemical reactions, atomic reactions, and even biological processes. 14. Software – computer programs and procedures concerned with the operation of an information system. 15. Standards – measures of performance developed to evaluate the progress of a system toward its objectives 16. System – an assembly of methods, procedures, or techniques unified by regulated interaction to form an organized whole 17. User- friendly – a characteristic of human-operated equipment and systems that makes them safe, comfortable, and easy to use."
