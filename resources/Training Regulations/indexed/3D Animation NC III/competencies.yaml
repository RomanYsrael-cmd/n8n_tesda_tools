          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify 3D \nshading and \ntexturing \nrequirements \n \n \n  \n1.1 Object shading and \ntexturing creative \nrequirements including \nproduction specifications \nare identified and \ndiscussed with relevant \npersonnel based on the \ncreative requirements \n1.2 Shading and texturing tools \nand techniques are \nidentified relevant to the 3D \nModels, creative and \ntechnical requirements \n1.3 Required peripherals and \nequipment to be used are \nidentified and prepared \naccording to task to be \nundertaken. \n \n \n1.1 Oral communication \n1.2 Written \ncommunication \n1.3 Principles of Design \n1.4 Color Theory \n1.5 Copyright laws and \nregulation \n1.6 Basic photography \n1.7 Anatomy and \nPhysiology \n1.8 Geographical and \ntopology mapping  \n1.9 Techniques and \nMethods of 3D \nshader and texture \n1.10 Application of basic \nlighting for 3D \nshading and \ntexturing  \n1.11 2D, 3D and photo \nediting software’s \nuser interface and its \nmajor tools.  \n1.12 Practicing 3R’s –  \no Reduce, Re-use, \nRecycle/recover \nand environmental \npolicies. \n1.13 Geometry \n1.14 Algebra\n1.1 Design and \nDrawing skills \nfor both living \nand non-living \n1.2 Preparing \nimage or \ntexture skills \n1.3 Effective \nCommunication \nskills \n1.4 Presentation \nskills \n1.5 Computer \noperation skills \n1.6 Photo editing \nskills \n1.7 Practicing \nOSHS, EHSM, \n3Rs and 5S \n2. Gather \ndifferent \nshader and \ntexture \nreferences \n2.1 Creative and technical \nrequirements are \ndetermined to the specific \n3D Models for texturing \npurposes. \n2.2 Texture references and \nsources are gathered or \nsimulated based on \napproved design. \n2.3 Photo editing software and \nrequired peripherals are \nused for modifying textures \n2.1 Verbal \ncommunication \n2.2 Written \ncommunication  \n2.3 OHS Standards \n2.4 OHS processes and \nprocedure for \nComputer Hardware \n2.5 Anatomy and \nPhysiology \n2.6 Geographical and \ntopology mapping  \n2.7 Familiarization of 3D \ntexturing tools, photo-\nediting software’s \nuser interface, and its \nmajor tools.  \n2.1 Drawing and \ndesign skills \n2.2 Observation \nand analytical \nskills  \n2.3 Effective \nCommunication \nskills \n2.4 Presentation \nskills \n2.5 Research and \ndata gathering \nskills \n2.6 Photo and \nvideo capture \nskills \n2.7 Photo editing \nskills\n\n--- PDF PAGE 52 ---\n____________________________________________________________________________________          48 \nTR – 3D ANIMATION NC II       (Version 02)                                     Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.8 Cross platform data \ntransfer \n2.9 Internet browsing \n2.10 Practicing 3Rs – \no Reduce, Re-use, \nRecycle/recover    \nand environmental \npolicies. \n3. Create UV \nmapping and \nshading \n3.1 UV map projection are \nchecked and edited \naccording to creative and \ntechnical requirements. \n3.2 Shading nodes are \nidentified, applied and \nmanipulated for specific \nobject material. \n3.3 Shaded models are render \ntested with basic lighting. \n3.1 Verbal \ncommunication \n3.2 Written \ncommunication \n3.3 OHS processes and \nprocedure for \nComputer Hardware \n3.4 3D UV mapping \n3.5 3D shading \n3.6 Basic lighting \n3.7 photo editing \nsoftware tools \n3.8 Cross platform data \ntransfer \n3.9 Internet browsing \n3.10 Practicing 3Rs –   \no Reduce, Re-use, \nRecycle/recover     \nand environmental   \npolicies \n3.11 Geometry \n3.12 Pole coordinates \n3.13 Mapping \n3.1 Drawing and \ndesign skills \n3.2 Observation \nand analytical \nskills  \n3.3 Effective \nCommunication \nskills \n3.4 Presentation \nskills \n3.5 Research and \ndata gathering \nskills \n3.6 Photo editing \nskills \n3.7 UV mapping \nskills \n3.8 3D Texturing \nskills \n3.9 3D Lighting \nskills \n3.10 Rendering \nskills