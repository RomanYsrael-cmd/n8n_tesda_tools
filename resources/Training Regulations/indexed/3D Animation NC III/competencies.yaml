          "source_text": "1. Critical Aspect of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nSet rendering specifications for the specific \nscene \n1.2 \nAssembled scene elements based on storyboard.\n1.3 \nAdded light sources to the scene \n1.4 \nPlanned and established effective rendering \nprocedures. \n1.5 \nPerformed full software render of animation \nscene/sequence. \n1.6 \nComposited the final rendered scene for final \napproval. \n2. Method of Assessment \nThe assessor must assess the candidate using the \nfollowing: \n2.1 Demonstration with oral questioning \n2.2 Third party report \n2.3\nPortfolio \n3. Resource Implication \nThe following resources should be provided: \n3.1 Appropriate supplies and materials \n3.2 Applicable equipment \n3.3\nWorkplace/Assessment area\n4. Context of Assessment \n4.1 Competency maybe assessed in actual \nworkplace or at the designated TESDA \nAccredited Assessment Center.\n\n--- PDF PAGE 70 ---\n____________________________________________________________________________________ 66 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018"
