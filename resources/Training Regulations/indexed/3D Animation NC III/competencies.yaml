        "source_text": "ELC311203 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, (and) attitudes and \nvalues needed to perform computer operations which \ninclude inputting, accessing, producing and transferring \ndata using the appropriate hardware and software \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Plan and \nprepare for \ntask to be \nundertaken \n1.1. Requirements of task are \ndetermined according to job \nspecifications \n1.2. Appropriate hardware and \nsoftware are selected \naccording to task assigned \nand required outcome \n1.3. Task is planned to ensure \nOH&S guidelines and \nprocedures are followed \n1.4. Client -specific guidelines \nand procedures are followed. \n1.5. Required data security \nguidelines are applied in \naccordance with existing \nprocedures. \n1.1. Main types of \ncomputers and basic \nfeatures of different \noperating systems \n1.2. Main parts of a \ncomputer \n1.3. Information on \nhardware and \nsoftware \n1.4. Data security \nguidelines \n1.1. Reading and \ncomprehension \nskills required to \ninterpret work \ninstruction and \nto interpret \nbasic user \nmanuals. \n1.2. Communication \nskills to identify \nlines of \ncommunication, \nrequest advice, \nfollow \ninstructions and \nreceive \nfeedback. \n1.3. Interpreting user \nmanuals and \nsecurity \nguidelines \n2. Input data \ninto computer\n2.1. Data are entered into the \ncomputer using appropriate \nprogram/application in \naccordance with company \nprocedures \n2.2. Accuracy of information is \nchecked and information is \nsaved in accordance with \nstandard operating \nprocedures \n2.3. Inputted data are stored in \nstorage media according to \nrequirements \n2.4. Work is performed within \nergonomic guidelines\n2.1. Basic ergonomics of \nkeyboard and \ncomputer user \n2.2. Storage devices and \nbasic categories of \nmemory \n2.3. Relevant types of \nsoftware \n2.1. Technology \nskills to use \nequipment \nsafely including \nkeyboard skills. \n2.2. Entering data \n3. Access \ninformation \nusing \ncomputer \n3.1. Correct program/application \nis selected based on job \nrequirements \n3.2. Program/application \ncontaining the information \nrequired is accessed \naccording to company \nprocedures \n3.1. General security, \nprivacy legislation \nand copyright \n3.2. Productivity \nApplication \n3.3. Business Application \n3.1. Accessing \ninformation \n3.2. Searching and \nbrowsing files \nand data\n\n--- PDF PAGE 41 ---\n____________________________________________________________________________________ 37 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.3. Desktop icons are correctly \nselected, opened and closed \nfor navigation purposes \n3.4. Keyboard techniques are \ncarried out in line with OH&S \nrequirements for safe use of \nkeyboards \n4. Produce/ \noutput data \nusing \ncomputer \nsystem \n4.1. Entered data are processed \nusing appropriate software \ncommands \n4.2. Data printed out as required \nusing computer \nhardware/peripheral devices \nin accordance with standard \noperating procedures \n4.3. Files, data are transferred \nbetween compatible systems \nusing computer software, \nhardware/ peripheral devices \nin accordance with standard \noperating procedures \n4.1. Computer \napplication in \nprinting, scanning \nand sending \nfacsimile \n4.2. Types and function \nof computer \nperipheral devices \n4.1. Computer data \nprocessing \n4.2. Printing of data \n4.3. Transferring \nfiles and data \n5. Maintain \ncomputer \nequipment \nand systems \n5.1. Systems for cleaning, minor \nmaintenance and \nreplacement of consumables \nare implemented \n5.2. Procedures for ensuring \nsecurity of data, including \nregular back-ups and virus \nchecks are implemented in \naccordance with standard \noperating procedures \n5.3. Basic file maintenance \nprocedures are implemented \nin line with the standard \noperating procedures\n5.1 Computer \nequipment/system \nbasic maintenance \nprocedures \n5.2 Viruses \n5.3 OH&S principles \nand responsibilities \n5.4 Calculating \ncomputer capacity \n5.5 System Software \n5.6 Basic file \nmaintenance \nprocedures \n5.1 Removing \ncomputer viruses \nfrom infected \nmachines \n5.2 Making backup \nfiles\n\n--- PDF PAGE 42 ---\n____________________________________________________________________________________ 38 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Hardware and peripheral \ndevices \n1.1. Personal computers \n1.2. Networked systems \n1.3. Communication equipment \n1.4. Printers \n1.5. Scanners \n1.6. Keyboard \n1.7. Mouse \n2. Software \nSoftware includes the following but not limited to: \n2.1. Word processing packages \n2.2. Data base packages \n2.3. Internet \n2.4. Spreadsheets \n3. OH & S guidelines \n3.1. OHS guidelines \n3.2. Enterprise procedures \n4. Storage media \nStorage media include the following but not limited to: \n4.1. diskettes \n4.2. CDs \n4.3. zip disks \n4.4. hard disk drives, local and remote \n5. Ergonomic guidelines \n5.1 \nTypes of equipment used \n5.2 \nAppropriate furniture \n5.3 \nSeating posture \n5.4 \nLifting posture \n5.5 \nVisual display unit screen brightness \n6. Desktop icons \nIcons include the following but not limited to: \n6.1 \ndirectories/folders \n6.2 \nfiles \n6.3 \nnetwork devices \n6.4 \nrecycle bin \n7. Maintenance \n7.1 \nCreating more space in the hard disk \n7.2 \nReviewing programs \n7.3 \nDeleting unwanted files \n7.4 \nBacking up files \n7.5 \nChecking hard drive for errors \n7.6 \nUsing up to date anti-virus programs \n7.7 \nCleaning dust from internal and external \nsurfaces\n\n--- PDF PAGE 43 ---\n____________________________________________________________________________________ 39 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Selected and used hardware components correctly \nand according to the task requirement \n1.2. Identified and explain the functions of both \nhardware and software used, their general features \nand capabilities \n1.3. Produced accurate and complete data in \naccordance with the requirements \n1.4. Used appropriate devices and procedures to \ntransfer files/data accurately \n1.5. Maintained computer system \n2. Method of assessment \n2.1. The assessor may select two of the following \nassessment methods to objectively assess the \ncandidate: \n2.1.1. \nObservation \n2.1.2. \nQuestioning \n2.1.3. \nPractical demonstration \n3. Resource implication \n3.1. \nComputer hardware with peripherals \n3.2. \nAppropriate software \n4. Context of Assessment \nAssessment may be conducted in the workplace or in a \nsimulated work environment\n\n--- PDF PAGE 44 ---\n____________________________________________________________________________________ 40 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nCORE COMPETENCIES \n \nUNIT TITLE : CREATE 3D MODELS FOR ANIMATION \nUNIT CODE :"
