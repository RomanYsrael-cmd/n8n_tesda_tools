er-generated \n11.1 Manually written \n11.2 Marked up transcripts \n11.3 Marked up scripts \n11.4 Production schedules\n\n--- PDF PAGE 56 ---\n____________________________________________________________________________________ 52 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nEVIDENCE GUIDE \n \n1. Critical Aspect of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified 3D shading and texture requirements \naccording to both creative and technical \nspecifications. \n1.2 Gather different shader and texture for reference \n1.3 Create UV mapping and shading according to level \nof details needed in production \n1.4 Created 3D Texture map using appropriate tools \nand features of the selected software to meet \nrequirements \n1.5 Test and evaluate textures to obtain quality \nstandard of the project in compliance with the \nrelevant personnel’s instruction. \n2. Method of Assessment \nThe assessor must select two of the following to \nobjectively assess the candidate: \n2.1 Demonstration with oral questioning \n2.2 Interview \n2.3 Portfolio \n3. Resource Implication \nThe following resources should be provided: \n3.1 Appropriate supplies and materials \n3.2 Applicable equipment \n3.3 Workplace/Assessment area \n4. Context of Assessment \n4.1 Competency maybe assessed in actual workplace \nor at the designated TESDA Accredited \nAssessment Center.\n\n--- PDF PAGE 57 ---\n____________________________________________________________________________________ 53 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUNIT TITLE \n : \nSET CHARACTER RIGGING \nUNIT CODE \n :"
