skills \n5.9 3D Lighting \nskills \n5.10 Rendering \nskills\n\n--- PDF PAGE 54 ---\n____________________________________________________________________________________          50 \nTR – 3D ANIMATION NC II       (Version 02)                                     Amended   February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Relevant personnel \nMay include: \n1.1 Director  \n1.2 Producer \n1.3 Project manager \n1.4 Technical Director for Texturing \n1.5 Designers \n1.6 Supervisor \n1.7 Editing personnel \n1.8 3D graphic, animation and modeling production \npersonnel\n2. Production specifications May include: \n2.1. Timeline \n2.2. Budget \n2.3. Deadline \n2.4. Hardware \n3. Creative requirements \n \nMay include: \n3.1 \ncharacter design \n3.2 \nprops design \n3.3 \nobject design \n3.4 \nenvironment design \n3.5 \nmechanical design \n3.6 \narchitectural design \n3.7 \nstructural design \n3.8. Storyboard \n3.9. Model sheet \n3.10. Layout drawings \n3.11. Director’s instructions \n3.12. Soundtrack/lip synch breakdown \n3.13. Color key \n4. References and sources \n \nMay include: \n4.1. 2D flat bitmap images from internet \n4.2. 3D books \n4.3. Photos taken from an orthographic point of view \n4.4.1. Top view  \n4.4.2. Front view \n4.4.3. Right side view \n4.4.4. Left side view \n4.4.5. Back view\n5. 3D Models \n \nMay include: \n5.1. Character \n5.2. Props \n5.3. Objects \n5.4. Environment\n\n--- PDF PAGE 55 ---\n____________________________________________________________________________________          51 \nTR – 3D ANIMATION NC II       (Version 02)                                     Amended   February 27, 2018 \nVARIABLE \nRANGE \n6. Required Peripherals \nMay include: \n6.1. Pen Tablet \n6.2. Digital Camera or  \n        Cellphone Camera \n6.3. USB Flash drive or  \n        External hard drive \n6.4. Scanner \n6.5. Printer\n7. Equipment \nMay include: \n7.1 Personal Computer \n7.2 Mac Desktop Computer \n7.3 Laptop \n7.4 Camera \n7.5 Calibrated monitor \n7.6 Three mouse button \n7.7\nAVR\n8. Photo editing software \nMay include: \n8.1. Adobe Photoshop \n8.2. Paint Tool SAI \n8.3. Corel Draw \n8.4. Paint Shop \n8.5. Manga Studio \n8.6. Gimp \n8.7. Krita\n9. Delivery platform \nDelivery platform may include: \n9.1. World wide web \n9.2. CD-ROM/ DVD \n9.3. External hard drive/ USB drive \n10. Texture mapping \nparameters \n10.1. Lighting effect to an object \n10.2. Shading effect to the given light \n10.3. Level of details \n10.4. No distortion on texture details \n10.5. Render still\n11. Documentation \nDocumentation may be: \nComputer-generated \n11.1 Manually written \n11.2 Marked up transcripts \n11.3 Marked up scripts \n11.4 Production schedules\n\n--- PDF PAGE 56 ---\n____________________________________________________________________________________          52 \nTR – 3D ANIMATION NC II       (Version 02)                                     Amended   February 27, 2018 \nEVIDENCE GUIDE \n \n1. Critical Aspect of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified 3D shading and texture requirements \naccording to both creative and technical \nspecifications. \n1.2 Gather different shader and texture for reference  \n1.3 Create UV mapping and shading according to level \nof details needed in production \n1.4 Created 3D Texture map using appropriate tools \nand features of the selected software to meet \nrequirements  \n1.5 Test and evaluate textures to obtain quality \nstandard of the project in compliance with the \nrelevant personnel’s instruction.  \n2. Method of Assessment \nThe assessor must select two of the following to \nobjectively assess the candidate: \n2.1 Demonstration with oral questioning \n2.2 Interview \n2.3 Portfolio  \n3. Resource Implication \nThe following resources should be provided: \n3.1 Appropriate supplies and materials  \n3.2 Applicable equipment \n3.3 Workplace/Assessment area \n4. Context of Assessment \n4.1 Competency maybe assessed in actual workplace \nor at the designated TESDA Accredited \nAssessment Center.\n",
