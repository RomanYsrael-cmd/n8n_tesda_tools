sign \n2.1.4. environment design \n2.1.5. mechanical design \n2.1.6. architectural design \n2.1.7. structural design \n2.2. Storyboard \n2.3. Model sheet \n2.4. Layout drawings \n2.5. Director’s instructions/notes\n3. References and sources \n \nMay include: \n3.1. Model sheets \n3.2. Story board \n3.3. Reference images from internet \n3.4. 3D references \n3.4. Photo references with orthographic views\n4. Relevant personnel \nMay include: \n4.1. Director \n4.2. Producer \n4.3. Project manager \n4.4. Technical Director \n4.5. Navigation designers \n4.6. Video producer \n4.7. Editing personnel \n4.8. 3D graphic, animation and modeling production \npersonnel \n4.9. Supervisor \n4.10.Team Leader\n5. Production specifications May include: \n5.1 Timeline \n5.2 Budget \n5.3 Deadline \n5.4 Hardware \n5.5 Software \n5.6 Delivery platform \n5.7 Internet access\n\n--- PDF PAGE 48 ---\n____________________________________________________________________________________ 44 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nVARIABLE \nRANGE \n5.8 Production pipeline \n5.9 Manpower \n6. Equipment \nMay include: \n4.1. Personal Computer \n4.2. Mac Desktop Computer \n4.3. Laptop\n7. Required Peripherals \nMay include: \n7.1 Pen Tablet \n7.2 Three mouse button or with scroller \n7.3 Digital Camera or Cellphone Camera \n7.4 USB Flash drive / External Drive \n7.5 Scanner \n7.6 Printer \n7.7 AVR \n8. Model sheet \nMay include: \n8.1. Size Comparison \n8.2. Spatial Relationship \n8.3. Turn around – front, side and back view \n8.4. Design details and information \n8.5. Mood board \n8.6. Expressions \n8.7. Gestures \n8.8. Poses \n9. 3D animation software \nMay include: \n9.1. Autodesk Maya \n9.2. 3D Studio Max \n9.3. Blender 3D \n9.4. Maxon’s Cinema 4D \n9.5. NewTek by the Foundry \n9.6. Zbrush \n9.7. Mudbox\n10. Delivery platform \nMay include: \n10.1. World wide web \n10.2. CD-ROM/DVD/Any external storage system \n10.3. Film \n10.4. Broadcast format\n11. 3D Models \nMay i