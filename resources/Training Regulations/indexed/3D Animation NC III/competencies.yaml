        "source_text": "ICT 216312 \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required to \nproduce the final rendered output of animated 3D scenes. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \nrendering \nspecifications\n1.1. Software renderer is \ndetermined based on project \nrequirements \n1.2. Render settings is set and \nimported in the render \nproperties based on \ntechnical requirements. \n1.3. Additional rendering \nrequirements is checked \nbased on project \nrequirements. \n1.1. Client quality \nspecifications \n1.2. Read from \navailable renderer \nfrom manual’s list \n1.3. Numerical \nequality settings \n1.4. Anatomy and \nPhysiology \n \n1.1. Ability to estimate \nrendering quality \n1.2. Computer \noperation skills \n1.3. Photo editing \nskills \n1.4. Effective \nCommunication \nskills \n1.5. Presentation skills\n2. Assemble \nscene \nelements. \n \n2.1 Final animated scene file is \nopened for assembly based \non the storyboard. \n2.2 All relevant objects are \ngathered into the scene from \nproject library and \nproduction assets based \nproject requirements \n2.3 All scene elements are \narranged based on the \nstoryboard. \n2.1 Storyboard \ndescription \n2.2 Geometry \n2.3 Composition \n2.4 File import \n2.5 Scene assembly \n2.6 File instancing \n2.7 File referencing \n2.8 Scene object \nlayers \n2.1 Ability to discern \nspatial relations \nbetween objects \n2.2 Interpretation \nskills \n2.3 Computer \noperation skills \n2.4 Photo editing \nskills \n2.5 Effective \nCommunication \nskills \n2.6 Presentation skills \n2.7 Compositional \nskills \n3. Add light \nsources to \nthe scene \n3.1. Types of light source/s are \nidentified for proper \n3.2. Light source/s are \npositioned based on scene \nrequirements \n3.3. Lit scene is previewed and \nchecked base on scene \nrequirements \n3.4. Light source/s are edited \nbased on revision notes. \n3.5. Partial frame/s from scene \nare rendered for quality \nchecks based project \nrequirements. \n3.6. Final approval is acquired \nfrom relevant personnel \nbased on company policies. \n \n3.1. Information on \nvisual procedures \n3.2. Production \nstrategies \n3.3. Documentation \n3.4. Scene planning \n3.5. Individual and \ncollective \nrendering \nstrategies \n3.6. Image file formats \n3.7. Video file formats. \n3.8. Object grouping \n3.9. Object hierarchies\n3.10. Object layering \n3.1. Rendering skills \n3.2. Organizing skills \n3.3. File management \nskills \n3.4. Color profiling \nskills \n3.5. Effective \nCommunication \nskills \n3.6. Presentation skills\n3.7. Computer \noperation skills \n3.8. Photography and \nCinematography\n\n--- PDF PAGE 67 ---\n____________________________________________________________________________________ 63 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4. Plan and \nestablish \neffective \nrendering \nprocedures \n4.1. Render type are identified \naccording to project \nspecification \n4.2. Render passes and layers \nare identified according to \ncreative and technical \nspecification \n4.3. Rendering schedules are \nchecked based on hardware \nresources availability, \nproduction deadline and \npriority \n4.4. Hardware limitations are \ndetermined and balanced for \nproduction efficiency based \non technical requirements. \n4.5. Color profile is managed for \nconsistency in accordance \nwith post production output \nspecifications \n4.6. Estimated render times per \nscene is calculated based on \nscene duration \n4.1. Information on \nvisual procedures \n4.2. Production \nstrategies \n4.3. Documentation \n4.4. Scene planning \n4.5. Individual and \ncollective \nrendering \nstrategies \n4.6. Multi-pass \nrendering \n4.7. Image file formats \