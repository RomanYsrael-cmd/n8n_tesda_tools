.1. Range of industry’s \nstandard 3D animation \nsoftware including \ncomputer-assisted \ntechniques are identified \nfor suitability. \n2.2. Computer hardware and \nsoftware is assessed vis-\nà-vis creative and \ntechnical requirements \nand production \nspecifications. \n2.3. 3D animation software is \nselected in consultation \nwith the appropriate \npersonnel to ensure that \noutput met requirements.  \n2.1. Verbal and Written \ncommunication \n2.2. OHS Standards \n2.3. End User License \nAgreement \n2.4. OHS processes and \nprocedure for \nComputer Hardware \n2.5. Familiarization of 2D, \n3D and photo editing \nsoftware's’ user \ninterface and its major \ntools.  \n2.6. Cross platform data \ntransfer \n2.7. Internet browsing \n2.8. Practicing 3Rs – \n \n2.1. Effective \nCommunication \nskills \n2.2. Practicing 3D \nModeling tools \n2.3. Computer \noperation skills \n2.4. Practicing \nOSHS, EHSM, \n3Rs and 5S\n\n--- PDF PAGE 45 ---\n____________________________________________________________________________________          41 \nTR – 3D ANIMATION NC II       (Version 02)                                     Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \n2.4. Selected 3D animation \nsoftware is secured in \naccordance with the \nspecified delivery \nplatform. \n2.9. Reduce, Reuse, \nRecycle/recover and \nenvironmental policies. \n \n3. Create 3D \nmodels and \nimages \n3.1 Familiarization of tools \nand interface of the \nselected program \nidentified is applied to \nmeet creative and \ntechnical requirements. \n3.2. File organization: \n(naming convention, \nhierarchies and data base \nstructure) system are \nlabeled based on parts \nand details. \n3.3. 3D models are \nappropriately identified \naccording to type, tools \nand techniques required \nbased on concept design \nand model sheet. \n3.4. 3D Models produced are \ncompleted with rele