 \nidentification and \nretrieval  \n1.6. Operating the technical \ninformation system by \nusing agreed \nprocedures \n2. Apply \ninformation \ntechnology \n(IT)  \n2.1. Utilize the software and \nIT systems that are \nrequired to execute the \nproject activities  \n2.2. Handle, edit, format and \ncheck information and \ndata obtained from a \nrange of internal and \nexternal sources  \n2.3. Extract, enter, and \nprocess information to \nproduce the outputs \nrequired by customers  \n2.4. Share your own skills \nand understanding to \nhelp others  \n2.5. Implement the specified \nsecurity measures to \nprotect the confidentiality \nand integrity of project \ndata held in IT systems  \n2.1. Attributes and \nlimitations of \navailable software \ntools  \n2.2. Procedures and \nwork instructions for \nthe use of IT  \n2.3. Operational \nrequirements for IT \nsystems   \n2.4. Sources and flow \npaths of data   \n2.5. Security systems \nand measures that \ncan be used   \n2.6. Extract data and \nformat reports   \n2.7. Methods of entering \nand processing \ninformation  \n2.8. WWW enabled \napplications \n2.1. Identifying attributes \nand limitations of \navailable software tools \n2.2. Using procedures and \nwork instructions for the \nuse of IT   \n2.3. Describing operational \nrequirements for IT \nsystems   \n2.4. Identifying sources and \nflow paths of data   \n2.5. Determining security \nsystems and measures \nthat can be used  \n2.6. Extracting data and \nformat reports   \n2.7. Describing methods of \nentering and \nprocessing information  \n2.8. Using WWW \napplications\n\n--- PDF PAGE 31 ---\n____________________________________________________________________________________          27 \nTR – 3D ANIMATION NC II       (Version 02)                                     Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3. Edit, format \nand check \ninformation \n3.1. Basic editing techniques \nis used \n3.2. Accuracy of documents \nare check   \n3.3. Editing and formatting \ntools and techniques are \nused for more complex \ndocuments   \n3.4. Proof reading \ntechniques is used to \ncheck that documents \nlook professional\n3.1. Basic file-handling \ntechniques  \n3.2. Techniques in \nchecking \ndocuments  \n3.3. Techniques in \nediting and \nformatting \n3.4. Proof reading \ntechniques   \n3.1. Using basic file-\nhandling techniques is \nused for the software  \n3.2. Using different \ntechniques in checking \ndocuments  \n3.3. Applying editing and \nformatting techniques  \n3.4. Applying proof reading \ntechniques\n\n--- PDF PAGE 32 ---\n____________________________________________________________________________________          28 \nTR – 3D ANIMATION NC II       (Version 02)                                     Amended   February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Information \nMay include: \n1.1 \nProperty  \n1.2 \nOrganizational \n1.3\nTechnical reference\n2. Technical information\nMay include: \n2.1 \nPaper based \n2.2\nElectronic\n3. Software and IT \nsystems \nMay include: \n3.1 \nSpreadsheets \n3.2 \nDatabases \n3.3 \nWord processing \n3.4\nPresentation \n4. Sources \nMay include: \n4.1 \nOther IT system \n4.2 \nManually created \n4.3 \nWithin own organization \n4.4 \nOutside own organization \n4.5\nGeographically remote \n5. Customers \nMay include: \n5.1 \nColleagues \n5.2 \nCompany and project management \n5.3\nClients\n6. Security measures \nMay include: \n6.1 \nAccess rights to input; \n6.2 \nPasswords; \n6.3 \nAccess rights to outputs; \n6.4 \nData consistency and back-up; \n6.5\nRecovery plans\n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Used technical information systems and \ninformation technology \n1.2. Applied information technology (IT) \n1.3.\nEdited, formatted and checked information\n2. Reso