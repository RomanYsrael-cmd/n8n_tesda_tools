rors are identified and \nisolated. \n2.4. Information on the quality and \nother indicators of production \nperformance are recorded in \naccordance with workplace \nprocedures. \n2.5. In cases of deviations from \nspecific quality standards, \ncauses are documented and \nreported in accordance with \nthe workplace’ s standards \noperating procedures. \n \n2.1. Safety and \nenvironmental \naspects of \nproduction \nprocesses \n2.2. Fault identification \nand reporting  \n2.3. Workplace \nprocedure in \ndocumenting \ncompleted work \n2.4. Workplace Quality \nIndicators \n2.1. Carry out work in \naccordance with \nOHS policies and \nprocedures\n\n--- PDF PAGE 37 ---\n____________________________________________________________________________________          33 \nTR – 3D ANIMATION NC II       (Version 02)                                     Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Engage in \nquality \nimprovemen\nt (Produce) \n3.1. Process improvement \nprocedures are participated \nin relative to workplace \nassignment. \n3.2. Work is carried out in \naccordance with process \nimprovement procedures. \n3.3. Performance of operation or \nquality of product of service \nto ensure customer \nsatisfaction is monitored. \n \n3.1. Quality \nimprovement \nprocesses \n3.2. Company \ncustomers \ndefined \n3.1. Solution providing \nand decision-\nmaking \n3.2. Practice company \nprocess \nimprovement \nprocedure\n\n--- PDF PAGE 38 ---\n____________________________________________________________________________________          34 \nTR – 3D ANIMATION NC II       (Version 02)                                     Amended   February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1 Materials  \n1.1 Materials may include but not limited to: \n1.1.1. Manuals \n1.1.2. Job order \n1.1.3. Instructional videos \n2 Faults \n2.1 Faults may include but n