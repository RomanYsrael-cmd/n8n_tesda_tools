          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify 3D \nmodel \ncharacterization \n \n1.1. Moving parts of 3D Model \nare identified and grouped \ninto sections based on \napproved design. \n1.2. Attitude and behavior are \nassigned to 3D Models \nbased on approved design. \n \n1.1. Written \ncommunication \n1.2. Oral communication\n1.3. Anatomical \nStructure \n1.4. Morphology \n1.5. Physics \n1.6. Kinematics \n1.7. Behavioural \nScience \n1.8. Physiology \n1.9. Computer hardware \nand software \n1.10. Internet Browsing \n1.1. Observation \nand analytical \nskills  \n1.2. Communication \nskills \n1.3. Presentation \nskills \n1.4. Research and \ndata gathering \nskills \n \n2. Gather 3D \nmodel  action \nreferences \n2.1. Dynamic character \nreferences are gathered or \nsimulated based on \napproved design.  \n2.2. Movement constraints are \ndetermined based on \nphysical limitations. \n2.1. Written \ncommunication \n2.2. Oral communication \n2.3. Kinematics  \n2.4. Morphology \n2.5. Videography \n2.6. Motion Capture \n2.7. Photography \n2.8. Internet Browsing \n2.1. Observation and \nanalytical skills  \n2.2. Communication \nskills \n2.3. Presentation \nskills \n2.4. Research and \ndata gathering \nskills \n2.5. Photo and video \ncapture skills \n3. Create joints for \n3D models \n3.1. Rigging specifications are \napplied based on the \nrequirements of animation.  \n3.2. Joint parenting is applied \nwith hierarchical structure \nbased on technical \nrequirements. \n3.3. Naming convention system \nfor joints is clearly labeled \nbased on technical \nrequirements \n3.4. Created controllers are \nproperly labeled and placed \non corresponding joints \nbased on design \nrequirements \n3.5. Specific constraints are \nassigned and applied to \ncontrollers and target \nobject/s based on technical \nrequirements.  \n3.1. The innovation of \n3D animation \nsoftware \n3.2. Analysis of \ncharacter \nmovements and \nInterpreting the \nfunctions to 3D \nanimation rigging \nplatform \n3.3. Algebra \n3.4. Geometry \n3.5. Trigonometry \n3.6. Kinematics  \n3.7. Morphology \n3.8. Physical Science \n3.9. Life Science \n3.10. Physiology \n3.11. Videography \n3.12. Motion Capture \n3.1. Rigging skills \n3.2. Presentation \nskills  \n3.3. Mathematical \nestimation skills \n3.4. Computer \noperation skills \n3.5. Effective \ncommunication \nskills\n\n--- PDF PAGE 58 ---\n____________________________________________________________________________________          54 \nTR – 3D ANIMATION NC II       (Version 02)                                     Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.6. Rigged is tested for \nperformance of model \nintegrity and movement \nbased on the design \nrequirements. \n3.13. Character Rig \nEngines \n \n4. Create blend/ \nmorph shapes \n4.1. Number of polygons are \nquantified and checked for \nconsistency based on the \ndesign \n4.2. Assets of blend /morph \nshapes are created based \non design specification  \n4.3. Assets of blend /morph \nshapes are assigned to \nrigged model based on \napproved 3D model \n4.4. Assets of blend /morph \nshapes are tested for \nmovements based on \napproved 3D model \n4.5. Model design is maintained \nduring modification based \non technical requirements. \n4.1. Verbal \ncommunication \n4.2. Written \ncommunication \n4.3. Computer hardware \n4.4. 3D animation \nsoftware \n4.5. Cross platform file \ntransfer \n4.6. Internet browsing \n4.7. Physiology \n4.8. Life Science \n \n \n4.1. Effective \ncommunication \nskills \n4.2. Listening skills \n4.3. Observation \nskills \n4.4. Testing and \nevaluation skills \n4.5. Presentation \nskills \n4.6. Computer \noperation skills \n4.7. Blending and \nMorphing skills \n5. Bind skin to \nrigged joints \n5.1. Skin/bind weight mapping \nis applied to 3D Model \nbased on technical \nrequirements \n