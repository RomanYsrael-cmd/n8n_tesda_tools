ual procedures \n3.2. Production \nstrategies \n3.3. Documentation \n3.4. Scene planning \n3.5. Individual and \ncollective \nrendering \nstrategies \n3.6. Image file formats \n3.7. Video file formats. \n3.8. Object grouping \n3.9. Object hierarchies\n3.10. Object layering \n3.1. Rendering skills \n3.2. Organizing skills \n3.3. File management \nskills \n3.4. Color profiling \nskills \n3.5. Effective \nCommunication \nskills \n3.6. Presentation skills\n3.7. Computer \noperation skills \n3.8. Photography and \nCinematography\n\n--- PDF PAGE 67 ---\n____________________________________________________________________________________          63 \nTR – 3D ANIMATION NC II       (Version 02)                                     Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4. Plan and \nestablish \neffective \nrendering \nprocedures \n4.1. Render type are identified \naccording to project \nspecification \n4.2. Render passes and layers \nare identified according to \ncreative and technical \nspecification \n4.3. Rendering schedules are \nchecked based on hardware \nresources availability, \nproduction deadline and \npriority \n4.4. Hardware limitations are \ndetermined and balanced for \nproduction efficiency based \non technical requirements. \n4.5. Color profile is managed for \nconsistency in accordance \nwith post production output \nspecifications \n4.6. Estimated render times per \nscene is calculated based on \nscene duration \n4.1. Information on \nvisual procedures \n4.2. Production \nstrategies \n4.3. Documentation \n4.4. Scene planning \n4.5. Individual and \ncollective \nrendering \nstrategies \n4.6. Multi-pass \nrendering \n4.7. Image file formats \n4.8. Video file formats. \n4.9. Object grouping \n4.10. Object \nhierarchies \n4.11. Object layering \n4.1. Rendering skills \n4.2. Organizing skills \n4.3. File management \nskills \n4.4. Color