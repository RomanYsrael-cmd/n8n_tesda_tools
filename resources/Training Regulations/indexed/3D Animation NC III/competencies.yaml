ontext of Assessment \n4.1 Competency maybe assessed in actual workplace \nor at the designated TESDA Accredited \nAssessment Center.\n\n--- PDF PAGE 66 ---\n____________________________________________________________________________________ 62 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUNIT TITLE \n : LIGHT AND RENDER ANIMATION SCENE \nUNIT CODE \n \n : ICT 216312 \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required to \nproduce the final rendered output of animated 3D scenes. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \nrendering \nspecifications\n1.1. Software renderer is \ndetermined based on project \nrequirements \n1.2. Render settings is set and \nimported in the render \nproperties based on \ntechnical requirements. \n1.3. Additional rendering \nrequirements is checked \nbased on project \nrequirements. \n1.1. Client quality \nspecifications \n1.2. Read from \navailable renderer \nfrom manual’s list \n1.3. Numerical \nequality settings \n1.4. Anatomy and \nPhysiology \n \n1.1. Ability to estimate \nrendering quality \n1.2. Computer \noperation skills \n1.3. Photo editing \nskills \n1.4. Effective \nCommunication \nskills \n1.5. Presentation skills\n2. Assemble \nscene \nelements. \n \n2.1 Final animated scene file is \nopened for assembly based \non the storyboard. \n2.2 All relevant objects are \ngathered into the scene from \nproject library and \nproduction assets based \nproject requirements \n2.3 All scene elements are \narranged based on the \nstoryboard. \n2.1 Storyboard \ndescription \n2.2 Geometry \n2.3 Composition \n2.4 File import \n2.5 Scene assembly \n2.6 File instancing \n2.7 File referencing \n2.8 Scene object \nlayers \n2.1 Ability to discern \nspatial relations \nbetween objects \n2.2 Interpretation \nskills \n2.3 Computer \noperation skills \n2.4 Photo editing \nskills \n2.5 Effective \nCommunication \nskills \n2.6 Presentation skills \n2.7 Compositional \nskills \n3. Add light \nsources to \nthe scene \n3.1. Types of light source/s are \nidentified for proper \n3.2. Light source/s are \npositioned based on scene \nrequirements \n3.3. Lit scene is previewed and \nchecked base on scene \nrequirements \n3.4. Light source/s are edited \nbased on revision notes. \n3.5. Partial frame/s from scene \nare rendered for quality \nchecks based project \nrequirements. \n3.6. Final approval is acquired \nfrom relevant personnel \nbased on company policies. \n \n3.1. Information on \nvisual procedures \n3.2. Production \nstrategies \n3.3. Documentation \n3.4. Scene planning \n3.5. Individual and \ncollective \nrendering \nstrategies \n3.6. Image file formats \n3.7. Video file formats. \n3.8. Object grouping \n3.9. Object hierarchies\n3.10. Object layering \n3.1. Rendering skills \n3.2. Organizing skills \n3.3. File management \nskills \n3.4. Color profiling \nskills \n3.5. Effective \nCommunication \nskills \n3.6. Presentation skills\n3.7. Computer \noperation skills \n3.8. Photography and \nCinematography\n\n--- PDF PAGE 67 ---\n____________________________________________________________________________________ 63 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4. Plan and \nestablish \neffective \nrendering \nprocedures \n4.1. Render type are identified \naccording to project \nspecification \n4.2. Render passes and layers \nare identified according to \ncreative and technical \nspecification \n4.3. Rendering schedules are \nchecked based on hardware \nresources availability, \nproduction deadline and \npriority \n4.4. Hardware limitations are \ndetermined and balanced for \nproduction efficiency based \non technical requirements. \n4.5. Color profile is managed for \nconsistency in accordance \nwith post production output \nspecifications \n4.6. Estimated render times per \nscene is calculated based on \nscene duration \n4.1. Information on \nvisual procedures \n4.2. Production \nstrategies \n4.3. Documentation \n4.4. Scene planning \n4.5. Individual and \ncollective \nrendering \nstrategies \n4.6. Multi-pass \nrendering \n4.7. Image file formats \n4.8. Video file formats. \n4.9. Object grouping \n4.10. Object \nhierarchies \n4.11. Object layering \n4.1. Rendering skills \n4.2. Organizing skills \n4.3. File management \nskills \n4.4. Color profiling \nskills \n4.5. Render Passes \nSkills \n4.6. Shot breakdown \nskills \n4.7. Effective \nCommunication \nskills \n4.8. Presentation skills \n4.9. Computer \noperation skills \n \n \n5. Perform full \nsoftware \nrender of \nanimation \nscene or \nsequence \n5.1 Scene is assigned to a \nproduction rendering \nschedule based on project \nrequirements and priorities \n5.2 Final rendering is executed \non the designated rendering \nschedule based on design \n5.3 Final rendered scene is \nsaved and submitted to \nrelevant personnel based on \ncompany policies. \n \n5.1. Storyboard \ndescription \n5.2. Production \nschedule \n5.3. Software renderer \n5.4. Raytracing \n5.5. Ambient \nOcclusion \n5.6. Global \nillumination \n5.7. Photorealism \n5.8. Image based \nlighting\n5.1. Rendering skills \n5.2. Effective \ncommunication \nskills \n5.3. Observation skills \n5.4. Testing and \nevaluation skills \n5.5. Presentation skills\n5.6. Computer \noperation skills. \n6. Post edit \nrendered \nscenes \n6.1. Final and rendered scene are \nedited in compositing \nsoftware \n6.2. Rendered scene are edited \nwith audio as final movie \n6.1. Storyboard \ndescription \n6.2. Production \nschedule \n6.3. Software renderer \n6.4. Raytracing \n6.5. Ambient \nOcclusion \n6.6. Global illumination \n6.7. Photorealism \n6.8. Image based \nlighting \n \n6.1. Basic \nCompositing skills \n6.2. Basic Editing \nSkills \n6.3. Effective \ncommunication \nskills \n6.4. Observation skills \n6.5. Testing and \nevaluation skills \n6.6. Presentation skills \n6.7. Computer \noperation skills.\n\n--- PDF PAGE 68 ---\n____________________________________________________________________________________ 64 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Software renderer \nMay include: \n1.1 Native software renderers \n1.2 Third party software renderer \n1.3 Render farms\n2. Technical requirements \n(camera ratio, image format and resolution, scene duration) \n3. Project library \nMay include: \n3.1 Client supplied objects \n3.2 Pre-production objects \n3.3\nProject specific objects\n4. Production assets \nMay include: \n4.1 Marketplace acquired \n4.2 In house models \n4.3\nObjects from other projects\n3. Render passes \nMay include: \n2.1. Ambient occlusion \n2.2. Matte \n2.3. Shadow \n2.4. Beauty \n2.5. Diffuse \n2.6. Camera Z depth \n2.7. Reflections \n2.8. Specular \n2.9. Special effects \n2.10.Miscellaneous\n4. layers \n(foreground, mid-ground, background, character, props, \nincidentals \n5. Hardware limitations \nMay include: \n \n5.1 Number of CPU \n5.2 Video graphic card \n5.3 Computer memory (RAM) \n5.4\nInternal and external storage devices\n6. Color profiles \nMay include: \n6.1 Color management \n6.2 Color spaces \n6.2.1.1. \nSRGB \n6.2.1.2. \nAdobe RGB \n6.2.1.3. \nCIE lab \n6.2.1.4. \nMonitor RGB \n6.2.1.5. \nDesktop printer profile \n6.2.1.6. \nCMYK\n\n--- PDF PAGE 69 ---\n____________________________________________________________________________________ 65 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nEVIDENCE GUIDE \n \n1. Critical Aspect of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nSet rendering specifications for the specific \nscene \n1.2 \nAssembled scene elements based on storyboard.\n1.3 \nAdded light sources to the scene \n1.4 \nPlanned and established effective rendering \nprocedures. \n1.5 \nPerformed full software render of animation \nscene/sequence. \n1.6 \nComposited the final rendered scene for final \napproval. \n2. Method of Assessment \nThe assessor must assess the candidate using the \nfollowing: \n2.1 Demonstration with oral questioning \n2.2 Third party report \n2.3\nPortfolio \n3. Resource Implication \nThe following resources should be provided: \n3.1 Appropriate supplies and materials \n3.2 Applicable equipment \n3.3\nWorkplace/Assessment area\n4. Context of Assessment \n4.1 Competency maybe assessed in actual \nworkplace or at the designated TESDA \nAccredited Assessment Center.\n\n--- PDF PAGE 70 ---\n____________________________________________________________________________________ 66 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018"
