        "source_text": "ICT 216309 \nUNIT DESRIPTOR : \nThis unit covers the knowledge, skills and attitude required to \n \n \ncreate shader and texture on 3D model with basic lighting. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify 3D \nshading and \ntexturing \nrequirements \n \n \n \n1.1 Object shading and \ntexturing creative \nrequirements including \nproduction specifications \nare identified and \ndiscussed with relevant \npersonnel based on the \ncreative requirements \n1.2 Shading and texturing tools \nand techniques are \nidentified relevant to the 3D \nModels, creative and \ntechnical requirements \n1.3 Required peripherals and \nequipment to be used are \nidentified and prepared \naccording to task to be \nundertaken. \n \n \n1.1 Oral communication \n1.2 Written \ncommunication \n1.3 Principles of Design \n1.4 Color Theory \n1.5 Copyright laws and \nregulation \n1.6 Basic photography \n1.7 Anatomy and \nPhysiology \n1.8 Geographical and \ntopology mapping \n1.9 Techniques and \nMethods of 3D \nshader and texture \n1.10 Application of basic \nlighting for 3D \nshading and \ntexturing \n1.11 2D, 3D and photo \nediting software’s \nuser interface and its \nmajor tools. \n1.12 Practicing 3R’s – \no Reduce, Re-use, \nRecycle/recover \nand environmental \npolicies. \n1.13 Geometry \n1.14 Algebra\n1.1 Design and \nDrawing skills \nfor both living \nand non-living \n1.2 Preparing \nimage or \ntexture skills \n1.3 Effective \nCommunication \nskills \n1.4 Presentation \nskills \n1.5 Computer \noperation skills \n1.6 Photo editing \nskills \n1.7 Practicing \nOSHS, EHSM, \n3Rs and 5S \n2. Gather \ndifferent \nshader and \ntexture \nreferences \n2.1 Creative and technical \nrequirements are \ndetermined to the specific \n3D Models for texturing \npurposes. \n2.2 Texture references and \nsources are gathered or \nsimulated based on \napproved design. \n2.3 Photo editing software and \nrequired peripherals are \nused for modifying textures \n2.1 Verbal \ncommunication \n2.2 Written \ncommunication \n2.3 OHS Standards \n2.4 OHS processes and \nprocedure for \nComputer Hardware \n2.5 Anatomy and \nPhysiology \n2.6 Geographical and \ntopology mapping \n2.7 Familiarization of 3D \ntexturing tools, photo-\nediting software’s \nuser interface, and its \nmajor tools. \n2.1 Drawing and \ndesign skills \n2.2 Observation \nand analytical \nskills \n2.3 Effective \nCommunication \nskills \n2.4 Presentation \nskills \n2.5 Research and \ndata gathering \nskills \n2.6 Photo and \nvideo capture \nskills \n2.7 Photo editing \nskills\n\n--- PDF PAGE 52 ---\n____________________________________________________________________________________ 48 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.8 Cross platform data \ntransfer \n2.9 Internet browsing \n2.10 Practicing 3Rs – \no Reduce, Re-use, \nRecycle/recover \nand environmental \npolicies. \n3. Create UV \nmapping and \nshading \n3.1 UV map projection are \nchecked and edited \naccording to creative and \ntechnical requirements. \n3.2 Shading nodes are \nidentified, applied and \nmanipulated for specific \nobject material. \n3.3 Shaded models are render \ntested with basic lighting. \n3.1 Verbal \ncommunication \n3.2 Written \ncommunication \n3.3 OHS processes and \nprocedure for \nComputer Hardware \n3.4 3D UV mapping \n3.5 3D shading \n3.6 Basic lighting \n3.7 photo editing \nsoftware tools \n3.8 Cross platform data \ntransfer \n3.9 Internet browsing \n3.10 Practicing 3Rs – \no Reduce, Re-use, \nRecycle/recover \nand environmental \npolicies \n3.11 Geometry \n3.12 Pole coordinates \n3.13 Mapping \n3.1 Drawing and \ndesign skills \n3.2 Observation \nand analytical \nskills \n3.3 Effective \nCommunication \nskills \n3.4 Presentation \nskills \n3.5 Research and \ndata gathering \nskills \n3.6 Photo editing \nskills \n3.7 UV mapping \nskills \n3.8 3D Texturing \nskills \n3.9 3D Lighting \nskills \n3.10 Rendering \nskills \n4. Create texture \nmap \n4.1 Tools and features of the \nselected program are \nidentified and applied to \nmeet creative and \ntechnical requirements. \n4.2 Models are set-up for \ntexture and lighting \n4.3 UV map is exported to \nimage editing software for \ncreating texture in \naccordance to precise \ndetail specification \n4.4 Pre-defined images are \napplied as texture using \ntexture mapping \nparameters as required \nbased on design \n4.5 Images are test rendered \nwith proper lighting to \npreview the effect of pre-\ndefined texture applied on \nthe 3D Model.\n4.1 Verbal \ncommunication \n4.2 Written \ncommunication \n4.3 OHS Standards \n4.4 OHS processes and \nprocedure for \nComputer Hardware \n4.5 3D texturing process \n4.6 Image editing \nsoftware tools \n4.7 Cross platform data \ntransfer \n4.8 Internet browsing \n4.9 Practicing 3Rs – \no Reduce, Re-use, \nRecycle/recover \nand environmental \npolicies \n4.10 Geometry \n4.11 Pole coordinates \n4.12 Mapping\n4.1 Drawing and \ndesign skills \n4.2 Observation \nand analytical \nskills \n4.3 Effective \nCommunication \nskills \n4.4 Presentation \nskills \n4.5 Research and \ndata gathering \nskills \n4.6 Image editing \nskills \n4.7 UV mapping \nskills \n4.8 3D Texturing \nskills \n4.9 3D Lighting \nskills\n\n--- PDF PAGE 53 ---\n____________________________________________________________________________________ 49 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.6 Back-ups of texture images \nare prepared, labeled and \nstored in accordance with \ncompany procedures and \nindustry standards of \ndocumentation.\n4.10 Rendering \nskills \n5. Test and \nevaluate 3D \nTextures \n5.1. 3D Texture cross platform \nimage transfers and \ninterface calibration is \nensured to meet the \nrequirements of technical \nand creative specifications. \n5.2. UV texture mapping test is \nused to check distortions \non 3D surface. \n5.3. Proper lighting to render \n3D models are presented \nto relevant personnel for \nreview, comments and \nrecommendations for the \nscene environment. \n5.4. Identified changes are \ndiscussed with the relevant \npersonnel in accordance to \nagreements incorporated \nto the prepared models \nand texture. \n5.5. Image texture is revised \nand refined using photo \nediting software based on \ntechnical requirements \n5.6. Final agreement and \napproval is obtained from \nrelevant personnel for the \nfinal rendered models with \ntexture based on company \nstandard operating \nprocedure. \n \n5.1 Verbal \ncommunication \n5.2 Written \ncommunication \n5.3 OHS Standards \n5.4 OHS processes and \nprocedure for \nComputer Hardware \n5.5 3D texturing process \n5.6 photo editing \nsoftware tools \n5.7 Cross platform data \ntransfer \n5.8 Internet browsing \n5.9 Practicing 3Rs – \no Reduce, Re-use, \nRecycle/recover \nand environmental \npolicies \n5.10 Geometry \n5.11 Pole coordinates \n5.12 Mapping \n5.1 Drawing and \ndesign skills \n5.2 Observation \nand analytical \nskills \n5.3 Effective \nCommunication \nskills \n5.4 Presentation \nskills \n5.5 Research and \ndata gathering \nskills \n5.6 Photo editing \nskills \n5.7 UV mapping \nskills \n5.8 3D Texturing \nskills \n5.9 3D Lighting \nskills \n5.10 Rendering \nskills\n\n--- PDF PAGE 54 ---\n____________________________________________________________________________________ 50 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Relevant personnel \nMay include: \n1.1 Director \n1.2 Producer \n1.3 Project manager \n1.4 Technical Director for Texturing \n1.5 Designers \n1.6 Supervisor \n1.7 Editing personnel \n