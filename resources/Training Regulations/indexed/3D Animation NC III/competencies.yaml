sion \n2.5. How to lead \ndiscussion \n2.6. How to solicit \nresponse \n2.7. Goal setting and \naction planning \n \n2.1. Communicating \neffectively \n2.2. Consulting the crew \non the prepared \nmenu for the month\n\n--- PDF PAGE 7 ---\n____________________________________________________________________________________ 3 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Identify and \ncommunicate \nissues arising \nin the \nworkplace \n3.1 Issues and problems are \nidentified as they arise \n3.2 Information regarding \nproblems and issues are \norganized coherently to \nensure clear and effective \ncommunication \n3.3 Dialogue is initiated with \nappropriate personnel \n3.4 Communication problems \nand issues are raised as \nthey arise \n3.1. Types of issues \nand problems in \nthe workplace \n3.2. Written and \nelectronic \ncommunication \nmethods \n3.3. Communication \nbarriers affecting \nworkplace \ndiscussions \n3.1. Identifying cause \nof problems \n3.2. Identifying \nproblems and \nissues \n3.3. Organizing \ninformation on \nproblems and \nissues \n3.4. Relating problems \nand issues in the \nworkplace\n\n--- PDF PAGE 8 ---\n____________________________________________________________________________________ 4 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Methods of \ncommunication \n1.1. Non-verbal gestures \n1.2. Verbal \n1.3. Face to face \n1.4. Two-way radio \n1.5. Speaking to groups \n1.6. Using telephone \n1.7. Written \n1.8.\nInternet\n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Dealt with a range of communication/information \nat one time \n1.2 Made constructive contributions in workplace \nissues \n1.3 Sought workplace issues effectively \n1.4 Responded 