        },
        "source_text": "ICT315202 \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills, attitudes and values \nneeded to apply quality standards in the workplace. The \nunit also includes the application of relevant safety \nprocedures and regulations, organization procedures and \ncustomer requirements. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Assess \nquality of \nreceived \nmaterials \n1.1. Work instruction is obtained \nand work is carried out in \naccordance with standard \noperating procedures. \n1.2. Received materials are \nchecked against workplace \nstandards and specifications. \n1.3. Faulty materials related to \nwork are identified and \nisolated. \n1.4. Faults and any identified \ncauses are recorded and/or \nreported to the supervisor \nconcerned in accordance with \nworkplace procedures. \n1.5. Faulty materials are replaced \nin accordance with workplace \nprocedures. \n1.1. Relevant \nproduction \nprocesses, \nmaterials and \nproducts \n1.2. Characteristics of \nmaterials, \nsoftware and \nhardware used in \nproduction \nprocesses \n1.3. Quality checking \nprocedures \n1.4. Quality Workplace \nprocedures \n1.5. Identification of \nfaulty materials \nrelated to work \n1.1. Reading skills \nrequired to \ninterpret work \ninstruction \n1.2. Critical thinking \n1.3. Interpreting work \ninstructions \n2. Assess own \nwork \n2.1. Documentation relative to \nquality within the company is \nidentified and used. \n2.2. Completed work is checked \nagainst workplace standards \nrelevant to the task \nundertaken. \n2.3. Errors are identified and \nisolated. \n2.4. Information on the quality and \nother indicators of production \nperformance are recorded in \naccordance with workplace \nprocedures. \n2.5. In cases of deviations from \nspecific quality standards, \ncauses are documented and \nreported in accordance with \nthe workplace’ s standards \noperating procedures. \n \n2.1. Safety and \nenvironmental \naspects of \nproduction \nprocesses \n2.2. Fault identification \nand reporting \n2.3. Workplace \nprocedure in \ndocumenting \ncompleted work \n2.4. Workplace Quality \nIndicators \n2.1. Carry out work in \naccordance with \nOHS policies and \nprocedures\n\n--- PDF PAGE 37 ---\n____________________________________________________________________________________ 33 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Engage in \nquality \nimprovemen\nt (Produce) \n3.1. Process improvement \nprocedures are participated \nin relative to workplace \nassignment. \n3.2. Work is carried out in \naccordance with process \nimprovement procedures. \n3.3. Performance of operation or \nquality of product of service \nto ensure customer \nsatisfaction is monitored. \n \n3.1. Quality \nimprovement \nprocesses \n3.2. Company \ncustomers \ndefined \n3.1. Solution providing \nand decision-\nmaking \n3.2. Practice company \nprocess \nimprovement \nprocedure\n\n--- PDF PAGE 38 ---\n____________________________________________________________________________________ 34 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1 Materials \n1.1 Materials may include but not limited to: \n1.1.1. Manuals \n1.1.2. Job order \n1.1.3. Instructional videos \n2 Faults \n2.1 Faults may include but not limited to: \n2.1.1. Materials not to specification \n2.1.2. Materials contain incorrect/outdated \ninformation \n2.1.3. Hardware defects \n2.1.4. Materials that do not conform with any \nregulatory agencies \n3 Documentation \n3.1 Organization work procedures \n3.2 Manufacturer’s instruction manual \n3.3 Customer requirements \n3.4 Forms \n4 Errors \n4.1 Errors may be related but not limited to the \nfollowing: \n4.1.1. Deviation from the requirements of the \nClient \n4.1.2. Deviation from the requirement of the \norganization \n5 Quality standards \n \n5.1 Quality standards may be related but not limited \nto the following: \n5.1.1. Materials \n5.1.2. Hardware \n5.1.3. Final product \n5.1.4. Production processes \n5.1.5. Customer service \n6 Customer \n6.1 Co-worker \n6.2 Supplier/Vendor \n6.3 Client \n6.4 Organization receiving the product or service\n\n--- PDF PAGE 39 ---\n____________________________________________________________________________________ 35 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nEVIDENCE GUIDE \n \n \n \n1 Critical aspect of \ncompetency \nAssessment must show that the candidate: \n1.1 Carried out work in accordance with the \ncompany’s standard operating procedures \n1.2 Performed task according to specifications \n1.3 Reported defects detected in accordance with \nstandard operating procedures \n1.4 Carried out work in accordance with the process \nimprovement procedures\n2 Method of assessment \nThe assessor must select two of the following to \nobjectively evaluate the candidate: \n2.1 Demonstration observation with oral questioning \n2.2 Practical demonstration \n2.3\nInterview\n3 Resource implication \nMaterials, software and hardware to be used in a real or \nsimulated situation \n4 Context of Assessment \nAssessment may be conducted in the workplace or in a \nsimulated environment\n\n--- PDF PAGE 40 ---\n____________________________________________________________________________________ 36 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUNIT TITLE \n : \nPERFORM COMPUTER OPERATIONS \nUNIT CODE \n:"
