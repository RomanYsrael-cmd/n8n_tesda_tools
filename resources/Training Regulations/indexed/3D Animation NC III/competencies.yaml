        "source_title": "ANIMATE CHARACTER",
        "source_text": "--- PDF PAGE 61 ---\n____________________________________________________________________________________          57 \nTR – 3D ANIMATION NC II       (Version 02)                                     Amended   February 27, 2018 \nUNIT TITLE  \n   : \nANIMATE CHARACTER  \nUNIT CODE  \n \n   :      ICT 216311                     \nUNIT DESCRIPTOR   : \nThis unit covers the knowledge, skills and attitude required \nto interpret the technical specifications and techniques to  \n animate 3D objects and characters for animation production  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Gather \naction \nreferences \n \n1.1 Source references and \nassets are gathered and \nobtained relevant to model \ncharacter description. \n1.2 Animation style movement and \nstoryboard are discussed with \nrelevant personnel based on \ncompany policies. \n1.3 Technical parameters are \nincluded based on project \ndescriptions based on \ntechnical requirements. \n1.4 Animatics and blocking is \nidentified based on client \nspecifications  \n1.5 Audio for lipsync are recorded \naccording to timing specified \non the storyboard. \n1.1 Oral \ncommunication \n1.2 Written \ncommunication \n1.3 Production list of \nreference materials\n1.4 Internet resources \n1.5 Client provided \ndocuments \n1.6 Project discussions\n1.7 Animal and human \nanatomy \n1.8 Physics  \n1.9 Social behavior \n1.10 Internet browsing \n1.1 Effective \ncommunication \nskills \n1.2 Computer \noperation skills \n1.3 Research and \ndata gathering \nskills \n1.4 Software \nproficiency \n1.5 Presentation \nskills \n \n2. Create key \nposes \n2.1 Key poses and expressions \nare created and placed \nstrategically in the animation \ntimeline according to scene \nduration. \n2.2 Principles of animation are \napplied in accordance with \nscene requirements. \n2.3 Key poses are evaluated and \nadjusted for clarity in \naccordance to storyboard \ndescription. \n2.4 Lip-syncing action is applied \nbased on dialogue soundtrack  \n \n \n2.1 Oral \ncommunication \n2.2 Written \ncommunication \n2.3 Lipsync reading \n2.4 Storyboard text \ndescriptions \n2.5 Animal and human \nanatomy \n2.6 Physics particularly \nLaws of Motion \n2.7 Social behavior \n2.8 Software \nAnimation tools \n2.9  Audio editing   \nsoftware Audio \nediting  software\n2.1 3D software \nproficiency \n2.2 Manipulating rig \n2.3 Animation graph \nediting skills \n2.4 Action and acting \nskills \n2.5 File conversion \nskills \n2.6 Reading and \nListening \ncomprehension \nskills \n2.7 Computer \noperation skills \n3. Adjust and \nedit timing  \n3.1 Movement is edited based on \nnotes. \n3.2 Graph editor is used to edit and \nsmoothen the action \n3.3 Action poses are adjusted in \nrelation with other elements \ninvolved in the scene based on \ndesign requirements \n3.4 Result of revisions are \nreviewed in accordance to \nanimation scene requirements. \n3.1 Oral \ncommunication \n3.2 Written \ncommunication \n3.3 Lipsync \ntransposed \n3.4 to mouth action \n3.5 Storyboard Action \ndescriptions \n3.6 Dope sheet \ninformation \n3.1 Animation graph \nediting skills \n3.2 Ability to \nenhance \nmovement using \nrig controllers \n3.3 Ability to \nenhance \nmovement using \ngraph editor\n\n--- PDF PAGE 62 ---\n____________________________________________________________________________________          58 \nTR – 3D ANIMATION NC II       (Version 02)                                     Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \n3.7 Animal and human \nanatomy applied \nin-between key \nposes \n3.8 Physics applied \nbetween key poses \nparticularly the \nLaws of Motion \n3.9 Social behaviour \n3.10 Voice acting \n3.11 Action cycling \n \n3.4 Intuitive \ndecisions during \nthe animation \nprocess \n3.5 Ability to apply \nthe 12 animation \nprinciples \n3.6 Effective \ncommunication \nskills \n3.7 Ability to apply \nphonetics for \nlipsynching \n3.8 Ability to \nsynchronize \nsound effects \nand music to \nanimated objects \n3.9 Ability to read \ndope sheet or \nexposure sheet \n3.10 Ability to edit \nanimation using \ndopesheet \n3.11 Ability to edit \nanimation using \nspreadsheet\n4. Create  \nanimation \npreview  \n4.1 Appropriate camera view and \nmovements are set for the \nscene based on storyboard \nrequirements \n4.2 Playback speed is set in real \ntime in accordance to project \nframe rate requirement.  \n4.3 Preferences are set for the \nanimation preview.  \n4.4 Video file format is \ndetermined in accordance to \nproject requirements. \n4.5 Final approval of test preview \nis acquired from relevant \npersonnel based on company \nstandard operating procedure. \n4.6 Approved scenes are saved \nand submitted to designated \nproduction personnel based \non company standard \noperating procedure. \n4.1 Oral \ncommunication \n4.2 Written \ncommunication \n4.3 Directorial \nfeedback \n4.4 Hardware graphics \nrenderer \n4.5 Hardware \nGraphics \n4.6 System \n4.7 Video file-format \n \n \n4.1 Ability to set the \nplayback speed \n4.2 Ability to set \nprogram for \nhardware \nrendering \n4.3 Ability to optimize \nscene file for \nrendering \n4.4 Ability to optimize \nsoftware and \nhardware \nefficiency \n4.5 Ability to convert \nraw file to video \nfile format\n\n--- PDF PAGE 63 ---\n____________________________________________________________________________________          59 \nTR – 3D ANIMATION NC II       (Version 02)                                     Amended   February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Source references \nMay include: \n1.1. Video \n1.2. Books \n1.3. Online sources \n1.4. Live action \n1.5.\n2D stock animation\n2. Assets \nMay include: \n2.1. Rigged models \n2.2. Animatics/blocking \n2.3. 3D stock animation \n2.4.\nAnimation library\n3. Relevant personnel \nMay include: \n3.1. Animation director \n3.2. Technical director \n3.3. Creative director \n3.4.\nSupervisor\n4. 12 principles of \nanimation \nMay include: \n4.1. Stretch and squash \n4.2. Anticipation \n4.3. Staging \n4.4. Timing \n4.5. Slow in/ Slow out \n4.6. Arcs \n4.7. Follow through and overlapping action \n4.8. Straight ahead and pose to pose \n4.9. Secondary actions \n4.10. Exaggeration \n4.11. Solid Drawings \n4.12. Appeal\n5. Project descriptions \nMay include: \n5.1. Character description and personality \n5.2. Model description and behavior \n5.3. Project character associations with environment \n5.4.\nStoryboard timing and blocking\n6. Key poses \nMay include: \n6.1. Dynamic action poses \n6.2. Gestures and attitude poses \n6.3. Anticipation poses \n6.4. Extreme poses  \n6.5. Breakdown key poses \n7. Animation timeline \nMay include: \n7.1. Scene length information \n7.2. Software animation graphic editor \n7.3. Hardware playback  \n7.4. sound output\n\n--- PDF PAGE 64 ---\n____________________________________________________________________________________          60 \nTR – 3D ANIMATION NC II       (Version 02)                                     Amended   February 27, 2018 \nVARIABLE \nRANGE \n8. Timing \nMay include: \n8.1. Dope sheet files \n8.2. Sound files \n8.3. Action references \n8.4. Scene duration \n8.5. Interaction with other models \n8.6. Interactive rig controllers \n9. Hardware test \nMay include: \n9.1. Program hardware render playback \n9.2. Conversion to video file \n9.3.\nSoftware for video playback\n10. Camera view \nMay include  \n10.1. Established camera object \n10.2. Camera hardware shading \n10.3. Orthographic or perspective views \n10.4. Camera hardware quality levels\n11. Production personnel \nMay include  \n11.1. Production manager/supervisor \n11.2. Supervisor \n11.3. Technical administrators \n12. Video file format \nMay include \n12.1. .Avi \n12.2. .Mp4 \n12.3. .Mpg \n12.4. .Wmv \n12.5. .3GP \n12.6. .H264 \n12.7. .DIVX \n12.8. .XVID \n12.9. .FLV \n12.10. .MOV\n\n--- PDF PAGE 65 ---\n____________________________________________________________________________________          61 \nTR – 3D ANIMATION NC II       (Version 02)                                     Amended   February 27, 2018 \nEVIDENCE GUIDE \n \n1. Critical Aspect of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Gathered action references to obtain behavioral \nmodel description, animation style and technical \nparameters. \n1.2. Created key poses that reflect the principles of \nanimation and storyboard blocking and timing  \n1.3. Adjusted and edited timing that creates the illusion \nof life. \n1.4. Rendered test Animation with correct playback \nspeed and duration and converted to appropriate \nvideo format. \n2. Method of Assessment \nThe assessor must assess the candidate using the \nfollowing: \n2.1 Demonstration with oral questioning \n2.2 Interview \n2.3 Portfolio  \n3. Resource Implication \nThe following resources should be provided: \n3.1 Appropriate supplies and materials  \n3.2 Applicable equipment \n3.3 3D animation software \n3.4 Work area \n4. Context of Assessment \n4.1 Competency maybe assessed in actual workplace \nor at the designated TESDA Accredited \nAssessment Center.\n",
