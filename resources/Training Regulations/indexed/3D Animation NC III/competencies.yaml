        "source_text": "500311114 \nUNIT DESCRIPTOR \n: \nThis unit of competency covers the knowledge, skills, and \nattitude required in selecting, sourcing and applying \nappropriate and affordable technologies in the workplace. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Study/select \nappropriate \ntechnology \n \n1.1 Usage of different \ntechnologies is \ndetermined based on \njob requirements \n1.2 Appropriate technology \nis selected as per work \n specification \n \n1.1. Awareness on \ntechnology and its \nfunction \n1.2. Communication \ntechniques \n1.3. Health and safety \nprocedure \n1.4. Company policy in \nrelation to relevant \ntechnology \n1.5. Machineries/ equipment \nand their application \n1.6. Software programs\n1.1. Identifying \nrelevant \ntechnology \non job \n \n1. Apply \nrelevant \ntechnology \n \n2.1 Relevant technology is \neffectively used in \ncarrying out function \n2.2 Applicable software \nand hardware are used \nas per task requirement \n2.3 Management \nconcepts are observed \nand practiced as per \nestablished industry \npractices \n1.1. Knowledge on operating \ninstructions \n1.2. Understanding software \nand hardware system \n1.3. Communication \ntechniques \n1.4. Health and safety \nprocedure \n1.5. Company policy in relation \nto relevant technology \n1.6. Different management \nconcepts \n1.7. Technology adaptability \n1.8. Office technology \n1.9. Industrial technology \n1.10. System technology \n1.11. Training technology \n1.12. Different software/ \nhardware \n1.13. 5S (Proper housekeeping) \n2.1 Applying \nrelevant \ntechnology \n2.2 Communicating \nskills \n2.3 Using software \napplications \nskills \n2.4 Conducting risk \nassessment \n \n2. Maintain/ \nenhance \nrelevant \ntechnology \n3.1 Maintenance of \ntechnology is applied in \naccordance with the \nindustry standard \noperating procedure, \nmanufacturer’s \noperating guidelines \nand occupational \nhealth and safety \n3.1 Awareness on technology \nand its function \n3.2 Repair and maintenance \nprocedure \n3.3 Health and safety \nprocedure \n3.4 Company policy in relation \nto relevant technology \n3.5 Upgrading of technology\n3.1 Performing \nbasic \ntroubleshooting \nskills \n3.2 Identifying \nfailures or \ndefects \n3.3 Communication \nskills\n\n--- PDF PAGE 23 ---\n____________________________________________________________________________________ 19 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nprocedure to ensure its \noperative ability \n3.2 Updating of technology \nis maintained through \ncontinuing education or \ntraining in accordance \nwith job requirement \n3.3 Technology failure/ \ndefect is immediately \nreported to the \nconcern/responsible \nperson or section for \nappropriate action \n3.6 Organizational set-up/work \nflow \n \n3.4 Applying \ncorrective and \npreventive \nmaintenance\n\n--- PDF PAGE 24 ---\n____________________________________________________________________________________ 20 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Technology \nMay include: \n1.1 Office technology \n1.2 Industrial technology \n1.3 System technology \n1.4 Information technology \n1.5 Training technology \n2. Management \nconcepts \nMay include: \n2.1. Real Time Management \n2.2. KAIZEN or continuous improvement \n2.3. 5 S \n2.4. Total Quality Management \n2.5. Other management/productivity tools \n3. Industry standard \noperating \nprocedure \n3.1 Written guidelines relative to the usage of office \ntechnology/equipment \n3.2 Verbal advise/instruction from the co-worker \n4. Manufacturer’s \noperating \nguidelines/ \ninstructions \n4.1 Written instruction/manuals of specific technology/ \nequipment 