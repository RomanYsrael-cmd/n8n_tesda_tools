        "source_text": "ICT 216310 \nUNIT DESRIPTOR : \nThis unit covers the knowledge, skills and attitude required \nto interpret the animation specifications to produce character \nand object rigs for animation production. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify 3D \nmodel \ncharacterization \n \n1.1. Moving parts of 3D Model \nare identified and grouped \ninto sections based on \napproved design. \n1.2. Attitude and behavior are \nassigned to 3D Models \nbased on approved design. \n \n1.1. Written \ncommunication \n1.2. Oral communication\n1.3. Anatomical \nStructure \n1.4. Morphology \n1.5. Physics \n1.6. Kinematics \n1.7. Behavioural \nScience \n1.8. Physiology \n1.9. Computer hardware \nand software \n1.10. Internet Browsing \n1.1. Observation \nand analytical \nskills \n1.2. Communication \nskills \n1.3. Presentation \nskills \n1.4. Research and \ndata gathering \nskills \n \n2. Gather 3D \nmodel action \nreferences \n2.1. Dynamic character \nreferences are gathered or \nsimulated based on \napproved design. \n2.2. Movement constraints are \ndetermined based on \nphysical limitations. \n2.1. Written \ncommunication \n2.2. Oral communication \n2.3. Kinematics \n2.4. Morphology \n2.5. Videography \n2.6. Motion Capture \n2.7. Photography \n2.8. Internet Browsing \n2.1. Observation and \nanalytical skills \n2.2. Communication \nskills \n2.3. Presentation \nskills \n2.4. Research and \ndata gathering \nskills \n2.5. Photo and video \ncapture skills \n3. Create joints for \n3D models \n3.1. Rigging specifications are \napplied based on the \nrequirements of animation. \n3.2. Joint parenting is applied \nwith hierarchical structure \nbased on technical \nrequirements. \n3.3. Naming convention system \nfor joints is clearly labeled \nbased on technical \nrequirements \n3.4. Created controllers are \nproperly labeled and placed \non corresponding joints \nbased on design \nrequirements \n3.5. Specific constraints are \nassigned and applied to \ncontrollers and target \nobject/s based on technical \nrequirements. \n3.1. The innovation of \n3D animation \nsoftware \n3.2. Analysis of \ncharacter \nmovements and \nInterpreting the \nfunctions to 3D \nanimation rigging \nplatform \n3.3. Algebra \n3.4. Geometry \n3.5. Trigonometry \n3.6. Kinematics \n3.7. Morphology \n3.8. Physical Science \n3.9. Life Science \n3.10. Physiology \n3.11. Videography \n3.12. Motion Capture \n3.1. Rigging skills \n3.2. Presentation \nskills \n3.3. Mathematical \nestimation skills \n3.4. Computer \noperation skills \n3.5. Effective \ncommunication \nskills\n\n--- PDF PAGE 58 ---\n____________________________________________________________________________________ 54 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.6. Rigged is tested for \nperformance of model \nintegrity and movement \nbased on the design \nrequirements. \n3.13. Character Rig \nEngines \n \n4. Create blend/ \nmorph shapes \n4.1. Number of polygons are \nquantified and checked for \nconsistency based on the \ndesign \n4.2. Assets of blend /morph \nshapes are created based \non design specification \n4.3. Assets of blend /morph \nshapes are assigned to \nrigged model based on \napproved 3D model \n4.4. Assets of blend /morph \nshapes are tested for \nmovements based on \napproved 3D model \n4.5. Model design is maintained \nduring modification based \non technical requirements. \n4.1. Verbal \ncommunication \n4.2. Written \ncommunication \n4.3. Computer hardware \n4.4. 3D animation \nsoftware \n4.5. Cross platform file \ntransfer \n4.6. Internet browsing \n4.7. Physiology \n4.8. Life Science \n \n \n4.1. Effective \ncommunication \nskills \n4.2. Listening skills \n4.3. Observation \nskills \n4.4. Testing and \nevaluation skills \n4.5. Presentation \nskills \n4.6. Computer \noperation skills \n4.7. Blending and \nMorphing skills \n5. Bind skin to \nrigged joints \n5.1. Skin/bind weight mapping \nis applied to 3D Model \nbased on technical \nrequirements \n5.2. Geometry is tested for \nmodel integrity based on \ndesign and animation \nrequirements \n5.3. Skin/bind weights are \nedited to correct value \ndistribution based on \ntechnical requirements \n5.4. Final testing is performed in \npreparation for animation \nprocess based on \nstoryboard \n5.1. Verbal \ncommunication \n5.2. Written \ncommunication \n5.3. Algebra \n5.4. Geometry \n5.5. Physiology \n5.6. Life Science \n5.7. Computer hardware \n5.8. 3D animation \nsoftware \n5.9. Cross platform file \ntransfer \n5.10. Internet browsing \n5.1. Effective \ncommunication \nskills \n5.2. Observation \nskills \n5.3. Testing and \nevaluation skills \n5.4. Presentation \nskills \n5.5. Computer \noperation skills \n5.6. Binding skin \nskills\n\n--- PDF PAGE 59 ---\n____________________________________________________________________________________ 55 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. 3D Model \nMay include: \n1.1. Character \n1.2. Props \n1.3. Environment \n2. Sections \nMay include: \n2.1 Facial Expressions \n2.2 Body gestures \n2.3 Story board actions \n2.4 Mouth Openings \n2.5 Eyeball Movements \n2.6 Props \n3. Dynamic character \nreferences \nMay include: \n3.1 Live action \n3.2 Animatics/Blocking \n3.3 Story board \n3.4 Video clips \n3.5 Books \n3.6 Online sources \n3.7 Deformation references \n3.8 Rigging references \n3.9 Lip synch/ audio track file \n4. Rigging specifications \nMay include: \n4.1 Joint placement \n4.2 Translation \n4.3 Scale \n4.4 orientation\n5. Skin/bind weight \nMay include: \n5.1. Painting skin/bind weight \n5.2. Vertex skin/bind weight \n6. 3D Animation Software’s \nMay include: \n6.1 Autodesk Maya \n6.2 3D Studio Max \n6.3 Blender 3D \n6.4 Maxon’s Cinema 4D \n6.5 Houdini \n7. Rig controllers \nMay include: \n7.1 Simplified integration of joint hierarchy function \n7.2 Adaptive integration of joint hierarchy\n\n--- PDF PAGE 60 ---\n____________________________________________________________________________________ 56 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nEVIDENCE GUIDE \n \n1. Critical Aspect of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Identified 3D model characterization \n1.2. Gathered 3D model action references \n1.3. Created joints for 3D models \n1.4. Created blend and morphing shapes \n1.5. Binded skin to rigged joints \n2. Method of Assessment \nThe assessor must assess the candidate using the \nfollowing: \n2.1 Demonstration with oral questioning \n2.2 Interview \n2.3 Portfolio \n3. Resource Implication \nThe following resources should be provided: \n3.1 Appropriate supplies and materials \n3.2 Applicable equipment \n3.3 Workplace/Assessment area \n4. Context of Assessment \n4.1 Competency maybe assessed in actual \nworkplace or at the designated TESDA \nAccredited Assessment Center.\n\n--- PDF PAGE 61 ---\n____________________________________________________________________________________ 57 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUNIT TITLE \n : \nANIMATE CHARACTER \nUNIT CODE \n \n :"
