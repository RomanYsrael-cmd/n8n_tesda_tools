        "source_text": "ICT 216308 \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required to \ninterpret the technical specifications and techniques to produce \n3D Models with UV mapping for animation productions. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify 3D \nModeling \nrequirements \n \n \n1.1. Design brief on creative \nand technical \nrequirements including \nproduction \nspecifications and \nreferences are identified \nand discussed with \nrelevant personnel. \n1.2. All necessary equipment \nand required peripherals \nto be used are identified \nand prepared according to \ntask to be undertaken. \n \n1.1. Verbal communication \n1.2. Written communication \n1.3. Intellectual Property \nRights concerns \n1.4. Physical Science \n1.5. Life Science \n1.6. Human and Animal \nAnatomy and \nPhysiology \n1.7. Architectural and \nStructural concept \n1.8. Industrial and \nMechanical concept \n1.9. Computer hardware \nrequirements and \nspecifications for 3D \nsoftware \n1.10. Installation of 3D \nsoftware, photo \nediting software \n1.11. Internet Browsing \n1.12. Practicing 3Rs – \n1.13. Reduce, Reuse, \nRecycle/recover and \nenvironmental \npolicies. \n1.1. Design and \nDrawing skills \nfor both living \nand non-living. \n1.2. Skills in reading \nand analyzing \nstoryboard \n1.3. Effective \nCommunication \nskills \n1.4. Presentation \nskills \n1.5. Computer \noperation skills \n1.6. Practicing \nOSHS, EHSM, \n3Rs and 5S \n2. Identify and \nselect 3D \nanimation \nsoftware \n \n2.1. Range of industry’s \nstandard 3D animation \nsoftware including \ncomputer-assisted \ntechniques are identified \nfor suitability. \n2.2. Computer hardware and \nsoftware is assessed vis-\nà-vis creative and \ntechnical requirements \nand production \nspecifications. \n2.3. 3D animation software is \nselected in consultation \nwith the appropriate \npersonnel to ensure that \noutput met requirements. \n2.1. Verbal and Written \ncommunication \n2.2. OHS Standards \n2.3. End User License \nAgreement \n2.4. OHS processes and \nprocedure for \nComputer Hardware \n2.5. Familiarization of 2D, \n3D and photo editing \nsoftware's’ user \ninterface and its major \ntools. \n2.6. Cross platform data \ntransfer \n2.7. Internet browsing \n2.8. Practicing 3Rs – \n \n2.1. Effective \nCommunication \nskills \n2.2. Practicing 3D \nModeling tools \n2.3. Computer \noperation skills \n2.4. Practicing \nOSHS, EHSM, \n3Rs and 5S\n\n--- PDF PAGE 45 ---\n____________________________________________________________________________________ 41 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \n2.4. Selected 3D animation \nsoftware is secured in \naccordance with the \nspecified delivery \nplatform. \n2.9. Reduce, Reuse, \nRecycle/recover and \nenvironmental policies. \n \n3. Create 3D \nmodels and \nimages \n3.1 Familiarization of tools \nand interface of the \nselected program \nidentified is applied to \nmeet creative and \ntechnical requirements. \n3.2. File organization: \n(naming convention, \nhierarchies and data base \nstructure) system are \nlabeled based on parts \nand details. \n3.3. 3D models are \nappropriately identified \naccording to type, tools \nand techniques required \nbased on concept design \nand model sheet. \n3.4. 3D Models produced are \ncompleted with relevant \ndetails from technical \nrequirements and \nspecifications. \n3.5. 3D Models produced are \ncomplied with the design \nprovided in the model \nsheet. \n \n3.1 Verbal communication \n3.2 Written communication \n3.3 OHS Standards and 5S \nprinciples \n3.4 Intellectual Property \nRights concerns \n3.5 OHS processes and \nprocedure for \nComputer Hardware \n3.6 Physical and Life \nSciences \n3.7 Human Anatomy parts \nand terminologies \n3.8 Architectural and \nStructural concept \n3.9 Use of 2D, 3D and \nphoto editing software \nuser interface and its \nmajor tools. \n3.10 Cross platform data \ntransfer \n3.11 Internet browsing \n3.12 Occupational Safety \nand Health Standards \nManagement (OHS) \nrelated to use of \nComputer \n3.13 Constructive Solid \nGeometry for Basic \nshapes \n3.14 Implicit Surfaces \n3.15 Subdivision Surfaces \n3.1 3D Modeling \nskills \n3.2 Effective \nCommunication \nskills \n3.3 Observation \nSkills \n3.4 Presentation \nskills \n3.5 Polygonal and \nCurve modeling \nskills \n3.6 Demonstration \nSkills \n3.7 Practicing \nOSHS, EHSM, \n3Rs and 5S \n4. Unwrap \ntopology \n4.1 Projection mapping is \nidentified based on \ndesign specification and \n3D model provided. \n4.2 Seam is cut and divided \nin accordance to texture \nassignment \n4.3 Seam is unfolded in \ntexture editor \n4.4 UV layout is exported \nfrom texture editor \n4.1 Verbal communication \n4.2 Written communication \n4.3 OHS Standards and 5S \nprinciples \n4.4 OHS processes and \nprocedure for \nComputer Hardware \n4.5 Physical and Life \nSciences \n4.6 Human Anatomy parts \nand terminologies \n4.7 Architectural and \nStructural concept \n4.8 Mapping \n4.1 3D Modeling \nskills \n4.2 3D UV mapping \nskills \n4.3 Effective \nCommunication \nskills \n4.4 Observation \nSkills \n4.5 Presentation \nskills \n4.6 Polygonal and \nCurve modeling \nskills\n\n--- PDF PAGE 46 ---\n____________________________________________________________________________________ 42 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.9 Use of 2D, 3D and \nphoto editing software \nuser interface and its \nmajor tools. \n4.10 Cross platform data \ntransfer \n4.11 Internet browsing \n4.12 Occupational Safety \nand Health Standards \nManagement (OHS) \nrelated to 