        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency\nAssessment requires evidence that the candidate: \n1.1 Demonstrated sufficient knowledge of the factors \ninfluencing negotiation to achieve agreed outcome \n1.2 Participated in negotiation with at least one person \nto achieve an agreed outcome \n2. Resource Implications \nThe following resources should be provided: \n2.1 Room with facilities necessary for the negotiation \nprocess \n2.2 Human resources (negotiators) \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Observation/demonstration and questioning \n3.2 Portfolio assessment \n3.3 Oral and written questioning \n3.4 Third party report \n4. Context for Assessment \n4.1 Competency to be assessed in real work \nenvironment or in a simulated workplace setting.\n\n--- PDF PAGE 16 ---\n____________________________________________________________________________________ 12 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUNIT OF COMPETENCY : \nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES \nUNIT CODE \n:"
        },
        "source_text": "500311111 \nUNIT DESCRIPTOR \n: \nThis unit covers the skills, knowledge and attitudes \nrequired to collect information in order to negotiate to a \ndesired outcome and participate in the negotiation. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Plan \nnegotiations \n1.1 Information on preparing for \nnegotiation is identified and \nincluded in the plan \n1.2 Information on creating non-\nverbal environments for \npositive negotiating is \nidentified and included in the \nplan \n1.3 Information on active \nlistening is identified and \nincluded in the plan \n1.4 Information on different \nquestioning techniques is \nidentified and included in the \nplan \n1.5 Information is checked to \nensure it is correct and up-to- \ndate \n1.1. Knowledge on \nCodes of practice \nand guidelines for \nthe organization \n1.2. Knowledge of \norganizations policy \nand procedures for \nnegotiations \n1.3. Decision making and \nconflict resolution \nstrategies \nprocedures \n1.4. Concept of \nnegotiation \n \n1.1. Communication \nskills (verbal and \nlistening) \n1.2. Active listening \n1.3. Setting conflict \n1.4. Preparing conflict \nresolution \n1.5. Problem solving \nstrategies on how \nto deal with \nunexpected \nquestions and \nattitudes during \nnegotiation \n1.6. Interpersonal \nskills to develop \nrapport with other \nparties \n2. Participate in \nnegotiations \n2.1 Criteria for successful \noutcome are agreed upon by \nall parties \n2.2 Desired outcome of all parties \nare considered \n2.3 Appropriate language is used \nthroughout the negotiation \n2.4 A variety of questioning \ntechniques are used \n2.5 The issues and processes are \ndocumented and agreed upon \nby all parties \n2.6 Possible solutions are \ndiscussed and their viability \nassessed \n2.7 Areas for agreement are \nconfirmed and recorded \n2.8 Follow-up action is agreed \nupon by all parties \n2.1 Outcome of \nnegotiation \n2.2 Knowledge on \nLanguage \n2.3 Different \nQuestioning \ntechniques \n2.4 Problem solving \nstrategies on how to \ndeal with \nunexpected \nquestions and \nattitudes during \nnegotiation \n2.5 Flexibility \n2.6 Empathy \n2.7 Decision making \nand conflict \nresolution strategies \nprocedures \n2.8 Problem solving \nstrategies on how to \ndeal with \nunexpected \nquestions and \nattitudes during \nnegotiation \n2.1 Negotiating skill \n2.2 Communication \nskills (verbal \nand listening) \n2.3 Observation \nskills \n2.4 Interpersonal \nskills to develop \nrapport with \nother parties \n2.5 Applying \neffective \nquestioning \ntechniques \n2.6 Setting conflict\n\n--- PDF PAGE 14 ---\n____________________________________________________________________________________ 10 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Preparing for negotiation \n1.1. Background information on other parties to the \nnegotiation \n1.2. Good understanding of topic to be negotiated \n1.3. Clear understanding of desired outcome/s \n1.4. Personal attributes \n1.4.1. self awareness \n1.4.2. self esteem \n1.4.3. objectivity \n1.4.4. empathy \n1.4.5. respect for others \n1.5. Interpersonal skills \n1.5.1 listening/reflecting \n1.5.2 non- verbal communication \n1.5.3 assertiveness \n1.5.4 behavior labeling \n1.5.5 testing understanding \n1.5.6 seeking information \n1.5.7 self-disclosing \n1.6. Analytic skills \n1.6.1 observing differences between content and \nprocess \n1.6.2 identifying bargaining information \n1.6.3 applying strategies to manage process \n1.6.4 applying steps in negotiating process \n1.6.5 strategies to manage conflict \n1.6.6 steps in negotiating process \n1.6.7 options within organization and externally for \nresolving conflict \n2. Non- verbal \nenvironments \n2.1. Friendly reception \n2.2. Warm and welcoming room \n2.3. Refreshments offered \n2.4. Lead in conversation before negotiation begins \n3. Active listening \n3.1. Attentive \n3.2. Don’t interrupt \n3.3. Good posture \n3.4. Maintain eye contact \n3.5. Reflective listening \n4. Questioning techniques \n4.1. Direct \n4.2. Indirect \n4.3. Open-ended\n\n--- PDF PAGE 15 ---\n____________________________________________________________________________________ 11 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency\nAssessment requires evidence that the candidate: \n1.1 Demonstrated sufficient knowledge of the factors \ninfluencing negotiation to achieve agreed outcome \n1.2 Participated in negotiation with at least one person \nto achieve an agreed outcome \n2. Resource Implications \nThe following resources should be provided: \n2.1 Room with facilities necessary for the negotiation \nprocess \n2.2 Human resources (negotiators) \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Observation/demonstration and questioning \n3.2 Portfolio assessment \n3.3 Oral and written questioning \n3.4 Third party report \n4. Context for Assessment \n4.1 Competency to be assessed in real work \nenvironment or in a simulated workplace setting.\n\n--- PDF PAGE 16 ---\n____________________________________________________________________________________ 12 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUNIT OF COMPETENCY : \nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES \nUNIT CODE \n:"
