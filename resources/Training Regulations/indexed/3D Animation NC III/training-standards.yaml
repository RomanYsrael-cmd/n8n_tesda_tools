    "source_text": "TESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the \ncomponents mentioned below. \n \nDelivery of knowledge requirements for the basic, common and core units \nof competency specifically in the areas of mathematics, science/technology, \ncommunication/language and other academic subjects shall be contextualized. \nTo this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to \ninclude green technology, issues on health and drugs and catering to persons \nwith disabilities (PWD’s) to accompany their curricula. \n \nCourse Title: 3D Animation \n \n \nNC Level: NC III \n \nNominal Training Duration: \n68 hrs – Basic Competencies \n \n \n \n \n \n 28 hrs – Common Competencies \n \n \n \n \n \n 1,004 hrs– Core Competencies \n \n \n \n \n \n________________ \n \n \n \n \nTotal 1,100 hrs \n \nCourse Description: \n \n \nThis course is designed to develop & enhance the knowledge, skills, & \nattitudes of a 3D Animator in accordance with animation industry standards. It \ncovers the basic & common competencies in addition to the core competencies \nsuch as to produce key drawings for animation, create 3D digital animation and \nto use an authoring tool to create an interactive sequence. \n \nThe nominal duration of 1,100 hours covers the required units at 3D \nAnimation NC III. TVET providers can however, offer a longer, ladderized course \ncovering the NC III basic, common and core units. \n \nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 71 ---\n____________________________________________________________________________________ 67 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nBASIC COMPETENCIES \n(64 hours) \n \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n1. Lead workplace \ncommunication \n1.1. Communicate \ninformation \nabout workplace \nprocesses \n• Lecture and discussion on: \no Effective verbal communication methods \no Sources of information \n• Practice organizing information \n• Identify organization requirements for written and \nelectronic communication methods \n• Follow organization requirements for the use of written \nand electronic communication methods \n• Perform exercises on understanding and conveying \nintended meaning scenario \n• Lecture \n• Demonstration \n• Practical \nexercises \n• Demonstration \n• Role Play \n• Written Test \n• Observation \n2 Hours \n1.2. Lead workplace \ndiscussions \n• Lecture and discussion on: \no Organizational policy on production, quality and \nsafety \no Goals/ objectives and action plan setting \n• Read effective verbal communication methods \n• Prepare/set action plans based on organizational goals \nand objectives \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written Test \n• Observation \n2 Hours \n1.3. Identify and \ncommunicate \nissues arising in \nthe workplace \n• Lecture and discussion on: \no Organizational policy in dealing with issues and \nproblems \n• Read effective verbal communication methods \n• Practice organizing information \n• Perform exercises on understanding and conveying \nintended meaning scenario \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written Test \n• Observation \n2 Hours \n2. Lead small \nteam \n2.1. Provide team \nleadership \n• Lecture and discussion on: \no Company policies and procedures \n• Identify client expectations \n• Practice team building skills \n• Perform exercises on communication skills required for \nleading teams \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours\n\n--- PDF PAGE 72 ---\n____________________________________________________________________________________ 68 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n2.2. Assign \nresponsibilities \n• Lecture and discussion on: \no Team member’s duties and responsibilities \n• Identify client expectations \n• Practice negotiating skills \n• Perform group exercises showing the skills and \ntechniques in promoting team building\n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n2.3. Set performance \nexpectations for \nteam members \n• Lecture and discussion on: \no Team member’s duties and responsibilities \no How performance expectations are set \n• Identify client expectations \n• Perform group exercises in setting individual target/ \nexpectation \n• Read instruction and requirements in up to date \ndissemination to members\n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Observation \n• Written \nexamination \n2 Hours \n2.4. Supervise team \nperformance \n• Discuss listening and treating individual team members \nconcern \n• Identify methods of Monitoring Performance \n• Perform group exercises showing the skills in \nmonitoring team performance \n \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n3. Develop and \npractice \nnegotiation \nskills \n3.1. Plan \nnegotiations \n• Lecture and discussion on: \no codes of practice and guidelines for the organization \no differences between content and process \n• Read: \no Organizations policy and procedures for negotiations \no Decision making and conflict resolution strategies \nprocedures \no Strategies to manage conflict \no Steps in negotiating process \n• Identify bargaining information \n• Apply strategies to manage process \n• Apply steps in negotiating process \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n4 hours \n3.2. Participate in \nnegotiations \n• Discuss/Describe the following strategies during \nnegotiation: \n• Group \nDiscussion \n• Oral \nevaluation \n4 Hours\n\n--- PDF PAGE 73 ---\n____________________________________________________________________________________ 69 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \no Decision making and conflict resolution strategies \nprocedures \no Problem solving strategies on how to deal with \nunexpected questions and attitudes during \nnegotiation \n• Practice the following scenarios in a group activity: \no Perform interpersonal skills to develop rapport with \nother parties \no Perform verbal communication and listening skill \no observation skills \no negotiation skills \n• Describe the Procedure in documenting negotiations \n• Apply a filing system in managing information \n• Demonstrate filing of documents \n• Case studies \n• Demonstration \n• Simulation/ Role \nplay \n• Observation \n4. Solve workplace \nproblems \nrelated to work \nactivities \n4.1. Identify the \nproblem \n \n• Discussion on Normal operating parameters & product \nquality \n• Identify & clarify the nature of problem \n• Read: \no Brainstorming \no Cause and effect diagrams \no PARETO analysis \no SWOT analysis \no GANT chart \no PERT CPM & graph \no SCATTERGRAMS \n• Apply observation, investigation and analytical \ntechniques in solving problem in the workplace \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n4.2. Determine \nfundamental \ncause of the \nproblem \n• Discussion on Teamwork and work allocation problem \n• Read: \no Using range of formal problem solving techniques \no Enterprise goals, targets and measures \no Enterprise quality, OHS and environmental \nrequirement \no Non-routine process and quality problems \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour\n\n--- PDF PAGE 74 ---\n____________________________________________________________________________________ 70 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n• Perform group exercises showing safety in emergency \nsituations and incidents \n• Identify & clarify the nature of problem \n• Select relevant equipment and operational processes \n4.3. Determine \ncorrect / \npreventive \naction \n• Discussion on principles of decision making strategies \nand techniques \n• Read: \no Evaluating the solution \no Devising the best solution \n• Perform group exercise how to implement the \ndeveloped plan to rectify a problem \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour \n4.4. Provide \nrecommendation \nto manager \n• Discuss industry codes and standards \n• Apply enterprise information systems and data collation \n• Prepare recommendation letter \n• Group \nDiscussion \n• Demonstration \n• Oral \nevaluation \n• Observation \n2 Hour \n5. Use \nmathematical \nconcepts and \ntechniques \n5.1. Identify \nmathematical \ntools and \ntechniques to \nsolve problems \n• Discussion on the four fundamental operation (addition, \nsubtraction, division, multiplication) \n• Read: \no Measurement system \no Precision and accuracy \no Basic measuring tools/devices \n• Apply mathematical computations \n• Demonstrate activities on: \no Use of calculator \no Use of different measuring tools \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour \n5.2. Apply \nmathematical \nprocedures / \nsolution \n• Lecture and discussion on: \no Estimation \no Problem-based questions \no Mathematical techniques \n• Apply mathematical computations \n• Demonstrate activities on: \no Use of calculator \no Use of different measuring tools \no Use of mathematical tools and standard formulas \n• Lecture \n• Demonstration \n• Simulation/ Role \nplay \n• Written \nexamination \n• Observation \n4 Hours\n\n--- PDF PAGE 75 ---\n____________________________________________________________________________________ 71 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n5.3. Analyze results \n• Discussion on the four fundamental operation (addition, \nsubtraction, division, multiplication) \n• Read: \no Measurement system \no Precision and accuracy \no Basic measuring tools/devices \n• Apply mathematical computations \n• Demonstrate activities on: \no Use of calculator \no Use of different measuring tools \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n6. Use relevant \ntechnologies \n6.1. Identify \nappropriate \ntechnology \n• Discussion on company policy in relation to relevant \ntechnology \n• Read: \no Awareness on technology and its function \no Relevant technology application/ implementation \no Operating instructions \n• Practice basic communication skill in a group activity \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Simulation/ Role \nPlay \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour \n6.2. Apply relevant \ntechnology \n \n• Discussion on different management concepts \n• Read: \no Relevant technology application/ implementation \no Technology adaptability \no Different management concepts \no Health and safety procedure \no Communication techniques \no Apply software applications skills \n• Practice drills on installing application software \n•Practice basic communication skill in a group activity\n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Simulation/ Role \nPlay \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n4 Hours \n6.3. Maintain/ \nenhance \nrelevant \ntechnology \n• Lecture and discussion on: \no Repair and maintenance procedure \no Operating instructions \n• Practice drills: \no Installing application software \no Basic troubleshooting skills\n• Lecture \n• Demonstration \n• Simulation/ Role \nPlay \n• Written \nexamination \n• Observation \n2 Hours\n\n--- PDF PAGE 76 ---\n____________________________________________________________________________________ 72 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n7. Apply critical \nthinking and \nproblem solving \ntechniques in \nthe workplace \n7.1. Identify the \nproblem \n• Lecture and discussion on \no Processes, normal operating parameters, and product \nquality to recognize nonstandard situations \no Enterprise goals, targets and measures \no Analytical techniques \no Types of problems \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n \n2 Hours \n7.2. Determine \nfundamental \ncauses of the \nproblem \n• Lecture and collaboration on \no Root cause of the problem \no Problem solving tools \n• Exercise on cause and effect \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n• Observation \n2 Hours \n7.3. Determine \ncorrective action\n• Lecture and discussion on \no Identification and analysis of possible options for \nproblem resolution \no Corrective actions \no Principles of decision making strategies and \ntechniques \n•Layouting of action plans\n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n• Observation \n2 Hours \n7.4. Provide \nrecommendatio\nn/s to manager \n• Using range of formal problem solving techniques \n• Preparation and presentation of sample recommendation \nreport \n \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n•Presentation \n2 Hours \n8. Use information \ncreatively and \ncritically \n8.1. Use technical \ninformation \nsystems and \ninformation \ntechnology \n• Lecture and discussion on: \no Application in collating information \no Procedures for inputting, maintaining and archiving \ninformation \no Guidance to people who need to find and use \ninformation \n• Organizing information into a suitable form for reference \nand use \n• Classify stored information for identification and retrieval \n• Operate the technical information system by using \nagreed procedures \n• Lecture \n• Group \nDiscussion \n• Self-paced \nhandout/ module \n• Hands on \n• Demonstration \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n \n4 Hours\n\n--- PDF PAGE 77 ---\n____________________________________________________________________________________ 73 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n8.2. Apply \ninformation \ntechnology (IT) \n• Lecture and discussion on: \no Attributes and limitations of available software tool \no Procedures and work instructions for the use of IT \no Operational requirements for IT systems \no Sources and flow paths of data \no Security systems and measures that can be used \no Methods of entering and processing information \n• Use procedures and work instructions for the use of IT \n• Extract data and format reports \n• Use WWW applications \n• Lecture \n• Group \nDiscussion \n• Self-paced \nhandout/ module \n• Hands on \n• Demonstration \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n \n2 Hours \n8.3. Edit, format and \ncheck \ninformation \n• Lecture and discussion on: \no Basic file-handling techniques \no Techniques in checking documents \no Techniques in editing and formatting \no Proof reading techniques \n• Use different techniques in checking documents \n• Edit and format information applying different techniques \n• Proof read information applying different techniques \n \n• Lecture \n• Group \nDiscussion \n• Self-paced \nhandout/ \nmodule \n• Hands on \n• Demonstration \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n \n2 Hours \n9. Work in a \ndiverse \nenvironment \n9.1. Develop an \nindividual’s \ncultural \nawareness and \nsensitivity \n• Lecture and discussion on: \no Enterprise policies and core values \no Awareness on individual cultures and world geography \no Different methods of verbal and non-verbal \ncommunication in a multicultural setting \no Workplace Diversity Policy \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n2 hrs \n9.2. Work effectively \nin an \nenvironment \nthat \nacknowledges \nand values \ncultural diversity \n• Lecture and discussion on: \no The value of diversity in the economy and society in \nterms of Workforce development \no Innovation \no Social justice \no Customer service excellence \no Teamwork and collaboration \n• Applying strategies for customer service excellence \n \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n \n2 hrs\n\n--- PDF PAGE 78 ---\n____________________________________________________________________________________ 74 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n9.3. Identify \ncommon issues \nin a multicultural \nand diverse \nenvironment \n• Lecture and discussion on: \no Diversity-related conflicts within the workplace \no Change management policies \no Advance strategies for customer service excellence \n• Identifying and addressing workplace harassment \n• Applying advance strategies for customer service \nexcellence \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n \n2 hrs \n \nNote: Basic competencies may be embedded in the core competencies.\n\n--- PDF PAGE 79 ---\n____________________________________________________________________________________ 75 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nCOMMON COMPETENCIES \n28 hrs \n \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration\n1. Apply Quality \nStandards \n4.1 Assess quality of \nreceived materials \n \n• Identify relevant production processes, \nmaterials and products \n• Study and interpret characteristics of materials, \nsoftware and hardware used in production \nprocesses \n• Perform quality checking procedures \n• Apply quality Workplace procedures \n• Identify faulty materials \n• Check quality of materials or component parts \nas per manufacturer’s standards \n• Interpret specifications or symbols \n• Lecture \n• Field trip \n• Symposium \n• Video clips \n• Simulation/ Role \nplaying \n \n• Written test \n• Demonstration \n& questioning \n• Observation & \nquestioning \n \n3 hours \n4.2 Assess own work \n• Perform workplace procedure in documenting \ncompleted work \n• Perform fault identification and reporting \n• Observe safety and environmental aspects of \nproduction processes \n• Utilize workplace quality indicators \n• Document and report deviations from specified \nquality standards \n \n• Field trip \n• Symposium \n• Simulation \n• On the job training \n \n• Demonstration \n& questioning \n• Observation & \nquestioning \n \n3 hours \n4.3 Engage in quality \nimprovement \n• Participate in quality improvement processes \na. IEC/ISO standards \nb. Environmental and safety standards \n• Carry out work as per process improvement \nprocedures \n• Monitor operation performance \n• Implement continuous improvement \n \n• Field trip \n• Symposium \n• Simulation \n• On the job training \n• Demonstration \n& questioning \n• Observation & \nquestioning \n2 hours\n\n--- PDF PAGE 80 ---\n____________________________________________________________________________________ 76 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration\n2. Perform \nComputer \nOperations \n \n1.1 Plan and prepare for \ntask to be \nundertaken \n• Plan and prepare computer operation activity \n• Determine task requirements based on \nrequired output \n• Determine appropriate hardware and software \n• Identify/Select types of computers and basic \nfeatures of different operating systems \n• Interpret and follow client-specific guidelines & \nprocedures \n•Plan task as per data security guidelines\n• Lecture \n• Modular \n• Computer based \ntraining (e-\nlearning) \n• Project method \n• On the job training \n• Written/Oral \nexamination \n• Practical \ndemonstration \n4 hours \n1.2 Input data into \ncomputer \n• Apply basic ergonomics of keyboard and \ncomputer user \n• Enter/Encode data using appropriate computer \nprograms/applications \n• Check accuracy of encoded data/information \nper SOP \n• Save and store inputted data in storage media \n• Storage devices and basic categories of \nmemory \n• Identify and define relevant types of software \n• Lecture \n• Modular \n• Group discussion \n• Project method \n• On the job training \n• Written/Oral \nexamination \n• Practical \ndemonstration \n4 hour \n1.3 Access information \nusing computer \n• Select correct program/ application based on \njob requirements \n• Access computer data/files \n• Interpret general security, privacy legislation & \ncopyright \n• Use Productivity Application \no Microso