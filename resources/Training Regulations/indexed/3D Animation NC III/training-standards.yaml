      "source_text": "TESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the \ncomponents mentioned below. \n \nDelivery of knowledge requirements for the basic, common and core units \nof competency specifically in the areas of mathematics, science/technology, \ncommunication/language and other academic subjects shall be contextualized. \nTo this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to \ninclude green technology, issues on health and drugs and catering to persons \nwith disabilities (PWD’s) to accompany their curricula. \n \nCourse Title: 3D Animation \n \n \nNC Level: NC III \n \nNominal Training Duration: \n68 hrs – Basic Competencies \n \n \n \n \n \n 28 hrs – Common Competencies \n \n \n \n \n \n 1,004 hrs– Core Competencies \n \n \n \n \n \n________________ \n \n \n \n \nTotal 1,100 hrs \n \nCourse Description: \n \n \nThis course is designed to develop & enhance the knowledge, skills, & \nattitudes of a 3D Animator in accordance with animation industry standards. It \ncovers the basic & common competencies in addition to the core competencies \nsuch as to produce key drawings for animation, create 3D digital animation and \nto use an authoring tool to create an interactive sequence. \n \nThe nominal duration of 1,100 hours covers the required units at 3D \nAnimation NC III. TVET providers can however, offer a longer, ladderized course \ncovering the NC III basic, common and core units. \n \nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 71 ---\n____________________________________________________________________________________ 67 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nBASIC COMPETENCIES \n(64 hours) \n \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n1. Lead workplace \ncommunication \n1.1. Communicate \ninformation \nabout workplace \nprocesses \n• Lecture and discussion on: \no Effective verbal communication methods \no Sources of information \n• Practice organizing information \n• Identify organization requirements for written and \nelectronic communication methods \n• Follow organization requirements for the use of written \nand electronic communication methods \n• Perform exercises on understanding and conveying \nintended meaning scenario \n• Lecture \n• Demonstration \n• Practical \nexercises \n• Demonstration \n• Role Play \n• Written Test \n• Observation \n2 Hours \n1.2. Lead workplace \ndiscussions \n• Lecture and discussion on: \no Organizational policy on production, quality and \nsafety \no Goals/ objectives and action plan setting \n• Read effective verbal communication methods \n• Prepare/set action plans based on organizational goals \nand objectives \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written Test \n• Observation \n2 Hours \n1.3. Identify and \ncommunicate \nissues arising in \nthe workplace \n• Lecture and discussion on: \no Organizational policy in dealing with issues and \nproblems \n• Read effective verbal communication methods \n• Practice organizing information \n• Perform exercises on understanding and conveying \nintended meaning scenario \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written Test \n• Observation \n2 Hours \n2. Lead small \nteam \n2.1. Provide team \nleadership \n• Lecture and discussion on: \no Company policies and procedures \n• Identify client expectations \n• Practice team building skills \n• Perform exercises on communication skills required for \nleading teams \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours\n\n--- PDF PAGE 72 ---\n____________________________________________________________________________________ 68 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n2.2. Assign \nresponsibilities \n• Lecture and discussion on: \no Team member’s duties and responsibilities \n• Identify client expectations \n• Practice negotiating skills \n• Perform group exercises showing the skills and \ntechniques in promoting team building\n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n2.3. Set performance \nexpectations for \nteam members \n• Lecture and discussion on: \no Team member’s duties and responsibilities \no How performance expectations are set \n• Identify client expectations \n• Perform group exercises in setting individual target/ \nexpectation \n• Read instruction and requirements in up to date \ndissemination to members\n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Observation \n• Written \nexamination \n2 Hours \n2.4. Supervise team \nperformance \n• Discuss listening and treating individual team members \nconcern \n• Identify methods of Monitoring Performance \n• Perform group exercises showing the skills in \nmonitoring team performance \n \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n3. Develop and \npractice \nnegotiation \nskills \n3.1. Plan \nnegotiations \n• Lecture and discussion on: \no codes of practice and guidelines for the organization \no differences between content and process \n• Read: \no Organizations policy and procedures for negotiations \no Decision making and conflict resolution strategies \nprocedures \no Strategies to manage conflict \no Steps in negotiating process \n• Identify bargaining information \n• Apply strategies to manage process \n• Apply steps in negotiating process \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n4 hours \n3.2. Participate in \nnegotiations \n• Discuss/Describe the following strategies during \nnegotiation: \n• Group \nDiscussion \n• Oral \nevaluation \n4 Hours\n\n--- PDF PAGE 73 ---\n____________________________________________________________________________________ 69 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \no Decision making and conflict resolution strategies \nprocedures \no Problem solving strategies on how to deal with \nunexpected questions and attitudes during \nnegotiation \n• Practice the following scenarios in a group activity: \no Perform interpersonal skills to develop rapport with \nother parties \no Perform verbal communication and listening skill \no observation skills \no negotiation skills \n• Describe the Procedure in documenting negotiations \n• Apply a filing system in managing information \n• Demonstrate filing of documents \n• Case studies \n• Demonstration \n• Simulation/ Role \nplay \n• Observation \n4. Solve workplace \nproblems \nrelated to work \nactivities \n4.1. Identify the \nproblem \n \n• Discussion on Normal operating parameters & product \nquality \n• Identify & clarify the nature of problem \n• Read: \no Brainstorming \no Cause and effect diagrams \no PARETO analysis \no SWOT analysis \no GANT chart \no PERT CPM & graph \no SCATTERGRAMS \n• Apply observation, investigation and analytical \ntechniques in solving problem in the workplace \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n4.2. Determine \nfundamental \ncause of the \nproblem \n• Discussion on Teamwork and work allocation problem \n• Read: \no Using range of formal problem solving techniques \no Enterprise goals, targets and measures \no Enterprise quality, OHS and environmental \nrequirement \no Non-routine process and quality problems \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour\n\n--- PDF PAGE 74 ---\n____________________________________________________________________________________ 70 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n• Perform group exercises showing safety in emergency \nsituations and incidents \n• Identify & clarify the nature of problem \n• Select relevant equipment and operational processes \n4.3. Determine \ncorrect / \npreventive \naction \n• Discussion on principles of decision making strategies \nand techniques \n• Read: \no Evaluating the solution \no Devising the best solution \n• Perform group exercise how to implement the \ndeveloped plan to rectify a problem \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour \n4.4. Provide \nrecommendation \nto manager \n• Discuss industry codes and standards \n• Apply enterprise information systems and data collation \n• Prepare recommendation letter \n• Group \nDiscussion \n• Demonstration \n• Oral \nevaluation \n• Observation \n2 Hour \n5. Use \nmathematical \nconcepts and \ntechniques \n5.1. Identify \nmathematical \ntools and \ntechniques to \nsolve problems \n• Discussion on the four fundamental operation (addition, \nsubtraction, division, multiplication) \n• Read: \no Measurement system \no Precision and accuracy \no Basic measuring tools/devices \n• Apply mathematical computations \n• Demonstrate activities on: \no Use of calculator \no Use of different measuring tools \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour 