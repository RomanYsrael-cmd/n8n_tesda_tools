CPM & graph \no SCATTERGRAMS \n• Apply observation, investigation and analytical \ntechniques in solving problem in the workplace \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n4.2. Determine \nfundamental \ncause of the \nproblem \n• Discussion on Teamwork and work allocation problem \n• Read: \no Using range of formal problem solving techniques \no Enterprise goals, targets and measures \no Enterprise quality, OHS and environmental \nrequirement \no Non-routine process and quality problems \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour\n\n--- PDF PAGE 74 ---\n____________________________________________________________________________________ 70 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n• Perform group exercises showing safety in emergency \nsituations and incidents \n• Identify & clarify the nature of problem \n• Select relevant equipment and operational processes \n4.3. Determine \ncorrect / \npreventive \naction \n• Discussion on principles of decision making strategies \nand techniques \n• Read: \no Evaluating the solution \no Devising the best solution \n• Perform group exercise how to implement the \ndeveloped plan to rectify a problem \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour \n4.4. Provide \nrecommendation \nto manager \n• Discuss industry codes and standards \n• Apply enterprise information systems and data collation \n• Prepare recommendation letter \n• Group \nDiscussion \n• Demonstration \n• Oral \nevaluation \n• Observation \n2 Hour \n5. Use \nmathematical \nconcepts and \ntechniques \n5.1. Identify \nmathematical \ntools and \ntechniques to \nsolve problems \n• Discussion on the four fundamental operation (addition, \nsubtraction, division, multiplication) \n• Read: \no Measurement system \no Precision and accuracy \no Basic measuring tools/devices \n• Apply mathematical computations \n• Demonstrate activities on: \no Use of calculator \no Use of different measuring tools \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour \n5.2. Apply \nmathematical \nprocedures / \nsolution \n• Lecture and discussion on: \no Estimation \no Problem-based questions \no Mathematical techniques \n• Apply mathematical computations \n• Demonstrate activities on: \no Use of calculator \no Use of different measuring tools \no Use of mathematical tools and standard formulas \n• Lecture \n• Demonstration \n• Simulation/ Role \nplay \n• Written \nexamination \n• Observation \n4 Hours\n\n--- PDF PAGE 75 ---\n____________________________________________________________________________________ 71 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n5.3. Analyze results \n• Discussion on the four fundamental operation (addition, \nsubtraction, division, multiplication) \n• Read: \no Measurement system \no Precision and accuracy \no Basic measuring tools/devices \n• Apply mathematical computations \n• Demonstrate activities on: \no Use of calculator \no Use of different measuring tools \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n6. Use relevant \ntechnologies \n6.1. Identify \nappropriate \ntechnology \n• Discussion on company policy in relation to relevant \ntechnology \n• Read: \no Awareness on technology and its function \no Relevant technology application/ implementation \no Operating instructions \n• Practice basic communicatio