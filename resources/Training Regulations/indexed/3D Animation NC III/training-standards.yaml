  "source_section_text": "SECTION 3 TRAINING STANDARDS \n \nThese standards are set to provide technical and vocational education and \ntraining (TVET) providers with information and other important requirements to consider \nwhen designing training programs for 3D Animation NC III. \n \nThey include information on curriculum design; training delivery; trainee entry \nrequirements; tools and equipment; training facilities; and trainer’s qualification. \n \n \n3.1 \nCURRICULUM DESIGN \n \nTESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the \ncomponents mentioned below. \n \nDelivery of knowledge requirements for the basic, common and core units \nof competency specifically in the areas of mathematics, science/technology, \ncommunication/language and other academic subjects shall be contextualized. \nTo this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to \ninclude green technology, issues on health and drugs and catering to persons \nwith disabilities (PWD’s) to accompany their curricula. \n \nCourse Title: 3D Animation \n \n \nNC Level: NC III \n \nNominal Training Duration: \n68 hrs – Basic Competencies \n \n \n \n \n \n 28 hrs – Common Competencies \n \n \n \n \n \n 1,004 hrs– Core Competencies \n \n \n \n \n \n________________ \n \n \n \n \nTotal 1,100 hrs \n \nCourse Description: \n \n \nThis course is designed to develop & enhance the knowledge, skills, & \nattitudes of a 3D Animator in accordance with animation industry standards. It \ncovers the basic & common competencies in addition to the core competencies \nsuch as to produce key drawings for animation, create 3D digital animation and \nto use an authoring tool to create an interactive sequence. \n \nThe nominal duration of 1,100 hours covers the required units at 3D \nAnimation NC III. TVET providers can however, offer a longer, ladderized course \ncovering the NC III basic, common and core units. \n \nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 71 ---\n____________________________________________________________________________________ 67 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nBASIC COMPETENCIES \n(64 hours) \n \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n1. Lead workplace \ncommunication \n1.1. Communicate \ninformation \nabout workplace \nprocesses \n• Lecture and discussion on: \no Effective verbal communication methods \no Sources of information \n• Practice organizing information \n• Identify organization requirements for written and \nelectronic communication methods \n• Follow organization requirements for the use of written \nand electronic communication methods \n• Perform exercises on understanding and conveying \nintended meaning scenario \n• Lecture \n• Demonstration \n• Practical \nexercises \n• Demonstration \n• Role Play \n• Written Test \n• Observation \n2 Hours \n1.2. Lead workplace \ndiscussions \n• Lecture and discussion on: \no Organizational policy on production, quality and \nsafety \no Goals/ objectives and action plan setting \n• Read effective verbal communication methods \n• Prepare/set action plans based on organizational goals \nand objectives \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written Test \n• Observation \n2 Hours \n1.3. Identify and \ncommunicate \nissues arising in \nthe workplace \n• Lecture and discussion on: \no Organizational policy in dealing with issues and \nproblems \n• Read effective verbal communication methods \n• Practice organizing information \n• Perform exercises on understanding and conveying \nintended meaning scenario \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written Test \n• Observation \n2 Hours \n2. Lead small \nteam \n2.1. Provide team \nleadership \n• Lecture and discussion on: \no Company policies and procedures \n• Identify client expectations \n• Practice team building skills \n• Perform exercises on communication skills required for \nleading teams \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours\n\n--- PDF PAGE 72 ---\n____________________________________________________________________________________ 68 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n2.2. Assign \nresponsibilities \n• Lecture and discussion on: \no Team member’s duties and responsibilities \n• Identify client expectations \n• Practice negotiating skills \n• Perform group exercises showing the skills and \ntechniques in promoting team building\n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n2.3. Set performance \nexpectations for \nteam members \n• Lecture and discussion on: \no Team member’s duties and responsibilities \no How performance expectations are set \n• Identify client expectations \n• Perform group exercises in setting individual target/ \nexpectation \n• Read instruction and requirements in up to date \ndissemination to members\n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Observation \n• Written \nexamination \n2 Hours \n2.4. Supervise team \nperformance \n• Discuss listening and treating individual team members \nconcern \n• Identify methods of Monitoring Performance \n• Perform group exercises showing the skills in \nmonitoring team performance \n \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n3. Develop and \npractice \nnegotiation \nskills \n3.1. Plan \nnegoti