graph \no SCATTERGRAMS \n• Apply observation, investigation and analytical \ntechniques in solving problem in the workplace \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n4.2. Determine \nfundamental \ncause of the \nproblem \n• Discussion on Teamwork and work allocation problem \n• Read: \no Using range of formal problem solving techniques \no Enterprise goals, targets and measures \no Enterprise quality, OHS and environmental \nrequirement \no Non-routine process and quality problems \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour\n\n--- PDF PAGE 74 ---\n____________________________________________________________________________________ 70 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n• Perform group exercises showing safety in emergency \nsituations and incidents \n• Identify & clarify the nature of problem \n• Select relevant equipment and operational processes \n4.3. Determine \ncorrect / \npreventive \naction \n• Discussion on principles of decision making strategies \nand techniques \n• Read: \no Evaluating the solution \no Devising the best solution \n• Perform group exercise how to implement the \ndeveloped plan to rectify a problem \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour \n4.4. Provide \nrecommendation \nto manager \n• Discuss industry codes and standards \n• Apply enterprise information systems and data collation \n• Prepare recommendation letter \n• Group \nDiscussion \n• Demonstration \n• Oral \nevaluation \n• Observation \n2 Hour \n5. Use \nmathematical \nconcepts and \ntechniques \n5.1. Identify \nmathematical \ntools and \ntechniques to \nsolve problems \n• Discussion on the four fundamental operation (addition, \nsubtraction, division, multiplication) \n• Read: \no Measurement system \no Precision and accuracy \no Basic measuring tools/devices \n• Apply mathematical computations \n• Demonstrate activities on: \no Use of calculator \no Use of different measuring tools \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour \n5.2. Apply \nmathematical \nprocedures / \nsolution \n• Lecture and discussion on: \no Estimation \no Problem-based questions \no Mathematical techniques \n• Apply mathematical computations \n• Demonstrate activities on: \no Use of calculator \no Use of different measuring tools \no Use of mathematical tools and standard formulas \n• Lecture \n• Demonstration \n• Simulation/ Role \nplay \n• Written \nexamination \n• Observation \n4 Hours\n\n--- PDF PAGE 75 ---\n____________________________________________________________________________________ 71 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n5.3. Analyze results \n• Discussion on the four fundamental operation (addition, \nsubtraction, division, multiplication) \n• Read: \no Measurement system \no Precision and accuracy \no Basic measuring tools/devices \n• Apply mathematical computations \n• Demonstrate activities on: \no Use of calculator \no Use of different measuring tools \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n6. Use relevant \ntechnologies \n6.1. Identify \nappropriate \ntechnology \n• Discussion on company policy in relation to relevant \ntechnology \n• Read: \no Awareness on technology and its function \no Relevant technology application/ implementation \no Operating instructions \n• Practice basic communication skill in a group activity \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Simulation/ Role \nPlay \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour \n6.2. Apply relevant \ntechnology \n \n• Discussion on different management concepts \n• Read: \no Relevant technology application/ implementation \no Technology adaptability \no Different management concepts \no Health and safety procedure \no Communication techniques \no Apply software applications skills \n• Practice drills on installing application software \n•Practice basic communication skill in a group activity\n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Simulation/ Role \nPlay \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n4 Hours \n6.3. Maintain/ \nenhance \nrelevant \ntechnology \n• Lecture and discussion on: \no Repair and maintenance procedure \no Operating instructions \n• Practice drills: \no Installing application software \no Basic troubleshooting skills\n• Lecture \n• Demonstration \n• Simulation/ Role \nPlay \n• Written \nexamination \n• Observation \n2 Hours\n\n--- PDF PAGE 76 ---\n____________________________________________________________________________________ 72 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n7. Apply critical \nthinking and \nproblem solving \ntechniques in \nthe workplace \n7.1. Identify the \nproblem \n• Lecture and discussion on \no Processes, normal operating parameters, and product \nquality to recognize nonstandard situations \no Enterprise goals, targets and measures \no Analytical techniques \no Types of problems \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n \n2 Hours \n7.2. Determine \nfundamental \ncauses of the \nproblem \n• Lecture and collaboration on \no Root cause of the problem \no Problem solving tools \n• Exercise on cause and effect \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n• Observation \n2 Hours \n7.3. Determine \ncorrective action\n• Lecture and discussion on \no Identification and analysis of possible options for \nproblem resolution \no Corrective actions \no Principles of decision making strategies and \ntechniques \n•Layouting of action plans\n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n• Observation \n2 Hours \n7.4. Provide \nrecommendatio\nn/s to manager \n• Using range of formal problem solving techniques \n• Preparation and presentation of sample recommendation \nreport \n \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n•Presentation \n2 Hours \n8. Use information \ncreatively and \ncritically \n8.1. Use technical \ninformation \nsystems and \ninformation \ntechnology \n• Lecture and discussion on: \no Application in collating information \no Procedures for inputting, maintaining and archiving \ninformation \no Guidance to people who need to find and use \ninformation \n• Organizing information into a suitable form for reference \nand use \n• Classify stored information for identification and retrieval \n• Operate the technical information system by using \nagreed procedures \n• Lecture \n• Group \nDiscussion \n• Self-paced \nhandout/ module \n• Hands on \n• Demonstration \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n \n4 Hours\n\n--- PDF PAGE 77 ---\n____________________________________________________________________________________ 73 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n8.2. Apply \ninformation \ntechnology (IT) \n• Lecture and discussion on: \no Attributes and limitations of available software tool \no Procedures and work instructions for the use of IT \no Operational requirements for IT systems \no Sources and flow paths of data \no Security systems and measures that can be used \no Methods of entering and processing information \n• Use procedures and work instructions for the use of IT \n• Extract data and format reports \n• Use WWW applications \n• Lecture \n• Group \nDiscussion \n• Self-paced \nhandout/ module \n• Hands on \n• Demonstration \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n \n2 Hours \n8.3. Edit, format and \ncheck \ninformation \n• Lecture and discussion on: \no Basic file-handling techniques \no Techniques in checking documents \no Techniques in editing and formatting \no Proof reading techniques \n• Use different techniques in checking documents \n• Edit and format information applying different techniques \n• Proof read information applying different techniques \n \n• Lecture \n• Group \nDiscussion \n• Self-paced \nhandout/ \nmodule \n• Hands on \n• Demonstration \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n \n2 Hours \n9. Work in a \ndiverse \nenvironment \n9.1. Develop an \nindividual’s \ncultural \nawareness and \nsensitivity \n• Lecture and discussion on: \no Enterprise policies and core values \no Awareness on individual cultures and world geography \no Different methods of verbal and non-verbal \ncommunication in a multicultural setting \no Workplace Diversity Policy \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n2 hrs \n9.2. Work effectively \nin an \nenvironment \nthat \nacknowledges \nand values \ncultural diversity \n• Lecture and discussion on: \no The value of diversity in the economy and society in \nterms of Workforce development \no Innovation \no Social justice \no Customer service excellence \no Teamwork and collaboration \n• Applying strategies for customer service excellence \n \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n \n2 hrs\n\n--- PDF PA