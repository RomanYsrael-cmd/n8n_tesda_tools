rform backup of computer files \n• Enumerate and define different types of \ncomputer viruses \n• Demonstration \n• Simulation \n• Modular \n• Video clips \n• Computer based \ntraining (e-\nlearning) \n \n• Written/Oral \nexamination \n• Practical \ndemonstration \n \n \n2 hours\n\n--- PDF PAGE 82 ---\n____________________________________________________________________________________ 78 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nCORE COMPETENCIES \n(1,004 hours) \n \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nApproach\nNominal \nDuration\n1. Create \n3D Models for \nAnimation \n \n \n1.1. Identify 3D Modeling \nrequirements \n \n• Identify design brief, and creative and \ntechnical requirements including \nproduction specifications and references \nwith relevant personnel. \n \n• Identify and prepare all necessary \nequipment and required peripherals to be \nused according to task to be undertaken. \n \n• Identify soundtrack requirements for lip \nsynch purposes and discuss with relevant \npersonnel. \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n \n \n• Practical Exam \n• Interviews/ \nQuestioning \n• Presentation \n• Hands-on \ndemonstration \n \n8 hours \n \n \n1.2 Identify and select 3D \nanimation software \n \n \n \n \n• Identify range of industry standard 3D \nanimation software including computer-\nassisted techniques for suitability. \n \n• Select appropriate 3D animation software \nto be used in consultation with the \nappropriate personnel to ensure that \noutput met requirements. \n \n• Produce selected 3D animation software \nin accordance with the specified delivery \nplatform. \n \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n• Interviews / \n• Questioning \n• Presentation \n• Hands-on \ndemonstration \n4 hours\n\n--- PDF PAGE 83 ---\n____________________________________________________________________________________ 79 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nApproach\nNominal \nDuration\n \n1.3. Create 3D models and \nimages \n• Prepare appropriate tools and features of \nthe selected program and apply to meet \ncreative and technical requirements. \n• Import and set up hand drawn images of \ncharacter, props and background based \non the approved creative and technical \nrequirements by the relevant personnel. \n• Create model and set-up environment \nlayout for 3D production as appropriate to \nthe required 3D models, based on \nconcept design and model sheet. \n• Model different kinds of 3D characters, \nprops and simple background for \nproduction based on design brief and \ncreative. \n• Complete 3D Models produced with \nrelevant details from technical \nrequirements and specifications. \n• Produce clean mesh of 3D Model’s \ntopology and edge flow based on model \nsheet and concept design. \n• Comply produced 3D model with the \ndesign provided in the model sheet. \n• Label properly naming convention based \non parts and details. \n• Group and organize 3D model parts \nbased on hierarchies. \n• Use the computer workstation correctly \nand meet Occupational Safety and Health \nStandards and Environmental Health and \nSafety Management. \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Written exam \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n118 hours\n\n--- PDF PAGE 84 ---\n____________________________________________________________________________________ 80 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nApproach\nNominal \nDuration\n1.4. Unwrap topology \n• Identify projection mapping based on \ndesign specification and 3D model \nprovided. \n• Cut and divide seam in accordance to \ntexture assignment \n• Unfold seam in texture editor \n• Export UV layout from texture editor \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n40 hours \n1.5. Edit/revise 3D Models \n \n• Make 3D models checked and corrected \nand then show to relevant personnel. \n• Clearly label character, props and \nbackgrounds. \n• Identify clearly and store securely and \nsafely all 3D Models in accordance with \ncompany procedures. \n• Use the computer workstation correctly \nand meet the Occupational Safety and \nHealth Standards and Environmental \nHealth and Safety Management \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n70 hours \n2. Apply shader and \ntexture on 3D \nmodels \n \n2.1. Identify 3Dshading \nand texturing \nrequirements \n \n• Identify all 3D Texturing technical \nrequirements including production \nspecifications and discuss with relevant \npersonnel based on the creative \nrequirements \n• Identify texturing tools and techniques \nrelevant to the 3D Models, creative and \ntechnical requirements \n• Identify and prepare all required \nperipherals and equipment to be used \naccording to task to be undertaken. \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Written exam \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n8 hours \n \n2.2. Gather different \ntexture references \n• Determine creative and technical \nrequirements to the specific 3D Models \nfor texturing purposes. \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n16 hours\n\n--- PDF PAGE 85 ---\n____________________________________________________________________________________ 81 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nApproach\nNominal \nDuration\n• Gather or simulated texture references \nand sources based on approved design. \n• Use photo editing software and required \nperipherals for modifying textures \n \n• Actual \ndemonstration \n● Hands-on \ndemonstration \n \n2.3. Create UV Mapping \nand shading \n• Identify and apply appropriate tools and \nfeatures of the selected program to meet \ncreative and technical requirements. \n• Provide model and set-up environment \nlayout for 3D production as appropriate to \nthe required 3D Texture and lighting. \n• Use texture editor to project UV mapping \nbased on the form and shape of the \napproved 3D Model. \n• Identify Hypershade or Material editor to \napply different node materials on 3D \nModels based on the design. \n• Apply seamless and not stretched or \ndeformed 2D and 3D texture on the \nsurface. \n• Apply pre-defined textures using texture \nmapping parameters as required. \n• Use photo editing software as cross \nplatform image transfer for editing \nselected texture image to achieve precise \ntexture on the Model. \n• Render images with proper lighting to \npreview the effect of pre-defined texture \napplied on the 3D Model. \n• Prepare back-ups of texture images, then \nlabel and store in accordance with \ncompany procedures and industry \nstandards of documentation. \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n46 hours\n\n--- PDF PAGE 86 ---\n____________________________________________________________________________________ 82 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nApproach\nNominal \nDuration\n2.4. Create texture map \n• Identify and apply tools and features of \nthe selected program to meet creative \nand technical requirements. \n• Set-up models for texture and lighting \n• Export UV map to image editing software \nfor creating texture in accordance to \nprecise detail and specification. \n• Apply pre-defined images as texture \nusing texture mapping parameters as \nrequired based on design \n• Render test images with proper lighting to \npreview the effect of pre-defined texture \napplied on the 3D Model. \n• Prepare, label and store back-ups of \ntexture images in accordance with \ncompany procedures and industry \nstandards of documentation. \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n40 hours \n2.5. Test and evaluate 3D \nTextures \n• Ensure 3D Texture cross platform image \ntransfers and interface calibration to meet \nthe requirements of technical and creative \nspecifications. \n• Use UV texture mapping test to check \ndistortions on 3D surface. \n• Use proper lighting to render 3D models \nwith applicable textures are presented to \nrelevant personnel for review, comments \nand recommendations for the scene \nenvironment. \n• Discuss identified changes if any, with the \nrelevant personnel and incorporate \nagreements to the prepared models and \ntexture.\n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n40 hours\n\n--- PDF PAGE 87 ---\n____________________________________________________________________________________ 83 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nApproach\nNominal \nDuration\n• Use photo editing software to revise and \nrefine image texture. \n• Obtain final agreement and approval from \nrelevant personnel for the final rendered \nmodels with texture. \n• Integrate animated objects or characters \nwith texture into static or moving \nbackgrounds for testing texture precision \non the topology. \n \n3. Set Character \nRigging \n \n3.1. Identify 3D model \ncharacterization \n \n• Identify and group moving parts of 3D \nModel into sections based on approved \ndesign. \n• Attitude and behavior are assigned to 3D \nModel parts based on approved design. \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n4 hours \n \n3.2. Gather 3D model \naction references \n• Gather or simulated dynamic character \nreferences based on approved design. \n• Determine movement constraints based \non physical limitations. \n• Store and label different animation \nreferences properly. \n \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n8 hours\n\n--- PDF PAGE 88 ---\n____________________________________________________________________________________ 84 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nApproach\nNominal \nDuration\n3.3. Create joints for 3D \nmodels \n• Apply joint placement, translation, scale, \nand orientation on approved 3D Model. \n• Apply joint parenting with hierarchical \nstructure \n• Clearly label naming convention system \nfor joints. \n• Simplify, label and place properly control \nobjects created on corresponding joints. \n• Assign specific constraints and apply to \ncontrollers and target object/s. \n• Test rig for performance of model integrity \nand movement. \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n150 hours\n \n3.4. Create blend shapes/ \nmorph shapes \n• Quantify number of polygons and check \nfor consistency. \n• Create assets of blend /morph shapes \nbased on approved 3D model. \n• Assign assets of blend /morph shapes to \nrigged model. \n• Test assets of blend /morph shapes for \nmovements. \n• Maintain model design during \nmodification. \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n16 hours \n \n3.5. Bind skin to rigged \njoints \n• Apply skin weight mapping to 3D Model. \n• Test geometry for model integrity. \n• Edit skin weights to correct value \ndistribution. \n• Perform final testing in preparation for \nanimation process. \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n52 hours \n \n4. Animate Character\n \n4.1. Gather action \nreferences \n \n• Gather and obtain source references and \nassets relevant to model behavioral \ndescription. \n• Discuss animation style movement and \nstoryboard with relevant personnel. \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n16 hours\n\n--- PDF PAGE 89 ---\n____________________________________________________________________________________ 85 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nApproach\nNominal \nDuration\n• Include technical parameters based on \nproject descriptions. \n• Actual \ndemonstration \n \n4.2. Create key poses \n• Create key poses and expressions and \nplace strategically in the animation \ntimeline according to scene duration. \n• Apply the 12 principles of animation as \nper scene requirements. \n• Evaluate key poses and adjust for clarity \nin accordance to storyboard description. \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n50 \n \n4.3. Adjust and Edit timing \n• Apply initial movement based on \nstoryboard. \n• Apply lip-synching action based on \ndialogue soundtrack. \n• Apply objects with sound effects based on \nstoryboard. \n• Provide breakdowns to enhance \nanimation movement. \n• Edit in-betweens using animation \nprinciples to smoothen the flow of \nmovement. \n• Adjust action poses in relation with other \nelements involved in the scene. \n• Test and edit result of movements in \naccordance to scene duration \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n150 \n \n4.4. Create Animation \npreview \n• Set appropriate camera view for the \nscene. \n• Set playback speed in real time according \nto project frame rate requirement. \n• Set preferences for the hardware \nrenderer. \n• Determine video file format according to \nproject requirements. \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n16\n\n--- PDF PAGE 90 ---\n____________________________________________________________________________________ 86 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nApproach\nNominal \nDuration\n• Render and preview hardware test. \n• Acquire final approval of test preview from \nrelevant personnel. \n• Save approved scenes and submit to \ndesignated production personnel. \n \n5. Light and render \nanimation scene \n \n5.1. Identify rendering \nspecifications \n• Determine software renderer for the \nproject. \n• Set or import render settings in the render \nproperties. \n• Check if there are additional rendering \nrequirements needed in the scene.\n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n8 hours \n5.2. Assemble scene \nelements \n• Open the final animated scene file for \nassembly based on the storyboard with \naudio file. \n• Gather all relevant objects into the scene \nfrom project library and production assets.\n• Arrange all scene elements based on the \nstoryboard.\n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n8 hours \n5.3. Add light sources to the \nscene \n• Identify Types of light source/s for proper \n• Position light source/s based on scene \nrequirements \n• Preview lit scene and check based on \nscene requirements \n• Edit light source/s based on revision \nnotes. \n• Render partial frame/s from scene for \nquality checks based project \nrequirements. \n• Acquire final approval from relevant \npersonnel based on company policies. \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n40 hours\n\n--- PDF PAGE 91 ---\n____________________________________________________________________________________ 87 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nApproach\nNominal \nDuration\n5.4. Plan and establish \neffective rendering \nprocedures. \n• Check rendering schedules for hardware \nresources availability. \n• Identify production requirements for post-\nproduction editing. \n• Determine hardware limitations and \nbalance for production efficiency. \n• Manage color profile for consistency with \npost production output specifications. \n \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n8 hours \n5.5. Perform full software \nrender of animation \nscene or sequence \n• Calculate estimated render times per \nscene based on scene duration. \n• Assign the scene to a production \nrendering schedule. \n• Execute the final software rendering on \nthe designated rendering schedule. \n• Save and store the final rendered scene \nthen submit to relevant personnel. \n \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n8 hours \n5.6. Post edit rendered \nscenes \n• Import the final rendered scene files from \nthe project pipeline into a video \ncompositing software. \n• Compose the files and enhance \naccording to design brief. \n• Render a draft for preview based on the \nscene duration \n• Acquire final approval from relevant \npersonnel. \n• Execute a final quality render and store in \nthe production pipeline \n \n• Lecture \n• Discussion \n• Viewing \nMultimedia \n• Actual \ndemonstration \n● Practical Exam \n● Interviews / \nQuestioning \n● Presentation \n● Hands-on \ndemonstration \n \n80 hours\n\n--- PDF PAGE 92 ---\n____________________________________________________________________________________ 88 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \n \n3.2 \nTRAINING DELIVERY \n \n1. The delivery of training shall adhere to the design of the curriculum. Delivery \nshall be guided by the principles of competency-based TVET. \n \na. Course design is based on competency standards set by the industry or \nrecognized industry sector; (Learning system is driven by competencies \nwritten to industry standards) \nb. Training \ndelivery \nis \nlearner-centered \nand \nshould \naccommodate \nindividualized and self-paced learning strategies; \nc. Training can be done on an actual workplace setting, simulation of a \nworkplace and/or through adoption of modern technology. \nd. Assessment is based in the collection of evidence of the performance of \nwork to the industry required standards; \ne. Assessment of competency takes the trainee’s knowledge and attitude into \naccount but requires evidence of actual performance of the competency as \nthe primary source of evidence. \nf. Training program allows for recognition of prior learning (RPL) or current \ncompetencies; \ng. Training completion is based on satisfactory completion of all specified \ncompetencies not on the specified nominal duration of learning. \n \n2. The competency-based TVET system recognizes various types of delivery \nmodes, both on-and off-the-job as long as the learning is driven by the \ncompetency standards specified by the industry. The following training \nmodalities and their variations/components may be adopted singly or in \ncombination with other modalities when designing and delivering training \nprograms: \n \n2.1 Institution- Based: \n \n• Dual Training System (DTS)/Dualized Training Program (DTP) which \ncontain both in-school and in-industry training or fieldwork components. \nDetails can be referred to the Implementing Rules and Regulations of \nthe DTS Law and the TESDA Guidelines on the DTP; \n \n• Distance learning is a formal education process in which majority of the \ninstruction occurs when the students and instructor are not in the same \nplace. Distance learning may employ correspondence study, audio, \nvideo, computer technologies or other modern technology that can be \nused to facilitate learning and formal and non-formal training. Specific \nguidelines on this mode shall be issued by the TESDA Secretariat. \n \n• The traditional classroom-based or in-center instruction may be \nenhanced through use of learner-centered methods as well as \nlaboratory or field-work components.\n\n--- PDF PAGE 93 ---\n____________________________________________________________________________________ 89 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \n2.2 Enterprise-Based: \n \n• Formal Apprenticeship – Training within employment involving a \ncontract between an apprentice and an enterprise on an approved \napprenticeable occupation. \n \n• Informal Apprenticeship - is based on a training (and working) \nagreement between an apprentice and a master craftsperson wherein \nthe agreement may be written or oral and the master craftsperson \ncommits to training the apprentice in all the skills relevant to his or her \ntrade over a significant period of time, usually between one and four \nyears, while the apprentice commits to contributing productively to the \nwork of the business. Training is integrated into the production process \nand apprentices learn by working alongside the experienced \ncraftsperson. \n \n• Enterprise-based Training- where training is implemented within the \ncompany in accordance with the requirements of the specific company. \nSpecific guidelines on this mode shall be issued by the TESDA \nSecretariat. \n \n2.3 Community-Based: \n \n• Community-Based Training – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other \nTVET providers which are intended to address the specific needs of a \ncommunity. Such programs can be conducted in informal settings such \nas barangay hall, basketball courts, etc. These programs can also be \nmobile training program (MTP). \n \n \n \n \n3.3 \nTRAINEE ENTRY REQUIREMENTS \n \nThe trainees who wish to enter the course should possess the following \nrequirements: \n• Must \nhave \ncertificate \nof \nemployment \nand/or \nendorsement \nfrom \nstudio/employer, for industry practitioner \n• Must have NC or either COC-1 or COC-2 of Animation NC II, for non-industry \npractitioner \n• Must pass creative skills qualifying test given by institution \n• Must be knowledge of at least one (1) graphic software \n \nThis list does not include specific institutional requirements such as \neducational attainment, appropriate work experience and others that may be \nrequired from the trainees by the school or training center delivering the TVET \nprogram.\n\n--- PDF PAGE 94 ---\n____________________________________________________________________________________ 90 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS \n \nRecommended list of tools, equipment and materials for the conduct of training in \n3D Animation NC III: \n \nTOOLS \nEQUIPMENT \nMATERIALS \nQty\nDescription\nQty.\nDescription\nQty.\nDescription\n21 \nOperating system - \nminimum required \nversion \nrecommended in \nthe 3D software \n21 \nunits \nComputer desktop (with \nkeyboard and 3-button \nmouse) - minimum \nhardware specification as \nrecommended in the 3D \nsoftware and AVR\n2 \nreams \nTypewriting \npaper \n1 \nInternet Access \n \n \n \n21 \nunits \nErgonomic computer \ntables \n1 \ndozen \nWhiteboard \nmarker \n(assorted colors)\n21 \nunits\nChairs \n2 pcs \nWhiteboard \neraser\n1 unit\nLCD Projector \n2 \nboxes\nLead pencil \n21 \nAny of the following \n3D Software*: \n - Maya \n - 3D Studio max \n - Softimage \n - Lightwave \n - Maxxon \nCinema 4D \n - Blender \n1 unit\nPrinter \n1 box \neraser \n1 unit\nScanner \n1 pc \nsharpener \n1 unit\nSpeakers \n \n \n21 \nAny of the following \ngraphics software*: \n- Adobe \nPhotoshop \n- PaintTool SAI \n- Manga Studio \n- Corel Draw \n- Paint Shop \n21\nPen Tablet\n21\nEarphones\n1\nDigital Camera\n1\nWhiteboard 4’ X 8’\n* Can be either educational, license and open-source software \n \nIn cases where there are specialized tools, equipment and facilities that are \nnot generally considered standard requirements or not absolute requisites for training, \nthe industry working group or TESDA may provide guidelines or specific advice on \nsuch matters.\n\n--- PDF PAGE 95 ---\n____________________________________________________________________________________ 91 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \n3.5 TRAINING FACILITIES \n \n Based on class size of 20 students/trainees the space requirements for \n \nthe teaching/learning and circulation areas are as follows: \n \nTEACHING/LEARNING \nAREAS \nSIZE IN \nMETERS \nAREA IN SQ. \nMETERS \nQTY\nTOTAL AREA IN \nSQ. METERS \nLecture Area \n5 x 8 \n40 \n1 \n40 \nLearning Resource Area \n3 x 5 \n15 \n1 \n15 \nWash ,Toilet & Locker Room \n2 x 2 \n4 \n2 \n8 \nTotal \n63 \nFacilities / Equipment / Circulation** \n20 \nTotal Area \n83 \n \n** Area requirement is equivalent to 30% of the total teaching/learning areas \n \nAppropriate consideration should be given in providing and allocating work space, \ncommunications facilities, and the usual workplace amenities to ensure a proper learning \nenvironment. Where applicable, training shall be held or conducted in learning facilities in \naccordance with generally accepted industry standards and practice. \n \n \n \n3.6 TRAINERS QUALIFICATIONS FOR 3D ANIMATION NC III \n \n● \nMust be a holder of National TVET Trainer Certificate (NTTC) level I in 3D \nAnimation NC III; \n● \nMust have at least five (5)-years animation production industry experience \nwithin the last 7 years \n \n \n \n3.7 \nINSTITUTIONAL ASSESSMENT \n \nInstitutional assessment is undertaken by trainees to determine their \nachievement of units of competency. A certificate of achievement is issued for \neach unit of competency. The institutional assessment is administered by the \ntrainer/assessor. \n \n \n \nThe result of the institutional assessment may be considered as evidence for \nthe assessment for national certification.\n\n--- PDF PAGE 96 ---\n____________________________________________________________________________________ 92 \nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018 \nSECTION 4. ASSESSMENT AND CERTIFICATION ARRANGEMENT \n \n \nCompetency Assessment is the process of collecting evidence and making \njudgments whether competency has been achieved. The purpose of assessment is \nto confirm that an individual can perform to the standards expected at the workplace \nas expressed in relevant competency standards. \n \nThe assessment process is based on evidence or information gathered to \nprove achievement of competencies. The process may be applied to an \nemployable unit(s) of competency in partial fulfillment of the requirements of the \nnational qualification."
