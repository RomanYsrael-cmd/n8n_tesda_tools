  "source_text": "SECTION 4. NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of 3D Animation NC III, the\ncandidate must demonstrate competence in all the units listed in\nSection 1. Successful candidates shall be awarded a National\nCertificate III level signed by the TESDA Director-General.\n\n4.2\nThe qualification of 3D Animation NC III may be attained through:\n4.2.1\nAccumulation of Certificates of Competency (COCs) in all the\nfollowing units of competencies:\n\nCOC-1. Create 3D Models for Animation\nCOC-2. Apply 3D Texture and Lighting on 3D Models\nCOC-3. Set Character Rigging\nCOC-4. Animate Character\nCOC-5. Composite and Render Animation Scene\nSuccessful candidates shall be awarded a Certificate of\nCompetency (COC) in each of the core units.\n\n4.3\nUpon accumulation and submission of all COCs acquired for all the\nrelevant units of competency comprising this qualification, an individual\nshall be issued the corresponding National Certificate.\n\n4.4\nAssessment shall cover all competencies, with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.5\nAny of the following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non-formal and informal including\nenterprise-based training programs.\n4.5.2 Experienced workers (wage employed or self-employed)\n\n--- PDF PAGE 97 ---\n____________________________________________________________________________________ 93\nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018\n\n4.6\nExisting National Certificates (NCs) and Certificates of Competency\n(COCs) of individuals in 3D Animation NCIII shall continue to be in\neffect until the said NCs and COCs will have expired. Individuals are\nadvised to take the assessment for this amended/updated TR on or\nbefore the expiration of such certificates.\n\n4.7\nThe guidelines on assessment and certification are discussed in detail\nin the \"Operating Procedures on Assessment and Certification\" and\n\"Guidelines on the Implementation of the Philippine TVET Competency\nAssessment and Certification System (PTCACS)\".\n\n4.1. COMPETENCY ASSESSMENT REQUISITE\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior to assessment.\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited\nby TESDA is authorized to manage the assessment activities of\ncandidates for national certification.\n4.2.3 Accredited Competency Assessor. Only competency assessor\naccredited by TESDA is authorized to assess the competencies of\ncandidates for national certification.\n\n--- PDF PAGE 98 ---\n____________________________________________________________________________________ 94\nTR – 3D ANIMATION NC II (Version 02) Amended February 27, 2018\n"
}
