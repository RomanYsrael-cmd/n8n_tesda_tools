  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\n ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s)\nof competency in partial fulfillment of the requirements of the national qualification.\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the National Qualification of\nFOOD PRODUCTION\n(PROFESSIONAL COOKERY) NC IV, the candidate must demonstrate\ncompetence in all the units of competency listed in Section l following the\ngroup or cluster of Core Competencies:\n\nCOC 1 Plan, Prepare and Serve Complex and Specialty foods\n•\nDesign meals to meet special dietary, religious and cultural\nrequirements\n•\nDesign menus to meet specific market requirements\n•\nManage food production operations for catering\n•\nManage bakery and patisserie production for catering\nCOC 2 Plan and Manage Catering for an Event or Function\n•\nSelect catering systems\n•\nDesign meals to meet special dietary, religious and cultural\nrequirements\n•\nDesign menus to meet specific market requirements\n•\nPrepare catering tenders\n•\nPlan and manage menu-based catering for an event or function.\n•\nManage food production operations for catering\n•\nManage bakery and patisserie production for catering\n•\nMonitor catering costs and revenues\nCOC 3 Plan and Implement a Food Safety Program\n•\nDevelop a food safety program\n•\nImplement Safety, Health, Environmental, and Sustainable\nPolicies and Procedures\n\n--- PDF PAGE 264 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n260\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.1.2 Upon accumulation and submission of all COCs acquired, an individual shall\nbe issued the corresponding National Certificate\n\n4.1.3 Individuals wanting to be certified will have to be assessed in accordance with\nthe requirements identified in the evidence guide of the relevant unit/s of\ncompetency.\n\n4.1.4 Assessment shall cover all the competencies of the qualification with the basic\nand common units integrated or assessed concurrently with the core units of\ncompetency.\n\n4.1.5 The following are qualified to apply for assessment and certification:\n• Graduates of formal, non-formal and informal institutions and enterprise-\nbased training programs\n• Experienced Workers (wage employed or self-employed)\n\n4.1.6 For the renewal of valid or expired National Certificate (NC) or Certificate of\nCompetency (COC) under Commercial Cooking NC IV will have to undergo\nassessment in the amended TR for Food Production (Professional Cookery)\nNC IV.\n\n4.1.7 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through competency\nassessment.\n\n4.1.8 The industry shall determine assessment and certification requirements for\neach qualification with promulgated Training Regulations: It includes the\nfollowing:\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\nindustry\n\n--- PDF PAGE 265 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n261\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only TESDA Accredited Assessment\nCenters are authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited Competency Assessor. Only an accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of accreditation\nprocedure before they are authorized by TESDA to assess the\ncompetencies of candidates for National Certification.\n\n--- PDF PAGE 266 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n262\n\nClean and\nmaintain\nkitchen\npremises\nPrepare meat\ndishes\nPrepare\nseafood\ndishes\nOrganize bulk\ncooking\noperations for\nbuffet service\nPrepare\nbakery\nproducts for\npatisserie\nSelect\ncatering\nsystems\nMonitor\ncatering costs\nand revenues\n\nPrepare\nstocks,\nsauces and\nsoups\nPrepare\nvegetable\ndishes\nPrepare\ndesserts\nEstablish and\nmaintain\nquality control\nin food\nproduction\nApply catering\ncontrol and\nprocedures\nDesign menus\nto meet\nspecific\nmarket\nrequirements\nDevelop a food\nsafety program\n\nPrepare\nappetizers\nPrepare egg\ndishes\nPackage\nprepared food\nPrepare and\nserve special\ncuisines\nPlan and cost\nmenus\nDesign meals\nto meet\nspecial\ndietary,\nreligious and\ncultural\nrequirements\nImplement\nsafety, health,\nenvironmental,\nand\nsustainable\npolicies and\nprocedures\