orting\n• Observation\n• Demonstration\n• Written\nExamination\n• Oral\nExamination\n• Practical\nExamination\n• Interview\n• Oral\nQuestioning\n\n10 hours\n\n--- PDF PAGE 253 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n249\nUnit of\nCompetency\n\nLearning\nOutcomes\nLearning Activities\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\ncorrective action taken as required in line\nwith workplace procedures.\n• Document and communicate outcomes\nto report on efficiency targets to key\npersonnel and stakeholders.\n\n10.5 Promote\nengagement\nwith safety,\nhealth,\nenvironmental\nand\nsustainability\npolicies and\nprocedures\n• Discuss:\n• Collaboration techniques in promoting\nsustainability.\n• Factors that contribute to lack of\nengagement, discrimination and poor\nparticipation in the workplace\n• Techniques to encourage participation,\ncommunication and respect in the\nworkplace\n• Procedures for information dissemination\non environmental sustainable practice.\n• Identification of achievements in\nsustainable practice\n• Organizational processes for\nimplementing initiatives\n• Amending procedures and making\nrecommendations for target setting.\nDemonstrate how:\n• Ongoing collaboration with peers and\nothers are engaged.\n• Equitable participation is encouraged in\nsustainable practices that integrate the\nservice delivery systems from all\nstakeholders\n• Proper application of procedures that\nsupport engagement are encouraged.\n• Accurate information targeted to\nstakeholder interests/needs are\npresented\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Power Point\npresentation\n• Simulation\n• Video\npresentation\n• Self-paced\nhandouts or\nmodule\n• Group\nreporting\n• Observation\n• Demonstration\n• Written\nExamination\n• Oral\nExamination\n• Practical\nExamination\n• Interview\n• Oral\nQuestioning\n\n5 hours\n\n--- PDF PAGE 254 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n250\nUnit of\nCompetency\n\nLearning\nOutcomes\nLearning Activities\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Achievements are identified and\npromoted throughout the organization\n• Successful strategies are promoted and\nd participants are rewarded where\npossible.\n• New efficiency targets are set and\ninvestigated and new tools and\nstrategies are applied.\n\n--- PDF PAGE 255 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n251\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done in an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based on the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) of current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1.\nInstitution- Based Training:\n\n•\nDual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP;\n•\nDistance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\naudio, video, computer technologies or other modern technology that\ncan be used to facilitate learning and formal and non-formal training.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n--- PDF PAGE 256 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n252\n•\nThe traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n2.2\nEnterprise-based Training - where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n•\nFormal Apprentices – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n•\nInformal Apprenticeship is based on a training (and working)\nagreement between an apprentice and a master craft person wherein\nthe agreement may be written or oral and the master crafts person\ncommits to training the apprentice in all the skills relevant to his or\nher trade over a significant period of time, usually between one-and\nfour years, while the apprentice commits to contributing productively\nto the work of the business. Training is integrated into the production\nprocess and apprentices learn by working alongside the experienced\ncrafts person\n\n2.3\nCommunity-Based\n\n•\nCommunity-Based Training – short term programs conducted by\nnon-government organizations (NGOs), LGUs, training centers and\nother TVET providers which are intended to address the specific\nneeds of a community. Such programs can be conducted in informal\nsettings such as barangay hall, basketball courts, etc. These\nprograms can also be mobile training programs (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n• must be competent in FOOD PRODUCTION (PROFESSIONAL\nCOOKERY) NC III qualification gained through training or experience or\ncertification\n• can communicate in advance English in both oral and written form;\n• can perform advance mathematical computation;\n• must be a holder of a Health Certificate (free of Hepatitis or any\ncommunicable disease)\n\n--- PDF PAGE 257 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n253\n\n3.4 LIST OF TOOLS AND EQUIPMENT\n PROFESSIONAL COOKERY (FOOD PRODUCTION) – NC IV\n\nRecommended list of tools, equipment and materials for the training of a\nminimum of 25 trainees for FOOD PRODUCTION (PROFESSIONAL\nCOOKERY) NC IV are as follows:\n\nOFFICE EQUIPMENT\nLABORATORY EQUIPMENT\nHEAVY KITCHEN EQUIPMENT\nQTY\n\nQTY\n\nQTY\n\n3 units\nComputer with\nInternet Connection\n5 units Four-burner gas range w/\noven\n1 unit\nAir Conditioner\n1 unit\nAir Conditioner\n1 unit\nDeck Oven (4-Tray\nCapacity)\n1 unit\nEmergency light\n1 pc\nDirectional Signage/s\nfor each room\n1 unit\nStainless Commercial\nUpright Freezer, 20 cu. ft\n1 unit\nDemo Table with\nOverhead Mirror\n1 unit\nEmergency Light\n1 unit\nStainless Commercial\nUpright Chiller, 20 cu. ft\n5 units Preparation table (Approx.\n45” X 28”)\n1 unit\nTelephone\n1 unit\nDeep fat fryer (4 L-\ncapacity)\n1 unit\nBain-Marie Table with 4\ncompartments\n1 unit\nColored Printer\n5 unit\nExhaust hood\n2 units Condiment cabinet\n\n1 unit\nMeat grinder\n1 unit\nU