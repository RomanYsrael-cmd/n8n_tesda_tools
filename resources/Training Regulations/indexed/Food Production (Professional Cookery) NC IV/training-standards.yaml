od safety\nprogram\n9.1 Evaluate\norganizational\nneeds for a\nfood safety\nprogram\n\nDiscuss:\n• Types of foodservice operations and\nenterprises\n• Different organizational characteristics\nthat impact food safety.\n• Common food safety hazards including\nidentification of contaminant,\ncontamination and potentially hazardous\nfoods.\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Power Point\npresentation\n• Simulation\n• Observation\n• Demonstration\n• Written\nExamination\n• Oral\nExamination\n• Practical\nExamination\n• Interview\n10 hours\n\n--- PDF PAGE 241 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n237\nUnit of\nCompetency\n\nLearning\nOutcomes\nLearning Activities\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Evaluation methods for product\nspecifications, supplier identification and\nquality assurance specifications.\n• Procedural system in the evaluation of a\nfood safety program\n\nDemonstrate how:\n• Type of enterprise/ establishment is\ndetermined\n• Organizational characteristics that impact\non food safety are evaluated.\n• Potential food safety hazards or any\nparticular issues or risk situations in food\nhandling operations and processes are\nidentified.\n• Existing product specifications are\nevaluated, product suppliers are\nidentified and quality assurance\nspecifications for foodstuff supplied are\ndetermined.\n• Existing policies and procedures and\nmonitoring practices, including record\nkeeping, are evaluated and the need for\nchange or enhancement is assessed.\n• Video\npresentation\n• Self-paced\nhandouts or\nmodule\n• Group\nreporting\n• Oral\nQuestioning\n\n9.2 Develop a\nfood safety\nprogram for a\nspecific\ncommercial\ncatering\nenterprise\n\nDiscuss:\n• Structure and development including\nHACCP and key features of federal and\nlocal food safety compliance\nrequirements as they impact food safety\nprogram development, including:\n▪\ncontents of national codes and\nstandards that underpin regulatory\nrequirements\n▪\ncomponents of a food safety program\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Power Point\npresentation\n• Simulation\n• Video\npresentation\n• Observation\n• Demonstration\n• Written\nExamination\n• Oral\nExamination\n• Practical\nExamination\n• Interview\n10 hours\n\n--- PDF PAGE 242 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n238\nUnit of\nCompetency\n\nLearning\nOutcomes\nLearning Activities\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n▪\nlocal government food safety\nregulations and audit frequencies\n▪\nconsequences of failure to observe\nfood safety policies and procedures\n• HACCP or other food safety system\nprinciples, procedures and processes as\nthey apply to particular operations and\ndifferent food types, including critical\ncontrol points for the specific food\nproduction system\n• Predetermined methods of controlling\nrisks and hazards\n• Procedures and contingency plans on\nestablishing policies and procedures for:\n▪\ntime and temperature controls used\nin the storage, preparation, display,\nservice and cooking, cooling and\ntransporting of food\n▪\nmethods of food storage, production,\ndisplay, service and cooking, cooling\nand transporting, especially,\nappropriate temperature levels for\neach of these processes\n▪\nconditions for development of\nmicrobiological contamination\n▪\nenvironmental conditions, including\ntemperature controls, for storage\n▪\ntemperature danger zone and the\ntwo-hour and four-hour rule\n▪\nequipment operating procedures,\nespecially how to calibrate, use and\nclean a temperature probe and how\nto identify faults\n• Self-paced\nhandouts or\nmodule\n• Group\nreporting\n• Oral\nQuestioning\n\n--- PDF PAGE 243 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n239\nUnit of\nCompetency\n\nLearning\nOutcomes\nLearning Activities\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n▪\nchoice and application of cleaning,\nsanitizing and pest control equipment\nand materials\n• Procedures for monitoring application\nand deviations of controls of critical\ncontrol points\n• Principles of developing corrective\nactions for uncontrolled hazards.\n• Best practices when creating new\nproduct specification and incorporating\nquality control points\n• Mechanics for complying with regulatory\nrequirements\n• Training needs analysis in relation to\nfood safety\n• Principles of developing documentation\nprocedures for food safety compliance\n• Principles of developing scheduling of\nfood safety program review\n• Documenting compliance to food safety\nprograms\nDemonstrate how:\n• Food safety program is designed to\nintegrate regulatory requirements and\nstandards into policies and procedures\nthat suit the characteristics and needs of\nthe enterprise in consultation with\ncolleagues and stakeholders.\n• Food production flow charts are\ndeveloped and critical control points in\nthe food production system are identified.\n• Methods of control for critical points and\nhazards are established.\n\n--- PDF PAGE 244 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n240\nUnit of\nCompetency\n\nLearning\nOutcomes\nLearning Activities\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Standard operational policies and\nprocedures to support the food safety\nprogram including control procedures\nand corrective actions and measures,\nand contingency plans are developed or\nmodified.\n• Procedures for systematic monitoring of\ncontrols and associated record keeping\nare developed.\n• Corrective action procedures for\nuncontrolled hazards are developed\n• Product specifications covering food\nitems prepared and sold are developed\nor modified and recorded.\n• Compliance of food safety program with\nregulatory requirements and standards is\nensured\n• Training needs are identified, and 