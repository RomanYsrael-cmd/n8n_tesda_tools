 of\ninformation on the hotel and travel\nindustries, appropriately and correctly\n•\nObtain information on the hotel and\ntravel industries to assist effective work\nperformance within the industries\n•\nAccess and update specific information\non relevant sector(s) of work\n•\nUse knowledge of the hotel and travel\nindustries in the correct context to\nenhance quality of work performance\n•\nObtain information on other industries\nto enhance quality of work performance\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n5 Hours\n\n1.2 Source and\napply\ninformation on\nlegal and\nethical issues\nfor the\nhospitality\nindustry\n•\nObtain information on legal issues and\nethical issues to assist effective work\nperformance\n•\nConduct day-to-day hospitality industry\nactivities in accordance with legal\nobligations and ethical industry\npractices\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n5 Hours\n\n1.3 Update\nhospitality\nindustry\nknowledge\n•\nIdentify and use a range of\nopportunities to update general\nknowledge of the hotel and travel\nindustries\n•\nMonitor current issues of concern to\nthe industries\n•\nShare updated knowledge with\ncustomers and colleagues as\nappropriate and incorporate this\nknowledge into day-to-day work\nactivities\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nExamination\n• Interview\n\n10 Hours\n\n--- PDF PAGE 206 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n202\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2. Perform child\nprotection\nduties relevant\nto the tourism\nindustry\n2.1 Identify the\nissue of sexual\nexploitation of\nchildren by\