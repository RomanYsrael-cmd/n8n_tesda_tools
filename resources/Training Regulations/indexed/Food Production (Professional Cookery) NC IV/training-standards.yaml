      "source_text": "3.6\nTRAINER’S QUALIFICATIONS FOR TOURISM SECTOR (HOTEL AND\nRESTAURANT)\n\n FOOD PRODUCTION (PROFESSIONAL COOKERY) NC IV\n\n• Must be a holder of National TVET Trainer’s Certificate (NTTC) Level I in FOOD\nPRODUCTION (PROFESSIONAL COOKERY) NC IV\n• Must have at least 3 years supervisory level work experience in the food\nproduction industry or has taught or has experience in delivering training\nprograms for Cookery NC III for at least 2 years\n• Must be a holder of a Health Certificate (hepatitis-free or any communicable\ndisease)\n• Must have an industry recognized National or International Food Safety,\nSanitation and Hygiene Certification (ServSafe™ Certification or its equivalent)\n• Must have attended relevant training and seminars such as:\no Current trends in cookery and baking\no Menu Costing\no Dietary, Religious or Cultural Cooking\no Halal Cooking\no Catering and Events Management"
