rements\n• Tasks are performed in a safe manner\nand in line with legislative requirements\nand environmental care principles,\norganizational policies and procedures\n• Duties, equipment and materials are\norganized in line with SHE requirements\nand organizational procedures\n\n10.2 Assess and\ncontrol risks\n\nDiscuss:\n• Environmental risks and hazard\nidentification\n• Personnel responsible for ensuring\nproper implementation of SHES policies\n• Tools, techniques and strategies used by\npractitioners to build sustainable practice\n• Principles of sustainability assessment\nand control of risks\n• Sustainability problem identification and\nresolution strategies, and common\nfaultfinding techniques\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Power Point\npresentation\n• Simulation\n• Video\npresentation\n• Observation\n• Demonstration\n• Written\nExamination\n• Oral\nExamination\n• Practical\nExamination\n• Interview\n• Oral\nQuestioning\n\n5 hours\n\n--- PDF PAGE 250 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n246\nUnit of\nCompetency\n\nLearning\nOutcomes\nLearning Activities\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Ethical dilemmas in applying sustainable\npractices\n• Monitoring procedures for\nimplementation of SHES practices\n• Identification of improvement areas for\nworkplace information on SHES\npractices.\n• Evaluation procedures on the practices\nof SHES policies.\n• Documentation procedures for workplace\ninformation on SHES practices.\n• Management reporting of workplace\nSHES practices information.\n\nDemonstrate how:\n• SHES issues and hazards in the work\narea are detected, assessed and\nreported to appropriate personnel.\n• Current practice are evaluated and\nopportunities to enhance sustainability\nare determined.\n• Work practices and processes are\nanalyzed to identify areas for\nimprovement in relation to SHE issues\nand hazards.\n• Changes to work practices 