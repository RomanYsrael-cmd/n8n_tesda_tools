ored in appropriate\ncontainers and are properly labeled\naccording to sanitation and safety\nstandards and FIFO procedures.\n• Storage conditions are ensured to\nmaintain freshness and quality.\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Power Point\npresentation\n• Simulation\n• Video\npresentation\n• Self-paced\nhandouts or\nmodule\n• Group\nreporting\n• Observation\n• Demonstration\n• Written\nExamination\n• Oral\nExamination\n• Practical\nExamination\n• Interview\n• Oral\nQuestioning\n\n5 hours\n\n--- PDF PAGE 224 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n220\nUnit of\nCompetency\n\nLearning\nOutcomes\nLearning Activities\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Economic viability of preparation and\nholding quantities are ensured.\n3. Select\ncatering\nsystem\n3.1 Establish\nenterprise\nrequirements\nfor a catering\nsystem\n\nDiscuss:\n• Research topics on catering\nrequirements\n• Factors affecting selection on\nappropriate catering systems\n• Operational constraints that affect\nselection of catering system\n\nDemonstrate how:\n• Catering requirements are researched\nand reviewed taking into account all\nrelevant factors\n• Enterprise constraints in selecting a\nsystem are identified.\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Power Point\npresentation\n• Simulation\n• Video\npresentation\n• Self-paced\nhandouts or\nmodule\n• Group\nreporting\n• Observation\n• Demonstration\n• Written\nExamination\n• Oral\nExamination\n• Practical\nExamination\n• Interview\n• Oral\nQuestioning\n\n20 hours\n\n3.2 Evaluate and\nselect the\ncatering\nsystem\n\nDiscuss:\n• Types of catering systems and their food\nproduction characteristics for different\nproduction methods\n• Comprehensive details of food\nproduction process, including:\n• Nutritional principles relating to each\nsystem\n• Storage and holding requirements\n• Requirements, regulations and\nlegislation that impact on different\nsystems, including OHS, hygiene codes,\nenvironmental impacts, sustainability,\nHACCP and storage issues\n• Specific system to evaluate advantages\nand disadvantages of each catering\nsystem\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Power Point\npresentation\n• Simulation\n• Video\npresentation\n• Self-paced\nhandouts or\nmodule\n\n• Group\nreporting\n• Observation\n• Demonstration\n• Written\nExamination\n• Oral\nExamination\n• Practical\nExamination\n• Interview\n• Oral\nQuestioning\n\n15 hours\n\n--- PDF PAGE 225 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n221\nUnit of\nCompetency\n\nLearning\nOutcomes\nLearning Activities\n\nMethodologies\nAssessment\nMethods\nNominal\nDuration\nDemonstrate how:\n• A range of alternative catering systems\nare identified.\n• Agreed enterprise requirements are\nevaluated for all stages of the food\nproduction process against systems.\n• The advantages and disadvantages of\nsystems are considered in making\nrecommendation.\n4. Design\nmenus to\nmeet specific\nmarket\nrequirements\n\n4.1 Identify and\nevaluate\ntarget market\n\nDiscuss:\n• Basic characteristics of different markets\nin the foodservice industry\n• Potential target markets of different\nfoodservice operations\n• Principles of SWOT Analysis to identify\ndifferent market needs\n\nDemonstrate how:\n• Characteristics of the different markets\nwithin the vicinity are identified based on\npast and current operations and\nperformance.\n• Target markets are identified based on\nreview of the current market place and\nthe nature and style of the operations\n• Preferences of key market are evaluated\nand matched with overall enterprise\nproducts and services\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Power Point\npresentation\n• Simulation\n• Video\npresentation\n• Self-paced\nhandouts or\nmodule\n• Group\nreporting\n• Observation\n• Demonstration\n• Written\nExami