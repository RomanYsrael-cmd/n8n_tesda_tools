  "source_text": "SECTION 1 FOOD PRODUCTION (PROFESSIONAL COOKERY) NC IV\n QUALIFICATION\n\nThe FOOD PRODUCTION (PROFESSIONAL COOKERY) NC IV Qualification\nconsists of competencies that a person must achieve to plan and prepare foods to meet\nspecial dietary and cultural needs; designs menus, plan and implement a food safety\nprogram; catering events; and manage a team of cooks for guests in hotels, motels,\nrestaurants, clubs, canteens, resorts, luxury liners and cruise ships within the company’s\nacceptable standards. He/she is also able to implement and/or execute plans and monitor\nexpenses to generate the required gross profit margins.\n\nThis Qualification is packaged from the competency map of the Tourism Sector\n(Hotel and Restaurant) as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n500311401\nUtilize specialized communication skills\n500311402\nDevelop and lead teams\n500311403\nPerform higher-order thinking processes and apply\ntechniques in the workplace\n500311404\nContribute to the practice of social justice in the workplace\n500311405\nManage innovative work instructions\n500311406\nManage and evaluate usage of information\n500311407\nLead in improvement of Occupational Safety and Health\n(OSH) programs, policies and procedures\n500311408\nLead towards improvement of environment work programs,\nand procedures\n500311409\nSustain entrepreneurial skills\n\nCODE NO.\nCOMMON COMPETENCIES\nTRS141208\nMaintain hospitality industry knowledge\nTRS141209\nPerform child protection duties relevant to the tourism\nindustry\nTRS141210\nDevelop and supervise operational approaches\nTRS141211\n Manage quality customer service\nTRS141212\nManage finances within a budget\nTRS141213 Plan and implement a series of training events\nTRS141214 Use the assessment system for training outcomes\n\n--- PDF PAGE 6 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n2\nCODE NO.\n CORE COMPETENCIES\nTRS512311\nManage food production operations for catering\nTRS512312\nManage bakery and patisserie operations for catering\nTRS512313\nSelect catering system\nTRS512314\nDesign menus to meet specific market requirements\nTRS512315\nDesign meals to meet special dietary, religious and cultural\nrequirements\nTRS512316\nPrepare catering tenders\nTRS512317\nPlan and manage menu-based catering for an event or\nfunction\nTRS512318\nManage catering costs and revenues\nTRS512319\nDevelop a food safety program\nTRS512320\nImplement safety, health, environmental, and sustainable\npolicies and procedures\n\nA person who has achieved this Qualification is competent to be a/an:\n\n❑ Sous Chef\n❑ Executive Sous Chef\n\n--- PDF PAGE 7 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n3"
