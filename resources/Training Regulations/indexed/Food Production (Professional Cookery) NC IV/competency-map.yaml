  "source_text": "COMPETENCY MAP - TOURISM Sector\n(Hotel and Restaurant)\nFOOD PRODUCTION (PROFESSIONAL\nCOOKERY) NC IV\nCORE\nCOMPETENCIES\nANNEX A\n\n--- PDF PAGE 267 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n263\nPerform\ncomputer\noperations\nReceive and\nresolve\ncustomer\ncomplaints\nRoster staff\nPlan, conduct\nand evaluate\nstaff\nperformance\nassessment\nDevelop and\nsupervise\noperational\napproaches\nPlan and\nimplement a\nseries of\ntraining\nevents\n\nParticipate in\nworkplace\ncommunication\nLead\nworkplace\ncommunication\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nFacilitate\nentrepreneurial\nskills for micro-\nsmall- medium\nenterprises\n(MSMEs)\nContribute to\nthe practice of\nsocial justice\nin the\nworkplace\n\nLead towards\nimprovement\nof environment\nwork\nprograms,\npolicies and\nprocedures\n\nWork in a team\nenvironment\nLead small\nteams\nUse\ninformation\nsystematically\nUtilize\nspecialized\ncommunication\nskills\nManage\ninnovative\nwork\ninstructions\nSustain\nentrepreneurial\nskills\n\nPractice career\nprofessionalism\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\nEvaluate\noccupational\nsafety and\nhealth work\npractices\nDevelop and\nlead teams\nManage and\nevaluate\nusage of\ninformation\n\nPractice\noccupational\nhealth and\nsafety\nprocedures\nWork in a\ndiverse\nenvironment\nEvaluate\nenvironmental\nwork practices\nPerform\nhigher-order\nthinking\nprocesses and\napply\ntechniques in\nthe workplace\nLead in\nimprovement\nof\nOccupational\nSafety and\nHealth (OSH)\nprograms,\npolicies and\nprocedures\n\nBASIC\nCOMPETENCIES\n\n--- PDF PAGE 268 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n264\nGLOSSARY OF TERMS\n\n1. Aging (of Meat) – A controlled process where connective tissue and other proteins of\nthe meat is broken down by the natural enzymes to improve taste and/or tenderness.\n2. Anti-griddling – A process where food is flash frozen or semi-frozen on a chilled metal\ngriddle.\n3. Assembly/Service Catering System – A type of catering system where food is\npurchased and received as finished dishes. The food is only needed to be portioned\nand plated, then re-heated for service.\n4. Catering Tender – A detailed plan for an event or function including the goods and\nservices that would be provided.\n5. Centralized Service – A type of service were food service occurs at or adjacent to the\nfood production area\n6. Commissary Catering System – A type of catering system where food is cooked in\nbulk in a central kitchen, then distributed (hot, cold or frozen) to satellite kitchens.\n7. Composting – A process that recycles various organic materials otherwise regarded\nas waste products and produces a soil conditioner.\n8. Convenience Product - A product that has had all or part of the preparation done.\n9. Conventional Catering System - A type of catering system where food is prepared\nand cooked at the time it will be served. This is also done within the same facility.\n10. Cook-Chill Catering System – A type of catering system where food is produced and\npackaged, then rapidly chilled, stored under refrigeration then re-heated as required.\n11. Cook-Freeze Catering System - A type of catering system where food is produced\nand packaged, then rapidly frozen, stored under controlled freezer conditions, thawed\nwhen required, then re-heated as needed.\n12. Corrective Action – A step in the food flow which corrects any deviation from\nestablished critical limits to prevent food which may be hazardous from reaching\ncustomers.\n13. Critical Control Point – A point in the food flow ehre the failure of SOP could cause\nharm to customers and to the business.\n14. Decentralized Service – A type of service where food is transported (by tray, trolley,\nconveyor belt) to some remote location within the same building where it is either\nplated or served\n15. Degustation – Refers to the careful, appreciative tasting of various food, focusing on\nthe gustatory system, the senses, high culinary art and good company.\n16. Detoxification – A physiological or medicinal removal of toxic substances from the\nhuman body.\n17. Eco-friendly Packaging - May refer to packaging that are produced to improve\necological and environmental impacts\n18. Emulsification – The process of mixing two immiscible (unmixable) liquids.\n\n--- PDF PAGE 269 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n265\n19. Energy Efficiency – Refers to the use of less energy to perform the same task, thus\nreducing greenhouse gas emissions, reducing demand for energy imports, and\nlowering costs on an establishment.\n20. Engastration – A cooking technique in which the cook stuffs the remains of one\nanimal into another animal.\n21. Environmentally Friendly Tools and Equipment – refer to tools and equipment that\nminimize generation of wastage and emissions in all environmental media (air, soil,\nwater), reduces usage of non-renewable resources, particularly by means of efficient\nuse of energy using other natural resources (solar, wind, biomass, geothermal and\nbiofuel), and/or energy saving\n22. Flash Freezing – A freezing method for food in which it is frozen rapidly so as to\nprevent the formation of ice crystals.\n23. Food Flow – Refers to the steps in the food production system in which the food must\ngo through from starting from purchasing until service.\n24. Free-Range – Denotes a method of farming husbandry where the animals, for at least\npart of the day, can roam freely outdoors, rather than being confined in an enclosure\nfor 24 hours each day.\n25. Fruitarian – A subset of dietary veganism that consists entirely or primarily of fruits in\nthe botanical sense, and possibly nuts and seeds, but without animal products.\n26. Gelatinization – The process where starch and water are subjected to heat causing\nthe starch granules to swell.\n27. Gelation – The conversion from a liquid solution to a semi-solid state, through the\nincorporation of gelling agents, whether with heat or without heat.\n28. Gluten – An interconnected network of proteins produced in baked goods that trap\ngasses and that make doughs elastic and extensible.\n29. HACCP (Hazard Analysis Critical Control Point) – A proactive food safety\nmanagement system based on the approach of controlling critical control points in food\nhandling to prevent food safety problems.\n30. Halal – An Islamic dietary law where food is processed and prepared in accordance\nwith those requirements.\n31. Immersion Circulator – An electrically powered device that circulates and heats a\nwarm fluid kept at an accurate and stable temperature.\n32. Instant-read thermometer – a thermometer used to measure the internal\ntemperature of foods. The stem is inserted into the food, producing an instant\ntemperature read out.\n33. Job schedule - A written plan of where you should be cleaning with approximate\ntimes. Its purpose is to monitor certain tasks that have been completed and help\naddress any problem or maintenance issues that need attention.\n34. Kosher – A Jewish dietary regulations of kashrut, primarily derived from Leviticus and\nDeuteronomy.\n35. Lacto Vegetarian – A type of diet where a person abstains from eating meats and\neggs but eats dairy products.\n\n--- PDF PAGE 270 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n266\n36. Lacto-Ovo Vegetarian – A type of diet where a person abstains from eating meats\nbut eats eggs and dairy products.\n37. Lecithin – A generic term to designate any group of yellow-brownish fatty substances\noccurring in animal and plant tissues which are amphiphilic – they attract both water\nand fatty substances, and are used for smoothing food textures, emulsifying,\nhomogenizing liquid mixtures and repelling sticky materials.\n38. Macrobiotic Diet – A pescatarian diet fixed on ideas about types of food drawn from\nZen Buddhism. The diet attempts to balance supposed yin and yang elements of food\nand cookware.\n39. Modified Texture Diet – A type of diet hat contain carefully selected foods of an\nappropriate consistency which can be more easily chewed and managed by a person\nwith dysphagia.\n40. Molecular Cooking – A subdiscipline of food science that seeks to investigate the\nphysical and chemical transformations of ingredients that occur in cooking.\n41. Non-renewable Energies – A resource of economical value that cannot be readily\nreplaced by natural means at a quick enough pace to keep up with consumption.\n42. Off-Premise Catering – A type of catering where food is served at a location away\nfrom the caterer’s food production facility.\n43. On-Site Catering – A type of catering where food is served at the same location as\nthe caterer’s food production facility.\n44. Organic Food – Food produced by methods that comply with the standards of organic\nfarming such as the restriction on the use of pesticides and fertilizers and where foods\nare not subject to irradiation, industrian solvents or synthetic food additives.\n45. Ovo Vegetarian – A type of diet where a person abstains from eating meats and dairy\nproducts but eats egg products.\n46. Pescetarian – A type of vegetarian diet that incorporates seafood as the only source\nof meat in an otherwise vegetarian diet.\n47. Preventive Maintenance – A type of maintenance that is regularly performed on a\npiece of equipment to lessen the likelihood of it failing.\n48. Production Schedule – The timetable for the use of resources and processes\nrequired by the food production facility to produce goods and provide services.\n49. Production Sheet – A tool that is used in foodservice operation to plan and control\nfood production.\n50. Ready-Prepared Catering System – A type of catering system where food items are\nprepared well in advance before the time of service and kept chilled or frozen until they\nare ready to be used.\n51. Renewable Energies – Refers to energy that is collected from a renewable resource,\nwhich are naturally replenished on a human timescale, such as sunlight, wind, rain,\ntides, waves, and geothermal heat.\n52. Re-thermalization – A process whereby cooked food that is cold is reheated to\nserving temperature.\n\n--- PDF PAGE 271 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n267\n53. Reverse Spherification – A method of molecular gastronomy that is used to enclose\nliquid containing alcohol content, as well as liquid with calcium content such as milk or\nyogurt.\n54. Set-Menu – A type of limited menu offered for a set number of courses, at a fixed\nprice.\n55. Sous Vide – Literally means “in vacuum” and refers to the process of vacuum-sealing\nfood in a bag, then cooking it to a very precise temperature in a water bath.\n56. Spherification – A method of molecular gastronomy that employs sodium alginate\nand either calcium chloride or calcium glucate lactate to shape a liquid into squishy\nspheres, which visually and texturally resemble roe.\n57. Sustainable ingredients – These refer to ingredients that are produced and\ntransported in a way that help to: limit global warming, protect biodiversity and\necosystems, respect natural resources and living world, and ensure fair and sufficient\ncompensation as well as decent working conditions.\n58. Thermal Cooking – A cooking technique where food in cooked in a device that uses\nthermal insulation to retain heat and cook food without the continuous use of fuel or\nother heat source.\n59. Vegan – A subset of dietary veganism that consists primarily of fruits and vegetables\nin the botanical sense, and possibly nuts and seeds, but without animal products.\n60. Waste Management – Denotes the activities and actions required to manage waste\nfrom its inception to its final disposal.\n\n--- PDF PAGE 272 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n268\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title :\nQualification Code :\nFood Production (Professional Cookery) NC IV\nTRSFP419\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nCommercial\nCooking NC IV\n2007-41 /\n11/22/2007\nN/A\n01\nDocument Amended\n\nFood Production\n(Professional\nCookery) NC IV\n2019-59/\nNovember 07,\n2019\n\nLegend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 273 ---\nFOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)\n269\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nREVIEW PANEL\n\nHEINZ PELAYO\nELENA C. RIVERA\nNational Master Assessor;\nASEAN Master Assessor;\nChef Consultant, Peotraco Food, Inc.;\nCulinary Arts Instructor\nCulinary Arts Instructor,\nCenter for Asian Culinary Studies\nCollege of International Tourism\n\n and Hospitality Management\n\nLyceum of the Philippines University\n\nIntramuros, Manila\n\nJOSE GABRIEL E. PRATS\nJULIE ANN F. MENDOZA\nASEAN Master Assessor;\nASEAN Master Assessor;\nCulinary Training Director,\nProgram Chair – Culinary Arts,\nUnited Marine Training Center\nCollege of International Tourism\n\n and Hospitality Management\n\nLyceum of the Philippines University\n\nIntramuros, Manila\n\nDANIEL L. EDRALIN\nNational Union Workers in Hotel\n and Allied Industries\n(NUWHRAIN-Restaurant Sentro)\n TIBFI\n\nANABELLE O. MORENO\nBoard of Trustees\nTourism Industry Board Foundation, Inc.\n(TIBFI)\nASEAN Master Trainer\n\nHESSEL A. LARCIA\nNational Union Workers in