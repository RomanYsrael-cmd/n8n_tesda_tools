      "definition": "35. Lacto Vegetarian – A type of diet where a person abstains from eating meats and eggs but eats dairy products. FOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019) 36. Lacto-Ovo Vegetarian – A type of diet where a person abstains from eating meats but eats eggs and dairy products. 37. Lecithin – A generic term to designate any group of yellow-brownish fatty substances occurring in animal and plant tissues which are amphiphilic – they attract both water and fatty substances, and are used for smoothing food textures, emulsifying, homogenizing liquid mixtures and repelling sticky materials. 38. Macrobiotic Diet – A pescatarian diet fixed on ideas about types of food drawn from Zen Buddhism. The diet attempts to balance supposed yin and yang elements of food and cookware. 39. Modified Texture Diet – A type of diet hat contain carefully selected foods of an appropriate consistency which can be more easily chewed and managed by a person with dysphagia. 40. Molecular Cooking – A subdiscipline of food science that seeks to investigate the physical and chemical transformations of ingredients that occur in cooking. 41. Non-renewable Energies – A resource of economical value that cannot be readily replaced by natural means at a quick enough pace to keep up with consumption. 42. Off-Premise Catering – A type of catering where food is served at a location away from the caterer’s food production facility. 43. On-Site Catering – A type of catering where food is served at the same location as the caterer’s food production facility. 44. Organic Food – Food produced by methods that comply with the standards of organic farming such as the restriction on the use of pesticides and fertilizers and where foods are not subject to irradiation, industrian solvents or synthetic food additives. 45. Ovo Vegetarian – A type of diet where a person abstains from eating meats and dairy products but eats egg products. 46. Pescetarian – A type of vegetarian diet that incorporates seafood as the only source of meat in an otherwise vegetarian diet. 47. Preventive Maintenance – A type of maintenance that is regularly performed on a piece of equipment to lessen the likelihood of it failing. 48. Production Schedule – The timetable for the use of resources and processes required by the food production facility to produce goods and provide services. 49. Production Sheet – A tool that is used in foodservice operation to plan and control food production. 50. Ready-Prepared Catering System – A type of catering system where food items are prepared well in advance before the time of service and kept chilled or frozen until they are ready to be used. 51. Renewable Energies – Refers to energy that is collected from a renewable resource, which are naturally replenished on a human timescale, such as sunlight, wind, rain, tides, waves, and geothermal heat. 52. Re-thermalization – A process whereby cooked food that is cold is reheated to serving temperature. FOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019) 53. Reverse Spherification – A method of molecular gastronomy that is used to enclose liquid containing alcohol content, as well as liquid with calcium content such as milk or yogurt. 54. Set-Menu – A type of limited menu offered for a set number of courses, at a fixed price. 55. Sous Vide – Literally means “in vacuum” and refers to the process of vacuum-sealing food in a bag, then cooking it to a very precise temperature in a water bath. 56. Spherification – A method of molecular gastronomy that employs sodium alginate and either calcium chloride or calcium glucate lactate to shape a liquid into squishy spheres, which visually and texturally resemble roe. 57. Sustainable ingredients – These refer to ingredients that are produced and transported in a way that help to: limit global warming, protect biodiversity and ecosystems, respect natural resources and living world, and ensure fair and sufficient compensation as well as decent working conditions. 58. Thermal Cooking – A cooking technique where food in cooked in a device that uses thermal insulation to retain heat and cook food without the continuous use of fuel or other heat source. 59. Vegan – A subset of dietary veganism that consists primarily of fruits and vegetables in the botanical sense, and possibly nuts and seeds, but without animal products. 60. Waste Management – Denotes the activities and actions required to manage waste from its inception to its final disposal. FOOD PRODUCTION (Professional Cookery) NC IV Revision 01 Promulgated (11/07/2019)"
    }
