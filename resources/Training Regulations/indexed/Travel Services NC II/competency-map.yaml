  "source_text": "COMPETENCY MAP - TOURISM Sector\n(Hotel and Restaurant)\n TRAVEL SERVICES NC II\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 113 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 109\n\nUtilize\nspecialize\nspecialized\ncommunication\nskill\nDevelop\nand lead\nteams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage\nand sustain\nhigh\nperforming\nteams\nEvaluate higher\norder thinking\nskills and adjust\nproblem solving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nimplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nDevelop and update\nindustry knowledge\nObserve workplace\nhygiene procedures\n\nPerform computer\noperations\nPerform workplace and\nsafety practices\nProvide effective customer\nservice\n\nBASIC COMPETENCIES\n\nCOMMON COMPETENCIES\n\n--- PDF PAGE 114 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 110\n\nInterpret and respond\nto request for\nindividual/\nindependent tour\nservices\nDesign and develop a\ntour package itinerary\nDetermine tour package\ncost and selling price\nOperate technology-based\ninformation system\n\nProvide information and\nadvice on a destination,\nproduct or service\n\nPromote\ntourism\nproducts and services\n\nResearch information\nrelevant to\n locality and tour Itinerary\n\nCoordinate tour\narrangements for clients\n\nAccompany and guide\nclients in accordance with\nthe tour itinerary\n\nAccompany and guide\nclients in accordance with\nthe tour itinerary\n\nReceive and process\nreservations\n\nOperate computerized\nreservations system\n\nProvide accommodation\nreception\nConduct night audit\n\nProvide club reception\nservices\n\nProvide porter\nservices\n\nPlan and develop event\nproposal and bid\n\nDevelop an event concept\n\nDevelop event program\n\nSelect event venue and\nsite\n\nDevelop and update\nevent industry\nProvide on-site event\nmanagement\nManage contractors for\nindoor events\n\nDevelop and update\nknowledge on\nProvide on-site information\nand assistance\n\nMonitor entry to venue\n\nProvide a site briefing or\nscripted\nOperate a ride location\n\nLoad and unload a ride\n\nMaintain safety in water-\nbased rides\n\nOperate a games\nlocation\n\nPromote at a games\nlocation\n\nOperate animal enclosure\nexhibit\nProvide general animal\ncare\n\nRescue animals\n\nCapture, record and\nrespond to travel\nservice requirements\nand requests\nCreate travel-related\nreservations and\ntransactions\n\nProvide assistance in travel\ndocumentation preparation\nProcess the issuance of\npassage tickets and other\ntravel related\ndocuments\n\nCORE COMPETENCIES\n\n--- PDF PAGE 115 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 111\n\nGLOSSARY OF TERMS:\n\n1. APT\n\nAirline Passenger Tariff\n\n2. BI\n\nBureau of Immigration\n\n3. BIR\n\nBureau of Internal Revenue\n\n4. CIQ\n\nCustom Immigration and Quarantine\n\n5. BOOKING CLASS\nrefers to the category according to difficulty and\nthe complexity of skills and the knowledge\nrequired of the job. Also refers to the category of\nservice in a transportation\n\n6. CRS\n\nComputerized Reservation System\n\n7. CFO\n\nCommission on Filipinos Overseas\n\n8. DFA\n\nDepartment of Foreign Affairs\n\n9. DOCUMENTATION OFFICER\nrefers to the person employed by the travel\nagency to facilitate the issuance of travel\ndocuments\nand\nvisas,\nbirth\ncertificates,\nimmigration clearances, etc. clients with the right\ndocuments to the corresponding government\nagencies or embassies concerned.\n\n10. E – BOOKING\nElectronic Request / Reservation\n\n11. EMBASSY / CONSULATE\nthe representative office of the sovereign state in\nanother country that recognize them.\n\n12. GATEWAY\nEntry / Exit point of a destination\n\n13. GDS\nGlobal Distribution System\n\n14. GMT\nGreenwich Meridian Time\n\n15. IATA AREA CONFERENCES\nInternational Air Transport Association defined\ngeography.\n\n16. IMMIGRATION DOCUMENTS\nrefers to the documents issued by the Bureau of\nImmigration to resident and non – resident alien\nbased on immigration status.\n\n17. INTERNET\nElectronic Information Distribution System\n\n18. LGU\nLocal Government Unit\n\n19. MIRG\nManila Interline Reservation Group that dictates\nthe proper reservation procedures\n\n20. OAG\nOfficial Airline Guide\n\n21. OHS\nOccupational Health and Safety\n\n22. OSG\nOffice of the Solicitor General\n\n23. OJT\nOn – the – job Training\n\n--- PDF PAGE 116 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 112\n\n24. PASSPORT\nrefers to\nthe\ntravel document\nissued\nby\ngovernment to its citizens for travel and\nidentification purposes.\n\n25. PNR\nPassenger Name Record, where the history and\ninformation pertinent to the travel requirements of\na client is stored\n\n26. POEA\nPhilippine Overseas Employment Agency\n\n27. PROCESSING\ninvolves submission /follow – up and release of\ndocuments to Bureau of Immigration, Department\nof\nForeign\nAffairs,\nEmbassies\nand\nother\ngovernment agencies and includes paying the\nnecessary fees.\n\n28. RESERVATION\nrefers to an advance request for a product or\nservice\n\n29. RESERVATION OFFICER\nrefers to the person assigned to make a\nreservation of airline seat, hotel car rental and\nother travel related services with a supplier (air,\nsea or land).\n\n30. RETRIEVAL\nrefers to a summary of information pertinent to\ntravel requirements of the client.\n\n31. SEC\nSecurity and Exchange Commission\n\n32. TICKETING OFFICER\nrefers to the person assigned to write Airline\nTickets and Miscellaneous Charge Order of\nAirlines and other travel related services.\n\n33. TIM/TIMATIC\nTravel Information Manual/Travel Information\nElectronic version\n\n34. TRAVEL DOCUMENTS\nrefers to a permit issued by a sovereign state to\nits citizen in lieu of a passport.\n\n35. VISA\na permit issued by the embassy / consulate of a\ncountry allowing bearer the privilege of entry and\nexit to said country\n\n36. PASSAGE\nmovements of individual from point of origin to\npoint of destination by air, sea or land\n\n37. TRAVEL DOCUMENTS\nan official government-issued documents that\ncontain identification and information of the\nbearer\n\n38. TRAVEL DOCUMENTATION\nare enterprise-issued documents that specify\nservices to be provided to the bearer (including\ncontract of carriage or ticket)\n\n--- PDF PAGE 117 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 113\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nTRAVEL SERVICES NC II\nQualification Code TRSTVS219\n\nRevisio\nn\nNo.\nDocument\nTypes*\nQualification\nTitle\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nTravel Services\nNC II\n2013-17 /\n12/17/13\nNo. 07 series of\n2014\n\n01\nDocument Amended\n\nTravel Services\nNC II\n2019-12 /\n01/11/19\nNo. 027 series\nof 2019\n\nLegend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 118 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 114",
