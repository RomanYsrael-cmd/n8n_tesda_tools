  "source_text": "SECTION 1 TRAVEL SERVICES NC II QUALIFICATION\n\nThe TRAVEL SERVICES NC II Qualification consists of competencies that a\nperson must achieve to process request for independent travellers. It responses to\ninquiries, arranges reservations for travel related services, assists in securing travel\ndocumentations and issues necessary the necessary travel documents.\n\nThis Qualification is packaged from the competency map of the Tourism Sector\nas shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n\n400311210\nParticipate in workplace communication\n400311211\nWork in a team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the workplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\n\nTRS311201\nDevelop and update industry knowledge\nTRS311202\nObserve workplace hygiene procedures\nTRS311203\nPerform computer operations\nTRS311204\nPerform workplace and safety practices\nTRS311205\nProvide effective customer service\n\nCODE NO.\nCORE COMPETENCIES\n\nTRS422301\nCapture, record and respond to travel service requirements and\nrequests\nTRS422302\nCreate travel-related reservations and transactions\nTRS422303\nProvide assistance in travel documentation preparation\nTRS422304\nProcess the issuance of passage tickets and other travel related\ndocuments\n\n--- PDF PAGE 6 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 2\nA person who has achieved this Qualification is competent to be a:\n\n❑ Counter Staff\n❑ Reservations Staff\n❑ Travel Documentation Staff\n❑ Ticketing Staff\n❑ Travel Counselor\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 3"
}
