al and\ninternational actions\nare described to\nprevent the sexual\nexploitation of\nchildren\n2.3 Actions that can be\ntaken in the\nworkplace are\ndescribed to protect\nchildren from sexual\nexploitation\n2.1 Child protection\nduties relevant to\ntourism industry\n2.1.1 Rules,\nregulations,\npolicies and\nlaws\n2.1 Ability to make\ndecision\n2.2 Time management\n2.3 Ability to use\nobservation and\nmonitoring\ntechniques\n3. Observe and\nmonitor people\n3.1 Areas and people\nwho require\nobservation and\nmonitoring is\nprepared\n3.2 Observation and\nmonitoring activities\nare implemented\n3.3 Apprehension of\noffenders are\ndetermined\n3.4 Offenders are\narrested according to\nenterprise\nprocedures\n3.5 Administrative\nresponsibilities are\nfulfilled\n3.1 Observation and\nmonitoring\ntechniques\n2.1 Ability to make\ndecision\n2.2 Time management\n2.3 Ability to use\nobservation and\nmonitoring\ntechniques\n4. Deal with\nemergency\n situations\n4.1 Emergency and\npotential emergency\nsituations are\nrecognized and\nappropriate action\nare taken within\nindividual’s scope of\nresponsibility\n4.2 Emergency\nprocedures are\nfollowed in line with\nenterprise\nprocedures\n4.3 Assistance is sought\nfrom colleagues to\nresolve or respond to\nemergency situations\n4.4 Details of emergency\n2.1 Systems,\nProcesses and\nOperations\n 2.1.1 Workplace\n health, safety\n and security\n procedures\n 2.1.2 Emergency\n procedures\n 2.1.3 Personal\n presentation\n2.2 Safety Practices\n 2.2.1 Practice safety\n measures\n 2.2.2 5S\n Implementation\n2.1 Ability to make\ndecision\n2.2 Time management\n2.3 Ability to offer\nalternative steps\n2.4 Applying\nemergency\nprocedures\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 52\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n situations are\nreported in line with\nenterprise\npr