ional travel)\n1.1.6 Government issued ID details\n1.1.7 Travel Industry membership/loyalty\n1.2 Specific travel requirements such as:\n1.2.1 Inclusive dates of travel\n1.2.2 Number of persons\n1.2.3 Destination of travel\n1.3 Travel products and services-\n1.3.1 Transportation\n1.3.2 Transfers\n1.3.3 Accommodations\n1.3.4 Entertainment\n1.3.5 Tours\n1.3.6 Cruises\n1.3.7 Entrance to attractions and activities\n1.3.8 Tourist guiding services\n1.3.9 Food and Beverage\n1.3.10 Travel Insurance\n1.3.11 Miscellaneous Services\n1.3.12 Other requirements of the client\n2. Supplementary information\n\nMay include:\n2.1 Dietary requirements\n2.2 PWD (Person with disability)\n2.3 PRM (Person with reduced mobility)\n2.4 Infant/Senior Citizen/Pregnant\n2.5 Foreign Language\n3. Transport companies\nMay include:\n3.1 Air\n3.2 Sea\n3.3 Land\n4. Other travel related\nsuppliers\nMay include:\n4.1 Accommodations\n4.2 Entertainment\n4.3 Tours\n4.4 Cruises\n4.5 Entrance to attractions and activities\n4.6 Tourist guiding services\n4.7 Food and Beverage\n4.8 Travel Insurance\n4.9 Ancillary Services\n\n--- PDF PAGE 83 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 79\n\nVARIABLE\n\nRANGE\n\n4.10 Permits\n4.11 Other requirements of the client\n\n5. Passage tickets\nMay include:\n5.1 AirlineTickets\n5.2 Shipline Tickets\n5.3 Land Tickets\n6. Travel related documents\nMay include:\n6.1 Passport\n6.2 Visa\n6.3 Transit Visa\n6.4 Immigration clearances\n6.5 Travel Order (for government employees)\n6.6 DSWD Clearance (for minors)\n6.7 Tour Order\n6.8 Exchange Order\n6.9 Passage Ticket\n6.10 Hotel Voucher\n6.11 Cruise Voucher\n\n--- PDF PAGE 84 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 80\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Collated travel details of customers\n1.2 Processed the issuance of passage tickets and other\ntravel related documents\n