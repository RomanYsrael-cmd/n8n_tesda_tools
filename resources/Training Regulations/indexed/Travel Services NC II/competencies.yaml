        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Collated travel details of customers\n1.2 Processed the issuance of passage tickets and other\ntravel related documents\n1.3 Released passage tickets and other travel related\ndocuments\n1.4 Communicated effectively with others to ensure effective\n work operation\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Telephone, fax and email\n2.2 Computer with internet connection and reservation system\nor global distribution system\n2.3 Updated brochures\n2.4 Updated maps\n2.5 Updated Official Hotels & Resorts Guide or GDS\n2.6 Official Cruise line Guide or GDS\n2.7 Official Train Guide or GDS\n2.8 Updated Destination Travel Planner\n2.9 Tourism Calendar of Conferences & Events\n2. Methods of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Direct Observation with Oral Questioning\n3.2 Demonstration with Oral Questioning\n3.3 Written Test\n3.4 Portfolio (identify documents with Interview)\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 85 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 81"
        },
        "source_text": "TRS422304\n\nUNIT DESCRIPTOR : This unit deals with the skills and knowledge required to review\ndetails and payment of passage tickets and other travel related\ndocuments.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Collate travel\ndetails\n1.1 Travel details are\nencoded through\nelectronic or\nmanual means\n1.2 Travel details are\nvalidated with\nclients and any\nother travel related\ninformation in\naccordance with\nexisting enterprise\nprocedures\n1.3 Supplementary\ninformation\ncleared and\nrecorded with client\nin accordance to\nexisting enterprise\nprocedures\n1.1 Travel and tour\nterminologies\n1.2 Technical know-\nhow – travel\nrelated software,\nindustry rate and\ntariff sheets\n1.3 Enterprise forms\n1.4 Enterprise\nprocedures –\nstandard operating\nprocedures\n\n1.1 General technical\ncomputer skills\n1.2 Use of any Global\nDistribution Systems\n(GDS) Software -\nSabre, Amadeus,\nGalileo\n1.3 Use of Electronic\nDistribution System\nSoftware – online\nreservations and\nticketing systems for\ntravel industry\n1.4 Filing up of enterprise\nforms\n2. Process the\nissuance of\npassage\ntickets and\nother travel\nrelated\ndocuments\n2.1 Total cost of travel\nrequirements are\nchecked to ensure\naccuracy based on\nupdated local and/or\ninternational rates\n2.2 Travel information is\nreconfirmed to\nsupplier\n2.3 Purchase order (PO)\nis issued to the\ntransport\ncompanies and\nother travel-related\nsuppliers in\naccordance with\nexisting enterprise\nprocedures\n2.4 Payment is made to\ntransport companies\nand other travel-\nrelated suppliers\n2.1 Reservation basis,\nfare rules and\nrestrictions\n2.2 Technical know-\nhow – travel\nrelated software,\nindustry rate and\ntariff sheets\n2.3 Enterprise forms –\nformat and content\n2.4 Enterprise\nprocedures –\nstandard operating\nprocedures\n2.5 Basic Information\non International Air\nTransport\nAssociation (IATA)\n- organization,\nfunctions,\nmembers, traffic\nconferences\n2.1 Interpreting reservation\nbasis, fare rules,\ncommissions and\nrestrictions\n\n--- PDF PAGE 81 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 77\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n2.5 Passage tickets and\nother travel related\ndocuments are\nprinted issued upon\nreceipt of\nconfirmation from\nsuppliers\n\n2.6 Overview of IATA\nBilling and\nSettlement Plans\n(IATA-BSP)\n\n3. Release\npassage\ntickets, other\nrelated travel\ndocuments and\ntravel\ndocumentation\n3.1 Passage tickets and\nother travel related\ndocuments are\nrecapped/reiterated\nfor accuracy\n prior to release to\nclient\n3.2 Travel information is\nrecapped before\nreleasing to clients\n\n3.1 Enterprise forms\n3.2 Enterprise\nprocedures –\nstandard operating\nprocedures\n\n3.1 Review and verify data\nin ticket and related\ndocuments\n3.2 Review and verify\nreceipt of payment\n\n--- PDF PAGE 82 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 78\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Travel details\n\nMay Include:\n1.1 Specific client details such as:\n1.1.1 Names/s\n1.1.2 Contact Number – Mobile and Landline\n1.1.3 Address – Email and Home\n1.1.4 Date of birth\n1.1.5 Passport details (for international travel)\n1.1.6 Government issued ID details\n1.1.7 Travel Industry membership/loyalty\n1.2 Specific travel requirements such as:\n1.2.1 Inclusive dates of travel\n1.2.2 Number of persons\n1.2.3 Destination of travel\n1.3 Travel products and services-\n1.3.1 Transportation\n1.3.2 Transfers\n1.3.3 Accommodations\n1.3.4 Entertainment\n1.3.5 Tours\n1.3.6 Cruises\n1.3.7 Entrance to attractions and activities\n1.3.8 Tourist guiding services\n1.3.9 Food and Beverage\n1.3.10 Travel Insurance\n1.3.11 Miscellaneous Services\n1.3.12 Other requirements of the client\n2. Supplementary information\n\nMay include:\n2.1 Dietary requirements\n2.2 PWD (Person with disability)\n2.3 PRM (Person with reduced mobility)\n2.4 Infant/Senior Citizen/Pregnant\n2.5 Foreign Language\n3. Transport companies\nMay include:\n3.1 Air\n3.2 Sea\n3.3 Land\n4. Other travel related\nsuppliers\nMay include:\n4.1 Accommodations\n4.2 Entertainment\n4.3 Tours\n4.4 Cruises\n4.5 Entrance to attractions and activities\n4.6 Tourist guiding services\n4.7 Food and Beverage\n4.8 Travel Insurance\n4.9 Ancillary Services\n\n--- PDF PAGE 83 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 79\n\nVARIABLE\n\nRANGE\n\n4.10 Permits\n4.11 Other requirements of the client\n\n5. Passage tickets\nMay include:\n5.1 AirlineTickets\n5.2 Shipline Tickets\n5.3 Land Tickets\n6. Travel related documents\nMay include:\n6.1 Passport\n6.2 Visa\n6.3 Transit Visa\n6.4 Immigration clearances\n6.5 Travel Order (for government employees)\n6.6 DSWD Clearance (for minors)\n6.7 Tour Order\n6.8 Exchange Order\n6.9 Passage Ticket\n6.10 Hotel Voucher\n6.11 Cruise Voucher\n\n--- PDF PAGE 84 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 80\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Collated travel details of customers\n1.2 Processed the issuance of passage tickets and other\ntravel related documents\n1.3 Released passage tickets and other travel related\ndocuments\n1.4 Communicated effectively with others to ensure effective\n work operation\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Telephone, fax and email\n2.2 Computer with internet connection and reservation system\nor global distribution system\n2.3 Updated brochures\n2.4 Updated maps\n2.5 Updated Official Hotels & Resorts Guide or GDS\n2.6 Official Cruise line Guide or GDS\n2.7 Official Train Guide or GDS\n2.8 Updated Destination Travel Planner\n2.9 Tourism Calendar of Conferences & Events\n2. Methods of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Direct Observation with Oral Questioning\n3.2 Demonstration with Oral Questioning\n3.3 Written Test\n3.4 Portfolio (identify documents with Interview)\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 85 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 81"
