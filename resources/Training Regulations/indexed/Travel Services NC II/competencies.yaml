\nobtained by observing an individual in an\ninformation management role within the\nworkplace or operational or simulated\nenvironment.\n3. Methods of Assessment\nCompetency in this unit may be assessed\nthrough:\n3.1. Written Test\n3.2. Interview\n3.3. Portfolio\n\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment\nof other relevant units of competency. Assessment\nwill occur over a range of situations, which will\ninclude disruptions to normal, smooth operation.\nSimulation may be required to allow for timely\nassessment of parts of this unit of competency.\nSimulation should be based on the actual workplace\nand will include walk through of the relevant\ncompetency components.\n4. Context for Assessment\n4.1. In all workplace, it may be appropriate to\nassess this unit concurrently with relevant\nteamwork or operation units.\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 26\n\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL SAFETY AND HEALTH\nPOLICIES AND PROCEDURES\n\nUNIT CODE\n : 400311216\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to identify OSH compliance requirements,\nprepare OSH requirements for compliance, perform\ntasks in accordance with relevant OSH policies and\nprocedures\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify OSH\ncompliance\nrequirements\n1.1 Relevant OSH\nrequirements,\nregulations,\npolicies and\nprocedures are\nidentified in\naccordance with\nworkplace policies\nand procedures\n1.2 OSH activity non-\nconformities are\nconveyed to\nappropriate\npersonnel\n 1.3 OSH preventive\nand control\nrequirements are\nidentified in\naccordance with\nOSH work policies\nand procedures\n\n1.1. OSH preventive\nand control\nrequirements\n1.2. Hierarchy of\nControls\n1.3. Hazard\nPrevention and\nControl\n1.4. General OSH\nprinciples\n1.5. Work standards\nand procedures\n1.6. Safe handling\nprocedures of\ntools, equipment\nand materials\n1.7. Standard\nemergency plan\nand procedures\nin the workplace\n1.1. Communication\nskills\n1.2. Interpersonal\nskills\n1.3. Critical thinking\nskills\n1.4. Observation\nskills\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 27\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Prepare OSH\nrequirements for\ncompliance\n\n2.1 OSH work activity\nmaterial, tools and\nequipment\nrequirements are\nidentified in\naccordance with\nworkplace policies\nand procedures\n2.2. Required OSH\nmaterials, tools\nand equipment are\nacquired in\naccordance with\nworkplace policies\nand procedures\n2.3. Required OSH\nmaterials, tools\nand equipment are\narranged/ placed in\naccordance with\nOSH work\nstandards\n2.1. Resources\nnecessary to\nexecute hierarchy\nof controls\n2.2. General OSH\nprinciples\n2.3. Work standards\nand procedures\n2.4. Safe handling\nprocedures of\ntools, equipment\nand materials\n2.5. Different OSH\ncontrol measures\n\n2.1. Communication\nskills\n2.2. Estimation skills\n2.3. Interpersonal\nskills\n2.4. Critical thinking\nskills\n2.5. Observation\nskills\n2.6. Material, tool\nand equipment\nidentification\nskills\n\n3. Perform tasks in\naccordance with\nrelevant OSH\npolicies and\nprocedures\n\n3.1 Relevant OSH\nwork procedures\nare identified in\naccordance with\nworkplace policies\nand procedures\n3.2 Work Activities are\nexecuted in\naccordance with\nOSH work\nstandards\n3.3 Non-compliance\nwork activities are\nreported to\nappropriate\npersonnel\n3.1. OSH work\nstandards\n3.2. Industry related\nwork activities\n3.3. General OSH\nprinciples\n3.4. OSH Violations\n Non-compliance\nwork activities\n\n3.1 Communication\nskills\n3.3 Interpersonal\nskills\n3.4 Troubleshooting\nskills\n3.5 Critical thinking\nskills\n3.6 Observation\nskills\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 28\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Requirements,\nRegulations, Policies and\nProcedures\nMay include:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPermit to Operate\n1.6\nPhilippine Occupational Safety and Health\nStandards\n1.7\nDepartment Order No. 13 (Construction Safety\nand Health)\n1.8\nECC regulations\n2. Appropriate Personnel\nMay include:\n2.1\nManager\n2.2\nSafety Officer\n2.3\nEHS Offices\n2.4\nSupervisors\n2.5\nTeam Leaders\n2.6\nAdministrators\n2.7\nStakeholders\n2.8\nGovernment Official\n2.9\nKey Personnel\n2.10 Specialists\n2.11 Himself\n3. OSH Preventive and\nControl Requirements\nMay include:\n3.1 Resources needed for removing hazard\neffectively\n3.2 Resources needed for substitution or\nreplacement\n3.3 Resources needed to establishing engineering\ncontrols\n3.4 Resources needed for enforcing administrative\ncontrols\n3.5 Personal Protective equipment\n4. Non OSH-Compliance\nWork Activities\nMay include non-compliance or observance of the\nfollowing safety measures:\n4.1 Violations that may lead to serious physical\nharm or death\n4.2 Fall Protection\n4.3 Hazard Communication\n4.4 Respiratory Protection\n4.5 Power Industrial Trucks\n4.6 Lockout/Tag-out\n4.7 Working at heights (use of ladder, scaffolding)\n4.8 Electrical Wiring Methods\n4.9 Machine Guarding\n4.10 Electrical General Requirements\n4.11 Asbestos work requirements\n4.12 Excavations work requirements\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 29\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. Convey OSH work non-conformities to\nappropriate personnel\n1.2. Identify OSH preventive and control\nrequirements in accordance with OSH work\npolicies and procedures\n1.3. Identify OSH work activity material, tools and\nequipment requirements in accordance with\nworkplace policies and procedures\n1.4. Arrange/Place required OSH materials, tools and\nequipment in accordance with OSH work\nstandards\n1.5. Execute work activities in accordance with OSH\nwork standards\n1.6. Report OSH activity non-compliance work\nactivities to appropriate personnel\n2. Resource Implications\nThe following resources should be provided:\n2.1 Facilities, materials tools and equipment\nnecessary for the activity\n3. Methods of Assessment\nCompetency in this unit may be assessed\nthrough:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n4. Context for Assessment\n4.1 Competency may be assessed in the work\nplace or in a simulated work place setting\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 30\nUNIT OF COMPETENCY\n:\nEXERCISE EFFICIENT AND EFFECTIVE SUSTAINABLE\nPRACTICES IN THE WORKPLACE\n\nUNIT CODE\n:\n400311217\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers knowledge, skills and attitude to identify the\nefficiency and effectiveness of resource utilization,\ndetermine causes of inefficiency and/or ineffectiveness of\nresource utilization and Convey inefficient and ineffective\nenvironmental practices\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nefficiency and\neffectiveness of\nresource\nutilization\n\n1.1 Required resource\nutilization in the\nworkplace is\nmeasured using\nappropriate\ntechniques\n1.2 Data are recorded\nin accordance\nwith workplace\nprotocol\n1.3 Recorded data are\ncompared to\ndetermine the\nefficiency and\neffectiveness of\nresource utilization\naccording to\nestablished\nenvironmental\nwork procedures\n1.1. Importance of\nEnvironmental\nLiteracy\n1.2. Environmental\nWork\nProcedures\n1.3. Waste\nMinimization\n1.4. Efficient Energy\nConsumptions\n1.1 Recording Skills\n1.2 Writing Skills\n1.3 Innovation Skills\n\n2. Determine\ncauses of\ninefficiency\nand/or\nineffectiveness\nof resource\nutilization\n2.1 Potential causes\nof inefficiency\nand/or\nineffectiveness\nare listed\n2.2 Causes of\ninefficiency and/or\nineffectiveness\nare identified\nthrough deductive\nreasoning\n2.3 Identified causes\nof inefficiency\nand/or\nineffectiveness\nare validated thru\nestablished\nenvironmental\nprocedures\n2.1 Causes of\nenvironmental\ninefficiencies and\nineffectiveness\n\n2.1 Deductive\nReasoning Skills\n2.2 Critical thinking\n2.3 Problem Solving\n2.4 Observation Skills\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 31\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Convey\ninefficient and\nineffective\nenvironmental\npractices\n\n3.1 Efficiency and\neffectiveness of\nresource\nutilization are\nreported to\nappropriate\npersonnel\n3.2 Concerns related\nresource\nutilization are\ndiscussed with\nappropriate\npersonnel\n3.3 Feedback on\ninformation/\nconcerns raised\nare clarified with\nappropriate\npersonnel\n3.1 Appropriate\nPersonnel to\naddress the\nenvironmental\nhazards\n3.2 Environmental\ncorrective actions\n3.1 Written and Oral\nCommunication\nSkills\n3.2 Critical thinking\n3.3 Problem Solving\n3.4 Observation Skills\n3.5 Practice\nEnvironmental\nAwareness\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Environmental Work\nProcedures\nMay include:\n1.1 Utilization of Energy, Water, Fuel Procedures\n1.2 Waster Segregation Procedures\n1.3 Waste Disposal and Reuse Procedures\n1.4 Waste Collection Procedures\n1.5 Usage of Hazardous Materials Procedures\n1.6 Chemical Application Procedures\n1.7 Labeling Procedures\n2. Appropriate Personnel\nMay include:\n2.1 Manager\n2.2 Safety Officer\n2.3 EHS Offices\n2.4 Supervisors\n2.5 Team Leaders\n2.6 Administrators\n2.7 Stakeholders\n2.8 Government Official\n2.9 Key Personnel\n2.10 Specialists\n2.11 Himself\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 32\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Measured required resource utilization in the workplace\nusing appropriate techniques\n1.2. Recorded data in accordance with workplace protocol\n1.3. Identified causes of inefficiency and/or ineffectiveness\nthrough deductive reasoning\n1.4. Validate the identified causes of inefficiency and/or\nineffectiveness thru established environmental procedures\n1.5. Report efficiency and effectives of resource utilization to\nappropriate personnel\n1.6. Clarify feedback on information/concerns raised with\nappropriate personnel\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nWorkplace\n2.2\nTools, materials and equipment relevant to the tasks\n2.3\nPPE\n2.4\nManuals and references\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration\n3.2\nOral questioning\n3.3\nWritten examination\n4. Context for\nAssessment\n4.1\nCompetency assessment may occur in workplace or\n any appropriately simulated environment\n4.2\nAssessment shall be observed while task are being\n undertaken whether individually or in-group\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 33\nUNIT OF COMPETENCY\n: PRACTICE ENTREPRENEURIAL SKILLS IN THE\nWORKPLACE\n\nUNIT CODE\n: 400311218\n\nUNIT DESCRIPTOR\n: This\nunit\ncovers the outcomes\nrequired to\napply\nentrepreneurial workplace best practices and implement\ncost-effective operations\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Apply\n entrepreneurial\n workplace best\n practices