        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Knew key sources of information on the industry\n1.2 Updated industry knowledge\n1.3 Accessed and used industry information\n1.4 Developed and updated local knowledge\n1.5 Promoted products and services\n2. Resource implications\nThe following resources should be provided:\n2.1 Sources of information on the industry\n2.2 Industry knowledge\n3. Methods of assessment\nCompetency in this unit may be assessed\nthrough:\n3.1 Interview/questions\n\n3.2 Practical demonstration\n3.3 Portfolio of industry information related to\ntrainee’s work\n4. Context for assessment\n4.1 Competency assessment may occur in workplace\nor any appropriately simulated environment.\n4.2 Assessment may be performed on multiple\noccasions involving a combination of direct,\nindirect and supplementary forms of evidence.\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 40\nUNIT OF COMPETENCY : OBSERVE WORKPLACE HYGIENE PROCEDURES\n\nUNIT CODE :"
        },
        "source_text": "TRS311201\n\nUNIT DESCRIPTOR : This unit of competency deals with the knowledge, skills\nrequired to access, increase and update industry\nknowledge. It includes seek information on the industry and\nupdate industry knowledge.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Seek\ninformation on\nthe industry\n1.1 Sources of\ninformation on the\nindustry are\ncorrectly identified\nand accessed\n1.2 Information to\nassist effective\nwork performance\nis obtained in line\nwith job\nrequirements\n1.3 Specific information\non sector of work is\naccessed and\nupdated\n1.4 Industry information\nis correctly applied\nto day-to-day work\nactivities\n1.1 Overview of quality\nassurance in the\nindustry\n1.2 Role of individual\nstaff members\n1.3 Industry information\nsources\n1.1 Ready skills needed\nto access industry\ninformation\n1.2 Basic competency\nskills needed to\naccess the internet\n2. Update\nindustry\nknowledge\n2.1 Informal and/or\nformal research is\nused to update\ngeneral knowledge\nof the industry\n2.2 Updated knowledge\nis shared with\ncustomers and\ncolleagues as\nappropriate and\nincorporated into\nday-to-day working\nactivities\n2.1 Role of individual\nstaff members\n2.2 Industry information\nsources\n2.1 Time management\n2.2 Ready skills needed\nto access industry\ninformation\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 37\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Develop and\nupdate local\nknowledge\n3.1 Local knowledge is\ndeveloped to assist\nqueries on\nlocal/national\ntourism industry\n3.2 Local knowledge is\nupdated using\ninformal and/or\nformal research\n3.3 Contact with local\ncommunities is\nmaintained\n3.1 Role of individual\nstaff members\n3.2 Industry information\nsources\n3.1 Time management\n3.2 Ready skills needed\nto access industry\ninformation\n\n4. Promote\nproducts and\nservices to\ncustomer\n4.1 Promotional\ninitiatives are\ndescribed that\nmaybe used to\npromote products\nand services\n4.2 Selling skills are\napplied according to\ncustomer needs\n4.1 Promotional\ninitiatives\n\n4.1 Applying selling\nskills\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 38\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information sources\nMay include :\n1.1 Media\n1.2 Reference books\n1.3 Libraries\n1.4 Unions\n1.5 Industry associations\n1.6 Industry journals\n1.7 Internet\n1.8 Personal observation and experience\n\n2. Information to assist\neffective work\nperformance\nMay include:\n2.1 Different sectors of the industry and the\nservices available in each sector\n2.2 Relationship between tourism and\nhospitality\n2.3 Relationship between the industry and\nother industries\n2.4 Industry working conditions\n2.5 Legislation that affects the industry\n2.5.1 Liquor\n2.5.2 Health and safety\n2.5.3 Hygiene\n2.5.4 Gaming\n2.5.5 Workers compensation\n2.5.6 Consumer protection\n2.5.7 Duty of care\n2.5.8 Building regulations\n2.6 Trade unions\n2.7 Environmental issues and requirements\n2.8 Industrial relations issues and major\norganizations\n2.9 Career opportunities within the industry\n2.10 Work ethic required to work in the\nindustry and industry expectations of staff\n2.11 Quality assurance\n\n3. Informal and formal\nresearch\nMay include:\n3.1 Discussions with colleagues, management and\ncustomers\n3.2 Reading internal enterprise material about\nproducts and services\n3.3 Familiarity with customer comments including\ncomplaints\n3.4 Reading and researching product data and\ninformation\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 39\n\nVARIABLE\nRANGE\n\n3.5 Conducting internal testing to determine quality\nand differentials\n3.6 General media research\n3.7 Developing and analyzing responses to\nquestionnaires\n3.8 Reading surveys and ratings\n4. Promotional initiatives\nMay include:\n4.1 Media campaigns\n4.2 Internal promotions, including static displays,\ndemonstrations, tastings, videos, competitions,\npackages, events\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Knew key sources of information on the industry\n1.2 Updated industry knowledge\n1.3 Accessed and used industry information\n1.4 Developed and updated local knowledge\n1.5 Promoted products and services\n2. Resource implications\nThe following resources should be provided:\n2.1 Sources of information on the industry\n2.2 Industry knowledge\n3. Methods of assessment\nCompetency in this unit may be assessed\nthrough:\n3.1 Interview/questions\n\n3.2 Practical demonstration\n3.3 Portfolio of industry information related to\ntrainee’s work\n4. Context for assessment\n4.1 Competency assessment may occur in workplace\nor any appropriately simulated environment.\n4.2 Assessment may be performed on multiple\noccasions involving a combination of direct,\nindirect and supplementary forms of evidence.\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 40\nUNIT OF COMPETENCY : OBSERVE WORKPLACE HYGIENE PROCEDURES\n\nUNIT CODE :"
