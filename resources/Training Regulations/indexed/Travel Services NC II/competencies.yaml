atio\nn skills\n5.2 Non-verbal\ncommunicatio\nn - body\nlanguage\n5.3 Good time\nmanagement\n5.4 Ability to work\ncalmly and\nunobtrusively\neffectively\n5.5 Proper way of\nhandling\ncomplaints\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 58\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Customers\nMay include:\n1.1 Internal\n1.2 External\n2. Non-verbal communication May include:\n2.1 Body language\n2.2 Dress and accessories\n2.3 Gestures and mannerisms\n2.4 Voice tonality and volume\n2.5 Use of space\n2.6 Culturally specific communication customs and\npractices\n3. Cultural and social\ndifferences\nMay include:\n3.1 Modes of greeting, farewelling and conversation\n3.2 Body language/ use of body gestures\n3.3 Formality of language\n4. Interpersonal skills\nMay include:\n4.1 Interactive communication\n4.2 Public relation\n4.3 Good working attitude\n4.4 Sincerity\n4.5 Pleasant disposition\n4.6 Effective communication skills\n5. Customer and colleagues\nneeds\nMay include:\n5.1 Those with a disability\n5.2 Those with special cultural or language needs\n5.3 Unaccompanied children\n5.4 Parents with young children\n5.5 Pregnant women\n5.6 Single women\n6. Enterprise procedure\nMay include:\n6.1 Modes of greeting and farewelling\n6.2 Addressing the person by name\n6.3 Time-lapse before a response\n6.4 Style manual requirements\n6.5 Standard letters and proformas\n7. Business tools and\ntechnology\nMay include:\n7.1 Telephone\n7.2 Fax machine\n7.3 Computer equipment\n7.4 Internet, email\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 59\n\nVARIABLE\nRANGE\n8. Complaint\nMay include:\n8.1 Level of service\n8.2 Product standards\n8.3 Processes\n8.4 Information given\n8.5\nCharges and fees\n9. Threats to personal safety\nMay include:\n9.1 Violent customers\n9.2 Drug and alcohol affected customers\n9.3 Customers fighting amongst themselves\n\n--- PDF PAGE 64 ---\nT