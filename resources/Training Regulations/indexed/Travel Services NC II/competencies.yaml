ith enterprise\nprocedure\n3.2 Appropriate rapport is\nmaintained with\ncustomer to enable\nhigh quality service\ndelivery\n3.3 Opportunity to enhance\nthe quality of service\nand products are taken\nwherever possible\n\n3.1 Communication\n 3.1. Interactive\n communication\nwith others\n 3.1.2 Interpersonal\nskills/social\ngraces with\n sincerity\n3.2 Safety Practices\n 3.2.1 Safe work\n practices\n 3.2.2 Personal hygiene\n3.3 Attitude\n 3.3.1 Attentive, patient\n and cordial\n 3.3.2 Eye-to-eye\n contact\n 3.3.3 Maintain\n teamwork\n and cooperation\n3.4 Theory\n 3.4.1 Selling/upselling\n techniques\n 3.4.2 Interview\n techniques\n 3.4.3 Conflict\nresolution\n 3.4.4 Communication\n process\n 3.4.5 Communication\n Barriers\n\n3.1 Effective\ncommunicatio\nn skills\n3.2 Non-verbal\ncommunicatio\nn - body\nlanguage\n3.3 Good time\nmanagement\n3.4 Ability to work\ncalmly and\nunobtrusively\neffectively\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 57\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Handle queries\nthrough use of\ncommon\nbusiness tools\nand technology\n4.1 Use telephone,\ncomputer, fax machine,\ninternet efficiently to\ndetermine customer\nrequirements\n4.2 Queries/ information\nare recorded in line with\nenterprise procedure\n4.3 Queries are acted upon\npromptly and correctly\nin line with enterprise\nprocedure\n4.1 Communication\n 4.1.1 Interactive\ncommunication with\nothers\n 4.1.2 Interpersonal\nskills/ social graces\nwith sincerity\n4.2 Attitude\n 4.2.1 Attentive, patient\nand cordial\n 4.2.2 Maintain teamwork\nand cooperation\n4.3 Theory\n 4.3.1 Interview\n techniques\n 4.3.2 Communication\n process\n 4.3.3 Communication\nbarriers\n4.1 Effective\ncommunicatio\nn skills\n4.2 Non-verbal\ncommunicatio\nn - body\nlanguage\n4.3 Good time\nmanagement\n4.4 Ability to work\ncalmly and\nunobtrusively\neffectively\n5. Handle\ncomplaints,\nevaluation and\nrecommendati\nons\n5.1 Guests are greeted with\na smile and eye-to-eye\ncontact\n5.2 Responsibility for\nresolving the complaint\nis taken within limit of\nresponsibility\n5.3 Nature and details of\ncomplaint are\nestablished and agreed\nwith the customer\n5.4 Threats to personal\nsafety are identified and\nmanaged to personal\nsafety of customers or\ncolleagues and\nappropriate assistance\nis organized\n5.5 Appropriate action is\ntaken to resolve the\ncomplaint to the\ncustomers satisfaction\nwherever possible\n5.6 Conflict situations are\nresolved within scope of\nindividual responsibility\nby applying effective\ncommunication skills\nand according to\nenterprise policy\n5.1 Communication\n 5.1.1 Interactive\ncommunication with\nothers\n 5.1.2 Interpersonal\nskills/ social graces\nwith sincerity\n5.2 Attitude\n 5.2.1 Attentive, patient\n and cordial\n 5.2.2 Eye-to-eye\n contact\n 5.2.3 Maintain\n teamwork\n and cooperation\n5.3 Theory\n 5.3.1 Interview\n techniques\n 5.3.2 Conflict\n resolution\n 5.3.3 Communication\n process\n 5.3.4 Communication\n barriers\n5.1 Effective\ncommunicatio\nn skills\n5.2 Non-verbal\ncommunicatio\nn - body\nlanguage\n5.3 Good time\nmanagement\n5.4 Ability to work\ncalmly and\nunobtrusively\neffectively\n5.5 Proper way of\nhandling\ncomplaints\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 58\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Customers\nMay include:\n1.1 Internal\n1.2 External\n2. Non-verbal communication May include:\n2.1 Body language\n2.2 Dress and accessories\n2.3 Gestures and mannerisms\n2.4 Voice tonality and volume\n2.5 Use of space\n2.6 Culturally specific communication customs and\npractices\n3. Cultural and social\ndifferences\nMay include:\n3.1 Modes of greeting, farewelling and conversation\n3.2 Body language/ use of body gestures\n3.3 Formality of language\n4. Interpersonal skills\nMay include:\n4.1 Interactive communication\n4.2 Public relation\n4.3 Good working attitude\n4.4 Sincerity\n4.5 Pleasant disposition\n4.6 Effective communication skills\n5. Customer and colleagues\nneeds\nMay include:\n5.1 Those with a disability\n5.2 Those with special cultural or language needs\n5.3 Unaccompanied children\n5.4 Parents with young children\n5.5 Pregnant women\n5.6 Single women\n6. Enterprise procedure\nMay include:\n6.1 Modes of greeting and farewelling\n6.2 Addressing the person by name\n6.3 Time-lapse before a response\n6.4 Style manual requirements\n6.5 Standard letters and proformas\n7. Business tools and\ntechnology\nMay include:\n7.1 Telephone\n7.2 Fax machine\n7.3 Computer equipment\n7.4 Internet, email\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 59\n\nVARIABLE\nRANGE\n8. Complaint\nMay include:\n8.1 Level of service\n8.2 Product standards\n8.3 Processes\n8.4 Information given\n8.5\nCharges and fees\n9. Threats to personal safety\nMay include:\n9.1 Violent customers\n9.2 Drug and alcohol affected customers\n9.3 Customers fighting amongst themselves\n\n--- PDF PAGE 64 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 60\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Complied with industry practices and procedures\n1.2 Used interactive communication with others\n1.3 Complied with occupational, health and safety practices\n1.4 Promoted public relation among others\n1.5 Complied with service manual standards\n1.6 Demonstrated familiarity with company facilities,\nproducts and services\n1.7 Demonstrated ability to work effectively with others\n1.8 Applied company rules and standards\n1.9 Applied telephone ethics\n1.10 Applied correct procedure in using telephone, fax\nmachine, internet\n1.11 Handled customer complaints within limit of individual\nresponsibility\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Availability of telephone, fax machine, internet, etc.\n2.2 Availability of data on projects and services; tariff and\nrates, promotional activities in place etc.\n2.3 Availability of office supplies\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Practical demonstration\n4. Context for\nassessment\n4.1 Competency assessment may occur in workplace or any\nappropriately simulated environment.\n4.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 61\nCORE COMPETENCIES\n\n UNIT OF COMPETENCY : CAPTURE, RECORD AND RESPOND TO TRAVEL\nSERVICE REQUIREMENTS AND REQUESTS\n\n UNIT CODE\n\n : TRS422301\n\n UNIT DESCRIPTOR : This unit deals with the knowledge and skills required to\nrecord, interpret, and respond to travel related requirements\nand requests of clients. It describes the process of recording\nand responding, that includes format, content and type of\ncorrespondence.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Record all\ntravel service\nrequirements\nof client\n1.1 Client details, travel\nrequirements and\nspecial requests are\nidentified and recorded\nimmediately by staff\nfollowing appropriate\ninformation (data)\ncollection and logging\nmethods according to\nexisting enterprise\nforms and procedures\n1.2 Clients’ required\ndocuments for travel\npurposes are identified\nand noted pursuant to\nand in accordance to\nexisting enterprise\nforms and procedures\n1.3 Details, requirements\nand special requests of\nclients are promptly\nreviewed and recapped\nfor accuracy, pursuant\nto and in accordance to\nexisting enterprise\nforms and procedures\n\n1.1 Effective\ncommunication -\nverbal and non-\nverbal\n1.2 Profiling /\nunderstanding\nmarket\n1.3 Database\norganization\n\n1.1 Communication Skills\n1.2 Active listening\n1.3 Questioning\n1.4 Ability to recognize\nimplied and explicit\nrequirements\n1.5 Ability to gather and\ntake note of correct\nand complete\ninformation\n\n--- PDF PAGE 66 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 62\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Interpret\ntravel\nrequirements\nand requests\nof client\n2.1 Client’s travel\nrequirements and\nrequests are\nimmediately identified\nand evaluated\n2.2 Applicable information\nto match clients’\nrequirements are\nidentified and\naccessed immediately\n2.3 Suitable travel\nproducts and services\nare identified and\nselected.\n2.4 Additional and\nalternative travel\nproducts and services\nare identified and\nselected.\n\n2.1 Market Segment\nand Profile\n2.2 Product\nknowledge as\nappropriate to\nspecific industry\nsector.\n2.3 Principles that\nunderpin trav9el\nand tour\narrangements\n2.4 Market-product\nmatching with\npreferred\nsupplier.\n\n2.1 Language proficiency\n2.2 Interpretation of the\ncustomer’s\nrequirements.\n2.3 Interpretation of\nproduct specifications\n2.4 Ability to identify\ndifferent customer\nsituations\n2.5 Use of industry-\ncurrent operational\ndocumentation eg.\ndetails of supplier\ncontracts and\ncustomer files.\n2.6 Good command of\nthe language\n2.7 Ability to choose\nappropriate\nexpression\n2.8 Familiarity with travel\nproducts and\nservices\n2.9 Knowledge of travel\nand hospitality\nterminologies\n2.10\nObservance of\nexisting enterprise\nprocedures,\nprocesses and forms\n\n--- PDF PAGE 67 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 63\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Prepare and\npresent\nappropriate\nresponse\n\n3.1 Type and Mode of\nresponse in verbal\nor written form is\ndetermined\naccording to existing\nenterprise processes\nand procedures\n3.2 Content is\nconstructed\naccording to existing\nenterprise standards\n3.3 Appropriate\nresponse is\ndelivered promptly\naccording to\nexisting enterprise\nstandard\n3.4 Response is\naccepted by client –\nsecure a conforme\nand collect payment\n3.5 Response is not\naccepted by client –\nprompt revision,\namendment and\nresubmission\naccording to existing\nenterprise processes\nand procedures\n\n3.1 Business writing\nprinciples-\n3.1.1 Technical\nwriting\n3.1.2 Enterprise\ndocuments\n3.1.3 Enterprise\nforms and\ntemplates\n3.2 Up-to-date\napplication of\nInformation and\nCommunication\nTechnology\n3.3 Communication Skills\n3.4 Use of Information and\nCommunication\nTechnology equipment\n\n--- PDF PAGE 68 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 64\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Client details\n\nMay include:\n1.1\nNames/s\n1.2\nContact Number – Mobile and Landline\n1.3\nAddress – Email and Home\n1.4\nDate of birth\n1.5\nPassport details (for international travel)\n1.6\nGovernment issued ID details\n1.7\nTravel Industry membership/loyalty\n2. Travel requirements\nMay include:\n2.1\nInclusive dates of travel, number of persons,\ndestination of travel.\n2.2\nTravel products and services-\n2.2.1 Transportation\n2.2.2 Transfers\n2.2.3 Accommodations\n2.2.4 Entertainment\n2.2.5 Tours\n2.2.6 Cruises\n2.2.7 Entrance to attractions and activities\n2.2.8 Tourist guiding services\n2.2.9 Food and Beverage\n2.2.10 Travel Insurance\n2.2.11 Miscellaneous Services\n2.2.12 Other requirements of the client\n3. Clients’ special requests\nMay include:\n3.1 Dietary requirements\n3.2 Cultural/religious requirements\n3.3 PWD (Persons with Disability)/\nPDA (Persons with Different Abilities)\n3.4 PRM (Person with reduced mobility)\n3.5 Infant / Senior Citizen/ Pregnant\n3.6 Foreign Language\n3.7 Seat requests\n\n4. Information collection\nmethods\nMay include:\n4.1. Travel information questionnaire\n4.2. Note taking during client interview\n4.3 Direct observation during client interview\n\n5. Travel agency /\nenterprise forms\nMay include:\n5.1. Travel Information Slip – manual or electronic\n5.2. Booking Card/Form – manual or electronic format\n5.3. Log book – manual or electronic format\n5.4 Purchase Order\n5.5. Booking Order\n\n--- PDF PAGE 69 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 65\nVARIABLE\nRANGE\n\n5.6 Travel documentation requirement checklists for\n passport and visa – manual or electronic format\n5.7 Passport and visa application forms – manual or\n electronic format\n5.8 Billing statement/Statement of account\n5.9 Acknowledgment receipt\n5.10 Official receipt\n\n6. Additional and\n alternative\nMay include:\n6.1 Additional, refers to products and services that are\n recommended of interest to the clients\n6.2 Alternative, refers to products and services\nrecommended if original requirements are not\navailable\n\n7. Type and mode of\nresponse\nMay include:\n7.1 Type, refers to Inquiry, Acknowledgement,\nProposal, Clarification, Amendment,\nConfirmation, Re-confirmation, Cancellation.\n7.2 Mode\n 7.2.1 Face to face\n 7.2.2 Telephone – Landline / Mobile\n7.2.3 SMS\n7.2.4 Fax\n 7.2.5 Internet – Email / Social Media\n7.2.6 Mail/courier service\n\n--- PDF PAGE 70 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 66\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Received and recorded customer details, requirements,\nand requests\n1.2 Interpreted the customer’s requirements and requests\naccurately\n1.3 Identified suitable travel products and services\n1.4 Matched client requirements with suitable products and\nservices\n1.5 Prepared and delivered appropriate response\n1.6 Communicated effectively with others to ensure effective\nwork operation\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Telephone, fax and email\n2.2 Computer terminal with internet connection\n2.3 Global Distribution System (GDS) and/or Electronic\nReservations Systems\n2.4 Updated brochures\n2.5 Updated maps\n2.6 Updated rate sheets\n2.7 Updated Official Hotels & Resorts Guide\n2.8 Official Cruise Line Guide\n2.9 Official Train Guide\n2.10 Updated Destination Travel Planner\n2.11 Tourism Calendar of Conferences and Events\n2.12 Pro-forma enterprise form/s\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.3 Direct Observation with Oral Questioning\n3.4 Demonstration with Oral Questioning\n3.3 Written Test\n3.4 Portfolio (identify the documents with Interview)\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 71 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 67\n\nUNIT OF COMPETENCY: CREATE TRAVEL-RELATED RESERVATIONS AND\nTRANSACTIONS\n\nUNIT CODE\n : TRS422302\n\nUNIT DESCRIPTOR : This unit deals with the skills and knowledge required to make\nand administer bookings for travel related products and\nservices. It describes the coordination of bookings with\nsuppliers, normally a business to business transaction.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Administer\nclient file and\nidentify\nbooking\nrequirements\n1.1 Clients’ details of\nnew or existing\nrequirements are\ninterpreted\n1.2 Client’s new or\nexisting booking\nrecord is created\nor updated\n1.3 Products and\nservices to be\nbooked are identified\naccording to the\ncustomer’s\nrequirements and\nrequests\n1.4 Supplier is selected\naccording to client’s\nrequirements and\nrequests any pre-\nnegotiated\nenterprise\narrangements\n1.5 Clients’ required\ndocuments for\ntravel purposes are\ncollected and\nchecked for validity\nbased on enterprise\nprocedures\n1.6 Client’s financial\nrecord are checked\nin accordance to\nenterprise policies\nand procedures\n\n1.1 World geography\n1.2 Product knowledge\nas appropriate to\nspecific industry\nsector\n1.3 Principles that\nunderpin\nreservations and\nbooking\nprocedures\n1.4 Relationships\nbetween different\nsectors of the\ntourism industry in\nrelation to\nreservations and\nbookings\n1.5 Familiarity with\ncomponents of a\nTour package\n1.1 Interpretation of the\ncustomer’s\nrequirements\n1.2 Interpretation of any\nquotations previously\nsupplied to customer\n1.3 Communication Skills\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 68\n\nELEMENTS\nPERFORMANCE CRITERIA\nBold and italicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Request\nservices\n2.1 Products and services are\nrequested from suppliers\nusing the appropriate\nmethod in accordance\nwith existing enterprise\nprocedures\n2.2 Details of the required\nbooking are provided to\nthe suppliers to ensure\nthe customer receives the\ncorrect product or service\nincluding:\n2.2.1 Customer details\n2.2.2 Inclusive date, time\nand location of\ncommencement and\nconclusion of service\n2.2.3 Any pre-negotiated\ncosts and payment detail\n2.2.4 Nature of service to\nbe provided\n2.2.5 Special request or\nrequirements\n2.2.6 Special permits\n2.3 Multiple services are\nrequested simultaneously\nin the most practical and\nsequential order\n2.4 Alternative products or\nservices are requested if\ndesired bookings are not\navailable\n2.5 Changes made to original\nbookings are identified\nand adjustments to\nbookings are made\naccordingly\n2.6 Revisions to bookings are\nmade as requested/\nrequired including\nadjustment to other\narrangements, accordingly\n2.1 Booking forms\n2.2 Global\nDistribution\nSystem\n(GDS)\nOnline Booking\nSystems\n2.3 Manual\nProcedures\n2.4 Negotiated\ncosts,\ncontractual\narrangements of\npreferred\nsupplier/s\n2.1 Demonstration of\nskills in booking and\ncoordinating supplier\nservices for multiple\nand different\ncustomer situations\nand varying products\nand services (ideally\nas a component of\nintegrated work\nactivity)\n2.2 Use of Information\nand Communication\nTechnology\nequipment.\n2.3 Use of industry-\ncurrent operational\ndocumentation eg.\ndetails of supplier\ncontracts and\ncustomer files\n2.4 The coordination and\ncompletion of\nbookings\n2.5 Maintenance of files\nwithin time frames\nand constraints that\nreflect typical industry\npractice\n2.6 Communication Skills\n\n--- PDF PAGE 73 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 69\n\nELEMENTS\nPERFORMANCE CRITERIA\nBold and italicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Record\nstatus of\nrequest\n3.1 Records of bookings\nmade are filed, including\nconfirmations in\naccordance with existing\nenterprise policies and\nprocedures\n3.2 Files are monitored to\nensure that all\nconfirmations have been\nreceived and follow up\npending\nbookings/reservations\n3.3 Alternative options are\nundertaken managed in\nrelation to bookings\nmade in accordance\nwith system, supplier\nand/or existing enterprise\npolicies and procedures\n\n3.1 Record\nManagement\n(softcopy and\nhardcopy) –\nincluding GDS\nqueues and\nother supplier’s\nwaitlists/\n3.2 pending\nrequests\n3.1 Organization and\nFiling Skills\n3.2 Communication Skills\n4. Collect\npayment\n4.1 Payment is collected and\naccepted from clients\naccording to existing\nenterprise policies and\nprocedures\n4.2 Proof of payment is issued\nto the client\n\n4.1 Basic\nMathematics\n4.2 Enterprise\npolicies and\nprocedures\n4.3 Enterprise forms\n4.1 Issuance of enterprise\nforms\n4.2 Communication Skills\n5. Update and\nfinalize\nbookings\n5.1Amendments/adjustments\nmade are accurately\nrecorded in accordance\nwith existing enterprise\npolicies and procedures\n5.2 Clients payment is\nverified with appropriate\ndepartment\n5.3 Payments required by\nthe supplier are\nprocessed at the\nappropriate time in\naccordance with existing\nenterprise procedures\n5.4 Booking changes are\nrelayed to suppliers in\naccordance with agreed\nprocedures and any\ncontractual arrangements\n5.5 Client’s final details and\nrequirements are\nfinalized with suppliers in\naccordance with the\nexisting enterprise\nprocedures\n5.1 Operational\nknowledge\nrelevant to\nfinalization of\ntransaction, such\nas: Purchase\nOrder, Ticket\nIssuance,\nExchange\nVoucher, Tour\nVoucher\n5.2 Terms and\nconditions of\nbookings\n\n5.1 Demonstration of\nskills in\nreconfirmation, and\nfinalization of booking\nservices\n5.2 Use of Information\nand Communication\nTechnology\nequipment\n5.3 Communication Skills\n\n--- PDF PAGE 74 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 70\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Client details\nMay include:\n1.1 Name/s\n1.2 Contact Number – Mobile and Landline\n1.3 Address – Email and Home\n1.4 Date of birth\n1.5 Passport details (for international travel)\n1.6 Travel Industry membership/loyalty\n2. Supplier’s services\nMay include:\n2.1 Supplier’s (Travel) products and services-\n2.2 Transportation\n2.3 Transfers\n2.4 Accommodations\n2.5 Entertainment\n2.6 Tours\n2.7 Cruises\n2.8 Entrance to attractions and activities\n2.9 Tourist guiding services\n2.10 Food and Beverage\n2.11 Travel Insurance\n2.12 Miscellaneous Services\n2.13 Other requirements of the client\n3. Special Permits\nMay include:\n3.1 Travel Order (for government employees)\n3.2 DSWD Clearance (for minors)\n3.3 Bureau of Immigration requirements (for\nforeigners)\n3.4 Medical Certificate\n3.5 Travel Exemption Certificate (TEC)\n3.6 Reduce Travel Tax Certificate (RTTC)\n3.7 Overseas Employment Certificate (OEC)\n4. Additional and alternative\nMay include:\n4.1 Additional, refers to products and services\nthat are recommended of interest to the\nclients\n4.2 Alternative, refers to products and services\nrecommended if original requirements are\nnot available\n5. Type and mode of response\nMay include:\n5.1 Type, refers to Inquiry, Acknowledgement,\nProposal, Clarification, Amendment,\nConfirmation, Re-confirmation, Cancellation.\n5.2 Mode\n5.2.1 Face to face\n5.2.2 Telephone – Landline / Mobile\n5.2.3 SMS\n5.2.4 Fax\n5.2.5 Internet – Email / Social Media\n5.2.6 Mail/courier service\n\n--- PDF PAGE 75 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 71\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Interpreted the customer’s requirements correctly and\nconfirmed specific services to the customer.\n1.2 Coordinated effectively, the booking process from initial\nrequest to finalization of the booking\n1.3 Kept records of all bookings made accurately.\n1.4 Demonstrated knowledge on industry booking systems\nand procedures for a range of products and services. (The\nrange of products and services booked will vary according\nto the industry sector and workplace)\n1.5 Communicated effectively with others to ensure effective\nwork operation\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Telephone, fax and email\n2.2 Computer with internet connection and reservation system\nor global distribution system (GDS)\n2.3 Updated brochures\n2.4 Updated maps\n2.5 Updated Official Hotels & Resorts Guide or GDS\n2.6 Official Cruise line Guide or GDS\n2.7 Official Train Guide or GDS\n2.8Updated Destination Travel Planner\n2.9Tourism Calendar of Conferences & Events\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation with Oral Questioning\n3.2 Demonstration with Oral Questioning\n3.3 Written Test\n3.4 Portfolio (identify the documents with Interview)\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 76 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 72\n\nUNIT OF COMPETENCY : PROVIDE ASSISTANCE IN TRAVEL DOCUMENTATION\n PREPARATION\nUNIT CODE\n\n : TRS422303\nUNIT DESCRIPTOR : This unit deals with the skills and knowledge required to assist\nclients in preparation of travel documents i.e passport, visa,\nimmigration papers in preparation for travel abroad.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Assist with\nclient’s\npassport\napplication\n1.1 Information and\ndocumentary\nrequirements of\nclient’s passport\napplication is collated\nin accordance with\nexisting enterprise\npolicies and\nprocedures and\nappropriate national\nand foreign\ngovernment\nauthorities\n1.2 Passport application\ndocuments are\nchecked for accuracy,\ncompleteness and\nidentified\ndiscrepancies are\ncorrected or referred\nto client where\nnecessary\n1.3 Passport application\ndocuments are filed\nwith proper\nauthorities -DFA /\nEmbassies or\nConsulate and\ncorresponding fees\nare paid\n1.4 Passport is logged\nand released to client\naccording to existing\nenterprise policies\nand procedures\n1.1 Overview of\nPhilippine Passport\nLaw\n1.2 Updated DFA\nImplementing Rules\nand Regulations\n(IRR) or statutory\nrequirements\n1.3 Requirements of\npassport of other\ncountries and\nnationality\n1.4 Passport filing fees\nand procedures\n\n1.1 Communication skills\n1.2 Following enterprise\nprocedures\non\npassport application\n\n--- PDF PAGE 77 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 73\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Assist client\nin securing\nvisa and/or\nother permits\nand transit\npoints, as\napplicable\n2.1 Visa requirements for\nclient’s country of\ndestination are\ndetermined\n2.2 Visa applicant is\ninformed on the\nrequirements and fees\nrequired by preferred\ncountry of destination\n2.3 Where applicable, visa\napplicant is assisted in\npaying the fees,\nsecuring appointments\nand in filling up and\nsubmitting the\naccomplished forms\nrequired by the\ncountry of destination\nand/or transit points\n2.4 Visa documentary\nrequirements are\nprepared collected\nfrom the clients and\narranged according to\nthe requirements of\nthe country of\ndestination\n2.5 Document is filed with\nthe concerned\nEmbassy / Consulate.\nWhere applicable, visa\napplicant is informed\nof the date of personal\nappearance or\ninterview at the\nEmbassy.\n2.6 Visa applicant is\ninformed on\nprocedures on how\nand when the visa is\nto be released by the\nEmbassy or the visa\nprocessing entity\n2.9 Visa is released to\nclient according to\nexisting enterprise\npolicies and\nprocedures\n\n2.1 Visa requirements of\nother countries\n(Outbound)\n2.2 Basic Passport\ninformation\n2.3 Visa filing\n2.4 Procedures\n\n2.1 Researching for\nother countries’ visa\nrequirements as\nneeded\n2.2 Following enterprise\nprocedures on visa\napplication\n\n--- PDF PAGE 78 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 74\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Provide\nassistance in\nsecuring\nadditional\nrequirements\nfor travel\n3.1 Necessary\nsupporting\ndocuments are\ndetermined\n3.2 Applicant is assisted\nin filling up forms\nrequired by the\nconcerned authority\nand the required fees\nare collected\n3.3Document is filed with\nthe concern authority\n3.4 Applicant is informed\nwhen the required\ntravel documents will\nbe released by the\nconcerned authority\n3.5 Document is logged\nand released to client\naccording to existing\nenterprise policies\nand procedures\n\n3.1 Immigration\nclearances\n3.2 Filing fees and\nprocedures of\nconcerned\ngovernment\nagencies and\ndesignated third\nparty entity\n\n3.1 Communication skills\n3.2 Following enterprise\nprocedures on\nadditional\nrequirements for\ntravel\n\n--- PDF PAGE 79 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 75\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Supporting documents\nMay include:\n1.1 Change immigration status\n1.2 Philippine Retirement Authority\n1.3 Recognition of Dual Citizenship\n1.4 Philippine Statistics Authority (PSA)\n1.5 Department of Social Welfare and Development\n (DSWD)\n1.6 DFA Authentication of Documents\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of passport\nrequirements and procedures\n1.2 Demonstrate knowledge of visa documentation\nrequirements and procedure\n1.3 Demonstrate knowledge of basic Immigration\nprocedures and requirements\n1.4 Demonstrated ability to apply DFA, Embassies,\nand Bureau of Immigration rules and procedures\nwithin enterprise acceptable timeframes.\n1.5 Demonstrated ability to assist clients in acquiring\ntravel documents within the soonest time before\ndate of travel\n1.6 Communicated effectively with others to ensure\neffective work operation\n2. Resource implications\nThe following resources should be provided:\n2.1 Telephone, fax and email\n2.2 Computer with internet connection and reservation\nsystem or global distribution system\n2.3 Updated brochures\n2.4 Updated maps\n2.5 Updated Official Hotels & Resorts Guide or GDS\n2.6 Official Cruise line Guide or GDS\n2.7 Official Train Guide or GDS\n2.8 Updated Destination Travel Planner\n2.9 Tourism Calendar of Conferences & Events\n3. Methods of assessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation with Oral Questioning\n3.2 Demonstration with Oral Questioning\n3.3 Written Test\n3.4 Portfolio (identify documents with Interview)\n4. Context for assessment\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited\nAssessment Center\n\n--- PDF PAGE 80 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 76\nUNIT OF COMPETENCY: PROCESS THE ISSUANCE OF PASSAGE TICKETS AND\nOTHER RELATED DOCUMENTS\n\nUNIT CODE\n\n : TRS422304\n\nUNIT DESCRIPTOR : This unit deals with the skills and knowledge required to review\ndetails and payment of passage tickets and other travel related\ndocuments.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Collate travel\ndetails\n1.1 Travel details are\nencoded through\nelectronic or\nmanual means\n1.2 Travel details are\nvalidated with\nclients and any\nother travel related\ninformation in\naccordance with\nexisting enterprise\nprocedures\n1.3 Supplementary\ninformation\ncleared and\nrecorded with client\nin accordance to\nexisting enterprise\nprocedures\n1.1 Travel and tour\nterminologies\n1.2 Technical know-\nhow – travel\nrelated software,\nindustry rate and\ntariff sheets\n1.3 Enterprise forms\n1.4 Enterprise\nprocedures –\nstandard operating\nprocedures\n\n1.1 General technical\ncomputer skills\n1.2 Use of any Global\nDistribution Systems\n(GDS) Software -\nSabre, Amadeus,\nGalileo\n1.3 Use of Electronic\nDistribution System\nSoftware – online\nreservations and\nticketing systems for\ntravel industry\n1.4 Filing up of enterprise\nforms\n2. Process the\nissuance of\npassage\ntickets and\nother travel\nrelated\ndocuments\n2.1 Total cost of travel\nrequirements are\nchecked to ensure\naccuracy based on\nupdated local and/or\ninternational rates\n2.2 Travel information is\nreconfirmed to\nsupplier\n2.3 