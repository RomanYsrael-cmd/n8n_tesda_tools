  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section details the contents of the basic, common and core units of competency\nrequired in TRAVEL SERVICES NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 400311210\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and\nrelevant\ninformation is\naccessed from\nappropriate\nsources\n1.2 Effective\nquestioning,\nactive listening\nand speaking\nskills are used to\ngather and convey\ninformation\n1.3 Appropriate\nmedium is used\nto transfer\ninformation and\nideas\n1.4 Appropriate non-\nverbal\ncommunication is\nused\n1.5 Appropriate lines\nof communication\nwith supervisors\nand colleagues\nare identified and\nfollowed\n1.6 Defined workplace\n procedures for the\nlocation and\nstorage of\ninformation are\nused\n1.1 Effective verbal\nand nonverbal\ncommunication\n1.2 Different modes of\ncommunication\n1.3 Medium of\ncommunication in\nthe workplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n1.8 Workplace\netiquette\n\n1.1 Following simple\nspoken language\n1.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participating in\nworkplace meetings\nand discussions\n1.4 Preparing work-\nrelated documents\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n1.6 Relating/ Interacting\nwith people of\nvarious levels in the\nworkplace\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to\nworkplace\nrequirements\n1.8 Basic business\nwriting skills\n1.9 Interpersonal skills\nin the workplace\n1.10 Active-listening\nskills\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 4\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n1.7 Personal\ninteraction is\ncarried out clearly\nand concisely\n\n2. Perform\nduties\nfollowing\nworkplace\ninstructions\n2.1 Written notices\nand instructions\nare read and\ninterpreted in\naccordance with\norganizational\nguidelines\n2.2 Routine written\ninstruction are\nfollowed based on\nestablished\nprocedures\n2.3 Feedback is given\nto workplace\nsupervisor based\ninstructions/\ninformation\nreceived\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Where necessary,\nclarifications about\nroutine workplace\nprocedures and\nmatters\nconcerning\nconditions of\nemployment are\nsought and asked\nfrom appropriate\n sources\n2.6 Meetings\noutcomes are\ninterpreted and\nimplemented\n2.1 Effective verbal\nand non-verbal\ncommunication\n2.2 Different modes of\ncommunication\n2.3 Medium of\ncommunication in\nthe workplace\n2.4 Organizational/\nWorkplace\npolicies\n2.5 Communication\nprocedures and\nsystems\n2.6 Lines of\ncommunication\n2.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n2.8 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n2.9 Workplace\netiquette\n\n2.1 Following simple\nspoken instructions\n2.2 Performing routine\nworkplace duties\nfollowing simple\nwritten notices\n2.3 Participating in\nworkplace meetings\nand discussions\n2.4 Completing work-\nrelated documents\n2.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n2.6 Relating/\nResponding to\npeople of various\nlevels in the\nworkplace\n2.7 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n2.8 Basic\nquestioning/querying\n2.9 Skills in reading for\ninformation\n2.10 Skills in locating\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 5\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Complete\nrelevant\nwork-\nrelated\ndocuments\n3.1 Range of forms\nrelating to\nconditions of\nemployment are\ncompleted\naccurately and\nlegibly\n3.2 Workplace data is\nrecorded on\nstandard\nworkplace forms\nand documents\n3.3 Errors in recording\ninformation on\nforms/ documents\nare identified and\nacted upon\n3.4 Reporting\nrequirements to\nsupervisor are\ncompleted\naccording to\norganizational\nguidelines\n3.1 Effective verbal\nand non-verbal\ncommunication\n3.2 Different modes of\ncommunication\n3.3 Workplace forms\nand documents\n3.4 Organizational/\nWorkplace\npolicies\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n\n3.1 Completing work-\nrelated documents\n3.2 Applying operations\nof addition,\nsubtraction, division\nand multiplication\n3.3 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n3.4 Effective record\nkeeping skills\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate\nsources\nMay include:\n1.1.\nTeam members\n1.2.\nSupervisor/Department Head\n1.3.\nSuppliers\n1.4.\nTrade personnel\n1.5.\nLocal government\n1.6.\nIndustry bodies\n2. Medium\nMay include:\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation dissemination\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace-to-face communication\n2.7.\nElectronic media (disk files, cyberspace)\n3. Storage\nMay include:\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Workplace\ninteractions\nMay include:\n4.1.\nFace-to-face\n4.2.\nTelephone\n4.3.\nElectronic and two-way radio\n4.4.\nWritten including electronic means, memos,\ninstruction and forms\n4.5.\nNon-verbal including gestures, signals, signs\nand diagrams\n5. Forms\nMay include:\n5.1.\nHR/Personnel forms, telephone message forms,\nsafety reports\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 7\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using workplace communication\nequipment/systems\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting formal or\ninformal communication\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Fax machine\n2.2. Telephone\n2.3. Notebook\n2.4. Writing materials\n2.5. Computer with Internet connection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration with oral questioning\n3.2. Interview\n3.3. Written test\n3.4. Third-party report\n\n4. Context for\nAssessment\n4.1. Competency may be assessed individually in the\nactual workplace or through an accredited institution\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 8\n\n UNIT OF COMPETENCY: WORK IN A TEAM ENVIRONMENT\n\n UNIT CODE : 400311211\n\n UNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes to\n\nidentify one’s roles and responsibilities as a member of\na team.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Describe\nteam role\nand scope\n1.1 The role and\nobjective of the\nteam is identified\nfrom available\nsources of\ninformation\n1.2 Team parameters,\nreporting\nrelationships and\nresponsibilities\nare identified from\nteam discussions\nand appropriate\nexternal sources\n1.1 Group structure\n1.2 Group\ndevelopment\n1.3 Sources of\ninformation\n1.1 Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n1.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n2. Identify one’s\nrole and\nresponsibility\nwithin a team\n2.1 Individual roles\nand\nresponsibilities\nwithin the team\nenvironment are\nidentified\n2.2 Roles and\nobjectives of the\nteam is identified\nfrom available\nsources of\ninformation\n2.3 Team parameters,\nreporting\nrelationships and\nresponsibilities\nare identified\nbased on team\ndiscussions and\nappropriate\nexternal sources\n2.1 Team roles and\nobjectives\n2.2 Team structure\nand parameters\n2.3 Team\ndevelopment\n2.4 Sources of\ninformation\n\n2.1 Communicating\nwith others,\nappropriately\nconsistent with the\nculture of the\nworkplace\n2.2 Developing ways\nin improving work\nstructure and\nperforming\nrespective roles in\nthe group or\norganization\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 9\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms\nare elaborated in\nthe Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Work as a\nteam\nmember\n3.1 Effective and\nappropriate\nforms of\ncommunications\nare used and\ninteractions\nundertaken with\nteam members\nbased on\ncompany\npractices.\n3.2 Effective and\nappropriate\ncontributions\nmade to\ncomplement\nteam activities\nand objectives,\nbased on\nworkplace\ncontext\n3.3 Protocols in\nreporting are\nobserved based\non standard\ncompany\npractices.\n3.4 Contribute to\nthe\ndevelopment of\nteam work plans\nbased on an\nunderstanding\nof team’s role\nand objectives\n\n3.1 Communication\nProcess\n3.2 Workplace\ncommunication\nprotocol\n3.3 Team planning and\n decision making\n3.4 Team thinking\n3.5 Team roles\n3.6 Process of team\ndevelopment\n3.7 Workplace context\n\n3.1 Communicating\nappropriately,\nconsistent with the\nculture of the\nworkplace\n3.2 Interacting\neffectively with\nothers\n3.3 Deciding as an\nindividual and as\na group using\ngroup think\nstrategies and\ntechniques\n3.4 Contributing to\nResolution of\nissues and\nconcerns\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 10\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective\nof team\nMay include:\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement\nmaybe demonstrated on the job, either\nindividually or in a team environment\n2. Sources of\ninformation\nMay include:\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s\nspecifications and instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\nMay include:\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage,\nsafe handling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and\nquality guidelines\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 11\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Worked in a team to complete workplace activity\n1.2. Worked effectively with others\n1.3. Conveyed information in written or oral form\n1.4. Selected and used appropriate workplace language\n1.5. Followed designated work plan for the job\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2. Materials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Role play involving the participation of individual\nmember to the attainment of organizational goal\n3.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n3.4 Socio-drama and socio-metric methods\n3.5 Sensitivity techniques\n3.6 Written Test\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 12\n\nUNIT OF COMPETENCY :\nSOLVE/ADDRESS GENERAL WORKPLACE\nPROBLEMS\n\nUNIT CODE : 400311212\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired\nto\napply\nproblem-solving\ntechniques\nto\ndetermine the origin of problems and plan for their\nresolution. It also includes addressing procedural\nproblems through documentation, and referral.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify\nroutine\nproblems\n1.1 Routine problems\nor procedural\nproblem areas\nare identified\n1.2 Problems to be\ninvestigated are\ndefined and\ndetermined\n1.3 Current conditions\nof the problem are\nidentified and\ndocumented\n1.1 Current industry\nhardware and\nsoftware products\nand services\n1.2 Industry\nmaintenance,\nservice and\nhelpdesk practices,\nprocesses and\nprocedures\n1.3 Industry standard\ndiagnostic tools\n1.4 Malfunctions and\nresolutions\n\n1.1 Identifying\ncurrent industry\nhardware and\nsoftware products\nand services\n1.2 Identifying\ncurrent industry\nmaintenance,\nservices and\nhelpdesk\npractices,\nprocesses and\nprocedures.\n1.3 Identifying\ncurrent industry\nstandard\ndiagnostic tools\n1.4 Describing\ncommon\nmalfunctions and\nresolutions.\n1.5 Determining the\nroot cause of a\nroutine\nmalfunction\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 13\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Look for\nsolutions to\nroutine\nproblems\n2.1 Potential\nsolutions to\nproblem are\nidentified\n2.2 Recommendatio\nns about\npossible\nsolutions are\ndeveloped,\ndocumented,\nranked and\npresented to\nappropriate\nperson for\ndecision\n2.1 Current industry\nhardware and\nsoftware\nproducts and\nservices\n2.2 Industry service\nand helpdesk\npractices,\nprocesses and\nprocedures\n2.3 Operating\nsystems\n2.4 Industry standard\ndiagnostic tools\n2.5 Malfunctions and\nresolutions.\n2.6 Root cause\nanalysis\n2.1 Identifying\ncurrent industry\nhardware and\nsoftware\nproducts and\nservices\n2.2 Identifying\nservices and\nhelpdesk\npractices,\nprocesses and\nprocedures.\n2.3 Identifying\noperating system\n2.4 Identifying\ncurrent industry\nstandard\ndiagnostic tools\n2.5 Describing\ncommon\nmalfunctions and\nresolutions.\n2.6 Determining the\nroot cause of a\nroutine\nmalfunction\n3. Recommend\nsolutions to\nproblems\n3.1 Implementation\nof solutions are\nplanned\n3.2 Evaluation of\nimplemented\nsolutions are\nplanned\n3.3 Recommended\nsolutions are\ndocumented and\nsubmit to\nappropriate\nperson for\nconfirmation\n\n3.1 Standard\nprocedures\n3.2 Documentation\nproduce\n3.1 Producing\ndocumentation\nthat recommends\nsolutions to\nproblems\n3.2 Following\nestablished\nprocedures\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 14\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Problems/Procedural\nProblem\n\nMay include:\n1.1\nRoutine/non – routine processes and quality\nproblems\n1.2\nEquipment selection, availability and failure\n1.3\nTeamwork and work allocation problem\n1.4\nSafety and emergency situations and\nincidents\n1.5\n Work-related problems outside of own work\narea\n\n2. Appropriate person\nMay include:\n2.1\nSupervisor or manager\n2.2\nPeers/work colleagues\n2.3\nOther members of the organization\n3.\nDocument\n\nMay include:\n3.1\nElectronic mail\n3.2\nBriefing notes\n3.3\nWritten report\n3.4\nEvaluation report\n4.\nPlan\n\nMay include:\n4.1\nPriority requirements\n4.2\nCo-ordination and feedback requirements\n4.3\nSafety requirements\n4.4\nRisk assessment\n4.5\nEnvironmental requirements\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 15\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined the root cause of a routine problem\n1.2 Identified solutions to procedural problems.\n1.3 Produced documentation that recommends solutions\nto problems.\n1.4 Followed established procedures.\n1.5 Referred unresolved problems to support persons.\n\n2. Resource\nImplications\n2.1. Assessment will require access to a workplace over\nan extended period, or a suitable method of gathering\nevidence of operating ability over a range of\nsituations.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nCase Formulation\n3.2\nLife Narrative Inquiry\n3.3\nStandardized test\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other\nrelevant units of competency. Assessment will occur over a\nrange of situations, which will include disruptions to normal,\nsmooth operation. Simulation may be required to allow for\ntimely assessment of parts of this unit of competency.\nSimulation should be based on the actual workplace and\nwill include walk through of the relevant competency\ncomponents.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions.\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 16\nUNIT OF COMPETENCY :\nDEVELOP CAREER AND LIFE DECISIONS\n\nUNIT CODE\n : 400311213\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitudes in\nmanaging\none’s\nemotions,\ndeveloping\nreflective\npractice, and boosting self-confidence and developing\nself-regulation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Manage one’s\nemotion\n1.1 Self-management\nstrategies are\nidentified\n1.2 Skills to work\nindependently and to\nshow initiative, to be\nconscientious, and\npersevering in the\nface of setbacks and\nfrustrations are\ndeveloped\n1.3 Techniques for\neffectively handling\nnegative emotions\nand unpleasant\nsituation in the\nworkplace are\nexamined\n\n1.1 Self-\nmanagement\nstrategies that\nassist in\nregulating\nbehavior and\nachieving\npersonal and\nlearning goals\n(e.g. Nine self-\nmanagement\nstrategies\naccording to\nRobert Kelley)\n1.2 Enablers and\nbarriers in\nachieving\npersonal and\ncareer goals\n1.3 Techniques in\nhandling\nnegative\nemotions and\nunpleasant\nsituation in the\nworkplace\nsuch as\nfrustration,\nanger, worry,\nanxiety, etc.\n1.1 Managing\nproperly one’s\nemotions and\nrecognizing\nsituations that\ncannot be\nchanged and\naccept them and\nremain\nprofessional\n1.2 Developing self-\ndiscipline,\nworking\nindependently\nand showing\ninitiative to\nachieve personal\nand career goals\n1.3 Showing\nconfidence, and\nresilience in the\nface of setbacks\nand frustrations\nand other\nnegative\nemotions and\nunpleasant\nsituations in the\nworkplace\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 17\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Develop\nreflective\npractice\n2.1 Personal strengths\nand achievements,\nbased on self-\nassessment\nstrategies and\nteacher feedback\nare contemplated\n2.2 Progress when\nseeking and\nresponding to\nfeedback from\nteachers to assist\nthem in\nconsolidating\nstrengths,\naddressing\nweaknesses and\nfulfilling their\npotential are\nmonitored\n2.3 Outcomes of\npersonal and\nacademic\nchallenges by\nreflecting on\nprevious problem\nsolving and decision\nmaking strategies\nand feedback from\npeers and teachers\nare predicted\n2.1 Basic SWOT\nanalysis\n2.2 Strategies to\nimprove one’s\nattitude in the\nworkplace\n2.3 Gibbs’\nReflective\nCycle/Model\n(Description,\nFeelings,\nEvaluation,\nAnalysis,\nConclusion,\nand Action\nplan)\n2.1 Using the basic\nSWOT analysis\nas self-\nassessment\nstrategy\n2.2 Developing\nreflective practice\nthrough\nrealization of\nlimitations, likes/\ndislikes; through\nshowing of self-\nconfidence\n2.3 Demonstrating\nself-acceptance\nand being able to\naccept\nchallenges\n\n3. Boost self-\nconfidence and\ndevelop self-\nregulation\n3.1 Efforts for continuous\nself-improvement are\ndemonstrated\n3.2 Counter-productive\ntendencies at work\nare eliminated\n3.3 Positive outlook in life\nare maintained.\n3.1 Four\ncomponents of\nself-regulation\nbased on Self-\nRegulation\nTheory (SRT)\n3.2 Personality\ndevelopment\nconcepts\n3.3 Self-help\nconcepts (e. g.,\n7 Habits by\nStephen Covey,\ntransactional\nanalysis,\npsycho-spiritual\nconcepts)\n3.1 Performing\neffective\ncommunication\nskills – reading,\nwriting, conversing\nskills\n\n3.2 Showing affective\nskills – flexibility,\nadaptability, etc.\n\n3.3 Self-assessment\nfor determining\none’s strengths\nand weaknesses\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 18\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Self-management\nstrategies\nMay include:\n1.1\nSeeking assistance in the form of job coaching or\nmentoring\n1.2\nContinuing dialogue to tackle workplace grievances\n1.3\nCollective negotiation/bargaining for better working\nconditions\n1.4\nShare your goals to improve with a trusted co-worker or\nsupervisor\n1.5\nMake a negativity log of every instance when you catch\nyourself complaining to others\n1.6\nMake lists and schedules for necessary activities\n2. Unpleasant\nsituation\nMay include:\n2.1\nJob burn-out\n2.2\nDrug dependence\n2.3\nSulking\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Express emotions appropriately\n1.2 Work independently and show initiative\n1.3 Consistently demonstrate self-confidence and self-discipline\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to workplace and resource s\n2.2.\nCase studies\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration or simulation with oral questioning\n3.2. Case problems involving work improvement and\nsustainability issues\n3.3. Third-party report\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 19\n\nUNIT OF COMPETENCY :\nCONTRIBUTE TO WORKPLACE INNOVATION\n\n UNIT CODE\n :\n400311214\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\n\nrequired to make a pro-active and positive\n\ncontribution to workplace innovation.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Identify\nopportunities\nto do things\nbetter\n1.1 Opportunities for\nimprovement are\nidentified\nproactively in own\narea of work.\n1.2 Information are\ngathered and\nreviewed which\nmay be relevant to\nideas and which\nmight assist in\ngaining support for\nidea.\n1.1 Roles of individuals\nin suggesting and\nmaking\nimprovements.\n1.2 Positive impacts\nand challenges in\ninnovation.\n1.3 Types of changes\nand responsibility.\n1.4 Seven habits of\nhighly effective\npeople.\n\n1.1 Identifying\nopportunities to\nimprove and to do\nthings better.\nInvolvement.\n1.2 Identifying the\npositive impacts\nand the challenges\nof change and\ninnovation.\n1.3 Identifying\nexamples of the\ntypes of changes\nthat are within and\noutside own scope\nof responsibility\n2. Discuss\nand\ndevelop\nideas with\nothers\n2.1 People who could\nprovide input to\nideas for\nimprovements are\nidentified.\n2.2 Ways of\napproaching\npeople to begin\nsharing ideas are\nselected.\n2.3 Meeting is set with\nrelevant people.\n2.4 Ideas for follow up\nare review and\nselected based on\nfeedback.\n2.5 Critical inquiry\nmethod is used to\ndiscuss and\ndevelop ideas with\nothers.\n2.1 Roles of individuals\nin suggesting and\nmaking\nimprovements.\n2.2 Positive impacts\nand challenges in\ninnovation.\n2.3 Types of changes\nand responsibility.\n2.4 Seven habits of\nhighly effective\npeople.\n\n2.1 Identifying\nopportunities to\nimprove and to do\nthings better.\nInvolvement.\n2.2 Identifying the\npositive impacts\nand the challenges\nof change and\ninnovation.\n2.3 Providing examples\nof the types of\nchanges that are\nwithin and outside\nown scope of\nresponsibility\n2.4 Communicating\nideas for change\nthrough small\ngroup discussions\nand meetings.\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 20\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Integrate\nideas for\nchange in\nthe\nworkplace\n3.1 Critical inquiry\nmethod is used to\nintegrate different\nideas for change\nof key people.\n3.2 Summarizing,\nanalyzing and\ngeneralizing skills\nare used to extract\nsalient points in\nthe pool of ideas.\n3.3 Reporting skills\nare likewise used\nto communicate\nresults.\n3.4 Current Issues\nand concerns on\nthe systems,\nprocesses and\nprocedures, as\nwell as the need\nfor simple\ninnovative\npractices are\nidentified.\n3.1 Roles of individuals\nin suggesting and\nmaking\nimprovements.\n3.2 Positive impacts\nand challenges in\ninnovation.\n3.3 Types of changes\nand responsibility.\n3.4 Seven habits of\nhighly effective\npeople.\n3.5 Basic research\nskills.\n3.1 Identifying\nopportunities to\nimprove and to do\nthings better.\nInvolvement.\n3.2 Identifying the\npositive impacts\nand the challenges\nof change and\ninnovation.\n3.3 Providing examples\nof the types of\nchanges that are\nwithin and outside\nown scope of\nresponsibility.\n3.4 Communicating\nideas for change\nthrough small\ngroup discussions\nand meetings.\n3.5 Demonstrating\nskills in analysis\nand interpretation\nof data.\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 21\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Opportunities for\nimprovement\nMay include:\n1.1 Systems.\n1.2 Processes.\n1.3 Procedures.\n1.4 Protocols.\n1.5 Codes.\n1.6 Practices.\n2. Information\nMay include:\n2.1 Workplace communication problems.\n2.2 Performance evaluation results.\n2.3 Team dynamics issues and concerns.\n2.4 Challenges on return of investment\n2.5 New tools, processes and procedures.\n2.6 New people in the organization.\n3. People who could provide\ninput\nMay include:\n3.1 Leaders.\n3.2 Managers.\n3.3 Specialists.\n3.4 Associates.\n3.5 Researchers.\n3.6 Supervisors.\n3.7 Staff.\n3.8 Consultants (external)\n3.9 People outside the organization in the same\nfield or similar expertise/industry.\n3.10 Clients\n4. Critical inquiry method\nMay include:\n4.1\nPreparation.\n4.2\nDiscussion.\n4.3\nClarification of goals.\n4.4\nNegotiate towards a Win-Win outcome.\n4.5\nAgreement.\n4.6\nImplementation of a course of action.\n4.7\nEffective verbal communication. See our\npages: Verbal Communication and Effective\nSpeaking.\n4.8\nListening.\n4.9\nReducing misunderstandings is a key part of\neffective negotiation.\n4.10 Rapport Building.\n4.11 Problem Solving.\n4.12 Decision Making.\n4.13 Assertiveness.\n4.14 Dealing with Difficult Situations.\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 22\n5. Reporting skills\nMay include:\n5.1\nData management.\n5.2\nCoding.\n5.3\nData analysis and interpretation.\n5.4\nCoherent writing.\n5.5\nSpeaking.\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified opportunities to do things better.\n1.2 Discussed and developed ideas with others\non how to contribute to workplace innovation.\n1.3 Integrated ideas for change in the workplace.\n1.4 Analyzed and reported rooms for innovation\nand learning in the workplace.\n2. Resource Implications\nThe following resources should be provided:\n2.1\nPens, papers and writing implements.\n2.2\nCartolina.\n2.3\nManila papers.\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nPsychological and behavioral Interviews.\n3.2\nPerformance Evaluation.\n3.3\nLife Narrative Inquiry.\n3.4\nReview of portfolios of evidence and third-\nparty workplace reports of on-the-job\nperformance.\n3.5\nSensitivity analysis.\n3.6\nOrganizational analysis.\n3.7\nStandardized assessment of character\nstrengths and virtues applied.\n4. Context for Assessment\n4.1 Competency may be assessed individually in\nthe actual workplace or simulation\nenvironment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 23\nUNIT OF COMPETENCY\n: PRESENT RELEVANT INFORMATION\n\n UNIT CODE\n : 400311215\n\nUNIT DESCRIPTOR\n : This unit of covers the knowledge, skills and attitudes\n\nrequired to present data/information appropriately.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Gather\ndata/\ninformation\n1.1 Evidence, facts\nand information\nare collected\n1.2 Evaluation, terms\nof reference and\nconditions are\nreviewed to\ndetermine\nwhether\ndata/information\nfalls within\nproject scope\n\n1.1 Organisational\nprotocols\n1.2 Confidentiality\n1.3 Accuracy\n1.4 Business\nmathematics and\nstatistics\n1.5 Data analysis\ntechniques/proced\nures\n1.6 Reporting\nrequirements to a\nrange of audiences\n1.7 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n1.8 Organisational\nvalues, ethics and\ncodes of conduct\n\n1.1 Describing\norganisational\nprotocols relating\nto client liaison\n1.2 Protecting\nconfidentiality\n1.3 Describing\naccuracy\n1.4 Computing\nbusiness\nmathematics and\nstatistics\n1.5 Describing data\nanalysis\ntechniques/\nprocedures\n1.6 Reporting\nrequirements to a\nrange of audiences\n1.7 Stating legislation,\npolicy and\nprocedures relating\nto the conduct of\nevaluations\n1.8 Stating\norganisational\nvalues, ethics and\ncodes of conduct\n2. Assess\ngathered\ndata/\ninformation\n2.1 Validity of data/\ninformation is\nassessed\n2.2 Analysis\ntechniques are\napplied to assess\ndata/ information.\n2.3 Trends and\nanomalies are\nidentified\n2.4 Data analysis\ntechniques and\nprocedures are\ndocumented\n2.5 Recommendation\n2.1 Business\nmathematics and\nstatistics\n2.2 Data analysis\ntechniques/\nprocedures\n2.3 Reporting\nrequirements to a\nrange of audiences\n2.4 Legislation, policy\nand procedures\nrelating to the\nconduct of\nevaluations\n2.5 Organisational\n2.1 Computing\nbusiness\nmathematics and\nstatistics\n2.2 Describing data\nanalysis\ntechniques/\nprocedures\n2.3 Reporting\nrequirements to a\nrange of\naudiences\n2.4 Stating legislation,\npolicy and\nprocedures\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 24\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\ns a