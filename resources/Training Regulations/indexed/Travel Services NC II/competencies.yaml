ility to work\nwithin one’s\nallotted time and\nfinances is\nsustained.\n\n3.1 Optimization of\nworkplace\nresources\n3.2 5S procedures and\nconcepts\n3.3 Criteria for cost-\neffectiveness\n3.4 Workplace\nproductivity\n3.5 Impact of\nentrepreneurial\nmindset to\nworkplace\nproductivity\n3.6 Ways in fostering\nentrepreneurial\nattitudes:\n3.6.1 Quality-\nconsciousness\n3.6.2 Safety-\nconsciousness\n3.1 Implementing\npreservation and\noptimizing\nworkplace\nresources\n3.2 Observing\njudicious use of\nworkplace tools,\nequipment and\nmaterials\n3.3 Making\nconstructive\ncontributions to\noffice operations\n3.4 Sustaining ability\nto work within\nallotted time and\nfinances\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 35\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.Good practices\nMay include:\n1.1 Economy in use of resources\n1.2 Documentation of quality practices\n\n2.Resources utilization\nMay include:\n2.1 Consumption/ use of consumables\n2.2 Use/Maintenance of assigned equipment and\nfurniture\n2.3 Optimum use of allotted /available time\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the\ncandidate:\n1.1 Demonstrated ability to identify and sustain\ncost-effective activities in the workplace\n1.2 Demonstrated ability to practice\nentrepreneurial knowledge, skills and\nattitudes in the workplace.\n\n2. Resource Implications\nThe following resources should be provided:\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to\ndemonstrate the required tasks\n2.3 References and manuals\n2.3.1 Enterprise procedures manuals\n2.3.2 Company quality policy\n\n3. Methods of Assessment\nCompetency in this unit should be assessed\nthrough:\n3.1 Interview\n3.2 Third-party report\n\n4.Context of Assessment\n4.1 Competency may be assessed in workplace or\nin a simulated workplace setting\n4.2 Assessment shall be observed while tasks are\nbeing undertaken whether individually or in-\ngroup\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 36\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY : DEVELOP AND UPDATE INDUSTRY KNOWLEDGE\n\nUNIT CODE : TRS311201\n\nUNIT DESCRIPTOR : This unit of competency deals with the knowledge, skills\nrequired to access, increase and update industry\nknowledge. It includes seek information on the industry and\nupdate industry knowledge.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Seek\ninformation on\nthe industry\n1.1 Sources of\ninformation on the\nindustry are\ncorrectly identified\nand accessed\n1.2 Information to\nassist effective\nwork performance\nis obtained in line\nwith job\nrequirements\n1.3 Specific information\non sector of work is\naccessed and\nupdated\n1.4 Industry information\nis correctly applied\nto day-to-day work\nactivities\n1.1 Overview of quality\nassurance in the\nindustry\n1.2 Role of individual\nstaff members\n1.3 Industry information\nsources\n1.1 Ready skills needed\nto access industry\ninformation\n1.2 Basic competency\nskills needed to\naccess the internet\n2. Update\nindustry\nknowledge\n2.1 Informal and/or\nformal research is\nused to update\ngeneral knowledge\nof the industry\n2.2 Updated knowledge\nis shared with\ncustomers and\ncolleagues as\nappropriate and\nincorporated into\nday-to-day working\nactivities\n2.1 Role of individual\nstaff members\n2.2 Industry information\nsources\n2.1 Time management\n2.2 Ready skills needed\nto access industry\ninformation\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 37\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Develop and\nupdate local\nknowledge\n3.1 Local knowledge is\ndeveloped to assist\nqueries on\nlocal/nationa