        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Complied with industry practices and procedures\n1.2 Used interactive communication with others\n1.3 Complied with occupational, health and safety practices\n1.4 Promoted public relation among others\n1.5 Complied with service manual standards\n1.6 Demonstrated familiarity with company facilities,\nproducts and services\n1.7 Demonstrated ability to work effectively with others\n1.8 Applied company rules and standards\n1.9 Applied telephone ethics\n1.10 Applied correct procedure in using telephone, fax\nmachine, internet\n1.11 Handled customer complaints within limit of individual\nresponsibility\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Availability of telephone, fax machine, internet, etc.\n2.2 Availability of data on projects and services; tariff and\nrates, promotional activities in place etc.\n2.3 Availability of office supplies\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Practical demonstration\n4. Context for\nassessment\n4.1 Competency assessment may occur in workplace or any\nappropriately simulated environment.\n4.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 61\nCORE COMPETENCIES\n\n UNIT OF COMPETENCY : CAPTURE, RECORD AND RESPOND TO TRAVEL\nSERVICE REQUIREMENTS AND REQUESTS\n\n UNIT CODE\n\n :"
        },
        "source_text": "TRS311205\n\nUNIT DESCRIPTOR\n :\nThis unit of competency deals with the knowledge, skills and\nattitudes in providing effective customer service. It includes\ngreeting customer, identifying customer needs, delivering\nservice to customer, handling queries through telephone, fax\nmachine, internet and email and handling complaints, evaluation\nand recommendation.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Greet customer\n1.1 Customers are\ngreeted in line with\nenterprise procedure\n1.2 Verbal and non-verbal\ncommunications are\nappropriate to the given\nsituation\n1.3 Non-verbal\ncommunication of\ncustomer is observed\nresponding to customer\n1.4 Sensitivity to cultural\nand social differences\nis demonstrated\n1.1 Communication\n 1.1.1 Interactive\ncommunication with\nothers\n 1.1.2 Interpersonal\nskills/ social graces\nwith sincerity\n1.2 Attitude\n 1.2.1 Attentive,\npatient and cordial\n 1.2.2 Eye-to-eye\n contact\n 1.2.3 Maintain\n teamwork and\n cooperation\n1.3 Theory\n 1.3.1 Interview\n techniques\n 1.3.2 Communication\nprocess\n 1.3.3 Communication\n barriers\n1.1 Effective\ncommunicatio\nn skills\n1.2 Non-verbal\ncommunicatio\nn - body\nlanguage\n1.3 Good time\nmanagement\n1.4 Ability to work\ncalmly and\nunobtrusively\neffectively\n\n2. Identify\ncustomer needs\n2.1 Appropriate\ninterpersonal skills\nare used to ensure that\ncustomer needs are\naccurately identified\n2.2 Customer needs are\nassessed for urgency\nso that priority for\nservice delivery can be\nidentified\n2.3 Customers are provided\nwith information\n2.1 Communication\n2.1.1 Interactive\ncommunication with\nothers\n2.1.2 Interpersonal\nskills/ social graces\nwith sincerity\n2.2 Safety Practices\n2.2.1 Safe work\npractices\n2.2.2 Personal\nhygiene\n2.3 Attitude\n2.3.1 Attentive, patient and\ncordial\n2.3.2 Eye-to-eye contact\n2.3.3 Maintain teamwork\nand cooperation\n2.1 Effective\ncommunicatio\nn skills\n2.2 Non-verbal\ncommunicatio\nn - body\nlanguage\n2.3 Good time\nmanagement\n2.4 Ability to work\ncalmly and\nunobtrusively\neffectively\n\n--- PDF PAGE 60 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 56\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n2.4 Personal limitation in\naddressing customer\nneeds is identified and\nwhere appropriate,\nassistance is sought\nfrom supervisor\n\n2.4 Theory\n 2.4.1 Selling/upselling\n techniques\n 2.4.2 Interview\ntechniques\n 2.4.3 Conflict resolution\n 2.4.4 Communication\n process\n 2.4.5 Communication\n barriers\n\n3. Deliver service\nto customer\n3.1 Customer needs are\npromptly attended to in\nline with enterprise\nprocedure\n3.2 Appropriate rapport is\nmaintained with\ncustomer to enable\nhigh quality service\ndelivery\n3.3 Opportunity to enhance\nthe quality of service\nand products are taken\nwherever possible\n\n3.1 Communication\n 3.1. Interactive\n communication\nwith others\n 3.1.2 Interpersonal\nskills/social\ngraces with\n sincerity\n3.2 Safety Practices\n 3.2.1 Safe work\n practices\n 3.2.2 Personal hygiene\n3.3 Attitude\n 3.3.1 Attentive, patient\n and cordial\n 3.3.2 Eye-to-eye\n contact\n 3.3.3 Maintain\n teamwork\n and cooperation\n3.4 Theory\n 3.4.1 Selling/upselling\n techniques\n 3.4.2 Interview\n techniques\n 3.4.3 Conflict\nresolution\n 3.4.4 Communication\n process\n 3.4.5 Communication\n Barriers\n\n3.1 Effective\ncommunicatio\nn skills\n3.2 Non-verbal\ncommunicatio\nn - body\nlanguage\n3.3 Good time\nmanagement\n3.4 Ability to work\ncalmly and\nunobtrusively\neffectively\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 57\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\