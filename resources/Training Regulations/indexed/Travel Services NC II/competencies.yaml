        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Interpreted the customer’s requirements correctly and\nconfirmed specific services to the customer.\n1.2 Coordinated effectively, the booking process from initial\nrequest to finalization of the booking\n1.3 Kept records of all bookings made accurately.\n1.4 Demonstrated knowledge on industry booking systems\nand procedures for a range of products and services. (The\nrange of products and services booked will vary according\nto the industry sector and workplace)\n1.5 Communicated effectively with others to ensure effective\nwork operation\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Telephone, fax and email\n2.2 Computer with internet connection and reservation system\nor global distribution system (GDS)\n2.3 Updated brochures\n2.4 Updated maps\n2.5 Updated Official Hotels & Resorts Guide or GDS\n2.6 Official Cruise line Guide or GDS\n2.7 Official Train Guide or GDS\n2.8Updated Destination Travel Planner\n2.9Tourism Calendar of Conferences & Events\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation with Oral Questioning\n3.2 Demonstration with Oral Questioning\n3.3 Written Test\n3.4 Portfolio (identify the documents with Interview)\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 76 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 72\n\nUNIT OF COMPETENCY : PROVIDE ASSISTANCE IN TRAVEL DOCUMENTATION\n PREPARATION\nUNIT CODE\n\n :"
        },
        "source_text": "TRS422302\n\nUNIT DESCRIPTOR : This unit deals with the skills and knowledge required to make\nand administer bookings for travel related products and\nservices. It describes the coordination of bookings with\nsuppliers, normally a business to business transaction.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nBold and italicized terms\nare elaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Administer\nclient file and\nidentify\nbooking\nrequirements\n1.1 Clients’ details of\nnew or existing\nrequirements are\ninterpreted\n1.2 Client’s new or\nexisting booking\nrecord is created\nor updated\n1.3 Products and\nservices to be\nbooked are identified\naccording to the\ncustomer’s\nrequirements and\nrequests\n1.4 Supplier is selected\naccording to client’s\nrequirements and\nrequests any pre-\nnegotiated\nenterprise\narrangements\n1.5 Clients’ required\ndocuments for\ntravel purposes are\ncollected and\nchecked for validity\nbased on enterprise\nprocedures\n1.6 Client’s financial\nrecord are checked\nin accordance to\nenterprise policies\nand procedures\n\n1.1 World geography\n1.2 Product knowledge\nas appropriate to\nspecific industry\nsector\n1.3 Principles that\nunderpin\nreservations and\nbooking\nprocedures\n1.4 Relationships\nbetween different\nsectors of the\ntourism industry in\nrelation to\nreservations and\nbookings\n1.5 Familiarity with\ncomponents of a\nTour package\n1.1 Interpretation of the\ncustomer’s\nrequirements\n1.2 Interpretation of any\nquotations previously\nsupplied to customer\n1.3 Communication Skills\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 68\n\nELEMENTS\nPERFORMANCE CRITERIA\nBold and italicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Request\nservices\n2.1 Products and services are\nrequested from suppliers\nusing the appropriate\nmethod in accordance\nwith existing enterprise\nprocedures\n2.2 Details of the required\nbooking are provided to\nthe suppliers to ensure\nthe customer receives the\ncorrect product or service\nincluding:\n2.2.1 Customer details\n2.2.2 Inclusive date, time\nand location of\ncommencement and\nconclusion of service\n2.2.3 Any pre-negotiated\ncosts and payment detail\n2.2.4 Nature of service to\nbe provided\n2.2.5 Special request or\nrequirements\n2.2.6 Special permits\n2.3 Multiple services are\nrequested simultaneously\nin the most practical and\nsequential order\n2.4 Alternative products or\nservices are requested if\ndesired bookings are not\navailable\n2.5 Changes made to original\nbookings are identified\nand adjustments to\nbookings are made\naccordingly\n2.6 Revisions to bookings are\nmade as requested/\nrequired including\nadjustment to other\narrangements, accordingly\n2.1 Booking forms\n2.2 Global\nDistribution\nSystem\n(GDS)\nOnline Booking\nSystems\n2.3 Manual\nProcedures\n2.4 Negotiated\ncosts,\ncontractual\narrangements of\npreferred\nsupplier/s\n2.1 Demonstration of\nskills in booking and\ncoordinating supplier\nservices for multiple\nand different\ncustomer situations\nand varying products\nand services (ideally\nas a component of\nintegrated work\nactivity)\n2.2 Use of Information\nand Communication\nTechnology\nequipment.\n2.3 Use of industry-\ncurrent operational\ndocumentation eg.\ndetails of supplier\ncontracts and\ncustomer files\n2.4 The coordination and\ncompletion of\nbookings\n2.5 Maintenance of files\nwithin time frames\nand constraints that\nreflect typical industry\npractice\n2.6 Communication Skills\n\n--- PDF PAGE 73 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 69\n\nELEMENTS\nPERFORMANCE CRITERIA\nBold and italicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Record\nstatus of\nrequest\n3.1 Records of bookings\nmade are filed, including\nconfirmations in\naccordance with existing\nenterprise policies and\nprocedures\n3.2 Files are monitored to\nensure that all\nconfirmations have been\nreceived and follow up\npending\nbookings/reservations\n3.3 Alternative options are\nundertaken managed in\nrelation to bookings\nmade in accordance\nwith system, supplier\nand/or existing enterprise\npolicies and procedures\n\n3.1 Record\nManagement\n(softcopy and\nhardcopy) –\nincluding GDS\nqueues and\nother supplier’s\nwaitlists/\n3.2 pending\nrequests\n3.1 Organization and\nFiling Skills\n3.2 Communication Skills\n4. Collect\npayment\n4.1 Payment is collected and\naccepted from clients\naccording to existing\nenterprise policies and\nprocedures\n4.2 Proof of payment is issued\nto the client\n\n4.1 Basic\nMathematics\n4.2 Enterprise\npolicies and\nprocedures\n4.3 Enterprise forms\n4.1 Issuance of enterprise\nforms\n4.2 Communication Skills\n5. Update and\nfinalize\nbookings\n5.1Amendments/adjustments\nmade are accurately\nrecorded in accordance\nwith existing enterprise\npolicies and procedures\n5.2 Clients payment is\nverified with appropriate\ndepartment\n5.3 Payments required by\nthe supplier are\nprocessed at the\nappropriate time in\naccordance with existing\nenterprise procedures\n5.4 Booking changes are\nrelayed to suppliers in\naccordance with agreed\nprocedures and any\ncontractual arrangements\n5.5 Client’s final details and\nrequirements are\nfinalized with suppliers in\naccordance with the\nexisting enterprise\nprocedures\n5.1 Operational\nknowledge\nrelevant to\nfinalization of\ntransaction, such\nas: Purchase\nOrder, Ticket\nIssuance,\nExchange\nVoucher, Tour\nVoucher\n5.2 Terms and\nconditions of\nbookings\n\n5.1 Demonstration of\nskills in\nreconfirmation, and\nfinalization of booking\nservices\n5.2 Use of Information\nand Communication\nTechnology\nequipment\n5.3 Communication Skills\n\n--- PDF PAGE 74 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 70\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Client details\nMay include:\n1.1 Name/s\n1.2 Contact Number – Mobile and Landline\n1.3 Address – Email and Home\n1.4 Date of birth\n1.5 Passport details (for international travel)\n1.6 Travel Industry membership/loyalty\n2. Supplier’s services\nMay include:\n2.1 Supplier’s (Travel) products and services-\n2.2 Transportation\n2.3 Transfers\n2.4 Accommodations\n2.5 Entertainment\n2.6 Tours\n2.7 Cruises\n2.8 Entrance to attractions and activities\n2.9 Tourist guiding services\n2.10 Food and Beverage\n2.11 Travel Insurance\n2.12 Miscellaneous Services\n2.13 Other requirements of the client\n3. Special Permits\nMay include:\n3.1 Travel Order (for government employees)\n3.2 DSWD Clearance (for minors)\n3.3 Bureau of Immigration requirements (for\nforeigners)\n3.4 Medical Certificate\n3.5 Travel Exemption Certificate (TEC)\n3.6 Reduce Travel Tax Certificate (RTTC)\n3.7 Overseas Employment Certificate (OEC)\n4. Additional and alternative\nMay include:\n4.1 Additional, refers to products and services\nthat are recommended of interest to the\nclients\n4.2 Alternative, refers to products and services\nrecommended if original requirements are\nnot available\n5. Type and mode of response\nMay include:\n5.1 Type, refers to Inquiry, Acknowledgement,\nProposal, Clarification, Amendment,\nConfirmation, Re-confirmation, Cancellation.\n5.2 Mode\n5.2.1 Face to face\n5.2.2 Telephone – Landline / Mobile\n5.2.3 SMS\n5.2.4 Fax\n5.2.5 Internet – Email / Social Media\n5.2.6 Mail/courier service\n\n--- PDF PAGE 75 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 71\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidences that the candidate:\n1.1 Interpreted the customer’s requirements correctly and\nconfirmed specific services to the customer.\n1.2 Coordinated effectively, the booking process from initial\nrequest to finalization of the booking\n1.3 Kept records of all bookings made accurately.\n1.4 Demonstrated knowledge on industry booking systems\nand procedures for a range of products and services. (The\nrange of products and services booked will vary according\nto the industry sector and workplace)\n1.5 Communicated effectively with others to ensure effective\nwork operation\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Telephone, fax and email\n2.2 Computer with internet connection and reservation system\nor global distribution system (GDS)\n2.3 Updated brochures\n2.4 Updated maps\n2.5 Updated Official Hotels & Resorts Guide or GDS\n2.6 Official Cruise line Guide or GDS\n2.7 Official Train Guide or GDS\n2.8Updated Destination Travel Planner\n2.9Tourism Calendar of Conferences & Events\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation with Oral Questioning\n3.2 Demonstration with Oral Questioning\n3.3 Written Test\n3.4 Portfolio (identify the documents with Interview)\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 76 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 72\n\nUNIT OF COMPETENCY : PROVIDE ASSISTANCE IN TRAVEL DOCUMENTATION\n PREPARATION\nUNIT CODE\n\n :"
