        "source_text": "TRS311202\n\nUNIT DESCRIPTOR : This unit of competency deals with the knowledge, skills and\nattitudes in observing workplace hygiene procedures. It\nincludes following hygiene procedures and identifying and\npreventing hygiene risks.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Follow\nhygiene\nprocedures\n1.1 Workplace hygiene\nprocedures are\nimplemented in line\nwith enterprise and\nlegal requirements\n1.2 Handling and\nstorage of items are\nundertaken in line\nwith enterprise and\nlegal requirements\n1.1 Typical hygiene and\ncontrol procedures\nin the hospitality and\ntourism industries\n1.2 Overview of\nlegislation and\nregulation in relation\nto food handling,\npersonal and\ngeneral hygiene\n1.3 Knowledge on\nfactors which\ncontribute to\nworkplace hygiene\nproblems\n1.4 General hazards in\nhandling of food,\nlinen and laundry\nand garbage,\nincluding major\ncauses of\ncontamination and\ncross-infection\n\n1.1 Ability to follow\ncorrect procedures\nand instructions\n1.2 Ability to handle\noperating tools/\nequipment\n1.3 Application to\nhygiene principles\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 41\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Identify and\nprevent\nhygiene risks\n2.1 Potential hygiene\nrisks are identified\nin line with\nenterprise\nprocedures\n2.2 Action to minimize\nand remove risks\nare taken within\nscope of individual\nresponsibility of\nenterprise/legal\nrequirements\n2.3 Hygiene risks\nbeyond the control\nof individual staff\nmembers are\nreported to the\nappropriate person\nfor follow up\n\n2.1 Typical hygiene and\ncontrol procedures\nin the hospitality and\ntourism industries\n2.2 Overview of\nlegislation and\nregulation in relation\nto food handling,\npersonal and\ngeneral hygiene\n2.3 Knowledge on\nfactors which\ncontribute to\nworkplace hygiene\nproblems\n2.4 General hazards in\nhandling of food,\nlinen and laundry\nand garbage,\nincluding major\ncauses of\ncontamination and\ncross-infection\n2.5 Sources of and\nreasons for food\npoisoning\n2.1 Ability to follow\ncorrect procedures\nand instructions\n2.2 Application to\nhygiene principles\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 42\n\nRAGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hygiene procedures\nMay include:\n1.1 Safe and hygienic handling of food and beverage\n1.2 Regular hand washing\n1.3 Correct food storage\n1.4 Appropriate and clean clothing\n1.5 Avoidance of cross-contamination\n1.6 Safe handling disposal of linen and laundry\n1.7 Appropriate handling and disposal of garbage\n1.8 Cleaning and sanitizing procedures\n1.9 Personal hygiene\n1.10 Proper grooming\n\n2. Hygiene risk\nMay include:\n2.1 Bacterial and other contamination arising from\npoor handling of food\n2.2 Inappropriate storage of foods\n2.3 Storage at incorrect temperatures\n2.4 Foods left uncovered\n2.5 Poor personal hygiene practices\n2.6 Poor work practices\n2.6.1 Cleaning\n2.6.2 Housekeeping\n2.6.3 Food handling\n2.6.4 Vermin\n2.6.5 airborne dust\n2.7 Cross-contamination through cleaning\ninappropriate cleaning practices\n2.8 Inappropriate handling of potentially infectious\nlinen\n\n2.9 Contaminated wastes such as blood and body\nsecretions\n2.10 Disposal of garbage and contaminated or\npotentially contaminated wastes\n3. Minimizing or removing\n risk\nMay include:\n3.1 Auditing staff skills and providing training\n3.2 Ensuring policies and procedures are followed\nstrictly\n3.3 Audits or incidents with follow up actions\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 43\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Followed hygiene procedures\n1.2 Identified and responded to hygiene risk\n1.3 Practiced personal grooming and hygiene\n2. Resource\nimplications\nThe following resources should be provided:\n2.1 Hygiene procedures, actual or simulated workplace,\nproducts used in hotel/restaurant /tourism workplace\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Practical demonstration\n4. Context for\nassessment\n4.1 Competency assessment may occur in workplace or any\nappropriately simulated environment.\n4.2 Assessment may be performed on multiple occasions\ninvolving a combination of direct, indirect and\nsupplementary forms of evidence.\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 44\n\nUNIT OF COMPETENCY:\n PERFORM COMPUTER OPERATIONS\n\nUNIT CODE :"
