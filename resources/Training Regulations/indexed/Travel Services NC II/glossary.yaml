  "source_text": "\nGLOSSARY OF TERMS:\n\n1. APT\n\nAirline Passenger Tariff\n\n2. BI\n\nBureau of Immigration\n\n3. BIR\n\nBureau of Internal Revenue\n\n4. CIQ\n\nCustom Immigration and Quarantine\n\n5. BOOKING CLASS\nrefers to the category according to difficulty and\nthe complexity of skills and the knowledge\nrequired of the job. Also refers to the category of\nservice in a transportation\n\n6. CRS\n\nComputerized Reservation System\n\n7. CFO\n\nCommission on Filipinos Overseas\n\n8. DFA\n\nDepartment of Foreign Affairs\n\n9. DOCUMENTATION OFFICER\nrefers to the person employed by the travel\nagency to facilitate the issuance of travel\ndocuments\nand\nvisas,\nbirth\ncertificates,\nimmigration clearances, etc. clients with the right\ndocuments to the corresponding government\nagencies or embassies concerned.\n\n10. E – BOOKING\nElectronic Request / Reservation\n\n11. EMBASSY / CONSULATE\nthe representative office of the sovereign state in\nanother country that recognize them.\n\n12. GATEWAY\nEntry / Exit point of a destination\n\n13. GDS\nGlobal Distribution System\n\n14. GMT\nGreenwich Meridian Time\n\n15. IATA AREA CONFERENCES\nInternational Air Transport Association defined\ngeography.\n\n16. IMMIGRATION DOCUMENTS\nrefers to the documents issued by the Bureau of\nImmigration to resident and non – resident alien\nbased on immigration status.\n\n17. INTERNET\nElectronic Information Distribution System\n\n18. LGU\nLocal Government Unit\n\n19. MIRG\nManila Interline Reservation Group that dictates\nthe proper reservation procedures\n\n20. OAG\nOfficial Airline Guide\n\n21. OHS\nOccupational Health and Safety\n\n22. OSG\nOffice of the Solicitor General\n\n23. OJT\nOn – the – job Training\n\n--- PDF PAGE 116 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 112\n\n24. PASSPORT\nrefers to\nthe\ntravel document\nissued\nby\ngovernment to its citizens for travel and\nidentification purposes.\n\n25. PNR\nPassenger Name Record, where the history and\ninformation pertinent to the travel requirements of\na client is stored\n\n26. POEA\nPhilippine Overseas Employment Agency\n\n27. PROCESSING\ninvolves submission /follow – up and release of\ndocuments to Bureau of Immigration, Department\nof\nForeign\nAffairs,\nEmbassies\nand\nother\ngovernment agencies and includes paying the\nnecessary fees.\n\n28. RESERVATION\nrefers to an advance request for a product or\nservice\n\n29. RESERVATION OFFICER\nrefers to the person assigned to make a\nreservation of airline seat, hotel car rental and\nother travel related services with a supplier (air,\nsea or land).\n\n30. RETRIEVAL\nrefers to a summary of information pertinent to\ntravel requirements of the client.\n\n31. SEC\nSecurity and Exchange Commission\n\n32. TICKETING OFFICER\nrefers to the person assigned to write Airline\nTickets and Miscellaneous Charge Order of\nAirlines and other travel related services.\n\n33. TIM/TIMATIC\nTravel Information Manual/Travel Information\nElectronic version\n\n34. TRAVEL DOCUMENTS\nrefers to a permit issued by a sovereign state to\nits citizen in lieu of a passport.\n\n35. VISA\na permit issued by the embassy / consulate of a\ncountry allowing bearer the privilege of entry and\nexit to said country\n\n36. PASSAGE\nmovements of individual from point of origin to\npoint of destination by air, sea or land\n\n37. TRAVEL DOCUMENTS\nan official government-issued documents that\ncontain identification and information of the\nbearer\n\n38. TRAVEL DOCUMENTATION\nare enterprise-issued documents that specify\nservices to be provided to the bearer (including\ncontract of carriage or ticket)\n\n--- PDF PAGE 117 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 113\n\nTRAINING REGULATIONS (TR)\n",
