      "text": "1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "number": "4.1",
      "text": "1 Assessment shall cover all the competencies of the qualification with the basic and common units integrated or assessed concurrently with the core units of competency."
    },
    {
      "number": "4.1",
      "text": "2 A National Certificate (NC) shall be issued when a candidate has demonstrated competence in all the units of competency that comprised the Training Regulations for Travel Services NC II."
    },
    {
      "number": "4.1",
      "text": "3 The following are qualified to apply for assessment and certification:"
    },
    {
      "number": "4.1",
      "text": "3.1 Candidates and/or graduates of tourism and hospitality degree programs with knowledge in the use of Global Distribution System (GDS);"
    },
    {
      "number": "4.1",
      "text": "3.2 Graduates of the Travel Services NC II (consisting of 120 lecture hours + 200 hours of supervised industry training);"
    },
    {
      "number": "4.1",
      "text": "3.3 K-12 graduates of Home Economics Strand with Travel Services NC II (consisting of 120 lecture hours + 200 hours of supervised industry training);"
    },
    {
      "number": "4.1",
      "text": "3.4 Industry practitioner with knowledge in Global Distribution System (GDS) and at least two (2) years of work in travel services."
    },
    {
