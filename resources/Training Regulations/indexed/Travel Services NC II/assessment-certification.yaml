      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 Assessment shall cover all the competencies of the qualification with the basic and common units integrated or assessed concurrently with the core units of competency. 4.1.2 A National Certificate (NC) shall be issued when a candidate has demonstrated competence in all the units of competency that comprised the Training Regulations for Travel Services NC II. 4.1.3 The following are qualified to apply for assessment and certification: 4.1.3.1 Candidates and/or graduates of tourism and hospitality degree programs with knowledge in the use of Global Distribution System (GDS); 4.1.3.2 Graduates of the Travel Services NC II (consisting of 120 lecture hours + 200 hours of supervised industry training); 4.1.3.3 K-12 graduates of Home Economics Strand with Travel Services NC II (consisting of 120 lecture hours + 200 hours of supervised industry training); 4.1.3.4 Industry practitioner with knowledge in Global Distribution System (GDS) and at least two (2) years of work in travel services. 4.1.4 Existing National Certificates (NCs) in Travel Services NC II shall remain valid until its expiry. To renew the certificate, individuals have to undergo assessment in the amended TR. TRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)"
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre- assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior ` 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. TRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 108"
