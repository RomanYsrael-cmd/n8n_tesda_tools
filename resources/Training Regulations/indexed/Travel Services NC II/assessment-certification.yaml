  "source_text": "SECTION 4\nASSESSSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 Assessment shall cover all the competencies of the qualification with the\nbasic and common units integrated or assessed concurrently with the core\nunits of competency.\n\n4.1.2 A National Certificate (NC) shall be issued when a candidate has\ndemonstrated competence in all the units of competency that comprised\nthe Training Regulations for Travel Services NC II.\n\n4.1.3 The following are qualified to apply for assessment and certification:\n\n4.1.3.1\nCandidates and/or graduates of tourism and hospitality degree\nprograms with knowledge in the use of Global Distribution\nSystem (GDS);\n4.1.3.2\nGraduates of the Travel Services NC II (consisting of 120\nlecture hours + 200 hours of supervised industry training);\n4.1.3.3\nK-12 graduates of Home Economics Strand with Travel\nServices NC II (consisting of 120 lecture hours + 200 hours of\nsupervised industry training);\n4.1.3.4\nIndustry practitioner with knowledge in Global Distribution\nSystem (GDS) and at least two (2) years of work in travel\nservices.\n\n4.1.4 Existing National Certificates (NCs) in Travel Services NC II shall remain\nvalid until its expiry. To renew the certificate, individuals have to undergo\nassessment in the amended TR.\n\n--- PDF PAGE 111 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)\n 107\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for\nassessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\n\n--- PDF PAGE 112 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2019) 108\n\n"
