      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall provide Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: TRAVEL SERVICES\n\nNC Level: II\n\nNominal Training Duration: 37 Hrs. (Basic)\n\n 28 Hrs. (Common)\n\n 72 Hrs. (Core)\n 137 Hours\n\n 200 Hours - Supervised Industry Training (SIT)\n\nCourse Description:\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involve in processing request for\nindependent travellers, arranging reservations for travel related services and assisting in\nsecuring travel documentation and issuing travel documents. This includes classroom\nlearning activities and practical work in actual work site or simulation area.\n\nTo complete the course, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 86 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)\n 82\n\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different Types o