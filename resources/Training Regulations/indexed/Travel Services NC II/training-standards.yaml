ter, memorandum, formal business\nproposal\n• Update the manual or electronic file generated\nbased on the response sent or provided\n• Establishing when and why a follow-up is required\nor expected and conduct/deliver follow-up\n\n1.4 Collect payment\n• Basic accounting and finance terminology,\ndefinitions and forms\n• Accounting &\nfinance\nlectures\n• Discussion\n• Practical\napplication\nexercises\n•\nHands-on GDS\nTraining\n•\nHands-on\nTraining in\nLaboratory\n• Supervised\nIndustry\n• Written tests\n• Observation of\npractical skill\nexercise\n• Industry-\nsupervised\nevaluation\n(practicum\nevaluation)\n\n• Establishing of payment type and appropriate\nenterprise payment form and procedures\n\n• Issuing a Payment Slip and/or Provisional Receipt\nmanually or electronically per enterprise\nprocedures.\n• Determination of enterprise policy on the issuing\nof Official Receipts\n• Coordinate with accounting department the\nissuance of invoice or billing statement per\nenterprise procedures\n• Coordinate with finance department the collection\nof payment per enterprise policy\n\n--- PDF PAGE 102 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)\n 98\nUnit of Competency\n(Core Competency)\nLearning Outcomes\n(Elements)\nLearning Activities\n(May derived from Performance Criteria, Required\nKnowledge, Required Skills)\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Processing Credit Card payments as per the credit\ncard company procedures and enterprise policy\nTraining (SIT)\n2. Create travel-\nrelated\nreservations and\ntransactions\n2.1 Administer client\nfile and identify\nbooking\nrequirements\n•\nReview client’s profile and travel requirements\n•\nAnalyze client’s profile and travel requirements\n•\nReview and analyze supplier’s products and\nservices\n• Demonstration\n• Discussion\n• Lecture\n• Hands-on GDS\nTraining\n• Hands-on\nTraining in\nLaboratory\n• Supervised\nIndustry\nTraining (SIT)\n\n• Written Test\n• Demonstration\nof Practical\nSkills\n• Individual/\nGroup Project\nor Report\n24 hours\n2.2 Request services\n\n•\nEnumerate reservations mode\n•\nEstablish the reservations mode based on\nsupplier’s procedures and/or special\narrangements\n•\nMake actual bookings/reservations\n•\nObtain confirmation\n•\nIf unable to confirm, source for alternative\nsupplier\n\n• Demonstration\n• Discussion\n• Lecture\n• Hands-on GDS\nTraining\n• Hands-on\nTraining in\nLaboratory\n• Supervised\nIndustry\nTraining (SIT)\n\n• Written Test\n• Demonstration\nof Practical\nSkills\n• Individual/\nGroup Project\nor Report\n2.3 Record status of\nrequest\n\n•\nFill-up of enterprise record request forms\n•\nRecord reservations status and reconfirm rates\n\n• Demonstration\n• Lecture-\nDiscussion\n• Hands-on GDS\nTraining\n• Hands-on\nTraining in\n• Written Test\n• Demonstration\nof Practical\nSkills\n• Individual/\nGroup Project\nor Report\n\n--- PDF PAGE 103 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)\n 99\nUnit of Competency\n(Core Competency)\nLearning Outcomes\n(Elements)\nLearning Activities\n(May derived from Performance Criteria, Required\nKnowledge, Required Skills)\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\nLaboratory\n• Supervised\nIndustry\nTraining (SIT)\n2.4 Collect payment\n•\nExplain how to collect and accept payment from\nclients\n•\nEnumerate existing enterprise policies and\nprocedures\n\n• Demonstration\n• Lecture-\nDiscussion\n• Supervised\nIndustry\nTraining (SIT)\n• Written Test\n• Demonstration\nof Practical\nSkills\n• Individual/\nGroup Project\nor Report\n2.5 Update and\nfinalize bookings\n\n•\nUpdate the manual or electronic file generated\nbased on the response received or provided\n•\nEstablish if a follow-up is required or expected\n\n• Demonstration\n• Lecture-\nDiscussion\n• Hands-on GDS\nTraining\n• Hands-on\nTraining in\nLaboratory\n• Supervised\nIndustry\nTraining (SIT)\n• Written Test\n• Demonstration\nof Practical\nSkills\n• Individual/\nGroup Project\nor Report\n\n3. Provide\nassistance in\ntravel\ndocumentation\npreparation\n3.1 Assist with\nclient’s passport\napplication\n•\nEstablishing whether passport application is new\nor renewal\n•\nPreparing the checklist of requirements suitable\nfor the application\n•\nHaving the client duly accomplish the necessary\napplication form\n•\nAssisting the client whenever necessary in filing\nup the application form\n•\nCollecting other documentary requirements from\nthe client pursuant to application\n•\nChecking for accuracy, completeness and\nauthenticity of the documents received from\n• Lecture -\nDiscussion\n• Observation\nand\nDemonstration\non (both manual\nand on-line)\napplication\nprocesses\n• Hands-on GDS\nTraining\n• Supervised\n• Written and Oral\nExamination\n• Hands-on\nAssessment on\ntravel document\nprocessing\n\n16 hours\n\n--- PDF PAGE 104 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)\n 100\nUnit of Competency\n(Core Competency)\nLearning Outcomes\n(Elements)\nLearning Activities\n(May derived from Performance Criteria, Required\nKnowledge, Required Skills)\nMethodologies\nAssessment\nMethods\nNominal\nDuration\napplicant\n•\nCollecting payment for the application.\n•\nScheduling of the personal appearance of the\napplicant\n•\nFiling and paying for the passport application\n•\nReminding the client of their confirmed schedule\nfor personal appearance.\n•\nAssisting client during their personal appearance\n•\nCollecting the passport , recording in company\nlogbook and releasing of passport to client\n\nIndustry\nTraining (SIT)\n3.2 Assist client in\nsecuring visa\nand/ or other\npermits and\ntransit points, as\napplicable\n\n•\nEstablishing details pursuant to the application\n(type of visa, entries, validity, application\nduration)\n•\nPreparing the updated checklist of application\nrequirements of the concerned embassy\n•\nWhere applicable, assist the client acquire any\nother documentation pursuant to the application\n•\nLecture and\ndiscussion\n•\nObservation\nand\ndemonstration\non (both\nmanual and\non-line)\napplication\nprocesses\n•\nHands-on GDS\nTraining\n•\nSupervised\nIndustry\nTraining (SIT)\n• Written and Oral\nexamination\n• Hands-on\nAssessment on\ntravel document\nprocessing\n\n3.3 Provide\nassistance in\nsecuring\nadditional\nrequirements for\ntravel\n\n•\nEstablishing details pursuant to the application\n(additional travel documents needed: DSWD,\nPSA, Court related documents, official\ngovernment travel related documents,\nCommission on Filipino Overseas (CFO),\nOWWA, POEA, MARINA, TIEZA, PRA)\n•\nPreparing the checklist of requirements required\nfor the application\n•\nLecture and\ndiscussion\n•\nObservation\nand\ndemonstration\non (both\nmanual and\non-line)\n• Written and Oral\nExamination\n• Hands-on\nAssessment on\ntravel document\nprocessing\n\n--- PDF PAGE 105 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)\n 101\nUnit of Competency\n(Core Competency)\nLearning Outcomes\n(Elements)\nLearning Activities\n(May derived from Performance Criteria, Required\nKnowledge, Required Skills)\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n•\nWhere applicable, assist the client acquire any\nother documentation pursuant to the application\n\napplication\nprocesses.\n•\nHands-on GDS\nTraining\n•\nSupervised\nIndustry\nTraining (SIT)\n4. Process the\nissuance of\npassage tickets\nand other related\ndocuments\n4.1 Collate travel\ndetails\n• Verify the client’s travel details per enterprise\nprocedure\n• Recap all travel details for accuracy\n• Demonstration\n• Lecture -\nDiscussion\n• Hands-on GDS\nTraining\n• Supervised\nIndustry\nTraining (SIT)\n\n• Written Test\n• Demonstration\nof Practical\nSkills\n• Individual/\nGroup Project\nor Report\n24 hours\n4.2 Process the\nissuance of\npassage tickets\nand other travel\nrelated\ndocuments\n•\nIssuance of the passage ticket as per enterprise\nprocedure\n• Determine mode of issuance either manual or\nelectronic based on supplier’s policy\n•\n Issue travel documents as per enterprise\nprocedure\n• Demonstration\n• Lecture -\nDiscussion\n• Hands-on GDS\nTraining\n• Supervised\nIndustry\nTraining (SIT)\n• Written Test\n• Demonstration\nof Practical\nSkills\n• Individual/\nGroup Project\nor Report\n\n4.4 Release\npassage tickets,\nother related\ntravel documents\nand travel\ndocumentation\n• Collate all issued tickets, travel documents\n• Check for accuracy\n• Release tickets and travel documents per\nenterprise procedures\n• Demonstration\n• Lecture -\nDiscussion\n• Hands-on GDS\nTraining\n• Supervised\nIndustry\nTraining (SIT)\n\n• Written Test\n• Demonstration\nof Practical\nSkills\n• Individual/\nGroup Project\nor Report\n\n--- PDF PAGE 106 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)\n 102\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of\nthe DTS Law and the TESDA Guidelines on the DTP;\n\n--- PDF PAGE 107 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)\n 103\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson wherein\nthe agreement may be written or oral and the master craftsperson\ncommits to training the apprentice in all the skills relevant to his or her\ntrade over a significant period of time, usually between one and four\nyears, while the apprentice commits to contributing productively to the\nwork of the business. Training is integrated into the production process\nand apprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted\nby non-government organizations (NGOs), LGUs, training centers and\nother TVET providers which are intended to address the specific needs of\na community. Such programs can be conducted in informal settings such\nas barangay hall, basketball courts, etc. These programs can also be\nmobile training program (MTP).\n\n--- PDF PAGE 108 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)\n 104\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the\nfollowing requirements:\n\n• Must have completed the 10-year basic education or an Alternative\nLearning System (ALS) Certificate of Completion with grade 10\nequivalent holder\n• Able to communicate in verbal and written form\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of a\nmaximum of 25 trainees for TRAVEL SERVICES NC II are as follows:\n\nFACILITIES\nEQUIPMENT\n\nSUPPLIES AND\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\nSUPPLIES\n\nWorkshop\n1 unit\nProjector screen\n 25 pcs\nWriting materials\n\nLaboratory\n1 unit\nOverhead projector\n 25 pcs\nRequisition forms\n\nAudio-visual\nroom\n1 unit\nElectric fan\n 25\npcs\nSample booking forms\n\nLecture\nroom\n1 set\nFirst aid cabinet\n 25 pcs\nRecord books/Notebooks\n\nStorage/\nstock room\n1 pc\nFiling cabinet\n 25 pcs\nEnvelopes/folders\n\n1 unit\nFire extinguisher\nAccessories\n\n1 unit\nEmergency light\n 25 pcs\nCalculator\n\n1 unit\nDirectional signage\n\n1 unit\nAir condition\n\n1 unit\nTelephones\n\n1 unit\nComputer with internet\nconnection\nReferences\n\n1 unit\nTV\n 25 pcs\nBrochures\n\n1 unit\nVideo player\n 25 pcs\nManuals\n\n1 unit\nFax machine\n 25 pcs\nCharts\n\n1 unit\nLCD\n 25 pcs\nMaps\n\n1 unit\nLicensed Software on\nGlobal Distribution\nSystem (GDS)\n -\nUpdated Video Clips\n\n1 unit\nLicensed Software\n -\nPictures\n\n--- PDF PAGE 109 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)\n 105\n\nFACILITIES\nEQUIPMENT\n\nSUPPLIES AND\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n 5 pcs\nUpdated\nPTAA\nDocumentation Manual\n\n 1 pc\nElectronic ticket sample\n\n 1 pc\nUpdated\nIATA\nBSP\nManual\n\n1 pc\nUpdated Tariff Sheets\n\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees.\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nStudent/Trainee Working\nSpace\n1m x 1m\n1 sq. m\n25 sq. m\nContextual Learning\nLaboratory\n8m x 5m\n40 sq. m\n40 sq. m\nLecture Room\n8m x 5m\n40 sq. m\n40 sq. m\nLearning Resource\nCenter\n3m x 5m\n15 sq. m\n15 sq. m\nFacilities/Equipment/\nCirculation Area\n3m x 5m\n15 sq. m\n15 sq. m\nTotal workshop area:\n135 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR TRAVEL SERVICES NC II\n\n•\nHolder of National TVET Trainer Certificate (NTTC) Level I in Travel Services\nNC II\n•\nCertified Global Distribution System (GDS) reservations and ticketing\n•\nMust have at least five (5) years experience in the travel industry\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency.\n\n--- PDF PAGE 110 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)\n 106"
