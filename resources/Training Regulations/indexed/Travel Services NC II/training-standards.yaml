aboratory\n• Supervised\nIndustry\n• Written tests\n• Observation of\npractical skill\nexercise\n• Industry-\nsupervised\nevaluation\n(practicum\nevaluation)\n\n• Establishing of payment type and appropriate\nenterprise payment form and procedures\n\n• Issuing a Payment Slip and/or Provisional Receipt\nmanually or electronically per enterprise\nprocedures.\n• Determination of enterprise policy on the issuing\nof Official Receipts\n• Coordinate with accounting department the\nissuance of invoice or billing statement per\nenterprise procedures\n• Coordinate with finance department the collection\nof payment per enterprise policy\n\n--- PDF PAGE 102 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)\n 98\nUnit of Competency\n(Core Competency)\nLearning Outcomes\n(Elements)\nLearning Activities\n(May derived from Performance Criteria, Required\nKnowledge, Required Skills)\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Processing Credit Card payments as per the credit\ncard company procedures and enterprise policy\nTraining (SIT)\n2. Create travel-\nrelated\nreservations and\ntransactions\n2.1 Administer client\nfile and identify\nbooking\nrequirements\n•\nReview client’s profile and travel requirements\n•\nAnalyze client’s profile and travel requirements\n•\nReview and analyze supplier’s products and\nservices\n• Demonstration\n• Discussion\n• Lecture\n• Hands-on GDS\nTraining\n• Hands-on\nTraining in\nLaboratory\n• Supervised\nIndustry\nTraining (SIT)\n\n• Written Test\n• Demonstration\nof Practical\nSkills\n• Individual/\nGroup Project\nor Report\n24 hours\n2.2 Request services\n\n•\nEnumerate reservations mode\n•\nEstablish the reservations mode based on\nsupplier’s procedures and/or special\narrangements\n•\nMake actual bookings/reservations\n•\nObtain confirmation\n•\nIf unable to confirm, source for alternative\nsupplier\n\n• Demonstration\n• Discussion\n• Lecture\n• Hands-on GDS\nTraining\n• Hands-on\nTraining in\nLaboratory\n• Supervised\nIndustry\nTraining (SIT)\n\n• Written Test\n• Demonstration\nof Practical\nSkills\n• Individual/\nGroup Project\nor Report\n2.3 Record status of\nrequest\n\n•\nFill-up of enterprise record request forms\n•\nRecord reservations status and reconfirm rates\n\n• Demonstration\n• Lecture-\nDiscussion\n• Hands-on GDS\nTraining\n• Hands-on\nTraining in\n• Written Test\n• Demonstration\nof Practical\nSkills\n• Individual/\nGroup Project\nor Report\n\n--- PDF PAGE 103 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)\n 99\nUnit of Competency\n(Core Competency)\nLearning Outcomes\n(Elements)\nLearning Activities\n(May derived from Performance Criteria, Required\nKnowledge, Required Skills)\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\nLaboratory\n• Supervised\nIndustry\nTraining (SIT)\n2.4 Collect payment\n•\nExplain how to collect and accept payment from\nclients\n•\nEnumerate existing enterprise policies and\nprocedures\n\n• Demonstration\n• Lecture-\nDiscussion\n• Supervised\nIndustry\nTraining (SIT)\n• Written Test\n• Demonstration\nof Practical\nSkills\n• Individual/\nGroup Project\nor Report\n2.5 Update and\nfinalize bookings\n\n•\nUpdate the manual or electronic file generated\nbased on the response received or provided\n•\nEstablish if a follow-up is required or expected\n\n• Demonstration\n• Lecture-\nDiscussion\n• Hands-on GDS\nTraining\n• Hands-on\nTraining in\nLaboratory\n• Supervised\nIndustry\nTraining (SIT)\n• Written Test\n• Demonstration\nof Practical\nSkills\n• Individual/\nGroup Project\nor Report\n\n3. Provide\nassistance in\ntravel\ndocumentation\npreparation\n3.1 Assist with\nclient’s passport\napplication\n•\nEstablishing whether passport application is new\nor renewal\n•\nPreparing the checklist of requirements suitable\nfor the application\n•\nHaving the client duly accomplish the necessary\napplication form\n•\nAssisting the client whenever necessary in filing\nup the application form\n•\nCollecting other documentary requirements from\nthe client pursuant to application\n•\nChecking for accuracy, completeness and\nauthenticity of the documents received from\n• Lecture -\nDiscussion\n• Observation\nand\nDemonstration\non (both manual\nand on-line)\napplication\nprocesses\n• Hands-on GDS\nTraining\n• Supervised\n• Written and Oral\nExamination\n• Hands-on\nAssessment on\ntravel document\nprocessing\n\n16 hours\n\n--- PDF PAGE 104 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)\n 100\nUnit of Competency\n(Core Competency)\nLearning Outcomes\n(Elements)\nLearning Activities\n(May derived from Performance Criteria, Required\nKnowledge, Required Skills)\nMethodologies\nAssessment\nMethods\nNominal\nDuration\napplicant\n•\nCollecting payment for the application.\n•\nScheduling of the personal appearance of the\napplicant\n•\nFiling and paying for the passport application\n•\nReminding the client of their confirmed schedule\nfor personal appearance.\n•\nAssisting client during their personal appearance\n•\nCollecting the passport , recording in company\nlogbook and releasing of passport to client\n\nIndustry\nTraining (SIT)\n3.2 Assist client in\nsecuring visa\nand/ or other\npermits and\ntransit points, as\napplicable\n\n•\nEstablishing details pursuant to the application\n(type of visa, entries, validity, application\nduration)\n•\nPreparing the updated checklist of application\nrequirements of the concerned embassy\n•\nWhere applicable, assist the client acquire any\nother documentation pursuant to the application\n•\nLecture and\ndiscussion\n•\nObservation\nand\ndemonstration\non (both\nmanual and\non-line)\napplication\nprocesses\n•\nHands-on GDS\nTraining\n•\nSupervised\nIndustry\nTraining (SIT)\n• Written and Oral\nexamination\n• Hands-on\nAssessment on\ntravel document\nprocessing\n\n3.3 Provide\nassistance in\nsecuring\nadditional\nrequirements for\ntravel\n\n•\nEstablishing details pursuant to the application\n(additional travel documents needed: DSWD,\nPSA, Court related documents, official\ngovernment travel related documents,\nCommission on Filipino Overseas (CFO),\nOWWA, POEA, MARINA, TIEZA, PRA)\n•\nPreparing the checklist of requirements required\nfor the application\n•\nLecture and\ndiscussion\n•\nObservation\nand\ndemonstration\non (both\nmanual and\non-line)\n• Written and Oral\nExamination\n• Hands-on\nAssessment on\ntravel document\nprocessing\n\n--- PDF PAGE 105 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)\n 101\nUnit of Competency\n(Core Competency)\nLearning Outcomes\n(Elements)\nLearning Activities\n(May derived from Performance Criteria, Required\nKnowledge, Required Skills)\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n•\nWhere applicable, assist the client acquire any\nother documentation pursuant to the application\n\napplication\nprocesses.\n•\nHands-on GDS\nTraining\n•\nSupervised\nIndustry\nTraining (SIT)\n4. Process the\nissuance of\npassage tickets\nand other related\ndocuments\n4.1 Collate travel\ndetails\n• Verify the client’s travel details per enterprise\nprocedure\n• Recap all travel details for accuracy\n• Demonstration\n• Lecture -\nDiscussion\n• Hands-on GDS\nTraining\n• Supervised\nIndustry\nTraining (SIT)\n\n• Written Test\n• Demonstration\nof Practical\nSkills\n• Individual/\nGroup Project\nor Report\n24 hours\n4.2 Process the\nissuance of\npassage tickets\nand other travel\nrelated\ndocuments\n•\nIssuance of the passage ticket as per enterprise\nprocedure\n• Determine mode of issuance either manual or\nelectronic based on supplier’s policy\n•\n Issue travel documents as per enterprise\nprocedure\n• Demonstration\n• Lecture -\nDiscussion\n• Hands-on GDS\nTraining\n• Supervised\nIndustry\nTraining (SIT)\n• Written Test\n• Demonstration\nof Practical\nSkills\n• Individual/\nGroup Project\nor Report\n\n4.4 Release\npassage tickets,\nother related\ntravel documents\nand travel\ndocumentation\n• Collate all issued tickets, travel documents\n• Check for accuracy\n• Release tickets and travel documents per\nenterprise procedures\n• Demonstration\n• Lecture -\nDiscussion\n• Hands-on GDS\nTraining\n• Supervised\nIndustry\nTraining (SIT)\n\n• Written Test\n• Demonstration\nof Practical\nSkills\n• Individual/\nGroup Project\nor Report\n\n--- PDF PAGE 106 ---\nTRAVEL SERVICES NC II Revision 01 Promulgated (01/11/2016)\n 102",
