care\n machinery\nand\nequipment\n\n3.1 Prepare crop care\n machinery\n3.2 Operate machinery\n3.3 Monitor performance\n3.4 Perform post-operation\nactivities\n• Lecture\n• Discussion\n• Practical\nDemonstration\n\n• Interview\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n4. Operate rice\n harvesting\n and threshing\n machinery\nand\nequipment\n\n4.1 Prepare harvesting and\n threshing machinery\n4.2 Operate machinery\n4.3 Monitor performance\n4.4 Perform post-operation\nactivities\n\n• Lecture\n• Discussion\n• Practical\nDemonstration\n\n• Interview\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n5. Operate rice\ndrying\nmachinery and\nequipment\n5.1 Prepare drying machinery\n5.2 Operate machinery\n5.3 Monitor performance\n5.4 Perform post-operation\nactivities\n• Lecture\n• Discussion\n• Practical\nDemonstration\n\n• Interview\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n\n--- PDF PAGE 54 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n52\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Operate rice\n\nmill\nmachinery\nand\nequipment\n6.1 Prepare milling machine\n6.2 Operate machinery\n6.3 Monitor performance\n6.4 Perform post-operation\n activities\n• Lecture\n• Discussion\n• Practical\nDemonstration\n\n• Interview\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n\n--- PDF PAGE 55 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n53\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\no The training is based on curriculum developed from the\ncompetency standards;\no Learning is modular in its structure;\no Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\no Training is based on work that must be performed;\no Training materials are directly related to the competency\nstandards and the curriculum modules;\no Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\no Training program allows for recognition of prior learning (RPL)\nor current competencies;\no Training allows for multiple entry and exit; and\no Training programs are registered with UTPRAS.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by\nthe competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\no The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and\nin-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\no Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer facilitates the training delivery\no Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\no Supervised industry training or on-the-job training is an\napproach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the workplace\nto acquire specific competencies prescribed in the training\nregulations.\no Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer\ntechnologies.\no Project-Based Instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate\nprojects that have real world applications.\n\n--- PDF PAGE 56 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n54\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess\nthe following requirements:\n\n•\nAble to read and write;\n•\nWith good moral character;\n•\nAbility to communicate, both oral and written; and\n•\nPhysically fit and mentally healthy as certified by a Public Health\nOfficer\nNOTE: These lists does not include specific institutional requirements such as educational\nattainment and others that may be required from the trainees by the training school\ndelivering the TVET Program.\n\n 3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n RICE MACHINERY OPERATION NC II\n\n Recommended list of tools, equipment and materials for the training\n of 25 trainees for Rice Machinery Operation NC II\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n5\nSets of Wrench\n- 36” Pipe\n Wrench\n- 18” Pipe\n Wrench\n- 12” Adjustable\n Wrench\n2\nHand Tractor\n(Lowland &\nUpland) w/\nImplements*\n20 ltr\nFuel and Oil\n5\nStop Watch\nPPE:\n25\nProtective Cap\n2\nHydro/Turtle Tiller\n25\nBoots\n\n2\nRota Tiller\n25\nDust Mask\n\n1\n4-Wheel Tractor\nW/ Implements*\n25\nHand Gloves\n5\nHammer\n\n25\nEarmuff\n5\nVice Grip\n2\nReaper\n25\nRaincoat\n5\nPlier\n2\nStripper\n25\nLong Sleeve Shirt\n5\nScrew Driver\n1\nCombine\nHarvester\n\n5\nBallpeen\n\n5\nSteel Tape Measure\n\nHammer\n2\nRice Thresher\n25\nPail\n5\nLocking Plier\n5\nKnapsack Sprayer\n25\nEmpty Can, 20 ltrs.\n5\nGrease Gun\n2\nCentrifugal Pump\n25\nSack, 50kg\n2\nScrew driver\n5\nCultivator\n5\nCollecting Net\n1\nCombination\nWrench\n5\nFertilizer Applicator\n3\nTeflon Tape\n1 pc\nAdjustable\nWrench\n5\nWeeder\n1 qt\nGrease\n1 pc\nTachometer\n2\nPressure Gauge\n50kg\nFertilizer\n1 pc\nShovel\n2\nWeighing Scale\n1\nSuction Hose\n1 pc\nWheel Barrow\n1\nComputer\n1 set\nRequired set of pipe\nand connectors\n1 pc\nAllen Wrench\n1\nLCD\n\n1\nScreen Projector\n1\nPesticide Measuring\n\n2\nTachometer\n\nCup\n1\nMoisture Meter\n1 btl\nCh