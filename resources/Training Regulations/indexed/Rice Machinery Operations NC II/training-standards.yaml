    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: RICE MACHINERY OPERATIONS NC Level: NC II\n\nNominal Training Duration: 232 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and\nskills of rice machine operator in accordance with industry standards. It covers the\noperation and basic maintenance of rice machinery for land preparation, crop\nestablishment, crop care, harvesting and threshing, drying and milling.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\nGroup\ndiscussion\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n•\nObservation\n•\nInterview\n\n--- PDF PAGE 52 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n50\n\nCOMMON COMPETENCIES\n(14 Hours)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1. Determine areas of\nconcern for safety\nmeasures\n1.2. Apply appropriate safety\nmeasures\n1.3. Safekeep/maintain/\ndispose tools, materials\nand outfit.\nSelf-paced/modular\nLecture/Discussion\nInteraction\nPractical\nDemonstration\nVisit/tour\nOral/Written\nInterviews\nDirect\nObservation\nPractical\nDemonstration\n2. Use farm tools\nand equipment\n2.1. Prepare and use farm\ntools\n2.2. Prepare and operate\nfarm equipment\n2.3. Perform preventive\nmaintenance\nprocedures/practices\nSelf-paced/modular\nLecture/Discussion\nInteraction\nPractical\nDemonstration\nVisit/tour\n\nOral/Written\nInterviews\nDirect\nObservation\nPractical\nDemonstration\n3. Perform\nestimation\nand\nbasic calculation\n\n3.1. Perform estimation\n3.2. Perform basic workplace\ncalculation\n3.3. Apply corrective\nmeasures as necessary\nSelf-paced/modular\nLecture/Discussion\nInteraction\nPractical Exercise\nOral/Written\nexamination\nPractical\nexercise\n\n--- PDF PAGE 53 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n51\nCORE COMPETENCIES\n(200 Hours)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Operate rice\nland\npreparation\nmachinery and\nequipment\n\n1.1 Inspect field/area\n1.2 Prepare land machinery\n1.3 Operate machinery\n1.4 Monitor performance\n1.5 Perform post-operation\nactivities\n• Lecture\n• Discussion\n• Practical\nDemonstration\n\n• Interview\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n2. Operate rice\ncrop\nestablishment\nmachinery and\nequipment\n\n2.1 Prepare crop\n establishment machinery\n2.2 Operate machinery\n2.3 Monitor performance\n2.4 Perform post-operation\n activities\n• Lecture\n• Discussion\n• Practical\nDemonstration\n\n• Interview\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n3. Operate rice\ncrop\n care\n machinery\nand\nequipment\n\n3.1 Prepare crop care\n machinery\n3.2 Operate machinery\n3.3 Monitor performance\n3.4 Perform post-operation\nactivities\n• Lecture\n• Discussion\n• Practical\nDemonstration\n\n• Interview\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n4. Operate rice\n harvesting\n and threshing\n machinery\nand\nequipment\n\n4.1 Prepare harvesting and\n threshing machinery\n4.2 Operate machinery\n4.3 Monitor performance\n4.4 Perform post-operation\nactivities\n\n• Lecture\n• Discussion\n• Practical\nDemonstration\n\n• Interview\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n5. Operate rice\ndrying\nmachinery and\nequipment\n5.1 Prepare drying machinery\n5.2 Operate machinery\n5.3 Monitor performance\n5.4 Perform post-operation\nactivities\n• Lecture\n• Discussion\n• Practical\nDemonstration\n\n• Interview\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n\n--- PDF PAGE 54 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n52\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Operate rice\n\nmill\nmachinery\nand\nequipment\n6.1 Prepare milling machine\n6.2 Operate machinery\n6.3 Monitor performance\n6.4 Perform post-operation\n activities\n• Lecture\n• Discussion\n• Practical\nDemonstration\n\n• Interview\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n\n--- PDF PAGE 55 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n53"
