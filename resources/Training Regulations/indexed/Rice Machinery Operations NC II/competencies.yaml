  "source_section_text": "SECTION 1 RICE MACHINERY OPERATIONS NC II QUALIFICATION\n\nThe RICE MACHINERY OPERATIONS NC II Qualification consists of competencies\nthat a person must achieve in the operation and basic routine maintenance of rice\nmachinery for land preparation, crop establishment, crop care, harvesting and\nthreshing, drying and milling.\n\nThis Qualification is packaged from the competency map of the Agri-Fishery Sector\nas shown in Annex A.\n\nThe units of competency comprising this qualification includes the following:\n\nCode\nBASIC COMPETENCIES\n500311105\nParticipate in workplace communication\n500311106\nWork in a team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\n\nCode\nCOMMON COMPETENCIES\nAGR321201\nApply safety measures in farm operations\nAGR321202\nUse farm tools and equipment\nAGR321203\nPerform estimation and calculations\n\nCode\nCORE COMPETENCIES\nAGR611361\nOperate rice land preparation machinery and equipment\nAGR611362\nOperate rice crop establishment machinery and equipment\nAGR611363\nOperate rice crop care machinery and equipment\nAGR611364\nOperate rice harvesting and threshing machinery and equipment\nAGR611365\nOperate rice drying machinery and equipment\nAGR611366\nOperate rice mill machinery and equipment\n\nA person who has achieved this Qualification is competent to be:\n\n•\nRice Land Preparation Machinery Operator (Hand Tractor, 4-Wheel Tractor)\n•\nRice Crop Establishment Machinery Operator (Manual Seeder, Motorized Seeder,\nRice Transplanter)\n•\nRice Crop Care Machinery Operator (Irrigation Pump, Cultivator, Sprayer, Fertilizer\nApplicator)\n•\nRice Harvesting and Threshing Machinery Operator (Reaper, Stripper, Combine,\nThresher)\n•\nRice Drying Machinery Operator (Batch, Continuous Flow Dryer)\n•\nRice Mill Machinery Operator (Single-Pass, Multi-Pass)\n•\nRice Machinery Operator\n\nA person/candidate is granted a National Certificate under this qualification\nonce they achieve all the basic and common units plus any three (3) of the above\ncore units of competency on rice machinery operation.\n\n--- PDF PAGE 4 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n2"
