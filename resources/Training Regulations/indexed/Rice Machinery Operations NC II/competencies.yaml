        "source_text": "AGR321203\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to perform basic workplace calculations.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n2 Perform estimation\n2.1 Job requirements are identified from written or oral\ncommunications\n2.2 Quantities of materials and resources required to\ncomplete a work task are estimated\n2.3 The time needed to complete a work activity is\nestimated\n2.4 Accurate estimate for work completion are made\n2.5 Estimate of materials and resources are reported\nto appropriate person\n3 Perform basic workplace\ncalculation\n3.1 Calculations to be made are identified according\nto job requirements\n3.2 Correct method of calculation identified\n3.3 System and units of measurement to be followed\nare ascertained\n3.4 Calculation needed to complete work tasks are\nperformed using the four basic process of\naddition, division, multiplication and subtraction\n3.5 Calculate whole fraction, percentage and mixed\nwhen are used to complete the instructions\n3.6 Number computed in self checked and completed\nfor alignment\n\n--- PDF PAGE 25 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n23\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Calculations\n\n1.1\n Quantity of Seedlings\n1.2\nAmount of fertilizer\n\n2. Method of calculation\n\n2.1\nAddition\n2.2\nSubtraction\n2.3\nMultiplication\n2.4\nDivision\n2.5\nRatio and proportion\n3. System of measurement\n3.1\nEnglish\n3.2\nMetric\n4. Units of measurement\n4.1\nArea\n4.2\nVolume\n4.3\nWeight\n\n--- PDF PAGE 26 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n24\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPerformed estimation\n1.2\nPerformed basic workplace calculation\n1.3\nApplied corrective measures as maybe necessary\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1\nMathematics\n2.1.1\nBasic mathema