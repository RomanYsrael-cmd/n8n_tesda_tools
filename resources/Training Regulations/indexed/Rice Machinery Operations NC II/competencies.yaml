        "source_text": "AGR611365\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired in operating rice drying machinery and\nequipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare rice drying\n machinery\n1.1 Machines are checked/adjusted\nin accordance with established standards and\nmanufacturer’s manual\n1.2 Accessories are prepared and checked as per work\n requirement and established standards and\nmanufacturer’s manual\n1.3 Tools and materials are prepared as per work\n requirements\n2. Operate machines\nand monitor\nperformance\n2.1 Personal Protective Equipment (PPE)are selected\nand worn as per work requirement\n2.2 Machine is operated according to established\nstandards and manufacturer’s manual\n2.3 Abnormal conditions are identified and corrected in\naccordance with the standard operating procedures\n2.4 Performances are assessed according to set\nstandards and clients’ specifications\n9.6 Malfunctions are recorded for appropriate adjustment\n by proper personnel\n2.6 Machine is shutdown according to established\nstandards and manufacturer’s manual\n3. Perform post-\noperation activities\n3.1 Wastes are managed according to environmental\nregulations\n3.2 Machine and engine are cleaned and stored as per\nestablished standards and manufacturer’s manual\n3.3 Work area is cleaned and maintained according to\nOHS and enterprise requirements\n3.4 Records of information are prepared in appropriate\nformat\n3.5 Basic preventive maintenance is performed\naccording to manufacturer’s instructions and/or\nstandard practices\n\n--- PDF PAGE 44 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n42\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Machines\n1.1 Batch-type dryer\n1.2 Continuous flow dryer\n1.3 Flash dryer\n2. Accessories\nMay include but are not limited to:\n2.1 Moisture meter\n2.2 Thermometer\n2.3 Tachometer\n2.4 Velometer\n2.5 Mamometer\n2.6 Hygrometer\n2. Tools and Materials\nMay include but are not limited to:\n2.1 Wrenches\n2.2 Shovel\n2.3 Fresh palay\n2.4 Oil/fuel\n2.5 Sacks (for grains and waste)\n2.6 Plastic twine\n2.7 Sack needle\n2.8 Vacuum cleaner\n2.9 Broomstick and dustpan\n2.10 Rags\n2.11 Grease gun\n3. PPE\n3.1 Dust mask\n3.2 Gloves\n3.3 Ear muff\n3.4 Long sleeve shirt\n3.5 Protective cap\n4. Abnormal conditions\nMay include but are not limited to:\n4.1 Erratic engine speed\n4.2 Belt spillage\n4.3 Prolonged drying time\n4.4 High moisture gradiant\n4.5 Low airflow/low drying air temperature\n4.6 Clogging\n5. Performances\nMay include but are not limited to:\n5.1 Moisture reduction rate\n5.2 Drying capacity\n5.3 Loading capacity\n5.4. Product quality\n5.5 Drying rate\n5.5 Spillage\n5.6 Heating system efficiency\n5.7 Drying efficiency\n5.8 Moisture gradiant\n\n--- PDF PAGE 45 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n43\n\nVARIABLE\nRANGE\n6. Wastes\n6.1 Ashes\n6.2 Impurities\n6.3 Used plastic twine and sacks\n7. Records of information\n7.1 Machine failure\n7.2 Fuel consumption\n7.3 Drying time\n7.4 Hours of operation\n7.5 Manpower requirements\n7.6 Quality and quantity\n7.7 Drying air temperature\n7.8 Initial and final moisture of rains\n8. Basic preventive\n\nmaintenance\nMay include but are not limited to:\n8.1 Dismantling and assembling procedures\n8.2 Safety and pre-start checks\n8.3 Testing\n8.4 Tightening\n8.5 Minor adjustments and repairs (e.g. belt\ntension/ pulley alignment, engine speed)\n8.6 Routine servicing procedures (e.g. cleaning,\nlubricating, priming pumps, cleaning filters,\nchecks of cooling systems, fuel, grease and\noil, battery levels)\n\n--- PDF PAGE 46 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n44\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Prepared dryer machinery\n1.2 Operated and shut down machine\n1.3 Operated machine at optimum efficiency\n1.3 Cleaned and stored machine and engine\n1.4 Cleaned and maintained work area\n1.5 Prepared record of operation\n1.6 Observed OHS procedures\n1.8 Performed basic routine preventive maintenance\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Compatibility of engine and dryer machinery\n2.2 Knowledge on occupational health and safety procedure\n2.3 5S and 3R applications\n2.4 Nomenclature of engine and dryer machinery\n2.5 Performance of the machine\n2.6 Quality assessment output\n2.7 Dedication to work and resourcefulness\n2.8 Patience, perseverance and environmentally conscious\n2.9 Sense of quality and open-mindedness\n3. Underpinning\nSkills\n3.1 Using relevant tools and dryer equipment\n3.2 Operating and maintaining the machine\n3.3 Reading test instruments such as moisture meter,\n tachometer, etc.\n3.4 Preparing report\n3.5 Appropriate/proper wearing of PPEs\n3.6 Performing standard operating procedures of equipment\n3.7 Performing safety practices and safe operation\n3.8 Demonstrating safe and environmentally responsible\nworkplace practices\n3.9 Reading and interpreting manual/manufacturer’s\nspecifications, work and maintenance plans\n3.10 Using appropriate fuel and lubrication requirement\n3.11 Basic computation and communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Dryer machinery\n4.2 Manufacturer’s manual\n4.3 Supplies and materials (rice samples, etc)\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation/Demonstration with Oral Questioning\n5.2 Portfolio\n6. Context for\nAssessment\n6.1 Competency must be assessed on actual job or\naccredited assessment center\n6.2 Competency assessment must be undertaken in\n accordance with endorsed TESDA assessment guidelines\n\n--- PDF PAGE 47 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n45\n\nUNIT OF COMPETENCY : OPERATE RICE MILL MACHINERY AND EQUIPMENT\n\nUNIT CODE :"
