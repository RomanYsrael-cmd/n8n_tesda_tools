        "evidence_guide": {
          "source_text": "1. Critical Aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared crop care machinery\n1.2 Operated and shutdown machines\n1.3 Operated machine at optimum efficiency\n1.3 Cleaned and stored machine and equipment\n1.4 Cleaned and maintained work area\n1.5 Prepared record of operation\n1.6 Observed OHS procedures\n1.7 Performed basic routine preventive maintenance\nactivities\n2. Underpinning\nKnowledge\n2.1 Compatibility of primemover and machines\n2.2 Knowledge on occupational health and safety\nProcedures\n2.3 5S and 3R applications\n2.4 Nomenclature of engine and machines\n2.5 Dedication to work and resourcefulness\n2.6 Patience, perseverance and environmentally\n conscious\n2.7 Sense of quality and open mindedness\n3. Underpinning Skills\n3.1 Using relevant farm tools and equipment\n3.2 Preparing report\n3.3 Appropriate/proper wearing of PPE’s\n3.4 Performing standard operating procedure of equipment\n3.6 Performing safety practices and safe operation\n3.7 Demonstrating safe and environmentally responsible\nworkplace practices\n3.8 Reading and interpreting manual/manufacturer’s\nspecifications, work and maintenance plans\n3.9 Using appropriate fuel and lubrication requirement\n3.10 Computation and communication skills\n4. Resource\n Implications\nThe following resources MUST be provided:\n4.1 Machines and Engine\n4.2 Water source\n4.3 Required field\n4.4 Operator’s manual\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1 Observation / Demonstration with oral questioning\n5.2 Portfolio\n6. Context of\n Assessment\n6.1 Competency must be assessed on actual job\n accredited assessment center / farm\n6.2 Competency assessment must be undertaken in\n accordance with the endorsed TESDA assessment\n guidelines\n\n--- PDF PAGE 39 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n37\nUNIT OF COMPETENCY: OPERATE RICE HARVESTING AND THRESHING\nMACHINERY AND EQUIPMENT\n\nUNIT CODE :"
