        "source_text": "--- PDF PAGE 27 ---\nTR – Rice Machinery Operations NC II                                 Promulgated \n \n25\n \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY:   OPERATE RICE LAND PREPARATION MACHINERY \n \n \n  AND EQUIPMENT \n \nUNIT CODE \n      :    AGR611361 \n \nUNIT DESCRIPTOR        :   This unit covers the knowledge, skills and attitudes \nrequired to operate rice land preparation machinery and \nequipment.  \n \n \nELEMENT\nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.   Assess field/area \n1.1 Field is inspected and prepared as per established    \npractices \n1.2  Obstructions are removed as per established \npractices \n2. Prepare machine for land \npreparation \n \n2.1 Machines are checked and adjusted in accordance \nwith manufacturer operator’s manual  \n2.2 Tools and materials are prepared as work \nrequirements \n2.3 Implements are checked and adjusted in \naccordance with manufacturer’s instruction manual \n3. Operate land preparation \nmachinery and monitor \nperformance \n \n \n3.1  Personal Protective Equipment are selected and \nworn as per work requirement \n3.2   Machine is operated according to standard   \n       practices \n3.3  Abnormal conditions are identified and corrected \nin accordance with the standard operating \nprocedures \n3.4  Performances are assessed according to set \nstandards or client’s specification \n3.5  Malfunctions are recorded and referred to \nappropriate personnel for action  \n3.6  Machine is shutdown according to standard \npractices \n4. Perform post-operation \nactivities \n4.1   Waste generated is managed according to   \n       environmental regulations \n4.2   Machine and engine are cleaned, checked and \nstored as per established practices \n4.3  Work area is cleaned and maintained according to \nOHS and enterprise requirements. \n4.4  Records of information are prepared in \nappropriate format \n4.5  Basic preventive maintenance is performed \naccording to manufacturer’s instructions and/or \nstandard practices\n\n--- PDF PAGE 28 ---\nTR – Rice Machinery Operations NC II                                 Promulgated \n \n26\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Obstructions \nMay include but are not limited to: \n1.1  Tall grasses \n1.2   Stones \n1.3   Foreign materials (e.g. used bottles/cans, plastic \nbags) \n1.  Machines  \n \n1.1 Hand tractor/power tiller \n1.2 4-Wheel tractor \n  \n2.  Implements \nMay include but are not limited to: \n2.1  Moldboard/disc plow \n2.2  Harrow \n2.3  Trailer (for transport of implements of hand tractor) \n2.4  Rotovator \n2.5   Leveller \n3.  Tools and Materials \nMay include but are not limited to: \n3.1   Wrenches \n3.2   Hammer \n3.3   Fuel/Oil \n3.4   Pressurized water sprayer* \n3.5   Grease gun \n3.6   Broomstick and dustpan* \n3.7   Rags* \n*For cleaning purposes\n4.   PPE \n4.1 Dust Mask (for dry land preparation) \n5.  Abnormal Condition \nMay include but is not limited to: \n5.1 Erratic engine speed \n5.2 Belt slippage \n5.3 Unplowed field/area \n6.  Output quality and \nquantity \nMay include but is not limited to: \n6.1 Well plowed field \n6.2 Effectively tilled soil  \n6.3  Acceptable field efficiency\n\n--- PDF PAGE 29 ---\nTR – Rice Machinery Operations NC II                                 Promulgated \n \n27\n \n \n \nVARIABLE \nRANGE \n7.  Records of information \n8.1 Machine failure \n8.2 Fuel consumption \n8.3 Area tilled \n8.4 Hours of operation \n8.5 Manpower requirements \n8.6  Date of operation\n8.  Basic preventive \nmaintenance \nMay include but are not limited to: \n8.1 Dismantling and assembling procedures \n8.2 Safety and pre-start checks \n8.3 Testing \n8.4 Tightening \n8.5 Minor adjustments and repairs (e.g. belt tension/ \npulley alignment, engine speed) \n8.6 Routine servicing procedures (e.g. cleaning, \nlubricating, priming pumps, cleaning filters, checks \nof cooling systems, fuel, grease and oil, battery \nlevels)