        "evidence_guide": {
          "source_text": "1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1\nCorrectly identified appropriate farm tools and equipment\n1.2\nOperated farm equipments according to manual\nspecification\n1.3\nPerformed preventive maintenance\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1\nSafety Practices\n2.1.1 Ideal good work habits to demonstrate to workers\neasy and safety standards during operation of\nfarm equipment\n2.2\nCodes and Regulations\n2.2.1 Environmental Compliance Certificate (ECG)\n2.2.2 Effective work supervision in the operations of\nfarm equipment\n\n2.3\nTools & Equipment: Uses and Specification\n2.3.1 Knowledge in calibrating and use of equipment\n2.3.2 Safety keeping of equipments every after use\n\n2.4\nMaintenance\n2.4.1 Regular upkeep of equipments\n2.4.2 Preventive maintenance skills\n\n2.5\nValues\n2.5.1 Positive outlook towards work\n2.5.2\nPossesses pre-emptive/anticipatory skills\n3.\nUnderpinning\nSkills\n3.1\nAbility to recognized defective farm equipment\n3.2\nPerform proper management practices of safety\nmeasures\n4.\nMethod of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nDirect observation\n4.2\nPractical demonstration\n4.3\nThird Party Report\n5.\nResource\nImplications\n5.1 Service/operational manual of farm tools and equipment\n5.2 Tools and equipment\n5.3 Farm implements\n6.\nContext of\nAssessment\n6.1\nAssessment may occur in the workplace or in a\nsimulated workplace or as part of a team under limited\nsupervision\n\n--- PDF PAGE 24 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n22\n\nUNIT OF COMPETENCY: PERFORM ESTIMATION AND BASIC CALCULATION\n\nUNIT CODE :"
