        "source_text": "--- PDF PAGE 35 ---\nTR – Rice Machinery Operations NC II                                 Promulgated \n \n33\nUNIT OF COMPETENCY:   OPERATE RICE CROP CARE MACHINERY AND   \n                                              EQUIPMENT \n \nUNIT CODE                     :   AGR611363 \n \nUNIT DESCRIPTOR       :   This unit covers the knowledge, skills and attitudes \nrequired to operate rice crop care machinery and \nequipment. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.   Prepare crop care   \n      machinery  \n1.1  Machines are checked and adjusted for operation  in  \naccordance with standard farm practices \n1.2  Accessories are checked, cleaned and installed as   \nper operating manual \n1.3.  Engine is check for operation in accordance with the \n        standard practices \n1.4   Resources needed are available to meet the work    \n        requirements \n1.5  Tools and materials are prepared based on work \nrequirements\n2.   Operate machines and \nmonitor performance \n2.1 Personal protective equipment are selected and worn \nas per work requirement \n2.2  Machine is operated according to standard practices \n2.3  Abnormal conditions are identified and corrected in \naccordance with standard operating procedures \n2.4  Performance are assessed according to set  \n       standards or client’s specification. \n2.5   Malfunctions are recorded and referred for \nappropriate action by the proper personnel \n2.6  Machine is shutdown according to standard practices \n3.  Perform post-operation \nactivities \n3.1 Wastes are managed according to environmental \nregulations \n3.2 Machines and engine are cleaned and stored as per \nestablished practices \n3.3 Work are is cleaned and maintained according to \nOHS and enterprise requirements \n3.4 Records of information are prepared in appropriate \nformat \n3.5 Basic preventive maintenance is performed \naccording to manufacturer’s instructions 