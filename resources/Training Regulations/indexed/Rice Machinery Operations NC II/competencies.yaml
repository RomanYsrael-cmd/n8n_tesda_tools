        "source_text": "AGR611364\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\n required to operate rice harvesting and threshing\n machinery and equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the range of variables\n1. Prepare harvesting and\nthreshing machinery\n1.1 Machines are checked/adjusted for operation in\naccordance with standard practices\n1.2 Tools and materials are prepared as per work\nrequirements\n1.3 Accessories are checked and adjusted according to\nmanufacturer operator’s manual\n1.4 Matured grain plants are inspected as per\nestablished practices\n2. Operate machines and\nmonitor performance\n2.1 Personal Protective Equipment (PPE) are selected\nand worn as per work requirements\n2.2 Machine is operated according with standard farm\npractices\n2.3 Abnormal conditions are identified and corrected in\naccordance with standard operating procedures\n2.4 Performances are assessed according to set\nstandards and client’s specifications\n2.5 Malfunctions is recorded for appropriate adjustment\nby proper personnel\n9.7 Machine is shutdown according to standard practices\n3. Perform post-operation\n activities\n3.1 Wastes are managed according to environmental\nregulations\n3.2 Machine and engine are cleaned and stored as per\nestablished practices\n3.3 Work area is cleaned and maintained according to\nOHS and enterprise requirements\n3.4 Records of information are prepared in appropriate\nformat\n3.5 Basic preventive maintenance is performed\naccording to manufacturer’s instructions and/or\nstandard practices\n\n--- PDF PAGE 40 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n38\n\nRANGE OF VIABLES\n\nVARIABLE\nRANGE\n1. Machines\n1.1 Reaper\n1.2 Stripper\n1.3 Combine\n1.4 Thresher\n1.5 Grain cleaner\n2. Accessories\nMay include but are not limited to:\n2.1 Pneumatic tire\n2.2 Cage wheel\n2.3 Draw bar/towing bar\n2.4 Collecting box\n3. Tools and Materials\nMay include but are not limited to:\n3.1 Wrenches\n3.2 Hammer\n3.3 Screw drivers\n3.4 Fuel/Oil\n3.5 Sacks (for palay and wastes)\n3.6 Bag closer or sewing kit\n3.7 Collecting net\n3.8 Air compressor\n3.9 Pressurized water sprayer\n3.10 Broomstick and dustpan\n3.11 Grease gun\n3.12 Rags\n4. PPE\n4.1 Boots\n4.2 Dust Mask\n4.3 Gloves\n4.4 Ear Muff\n4.5 Protective cap\n4.6 Long sleeve shirt\n5. Abnormal conditions\nMay include but are not limited to:\n5.1 Erratic engine speed\n5.2 Belt slippage\n5.3 Unharvested grains\n5.4 Unthreshed grains\n5.5 Unstripped grains\n5.6 Unclean grains\n5.7 Milled grains\n5.9 Excessive vibration\n5.10 Excessive grain\n5.11 Clogging\n\n--- PDF PAGE 41 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n39\n\nVARIABLE\nRANGE\n6. Performances\nMay include but is not limited to:\n6.1 Capacity of machines\n6.2 Effectively cleaned grains\n6.3 Effectively harvested field\n6.4 Effectively threshed grains\n6.5 Efficiency (field, threshing, etc.)\n7. Wastes/losses\n7.1 Unharvested grains\n7.2 Unthreshed grains\n7.3 Rice straw\n7.4 Grain impurities\n8. Records\n8.1 Machine failure\n8.2 Fuel consumption\n8.3 Area harvested\n8.4 Hours of operation\n8.5 Manpower requirements\n8.6 Volume of grain processed\n9. Basic preventive\n\nmaintenance\nMay include but are not limited to:\n9.1 Dismantling and assembling procedures\n9.2 Safety and pre-start checks\n9.3 Testing\n9.4 Tightening\n9.5 Minor adjustments and repairs (e.g. belt\ntension/ pulley alignment, engine speed)\n9.6 Routine servicing procedures (e.g. cleaning,\nlubricating, priming pumps, cleaning filters,\nchecks of cooling systems, fuel, grease and\noil, battery levels)\n\n--- PDF PAGE 42 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n40\nEVIDENCE GUIDE\n\n1. Critical Aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared harvesting and threshing machine\n1.2 Operated and shut down machines\n1.3 Operated machine at optimum efficiency\n1.4 Cleaned and stored machine and equipment\n1.5 Cleaned and maintained work area\n1.6 Prepared record of operations\n1.7 Observed OHS procedures\n1.8 Performed basic routine preventive maintenance\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Compatibility of machines and engines\n2.2 Knowledge on Occupational Health and Safety\nProcedures\n2.3 5S and 3R applications\n2.4 Nomenclature of engine and machines\n2.5 Components adjustments\n2.6 Dedication to work and resourcefulness\n2.7 Patience, perseverance and environmentally conscious\n2.8 Sense of quality and open mindedness\n2.9 Preventive Maintenance\n3. Underpinning\nSkills\n3.1 Using relevant farm tools and equipment\n3.2 Preparing report\n3.3 Appropriate/proper wearing of PPEs\n3.4 Performing standard operating procedure of equipment\n3.5 Performing safety practices and safe operation\n3.6 Demonstrating safe and environmentally responsible\nworkplace practices\n3.7 Reading and interpreting manual/manufacturer’s\nspecifications, work and maintenance plans\n3.8 Using appropriate fuel and lubrication requirement\n3.9 Basic computation and communication skills\n3.10 Troubleshooting\n4. Resource\n Implications\nThe following resources MUST be provided:\n4.1 Machines and engine\n4.2 Rice field for harvesting\n4.3 Rice materials for threshing/stripping\n4.4 Rice for cleaning\n4.5 Manufacturer’s manual\n4.6 Supplies and materials\n5. Method of\n\n Assessment\nCompetency may be assessed through:\n5.1 Direct observation / demonstration with oral questioning\n5.2 Portfolio\n6. Context of\n Assessment\n6.1 Competency must be assessed on actual job or\n accredited assessment center\n6.2 Competency assessment must be undertaken in\n accordance with the endorsed TESDA assessment\n guidelines\n\n--- PDF PAGE 43 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n41\n\nUNIT OF COMPETENCY: OPERATE DRYING MACHINERY AND EQUIPMENT\n\nUNIT CODE :"
