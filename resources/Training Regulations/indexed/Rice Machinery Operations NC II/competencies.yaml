        "source_text": "AGR611363\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to operate rice crop care machinery and\nequipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare crop care\n machinery\n1.1 Machines are checked and adjusted for operation in\naccordance with standard farm practices\n1.2 Accessories are checked, cleaned and installed as\nper operating manual\n1.3. Engine is check for operation in accordance with the\n standard practices\n1.4 Resources needed are available to meet the work\n requirements\n1.5 Tools and materials are prepared based on work\nrequirements\n2. Operate machines and\nmonitor performance\n2.1 Personal protective equipment are selected and worn\nas per work requirement\n2.2 Machine is operated according to standard practices\n2.3 Abnormal conditions are identified and corrected in\naccordance with standard operating procedures\n2.4 Performance are assessed according to set\n standards or client’s specification.\n2.5 Malfunctions are recorded and referred for\nappropriate action by the proper personnel\n2.6 Machine is shutdown according to standard practices\n3. Perform post-operation\nactivities\n3.1 Wastes are managed according to environmental\nregulations\n3.2 Machines and engine are cleaned and stored as per\nestablished practices\n3.3 Work are is cleaned and maintained according to\nOHS and enterprise requirements\n3.4 Records of information are prepared in appropriate\nformat\n3.5 Basic preventive maintenance is performed\naccording to manufacturer’s instructions and/or\nstandard practices\n\n--- PDF PAGE 36 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n34\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Machines\n1.1 Irrigation pump\n1.2 Sprayer/Duster\n1.3 Weeder/Cultivator\n2. Accessories\nMay include but are not limited to:\n2.1 Pressure gauge\n2.2 Pipe connector\n2.3 Lance\n2.4 Nozzle\n2.5 Hose\n3. Resources\n3.1 Water source\n3.2 Required field\n4. Tools and materials\nMay include but is not limited to:\n4.1 Wrenches\n4.2 Teflon tape\n4.3 Fertilizer\n4.4 Fuel/oil\n4.5 Chemicals\n4.6 Measuring cup\n4.7 Pressurized water sprayer*\n4.8 Grease gun\n4.9 Rags*\n4.10 Broomstick and dustpan*\n*For cleaning purposes\n5. Abnormal condition\nMay include but is not limited to:\n5.1 Erratic engine speed\n5.2 Belt slippage\n5.3 No water discharged\n5.4 Pesticide leaks\n6. Performance\nMay include but is not limited to:\n6.1 Discharge capacity\n6.3 Efficiency\n7. Wastes\nMay include but are not limited to:\n7.1 Pesticide bottle\n7.2 Used Teflon seals\n7.3 Used fertilizer container/sacks\n\n--- PDF PAGE 37 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n35\n\nVARIABLE\nRANGE\n8. Records\n8.1 Date of operation\n8.2 Fuel Consumption\n8.3 Hours of operation\n8.4 Machine Failure\n8.5 Area operated\n8.6 Manpower requirements\n9. Basic preventive\nmaintenance\nMay include but are not limited to:\n9.1 Dismantling and assembling procedures\n9.2 Safety and pre-start checks\n9.3 Testing\n9.4 Tightening\n9.5 Minor adjustments and repairs (e.g. belt\ntension/ pulley alignment, engine speed)\n9.6 Routine servicing procedures (e.g. cleaning,\nlubricating, priming pumps, cleaning filters,\nchecks of cooling systems, fuel, grease and oil,\nbattery levels)\n\n--- PDF PAGE 38 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n36\nEVIDENCE GUIDE\n\n1. Critical Aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared crop care machinery\n1.2 Operated and shutdown machines\n1.3 Operated machine at optimum efficiency\n1.3 Cleaned and stored machine and equipment\n1.4 Cleaned and maintained work area\n1.5 Prepared record of operation\n1.6 Observed OHS procedures\n1.7 Performed basic routine preventive maintenance\nactivities\n2. Underpinning\nKnowledge\n2.1 Compatibility of primemover and machines\n2.2 Knowledge on occupational health and safety\nProcedures\n2.3 5S and 3R applications\n2.4 Nomenclature of engine and machines\n2.5 Dedication to work and resourcefulness\n2.6 Patience, perseverance and environmentally\n conscious\n2.7 Sense of quality and open mindedness\n3. Underpinning Skills\n3.1 Using relevant farm tools and equipment\n3.2 Preparing report\n3.3 Appropriate/proper wearing of PPE’s\n3.4 Performing standard operating procedure of equipment\n3.6 Performing safety practices and safe operation\n3.7 Demonstrating safe and environmentally responsible\nworkplace practices\n3.8 Reading and interpreting manual/manufacturer’s\nspecifications, work and maintenance plans\n3.9 Using appropriate fuel and lubrication requirement\n3.10 Computation and communication skills\n4. Resource\n Implications\nThe following resources MUST be provided:\n4.1 Machines and Engine\n4.2 Water source\n4.3 Required field\n4.4 Operator’s manual\n5. Method of\n Assessment\nCompetency may be assessed through:\n5.1 Observation / Demonstration with oral questioning\n5.2 Portfolio\n6. Context of\n Assessment\n6.1 Competency must be assessed on actual job\n accredited assessment center / farm\n6.2 Competency assessment must be undertaken in\n accordance with the endorsed TESDA assessment\n guidelines\n\n--- PDF PAGE 39 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n37\nUNIT OF COMPETENCY: OPERATE RICE HARVESTING AND THRESHING\nMACHINERY AND EQUIPMENT\n\nUNIT CODE :"
