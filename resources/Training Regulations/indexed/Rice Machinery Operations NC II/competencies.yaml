        "evidence_guide": {
          "source_text": "1. Critical Aspects of\n competency\nAssessment requires evidence that the candidate :\n1.1 Prepared rice mill machine\n1.2 Operated rice mill machine\n1.3 Operated machine at optimum efficiency\n1.4 Cleaned and stored machine and equipment\n1.5 Cleaned and maintained work area\n1.6 Prepared records of operation\n1.7 Observed OHS practices and procedures\n1.8 Performed basic routine preventive maintenance\nactivities\n2. Underpinning\nKnowledge\n and Attitudes\n2.1 Knowledge on milling system process flow\n2.2 Knowledge on Occupational Health and Safety\n Procedures\n2.3 5S and 3R applications\n2.4 Nomenclature of machine and motor/engine\n2.5 Adjustments on mill machine\n2.6 Quality assessment of mill product\n2.7 Performance of the milling system\n2.8 Dedication to work and resourcefulness\n2.9 Patience, perseverance and environmental\nConsciousness\n2.10 Sense of quality and open mindedness\n3. Underpinning Skills\n3.1 Using relevant tools and equipment\n3.2 Operating and maintaining milling system\n3.3 Preparing report\n3.4 Proper wearing of PPEs\n3.5 Performing standards operating procedures of\n equipment\n3.6 Performing safety practices and safe operation\n3.7 Demonstrating safe and environmentally responsible\n workplace practices\n3.8 Reading and interpreting manual/manufacturer’s\nspecifications, work and maintenance plans\n3.9 Using appropriate fuel and lubrication requirement\n3.10 Computation and communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Properly dried palay\n4.2 Milling machine\n4.3 Power / Engine\n 4.4 Manufacturer’s manual\n4.5 Supplies and materials\n5. Method of\n\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation/demonstration with oral questioning\n5.2 Portfolio\n6. Context of\n\nAssessment\n6.1 Competency must be assessed on actual job or\naccredited assessment center\n6.2 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 51 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n49"
        },
        "source_text": "AGR611366\n\nUNIT DESCRIPTOR : This unit covers the knowledge, attitudes and skills\nrequired to operate rice milling machinery and\nequipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare rice milling\n\nmachine\n1.1 Machines are checked and adjusted\n in accordance with established standards and\nmanufacturer’s manual\n1.2 Accessories and components are checked and\n adjusted according to established standards and\nmanufacturer’s manual\n1.3 Tools and materials are prepared as work\nrequirements\n2. Operate machine and\n\nmonitor performance\n2.1 Personal Protective Equipment are selected\nand worn as per work requirements\n2.2 Machine is operated according to established\nstandards and manufacturer’s manual\n2.3 Abnormal conditions are identified and\n corrected in accordance with standard operating\n procedures\n2.4 Performances are assessed according to set\nstandards and client’s specification\n2.7 Malfunctions are recorded for appropriate\n adjustment by concerned personnel\n2.6 Machine is shutdown according to established\nstandards and manufacturer’s manual\n3. Perform post-operation\n activities\n3.1 Wastes generated from operation and cleaning\n procedures is reused or recycled according to\n environmental regulations\n3.2 Machines and engine are cleaned and stored as\n per established standards and manufacturer’s\n manual\n3.3 Work are is cleaned and maintained according to\n OHS and enterprise requirements\n3.4 Records of information are prepared in\n appropriate format\n3.5 Basic preventive maintenance is\n performed according to manufacturer’s\n instructions and/or standard practices\n\n--- PDF PAGE 48 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n46\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Machines\n1.1 Single-pass rubber roll\n1.2 Multi-pass rubber roll\n1.3 Steelhuller engelberg mill\n1.4 Centrifugal rice mill\n2. Accessories and\ncomponents\nMay include but is not limited to:\n2.1 Cleaner\n2.2 Destoner\n2.3 Polisher\n2.4 Whitener\n2.5 Separator\n2.6 Grader\n2.7 Bagger\n2.8 Engines\n2.9 Motor\n2.10 Huller\n2.11. Vacuum cleaner\n2.12. Broomstick and dustpan\n2.13. Sacks (for wastes)\n2.14. Grease gun\n2.15. Rags\n2.16 Weighing scale\n2.17 Dust collection system\n2.18 Rice hull/by-products compartment\n3. Tools and Materials\nMay include but is not limited to:\n3.1 Basic toolkit (wrench,hammer,screw driver, etc.)\n3.2 Fuel,oil\n3.3 Palay samples\n4. PPE\n4.1 Dust mask\n4.2 Ear plug\n4.3 Protective cap\n4.4 Appropriate clothing\n5. Abnormal Condition\n5.1 Erratic engine/motor speed\n5.2 Belt slippage\n5.3 Clogging\n5.4 High losses\n5.5 Excessive broken/return paddy\n\n--- PDF PAGE 49 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n47\n\nVARIABLE\nRANGE\n6. Performances\nMay include but is not limited to:\n6.1 Milling recovery\n6.2 Milling degree\n6.3 Percent head rice index\n6.4 Hulling efficiency\n6.5 Milled rice quality\n7. Wastes\n7.1 Impurities\n7.2 Biomass waste\n8. Records of information\n8.1 Grain quantity & quality\n8.2 Machine Failure\n8.3 Fuel/electricity consumption\n8.4 Hours of operation\n8.5 Labor requirement\n9. Basic preventive\nmaintenance\nMay include but are not limited to:\n9.1 Dismantling and assembling procedures\n9.2 Safety and pre-start checks\n9.3 Testing\n9.4 Tightening\n9.5 Minor adjustments and repairs (e.g. belt\ntension/ pulley alignment, engine speed)\n9.6 Routine servicing procedures (e.g. cleaning,\nlubricating, priming pumps, cleaning filters,\nchecks of cooling systems, fuel, grease and oil,\nbattery levels)\n\n--- PDF PAGE 50 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n48\nEVIDENCE GUIDE\n1. Critical Aspects of\n competency\nAssessment requires evidence that the candidate :\n1.1 Prepared rice mill machine\n1.2 Operated rice mill machine\n1.3 Operated machine at optimum efficiency\n1.4 Cleaned and stored machine and equipment\n1.5 Cleaned and maintained work area\n1.6 Prepared records of operation\n1.7 Observed OHS practices and procedures\n1.8 Performed basic routine preventive maintenance\nactivities\n2. Underpinning\nKnowledge\n and Attitudes\n2.1 Knowledge on milling system process flow\n2.2 Knowledge on Occupational Health and Safety\n Procedures\n2.3 5S and 3R applications\n2.4 Nomenclature of machine and motor/engine\n2.5 Adjustments on mill machine\n2.6 Quality assessment of mill product\n2.7 Performance of the milling system\n2.8 Dedication to work and resourcefulness\n2.9 Patience, perseverance and environmental\nConsciousness\n2.10 Sense of quality and open mindedness\n3. Underpinning Skills\n3.1 Using relevant tools and equipment\n3.2 Operating and maintaining milling system\n3.3 Preparing report\n3.4 Proper wearing of PPEs\n3.5 Performing standards operating procedures of\n equipment\n3.6 Performing safety practices and safe operation\n3.7 Demonstrating safe and environmentally responsible\n workplace practices\n3.8 Reading and interpreting manual/manufacturer’s\nspecifications, work and maintenance plans\n3.9 Using appropriate fuel and lubrication requirement\n3.10 Computation and communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Properly dried palay\n4.2 Milling machine\n4.3 Power / Engine\n 4.4 Manufacturer’s manual\n4.5 Supplies and materials\n5. Method of\n\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation/demonstration with oral questioning\n5.2 Portfolio\n6. Context of\n\nAssessment\n6.1 Competency must be assessed on actual job or\naccredited assessment center\n6.2 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 51 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n49"
      }
