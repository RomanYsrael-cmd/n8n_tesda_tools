elines\n\n--- PDF PAGE 31 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n29\n\nUNIT OF COMPETENCY: OPERATE RICE CROP ESTABLISHMENT\n MACHINERY AND EQUIPMENT\n\nUNIT CODE :"
