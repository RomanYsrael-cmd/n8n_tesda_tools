        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared rice seeder and transplanter\n1.2 Operated and shut down machines\n1.3 Operated machine at optimum efficiency\n1.4 Cleaned and stored machine and engine\n1.5 Cleaned and maintained work area\n1.6 Prepared record of operation\n1.7 Observed OHS procedures\n1.8 Performed basic routine preventive maintenance\nactivities\n2. Underpinning\nknowledge and\nattitudes\n2.1 Adaptability of rice seeder and transplanter\n2.2 Knowledge on occupational health and safety procedure\n2.3 5S and 3R applications\n2.4 Nomenclature of engine and machines\n2.5 Accessories or components adjustment\n2.6 Dedication to work and resourcefulness\n2.7 Patience, perseverance and environmentally conscious\n2.8 Sense of quality and open-mindedness\n3. Underpinning Skills\n3.1 Using relevant farm tools and machines\n3.2 Preparing report\n3.3 Appropriate/proper wearing of PPEs\n3.4 Performing standard operating procedure of equipment\n3.5 Performing safety practices and safe operation\n3.6 Demonstrating safe and environmentally responsible\nworkplace practices\n3.7 Reading and interpreting manual/manufacturer’s\nspecifications, work and maintenance plans\n3.8 Using appropriate fuel and lubrication requirement\n3.9 Computation and communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Well prepared/leveled field for planting\n4.2 Well prepared seeds/seedlings\n4.3 Machines and implements\n4.4 Manufacturer’s manual\n4.5 Supplies and materials\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation/Demonstration with Oral Questioning\n5.2 Portfolio\n6. Context for\nAssessment\n6.1 Competency must be assessed on actual job or\n accredited assessment center\n6.2 Competency assessment must be undertaken in\n accordance with endorsed TESDA assessment\n guidelines\n\n--- PDF PAGE 35 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n33\nUNIT OF COMPETENCY: OPERATE RICE CROP CARE MACHINERY AND\n EQUIPMENT\n\nUNIT CODE :"
        },
        "source_text": "AGR611362\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to operate rice crop establishment machinery\nand equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare crop\nestablishment machinery\n\n1.1 Field and seeds/seedlings are assessed for\nreadiness in planting or transplanting\n1.2 Machines are checked and adjusted for operation\nin accordance with standard practices\n1.3 Tools and materials are prepared as per work\nrequirements (seedling preparation)\n1.4 Accessories are checked and adjusted in\naccordance with operating manual\n4 Operate machines and\nmonitor performance\n\n4.1 Personal Protective Equipment (PPE) are\nselected and worn as per work requirements\n4.2 Machine is operated according to standard farm\npractices\n4.3 Abnormal conditions are identified and corrected\nin accordance with the standard operating\nprocedures\n4.4 Performances are assessed according to set\nstandards and client’s specification\n4.5 Malfunctions are recorded and referred for\nappropriate adjustment by proper personnel\n4.6 Machine is shutdown according to standard farm\npractices\n5 Perform post-operation\nactivities\n5.1 Wastes are managed according to environmental\nregulations\n5.2 Machine and engine are cleaned, checked and\nstored as per established practices\n5.3 Work are is cleaned and maintained according to\nOHS and enterprise requirements\n5.4 Records of information are prepared in\nappropriate format\n3.5 Basic preventive maintenance is performed\naccording to manufacturer’s instructions and/or\nstandard practices\n\n--- PDF PAGE 32 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n30\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Machines\n\n1.1 Rice Seeder\n1.2 Rice Transplanter\n2. Accessories\nMay include but are not limited to:\n2.1 Leveler\n2.2 Guide stick\n2.3 Floater\n2.4 Furrow opener and closer\n3. Tools and Materials\nMay include but are not limited to:\n3.1 Seeds (dry/pre-germinated)\n3.2 Sacks (for seeds and waste)\n3.3 Measuring can\n3.4 Seedlings\n3.5 Tray\n3.6 Wrenches\n3.7 Hammer\n3.8 Fuel/Oil\n3.9 Pressurized water sprayer*\n3.10 Grease gun\n3.11 Broomstick and dustpan*\n3.12 Rags*\n*For cleaning purposes\n4. PPE\n4.1 Boots\n4.2 Dust Mask\n4.3 Gloves\n4.4 Ear muff\n4.5 Protective cap\n5. Abnormal Condition\nMay include but is not limited to:\n5.1 Erratic engine speed\n5.2 Belt slippage\n5.3 Uneven seeds distribution (seeding rate)\n5.4 Not uniform transplanted seedlings (direction,\n number of seedlings/hill)\n5.5 Missing hill\n6. Performances\nMay include but are not limited to:\n6.1 Even seeding rate\n6.2 Straight row planting\n6.3 Uniform transplanted seedlings\n6.4 Acceptable field efficiency\n7. Wastes\nMay include but are not limited to:\n7.1 Excess seeds after operation\n7.1 Sacks\n7.3 Remaining seedlings after operation\n\n--- PDF PAGE 33 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n31\n\nVARIABLE\nRANGE\n8. Records of information\n8.1 Machine failure\n8.2 Fuel consumption\n8.3 Area planted\n8.4 Hours of operation\n8.5 Manpower requirements\n8.6 Date of operation\n8. Basic preventive\nmaintenance\nMay include but are not limited to:\n8.1 Dismantling and assembling procedures\n8.2 Safety and pre-start checks\n8.3 Testing\n8.4 Tightening\n8.5 Minor adjustments and repairs (e.g. belt\n tension/pulley alignment, engine speed)\n8.6 Routine servicing procedures (e.g. cleaning,\nlubricating, priming pumps, cleaning filters, checks\nof cooling systems, fuel, grease and oil, battery\nlevels)\n\n--- PDF PAGE 34 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n32\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared rice seeder and transplanter\n1.2 Operated and shut down machines\n1.3 Operated machine at optimum efficiency\n1.4 Cleaned and stored machine and engine\n1.5 Cleaned and maintained work area\n1.6 Prepared record of operation\n1.7 Observed OHS procedures\n1.8 Performed basic routine preventive maintenance\nactivities\n2. Underpinning\nknowledge and\nattitudes\n2.1 Adaptability of rice seeder and transplanter\n2.2 Knowledge on occupational health and safety procedure\n2.3 5S and 3R applications\n2.4 Nomenclature of engine and machines\n2.5 Accessories or components adjustment\n2.6 Dedication to work and resourcefulness\n2.7 Patience, perseverance and environmentally conscious\n2.8 Sense of quality and open-mindedness\n3. Underpinning Skills\n3.1 Using relevant farm tools and machines\n3.2 Preparing report\n3.3 Appropriate/proper wearing of PPEs\n3.4 Performing standard operating procedure of equipment\n3.5 Performing safety practices and safe operation\n3.6 Demonstrating safe and environmentally responsible\nworkplace practices\n3.7 Reading and interpreting manual/manufacturer’s\nspecifications, work and maintenance plans\n3.8 Using appropriate fuel and lubrication requirement\n3.9 Computation and communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Well prepared/leveled field for planting\n4.2 Well prepared seeds/seedlings\n4.3 Machines and implements\n4.4 Manufacturer’s manual\n4.5 Supplies and materials\n5. Method of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observation/Demonstration with Oral Questioning\n5.2 Portfolio\n6. Context for\nAssessment\n6.1 Competency must be assessed on actual job or\n accredited assessment center\n6.2 Competency assessment must be undertaken in\n accordance with endorsed TESDA assessment\n guidelines\n\n--- PDF PAGE 35 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n33\nUNIT OF COMPETENCY: OPERATE RICE CROP CARE MACHINERY AND\n EQUIPMENT\n\nUNIT CODE :"
      },
