  "source_text": "Engine – mechanical device that converts heat energy produced by combustion of fuel\ninto mechanical energy\n\n4-Wheel Tractor – wheeled power source having two axles, design to carry work by\npulling or propel various agricultural machines and implements. They are\nclassified according to horsepower rating\n\nHand Tractor – machine with power ranging 3 – 16 hp used for tilling and other form of\nfarm task such as cultivating, planting, irrigating and harvesting. These are also\nknown as power tiller, two- wheel tractor or walking tractor\n\nLand Preparation Machinery – machines designed to carry out farm work either by\npulling or propel agricultural implements for the purpose of preparing the soil for\nseedbed\n\nCrop Establishment Machinery – machinery device whether self-propelled or\npulled/hitch to a wheeled vehicle, used to place seeds or plant into the soil for\npropagation and production of crops\n\nCrop Care Machinery – machinery device whether self-propelled or hitch to a wheeled\nvehicle, to provide plant condition free from weeds, pest diseases, including\nprovision to supply for water and nutrients\n\nDryer Machinery – machinery device powered either by electric motor or internal\ncombustion engine used to lower down or remove available water from the\ngrains through evaporation by the application of heated air\n\nRice Mill Machinery – machinery device to process conversion of paddy into rice which\ninvolves the removal of husk and bran to produce milled rice\n\nMoldboard Plow – an implement consisting of a warped surface equipped with a\ncutting edge which crumbles and inverts the soil\n\nTillage Implements –implement pulled either by a four or two- wheel tractor used to\nbreak and loosen the soil to a desired depth. It includes the mouldboard, disc,\nchisel, subsoiler and middlebreakers\n\nField Pattern – an established and efficient plowing pattern, the objective is to minimize\nthe amount of non-working turns and travel distance in a turn\n\nHarvesting – the process of gathering the useful portion of the crop from the field. In\nthe case of rice, it refers to the gathering of the matured panicles preparatory to\nthreshing\n\n--- PDF PAGE 63 ---\n61\nCombine Harvesting – harvesting and threshing are done by a single machine called\ncombine\n\nStripping – the method of removing or gathering the grains from the panicles without\ncutting or uprooting the plants\n\nThreshing – involves the detachment of the seeds from the panicles either by rubbing,\nimpact and stripping\n\n--- PDF PAGE 64 ---\n62",
