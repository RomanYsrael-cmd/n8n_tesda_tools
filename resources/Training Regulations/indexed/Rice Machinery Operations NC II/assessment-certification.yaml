s in farm operations Use Farm Tools and Equipment Perform Estimation and Basic Calculation Lead workplace communication Work with others Lead small teams Solve problems related to work activities Receive and respond to workplace communication Apply problem solving techniques to workplace Practice occupational health and safety procedures Develop and practice negotiation skills Operate rice crop care machinery Collect, analyze and organize information Practice basic housekeeping procedures Demonstrate work values Use mathematical method Participate in workplace communication Use relevant technologies Work in team environment Utilize specialized communication skills Practice career professionalism Develop team and individual Operate rice mill machinery Operate rice harvester and thresher machinery Operate rice dryer machinery Apply food safety and sanitation Assist in Aquaculture Operations Test & Analyze Physico -Chemical Properties of Foods, Agri Products, Water & Assess Farm Resources Service Tractor’s Engine Perform Post Harvest Operations of Major Lowland and Semi Temperature Vegetables Crops Operate rice crop establishment machinery Prevent and fight fire Provide first aid treatment on board Protect marine environment Comply with emergency procedures --- PDF PAGE 62 --- 60 Engine – mechanical device that converts heat energy produced by combustion of fuel into mechanical energy 4-Wheel Tractor – wheeled power source having two axles, design to carry work by pulling or propel various agricultural machines and implements. They are classified according to horsepower rating Hand Tractor – machine with power ranging 3 – 16 hp used for tilling and other form of farm task such as cultivating, planting, irrigating and harvesting. These are also known as power tiller, two- wheel tractor or walking tractor Land Preparation Machinery – machines designed to carry out farm work either by pulling or propel agricultural implements for the purpose of preparing the soil for seedbed Crop Establishment Machinery – machinery device whether self-propelled or pulled/hitch to a wheeled vehicle, used to place seeds or plant into the soil for propagation and production of crops Crop Care Machinery – machinery device whether self-propelled or hitch to a wheeled vehicle, to provide plant condition free from weeds, pest diseases, including provision to supply for water and nutrients Dryer Machinery – machinery device powered either by electric motor or internal combustion engine used to lower down or remove available water from the grains through evaporation by the application of heated air Rice Mill Machinery – machinery device to process conversion of paddy into rice which involves the removal of husk and bran to produce milled rice Moldboard Plow – an implement consisting of a warped surface equipped with a cutting edge which crumbles and inverts the soil Tillage Implements –implement pulled either by a four or two- wheel tractor used to break and loosen the soil to a desired depth. It includes the mouldboard, disc, chisel, subsoiler and middlebreakers Field Pattern – an established and efficient plowing pattern, the objective is to minimize the amount of non-working turns and travel distance in a turn Harvesting – the process of gathering the useful portion of the crop from the field. In the case of rice, it refers to the gathering of the matured panicles preparatory to threshing --- PDF PAGE 63 --- 61 Combine Harvesting – harvesting and threshing are done by a single machine called combine Stripping – the method of removing or gathering the grains from the panicles without cutting or uprooting the plants Threshing – involves the detachment of the seeds from the panicles either by rubbing, impact and stripping --- PDF PAGE 64 --- 62 The Technical Education and Skills Development Authority (TESDA) wishes to extend gratitude and appreciation to the many representatives of business, industry, academe and government agencies and labor groups who donated their time and expertise to the development and validation of these Training Regulations. • THE TECHNICAL ADVISORY PANEL (TAP) DR. MARIO S. SUBA (Chair) DIR. PETE OCAMPO Presidential Assistant for Internal Development / Professor Livestock Development Council Department of Agriculture Central Luzon State University (CLSU) City Science of Muños, Nueva Ecija MS. JOSEFINA A. CONTRERAS Officer-In-Charge DR. EDUARDO M. MARIANO (DVM) Farm Manager/ Consultant ARSEN Farm Inc. Bureau of Animal Industry Majayjay, Laguna Valenzuela Metro Manila • THE TECHNICAL EXPERT PANEL (TEP) ENGR. BALBINO C. GERONIMO ENGR. ROMULO E. EUSEBIO University Extension Specialist Engineer III Agricultural Mechanization Development Program (AMDP) Agricultural Machinery Testing and Evaluation Center Institute of Agricultural Engineering/ College of Engineering abd Agri-Industrial Technology College of Engineering and Agro- Industrial Technology U.P. Los Baños U.P. Los Baños Los Baños, Laguna Los Baños, Laguna ENGR. ARNOLD S. JULIANO ENGR. ELISEO E. PATON-OG Senior Science Research Specialist Production Manager ACT Machineries and Metalcraft Corporation Rice Engineering and Mechanization Division Cauyan City, Isabela Philippine Rice Research Institute ENGR. BERNARDO D. TADEO Muñoz, Nueva Ecija President Philippine Society of Agricultural Engineers (PSAE) ATI Level 1, Elliptical Road Diliman, Quezon City --- PDF PAGE 65 --- 63 The Participants in the National Validation of this Training Regulation: • Central Luzon State University (CLSU) Science City of Muñoz, Nueva Ecija • Philippine Rice Research Institute (PHILRICE) Science City of Muñoz, Nueva Ecija • Philippine Sino Center for Agricultural Technology (PHILSCAT) Science City of Muñoz, Nueva Ecija • Bureau of Post-harvest Research and Extension (BPRE) Science City of Muñoz, Nueva Ecija • Don Bosco Training Center San Jose City, Nueva Ecija • Philippine Research Institute Muñoz City, Nueva Ecija • NIA – UPRIIS Cabanatuan City • ACT Machineries a