  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.\nTo attain the National Qualification of Rice Machinery Operation NC\nII, the candidate must demonstrate competence in the operation of at\nleast three (3) types of rice machinery as listed below. Successful\ncandidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2\nIndividuals aspiring to be awarded the qualification of Rice Machinery\nOperation NC II must acquire Certificate of Competency (COCs) in\nany three (3) of the following core units of the Qualification.\nCandidates may apply for assessment in any accredited assessment\ncenter.\n\n 4.2.1 Operating Rice Land Preparation Machinery and\nEquipment\n\n4.2.2 Operating Rice Crop Establishment Machinery and\nEquipment\n\n4.2.3 Operating Rice Crop Care Machinery and Equipment\n\n4.2.4 Operating Rice Harvesting and Threshing Machinery\nand Equipment\n\n4.2.5 Operating Rice Drying Machinery and Equipment\n\n4.2.6 Operating Rice Mill Machinery and Equipment\n\nSuccessful candidates shall be awarded Certificates of\nCompetency (COCs).\n\n--- PDF PAGE 60 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n58\n\n4.3\nUpon accumulation and submission of all COCs required for the\nqualification, an individual shall be issued the corresponding National\nCertificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.1\nThe following are qualified to apply for assessment and certification:\n\n4.5.1\nGraduates of formal, non-formal and informal including\nenterprise-based training programs\n\n4.5.2 Experienced Workers (wage employed or self-employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail\nin the Procedures Manual on Assessment and Certification and\nGuidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS).\n