  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.\nTo attain the National Qualification of Rice Machinery Operation NC\nII, the candidate must demonstrate competence in the operation of at\nleast three (3) types of rice machinery as listed below. Successful\ncandidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2\nIndividuals aspiring to be awarded the qualification of Rice Machinery\nOperation NC II must acquire Certificate of Competency (COCs) in\nany three (3) of the following core units of the Qualification.\nCandidates may apply for assessment in any accredited assessment\ncenter.\n\n 4.2.1 Operating Rice Land Preparation Machinery and\nEquipment\n\n4.2.2 Operating Rice Crop Establishment Machinery and\nEquipment\n\n4.2.3 Operating Rice Crop Care Machinery and Equipment\n\n4.2.4 Operating Rice Harvesting and Threshing Machinery\nand Equipment\n\n4.2.5 Operating Rice Drying Machinery and Equipment\n\n4.2.6 Operating Rice Mill Machinery and Equipment\n\nSuccessful candidates shall be awarded Certificates of\nCompetency (COCs).\n\n--- PDF PAGE 60 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n58\n\n4.3\nUpon accumulation and submission of all COCs required for the\nqualification, an individual shall be issued the corresponding National\nCertificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.1\nThe following are qualified to apply for assessment and certification:\n\n4.5.1\nGraduates of formal, non-formal and informal including\nenterprise-based training programs\n\n4.5.2 Experienced Workers (wage employed or self-employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail\nin the Procedures Manual on Assessment and Certification and\nGuidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS).\n\n--- PDF PAGE 61 ---\nTR – Rice Machinery Operations NC II Promulgated\n\n59\n\nSupermarket of Competencies\nAGRI-FISHERY Sector\nRice Machinery Operation NC II\n\nPromote\nenvironmental\nprotection\nPlan and organize\nwork\nOperate rice\nland preparation\nmachinery\nAGRI-FISHERY Sector\nRice Machinery Operation NC II\nProduce\nVegetables\nProduce Grain\nCrops\nService and\nRepair\nBusiness\nMachine\nPerform\nLandscaping\nActivities\nOperate and\nmaintain\nMechanical Grain\nDryer\nGrade and Classify\nGrain\nRaise Small\nRuminants\nControl Pest of\nStored Grains\nand Products\nService Tractor’s\nRear Axle, Front\nAxle & Brake\nSystem\nOperate\nFish Nursery\nService Tractor’s\nElectrical System\nPerform Fish or\nShrimp Grow Out\nOperations\nConstruct\nAquaculture\nFacilities\nCORE COMPETENCIES\nProduce Fruit\nBearing Crops\nProduce Cut\nFlowers\nOperate\nSeedling\nNursery\nManage Farm\nOperate and\nMaintain Rice Mill\nEquipment\nPerform Post\nHarvest\nOperations of\nMajor Tropical\nFruits\nPerform On Farm\nGrain Post Harvest\nAnalyze Foods\nand Agricultural\nProducts\nService, Repair &\nMaintain Small\nGasoline Engine\nTest & Analyze\nMicrobiological\nProperties of\nFoods,\nAgri\nProducts, Water &\nService, Repair &\nMaintain Crop Post\nHarvest Equipment\nService, Repair\n& Maintain Crop\nProduction\nService, Repair &\nMaintain Small\nDiesel Engines\nService Tractor’s\nClutch &\nTransmission\nSystem\nService Tractor’s\nHydraulic System\nOperate Tilapia\nHatchery\nGrow Seaweed\nOperate catfish\nHatchery\nProfile the Market\nDevelop\nMarketing Plan\nDevelop Marketing\nCommunication\nPlan\nPromote Products\n& Services\nMarket\nAgri\nProducts\nService Tractor’s\nSteering System\nProduce Fuel\nByproducts\nProduce Compost\nProduce\nHandpaper\nAssist in\nHorticulture\nOperations\nProduce Biogas\nByproducts\nRaise Poultry\nRaise swine\nRaise large\nRuminants\nCOMMON\nCOMPETENCIES\nApply Safely\nMeasures in\nfarm\noperations\nUse Farm Tools\nand Equipment\nPerform\nEstimation and\nBasic Calculation\nLead workplace\ncommunication\nWork with\nothers\nLead small\nteams\nSolve problems\nrelated to work\nactivities\nReceive and\nrespond to\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\nApply problem\nsolving techniques\nto workplace\nPractice occupational\nhealth and safety\nprocedures\nDevelop and\npractice negotiation\nskills\nOperate rice\ncrop care\nmachinery\nCollect, analyze\nand organize\ninformation\nPractice basic\nhousekeeping\nprocedures\nDemonstrate work\nvalues\nUse mathematical\nmethod\nParticipate in\nworkplace\ncommunication\nUse relevant\ntechnologies\nWork in team\nenvironment\nUtilize specialized\ncommunication\nskills\nPractice career\nprofessionalism\nDevelop team and\nindividual\nOperate rice mill\nmachinery\nOperate rice\nharvester and\nthresher\nmachinery\nOperate rice\ndryer machinery\nApply food\nsafety and\nsanitation\nAssist in\nAquaculture\nOperations\nTest & Analyze\nPhysico -Chemical\nProperties of\nFoods,\nAgri\nProducts, Water &\nAssess Farm\nResources\nService Tractor’s\nEngine\nPerform Post\nHarvest Operations\nof Major Lowland\nand Semi\nTemperature\nVegetables Crops\nOperate rice\ncrop\nestablishment\nmachinery\nPrevent and\nfight fire\nProvide first aid\ntreatment on\nboard\nProtect marine\nenvironment\nComply with\nemergency\nprocedures\n\n--- PDF PAGE 62 ---\n60\n\nGLOSSARY OF TERMS\n\nEngine – mechanical device that converts heat energy produced by combustion of fuel\ninto mechanical energy\n\n4-Wheel Tractor – wheeled power source having two axles, design to carry work by\npulling or propel various agricultural machines and implements. They are\nclassified according to horsepower rating\n\nHand Tractor – machine with power ranging 3 – 16 hp used for tilling and other form of\nfarm task such as cultivating, planting, irrigating and harvesting. These are also\nknown as power tiller, two- wheel tractor or walking tractor\n\nLand Preparation Machinery – machines designed to carry out farm work either by\npulling or propel agricultural implements for the purpose of preparing the soil for\nseedbed\n\nCrop Establishment Machinery – machinery device whether self-propelled or\npulled/hitch to a wheeled vehicle, used to place seeds or plant into the soil for\npropagation and production of crops\n\nCrop Care Machinery – machinery device whether self-propelled or hitch to a wheeled\nvehicle, to provide plant condition free from weeds, pest diseases, including\nprovision to supply for water and nutrients\n\nDryer Machinery – machinery device powered either by electric motor or internal\ncombustion engine used to lower down or remove available water from the\ngrains through evaporation by the application of heated air\n\nRice Mill Machinery – machinery device to process conversion of paddy into rice which\ninvolves the removal of husk and bran to produce milled rice\n\nMoldboard Plow – an implement consisting of a warped surface equipped with a\ncutting edge which crumbles and inverts the soil\n\nTillage Implements –implement pulled either by a four or two- wheel tractor used to\nbreak and loosen the soil to a desired depth. It includes the mouldboard, disc,\nchisel, subsoiler and middlebreakers\n\nField Pattern – an established and efficient plowing pattern, the objective is to minimize\nthe amount of non-working turns and travel distance in a turn\n\nHarvesting – the process of gathering the useful portion of the crop from the field. In\nthe case of rice, it refers to the gathering of the matured panicles preparatory to\nthreshing\n\n--- PDF PAGE 63 ---\n61\nCombine Harvesting – harvesting and threshing are done by a single machine called\ncombine\n\nStripping – the method of removing or gathering the grains from the panicles without\ncutting or uprooting the plants\n\nThreshing – involves the detachment of the seeds from the panicles either by rubbing,\nimpact and stripping\n\n--- PDF PAGE 64 ---\n62\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend gratitude and appreciation to the many representatives of business, industry,\nacademe and government agencies and labor groups who donated their time and\nexpertise to the development and validation of these Training Regulations.\n\n• THE TECHNICAL ADVISORY PANEL (TAP)\n\nDR. MARIO S. SUBA (Chair)\n\nDIR. PETE OCAMPO\nPresidential Assistant for Internal\nDevelopment / Professor\nLivestock Development Council\nDepartment of Agriculture\nCentral Luzon State University (CLSU)\nCity Science of Muños, Nueva Ecija\n\nMS. JOSEFINA A. CONTRERAS\nOfficer-In-Charge\n\nDR. EDUARDO M. MARIANO (DVM)\nFarm Manager/ Consultant\nARSEN Farm Inc.\nBureau of Animal Industry\nMajayjay, Laguna\nValenzuela Metro Manila\n\n• THE TECHNICAL EXPERT PANEL (TEP)\n\nENGR. BALBINO C. GERONIMO\nENGR. ROMULO E. EUSEBIO\nUniversity Extension Specialist\nEngineer III\nAgricultural Mechanization Development\nProgram (AMDP)\nAgricultural Machinery Testing and\nEvaluation Center\nInstitute of Agricultural Engineering/\nCollege of Engineering abd Agri-Industrial\nTechnology\nCollege of Engineering and Agro-\nIndustrial Technology\nU.P. Los Baños\nU.P. Los Baños\nLos Baños, Laguna\nLos Baños, Laguna\nENGR. ARNOLD S. JULIANO\nENGR. ELISEO E. PATON-OG\nSenior Science Research Specialist\nProduction Manager\nACT Machineries and Metalcraft Corporation\nRice Engineering and Mechanization\nDivision\nCauyan City, Isabela\nPhilippine Rice Research Institute\nENGR. BERNARDO D. TADEO\nMuñoz, Nueva Ecija\nPresident\n\nPhilippine Society of Agricultural\nEngineers (PSAE)\nATI Level 1, Elliptical Road\nDiliman, Quezon City\n\n--- PDF PAGE 65 ---\n63\n\nThe Participants in the National Validation of this Training Regulation:\n\n• Central Luzon State University (CLSU)\nScience City of Muñoz, Nueva Ecija\n\n•\nPhilippine Rice Research Institute (PHILRICE)\nScience City of Muñoz, Nueva Ecija\n\n•\nPhilippine Sino Center for Agricultural Technology (PHILSCAT)\n Science City of Muñoz, Nueva Ecija\n\n•\nBureau of Post-harvest Research and Extension (BPRE)\nScience City of Muñoz, Nueva Ecija\n\n•\nDon Bosco Training Center\n San Jose City, Nueva Ecija\n\n•\nPhilippine Research Institute\nMuñoz City, Nueva Ecija\n\n•\nNIA – UPRIIS\n Cabanatuan City\n\n•\nACT Machineries and Metalcraft Corporation\n Cauyan City, Isabela\n\nThe TESDA Board Members and Secretariat\n\nThe Management and Staff of the TESDA Secretariat\n\n•\nQSO"
