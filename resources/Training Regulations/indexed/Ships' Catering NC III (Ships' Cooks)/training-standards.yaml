fety\nManagement\n• Performing actual\ngalley cleaning in\naccordance with state\nauthority standard\n• Self-paced\nHand-outs/\nModule\n• Video showing\n• Group\ndiscussion\n• Practical\nexercises\n\n• Oral\nQuestioning\n• Demonstration\n5 hours\n\n--- PDF PAGE 134 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 131\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude\ninto account but requires evidence of actual performance of the\ncompetency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1.\nInstitution- Based:\n\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n--- PDF PAGE 135 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 132\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n• Must be High School graduate\n• Must have completed Basic Training (BT), Ship Security Awareness and\n Seafarers with Designated Security Duties (SSA/SDSD) Training\n• Must have at least 3 months relevant sea service or/\nGraduate of Bachelor of Science in Hotel and Restaurant Management\n(BSHRM) or\n\no Completed prescribed culinary related course such as Commercial\nCooking NC II, Cookery NC II, Commercial Cooking NC III, Ship’s\nCatering Services NC II and Bread and Pastry Production NC II or\no Work as cook/assistant cook in hotel or restaurant for at least one\n year as evidenced with Employment Certificate or\no Holder of TESDA National Certificate for Commercial Cooking NC II or\n Cookery NC II or Commercial Cooking NC III or Ship’s Catering\n Services NC II or Bread and Pastry\n Production NC II\n\n• Can communicate in English language both oral and written\n\n• Must be physically and mentally fit to undergo Ships’ Catering NC III\n(Ships’ Cooks) training program\n\n3.4\nTOOLS AND EQUIPMENT\n LIST OF TOOL, EQUIPMENT AND MATERIALS\n\nSHIPS’ CATERING NC III (SHIPS’ COOKS)\n\nList of tools, equipment and materials for the training of a maximum of 24\ntrainees for SHIPS’ CATERING NC III (SHIPS’ COOKS) are as follows:\n\nTOOLS\nEQUIPMENT\nCOOKING UTENSILS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\nBasic cutting knives\n1 unit\nIndustrial freezer, 4-\ndoor\n12 pcs. Sauce pan w/ handle\n12 pcs Paring knife\n1 unit\nIndustrial chiller, 4-\ndoor\n12 pcs. Sauteing pan\n12\npcs.\nChef’s knife\n4 units 6-burner industrial\nstove / hot plate or\nelectric stove Or\n4 pcs.\nStock pots\n6 units 4-burner industrial\nstove / hot plate or\nelectric stove\n\n6 pcs. Dough cutter\n1 unit\nProofer\n12 pcs. Frying pan\n6 pcs. Wire 