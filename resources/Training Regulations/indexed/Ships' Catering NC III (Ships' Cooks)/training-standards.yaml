 components.\n\n--- PDF PAGE 135 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 132\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n• Must be High School graduate\n• Must have completed Basic Training (BT), Ship Security Awareness and\n Seafarers with Designated Security Duties (SSA/SDSD) Training\n• Must have at least 3 months relevant sea service or/\nGraduate of Bachelor of Science in Hotel and Restaurant Management\n(BSHRM) or\n\no Completed prescribed culinary related course such as Commercial\nCooking NC II, Cookery NC II, Commercial Cooking NC III, Ship’s\nCatering Services NC II and Bread and Pastry Production NC II or\no Work as cook/assistant cook in hotel or restaurant for at least one\n year as evidenced with Employment Certificate or\no Holder of TESDA National Certificate for Commercial Cooking NC II or\n Cookery NC II or Commercial Cooking NC III or Ship’s Catering\n Services NC II or Bread and Pastry\n Production NC II\n\n• Can communicate in English language both oral and written\n\n• Must be physically and mentally fit to undergo Ships’ Catering NC III\n(Ships’ Cooks) training program\n\n3.4\nTOOLS AND EQUIPMENT\n LIST OF TOOL, EQUIPMENT AND MATERIALS\n\nSHIPS’ CATERING NC III (SHIPS’ COOKS)\n\nList of tools, equipment and materials for the training of a maximum of 24\ntrainees for SHIPS’ CATERING NC III (SHIPS’ COOKS) are as follows:\n\nTOOLS\nEQUIPMENT\nCOOKING UTENSILS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\nBasic cutting knives\n1 unit\nIndustrial freezer, 4-\ndoor\n12 pcs. Sauce pan w/ handle\n12 pcs Paring knife\n1 unit\nIndustrial chiller, 4-\ndoor\n12 pcs. Sauteing pan\n12\npcs.\nChef’s knife\n4 units 6-burner industrial\nstove / hot plate or\nelectric stove Or\n4 pcs.\nStock pots\n6 units 4-burner industrial\nstove / hot plate or\nelectric stove\n\n6 pcs. Dough cutter\n1 unit\nProofer\n12 pcs. Frying pan\n6 pcs. Wire 