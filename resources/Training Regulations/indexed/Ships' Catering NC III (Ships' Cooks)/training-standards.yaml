inimum safe manning\nrequirement\n• Practice mathematical\nconcepts to solve\nproblem in the\nworkplace\n• Direct\nobservation\n• Demonstration\n• Written exam\n• Practical/\nperformance\ntest\n1 hour\n\n--- PDF PAGE 104 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 101\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\n(Required Knowledge)\nPractical Activities\n(Required Skills)\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5.2 Apply\nmathematical\nprocedures/\nsolution\n• Fundamental operation\n(addition, subtraction,\ndivision, multiplication)\n• Compute for the\nshortage in the ship’s\nfood budget due to the\nchange to a longer\nship’s voyage\n• Practice linear\nmeasurements and\nconversion\n• Practice mathematical\ncalculation on\nworkplace situation\n• Simulation/\nrole playing\n• Demonstration\n• Written exam\n• Practical/\nperformance\ntest\n1.5\nhours\n5.3 Analyze\nresults\n• Precision and accuracy\n• Compare the prepared\nbudget against the new\nrequirements and\nidentify gaps\n• Analysis of result\n• Case studies\n• Demonstration\n• Written exam\n• Interviews\n\n1.5\nhours\n6. Use relevant\ntechnologies\n\n6.1 Identify\nappropriate\ntechnology\n• Awareness on technology and\nits function\n• Communication techniques\n• Prepare the ship’s\nvictualling budget using\nthe ship’s software\n• Film Viewing regarding\ntechnology and its\nbenefits\n• Identify different\ntechnology applicable to\nworkplace\n• Direct\nobservation\n• Multimedia\npresentation\n• Written exam\n• Demonstration\n0.5\nhour\n\n--- PDF PAGE 105 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 102\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\n(Required Knowledge)\nPractical Activities\n(Required Skills)\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6.2 Apply relevant\ntechnology\n• Study different relevant\ntechnology in the workplace\n• Relate 5s to technology\n• Conduct risk\nassessment for a\nroutine or non-routine\ntask 