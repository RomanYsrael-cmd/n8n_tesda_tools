actical Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5. Implement\nwaste\nmanagement\nand disposal\nsystem\n\n5.1 Collect and\nsegregate\nwaste\n• Systems of waste collection\n• Types and categories of\ngarbage/wastes\n• Types of labeled waste bins\n• Waste management for each\ntype of waste\n• Relevant regulations\n(MARPOL, etc…)\n• Waste segregation\nprocedures\n• Personal protective\nequipment (PPE)\n• Performing waste\ncollection and\nsegregation:\nbiodegradable, non-\nbiodegradable and\nhazardous waste\nduring food\nproduction\n• Self-paced\nHand-outs/\nModule\n• Video showing\n• Group\ndiscussion\n• Role play\n• Written Exam\n• Oral\nQuestioning\n• Demonstration\n\n2 hours\n\n5.2 Store waste\n• Different waste\ncharacteristics\n• Relevant regulations\n(MARPOL, etc….)\n• Personal protective\nequipment (PPE)\n• Ways of minimizing food\nwastage using leftovers\n• Performing waste\nstorage:\nbiodegradable, non-\nbiodegradable and\nhazardous waste\nduring food\nproduction\n• Self-paced\nHand-outs/\nModule\n• Video showing\n• Group\ndiscussion\n• Role play\n• Written Exam\n• Oral\nQuestioning\n• Demonstration\n1 hour\n\n--- PDF PAGE 132 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 129\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\nPractical Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5.3 Dispose of\nwaste\n• Garbage Management Plans\n• Garbage Record Books\n• Types and categories of\ngarbage\n• Types of labeled waste bins\n• Waste Management Program\nfor Disposal of all types of\nwaste\n• Relevant regulations\n(MARPOL, etc…)\n• Personal protective\nequipment (PPE)\n• Perform waste\ndisposal:\nbiodegradable, non-\nbiodegradable and\nhazardous waste\nduring food\nproduction\n• Prepare garbage\nrecord book\n\n• Self-paced\nHand-outs/\nModule\n• Video showing\n• Group\ndiscussion\n• Role Play\n• Written Exam\n• Oral\nQuestioning\n• Demonstration\n1 hour\n\n6. Supervise/\nAdminister\ngalley area\n\n6