  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for SHIPS’ CATERING NC III (SHIPS’\nCOOKS).\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-\nbased curricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units\nof competency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized.\nTo this end, TVET providers shall develop a Contextual Learning Matrix (CLM)\nto include MLC-2006, green technology, issues on health and drugs and\ncatering to persons with disabilities (PWD’s).\n\nCourse Title: SHIPS’ CATERING (SHIPS’ COOKS) NC Level: NC III\n\nNominal Training Duration:\n20 Hours (Basic Competencies)\n 60 Hours (Common Competencies)*\n80 Hours (Core Competencies)\n\n 160 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of\nSHIPS’ CATERING NC III (SHIPS’ COOKS) in accordance with industry\nstandards . This covers competencies that a person must achieve in managing\nall galley operations, including both the procurement of supplies and practical\nfood production in compliance with the national and international requirements\nfor the duration and nature of the voyage. It also includes competencies in\nserving proper quantities of quality nutritious food that fulfills cultural, religious\nand hygiene requirements including storing and handling food hygienically.\n\nThis course is also designed to enhance the knowledge, skills and\nattitudes of an individual in the field of cooking.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 99 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 96\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\n(Required Knowledge)\nPractical Activities\n(Required Skills)\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n\n1.1Communicate\ninformation\nabout\nworkplace\nprocesses.\n.\n• Method of communication\n• Communication skills\n• Communication tools\n• Questioning techniques\n\n• Expressing One self\n• Practice on Public\nspeaking\n• Written activities on\nworkplace process\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n• Demonstration\n• Written Test\n• Interview\n• Observation\n2 hours\n\n1.2 Lead\nworkplace\ndiscussions\n• Method/technique of\ndiscussion\n• How to lead discussion\n• How to solicit response\n• Written and Electronic\ncommunication\nactivities\n• Debate Exercises\n• Self-paced\nhandout/\nmodule\n• Discussion\n• Role Play\n• Written Test\n• Demonstration\n\n2 hours\n\n1.3 Identify and\ncommunicate\nissues arising\nin the\nworkplace\n• Identify problems and issues\n• Organizing information on\nproblem and issues\n• Relating problems and\nissues\n• Communication barriers\naffecting workplace\ndiscussions\n\n• Communicate with the\nMaster of the ship on\nthe possible shortage\nof the food supply due\nto change of ship’s port\nof call/voyage\n• Resolving conflict in the\nworkplace\n• Making a report about\nproblem and issues\n• Practice communication\nmodel\n• Brainstorming\n• Self-paced\nhandout/\nmodule\n• Role Play\n• Self-paced\nhandout/\nmodule\n\n• Interviews\n• Written exam\n• Demonstration\n\n2 hours\n\n--- PDF PAGE 100 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 97\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\n(Required Knowledge)\nPractical Activities\n(Required Skills)\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Lead small\nteams\n2.1 Provide team\nleadership\n• Communication skills\nrequired for leading small\nteam\n• Skills and techniques in\npromoting team building\n• Negotiating skills\n• Up to date dissemination of\ninstruction and requirements\nto members\n• Art of listening and treating\nindividual team members\nconcern\n\n• Evaluate the success\nfactors in the\ncontribution of the\ngalley personnel in the\nimplementation of the\nsafety, quality and\nenvironmental\nobjectives of the ship\n• Practice leadership\nactivities\n• Teambuilding activities\n• Write simple negotiation\nstrategy on workplace\nissues\n• Role play on\ncommunication model\nand the art of listening\n• Self-paced\nhandout/\nmodule\n• Role Play\n• Case Study\n• Written\n• Oral\nQuestioning\n• Demonstration\n\n2 hours\n2.2 Assign\nresponsibilities\namong\nmembers\n• Duties and responsibilities of\neach team member\n• Skills in identifying individual\nskills, knowledge and attitude\nas basis for allocating\nresponsibilities\n• Knowledge in identifying each\nteam member duties and\nresponsibilities\n• Planning session\nregarding duties and\nresponsibilities of each\nteam member\n• Writeshop of\ninterpersonal abilities,\nattitude and knowledge\n• Identification of team\nmembers\nresponsibilities thru\nsimulation\n• Role Play\n• Workshop\n• Demonstration\n• Case studies\n• Interview\n• Demonstration\n\n--- PDF PAGE 101 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 98\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\n(Required Knowledge)\nPractical Activities\n(Required Skills)\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2.3 Set\nperformance\nexpectation for\nteam members\n• Knowledge and skills in\nsetting individual performance\ntarget/expectation\n• Team members duties and\nresponsibilities\n• Employee policies and\nprocedures\n• Defining performance\nexpectations criteria\n• Develop /implement an\nappraisal document for\nthe messman\n• Workshop on setting\nindividual performance\ntarget\n• Writeshop on team\nmembers duties and\nresponsibilities\n• Video presentation\nregarding employees\nperformance role and\nexpectation towards\nwork\n• Group\ndiscussion\n• Writeshop\n• Multimedia\npresentation\n• Written exam\n• Demonstration\n• Written Exam\n1 hour\n2.4 Supervise\nteam\nperformance\n• Knowledge and skills in\nmonitoring team member\nperformance\n• Monitoring team operation to\nensure client needs and\nsatisfaction\n• Methods of monitoring\nperformance\n• Informal/formal counseling\nskills\n• Practice monitoring\nskills\n• Design monitoring\nscheme for team\noperation as well as\nclient satisfaction and\nneeds\n• Evaluate performance\nof messman\n• Role Play\n• Writeshop\n• Discussions\n• Self-paced\nhandout/\nmodule\n• Group\nDynamics\n\n• Written Test\n• Demonstration\n• Written Test\n• Demonstration\n\n1 hour\n\n--- PDF PAGE 102 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 99\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\n(Required Knowledge)\nPractical Activities\n(Required Skills)\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify\nrelevant\ninformation in\nplanning\nnegotiations\n• Background information on\nother parties to the\nnegotiation\n• Observing differences\nbetween content and process\n• Identifying bargaining\ninformation\n• Applying strategies to\nmanage process\n• Preparing a three (3)\nmonth victualing\nrequirement\n• Perform Data gathering\nregarding relevant\ninformation related to\nnegotiation\n• Designing a negotiation\nprocess\n• Practice negotiation\nstrategies and manage\nthe process\n• Direct\nobservation\n• Self-paced\nhandout/\nmodule\n• Discussion\n• Workshop\n\n• Interviews\n• Written exam\n• Demonstration\n\n2 hours\n3.2 Participate in\nnegotiations\n• Applying steps in negotiating\nprocess\n• Strategies to manage conflict\n•Steps in negotiating process\n• Writeshop on identifying\nnegotiation process\n• Perform background\ninformation gathering\n• Simulation/\nrole playing\n• Writeshop\n•Discussion\n• Written exam\n• Practical/\nperformance\ntest\n3.3 Document\nareas for\nagreement\n• Procedure in documenting\nnegotiations\n• Managing information\n• Filing documents\n• Practice documentation\ntechniques/minutes of\nmeeting\n• Practice recording of\nagreement\n•Keeping of records\n• Case studies\n• Role play\n• Written exam\n• Practical/\nperformance\ntest\n4. Solve problems\nrelated to work\nactivities\n4.1 Explain the\nanalytical\ntechniques\n• Observation, investigation &\nanalytical techniques\n• Brainstorming\n• Cause and effect diagrams\n• Conduct investigation\nand root cause\nanalyses and implement\ncorrective actions\n• Perform analytical skills\nin solving problem\nrelated to work\n• Direct\nobservation\n• Simulation\n• Written test\n• Demonstration\n2 hours\n\n--- PDF PAGE 103 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 100\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\n(Required Knowledge)\nPractical Activities\n(Required Skills)\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4.2 Identify the\nproblem\n• Normal operating parameters\n& product quality\n• Identifying & clarifying the\nnature of problem\n• Application of analytical\ntechniques\n• Evaluate the present\nstatus of the galley\nperformance against the\nestablished Safety,\nquality and\nenvironmental policies\nof the ship Discussion in\nidentifying and clarifying\nthe nature of problem\n• Simulation/\nrole playing\n• Discussion\n• Simulation\n• Written exam\n• Practical/\nperformance\ntest\n• Demonstration\n4.3 Determine the\npossible\ncause/s of the\nproblem\n• Non-routine process and\nquality problems\n• Teamwork and work\nallocation problem\n• Safety and emergency\nsituations and incidents\n• Implement corrective or\npreventive actions\nbased on root cause\nanalyses\n• View video presentation\non possible cause of\nproblem in the\nworkplace\n• Writeshop on the\ndetermining problems in\nthe workplace\n• Case studies\n• Multimedia\npresentation\n• Writeshop\n\n• Written exam\n• Interviews\n• Written Test\n\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify\nmathematical\ntools and\ntechniques to\nsolve problem\n• Measurement system\n• Basic measuring\ntools/devices\n• Prepare ship’s Monthly\nBudget based on the\nminimum safe manning\nrequirement\n• Practice mathematical\nconcepts to solve\nproblem in the\nworkplace\n• Direct\nobservation\n• Demonstration\n• Written exam\n• Practical/\nperformance\ntest\n1 hour\n\n--- PDF PAGE 104 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 101\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\n(Required Knowledge)\nPractical Activities\n(Required Skills)\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5.2 Apply\nmathematical\nprocedures/\nsolution\n• Fundamental operation\n(addition, subtraction,\ndivision, multiplication)\n• Compute for the\nshortage in the ship’s\nfood budget due to the\nchange to a longer\nship’s voyage\n• Practice linear\nmeasurements and\nconversion\n• Practice mathematical\ncalculation on\nworkplace situation\n• Simulation/\nrole playing\n• Demonstration\n• Written exam\n• Practical/\nperformance\ntest\n1.5\nhours\n5.3 Analyze\nresults\n• Precision and accuracy\n• Compare the prepared\nbudget against the new\nrequirements and\nidentify gaps\n• Analysis of result\n• Case studies\n• Demonstration\n• Written exam\n• Interviews\n\n1.5\nhours\n6. Use relevant\ntechnologies\n\n6.1 Identify\nappropriate\ntechnology\n• Awareness on technology and\nits function\n• Communication techniques\n• Prepare the ship’s\nvictualling budget using\nthe ship’s software\n• Film Viewing regarding\ntechnology and its\nbenefits\n• Identify different\ntechnology applicable to\nworkplace\n• Direct\nobservation\n• Multimedia\npresentation\n• Written exam\n• Demonstration\n0.5\nhour\n\n--- PDF PAGE 105 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 102\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\n(Required Knowledge)\nPractical Activities\n(Required Skills)\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6.2 Apply relevant\ntechnology\n• Study different relevant\ntechnology in the workplace\n• Relate 5s to technology\n• Conduct risk\nassessment for a\nroutine or non-routine\ntask in the galley using\nthe ship’s established\nsystems\n• Application of relevant\ntechnology to the\nworkplace\n• Direct\nobservation\n• Simulation/\nrole playing\n• Written exam\n• Demonstration\n0.5\nhour\n6.3 Maintain/\nenhance\nrelevant\ntechnology\n• Corrective and preventive\nmaintenance\n• Upgrading of technology\n• Communication Skills\n• Organizational set–up / work\nflow\n• Identify monthly\nmaintenance tasks\nbased on the Planned\nMaintenance System\n• Application of corrective\nand preventive\nmaintenance to\nworkplace\n• Case studies\n• Simulation/\nrole playing\n• Interviews\n• Demonstration\n1 hour\nNote: Basic competencies may be embedded in the core competencies.\n\n--- PDF PAGE 106 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 103\n COMMON COMPETENCIES*\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\n(Required Knowledge)\nPractical Activities\n(Required Skills)\n\nMethodology\n\nAssessment\nMethod\nNominal\nDuration\n1. Survive at sea\nin the event of\nship\nabandonment\n1.1 Respond to\nthe indicated\nemergency\n• Types of emergency situations\nand actions to be taken when:\n- called to survival craft\nstations\n- required to abandon ship\n- in the water\n- aboard a survival craft\n- a person falls overboard\n(man overboard\n• Types, uses and location of life-\nsaving appliances\n• \\Value of training and drills\n• Types and uses of personal\nprotective clothing and\nequipment\n• Donning lifejacket\n• Donning and using an\nimmersion suit\n• Jumping from a height\ninto the water