  "source_text": "COMPETENCY MAP\nFor Maritime Sector\nPrepare\nNutritionally-and\nHealth-Balanced\nCalendar Menu\nPerform mess hall\nservice\n\nDemonstrate\nPractical Cookery\nPerform engine\nroom\nhousekeeping\nPerform\nsupervisory\nfunctions\nAssist in\nperforming deck\nmaintenance\n\nObserve\nWorkplace\nHealth and\nSafety Practices\nPerform\nhousekeeping\nservices\nProvide\nassistance in\nbunkering\noperations\nUse and care for\nhand and power\ntools\nPerform mooring/\nunmooring\noperations\nPerform\nmarlinspike and\ncanvas work\nAssist in\nperforming\nnavigational\nwatchkeeping\nImplement Waste\nManagement and\nDisposal System\nProvide assistance\nin receiving and\nstoring provisions\nAssist in\nperforming\nsimple splicing\nand canvas work\nPerform engine\nwatchkeeping\nduties\nSupervise\npreparation of\nmeals\nMaintain/ clean\nengine room,\nmachinery and\nspaces\nPerform\nvictualing\nservices\nProvide support\nin cargo\noperations\nPerform deck\nmaintenance\nPerform\nnavigational\nwatchkeeping\nduties\nFabricate\nshipboard\ncomponents\nInstall/ reinstall/\nreplace piping\nsystem\nConduct\ninventory of tools,\nequipment and\nfacilities\nAssist engineer\nin the\nmaintenance of\nmain engine\nEstablish and\nmaintain catering\nstandards\n\nShips’ Catering NC III\n(Ships’ Cooks)\n\nPractice Food\nSafety, sanitation\nand Hygiene\nCORE\nCOMPETENCIES\nSupervise/\nAdminister Galley\nArea\nPerform\nhousekeeping\nduties\nBASIC\nCOMPETENCIES\nWork in team\nenvironment\nWork with others\nParticipate in\nworkplace\ncommunication\nLead small teams\nReceive and\nrespond to\nworkplace\ncommunication\nDevelop and\npractice negotiation\nskills\nSolve problems\nrelated to work\nactivities\nLead in workplace\ncommunication\nPractice career\nprofessionalism\nPractice basic\nhousekeeping\nprocedures\nDemonstrate\nwork values\nUse relevant\ntechnologies\nPractice\noccupational\nhealth and safety\nprocedures\nUse mathematical\nconcepts and\ntechniques\nCollect, analyze\nand organize\ninformation\nUtilized\nspecialized\ncommunication\nskills\nDevelop teams\nand individuals\nApply problem\nsolving\ntechniques in the\nworkplace\nPlan and\norganize work\nPromote\nenvironmental\nprotection\nCOMMON\nCOMPETENCIES\nSurvive at sea in the\nevent of ship\nabandonment\nDemonstrate\nsecurity awareness\npractices\nComply with\nemergency\nprocedures\nFight\nand extinguish\n fires\n\nObserve safe\nworking practices\n\nMinimize the risk of fire\nand maintain a state of\nreadiness to respond to\nemergency situations\ninvolving fire\nTake immediate action\nupon encountering an\naccident or other\nmedical emergency\nTake precautions to\nprevent pollution of\nthe marine\nenvironment\n\n--- PDF PAGE 142 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 139",
