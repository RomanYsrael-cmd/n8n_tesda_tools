  "source_text": "SECTION 1 SHIPS’ CATERING (SHIPS’ COOKS) NC III QUALIFICATION\n\nThe SHIPS' CATERING NC III (SHIPS’ COOKS) Qualification consists of\ncompetencies that a person must achieve in managing all galley operations,\nincluding both the procurement of supplies and practical food production in\ncompliance with the national and international requirements for the duration and\nnature of the voyage. It also includes competencies in serving proper quantities of\nquality nutritious food that fulfills cultural, religious and hygiene requirements\nincluding storing and handling food hygienically.\n\nThis Qualification is packaged in compliance with Maritime Labour\nConvention (MLC) 2006 Standard A3.2 and Approved ILO Guidelines on The\nTraining of Ships’ Cooks.\n\nThe Units of Competency comprising this Qualification include the following:\n\n Code No.\nBASIC COMPETENCIES\n500311109\nLead workplace communication\n500311110\nLead small teams\n500311111\nDevelop and practice negotiation skills\n500311112\nSolve problems related to work activities\n500311113\nUse mathematical concepts and techniques\n500311114\nUse relevant technologies\n Code No.\nCOMMON COMPETENCIES\nMTM834208\nSurvive at sea in the event of ship abandonment\nMTM834209\nMinimize the risk of fire and maintain a state of readiness to\nrespond to emergency situations involving fire\nMTM834210\nFight and extinguish fires\nMTM834211\nTake immediate action upon encountering an accident or other\nmedical emergency\nMTM834212\nComply with emergency procedures\nMTM834213\nTake precautions to prevent pollution of the marine environment\nMTM834214\nObserve safe working practices\nMTM834215\nDemonstrate security awareness practices\nCode No.\nCORE COMPETENCIES\nMTM512329\nPrepare Nutritionally - and Health-Balanced Calendar Menu\nMTM512330\nDemonstrate Practical Cookery\nMTM512331\nPractice Food Safety, Sanitation and Hygiene\nMTM512332\nObserve Workplace Health and Safety Practices\nMTM512333\nImplement Waste Management and Disposal System\nMTM512334\nSupervise/Administer Galley Area\n\n--- PDF PAGE 4 ---\nTESDA-SOP-QSO-01-F08\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 2\nA person who has achieved this Qualification is competent to be:\n\nShips’ Cook\n\n--- PDF PAGE 5 ---\nTESDA-SOP-QSO-01-F08\n\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 2"
