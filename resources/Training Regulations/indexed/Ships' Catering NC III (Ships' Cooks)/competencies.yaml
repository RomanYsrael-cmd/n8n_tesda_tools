orkplace, and \nactivities required \nunder OHS \nlegislation, for \nexample: \n Policies \n Procedures \n Plant and \nequipment \nmaintenance \n Hazard \nidentification \n Risk assessment \nand control \n OHS instruction \n Training and \nprovision of OHS \n1.1 Applying OHS in \nthe workplace, \nand activities \nrequired  under \nOHS legislation, \n1.2 Communicating \nskills\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 52 \nELEMENT \n \n \nPERFORMANCE \nCRITERIA\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nItalicized terms are \nelaborated in the Range \nof Variables\nestablished \nshipboard safety \npractices and \nprocedures. \n1.7 Appropriate \nassistance is \nprovided in the event \nof a shipboard \nemergency to secure \nthe vessel and its \nmachinery and \nequipment and to \nmaintain the safety of \nthe vessel and \npersons involved. \n1.8 Established \nemergency and \ncontingency plans \nare followed in the \nevent of a shipboard \nemergency. \ninformation \n1.5 Hazards that exist \nin the workplace \n1.6 The preferred order \nof ways to control \nrisks (known as the \nhierarchy of \ncontrol); \n1.7 Designated \npersonnel \nresponsible for \nOHS onboard a \nvessel \n \n2.\nContribute to \narrangement\ns for the \nmanagement \nof \noccupational \nhealth and \nsafety \n2.1\nOccupational Health \nand Safety issues \nand identified safety \nhazards are raised \nwith designated \npersonnel in \naccordance with \nworkplace \nprocedures and \nrelevant \noccupational health \nand safety \nlegislation. \n2.2 Contributions to \noccupational health \nand safety \nmanagement in the \nworkplace are made \nwithin workplace \nprocedures and \nprovisions of \nrelevant legislation. \nOccupational health \nand safety issues \nare raised with \ndesignated \npersonnel in \naccordance with \nworkplace \nprocedures and \nrelevant \noccupational health \nand safety \nlegislation.\n2.1\nWorkplace OHS \nprocedures \nrelevant to the \nwork being \nundertaken, \nincluding \nprocedures for: \n Recognizing \nand reporting on \nhazards, for \nexample, work \narea inspections \n Work operations \nto control risks, \nfor example, \npermit to work \nsystems and \nisolation \nprocedures \n Responding to \naccidents, fires \nand \nemergencies \n Issues \n Employee \nparticipation in \nOHS \nmanagement, \nfor example, \nconsultative or  \nOHS \ncommittees and \n \n2.1\nApplying order \nof ways to \ncontrol risks \n(known as the \nhierarchy of \ncontrol) \n2.2 Designating \npersonnel \nresponsible for \nOHS onboard a \nvessel\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 53 \nELEMENT \n \n \nPERFORMANCE \nCRITERIA\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nItalicized terms are \nelaborated in the Range \nof Variables\n2.3\nContribute to \nparticipative \narrangements for \noccupational health \nand safety \nmanagement in the \nworkplace within \nvessel’s procedures \nand scope of \nresponsibilities and \ncompetencies.\nJoint employer/ \nemployee \ninspections \n2.2 The meaning of \nOHS symbols \nfound on signs and \nlabels in the \nworkplace \n \n3\nTake \nnecessary \nactions to \ncontrol \nfatigue \n3.1\nFatigue symptoms \nare recognized and \nidentified. \n3.2 Corrective actions \nare taken on \ndiscovery of fatigue \nin accordance with \nestablished \ncompany \nprocedures. \n3.3 Fatigue \nmanagement \npractices are \nobserved at all \ntimes. \n3.4 Reports related to \nincidence of fatigue \nare communicated \nto appropriate \nauthority in \naccordance with \nestablished \ncompany \nprocedures.\n3.1 Effects of sleep, \nschedules, and the \ncircadian rhythm \non fatigue \n3.2 Effects of physical \nstressors on \nseafarers \n3.3 Effects of \nenvironmental \nstressors in and \noutside the ship \nand their impact \n3.4 Effects of schedule \nchanges on \nseafarer fatigue \n \n \n4\nComplete \noccupational \nhealth and \nsafety \nrecords    \n4.1\nOccupational health \nand safety records \nfor self are \ncompleted in \naccordance with \nworkplace \nrequirements. \n4.2 Legal requirements \nfor the maintenance \nof records of \noccupational injury \nand diseases are \nfollowed.\n4.1\nRecords keeping \nand writing \nprocedures \n4.2 \nLegal policy on \nhealth records \n4.1 Communication \nskills \n4.2 Writing health \nreports \n4.3 Maintaining \nlegality of health \nrecords\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 54 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Emergencies  \nMay include: \n1.1 \nLoss of propulsion \n1.2 \nLoss of electrical power \n1.3 \nLoss of steerage \n1.4 \nFlooding of vessel \n1.5 \nFire or explosion \n1.6 \nLoss of refrigeration \n1.7 \nLoss of water making ability \n1.8 \nFuel oil, lubrication oil, steam and gas leaks \n1.9 \nOverheating and over speed of machinery, \ngovernors, emergency trips \n2. Hazards in the workplace May include: \n2.1 \nMoving heavy loads in an unsafe work \nenvironment \n2.2 \nUnsecure machinery, components or repair \nequipment \n2.3 \nSlippery deck \n2.4 \nWelding equipment \n2.5 \nSharp tools and implements \n2.6 \nPower tools \n2.7 \nMoving and rotating machinery \n2.8 \nFlammable liquids, vapors and fuel \n2.9 \nUsing equipment beyond safe working limits \n2.10 Poor housekeeping procedures \n2.11 Electrical wiring and systems \n2.12 Hot pipes and valves (steam, fuel oil, lubricating \noil) \n2.13 Cold pipes and valves (refrigeration and liquefied \ngas cargoes) \n2.14 Working at heights \n2.15 Exposed electrical circuits \n2.16 Toxic gases and substances \n2.17 Chemicals and other harmful substances \n2.18 Damaged cargo and containers \n3. Participative \narrangements  \nMay include: \n3.1 \nFormal and informal meetings which include \noccupational health and safety \n3.2 \nOccupational health and safety committees \n3.3 \nOther committees, for example, consultative, \nplanning and purchasing \n3.4 \nHealth and safety representatives \n3.5 \nSuggestions, requests, reports and concerns put \nforward by vessel’s crew to senior officers\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 55 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency  \nAssessment requires evidences that the candidate: \n1.1 \nIdentified and followed workplace procedures for hazard \nidentification and risk control  \n1.2 \nContributed to arrangements for the management of \nOHS onboard a vessel \n1.3 \nUnderstood and performed necessary actions to control \nfatigue \n1.4 \nCompleted OHS records as required \n1.5 \nCommunicated effectively with others on workplace \nsafety matters \n2. Resource  \nImplications  \nThe following resources should be provided: \n2.1 Simulated workplace environment \n2.2 Workplace standards, procedures, policies, guidelines \n2.3 Tools and equipment relevant to work activities \n3. Methods of \nAssessment     \n \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Oral Questioning \n3.3 Portfolio \n4. Context of \nAssessment \n4.1 Assessment may be conducted in the workplace or in \nsimulated work environment\n",
