        "source_text": "--- PDF PAGE 89 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 86 \n \n UNIT OF COMPETENCY \n: \nIMPLEMENT WASTE MANAGEMENT AND \nDISPOSAL SYSTEM \n \n UNIT CODE  \n: \nMTM512333 \n \n UNIT DESCRIPTOR \n: \nThis unit deals with the knowledge, skills and attitude \nrequired to implement waste management and \ndisposal system. \n \nELEMENT \nPERFORMANCE \nCRITERIA\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nItalicized terms are \nelaborated in the Range \nof Variables\n1. Collect and \nsegregate \nwaste \n1.1 Characteristics of \nthe wastes are \ndetermined prior to \nsegregation  \n1.2 Waste is collected \nusing sanitized bins \nand containers \nbased on relevant \nregulations \n1.3 Waste is \nsegregated and \nplaced in \ndesignated bins \nand containers in \naccordance with \nrelevant MARPOL \nregulations and \nprocedures \n1.4 Task is performed \nusing the approved \nPersonal \nProtective \nEquipment (PPE) \n1.1 Systems of \nwaste collection \n1.2 Types and \ncategories of \ngarbage/wastes \n1.3 Types of labeled \nwaste bins \n1.4 Waste \nmanagement for  \neach type of \nwaste  \n1.5 Relevant \nregulations \n(MARPOL, etc…)\n1.6 Waste \nsegregation \nprocedures \n1.7 Personal \nprotective \nequipment (PPE) \n \n1.1 Handling waste \n1.2 Sorting waste \n1.3 Sanitizing \ncontainers and \nbins \n1.4 Using \nappropriate \nsystems of \nwaste \ncollection \n1.5 Applying \nappropriate \nwaste \nmanagement \nfor each type of \nwaste \n \n2. Store waste \n2.1 Waste minimization \nand \npollution/spread of \nfood-borne disease \npreventions are \nconsidered \n2.2 Waste is sealed \nand packaged in \naccordance with \nMARPOL Annex V \n2.3 Waste is labeled \nand placed in a \nlocation designated \nfor the purpose \n2.1 Different waste  \ncharacteristics \n2.2 Relevant \nregulations \n(MARPOL, etc.) \n3.7 Personal \nprotective \nequipment (PPE) \n3.8 Ways of \nminimizing food \nwastage using \nleftovers \n \n2.1 Determining \nwaste \ncharacteristics \n2.2 Applying  waste \nminimization \nand pollution/ \nspread of food-\nborne disease \nprevention \nstrategies\n\n--- PDF PAGE 90 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 87 \nELEMENT \nPERFORMANCE \nCRITERIA\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nItalicized terms are \nelaborated in the Range \nof Variables\n2.4 Sorted waste is \nstored in \ndesignated \nbins/containers in \naccordance with \nMARPOL \nRegulations and \nprocedures  \n3. Dispose of \nwaste \n3.1 Waste is disposed \nof in accordance \nwith MARPOL \nRegulations and \nprocedures. \n3.2 Where necessary, \nwaste is ground or \ncompacted in \naccordance with the \nestablished \nprocedures \n3.3 Task is performed \nusing the approved \nPersonal protective \nequipment (PPE). \n3.4 Waste recording \nand documentation \nrequirements are \ncomplied with \n3.1 Garbage \nManagement \nPlans \n3.2 Garbage Record \nBooks \n3.3 Types and \ncategories of \ngarbage \n3.4 Types of labeled \nwaste bins \n3.5 Waste \nManagement \nProgram for \nDisposal of all \ntypes of waste  \n3.6 Relevant \nregulations \n(MARPOL, etc…) \n3.7 Personal \nprotective \nequipment (PPE) \n3.1 Handling and \ndisposing of \nwastes  \n3.2 Recording and \ndocumenting \nskills\n\n--- PDF PAGE 91 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 88 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Waste \nMay include: \n1.1. Biodegradable waste \n1.2. Non-biodegradable waste and  \n1.3. Hazardous waste \n2. Characteristics of the \nwastes \nMay include: \n2.1 Hazardous  \n2.1.1 Hazardous Radioactive Waste \n2.1.2 Hazardous Biological Waste \n2.1.3 Hazardous Chemical Waste \n2.2 Non-hazardous (e.g. regular solid waste, paper, \nsoda cans) \n3. Personal protective \nequipment (PPE) \nMay include: \n3.1 Non-skid safety shoes \n3.2 Face mask \n3.3 Disposable gloves \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency  \nAssessment requires evidence that the candidate : \n1.1  Performed waste collection and segregation procedures \n1.2  Minimized food wastage \n1.3 Stored and disposed of wastes  \n1.4 Complied with relevant regulations \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Ventilated and illuminated work place with facilities appropriate \nto the activity. \n2.2 Tools and equipment appropriate to waste management. \n2.3 Material relevant to the proposed activity and tasks \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through : \n3.1 Written Examination \n3.2 Oral Questioning \n3.3 Portfolio \n4. Context of \nAssessment \n4.1 Competency may be assessed in workplace or in a simulated  \nworkplace setting \n4.2 Assessment shall be observed while task are being undertaken \nwhether individually or in-group\n",
