        "source_text": "--- PDF PAGE 69 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 66 \nUNIT OF COMPETENCY :       DEMONSTRATE PRACTICAL COOKERY \n \nUNIT CODE  \n: \nMTM512330 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in \ndemonstrating practical cookery.  \n \nELEMENT \nPERFORMANCE \nCRITERIA\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nItalicized terms are \nelaborated in the Range \nof Variables \n1. Prepare \nstocks, \nsoups, \nsauces, dips \nand dressings \n \n1.1 Ingredients and \nflavoring agents \nare used according \nto standard recipes\n1.2 Clarifying agents , \nthickening \nagents, \nconvenience \nproducts and \nmethods are used \naccording to \nprocedures  \n1.3 Various stocks, \nsoups, sauces, \ndips and dressings \nare used according \nto calendar menu  \n1.4 Variety of stocks, \nsoups , sauces, \ndips and \ndressings, are \nproduced \naccording to \nstandard recipe \n1.5 Stocks, soups, \nsauces, dips and \ndressing are \nstored in \naccordance with \nstandard operating \nprocedures  \n \n1.1 Procedures  on \nstocks, soups , \nsauces, dips \nand dressings \npreparation   \n1.2 Use of various \nstocks and \nbases for a \nvariety of soups \nand sauces \n1.3 Use of various \nIngredients and \nflavoring agents \nfor a variety of \ndips and \ndressings \n1.4 Logical and time   \nefficient work \nflow \n1.5 Rapid cooling \n1.6 Temperature \n1.7 Standard of \nshelf life of \nfoods  \n1.8 HACCP (Hazard \nAnalysis Critical \nControl Point) / \nFood Safety \nManagement \nSystem \n \n1.1 Applying \ntechniques of \nproducing stocks \nsoups , sauces, \ndips and \ndressings \n1.2 Observing  work \nsafety practices \n1.3 Demonstrating \nwaste \nminimization \ntechniques and \nenvironment-\nfriendly practices \non handling, \npreparation and \ndisposal of \nstocks soups , \nsauces, dips and \ndressings \n1.4 Applying rapid \ncooling \n1.5 Record keeping \nof time and \ntemperature \n1.6 Observing \nHACCP (Hazard \nAnalysis Critical \nControl Point) / \nFood Safety \nManagement \nSystem \nprocedures\n2. Prepare and \npresent  \nmeals and \nside dishes \n(Hot or Cold) \n \n2.1 Tools and \nequipment are \nidentified, checked \nfor defects, \ndamages and \nconditions in \naccordance with \nmanufacturer’s \n2.1 Operational \nprocedures  on \ntools and \nequipment \n2.2 Various \nIngredients and \nflavoring agents \naccording to \n2.1 Using of various \ntools and \nequipment (e.g. \nUsing knives) \n2.2 Following/ \ninterpreting  \nRecipes\n\n--- PDF PAGE 70 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 67 \nELEMENT \nPERFORMANCE \nCRITERIA\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nItalicized terms are \nelaborated in the Range \nof Variables\nmanual based on \nthe required tasks \n2.2 Ingredients and \nflavoring agents are \nused according to \nstandard recipes of \nmeals and side \ndishes (Hot or \nCold)  \n2.3 Hot meals and side \ndishes are prepared \nfollowing approved \ncooking methods \n2.4 Frozen ingredients \nare thawed \naccording to \napproved thawing \nstandards \n2.5 Preparation \ntechniques, cutting \nand portioning are \napplied based on \nstandard recipes \n2.6 Temperature, \nquality and  texture \nof cooked meals \nare checked \naccording to \nstandard recipes \n2.7 Meals are kept in \ntheir respective \nholding equipments \nprior to serving \n2.8 Meals  are \npresented using \nsauces, garnishes \nand side dishes \naccording to \nstandard recipes \n2.9 Religious and \ncultural beliefs,  \nfood allergens and \nintolerances are \nconsidered in the \npreparation of \nmeals in \naccordance with \ndeclaration reports\nstandard recipes \nof meals and \nside dishes(Hot \nor Cold) \n2.3 Various types of \nmenus and their \ndifferences  \n2.4 Variety of \ninternational \ncuisine  \n2.5 Various \