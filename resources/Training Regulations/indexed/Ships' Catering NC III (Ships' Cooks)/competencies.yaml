        "source_text": "--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 47 \nUNIT OF COMPETENCY \n: \nTAKE PRECAUTIONS TO PREVENT POLLUTION \nOF THE MARINE ENVIRONMENT \n \nUNIT CODE  \n: \nMTM834213  \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in \ntaking precautions towards protection of the marine \nenvironment. \n \nELEMENT \n \nPERFORMANCE \nCRITERIA \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nItalicized terms are \nelaborated in the Range \nof Variables \n1. Practice \ncompliance \nwith \nlegislative \nrequirements \nfor protection \nof the marine \nenvironment  \n1.1. Relevant regulations \nand procedures for \nthe protection of \nthe marine \nenvironment are \nidentified.  \n1.2. Appropriate action is \ntaken in day-to-day \nwork to ensure \ncompliance with \nrelevant regulations \nand procedures for \nthe protection of the \nmarine environment \nas required.  \n1.3. Appropriate action is \ntaken where \nincidences of non-\ncompliance or \npotential non-\ncompliance are \nidentified in \naccordance with \nregulations and \nprocedures.  \n1.4. Any breach of \nregulations and \nprocedures \nconcerning \nprotection of the \nmarine environment \nis rectified and/or \nreported as required \nwithin the limits of \nthe crew’s/ officer’s \nresponsibility.  \n \n1.1 Relevant \nlegislation, \ncodes of \npractice, \npolicies and \nprocedures to \nprotect the \nmarine \nenvironment  \n1.2 Impact of \nshipping on the \nmarine \nenvironment and \nthe effects of \noperational or \naccidental \npollution on it  \n1.3 Basic \nenvironmental \nprotection \nprocedures \n \n1.1 Completing \nactivities aimed \nat compliance \nwith relevant \nregulatory \nrequirements for \nprotection of the \nmarine \nenvironment  \n1.2 Identifying and \nevaluating  \nproblems related \nto compliance \nwith relevant \nregulations for \nenvironmental \nprotection and \ndetermining an \nappropriate \ncourses of action\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 48 \nELEMENT \n \nPERFORMANCE \nCRITERIA\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nItalicized terms are \nelaborated in the Range \nof Variables\n2 Practice anti-\npollution \nprocedures \n \n2.1. Anti-pollution \nprocedures \napplicable to vessel \noperations are \nfollowed in the \ncourse of day-to-day \nwork.  \n2.2. Appropriate \npreventive \nmeasures are \nundertaken to \nprevent pollution of \nthe marine \nenvironment in \naccordance with \nregulations and \nprocedures. \n2.3. Inputs are provided \nin the preparation of \nreports and other \ndocumentation \nrelated to the \nprotection of marine \nenvironment in \naccordance with \nregulations and \nprocedures. \n2.1 Pollution control \nproblems and \nrelated \nmeasures to \nprotect the \nmarine \nenvironment   \n2.2 Complexity and \ndiversity of the \nmarine \nenvironment \n2.3 Requirements \nunder local \nand/or \ninternational \nlegislation and \nconventions for \nreporting \nincidents \nrelated to \nbreaches of the \nstatutory codes \nand measures \nfor the \nprotection of the \nmarine \nenvironment \n2.1 Following anti-\npollution \nprocedures\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 49 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Protection of the \nmarine environment \nProtection of the marine environment may be observed:   \n1.1. By day or night in both normal and emergency situations \n1.2. Under any possible conditions of sea and weather   \n1.3. While underway  \n1.4. During berthing and unberthing operations  \n1.5. While anchoring or mooring  \n1.6. While moored or at anchor  \n1.7. During loading and unloading operations  \n1.8. During maintenance operations \n2. Anti-pollution \nprocedures \nAnti-pollution procedures include checking of items and \nequipment such as:  \n2.1. Pumps  \n2.2. Valves  \n2.3. Emission control equipment  \n2.4. Water management equipment including: cooling water, \nballast water and bilge systems  \n2.5. Waste storage and recycling equipment  \n2.6. Ballast management equipment \n3. Preventive measures \nPreventative measures to protect the marine environment \nmay include: \n3.1. Prevention of spillages of cargo  \n3.2. Prevention of spillages of fuel and oil  \n3.3. Control of polluting emissions of gas and smoke  \n3.4. Effective management of waste, pollution and recycling \nprocesses  \n3.5. Effective management of ballast operations  \n3.6. Shipboard housekeeping  \n3.7. Pollution control instructions \n4. Regulations \nApplicable regulations includes: \n4.1. MARPOL Convention \n4.2. IMO STCW Code and Convention related to the \nprotection of marine environment \n4.3. Relevant international and/or local legislation related to \nthe protection of the marine environment\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 50 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1. Practiced compliance with legislative requirements for \nprotection of the marine environment   \n1.2. Practiced preventative and remedial anti-pollution \nprocedures as per relevant regulations and procedures  \n1.3. Identified typical pollution control problems and take \nappropriate action  \n1.4. Communicated effectively with others concerning \nmeasures to protect the marine environment \n2. Resource Implications \nThe following resources should be provided: \n2.1 Work place with recommended facilities \n2.2 Tools and equipment appropriate to the activity \n2.3 Materials relevant to the proposed activity and tasks \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Oral Questioning \n3.3 Portfolio \n4. Context of Assessment 4.1 Competency may be assessed in workplace or in a \nsimulated workplace setting\n",
