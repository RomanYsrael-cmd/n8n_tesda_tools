QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 6 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nand according to \ncompany policy \n2.2 Duties are \nallocated having \nregard to \nindividual \npreference, \ndomestic and \npersonal \nconsiderations, \nwhenever possible\n2.5 Duties and \nresponsibilities \nof each team \nmember \n2.6 Knowledge in \nidentifying each \nteam member \nduties and \nresponsibilities  \n2.3 Identifying each \nteam member \nduties and \nresponsibilities \n3. Set \nperformance \nexpectations \nfor team \nmembers \n3.1 Performance \nexpectations are \nestablished based \non client needs \nand according to \nassignment \nrequirements \n3.2 Performance \nexpectations are \nbased on \nindividual team \nmembers duties \nand area of \nresponsibility \n3.3 Performance \nexpectations are \ndiscussed and \ndisseminated to \nindividual team \nmembers\n3.1 \nDefinition of \nperformance \nindicators/ \ncriteria \n3.2 \nDefinition of \nteam goals and \nexpectations \n3.3 \nMethods of \nmonitoring \nperformance \n3.4 \nClient \nexpectations \n3.5 \nTeam members \nduties and \nresponsibilities \n3.6 \nDefining \nperformance \nexpectations \ncriteria \n3.1 Identifying \nperformance \nindicators \n3.2 Evaluating \nperformance \n3.3 Setting individual \nperformance \ntarget/ expectation \nindicators \n4. Supervise \nteam \nperformance \n4.1 Monitoring of \nperformance \ntakes place \nagainst defined \nperformance \ncriteria and/or \nassignment \ninstructions and \ncorrective action \ntaken if required \n4.2 Team members \nare provided with \nfeedback, positive \nsupport and \nadvice on \nstrategies to \novercome any \n4.1 \nUnderstanding  \nMonitoring of \nwork \n4.2 \nHow to \nundertake \ncorrective \naction \n4.3 \nUnderstanding \nfeedback  and \nprocedure \n4.4 \nFeedback \nreporting \nprocedure \n4.5 \nMethods of \nmonitoring \nperformance \n4.1 Monitoring skills  \n4.2 Setting priorities \n4.3 Evaluating \nperformance \n4.4 Informal/ formal \ncounseling skill\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 7 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \ndeficiencies \n4.3 Performance \nissues which \ncannot be rectified \nor addressed \nwithin the team \nare referenced to \nappropriate \npersonnel \naccording to \nemployer policy \n4.4 Team members \nare kept informed \nof any changes in \nthe priority \nallocated to \nassignments or \ntasks which might \nimpact on \nclient/customer \nneeds and \nsatisfaction \n4.5 Team operations \nare monitored to \nensure that \nemployer/client \nneeds and \nrequirements are \nmet \n4.6 Follow-up \ncommunication is \nprovided on all \nissues affecting \nthe team \n4.7 All relevant \ndocumentation is \ncompleted in \naccordance with \ncompany \nprocedures\n4.6 \nTeam member’s \nduties and \nresponsibilities \n4.7 \nMonitoring team \noperation to \nensure client \nneeds and \nsatisfaction\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 8 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Work requirements \n1.1. Client Profile \n1.2. Assignment instructions \n2. Team member’s concerns \n2.1. Roster/shift details \n3. Monitor performance \n3.1. Formal process \n3.2. Informal process \n4. Feedback \n4.1. Formal process \n4.2. Informal process \n5. Performance issues \n5.1. Work output \n5.2. Work quality \n5.3. Team participation \n5.4. Compliance with workplace protocols \n5.5. Safety \n5.6. Customer service \n \nEVIDENCE GUIDE \n1. Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1. Maintained or improved individuals and/or team \nperformance given a variety of possible scenario \n1.2. Assessed and monitored team and individual \nperformance against set criteria \n1.3. Represented concerns of a team and individual to next \nlevel of management or appropriate specialist and to \nnegotiate on their behalf \n1.4. Allocated duties and responsibilities, having regard to   \nindividual’s knowledge, skills and aptitude and the \nneeds of the tasks to be performed \n1.5. Set and communicated performance expectations for a \nrange of tasks and duties within the team and provided \nfeedback to team members\n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Access to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n2.2.\nMaterials relevant to the proposed activity or task\n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Written Examination \n3.2. Oral Questioning  \n3.3.\nPortfolio\n4. Context for \nAssessment \n4.1. Competency assessment may occur in workplace or \nany appropriately simulated environment \n4.2. Assessment shall be observed while task are being \nundertaken whether individually or in-group\n",
