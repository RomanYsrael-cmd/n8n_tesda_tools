struction. \n2.1 Survival craft \nequipment and \nhow to operate \nthem \n \n2.1 Taking initial \naction on \nboarding survival \ncraft \n2.2 Streaming a \ndrogue or sea-\nanchor \n2.3 Operating survival \ncraft equipment \n2.4 Operating location \ndevices including \nradio equipment\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 27 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Identified emergency \nMay include: \n1.1 \nCollision \n1.2 \nFire \n1.3 \nFoundering  \n1.4 \nPerson falling overboard (man overboard) \n2. Dangers and threats to \nsurvival  \nMay include: \n2.1 \nCold water shock    \n2.2 \nHypothermia    \n2.3 \nPsychological response to disaster  \n2.4 \nLoss of will to live   \n2.5 \nSea sickness     \n2.6 \nDehydration   \n2.7 \nInjuries   \n2.8 \nStarvation \n3. Life-saving appliances \nMay include: \n3.1 \nLife jackets \n3.2 \nLife buoys \n3.3 \nHard hats \n3.4 \nImmersion suits and other thermal protective \naid \n3.5 \nRocket line throwing appliances \n3.6 \nPyrotechnic distress signals \n3.7 \nGMDSS survival craft VHF radios \n3.8 \nSatellite emergency position indicating radio \nbeacons EPIRBs \n3.9 \nSARTs \n3.10 Whistles \n4. Survival Craft \nMay include: \n4.1 \nFree fall life boats \n4.2 \nDavit launched life boats \n4.3 \nLife rafts\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08 \nTR - Ships’ Cooks NC III                                                           Promulgated October 2014 \nPage 28"
