  "source_text": "SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to an employable\nunit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has\ndemonstrated competence in all the units of competency that comprise\nthe Training Regulations for Ships’ Catering NC III (Ships’ Cooks) as\nfollows:\n\nBASIC COMPETENCIES\nLead workplace communication\nLead small teams\nDevelop and practice negotiation skills\nSolve problems related to work activities\nUse mathematical concepts and techniques\nUse relevant technologies\nCOMMON COMPETENCIES\nSurvive at sea in the event of ship abandonment\nMinimize the risk of fire and maintain a state of\nreadiness to respond to emergency situations\ninvolving fire\nFight and extinguish fires\nTake immediate action upon encountering an\naccident or other medical emergency\nComply with emergency procedures\nTake precautions to prevent pollution of the marine\nenvironment\nObserve safe working practices\nDemonstrate security awareness practices\nCORE COMPETENCIES\nPrepare Nutritionally - and Health-Balanced Calendar\nMenu\nDemonstrate Practical Cookery\nPractice Food Safety, Sanitation and Hygiene\nObserve Workplace Health and Safety Practices\nImplement Waste Management and Disposal System\nSupervise/Administer Galley Area\n\n--- PDF PAGE 139 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 136\n\n4.1.2 Candidates wanting to be certified will have to be assessed in\naccordance with the requirements of MLC 2006 Paragraphs 3 and 4 of\nStandard A.3.2.\n4.1.3 Candidates applying for competency assessment and certification for\nShips’ Catering NC III (Ships’ Cooks) must undergo either 1) Written\nExamination or 2) Written Examination plus Demonstration of\nPractical Cookery skills or 3) Portfolio Assessment, as follows:\n4.1.3.1 For Written Examination only, are:\n4.1.3.1.1 Those who have completed the promulgated SHIPS’\nCATERING NC III (SHIPS’ COOKS) training program\nas aligned to MLC 2006 Paragraphs 3 and 4 of\nStandard A.3.2. Or\n4.1.3.1.2 Those who have trained and been certified under\nShip’s Catering Services NC II or Commercial\nCooking NC II or Cookery NC II or Commercial\nCooking NC III with valid National Certificate (NC).\n4.1.3.2 For Written Examination plus Demonstration of Practical\nCookery skills are:\n\n4.1.3.2.1 Those who have completed the training programs on\nShip’s Catering Services NC II or Commercial\nCooking NC II or Cookery NC II or Commercial\nCooking NC III but are not National Certificate\nholders of the said qualifications.\n4.1.3.3 For Portfolio Assessment are:\n 4.1.3.3.1 Those who have at least three (3) months relevant\nshipboard experience as Cook or Assistant Cook or\nCatering Personnel. However, must show sufficient\nevidences\nin\ntheir\nportfolio\non\nthe\nfollowing\ndocuments: Seaman’s Book, Passport, Attestation\nLetter (Optional)/Certificate of Employment, Sea\nService Certification, Certificates of Trainings, valid\nNational Certificate on Ship’s Catering Services NC II\nor Commercial Cooking NC II or Cookery NC II or\nCommercial Cooking NC III.\n4.1.4 Conduct of assessment and issuance of certificates shall follow the\nprocedures manual and implementing guidelines developed for the\npurpose.\n\n--- PDF PAGE 140 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 137\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before\nthey are authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited\nCompetency\nAssessor.\nOnly\naccredited\ncompetency\nassessor is authorized to conduct assessment of competence.\nCompetency\nassessors undergo\na quality assured system of\naccreditation procedure before they are authorized by TESDA to assess\nthe competencies of candidates for National Certification.\n\n--- PDF PAGE 141 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 138\n\n"
