      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence in all the units of competency that comprise the Training Regulations for Ships’ Catering NC III (Ships’ Cooks) as follows: BASIC COMPETENCIES Lead workplace communication Lead small teams Develop and practice negotiation skills Solve problems related to work activities Use mathematical concepts and techniques Use relevant technologies COMMON COMPETENCIES Survive at sea in the event of ship abandonment Minimize the risk of fire and maintain a state of readiness to respond to emergency situations involving fire Fight and extinguish fires Take immediate action upon encountering an accident or other medical emergency Comply with emergency procedures Take precautions to prevent pollution of the marine environment Observe safe working practices Demonstrate security awareness practices CORE COMPETENCIES Prepare Nutritionally - and Health-Balanced Calendar Menu Demonstrate Practical Cookery Practice Food Safety, Sanitation and Hygiene Observe Workplace Health and Safety Practices Implement Waste Management and Disposal System Supervise/Administer Galley Area Page 136 4.1.2 Candidates wanting to be certified will have to be assessed in accordance with the requirements of MLC 2006 Paragraphs 3 and 4 of Standard A.3.2. 4.1.3 Candidates applying for competency assessment and certification for Ships’ Catering NC III (Ships’ Cooks) must undergo either 1) Written Examination or 2) Written Examination plus Demonstration of Practical Cookery skills or 3) Portfolio Assessment, as follows: 4.1.3.1 For Written Examination only, are: 4.1.3.1.1 Those who have completed the promulgated SHIPS’ CATERING NC III (SHIPS’ COOKS) training program as aligned to MLC 2006 Paragraphs 3 and 4 of Standard A.3.2. Or 4.1.3.1.2 Those who have trained and been certified under Ship’s Catering Services NC II or Commercial Cooking NC II or Cookery NC II or Commercial Cooking NC III with valid National Certificate (NC). 4.1.3.2 For Written Examination plus Demonstration of Practical Cookery skills are: 4.1.3.2.1 Those who have completed the training programs on Ship’s Catering Services NC II or Commercial Cooking NC II or Cookery NC II or Commercial Cooking NC III but are not National Certificate holders of the said qualifications. 4.1.3.3 For Portfolio Assessment are: 4.1.3.3.1 Those who have at least three (3) months relevant shipboard experience as Cook or Assistant Cook or Catering Personnel. However, must show sufficient evidences in their portfolio on the following documents: Seaman’s Book, Passport, Attestation Letter (Optional)/Certificate of Employment, Sea Service Certification, Certificates of Trainings, valid National Certificate on Ship’s Catering Services NC II or Commercial Cooking NC II or Cookery NC II or Commercial Cooking NC III. 4.1.4 Conduct of assessment and issuance of certificates shall follow the procedures manual and implementing guidelines developed for the purpose. Page 137"
