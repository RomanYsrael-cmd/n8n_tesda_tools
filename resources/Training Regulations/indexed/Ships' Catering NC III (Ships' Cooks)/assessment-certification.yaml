  "source_text": "SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to an employable\nunit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has\ndemonstrated competence in all the units of competency that comprise\nthe Training Regulations for Ships’ Catering NC III (Ships’ Cooks) as\nfollows:\n\nBASIC COMPETENCIES\nLead workplace communication\nLead small teams\nDevelop and practice negotiation skills\nSolve problems related to work activities\nUse mathematical concepts and techniques\nUse relevant technologies\nCOMMON COMPETENCIES\nSurvive at sea in the event of ship abandonment\nMinimize the risk of fire and maintain a state of\nreadiness to respond to emergency situations\ninvolving fire\nFight and extinguish fires\nTake immediate action upon encountering an\naccident or other medical emergency\nComply with emergency procedures\nTake precautions to prevent pollution of the marine\nenvironment\nObserve safe working practices\nDemonstrate security awareness practices\nCORE COMPETENCIES\nPrepare Nutritionally - and Health-Balanced Calendar\nMenu\nDemonstrate Practical Cookery\nPractice Food Safety, Sanitation and Hygiene\nObserve Workplace Health and Safety Practices\nImplement Waste Management and Disposal System\nSupervise/Administer Galley Area\n\n--- PDF PAGE 139 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 136\n\n4.1.2 Candidates wanting to be certified will have to be assessed in\naccordance with the requirements of MLC 2006 Paragraphs 3 and 4 of\nStandard A.3.2.\n4.1.3 Candidates applying for competency assessment and certification for\nShips’ Catering NC III (Ships’ Cooks) must undergo either 1) Written\nExamination or 2) Written Examination plus Demonstration of\nPractical Cookery skills or 3) Portfolio Assessment, as follows:\n4.1.3.1 For Written Examination only, are:\n4.1.3.1.1 Those who have completed the promulgated SHIPS’\nCATERING NC III (SHIPS’ COOKS) training program\nas aligned to MLC 2006 Paragraphs 3 and 4 of\nStandard A.3.2. Or\n4.1.3.1.2 Those who have trained and been certified under\nShip’s Catering Services NC II or Commercial\nCooking NC II or Cookery NC II or Commercial\nCooking NC III with valid National Certificate (NC).\n4.1.3.2 For Written Examination plus Demonstration of Practical\nCookery skills are:\n\n4.1.3.2.1 Those who have completed the training programs on\nShip’s Catering Services NC II or Commercial\nCooking NC II or Cookery NC II or Commercial\nCooking NC III but are not National Certificate\nholders of the said qualifications.\n4.1.3.3 For Portfolio Assessment are:\n 4.1.3.3.1 Those who have at least three (3) months relevant\nshipboard experience as Cook or Assistant Cook or\nCatering Personnel. However, must show sufficient\nevidences\nin\ntheir\nportfolio\non\nthe\nfollowing\ndocuments: Seaman’s Book, Passport, Attestation\nLetter (Optional)/Certificate of Employment, Sea\nService Certification, Certificates of Trainings, valid\nNational Certificate on Ship’s Catering Services NC II\nor Commercial Cooking NC II or Cookery NC II or\nCommercial Cooking NC III.\n4.1.4 Conduct of assessment and issuance of certificates shall follow the\nprocedures manual and implementing guidelines developed for the\npurpose.\n\n--- PDF PAGE 140 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 137\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before\nthey are authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited\nCompetency\nAssessor.\nOnly\naccredited\ncompetency\nassessor is authorized to conduct assessment of competence.\nCompetency\nassessors undergo\na quality assured system of\naccreditation procedure before they are authorized by TESDA to assess\nthe competencies of candidates for National Certification.\n\n--- PDF PAGE 141 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 138\n\nCOMPETENCY MAP\nFor Maritime Sector\nPrepare\nNutritionally-and\nHealth-Balanced\nCalendar Menu\nPerform mess hall\nservice\n\nDemonstrate\nPractical Cookery\nPerform engine\nroom\nhousekeeping\nPerform\nsupervisory\nfunctions\nAssist in\nperforming deck\nmaintenance\n\nObserve\nWorkplace\nHealth and\nSafety Practices\nPerform\nhousekeeping\nservices\nProvide\nassistance in\nbunkering\noperations\nUse and care for\nhand and power\ntools\nPerform mooring/\nunmooring\noperations\nPerform\nmarlinspike and\ncanvas work\nAssist in\nperforming\nnavigational\nwatchkeeping\nImplement Waste\nManagement and\nDisposal System\nProvide assistance\nin receiving and\nstoring provisions\nAssist in\nperforming\nsimple splicing\nand canvas work\nPerform engine\nwatchkeeping\nduties\nSupervise\npreparation of\nmeals\nMaintain/ clean\nengine room,\nmachinery and\nspaces\nPerform\nvictualing\nservices\nProvide support\nin cargo\noperations\nPerform deck\nmaintenance\nPerform\nnavigational\nwatchkeeping\nduties\nFabricate\nshipboard\ncomponents\nInstall/ reinstall/\nreplace piping\nsystem\nConduct\ninventory of tools,\nequipment and\nfacilities\nAssist engineer\nin the\nmaintenance of\nmain engine\nEstablish and\nmaintain catering\nstandards\n\nShips’ Catering NC III\n(Ships’ Cooks)\n\nPractice Food\nSafety, sanitation\nand Hygiene\nCORE\nCOMPETENCIES\nSupervise/\nAdminister Galley\nArea\nPerform\nhousekeeping\nduties\nBASIC\nCOMPETENCIES\nWork in team\nenvironment\nWork with others\nParticipate in\nworkplace\ncommunication\nLead small teams\nReceive and\nrespond to\nworkplace\ncommunication\nDevelop and\npractice negotiation\nskills\nSolve problems\nrelated to work\nactivities\nLead in workplace\ncommunication\nPractice career\nprofessionalism\nPractice basic\nhousekeeping\nprocedures\nDemonstrate\nwork values\nUse relevant\ntechnologies\nPractice\noccupational\nhealth and safety\nprocedures\nUse mathematical\nconcepts and\ntechniques\nCollect, analyze\nand organize\ninformation\nUtilized\nspecialized\ncommunication\nskills\nDevelop teams\nand individuals\nApply problem\nsolving\ntechniques in the\nworkplace\nPlan and\norganize work\nPromote\nenvironmental\nprotection\nCOMMON\nCOMPETENCIES\nSurvive at sea in the\nevent of ship\nabandonment\nDemonstrate\nsecurity awareness\npractices\nComply with\nemergency\nprocedures\nFight\nand extinguish\n fires\n\nObserve safe\nworking practices\n\nMinimize the risk of fire\nand maintain a state of\nreadiness to respond to\nemergency situations\ninvolving fire\nTake immediate action\nupon encountering an\naccident or other\nmedical emergency\nTake precautions to\nprevent pollution of\nthe marine\nenvironment\n\n--- PDF PAGE 142 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 139\n DEFINITION OF TERMS\n\n1. Beverage\nany liquid for drinking.\n2. Braised\nto cook (meat and vegetables) by browning in fat, then\nsimmering in a small quantity of liquid in a covered\ncontainer.\n3. Cabin\n\n 4. Calendar Menu\na room on board a ship for use of one or more officers or\npassengers; a space in which the accommodation for\nofficers and / or passengers is located.\nis a series of menus planned in advance for particular\nperiod of time that varies for each day of the cycle that\nought to consider the number of people their likes and\ndislikes.\n 5. Cold cuts\nvariety of sliced cold meats and cheeses.\n 6. Cross-\n contamination\nthe transfer of harmful micro-organism from one item of\nfood to another.\n 7. Environmental\n hazard\nworking conditions unsafe to crew.\n\n 8. Galley\na cook’s room, kitchen or deckhouse used for cooking\ndrippings.\n 9. Griddle\na flat metal surface used for cooking by dry heat.\n10. Hollandaise\na permanent emulsion sauce, used for steaks, vegetables\nand fish.\n11. MARPOL\nabbreviation, for Marine Pollution.\n12. Meal Service\nserving food or beverages.\n13. Menu\na list of food available or choices given to guest before the\nstart of a meal.\n14. Mess hall\na dining room or space on board in which all or part of\nship’s crew eat their meals.\n15. Mirepoix\na mixture of vegetables and herbs to enhance the flavor of\nstock, sauces and soups.\n16. Mise-en-place\nis the prepared raw materials, utensils , ingredients\nneeded for cooking.\n17. Mixer\na machine / equipment for mixing or beating foods.\n18. Oven\nan enclosed chamber for heating, roasting / baking.\n19. Pantry\na small room or closet, usually of a kitchen where food,\nchine silver linens and similar items are stored.\n20. Personal\nHygiene\nconditions and practices that serve to promote or preserve\none’s health.\n21. Provisions\na store of needed materials for a voyage; especially a\nstock of food for use of crew and passengers (usually 3\nmonths provision / 200 % allowance.\n22. Recipe\nprocedure and directions in preparing dish or drink.\n23. Sanitation\nformulation and application of measures designed to\nprotect public health.\n24. Stock\nbroth in which meat, fish or poultry bones are simmered\nfor a period of time.\n25. Store\nto fill or furnish with supply.\n26. Thaw\nto change from a frozen solid to a liquid by gradual\nwarming.\n\n--- PDF PAGE 143 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 140\n27. Victualing /\n Victual\nfood fit for consumption; laying in food supplies or\nprovisions; providing, storing or supplying provisions.\n28. Waste\n is a food material that is discarded or unable to be used\n\n--- PDF PAGE 144 ---\nTR - Ships’ Cooks NC III Promulgated October 2014\nPage 141\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nTHE TECHNICAL AND INDUSTRY EXPERT AND REVIEW PANEL\n\nDONALD B. BAUTISTA\nMarlow Navigation Training Center\nMNTC Building, #1220 Leon Guinto St.\nMalate, Manila\nDINDO R. CONSULTA\nNorlen Crew Management Inc.\nRoom 108 Ground Floor, Corporate Plaza Bldg.\nRecoletos cor. Magallanes Sts., Intramuros, Manila\nPAOLO SANTINO A. GUEVARA\nMagsaysay Center for Hospitality and\nCulinary Arts (MCHCA)\n3rd Floor Times Plaza Bldg., UN Ave.\ncor. Taft Ave. Manila\nALFREDO G. HABOC\nPhilippine Association of Maritime\nTraining Centers, Inc (PAMTCI)\nUnit 205, 2nd Floor, Nicfur Bldg., Quirino Ave.\ncor. Taft Ave., Malate, Manila\n\nJOSE ALBAR G. KATO\nJoint Manning Group (JMG) /Filipino\nAssociation for Mariners’\nEmployment, Inc. (FAME)\nJ. Palma Professionals Institute, Inc.\n2/F JNCV Bldg., Rosemarie Lane cor.\nPasig Blvd., Pasig City\nJONAT