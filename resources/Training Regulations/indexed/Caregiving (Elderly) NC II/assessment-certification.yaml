ain entrepreneurial skills Manage and sustain effective communication strategies Manage and sustain high performing teams Evaluate higher order thinking skills and adjust problem solving techniques Advocate strategic thinking for global citizenship Incorporate innovation into work procedures Develop systems in managing and maintaining information Manage implementation of occupational safety and health programs in the workplace Manage implementation of environmental programs in the workplace Develop and sustain a high- performing enterprise COMPETENCY MAP – HUMAN HEALTH/HEALTH CARE SECTOR CAREGIVING (ELDERLY) NC II --- PDF PAGE 162 --- TR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 158 Maintain instruments and equipment in work area Assist in dental laboratory procedures Assist with administration in dental laboratory practice Implement and monitor infection control policies and procedures Respond effectively to difficult/ challenging behavior Apply basic first aid Maintain high standard of patient / client services Apply quality standards Maintain a safe, clean and efficient environment Maintain an effective relationship with clients/ customers (marketing) Update industry knowledge and practice through continuing education Use pharmaceutical calculation techniques and terminologies Maintain an effective relationship with customers and clients Manage own performance Follow occupational health and safety policies in dental laboratory facilities Maintain infection control in dental practice Operate a personal computer Perform workplace security and safety practices Perform computer operations Prepare and maintain beds Collect and maintain linen stocks at end- users location Assist in patient mobility Assist in transporting patients Assist in bio- psychosocial support care of patients Handle waste in a health care environment Plan the hilot wellness program of client/s Provide pre- service to hilot client/s Apply hilot wellness massage techniques Provide post advice and post-services to hilot clients Practice good housekeeping Monitor supply/ inventory of pharmaceutical products Handle and control pharmaceutical products Arrange and display pharmaceutical products Perform good laboratory practices Adhere to good manufacturing practices Demonstrate product knowledge on medicines Dispense pharmaceutical products Perform health promotion education, vigilance Install biomedical equipment Perform corrective maintenance on biomedical equipment Perform preventive maintenance on biomedical equipment Repair biomedical equipment Assess and refer biomedical equipment Develop massage practice Perform client consultation Perform body massage and work area Maintain and organize tools, equipment, supplies Perform basic life support Maintain life support equipment and resources Implement safe access and extrication procedures in an emergency Manage request for ambulance service Allocate ambulance service resources Coordinate emergency resources Deliver basic ambulance communication skills Supervise on- road operations Manage the scene of an emergency Manage the scene of a special event Manage routine scene Deliver pre- hospital patient care Deliver intensive pre- hospital patient care Manage ambulance operations Transport emergency patients Transport non- emergency patients Drive vehicles under operational conditions Assist the household to identify health problems to promote health and well-being Share knowledge and skills among members to provide information, education and communication (IEC) and/or household teaching in disease prevention and control Ensure the proper maintenance of health station and safe custody of its equipment, medical supplies, materials, and health records Monitor health status of household members under his/her area of service coverage Maintain updated list/records of health activities --- PDF PAGE 163 --- TR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 159 Analyze and interpret ophthalmic lens prescription Edge and mount ophthalmic appliances Apply UV coat/ tint to ophthalmic lenses Fabricate models Fabricate custom impression trays Fabricate registration bite rims Articulate models and transfer records Fabricate mouthguard Fabricate metal crown and bridge structures Fabricate ceramic restorations Fabricate indirect composite/ polymer fixed restorations Join alloy structures Arrange artificial teeth for complete dentures Set-up and wax removable partial dentures Wax, process and finish acrylic dentures and appliances Fabricate thermo formed bases and appliances Repair and modify dentures and appliances Fabricate oral splints Fabricate orthodontic appliances Fabricate cast metal removable partial denture framework Perform oral examination Promote oral health and hygiene Operate a dental radiographic equipment Apply the principle of radiology biology and protection in dental practice Perform scaling and polishing Maintain dental records and resources Provide effective patient/client service Manage dental laboratory production and operation Perform administrative functions Continue professional growth and development Participate in the implementation and monitoring of newborn’s care plan Develop the ability to recognize newborn’s growth and development Perform caring skills for newborn Participate in the implementation and monitoring of infant’s care plan Provide physical needs, care and support to infant Foster social, intellectual and emotional development of infant Participate in the implementation and monitoring of toddler’s care plan Develop the ability to recognize toddler’s growth and development Perform caring skills for toddler Participate in the implementation and monitoring of pre- schooler’s care plan Develop the ability to recognize pre- schooler’s growth and development Perform caring skills for pre- schooler Provide assistance and care to personal needs of grade schooler Foster physiological needs and cognitive development of grade schooler Foster physical growth and development of grade schooler Respond to emergency for grade schooler Foster physical growth and development of adolescent Promote developmental tasks for adolescent Respond to emergency for adolescent Develop the ability to recognize aging process Participate in the implementation and monitoring of client’s care plan Perform caring skills Perform specialty care procedures Assist client in administering prescribed medication Participate in the implementation and monitoring of client’s care plan Provide assistance and support on environment and biopsychosocial needs of clients Develop the ability to recognize healthy body systems and apply medical terminologies Provide care and support to activities of daily living (ADL) of clients Provide assistance in administering prescribed medications to clients Provide care and support to clients with special needs Respond to emergency situations Provide immediate care and support to children with special needs Provide immediate care and support to adults and elderly with special needs --- PDF PAGE 164 --- TR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 160 1. AGING - starting at what is commonly called age, operations of the human body begin to be more vulnerable to daily wear and tear, there is a general decline in physical, and possibly mental, functioning. In Western countries, the length of life is often into the 70s. The upward limit of the life span, however, can be as high as 120 years. During the latter of half of life, an individual is more prone to have problems with various functions of the body and to develop any number of chronic or fatal diseases. The cardiovascular, digestive, excretory, nervous, reproductive and urinary systems are particularly affected. The most common diseases of aging include Alzheimer’s, arthritis, cancer, diabetes, depression and heart disease. 2. AMBULATION - the act, action, or an instance of moving about or walking. Ambulation is the ability to walk without the need for any kind of assistance. It is most often used when describing the goals of a patient after a surgery or physical therapy. In order to reach a patient’s goal of ambulation, they may require assistance before they are able to walk around on their own. 3. ASSISTIVE DEVICES - Any device that is designed, made, or adapted to assist a person perform a particular task. For examples, canes, crutches, walkers, wheel chairs, and shower chairs are all assistive devices. 4. BED SORES - A painful, often reddened area of degenerating, ulcerated skin caused by pressure and lack of movement, and worsened by exposure to urine or other irritating substances on the skin. Untreated bed sores can become seriously infected or gangrenous. Bed sores are a major problem for patients who are confined to bed or a wheelchair. They can be prevented by moving the patient frequently, changing bedding, and keeping the skin clean and dry. Also called a pressure sore, decubitus sore, or decubitus ulcer. 5. CAREGIVER – a lay individual who assumes responsibility for the physical and emotional needs of another who is incapable of self-care. A person who provides direct care (as for children, elderly people, or the chronically ill). 6. CARE PLAN - A care plan is a written statement of your individual assessed needs identified during a Community Care Assessment. It sets out what support you should get, why, when, and details of who is meant to provide it. You are entitled to be given a copy of your care plan and should not sign the care plan until you are happy with it. 7. CARING SKILLS - feeling or showing concern for or kindness to others. All individuals in society have “needs” to grow, develop and maintain a healthy lifestyle. A “need” is what is required to achieve, maintain or regain the life quality factors. Caring helps individuals meet these needs to be healthy, active and independent. Caring helps individuals with everyday living and supports an individual’s life quality factors. Carers have an enormous influence over the outcome of the care that they give. Their actions can have positive or negative effects. 8. CLIENT - a person who engages the professional advice or services of another. 9. CLINICAL WASTE - Clinical waste is the term used to describe waste produced from healthcare and similar activities that may pose a risk of infection, for example, swabs, bandages, dressings etc. or may prove hazardous, for example medicines. --- PDF PAGE 165 --- TR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 161"
