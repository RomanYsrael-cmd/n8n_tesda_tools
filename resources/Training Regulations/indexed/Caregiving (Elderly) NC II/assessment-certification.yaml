lls for\nnewborn\nParticipate in\nthe\nimplementation\nand monitoring\nof infant’s care\nplan\nProvide\nphysical\nneeds, care\nand support to\ninfant\nFoster social,\nintellectual and\nemotional\ndevelopment of\ninfant\nParticipate in the\nimplementation\nand monitoring of\ntoddler’s care plan\nDevelop the\nability to\nrecognize\ntoddler’s\ngrowth and\ndevelopment\nPerform\ncaring skills\nfor toddler\nParticipate in\nthe\nimplementation\nand monitoring\nof pre-\nschooler’s care\nplan\nDevelop the\nability to\nrecognize pre-\nschooler’s\ngrowth and\ndevelopment\nPerform caring\nskills for pre-\nschooler\nProvide\nassistance and\ncare to\npersonal\nneeds of grade\nschooler\nFoster\nphysiological\nneeds and\ncognitive\ndevelopment\nof grade\nschooler\nFoster physical\ngrowth and\ndevelopment\nof grade\nschooler\nRespond to\nemergency for\ngrade schooler\nFoster physical\ngrowth and\ndevelopment of\nadolescent\nPromote\ndevelopmental\ntasks for\nadolescent\nRespond to\nemergency\nfor\nadolescent\nDevelop the\nability to\nrecognize\naging process\nParticipate in\nthe\nimplementation\nand monitoring\nof client’s care\nplan\nPerform caring\nskills\nPerform\nspecialty care\nprocedures\nAssist client in\nadministering\nprescribed\nmedication\nParticipate in\nthe\nimplementation\nand monitoring\nof client’s care\nplan\nProvide\nassistance and\nsupport on\nenvironment\nand\nbiopsychosocial\nneeds of clients\nDevelop the ability\nto recognize\nhealthy body\nsystems and apply\nmedical\nterminologies\nProvide care\nand support to\nactivities of\ndaily living\n(ADL) of\nclients\nProvide\nassistance in\nadministering\nprescribed\nmedications\nto clients\nProvide care\nand support to\nclients with\nspecial needs\nRespond to\nemergency\nsituations\nProvide\nimmediate\ncare and\nsupport to\nchildren with\nspecial needs\nProvide\nimmediate\ncare and\nsupport to\nadults and\nelderly with\nspecial needs\n\n--- PDF PAGE 164 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 160\nGLOSSARY OF TERMS\n\n1.\nAGING - starting at what is commonly called age, operations of the human body begin\nto be more vulnerable to daily wear and tear, there is a general decline in physical, and\npossibly mental, functioning. In Western countries, the length of life is often into the\n70s. The upward limit of the life span, however, can be as high as 120 years. During\nthe latter of half of life, an individual is more prone to have problems with various\nfunctions of the body and to develop any number of chronic or fatal diseases. The\ncardiovascular, digestive, excretory, nervous, reproductive and urinary systems are\nparticularly affected. The most common diseases of aging include Alzheimer’s,\narthritis, cancer, diabetes, depression and heart disease.\n\n2.\nAMBULATION - the act, action, or an instance of moving about or walking.\nAmbulation is the ability to walk without the need for any kind of assistance. It is most\noften used when describing the goals of a patient after a surgery or physical therapy.\nIn order to reach a patient’s goal of ambulation, they may require assistance before\nthey are able to walk around on their own.\n\n3.\nASSISTIVE DEVICES - Any device that is designed, made, or adapted to assist a\nperson perform a particular task. For examples, canes, crutches, walkers, wheel chairs,\nand shower chairs are all assistive devices.\n\n4.\nBED SORES - A painful, often reddened area of degenerating, ulcerated skin caused\nby pressure and lack of movement, and worsened by exposure to urine or other\nirritating substances on the skin. Untreated bed sores can become seriously infected\nor gangrenous. Bed sores are a major problem for patients who are confined to bed or\na wheelchair. They can be prevented by moving the patient frequently, changing\nbedding, and keeping the skin clean and dry. Also called a pressure sore, decubitus\nsore, or decubitus ulcer.\n\n5.\nCAREGIVER – a lay individual who assumes responsibility for the physical and\nemotional needs of another who is incapable of self-care. A person who provides\ndirect care (as for children, elderly people, or the chronically ill).\n\n6.\nCARE PLAN - A care plan is a written statement of your individual assessed needs\nidentified during a Community Care Assessment. It sets out what support you should\nget, why, when, and details of who is meant to provide it. You are entitled to be given\na copy of your care plan and should not sign the care plan until you are happy with it.\n\n7.\nCARING SKILLS - feeling or showing concern for or kindness to others. All\nindividuals in society have “needs” to grow, develop and maintain a healthy lifestyle.\nA “need” is what is required to achieve, maintain or regain the life quality factors.\nCaring helps individuals meet these needs to be healthy, active and independent.\nCaring helps individuals with everyday living and supports an individual’s life quality\nfactors. Carers have an enormous influence over the outcome of the care that they\ngive. Their actions can have positive or negative effects.\n\n8.\nCLIENT - a person who engages the professional advice or services of another.\n\n9.\nCLINICAL WASTE - Clinical waste is the term used to describe waste produced from\nhealthcare and similar activities that may pose a risk of infection, for example, swabs,\nbandages, dressings etc. or may prove hazardous, for example medicines.\n\n--- PDF PAGE 165 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 161\n\n10. COLD THERAPY - As a general rule, cold therapy is used for sudden, acute injuries\nsuch as ankle sprains, muscle years, bruising and inflammation.\n\n11. DISPENSING - is the provision of drugs or medicines as set out properly on\na lawful prescription.\n\n12. ELDERLY- aged; individuals over 65 years old who have functional impairments;\nsometimes used to describe any adult over 75 years old.\n\n13. HOT THERAPY - Heat therapy is primarily used for taking the edge off of several\ndifferent kinds of body pain. Those dull, persistent pains that you get with stiffness and\ncramping, for example.\n\n14. INCONTINENCE - inability of the body to control the evacuative functions of urination\nor defecation: partial or complete loss of bladder or bowel control.\n\n31\nINFECTION CONTROL - is the discipline concerned with preventing healthcare-\nassociated infections; a practical rather than academic sub-discipline of epidemiology.\nInfection control addresses factors related to the spread of infections within the\nhealthcare setting, whether among patients, from patients to staff, from staff to patients,\nor among staff. This includes preventive measures such as hand washing, cleaning,\ndisinfecting, sterilizing,\nand vaccinating.\nOther\naspects\ninclude\nsurveillance,\nmonitoring, and investigating any suspected outbreak of infection, and its\nmanagement.\n\n32\nMEDICATION - a substance used for medical treatment, especially a medicine or drug.\n\n33\nMOBILITY - the ability to move or be moved freely and easily.\n\n34\nORAL CARE – is the practice of keeping the mouth clean and healthy by brushing and\nflossing to prevent tooth decay and gum disease.\n\n35\nPALLIATIVE CARE - care for the terminally ill and their families, especially that\nprovided by an organized health service.\n\n36\nPERENIAL CARE - involves cleaning the private areas of a patient. Because this area\nis prone to infection, it must be cleaned at least daily, and more if your loved one suffers\nfrom incontinence. Typical times to perform peri-care include as part of daily bathing,\nafter the use of the bedpan, and following episodes of incontinence.\n\n37\nPERSONAL PROTECTIVE EQUIPMENT (PPE) – is protective clothing, helmets,\ngoggles, or other garments or equipment designed to protect the wearer's body\nfrom injury or infection.\n\n38\nPRESCRIPTION - an instruction written by a medical practitioner that authorizes a\npatient to be provided a medicine or treatment.\n\n39\nSKIN CARE - maintaining clean, comfortable and healthy skin through thorough\ncleansing with soap and water, and moisturizing with emollients. Basic skin care also\nincludes treating skin conditions appropriately with medicines and lotions, and avoiding\n\n--- PDF PAGE 166 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 162\nsun exposure. Age is a factor in skin care. Special consideration should be given to\ninfants, senior adults and the infirm.\n\n40\nTHERAPEUTIC COMMUNICATION – an interaction between a health care\nprofessional and a patient that aims to enhance the patient’s comfort, safety, trust, or\nhealth and well-being.\n\n41\nTHERAPEUTIC DIET - a therapeutic diet is a meal plan that controls the intake of\ncertain foods or nutrients. It is part of the treatment of a medical condition and are\nnormally prescribed by a physician and planned by a dietician.\n\n42\nTOILETING - is the act of assisting a dependent patient with his/her elimination needs.\n\n43\nVITAL SIGNS – determination of temperature, pulse rate, rate of breathing and level\nof blood pressure.\n\n44\nWOUND CARE - refers to specific types of treatment for pressure sores, skin ulcers\nand other wounds that break the skin.\n\n--- PDF PAGE 167 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 163\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) would like to\nextend thanks and appreciation to the many representatives of business, industry, academe\nand government agencies who provided their time and expertise to the development and\nvalidation of these Training Regulations.\n\nTHE TECHNICAL AND INDUSTRY EXPERT AND REVIEW PANEL\n\nMS. BERNADETTE DC. ILAGAN, PhD, RN, LPT\nMember\nPhilippine Association of Service Exporters, Inc. (PASEI)\n\nMS. MARIETTA M. SERNA, MAN, RN\nMember\nPhilippine Association of Service Exporters, Inc. (PASEI)\n\nMR. JOEY M. CADANO, PhD, RN, LPT\nMember\nPhilippine Association of Service Expor