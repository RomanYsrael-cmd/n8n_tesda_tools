      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification of CAREGIVING (ELDERLY) NC II the candidate must demonstrate competence in all unit/s of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.3 Any of the following are qualified to undergo assessment and certification: 4.1.3.1 Graduates of WTR-registered program, NTR-registered programs or formal/non-formal/informal including enterprise-based trainings related to Caregiving (Elderly) NC II. 4.1.3.2 Experienced workers (wage employed or self-employed) who gained competencies in providing caregiving services for at least two (2) years within the last five (5) years. 4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences with at least three (3) years of caregiving experience within the last five (5) years may apply for recognition in this Qualification through Portfolio Assessment. Requirements and implementation procedure of Portfolio Assessment must be consistent with TESDA Circular No. 47, series of 2018 on “Implementing Guidelines on the Implementation of Portfolio Assessment Leading to Recognition of Prior Learning (RPL) within the TESDA Assessment and Certification System, and with TESDA Circular No. 118, series of 2019 on “Addendum to the Implementing Guidelines on the Implementation Portfolio Assessment Leading to Recognition of Prior Learning (RPL) within the TESDA Assessment and Certification System.” 4.1.5 Holders of National Certificate (NC) or Certificates of Competency (COC) in Caregiving Services NC II are required to undergo re-assessment under the amended Training Regulations (TRs) upon expiration of their Certificates. 4.1.6 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the “Philippine TVET Competency Assessment and Certification System (PTCACS)”."
