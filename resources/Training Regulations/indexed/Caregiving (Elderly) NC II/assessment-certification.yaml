      "number": "14",
      "text": "INCONTINENCE - inability of the body to control the evacuative functions of urination or defecation: partial or complete loss of bladder or bowel control. 31 INFECTION CONTROL - is the discipline concerned with preventing healthcare- associated infections; a practical rather than academic sub-discipline of epidemiology. Infection control addresses factors related to the spread of infections within the healthcare setting, whether among patients, from patients to staff, from staff to patients, or among staff. This includes preventive measures such as hand washing, cleaning, disinfecting, sterilizing, and vaccinating. Other aspects include surveillance, monitoring, and investigating any suspected outbreak of infection, and its management. 32 MEDICATION - a substance used for medical treatment, especially a medicine or drug. 33 MOBILITY - the ability to move or be moved freely and easily. 34 ORAL CARE – is the practice of keeping the mouth clean and healthy by brushing and flossing to prevent tooth decay and gum disease. 35 PALLIATIVE CARE - care for the terminally ill and their families, especially that provided by an organized health service. 36 PERENIAL CARE - involves cleaning the private areas of a patient. Because this area is prone to infection, it must be cleaned at least daily, and more if your loved one suffers from incontinence. Typical times to perform peri-care include as part of daily bathing, after the use of the bedpan, and following episodes of incontinence. 37 PERSONAL PROTECTIVE EQUIPMENT (PPE) – is protective clothing, helmets, goggles, or other garments or equipment designed to protect the wearer's body from injury or infection. 38 PRESCRIPTION - an instruction written by a medical practitioner that authorizes a patient to be provided a medicine or treatment. 39 SKIN CARE - maintaining clean, comfortable and healthy skin through thorough cleansing with soap and water, and moisturizing with emollients. Basic skin care also includes treating skin conditions appropriately with medicines and lotions, and avoiding --- PDF PAGE 166 --- TR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 162 sun exposure. Age is a factor in skin care. Special consideration should be given to infants, senior adults and the infirm. 40 THERAPEUTIC COMMUNICATION – an interaction between a health care professional and a patient that aims to enhance the patient’s comfort, safety, trust, or health and well-being. 41 THERAPEUTIC DIET - a therapeutic diet is a meal plan that controls the intake of certain foods or nutrients. It is part of the treatment of a medical condition and are normally prescribed by a physician and planned by a dietician. 42 TOILETING - is the act of assisting a dependent patient with his/her elimination needs. 43 VITAL SIGNS – determination of temperature, pulse rate, rate of breathing and level of blood pressure. 44 WOUND CARE - refers to specific types of treatment for pressure sores, skin ulcers and other wounds that break the skin. --- PDF PAGE 167 --- TR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 163 The Technical Education and Skills Development Authority (TESDA) would like to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who provided their time and expertise to the development and validation of these Training Regulations. MS. BERNADETTE DC. ILAGAN, PhD, RN, LPT Member Philippine Association of Service Exporters, Inc. (PASEI) MS. MARIETTA M. SERNA, MAN, RN Member Philippine Association of Service Exporters, Inc. (PASEI) MR. JOEY M. CADANO, PhD, RN, LPT Member Philippine Association of Service Exporters, Inc. (PASEI) MR. JOEL JOHN A. DELA MERCED, PhD, RN, LPT Member Philippine Association of Service Exporters, Inc. (PASEI) MS. MILAFLOR L. VALDEZ Founder Caregivers of the Philippines Association, Inc. (CPAI) MR. ANTONIO ALVIN M. COBANGBANG Chairman, External Affairs and Rules Caregivers of the 