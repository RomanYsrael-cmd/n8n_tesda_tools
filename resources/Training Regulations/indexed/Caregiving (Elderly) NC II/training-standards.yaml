ss and explain organizational /\ninstitutional policies and procedures for\nprivacy and confidentiality of information\nprovided by patients / clients and others\n•\nDemonstrate working with others and\ndisplaying empathy with patient / client and\nrelatives\n•\nMake use of appropriate conflict management\nstyle\n•\nUtilize intra and interpersonal skills\n• Lecture (online /\nface to face)\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n6 hours\n4.4 Evaluate own\nwork to maintain a\nhigh standard of\npatient / client\nservice\n•\nDiscuss and explain evaluation and analysis\nof work performance\n•\nIdentify standards for work procedures\n•\nMake use of standards for work procedures\n•\nExamine standards for work procedures\n•\nUtilize intra and interpersonal skills\n•\nParticipate in the discussion of evaluation of\nwork and standard of client service\n•\nParticipate in demonstrating the application of\nevaluation of work and standard of client\nservice\n• Lecture (online /\nface to face)\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n6 hours\n\n--- PDF PAGE 134 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 130\nCORE COMPETENCIES\n(252 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Develop the\nability to\nrecognize\naging process\n(32 hours)\n1.1 Interpret\nknowledge of\naging process\n\n• Read and understand aging process\n• Read and understand phases of aging process\nto determine any problems regarding client\nhealth\n• Apply caregiver’s roles and responsibilities in\ngiving care and support for elderly in\naccordance with standard policies and\nregulations\n•\nInteractive\ndiscussion\n•\nRole play\n•\nDemonstrate\nwith guided\ndemonstration\n\n•\nOral question\n•\nWritten Test\n\n16 hours\n1.2 Apply principles\nof caregiving\npractice\n• Read and understand principles of caregiving\npractice\n• Read and understand legal standards based\non applicable laws and government\nregulations\n• Apply legal and ethical fundamentals in\naccordance with established industry\nstandards.\n• Apply interpersonal skills\n• Use keen attention to details\n• Apply therapeutic and non-therapeutic\ncommunication techniques\n•\nInteractive\ndiscussion\n•\nRole play\n•\nDemonstrate\nwith guided\ndemonstration\n•\nOral question\n•\nWritten Test\n\n8 hours\n1.3 Apply infection\ncontrol principles\nand sanitation\npractices\n• Read and understand infection control\nprinciples and sanitation practices\n• Apply infection control principles and\nsanitation practices\n• Apply interpersonal skills\n• Use keen attention to details\n• Apply effective oral and written communication\n• Use of materials, supplies and tools\n• Use of Personal Protective Equipment (PPE)\n•\nInteractive\ndiscussion\n•\nwith power point\npresentation\n•\nFilm showing\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n8 hours\n\n--- PDF PAGE 135 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 131\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Participate in\nthe\nimplementatio\nn and\nmonitoring of\nclient’s care\nplan (28\nhours)\n2.1 Determine\nsupport needs\n• Read and understand the elderly care plan\ndone by doctors and nurses\n• Read and understand therapeutic\ncommunication\n• Use therapeutic communication\n• Apply legal and ethical standards of health\ncare\n• Confirm care plan details with the client, family\nmembers and caregiver\n• Collaborate with other health workers\n• Inform the client about his/her rights and\ncomplaints based on established industry\nstandards.\n• Interpret and clarify caregiver’s own role in\nclient’s care in accordance with individualized\ncare plan\n• Observe compliance of client’s rights\n• Plan action and management\n•\nInteractive\ndiscussion\n•\nRole play\n\n•\nOral question\nWritten\nexamination\n8 hours\n2.2 Provide and\nmonitor support\nservices and\nactivities\n• Read and understand support services\n• Use therapeutic and non therapeutic\ncommunication\n• Apply decision-making skills\n• Maintain balance on duties and responsibilities\nof care and dignity of client\n• Apply principles of infection control\n•\nInteractive\ndiscussion using\npower point\npresentation\n•\nRole play\n•\nOral question\n•\nWritten exam\n8 hours\n2.3 Provide\ncomplete daily\nrecords and\nreports\n• Read and understand confidentiality and\ndocumentation\n• Read and understand the principles and\nguidelines of documentation and reporting\n• Apply the proper procedure in documenting\nand reporting skills\n• Use appropriate forms for documentation\n• Record and report confidential data\n• Demonstrate good documentation skills\n•\nInteractive\ndiscussion with\npower point\npresentation\n\n•\nOral question\nWritten exam\n4 hours\n\n--- PDF PAGE 136 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 132\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Demonstrate interpersonal skills\n• Demonstrate keen attention to details\n• Use of Caregivers Care Plan for\ndocumentation\n• Use of computer for documentation\n2.4 Interpret\nendorsement\nprocess\n• Read and understand endorsement process\nbased on caregiver’s care plan\n• Read and understand endorsement technique\n• Document status of client health and activities\n• Use endorsement techniques based on\nindustry standard\n• Perform endorsement process based on\nCaregivers care plan\n•\nInteractive\ndiscussion\n•\nRole play\n\n•\nOral question\n•\nWritten Test\n\n8 hours\n3. Perform caring\nskills (176\nhours)\n3.1 Monitor and\nrecord vital signs\nof client\n• Read and understand the definition of vital\nsigns\n• Identify the vital signs paraphernalia\n• Apply verbal and non-verbal therapeutic\ncommunication\n• Prepare and cleanse vital signs paraphernalia\nbased on established procedures\n• Apply handwashing technique\n• Enumerate, document and report the factors\naffecting vital signs of client based on\nestablished standards\n• Perform in taking Vital signs\n• Measure vital signs baseline value\n• Monitor and record vital signs in accordance\nwith established procedures\n• Use of materials, supplies and tools\n• Use of Personal Protective Equipment (PPE)\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nFilm showing\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n24 hours\n3.2 Assist client in\nfluids and dietary\nrequirements\n• Read and understand nutrition for elderly\n• Apply interpersonal skills\n• Use of proper therapeutic communication\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nOral question\n•\nDemonstration\n•\nWritten test\n24 hours\n\n--- PDF PAGE 137 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 133\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Use keen attention to details\n• Explain value of food pyramid\n• Apply appropriate hand washing\n• Prepare meal\n• Assist proper feeding technique\n• Observe signs and symptoms and precautions\nof aspiration and regurgitation during feeding\n• Clean feeding area\n• Store and handle left-over food\n• Evaluate and document feeding outcome\n• Use of feeding materials, supplies and tools\n• Use of Personal Protective Equipment (PPE)\n•\nFilm showing\n•\nRole play\n\n3.3 Assist client in\ntoileting and\nelimination\n• Read and understand the definition toileting\nand elimination of elderly care\n• Explain the purpose and scope of toileting and\nelimination to the client utilizing therapeutic\ncommunication tools\n• Demonstrate oral therapeutic communication\nskills\n• Explain how toileting and elimination devices\ncan help prevent potential complications\n• Ensure client’s privacy and comfort\n• Position the client appropriately\n• Assist a client using a bedpan, urinal or\ncommode\n• Collect, measure, assess and record urine and\nstool output\n• Apply documentation / reporting skill\n• Use of Personal Protective Equipment (PPE)\n• Use of Elimination and toileting devices\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nFilm showing\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n8 hours\n3.4. Assist client in\nbathing/\nshowering\n• Read and understand importance of bathing of\nelderly\n•\nInteractive\ndiscussion\n•\nOral question\n•\nDemonstration\n•\nWritten test\n24 hours\n\n--- PDF PAGE 138 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 134\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Apply verbal and non verbal therapeutic\ncommunication skills\n• Perform bathing skill\n• Perform assistive dressing skills\n• Perform documentation / reporting skills\n• Apply the use of Personal Protective\nEquipment\nwith power point\npresentation\n•\nFilm showing\n•\nRole play\n\n3.6. Assist client in\nperineal genital\ncare\n• Read and understand the definition and\nimportance of perineal care for elderly\n• Apply therapeutic communication skills\n• Applying Principles of Infection Control\n• Maintain privacy, comfort and safety of the\nclient\n• Perform genitals care\n• Document accurately the activities done\n• Use of Personal Protective Equipment (PPE)\n• Use of tools and devices\n•\nIndividual Study\n•\nLecture-\nDiscussion\n•\nDemonstration\n•\nField Work\n•\nRole Playing\n•\nProject method\n\n•\nWritten Test\n•\nPortfolio\n•\nInterview\n•\nDemonstration of\nwork related\nproject\n\n24 hours\n3.7 Assist client in\noral care\n• Read and understand Oral Hygiene Principles\nand Procedures\n• Demonstrate oral therapeutic communication\nskill\n• Perform mouth care skills\n• Perform oral hygiene care for conscious\nclients\n• Perform caring skills for dentures\n• Perform caring skills for clients with mouth\ninjuries, oral surgery, or inflamed mouth tissue\n• Demonstrate documentation/reporting skills\n• Use of Personal Protective Equipment (PPE)\n• Use of equipment for routine mouth care\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nFilm showing\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n8 hours\n3.8 Assist client in\nskin care\n• Read and understand the importance of skin\ncare for elderly\n• Apply therapeutic communication skills\n•\nInteractive\ndiscussion\n•\nOral question\n•\nDemonstration\n•\nWritten test\n8 hours\n\n--- PDF PAGE 139 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 135\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Applying Principles of infection control\n• Assess skin integrity\n• Identify causes, locations of pressure ulcers\n• Perform basic skin care and wound dressing\ntechniques\n• Document/ report skills\n• Use of Personal Protective Equipment (PPE)\nwith power point\npresentation\n•\nFilm showing\n•\nRole play\n\n 3.9 Assist client in\ndressing and\nundressing\n• Read and understand the importance of\ndressing and undressing techniques of elderly\n• Apply therapeutic communication skills\n• Assist client in dressing/undressing\n• Document/report accurately the activities done\n• Provide well-fitting shoes and slippers\n• Use of Personal Protective Equipment (PPE)\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nFilm showing\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n8 hours\n3.10 Prepare and\nmaintain client’s\nbed\n• Read and understand bed setting of elderly\ncare\n• Apply Principles of Infection Control\n• Preparing all the materials needed in bed\nmaking\n• Apply comfort and safety of the client during\nbed making\n• Observe proper body mechanics\n• Document accurately the activities done\n• Use of Personal Protective Equipment\n• Use of equipment and tools\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nFilm showing\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n24 hours\n3.11 Assist client in\nsafe ambulation\nand transfer\n• Read and understand safe ambulation and\ntransfer of client\n• Apply therapeutic communication skills\n• Document / report skills Applying Principles of\nInfection Control\n• Maintain a safe, and hazard free environment\n• Provide attainable short-term goals to help\nincrease client’s self-confidence and worth.\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nFilm showing\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n24 hours\n\n--- PDF PAGE 140 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 136\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Implement and monitoring ambulation\nactivities\n• Demonstrate transfer of clients from\nwheelchair to bed\n• Assist the client’s ambulation\n• Prevent the client from falls and accident\n• Document accurately the activities of the client\n• Use of Personal Protective Equipment\n• Use of mobility assistive devices\n4. Perform\nspecialty care\nprocedures (32\nhours)\n4.1 Assist in simple\nwound care\n• Read and understand wound care of elderly\n• Apply therapeutic communication techniques\n• Apply Principles of Infection Control\n• Maintain client’s privacy, safety and comfort\n• Perform aseptic hand washing\n• Maintain client privacy and dignity\n• Understand ways disease is spread and\ninfection is developed throughout wound\nassessment and care\n• Understand types of wound\n• Assess the wound\n• Identify types of dressing\n• Documenting accurately\n• Use of Personal Protective Equipment\n• Use of wound care equipment, aids and\nappliances\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nFilm showing\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n16 hours\n4.2 Apply hot and\ncold therapy\n• Read and understand Hot and Cold Therapy\n• Apply therapeutic communication techniques\n• Apply Principles of Infection Control\n• Maintain client’s privacy, safety and comfort\n• Use a variety of cold therapy techniques\n• Use a variety of hot therapy techniques\n• Recognize limitations of heat and cold\ntherapies\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nFilm showing\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n8 hours\n\n--- PDF PAGE 141 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 137\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Use of Personal Protective Equipment\nproperly\n4.3 Assist in\nproviding\npalliative care to\nclients\napproaching\nend-of-life stage\n• Read and understand Palliative care\n• Apply therapeutic communication\n• Apply Principles of Infection Control\n• Apply Concepts of death and dying and other\nrelated terminologies\n• Apply Dying Person Bill of Rights\n• Apply Principles of Palliative Care\n• Apply Strategies to keep client feel\ncomfortable when discussing death and dying\n• Discuss benefits of Palliative Care\n• Documenting accurately client’s response to\nPalliative care\n• Use of personal protective equipment\n• Use of heat therapy techniques\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n8 hours\n5. Assist clients in\nadministering\nmedication (48\nhours)\n5.1 Prepare to assist\nwith medication\n• Read and understand assistance medication\norder of elderly\n• Apply legal aspects in assisting in the\nadministration of specified medication\n• Interpret package label information\n• Interpret medication orders\n• Apply standard and additional precautions in\ninfection control\n• Follow instructions for assisting with\nadministration of medication as per the client's\nhealth/care/support plan\n• Follow occupational health and safety (OHS)\nguidelines\n• Observe and reporting contingencies which\nmay arise\n• Observe, record and report on the client's\nstate of health and well being\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n8 hours\n\n--- PDF PAGE 142 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 138\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Use of types of dispensing Aids\n• Use personal protective equipment\n5.2 Prepare the\nclient for\nassistance with\nadministration of\nmedication\n• Read and understand medication\nadministration assistance of elderly\n• Support client to self-administer the\nmedication\n• Provide physical assistance to take the\nmedication\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n8 hours\n5.3 Assist/support\nmedication\nadministration\naccording to\nprescription/instr\nuctions\n• Read and understand assistance/support\nmedication administration according to\nprescription/instructions for elderly\n• Identify the appropriate dosage form, potency\nand generic name of the medicine\n• Prepare and administering medication to the\nclient\n• Use correct dosage administration\n• Document the administration of medicines\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n8 hours\n5.4 Provide record\nand report of the\nclient\n• Read and understand documentation of\nmedication administration\n• Identify the appropriate dosage form, potency\nand generic name of the medicine\n• Prepare and administering medication to the\nclient\n• Use correct dosage administration\n• Document the administration of medicines\n• Use of tools and materials\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n8 hours\n5.5 Comply with\nindustry\nprocedures for\nhandling the\nrange of\nissues/contingen\ncies which may\narise\n• Read and understand industry procedures for\nhandling the range of issues /contingencies\nwhich may arise\n• Handle of expired / damaged / contaminated\nmedicines properly\n• Handle skipped/missed doses\n• Recognize medication side effects\n• Document given medication effects\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n8 hours\n\n--- PDF PAGE 143 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 139\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5.6 Complete the\ndistribution and\nadministration of\nprescribed\nmedication\n• Read and understand complete distribution\nand administration of medication\n• Store medications properly\n• Clean and store administration aids properly\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n8 hours\n\n--- PDF PAGE 144 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 140",
