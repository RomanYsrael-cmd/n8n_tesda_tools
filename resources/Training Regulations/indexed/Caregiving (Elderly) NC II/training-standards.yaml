OX\nBallpoint Pen ( Color: Red, Blue, Black, Quantity: 1 box per\ncolor )\nINSTRUCTIONAL MATERIALS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n5\nCOPIES\nCompetency-Based Learning Module (CBLM)\n1\nCOPY\nModule of Instruction: Performing Specialty care procedures\n\nUC 5: Assist Client in Administering Prescribed Medications\nEQUIPMENT\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n1\nPC\nMedicine Cabinet ( Double Door 85 x 100 x 30 cm with Eight\nshelves and Eight door trays\n1\nPC\nRefrigerator (Small) ( Capacity; 40 L, Temperature 0 to 8\ndegree, Size: 440Lx400x550 mm, Net weight (16.5 kg)\nTOOLS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n2\nSETS\nDispensing aids-\n\n--- PDF PAGE 157 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 153\n• Dosettes\n• Dispensing spoons, dispensing cups\n• Pre-filled syringes\n• Pill pots\n• Pill cutter\n2\nPCS\nAdult nebulizing kit\n2\nPCS\nChildren’s nebulizing kit\n2\nPCS\nTumbler\n1\nPACK\nParacetamol 500mg tablet\n1\nPACK\nMefenamic acid scored tablet\n1\nPACK\nAntacid chewable tablet\n1\nPACK\nSublingual tablet\n1\nPACK\nAntidiabetic drugs\n1\nPACK\nAntihypertensive drugs\n1\nPACK\nCholesterol lowering drugs\n1\nPACK\nDiuretic drugs\n1\nBOTTLE\nAntacid suspension 60ml\n1\nBOTTLE\nMultivitamin syrup 60ml\n1\nBOTTLE\nParacetamol drops 15ml1\n1\nTUBE\nAnalgesic Ointment\nMATERIALS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n25\nCOPIES\nSample medication chart / record\n25\nPCS\nSample medication prescription\nINSTRUCTIONAL MATERIALS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n5\nCOPIES\nCompetency-Based Learning Module (CBLM)\n1\nCOPY\nModule of Instruction: Assisting client in administering\nmedications\n\n--- PDF PAGE 158 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 154\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 learners/trainees.\n\nSpace Requirement\nSize in\nMeters\nArea in Sq.\nMeters\nTotal Area in\nSq. Meters\nAdministrative/ Office Area\n\n15\n15\nTraining Resource Area\n\n10\n10\nPractical Work Area- Elderly\n\n35\n35\nContextual Learning Area\n\n30\n30\nLearning Resource Area\n\n15\n15\nComputer Laboratory\n\n10\n10\nCirculation Area\n\n30\n30\nCareer Counseling Area\n\n5\n5\nClinic/Lactating Room\n\n5\n5\nComfort Room for Special Child and\nElderly\n\n10\n10\nSeparate restrooms for female and\nmale\n\n10\n10\nTotal workshop area:\n175 sq. m.\n\n3.6\nTRAINER’S QUALIFICATIONS FOR CAREGIVING (ELDERLY) NC II\n\n• Must be a holder of National TVET Trainer’s Certificate (NTTC) Level I in\nCaregiving (Elderly) NCII\n• Must be a graduate of any allied health courses or Bachelor’s Degree\n• Must possess good communication skills\n• Must have at least two (2) years industry experience within the last five (5) years\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee is competent or not competent\n\n--- PDF PAGE 159 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 155"
