n administration according to\nprescription/instructions for elderly\n• Identify the appropriate dosage form, potency\nand generic name of the medicine\n• Prepare and administering medication to the\nclient\n• Use correct dosage administration\n• Document the administration of medicines\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n8 hours\n5.4 Provide record\nand report of the\nclient\n• Read and understand documentation of\nmedication administration\n• Identify the appropriate dosage form, potency\nand generic name of the medicine\n• Prepare and administering medication to the\nclient\n• Use correct dosage administration\n• Document the administration of medicines\n• Use of tools and materials\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n8 hours\n5.5 Comply with\nindustry\nprocedures for\nhandling the\nrange of\nissues/contingen\ncies which may\narise\n• Read and understand industry procedures for\nhandling the range of issues /contingencies\nwhich may arise\n• Handle of expired / damaged / contaminated\nmedicines properly\n• Handle skipped/missed doses\n• Recognize medication side effects\n• Document given medication effects\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n8 hours\n\n--- PDF PAGE 143 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 139\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5.6 Complete the\ndistribution and\nadministration of\nprescribed\nmedication\n• Read and understand complete distribution\nand administration of medication\n• Store medications properly\n• Clean and store administration aids properly\n•\nInteractive\ndiscussion\nwith power point\npresentation\n•\nRole play\n\n•\nOral question\n•\nDemonstration\n•\nWritten test\n\n8 hours\n\n--- PDF PAGE 144 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 140\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto meet industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies; or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative\n\n--- PDF PAGE 145 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 141\nthat the deployment of trainees in the workplace is adhered to training\nprograms agreed by the institution and enterprise and status and\nprogress of trainees are closely monitored by the training institutions to\nprevent opportunity for work exploitation.\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training\nthe apprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training\nis integrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based\n\n• Community-Based – short term programs conducted by non-government\norganizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training\nprogram (MTP).\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\n Trainees or students wishing to enroll in this program must possess the\nfollowing requirements:\n\n• Completed at least 10 years basic education or Holder of Alternative Learning\nSystems (ALS) certificate of completion with grade 10 equivalent;\n• Basic communication skills\n\n--- PDF PAGE 146 ---\nTR - Caregiving (Elderly) NC II Revision 00 Promulgated (06/09/2020) 142\n3.4\nTOOLS, MATERIALS AND EQUIPMENT\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for CAREGIVING (ELDERLY) NC II.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used\nas alternatives. This also applies in consideration of community practices and their\navailability in the local market.\n\nTRAINING CENTER OFFICE\n\nEQUIPMENT\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n1\nPC\nComputer table\n3\nSETS\nOffice table (regular size) with chairs\n2\nPC\nSteel cabinet\n1\nSET\nComputer with complete accessories and applications\n1\nUNIT\nTelephone with internet\n1\nSET\nPrinter\n1\nUNIT\nAir conditioning unit\n1\nPC\nWall clock\n2\nSET\nFirst Aid Kit\n1\nPC\nRechargeable Emergency Lamp\n2\nPC\nFire Extinguisher\n1\nPC\nBulletin board\nTOOLS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n2\nPCS\nScissors\n1\nPCS\nStapler\n1\nPCS\nPuncher\n1\nPC\nWhite board eraser\nMATERIALS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n1\nREAM\nA4, letter, legal bond paper (each)\n25\nPCS\nLong , s