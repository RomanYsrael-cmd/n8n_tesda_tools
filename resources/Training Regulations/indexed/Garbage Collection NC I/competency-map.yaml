  "source_text": "COMPETENCY MAP – GARBAGE COLLECTION NC I\n\nBASIC COMPETENCIES\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with others\nDemonstrate\nwork values\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nPractice career\nprofessionalism\nPractice\noccupational\nhealth and safety\nprocedures\nLead workplace\ncommunication\nLead small team\nDevelop and\npractice\nnegotiation skills\nSolve problems\nrelated to work\nactivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize\nspecialized\ncommunication\nskills\nDevelop teams\nand individuals\nApply problem\nsolving\ntechniques in the\nworkplace\nCollect, analyze\nand organize\ninformation\nPlan and organize\nwork\nPromote\nenvironmental\nprotection\n\nCOMMON COMPETENCIES\n\nCORE COMPETENCIES\n\nPrepare for garbage\ncollection activities\nCollect garbage\n\nMaintain an\neffective\nrelationship with\nclients and\ncustomers\nManage own\nperformance\nDevelop and update\nindustry knowledge\nPerform\nworkplace\nsecurity and\nsafety practices\nMaintain\nenvironmental\nhealth and\nawareness in the\nwork place\n\n--- PDF PAGE 71 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 67\nDEFINITION OF COMMON TERMS\n\n1.\nBulky wastes shall refer to waste materials which cannot be appropriately\nplaced in separate containers because of either its bulky size, shape or other\nphysical attributes. These include large worn-out or broken household,\ncommercial, and industrial items such as furniture, lamps, bookcases, filing\ncabinets, and other similar items;\n2.\nBuy-back center shall refer to a recycling center that purchases or otherwise\naccepts recyclable materials from the public for the purpose of recycling such\nmaterials;\n3.\nCollection shall refer to the act of removing solid waste from the source or from\na communal storage point;\n4.\nConsumer electronics shall refer to special waste that includes worn-out,\nbroken, and other discarded items such as radios, stereos, and TV sets;\n5.\nDepartment shall refer to the Department of Environment and Natural\nResources;\n6.\nEcological solid waste management shall refer to the systematic\nadministration of activities which provide for segregation at source, segregated\ntransportation, storage, transfer, processing, treatment, and disposal of solid\nwaste and all other waste management activities which do not harm the\nenvironment;\n7.\nEnvironmentally acceptable shall refer to the quality of being re-usable,\nbiodegradable or compostable, recyclable and not toxic or hazardous to the\nenvironment;\n8.\nGeneration shall refer to the act or process of producing solid waste;\n9.\nGenerator shall refer to a person, natural or juridical, who last uses a material\nand makes it available for disposal or recycling;\n10. Hazardous waste shall refer to solid waste management or combination of\nsolid waste which because of its quantity, concentration or physical, chemical or\ninfectious characteristics may:\n(1) cause, or significantly contribute to an increase in mortality or an increase in\nserious irreversible, or incapacitating reversible, illness; or\n(2) pose a substantial present or potential hazard to human health or the\nenvironment when improperly treated, stored, transported, or disposed of, or\notherwise managed;\n11. Materials recovery facility - includes a solid waste transfer station or sorting\nstation, drop-off center, a composting facility, and a recycling facility;\n12. Municipal waste shall refer to wastes produced from activities within local\ngovernment units which include a combination of domestic, commercial,\ninstitutional and industrial wastes and street litters;\n13. Opportunity to recycle shall refer to the act of providing a place for collecting\nsource-separated recyclable material, located either at a disposal site or at\nanother location more convenient to the population being served, and collection\nat least once a month of source-separated recyclable material from collection\nservice customers and to providing a public education and promotion program\nthat gives notice to each person of the opportunity to recycle and encourage\nsource separation of recyclable material;\n14. Person(s) shall refer to any being, natural or judicial, susceptible of rights and\nobligations, or of being the subject of legal relations;\n\n--- PDF PAGE 72 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 68\n15. Post-consumer material shall refer only to those materials or products\ngenerated by a business or consumer which have served their intended end\nuse, and which have been separated or diverted from solid waste for the\npurpose of being collected, processed and used as a raw material in the\nmanufacturing of recycled product, excluding materials and by-products\ngenerated from, and by-products generated from, and commonly used within an\noriginal manufacturing process, such as mill scrap;\n16. Receptacles shall refer to individual containers used for the source separation\nand the collection of recyclable materials;\n17. Recovered material shall refer to material and by products that have been\nrecovered or diverted from solid waste for the purpose of being collected,\nprocessed and used as a raw material in the manufacture of a recycled product;\n18. Recyclable material shall refer to any waste material retrieved from the waste\nstream and free from contamination that can still be converted into suitable\nbeneficial use or for other purposes, including, but not limited to, newspaper,\nferrous scrap metal, non-ferrous scrap metal, used oil, corrugated cardboard,\naluminum, glass, office paper, tin cans and other materials as may be\ndetermined by the Commission;\n19. Recycled material shall refer to post-consumer material that has been recycled\nand returned to the economy;\n20. Recycling shall refer to the treating of used or waste materials through a\nprocess of making them suitable for beneficial use and for other purposes, and\nincludes any process by which solid waste materials are transformed into new\nproducts in such a manner that the original product may lose their identity, and\nwhich may be used as raw materials for the production of other goods or\nservices: Provided, That the collection, segregation and re-use of previously\nused packaging material shall be deemed recycling under this Act;\n21. Resource conversation shall refer to the reduction of the amount of solid\nwaste that are generated or the reduction of overall resource consumption, and\nutilization of recovered resources;\n22. Resources recovery shall refer to the collection, extraction or recovery of\nrecyclable materials from the waste stream for the purpose of recycling,\ngenerating energy or producing a product suitable for beneficial use: Provided,\nThat such resource recovery facilities exclude incineration;\n23. Re-use shall refer to the process of recovering materials intended for the same\nor different purpose without the alteration of physical and chemical\ncharacteristics;\n24. Schedule of Compliance shall refer to an enforceable sequence of actions or\noperations to be accomplished within a stipulated time frame leading to\ncompliance with a limitation, prohibition or standard set forth in this Act or any\nrule of regulation issued pursuant thereto;\n25. Secretary landfill shall refer to the Secretary of the Department of Environment\nand Natural Resources;\n26. Segregation shall refer to a solid waste management practice of separating\ndifferent materials found in solid waste in order to promote recycling and re-use\nof resources and to reduce the volume of waste for collection and disposal;\n27. Segregation at source shall refer to a solid waste management practice of\nseparating, at the point of origin, different materials found in solid waste in order\nto promote recycling and re-use of resources and to reduce the volume of\nwaste for collection and disposal;\n\n--- PDF PAGE 73 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 69\n28. Solid waste shall refer to all discarded household, commercial waste, non-\nhazardous institutional and industrial waste, street sweepings, construction\ndebris, agricultural waste, and other non-hazardous/non-toxic solid waste.\n\nUnless specifically noted otherwise, the term “solid waste” as used in this Act\nshall not include:\n(1) Waste identified or listed as hazardous waste of a solid, liquid, contained\ngaseous or semisolid form which may cause or contribute to an increase in\nmortality or in serious or incapacitating reversible illness, or acute/chronic effect\non the health of persons and other organisms;\n(2) Infectious waste from hospitals such as equipment, instruments, utensils,\nand fomites of a disposable nature from patients who are suspected to have or\nhave been diagnosed as having communicable diseases and must therefore be\nisolated as required by public health agencies, laboratory wastes such as\npathological specimens (i.e. all tissues, specimens of blood elements, excreta,\nand secretions obtained from patients or laboratory animals) and disposable\nfomites that may harbor or transmit pathogenic organisms, and surgical\noperating room pathologic materials from outpatient areas and emergency\nrooms; and\n(3) Waste resulting from mining activities, including contaminated soil and\ndebris.\n29. Solid waste management shall refer to the discipline associated with the\ncontrol of generation, storage, collection, transfer and transport, processing,\nand disposal of solid wastes in a manner that is in accord with the best\nprinciples of public health, economics, engineering, conservation, aesthetics,\nand other environmental considerations, and that is also responsive to public\nattitudes;\n30. Solid waste management facility shall refer to any resource recovery system\nor component thereof; any system, program, or facility for resource\nconservation; any facility for the collection, source separation, storage,\ntransportation, transfer, processing, treatment, or disposal of solid waste;\n31. Source reduction shall refer to the reduction of solid waste before it enters the\nsolid waste stream by methods such as product design, materials substitution,\nmaterials re-use and packaging restrictions;\n32. Source separation shall refer to the sorting of solid waste into some or all of its\ncomponent parts at the point of generation;\n33. Special wastes shall refer to household hazardous wastes such as paints,\nthinners, household batteries, lead-acid batteries, spray canisters and the like.\nThese include wastes from residential and commercial sources that comprise of\nbulky wastes, consumer electronics, and white goods, yard wastes that are\ncollected separately, batteries, oil, and tires. These wastes are usually handled\nseparately from other residential and commercial wastes;\n34. Storage shall refer to the interim containment of solid wastes after generation\nand prior to collection for ultimate recovery or disposal;\n35. Transfer stations shall refer to those facilities utilized to receive solid wastes,\ntemporarily store, separate, convert, or otherwise process the materials in the\nsolid wastes, or to transfer the solid wastes directly from smaller to larger\nvehicles for transport. This term does not include any of the following:\n(1) a facility whose principal function is to receive, store, separate, convert or\notherwise process in accordance with national minimum standards, manure;\n\n--- PDF PAGE 74 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 70\n(2) a facility, whose principal function is to receive, store, convert, or otherwise\nprocess wastes which have already been separated for re-use and are intended\nfor disposals, and\n(3) the operations premises of a duly licensed solid waste handling operator\nwho receives, stores, transfers, or otherwise processes wastes as an activity\nincidental to the conduct of a refuse collection and disposal business.\n36. Waste diversion shall refer to activities which reduce or eliminate the amount\nof solid waste from waste disposal facilities;\n37. White goods shall refer to large worn-out or broken household, commercial,\nand industrial appliances such as stoves, refrigerators, dishwashers, and\nclothes washers and dryers collected separately. White goods are usually\ndismantled for the recovery of specific materials (e.g., copper, aluminum, etc.);\n38. Yard waste shall refer to wood, small or chipped branches, leaves, grass\nclippings, garden debris, vegetable residue that is recognized as part of a plant\nor vegetable and other materials identified by the Commission.\n\n--- PDF PAGE 75 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 71",
