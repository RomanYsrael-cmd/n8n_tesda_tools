lifications should\npossess the following requirements:\n• Able to read and write\n• Not physically impaired for the course\n\n--- PDF PAGE 66 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 62\n3.4 LIST OF TOOL, EQUIPMENT AND MATERIALS\nGARBAGE COLLECTION NC I\n\nRecommended list of tools, equipment and materials for the training of a\nmaximum of 25 trainees for GARBAGE COLLECTION NC I are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n25\nDust Masks\n1 unit\nFire Extinguishers\n5\nMarking Pens\n25\nBoots (rubber)\n1\nLaptop\n2\nWhite\nBoards/Blackboard\n5\npairs\nSteel soled/toe\nshoe\n1\nProjector Screen\n3\nWhiteboard\nMarkers/Chalk\n25\nGoggles (clear)\n1\nLCD\n2\nWhiteboard Erasers\n25\nHardhats\n1\nSound System\n(microphone,\nspeakers, amplifier)\n1 roll\nBrown paper (Easel\nSheet)\n25\nWaste picking\nsticks\n\n2 rolls 1\" masking tape\n25\nSacks (plastic\ngarbage sack)\n\n8\nShovels\n\n1 set\nWaste classification\ngallery\n25\nGloves (rubber\npadded)\n\nTraining Materials:\n\n• Republic Act 9003 –\nEcological Solid Waste\nManagement Act of 2000\n• Republic Act 6969 – Toxic\nand Hazardous Waste\n\n• Handouts\n\n• Audio visual materials on\ncompactors\n\n• Company Work Process &\nStandards\n\n• Municipality National Solid\nWaste Management\nCommission Resolution\nNo., series no.\n\n•\nMock-up of a garbage truck (2.5 m x 2m)\n\n--- PDF PAGE 67 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 63\n\n3.5 TRAINING FACILITIES\n\nThe areas indicated here are indicative for a class size of 25 trainees. For a\nsmaller class size, they may be reduced, provided that there should be at least 1.0\nsq. m. or more space per trainee.\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in\nSq. Meters\nLecture Area\n8 x 5 m\n40 sq. meter\n40 sq. meter\nLearning Resource Area\n8x5 m\n40 sq. meter\n40 sq. meter\nFacilities/Equipment/Circulation\nArea\n\n30 sq. meter\n\nTotal workshop\narea\n110 sq. meter\n*The training provider may partner with a solid waste company for access to\ndumpsite facilities and garbage truck equipment.\n\n3.6 TRAINER’S QUALIFICATIONS FOR GARBAGE COLLECTION NC I\n\nTRAINER QUALIFICATION\n•\nMust be a holder of NTTC Level I in SPOTTER NC II;\n•\nMust be able to communicate in Filipino/vernacular;\n•\nMust have at least 2 years relevant waste management industry experience\npreferably in waste collection and hauling and/or;\n•\nMust have attended relevant training and seminars on waste collection and\nhauling.\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\nall units of competency.\n\n The result of the institutional assessment may be considered as evidence for\nthe assessment for national certification. As a matter of policy, graduates of\nprograms registered with TESDA under these training regulations are required\nto undergo mandatory national competency assessment upon completion of\nthe program.\n\n--- PDF PAGE 68 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 64"
