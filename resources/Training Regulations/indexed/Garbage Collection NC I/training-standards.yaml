      "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: GARBAGE COLLECTION NC Level: NC I\n\nNominal Training Duration: 28 Hours (Basic Competencies)\n16 Hours (Common Competencies)\n60 Hours (Core Competencies)\n-------------\n104 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of\nPalero in accordance to industry standards. It covers the basic, common, and core\ncompetencies on preparing the activities before garbage collection and actual\ngarbage collection.\n\nThe training center has the option to partner with an existing waste haulers or\nsolid waste contractors for facilities and equipment to be used in training and\nassessment.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 49 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 45\n\nBASIC COMPETENCIES\n(28 HRS.)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\nPractical Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow\nroutinely\nspeaking &\nmessage\n•\nParts of a speech\n•\nParts of a sentence\n•\nKinds of sentence\n\n•\nExercise Conciseness in\nreceiving and clarifying\nmessages/ information/\ncommunication\n• Group\ndiscussion\n• Interaction\n• Reportorial\n• Modular\n• Interviews/\n• Questioning\n• Practical/\n• Performance\nTest\n• Observation\n4 Hours\n\n1.2 Perform\nwork duties\nfollowing\nwritten\nnotices\n•\nKnowledge of\norganizational\npolicies/guidelines in\nregard to processing\ninternal/external\ninformation.\n\n•\nWork practices in handling\ncommunications\n\n•\nCommunication\nprocesses\n\n•\nReceiving and clarifying\ncommunications,\nmessages and\ninformation.\n\n•\nRecording messages\n\n•\nPractice Accuracy in\nfollowing written/ oral\ninstruction/ information\n•\nPractice written and oral\ncommunication skills\n•\nCase Study in handling\nwritten communication\n•\nPracti