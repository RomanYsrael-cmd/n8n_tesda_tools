  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider\nwhen designing training programs for GARBAGE COLLECTIONNC I.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification and\ninstitutional assessment.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: GARBAGE COLLECTION NC Level: NC I\n\nNominal Training Duration: 28 Hours (Basic Competencies)\n16 Hours (Common Competencies)\n60 Hours (Core Competencies)\n-------------\n104 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of\nPalero in accordance to industry standards. It covers the basic, common, and core\ncompetencies on preparing the activities before garbage collection and actual\ngarbage collection.\n\nThe training center has the option to partner with an existing waste haulers or\nsolid waste contractors for facilities and equipment to be used in training and\nassessment.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 49 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 45\n\nBASIC COMPETENCIES\n(28 HRS.)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\nPractical Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow\nroutinely\nspeaking &\nmessage\n•\nParts of a speech\n•\nParts of a sentence\n•\nKinds of sentence\n\n•\nExercise Conciseness in\nreceiving and clarifying\nmessages/ information/\ncommunication\n• Group\ndiscussion\n• Interaction\n• Reportorial\n• Modular\n• Interviews/\n• Questioning\n• Practical/\n• Performance\nTest\n• Observation\n4 Hours\n\n1.2 Perform\nwork duties\nfollowing\nwritten\nnotices\n•\nKnowledge of\norganizational\npolicies/guidelines in\nregard to processing\ninternal/external\ninformation.\n\n•\nWork practices in handling\ncommunications\n\n•\nCommunication\nprocesses\n\n•\nReceiving and clarifying\ncommunications,\nmessages and\ninformation.\n\n•\nRecording messages\n\n•\nPractice Accuracy in\nfollowing written/ oral\ninstruction/ information\n•\nPractice written and oral\ncommunication skills\n•\nCase Study in handling\nwritten communication\n•\nPractice relaying/\ndisseminating messages/\ninformation\n•\nAnalyze different\nmessages\n\n• Lecture/\n• Discussion\n• Demonstration\n• Case Study\n\n• Written\n• Practical\n• Written\n• Demonstration\n\n4 Hours\n\n--- PDF PAGE 50 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 46\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\nPractical Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Work with\nothers\n2.1 Develop\neffective\nworkplace\nrelationship\n\n•\nJob description and\nemployment arrangement.\n•\nOrganization’s policy\nrelevant to work role\n•\nTeam structure\n•\nSupervision and\naccountability\nrequirements including\nOHS\n•\nCode of conduct\n•\nAssisting a colleague\n•\nOpen communication\nchannels\n•\nAcknowledging\nsatisfactory/unsatisfactory\nperformance\n•\nFormal/informal\nperformance appraisal\n•\nObtaining feedback from\nsupervisor and colleagues\nand clients\n•\nPersonal reflective\nbehavior strategies\n•\nRoutine organization\nmethods for monitoring\nservice delivery\n•\nEthical sentences\n•\nPractice cooperation and\ngood relationship\n•\nTeam structuring\n•\nPractice OHS Code\n•\nRoutine task analysis\n•\nPractice communication\nskills in requesting advice,\nreceiving feedback\n•\nWork effectively with team\n•\nApply personal decision\nand organized work\npriorities\n•\nApply appropriate\ntechnology for a given\ntask.\n•\nPractice monitoring of\nservice delivery\n•\nGroup\ndiscussion\n•\n Role play\n•\nInteraction\n\n•\nInterviews/\n•\nOral\nQuestioning\n•\nWritten Test\n•\nDemonstration\n•\nObservation\n4 Hours\n\n--- PDF PAGE 51 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 47\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\nPractical Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n2.2 Contribute\nto work\ngroup\nactivities\n•\nExplaining /clarifying.\n•\nHelping colleagues\n•\nProviding encouragement\n•\nUndertaking extra task if\nnecessary\n•\nGoals, objectives, plans\nsystem and process\n•\nLegal and organizational\npolicy/guidelines and\nrequirements\n•\nDefine resources\nparameters\n•\nQuality and continues\nimprovement processes\nand standard\n•\nClarifying the\norganization’s preferred\ntask completion methods\n•\nOpen communication\n•\nEncouraging colleagues\n•\nAcknowledging\nsatisfactory/unsatisfactory\nperformance\n•\nWorkplace hazards, risks\nand control\n•\nApplication of personal\nattribute towards\norganization policies and\nwork procedures\n•\nWriting of simple\ninstruction or work plan for\na particular routine or task\n•\nApplication of planning\nskills in organizing and\nprioritizing work\n•\nApply particular skills in\nselected technology\nappropriate in performing\ntask\n•\nPractice proper personal\nrelationship\n•\nExercise personal\nrelationship with others\nthru social, cultural and\nethnic background.\n•\nGroup\ndiscussion\n•\n Role play\n•\nInteraction\n\n•\nInterviews/\n•\nOral\nQuestioning\n•\nWritten Test\n•\nDemonstration\n•\nObservation\n4 Hours\n\n--- PDF PAGE 52 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 48\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\nPractical Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3. Demonstrate\nwork values\n3.1 Define the\npurpose of\nwork\n\n•\nPurpose of Work\n•\nBenefits gained out of\nwork\n•\nSimulate work and\nworking condition\n•\nGroup\ndiscussion\n•\nInteraction\n•\nDemonstration\n•\nObservation\n•\nInt