ms, and surgical\noperating room pathologic materials from outpatient areas and emergency\nrooms; and\n(3) Waste resulting from mining activities, including contaminated soil and\ndebris.\n29. Solid waste management shall refer to the discipline associated with the\ncontrol of generation, storage, collection, transfer and transport, processing,\nand disposal of solid wastes in a manner that is in accord with the best\nprinciples of public health, economics, engineering, conservation, aesthetics,\nand other environmental considerations, and that is also responsive to public\nattitudes;\n30. Solid waste management facility shall refer to any resource recovery system\nor component thereof; any system, program, or facility for resource\nconservation; any facility for the collection, source separation, storage,\ntransportation, transfer, processing, treatment, or disposal of solid waste;\n31. Source reduction shall refer to the reduction of solid waste before it enters the\nsolid waste stream by methods such as product design, materials substitution,\nmaterials re-use and packaging restrictions;\n32. Source separation shall refer to the sorting of solid waste into some or all of its\ncomponent parts at the point of generation;\n33. Special wastes shall refer to household hazardous wastes such as paints,\nthinners, household batteries, lead-acid batteries, spray canisters and the like.\nThese include wastes from residential and commercial sources that comprise of\nbulky wastes, consumer electronics, and white goods, yard wastes that are\ncollected separately, batteries, oil, and tires. These wastes are usually handled\nseparately from other residential and commercial wastes;\n34. Storage shall refer to the interim containment of solid wastes after generation\nand prior to collection for ultimate recovery or disposal;\n35. Transfer stations shall refer to those facilities utilized to receive solid wastes,\ntemporarily store, separate, convert, or otherwise process the materials in the\nsolid wastes, or to transfer the solid wastes directly from smaller to larger\nvehicles for transport. This term does not include any of the following:\n(1) a facility whose principal function is to receive, store, separate, convert or\notherwise process in accordance with national minimum standards, manure;\n\n--- PDF PAGE 74 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 70\n(2) a facility, whose principal function is to receive, store, convert, or otherwise\nprocess wastes which have already been separated for re-use and are intended\nfor disposals, and\n(3) the operations premises of a duly licensed solid waste handling operator\nwho receives, stores, transfers, or otherwise processes wastes as an activity\nincidental to the conduct of a refuse collection and disposal business.\n36. Waste diversion shall refer to activities which reduce or eliminate the amount\nof solid waste from waste disposal facilities;\n37. White goods shall refer to large worn-out or broken household, commercial,\nand industrial appliances such as stoves, refrigerators, dishwashers, and\nclothes washers and dryers collected separately. White goods are usually\ndismantled for the recovery of specific materials (e.g., copper, aluminum, etc.);\n38. Yard waste shall refer to wood, small or chipped branches, leaves, grass\nclippings, garden debris, vegetable residue that is recognized as part of a plant\nor vegetable and other materials identified by the Commission.\n\n--- PDF PAGE 75 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 71",
