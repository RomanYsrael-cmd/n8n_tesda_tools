  "source_text": "SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to an\nemployable unit(s) of competency in partial fulfillment of the requirements of the\nnational qualification.\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has\ndemonstrated competence in all the units of competency that\ncomprise the Training Regulations for Garbage Collection NC I as\nfollows:\n\nBASIC COMPETENCIES\nReceive and respond to workplace communication\nWork with others\nDemonstrate work values\nPractice housekeeping procedures\nCOMMON COMPETENCIES\nDevelop and update industry knowledge\nPerform workplace security and safety practices\nMaintain environmental health and awareness in the\nwork place\nCORE COMPETENCIES\nPrepare for garbage collection activities\nCollect garbage\n\n4.1.2 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.1.3 The following are qualified to apply for assessment and certification:\n\n- Graduates of training programs related to waste management and\ncollection\n- Experienced, currently employed workers (wage employed or self-\nemployed)\n- Experienced unemployed workers seeking enhanced skills and\nknowledge\n\n--- PDF PAGE 69 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 65\n\n4.1.4 Reassessment is allowed only after one month from the date of\nassessment. Reassessment for a National Certificate shall be done only\non the task/s that the candidate did not successfully achieve.\n\n4.1.5 A candidate who fails the assessment for two (2) consecutive times will\nbe required to go through a refresher course before taking another\nassessment.\n\n4.1.6 Only certified individuals in this Qualification may be nominated by the\nindustry sector for accreditation as competency assessor.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate\nand the assessor determine what evidence is available, where\ngaps exist, including readiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior `\n4.2.2 Accredited Assessment Center. Only Assessment Center\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA\nto manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 70 ---\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 66\n"
