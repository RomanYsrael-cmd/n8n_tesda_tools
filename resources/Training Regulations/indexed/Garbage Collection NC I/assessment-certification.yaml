ose of recycling such materials; 3. Collection shall refer to the act of removing solid waste from the source or from a communal storage point; 4. Consumer electronics shall refer to special waste that includes worn-out, broken, and other discarded items such as radios, stereos, and TV sets; 5. Department shall refer to the Department of Environment and Natural Resources; 6. Ecological solid waste management shall refer to the systematic administration of activities which provide for segregation at source, segregated transportation, storage, transfer, processing, treatment, and disposal of solid waste and all other waste management activities which do not harm the environment; 7. Environmentally acceptable shall refer to the quality of being re-usable, biodegradable or compostable, recyclable and not toxic or hazardous to the environment; 8. Generation shall refer to the act or process of producing solid waste; 9. Generator shall refer to a person, natural or juridical, who last uses a material and makes it available for disposal or recycling;"
