      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence in all the units of competency that comprise the Training Regulations for Garbage Collection NC I as follows: BASIC COMPETENCIES Receive and respond to workplace communication Work with others Demonstrate work values Practice housekeeping procedures COMMON COMPETENCIES Develop and update industry knowledge Perform workplace security and safety practices Maintain environmental health and awareness in the work place CORE COMPETENCIES Prepare for garbage collection activities Collect garbage 4.1.2 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.3 The following are qualified to apply for assessment and certification: - Graduates of training programs related to waste management and collection - Experienced, currently employed workers (wage employed or self- employed) - Experienced unemployed workers seeking enhanced skills and knowledge 4.1.4 Reassessment is allowed only after one month from the date of assessment. Reassessment for a National Certificate shall be done only on the task/s that the candidate did not successfully achieve. 4.1.5 A candidate who fails the assessment for two (2) consecutive times will be required to go through a refresher course before taking another assessment. 4.1.6 Only certified individuals in this Qualification may be nominated by the industry sector for accreditation as competency assessor."
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior ` 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification."
