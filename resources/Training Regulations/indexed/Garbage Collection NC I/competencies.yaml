 and equipment\n2.3 The proper checking of equipment and tools before use\n2.4 Safe posture including sitting, standing, bending\n2.5 Manual handling of waste including lifting, transferring and\nstowing the waste in proper order\n2.6 Emergency fire and accident\n2.7 Hazard identification and control\n2.8 Proper procedures in handling waste accidents and/or\nspillage\n\n4 Breaches\nMay include but is not limited to:\n3.1 Continued use and/or operation of wrong and/or\nmalfunctioning tools and equipment\n3.2 Presence of un-qualified and/or untrained persons within\nthe work area\n3.3 Unsafe containment of waste.\n3.4 Improper system of operations in collection and hauling of\nwaste\n3.5 Lack of suitable signage when required\n3.6 Lack of training on health and safety issues\n3.7 Unsafe work practices\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 31\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Complied with industry and company practices and procedures\n1.2 Used interactive communication with others\n1.3 Complied with workplace safety, security and hygiene practices\n1.4 Identified faults and problems and the necessary corrective\naction\n1.5 Maintained environmental health in the workplace\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Procedures manual on safety, security, health and emergency\n2.2 Availability of tools, equipment, supplies and materials\n2.3 Availability of PPEs\n\n3. Methods of\nassessment\nCompetency may be assessed through:\n3.1 Written examination\n3.2 Practical demonstration\n3.3 Interview\n\n4. Context of\nassessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 32\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPREPARE FOR GARBAGE COLLECTION ACTIVITIES\nUNIT CODE\n:"
