        "source_text": "--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08 \nTR GARBAGE COLLECTION NC I (Amended)       Promulgated June 16, 2015                                  Page   21 \n \n \nUNIT OF COMPETENCY :    PERFORM WORKPLACE SECURITY AND SAFETY PRACTICES \n \nUNIT CODE \n: \nUTL9611202 \n \nUNIT DESCRIPTOR \n:    This unit of competency deals with the knowledge, skills and \nattitudes in following health, safety and security practices.  It \nincludes dealing with emergency situations and maintaining safe \npersonal standards. \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Follow workplace \nprocedures for \nhealth, safety and \nsecurity practices \n1.1 Correct health, \nsafety and \nsecurity \nprocedures are \nfollowed in line \nwith legislation \nand enterprise \nprocedures \n1.2 Breaches of \nhealth, safety and \nsecurity \nprocedures are \nidentified and \nreported in line \nwith enterprise \nprocedure. \n1.3 Suspicious \nbehavior or \nunusual \noccurrences are \nreported in line \nwith enterprise \nprocedure. \n1.1 Correct health,        \n      safety and security   \n      procedures \n1.2 Breaches of health,  \n      safety and security  \n      procedures \n1.3 Different types of  \n      suspicions  \n      procedures \n1.4 Verbal and written   \n    communication \n1.5 Interaction with  \n   co-workers \n1.6 Work hazards \n1.7 Company policies \n1.8 Safety and health  \n consciousness \n1.9 Resourcefulness \n1.10 Diligence \n1.11 Time  \n   consciousness \n1.12Cost  \n   consciousness \n1.13Personal  \n  integrity in  \n  doing routine   \n  practices \n 1.14Perseverance in   \nroutine works \n 1.15Ability to work  \n  with others              \n  harmoniously\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08 \nTR GARBAGE COLLECTION NC I (Amended)       Promulgated June 16, 2015                                  Page   22 \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED KNOWLEDGE \nREQUIRED \nSKILLS \n2. Deal with \nemergency \nsituations \n2.1 Emergency and \npotential \nemergency \nsituations are \nrecognized and \nappropriate \nactions are taken \nwithin individual’s \nscope of \nresponsibility. \n2.2 Emergency \nprocedures are \nfollowed in line \nwith enterprise \nprocedures. \n2.3 Assistance is \nsought from \ncolleagues to \nresolve or \nrespond to \nemergency \nsituation. \n2.4 Details of \nemergency \nsituations are \nreported in line \nwith enterprise \nprocedures. \n2.1 Emergency and potential  \n      emergency situation \n2.2 Emergency procedures \n2.3 Verbal and written   \n      Communication \n2.4 Interaction with co-workers \n2.5 Reporting details of   \n      emergency situations \n2.6 Personal Safety  \n      Equipment \n2.7 Work hazards \n2.8 Characteristics of garbage \n2.9 Collection and handling  \n       procedures \n2.10Company policy \n2.11Safety and health  \n   Consciousness \n2.12 Resourcefulness \n2.13 Diligence \n2.14 Time consciousness \n2.15 Cost consciousness \n2.16 Personal integrity in   \n        doing routine practices \n2.17 Perseverance in routine  \n        works \n2.18 Ability to work with others   \n         harmoniously \n2.1 Recognizing \nand taking \nappropriate \nactions on \nemergency and \npotential \nemergency \nsituations  \n2.2 Following \nemergency \nprocedures \n2.3 Reporting of \ndetails of \nemergency \nsituations \n2.4 Practicing \ncommunication \nskills\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08 \nTR GARBAGE COLLECTION NC I (Amended)       Promulgated June 16, 2015                                  Page   23 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3. Maintain safe \npersonal standards \n3.1 Safe personal \nstandards are \nidentified and \nfollowed in line \nwith enterprise \nrequirements. \n3.1Safe personal  \n standards \n3.2 Appropriate  \n procedures \n 3.3 Verbal and   \n      written  \n      communication \n3.4 Interaction   \n with co-workers \n 3.5 Company Policy \n3.6 Safety and health  \n  consciousness \n3.7 Resourcefulness \n3.8 Diligence \n3.9 Time \n     consciousness \n3.10 Cost  \n   consciousness \n3.11Personal   \n  integrity in doing   \n  routine practices \n3.12 Perseverance in    \n       routine works \n3.13 Ability to work  \n   with others  \n   harmoniously \n3.1 Identifying and \nfollowing safe \npersonal standards  \n3.2 Practicing \ncommunication \nskills\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08 \nTR GARBAGE COLLECTION NC I (Amended)       Promulgated June 16, 2015                                  Page   24 \n \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Health, Safety and Security \nProcedures \nMay include but are not limited to: \n1.1 Use of personal protective clothing and equipment \n1.2 Safe posture including sitting, standing, bending \n1.3 Manual handling including lifting, transferring \n1.4 Safe handling of chemicals, poisons and dangerous \nmaterials \n1.5 Ergonomically sound furniture and work stations \n1.6 Emergency fire and accident \n1.7 Hazard identification and control \n1.8 Security of documents, cash, equipment, people \n1.9   Key control systems \n \n2. Breaches of Procedure \nMay include but are not limited to: \n2.1 Loss of keys \n2.2 Strange or suspicious persons \n2.3 Broken or malfunctioning equipment \n2.4 Loss of property, goods or materials \n2.5 Damaged property or fittings \n2.6 Lack of suitable signage when required \n2.7 Lack of training on health and safety issues \n2.8 Unsafe work practices \n \n3,  Emergency \nMay include but is not limited to: \n3.1 Personal injuries \n3.2 Fire \n3.3 Electrocution \n3.4 Natural calamity i.e. earthquake/flood \n3.1 Criminal acts i.e. robbery \n3.2 Bomb\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08 \nTR GARBAGE COLLECTION NC I (Amended)       Promulgated June 16, 2015                                  Page   25 \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Complied with industry practices and procedures \n1.2 Used interactive communication with others \n1.3 Complied with workplace safety, security and hygiene practices \n1.4 Identified faults and problems and the necessary corrective \naction \n1.5 Promoted public relation among others \n1.6 Complied with quality standards \n1.7 Responded to emergency situations in line with enterprise \nguidelines \n1.8 Complied with proper dress code \n \n2. Resource   \nImplications \nThe following resources should be provided: \n2.1 Procedures manual on safety, security, health and emergency \n2.2 Availability of tools, equipment, supplies and materials \n \n3. Methods of \nassessment \nCompetency may be assessed through: \n3.1 Written examination \n3.2 Practical demonstration \n3.3 Interview \n \n4. Context of \nassessment \n4.1 Competency may be assessed in the work place or in a \nsimulated work place setting.\n",
