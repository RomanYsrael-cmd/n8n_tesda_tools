        "source_text": "500311101\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required to\nreceive, respond and act on verbal and written communication.\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Follow\nroutine\nspoken\nmessages\n1.1 Required information\nis gathered by\nlistening attentively\nand correctly\ninterpreting or\nunderstanding\ninformation/\ninstructions\n1.2 Instructions/\ninformation are\nproperly recorded\n1.3 Instructions are acted\nupon immediately in\naccordance with\ninformation received\n1.4 Clarification is sought\nfrom workplace\nsupervisor on all\noccasions when any\ninstruction/information\nis not clear\n1.1 Knowledge of\norganizational\npolicies/guidelines\nwith regards to\nprocessing\ninternal/external\ninformation\n1.2 Ethical work\npractices in\nhandling\ncommunications\n1.3 Communication\nprocess\n1.1 Conciseness in\nreceiving and\nclarifying\nmessages/inform\nation/communica\ntion\n1.2 Accuracy in\nrecording\nmessages/inform\nation\n1.3 Communication\nskills\n2. Perform\nworkplace\nduties\nfollowing\nwritten\nnotices\n2.1 Written notices and\ninstructions are read\nand interpreted\ncorrectly in\naccordance with\norganizational\nguidelines\n2.2 Routine written\ninstruction are\nfollowed in sequence\n2.3 Feedback is given to\nworkplace supervisor\nbased on the\ninstructions/informatio\nn received\n2.1 Knowledge of\norganizational\npolicies/guidelines\nin regard to\nprocessing\ninternal/external\ninformation\n2.2 Ethical work\npractices in\nhandling\ncommunications\n2.3 Communication\nprocess\n2.1 Conciseness in\nreceiving and\nclarifying\nmessages/infor\nmation/communi\ncation\n2.2 Accuracy in\nrecording\nmessages/\ninformation\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nMay include:\n1.1. Handwritten and printed material\n1.2. Internal memos\n1.3. External communications\n1.4. Electronic mail\n1.5. Briefing notes\n1.6. General correspondence\n1.7. Marketing materials\n1.8. Journal articles\n\n2. Organizational\nGuidelines\nMay include:\n2.1. Information documentation procedures\n2.2. Company policies and procedures\n2.3. Organization manuals\n2.4. Service manual\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 4\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of organizational procedures for\nhandling verbal and written communications\n1.2\nReceived and acted on verbal messages and instructions\n1.3\nDemonstrated competency in recording instructions/information\n2. Resource Implications\nThe following resources should be provided:\n2.1 Pens\n2.2 Note pads\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation\n3.2 Oral interview\n3.3 Written Evaluation\n3.4 Third Party Report\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 5\n\nUNIT OF COMPETENCY :\nWORK WITH OTHERS (Collaborate with others in work group\nactivities)\nUNIT CODE\n:"
