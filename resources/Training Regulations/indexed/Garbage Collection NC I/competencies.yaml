        "source_text": "UTL9611203\n\nUNIT DESCRIPTOR\n: This unit of competency deals with the knowledge, skills and\nattitudes in maintaining environmental health and awareness in the\nworkplace. It includes dealing with environmental risks and\nhazards, emergency situations and maintaining self-personal living\nstandards.\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify\nenvironmental risks\nand hazards in the\nwork place\n\n1.1 Proper\nprocedures are\nfollowed in line\nwith company and\nenterprise\nprocedures\n1.2 Breaches of\nenvironmental\nsafety and security\nprocedures are\nidentified and\nreported in line\nwith enterprise\nprocedure.\n1.3 Suspicious\nworkplace\nconditions or\nunusual\noccurrences that\nare potential\nenvironmental\nrisks or hazards\nare reported in\nline with\nenterprise\nprocedure.\n1.1 Correct waste\ncollection and\nhauling procedures\nto assure\nenvironmental\nhealth and safety\n1.2 Identification of\ntypes of breaches\nof health, safety\nand operational\nprocedures that\nendanger\nenvironmental\nhealth\n1.3 Types of wastes\nand their\ncharacteristics and\neffects on the\nenvironment\n1.4 Ways that different\nwaste affect the\nenvironment\n1.5 Reasons for\ncorrect/proper use\nof PPEs.\n\n1.6 Verbal and written\ncommunication\n1.7 Interaction with\nclients\n1.8 Personal Safety\n Equipment\n1.9 Work hazards\n1.10Occupational\n safety and health\n standards\n1.1 Identifying\nenvironmental\nrisks and hazards\nin the work place\n1.2 Following the\nproper\nprocedures\n1.3 Identifying and\nreporting\nbreaches of\nenvironmental\nsafety and\nsecurity\nprocedures\n1.4 Reporting\nsuspicious\nworkplace\nconditions or\nunusual\noccurrences that\nare potential risks\nof hazards\n1.5 Practicing\ncommunication\nskills\n1.6 Writing report\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 27\n\n1.11