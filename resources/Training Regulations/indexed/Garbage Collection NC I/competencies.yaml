  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThese guidelines are set to provide the Technical Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for GARBAGE COLLECTION NC I.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nRECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION (Communicate clearly)\nUNIT CODE\n:\n500311101\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required to\nreceive, respond and act on verbal and written communication.\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Follow\nroutine\nspoken\nmessages\n1.1 Required information\nis gathered by\nlistening attentively\nand correctly\ninterpreting or\nunderstanding\ninformation/\ninstructions\n1.2 Instructions/\ninformation are\nproperly recorded\n1.3 Instructions are acted\nupon immediately in\naccordance with\ninformation received\n1.4 Clarification is sought\nfrom workplace\nsupervisor on all\noccasions when any\ninstruction/information\nis not clear\n1.1 Knowledge of\norganizational\npolicies/guidelines\nwith regards to\nprocessing\ninternal/external\ninformation\n1.2 Ethical work\npractices in\nhandling\ncommunications\n1.3 Communication\nprocess\n1.1 Conciseness in\nreceiving and\nclarifying\nmessages/inform\nation/communica\ntion\n1.2 Accuracy in\nrecording\nmessages/inform\nation\n1.3 Communication\nskills\n2. Perform\nworkplace\nduties\nfollowing\nwritten\nnotices\n2.1 Written notices and\ninstructions are read\nand interpreted\ncorrectly in\naccordance with\norganizational\nguidelines\n2.2 Routine written\ninstruction are\nfollowed in sequence\n2.3 Feedback is given to\nworkplace supervisor\nbased on the\ninstructions/informatio\nn received\n2.1 Knowledge of\norganizational\npolicies/guidelines\nin regard to\nprocessing\ninternal/external\ninformation\n2.2 Ethical work\npractices in\nhandling\ncommunications\n2.3 Communication\nprocess\n2.1 Conciseness in\nreceiving and\nclarifying\nmessages/infor\nmation/communi\ncation\n2.2 Accuracy in\nrecording\nmessages/\ninformation\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nMay include:\n1.1. Handwritten and printed material\n1.2. Internal memos\n1.3. External communications\n1.4. Electronic mail\n1.5. Briefing notes\n1.6. General correspondence\n1.7. Marketing materials\n1.8. Journal articles\n\n2. Organizational\nGuidelines\nMay include:\n2.1. Information documentation procedures\n2.2. Company policies and procedures\n2.3. Organization manuals\n2.4. Service manual\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 4\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of organizational procedures for\nhandling verbal and written communications\n1.2\nReceived and acted on verbal messages and instructions\n1.3\nDemonstrated competency in recording instructions/information\n2. Resource Implications\nThe following resources should be provided:\n2.1 Pens\n2.2 Note pads\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation\n3.2 Oral interview\n3.3 Written Evaluation\n3.4 Third Party Report\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 5\n\nUNIT OF COMPETENCY :\nWORK WITH OTHERS (Collaborate with others in work group\nactivities)\nUNIT CODE\n:\n500311102\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required to\ndevelop workplace relationship and contribute in workplace\nactivities.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop\neffective\nworkplace\nrelationship\n1.1 Duties and\nresponsibilities are\ndone in a positive\nmanner to promote\ncooperation and good\nrelationship\n1.2 Assistance is sought\nfrom workgroup\nwhen difficulties arise\nand addressed\nthrough discussions\n1.3 Feedback provided\nby others in the team\nis encouraged,\nacknowledged and\nacted upon\n1.4 Differences in\npersonal values and\nbeliefs are respected\nand acknowledged in\nthe development\n1.1 Reasons why\ncooperation and\ngood relationships\nare important\n1.2 Knowledge of the\norganization’s\npolicies, plans and\nprocedures\n1.3 Understanding how\nto elicit and\ninterpret feedback\n1.4 Knowledge of\nworkgroup\nmember’s\nresponsibilities and\nduties\n1.5 Importance of\ndemonstrating\nrespect and\nempathy in dealings\nwith colleagues\n1.6 Understanding of\nhow to identify and\nprioritize personal\ndevelopment\nopportunities and\noptions\n1.1 Ability to read\nand understand\nthe\norganization’s\npolicies and work\nprocedures\n1.2 Write simple\ninstructions for\nparticular routine\ntasks\n1.3 Interpret\ninformation\ngained from\ncorrespondence\n1.4 Communication\nskills to request\nadvice, receive\nfeedback and\nwork with a team\n1.5 Planning skills to\norganized work\npriorities and\narrangement\n1.6 Technology skills\nincluding the\nability to select\nand use\ntechnology\nappropriate to a\ntask\n1.7 Ability to relate to\npeople from a\nrange of social,\ncultural and\nethnic\nbackgrounds.\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 6\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Contribute to\nwork group\nactivities\n2.1 Support is provided\nto team members to\nensure workgroup\ngoals are met\n2.2 Constructive\ncontributions to\nworkgroup goals and\ntasks are made\naccording to\norganizational\nrequirements\n2.3 Information relevant\nto work is shared with\nteam members to\nensure designated\ngoals are met\n2.1 Reasons why\ncooperation and\ngood relationships\nare important\n2.2 Knowledge of the\norganization’s\npolicies, plans and\nprocedures\n2.3 Understanding how\nto elicit and\ninterpret feedback\n2.4 Knowledge of\nworkgroup\nmember’s\nresponsibilities and\nduties\n2.5 Importance of\ndemonstrating\nrespect and\nempathy in\ndealings with\ncolleagues\n2.6 Understanding of\nhow to identify and\nprioritize personal\ndevelopment\nopportunities and\noptions\n2.1 Ability to read\nand understand\nthe\norganization’s\npolicies and\nwork procedures\n2.2 Write simple\ninstructions for\nparticular routine\ntasks\n2.3 Interpret\ninformation\ngained from\ncorrespondence\n2.4 Communication\nskills to request\nadvice, receive\nfeedback and\nwork with a team\n2.5 Planning skills to\norganized work\npriorities and\narrangement\n2.6 Technology\nskills including\nthe ability to\nselect and use\ntechnology\nappropriate to a\ntask\n2.7 Ability to relate\nto people from a\nrange of social,\ncultural and\nethnic\nbackgrounds.\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 7\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements including OHS\n1.5 Code of conduct\n\n2. Work group\n2.1 Supervisor or manager\n2.2 Peers/work colleagues\n2.3 Other members of the organization\n\n3. Feedback on\nperformance\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues and clients\n3.3 Personal, reflective behavior strategies\n3.4 Routine