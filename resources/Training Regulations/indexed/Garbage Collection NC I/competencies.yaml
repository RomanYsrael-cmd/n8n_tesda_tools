iligence\n\n1.19 Time-\n consciousness\n1.20 Cost –\n consciousness\n1.21 Personal integrity\nin doing routine\npractices\n1.22 Perseverance in\nroutine work\n2. Receive\ninstructions\nand determine\ntools for waste\ncollection\n1.1 Types of garbage\nto be collected are\ndetermined in\naccordance with\ninstructions from\nthe Supervisor.\n1.2 Entry point of\ngarbage in the\ntruck is ensured to\nbe free of\nobstructions or\nobstacles.\n1.3 Space allocation is\nprovided in\naccordance with\nthe expected type\nof garbage to be\ncollected.\n1.4 Locking\nmechanism of\ntailgates is\nchecked and\nproperly secured in\naccordance with\nestablished safety\nprocedures.\n2.5 Accessories to be\nused for garbage\ncollection are\nchecked before\ndeparture from the\nmotor pool.\n2.1 Types of\n garbage to be\n collected\n2.2 Entry points of\n garbage truck\n2.3 Space\n allocation versus\n expected type of\n garbage to be\n collected\n2.4 Type of truck to\n be used for\n collection\n 2.5 Accessories to\n be used for\n garbage\n collection\n2.6 Report forms\n2.7 Job Order\n2.8 Schedule of\n collection route\n2.9 Work load\n schedules\n2.10 Truck\n assignment\n2.11 Written and\n verbal\n communications\n2.12 Personal Safety\n Equipment\n2.13 Work hazards\n2.14 Characteristics\n of garbage\n2.15 Garbage\n collection and\n handling\n2.1 Classifying\ngarbage\n2.2 Familiarizing the\ndifferent types of\naccessories and\nusing these\naccessories\n2.3 Familiarizing the\ndifferent of trucks\nused and\noperating its\nlocking mechanism\n2.4 Proper handling,\nstorage and\nupkeep of the\naccessories\n2.5 Following written\nand verbal\ninstructions\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 34\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n procedure\n2.16 Different types\n of tools and\n accessories and\n their uses\n2.17 Safety-and-\n health\