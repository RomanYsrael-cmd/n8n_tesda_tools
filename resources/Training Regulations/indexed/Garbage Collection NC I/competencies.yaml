        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of assigned collection area and\nschedules\n1.2 Prepared for garbage collection and determined tools and\naccessories for garbage collection\n1.3 Prepared PPE to be used\n\n2. Resource\nImplications\nThe following resources should be provided:\n1.1 Workplace or assessment location\n1.2 Personal Protective Equipment\n1.3 Sample route and schedule\n1.4 Garbage truck\n1.5 Garbage materials\n1.6 Garbage collection tools/accessories\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Direct Observation with questioning\n3.2 Demonstration with oral questioning\n3.3 Interview\n3.4 Third party report\n\n4. Context of\nAssessment\n4.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting environment.\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 37\n\nUNIT OF COMPETENCY :\nCOLLECT GARBAGE\n\nUNIT CODE\n:"
