        "source_text": "UTL961301\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, attitudes required for\nactivities to be undertaken before the collection of garbage.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Acquire area\nassignment\nand schedule\n\n1.1 Garbage\ncollection routes\nand schedules are\nsecured from the\nsupervisor in\naccordance with\nthe ordinance/s of\nthe local\ngovernment unit\n(LGU) or\ncollection/hauling\ncontracts with\nprivate entities.\n1.2 Work hazards in\nthe collection area\nare determined as\nper instructions\nfrom the\nsupervisor and\ninformation\nprovided by the\nLGU or private\nentity.\n1.3 New area for\ngarbage collection\nis ascertained and\nfamiliarized\n1.1 Garbage collection\n routes and\n schedules\n1.2 Collection and\n hauling contracts\n1.3 Work hazards in\nthe collection area\n1.4 Work schedule\n1.5 Collection route\n protocol in area\n1.6 Accomplishing\n report forms\n1.7 Verbal and\n written\n communication\n1.8 Personal Safety\n Equipment\n1.9 Work hazards\n1.10 Characteristics\n of garbage\n1.11 Collection and\n Handling\n procedures\n1.12 Occupational\nsafety and health\nstandards relating\nto solid-waste\nmanagement\n1.13 RA 9003\n1.14 RA 6969\n1.15 Local\n ordinances on\n solid waste\n management\n1.16 Safety-and-\n Health\n consciousness\n1.2 Following garbage\ncollection routes\nand schedules\n1.3 Time management\nskills\n1.4 Determining and\nfollowing LGU\nordinances\n1.5 Identifying hazards\nand its location\n1.6 Interpreting and\nfollowing written\nand verbal\ninstructions\n1.7 Accomplishing\nreport forms\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 33\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.17 Resourcefulness\n1.18 Diligence\n\n1.19 Time-\n consciousness\n1.20 Cost –\n consciousness\n1.21 Personal integrity\nin doing routine\npractices\n1.22 Perseverance in\nroutine work\n2. Receive\ninstructions\nand determine\ntools for waste\ncollection\n1.1 Types of garbage\nto be collected are\ndetermined in\naccordance with\ninstructions from\nthe Supervisor.\n1.2 Entry point of\ngarbage in the\ntruck is ensured to\nbe free of\nobstructions or\nobstacles.\n1.3 Space allocation is\nprovided in\naccordance with\nthe expected type\nof garbage to be\ncollected.\n1.4 Locking\nmechanism of\ntailgates is\nchecked and\nproperly secured in\naccordance with\nestablished safety\nprocedures.\n2.5 Accessories to be\nused for garbage\ncollection are\nchecked before\ndeparture from the\nmotor pool.\n2.1 Types of\n garbage to be\n collected\n2.2 Entry points of\n garbage truck\n2.3 Space\n allocation versus\n expected type of\n garbage to be\n collected\n2.4 Type of truck to\n be used for\n collection\n 2.5 Accessories to\n be used for\n garbage\n collection\n2.6 Report forms\n2.7 Job Order\n2.8 Schedule of\n collection route\n2.9 Work load\n schedules\n2.10 Truck\n assignment\n2.11 Written and\n verbal\n communications\n2.12 Personal Safety\n Equipment\n2.13 Work hazards\n2.14 Characteristics\n of garbage\n2.15 Garbage\n collection and\n handling\n2.1 Classifying\ngarbage\n2.2 Familiarizing the\ndifferent types of\naccessories and\nusing these\naccessories\n2.3 Familiarizing the\ndifferent of trucks\nused and\noperating its\nlocking mechanism\n2.4 Proper handling,\nstorage and\nupkeep of the\naccessories\n2.5 Following written\nand verbal\ninstructions\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 34\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n procedure\n2.16 Different types\n of tools and\n accessories and\n their uses\n2.17 Safety-and-\n health\n consciousness\n2.18 Resourcefulness\n2.19 Diligence\n2.20 Time-\n consciousness\n2.21 Cost –\n consciousness\n2.22 Personal\n integrity\n in doing routine\n practices\n2.23 Perseverance in\n routine works\n\n3. Prepare\npersonal\nprotective\nequipment to\nbe used\n3.1 Appropriate\npersonal\nprotective\nequipment (PPE)\nto be used is\nidentified in\naccordance with\nOSH standards.\n3.2 PPE is checked in\naccordance with\nwork instructions\nand/or\nmanufacturer’s\nspecifications.\n3.3 Defective or\ninadequate PPE\nare\nreturned/replaced\nin accordance with\nenterprise\nprocedures\n3.1Types and uses\n of PPEs\n3.2 Request forms\n3.3 Proper use of\n PPEs in\n accordance with\n manufacturers\n specifications\n3.4 OSHC guidelines\n on PPEs\n3.5Handling, storage\n and maintenance of\n PPEs\n3.6 Safety-and-health\n consciousness\n3.7 Resourcefulness\n3.8 Diligence\n3.9 Time\n consciousness\n3.10 Cost\n consciousness\n3.11 Personal integrity\n in doing routine\n practices\n3.12 Perseverance in\n routine works\n\n3.1 Using PPEs based\non manufacturer’s\nspecifications.\n3.1 Proper handling,\nstorage and\nupkeep of PPEs\n3.3 Following written\nand verbal\ninstructions\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 35\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hazards\nMay include:\n1.1 Flood prone area\n1.2 Stray animals\n1.3 Road improvement activities\n1.4 Slippery areas or soft soil\n1.5 Areas prone to landslides or cave-ins\n\n2. Types of garbage\n\nMay include:\n2.1 Recyclable\n2.2 Biodegradable\n2.3 Residual\n2.4 Special Wastes\n\n3. Accessories\n\nMay include:\n3.1 Tarp or similar material for cover while traveling\n3.2 Receptacle for wet wastes\n3.3 Shovel\n3.4 Broom\n3.5 Heavy duty dust pan\n3.6 Working clothes/uniforms\n\n4. Personal Protective\nEquipment\nMay include:\n4.1 Gloves\n4.2 Masks\n4.3 Safety shoes/boots\n4.4 Raincoats\n4.5 Safety goggles\n4.6 Reflectorized vests\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 36\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of assigned collection area and\nschedules\n1.2 Prepared for garbage collection and determined tools and\naccessories for garbage collection\n1.3 Prepared PPE to be used\n\n2. Resource\nImplications\nThe following resources should be provided:\n1.1 Workplace or assessment location\n1.2 Personal Protective Equipment\n1.3 Sample route and schedule\n1.4 Garbage truck\n1.5 Garbage materials\n1.6 Garbage collection tools/accessories\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Direct Observation with questioning\n3.2 Demonstration with oral questioning\n3.3 Interview\n3.4 Third party report\n\n4. Context of\nAssessment\n4.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting environment.\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 37\n\nUNIT OF COMPETENCY :\nCOLLECT GARBAGE\n\nUNIT CODE\n:"
