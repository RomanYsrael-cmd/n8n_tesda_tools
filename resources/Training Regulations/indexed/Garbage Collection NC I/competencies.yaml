  "source_section_text": "SECTION 1 GARBAGE COLLECTION NC I QUALIFICATION\n\nThe GARBAGE COLLECTION NC I Qualification covers competencies relating to the\ncollection, transport and dumping of garbage particularly municipal/city waste covered by RA\n9003.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUnit Code\nBASIC COMPETENCIES\n500311101 Receive and respond to workplace communication\n500311102 Work with others\n500311103 Demonstrate work values\n500311104 Practice basic housekeeping procedures\n\nUNIT CODE\nCOMMON COMPETENCIES\n\nUTL9611201\nDevelop and update industry knowledge\nUTL9611202\nPerform workplace security and safety practices\nUTL9611203\nMaintain environmental health and awareness in the workplace\n\nUNIT CODE\nCORE COMPETENCIES\nUTL961301\nPrepare for garbage collection activities\nUTL961302\nCollect garbage\n\nA person who has achieved this Qualification is competent to be:\n\nPalero\n\n--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 2"
}
