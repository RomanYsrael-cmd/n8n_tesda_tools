        "source_text": "UTL961302\n\nUNIT DESCRIPTOR\n:\nThis unit covers skills and attitude required collect garbage,\nparticularly municipal/city wastes covered by RA 9003. It does not\ninclude wastes and special/toxic wastes covered under the\nSanitation Code and RA 6969.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1 Collect\ngarbage at\ndesignated\narea\n\n1.1 Work Assignment\nForm (WAF) is\nsecured in\naccordance with\nestablished\nprocedures\n1.2 Garbage collection\nis performed in\naccordance with\nspecified\nprocedures and\nguidelines.\n1.3 Appropriate PPE is\nworn and in\naccordance with\nestablished\nprocedures.\n1.4 Occupational health\nand safety (OHS)\npractices are\nobserved based on\nspecified\nprocedures and\nguidelines.\n1.1 Company\n regulations in using\n garbage truck, PPE\n and accessories\n1.2 Procedure and\n guidelines in\n garbage collection\n and handling\n wastes\n1.3 OHS procedures\n and guidelines\n1.4 Work schedule\n1.5 Collection route\n1.6 Protocol in area\n1.7 Accomplishing\n report forms\n1.8 Incident reporting\n1.9 Verbal and\n written\n communication\n1.10 Interaction with\n clients\n1.11 Personal\n Protective\n Equipment\n1.12 Work hazards\n1.13 Characteristics of\n garbage\n1.14 Collection and\n handling\n procedures\n1.15 Occupational\n safety and health\n standards\n1.16 RA 9003\n1.17 RA 6969\n1.18 Local ordinances\n1.19 Different tools\n1.1 Securing job\norder\n1.2 Following\nprocedures in\ncollection of\ngarbage\n1.3 Following\nwritten and\nverbal\ninstructions\n1.4 Communication\nskills\n1.5 Following the\nOHS procedure\nand guidelines\n1.6 Writing reports\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\nTR GARBAGE COLLECTION NC I (Amended) Promulgated June 16, 2015 Page 38\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n and accessories\n1.20Safety-and-he