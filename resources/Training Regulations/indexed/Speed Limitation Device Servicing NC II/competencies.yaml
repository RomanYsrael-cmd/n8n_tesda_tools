ent \ncondition \n3.6  Practicing safety \n3.7  Practicing 5S \nand 3Rs\n\n--- PDF PAGE 57 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        53 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Equipment \nMay include: \n1.1   Lifter (Two Post Lifter / Four Post Lifter/ Scissor \ntype) \n1.2   Crocodile Jack \n1.3   Jack Stand \n1.4   Air Compressor \n1.5   Oil drain \n2.  Workshop facilities \nMay include: \n2.1   Service Stall / Working Bay / Workshop areas for \nservicing/repairing light and/or heavy vehicle and/or \nplant transmissions and/or outdoor power \nequipment \n2.2   Overhauling Room \n2.3   Electrical / Air-con Room \n2.4   Inspection Area \n2.5   Open workshop/garage and enclosed, ventilated \noffice area \n2.6   Car wash area \n2.7   Other variables may include workshop with: \n2.7.1   Mess hall \n2.7.2   Wash room \n2.7.3   Comfort room \n2.7.4   Storage Room \n2.7.5   Training Room \n3.  Manuals \nMay include: \n3.1   Vehicle/plant manufacturer specifications \n3.2   Company operating procedures \n3.3   Industry/Workplace Codes of Practice \n3.4   Product manufacturer specifications \n3.5   Industry Occupational Health &Safety \n3.6   Equipment Operation Guidelines \n3.7   Service/workshop/repair manual \n4.  PPEs \nMay include: \n4.1   Gloves \n4.2   Apron \n4.3   Goggles \n4.4   Safety shoes \n4.5   Uniforms \n4.6   Cap \n4.7   Safety helmet \n5.  Minor repairs \nMay include: \n5.1   Lubrication \n5.2   Bolt tightening \n5.3   Worn-out parts replacement\n\n--- PDF PAGE 58 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        54 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Performed pre-operation activities \n1.2   Used facilities and equipment \n1.3   Conducted post-operation activities \n1.4   Applied safety practices and good housekeeping \n1.5   Disposed wastes \n2. 