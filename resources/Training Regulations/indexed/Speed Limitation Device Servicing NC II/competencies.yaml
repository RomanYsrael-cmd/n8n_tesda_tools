        "source_text": "ALT723382\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitude\nneeded in conducting visual inspection of vehicle,\nmaking\nrecommendation\nbased\non\nfindings,\ndetermining tapping points and location for Speed\nLimitation Device, preparing installation plan, and\nperforming documentation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Check vehicle\n1.1 Job Order Form is\nsecured from\nimmediate superior\nbased on standard\noperating\nprocedure.\n1.2 Electrical wiring\ndiagram is\ninterpreted in\nreference with\nvehicle workshop\nmanual.\n1.3 Visual inspection\nis conducted\nfollowing standard\noperating\nprocedure.\n1.4 Findings are\nreported to\nimmediate superior\nbased on standard\noperating\nprocedure.\n1.5 Recommenda-\ntions are made\nbased on findings.\n1.6 Safety practices are\napplied following\nOccupational\nSafety and Health\nStandards (OSHS).\n1.1 Job order\n1.2 Interpretation of\nElectrical Wiring\nDiagram\n1.3 Procedure in\nchecking vehicles\n1.4 Visual inspection\nof vehicle\n1.5 Types of Speed\nLimitation Device\n1.6 RA 10916 Road\nSpeed Limiter Act\nof 2016\n1.7 Occupational\nSafety and Health\nStandards\n(OSHS)\n1.8 RA 4136 Chapter\n4 Article 1\n(Exempted\nvehicle from\nSpeed Limitation\nDevice module\ninstallation)\n1.9 Procedure in\nreporting findings\n1.10 Speedometer\n1.11 Communication\n1.12 Basic\nmathematics\n1.1 Securing job\norder\n1.2 Interpreting\nElectrical Wiring\nDiagram\n1.3 Conducting\nvisual inspection\n1.4 Securing\ninspection report\n1.5 Reporting\nfindings\n1.6 Making\nrecommend-\ndations\n1.7 Applying safety\npractices\n1.8 Communication\nskills\n1.9 Presentation\nskills\n1.10 Reading\nspeedometer\n\n--- PDF PAGE 68 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 64\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Plan installation\n2.1 Installation manual\nis interpreted based\non work\nrequirements.\n2.2 Electrical wiring\ndiagram is used in\nplanning\ninstallation.\n2.3 Tapping points are\ndetermined based\non vehicle\nmanufacturer’s\nmanual and\nrecommendation of\nimmediate superior.\n2.4 Location for Speed\nLimitation Device is\ndetermined based\non industry\ncriteria.\n2.5 Location for\nplacement of\nsolenoid valve is\ndetermined based\non the installation\nmanual.\n2.6 Tools, materials,\nequipment, and\nparts are selected\nbased on standard\noperating\nprocedure.\n2.1 Work\nrequirements\n2.2 Electrical Wiring\nDiagram\n2.3 Tapping points\n2.4 Types of Speed\nLimitation Device\n2.5 Location for\nSpeed Limitation\nDevice\n2.6 Industry criteria\n2.7 Vehicle workshop\nmanual\n2.8 Type of vehicle\n2.8.1 Electrical\nthrottle\nlinkage\n2.8.2 Mechanical\nthrottle\n2.9 Installation\nmanual\n2.10 Tools, materials,\nand equipment\nand their\nfunctions\n2.11 Mensuration\n2.12 Calculation\n2.13 3Rs\n2.1 Interpreting\ninstallation\nmanual\n2.2 Using Electrical\nWiring Diagram\n2.3 Determining\ntapping points\n2.4 Determining\nlocations for\nSpeed Limitation\nDevice and\nsolenoid valve\n2.5 Selecting tools,\nmaterials and\nequipment\n2.6 Selecting Speed\nLimitation Device\nKit\n2.7 Use measuring\ndevices\n2.8 Identifying\nvehicle type\n2.9 Use installation\nmanual\n2.10 Mensuration\nskills\n2.11 Calculation skills\n2.12 Practicing 3Rs\n3. Perform\ndocumentation\n3.1 Findings and\nrecommendations\nare prepared based\non standard\noperating\nprocedure.\n3.2 Installation plan is\nprepared based on\nstandard operating\nprocedure.\n3.3 Documentations\nare submitted for\narchiving following\nworkplace\nprocedures.\n3.4 Required output is\ncompleted as\n3.1 Accomplishment\nof Job order form\n3.2 Preparation of\nInstallation plan\n3.3 Documentation\n3.3.1 Photo\n3.4 Preparation of\ninstallation report\n3.5 Procedure in\naccomplishing\nwarranty card\n3.6 Mensuration\n3.7 Calculation\n3.8 Presentation of\nreport\n3.9 IRR of RA 10916\nRule 4-\n3.1 Preparing\nfindings and\nrecommen-\ndations\n3.2 Preparing\ninstallation plan\n3.3 Performing photo\ndocumentation\n3.4 Accomplishing\nwarranty card\n3.5 Preparing\ninstallation report\n3.6 Submitting\ndocumentations\n3.7 Presentation\nskills\n\n--- PDF PAGE 69 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 65\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nspecified by\nimmediate superior\nbased on work.\nEnforcement and\nadjudication\n3.10 Factors affecting\nproductivity\n3.11 Productivity work\nmeasurements\n3.12 Ways of\nimproving\nproductivity\n3.13 Adherence to\nwork\nrequirements\n3.8 Mensuration and\ncalculation skills\n3.9 Following IRR of\nRA 10916 Rule\n4- Enforcement\nand adjudication\n\n--- PDF PAGE 70 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 66\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Job Order Form\nJob order form may include:\n1.1 Vehicle details\n1.1.1 Model\n1.1.2 Mileage\n1.2 Inspection of unit\n1.3 Type of Speed Limitation Device to be installed\n1.4 Set limit to a specific speed according to law and\nclient\n1.5 Set limit to a specific speed\n1.6 Attached Electrical Wiring Diagram (EWD)\n2. Visual inspection\nVisual inspection may include:\n2.1 Inspection of loose connections\n2.2 Inspection burned wires\n2.3 Inspection working condition of speedometer\n2.4 Inspection fuel leaks\n2.5 Inspection size of fuel line (mechanical)\n2.6 Inspection size of wires\n3. Recommendations\nRecommendations may include:\n3.1 Change speed limiter module\n3.2 Replacement of fittings\n3.3 Replacement of sockets\n3.4 Relocation of tapping points electronic throttle\nlinkage\n3.5 Rejection of request due to defective vehicle wiring\ncondition\n4. Industry criteria\nIndustry criteria may include:\n4.1 Beside computer box\n4.2 Secured from unauthorized person\n4.3 Protected from elements\n5. Documentations\nDocumentations refers to:\n5.1 Findings and recommendations\n5.2 Installation plan\n5.3 Installation and Repair report\n6. Tools, materials,\nequipment, and parts\nTools, materials, equipment, and parts may include:\n\n6.1 Tools\n6.1.1 Measuring tape\n6.1.2 Screw driver\n\n6.2 Materials\n6.2.1 Soldering lead\n6.2.2 Soldering paste\n6.2.3 Liquid gasket\n6.2.4 T-fittings\n6.2.5 Corrugated plastic hose\n6.2.6 Fuel line hose\n6.2.7 Stainless ear clamp\n\n--- PDF PAGE 71 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 67\nVARIABLE\nRANGE\n6.2.8 Electrical tape\n6.2.9 Teflon tape\n6.2.10 Autowire\n6.2.11 Soldering iron\n6.2.12 Terminal eye\n6.2.13 Garbage bin\n6.2.14 Rags\n6.2.15 PPEs:\n6.2.15.1 Safety shoes\n6.2.15.2 Hard hat\n6.2.15.3 Arm sleeves\n6.2.15.4 Safety gloves\n6.2.15.5 Safety googles\n6.2.15.6 Reflectorized vest\n6.2.16 Sample Job Order Form\n6.2.17 Installation manual\n\n6.3 Equipment\n6.3.1 Training vehicle\n\n6.4 Parts\n6.4.1 Speed Limitation Device Kit for Electronic\nThrottle Linkage\n6.4.1.1 Speed Limitation Device\n6.4.1.2 Wire for front engine\n6.4.1.3 Cable ties\n6.4.1.4 Sealing wire and lead seal\n6.4.2 Speed Limitation Device Kit for Mechanical\nThrottle Linkage\n6.4.2.1 Speed Limitation Device\n6.4.2.2 Wire for front engine\n6.4.2.3 Cable ties\n6.4.2.4 Sealing wire and lead seal\n6.4.2.5 Solenoid valve and fittings\n6.4.3 Gear box sensor\n6.4.4 Speed sensor\n7. Vehicle manufacturer’s\nmanual\nMay include:\n7.1 Repair manual\n7.2 Workshop manual\n7.3 Electrical wiring diagram\n7.4 Speed Limitation Device Wiring Diagram\n\n--- PDF PAGE 72 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 68\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Checked vehicle\n1.1.1 Interpreted Electrical Wiring Diagram.\n1.1.2 Conducted visual inspection.\n1.1.3 Made recommendations.\n1.1.4 Applied safety practices.\n1.2 Planned installation\n1.2.1 Interpreted installation manual.\n1.2.2 Used electrical wiring diagram.\n1.2.3 Determined tapping points.\n1.2.4 Determined location for Speed Limitation Device.\n1.2.5 Determined location for placement of solenoid\nvalve.\n1.2.6 Selected tools, materials, equipment and parts.\n1.3 Performed documentation\n1.3.1 Prepared Installation/ Repair report.\n1.3.2 Submitted documentations for archiving.\n1.3.3 Completed required output.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Tools, materials & equipment relevant to perform required\ntasks\n2.3 Manufacturer’s repair manual\n2.4 PPEs\n2.5 Training vehicle\n2.6 First-aid kit\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral questioning\n3.2 Written exam\n3.3 Direct Observation\n4. Context for\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 73 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 69\n\nUNIT OF COMPETENCY\n:\nPERFORM INSTALLATION OF SPEED\nLIMITATION DEVICE\n\nUNIT CODE\n:"
