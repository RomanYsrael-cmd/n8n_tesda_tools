  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core\nunits of competency required in SPEED LIMITATION DEVICE SERVICING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nPARTICIPATE IN WORKPLACE\nCOMMUNICATION\n\nUNIT CODE\n:\n400311210\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information\nin response to workplace requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and convey\nworkplace\ninformation\n1.1 Specific and\nrelevant information\nis accessed from\nappropriate\nsources.\n1.2 Effective\nquestioning, active\nlistening and\nspeaking skills are\nused to gather and\nconvey information.\n1.3 Appropriate\nmedium is used to\ntransfer information\nand ideas.\n1.4 Appropriate non-\nverbal\ncommunication is\nused.\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and\nfollowed.\n1.6 Defined workplace\nprocedures for the\nlocation and\nstorage of\ninformation are\nused.\n1.1 Effective verbal\nand nonverbal\ncommunication\n1.2 Different modes\nof communication\n1.3 Medium of\ncommunication in\nthe workplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n1.8 Workplace\netiquette\n1.1 Following simple\nspoken language\n1.2 Performing\nroutine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participating in\nworkplace\nmeetings and\ndiscussions\n1.4 Preparing work-\nrelated\ndocuments\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n1.6 Relating/\nInteracting with\npeople of various\nlevels in the\nworkplace\n1.7 Gathering and\nproviding basic\ninformation in\nresponse to\nworkplace\nrequirements\n\n--- PDF PAGE 7 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 3\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.7 Personal interaction\nis carried out clearly\nand concisely.\n1.8 Basic business\nwriting skills\n1.9 Interpersonal\nskills in the\nworkplace\n1.10 Active-listening\nskills\n2. Perform duties\nfollowing\nworkplace\ninstructions\n2.1 Written notices and\ninstructions are\nread and\ninterpreted in\naccordance with\norganizational\nguidelines.\n2.2 Routine written\ninstruction are\nfollowed based on\nestablished\nprocedures.\n2.3 Feedback is given\nto workplace\nsupervisor based\ninstructions/\ninformation\nreceived.\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner.\n2.5 Where necessary,\nclarifications about\nroutine workplace\nprocedures and\nmatters concerning\nconditions of\nemployment are\nsought and asked\nfrom appropriate\nsources.\n2.6 Meetings outcomes\nare interpreted and\nimplemented.\n2.1 Effective verbal\nand non-verbal\ncommunication\n2.2 Different modes\nof communication\n2.3 Medium of\ncommunication in\nthe workplace\n2.4 Organizational/\nWorkplace\npolicies\n2.5 Communication\nprocedures and\nsystems\n2.6 Lines of\ncommunication\n2.7 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\n2.8 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n2.9 Workplace\netiquette\n2.1 Following simple\nspoken\ninstructions\n2.2 Performing\nroutine\nworkplace duties\nfollowing simple\nwritten notices\n2.3 Participating in\nworkplace\nmeetings and\ndiscussions\n2.4 Completing\nwork- related\ndocuments\n2.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n2.6 Relating/\nResponding to\npeople of various\nlevels in the\nworkplace\n2.7 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n2.8 Basic\nquestioning/\nquerying\n2.9 Skills in reading\nfor information\n2.10 Skills in locating\n3. Complete relevant\nwork-related\ndocuments\n3.1 Range of forms\nrelating to\nconditions of\nemployment are\ncompleted\n3.1 Effective verbal\nand non-verbal\ncommunication\n3.2 Different modes\nof communication\n3.1 Completing\nwork-related\ndocuments\n3.2 Applying\noperations of\n\n--- PDF PAGE 8 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 4\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\naccurately and\nlegibly.\n3.2 Workplace data is\nrecorded on\nstandard workplace\nforms and\ndocuments.\n3.3 Errors in recording\ninformation on\nforms/ documents\nare identified and\nacted upon.\n3.4 Reporting\nrequirements to\nsupervisor are\ncompleted\naccording to\norganizational\nguidelines.\n3.3 Workplace forms\nand documents\n3.4 Organizational/\nWorkplace\npolicies\n3.5 Communication\nprocedures and\nsystems\n3.6 Technology\nrelevant to the\nenterprise and the\nindividual’s work\nresponsibilities\naddition,\nsubtraction,\ndivision and\nmultiplication\n3.3 Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nrequirements\n3.4 Effective record\nkeeping skills\n\n--- PDF PAGE 9 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 5\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\nMay include:\n1.1 Team members\n1.2 Supervisor/Department Head\n1.3 Suppliers\n1.4 Trade personnel\n1.5 Local government\n1.6 Industry bodies\n2. Medium\nMay include:\n2.1 Memorandum\n2.2 Circular\n2.3 Notice\n2.4 Information dissemination\n2.5 Follow-up or verbal instructions\n2.6 Face-to-face communication\n2.7 Electronic media (disk files, cyberspace)\n3. Storage\nMay include:\n3.1 Manual filing system\n3.2 Computer-based filing system\n4. Workplace interactions\nMay include:\n4.1 Face-to-face\n4.2 Telephone\n4.3 Electronic and two-way radio\n4.4 Written including electronic means, memos,\ninstruction and forms\n4.5 Non-verbal including gestures, signals, signs and\ndiagrams\n5. Forms\nMay include:\n5.1 HR/Personnel forms, telephone message forms,\nsafety reports\n\n--- PDF PAGE 10 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 6\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared written communication following standard format\nof the organization\n1.2 Accessed information using workplace communication\nequipment/systems\n1.3 Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4 Conveyed information effectively adopting formal or\ninformal communication\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Fax machine\n2.2 Telephone\n2.3 Notebook\n2.4 Writing materials\n2.5 Computer with Internet connection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Interview\n3.3 Written test\n3.4 Third-party report\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited institution\n\n--- PDF PAGE 11 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 7\n\nUNIT OF COMPETENCY\n:\nWORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n:\n400311211\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nto identify one’s roles and responsibilities as a\nmember of a team.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Describe team role\nand scope\n1.1 The role and\nobjective of the\nteam is identified\nfrom available\nsources of\ninformation.\n1.2 Team parameters,\nreporting\nrelationships and\nresponsibilities are\nidentified from team\ndiscussions and\nappropriate external\nsources.\n1.1 Group structure\n1.2 Group\ndevelopment\n1.3 Sources of\ninformation\n1.1 Communicating\nwith others,\nappropriately\nconsistent with\nthe culture of the\nworkplace\n1.2 Developing ways\nin improving\nwork structure\nand performing\nrespective roles\nin the group or\norganization\n2. Identify one’s role\nand responsibility\nwithin a team\n2.1 Individual roles and\nresponsibilities\nwithin the team\nenvironment are\nidentified.\n2.2 Roles and\nobjectives of the\nteam is identified\nfrom available\nsources of\ninformation.\n2.3 Team parameters,\nreporting\nrelationships and\nresponsibilities are\nidentified based on\nteam discussions\nand appropriate\nexternal sources.\n2.1 Team roles and\nobjectives\n2.2 Team structure\nand parameters\n2.3 Team\ndevelopment\n2.4 Sources of\ninformation\n2.1 Communicating\nwith others,\nappropriately\nconsistent with\nthe culture of the\nworkplace\n2.2 Developing ways\nin improving\nwork structure\nand performing\nrespective roles\nin the group or\norganization\n3. Work as a team\nmember\n3.1 Effective and\nappropriate forms\nof communications\nare used and\ninteractions\nundertaken with\n3.1 Communication\nProcess\n3.2 Workplace\ncommunication\nprotocol\n3.1 Communicating\nappropriately,\nconsistent with\nthe culture of the\nworkplace\n\n--- PDF PAGE 12 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 8\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nteam members\nbased on company\npractices.\n3.2 Effective and\nappropriate\ncontributions made\nto complement\nteam activities and\nobjectives, based\non workplace\ncontext.\n3.3 Protocols in\nreporting are\nobserved based on\nstandard company\npractices.\n3.4 Contribute to the\ndevelopment of\nteam work plans\nbased on an\nunderstanding of\nteam’s role and\nobjectives.\n3.3 Team planning\nand decision\nmaking\n3.4 Team thinking\n3.5 Team roles\n3.6 Process of team\ndevelopment\n3.7 Workplace\ncontext\n3.2 Interacting\neffectively with\nothers\n3.3 Deciding as an\nindividual and as\na group using\ngroup think\nstrategies and\ntechniques\n3.4 Contributing to\nResolution of\nissues and\nconcerns\n\n--- PDF PAGE 13 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\nMay include:\n1.1 Work activities in a team environment with\nenterprise or specific sector\n1.2 Limited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n2. Sources of information\nMay include:\n2.1 Standard operating and/or other workplace\nprocedures\n2.2 Job procedures\n2.3 Machine/equipment manufacturer’s specifications\nand instructions\n2.4 Organizational or external personnel\n2.5 Client/supplier instructions\n2.6 Quality standards\n2.7 OHS and environmental standards\n3. Workplace context\nMay include:\n3.1 Work procedures and practices\n3.2 Conditions of work environments\n3.3 Legislation and industrial agreements\n3.4 Standard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5 Safety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 14 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 10\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Worked in a team to complete workplace activity\n1.2 Worked effectively with others\n1.3 Conveyed information in written or oral form\n1.4 Selected and used appropriate workplace language\n1.5 Followed designated work plan for the job\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2 Materials relevant to the proposed activity or tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Role play involving the participation of individual member\nto the attainment of organizational goal\n3.2 Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n3.3 Socio-drama and socio-metric methods\n3.4 Sensitivity techniques\n3.5 Written Test\n4. Context for\nAssessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 15 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 11\n\nUNIT OF COMPETENCY\n:\nSOLVE/ADDRESS GENERAL WORKPLACE\nPROBLEMS\n\nUNIT CODE\n:\n400311212\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to apply problem-solving techniques to\ndetermine the origin of problems and plan for their\nresolution. It also includes addressing procedural\nproblems through documentation, and referral.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify routine\nproblems\n1.1 Routine problems\nor procedural\nproblem areas are\nidentified.\n1.2 Problems to be\ninvestigated are\ndefined and\ndetermined.\n1.3 Current conditions\nof the problem are\nidentified and\ndocumented.\n1.1 Current industry\nhardware and\nsoftware products\nand services\n1.2 Industry\nmaintenance,\nservice and\nhelpdesk\npractices,\nprocesses and\nprocedures\n1.3 Industry standard\ndiagnostic tools\n1.4 Malfunctions and\nresolutions\n1.1 Identifying\ncurrent industry\nhardware and\nsoftware\nproducts and\nservices\n1.2 Identifying\ncurrent industry\nmaintenance,\nservices and\nhelpdesk\npractices,\nprocesses and\nprocedures.\n1.3 Identifying\ncurrent industry\nstandard\ndiagnostic tools\n1.4 Describing\ncommon\nmalfunctions and\nresolutions.\n1.5 Determining the\nroot cause of a\nroutine\nmalfunction\n2. Look for solutions\nto routine\nproblems\n2.1 Potential solutions\nto problem are\nidentified.\n2.2 Recommendations\nabout possible\nsolutions are\ndeveloped,\ndocumented,\nranked and\npresented to\n2.1 Current industry\nhardware and\nsoftware products\nand services\n2.2 Industry service\nand helpdesk\npractices,\nprocesses and\nprocedures\n2.1 Identifying\ncurrent industry\nhardware and\nsoftware\nproducts and\nservices\n2.2 Identifying\nservices and\nhelpdesk\npractices,\n\n--- PDF PAGE 16 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 12\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nappropriate\nperson for\ndecision.\n2.3 Operating\nsystems\n2.4 Industry standard\ndiagnostic tools\n2.5 Malfunctions and\nresolutions.\n2.6 Root cause\nanalysis\nprocesses and\nprocedures.\n\n2.3 Identifying\noperating system\n2.4 Identifying\ncurrent industry\nstandard\ndiagnostic tools\n2.5 Describing\ncommon\nmalfunctions and\nresolutions.\n2.6 Determining the\nroot cause of a\nroutine\nmalfunction\n3. Recommend\nsolutions to\nproblems\n3.1 Implementation of\nsolutions are\nplanned.\n3.2 Evaluation of\nimplemented\nsolutions are\nplanned.\n3.3 Recommended\nsolutions are\ndocumented and\nsubmit to\nappropriate person\nfor confirmation.\n3.1 Standard\nprocedures\n3.2 Documentation\nproduce\n3.1 Producing\ndocumentation\nthat\nrecommends\nsolutions to\nproblems\n3.2 Following\nestablished\nprocedures\n\n--- PDF PAGE 17 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Problems/Procedural\nProblem\nMay include:\n1.1 Routine/non – routine processes and quality\nproblems\n1.2 Equipment selection, availability and failure\n1.3 Teamwork and work allocation problem\n1.4 Safety and emergency situations and incidents\n1.5 Work-related problems outside of own work area\n2. Appropriate person\nMay include:\n2.1 Supervisor or manager\n2.2 Peers/work colleagues\n2.3 Other members of the organization\n3. Document\nMay include:\n3.1 Electronic mail\n3.2 Briefing notes\n3.3 Written report\n3.4 Evaluation report\n4. Plan\nMay include:\n4.1 Priority requirements\n4.2 Co-ordination and feedback requirements\n4.3 Safety requirements\n4.4 Risk assessment\n4.5 Environmental requirements\n\n--- PDF PAGE 18 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 14\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined the root cause of a routine problem\n1.2 Identified solutions to procedural problems.\n1.3 Produced documentation that recommends solutions to\nproblems.\n1.4 Followed established procedures.\n1.5 Referred unresolved problems to support persons.\n2. Resource\nImplications\n2.1 Assessment will require access to a workplace over an\nextended period, or a suitable method of gathering\nevidence of operating ability over a range of situations.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Case Formulation\n3.2 Life Narrative Inquiry\n3.3 Standardized test\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of\nparts of this unit of competency. Simulation should be based on\nthe actual workplace and will include walk through of the\nrelevant competency components.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 19 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 15\n\nUNIT OF COMPETENCY\n:\nDEVELOP CAREER AND LIFE DECISIONS\n\nUNIT CODE\n:\n400311213\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitudes\nin managing one’s emotions, developing reflective\npractice,\nand\nboosting\nself-confidence\nand\ndeveloping self-regulation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Manage one’s\nemotion\n1.1 Self-management\nstrategies are\nidentified.\n1.2 Skills to work\nindependently and\nto show initiative, to\nbe conscientious,\nand persevering in\nthe face of setbacks\nand frustrations are\ndeveloped.\n1.3 Techniques for\neffectively handling\nnegative emotions\nand unpleasant\nsituation in the\nworkplace are\nexamined.\n1.1 Self-management\nstrategies that\nassist in\nregulating\nbehavior and\nachieving\npersonal and\nlearning goals\n(e.g. Nine self-\nmanagement\nstrategies\naccording to\nRobert Kelley)\n1.2 Enablers and\nbarriers in\nachieving\npersonal and\ncareer goals\n1.3 Techniques in\nhandling negative\nemotions and\nunpleasant\nsituation in the\nworkplace such\nas frustration,\nanger, worry,\nanxiety, etc.\n1.1 Managing\nproperly one’s\nemotions and\nrecognizing\nsituations that\ncannot be\nchanged and\naccept them and\nremain\nprofessional\n1.2 Developing self-\ndiscipline,\nworking\nindependently\nand showing\ninitiative to\nachieve personal\nand career goals\n1.3 Showing\nconfidence, and\nresilience in the\nface of setbacks\nand frustrations\nand other\nnegative\nemotions and\nunpleasant\nsituations in the\nworkplace\n2. Develop reflective\npractice\n2.1 Personal strengths\nand achievements,\nbased on self-\nassessment\nstrategies and\nteacher feedback\nare contemplated.\n2.2 Progress when\nseeking and\n2.1 Basic SWOT\nanalysis\n2.2 Strategies to\nimprove one’s\nattitude in the\nworkplace\n2.3 Gibbs’ Reflective\nCycle/Model\n(Description,\n2.1 Using the basic\nSWOT analysis\nas self-\nassessment\nstrategy\n2.2 Developing\nreflective\npractice through\nrealization of\n\n--- PDF PAGE 20 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 16\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nresponding to\nfeedback from\nteachers to assist\nthem in\nconsolidating\nstrengths,\naddressing\nweaknesses and\nfulfilling their\npotential are\nmonitored.\n2.3 Outcomes of\npersonal and\nacademic\nchallenges by\nreflecting on\nprevious problem\nsolving and\ndecision making\nstrategies and\nfeedback from\npeers and teachers\nare predicted.\nFeelings,\nEvaluation,\nAnalysis,\nConclusion, and\nAction plan)\nlimitations, likes/\ndislikes; through\nshowing of self-\nconfidence\n2.3 Demonstrating\nself-acceptance\nand being able\nto accept\nchallenges\n3. Boost self-\nconfidence and\ndevelop self-\nregulation\n3.1 Efforts for\ncontinuous self-\nimprovement are\ndemonstrated.\n3.2 Counter-productive\ntendencies at work\nare eliminated.\n3.3 Positive outlook in\nlife are maintained.\n3.1 Four components\nof self-regulation\nbased on Self-\nRegulation\nTheory (SRT)\n3.2 Personality\ndevelopment\nconcepts\n3.3 Self-help\nconcepts (e. g., 7\nHabits by\nStephen Covey,\ntransactional\nanalysis, psycho-\nspiritual concepts)\n3.1 Performing\neffective\ncommunication\nskills – reading,\nwriting,\nconversing skills\n3.2 Showing\naffective skills –\nflexibility,\nadaptability, etc.\n3.3 Self-assessment\nfor determining\none’s strengths\nand weaknesses\n\n--- PDF PAGE 21 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 17\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Self-management\nstrategies\nMay include:\n1.1 Seeking assistance in the form of job coaching or\nmentoring\n1.2 Continuing dialogue to tackle workplace grievances\n1.3 Collective negotiation/bargaining for better working\nconditions\n1.4 Share your goals to improve with a trusted co-\nworker or supervisor\n1.5 Make a negativity log of every instance