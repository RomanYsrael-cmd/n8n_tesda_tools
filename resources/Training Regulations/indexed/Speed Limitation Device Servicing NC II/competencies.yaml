        "source_text": "--- PDF PAGE 59 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        55 \n \nUNIT OF COMPETENCY \n: \nPREPARE SERVICING PARTS AND  \nCONSUMABLES \n \n \n \nUNIT CODE \n: \nALT723217 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit of competency covers the ability to  \nprepare parts and consumables for gasoline and  \ndiesel engines in conducting preventive  \nmaintenance. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Identify parts and \nconsumables \n1.1  Parts and \nconsumables are \ndetermined \naccording to job \nrequirements. \n1.2  Availability of parts \nand consumables \nare confirmed \nbased on stock. \n1.3  Indirect materials \nare identified \naccording to job \nrequirements. \n1.4  Hazardous parts \nand consumables \nare identified \naccording \nInternational \nstandards. \n1.5  Safety practices are \napplied according \nto OSHS. \n1.1  Job requirements \n1.2  Safety practices \n1.3  Understanding \nmanuals \n1.4  Hazardous parts \nand consumables \n1.5  Solid waste \nmanagement act \n(RA 6969) \n1.6  Wearing of PPE’s \n1.7  OSHS \n1.8  Proper storage of \nmaterials \n1.9  Chemical \ncontents of \nconsumables \n1.10 Composition of \nconsumables \n1.11 Quality of parts \nand consumables \n1.12 Computation for \nquantity of parts \nand consumables \n1.13 Vehicle \nspecifications \n1.14 Identifying Part \nno. \n1.15 Awareness in \npart number \n1.16 Updated type of \nparts and \nconsumables \n1.1  Determining \nparts and \nconsumables \n1.2  Reading and \ninterpreting job \nrequirements \n1.3  Identifying \nrequired parts & \nconsumables \n1.4  Understanding \nsafety practices \n1.5  Determining \nquantity and \nquality of parts \nand \nconsumables \n1.6  Confirming \navailability of \nparts and \nconsumables \n1.7  Identifying \nindirect materials \n1.8  Identifying \nhazardous part