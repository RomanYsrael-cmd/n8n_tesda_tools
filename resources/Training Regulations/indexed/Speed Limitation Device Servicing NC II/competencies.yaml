  "source_section_text": "SECTION 1 SPEED LIMITATION DEVICE SERVICING NC II QUALIFICATION\n\nThe SPEED LIMITATION DEVICE SERVICING NC II Qualification consists of\ncompetencies that a person must achieve to conduct basic inspection of engine and\nother electrical components; install, repair, and maintain Speed Limitation Device. It\ncovers both manufactured and second-hand vehicles: closed van, covered vehicle,\nhauler or cargo truck, motor vehicle, public utility vehicle (PUV), shuttle service, and\ntanker truck.\n\nThis Qualification is packaged from the competency map of the Automotive and\nLand Transport Sector as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the\nworkplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nALT723211\nValidate vehicle specification\nALT723214\nUtilize automotive tools\nALT723215\nPerform mensuration and calculation\nALT723216\nUtilize workshop facilities and equipment\nALT723217\nPrepare servicing parts and consumables\nALT723218\nPrepare vehicle for servicing and releasing\n\nCODE NO.\nCORE COMPETENCIES\nALT723382\nConduct basic inspection of engine and other electrical\ncomponents\nALT723383\nPerform installation of Speed Limitation Device\nALT723384\nMaintain Speed Limitation Device\n\nA person who has achieved this Qualification is competent to be:\n\n Speed Limitation Device Installer\n Speed Limitation Device Installation Technician\n\n--- PDF PAGE 6 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 2"
