        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Convey OSH work non-conformities to appropriate\npersonnel\n1.2 Identify OSH preventive and control requirements in\naccordance with OSH work policies and procedures\n1.3 Identify OSH work activity material, tools and equipment\nrequirements in accordance with workplace policies and\nprocedures\n1.4 Arrange/Place required OSH materials, tools and\nequipment in accordance with OSH work standards\n1.5 Execute work activities in accordance with OSH work\nstandards\n1.6 Report OSH activity non-compliance work activities to\nappropriate personnel\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Facilities, materials tools and equipment necessary for the\nactivity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 33 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 29\n\nUNIT OF COMPETENCY\n:\nEXERCISE EFFICIENT AND EFFECTIVE\nSUSTAINABLE PRACTICES IN THE\nWORKPLACE\n\nUNIT CODE\n:"
        },
        "source_text": "400311216\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to identify OSH compliance requirements,\nprepare OSH requirements for compliance, perform\ntasks in accordance with relevant OSH policies and\nprocedures.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify OSH\ncompliance\nrequirements\n1.1 Relevant OSH\nrequirements,\nregulations,\npolicies and\nprocedures are\nidentified in\naccordance with\nworkplace policies\nand procedures.\n1.2 OSH activity non-\nconformities are\nconveyed to\nappropriate\npersonnel.\n1.3 OSH preventive\nand control\nrequirements are\nidentified in\naccordance with\nOSH work policies\nand procedures.\n1.1 OSH preventive\nand control\nrequirements\n1.2 Hierarchy of\nControls\n1.3 Hazard\nPrevention and\nControl\n1.4 General OSH\nprinciples\n1.5 Work standards\nand procedures\n1.6 Safe handling\nprocedures of\ntools, equipment\nand materials\n1.7 Standard\nemergency plan\nand procedures in\nthe workplace\n1.1 Communication\nskills\n1.2 Interpersonal\nskills\n1.3 Critical thinking\nskills\n1.4 Observation\nskills\n2. Prepare OSH\nrequirements for\ncompliance\n2.1 OSH work activity\nmaterial, tools and\nequipment\nrequirements are\nidentified in\naccordance with\nworkplace policies\nand procedures.\n2.2 Required OSH\nmaterials, tools and\nequipment are\nacquired in\naccordance with\nworkplace policies\nand procedures.\n2.1 Resources\nnecessary to\nexecute hierarchy\nof controls\n2.2 General OSH\nprinciples\n2.3 Work standards\nand procedures\n2.4 Safe handling\nprocedures of\ntools, equipment\nand materials\n2.5 Different OSH\ncontrol measures\n2.1 Communication\nskills\n2.2 Estimation skills\n2.3 Interpersonal\nskills\n2.4 Critical thinking\nskills\n2.5 Observation\nskills\n2.6 Material, tool and\nequipment\nidentification\nskills\n\n--- PDF PAGE 30 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 26\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.3 Required OSH\nmaterials, tools and\nequipment are\narranged/ placed in\naccordance with\nOSH work\nstandards.\n3. Perform tasks in\naccordance with\nrelevant OSH\npolicies and\nprocedures\n3.1 Relevant OSH work\nprocedures are\nidentified in\naccordance with\nworkplace policies\nand procedures.\n3.2 Work Activities are\nexecuted in\naccordance with\nOSH work\nstandards.\n3.3 Non-compliance\nwork activities are\nreported to\nappropriate\npersonnel.\n3.1 OSH work\nstandards\n3.2 Industry related\nwork activities\n3.3 General OSH\nprinciples\n3.4 OSH Violations\nNon-compliance\nwork activities\n3.1 Communication\nskills\n3.2 Interpersonal\nskills\n3.3 Troubleshooting\nskills\n3.4 Critical thinking\nskills\n3.5 Observation\nskills\n\n--- PDF PAGE 31 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Requirements,\nRegulations, Policies and\nProcedures\nMay include:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Permit to Operate\n1.6 Philippine Occupational Safety and Health\nStandards\n1.7 Department Order No. 13 (Construction Safety and\nHealth)\n1.8 ECC regulations\n2. Appropriate Personnel\nMay include:\n2.1 Manager\n2.2 Safety Officer\n2.3 EHS Offices\n2.4 Supervisors\n2.5 Team Leaders\n2.6 Administrators\n2.7 Stakeholders\n2.8 Government Official\n2.9 Key Personnel\n2.10 Specialists\n2.11 Himself\n3. OSH Preventive and\nControl Requirements\nMay include:\n3.1 Resources needed for removing hazard effectively\n3.2 Resources needed for substitution or replacement\n3.3 Resources needed to establishing engineering\ncontrols\n3.4 Resources needed for enforcing administrative\ncontrols\n3.5 Personal Protective equipment\n4. Non OSH-Compliance\nWork Activities\nMay include non-compliance or observance of the\nfollowing safety measures:\n4.1 Violations that may lead to serious physical harm or\ndeath\n4.2 Fall Protection\n4.3 Hazard Communication\n4.4 Respiratory Protection\n4.5 Power Industrial Trucks\n4.6 Lockout/Tag-out\n4.7 Working at heights (use of ladder, scaffolding)\n4.8 Electrical Wiring Methods\n4.9 Machine Guarding\n4.10 Electrical General Requirements\n4.11 Asbestos work requirements\n4.12 Excavations work requirements\n\n--- PDF PAGE 32 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 28\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Convey OSH work non-conformities to appropriate\npersonnel\n1.2 Identify OSH preventive and control requirements in\naccordance with OSH work policies and procedures\n1.3 Identify OSH work activity material, tools and equipment\nrequirements in accordance with workplace policies and\nprocedures\n1.4 Arrange/Place required OSH materials, tools and\nequipment in accordance with OSH work standards\n1.5 Execute work activities in accordance with OSH work\nstandards\n1.6 Report OSH activity non-compliance work activities to\nappropriate personnel\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Facilities, materials tools and equipment necessary for the\nactivity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 33 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 29\n\nUNIT OF COMPETENCY\n:\nEXERCISE EFFICIENT AND EFFECTIVE\nSUSTAINABLE PRACTICES IN THE\nWORKPLACE\n\nUNIT CODE\n:"
