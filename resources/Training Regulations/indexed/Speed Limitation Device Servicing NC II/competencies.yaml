          "source_text": "VARIABLE \nRANGE \n1.  Job Order Form \nJob order form may include: \n1.1   Vehicle details \n1.1.1   Model \n1.1.2   Mileage \n1.2   Inspection of unit \n1.3   Type of Speed Limitation Device to be installed \n1.4   Set limit to a specific speed according to law and \nclient \n1.5   Set limit to a specific speed \n1.6   Attached Electrical Wiring Diagram (EWD) \n2.  Visual inspection \nVisual inspection may include: \n2.1   Inspection of loose connections \n2.2   Inspection burned wires \n2.3   Inspection working condition of speedometer \n2.4   Inspection fuel leaks \n2.5   Inspection size of fuel line (mechanical) \n2.6   Inspection size of wires \n3.  Recommendations \nRecommendations may include: \n3.1   Change speed limiter module \n3.2   Replacement of fittings \n3.3   Replacement of sockets \n3.4   Relocation of tapping points electronic throttle \nlinkage \n3.5   Rejection of request due to defective vehicle wiring \ncondition \n4.  Industry criteria \nIndustry criteria may include: \n4.1   Beside computer box \n4.2   Secured from unauthorized person \n4.3   Protected from elements \n5.  Documentations \nDocumentations refers to: \n5.1   Findings and recommendations \n5.2   Installation plan \n5.3   Installation and Repair report \n6.  Tools, materials, \nequipment, and parts \nTools, materials, equipment, and parts may include: \n \n6.1   Tools \n6.1.1   Measuring tape \n6.1.2   Screw driver \n \n6.2   Materials \n6.2.1   Soldering lead \n6.2.2   Soldering paste \n6.2.3   Liquid gasket \n6.2.4   T-fittings \n6.2.5   Corrugated plastic hose \n6.2.6   Fuel line hose \n6.2.7   Stainless ear clamp\n\n--- PDF PAGE 71 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        67 \nVARIABLE \nRANGE \n6.2.8   Electrical tape \n6.2.9   Teflon tape \n6.2.10 Autowire \n6.2.11 Soldering iron \n6.2.12 Terminal eye \n6.2.13 Garbage bin \n6.2.14 Rags \n6.2.15 PPEs: \n6.2.15.1   Safety shoes \n6.2.15.2   Hard hat \n6.2.15.3   Arm sleeves \n6.2.15.4   Safety gloves \n6.2.15.5   Safety googles \n6.2.15.6   Reflectorized vest \n6.2.16 Sample Job Order Form \n6.2.17 Installation manual \n \n6.3   Equipment \n6.3.1   Training vehicle \n \n6.4   Parts \n6.4.1   Speed Limitation Device Kit for Electronic \nThrottle Linkage \n6.4.1.1   Speed Limitation Device \n6.4.1.2   Wire for front engine \n6.4.1.3   Cable ties \n6.4.1.4   Sealing wire and lead seal \n6.4.2   Speed Limitation Device Kit for Mechanical \nThrottle Linkage \n6.4.2.1   Speed Limitation Device \n6.4.2.2   Wire for front engine \n6.4.2.3   Cable ties \n6.4.2.4   Sealing wire and lead seal \n6.4.2.5   Solenoid valve and fittings \n6.4.3   Gear box sensor \n6.4.4   Speed sensor \n7.  Vehicle manufacturer’s \nmanual \nMay include: \n7.1   Repair manual \n7.2   Workshop manual \n7.3   Electrical wiring diagram \n7.4   Speed Limitation Device Wiring Diagram\n\n--- PDF PAGE 72 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        68"
