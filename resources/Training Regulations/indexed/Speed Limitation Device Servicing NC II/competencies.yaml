t conversion of \ntorque \n2.4  English and \nmetric system \n2.5  Types of hand \ntools \n2.6  Types of power \ntools \n2.7  Fundamentals of \nautomotive hand \ntools and power \ntools \n2.1  Analytical skills \n2.2  Technical \nliteracy \n2.3  Mounting \nattachments to \nautomotive tools \n2.4  Connecting \npower tools to \npower sources \n2.5  Operating power \ntools \n2.6  Utilizing hand \ntools \n2.7  Wearing PPEs \n2.8  Applying safety \npractices\n\n--- PDF PAGE 47 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        43 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.5  PPEs are worn in \naccordance to \nOSHS. \n2.8  Interpretation of \ncontents of users \nmanuals \n2.9  OSHS \n2.10 Resources \ninformation \n2.10.1 Bulletin \n2.10.2 Shop \nmanual \n2.9  Following \nmanuals \n3.  Maintain \nautomotive tools \n3.1  Automotive tools \nand attachments \nare cleaned \naccording to user’s \nmanual. \n3.2  Automotive tools \nand attachments \nare checked for \nserviceability \naccording to \nworkplace and \nmanufacturers \nprocedures. \n3.3  Defects and \ndamages are \nreported to \nimmediate superior \nfollowing industry \nstandards. \n3.4  Automotive tools \nand attachments \nare stored \naccording to \nworkplace \nprocedures. \n3.5  Safety practices are \napplied following \nOSHS. \n3.6  Wastes are \ndisposed following \nenvironmental law \nand regulations. \n3.1  Different types of \npower tools and \nhand tools \n3.2  Techniques in tool \nArrangement \n3.3  Fundamentals of \nautomotive tools \n3.4  Cleaning of \nautomotive tools \n3.5  Labeling and \narranging of \npower tools and \nhand tools \n3.6  Safety practices \n3.7  Procedures in \nmaintaining of \npower tools and \nhand tools \n3.8  Tagging of \ndamaged/ worn \npower tools and \nhand tools \n3.9  Reporting \ndamage power \ntools and hand \ntools \n3.10 P