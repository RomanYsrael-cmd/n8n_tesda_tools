        "source_text": "ALT723383\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitudes\nneeded in securing job order, identifying Speed\nLimitation Device Kit, using electrical wiring diagram,\ninstalling Speed Limitation Device, preparing and\nsubmitting workplace documents, and performing\nturn-over of vehicle.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare for\ninstallation\n1.1 Accomplished Job\nOrder Form is\nsecured from\nimmediate superior\nbased on standard\noperating\nprocedure.\n1.2 Installation manual\nis used based on\njob request.\n1.3 Electrical Wiring\nDiagram is used for\ninstallation.\n1.4 Speed Limitation\nDevice Kit is\nprepared according\nto job order.\n1.5 Tools, materials,\nequipment, and\nparts are prepared\nbased on job order.\n1.6 Hazards associated\nwith the work are\nidentified and risks\nare managed.\n1.1 Job Order Form\n1.2 Installation\nmanual\n1.3 Electrical Wiring\nDiagram (EWD)\n1.4 Vehicle models\n1.5 Type of Speed\nLimitation Device\nKit:\n1.5.1 Mechanical\n1.5.2 Electronic\n1.6 Inspection of\nSpeed Limitation\nDevice Kit\n1.7 Different\ninstallation tools,\nmaterials,\nequipment, parts\nand their\nfunctions\n1.8 Mensuration\n1.9 Calculation\n1.10 Hazards\nassociated with\nthe operation\n1.11 Awareness on\nPNS UNR\n89:2016, part 3:\nUniform\nprovisions\nconcerning the\napproval of\nSpeed Limitation\nDevices and\nadjustable Speed\n1.1 Securing Job\nOrder Form\n1.2 Use of\ninstallation\nmanual\n1.3 Use of electrical\nwiring diagram\n1.4 Identifying\nSpeed Limitation\nDevice Kit\n1.5 Checking Speed\nLimitation Device\nKit\n1.6 Preparing and\nselecting tools,\nmaterials,\nequipment, and\nparts\n1.7 Identifying\nhazards\n1.8 Managing risks\n1.9 Identifying\nvehicle models\n1.10 Mensuration\nskills\n1.11 Computation\nskills\n\n--- PDF PAGE 74 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 70\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nLimitation\nDevices\n2. Install Speed\nLimitation Device\n2.1 Gear box sensor is\ninstalled based on\ninstallation manual\nand vehicle\nmanufacturer’s\nmanual.\n2.2 Solenoid valve is\ninstalled based on\ninstallation manual\nand vehicle\nworkshop manual.\n2.3 Functionality of\nSpeed Limitation\nDevice is tested\nusing test\ncalibration unit\n(TCU) thru actual\nroad test.\n2.4 Calibration is\nperformed based\non installation\nmanual.\n2.5 Security features\nare installed based\non installation\nmanual.\n2.6 Safety practices are\napplied based on\nOccupational\nSafety and Health\nStandards (OSHS).\n2.1 Gear box sensor\n2.2 Solenoid valve\n2.3 Vehicle\nmanufacturer’s\nmanual\n2.4 Accessories,\nmiscellaneous,\nand fittings\n2.5 Road test (to\ndetermine the\nfunctionality of\nSpeed Limitation\nDevice)\n2.5.1 Rolling road\n2.5.2 Open road\n2.6 Calibration (part\nof road test)\n2.7 Checking of\ninstalled Speed\nLimitation Device\n(part of road test)\n2.8 Security features\n2.9 Installation\nmanual\n2.10 OSHS\n2.11 Awareness in RA\n4136 Chapter IV,\nArt. I Sec. 35 –\nSpeed Limit\n2.12 Estimation\n2.13 Solid waste\nmanagement\n2.1 Installing of gear\nbox sensor\n2.2 Installing gear\nsolenoid valve\n2.3 Reading\nworkshop\nmanual and\nvehicle workshop\nmanual\n2.4 Performing road\ntest\n2.5 Performing\ncalibration\n2.6 Installing security\nfeatures\n2.7 Checking\ninstalled Speed\nLimitation Device\n2.8 Estimation skills\n2.9 Practicing OSHS\n2.10 Practicing solid\nwaste\nmanagement\n3. Perform post-\nactivities\n3.1 Workplace\ndocuments are\nprepared and\nsubmitted to\nimmediate superior\nbased on standard\noperating\nprocedure.\n3.2 Video\ndocumentation is\nperformed based\non standard\noperating\nprocedure.\n3.1 Preparation of\nworkplace\ndocuments\n3.2 Warranty card\n3.3 Restoration of\nworkplace\n3.4 Waste\nmanagement\n3.5 Procedure to turn-\nover vehicle\n3.6 Quality control\nprocedures\n3.7 Checking and\nstorage of tools,\n3.1 Preparing and\nsubmitting\nworkplace\ndocuments\n3.2 Signing and\nsubmitting\nwarranty card\n3.3 Restoring\nworkplace\n3.4 Disposing\nwastes\n3.5 Turning-over\nvehicle\n3.6 Checking and\nstoring tools,\n\n--- PDF PAGE 75 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 71\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.3 Photo\ndocumentation is\nperformed based\non standard\noperating\nprocedure.\n3.4 Warranty card is\nsigned and\nsubmitted to\nimmediate superior\nbased on standard\noperating\nprocedure.\n3.5 Workplace is\nrestored based on\ngood\nhousekeeping.\n3.6 Wastes are\ndisposed based on\nwaste\nmanagement.\n3.7 Vehicle is turned-\nover to immediate\nsuperior for quality\ncontrol following\nworkplace\nprocedure\n3.8 Tools, materials,\nequipment, and\nparts are checked\nand stored\naccording to\nworkplace\nprocedures.\n3.9 Installation and\nRepair report is\nprepared based on\nstandard operating\nprocedure.\n3.10 Required output is\ncompleted as\nspecified by\nimmediate superior\nbased on work.\nmaterials and\nequipment\n3.8 Inventory report\n3.9 3Rs\n3.10 Factors affecting\nproductivity\n3.11 Productivity work\nmeasurements\n3.12 Ways of\nimproving\nproductivity\n3.13 Adherence to\nwork\nrequirements\nmaterials and\nequipment\n3.7 Preparing\ninventory report\n3.8 Practicing 3Rs\n\n--- PDF PAGE 76 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 72\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Job order form\nJob order form includes:\n1.1 Details of vehicle\n1.2 Job request based on the recommendations\n1.3 Approval of superior\n1.4 Recalibration of module\n1.5 Checking of product warranty card\n2. Security features\nSecurity features includes:\n2.1 Sealing pliers with anvil\n2.2 Sealing wire\n2.3 Lead seals\n3. Calibration\nCalibration include:\n3.1 Ensure speed limit meets the required regulation\n3.2 Ensure there is no diagnostic trouble code (DTC)\nafter installation\n4. Tools, materials,\nequipment, and parts\nTools, materials, equipment, and parts may include:\n\n4.1 Tools\n4.1.1 Measuring tape\n4.1.2 Test and calibration unit\n4.1.3 Sealing pliers with anvil\n4.1.4 Plier cutter\n4.1.5 Combination wrench\n4.1.6 Multi-tester\n4.1.7 Seal grip\n4.1.8 Adjustable wrench\n4.1.9 Socket\n4.1.10 Ratchet\n4.1.11 T-wrench\n4.1.12 Torx wrench\n4.1.13 Wire stripper\n4.1.14 Screw driver\n\n4.2 Materials\n4.2.1 Soldering lead\n4.2.2 Soldering paste\n4.2.3 Liquid gasket\n4.2.4 T-fittings\n4.2.5 Corrugated plastic hose\n4.2.6 Fuel line hose\n4.2.7 Stainless ear clamp\n4.2.8 Electrical tape\n4.2.9 Teflon tape\n4.2.10 Autowire\n4.2.11 Soldering iron\n4.2.12 Terminal eye\n4.2.13 Relief valve assy\n4.2.14 Autowire for rear engine\n\n--- PDF PAGE 77 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 73\nVARIABLE\nRANGE\n4.2.15 Removable adhesive tape\n4.2.16 Garbage bin\n4.2.17 Rags\n4.2.18 PPEs:\n4.2.18.1 Safety shoes\n4.2.18.2 Hard hat\n4.2.18.3 Arm sleeves\n4.2.18.4 Safety gloves\n4.2.18.5 Safety googles\n4.2.18.6 Reflectorized vest\n4.2.19 Sample job order\n4.2.20 Installation manual\n\n4.3 Equipment\n4.3.1 Tool Caddy\n4.3.2 Training vehicle\n\n4.4 Parts\n4.4.1 Speed Limitation Device Kit for Electronic\nThrottle Linkage\n4.4.1.1 Speed Limitation Device\n4.4.1.2 Wire for front engine\n4.4.1.3 Cable ties\n4.4.1.4 Sealing wire and lead seal\n4.4.2 Speed Limitation Device Kit for Mechanical\nThrottle Linkage\n4.4.2.1 Speed Limitation Device\n4.4.2.2 Wire for front engine\n4.4.2.3 Cable ties\n4.4.2.4 Sealing wire and lead seal\n4.4.2.5 Solenoid valve and fitting\n4.4.3 Gear box sensor\n4.4.4 Speed sensor\n5. Speed Limitation Device\nKit\nSpeed Limitation Device Kit includes:\n5.1 Speed Limitation Device Kit for Electronic Throttle\nLinkage\n5.1.1 Speed Limitation Device\n5.1.2 Wire for front engine\n5.1.3 Cable ties\n5.1.4 Sealing wire and lead seal\n\n5.2 Speed Limitation Device Kit for Mechanical Throttle\nLinkage\n5.2.1 Speed Limitation Device\n5.2.2 Wire for front engine\n5.2.3 Cable ties\n5.2.4 Sealing wire and lead seal\n5.2.5 Solenoid valve and fitting\n\n--- PDF PAGE 78 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 74\nVARIABLE\nRANGE\n6. Workplace documents\nMay include:\n6.1 Job order\n6.1.1 Inspection form\n6.2 Installation and Repair report\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared for installation\n1.1.1 Secured accomplished job order.\n1.1.2 Used installation manual.\n1.1.3 Used electrical wiring diagram.\n1.1.4 Prepared Speed Limitation Device Kit.\n1.1.5 Prepared tools, materials, equipment, and parts.\n1.1.6 Identified hazards associated with the work and\nmanaged risks.\n1.2 Installed Speed Limitation Device\n1.2.1 Installed gear box sensor.\n1.2.2 Installed gear solenoid valve.\n1.2.3 Tested functionality of Speed Limitation Device.\n1.2.4 Performed calibration.\n1.2.5 Installed security features.\n1.2.6 Applied safety practices.\n1.3 Performed post-activities\n1.3.1 Prepared and submitted workplace documents.\n1.3.2 Signed and submitted warranty card.\n1.3.3 Restored workplace.\n1.3.4 Disposed wastes.\n1.3.5 Turned-over vehicle.\n1.3.6 Checked and stored tools, materials, and\nequipment.\n1.3.7 Completed required output.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Appropriate Tools & Equipment\n2.3 Materials relevant to the activity\n2.4 Manufacturer’s repair manual\n2.5 PPEs\n2.6 Training vehicle\n2.7 First aid kit\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral questioning\n3.2 Written exam\n3.3 Direct Observation\n4. Context for\nassessment\n4