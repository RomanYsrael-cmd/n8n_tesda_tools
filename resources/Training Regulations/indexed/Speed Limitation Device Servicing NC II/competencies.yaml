        "source_text": "--- PDF PAGE 37 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        33 \n \nUNIT OF COMPETENCY \n: \nPRACTICE ENTREPRENEURIAL SKILLS IN THE \nWORKPLACE \n \n \n \nUNIT CODE \n: \n400311218 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes required to apply \nentrepreneurial workplace best practices \nand \nimplement cost-effective operations. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Apply \nentrepreneurial \nworkplace best \npractices \n1.1  Good practices \nrelating to \nworkplace \noperations are \nobserved and \nselected following \nworkplace policy. \n1.2  Quality \nprocedures and \npractices are \ncomplied with \naccording to \nworkplace \nrequirements.  \n1.3  Cost-conscious \nhabits in \nresource \nutilization are \napplied based on  \nindustry \nstandards. \n1.1  Workplace best \npractices, \npolicies and \ncriteria \n1.2  Resource \nutilization \n1.3  Ways in \nfostering \nentrepreneurial \nattitudes: \n Patience \n Honesty \n Quality-\nconsciousness \n Safety-\nconsciousness \n Resourceful-\nness \n1.1  \nCommunication \nskills \n1.2  Complying with \nquality \nprocedures \n2.  Communicate \nentrepreneurial \nworkplace best \npractices \n2.1  Observed good \npractices relating \nto workplace \noperations are \ncommunicated to \nappropriate \nperson. \n2.2  Observed quality \nprocedures and \npractices are \ncommunicated to \nappropriate \nperson. \n2.1  Workplace best \npractices, \npolicies and \ncriteria \n2.2  Resource \nutilization \n2.3  Ways in \nfostering \nentrepreneurial \nattitudes: \n Patience \n Honesty \n Quality-\nconsciousness \n2.1  \nCommunication \nskills \n2.2  Complying with \nquality \nprocedures \n2.3  Following \nworkplace \ncommunication \nprotocol\n\n--- PDF PAGE 38 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        34 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.3  Cost-conscious \nhabits in resource \nutilization are \ncommunicated \nbased on industry \nstandards. \n Safety-\nconsciousness \n Resourceful-\nness  \n3.  Implement cost-\neffective \noperations \n3.1  Preservation and \noptimization of \nworkplace \nresources is \nimplemented in \naccordance with \nenterprise policy. \n3.2  Judicious use of \nworkplace tools, \nequipment and \nmaterials are \nobserved \naccording to \nmanual and work \nrequirements. \n3.3  Constructive \ncontributions to \noffice operations \nare made \naccording to \nenterprise \nrequirements. \n3.4  Ability to work \nwithin one’s \nallotted time and \nfinances is \nsustained. \n3.1  Optimization of \nworkplace \nresources \n3.2  5S procedures \nand concepts \n3.3  Criteria for cost-\neffectiveness \n3.4  Workplace \nproductivity \n3.5  Impact of \nentrepreneurial \nmindset to \nworkplace \nproductivity \n3.6  Ways in \nfostering \nentrepreneurial \nattitudes: \n Quality-\nconsciousness \n Safety-\nconsciousness \n3.1  Implementing \npreservation \nand optimizing \nworkplace \nresources \n3.2  Observing \njudicious use of \nworkplace \ntools, \nequipment and \nmaterials \n3.3  Making \nconstructive \ncontributions to \noffice \noperations \n3.4  Sustaining \nability to work \nwithin allotted \ntime and \nfinances\n\n--- PDF PAGE 39 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        35 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Good practices \nMay include: \n1.1   Economy in use of resources \n1.2   Documentation of quality practices  \n2.  Resources utilization \nMay include: \n2.1   Consumption/ use of consumables \n2.2   Use/Maintenance of assigned equipment and \nfurniture \n2.3   Optimum use of allotted /available time \n \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Demonstrated ability to identify and sustain cost-effective \nactivities in the workplace  \n1.2   Demonstrated ability to practice entrepreneurial \nknowledge, skills and attitudes in the workplace. \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1   Simulated or actual workplace \n2.2   Tools, materials and supplies needed to demonstrate the \nrequired tasks  \n2.3   References and manuals \n2.3.1   Enterprise procedures manuals \n2.3.2   Company quality policy \n3.  Methods of \nAssessment \nCompetency in this unit should be assessed through: \n3.1   Interview \n3.2   Third-party report \n4.  Context for \nAssessment \n4.1   Competency may be assessed in workplace or in a \nsimulated workplace setting \n4.2   Assessment shall be observed while tasks are being \nundertaken whether individually or in-group\n",
