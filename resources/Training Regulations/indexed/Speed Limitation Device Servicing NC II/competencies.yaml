e\nprocedures.\n3.7 Required output is\ncompleted as\nspecified by\nimmediate superior\nbased on work.\n3.1 Final inspection\nprocedure\n3.2 Turn-over of\nvehicle\n3.3 Accomplishment\nof repair order\nand other forms\n3.4 Job done\n3.5 OSHS\n3.6 Wearing of 4.6\nPPEs\n3.7 5S\n3.8 Waste\nmanagement\n3.9 Checking and\nstorage of tools\n3.10 Workplace\ndocuments\n3.11 IRR of RA 10916\n“Road Speed\nLimiter Act of\n2016”\n3.12 RA 4136 “Land\nTransportation\nand Traffic Code”\n3.13 RA 2000 “Limited\nAccess Highway\nAct”\n3.14 Factors affecting\nproductivity\n3.15 Productivity work\nmeasurements\n3.16 Ways of\nimproving\nproductivity\n3.17 Adherence to\nwork\nrequirements\n3.1 Accomplishing\nworkplace\ndocumentation.\n3.2 Reporting\ndiagnostic\nfindings and\nmake repair\nrecommend-\ndations\n3.3 Conducting final\ninspection\n3.4 Performing\nvehicle turn-over\n3.5 Restoring work\narea\n3.6 Managing\nwastes\n3.7 Checking and\nstoring tools and\nequipment\n3.8 Wearing of PPEs\n3.9 Applying safety\npractices\n3.10 Accomplishing\nworkplace\ndocuments\n\n--- PDF PAGE 82 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 78\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Job order form\nJob order form includes:\n1.1 Details of vehicle\n1.2 Job request based on the recommendations\n1.3 Approval of superior\n1.4 Recalibration of SLD\n1.5 Replacement of SLD\n1.6 Checking of product warranty card\n2. Tools, materials,\nequipment, and parts\nTools, materials, equipment, and parts may include:\n\n2.1 Tools\n2.1.1 Measuring tape\n2.1.2 Test and calibration unit\n2.1.3 Sealing pliers with anvil\n2.1.4 Plier cutter\n2.1.5 Combination wrench\n2.1.6 Multi-tester\n2.1.7 Seal grip\n2.1.8 Adjustable wrench\n2.1.9 Socket\n2.1.10 Ratchet\n2.1.11 T-wrench\n2.1.12 Torx wrench\n2.1.13 Wire stripper\n2.1.14 Screw driver\n\n2.2 Materials\n2.2.1 Soldering lead\n2.2.2 Soldering paste\n2.2.3 Liquid gasket\n2.2.4 T-fittings\n2.2.5 Corrugated plastic hose\n2.2.6 Fuel line hose\