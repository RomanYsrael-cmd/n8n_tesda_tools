vation and\noptimization of\nworkplace\nresources is\nimplemented in\naccordance with\nenterprise policy.\n3.2 Judicious use of\nworkplace tools,\nequipment and\nmaterials are\nobserved\naccording to\nmanual and work\nrequirements.\n3.3 Constructive\ncontributions to\noffice operations\nare made\naccording to\nenterprise\nrequirements.\n3.4 Ability to work\nwithin one’s\nallotted time and\nfinances is\nsustained.\n3.1 Optimization of\nworkplace\nresources\n3.2 5S procedures\nand concepts\n3.3 Criteria for cost-\neffectiveness\n3.4 Workplace\nproductivity\n3.5 Impact of\nentrepreneurial\nmindset to\nworkplace\nproductivity\n3.6 Ways in\nfostering\nentrepreneurial\nattitudes:\n• Quality-\nconsciousness\n• Safety-\nconsciousness\n3.1 Implementing\npreservation\nand optimizing\nworkplace\nresources\n3.2 Observing\njudicious use of\nworkplace\ntools,\nequipment and\nmaterials\n3.3 Making\nconstructive\ncontributions to\noffice\noperations\n3.4 Sustaining\nability to work\nwithin allotted\ntime and\nfinances\n\n--- PDF PAGE 39 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 35\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Good practices\nMay include:\n1.1 Economy in use of resources\n1.2 Documentation of quality practices\n2. Resources utilization\nMay include:\n2.1 Consumption/ use of consumables\n2.2 Use/Maintenance of assigned equipment and\nfurniture\n2.3 Optimum use of allotted /available time\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to identify and sustain cost-effective\nactivities in the workplace\n1.2 Demonstrated ability to practice entrepreneurial\nknowledge, skills and attitudes in the workplace.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to demonstrate the\nrequired tasks\n2.3 References and manuals\n2.3.1 Enterprise procedures manu