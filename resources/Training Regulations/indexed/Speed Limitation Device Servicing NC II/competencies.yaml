        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Conducted preparation activities\n1.1.1 Secured accomplished job order form.\n1.1.2 Made close coordination with authorized vehicle\ntechnician.\n1.1.3 Reported actual findings on vehicle.\n1.1.4 Sought approval of immediate superior.\n1.1.5 Prepared and checked tools, materials, equipment,\nand parts.\n1.1.6 Worn PPEs.\n1.2 Performed repair and maintenance\n1.2.1 Replaced Speed Limitation Device.\n1.2.2 Performed recalibration of Speed Limitation Device.\n1.2.3 Accomplished warranty card.\n1.2.4 Used tools, materials, and parts.\n1.2.5 Operated equipment.\n1.2.6 Employed safety measures.\n1.3 Completed work processes\n1.3.1 Tested functionality of Speed Limitation Device.\n1.3.2 Turned-over vehicle to immediate superior.\n1.3.3 Restored work area.\n1.3.4 Managed wastes.\n1.3.5 Checked and stored tools, materials, equipment,\nand parts.\n1.3.6 Accomplished workplace documents.\n1.3.7 Completed required output.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Appropriate Tools & equipment\n2.3 Materials relevant to the activity\n2.4 Manufacturer’s repair manual\n2.5 PPEs\n2.6 Training vehicle\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral questioning\n3.2 Written exam\n3.3 Direct Observation\n4. Context for\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 85 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 81"
