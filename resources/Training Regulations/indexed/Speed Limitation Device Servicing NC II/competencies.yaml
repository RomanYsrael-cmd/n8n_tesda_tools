        "source_text": "--- PDF PAGE 22 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        18 \n \nUNIT OF COMPETENCY \n: \nCONTRIBUTE TO WORKPLACE INNOVATION \n \n \n \nUNIT CODE \n: \n400311214 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to make a pro-active and positive \ncontribution to workplace innovation. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Identify \nopportunities to do \nthings better \n1.1  Opportunities for \nimprovement are \nidentified \nproactively in own \narea of work. \n1.2  Information are \ngathered and \nreviewed which \nmay be relevant to \nideas and which \nmight assist in \ngaining support for \nidea. \n1.1  Roles of \nindividuals in \nsuggesting and \nmaking \nimprovements. \n1.2  Positive impacts \nand challenges in \ninnovation. \n1.3  Types of changes \nand responsibility. \n1.4  Seven habits of \nhighly effective \npeople. \n1.1  Identifying \nopportunities to \nimprove and to \ndo things better. \nInvolvement \n1.2  Identifying the \npositive impacts \nand the \nchallenges of \nchange and \ninnovation \n1.3  Identifying \nexamples of the \ntypes of changes \nthat are within \nand outside own \nscope of \nresponsibility \n2.  Discuss and \ndevelop ideas with \nothers \n2.1  People who could \nprovide input to \nideas for \nimprovements are \nidentified. \n2.2  Ways of \napproaching people \nto begin sharing \nideas are selected. \n2.3  Meeting is set with \nrelevant people. \n2.4  Ideas for follow up \nare review and \nselected based on \nfeedback. \n2.5  Critical inquiry \nmethod is used to \ndiscuss and \ndevelop ideas with \nothers. \n2.1  Roles of \nindividuals in \nsuggesting and \nmaking \nimprovements \n2.2  Positive impacts \nand challenges in \ninnovation \n2.3  Types of changes \nand responsibility. \n2.4  Seven habits of \nhighly effective \npeople \n2.1  Identifying \nopportunities to \nimprove and to \ndo things better. \nInvolvement \n2.2  Identifying the \npositive impacts \nand the \nchallenges of \nchange and \ninnovation \n2.3  Providing \nexamples of the \ntypes of changes \nthat are within \nand outside own \nscope of \nresponsibility \n2.4  Communicating \nideas for change \nthrough small\n\n--- PDF PAGE 23 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        19 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \ngroup \ndiscussions and \nmeetings \n3.  Integrate ideas for \nchange in the \nworkplace \n3.1  Critical inquiry \nmethod is used to \nintegrate different \nideas for change of \nkey people. \n3.2  Summarizing, \nanalyzing and \ngeneralizing skills \nare used to extract \nsalient points in the \npool of ideas. \n3.3  Reporting skills \nare likewise used to \ncommunicate \nresults. \n3.4  Current Issues \nand concerns on \nthe systems, \nprocesses and \nprocedures, as well \nas the need for \nsimple innovative \npractices are \nidentified. \n3.1  Roles of \nindividuals in \nsuggesting and \nmaking \nimprovements \n3.2  Positive impacts \nand challenges in \ninnovation \n3.3  Types of changes \nand responsibility \n3.4  Seven habits of \nhighly effective \npeople \n3.5  Basic research \nskills \n3.1  Identifying \nopportunities to \nimprove and to \ndo things better. \nInvolvement \n3.2  Identifying the \npositive impacts \nand the \nchallenges of \nchange and \ninnovation \n3.3  Providing \nexamples of the \ntypes of changes \nthat are within \nand outside own \nscope of \nresponsibility \n3.4  Communicating \nideas for change \nthrough small \ngroup \ndiscussions and \nmeetings \n3.5  Demonstrating \nskills in analysis \nand \ninterpretation of \ndata\n\n--- PDF PAGE 24 ---\nTR-Speed Limitation Device Servici