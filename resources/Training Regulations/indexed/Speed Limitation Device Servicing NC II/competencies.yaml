\nmeasuring \ninstruments for \naccuracy \n1.9  Reporting and \nsegregating \ndefective \nmeasuring \ninstruments \n2.  Carry out \nmeasurements \nand calculation \n2.1  Automotive \nmeasuring \ninstrument is \nselected to achieve \nrequired outcome in \n2.1  Formulas for \nvolume, areas, \nperimeters of \nplane and \ngeometric figures \n2.1  Performing \ncalculation \n2.2  Applying \nformulas for \nvolume, areas, \nperimeters of\n\n--- PDF PAGE 51 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        47 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nline with job \nrequirements. \n2.2  Accurate \nmeasurements are \nobtained in line with \njob requirements. \n2.3  Calculation \nneeded to complete \nwork tasks are \nperformed using \nmathematical \noperations. \n2.4  Numerical \ncomputation is self-\nchecked and \ncorrected for \naccuracy following \nmanufacturer’s \nworkshop manual. \n2.3  Tools’ limit of \naccuracy are read \nfollowing \nmanufacturer’s \nworkshop manual. \n2.4  Report is submitted \nto immediate \nsupervisor following \nindustry standard \noperating \nprocedure. \n2.5  Safety practices are \napplied following \nOSHS. \n2.2  Different \nautomotive \nmeasuring \ninstruments \n2.3  Calculation & \nmeasurement \n2.4  Four fundamental \noperation \n2.5  Linear \nmeasurement \n2.6  Dimensions \n2.7  Unit conversion \n2.8  Ratio and \nproportion \n2.9  Handling of \nmeasuring \ninstruments \n2.10 Tools’ limit of \naccuracy \n2.11 OSHS \n2.12 PPEs \nplane and \ngeometric figures \n2.3  Handling \nmeasuring \ninstruments \n2.4  Selecting \nautomotive \nmeasuring \ninstruments \n2.5  Obtaining \naccurate \nmeasurements \n2.6  Performing \ncalculation \n2.7  Self-checking \nand correcting \nnumerical \ncomputation \n2.8  Reading tools’ \nlimit of accuracy \n2.9  Applying OSHS \n2.10 Wearing of \nPPEs \n3.  Maintain \nmeasuring \ninstruments \n3.1  Measuring \ninstruments are \nhandled following \nmanufacturer’s \nmanual. \n3.2  Measuring \ninstruments are \ncleaned following \nmanufacturer’s \nmanual. \n3.3  Instruments are \nstored according to \nmanufacturer’s \nspecifications and \nstandard operating \nprocedures. \n3.1  Types of \nmeasuring \ninstruments and \ntheir uses \n3.2  Safe handling \nprocedures in \nusing measuring \ninstruments \n3.3  Four fundamental \noperation of \nmathematics \n3.4  Formula for \nvolume, area, \nperimeter and \nother geometric \nfigures \n3.1  Handling and \nmaintaining \nmeasuring \ninstruments \n3.2  Disposing \nwastes \n3.3  Practicing good \nhousekeeping \n3.4  Applying safety \npractices\n\n--- PDF PAGE 52 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        48 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.4  Safety practices are \napplied. \n3.5  5S of good \nhousekeeping \n3.6  Waste \nmanagement \n3.7  Storing of \nmeasuring \ninstruments \n3.8  OSHS\n\n--- PDF PAGE 53 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        49 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Automotive measuring \ninstruments \nMay include: \n1.1   Torque wrench \n1.2   Vernier caliper \n1.3   Micrometer (inside and outside) \n1.4   Dial gauge \n1.5   Feeler gauge \n1.7   Pitch/thread gauge \n1.8   Multi-tester (analog/digital) \n1.9   Vacuum Gauge \n1.10 Tire depth gauge \n1.11 Battery tester \n1.12 Steel tape \n1.13 Ruler \n2.  Calculation \nMay include: \n2.1   Volume \n2.2   Area \n2.3   Displacement \n2.4   Inside diameter \n2.5   Circumference \n2.6   Length \n2.7   Thickness \n2.8   Outside diameter \n2.9   Taper \n2.10 Out of roundness \n2.11 Voltage \n2.12 Resistance  \n2.13 Current \n2.14 Pressure  \n2.15 Clearance \n2.16 Distortion/run-out \n2.17 Torque conversion \n2.18 Temperature \n3.  Mathematical operations \nIncludes: \n3.1   Addition \n3.2   Subtraction \n3.3   Multiplication \n3.4   Division \n3.5   Fractions \n3.6   Percentages \n3.7   Mixed numbers\n\n--- PDF PAGE 54 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        50 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate perform the \nfollowing: \n1.1   Selected measuring instruments \n1.2   Performed measurements and calculation \n1.3   Maintained measuring instruments \n1.4   Applied safety practices \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Workplace: Real or simulated work area \n2.2   Appropriate Automotive Measuring Tools & equipment \n2.3   Materials relevant to the activity \n2.4   Training vehicle or simulators \n2.5   User’s manual \n2.6   Repair manual \n3.  Method of \nassessment \nCompetency MUST be assessed through: \n3.1   Written exam \n3.2   Demonstration with oral questioning \n3.3   Third party report \n3.4   Interview \n4.  Context of \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or through accredited institution.\n",
