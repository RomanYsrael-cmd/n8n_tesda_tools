        "source_text": "--- PDF PAGE 67 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        63 \n \nCORE COMPETENCY \n \nUNIT OF COMPETENCY \n: \nCONDUCT BASIC INSPECTION OF ENGINE  \nAND OTHER ELECTRICAL COMPONENTS \n \n \n \nUNIT CODE \n: \nALT723382 \n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, and attitude \nneeded in conducting visual inspection of vehicle, \nmaking \nrecommendation \nbased \non \nfindings, \ndetermining tapping points and location for Speed \nLimitation Device, preparing installation plan, and \nperforming documentation. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Check vehicle \n1.1  Job Order Form is \nsecured from \nimmediate superior \nbased on standard \noperating \nprocedure. \n1.2  Electrical wiring \ndiagram is \ninterpreted in \nreference with \nvehicle workshop \nmanual. \n1.3  Visual inspection \nis conducted \nfollowing standard \noperating \nprocedure. \n1.4  Findings are \nreported to \nimmediate superior \nbased on standard \noperating \nprocedure. \n1.5  Recommenda-\ntions are made \nbased on findings. \n1.6  Safety practices are \napplied following \nOccupational \nSafety and Health \nStandards (OSHS). \n1.1  Job order \n1.2  Interpretation of \nElectrical Wiring \nDiagram \n1.3  Procedure in \nchecking vehicles \n1.4  Visual inspection \nof vehicle  \n1.5  Types of Speed \nLimitation Device \n1.6  RA 10916 Road \nSpeed Limiter Act \nof 2016 \n1.7  Occupational \nSafety and Health \nStandards \n(OSHS) \n1.8  RA 4136 Chapter \n4 Article 1 \n(Exempted \nvehicle from \nSpeed Limitation \nDevice module \ninstallation) \n1.9  Procedure in \nreporting findings \n1.10 Speedometer \n1.11 Communication \n1.12 Basic \nmathematics \n1.1  Securing job \norder \n1.2  Interpreting \nElectrical Wiring \nDiagram \n1.3  Conducting \nvisual inspection  \n1.4  