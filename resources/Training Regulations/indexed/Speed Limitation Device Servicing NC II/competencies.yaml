f \nSpeed Limitation \nDevice is tested \nusing test \ncalibration unit \n(TCU) and road \ntest. \n3.2  Vehicle is turned-\nover to immediate \nsuperior for quality \ncontrol following \nworkplace \nprocedure. \n3.3  Work area is \nrestored following \n5S of good \nhousekeeping. \n3.4  Wastes are \nmanaged following \nenvironmental rules \nand regulations. \n3.5  Tools, materials, \nequipment, and \nparts are checked \nand stored \naccording to \nworkplace \nprocedures. \n3.6  Workplace \ndocuments are \naccomplished \naccording to \nworkplace \nprocedures. \n3.7  Required output is \ncompleted as \nspecified by \nimmediate superior \nbased on work. \n3.1  Final inspection \nprocedure \n3.2  Turn-over of \nvehicle \n3.3  Accomplishment \nof repair order \nand other forms \n3.4  Job done \n3.5  OSHS \n3.6  Wearing of 4.6 \nPPEs \n3.7  5S \n3.8  Waste \nmanagement \n3.9  Checking and \nstorage of tools  \n3.10 Workplace \ndocuments \n3.11 IRR of RA 10916 \n“Road Speed \nLimiter Act of \n2016” \n3.12 RA 4136 “Land \nTransportation \nand Traffic Code” \n3.13 RA 2000 “Limited \nAccess Highway \nAct” \n3.14 Factors affecting \nproductivity \n3.15 Productivity work \nmeasurements \n3.16 Ways of \nimproving \nproductivity \n3.17 Adherence to \nwork \nrequirements \n3.1  Accomplishing \nworkplace \ndocumentation. \n3.2  Reporting \ndiagnostic \nfindings and \nmake repair \nrecommend-\ndations \n3.3  Conducting final \ninspection \n3.4  Performing \nvehicle turn-over \n3.5  Restoring work \narea \n3.6  Managing \nwastes \n3.7  Checking and \nstoring tools and \nequipment \n3.8  Wearing of PPEs \n3.9  Applying safety \npractices \n3.10 Accomplishing \nworkplace \ndocuments\n\n--- PDF PAGE 82 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        78 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Job order form \nJob order form includes: \n1.1   Details of vehicle \n1.2   Job request based on the recommendations \n1.3   Approval of superior \n1.4   Recalibration of SLD \n1.5   Replacement of SLD \n1.6   Checking of product warranty card \n2.  Tools, materials, \nequipment, and parts \nTools, materials, equipment, and parts may include: \n \n2.1   Tools \n2.1.1   Measuring tape \n2.1.2   Test and calibration unit \n2.1.3   Sealing pliers with anvil \n2.1.4   Plier cutter \n2.1.5   Combination wrench \n2.1.6   Multi-tester \n2.1.7   Seal grip \n2.1.8   Adjustable wrench \n2.1.9   Socket \n2.1.10 Ratchet \n2.1.11 T-wrench \n2.1.12 Torx wrench \n2.1.13 Wire stripper \n2.1.14 Screw driver \n \n2.2   Materials \n2.2.1   Soldering lead \n2.2.2   Soldering paste \n2.2.3   Liquid gasket \n2.2.4   T-fittings \n2.2.5   Corrugated plastic hose \n2.2.6   Fuel line hose \n2.2.7   Stainless ear clamp \n2.2.8   Electrical tape \n2.2.9   Teflon tape \n2.2.10 Autowire \n2.2.11 Autowire for rear engine  \n2.2.12 Soldering iron \n2.2.13 Terminal eye \n2.2.14 Relief valve assy \n2.2.15 Removable adhesive tape \n2.2.16 Garbage bin \n2.2.17 Rags \n2.2.18 PPEs: \n2.2.18.1   Safety shoes \n2.2.18.2   Hard hat \n2.2.18.3   Arm sleeves\n\n--- PDF PAGE 83 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        79 \nVARIABLE \nRANGE \n2.2.18.4   Safety gloves \n2.2.18.5   Safety googles \n2.2.18.6   Reflectorized vest \n2.2.19 Sample job order \n2.2.20 Installation manual \n \n2.3   Equipment \n2.3.1   Tool Caddy \n2.3.2   Training vehicle \n \n2.4   Parts \n2.4.1   Speed Limitation Device Kit for Electronic \nThrottle Linkage \n2.4.1.1   Speed Limitation Device \n2.4.1.2   Wire for front engine \n2.4.1.3   Cable ties \n2.4.1.4   Sealing wire and lead seal \n2.4.2   Speed Limitation Device Kit for Mechanical \nThrottle Linkage \n2.4.2.1   Speed Limitation Device \n2.4.2.2   Wire for front engine \n2.4.2.3   Cable ties \n2.4.2.4   Sealing wire and lead seal \n2.4.2.5   Solenoid valve and fittings \n2.4.3   Gear box sensor \n2.4.4   Speed sensor \n3.  Workplace documents \nMay include: \n3.1   Job order \n3.1.1   Repair order \n3.1.2   Inspection form \n3.2   Installation report\n\n--- PDF PAGE 84 ---\nTR-Speed Limitation Device Servicing NC II Revision 00        Promulgated        (08/11/2020)        80 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Conducted preparation activities \n1.1.1   Secured accomplished job order form. \n1.1.2   Made close coordination with authorized vehicle \ntechnician. \n1.1.3   Reported actual findings on vehicle. \n1.1.4   Sought approval of immediate superior. \n1.1.5   Prepared and checked tools, materials, equipment, \nand parts. \n1.1.6   Worn PPEs. \n1.2   Performed repair and maintenance \n1.2.1   Replaced Speed Limitation Device. \n1.2.2   Performed recalibration of Speed Limitation Device. \n1.2.3   Accomplished warranty card. \n1.2.4   Used tools, materials, and parts. \n1.2.5   Operated equipment. \n1.2.6   Employed safety measures. \n1.3   Completed work processes \n1.3.1   Tested functionality of Speed Limitation Device. \n1.3.2   Turned-over vehicle to immediate superior. \n1.3.3   Restored work area. \n1.3.4   Managed wastes. \n1.3.5   Checked and stored tools, materials, equipment, \nand parts. \n1.3.6   Accomplished workplace documents. \n1.3.7   Completed required output. \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Workplace: Real or simulated work area \n2.2   Appropriate Tools & equipment \n2.3   Materials relevant to the activity  \n2.4   Manufacturer’s repair manual \n2.5   PPEs \n2.6   Training vehicle \n3.  Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration with Oral questioning \n3.2   Written exam \n3.3   Direct Observation \n4.  Context for \nassessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n",
