        "source_text": "ALT723384\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitudes\nneeded in securing job order, reporting actual\nfindings on vehicle, replacing and recalibrating\nSpeed Limitation Device, conducting road test,\nperforming turn-over of vehicle, and accomplishing\nworkplace documents.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Conduct\npreparation\nactivities\n1.1 Accomplished Job\nOrder Form is\nsecured from\nimmediate superior\nbased on standard\noperating\nprocedure.\n1.2 Close coordination\nwith authorized\nvehicle technician is\ndone based on\nworkplace\nprocedure.\n1.3 Actual findings on\nvehicle is reported\nto immediate\nsuperior based on\nstandard operating\nprocedure.\n1.4 Approval of\nimmediate superior\nis sought prior to\nrepair.\n1.5 Tools, materials,\nequipment, and\nparts are prepared\nand checked based\non work\nrequirements\n1.6 PPEs are worn\nfollowing\nOccupational\nSafety and Health\nStandards (OSHS).\n1.1 Securing job\norder\n1.2 Reporting of\nactual findings on\nvehicle\n1.3 Approval of\nimmediate\nsuperior\n1.4 Coordination with\nauthorized vehicle\ntechnician\n1.5 PPEs\n1.6 Communication\nskills\n1.1 Securing\naccomplished\njob order\n1.2 Performing close\ncoordination with\nauthorized\nvehicle\ntechnician\n1.3 Reporting actual\nfindings on\nvehicle\n1.4 Seeking\napproval of\nimmediate\nsuperior prior to\nrepair\n1.5 Preparing tools,\nmaterials,\nequipment, and\nparts\n1.6 Wearing PPEs\n\n--- PDF PAGE 80 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 76\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Perform\nmaintenance\n2.1 Replacement of\nSpeed Limitation\nDevice is done\nbased on job order\nand standard\noperating\nprocedure.\n2.2 Recalibration of\nSpeed Limitation\nDevice is 