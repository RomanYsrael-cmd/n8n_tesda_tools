        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Checked vehicle\n1.1.1 Interpreted Electrical Wiring Diagram.\n1.1.2 Conducted visual inspection.\n1.1.3 Made recommendations.\n1.1.4 Applied safety practices.\n1.2 Planned installation\n1.2.1 Interpreted installation manual.\n1.2.2 Used electrical wiring diagram.\n1.2.3 Determined tapping points.\n1.2.4 Determined location for Speed Limitation Device.\n1.2.5 Determined location for placement of solenoid\nvalve.\n1.2.6 Selected tools, materials, equipment and parts.\n1.3 Performed documentation\n1.3.1 Prepared Installation/ Repair report.\n1.3.2 Submitted documentations for archiving.\n1.3.3 Completed required output.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Workplace: Real or simulated work area\n2.2 Tools, materials & equipment relevant to perform required\ntasks\n2.3 Manufacturer’s repair manual\n2.4 PPEs\n2.5 Training vehicle\n2.6 First-aid kit\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral questioning\n3.2 Written exam\n3.3 Direct Observation\n4. Context for\nassessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 73 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 69\n\nUNIT OF COMPETENCY\n:\nPERFORM INSTALLATION OF SPEED\nLIMITATION DEVICE\n\nUNIT CODE\n:"
