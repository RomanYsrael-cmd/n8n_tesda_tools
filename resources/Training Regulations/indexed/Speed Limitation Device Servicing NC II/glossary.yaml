  "source_text": "1. CALIBRATION/\nRECALIBRATION\nRefers to setting of frequency of speed limitation device.\n2. CLOSED VAN\nRefers to a large motor vehicle, usually with an enclosed\ncargo space, designed to carry goods for commercial\npurposes, or engaged in services of transporting personal\neffects.\n\nNote: Definition of Terms is based on the IRR Annex B of RA No. 10916\n“Road Speed Limiter Act of 2016”)\n3. COVERED VEHICLE\nRefers to any closed van, hauler or cargo truck, PUV,\nshuttle service, or tanker truck as defined under this section\nand such other vehicles as may hereinafter be determined\nand included by the Department of Transportation and\nCommunications, now the department of Transportation\n(DOTr), for the purpose of applying the provisions of this Act;\nexcluding taxicabs, and public utility jeepneys (PUJs), without\nprejudice to the review by the DOTr after one (1) year on the\nnecessity of their inclusion in the coverage of this Act.\n\nNote: Definition of Terms is based on the IRR Annex B of RA No. 10916\n“Road Speed Limiter Act of 2016”)\n4. ELECTRONIC\nTHROTTLE LINKAGE\nAlso known as drive by wire; engine may be in the front or\nback of vehicle.\n5. HAULER OR CARGO\nTRUCK\nRefers to a motor vehicle designed for transporting heavy or\noversized loads or cargoes.\n\nNote: Definition of Terms is based on the IRR Annex B of RA No. 10916\n“Road Speed Limiter Act of 2016”)\n6. IMMEDIATE\nSUPERIOR\nRefers to Senior Technician or Supervisor.\n7. JOB ORDER\nAlso known as installation report\n8. MECHANICAL\nTHROTTLE LINKAGE\nAlso known as mechanical.\n9. MODULE\nPart of speed limiter device (circuit board)\n10. MOTOR VEHICLE\nRefers to any vehicle propelled by any power other than\nmuscular power using the public highways or roads, but\nexcepting road rollers, trolley cars, street sweepers,\nsprinklers, lawn mowers, bulldozers, graders, fork-lifts,\namphibian trucks, and cranes if not used on public highways\nand vehicles run only on rails or tracks, and tractors, trailers\nand traction engines of all kinds used exclusively for\nagricultural purposes as defined under R.A. No. 4136 Article\nll Section 3.a.\n\nNote: Definition of Terms is based on the IRR Annex B of RA No. 10916\n“Road Speed Limiter Act of 2016”)\n11. PUBLIC UTILITY\nVEHICLE (PUV)\nRefers to a motor vehicle con5idered as a public transport\nconveyance or common carrier duly registered with the Land\nTransportation Office (LTO) and granted a franchise by the\n\n--- PDF PAGE 126 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 122\nLand Transportation Franchising and Regulatory Board\n(LTFRB).\n\nNote: Definition of Terms is based on the IRR Annex B of RA No. 10916\n“Road Speed Limiter Act of 2016”)\n12. REPAIR\nRefers to fixing or returning a part/ component to working\ncondition. It refers to cleaning, adjustment/recalibration, and\nreplacement.\n13. ROAD TEST\nRefers to open road\n14. SHUTTLE SERVICE\nRefers to any motor vehicle provided by government or\nprivate company or establishment whether owned or leased\nfrom another entity, to transport its employees to and from the\nwork premises or clients between designated origin and\ndestination and carrying not less than four (4) passengers.\n\nNote: Definition of Terms is based on the IRR Annex B of RA No. 10916\n“Road Speed Limiter Act of 2016”)\n15. SOLENOID VALVE\nControls the passage of fuel to engine, for mechanical speed\nlimitation device\n16. SPEED LIMITER\nRefers to a device used to limit the top speed of a vehicle\nthrough the employment of mechanical, electronic or\ncommunications system or the combination of these systems\nor similar devices capable of performing the same function\nand issued a Certificate of Conformity by DOTr through DTI.\n\nNote: Definition of Terms is based on the IRR Annex B of RA No. 10916\n“Road Speed Limiter Act of 2016”)\n17. SLD\nRefers to Speed Limitation Devices\nNote: Definition of Terms is based on the Department of Trade\nand\nIndustry\n(DTI)\nLates\nDraft\n2018\nDepartment\nAdministrative Order re: Guidelines for Recognition of\nInstallation Facilities/Installers of Speed Limitation Device\n18. TANKER TRUCK\nRefers to a motor vehicle designated for transporting or\ncarrying gas, oil or liquid, flammable, combustible, corrosive\nor hazardous materials, or substances in bulk such as\nmolasses or water.\n\nNote: Definition of Terms is based on the IRR Annex B of RA No. 10916\n“Road Speed Limiter Act of 2016”)\n\n--- PDF PAGE 127 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 123",
