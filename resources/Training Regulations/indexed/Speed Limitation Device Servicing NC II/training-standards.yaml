ation\n• Awareness on PNS UNR\n89:2016, part 3: Uniform\nprovisions concerning the\napproval of Speed\nLimitation Devices and\nadjustable Speed Limitation\nDevices\n2.1.2 Prepare for installation\n• Lecture\n• Video presentation\n• Demonstration\n• Demonstration\n• Written exam\n• Interview\n2 Hours\n\n--- PDF PAGE 109 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 105\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n2.2 Install Speed\nLimitation\nDevice\n2.2.1 Discuss and explain the\nfollowing:\n• Gear box sensor\n• Gear solenoid valve\n• Vehicle manufacturer’s\nmanual\n• Accessories, miscellaneous,\nand fittings\n• Road test (to determine the\nfunctionality of Speed\nLimitation Device)\no Rolling road\no Open road\n• Calibration (part of road\ntest)\n• Security features\n• Installation procedure\n• Checking of installed Speed\nLimitation Device\n• OSHS\n• Awareness in RA 4136\nChapter IV, Art. I Sec. 35 –\nSpeed Limit\n• Estimation\n• DENR Hazardous wastes\n• Solid waste management\n2.2.2 Install Speed Limitation Device\n• Lecture\n• Video presentation\n• Demonstration\n• Demonstration\n• Written exam\n• Interview\n4 Hours\n\n--- PDF PAGE 110 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 106\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n2.3 Perform post-\nactivities\n2.3.1 Discuss and explain the\nfollowing:\n• Preparation of workplace\ndocuments\n• Warranty card\n• Restoration of workplace\n• Waste management\n• Procedure to turn-over\nvehicle\n• Quality control procedures\n• Checking and storage of\ntools, materials and\nequipment\n• Inventory report\n• Waste management\n• 3Rs\n• Factors affecting\nproductivity\n• Productivity work\nmeasurements\n• Ways of improving\nproductivity\n• Adherence to work\nrequirements\n2.3.2 Perform post-activities\