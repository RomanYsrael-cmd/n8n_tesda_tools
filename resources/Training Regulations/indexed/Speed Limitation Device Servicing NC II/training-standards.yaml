      "source_text": "TESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title:\nSPEED LIMITATION DEVICE\nSERVICING\nNC Level\nNC II\n\nNominal Training Duration:\n37 Hours (Basic Competencies)\n\n122 Hours (Common Competencies)\n\n25 Hours (Core Competencies)\n\n184\n\n93 SIL\n\n277 TOTAL HOURS\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of Speed Limitation Device servicing in accordance with industry\nstandards. It covers core competencies such as: conducting basic inspection of engine\nand other electrical components, performing installation, replacing, and recalibrating\nSpeed Limitation Device.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieve.\n\n--- PDF PAGE 86 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 82\n\nBASIC COMPETENCIES\n37 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures\nand systems\n•\nIdentify:\no Different modes of\ncommunication\no Medium of communication\no Flow of communication\no Available technology relevant\nto the