  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the\nnational qualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has\ndemonstrated competence on all units of competency in a\nqualification with a promulgated Training Regulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in\naccordance with the requirements identified in the relevant unit/s of\ncompetency.\n\n4.1.3 The following are qualified to apply for assessment and certification:\n\na. Graduates of WTR, NTR-registered programs or formal/non-\nformal/informal including enterprise-based trainings related to Speed\nLimitation Device Servicing; and holder of Certificate of Competency\n(COC) in Service Engine Component and Service Electrical\nComponents OR Automotive Servicing (Engine Repair) NC II and\nAutomotive Servicing (Electrical Repair) NC II; or\n\nb. Experienced workers (wage employed or self-employed) who have\nat least two (2) years of experience in Speed Limitation Device\nInstallation and Servicing. A Certificate of Employment and Job\nDescription must be provided as proof.\n\n4.1.4 The industry shall determine assessment and certification\nrequirements for each qualification with promulgated Training\nRegulations. It includes the following:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as by industry\n\n4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life\nexperiences may apply for recognition in a particular qualification\nthrough a recognition/assessment process.\n\n--- PDF PAGE 120 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 116\n\n4.2.\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained prior\nto assessment\n\n4.2.2 Accredited\nAssessment\nCenter.\nOnly\nAssessment\nCenter\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 121 ---\nTR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 117\n\nReceive and respond to\nworkplace communication\nParticipate in workplace\ncommunication\nLead workplace\ncommunication\nUtilize specialized\ncommunication skill\nManage and sustain effective\ncommunication strategies\nWork with others\nWork in a team environment\nLead small teams\nDevelop and lead teams\nManage and sustain high\nperforming teams\nSolve/address routine\nproblems\nSolve/address general\nworkplace problems\nApply critical thinking and\nproblem solving techniques in\nthe workplace\nPerform higher-order thinking\nprocesses and apply\ntechniques in the workplace\nEvaluate higher order thinking\nskills and adjust problem\nsolving techniques\nEnhance self-management\nskills\nDevelop career and life\ndecisions\nWork in a diverse\nenvironment\nContribute to the practice of\nsocial justice in the workplace\nAdvocate strategic thinking\nfor global citizenship\nSupport innovation\nContribute to workplace\ninnovation\nPropose methods of applying\nlearning and innovation in the\norganization\nManage innovative work\ninstructions\nIncorporate innovation into\nwork procedures\nAccess and maintain\ninformation\nPresent relevant information\nUse information\nsystematically\nManage and evaluate usage\nof information\nDevelop systems in\nmanaging, and maintaining\ninformation\nFollow occupational safety\nand health policies and\nprocedures\nPractice occupational safety and\nhealth policies and procedures\nEvaluate occupational safety\nand health work practices\nLead in improvement of\noccupational safety and\nhealth program, policies and\nprocedures\nManage implementation of\nOSH programs in the\nworkplace\nApply environmental work\nstandards\nExercise efficient and effective\nsustainable practices in the\nworkplace\nEvaluate environmental work\npractices\nLead towards improvement of\nenvironmental work\nprograms, policies and\nprocedures\nManage implementation of\nenvironmental programs in\nthe workplace\nAdopt entrepreneurial\nmindset in the workplace\nPractice entrepreneurial skills in\nthe workplace\nFacilitate entrepreneurial\nskills for micro-small-medium\nenterprises (MSMEs)\nSustain entrepreneurial skills\n\nDevelop and sustain a high-\nperforming enterprise\n\n"
