      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. TR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 117 Receive and respond to workplace communication Participate in workplace communication Lead workplace communication Utilize specialized communication skill Manage and sustain effective communication strategies Work with others Work in a team environment Lead small teams Develop and lead teams Manage and sustain high performing teams Solve/address routine problems Solve/address general workplace problems Apply critical thinking and problem solving techniques in the workplace Perform higher-order thinking processes and apply techniques in the workplace Evaluate higher order thinking skills and adjust problem solving techniques Enhance self-management skills Develop career and life decisions Work in a diverse environment Contribute to the practice of social justice in the workplace Advocate strategic thinking for global citizenship Support innovation Contribute to workplace innovation Propose methods of applying learning and innovation in the organization Manage innovative work instructions Incorporate innovation into work procedures Access and maintain information Present relevant information Use information systematically Manage and evaluate usage of information Develop systems in managing, and maintaining information Follow occupational safety and health policies and procedures Practice occupational safety and health policies and procedures Evaluate occupational safety and health work practices Lead in improvement of occupational safety and health program, policies and procedures Manage implementation of OSH programs in the workplace Apply environmental work standards Exercise efficient and effective sustainable practices in the workplace Evaluate environmental work practices Lead towards improvement of environmental work programs, policies and procedures Manage implementation of environmental programs in the workplace Adopt entrepreneurial mindset in the workplace Practice entrepreneurial skills in the workplace Facilitate entrepreneurial skills for micro-small-medium enterprises (MSMEs) Sustain entrepreneurial skills Develop and sustain a high- performing enterprise"
