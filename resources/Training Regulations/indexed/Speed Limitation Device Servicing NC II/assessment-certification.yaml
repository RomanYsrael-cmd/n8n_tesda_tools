      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence on all units of competency in a qualification with a promulgated Training Regulations. 4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the relevant unit/s of competency. 4.1.3 The following are qualified to apply for assessment and certification: a. Graduates of WTR, NTR-registered programs or formal/non- formal/informal including enterprise-based trainings related to Speed Limitation Device Servicing; and holder of Certificate of Competency (COC) in Service Engine Component and Service Electrical Components OR Automotive Servicing (Engine Repair) NC II and Automotive Servicing (Electrical Repair) NC II; or b. Experienced workers (wage employed or self-employed) who have at least two (2) years of experience in Speed Limitation Device Installation and Servicing. A Certificate of Employment and Job Description must be provided as proof. 4.1.4 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations. It includes the following: a. Entry requirements for candidates b. Evidence gathering methods c. Qualification requirements of competency assessors d. Specific assessment and certification arrangements as by industry 4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through a recognition/assessment process. TR-Speed Limitation Device Servicing NC II Revision 00 Promulgated (08/11/2020) 116"
