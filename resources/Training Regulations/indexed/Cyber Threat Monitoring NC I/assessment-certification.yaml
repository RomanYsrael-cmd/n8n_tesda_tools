      "number": "8",
      "text": "CERT - Computer Emergency Response Team (CERT) or Computer Security and Incident Response Team (CSIRT) refers to “an organization that studies computer and network security in order to provide incident response services to victims of attacks, publish alerts concerning vulnerabilities and threats, and to offer other information to help improve computer and network security”. At present, “both terms (CERT and CSIRT) are used in a synonymous manner” (ENISA, 2015 and ENISA, 2015a)."
