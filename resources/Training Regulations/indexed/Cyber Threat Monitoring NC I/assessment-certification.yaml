      "number": "4",
      "text": "1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "number": "4.1",
      "text": "1 To attain the National Qualification of Cyber Threat Monitoring NC I, the candidate must demonstrate competency in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate Level I signed by the TESDA Director General."
    },
    {
      "number": "4.1",
      "text": "2 The qualification of Cyber Threat Monitoring NC I may be attained through demonstration of competence through a single comprehensive project-type assessment covering all required units of competency of this qualification."
    },
    {
      "number": "4.1",
      "text": "3 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency."
    },
    {
      "number": "4.1",
      "text": "4 Any of the following are qualified to apply for assessment and certification:"
    },
    {
      "number": "4.1",
      "text": "4.1 Graduates of WTR-registered program, RTP-registered programs or formal/non-formal/informal including enterprise-based trainings related to cyber threat or mitigation courses and/or programs."
    },
    {
      "number": "4.1",
      "text": "4.2 Experienced workers (wage employed or self-employed)"
    },
    {
      "number": "4.1",
      "text": "5 The conduct of assessment and issuance of certificates shall follow the operation procedure and implementing guidelines developed for the purpose."
    },
    {
      "number": "4.1",
      "text": "6 The guidelines on assessment and certification are discussed in detail in the \"Procedures Manual on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)\"."
    },
    {
      "number": "4",
      "text": "2 COMPETENCY ASSESSMENT REQUISITE"
    },
    {
      "number": "4.2",
      "text": "1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre- assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. --- PDF PAGE 81 --- _______________________________________________________________________________________________ TR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 81 This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment"
    },
    {
      "number": "4.2",
      "text": "2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to manage the assessment activities of candidates for national certification."
    },
    {
