sing\ncomputer system\n▪ Identify types and function of computer\nperipheral devices\n▪ Print and scan office documents and\nmaterials\n▪ Send office/ business documents through\nfacsimile\n▪ Transfer files or data between compatible\nsystems using computer software,\nhardware/ peripheral devices\n▪ Save documents in storage devices\na. CD/DVD\nb. USB drives\nc. Hard disk drives\n▪ Lecture\n▪ Group discussion\n▪ Modular\n▪ On the job\ntraining\n\n▪ Written/Oral\nexamination\n▪ Practical\ndemonstration\n\n5 hour\n2.5. Maintain computer\nequipment and\nsystems\n▪ Perform computer equipment/ system\nbasic maintenance procedures\na. Perform basic file maintenance\nprocedures\nb. Perform cleaning of PC parts/\nhardware components\nc. Scan/Debug computer software and\napplications\nd. Perform cleaning and defragmentation\nof computer files\ne. Perform backup of computer files\n▪ Enumerate and define different types of\ncomputer viruses\n▪ Demonstration\n▪ Simulation\n▪ Modular\n▪ Video clips\n▪ Computer based\ntraining (e-\nlearning)\n\n▪ Written/Oral\nexamination\n▪ Practical\ndemonstration\n\n2 hours\n\n--- PDF PAGE 71 ---\n_____________________________________________________________________________________\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n 71\nCORE COMPETENCIES\n196 hours + 120 hours (SIL)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Monitor and\nreport cyber\nthreats\n\n(100 hrs)\n1.1. Check for alerts\n● Lecture and discussion on:\no Introduction to Operating\nSystem (PC and Mobile) i.e.\nPC: Windows, macOS, Linux\n(Ubuntu)\nMobile: Android, iOS\no Introduction to Web server and\nwebsite design and\narchitecture\no Introduction to any of the\nfollowing: Program logic\nformulation, scripting and\ncoding language, i.e.\n-\nC and Python\n-\nbash scripting\n-\nPowerShell\no Introduction to with network\ninfrastructure and architecture,\ni.e. LAN, WA