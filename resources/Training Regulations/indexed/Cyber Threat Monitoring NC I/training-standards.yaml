s\no Checklist compliance on scanning\nprocedures\no Checklist of scanned assets\nsystems performance\no Checklist on vulnerability\nmanagement emergency criteria\n● Simulation of vulnerability scanning on\nactual assets\n● Simulation of high CPU and storage\nusage\n● Simulation of network disruption\n● Simulation of vulnerability software\nmanagement operation on emergency\ncriteria\n● Lecture/ Discussion\n● Hands on Exercises\n● Demonstration\n● Viewing multimedia\n● Computer Guided\nActivities\n● Written exam\n● Practical exam\n● Observation in\nworkplace\n● Interviews/\nquestioning\n32 hours\n\n--- PDF PAGE 74 ---\n_____________________________________________________________________________________\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n 74\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n2.3. Provide report of\nscanning\n● Simulation of vulnerability scanning\ndocumentation and reporting\n● Simulation in creating ticket per\nsuccessful vulnerability scanning\n● Simulation in creating ticket for an\nincident cause by vulnerability scanning\n● Lecture/ Discussion\n● Hands on Exercises\n● Demonstration\n● Viewing multimedia\n● Computer Guided\nActivities\n● Written exam\n● Practical exam\n● Observation in\nworkplace\n● Interviews/\nquestioning\n32 hours\n\nSupervised Industry Learning\n\n60 hours\n\nNote:\nThe Supervise Industry Learning (SIL) component may be implemented in flexible manner. It may be integrated within various modules or units of competency or at the end of\nthe in-school or classroom training. Actual hands on / immersion can be conducted in the partner industry/ company through the supervision of the designated industry focal.\n\n--- PDF PAGE 75 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n75\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology (video conferencing, webinar,\netc.).\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities and their variations/\ncomponents may be adopted singly or in combination with other modalities when\ndesigning and delivering training programs:\n\n2.1 Institution- Based:\n\n● Dual Training System (DTS)/ Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n● Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n\n● Supervised Industry Learning (SIL) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\nthe deployment of trainees in the workplace is adhered to training programs\nagreed by the institution and enterprise and status and progress of trainees\nare closely monitored by the training institutions to prevent opportunity for\nwork exploitation.\n\n--- PDF PAGE 76 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n76\n● The classroom-based or in-center instruction uses learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n● Formal Apprenticeship is training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n● Informal Apprenticeship is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits\nto contributing productively to the work of the business. Training is integrated\ninto the production process and apprentices learn by working alongside the\nexperienced craftsperson.\n\n● Enterprise-based Training where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based:\n\n● Community-Based Training is short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other TVET\nproviders which are intended to address the specific needs of a community.\nSuch programs can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training program\n(MTP).\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n●\nMust have completed basic education or its equivalent as per existing\nDepEd policies and regulations\n●\nHas the capacity to communicate in any form\n●\nMust know how to use and operate a computer and mobile device on the\nmost current Operating System (OS)\n●\nPhysically able to manipulate a computer input device\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience and others that may be required from the\ntrainees by the school or training center delivering the TVET program.\n\n--- PDF PAGE 77 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n77\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 20 trainees\nfor Cyber Threat Monitoring NC I are as follows:\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used as\nalternatives. This also applies in consideration of community practices and their\navailability in the local market.\n\nTOOLS\nQty.\nUnit\nDescription/Specification\n1\nunit\nSecurity information and event management (SIEM)\nsoftware/solution*\n\nNote: Must be compatible with the ticketing system, security solution and\nvulnerability scanning tools\n1\nunit\nCybersecurity 