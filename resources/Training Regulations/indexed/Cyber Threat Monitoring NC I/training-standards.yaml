nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology (video conferencing, webinar,\netc.).\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities and their variations/\ncomponents may be adopted singly or in combination with other modalities when\ndesigning and delivering training programs:\n\n2.1 Institution- Based:\n\n● Dual Training System (DTS)/ Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n● Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n\n● Supervised Industry Learning (SIL) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\nthe deployment of trainees in the workplace is adhered to training programs\nagreed by the institution and enterprise and status and progress of trainees\nare closely monitored by the training institutions to prevent opportunity for\nwork exploitation.\n\n--- PDF PAGE 76 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n76\n● The classroom-based or in-center instruction uses learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n● Formal Apprenticeship is training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n● Informal Apprenticeship is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits\nto contributing productively to the work of the business. Training is integrated\ninto the production process and apprentices learn by working alongside the\nexperienced craftsperson.\n\n● Enterprise-based Training where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based:\n\n● Community-Based Training is short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other TVET\nproviders which are intended to address the specific needs of a community.\nSuch programs can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training program\n(MTP).\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n●\nMust have completed basic education or its equivalent as per existing\nDepEd policies and regulations\n●\nHas the capacity to communicate in any form\n●\nMust know how to use and operate a computer and mobile device on the\nmost current Operating System (OS)\n●\nPhysically able to manipulate a computer input device\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience and others that may be required from the\ntrainees by the school or training center delivering the TVET program.\n\n--- PDF PAGE 77 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n77\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 20 trainees\nfor Cyber Threat Monitoring NC I are as follows:\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used as\nalternatives. This also applies in consideration of community practices and their\navailability in the local market.\n\nTOOLS\nQty.\nUnit\nDescription/Specification\n1\nunit\nSecurity information and event management (SIEM)\nsoftware/solution*\n\nNote: Must be compatible with the ticketing system, security solution and\nvulnerability scanning tools\n1\nunit\nCybersecurity Ticketing System Software*\n\nNote: Must be compatible with the SIEM\n1\nunit each\nEnterprise or Corporate level Security solution Applications (with\naccess to the management console to the security solution with\nprovision of storage) *\n1.1. Next Generation Anti-Virus (AV)\n1.2. Next Generation Firewall\n1.3. Endpoint Detection and Response (EDR)\n\nNote: Must be compatible with the SIEM\n21\nunits\nVirtualization Applications*\n21\nunits\nVulnerability Scanning Tools Software*\n\nNote: Must be compatible with the SIEM\n21\nunits\nOffice Productivity Tools*\n1\nunit\nInternet access, 50Mbps or higher\n1\npc\n1 TB External hard drive or higher\n1\nunit\nRouter, LAN or WiFi\n1\nunit\nSwitch, 32 ports or higher\n3\npcs\nWhite board eraser, magnetic\n3\nboxes\nWhite board marker, assorted colors\n1\nunit\nVirtual storage for SIEM image, TDR, DLP, NGAV, other security\nsolutions\n\n* Can be either educational, licensed or open-source software\n** Must not be open-source software\n\nEQUIPMENT\nQty.\nUnit\nDescription/Specification\n21\nunits\nDesktop computer, (software dependent specifications) with\nmouse and keyboard\nProcessor : i7 8th Gen Core Processor or its equivalent\nand/or higher version\nMemory\n : 16 GB DDR4 or higher\nStorage\n : 512 GB SSD 2.5 inch\nGraphics : Integrated HD Graphics or external VGA card\n\n--- PDF PAGE 78 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n78\nAccessories : Mouse and Keyboard\nOperating System : Win 11 Pro 64 Bit or Linux OS\n1\nunit\nServer computer\nProcessor : i7 8th Gen Core Processor or its equivalent\nand/or higher version\nMemory\n : 64 GB DDR4 or higher\nStorage\n : 1 TB SSD 2.5 inch\nGraphics : Integrated HD Graphics or external VGA card\nAccessories : Mouse and Keyboard\nOperating System : Win 11 Pro 64 Bit or Linux OS\n1\nunit\nLCD Projector and screen\n1\nunit\nPrinter\n1\nunit\nWhite board and / or glass board\n21\nsets\nErgonomic computer tables and chairs\n\nMATERIALS\nQty.\nUnit\nDescription/Specification\n21\npcs\nHand-outs\n21\npcs\nPractice materials\n1\npc\nVideo learning materials\nAs\nneeded\npcs\nReference books/materials\n1\nream\nBond paper, A4\n\nDue to the fast-changing nature of the Information and Communications Technology\n(ICT) sector, TVET providers are reminded to use and provide their trainees with the latest\ntechnology tools, equipment and materials where appropriate and applicable.\n\n--- PDF PAGE 79 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n79\n\n3.5\nTRAINING FACILITIES\n\nBased on class size of 20 students/trainees the space requirements for\n\nthe teaching/learning and circulation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nComputer/ Laboratory/ Lecture\nArea\n7 x 8\n56\n1\n56\nLearning Resource Area\n3 x 5\n15\n1\n15\nWash & Toilet Area\n2 x 2\n4\n2\n8\n Total\n79\nFacilities / Equipment / Circulation**\n24\nTotal Area\n103\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\nAppropriate consideration should be given in providing and allocating workspace,\ncommunications facilities, and the usual workplace amenities to ensure a proper learning\nenvironment. Where applicable, training shall be held or conducted in learning facilities in\naccordance with generally accepted industry standards and practice.\n\n3.6\nTRAINERS QUALIFICATIONS\n\n1. Must be a holder of National TVET Trainer Certificate (NTTC) level I in Cyber\nThreat Monitoring NC I or higher;\n2. Must have one of the following work/industry experiences:\n• Three (3) years of relevant industry experience as a cybersecurity\npractitioner or computer security support professional within the last five (5)\nyears.\n• One (1) year of paid work experience in a Security Operations Center\n(SOC) as an intermediate cybersecurity professional within the last three\n(3) years and certified by an official cybersecurity certification organization.\n3. Must have a valid NBI Clearance\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency. It is recommended that a comprehensive written examination\ncovering the basic, common and core competencies be administered at the end of\nthe training.\n\n--- PDF PAGE 80 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n80"
