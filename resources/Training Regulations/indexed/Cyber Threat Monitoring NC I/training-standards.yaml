ite board and / or glass board\n21\nsets\nErgonomic computer tables and chairs\n\nMATERIALS\nQty.\nUnit\nDescription/Specification\n21\npcs\nHand-outs\n21\npcs\nPractice materials\n1\npc\nVideo learning materials\nAs\nneeded\npcs\nReference books/materials\n1\nream\nBond paper, A4\n\nDue to the fast-changing nature of the Information and Communications Technology\n(ICT) sector, TVET providers are reminded to use and provide their trainees with the latest\ntechnology tools, equipment and materials where appropriate and applicable.\n\n--- PDF PAGE 79 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n79\n\n3.5\nTRAINING FACILITIES\n\nBased on class size of 20 students/trainees the space requirements for\n\nthe teaching/learning and circulation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nComputer/ Laboratory/ Lecture\nArea\n7 x 8\n56\n1\n56\nLearning Resource Area\n3 x 5\n15\n1\n15\nWash & Toilet Area\n2 x 2\n4\n2\n8\n Total\n79\nFacilities / Equipment / Circulation**\n24\nTotal Area\n103\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\nAppropriate consideration should be given in providing and allocating workspace,\ncommunications facilities, and the usual workplace amenities to ensure a proper learning\nenvironment. Where applicable, training shall be held or conducted in learning facilities in\naccordance with generally accepted industry standards and practice.\n\n3.6\nTRAINERS QUALIFICATIONS\n\n1. Must be a holder of National TVET Trainer Certificate (NTTC) level I in Cyber\nThreat Monitoring NC I or higher;\n2. Must have one of the following work/industry experiences:\n• Three (3) years of relevant industry experience as a cybersecurity\npractitioner or computer security support professional within the last five (5)\nyears.\n• One (1) year of paid work experience in a Security Operations Center\n(SOC) as an intermediate cybersecurity professional within the last three\n(3) years and certified by an official cybersecurity certification organization.\n3. Must have a valid NBI Clearance\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency. It is recommended that a comprehensive written examination\ncovering the basic, common and core competencies be administered at the end of\nthe training.\n\n--- PDF PAGE 80 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n80"
