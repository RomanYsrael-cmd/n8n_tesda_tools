em\n\n3.4 Communicate\naction plans and\nrecommendations\nto routine\nproblems\n● Show mastery of the current industry\nhardware and software products and\nservices\n- Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n- Relevant equipment and operational\nprocesses\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n● Use range of formal problem-solving\ntechniques (e.g., planning, attention,\nsimultaneous and successive processing\nof information)\n● Group discussion\n● Lecture\n● Demonstration\n● Role playing\n● Case Formulation\n● Life Narrative\nInquiry (Interview)\n● Standardized test\n1 Hour\n\n--- PDF PAGE 62 ---\n_____________________________________________________________________________________\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n 62\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n● Identify and clarify the nature of the\nproblem\n4. Enhance Self-\nManagement\nSkills\n\n4.1 Set personal and\ncareer goals\n● Define and set personal goals and career\ngoals\n● Describe the SMART Model for goal\nsetting\n● Create personal and career goals using\nSMART Model for goal setting\n● Explain and apply the principles of goal\nsetting according to Locke & Latham\n● Discussion\n● Making of\npersonal and\ncareer goals by\nstudents\n● Brainstorming\n● Demonstration or\nsimulation with oral\nquestioning\n● Case problems\ninvolving workplace\ndiversity issues\n\n1 Hour\n4.2 Recognize\nemotions\n● Identify common positive and negative\nemotions manifested in the workplace\n● Distinguish professional and non-\nprofessional behaviors in the workplace\n● Recognize triggers and implications of\npositive and negative emotions in the\nworkplace\n● Respond with appropriate emotions and\nidentify possible consequences of\ninappropriate emotional responses in a\nsocial and work-related context\n● Discussion\n● Interactive Lecture\n● Brainstorming\n● Demonstration or\nsimulation with oral\nquestioning\n● Case problems\ninvolving workplace\ndiversity issues\n\n1 Hour\n4.3 Describe oneself\nas a learner\n● Review Kolb’s Theory of Learning Styles\n● Describe VAK Learning Style Model\n(Visual, Auditory, Kinesthetic)\n● Cite learning strategies appropriate to\nspecific tasks and describe work practices\nthat assist learning\n● Identify factors and strategies that assist\nlearning\n● Apply learning styles to positively influence\nschool/work performance\n● Use appropriate learning strategies to\nimprove study habits and learning\n● Discussion\n● Interactive Lecture\n● Brainstorming\n● Simulation\n● Demonstration or\nsimulation with oral\nquestioning\n● Case problems\ninvolving workplace\ndiversity issues\n\n1 Hour\n\n--- PDF PAGE 63 ---\n_____________________________________________________________________________________\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n 63\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5. Support\nInnovation\n5.1 Identify the need\nfor innovation in\none’s area of\nwork\n● Show mastery of the clear-cut definition of\ninnovation and its characteristics\n● Identify the need for innovation in one’s\nwork area\n● Identify work procedures needing change\n● Contribute to brainstorming sessions with\nco-workers on identifying tasks needing\nchange\n● Interactive Lecture\n● Appreciative\nInquiry\n● Demonstration\n● Group work\n● Psychological and\nbehavioral\nInterviews\n● Performance\nEvaluation\n● Life Narrative\nInquiry\n● Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n● Standardized\nassessment of\ncharacter strengths\nand virtues applied\n1 Hour\n5.2 Recognize\ninnovative and\ncreative ideas\n\n● Identify resources needed for change and\npotential obstacles as well\n● Show positive attitudes and behaviors in\naccepting and in needing change in one’s\nwork area\n● Delineate differences between creativity\nand innovation\n● Interactive Lecture\n● Appreciative\nInquiry\n● Demonstration\n● Group work\n● Psychological and\nbehavioral\nInterviews\n● Performance\nEvaluation\n● Life Narrative\nInquiry\n● Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n● Standardized\nassessment of\ncharacter strengths\nand virtues applied\n1 Hour\n\n--- PDF PAGE 64 ---\n_____________________________________________________________________________________\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n 64\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.3 Support\nindividuals’ access\nto flexible and\ninnovative ways of\nworking\n● Identify different roles of\nemployees/workers in the improvement of\npractices in the organization\n● Identify practices for flexible and innovative\nways of working\n● Share information with co-workers\n● Detect potential problems in implementing\nflexible ways of working\n\n● Interactive Lecture\n● Appreciative\nInquiry\n● Demonstration\n● Group work\n● Psychological and\nbehavioral\nInterviews\n● Performance\nEvaluation\n● Life Narrative\nInquiry\n● Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n● Standardized\nassessment of\ncharacter strengths\nand virtues applied\n● Review of portfolios\nof evidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n● Standardized\nassessment of\ncharacter strengths\nand virtues applied\n\n1 Hour\n6. Access and\nmaintain\ninformation\n\n6.1 Identify and\ngather needed\ninformation\n● Lecture and discussion on:\n- Policies, procedures and guidelines\nrelating to information handling in the\npublic and private sector, including\nconfidentiality, privacy, security,\nfreedom of information\n● Lecture\n● Demonstration\n● Practical exercises\n● Oral evaluation\n● Written Test\n● Observation\n3 Hours\n\n--- PDF PAGE 65 ---\n_____________________________________________________________________________________\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n 65\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n- Data collection and management\nprocedures\n- Public/private sector standards\n● Identify sources to produce required\ninformation\n● Perform exercises on information\ngathering\n\n6.2 Search for\ninformation on\nthe internet or an\nintranet\n● Lecture and discussion on:\n- Techniques in finding useful\ninformation\n- Search engines for information\n● Find and select appropriate information\n● Perform information searching on the\ninternet using different search engines\n● Group discussion\n● Lecture\n● Demonstration\n● Practical exercises\n● Oral evaluation\n● Written Test\n● Observation\n● Presentation\n2 Hours\n6.3 Examine\ninformation\n● Lecture and discussion on:\n- Data evaluation procedures\n- Cultural aspects of information and\nmeaning\n- Sources of public sector work-related\ninformation\n● Evaluation of searched information\n● Group discussion\n● Lecture\n● Demonstration\n● Practical exercises\n● Oral evaluation\n● Written Test\n● Observation\n● Presentation\n2 Hours\n6.4 Secure\ninformation\n● Lecture and discussion on:\n- Basic file-handling techniques\n- Techniques in handling, organizing\nand saving files\n- Electronic and manual filing systems\n● Performance of basic file-handling\ntechniques\n● Application of electronic and manual filing\nsystems\n● Group discussion\n● Lecture\n● Demonstration\n● Role Play\n● Practical exercises\n● Oral evaluation\n● Written Test\n● Observation\n● Presentation\n3 Hours\n6.5 Manage\ninformation\n● Lecture and discussion on:\n- Organizational information handling\nand storage procedures\n- Databases and data storage systems\n● Group discussion\n● Lecture\n● Demonstration\n● Practical exercises\n● Oral evaluation\n● Written Test\n● Observation\n● Presentation\n2 Hours\n\n--- PDF PAGE 66 ---\n_____________________________________________________________________________________\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n 66\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n● Managing databases and data storage\nsystems\n7. Follow\nOccupational\nSafety And\nHealth\nPolicies And\nProcedures\n7.1 Identify relevant\noccupational\nsafety and health\npolicies and\nprocedures\n● Discussion of Risks and Hazards\n● Risk and Hazard Identification\n\n● Lecture\n● Group Discussion\n\n● Written Exam\n● Demonstration\n● Observation\n● Interviews /\nQuestioning\n2 Hours\n7.2 Perform relevant\noccupational\nsafety and health\nprocedures\n● Demonstration of proper use of Personal\nProtective Equipment and Materials\nHandling\n● Practice Emergency Plan\n● Lecture\n● Group Discussion\n\n● Written Exam\n● Demonstration\n● Observation\n● Interviews /\nQuestioning\n2 Hours\n7.3 Comply with\nrelevant\noccupational\nsafety and health\npolicies and\nstandards\n● Discussion on Personal Hygiene and\nPreventive Control Measures\n● Practice 5S and waste segregation\n● Lecture\n● Group Discussion\n\n● Written Exam\n● Demonstration\n● Observation\n● Interviews /\nQuestioning\n4 Hours\n8. Apply\nEnvironmental\nWork Standards\n8.1 Identify\nenvironmental\nwork hazards\n● Discussions in\n- Reduction in greenhouse gas\nemissions,\n- Increase the share of renewables of\ngross final energy consumption,\n- Long-term reduction of energy\nconsumption\n- Release of materials into the\nenvironment should, in the long run,\nnot exceed the adaptability of the eco-\nsystem,\n- Dangers and unjustifiable risks to\nhuman health\n- Energy and natural resource\nconsumption and the provision of\ntransport services\n● Lecture\n● Group Discussion\n\n● Written Exam\n● Demonstration\n● Observation\n● Interviews /\nQuestioning\n1 Hour\n\n--- PDF PAGE 67 ---\n_____________________________________________________________________________________\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n 67\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n8.2 Follow\nenvironmental\nwork procedures\n● Discussions Protection against\n- Human Dangers\n- Overconsumption of Resources\n- Destruction of Ecosystems\n- Habitat Destructions\n- Extinction of Wildlife\n- Pollutions\n- Water Degradation\n● Lecture\n● Group Discussion\n● Demonstration\n\n● Written Exam\n● Demonstration\n● Observation\n● Interviews /\nQuestioning\n1 Hour\n8.2 Comply with\nenvironmental\nwork\nrequirements\n● Discussions Environmental Regulations\nand its requirements relevant to the\nindustry and work activities\n● Demonstration and Practice Environmental\nCompliance\n● Lecture\n● Group Discussion\n● Demonstration\n\n● Written Exam\n● Demonstration\n● Observation\n● Interviews /\nQuestioning\n1 Hour\n9. Adopt\nEntrepreneurial\nMindset in the\nWorkplace\n9.1 Determine\nentrepreneurial\nmindset\n● Discussion on Entrepreneurial Mindset\n● Games to develop entrepreneurial mind\nset\n● Lecture\n● discussion\n● Games\n● Written Test\n● Role play\n2 Hours\n9.2 Identify\nentrepreneurial\npractices\n● Case study- quality assurance practices\n● Discussion on cost effective measures\n● Discussion on Workplace quality Policy\n● Case study\n● Lecture discussion\n● Written Test\n● Case Study\n1 Hour\n\n--- PDF PAGE 68 ---\n_____________________________________________________________________________________\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n 68\nCOMMON COMPETENCIES\n28 hrs\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Apply Quality\nStandards\n1.1. Assess quality of\nreceived materials\n\n▪ Identify relevant production processes,\nmaterials and products\n▪ Study and interpret characteristics of\nmaterials, software and hardware used in\nproduction processes\n▪ Perform quality checking procedures\n▪ Apply quality Workplace procedures\n▪ Identify faulty materials\n▪ Check quality of materials or component\nparts as per manufacturer’s standards\n▪ Interpret specifications or symbols\n▪ Lecture\n▪ Field trip\n▪ Symposium\n▪ Video clips\n▪ Simulation/ Role\nplaying\n\n▪ Written test\n▪ Demonstration &\nquestioning\n▪ Observation &\nquestioning\n\n3 hours\n1.2. Assess own work\n▪ Perform workplace procedure in\ndocumenting completed work\n▪ Perform fault identification and reporting\n▪ Observe safety and environmental\naspects of production processes\n▪ Utilize workplace quality indicators\n▪ Document and report deviations from\nspecified quality standards\n▪ Field trip\n▪ Symposium\n▪ Simulation\n▪ On the job\ntraining\n\n▪ Demonstration &\nquestioning\n▪ Observation &\nquestioning\n\n3 hours\n1.3. Engage in quality\nimprovement\n▪ Participate in quality improvement\nprocesses\na. IEC/ISO standards\nb. Environmental and safety standards\n▪ Carry out work as per process\nimprovement procedures\n▪ Monitor operation performance\n▪ Implement continuous improvement\n▪ Field trip\n▪ Symposium\n▪ Simulation\n▪ On the job\ntraining\n▪ Demonstration &\nquestioning\n▪ Observation &\nquestioning\n\n2 hours\n2. Perform\nComputer\nOperations\n2.1. Plan and prepare\nfor task to be\nundertaken\n▪ Plan and prepare computer operation\nactivity\n▪ Determine task requirements based on\nrequired output\n▪ Lecture\n▪ Modular\n▪ Written/Oral\nexamination\n▪ Practical\ndemonstration\n4 hours\n\n--- PDF PAGE 69 ---\n______________________________________