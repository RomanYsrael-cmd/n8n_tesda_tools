      "source_text": ", EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 20 trainees\nfor Cyber Threat Monitoring NC I are as follows:\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used as\nalternatives. This also applies in consideration of community practices and their\navailability in the local market.\n\nTOOLS\nQty.\nUnit\nDescription/Specification\n1\nunit\nSecurity information and event management (SIEM)\nsoftware/solution*\n\nNote: Must be compatible with the ticketing system, security solution and\nvulnerability scanning tools\n1\nunit\nCybersecurity Ticketing System Software*\n\nNote: Must be compatible with the SIEM\n1\nunit each\nEnterprise or Corporate level Security solution Applications (with\naccess to the management console to the security solution with\nprovision of storage) *\n1.1. Next Generation Anti-Virus (AV)\n1.2. Next Generation Firewall\n1.3. Endpoint Detection and Response (EDR)\n\nNote: Must be compatible with the SIEM\n21\nunits\nVirtualization Applications*\n21\nunits\nVulnerability Scanning Tools Software*\n\nNote: Must be compatible with the SIEM\n21\nunits\nOffice Productivity Tools*\n1\nunit\nInternet access, 50Mbps or higher\n1\npc\n1 TB External hard drive or higher\n1\nunit\nRouter, LAN or WiFi\n1\nunit\nSwitch, 32 ports or higher\n3\npcs\nWhite board eraser, magnetic\n3\nboxes\nWhite board marker, assorted colors\n1\nunit\nVirtual storage for SIEM image, TDR, DLP, NGAV, other security\nsolutions\n\n* Can be either educational, licensed or open-source software\n** Must not be open-source software\n\nEQUIPMENT\nQty.\nUnit\nDescription/Specification\n21\nunits\nDesktop computer, (software dependent specifications) with\nmouse and keyboard\nProcessor : i7 8th Gen Core Processor or its equivalent\nand/or higher version\nMemory\n : 16 GB DDR4 or higher\nStorage\n : 512 GB SSD 2.5 inch\nGraphics : Integrated HD Graphics or external VGA card\n\n--- PDF PAGE 78 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n78\nAccessories : Mouse and Keyboard\nOperating System : Win 11 Pro 64 Bit or Linux OS\n1\nunit\nServer computer\nProcessor : i7 8th Gen Core Processor or its equivalent\nand/or higher version\nMemory\n : 64 GB DDR4 or higher\nStorage\n : 1 TB SSD 2.5 inch\nGraphics : Integrated HD Graphics or external VGA card\nAccessories : Mouse and Keyboard\nOperating System : Win 11 Pro 64 Bit or Linux OS\n1\nunit\nLCD Projector and screen\n1\nunit\nPrinter\n1\nunit\nWhite board and / or glass board\n21\nsets\nErgonomic computer tables and chairs\n\nMATERIALS\nQty.\nUnit\nDescription/Specification\n21\npcs\nHand-outs\n21\npcs\nPractice materials\n1\npc\nVideo learning materials\nAs\nneeded\npcs\nReference books/materials\n1\nream\nBond paper, A4\n\nDue to the fast-changing nature of the Information and Communications Technology\n(ICT) sector, TVET providers are reminded to use and provide their trainees with the latest\ntechnology tools, equipment and materials where appropriate and applicable.\n\n--- PDF PAGE 79 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n79",
