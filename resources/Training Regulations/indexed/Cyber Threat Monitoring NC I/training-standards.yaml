    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to training providers. This will equip them with needed knowledge and skills\nin developing their own curricula based on the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\ninclude green technology, issues on health and drugs and catering to persons with\ndisabilities (PWD’s) to accompany their curricula.\n\nCourse Title: Cyber Threat Monitoring\n\n NC Level: NC I\n\nNominal Training Duration:\n\n47 hours – Basic Competencies\n\n28 hours – Common Competencies\n\n 196 hours – Core Competencies\n\n ---------------------------------------------------------------\n\n 271 hours – Total (in-school/in-center)\n\n 120 hours – Supervised Industry Learning (SIL)\n\n* The Supervised Industry Learning (SIL) component may be implemented in flexible manner. It may be\nintegrated within various modules or units of competency or at the end of the in-school or classroom\ntraining. Actual hands on / immersion can be conducted in the partner industry/ company through the\nsupervision of the designated industry focal.\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, &\nattitudes of a cybersecurity analyst/support staff in accordance with industry\nstandards. It covers the basic & common competencies in addition to the core\ncompetencies in monitoring and reporting cyber threats and conducting vulnerability\nscanning.\n\nUpon completion of the course, the learner is expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieve.\n\n--- PDF PAGE 58 ---\n_____________________________________________________________________________________\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n 58\nBASIC COMPETENCIES\n(47 Hours)\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow routine\nspoken\nmessages\n● Exercise Conciseness in receiving and\nclarifying messages/ information/\ncommunication\n● Group discussion\n● Interaction\n● Reportorial\n● Modular\n● Interviews/\n● Questioning\n● Practical/\n● Performance Test\n● Observation\n4 Hours\n1.2 Perform\nworkplace duties\nfollowing written\nnotices\n● Practice Accuracy in following written/ oral\ninstruction/ information\n● Practice written and oral communication\nskills\n● Case Study in handling written\ncommunication\n● Practice relaying/ disseminating\nmessages/ information\n● Analyze different messages\n● Lecture/\n● Discussion\n● Demonstration\n● Case Study\n● Written\n● Practical\n● Written\n● Demonstration\n4 Hours\n2. Work with others\n2.1 Develop effective\nworkplace\nrelationships\n\n● Read job description and organizations\npolicies relevant to work role\n● Read personnel code of conduct and\ndiscipline\n● Role play on cooperation and good\nrelationship\n● Study table of organization and identify\nteam members\n● Role play on team work.\n● Role play on receiving feedback from\nsupervisor\n● Role play on providing feedback.\n● Listen to lecture on Valuing and\nexemplifying respect and empathy in the\nworkplace\n● Individual Work\n● Discussion\n● Role Play\n● Lecture\n● Role Play\n● Structured activity\n● Written Test\n2 Hours\n\n2.2 Contribute to\nwork\n● Discussion on creative collaboration, social\nperceptiveness and problem sensitivity\n● Lecture/\nDiscussion\n● Role Play\n● Structured activity\n1 Hour\n\n--- PDF PAGE 59 ---\n_____________________________________________________________________