t forwarding\n\n● Lecture, discussion and hands-on/\ndemo on:\no Introduction to monitoring and\nreporting:\n- Log and detection\nmanagement\n- Security solution scan and\noperation procedure\n- Sources of incidents\n- Types of red flag detection\n- Security solution\nmanagement application\n● Lecture/ Discussion\n● Hands on Exercises\n● Demonstration\n● Viewing multimedia\n● Simulation\n● Computer Guided\nActivities\n● Written exam\n● Practical exam\n● Observation in\nworkplace\n● Interviews/\nquestioning\n40 hours\n\n--- PDF PAGE 72 ---\n_____________________________________________________________________________________\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n 72\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n- Security solution severity\nclassifications\n\n● Identification of malicious software\nbehaviors\n● Identification and clarification of the\nnature of incident reports\n● Simulation on detection of\nevent/incident\n● Creation of ticket\n\n1.2. Check status of\nthird party security\nsolution\n● Lecture and discussion on:\no Security solution usage and\noperations\n● Conduct simulation on checking status\nof security solution\n\n● Lecture/ Discussion\n● Hands on Exercises\n● Demonstration\n● Viewing multimedia\n● Simulation\n● Computer Guided\nActivities\n● Written exam\n● Practical exam\n● Observation in\nworkplace\n● Interviews/\nquestioning\n\n40 hours\n1.3. Perform manual\nchecking and\nverification\n● Lecture and discussion on:\no Manual checking and verification\nprocedure\no Security solution software action\n● Simulation of manual checking and\nverification\n\n● Lecture/ Discussion\n● Hands on Exercises\n● Demonstration\n● Viewing multimedia\n● Simulation\n● Computer Guided\nActivities\n● Written exam\n● Practical exam\n● Observation in\nworkplace\n● Interviews/\nquestioning\n8 hours\n1.4. Conduct case\nfollow-up\n● Lecture and discussion on: