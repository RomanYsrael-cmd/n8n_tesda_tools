        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Checked for alerts\n1.1.1 Received detection alert as per company Standard\nOperating Procedure (SOP).\n1.1.2 Received incident report as per company Standard\nOperating Procedure (SOP).\n1.1.3 Checked red flag detection according company SOP\n1.1.4 Assessed alert is based on pre-identified criteria\n1.1.5 Issued ticket upon confirmation of detection\n1.2 Checked status of third-party security solution\n1.2.1 Checked enterprise security solution software if there\nis one installed as per company SOP\n1.2.2 Checked security solution software if operational as\nper company SOP\n1.2.3 Checked security solution software if it can clean or\ndelete the issue\n1.3 Performed manual checking and verification\n1.3.1 Checked detection from the security solution\nsoftware as per procedure\n1.3.2 Checked action of the security solution software as\nper company SOP\n1.3.3 Checked and patched security solution software\nupdates as required\n1.3.4 Used security solution software to scan infected\nsystem/s\n1.4 Conducted case follow-up\n1.4.1 Verified results of the scan to customer/client/\nstakeholder\n1.4.2 Checked security solution scan logs for failed action\nas per company SOP\n1.4.3 Escalated failed action to appropriate authority as\nper company SOP\n1.5 Performed alert reporting\n1.5.1 Notified stakeholder/client with high and critical\nthreats\n1.5.2 Reported activity of the threats based on the spread\nand lateral movement\n1.5.3 Reported activity of the threats based on egress and\ningress\n1.5.4 Identified threats based on exploitation activity and\ninstallation behavior\n\n--- PDF PAGE 53 ---\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 53\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Appropriate supplies and materials\n2.2 Applicable equipment\n2.3 Appropriate software\n2.4 Workplace or assessment area\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Written Exam\n3.3 Portfolio with interview\n4. Context for\nAssessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 54 ---\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 54\nUNIT OF COMPETENCY :\nCONDUCT VULNERABILITY SCANNING OF\nASSETS\n\nUNIT CODE :"
        },
        "source_text": "ICT251312\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required to\nmonitor and report cyber threats. This includes competencies\nin checking for alerts, checking status of third-party security\nsolutions, performing manual checking and verification,\nconducting case follow-up and performing alert reporting.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Check for\nalerts\n1.1. Detection alert is\nreceived as per company\nStandard Operating\nProcedure (SOP).\n1.2. Incident report is\nreceived as per company\nStandard Operating\nProcedure (SOP).\n1.3. Red flag detection is\nchecked according\ncompany SOP\n1.4. Alert is assessed based\non pre-identified criteria\n1.5. Ticket is issued upon\nconfirmation of detection.\n\n1.1. Basic knowledge\nwith Windows, MAC\n& Linux OS\n1.2. Basic knowledge\nwith Web server and\nwebsite design and\narchitecture\n1.3. Basic knowledge\nwith scripting and\ncoding language, i.e.\nPHP, Python, Java,\nVisual Basic and\nothers\n1.4. Basic knowledge\nwith network\ninfrastructure and\narchitecture, i.e.\nLAN, WAN, port\nforwarding\n1.5. Sources of detection\nalert / incident\nreports\n1.6. Log and detection\nmanagement\n1.7. Security solution\nscan and operations\nprocedure\n1.8. Security solution\nmanagement\napplication\n1.9. Security solution\nseverity\nclassifications\n1.10. Malicious software\nbehaviors\n1.1. Computer\noperation skills\n1.2. Communication\nskills\n1.3. Interpreting work\ninstructions\n1.4. Interpersonal skills\n1.5. Analytical skills\n\n--- PDF PAGE 48 ---\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 48\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.11. Knowledge of\nattack framework\n1.12. Data Privacy Act\n1.13. Cybersecurity Laws\n1.14. Ethical\nconsiderations in\nthe cybersecurity\n\n2. Check status\nof third-party\nsecurity\nsolution\n2.1. Enterprise security\nsolution software is\nchecked if there is one\ninstalled as per company\nSOP.\n2.2. Security solution\nsoftware is checked if\noperational as per\ncompany SOP.\n2.3. Security solution software\nis checked if it can clean\nor delete the issue\n2.1. Log and detection\nmanagement\n2.2. Security solution\nusage and\noperations\n2.3. Knowledge in\norganization SOP\n\n2.1. Computer\noperation skills\n2.2. Communication\nskills\n2.3. Interpreting work\ninstructions\n2.4. Interpersonal skills\n2.5. Analytical skills\n3. Perform\nmanual\nchecking and\nverification\n3.1. Detection from the\nsecurity solution software\nis checked as per\nprocedure\n3.2. Action of the security\nsolution software is\nchecked as per company\nSOP.\n3.3. Security solution software\nupdates are checked and\npatched as required\n3.4. Security solution software\nis used to scan infected\nsystem/s\n3.1. Log and detection\nmanagement\n3.2. Security solution\nscan and operations\nprocedure\n3.3. Knowledge in\norganization SOP\n\n3.1. Computer\noperation skills\n3.2. Communication\nskills\n3.3. Interpreting work\ninstructions\n3.4. Interpersonal skills\n3.5. Analytical skills\n3.6. Verification Skills\n4. Conduct case\nfollow-up\n4.1. Results of the scan are\nverified to customer/\nclient/ stakeholder\n4.2. Security solution scan logs\nare checked for failed\naction as per company\nSOP\n4.3. Failed action is escalated\nto appropriate authority\nas per company SOP\n4.1. Log and detection\nmanagement\n4.2. Knowledge in\norganization SOP\n\n4.1. Computer\noperation skills\n4.2. Communication\nskills\n4.3. Interpreting work\ninstructions\n4.4. Interpersonal skills\n4.5. Analytical skills\n5. Perform alert\nreporting\n5.1. Stakeholder/client with\nhigh and critical threats\nare notified\n5.2. Activity of the threats are\nreported based on the\nspread and lateral\nmovement\n5.1 Malicious software\nbehaviors\n5.2 Threats\n5.3 Knowledge in attack\nframework\n\n5.1 Computer\noperation skills\n5.2 Communication\nskills\n5.3 Interpreting work\ninstructions\n5.4 Interpersonal skills\n\n--- PDF PAGE 49 ---\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 49\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n5.3. Activity of the threats are\nreported based on egress\nand ingress\n5.4. Threats are identified\nbased on exploitation\nactivity and installation\nbehavior\n5.5 Analytical skills\n\n--- PDF PAGE 50 ---\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 50\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Detection alert\nMay include:\n1.1. SIEM alert\n1.2. AV alert\n1.3. Firewall alert\n1.4. Web application firewall alert\n1.5. DLP alert\n1.6. EDR alert\n1.7. NDR alert\n2. Detection report\nMay include:\n2.1. phone call\n2.2. walk-in\n2.3. email\n2.4. SMS\n2.5. Chat\n2.6. Video-conferences\n3. Red flag detection\nMay include:\n3.1. ransomware\n3.2. PE Infection /Virus\n4. Pre-identified\ncriteria\nMay include criteria based on:\n4.1. Threat\n4.2. Detection\n4.3. Routine\n5. Security solution\nMay include:\n5.1.\nanti-virus\n5.2.\ncommon firewall\n5.3.\nthreat intelligence\n5.4.\nTDR - Threat Detection and Response\n5.5.\nWAF - Web Application Firewall\n5.6.\nIDS - Intrusion Detection System\n5.7.\nIPS - Intrusion Prevention System\n5.8.\nDLP - Data Loss Prevention\n5.9.\nOperational technology (OT)/ Industrial Control System\n(ICS) / Supervisory Control and Data Acquisition\n(SCADA) security\n5.10. Internet of Things (IoT)\n5.11. EDR/MDR - Endpoint Detection & Response and\nManaged Detection and Response\n5.12. SIEM - Security Information & Event Management\n5.13. SOAR - Security Orchestration, Automation and\nResponse\n5.14. XDR - Extended Detection and Response\n6. Action\nMay include:\n6.1. Failed\n6.2. Clean\n6.3. Delete\n6.4. Quarantine\n6.5