        "source_text": "--- PDF PAGE 20 ---\nCyber Treat Monitoring NC I (ICTCTM124)                                  Promulgated        November 13, 2024    20 \nUNIT OF COMPETENCY \n: \nSUPPORT INNOVATION \nUNIT CODE \n:       400311105 \nUNIT DESCRIPTOR             : \nThis unit of covers the knowledge, skills and attitudes \nrequired to identify, recognize and support innovation. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify the \nneed for \ninnovation in \none’s area of \nwork \n1.1. The value of innovative \npractices in the \nworkplace is recognized \n1.2. Creativity in innovation \nin one’s scope of work is \napplied \n1.3. The need for innovation in \nown scope of work is \nrecognized \n1.1. Clear-cut \ndefinition of \ninnovation \n1.2. Current practice in \nown scope of work \n1.3. Workplace \nprocedures \n1.1. Contributing in \nbrainstorming \nsession \n1.2. Examining current \npractice in one’s \nscope of work \n1.3. Identifying issues \nand concerns of \none’s scope of work \n2. Recognize \ninnovative and \ncreative ideas \n2.1. Opportunities within the \nteam are identified to \ndevelop innovation  \n2.2. Creative ideas of \ncoworkers pertaining to \nwork practices are \nanalyzed \n2.3. Environment conducive \nfor learning and \ninnovating  is maintained \n2.1. Support required \nto generate \ncreative ideas \n2.2. Difference \nbetween \ninnovation and \ncreativity \n2.3. Innovative climate \nin one’s scope of \nwork \n2.1. Identifying \nresources required \nfor creativity and \ninnovation  \n2.2. Examining potential \nobstacles to and \nopportunities for \ncreativity and \ninnovation  \n2.3. Communicating \ncreative ideas of \nco-workers \n3. Support \nindividuals’ \naccess to \nflexible and \ninnovative \nways of \nworking \n3.1. Individuals and key \npeople are reinforced to \nidentify innovative ideas \nto achieve outcomes  \n3.2. Sharing of best practices \nusing flexible and \ninnovative ways of \nworking is accomplished  \n3.3. Obstacles to progress in \nimplementing flexible and \ninnovative ways of \nworking are recognized \n3.1. The role of \nemployees/worker\ns in the \nimprovement of \npractices in the \norganization \n3.2. Best practices \nusing flexible and \ninnovative ways of \nworking \n3.3. Obstacles in \nimplementing \ninnovation in \none’s scope of \nwork \n3.1. Encouraging co-\nworkers to generate \nand develop ideas \n3.2. Evaluating potential \nobstacles to and \nopportunities for \ncreativity and \ninnovation  \n3.3. Sharing of best \npractices related to \ninnovation and \ncreativity\n\n--- PDF PAGE 21 ---\nCyber Treat Monitoring NC I (ICTCTM124)                                  Promulgated        November 13, 2024    21 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Innovative practices  \nMay include: \n1.1 \nSelf-directed support \n1.2 \nCommunity based services \n1.3 \nWorking within a collaborative arrangement \n1.4 \nMaking scope of work more efficient \n2. Innovation \nMay include: \n2.1 \nNew ideas \n2.2 \nOriginal ideas \n2.3 \nDifferent ideas \n2.4 \nMethods or tools\n\n--- PDF PAGE 22 ---\nCyber Treat Monitoring NC I (ICTCTM124)                                  Promulgated        November 13, 2024    22 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Identified need for innovation in the area of work  \n1.2. Recognized innovative and creative ideas \n1.3. Pursed agreement for flexible and innovative ways of \nworking \n1.4. Supported individuals and people to access flexible \nand innovative ways of working \n2. Resource Implications \nSpecific resources for assessment \n2.1. Evidence of competent performance should be \nobtained by observing an individual in an information \nmanagement role within the workplace or operational \nor simulated environment. \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Written Test \n3.2. Interview \n \nThe unit will be assessed in a holistic manner as is practical \nand may be integrated with the assessment of other \nrelevant units of competency. Assessment will occur over a \nrange of situations, which will include disruptions to normal, \nsmooth operation. Simulation may be required to allow for \ntimely assessment of parts of this unit of competency. \nSimulation should be based on the actual workplace and will \ninclude walk through of the relevant competency \ncomponents.  \n4. Context for Assessment \n4.1. Competency may be assessed individually in the \nactual workplace or simulation environment in \nTESDA accredited institutions\n",
