Materials\n3.1. Critical thinking\n3.2. Problem\nsolving\n3.3. Observation\nSkills\n\n--- PDF PAGE 34 ---\nCyber Treat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 34\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Environmental\nHazards\nMay include:\n1.1\nTobacco Smoke\n1.2\nAsbestos\n1.3\nLead\n1.4\nCombustion Gases\n1.5\nChemicals\n1.6\nPesticides\n1.7\nPollutants\n1.8\nContaminated Drinking Water\n1.9\nNoise\n1.10 Dust\n2. Environmental Work\nStandards\nMay include:\n2.1\nAir Quality Standards\n2.2\nEmission Standards\n2.3\nISO 14001: Environmental Management System\n2.4\nEnvironmental Statements\n2.5\nEnvironmental Quality Standards\n2.6\nWork Environment Measurement Standard\n3. Required Resources\nMay include:\n3.1\nElectric\n3.2\nWater\n3.3\nFuel\n3.4\nTelecommunications\n3.5\nSupplies and Materials\n3.6\nTrash Cans\n3.7\nRelevant Data Sheets\n3.8\nBarriers or Barricades\n4. Environmental\nProtection\nMay include protection against\n4.1\nOverconsumption of Resources\n4.2\nDestruction of Ecosystems\n4.3\nHabitat Destructions\n4.4\nExtinction of Wildlife\n4.5\nPollutions\n4.6\nWater Degradation\n5. Environmental Work\nProcedures\nMay include:\n5.1\nEnvironmental pollution control measures\n5.2\nOil and Fuel use\n5.3\nDisposal and Reuse\n5.4\nHerbicide applications\n5.5\nBreed Bird Mitigation\n5.6\nTree Removal Works\n5.7\nErosion Protection\n5.8 Scrub Clearance\n5.9 Bankside sediment clearance\n\n--- PDF PAGE 35 ---\nCyber Treat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 35\nVARIABLE\nRANGE\n6. Environmental\nHazardous and Non-\nHazardous Materials\nMay include but not limited:\n6.1\nAcids\n6.2\nAdhesives\n6.3\nAerosols\n6.4\nAsbestos\n6.5\nBatteries\n6.6\nChemicals\n6.7\nCompact fluorescent lamps\n6.8\nDrugs\n6.9\nDyes\n6.10 E-Waste\n6.11 Gasoline\n6.12 Grease\n6.13 Lead\n6.14 Motor Oil\n6.15 Solvents\n6.16 Weed Killers\n7. Environmental\nRegulations\nMay include:\n7.1\nClean Air Act\n7.2\nClean Water Act\n7.3\nEndangered Species Act\n