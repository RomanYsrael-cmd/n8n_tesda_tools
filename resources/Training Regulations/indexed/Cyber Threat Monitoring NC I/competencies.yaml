        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Demonstrated knowledge and understanding of \norganizational procedures in handling verbal and written \ncommunications \n1.2. Received and acted on verbal messages and \ninstructions correctly and efficiently \n1.3. Demonstrated ability in recording \ninstructions/information \n1.4. Utilized effective clarifying and probing techniques \nwhere necessary  \n2. Resource Implications The following resources should be provided: \n2.1. Pens \n2.2. Note pads \n2.3. Computer (if applicable) \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Demonstration on communication skills (e. g., role-   \nplaying) \n3.2. Oral questioning/Interview \n3.3. Written Test      \n4. Context for \nAssessment \n4.1. Competency may be assessed individually in the actual \nworkplace or in a simulated environment in TESDA-\naccredited institutions",
