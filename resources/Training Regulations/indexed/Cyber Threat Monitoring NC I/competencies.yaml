        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem.\n1.2.\nDetermined the fundamental causes of the problem.\n1.3.\nDetermined the correct / preventive action.\n1.4.\nDeveloped action plans in managing routine problems.\nThese aspects may be best assessed using project-based\nlearning mode of assessment and case formulation.\n2. Resource\nImplications\nAssessment will require access to a workplace over an extended\nperiod, or a suitable method of gathering evidence of operating\nability over a range of situations.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1.\nCase Formulation\n3.2.\nLife Narrative Inquiry (Interview)\n3.3.\nStandardized test\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other relevant\nunits of competency. Assessment will occur over a range of\nsituations, which will include disruptions to normal, smooth\noperation. Simulation may be required to allow for timely\nassessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include\nwalk through of the relevant competency components.\nThese assessment activities should include a range of\nproblems, including new, unusual and improbable situations\nthat may have happened.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 17 ---\nCyber Treat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 17\nUNIT OF COMPETENCY :\nENHANCE SELF-MANAGEMENT SKILLS\nUNIT CODE :"
        },
