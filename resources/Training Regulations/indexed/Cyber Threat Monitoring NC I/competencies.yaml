        "source_text": "--- PDF PAGE 37 ---\nCyber Treat Monitoring NC I (ICTCTM124)                                  Promulgated        November 13, 2024    37 \nUNIT OF COMPETENCY \n: \nADOPT  ENTREPRENEURIAL MINDSET IN THE \nWORKPLACE  \nUNIT CODE \n: \n400311109 \nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes required to support and \ninternalize an entrepreneurial mindset and observe basic \nentrepreneurial practices in the workplace. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine \nentrepreneurial \nmindset   \n1.1. Entrepreneurial mindset \nin the workplace is \ndetermined from enterprise \npractices and policies.  \n1.2. Entrepreneurial mindset \nin the workplace is studied \nand affirmed based on \ncurrent enterprise \npractices  \n1.3. Clarification from reliable \nsources is sought \nregarding entrepreneurial \nmindset and corporate \nculture. \n1.1. Workplace policies \nand practices \nrelating to \nentrepreneurship \n1.2. Elements of \ncorporate culture \n1.3. Entrepreneurial \nmindset \n1.4. Entrepreneurial \npractices in the \nworkplace \n1.5. Desirable attitudes: \n● Patience \n● Willingness to \nlearn \n● Attention to \ndetails \n1.1. Identifying \nentrepreneurial \nmindset  \n1.2. Studying and \naffirming \nentrepreneurial \nmindset  \n1.3. Selecting and \nemulating \ndesirable \nentrepreneurial \npractices  \n1.4. Communication \nskills \n \n2. Identify \nentrepreneurial \npractices \n2.1. Entrepreneurial practices \nare determined based on \nenterprise requirements \n2.2. Entrepreneurial practices \nare performed following \nworkplace and client \nrequirements. \n2.3. Cost-effective measures \nare complied with \nreference to workplace \nbest practices \n \n2.1. Quality assurance \npractices \n2.2. Workplace and \nclient requirements \n2.3. Types of cost-\neffective measures \n2.4. Workplace quality \npolicy \n2.5. Attitude: \n● Patience \n● Attention to \ndetails \n2.1. Performing \nquality assurance \npractices \n2.2. Complying quality \nassurance \nrequirements \n2.3. Complying to \ncost-effective \nmeasures \n2.4. Communication \nskills\n\n--- PDF PAGE 38 ---\nCyber Treat Monitoring NC I (ICTCTM124)                                  Promulgated        November 13, 2024    38 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Entrepreneurial mindset May include  workplace thinking relating to: \n1.1. Economy in the use of resources \n1.2. Waste management \n1.3. Quality-consciousness \n1.4. Cost-consciousness \n1.5. Safety- and health- consciousness \n \n2. Quality assurance \npractices \nMay include: \n2.1. Use of quality procedures manual  \n2.2. Quality policy \n2.3. Best/Good practices \n2.4. Continuous improvement program \n3. Reliable sources \nMay include: \n3.1. Supervisors \n3.2. Colleagues \n3.3. Clients/Partners \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency  \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated affirmation of entrepreneurial mindset \n1.2 \nObserved entrepreneurial practices \n1.3 \nComplied with cost effective measures \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 \nSimulated or actual workplace \n2.2 \nTools, materials and supplies needed to demonstrate \nthe required tasks  \n2.3 \nReferences and manuals \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through : \n3.1 Written examination \n3.2 Demonstration/observation with oral questioning \n3.3 Third-party report \n \n4. Context of \nAssessment \n4.1 Competency may be assessed in workplace or in a \nsimulated workplace setting \n4.2 Assessment shall be observed while tasks are being \nundertaken whether individually or in-group\n",
