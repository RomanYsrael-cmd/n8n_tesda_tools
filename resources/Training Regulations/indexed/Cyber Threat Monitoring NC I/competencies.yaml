        "source_text": "400311104\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, and attitudes in\napplying the ability to regulate actions, make good decisions,\nand show appropriate behavior based on self-awareness.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Set\npersonal\nand career\ngoals\n1.1. The difference between\npersonal and career\ngoals are described\n1.2. Clear and concise\npersonal and career\ngoals are developed\n1.3. Characteristics of\nmotivational goals\naccording to Locke\n&Latham are identified\n1.1. Definition of personal\ngoals and career goals\n1.2. SMART Model for goal\nsetting\n1.3. Five principle of goal\nsetting according to\nLocke & Latham\n(Clarity, Challenge,\nCommitment,\nFeedback, and Task\ncomplexity)\n1.1. Setting of personal\nand career goals\n1.2. Defining, creating,\nand mapping\npersonal and\ncareer goals using\nSMART Model for\ngoal setting\n1.3. Applying goal\nsetting principles to\npersonal and\ncareer goals\n2. Recognize\nemotions\n2.1. Influence that people,\nsituations and events\nhave on emotions are\ndescribed\n2.2. Importance of\nresponding with\nappropriate emotions are\nexplained\n2.3. Influences on and\nconsequences of\nemotional responses in a\nsocial and work-related\ncontexts are examined\n2.1. Common positive and\nnegative emotions\nmanifested in the\nworkplace\n2.2. Professional and non-\nprofessional behaviors\nin the workplace\n2.3. Triggers and\nimplications of positive\nand negative emotions\nin the workplace\n2.1. Identifying\nsensitively the\npositive and\nnegative emotions\nin the workplace\n2.2. Responding with\nappropriate\nemotions in the\nworkplace\n2.3. Identifying possible\nconsequences of\ninappropriate\nemotional\nresponses in a\nsocial and work-\nrelated context\n3. Describe\noneself as a\nlearner\n3.1. Factors and strategies\nthat assist learning are\nidentified and described\n3.2. Preferred learning\nstyles according to VAK\nLearning Style Model\nand Kolb’s Theory of\nLearning Styles are\nidentified\n3.3. Range of learning\nstrategies appropriate to\nspecific tasks and\ndescribe work practices\nthat assist their learning\nare identified and chosen\n3.1. Kolb’s Theory of\nLearning Styles\n(Converger, Diverger,\nAssimilator,\nAccommodator)\n3.2. VAK Learning Style\nModel (Visual,\nAuditory, Kinesthetic)\n3.3. Range of learning\nstrategies appropriate\nto specific tasks and\ndescribe work practices\nthat assist their\nlearning\n\n3.1. Identifying factors\nand strategies that\nassist learning\n3.2. Applying learning\nstyles to positively\ninfluence\nschool/work\nperformance\n3.3. Using appropriate\nlearning strategies\nto improve study\nhabits and learning\n\n--- PDF PAGE 18 ---\nCyber Treat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Personal goals\nMay include:\n1.1. Graduate from Tech-Voc training\n1.2. Buy a car\n1.3. Travel around the world\n2. Career goals\nMay include but not limited to:\n2.1. Graduate from Tech-Voc training\n2.2. Graduate from college\n2.3. Buy a car\n2.4. Retire at 50 years old\n3. Emotions\nPositive emotions may include:\n3.1. Joy\n3.2. Gratitude\n3.3. Hope\n3.4. Serenity\nNegative emotions may include:\n3.5. Anger\n3.6. Fear\n3.7. Disgust\n3.8. Sadness\n4. Social and work-\nrelated contexts\nMay include professional behavior such as:\n4.1. Committed to developing and improving their skills\n4.2. Professionals get the job done\n4.3. They keep their word and deliver what they promise.\n\nMay include non-professional behavior such as–\n4.4. They engage in office politics\n4.5. Bluffing and misrepresenting their skills\n4.6. Blaming a colleague\n5. Learning styles\nMay include:\n5.1. Visual\n5.2. Auditory\n5.3. Kinesthetic\n5.4. Converger\n5.5. Diverger\n5.6. Assimilator\n5.7. Accommodator\n6. Learning strategies\nMay include:\n6.1. Explain and describe ideas with many details\n6.2. Switch between ideas while studying\n6.3.\nUse specific examples to understand abstract ideas\n\n--- PDF PAGE 19 ---\nCyber Treat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 19\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Developed SMART personal and career goals\n1.2. Applied goal setting principles\n1.3. Identified sensitively the positive and negative emotions\nin the workplace\n1.4. Responded with appropriate emotions in the workplace\n1.5. Identified possible consequences of inappropriate\nemotional responses in a social and work-related context\n1.6. Applied learning styles to positively influence school/work\nperformance\n1.7. Developed reflective practice through realization of\nlimitations, likes/ dislikes; through showing of self-\nconfidence\n2. Resource\nImplications\nThe following resources for should be provided:\n2.1. Access to workplace and resources\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration or simulation with oral questioning (ex.\nhow to recognize emotions)\n3.2. Case problems involving workplace diversity issues\n3.3. Third-party report\n\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n\n--- PDF PAGE 20 ---\nCyber Treat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 20\nUNIT OF COMPETENCY\n:\nSUPPORT INNOVATION\nUNIT CODE\n:"
