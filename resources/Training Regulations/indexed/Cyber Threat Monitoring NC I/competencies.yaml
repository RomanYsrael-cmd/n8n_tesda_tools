        "source_text": "--- PDF PAGE 9 ---\nCyber Treat Monitoring NC I (ICTCTM124)                                  Promulgated        November 13, 2024    \n9 \nUNIT OF COMPETENCY \n: \nWORK WITH OTHERS  \nUNIT CODE \n: \n400311102 \nUNIT DESCRIPTOR               : \nThis unit covers the skills, knowledge and attitudes required in \nworking as member of a team, interacting with co-members \nand performing one’s role in the team.    \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Develop \neffective \nworkplace \nrelationships \n1.1. Duties and \nresponsibilities are done \nin a positive manner to \npromote cooperation and \ngood relationship \n1.2. Assistance is sought from \nworkgroup when difficulties \narise and addressed \nthrough discussions \n1.3. Feedback provided by \nothers in the team is \nencouraged, acknowledged \nand acted upon \n1.4. Differences in personal \nvalues and beliefs are \nrespected and \nacknowledged during \ninteraction \n1.1. One’s role, duties \nand responsibilities \nin the workplace \n1.2. Acknowledging/ \nreceiving and giving \nfeedback  \n1.3. Valuing respect and \nempathy in the \nworkplace \n1.4. Workplace \ncommunication \nprotocols \n1.5. Teamwork \n1.6. Collaboration and \nteambuilding within \nthe enterprise \n1.1. Communication \nskills – oral and \nwritten (e. g., \nrequesting \nadvice, receiving \nfeedback) \n1.2. Ability to relate \nto/interact with \npeople from a \nrange of social \nand cultural \nbackgrounds \n \n2. Contribute to \nwork group \nactivities  \n2.1. Support is provided to \nteam members to ensure \nworkgroup goals are met \n2.2. Constructive contributions \nto workgroup goals and \ntasks are made according \nto organizational \nrequirements \n2.3. Information relevant to work \nis shared with team \nmembers to ensure \ndesignated goals are met \n2.1. Importance of \ncreative \ncollaboration, social \nperceptiveness and \nproblem sensitivity \nin the workplace \n2.2. Organizational \nRequirements \n2.3. Importance of \ninitiative and \ndedication in group \nprocess \n2.4. Office and \nworkplace \ntechnologies and \nautomation \n(hardware, software \nsystems) \n \n2.1. Communication \nskills – oral and \nwritten (e. g., \nrequesting \nadvice, receiving \nfeedback) \n2.2. Organizing work \npriorities and \narrangements \n2.3. Team player skills \n2.4. Technology skills \nincluding the \nability to select \nand use \ntechnology \nappropriate to a \ntask\n\n--- PDF PAGE 10 ---\nCyber Treat Monitoring NC I (ICTCTM124)                                  Promulgated        November 13, 2024    10 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Duties and \nresponsibilities  \nMay include: \n1.1  Job description and employment arrangements \n1.2 Organization’s policy relevant to work role \n1.3 Organizational structures \n1.4 Supervision and accountability requirements including OHS \n1.5 Enterprise code of conduct \n2. Work group  \nMay include: \n2.1 Supervisor or manager \n2.2 Peers/work colleagues and clients \n2.3 Other members of the organization \n3. Feedback   \nMay include: \n3.1 Formal/Informal performance appraisal \n3.2 Obtaining feedback from supervisors and colleagues and \nclients \n3.3 Personal, reflective behavior strategies \n3.4 Routine organizational methods for monitoring service \ndelivery \n4. Providing \nsupport to team \nmembers \nMay include: \n4.1 Explaining/clarifying \n4.2 Helping colleagues \n4.3 Providing encouragement \n4.4 Providing feedback to another team member \n4.5 Undertaking extra tasks if necessary \n5. Organizational \nrequirements \n \nMay include: \n5.1  Goals, objectives, plans, system and processes \n5.2 Legal and organization policy/guidelines  \n5.3 OHS policies, procedures and programs \n5.4 Ethical standards \n5.5 Defined resources parameters \n5.6 Quality and continuous improvement processes and \nstandards\n\n--- PDF PAGE 11 ---\nCyber Treat Monitoring NC I (ICTCTM124)                                  Promulgated        November 13, 2024    11 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency  \n \nAssessment requires evidence that the candidate: \n1.1. \nProvided support to team members to ensure goals are met \n1.2. \nActed on feedback from clients and colleagues \n1.3. \nDemonstrated quality/active participation in team meetings \nand activities    \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2. \nMaterials relevant to the proposed activity or task \n \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Written Test \n3.2 Role play \n3.3 Interview/Oral questioning   \n3.4 Structured and unstructured activity \n \n4. Context for \nAssessment \n4.1. \nCompetency assessment may occur in workplace or any \nappropriately simulated environment \n4.2. \nAssessment shall be observed while task are being \nundertaken whether individually or in group\n",
