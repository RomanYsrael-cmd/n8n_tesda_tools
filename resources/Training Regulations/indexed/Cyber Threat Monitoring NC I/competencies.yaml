n6.4. Quarantine\n6.5. Blocked\n6.6. Re-image\n7. Appropriate\nauthority\nMay include:\n7.1. IT department manager\n\n--- PDF PAGE 51 ---\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 51\nVARIABLE\nRANGE\n7.2. Information security manager\n7.3. Security solution/security vendor\n7.4. Chief information security officer\n\n--- PDF PAGE 52 ---\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 52\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Checked for alerts\n1.1.1 Received detection alert as per company Standard\nOperating Procedure (SOP).\n1.1.2 Received incident report as per company Standard\nOperating Procedure (SOP).\n1.1.3 Checked red flag detection according company SOP\n1.1.4 Assessed alert is based on pre-identified criteria\n1.1.5 Issued ticket upon confirmation of detection\n1.2 Checked status of third-party security solution\n1.2.1 Checked enterprise security solution software if there\nis one installed as per company SOP\n1.2.2 Checked security solution software if operational as\nper company SOP\n1.2.3 Checked security solution software if it can clean or\ndelete the issue\n1.3 Performed manual checking and verification\n1.3.1 Checked detection from the security solution\nsoftware as per procedure\n1.3.2 Checked action of the security solution software as\nper company SOP\n1.3.3 Checked and patched security solution software\nupdates as required\n1.3.4 Used security solution software to scan infected\nsystem/s\n1.4 Conducted case follow-up\n1.4.1 Verified results of the scan to customer/client/\nstakeholder\n1.4.2 Checked security solution scan logs for failed action\nas per company SOP\n1.4.3 Escalated failed action to appropriate authority as\nper company SOP\n1.5 Performed alert reporting\n1.5.1 Notified stakeholder/client with high and critical\nthreats\n1.5.2 Reported activity of the threats based on the spread\nand lateral movement\n1.5.3 Reported activity of the threats based on egress and\ningress\n1.5.4 Identified threats based on exploitation activity and\ninstallation behavior\n\n--- PDF PAGE 53 ---\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 53\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Appropriate supplies and materials\n2.2 Applicable equipment\n2.3 Appropriate software\n2.4 Workplace or assessment area\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Written Exam\n3.3 Portfolio with interview\n4. Context for\nAssessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 54 ---\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 54\nUNIT OF COMPETENCY :\nCONDUCT VULNERABILITY SCANNING OF\nASSETS\n\nUNIT CODE :\nICT251313\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitude\nrequired to conduct vulnerability scanning. It includes\nchecking schedule for scanning, conducting scanning of\nassets and providing report of scanning.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Check\nschedule for\nscanning\n1.1. Vulnerability management\nis consulted with the\nimmediate supervisor\n1.2. Access to vulnerability\nscanning calendar and\ntimeline is requested\nbased on scope of work\n1.3. Number of assets to be\nscanned are identified\nbased on the particular\nschedule\n1.4. Signed off on scope of\nwork is performed and\naccomplished according\nto prescribed timeline\n1.1. Ticket management\nsystems\n1.2. Vulnerability\nmanagement\nsolution\n1.3. Scanning\nprocedures based\non vulnerability\nmanagement\nsolution\n1.4. Knowledge\nManagement usage\n1.1. Computer\noperation skills\n1.2. Communication\nskills\n1.3. Interpreting work\ninstructions\n1.4. Interpersonal\nskills\n1.5. Vulnerability\nScanning skills\n2. Conduct\nscanning of\nassets\n2.1. List of assets for\nvulnerability scanning are\nverified with supervisor\nand change manager\nbased on scope of work\n2.2. Assets to be prioritized\nare verified with the\nimmediate supervisor and\nchange manager\n2.3. Prescribed schedule for\nvulnerability scanning is\nadhered to\n2.4. Scanning of assets are\nperformed based on\nindustry standards (NIST\n800-115, Chapter 4.3 & 4.4)\n2.5. CPU usage, storage\nusage and network\nlatency are monitored\nbased on software\ncapability\n2.6. Vulnerability scanning is\nterminated and\nimmediately reported to\nIT when issue arises with\nregards to slowness of\nnetwork and endpoint\n2.1. Ticket management\nsystems\n2.2. Vulnerability\nmanagement\nsolution\n2.3. Scanning\nprocedures based on\nvulnerability\nmanagement\nsolution\n2.4. Knowledge\nManagement usage\n2.5. Vulnerability\nmanagement\nsolution usage and\noperations\n2.6. List of assets\n2.7. Familiarity on NIST\n800-115\n\n2.1. Computer\noperation skills\n2.2. Communication\nskills\n2.3. Interpreting work\ninstructions\n2.4. Interpersonal\nskills\n2.5. Vulnerability\nScanning skills\n\n--- PDF PAGE 55 ---\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 55\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Provide report\nof scanning\n3.1. Failed scan on assets are\nrecorded based on\nestablished company\nprocedures\n3.2. Success scan on assets\nare recorded based on\nestablished company\nprocedures\n3.3. Vulnerability assessment\nreport is submitted to\nimmediate supervisor and\nchange manager\n3.1. Log and scan\nmanagement\n3.2. Vulnerability\nmanagement\nsolution scan and\noperations\nprocedure\n3.3. Documentation\nprocedures on scan\noutput\n3.1. Computer\noperation skills\n3.2. Communication\nskills\n3.3. Interpreting work\ninstructions\n3.4. Interpersonal\nskills\n3.5. Documentation\nskills\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Immediate supervisor\nMay include\n1.1. IT Department Manager\n1.2. Information security Manager\n1.3. Security solution/security vendor\n1.4. Chief Information Security Officer\n\n2. Assets\nMay include\n2.1. Servers\n2.2. Endpoints\n2.3. Mobile devices\n2.4. Web-applications\n\n--- PDF PAGE 56 ---\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 56\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Checked schedule for scanning\n1.1.1 Consulted vulnerability management with the\nimmediate supervisor\n1.1.2 Requested access to vulnerability scanning calendar\nand timeline based on scope of work\n1.1.3 Identified number of assets to be scanned based on\nthe particular schedule\n1.1.4 Performed and accomplished signed off on scope of\nwork according to prescribed timeline\n1.2 Conducted scanning of assets\n1.2.1 Verified list of assets for vulnerability scanning with\nsupervisor and change manager based on scope of\nwork\n1.2.2 Verified assets to be prioritized with the immediate\nsupervisor and change manager\n1.2.3 Adhered to prescribed schedule for vulnerability\nscanning\n1.2.4 Performed scanning of assets based on industry\nstandards\n1.2.5 Monitored CPU usage, storage usage and network\nlatency based on software capability\n1.2.6 Terminated vulnerability scanning and immediately\nreported to IT when issue arises with regards to\nslowness of network and endpoint\n1.3 Provided report of scanning\n1.3.1 Recorded failed scan on assets based on established\ncompany procedures\n1.3.2 Recorded success scan on assets based on\nestablished company procedures\n1.3.3 Submitted vulnerability assessment report to\nimmediate supervisor and change manager\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Appropriate supplies and materials\n2.2 Applicable equipment\n2.3 Appropriate software\n2.4 Workplace or assessment area\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Written Exam\n3.3 Portfolio with interview\n4. Context of\nAssessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 57 ---\nTR – Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024 57"
