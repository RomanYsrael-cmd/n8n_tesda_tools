        "evidence_guide": {
          "source_text": "1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 Checked for alerts \n1.1.1 Received detection alert as per company Standard \nOperating Procedure (SOP). \n1.1.2 Received incident report as per company Standard \nOperating Procedure (SOP). \n1.1.3 Checked red flag detection according company SOP \n1.1.4 Assessed alert is based on pre-identified criteria \n1.1.5 Issued ticket upon confirmation of detection \n1.2 Checked status of third-party security solution \n1.2.1 Checked enterprise security solution software if there \nis one installed as per company SOP \n1.2.2 Checked security solution software if operational as \nper company SOP \n1.2.3 Checked security solution software if it can clean or \ndelete the issue \n1.3 Performed manual checking and verification \n1.3.1 Checked detection from the security solution \nsoftware as per procedure \n1.3.2 Checked action of the security solution software as \nper company SOP \n1.3.3 Checked and patched security solution software \nupdates as required \n1.3.4 Used security solution software to scan infected \nsystem/s \n1.4 Conducted case follow-up \n1.4.1 Verified results of the scan to customer/client/ \nstakeholder \n1.4.2 Checked security solution scan logs for failed action \nas per company SOP \n1.4.3 Escalated failed action to appropriate authority as \nper company SOP \n1.5 Performed alert reporting \n1.5.1 Notified stakeholder/client with high and critical \nthreats  \n1.5.2 Reported activity of the threats based on the spread \nand lateral movement \n1.5.3 Reported activity of the threats based on egress and \ningress \n1.5.4 Identified threats based on exploitation activity and \ninstallation behavior\n\n--- PDF PAGE 53 ---\nTR – Cyber Threat Monitoring NC I  (ICTCTM124)                                     Promulgated   November 13, 2024          53 \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Appropriate sup