  "source_text": "GENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who\npass the assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and attitudes\nto perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgements on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be\nconducted or carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a particular\narea of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the individual. It\nprovides information on critical aspects of competency, underpinning knowledge,\nunderpinning skills, resource implications, assessment method and context of\nassessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when\nevidence should be collected\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve all\nthe required units of competency for a national qualification defined under the\nTraining Regulations. NCs are aligned to specific levels within the PTQF\n\n--- PDF PAGE 84 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n84\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work is\nto be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s\nskills, knowledge and attitudes gained from life and work experiences outside\nregistered training programs\n\n20) Resource Implications - refers to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n21) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n22) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serves as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n23) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n24) Underpinning Skills - refers to the list of the skills needed to achieve the\nelements and performance criteria in the unit of competency. It includes generic\nand industry specific skills\n\n25) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\nSECTOR SPECIFIC\n\n1. Attack - Attempt to destroy, expose, alter, disable, steal or gain unauthorized\naccess to or make unauthorized use of any item that has value to the organization\n2. Asset - Any item that has value to the organization\n3. Attribute - Property or characteristic of an object that can be distinguished\nquantitatively or qualitatively by human or automated means\n4. Authentication - Provision of assurance that a claimed characteristic of an entity\nis correct\n\n--- PDF PAGE 85 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n85\n5. Authenticity - Property that an entity is what it claims to be\n6. Availability - Property of being accessible and usable upon demand by an\nauthorized entity\n7. Business Continuity - Procedures and/or processes for ensuring continued\nbusiness operations\n8. CERT - Computer Emergency Response Team (CERT) or Computer Security and\nIncident Response Team (CSIRT) refers to “an organization that studies computer\nand network security in order to provide incident response services to victims of\nattacks, publish alerts concerning vulnerabilities and threats, and to offer other\ninformation to help improve computer and network security”. At present, “both\nterms (CERT and CSIRT) are used in a synonymous manner” (ENISA, 2015 and\nENISA, 2015a).\n9. Computer security also known as cyber security or IT security - Is the\nprotection of computer systems from the theft or damage to their hardware,\nsoftware or information, as well as from disruption or misdirection of the services\nthey provide.\n10. Confidentiality - Property that information is not made available or disclosed to\nunauthorized individuals, entities, or processes.\n11. Consequence - Outcome of an event affecting objectives.\n12. Control - Means of managing risk, including policies, procedures, guidelines,\npractices or organizational structures, which can be of administrative, technical,\nmanagement, or legal nature.\n13. Control Objective - Statement describing what is to be achieved as a result of\nimplementing controls.\n14. Corrective Action - Action to eliminate the cause of a detected non-conformity or\nother undesirable situation\n15. Cyber threat monitoring - is a solution that uses strategic intelligence to\ncontinuously analyze, evaluate, and monitor an organization's networks and\nendpoints for evidence of security threats, such as network intrusion, ransomware,\nand other malware attacks\n16. Data - objective measurements of the attributes (characteristics) of entities such as\npeople, places, things, and events.\n17. Data - Collection of values assigned to base measures, derived measures and/or\nindicators. This definition applies only within the context of ISO/IEC 27004:2009\n18. DICT - Department of Information and Communications Technology\n19. DDoS - Distributed Denial of Service\n20. Documentation – a collection of documents or information.\n21. Edit – to modify the form or format of data\n22. Effect - Is a deviation from the expected — positive and/or negative.\n23. Effectiveness - Extent to which planned activities are realized and planned results\nachieved.\n24. Efficiency - Relationship between the results achieved and the resources used.\n25. Electronic Discovery (e-Discovery) - is the process of identifying, preserving,\ncollecting, preparing, analyzing, reviewing, and producing electronically stored\n\n--- PDF PAGE 86 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n86\ninformation (“ESI”) relevant to pending or anticipated litigation, or requested in\ngovernment inquiries.\n26. End-user – anyone who uses an information system or the information it\nproduces.\n27. Ergonomics - the science and technology emphasizing the safety, comfort, and\nease of use of human-operated machines. The goal of ergonomics is to produce\nsystems that are user-friendly: safe, comfortable and easy to use.\n28. Event - Occurrence or change of a particular set of circumstances\n29. File folders, also called directories, - a way to organize computer files.\n30. Guideline - Description that clarifies what should be done and how, to achieve the\nobjectives set out in policies.\n31. ICT systems - Hardware, software, firmware of computers, telecommunications\nand network equipment or other electronic information handling systems and\nassociated equipment.\n32. Incident – any flagged alert of threat/s detected by the security solution product.\n33. IDS - Intrusion Detection System\n34. IEC - International Electrotechnical Commission\n35. Information – data placed in a meaningful and useful context for an end user.\n36. Information and Communication Technology (ICT) - refers to technologies\nassociated with the transmission and exchange of data in the form of sound, text,\nvisual images, signals or any combination of those forms through the use of digital\ntechnology. It encompasses such services as telecommunications, posts,\nmultimedia, electronic commerce, broadcasting, and information technology.\n37. Information security - Preservation of confidentiality, integrity and availability of\ninformation. In addition, other properties, such as authenticity, accountability, non-\nrepudiation, and reliability can also be involved.\n38. Information security event - It refers to an identified occurrence of a system,\nservice or network state indicating a possible breach of information security policy\nor failure of safeguards, or a previously unknown situation that may be security\nrelevant\n39. Information security incident - It is indicated by a single or a series of unwanted\nor unexpected information security events that have a significant probability of\ncompromising business operations and threating information security\n40. Information system - Application, service, information technology asset, or any\nother information handling component\n41. Infrastructure - Facilities and equipment to enable the ICT DR services, including\nbut not limited to power supply, telecommunications connections and\nenvironmental controls\n42. Integrity - Property of protecting the accuracy and completeness of assets\n43. ISMS - Information Security Management System\n44. ISO - International Standards Organization\n45. Local Area Network (LAN) – a communications network that typically connects\ncomputers, terminals, and other computerized devices within a limited physical\narea such as an office, building, manufacturing plant and other work sites.\n\n--- PDF PAGE 87 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n87\n46. Management - Coordinated activities to direct and control an organization\n47. Management system - Framework of guidelines, policies, procedures, processes\nand associated resources aimed at ensuring an organization meets its objectives\nMeasure Variable to which a value is assigned as the result of measurement\n48. Measurement - Process of obtaining information about the effectiveness of ISMS\nand controls using a measurement method, a measurement function, an analytical\nmodel, and decision criteria\n49. NCERT - National Computer Emergency Response Team\n50. Object - Item characterized through the measurement of its attributes\n51. Organizations - Entities which utilize ICT DR services\n52. Owner - Identifies an individual or entity that has approved management\nresponsibility for controlling the production, development, maintenance, use and\nsecurity of the assets. This term does not mean that the person actually has any\nproperty rights to the asset.\n53. POC - Point of Contact\n54. Policy - Overall intention and direction as formally expressed by management\n55. Problem solving skills – able to discern the questions raised by stakeholder on\nsecurity solution operation and handling; included but not limited to problems and\nthe threats identified by the security solution.\n56. Procedure - Specified way to carry out an activity or a process\n57. Process - Set of interrelated or interacting activities which transforms inputs into\noutputs\n58. Quality Assurance – methods for ensuring that information systems are free from\nerrors and fraud and provide information products of high quality.\n59. Record - Document stating results achieved or providing evidence of activities\nperformed\n60. Reliability - Property of consistent intended behavior and results\n61. Review - Activity undertaken to determine the suitability, adequacy and\neffectiveness (2.22) of the subject matter to achieve established objectives\n62. Review object - Specific item being reviewed\n63. Risk - Combination of the probability of an event and its consequence\n64. Risk acceptance - Decision to accept a risk\n65. Risk analysis - Process to comprehend the nature of risk and to determine the\nlevel of risk\n66. Risk assessment - Overall process of risk identification, risk analysis and risk\nevaluation\n67. Risk management - Coordinated activities to direct and control an organization\nwith regard to risk.\n68. SIEM - Security Information and Event Management\n69. Simulation - the process of imitating a real phenomenon with a set of\nmathematical formulas. Advanced computer programs can simulate weather\nconditions, chemical reactions, atomic reactions, even biological processes.\n\n--- PDF PAGE 88 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n88\n70. Software – computer programs and procedures concerned with the operation of\nan information system.\n71. Standards – measures of performance developed to evaluate the progress of a\nsystem toward its objectives\n72. Stakeholder - Person or organization that can affect, be affected by, or perceive\nthemselves to be affected by a decision or activity\n73. System – an assembly of methods, procedures, or techniques unified by regulated\ninteraction to form an organized whole\n74. Third party - Person or body that is recognized as being independent of the\nparties involved, as concerns the issue in question\n75. Threat - Potential cause of an unwanted incident, which may result in harm to a\nsystem or organization\n76. Threat monitoring - refers to a type of solution or process dedicated to\ncontinuously monitoring across networks and/or endpoints for signs of security\nthreats such as attempts at intrusions or data exfiltration.\n77. Ticket management system – ant document (physical or digital) that possessed\nthe following – reporter, time, date, details of incident and status of the case.\n78. User- friendly – a characteristic of human-operated equipment and systems that\nmakes them safe, comfortable, and easy to use.\n79. Validation - Confirmation, through the provision of objective evidence, that the\nrequirements for a specific intended use or application have been fulfilled\n80. Verification - Confirmation, through the provision of objective evidence, that\nspecified requirements have been fulfilled.\n81. Vulnerability - Weakness of an asset or control that can be exploited by one or\nmore threats\n\n--- PDF PAGE 89 ---\n_______________________________________________________________________________________________\nTR - Cyber Threat Monitoring NC I (ICTCTM124) Promulgated November 13, 2024\n\n89",
