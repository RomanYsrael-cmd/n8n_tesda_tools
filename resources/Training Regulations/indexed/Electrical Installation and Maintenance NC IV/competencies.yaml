        "source_text": "--- PDF PAGE 27 ---\nTR – EIM NC IV                                                                                   - 25 - \n \n \n                                                                                                      \n \n2.20 Common Construction Industry Competencies \n \n2.21 (1) Performance Criteria for Unit of Competency Elements -  This \nsection gives the details of Common Construction Industry  \nCompetencies including (1) Performance Criteria for Unit of \nCompetency Elements; (2) Range of Variable Training Components; \n(3) Evidence Guide for Assessment required for  ELECTRICAL \nINSTALLATION AND MAINTENANCE NC IV Qualification. \n \n \nUNIT OF COMPETENCY:\n(1) SUPERVISE PREPARATION OF \nCONSTRUCTION MATERIALS, \nTOOLS AND EQUIPMENT FOR \nASSIGNED TASKS. \n \n \nUNIT CODE                     :\n \nCON724201 \nUNIT DESCRIPTOR        :\nThis unit of Common Construction \nIndustry \nCompetency \ncovers \nthe \nknowledge, skills and attitudes on \nidentifying, requesting and receiving \nconstruction \nmaterials \nand \ntools \nbased on the required performance \nstandards. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  \nRange of Variable Training Components\n \n1.  Identify materials \n \n \n \n1.1 Materials are listed as per job requirements \n1.2 Quantity and description of materials    conform \nwith the job requirements \n1.3 Tools and accessories are identified according to \njob requirements \n \n \n2.   Requisition materials \n \n \n2.1 Materials and tools needed are requested \naccording to the list prepared \n2.2  Request is done as per company standard \noperating procedures (SOP) \n2.3 Substitute materials and tools are provided without \nsacrificing cost and quality of work \n \n \n3.  Receive and inspect  \n      materials  \n \n3.1 Materials and tools issued are inspected as per \nquantity and specification \n3.2 Tools, accessories and materials are checked for \ndamages according to enterprise procedures \n3.3 Materials and tools are set aside to appropriate \nlocation nearest to the workplace\n\n--- PDF PAGE 28 ---\nTR – EIM NC IV                                                                                   - 26 - \n \n \n                                                                                                      \n \n2.22  (1) Range of Variable Training Components \n \nVARIABLE TRAINING \nCOMPONENTS \nRANGE OF VARIATION \n1.  Materials and Tools \n \n1.1 Electrical supplies \n1.2 Structural \n1.3 Plumbing \n1.4 Welding/pipefitting \n1.5 Carpentry \n1.6 Masonry \n2.  Description of Materials and \nTools \n \n2.1 Brand name \n2.2 Size \n2.3 Capacity \n2.4 Kind of application \n3.  Company standard   \nprocedures \n3.1 Job order \n3.2 Requisition slip \n3.3 Borrower slip \n \n2.23  (1) Evidence Guide for Assessment \n \nASPECTS OF \nCOMPETENCY\nASSESSMENT EVIDENCE REQUIREMENTS \n \n1. Critical \naspects of \ncompetency \n \n \n \n \n \n \nAssessment requires evidence that the candidate: \n1.1 Listed materials and tools according to quantity and job \nrequirements  \n1.2 Requested materials and tools according to the list prepared \nand as per company SOP \n1.3 Inspected issued materials and tools as per quantity and job \nspecifications \n1.4 Tools provided with appropriate safety devices \n \n2. Underpinning \nknowledge \n \n \n2.1 Types and uses of construction materials and tools \n2.2 Different forms \n2.3 Requisition procedures \n \n3. Underpinning \nskills \n \n \n3.1 Preparing materials and tools \n3.2 Proper handling of tools and equipment \n3.3 Following instructions \n4. Resource \nimplications \n \n \n \n \nThe following resources should be provided: \n4.1 Workplace location \n4.2 Materials relevant to the unit of competency \n4.3 Technical plans, drawings and specifications relevant to the \nactivities\n",
