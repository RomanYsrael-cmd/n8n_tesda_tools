        "source_title": "Elements UNIT OF COMPETENCY: (3) APPLY PROBLEM SOLVING TECHNIQUES IN THE WORKPLACE",
        "source_text": "--- PDF PAGE 13 ---\nTR – EIM NC IV                                                                                   - 11 - \n \n \n                                                                                                      \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1. Observation of work activities of the individual member in \nrelation to the work activities of the group \n5.2. Observation of simulation and or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n5.3. Case studies and scenarios as a basis for discussion of \nissues and strategies in teamwork \n6. Context for \nAssessment \n6.1. Competency may be assessed in workplace or in a \nsimulated workplace setting \n6.2. Assessment shall be observed while task are being \nundertaken whether individually or in-group \n \n2.11    (3) Performance Criteria for Unit of Competency Elements \nUNIT OF COMPETENCY: \n(3) APPLY PROBLEM SOLVING  \nTECHNIQUES IN THE WORKPLACE \nUNIT CODE \n: 500311117 \nUNIT DESCRIPTOR \n: This Unit of Basic Worker Competency \ncovers the knowledge, skills and attitudes \nrequired to apply the process of problem \nsolving and other problems beyond those \nassociated directly with the process unit. It \nincludes \nthe \napplication \nof \nstructured \nprocesses and improvement tools.  This \ncompetency is typically performed by an \nexperienced technician, team leader or \nsupervisor. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  \nRange of Variable Training Components\n1. \nAnalyze the problem \n1.1.  Issues/concerns are evaluated based on data \ngathered \n1.2.  Possible causes of problem are identified within the \narea of responsibility as based on experience and \nthe use of problem solving tools/analytical techniques \n1.3     Possible cause statements are developed based on  \n         findings \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  \nRange of Variable Training Components\n2. \nIdentify possible \nsolutions \n2.1  All possible options are considered for resolution of \nthe problem in accordance with safety and operating \nprocedures \n2.2  Strengths and weaknesses of possible options are \nconsidered \n2.3\nCorrective action is determined to resolve the problem\n\n--- PDF PAGE 14 ---\nTR – EIM NC IV                                                                                   - 12 - \n \n \n                                                                                                      \nand its possible future causes\n3. \nRecommend solution \nto higher \nmanagement \n3.1  Report/communication or documentation are \nprepared \n3.2 Recommendations are presented to appropriate \npersonnel \n3.3   Recommendations are followed-up, if required \n4. \nImplement solution \n4.1   Measurable objectives are identified \n4.2   Resource needs are identified \n4.3 Timelines are identified in accordance with plan\n5. \nEvaluate/Monitor \nresults and outcome \n5.1. Processes and improvements are identified based on \nevaluative assessment of problem \n5.2. Recommendations are prepared and submitted to \nsuperiors. \n \n2.12  (3) Range of Variable Training Components \n \nVARIABLE \nTRAINING \nCOMPONENTS \nRANGE OF VARIATION \n1. Area of \nresponsibility \nVariables may include but are limited to:  \n1.1. \nWork environment \n1.2. \nProblem solution processes  \n1.3. \nPreventative maintenance and diagnostic policy  \n1.4. \nRoles and technical responsibilities  \n2. Occupational \nHealth and Safety \n2.1. \nAs per company, statutory and vendor requirements, \nergonomic and environmental factors must be \nconsidered during the demonstration of this competency. \n3. Communication  \n3.1. \nVariables may include but are not limited to: \n3.2. \nWritten communication can involve both hand written and \nprinted material, internal memos, electronic mail, briefing \nnotes and bulletin boards. \n4. Documentation \n4.1. \nAudit trails \n4.2. \nNaming standards  \n4.3. \nVersion control  \n \n \n2.12 (3) Evidence Guide for Assessment \n \n \nASPECTS OF \nCOMPETENCY \nASSESSMENT EVIDENCE REQUIREMENTS\n\n--- PDF PAGE 15 ---\nTR – EIM NC IV                                                                                   - 13 - \n \n \n                                                                                                      \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Analyzed the problem \n1.2. Identified possible solutions \n1.3. Implemented solutions \n1.4. Recommended solutions to higher management \n1.5. Outcome evaluated/monitored \nEvidence of satisfactory performance in this unit can be \nobtained by observation of performance and questioning to \nindicate knowledge and understanding of the elements of the \ncompetency and performance criteria.  \n2. Underpinning \nKnowledge \n2.1. Broad understanding of systems, organizational systems \nand functions \n2.2. Broad knowledge of help desk and maintenance practices \n2.3. Current industry accepted hardware and software \nproducts with broad and detailed knowledge of its general \nfeatures and capabilities  \n2.4. Broad knowledge of the operating system \n2.5. Broad knowledge of the client business domain \n2.6. Broad knowledge based incorporating current industry \npractices related to escalation procedures \n2.7. Broad knowledge based of diagnostic tools \n2.8 .   General principles of OHS \n2.8. Divisional/unit responsibilities \n \n \n \n \n \n \n \n \nASPECTS OF \nCOMPETENCY \nASSESSMENT EVIDENCE REQUIREMENTS\n\n--- PDF PAGE 16 ---\nTR – EIM NC IV                                                                                   - 14 - \n \n \n                                                                                                      \n3. Underpinning \nSkills \n3.1. Decision making within a limited range of options. \n3.2. Communication is clear, precise and varies according to \nthe type of audience \n3.3. Teamwork in reference to personal responsibility \n3.4. Time management as applied to self-management. \n3.5. Analytical skills in relation to routine malfunctions. \n3.6. General customer service skills displayed. \n3.7. Questioning and active listening is employed to clarify \ngeneral information \n4. Resource \nImplications \n4.1. Assessment will require access to an operating plant over \nan extended period of time, or a suitable method of \ngathering evidence of operating ability over a range of \nsituations. A bank of scenarios/case studies/what ifs will \nbe required as well as bank of questions which will be \nused to probe the reasoning behind the observable \nactions. \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1. Through direct observation of application to tasks and \nquestions related to underpinning knowledge \nUnder general guidance, checking various stages of operation \nand at the completion of the activity against performance criteria \nand specifications \n6. Context for \nAssessment \n6.1. Competency may be assessed in the work place or in a \nsimulated work place setting \n6.2. Assessment shall be carried out through TESDA’s \nAccredited Assessment Centers/Venues while tasks are \nundertaken either individually or as part of a team under \nlimited supervision \n \n \n \n \n \n \n \n \n2.11      (4) Performance Criteria for Unit of Competency Elements\n",
