izational \nobjectives \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variable Training Components\n3. Represent the \norganization \n3.1 \nWhen participating in internal or external forums, \npresentation is relevant, appropriately researched \nand presented in a manner to promote the \norganization \n3.2 \nPresentation is clear and sequential and delivered \nwithin a predetermined time \n3.3 \nUtilize appropriate media to enhance presentation \n3.4 \nDifferences in views are respected \n3.5 \nWritten communication is consistent with \norganizational standards \n3.6 \nInquiries are responded in a manner consistent with \norganizational standard\n4. Facilitate group \ndiscussion \n4.1 \nMechanisms which enhance effective group \ninteraction is defined and implemented \n4.2 \nStrategies which encourage all group members to \nparticipate are used routinely \n4.3 \nObjectives and agenda for meetings and \ndiscussions are routinely set and followed \n4.4 \nRelevant information is provided to group to facilitate \noutcomes \n4.5 \nEvaluation of group communication strategies is \nundertaken to promote participation of all parties \n4.6 \nSpecific communication needs of individuals are \nidentified and addressed\n\n--- PDF PAGE 7 ---\nTR – EIM NC IV                                                                                   - 5 - \n \n \n                                                                                                      \n5. Conduct interview \n5.1 \nA range of appropriate communication strategies are \nemployed in interview situations \n5.2 \nRecords of interviews are made and maintained in \naccordance with organizational procedures \n5.3 \nEffective questioning, listening and nonverbal \ncommunication techniques are used to ensure that  \n            required message is communicated. \n \n \n2.12  (1) Range of Variable Training Components \n \nVARIABLE TRAINING \nCOMPONENTS\nRANGE OF VARIATION \n1. 