heet completely filled-up\n\n--- PDF PAGE 91 ---\nTR – EIM NC IV                                                                                   - 89 - \n \n \n                                                                                                      \nVARIABLE TRAINING \nCOMPONENTS \nRANGE OF VARIATION \n \n \n5.16  Energizing electrical system  \nAppropriate instrument is used in the testing \nFinal check for loose connection, wire \narrangement, cleanliness, enclosure \nappearance insulation resistance \nmeasurement in the presence of \ncommission’s team as per client standard \nrequirement \nEnergize equipment one-by-one \nVoltage and current measurement within \ntolerable limit base on equipment \nnameplate (e.g. 5% 220 VAC) in the \npresence of commissioning team \nCompletely filled-up record form for all \nmeasurement \n \n \n2.33  (10) Evidence Guide for Assessment \n \n \nASPECTS OF \nCOMPETENCY \n \nASSESSMENT EVIDENCE REQUIREMENTS \n1.  Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1  Planned commissioning procedures in line with job \nrequirements \n1.2  Prepared/obtained materials, PPE, tools, equipment and \ntesting  devices in line with established procedures and job \nspecifications \n1.3  Demonstrated compliance with safety regulations applicable \nto  worksite operations \n1.4   Performed commissioning activities in line with established \nprocedures \n1.5  Undertaken final inspection to ensure commissioning \nelectrical  \n       system meet job requirements \n1.6  Communicated effectively with others to ensure safe and   \n       effective work operations \n1.7  Prepared complete report of commissioned electrical \nequipment/ system \n1.8   Demonstrated good working attitudes\n\n--- PDF PAGE 92 ---\nTR – EIM NC IV                                                                                   - 90 - \n \n \n                                                                                    