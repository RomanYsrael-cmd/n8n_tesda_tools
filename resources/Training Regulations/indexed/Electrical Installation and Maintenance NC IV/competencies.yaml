        "evidence_guide": {
          "source_text": "ASPECTS OF \nCOMPETENCY \nASSESSMENT EVIDENCE REQUIREMENTS \n4. Resource \nimplications \nThe following resources should be provided: \n4.1 Workplace \n4.2 Drawings and specification relevant to task \n4.3 Materials and instrument relevant to proposed activity\n5. Methods of \nassessment \nCompetency should be assessed through: \n5.1 Direct observation \n5.2 Questions/interview \n5.3 Written test related to underpinning knowledge\n6. Context of \nassessment \n6.1 Competency assessment may occur in the workplace or in any \nappropriate simulated environment \n6.2 Assessment shall be observed while task are being undertaken \nwhether individually or in group \n6.3 Competency assessment must be undertaken in accordance \nwith the endorsed TESDA assessment guidelines\n \n2.21 (4) Performance Criteria for Unit of Competency Elements \n \nUNIT OF COMPETENCY: \n(4) SUPERVISE MENSURATION AND \nRELATED COMPUTATIONS.\nUNIT CODE                     : \nCON311203 \nUNIT DESCRIPTOR        : This unit of Common Construction \nIndustry \nCompetency \ncovers \nthe \nknowledge, skills and attitudes on \nidentifying and measuring objects based \non the required performance standards. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variable Training Components\n \n1. Select measuring \ninstruments \n \n \n \n1.1  Object or component to be measured is identified, \nclassified \nand \ninterpreted \naccording \nto \nthe \nappropriate regular geometric shape  \n1.2   Measuring tools are selected/identified as per \nobject to be measured or job requirements \n1.3   Correct specifications are obtained from relevant \nsources \n1.4   Appropriate measuring instruments are selected \naccording to job requirements   \n1.5  Alternative measuring tools are used without \nsacrificing cost and quality of work\n2.  Carry out measurements \nand calculations \n \n \n2.1 Accurate measurements are obtained according \nto job requirements \n2.3  Alternative measuring tools are used  \n        without sacrificing cost and quality of work \n2.4  Calculation needed to complete work tasks are \nperformed using the four basic process of addition \n(+), subtraction (-), multiplication (x) and division\n\n--- PDF PAGE 35 ---\nTR – EIM NC IV                                                                                   - 33 - \n \n \n                                                                                                      \n(/) including but not limited to: trigonometric \nfunctions, algebraic computations \n2.5 Calculations involving fractions, percentages and \nmixed numbers are used to complete workplace \ntasks \n2.6 Numerical computation is self-checked and \ncorrected for accuracy \n2.7 Instruments are read to the limit of accuracy of the \ntool \n2.8 Systems of measurement identified and converted \naccording to job requirements/ISO \n2.9  Workpieces are measured according to job \nrequirements \n \n2.22  (4) Range of Variable Training Components \n \nVARIABLE \nTRAINING \nCOMPONENTS\nRANGE OF VARIATION \n1. Geometric \nshape \n \n \n \n \n \n Including but is not limited to: \n1.1 Round \n1.2 Square \n1.3 Rectangular \n1.4 Triangle \n1.5 Sphere \n1.6 Conical \n2. Measuring \ninstruments \nIncluding but not limited to: \n2.1 Micrometer (In-out, depth) \n2.2 Vernier caliper (out, inside) \n2.3 Dial gauge with mag, std. \n2.4 Straight edge \n2.5 Thickness gauge \n2.6 Torque gauge \n2.7 Small hole gauge \n2.8 Telescopic gauge \n2.9 Try-square \n \n2.10 Protractor \n2.11 Combination gauge \n2.12 Steel rule \n2.13 Voltmeter \n2.14 Ammeter \n2.15 Mega-ohmeter \n2.16 Kilowatt hour meter \n2.17 Gauges \n2.18 Thermometers \n3. Measurements \nand calculations \n \n3.1 Linear \n3.2 Volume \n3.3 Area \n3.4 Wattage \n3.5 Voltage \n3.6 Resistance \n3.7 Amperage \n3.8 Frequency \n3.9 Impedance \n3.10 Conductance \n3.11 Capacitance \n \n3.12 Displacement \n3.13 Inside diameter \n3.14 Circumference \n3.15 Length \n3.16 Thickness \n3.17 Outside diameter \n3.18 Taper \n3.19 Out of roundness \n3.20 Oil clearance \n3.21 End play/Thrust \nclearance\n\n--- PDF PAGE 36 ---\nTR – EIM NC IV                                                                                   - 34 - \n \n \n                                                                                                      \n \n2.23  (4) Evidence Guide for Assessment \n \nASPECTS OF \nCOMPETENCY \nASSESSMENT EVIDENCE REQUIREMENTS \n1. Critical \naspects \n     of \ncompetency \nAssessment requires that the candidate: \n1.1 Selected and prepared appropriate measuring instruments in \naccordance with job requirements \n1.2 Performed measurements and calculations according to job \nrequirements/ ISO \n2. Underpinning \nknowledge \n \n \n \n \n \n2.1 TRADE MATHEMATICS / MENSURATION \n Four fundamental operation \n Linear measurement \n Dimensions \n Unit conversion \n Ratio and proportion \n Trigonometric functions \n Algebraic equations \n3. Underpinning \nskills \n3.1 Performing calculation by addition, subtraction, multiplication \nand division; trigonometric functions and algebraic equations \n3.2 Visualizing objects and shapes \n3.3 Interpreting formulas for volume, areas, perimeters of plane and \ngeometric figures \n3.4 Proper handling of measuring instruments \n \n4. Resource \nimplications \nThe following resources should be provided: \n4.1 Workplace location \n4.2 Problems to solve \n4.3 Measuring instrument appropriate to carry out tasks \n4.4 Instructional materials relevant to the propose activity \n \nAssessment of underpinning knowledge and practical skills may be \ncombined\n5. Methods of \nassessment \nCompetency should be assessed through: \n5.1 Actual demonstration \n5.2 Direct observation \n5.3 Written test/questioning related to underpinning knowledge \n \n6. Context of \nassessment \n6.1 Competency assessment may occur in workplace or any \nappropriate simulated environment \n6.2 Assessment shall be observed while task are being undertaken \nwhether individually or in group \n6.3 Competency assessment must be undertaken in accordance \nwith the TESDA assessment guidelines",
