        "source_title": "Elements UNIT TITLE : (11) PERFORM PROGRAMMING AND INSTALLATION OF BASIC PROGRAMMABLE LOGIC CONTROLLER (PLC) SYSTEMS.",
        "source_text": "--- PDF PAGE 93 ---\nTR – EIM NC IV                                                                                   - 91 - \n \n \n                                                                                                      \n \n2.31 (11) Performance Criteria for Unit of Competency Elements \n \nUNIT TITLE \n: (11) PERFORM PROGRAMMING AND \nINSTALLATION OF BASIC PROGRAMMABLE \nLOGIC CONTROLLER (PLC) SYSTEMS. \nUNIT CODE \n:  CON724324 \nUNIT DESCRIPTOR : This module of Core Electrical Competency covers \nthe knowledge, skill and attitudes necessary to \ninstall and program a basic programmable logic \ncontrol. \n \nVARIABLE TRAINING \nCOMPONENTS \nPERFORMANCE CRITERIA \nItalicized  terms are elaborated in the                            \nRange of Variable Training\n1. \nPlan and prepare for \ninstallation  \n1.1. \nWork instructions are read and interpreted to \ndetermine job requirements. \n1.2. \nTools and testing devices needed to carry out the \ninstallation work are selected in accordance with \nestablished procedures and checked for correct \noperation and safety. \n1.3. \nMaterials and components necessary to complete \nthe work are obtained in accordance with job \nrequirements. \n2. \nInstall/Test field and \ncontrol devices \n2.1. \nAppropriate personal protective equipment is \nworn in line with standard operating procedures. \n2.2. \nOccupational Health  & Safety policies and \nprocedures for installation are followed in line with \nthe job requirements. \n2.3. \nDevices are installed and tested in accordance with \nmanufacturer’s instructions and requirements \n2.4. \nWork site is cleaned and cleared of all debris and \nmade  safe in accordance with the company \nrequirements \n2.5. \nReport on installation and testing of equipment is \nprepared according to company’s \nprocedures/policies. \n2.6. \nUnplanned events or conditions are responded to in \naccordance with established procedures\n3. \nCreate/Modify, \ninstall and test basic  \nPLC  program \n3.1. \nAppropriate language is used according to \napplications. \n3.2. \nCreated/modified PLC program is tested / run to \nensure all syntax errors are corrected. \n3.3. \nTest processes are reviewed to ensure defect-free \nPLC program. \n3.4. \nExternal documentation and back-up programs \nrequired for users are created/prepared according \nto company standards.\n\n--- PDF PAGE 94 ---\nTR – EIM NC IV                                                                                   - 92 - \n \n \n                                                                                                      \n \n2.32  (11) Range of Variable Training Components \n \nVARIABLE TRAINING \nCOMPONENTS \nRANGE OF VARIATION \n1. Tools \nIncludes the following but not limited to: \n1.1 \nPliers; assorted \n1.2 \nScrewdrivers; assorted \n1.3\nWrenches; assorted \n2. Test equipment/instruments \nIncludes the following but not limited to: \n2.1 \nMulti-tester (VOM) \n2.2 \nAmmeter \n2.3 \nSignal generator \n2.4 \nCalibrators \n2.5 \nFlow meters \n2.6 \nPressure meter \n2.7 \nThermometer \n2.8 \nLow voltage power supply (DC) \n2.9 \nComputers (PC/laptop)/Programming \nconsole\n3. Materials and components \nIncludes the following but not limited to: \n3.1 \nWires \n3.2 \nTerminal lugs \n3.3 \nTerminal blocks \n3.4 \nTerminal wire marker \n3.5 \nSensors \n3.5.1 Heat/temperature \n3.5.2 Pressure \n3.5.3 Flow \n3.5.4 Motion \n3.5.5 Proximity \n3.6 \nLimit switches \n3.7\nRelays\n4. Personal protective equipment\nMay include but are not limited to: \n4.1 \nSafety helmet (hard hat/bump hat) \n4.2 \nSafety shoes \n4.3 \nEar muffs \n4.4 \nGoggles/Face shield \n4.5 \nSafety belt/Harness \n4.6 \nSafety Gloves \n4.7 \nSafety Mask (gas/fumes, dust) \n4.8\nProper working clothes\n5. Occupational Health & Safety \n(OH & S) policies and \nprocedures \n5.1 \nPhilippine Electrical Code (PEC) \n5.2 \nNational Building Code \n5.3 \nOH & S guidelines \n5.4 \nPhilippine environmental laws\n\n--- PDF PAGE 95 ---\nTR – EIM NC IV                                                                                   - 93 - \n \n \n                                                                                                      \nVARIABLE TRAINING \nCOMPONENTS \nRANGE OF VARIATION \n6. Field and control devices \nIncludes the following but not limited to: \n6.1 \nAnalogue devices \n6.1.1 Actuators \n6.1.2 Servo Motors \n6.1.3 Frequency drives \n6.1.4 Transducers \n6.1.5 Transmitters \n6.2 \nDigital devices \n6.2.1 Actuators \n6.2.2 Buzzers \n6.2.3 Lamps \n6.2.4 Limit switches \n6.2.5 Magnetic contactors \n6.2.6 Photo-sensors \n6.2.7\nProximity sensors\n7. Language \nIncludes but not limited to: \n1.1. Standard Programming language \n1.1.1. Ladder \n1.1.2. Mnemonics \n1.1.3. STL (Statement List) \n1.1.4. Function chart \n1.2.Procedure language\n \n2.33 (11) Evidence Guide for Assessment \n \n \nASPECTS OF \nCOMPETENCY \n \n \nASSESSMENT EVIDENCE REQUIREMENTS \n1. Critical aspect \nof competency \nAssessment must show that the candidate: \n \n1.1 \nInterpreted work instructions according to job \nrequirements \n1.2 \nChecked installed devices to ensure safety \n1.3 \nTested installed field and control devices \n1.4 \nGathered and documented information needed for the \ncreation/modification of the basic PLC program \n1.5 \nSelected appropriate basic PLC programming language \n1.6 \nTested created/modified basic PLC program \n1.7 \nPrepared a user-friendly documentation of the \ncreated/modified basic PLC program\n\n--- PDF PAGE 96 ---\nTR – EIM NC IV                                                                                   - 94 - \n \n \n                                                                                                      \n \nASPECTS OF \nCOMPETENCY \n \nASSESSMENT EVIDENCE REQUIREMENTS \n2. Underpinning \nknowledge \n2.1 \nOccupational health and safety procedures \n2.2 \nElectrical theories \n2.3 \nUse of test equipment/instruments \n2.4 \nBasic electronics \n2.5 \nDrawing interpretation \n2.6 \nElectromechanical technology \n2.7 \nPneumatics / Electro-Pneumatics \n2.8 \nHydraulics \n2.9 \nIndustrial motors \n2.10 Process Automation and Calibration \n2.11 Basic PLC Programming \n2.12 Concepts of I/O drivers \n2.13 Control applications  and concepts \n2.14 Circuit Analysis \n2.15 Basic Microprocessor Applications \n2.16 Operating Systems (Basic computer applications) \n2.17\nSequence control\n3. Underpinning \nskills \n3.1 \nReading skills required to interpret diagrams and work \ninstructions \n3.2 \nCommunication skills needed to interpret and define work \nprocedures \n3.3 \nProblem solving in emergency situation  \n3.4 \nProgramming skills \n4. Method of \nassessment \n4.1 \nThe assessor may select two of the following \nassessment methods to objectively assess the \ncandidate: \n4.1.1 Direct Observation \n4.1.2 Oral/Written Questioning \n4.1.3 Third Party Report  \n4.1.4 Practical Demonstration \n4.1.5 Portfolio\n5. Resource \nImplication \n5.1 \nTools  \n5.2 \nTest equipment/instruments \n5.3 \nField and control devices \n5.4 \nMaterials  \n5.5 \nPPE \n5.6 \nTechnical manuals \n5.7 \nPLC System \n5.8 \nAppropriate equipment \n \n6. Context of \nAssessment \n6.1        Assessment may be conducted in the workplace or in a \nsimulated work process and procedures\n\n--- PDF PAGE 97 ---\nTR – EIM NC IV                                                                                   - 95 - \n \n \n                                                                                                      \n \nELECTRICAL INSTALLATION & MAINTENANCE NC IV COMPETENCY MAP \n \nBASIC COMPETENCIES \n \nReceive and Respond to \nWorkplace Communication\nWork with Others \nDemonstrate work values \nPractice basic \nhousekeeping procedures\nParticipate in Workplace \nCommunication\nWork in a Team \nEnvironment\nPractice career \nprofessionalism\nPractice occupational health \nand safety procedures \nLead Workplace \nCommunication \nLead Small Working \nTeams \nDevelop and Practice \nNegotiating Skills With \nTeam Members \nGuide Effective Solutions \nto Problems Arising from \nWork Activities \nCheck and Develop the \nUse of Mathematical \nConcepts & Techniques \nUse Relevant Technologies \nApplicable to Assigned \nWork \nLead in Utilizing \nSpecialized \nCommunication Skills \nAssist in Developing \nTeam and Individuals \nApply Problem Solving \nTechniques in the \nWorkplace\nCollect, analyze and \norganize information \nPlan and Organize Work \nfor Several Working \nTeams\nPromote Environmental \nProtection \n \n \n \nCOMMON COMPETENCIES \n \nSupervise Preparation Construction \nMaterials, Tools & Equipment for \nAssigned Tasks\nEnsure Compliance with Standards \nProcedures, Specifications and Manuals \nof Instructions\nInterpret and Follow Technical \nDrawings and Plans \nSupervise Mensuration and \nRelated Computations \nSupervise Proper Use and \nMaintenance of Tools and \nEquipment\n \n \nCORE COMPETENCIES \n \nPrepare electrical \nmaterials and tools \nPerform roughing-in \nactivities for basic \nelectrical lay-out \nPerform installation of wiring \ndevices for power, lights & \nauxiliary outlets \nPerform installation \nof electrical wiring \n \nPerform installation of \nbasic electrical protection \nsystems \nPerform installation of basic \nauxiliary outlets and lighting \nfixtures \nPerform commissioning \non low voltage electrical \nsystems \n \nPrepare electric and \nhydraulic tools \nPerform roughing-in \nactivities for \ncommunication and \ndistribution systems\nInstall wiring devices for \nfloor and ground fault \ncurrent interrupting outlets \nInstall electrical \nprotection system for \nlightning and grounding \nInstall electrical lighting \non auxiliary outlets \nand lighting fixtures \nInstall communication, \nsignaling devices \nand remote control systems \non auxiliary equipment\nCommission installed \nelectrical systems \nPerform roughing-in and \nwiring activities for bus and \nunder-floor ducts \nPerform installation of \nwiring devices for floor \nand ground fault \ncurrent interrupting \noutlets  \nPerform installation of \nstandard electrical \nprotection system for \nlightning and grounding \nPerform installation of \nelectrical lighting \nsystems, auxiliary \noutlets and lighting \nfixtures \nPerform installation of \ndata measurement \nand control system on \nelectrical and auxiliary \nequipment \nAssemble and install \nelectrical lighting and \nmotor control systems  \nPerform \nmaintenance and \ntroubleshooting works \nSupervise/Monitor \ninstallation & maintenance \non electrical systems, \nauxiliary including control, \nlighting, power and \nprotection equipment\nPerform commissioning \nof electrical \nequipment/system \nPerform programming and \ninstallation of basic PLC \nsystems\n",
        "required_knowledge": null,
