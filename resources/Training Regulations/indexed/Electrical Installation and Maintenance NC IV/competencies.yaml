        "source_title": "Elements UNIT OF COMPETENCY: (9) Supervise/Monitor installation and maintenance on electrical systems, auxiliary including control, lighting power and protection equipment",
        "source_text": "--- PDF PAGE 71 ---\nTR – EIM NC IV                                                                                   - 69 - \n \n \n                                                                                                      \n \n \n2.31 (9) Performance Criteria for Unit of Competency Elements \n \nUNIT OF COMPETENCY: (9) Supervise/Monitor installation and \nmaintenance on electrical systems, \nauxiliary including control,  lighting power \nand protection equipment\nUNIT CODE                     :\nCON724322\nUNIT DESCRIPTOR        : This module of Core Electrical Competency \ncovers the knowledge, skill and attitudes in  \nsupervising/monitoring \nof \nelectrical \npractitioner for the installation and wiring of \nelectrical devices, auxiliary, lighting and \nprotection system equipment.\n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  \nRange of Variable Training Components\n1.  Plan and prepare  \nwork \n \n \n1.1    Instructions for the preparation of the work activity      \nare communicated and confirmed to immediate \nsuperior to ensure clear understanding \n1.2     Drawings/diagrams are read and interpreted in \naccordance with job requirements \n1.3    Correct type, quantity, size and rating of electrical \ndevices, auxiliary and protection system \nequipment and other materials are identified in line \nwith job requirements. \n1.4    Tools, equipment and personnel protective   \nequipment needed are identified/selected in \naccordance with established procedures \n1.5     Estimated time of work completion is determined in \naccordance with the job requirement. \n2.  Request materials, \ntools and equipment \n \n2.1  Quantity, usage and specifications of materials, tools \nand equipment are verified according to job \nrequirements \n2.2   Requisition form is properly filled-up according to list of \nmaterials, tools and equipment prepared \n2.3   Requisition forms are approved by immediate superior\n3.  Direct and monitor \ninstallation of \nelectrical, auxiliary \nand protection system \nequipment through \nworking teams \n \n \n3.1   Safety procedures are followed according to enterprise \nand government regulations. \n3.2   Installation criteria for electrical, auxiliary and \nprotection system equipment are carried out in line with \njob requirements and PEC standards. \n3.3   Work schedule is followed to ensure job is completed \non time in accordance with a quality standard. \n3.4   Further instructions are sought from the immediate \nsuperior in the event of unplanned events or conditions \noccurred. \n3.5   On-going checks of quality of the work are undertaken \nwith strict compliance in accordance with  \n       instructions and requirements.\n\n--- PDF PAGE 72 ---\nTR – EIM NC IV                                                                                   - 70 - \n \n \n                                                                                                      \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  \nRange of Variable Training Components\n4.  Direct and monitor \ninstallation of  electrical \nwiring \n \n \n4.1   Safety procedures are followed according to \nenterprise and government regulations. \n4.2    Electrical wiring criteria are followed in line with job \nrequirements and PEC standard. \n4.3    Work schedule is followed to ensure job is completed \non time in accordance to a quality standard and with \nminimum wastage. \n4.4   Contingency measures are applied during occurrence \nof unplanned events or conditions.  \n4.5   On-going checks of quality of the work are     \nundertaken in accordance with instructions and        \nrequirements. \n4.6    Preliminary check / test are conducted in line with job \nrequirements.  \n5. Notify completion of \nwork \n5.1   Final checks are made to ensure that work            \nconforms with instructions and job requirements \n5.2   Immediate superior is notified upon completion of \nwork \n5.3   Tools, equipment and any excess resources and        \nmaterials are cleaned, checked and returned to \nstorage area in accordance with enterprise \nprocedures \n5.4    Work area is cleaned up and made safe in \naccordance with OHS requirements\n\n--- PDF PAGE 73 ---\nTR – EIM NC IV                                                                                   - 71 - \n \n \n                                                                                                      \n \n2.32 (9) Range Variable Training Components \n \nVARIABLE TRAINING \nCOMPONENTS \nRANGE OF VARIATION \n \n1. Drawings/diagram \n \nMay include but are not limited to: \n1.1   Control and power circuit diagram \n1.2   Termination diagram \n1.3   Schematic diagram  \n1.4   Logic diagram \n1.5   Process flow diagram \n1.6   Ladder diagram \n1.7   Block diagram \n1.8   Electrical plan \n \n2. Electrical devices \n \nMay include but are not limited to: \n2.1   Receptacles \n2.2   Outlets \n2.3   Switches \n-   Push button \n-   Selector switches \n-   Step switches  \n-   Meter switches \n-   Emergency switch \n \n2.4   Terminal blocks \n2.5   Relays \n-   Timers \n-   Counters \n \n2.6   Contactors \n-   Sensors \n-   Proximity switch \n-   Limit switch \n-   Smoke detector \n-   Fire detector \n-   Photo Electric switch \n-   Thermo controller \n-   Pressure switch \n-   Float switch \n-   Flow switch \n \n2.8   Metering devices\n\n--- PDF PAGE 74 ---\nTR – EIM NC IV                                                                                   - 72 - \n \n \n                                                                                                      \nVARIABLE TRAINING \nCOMPONENTS \nRANGE OF VARIATION \n3. Electrical /auxiliary \nequipment \nMay include but are not limited to: \n3.1    Power supply \n-   Automatic Voltage Regulator (AVR) \n-   Uninterruptible power supply (UPS) \n3.2    Generators and motors \n3.3    Transformer \n3.4    Capacitors \n3.5    Inverters/Rectifiers \n3.6    Controllers \n-   Motor controls \n-   Electro-mechanical controllers (e.g. Solenoid) \n-   Electro-Pneumatic controller \n-   Electronic drives \n-   Solid-state controls \n3.7    Battery bank and battery charger \n3.8    Fire alarm system \n-   Distributed control system (DCS) \n-   Combine PIC/PVC \n3.9    Auxiliary outlets \n-   Telephone \n-   Mass Antenna Television (MATV) \n-   Closed-circuit Television (CCTV) \n-   UTV Voice Data \n3.10   Communication system \n \n4. Protection system \nequipment \nMay include but are not limited to: \n4.1    Circuit breakers/Fuses \n-   Oil circuit breaker (OCB) \n-   Vacuum circuit breaker (VCB) \n-   Gas insulated circuit breaker (SF6) \n-   Enclosed circuit breaker (ECB) \n-   Earth leakage circuit breaker/RCCB \n-   Cut-out fuse / Time delay fuses \n-   Air circuit breaker (ACB)  \n4.2    Relays \n-   Over/Under voltage \n-   Over/Under current \n-   Phase Reversal/Failure \n \n4.3    High and Low Voltage Switch Gears  \n4.4    Motor Control Center (MCC) \n4.5    Motor Control Panel (MCP) \n4.6    Power /Lighting Panel\n\n--- PDF PAGE 75 ---\nTR – EIM NC IV                                                                                   - 73 - \n \n \n                                                                                                      \nVARIABLE TRAINING \nCOMPONENTS \nRANGE OF VARIATION \n \n \n \n \n4.7    Power Mitigated Devices \n-   Transient Voltage Surge Suppressor (TVSS) \n-   Power Conditioner  \n-   Harmonic Filter \n-   Harmonic Reactor \n4.8    Motor Guard \n4.9    Grounding system \n4.10  Ground Fault Circuit Interrupter (GFCI)  \n4.11  Atmospheric/Conventional Lightning Protection \nSystem \n5.  Tools and equipment \n \n \n \n \nMay include but not limited to: \n5.1   Electrical handtools (pliers, screwdrivers, \nwrenches, wires, splicer, knife, wire stripper) \n5.2   Multi-testers, mega-ohmmeter, clamp ammeter \n5.3   Tachometer \n5.4   Pressure gauge \n5.5   Industrial thermometer \n5.6   Frequency meter \n5.7   Flow meters \n5.8   Lux meters \n6.  Personnel Protective \nEquipment (PPE) \n \n \n \nMay include but not limited to: \n6.1    Working gloves \n6.2    Safety shoes \n6.3    Hard hat \n6.4    Safety goggles \n6.5    Gas mask \n6.7    Insulating mat \n6.8    Apron \n6.9    Safety belts \n6.10  Safety ladder \n7. Specifications \n7.1   Brand/Make \n-   Classification/Type \n7.2   Rating \n-   Voltage \n-   Current \n-   Power \n-   Frequency \n-   Temperature\n\n--- PDF PAGE 76 ---\nTR – EIM NC IV                                                                                   - 74 - \n \n \n                                                                                                      \nVARIABLE TRAINING \nCOMPOENTS \nRANGE OF VARIATON \n \n-   Service factor \n-   Degree of protection \n-   Utilization category \n-   Harmonics \n-   RPM  \n-   Pressure \n7.3   Phase \n7.4   Pole \n7.5   Range (Tools must be specific) \n7.6   Needed accessories \n8.  Installation criteria         \n \n8.1  Installed as per plan/instruction, specifications \nand diagrams \n8.2  Mounted horizontally and vertically aligned and \nuse shim as required \n8.3  Rigidly bolted/screwed in place (e.g. wall or \nceiling, flooring) \n8.4  Wires are cut to requirement and arranged to \nprevent unnecessary mechanical pressure to \ndevice terminal \n8.5   Functional as per standard testing procedures \n \n9.  Electrical wiring criteria \n9.1 Roughing-in works \nConduits are properly processed and laid out as per \njob requirements  \nPull, utility and junction boxes are mounted and \ninstalled as per job requirements \nProper fittings are used, screwed and mounted  \nCorrect ratings of enclosed over current protection \nare used \n \n9.2  Installing guide wires \nGuide wire sized to requirement with allowance of \nat least 150mm and hooked \n \n9.3  Pulling/laying electrical wires \nWires measured and cut to exact requirement \nRequired color coding followed \nCable puller firmly mounted \nCorrect size of pull wires/ropes as to load \nrequirement \nPulling compound to be used on big wire sizes \nNo damage on insulation \nFree conductor allowance as to field requirement\n\n--- PDF PAGE 77 ---\nTR – EIM NC IV                                                                                   - 75 - \n \n \n                                                                                                      \nVARIABLE TRAINING \nCOMPONENTS \nRANGE VARIATION \n \n \n9.4  Splicing wire and cable (e.g. solderless connectors \ncrimping type) \nSpliced wire and cables using standard splicing method, \ntools, right connector and terminal lug for size of \nwire as per PEC requirement \n \n9.5  Dressing electrical wire \nFree conductor allowance per PEC standard \nWire dressed/arranged for easy accessibility to electrical \ncomponent \nBend to conductor per code requirement to prevent \ndamage to insulation \n \n9.6  For cable glands \nCable gland sized to cable diameter \nCable gland installed complete with fittings \n \n9.7  For Bus bar \nInstalled bus bar securely and rigidly supported to \nmaintain distances between different phases per \nPEC standard. \nMounted on the same surface not less than 51mm and \nclearance not less than 26mm in any metal surface \nInstalled \nas \nper \nplan/shop \ndrawing \nand \nPEC \nrequirement \n \nAuxiliary Outlets and Lighting Fixtures: \n \n9.8  For porcelain receptacle \nRe-checked wire splicing as per plan prior to installation \nWire cut to requirement and arranged to prevent \nunnecessary mechanical pressure to receptacle \nterminal \nAll bolt tightened for rigid mounting \nNo gap between fixture base and ceiling \n \n9.9  For high/low bay sodium vapor \nSupport rigid enough to carry fixture load \nConduit stem plumb/perpendicular to ground \nMounting support to comply with plan details \nFixture mounted as per product technical brochure \nCorrect tapping at ballast terminal\n\n--- PDF PAGE 78 ---\nTR – EIM NC IV                                                                                   - 76 - \n \n \n                                                                                                      \nVARIABLE TRAINING \nCOMPONENTS \nRANGE VARIATION \n9. Electrical wiring criteria (cont.)\n \n9.10  For fluorescent fixtures \nRe-checked wire splicing as per plan prior to \ninstallation \nJunction box cleaned prior to installation \nWire cut to requirement and arranged prior to \nclosing with box cover \nFluorescent fixture horizontally aligned against wall \nNo gap between fixture base and ceiling \nRigidly screwed to ceiling \nBallet connection checked as to correct terminal \ntapping. \n \n9.11  For Flood light and spot light \nRe-checked wire splicing as per plan prior to \ninstallation \nBoxes cleaned and wire arranged prior to closing \nwith box cover \nFixture rigidly mounted \nBallast connection checked as to correct terminal \ntapping \nInstalled as per plan/installation instruction \n \n9.12  For halogen lamp \nRe-checked wire splicing as per plan prior to \ninstallation \nHole centering and distances of fixture per reflected \nceiling plan \nHole diameter exact to fixture requirement \nTransformer firmly mounted on non-combustible \nsupport \nBulb not to be touched by hand \nCover properly mounted and sealed \n \n9.13  For perimeter lighting (e.g. wall type, fence, \npole type) \nFoundation constructed as per plan \nPole plumb to ground upon erection, if required, \nshim to be provided \nFixture wired and tested prior to erection \nTest wiring for insulation breakdown minimum \nresistance tolerance 1000ohms/v  1 meg. \nInstalled as per product technical brochure\n\n--- PDF PAGE 79 ---\nTR – EIM NC IV                                                                                   - 77 - \n \n \n                                                                                                      \nVARIABLE TRAINING \nCOMPONENTS \nRANGE OF VARIATION \n \n10. Installation of equipment \nprotection system criteria \n \n10.1  For Grounding system \n Ground rod fully driven to earth per PEC std. \n Grounding conductor to be buried according to PEC \nstandard \n No splicing on ground conductor \n All connection to ground rod per specification (e.g. \nexothermic ground clamp, etc.) \n Resistance to ground per design requirement \n \n10.2  For earth leakage circuit breaker \n Horizontally and vertically aligned \n Earthwire solidly connected \n Rigidly bolted to enclosure \n Installed \nas \nper \nelectrical \ndrawings/schematic \ndiagrams and instructions \n \n10.3  For Atmospheric/conventional lightning protection \nsystem \n Ground rod fully driven to earth per PEC stds. \n Resistance to ground per design requirement \n No splicing on ground conductor \n Lightning counter rigidly mounted on walls & fix to \nstructure \n Air terminal or ionizer are rigidly mounted at roof \nsupport or steel structure \n Down conductor installed per plan \n All connector at ground per specification as to \nexothermic ground clamp, etc. \n Operational as per standard testing procedure \n \n10.4  For Power Circuit Breaker (PCB) and Vacuum \nCircuit Breaker (VCB) \n Horizontally and vertically aligned \n Circuit breaker (CB) housing rigidly bolted to \nmounting bracket and anchored to flooring \n CB bus terminals solidly connected to bus bars \n Minimized damage to paint \n Installed \nas \nper \nelectrical \ndrawings/schematic \ndiagrams and instructions\n\n--- PDF PAGE 80 ---\nTR – EIM NC IV                                                                                   - 78 - \n \n \n                                                                                                      \n \n2.33  (9) Evidence Guide for Assessment \n \n \nASPECTS OF \nCOMPETENCY \n \nASSESSMENT EVIDENCE REQUIREMENTS \n1.  Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1   Correctly interpreted work instructions \n1.2   Selected appropriate tools, testing instruments and materials \nfor electrical wiring installation \n1.3   Selected and used correct personal protective equipment \n1.4   Followed criteria for installation and wiring of electrical \ndevices, auxiliary and protection system equipment \n1.5   Followed safety procedures \n1.6   Undertaken checks of quality of the work in accordance with \ninstructions and job requirements \n1.7   Followed PEC regulations \n1.8   Demonstrated good working attitudes\n2.  Underpinning \nKnowledge  \n2.1   Materials use and specification \n2.2   Understand economic use of material \n2.3   Safe working procedures (including works in hazardous \nlocations) \n2.4   Philippine Electrical Code (PEC) requirements \n2.5   Correct procedures in installing electrical wiring \n2.6   Installation of communication/paging system \n2.7   Kinds of lighting fixtures and its application \n2.8   Basic Electronics \n2.9   Motor Controllers \n2.10   Motors and Generators \n2.11   Power Calculation  \n2.12   Time Management \n2.13   Mensuration \n2.14   Pneumatics / electro-pneumatics \n2.15   Basic Computer operations \n3.  Underpinning   \nSkills \n3.1   Interpreting plan and details  \n3.2   Planning and coordinating work scheduling \n3.3   Able in determining and classifying work environment \n3.4   Preparing materials \n3.5   Proper using of hand tools \n3.6   Splicing conductors \n3.7   Dressing/harnessing of wires \n3.8   Terminating wires \n3.9   Crimping/ Soldering wires and connectors \n3.10  Storing excess materials properly \n3.11  Cleaning worksite, tools and equipment \n3.12  Installing electrical wiring materials, equipment and \naccessories  \n3.13   Operating computer\n",
