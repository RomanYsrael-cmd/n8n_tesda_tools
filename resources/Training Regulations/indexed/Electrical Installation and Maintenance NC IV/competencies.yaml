          "source_text": "RANGE OF VARIATION \n1. Commissioning procedures \n1.1   Formulate checklist of machine and  \n        equipment parts  \n1.2   Check completeness of installation based on \nplans/diagrams \n1.3   Perform electrical testing \n1.4   Perform no-load and load testing \n1.5   Perform monitoring of meters and gauges \n1.6   Orient end-user regarding systems operations \n1.7   Turn over electrical equipment to end-user \n2.  Personal protective \nequipment (PPE) \nIncluding but not limited to: \n2.1   Working gloves \n2.2   Safety shoes \n2.3   Hard hat \n2.4   Face shield \n2.5   Insulating mat \n \n2.6   Ear plug \n3.  Tools, equipment and testing \ndevices \nIncluding but are not limited to: \n3.1   Electrical hand tools  \n-    Pliers  \n      -   Screwdrivers  \n      -   Wrenches  \n      -   Wire splicers \n      -   Electrician knives \n3.2   Testing instruments  \n-   Multi-tester (VOM) \n-   Ammeter \n-   Insulation resistance tester \n-   Ground resistance tester \n-   Lux meter \n-   Thermal scanner \n-   Flow meter \n-   Pressure gauge \n-   Pressure Analyzer/ Gauge manifold \n-   Leak tester \n3.3   Labeling machine \n3.4   Warning signages \n-   Lock-out/Tag-out \n3.5   Phase-sequence indicator \n3.6   Thermometer \n3.7   Tachometer \n3.8   Telephone/telephone handset\n\n--- PDF PAGE 84 ---\nTR – EIM NC IV                                                                                   - 82 - \n \n \n                                                                                                      \n4. Potential hazards \nIncluding but not limited to: \n4.1   Live wires \n4.2   Oil spill \n4.3   Chemical hazards \n4.4   Flammable materials \n4.5   Sources of energy \n4.6   Moving machine parts \n4.7   Sharp/pointed objects  \n4.8   Noise hazards \n4.9   Confined space \n5. Electrical testing criteria \nMay include but are not limited to: \n5.1 Continuity test  \nCompletely filled-up continuity test report  \nInstrument calibrated and certified annually \nUsed of appropriate test instrument (e.g. \nanalog/digital, multi-meter or ohmmeter) \nAll tools, instrument, equipment and materials \nin proper place without unnecessary things \nwithin work perimeter \n \n5.2  Electrical insulation test \nAppropriate instrument is used in the testing \nMegger test data sheet filled-up completely \nAccuracy of test result obtained within \ntolerable limit (e.g. 2 meg ohm  2%) \nInstrument calibrated and certified annually \n \n5.3  High potential test \nAppropriate instrument is used in the testing \nInstrument calibrated and certified annually \nTest Data Sheet completely filled-up  \nReading accuracy of test result obtained at  \n2% (3.kvac) \n \n5.4  Earth resistance test \nAppropriate instrument is used in the testing \nInstrument calibrated and certified annually \nTest report completely filled-up \nTest reading accuracy is obtained with \ntolerance limit (5 ohm) 3 point method \n \n5.5  Phase sequence test  \nAppropriate instrument is used in the testing \nTagging power line in accordance of phase \nsequence results \nfrom the main distribution panel down to the \nload \nCompletely filled-up report in accordance with \nthe test result\n\n--- PDF PAGE 85 ---\nTR – EIM NC IV                                                                                   - 83 - \n \n \n                                                                                                      \n \n \n5.6  Load test \nAppropriate instrument is used in the testing \nLoad test reading accuracy within tolerance \nlimit (e.g.  5% 220 VAC and full load \ncurrent equal or below name plate rating \nTest Data Sheet completely filled-up \n \n5.7  Voltage test  \nAppropriate instrument is used in the testing \nAccuracy of test result is obtained within \ntolerable limit (e.g.  10% 220 VAC) \nVoltage Test Data Sheet properly filled-up  \n \n5.8  Winding resistance test  \nAppropriate instrument is used in the testing \nInstrument calibrated and certified annually \nWinding Resistance Test Data Sheet \ncompletely filled-up \nAccuracy of test result is obtained within \ntolerable limit (e.g. 358 ohms  2%) \n5.9  Polarization index (P.I.) test \nAppropriate instrument is used in the testing \nPolarization Index Test Data Sheet filed-up \ncompletely  \nFollowed Polarization Index Test procedures  \nInstrument calibrated and certified annually \n \n5.10  Lock rotor test \nAppropriate instrument is used in the testing \nTest report completely filled-up \nTest reading accuracy is obtained within \ntolerable limit (e.g. 220 VAC,  2% 12A,  \n2% 25 watts) \n5.11  Free running test  \nAppropriate instrument is used in the testing \nTest reading accuracy is obtained within \ntolerable limit (e.g. 220 VAC,  2% 10A, 20 \nW  2%) \nTest report complete filled-up \n \n5.12  Open/short circuit test \nAppropriate instrument is used in the testing \nInstrument calibrated and certified annually \nTest reading accuracy is obtained with \ntolerable limit (e.g. 220 VAC   5%, 15A  \n2% 30 W  2%) \nTest report completely filled-up\n\n--- PDF PAGE 86 ---\nTR – EIM NC IV                                                                                   - 84 - \n \n \n                                                                                                      \n \n \n \n5.13  Transformer turn ratio test \nAppropriate instrument is used in the testing \nInstrument calibrated and certified annually \nTest reading accuracy is obtained with \ntolerable limit (e.g. 1.82  5%) \nCompletely filled-up TTR portion of \nTransformer Test Data Sheet  \n \n5.14  Dielectric strength test \nAppropriate instrument is used in the testing \nTest procedure for dielectric strength of oil \nfollowed \nReading accuracy of test result is obtained \n(e.g. 25kv  2%) \nTest Data Sheet completely filled-up \n \n5.15  Voltage excitation test  \nAppropriate instrument is used in the testing \nReading accuracy of test result is obtained \nwithin tolerable limit equal or below \nnameplate rating (e.g.  2% 120 V) \nTest Data Sheet completely filled-up \n \n5.16  Energizing electrical system  \nAppropriate instrument is used in the testing \nFinal check for loose connection, wire \narrangement, cleanliness, enclosure \nappearance insulation resistance \nmeasurement in the presence of \ncommission’s team as per client standard \nrequirement \nEnergize equipment one-by-one \nVoltage and current measurement within \ntolerable limit base on equipment \nnameplate (e.g. 5% 220 VAC) in the \npresence of commissioning team \nCompletely filled-up record form for all \nmeasurement\n\n--- PDF PAGE 87 ---\nTR – EIM NC IV                                                                                   - 85 - \n \n \n                                                                                                      \n \n \n2.32 (10) Range of Variable Training Components \n \nVARIABLE TRAINING \nCOMPONENTS \nRANGE OF VARIATION \n1. Commissioning procedures \n1.1   Formulate checklist of machine and equipment \nparts  \n1.2   Check completeness of installation based on \nplans/diagrams \n1.3   Perform electrical testing \n1.4   Perform no-load and load testing \n1.5   Perform monitoring of meters and gauges \n1.6   Orient end-user regarding systems operations \n1.7   Turn over electrical equipment to end-user \n2.  Personal protective \nequipment (PPE) \nIncluding but not limited to: \n2.1   Working gloves \n2.2   Safety shoes \n2.3   Hard hat \n2.4   Face shield \n2.5   Insulating mat \n2.6   Ear plug \n3.  Tools, equipment and testing \ndevices \nIncluding but are not limited to: \n3.1   Electrical hand tools  \n-    Pliers  \n      -   Screwdrivers  \n      -   Wrenches  \n      -   Wire splicers \n      -   Electrician knives \n3.2   Testing instruments  \n-   Multi-tester (VOM) \n-   Ammeter \n-   Insulation resistance tester \n-   Ground resistance tester \n-   Lux meter \n-   Thermal scanner \n-   Fl