        "source_text": "--- PDF PAGE 39 ---\nTR – EIM NC IV                                                                                   - 37 - \n \n \n                                                                                                      \n \n2.30 \nCore Electrical Competencies \n \n2.31 (1) Performance Criteria for Unit of Competency Elements - This \nsection gives the details of Core Electrical Competencies including \n(1) Performance Criteria for Unit of Competency Elements;                 \n(2) Range of Variable Training Components; (3) Evidence Guide for \nAssessment required for  ELECTRICAL INSTALLATION AND \nMAINTENANCE NC IV Qualification. \n \nUNIT OF COMPETENCY     : \n(1) PREPARE ELECTRIC AND \nHYDRAULIC TOOLS\n \n \nUNIT CODE                          :\nCON724308\n \n \nUNIT DESCRIPTOR             : \nThis \nunit \nof \nCore \nElectrical \nCompetencies \ndeals \nwith \nthe \nknowledge, skills and attitudes on \nidentifying and preparing materials and \nmaintenance of electric power and \nhydraulic tools.\n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  \nRange of Variable Training Components\n1. Request materials, \ntools and equipment \n \n1.1 Quantity, usage and specifications of materials, \ntools and equipment are verified according to job \nrequirements \n1.2 Requisition form is properly filled-up according to list \nof materials, tools and equipment prepared \n1.3 Requisition forms are approved by immediate \nsuperior\n \n2. Select electrical power \nand hydraulic tools \n \n \n \n2.1 Electrical power and hydraulic tools are identified \nand selected in line with job specification \n2.2 Tools are inspected for damage in line with enterprise \nrequirements \n2.3 Damaged tools are reported to supervisor and \nrepaired according to manufacturer’s specifications \n \n3. Maintain electrical \npower and hydraulic \n \n \n3.1 Electrical power and hydraulic tools are lubricated in \nline with enterprise requirements \n3.2 Auxiliary parts of power tools/hydraulic tools are \ninspected and replaced according to manufacturer’s \nspecifications \n3.3 Electrical power and hydraulic tools are safety stored \nin line with enterprise requirements\n\n--- PDF PAGE 40 ---\nTR – EIM NC IV                                                                                   - 38 - \n \n \n                                                                                                      \n \n2.32 (1) Range of Variable Training Components \n \nVARIABLE TRAINING \nCOMPONENTS \n \nRANGE OF VARIATION \n \n1. Specifications \n1.1 Brand/Make \n-   Classification/Type \n1.2 Rating \n-   Voltage \n-   Current \n-   Power \n-   Frequency \n-   Temperature \n-   Service factor \n-   Degree of protection \n-   Utilization category \n-   Harmonics \n-   RPM  \n-   Pressure \n1.3  Phase \n1.4  Pole \n1.5  Range (Tools must be specific) \n1.6\nNeeded accessories\n \n2.  Electrical power and \nhydraulic tools \n \n \n \n \nIncluding but not limited to: \n2.1 Electrical power tools \n- \nPower drills \n- \nPortable grinder \n- \nPower saw \n2.2 Hydraulic tools \n- \nPipe bender \n- \nJack hammer \n \n3.  Damaged tools \n \n \nIncluding but not limited to: \n3.1 Faulty plugs and cords of power tools \n3.2 Damaged housing and accessories \n3.3 Defective bearing, gasket, bushing \n3.4 Centrifugal switch \n3.5 Capacitors \n3.6 Carbon brush\n\n--- PDF PAGE 41 ---\nTR – EIM NC IV                                                                                   - 39 - \n \n \n                                                                                                      \n \n \n2.33   (1) Evidence Guide for Assessment \n \nASPECTS OF \nCOMPETENCY\nASSESSMENT EVIDENCE REQUIREMENTS \n1.  Critical \naspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Identified, selected electrical power and hydraulic tools in line  \nwith job specification/requirements \n1.2 Checked quality and ratings of tools and accessories in line  \n       with job requirements \n1.3 Inspected electrical tools for damages in line with enterprise   \nrequirements \n1.4  Reported and repaired damaged electrical materials and tools \nto supervisor \n1.5  Maintained and stored electrical materials, hand tools, electrical \npower tools and hydraulic tools  in line with manufacturer’s/ \nsupplier's specifications and enterprise requirements \n2.  Underpinning \nKnowledge  \n \n \n2.1 Types of electrical power tools \n2.2  Common damage to tools \n2.3  Maintenance procedure for electrical power and hydraulic tools \n \n3.  Underpinning  \nSkills \n3.1  Preparing materials  \n3.2  Cleaning and maintaining electrical power and hydraulic tools \n \n4.  Resource \nImplications \nThe following resources MUST be provided: \n4.1  Workplace location \n4.2  Tools appropriate for electrical installation \n5.  Methods of \nAssessment \nCompetency must be assessed through: \n5.1 Direct observation of candidate's application of knowledge to \ntasks.  \n5.2 Questions related to underpinning knowledge (Written Test) \n \n6.  Context for \nAssessment \n6.1 Competency may be assessed in the workplace or in a   \n       simulated workplace setting\n",
