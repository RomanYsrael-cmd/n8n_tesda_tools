alibrated and certified annually\n\n--- PDF PAGE 90 ---\nTR – EIM NC IV                                                                                   - 88 - \n \n \n                                                                                                      \nVARIABLE TRAINING \nCOMPONENTS \nRANGE OF VARIATION \n \n    5.10  Lock rotor test \nAppropriate instrument is used in the testing \nTest report completely filled-up \nTest reading accuracy is obtained within \ntolerable limit (e.g. 220 VAC,  2% 12A,  2% \n25 watts) \n \n5.11  Free running test  \nAppropriate instrument is used in the testing \nTest reading accuracy is obtained within \ntolerable limit (e.g. 220 VAC,  2% 10A, 20 \nW  2%) \nTest report complete filled-up \n \n5.12  Open/short circuit test \nAppropriate instrument is used in the testing \nInstrument calibrated and certified annually \nTest reading accuracy is obtained with tolerable \nlimit (e.g. 220 VAC   5%, 15A  2% 30 W  \n2%) \nTest report completely filled-up \n \n5.13  Transformer turn ratio test \nAppropriate instrument is used in the testing \nInstrument calibrated and certified annually \nTest reading accuracy is obtained with tolerable \nlimit (e.g. 1.82  5%) \nCompletely filled-up TTR portion of Transformer \nTest Data Sheet  \n5.14  Dielectric strength test \nAppropriate instrument is used in the testing \nTest procedure for dielectric strength of oil \nfollowed \nReading accuracy of test result is obtained (e.g. \n25kv  2%) \nTest Data Sheet completely filled-up \n \n5.15  Voltage excitation test  \nAppropriate instrument is used in the testing \nReading accuracy of test result is obtained \nwithin tolerable limit equal or below \nnameplate rating (e.g.  2% 120 V) \nTest Data Sheet completely filled-up\n\n--- PDF PAGE 91 ---\nTR – EIM NC IV                                                                                   - 89 - \n \n \n                                                                                                      \nVARIABLE TRAINING \nCOMPONENTS \nRANGE OF VARIATION \n \n \n5.16  Energizing electrical system  \nAppropriate instrument is used in the testing \nFinal check for loose connection, wire \narrangement, cleanliness, enclosure \nappearance insulation resistance \nmeasurement in the presence of \ncommission’s team as per client standard \nrequirement \nEnergize equipment one-by-one \nVoltage and current measurement within \ntolerable limit base on equipment \nnameplate (e.g. 5% 220 VAC) in the \npresence of commissioning team \nCompletely filled-up record form for all \nmeasurement \n \n \n2.33  (10) Evidence Guide for Assessment \n \n \nASPECTS OF \nCOMPETENCY \n \nASSESSMENT EVIDENCE REQUIREMENTS \n1.  Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1  Planned commissioning procedures in line with job \nrequirements \n1.2  Prepared/obtained materials, PPE, tools, equipment and \ntesting  devices in line with established procedures and job \nspecifications \n1.3  Demonstrated compliance with safety regulations applicable \nto  worksite operations \n1.4   Performed commissioning activities in line with established \nprocedures \n1.5  Undertaken final inspection to ensure commissioning \nelectrical  \n       system meet job requirements \n1.6  Communicated effectively with others to ensure safe and   \n       effective work operations \n1.7  Prepared complete report of commissioned electrical \nequipment/ system \n1.8   Demonstrated good working attitudes\n\n--- PDF PAGE 92 ---\nTR – EIM NC IV                                                                                   - 90 - \n \n \n                                                                                                      \n \nASPECTS OF \nCOMPETENCY \n \nASSESSMENT EVIDENCE REQUIREMENTS \n2.  Underpinning \nKnowledge  \n2.1  Handling of equipment, tools, materials and consumables \n2.2  Philippines Electrical Code (PEC) requirements \n2.3  Standard operating procedure in energizing electrical \nsystem \n2.4  Mensuration \n2.5  Knowledge on how to operate the test instruments \n2.6  Interpretation of electrical plans/shop drawings \n2.7  Electrical Laws and Principles \n2.8  Pneumatics and Electro-Pneumatics \n2.9  Computer Operations \n2.10  Environmental laws \n2.11  Occupational Health & Safety procedures \n3.  Underpinning \nSkills \n3.1   Interpreting plan and details  \n3.2   Tracing circuits \n3.3   Performing electrical test \n3.4   Using test instruments \n3.5   Troubleshooting skills \n3.6   Performing first-aid \n3.7   Identifying potential hazards and selecting prevention \nand/or control measures  \n3.8   Practicing safe working habits \n3.9   Operating computers \n3.10  Communication skills \n4.  Resource \nImplications \nThe following resources should be provided: \n4.1  Workplace location \n4.2 Tools and equipment appropriate to commissioning electrical  \nsystem \n4.3  Materials relevant to the proposed activity \n4.4  Drawings and specifications relevant to the task \n5.  Methods of \nAssessment \nCompetency in this unit must be assessed: \n5.1  Through direct observation of application of tasks. \n5.2  Oral questioning related to underpinning knowledge \n5.3  Written test or examination \n5.4  Third party report \n5.5  Demonstration (able to impart knowledge and skills) \n6.  Context for \nAssessment \n6.1  Competency may be assessed in the workplace or in a  \n        simulated workplace setting \n6.3 Assessment shall be observed while the tasks are being \nundertaken either individually or as part of a team under \nlimited supervision",
