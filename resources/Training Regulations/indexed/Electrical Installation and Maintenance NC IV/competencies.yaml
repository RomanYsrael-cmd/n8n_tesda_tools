ng criteria are followed in line with job requirements and established procedures 2.2 Electrical equipment/systems are commissioned in line with established procedures commissioned in line with established procedures 2.4 Unforeseen events are responded in line with established procedures and as per plans, draw 2.5 Records, electrical plans and schematic diagrams are revised/updated according to changes incurred during commissioning 2.6 Test data forms are filled-out and submitted to immediate superior for evaluation 3. Turn-over electrical equipment/systems 3.1 Final inspection is undertaken to ensure that commissioning of electrical system meets job requirements 3.2 Tools, equipment and any excess resources and materials are cleaned, checked and returned to storage area in accordance with enterprise procedures 3.3 Written report is prepared and submitted to immediate superior in accordance with enterprise procedures 3.4 Monitoring data sheet for the newly installed system is accomplished based on the job requirements 3.5 Orientation and technical assistance is provided to prospective operators based on company procedures. --- PDF PAGE 83 --- TR – EIM NC IV - 81 - 2.32 (10) Range of Variable Training Components VARIABLE TRAINING COMPONENTS RANGE OF VARIATION 1. Commissioning procedures 1.1 Formulate checklist of machine and equipment parts 1.2 Check completeness of installation based on plans/diagrams 1.3 Perform electrical testing 1.4 Perform no-load and load testing 1.5 Perform monitoring of meters and gauges 1.6 Orient end-user regarding systems operations 1.7 Turn over electrical equipment to end-user 2. Personal protective equipment (PPE) Including but not limited to: 2.1 Working gloves 2.2 Safety shoes 2.3 Hard hat 2.4 Face shield 2.5 Insulating mat 2.6 Ear plug 3. Tools, equipment and testing devices Including but are not limited to: 3.1 Electrical hand tools - Pliers - Screwdrivers - Wrenches - Wire splicers - Electrician knives 3.2 Testing instruments - Mul