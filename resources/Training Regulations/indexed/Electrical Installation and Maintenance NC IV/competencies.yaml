 \nMonitored work activities \n1.5. \nReviewed and evaluated work plans and activities \n2. Underpinning \nKnowledge \n2.1. \nOrganization’s strategic plan, policies rules and \nregulations, laws and objectives for work unit activities \nand priorities \n2.2. \nOrganizations policies, strategic plans, guidelines related \nto the role of the work unit \n2.3. \nTeam work and consultation strategies \n3. Underpinning \nSkills \n3.1. \nPlanning  \n3.2. \nLeading \n3.3. \nOrganizing \n3.4. \nCoordinating \n3.5. \nCommunication Skills \n3.6. \nInter-and intra-person/motivation skills \n3.7. \nPresentation skills \n4. Resource \nImplications \nThe following resources MUST be provided \n4.1. \nTools, equipment and facilities appropriate to the \nproposed activities \n4.2. \nMaterials relevant to the proposed activities \n4.3. \nWork plan schedules \n4.4. \nDrawings, sketches or blueprint \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1. \nDirect observation/questioning \n5.2. \nPractical exercises on Planning and Scheduling Work \nActivities \n5.3. \nThird Party Report (collection of competency evidence) \n6. Context for \nAssessment \n6.1. \nCompetency may be assessed in the workplace or in \nsimulated work\n",
