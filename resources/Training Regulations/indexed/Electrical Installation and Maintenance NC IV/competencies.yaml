              "source_text": "5.3 Portfolio (credentials) 5.4 Written Test (about symbols) 6. Context for Assessment 6.1 Competency may be assessed in the workplace – to observe/check workmanship, correct function of work, length of time in doing the work 6.2 Assessment shall be observed while the tasks are being undertaken either individually or as part of a team under limited supervision 2.31 (8) Performance Criteria for Unit of Competency Elements UNIT OF COMPETENCY : (8) PERFORM MAINTENANCE AND TROUBLESHOOTING WORKS. UNIT CODE : 502724321 UNIT DESCRIPTOR : This unit of Core Electrical Competency covers the knowledge, skill and attitudes in performing maintenance, troubleshooting and repair works. ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variable Training Components 1. Plan, prepare and coordinate maintenance works 1.1 Maintenance work schedule is prepared in accordance with machine/equipment operating time/condition 1.2 Work instructions are prepared according to machine’s manual and established enterprise procedures 1.3 Materials, tools, equipment, testing devices and PPE needed to complete job requirements are identified and requested/obtained in line with prepared work instructions 1.4 Potential hazards are identified for prevention and --- PDF PAGE 64 --- TR – EIM NC IV - 62 - ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variable Training Components control measures are selected in accordance with the work plan and site procedures 1.5 Safety permit/Hot work permit is secured in accordance with enterprise procedure. 1.6 Concerned department/personnel are informed on the schedule of work according to standard operating procedure. 2. Maintain electrical system or equipment 2.1 Safety policies and procedures are followed in accordance with OSHA and enterprise procedure 2.2 Electrical system or equipment parts are properly tested/cleaned/lubricated according to manufacturer or enterprise procedure. 2.3 Worn-out/malfunctioning electrical system or equipment parts are identified and replaced in accordance with manufacturer’s requirements or enterprise standards. 2.5 Readings of Electrical measuring instruments are checked and identified defective instruments are referred for calibration/replacement in accordance with enterprise procedure. 2.5 Connectors, bolts, nuts and screws are checked and tightened according to sizes and torque requirements. 2.6 Routinary/visual/sensory inspection is regularly conducted in line with normal operation. 2.7 Unforeseen events are responded in line with established procedures. 2.8 Ongoing check of quality and progress of works are undertaken with strict compliance in line with established procedures. 3. Troubleshoot faults in an Electrical System or equipment 3.1 Safety policies and procedures are followed 3.2 Availability of maintenance records are prepared in accordance with established procedure, or based on enterprise Quality Management System (QMS). 3.3 Circuit or equipment to be diagnosed is isolated (lockout/tagout) in accordance with established procedure or according to duly accepted standard practices. 3.4 Indicators/Symptoms of fault or failure are identified. 3.5 Necessary electrical test on the system or equipment is performed in accordance with established procedure or according to manufacturers guidelines. 3.6 Extent of the fault to include the time to accomplish the job and the spare parts needed is estimated according to extent of damage. --- PDF PAGE 65 --- TR – EIM NC IV - 63 - ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variable Training Components 3.7 Other works associated with the problem are coordinated with other concerned group. 3.8 Details of fault, possible cause, corrective action, recommendation to eliminate the problem are recorded accordingly. 3.9 Unforeseen events are responded in line with established procedures 4. Notify completion of work 4.1 Immediate superior is notified upon completion of work. 4.2 Performance tests are made to ensure that work conforms to instructions and job requirements. 4.3 Tools, equipment and any surplus materials are cleaned, checked and returned to storage area in accordance with established procedures. 4.4 Work area is cleaned up and made safe in accordance with OSHA requirements. 4.5 Service report is prepared and submitted to appropriate officer 2.32 (8) Range of Variable Training Components VARIABLE TRAINING COMPONENTS RANGE OF VARIATON 1. Maintenance work 1.1 Preventive 1.2 Corrective/Breakdown 1.3 Routine 1.4 Predictive 1.5 Condition based 3. Materials May include but not limited to: 2.1 Contact cleaner 2.2 Insulating varnish/materials 2.3 Carbon brushes 2.4 Sand paper 2.5 Waste rugs 2.6 Electrical tapes 2.7 Warning tags 2.8 Signages 2.9 Lockout/tagout 2.10 Lubricants 2.11 Motor cleaner 2.12 Insulating oil 2.13 Coolant --- PDF PAGE 66 --- TR – EIM NC IV - 64 - VARIABLE TRAINING COMPONENTS RANGE OF VARIATION 3. Tools, equipment and testing devices Including but not limited to: 3.1 Electrical hand tools - Pliers - Screwdrivers - Wrenches - Wire splicers - Knives - Bolt/Cable cutter - Knockout puncher - Torque wrench 3.2 Testing instruments/devices - Multi-tester (VOM) - Insulation resistance tester (Megger) - High potential tester - Low resistance tester - Phase sequence meter - Ammeter - Torque meter 3.3 Equipment - Labeling machine - Vacuum cleaner - Air blower - Dryer - Welding machine - Pressure washer - Vacuum pump 4. Personal protective equipment (PPE) Including but not limited to: 4.1 Working gloves 4.2 Safety shoes 4.3 Hard hat 4.4 Face shield 4.5 Insulating mat 4.6 Lockout tags 4.7 Safety goggles 4.8 Safety belt 4.9 Safety ladder 5. Potential hazards Including but not limited to: 5.1 Live wires 5.2 Oil spill 5.3 Chemical hazards 5.4 Flammable materials 5.5 Sources of energy 5.6 Moving machine parts 5.7 Sharp/pointed objects 5.8 Noise hazards 5.9 Confined space --- PDF PAGE 67 --- TR – EIM NC IV - 65 - VARIABLE TRAINING COMPONENTS RANGE OF VARIATION 6. Electrical system or equipment parts May include but not limited to: 6.1 Electrical - Carbon brushes - Brush holders - Slip ring - Commutators - Contactors - Relays - Circuit breakers - Wires - Timers - Switches and push buttons - Indicating lamps - Terminal blocks - Sensors 6.2 Mechanical - Bearings - Bushings - Shafting - Filters - Bolts and nuts - Belts - Pulley - Couplings - Gears 7. Electrical measuring instruments May include but are not limited to: 7.1 Multi-tester (VOM/DMM) 7.2 Insulation resistance tester (Megger) 7.3 High potential tester 7.4 Low resistance tester 7.5 Phase sequence meter 7.6 Ammeter 8. Maintenance records May include but are not limited to: 8.1 Electrical plans 8.2 Equipment electrical diagrams 8.3 Historical records - Job orders - Commissioning test record - Preventive Maintenance schedules - Corrective Maintenance records - Manufacturer’s maintenance guides - Equipment breakdown records - Periodic monitoring data - Service reports 8.4 Log book --- PDF PAGE 68 --- TR – EIM NC IV - 66 - VARIABLE TRAINING COMPONENTS RANGE OF VARIATION 9. Quality Management System 9.1 ISO 9001 9.2 QS 9000 9.3 TS 16949 9.4 ISO 14000 9.5 ISO14001 10. Indicators / Symptoms May include but not limited to: 10.1 Heating of parts 10.2 Loose connections 10.3 Burned or exposed parts 10.4 Malfunction of logic controls 10.5 Abnormal/Unusual Noise/Smell/vibration 10.6 Intermittent operation 10.7 High current reading 10.8 Tripping of breakers 11. Electrical test May include but not limited to: 11.1 Continuity test 11.2 Electrical insulation test 11.3 High potential test (as the need arises) 11.4 Earth resistance test 11.5 Phase sequence test 11.6 Load test 11.7 Winding resistance test 11.8 Free running test 12. Other works May include but not limited to: 12.1 Mechanical works 12.2 Computer programs 12.3 Communication systems 13. Unforeseen events May include but not limited to: 13.1 Natural calamities 13.2 Emergency situations 13.3 Accidents 14. Performance Test May include but not limited to: 14.1 Simulation Test/No Load Test 14.2 Phase sequence 14.3 Actual Operation 14.4 Temperature rise --- PDF PAGE 69 --- TR – EIM NC IV - 67 - 2.33 (8) Evidence Guide for Assessment ASPECTS OF COMPETENCY ASSESSMENT EVIDENCE REQUIREMENTS"
