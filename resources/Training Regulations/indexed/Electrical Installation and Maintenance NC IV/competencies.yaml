        "evidence_guide": {
          "source_text": "ASPECTS OF \nCOMPETENCY \n \n \nASSESSMENT EVIDENCE REQUIREMENTS \n1. Critical aspect \nof competency \nAssessment must show that the candidate: \n \n1.1 \nInterpreted work instructions according to job \nrequirements \n1.2 \nChecked installed devices to ensure safety \n1.3 \nTested installed field and control devices \n1.4 \nGathered and documented information needed for the \ncreation/modification of the basic PLC program \n1.5 \nSelected appropriate basic PLC programming language \n1.6 \nTested created/modified basic PLC program \n1.7 \nPrepared a user-friendly documentation of the \ncreated/modified basic PLC program\n\n--- PDF PAGE 96 ---\nTR – EIM NC IV                                                                                   - 94 - \n \n \n                                                                                                      \n \nASPECTS OF \nCOMPETENCY \n \nASSESSMENT EVIDENCE REQUIREMENTS \n2. Underpinning \nknowledge \n2.1 \nOccupational health and safety procedures \n2.2 \nElectrical theories \n2.3 \nUse of test equipment/instruments \n2.4 \nBasic electronics \n2.5 \nDrawing interpretation \n2.6 \nElectromechanical technology \n2.7 \nPneumatics / Electro-Pneumatics \n2.8 \nHydraulics \n2.9 \nIndustrial motors \n2.10 Process Automation and Calibration \n2.11 Basic PLC Programming \n2.12 Concepts of I/O drivers \n2.13 Control applications  and concepts \n2.14 Circuit Analysis \n2.15 Basic Microprocessor Applications \n2.16 Operating Systems (Basic computer applications) \n2.17\nSequence control\n3. Underpinning \nskills \n3.1 \nReading skills required to interpret diagrams and work \ninstructions \n3.2 \nCommunication skills needed to interpret and define work \nprocedures \n3.3 \nProblem solving in emergency situation  \n3.4 \nProgramming skills \n4. Method of \nassessment \n4.1 \nThe assessor may select two of the following \nassessment methods to objectively assess the \ncandidate: \n4.1.1 Direct Observation \n4.1.2 Oral/Written Questioning \n4.1.3 Third Party Report  \n4.1.4 Practical Demonstration \n4.1.5 Portfolio\n5. Resource \nImplication \n5.1 \nTools  \n5.2 \nTest equipment/instruments \n5.3 \nField and control devices \n5.4 \nMaterials  \n5.5 \nPPE \n5.6 \nTechnical manuals \n5.7 \nPLC System \n5.8 \nAppropriate equipment \n \n6. Context of \nAssessment \n6.1        Assessment may be conducted in the workplace or in a \nsimulated work process and procedures\n\n--- PDF PAGE 97 ---\nTR – EIM NC IV                                                                                   - 95 - \n \n \n                                                                                                      \n \nELECTRICAL INSTALLATION & MAINTENANCE NC IV COMPETENCY MAP \n \nBASIC COMPETENCIES \n \nReceive and Respond to \nWorkplace Communication\nWork with Others \nDemonstrate work values \nPractice basic \nhousekeeping procedures\nParticipate in Workplace \nCommunication\nWork in a Team \nEnvironment\nPractice career \nprofessionalism\nPractice occupational health \nand safety procedures \nLead Workplace \nCommunication \nLead Small Working \nTeams \nDevelop and Practice \nNegotiating Skills With \nTeam Members \nGuide Effective Solutions \nto Problems Arising from \nWork Activities \nCheck and Develop the \nUse of Mathematical \nConcepts & Techniques \nUse Relevant Technologies \nApplicable to Assigned \nWork \nLead in Utilizing \nSpecialized \nCommunication Skills \nAssist in Developing \nTeam and Individuals \nApply Problem Solving \nTechniques in the \nWorkplace\nCollect, analyze and \norganize information \nPlan and Organize Work \nfor Several Working \nTeams\nPromote Environmental \nProtection \n \n \n \nCOMMON COMPETENCIES \n \nSupervise Preparation Construction \nMaterials, Tools & Equipment for \nAssigned Tasks\nEnsure Compliance with Standards \nProcedures, Specifications and Manuals \nof Instructions\nInterpret and Follow Technical \nDrawings and Plans \nSupervise Mensuration and \nRelated Computations \nSupervise Proper Use and \nMaintenance of Tools and \nEquipment\n \n \nCORE COMPETENCIES \n \nPrepare electrical \nmaterials and tools \nPerform roughing-in \nactivities for basic \nelectrical lay-out \nPerform installation of wiring \ndevices for power, lights & \nauxiliary outlets \nPerform installation \nof electrical wiring \n \nPerform installation of \nbasic electrical protection \nsystems \nPerform installation of basic \nauxiliary outlets and lighting \nfixtures \nPerform commissioning \non low voltage electrical \nsystems \n \nPrepare electric and \nhydraulic tools \nPerform roughing-in \nactivities for \ncommunication and \ndistribution systems\nInstall wiring devices for \nfloor and ground fault \ncurrent interrupting outlets \nInstall electrical \nprotection system for \nlightning and grounding \nInstall electrical lighting \non auxiliary outlets \nand lighting fixtures \nInstall communication, \nsignaling devices \nand remote control systems \non auxiliary equipment\nCommission installed \nelectrical systems \nPerform roughing-in and \nwiring activities for bus and \nunder-floor ducts \nPerform installation of \nwiring devices for floor \nand ground fault \ncurrent interrupting \noutlets  \nPerform installation of \nstandard electrical \nprotection system for \nlightning and grounding \nPerform installation of \nelectrical lighting \nsystems, auxiliary \noutlets and lighting \nfixtures \nPerform installation of \ndata measurement \nand control system on \nelectrical and auxiliary \nequipment \nAssemble and install \nelectrical lighting and \nmotor control systems  \nPerform \nmaintenance and \ntroubleshooting works \nSupervise/Monitor \ninstallation & maintenance \non electrical systems, \nauxiliary including control, \nlighting, power and \nprotection equipment\nPerform commissioning \nof electrical \nequipment/system \nPerform programming and \ninstallation of basic PLC \nsystems",
