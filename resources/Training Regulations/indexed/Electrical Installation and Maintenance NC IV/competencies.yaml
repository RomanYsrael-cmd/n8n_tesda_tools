          "source_text": "RANGE OF VARIATION \n3.  Tools, equipment and testing \ndevices \nIncluding but not limited to: \n3.1   Electrical hand tools  \n-   Pliers  \n-   Screwdrivers  \n-   Wrenches  \n-   Wire splicers \n-   Knives \n-   Bolt/Cable cutter \n-   Knockout puncher \n-   Torque wrench \n3.2   Testing instruments/devices  \n-   Multi-tester (VOM) \n-   Insulation resistance tester (Megger) \n-   High potential tester \n-   Low resistance tester \n-   Phase sequence meter \n-   Ammeter \n-   Torque meter \n3.3   Equipment \n-   Labeling machine \n-   Vacuum cleaner \n-   Air blower \n-   Dryer \n-   Welding machine \n-   Pressure washer \n-  Vacuum pump\n4.  Personal protective \nequipment (PPE) \nIncluding but not limited to: \n4.1   Working gloves \n4.2   Safety shoes \n4.3   Hard hat \n4.4   Face shield \n4.5   Insulating mat \n4.6   Lockout tags \n4.7   Safety goggles \n4.8   Safety belt \n4.9   Safety ladder\n5. Potential hazards \n \n \n \n \n \n \n \n \n \n \nIncluding but not limited to: \n5.1   Live wires \n5.2   Oil spill \n5.3   Chemical hazards \n5.4   Flammable materials \n5.5   Sources of energy \n5.6   Moving machine parts \n5.7   Sharp/pointed objects  \n5.8   Noise hazards \n5.9   Confined space\n\n--- PDF PAGE 67 ---\nTR – EIM NC IV                                                                                   - 65 - \n \n \n                                                                                                      \nVARIABLE TRAINING \nCOMPONENTS \nRANGE OF VARIATION \n6. Electrical system or equipment \nparts \nMay include but not limited to: \n6.1   Electrical \n-   Carbon brushes \n-   Brush holders \n-   Slip ring \n-   Commutators \n-   Contactors \n-   Relays \n-   Circuit breakers \n-   Wires \n-   Timers \n-   Switches and push buttons \n-   Indicating lamps \n-   Terminal blocks \n-   Sensors \n6.2   Mechanical \n-   Bearings \n-   Bushings \n-   Shafting \n-   Filters \n-   Bolts and nuts \n-   Belts \n-   Pulley \n-   Couplings \n-  Gears \n7. Electrical measuring \ninstruments \nMay include but are not limited to: \n \n7.1   Multi-tester (VOM/DMM) \n7.2   Insulation resistance tester (Megger) \n7.3   High potential tester \n7.4   Low resistance tester \n7.5   Phase sequence meter \n7.6   Ammeter\n8. Maintenance records \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nMay include but are not limited to: \n8.1   Electrical plans \n8.2   Equipment electrical diagrams \n8.3   Historical records \n-   Job orders \n-   Commissioning test record \n-   Preventive Maintenance schedules \n-   Corrective Maintenance records \n-   Manufacturer’s maintenance guides \n-   Equipment breakdown records \n-   Periodic monitoring data \n-   Service reports \n8.4   Log book\n\n--- PDF PAGE 68 ---\nTR – EIM NC IV                                                                                   - 66 - \n \n \n                                                                                                      \nVARIABLE TRAINING \nCOMPONENTS \nRANGE OF VARIATION \n9. Quality Management System \n9.1   ISO 9001 \n9.2   QS 9000 \n9.3   TS 16949 \n9.4   ISO 14000 \n9.5   ISO14001 \n10. Indicators / Symptoms \nMay include but not limited to: \n10.1   Heating of parts \n10.2   Loose connections \n10.3   Burned or exposed parts \n10.4   Malfunction of logic controls \n10.5   Abnormal/Unusual Noise/Smell/vibration \n10.6   Intermittent operation \n10.7   High current reading \n10.8   Tripping of breakers\n11. Electrical test \nMay include but not limited to: \n11.1   Continuity test \n11.2   Electrical insulation test \n11.3   High potential test (as the need arises) \n11.4   Earth resistance test \n11.5   Phase sequence test \n11.6   Load test \n11.7   Winding resistance test  \n11.8   Free running test \n \n \n \n12. Other works  \nMay include but not limited to:  \n12.1   Mechanical works \n12.2   Computer programs \n12.3   Communication systems \n13. Unforeseen events \nMay include but not limited to: \n13.1   Natural calamities \n13.2   Emergency situations \n13.3   Accidents \n14. Performance Test \nMay include but not limited to: \n14.1   Simulation Test/No Load Test \n14.2   Phase sequence \n14.3   Actual Operation \n14.4   Temperature rise\n\n--- PDF PAGE 69 ---\nTR – EIM NC IV                                                                                   - 67 - \n \n \n                                                                                                      \n \n2.33  (8) Evidence Guide for Assessment"
