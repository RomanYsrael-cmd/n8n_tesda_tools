        "source_title": "(2) ASSIST IN DEVELOPING TEAMS AND INDIVIDUALS",
        "source_text": "--- PDF PAGE 9 ---\nTR – EIM NC IV                                                                                   - 7 - \n \n \n                                                                                                      \n \n UNIT OF COMPETENCY : (2) ASSIST IN DEVELOPING TEAMS AND \nINDIVIDUALS \nUNIT CODE \n:  500311116 \nUNIT DESCRIPTOR \n:  This unit of Basic Worker Competency covers \nthe skills, knowledge and attitudes required to \ndetermine individual and team development \nneeds and facilitate the development of the \nworkgroup. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  terms are elaborated in the \nRange of Variable Training Components\n1. Provide team leadership \n1.1. \nLearning and development needs are \nsystematically identified and implemented in line \nwith organizational requirements \n1.2. \nLearning plan to meet individual and group training \nand developmental needs is collaboratively \ndeveloped and implemented \n1.3. \nIndividuals are encouraged to self evaluate \nperformance and identify areas for improvement \n1.4. \nFeedback on performance of team members is \ncollected from relevant sources and compared \nwith established team learning process \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  terms are elaborated in the \nRange of Variable Training Components\n2. Foster individual and \norganizational growth \n2.1. \nLearning and development program goals and \nobjectives are identified to match the specific \nknowledge and skills requirements of competency \nstandards \n2.2. \nLearning delivery methods are appropriate to \nthe learning goals, the learning style of participants \nand availability of equipment and resources \n2.3. \nWorkplace learning opportunities and coaching/ \nmentoring assistance are provided to facilitate \nindividual and team achievement of competencies \n2.4. \nResources and timelines required for learning \nactivities are identified and approved in \naccordance with organizational requirements \n3. Monitor and evaluate \nworkplace learning \n3.1. \nFeedback from individuals or teams is used to \nidentify and implement improvements in future \nlearning arrangements \n3.2. \nOutcomes and performance of  individuals/teams \nare assessed and recorded to determine the \neffectiveness of development programs and the \nextent of additional support\n\n--- PDF PAGE 10 ---\nTR – EIM NC IV                                                                                   - 8 - \n \n \n                                                                                                      \n \n \n3.3. \nModifications to learning plans are negotiated to \nimprove the efficiency and effectiveness of \nlearning \n3.4. \nRecords and reports of competency are \nmaintained within organizational requirement \n4. Develop team \ncommitment and \ncooperation \n4.1. \nOpen communication processes to obtain and \nshare information is used by team \n4.2. \nDecisions are reached by the team in accordance \nwith its agreed roles and responsibilities \n4.3. \nMutual concern and camaraderie are developed in \nthe team \n \n5. Facilitate accomplishment \nof organizational goals \n5.1. \nTeam members actively participated in team \nactivities and communication processes \n5.2. \nTeams members developed individual and joint \nresponsibility for their actions \n5.3. \nCollaborative efforts are sustained to attain \norganizational goals \n \n \n2.12  (2) Range of Variable Training Components \n \nVARIABLE TRAINING \nCOMPONENTS \nRANGE OF VARIATION \n1.    Learning and  \n      development needs \n \n1.1 \nCoaching, mentoring and/or supervision \n1.2 \nFormal/informal learning program \n1.3 \nInternal/external training provision \n1.4 \nWork experience/exchange/opportunities \n1.5 \nPersonal study \n1.6 \nCareer planning/development \n1.7 \nPerformance appraisals \n1.8 \nWorkplace skills assessment \n1.9 \nRecognition of prior learning\n\n--- PDF PAGE 11 ---\nTR – EIM NC IV   