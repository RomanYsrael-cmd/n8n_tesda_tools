  "source_text": "4.00 NATIONAL ASSESSMENT AND CERTIFICATION\n\n4.10 National Assessment - To attain the National Qualification of Electrical\nInstallation Maintenance NC IV, the candidate must demonstrate\ncompetence in all the units of Basic Worker Competencies, Common\nConstruction Industry Competencies and Core Electrical Competencies\nas listed in Section 1.30, on page 2.\n\n4.20 Certification- The qualification of Electrical Installation and Maintenance\nNC IV may be attained by candidates who have acquired Certificates of\nCompetency (COCs) in all the required units of competency. Successful\ncandidates shall be awarded the National Certificate for Electrical\nInstallation & Maintenance NC IV. If the candidate holds a National\nCertificate in Electrical Installation and Maintenance NC II, he/she will be\nrequired to acquire COCs only for Units of Competency Nos. 6 to 11. If\nthe candidate holds a National Certificate for Electrical Installation &\nMaintenance NC III, he will be required to acquire COC’s only for Units of\nCompetency Nos. 9, 10 and 11 in order to acquire a National Certificate\nfor Electrical Installation & Maintenance NC IV. The guidelines on\nassessment and certification are discussed in more detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines\non the Implementation of the Philippine TVET Qualification and\nCertification System (PTQCS)”.\n\n4.20.1 Accumulation of certificates of competency (COCs) in al the\nfollowing areas\n\n4.20.1.1 Performing roughing-in activities\n• Prepare electrical power and hydraulic tools\n• Perform roughing-in activities for communication and\ndistribution systems\n\n4.20.1.2 Installing wiring\n• Prepare electrical power and hydraulic tools\n• Install wiring devices for floor and GFCI outlets\n\n4.20.1.3 Installing electrical protection systems\n• Prepare electrical power and hydraulic tools\n• Installing electrical protection systems for lighting and\ngrounding\n\n4.20.1.4 Installing lighting systems\n• Prepare electrical power and hydraulic tools\n• Install electrical lighting systems on auxiliary outlets\nand lighting fixtures\n\n--- PDF PAGE 111 ---\nTR – EIM NC IV - 109 -\n\nNote: Those who have unexpired Building-Wiring Installation NC II\nor Electrical Installation and Maintenance NC II qualifications will not\nneed to accumulate the above COCs.\n\n4.20.1.5 Install metering and control systems on electrical\nand auxiliary equipment\n\n4.20.1.6 Assemble and install electrical lighting and motor\ncontrol systems\n\n4.20.1.7 Perform electrical maintenance and troubleshooting\nwork\n\n4.20.1.8 Supervise/Monitor installation and maintenance of\nelectrical systems and auxiliaries including control,\nlighting, power and protection equipment\n\n4.20.1.9 Commission electrical equipment/systems\n\n4.20.1.10 Program and install basic PLC systems\n\nNote: Those who have unexpired Electrical Installation and\nMaintenance NC III qualifications will not need to accumulate the\nabove COCs.\n\n4.20.2\nDemonstration\nof\ncompetence\nthrough\nproject-type\nassessment covering all the required units of the\nqualification\n\n4.21. Assessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.22. The following are qualified to apply for assessment and certification:\n\n(1) Graduates of formal, non-formal and informal including\nenterprise-based training programs\n\n(2) Experienced Workers (wage-employed or self-employed)\n\n--- PDF PAGE 112 ---\nTR – EIM NC IV - 110 -"
