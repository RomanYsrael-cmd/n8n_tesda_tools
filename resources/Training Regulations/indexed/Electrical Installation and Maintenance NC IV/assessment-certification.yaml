      "text": "10 National Assessment - To attain the National Qualification of Electrical Installation Maintenance NC IV, the candidate must demonstrate competence in all the units of Basic Worker Competencies, Common Construction Industry Competencies and Core Electrical Competencies as listed in Section 1.30, on page 2."
