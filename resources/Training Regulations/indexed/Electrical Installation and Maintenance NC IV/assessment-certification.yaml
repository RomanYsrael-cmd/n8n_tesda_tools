    {
      "number": "4.20",
      "text": "Certification- The qualification of Electrical Installation and Maintenance NC IV may be attained by candidates who have acquired Certificates of Competency (COCs) in all the required units of competency. Successful candidates shall be awarded the National Certificate for Electrical Installation & Maintenance NC IV. If the candidate holds a National Certificate in Electrical Installation and Maintenance NC II, he/she will be required to acquire COCs only for Units of Competency Nos. 6 to 11. If the candidate holds a National Certificate for Electrical Installation & Maintenance NC III, he will be required to acquire COC’s only for Units of Competency Nos. 9, 10 and 11 in order to acquire a National Certificate for Electrical Installation & Maintenance NC IV. The guidelines on assessment and certification are discussed in more detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)”."
