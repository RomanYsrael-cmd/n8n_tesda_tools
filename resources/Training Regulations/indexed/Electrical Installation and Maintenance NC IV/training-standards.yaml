    "source_text": "3.00\nTRAINING STANDARDS\n\n3.10 Curriculum Design - These guidelines for Curriculum Design are set\nto provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider\nwhen designing training programs for Electrical Installation and\nMaintenance NC IV. This course is designed to develop knowledge,\nskills and attitudes of a worker qualified for Electrical Installation and\nMaintenance NC IV in accordance with TESDA standards level. It\ncovers (1) Basic Worker Competencies; (2) Common Construction\nIndustry Competencies; and (3) Core Electrical Competencies as\nenumerated in Section 1.30 (Page 2).\n\nNominal Training Duration:\n\nBasic Worker Competencies\n\n -\n 20 Hours\nCommon Construction Industry Competencies - 32Hours\nCore Electrical Competencies\n\n - 464 Hours\nTotal Course Hours\n\n 516 Hours\n\n3.11 Basic Worker Competencies Development - This course is\ndesigned to equip individual with operational skills required for\nBasic Worker Competencies of Electrical Installation &\nMaintenance IV with learning outcomes, methodology and\nassessment approach as listed herein.\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\n workplace\ncommunication\n1.1 Communicate\ninformation about\nworkplace\nprocesses.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and\ncommunicate\nissues arising in\nthe workplace\n1.a. Group discussion\n1.b. Role Play\n1.c. Brain-storming\n\n1.u. Observation\n1.v. Interviews\n2. Lead small\nteams\n2.1 Provide team\nleadership.\n2.2 Assign\nresponsibilities\namong members.\n2.3 Set performance\nexpectation for\nteam members\n2.4 Supervise team\nperformance\n2.a. Lecture\n\n2.b. Demonstration\n\n2.c. Self-paced\n(modular)\n2.u. Demonstration\n\n2.v. Case studies\n\n--- PDF PAGE 99 ---\nTR – EIM NC IV - 97 -\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in\nplanning\nnegotiations\n3.2 Participate in\nnegotiations\n3.3 Document areas\nfor agreement\n3.a. Direct\nobservation\n\n3.b. Simulation/role\nplaying\n\n3.c. Case studies\n3.u. Written test\n3.v. Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem\nrelated to\nwork\nactivities\n4.1 Explain the\nanalytical\ntechniques.\n4.2 Identify the\nproblem.\n4.3 Determine the\npossible cause/s\nof the problem.\n4.a. Direct\nobservation\n\n4.b. Simulation/role\nplaying\n\n4.c. Case studies\n4.u. Written test\n4.v. Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify\nmathematical tools\nand techniques to\nsolve problem\n5.2 Apply\nmathematical\nprocedures/solutio\nn\n5.3\nAnalyze results\n5.a. Direct\nobservation\n5.b. Simulation/role\nplaying\n5.c. Case studies\n5.u. Written test\n5.v. Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify\nappropriate\ntechnology\n6.2 Apply relevant\ntechnology\n6.3 Maintain/enhance\nrelevant\ntechnology\n6.a. Direct\nobservation\n6.b. Simulation/role\nplaying\n6.c. Case studies\n6.u. Written test\n6.v. Practical/\nperformance\ntest\n\n--- PDF PAGE 100 ---\nTR – EIM NC IV - 98 -\n\n3.12 Common Construction Industry Competencies Development - This course is\ndesigned to equip individual with operational skills required for Common\nConstruction Industry Competencies of Electrical Installation & Maintenance\nIV with learning outcomes, methodology and assessment approach as listed\nherein.\n\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify\nMaterials\n1.2 Requisition\nMaterials\n1.3 Receive and\ninspect\nmaterials\n1.a. Audio Visual\n1.b. Simulation\n1.c. Discussion\n1.d. Practical\nExercise\n1.e. Demonstration\n1.u. Direct observation\n1.v. Questions or\ninterview\n1.w. Portfolio\n(credentials)\n1.x. Written / Oral Test\n1.y. Demonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals\nof Instructions\n2.1 Identify and\naccess\nspecification/\nmanuals\n\n2.a. Audio Visual\n2.b. Simulation\n2.c. Discussion\nPractical Lab\n2.d. Demonstration\n2.u. Direct observation\n2.v. Oral questioning\n2.w. Written test or\nexamination\n2.x. Third party report\n2.y. Demonstration\n(able to impart\nknowledge & skills)\n3. Interpret\nTechnical\nDrawing\n3.1 Analyze sign,\nsymbols &\ndata\n3.2 Interpret\ntechnical\ndrawing &\nplans\n3.3 Apply freehand\nsketching\n3.a. Audio Visual\n3.b. Simulation\n3.c. Discussion\nPractical Lab\n3.d. Demonstration\n3.u. Direct observation\n3.v. Oral questioning\n3.w. Written test or\nexamination\n3.x. Third party report\n3.y. Demonstration\n(able to impart\nknowledge and\nskills)\n4. Perform\nmensurations\nand calculation\n4.1 Select\nmeasuring\ninstruments\n4.2 Carry out\nmeasurements\nand\ncalculations\n4.a. Audio Visual\n4.b. Simulation\n4.c. Discussion\nPractical Lab\n4.d. Demonstration\n4.u. Direct observation\n4.v. Oral questioning\n4.w. Written test or\nexamination\n4.x. Third party report\n4.y. Demonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 101 ---\nTR – EIM NC IV - 99 -\n\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment\nApproach\n5. Maintain tools\nand equipment\n5.1 Check\ncondition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge\nand tooth\ncutting tools\n5.4 Store tools\nand equipment\n5.a. Audio Visual\n5.b. Simulation\n5.c. Discussion\nPractical Lab\n5.d. Demonstration\n5.u. Direct observation\nof application of\ntasks.\n5.v. Oral questioning\n5.w. Written test or\nexamination\n5.x. Third party report\n5.y. Demonstration\n\n--- PDF PAGE 102 ---\nTR – EIM NC IV - 100 -\n\n3.13 Core Electrical Competencies Development - This course is designed to\nequip individual with operational skills required for Core Electrical\nCompetencies of Electrical Installation & Maintenance IV with learning\noutcomes, methodology and assessment approach as listed herein.\n\nNote: Units 1 to 5 of the core units are the same as those for Electrical Installation and\nMaintenance NC II. Units 1 to 8 are the same as those for Electrical Installation and\nMaintenance NC III. Hence those who have completed training in one or both of the\nabove qualifications or who are valid holders of one or both of these qualifications need\nnot undergo training in the corresponding competencies.\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare Electric\nand Hydraulic\nTools\n\n1.1. Select and\nidentify of\nelectric power\nand hydraulic\ntools.\n1.2. Maintain\nelectrical power\nand hydraulic\ntools.\n1.a. Demonstration\n\n1.b. Modular (self-\npaced)\n1.c. Lecture\n1.d. Audio Visual\n1.e. Practical\nLaboratory\n1.u. Direct\nobservation\n1.v. Oral\nquestioning\n1.w.\nWritten Test\n1.x. Demonstration\n2. Perform\nroughing-in\nactivities for bus\nducts and\nunderfloor ducts.\n2.1 Install bus way\nor bus duct and\nfittings.\n\n2.2 Install under\nfloor duct and\nfittings.\n3.y. Demonstration\n3.z. Modular (self-\npaced)\n3.aa. Lecture\n3.bb. Audio Visual\n3.cc. Practical\nLaboratory\n2.u. Direct\nobservation\n2.v. Oral\nquestioning\n2.w. Written Test\n2.x. Demonstration\n3. Perform\ninstallation of\nwiring devices for\nfloor and ground\nfault current\ninterrupting\noutlets\n\n3.1 Select the wiring\ndevices used for\nfloor and ground\nfault current\ninterrupter.\n3.2 Install the wiring\ndevices for floor\nand ground fault\ncurrent\ninterrupter\nbased on\nstandard\n3.3 Notify the\ncompletion of\nwork in\naccordance with\nthe requirement.\n3.a. Demonstration\n\n3.b. Modular (self-\npaced)\n\n3.c. Lecture\n\n3.d. Audio Visual\n\n3.e. Practical\nLaboratory\n\n3.u. Direct\nobservation\n3.v. Oral\nquestioning\n3.w. Written Test\n3.x. Demonstration\n\n--- PDF PAGE 103 ---\nTR – EIM NC IV - 101 -\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n4. Perform\ninstallation of\nelectrical\nprotection system\nfor lightning and\ngrounding.\n\n4.1 Plan and prepare\nwork.\n4.2 Install electrical\nprotection\nsystem.\n4.3 Notify completion\nof work.\n\n4.a. Demonstration\n4.b. Modular (self-\npaced)\n4.c. Lecture\n4.d. Audio Visual\n4.e. Practical\nLaboratory\n4.u. Direct\nObservation\n4.v. Written or Oral\ndemonstration\n4.w. Oral\nquestioning\n4.x. Written Test\n4.y. Demonstration\n\n5. Perform\ninstallation of\nelectrical lighting\nsystems, auxiliary\noutlets and\nlighting fixtures.\n\n5.1 Plan and prepare\nwork.\n\n5.2 Install lighting\nfixtures.\n\n5.3 Notify the\ncompletion or\nwork in\naccordance with\nthe requirement.\n\n5.a. Demonstration\n\n5.b. Modular (self-\npaced)\n\n5.c. Lecture\n\n5.d. Audio Visual\n\n5.e. Practical\nLaboratory\n5.u. Direct\nObservation\n5.v. Written or Oral\nDemonstration\n5.w. Oral\nquestioning\n5.x. Written Test\n5.y. Demonstration\n\n6. Perform\ninstallation of\ndata\nmeasurement\nand control\nsystems on\nelectrical and\nauxiliary\nequipment.\n\n1.1 Plan and\nprepare work.\n\n1.2 Request\nmaterials, tools\nand equipment\nneeded.\n\n1.3 Install electrical,\nauxiliary and\nprotection\nsystem of an\nequipment.\n\n1.4 Install electrical\nwiring.\n\n1.5 Notify\ncompletion of\nwork.\n\n6.a. Demonstration\n\n6.b. Modular (self-\npaced)\n\n6.c. Lecture\n\n6.d. Audio Visual\n\n6.e. Practical\nLaboratory\n\n6.u. Direct\nobservation\n\n6.v. Oral\nquestioning\n\n6.w. Written Test\n\n6.x. Demonstration\n\n--- PDF PAGE 104 ---\nTR – EIM NC IV - 102 -\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n7. Assemble and\ninstall electrical\nlighting and\nmotor control\nsystems.\n\n7.1 Check/Review\ntype and\npurpose of\nelectrical control\nsystem.\n7.2 Request the\nneeds of\nmaterials, tools\nand equipment.\n7.3 Inspect\nelectrical\nmaterials and\ntools.\n7.4 Assemble\nelectrical control\nsystem.\n7.5 Notify\ncompletion of\nwork.\n7.a. Demonstration\n\n7.b. Modular (self-\npaced)\n\n7.c. Lecture\n\n7.d. Audio Visual\n\n7.e. Practical\nLaboratory\n\n7.u. Direct\nobservation\n\n7.v. Oral\nquestioning\n\n7.w. Written Test\n\n7.x. Demonstration\n\n8. Perform\nmaintenance and\ntroubleshooting\nworks.\n\n8.1 Plan, prepare\nand coordinate\nmaintenance\nworks.\n8.2 Maintain\nelectrical\nsystem or\nequipment\n8.3 Troubleshoot\nfaults in an\nelectrical\nsystem or\nequipment\n8.4 Notify completion\nof work.\n8.a. Demonstration\n\n8.b. Modular (self-\npaced)\n\n8.c. Lecture\n\n8.d. Audio Visual\n\n8.e. Practical\nLaboratory\n\n8.u. Direct\nobservation\n\n8.v. Oral\nquestioning\n\n8.w. Written Test\n\n8.x. Demonstration\n\n--- PDF PAGE 105 ---\nTR – EIM NC IV - 103 -\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n9. Supervise\n/monitor\ninstallation and\nmaintenance on\nelectrical\nsystems,\nincluding\nauxiliary,\ncontrol, lighting,\npower and\nprotection\nequipment.\n\n9.1 Conduct Planning\nand preparation\nof work.\n9.2 Evaluate request\nmaterials, tools\nand equipment\nneeded.\n9.3 Supervise the\ninstallation of\nelectrical, auxiliary\nand protection\nsystem of\nequipment\nprepared.\n9.4 Supervise the\ninstallation of\nelectrical wiring.\n9.5 Notify completion\nof work\n\n9.a. Demonstration\n\n9.b. Modular (self-\npaced)\n\n9.c. Lecture\n\n9.d. Audio Visual\n\n9.e. Practical\nLaboratory\n\n9.u. Direct\nobservation\n\n9.v. Written and\noral\ndemonstration\n\n9.w. Written Test\n\n9.x. Demonstration\n10 .Perform\ncommissioning of\nelectrical\nequipment/syste\nms below 600\nVolts.\n\n10.1 Plan and\nprepare\ncommissioning\nactivities.\n10.2 Conduct\ncommissioning\non electrical\nequipment/\nsystem.\n10.3 Turn over\nelectrical\nequipment/\nsystems below\n600 volts.\n10.a. Demonstration\n\n10.b. Modular (self-\npaced)\n\n10.c. Lecture\n\n10.d. Audio Visual\n\n10.e. Practical\nLaboratory\n\n10.u. Direct\nObservation\n\n10.v. Written or\noral\ndemonstration\n\n10.w. Written Test\n\n10.x. Demonstration\n\n--- PDF PAGE 106 ---\nTR – EIM NC IV - 104 -\n\n11. Perform\nprogramming\nand installation\nof basic\nProgrammable\nLogic Controller\n(PLC) system.\n\n11.1 Plan and\nprepare for\ninstallation.\n11.2 Identify\nmaterials,\ncomponents\ntools and testing\ninstrument.\n11.3 Install/Test field\nand control\ndevices.\n11. 4 Create/Modify,\ninstall and test\nbasic PLC\nprogram.\n11.a. Demonstration\n\n11.b. Modular (self-\npaced)\n\n11.c. Lecture\n\n11.d. Audio Visual\n\n11.e. Practical\nLaboratory\n\n11.u. Direct\nObservation\n\n11.v. Written or oral\ndemonstration\n\n11.w. Written Test\n\n11.x. Demonstration\n\n3.20 Training Delivery - The delivery of training should adhere to the\ndesign of the curriculum.\n\n3.21 Basic Principles of Competency – Based TVET- Delivery shall\nbe guided by the 10 basic principles of competency-based\nTVET:\n\n(1) The training is based on curriculum developed from the\ncompetency standards;\n(2) Learning is modular in its structure;\n(3) Training\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate individualized and self-paced learning\nstrategies;\n(4) Training is based on work that must be performed;\n(5) Training materials are directly related to the competency\nstandards and the curriculum modules;\n(6) Assessment is based on the collection of evidence of the\nperformance of work to the industry required standard;\n(7) Training is based both on and off-the-job components;\n(8) Training program allows for recognition of prior learning\n(RPL) or current competencies;\n(9) Training allows for multiple entry and exit; and\n(10) Training programs are registered with the UTPRAS.\n\n3.22 Training Modalities Programs -The competency-based TVET\nsystem recognizes various types of delivery modes, both on\nand off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following\ntraining modalities may be adopted when designing training\nprograms:\n\n--- PDF PAGE 107 ---\nTR – EIM NC IV - 105 -\n\n(1) The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school\nand in-industry training or fieldwork components. Details can\nbe referred to he Dual Training system (DTS) Implementing\nRules and Regulations.\n\n(2) Modular/self-paced is a competency-based training modality\nwherein the trainee is allowed to progress at his/her own\npace. The trainer only facilitates the training delivery.\n\n(3) Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\n\n(4) Supervised Industry Training or On-the-Job Training is an\napproach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the\ntraining regulations.\n\n(5) Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer\ntechnologies.\n\n(6) Project-based instruction is an authentic instructional model\nor strategy in which students plan, implement and evaluate\nprojects that have real world applications.\n\n3.30 Trainee Entry Requirements - To qualify as trainee for Electrical\nInstallation & Maintenance NC IV, a candidate must be:\n\n(1)\na holder of Electrical Installation & Maintenance NC III or\nequivalent experience and training.\n(2)\ncan communicate both oral and in written\n(3)\nphysically and mentally fit\n(4)\nwith good moral character\n(5)\ncan perform basic mathematical computation\n\nThis list does not include specific institutional requirements\nsuch as educational attainment, appropriate work experience, and\nothers that may be required of the trainees by the school or training\ncenter delivering the TVET program.\n\n--- PDF PAGE 108 ---\nTR – EIM NC IV - 106 -\n\n3.40 Tools, Equipment and Materials