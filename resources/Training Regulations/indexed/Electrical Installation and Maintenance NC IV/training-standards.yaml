\nspecification/\nmanuals\n\n2.a. Audio Visual\n2.b. Simulation\n2.c. Discussion\nPractical Lab\n2.d. Demonstration\n2.u. Direct observation\n2.v. Oral questioning\n2.w. Written test or\nexamination\n2.x. Third party report\n2.y. Demonstration\n(able to impart\nknowledge & skills)\n3. Interpret\nTechnical\nDrawing\n3.1 Analyze sign,\nsymbols &\ndata\n3.2 Interpret\ntechnical\ndrawing &\nplans\n3.3 Apply freehand\nsketching\n3.a. Audio Visual\n3.b. Simulation\n3.c. Discussion\nPractical Lab\n3.d. Demonstration\n3.u. Direct observation\n3.v. Oral questioning\n3.w. Written test or\nexamination\n3.x. Third party report\n3.y. Demonstration\n(able to impart\nknowledge and\nskills)\n4. Perform\nmensurations\nand calculation\n4.1 Select\nmeasuring\ninstruments\n4.2 Carry out\nmeasurements\nand\ncalculations\n4.a. Audio Visual\n4.b. Simulation\n4.c. Discussion\nPractical Lab\n4.d. Demonstration\n4.u. Direct observation\n4.v. Oral questioning\n4.w. Written test or\nexamination\n4.x. Third party report\n4.y. Demonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 101 ---\nTR – EIM NC IV - 99 -\n\nUnit of\nCompetency\nLearning\nOutcomes\nMethodology\nAssessment\nApproach\n5. Maintain tools\nand equipment\n5.1 Check\ncondition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge\nand tooth\ncutting tools\n5.4 Store tools\nand equipment\n5.a. Audio Visual\n5.b. Simulation\n5.c. Discussion\nPractical Lab\n5.d. Demonstration\n5.u. Direct observation\nof application of\ntasks.\n5.v. Oral questioning\n5.w. Written test or\nexamination\n5.x. Third party report\n5.y. Demonstration\n\n--- PDF PAGE 102 ---\nTR – EIM NC IV - 100 -\n\n3.13 Core Electrical Competencies Development - This course is designed to\nequip individual with operational skills required for Core Electrical\nCompetencies of Electrical Installation & Maintenance IV with learning\noutcomes, methodology and assessment approach as listed herein.\n\nNote: Units 1 to 5 of the core units are the same as those for Electrical Installation and\nMaintenance NC II. Units 1 to 8 are the same as those for Electrical Installation and\nMaintenance NC III. Hence those who have completed training in one or both of the\nabove qualifications or who are valid holders of one or both of these qualifications need\nnot undergo training in the corresponding competencies.\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare Electric\nand Hydraulic\nTools\n\n1.1. Select and\nidentify of\nelectric power\nand hydraulic\ntools.\n1.2. Maintain\nelectrical power\nand hydraulic\ntools.\n1.a. Demonstration\n\n1.b. Modular (self-\npaced)\n1.c. Lecture\n1.d. Audio Visual\n1.e. Practical\nLaboratory\n1.u. Direct\nobservation\n1.v. Oral\nquestioning\n1.w.\nWritten Test\n1.x. Demonstration\n2. Perform\nroughing-in\nactivities for bus\nducts and\nunderfloor ducts.\n2.1 Install bus way\nor bus duct and\nfittings.\n\n2.2 Install under\nfloor duct and\nfittings.\n3.y. Demonstration\n3.z. Modular (self-\npaced)\n3.aa. Lecture\n3.bb. Audio Visual\n3.cc. Practical\nLaboratory\n2.u. Direct\nobservation\n2.v. Oral\nquestioning\n2.w. Written Test\n2.x. Demonstration\n3. Perform\ninstallation of\nwiring devices for\nfloor and ground\nfault current\ninterrupting\noutlets\n\n3.1 Select the wiring\ndevices used for\nfloor and ground\nfault current\ninterrupter.\n3.2 Install the wiring\ndevices for floor\nand ground fault\ncurrent\ninterrupter\nbased on\nstandard\n3.3 Notify the\ncompletion of\nwork in\naccordance with\nthe requirement.\n3.a. Demonstration\n\n3.b. Modular (self-\npaced)\n\n3.c. Lecture\n\n3.d. Audio Visual\n\n3.e. Practical\nLaboratory\n\n3.u. Direct\nobservation\n3.v. Oral\nquestioning\n3.w. Written Test\n3.x. Demonstration\n\n--- PDF PAGE 103 ---\nTR – EIM NC IV - 101 -\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n4. Perform\ninstallation of\nelectrical\nprotection system\nfor lightning and\ngrounding.\n\n4.1 Plan and prepare\nwork.\n4.2 Install electrical\nprotection\nsystem.\n4.3 Notify completion\nof work.\n\n4.a. Demonstration\n4.b. Modular (self-\npaced)\n4.c. Lecture\n4.d. Audio Visual\n4.e. Practical\nLaboratory\n4.u. Direct\nObservation\n4.v. Written or Oral\ndemonstration\n4.w. Oral\nquestioning\n4.x. Written Test\n4.y. Demonstration\n\n5. Perform\ninstallation of\nelectrical lighting\nsystems, auxiliary\noutlets and\nlighting fixtures.\n\n5.1 Plan and prepare\nwork.\n\n5.2 Install lighting\nfixtures.\n\n5.3 Notify the\ncompletion or\nwork in\naccordance with\nthe requirement.\n\n5.a. Demonstration\n\n5.b. Modular (self-\npaced)\n\n5.c. Lecture\n\n5.d. Audio Visual\n\n5.e. Practical\nLaboratory\n5.u. Direct\nObservation\n5.v. Written or Oral\nDemonstration\n5.w. Oral\nquestioning\n5.x. Written Test\n5.y. Demonstration\n\n6. Perform\ninstallation of\ndata\nmeasurement\nand control\nsystems on\nelectrical and\nauxiliary\nequipment.\n\n1.1 Plan and\nprepare work.\n\n1.2 Request\nmaterials, tools\nand equipment\nneeded.\n\n1.3 Install electrical,\nauxiliary and\nprotection\nsystem of an\nequipment.\n\n1.4 Install electrical\nwiring.\n\n1.5 Notify\ncompletion of\nwork.\n\n6.a. Demonstration\n\n6.b. Modular (self-\npaced)\n\n6.c. Lecture\n\n6.d. Audio Visual\n\n6.e. Practical\nLaboratory\n\n6.u. Direct\nobservation\n\n6.v. Oral\nquestioning\n\n6.w. Written Test\n\n6.x. Demonstration\n\n--- PDF PAGE 104 ---\nTR – EIM NC IV - 102 -\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n7. Assemble and\ninstall electrical\nlighting and\nmotor control\nsystems.\n\n7.1 Check/Review\ntype and\npurpose of\nelectrical control\nsystem.\n7.2 Request the\nneeds of\nmaterials, tools\nand equipment.\n7.3 Inspect\nelectrical\nmaterials and\ntools.\n7.4 Assemble\nelectrical control\nsystem.\n7.5 Notify\ncompletion of\nwork.\n7.a. Demonstration\n\n7.b. Modular (self-\npaced)\n\n7.c. Lecture\n\n7.d. Audio Visual\n\n7.e. Practical\nLaboratory\n\n7.u. Direct\nobservation\n\n7.v. Oral\nquestioning\n\n7.w. Written Test\n\n7.x. Demonstration\n\n8. Perform\nmaintenance and\ntroubleshooting\nworks.\n\n8.1 Plan, prepare\nand coordinate\nmaintenance\nworks.\n8.2 Maintain\nelectrical\nsystem or\nequipment\n8.3 Troubleshoot\nfaults in an\nelectrical\nsystem or\nequipment\n8.4 Notify completion\nof work.\n8.a. Demonstration\n\n8.b. Modular (self-\npaced)\n\n8.c. Lecture\n\n8.d. Audio Visual\n\n8.e. Practical\nLaboratory\n\n8.u. Direct\nobservation\n\n8.v. Oral\nquestioning\n\n8.w. Written Test\n\n8.x. Demonstration\n\n--- PDF PAGE 105 ---\nTR – EIM NC IV - 103 -\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n9. Supervise\n/monitor\ninstallation and\nmaintenance on\nelectrical\nsystems,\nincluding\nauxiliary,\ncontrol, lighting,\npower and\nprotection\nequipment.\n\n9.1 Conduct Planning\nand preparation\nof work.\n9.2 Evaluate request\nmaterials, tools\nand equipment\nneeded.\n9.3 Supervise the\ninstallation of\nelectrical, auxiliary\nand protection\nsystem of\nequipment\nprepared.\n9.4 Supervise the\ninstallation of\nelectrical wiring.\n9.5 Notify completion\nof work\n\n9.a. Demonstration\n\n9.b. Modular (self-\npaced)\n\n9.c. Lecture\n\n9.d. Audio Visual\n\n9.e. Practical\nLaboratory\n\n9.u. Direct\nobservation\n\n9.v. Written and\noral\ndemonstration\n\n9.w. Written Test\n\n9.x. Demonstration\n10 .Perform\ncommissioning of\nelectrical\nequipment/syste\nms below 600\nVolts.\n\n10.1 Plan and\nprepare\ncommissioning\nactivities.\n10.2 Conduct\ncommissioning\non electrical\nequipment/\nsystem.\n10.3 Turn over\nelectrical\nequipment/\nsystems below\n600 volts.\n10.a. Demonstration\n\n10.b. Modular (self-\npaced)\n\n10.c. Lecture\n\n10.d. Audio Visual\n\n10.e. Practical\nLaboratory\n\n10.u. Direct\nObservation\n\n10.v. Written or\noral\ndemonstration\n\n10.w. Written Test\n\n10.x. Demonstration\n\n--- PDF PAGE 106 ---\nTR – EIM NC IV - 104 -\n\n11. Perform\nprogramming\nand installation\nof basic\nProgrammable\nLogic Controller\n(PLC) system.\n\n11.1 Plan and\nprepare for\ninstallation.\n11.2 Identify\nmaterials,\ncomponents\ntools and testing\ninstrument.\n11.3 Install/Test field\nand control\ndevices.\n11. 4 Create/Modify,\ninstall and test\nbasic PLC\nprogram.\n11.a. Demonstration\n\n11.b. Modular (self-\npaced)\n\n11.c. Lecture\n\n11.d. Audio Visual\n\n11.e. Practical\nLaboratory\n\n11.u. Direct\nObservation\n\n11.v. Written or oral\ndemonstration\n\n11.w. Written Test\n\n11.x. Demonstration",
