n(2) Must have undergone training on Training Methodology I (TM I)\n(3) He must be a holder of at least Electrical Installation & Maintenance\nNC IV\n(4) Good moral character\n(5) Must be computer literate\n(6) Must be physically and mentally fit\n(7) Minimum of three (3) years relevant job/industry experience *\n\n*Optional. Only when required by the hiring institution\nReference: TESDA Board Resolution No. 2004-03\n\nSpace Requirement\nSize in Meters\nArea in\nSq.\nMeters\nTotal Area in\n Sq. Meters\n\n1. Student/Trainee Working Space\n2.50 x 2.50 per\nstudent/trainee\n6.25 per\nstudent\n156.25\n2. Contextual Learning Laboratory/\nLecture Room\n\n4 x 5\n\n20\n\n20\n3. Learning Resource Center\n4 x 5\n20\n20\n4. Facilities/Equipment/ Circulation\narea\n10 x 6\n60\n60\nTOTAL AREA\n\n256.25\n\n--- PDF PAGE 110 ---\nTR – EIM NC IV - 108 -"
