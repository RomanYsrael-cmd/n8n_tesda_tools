      "term": "Refers to removal of air in fuel line from tank to filter",
      "definition": "3) Catalytic converter refers to the process of either oxidation (diesel), deoxidation (petrol), or three-way catalytic (petrol). 4) Defective Refers to problems to software and programs such as corruption. 5) Diagnose identify the nature of problem by inspection of the symptoms. 6) Diagnostic symptoms a physical manifestation that is regarded as indicating a condition of malfunction. 7) Evaluation of components the making of a judgment about the condition of a part/component. 8) Final inspection Includes road testing, oil leakage, functionality, etc. 9) Maintenance the regular or periodic maintenance servicing of vehicles to keep it in top condition. 10) Out of standard worn-out, unserviceable components, not conforming to manufacturer’s standard. 11) Overhaul take apart a major automobile component in order to examine it and repair/replace a part if necessary to bring back the major component to working conditions. 12) Petrol also known as gasoline. 13) Repair to apply any remedy to solve the problem.(tightening, cleaning, replacing, removal, installation, checking) 14) Service the act of rendering maintenance service and repair/replacement of parts of an automobile to keep it in top condition."
