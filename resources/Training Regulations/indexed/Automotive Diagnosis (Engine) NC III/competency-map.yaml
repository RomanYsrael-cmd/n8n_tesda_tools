  "source_text": "Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.1.2 Assessment shall cover all competencies with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.1.3 The following are qualified to apply for assessment and certification, as\nlong as they are holders of National Certificate in the amended\nAutomotive Servicing (Engine Repair) NC II:\n\n4.1.3.1 Graduates\nof\nWTR-registered\nprogram\non\nAutomotive\nDiagnosis (Engine) NC III, or graduates of NTR programs or\nformal/non-formal/informal including enterprise-based training\nprograms related to automotive servicing (engine repair); or\n\n4.1.3.2 Candidates who gained competencies in implementing\nautomotive engine diagnosis on vehicles through informal\ntraining or previous work experiences. For informal training, a\ncertification from any government agency or LGU or Barangay\nindicating the competencies of an individual. For work\nexperience, a certificate of Employment and Job Description\nmust be provided as proof.\n\n4.1.4 Current holders of National Certificate (NC) and Certificate of\nCompetency (COC) in AUTOMOTIVE SERVICING NC III shall have to\nundergo reassessment in the amended Training Regulations upon\nexpiration of their Certificates. Candidates must be a holder of a\nNational Certificate in the amended Automotive Servicing (Engine\nRepair) NC II.\n\n4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life\nexperiences may apply for recognition in a particular qualification\n\n--- PDF PAGE 166 ---\nAutomotive Diagnosis (Engine) NC III - ALTADN324 Promulgated (11/13/2024) 162\nthrough competency based on the current TESDA circular and/or\nimplementing guidelines on portfolio assessment and RPL.\n\n4.1.6 The industry shall determine assessment and certification requirements\nfor each qualification with promulgated Training Regulations. It includes\nthe following:\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\nd. specific assessment and certification arrangements as by industry.\n\n4.2\nCompetency Assessment Requisite\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before\nthey are authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to assess\nthe competencies of candidates for National Certification.\n\n--- PDF PAGE 167 ---\nAutomotive Diagnosis (Engine) NC III - ALTADN324 Promulgated (11/13/2024) 163\nCOMPETENCY MAP\nAUTOMOTIVE DIAGNOSIS (ENGINE) NC III\n\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nParticipate in workplace\ncommunication\nLead workplace communication\nUtilize specialized\ncommunication skill\nManage and sustain effective\ncommunication strategies\nWork with others\nWork in a team environment\nLead small teams\nDevelop and lead teams\nManage and sustain high\nperforming teams\nSolve/address routine problems\nSolve/address general\nworkplace problems\nApply critical thinking and\nproblem-solving techniques in\nthe workplace\nPerform higher-order thinking\nprocesses and apply\ntechniques in the workplace\nEvaluate higher order thinking\nskills and adjust problem\nsolving techniques\nEnhance self-management\nskills\nDevelop career and life\ndecisions\nWork in a diverse environment\nContribute to the practice of\nsocial justice in the workplace\nAdvocate strategic thinking for\nglobal citizenship\nSupport innovation\nContribute to workplace\ninnovation\nPropose methods of applying\nlearning and innovation in the\norganization\nManage innovative work\ninstructions\nIncorporate innovation into work\nprocedures\nAccess and maintain\ninformation\nPresent relevant information\nUse information systematically\nManage and evaluate usage of\ninformation\nDevelop systems in managing,\nand maintaining information\nFollow occupational safety and\nhealth policies and procedures\nPractice occupational safety\nand health policies and\nprocedures\nEvaluate occupational safety\nand health work practices\nLead in improvement of\noccupational safety and health\nprogram, policies and\nprocedures\nManage implementation of\nOSH programs in the workplace\nApply environmental work\nstandards\nExercise efficient and effective\nsustainable practices in the\nworkplace\nEvaluate environmental work\npractices\nLead towards improvement of\nenvironmental work programs,\npolicies and procedures\nManage implementation of\nenvironmental programs in the\nworkplace\nAdopt entrepreneurial mindset\nin the workplace\nPractice entrepreneurial skills in\nthe workplace\n\nFacilitate entrepreneurial skills\nfor micro-small-medium\nenterprises (MSMEs)\nSustain entrepreneurial skills\nDevelop and sustain a high-\nperforming enterprise\n\nCOMMON COMPETENCIES\n\nValidate vehicle specification\nMove and position vehicle\nUtilize automotive tools\nPerform mensuration and\ncalculation\nUtilize workshop facilities and\nequipment\nPrepare servicing parts and\nconsumables\nPrepare vehicle for servicing\nand releasing\n\nCORE COMPETENCIES\n\nDiagnose and repair petrol\nelectronic fuel injection system\nDiagnose and repair emission\ncontrol system\nDiagnose and repair diesel\nelectronic fuel injection system\nDiagnose and repair forced-\ninduction system\nDiagnose and repair electronic\nspark advance system\n\n--- PDF PAGE 168 ---\nAutomotive Diagnosis (Engine) NC III - ALTADN324 Promulgated (11/13/2024) 164\n\nGLOSSARY OF TERMS\n\n1) Adjustment\na small alteration or movement made to achieve a\ndesired fit, appearance, or result.\n\n2) Bleeding\nRefers to removal of air in fuel line from tank to filter.\n\n3) Catalytic converter\nrefers to the process of either oxidation (diesel),\ndeoxidation (petrol), or three-way catalytic (petrol).\n4) Defective\nRefers to problems to software and programs such as\ncorruption.\n5) Diagnose\nidentify the nature of problem by inspection of the\nsymptoms.\n\n6) Diagnostic\nsymptoms\na physical manifestation that is regarded as indicating a\ncondition of malfunction.\n\n7) Evaluation of\ncomponents\nthe making of a judgment about the condition of a\npart/component.\n\n8) Final inspection\nIncludes road testing, oil leakage, functionality, etc.\n\n9) Maintenance\nthe regular or periodic maintenance servicing of vehicles\nto keep it in top condition.\n\n10) Out of standard\nworn-out, unserviceable components, not conforming to\nmanufacturer’s standard.\n\n11) Overhaul\ntake apart a major automobile component in order to\nexamine it and repair/replace a part if necessary to bring\nback the major component to working conditions.\n\n12) Petrol\nalso known as gasoline.\n13) Repair\nto apply any remedy to solve the problem.(tightening,\ncleaning, replacing, removal, installation, checking)\n\n14) Service\nthe act of rendering maintenance service and\nrepair/replacement of parts of an automobile to keep it in\ntop condition.\n\n--- PDF PAGE 169 ---\nAutomotive Diagnosis (Engine) NC III - ALTADN324 Promulgated (11/13/2024) 165\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nAUTOMOTIVE DIAGNOSIS (ENGINE) NC III\n\nQualification Code:\nALTADN324\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment Circular\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument\nCreated\nAutomotive Servicing NC III\nNo. 2013-11\nDecember 17,\n2013\nN/A\n01\nDocument\nSuperseded\nAutomotive Diagnosis\n(Chassis) NC III\nAutomotive Diagnosis\n(Electrical) NC III\nAutomotive Diagnosis\n(Engine) NC III\nNo. 2024-12\nNovember 13,\n2024\nNo. 042 s. 2026\nNo. 043 s. 2026\nNo. 044 s. 2026\nLegend: *Description Types\n- Document Created\n- Document Amended\n- Document Superseded\n\n--- PDF PAGE 170 ---\nAutomotive Diagnosis (Engine) NC III - ALTADN324 Promulgated (11/13/2024) 166\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) is\nparticularly grateful for the valuable technical support provided by the following\nindustry stakeholders for the review and development of this Training Regulations.\nThe time and inputs generously given during this undertaking are also highly\nappreciated and recognized as they made significant contributions to the constitution\nof this TR.\n\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nMR. ROMMEL O. CABANELA\nTechnical Expert\nSuzuki Philippines Inc. (SPH)\nSub Com Chair for Training & Education\nChamber of Automotive Manufactures of\nthe Phils. Inc. (CAMPI)\n\nMR. GIDEON C. BRUNO\nMitsubishi Motors Philippines Corp.\nMember- Aftersales Committee\nChamber of Automotive Manufactures\nof the Phils. Inc. (CAMPI)\n\nMR. ELMER DEL ROSARIO\nToyota Motor Philippines Corp.\nMember- Aftersales Committee\nChamber of Automotive Manufactures of\nthe Phils. Inc. (CAMPI)\n\nMR. GERA