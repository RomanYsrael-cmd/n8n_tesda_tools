nt is gathering of evidence to determine the\nachievements of the requirements of the qualification to enable the trainer to make\njudgment whether the trainee is competent or not yet competent.\n\n--- PDF PAGE 165 ---\nAutomotive Diagnosis (Engine) NC III - ALTADN324 Promulgated (11/13/2024) 161"
