stioning\n● Group\ndiscussions and\ninteractive\nactivities\n● Case studies/\nproblems\n1 hour\n\n--- PDF PAGE 123 ---\nAutomotive Diagnosis (Engine) NC III - ALTADN324 Promulgated (11/13/2024) 119\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4.1.3 Demonstrate different methods\nof verbal and non-verbal\ncommunication in a\nmulticultural setting\n4.1.4 Apply cross-cultural\ncommunication skills (i.e.\ndifferent business customs,\nbeliefs, communication\nstrategies)\n4.1.5 Show affective skills –\nestablishing rapport and\nempathy, understanding, etc.\n4.1.6 Demonstrate openness and\nflexibility in communication\n4.1.7 Recognize diverse groups in\nthe workplace and community\nas defined by divergent\nculture, religion, traditions and\npractices\ninvolving\nworkplace\ndiversity issues\n● Written\nexamination\n● Role Playing\n\n4.2 Work\neffectively in an\nenvironment\nthat\nacknowledges\nand values\ncultural\ndiversity\n4.2.1 Explain the value of diversity in\nthe economy and society in\nterms of 4.2.2 Workforce\ndevelopment\n4.2.3 Discuss the importance of\ninclusiveness in a diverse\nenvironment\n4.2.4 Discuss the importance of\nshared vision and\nunderstanding of and\ncommitment to team,\ndepartmental, and\norganizational goals and\nobjectives\n● Small Group\nDiscussion\n● Interactive\nLecture\n● Brainstorming\n● Demonstration\n● Role-playing\n● Demonstration or\nsimulation with\noral questioning\n● Group\ndiscussions and\ninteractive\nactivities\n● Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n● Written\nexamination\n1 hour\n\n--- PDF PAGE 124 ---\nAutomotive Diagnosis (Engine) NC III - ALTADN324 Promulgated (11/13/2024) 120\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4.2.5 Identify and exhibit strategies\nfor customer service excellence\n4.2.6 Demonstrate cross-cultural\ncommunication skills and active