    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title:\nAUTOMOTIVE DIAGNOSIS\n(ENGINE)\nNC Level\nNC III\n\nNominal Training Duration:\n\n40 Hours (Basic Competencies)\n\n162 Hours (Common Competencies)\n\n300 Hours (Core Competencies)\n\n502 TOTAL HOURS\n\n150 SIL\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive servicing in accordance with industry standards. It\ncovers core competencies in diagnosing and repairing: petrol electronic fuel injection\nsystem, emission control system, diesel electronic fuel injection system, forced-\ninduction system, and electronic spark advance system.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove- mentioned competencies to be employed.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 117 ---\nAutomotive Diagnosis (Engine) NC III - ALTADN324 Promulgated (11/13/2024) 113\n\nBASIC COMPETENCIES\n40 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1.1 Read\n● Lecture\n● Written Test\n2 Hours\no Effective verbal communication\nmethods\n\no Sources of information\n\n1.1.2 Practice organizing information\n● Demonstration\n● Observation\n\n1.1.3 Identify organization\nrequirements for written and\nelectronic communication methods\n● Lecture\n● Written Test\n\n1.1.4 Follow organization\nrequirements for the use of written\nand electronic communication\nmethods\n● Demonstration\n● Practical\nexercises\n● Observation\n\n1.1.5 Perform exercises on\nunderstanding and conveying\nintended meaning scenario\n● Demonstration\n● Role Play\n● Observation\n\n1.2 Lead\nworkplace\ndiscussions\n1.2.1 Describe:\n● Organizational policy on\nproduction, quality and safety\n● Group discussion\n● Oral evaluation\n2 Hours\n\n● Goals/ objectives and action\nplan setting\n\n1.2.2 Read\n● Lecture\n● Written Test\n\n● Effective verbal communication\nmethods\n\n1.2.3 Prepare/set action plans based\non organizational goals and\nobjectives\n● Demonstration\n● Observation\n\n--- PDF PAGE 118 ---\nAutomotive Diagnosis (Engine) NC III - ALTADN324 Promulgated (11/13/2024) 114\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n1.3 Identify and\ncommunicate\nissues arising\nin the\nworkplace\n1.2.4 Describe:\n● Organizational policy in dealing\nwith issues and problems\n● Group discussion\n● Oral evaluation\n2 Hours\n\n1.2.5 Read\n● Lecture\n● Written Test\n\n● Effective verbal communication\nmethods\n\n2. Lead small teams\n2.1 Provide team\nleadership\n\n2.1.1 Discussion of Company\npolicies and procedures\n2.1.2 Read web pages on situational\nleadership\n2.1.3Role play on situational\nleadership\n● Group work\n● Role Play\n● Lecture/\nDiscussion\n● Individual Work\n● Role Play\n● Written Test\n1 hour\n\n2.2 Assign\nresponsibilities\n2.2.1 Read web pages on\nperformance management\n2.2.2 Case study on allocating roles\nand responsibilities based on\ncompetencies of current staff\n\n● Individual Work\n● Case Study\n● Role Play\n● Written Test\n1 hour\n\n2.3 Set\nperformance\nexpectations\nfor team\nmembers\n2.3.1 Role play to communicate\nperformance expectations with\nstaff\n2.3.2 Discussion on performance\nis