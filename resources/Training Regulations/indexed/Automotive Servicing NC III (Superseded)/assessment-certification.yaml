  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of Automotive Servicing NC III, the candidate\nmust demonstrate competence through project-type assessment covering all the\nunits listed in Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n4.2 Individual aspiring to be awarded the qualification of Automotive Servicing NC III\nmust acquire Certificates of Competency in all the following core units of the\nQualification. Candidates may apply for assessment in any accredited\nassessment center.\n\n4.2.1 Perform Engine Overhauling\n Overhaul Engines and Associated Components\n4.2.2 Service Automotive Electrical Security and Electronic\n Components\n Test and Repair Electrical Security System/Components\n Service Electronic Engine Management\n Service and repair electronically controlled steering systems\n Service and repair electronically controlled suspension\nsystems\n Repair Instruments and warning systems\n Carry out diagnostic procedures\n4.2.3 Perform Servicing to Automatic Transmission\n Service Automatic Transmission\n4.2.4 Service Automotive Air-Conditioning\n Perform Maintenance Service Check Up and Repair to Auto\n AC System\n\n(ELECTIVE COMPETENCIES)\n4.2.5 Perform LPG Retrofitting/Conversion\n Install LPG Conversion Kit\n Test/Adjust LPG Calibration\n Service Auto LPG System\n4.2.6 Perform Motor Vehicle Re-powering\n Remove and Replace Automotive Engine and Engine-\nRelated Systems\n\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.3\n Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n4.4\n Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n4.5\nThe following are qualified to apply for assessment and certification:\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n4.5.2 Experienced workers (wage employed or self employed)\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “ Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTOQCS)”.\n\n--- PDF PAGE 118 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n116\n\n--- PDF PAGE 119 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n117\nDEFINITION OF TERMS\n\n1. Light Duty Vehicles\nThese are motor vehicles whose gross vehicle weight is\nequal or less than 3,500 kgs. Powered by a gas or diesel\nengine.\n2. Automotive Service\nTechnician\nRefers to an all around auto serviceman that can perform\nboth mechanical and electrical as well as auto electronics\nmaintenance checking and inspection of motor vehicle.\nAssesses\nvehicle\nproblems,\nperform\nall\nnecessary\ndiagnostic\ntest\nor\ninstallation\nof\naccessories\nand\ncompetently repairs or replaces faulty parts.\n3. Adhesives\nSubstance used to hold gasket in place during assembly. It\nalso maintains a tight seal by filling in small irregularities on\na surface and prevents gasket from shifting due to\nvibration.\n4. Anti-Lock Braking\nSystem\nSystem that automatically controls wheel slip or prevents\nsustained wheel locking on braking\n5. Automatic\nTransmission\nA transmission in which gear or ratio changes are self-\nactivated, eliminating the necessity of hand shifting gears\n6. Backlash\nThe amount of clearance or play between two meshed\ngears\n7. Catalytic Converter\n\nEmission The control device fitted in the exhaust system of\nan internal combustion engine. The converter reduces the\ntoxicity of products of combustion by catalytic re-\ncombination\n8. Charcoal Canister\nTrap containing charcoal granules to store fuel evaporating\nfrom a fuel system and prevent its loss to atmosphere,\nparticularly from a carburetor and fuel tank.\n9. Electronics\nElectrical assemblies, circuit and system that use electronic\ndevices such as transistors and diodes.\n10. Emissions\nAny air contaminant, pollutant, gas stream from a known\nsource which is introduced into the atmosphere.\n11. Final Drive\nThe end of the drive train before power is transmitted\nto the wheels.\n12. Fuel Injection\nAn electronic system that increases the performance ad\nfuel economy because it monitors engine conditions and\nprovides the correct air/fuel mixture based on the engine’s\ndemand. It injects fuel directly into the cylinder head\nenabling more precise control over the quantity used.\n\n--- PDF PAGE 120 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n118\n\n13. Governor\n\nA speed sensing device that employs centrifugal force and\nspring tension to govern engine speed.\n14. Hotchkiss Drive\nThe type of rear suspension in which leaf springs absorbs\nthe rear axle housing torque.\n15. Intake Manifold\n\nTubing attached to the engine through which the air/fuel\nmixture reaches the cylinder.\n16. Ignition System\nElectrical system devised to produce timed sparks from\nengine spark plug. Consisting of a battery, induction coil,\ncapacitor, distributor, spark plugs and relevant switches\nand wiring.\n17. Master Cylinder\nThe liquid-filled cylinder in the hydraulic brake system or\nclutch, where hydraulic pressure is developed when\ndepresses a foot pedal.\n18. Periodic\nMaintenance\nService\nThe regular servicing prescribed by manufacturer to\nmaintain the vehicle’s top performance.\n\n19. Positive Crank\nVentilation\nEmission control system that prevents crank case gases\nfrom entering the atmosphere, usually by drawing the\ngases from the crank case and feeding them into the\nengine’s induction system.\n20. Power Steering\nSteering that has been designed to make the wheel move\nmore easily than in a manual steering system. Hydraulic\nassists the process utilizing hydraulic fluid. The fluid\nincreases pressure in the power steering pump and aids in\nthe movement of the steering mechanism. This fluid, called\npower steering fluid, is what is replaced at regular intervals\nto keep steering soft and comfortable.\n21. Super Charged\nEngine\nAn engine that is similar to a turbo-charged engine which\nuses a series of belts or chains from the crankshaft to turn\nthe turbines that forces the air/fuel mixture into the cylinder\nheads under pressure creating a bigger explosion which\ngenerates more power. A turbocharger uses the exhaust\ngases to turn the turbines to create the same effect.\n22. Transaxle\nType of construction in which the transmission and\ndifferential are combined in one unit.\n23. Thermostat\nA device for automatic regulation of temperature\n\n--- PDF PAGE 121 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n119\n\n24. Turbo Charged\nEngine\nA performance-increasing turbine positioned in the exhaust\nsystem. Expanding exhaust gases spin an impeller (very\nsmall fan-type blades) at speeds up to 25 thousand rpm,\ndriving a similar compressing impeller. Compressed air\nfrom the driven impeller is forced into the induction system,\nwhich squeezes more air/fuel mixture into the combustion\nchambers. With the greater charge of air and fuel, a more\npowerful combustion burn results, thus more power. The\nbig advantage of the turbo over directly driven\nsuperchargers is the increased efficiency, although there is\na slight lag before the turbine spins up and increases the\npower output. Originally turbo were developed to enable\naircraft to fly at high altitudes, then they found use in diesel\ntrucks and train engines to increase their torque.\n25. U-joint\n\nA four-joint cross-connected to two U-shaped yokes that\nserve as a flexible coupling between shafts.\n26. Liquefied\npetroleum gas\n(LPG)\n\nMeans any product essentially composed of the following\nhydrocarbons: propane, propene (propylene), normal\nbutane, isobutene, isobutylene, butane (butylenes) and\nethane.\n27. Multi valves\n\nMeans a device consisting of all or part of the accessories\nincluding 80 percent stop valve, level indicator, pressure\nrelief valve (discharge valve) or power supply bushing (fuel\npump/actuators/fuel level sensor)\n28. Vaporizer\n\nA device intended to vaporize LPG from a liquid to a\ngaseous state\n29. LPG conversion kit\nA LPG fuel conversion kit usually include multi-valves, tank,\nchange over switch, vaporizer assembly, piping/hoses and\nsafety gadgets\n30. SGI\nSequential Gas Injector\n31. Retrofitting\nA modification of equipment to incorporate changes made\nin later production of similar equipment\n32. Re-powering\nReplacing the engine with a new, remanufactured or rebuilt\nengine.\n\n--- PDF PAGE 122 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n120\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who rendered their time and expertise to the development and\nvalidation of these Training Regulations.\n\nTHE TECHNICAL ADVISORY PANEL (TAP)\n\nMR. ALLEN RAYMUND A. RUFO\nTAP Chairman – Automotive Sector\nTOYOTA Motors Philippines, Corp.\nParañaque city\nAutomotive Industry Board Foundation\n(AIBFI)\nSuite 1206, 12 th flr. Jollibee Center\nSan Miguel Avenue, Pasig city\n\nMS. MA. CLARISSA V. FUNESTO\nTAP Alternate Chairperson – Automotive Sector\nHONDA Phils. Inc.\nParañaque city\nAutomotive Industry Board Foundation\n(AIBFI)\nSuite 1206, 12 th flr. Jollibee Center\nSan Miguel Avenue, Pasig city\n\nMR. SIXTO D. CAYPUNO\nTAP Member – Academe\nSamson Technical College\nCubao, Quezon City\n\nMR. ANGEL DIMALANTA\nTAP Member – Labor\nTOYOTA Motors Phils., Parañaque city\nTHE TECHNICAL AND 