  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of Automotive Servicing NC III, the candidate\nmust demonstrate competence through project-type assessment covering all the\nunits listed in Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n4.2 Individual aspiring to be awarded the qualification of Automotive Servicing NC III\nmust acquire Certificates of Competency in all the following core units of the\nQualification. Candidates may apply for assessment in any accredited\nassessment center.\n\n4.2.1 Perform Engine Overhauling\n Overhaul Engines and Associated Components\n4.2.2 Service Automotive Electrical Security and Electronic\n Components\n Test and Repair Electrical Security System/Components\n Service Electronic Engine Management\n Service and repair electronically controlled steering systems\n Service and repair electronically controlled suspension\nsystems\n Repair Instruments and warning systems\n Carry out diagnostic procedures\n4.2.3 Perform Servicing to Automatic Transmission\n Service Automatic Transmission\n4.2.4 Service Automotive Air-Conditioning\n Perform Maintenance Service Check Up and Repair to Auto\n AC System\n\n(ELECTIVE COMPETENCIES)\n4.2.5 Perform LPG Retrofitting/Conversion\n Install LPG Conversion Kit\n Test/Adjust LPG Calibration\n Service Auto LPG System\n4.2.6 Perform Motor Vehicle Re-powering\n Remove and Replace Automotive Engine and Engine-\nRelated Systems\n\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.3\n Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n4.4\n Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n4.5\nThe following are qualified to apply for assessment and certification:\n4.5.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n4.5.2 Experienced workers (wage employed or self employed)\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “ Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTOQCS)”.\n\n--- PDF PAGE 118 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n116\n\n--- PDF PAGE 119 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n117\n"
}
