      "definition": "A transmission in which gear or ratio changes are self- activated, eliminating the necessity of hand shifting gears 6. Backlash The amount of clearance or play between two meshed gears 7. Catalytic Converter Emission The control device fitted in the exhaust system of an internal combustion engine. The converter reduces the toxicity of products of combustion by catalytic re- combination 8. Charcoal Canister Trap containing charcoal granules to store fuel evaporating from a fuel system and prevent its loss to atmosphere, particularly from a carburetor and fuel tank. 9. Electronics Electrical assemblies, circuit and system that use electronic devices such as transistors and diodes. 10. Emissions Any air contaminant, pollutant, gas stream from a known source which is introduced into the atmosphere. 11. Final Drive The end of the drive train before power is transmitted to the wheels. 12. Fuel Injection An electronic system that increases the performance ad fuel economy because it monitors engine conditions and provides the correct air/fuel mixture based on the engine’s demand. It injects fuel directly into the cylinder head enabling more precise control over the quantity used. Automotive Servicing NC III (Amended) Promulgated December 2013 13. Governor A speed sensing device that employs centrifugal force and spring tension to govern engine speed. 14. Hotchkiss Drive The type of rear suspension in which leaf springs absorbs the rear axle housing torque. 15. Intake Manifold Tubing attached to the engine through which the air/fuel mixture reaches the cylinder. 16. Ignition System Electrical system devised to produce timed sparks from engine spark plug. Consisting of a battery, induction coil, capacitor, distributor, spark plugs and relevant switches and wiring. 17. Master Cylinder The liquid-filled cylinder in the hydraulic brake system or clutch, where hydraulic pressure is developed when depresses a foot pedal. 18. Periodic"
