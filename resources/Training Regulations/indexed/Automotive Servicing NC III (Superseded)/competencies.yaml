        "source_title": "SERVICE AUTOMATIC TRANSMISSION",
        "source_text": "--- PDF PAGE 71 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n69 \nUNIT OF COMPETENCY : \nSERVICE AUTOMATIC TRANSMISSION  \n \nUNIT CODE \n: \nALT723319 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with overhauling automatic \ntransmission (A/T). It also includes testing of A/T \nbefore and during road test. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n(Note: All standard of performance for Service Automatic \nTransmission is in accordance with company standard operating \nprocedure and manufacturer’s specification Manuals using specified \ntools and equipment)\n1. Diagnose automatic \ntransmission (A/T) \n \n1.1 Automatic transmission is tested for noise, shifting \ncondition, leaks, contamination and fluid pressure \n1.2 A/T is diagnosed as per Repair Manual to prevent \nseizure\n2. Dismount A/T \nassembly \n2.1 A/T fluid is drained thoroughly before transmission is \nremoved \n2.2 A/T cables and linkages is disconnected  \n2.3Appropriate tools are used \n3. Disassemble \nautomatic \ntransmission\n3.1 Disassemble parts are accurately marked/tagged \n3.2 Parts are cleaned as per Repair Manual \n4. Conduct automatic \ntransmission analysis\n \n4.1 A/T parts-hydraulic valve body, clutch and disc, bearing \nand planetary gears are checked/inspected for worn-\nout, crack, backlash and end play \n4.2 Inspection of parts is conducted \n4.3Corresponding Repair works are recommended\n5. Assemble automatic \ntransmission\n5.1 Assembling procedure is followed \n5.2 Assembled parts are lubricated  \n6. Mount/Install \nautomatic \ntransmission \nassembly \n6.1 Bolts are tightened and must be in accordance with \nManual torque specification, sequence and pattern \n6.2 Transmission  is connected/installed  \n6.3 Cables and linkages are adjusted  \n6.4 A/T fluid is refilled  \n7. Test automatic \ntransmission\n7.1 Stall Test and Lag test are conducted  \n7.2 Line pressure test is conducted  \n8. Road test automatic \ntransmission \n8.1 A/T fluid level, cable and linkages, engine operation are \nchecked before road test \n8.2 Report of test are completely accomplished and \ncorresponding recommendation are given\n\n--- PDF PAGE 72 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n70 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. A/T (Transmission/ \nTransaxle)  \nMay include: \n1.1  Preliminary checks \n \nEngine condition \n \nFluid level \n \nFluid condition \n \nControl linkage \n \nVacuum modulator \n1.2 Shop Testing \n \nPressure testing \n \nAir checking \n1.3  Road Test \n \nDevelop standard test route \n \nTest route include level section, hills section and \nquite section \n \nA/T must operate in each range to check shifting, \ncheck upshift and downshift speeds, and check for \nevidence of slippage Refer to a band chart \n \nIsolate A/T noise from various chassis and body \ncomponents noises such as –air-conditioning, \nalternator, power steering & fan by removal  of \ndrive belts of accessories and drive vehicle a short \ndistance. \n2. Manuals\nMay include: \n2.1  Manufacturer’s specification manual \n2.2  Maintenance procedure manual \n2.3  Periodic Maintenance Data \n2.4  Service and Repair manual \n2.5 Parts checklist\n3. Company standard \noperating procedure \nMay include: \n3.1  Job Order \n3.2  Requisition slip \n3.3  Wearing of personal protective equipment and \nclothing such as hand cleaner, hand gloves, safety \nshoes, skull guard, apron\n4. Tools and equipment \nMay include: \n4.1 Hydraulic lifter/Mechanical lifter \n4.2 Support Stand \n4.3 Transmission jack \n4.4 Socket wrench \n4.5 Snap ring expander \n4.6 Snap ring compressor \n4.7 Micrometer \n4.8 Torch wrench \n4.9 Allen wrench \n4.10 Combination wrench \n4.11 Basic handtools \n4.12 A/T pressure gauge \n4.13 Torque wrench \n4.14 Dial indicator with stand \n4.15 Air compressor \n4.16 Hard rubber mallet \n4.17 Ballpeen hammer\n\n--- PDF PAGE 73 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n71 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Disassembled automatic transmission \n1.2 Serviced Automatic Transmission \n1.3Performed Road Testing\n2. Required knowledge  \n2.1   A/T Dismantling and assembling procedures (relevant \nto application) \n2.2   A/T Component repair and adjustment procedures \n(relevant to application) \n2.3   Component/unit test procedures and evaluation \n(relevant   to application) \n2.4   Equipment/Material safety requirements \n2.5   Personal safety requirements \n2.6   Manual handling procedures \n2.7   Positive Work Values (Patience, Perseverance, \nHonesty, etc.) \n2.8   Quality procedures, e.g., 5S \n2.9   Environmental-conservation procedures,   \n     e.g., 3R (reduce, reuse, recycle)\n3. Required skills \n3.1   Access, interpret & apply technical information \n3.2   Apply personal safety requirements \n3.3   Use of relevant tools and equipment \n3.4   Overhaul automatic transmissions and associated \ncomponents \n3.5   Apply  component/unit test procedures an evaluation \n3.6   Maintain customer records \n3.7 Apply manual handling procedures\n4. Resource \nimplications \nThe following resources should be provided: \n4.1   Workplace: Real or simulated work area \n4.2   Appropriate Tools & equipment \n4.3 Materials relevant to the activity \n5. Method of \nassessment \nCompetency in this unit may be assessed through: \n5.1   Observation or Demonstration with Questioning \n5.2 Portfolio\n6. Context of \nassessment \n6.1  Competency must be assessed on the job or in a \nsimulated environment. \n6.2  The assessment of practical skills must take place \nafter a period of supervised practice and repetitive \nexperience.\n",
