        "source_title": "OVERHAUL ENGINE AND ASSOCIATED COMPONENTS",
        "source_text": "--- PDF PAGE 67 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n65 \nUNIT OF COMPETENCY : \nOVERHAUL ENGINE AND ASSOCIATED \nCOMPONENTS \n \nUNIT CODE \n: \nALT 723318 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to overhaul engines and associated \ncomponents of a removed engine. The task involves a \ncomplete dismantling and rebuilding of light/heavy \nvehicles, plant, motorcycles and marine on 2 and 4 \nstroke spark ignition and 2 and 4 stroke compression \nignition engines.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n(Note: All standard of performance for Overhaul Engine and Associated \nComponents is in accordance with Company standard operating \nprocedure and Manufacturer’s specification manuals using specified Tools \nand equipment.)\n1. Analyze engine \nfailure \n \n1.1 Battery to be used is always fully charged \n1.2 Cylinder compressor is checked  \n1.3  Valve timing is inspected  \n1.4  Oil pressure is checked  \n1.5  Cooling system (radiator or leak) is inspected  \n1.6  Valve clearance is inspected/adjusted  \n1.7  High tension cord is disconnected to the ignition coil during \nengine cranking \n2. Pull down the \nengine \n2.1  Vehicle is parked on designated area and wheel choked is \napplied \n2.2  Disconnected wire harness is accurately marked \n2.3  Battery is disconnected first before proceeding to remove \nother connection \n2.4 Engine is securely fitted or bolt to the engine stand\n3. Disassemble \nengine parts and \ncomponents \n \n3.1  Engine parts are checked for wear, damage and dirt \n3.2  Head bolts is removed following sequence pattern \n3.3  Engine is not turned upside down when the oil pan is \nremoved \n3.4 Crank shaft is removed in sequence pattern specified in the \nmanufacturer’s manual\n4. Inspect engine \nparts and \ncomponents \n \n4.1 Timing belt is not bended, twisted or turned inside out \n4.2 Belt is safeguarded not to get in contact with oil or other \nliquid chemical \n4.3 Cylinder warpage is referred to manufacturer’s manual \n4.4 Crankshaft maximum run-out is  0.06m \n        Inspection of the following should conform to  \n       Manufacturer’s manual \n4.5 Main journal diameter  \n4.6 Valve stem or valve bushing clearance \n4.7 Valve face angle is 45.5º \n4.8 Camshaft bore diameter oil clearance \n4.9 Piston ring groove clearance \n4.10 Piston ring end gap \n4.11 Piston to cylinder bore clearance \n4.12 Cylinder bore out of round & Taperness\n\n--- PDF PAGE 68 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n66 \n4.13 Cam Lobe diameter \n4.14 Cam Lift \n4.15 Crankshaft main journal/connecting rod journal out-of-round \nand taperness \n4.16 Thrust clearance \n4.17 Connecting Rod alignment \n4.18 Value Spring Tension\n5. Perform fitting & \n    adjustment of \nengine     \n    parts \n \n5.1 Fitting/Setting of valve to valve seat \n5.2 Application of prussian blu to the valve face \n5.3 If concentric 360º appearance of blu to the valve seat \n5.4 If not using valve upper hand upper hand lap the valve \n5.5 Camshaft is fitted to cylinder head \n5.6 Lay a strip of plastic gage \n5.7 Each cap bolt is tighten a little at a time in sequence \nspecified in Manufacturer’s manual \n5.8 Camshaft is not rotated \n5.9 Oversize piston is used only if clearance is excessive and if \nspecified in the manufacturer manual  \n5.10 Oversize piston ring is used only if specified by \nmanufacturer\n6. Assemble engine \n    parts/components \n \n6.1 Bolt is tightening  \n6.2 Valve timing mark are aligned \n6.3 Measurement of timing belt deflection is 5-6 mm at 2 kg. \nforce \n6.4 Valve clearance is adjusted\n7. Mount engine\n7.1 Position of engine to the vehicle must be supported by lifting \nequipment \n7.2 Accurate and correct connection of engine wiring harness, \nfuel lines and battery \n7.3 All mounting bolts are tightened as per specified torque\n\n--- PDF PAGE 69 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n67 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1 Engine  \n      and Associated    \n      Components \nMay include: \n1.1  Light, plant, 2 and 4 stroke spark ignition and 2 and 4 \nstroke compression ignition engines\n2.   Manual \nMay include: \n2.1 Manufacturer’s specification Manual \n2.2  Maintenance Procedure Manual \n2.3  Periodic Maintenance Data \n2.4  Service Manual \n2.5 Parts Checklist\n3. Company Standard \nOperating Procedure \nMay include: \n3.1  Job Order \n3.2  Requisition slip \n3.3  Wearing of Personal Protective Equipment such as: \n \nSafety shoes \n \nApron \n \nGoggles \n \nHand Gloves\n4. Tools/ Equipment/ \nand other materials  \nMay include: \n4.1  Hand tools, power tools, lifting and jacking equipment, \nspecialist tools, measuring equipment, tensioning \nequipment \nOther materials needed include: \n4.2  Engine oils, moving part lubricants, replacement \nparts,  gaskets and sealant\n\n--- PDF PAGE 70 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n68 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1  Analyzed engine failure \n1.2  Dismantled and assembled engine components \n1.3  Performed fitting and adjustment of engine \nparts/components\n2. Required knowledge  \n2.1  Engine overhaul procedures \n2.2  Procedure for Dismantling, assembling and \nadjustment of  components/parts \n2.3  Measuring and testing procedures \n2.4  Relevant technical information \n2.5  Equipment safety requirements \n2.6  Engine Component safety requirements \n2.7  Relevant enterprise policies \n2.8  Engine Parts/components handling techniques \n2.9  Personal safety requirements \n2.10 Positive Work Values (Patience, Perseverance, \nHonesty, etc.) \n2.11Quality procedures, e.g., 5S \n2.12Environmental-conservation procedures,   \n        e.g., 3R (reduce, reuse, recycle)\n3. Required skills \n3.1  Use of Repair Manual \n3.2  Interpreting engine wiring diagram \n3.3  Use of torque wrench & special service tools \n3.4  Using mathematical ideas and techniques \n3.5  Solving problems \n3.6  Fitting/adjusting engine parts \n3.7 Using measuring instrument\n4. Resource \nimplications \nThe following resources should be provided: \n4.1  Workplace: Real or simulated work area \n4.2  Appropriate Tools & equipment \n4.3 Materials relevant to the activity \n5. Method of \nassessment \nCompetency in this uniy may be assessed through: \n5.1 Observation or Demonstration with Questioning \n5.2 Portfolio \n6. Context of \nassessment \n6.1  Competency must be assessed on the job or in a \nsimulated environment. \n6.2 The assessment of practical skills must take place \nafter a period of supervised practice and repetitive \nexperience.\n",
