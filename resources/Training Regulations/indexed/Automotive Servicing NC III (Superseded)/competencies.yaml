        "source_text": "ALT 723352\n\nUNIT DESCRIPTOR: This unit identifies the competence required to service Auto\nLPG System to include electrical system, ignition and\nstarting, vaporizer or mixer.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(NOTE: All standard of performance for Service Auto LPG System is\nin accordance with company standard operating procedure and\nManufacturer’s Specification manuals using specified tools and\nequipment.)\n1. Service electrical\nsystem\n1. 1 Servicing of electrical system such as starting/\nignition system and its component is performed as\nper manufacturer’s manual using specified tools and\nequipment\n1.2 Servicing are completed without causing damage to\nworkplace property or vehicle.\n2. Service ignition\ncomponents\n2.1 Servicing of spark plug, contact points, rotor,\ndistributor cap, ignition switch is performed as per\nmanufacturer’s specifications/procedures\n2.2 Engine is started as per standard operating\n procedure.\n2.3 Servicing of ignition coil resistance is completed\n2.4 Servicing of ignition timing is performed\n2.5 Ignition system/components are repaired without\n causing damage to other vehicle parts\n3. Service\nvaporizer/mixer\n3.1 Servicing are carried out to tune the vaporizer or\n mixer using appropriate tools and techniques.\n3.2 Information is accessed and interpreted from\nappropriate manufacturer specifications\n3.3 Servicing are completed without causing damage to\nworkplace property or vehicle.\n4. Service LPG fuel\nsystem\n4.1 LPG fuel system components are serviced\naccording to manual and specifications\n4.2 Fuel filter is replaced according to manufacturer’s\ninstructions, as needed\n4.3 Servicing are completed without causing damage to\nany workplace property or vehicle.\n4.3 Occupational Health and Safety (OH & S)\nrequirements are observed throughout the work\n\n--- PDF PAGE 103 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n101\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manual\nMay include:\n1.1 Philippine National Standards (PNS 115)\n1.2 DILG Act of 1990 (RA 6975) Rule 8, Section 50\n1.3 Fire Code of the Phils. (PD 1185) Sect.8 and Rule 28\n1.4 LPG Gas Code (NFPA 58)\n1.5 Manufacturer specification manual\n1.6 Maintenance procedure manual\n1.7 Periodic maintenance manual\n1.8 Service manual\n1.9 Parts Checklist\n1.10 LPG Conversion Kit Manual\n3. Tools and\nequipment\nMay include:\n3.1 Hand tools, power tools,\n3.2 Special equipment, measuring, testing and lifting\nequipment,\n3.3 Testing instrument\n4. LPG fuel system\ncomponents\nMay include:\n4.1 Fuel filter and air cleaner\n4.2 Carburetor/EFI & SGI systems\n4.3 Fuel pump\n4.4 LPG Fuel Tank and Piping Line\n5. OH & S\nrequirements\nMay include:\n4.1 Workplace safety\n4.1.1protective clothing and equipment\n4.1.2 proper use of tools and equipment\n4.1.3 handling of materials\n4.1.4 use of fire fighting equipment\n4.1.5 first-aid\n4.2 Environment safety\n4.2.1 hazard control\n4.2.2 hazardous material and substances\n4.2.3 waste disposal\n\n--- PDF PAGE 104 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n102\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\nPerformed servicing of LPG fuel system\n2. Required\nknowledge\n2.1 Types of automotive engine, its parts and function\n2.2 Types, characteristics, functions and specifications of engine\nand other related systems\n2.3 OH & S regulations/requirements, equipment, materials and\npersonal safety requirements\n2.4 Installation Kit procedure and safety precaution\n2.5 Multi Valve, Vaporizer, Tank and Change Over Switch\n Parts and nomenclatures\n2.6 Analysis in Working Plan for Piping Lay out\n2.7 Types of LPG Safety accessories\n2.8 Installation procedure of Valves, Vaporizer change over\n switch, piping and safety gadgets\n2.9 Special tools in setting and installing the LPG\n Conversion Kit\n2.10 Procedure in installing the LPG Tank\n2.11 Use of common automotive tools and equipment\n2.12 Work organization and planning processes\n2.13 Company/workshop quality processes\n2.14 Types and uses of fuel or hazardous materials\n2.15 Measuring instruments (Battery load tester, Timing light, etc.)\n2.16 Positive Work values (Perseverance, Honesty, Attention to\ndetails)\n2.17 Types of Ignition System, Carburetor, SGI and EFI\n2.18 Equipment safety requirements\n2.19 Relevant company policies\n2.20 Personal safety requirements\n2.21 Types of Leak Test and Instruments\n2.22 Principle of LPG Engine operation\n2.23 Quality procedures, e.g., 5S\n2.24 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Accessing, interpreting and applying technical information\n3.2 Using relevant tools in tuning vaporizer and equipment safely\n3.3 Maintaining customer records\n3.4 Applying maintenance procedures\n3.5 Following servicing/inspection job order\n3.6 Speaking and listening skills\n3.7 Reading and writing skills\n3.8 Using and interpreting measurements\n4\nResource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n4.4 Repair manuals and related reference materials\n5\nMethod of\nassessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation with questioning\n5.2 Demonstration with questioning\n6\nContext of\nassessment\n6.1 Competency may be assessed on the job or\nsimulated environment.\nThe assessment of practical skills must take place after a\nperiod of supervised practice and repetitive experience.\n\n--- PDF PAGE 105 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n103"
