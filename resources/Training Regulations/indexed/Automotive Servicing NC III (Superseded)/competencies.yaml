          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Interpreted technical drawing\n1.2 Selected correct technical drawing\n1.3 Applied freehand sketching\n2. Required\nknowledge\n2.1 Drawing standard symbols\n2.2 Safe handling of tools and consumables\n2.3 Identification of types of drawing\n2.4 Patience, Perseverance, Attention to Details\n3. Required skills\n3.1 Draw/interpret orthographic drawing\n3.2 Handling of drawing instruments\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Drawing room\n4.2 Appropriate tools\n4.3 Materials relevant to activity\n5. Method of\n assessment\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Written/Oral examination\n5.3 Presentation of Finished drawing\n6. Context of\nassessment\n6.1 Must be assessed in a drawing room or in any simulated\nplaces\n6.2 Assessment must be given according to industry\n standard\n\n--- PDF PAGE 42 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n40\n\nUNIT OF MPETENCY: PRACTICE HEALTH, SAFETY AND ENVIRONMENT\nPROCEDURES\nUNIT CODE :"
