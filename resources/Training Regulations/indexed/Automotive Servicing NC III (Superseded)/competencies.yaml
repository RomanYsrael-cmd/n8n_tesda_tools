        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified types of lubricants and lubrication schedule.\n1.2 Used and applied lubricants.\n1.3 Performed housekeeping\n\n2. Required\nknowledge\n2.1 Types/Classification of Lubricants\n2.2 Identifying lubrication schedule\n2.3 Cause and Effects of Gear Oil Dilution\n2.4 Purpose of Lubrication (Problem and effects)\n2.5 Hazard associated with lubrication\n\n3. Required skills\n3.1 Handling of oils (Gear, oil, engine oil)\n3.2 Familiarization/Classification of Lubricants\n3.3 Lubrication Procedure\n\n4. Resource\nimplications\n\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Materials relevant to activity\n\n5. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written/Oral examination\n\n6. Context of\nassessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment must be undertaken in accordance with the\n endorsed industry assessment guidelines\n6.3 Assessment of underpinning knowledge and skills may be\n assessed on or off-the-job\n\n--- PDF PAGE 34 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n32\nUNIT OF COMPETENCY: PERFORM SHOP MAINTENANCE\n\nUNIT CODE:"
        },
        "source_text": "ALT723204\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes required in\nselecting and applying different types of lubricants.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify types of\nlubricants/\ncoolants\n\n1.1 Correct information on lubrication schedule is\naccessed and interpreted from appropriate\nmanufacturers specifications manuals\n1.2 Type and quantity of lubricants/coolant are identified\nas per job requirements\n\n2. Use and apply\n lubricants/coolant\n\n2.1 Correct procedure for change of lubricant is identified\nfollowing manufacturer’s specification or manual\n2.2 Correct tools and equipment are selected and used in\nline with job requirements\n2.3 Existing lubricants are removed and replaced with\nspecified types and quantity of new materials in line with\nmanufacturer’s specification\n2.4 Safe procedure and use of PPE are observed when\nremoving or replacing lubricant\n2.5 Used lubricants are disposed in accordance with\n environmental guidelines\n2. 6 Work is checked in line with company SOP.\n\n3. Perform\nhousekeeping\nactivities\n\n3.1 Tools, equipment and materials are properly stored as\nper company SOP\n3.2 Workplace is free from waste materials\n\n--- PDF PAGE 32 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\nMay include:\n1.1 Manufacturer’s specification manual\n1.2 Periodic Maintenance manual\n1.3 Service Manual\n2.Lubricants/ Coolant\n\nMay include:\n2.1 Engine oil:\n•\nDiesel engine oil\n•\nGasoline engine oil\n2.2 Automatic Transmission Fluid\n•\nDestro II\n•\nT4\n2.3 Gear oil lubricants:\n•\nOil #90\n•\nOil #140\n•\nOil #30\n•\nOil #40\n2.4 Grease\n• Special (velocity joint)\n Molybdenum disolfate)\n• Ordinary\n• Multi-purpose oil\n• Contact point lubricant\n (grease)\n2.5 Brake/Clutch System\n•\nBrake fluid\n•\nDOT3\n\n2.6 Power Steering Fluid\n•\nHydraulic Fluid\n\n2.7 Radiator Coolant\n•\nLong last coolant\n\n2.8 A/C Compressor Oil\n•\nPag oil\n3. Lubricant\n Schedule\nMay include:\n3.1 Kilometers traveled/used\n3.2 No. of Hours used\n3.3 Monthly\n4. Tool and\n equipment\nMay include:\n4.4 Hand tools\n4.5 Oiler\n4.6 Oil Dispenser\n4.7 Grease gun\n5. Personal\nProtective\nEquipment (PPE)\n\nMay include:\n5.1 Apron\n5.2 Gloves\n5.3 Goggles\n5.4 Safety shoes\n\n--- PDF PAGE 33 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n31\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified types of lubricants and lubrication schedule.\n1.2 Used and applied lubricants.\n1.3 Performed housekeeping\n\n2. Required\nknowledge\n2.1 Types/Classification of Lubricants\n2.2 Identifying lubrication schedule\n2.3 Cause and Effects of Gear Oil Dilution\n2.4 Purpose of Lubrication (Problem and effects)\n2.5 Hazard associated with lubrication\n\n3. Required skills\n3.1 Handling of oils (Gear, oil, engine oil)\n3.2 Familiarization/Classification of Lubricants\n3.3 Lubrication Procedure\n\n4. Resource\nimplications\n\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Materials relevant to activity\n\n5. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written/Oral examination\n\n6. Context of\nassessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment must be undertaken in accordance with the\n endorsed industry assessment guidelines\n6.3 Assessment of underpinning knowledge and skills may be\n assessed on or off-the-job\n\n--- PDF PAGE 34 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n32\nUNIT OF COMPETENCY: PERFORM SHOP MAINTENANCE\n\nUNIT CODE:"
