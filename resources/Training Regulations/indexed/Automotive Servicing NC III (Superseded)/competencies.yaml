          "source_text": "1. Apply basic safety \nprocedures \n1.1. \nPolicies and procedures to achieve a safe working \nenvironment are followed and maintained in line with \noccupational health and safety (OHS) procedures  \nand according to worksite policy \n1.2. \nAll unsafe situations are recognized and reported \naccording to worksite policy \n1.3. \nAll breakdowns in relation to machinery and \nequipment are reported to supervisor or nominated \npersons \n1.4. \nFire and safety hazards are identified and \nprecautions are taken or reported according to \nworksite policy and procedures \n1.5. \nDangerous goods and substances are identified, \nhandled and stored according to worksite policy and \nprocedures and OHS requirements \n1.6. \nWorksite policy regarding manual handling practice is \nfollowed \n1.7. \nParticipation in consultative arrangements \nestablished by company for OHS is exercised \n2. Apply emergency \nprocedures \n2.1. \nWorksite policies and emergency procedures \nregarding illness or accidents are identified and \napplied  \n2.2. \nSafety alarms are identified \n2.3. \nQualified persons are contacted in the event of \naccident or sickness of customers or staff and \naccident details are documented according to \nworksite accident/ injury procedures \n2.4. \n Worksite evacuation procedures are identified and \napplied\n\n--- PDF PAGE 43 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n41 \nRANGE OF VARIABLES \n \nVARIABLE\nRANGE\n1. Policies and \nprocedures \nMay include: \n1.1. \nHazard policies and procedures \n1.2. \nEmergency, fire and accident procedures \n1.3. \nPersonal safety procedures \n1.4. \nProcedures for the use of personal protective clothing \nand equipment \n1.5. \nUse of motor vehicles \n1.6. \nResolution procedures \n1.7. \nJob procedures  \n1.8. \nWork instructions \n2. OHS procedures \nMay include: \n2.1. \nSafe manual handling and lifting customers, staff, \nequipment/tooling, premises and stock \n3. Hazards \nMay include: \n3.1. \nSharp cutting tooling and instruments \n3.2. \nElectricity and water  \n3.3. \nToxic substances \n3.4. \nDamaged packing material or containers \n3.5. \nBroken or damaged equipment \n3.6. \nFlammable materials and fire hazards \n3.7. \nLifting practices \n3.8. \nSpillages, waste and debris especially on floors, \nladders, trolleys and glue guns/burns \n  \n4. Emergency \nprocedures \nMay include: \n4.1. \nSickness \n4.2. \nAccident \n4.3. \nFire or store evacuation involving staff or customers\n\n--- PDF PAGE 44 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n42"
