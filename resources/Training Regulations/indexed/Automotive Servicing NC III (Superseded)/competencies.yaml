y related to the repair of instruments and\nwarning systems, including the use of specialist tools and equipment,\nmeasuring equipment, computerized technology and communication\ndevices\n3.9 Reporting/documenting of results\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n4.4 Manufacturer’s repair manual or related reference/ service materials\nor manuals\n4.5 Motor vehicle\n4.6 Replacement units\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation with questioning\n5.2 Demonstration with questioning\n6. Context of\nassessment\n6.1 Competency may be assessed on the job or simulated environment.\n6.2 The assessment of practical skills must take place after a period of\nsupervised practice and repetitive experience.\n\n--- PDF PAGE 93 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n91\nUNIT OF COMPETENCY : CARRY OUT DIAGNOSTIC PROCEDURES\n\nUNIT CODE\n\n : ALT 723361\n\nUNIT DESCRIPTOR\n : This unit covers the competence required to diagnose\n component / equipment faults from different symptoms\n and to nominate repair action.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(NOTE: All standard of performance for this unit is in accordance with\ncompany standard operating procedure and manufacturer’s specification\nmanuals using specified tools and equipment)\n1. Prepare to\n diagnose faults\n\n1.1. Information is accessed from appropriate sources\n1.2. Differentiate between \"symptoms\" and \"causes\"\n1.3. Identify fault diagnosis as a process\n1.4. Familiarization of system(s) from the area of the fault's\norigin\n2. Apply technology to\nisolate fault(s)\n2.1. Diagnosis strategy is developed in order to determine a\n fault within the component / equipment\n2.2. Measuring equipment like meters / gauges is applied to\n isolate fault\n2.3. Identification of fault(s) are made from test results\n2.4. Findings are confirmed by an alternate route/plan\n2.5. Faults are diagnosed without causing damage to\n workplace property, component or equipment\n2.6. Inspections are carried out according to industry\n regulations/guidelines, OH&S legislation, legislation and\n enterprise procedures/policies\n3. Recommend\nrectification\nmethod(s)\n3.1. Report of findings is completed in workplace approved\n format\n3.2. Rectification strategy is identified with the use of\n appropriate tools and equipment\n3.3. Consequences of ignoring strategy are identified\n3.4. Any faults in conflict with roadworthiness or safe\n operation of component/equipment are immediately\n brought to the attention of the supervisor for action\n4. Component /\n equipment is\n prepared for\n customer use\n\n4.1. Work schedule documentation is completed\n4.2. Final inspection is made to ensure safety features are in\n place\n4.3. Final inspection is made to ensure work is done according\n to workplace expectations\n4.4. Job card is completed and delivered to appropriate staff\n\n--- PDF PAGE 94 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n92\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information\nMay include:\n1.1 Verbal or written and graphical instructions, signage,\n work schedules/plans/specifications, work bulletins,\n memos, material safety data sheets, diagrams or\n sketches\n1.2 Safe work procedures related to the carry out diagnostic\n procedures\n1.3 Regulatory/legislative requirements pertaining to\n automotive industry practices\n1.4 Vehicle maker’s design specifications and instructions\n2. Diagnosis\n strategy\nMay include:\n2.1 Removal and replacement, dismantling, adjusting\n2.2 Visual and aural identification and testing\n2.3 Performance comparison of component/equipment\n2.4 Variable diagnosis like on-and off-site, indoor and outdoor\n and on-and off-shore\n3. OH & S\n requirements\nMay include:\n3.1 Workplace safety\n3.1.1 protective clothing and equipment\n3.1.2 proper use of tools and equipment\n3.1.3 handling of materials\n3.1.4 use of fire fighting equipment\n 3.1.5 first-aid\n3.2 Environment safety\n 3,2,1 hazard control\n3.2.2 hazardous material and substances\n3.2.3 waste disposal\n4. Tools and\nequipment\nMay include:\n4.1 Hand tools\n4.2 Testing equipment, including multi-meters\n4.3 Power tools\n4.4 Air tools\n4.5 Specialized tools for removal/adjustment\n4.6 Specialized system testers, oscilloscopes, scanner\n and LED test lights\n4.7 Computer software and hardware\n5. Materials\n\nMay include:\n5.1 Spare parts\n5.2 Cleaning materials\n\n--- PDF PAGE 95 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n93\nEVIDENCE GUIDE\n\n1. Critical aspects\n of competency\nAssessment requires evidence that the candidate:\n1.1 Observed safety procedures and requirements\n1.2 Communicated effectively with others involved in or affected\nby the work\n1.3 Selected methods and techniques appropriate to the\nCircumstances\n1.4 Completed preparatory activity in a systematic manner\n1.5 Conducted diagnosis of a range of faults in accordance with\nworkplace requirements to test and verify symptoms\n1.6 Interpreted results\n1.7 Confirmed diagnosis of fault(s)\n1.8 Completed diagnosis within workplace timeframes\n1.9 Presented component / equipment to customer in\ncompliance with workplace requirements\n2. Required\nknowledge\n2.1 OH&S regulations/requirement, equipment, material and\npersonal safety requirements\n2.2 Diagnostic procedures and problem-solving techniques\n2.3 Documenting procedures\n2.4 Symptom and cause differentiation\n2.5 Documenting responsibilities\n2.6 Work organization and planning processes\n2.7 Enterprise quality procedures\n2.8 Quality procedures, e.g., 5S\n2.9 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Applying research and interpretive skills sufficient to locate,\ninterpret and apply manufacturer/component supplier procedures,\nworkplace policies and procedures\n3.2 Applying analytical skills for identification and analysis of\ntechnical information\n3.3 Applying questioning and active listening skills\n3.4 Applying oral communication skills sufficient to convey\ninformation and concepts to customers\n3.5 Applying planning and organizing skills to work activities,\n3.6 Using mathematical ideas and techniques to correctly\ncalculate time, assess tolerances, apply accurate measurements,\ncalculate material requirements and establish quality checks\n3.7 Applying problem-solving strategies in purposeful ways\n3.8 Using workplace technology related to the diagnosis of faults,\nincluding the use of specialist tooling and equipment, measuring\nequipment, computerized technology and communication devices\nand the documenting / recording of results\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to diagnosis of faults\n4.4 Manufacturer’s repair manual or related reference/ service\nmaterials or manuals\n4.5 Motor vehicle\n4.6 Replacement units\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation with questioning\n5.2 Demonstration with questioning\n6. Context of\nassessment\n6.1 Competency may be assessed on the job or simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a\nperiod of supervised practice and repetitive experience.\n\n--- PDF PAGE 96 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n94\nELECTIVE COMPETENCIES\n\nUNIT OF COMPETENCY: INSTALL LPG CONVERSION KIT\n\nUNIT CODE: ALT 723350\n\nUNIT DESCRIPTOR: This competency unit covers the ability to install the\ncomponent of LPG Conversion Kit to include the multi valve,\ntank, change over switch, vaporizer assembly, piping/hoses\nand safety gadgets.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(NOTE: All standard of performance for Installing the LPG Conversion Kit is in\naccordance with company standard operating procedure and manufacturer’s\nspecification manuals using specified tools and equipment)\n1. Perform vehicle\n test\n\n1.1 Vehicle engine condition is checked\n\n1.2 Appropriate test instruments, tools and equipment are\nselected\n\n1.3 Installation plan and design is checked\n\n1.4 Findings is reported and recommendation is made to direct\nsupervisor\n2. Mount and install\nconversion kit\n2.1 LPG Conversion kit is checked and tested\n\n2.2 Installation plan is checked\n\n2.3 Installation information of LPG tank is accessed and\ninterpreted based on manufacturers specification\n\n2.4 Mounting and installation is performed\n\n2.5 Wiring installation is performed\n3. Install piping/hoses\nand safety features\nof the kit\n\n3.1 Piping/tubes, hoses and fittings are checked and tested\n\n3.2 Piping lay out is performed at the front, underneath and rear\nof the vehicle\n\n3.3 Information is accessed and interpreted based on the piping\ninstallation specifications and safety rules\n\n3.4 Mounting and installation is performed based on procedures\nmanual, safety handbook, manufacturer’s instruction and\noccupational health and safety (OH&S) requirements\n\n--- PDF PAGE 97 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n95\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Engine\nCondition\nMay include:\n1.1 Timing\n1.2 Compression\n2. Tools and\nequipment\nMay include:\n2.1 Common hand tools\nScrewdriver, Hand drill, Pliers, Wrenches\n2.2 Testing instrument\nBattery load tester, Compression tester, Timing light\n2.5 Cleaning tools\nSteel brush, Air compressor, Hand cleaner, rags, etc.\n3. LPG Conversion\nKit\n\nMay include:\n3.1 Multi Valves Carburetor Type, Electronic Fuel Injector\n(EFI) and Sequential Gas Injector (SGI)\n3.2