          "source_text": "1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried out measurements and calculations.\n1.3 Maintained measuring instruments\n\n2. Required\nknowledge\n\n2.1 Types of Measuring instruments and their uses\n2.2 Safe handling procedures in using measuring instruments\n2.3 Four fundamental operation of mathematics\n2.4 Formula for Volume, Area, Perimeter and other geometric\nfigures\n\n3. Required\n skills\n\n3.1 Caring and Handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.1 Performing calculation by Addition, Subtraction,\nMultiplication and Division\n3.2 Visualizing objects and shapes\n3.3 Interpreting formula for volume, area, perimeter and other\ngeometric figures\n\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3 Instructional materials relevant to the propose activity\n\n5. Method of\n assessment\n\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4 Demonstration with questioning\n\n6. Context of\n assessment\n\n6.1 Competency elements must be assessed in a safe\nworking environment\n6.2 Assessment may be conducted in a workplace or\nsimulated environment\n\n--- PDF PAGE 29 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n27\nUNIT TITLE: READ, INTERPRET AND APPLY SPECIFICATION AND MANUALS.\n\nUNIT CODE:"
