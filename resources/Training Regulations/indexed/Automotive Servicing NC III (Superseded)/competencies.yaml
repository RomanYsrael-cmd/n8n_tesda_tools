          "source_text": "(NOTE: All standard of performance for this unit  is in accordance with \ncompany standard  operating procedure and manufacturer’s specification \nmanuals using specified tools and equipment)\n1. Prepare for work \n \n1.1  Work instructions are used to determine job \nrequirements, including quality, material, equipment \nquantities and service manuals. \n1.2  Job specifications are read and interpreted  \n1.3  Occupational Health and Safety (OH & S) requirements \nare observed throughout the work \n1.4  Electronic system protection devices, processes and \n       precautions are identified appropriate to the application \n1.5 Tools and equipment (including measuring/ test \ninstruments) are identified and checked for safe \noperation \n1.6 Procedures are identified to minimize task time\n2. Service and adjust \nelectronically \ncontrolled steering \nsystems \n2.1 Service information is accessed and interpreted prior to \n       commencing servicing procedures \n2.2 Electronically controlled steering systems is  \ndetermined in conjunction with the customer \n2.3  Current status of the electronic system is confirmed \n       through a road test program \n2.4 Electronic system is serviced in accordance with \n      manufacturer/component supplier specifications and \n      enterprise procedures \n2.5 Fluids and lubricants are used in accordance with OH&S \n      and manufacturer/component supplier specifications \n2.6 Used fluids and lubricants are disposed of according to \n     enterprise and OH&S requirements\n\n--- PDF PAGE 81 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n79 \n \n3. Rectify identified \n    electronically   \n    controlled \n    steering system      \n    faults \n \n \n \n \n3.1 Road test results are interpreted to verify system fault \n      diagnosis \n3.2  Customer is notified of identified fault(s) and agreement \n       is given before work is carried out \n3.3  Faulty components are removed and refitted with \napproved replacement parts reference with approved    \nworkplace \n        procedures and customer requirements \n3.4   Faulty components are disposed of reference with \n  approved workplace procedures and warranty \n  requirements \n3.5  System adjustments are completed for replaced  \n components \n     \n4.  Test and confirm    \nsystem faults after \nrectification have \nbeen done \n4.1 Test procedures are carried out to confirm rectification of \n      system faults \n4.2 Documentation is completed in accordance with \n      workplace/customer requirements \n4.3 Outcomes of rectification work is explained to the \n      satisfaction of the customer to complete invoice     \n     documentation\n5. Clean up work \narea and maintain \nequipment \n5.1 Materials that can be reused is collected and stored \n5.2 Waste and scrap is removed following workplace \n      procedures \n5.3 Equipment and work area are cleaned and inspected for \n      serviceable conditions in accordance with workplace \n      procedures \n5.4 Serviceable equipment and faults identified are tagged in \n      accordance with workplace procedures \n5.5  Maintenance is completed in accordance with \n      manufacturer/component supplier specifications and site \n      procedures \n5.6 Tooling is maintained in accordance with workplace \n      procedures\n\n--- PDF PAGE 82 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n80 \n    RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  OH & S     \n     requirements \nMay include: \n1.1 Workplace safety \n1.1.1  protective clothing and equipment \n1.1.2  proper use of tools and equipment  \n1.1.3  handling of materials  \n1.1.4  use of fire fighting equipment  \n1.1.5 first-aid \n1.2  Environment safety \n  1,2,1  hazard control \n1.2.2   hazardous material and substances \n1.2.3  waste disposal \n2. Tools and \nequipment \nMay include: \n2.1  Hand tools \n2.2 Testing equipment, including multi-meters \n2.3  Power tools \n2.4 Air tooling \n2.5   Specialized tools for removal/adjustment \n2.6 Specialized system testers, oscilloscopes, scanner       \n and LED test lights\n3. Service \nInformation \nMay include: \n3.1 Verbal or written and graphical instructions, signage,      \nwork schedules/plans/specifications, work bulletins, memos, \nmaterial safety data sheets, diagrams or sketches \n3.2 Safe work procedures related to the service and repair of \n      electronically controlled steering systems  \n3.3 Regulatory/legislative requirements pertaining to \n      automotive industry practices \n3.4Vehicle maker’s design specifications and instructions\n4. Electronically \ncontrolled \nsteering \nsystems \nMay include: \n2.1 Two - wheel steering systems and fitted to light vehicles   \n and/or heavy commercial vehicles \n2.2 Four - wheel steering systems and fitted to light vehicles   \n     and/or heavy commercial vehicles\n5. Fault \nMay include: \n5.1  Component malfunction  \n5.2  System adjustment \n5.3  Open, short and grounded circuits\n6. Materials \n \nMay include: \n6.1  Spare parts  \n6.2 Lubricants \n6.3 Fluids \n6.4 Cleaning materials \n6.5 Fuel\n\n--- PDF PAGE 83 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n81"
