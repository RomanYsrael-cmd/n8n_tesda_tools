  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core\nunits of competency required in AUTOMOTIVE SERVICING NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nLEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311109\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to lead in the dissemination and\ndiscussion of ideas, information and issues in the\nworkplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1. Appropriate communication method is selected\n1.2. Multiple operations involving several topics areas\nare communicated accordingly\n1.3. Questions are used to gain extra information\n1.4. Correct sources of information are identified\n1.5. Information is selected and organized correctly\n1.6. Verbal and written reporting is undertaken when\nrequired\n1.7. Communication skills are maintained in all\nsituations\n2. Lead workplace\ndiscussions\n2.1. Response to workplace issues are sought\n2.2. Response to workplace issues are provided\nimmediately\n2.3. Constructive contributions are made to workplace\ndiscussions on such issues as production, quality\nand safety\n2.4. Goals/objectives and action plan undertaken in\nthe workplace are communicated\n3. Identify and\ncommunicate issues\narising in the workplace\n3.1. Issues and problems are identified as they arise\n3.2. Information regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3. Dialogue is initiated with appropriate personnel\n3.4. Communication problems and issues are raised\nas they arise\n\n--- PDF PAGE 6 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at\none time\n1.2.\nMade constructive contributions in workplace\nissues\n1.3.\nSought workplace issues effectively\n1.4.\nResponded to workplace issues promptly\n1.5.\nPresented information clearly and effectively\nwritten form\n1.6.\nUsed appropriate sources of information\n1.7.\nAsked appropriate questions\n1.8.\nProvided accurate information\n2. Underpinning\nknowledge and\nattitude\n2.1.\nOrganization requirements for written and\nelectronic communication methods\n2.2.\nEffective verbal communication methods\n3. Underpinning\nskills\n3.1.\nOrganize information\n3.2.\nUnderstand and convey intended meaning\n3.3.\nParticipate in variety of workplace discussions\n3.4.\nComply with organization requirements for the use\nof written and electronic communication methods\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nVariety of Information\n4.2.\nCommunication tools\n4.3.\nSimulated workplace\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1.\nCompetency in this unit must be assessed through\n5.2.\nDirect Observation\n5.3.\nInterview\n6. Context of\nassessment\n6.1.\nCompetency may be assessed in the workplace or\nin simulated workplace environment\n\n--- PDF PAGE 7 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n5\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\n\nUNIT CODE\n : 500311110\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to\nlead small teams including setting and maintaining\nteam and individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1.\nWork requirements are identified and presented to\nteam members\n1.2.\nReasons for instructions and requirements are\ncommunicated to team members\n1.3.\nTeam members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign responsibilities\n2.1.\nDuties, and responsibilities are allocated having\nregard to the skills, knowledge and aptitude\nrequired to properly undertake the assigned task\nand according to company policy\n2.2.\nDuties are allocated having regard to individual\npreference, domestic and personal considerations,\nwhenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1.\nPerformance expectations are established based on\nclient needs and according to assignment\nrequirements\n3.2.\nPerformance expectations are based on individual\nteam members duties and area of responsibility\n3.3.\nPerformance expectations are discussed and\ndisseminated to individual team members\n4. Supervised team\nperformance\n4.1.\nMonitoring of performance takes place against\ndefined performance criteria and/or assignment\ninstructions and corrective action taken if required\n4.2.\nTeam members are provided with feedback,\npositive support and advice on strategies to\novercome any deficiencies\n4.3.\nPerformance issues which cannot be rectified or\naddressed within the team are referenced to\nappropriate personnel according to employer policy\n4.4.\nTeam members are kept informed of any changes\nin the priority allocated to assignments or tasks\nwhich might impact on client/customer needs and\nsatisfaction\n4.5.\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6.\nFollow-up communication is provided on all issues\naffecting the team\n4.7.\nAll relevant documentation is completed in\naccordance with company procedures\n\n--- PDF PAGE 8 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s concerns\n2.1. Roster/shift details\n3. Monitor performance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 9 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n7\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to\nnext level of management or appropriate specialist\nand to negotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5. Set and communicated performance expectations for\na range of tasks and duties within the team and\nprovided feedback to team members\n2. Underpinning\nknowledge and\nattitude\n2.1. Company policies and procedures\n2.2. Relevant legal requirements\n2.3. How performance expectations are set\n2.4. Methods of Monitoring Performance\n2.5. Client expectations\n2.6.\nTeam member’s duties and responsibilities\n3. Underpinning\nskills\n3.1. Communication skills required for leading teams\n3.2. Informal performance counseling skills\n3.3. Team building skills\n3.4.\nNegotiating skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2.\nMaterials relevant to the proposed activity or task\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and/or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context of\nassessment\n6.1. Competency assessment may occur in workplace or\nany appropriately simulated environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 10 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n8\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes\nrequired to collect information in order to negotiate to a\ndesired outcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Plan negotiations\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\nInformation on preparing for negotiation is\nidentified and included in the plan\nInformation on creating non verbal environments\nfor positive negotiating is identified and included in\nthe plan\nInformation on active listening is identified and\nincluded in the plan\nInformation on different questioning techniques\nis identified and included in the plan\nInformation is checked to ensure it is correct and\nup-to- date\n2. Participate in\nnegotiations\n2.1\n\n2.2\n2.3\n\n2.4\n2.5\n\n2.6\n\n2.7\n2.8\nCriteria for successful outcome are agreed upon by\nall parties\nDesired outcome of all parties are considered\nAppropriate language is used throughout the\nnegotiation\nA variety of questioning techniques are used\nThe issues and processes are documented and\nagreed upon by all parties\nPossible solutions are discussed and their viability\nassessed\nAreas for agreement are confirmed and recorded\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 11 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1 Background information on other parties to the\nnegotiation\n1.2 Good understanding of topic to be negotiated\n1.3 Clear understanding of desired outcome/s\n1.4 Personal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\n1.5 Interpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\n1.6 Analytic skills\n1.6.1 observing differences between content and\nprocess\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for\nresolving conflict\n2. Non verbal\nenvironments\n2.1 Friendly reception\n2.2 Warm and welcoming room\n2.3 Refreshments offered\n2.4 Lead in conversation before negotiation begins\n3. Active listening\n3.1 Attentive\n3.2 Don’t interrupt\n3.3 Good posture\n3.4 Maintain eye contact\n3.5 Reflective listening\n4. Questioning\ntechniques\n4.1 Direct\n4.2 Indirect\n4.3 Open-ended\n\n--- PDF PAGE 12 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n10\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to\nachieve an agreed outcome\n2. Underpinning\nknowledge and\nAttitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies\nprocedures\n2.4 Problem solving strategies on how to deal with\nunexpected questions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning\nskills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation\nprocess\n4.2 Human resources (negotiators)\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context of\nassessment\n6.1 Competency to be assessed in real work environment or\nin a simulated workplace setting.\n\n--- PDF PAGE 13 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n11\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK\nACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of competencies covers the knowledge, skills\nand attitudes required to solve problems in the\nworkplace including the application of problem solving\ntechniques and to determine and resolve the root\ncause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the problem\n1.1.\nVariances are identified from normal operating\nparameters; and product quality\n1.2.\nExtent, cause and nature are of the problem\nare defined through observation, investigation\nand analytical techniques\n1.3.\nProblems are clearly stated and specified\n2. Determine fundamental\ncauses of the problem\n2.1.\nPossible causes are identified based on\nexperience and the use of problem solving\ntools / analytical techniques.\n2.2.\nPossible cause statements are developed\nbased on findings\n2.3.\nFundamental causes are identified per results\nof investigation conducted\n3. Determine corrective\naction\n3.1.\nAll possible options are considered for\nresolution of the problem\n3.2.\nStrengths and weaknesses of possible options\nare considered\n3.3.\nCorrective actions are determined to resolve\nthe problem and possible future causes\n3.4.\nAction plans are developed identifying\nmeasurable objectives, resource needs and\ntimelines in accordance with safety and\noperating procedures\n4. Provide\nrecommendation/s to\nmanager\n4.1.\nReport on recommendations are prepared\n4.2.\nRecommendations are presented to\nappropriate personnel.\n4.3.\nRecommendations are followed-up, if required\n\n--- PDF PAGE 14 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n1.6.\nGant chart, Pert CPM and graphs\n1.7.\nScattergrams\n2. Problem\n\n2.1.\nNon – routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and\nincidents\n3. Action plans\n\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCo-ordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n--- PDF PAGE 15 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n13\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may\nhave happened.\n2. Underpinning\nknowledge and\nattitude\n2.1.\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2.\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of\nfundamental cause, determining the corrective\naction and provision of recommendations\n2.2.1.\nRelevant equipment and operational\nprocesses\n2.2.2.\nEnterprise goals, targets and measures\n2.2.3.\nEnterprise quality, OHS and environmental\nrequirement\n2.2.4.\nPrinciples of decision making strategies\nand techniques\n2.2.5.\nEnterprise information systems and data\ncollation\n2.2.6.\nIndustry codes and standards\n3. Underpinning\nskills\n3.1.\nUsing range of formal problem solving techniques\n3.2.\nIdentifying and clarifying the nature of the problem\n3.3.\nDevising the best solution\n3.4.\nEvaluating the solution\n3.5.\nImplementation of a developed plan to rectify the\nproblem\n4. Resource\nimplications\n4.1.\nAssessment will require access to an operating\nplant over an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios /\ncase studies / what ifs will be required as well as\nbank of questions which will be used to probe the\nreason behind the observable action.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1. Case studies on solving problems in the workplace\n5.2. Observation\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n6. Context of\nassessment\n6.1.\nIn all workplace, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n\n--- PDF PAGE 16 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n14\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE : 500311113\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired in the application of mathematical concepts\nand techniques.\n\nELEMENT\nPerformance Criteria\nItalicized terms are elaborated in the Range of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given\ncondition\n1.2 Mathematical techniques are selected based\non the given problem\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on\nthe problem identified\n2.2 Mathematical computations are performed to the\nlevel of accuracy required for the problem\n2.3 Results of mathematical computation is\ndetermined and verified based on job\nrequirements\n3. Analyze results\n3.1 Result of application is reviewed based on\nexpected and required specifications and\noutcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 17 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical\ntechniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical techniques (e.g.\nrecalculation, re-modeling)\n2.2 Report error to immediate superior for proper action\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Underpinning\nknowledge and\nattitude\n2.1 Fundamental operation (addition, subtraction,\ndivision, multiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning skills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context of\nassessment\n6.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 18 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n16\nUNIT OF COMPETENCY: USE RELEVANT TECHNOLOGIES\n\nUNIT CODE : 500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills,\nand attitude required in selecting, sourcing and applying\nappropriate\nand\naffordable\ntechnologies\nin\nthe\nworkplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Study/select appropriate\ntechnology\n\n1.1 Usage of different technologies is determined\nbased on job requirements\n1.2 Appropriate technology is selected as per work\n specification\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable software and hardware are used as per\n task requirement\n2.3 Management concepts are observed and\npracticed as per established industry practices\n3. Maintain/enhance of\nrelevant technology\n3.1 Maintenance of technology is applied in\naccordance with the industry standard operating\nprocedure, manufacturer’s operating\nguidelines and occupational health and safety\nprocedure to ensure its operative ability\n3.2 Updating of technology is maintained through\ncontinuing education or training in accordance with\njob requirement\n3.3 Technology failure/ defect is immediately reported\nto the concern/responsible person or section for\nappropriate action\n\n--- PDF PAGE 19 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n17\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\ntechnology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance\nschedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 20 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n18\nEVIDENCE GUIDE\n\n2 1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nknowledge and\nattitude\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning\nskills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 21 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n19\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: APPLY APPROPRIATE SEALANT/ADHESIVE\n\nUNIT CODE: ALT723201\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes required in\nthe selection and application of sealant/adhesives.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify appropriate\nSealant/adhesive\n\n1.1Sealant/adhesive selected in line with job requirements\n and manufacturer’s specification\n1.1 Sealant/adhesive checking is performed to ensure that\nthe product is fit for use.\n2. Prepare surface for\nSealant/adhesive\n2.1 Surface materials are identified as per construction\n2.2 Surface is cleaned and free of moisture, dust and other\n foreign matters to ensure maximum adhesion or seal.\n3. Apply\nsealant/adhesive\n evenly\n3.1 Sealant/adhesive is applied evenly on the surface in line\n with manufacturer’s specification\n3.2 Excess sealant/adhesive is removed by sanding or\n scrapping\n3.3Tools and equipment used to apply sealant/adhesive\nare appropriate to job requirements\n3.4 Safety are observed and PPE are worn in accordance\nwith industry SOP\n3.5 Hazards associated with the use of sealant and\nadhesives are identified.\n4. Store/Dispose of\nsealant/adhesive\n4.1 Sealant/adhesive are stored as per prescribed\nprocedure\n4.2 Waste are disposed as per workshop standard\noperating procedures (SOP)\n\n--- PDF PAGE 22 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n20\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sealant/Adhesive\nMay include:\n1.1Form in Place Gasket (FIPG)\n1.2 Ribbon Sealer\n1.3Hametite\n1.4Silicon Body sealer\n1.5 Prestite for Auto and Auto Aircon\n2. Tools and equipment\nMay include:\n2.1 Putty knife\n2.2 Scraper\n2.3 Compressor\n2.4 Steel brush\n2.5 Paint brush\n2.6 Rubber hammer\n2.7 Hand tools\nPersonal protective equipment include:\n2.8 Gloves\n2.9 Apron\n2.10 Safety shoes\n2.11Goggles\n2.12Gas mask\n3. Safety\nMay include:\n3.1 Ventilation\n3.2 Handling of Flammable/Irritating substances\n3.3 Use of Personal Protective Equipment\n4. Hazards\nMay include:\n4.1 Fumes\n4.2 Skin irritation\n4.3 Burns\n5.Adhesive/Sealant\n checking\n\nMay include:\n5.1 Expiry date\n5.2 Free of contamination\n5.1 Cap/Covers\n5.2 Tightly closed\n5.3 Concentration\n\n--- PDF PAGE 23 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n21\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified appropriate sealant/adhesives\n1.2 Prepared surface for sealant/adhesive\n1.3 Applied sealant/adhesive\n1.4 Stored unused or disposed of used sealant/adhesive\n2. Required\nknowledge\n2.1 OH & S regulations\n2.2 Safe handling of sealant/adhesive\n2.3 Industry code of practice\n2.2 Procedures in sealant/adhesive application\n2.3 Procedures in interpreting manuals\n3. Required skills\n3.1 Handling sealant/adhesive\n3.2 Applying sealant/adhesive\n3.3.Sanding the surface\n3.4 Use of tools, equipment\n3.5 Mixing of body filler and epoxy base and hardener\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Appropriate tools and equipment\n4.3 Real or simulated workplace\n5. Method of\n assessment\n\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Interview related to:\n• Safe and correct use of tools and equipment\n• Application of adhesive/sealant\n6. Context of\nassessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment may be done in a workplace or in a\nsimulated environment\n\n--- PDF PAGE 24 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n22\nUNIT OF COMPETENCY: MOVE AND POSITION VEHICLE\n\nUNIT CODE: ALT723202\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitude needed to\nmove and position vehicle in a workshop.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare vehicle for\n driving\n1.2 Correct check-up procedures performed based on\n vehicle manufacturer’s standard\n2. Move and position\n vehicle\n2.1 Select vehicle to be moved or re-position.\n2.2 Drive the vehicle to appropriate location\n2.3 Park vehicle following parking safety techniques\nand procedure\n3. Check the vehicle\n3.1 Vehicle position is checked as per requirement\n3.2 Vehicle is checked for external damages\n\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n1. Check up procedure\nMay include:\n1.1 Oil level\n1.2 Brake fluid\n1.3 Clutch fluid\n1.4 Coolant level\n1.5 Battery (electrolyte)\n1.6 Tire pressure\n1.7 Position of driving gear\n1.8 Lighting and warning devices\n2. Vehicles\nMay include:\n2.1 Vehicles with automatic transmission\n2.2 Vehicles with manual transmission\n3.Parking safety\n techniques\nMay include:\n3.1 Engaging of Park brake\n3.2 Vehicle parking position\n3.3 Front wheel position\n\n--- PDF PAGE 25 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n23\nEVIDENCE GUIDE\n\n1.Critical aspects of\n competency\n\nAssessment requires evidence that the candidate:\n1.1 Prepared vehicle for driving.\n1.2 Moved and positioned vehicle\n1.3 Checked the vehicle.\n2. Required\n knowledge\n\n2.1 Driver’s Code of conduct\n2.2 Workshop signs and symbols\n2.3 Driving skills\n2.4Vehicle accessories for safe driving and parking\n3. Required skills\n3.1 Ability to handle vehicle/maneuver vehicle the easiest\nway\n3.2 Immediate response to accident\n3.3 Preparing vehicle for driving\n3.4 Parking Downhill, Uphill, Parallel\n3.5 Shifting Gears\n3.6 Maneuvering\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Driving range/area\n4.2 Appropriate vehicle for driving\nVehicle accessories\n5. Method of\n assessment\n\nCompetency in this unit may be assessed through:\n5.4 Observation with questioning\n5.5 Written or oral examination\n6. Context of\n assessment\n6.1 Assessment must be undertaken in accordance with the\n endorsed TESDA assessment guidelines\n6.3 Assessment of practical skills must be done in a\nworkplace or simulated environment.\n\n--- PDF PAGE 26 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n24\nUNIT OF COMPETENCY: PERFORM MENSURATION AND CALCULATION\n\nUNIT CODE: ALT311202\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in\nidentifying, caring, handling and using of measuring\ninstrument.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select measuring\n\n instruments\n1.1 Object or component to be measured is identified\n1.2 Correct specifications are obtained from relevant source\n1.3 Appropriate measuring instrument is selected according to\njob requirements\n2. Carry out\n measurements\n and calculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained in accordance with\njob requirements\n2.3 Calculation needed to complete work tasks are performed\n using the four fundamental operations of addition (+),\nsubtraction (-), multiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\n numbers are used to complete workplace tasks.\n2.5 Numerical computation is self-checked and corrected for\n accuracy\n2.5 Instruments are read to the limit of accuracy of the tool.\n4\nMaintain\nmeasuring\ninstruments\n4.1 Measuring instruments are kept free from corrosion\n4.2 Measuring instruments are not dropped to avoid damage\n4.3 Measuring instruments are cleaned before and after using.\n\n--- PDF PAGE 27 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMay include:\n1.1\nMultitester\n1.2\nMicrometer (In-out, depth)\n1.3\nVernier caliper (Out, inside)\n1.4\nDial Gauge with Mag. Std.\n1.5\nPlastigauge\n1.6\nStraight Edge\n1.7\nThickness gauge\n1.8\nTorque Gauge\n1.9\nSmall Hole gauge\n1.10 Telescopic Gauge\n1.11 Try square\n1.12 Protractor\n1.13 Combination gauge\n1.14 Steel rule\n2. Calculation\n\nMay include:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2. 10 Out of roundness\n2.11Oil clearance\n2.12 End play/thrust clearance\n\n--- PDF PAGE 28 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n26\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried out measurements and calculations.\n1.3 Maintained measuring instruments\n\n2. Required\nknowledge\n\n2.1 Types of Measuring instruments and their uses\n2.2 Safe handling procedures in using measuring instruments\n2.3 Four fundamental operation of mathematics\n2.4 Formula for Volume, Area, Perimeter and other geometric\nfigures\n\n3. Required\n skills\n\n3.1 Caring and Handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.1 Performing calculation by Addition, Subtraction,\nMultiplication and Division\n3.2 Visualizing objects and shapes\n3.3 Interpreting formula for volume, area, perimeter and other\ngeometric figures\n\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3 Instructional materials relevant to the propose activity\n\n5. Method of\n assessment\n\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4 Demonstration with questioning\n\n6. Context of\n assessment\n\n6.1 Competency elements must be assessed in a safe\nworking environment\n6.2 Assessment may be conducted in a workplace or\nsimulated environment\n\n--- PDF PAGE 29 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n27\nUNIT TITLE: READ, INTERPRET AND APPLY SPECIFICATION AND MANUALS.\n\nUNIT CODE: ALT723203\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying\nservice specification manuals, maintenance procedure\nmanuals and periodic maintenance manual.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\n manual/\n specification\n\n1.1 Appropriate manuals are identified and accessed as per\njob requirements.\n1.2 Version and date of manual are checked to ensure that\ncorrect specification and procedure are identified.\n\n2. Interpret manuals\n\n2.1 Relevant sections, chapters of manuals/specifications\nare located in relation to the work to be conducted\n2.2 Information and procedure in the manual are interpreted\nin accordance with industry practices\n\n3. Apply information\nin manual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data are applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n\n4. Store manuals\n\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\n\n May include:\n1.1 Manufacturer’s specification manual\n1.2 Repair manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 30 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n28\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n\n2. Required\nknowledge\n\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n\n3. Required skills\n\n3.1 Reading and comprehension skills required to identify\nand interpret automotive manuals and specifications\n3.2 Accessing information and data\n\n4. Resource\nimplication\n\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Job order, requisitions\n4.3 Actual vehicle or simulator\n\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6. Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or in\na simulated environment.\n\n--- PDF PAGE 31 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n29\nUNIT OF COMPETENCY: USE AND APPLY LUBRICANTS/COOLANTS\n\nUNIT CODE: ALT723204\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes required in\nselecting and applying different types of lubricants.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify types of\nlubricants/\ncoolants\n\n1.1 Correct information on lubrication schedule is\naccessed and interpreted from appropriate\nmanufacturers specifications manuals\n1.2 Type and quantity of lubricants/coolant are identified\nas per job requirements\n\n2. Use and apply\n lubricants/coolant\n\n2.1 Correct procedure for change of lubricant is identified\nfollowing manufacturer’s specification or manual\n2.2 Correct tools and equipment are selected and used in\nline with job requirements\n2.3 Existing lubricants are removed and replaced with\nspecified types and quantity of new materials in line with\nmanufacturer’s specification\n2.4 Safe procedure and use of PPE are observed when\nremoving or replacing lubricant\n2.5 Used lubricants are disposed in accordance with\n environmental guidelines\n2. 6 Work is checked in line with company SOP.\n\n3. Perform\nhousekeeping\nactivities\n\n3.1 Tools, equipment and materials are properly stored as\nper company SOP\n3.2 Workplace is free from waste materials\n\n--- PDF PAGE 32 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\nMay include:\n1.1 Manufacturer’s specification manual\n1.2 Periodic Maintenance manual\n1.3 Service Manual\n2.Lubricants/ Coolant\n\nMay include:\n2.1 Engine oil:\n•\nDiesel engine oil\n•\nGasoline engine oil\n2.2 Automatic Transmission Fluid\n•\nDestro II\n•\nT4\n2.3 Gear oil lubricants:\n•\nOil #90\n•\nOil #140\n•\nOil #30\n•\nOil #40\n2.4 Grease\n• Special (velocity joint)\n Molybdenum disolfate)\n• Ordinary\n• Multi-purpose oil\n• Contact point lubricant\n (grease)\n2.5 Brake/Clutch System\n•\nBrake fluid\n•\nDOT3\n\n2.6 Power Steering Fluid\n•\nHydraulic Fluid\n\n2.7 Radiator Coolant\n•\nLong last coolant\n\n2.8 A/C Compressor Oil\n•\nPag oil\n3. Lubricant\n Schedule\nMay include:\n3.1 Kilometers traveled/used\n3.2 No. of Hours used\n3.3 Monthly\n4. Tool and\n equipment\nMay include:\n4.4 Hand tools\n4.5 Oiler\n4.6 Oil Dispenser\n4.7 Grease gun\n5. Personal\nProtective\nEquipment (PPE)\n\nMay include:\n5.1 Apron\n5.2 Gloves\n5.3 Goggles\n5.4 Safety shoes\n\n--- PDF PAGE 33 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n31\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified types of lubricants and lubrication schedule.\n1.2 Used and applied lubricants.\n1.3 Performed housekeeping\n\n2. Required\nknowledge\n2.1 Types/Classification of Lubricants\n2.2 Identifying lubrication schedule\n2.3 Cause and Effects of Gear Oil Dilution\n2.4 Purpose of Lubrication (Problem and effects)\n2.5 Hazard associated with lubrication\n\n3. Required skills\n3.1 Handling of oils (Gear, oil, engine oil)\n3.2 Familiarization/Classification of Lubricants\n3.3 Lubrication Procedure\n\n4. Resource\nimplications\n\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Materials relevant to activity\n\n5. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written/Oral examination\n\n6. Context of\nassessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment must be undertaken in accordance with the\n endorsed industry assessment guidelines\n6.3 Assessment of underpinning knowledge and skills may be\n assessed on or off-the-job\n\n--- PDF PAGE 34 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n32\nUNIT OF COMPETENCY: PERFORM SHOP MAINTENANCE\n\nUNIT CODE: ALT723307\n\nUNIT DESCRIPTOR: This unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage of tools/\nequipment and disposal of used supplies/materials are also\nincorporated in this competency.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n\n1.1 Cleaning solvent used as per workshop/tools\n cleaning requirement\n\n1.2 Work area is checked and cleaned\n\n1.3 Wet surface/spot in work area is wiped and dried\n\n2. Store/arrange tools\nand shop equipment\n\n2.1 Tools/equipment are checked and stored in their\n respective shelves/location\n\n2.2 Corresponding labels are posted and visible\n\n2.3 Tools are safely secured and logged in the records\n\n3. Dispose wastes/used\nlubricants\n\n3.1 Containers for used lubricants are visibly labeled\n\n3.2 Wastes/used lubricants are disposed as per\n workshop SOP\n\n4. Report damaged\ntools/equipment\n\n4.1 Complete inventory of tools/equipment is maintained\n\n4.2 Damaged tools/equipment/facilities are identified and\n repair recommendation is given\n\n4.3 Reports prepared have no error/discrepancy\n\n--- PDF PAGE 35 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n33\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work Area\nMay include:\n1.1 Workshop areas for servicing/repairing light and/or heavy\nvehicle and/or plant transmissions and/or outdoor power\nequipment\n1.2 Open workshop/garage and enclosed, ventilated office\narea\n1.3 Other variables may include workshop with:\n• Mess hall\n• Wash room\n• Comfort room\n2. Cleaning\n requirement\nMay include:\n2.1 Cleaning solvent\n2.2 Inventory of supplies, tools, equipment, facilities\n2.3 List of mechanics/technicians\n2.4 Rags\n2.5 Broom\n2.6 Map\n2.7 Pail\n2.8 Used oil container\n2.9 Oiler\n2.10 Dust/waste bin\n3. Manuals\nMay include:\n3.1 Vehicle/plant manufacturer specifications\n3.2 Company operating procedures\n3.3 Industry/Workplace Codes of Practice\n3.4 Product manufacturer specifications\n3.5 Customer requirements\n3.6 Industry Occupational Health &Safety\n4. Company\nstandard\noperating\nprocedure\nMay include:\n4.1 Gloves\n4.2 Apron\n4.3 Goggles\n4.4 Safety shoes\n\n--- PDF PAGE 36 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n34\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1Cleaned workshop tools/facilities\n1.2Maintained equipment, tools and facilities\n1.3Disposed wastes and used lubricants/fluid as per required\n procedure\n2. Required\nknowledge\n2.1 5S or Total Quality Management (TQM)\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of Equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire Extinguishers and prevention\n2.9 Storage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\n Attention to Details)\n3. Required skills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of supplies/materials\n3.4 Preparing inventory of s/m and tools and equipment\n3.5 Monitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Written/Oral Questioning\n5.2 Demonstration\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or in a\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 37 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n35\nUNIT OF COMPETENCY: PREPARE JOB ESTIMATE/COSTING\n\nCODE: ALT311204\n\nUNIT DESCRIPTOR: This competency unit covers the knowledge, skills and\n attitude in estimating/costing automotive repair.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify\nnature/scope of\nwork\n\n1.1 Effective communication skills are applied to determine the\nnature and scope of work to be undertaken\n1.2 Extent of service to be rendered is determined and\ndocumented in line with standard operating procedures\n(SOP)\n\n2. Prepare and\npresent estimate\n\n2.1 Type and quantity of supplies, materials and labor required\nto perform work are identified in line with job requirements\n2.2 Cost of supplies, materials are obtained from suppliers\n2.3 Total cost of required services is calculated in line with\nSOP\n2.4 Estimate is presented to customer in line with SOP.\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Communication\nMay include:\n1.1 Listening to customer\n1.2 Speaking with suppliers, customers and co-\nworkers\n1.3 Questioning\n\n2. Suppliers\nMay include:\n2.1 Distributors\n2.2 Managers\n2.3Proprietors\n\n3. Cost\nMay include:\n3.1 Materials\n3.2 Labor\n3.3Overhead\n\n--- PDF PAGE 38 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n36\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n Assessment requires evidence that the candidate\n1.1 Identified nature/scope of work\n1.2 Prepared and presented estimate\n\n2. Required\nknowledge\n\n2.1 Consumer mathematics\n2.2 Replaceable/Fabricated Materials or Spare parts in\n a vehicle\n2.3 Automotive Repair Procedures and Techniques\n2.4 Job estimates\n2.5 Honesty, Perseverance, Patience, Attention to Details\n\n3. Required\nskills\n\n3.1 Computing using the Four Mathematical Operations\n3.2 Estimating repair works and activities\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Appropriate tools such as calculator, paper, pen, and\nother measuring instruments relevant to activity\n5. Method of\n assessment\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Presentation of Finished drawing\n\n6. Context of\nassessment\n\n6.1 Competency must be assessed in a room or any\n simulated places\n6.2 Assessment must be given according to industry standard\n\n--- PDF PAGE 39 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n37\nUNIT OF COMPETENCY: INTERPRET/DRAW TECHNICAL DRAWING\n\nCODE: ALT311205\n\nUNIT DESCRIPTOR:\nThis unit identifies the competencies required to\ndraw/interpret basic trade drawing\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Interpret technical\n drawing\n1.1 Components, assemblies or objects are recognized as\nrequired\n1.2 Dimensions are identified as appropriate to the field of\nemployment\n1.3 Instructions are identified and followed as required\n1.4 Material and other consumable requirements are\nidentified as required\n1.5 Symbols are recognized as appropriate in drawing\n2. Select correct\ntechnical drawing\n\n2.1 Drawing is checked and validated against job\nrequirements or equipment\n2.2 Drawing version is checked and validated according to the\nManual\n3. Apply freehand\nsketching\n3.1 Correct freehand sketching is produced using the\nnecessary tools and materials\n\n--- PDF PAGE 40 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n38\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Drawing\nMay include:\n1.1 Drawing symbols\n1.2 Alphabet of lines\n1.3 Orthographic views\n1.3.1\nFront view\n1.3.2\nRight side view/left side view\n1.3.3\nTop view\n1.3.4\nPictorial\n1.4 Schematic diagram\n2. Manual\nMay include:\n2.1 technical drawing manual\n2.2 manufacturers schematic diagram\n3. Consumables\nMay include:\n3.1 drawing plate\n3.2 pencil and eraser\n3.3 scotch tape\n4. Tools and\n materials\nMay include:\n4.1 compass\n4.2 divider\n4.3 rulers\n4.4 triangles\n4.5 drawing tables\n4.6 computer\n\n--- PDF PAGE 41 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n39\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Interpreted technical drawing\n1.2 Selected correct technical drawing\n1.3 Applied freehand sketching\n2. Required\nknowledge\n2.1 Drawing standard symbols\n2.2 Safe handling of tools and consumables\n2.3 Identification of types of drawing\n2.4 Patience, Perseverance, Attention to Details\n3. Required skills\n3.1 Draw/interpret orthographic drawing\n3.2 Handling of drawing instruments\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Drawing room\n4.2 Appropriate tools\n4.3 Materials relevant to activity\n5. Method of\n assessment\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Written/Oral examination\n5.3 Presentation of Finished drawing\n6. Context of\nassessment\n6.1 Must be assessed in a drawing room or in any simulated\nplaces\n6.2 Assessment must be given according to industry\n standard\n\n--- PDF PAGE 42 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n40\n\nUNIT OF MPETENCY: PRACTICE HEALTH, SAFETY AND ENVIRONMENT\nPROCEDURES\nUNIT CODE : ALT723206\nUNIT DESCRIPTOR : This unit of competency incorporates the work safe regional\nguidelines and encompasses competencies necessary to\napply basic safety and emergency procedures to maintain a\nsafe workplace for staff, customers and others.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Apply basic safety\nprocedures\n1.1.\nPolicies and procedures to achieve a safe working\nenvironment are followed and maintained in line with\noccupational health and safety (OHS) procedures\nand according to worksite policy\n1.2.\nAll unsafe situations are recognized and reported\naccording to worksite policy\n1.3.\nAll breakdowns in relation to machinery and\nequipment are reported to supervisor or nominated\npersons\n1.4.\nFire and safety hazards are identified and\nprecautions are taken or reported according to\nworksite policy and procedures\n1.5.\nDangerous goods and substances are identified,\nhandled and stored according to worksite policy and\nprocedures and OHS requirements\n1.6.\nWorksite policy regarding manual handling practice is\nfollowed\n1.7.\nParticipation in consultative arrangements\nestablished by company for OHS is exercised\n2. Apply emergency\nprocedures\n2.1.\nWorksite policies and emergency procedures\nregarding illness or accidents are identified and\napplied\n2.2.\nSafety alarms are identified\n2.3.\nQualified persons are contacted in the event of\naccident or sickness of customers or staff and\naccident details are documented according to\nworksite accident/ injury procedures\n2.4.\n Worksite evacuation procedures are identified and\napplied\n\n--- PDF PAGE 43 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Policies and\nprocedures\nMay include:\n1.1.\nHazard policies and procedures\n1.2.\nEmergency, fire and accident procedures\n1.3.\nPersonal safety procedures\n1.4.\nProcedures for the use of personal protective clothing\nand equipment\n1.5.\nUse of motor vehicles\n1.6.\nResolution procedures\n1.7.\nJob procedures\n1.8.\nWork instructions\n2. OHS procedures\nMay include:\n2.1.\nSafe manual handling and lifting customers, staff,\nequipment/tooling, premises and stock\n3. Hazards\nMay include:\n3.1.\nSharp cutting tooling and instruments\n3.2.\nElectricity and water\n3.3.\nToxic substances\n3.4.\nDamaged packing material or containers\n3.5.\nBroken or damaged equipment\n3.6.\nFlammable materials and fire hazards\n3.7.\nLifting practices\n3.8.\nSpillages, waste and debris especially on floors,\nladders, trolleys and glue guns/burns\n\n4. Emergency\nprocedures\nMay include:\n4.1.\nSickness\n4.2.\nAccident\n4.3.\nFire or store evacuation involving staff or customers\n\n--- PDF PAGE 44 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n42\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate has:\n1.1\nCommunicated effectively with others involved in or\naffected by the work\n1.2\nIdentified and assessed hazardous situations and\nrectified, or reported to the relevant persons\n1.3\nOperated fire-fighting equipment\n1.4\nHandled safely and stored dangerous and/or\nhazardous goods and substances\n1.5\nApplied safe manual handling practices\n1.6\nOperated safely and effectively equipment and\nutilized materials over the full range of functions\n1.7\nFollowed worksite evacuation procedures.\n2. Required knowledge\nGeneral knowledge of:\n2.1\nThe implications of OHS on efficiency, morale and\ncustomer relations\n2.2\nCommon automotive terminology\n2.3\nOHS regulations/requirements, equipment, material\nand personal safety requirements\n2.4\nSafe manual handling theories and practices\n2.5\nThe selection and application of fire-fighting\nequipment\n2.6\nDangerous goods and hazardous chemicals handling\nprocesses\n2.7\nWorksite reporting procedures\n3. Required Skills\n3.1.\nCollect, organize and understand information related\nto recognizing and reporting situations\n3.2.\nCommunicate ideas and information to reporting\nprocedures (verbal and written)\n3.3.\nPlan and organize activities which implement and\nfollow standard procedures\n3.4.\nWork with others and in a team by assisting and\ncooperating with team members\n3.5.\nUse mathematical ideas and techniques to document\nand report numbers for emergency procedures\n3.6.\nEstablish diagnostic processes which recommend\nimprovements for OHS issues\n3.7.\nUse workplace technology related to the use of\ntechnology to assist with safe work practices\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1.\nA workplace or simulated workplace\n4.2.\nSituations requiring safe working practices\n4.3.\nWorksite or equivalent instructions on safe working\npractice\n4.4.\nHazardous chemicals and/or dangerous goods\ninformation\n4.5.\nMaterials, tooling and equipment\n4.6.\nFirefighting appliances and fire test facilities\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 45 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n43\nUNIT OF COMPETENCY: INSPECT TECHNICAL QUALITY OF WORK\nUNIT CODE : ALT311207\nUNIT DESCRIPTOR : . This unit covers the competence to inspect work done\nby\n other staff, apply quality standards to work, and protect\n customer property and interests.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Gather information to\n carry out inspection\n1.1 OH&S requirements, including company\nregulatory requirements and personal protection\nneeds are observed throughout the work\n1.2 Pertinent information are sourced\n1.3 Different methods are analyzed and those most\nappropriate to the circumstances are selected\nand prepared\n1.4 Technical and/or calibration requirements for\ninspection are sourced and needed equipment is\nidentified and prepared\n2. Inspect and apply quality\nstandards to work\n2.1 Work is identified and confirmed for inspection in\n accordance with company quality procedures\n2.2 Quality Inspections are conducted throughout\nthe course of the work to ensure quality\nstandards are maintained\n2.3 Quality standards are applied during work\ncompletion to ensure the treatment of customer\nproperty meets industry and / or company\nstandards\n2.4 Activities are coordinated throughout the\nworkplace in accordance with company\nprocedures\n2.5 Documents of work quality are maintained\naccording to company requirements\n3. Achieve quality work\n outcomes\n\n3.1 Damage to customer property is avoided\nthrough ensuring staff adherence to quality\nprocedures and use of protective materials at all\nstages of the repair or service\n3.2 Communication pertaining to quality\nimprovements and recommendations are to be\ndone in accordance with company requirements\n\n--- PDF PAGE 46 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n44\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. OH&S Requirements\nMay include:\n 1.1 Safety equipment\n1.2 Personal protective equipment and clothing\n1.3 First aid equipment\n1.4 Hazard and risk control\n1.5 Elimination of hazardous materials and\nsubstances manual handling, including shifting,\nlifting and carrying\n1.6 Emergency procedures\n1.4 Road rules and safe driving policy\n2. Information\nMay include:\n 2.1 Manufacturer / component supplier\nspecifications\n2.2 Company operating procedures\n2.3 Supplier directories\n2.4 Parts catalogues\n2.5 Customer orders\n2.6 Service manual\n2.7 Material safety data sheets\n3. Quality Procedures\nMay include:\n3.1 Worksite quality system documentation\n3.2 Work instructions\n3.3 Safe work procedures\n3.4 Product specifications\n3.5 Equipment maintenance schedules\n3.6 Technical procedures\n3.7 Adopted or specifically prepared standards\n4. Quality Inspections\nMay include:\n4.1 Periodic inspection during the job or\nobservation at completion of the job to ensure\nall ordered parts have been fitted, components\nused meet manufacturer / component supplier\nspecifications, invoicing complies with service /\nrepair / parts order and contains sufficient\ndetails of labor and / or components used\n4.2 Reported and diagnosed problems have been\nconfirmed as rectified thru test procedures and\npresentation of the vehicle or equipment after\nservice / repair meets manufacturer and\n Company standards\n5. Communication\nMay include:\n5.1 Verbal\n5.2 Written\n5.3 Telephone or Electronic means\n\n--- PDF PAGE 47 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n45\nEVIDENCE GUIDE\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Observed safety procedures and requirements\n1.2 Communicated effectively with others involved in or\n affected by the work\n1.3 Applied OH&S policies and procedures\n1.4 Identified quality procedures\n1.5 Inspected work undertaken by others\n1.5 Applied quality standards to work\n2. Required\nknowledge\nA working knowledge of:\n2.1 Quality systems in a workplace\n2.2 Common automotive terminology\n2.3 Vehicle safety requirements\n2.4 Work planning processes\n2.5 OH&S regulations/requirements, equipment, material\n and personal safety requirements\n2.6 Company quality systems and procedures\n2.7 Worksite environmental control measures\n2.8 Worksite reporting procedures\n3. Required skills\n3.1 Communicating ideas and information\n3.2 Collecting, analyzing and organizing information\n3.3 Planning and organizing activities\n3.4 Working with others and in a team\n3.5 Using mathematical ideas and techniques\n3.6 Solving problems\n3.7 Using technology\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 A workplace or simulated workplace\n4.2 Situations requiring inspections of technical quality\n4.3 Computer hardware and software, access to\nelectronic communication\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1\nDirect Observation\n5.2\nOral interview\n5.3\nWritten Evaluation\n5.4\nThird Party Report\n6. Context of\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 48 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n46\nUNIT OF COMPETENCY: MAINTAIN QUALITY SYSTEMS\nUNIT CODE : ALT311208\nUNIT DESCRIPTOR : This unit of competency covers the competence to\nconduct the final quality check on completed work or\norders, report on the quality of processes and work\noutcomes, and implement improvements to work\nprocesses.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Conduct final quality\ncheck on completed\nwork / orders\n\n1.1. Completed work / orders are checked for\ncompliance with supplier, company or customer\nspecifications\n1.2. Level of inspection conducted is appropriate to\nthe size and importance of the job\n1.3. Documentation is authorized in accordance with\ncompany requirements\n1.4. Feedback is provided to staff on the quality of\ntheir work with equal emphasis on strengths and\nweaknesses and opportunities for development\n2. Report on the quality of\nprocesses and work\noutcomes\n\n2.1. Documents are kept according to company\nquality procedures on outcomes of quality\nchecks\n2.2. Quality problems are identified according to\ncompany performance indicators\n2.3. Information relating to the quality of processes\nand work outcomes is provided to appropriate\npersons on a regular basis\n3. Implement\nimprovements to work\nprocesses\n\n3.1. Staff input is encouraged to generate possible\nsolutions to quality problems\n3.2. Options for solving quality problems are\ngenerated and the costs and benefits of each\noption are evaluated\n3.3. Recommended solutions to quality problems are\ndiscussed with management\n3.4. Improvements to work processes are\nimplemented according to company policies and\nprocedures\n\n--- PDF PAGE 49 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n47\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Quality procedures\nMay include:\n1.1 Company quality system documentation\n1.2 Work instructions\n1.3 Safe work procedures\n1.4 Product specifications\n1.5 Equipment maintenance schedules\n1.6 Technical procedures and adopted or\nspecifically prepared standards\n2. Performance indicators\n\nMay include:\n• account for issues of time, quantity, quality and\ncost factors and may include establishing time\ntargets for own work, identifying reasonable\ncriteria for evaluating own work outcomes,\nidentifying measures to avoid wastage,\nidentifying reasonable criteria to judge internal\nand/or external customer satisfaction\n3. Quality problems\n\nMay include:\n3.1 Misdiagnosed faults\n3.2 Jobs requiring rework\n3.3 Jobs which do not meet customer\nrequirements\n3.4 Repairs which do not fix the problem within the\nallocated timeframe\n4. Communication\n\nMay include:\n4.1 Verbal\n4.2 Written\n4.3 Telephone or other means\n5. Information/documents\n\nMay include:\n5.1 Vehicle manufacturer practices\n5.2 Company operating procedures\n5.3 Supplier directories\n5.4 Parts catalogues\n5.5 Customer orders and industry/workplace\ncodes of practice\n5.6 Material safety data sheets (MSDS)\n\n--- PDF PAGE 50 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n48\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Communicated effectively with others involved in or\naffected by the work\n1.2 Identified quality system procedures and needs\n1.3 Identified performance indicators\n1.4 Conducted final quality checks on completed work\norders\n1.5 Reported on the quality of processes and work\noutcomes\n1.6 Monitored and adjusted performance indicators to\nmeet changing circumstances\n1.7 Processed and implemented recommendations for\nchange\n2. Required\nknowledge\nCompetency includes sufficient knowledge to:\n\nKnowledge of:\n• quality systems and application techniques in a work\nenvironment\n• typical loss and damage control systems\n• work planning and organization processes\n• occupational health and safety (OHS)\nregulations/requirements, equipment, material and\npersonal safety requirements at the worksite\n• enterprise quality systems and procedures\n• worksite information management systems\n\n3. Required skills\nRequired skills include the ability to:\n3.1 Research and interpretive skills to locate, interpret and\napply quality audit policies and procedures\n3.2 Investigative and analytical skills required for\nidentification and analysis of quality breaches,\nincidents or risks, and identification of quality related\ntraining needs\n3.3 English literacy and communication skills in relation to\ndealing with customers and team members on\nworksite quality audit issues\n3.4 Questioning and active listening skills\n3.5 Written communication skills sufficient to prepare\nreports, document investigations and maintain\nworksite quality documents\n3.6 Plan and organize activities for leadership skills\nrequired in organizing, implementing and promoting\nworksite quality systems and measures\n\n3.7 Work with others and in a team by seeking advice and\nassistance from team members\n\n--- PDF PAGE 51 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n49\n3.8 Use mathematical ideas and techniques to document\nquantities and company sampling procedures\n3.9 Establish diagnostic processes which analyze\nproblems and recommend solutions\n3.10 Use the workplace technology related to document\nand analyze quality problems\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 A workplace or simulated workplace\n4.2 Situations requiring worksite quality systems\nmaintenance\n4.3 Worksite quality policies and procedures\n4.4 Worksite quality documents system\n4.5 Materials, tooling and equipment\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct Observation\n5.2 Oral interview\n5.3 Written Evaluation\n5.4 Third Party Report\n6. Context of\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 52 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n50\nUNIT OF COMPETENCY: PROVIDE WORK SKILL INSTRUCTION\nUNIT CODE : ALT311209\nUNIT DESCRIPTOR : This unit describes the performance outcomes, skills\nand knowledge required to conduct individual and group\ninstruction and demonstrate work skills, using existing\nlearning resources in a safe and comfortable learning\nenvironment. The unit also covers the skills and\nknowledge required to determine the success of both\nthe training provided and one's own personal training\nperformance. It emphasizes the training as being driven\nby the work process and context.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Organize instruction\nand demonstration\n\n1.1 Gather information about learner characteristics\nand learning needs\n1.2 Confirm a safe learning environment\n1.3 Gather and check instruction and demonstration\nobjectives and seek assistance if required\n1.4 Access and review relevant learning resources and\nlearning materials for suitability and relevance, and\nseek assistance to interpret the contextual application\n1.5 Organize access to necessary equipment or physical\nresources required for instruction and demonstration\n1.6. Notify learners of details regarding the\nimplementation of the learning program and/or\ndelivery plan\n2. Conduct instruction\nand demonstration\n\n2.1 Use interpersonal skills with learners to establish a\nsafe and comfortable learning environment\n2.2 Follow the learning program and/or delivery plan to\ncover all learning objectives\n2.3 Brief learners on any OHS procedures and\nrequirements prior to and during training\n2.4 Use delivery techniques to structure, pace and\nenhance learning\n2.5 Apply coaching techniques to assist learning\n2.6 Use communication skills to provide information,\ninstruct learners and demonstrate relevant work skills\n2.7 Provide opportunities for practice during instruction\nand through work activities\n2.8 Provide and discuss feedback on learner\nperformance to support learning\n3. Check training\nperformance\n\n3.1 Use measures to ensure learners are acquiring and\ncan use new technical and generic skills and\nknowledge\n3.2 Monitor learner progress and outcomes in\nconsultation with learner\n3.3 Review relationship between the trainer/coach and\nthe learner and adjust to suit learner needs\n4. Review personal\ntraining\nperformance and\nfinalize\ndocumentation\n4.1 Reflect upon personal performance in providing\ninstruction and demonstration, and document\nstrategies for improvement\n4.2 Maintain, store and secure learner records according\nto organizational and legal requirements\n\n--- PDF PAGE 53 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n51\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Learner Characteristics\nMay include:\n1.1 Language, literacy and numeracy levels\n1.2 Learning styles\n1.3 Past learning and work experiences\n1.4 Specific needs\n1.5 Workplace culture\n2. Safe Learning\nEnvironment\nMay include:\n2.1 Exit requirements\n2.2 Personal protective equipment\n2.3 Safe access\n2.4 Safe use of equipment\n3. Instruction and\ndemonstration objectives\nMay include:\n3.1 Competencies to be achieved\n3.2 Generic and technical skills, which may be\n provided by the organization, developed by a\ncolleague and individual or group objectives\n3.3 Learning outcomes.\n4. Learning resources\nMay include:\n4.1 Learner and user guides\n4.2 Trainer and Facilitator guides\n4.3 Example training programs\n4.4 Specific case studies\n4.5 Professional development materials\n4.6 Assessment materials\n4.7 A variety of formats produced locally or\nacquired from other sources\n5. Learning materials\nMay include:\n5.1 Handouts for learners\n5.2 Materials sourced from the workplace, like\nworkplace documentation, operating\nprocedures, and specifications\n6. Details\n\nMay include:\n6.1 Location and time\n6.2 Outcomes of instruction or demonstration\n6.3 Reason for instruction or demonstration\n6.4 Who will be attending instruction session\n\n--- PDF PAGE 54 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n52\n\nVARIABLE\nRANGE\n7. OHS procedures\n\nMay include:\n7.1 Emergency procedures\n7.2 Hazards and their means of control\n7.3 Incident reporting\n7.4 Use of personal protective equipment\n7.5 Safe work practices\n7.6 Safety briefings\n7.7 Site-specific safety rules\n8. Delivery techniques\n\nMay include:\n8.1 Coaching\n8.2 Demonstration\n8.3 Explanation\n8.4 Group or pair work providing opportunities to\npractice skills and solve problems\n8.5 Questions and answers\n9. Coaching\n\nMay include:\n9.1 Learning arrangements requiring immediate\ninteraction and feedback\n9.2 On-the-job instruction and 'buddy' systems\n9.3 Relationships targeting enhanced performance\n9.4 Short-term learning arrangements\n9.5 Working on a one-to-one basis.\n10. Measures\n\nMay include:\n10.1 Informal review or discussion\n10.2 Learner survey\n10.3 On-the-job observation\n10.4 Review of peer coaching arrangements.\n\n--- PDF PAGE 55 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n53\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n1.1 Carried out a minimum of three training sessions,\ninvolving demonstrating and instructing particular work\nskills for different groups; with each session\naddressing:\n 1.1.1 Different learning objectives\n 1.1.2 A range of techniques and effective\ncommunication skills appropriate to the audience\n2. Required\nknowledge\n2.1 Learner characteristics and needs\n2.2 Content and requirements of the relevant learning\nprogram and/or delivery plan\n2.3 Sources and availability of relevant learning resources\nand learning materials\n2.4 Content of learning resources and learning materials\n2.5 Training techniques that enhance learning and when\nto use them\n2.6 Introductory knowledge of learning principles and\nlearning styles\n2.7 Key OHS issues in the learning environment,\nincluding:\n• roles and responsibilities of key personnel\n• responsibilities of learners\n• relevant policies and procedures, including hazard\nidentification, risk assessment, reporting\nrequirements, safe use of equipment and\nemergency procedures\n• risk controls for the specific learning environment\n3. Required skills\n3.1 Non-verbal communication techniques, such as:\n• asking relevant and appropriate questions\n• providing explanations\n• demonstrating\n• using listening skills\n• providing information clearly\n3.1 Safety skills to implement OHS requirements, by\nacting and responding safely in order to:\n• identify hazards\n• conduct prestart-up checks if required\n• observe and interpret learner behaviour that may\nput people at risk\n3.2 Time-management, skills to:\n• ensure all learning objectives are covered\n• pace learning\n3.3 Reflection skills in order to:\n• identify areas for improvement\n• maintain personal skill development\n\n--- PDF PAGE 56 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n54\n3.4 Literacy skills to:\n• complete and maintain documentation\n• read and follow learning programs and plans\n• read and analyze learner information\n3.6 Technology skills to operate audio-visual and\ntechnical equipment\n3.7 Interpersonal skills to:\n• engage, motivate and connect with learners\n• provide constructive feedback\n• maintain appropriate relationships\n• establish trust\n• use appropriate body language\n• maintain humor\n• demonstrate tolerance\n• manage a group\n• recognize and be sensitive to individual difference\nand diversity\n3.8 Observation skills to:\n• monitor learner acquisition of new skills, knowledge\nand competency requirements\n• assess learner communication and skills in\ninteracting with others\n• identify learner concerns\n• recognize learner readiness to take on new skills\nand tasks\n4. Resource\nimplications\nThe following resources should be provided:\n\nEvidence must be gathered in the workplace wherever\npossible. Where no workplace is available, a simulated\nworkplace must be provided\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct Observation\n5.2 Oral interview\n5.3 Written Evaluation\n5.4 Third Party Report\n\n6. Context of\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 57 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n55\nUNIT OF COMPETENCY: IDENTIFY AND SELECT ORIGINAL AUTOMOTIVE\nPARTS AND PRODUCTS\nUNIT CODE : ALT723210\nUNIT DESCRIPTOR : This unit of competency covers the competence\nrequired to identify original automotive parts and\nproducts based on evidence from customers and/or\nother sources which may include catalogue numbers or\nsamples of parts/products or their purpose.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the part/product\nand its end use\n1.1 Available part/product information is gathered,\ndocumented and confirmed with customer\n1.2 Information gathering techniques is\nestablished for proper identification of\npart/product\n1.3 End user or host for the part/product, i.e.\nvehicle/unit assembly or vehicle/unit assembly\noptions, is established from an analysis of\navailable information\n2. Identify details of the\npart/product\n2.1 The parts/product cataloguing system is\nidentified and accessed\n2.2 Part/product is matched accurately with\ncataloguing information by accessing and using\nthe catalogue system\n2.3 Details of identity of the part/product are\ndocumented and processed\n3. Part/product is supplied\nor ordered for customer\n\n3.1 Customer accepts process used\n3.2 Part/product is supplied or ordered if not\navailable\n3.3 Customer records are updated\n\n--- PDF PAGE 58 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n56\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Part/product information\nMay include:\n1.1 Manufacturer/component supplier\nspecifications and technical documentation\n1.2 Company procedures and documentation\n1.3 Company or industry specifications, diagrams,\nsketches\n1.4 Verbal descriptions and physical and visual\nevidence\n2. Information gathering\ntechniques\n\nMay include:\n2.1 Common vehicle/unit model\n2.2 Date of manufacture\n2.3 Purpose and appearance of product and other\ntracking information\n3. Parts/products\ncataloguing systems\n\nMay include:\n3.1 Hard-copy (book-fast, loose-leaf)\n3.2 Stand-alone computer or networked/online\ncomputer-supported services\n\n--- PDF PAGE 59 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n57\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Elicited sufficient information from the customer and/or\nother sources to enable a confirmed identification of\nvehicle or unit the part/product intended\n1.2 Accessed the parts/products catalogue systems\nassociated with required vehicle/unit\n1.3 Used both manual and computer-based\nparts/products catalogues and equivalent\ndocumentation to trace and identify common specific\nbrand parts/products\n1.4 Communicated effectively with others involved in or\naffected by the work.\n2. Required\nknowledge\nCompetency includes sufficient knowledge to:\n2.1 Structural of computer workstations\n2.2 Common automotive terminology\n2.3 Main automotive systems and assemblies and their\nfunctions\n2.4 Parts/product catalogue systems, both brand-specific\nand general options\n2.5 Legal issues associated with the supply and use of\nnon-conforming parts/components/accessories\n2.6 Company quality system\n2.7 Work organization and planning processes\n3. Required skills\nRequired skills include the ability to:\n3.1 Apply research and interpretive skills sufficient to\nlocate, interpret and apply manufacturer/component\nsupplier procedures, workplace policies and\nprocedures\n3.2 Apply analytical skills required for identification and\nanalysis of technical information\n3.3 Apply plain English literacy and communication skills\nin relation to dealing with customer and team members\n3.4 Apply questioning and active listening skills\n3.5 Apply oral communication skills sufficient to convey\ninformation and concepts to customers\n3.6 Apply planning and organizing skills to own work\nactivities, including making good use of time and\nresources, sorting out priorities and monitoring own\nperformance\n3.7 Use mathematical ideas and techniques to correctly\ncalculate material requirements, estimate and\ncalculate costs and establish quality checks\n3.8 Use workplace technology related to customer\nservices, including use of measuring equipment,\ncomputerized technology, use of communication\ndevices and reporting/ documenting of results\n\n--- PDF PAGE 60 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n58\n\n4 Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace location or simulated workplace\n4.2 Information and material identifying and selecting\nautomotive parts and products\n4.3 Equipment identifying and selecting automotive parts\nand products\n4.4 Activities covering task requirements\n4.5 Specifications and work instructions.\n5 Method of\nassessment\nCompetency in the unit may be assessed through:\n5.1 Direct Observation\n5.2\nOral interview\n5.3\nWritten Evaluation\n5.4\nThird Party Report\n6 Context of\nassessment\n6.1\nCompetency may be assessed individually in the\nactual workplace or simulation environment in\nTESDA accredited institutions\n\n--- PDF PAGE 61 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n59\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nTEST AND REPAIR ELECTRICAL SECURITY\nSYSTEM/COMPONENTS\n\nUNIT CODE\n:\nALT 723316\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competence required to carry out\ninstallation, testing and repair of automotive electrical\nsecurity systems and components.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(All standard of performance for Install, Test and Repair Electrical\nSecurity System/Components is in accordance with company\nstandard operating procedure and manufacturer’s specification\nManuals using specified tools and equipment)\n1. Install electrical\nsecurity system/\ncomponents.\n\n1.1\nInstallation is completed without causing damage to\nany workplace property or vehicle.\n1.2\nCorrect information is accessed and interpreted\n1.3\nAppropriate fittings/materials are selected.\n1.4\nElectrical security systems/components are installed\nand wired.\n2. Test anti-theft\nsystem\n2.1 Tests are completed without causing damage to any\nworkplace property or vehicle.\n2.2 Correct information is accessed and interpreted.\n2.3 Tests are carried out to determine faults.\n2.4 Faults are identified and preferred repair action\ndetermined.\n3. Repair electrical\nsecurity systems/\ncomponents.\n3.1\nElectrical security systems/ components are repaired\nwithout causing damage to any workplace property or\nvehicle.\n3.2\nCorrect information is accessed and interpreted.\n3.3\nNecessary repairs, component replacement and\nadjustment are carried out.\n\n--- PDF PAGE 62 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n60\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Electrical Security\nSystem Components\nMay include:\n1.1\nCar alarm\n1.2\nPower window\n1.3\nPower lock\n2. Manuals\nMay include:\n2.1\nManufacturer Specification Manual\n2.2\nMaintenance Procedure Manual\n2.3\nPeriodic Maintenance Data\n2.4\nService Manual\n2.5\nParts Checklist\n3. Company Standard\nOperating Procedure\nMay include:\n3.1\nJob Order\n3.2\nRequisition slip\n3.3\nWearing of Personal Protective Equipment such as\n• Apron\n• Goggles\n• Safety shoes\n• Gloves\n4. Tools and equipment\nMay include:\n4.1\nMultimeter, test lamps, soldering gun\n4.2\nPower tools, air tools, special tools for removal\nadjustment\n\n--- PDF PAGE 63 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n61\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nInstalled electrical security system/components\n1.2\nTest anti-theft system\n1.3\nRepair electrical security systems/components\n2. Required knowledge\n2.1\nOH&S regulations\n2.2\nElectrical principles\n2.3\nOhms law\n2.3\nElectrical Wiring codes\n2.4\nElectrical measuring and testing procedures\n2.5\nVehicle safety requirements\n2.6\nProcedures to avoid damage to ECUs\n2.7\nPositive Work Values (Patience, Perseverance,\nHonesty, etc.)\n2.8 Quality procedures, e.g., 5S\n2.9 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1\nRemoving/Installing electrical devices\n3.2\nReading/Interpreting schematic diagrams\n3.3\nUsing Testing Equipment\n3.4\nUsing Mathematical Ideas and Techniques\n3.5\nSolving Problems\n3.6\nRepairing procedures\n3.7\nSoldering\n4. Resource implications\nThe following resources should be provided:\n4.1\nWorkplace: Real or simulated work area\n4.2\nAppropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation or Demonstration with Questioning\n5.2 Portfolio\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a\nsimulated environment.\n6.2\nThe assessment of practical skills must take place\nafter a period of supervised practice and repetitive\nexperience.\n\n--- PDF PAGE 64 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n62\nUNIT OF COMPETENCY :\nSERVICE ELECTRONIC ENGINE\n\nMANAGEMENT SYSTEMS\n\nUNIT CODE\n:\n\nALT 723317\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to service/repair electronic fuel injection and\nelectronic engine management systems and/or\nassociated components. Engine management\nsystems are systems where the ECU incorporates\ncontrol over the fuel injection and ignition systems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(Note: All standard of performance for Service Electronic Engine\nManagement Systems is in accordance with company standard operating\nprocedure and manufacturer’s specification manuals using specified tools\nand equipment.)\n1. Check electronic\nengine management\nsystems and/or\nassociated\ncomponents.\n\n1.1 Checking is completed without causing damage to any\nworkplace property or vehicle.\n1.2 Correct information is accessed and interpreted from\nappropriate manufacturer specifications.\n1.3 Tests on electronic fuel injection and electronic engine\nmanagement systems are carried out to determine faults\n1.4 Appropriate servicing procedure is recommended.\n2. Service electronic\nengine management\nsystems and/or\nassociated\ncomponents.\n\n2.1 Service is completed without causing damage to any\nworkplace property or vehicle.\n2.2 Correct information is accessed and interpreted from\nappropriate manufacturer specifications.\n2.3 Necessary service and repairs, component replacement\nand adjustments are carried out using appropriate tools,\ntechniques and materials.\n2.4 Tests on electronic fuel injection and engine management\nsystems are carried out to determine faults are corrected\n\n--- PDF PAGE 65 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n63\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Electronic Engine\nManagement\nSystems\nMay include:\n1.1 Electronic fuel injection and electronic engine\nmanagement systems fitted light vehicles outdoor\npower equipment. (Engine management systems are\nsystems where the ECU incorporates control over the\nfuel injection and ignition systems.)\nSpecific requirements:\n1.2 Electronic engine management systems. The\nelectronic/electrical system/components of controlling\nthe engine’s fuel and ignition requirements.\nOther variables may include:\n1.3 Testing fuel pressure\n1.4 Cleaning injectors\n2. Manuals\nMay include:\n2.1 Manufacturer’s specification Manual\n2.2 Maintenance Procedure Manual\n2.3 Periodic Maintenance Data\n2.4 Service Manual\n2.5 Parts Checklist\n3. Company standard\noperating procedure\nMay include:\n3.1 Job Order\n3.2 Requisition slip\n3.3 Wearing of Personal Protective Equipment such as:\n• Safety shoes, Apron, Goggles, Hand Gloves\n4. Tools and equipment\nMay include:\n4.1 multimeter\n4.2 exhaust gas analyzer\n4.3 vacuum gauge\n4.4 pressure gauge\n4.5 tachometer\n4.6 vehicle lifting equipment\n4.7 power tools\n4.8 air tools\n4.9 special tools for removal/adjustment\n4.10 specialized system testers\n\n--- PDF PAGE 66 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n64\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Tested electronic engine management systems and\nidentifying faults.\n1.2 Serviced electronic engine management systems\n2. Required knowledge\n2.1 OH&S legislation\n2.2 Service/repair, removal, replacement and adjustment\nprocedures of engine management systems\n2.3 Operating principles of electronic fuel injection and\nengine management systems/components\n2.4 Construction and operation of electronic fuel injection\nengine management system/components relevant to\napplication\n2.5 Personal safety requirements\n2.6 Equipment/vehicle safety requirements\n2.7 Positive Work Values (Patience, Perseverance,\nHonesty, etc)\n2.8 Quality procedures, e.g., 5S\n2.9 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Use of testing equipment\n3.2 Analyzing and solving problems\n3.3 Service and repair and/or replacement of system\ncomponents\n3.4 Removal, dismantling, re-assembly and refitting\n3.5 Testing system operation\n3.6 Retrieval and assessment of electronic systems data\nincluding fault codes\n3.7 Testing, inspection and evaluation of fuel\ninjection/engine management system/components\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Appropriate tools and equipment\n4.3 Materials relevant to the proposed activity and tasks\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation or Demonstration with Questioning\n5.2 Portfolio\n6. Context of\nassessment\n6.1 Competency elements must be assessed on the job\nor in a simulated environment.\n6.2 The assessment of practical skills must take place\nafter a period of supervised practice and repetitive\nexperience.\n\n--- PDF PAGE 67 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n65\nUNIT OF COMPETENCY :\nOVERHAUL ENGINE AND ASSOCIATED\nCOMPONENTS\n\nUNIT CODE\n:\nALT 723318\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to overhaul engines and associated\ncomponents of a removed engine. The task involves a\ncomplete dismantling and rebuilding of light/heavy\nvehicles, plant, motorcycles and marine on 2 and 4\nstroke spark ignition and 2 and 4 stroke compression\nignition engines.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(Note: All standard of performance for Overhaul Engine and Associated\nComponents is in accordance with Company standard operating\nprocedure and Manufacturer’s specification manuals using specified Tools\nand equipment.)\n1. Analyze engine\nfailure\n\n1.1 Battery to be used is always fully charged\n1.2 Cylinder compressor is checked\n1.3 Valve timing is inspected\n1.4 Oil pressure is checked\n1.5 Cooling system (radiator or leak) is inspected\n1.6 Valve clearance is inspected/adjusted\n1.7 High tension cord is disconnected to the ignition coil during\nengine cranking\n2. Pull down the\nengine\n2.1 Vehicle is parked on designated area and wheel choked is\napplied\n2.2 Disconnected wire harness is accurately marked\n2.3 Battery is disconnected first before proceeding to remove\nother connection\n2.4 Engine is securely fitted or bolt to the engine stand\n3. Disassemble\nengine parts and\ncomponents\n\n3.1 Engine parts are checked for wear, damage and dirt\n3.2 Head bolts is removed following sequence pattern\n3.3 Engine is not turned upside down when the oil pan is\nremoved\n3.4 Crank shaft is removed in sequence pattern specified in the\nmanufacturer’s manual\n4. Inspect engine\nparts and\ncomponents\n\n4.1 Timing belt is not bended, twisted or turned inside out\n4.2 Belt is safeguarded not to get in contact with oil or other\nliquid chemical\n4.3 Cylinder warpage is referred to manufacturer’s manual\n4.4 Crankshaft maximum run-out is 0.06m\n Inspection of the following should conform to\n Manufacturer’s manual\n4.5 Main journal diameter\n4.6 Valve stem or valve bushing clearance\n4.7 Valve face angle is 45.5º\n4.8 Camshaft bore diameter oil clearance\n4.9 Piston ring groove clearance\n4.10 Piston ring end gap\n4.11 Piston to cylinder bore clearance\n4.12 Cylinder bore out of round & Taperness\n\n--- PDF PAGE 68 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n66\n4.13 Cam Lobe diameter\n4.14 Cam Lift\n4.15 Crankshaft main journal/connecting rod journal out-of-round\nand taperness\n4.16 Thrust clearance\n4.17 Connecting Rod alignment\n4.18 Value Spring Tension\n5. Perform fitting &\n adjustment of\nengine\n parts\n\n5.1 Fitting/Setting of valve to valve seat\n5.2 Application of prussian blu to the valve face\n5.3 If concentric 360º appearance of blu to the valve seat\n5.4 If not using valve upper hand upper hand lap the valve\n5.5 Camshaft is fitted to cylinder head\n5.6 Lay a strip of plastic gage\n5.7 Each cap bolt is tighten a little at a time in sequence\nspecified in Manufacturer’s manual\n5.8 Camshaft is not rotated\n5.9 Oversize piston is used only if clearance is excessive and if\nspecified in the manufacturer manual\n5.10 Oversize piston ring is used only if specified by\nmanufacturer\n6. Assemble engine\n parts/components\n\n6.1 Bolt is tightening\n6.2 Valve timing mark are aligned\n6.3 Measurement of timing belt deflection is 5-6 mm at 2 kg.\nforce\n6.4 Valve clearance is adjusted\n7. Mount engine\n7.1 Position of engine to the vehicle must be supported by lifting\nequipment\n7.2 Accurate and correct connection of engine wiring harness,\nfuel lines and battery\n7.3 All mounting bolts are tightened as per specified torque\n\n--- PDF PAGE 69 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n67\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Engine\n and Associated\n Components\nMay include:\n1.1 Light, plant, 2 and 4 stroke spark ignition and 2 and 4\nstroke compression ignition engines\n2. Manual\nMay include:\n2.1 Manufacturer’s specification Manual\n2.2 Maintenance Procedure Manual\n2.3 Periodic Maintenance Data\n2.4 Service Manual\n2.5 Parts Checklist\n3. Company Standard\nOperating Procedure\nMay include:\n3.1 Job Order\n3.2 Requisition slip\n3.3 Wearing of Personal Protective Equipment such as:\n•\nSafety shoes\n•\nApron\n•\nGoggles\n•\nHand Gloves\n4. Tools/ Equipment/\nand other materials\nMay include:\n4.1 Hand tools, power tools, lifting and jacking equipment,\nspecialist tools, measuring equipment, tensioning\nequipment\nOther materials needed include:\n4.2 Engine oils, moving part lubricants, replacement\nparts, gaskets and sealant\n\n--- PDF PAGE 70 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n68\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Analyzed engine failure\n1.2 Dismantled and assembled engine components\n1.3 Performed fitting and adjustment of engine\nparts/components\n2. Required knowledge\n2.1 Engine overhaul procedures\n2.2 Procedure for Dismantling, assembling and\nadjustment of components/parts\n2.3 Measuring and testing procedures\n2.4 Relevant technical information\n2.5 Equipment safety requirements\n2.6 Engine Component safety requirements\n2.7 Relevant enterprise policies\n2.8 Engine Parts/components handling techniques\n2.9 Personal safety requirements\n2.10 Positive Work Values (Patience, Perseverance,\nHonesty, etc.)\n2.11Quality procedures, e.g., 5S\n2.12Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Use of Repair Manual\n3.2 Interpreting engine wiring diagram\n3.3 Use of torque wrench & special service tools\n3.4 Using mathematical ideas and techniques\n3.5 Solving problems\n3.6 Fitting/adjusting engine parts\n3.7 Using measuring instrument\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this uniy may be assessed through:\n5.1 Observation or Demonstration with Questioning\n5.2 Portfolio\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or in a\nsimulated environment.\n6.2 The assessment of practical skills must take place\nafter a period of supervised practice and repetitive\nexperience.\n\n--- PDF PAGE 71 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n69\nUNIT OF COMPETENCY :\nSERVICE AUTOMATIC TRANSMISSION\n\nUNIT CODE\n:\nALT723319\n\nUNIT DESCRIPTOR\n:\nThis unit deals with overhauling automatic\ntransmission (A/T). It also includes testing of A/T\nbefore and during road test.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(Note: All standard of performance for Service Automatic\nTransmission is in accordance with company standard operating\nprocedure and manufacturer’s specification Manuals using specified\ntools and equipment)\n1. Diagnose automatic\ntransmission (A/T)\n\n1.1 Automatic transmission is tested for noise, shifting\ncondition, leaks, contamination and fluid pressure\n1.2 A/T is diagnosed as per Repair Manual to prevent\nseizure\n2. Dismount A/T\nassembly\n2.1 A/T fluid is drained thoroughly before transmission is\nremoved\n2.2 A/T cables and linkages is disconnected\n2.3Appropriate tools are used\n3. Disassemble\nautomatic\ntransmission\n3.1 Disassemble parts are accurately marked/tagged\n3.2 Parts are cleaned as per Repair Manual\n4. Conduct automatic\ntransmission analysis\n\n4.1 A/T parts-hydraulic valve body, clutch and disc, bearing\nand planetary gears are checked/inspected for worn-\nout, crack, backlash and end play\n4.2 Inspection of parts is conducted\n4.3Corresponding Repair works are recommended\n5. Assemble automatic\ntransmission\n5.1 Assembling procedure is followed\n5.2 Assembled parts are lubricated\n6. Mount/Install\nautomatic\ntransmission\nassembly\n6.1 Bolts are tightened and must be in accordance with\nManual torque specification, sequence and pattern\n6.2 Transmission is connected/installed\n6.3 Cables and linkages are adjusted\n6.4 A/T fluid is refilled\n7. Test automatic\ntransmission\n7.1 Stall Test and Lag test are conducted\n7.2 Line pressure test is conducted\n8. Road test automatic\ntransmission\n8.1 A/T fluid level, cable and linkages, engine operation are\nchecked before road test\n8.2 Report of test are completely accomplished and\ncorresponding recommendation are given\n\n--- PDF PAGE 72 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n70\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. A/T (Transmission/\nTransaxle)\nMay include:\n1.1 Preliminary checks\n•\nEngine condition\n•\nFluid level\n•\nFluid condition\n•\nControl linkage\n•\nVacuum modulator\n1.2 Shop Testing\n•\nPressure testing\n•\nAir checking\n1.3 Road Test\n•\nDevelop standard test route\n•\nTest route include level section, hills section and\nquite section\n•\nA/T must operate in each range to check shifting,\ncheck upshift and downshift speeds, and check for\nevidence of slippage Refer to a band chart\n•\nIsolate A/T noise from various chassis and body\ncomponents noises such as –air-conditioning,\nalternator, power steering & fan by removal of\ndrive belts of accessories and drive vehicle a short\ndistance.\n2. Manuals\nMay include:\n2.1 Manufacturer’s specification manual\n2.2 Maintenance procedure manual\n2.3 Periodic Maintenance Data\n2.4 Service and Repair manual\n2.5 Parts checklist\n3. Company standard\noperating procedure\nMay include:\n3.1 Job Order\n3.2 Requisition slip\n3.3 Wearing of personal protective equipment and\nclothing such as hand cleaner, hand gloves, safety\nshoes, skull guard, apron\n4. Tools and equipment\nMay include:\n4.1 Hydraulic lifter/Mechanical lifter\n4.2 Support Stand\n4.3 Transmission jack\n4.4 Socket wrench\n4.5 Snap ring expander\n4.6 Snap ring compressor\n4.7 Micrometer\n4.8 Torch wrench\n4.9 Allen wrench\n4.10 Combination wrench\n4.11 Basic handtools\n4.12 A/T pressure gauge\n4.13 Torque wrench\n4.14 Dial indicator with stand\n4.15 Air compressor\n4.16 Hard rubber mallet\n4.17 Ballpeen hammer\n\n--- PDF PAGE 73 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n71\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Disassembled automatic transmission\n1.2 Serviced Automatic Transmission\n1.3Performed Road Testing\n2. Required knowledge\n2.1 A/T Dismantling and assembling procedures (relevant\nto application)\n2.2 A/T Component repair and adjustment procedures\n(relevant to application)\n2.3 Component/unit test procedures and evaluation\n(relevant to application)\n2.4 Equipment/Material safety requirements\n2.5 Personal safety requirements\n2.6 Manual handling procedures\n2.7 Positive Work Values (Patience, Perseverance,\nHonesty, etc.)\n2.8 Quality procedures, e.g., 5S\n2.9 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Access, interpret & apply technical information\n3.2 Apply personal safety requirements\n3.3 Use of relevant tools and equipment\n3.4 Overhaul automatic transmissions and associated\ncomponents\n3.5 Apply component/unit test procedures an evaluation\n3.6 Maintain customer records\n3.7 Apply manual handling procedures\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation or Demonstration with Questioning\n5.2 Portfolio\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or in a\nsimulated environment.\n6.2 The assessment of practical skills must take place\nafter a period of supervised practice and repetitive\nexperience.\n\n--- PDF PAGE 74 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n72\nUNIT OF COMPETENCY : PERFORM MAINTENANCE SERVICE CHECK\n\n UP AND REPAIR TO AIR CONDITIONING\n SYSTEMS\n\nUNIT CODE\n:\nALT723320\n\nUNIT DESCRIPTOR\n:\nThis unit identifies the competence required to\nmaintain automotive air conditioner systems and\nrecord operating condition.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variable\n(All standard of performance for Perform Maintenance Service Check\nUp to Air Conditioning system is in accordance with company standard\noperating procedure and manufacturer’s specification Manuals using\nspecified tools, equipment and consumable materials.)\n1. Diagnose AC system\n\n1.1 Test is completed without causing damage to any\nworkplace, property or vehicle.\n1.2 Correct information is accessed/interpreted from\n appropriate manufacturer specifications\n1.3 Correct information is recorded on the Service slip.\n1.3 System performance is tested and the appropriate air\nconditioning service procedures are determined.\n1.5 Service of the system and components are carried\n1.7 System is tested and results are recorded\n2. Perform general\ncheck up/service\n/repair and\nreplacement of auto\nair-conditioning\nsystem components\n2.1 Maintenance check-up and A/C General Service is\nperformed\n2.2 Correct information is accessed and interpreted from\nappropriate manufacturer specifications.\n2.3 Air conditioning system components are dismantled,\nreassembled and tested\n2.4 Worn, damaged, deteriorated or faulty components\nare identified and replaced/repaired.\n2.5 System components are tested prior to placing into\nservice and results are recorded\n2.6 Air conditioning system components are overhauled\n2.7 General servicing is completed without causing\ndamage to any workplace property or air conditioning\nsystem component.\n\n--- PDF PAGE 75 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n73\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Air-Conditioning\nSystem\nMay include:\n1.1Compressor Assy.\n1.2 Evaporators/Cooling coil\n1.3 Condenser Assembly\n1.4 Condenser Fan Assy\n1.5 Pipes and Hoses/LS/HS\n1.6 AC Idler Pulley Assy\n1.7 AC Belt\n1.8 Auto Controller/AC ECU\n1.9 Aircon Auto Thermostat\n(Electronic/manual)\n1.10 AC Blower Motor\n1.11 Compressor\n Rotor/Bearing\n1.12 Magnetic clutch armature\nplate\n1.13 Manual switch & relays\n1.14 Auto Aircon minor/major\nelectrical harness/Fuse &\nrelays\n1.15 Circuit repairs and\nelectronic\n1.16 Automatic\ncontrols/damper\nmotors/Air\nventilation\n1.17 Aircon electrical\nsensors (Thermo\nsensors)\n1.18 Aircon Automatic\ncontrol unit\n1.19 Full AC switch &\ntemp control switch\nassembly\n1.20 Receiver, filter drier,\n1.21 Expansion valve\n2. Consumables\nMaterials\n\nMay include:\n2.1 Refrigerant 134-A/R-12\n2.2 Sun Pag oil –134A\n2.3 Compressor oil (Capella\noil) R-12\n2.4 O-ring 5/16, 5/8, ½\n2.5 Insulation Tape\n2.6 Flushing solution\n2.7 Coil Cleaner\n2.8 Nitrogen\n3. Manuals\nMay include:\n3.1 Maintenance Procedure Manual\n3.3 Periodic Maintenance Data\n3.4 Service Manual\n3.5 Parts Checklist\n4. Company standard\noperating procedure\nMay include:\n4.1 Job Order\n4.2 Requisition slip\n4.3 Wearing of Personal Protective Equipment such as\n• Gas mask, Goggles, Hand gloves, Safety shoes\n5. Tools and testing\nequipment\n\nMay include:\n5.1 Hand tools (ex. allen wrench set), cleaning equipment,\nrefrigeration oils, pressure testing equipment, sealing\nequipment\n5.2 Evacuation equipment, heating/soldering equipment,\nrefrigerant recovery and/or recycling equipment,\nrefrigerant re-gassing equipment\n5.3 Gauge manifold set\n5.4 Electronic Leak tester/Halogen/Multigas leak detector\n5.5 Charging cylinder- or with built in heater\n5.6 Vacuum pump - ½ horsepower to ⅛\n5.7 Compressor pulley puller/special tool\n5.8 Aircon performance tester with thermometer\n\n--- PDF PAGE 76 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n74\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate :\n1.1 Diagnosed the AC system\n1.2 Performed general check up/service /repair and\nreplacement of auto air-conditioning system\ncomponents\n2. Required\nknowledge\n2.1 Knowledge in appropriate amount of refrigerant aircon\nsystem compressor oil and other such consumables\n2.2 OH&S legislation\n2.3 Relevant technical information\n2.4 Personal safety requirements\n2.5 Equipment/component/material safety requirements\n2.6 Measuring and testing procedures\n2.7 Identification of air conditioning components/types\n2.8 Air conditioning component operation\n2.9 Component repair/overhauling procedures\n2.10 Positive Work Values (Patience, Perseverance,\nHonesty, etc.)\n2.11 Quality procedures, e.g., 5S\n2.12 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n\n3.1 Work safely\n3.2 Use tools and equipment\n3.3 Use appropriate workshop manuals, technical\npublications, tools and equipment\n3.4 Identify faults in air conditioning components\n3.5 Clean, test, inspect and evaluate air conditioning\ncomponents\n3.6 Dismantle and reassemble air conditioning\ncomponents\n3.7 Repair and replace components as required\n3.8 Test final product for return to service\n3.9 Perform Diagnosis and Repair Auto Aircon System\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate hand tools, Aircon Test equipment\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation or Demonstration with Questioning\n5.2 Portfolio\n6. Context of\nassessment\n\n6.1 Competency must be assessed on the job or in a\nsimulated environment.\n6.2 The assessment of practical skills must take place\nafter a period of supervised practice and repetitive\nexperience.\n\n--- PDF PAGE 77 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n75\n UNIT OF COMPETENCY: REMOVE AND REPLACE AUTOMOTIVE ENGINE AND\n\nENGINE-RELATED SYSTEMS\n\nUNIT CODE: ALT 723353\nUNIT DESCRIPTOR:\nThis unit covers the ability to remove and replace auto\nengine and engine-related system for re-powering the vehicle. The unit includes\nidentification and confirmation work requirement, preparation for work, removal,\nreplacement of engine and related systems and completion of work finalization\nprocesses, including clean-up and documentation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(NOTE: All standard of performance for this unit is in accordance with\ncompany standard operating procedure and manufacturer’s specification\nmanuals using specified tools and equipment)\n1. Prepare for work\n\n1.1 Work instructions are used to determine requirements,\nincluding methods, materials and equipment\n1.2 Job specifications are read and interpreted\n1.3 Occupational Health and Safety (OH & S) requirements are\nobserved throughout the work\n1.4 Replacement engine and related mechanical units/assemblies\nand materials for work are selected, inspected and tested\n1.5 Tools and equipment (including measuring/ test instruments)\nare identified and checked for safe operation\n1.6 Procedures are determined to minimize wastage\n1.7 Procedures are identified for maximizing energy efficiency\nwhile completing the job\n2. Remove engine\nand/ or related\nsystems\n2.1 Engines and other related systems are removed using\nappropriate methods, tools and equipment\n2.2 Engine and other related systems removal is completed\nwithout causing damage to component, system or injury to\nself or others\n2.3 Task is carried out according to regulations\n3. Replace engine\nand/ or related\nsystems\n\n3.1 Engines and other related systems are replaced with\nrecommended units using appropriate methods, tools and\nequipment\n3.2 Replacement of engines and other related systems is\ncompleted without causing damage to component or system\nor injury to self or others\n3.3 Inspection, testing and final adjustments is conducted\naccording to company/manufacturer’s procedures\n3.4 Task is carried out according to regulations\n4. Clean up work area 4.1 Materials that can be reused is collected and stored\n4.2 Waste and scrap is removed/ disposed-off following\nworkplace and environmental procedures\n4.3 Equipment and work area are cleaned and inspected for\nserviceable condition in accordance with workplace\nprocedures\n4.4 Unserviceable equipment is identified, tagged and faults\nidentified in accordance with workplace procedures\n4.5 Tools and equipment, supplies and materials and accessories\nare stored in accordance with workplace procedures\n\n--- PDF PAGE 78 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n76\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OH & S\nrequirements\nMay include:\n1.1 Workplace safety\n1.1.1protective clothing and equipment\n1.1.2 proper use of tools and equipment\n1.1.3 handling of materials\n1.1.4 use of fire fighting equipment\n1.1.5 first-aid\n1.2 Environment safety\n1.2.1 hazard control\n1.2.2 hazardous material and substances\n1.2.3 waste disposal\n2. Engine\n\nMay include:\n2.1 Gasoline engine\n2.2 Diesel engine\n2.3 Liquefied Petroleum Gas (LPG) engine\n2.3 Compressed Natural Gas (CNG) engine\n2.4 Liquefied Natural Gas (LNG) engine\n3. Related\nsystems\nMay include:\n3.1 Powertrain (Transmission, Differential, Driveshaft or\npropeller shaft, Clutch assembly, etc.)\n3.2 Air-conditioning systems\n3.3 Electrical/Electronic systems\n3.4 Fuel system\n3.5 Ignition system\n4. Regulations\nMay include:\n4.1 Industry regulations/guidelines\n4.2 OH & S requirements\n4.3 Legislations and local government codes\n4.4 Company procedures/policies\n4.5 Manufacturers/suppliers instructions/manuals\n4.1 Philippine National Standards (PNS 115)\n4.2 DILG Act of 1990 (RA 6975) Rule 8, Section 50\n4.3 Fire Code of the Phils. (PD 1185) Sect.8 and Rule 28\n4.4LPG Gas Code (NFPA 58)\n5. Materials\nMay include:\n5.1 Spare parts\n5.2 Lubricants\n5.3 Fluids\n5.4 Cleaning materials\n5.5 Fuel\n\n--- PDF PAGE 79 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n77\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Removed engine and related systems.\n1.2 Replaced engine and related systems.\n1.3 Observed OH & S regulations.\n1.4 Cleaned up work area.\n2. Required\nknowledge\n2.1 Types of automotive engine, its parts and function\n2.2 Types, characteristics, functions and specifications of\nengine and other related systems\n2.3 OH & S regulations/requirements, equipment, materials\nand personal safety requirements\n2.4 Types and layout of service/repair manuals (hard and\nsoft copy)\n2.4 Removal and replacement procedures for engine and\nother related system\n2.5 Use of common automotive tools and equipment\n2.6 Work organization and planning processes\n2.7 Company/workshop quality processes\n2.8 Types and uses of fuel or hazardous materials\n2.9 Measuring instruments (Vernier caliper, feeler gauge,\netc.)\n2.10 Volumes and weights\n2.11 Positive Work values (Perseverance, Honesty,\n Attention to details)\n2.12 Quality procedures, e.g., 5S\n2.13 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Interpreting job specifications and manuals\n3.2 Using automotive tools and equipment\n3.3 Handling of parts and materials\n3.4 Handling and using of fuel or hazardous materials\n3.5 Handling of measuring/testing instruments/equipment\n3.6 Using safety gadgets and accessories\n4. Resource\n implications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n4.4 Manufacturer’s repair manual or related reference/\nservice materials or manuals\n4.5 Motor vehicle\n4.6 Replacement units\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation with questioning\n5.2 Demonstration with questioning\n6. Context of\nassessment\n6.1 Competency may be assessed on the job or simulated\n environment.\n6.2 The assessment of practical skills must take place\n after a period of supervised practice and repetitive\n experience.\n\n--- PDF PAGE 80 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n78\nUNIT OF COMPETENCY: SERVICE AND REPAIR ELECTRONICALLY\n CONTROLLED STEERING SYSTEMS\n\nUNIT CODE\n : ALT 723358\n\nUNIT DESCRIPTOR :. This unit covers the competence to locate and rectify\nfaults inelectronically controlled steering systems. It\napplies specifically to electrical/electronic control\nsystems and components and does not cover\nsystems which are electronically controlled and\noperated.\nThe unit includes identification and confirmation of\nwork requirement, preparation for work, servicing and\nadjustment of systems, repair of faults, retesting of\nsystems and completion of work finalization\nprocesses, including clean-up and documentation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(NOTE: All standard of performance for this unit is in accordance with\ncompany standard operating procedure and manufacturer’s specification\nmanuals using specified tools and equipment)\n1. Prepare for work\n\n1.1 Work instructions are used to determine job\nrequirements, including quality, material, equipment\nquantities and service manuals.\n1.2 Job specifications are read and interpreted\n1.3 Occupational Health and Safety (OH & S) requirements\nare observed throughout the work\n1.4 Electronic system protection devices, processes and\n precautions are identified appropriate to the application\n1.5 Tools and equipment (including measuring/ test\ninstruments) are identified and checked for safe\noperation\n1.6 Procedures are identified to minimize task time\n2. Service and adjust\nelectronically\ncontrolled steering\nsystems\n2.1 Service information is accessed and interpreted prior to\n commencing servicing procedures\n2.2 Electronically controlled steering systems is\ndetermined in conjunction with the customer\n2.3 Current status of the electronic system is confirmed\n through a road test program\n2.4 Electronic system is serviced in accordance with\n manufacturer/component supplier specifications and\n enterprise procedures\n2.5 Fluids and lubricants are used in accordance with OH&S\n and manufacturer/component supplier specifications\n2.6 Used fluids and lubricants are disposed of according to\n enterprise and OH&S requirements\n\n--- PDF PAGE 81 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n79\n\n3. Rectify identified\n electronically\n controlled\n steering system\n faults\n\n3.1 Road test results are interpreted to verify system fault\n diagnosis\n3.2 Customer is notified of identified fault(s) and agreement\n is given before work is carried out\n3.3 Faulty components are removed and refitted with\napproved replacement parts reference with approved\nworkplace\n procedures and customer requirements\n3.4 Faulty components are disposed of reference with\n approved workplace procedures and warranty\n requirements\n3.5 System adjustments are completed for replaced\n components\n\n4. Test and confirm\nsystem faults after\nrectification have\nbeen done\n4.1 Test procedures are carried out to confirm rectification of\n system faults\n4.2 Documentation is completed in accordance with\n workplace/customer requirements\n4.3 Outcomes of rectification work is explained to the\n satisfaction of the customer to complete invoice\n documentation\n5. Clean up work\narea and maintain\nequipment\n5.1 Materials that can be reused is collected and stored\n5.2 Waste and scrap is removed following workplace\n procedures\n5.3 Equipment 