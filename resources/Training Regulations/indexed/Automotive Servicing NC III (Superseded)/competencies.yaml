        "source_title": "REMOVE AND REPLACE AUTOMOTIVE ENGINE AND ENGINE-RELATED SYSTEMS",
        "source_text": "--- PDF PAGE 77 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n75 \n UNIT OF COMPETENCY: REMOVE AND REPLACE AUTOMOTIVE ENGINE AND  \n \n \nENGINE-RELATED SYSTEMS \n \nUNIT CODE: ALT 723353  \nUNIT DESCRIPTOR: \nThis unit covers the ability to remove and replace auto \nengine and engine-related system for re-powering the vehicle. The unit includes \nidentification and confirmation work requirement, preparation for work, removal, \nreplacement of engine and related systems and completion of work finalization \nprocesses, including clean-up and documentation. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n(NOTE: All standard of performance for this unit  is in accordance with \ncompany standard  operating procedure and manufacturer’s specification \nmanuals using specified tools and equipment)\n1. Prepare for work \n \n1.1  Work instructions are used to determine requirements, \nincluding methods, materials and equipment \n1.2 Job specifications are read and interpreted  \n1.3 Occupational Health and Safety (OH & S) requirements are \nobserved throughout the work \n1.4 Replacement engine and related mechanical units/assemblies \nand materials for work are selected, inspected and tested  \n1.5 Tools and equipment (including measuring/ test instruments) \nare identified and checked for safe operation \n1.6 Procedures are determined to minimize wastage \n1.7 Procedures are identified for maximizing energy efficiency \nwhile completing the job\n2. Remove engine \nand/ or related \nsystems \n2.1 Engines and other  related systems are removed using \nappropriate methods, tools and equipment   \n2.2  Engine and other  related systems removal is completed \nwithout causing damage to component, system or injury to \nself or others \n2.3  Task is carried out according to regulations\n3. Replace engine \nand/ or related \nsystems \n \n \n \n \n3.1  Engines and other related systems are replaced with \nrecommended units using appropriate methods, tools and \nequipment   \n3.2  Replacement  of engines and other related systems is \ncompleted without causing damage to component or system \nor injury to self or others \n3.3  Inspection, testing and final adjustments is conducted \naccording to company/manufacturer’s procedures \n3.4 Task is carried out according to regulations \n4. Clean up work area 4.1 Materials  that can be reused is collected and stored \n4.2 Waste and scrap is removed/ disposed-off  following \nworkplace and environmental procedures \n4.3 Equipment and work area are cleaned and inspected for \nserviceable condition in accordance with workplace \nprocedures \n4.4  Unserviceable equipment is identified,  tagged and faults \nidentified in accordance with workplace procedures \n4.5 Tools and equipment, supplies and materials and accessories \nare stored in accordance with workplace procedures\n\n--- PDF PAGE 78 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n76 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. OH & S \nrequirements \nMay include: \n1.1 Workplace safety \n1.1.1protective clothing and equipment \n1.1.2 proper use of tools and equipment  \n1.1.3 handling of materials  \n1.1.4 use of fire fighting equipment  \n1.1.5 first-aid \n1.2 Environment safety \n1.2.1 hazard control \n1.2.2 hazardous material and substances \n1.2.3 waste disposal \n2. Engine \n \nMay include: \n2.1 Gasoline engine \n2.2 Diesel engine \n2.3 Liquefied Petroleum Gas (LPG) engine \n2.3 Compressed Natural Gas (CNG) engine \n2.4 Liquefied Natural Gas (LNG) engine\n3. Related \nsystems \nMay include: \n3.1 Powertrain (Transmission, Differential, Driveshaft or \npropeller shaft, Clutch assembly, etc.) \n3.2 Air-conditioning systems \n3.3 Electrical/Electronic systems \n3.4 Fuel system \n3.5 Ignition system\n4. Regulations \nMay include: \n4.1 Industry regulations/guidelines \n4.2 OH & S requirements \n4.3 Legislations and local government codes \n4.4 Company procedures/policies \n4.5 Manufacturers/suppliers instructions/manuals  \n4.1  Philippine National Standards (PNS 115) \n4.2 DILG Act of 1990 (RA 6975) Rule 8, Section 50 \n4.3 Fire Code of the Phils. (PD 1185) Sect.8 and Rule 28 \n4.4LPG Gas Code (NFPA 58)\n5. Materials \nMay include: \n5.1 Spare parts \n5.2 Lubricants \n5.3 Fluids  \n5.4 Cleaning materials \n5.5 Fuel\n\n--- PDF PAGE 79 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n77 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Removed engine and related systems.  \n1.2 Replaced engine and related systems. \n1.3 Observed OH & S regulations. \n1.4 Cleaned up work area. \n2. Required \nknowledge  \n2.1  Types of automotive engine, its parts and function \n2.2 Types, characteristics, functions and specifications of \nengine and other related systems \n2.3 OH & S regulations/requirements, equipment, materials \nand personal safety requirements \n2.4 Types and layout of service/repair manuals (hard and  \nsoft copy)  \n2.4 Removal and replacement procedures for engine and \nother related system \n2.5 Use of common automotive  tools and equipment \n2.6 Work organization and planning processes   \n2.7 Company/workshop quality processes \n2.8 Types and uses of fuel or hazardous materials \n2.9 Measuring instruments (Vernier caliper, feeler gauge, \netc.) \n2.10 Volumes and weights \n2.11 Positive Work values (Perseverance, Honesty,   \n        Attention to details) \n2.12 Quality procedures, e.g., 5S \n2.13 Environmental-conservation procedures,   \n         e.g., 3R (reduce, reuse, recycle)\n3. Required skills \n3.1 Interpreting job specifications and manuals \n3.2 Using automotive tools and equipment \n3.3 Handling of parts and materials \n3.4 Handling and using of fuel or hazardous materials  \n3.5 Handling  of measuring/testing instruments/equipment  \n3.6 Using safety gadgets and accessories\n4. Resource \n      implications \nThe following resources should be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate Tools & equipment \n4.3 Materials relevant to the activity \n4.4 Manufacturer’s repair manual or related reference/ \nservice materials or manuals \n4.5 Motor vehicle  \n4.6 Replacement units  \n5. Method of \nassessment \nCompetency in this unit may be assessed through: \n5.1 Direct observation with questioning \n5.2 Demonstration with questioning\n6. Context of \nassessment \n6.1 Competency may be assessed on the job or simulated   \n       environment. \n6.2 The assessment of practical skills must take place  \n       after a period of supervised practice and repetitive  \n      experience.\n",
