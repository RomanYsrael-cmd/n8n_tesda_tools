ask are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 10 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n8\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE :"
