          "source_text": "(NOTE: All standard of performance for Installing the LPG Conversion Kit  is in \naccordance with company standard  operating procedure and manufacturer’s \nspecification manuals using specified tools and equipment)\n1. Perform vehicle  \n    test  \n \n1.1 Vehicle engine condition is checked \n \n1.2 Appropriate test instruments, tools and equipment are \nselected \n \n1.3 Installation plan and design is checked \n \n1.4 Findings is reported and recommendation is made to direct  \nsupervisor  \n2. Mount and install \nconversion kit \n2.1 LPG Conversion kit is checked and tested \n \n2.2  Installation plan is checked  \n \n2.3  Installation information of LPG tank is accessed and \ninterpreted based on manufacturers specification \n \n2.4 Mounting and installation is performed \n \n2.5 Wiring installation is performed \n3. Install piping/hoses \nand safety features \nof the kit \n \n \n \n \n3.1 Piping/tubes, hoses and fittings are checked and tested \n \n3.2 Piping lay out is performed at the front, underneath and rear \nof the vehicle \n \n3.3 Information is accessed and interpreted based on the piping \ninstallation specifications and safety rules \n \n3.4 Mounting and installation is performed based on procedures \nmanual, safety handbook, manufacturer’s instruction and \noccupational health and safety (OH&S) requirements\n\n--- PDF PAGE 97 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n95 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Engine \nCondition \nMay include: \n1.1 Timing \n1.2 Compression\n2. Tools and \nequipment \nMay include: \n2.1 Common hand tools  \nScrewdriver, Hand drill, Pliers, Wrenches \n2.2 Testing instrument \nBattery load tester, Compression tester, Timing light \n2.5 Cleaning tools \nSteel brush, Air compressor, Hand cleaner, rags, etc.\n3. LPG Conversion  \nKit \n \nMay include: \n3.1 Multi Valves Carburetor Type, Electronic Fuel Injector \n(EFI) and Sequential Gas Injector (SGI) \n3.2 Change Over Switches -  Auto or Manual Type \n3.3 Vaporizer, Mixer and Tank \n3.4 Valves (Solenoid, safety, emergency shut-off, etc) \n3.5 Tubes and Fittings\n4. Tested \nMay include: \n4.1 Compression Test \n4.2 Leak Test \n5. Manuals \nMay include: \n5.1   Philippine National Standards (PNS 115) \n5.2 \nDILG Act of 1990 (RA 6975) Rule 8, Section 50 \n5.3 \nFire Code of the Phils. (PD 1185) Sect.8 and Rule 28 \n5.4 \nLPG Gas Code (NFPA 58) \n5.5 \nManufacturer specification manual \n5.6 \nMaintenance procedure manual \n5.7 \nPeriodic maintenance manual \n5.8 \nService manual \n5.9 \nParts Checklist \n5.10\nLPG Conversion Kit Manual\n6. OH & S \nrequirements \nMay include: \n6.1 Workplace safety \n6.1.1protective clothing and equipment \n6.1.2 proper use of tools and equipment  \n6.1.3 handling of materials  \n6.1.4 use of fire fighting equipment  \n6.1.5 first-aid \n6.2 Environment safety \n6.2.1 hazard control \n6.2.2 hazardous material and substances \n6.2.3 waste disposal\n\n--- PDF PAGE 98 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n96"
