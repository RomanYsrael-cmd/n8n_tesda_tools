        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate :\n1.1 Diagnosed the AC system\n1.2 Performed general check up/service /repair and\nreplacement of auto air-conditioning system\ncomponents\n2. Required\nknowledge\n2.1 Knowledge in appropriate amount of refrigerant aircon\nsystem compressor oil and other such consumables\n2.2 OH&S legislation\n2.3 Relevant technical information\n2.4 Personal safety requirements\n2.5 Equipment/component/material safety requirements\n2.6 Measuring and testing procedures\n2.7 Identification of air conditioning components/types\n2.8 Air conditioning component operation\n2.9 Component repair/overhauling procedures\n2.10 Positive Work Values (Patience, Perseverance,\nHonesty, etc.)\n2.11 Quality procedures, e.g., 5S\n2.12 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n\n3.1 Work safely\n3.2 Use tools and equipment\n3.3 Use appropriate workshop manuals, technical\npublications, tools and equipment\n3.4 Identify faults in air conditioning components\n3.5 Clean, test, inspect and evaluate air conditioning\ncomponents\n3.6 Dismantle and reassemble air conditioning\ncomponents\n3.7 Repair and replace components as required\n3.8 Test final product for return to service\n3.9 Perform Diagnosis and Repair Auto Aircon System\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate hand tools, Aircon Test equipment\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation or Demonstration with Questioning\n5.2 Portfolio\n6. Context of\nassessment\n\n6.1 Competency must be assessed on the job or in a\nsimulated environment.\n6.2 The assessment of practical skills must take place\nafter a period of supervised practice and repetitive\nexperience.\n\n--- PDF PAGE 77 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n75\n UNIT OF COMPETENCY: REMOVE AND REPLACE AUTOMOTIVE ENGINE AND\n\nENGINE-RELATED SYSTEMS\n\nUNIT CODE:"
        },
        "source_text": "ALT723320\n\nUNIT DESCRIPTOR\n:\nThis unit identifies the competence required to\nmaintain automotive air conditioner systems and\nrecord operating condition.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variable\n(All standard of performance for Perform Maintenance Service Check\nUp to Air Conditioning system is in accordance with company standard\noperating procedure and manufacturer’s specification Manuals using\nspecified tools, equipment and consumable materials.)\n1. Diagnose AC system\n\n1.1 Test is completed without causing damage to any\nworkplace, property or vehicle.\n1.2 Correct information is accessed/interpreted from\n appropriate manufacturer specifications\n1.3 Correct information is recorded on the Service slip.\n1.3 System performance is tested and the appropriate air\nconditioning service procedures are determined.\n1.5 Service of the system and components are carried\n1.7 System is tested and results are recorded\n2. Perform general\ncheck up/service\n/repair and\nreplacement of auto\nair-conditioning\nsystem components\n2.1 Maintenance check-up and A/C General Service is\nperformed\n2.2 Correct information is accessed and interpreted from\nappropriate manufacturer specifications.\n2.3 Air conditioning system components are dismantled,\nreassembled and tested\n2.4 Worn, damaged, deteriorated or faulty components\nare identified and replaced/repaired.\n2.5 System components are tested prior to placing into\nservice and results are recorded\n2.6 Air conditioning system components are overhauled\n2.7 General servicing is completed without causing\ndamage to any workplace property or air conditioning\nsystem component.\n\n--- PDF PAGE 75 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n73\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Air-Conditioning\nSystem\nMay include:\n1.1Compressor Assy.\n1.2 Evaporators/Cooling coil\n1.3 Condenser Assembly\n1.4 Condenser Fan Assy\n1.5 Pipes and Hoses/LS/HS\n1.6 AC Idler Pulley Assy\n1.7 AC Belt\n1.8 Auto Controller/AC ECU\n1.9 Aircon Auto Thermostat\n(Electronic/manual)\n1.10 AC Blower Motor\n1.11 Compressor\n Rotor/Bearing\n1.12 Magnetic clutch armature\nplate\n1.13 Manual switch & relays\n1.14 Auto Aircon minor/major\nelectrical harness/Fuse &\nrelays\n1.15 Circuit repairs and\nelectronic\n1.16 Automatic\ncontrols/damper\nmotors/Air\nventilation\n1.17 Aircon electrical\nsensors (Thermo\nsensors)\n1.18 Aircon Automatic\ncontrol unit\n1.19 Full AC switch &\ntemp control switch\nassembly\n1.20 Receiver, filter drier,\n1.21 Expansion valve\n2. Consumables\nMaterials\n\nMay include:\n2.1 Refrigerant 134-A/R-12\n2.2 Sun Pag oil –134A\n2.3 Compressor oil (Capella\noil) R-12\n2.4 O-ring 5/16, 5/8, ½\n2.5 Insulation Tape\n2.6 Flushing solution\n2.7 Coil Cleaner\n2.8 Nitrogen\n3. Manuals\nMay include:\n3.1 Maintenance Procedure Manual\n3.3 Periodic Maintenance Data\n3.4 Service Manual\n3.5 Parts Checklist\n4. Company standard\noperating procedure\nMay include:\n4.1 Job Order\n4.2 Requisition slip\n4.3 Wearing of Personal Protective Equipment such as\n• Gas mask, Goggles, Hand gloves, Safety shoes\n5. Tools and testing\nequipment\n\nMay include:\n5.1 Hand tools (ex. allen wrench set), cleaning equipment,\nrefrigeration oils, pressure testing equipment, sealing\nequipment\n5.2 Evacuation equipment, heating/soldering equipment,\nrefrigerant recovery and/or recycling equipment,\nrefrigerant re-gassing equipment\n5.3 Gauge manifold set\n5.4 Electronic Leak tester/Halogen/Multigas leak detector\n5.5 Charging cylinder- or with built in heater\n5.6 Vacuum pump - ½ horsepower to ⅛\n5.7 Compressor pulley puller/special tool\n5.8 Aircon performance tester with thermometer\n\n--- PDF PAGE 76 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n74\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate :\n1.1 Diagnosed the AC system\n1.2 Performed general check up/service /repair and\nreplacement of auto air-conditioning system\ncomponents\n2. Required\nknowledge\n2.1 Knowledge in appropriate amount of refrigerant aircon\nsystem compressor oil and other such consumables\n2.2 OH&S legislation\n2.3 Relevant technical information\n2.4 Personal safety requirements\n2.5 Equipment/component/material safety requirements\n2.6 Measuring and testing procedures\n2.7 Identification of air conditioning components/types\n2.8 Air conditioning component operation\n2.9 Component repair/overhauling procedures\n2.10 Positive Work Values (Patience, Perseverance,\nHonesty, etc.)\n2.11 Quality procedures, e.g., 5S\n2.12 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n\n3.1 Work safely\n3.2 Use tools and equipment\n3.3 Use appropriate workshop manuals, technical\npublications, tools and equipment\n3.4 Identify faults in air conditioning components\n3.5 Clean, test, inspect and evaluate air conditioning\ncomponents\n3.6 Dismantle and reassemble air conditioning\ncomponents\n3.7 Repair and replace components as required\n3.8 Test final product for return to service\n3.9 Perform Diagnosis and Repair Auto Aircon System\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate hand tools, Aircon Test equipment\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation or Demonstration with Questioning\n5.2 Portfolio\n6. Context of\nassessment\n\n6.1 Competency must be assessed on the job or in a\nsimulated environment.\n6.2 The assessment of practical skills must take place\nafter a period of supervised practice and repetitive\nexperience.\n\n--- PDF PAGE 77 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n75\n UNIT OF COMPETENCY: REMOVE AND REPLACE AUTOMOTIVE ENGINE AND\n\nENGINE-RELATED SYSTEMS\n\nUNIT CODE:"
