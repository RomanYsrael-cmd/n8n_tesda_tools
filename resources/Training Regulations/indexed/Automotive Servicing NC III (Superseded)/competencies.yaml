        "source_text": "ALT 723316\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competence required to carry out\ninstallation, testing and repair of automotive electrical\nsecurity systems and components.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(All standard of performance for Install, Test and Repair Electrical\nSecurity System/Components is in accordance with company\nstandard operating procedure and manufacturer’s specification\nManuals using specified tools and equipment)\n1. Install electrical\nsecurity system/\ncomponents.\n\n1.1\nInstallation is completed without causing damage to\nany workplace property or vehicle.\n1.2\nCorrect information is accessed and interpreted\n1.3\nAppropriate fittings/materials are selected.\n1.4\nElectrical security systems/components are installed\nand wired.\n2. Test anti-theft\nsystem\n2.1 Tests are completed without causing damage to any\nworkplace property or vehicle.\n2.2 Correct information is accessed and interpreted.\n2.3 Tests are carried out to determine faults.\n2.4 Faults are identified and preferred repair action\ndetermined.\n3. Repair electrical\nsecurity systems/\ncomponents.\n3.1\nElectrical security systems/ components are repaired\nwithout causing damage to any workplace property or\nvehicle.\n3.2\nCorrect information is accessed and interpreted.\n3.3\nNecessary repairs, component replacement and\nadjustment are carried out.\n\n--- PDF PAGE 62 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n60\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Electrical Security\nSystem Components\nMay include:\n1.1\nCar alarm\n1.2\nPower window\n1.3\nPower lock\n2. Manuals\nMay include:\n2.1\nManufacturer Specification Manual\n2.2\nMaintenance Procedure Manual\n2.3\nPeriodic Maintenance Data\n2.4\nService Manual\n2.5\nParts Checklist\n3. Company Standard\nOperating Procedure\nMay include:\n3.1\nJob Order\n3.2\nRequisition slip\n3.3\nWearing of Personal Protective Equipment such as\n• Apron\n• Goggles\n• Safety shoes\n• Gloves\n4. Tools and equipment\nMay include:\n4.1\nMultimeter, test lamps, soldering gun\n4.2\nPower tools, air tools, special tools for removal\nadjustment\n\n--- PDF PAGE 63 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n61\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nInstalled electrical security system/components\n1.2\nTest anti-theft system\n1.3\nRepair electrical security systems/components\n2. Required knowledge\n2.1\nOH&S regulations\n2.2\nElectrical principles\n2.3\nOhms law\n2.3\nElectrical Wiring codes\n2.4\nElectrical measuring and testing procedures\n2.5\nVehicle safety requirements\n2.6\nProcedures to avoid damage to ECUs\n2.7\nPositive Work Values (Patience, Perseverance,\nHonesty, etc.)\n2.8 Quality procedures, e.g., 5S\n2.9 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1\nRemoving/Installing electrical devices\n3.2\nReading/Interpreting schematic diagrams\n3.3\nUsing Testing Equipment\n3.4\nUsing Mathematical Ideas and Techniques\n3.5\nSolving Problems\n3.6\nRepairing procedures\n3.7\nSoldering\n4. Resource implications\nThe following resources should be provided:\n4.1\nWorkplace: Real or simulated work area\n4.2\nAppropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation or Demonstration with Questioning\n5.2 Portfolio\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a\nsimulated environment.\n6.2\nThe assessment of practical skills must take place\nafter a period of supervised practice and repetitive\nexperience.\n\n--- PDF PAGE 64 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n62\nUNIT OF COMPETENCY :\nSERVICE ELECTRONIC ENGINE\n\nMANAGEMENT SYSTEMS\n\nUNIT CODE\n:"
