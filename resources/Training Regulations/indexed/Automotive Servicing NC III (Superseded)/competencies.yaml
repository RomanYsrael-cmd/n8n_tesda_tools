 LPG\n Conversion Kit\n2.10 Procedure in installing the LPG Tank\n2.11 Use of common automotive tools and equipment\n2.12 Work organization and planning processes\n2.13 Company/workshop quality processes\n2.14 Types and uses of fuel or hazardous materials\n2.15 Measuring instruments (Battery load tester, Compression\ntester, Timing light, etc.)\n2.16 Positive Work values (Perseverance, Honesty,\n Attention to details)\n2.17 Quality procedures, e.g., 5S\n2.18 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Installing the Multi Valve, Vaporizer, Tank and Change\n Over Switch\n3.2 Interpreting installation plans and designs\n3.3 Handling of parts, cleaning tools and chemicals, sealant\n Gaskets and piping tubes\n3.4 Handling special tools equipment such as tester\n3.5 Handling of safety gadgets and accessories\n3.6 Interpreting job specifications and manuals\n3.7 Using automotive tools and equipment\n3.8 Handling of measuring/testing instruments/equipment\n3.9 Using safety gadgets and accessories\n4.Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n4.4 Manufacturer’s repair manual or related reference materials\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation while the tasks are being performed\n5.2 Demonstration with questioning\n5.3 Written/Oral test\n6. Context of\nassessment\n6.1 Competency may be assessed on the job or simulated\n environment.\n6.2 The assessment of practical skills must take place\n after a period of supervised practice and repetitive\n experience.\n\n--- PDF PAGE 99 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n97\nUNIT OF COMPETENCY: TEST AND ADJUST LPG CALIBRATION\n\nUNIT CODE: ALT 723351\n\nUNIT DESCRIPTOR:\nThis unit identifies the competence required to test and\nadjust Auto LPG Calibration to include electrical system,\nignition and starting, vaporizer or mixer.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(NOTE: All standard of performance for Test/Adjust LPG Calibration is in\naccordance with company standard operating procedure and\nManufacturer’s Specification manuals using specified tools and\nequipment.)\n1. Test electrical\nconnections\n1.1 Tests are completed without causing damage to\nworkplace property or vehicle.\n1.2 Information is accessed and interpreted from appropriate\nmanufacturer specifications.\n1.3 Tests are carried out to determine faults using appropriate\ntools and techniques.\n1.4 Faults are identified and preferred repair action is\ndetermined.\n2. Adjust ignition\nsystem\n2.1 Ignition system components are cleaned\n2.2 Engine is started as per standard operating procedures.\n2.3 Ignition system is checked/tested\n2.4 Ignition timing is adjusted\n2.5 Ignition system/components are repaired without\n causing damage to any other vehicle parts\n3. Adjust/Tune up\nvaporizer\n3.1 Tests are carried out to tune the vaporizer or mixer\n using appropriate tools and techniques.\n3.2 Information is accessed and interpreted from appropriate\nmanufacturer specifications and manuals\n3.3 Tests are completed without causing damage to any\nworkplace property or vehicle.\n3.4 Vehicle is test driven and final tuning is performed.\n4. Check /test LPG\nfuel system\n4.1 LPG fuel system components are checked according to\nthe manual\n4.2 Fuel piping lines are checked and tested for leaks\n4.3 LPG fuel tank is checked\n4.4 Occupational Health and Safety (OH & S)\nrequirements are observed throughout the work\n\n--- PDF PAGE 100 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n98\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Test\nMay include:\n1.2 Leak Test\n1.3 Ignition/Timing Test\n2. Tools and\nequipment\nMay include:\n2.1 Hand tools (Screwdriver, Pliers, Wrenches, Feeler gauge)\n2.2 Measuring instrument (multitester, timing light,)\n2.3 Lifting equipment (Jack, hydraulic lifter)\n3. Ignition system\ncomponents\nMay include:\n3.1 Spark plug\n3.1 Contact points\n3.2 Rotor\n3.3 Distributor cap\n3.4 Ignition switch\n3.6 High tension cables\n4. Checked/tested\nMay include:\n4.1 Spark test\n4.2 Ignition coil resistance test\n4.3 Ballast resistance test\n4.4 Parts condition\n5. LPG fuel system\ncomponents\nMay include:\n5.1 Fuel filter and air cleaner\n5.2 Carburetor/EFI & SGI system\n5.3 Fuel piping lines and Fittings\n5.4 LPG fuel tank\n5.5\nValves (Solenoid, safety, emergency shut-off, etc)\n6. Manual\nMay include:\n6.1 Philippine National Standards (PNS 115)\n6.2 DILG Act of 1990 (RA 6975) Rule 8, Section 50\n6.3 Fire Code of the Phils. (PD 1185) Sect.8 and Rule 28\n6.4 LPG Gas Code (NFPA 58)\n6.5 Manufacturer specification manual\n6.6 Maintenance procedure manual\n6.7 Periodic maintenance manual\n6.8 Service manual\n6.9 Parts Checklist\n6.10 LPG Conversion Kit Manual\n7. OH & S\nrequirements\nMay include:\n7.1 Workplace safety\n7.1.1protective clothing and equipment\n7.1.2 proper use of tools and equipment\n7.1.3 handling of materials\n7.1.4 use of fire fighting equipment\n7.1.5 first-aid\n7.2 Environment safety\n7.2.1 hazard control\n7.2.2 hazardous material and substances\n7.2.3 waste disposal\n\n--- PDF PAGE 101 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n99\nEVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\nTested and adjusted LPG Calibration\n2. Required\nknowledge\n2.1 Types of automotive engine, its parts and function\n2.2 Types, characteristics, functions and specifications of engine and\nother related systems\n2.3 OH & S regulations/requirements, equipment, materials and\npersonal safety requirements\n2.4 Installation Kit procedure and safety precaution\n2.5 Multi Valve, Vaporizer, Tank and Change Over Switch\n Parts and nomenclatures\n2.6 Analysis in Working Plan for Piping Lay out\n2.7 Types of LPG Safety accessories\n2.8 Installation procedure of Valves, Vaporizer change over\n switch, piping and safety gadgets\n2.9 Special tools in setting and installing the LPG\n Conversion Kit\n2.10 Procedure in installing the LPG Tank\n2.11 Use of common automotive tools and equipment\n2.12 Work organization and planning processes\n2.13 Company/workshop quality processes\n2.14 Types and uses of fuel or hazardous materials\n2.15 Measuring instruments (Battery load tester, Timing light, etc.)\n2.16 Positive Work values (Perseverance, Honesty, Attention to\ndetails)\n2.17 Types of Ignition System, Carburetor, SGI and EFI\n2.18 Equipment safety requirements\n2.19 Relevant company policies\n2.20 Personal safety requirements\n2.21 Types of Leak Test and Instruments\n2.22 Principle of LPG Engine operation\n2.23 Quality procedures, e.g., 5S\n2.24 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1Accessing, interpreting and applying technical information\n3.2 Using relevant tools in tuning vaporizer and equipment safely\n3.3 Maintaining customer records\n3.4 Applying maintenance procedures\n3.5 Following servicing/inspection job order\n3.6 Speaking and listening skills\n3.7 Reading and writing skills\n3.8Using and interpreting measurements\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n4.4Repair manuals and related reference materials\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct observation with questioning\n5.2 Demonstration with questioning\n6. Context of\nassessment\n6.1Competency may be assessed on the job or\nSimulated environment.\n6.2 The assessment of practical skills must take place after a\nPeriod of supervised practice and repetitive experience.\n\n--- PDF PAGE 102 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n100\nUNIT OF COMPETENCY : SERVICE AUTO LPG SYSTEM\n\nUNIT CODE\n: ALT 723352\n\nUNIT DESCRIPTOR: This unit identifies the competence required to service Auto\nLPG System to include electrical system, ignition and\nstarting, vaporizer or mixer.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(NOTE: All standard of performance for Service Auto LPG System is\nin accordance with company standard operating procedure and\nManufacturer’s Specification manuals using specified tools and\nequipment.)\n1. Service electrical\nsystem\n1. 1 Servicing of electrical system such as starting/\nignition system and its component is performed as\nper manufacturer’s manual using specified tools and\nequipment\n1.2 Servicing are completed without causing damage to\nworkplace property or vehicle.\n2. Service ignition\ncomponents\n2.1 Servicing of spark plug, contact points, rotor,\ndistributor cap, ignition switch is performed as per\nmanufacturer’s specifications/procedures\n2.2 Engine is started as per standard operating\n procedure.\n2.3 Servicing of ignition coil resistance is completed\n2.4 Servicing of ignition timing is performed\n2.5 Ignition system/components are repaired without\n causing damage to other vehicle parts\n3. Service\nvaporizer/mixer\n3.1 Servicing are carried out to tune the vaporizer or\n mixer using appropriate tools and techniques.\n3.2 Information is accessed and interpreted from\nappropriate manufacturer specifications\n3.3 Servicing are completed without causing damage to\nworkplace property or vehicle.\n4. Service LPG fuel\nsystem\n4.1 LPG fuel system components are serviced\naccording to manual and specifications\n4.2 Fuel filter is replaced according to manufacturer’s\ninstructions, as needed\n4.3 Servicing are completed without causing damage to\nany workplace property or vehicle.\n4.3 Occupational Health and Safety (OH & S)\nrequirements are observed throughout the work\n\n--- PDF PAGE 103 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n101\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manual\nMay include:\n1.1 Philippine National Standards (PNS 115)\n1.2 DILG Act of 1990 (RA 6975) Rule 8, Section 50\n1.3 Fire Code of the Phils. (PD 1185) Sect.8 and Rule 28\n1.4 LPG Gas Code (NFPA 58)\n1.5 Manufacturer specification manual\n1.6 Maintenance procedure manual\n1.7 Periodic maintenance manual\n1.8 Service manual\n1.9 Parts Checklist\n1.10 LPG Conversion Kit Manual\n3. Tools and\nequipment\nMay include:\n3.1 Hand tools, power tools,\n3.2 Special equipment, measuring, testing and lifting\nequipment,\n3.3 Testing instrument\n4. LPG fuel system\ncomponents\nMay include:\n4.1 Fuel filter and air cleaner\n4.2 Carburetor/EFI & SGI systems\n4.3 Fuel pump\n4.4 LPG Fuel Tank and Piping Line\n5. OH & S\nrequirements\nMay include:\n4.1 Workplace safety\n4.1.1protective clothing and equipment\n4.1.2 proper use of tools and equipment\n4.1.3 handling of materials\n4.1.4 use of fire fighting equipment\n4.1.5 first-aid\n4.2 Environment safety\n4.2.1 hazard control\n4.2.2 hazardous material and substances\n4.2.3 waste disposal\n\n--- PDF PAGE 104 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n102\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\nPerformed servicing of LPG fuel system\n2. Required\nknowledge\n2.1 Types of automotive engine, its parts and function\n2.2 Types, characteristics, functions and specifications of engine\nand other related systems\n2.3 OH & S regulations/requirements, equipment, materials and\npersonal safety requirements\n2.4 Installation Kit procedure and safety precaution\n2.5 Multi Valve, Vaporizer, Tank and Change Over Switch\n Parts and nomenclatures\n2.6 Analysis in Working Plan for Piping Lay out\n2.7 Types of LPG Safety accessories\n2.8 Installation procedure of Valves, Vaporizer change over\n switch, piping and safety gadgets\n2.9 Special tools in setting and installing the LPG\n Conversion Kit\n2.10 Procedure in installing the LPG Tank\n2.11 Use of common automotive tools and equipment\n2.12 Work organization and planning processes\n2.13 Company/workshop quality processes\n2.14 Types and uses of fuel or hazardous materials\n2.15 Measuring instruments (Battery load tester, Timing light, etc.)\n2.16 Positive Work values (Perseverance, Honesty, Attention to\ndetails)\n2.17 Types of Ignition System, Carburetor, SGI and EFI\n2.18 Equipment safety requirements\n2.19 Relevant company policies\n2.20 Personal safety requirements\n2.21 Types of Leak Test and Instruments\n2.22 Principle of LPG Engine operation\n2.23 Quality procedures, e.g., 5S\n2.24 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Accessing, interpreting and applying technical information\n3.2 Using relevant tools in tuning vaporizer and equipment safely\n3.3 Maintaining customer records\n3.4 Applying maintenance procedures\n3.5 Following servicing/inspection job order\n3.6 Speaking and listening skills\n3.7 Reading and writing skills\n3.8 Using and interpreting measurements\n4\nResource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n4.4 Repair manuals and related reference materials\n5\nMethod of\nassessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation with questioning\n5.2 Demonstration with questioning\n6\nContext of\nassessment\n6.1 Competency may be assessed on the job or\nsimulated environment.\nThe assessment of practical skills must take place after a\nperiod of supervised practice and repetitive experience.\n\n--- PDF PAGE 105 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n103"
