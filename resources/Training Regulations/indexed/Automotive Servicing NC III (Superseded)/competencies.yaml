          "source_text": "(All standard of performance for Install, Test and Repair Electrical \nSecurity System/Components is in accordance with company \nstandard operating procedure and manufacturer’s specification \nManuals using specified tools and equipment)\n1. Install electrical \nsecurity system/ \ncomponents. \n \n \n1.1 \nInstallation is completed without causing damage to \nany workplace property or vehicle. \n1.2 \nCorrect information is accessed and interpreted  \n1.3 \nAppropriate fittings/materials are selected. \n1.4 \nElectrical security systems/components are installed \nand wired.\n2. Test anti-theft \nsystem \n2.1 Tests are completed without causing damage to any \nworkplace property or vehicle. \n2.2 Correct information is accessed and interpreted. \n2.3 Tests are carried out to determine faults. \n2.4 Faults are identified and preferred repair action \ndetermined.\n3. Repair electrical \nsecurity systems/ \ncomponents. \n3.1 \nElectrical security systems/ components are repaired \nwithout causing damage to any workplace property or \nvehicle.  \n3.2 \nCorrect information is accessed and interpreted. \n3.3 \nNecessary repairs, component replacement and \nadjustment are carried out.\n\n--- PDF PAGE 62 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n60 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Electrical Security \nSystem Components \nMay include: \n1.1 \nCar alarm \n1.2 \nPower window \n1.3 \nPower lock \n2. Manuals \nMay include: \n2.1 \nManufacturer Specification Manual \n2.2 \nMaintenance Procedure Manual \n2.3 \nPeriodic Maintenance Data \n2.4 \nService Manual \n2.5 \nParts Checklist \n3. Company Standard \nOperating Procedure \nMay include: \n3.1 \nJob Order \n3.2 \nRequisition slip \n3.3 \nWearing of Personal Protective Equipment such as \n Apron \n Goggles \n Safety shoes \n Gloves \n4. Tools and equipment \nMay include: \n4.1 \nMultimeter, test lamps, soldering gun \n4.2 \nPower tools, air tools, special tools for removal \nadjustment\n\n--- PDF PAGE 63 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n61"
        },
