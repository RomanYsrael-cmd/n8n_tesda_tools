        "source_title": "SERVICE ELECTRONIC ENGINE MANAGEMENT SYSTEMS",
        "source_text": "--- PDF PAGE 64 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n62 \nUNIT OF COMPETENCY : \nSERVICE ELECTRONIC ENGINE  \n \n \nMANAGEMENT SYSTEMS \n \nUNIT CODE \n: \n \nALT 723317 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to service/repair electronic fuel injection and \nelectronic engine management systems and/or \nassociated components. Engine management \nsystems are systems where the ECU incorporates \ncontrol over the fuel injection and ignition systems. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n(Note: All standard of performance for Service Electronic Engine \nManagement Systems is in accordance with company standard operating \nprocedure and manufacturer’s specification manuals using specified tools \nand equipment.)\n1.  Check electronic \nengine management \nsystems and/or \nassociated \ncomponents. \n \n1.1 Checking is completed without causing damage to any \nworkplace property or vehicle. \n1.2 Correct information is accessed and interpreted from \nappropriate manufacturer specifications. \n1.3 Tests on electronic fuel injection and electronic engine \nmanagement systems are carried out to determine faults  \n1.4 Appropriate servicing procedure is recommended.\n2.  Service electronic \nengine management \nsystems and/or \nassociated \ncomponents. \n \n2.1 Service is completed without causing damage to any \nworkplace property or vehicle. \n2.2 Correct information is accessed and interpreted from \nappropriate manufacturer specifications. \n2.3 Necessary service and repairs, component replacement \nand adjustments are carried out using appropriate tools, \ntechniques and materials. \n2.4 Tests on electronic fuel injection and engine management \nsystems are carried out to determine faults are corrected\n\n--- PDF PAGE 65 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n63 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Electronic Engine \nManagement \nSystems \nMay include: \n1.1  Electronic fuel injection and electronic engine \nmanagement systems fitted light vehicles outdoor \npower equipment. (Engine management systems are \nsystems where the ECU incorporates control over the \nfuel injection and ignition systems.) \nSpecific requirements:  \n1.2 Electronic engine management systems. The \nelectronic/electrical system/components of controlling \nthe engine’s fuel and ignition requirements. \nOther variables may include:  \n1.3 Testing fuel pressure \n1.4 Cleaning injectors\n2.  Manuals \nMay include: \n2.1  Manufacturer’s specification Manual \n2.2  Maintenance Procedure Manual \n2.3  Periodic Maintenance Data \n2.4  Service Manual \n2.5 Parts Checklist\n3.  Company standard \noperating procedure \nMay include: \n3.1  Job Order \n3.2  Requisition slip \n3.3  Wearing of Personal Protective Equipment such as: \n Safety shoes, Apron, Goggles, Hand Gloves \n4.  Tools and equipment \nMay include: \n4.1  multimeter \n4.2  exhaust gas analyzer \n4.3  vacuum gauge \n4.4  pressure gauge \n4.5  tachometer \n4.6  vehicle lifting equipment \n4.7  power tools \n4.8  air tools \n4.9  special tools for removal/adjustment \n4.10 specialized system testers\n\n--- PDF PAGE 66 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n64 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate:\n1.1 Tested electronic engine management systems and \nidentifying faults. \n1.2 Serviced electronic engine management systems\n2.  Required knowledge  \n2.1  OH&S legislation \n2.2  Service/repair, removal, replacement and adjustment \nprocedures of engine management systems \n2.3  Operating principles of electronic fuel injection and \nengine management  systems/components \n2.4  Construction and operation of electronic fuel injection \nengine management  system/components relevant to \napplication \n2.5  Personal safety requirements \n2.6  Equipment/vehicle safety requirements \n2.7  Positive Work Values (Patience, Perseverance, \nHonesty, etc) \n2.8     Quality procedures, e.g., 5S \n2.9     Environmental-conservation procedures,   \n         e.g., 3R (reduce, reuse, recycle)\n3.  Required skills \n3.1  Use of testing equipment \n3.2  Analyzing and solving problems \n3.3  Service and repair and/or replacement of system \ncomponents \n3.4  Removal, dismantling, re-assembly and refitting \n3.5  Testing system operation \n3.6  Retrieval and assessment of electronic systems data \nincluding fault codes \n3.7  Testing, inspection and evaluation of fuel \ninjection/engine management  system/components\n4. Resource \nimplications \nThe following resources should be provided: \n4.1  Workplace \n4.2  Appropriate tools and equipment  \n4.3 Materials relevant to the proposed activity and tasks\n5.  Method of \nassessment \nCompetency in this unit may be assessed through: \n5.1 Observation or Demonstration with Questioning \n5.2 Portfolio \n6.  Context of \nassessment \n6.1  Competency elements must be assessed on the job \nor in a simulated environment. \n6.2 The assessment of practical skills must take place \nafter a period of supervised practice and repetitive \nexperience.\n",
