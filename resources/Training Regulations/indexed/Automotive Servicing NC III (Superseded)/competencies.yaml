          "source_text": "(NOTE: All standard of performance for Service Auto LPG System is \nin accordance with company standard operating procedure and \nManufacturer’s Specification manuals using specified tools and \nequipment.)\n1. Service  electrical \nsystem \n1. 1 Servicing of electrical system such as starting/ \nignition system and its component is performed as \nper manufacturer’s manual using specified tools and \nequipment \n1.2 Servicing are completed without causing damage to  \nworkplace property or vehicle.\n2. Service ignition \ncomponents  \n2.1  Servicing of spark plug, contact points, rotor, \ndistributor cap, ignition switch is performed as per \nmanufacturer’s specifications/procedures   \n2.2 Engine is started as per standard operating  \n       procedure. \n2.3 Servicing of  ignition coil resistance is completed \n2.4 Servicing of  ignition timing is performed \n2.5 Ignition system/components are repaired without   \n      causing damage to other vehicle parts\n3. Service  \nvaporizer/mixer \n3.1 Servicing  are carried out to tune the vaporizer or \n      mixer using appropriate tools and techniques. \n3.2 Information is accessed and interpreted from \nappropriate manufacturer specifications \n3.3 Servicing are completed without causing damage to \nworkplace property or vehicle.\n4. Service  LPG fuel \nsystem \n4.1 LPG fuel system components are serviced \naccording to manual and specifications \n4.2 Fuel filter is replaced according to manufacturer’s \ninstructions, as needed  \n4.3 Servicing are completed without causing damage to \nany workplace property or vehicle. \n4.3 Occupational Health and Safety (OH & S) \nrequirements are observed throughout the work\n\n--- PDF PAGE 103 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n101 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Manual \nMay include: \n1.1 Philippine National Standards (PNS 115) \n1.2 DILG Act of 1990 (RA 6975) Rule 8, Section 50 \n1.3 Fire Code of the Phils. (PD 1185) Sect.8 and Rule 28 \n1.4 LPG Gas Code (NFPA 58) \n1.5 Manufacturer specification manual \n1.6 Maintenance procedure manual \n1.7 Periodic maintenance manual \n1.8 Service manual \n1.9 Parts Checklist \n1.10 LPG Conversion Kit Manual\n3. Tools and \nequipment  \nMay include: \n3.1 Hand tools, power tools,  \n3.2 Special equipment, measuring, testing  and lifting  \nequipment,  \n3.3 Testing instrument\n4. LPG fuel system \ncomponents \nMay include: \n4.1 Fuel filter and air cleaner \n4.2 Carburetor/EFI & SGI systems \n4.3 Fuel pump \n4.4 LPG Fuel Tank and Piping Line \n5. OH & S \nrequirements \nMay include: \n4.1 Workplace safety \n4.1.1protective clothing and equipment \n4.1.2 proper use of tools and equipment  \n4.1.3 handling of materials  \n4.1.4 use of fire fighting equipment  \n4.1.5 first-aid \n4.2 Environment safety \n4.2.1 hazard control \n4.2.2 hazardous material and substances \n4.2.3 waste disposal\n\n--- PDF PAGE 104 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n102"
