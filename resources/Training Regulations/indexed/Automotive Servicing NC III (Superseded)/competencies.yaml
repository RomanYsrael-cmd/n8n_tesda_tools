        "source_title": "REPAIR INSTRUMENTS AND WARNING SYSTEMS",
        "source_text": "--- PDF PAGE 90 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n88 \nUNIT OF COMPETENCY  :   REPAIR INSTRUMENTS AND WARNING SYSTEMS \nUNIT CODE \n \n   : ALT 723360 \nUNIT DESCRIPTOR            :   This unit covers the competence to test and repair \ninstrument and warning systems, including gauges, \nwarning lights (including dash lamps), engine \nshutdown systems, and audible reverse warning \nsystems. \nThe unit includes identification and confirmation of \nwork requirement, preparation for work, testing of \nsystems and identification of faults/causes, repair and \nretesting of instruments and warning systems and \ncompletion of work finalization processes, including \nclean-up and documentation.  \n \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables \n(NOTE: All standard of performance for this unit  is in accordance with company \nstandard  operating procedure and manufacturer’s specification manuals using \nspecified tools and equipment) \n1. Prepare for work\n \n1.1  Work instructions are used to determine job requirements, including \nmethod, process and equipment \n1.2  Job specifications are read and interpreted  \n1.3  Occupational Health and Safety (OH & S) requirements are \nobserved throughout the work \n1.4  Tools and equipment (including measuring/ test instruments) are \nidentified and checked for safe operation \n1.5 Procedures are identified to minimize task time\n2. Test systems / \ncomponents and \nidentify faults \n2.1  Correct information is accessed and interpreted from \nmanufacturer/component supplier specifications \n2.2 Tests are carried out to determine faults using tooling and techniques \n2.3 Tests are completed without causing damage to component or \nsystem \n2.4 Faults are identified and necessary repair actions are determined \n2.5 Tests are carried out according to industry regulations/guidelines, \nOH&S, legislation and enterprise procedures/policies\n3.  Repair instrument \nand warning \nsystems and or \nassociated \ncomponents \n \n3.1 Correct information is accessed and interpreted from \nmanufacturer/component supplier specifications \n3.2 Repairs, component replacement and adjustments are carried out \nusing tooling, techniques and materials \n3.3 Instrument and warning systems repairs are completed without \ncausing damage to component or system \n3.4 Retests are carried out to ensure correct and safe instrument and \nwarning system operation \n3.5 Repairs are carried out according to industry regulations/guidelines, \nOH&S, legislation and enterprise procedures/policies \n3.6  Workplace and equipment documents are completed in accordance \nwith site requirements      \n4.   Clean up work \narea and \nmaintain \nequipment \n4.1  Materials that can be reused is collected and stored\n4.2  Waste and scrap is removed following workplace procedures \n4.3  Equipment and work area are cleaned and inspected for serviceable \nconditions in accordance with workplace procedures \n4.4  Unserviceable equipment and faults identified are tagged in \naccordance with workplace procedures \n4.5  Maintenance is completed in accordance with \nmanufacturer/component supplier specifications and site procedures \n4.6  Tooling and equipment are maintained in accordance with \nWorkplace procedures\n\n--- PDF PAGE 91 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n89 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  OH & S     \n     requirements \nMay include: \n1.1 Workplace safety \n1.1.1  protective clothing and equipment \n1.1.2  proper use of tools and equipment  \n1.1.3  handling of materials  \n1.1.4  use of fire fighting equipment  \n1.1.7 first-aid \n1.2  Environment safety \n  1,2,1  hazard control \n1.2.2   hazardous material and substances \n1.2.3  waste disposal \n2. Tools and \nequipment \nMay include: \n2.1   Hand tools \n2.2   Testing equipment, including multi-meters \n2.3   Power tools \n2.4   Air tools \n2.5   Specialized tools for removal/adjustment \n2.6   Specialized system testers, oscilloscopes, scanner       \n        and LED test lights \n3.  Fault \nMay include: \n3.1  Gauge / instrument warning system not working \n3.2  Incorrect gauge/instrument readings \n3.3  Open, short and grounded circuits\n4.  Information \nMay include: \n4.1  Verbal or written and graphical instructions, signage,      \n work schedules/plans/specifications, work bulletins,     \n memos, material safety data sheets, diagrams or     \n sketches \n4.2  Safe work procedures related to the repair of instruments     \n       and warning systems  \n4.3  Regulatory/legislative requirements pertaining to \n       automotive industry practices \n4.4 Vehicle maker’s design specifications and instructions\n5.  Materials \n \nMay include: \n5.1  Spare parts  \n5.2  Cleaning materials\n\n--- PDF PAGE 92 ---\nAutomotive Servicing NC III (Amended)           Promulgated December 2013 \n90 \nEVIDENCE GUIDE \n \n1. Critical aspects        \n    of competency \nAssessment requires evidence that the candidate: \n1.1  Observed safety procedures and requirements \n1.2  Communicated effectively with others involved in or affected by the \nwork \n1.3  Selected methods and techniques appropriate to the circumstances \n1.4  Completed preparatory activity in a systematic manner \n1.5  Tested and retested of instruments and warning systems \n1.6  Repaired a range of instrument and warning systems to site and \nmanufacturer / component supplier requirements \n1.7  Completed workplace and equipment documents \n2. Required \nknowledge  \n2.1  OH&S regulations/requirement, equipment, material and personal \nsafety requirements \n2.2  Interpretation of technical material, graphic symbols and diagrams \n2.3  Construction and operation of instruments and warning systems \nrelevant to application \n2.4  Types and layout of service / repair manuals both hard and electronic \ncopies \n2.5  Repair and testing procedures \n2.6  Enterprise quality processes \n2.7  Quality procedures, e.g., 5S \n2.8  Environmental-conservation procedures,   \n        e.g., 3R (reduce, reuse, recycle) \n3. Required  skills \n3.1  Collecting, organizing and understanding information related to work \norders, plans and safety procedures for the repair of instruments and \nwarning systems \n3.2  Technical literacy and communication skills sufficient to interpret and \napply common industry terminology, and interpret technical \ninformation and specifications \n3.3  Interpreting and applying operational and safety information \n3.4  Planning and organizing activities, including preparation and layout of \nworksite and obtaining of equipment and material to avoid \nbacktracking or workflow interruptions \n3.5  Using mathematical ideas and techniques to correctly complete tests \nand measurements in order to determine electrical instrument and \nwarning system repair/replacement requirements  \n3.6  Manipulative and dexterity skills to perform instrument and warning \nsystem testing and repair / replacement procedures \n3.7 Problem-solving skills for a range of procedural issues \n3.8  Using workplace technology related to the repair of instruments and \nwarning systems, including the use of specialist tools and equipment, \nmeasuring equipment, computerized technology and communication \ndevices  \n3.9  Reporting/documenting of results \n4.   Resource \n      implications \nThe following resources should be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate Tools & equipment \n4.3 Materials relevant to the activity \n4.4 Manufacturer’s repair manual or related reference/ service materials \nor manuals \n4.5 Motor vehicle  \n4.6 Replacement units   \n5. Method of \nassessment \nCompetency in this unit may be assessed through: \n5.1 Direct observation with questioning \n5.2 Demonstration with questioning \n6. Context of \nassessment \n6.1 Competency may be assessed on the job or simulated environment. \n6.2 The assessment of practical skills must take place after a period of \nsupervised practice and repetitive experience.\n",
