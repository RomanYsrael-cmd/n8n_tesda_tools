alent instructions on safe working \npractice \n4.4. \nHazardous chemicals and/or dangerous goods \ninformation \n4.5. \nMaterials, tooling and equipment \n4.6.\nFirefighting appliances and fire test facilities\n5. Methods of \nAssessment \nCompetency in this unit may be assessed through:\n5.1    Portfolio Assessment  \n5.2    Interview \n5.3   Case Study/Situation\n6. Context for \nAssessment\n6.1\nCompetency may be assessed in the work place or in \na simulated work place setting",
