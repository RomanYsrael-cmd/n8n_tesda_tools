n\n--- PDF PAGE 110 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n108\n\n9. Repair\nInstruments and\nwarning\nsystems\n9.1 Prepare for work\n9.2 Test systems/components and\n identify faults\n9.3 Repair instrument and warning\n systems and or associated\n components\n9.4 Clean up work area and\nmaintain equipment\n•\nLecture/\nDiscussion\n•\nDemonstration\n•\nObservation\n\n•\nInterview\n•\nWritten exam\n•\nPractical\nDemonstration\n•\nDirect\nObservation\n10. Carry out\ndiagnostic\nprocedures\n10.1 Prepare to diagnose faults\n10.2 Apply technology to isolate\n fault(s)\n10.3 Recommend rectification\n method(s)\n10.4\nComponent / equipment is\n prepared for customer use\n•\nLecture/\nDiscussion\n•\nDemonstration\n•\nObservation\n\n•\nInterview\n•\nWritten exam\n•\nPractical\nDemonstration\n•\nDirect\nObservation\n\nELECTIVE COMPETENCIES\n\n1. Install LPG\n conversion kit\n1.1 Perform vehicle test\n1.2 Mount and install LPG\nConversion kit\n1.3 Install piping/hoses and safety\nfeatures of the kit\n•\nLecture/\nDiscussion\n•\nDemonstration\n•\nObservation\n\n•\nInterview\n•\nWritten exam\n•\nPractical\nDemonstration\n•\nDirect\nObservation\n\n2. Test and adjust\nLPG calibration\n2.1 Test electrical connections\n2.2 Adjust ignition system\n2.3 Adjust/Tune up vaporizer\n2.4 Check/Test LPG fuel system\n•\nLecture/\nDiscussion\n•\nDemonstration\n•\nObservation\n\n•\nInterview\n•\nWritten exam\n•\nPractical\nDemonstration\n•\nDirect\nObservation\n3. Service Auto\nLPG System\n3.1 Service electrical system\n3.2 Service ignition components\n3.3 Service vaporizer/mixer\n3.4 Service LPG fuel system\n•\nLecture/\nDiscussion\n•\nDemonstration\n•\nObservation\n\n•\nInterview\n•\nWritten exam\n•\nPractical\nDemonstration\n•\nDirect\nObservation\n\n--- PDF PAGE 111 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n109\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards\nand the curriculum modules;\n•\nAssessment is based in the collection of evidence of the performance\nof work to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by\nthe competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n--- PDF PAGE 112 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n110\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n•\nHolder of Automotive Servicing NC II\n•\ncan communicate both oral and written;\n•\ncan perform basic mathematical computation.\n\nAdditional requirements for LPG Retrofitting/Conversion or LPG Re-\npowering:\n•\nholder of Automotive Servicing NC II or equivalent qualification;\nor\n•\nwith at least two (2) years work experience in automotive\nservicing\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may\nbe required of the trainees by the school or training center delivering the\nTVET program.\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\nAUTOMOTIVE SERVICING NC III\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Automotive Servicing NC III\n\nTOOLS\nEQUIPMENT\n\nMATERIALS\nQTY\nQTY\nQTY\n4 units\nSoldering gun/iron\n4 units\nPower window assembly\n4 units\nCar alarm\n25 pcs. Goggles\n4 units\nMultimeter\n5 rolls\nAutomotive wire, #\n16 AWG\n 1 pc\n Oil filter remover\n(strap type)\n1 unit\nInjector cleaner\n10 rolls\nElectrical tape\n.16mmx 19mmx\n16m\n6 pcs\nScrew driver, one of\neach kind\n1 unit\nVehicle lifting equipment\n1 kg.\nHand cleaning\ndetergents\n2 sets\nBox wrench of 28 pcs,\n4mm-32mm\n4 units\nCreeper\n10 kg\nRugs\n2 sets\nOpen end wrench of\n28 pcs, 4mm-32mm\n4 units\nAutomatic transmission\n20 L\nA/T fluid\n2 sets\nSocket wrench 22\npcs.per set 6mm-26\nmm\n2 units\nTransmission jack\n20 L\nEngine oil\n6 pcs\nPliers(one in each\nkind)\n1 unit\nAir compressor with\naccessories\n10 tube Sealant /adhesive\n\n--- PDF PAGE 113 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n111\n\nTOOLS\nEQ