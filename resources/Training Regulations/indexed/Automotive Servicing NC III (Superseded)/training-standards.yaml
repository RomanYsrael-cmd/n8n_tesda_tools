    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE SERVICING\n\nNC Level NC III\n\nNominal Training Duration:\n20 Hours (Basic Competencies)\n\n40 Hours (Common Competencies)\n466 Hours (Core Competencies)\n526 Hrs.\n\n(Elective Competencies)\n70 Hours\n\nCourse Description:\n\n This course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive servicing in accordance with industry standards.\nIt covers core competencies such as; check, test, replace and repair electrical and\nmechanical system components of a motor vehicle such as auto air-conditioning and\nthe automatic transmission systems; It also covers testing and replacing electronic\ncomponents or devices in security and engine management systems. In addition\nLPG-fuel conversion competencies were included such as: Install LPG conversion\nkit; Test and adjust LPG calibration; service auto LPG system; and Remove and\nreplace auto engine and engine-related system for re-powering the vehicle.\n\nThis course is also designed to enhance the basic and common\nknowledge, skills and attitudes of an individual in the field of automotive servicing.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\ncommunication\n1.1 Communicate information about\nworkplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate issues\narising in the workplace\n\n•\nGroup\ndiscussion\n•\nRole Play\n•\nBrainstorming\n\n•\nObservation\n•\nInterviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities among\nmembers.\n2.3 Set performance expectation for\nteam members.\n2.4 Supervise team performance\n\n•\nLecture\n•\nDemonstration\n•\nSelf-paced\n(modular)\n•\nDemonstration\n•\nCase studies\n\n--- PDF PAGE 106 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n104\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant information in\nplanning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for agreement\n•\nDirect\nobservation\n•\nSimulation/role\nplaying\n•\nCase studies\n\n•\nWritten test\n•\nPractical/\nperformance test\n4. Solve\nworkplace\nproblem\nrelated to work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible cause/s\nof the problem.\n•\nDirect\nobservation\n•\nSimulation/role\nplaying\n•\nCase studies\n•\nWritten test\n•\nPractical/\nperformance test\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools and\ntechniques to solve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n•\nDirect\nobservation\n•\nSimulation/role\nplaying\n•\nCase studies\n\n•\nWritten test\n•\nPractical/\nperformance test\n6. Use relevant\ntechnologies\n6.1 Identify appropriate technology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n•\nDirect\nobservation\n•\nSimulation/role\nplaying\n•\nCase studies\n\n•\nWritten test\n•\nPractical/\nperformance test\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply\nappropriate\nsealant/\nadhesive\n1.1 Identify appropriate sealant/\nadhesive\n1.2 Prepare surface for sealant /\nadhesive application\n1.3 Store unused and dispose used\nsealant/adhesive\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n2. Move and\nposition vehicle\n2.1 Prepare vehicle for driving\n2.2 Move and position vehicle\n2.3 Check the vehicle\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n3. Perform\nmensuration\nand calculation\n3.1 Select measuring instrument and\ncarry out measurement and\ncalculations\n3.2 Maintain measuring instruments\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n\n--- PDF PAGE 107 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n105\n4. Read, interpret\nand apply\nspecifications\nand manual\n4.1 Identify/access manuals and\ninterpret data and specification\n4.2 Apply information accessed in\nmanual\n4.3 Store manual\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n5. Use and apply\nlubricant/\ncoolant\n5.1 Identify type of lubricant/\ncoolant\n5.2 Use and apply lubricant\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n6. Perform shop\nmaintenance\n6.1 Inspect/clean tools and work area\n6.2 Store/arrange tools and shop\nequipment\n6.3 Dispose waste/used lubricants\n6.4 Report damaged tools/equipment\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n7.Prepare job\nestimates\n7.1 Identify nature/scope of work\n7.2 Prepare and present estimates\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n8. Interpret/Draw\ntechnical\ndrawing\n8.1 Interpret technical drawing\n8.2 Select correct technical drawing\n8.3 Apply freehand sketching\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n9.Practice health,\nsafety and\nenvironment\nprocedures\n9.1 Apply basic safety procedures\n9.2 Apply emergency procedures\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n10.Inspect\ntechnical quality\nof work\n10.1\nGather information to carry\n out inspection\n10.2\nInspect and apply quality\n standards to work\n10.3\nAchieve quality work\n outcomes\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n\n--- PDF PAGE 108 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n106\n\n11.Maintain quality\nsystems\n11.1\nConduct final quality check on\n completed work/ orders\n11.2\nReport on the quality of\n processes and work\n outcomes\n11.3\nImplement improvements to\n work processes\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n12.Provide work\nskill instructions\n12.1\nOrganize instruction and\n demonstration\n12.2\nConduct instruction and\n demonstration\n12.3\nCheck training performance\n12.4\nReview personal training\n performance and finalize\n documentation\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n13.Identify and\nselect original\nautomotive parts\nand products\n13.1\nIdentify the part/ product and\n its end use\n13.2\nIdentify details of the part/\n product\n13.3\npart/ product is supplied or\n ordered for customer\n\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Test and repair\nelectrical\nsecurity system/\ncomponents\n1.1\nInstall electrical security\nsystem/components\n1.2\nTest and repair anti-theft\nsystem and components\n\n•\nDiscussion\n•\nDual training\n•\nDistance\nlearning\n\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n2. Service\nelectronic\nengine\nmanagement\nsystem\n2.1\nCheck electronic engine\nmanagement system and/or\nassociated components.\n2.2\nService electronic engine\nmanagement associated\nparts\n•\nDiscussion\n•\nDual training\n•\nDistance\nlearning\n\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n3.\nOverhaul\nengine and\nassociated\ncomponents\n3.1 Analyze engine failure.\n3.2 Pull down the engine.\n3.3 Disassemble engine parts and\ncomponents.\n3.4 Inspect engine parts and\ncomponents.\n3.5 Perform fitting of engine parts.\n3.6 Assemble engine parts and\ncomponents.\n3.7 Mount and test run engine.\n•\nDiscussion\n•\nDual training\n•\nDistance\nlearning\n\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n\n--- PDF PAGE 109 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n107\n\n4\nService\nautomatic\ntransmission\n4.1\nTroubleshoot automatic\ntransmission (A/T)\n4.2\nDismount automatic\ntransmission assembly.\n4.3\nDisassemble automatic\ntransmission.\n4.4\nConduct automatic\ntransmission parts analysis.\n4.5\nReplace automatic\ntransmission parks.\n4.6\nAssemble automatic\ntransmission.\n4.7\nMount install automatic\ntransmission assembly\n4.8\nTest automatic transmission\n4.9\nRoad test automatic\ntransmission.\n•\nDiscussion\n•\nDual training\n•\nDistance\nlearning\n\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n5\nPerform\nmaintenance\nservice check-\nup and repair\nair conditioning\nsystem\n5.1\nDiagnose AC system\n5.2\nService auto air conditioning\nsystem components.\n•\nDiscussion\n•\nDual training\n•\nDistance\nlearning\n\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n\n6. Remove and\nReplace\nautomotive\nengine and\nengine-related\nsystems\n6.1 Prepare for work\n6.2 Remove engine and/or related\nsystems\n6.3 Replace engine and/or related\nsystems\n6.4 Clean up work area\n•\nLecture/\nDiscussion\n•\nDemonstration\n•\nObservation\n\n•\nInterview\n•\nWritten exam\n•\nPractical\nDemonstration\n•\nDirect\nObservation\n7. Service and\nrepair\nelectronically\ncontrolled\nsteering\nsystems\n7.1 Prepare for work\n7.2 Service and adjust\n electronically controlled\n steering systems\n7.3 Rectify identified electronically\n controlled steering system\nfaults\n7.4 Test and confirm system faults\nafter rectification have been\ndone\n7.5 Clean up work area and\nmaintain equipment\n•\nLecture/\nDiscussion\n•\nDemonstration\n•\nObservation\n\n•\nInterview\n•\nWritten exam\n•\nPractical\nDemonstration\n•\nDirect\nObservation\n8. Service and\nrepair\nelectronically\ncontrolled\nsuspension\nsystems\n8.1 Prepare for work\n8.2 Service and adjust\n electronically controlled\n suspension systems\n8.3 Rectify identified electronically\n controlled suspension system\n faults\n8.3 Test and confirm system faults\nafter rectification have been\ndone\n8.5 Clean up work area and\nmaintain equipment\n•\nLecture/\nDiscussion\n•\nDemonstration\n•\nObservation\n\n•\nInterview\n•\nWritten exam\n•\nPractical\nDemonstration\n•\nDirect\nObservation\n\n--- PDF PAGE 110 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n108\n\n9. Repair\nInstruments and\nwarning\nsystems\n9.1 Prepare for work\n9.2 Test systems/components and\n identify faults\n9.3 Repair instrument and warning\n systems and or assoc