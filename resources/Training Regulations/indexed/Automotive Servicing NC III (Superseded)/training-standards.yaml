n1 pc\n• DILG Act of 1990\nRA 6975 Rule 8\nSec.50\n1 unit\nChain block\n1 gal.\nHand cleaner\n1 pc\n• Fire Code of the\nPhils. (PD1185)\nSec.8 and Rule 28\nEngines\n1 unit\nCarburetor/EFI &\nSGI system\n1 pc\n• LPG Gas Code\n(NFPA 58)\n1 unit\n•\nLiquefied Petroleum\nGas (LPG) engine\n1set\nIgnition system\ncomponents\n(spark plug,\ncontact points,\nrotor, distributor\ncap, ignition switch\nand high tension\ncables\n1 pc\n• Manufacturer’s\nspecification manual\n\n1 pc\n• Maintenance\nprocedure manual\n\n• Periodic maintenance\nmanual\n\n• Service manual\nParts checklist\n1 pc\nFuel filter and air\ncleaner\n• LPG conversion kit\nmanual\n1 liter\nLubricant cleaning\nmaterials\n10 liters\nLPG Fuel\n\n--- PDF PAGE 115 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n113\n3.5\nTRAINING FACILITIES\nAUTOMOTIVE SERVICING NC III\n\nThe automotive workshop must be made of reinforced concrete or steel\nstructure. The size must be suited on the requirements of the competencies. The\nclass size of 25 students/trainees is reserved for the lecture room and the practical\ndemonstration area for carrying out servicing of minor automotive parts. Most of the\nlearning activities such as on-vehicle servicing are performed in the workshop.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nWorkshop/Laboratory area\n\n150\nLecture Room\n\n28.00\n28.00\nLearning Resource Center\n\n20.00\n20.00\nWash/Comfort room\n\n10\n10\nStorage/Tool room\n\n20\n20\nCirculation Area\n\n60\nTotal Area\n\n288\n\nWorking Area for LPG Retrofitting/Conversion and Vehicle Re-powering\nName/Description\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nWorking Area\n( at least 4m x\n5m)\n20\n•\nOpen and well ventilated\n\n•\nWell lighted (Explosion proof )\n\n•\nPower Supply (220 volts) (Explosion proof)\n\nWorking Table with bench grinder\n(1m x 2m)\n\nFire extinguisher 20 lbs dry chemical\n\nWater Supply\n\n--- PDF PAGE 116 ---\nAutomotive Servicing NC II