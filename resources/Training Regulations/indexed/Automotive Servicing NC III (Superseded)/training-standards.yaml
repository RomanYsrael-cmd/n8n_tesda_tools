      "source_text": "AUTOMOTIVE SERVICING NC III\n\nThe automotive workshop must be made of reinforced concrete or steel\nstructure. The size must be suited on the requirements of the competencies. The\nclass size of 25 students/trainees is reserved for the lecture room and the practical\ndemonstration area for carrying out servicing of minor automotive parts. Most of the\nlearning activities such as on-vehicle servicing are performed in the workshop.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nWorkshop/Laboratory area\n\n150\nLecture Room\n\n28.00\n28.00\nLearning Resource Center\n\n20.00\n20.00\nWash/Comfort room\n\n10\n10\nStorage/Tool room\n\n20\n20\nCirculation Area\n\n60\nTotal Area\n\n288\n\nWorking Area for LPG Retrofitting/Conversion and Vehicle Re-powering\nName/Description\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nWorking Area\n( at least 4m x\n5m)\n20\n•\nOpen and well ventilated\n\n•\nWell lighted (Explosion proof )\n\n•\nPower Supply (220 volts) (Explosion proof)\n\nWorking Table with bench grinder\n(1m x 2m)\n\nFire extinguisher 20 lbs dry chemical\n\nWater Supply\n\n--- PDF PAGE 116 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n114",
