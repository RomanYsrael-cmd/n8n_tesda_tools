      "source_text": "3.5\nTRAINING FACILITIES\nAUTOMOTIVE SERVICING NC III\n\nThe automotive workshop must be made of reinforced concrete or steel\nstructure. The size must be suited on the requirements of the competencies. The\nclass size of 25 students/trainees is reserved for the lecture room and the practical\ndemonstration area for carrying out servicing of minor automotive parts. Most of the\nlearning activities such as on-vehicle servicing are performed in the workshop.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nWorkshop/Laboratory area\n\n150\nLecture Room\n\n28.00\n28.00\nLearning Resource Center\n\n20.00\n20.00\nWash/Comfort room\n\n10\n10\nStorage/Tool room\n\n20\n20\nCirculation Area\n\n60\nTotal Area\n\n288\n\nWorking Area for LPG Retrofitting/Conversion and Vehicle Re-powering\nName/Description\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nWorking Area\n( at least 4m x\n5m)\n20\n•\nOpen and well ventilated\n\n•\nWell lighted (Explosion proof )\n\n•\nPower Supply (220 volts) (Explosion proof)\n\nWorking Table with bench grinder\n(1m x 2m)\n\nFire extinguisher 20 lbs dry chemical\n\nWater Supply\n\n--- PDF PAGE 116 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n114\n3.6 TRAINERS’ QUALIFICATION\n\nAUTOMOTIVE/LAND TRANSPORT SECTOR\nAUTOMOTIVE SERVICING NC III\n\n• Holder of National TVET Trainers Certificate (NTTC) Level 1 -\nAutomotive Servicing NC III\n• Must be computer literate\n• *Must have at least 2 years job/industry experience\n\nAdditional requirements for trainor in LPG Retrofitting/Conversion or LPG\nRe-powering:\n• holder of a COC in LPG Retrofitting and/or LPG Re-powering"
