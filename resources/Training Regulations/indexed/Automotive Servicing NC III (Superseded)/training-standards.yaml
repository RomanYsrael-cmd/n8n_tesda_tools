C III (Amended) Promulgated December 2013\n114\n3.6 TRAINERS’ QUALIFICATION\n\nAUTOMOTIVE/LAND TRANSPORT SECTOR\nAUTOMOTIVE SERVICING NC III\n\n• Holder of National TVET Trainers Certificate (NTTC) Level 1 -\nAutomotive Servicing NC III\n• Must be computer literate\n• *Must have at least 2 years job/industry experience\n\nAdditional requirements for trainor in LPG Retrofitting/Conversion or LPG\nRe-powering:\n• holder of a COC in LPG Retrofitting and/or LPG Re-powering\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine\ntheir achievement of units of competency. A certificate of achievement\nis issued for each unit of competency.\n\n--- PDF PAGE 117 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n115"
