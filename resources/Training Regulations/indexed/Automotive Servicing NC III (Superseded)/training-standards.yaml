      "source_text": "SECTION 3. TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Automotive Servicing NC III.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE SERVICING\n\nNC Level NC III\n\nNominal Training Duration:\n20 Hours (Basic Competencies)\n\n40 Hours (Common Competencies)\n466 Hours (Core Competencies)\n526 Hrs.\n\n(Elective Competencies)\n70 Hours\n\nCourse Description:\n\n This course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive servicing in accordance with industry standards.\nIt covers core competencies such as; check, test, replace and repair electrical and\nmechanical system components of a motor vehicle such as auto air-conditioning and\nthe automatic transmission systems; It also covers testing and replacing electronic\ncomponents or devices in security and engine management systems. In addition\nLPG-fuel conversion competencies were included such as: Install LPG conversion\nkit; Test and adjust LPG calibration; service auto LPG system; and Remove and\nreplace auto engine and engine-related system for re-powering the vehicle.\n\nThis course is also designed to enhance the basic and common\nknowledge, skills and attitudes of an individual in the field of automotive servicing.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\ncommunication\n1.1 Communicate information about\nworkplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate issues\narising in the workplace\n\n•\nGroup\ndiscussion\n•\nRole Play\n•\nBrainstorming\n\n•\nObservation\n•\nInterviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities among\nmembers.\n2.3 Set performance expectation for\nteam members.\n2.4 Supervise team performance\n\n•\nLecture\n•\nDemonstration\n•\nSelf-paced\n(modular)\n•\nDemonstration\n•\nCase studies\n\n--- PDF PAGE 106 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n104\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant information in\nplanning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for agreement\n•\nDirect\nobservation\n•\nSimulation/role\nplaying\n•\nCase studies\n\n•\nWritten test\n•\nPractical/\nperformance test\n4. Solve\nworkplace\nproblem\nrelated to work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible cause/s\nof the problem.\n•\nDirect\nobservation\n•\nSimulation/role\nplaying\n•\nCase studies\n•\nWritten test\n•\nPractical/\nperformance test\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools and\ntechniques to solve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n•\nDirect\nobservation\n•\nSimulation/role\nplaying\n•\nCase studies\n\n•\nWritten test\n•\nPractical/\nperformance test\n6. Use relevant\ntechnologies\n6.1 Identify appropriate technology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n•\nDirect\nobservation\n•\nSimulation/role\nplaying\n•\nCase studies\n\n•\nWritten test\n•\nPractical/\nperformance test\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply\nappropriate\nsealant/\nadhesive\n1.1 Identify appropriate sealant/\nadhesive\n1.2 Prepare surface for sealant /\nadhesive application\n1.3 Store unused and dispose used\nsealant/adhesive\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n2. Move and\nposition vehicle\n2.1 Prepare vehicle for driving\n2.2 Move and position vehicle\n2.3 Check the vehicle\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n3. Perform\nmensuration\nand calculation\n3.1 Select measuring instrument and\ncarry out measurement and\ncalculations\n3.2 Maintain measuring instruments\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n\n--- PDF PAGE 107 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n105\n4. Read, interpret\nand apply\nspecifications\nand manual\n4.1 Identify/access manuals and\ninterpret data and specification\n4.2 Apply information accessed in\nmanual\n4.3 Store manual\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n5. Use and apply\nlubricant/\ncoolant\n5.1 Identify type of lubricant/\ncoolant\n5.2 Use and apply lubricant\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n6. Perform shop\nmaintenance\n6.1 Inspect/clean tools and work area\n6.2 Store/arrange tools and shop\nequipment\n6.3 Dispose waste/used lubricants\n6.4 Report damaged tools/equipment\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n7.Prepare job\nestimates\n7.1 Identify nature/scope of work\n7.2 Prepare and present estimates\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n8. Interpret/Draw\ntechnical\ndrawing\n8.1 Interpret technical drawing\n8.2 Select correct technical drawing\n8.3 Apply freehand sketching\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n9.Practice health,\nsafety and\nenvironment\nprocedures\n9.1 Apply basic safety procedures\n9.2 Apply emergency procedures\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n10.Inspect\ntechnical quality\nof work\n10.1\nGather information to carry\n out inspection\n10.2\nInspect and apply quality\n standards to work\n10.3\nAchieve quality work\n outcomes\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n\n--- PDF PAGE 108 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n106\n\n11.Maintain quality\nsystems\n11.1\nConduct final quality check on\n completed work/ orders\n11.2\nReport on the quality of\n processes and work\n outcomes\n11.3\nImplement improvements to\n work processes\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n12.Provide work\nskill instructions\n12.1\nOrganize instruction and\n demonstration\n12.2\nConduct instruction and\n demonstration\n12.3\nCheck training performance\n12.4\nReview personal training\n performance and finalize\n documentation\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n13.Identify and\nselect original\nautomotive parts\nand products\n13.1\nIdentify the part/ product and\n its end use\n13.2\nIdentify details of the part/\n product\n13.3\npart/ product is supplied or\n ordered for customer\n\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf-paced\n(modular)\n•\nDistance\nlearning\n•\nWritten test\n•\nOral\nquestioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Test and repair\nelectrical\nsecurity system/\ncomponents\n1.1\nInstall electrical security\nsystem/components\n1.2\nTest and repair anti-theft\nsystem and components\n\n•\nDiscussion\n•\nDual training\n•\nDistance\nlearning\n\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n2. Service\nelectronic\nengine\nmanagement\nsystem\n2.1\nCheck electronic engine\nmanagement system and/or\nassociated components.\n2.2\nService electronic engine\nmanagement associated\nparts\n•\nDiscussion\n•\nDual training\n•\nDistance\nlearning\n\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n3.\nOverhaul\nengine and\nassociated\ncomponents\n3.1 Analyze engine failure.\n3.2 Pull down the engine.\n3.3 Disassemble engine parts and\ncomponents.\n3.4 Inspect engine parts and\ncomponents.\n3.5 Perform fitting of engine parts.\n3.6 Assemble engine parts and\ncomponents.\n3.7 Mount and test run engine.\n•\nDiscussion\n•\nDual training\n•\nDistance\nlearning\n\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n\n--- PDF PAGE 109 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n107\n\n4\nService\nautomatic\ntransmission\n4.1\nTroubleshoot automatic\ntransmission (A/T)\n4.2\nDismount automatic\ntransmission assembly.\n4.3\nDisassemble automatic\ntransmission.\n4.4\nConduct automatic\ntransmission parts analysis.\n4.5\nReplace automatic\ntransmission parks.\n4.6\nAssemble automatic\ntransmission.\n4.7\nMount install automatic\ntransmission assembly\n4.8\nTest automatic transmission\n4.9\nRoad test automatic\ntransmission.\n•\nDiscussion\n•\nDual training\n•\nDistance\nlearning\n\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n5\nPerform\nmaintenance\nservice check-\nup and repair\nair conditioning\nsystem\n5.1\nDiagnose AC system\n5.2\nService auto air conditioning\nsystem components.\n•\nDiscussion\n•\nDual training\n•\nDistance\nlearning\n\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n\n6. Remove and\nReplace\nautomotive\nengine and\nengine-related\nsystems\n6.1 Prepare for work\n6.2 Remove engine and/or related\nsystems\n6.3 Replace engine and/or related\nsystems\n6.4 Clean up work area\n•\nLecture/\nDiscussion\n•\nDemonstration\n•\nObservation\n\n•\nInterview\n•\nWritten exam\n•\nPractical\nDemonstration\n•\nDirect\nObservation\n7. Service and\nrepair\nelectronically\ncontrolled\nsteering\nsystems\n7.1 Prepare for work\n7.2 Service and adjust\n electronically controlled\n steering systems\n7.3 Rectify identified electronically\n controlled steering system\nfaults\n7.4 Test and confirm system faults\nafter rectification have been\ndone\n7.5 Clean up work area and\nmaintain equipment\n•\nLecture/\nDiscussion\n•\nDemonstration\n•\nObservation\n\n•\nInterview\n•\nWritten exam\n•\nPractical\nDemonstration\n•\nDirect\nObservation\n8. Service and\nrepair\nelectronically\ncontrolled\nsuspension\nsystems\n8.1 Prepare for work\n8.2 Service and adjust\n electronically controlled\n suspension systems\n8.3 Rectify identified electronically\n controlled suspension system\n faults\n8.3 Test and confirm system faults\nafter rectification have been\ndone\n8.5 Clean up work area and\nmaintain equipment\n•\nLecture/\nDiscussion\n•\nDemonstration\n•\nObservation\n\n•\nInterview\n•\nWritten exam\n•\nPractical\nDemonstration\n•\nDirect\nObservation\n\n--- PDF PAGE 110 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n108\n\n9. Repair\nInstruments and\nwarning\nsystems\n9.1 Prepare for work\n9.2 Test systems/components and\n identify faults\n9.3 Repair instrument and warning\n systems and or associated\n components\n9.4 Clean up work area and\nmaintain equipment\n•\nLecture/\nDiscussion\n•\nDemonstration\n•\nObservation\n\n•\nInterview\n•\nWritten exam\n•\nPractical\nDemonstration\n•\nDirect\nObservation\n10. Carry out\ndiagnostic\nprocedures\n10.1 Prepare to diagnose faults\n10.2 Apply technology to isolate\n fault(s)\n10.3 Recommend rectification\n method(s)\n10.4\nComponent / equipment is\n prepared for customer use\n•\nLecture/\nDiscussion\n•\nDemonstration\n•\nObservation\n\n•\nInterview\n•\nWritten exam\n•\nPractical\nDemonstration\n•\nDirect\nObservation\n\nELECTIVE COMPETENCIES\n\n1. Install LPG\n conversion kit\n1.1 Perform vehicle test\n1.2 Mount and install LPG\nConversion kit\n1.3 Install piping/hoses and safety\nfeatures of the kit\n•\nLecture/\nDiscussion\n•\nDemonstration\n•\nObservation\n\n•\nInterview\n•\nWritten exam\n•\nPractical\nDemonstration\n•\nDirect\nObservation\n\n2. Test and adjust\nLPG calibration\n2.1 Test electrical connections\n2.2 Adjust ignition system\n2.3 Adjust/Tune up vaporizer\n2.4 Check/Test LPG fuel system\n•\nLecture/\nDiscussion\n•\nDemonstration\n•\nObservation\n\n•\nInterview\n•\nWritten exam\n•\nPractical\nDemonstration\n•\nDirect\nObservation\n3. Service Auto\nLPG System\n3.1 Service electrical system\n3.2 Service ignition components\n3.3 Service vaporizer/mixer\n3.4 Service LPG fuel system\n•\nLecture/\nDiscussion\n•\nDemonstration\n•\nObservation\n\n•\nInterview\n•\nWritten exam\n•\nPractical\nDemonstration\n•\nDirect\nObservation\n\n--- PDF PAGE 111 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n109\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards\nand the curriculum modules;\n•\nAssessment is based in the collection of evidence of the performance\nof work to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by\nthe competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n--- PDF PAGE 112 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n110\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n•\nHolder of Automotive Servicing NC II\n•\ncan communicate both oral and written;\n•\ncan perform basic mathematical computation.\n\nAdditional requirements for LPG Retrofitting/Conversion or LPG Re-\npowering:\n•\nholder of Automotive Servicing NC II or equivalent qualification;\nor\n•\nwith at least two (2) years work experience in automotive\nservicing\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may\nbe required of the trainees by the school or training center delivering the\nTVET program.\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\nAUTOMOTIVE SERVICING NC III\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Automotive Servicing NC III\n\nTOOLS\nEQUIPMENT\n\nMATERIALS\nQTY\nQTY\nQTY\n4 units\nSoldering gun/iron\n4 units\nPower window assembly\n4 units\nCar alarm\n25 pcs. Goggles\n4 units\nMultimeter\n5 rolls\nAutomotive wire, #\n16 AWG\n 1 pc\n Oil filter remover\n(strap type)\n1 unit\nInjector cleaner\n10 rolls\nElectrical tape\n.16mmx 19mmx\n16m\n6 pcs\nScrew driver, one of\neach kind\n1 unit\nVehicle lifting equipment\n1 kg.\nHand cleaning\ndetergents\n2 sets\nBox wrench of 28 pcs,\n4mm-32mm\n4 units\nCreeper\n10 kg\nRugs\n2 sets\nOpen end wrench of\n28 pcs, 4mm-32mm\n4 units\nAutomatic transmission\n20 L\nA/T fluid\n2 sets\nSocket wrench 22\npcs.per set 6mm-26\nmm\n2 units\nTransmission jack\n20 L\nEngine oil\n6 pcs\nPliers(one in each\nkind)\n1 unit\nAir compressor with\naccessories\n10 tube Sealant /adhesive\n\n--- PDF PAGE 113 ---\nAutomotive Servicing NC III (Amended) Promulgated December 2013\n111\n\nTOOLS\nEQUIPM