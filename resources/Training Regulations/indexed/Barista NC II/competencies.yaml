          "source_text": "1. Maintain espresso \nmachine \n1.1 \nBackflushing of espresso is performed according to the \ntype of machine. \n1.2 \nGroup head, gasket and porta filters are checked \nregularly. \n1.3 \nClean hot water is poured to the drip tray. \n1.4 \nSteam wand is cleaned and wiped with a clean and \nmoist rag. \n1.5 \nAppropriate food grade cleaning chemical is used to \nbackflush and descale espresso machine \n1.6 \nPorta filer and baskets are soaked in hot water to \nremove oils. \n1.7 \nGroup head and screen are brushed at the end of the \nday. \n1.8 \nWater softener filter is checked regularly. \n1.9 \nSuitable cleaning tools and materials are used to \nperform maintenance procedures of the machine. \n \n2. Clean doser grinder \n2.1 \nGrounds are brushed off from the bottom and exterior \npart of the grinder \n2.2 \nBean hopper is wiped with clean cloth or paper towel or \nwashed in warm water \n2.3 \nThe doser chamber or compartment (especially the \nchute area) is brushed out. \n2.4 \nGrinder blades are checked regularly. \n \n3. Care of small brewing \ndevices \n3.1 \nSmall brewers are cleaned right after use in accordance \nwith enterprise standards. \n3.2 \nSmall brewers are wiped dried before storage in \naccordance with enterprise standards. \n3.3 \nSmall brewers are stored in their proper places in \naccordance with enterprise standards. \n3.4 \nCeramics and glass brewers are washed and soaped \nafter use in accordance with enterprise standards. \n3.5 \nFilters of the small brewing apparatuses are checked for \ndamages.\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08 \nTR - Barista NC II                                                         Promulgated December 2013 \n-39- \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Food grade cleaning \nchemical \nMay include: \n1.1 \nCapsule form \n1.2 \nPowder form \n1.3 \nTablet form \n \n2. Cleaning tools and \nmaterials \nMay include : \n2.1 \nGrinder brush \n2.2 \nStiff bristle toothbrush 