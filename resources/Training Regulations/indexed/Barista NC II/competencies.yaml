          "source_text": "1. Set up and prepare \nmachine and \nequipment \n1.1 \nCups are pre-heated in accordance with enterprise \nstandards. \n1.2 \nPortafilter is wiped clean and dry before dosing. \n1.3 \nGrind of coffee is checked. \n1.4 \nEnough coffee is ground for the shot of espresso \n1.5 \nDrip tray is cleaned and dried. \n1.6 \nRags are prepared and used properly. \n \n2. Dose and Tamp \nCoffee \n2.1 \nThe appropriate amount of ground coffee is dosed in \nthe portafilter. \n2.2 \nAppropriate amount of pressure is applied to tamp \nthe ground beans \n2.3 \nGround coffee is tamped evenly. \n2.4 \nPortafilter sides and spouts are wiped and cleaned \nbefore inserting to the brew head \n2.5 \nSpillage and wastage of ground beans are minimized \nduring dosing and grinding. \n \n3. Extract espresso \n3.1 \nGroup head is flushed before inserting the portafilter \n3.2 \nPortafilter is inserted and coffee is brewed immediately \n3.3 \nVolume of espresso is checked  \n3.4 \nExtraction time of shot is monitored. \n3.5 \nCrema of shot is inspected. \n3.6 \nEspresso is served or used in a beverage immediately\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08 \nTR - Barista NC II                                                         Promulgated December 2013 \n-30- \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Grind of coffee \nMay include: \n1.1 \nCourse \n1.2 \nMedium \n1.3 \nFine \n1.4 \nPulverized \n \n2. Rags \nMay include: \n2.1 \nFor portafilter basket \n2.2 \nSteam wand \n2.3 \nDrip tray \n2.4 \nCups \n \n3. Appropriate amount of \nground coffee \nMay be between  \n7-9 grams for single shot and  \n14-18 grams for a double shot \n \n4. Appropriate amount of \npressure \n \nMay be between 30-50 lbs pressure \n5. Portafilter \nMay include: \n5.1 \nSingle spout portafilter \n5.2 \nDouble spout portafilter \n5.3 \nBlind portafilter \n \n6. Volume of espresso \nshot \nVolume of a shot of espresso may be between \n.85- 1.2 ounce ( 25-35ml)  \n \n7. Extraction time \nExtraction time of shots is between 20-30 seconds\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \nTR - Barista NC II                                                         Promulgated December 2013 \n-31-"
