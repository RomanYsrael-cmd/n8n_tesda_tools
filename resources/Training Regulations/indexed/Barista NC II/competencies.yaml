        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate.\n1.1\nMeasured the adequate amount of milk according to the\nkind of drink to be prepared.\n1.2\nUsed chilled milk.\n1.3\nSelected the correct size of steaming pitcher\n1.4\nFlushed and wiped the steam wand before and after\nsteaming milk\n1.5\nKept rags clean and moist.\n1.6\nListened to the sound of air being drawn into the milk.\n1.7\nStretched the milk according to the desired volume of\nfoam.\n1.8\nSteamed the milk to its desired texture\n1.9\nSteamed the milk at the ideal temperature.\n\n2. Required Knowledge\n2.1\nMilk types and Chemistry of milk\n2.2\nEspresso machine parts\n2.3\nMilk based coffee beverages\n\n3. Required Skills\n3.1\nMilk texturing and steaming\n\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1\nCommercial espresso machine\n4.2\nInstitutional coffee grinder\n4.3\nCoffee beans\n4.4\nCoffee bar tools and supplies (tamper, steaming\npitcher etc.)\n4.5\nMilk\n4.6\nChiller/ref or ice box with ice\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through :\n5.1\nWritten and/or oral questions to test candidate’s\nknowledge on the step by step procedure of steaming\nmilk; chemistry or composition of milk; its effect on the\ntexture and sweetness of the steamed milk etc.\n5.2\nPractical/Demonstration on steaming milk\n\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1\nWorkplace or simulated environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-35-\n\nUNIT OF COMPETENCY\n:\nPREPARE AND SERVE COFFEE BEVERAGES\n\nUNIT CODE\n:"
        },
        "source_text": "TRS3113100\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to\nsteam milk which is essential in the preparation of\nespresso-based beverages with milk like cappuccino\nand latte. It covers the two stages of steaming milk:\nfoaming and heating, at the desired temperature and\nconsistency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Prepare milk and\nequipment\n1.1\nMilk is chilled in accordance to appropriate temperature.\n1.2\nAdequate amount of milk is measured according to the\nkind of drink to be prepared.\n1.3\nCorrect (size of ) steaming pitcher is selected in\naccordance with enterprise standards\n1.4\nSteaming pitcher is chilled in accordance to appropriate\ntemperature.\n1.5\nSteam wand is flushed to remove condensed water.\n1.6\nSteam wand is wiped before steaming.\n1.7\nRags for the steam wand are kept clean and moist\n\n2. Foam milk\n2.1\nSteam wand is positioned at the right depth of the milk.\n2.2\nFull steam is applied when introducing air into the milk.\n2.3\nThe sound of air being drawn into the milk is\njudged/evaluated thru the hissing sound.\n2.4\nMilk is stretched according to the desired volume of\nfoam.\n2.5\nMilk is converted into microfoam.\n\n3. Steam milk\n3.1\nSteam wand is angled as appropriate to create a\nwhirlpool effect.\n3.2\nMilk is spun to achieve the desired consistency.\n3.3\nMilk is steamed at the ideal temperature for immediate\nconsumption.\n3.4\nSteam wand is shut off some 5 degrees before the\ndesired temperature.\n3.5\nSteam wand is flushed and wiped after steaming.\n3.6\nBig bubbles are removed by swirling and knocking the\npitcher on the counter.\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-33-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Steaming pitcher\nSize may include:\n1.1\n10 oz\n1.2\n12 oz\n1.3\n20 oz\n1.4\n32 oz\n\n2. Selection factors\nMay include but not limited to:\n2.1\nAmount of milk\n2.2\nSteam pressure/steam capacity of machine\n2.3\nSteam wand tip\n\n3. Desired volume of foam Volume of milk would have expanded to about:\n3.1 1/3 of original volume for latte and\n3.2 Doubled for cappuccino\n\n4. Desired consistency\n4.1\nSilky\n4.2\nVelvety\n4.3\nPouring consistency\n4.4\nNaturally sweet\n4.5\nGlossy\n4.6\nMicrofoam bubbles\n\n5. Ideal temperature\nIdeal temperature for steaming milk is between 140 to 160\ndegrees Fahrenheit\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-34-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate.\n1.1\nMeasured the adequate amount of milk according to the\nkind of drink to be prepared.\n1.2\nUsed chilled milk.\n1.3\nSelected the correct size of steaming pitcher\n1.4\nFlushed and wiped the steam wand before and after\nsteaming milk\n1.5\nKept rags clean and moist.\n1.6\nListened to the sound of air being drawn into the milk.\n1.7\nStretched the milk according to the desired volume of\nfoam.\n1.8\nSteamed the milk to its desired texture\n1.9\nSteamed the milk at the ideal temperature.\n\n2. Required Knowledge\n2.1\nMilk types and Chemistry of milk\n2.2\nEspresso machine parts\n2.3\nMilk based coffee beverages\n\n3. Required Skills\n3.1\nMilk texturing and steaming\n\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1\nCommercial espresso machine\n4.2\nInstitutional coffee grinder\n4.3\nCoffee beans\n4.4\nCoffee bar tools and supplies (tamper, steaming\npitcher etc.)\n4.5\nMilk\n4.6\nChiller/ref or ice box with ice\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through :\n5.1\nWritten and/or oral questions to test candidate’s\nknowledge on the step by step procedure of steaming\nmilk; chemistry or composition of milk; its effect on the\ntexture and sweetness of the steamed milk etc.\n5.2\nPractical/Demonstration on steaming milk\n\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1\nWorkplace or simulated environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-35-\n\nUNIT OF COMPETENCY\n:\nPREPARE AND SERVE COFFEE BEVERAGES\n\nUNIT CODE\n:"
