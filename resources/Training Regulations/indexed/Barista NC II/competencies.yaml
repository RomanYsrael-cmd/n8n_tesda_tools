  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section details the contents of the basic, common and core units of\ncompetency required in BARISTA NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311105\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace information\n1.1 Specific and relevant information is accessed from\nappropriate sources\n1.2 Effective questioning , active listening and speaking skills\nare used to gather and convey information\n1.3 Appropriate medium is used to transfer information and\nideas\n1.4 Appropriate non- verbal communication is used\n1.5 Appropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6 Defined workplace procedures for the location and\nstorage of information are used\n1.7 Personal interaction is carried out clearly and concisely\n\n2. Participate in\nworkplace meetings\nand discussions\n2.1 Team meetings are attended on time\n2.2 Own opinions are clearly expressed and those of others\nare listened to without interruption\n2.3 Meeting inputs are consistent with the meeting purpose\nand established protocols\n2.4 Workplace interactions are conducted in a courteous\nmanner\n2.5 Questions about simple routine workplace procedures\nand maters concerning working conditions of\nemployment are asked and responded to\n2.6 Meetings outcomes are interpreted and implemented\n\n3. Complete relevant\nwork related\ndocuments\n3.1 Range of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2 Workplace data is recorded on standard workplace forms\nand documents\n3.3 Basic mathematical processes are used for routine\ncalculations\n3.4 Errors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5 Reporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\nTR - Barista NC II Promulgated December 2013\n-3-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety\nreports\n\n5. Workplace\ninteractions\n5.1\nFace to face\n5.2\nTelephone\n5.3\nElectronic and two way radio\n5.4\nWritten including electronic, memos, instruction and\nforms, non-verbal including gestures, signals, signs and\ndiagrams\n\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 6 ---\nTR - Barista NC II Promulgated December 2013\n-4-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard\nformat of the organization\n1.2\nAccessed information using communication equipment\n1.3\nMade use of relevant terms as an aid to transfer\ninformation effectively\n1.4\nConveyed information effectively adopting the formal or\ninformal communication\n\n2. Required knowledge\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the\nindividual’s work responsibilities\n\n3. Required Skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple\nwritten notices\n3.3\nParticipate in workplace meetings and discussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace\nmeasures\n3.6\nBasic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7\nAbility to relate to people of social range in the\nworkplace\n3.8\nGather and provide information in response to\nworkplace requirements\n\n4. Resource\nImplications\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n\n5. Methods of\nAssessment\n5.1\nDirect Observation\n5.2\nOral interview and written test\n\n6. Context of\nAssessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 7 ---\nTR - Barista NC II Promulgated December 2013\n-5-\n\nUNIT OF COMPETENCY :\nWORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n:\n500311106\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1\nThe role and objective of the team is identified from\navailable sources of information\n1.2\nTeam parameters, reporting relationships and\nresponsibilities are identified from team discussions and\nappropriate external sources\n\n2. Identify own role and\nresponsibility within\nteam\n2.1\nIndividual role and responsibilities within the team\nenvironment are identified\n2.2\nRoles and responsibility of other team members are\nidentified and recognized\n2.3\nReporting relationships within team and external to team\nare identified\n\n3. Work as a team\nmember\n3.1\nEffective and appropriate forms of communications used\nand interactions undertaken with team members who\ncontribute to known team activities and objectives\n3.2\nEffective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3\nObserved protocols in reporting using standard\noperating procedures\n3.4\nContribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the members.\n\n--- PDF PAGE 8 ---\nTR - Barista NC II Promulgated December 2013\n-6-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1\nWork activities in a team environment with enterprise or\nspecific sector\n1.2\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n\n2. Sources of information 2.1\nStandard operating and/or other workplace procedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 9 ---\nTR - Barista NC II Promulgated December 2013\n-7-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n\n2. Required Knowledge\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n\n3. Required Skills\n3.1\nCommunicate appropriately, consistent with the culture\nof the workplace\n\n4. Resource Implications The following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or tasks\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to the\nwork activities of the group\n5.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 10 ---\nTR - Barista NC II Promulgated December 2013\n-8-\n\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2\nIntra- and interpersonal relationships are maintained in\nthe course of managing oneself based on performance\nevaluation\n1.3\nCommitment to the organization and its goal is\ndemonstrated in the performance of duties\n\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve personal,\nteam and organizational goals and objectives.\n2.2\nResources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3\nPractices along economic use and maintenance of\nequipment and facilities are followed as per established\nprocedures\n\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified and\navailed of based on job requirements\n3.2\nRecognitions are sought/received and demonstrated\nas proof of career advancement\n3.3\nLicenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 11 ---\nTR - Barista NC II Promulgated December 2013\n-9-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance Appraisal\n1.2\nPsychological Profile\n1.3\nAptitude Tests\n\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2\nServing as Resource Persons in conferences and\nworkshops\n\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of Appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and Intangible Rewards\n\n5. Licenses and/or\ncertifications\n5.1\nNational Certificates\n5.2\nCertificate of Competency\n5.3\nSupport Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 12 ---\nTR - Barista NC II Promulgated December 2013\n-10-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3\nCompleted trainings and career opportunities which are\nbased on the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n\n2. Required Knowledge\n2.1\nWork values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n\n3. Required Skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 13 ---\nTR - Barista NC II Promulgated December 2013\n-11-\n\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE\n:\n500311108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard\ncontrol practices and procedures are clarified and\nexplained based on organization procedures\n1.2\nHazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to\nco-workers, workplace and environment in accordance\nwith organization procedures\n1.3\nContingency measures during workplace accidents,\nfire and other emergencies are recognized and\nestablished in accordance with organization procedures\n\n2. Evaluate hazards and\nrisks\n2.1\nTerms of maximum tolerable limits which when\nexceeded will result in harm or damage are identified\nbased on threshold limit values (TLV)\n2.2\nEffects of the hazards are determined\n2.3\nOHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and relevant\nworkplace OHS legislation\n\n3. Control hazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2\nProcedures for dealing with workplace accidents, fire\nand emergencies are followed in accordance with\norganization OHS policies\n3.3\nPersonal protective equipment (PPE) is correctly\nused in accordance with organization OHS procedures\nand practices\n3.4\nAppropriate assistance is provided in the event of a\nworkplace emergency in accordance with established\norganization protocol\n\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2\nOHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 14 ---\nTR - Barista NC II Promulgated December 2013\n-12-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n\n2. Hazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4\nErgonomics\n2.4.1\nPsychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n2.4.2\nPhysiological factors – monotony, personal\nrelationship, work out cycle\n\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\nCalling emergency personnel\n\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n\n6. OHS personal records\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 15 ---\nTR - Barista NC II Promulgated December 2013\n-13-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and\nhazard control practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5\nFollowed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7\nCompleted and updated OHS personal records in\naccordance with workplace requirements\n\n2. Required Knowledge\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n\n3. Required Skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n\n4. Resource Implications\nThe following resources must be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-14-\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nDEVELOP AND UPDATE INDUSTRY KNOWLEDGE\n\nUNIT CODE\n:\nTRS311201\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nand attitude required to access, increase and update\nindustry knowledge. It includes seek information on the\nindustry and update industry knowledge\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Seek information on\nthe industry\n1.1\nSources of information on the industry are correctly\nidentified and accessed\n1.2\nInformation to assist effective work performance is\nobtained in line with job requirements\n1.3\nSpecific information on sector of work is accessed and\nupdated\n1.4\nIndustry information is correctly applied to day-to-day\nwork activities\n\n2. Update industry\nknowledge\n2.1\nInformal and/or formal research is used to update\ngeneral knowledge of the industry\n2.2\nUpdated knowledge is shared with customers and\ncolleagues as appropriate and incorporated into day-to-\nday working activities\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-15-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information sources\nMay include:\n1.1\nmedia\n1.2\nreference books\n1.3\nlibraries\n1.4\nunions\n1.5\nindustry associations\n1.6\nindustry journals\n1.7\ninternet\n1.8\npersonal observation and experience\n\n2. Information to assist\neffective work\nperformance\nMay include:\n2.1\ndifferent sectors of the industry and the services\navailable in each sector\n2.2\nrelationship between tourism and hospitality\n2.3\nrelationship between the industry and other\nindustries\n2.4\nindustry working conditions\n2.5\nlegislation that affects the industry\n2.5.1\nliquor\n2.5.2\nhealth and safety\n2.5.3\nhygiene\n2.5.4\ngaming\n2.5.5\nworkers compensation\n2.5.6\nconsumer protection\n2.5.7\nduty of care\n2.5.8\nbuilding regulations\n2.6\ntrade unions environmental issues and\nrequirements\n2.7\nindustrial relations issues and major\norganizations\n2.8\ncareer opportunities within the industry\n2.9\nwork ethic required to work in the industry and\nindustry expectations of staff\n2.10 quality assurance\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-16-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate/ trainee :\n1.1\nKnew key sources of information on the industry\n1.2\nUpdated industry knowledge\n1.3\nAccessed and used industry information\n\n2. Required Knowledge\n2.1\nOverview of quality assurance in the industry\n2.2\nRole of individual staff members\n2.3\nIndustry information sources\n\n3. Required Skills\n3.1\nTime management\n3.2\nReady skills needed to access industry information\n3.3\nBasic competency skills needed to access the internet\n\n4. Resource Implications The following resources should be provided:\n4.1\nSources of information on the industry\n4.2\nIndustry knowledge\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nInterview/questions\n5.2\nPractical demonstration\n5.3\nPortfolio of industry information related to trainee’s work\n\n6. Context of\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-17-\n\nUNIT OF COMPETENCY :\nOBSERVE WORKPLACE HYGIENE PROCEDURES\n\nUNIT CODE\n:\nTRS311202\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nand attitudes in observing workplace hygiene procedures.\nIt includes following hygiene procedures and identifying\nand preventing hygiene risks.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Follow hygiene\nprocedures\n1.1\nWorkplace hygiene procedures are implemented in\nline with enterprise and legal requirements\n1.2\nHandling and storage of items are undertaken in line\nwith enterprise and legal requirements\n\n2. Identify and prevent\nhygiene risks\n2.1\nPotential hygiene risks are identified in line with\nenterprise procedures\n2.2\nAction to minimize and remove risks are taken within\nscope of individual responsibility of enterprise/legal\nrequirements\n2.3\nHygiene risks beyond the control of individual staff\nmembers are reported to the appropriate person for\nfollow up\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-18-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hygiene procedures\nMay include :\n1.1\nsafe and hygienic handling of food and beverage\n1.2\nregular hand washing\n1.3\ncorrect food storage\n1.4\nappropriate and clean clothing\n1.5\navoidance of cross-contamination\n1.6\nsafe handling disposal of linen and laundry\n1.7\nappropriate handling and disposal of garbage\n1.8\ncleaning and sanitizing procedures\n1.9\npersonal hygiene\n\n2. Hygiene risk\nMay include:\n2.1\nbacterial and other contamination arising from poor\nhandling of food\n2.2\ninappropriate storage of foods\n2.3\nstorage at incorrect temperatures\n2.4\nfoods left uncovered\n2.5\npoor personal hygiene practices\n2.6\npoor work practices\n2.6.1 cleaning\n2.6.2 housekeeping\n2.6.3 food handling\n2.6.4 vermin\n2.6.5 airborne dust\n2.7\ncross-contamination through cleaning inappropriate\ncleaning practices\n2.8\ninappropriate handling of potentially infectious linen\n2.9\ncontaminated wastes such as blood and body\nsecretions\n2.10 disposal of garbage and contaminated or potentially\ncontaminated wastes\n\n3. Minimizing or\nremoving risk\nMay include:\n3.1\nauditing staff skills and providing training\n3.2\nensuring policies and procedures are followed strictly\n3.3\naudits or incidents with follow up actions\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-19-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment required evidence that the candidate :\n1.1\nFollowed hygiene procedures\n1.2\nIdentified and responded to hygiene risk\n1.3\nPracticed personal grooming and hygiene\n\n2. Required Knowledge\n2.1\nTypical hygiene and control procedures in the hospitality\nand tourism industries\n2.2\nOverview of legislation and regulation in relation to food\nhandling, personal and general hygiene\n2.3\nKnowledge on factors which contribute to workplace\nhygiene problems\n2.4\nGeneral hazards in handling of food, linen and laundry\nand garbage, including major causes of contamination\nand cross-infection\n2.5\nSources of and reasons for food poisoning\n\n3. Required Skills\n3.1\nAbility to follow correct procedures and instructions\n3.2\nAbility to handle operating tools/ equipment\n3.3\nApplication to hygiene principles\n\n4. Resource Implications The following resources should be provided:\n4.1\nHygiene procedures, actual or simulated workplace,\nproducts used in hotel/restaurant /tourism workplace\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nWritten examination\n5.2\nPractical demonstration\n\n6. Context of\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-20-\n\nUNIT OF COMPETENCY :\nPERFORM COMPUTER OPERATIONS\n\nUNIT CODE\n:\nTRS311203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and\nvalues needed to perform computer operations which\nincludes inputting, accessing, producing and transferring\ndata using the appropriate hardware and software\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntask to be undertaken\n1.1\nRequirements of task are determined\n1.2\nAppropriate hardware and software is selected\naccording to task assigned and required outcome\n1.3\nTask is planned to ensure OH & S guidelines and\nprocedures are followed\n\n2. Input data into\ncomputer\n2.1\nData are entered into the computer using appropriate\nprogram/application in accordance with company\nprocedures\n2.2\nAccuracy of information is checked and information is\nsaved in accordance with standard operating\nprocedures\n2.3\nInputted data are stored in storage media according to\nrequirements\n2.4\nWork is performed within ergonomic guidelines\n\n3. Access information\nusing computer\n3.1\nCorrect program/application is selected based on job\nrequirements\n3.2\nProgram/application containing the information required\nis accessed according to company procedures\n3.3\nDesktop icons are correctly selected, opened and\nclosed for navigation purposes\n3.4\nKeyboard techniques are carried out in line with OH & S\nrequirements for safe use of keyboards\n\n4. Produce/output data\nusing computer\nsystem\n4.1\nEntered data are processed using appropriate software\ncommands\n4.2\nData are printed out as required using computer\nhardware/peripheral devices in accordance with\nstandard operating procedures\n4.3\nFiles and data are transferred between compatible\nsystems using computer software, hardware/ peripheral\ndevices in accordance with standard operating\nprocedures\n\n5. Maintain computer\nequipment and\nsystems\n5.1\nSystems for cleaning, minor maintenance and\nreplacement of consumables are implemented\n5.2\nProcedures for ensuring security of data, including\nregular back-ups and virus checks are implemented in\naccordance with standard operating procedures\n5.3\nBasic file maintenance procedures are implemented in\nline with the standard operating procedures\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-21-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and\nperipheral devices\nMay include:\n1.1\nPersonal computers\n1.2\nNetworked systems\n1.3\nCommunication equipment\n1.4\nPrinters\n1.5\nScanners\n1.6\nKeyboard\n1.7\nMouse\n\n2. Software\nMay include:\n2.1\nWord processing packages\n2.2\nData base packages\n2.3\nInternet\n2.4\nSpreadsheets\n\n3. OH & S guidelines\nMay include:\n3.1\nOHS guidelines\n3.2\nEnterprise procedures\n\n4. Storage media\nMay include:\n4.1\ndiskettes\n4.2\nCDs\n4.3\nzip disks\n4.4\nhard disk drives, local and remote\n\n5. Ergonomic guidelines\nMay include:\n5.1\nTypes of equipment used\n5.2\nAppropriate furniture\n5.3\nSeating posture\n5.4\nLifting posture\n5.5\nVisual display unit screen brightness\n\n6. Desktop icons\nMay include:\n6.1\ndirectories/folders\n6.2\nfiles\n6.3\nnetwork devices\n6.4\nrecycle bin\n\n7. Maintenance\nMay include:\n7.1\nCreating more space in the hard disk\n7.2\nReviewing programs\n7.3\nDeleting unwanted files\n7.4\nBacking up files\n7.5\nChecking hard drive for errors\n7.6\nUsing up to date anti-virus programs\n7.7\nCleaning dust from internal and external surfaces\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-22-\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nSelected and used hardware components correctly and\naccording to the task requirement\n1.2\nIdentified and explain the functions of both hardware\nand software used, their general features and\ncapabilities\n1.3\nProduced accurate and complete data in accordance\nwith the requirements\n1.4\nUsed appropriate devices and procedures to transfer\nfiles/data accurately\n1.