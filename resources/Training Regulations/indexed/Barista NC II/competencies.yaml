roper places in \naccordance with enterprise standards. \n3.4 \nCeramics and glass brewers are washed and soaped \nafter use in accordance with enterprise standards. \n3.5 \nFilters of the small brewing apparatuses are checked for \ndamages.\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08 \nTR - Barista NC II                                                         Promulgated December 2013 \n-39- \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Food grade cleaning \nchemical \nMay include: \n1.1 \nCapsule form \n1.2 \nPowder form \n1.3 \nTablet form \n \n2. Cleaning tools and \nmaterials \nMay include : \n2.1 \nGrinder brush \n2.2 \nStiff bristle toothbrush \n2.3 \nScrewdrivers \n2.4 \nCleaning espresso machine chemical \n2.5 \nLint-free cloth/rags \n \n3. Grinder blades \nMay include: \n3.1 \nFlat burrs \n3.2 \nConical burrs \n3.3 \nBlades  \n \n4. Damages \nMay include: \n4.1 \nHoles \n4.2 \nTears \n4.3 \nClogs \n4.4 \nWorn out\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08 \nTR - Barista NC II                                                         Promulgated December 2013 \n-40- \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate \n1.1 \nDemonstrated the steps and procedures of backflushing \n1.2 \nProvided  information about the parts if the espresso \nand doser grinder \n1.3 \nDemonstrated screwing and unscrewing back group \nhead screen \n1.4 \nSeparated and put parts back of espresso grinder \n \n2. Required Knowledge \n2.1 \nDifferent types of coffee machines and grinders \n2.2 \nMachine parts \n2.3 \nGrinder parts \n2.4 \nBackflush \n2.5 \nBasic maintenance and trouble shooting \n \n3. Required Skills \n3.1 \nBackflushing \n \n4. Resource  \nImplications \n \nThe following resources should be provided: \n4.1 \nCommercial espresso machine \n4.2 \nInstitutional coffee grinder \n4.3 \nCleaning tools and materials \n4.4 \nCleaning chemical \n \n5. Methods of \nAssessment     \n \nCompetency in this unit may be assessed through : \n5.1 \nWritten and/or oral questions to test candidate’s \nknowledge on espresso cleaning and maintenance \n5.2 \nPractical/demonstration on backflushing and cleaning \nof group head. \n \n6. Context of \nAssessment \nAssessment must be conducted in  \n6.1 \nWorkplace or simulated environment or \n6.2 \nTESDA accredited assessment center/venue\n",
