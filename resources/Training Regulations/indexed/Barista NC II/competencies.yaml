and attitudes in providing effective customer service. It\nincludes greeting customer, identifying customer needs,\ndelivering service to customer, handling queries through\ntelephone, fax machine, internet and email and handling\ncomplaints, evaluation and recommendation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Greet customer\n1.1\nGuests are greeted in line with enterprise procedure\n1.2\nVerbal and non-verbal communications are appropriate\nto the given situation\n1.3\nNon verbal communication of customer is observed\nresponding to customer\n1.4\nSensitivity to cultural and social differences is\ndemonstrated\n\n2. Identify customer\nneeds\n2.1\nAppropriate interpersonal skills are used to ensure\nthat customer needs are accurately identified\n2.2\nCustomer needs are assessed for urgency so that\npriority for service delivery can be identified\n2.3\nCustomers are provided with information\n2.4\nPersonal limitation in addressing customer needs is\nidentified and where appropriate, assistance is sought\nfrom supervisor\n\n3. Deliver service to\ncustomer\n3.1\nCustomer needs are promptly attended to in line with\nenterprise procedure\n3.2\nAppropriate rapport is maintained with customer to\nenable high quality service delivery\n3.3\nOpportunity to enhance the quality of service and\nproducts are taken wherever possible\n\n4. Handle queries\nthrough telephone, fax\nmachine, internet and\nemail\n4.1\nUse telephone, computer, fax machine, internet\nefficiently to determine customer requirements\n4.2\nQueries/ information are recorded in line with enterprise\nprocedure\n4.3\nQueries are acted upon promptly and correctly in line\nwith enterprise procedure\n\n5. Handle complaints,\nevaluation and\nrecommendations\n5.1\nGuests are greeted with a smile and eye-to-eye contact\n5.2\nResponsibility for resolving the complaint is taken within\nlimit of responsibility\n5.3\nNature and details of complaint are established and\nagreed with the customer\n5.4\nAppropriate action is taken to resolve the complaint to\nthe customers satisfaction wherever possible\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-27-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Non-verbal\ncommunication\nMay include:\n1.1\nbody language\n1.2\ndress and accessories\n1.3\ngestures and mannerisms\n1.4\nvoice tonality and volume\n1.5\nuse of space\n1.6\nculturally specific communication customs and practices\n\n2. Cultural and social\ndifferences\nMay include:\n2.1\nmodes of greeting, farewelling and conversation\n2.2\nbody language/ use of body gestures\n2.3\nformality of language\n\n3. Interpersonal skills\nMay include:\n3.1\ninteractive communication\n3.2\npublic relation\n3.3\ngood working attitude\n3.4\nsincerity\n3.5\npleasant disposition\n3.6\neffective communication skills\n\n4. Customer needs\nMay include :\n4.1\nthose with a disability\n4.2\nthose with special cultural or language needs\n4.3\nunaccompanied children\n4.4\nparents with young children\n4.5\npregnant women\n4.6\nsingle women\n\n5. Enterprise procedure\nMay include :\n5.1\nmodes of greeting and farewell\n5.2\naddressing the person by name\n5.3\ntime-lapse before a response\n5.4\nstyle manual requirements\n5.5\nstandard letters and proforma\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-28-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nComplied with industry practices and procedures\n1.2\nUsed interactive communication with others\n1.3\nComplied with occupational, health and safety practices\n1.4\nPromoted public relation among others\n1.5\nComplied with service manual standards\n1.6\nDemonstrated familiarity with company facilities,\nproducts and services\n1.7\nApplied company rules and standards\n1.8\nApplied telephone ethics\n1.9\nApplied correct procedure in using telephone, fax\nmachine, internet\n1.10 Handled customer complaints\n\n2. Required Knowledge\nand Attitude\n2.1\nCommunication\n2.1.1 Interactive communication with others\n2.1.2 Interpersonal skills/ social graces with\nsincerity\n2.2\nSafety Practices\n2.2.1 Safe work practices\n2.2.2 Personal hygiene\n2.3\nAttitude\n2.3.1 Attentive, patient and cordial\n2.3.2 Eye-to-eye contact\n2.3.3 Maintain teamwork and cooperation\n2.4\nTheory\n2.4.1 Selling/upselling techniques\n2.4.2 Interview techniques\n2.4.3 Conflict resolution\n2.4.4 Communication process\n2.4.5 Communication barriers\n\n3. Required Skills\n3.1\nEffective communication skills\n3.2\nNon-verbal communication - body language\n3.3\nGood time management\n3.4\nAbility to work calmly and unobtrusively effectively\n3.5\nAbility to handle telephone inquiries and conversations\n3.6\nCorrect procedure in handling telephone inquiries\n3.7\nProper way of handling complaints\n\n4. Resource Implications The following resources should be provided:\n4.1\nAvailability of telephone, fax machine, internet, etc.\n4.2\nAvailability of data on projects and services; tariff and\nrates, promotional activities in place etc.\n4.3\nAvailability of office supplies\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nWritten examination\n5.2\nPractical demonstration\n\n6. Context for\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-29-\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nPREPARE ESPRESSO\n\nUNIT CODE\n:\nTRS311399\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge and skills of\npreparing the perfect shot of espresso based on the\nparameters provided herein.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Set up and prepare\nmachine and\nequipment\n1.1\nCups are pre-heated in accordance with enterprise\nstandards.\n1.2\nPortafilter is wiped clean and dry before dosing.\n1.3\nGrind of coffee is checked.\n1.4\nEnough coffee is ground for the shot of espresso\n1.5\nDrip tray is cleaned and dried.\n1.6\nRags are prepared and used properly.\n\n2. Dose and Tamp\nCoffee\n2.1\nThe appropriate amount of ground coffee is dosed in\nthe portafilter.\n2.2\nAppropriate amount of pressure is applied to tamp\nthe ground beans\n2.3\nGround coffee is tamped evenly.\n2.4\nPortafilter sides and spouts are wiped and cleaned\nbefore inserting to the brew head\n2.5\nSpillage and wastage of ground beans are minimized\nduring dosing and grinding.\n\n3. Extract espresso\n3.1\nGroup head is flushed before inserting the portafilter\n3.2\nPortafilter is inserted and coffee is brewed immediately\n3.3\nVolume of espresso is checked\n3.4\nExtraction time of shot is monitored.\n3.5\nCrema of shot is inspected.\n3.6\nEspresso is served or used in a beverage immediately\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-30-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Grind of coffee\nMay include:\n1.1\nCourse\n1.2\nMedium\n1.3\nFine\n1.4\nPulverized\n\n2. Rags\nMay include:\n2.1\nFor portafilter basket\n2.2\nSteam wand\n2.3\nDrip tray\n2.4\nCups\n\n3. Appropriate amount of\nground coffee\nMay be between\n7-9 grams for single shot and\n14-18 grams for a double shot\n\n4. Appropriate amount of\npressure\n\nMay be between 30-50 lbs pressure\n5. Portafilter\nMay include:\n5.1\nSingle spout portafilter\n5.2\nDouble spout portafilter\n5.3\nBlind portafilter\n\n6. Volume of espresso\nshot\nVolume of a shot of espresso may be between\n.85- 1.2 ounce ( 25-35ml)\n\n7. Extraction time\nExtraction time of shots is between 20-30 seconds\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-31-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1\nPre-heated cups before making the shot of espresso\n1.2\nWiped the portafilter clean and dry before dosing\n1.3\nDosed the correct amount and tamped coffee properly\n1.4\nWiped and cleaned portafilter sides and spouts before\ninserting to the brew head\n1.5\nFlushed the group head before inserting the portafilter\n1.6\nInserted portafilter and brewed coffee immediately\n1.7\nChecked volume of espresso\n1.8\nMonitored extraction time of shot.\n1.9\nInspected the crema of the espresso.\n1.10 Served or used the espresso immediately\n\n2. Required Knowledge\n2.1\nTypes of coffee grind\n2.2\nTypes of commercially viable coffee beans\n2.3\nRoast levels\n2.4\nEspresso extraction\n2.5\nParts of an espresso\n2.6\nEspresso machine parts\n\n3. Required Skills\n3.1\nGrinder calibration\n3.2\nDosing and tamping\n3.3\nExtracting a perfect shot of espresso\n\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1 Commercial espresso machine\n4.2 Institutional coffee grinder\n4.3 Coffee beans\n4.4 Coffee bar tools and supplies (tamper, brush etc.)\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through :\n5.1 Written and/or oral questions to test candidate’s\nknowledge on coffee beans, types of grind, espresso\nextraction etc\n5.2 Practical/Demonstration on extracting a perfect shot of\nespresso.\n\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1 Workplace or simulated environment or\n6.2 TESDA accredited assessment center/venue\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-32-\n\nUNIT OF COMPETENCY\n:\nTEXTURE MILK\n\nUNIT CODE\n:\nTRS3113100\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to\nsteam milk which is essential in the preparation of\nespresso-based beverages with milk like cappuccino\nand latte. It covers the two stages of steaming milk:\nfoaming and heating, at the desired temperature and\nconsistency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Prepare milk and\nequipment\n1.1\nMilk is chilled in accordance to appropriate temperature.\n1.2\nAdequate amount of milk is measured according to the\nkind of drink to be prepared.\n1.3\nCorrect (size of ) steaming pitcher is selected in\naccordance with enterprise standards\n1.4\nSteaming pitcher is chilled in accordance to appropriate\ntemperature.\n1.5\nSteam wand is flushed to remove condensed water.\n1.6\nSteam wand is wiped before steaming.\n1.7\nRags for the steam wand are kept clean and moist\n\n2. Foam milk\n2.1\nSteam wand is positioned at the right depth of the milk.\n2.2\nFull steam is applied when introducing air into the milk.\n2.3\nThe sound of air being drawn into the milk is\njudged/evaluated thru the hissing sound.\n2.4\nMilk is stretched according to the desired volume of\nfoam.\n2.5\nMilk is converted into microfoam.\n\n3. Steam milk\n3.1\nSteam wand is angled as appropriate to create a\nwhirlpool effect.\n3.2\nMilk is spun to achieve the desired consistency.\n3.3\nMilk is steamed at the ideal temperature for immediate\nconsumption.\n3.4\nSteam wand is shut off some 5 degrees before the\ndesired temperature.\n3.5\nSteam wand is flushed and wiped after steaming.\n3.6\nBig bubbles are removed by swirling and knocking the\npitcher on the counter.\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-33-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Steaming pitcher\nSize may include:\n1.1\n10 oz\n1.2\n12 oz\n1.3\n20 oz\n1.4\n32 oz\n\n2. Selection factors\nMay include but not limited to:\n2.1\nAmount of milk\n2.2\nSteam pressure/steam capacity of machine\n2.3\nSteam wand tip\n\n3. Desired volume of foam Volume of milk would have expanded to about:\n3.1 1/3 of original volume for latte and\n3.2 Doubled for cappuccino\n\n4. Desired consistency\n4.1\nSilky\n4.2\nVelvety\n4.3\nPouring consistency\n4.4\nNaturally sweet\n4.5\nGlossy\n4.6\nMicrofoam bubbles\n\n5. Ideal temperature\nIdeal temperature for steaming milk is between 140 to 160\ndegrees Fahrenheit\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-34-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate.\n1.1\nMeasured the adequate amount of milk according to the\nkind of drink to be prepared.\n1.2\nUsed chilled milk.\n1.3\nSelected the correct size of steaming pitcher\n1.4\nFlushed and wiped the steam wand before and after\nsteaming milk\n1.5\nKept rags clean and moist.\n1.6\nListened to the sound of air being drawn into the milk.\n1.7\nStretched the milk according to the desired volume of\nfoam.\n1.8\nSteamed the milk to its desired texture\n1.9\nSteamed the milk at the ideal temperature.\n\n2. Required Knowledge\n2.1\nMilk types and Chemistry of milk\n2.2\nEspresso machine parts\n2.3\nMilk based coffee beverages\n\n3. Required Skills\n3.1\nMilk texturing and steaming\n\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1\nCommercial espresso machine\n4.2\nInstitutional coffee grinder\n4.3\nCoffee beans\n4.4\nCoffee bar tools and supplies (tamper, steaming\npitcher etc.)\n4.5\nMilk\n4.6\nChiller/ref or ice box with ice\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through :\n5.1\nWritten and/or oral questions to test candidate’s\nknowledge on the step by step procedure of steaming\nmilk; chemistry or composition of milk; its effect on the\ntexture and sweetness of the steamed milk etc.\n5.2\nPractical/Demonstration on steaming milk\n\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1\nWorkplace or simulated environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-35-\n\nUNIT OF COMPETENCY\n:\nPREPARE AND SERVE COFFEE BEVERAGES\n\nUNIT CODE\n:\nTRS3113101\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required in the\npreparation of standard coffee beverages, both hot and\ncold using the espresso machine and the other brewing\nmethods like syphon, pour over and French press.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Take orders of guests\n1.1\nOrders are taken and verified with guests or dining\nservice crew.\n1.2\nRecommendations are offered to the guest on selection\nof coffee beverages.\n1.3\nGeneral information about the coffee beans are\nprovided to guests\n1.4\nMise-en-place for coffee service is completed\naccording to establishment’s standards and procedures.\n\n2. Prepare espresso-\nbased beverages\n2.1\nHot and cold espresso-based beverages are\nprepared according to standard recipes of the\nestablishments.\n2.2\nOnly good/perfect shots of espresso are served or\nused in the beverages.\n2.3\nAppropriate cups/glasses and accessories are selected\naccording to the beverage ordered.\n2.4\nEspresso beverages are served immediately.\n\n3. Prepare and serve\nbrewed coffee\n3.1\nBrewed coffee is prepared according to the brewing\nmethod desired by the guest.\n3.2\nCoffee is brewed according to ideal brewing time of the\nmethod\n3.3\nCoffee beans are weighed or measured according to\nbrewing method.\n3.4\nBrewed coffee is served immediately.\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-36-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Coffee beans\ninformation\nMay include :\n1.1\nVariety\n1.2\nOrigin\n1.3\nCoffee Blend\n1.4\nRoast level\n1.5\nCoffee grind\n\n2. Mis-en-place\nMay include:\n2.1\n Preparing machine or brewing equipment\n2.2\n Setting cups, saucers, accessories\n2.3\n Supplies/condiments\n\n3. Hot and cold espresso-\nbased beverages\nMay include:\nHot\n3.1\nEspresso\n3.2\nAmericano\n3.3\nCappuccino\n3.4\nCafé Latte\n3.5\nCafé Mocha\nCold\n3.6\nMocha Frappe\n3.7\nIce Café Latte\n3.8\nIced Café Mocha\n\n4. Perfect shot of\nespresso\n4.1 Espresso shot within the parameters:\n4.2 Amount of ground coffee: Between 7-9 grams\n4.3 Volume: .Between 25-35 ml\n4.4 Water temperature: Between 195-205 degrees F\n4.5 Atm pressure: Between 9-10 bars\n4.6 Extraction time: 20-30 seconds\n\n5. Coffee cups/glasses\nMay include:\n5.1\nEspresso cups/demitasse\n5.2\nCappuccino cups\n5.3\nLatte cups\n5.4\nIrish glass\n5.5\nParfait\n\n6. Brewing method\nMay include:\n6.1\nFrench Press/Plunger\n6.2\nSyphon\n6.3\nPourover\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-37-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1\nProvided general information about the coffee beans to\nthe guest\n1.2\nPrepared hot and cold espresso-based beverages\n1.3\nServed beverages immediately\n1.4\nBrewed coffee with the used of the different brewing\nmethods\n\n2. Required Knowledge\n2.1\nCoffee growing countries\n2.2\nCoffee varieties\n2.3\nBasic espresso beverages\n2.4\nBrewing methods\n\n3. Required Skills\n3.1\nExtracting espresso\n3.2\nBrewing coffee\n\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1\nCommercial espresso machine\n4.2\nInstitutional coffee grinder\n4.3\nCoffee beans\n4.4\nCoffee bar tools and supplies\n4.5\nMilk\n4.6\nBrewing equipment\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through :\n5.1\nWritten and/or oral questions to test candidate’s\nknowledge on espresso and espresso based\nbeverages; brewing methods\n5.2\nPractical/Demonstration on preparing the basic\nespresso-based beverages and brewing coffee using\nthe different brewing methods\n\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1\nWorkplace or simulated environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-38-\n\nUNIT OF COMPETENCY\n:\nPERFORM BASIC MAINTENANCE OF MACHINES\nAND EQUIPMENT\n\nUNIT CODE\n:\nTRS3113102\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge and skills required in\nthe regular maintenance of the espresso machine and\nother coffee equipment including cleaning and standard\noperating procedures that must be performed before\nand after operating the machines and equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Maintain espresso\nmachine\n1.1\nBackflushing of espresso is performed according to the\ntype of machine.\n1.2\nGroup head, gasket and porta filters are checked\nregularly.\n1.3\nClean hot water is poured to the drip tray.\n1.4\nSteam wand is cleaned and wiped with a clean and\nmoist rag.\n1.5\nAppropriate food grade cleaning chemical is used to\nbackflush and descale espresso machine\n1.6\nPorta filer and baskets are soaked in hot water to\nremove oils.\n1.7\nGroup head and screen are brushed at the end of the\nday.\n1.8\nWater softener filter is checked regularly.\n1.9\nSuitable cleaning tools and materials are used to\nperform maintenance procedures of the machine.\n\n2. Clean doser grinder\n2.1\nGrounds are brushed off from the bottom and exterior\npart of the grinder\n2.2\nBean hopper is wiped with clean cloth or paper towel or\nwashed in warm water\n2.3\nThe doser chamber or compartment (especially the\nchute area) is brushed out.\n2.4\nGrinder blades are checked regularly.\n\n3. Care of small brewing\ndevices\n3.1\nSmall brewers are cleaned right after use in accordance\nwith enterprise standards.\n3.2\nSmall brewers are wiped dried before storage in\naccordance with enterprise standards.\n3.3\nSmall brewers are stored in their proper places in\naccordance with enterprise standards.\n3.4\nCeramics and glass brewers are washed and soaped\nafter use in accordance with enterprise standards.\n3.5\nFilters of the small brewing apparatuses are checked for\ndamages.\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-39-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Food grade cleaning\nchemical\nMay include:\n1.1\nCapsule form\n1.2\nPowder form\n1.3\nTablet form\n\n2. Cleaning tools and\nmaterials\nMay include :\n2.1\nGrinder brush\n2.2\nStiff bristle toothbrush\n2.3\nScrewdrivers\n2.4\nCleaning espresso machine chemical\n2.5\nLint-free cloth/rags\n\n3. Grinder blades\nMay include:\n3.1\nFlat burrs\n3.2\nConical burrs\n3.3\nBlades\n\n4. Damages\nMay include:\n4.1\nHoles\n4.2\nTears\n4.3\nClogs\n4.4\nWorn out\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-40-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1\nDemonstrated the steps and procedures of backflushing\n1.2\nProvided information about the parts if the espresso\nand doser grinder\n1.3\nDemonstrated screwing and unscrewing back group\nhead screen\n1.4\nSeparated and put parts back of espresso grinder\n\n2. Required Knowledge\n2.1\nDifferent types of coffee machines and grinders\n2.2\nMachine parts\n2.3\nGrinder parts\n2.4\nBackflush\n2.5\nBasic maintenance and trouble shooting\n\n3. Required Skills\n3.1\nBackflushing\n\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1\nCommercial espresso machine\n4.2\nInstitutional coffee grinder\n4.3\nCleaning tools and materials\n4.4\nCleaning chemical\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through :\n5.1\nWritten and/or oral questions to test candidate’s\nknowledge on espresso cleaning and maintenance\n5.2\nPractical/demonstration on backflushing and cleaning\nof group head.\n\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1\nWorkplace or simulated environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-41-\n\nUNIT OF COMPETENCY\n:\nPERFORM BASIC CASHIERING AND GENERAL\nCONTROL PROCEDURES\n\nUNIT CODE\n:\nTRS3113103\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the know ledge and skills required to\nperform basic cashiering function as well as carry out\ngeneral control procedures including stock/inventory\ncontrol.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Operate Electronic\nCash register (ECR)\nor Point of sales\nsystem (POS)\n1.1\nECR or POS is prepared before operation following\nstandard procedures\n1.2\nBusiness transactions are entered and recorded in\naccordance with enterprise standards.\n1.3\nReports are generated at the end of the shift in\naccordance with enterprise standards.\n1.4\nNew item data are entered into the system in\naccordance with enterprise standard operating\nprocedures.\n1.5\nBack up data base are made in accordance with\nenterprise standards.\n\n2. Receive payments\n2.1\nCash is received and counted in accordance with\nenterprise accounting procedures.\n2.2\nChange is given and counted in front of the guest in\naccordance with enterprise accounting procedures.\n2.3\nReceipts/tapes are printed out and given to guest in\naccordance with enterprise accounting procedures.\n\n3. Handle Change Funds\nand Petty Cash\n3.1\nCash funds are secured in accordance with enterprise\nstandard procedures\n3.2\nCash count reports are prepared in accordance with\nenterprise standard procedures.\n3.3\nExpenses are monitored and recorded in accordance\nwith enterprise standard procedures.\n\n4. Maintain par stock of\nitems\n4.1\nBeginning and ending inventory are conducted before\nand after operations in accordance with enterprise\ninventory procedures\n4.2\nStocks are requested according to enterprise standard\nprocedures\n4.3\nIssued stock items are checked against requisition\ndocuments in accordance with enterprise procedures\n4.4\nStock levels are monitored in accordance with par\nstocking procedures.\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-42-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. ECR or POS is\nprepared\nMay include:\n1.1\nTurning on machine and checking peripherals\n1.2\nAcquire opening reading or reset of machine\n1.3\nPut cash (cash fund) into the cash tray\n\n2. Business Transactions May include:\n2.1\nordering\n2.2\nReceiving\n2.3\nInvoicing\n2.4\nSales\n\n3. Reports\nMay include:\n3.1\nInventory\n3.2\nSpoilage\n3.3\nVoid\n3.4\nSales\n\n4. Stocks\nMay include:\n4.1\nCoffee beans\n4.2\nMilk\n4.3\nSugar\n4.4\nBar supplies\n4.5\nFlavored Syrups\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-43-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1\nDemonstrated knowledge on the operation of POS or\nECR\n1.2\nAccomplished reports\n1.3\nFollowed procedures in daily sales reporting\n1.4\nFollowed procedures in securing cash and inventory\n\n2. Required Knowledge\n2.1\nStandard POS features\n2.2\nPolicies and procedures related to cash handling\n2.3\nBenefits/uses of POS\n2.4\nPar stock\n2.5\nInventory control\n\n3. Required Skills\n3.1\nComputer skills\n3.2\nAccounting skills\n3.3\nStocking skills\n3.4\nOperating ECR or POS\n\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1\nPOS\n4.2\nSales reports.forms\n4.3\nOrder slips\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through :\n5.1\nWritten and/or oral questions to test candidate’s\nknowledge on POS system\n5.2\nPractical/demonstration on simulated business\ntransaction.\n\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1\nWorkplace or simulated environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 46 ---\nTR - Barista NC II Promulgated December 2013\n-44-"
