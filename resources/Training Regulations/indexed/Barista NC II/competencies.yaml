        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1\nDemonstrated the steps and procedures of backflushing\n1.2\nProvided information about the parts if the espresso\nand doser grinder\n1.3\nDemonstrated screwing and unscrewing back group\nhead screen\n1.4\nSeparated and put parts back of espresso grinder\n\n2. Required Knowledge\n2.1\nDifferent types of coffee machines and grinders\n2.2\nMachine parts\n2.3\nGrinder parts\n2.4\nBackflush\n2.5\nBasic maintenance and trouble shooting\n\n3. Required Skills\n3.1\nBackflushing\n\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1\nCommercial espresso machine\n4.2\nInstitutional coffee grinder\n4.3\nCleaning tools and materials\n4.4\nCleaning chemical\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through :\n5.1\nWritten and/or oral questions to test candidate’s\nknowledge on espresso cleaning and maintenance\n5.2\nPractical/demonstration on backflushing and cleaning\nof group head.\n\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1\nWorkplace or simulated environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-41-\n\nUNIT OF COMPETENCY\n:\nPERFORM BASIC CASHIERING AND GENERAL\nCONTROL PROCEDURES\n\nUNIT CODE\n:"
        },
        "source_text": "TRS3113102\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge and skills required in\nthe regular maintenance of the espresso machine and\nother coffee equipment including cleaning and standard\noperating procedures that must be performed before\nand after operating the machines and equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Maintain espresso\nmachine\n1.1\nBackflushing of espresso is performed according to the\ntype of machine.\n1.2\nGroup head, gasket and porta filters are checked\nregularly.\n1.3\nClean hot water is poured to the drip tray.\n1.4\nSteam wand is cleaned and wiped with a clean and\nmoist rag.\n1.5\nAppropriate food grade cleaning chemical is used to\nbackflush and descale espresso machine\n1.6\nPorta filer and baskets are soaked in hot water to\nremove oils.\n1.7\nGroup head and screen are brushed at the end of the\nday.\n1.8\nWater softener filter is checked regularly.\n1.9\nSuitable cleaning tools and materials are used to\nperform maintenance procedures of the machine.\n\n2. Clean doser grinder\n2.1\nGrounds are brushed off from the bottom and exterior\npart of the grinder\n2.2\nBean hopper is wiped with clean cloth or paper towel or\nwashed in warm water\n2.3\nThe doser chamber or compartment (especially the\nchute area) is brushed out.\n2.4\nGrinder blades are checked regularly.\n\n3. Care of small brewing\ndevices\n3.1\nSmall brewers are cleaned right after use in accordance\nwith enterprise standards.\n3.2\nSmall brewers are wiped dried before storage in\naccordance with enterprise standards.\n3.3\nSmall brewers are stored in their proper places in\naccordance with enterprise standards.\n3.4\nCeramics and glass brewers are washed and soaped\nafter use in accordance with enterprise standards.\n3.5\nFilters of the small brewing apparatuses are checked for\ndamages.\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-39-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Food grade cleaning\nchemical\nMay include:\n1.1\nCapsule form\n1.2\nPowder form\n1.3\nTablet form\n\n2. Cleaning tools and\nmaterials\nMay include :\n2.1\nGrinder brush\n2.2\nStiff bristle toothbrush\n2.3\nScrewdrivers\n2.4\nCleaning espresso machine chemical\n2.5\nLint-free cloth/rags\n\n3. Grinder blades\nMay include:\n3.1\nFlat burrs\n3.2\nConical burrs\n3.3\nBlades\n\n4. Damages\nMay include:\n4.1\nHoles\n4.2\nTears\n4.3\nClogs\n4.4\nWorn out\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-40-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1\nDemonstrated the steps and procedures of backflushing\n1.2\nProvided information about the parts if the espresso\nand doser grinder\n1.3\nDemonstrated screwing and unscrewing back group\nhead screen\n1.4\nSeparated and put parts back of espresso grinder\n\n2. Required Knowledge\n2.1\nDifferent types of coffee machines and grinders\n2.2\nMachine parts\n2.3\nGrinder parts\n2.4\nBackflush\n2.5\nBasic maintenance and trouble shooting\n\n3. Required Skills\n3.1\nBackflushing\n\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1\nCommercial espresso machine\n4.2\nInstitutional coffee grinder\n4.3\nCleaning tools and materials\n4.4\nCleaning chemical\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through :\n5.1\nWritten and/or oral questions to test candidate’s\nknowledge on espresso cleaning and maintenance\n5.2\nPractical/demonstration on backflushing and cleaning\nof group head.\n\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1\nWorkplace or simulated environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-41-\n\nUNIT OF COMPETENCY\n:\nPERFORM BASIC CASHIERING AND GENERAL\nCONTROL PROCEDURES\n\nUNIT CODE\n:"
