        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate \n1.1 \nPre-heated cups before making the shot of espresso \n1.2 \nWiped the portafilter clean and dry before dosing  \n1.3 \nDosed the correct amount and tamped coffee properly \n1.4 \nWiped and cleaned portafilter sides and spouts before \ninserting to the brew head \n1.5 \nFlushed the group head before inserting the portafilter \n1.6 \nInserted portafilter and brewed coffee immediately \n1.7 \nChecked volume of espresso \n1.8 \nMonitored extraction time of shot. \n1.9 \nInspected the crema of the espresso. \n1.10 Served or used the espresso immediately \n \n2. Required Knowledge \n2.1 \nTypes of coffee grind \n2.2 \nTypes of commercially viable coffee beans \n2.3 \nRoast levels \n2.4 \nEspresso extraction \n2.5 \nParts of an espresso \n2.6 \nEspresso machine parts \n \n3. Required Skills \n3.1 \nGrinder calibration \n3.2 \nDosing and tamping \n3.3 \nExtracting a perfect shot of espresso \n \n4. Resource  \nImplications \n \nThe following resources should be provided: \n4.1  Commercial espresso machine \n4.2 Institutional coffee grinder \n4.3 Coffee beans \n4.4 Coffee bar tools and supplies (tamper, brush etc.) \n \n5. Methods of \nAssessment     \n \nCompetency in this unit may be assessed through : \n5.1 Written and/or oral questions to test candidate’s \nknowledge on coffee beans, types of grind, espresso \nextraction etc \n5.2 Practical/Demonstration on extracting a perfect shot of \nespresso. \n \n6. Context of \nAssessment \nAssessment must be conducted in  \n6.1 Workplace or simulated environment or \n6.2 TESDA accredited assessment center/venue",
