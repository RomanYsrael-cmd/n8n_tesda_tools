        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1\nDemonstrated knowledge on the operation of POS or\nECR\n1.2\nAccomplished reports\n1.3\nFollowed procedures in daily sales reporting\n1.4\nFollowed procedures in securing cash and inventory\n\n2. Required Knowledge\n2.1\nStandard POS features\n2.2\nPolicies and procedures related to cash handling\n2.3\nBenefits/uses of POS\n2.4\nPar stock\n2.5\nInventory control\n\n3. Required Skills\n3.1\nComputer skills\n3.2\nAccounting skills\n3.3\nStocking skills\n3.4\nOperating ECR or POS\n\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1\nPOS\n4.2\nSales reports.forms\n4.3\nOrder slips\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through :\n5.1\nWritten and/or oral questions to test candidate’s\nknowledge on POS system\n5.2\nPractical/demonstration on simulated business\ntransaction.\n\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1\nWorkplace or simulated environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 46 ---\nTR - Barista NC II Promulgated December 2013\n-44-"
        },
        "source_text": "TRS3113103\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the know ledge and skills required to\nperform basic cashiering function as well as carry out\ngeneral control procedures including stock/inventory\ncontrol.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Operate Electronic\nCash register (ECR)\nor Point of sales\nsystem (POS)\n1.1\nECR or POS is prepared before operation following\nstandard procedures\n1.2\nBusiness transactions are entered and recorded in\naccordance with enterprise standards.\n1.3\nReports are generated at the end of the shift in\naccordance with enterprise standards.\n1.4\nNew item data are entered into the system in\naccordance with enterprise standard operating\nprocedures.\n1.5\nBack up data base are made in accordance with\nenterprise standards.\n\n2. Receive payments\n2.1\nCash is received and counted in accordance with\nenterprise accounting procedures.\n2.2\nChange is given and counted in front of the guest in\naccordance with enterprise accounting procedures.\n2.3\nReceipts/tapes are printed out and given to guest in\naccordance with enterprise accounting procedures.\n\n3. Handle Change Funds\nand Petty Cash\n3.1\nCash funds are secured in accordance with enterprise\nstandard procedures\n3.2\nCash count reports are prepared in accordance with\nenterprise standard procedures.\n3.3\nExpenses are monitored and recorded in accordance\nwith enterprise standard procedures.\n\n4. Maintain par stock of\nitems\n4.1\nBeginning and ending inventory are conducted before\nand after operations in accordance with enterprise\ninventory procedures\n4.2\nStocks are requested according to enterprise standard\nprocedures\n4.3\nIssued stock items are checked against requisition\ndocuments in accordance with enterprise procedures\n4.4\nStock levels are monitored in accordance with par\nstocking procedures.\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-42-\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. ECR or POS is\nprepared\nMay include:\n1.1\nTurning on machine and checking peripherals\n1.2\nAcquire opening reading or reset of machine\n1.3\nPut cash (cash fund) into the cash tray\n\n2. Business Transactions May include:\n2.1\nordering\n2.2\nReceiving\n2.3\nInvoicing\n2.4\nSales\n\n3. Reports\nMay include:\n3.1\nInventory\n3.2\nSpoilage\n3.3\nVoid\n3.4\nSales\n\n4. Stocks\nMay include:\n4.1\nCoffee beans\n4.2\nMilk\n4.3\nSugar\n4.4\nBar supplies\n4.5\nFlavored Syrups\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\nTR - Barista NC II Promulgated December 2013\n-43-\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1\nDemonstrated knowledge on the operation of POS or\nECR\n1.2\nAccomplished reports\n1.3\nFollowed procedures in daily sales reporting\n1.4\nFollowed procedures in securing cash and inventory\n\n2. Required Knowledge\n2.1\nStandard POS features\n2.2\nPolicies and procedures related to cash handling\n2.3\nBenefits/uses of POS\n2.4\nPar stock\n2.5\nInventory control\n\n3. Required Skills\n3.1\nComputer skills\n3.2\nAccounting skills\n3.3\nStocking skills\n3.4\nOperating ECR or POS\n\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1\nPOS\n4.2\nSales reports.forms\n4.3\nOrder slips\n\n5. Methods of\nAssessment\n\nCompetency in this unit may be assessed through :\n5.1\nWritten and/or oral questions to test candidate’s\nknowledge on POS system\n5.2\nPractical/demonstration on simulated business\ntransaction.\n\n6. Context of\nAssessment\nAssessment must be conducted in\n6.1\nWorkplace or simulated environment or\n6.2\nTESDA accredited assessment center/venue\n\n--- PDF PAGE 46 ---\nTR - Barista NC II Promulgated December 2013\n-44-"
