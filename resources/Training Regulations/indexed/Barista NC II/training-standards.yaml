    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title:\n Barista\n\nNC Level: NC II\n\nNominal Training Duration: 18 Hrs. (Basic)\n 18 Hrs. (Common)\n 142 Hrs. (Core)\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills and attitude in BARISTA\nNC II in accordance with industry standards. It covers core competencies on preparing\nespresso, texture milk, prepare and serve coffee beverages, perform basic maintenance\nof machines and equipment and perform basic cashiering and general control\nprocedures..\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant\nwork related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion\nGroup\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a\nteam member\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and\ndevelopment\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 47 ---\nTR - Barista NC II Promulgated December 2013\n-45-\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate industry\nknowledge\n1.1\nSeek information on\nthe industry\n1.2\nUpdate continuously\nrelevant industry\nknowledge\n\nLecture\nGroup\nDiscussion\nIndividual/Group\nAssignment\n\nInterviews/\nQuestioning\nIndividual/Group\nProject or Report\n2. Observe\nworkplace\nhygiene\nprocedures\n2.1\nFollow hygiene\nprocedures\n2.2\nIdentify and prevent\nhygiene risk\n\nLecture\nDemonstration\nRole-play\nDemonstration\nWritten\nExamination\nInterviews/\nQuestioning\n3. Perform\ncomputer\noperations\n3.1\nPlan and prepare task\nto be undertaken\n3.2\nInput data into a\ncomputer\n3.3\nAssess information\nusing computer\n3.4\nProduce/ output data\nusing computer system\n3.5\nMaintain computer\nsystem\n\nLecture\nGroup\nDiscussion\nTutorial or self-\npace\n\nInterviews/\nQuestioning\nDemonstration\nObservation\n4. Perform\nworkplace and\nsafety practices\n1.1\nPractice workplace\nprocedures for\nhealth,safety and\nsecurity practices\n1.2\nDeal with emergency\nsituations\n1.3\nMaintain safe personal\npresentation standards\n\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nWritten\nExamination\n5. Provide\neffective\ncustomer\nservice\n1.1\nGreet customers\n1.2\nIdentify customer\nneeds\n1.3\nDeliver service to\ncustomer\n1.4\nHandle queries through\ntelephone, fax\nmachine, internet and\nemail\n1.5\nHandle complaints,\nevaluation and\nrecommendations\n\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nObservation\n\n--- PDF PAGE 48 ---\nTR - Barista NC II Promulgated December 2013\n-46-\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nespresso\n1.1 Set up and prepare\nmachine and equipment\n1.2 Dose and tamp coffee\n1.3. Extract espresso\nLecture/\ndiscussion\nDemonstration\nHands-on\nVideo viewing\nPicture/photos/\ndrawings\n\nWritten exercise/\nPractical test\nOral questioning\nObservation\n\n2. Texture milk\n2.1 Prepare milk and\nequipment\n2.2 Foam milk\n2.3 Texture milk\nLecture/\ndiscussion\nDemonstration\nHands-on/\nPractice\nsessions\nVideo viewing\nPicture/photos/\ndrawings\n\nPractical\ntest/simulation\nObservation\nOral questioning\nPortfolio\n\n3. Prepare and\nserve coffee\nbeverages\n3.1 Take orders of guests\n3.2 Prepare espresso based\nbeverages\n3.3 Prepare and serve\nbrewed coffee\nLecture/\ndiscussion\nDemonstration\nHands-on/\nPractice\nsessions\nVideo viewing\nPicture/photos/\ndrawings\n\nWritten test\nPractical\ntest/simulation\nObservation\nOral questioning\nPortfolio\n\n4. Perform Basic\nMaintenance on\nMachines and\nEquipment\n4.1 Maintain espresso\nmachine\n4.2 Clean doser grinder\n4.3 Care of small brewing\ndevices\n\nLecture/\ndiscussion\nDemonstration\nHands-on\nPicture/photos/\ndrawings\n\nPractical\ntest/simulation\nObservation\nOral questioning\n\n5. Perform Basic\nCashiering and\nGeneral Control\nProcedures\n5.1 Operate Electronic Cash\nRegister (ECR) or Point\nof Sales system (POS)\n5.2 Receive payments\n5.3 Handle change funds\nand Petty cash\n5.4 Maintain par stocks of\nitems\n\nLecture/\ndiscussion\nDemonstration\nHands-on/\nPractice\nsessions\nVideo viewing\nPicture/photos/\ndrawings\n\nPractical\ntest/simulation\nObservation\nOral questioning\nPortfolio\n\n--- PDF PAGE 49 ---\nTR - Barista NC II Promulgated December 2013\n-47-"
