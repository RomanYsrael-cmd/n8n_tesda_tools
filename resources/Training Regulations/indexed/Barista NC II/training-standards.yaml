  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for BARISTA NC II.\n\nThe guidelines include information on curriculum design, training delivery, trainee\nentry requirements, tools and equipment, training facilities, and trainer’s qualification\namong others.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title:\n Barista\n\nNC Level: NC II\n\nNominal Training Duration: 18 Hrs. (Basic)\n 18 Hrs. (Common)\n 142 Hrs. (Core)\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills and attitude in BARISTA\nNC II in accordance with industry standards. It covers core competencies on preparing\nespresso, texture milk, prepare and serve coffee beverages, perform basic maintenance\nof machines and equipment and perform basic cashiering and general control\nprocedures..\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant\nwork related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion\nGroup\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a\nteam member\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nQuestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and\ndevelopment\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 47 ---\nTR - Barista NC II Promulgated December 2013\n-45-\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate industry\nknowledge\n1.1\nSeek information on\nthe industry\n1.2\nUpdate continuously\nrelevant industry\nknowledge\n\nLecture\nGroup\nDiscussion\nIndividual/Group\nAssignment\n\nInterviews/\nQuestioning\nIndividual/Group\nProject or Report\n2. Observe\nworkplace\nhygiene\nprocedures\n2.1\nFollow hygiene\nprocedures\n2.2\nIdentify and prevent\nhygiene risk\n\nLecture\nDemonstration\nRole-play\nDemonstration\nWritten\nExamination\nInterviews/\nQuestioning\n3. Perform\ncomputer\noperations\n3.1\nPlan and prepare task\nto be undertaken\n3.2\nInput data into a\ncomputer\n3.3\nAssess information\nusing computer\n3.4\nProduce/ output data\nusing computer system\n3.5\nMaintain computer\nsystem\n\nLecture\nGroup\nDiscussion\nTutorial or self-\npace\n\nInterviews/\nQuestioning\nDemonstration\nObservation\n4. Perform\nworkplace and\nsafety practices\n1.1\nPractice workplace\nprocedures for\nhealth,safety and\nsecurity practices\n1.2\nDeal with emergency\nsituations\n1.3\nMaintain safe personal\npresentation standards\n\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nWritten\nExamination\n5. Provide\neffective\ncustomer\nservice\n1.1\nGreet customers\n1.2\nIdentify customer\nneeds\n1.3\nDeliver service to\ncustomer\n1.4\nHandle queries through\ntelephone, fax\nmachine, internet and\nemail\n1.5\nHandle complaints,\nevaluation and\nrecommendations\n\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nObservation\n\n--- PDF PAGE 48 ---\nTR - Barista NC II Promulgated December 2013\n-46-\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nespresso\n1.1 Set up and prepare\nmachine and equipment\n1.2 Dose and tamp coffee\n1.3. Extract espresso\nLecture/\ndiscussion\nDemonstration\nHands-on\nVideo viewing\nPicture/photos/\ndrawings\n\nWritten exercise/\nPractical test\nOral questioning\nObservation\n\n2. Texture milk\n2.1 Prepare milk and\nequipment\n2.2 Foam milk\n2.3 Texture milk\nLecture/\ndiscussion\nDemonstration\nHands-on/\nPractice\nsessions\nVideo viewing\nPicture/photos/\ndrawings\n\nPractical\ntest/simulation\nObservation\nOral questioning\nPortfolio\n\n3. Prepare and\nserve coffee\nbeverages\n3.1 Take orders of guests\n3.2 Prepare espresso based\nbeverages\n3.3 Prepare and serve\nbrewed coffee\nLecture/\ndiscussion\nDemonstration\nHands-on/\nPractice\nsessions\nVideo viewing\nPicture/photos/\ndrawings\n\nWritten test\nPractical\ntest/simulation\nObservation\nOral questioning\nPortfolio\n\n4. Perform Basic\nMaintenance on\nMachines and\nEquipment\n4.1 Maintain espresso\nmachine\n4.2 Clean doser grinder\n4.3 Care of small brewing\ndevices\n\nLecture/\ndiscussion\nDemonstration\nHands-on\nPicture/photos/\ndrawings\n\nPractical\ntest/simulation\nObservation\nOral questioning\n\n5. Perform Basic\nCashiering and\nGeneral Control\nProcedures\n5.1 Operate Electronic Cash\nRegister (ECR) or Point\nof Sales system (POS)\n5.2 Receive payments\n5.3 Handle change funds\nand Petty cash\n5.4 Maintain par stocks of\nitems\n\nLecture/\ndiscussion\nDemonstration\nHands-on/\nPractice\nsessions\nVideo viewing\nPicture/photos/\ndrawings\n\nPractical\ntest/simulation\nObservation\nOral questioning\nPortfolio\n\n--- PDF PAGE 49 ---\nTR - Barista NC II Promulgated December 2013\n-47-\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should follow to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency standards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based on the collection of evidence of the performance of work\nto the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended, thus,\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations\n•\nModular/self-paced learning is a competency-based training modality where\nthe trainee is allowed to progress at his own pace. The trainer only facilitates\nthe training delivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners\n•\nSupervised industry training or on-the-job training is a training approach\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or\ncomputer technologies\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this qualification should possess the\nfollowing requirements:\n\n•\nMust have completed a 10-year basic education\n•\nGood in oral and written communication\n\n--- PDF PAGE 50 ---\nTR - Barista NC II Promulgated December 2013\n-48-\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS FOR BARISTA NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor Barista NC II.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n2\nHand tampers\n1\n\n2\n2 - Group (semi-\nautomatic commercial\ntype espresso machine\nOR\nSingle or 1-group\nsemi-automatic\ncommercial type\nespresso machine\n25\nkilos\nCoffee beans (Fresh\nroasted whole)\n3\nBar spoons\n\n30\ncases\n Fresh milk\n2\nTamping pads\n1\nRefrigerator or cooler\nfor milk/cream\n1 case Liquid cream\n1 set\nEspresso\ncleaning tools\n(brushes)\n1\nDoser grinder\n(commercial type)\n2\nbottles\nAssorted Flavored syrups\nwith pumps\n1\nCleaning\nchemical\n1\nChiller/refrigerator\n1 jar\neach\nAssorted Fruit\npurees/sauces with\npumps\n1 set\nScrew drivers\n2\nFrench Press\n1 pack stirrers\n\n2\nSyphon\n1 pack straws\n2\nThermometers w\nclip\n3\nPourover/V60 Hand\ndrip\n30 pcs Lint free rags (3 colors)\n12\nShot glasses\n1\nMoka pot/stove top\nespresso maker\n2\nWhipped cream dispenser\nwith nozzle\n\n1\nAutomatic drip coffee\nmaker\n2\nboxes\nWhipped cream charger\n12\nDemitasse cups\nwith saucers\n1\nTable top stove;\ncamping stove\n1 pack Paper filer\n12\nCappuccino cups\nwith saucers\n1\nCommercial blender\nwith extra pitcher\n1\nBlind filter\n12\nLatte cups with\nsaucers\n2\nKnock box\n5\nRound bar trays\n6\n20 oz steaming\npitcher\n\n2\nMilk carafe\n4\n32 oz steaming\npitcher\n3\nHand stopwatches\n\n2\n10 or 12 oz\nsteaming pitcher\n\n3\nSqueeze bottles\n1 doz\nDemitasse\nteaspoons\n2\n3 in 1 Cocktail Shaker\n2\nWater pitcher\n1 doz\nteaspoons\n\n2\nIce shovels\n6\nWater goblets\n\n1\nCooler/chest box\n12\nCollins or Pilsner\n\n2\nAll purpose tongs\n6\nIrish glass\n\n1\nSpatula\n\n--- PDF PAGE 51 ---\nTR - Barista NC II Promulgated December 2013\n-49-\n\n3.5\nTRAINING FACILITIES\n\nBARISTA NC II\n\nBased on a class intake of 25 students/trainees.\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in Sq.\nMeters\nLecture/Laboratory Area\n5 x 10\n50\n50\nWash Room\n2 x 5\n10\n10\nTool Room/Supply Room\n5 x 4\n20\n20\nCirculation Area\n5 x 5\n25\n25\nTotal Workshop Area :\n105\n\n3.6\nTRAINER’S QUALIFICATIONS FOR TOURISM SECTOR\n\nBARISTA NC II\n\n TRAINER’S QUALIFICATIONS\n\n• Must be a holder of National TVET Trainer Certificate (NTTC) Level I in Barista\nNC II\n• Must have attended relevant upgrading barista trainings and seminars\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 52 ---\nTR - Barista NC II Promulgated December 2013\n-50-"
