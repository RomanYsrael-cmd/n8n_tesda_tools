      "term": "1. Heat Treatment",
      "definition": "A process in which metal in the solid state is subjected to one or more temperature cycles to attain certain desired properties. 2. Annealing Heating to and holding above the critical range followed by controlled slow-cooling in the furnace. 3. Quenching Is a hardening process. It involves heating to a temperature within a critical temperature range followed by quenching in a medium which are liquid or air medium. Quenching is a distinct operation carried out external to the furnace. 4. Thermal critical range Metals have its own distinct chemical composition. The thermal critical range depends on the chemical composition of the metal. Heating above and below the critical temperature range changes in a solid state constitution. While major constitutional change cannot occur below the lower limits some changes in microstructure are do so. 5. Precipitation hardening metals Hardening in metals caused by the precipitation of a constituent from a supersaturated solid solution. This occurs after quenching of alloys especially the maraging steel groups and stainless steels. 6. Differential hardening Some techniques allow different areas of a single object to receive different heat treatments. This is called differential hardening. It is common in high quality knives and swords. The Chinese jian is one of the earliest known examples of this, and the Japanese katana the most widely known. The Nepalese Khukuri is another example. 7. Ferrous metals The term \"ferrous\" is derived from the latin word meaning \"containing iron\". This can include pure iron, such as wrought iron, or an alloy such as steel. Ferrous metals are often magnetic, but not exclusively. 8. Alloy An alloy is a mixture of two or more elements in solid solution in which the major component is a metal. Combining different ratios of metals as alloys modifies the properties of pure metals to produce desirable characteristics. The aim of making alloys is generally to make them less brittle, harder, resistant to corrosion, or have a more desirable color and luster. Examples of alloys are steel (iron and carbon), brass (copper and zinc), bronze (copper and tin), and duralumin (aluminium and copper). Alloys specially designed for highly demanding applications, such as jet engines, may contain more than ten elements. 9. Metal In chemistry, a metal (Greek: Metallo, Μέταλλο) is a chemical element whose atoms readily lose electrons to form positive ions (cations), and form metallic bonds between other metal atoms and ionic bonds between nonmetal atoms."
