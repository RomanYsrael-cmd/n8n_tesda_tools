  "source_section_text": "Section 1. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2 The qualification of HEAT TREATMENT NC II may be attained through demonstration of\ncompetence through project-type assessment covering all required units of competency of\nthe qualification.\n\n4.2.1\nPerform Heat Treatment for Ferrous Metals\n\nSelect Heat Treatment Process\n\nPerform Heat Treatment Process\n\n4.3 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1\nGraduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.4.2\nExperienced workers (wage employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________\nTR - HEAT TREATMENT NC II Promulgated\n\n42\n\nANNEX A\nHEAT TREATMENT NC II\nANNEX A\nCOMMON\nCOMPETENCIES\nReceive and\nrespond workplace\ncommunication\nParticipate in\nworkplace\ncommunication\nLead in workplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team\n and individual\nSolve workplace\nproblems related\nto work activities\nWork with Other\nLead small Team\nApply problem\nsolving techniques\nin the workplace\nPlan and\norganize work\nBASIC\nCOMPETENCIES\n-\nLegend:\nCORE COMPETENCIES\nDemonstrate\nwork values\nPractice basic\n housekeeping\nprocedures\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\n procedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nconcepts and\n techniques\nUse relevant\n technologies\nRead & Interpret\nEngineering Drawings\nPerform Mensuration\nand Calculation\nRead, Interpret and\nApply Specifications\nand Manuals\nPerform Shop\nMaintenance\nDevelop and\nmanufacture wood\npattern\nDevelop and\nmanufacture polymer\npattern\nDevelop and\nmanufacture assembled\nplated pattern\nDevelop and\nmanufacture production\npattern\nPerform general\nwoodworking machine\noperations\nUse and maintain\nmeasuring instrument\nPrepare & mix sand for\nmetal molding\nProduce molds by hand\nProduce cores by hand\nOperate molding\nmachine\nOperate core-making\nmachine\nPour molten metal to\nmolds\nUse and maintain\nmeasuring instrument\nOperate melting\nfurnaces (non-electric)\nOperate cupola melting\nfurnace\nOperate electric\ninduction melting\nfurnace\nFettle & trim metal\ncastings/forgings\nPerform refractory\ninstallation & repair\nUse & maintain\nmeasuring instrument\nMelt Aluminum- Silicon\nAlloys for Safety Tested\nCastings\nMelt Metals Using\nCoreless Induction\nFurnace\nMelt Automotive Gray\nIron Castings in Cupola\nPrepare Sand Mixture\nfor Heavy Casting\n\nPerform Hand Molding\nto produce Heavy\nCasting\n\nPour Molten metal to\nHeavy Castings\n\nManufacture and\ndevelop corebox for\nShell Core Box\nDevelop and Manufacture\nGear, Conveyor Screw and\nPropeller Pattens\n\nDevelop Gravity Die\nCasting Mold\nCOMPETENCY MAP\nAUTOMOTIVE PARTS MANUFACTURING\nMachine parts\nPerform precision\nassembly\nSelect Heat\nTreatment Process\nPerform Heat\nTreatment Process\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________\nTR - HEAT TREATMENT NC II Promulgated\n\n43\nDEFINITION OF TERMS (HEAT TREATMENT)\n\n1. Heat Treatment\nA process in which metal in the solid state is subjected to one or more\ntemperature cycles to attain certain desired properties.\n2. Annealing\nHeating to and holding above the critical range followed by controlled\nslow-cooling in the furnace.\n3. Quenching\nIs a hardening process. It involves heating to a temperature within a\ncritical temperature range followed by quenching in a medium which\nare liquid or air medium. Quenching is a distinct operation carried out\nexternal to the furnace.\n4. Thermal critical\nrange\nMetals have its own distinct chemical composition. The thermal critical\nrange depends on the chemical composition of the metal. Heating\nabove and below the critical temperature range changes in a solid\nstate constitution. While major constitutional change cannot occur\nbelow the lower limits some changes in microstructure are do so.\n5. Precipitation\nhardening\nmetals\nHardening in metals caused by the precipitation of a constituent from a\nsupersaturated solid solution. This occurs after quenching of alloys\nespecially the maraging steel groups and stainless steels.\n6. Differential\nhardening\nSome techniques allow different areas of a single object to receive\ndifferent heat treatments. This is called differential hardening. It is\ncommon in high quality knives and swords. The Chinese jian is one of\nthe earliest known examples of this, and the Japanese katana the\nmost widely known. The Nepalese Khukuri is another example.\n7. Ferrous metals\nThe term \"ferrous\" is derived from the latin word meaning \"containing\niron\". This can include pure iron, such as wrought iron, or an alloy\nsuch as steel. Ferrous metals are often magnetic, but not exclusively.\n8. Alloy\nAn alloy is a mixture of two or more elements in solid solution in which\nthe major component is a metal. Combining different ratios of metals\nas alloys modifies the properties of pure metals to produce desirable\ncharacteristics. The aim of making alloys is generally to make them\nless brittle, harder, resistant to corrosion, or have a more desirable\ncolor and luster. Examples of alloys are steel (iron and carbon), brass\n(copper and zinc), bronze (copper and tin), and duralumin (aluminium\nand copper). Alloys specially designed for highly demanding\napplications, such as jet engines, may contain more than ten\nelements.\n9. Metal\nIn chemistry, a metal (Greek: Metallo, Μέταλλο) is a chemical element\nwhose atoms readily lose electrons to form positive ions (cations), and\nform metallic bonds between other metal atoms and ionic bonds\nbetween nonmetal atoms.\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________\nTR - HEAT TREATMENT NC II Promulgated\n\n44\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who rendered their time and expertise to the\ndevelopment and validation of this Training Regulation.\n\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nHEAT TREATMENT\nAntonio A. Gimenez\nPhilippine Automotive\nFederation, Inc. (PAFI)\nCesar R. Leal\nPhilippine Automotive\nFederation, Inc. (PAFI)\nElmo N. Serbito\nPAFI (Samahan ng mga\nManggagawang Supercast)\n\nCarina J. Bondad\n(Administrative Staff)\nThe PARTICIPANTS in the National Validation of this Training Regulation\n• (Supercast Foundry &\nMachinery Corp.\nSFMC)\n\n• Philippine Aluminum Wheels\nInc. (PAWI)\n\n• Toyota Auto Parts Phils. Inc.\n\nMembers of the TESDA Board\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nTESDA EXCOM\nQualification and Standards Office\nFlorante P. Inoturan\nAgnes P. Panem\nAbel B. Elpedes"
