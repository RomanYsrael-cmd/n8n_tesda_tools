        "source_title": "PERFORM HEAT TREATMENT PROCESS",
        "source_text": "--- PDF PAGE 32 ---\n________________________________________________________________________________________________________________ \nTR - HEAT TREATMENT NC II                                                                                                                Promulgated   \n           \n30\nUNIT OF COMPETENCY : \nPERFORM HEAT TREATMENT PROCESS \n \nUNIT CODE  \n \n: \n ALT812319 \n \nUNIT DESCRIPTOR \n: \nThis unit covers heat treatment of ferrous and non-ferrous  \nmetals, selecting the appropriate process to achieve the  \ndesired result using a variety of equipment such as box  \ntype, pit type, boggie type furnaces either gas, oil-fired or  \nelectrically heated. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n1. Determine job \nrequirements and \nset u p equipment \n \n1.1 Job requirements are determined from engineering drawing, \njob sheet or verbal instruction from metallurgist and other \nconcerned personnel. \n1.2 Heating equipment is selected for the required heat \ntreatment process. \n1.3 Equipment is set up according to standard operating \nprocedures and/or manufacturer’s instructions \n1.4 Personal protective equipment/devices are used in \naccordance with occupational health and safety  (OH & S) \nrequirements\n \n2. Load/ arrange \nmaterials \n \n2.1 Material is piece- or batch-loaded and unloaded in \naccordance with standard operating procedures. \n2.2 Fixtures are used to avoid /minimize damage to the material \nduring handling and heating or cooling. \n2.3 Equipment appropriate to the situation is applied according \nto standard operating procedure. \n \n3. Operate and monitor \nheating equipment \n \n3.1 Furnace start-up is performed as per standard operating \nprocedures and safety requirements. \n3.2 Information related with equipment and process is recorded \nas per standard procedures. \n3.3 Required heating temperature, soaking time and cooling \ntime is applied and maintained according to standard \noperating procedure. \n3.4 Hazards are identified and control measures are \nimplemented to maintain a safe work environment. \n3.5 Optimum furnace operation requirement is maintained as \nper standard operating procedures. \n3.6 Furnace atmosphere is maintained as per standard \noperating procedures \n3.7 Temperature distribution inside the furnace is monitored and \nadjusted, if necessary, in accordance with standard \noperating procedures.\n\n--- PDF PAGE 33 ---\n________________________________________________________________________________________________________________ \nTR - HEAT TREATMENT NC II                                                                                                                Promulgated   \n           \n31\n \n \n \n4. Heat treat materials  \n \n4.1 Quenching medium /tank is prepared as required by the \nprocess. \n4.2 Air blast for air cooling is prepared, if required by the \nprocess. \n4.3 Material is removed from the furnace as per standard \noperating procedures and safely requirements \n4.4 Materials is heat treated to achieve required result in \naccordance with standard operating procedures and \ncustomer requirements \n \n5. Shut down furnace \n \n5.1 Furnace is shut down as per standard operating procedures  \n5.2 Routine maintenance is performed on thermo-couples and \ntemperature meter as per standard operating procedures\n\n--- PDF PAGE 34 ---\n________________________________________________________________________________________________________________ \nTR - HEAT TREATMENT NC II                                                                                                                Promulgated   \n           \n32\n \nRANGE OF VARIABLE \n \nVARIABLE \nRANGE \n \n1. Heating \nEquipment \n \nHeating equipment include gas, oil fired and electric furnaces, \nsuch as  \n1.1 pit furnace \n1.2 box type furnace \n1.3 boggie (car type) furnace or  \n1.4 muffle furnace.  \n \n2.  Heat treatment     \nprocess \n \n2.1 Stress relieving \n2.2 Annealing \n2.3 Normalizing \n2.4 Quenching (air, water, oil) \n2.5 Tempering \n \n3.  Materials \n \n3.1 Cast iron  \n3.2 Carbon steels \n3.2 Alloy steels \n3.4 Aluminum alloys.\n\n--- PDF PAGE 35 ---\n________________________________________________________________________________________________________________ \nTR - HEAT TREATMENT NC II                                                                                                                Promulgated   \n           \n33\nEVIDENCE GUIDE \n \n1. Critical aspect of   \n     Competency \n \nAssessment requires evidence that the candidate  \n1.1 Determined job requirements \n1.2 Set-up heat treatment equipment   \n1.3 Loaded / arranged the materials \n1.4 Operated and monitored heating equipment \n1.5 Heat treated materials \n1.6 Shut down furnace\n \n2. Underpinning \nKnowledge and \nattitudes \n \n2.1 Metal chemical composition. \n2.2 Different heat-treatment processes, equipment and \napplication. \n2.3 Heat-treatment faults and counter-measures. \n2.4 Destructive and non-destructive testing of metals. \n2.5 Mechanical / physical properties of metals. \n2.6 Time, temperature diagram of metals. \n2.7 Use of personal protective unit. \n2.9 Safe work practices and procedures.\n  \n3. Underpinning  \n    skills \n \n \n3.1 Selecting appropriate heat-treatment equipment and process. \n3.6 Identifying and rectifying heat-treatment faults (equipment and \nprocess). \n3.7 Reading, interpreting and following information on written job \ninstructions, specifications, standard operating procedures, \nmanufacturers manual and instructions, chart, list, drawings \nand applicable reference documents. \n3.8 Entering routine and familiar information into pro-forms and \nstandard workplace form.  \n3.9 Perform standard metal hardness tests. \n3.6 Check and clarify tasks selected information.\n \n4. Resource \nimplications \n \n \nThe following resources MUST be provided:  \n6.1  Manuals/catalogues relative to heat treatment \n6.2  Job order, requisitions slip for materials \n6.3 Materials, tools and equipment relevant to the activity \n \n7. Method of \nassessment \n    \n     \n \nCompetency MUST be assessed through: \n7.1 Observation with questioning \n7.2 Portfolio \n7.3 Third Party Report \n \n8. Context of \nassessment  \n \n \nAssessment may be conducted in the workplace or a simulated \nenvironment.\n",
