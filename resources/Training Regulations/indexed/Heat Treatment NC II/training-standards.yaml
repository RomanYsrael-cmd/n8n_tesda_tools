  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs Heat Treatment NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: Heat Treatment\n\n NC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n48 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an individual\nin the field of HEAT TREATMENT. This course consists of competencies that a person must\nachieve to be able to select the appropriate process of heat treatment to achieve the desired\nresult, recording and maintaining the heat treatment information in the manufacture of many\nother metals. It also covers heat treatment of ferrous and non-ferrous metals using a variety of\nequipment such as box type pit type, boggie type furnaces either gas, oil-fired or electrically\nheated. Heat treatment techniques include annealing, case hardening, precipitation\nstrengthening, tempering and quenching.\n\nThis course is also designed to enhance the basic and common knowledge, skills and\nattitudes of an individual in the field of foundry-pattern making.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\n meeting and discussion.\n• Group\ndiscussion\n• Interaction\n• Lecture\n• Reportorial\n• Written test\n• Practical/perfo\nrmance test\n• Interview\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\n member.\n• Group\nDiscussion /\nInteraction\n• Case studies\n• Simulation\n• Written test\n• Observation\n• Simulation\n• Role playing\n• Case studies\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n\n• Group\nDiscussion\n• Interaction\n•\nSimulation\n• Role play\n• Interview\n• Written\nexamination\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________\nTR - HEAT TREATMENT NC II Promulgated\n\n35\n\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\n• Demonstration\n• Self-paced\ninstruction\n• Structured\nactivity\n•\nFilm viewing\n• Portfolio\nassessment\n4. Practice\noccupational\nhealth and safety\n4.1Identify hazardous risks\n4.2 Evaluate hazard and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational\nhealth and safety\nawareness\n• Interactive-\nlecture\n• Simulation\n• Symposium\n• Group\ndynamics\n• Film viewing\n• Situation\nanalysis\n• Self-paced\ninstruction\n• Situation\nanalysis\n• Interview\n• Practical\nexamination\n• Written\nexamination\n• Portfolio\nassessment\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2.Interpret drawings\n1.3.Apply information in the\ndrawings & specifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n2. Perform\nMensuration and\nCalculation\n2.1. Select measuring\ninstrument and\n2.2 Carry out measurement\nand calculations.\n2.3. Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Simulation\n• Exercises\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n4.1. Identify/accessed\nmanuals and interpret\ndata and specification\n4.2 Apply information\naccessed in manual\n4.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nLearning\n• Written test\n• Direct\nobservation\n• Project method\n• Interview\n4. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and\nwork area\n4.2 Store/arrange tools and\nshop equipment\n4.3 Dispose wastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Simulation\n• Written test\n• Direct\nobservation\n• Demonstration\n• Interview\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________\nTR - HEAT TREATMENT NC II Promulgated\n\n36\nCORE COMPETENCIES\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Select Heat\nTreatment\nProcess\n1.1 Determine job\nrequirements\n1.2 Identify and select\nappropriate heat\ntreatment process\n1.3 Test materials, record\nand maintain heat\ntreatment information\n• Lecture\n• Dualized\ntraining\n• Distance\nlearning\n\n• Observation\nwith\nquestioning\n• Portfolio\n• Third party\nreport\n\n2. Perform Heat\nTreatment\nProcess\n2.1 Determine job\nrequirements\n2.2 Select appropriate\nequipment and\naccessories\n2.3 Conduct appropriate\nmaterial loading\n2.4 Operate the furnace\n2.5 Inspect / test the product\n• Lecture\n• Dualized\ntraining\n• Distance\nlearning\n\n• Observation\nwith\nquestioning\n• Portfolio\n• Third party\nreport\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________\nTR - HEAT TREATMENT NC II Promulgated\n\n37\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n The training is based on curriculum developed from the competency standards;\n Learning is modular in its structure;\n Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n Training is based on work that must be performed;\n Training materials are directly related to the competency standards and the\ncurriculum modules;\n Assessment is based in the collection of evidence of the performance of work to\nthe industry required standard;\n Training is based on and off-the-job components;\n Allows for recognition of prior learning (RPL) or current competencies;\n Training allows for multiple entry and exit; and\n Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery\n Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, or audio, video or\ncomputer technologies.\n Project-Based Instruction is an authentic instructional model or strategy in which\nstudents plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________\nTR - HEAT TREATMENT NC II Promulgated\n\n38\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n• With experience in basic machining\n• Can communicate both orally and in writing; and\n• Physically and mentally fit\n\n 3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n HEAT TREATMENT NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nHeat Treatment NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n2 sets\nWire rope ½\nharness, 12mm\ndia rope x\n10meters long\n1 unit\nBox type\nfurnace\n2 pcs\nCold rolled steel – 25 dia\nSAE 1030 200mm long\n4 sets\nTongs\n1 unit\nBogie type\nfurnace\n2 pcs\nCold rolled steel – 50 dia\nSAE 1030 200mm long\n1 set\nSocket wrench\n1 unit\nMuffle type\nfurnace\n4 pcs\nMild steel plate (200mm\nlong x 100mm wide) 12mm\nthick\n1 set\nOpen wrench\n1 unit\nOver-head\ncrane\n4 pcs\nMild steel plate (200mm\nlong x 100mm wide) 20mm\nthick\n2 pcs\nBall pein\nhammer\n300mm long\n1 unit\nA-crane\n4 pcs\nMild steel plate (200mm\nlong x 100mm wide) 6mm\nthick\n10 sets\nToogle clamp\n1 unit\nQuenching\ntank\n5 gallon\nQuenching oil\n10 sets\nBolt\n4 units\nBlower fan\n2 pcs\nCold rolled steel SAE-\n1040/4140 100mm long –\n25dia\n2 pcs\nMechanical\nplier\n1 unit\nFork lift 2 tons\n2 pcs\nCold rolled steel SAE-\n1040/4140 100mm long –\n50dia\n1 pc\nElectrical plier\n4 units\nBasket\nLPG fuel\n1 set\nHack saw\n1 set\nThermocouple\nDiesel fuel\n2 pcs\nHack saw blade\n2 sets\nThermocouple\ntips\n\n2 sets\nPipe wrench 2\ninches\n1 set\nTemperature\nmeter –\n\n--- PDF PA