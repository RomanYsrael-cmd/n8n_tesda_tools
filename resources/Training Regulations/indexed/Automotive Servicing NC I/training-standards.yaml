      "source_text": "SECTION 3. TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Automotive Servicing NC I.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE SERVICING\n\nNC Level NC I\n\nNominal Training Duration:\n 28 Hours (Basic Competencies)\n\n162 Hours (Common Competencies)\n279 Hours (Core Competencies)\n\n469 Hours\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive servicing in accordance with industry\nstandards. It covers core competencies such as; performance of basic engine\nservicing through removal and reinstallation of components for gas and diesel\nengines.\n\nThis course is also designed to enhance the basic and common\nknowledge, skills and attitudes of an individual in the field of automotive servicing.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved.\n\n--- PDF PAGE 79 ---\nTR – Automotive Servicing NC I Promulgated February 27, 2018 77\nBASIC COMPETENCIES\n28 Hours\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow routine\nspoken messages\n• Read:\no Parts of a speech\no Parts of a sentence\no Kinds of sentence\n• Practice exercise conciseness in\nreceiving and clarifying messages/\ninformation/ communication\n• Lecture\n• Demonstration\n• Written\nexamination\n• Observation\n8 hours\n1.2 Perform workplace\nduties following\nwritten notices\n• Describe organizational\npolicies/guidelines in regard to\nprocessing internal/external\ninformation\n• Read:\no Communication processes\no Work practices in handling\ncommunications\no Receiving and clarifying\ncommunications, messages and\ninformation\n• Practice exercise:\no