arance \n• Simple arithmetic \n• Use of Special \nService Tools \n• OSHS \n• Wearing of PPEs \n• Inspection and \nreplacement of \nengine oil and filter \n• Post-service testing \n \nAttitude: \n• Patience \n• Attention to details \n• Time conscious \n• Honest \n• Interpreting \ninformation from \nmanufacturer’s \nrepair manual \n• Calculating liquid \nvolumes and \nservice schedule \nintervals, using \nmathematical \noperations, \nincluding addition \nand subtraction \n• Recording \nirregularities \n• Carrying out \nservice and \nadjustments \n• Carrying out post-\nservice testing \n• Wearing of PPEs \n• Applying safety \npractices \n4.  Complete work \nprocesses \n4.1  Initial quality \ninspection is \nperformed based \non workplace \nprocedure \n4.2  Vehicle is turned \nover to immediate \n• OSHS \n• Wearing of PPEs \n• Final inspection \nprocedure \n• Checking and \nstoring of tools and \n• Tagging faulty \ntools and \nequipment legibly \nand accurately  \n• Completing tool \nand equipment\n\n--- PDF PAGE 58 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 56 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nsupervisor for final \ninspection to \nensure work is \ndone according to \nworkplace \nstandards \nexpectations \n4.3  Work area is \nrestored following \nstandard operating \nprocedure \n4.4  Waste \nmanagement is \npracticed according \nto 5S of good \nhousekeeping \n4.5  Tools and \nequipment are \nchecked and stored \naccording to \nworkplace \nprocedures \n4.6  Workplace \ndocumentation is \nprepared according \nto workplace \nprocedures \nequipment \n• Restoration of work \narea \n• Service standard \noperating procedure  \n• Waste management \n• 5S \n• 3Rs \n• Fix it right the first \ntime all the time \n• Workplace \ndocumentation \n \nAttitude: \n• Patience \n• Attention to details \n• Time conscious \n• Honest \n• Respect people \nservice and \nmaintenance \nschedules \n• Recording of \nservice made \n• Restoring work \narea \n• Inspection skills \n• Practicing waste \nmanagement \n• Checking and \nstoring tools and \nequipment \n• Preparing \nworkplace \ndocumentation\n\n--- PDF PAGE 59 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 57 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Checking of tools and \nequipment \nMay include: \n1.1  Tagging of faulty tools and equipment \n1.2  Servicing and maintenance of tools and equipment \n2.  Inspection \nMay include: \n2.1  Pre- and post-service inspections for oil and fluid \nleaks \n2.2  Analyzing abnormal engine noises \n2.3  Inspecting battery \n2.4  Inspecting air cleaner element \n2.5  Inspecting engine oil \n2.6  Inspecting engine coolant \n2.7  Inspecting drive belt \n2.8  Inspecting spark plug \n2.9  Inspecting fuel filter \n3.  Safety requirements \nMay include: \n3.1  Work health and safety (WHS) and occupational \nhealth and safety (OHS) requirements, including \nprocedures for working with: \n3.1.1  Rotating and hot components \n3.1.2  Engine oils \n3.1.3  High energy ignition and charging systems \n3.1.4  Hazardous materials \n4.  Service \nMay include: \n4.1   Replacing engine oil  \n4.2   Replacing engine oil filter \n4.3   Cleaning/replacing air cleaner element \n4.4   Replacing engine coolant \n4.5   Replacing drive belt \n4.6   Cleaning/replacing spark plug   \n4.7   Replacing fuel filter \n4.8   Adjustment of idle speed and idle mixture for \ncarburated engine \n4.9   Adjustment of idle speed (diesel with injection \npump) \n4.10 Removal of water from water sedimenter \n4.11 Bleed fuel system (diesel) \n4.12 Adjust valve clearance \n5.  Environmental \nrequirements \nMay include : \n5.1   Procedures for trapping of fluids released from \nengines \n5.2   Procedures for storing of fluids released from \nengines \n5.3   Procedures for disposing of fluids released from \nengines \n6.  Post-service testing \nMay include: \n6.1  Starting up and running engine to operating \ntemperature \n6.2  Checking for leaks and abnormal noises\n\n--- PDF PAGE 60 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 58 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1  Prepared for inspection and service engine. \n1.2  Inspected engine. \n1.3  Serviced engine. \n1.4  Completed work processes. \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1  Workplace: Real or simulated work area \n2.2  Appropriate Tools & equipment \n2.3  Materials relevant to the activity  \n2.4  Repair manuals and related reference materials \n3.  Method of \nassessment \nCompetency MUST be assessed through: \n3.1  Direct observation  \n3.2  Written examination \n3.3  Demonstration with oral questioning \n4.  Context of \nassessment \n4.1  Competency may be assessed individually in the actual \nworkplace or through accredited institution\n",
