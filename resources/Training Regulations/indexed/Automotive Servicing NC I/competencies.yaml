es/ \ninformation/ \ncommunication\n\n--- PDF PAGE 5 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 3 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nguidelines \n2.2  Routine written \ninstruction are \nfollowed in \nsequence \n2.3  Feedback is given \nto workplace \nsupervisor based \non the instructions/ \ninformation \nreceived  \n• Ethical work \npractices in handling \ncommunications \n• Communication \nprocess \n• Accuracy in \nrecording \nmessages/ \ninformation\n\n--- PDF PAGE 6 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 4 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Written notices and \ninstructions \nMay include: \n1.1  Handwritten and printed material \n1.2  Internal memos \n1.3  External communications \n1.4  Electronic mail \n1.5  Briefing notes \n1.6  General correspondence \n1.7  Marketing materials \n1.8  Journal articles \n2.  Organizational Guidelines May include: \n2.1  Information documentation procedures \n2.2  Company policies and procedures \n2.3  Organization manuals \n2.4  Service manual\n\n--- PDF PAGE 7 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 5 \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1  Demonstrated knowledge of organizational procedures for \nhandling verbal  and written communications \n1.2  Received and acted on verbal messages and instructions \n1.3  Demonstrated competency in recording instructions/ \ninformation \n2.  Resource \nImplications \nThe following resources MUST be provided: \n2.1  Pens \n2.2  Note pads \n3.  Method of \nAssessment \nCompetency in this unit may be assessed through: \n3.1  Direct Observation \n3.2  Oral interview \n3.3  Written Evaluation \n3.4  Third Party Report \n4.  Context of \nAssessment \n4.1  Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions\n",
