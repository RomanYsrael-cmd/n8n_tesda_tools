nt \nfundamentals \n• Initial quality \ninspection \n• Vehicle \nendorsement and \nhand-over \n• Accomplishment of \njob/repair order \n• 5S \n• 3Rs \n• OSHS \n \nAttitudes: \n• Good housekeeping \nhabit \n• Full attention to \ndetails \n• Time conscious \n• Complies to \nstandards \n• Practicing good \nhousekeeping \n• Following standard \n• Reporting results \nof inspection \n• Endorsing and \nhand-over vehicle \n• Performing initial \nquality inspection \n• Accomplishing \njob/repair order \n• Applying OSHS\n\n--- PDF PAGE 72 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 70 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Tools \nIncludes: \n1.1   Basic tools \n1.2   Special tools \n2. Inspection techniques \nMay include: \n2.1   Bounce test \n2.2   Vehicle height \n3.  Suspension system \ncomponents \nMay include: \n3.1   Stabilizer \n3.2   Stabilizer links \n3.3   Stabilizer links \n3.4   Coil springs, torsion bar, bar bushing, and leaf \nspring \n3.5   Upper and Lowers arms \n3.6   Suspension bushings \n3.7   Ball joints \n3.8   Fasteners \n3.8.1  Suspension bolts \n3.8.2  Suspension nuts \n3.8.3 Wheel nuts \n3.9   Damper/shock absorber \n3.10 Wheel bearing \n3.11 Tire wheel \n3.12 Shock mounting \n4. Defects and damage \nMay include: \n4.1   Leaks on damper/shock absorber  \n4.2   Crack bushing \n4.3   Loose ball joints \n4.4   Worn-out tires\n\n--- PDF PAGE 73 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 71 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1  Performed pre-periodic maintenance of suspension \nsystem \n1.2  Applied periodic maintenance procedures \n1.3  Performed work to completion \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1  Workplace: Real or simulated work area \n2.2  Appropriate Tools & equipment \n2.3  Mate