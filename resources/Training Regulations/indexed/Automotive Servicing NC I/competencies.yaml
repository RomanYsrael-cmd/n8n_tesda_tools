        "source_title": "UTILIZE AUTOMOTIVE TOOLS",
        "source_text": "--- PDF PAGE 31 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 29 \nUNIT OF COMPETENCY \n: \nUTILIZE AUTOMOTIVE TOOLS \n \nUNIT CODE \n: \nALT723214 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge and skills in \n \n \nselecting and using automotive power tools, hand \n \n \ntools and tool keeping. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Prepare \nautomotive tools \n1.1  Automotive tools \nare identified \naccording to their \nclassification and \nspecification. \n1.2  Automotive tools \nand attachments \nare selected \naccording to job \nrequirements. \n1.3  Automotive tools \nand attachments \nare inspected for \ndefects and \ndamages \naccording to \nmanufacturers and \nwork place \nprocedures. \n1.4  Safety practices are \napplied following \nOSHS. \n• Understanding \npower to size ratio \n• Leverage \n• Types of power tools \nand hand tools \n• Uses of automotive \npower tools and \nhand tools \n• Defects and \ndamages of \nautomotive tools and \nattachments \n• Handling of tools \n• Interpretation of \ncontents of users \nmanuals \n• Safety procedures \n• Wearing of PPE \n• Identifying defects \nor damages of \ntools before use \n• Knowledgeable in \nproper handling of \ntools \n• Identifying tools \nrequired for the job \n• Inspecting the area \nwere power tools \nwill be use. \n2.  Use automotive \ntools \n2.1  Attachments are \nmounted to \nautomotive tools \naccording to job \nrequirements \n2.2  Power tools are \nconnected to \npower sources \naccording to \noperation’s manual \n2.3  Power tools are \noperated according \nto operation’s \nmanual \n2.4  Hand tools are \nutilized according to \noperation’s manual \n2.5  PPEs are worn in \naccordance to \n• Use of automotive \ntools \n• Application of \nTorque and pressure \n• Unit conversion of \ntorque \n• English and metric \nsystem \n• Types of hand tools \n• Types of power tools \n• Fundamentals of \nautomotive hand \ntools and power \ntools \n• Interpretation of \ncontents of users \nmanuals \n• OSHS \n• Resources \n• Analytical skills \n• Technical literacy \n• Mounting \nattachments to \nautomotive tools \n• Connecting power \ntools to power \nsources \n• Operating power \ntools \n• Utilizing hand tools \n• Wearing PPEs \n• Applying safety \npractices \n• Following manuals\n\n--- PDF PAGE 32 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 30 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nOSHS. \ninformation \n- Bulletin \n- Shop manual \n3.  Maintain \nautomotive tools \n3.1  Automotive tools \nand attachments \nare cleaned \naccording to user’s \nmanual. \n3.2  Automotive tools \nand attachments \nare checked for \nserviceability \naccording to \nworkplace and \nmanufacturers \nprocedures. \n3.3  Defects and \ndamages are \nreported to \nimmediate superior \nfollowing industry \nstandards. \n3.4  Automotive tools \nand attachments \nare stored \naccording to \nworkplace \nprocedures. \n3.5  Safety practices are \napplied following \nOSHS. \n3.6  Wastes are \ndisposed following \nenvironmental law \nand regulations. \n• Different types of \npower tools and \nhand tools \n• Techniques in tool \nArrangement \n• Fundamentals of \nautomotive tools \n• Cleaning of \nautomotive tools \n• Labeling and \narranging of power \ntools and hand tools \n• Safety practices \n• Procedures in \nmaintaining of power \ntools and hand tools \n• Tagging of \ndamaged/worn \npower tools and \nhand tools \n• Reporting damage \npower tools and \nhand tools \n• Proper disposal of \ndamaged tools \n• Proper disposal of \nchemicals used for \ncleaning \n• OSHS \n• Environmental law \nand regulations \n• 5S of good \nhousekeeping \n• 3Rs \n• Sorting of tools \n• Skills in creating \nreports \n• Cleaning of tools \n• Checking, cleaning \nand storing \nautomotive tools \nand attachments \n• Reporting defects \nand damages \n• Disposing wastes \n• Practicing safety \nprocedures\n\n--- PDF PAGE 33 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 31 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Automotive tools \nMay include: \n1.1  Power tools \n1.1.1  Electric power tools \n1.1.1.1  Electric drill \n1.1.2  Pneumatic tools \n1.2  Basic tools \n1.3  Special service tools (SST) \n2.  Power sources \nMay include: \n2.1  Electric source \n2.2  Pneumatic or air \n2.3  Hydraulic \n3.  Basic tools \nMay include: \n3.1    Wrenches \n3.2    Pliers \n3.3    Screw drivers \n3.4    Power handle \n3.5    Ratchet \n3.6   Multitester \n3.7   Flash light \n3.8   Rubber mallet \n3.9   Hammer \n3.10 Jack \n3.11 Jack stand \n3.12 Choke \n4.  Attachments \nMay include: \n4.1  Bits \n4.2  Sockets \n4.3  Extension \n5.  Defects and damages \nMay include: \n5.1  Tools \n5.1.1  Cracks \n5.1.2  Breakage \n5.1.3  Deformity \n5.1.4  Looseness \n5.1.5  Corrosions \n5.1.6  Leaks \n5.2  Attachments \n5.2.1  Cracks \n5.2.2  Breakage \n5.2.3  Deformity \n5.2.4  Looseness \n5.2.5  Corrosions \n6.  Personal protective \nequipment (PPEs) \nMay include: \n6.1  Goggles \n6.2  Gloves \n6.3  Hard hat \n6.4  Safety shoes \n6.5  Dust mask\n\n--- PDF PAGE 34 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 32 \nVARIABLE \nRANGE \n7.  Wastes \nMay include: \n7.1  Dead batteries \n7.2  Deformed, cracked, broken bits/sockets/extensions \n7.3  Used cleaning chemicals \n7.4  Used oil \n7.5  Contaminated cleaning materials\n\n--- PDF PAGE 35 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 33 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment require evidence that the candidate understands \nthe applications and guidelines specified by the manufacturer. \n1.1  Prepared automotive tools \n1.2  Used Power tools  \n1.3  Used Hand tools \n1.4  Maintained and stored automotive tools \n1.5  Disposed wastes \n1.6  Applied safety measures \n2.  Resource \nimplication \nThe following resource MUST be provided. \n2.1  Appropriate power tools and hand tools \n2.2  Tools and materials relevant for training \n2.3  Proper place for storage and disposal \n2.4  Work shop manuals \n3.  Method of \nassessment \nCompetency MUST be assessed through. \n3.1  Written examination \n3.2  Demonstrations with oral questioning \n3.3  Direct observation \n3.4  Third party report \n3.5  Interview \n4.  Context of \nassessment \n4.1  Competency may be assessed individually in the actual \nworkplace or through accredited institution\n",
