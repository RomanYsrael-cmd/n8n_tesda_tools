        "source_text": "--- PDF PAGE 27 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 25 \nUNIT OF COMPETENCY \n: \nMOVE AND POSITION VEHICLE \n \nUNIT CODE \n: \nALT832212 \n \nUNIT DESCRIPTOR \n: \nThis unit involves the skills and knowledge and \n \n \nattitudes required to move and position vehicle \n \n \nsafely including systematic and efficient control of \n \n \nall vehicle functions. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Prepare vehicle for \noperation \n1.1  Vehicle multi point \ninspection is \nconducted \naccording to \nindustry practice. \n1.2  Cockpit Drill is \nperformed \naccording to \nindustry practice. \n1.3  Vehicle is start-up \nfollowing owner’s \nmanual. \n1.4  Parking brake is \nengaged according \nto industry practice. \n• Revolutions per \nminute during idle \n• Manual, automatic \nand CVT \nTransmission \n• Vehicle parts, \ncomponents and \nfunctions  \n• Inspection \nprocedures \n• Owner’s manual \n• Safety procedures \n• Performing Cockpit \nDrill \n• Conducting \nVehicle Multi point \ninspection \n• Starting the engine \n• Using owner’s \nmanual \n2.  Position vehicle \n2.1  Workshop \nhazards are \nidentified and \navoided as per \nstandard operating \nprocedures. \n2.2  Vehicle is moved \naccording to \nOccupational \nHealth and Safety \nStandards. \n2.3  Workshop rules and \nregulations are \nrecognized \naccording to \nstandard \nprocedures. \n• Revolutions per \nminute in running \ncondition \n• Kilometer per hour \n• Estimation/ timing \n• Manual, automatic \nand CVT \nTransmission \n• Diesel, Gasoline and \nEV engines \n• Vehicle parts, \ncomponents and \nfunctions  \n• Defensive driving \n• Owner’s Manual \n• Safety procedures \n• Skills in positioning \nvehicle \n• Vehicle positioning \nestimation skill \n• Identifying \nworkshop signs \nand markings \n3.  Park and stop the \nvehicle \n3.1  Vehicle is \npositioned \naccording to \nparking rules and \nregulations. \n3.2  Parking brake is \nengaged according \n• Vehicle parts, \ncomponents and \nfunctions \n• Inspection \nprocedures \n• Owner’s Manual \n• Procedure in \n• Vehicle positioning \nestimation skills \n• Identifying parking \nsigns and \nmarkings\n\n--- PDF PAGE 28 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 26 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nto industry practice. \n3.3  Electrical devices \nare turned off \nbased on \nmanufacturer’s \nspecification. \n3.4  Vehicle is shut-off \nfollowing owner’s \nmanual \nshutting-off vehicle \n• Safety procedures \n• Parking rules and \nregulations\n\n--- PDF PAGE 29 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 27 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Multi point inspection \nMay include: \n1.1  Check for any obstruction \n1.2  Check external condition \n1.3  Check internal condition \n1.3.1  Manual transmission \n1.3.2  Automatic transmission \n1.4  Check vehicle drivability \n2.  Cockpit Drill \nMay include: \n2.1  Car mirror adjustments \n2.2  Steering the car \n2.3  How to change gears \n2.4  Use of parking brake \n2.5  Doors, Seat, Steering, Seat belt and Mirrors \n2.6  Foot controls \n2.7  Hand controls \n2.8  Auxiliary controls (indicators) \n3.  Workshop hazards \nMay include: \n3.1  Workshop tools and materials \n3.2  Workshop equipment \n3.3  Other vehicles \n3.4  Other people \n3.5  Oil spills \n3.6  Loose parts \n4.  Parking rules and \nregulation \nMay include: \n4.1  Parallel parking \n4.2  Horizontal parking \n4.3  Park facing the wall \n5.  Electrical devices \nMay include: \n5.1  Lights \n5.2  Air conditioning \n5.3  Wiper \n5.4  Radio\n\n--- PDF PAGE 30 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 28 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1  Prepared vehicle for operation  \n1.2  Positioned the vehicle  \n1.3  Parked and stopped the vehicle \n1.4  Used owner’s manual \n2.  Resource \nimplication \nThe following resources MUST be provided: \n2.1  Workshop range/area \n2.2  Service working bay \n2.3  Appropriate vehicle for moving and positioning \n2.4  Owner’s manual \n3.  Method of \nassessment \nCompetency MUST be assessed through: \n3.1  Demonstration with oral questioning \n3.2  Written exam \n3.3  Interview \n3.4  Direct observation \n4.  Context of \nassessment \n4.1  Competency may be assessed individually in the actual \nworkplace or through accredited institution\n",
