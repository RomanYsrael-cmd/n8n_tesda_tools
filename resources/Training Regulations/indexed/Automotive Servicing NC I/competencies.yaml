 \n1.1  Tire pressure gauge \n1.2  Fender cover \n1.3  Steering wheel cover \n1.4  Seat cover  \n1.5  Shifting knob cover \n1.6  Floor mat cover \n2.  Factory-loaded parts \nMay include: \n2.1   Wheel caps \n2.2   Wheel covers \n2.3   Spare wheel  \n2.4   Tow hook \n2.5   Tool Kit \n2.6   Early warning device \n2.7   Owner’s Handbook Manual \n2.8   Spare Key \n2.9   Floor Mats \n2.10 Jack Set \n3.  Restoration of vehicle \nMay include: \n3.1  Installation of factory-loaded parts \n3.2  Removal of towing eyelets, labels, tags, stickers, \ncovers, and body protective films \n3.3  Adjustment of tire pressure \n3.4  Removal of spring locks \n4.  Checking of vehicle \nMay include: \n4.1  Operation of electrical components \n4.2  Checking of fluid levels \n4.3  Checking for leaks \n4.4  Checking of vehicle performance \n4.5  Checking of minor defects \n5.  Minor corrective \nmeasures \nMay include: \n5.1  Correct Brake fluid \n5.2  Correct Coolant level \n5.3  Correct Automatic Transmission Fluid (ATF) \n6. Correction of minor \ndefects \nMay include: \n6.1 Fluid level correction \n6.2 Tightening of bolts and nuts \n6.3 Adjustment of tire pressure \n7.  Defects \nMay include: \n7.1  Mechanical \n7.2  Electrical \n7.3  Body Paint \n7.4  Scratches \n7.5  Dents\n\n--- PDF PAGE 55 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 53 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1  Prepared for pre-delivery inspection \n1.2  Performed physical and functional inspection \n1.3  Completed work processes \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1  Workplace: Real or simulated work area \n2.2  Appropriate Tools & equipment \n2.3  Materials relevant to the activity \n2.4  Training vehicle or simulators \n3.  Method of \nassessment \nCompetency MUST be assessed through: \n3.1  Written exam \n3.2  Demonstration with ora