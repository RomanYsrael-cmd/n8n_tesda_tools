        "source_text": "--- PDF PAGE 74 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 72 \nUNIT OF COMPETENCY \n: \nPERFORM PERIODIC MAINTENANCE OF \n \n \nSTEERING SYSTEM \n \nUNIT CODE \n: \nALT723381 \n \nUNIT DESCRIPTOR \n: \nThis competency unit covers the ability to carry out \n \n \nperiodic maintenance for both manual and power \n \n \nsteering system in order to keep it in top condition \n \n \nand prevent serious trouble. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Perform pre-\nperiodic \nmaintenance of \nsteering system \n1.1  Job requirements \nare determined \nbased on steering \nsystem repair order. \n1.2  Servicing \ninformation is \nsourced from \nservice manual. \n1.3  Tools, equipment \nand materials are \nprepared based on \nsteering system \nrepair order. \n1.4  Hazards and risks \nassociated in the \nworkplace are \nmanaged following \nOSHS. \n1.5  Protective covers \nare installed based \non standard \noperating \nprocedure. \n• Steering system \nfundamentals \n• Use of service \ninformation \nresources \n• Use of job/repair \norder \n• Tools, equipment \nand materials for \nmaintenance of \nsteering system \n• Installation of \nprotective covers \n• OSHS \n \n \nAttitudes: \n• Full attention to \ndetails \n• Time conscious \n• Complies to \nstandards \n• Interpreting \nspecifications \n• Preparing \nspecified tools, \nequipment and \nmaterials for \nsteering system \nmaintenance \n• Managing hazards \nand risk in the \nworkplace \n• Installing \nprotective covers \n• Sourcing out \nservicing \ninformation \n• Determining job \nrequirements for \nsteering system \n• Applying safety \npractices \n2.  Apply periodic \nmaintenance \nprocedures \n2.1  Steering system \ncomponents are \ninspected \naccording \nmanufacturer’s \nservice workshop \nmanual. \n2.2  Findings and \nrecommendations \nare reported to \nimmediate superior \nfollowing \ncompany’s \nstandard \nprocedures. \n2.3  Power steering fluid \n• Steering system \nfundamentals \n- Threaded \nfasteners \nfundamentals. \n- Torque wrench \nfundamentals. \n- Hydraulic steering \nfundamentals \n- Electric steering \nfundamentals \n- MIL illumination \n• Use of service \ninformation \nresources (ex. SM, \nBulletins, etc.) \n• Inspecting steering \nsystem \ncomponents \n• Writing job done \non repair order \n• Applying \nmaintenance \nmeasures \n• Reporting findings \nand \nrecommendations \n• Communication \nskills \n• Mathematical skills \n• Following manual \n• Practicing Safety\n\n--- PDF PAGE 75 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 73 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nis replaced based \non manufacturer’s \nservice workshop \nmanual. \n2.4  Steering wheel free \nplay inspection is \nconducted based \non service manual. \n2.5  Defects and \ndamages are \nreported to \nimmediate \nsupervisor. \n2.6  Safety practices are \napplied following \nOSHS. \n• Use of Job/repair \norder \n• Use of inspection \nchecksheets \n• Application of \nmaintenance \nmeasures \n• Mensuration \n• Metric system \n• Reporting of findings \nand \nrecommendations \n• OSHS \n• PPEs \n \n \nAttitudes: \n• Full attention to \ndetails \n• Time conscious \n• Complies to \nstandards \n3.  Perform work to \ncompletion \n3.1  Wastes are \ndisposed according \nto good \nhousekeeping \npractices \n3.2  Initial quality \ninspection is \nperformed based \non workplace \nprocedure \n3.3  Job done is written \ndown on the Repair \nOrder. \n3.4  Workplace is \nrestored according \ncompany’s \nstandard procedure \n3.5  Safety practices are \napplied following \nOSHS \n3.6  Tools and \nequipment are \nchecked, cleaned, \nand stored following \n5S \n• Waste management \n• Initial quality \ninspection \n• Information from job/ \nrepair order \n• 5S \n• 3Rs \n• OSHS \n• Accomplishing repair \norder \n• Restoration \nworkplace \n• Handling of tools \nand equipment \n• Following standard \n• Reporting results \nof inspection \n• Performing initial \nquality inspection \n• Applying OSHS \n• Managing waste \n• Performing final \ninspection \n• Accomplishing \nrepair order for job \ndone \n• Restoring \nworkplace \n• Practicing safety \nand 5S \n• Handling tools and \nequipment\n\n--- PDF PAGE 76 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 74 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Steering system \ncomponents \nMay include but not limited to the following: \n1.1   Steering column \n1.2   Steering shaft \n1.3   Steering shaft bearing \n1.4   Steering universal joints \n1.5   Steering column adjustment mechanism \n1.6   Electronic power steering \n1.7   Hydraulic power steering \n1.8   Tie-rods and rack end \n1.9   Rack and pinion gear box \n1.10 Steering wheel \n1.11 Fastener \n1.12 Fluids \n1.13 Reservoir and Vane pump \n1.14 Recirculating gear box \n1.15 Hydraulic hose \n2.  Inspection of steering \nsystem components \nMay include: \n2.1  Looseness \n2.2  Wear \n2.3  Damage \n2.4  Free-play \n2.5  Leaks \n2.6  Abnormal noise \n2.7  Malfunction on electric power steering \n3.  Defects and damages \nMay include: \n3.1  Damage on steering rack boot \n3.2  Power steering fluid leaks\n\n--- PDF PAGE 77 ---\nTR – Automotive Servicing NC I             Promulgated    February 27, 2018                                 75 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1  Performed pre-periodic maintenance of steering system \n1.2  Applied periodic maintenance procedures \n1.3  Performed work to completion \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1  Workplace: Real or simulated work area \n2.2  Appropriate Tools & equipment \n2.3  Materials relevant to the activity \n2.4  Repair manuals and related reference materials \n3.  Method of \nassessment \nCompetency MUST be assessed through: \n3.1  Direct observation \n3.2  Written exam \n3.3  Demonstration with oral questioning \n4.  Context of \nassessment \n4.1  Competency may be assessed individually in the actual \nworkplace or through accredited institution\n",
