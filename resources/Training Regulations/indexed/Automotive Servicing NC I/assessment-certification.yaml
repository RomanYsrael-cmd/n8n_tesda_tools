      "text": "5 Current holders of Certificates of Competency (COCs), shall have to undergo assessment in the amended Training Regulations upon expiration of their Certificates. --- PDF PAGE 107 --- TR – Automotive Servicing NC I Promulgated February 27, 2018 105 --- PDF PAGE 108 --- TR – Automotive Servicing NC I Promulgated February 27, 2018 106 Adhesives Substance used to hold gasket in place during assembly. It also maintains a tight seal by filling in small irregularities on a surface and prevents gasket from shifting due to vibration. Anti-lock braking system System that automatically controls wheel slip or prevents sustained wheel locking on braking Automotive service technician It refers to an all-around auto serviceman that can perform both mechanical and electrical as well as auto electronics maintenance checking and inspection of motor vehicle. Assesses vehicle problems, perform all necessary diagnostic test or installation of accessories and competently repairs or replaces faulty parts. Automatic transmission A transmission in which gear or ratio changes are self- activated, eliminating the necessity of hand shifting gears Automatic transmission fluid (ATF) A fluid used in vehicles with self shifting or automatic transmission. Backlash The amount of clearance or play between two meshed gears Brake system An automotive system that stops or slows down the motion or movement of the vehicle. Catalytic converter Emission The control device fitted in the exhaust system of an internal combustion engine. The converter reduces the toxicity of products of combustion by catalytic re- combination Charcoal canister Trap containing charcoal granules to store fuel evaporating from a fuel system and prevent its loss to atmosphere, particularly from a carburetor and fuel tank. Cockpit drill Is a sequence of checks which should be carried out inside the vehicle before driving. Hand tools Any tool that is powered by hand. Continuously variable transmission (CVT) A type of automatic transmission that can change seamlessly through a continuous range of effective gear ratios. --- PDF PAGE 109 --- TR – Automotive Servicing NC I Promulgated February 27, 2018 107 Continuously variable transmission fluid (CVTF) A fluid used for continuously variable transmission (CVT) Damper Also known as shock absorber Drive train A system in a motor vehicle that connects the transmission to the drive axels. Electric drill A portable, hand-held, motor-driven tool used for boring holes in a material powered either by direct or alternating current. Electronics Electrical assemblies, circuit and system that use electronic devices such as transistors and diodes. Emissions Any air contaminant, pollutant, gas stream from a known source which is introduced into the atmosphere. Environmental law Law that regulates the impact of human activities on the environment. Environmental law covers a broad range of activities that affect air, water, land, flora or fauna. It includes laws that relate to Protection of animals and plants. Factory-loaded parts Refers to loose items Final drive The end of the drive train before power is transmitted to the wheels. Fuel injection An electronic system that increases the performance ad fuel economy because it monitors engine conditions and provides the correct air/fuel mixture based on the engine’s demand. It injects fuel directly into the cylinder head enabling more precise control over the quantity used. Governor A speed sensing device that employs centrifugal force and spring tension to govern engine speed. Grinder a machine used for grinding something. Hand tools Tools that are manually operated by hand and does not require external power supply. Hotchkiss drive The type of rear suspension in which leaf springs absorbs the rear axle housing torque. Ignition system Electrical system devised to produce timed sparks from engine spark plug. Consisting of a battery, induction coil, capacitor, distributor, spark plugs and relevant switches and wiring. --- PDF PAGE 110 --- TR – Automotive Servicing NC I Promulgated February 27, 2018 108 Impact wrench It is a socket wrench power tool designed to deliver high torque output with minimal exertion by the user, by storing energy in a rotating mass, then delivering it suddenly to the output shaft. Intake manifold Tubing attached to the engine through which the air/fuel mixture reaches the cylinder. Job control It is a process of managing workshop load distribution. Job order Instructions in performing work according to specified time, cost estimates and requirements. Light duty vehicles These are motor vehicles whose gross vehicle weight is equal or less than 3,500 kgs. Powered by a gas or diesel engine. Lubricant A substance, such as oil or grease, used for minimizing friction, especially in an engine or component. Manual transmission fluid A fluid used for manual transmission Master cylinder The liquid-filled cylinder in the hydraulic brake system or clutch, where hydraulic pressure is developed when depresses a foot pedal. Measuring tools It is a device for measuring a physical quantity. In the physical sciences, quality assurance, and engineering, measurement is the activity of obtaining and comparing physical quantities of real-world objects and events. Multi point inspection Involves looking at all your vehicle’s major systems. Checking all the fluids, belts, hoses, tires, transmission & drivetrain, steering components, battery, lights, brakes, air, and gasoline. Occupational Safety and Health Standards Patent plate / Vehicle identification number (VIN) plate A plate containing vehicle identification number (VIN), engine number, color code, and other information related to the vehicle. Periodic maintenance schedule Also known as Preventive maintenance service Periodic maintenance service The regular servicing prescribed by manufacturer to maintain the vehicle’s top performance. Personal protective It is equipment that will protect the user against health or --- PDF PAGE 111 --- TR – Automotive Servicing NC I Promulgated February 27, 2018 109 equipment (PPE) safety risks at work. Pneumatic grease gun It is a common workshop and garage tool used for lubrication. Air-powered (pneumatic), where compressed air is directed to the gun by hoses, the air pressure serving to force the grease through the aperture. Pneumatic oil dispenser A pump jack, often used to pump oil out of wells. Pneumatic tools These tools are powered by compressed air. Common types of these air-powered hand tools that are used in industry. Positive crank ventilation An emission control system that prevents crank case gases from entering the atmosphere, usually by drawing the gases from the crank case and feeding them into the engine’s induction system. Position vehicle Any act of moving the vehicle whether manual or with the use of equipment. Power steering A steering that has been designed to make the wheel move more easily than in a manual steering system. Hydraulic assists the process utilizing hydraulic fluid. The fluid increases pressure in the power steering pump and aids in the movement of the steering mechanism. This fluid, called power steering fluid, is what is replaced at regular intervals to keep steering soft and comfortable. Power tools Tools that are actuated by an additional power source and mechanism other than the solely manual labor used with hand tools. Pressure The continuous physical force exerted on or against an object by something in contact with it. Quality check Checking and inspection of work done to make sure that servicing was done according to manufacturer standards. Repair order Document where services made to the vehicle are listed. Revolutions per minute (rpm) It is a measure of the frequency of rotation, specifically the number of rotations around a fixed axis in one minute. It is used as a measure of rotational speed of a mechanical component. Special Service tools A tool specially designed for specific job. Steering system An automotive system that is used to turn the wheels of a vehicle. --- PDF PAGE 112 --- TR – Automotive Servicing NC I Promulgated February 27, 2018 110 Suspension system An automotive system of tires, tire air, springs, shock absorbers and linkages that connects a vehicle to its wheels and allows to relative motion between the two. Super charged engine An engine that is similar to a turbo-charged engine which uses a series of belts or chains from the crankshaft to turn the turbines that forces the air/fuel mixture into the cylinder heads under pressure creating a bigger explosion which generates more power. A turbocharger uses the exhaust gases to turn the turbines to create the same effect. Thermostat A device for automatic regulation of temperature. Torque A twisting force that tends to cause rotation. Transaxle Type of construction in which the transmission and differential are combined in one unit. Trouble light It is a special lamp used to illuminate obscure places and able to handle moderate abuse. The lightbulb is housed in a protective cage and a handle that are molded to form a single unit. Turbo charged engine A performance-increasing turbine positioned in the exhaust system. Expanding exhaust gases spin an impeller (very small fan-type blades) at speeds up to 25 thousand rpm, driving a similar compressing impeller. Compressed air from the driven impeller is forced into the induction system, which squeezes more air/fuel mixture into the combustion chambers. With the greater charge of air and fuel, a more powerful combustion burn results, thus more power. The big advantage of the turbo over directly driven superchargers is the increased efficiency, although there is a slight lag before the turbine spins up and increases the power output. Originally turbo was developed to enable aircraft to fly at high altitudes, then they found use in diesel trucks and train engines to increase their torque. U-joint A four-joint cross-connected to two U-shaped yokes that serve as a flexible coupling between shafts. Vehicle performance It refers to operational and functional condition of the vehicle. Vehicle reference materials Materials which contains information for operations, maintenance and repair of vehicles. Wash bay Area where the vehicle is washed after service. --- PDF PAGE 113 --- TR – Automotive Servicing NC I Promulgated February 27, 2018 111 TRAINING REGULATIONS (TR) Qualification Title: Automotive Servicing NC I Qualification Code: ALTATS118 Revision No. Document Description Types* Replaces Version (TESDA Board Resolution No./ Date) New Version (TESDA Board Resolution No./ Date) Deployment Circular 00 Document Created Auto Servicing NC I Not Applicable TB No. 2006-09 April 20, 2006 Not Applicable 01 Document Amended Auto Servicing NC I to Automotive Servicing NC I TB No. 2006-09 April 20, 2006 TB No. 2013-11 December 17, 2013 Not Applicable 02 Document Amended Automotive Servicing NC I TB No. 2013-11 December 17, 2013 TB No. 2018 -03 February 27, 2018 Legend: *Description Types - Document Created - Document Amended --- PDF PAGE 114 --- TR – Automotive Servicing NC I Promulgated February 27, 2018 112 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who rendered their time and expertise to the development and validation of this Training Regulation. • THE TECHNICAL EXPERT PANEL (TEP) MR. CHRISTOPHER A. ALCANTARA Technical Expert Nissan Philippines Inc. (NPI) MR. MARLON G. PADAOAN Technical Expert Honda Cars Phils. Inc. (HCPI) MR. GIDEON C. BRUNO Technical Expert Mitsubishi Motors Phils. Corp. (MMPC) MR. ALLEN RAYMUND A. RUFO Technical Expert Toyota Motor Phils. Corp. (TMPC) MR. ROMMEL O. CABANELA Technical Expert Suzuki Philippines Inc. (SPH) MR. JERWIN S. SANGALANG Technical Expert Eurobrands Distributor Inc. (EDI) MR. GIAN FRANCO R. COSICO Technical Expert Isuzu Phi