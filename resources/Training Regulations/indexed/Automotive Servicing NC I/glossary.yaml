    {
      "term": "Turbo charged engine",
      "definition": "A performance-increasing turbine positioned in the exhaust system. Expanding exhaust gases spin an impeller (very small fan-type blades) at speeds up to 25 thousand rpm, driving a similar compressing impeller. Compressed air from the driven impeller is forced into the induction system, which squeezes more air/fuel mixture into the combustion chambers. With the greater charge of air and fuel, a more powerful combustion burn results, thus more power. The big advantage of the turbo over directly driven superchargers is the increased efficiency, although there is a slight lag before the turbine spins up and increases the power output. Originally turbo was developed to enable aircraft to fly at high altitudes, then they found use in diesel trucks and train engines to increase their torque."
