  "source_text": "SECTION 1 AUTOMOTIVE SERVICING NC I QUALIFICATION\n\nThe AUTOMOTIVE SERVICING NC I Qualification consist of competencies that\na person must achieve to perform pre-delivery inspection and periodic maintenance\nof automotive parts and components.\n\nThis Qualification is packaged from the competency map of the Automotive\nIndustry (Service sector) as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following\n\nCODE NO.\nBASIC COMPETENCIES\n500311101\nReceive and respond to workplace communication\n500311102\nWork with others\n500311103\nDemonstrate work values\n500311104\nPractice basic housekeeping procedures\n\nCODE NO.\nCOMMON COMPETENCIES\nALT723211\nValidate vehicle specification\nALT832212\nMove and position vehicle\nALT723214\nUtilize automotive tools\nALT723215\nPerform mensuration and calculation\nALT723216\nUtilize workshop facilities and equipment\nALT723217\nPrepare servicing parts and consumables\nALT723218\nPrepare vehicle for servicing and releasing\n\nCODE NO.\nCORE COMPETENCIES\nALT723376\nPerform pre-delivery inspection\nALT723377\nPerform periodic maintenance of automotive engine\nALT723378\nPerform periodic maintenance of drive train\nALT723379\nPerform periodic maintenance of brake system\nALT723380\nPerform periodic maintenance of suspension system\nALT723381\nPerform periodic maintenance of steering system\n\nA person who has achieved this Qualification is competent to be:\n❑ Pre-delivery inspector / Check lister\n❑ Periodic maintenance personnel/staff\n❑ Periodic maintenance associate\n❑ Junior technician\n❑ Maintenance technician\n❑ Auto – service personnel\n\n--- PDF PAGE 4 ---\nTR – Automotive Servicing NC I Promulgated February 27, 2018 2"
