nScrew drivers (assorted) \n4.3. \nSoldering iron/gun \n4.4.\nWrenches\n5. Equipment/testing \ndevices \n5.1. \nEquipment include but not limited to: \n5.1.1. Maintenance bench                        \n5.1.2. Instrument air supply equipment \n5.1.3. Power supply equipment \n5.2. \nTesting devices includes but not limited to: \n5.2.1. Multimeter \n5.2.2. Calibrators\n6. Materials \nInclude but not limited to: \n6.1. \nSealing materials \n6.2. \nPipes/tubes & fittings \n6.3. \nWires and cables \n \n6.4. \nCleaning materials \n6.5. \nLubricating materials \n7. Personal protective \nequipment \nInclude but not limited to: \n7.1. \nEar muffs/plugs \n7.2. \nGoggles/glasses/face \nshield \n7.3. \nSafety hat \n7.4.\nSafety apparel/suit\n \n7.5. \nSafety belt/harness \n7.6. \nSafety shoes  \n7.7. \nMask  \n7.8. \nGloves \n8. Fault/s or problem/s \n8.1. \nmechanical \n8.2. \nelectrical \n8.3. \nelectronics \n8.4. \ncomputer-based\n\n--- PDF PAGE 48 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC III  \n \n \n \n        Page 46"
