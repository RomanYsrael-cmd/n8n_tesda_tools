        "source_text": "ELC724305\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes needed to\nmaintain and repair instrumentation and control devices.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized Bold items are elaborated in the range of Variables\n1. Plan and prepare for\nmaintenance/repair\n1.1.\nMaintenance or repair is planned and prepared in\nline with job requirements.\n1.2.\nOHS policies and procedures are followed in line\nwith job requirements.\n1.3.\nInstrumentation and Control standards are\nfollowed in line with job requirements\n1.4.\nInstrumentation and control devices for\nmaintenance or repair are checked against\nspecifications and requirements.\n1.5.\nMaterials necessary to complete the work are\nobtained in accordance with established procedures\nand checked against job requirements.\n1.6.\nTools, equipment and testing devices needed for\nthe maintenance/repair are obtained and checked for\ncorrect operation and safety\n1.7.\nInstrumentation and control devices maintained or\nrepaired are identified based on Job/Service Order\nor instructions\n2. Maintain\ninstrumentation and\ncontrol devices\n2.1.\nAppropriate personal protective equipment is used\nas per OH&S procedure.\n2.2.\nNormal function of instrumentation and control\ndevices is checked in accordance with\nmanufacturer’s instructions & standard procedures.\n2.3.\nScheduled/periodic maintenance is performed in\naccordance with manufacturer’s requirements.\n2.4.\nUnplanned events or conditions are responded to in\naccordance with established procedures\n3. Repair\ninstrumentation and\ncontrol devices\n3.1.\nAppropriate personal protective equipment is used in\nline with standard procedures.\n3.2.\nNormal function of instrumentation and control\ndevices is checked in accordance with\nmanufacturer’s instructions.\n3.3.\nFault/s or problem/s in system or component is/are\ndiagnosed in line with the standard operating\nprocedures.\n3.4.\nUnplanned events or conditions are responded to in\naccordance with established procedures\n\n--- PDF PAGE 46 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC III\n\n Page 44\n\n4. Inspect and test the\nrepaired\ninstrumentation and\ncontrol devices\n4.1.\nFinal inspections are undertaken to ensure that the\ntesting conducted on the device conforms with the\nmanufacturer’s instruction/manual\n4.2.\nInstrumentation and control devices are checked to\nensure safe operation.\n4.3.\nWork site is cleaned and cleared of all debris and left\nin safe condition in accordance with company\nprocedures\n4.4.\nReport is prepared and completed according to\ncompany requirements\n\n--- PDF PAGE 47 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC III\n\n Page 45\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OH & S policies and\nprocedures\n1.1.\nOH & S guidelines\n1.2.\nPhilippine environmental standards\n2. Instrumentation and\nControl Standards\nInclude but not limited to:\n2.1.\nISA (Instrumentation, Systems and Automation)\nSociety (formerly Instrument Society of America)\n2.2.\nANSI (American National Standards Institute)\n2.3.\nASME (American Society of Mechanical Engineers)\n2.4.\nNEC (National Electrical Code)\n2.5.\nIEC (International Electrotechnical Commission)\n3. Instrumentation and\nControl Devices\nInclude but not limited to:\n3.1.\nSensors/Transmitters/\nTransducers\n3.2.\nIndicators\n3.3.\nControllers\n3.4.\nControl valves\n\n3.5.\nActuators\n3.6.\nRecorders\n3.7.\nAnnunciators\n3.8.\nProcess switches\n4. Tools\nTools for: cutting, shaping, drilling, threading, tapping,\nfinishing, dismantling/assembling. Tool set include but not\nlimited to:\n4.1.\nPliers (assorted)\n4.2.\nScrew drivers (assorted)\n4.3.\nSoldering iron/gun\n4.4.\nWrenches\n5. Equipment/testing\ndevices\n5.1.\nEquipment include but not limited to:\n5.1.1. Maintenance bench\n5.1.2. Instrument air supply equipment\n5.1.3. Power supply equipment\n5.2.\nTesting devices includes but not limited to:\n5.2.1. Multimeter\n5.2.2. Calibrators\n6. Materials\nInclude but not limited to:\n6.1.\nSealing materials\n6.2.\nPipes/tubes & fittings\n6.3.\nWires and cables\n\n6.4.\nCleaning materials\n6.5.\nLubricating materials\n7. Personal protective\nequipment\nInclude but not limited to:\n7.1.\nEar muffs/plugs\n7.2.\nGoggles/glasses/face\nshield\n7.3.\nSafety hat\n7.4.\nSafety apparel/suit\n\n7.5.\nSafety belt/harness\n7.6.\nSafety shoes\n7.7.\nMask\n7.8.\nGloves\n8. Fault/s or problem/s\n8.1.\nmechanical\n8.2.\nelectrical\n8.3.\nelectronics\n8.4.\ncomputer-based\n\n--- PDF PAGE 48 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC III\n\n Page 46\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nInterpreted work instructions according to job\nrequirements.\n1.2.\nConducted maintenance properly on the devices using\nstandard procedures\n1.3.\nDiagnosed faults in the devices\n1.4.\nRepaired or replaced defective devices\n1.5.\nChecked the maintained/repaired devices to ensure\nsafety\n1.6.\nDocumented the tasks undertaken\n2. Underpinning\nknowledge\nInclude but not limited to:\n2.1.\nOccupational health and safety\n2.2.\nInstrumentation & Control standards\n2.3.\nUse of tools\n2.4.\nMathematical calculations\n2.5.\nElectrical theory\n2.6.\nElectronics theory\n2.7.\nUse of test equipment and calibrators\n2.8.\nWiring techniques\n2.9.\nDrawing interpretation\n2.10. Soldering techniques\n2.11. Principles of Instrumentation\n2.12. Process variable measurements (pressure, level, flow,\ntemperature, analysis, etc.)\n2.13. Process Control Theory\n2.14. Process Control System (single-loop & multi-loop\ncontrollers, DCS, DAS, SCADA, etc)\n2.15. Sensors, transmitters, transducers & converters\n2.16. Programmable logic controllers\n2.17. Control valves and final control elements\n2.18. Computer operations\n2.19. Corrective & preventive maintenance procedures\n3. Underpinning skills\n3.1.\nReading skills required to interpret work instructions\n3.2.\nCommunication skills needed to interpret and define\nwork procedures\n3.3.\nSelection & use of proper tools & equipment\n3.4.\nTroubleshooting skills on device level\n3.5.\nProblem solving in unplanned events\n4. Method of\nassessment\n4.1.\nThe assessor may select at least three of the following\nassessment methods to objectively assess the\ncandidate:\n4.1.1. Observation\n4.1.2. Demonstration\n4.1.3. Questioning\n4.1.4. Third Party\n4.1.5. Portfolio\n\n--- PDF PAGE 49 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC III\n\n Page 47\n\n5. Resource Implication\nInclude but not limited to:\n5.1.\nInstrumentation & Control devices\n5.2.\nTools\n5.3.\nTest equipment and calibrators\n5.4.\nMaterials\n5.5.\nPPE\n5.6.\nTechnical manuals\n5.7.\nInstrumentation & Control drawings\n6. Context of\nAssessment\n6.1.\nAssessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 50 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC III\n\n Page 48"
