          "source_text": "1. Plan and prepare for loop \nchecking \n1.1. \nLoop checking is planned and prepared in line \nwith the job requirements.     \n1.2. \nOHS policies and procedures are followed in \nline with job requirements. \n1.3. \nInstrumentation and Control standards are \nfollowed in line with the job requirements \n1.4. \nAppropriate personnel are consulted to ensure \nthat the work is effectively coordinated \n1.5. \nLoop checking parameters are identified from \nappropriate documentation and/or requirements \n1.6. \nTools, equipment and testing devices needed \nfor loop checking  are obtained and checked for \ncorrect operation and safety \n1.7. \nInstrumentation and control loops to be loop-\nchecked  are identified from the Job/Service \nOrder or instructions \n2. Conduct loop checking \n2.1. \nAppropriate personal protective clothing is \nused in line with standard operating procedures. \n2.2. \nDevices’ defects are diagnosed using specified \ntesting procedures from manufacturer’s manual. \n2.3. \nDefect/s and fault/s on the devices & loops are \nidentified and reported in line with standard \noperating procedures. \n2.4. \nContingency measures are managed and \nimplemented in accordance with established \nprocedures \n3. Test the loops that were \nchecked \n3.1. \nInstrumentation & control loops are tested to \nensure safe operation. \n3.2. \nUnplanned events or conditions are responded \nto in accordance with established procedures \n3.3. \nReport is prepared/completed according to \ncompany procedures.\n\n--- PDF PAGE 42 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC III  \n \n \n \n        Page 40  \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. OH & S policies and \nprocedures\n1.1. \nOH & S guidelines \n1.2. \nPhilippine environmental standards \n2. Instrumentation and \nControl Standards \nInclude but not limited to: \n2.1. \nISA (Instrumentation, Systems and Automation) \nSociety (formerly Instrument Society of America) \n2.2. \nANSI(American National Standards Institute) \n2.3. \nASME (American Society of Mechanical Engineers) \n2.4. \nNEC (National Electrical Code) \n2.5.\nIEC (International Electrotechnical Commission)\n3. Tools \nTools for: dismantling/assembling.  Tool set include but not \nlimited to: \n3.1. \nPliers (assorted) \n3.2. \nScrew drivers (assorted) \n3.3. \nSoldering iron/gun \n3.4.\nWrenches\n4. Equipment/testing \ndevices \n4.1. \nEquipment include but not limited to: \n4.1.1. Communication equipment  \n            (e.g. 2-way radio, cell phone)  \n4.1.2   Configurator or programmer \n4.2. \nTesting devices include but not limited to: \n4.2.1. Multimeter \n4.2.2. Calibrators \n4.2.3. Signal simulators\n5. Instrumentation & \nControl loops \nInclude a combination of the following but not limited to: \n5.1. \nSensors, transmitters & other measuring elements \n5.2. \nIndicators, Recorders, Controllers, Annunciators, \ncomputer-based systems & other receiving elements \n5.3. \nFinal control elements (control valves, dampers) \n5.4.\nProcess & machineries\n6. Personal protective \nequipment \nInclude but not limited to: \n6.1. \nEar muffs/plugs \n6.2. \nGoggles/glasses/face \nshield \n6.3. \nSafety hat \n6.4.\nSafety apparel/suit\n \n6.5. \nSafety belt/harness \n6.6. \nSafety shoes  \n6.7. \nMask  \n6.8. \nGloves \n7. Defect/s or fault/s  \n7.1. \nmechanical \n7.2. \nelectrical \n7.3. \nelectronics \n7.4. \ncomputer-based\n\n--- PDF PAGE 43 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC III  \n \n \n \n        Page 41"
        },
        "evidence_guide": {
          "source_text": "1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate : \n1.1. \nInterpreted work instructions according to job \nrequirements. \n1.2. \nConducted loop-checks accurately on the system \nusing standard procedures \n1.3. \nTested the loop-checked system to insure safety \n1.4. \nDocumented the tasks undertaken \n2. Underpinning knowledge \nInclude but not limited to: \n2.1. \nOccupational health and safety \n2.2. \nInstrumentation & Control standards \n2.3. \nUse of tools \n2.4. \nMathematical calculations \n2.5. \nElectrical theory \n2.6. \nElectronics theory \n2.7. \nUse of test equipment and calibrators \n2.8. \nWiring techniques \n2.9. \nDrawing interpretation \n2.10. Soldering techniques \n2.11. Principles of Instrumentation \n2.12. Process variable measurements (pressure, level, \nflow, temperature, analysis, etc.) \n2.13. Process Control Theory \n2.14. Process Control System (single-loop & multi-loop \ncontrollers, DCS, DAS, SCADA, etc) \n2.15. Sensors, transmitters, transducers & converters \n2.16. Programmable logic controllers \n2.17. Control valves and final control elements \n2.18. Computer operations \n2.19. Process and Machinery operation \n3. Underpinning skills \n3.1. \nReading skills required to interpret work \ninstructions \n3.2. \nCommunication skills needed to interpret and \ndefine work procedures \n3.3. \nSelection & use of proper tools & equipment \n3.4. \nLoop-checking skills  \n3.5.\nProblem solving in unplanned events\n\n--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC III  \n \n \n \n        Page 42  \n \n \n \n \n4. Method of assessment \n4.1. \nThe assessor may select at least three of the \nfollowing assessment methods to objectively \nassess the candidate: \n4.1.1. Observation \n4.1.2. Demonstration \n4.1.3. Questioning \n4.1.4. Third Party \n4.1.5. Portfolio \n5. Resource Implication \nInclude but not limited to: \n5.1. \nInstrumentation & control devices \n5.2. \nTools  \n5.3. \nTest equipment, calibrators, configurators or \nprogrammers \n5.4. \nMaterials  \n5.5. \nPPE \n5.6. \nTechnical manuals \n5.7. \nInstrumentation & Control drawings \n6. Context of Assessment \n6.1. \nAssessment may be conducted in the workplace \nor in a simulated work environment",
