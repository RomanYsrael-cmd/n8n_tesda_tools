    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: Instrumentation & Control Servicing NC Level: NC III\n\nNominal Training Duration:\n36 hrs – Basic Competencies\n\n60 hrs – Common Competencies\n\n80 hrs – Core Competencies\n\n 176 hrs\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\nan Instrumentation & Control Technician, in accordance with industry standards. It covers\nthe basic & common competencies in addition to the core competencies such as loop\nchecking, maintaining and repairing Instrumentation & control devices. The nominal\nduration of 176 hr covers only the basic, common and core units at Instrumentation &\nControl Servicing NC III. TVET providers can however, offer a longer, ladderized course\ncovering both NC II and NC III basic, common and core units.\n\nBASIC COMPETENCIES\n36 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace\nprocesses.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group discussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance\nexpectation for team\nmembers.\n2.4 Supervise team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 51 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC III\n\n Page 49\n\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\ntools and techniques to\nsolve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3\nAnalyze results\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n2.1 Identify appropriate\ntechnology\n2.2 Apply relevant technology\n2.3 Maintain/enhance relevant\ntechnology\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n60 hrs\n\nNote:\nThose who have completed the course on Instrumentation and Control Servicing NC II or\nhave acquired the Instrumentation and Control Servicing NC II qualification can skip this\nportion on common competencies.\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Apply Quality\nStandards\n\n1.1 Asses quality of received\nmaterials\n1.2 Assess own work\n1.3 Engage in quality\nimprovement\n\n Field trip\n Symposium\n Film showing\n Simulation\n On the job\ntraining\n\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party\nreport\n\n2. Perform\nComputer\nOperation\n\n2.1 Set-up workstation\n2.2 Prepare storage media\n2.3 Work with files and objects\n2.4 Manipulate word\nprocessing software\n2.5 Manipulate spreadsheet\nsoftware\n2.6 Manipulate customize and\ndatabase applications\n2.7 Utilize the internet\n2.8 Maintain computer\nhardware and software\n\n Modular\n Film showing\n Computer\nbased training\n(e-learning)\n Project method\n On the job\ntraining\n\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party\nreport\n Assessment of\noutput product\n Portfolio\n Computer-\nbased\nassessment\n\n--- PDF PAGE 52 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC III\n\n Page 50\n\n3.\nUse Hand\nTools\n\n3.1 Identify, explain and apply\nthe use of different types\nof hand tools\n3.2 Perform basic\nmaintenance and proper\nstorage of hand tools\naccording to the standard\noperating procedures\n3.3 Document and record the\nsequence of events in safe\nkeeping hand tools.\n\n Lecture /\nDemonstration\n Distance\neducation\n Film Showing\n\n Written/Oral\nexamination\n Practical\ndemonstration\n\n4.\nPerform\nMensurations\nand\nCalculation\n\n4.1 Select measuring\ninstruments;\n\n4.2 Carry-out measurements\nand calculations;\n\n Self- paced/\nmodular\n Demonstration\n Small group\ndiscussion\n Distance\neducation\n\n Written/Oral\nexamination\n Practical\ndemonstration\n\n5.\nInterpret\nTechnical\nDrawings\nAnd Plans\n\n5.1 Select and interpret\ntechnical drawing\n5.2 Perform freehand\nsketching\n\n Lecture/\ndemonstration\n Dualized\n Distance\nlearning\n\n Written /oral\n examinations\n Direct\n observation\n Project method\ninterview\n\n6.\nTerminate\nand Connect\nElectrical\nwiring and\nElectronic\nCircuit\n\n6.1 Terminate or join non-\nsoldered connections\n6.2 Terminate or join soldered\nconnections\n\n Film Viewing\n Individualized\nLearning\n Direct Student\nLaboratory\nExperience\n On the Job\nTraining\n Project\n Method\n\n Demonstration\nand Questioning\n Assessment of\nOutput Product\n\n--- PDF PAGE 53 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC III\n\n Page 51\n\nCORE COMPETENCIES\n80 hrs\n\nNote: This course design covers only Instrumentation & Control Servicing NC III level core units.\nThe trainee attending this course must have completed first the units for Instrumentation\nand Control Servicing NC II.\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Loop-Check\nInstrumentation\n& Control\nDevices\n1.1 Read & interpret work\n instructions according to job\n requirements.\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Written exam\n• Practical exam\nObservation in\nworkplace\n• Interviews/\nquestioning\n1.2 Identify the tools, equipment,\n testing devices, & materials\n needed for loop checking.\n1.3 Identify the PPE & OHS\n policies & procedures required\n for the loop checking job.\n1.4 Loop check Instrumentation &\n control devices according to\n technical requirements &\n standards\n1.5 Conduct functional test\n procedure of the loop checked\n Instrumentation & Control\n devices\n1.6 Prepare a loop check &\n testing report\n\n2. Maintain and\nRepair\nInstrumentation\n& Control\nDevices\n2.1 Read & interpret work\n instructions according to the\n maintenance & repair job.\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n• Written exam\n• Practical exam\n• Observation in\nworkplace\n• Interviews/\nquestioning\n2.2 Identify the tools, equipment,\n testing devices, & materials\n needed for maintenance &\n repair.\n2.3 Identify the PPE & OHS\n policies & procedures required\n for the maintenance & repair\n job.\n2.4 Maintain Instrumentation &\n control devices according to\n technical requirements &\n standards\n2.5 Diagnose & repair faults or\n problems in instrumentation &\n control devices\n2.6 Conduct tests & inspection to\n determine normal functionality\n & to insure safe operation.\n2.7 Prepare a maintenance &\n repair report\n\n--- PDF PAGE 54 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC III\n\n Page 52"
