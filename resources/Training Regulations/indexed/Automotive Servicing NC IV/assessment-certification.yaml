  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of Automotive Servicing NC IV, the candidate must\ndemonstrate competence through project-type assessment covering all units of listed in\n4.1.1. Successful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.1.1\n\n•\nPlan assessment activities and processes\n•\nManage facility and inventory requirements\n•\nEstimate complex job\n•\nEnsure a safe workplace\n•\nImplement continuous improvement\n•\nManage people performance\n•\nPlan and manage compliance with environmental regulations in a workplace or\nbusiness\n•\nService Electronic Body Management System\n•\nService and repair electronically controlled anti-lock braking system\n•\nService and repair electronically operated traction control System\n•\nService and repair electronically operated stability control System\n•\nService Diesel Fuel Injection System Components\n•\nService Electronic Drive Management System\n•\nService Diesel Engine Management System\n•\nService Emission Control System\n•\nEstimate complex job\n•\nEnsure a safe workplace\n•\nImplement continuous improvement\n\n4.2 Individual aspiring to be awarded the qualification of Automotive Servicing\nNC IV must acquire Certificates of Competency in all the following cluster of\nunits of competency or core unit of the Qualification. Candidates may apply\nfor assessment in any accredited assessment center.\n\n4.2.1 Managing Service Shop\n• Plan assessment activities and processes\n• Manage facility and inventory requirements\n• Estimate complex job\n• Ensure a safe workplace\n• Implement continuous improvement\n• Manage people performance\n• Plan and manage compliance with environmental regulations in a\n workplace or business\n4.2.2 Body management and underchassis electronic control system servicing\n• Service Electronic Body Management System\n•Service and repair electronically controlled anti-lock braking system\n•Service and repair electronically operated traction control System\n•Service and repair electronically operated stability control System\n\n--- PDF PAGE 138 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n136\n\n4.2.3 Engine electronic control system servicing\n• Service Diesel Fuel Injection System Components\n• Service Electronic Drive Management System\n• Service Diesel Engine Management System\n\n4.2.4Service Emission Control System\n\nSuccessful candidates shall be awarded Certificates of Competency (COC).\n\n4.3 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.4.2 Experienced workers (wage employed or self employed)\n\n4.5 Reassessment is allowed only after one month from the date of assessment.\nReassessment for a National Certificate shall be done only on the task/s that the\ncandidate did not successfully achieve.\n4.6 A candidate who fails the assessment for two (2) consecutive times will be required to\ngo through a refresher course before taking another assessment.\n4.7 Only certificated individuals in this Qualification may be nominated by the industry for\naccreditation as competency assessor.\n4.8 Only accredited competency assessors are allowed to conduct competency\nassessment, however, trainers who are accredited competency assessors are not\nallowed to assess their trainees.\n4.9 Assessment on competence must be undertaken only in the TESDA accredited\nassessment center. The performance assessment (demonstration of competence),\nhowever, may be done in any venue or workplace duly designated by an accredited\nassessment center.\n4.10 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification.\n\n--- PDF PAGE 139 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n137\n\n--- PDF PAGE 140 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n138\nDEFINITION OF TERMS\n1. Light Duty Vehicles\nThese are motor vehicles whose gross vehicle weight is\nequal or less than 3,500 kgs. Powered by a gas or diesel\nengine.\n\n2. Automotive Service\nTechnician\nRefers to an all around auto serviceman that can perform\nboth mechanical and electrical as well as auto electronics\nmaintenance checking and inspection of motor vehicle.\nAssesses\nvehicle\nproblems,\nperform\nall\nnecessary\ndiagnostic\ntest\nor\ninstallation\nof\naccessories\nand\ncompetently repairs or replaces faulty parts.\n\n3. Adhesives\nSubstance used to hold gasket in place during assembly. It\nalso maintains a tight seal by filling in small irregularities on\na surface and prevents gasket from shifting due to\nvibration.\n\n4. Anti-Lock Braking\nSystem\n\nSystem that automatically controls wheel slip or prevents\nsustained wheel locking on braking\n5. Automatic\nTransmission\nA transmission in which gear or ratio changes are self-\nactivated, eliminating the necessity of hand shifting gears\n\n6. Backlash\nThe amount of clearance or play between two meshed\ngears\n\n7. Catalytic Converter\n\nEmission The control device fitted in the exhaust system of\nan internal combustion engine. The converter reduces the\ntoxicity of products of combustion by catalytic re-\ncombination\n\n8. Charcoal Canister\nTrap containing charcoal granules to store fuel evaporating\nfrom a fuel system and prevent its loss to atmosphere,\nparticularly from a carburetor and fuel tank.\n9. Electronics\nElectrical assemblies, circuit and system that use electronic\ndevices such as transistors and diodes.\n\n10. Emissions\nAny air contaminant, pollutant, gas stream from a known\nsource which is introduced into the atmosphere.\n\n11. Final Drive\nThe end of the drive train before power is transmitted\nto the wheels.\n12. Fuel Injection\nAn electronic system that increases the performance ad\nfuel economy because it monitors engine conditions and\nprovides the correct air/fuel mixture based on the engine’s\ndemand. It injects fuel directly into the cylinder head\nenabling more precise control over the quantity used.\n13. Governor\n\nA speed sensing device that employs centrifugal force and\nspring tension to govern engine speed.\n14. Hotchkiss Drive\nThe type of rear suspension in which leaf springs absorbs\nthe rear axle housing torque.\n15. Intake Manifold\n\nTubing attached to the engine through which the air/fuel\nmixture reaches the cylinder.\n\n--- PDF PAGE 141 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n139\n16. Ignition System\nElectrical system devised to produce timed sparks from\nengine spark plug. Consisting of a battery, induction coil,\ncapacitor, distributor, spark plugs and relevant switches\nand wiring.\n17. Master Cylinder\nThe liquid-filled cylinder in the hydraulic brake system or\nclutch, where hydraulic pressure is developed when\ndepresses a foot pedal.\n18. Periodic\nMaintenance\nService\nThe regular servicing prescribed by manufacturer to\nmaintain the vehicle’s top performance.\n\n19. Positive Crank\nVentilation\nEmission control system that prevents crank case gases\nfrom entering the atmosphere, usually by drawing the\ngases from the crank case and feeding them into the\nengine’s induction system.\n20. Power Steering\nSteering that has been designed to make the wheel move\nmore easily than in a manual steering system. Hydraulic\nassists the process utilizing hydraulic fluid. The fluid\nincreases pressure in the power steering pump and aids in\nthe movement of the steering mechanism. This fluid, called\npower steering fluid, is what is replaced at regular intervals\nto keep steering soft and comfortable.\n21. Super Charged\nEngine\nAn engine that is similar to a turbo-charged engine which\nuses a series of belts or chains from the crankshaft to turn\nthe turbines that forces the air/fuel mixture into the cylinder\nheads under pressure creating a bigger explosion which\ngenerates more power. A turbocharger uses the exhaust\ngases to turn the turbines to create the same effect.\n22. Transaxle\nType of construction in which the transmission and\ndifferential are combined in one unit.\n23. Thermostat\nA device for automatic regulation of temperature\n24. Turbo Charged\nEngine\nA performance-increasing turbine positioned in the exhaust\nsystem. Expanding exhaust gases spin an impeller (very\nsmall fan-type blades) at speeds up to 25 thousand rpm,\ndriving a similar compressing impeller. Compressed air\nfrom the driven impeller is forced into the induction system,\nwhich squeezes more air/fuel mixture into the combustion\nchambers. With the greater charge of air and fuel, a more\npowerful combustion burn results, thus more power. The\nbig\nadvantage\nof\nthe\nturbo\nover\ndirectly\ndriven\nsuperchargers is the increased efficiency, although there is\na slight lag before the turbine spins up and increases the\npower output. Originally turbo were developed to enable\naircraft to fly at high altitudes, then they found use in diesel\ntrucks and train engines to increase their torque.\n25. U-joint\n\nA four-joint cross-connected to two U-shaped yokes that\nserve as a flexible coupling between shafts.\n\n--- PDF PAGE 142 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n140\n ACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who rendered their time and expertise to the\ndevelopment and validation of this Training Regulation.\n\nTHE TECHNICAL ADVISORY PANEL (TAP)\nMR. ALLEN RAYMUND A. RUFO\nTAP Chairman – Automotive Sector\nTOYOTA Motors Philippines, Corp.\nParañaque City\nAutomotive Industry Board Foundation\n(AIBFI)\nSuite 1206, 12 th flr. Jollibee Center\nSan Miguel Avenue, Pasig City\nMS. MA. CLARISSA V. FUNESTO\nTAP Alternate Chairperson – Automotive Sector\nHONDA Phils. Inc.\nParañaque City\nAutomotive Industry Board Foundation\n(AIBFI)\nSuite 1206, 12 th flr. Jollibee Center\nSan Miguel Avenue, Pasig City\nMR. SIXTO D. CAYPUNO\nTAP Member – Academe\nSamson Technical College\nCubao, Quezon City\nMR. ANGEL DIMALANTA\nTAP Member – Labor\nTOYOTA Motors Phils., Parañaque City\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\nAUTOMOTIVE SERVICNG\nEFREN D. BISMONTE\nERNESTO L. ALMAZORA\nELMER B. DEL ROSARIO\nBENIGNO AQUINO JR.\nTOYOTA Motors Phils. Corp.\nSta. Rosa Laguna\nRONNIE A. TRANCE\nCITIMOTORS\nPasong Tamo, Makati\nUNDRICO D. CORPUZ JR.\nMonark Foundation Tech.\nInstitute\nLibis, Quezon City\nALVIN F. ABIAS\nDon Bosco Technical Institute\nMakati City\nANTONIO D. AGALOOS\nJOSE B. TORRES\nSamson Technical College\nQuezon City\nThe PARTICIPANTS in the National Validation of this Training Regulation\nTESDA III\nTESDA VI\nTESDA VIII\nTESDA 10\nTESDA XII\nThe Members of the TESDA Board\nThe TESDA Executive Committee\nThe MANAGEMENT and STAFF of the TESDA Secretariat\nSSCO\nNITVET\nOFTVET\n\n--- PDF PAGE 143 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n141\nFOR THE REVISION STAGE\n\n• THE TECHNICAL EXPERT COMMITTEE\n\nANTONIO A. GIMENEZ\nExecutive Director\nPhilippine Automotive Federation, Inc.\n\nRODOLFO NUNEZ\nConsultant, Bataan Automotive Manufacturing Corporation\n(Formerly with Ford and Nissan)\n\nCELSO LIBRANDO\nMaintenance Manager, Victory Liner\n(Former Service Manager, Toyota)\n\nMARIO GUEVARRA\nTechnical Services Manager, Nissan\n\nThe PARTICIPANTS in the Validation of these Training\nRegulations\n\nLEONARDO GARI\nTechnical Service Manager\nNissan Motor Phils.\nALFREDO MAGPAYO\nManager\nHonda Phils.\nBONIFACIO FAJUTNAO\nOwner\nPoctoy Motor Repair Shop\nDENNIS MATA\nFleet Maintenance Supvr.\nMarycheck Trading\n\n• THE TESDA BOARD - STANDARDS SETTING AND SYSTEMS DEVELOPMENT\nCOMMITTEE\n\n• THE MANAGEMENT AND STAFF OF THE TESDA SECRETARIAT\n\n•\nQualifications and Standards Office (QSO)\n\n•\nZoilo C.Galang\n-\nTESDA-QSO-CSD\n•\nFlorante P. Inoturan\n-\nTESDA-QSO-CSD\n•\nAbel B. Elpedes\n-\nTESDA-QSO-CTAD\n•\nHoward Mark N. Plete\n-\nTESDA-QSO-CSD"
