        "source_title": "SERVICE AND REPAIR ELECTRONICALLY OPERATED STABILITY CONTROL SYSTEMS",
        "source_text": "--- PDF PAGE 92 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n90\nUNIT OF COMPETENCY    : \nSERVICE AND REPAIR ELECTRONICALLY \n                                                      OPERATED STABILITY CONTROL SYSTEMS \n \nUNIT CODE  \n \n   : \nALT 723364 \n \nUNIT DESCRIPTOR             :        This unit covers the competence to carry out \nservice/repairs to electronic stability control \nsystems in accordance with manufacturer / \ncomponent supplier specifications. The unit \nincludes identification and confirmation of work \nrequirement, preparation for work, testing of \nsystems,identification of servicing and repair \nrequirements, servicing and repair of systems and \ncompletion of work finalization processes, \nincluding clean-up and documentation. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n(NOTE: All standard of performance for Service and Repair \nEmission Systems is in accordance with company standard \noperating procedure and manufacturer’s specification manuals \nusing specified tools and equipment.)\n1.  Prepare for work \n1.1 Work instructions are used to determine job \nrequirements, including quality, material, equipment \nquantities and service manuals \n1.2 Job specifications are read and interpreted \n1.3 OH&S requirements, including personal protection \nneeds, are observed throughout the work \n1.4 Electronic system protection devices, processes and \nprecautions are identified appropriate to the \napplication \n1.5 Tools and equipment are identified and checked for \nsafety and correct operation \n1.6 Procedures are identified to minimize task time \n2. Test control system,  \ndiagnose faults and \ndetermine service / \nrepair requirements \n2.1 Correct information is accessed and interpreted  \n      from manufacturer/component supplier specifications \n2.2 Tests are carried out according to manufacturer / \ncomponent supplier recommended procedures using \ntooling, equipment and techniques \n2.3 Testing is completed without causing damage to \ncomponent or system \n2.4 Test results are used to diagnose system/component \nfaults \n2.5 Service/repair requirements are determined \n2.6 Testing is carried out according to industry  \n      regulations/guidelines OH&S and enterprise/  \n      procedures policies\n\n--- PDF PAGE 93 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n91\n \n3.  Service/repair   \nelectronic stability \ncontrol systems \n3.1 Correct information is accessed and interpreted from \nManufacturer / component supplier specifications \n3.2 Service/repair requirements are carried out according \nto manufacturer / component supplier recommended \nspecifications and procedures \n3.4 Service/repair is completed without causing damage\n        to component or system \n3.4 Service, repair and retesting are carried out \naccording to industry regulations/guidelines, OH&S \nand enterprise / procedures policies \n4. Clean up work area \nand maintain \nequipment \n4.1 Material that can be reused is collected and stored \n4.2 Waste and scrap are removed following workplace \nprocedures \n4.3 Equipment and work area are cleaned and inspected \nfor serviceable conditions in accordance with \nworkplace procedures \n4.4 Unserviceable equipment is tagged and faults \nidentified in accordance with workplace procedures \n4.5 Operator maintenance is completed in accordance \n      with manufacturer / component supplier \n      specifications and site procedures \n4.6 Tooling is maintained in accordance with workplace \nProcedures\n\n--- PDF PAGE 94 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n92\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  OH&S \n1.1  OH&S requirements are to be in accordance with \nlegislation/regulations/codes of practice and enterprise \nsafety policies and procedures.  \n1.1.1. Protective clothing and equipment, \n1.1.2. use of tooling and equipment, \n1.1.3. workplace environment and safety \n1.1.4. handling of material \n1.1.5. use of fire fighting equipment \n1.1.6. enterprise first aid \n1.1.7. hazard control and hazardous materials and \nsubstances \n1.1.8. Personal protective equipment is to include that \nprescribed under legislation/regulation/codes of \npractice and workplace policies and procedures \n \n1.3 Safe operating procedures are to include, but are \n not limited to the  \n1.1.1. conduct of operational risk assessment and \n1.1.2. treatments associated with vehicular \nmovement \n1.1.3. toxic substances \n1.1.4. electrical safety \n1.1.5. machinery movement and operation \n1.1.6. manual and mechanical lifting and shifting\n2.  Tools and equipment \nMay include: \n2.1  Hand tools \n2.2  Multimeter, \n2.3  Vehicle lifting devices \n2.4  Power tools \n2.5  Special tooling for removal/replacement \n2.6  Brake dynamometer \n2.7  Electronic testing equipment \n2.8  Oscilloscope and scan tools\n3.  Information \nMay include: \n3.1  Verbal or written and graphical instructions, signage,  \nwork schedules / plans / specifications, work \nbulletins, memos, material safety data sheets, \ndiagrams or sketches \n3.2  Safe work procedures related to service and repair \n       of electronically controlled anti-lock braking systems  \n3.3 Manufacturer specification and service manual \n4.  Fault \nMay include: \n4.1  Component malfunction \n4.2  System adjustment \n4.3  Open, short and grounded circuits \n4.4  Sensor malfunction \n4.5  Sensor network \n4.6  Network operation faults\n\n--- PDF PAGE 95 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n93\nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate:  \n1.1  Observed safety procedures and requirements \n1.2  Communicated effectively with others involved in or \n        affected by the work \n1.3  Selected methods and techniques appropriate to the \n       circumstances \n1.4 Completed preparatory activity in a systematic \n manner \n1.5  Tested, inspected  and evaluated electronic stability \ncontrol systems, including sensors \n1.6  Diagnosed and determined the repair/replacement \n       requirements to rectify faults \n1.7  Serviced /repaired electronic stability control    \n       systems to workplace and manufacturer/component \nsupplier requirements\n2.  Required knowledge  \n2.1  OH&S regulations/requirement, equipment, material \n       and personal safety requirements \n2.2  Operating principles of electronic stability control \n       systems \n2.3  Construction and operation of electronic stability    \ncontrol systems \n2.4  Types and layout of service/repair manuals  \n       (hard copy and electronic) \n2.5  Relationship to other electronically controlled       \n       system(s), including shared components like ECUs,   \n       sensors \n2.6  Testing, diagnosis and fault determination \nprocedures \n2.7  Servicing/repairing, removal, replacement and \n       adjustment procedures relevant to application \n2.8  Work organization and planning processes \n2.9 Enterprise quality processes \n2.10 Quality procedures, e.g., 5S \n2.11 Environmental-conservation procedures,  \n       e.g., 3R (reduce, reuse, recycle)\n3.  Required skills \n3.1   Collecting, organizing and understanding \ninformation related    to work orders, plans and \nsafety procedures for servicing, repairing and \ntesting of electronic stability control systems \n3.2   Planning and organizing activities, including \npreparation and layout of worksite and obtaining of \nequipment and material  \n3.3   Using pre-checking and inspection techniques to   \nanticipate planning and scheduling problems, avoid \nwastage of time and material \n3.4  Using workplace technology related to the service \nand repair of electronically operated stability control \nsystems, including the use of specialist tooling and \nequipment, measuring equipment, computerized \ntechnology and communication devices and the \nreporting/documenting of results\n\n--- PDF PAGE 96 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n94\n \n4.  Resource \nimplications \nThe following resources should be provided:  \n4.1  Workplace location or simulated workplace \n4.2  Material relevant to the service and repair of \n       electronically operated stability control systems \n4.3  Equipment, hand and power tools appropriate to the \n       service and repair of electronically traction control    \nsystems \n4.4  Specifications and work instructions \n5.  Method of \nassessment \nCompetency in this unit may be assessed through:  \n5.1 Observation/Demonstration with questioning  \n5.2 Written test  \n5.3   Portfolio  \n6.  Context of \nassessment \n6.1 Competency must be assessed on the job or \nsimulated environment.  \n6.2 The assessment of practical skills must take place \nafter a period of supervised practice and repetitive \nexperience\n",
