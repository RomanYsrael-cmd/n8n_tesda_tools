        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Observed safety procedures and requirements\n1.2 Communicated effectively with others involved in or\n affected by the work\n1.3 Selected methods and techniques appropriate to the\n circumstances\n1.4 Completed preparatory activity in a systematic\n manner\n1.5 Tested, inspected and evaluated electronically\noperated traction control systems, including wheel\nsensors\n1.6 Diagnosed and determined the repair/replacement\n requirements to rectify faults\n1.7 Serviced /repaired electronically operated traction\ncontrol systems to manufacturer/component\nsupplier requirements\n2. Required knowledge\n2.1 OH&S regulations/requirement, equipment, material\n and personal safety requirements\n2.2 Operating principles of electronically operated\ntraction control systems\n2.3 Construction and operation of electronically operated\ntraction control systems\n2.4 Types and layout of service/repair manuals\n (hard copy and electronic)\n2.5 Relationship to other electronically controlled\n system(s), including shared components like ECUs,\n sensors\n2.6 Testing, diagnosis and fault determination\nprocedures\n2.7 Servicing/repairing, removal, replacement and\n adjustment procedures relevant to application\n2.8 Work organization and planning processes\n2.9 Enterprise quality processes\n2.10 Quality procedures, e.g., 5S\n2.11 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n\n--- PDF PAGE 91 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n89\n\n3. Required skills\n3.1 Collecting, organizing and understanding\ninformation related to work orders, plans and\nsafety procedures for servicing, repairing and\ntesting electronic traction control systems\n3.2 Planning and organizing activities, including\npreparation and layout of worksite and obtaining of\nequipment and material\n3.3 Using pre-checking and inspection techniques to\nanticipate planning and scheduling problems, avoid\nwastage of time and material\n3.4 Using workplace technology related to the service\nand repair of electronically operated traction control\nsystems, including the use of specialist tooling and\nequipment, measuring equipment, computerized\ntechnology and communication devices and the\nreporting/documenting of results\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace location or simulated workplace\n4.2 Material relevant to the service and repair of\n electronically operated traction control systems\n4.3 Equipment, hand and power tools appropriate to the\n service and repair of electronically operated traction\ncontrol systems\n4.4 Specifications and work instructions\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation/Demonstration with questioning\n5.2 Written test\n5.3 Portfolio\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or\nsimulated environment.\n6.2 The assessment of practical skills must take place\nafter a period of supervised practice and repetitive\nexperience\n\n--- PDF PAGE 92 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n90\nUNIT OF COMPETENCY :\nSERVICE AND REPAIR ELECTRONICALLY\n OPERATED STABILITY CONTROL SYSTEMS\n\nUNIT CODE\n\n :"
