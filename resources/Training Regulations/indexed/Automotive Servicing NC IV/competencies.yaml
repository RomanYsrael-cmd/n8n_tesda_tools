od of supervised practice and repetitive\nexperience\n\n--- PDF PAGE 82 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n80\nUNIT OF COMPETENCY :\nSERVICE AND REPAIR ELECTRONICALLY\nCONTROLLED ANTI-LOCK BRAKING SYSTEMS\n\nUNIT CODE\n:"
