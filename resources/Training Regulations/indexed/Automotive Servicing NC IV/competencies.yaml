n procedures for selection and \nimplementation \nof \nrisk \ncontrol \nmeasures \nin \naccordance with the hierarchy of control  \n3.4. \nIdentify inadequacies in existing risk control measures \nin accordance with the hierarchy of control and \npromptly provide resources to enable implementation \nof new measures  \n3.5.\nIdentify intervention points for expert OHS advice\n4. Establish and \nmaintain a quality \nOHS management \nsystem \n4.1.\nDevelop and provide an OHS induction and training \nprogram \nfor \nall \nemployees \nas \npart \nof \nthe \norganization's training program \n4.2. \nUtilize system for OHS record keeping to allow \nidentification of patterns of occupational injury and \ndisease in the organization \n4.3. \nMeasure and evaluate the OHS system in line with \nthe organization's quality systems framework \n4.4. \nDevelop and implement improvements to the OHS \nsystem to achieve organizational OHS objectives \n4.5. \nEnsure \ncompliance \nwith \nthe \nOHS \nlegislative \nframework so that legal OHS standards are \nmaintained as a minimum\n\n--- PDF PAGE 114 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n112\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. OHS legislation\nMay include: \n1.1      Common law duties to meet general duty of care \nrequirements \n1.2     Regulations and approved codes of practice relating \nto hazards in the work area \n1.3   Requirements for establishment of consultative \narrangements including those for health and safety \nrepresentatives, and health and safety committees \n1.4 Requirements for effective management of hazards \n1.5 Requirements for provision of information and training \nincluding training in safe operating procedures, \nprocedures for workplace hazards, hazard \nidentification, risk assessment and risk control, and \nemergency and evacuation procedures \n1.6 Requirements for the maintenance and confidentiality \nof records of occupational injury and disease\n2. Control of associated \nrisks \nMay include:\n2.1      Administrative \n2.2. \nCounseling / disciplinary processes \n2.3. \nElimination \n2.4. \nEngineering \n2.5. \nHousekeeping and storage \n2.6. \nIssue resolution \n2.7. \nOHS records maintenance and analysis \n2.8. \nPersonal protective equipment \n2.9. \nPurchasing of supplies and equipment \n2.10. Workplace inspections including plant and equipment\n3. Organizational \nhealth and safety \nrecord keeping \nMay include:\n3.1  Audit and inspection reports  \n3.2 workplace environmental monitoring records \n3.3 consultation e.g. meetings of health & safety committees, \nwork group meeting agendas including OHS items and \nactions \n3.4 induction, instruction and training \n3.5 manufacturers' and suppliers' information including \ndangerous goods storage lists \n3.6 hazardous substances registers \n3.7 plant and equipment maintenance and testing reports \n3.8 workers compensation and rehabilitation records \n3.9first aid/medical post records\n\n--- PDF PAGE 115 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n113\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate \nunderstand and explain: \n1.1 Detailed knowledge and application of all relevant OHS \nlegislative frameworks \n1.2 Establishment and maintenance of arrangements for \nmanaging OHS within the organizations' business \nsystems and practices \n1.3 Identification of intervention points for expert OHS \nadvice \n1.4 Principles and practice of effective OHS management in \na small, medium or large business. \n2. Required knowledge  \n6.1  Application of the hierarchy of control (the preferred \norder of risk control measures from most to least \npreferred, that is, elimination, engineering controls, \nadministrative controls, personal protective equipment) \n6.2 Hazard identification and risk management \n6.3 Relevant legislation from all