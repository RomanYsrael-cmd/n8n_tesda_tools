        "source_text": "ALT311371\nUNIT DESCRIPTOR : This unit of competency covers the competence to plan and\nimplement management system that ensures the protection\nof the environment in a workplace or business.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and manage\ncompliance with\nenvironmental\nregulations\n1.1 Reasons for ethical environmental practice in a\nworkplace or business are identified\n1.2\nEnvironmental\nresponsibilities\nof\nemployers\nand\nemployees in an automotive workplace or business\nare identified\n1.3 Penalties for enterprise and individual breaches of the\nlegislation are identified\n1.4\nWaste products are minimized and facilities provided\nfor waste materials to be stored in bins for recycling or\ndisposal\n1.5\nCollection\nand\nrecycling\narrangements\nare\nimplemented for liquids, sludge, solids and other waste\n1.6\nSuppliers with minimal excess packaging on goods\nreceived are sourced and packaging on goods received\nis sorted and disposed of appropriately\n1.7\nWaste and energy conservation strategies are\nidentified and implemented\n2\nManage potential\nhazards to storm\nwater system to\navoid\ncontamination\n2.1. Systems are in place to ensure wastewater does not\nenter the storm water system\n2.2. All drains and flows are identified on a worksite map\ndirectly indicating where they flow\n2.3. Trade waste permits are in place\n2.4. Undercover and drained areas are provided and used\nfor\nthe\nstorage\nof\nall\nmaterials\ncontaining\nenvironmentally hazardous substances\n2.5. Proper tools and equipment are provided and used to\nprevent storm water contamination\n2.6. Workplace is kept clean to prevent unintentional storm\nwater pollution\n\n--- PDF PAGE 123 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n121\n\n3\nManage potential\nhazards to air\nquality to avoid\ncontamination\n3.1.\nHazards of airborne particles are identified, minimized\nand contained\n3.2.\nHazards of gases and fumes are identified, minimized\nand contained\n3.3.\nA well-ventilated area is provided for any welding\nactivities\n4\nMinimization of\nnoise hazards is\nplanned and\nmanaged\n4.1.\nNoise creating activities are minimized and carried\nout within approved operating hours\n4.2.\nFixed machinery is fitted with silencers or surrounded\nby noise containment material\n5\nManagement\nsystems\n5.1.\nAn environmental policy and contingency plan\nsuitable to the needs of the business is developed\nand implemented\n5.2.\nWaste to landfill is calculated and possible savings\nthrough reuse and recycling are calculated\n5.3.\nPayback period on environmental equipment is\ncalculated\n5.4.\nManage\nstaff\nadherence\nto\nenvironmental\nresponsibilities\n5.5.\nEnvironmental documents are maintained and\nstored securely in a form accessible for reporting\nprocedures\n\n--- PDF PAGE 124 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n122\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Automotive business\nMay include:\nAny automotive business excluding body repair, marine and\nmechanical involving the removal of components containing\noils or other fluids\n2. Waste and energy\nconservation\nstrategies\nMay include:\n2.1. Utilities consumption reduction program\n2.2. Waste reduction program\n2.3.\nEffective waste disposal program\n3. Systems\nSystem is carried out in accordance with:\n3.1\nOHS legislation, material safety data sheets (MSDS),\nhazardous substances and dangerous goods code\nand local safe operating procedures\n3.2\n Legislative\nobligations, environmental legislation,\nhealth regulations, and manual handling procedures\nand organization insurance requirements\n4. Tools and equipment\nMay include:\n4.1\nSpill kits\n4.2\nRecycling bins\n4.3\nDrums\n5. Environmental\ndocuments\nMay include:\n5.1 Environmental legislation, regulations and advice\n5.2 Workplace procedures relating to the use of tools and\nequipment\n5.3 Work instructions and procedures\n5.4 Worksite environmental policy\n5.5 Workplace procedures relating to reporting and\ncommunication\n5.6 Manufacturer/component supplier specifications and\noperational procedures\n5.7 Local council and waterways regulations\n5.8 Environmental documents, manufacturer/component\nsupplier specifications, costing of equipment and waste\nremoval\n5.9 Staff environmental induction material\n\n--- PDF PAGE 125 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n123\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Planned and managed safe handling requirements for\n equipment, products and materials, including use of\n personal protective equipment\n1.2 Planned and mange environmental protection\n procedures\n1.3 Identified materials used in the business and assess\nand manage their environmental impact\n1.4 Planned and managed work instructions, operating\nprocedures and inspection processes to:\n1.5 Minimized the risk of injury to self or others\n1.6 Maintained a clean workplace\n1.7 Prevented damage and wastage of goods, equipment\nand products\n1.8 Disposed of waste in accordance with legislative\nrequirements and best practice\n1.9 Maintained production output, and product and service\nquality\n1.10 Reported environmental damage or spills\n1.11 Planned and managed operator maintenance on\nequipment to ensure environmental efficiency\n1.12 Managed effective planning and teamwork related to\nenvironmental best practice\n1.13 Developed / implemented or audited an existing\nbusiness environmental policy which covers at a\nminimum: waste, recycling, hazards to storm water,\nair quality, noise, energy minimization and costs\n1.14 Modified activities to cater for variations in workplace\ncontext and environment.\n2 Required knowledge\n2.1\nAspects\nof\nenvironmental\nlegislation\nand\nits\nrelationship with occupational health and safety\n(OHS), finance and risk management\n2.2\nRequirements for trade waste permits\n2.3\nSpill clean-up procedures\n2.4\nCharacteristics and potential environmental impact of\nproducts used in the business\n2.5\nPhilosophy of sustainability through prevention, reuse,\nreduce and recycle\n2.6\nProcedures for rectifying machinery faults and material\ndefects\n2.7\nActions to be taken in case of environmental threat in\nthe workplace\n2.8\nReporting procedures for environmental damage\noccurring in the workplace\n2.9\nCleaner production and eco-efficient strategies to\navoid the production of waste\n2.10 Quality procedures, e.g., 5S\n2.11 Environmental-conservation procedures,\ne.g., 3R (reduce, reuse, recycle)\n\n--- PDF PAGE 126 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n124\n3\nRequired Skills\n3.1 Collect, organize and understand information related to\nenvironmental procedures from legislation, regulations,\npolicies, guidelines, standards and workplace best\npractices in an automotive business\n3.2 Communicate ideas and information to ensure all work\nundertaken is in accordance with environmental best\npractice, support from stakeholders is actively sought\nfor implementing suitable innovation and continuous\nimprovement\n3.3 Plan and organize activities including the preparation of\nequipment and materials recycling and waste\nmanagement systems and the selection of worksite to\navoid environmental contamination, back tracking,\nworkflow interruptions or wastage\n3.4 Promote work with others and in a team by recognizing\ndependencies and using cooperative approaches to\nminimize wastage, optimize workflow and productivity\n3.5 Use mathematical ideas and techniques to complete\nmeasurements and estimate material requirements\nrequired for the work and calculate wastage rates of\nvarious methods\n3.6 Use planning, checking and inspection techniques to\navoid environmental contamination and wastage\n3.7 Use the workplace technology related to environmental\nprotection and recycling equipment\n4\nResource\nImplications\n\nThe following resources should be provided:\n4.1 Access to an automotive business which includes waste\nmaterials of various types, recycling bins, liquid, sludge\nand solid wastes\n4.2 Resources may include pressure washing and facilities\nfor the use of recycled water\n5\nMethods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6\nContext for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 127 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n125"
      }
    ]
