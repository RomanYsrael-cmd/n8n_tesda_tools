ies.\n\n--- PDF PAGE 23 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n21\nRANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n\n 1. Legislations/Conventions\n\n May include but are not limited to:\n 1.1 Clean Air act\n 1.2 Clean Water Act\n1.3 Solid Waste Management\n1.4 Montreal Protocol\n1.5 Kyoto Protocol\n\n 2. Environmental\naspects/impacts\n\n2.1 Air pollution\n2.2 Water pollution\n2.3 Noise pollution\n2.4 Solid waste\n2.5 Flood control\n2.6 Deforestation/Denudation\n2.7 Radiation/Nuclear /Radio Frequency/ Microwaves\n2.8 Situation\n2.9 Soil erosion (e.g. Quarrying, Mining, etc.)\n2.10 Coral reef/marine life protection\n\n 3. Industrial standards/\nEnvironmental practices\n\n3.1 ECC standards\n3.2 ISO standards\n3.3 company environmental management systems\n(EMS)\n\n 4. Periodic\n\n4.1 hourly\n4.2 daily\n4.3 weekly\n4.4 monthly\n4.5 quarterly\n4.6 yearly\n\n 5. Programs/Activities\n\n5.1 Waste disposal (on-site and off-site)\n5.2 Repair and maintenance of equipment\n5.3 Treatment and disposal operations\n5.4 Clean-up activities\n5.5 Laboratory and analytical test\n5.6 Monitoring and evaluation\n 5.7 Environmental advocacy programs\n\n--- PDF PAGE 24 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n22\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n Assessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of environmental legislations\nand local ordinances according to the different\nenvironmental issues/concerns.\n1.2 Described industrial standard environmental practices\naccording to the different environmental issues/concerns.\n1.3 Resolved problems/ constraints encountered based on\nmanagement standard procedures\n1.4 Implemented and monitored environmental practices on a\nperiodic basis as per company guidelines\n1.5 Recommended solutions for the improvement of the\nprogram\n1.6 Monitored and reported to proper authorities any\nenvironmental incidents\n 2. Underpinning\nknowledge and\nattitude\n2.1 Features of an environmental management strategy\n2.2 Environmental issues/concerns\n2.3 International Environmental Protocols (Montreal, Kyoto)\n2.4 Waste minimization hierarchy\n2.5 Environmental planning/management\n2.6 Community needs and expectations\n2.7 Resource availability\n2.8 Environment-friendly/environmental advocates\n2.9 5S of Good Housekeeping\n2.10 3Rs – Reduce, Reuse & Recycle\n 2.11 Sanitary Code\n 2.12 Environmental Code of practice\n 3. Underpinning\n skills\n3.1 Communicating effectively\n3.2 Performing research and analysis\n3.3 Reading / interpreting data and information\n3.4 Problem solving\n 4. Resource\nimplications\n The following resources MUST be provided:\n4.1 Workplace/Assessment location\n4.2 Legislation, policies, procedures, protocols and local\nordinances relating to environmental protection\n4.3 Case studies/scenarios relating to environmental\nprotection\n 5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Written/ Oral Examination\n5.2 Interview/Third Party Reports\n5.3 Portfolio (citations/awards from GOs and NGOs,\ncertificate of training – local and abroad)\n 5.4 Simulations and role-plays\n 6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\n at the designated TESDA center.\n\n--- PDF PAGE 25 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n23\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: APPLY APPROPRIATE SEALANT/ADHESIVE\n\nUNIT CODE: ALT723201\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitude in the\nselection and application of sealant/adhesives.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify appropriate\nSealant/adhesive\n\n1.1Sealant/adhesive selected in line with job requirements\n and manufacturer’s specification\n1.1 Sealant/adhesive checking is performed to ensure that\nthe product is fit for use.\n2. Prepare surface for\nSealant/adhesive\n2.1 Surface materials are identified as per construction\n2.2 Surface is cleaned and free of moisture, dust and other\n foreign matters to ensure maximum adhesion or seal.\n3. Apply\nsealant/adhesive\n evenly\n3.1 Sealant/adhesive is applied evenly on the surface in line\n with manufacturer’s specification\n3.2 Excess sealant/adhesive is removed by sanding or\n scrapping\n3.3Tools and equipment used to apply sealant/adhesive\nare appropriate to job requirements\n3.4 Safety are observed and PPE are worn in accordance\nwith industry SOP\n3.5 Hazards associated with the use of sealant and\nadhesives are identified.\n4. Store/Dispose of\nsealant/adhesive\n4.1 Sealant/adhesive are stored as per prescribed\nprocedure\n4.2 Waste are disposed as per workshop standard\noperating procedure\n\n--- PDF PAGE 26 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n24\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Sealant/Adhesive\n\nMay include:\n1.1Form in Place Gasket (FIPG)\n1.2 Ribbon Sealer\n1.3Hametite\n1.4Silicon Body sealer\n1.5 Prestite for Auto and Auto Aircon\n\n2. Tools and equipment\n\nMay include:\n2.1 Putty knife\n2.2 Scraper\n2.3 Compressor\n2.4 Steel brush\n2.5 Paint brush\n2.6 Rubber hammer\n2.7 Hand tools\nPersonal protective equipment include:\n2.8 Gloves\n2.9 Apron\n2.10 Safety shoes\n2.11Goggles\n2.12Gas mask\n\n3. Safety\n\nMay include:\n3.1 Ventilation\n3.2 Handling of Flammable/Irritating substances\n3.3 Use of Personal Protective Equipment\n\n4. Hazards\n\n May include:\n4.1 Fumes\n4.2 Skin irritation\n4.3 Burns\n\n5.Adhesive/Sealant\n checking\n\nMay include:\n5.1 Expiry date\n5.2 Free of contamination\n5.1 Cap/Covers\n5.2 Tightly closed\n5.3 Concentration\n\n--- PDF PAGE 27 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n25\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified appropriate sealant/adhesives\n1.2 Prepared surface for sealant/adhesive\n1.3 Applied sealant/adhesive\n1.4 Stored unused or dispose of used sealant/adhesive\n2. Required\nknowledge\n2.1 OH & S regulations\n2.2 Safe handling of sealant/adhesive\n2.3 Industry code of practice\n2.2 Procedures in sealant/adhesive application\n2.3 Procedures in interpreting manuals\n3. Required skills\n3.1 Handling sealant/adhesive\n3.2 Applying sealant/adhesive\n3.3.Sanding the surface\n3.4 Use of tools, equipment\n3.5 Mixing of body filler and epoxy base and hardener\n4. Resource\n implication\nThe following resources should be provided:\n4.1 Materials relevant to the activity\n4.2 Appropriate tools and equipment\n4.3 Real or simulated workplace\n5. Method of\n assessment\n\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Interview related to:\n• Safe and correct use of tools and equipment\n• Application of adhesive/sealant\n6. Context of\n assessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment may be done in a workplace or\nsimulated environment\n\n--- PDF PAGE 28 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n26\nUNIT OF COMPETENCY: MOVE AND POSITION VEHICLE\n\nUNIT CODE: ALT723202\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitude needed to\nmove and position vehicle in a workshop.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Prepare vehicle for\n driving\n\n1.2 Correct check-up procedures performed based on\n vehicle manufacturer’s standard\n\n2. Move and position\n vehicle\n\n2.1 Select vehicle to be moved or re-position.\n2.2 Drive the vehicle to appropriate location\n2.3 Park vehicle following parking safety techniques\nand procedure\n\n3. Check the vehicle\n\n3.1 Vehicle position is checked as per requirement\n3.2 Vehicle is checked for external damages\n\n--- PDF PAGE 29 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n27\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Check up procedure\nMay include:\n1.1 Oil level\n1.2 Brake fluid\n1.3 Clutch fluid\n1.4 Coolant level\n1.5 Battery (electrolyte)\n1.6 Tire pressure\n1.7 Position of driving gear\n1.8 Lighting and warning devices\n\n2. Vehicles\nMay include:\n2.1 Vehicles with automatic transmission\n2.2 Vehicles with manual transmission\n\n3.Parking safety\n techniques\nMay include:\n3.1 Engaging of Park brake\n3.2 Vehicle parking position\n3.3 Front wheel position\n\n--- PDF PAGE 30 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n28\nEVIDENCE GUIDE\n\n1.Critical aspects of\n competency\n\nAssessment requires evidence that the candidate:\n1.1 Prepared vehicle for driving.\n1.2 Moved and positioned vehicle\n1.3 Checked the vehicle.\n\n2. Required\nknowledge\n\n2.1 Driver’s Code of conduct\n2.2 Workshop signs and symbols\n2.3 Driving skills\n2.4 Vehicle accessories for safe driving and parking\n\n3. Required skills\n\n3.1 Ability to handle vehicle/maneuver vehicle the easiest\nway\n3.2 Immediate response to accident\n3.3 Preparing vehicle for driving\n3.4 Parking Downhill, Uphill, Parallel\n3.5 Shifting Gears\n3.6 Maneuvering\n\n4. Resource\n implications\n\nThe following resources should be provided:\n4.1 Driving range/area\n4.2 Appropriate vehicle for driving\n4.3 Vehicle accessories\n\n5.Method of\nassessment\n\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n\n6 Context of\n assessment\n\n6.1 Assessment must be undertaken in accordance with the\n endorsed TESDA assessment guidelines\n6.2 Assessment of practical skills must be done in a\nworkplace or simulated environment.\n\n--- PDF PAGE 31 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n29\nUNIT OF COMPETENCY: PERFORM MENSURATION AND CALCULATION\n\nUNIT CODE: ALT311202\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in\nidentifying, caring, handling and using the measuring\ninstrument.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Select measuring\n\n instruments\n\n1.1 Object or component to be measured is identified\n1.2 Correct specifications are obtained from relevant source\n1.3 Appropriate measuring instrument is selected according to\njob requirements\n\n2. Carry out\n measurements\n and calculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained in accordance with\njob requirements\n2.3 Calculation needed to complete work tasks are performed\n using the four fundamental operation of addition (+),\nsubtraction (-), multiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\n numbers are used to complete workplace tasks.\n2.5 Numerical computation is self-checked and corrected for\n accuracy\n2.5 Instruments are read to the limit of accuracy of the tool.\n\n3\nMaintain\nmeasuring\ninstruments\n\n3.1 Measuring instruments are kept free from corrosion\n3.2 Measuring instruments are not dropped to avoid damage\n3.3 Measuring instruments are cleaned before and after using.\n\n--- PDF PAGE 32 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMay include:\n\n1.1 Multitester\n1.2 Micrometer (In-out, depth)\n1.3 Vernier caliper (Out,\ninside)\n1.4 Dial Gauge with Mag. Std.\n1.5 Plastigauge\n1.6 Straight Edge\n1.7 Thickness gauge\n\n1.8 Torque Gauge\n1.9 Small Hole gauge\n1.10 Telescopic Gauge\n1.11 Try square\n1.12 Protractor\n1.13 Combination gauge\n1.14 Steel rule\n2. Calculation\n\nMay include:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2. 10 Out of roundness\n2.11Oil clearance\n2.12 End play/thrust clearance\n\n--- PDF PAGE 33 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n31\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried-out measurements and calculations.\n1.3 Maintained measuring instruments\n\n2. Required\nknowledge\n\n2.1 Types of Measuring instruments and their uses\n2.2 Safe handling procedures in using measuring instruments\n2.3 Four fundamental operation of mathematics\n2.4 Formula for Volume, Area, Perimeter and other geometric\nfigures\n\n3. Required\n skills\n\n3.1 Caring and Handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.3 Performing calculation by Addition, Subtraction,\nMultiplication and Division\n3.4 Visualizing objects and shapes\n3.5 Interpreting formula for volume, area, perimeter and\nother geometric figures\n\n4. Resource\n implication\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3 Instructional materials relevant to the propose activity\n\n5. Method of\n assessment\n\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4 Demonstration with questioning\n\n6. Context of\n assessment\n\n6.1 Competency elements must be assessed in a safe\nworking environment\n6.2 Assessment may be conducted in a workplace or\nsimulated environment\n\n--- PDF PAGE 34 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n32\nUNIT TITLE: READ, INTERPRET AND APPLY SPECIFICATION AND MANUALS.\n\nUNIT CODE: ALT723203\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying\nservice specification manuals, maintenance procedure\nmanuals and periodic maintenance manual.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\n manual/\n specification\n\n1.1 Appropriate manuals are identified and accessed as per\njob requirements.\n1.2 Version and date of manual are checked to ensure that\ncorrect specification and procedure are identified.\n\n2. Interpret manuals\n\n2.1 Relevant sections, chapters of manuals/specifications\nare located in relations to the work to be conducted\n2.2 Information and procedure in the manual are interpreted\nin accordance with industry practices\n\n3. Apply information\nin manual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data are applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n\n4. Store manuals\n\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\n\n May include:\n1.1 Manufacturer’s specification manual\n1.2 Repair manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 35 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n33\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n\n2. Required\nknowledge\n\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n\n3. Required skills\n\n3.1 Reading and comprehension skills required to identify\nand interpret automotive manuals and specifications\n3.2 Accessing information and data\n\n4. Resource\nimplication\n\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Job order, requisitions\n4.3 Actual vehicle or simulator\n\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6. Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 36 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n34\nUNIT OF COMPETENCY: USE AND APPLY LUBRICANTS/COOLANTS\n\nUNIT CODE: ALT723204\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes required in\nselecting and applying different types of lubricants.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify types of\nlubricants/\ncoolants\n\n1.1 Correct information on lubrication schedule is\naccessed and interpreted from appropriate\nmanufacturers specifications manuals\n1.2 Type and quantity of lubricants/coolant are identified\nas per job requirements\n\n2. Use and apply\n lubricants/coolants\n\n2.1 Correct procedure for change of lubricant is identified\nfollowing manufacturer’s specification or manual\n2.2 Correct tools and equipment are selected and used in\nline with job requirements\n2.3 Existing lubricants are removed and replaced with\nspecified types and quantity of new materials in line with\nmanufacturer’s specification\n2.4 Safe procedure and use of PPE are observed when\nremoving or replacing lubricant\n2.5 Used lubricants are disposed in accordance with\n environmental guidelines\n2.6 Work is checked in line with company SOP.\n\n3. Perform\nhousekeeping\nactivities\n\n3.1 Tools, equipment and materials are properly stored as\nper company SOP\n3.2 Workplace is free from waste materials\n\n--- PDF PAGE 37 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n35\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\nMay include:\n1.1 Manufacturer’s specification manual\n1.2 Periodic Maintenance manual\n1.3 Service Manual\n2.Lubricants/ Coolant\n\nMay include:\n2.1 Engine oil:\n•\nDiesel engine oil\n•\nGasoline engine oil\n2.2 Automatic Transmission Fluid\n•\nDestro II\n•\nT4\n2.3 Gear oil lubricants:\n•\nOil #90\n•\nOil #140\n•\nOil #30\n•\nOil #40\n2.4 Grease\n• Special (velocity joint)\n Molybdenum disolfate)\n• Ordinary\n• Multi-purpose oil\n• Contact point lubricant\n (grease)\n2.5 Brake/Clutch System\n•\nBrake fluid\n•\nDOT3\n\n2.6 Power Steering Fluid\n•\nHydraulic Fluid\n\n2.7 Radiator Coolant\n•\nLong last coolant\n\n2.8 A/C Compressor Oil\n•\nPag oil\n3. Lubricant\n Schedule\nMay include:\n3.1 Kilometers traveled/used\n3.2 No. of Hours used\n3.3 Monthly\n4. Tool and\n equipment\nMay include:\n4.1 Hand tools\n4.2 Oiler\n4.3 Oil Dispenser\n4.4 Grease gun\n5. Personal\nProtective\nEquipment (PPE)\n\nMay include:\n5.1 Apron\n5.2 Gloves\n5.3 Goggles\n5.4 Safety shoes\n\n--- PDF PAGE 38 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n36\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified types of lubricants and lubrication schedule.\n1.2 Used and applied lubricants.\n1.3 Performed housekeeping\n\n2. Required\nknowledge\n2.1 Types/Classification of Lubricants\n2.2 Identifying lubrication schedule\n2.3 Cause and Effects of Gear Oil Dilution\n2.4 Purpose of Lubrication (Problem and effects)\n2.5 Hazard associated with lubrication\n\n3. Required skills\n3.1 Handling of oils (Gear, oil, engine oil)\n3.2 Familiarization/Classification of Lubricants\n3.3 Lubrication Procedure\n\n4. Resource\nimplication\n\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Materials relevant to activity\n\n5. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written/Oral examination\n\n6. Context of\nassessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment must be undertaken in accordance with the\n endorsed industry assessment guidelines\n6.3 Assessment of underpinning knowledge and skills may be\n assessed on or off-the-job\n\n--- PDF PAGE 39 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n37\nUNIT OF COMPETENCY: PERFORM SHOP MAINTENANCE\n\nUNIT CODE: ALT723307\n\nUNIT DESCRIPTOR: This unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage of\ntools/equipment and disposal of used supplies/materials are\nalso incorporated in this competency\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n.\n1.1 Cleaning solvent used as per workshop/tools\n cleaning requirement\n\n1.2 Work area is checked and cleaned\n\n1.3 Wet surface/spot in work area is wiped and dried\n\n2. Store/arrange tools\nand shop equipment\n\n2.1 Tools/equipment are checked and stored in their\n respective shelves/location\n\n2.2 Corresponding labels are posted and visible\n\n2.3 Tools are safely secured and logged in the records\n\n3. Dispose wastes/used\nlubricants\n\n3.1 Containers for used lubricants are visibly labeled\n\n3.2 Wastes/used lubricants are disposed as per\n workshop SOP\n\n4. Report damaged\ntools/equipment\n\n4.1 Complete inventory of tools/equipment is maintained\n\n4.2 Damaged tools/equipment/facilities are identified and\n repair recommendation is given\n\n4.3 Reports prepared have no error/discrepancy\n\n--- PDF PAGE 40 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n38\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work Area\nMay include:\n1.1 Workshop areas for servicing/repairing light and/or heavy\nvehicle and/or plant transmissions and/or outdoor power\nequipment\n1.2 Open workshop/garage and enclosed, ventilated office\narea\n1.3 Other variables may include workshop with:\n• Mess hall\n• Wash room\n• Comfort room\n2. Cleaning\n requirement\nMay include:\n2.1 Cleaning solvent\n2.2 Inventory of supplies, tools, equipment, facilities\n2.3 List of mechanics/technicians\n2.4 Rags\n2.5 Broom\n2.6 Map\n2.7 Pail\n2.8 Used oil container\n2.9 Oiler\n2.10 Dust/waste bin\n3. Manuals\nMay include:\n3.1 Vehicle/plant manufacturer specifications\n3.2 Company operating procedures\n3.3 Industry/Workplace Codes of Practice\n3.4 Product manufacturer specifications\n3.5 Customer requirements\n3.6 Industry Occupational Health &Safety\n4. Company\nstandard\noperating\nprocedure\nWearing of Personal protective equipment may include:\n4.1 Gloves\n4.2 Apron\n4.3 Goggles\n4.4 Safety shoes\n\n--- PDF PAGE 41 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n39\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1Cleaned workshop tools/facilities\n1.2Maintained equipment, tools and facilities\n1.3Disposed wastes and used lubricants/fluid as per required\n procedure\n2. Required\nknowledge\n2.1 5S or Total Quality Management (TQM)\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of Equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire Extinguishers and prevention\n2.9 Storage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\n Attention to Details)\n3. Required skills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of supplies/materials\n3.4 Preparing inventory of s/m and tools and equipment\n3.5 Monitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Written/Oral Questioning\n5.2 Demonstration\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 42 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n40\nUNIT OF COMPETENCY: PREPARE JOB ESTIMATE/COSTING\n\nCODE: ALT311204\n\nUNIT DESCRIPTOR: This competency unit covers the knowledge, skills and\n attitude in estimating/costing automotive repair.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify\nnature/scope of\nwork\n\n1.1 Effective communication skills are applied to determine the\nnature and scope of work to be undertaken\n1.2 Extent of service to be rendered in determined and\ndocumented in line with standard operating procedures\n(SOP)\n\n2. Prepare and\npresent estimate\n\n2.1 Type and quantity of supplies, materials and labor required\nto perform work are identified in line with job requirements\n2.2 Cost of supplies, materials are obtained from suppliers\n2.3 Total cost of required services is calculated in line with\nSOP\n2.4 Estimate is presented to customer in line with SOP.\n\n--- PDF PAGE 43 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Communication\nMay include:\n1.1 Listening to customer\n1.2 Speaking with suppliers, customers and co-\nworkers\n1.3 Questioning\n\n2. Suppliers\nMay include:\n2.1 Distributors\n2.2 Managers\n2.3 Proprietors\n\n3. Cost\nMay include:\n3.1 Materials\n3.2 Labor\n3.3 Overhead\n\n--- PDF PAGE 44 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n42\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n Assessment requires evidence that the candidate\n1.1 Identified nature/scope of work\n1.2 Prepared and presented estimate\n\n2. Required\nknowledge\n\n2.1 Consumer mathematics\n2.2 Replaceable/Fabricated Materials or Spare parts in\n a vehicle\n2.3 Automotive Repair Procedures and Techniques\n2.4 Job estimates\n2.5Honesty, Perseverance, Patience, Attention to Details\n\n3. Required\nskills\n\n3.1 Computing using the Four Mathematical Operations\n3.2 Estimating repair works and activities\n4. Resource\n implication\nThe following resources should be provided:\n4.1 Appropriate tools such as calculator, paper, pen, and\nother measuring instruments relevant to activity\n5. Method of\n assessment\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Presentation of Finished drawing\n\n6. Context of\nassessment\n\n6.1 Competency must be assessed in a room or any\n simulated places\n6.2 Assessment must be given according to industry standard\n\n--- PDF PAGE 45 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n43\nUNIT OF COMPETENCY: INTERPRET/DRAW TECHNICAL DRAWING\n\nCODE: ALT311205\n\nUNIT DESCRIPTOR:\nThis unit identifies the competencies required to\ndraw/interpret basic trade drawing\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Interpret technical\n drawing\n1.1 Components, assemblies or objects are recognized as\nrequired\n1.2 Dimensions are identified as appropriate to the field of\nemployment\n1.3 Instructions are identified and followed as required\n1.4 Material and other consumable requirements are\nidentified as required\n1.5 Symbols are recognized as appropriate in drawing\n2. Select correct\ntechnical drawing\n\n2.1 Drawing is checked and validated against job\nrequirements or equipment\n2.2 Drawing version is checked and validated according to the\nManual\n3. Apply freehand\nsketching\n3.1 Correct freehand sketching is produced using the\nnecessary tools and materials\n\n--- PDF PAGE 46 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n44\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Drawing\nMay include:\n1.1 Drawing symbols\n1.2 Alphabet of lines\n1.3 Orthographic views\n1.3.1\nFront view\n1.3.2\nRight side view/left side view\n1.3.3\nTop view\n1.3.4\nPictorial\n1.4 Schematic diagram\n2. Manual\nMay include:\n2.1 technical drawing manual\n2.2 manufacturers schematic diagram\n3. Consumables\nMay include:\n3.1 drawing plate\n3.2 pencil and eraser\n3.3 scotch tape\n4. Tools and\n materials\nMay include:\n4.1 compass\n4.2 divider\n4.3 rulers\n4.4 triangles\n4.5 drawing tables\n4.6 computer\n\n--- PDF PAGE 47 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n45\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted technical drawing\n1.2 Selected correct technical drawing\n1.3 Applied freehand sketching\n2. Required\nknowledge\n2.1 Drawing standard symbols\n2.2 Safe handling of tools and consumables\n2.3 Identification of types of drawing\n2.4 Patience & Perseverance, Attention to Details\n3. Required skills\n3.1 Draw/interpret orthographic drawing\n3.2 Handling of drawing instruments\n4. Resource\n implication\nThe following resources should be provided:\n4.1 Drawing room\n4.2 Appropriate tools\n4.3 Materials relevant to activity\n5. Method of\n assessment\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Written/Oral examination\n5.3 Presentation of Finished drawing\n6. Context of\nassessment\n6.1 Must be assessed in a drawing room or any simulated\n places\n6.2 Assessment must be given according to industry\n standard\n\n--- PDF PAGE 48 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n46\n\nUNIT OF MPETENCY: PRACTICE HEALTH, SAFETY AND ENVIRONMENT\nPROCEDURES\nUNIT CODE : ALT723206\nUNIT DESCRIPTOR : This unit of competency incorporates the work safe regional\nguidelines and encompasses competencies necessary to\napply basic safety and emergency procedures to maintain a\nsafe workplace for staff, customers and others.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Apply basic safety\nprocedures\n1.1.\nPolicies and procedures to achieve a safe working\nenvironment are followed and maintained in line with\noccupational health and safety (OHS) procedures\nand according to worksite policy\n1.2.\nAll unsafe situations are recognized and reported\naccording to worksite policy\n1.3.\nAll breakdowns in relation to machinery and\nequipment are reported to supervisor or nominated\npersons\n1.4.\nFire and safety hazards are identified and\nprecautions are taken or reported according to\nworksite policy and procedures\n1.5.\nDangerous goods and substances are identified,\nhandled and stored according to worksite policy and\nprocedures and OHS requirements\n1.6.\nWorksite policy regarding manual handling practice is\nfollowed\n1.7.\nParticipation in consultative arrangements\nestablished by company for OHS is exercised\n2. Apply emergency\nprocedures\n2.1.\nWorksite policies and emergency procedures\nregarding illness or accidents are identified and\napplied\n2.2.\nSafety alarms are identified\n2.3.\nQualified persons are contacted in the event of\naccident or sickness of customers or staff and\naccident details are documented according to\nworksite accident/ injury procedures\n2.4.\n Worksite evacuation procedures are identified and\napplied\n\n--- PDF PAGE 49 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n47\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Policies and\nprocedures\nMay include:\n1.1.\nHazard policies and procedures\n1.2.\nEmergency, fire and accident procedures\n1.3.\nPersonal safety procedures\n1.4.\nProcedures for the use of personal protective clothing\nand equipment\n1.5.\nUse of motor vehicles\n1.6.\nResolution procedures\n1.7.\nJob procedures\n1.8.\nWork instructions\n2. OHS procedures\nMay include:\n2.1.\nSafe manual handling and lifting customers, staff,\nequipment/tooling, premises and stock\n3. Hazards\nMay include:\n3.1.\nSharp cutting tooling and instruments\n3.2.\nElectricity and water\n3.3.\nToxic substances\n3.4.\nDamaged packing material or containers\n3.5.\nBroken or damaged equipment\n3.6.\nFlammable materials and fire hazards\n3.7.\nLifting practices\n3.8.\nSpillages, waste and debris especially on floors,\nladders, trolleys and glue guns/burns\n\n4. Emergency\nprocedures\nMay include:\n4.1.\nSickness\n4.2.\nAccident\n4.3.\nFire or store evacuation involving staff or customers\n\n--- PDF PAGE 50 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n48\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate has:\n1.1\nCommunicated effectively with others involved in or\naffected by the work\n1.2\nIdentified and assessed hazardous situations and\nrectified, or reported to the relevant persons\n1.3\nOperated fire-fighting equipment\n1.4\nHandled safely and stored dangerous and/or\nhazardous goods and substances\n1.5\nApplied safe manual handling practices\n1.6\nOperated safely and effectively equipment and\nutilized materials over the full range of functions\n1.7\nFollowed worksite evacuation procedures.\n2. Required knowledge\nGeneral knowledge of:\n2.1\nThe implications of OHS on efficiency, morale and\ncustomer relations\n2.2\nCommon automotive terminology\n2.3\nOHS regulations/requirements, equipment, material\nand personal safety requirements\n2.4\nSafe manual handling theories and practices\n2.5\nThe selection and application of fire-fighting\nequipment\n2.6\nDangerous goods and hazardous chemicals handling\nprocesses\n2.7\nWorksite reporting procedures\n3. Required Skills\n3.1.\nCollect, organize and understand information related\nto recognizing and reporting situations\n3.2.\nCommunicate ideas and information to reporting\nprocedures (verbal and written)\n3.3.\nPlan and organize activities which implement and\nfollow standard procedures\n3.4.\nWork with others and in a team by assisting and\ncooperating with team members\n3.5.\nUse mathematical ideas and techniques to document\nand report numbers for emergency procedures\n3.6.\nEstablish diagnostic processes which recommend\nimprovements for OHS issues\n3.7.\nUse workplace technology related to the use of\ntechnology to assist with safe work practices\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1.\nA workplace or simulated workplace\n4.2.\nSituations requiring safe working practices\n4.3.\nWorksite or equivalent instructions on safe working\npractice\n4.4.\nHazardous chemicals and/or dangerous goods\ninformation\n4.5.\nMaterials, tooling and equipment\n4.6.\nFirefighting appliances and fire test facilities\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 51 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n49\nUNIT OF COMPETENCY: INSPECT TECHNICAL QUALITY OF WORK\nUNIT CODE : ALT311207\nUNIT DESCRIPTOR : . This unit covers the competence to inspect work done\nby\n other staff, apply quality standards to work, and protect\n customer property and interests.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Gather information to\n carry out inspection\n1.1 OH&S requirements, including company\nregulatory requirements and personal protection\nneeds are observed throughout the work\n1.2 Pertinent information are sourced\n1.3 Different methods are analyzed and those most\nappropriate to the circumstances are selected\nand prepared\n1.4 Technical and/or calibration requirements for\ninspection are sourced and needed equipment is\nidentified and prepared\n2. Inspect and apply quality\nstandards to work\n2.1 Work is identified and confirmed for inspection in\n accordance with company quality procedures\n2.2 Quality Inspections are conducted throughout\nthe course of the work to ensure quality\nstandards are maintained\n2.3 Quality standards are applied during work\ncompletion to ensure the treatment of customer\nproperty meets industry and / or company\nstandards\n2.4 Activities are coordinated throughout the\nworkplace in accordance with company\nprocedures\n2.5 Documents of work quality are maintained\naccording to company requirements\n3. Achieve quality work\n outcomes\n\n3.1 Damage to customer property is avoided\nthrough ensuring staff adherence to quality\nprocedures and use of protective materials at all\nstages of the repair or service\n3.2 Communication pertaining to quality\nimprovements and recommendations are to be\ndone in accordance with company requirements\n\n--- PDF PAGE 52 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n50\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. OH&S Requirements\n\n May include:\n1.1 Safety equipment\n1.2 Personal protective equipment and clothing\n1.3 First aid equipment\n1.4 Hazard and risk control\n1.5 Elimination of hazardous materials and\nsubstances manual handling, including shifting,\nlifting and carrying\n1.5 Emergency procedures\n1.7 Road rules and safe driving policy\n2. Information\nMay include:\n 2.1 Manufacturer / component supplier\nspecifications\n2.2 Company operating procedures\n2.3 Supplier directories\n2.4 Parts catalogues\n2.5 Customer orders\n2.6 Service manual\n2.7 Material safety data sheets\n3. Quality Procedures\nMay include:\n3.1 Worksite quality system documentation\n3.2 Work instructions\n3.3 Safe work procedures\n3.4 Product specifications\n3.5 Equipment maintenance schedules\n3.6 Technical procedures\n3.7 Adopted or specifically prepared standards\n4. Quality Inspections\nMay include:\n4.1 Periodic inspection during the job or\nobservation at completion of the job to ensure\nall ordered parts have been fitted, components\nused meet manufacturer / component supplier\nspecifications, invoicing complies with service /\nrepair / parts order and contains sufficient\ndetails of labor and / or components used\n4.2 Reported and diagnosed problems have been\nconfirmed as rectified thru test procedures and\npresentation of the vehicle or equipment after\nservice / repair meets manufacturer and\n Company standards\n5. Communication\nMay include:\n5.1 Verbal\n5.2 Written\n5.3 Telephone or Electronic means\n\n--- PDF PAGE 53 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n51\nEVIDENCE GUIDE\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Observed safety procedures and requirements\n1.2 Communicated effectively with others involved in or\n affected by the work\n1.3 Applied OH&S policies and procedures\n1.4 Identified quality procedures\n1.5 Inspected work undertaken by others\n1.6 Applied quality standards to work\n2. Required\nknowledge\nA working knowledge of:\n2.1 Quality systems in a workplace\n2.2 Common automotive terminology\n2.3 Vehicle safety requirements\n2.4 Work planning processes\n2.5 OH&S regulations/requirements, equipment, material\n and personal safety requirements\n2.6 Company quality systems and procedures\n2.7 Worksite environmental control measures\n2.8 Worksite reporting procedures\n3. Required skills\n3.1 Communicating ideas and information\n3.2 Collecting, analyzing and organizing information\n3.3 Planning and organizing activities\n3.4 Working with others and in a team\n3.5 Using mathematical ideas and techniques\n3.6 Solving problems\n3.7 Using technology\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 A workplace or simulated workplace\n4.2 Situations requiring inspections of technical quality\n4.3 Computer hardware and software, access to\nelectronic communication\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct Observation\n5.2 Oral interview\n5.3 Written Evaluation\n5.4 Third Party Report\n6. Context of\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 54 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n52\nUNIT OF COMPETENCY: MAINTAIN QUALITY SYSTEMS\nUNIT CODE : ALT311208\nUNIT DESCRIPTOR : This unit of competency covers the competence to\nconduct the final quality check on completed work or\norders, report on the quality of processes and work\noutcomes, and implement improvements to work\nprocesses.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Conduct final quality\ncheck on completed\nwork / orders\n\n1.1. Completed work / orders are checked for\ncompliance with supplier, company or customer\nspecifications\n1.2. Level of inspection conducted is appropriate to\nthe size and importance of the job\n1.3. Documentation is authorized in accordance with\ncompany requirements\n1.4. Feedback is provided to staff on the quality of\ntheir work with equal emphasis on strengths and\nweaknesses and opportunities for development\n2. Report on the quality of\nprocesses and work\noutcomes\n\n2.1. Documents are kept according to company\nquality procedures on outcomes of quality\nchecks\n2.2. Quality problems are identified according to\ncompany performance indicators\n2.3. Information relating to the quality of processes\nand work outcomes is provided to appropriate\npersons on a regular basis\n3. Implement\nimprovements to work\nprocesses\n\n3.1. Staff input is encouraged to generate possible\nsolutions to quality problems\n3.2. Options for solving quality problems are\ngenerated and the costs and benefits of each\noption are evaluated\n3.3. Recommended solutions to quality problems are\ndiscussed with management\n3.4. Improvements to work processes are\nimplemented according to company policies and\nprocedures\n\n--- PDF PAGE 55 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n53\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Quality procedures\nMay include:\n1.1 Company quality system documentation\n1.2 Work instructions\n1.3 Safe work procedures\n1.4 Product specifications\n1.5 Equipment maintenance schedules\n1.6 Technical procedures and adopted or\nspecifically prepared standards\n2. Performance indicators\n\nMay include:\n• account for issues of time, quantity, quality and\ncost factors and may include establishing time\ntargets for own work, identifying reasonable\ncriteria for evaluating own work outcomes,\nidentifying measures to avoid wastage,\nidentifying reasonable criteria to judge internal\nand/or external customer satisfaction\n3. Quality problems\n\nMay include:\n3.1 Misdiagnosed faults\n3.2 Jobs requiring rework\n3.3 Jobs which do not meet customer\nrequirements\n3.4 Repairs which do not fix the problem within the\nallocated timeframe\n4. Communication\n\nMay include:\n4.1 Verbal\n4.2 Written\n4.3 Telephone or other means\n5. Information/documents\n\nMay include:\n5.1 Vehicle manufacturer practices\n5.2 Company operating procedures\n5.3 Supplier directories\n5.4 Parts catalogues\n5.5 Customer orders and industry/workplace\ncodes of practice\n5.6 Material safety data sheets (MSDS)\n\n--- PDF PAGE 56 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n54\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Communicated effectively with others involved in or\naffected by the work\n1.2 Identified quality system procedures and needs\n1.3 Identified performance indicators\n1.4 Conducted final quality checks on completed work\norders\n1.5 Reported on the quality of processes and work\noutcomes\n1.6 Monitored and adjusted performance indicators to\nmeet changing circumstances\n1.7 Processed and implemented recommendations for\nchange\n2. Required\nknowledge\nCompetency includes sufficient knowledge to:\n Knowledge of:\n• quality systems and application techniques in a work\nenvironment\n• typical loss and damage control systems\n• work planning and organization processes\n• occupational health and safety (OHS)\nregulations/requirements, equipment, material and\npersonal safety requirements at the worksite\n• enterprise quality systems and procedures\n• worksite information management systems\n3. Required skills\nRequired skills include the ability to:\n3.1 Research and interpretive skills to locate, interpret and\napply quality audit policies and procedures\n3.2 Investigative and analytical skills required for\nidentification and analysis of quality breaches,\nincidents or risks, and identification of quality related\ntraining needs\n3.3 English literacy and communication skills in relation to\ndealing with customers and team members on\nworksite quality audit issues\n3.4 Questioning and active listening skills\n3.5 Written communication skills sufficient to prepare\nreports, document investigations and maintain\nworksite quality documents\n3.6 Plan and organize activities for leadership skills\nrequired in organizing, implementing and promoting\nworksite quality systems and measures\n3.7 Work with others and in a team by seeking advice and\nassistance from team members\n3.8 Use mathematical ideas and techniques to document\nquantities and company sampling procedures\n3.9 Establish diagnostic processes which analyze\nproblems and recommend solutions\n3.10 Use the workplace technology related to document\nand analyze quality problems\n\n--- PDF PAGE 57 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n55\n\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 A workplace or simulated workplace\n4.2 Situations requiring worksite quality systems\nmaintenance\n4.3 Worksite quality policies and procedures\n4.4 Worksite quality documents system\n4.5 Materials, tooling and equipment\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct Observation\n5.2 Oral interview\n5.3 Written Evaluation\n5.4 Third Party Report\n\n6. Context of\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 58 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n56\nUNIT OF COMPETENCY: PROVIDE WORK SKILL INSTRUCTION\nUNIT CODE : ALT311209\nUNIT DESCRIPTOR : This unit describes the performance outcomes, skills\nand knowledge required to conduct individual and group\ninstruction and demonstrate work skills, using existing\nlearning resources in a safe and comfortable learning\nenvironment. The unit also covers the skills and\nknowledge required to determine the success of both\nthe training provided and one's own personal training\nperformance. It emphasizes the training as being driven\nby the work process and context.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Organize instruction\nand demonstration\n\n1.1 Gather information about learner characteristics\nand learning needs\n1.2 Confirm a safe learning environment\n1.3 Gather and check instruction and demonstration\nobjectives and seek assistance if required\n1.4 Access and review relevant learning resources\nand learning materials for suitability and\nrelevance, and seek assistance to interpret the\ncontextual application\n1.5 Organize access to necessary equipment or\nphysical resources required for instruction and\ndemonstration\n1.6. Notify learners of details regarding the\nimplementation of the learning program and/or\ndelivery plan\n2. Conduct instruction\nand demonstration\n\n2.1 Use interpersonal skills with learners to establish a\nsafe and comfortable learning environment\n2.2 Follow the learning program and/or delivery plan to\ncover all learning objectives\n2.3 Brief learners on any OHS procedures and\nrequirements prior to and during training\n2.4 Use delivery techniques to structure, pace and\nenhance learning\n2.5 Apply coaching techniques to assist learning\n2.6 Use communication skills to provide information,\ninstruct learners and demonstrate relevant work\nskills\n2.7 Provide opportunities for practice during instruction\nand through work activities\n2.8 Provide and discuss feedback on learner\nperformance to support learning\n3. Check training\nperformance\n\n3.1 Use measures to ensure learners are acquiring\nand can use new technical and generic skills and\nknowledge\n3.2 Monitor learner progress and outcomes in\nconsultation with learner\n3.3 Review relationship between the trainer/coach and\nthe learner and adjust to suit learner needs\n4. Review personal\ntraining performance\nand finalize\ndocumentation\n4.1 Reflect upon personal performance in providing\ninstruction and demonstration, and document\nstrategies for improvement\n4.2 Maintain, store and secure learner records\naccording to organizational and legal requirements\n\n--- PDF PAGE 59 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n57\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Learner Characteristics\nMay include:\n1.1 Language, literacy and numeracy levels\n1.2 Learning styles\n1.3 Past learning and work experiences\n1.4 Specific needs\n1.5 Workplace culture\n2. Safe Learning\nEnvironment\nMay include:\n2.1 Exit requirements\n2.2 Personal protective equipment\n2.3 Safe access\n2.4 Safe use of equipment\n3. Instruction and\ndemonstration objectives\nMay include:\n3.1 Competencies to be achieved\n3.2 Generic and technical skills, which may be\n provided by the organization, developed by a\ncolleague and individual or group objectives\n3.3 Learning outcomes.\n4. Learning resources\nMay include:\n4.1 Learner and user guides\n4.2 Trainer and Facilitator guides\n4.3 Example training programs\n4.4 Specific case studies\n4.5 Professional development materials\n4.6 Assessment materials\n4.7 A variety of formats produced locally or\nacquired from other sources\n5. Learning materials\nMay include:\n5.1 Handouts for learners\n5.2 Materials sourced from the workplace, like\nworkplace documentation, operating\nprocedures, and specifications\n6. Details\n\nMay include:\n6.1 Location and time\n6.2 Outcomes of instruction or demonstration\n6.3 Reason for instruction or demonstration\n6.4 Who will be attending instruction session\n7. OHS procedures\n\nMay include:\n7.1 Emergency procedures\n7.2 Hazards and their means of control\n7.3 Incident reporting\n7.4 Use of personal protective equipment\n7.5 Safe work practices\n7.6 Safety briefings\n7.7 Site-specific safety rules\n\n--- PDF PAGE 60 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n58\n8. Delivery techniques\n\nMay include:\n8.1 Coaching\n8.2 Demonstration\n8.3 Explanation\n8.4 Group or pair work providing opportunities to\npractice skills and solve problems\n8.5 Questions and answers\n9. Coaching\n\nMay include:\n9.1 Learning arrangements requiring immediate\ninteraction and feedback\n9.2 On-the-job instruction and 'buddy' systems\n9.3 Relationships targeting enhanced performance\n9.4 Short-term learning arrangements\n9.5 Working on a one-to-one basis.\n10. Measures\n\nMay include:\n10.1 Informal review or discussion\n10.2 Learner survey\n10.3 On-the-job observation\n10.4 Review of peer coaching arrangements.\n\n--- PDF PAGE 61 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n59\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n1.1 Carried out a minimum of three training sessions,\ninvolving demonstrating and instructing particular work\nskills for different groups; with each session\naddressing:\n 1.1.1 Different learning objectives\n 1.1.2 A range of techniques and effective\ncommunication skills appropriate to the audience\n2. Required\nknowledge\n2.1 Learner characteristics and needs\n2.2 Content and requirements of the relevant learning\nprogram and/or delivery plan\n2.3 Sources and availability of relevant learning resources\nand learning materials\n2.4 Content of learning resources and learning materials\n2.5 Training techniques that enhance learning and when\nto use them\n2.6 Introductory knowledge of learning principles and\nlearning styles\n2.7 Key OHS issues in the learning environment,\nincluding:\n• roles and responsibilities of key personnel\n• responsibilities of learners\n• relevant policies and procedures, including hazard\nidentification, risk assessment, reporting\nrequirements, safe use of equipment and\nemergency procedures\n• risk controls for the specific learning environment\n3. Required skills\n3.1 Non-verbal communication techniques, such as:\n• asking relevant and appropriate questions\n• providing explanations\n• demonstrating\n• using listening skills\n• providing information clearly\n3.2 Safety skills to implement OHS requirements, by\nacting and responding safely in order to:\n• identify hazards\n• conduct prestart-up checks if required\n• observe and interpret learner behaviour that may\nput people at risk\n3.3 Time-management, skills to:\n• ensure all learning objectives are covered\n• pace learning\n3.4 Reflection skills in order to:\n• identify areas for improvement\n• maintain personal skill development\n\n--- PDF PAGE 62 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n60\n3.5 Literacy skills to:\n• complete and maintain documentation\n• read and follow learning programs and plans\n• read and analyze learner information\n3.6 Technology skills to operate audio-visual and\ntechnical equipment\n3.7 Interpersonal skills to:\n• engage, motivate and connect with learners\n• provide constructive feedback\n• maintain appropriate relationships\n• establish trust\n• use appropriate body language\n• maintain humor\n• demonstrate tolerance\n• manage a group\n• recognize and be sensitive to individual difference\nand diversity\n3.8 Observation skills to:\n• monitor learner acquisition of new skills, knowledge\nand competency requirements\n• assess learner communication and skills in\ninteracting with others\n• identify learner concerns\n• recognize learner readiness to take on new skills\nand tasks\n4. Resource\nimplications\nThe following resources should be provide:\nEvidence must be gathered in the workplace wherever\npossible. Where no workplace is available, a simulated\nworkplace must be provided\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Direct Observation\n5.2 Oral interview\n5.3 Written Evaluation\n5.4 Third Party Report\n6. Context of\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 63 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n61\nUNIT OF COMPETENCY: IDENTIFY AND SELECT ORIGINAL AUTOMOTIVE\nPARTS AND PRODUCTS\nUNIT CODE : ALT723210\nUNIT DESCRIPTOR : This unit of competency covers the competence\nrequired to identify original automotive parts and\nproducts based on evidence from customers and/or\nother sources which may include catalogue numbers or\nsamples of parts/products or their purpose.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Identify the part/product\nand its end use\n1.1 Available part/product information is gathered,\ndocumented and confirmed with customer\n1.2 Information gathering techniques is\nestablished for proper identification of\npart/product\n1.3 End user or host for the part/product, i.e.\nvehicle/unit assembly or vehicle/unit assembly\noptions, is established from an analysis of\navailable information\n2. Identify details of the\npart/product\n2.1 The parts/product cataloguing system is\nidentified and accessed\n2.2 Part/product is matched accurately with\ncataloguing information by accessing and using\nthe catalogue system\n2.3 Details of identity of the part/product are\ndocumented and processed\n3. Part/product is supplied\nor ordered for customer\n\n3.1 Customer accepts process used\n3.2 Part/product is supplied or ordered if not\navailable\n3.3 Customer records are updated\n\n--- PDF PAGE 64 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n62\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Part/product information\nMay include:\n1.1 Manufacturer/component supplier\nspecifications and technical documentation\n1.2 Company procedures and documentation\n1.3 Company or industry specifications, diagrams,\nsketches\n1.4 Verbal descriptions and physical and visual\nevidence\n2. Information gathering\ntechniques\n\nCustomer may require active assistance and\nquestioning to fully describe requirement in terms\nof:\n2.1 Common vehicle/unit model\n2.2 Date of manufacture\n2.3 Purpose and appearance of product and other\ntracking information\n3. Parts/products\ncataloguing systems\n\nMay include:\n3.1 Hard-copy (book-fast, loose-leaf)\n3.2 Stand-alone computer or networked/online\ncomputer-supported services\n\n--- PDF PAGE 65 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n63\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Elicited sufficient information from the customer and/or\nother sources to enable a confirmed identification of\nvehicle or unit the part/product intended\n1.2 Accessed the parts/products catalogue systems\nassociated with required vehicle/unit\n1.3 Used both manual and computer-based\nparts/products catalogues and equivalent\ndocumentation to trace and identify common specific\nbrand parts/products\n1.4 Communicated effectively with others involved in or\naffected by the work.\n2. Required\nknowledge\nCompetency includes sufficient knowledge to:\n2.1 Structural of computer workstations\n2.2 Common automotive terminology\n2.3 Main automotive systems and assemblies and their\nfunctions\n2.4 Parts/product catalogue systems, both brand-specific\nand general options\n2.5 Legal issues associated with the supply and use of\nnon-conforming parts/components/accessories\n2.6 Company quality system\n2.7 Work organization and planning processes\n3. Required skills\nRequired skills include the ability to:\n3.1 Apply research and interpretive skills sufficient to\nlocate, interpret and apply manufacturer/component\nsupplier procedures, workplace policies and\nprocedures\n3.2 Apply analytical skills required for identification and\nanalysis of technical information\n3.3 Apply plain English literacy and communication skills\nin relation to dealing with customer and team members\n3.4 Apply questioning and active listening skills\n3.5 Apply oral communication skills sufficient to convey\ninformation and concepts to customers\n3.6 Apply planning and organizing skills to own work\nactivities, including making good use of time and\nresources, sorting out priorities and monitoring own\nperformance\n3.7 Use mathematical ideas and techniques to correctly\ncalculate material requirements, estimate and\ncalculate costs and establish quality checks\n3.8 Use workplace technology related to customer\nservices, including use of measuring equipment,\ncomputerized technology, use of communication\ndevices and reporting/ documenting of results\n\n--- PDF PAGE 66 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n64\n\n4 Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace location or simulated workplace\n4.2 Information and material identifying and selecting\nautomotive parts and products\n4.3 Equipment identifying and selecting automotive parts\nand products\n4.4 Activities covering task requirements\n4.5 Specifications and work instructions.\n5 Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1\n Direct Observation\n5.2\nOral interview\n5.3\nWritten Evaluation\n5.4\nThird Party Report\n\n6 Context of\nassessment\n6.1 Competency may be assessed individually in the\nactual workplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 67 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n65\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nSERVICE DIESEL ENGINE MANAGEMENT\nSYSTEM AND COMPONENTS\n\nUNIT CODE\n:\nALT 723323\n\nUNIT DESCRIPTOR\n:\nThis unit identifies the competence required in\nservicing diesel engine management system and\ncomponents. It also includes the competence in\noverhauling common rail injection pump and adjusting\ncommon rail mechanical governor.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(NOTE: All standard of performance for Service Diesel Engine\nManagement System Component is in accordance with Company\nStandard operating procedure and Manufacturer’s specification\nmanuals using specified tools and equipment.)\n1. Overhaul common\nrail injection pump\n1.1 Common rail injection pump is disassembled\n1.2 Failure analysis of common rail injection pump is\n100%accurate\n1.3 Corresponding recommendation is given based on the\nanalysis\n1.4 Injection pump parts double checked for completeness,\nreference marks and torque\n1.5 Common rail injection pump is assembled\n2. Adjust common rail\nmechanical governor\n2.1 Completeness of common rail mechanical governor\nparts and initial setting performed\n2.2 Set screw is sealed\n\n--- PDF PAGE 68 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n66\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Diesel Injection\nSystem Component\nMay include:\n1.1 Diesel engine\n2. Manual\nMay include:\n2.1 Manufacturer specification manual\n2.2 Maintenance procedure manual\n2.3 Periodic maintenance manual\n2.4 Service manual\n2.5\nParts Checklist\n3. Tools and equipment\nMay include:\n3.1 Common and special hand tools\n4. Company standard\noperating procedure\nMay include:\n4.1 Job order\n4.2 Requisition slip\n4.3 Wearing of personal protective equipment such as\nApron, gloves, gas mask, goggles\n\n--- PDF PAGE 69 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n67\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Overhauled common rail injection pump\n1.2\nAdjusted common rail mechanical governor\n2. Required knowledge\n2.1 Diesel fuel injector types/classification and\ncharacteristics\n2.2 Procedure and precaution in disassembling Diesel\nFuel Injector\n2.3 Techniques in failure analysis\n2.4 Procedure in Injector lapping\n2.5 Procedure in Diesel fuel injector assembly\n2.6 Common rail injector pump parts, function and\noperation\n2.7 Procedure and precaution in overhauling common rail\ninjection\n2.8 Common rail injection pump parts reference mark use\nand application\n2.9 Rotary injection pump parts, function and operation\n2.10 Rotary injection pump parts reference mark use and\napplication\n2.11 Positive Work Values (Patience, Perseverance,\nHonesty, etc.)\n2.12 Quality procedures, e.g., 5S\n2.13 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Troubleshooting and servicing P.T., rotary injection,\ncommon rail injection and feed pumps\n3.2 Overhauling P.T., rotary injection, common rail\ninjection and feed pumps\n3.3 Handling common and special tools and testing\nequipment\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation/Demonstration with Questioning\n5.2\nPortfolio\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or\nsimulated environment.\n6.2 The assessment of practical skills must take place\nafter a period of supervised practice and repetitive\nexperience.\n\n--- PDF PAGE 70 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n68\nUNIT OF COMPETENCY :\nSERVICE ELECTRONIC BODY MANAGEMENT\n\nSYSTEMS\n\nUNIT CODE\n:\nALT 723324\n\nUNIT DESCRIPTOR\n:\nThis unit identifies the competence required to\nservice/repair electronic body management systems\nand/or associated components. Electronic body\nmanagement systems may control the following\nfunctions: ride control, steering systems, central\nlocking, electric windows, electric mirrors, security\nsystems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(All standard of performance for Service and Repair Electronic Body\nManagement Systems is in accordance with company standard\noperating procedure and manufacturer’s specification Manuals\nusing specified tools and equipment)\n1. Service electronic\nbody management\nsystems and/or\nassociated\ncomponents.\n1.1 Service is performed without causing damage to any\nworkplace property or vehicle.\n1.2 Correct information is accessed and interpreted from\nappropriate manufacturer specifications.\n1.3 Tests on electronic body management systems are\ncarried out to determine faults using appropriate\ntools and techniques.\n1.4 Necessary service and component replacement and\nadjustments are carried out\n\n--- PDF PAGE 71 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n69\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Electronic Body\nManagement\nSystems\nMay include:\n1.1 Electronic body management systems fitted to light\nvehicles and plant and equipment and/or outdoor\npower equipment\n1.2 Electronic body management may control the following\nfunctions: ride control, steering systems, control\nlocking, electric windows, electric mirrors, security\nsystems\n2. Manuals\nMay include:\n2.1 Manufacturer’s specification manual\n2.2 Preventive maintenance procedure manual\n2.3 Preventive maintenance data\n2.4 Service and repair manual\n2.5\nParts checklist\n3. Company Standard\nOperating procedure\nMay include:\n3.1 Job order\n3.2 Requisition slip\n3.3 Wearing of Personal Protective Equipment such as:\nApron, Safety shoes, Gloves, Goggles\n4. Tools and equipment\nMay include:\n4.1 Hand tools, testing equipment including: multimeter\n4.2 Power tools, air tools, special tools for\nremoval/adjustment,\n4.3 Specialized system testers for ABS, ECU, Airbag, and\nDiagnostic\n\n--- PDF PAGE 72 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n70\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Tested electronic body management systems\n1.2 Serviced/repaired of electronic body management\nsystems\n2. Required knowledge\n2.1 Advance electronics theory\n2.2 Electrical Theory and principles\n2.3 Service/repair, removal, replacement and adjustment\nprocedures relevant to application\n2.4 Operating principles of body management systems\n2.5 Construction and operation of body management\nsystems/components relevant to application\n2.6 Positive Work Values (Patience, Perseverance,\nHonesty, etc.)\n2.7 Quality procedures, e.g., 5S\n2.8 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Testing electronic circuits and devices\n3.2 Reading/Interpreting schematic diagram\n3.3 Removing/Installing electronic devices\n3.4 Using mathematical ideas and techniques\n3.5 Solving problems\n3.6\nUsing technology\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace or simulator\n4.2 Appropriate tools and equipment\n4.3\nMaterials relevant to the proposed activity and tasks\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Written examination\n5.2\nObservation/Demonstration with Questioning\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or\nsimulated environment.\n6.2 The assessment of practical skills must take place\nafter a period of supervised practice and repetitive\nexperience.\n\n--- PDF PAGE 73 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n71\nUNIT OF COMPETENCY :\nSERVICE DIESEL FUEL INJECTION\nSYSTEM/COMPONENTS\n\nUNIT CODE\n:\nALT 723325\n\nUNIT DESCRIPTOR\n:\nThis unit identifies the competence required in\nservicing\ndiesel fuel injection system and components. It also\nincludes the ability to overhaul rotary injection pump,\nsetting of injection pump and pneumatic governor and\ntesting injection pump.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(NOTE: All standard of performance for Servicing Diesel Fuel Injection\nSystem/Components is in accordance with company standard\noperating procedure and manufacturer’s specification manuals using\nspecified tools and equipment)\n1. Overhaul rotary\ninjection pump\n1.1 Rotary injection pump is disassembled\n1.2 No error in conducting failure analysis of injection\npump\n1.3 Corresponding recommendation is given based on the\nanalysis\n1.4 Injection pump parts is double checked for\ncompleteness, reference marks and torque\n1.5 Rotary injection pump is assembled\n2. Set rotary injection\npump governor\n2.1 Completeness of rotary injection governor parts and\nreference mark position is checked\n2.2 No error in identifying rotary injection pump governor\nsetting\n2.3\nInjection governor is adjusted\n3. Set pneumatic\ngovernor\n3.1 Completeness of pneumatic governor parts is\nchecked.\n3.2 No leak in the vacuum chamber\n3.3 Initial setting is adjusted\n4. Check injection\nautomatic timing\nadvance\n4.1 Injection timing advance is read and verified\n4.2 Injection timing advance checking device/tester is\ninstalled\n5. Test injection\npump\n5.1 Governor setting determined accurately\n5.2 Injection pump governor is adjusted\n5.3\nDamage governor parts is replaced\n 6. Overhaul feed\npump\n6.1 Feed pump is disassembled\n6.2 No error in conducting failure analysis of feed pump\n6.3 Corresponding recommendation is given based on the\nanalysis\n6.4 Feed pump parts double checked for completeness,\nreference mark, position and torque\n6.5\nFeed pump is assembled\n\n--- PDF PAGE 74 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n72\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Injection Pump\nGovernor\nMay include:\n1.1 Unit injector governor\n1.2 Rotary injection pump\n1.3 Pneumatic governor\n1.4 Common rail mechanical governor\n1.5\nHydraulic governor\n2. Manual\nMay include:\n2.1 Manufacturer specification manual\n2.2 Maintenance procedure manual\n2.3 Periodic maintenance manual\n2.4 Service manual\n2.5\nParts Checklist\n3. Tools and\nequipment\nMay include:\nCommon and special service hand tools\n4. Company standard\noperating procedure\nMay include:\n4.1 Job order\n4.2 Requisition slip\n4.3 Wearing of personal protective equipment such as\nApron, gloves, gas mask, goggles\n\n--- PDF PAGE 75 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n73\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Overhauled rotary injection pump\n1.2 Set rotary injection pump governor\n1.3 Set pneumatic governor\n1.4 Checked injection automatic timing advance\n1.5\nTested injection pump\n2. Required knowledge\n2.1 Unit injector parts, function and operation and\nadjusting procedure\n2.2 Rotary injection pump governor parts, function and\noperation\n2.3 Precaution in setting injection pump governor\n2.4 Pneumatic governor parts, function and operation\n2.5 Setting procedure for pneumatic governor\n2.6 Common rail mechanical governor, parts function and\noperation\n2.7 Hydraulic governor parts, function and operation\n2.8 Precaution in setting hydraulic governor\n2.9 Positive Work Values (Patience, Perseverance,\nHonesty, etc.)\n2.10 Quality procedures, e.g., 5S\n2.11 Environmental-conservation procedures,\ne.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Setting hydraulic governor\n3.2 Use of special tools and testing equipment\n3.3 Troubleshooting and analysis of failures\n3.4 Adjusting common rail mechanical governor\n3.5 Setting rotary injection pump\n3.6 Setting pneumatic governor\n3.7\nReading and Interpreting manufacturer’s manual\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation/Demonstration with Questioning\n5.2 Written test\n5.3\nPortfolio\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or\nsimulated environment.\n6.2 The assessment of practical skills must take place\nafter a period of supervised practice and repetitive\nexperience.\n\n--- PDF PAGE 76 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n74\nUNIT OF COMPETENCY : SERVICE ELECTRONIC DRIVE MANAGEMENT\n SYSTEMS\n\nUNIT CODE\n:\nALT 723326\n\nUNIT DESCRIPTOR\n:\nThis unit identifies the competence required to\n\nservice drive management systems and/or associated\ncomponents. Electronic drive management systems\ninclude: electrical/electronic components/systems\nfound in automatic transmissions and/or 4WD\ndriveline such as automatic free- wheeling hubs,\ndifferential and axle locks.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(All standard of performance for Service and Repair Electronic Drive\nManagement Systems is in accordance with company standard\noperating procedure and manufacturer’s specification Manuals using\nspecified tools and equipment)\n1. Service electronic\ndrive Management\nsystems and/or\nassociated\ncomponents\n1.1 Service is performed without causing damage to any\nworkplace property or vehicle.\n1.2 Correct information is accessed and interpreted from\nappropriate manufacturer specifications.\n1.3 Tests on electronic drive management systems are\ncarried out to determine faults\n1.4 Necessary service and component\nreplacement/adjustments are carried out\n2. Conduct air\nsuspension system\nbalance adjustment\n2.1 Air suspension balance is adjusted\n2.2 Cause of unbalanced air suspension is identified and\nremedied\n\n--- PDF PAGE 77 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n75\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Electronic Drive\nManagement\nSystems\nMay include:\n1.1 Light vehicles and/or plant and equipment and/or\nheavy vehicles and/or outdoor power equipment\n1.2 Electronic drive management systems include\nelectronic controls of automatic transmissions. The\nelectronic components of driveline control systems\n(e.g., traction control, auto transmission)\n1.3 4WD applications such as automatic free wheeling\nhubs, differential and axle locks\n2. Manuals\nMay include:\n2.1 Manufacturer’s specification manual\n2.2 Preventive maintenance procedure manual\n2.3 Preventive maintenance data\n2.4 Service and repair manual\n2.5\nParts checklist\n3. Company standard\noperating procedure\nMay include:\n3.1 Job order\n3.2 Requisition slip\n3.3 Wearing of Personal Protective Equipment such as:\nApron, Safety shoes, Gloves, Goggles\n4. Tools and equipment\nMay include:\n4.1 Hand tools, vehicle lifting equipment, testing\nequipment including multimeter\n4.2 Power tools, air tools, special tools for\nremoval/adjustment\n4.3\nSpecialized system testers\n5. OHS requirements\nMay include:\n5.1 Industry Safety and Health in Handling Electronic\nDevices including their disposal\n\n--- PDF PAGE 78 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n76\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Tested electronic drive management systems and\nidentified faults\n1.2 Serviced/repaired electronic drive management\nsystems\n1.3 Conducted air suspension system balance\nadjustment\n2. Required knowledge\n2.1 Service/repair, removal, replacement and adjustment\nprocedures\n2.2 Occupational Health and Safety (OH&S) legislation\n2.3 Testing/adjusting procedures\n2.4 Construction and operation of drive management\nsystems/components relevant to application\n2.5 Personal safety requirements\n2.6 Vehicle/equipment safety requirements\n2.7 Positive Work Values (Patience, Perseverance,\nHonesty, etc.)\n2.8 Quality procedures, e.g., 5S\n2.9 Environmental-conservation procedures,\ne.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Testing electronic circuits and devices\n3.2 Reading/Interpreting schematic diagram\n3.3 Removing/Installing electronic devices\n3.4 Using mathematical ideas and techniques\n3.5 Solving problems\n3.6\nUsing technology\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace and simulator\n4.2 Appropriate tools and equipment\n4.3\nMaterials relevant tot he proposed activity and tasks\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Written examination\n5.2\nObservation/Demonstration with Questioning\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or\nsimulated environment.\n6.2 The assessment of practical skills must take place\nafter a period of supervised practice and repetitive\nexperience.\n\n--- PDF PAGE 79 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n77\nUNIT OF COMPETENCY :\nSERVICE EMISSION CONTROL SYSTEMS\n\nUNIT CODE\n:\nALT 723327\n\nUNIT DESCRIPTOR\n:\nThis unit cover the skills, knowledge and attitudes\nrequired in servicing emission control systems and\nassociated components.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(NOTE: All standard of performance for Service and Repair Emission\nSystems is in accordance with company standard operating\nprocedure and manufacturer’s specification manuals using specified\ntools and equipment.)\n1. Inspect vehicle\n1.1 Appropriate job order for vehicle is obtained and\ncompleted\n1.2 Vehicle is parked with tail end facing open area but\nwithin shop area\n1.3 Left and right fenders are covered with non-abrasive\nmaterials\n1.4 No leak is inspected in between venting device\n1.5 Venting device is pointed outside the work area\n1.6 Engine water temperature is observed at 82°C\noperating condition\n1.7\nInspection sheet is completely filled up\n2. Conduct pre-\nemission inspection\n2.1 Fuel metering system is determined if existing or not\n2.2 Air injection system is determined if existing or not\n2.3 Computer is determined if existing or not for\nEFI/carburetor engine\n2.4 Other OEM installed devices are located and\nidentified\n3. Conduct emission\ntesting (Diesel and\ngas)\n3.1 Probe is connected at least 30 cm from the inside of\nthe exhaust pipe\n3.2 Temperature and RPM probes is connected\n3.3 Range idle mode is adjusted\n3.4 Free acceleration test is performed\n3.5 Emission test (gas/diesel) is performed\n3.6 Emission record sheet is completely filled up\n3.7 No error in the emission test report\n3.8 Emission Test Equipment (ETE) and other devices\nand tools are returned to appropriate storage\n 4. Service emission\ncontrol systems\nand/or associated\ncomponents\n4.1 Work is completed without causing damage to any\nworkplace property or vehicle.\n4.2 Correct information is accessed and interpreted from\nappropriate manufacturer specifications.\n4.3 Appropriate test equipment is selected.\n4.4 Tests are performed and results are analyzed\n4.5 Emission control system, assemblies and\ncomponents are serviced.\n\n--- PDF PAGE 80 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n78\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Emission control\nsystem\nMay include:\n1.1 Positive Crankcase\nVentilation (PCV)\n1.2 Injection pump\n1.3 Injection nozzle/injector\n1.4 Fuel sedimeter\n1.5 Air cleaner\n1.6 Turbo Charger System\n1.7 Exhaust System (muffler)\n1.8 Catalytic converter\n\nGasoline engine\nemission components:\n1.9 Air cleaner\n1.10 Positive\ncrankcase\nventilation (PCV)\n1.11 Charcoal canister\n1.12 Catalytic\nconverter\n1.13 Oxygen sensor\n1.14 MAP/PIM Sensor\n1.15 High altitude\nCompensator\n1.16 Automatic Hot Air\nintake System\n1.17 Exhaust Gas\nRecirculation\n(EGR)\n1.18 Fuel injector\n2. Manuals\nMay include:\n2.1 Manufacturer specification manual\n2.2 Maintenance procedure manual\n2.3 Periodic maintenance manual\n2.4 Service manual\n2.5\nParts Checklist\n3. Tools and equipment\nMay include:\n3.1 Hand tools, test equipment including; exhaust gas\nanalyzers, opacimeter, hand held meters\n3.2 Power tools, special tools for testing, removal or\nadjustment, dynamometers\n4. Company standard\noperating procedure\nMay include:\n4.1 Job order\n4.2 Requisition slip\n4.3 Wearing of personal protective equipment such as\nApron, gloves, gas mask, goggles\n4.4 Industry/Workplace Codes of Practice\n4.5 IRR on Phil Clean Air Act 1999 4.6 Material safety\ndata sheets\n4.6\nAppropriate licenses and certificates\n\n--- PDF PAGE 81 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n79\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1Conducted emission control test of vehicle\n1.2 Serviced emission control systems and associated\ncomponents\n2. Required knowledge\n2.1 OH&S legislation\n2.2 Implementing Rules and Regulation for Phil. Clean Air\nAct 1999\n2.3 Identification of motor vehicle emissions and their\neffects on the environment\n2.4 The relationship between emission control system\nfaults and their symptoms\n2.5 Testing procedures\n2.6 Types of emission systems and components\n2.7 Operation of emission control systems, sub-\nassemblies and components (relevant to application)\n2.8 Service, repair and adjustment principles for emission\ncontrol systems\n2.9 The interpretation of technical information, graphic\nsymbols and diagrams\n2.10 Positive Work Values (Patience, Perseverance,\nHonesty, etc.)\n2.11Quality procedures, e.g., 5S\n2.12Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3. Required skills\n3.1 Work safety\n3.2 Access, interpret and apply technical information\n3.3 Test emission systems/component)\n3.4 Safely and correctly use tools and equipment\n3.5 Remove and replace emission control systems and\ncomponents\n3.6 Maintain customers records\n3.7 Test, inspect and evaluate emission control\nsystem/components\n3.8 Repair and adjust emission control systems\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real workshop with gas and diesel\nvehicles\n4.2 Appropriate Tools Materials relevant to the activity\n4.3 Diesel and Gas emission test equipment\n4.4 Protective devices; gas mask\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Observation/Demonstration with questioning\n5.2 Written test\n5.3 Portfolio\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or\nsimulated environment.\n6.2 The assessment of practical skills must take place\nafter a period of supervised practice and repetitive\nexperience\n\n--- PDF PAGE 82 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n80\nUNIT OF COMPETENCY :\nSERVICE AND REPAIR ELECTRONICALLY\nCONTROLLED ANTI-LOCK BRAKING SYSTEMS\n\nUNIT CODE\n:\nALT 723362\n\nUNIT DESCRIPTOR : This unit covers the competence to carry out service\n/ repairs to electronically controlled anti-lock brakes in\naccordance with manufacturer/component supplier\nspecifications fitted to light vehicles and/or heavy\nvehicles, The unit includes identification and\nconfirmation of work requirement, preparation for\nwork, testing and diagnosis of faults, servicing, repair\nand retesting of systems and completion of work\nfinalization processes, including clean-up and\ndocumentation..\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(NOTE: All standard of performance for Service and Repair\nEmission Systems is in accordance with company standard\noperating procedure and manufacturer’s specification manuals\nusing specified tools and equipment.)\n1. Prepare for work\n1.1 Work instructions are used to determine job\nrequirements, including quality, material, equipment\nquantities and service manuals\n1.2 Job specifications are read and interpreted\n1.3 OH&S requirements, including personal protection\nneeds, are observed throughout the work\n1.4 Electronic system protection devices, processes and\nprecautions are identified appropriate to the\napplication\n1.5 Tools and equipment are identified and checked for\nsafety and correct operation\n1.6 Procedures are identified to minimize task time\n2. Test control system,\ndiagnose faults and\ndetermine\nservice/repair\nrequirements\n2.1 Correct information is accessed and interpreted\nfrom manufacturer/component supplier specifications\n2.2 Tests are carried out according to manufacturer /\ncomponent supplier recommended procedures using\ntooling, equipment and techniques\n2.3 Testing is completed without causing damage to\ncomponent or system\n2.4 Test results are used to diagnose system/component\nfaults\n2.5 Service/repair requirements are determined\n2.6 Testing is carried out according to industry\n regulations/guidelines OH&S and\n enterprise/procedures policies\n\n--- PDF PAGE 83 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n81\n\n3. Service/repair anti -\nlock braking systems\n3.1 Correct information is accessed and interpreted from\nManufacturer / component supplier specifications\n3.2 Service/repair requirements are carried out according\nto manufacturer / component supplier recommended\nspecifications and procedures\n3.3 Service/repair is completed without causing damage\nto component or system\n3.4 Electronic systems are tested and results are\ndocumented in accordance with workplace policies\nand procedures\n3.5 Service, repair and retesting are carried out\naccording to industry regulations/guidelines, OH&S\nand enterprise / procedures policies\n3.6 Workplace and equipment documents are completed\nin accordance with site requirements\n4. Clean up work area\nand maintain\nequipment\n4.1 Material that can be reused is collected and stored\n4.2 Waste and scrap are removed following workplace\nprocedures\n4.3 Equipment and work area are cleaned and inspected\nfor serviceable conditions in accordance with\nworkplace procedures\n4.4 Unserviceable equipment is tagged and faults\nidentified in accordance with workplace procedures\n4.5 Operator maintenance is completed in accordance\nwith manufacturer / component supplier\nspecifications and site procedures\n4.6 Tooling is maintained in accordance with workplace\nProcedures\n\n--- PDF PAGE 84 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n82\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OH&S\n1.1. OH&S requirements are to be in accordance with\nlegislation/regulations/codes of practice and\nenterprise safety policies and procedures.\n1.1.1 Protective clothing and equipment,\n1.1.2 use of tooling and equipment,\n1.1.3 workplace environment and safety\n1.1.4 handling of material\n1.1.5 use of fire fighting equipment\n1.1.6 enterprise first aid\n1.1.7 hazard control and hazardous materials and\n substances\n1.1.8 Personal protective equipment is to include\nthat prescribed under\nlegislation/regulation/codes of practice and\nworkplace policies and procedures\n\n1.2 Safe operating procedures are to include, but are\nnot limited to the\n1.2.1 conduct of operational risk assessment and\n treatments associated with vehicular\nmovement\n1.2.2 toxic substances\n1.2.3 electrical safety\n1.2.4 machinery movement and operation\n1.2.5 manual and mechanical lifting and shifting\n2. Tools and equipment\nMay include:\n2.1 Hand tools\n2.2 Multimeter,\n2.3 Vehicle lifting devices\n2.4 Power tools\n2.5 Special tooling for removal/replacement\n2.6 Brake and side slip tester\n2.7 Electronic testing equipment\n2.8 Oscilloscope and scan tools\n3. Information\nMay include:\n3.1 Verbal or written and graphical instructions, signage,\nwork schedules / plans / specifi