        "source_title": "SERVICE DIESEL ENGINE MANAGEMENT SYSTEM AND COMPONENTS",
        "source_text": "--- PDF PAGE 67 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n65\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nSERVICE DIESEL ENGINE MANAGEMENT \nSYSTEM AND COMPONENTS \n \nUNIT CODE \n: \nALT 723323 \n \nUNIT DESCRIPTOR \n: \nThis unit identifies the competence required in \nservicing diesel engine management system and \ncomponents. It also includes the competence in \noverhauling common rail injection pump and adjusting \ncommon rail mechanical governor. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n(NOTE: All standard of performance for Service Diesel Engine \nManagement System Component is in accordance with Company \nStandard operating procedure and Manufacturer’s specification \nmanuals using specified tools and equipment.)\n1.  Overhaul common \nrail injection pump \n1.1 Common rail injection pump is disassembled   \n1.2 Failure analysis of common rail injection pump is \n100%accurate  \n1.3 Corresponding recommendation is given based on the \nanalysis  \n1.4 Injection pump parts double checked for completeness, \nreference marks and torque  \n1.5 Common rail injection pump is assembled  \n2. Adjust common rail   \nmechanical governor  \n2.1 Completeness of common rail mechanical governor \nparts and initial setting performed   \n2.2 Set screw is sealed\n\n--- PDF PAGE 68 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n66\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Diesel Injection \nSystem Component \nMay include: \n1.1 Diesel engine \n2.  Manual \nMay include: \n2.1 Manufacturer specification manual  \n2.2 Maintenance procedure manual  \n2.3 Periodic maintenance manual  \n2.4 Service manual  \n2.5\nParts Checklist\n3.  Tools and equipment \nMay include: \n3.1  Common and special hand tools \n4.  Company standard \noperating procedure \nMay include: \n4.1 Job order  \n4.2 Requisition slip \n4.3 Wearing of personal protective equipment such as \nApron, gloves, gas mask, goggles\n\n--- PDF PAGE 69 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n67\nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate:  \n1.1 Overhauled common rail injection pump  \n1.2\nAdjusted common rail mechanical governor\n2.  Required knowledge  \n2.1 Diesel fuel injector types/classification and \ncharacteristics \n2.2 Procedure and precaution in disassembling Diesel \nFuel Injector  \n2.3 Techniques in failure analysis  \n2.4 Procedure in Injector lapping  \n2.5 Procedure in Diesel fuel injector assembly  \n2.6 Common rail injector pump parts, function and \noperation  \n2.7 Procedure and precaution in overhauling common rail \ninjection  \n2.8 Common rail injection pump parts reference mark use \nand application  \n2.9 Rotary injection pump parts, function and operation  \n2.10 Rotary injection pump parts reference mark use and \napplication  \n2.11 Positive Work Values (Patience, Perseverance, \nHonesty, etc.) \n2.12 Quality procedures, e.g., 5S \n2.13 Environmental-conservation procedures,  \n       e.g., 3R (reduce, reuse, recycle) \n3.  Required skills \n3.1 Troubleshooting and servicing  P.T., rotary injection, \ncommon rail injection and feed pumps  \n3.2 Overhauling  P.T., rotary injection, common rail \ninjection and feed pumps  \n3.3 Handling common and special tools and testing \nequipment\n4.  Resource \nimplications \nThe following resources should be provided:  \n4.1 Workplace: Real or simulated work area  \n4.2 Appropriate Tools & equipment  \n4.3\nMaterials relevant to the activity \n5.  Method of \nassessment \nCompetency in this unit may be assessed through:  \n5.1 Observation/Demonstration with Questioning  \n5.2\nPortfolio\n6.  Context of \nassessment \n6.1 Competency must be assessed on the job or \nsimulated environment.  \n6.2 The assessment of practical skills must take place \nafter a period of supervised practice and repetitive \nexperience.\n",
