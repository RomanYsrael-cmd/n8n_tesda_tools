ber of a team to achieve a\nshared goal\n3.8 Use mathematical ideas and techniques such as\nnumber and space and techniques, e.g. estimation and\napproximation, for practical purposes\n3.9 Apply problem-solving strategies in purposeful ways,\nboth in situations where the problem and the desired\nsolution are clearly evident and in situations requiring\ncritical thinking and a creative approach to achieve an\noutcome\n3.10 Combine the physical and sensory skills needed to\noperate equipment with understanding of scientific and\ntechnological principles needed to explore and adapt\nsystems\n\n--- PDF PAGE 112 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n110\n4 Resource\nImplications\n\nThe following resources should be provided:\n4.1.\nA workplace or simulated workplace\n4.2.\nEnterprise stationery, telephone and forms/business\ndocuments\n4.3.\nRepair order, job cards and quotes / estimates\n4.4.\nComputer and software, calculator\n4.5.\nHand tooling, workshop equipment\n\n5 Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6 Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 113 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n111\n\nUNIT OF MPETENCY: ENSURE A SAFE WORKPLACE\nUNIT CODE :"
