ents\n3.1.\nDevelop simple assessment instruments to meet\ntarget group needs\n3.2.\nAnalyze available assessment instruments for their\nsuitability for use and modify as required\n3.3.\nMap assessment instruments against unit or course\nrequirements\n3.4.\nWrite clear instructions for candidate about the use of\nthe instruments\n3.5.\nTrial draft assessment instruments to validate content\nand applicability, and record outcomes\n\n--- PDF PAGE 98 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n96\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Purposes of\nassessment\nMay include:\n1.1.\nRecognizing current existing competence of\ncandidates\n1.2.\nDetermining if competence has been achieved\nfollowing learning\n1.3.\nEstablishing candidate progress towards\nachievement of competence\n1.4.\nDetermining language, literacy and numeracy needs\nof candidates\n1.5.\nCertifying competence through a qualification or\nStatement of Attainment\n1.6.\nLicensing or regulatory requirements\n2. Context of\nassessment\nMay include:\n2.1.\nEnvironment in which the assessment will be carried\nout, including real or simulated workplace\n2.2.\nOpportunities for collecting evidence in a number of\nsituations\n2.3.\nRelationships between competency standards and\n2.3.1. Evidence to support recognition of prior\nlearning\n2.3.2. work activities in the candidate's workplace\n2.3.3. learning activities\n2.4.\nWho carries out the assessment\n3. Organizational,\nlegal and ethical\nrequirements\nMay include:\n3.1.\nAssessment system policies and procedures\n3.2.\nAssessment strategy requirements\n3.3.\nReporting, recording and retrieval systems for\nassessment, including recognition of prior learning\n3.4.\nQuality assurance systems\n3.5.\nBusiness and performance plans\n3.6.\nAccess and equity policies and procedures\n3.7.\nCollaborative and partnership arrangements\n3.8.\nDefined resource parameters\n3.9.\nmutual recognition arrangements\n3.10. Industrial relations systems and processes, awards,\nand enterprise agreements\n3.11. Registration scope\n3.12. Human resources policies and procedures\n3.13. Legal requirements, including\n3.13.1. Anti-discrimination\n3.13.2. Equal employment opportunity\n3.13.3. Job role, responsibilities and conditions\n3.14. Relevant industry codes of practice\n3.15. Confidentiality and privacy requirements\n3.16. OHS considerations, including:\n3.16.1. Ensuring OHS requirements are adhered to\nduring the assessment process\n3.16.2. Identifying and reporting OHS hazards and\nconcerns to relevant personnel\n\n--- PDF PAGE 99 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n97\n4. Benchmarks for\nassessment /\nrecognition of prior\nlearning\nMay include:\n4.1.\nCriterion against which the candidate is assessed or\nprior learning recognized, which may be:\n4.1.1. Competency standard/unit of competency\n4.1.2. Assessment criteria of course curricula\n4.1.3. Performance specifications of an enterprise or\nindustry\n4.1.4. Product specifications\n5. Types of evidence\nMay include:\n5.1.\nDirect\n5.2.\nIndirect\n5.3.\nSupplementary\n6. Rules of evidence\nMay include:\n6.1.\nValid\n6.2.\nSufficient\n6.3.\nAuthentic\n6.4.\nReliable\n7. Assessment\nmethods\nMay include:\n7.1.\nDirect observation\n7.1.1. Real work/real time activities at the workplace\n7.1.2. Work activities in a simulated workplace\nenvironment\n7.2.\nStructured activities:\n7.2.1. Simulation exercises and role-plays\n7.2.2. Projects\n7.2.3. Presentations\n7.2.4. Activity sheets\n7.3.\nQuestioning:\n7.3.1. Written questions, e.g. on a computer\n7.3.2. Interviews\n7.3.3. Self-assessment\n7.3.4. Verbal questioning\n7.3.5. Questionnaires\n7.3.6. Oral or written examinations (applicable at\nhigher AQF levels)\n\n7.4.\nPortfolios of evidence:\n7.4.1. Collection of work samples compiled by\ncandidate\n7.4.2. Product with supporting documentation\n7.4.3. Historical evidence\n7.4.4. Journal or log book\n7.4.5. Information about life experience\n7.5.\nReview of products:\n7.5.1. Testimonials and reports from employers and\nsupervisors\n7.5.2. Evidence of training\n7.5.3. Authenticated prior achievements\n7.5.4. Interview with employer, supervisor, or peer.\n\n--- PDF PAGE 100 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n98\n8. Assessment plan\nMay include:\n8.1.\nOverall planning document describing:\n8.2.\nWhat is to be assessed\n8.3.\nWhen assessment is to take place\n8.4.\nWhere assessment is to take place\n8.5.\nHow assessment is to take place.\n9. Simple assessment\ninstruments\nMay include:\n9.1.\nInstruments developed by an assessor as part of\nformative or summative assessment activities,\nincluding:\n9.1.1. Profiles of acceptable performance measures\n9.1.2. Templates\n9.1.3. Specific questions or activities\n9.1.4. Evidence and observation checklists\n9.1.5. Checklists for the evaluation of work samples\n9.1.6. Recognition portfolios\n9.1.7. Candidate self-assessment materials\n9.2.\nInstruments developed elsewhere that have been\nmodified by the assessor for use with a particular\nclient group.\n10. Available\nassessment\ninstruments\nMay include:\n10.1. Commercially available instruments\n10.2. Those created by others inside the registered training\norganization.\n11. Map assessment\nMay include:\nShowing a clear relationship between the evidence and the\nrequirements of the unit.\n\n--- PDF PAGE 101 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n99\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nEvidence of the ability to:\n1.1.\nPlanned and organized the assessment process on a\nminimum of two occasions\n1.2.\nCollected evidence that demonstrates:\n1.2.1. Documented assessment plans\n1.2.2. Covered a range of assessment events\n1.2.3. Catered for a number of candidates\n1.2.4. Different competency standards or accredited\ncurricula\n1.2.5. Recognition of prior learning assessment\n1.2.6. Contextualisation of competency standards\nand the selected assessment tools, where\nrequired\n1.2.7. Incorporation of reasonable adjustment\nstrategies\n1.2.8. Development of simple assessment\ninstruments for use in the process\n1.2.9. Organisational arrangements\n2. Required\nknowledge\n2.1.\nEthical and legal requirements of an assessor\n2.2.\nCompetency-based assessment, including:\n2.2.1. Work-focused\n2.2.2. Criterion-referenced\n2.2.3. Standards-based\n2.2.4. Evidence-based\n2.3.\nDifferent purposes of assessment and different\nassessment contexts, including recognition of prior\nlearning\n2.4.\nHow to read and interpret the identified competency\nstandards as the benchmarks for assessment\n2.5.\nHow to contextualise competency standards within\nrelevant guidelines\n2.6.\nFour principles of assessment and how they guide\nthe assessment process\n2.7.\nPurpose and features of evidence, and different types\nof evidence used in competency-based assessments,\nincluding recognition of learning process\n2.8.\nRules of evidence and how they guide evidence\ncollection\n2.9.\nDifferent types of assessment methods, including\nsuitability for collecting various types of evidence\n2.10. Assessment tools and their purpose; different types of\ntools; relevance of different tools for specific\nevidence-gathering opportunities\n2.11. Quality procedures, e.g., 5S\n2.12. Environmental-conservation procedures,\ne.g., 3R (reduce, reuse, recycle)\n\n--- PDF PAGE 102 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n100\n3. Required Skills\n3.1 Cognitive interpretation skills to:\n3.1.1 Interpret competency standards and other\nassessment documentation, including material\nrelating to reasonable adjustment\n3.1.2 Identify opportunities for integrated\ncompetency assessment\n3.1.3 Contextualize competency standards to the\noperating assessment environment, including\nrecognition of prior learning\n3.1.4 Consider access and equity needs of diverse\ncandidates\n3.2 Technology skills to use appropriate equipment and\nsoftware to communicate effectively with others\n3.3 Research and evaluation skills to:\n3.3.1 Obtain competency standards, assessment\ntools and other relevant assessment resources\n3.3.2 Research candidate characteristics and any\nreasonable adjustment needs\n3.3.3 Evaluate feedback, and determine and\nimplement improvements to processes\n3.4 Literacy skills to read and interpret relevant information\nto design and facilitate assessment and recognition\nprocesses\n3.5 Communication skills to discuss assessment, including\nrecognition of learning process processes with clients\nand other assessors\n3.6 Interpersonal skills to:\n3.6.1 Demonstrate sensitivity to access and equity\nconsiderations and candidate diversity\n3.6.2 Promote and implement equity, fairness,\nvalidity, reliability and flexibility in planning an\nassessment processes\n4.Resource Implications\n\nThe following resources should be provided:\n4.1.\nEvidence must be gathered in the workplace\nwherever possible. Where no workplace is available,\na simulated workplace must be provided.\n4.2.\nAssessment must ensure access to training products,\nsuch as training packages and accredited course\ndocumentation.\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 103 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n101\n\nUNIT OFMPETENCY : MANAGE FACILITY AND INVENTORY REQUIREMENTS\nUNIT CODE : ALT311366\nUNIT DESCRIPTOR\n:\nThis unit involves the skills and knowledge required to\nmanage a facility and its inventory requirements. It includes\nidentifying\nspace,\nsafety\nand\nsecurity\nrequirements;\ndeveloping a documentation system; designing storage\nzones; and evaluating facility utilization.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify space\nrequirements\n1.1 The medium-term and long-term storage needs of the\norganization are assessed to facilitate planning in\naccordance with the business plan of the enterprise\n1.2 Product type, picking frequencies, value, fragility, weight,\nhandling characteristics, quantity and holding periods\nare assessed to consider type and amount of storage\n1.3 Facility is assessed to determine the stock holding and\nhandling requirements for each inventory item\n1.4 Volume requirements are calculated to ensure that\nongoing stock holding needs are met\n1.5 The total space requirement is calculated and used to\nformulate plan for space utilization\n2\nIdentify safety and\nsecurity\nrequirements\n2.1\nAn assessment is made of risks to ensure maximum\nsafety and security for personnel, stock and facilities\n2.2\nStorage handling security and incident/emergency\nprocedures for each class or type of product are\nidentified and documented\n2.3\nFire prevention and firefighting systems are identified\nin accordance with building code regulations and\nstorage material requirements\n2.4\nAn evacuation plan is developed in accordance with\nthe safety program of the enterprise\n3\nDevelop\ndocumentation\nsystem\n3.1\nAn inventory system for recording and tracing stock\nlocation, receiving, throughput and dispatch is\ndeveloped and implemented to enable reporting,\nquality assurance and financial requirements to be\nmet\n3.2\nA system for recording communication with carriers,\ncustomers\nand\nemployees\nis\ndeveloped\nand\nimplemented to assess operational effectiveness and\nto provide data for system improvement.\n\n--- PDF PAGE 104 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n102\n\n4\nDesign storage\nzones\n4.1\nSpace requirements and equipment operation are\naccurately assessed to facilitate the planning of\nwarehouse zones\n4.2\nAn assessment is made of the facility to enable the\nmost effective use of available space\n4.3\nPositioning of storage areas, bays, work stations and\nthe like is undertaken in accordance with data\nobtained from the planning process\n4.4\nProvision for maintenance and cleaning is catered for\n5\nEvaluate facility\nutilization\n5.1\nA continual system of review is used involving regular\nchecks to ensure storage areas and systems are\nfunctioning at optimum levels\n5.2\nReceiving and dispatch systems provide efficient\noperations\n5.3\nStorage and handling systems provide ease of\naccess and comply with ergonomic principles\n5.4\nProduct handling and storage minimizes product\ndamage, contamination and stock losses\n5.5\nFacility layout remains sufficiently flexible to meet\nchanging storage and handling requirements\n5.6\nAppropriate reporting systems are established and\nused to maintain data for the design of improved\nfacilities and systems\n\n--- PDF PAGE 105 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n103\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Type and amount of\nstorage\nMay include:\n1.1.\nFast moving item\n1.2.\nSlow moving item\n1.3.\nAmount in terms of number or quantity\n1.4.\nAmount in terms of standard number of packaging\n(SNP)\n2. Handling\nrequirements\nMay include:\n\n2.1.\nHand pallet truck\n2.2.\nForklift\n2.3.\nPallets\n2.4.\nTote bins\n3. Space utilization\nMay involve:\n3.1.\nTwenty four hour operation\n3.2.\nSingle and multi-site location\n3.3.\nLarge, medium and small companies\n3.4.\nHorizontal and or vertical space utilization\n\n4. Storage handling\nprocedures\nMay include:\n4.1.\nStandard operating procedures (SOPs)\n4.2.\nCompany procedures\n4.3.\nOrganizational procedures\n4.4.\nEstablished procedures\n5. Planning process\nMay include:\n5.1.\nMaterial requirement planning (MRP)\n5.2.\nEconomic ordering quantity (EOQ)\n5.3.\nJust in time delivery system (JIT)\n\n--- PDF PAGE 106 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n104\n6. Communication in\nthe work area\nMay include:\n6.1 Phone\n6.2 Electronic data interchange (EDI)\n6.3 Fax\n6.4 E-mail\n6.5 Internet\n6.6 RF systems\n6.7 Oral, aural or signed communications\n7. Appropriate\nreporting system\nMay involve:\n7.1.\nOther employees and supervisors\n7.2.\nRelevant authorities and institutions\n7.3.\nManagement and union representatives\n7.4.\nIndustrial relations and OH&S specialists\n7.5.\nCustomers and suppliers\n7.6.\nOther professional or technical staff, contractors and\nmaintenance personnel\n\n--- PDF PAGE 107 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n105\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nThe evidence required to demonstrate competency in this\nunit must be relevant to and satisfy all of the requirements of\nthe elements and performance criteria of this unit and\ninclude demonstration of applying:\n1.1.\nthe underpinning knowledge and skills\n1.2.\nrelevant legislation and workplace procedures\n1.3.\nother relevant aspects of the range statement\n2. Required knowledge\n2.1.\nRelevant sections of national and state or territory\nregulatory requirements and codes of practice,\nincluding knowledge of fire safety and building\nregulations applicable to the facility\n2.2.\nRelevant OH&S and environmental procedures and\nregulations\n2.3.\nFocus of operation of warehouse systems, resources,\nmanagement and workplace operating systems\n2.4.\nEnterprise business policies and plans including\nprocedures for operations of the facility\n2.5.\nThroughput and storage requirements for specific\ntypes of inventory\n2.6.\nPrinciples, purpose and location of controls,\nmonitoring devices, and systems\n2.7.\nSelection and appropriate application of technology,\ninformation systems and procedures\n2.8.\nProcedures for operating electronic communications\nequipment\n2.9.\nRequirements for completing relevant documentation\n2.10. Procedures for managing and controlling hazardous\nsituations when carrying out work activities,\nparticularly those that relate to the storage of\nmaterials\n2.11. Procedures to be followed in the event of an\nemergency\n2.12. Quality procedures, e.g., 5S\n2.13. Environmental-conservation procedures,\ne.g., 3R (reduce, reuse, recycle)\n3. Required Skills\n3.1\nCommunicate effectively with others when managing\nfacility and inventory requirements\n3.2\nRead and interpret plans, diagrams, regulations, codes\nof practice and other documentation relevant to the\nmanagement of facilities and inventory requirements\n3.3\nProvide leadership to others when managing facilities\nand inventory requirements\n3.4\nAdapt appropriately to cultural differences in the\nworkplace, including modes of behavior and\ninteractions with others\n3.5\nPromptly report and or rectify any identified\nproblems that may arise during the planning and\nmanagement of facilities and inventory requirements\n3.6\nDevelop and implement contingency plans for\nunplanned events which may arise during the\nmanagement of facilities and inventory requirements\n3.7 Prioritize work and coordinate the work of others\n3.8\nApply precautions and required action to minimize,\ncontrol or eliminate hazards that may exist during work\nactivities\n3.9\nSelect and apply appropriate technology, information\nsystems and procedures when managing facility and\ninventory requirements\n\n--- PDF PAGE 108 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n106\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1.\nA range of relevant exercises, case studies and/or\nother simulated practical and knowledge assessment\n4.2.\nAccess to an appropriate range of relevant\noperational situations in the workplace\n4.3.\nRelevant and appropriate materials and equipment,\n4.4.\nApplicable documentation including workplace\nprocedures, regulations, codes of practice and\noperation manuals\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 109 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n107\n\nUNIT OF COMPETENCY : ESTIMATE COMPLEX JOB\nUNIT CODE : ALT311367\nUNIT DESCRIPTOR : This unit of competency covers the competence required\nto estimate the time requirements for complex jobs,\nsource requirements, gather cost estimates from external\nservice providers and document quotations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Estimate time\nrequirements for jobs\n1.1\nMethods\nused\nfor\ntime\nestimates\nfor\njob\nrequirements are calculated based on warranty\ntimes, staff estimates, standard service/repair times,\nspecifications, and subcontracted timeframes\n 1.2 Service/repair times are estimated and compared to\ndocumented estimate to ensure repair job is viable\n1.3 Turn-around\ntimes\nfor\nwork\ncompleted\nby\nsubcontractor are incorporated into total time\nestimates\n\n2\nSource parts\n2.1.\nViability of replacement compared to repair is\nascertained to meet quality standards and legal\nrequirements\n2.2.\nPart requirements are determined to ensure cost\nconstraints are met\n2.3.\nParts and consumables required for the job are\nordered\n2.4.\nParts are sourced externally when internal stock is\nnot available to meet customer requirements\n3\nIdentify subcontract\ntesting and/or service/\nrepair work costs for\nincorporation into the\ntotal estimated cost\n3.1.\nEstimate is documented\n3.2.\nService/repair requirements, procedures and costs\nare documented in a logical order\n3.3.\nService/repair requirements are documented in\ndetail\n3.4.\nEstimate is relevant to the identified service/repair\nrequirements\n3.5.\nPotential variations are noted on the estimate\n4\nEstimate total job\ncosts\n4.1.\nExternal service providers are given a clear outline\nof the work and time requirements of the job\n4.2.\nJob cost estimate is documented and agreed\nwith external service providers\n4.3.\nCost of parts and consumables are estimated\naccording to industry and/or enterprise pricing\nstandards\n4.4.\nSupplementary estimate is prepared, to gain\nauthorization\nfrom\nowner\nfor\nadditional\nservice/repairs\n4.5.\nFinal estimate is documented\n4.6.\nAuthorization\nis\ngained\nfrom\ncustomer\nto\ncommence work and/or undertake supplementary\nwork\n5\nReport estimations to\ncustomer\n5.1.\nReport of findings is completed in the enterprise-\napproved format\n5.2.\nCustomer is advised of the estimation\n5.3.\nJob\ncard\nis\ncompleted\nand\ndelivered\nto\nappropriate persons\n\n--- PDF PAGE 110 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n108\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods\nMay include:\n1.1 Written and verbal communication\n1.2 Sourcing of parts\n1.3 Estimating costs\n1.5 Documentation\n2. Legal requirements\nMay include:\n2.1\nRegional / territory OHS legislation,\nmanufacturer/component supplier specifications and\nsafe operating procedures\n2.2\nEnvironmental requirements, manual handling\nprocedures and insurance requirements\n\n3. Variations\nMay include:\n3.1 Jobs involving subcontracted work\n3.2\nJobs involving a mix of vocations (e.g. mechanical,\nbody and electrical)\n4. Job cost estimate\nMay include:\n4.1. Manufacturer/component supplier specifications\n4.2. Enterprise operating procedures\n4.3. Customer requirements\n4.4. Industry/workplace codes of practice\n\n--- PDF PAGE 111 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n109\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Observed safety procedures and requirements\n1.2 Communicated effectively with others involved in or\naffected by the work\n1.3 Selected methods and techniques appropriate to the\ncircumstances\n1.4 Completed preparatory activity in a systematic manner\n1.5 Estimated manufacturer/component supplier\nrequirements\n1.6 Estimated the work completed within workplace\ntimeframes\n1.7 Reported presented to customer is in compliance with\nworkplace requirements.\n2. Required knowledge\n2.1OHS regulations/requirements, equipment, material and\npersonal safety requirements\n2.2 Principles of estimating and job costing\n2.3 Enterprise quality procedures\n2.4 Work organisation and planning processes\n2.5 Contract law\n2.6 Sale-contracting principles\n2.7 Written communication and report writing skills\nprocedures relevant to application\n2.8 Oral communication skills procedures relevant to\napplication\n2.9 Quality procedures, e.g., 5S\n2.10 Environmental-conservation procedures,\n e.g., 3R (reduce, reuse, recycle)\n3\nRequired Skills\n3.1Research and interpretive skills sufficient to locate,\ninterpret and apply manufacturer/component supplier\nprocedures, workplace policies and procedures\n3.2 Analytical skills required for the identification and\nanalysis of technical information\n3.3 Plain English literacy and communication skills in\nrelation to dealing with customers and team members\n3.4 Questioning and active listening skills for example\nwhen obtaining information from customers\n3.5 Oral communication skills sufficient to convey\ninformation and concepts to customers\n3.6 Making good use of time and resources, sorting out\npriorities and monitoring own performance\n3.7 Interacting effectively with other persons both on a one-\nto-one basis and in groups, including understanding\nand responding to the needs of a customer and\nworking effectively as a member of a team to achieve a\nshared goal\n3.8 Use mathematical ideas and techniques such as\nnumber and space and techniques, e.g. estimation and\napproximation, for practical purposes\n3.9 Apply problem-solving strategies in purposeful ways,\nboth in situations where the problem and the desired\nsolution are clearly evident and in situations requiring\ncritical thinking and a creative approach to achieve an\noutcome\n3.10 Combine the physical and sensory skills needed to\noperate equipment with understanding of scientific and\ntechnological principles needed to explore and adapt\nsystems\n\n--- PDF PAGE 112 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n110\n4 Resource\nImplications\n\nThe following resources should be provided:\n4.1.\nA workplace or simulated workplace\n4.2.\nEnterprise stationery, telephone and forms/business\ndocuments\n4.3.\nRepair order, job cards and quotes / estimates\n4.4.\nComputer and software, calculator\n4.5.\nHand tooling, workshop equipment\n\n5 Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6 Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 113 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n111\n\nUNIT OF MPETENCY: ENSURE A SAFE WORKPLACE\nUNIT CODE : ALT311368\nUNIT DESCRIPTOR : This unit describes the performance outcomes, skills and\nknowledge required to establish, maintain and evaluate the\norganization's occupational health and safety (OHS)\npolicies, procedures and programs in the relevant work area\nin accordance with OHS legal requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Establish and\nmaintain an OHS\nsystem\n1.1 Locate and communicate OHS policies which clearly\nexpress the organization's commitment to implement\nrelevant OHS legislation in the enterprise\n1.2 Define OHS responsibilities for all workplace\npersonnel in accordance with OHS policies,\nprocedures and programs\n1.3\nIdentify and approve financial and human resources\nfor the effective operation of the OHS system\n2. Establish and\nmaintain\nparticipative\narrangements for\nthe management of\nOHS\n2.1.\nEstablish and maintain participative arrangements\nwith\nemployees\nand\ntheir\nrepresentatives\nin\naccordance with relevant OHS legislation\n2.2.\nAppropriately\nresolve\nissues\nraised\nthrough\nparticipative arrangements and consultation\n2.3.\nPromptly provide information about the outcomes of\nparticipation and consultation in a manner accessible\nto employees\n3. Establish and\nmaintain procedures\nfor identifying\nhazards, and\nassessing and\ncontrolling risks\n3.1.\nDevelop procedures for ongoing hazard identification,\nand assessment and control of associated risks\n3.2.\nInclude hazard identification at the planning, design\nand evaluation stages of any change in the workplace\nto ensure that new hazards are not created by the\nproposed changes\n3.3.\nDevelop and maintain procedures for selection and\nimplementation\nof\nrisk\ncontrol\nmeasures\nin\naccordance with the hierarchy of control\n3.4.\nIdentify inadequacies in existing risk control measures\nin accordance with the hierarchy of control and\npromptly provide resources to enable implementation\nof new measures\n3.5.\nIdentify intervention points for expert OHS advice\n4. Establish and\nmaintain a quality\nOHS management\nsystem\n4.1.\nDevelop and provide an OHS induction and training\nprogram\nfor\nall\nemployees\nas\npart\nof\nthe\norganization's training program\n4.2.\nUtilize system for OHS record keeping to allow\nidentification of patterns of occupational injury and\ndisease in the organization\n4.3.\nMeasure and evaluate the OHS system in line with\nthe organization's quality systems framework\n4.4.\nDevelop and implement improvements to the OHS\nsystem to achieve organizational OHS objectives\n4.5.\nEnsure\ncompliance\nwith\nthe\nOHS\nlegislative\nframework so that legal OHS standards are\nmaintained as a minimum\n\n--- PDF PAGE 114 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n112\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OHS legislation\nMay include:\n1.1 Common law duties to meet general duty of care\nrequirements\n1.2 Regulations and approved codes of practice relating\nto hazards in the work area\n1.3 Requirements for establishment of consultative\narrangements including those for health and safety\nrepresentatives, and health and safety committees\n1.4 Requirements for effective management of hazards\n1.5 Requirements for provision of information and training\nincluding training in safe operating procedures,\nprocedures for workplace hazards, hazard\nidentification, risk assessment and risk control, and\nemergency and evacuation procedures\n1.6 Requirements for the maintenance and confidentiality\nof records of occupational injury and disease\n2. Control of associated\nrisks\nMay include:\n2.1 Administrative\n2.2.\nCounseling / disciplinary processes\n2.3.\nElimination\n2.4.\nEngineering\n2.5.\nHousekeeping and storage\n2.6.\nIssue resolution\n2.7.\nOHS records maintenance and analysis\n2.8.\nPersonal protective equipment\n2.9.\nPurchasing of supplies and equipment\n2.10. Workplace inspections including plant and equipment\n3. Organizational\nhealth and safety\nrecord keeping\nMay include:\n3.1 Audit and inspection reports\n3.2 workplace environmental monitoring records\n3.3 consultation e.g. meetings of health & safety committees,\nwork group meeting agendas including OHS items and\nactions\n3.4 induction, instruction and training\n3.5 manufacturers' and suppliers' information including\ndangerous goods storage lists\n3.6 hazardous substances registers\n3.7 plant and equipment maintenance and testing reports\n3.8 workers compensation and rehabilitation records\n3.9first aid/medical post records\n\n--- PDF PAGE 115 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n113\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate\nunderstand and explain:\n1.1 Detailed knowledge and application of all relevant OHS\nlegislative frameworks\n1.2 Establishment and maintenance of arrangements for\nmanaging OHS within the organizations' business\nsystems and practices\n1.3 Identification of intervention points for expert OHS\nadvice\n1.4 Principles and practice of effective OHS management in\na small, medium or large business.\n2. Required knowledge\n6.1 Application of the hierarchy of control (the preferred\norder of risk control measures from most to least\npreferred, that is, elimination, engineering controls,\nadministrative controls, personal protective equipment)\n6.2 Hazard identification and risk management\n6.3 Relevant legislation from all levels of government that\naffects business operation, especially in regard to OHS\nand environmental issues, equal opportunity, industrial\nrelations and anti-discrimination\n6.4 Reporting requirements\n6.5 Quality procedures, e.g., 5S\n6.6 Environmental-conservation procedures,\ne.g., 3R (reduce, reuse, recycle)\n3. Required Skills\n3.1 Analytic skills to analyze relevant workplace data in\norder to identify hazards, and to assess and control risks\n3.2\nCommunication skills to consult with staff and to\npromote a safe workplace\n3.3\nProblem-solving skills to deal with complex and non-\nroutine difficulties\n3.4\nTechnology skills to store and retrieve relevant\nworkplace data\n4 Resource\nImplications\n\nThe following resources should be provided:\n• Access to appropriate documentation and resources\nnormally used in the workplace e following resources\nmust be provided:\n5 Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6 Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 116 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n114\n\nUNIT OF MPETENCY : IMPLEMENT CONTINUOUS IMPROVEMENT\nUNIT CODE : ALT311369\nUNIT DESCRIPTOR : This unit describes the performance outcomes, skills and\nknowledge\nrequired\nto\nimplement\nthe\norganization's\ncontinuous improvement systems and processes. Particular\nemphasis is on using systems and strategies to actively\nencourage the team to participate in the process, monitoring\nand reviewing performance, and identifying opportunities for\nfurther improvements\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Implement\ncontinuous\nimprovement\nsystems and\nprocesses\n1.1 Implement systems to ensure that individuals and\nteams are actively encouraged and supported to\nparticipate in decision making processes, assume\nresponsibility and exercise initiative\n1.2\nCommunicate\nthe\norganization's\ncontinuous\nimprovement processes to individuals and teams,\nand obtain feedback\n1.3 Ensure effective mentoring and coaching allows\nindividuals and teams to implement the organization's\ncontinuous improvement processes\n2. Monitor and review\nperformance\n2.1.\nUse the organization's systems and technology to\nmonitor and review progress and to identify ways in\nwhich planning and operations could be improved\n2.2.\nImprove customer service through continuous\nimprovement techniques and processes\n2.3.\nFormulate and communicate recommendations for\nadjustments to those who have a role in their\ndevelopment and implementation\n3. Provide\nopportunities for\nfurther improvement\n3.1.\nImplement\nprocesses\nto\nensure\nthat\nteam\nmembers\nare\ninformed\nof\nsavings\nand\nproductivity/service improvements in achieving the\nbusiness plan\n3.2.\nDocument work performance to aid the identification\nof further opportunities for improvement\n3.3.\nManage records, reports and recommendations for\nimprovement within the organization's systems and\nprocesses\n\n--- PDF PAGE 117 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n115\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Systems\nMay refer to:\n1.1.\nForums, meetings\n1.2.\nNewsletters and reports\n1.3.\nOrganizational policies and procedures\n1.4.\nWeb-based communication devices\n2. Participation in\ndecision making\nprocesses\nMay include:\n2.1.\nFeedback in relation to outcomes of the consultative\nprocess\n2.2.\nProcesses which ensures all employees have the\nopportunity to contribute to organizational issues\n3. Continuous\nimprovement\nprocesses\nMay include:\n3.1.\nCyclical audits and reviews of workplace, team and\nindividual performance\n3.2.\nEvaluations and monitoring of effectiveness\n3.3.\nImplementation of quality systems, such as\nInternational Standardization for Organization (ISO)\n3.4.\nModifications and improvements to systems,\nprocesses, services and products\n3.5.\nPolicies and procedures which allow the organization\nto systematically review and improve the quality of its\nproducts, services and procedures\n3.6.\nSeeking and considering feedback from a range of\nstakeholders\n4. Mentoring and\ncoaching\nMay refer to:\n4.1.\nProviding assistance with problem-solving\n4.2.\nProviding feedback, support and encouragement\n4.3.\nTeaching another member of the team, usually\nfocusing on a specific work task or skill\n5. Technology\nMay include:\n5.1.\nComputerized systems and software such as\ndatabases, project management and word processing\n5.2.\nTelecommunications devices\n5.3.\nany other technology used to carry out work roles and\nresponsibilities\n6. Customer service\nMay include:\n6.1.\nInternal or external\n6.2.\nto existing, new or potential clients\n7. Processes to\nensure that team\nmembers are\ninformed of savings\nand\nproductivity/service\nimprovements\nMay refer to:\n7.1.\nEmail/intranet, newsletters or other communication\ndevices\n7.2.\nNewsletters and bulletins\n7.3.\nStaff reward mechanisms\n7.4.\nTeam meetings\n\n--- PDF PAGE 118 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n116\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Took active steps to implement, monitor and adjust\nplans, processes and procedures to improve\nperformance\n1.2 Supported others to implement the continuous\nimprovement system/processes, and to identify and\nreport opportunities for further improvement\n1.3 Knowledge of principles and techniques associated with\ncontinuous improvement systems and processes\n2. Required knowledge\nPrinciples and techniques associated with:\n2.1 benchmarking\n2.2 best practice\n2.3 change management\n2.4 continuous improvement systems and processes\n2.5 quality systems\n2.6 Quality procedures, e.g., 5S\n2.7 Environmental-conservation procedures,\ne.g., 3R (reduce, reuse, recycle)\n3 Required Skills\nCommunication skills to:\n3.1 . Coach and mentor team members\n3.2\nGain the commitment of individuals and teams to\ncontinuously improve\n3.3\nInnovation skills to design better ways of performing\nwork\n4 Resource\nImplications\n\nThe following resources should be provided:\n4.1.\nAccess to an automotive business which includes\nwaste materials of various types, recycling bins,\nliquid, sludge and solid wastes\n4.2.\nResources may include pressure washing and\nfacilities for the use of recycled water\n5 Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6 Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 119 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n117\n\nUNIT OF COMPETENCY : MANAGE PEOPLE PERFORMANCE\nUNIT CODE : ALT311370\nUNIT DESCRIPTOR : This unit applies to all managers and team leaders who\nmanage people. It covers work allocation and the\nmethods to review performance, reward excellence and\nprovide feedback where there is a need for improvement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Allocate work\n1.1 Consult relevant groups and individuals on work to be\nallocated and resources available.\n1.2 Develop work plans in accordance with operational\nplans.\n1.3 Allocate work in a way that is efficient, cost effective\nand outcome focused.\n1.4 Confirm performance standards, Code of Conduct\nand work outputs with relevant teams and individuals.\n1.5 Develop and agree performance indicators with\nrelevant staff prior to commencement of work.\n1.6 Conduct risk analysis in accordance with the\norganizational risk management plan and legal\nrequirements.\n2. Assess performance\n2.1. Design\nperformance\nmanagement\nand\nreview\nprocesses to ensure consistency with organizational\nobjectives and policies\n2.2. Train participants in the performance management and\nreview process\n2.3. Conduct performance management in accordance with\norganizational protocols and time lines\n2.4. Monitor and evaluate performance on a continuous\nbasis\n3.\nProvide feedback\n3.1. Provide informal feedback to staff on a regular basis\n3.2. Advise\nrelevant\npeople\nwhere\nthere\nis\npoor\nperformance and take necessary actions\n3.3. Provide on-the-job coaching when necessary to\nimprove performance and to confirm excellence in\nperformance\n3.4. Document performance in accordance with the\norganizational performance management system\n3.5. Conduct formal structured feedback sessions as\nnecessary and in accordance with organizational policy\n4.\nManage follow up\n4.1. Write and agree performance improvement and\ndevelopment plans in accordance with organizational\npolicies\n4.2. Seek assistance from human resources specialists\nwhere appropriate\n4.3. Reinforce\nexcellence\nin\nperformance\nthrough\nrecognition and continuous feedback\n4.4. Monitor and coach individuals with poor performance\n4.5. Provide support services where necessary\n4.6. Counsel individuals who continue to perform below\nexpectations and implement the disciplinary process if\nnecessary\n4.7. Terminate staff in accordance with legal and\norganizational requirements where serious misconduct\noccurs or ongoing poor-performance continues\n\n--- PDF PAGE 120 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n118\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Performance\nstandards\nMay include:\n1.1.\nLevel of performance sought from an individual or\ngroup which may be expressed either quantitatively\nor qualitatively\n2. Code of Conduct\nMay include:\n2.1.\nAgreed (or decreed) set of rules relating to employee\nbehavior / conduct with other employees or an agreed\n(or decreed) set of rules relating to employee\nbehavior\n/\nconduct\nwith\nother\nemployees\nor\ncustomers\n3. Performance\nindicators\nMay include:\n3.1.\nMeasures against which performance outcomes are\ngauged\n4. Risk analysis\nMay include:\n4.1.\nDetermination of the likelihood of a negative event\npreventing the organization meeting its objectives and\nthe likely consequences of such an event on\norganizational performance\n5. Performance\nmanagement\nMay include:\n5.1.\nIn accordance with relevant industrial agreements\n5.2.\nProcess or set of processes for establishing a shared\nunderstanding of what an individual or group is to\nachieve, and managing and developing individuals in\na way which increases the probability it will be\nachieved in both the short- and long-term\n6. Excellence in\nperformance\nMay include:\n6.1.\nRegularly\nand\nconsistently\nexceeding\nthe\nperformance targets established while meeting the\norganization's performance standards\n7. Termination\nMay include:\n7.1.\nCessation of the contract of employment between an\nemployer and an employee, at the initiative of the\nemployer within relevant industrial agreements\n\n--- PDF PAGE 121 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n119\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Documented performance indicators and a critical\ndescription and analysis of performance management\nsystem from the workplace\n1.2 Demonstrated techniques in providing feedback and\ncoaching for improvement in performance\n1.3 Demonstrated knowledge of relevant awards and\ncertified agreements\n2. Required knowledge\n2.1. Relevant legislation from all levels of government that\naffects business operation, especially in regard to\noccupational health and safety and environmental\nissues, equal opportunity, industrial relations and anti-\ndiscrimination\n2.2. Relevant awards and certified agreements\n2.3. Performance measurement systems utilised within the\norganisation\n2.4. Unlawful dismissal rules and due process\n2.5. Staff development options and information\n2.6. Quality procedures, e.g., 5S\n2.7. Environmental-conservation procedures, e.g., 3R\n(reduce, reuse, recycle)\n3. Required Skills\n3.1. Communication skills to articulate expected standards\nof performance, to provide effective feedback and to\ncoach staff who need development\n3.2. Risk management skills to analyze, identify and\ndevelop mitigation strategies for identified risks\n3.3. Planning and organization skills to ensure a planned\nand objective approach to the performance\nmanagement system.\n4. Resource\nImplications\n\nThe following resources should be provided:\n• Access to appropriate documentation and resources\nnormally used in the workplace e following resources\nmust be provided:\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1. Portfolio Assessment\n5.2. Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1. Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 122 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n120\n\nUNIT OFMPETENCY : PLAN AND MANAGE COMPLIANCE WITH\nENVIRONMENTAL REGULATIONS IN A WORKPLACE\nOR BUSINESS\nUNIT CODE : ALT311371\nUNIT DESCRIPTOR : This unit of competency covers the competence to plan and\nimplement management system that ensures the protection\nof the environment in a workplace or business.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and manage\ncompliance with\nenvironmental\nregulations\n1.1 Reasons for ethical environmental practice in a\nworkplace or business are identified\n1.2\nEnvironmental\nresponsibilities\nof\nemployers\nand\nemployees in an automotive workplace or business\nare identified\n1.3 Penalties for enterprise and individual breaches of the\nlegislation are identified\n1.4\nWaste products are minimized and facilities provided\nfor waste materials to be stored in bins for recycling or\ndisposal\n1.5\nCollection\nand\nrecycling\narrangements\nare\nimplemented for liquids, sludge, solids and other waste\n1.6\nSuppliers with minimal excess packaging on goods\nreceived are sourced and packaging on goods received\nis sorted and disposed of appropriately\n1.7\nWaste and energy conservation strategies are\nidentified and implemented\n2\nManage potential\nhazards to storm\nwater system to\navoid\ncontamination\n2.1. Systems are in place to ensure wastewater does not\nenter the storm water system\n2.2. All drains and flows are identified on a worksite map\ndirectly indicating where they flow\n2.3. Trade waste permits are in place\n2.4. Undercover and drained areas are provided and used\nfor\nthe\nstorage\nof\nall\nmaterials\ncontaining\nenvironmentally hazardous substances\n2.5. Proper tools and equipment are provided and used to\nprevent storm water contamination\n2.6. Workplace is kept clean to prevent unintentional storm\nwater pollution\n\n--- PDF PAGE 123 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n121\n\n3\nManage potential\nhazards to air\nquality to avoid\ncontamination\n3.1.\nHazards of airborne particles are identified, minimized\nand contained\n3.2.\nHazards of gases and fumes are identified, minimized\nand contained\n3.3.\nA well-ventilated area is provided for any welding\nactivities\n4\nMinimization of\nnoise hazards is\nplanned and\nmanaged\n4.1.\nNoise creating activities are minimized and carried\nout within approved operating hours\n4.2.\nFixed machinery is fitted with silencers or surrounded\nby noise containment material\n5\nManagement\nsystems\n5.1.\nAn environmental policy and contingency plan\nsuitable to the needs of the business is developed\nand implemented\n5.2.\nWaste to landfill is calculated and possible savings\nthrough reuse and recycling are calculated\n5.3.\nPayback period on environmental equipment is\ncalculated\n5.4.\nManage\nstaff\nadherence\nto\nenvironmental\nresponsibilities\n5.5.\nEnvironmental documents are maintained and\nstored securely in a form accessible for reporting\nprocedures\n\n--- PDF PAGE 124 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n122\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Automotive business\nMay include:\nAny automotive business excluding body repair, marine and\nmechanical involving the removal of components containing\noils or other fluids\n2. Waste and energy\nconservation\nstrategies\nMay include:\n2.1. Utilities consumption reduction program\n2.2. Waste reduction program\n2.3.\nEffective waste disposal program\n3. Systems\nSystem is carried out in accordance with:\n3.1\nOHS legislation, material safety data sheets (MSDS),\nhazardous substances and dangerous goods code\nand local safe operating procedures\n3.2\n Legislative\nobligations, environmental legislation,\nhealth regulations, and manual handling procedures\nand organization insurance requirements\n4. Tools and equipment\nMay include:\n4.1\nSpill kits\n4.2\nRecycling bins\n4.3\nDrums\n5. Environmental\ndocuments\nMay include:\n5.1 Environmental legislation, regulations and advice\n5.2 Workplace procedures relating to the use of tools and\nequipment\n5.3 Work instructions and procedures\n5.4 Worksite environmental policy\n5.5 Workplace procedures relating to reporting and\ncommunication\n5.6 Manufacturer/component supplier specifications and\noperational procedures\n5.7 Local council and waterways regulations\n5.8 Environmental documents, manufacturer/component\nsupplier specifications, costing of equipment and waste\nremoval\n5.9 Staff environmental induction material\n\n--- PDF PAGE 125 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n123\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Planned and managed safe handling requirements for\n equipment, products and materials, including use of\n personal protective equipment\n1.2 Planned and mange environmental protection\n procedures\n1.3 Identified materials used in the business and assess\nand manage their environmental impact\n1.4 Planned and managed work instructions, operating\nprocedures and inspection processes to:\n1.5 Minimized the risk of injury to self or others\n1.6 Maintained a clean workplace\n1.7 Prevented damage and wastage of goods, equipment\nand products\n1.8 Disposed of waste in accordance with legislative\nrequirements and best practice\n1.9 Maintained production output, and product and service\nquality\n1.10 Reported environmental damage or spills\n1.11 Planned and managed operator maintenance on\nequipment to ensure environmental efficiency\n1.12 Managed effective planning and teamwork related to\nenvironmental best practice\n1.13 Developed / implemented or audited an existing\nbusiness environmental policy which covers at a\nminimum: waste, recycling, hazards to storm water,\nair quality, noise, energy minimization and costs\n1.14 Modified activities to cater for variations in workplace\ncontext and environment.\n2 Required knowledge\n2.1\nAspects\nof\nenvironmental\nlegislation\nand\nits\nrelationship with occupational health and safety\n(OHS), finance and risk management\n2.2\nRequirements for trade waste permits\n2.3\nSpill clean-up procedures\n2.4\nCharacteristics and potential environmental impact of\nproducts used in the business\n2.5\nPhilosophy of sustainability through prevention, reuse,\nreduce and recycle\n2.6\nProcedures for rectifying machinery faults and material\ndefects\n2.7\nActions to be taken in case of environmental threat in\nthe workplace\n2.8\nReporting procedures for environmental damage\noccurring in the workplace\n2.9\nCleaner production and eco-efficient strategies to\navoid the production of waste\n2.10 Quality procedures, e.g., 5S\n2.11 Environmental-conservation procedures,\ne.g., 3R (reduce, reuse, recycle)\n\n--- PDF PAGE 126 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n124\n3\nRequired Skills\n3.1 Collect, organize and understand information related to\nenvironmental procedures from legislation, regulations,\npolicies, guidelines, standards and workplace best\npractices in an automotive business\n3.2 Communicate ideas and information to ensure all work\nundertaken is in accordance with environmental best\npractice, support from stakeholders is actively sought\nfor implementing suitable innovation and continuous\nimprovement\n3.3 Plan and organize activities including the preparation of\nequipment and materials recycling and waste\nmanagement systems and the selection of worksite to\navoid environmental contamination, back tracking,\nworkflow interruptions or wastage\n3.4 Promote work with others and in a team by recognizing\ndependencies and using cooperative approaches to\nminimize wastage, optimize workflow and productivity\n3.5 Use mathematical ideas and techniques to complete\nmeasurements and estimate material requirements\nrequired for the work and calculate wastage rates of\nvarious methods\n3.6 Use planning, checking and inspection techniques to\navoid environmental contamination and wastage\n3.7 Use the workplace technology related to environmental\nprotection and recycling equipment\n4\nResource\nImplications\n\nThe following resources should be provided:\n4.1 Access to an automotive business which includes waste\nmaterials of various types, recycling bins, liquid, sludge\nand solid wastes\n4.2 Resources may include pressure washing and facilities\nfor the use of recycled water\n5\nMethods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6\nContext for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 127 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n125"
