ation \nof further opportunities for improvement \n3.3. \nManage records, reports and recommendations for \nimprovement within the organization's systems and \nprocesses\n\n--- PDF PAGE 117 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n115\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Systems \nMay refer to: \n1.1. \nForums, meetings \n1.2. \nNewsletters and reports \n1.3. \nOrganizational policies and procedures \n1.4.\nWeb-based communication devices\n2. Participation in \ndecision making \nprocesses \nMay include: \n2.1. \nFeedback in relation to outcomes of the consultative \nprocess \n2.2. \nProcesses which ensures all employees have the \nopportunity to contribute to organizational issues\n3. Continuous \nimprovement \nprocesses \nMay include: \n3.1. \nCyclical audits and reviews of workplace, team and \nindividual performance \n3.2. \nEvaluations and monitoring of effectiveness \n3.3. \nImplementation of quality systems, such as \nInternational Standardization for Organization (ISO) \n3.4. \nModifications and improvements to systems, \nprocesses, services and products \n3.5. \nPolicies and procedures which allow the organization \nto systematically review and improve the quality of its \nproducts, services and procedures \n3.6. \nSeeking and considering feedback from a range of \nstakeholders\n4. Mentoring and \ncoaching \nMay refer to: \n4.1. \nProviding assistance with problem-solving \n4.2. \nProviding feedback, support and encouragement \n4.3. \nTeaching another member of the team, usually \nfocusing on a specific work task or skill\n5. Technology \nMay include: \n5.1. \nComputerized systems and software such as \ndatabases, project management and word processing \n5.2. \nTelecommunications devices  \n5.3. \nany other technology used to carry out work roles and \nresponsibilities\n6. Customer service \nMay include: \n6.1. \nInternal or external \n6.2.\nto existing, new or potential clients\n7. Processes to \nensure that team \nmembers are \ninformed of savings \nand \nproductivity/service \nimprovements\nMay refer to: \n7.1. \nEmail/intranet, newsletters or other communication \ndevices \n7.2. \nNewsletters and bulletins \n7.3. \nStaff reward mechanisms \n7.4. \nTeam meetings\n\n--- PDF PAGE 118 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n116\n   EVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Took active steps to implement, monitor and adjust \nplans, processes and procedures to improve \nperformance \n1.2 Supported others to implement the continuous  \nimprovement system/processes, and to identify and \nreport opportunities for further improvement \n1.3 Knowledge of principles and techniques associated with \ncontinuous improvement systems and processes \n2. Required knowledge  \nPrinciples and techniques associated with: \n2.1 benchmarking \n2.2 best practice \n2.3 change management \n2.4 continuous improvement systems and processes \n2.5 quality systems \n2.6 Quality procedures, e.g., 5S \n2.7 Environmental-conservation procedures,  \ne.g., 3R (reduce, reuse, recycle)\n3 Required Skills \nCommunication skills to: \n3.1 .   Coach and mentor team members \n3.2 \nGain the commitment of individuals and teams to \ncontinuously improve \n3.3 \nInnovation skills to design better ways of performing \nwork\n4 Resource \nImplications \n \nThe following resources should be provided: \n4.1. \nAccess to an automotive business which includes \nwaste materials of various types, recycling bins, \nliquid, sludge and solid wastes \n4.2. \nResources may include pressure washing and \nfacilities for the use of recycled water\n5 Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1    Portfolio Assessment  \n5.2    Interview \n5.3   Case Study/Situation\n6 Context for \nAssessment \n6.1  Competency may be assessed in the work place or in a \nsimulated work place setting\n",
