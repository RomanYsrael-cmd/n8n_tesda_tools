        "source_title": "SERVICE ELECTRONIC DRIVE MANAGEMENT SYSTEMS",
        "source_text": "--- PDF PAGE 76 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n74\nUNIT OF COMPETENCY :     SERVICE ELECTRONIC DRIVE MANAGEMENT   \n                                                  SYSTEMS  \n \nUNIT CODE \n: \nALT 723326 \n \nUNIT DESCRIPTOR \n: \nThis unit identifies the competence required to \n \nservice drive management systems and/or associated \ncomponents. Electronic drive management systems \ninclude: electrical/electronic components/systems \nfound in automatic transmissions and/or 4WD \ndriveline such as automatic free- wheeling hubs, \ndifferential and axle locks. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n(All standard of performance for Service and Repair Electronic Drive \nManagement Systems is in accordance with company standard \noperating procedure and manufacturer’s specification Manuals using \nspecified tools and equipment)\n1. Service electronic \ndrive  Management \nsystems and/or        \nassociated        \ncomponents  \n1.1 Service is performed without causing damage to any \nworkplace property or vehicle.  \n1.2 Correct information is accessed and interpreted from \nappropriate manufacturer specifications.  \n1.3 Tests on electronic drive management systems are \ncarried out to determine faults   \n1.4 Necessary service and component \nreplacement/adjustments are carried out  \n2. Conduct air \nsuspension system \nbalance adjustment \n2.1 Air suspension balance is adjusted   \n2.2 Cause of unbalanced air suspension is identified and \nremedied\n\n--- PDF PAGE 77 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n75\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Electronic Drive \nManagement \nSystems \nMay include: \n1.1 Light vehicles and/or plant and equipment and/or \nheavy vehicles and/or outdoor power equipment \n1.2 Electronic drive management systems include \nelectronic controls of automatic transmissions. The \nelectronic components of driveline control systems \n(e.g., traction control, auto transmission)  \n1.3 4WD applications such as automatic free wheeling \nhubs, differential and axle locks\n2.  Manuals \nMay include: \n2.1 Manufacturer’s specification manual  \n2.2 Preventive maintenance procedure manual  \n2.3 Preventive maintenance data  \n2.4 Service and repair manual  \n2.5\nParts checklist\n3.  Company standard \noperating procedure \nMay include: \n3.1 Job order  \n3.2 Requisition slip  \n3.3 Wearing of Personal Protective Equipment such as: \nApron, Safety shoes, Gloves, Goggles\n4.  Tools and equipment \nMay include: \n4.1 Hand tools, vehicle lifting equipment, testing \nequipment including multimeter   \n4.2 Power tools, air tools, special tools for \nremoval/adjustment  \n4.3\nSpecialized system testers\n5.  OHS requirements  \nMay include: \n5.1 Industry Safety and Health in Handling Electronic \nDevices including their disposal\n\n--- PDF PAGE 78 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n76\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate  \n1.1 Tested electronic drive management systems and \nidentified faults  \n1.2 Serviced/repaired electronic drive management \nsystems  \n1.3 Conducted air suspension system balance \nadjustment\n2. Required knowledge  \n2.1 Service/repair, removal, replacement and adjustment \nprocedures  \n2.2 Occupational Health and Safety (OH&S) legislation  \n2.3 Testing/adjusting procedures  \n2.4 Construction and operation of drive management \nsystems/components relevant to application  \n2.5 Personal safety requirements  \n2.6 Vehicle/equipment safety requirements  \n2.7 Positive Work Values (Patience, Perseverance, \nHonesty, etc.) \n2.8 Quality procedures, e.g., 5S \n2.9 Environmental-conservation procedures,  \ne.g., 3R (reduce, reuse, recycle)\n3. Required skills \n3.1 Testing electronic circuits and devices  \n3.2 Reading/Interpreting schematic diagram  \n3.3 Removing/Installing electronic devices  \n3.4 Using mathematical ideas and techniques  \n3.5 Solving problems  \n3.6\nUsing technology\n4. Resource           \nimplications \nThe following resources should be provided:  \n4.1 Workplace and simulator  \n4.2 Appropriate tools and equipment   \n4.3\nMaterials relevant tot he proposed activity and tasks\n5. Method of \nassessment \nCompetency in this unit may be assessed through:  \n5.1 Written examination   \n5.2\nObservation/Demonstration with Questioning \n6. Context of \nassessment \n6.1 Competency must be assessed on the job or \nsimulated environment.  \n6.2 The assessment of practical skills must take place \nafter a period of supervised practice and repetitive \nexperience.\n",
