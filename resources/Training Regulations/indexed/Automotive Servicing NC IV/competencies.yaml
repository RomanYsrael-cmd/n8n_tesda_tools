            "number": 1,
            "title": "Identify space",
            "performance_criteria": [
              {
                "number": "1.1",
                "text": "The medium-term and long-term storage needs of the organization are assessed to facilitate planning in accordance with the business plan of the enterprise"
              },
              {
                "number": "1.2",
                "text": "Product type, picking frequencies, value, fragility, weight, handling characteristics, quantity and holding periods are assessed to consider type and amount of storage"
              },
              {
                "number": "1.3",
                "text": "Facility is assessed to determine the stock holding and handling requirements for each inventory item"
              },
              {
                "number": "1.4",
                "text": "Volume requirements are calculated to ensure that ongoing stock holding needs are met"
              },
              {
                "number": "1.5",
                "text": "The total space requirement is calculated and used to formulate plan for space utilization 2 Identify safety and security requirements 2.1 An assessment is made of risks to ensure maximum safety and security for personnel, stock and facilities 2.2 Storage handling security and incident/emergency procedures for each class or type of product are identified and documented 2.3 Fire prevention and firefighting systems are identified in accordance with building code regulations and storage material requirements 2.4 An evacuation plan is developed in accordance with the safety program of the enterprise 3 Develop documentation system 3.1 An inventory system for recording and tracing stock location, receiving, throughput and dispatch is developed and implemented to enable reporting, quality assurance and financial requirements to be met 3.2 A system for recording communication with carriers, customers and employees is developed and implemented to assess operational effectiveness and to provide data for system improvement. --- PDF PAGE 104 --- Automotive Servicing NC IV (Amended) Promulgated December 2013 102 4 Design storage zones 4.1 Space requirements and equipment operation are accurately assessed to facilitate the planning of warehouse zones 4.2 An assessment is made of the facility to enable the most effective use of available space 4.3 Positioning of storage areas, bays, work stations and the like is undertaken in accordance with data obtained from the planning process 4.4 Provision for maintenance and cleaning is catered for 5 Evaluate facility utilization 5.1 A continual system of review is used involving regular checks to ensure storage areas and systems are functioning at optimum levels 5.2 Receiving and dispatch systems provide efficient operations 5.3 Storage and handling systems provide ease of access and comply with ergonomic principles 5.4 Product handling and storage minimizes product damage, contamination and stock losses 5.5 Facility layout remains sufficiently flexible to meet changing storage and handling requirements 5.6 Appropriate reporting systems are established and used to maintain data for the design of improved facilities and systems --- PDF PAGE 105 --- Automotive Servicing NC IV (Amended) Promulgated December 2013 103 RANGE OF VARIABLES VARIABLE RANGE"
