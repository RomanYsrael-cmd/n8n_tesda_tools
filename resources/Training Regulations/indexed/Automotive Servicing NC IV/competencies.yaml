  "source_section_text": "SECTION 1 AUTOMOTIVE SERVICING NC IV QUALIFICATION\n\nThe AUTOMOTIVE SERVICING NC IV Qualification consists of competencies\nthat a person must achieve to lead a section or group of workers to service and\nrepair various types of motor vehicles. He is a master technician who can service\nand repair electronically controlled components or devices and emission control\nsystem of a motor vehicle. He can is also service both diesel and gasoline engines.\n\nThis Qualification is packaged from the competency map of the Automotive\nIndustry (Service sector) as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following\n\nCODE NO.\nBASIC COMPETENCIES\n500311115\nUtilize specialized communication skills\n500311116\nDevelop teams and individuals\n500311117\nApply problem solving techniques in the workplace\n500311118\nCollect, analyze and organize information\n500311119\nPlan and organize work\n500311120\nPromote environmental protection\n\nCODE NO.\nCOMMON COMPETENCIES\nALT723201\nApply Appropriate Sealant/Adhesive\nALT723202\nMove and Position Vehicle\nALT311202\nPerform Mensuration and Calculation\nALT723203\nRead, Interpret and Apply Specifications and Manuals\nALT723204\nUse and Apply Lubricants/Coolants\nALT723205\nPerform Shop Maintenance\nALT311204\nPerform Job Estimate\nALT311205\nInterpret/Draw Technical Drawing\nALT723206\nPractice health, safety and environment procedures\nALT311207\nInspect technical quality of work\nALT311208\nMaintain quality systems\nALT311209\nProvide work skill instructions\nALT723210\nIdentify and select original automotive parts and products\n\n--- PDF PAGE 4 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n2\n\nCODE NO.\nCORE COMPETENCIES\nALT 723323\nService Diesel Engine Management System\nALT 723324\nService Electronic Body Management System\nALT 723325\nService Diesel Fuel Injection System Components\nALT 723326\nService Electronic Drive Management System\nALT 723327\nService Emission Control System\nALT 723362\nService and repair electronically controlled anti-lock braking system\nALT 723363\nService and repair electronically operated traction control System\nALT 723364\nService and repair electronically operated stability control System\nALT311365\nPlan assessment activities and processes\nALT311366\nManage facility and inventory requirements\nALT311367\nEstimate complex jobs\nALT311368\nEnsure a safe workplace\nALT311369\nImplement continuous improvement\nALT311370\nManage people performance\nALT311371\nPlan and manage compliance with environmental regulations in a\nworkplace or business\n\nA person who has achieved this Qualification is competent to be:\n Supervisor, Automotive Service Shop\n Master Automotive Technician\n Service Analyst\n\n--- PDF PAGE 5 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n3"
}
