          "source_text": "1. Identify space \nrequirements \n1.1 The medium-term and long-term storage needs of the \norganization are assessed to facilitate planning in \naccordance with the business plan of the enterprise  \n1.2 Product type, picking frequencies, value, fragility, weight, \nhandling characteristics, quantity and holding periods \nare assessed to consider type and amount of storage \n1.3 Facility is assessed to determine the stock holding and \nhandling requirements for each inventory item \n1.4 Volume requirements are calculated to ensure that \nongoing stock holding needs are met \n1.5 The total space requirement is calculated and used to \nformulate plan for space utilization \n2 \nIdentify safety and \nsecurity \nrequirements \n2.1 \nAn assessment is made of risks to ensure maximum \nsafety and security for personnel, stock and facilities \n2.2 \nStorage handling security and incident/emergency \nprocedures for each class or type of product are \nidentified and documented \n2.3 \nFire prevention and firefighting systems are identified \nin accordance with building code regulations and \nstorage material requirements \n2.4 \nAn evacuation plan is developed in accordance with \nthe safety program of the enterprise\n3 \nDevelop \ndocumentation \nsystem \n3.1 \nAn inventory system for recording and tracing stock \nlocation, receiving, throughput and dispatch is \ndeveloped and implemented to enable reporting, \nquality assurance and financial requirements to be \nmet \n3.2 \nA system for recording communication with carriers, \ncustomers \nand \nemployees \nis \ndeveloped \nand \nimplemented to assess operational effectiveness and \nto provide data for system improvement.\n\n--- PDF PAGE 104 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n102\n \n4 \nDesign storage \nzones \n4.1 \nSpace requirements and equipment operation are \naccurately assessed to facilitate the planning of \nwarehouse zones \n4.2 \nAn assessment is made of the facility to enable the \nmost effective use of available space \n4.3 \nPositioning of storage areas, bays, work stations and \nthe like is undertaken in accordance with data \nobtained from the planning process \n4.4\nProvision for maintenance and cleaning is catered for\n5 \nEvaluate facility \nutilization \n5.1 \nA continual system of review is used involving regular \nchecks to ensure storage areas and systems are \nfunctioning at optimum levels \n5.2 \nReceiving and dispatch systems provide efficient \noperations \n5.3 \nStorage and handling systems provide ease of \naccess and comply with ergonomic principles \n5.4 \nProduct handling and storage minimizes product \ndamage, contamination and stock losses \n5.5 \nFacility layout remains sufficiently flexible to meet \nchanging storage and handling requirements \n5.6 \nAppropriate reporting systems are established and \nused to maintain data for the design of improved \nfacilities and systems\n\n--- PDF PAGE 105 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n103\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Type and amount of \nstorage \nMay include: \n1.1. \nFast moving  item \n1.2. \nSlow moving item \n1.3. \nAmount in terms of number or quantity \n1.4. \nAmount in terms of standard number of packaging \n(SNP) \n2. Handling \nrequirements \nMay include: \n \n2.1. \nHand pallet truck \n2.2. \nForklift \n2.3. \nPallets  \n2.4. \nTote bins \n3. Space utilization  \nMay involve: \n3.1. \nTwenty four hour operation \n3.2. \nSingle and multi-site location \n3.3. \nLarge, medium and small companies \n3.4. \nHorizontal and or vertical space utilization \n \n4. Storage handling \nprocedures  \nMay include: \n4.1. \nStandard operating procedures (SOPs) \n4.2. \nCompany procedures \n4.3. \nOrganizational procedures \n4.4. \nEstablished procedures \n5. Planning process \nMay include: \n5.1. \nMaterial requirement planning (MRP) \n5.2. \nEconomic ordering quantity (EOQ) \n5.3. \nJust in time delivery system (JIT)\n\n--- PDF PAGE 106 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n104\n6. Communication in \nthe work area  \nMay include: \n6.1  Phone \n6.2  Electronic data interchange (EDI) \n6.3  Fax \n6.4  E-mail \n6.5  Internet \n6.6  RF systems \n6.7  Oral, aural or signed communications \n7. Appropriate \nreporting system  \nMay involve: \n7.1. \nOther employees and supervisors \n7.2. \nRelevant authorities and institutions \n7.3. \nManagement and union representatives \n7.4. \nIndustrial relations and OH&S specialists \n7.5. \nCustomers and suppliers \n7.6. \nOther professional or technical staff, contractors and \nmaintenance personnel\n\n--- PDF PAGE 107 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n105"
