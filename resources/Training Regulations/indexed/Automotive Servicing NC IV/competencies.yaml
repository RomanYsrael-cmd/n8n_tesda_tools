ulic Fluid\n\n2.7 Radiator Coolant\n•\nLong last coolant\n\n2.8 A/C Compressor Oil\n•\nPag oil\n3. Lubricant\n Schedule\nMay include:\n3.1 Kilometers traveled/used\n3.2 No. of Hours used\n3.3 Monthly\n4. Tool and\n equipment\nMay include:\n4.1 Hand tools\n4.2 Oiler\n4.3 Oil Dispenser\n4.4 Grease gun\n5. Personal\nProtective\nEquipment (PPE)\n\nMay include:\n5.1 Apron\n5.2 Gloves\n5.3 Goggles\n5.4 Safety shoes\n\n--- PDF PAGE 38 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n36\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified types of lubricants and lubrication schedule.\n1.2 Used and applied lubricants.\n1.3 Performed housekeeping\n\n2. Required\nknowledge\n2.1 Types/Classification of Lubricants\n2.2 Identifying lubrication schedule\n2.3 Cause and Effects of Gear Oil Dilution\n2.4 Purpose of Lubrication (Problem and effects)\n2.5 Hazard associated with lubrication\n\n3. Required skills\n3.1 Handling of oils (Gear, oil, engine oil)\n3.2 Familiarization/Classification of Lubricants\n3.3 Lubrication Procedure\n\n4. Resource\nimplication\n\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Materials relevant to activity\n\n5. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n5.1 Demonstration with questioning\n5.2 Written/Oral examination\n\n6. Context of\nassessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment must be undertaken in accordance with the\n endorsed industry assessment guidelines\n6.3 Assessment of underpinning knowledge and skills may be\n assessed on or off-the-job\n\n--- PDF PAGE 39 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n37\nUNIT OF COMPETENCY: PERFORM SHOP MAINTENANCE\n\nUNIT CODE:"
