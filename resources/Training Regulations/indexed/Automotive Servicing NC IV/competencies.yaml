        "source_title": "SERVICE DIESEL FUEL INJECTION SYSTEM/COMPONENTS",
        "source_text": "--- PDF PAGE 73 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n71\nUNIT OF COMPETENCY : \nSERVICE DIESEL FUEL INJECTION \nSYSTEM/COMPONENTS \n \nUNIT CODE \n: \nALT 723325 \n \nUNIT DESCRIPTOR \n: \nThis unit identifies the competence required in \nservicing  \ndiesel fuel injection system and components. It also \nincludes the ability to overhaul rotary injection pump, \nsetting of injection pump and pneumatic governor and \ntesting injection pump. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n(NOTE: All standard of performance for Servicing Diesel Fuel Injection \nSystem/Components is in accordance with company standard  \noperating procedure and manufacturer’s specification manuals using \nspecified tools and equipment)\n1.  Overhaul rotary        \ninjection pump  \n1.1 Rotary injection pump is disassembled   \n1.2 No error in conducting failure analysis of injection \npump  \n1.3 Corresponding recommendation is given based on the  \nanalysis  \n1.4 Injection pump parts is double checked for \ncompleteness, reference marks and torque  \n1.5 Rotary injection pump is assembled  \n2. Set rotary injection \npump governor \n2.1 Completeness of rotary injection governor parts and \nreference mark position is checked   \n2.2 No error in identifying rotary injection pump governor \nsetting  \n2.3\nInjection governor is adjusted \n3. Set pneumatic \ngovernor  \n3.1 Completeness of pneumatic governor parts is \nchecked.  \n3.2 No leak in the vacuum chamber  \n3.3 Initial setting is adjusted  \n4.  Check injection \nautomatic timing \nadvance\n4.1 Injection timing advance is read and verified  \n4.2 Injection timing advance checking device/tester is \ninstalled \n5. Test injection        \npump  \n5.1 Governor setting determined accurately  \n5.2 Injection pump governor is adjusted   \n5.3\nDamage governor parts is replaced \n 6. Overhaul feed        \npump  \n6.1 Feed pump is disassembled  \n6.2 No error in conducting failure analysis of feed pump  \n6.3 Corresponding recommendation is given based on the \nanalysis  \n6.4 Feed pump parts double checked for completeness, \nreference mark, position and torque  \n6.5\nFeed pump is assembled\n\n--- PDF PAGE 74 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n72\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Injection Pump        \nGovernor \nMay include: \n1.1 Unit injector governor  \n1.2 Rotary injection pump  \n1.3 Pneumatic governor  \n1.4 Common rail mechanical governor  \n1.5\nHydraulic governor\n2.  Manual \nMay include: \n2.1 Manufacturer specification manual  \n2.2 Maintenance procedure manual  \n2.3 Periodic maintenance manual  \n2.4 Service manual  \n2.5\nParts Checklist\n3. Tools and      \nequipment  \nMay include: \nCommon and special service hand tools \n4. Company standard \noperating procedure \nMay include: \n4.1 Job order  \n4.2 Requisition slip  \n4.3 Wearing of personal protective equipment such as \nApron, gloves, gas mask, goggles\n\n--- PDF PAGE 75 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n73\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate:  \n1.1 Overhauled rotary injection pump  \n1.2 Set rotary injection pump governor  \n1.3 Set pneumatic governor  \n1.4 Checked injection automatic timing advance  \n1.5\nTested injection pump\n2. Required knowledge  \n2.1 Unit injector parts, function and operation and \nadjusting procedure  \n2.2 Rotary injection pump governor parts, function and \noperation  \n2.3 Precaution in setting injection pump governor  \n2.4 Pneumatic governor parts, function and operation  \n2.5 Setting procedure for pneumatic governor  \n2.6 Common rail mechanical governor, parts function and \noperation  \n2.7 Hydraulic governor parts, function and operation  \n2.8 Precaution in setting hydraulic governor  \n2.9 Positive Work Values (Patience, Perseverance, \nHonesty, etc.) \n2.10 Quality procedures, e.g., 5S \n2.11 Environmental-conservation procedures,  \ne.g., 3R (reduce, reuse, recycle)\n3. Required skills \n3.1 Setting hydraulic governor   \n3.2 Use of special tools and testing equipment  \n3.3 Troubleshooting and analysis of failures  \n3.4 Adjusting common rail mechanical governor  \n3.5 Setting rotary injection pump  \n3.6 Setting pneumatic governor  \n3.7\nReading and Interpreting manufacturer’s manual\n4. Resource \nimplications \nThe following resources should be provided:  \n4.1 Workplace: Real or simulated work area  \n4.2 Appropriate Tools & equipment  \n4.3\nMaterials relevant to the activity \n5. Method of \nassessment \nCompetency in this unit may be assessed through:  \n5.1 Observation/Demonstration with Questioning  \n5.2 Written test \n5.3\nPortfolio\n6. Context of \nassessment \n6.1 Competency must be assessed on the job or \nsimulated environment.  \n6.2 The assessment of practical skills must take place \nafter a period of supervised practice and repetitive \nexperience.\n",
