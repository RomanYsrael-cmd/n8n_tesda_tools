        "source_text": "--- PDF PAGE 97 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n95\n \nUNIT OF \nCOMPETENCY :     \nPLAN ASSESSMENT ACTIVITIES AND PROCESSES   \nUNIT CODE                 :   ALT311365 \nUNIT DESCRIPTOR             \n:        \nThis unit describes the performance outcomes, skills and \nknowledge required to plan and organize the assessment \nprocess, including recognition of prior learning in a \ncompetency-based assessment system. It also includes the \ndevelopment of simple assessment instruments.\n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Determine \nassessment approach \n1.1     Identify candidate and confirm purposes and context \nof assessment with relevant people according to \nlegal, organizational and ethical requirements \n1.2    Identify and access benchmarks for assessment and \nany specific assessment guidelines \n2. Prepare the \nassessment plan \n2.1. \nDetermine evidence and types of evidence needed \nto demonstrate competence, according to the rules \nof evidence \n2.2. \nSelect assessment methods which will support the \ncollection of defined evidence, taking into account the \ncontext in which the assessment will take place \n2.3. \nDocument all aspects of the assessment plan and \nconfirm with relevant personnel \n3. Develop \nassessment \ninstruments \n3.1. \nDevelop simple assessment instruments to meet \ntarget group needs \n3.2. \nAnalyze available assessment instruments for their \nsuitability for use and modify as required \n3.3. \nMap assessment instruments against unit or course \nrequirements \n3.4. \nWrite clear instructions for candidate about the use of \nthe instruments \n3.5. \nTrial draft assessment instruments to validate content \nand applicability, and record outcomes\n\n--- PDF PAGE 98 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n96\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Purposes of \nassessment  \nMay include: \n1.1. \nRecognizing current existing competence of \ncandidates \n1.2. \nDetermining if competence has been achieved \nfollowing learning \n1.3. \nEstablishing candidate progress towards \nachievement of competence \n1.4. \nDetermining language, literacy and numeracy needs \nof candidates \n1.5. \nCertifying competence through a qualification or \nStatement of Attainment \n1.6.\nLicensing or regulatory requirements\n2. Context of \nassessment  \nMay include: \n2.1. \nEnvironment in which the assessment will be carried \nout, including real or simulated workplace \n2.2. \nOpportunities for collecting evidence in a number of \nsituations \n2.3. \nRelationships between competency standards and \n2.3.1. Evidence to support recognition of prior  \nlearning \n2.3.2. work activities in the candidate's workplace \n2.3.3. learning activities \n2.4.\nWho carries out the assessment\n3. Organizational, \nlegal and ethical \nrequirements  \nMay include: \n3.1. \nAssessment system policies and procedures \n3.2. \nAssessment strategy requirements \n3.3. \nReporting, recording and retrieval systems for \nassessment, including recognition of prior learning \n3.4. \nQuality assurance systems \n3.5. \nBusiness and performance plans \n3.6. \nAccess and equity policies and procedures \n3.7. \nCollaborative and partnership arrangements \n3.8. \nDefined resource parameters \n3.9. \nmutual recognition arrangements \n3.10. Industrial relations systems and processes, awards, \nand enterprise agreements \n3.11. Registration scope \n3.12. Human resources policies and procedures \n3.13. Legal requirements, including \n3.13.1.   Anti-discrimination \n3.13.2.   Equal employment opportunity \n3.13.3.  Job role, responsibilities and conditions \n3.14. Relevant industry codes of practice \n3.15. Confidentiality and privacy requirements \n3.16. OHS considerations, including: \n3.16.1. Ensuring OHS requirements are adhered to \nduring the assessment process \n3.16.2. Identifying and reporting OHS hazards and \nconcerns to relevant personnel\n\n--- PDF PAGE 99 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n97\n4. Benchmarks for \nassessment / \nrecognition of prior \nlearning  \nMay include: \n4.1. \nCriterion against which the candidate is assessed or \nprior learning recognized, which may be: \n4.1.1. Competency standard/unit of competency \n4.1.2. Assessment criteria of course curricula \n4.1.3. Performance specifications of an enterprise or \nindustry \n4.1.4. Product specifications\n5. Types of evidence  \nMay include: \n5.1. \nDirect \n5.2. \nIndirect \n5.3.\nSupplementary\n6. Rules of evidence  \nMay include: \n6.1. \nValid \n6.2. \nSufficient \n6.3. \nAuthentic \n6.4.\nReliable\n7. Assessment \nmethods \nMay include: \n7.1. \nDirect observation \n7.1.1. Real work/real time activities at the workplace \n7.1.2. Work activities in a simulated workplace \nenvironment \n7.2. \nStructured activities: \n7.2.1. Simulation exercises and role-plays \n7.2.2. Projects \n7.2.3. Presentations \n7.2.4. Activity sheets \n7.3. \nQuestioning: \n7.3.1. Written questions, e.g. on a computer \n7.3.2. Interviews \n7.3.3. Self-assessment \n7.3.4. Verbal questioning \n7.3.5. Questionnaires \n7.3.6. Oral or written examinations (applicable at \nhigher AQF levels) \n \n7.4. \nPortfolios of evidence: \n7.4.1. Collection of work samples compiled by \ncandidate \n7.4.2. Product with supporting documentation \n7.4.3. Historical evidence \n7.4.4. Journal or log book \n7.4.5. Information about life experience \n7.5. \nReview of products:  \n7.5.1. Testimonials and reports from employers and \nsupervisors \n7.5.2. Evidence of training \n7.5.3. Authenticated prior achievements \n7.5.4. Interview with employer, supervisor, or peer.\n\n--- PDF PAGE 100 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n98\n8. Assessment plan  \nMay include: \n8.1. \nOverall planning document describing: \n8.2. \nWhat is to be assessed \n8.3. \nWhen assessment is to take place \n8.4. \nWhere assessment is to take place \n8.5.\nHow assessment is to take place.\n9. Simple assessment \ninstruments  \nMay include: \n9.1. \nInstruments developed by an assessor as part of \nformative or summative assessment activities, \nincluding: \n9.1.1. Profiles of acceptable performance measures \n9.1.2. Templates  \n9.1.3. Specific questions or activities \n9.1.4. Evidence and observation checklists \n9.1.5. Checklists for the evaluation of work samples \n9.1.6. Recognition portfolios \n9.1.7. Candidate self-assessment materials \n9.2. \nInstruments developed elsewhere that have been \nmodified by the assessor for use with a particular \nclient group.\n10. Available \nassessment \ninstruments  \nMay include: \n10.1. Commercially available instruments \n10.2. Those created by others inside the registered training \norganization.\n11. Map assessment  \nMay include: \nShowing a clear relationship between the evidence and the \nrequirements of the unit.\n\n--- PDF PAGE 101 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n99\n   EVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nEvidence of the ability to: \n1.1. \nPlanned and organized the assessment process on a \nminimum of two occasions \n1.2. \nCollected evidence that demonstrates: \n1.2.1. Documented assessment plans \n1.2.2. Covered a range of assessment events \n1.2.3. Catered for a number of candidates \n1.2.4. Different competency standards or accredited \ncurricula \n1.2.5. Recognition of prior learning assessment \n1.2.6. Contextualisation of competency standards \nand the selected assessment tools, where \nrequired \n1.2.7. Incorporation of reasonable adjustment \nstrategies \n1.2.8. Development of simple assessment \ninstruments for use in the process \n1.2.9. Organisational arrangements\n2. Required  \nknowledge  \n2.1. \nEthical and legal requirements of an assessor \n2.2. \nCompetency-based assessment, including: \n2.2.1. Work-focused \n2.2.2. Criterion-referenced \n2.2.3. Standards-based \n2.2.4. Evidence-based \n2.3. \nDifferent purposes of assessment and different \nassessment contexts, including recognition of prior \nlearning \n2.4. \nHow to read and interpret the identified competency \nstandards as the benchmarks for assessment \n2.5. \nHow to contextualise competency standards within \nrelevant guidelines \n2.6. \nFour principles of assessment and how they guide \nthe assessment process \n2.7. \nPurpose and features of evidence, and different types \nof evidence used in competency-based assessments, \nincluding recognition of learning process \n2.8. \nRules of evidence and how they guide evidence \ncollection \n2.9. \nDifferent types of assessment methods, including \nsuitability for collecting various types of evidence \n2.10. Assessment tools and their purpose; different types of \ntools; relevance of different tools for specific \nevidence-gathering opportunities \n2.11. Quality procedures, e.g., 5S \n2.12. Environmental-conservation procedures,  \ne.g., 3R (reduce, reuse, recycle)\n\n--- PDF PAGE 102 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n100\n3. Required Skills \n3.1  Cognitive interpretation skills to: \n3.1.1 Interpret competency standards and other \nassessment documentation, including material \nrelating to reasonable adjustment \n3.1.2 Identify opportunities for integrated \ncompetency assessment \n3.1.3 Contextualize competency standards to the \noperating assessment environment, including \nrecognition of prior learning \n3.1.4 Consider access and equity needs of diverse \ncandidates \n3.2 Technology skills to use appropriate equipment and \nsoftware to communicate effectively with others \n3.3 Research and evaluation skills to: \n3.3.1 Obtain competency standards, assessment \ntools and other relevant assessment resources \n3.3.2 Research candidate characteristics and any \nreasonable adjustment needs \n3.3.3 Evaluate feedback, and determine and \nimplement improvements to processes \n3.4 Literacy skills to read and interpret relevant information \nto design and facilitate assessment and recognition \nprocesses \n3.5 Communication skills to discuss assessment, including \nrecognition of learning process processes with clients \nand other assessors \n3.6 Interpersonal skills to: \n3.6.1 Demonstrate sensitivity to access and equity \nconsiderations and candidate diversity \n3.6.2 Promote and implement equity, fairness, \nvalidity, reliability and flexibility in planning an \nassessment processes\n4.Resource Implications\n \nThe following resources should be provided: \n4.1. \nEvidence must be gathered in the workplace \nwherever possible. Where no workplace is available, \na simulated workplace must be provided.  \n4.2. \nAssessment must ensure access to training products, \nsuch as training packages and accredited course \ndocumentation.\n5. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1  Portfolio Assessment  \n5.2  Interview \n5.3   Case Study/Situation\n6. Context for \nAssessment \n6.1  Competency may be assessed in the work place or in a \nsimulated work place setting\n",
