        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nThe evidence required to demonstrate competency in this \nunit must be relevant to and satisfy all of the requirements of \nthe elements and performance criteria of this unit and \ninclude demonstration of applying: \n1.1. \nthe underpinning knowledge and skills \n1.2. \nrelevant legislation and workplace procedures \n1.3.\nother relevant aspects of the range statement\n2. Required knowledge \n2.1.\nRelevant sections of national and state or territory \nregulatory requirements and codes of practice, \nincluding knowledge of fire safety and building \nregulations applicable to the facility \n2.2. \nRelevant OH&S and environmental procedures and \nregulations \n2.3. \nFocus of operation of warehouse systems, resources, \nmanagement and workplace operating systems \n2.4. \nEnterprise business policies and plans including \nprocedures for operations of the facility \n2.5. \nThroughput and storage requirements for specific \ntypes of inventory \n2.6. \nPrinciples, purpose and location of controls, \nmonitoring devices, and systems \n2.7. \nSelection and appropriate application of technology, \ninformation systems and procedures \n2.8. \nProcedures for operating electronic communications \nequipment \n2.9. \nRequirements for completing relevant documentation \n2.10. Procedures for managing and controlling hazardous \nsituations when carrying out work activities, \nparticularly those that relate to the storage of \nmaterials \n2.11. Procedures to be followed in the event of an \nemergency \n2.12. Quality procedures, e.g., 5S \n2.13. Environmental-conservation procedures,  \ne.g., 3R (reduce, reuse, recycle)\n3. Required Skills\n3.1\nCommunicate effectively with others when managing \nfacility and inventory requirements \n3.2 \nRead and interpret plans, diagrams, regulations, codes \nof practice and other documentation relevant to the \nmanagement of facilities and inventory requirements \n3.3 \nProvide leadership to others when managing facilities \nand inventory requirements \n3.4 \nAdapt appropriately to cultural differences in the \nworkplace, including modes of behavior and \ninteractions with others \n3.5 \nPromptly report and or rectify any identified \nproblems that may arise during the planning and \nmanagement of facilities and inventory requirements \n3.6 \nDevelop and implement contingency plans for \nunplanned events which may arise during the \nmanagement of facilities and inventory requirements \n3.7    Prioritize work and coordinate the work of others \n3.8 \nApply precautions and required action to minimize, \ncontrol or eliminate hazards that may exist during work \nactivities \n3.9 \nSelect and apply appropriate technology, information \nsystems and procedures when managing facility and \ninventory requirements\n\n--- PDF PAGE 108 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n106\n4. Resource \nImplications \n \nThe following resources should be provided: \n4.1. \nA range of relevant exercises, case studies and/or \nother simulated practical and knowledge assessment \n4.2. \nAccess to an appropriate range of relevant \noperational situations in the workplace \n4.3. \nRelevant and appropriate materials and equipment,  \n4.4. \nApplicable documentation including workplace \nprocedures, regulations, codes of practice and \noperation manuals \n5. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1 Portfolio Assessment  \n5.2    Interview \n5.3 Case Study/Situation \n6. Context for \nAssessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting",
