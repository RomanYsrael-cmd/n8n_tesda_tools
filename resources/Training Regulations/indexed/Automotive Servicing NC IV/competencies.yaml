        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Identified and implemented learning opportunities for\nothers\n1.2. Gave and received feedback constructively\n1.3. Facilitated participation of individuals in the work of the\nteam\n1.4. Negotiated learning plans to improve the effectiveness\nof learning\n1.5. Prepared learning plans to match skill needs\n1.6. Accessed and designated learning opportunities\n2. Underpinning\nknowledge and\nattitude\n2.1. Coaching and mentoring principles\n2.2. Understanding how to work effectively with team\nmembers who have diverse work styles, aspirations,\ncultures and perspective\n2.3. Understanding how to facilitate team development and\nimprovement\n2.4. Understanding methods and techniques for eliciting\nand interpreting feedback\n2.5. Understanding methods for identifying and prioritizing\npersonal development opportunities and options\n2.6. Knowledge of career paths and competency standards\nin the industry\n3. Underpinning\nskills\n3.1. Ability to read and understand a variety of texts,\nprepare general information and documents according\nto target audience; spell with accuracy; use grammar\nand punctuation effective relationships and conflict\nmanagement\n3.2. Communication skills including receiving feedback and\nreporting, maintaining effective relationships and\nconflict management\n3.3. Planning skills to organize required resources and\nequipment to meet learning needs\n3.4. Coaching and mentoring skills to provide support to\ncolleagues\n3.5. Reporting skills to organize information; assess\ninformation for relevance and accuracy; identify and\nelaborate on learning outcomes\n3.6. Facilitation skills to conduct small group training\nsessions\n3.7. Ability to relate to people from a range of social,\ncultural, physical and mental backgrounds\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2. Materials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1. Observation of work activities of the individual member\nin relation to the work activities of the group\n5.2. Observation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 12 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n10\nUNIT OF COMPETENCY :\nAPPLY PROBLEM SOLVING TECHNIQUES IN THE\nWORKPLACE\nUNIT CODE\n:"
