        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Documented performance indicators and a critical\ndescription and analysis of performance management\nsystem from the workplace\n1.2 Demonstrated techniques in providing feedback and\ncoaching for improvement in performance\n1.3 Demonstrated knowledge of relevant awards and\ncertified agreements\n2. Required knowledge\n2.1. Relevant legislation from all levels of government that\naffects business operation, especially in regard to\noccupational health and safety and environmental\nissues, equal opportunity, industrial relations and anti-\ndiscrimination\n2.2. Relevant awards and certified agreements\n2.3. Performance measurement systems utilised within the\norganisation\n2.4. Unlawful dismissal rules and due process\n2.5. Staff development options and information\n2.6. Quality procedures, e.g., 5S\n2.7. Environmental-conservation procedures, e.g., 3R\n(reduce, reuse, recycle)\n3. Required Skills\n3.1. Communication skills to articulate expected standards\nof performance, to provide effective feedback and to\ncoach staff who need development\n3.2. Risk management skills to analyze, identify and\ndevelop mitigation strategies for identified risks\n3.3. Planning and organization skills to ensure a planned\nand objective approach to the performance\nmanagement system.\n4. Resource\nImplications\n\nThe following resources should be provided:\n• Access to appropriate documentation and resources\nnormally used in the workplace e following resources\nmust be provided:\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1. Portfolio Assessment\n5.2. Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1. Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 122 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n120\n\nUNIT OFMPETENCY : PLAN AND MANAGE COMPLIANCE WITH\nENVIRONMENTAL REGULATIONS IN A WORKPLACE\nOR BUSINESS\nUNIT CODE :"
        },
        "source_text": "ALT311370\nUNIT DESCRIPTOR : This unit applies to all managers and team leaders who\nmanage people. It covers work allocation and the\nmethods to review performance, reward excellence and\nprovide feedback where there is a need for improvement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Allocate work\n1.1 Consult relevant groups and individuals on work to be\nallocated and resources available.\n1.2 Develop work plans in accordance with operational\nplans.\n1.3 Allocate work in a way that is efficient, cost effective\nand outcome focused.\n1.4 Confirm performance standards, Code of Conduct\nand work outputs with relevant teams and individuals.\n1.5 Develop and agree performance indicators with\nrelevant staff prior to commencement of work.\n1.6 Conduct risk analysis in accordance with the\norganizational risk management plan and legal\nrequirements.\n2. Assess performance\n2.1. Design\nperformance\nmanagement\nand\nreview\nprocesses to ensure consistency with organizational\nobjectives and policies\n2.2. Train participants in the performance management and\nreview process\n2.3. Conduct performance management in accordance with\norganizational protocols and time lines\n2.4. Monitor and evaluate performance on a continuous\nbasis\n3.\nProvide feedback\n3.1. Provide informal feedback to staff on a regular basis\n3.2. Advise\nrelevant\npeople\nwhere\nthere\nis\npoor\nperformance and take necessary actions\n3.3. Provide on-the-job coaching when necessary to\nimprove performance and to confirm excellence in\nperformance\n3.4. Document performance in accordance with the\norganizational performance management system\n3.5. Conduct formal structured feedback sessions as\nnecessary and in accordance with organizational policy\n4.\nManage follow up\n4.1. Write and agree performance improvement and\ndevelopment plans in accordance with organizational\npolicies\n4.2. Seek assistance from human resources specialists\nwhere appropriate\n4.3. Reinforce\nexcellence\nin\nperformance\nthrough\nrecognition and continuous feedback\n4.4. Monitor and coach individuals with poor performance\n4.5. Provide support services where necessary\n4.6. Counsel individuals who continue to perform below\nexpectations and implement the disciplinary process if\nnecessary\n4.7. Terminate staff in accordance with legal and\norganizational requirements where serious misconduct\noccurs or ongoing poor-performance continues\n\n--- PDF PAGE 120 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n118\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Performance\nstandards\nMay include:\n1.1.\nLevel of performance sought from an individual or\ngroup which may be expressed either quantitatively\nor qualitatively\n2. Code of Conduct\nMay include:\n2.1.\nAgreed (or decreed) set of rules relating to employee\nbehavior / conduct with other employees or an agreed\n(or decreed) set of rules relating to employee\nbehavior\n/\nconduct\nwith\nother\nemployees\nor\ncustomers\n3. Performance\nindicators\nMay include:\n3.1.\nMeasures against which performance outcomes are\ngauged\n4. Risk analysis\nMay include:\n4.1.\nDetermination of the likelihood of a negative event\npreventing the organization meeting its objectives and\nthe likely consequences of such an event on\norganizational performance\n5. Performance\nmanagement\nMay include:\n5.1.\nIn accordance with relevant industrial agreements\n5.2.\nProcess or set of processes for establishing a shared\nunderstanding of what an individual or group is to\nachieve, and managing and developing individuals in\na way which increases the probability it will be\nachieved in both the short- and long-term\n6. Excellence in\nperformance\nMay include:\n6.1.\nRegularly\nand\nconsistently\nexceeding\nthe\nperformance targets established while meeting the\norganization's performance standards\n7. Termination\nMay include:\n7.1.\nCessation of the contract of employment between an\nemployer and an employee, at the initiative of the\nemployer within relevant industrial agreements\n\n--- PDF PAGE 121 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n119\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Documented performance indicators and a critical\ndescription and analysis of performance management\nsystem from the workplace\n1.2 Demonstrated techniques in providing feedback and\ncoaching for improvement in performance\n1.3 Demonstrated knowledge of relevant awards and\ncertified agreements\n2. Required knowledge\n2.1. Relevant legislation from all levels of government that\naffects business operation, especially in regard to\noccupational health and safety and environmental\nissues, equal opportunity, industrial relations and anti-\ndiscrimination\n2.2. Relevant awards and certified agreements\n2.3. Performance measurement systems utilised within the\norganisation\n2.4. Unlawful dismissal rules and due process\n2.5. Staff development options and information\n2.6. Quality procedures, e.g., 5S\n2.7. Environmental-conservation procedures, e.g., 3R\n(reduce, reuse, recycle)\n3. Required Skills\n3.1. Communication skills to articulate expected standards\nof performance, to provide effective feedback and to\ncoach staff who need development\n3.2. Risk management skills to analyze, identify and\ndevelop mitigation strategies for identified risks\n3.3. Planning and organization skills to ensure a planned\nand objective approach to the performance\nmanagement system.\n4. Resource\nImplications\n\nThe following resources should be provided:\n• Access to appropriate documentation and resources\nnormally used in the workplace e following resources\nmust be provided:\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1. Portfolio Assessment\n5.2. Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1. Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 122 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n120\n\nUNIT OFMPETENCY : PLAN AND MANAGE COMPLIANCE WITH\nENVIRONMENTAL REGULATIONS IN A WORKPLACE\nOR BUSINESS\nUNIT CODE :"
