        "source_text": "ALT723202\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitude needed to\nmove and position vehicle in a workshop.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Prepare vehicle for\n driving\n\n1.2 Correct check-up procedures performed based on\n vehicle manufacturer’s standard\n\n2. Move and position\n vehicle\n\n2.1 Select vehicle to be moved or re-position.\n2.2 Drive the vehicle to appropriate location\n2.3 Park vehicle following parking safety techniques\nand procedure\n\n3. Check the vehicle\n\n3.1 Vehicle position is checked as per requirement\n3.2 Vehicle is checked for external damages\n\n--- PDF PAGE 29 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n27\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n\n1. Check up procedure\nMay include:\n1.1 Oil level\n1.2 Brake fluid\n1.3 Clutch fluid\n1.4 Coolant level\n1.5 Battery (electrolyte)\n1.6 Tire pressure\n1.7 Position of driving gear\n1.8 Lighting and warning devices\n\n2. Vehicles\nMay include:\n2.1 Vehicles with automatic transmission\n2.2 Vehicles with manual transmission\n\n3.Parking safety\n techniques\nMay include:\n3.1 Engaging of Park brake\n3.2 Vehicle parking position\n3.3 Front wheel position\n\n--- PDF PAGE 30 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n28\nEVIDENCE GUIDE\n\n1.Critical aspects of\n competency\n\nAssessment requires evidence that the candidate:\n1.1 Prepared vehicle for driving.\n1.2 Moved and positioned vehicle\n1.3 Checked the vehicle.\n\n2. Required\nknowledge\n\n2.1 Driver’s Code of conduct\n2.2 Workshop signs and symbols\n2.3 Driving skills\n2.4 Vehicle accessories for safe driving and parking\n\n3. Required skills\n\n3.1 Ability to handle vehicle/maneuver vehicle the easiest\nway\n3.2 Immediate response to accident\n3.3 Preparing vehicle for driving\n3.4 Parking Downhill, Uphill, Parallel\n3.5 Shifting Gears\n3.6 Maneuvering\n\n4. Resource\n implications\n\nThe following resources should be provided:\n4.1 Driving range/area\n4.2 Appropriate vehicle for driving\n4.3 Vehicle accessories\n\n5.Method of\nassessment\n\nCompetency in this unit may be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n\n6 Context of\n assessment\n\n6.1 Assessment must be undertaken in accordance with the\n endorsed TESDA assessment guidelines\n6.2 Assessment of practical skills must be done in a\nworkplace or simulated environment.\n\n--- PDF PAGE 31 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n29\nUNIT OF COMPETENCY: PERFORM MENSURATION AND CALCULATION\n\nUNIT CODE:"
