        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nEvidence of the ability to: \n1.1. \nPlanned and organized the assessment process on a \nminimum of two occasions \n1.2. \nCollected evidence that demonstrates: \n1.2.1. Documented assessment plans \n1.2.2. Covered a range of assessment events \n1.2.3. Catered for a number of candidates \n1.2.4. Different competency standards or accredited \ncurricula \n1.2.5. Recognition of prior learning assessment \n1.2.6. Contextualisation of competency standards \nand the selected assessment tools, where \nrequired \n1.2.7. Incorporation of reasonable adjustment \nstrategies \n1.2.8. Development of simple assessment \ninstruments for use in the process \n1.2.9. Organisational arrangements\n2. Required  \nknowledge  \n2.1. \nEthical and legal requirements of an assessor \n2.2. \nCompetency-based assessment, including: \n2.2.1. Work-focused \n2.2.2. Criterion-referenced \n2.2.3. Standards-based \n2.2.4. Evidence-based \n2.3. \nDifferent purposes of assessment and different \nassessment contexts, including recognition of prior \nlearning \n2.4. \nHow to read and interpret the identified competency \nstandards as the benchmarks for assessment \n2.5. \nHow to contextualise competency standards within \nrelevant guidelines \n2.6. \nFour principles of assessment and how they guide \nthe assessment process \n2.7. \nPurpose and features of evidence, and different types \nof evidence used in competency-based assessments, \nincluding recognition of learning process \n2.8. \nRules of evidence and how they guide evidence \ncollection \n2.9. \nDifferent types of assessment methods, including \nsuitability for collecting various types of evidence \n2.10. Assessment tools and their purpose; different types of \ntools; relevance of different tools for specific \nevidence-gathering opportunities \n2.11. Quality procedures, e.g., 5S \n2.12. Environmental-conservation procedures,  \ne.g., 3R (reduce, reuse, recycle)\n\n--- PDF PAGE 102 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n100\n3. Required Skills \n3.1  Cognitive interpretation skills to: \n3.1.1 Interpret competency standards and other \nassessment documentation, including material \nrelating to reasonable adjustment \n3.1.2 Identify opportunities for integrated \ncompetency assessment \n3.1.3 Contextualize competency standards to the \noperating assessment environment, including \nrecognition of prior learning \n3.1.4 Consider access and equity needs of diverse \ncandidates \n3.2 Technology skills to use appropriate equipment and \nsoftware to communicate effectively with others \n3.3 Research and evaluation skills to: \n3.3.1 Obtain competency standards, assessment \ntools and other relevant assessment resources \n3.3.2 Research candidate characteristics and any \nreasonable adjustment needs \n3.3.3 Evaluate feedback, and determine and \nimplement improvements to processes \n3.4 Literacy skills to read and interpret relevant information \nto design and facilitate assessment and recognition \nprocesses \n3.5 Communication skills to discuss assessment, including \nrecognition of learning process processes with clients \nand other assessors \n3.6 Interpersonal skills to: \n3.6.1 Demonstrate sensitivity to access and equity \nconsiderations and candidate diversity \n3.6.2 Promote and implement equity, fairness, \nvalidity, reliability and flexibility in planning an \nassessment processes\n4.Resource Implications\n \nThe following resources should be provided: \n4.1. \nEvidence must be gathered in the workplace \nwherever possible. Where no workplace is available, \na simulated workplace must be provided.  \n4.2. \nAssessment must ensure access to training products, \nsuch as training packages and accredited course \ndocumentation.\n5. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1  Portfolio Assessment  \n5.2  Interview \n5.3   Case Study/Situation\n6. Context for \nAssessment \n6.1  Competency may be assessed in the work place or in a \nsimulated work place setting",
