          "source_text": "1. Identify types of  \nlubricants/ \ncoolants \n \n1.1 Correct information on lubrication schedule is \naccessed and interpreted from appropriate \nmanufacturers specifications manuals \n1.2 Type and quantity of lubricants/coolant are identified \nas per job requirements\n \n2. Use and apply   \n    lubricants/coolants \n \n \n2.1 Correct procedure for change of lubricant is identified  \nfollowing manufacturer’s specification or manual \n2.2 Correct tools and equipment are selected and used in \nline with job requirements \n2.3 Existing lubricants are removed and replaced with \nspecified types and quantity of new materials in line with \nmanufacturer’s specification \n2.4 Safe procedure and use of PPE are observed when \nremoving or replacing lubricant \n2.5 Used lubricants are disposed in accordance with  \n        environmental guidelines \n2.6 Work is checked in line with company SOP.\n \n3. Perform \nhousekeeping \nactivities \n \n3.1 Tools, equipment and materials  are properly stored as \nper company SOP \n3.2 Workplace is free from waste materials\n\n--- PDF PAGE 37 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n35\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Manuals \nMay include: \n1.1 Manufacturer’s  specification manual \n1.2 Periodic Maintenance manual \n1.3 Service Manual\n2.Lubricants/ Coolant \n \nMay include: \n2.1 Engine oil: \n \nDiesel engine oil \n \nGasoline engine oil \n2.2 Automatic Transmission Fluid \n \nDestro II \n \nT4 \n2.3 Gear oil lubricants: \n \nOil #90 \n \nOil #140 \n \nOil #30 \n \nOil #40 \n2.4 Grease \n Special (velocity joint)   \n      Molybdenum disolfate) \n Ordinary \n Multi-purpose oil \n Contact point lubricant  \n      (grease)\n2.5 Brake/Clutch System \n \nBrake fluid \n \nDOT3 \n \n2.6 Power Steering Fluid \n \nHydraulic Fluid \n \n2.7 Radiator Coolant \n \nLong last coolant \n \n2.8 A/C Compressor Oil \n \nPag oil \