        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1Cleaned workshop tools/facilities\n1.2Maintained equipment, tools and facilities\n1.3Disposed wastes and used lubricants/fluid as per required\n procedure\n2. Required\nknowledge\n2.1 5S or Total Quality Management (TQM)\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of Equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire Extinguishers and prevention\n2.9 Storage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\n Attention to Details)\n3. Required skills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of supplies/materials\n3.4 Preparing inventory of s/m and tools and equipment\n3.5 Monitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Written/Oral Questioning\n5.2 Demonstration\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 42 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n40\nUNIT OF COMPETENCY: PREPARE JOB ESTIMATE/COSTING\n\nCODE:"
        },
        "source_text": "ALT723307\n\nUNIT DESCRIPTOR: This unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage of\ntools/equipment and disposal of used supplies/materials are\nalso incorporated in this competency\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n.\n1.1 Cleaning solvent used as per workshop/tools\n cleaning requirement\n\n1.2 Work area is checked and cleaned\n\n1.3 Wet surface/spot in work area is wiped and dried\n\n2. Store/arrange tools\nand shop equipment\n\n2.1 Tools/equipment are checked and stored in their\n respective shelves/location\n\n2.2 Corresponding labels are posted and visible\n\n2.3 Tools are safely secured and logged in the records\n\n3. Dispose wastes/used\nlubricants\n\n3.1 Containers for used lubricants are visibly labeled\n\n3.2 Wastes/used lubricants are disposed as per\n workshop SOP\n\n4. Report damaged\ntools/equipment\n\n4.1 Complete inventory of tools/equipment is maintained\n\n4.2 Damaged tools/equipment/facilities are identified and\n repair recommendation is given\n\n4.3 Reports prepared have no error/discrepancy\n\n--- PDF PAGE 40 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n38\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work Area\nMay include:\n1.1 Workshop areas for servicing/repairing light and/or heavy\nvehicle and/or plant transmissions and/or outdoor power\nequipment\n1.2 Open workshop/garage and enclosed, ventilated office\narea\n1.3 Other variables may include workshop with:\n• Mess hall\n• Wash room\n• Comfort room\n2. Cleaning\n requirement\nMay include:\n2.1 Cleaning solvent\n2.2 Inventory of supplies, tools, equipment, facilities\n2.3 List of mechanics/technicians\n2.4 Rags\n2.5 Broom\n2.6 Map\n2.7 Pail\n2.8 Used oil container\n2.9 Oiler\n2.10 Dust/waste bin\n3. Manuals\nMay include:\n3.1 Vehicle/plant manufacturer specifications\n3.2 Company operating procedures\n3.3 Industry/Workplace Codes of Practice\n3.4 Product manufacturer specifications\n3.5 Customer requirements\n3.6 Industry Occupational Health &Safety\n4. Company\nstandard\noperating\nprocedure\nWearing of Personal protective equipment may include:\n4.1 Gloves\n4.2 Apron\n4.3 Goggles\n4.4 Safety shoes\n\n--- PDF PAGE 41 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n39\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1Cleaned workshop tools/facilities\n1.2Maintained equipment, tools and facilities\n1.3Disposed wastes and used lubricants/fluid as per required\n procedure\n2. Required\nknowledge\n2.1 5S or Total Quality Management (TQM)\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of Equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire Extinguishers and prevention\n2.9 Storage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\n Attention to Details)\n3. Required skills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of supplies/materials\n3.4 Preparing inventory of s/m and tools and equipment\n3.5 Monitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency in this unit may be assessed through:\n5.1 Written/Oral Questioning\n5.2 Demonstration\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 42 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n40\nUNIT OF COMPETENCY: PREPARE JOB ESTIMATE/COSTING\n\nCODE:"
