        "source_text": "500311116\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired\nto\ndetermine\nindividual\nand\nteam\ndevelopment needs and facilitate the development of\nthe workgroup.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1.\nLearning and development needs are\nsystematically identified and implemented in line with\norganizational requirements\n1.2.\nLearning plan to meet individual and group training\nand developmental needs is collaboratively\ndeveloped and implemented\n1.3.\nIndividuals are encouraged to self evaluate\nperformance and identify areas for improvement\n1.4.\nFeedback on performance of team members is\ncollected from relevant sources and compared with\nestablished team learning process\n2. Foster individual and\norganizational growth\n2.1.\nLearning and development program goals and\nobjectives are identified to match the specific\nknowledge and skills requirements of competency\nstandards\n2.2.\nLearning delivery methods are appropriate to the\nlearning goals, the learning style of participants and\navailability of equipment and resources\n2.3.\nWorkplace learning opportunities and coaching/\nmentoring assistance are provided to facilitate\nindividual and team achievement of competencies\n2.4.\nResources and timelines required for learning\nactivities are identified and approved in accordance\nwith organizational requirements\n3. Monitor and evaluate\nworkplace learning\n3.1.\nFeedback from individuals or teams is used to\nidentify and implement improvements in future\nlearning arrangements\n3.2.\nOutcomes and performance of individuals/teams are\nassessed and recorded to determine the\neffectiveness of development programs and the\nextent of additional support\n3.3.\nModifications to learning plans are negotiated to\nimprove the efficiency and effectiveness of learning\n3.4.\nRecords and reports of competency are maintained\nwithin organizational requirement\n4. Develop team\ncommitment and\ncooperation\n4.1.\nOpen communication processes to obtain and\nshare information is used by team\n4.2.\nDecisions are reached by the team in\naccordance with its agreed roles and\nresponsibilities\n4.3.\nMutual concern and camaraderie are developed\nin the team\n5. Facilitate\naccomplishment of\norganizational goals\n5.1.\nTeam members actively participated in team\nactivities and communication processes\n5.2.\nTeams members developed individual and joint\nresponsibility for their actions\n5.3.\nCollaborative efforts are sustained to attain\norganizational goals\n\n--- PDF PAGE 10 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n8\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Learning and\n development needs\n\n1.1\nCoaching, mentoring and/or supervision\n1.2\nFormal/informal learning program\n1.3\nInternal/external training provision\n1.4\nWork experience/exchange/opportunities\n1.5\nPersonal study\n1.6\nCareer planning/development\n1.7\nPerformance appraisals\n1.8\nWorkplace skills assessment\n1.9\nRecognition of prior learning\n2. Organizational\n requirements\n2.1 Quality assurance and/or procedures\nmanuals\n2.2 Goals, objectives, plans, systems and\nprocesses\n2.3 Legal and organizational policy/guidelines\nand requirements\n2.3\nSafety policies, procedures and programs\n2.4\nConfidentiality and security requirements\n2.5\nBusiness and performance plans\n2.6\nEthical standards\n2.7\nQuality and continuous improvement\nprocesses and standards\n3. Feedback on\n performance\n3.1\n Formal/informal performance appraisals\n3.2\n Obtaining feedback from supervisors and\n colleagues\n3.3 Obtaining feedback from clients\n3.4 Personal and reflective behavior strategies\n3.5 Routine and organizational methods for\nmonitoring service delivery\n4. Learning delivery\n methods\n4.1\nOn the job coaching or mentoring\n4.2\nProblem solving\n4.3\nPresentation/demonstration\n4.4\nFormal course participation\n4.5\nWork experience\n4.6\nInvolvement in professional networks\n4.7\nConference and seminar attendance\n4.8\nInduction\n\n--- PDF PAGE 11 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n9\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Identified and implemented learning opportunities for\nothers\n1.2. Gave and received feedback constructively\n1.3. Facilitated participation of individuals in the work of the\nteam\n1.4. Negotiated learning plans to improve the effectiveness\nof learning\n1.5. Prepared learning plans to match skill needs\n1.6. Accessed and designated learning opportunities\n2. Underpinning\nknowledge and\nattitude\n2.1. Coaching and mentoring principles\n2.2. Understanding how to work effectively with team\nmembers who have diverse work styles, aspirations,\ncultures and perspective\n2.3. Understanding how to facilitate team development and\nimprovement\n2.4. Understanding methods and techniques for eliciting\nand interpreting feedback\n2.5. Understanding methods for identifying and prioritizing\npersonal development opportunities and options\n2.6. Knowledge of career paths and competency standards\nin the industry\n3. Underpinning\nskills\n3.1. Ability to read and understand a variety of texts,\nprepare general information and documents according\nto target audience; spell with accuracy; use grammar\nand punctuation effective relationships and conflict\nmanagement\n3.2. Communication skills including receiving feedback and\nreporting, maintaining effective relationships and\nconflict management\n3.3. Planning skills to organize required resources and\nequipment to meet learning needs\n3.4. Coaching and mentoring skills to provide support to\ncolleagues\n3.5. Reporting skills to organize information; assess\ninformation for relevance and accuracy; identify and\nelaborate on learning outcomes\n3.6. Facilitation skills to conduct small group training\nsessions\n3.7. Ability to relate to people from a range of social,\ncultural, physical and mental backgrounds\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2. Materials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1. Observation of work activities of the individual member\nin relation to the work activities of the group\n5.2. Observation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 12 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n10\nUNIT OF COMPETENCY :\nAPPLY PROBLEM SOLVING TECHNIQUES IN THE\nWORKPLACE\nUNIT CODE\n:"
