individuals in \na way which increases the probability it will be \nachieved in both the short- and long-term \n6. Excellence in \nperformance \nMay include: \n6.1. \nRegularly \nand \nconsistently \nexceeding \nthe \nperformance targets established while meeting the \norganization's performance standards \n7. Termination \nMay include: \n7.1. \nCessation of the contract of employment between an \nemployer and an employee, at the initiative of the \nemployer within relevant industrial agreements\n\n--- PDF PAGE 121 ---\nAutomotive Servicing NC IV (Amended)               Promulgated December 2013                 \n119\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Documented performance indicators and a critical \ndescription and analysis of performance management \nsystem from the workplace \n1.2   Demonstrated techniques in providing feedback and \ncoaching for improvement in performance \n1.3   Demonstrated knowledge of relevant awards and \ncertified agreements \n2. Required knowledge \n2.1. Relevant legislation from all levels of government that \naffects business operation, especially in regard to \noccupational health and safety and environmental \nissues, equal opportunity, industrial relations and anti-\ndiscrimination \n2.2. Relevant awards and certified agreements \n2.3. Performance measurement systems utilised within the \norganisation \n2.4. Unlawful dismissal rules and due process \n2.5. Staff development options and information \n2.6. Quality procedures, e.g., 5S \n2.7. Environmental-conservation procedures, e.g., 3R \n(reduce, reuse, recycle)\n3. Required Skills \n3.1. Communication  skills to articulate expected standards \nof performance, to provide effective feedback and to \ncoach staff who need development  \n3.2. Risk management skills to analyze, identify and \ndevelop mitigation strategies for identified risks \n3.3. Planning and organization skills to ensure a planned \nand 