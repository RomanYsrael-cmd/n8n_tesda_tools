t\nobservation\n• Project\nmethod\n•Interview\n2. Move and\nposition\nvehicle\n2.1 Prepare vehicle for driving\n2.2 Move and position vehicle\n2.3 Check the vehicle\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n3. Perform\nmensuration\nand\ncalculation\n3.1 Select measuring instrument\nand carry out measurement and\ncalculations\n3.2 Maintain measuring instruments\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n4. Read,\ninterpret and\napply\nspecifications\nand manual\n4.1\nIdentify/access manuals and\ninterpret data and specification\n4.2 Apply information accessed in\nmanual\n4.3 Store manual\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n5. Use and\napply\nlubricants/\ncoolants\n5.1\nIdentify type of lubricant/ coolant\n5.2 Use and apply lubricant\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n6. Perform shop\nmaintenance\n6.1 Inspect/clean tools and work area\n6.2 Store/arrange tools and shop\nequipment\n6.3 Dispose waste/used lubricants\n6.4 Report damaged tools/equipment\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n7.Prepare job\nestimates\n7.1Identify nature/scope of work\n7.2 Prepare and present estimates\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n\n--- PDF PAGE 