  "source_section_text": "SECTION 3. TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Automotive Servicing NC IV.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE SERVICING\n\nNC Level NC IV\n\nNominal Training Duration:\n56 Hours (Basic Competencies)\n\n40 Hours (Common Competencies)\n708 Hours (Core Competencies)\n\n804 Hrs.\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes\nof an individual in the field of automotive servicing in accordance with industry\nstandards. It covers core competencies such as; Service diesel engine\nmanagement system; Service electronic body management system; Service\ndiesel fuel injection system components; Service electronic drive management\nsystem; Service emission control; Service and repair electronically controlled\nanti-locking braking system; Service and repair electronically operated traction\ncontrol system and Service and repair ellectronically operated stability control\nsystem.\n\nThis course is also designed to enhance the basic and common\nknowledge, skills and attitudes of an individual in the field of automotive servicing.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Utilize\nspecialized\ncommunication\nskills\n1.1 Apply communication\nstrategies to meet specific\nneeds of internal and external\nclient.\n1.2 Represent the organization in\ninternal and external forums.\n1.3 Facilitate group discussion\n1.4 Conduct interview\n• Discussion\nmethod\n• Role Play\n• Brainstorming\n• Lecture\n\n• Written test\n• Performance\ntest\n• Interview\n2. Develop team\nand individual\nneeds\n2.1 Determine development\nneeds.\n2.2 Foster individual and\norganization growth\n2.3 Monitor and evaluate\nworkplace learning\n2.4 Develop team commitment\nand cooperation\n2.5 Facilitate accomplishment of\norganizational goals\n• Discussion\n• Role playing\n• Observation\n• Written test\n• Direct\nobservation\n• Role playing\n\n--- PDF PAGE 128 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n126\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Apply\nproblem\nsolving\ntechniques in\nthe workplace\n3.1 Analyze the problem\n3.2 Identify fundamental cause of\nthe problem\n3.3 Determine possible solution\n3.4 Prepare communication or\ndocumentation report\n3.5 Present recommendation to\nappropriate personnel\n3.6 Implement solution\n• Brainstorming\n• Discussion\n• Case studies\n• Role playing\n• Small group\nwork\n\n• Written test\n• Direct\nobservation\n• Interview\n4. Collect,\nanalyze and\norganize\ninformation\n4.1 Study information requirements.\n4.2 Process data.\n4.3 Analyze, interpret and organize\ninformation gathered.\n4.4 Present\nfindings/recommendations\n• Group\ndiscussion\n• Case study\n• Interaction\n• Written test\n• Practical/\nperformance\ntest\n5. Plan and\norganize work\n5.1 Set work objectives\n5.2 Plan and schedule work\nactivities\n5.3 Implement and monitor\nplans/activities\n5.4 Review and evaluate work plans\nand activities\n• Brainstorming\n• Discussion\n• Case studies\n• Role playing\n• Small group\nwork\n• Written test\n• Direct\nobservation\n• Interview\n6. Promote\nenvironmental\nprotection\n6.1 Study guidelines for\nenvironmental concerns.\n6.2 Implement specific\nenvironmental programs\n6.3 Monitor activities on\nenvironmental\nprotection/programs\n• Group\ndiscussion\n• Case study\n• Interaction\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 129 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n127\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply\nappropriate\nsealant/\nadhesive\n1.1 Identify appropriate sealant/\nadhesive\n1.2 Prepare surface for sealant /\nadhesive application\n1.3 Store unused and dispose used\nsealant/adhesive\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n2. Move and\nposition\nvehicle\n2.1 Prepare vehicle for driving\n2.2 Move and position vehicle\n2.3 Check the vehicle\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n3. Perform\nmensuration\nand\ncalculation\n3.1 Select measuring instrument\nand carry out measurement and\ncalculations\n3.2 Maintain measuring instruments\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n4. Read,\ninterpret and\napply\nspecifications\nand manual\n4.1\nIdentify/access manuals and\ninterpret data and specification\n4.2 Apply information accessed in\nmanual\n4.3 Store manual\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n5. Use and\napply\nlubricants/\ncoolants\n5.1\nIdentify type of lubricant/ coolant\n5.2 Use and apply lubricant\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n6. Perform shop\nmaintenance\n6.1 Inspect/clean tools and work area\n6.2 Store/arrange tools and shop\nequipment\n6.3 Dispose waste/used lubricants\n6.4 Report damaged tools/equipment\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n7.Prepare job\nestimates\n7.1Identify nature/scope of work\n7.2 Prepare and present estimates\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n\n--- PDF PAGE 130 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n128\n8. Interpret/Draw\ntechnical\ndrawing\n8.1\nInterpret technical drawing\n8.2 Select correct technical drawing\n8.3 Apply freehand sketching\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n9.Practice\nhealth, safety\nand\nenvironment\nprocedures\n9.1 Apply basic safety procedures\n9.2 Apply emergency procedures\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n10.Inspect\ntechnical\nquality of work\n10.1 Gather information to carry\n out inspection\n10.2 Inspect and apply quality\nstandards to work\n10.3 Achieve quality work\n outcomes\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n11.Maintain\nquality systems\n11.1\nConduct final quality check on\n completed work/ orders\n11.2 Report on the quality of\n processes and work\n outcomes\n11.3 Implement improvements to\n work processes\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n12.Provide work\nskill instructions\n12.1\nOrganize instruction and\n demonstration\n12.2 Conduct instruction and\n demonstration\n12.3 Check training performance\n12.4 Review personal training\n performance and finalize\n documentation\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n13.Identify and\nselect original\nautomotive\nparts and\nproducts\n13.1\nIdentify the part/ product and\n its end use\n13.2 Identify details of the part/\n product\n13.3 part/ product is supplied or\n ordered for customer\n\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n\n--- PDF PAGE 131 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n129\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Service diesel\nengine\nmanagement\nsystem and\ncomponents\n1.1 Troubleshoot diesel engine\nmanagement system\n1.2 Test diesel engine management\ncomponents parts\n1.3 Pull out electronic control injection\npump\n1.4 Overhaul electronic control\ninjection pump\n1.5 Assemble electronic control\ninjection pump\n1.6 Calibrate electronic control injection\npump\n1.7 Install electronic control injection\npump\n\n•\nDiscussion\n•\nDual training\n•\nBlended\nlearning\n•\nWritten\n examination\n•\nDemonstration\n of practical\n skills\n•\nInterview\n2. Service\nelectronic body\nmanagement\nsystems\n2.1 Test ride/cruise control\n2.2 Test steering system\n2.3 Test power windows, electric mirror\nand security system\n2.4 Service electronic body\nmanagement and associated\ncomponents\n\n•\nDiscussion\n•\nDual training\n•\nBlended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n3. Service diesel\nfuel injection\nsystem/\ncomponents\n3.1 Overhaul mechanical control\ninjection pump and components\n3.2 Check injection pump governor\n3.3 Check automatic timer\n3.4 Install injection pump\n3.5 Check injection timing and timing\nadvance\n•\nDiscussion\n•\nDual training\n•\nBlended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n4. Service\nelectronic drive\nmanagement\nsystem\n4.1 Service electronic control automatic\ntransmission and system\ncomponent\n4.2 Service traction control\n4.3 Service over drive electronic\ncontrol\n4.4 Balance air suspension system\n4.5 Service ABS system and\ncomponent\n\n•\nDiscussion\n•\nDual training\n•\nBlended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n5. Service\nemission\ncontrol\nsystems\n5.1 Conduct pre-emission inspection\n5.2 Set emission test equipment\n5.3 Conduct emission testing for\ngasoline engine\n5.4 Conduct emission testing for diesel\nengine\n5.5 Service emission control and\nassociated components\n\n•\nDiscussion\n•\nDual training\n•\nBlended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n\n--- PDF PAGE 132 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n130\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Service and\nrepair\nelectronically\ncontrolled anti-\nlock braking\nsystems\n6.1 Prepare for work\n6.2 Test control system, diagnose faults\nand determine service/repair\n requirements\n6.3 Service/repair anti -lock braking\n Systems\n6.4 Clean up work area and maintain\n equipment\n• Discussion\n• Dual training\n• Blended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n7. Service and\nrepair\nelectronically\noperated\ntraction control\nsystems\n7.1 Prepare for work\n7.2 Test and control system, and\ndetermine service/repair\nrequirements\n7.3 Service/ repair electronic traction\ncontrol\n7.4 Clean up work area and maintain\n equipment\n• Discussion\n• Dual training\n• Blended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n8. Service and\nrepair\nelectronically\noperated\nstability control\nsystems\n8.1 Prepare for work\n8.2 Test and control system, and\ndiagnose faults and determine\nservice/repair requirements\n8.3 Service/ repair electronic stability\ncontrol systems\n8.4 Clean up work area and maintain\n equipment\n• Discussion\n• Dual training\n• Blended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n9. Plan\nassessment\nactivities and\nprocesses\n9.1 Determine assessment approach\n9.2 Prepare the assessment plan\n9.3 Develop assessment instruments\n\n• Discussion\n• Dual training\n• Blended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n10. Manage facility\nand inventory\nrequirements\n10.1 Identify space requirements\n10.2 Identify safety and security\nrequirements\n10.3 Develop documentation system\n10.4 Design storage zones\n10.5 Evaluate facility utilization\n• Discussion\n• Dual training\n• Blended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n11. Estimate\ncomplex job\n11.1 Estimate time requirements for\njobs\n11.2 Source parts\n11.3 Identify subcontract testing and/or\nservice/ repair work costs for\nincorporation into the total\nestimated cost\n11.4 Estimate total job costs\n11.5\nReport estimations to customer\n• Discussion\n• Dual training\n• Blended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n\n--- PDF PAGE 133 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n131\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n12. Ensure a safe\nworkplace\n12.1 Establish and maintain an OHS\nsystem\n12.2 Establish and maintain\nparticipative arrangements for the\nmanagement of OHS\n12.3 Establish and maintain procedures\nfor identifying hazards, and\nassessing and controlling risks\n12.4 Establish and maintain a quality\nOHS management system\n\n•\nDiscussion\n•\nDual training\n•\nBlended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n13. Implement\ncontinuous\nimprovement\n13.1 Implement continuous\nimprovement systems and\nprocesses\n13.2 Monitor and review performance\n13.3 Provide opportunities for further\nimprovement\n\n• Discussion\n• Dual training\n• Blended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n14. Manage\npeople\nperformance\n14.1\nAllocate work\n14.2\nAssess performance\n14.3\nProvide feedback\n14.4\nManage follow up\n\n• Discussion\n• Dual training\n• Blended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n15. Plan and\nmanage\ncompliance\nwith\nenvironmental\nregulations in a\nworkplace or\nbusiness\n15.1\nPlan and manage compliance\nwith environmental regulations\n15.2\nManage potential hazards to\nstorm water system to avoid\ncontamination\n15.3\nManage potential hazards to air\nquality to avoid contamination\n15.4\nMinimization of noise hazards is\nplanned and managed\n15.5 Management systems\n\n• Discussion\n• Dual training\n• Blended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n\n--- PDF PAGE 134 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n132\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and\nthe curriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by\nthe competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• Preferably holder of Automotive Servicing NC III\n• can communicate both oral and written; and\n• can perform basic mathematical computation.\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n--- PDF PAGE 135 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n133\n3.4 TOOLS, EQUIPMENT AND MATERIALS\nAUTOMOTIVE SERVICING – NC IV\n\nRecommended list of tools, equipment and materials for the training of 20\ntrainees for Automotive Servicing – NC IV\n\nTOOLS\nEQUIPMENT\n\nMATERIALS\nQTY.\nDESCRIPTION\nQTY.\nDESCRIPTION\nQTY.\nDESCRIPTION\n6 pcs\nScrew driver, one of\neach kind\n4 units\nPower window\nassembly\n4 units\nCar alarm\n2 sets\nBox wrench of 28 pcs,\n4mm-32mm\n4 units\nMultimeter\n1 kg.\nHand cleaning\ndetergents\n2 sets\nOpen end wrench of 28\npcs, 4mm-32mm\n1 unit\nInjector cleaner\n10 kg\nRugs\n2 sets\nSocket wrench\n1 unit\nVehicle lifting equipment\n20 L\nA/T fluid\n2 pcs\nPliers\n4 units\nCreeper\n20 L\nEngine oil\n2 units\nFuel pressure gauge\n1 unit\nElectronics controlled\nAutomatic transmission\n25\npairs\nGloves\n4 pcs\nLED tester\n4 units Electronic control\ninjection pump\n25 pcs\n mask\n10 pcs\nTest light\n1 unit\nAir compressor with\naccessories\n25 pcs. Apron\n4 pcs\nWire stripper\n1 unit\nVehicle (EFI) equipped\nwith electronic body\nand drive management\nsystem\n25 pcs.\nGoggles\n2 units\nTorque wrench, click\ntype\n\n2 pcs\nDial indicator with stand\n\n2 pcs\nMicrometer (25mm-\n100mm)\n4 units\nRotary injection pump\n\n1 init\nA/T pressure gage\n1 unit\nExhaust gas analyzer\n\n2 sets\nAllen wrench\n1 unit\nOpacimeter\n\n2 sets\nCombination wrench, 12\npcs, 6mm-19mm\n2 unit Electronic Automotive\nDiagnostic Scanner with\nsoftware\n\n2 pcs\nSnap ring pliers, internal\n2 pcs\nSnap ring pliers,\nexternal\n\n4 pcs\nTrouble light\n4 pcs\nMagnetic pick up\n\n2 sets\nLeaf feeler gauge\n\n2 pcs\nVernier caliper\n\n2 sets\nOutside micrometer\n\n2 sets\nCylinder bore gauge\n2 pcs Straight edge\n\n2 sets\nEngine Overhauling &\nautomatic transmission\n(SST) per model\n\n--- PDF PAGE 136 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n134\n3.5\nTRAINING FACILITIES\nAUTOMOTIVE SERVICING – NC IV\n\nThe automotive workshop must be made of reinforced concrete or steel\nstructure. The size must be suited on the requirements of the competencies. The\nclass size of 25 students/trainees is reserved for the lecture room and the practical\ndemonstration area for carrying out servicing of minor automotive parts. Most of the\nlearning activities such as on-vehicle servicing are performed in the workshop.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nWorkshop/Laboratory area\n\n6 sq.m/trainee\n150\nLecture Room\n\n28.00\n28.00\nLearning Resource Center\n20.00\n20.00\nWash/Comfort room\n(male/female)\n\n10\n10\nStorage/Tool room\n20\n20\nCirculation Area\n60\nTotal Area\n\n288\n\n3.6 TRAINERS’ QUALIFICATION FOR AUTOMOTIVE/LAND TRANSPORT\nSECTOR\n\nAUTOMOTIVE SERVICING - NC IV\n•\nHolder of National TVET Trainers Certificate (NTTC) Level 1 - Automotive\nServicing NC IV\n•\nMust be computer literate\n•\nMust have at least 2 years job/industry experience\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency.\n\n--- PDF PAGE 137 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n135"
