\nskills\n•\nInterview\n14. Manage\npeople\nperformance\n14.1\nAllocate work\n14.2\nAssess performance\n14.3\nProvide feedback\n14.4\nManage follow up\n\n• Discussion\n• Dual training\n• Blended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n15. Plan and\nmanage\ncompliance\nwith\nenvironmental\nregulations in a\nworkplace or\nbusiness\n15.1\nPlan and manage compliance\nwith environmental regulations\n15.2\nManage potential hazards to\nstorm water system to avoid\ncontamination\n15.3\nManage potential hazards to air\nquality to avoid contamination\n15.4\nMinimization of noise hazards is\nplanned and managed\n15.5 Management systems\n\n• Discussion\n• Dual training\n• Blended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n\n--- PDF PAGE 134 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n132",
