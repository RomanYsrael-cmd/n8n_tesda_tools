      "source_text": "Course Title: AUTOMOTIVE SERVICING\n\nNC Level NC IV\n\nNominal Training Duration:\n56 Hours (Basic Competencies)\n\n40 Hours (Common Competencies)\n708 Hours (Core Competencies)\n\n804 Hrs.\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes\nof an individual in the field of automotive servicing in accordance with industry\nstandards. It covers core competencies such as; Service diesel engine\nmanagement system; Service electronic body management system; Service\ndiesel fuel injection system components; Service electronic drive management\nsystem; Service emission control; Service and repair electronically controlled\nanti-locking braking system; Service and repair electronically operated traction\ncontrol system and Service and repair ellectronically operated stability control\nsystem.\n\nThis course is also designed to enhance the basic and common\nknowledge, skills and attitudes of an individual in the field of automotive servicing.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Utilize\nspecialized\ncommunication\nskills\n1.1 Apply communication\nstrategies to meet specific\nneeds of internal and external\nclient.\n1.2 Represent the organization in\ninternal and external forums.\n1.3 Facilitate group discussion\n1.4 Conduct interview\n• Discussion\nmethod\n• Role Play\n• Brainstorming\n• Lecture\n\n• Written test\n• Performance\ntest\n• Interview\n2. Develop team\nand individual\nneeds\n2.1 Determine development\nneeds.\n2.2 Foster individual and\norganization growth\n2.3 Monitor and evaluate\nworkplace learning\n2.4 Develop team commitment\nand cooperation\n2.5 Facilitate accomplishment of\norganizational goals\n• Discussion\n• Role playing\n• Observation\n• Written test\n• Direct\nobservation\n• Role playing\n\n--- PDF PAGE 128 ---\nAutomotive Servicing NC IV (A