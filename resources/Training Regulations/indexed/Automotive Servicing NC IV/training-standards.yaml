details of the part/\n product\n13.3 part/ product is supplied or\n ordered for customer\n\n•Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n• Distance\nlearning\n•Written test\n• Oral\nquestioning\n• Direct\nobservation\n• Project\nmethod\n•Interview\n\n--- PDF PAGE 131 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n129\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Service diesel\nengine\nmanagement\nsystem and\ncomponents\n1.1 Troubleshoot diesel engine\nmanagement system\n1.2 Test diesel engine management\ncomponents parts\n1.3 Pull out electronic control injection\npump\n1.4 Overhaul electronic control\ninjection pump\n1.5 Assemble electronic control\ninjection pump\n1.6 Calibrate electronic control injection\npump\n1.7 Install electronic control injection\npump\n\n•\nDiscussion\n•\nDual training\n•\nBlended\nlearning\n•\nWritten\n examination\n•\nDemonstration\n of practical\n skills\n•\nInterview\n2. Service\nelectronic body\nmanagement\nsystems\n2.1 Test ride/cruise control\n2.2 Test steering system\n2.3 Test power windows, electric mirror\nand security system\n2.4 Service electronic body\nmanagement and associated\ncomponents\n\n•\nDiscussion\n•\nDual training\n•\nBlended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n3. Service diesel\nfuel injection\nsystem/\ncomponents\n3.1 Overhaul mechanical control\ninjection pump and components\n3.2 Check injection pump governor\n3.3 Check automatic timer\n3.4 Install injection pump\n3.5 Check injection timing and timing\nadvance\n•\nDiscussion\n•\nDual training\n•\nBlended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n4. Service\nelectronic drive\nmanagement\nsystem\n4.1 Service electronic control automatic\ntransmission and system\ncomponent\n4.2 Service traction control\n4.3 Service over drive electronic\ncontrol\n4.4 Balance air suspension system\n4.5 Service ABS system and\ncomponent\n\n•\nDiscussion\n•\nDual training\n•\nBlended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n5. Service\nemission\ncontrol\nsystems\n5.1 Conduct pre-emission inspection\n5.2 Set emission test equipment\n5.3 Conduct emission testing for\ngasoline engine\n5.4 Conduct emission testing for diesel\nengine\n5.5 Service emission control and\nassociated components\n\n•\nDiscussion\n•\nDual training\n•\nBlended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n\n--- PDF PAGE 132 ---\nAutomotive Servicing NC IV (Amended) Promulgated December 2013\n130\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n6. Service and\nrepair\nelectronically\ncontrolled anti-\nlock braking\nsystems\n6.1 Prepare for work\n6.2 Test control system, diagnose faults\nand determine service/repair\n requirements\n6.3 Service/repair anti -lock braking\n Systems\n6.4 Clean up work area and maintain\n equipment\n• Discussion\n• Dual training\n• Blended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n7. Service and\nrepair\nelectronically\noperated\ntraction control\nsystems\n7.1 Prepare for work\n7.2 Test and control system, and\ndetermine service/repair\nrequirements\n7.3 Service/ repair electronic traction\ncontrol\n7.4 Clean up work area and maintain\n equipment\n• Discussion\n• Dual training\n• Blended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nInterview\n8. Service and\nrepair\nelectronically\noperated\nstability control\nsystems\n8.1 Prepare for work\n8.2 Test and control system, and\ndiagnose faults and determine\nservice/repair requirements\n8.3 Service/ repair electronic stability\ncontrol systems\n8.4 Clean up work area and maintain\n equipment\n• Discussion\n• Dual training\n• Blended\nlearning\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n