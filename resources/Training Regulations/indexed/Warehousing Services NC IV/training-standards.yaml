    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for WAREHOUSING SERVICES NC IV.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1 CURRICULUM DESIGN\n\nTESDA shall provide training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to include\nTechnology, Science, Math, English/Communication, Safety and Environment concerns.\nAlso included would be green technology, issues on health and drugs and catering to\npersons with disabilities (PWD’s).\n\nCourse Title: WAREHOUSING SERVICES\nNC Level : NC IV\n\nNominal Training Duration :\n\n 47 hrs\nBasic Competencies\n\n 82 hrs\nCommon Competencies\n\n 168 hrs\nCore Competencies\nTotal 297 hrs\n\n 240 hrs. SIL\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of trainees in\nWAREHOUSING SERVICES NC IV in accordance with industry standards. This covers\ncompetencies that a person must achieve supervise a warehouse team or workgroup,\noversee warehouse facilities and equipment, supervise warehouse operations and\nimplement process improvement system.\n\nThis course is also designed to enhance the knowledge, skills and attitudes/values*\nof an individual in the field of warehousing/logistics.\n\n--- PDF PAGE 77 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n75\n* Values Integration:\n\nAt the end of the course, the trainee is expected to live by the following values:\n2.3.1.1.1.1.1\n Concern and respect for others - being fair and considerate\n2.3.1.1.1.1.2\n Honesty and Integrity – being trustworthy and ethical\n2.3.1.1.1.1.3\n Responsibility and Accountability – accepts work willingly and\n Cheerfully\n2.3.1.1.1.1.4\nPerseverance - continued effort and determination in doing\n something despite obstacles; takes delight in accomplishing a task\n2.3.1.1.1.1.5 Self-control - maintaining composure; keeping emotions in\n control especially in challenging and difficult situations\n2.3.1.1.1.1.6 Lead by Example - becoming the person others want to follow\n2.3.1.1.1.1.7\nCustomer service - commitment beyond own self-interest\n2.3.1.1.1.1.8 Humility - open to other’s perspective; awareness of one’s own\n limitation\n\n This course also includes on-the-job training for the hands-on application of\nwarehousing concepts.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 78 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n76\nBASIC COMPETENCIES – NATIONAL CERTIFICATE NC IV\n(47 Hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunicatio\nn skills\n\n1.1 Meet common\nand specific\ncommunication\nneeds of clients\nand colleagues\n\n•\nRead\no\nCommunication process\no\nDynamics of groups and different\nstyles of group leadership\n•\nIdentify different approaches to meet the\nneeds of clients and colleagues\n• Lecture\n•\nWritten\nexamination\n1 hour\n1.2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n•\nApply communication skills to fulfill job\nroles as specified by the organization\n•\nApply communication techniques in\ncommunicating with clients and\ncolleagues\no\nActive listening\no\nFeedback\no\nInterpretation\no\nRole boundaries setting\no\nNegotiation\no\nEstablishing empathy\n•\nDescribe strategies for internal and\nexternal dissemination of information\n• Demonstration\n• Group\ndiscussion\n•\nObservation\n•\nOral evaluation\n1 hour\n1.3. Deliver a\ntechnical\npresentation\n• Enhance the presentation using appropriate\nmedia\n• Deliver a clear and sequential presentation\nwithin given time\n• Demonstration\n• Observation\n 1 hour\n\n1.4 Represent the\norganization\n\n•\nDescribe criteria for a good presentation\n•\nPrepare presentation material for internal\nor external forums to promote the\norganization\n• Demonstration\n•\nObservation\n1 hour\n\n--- PDF PAGE 79 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n77\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1.5 Facilitate group\ndiscussion\n•\nGather relevant information\n•\nApply values in facilitating differences in\nviews\n• Demonstration\n•\nObservation\n1 hour\n1.6 Conduct interview •\nDescribe communication strategies\nemployed in interview situations\n•\nConduct interview\n•\nApply organizations procedure in\nmaintaining records of interviews\n•\nUse questioning, listening and\nnonverbal communication techniques to\nclient groups\n• Group\ndiscussion\n• Demonstration\n•\nOral evaluation\n•\nObservation\n1 hour\n2. Develop and\nlead teams\n2.1 Foster individual\ngrowth\n\n• Discussion on Team Leadership and\nexpectation from team leaders\n• Case study on learning and development\nneeds of team members\n• Discussion on organizational requirements\nfrom team members\n• Role play on coaching and mentoring\n• Discussion on preparation of team\nmembers’ development plan\n• Role Play on providing feedback on\nperformance\n• Observation\nLecture/\nDiscussion\n• Case Study\n• Role Play\n• Written Test\n• Observation\n• Role Play\n• Case Study\n▪ Written Test\n2 hours\n2.2 Foster individual\nand team growth\n• Discussion on learning and development\nprogram goal setting\n• Preparation of learning and development\nprogram goals\n• Discussion on learning delivery methods\n• Role play on the different learning delivery\nmethods\n• Discussion on workplace learning\nopportunities\n• Role play on coaching and mentoring\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 hours\n\n--- PDF PAGE 80 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n78\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.3 Monitor and\nevaluate\nworkplace\nlearning\n•\nDiscussion on the different levels of\nlearning evaluation.\n•\nDiscussion on the different methods\nused to evaluate learning\n•\nDevelop reporting system for monitoring\nof performance attributed to learning\nprograms\n•\nGathering of information to evaluate\nindividual performance attributed to\nlearning programs\n•\nCase study on modification of learning\nplan based on performance\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 hours\n\n2.4 Develop team\ncommitment and\ncooperation\n•\nDiscussion on team commitment and\ncooperation and its impact to attainment\nof goals\n•\nPlay games on team commitment and\ncooperation\n•\nDiscussion on team dynamics and its\nrelation to team performance\n•\nPlay games on team dynamics and\nperformance\n•\nDevelopment of career plans\n\n• Lecture/\nDiscussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n1 hour\n\n2.5 Facilitate\naccomplishment\nof team goals\n• Perform team building activities towards\nimproving communication among team\nmembers, goal setting and improving\nperformance\n• Case studies involving collaborative\nactivities to improve attainment of group\ngoals\n• Group Activity\n• Case Study\n\n• Role Play\n• Case Study\n• Observation\n1 hour\n\n--- PDF PAGE 81 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n79\n3. Perform\nhigher-order\nthinking\nprocesses and\napply\ntechniques in\nthe workplace\n\n3.1 Evaluate\neffectiveness and\nefficiency of the\nworkplace\nsystems,\nprocesses and\nprocedures\n• Examine current systems, standards,\nprocedures and protocols in the workplace\n• Discuss different methods of critical and\nappreciative inquiry and their relevance to\ndifferent situations\n• Form habit of asking questions and taking\nresponsibility for answers\n• Appreciate importance of why questions\nfor individuals, businesses and\ncommunities\n• Use range of analytical techniques\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative Inquiry\n(Interview)\n• Standardized test\n1 hour\n\n--- PDF PAGE 82 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n80\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n3.2 Foster the habit\nof critical inquiry\nand curiosity in\nthe workplace\n• Discuss different methods of critical and\nappreciative inquiry and their relevance to\ndifferent situations\n• Form habit of asking questions and taking\nresponsibility for answers\n• Appreciate importance of why questions for\nindividuals, businesses and communities\n• Use range of analytical techniques, growth\nmindset and positive communication\nstrategies\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n• Discuss insights on workplace\neffectiveness and efficiency\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n\n3.3 Develop practical\naction plans for\nimproving\nworkplace\nconditions\n• Use range of analytical techniques, growth\nmindset and positive communication\nstrategies in developing action plans for\nefficiency and effectiveness\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n• Discuss concepts creative negotiation\nskills, change management and\nimprovement strategies\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n• Project-based\nlearning\n2 hours\n\n--- PDF PAGE 83 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n81\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n4. Contribute to\nthe practice of\nsocial justice\nin the\nworkplace\n\n4.1 Update self on\nlocal, national\nand global trends/\nissues in the\nworkplace\n• Explain the local, national and global\nsystems and structures\n• Discuss issues affecting interaction and\nconnectedness of communities at local,\nnational and global levels\n• Explain underlying assumptions and power\ndynamics (politics, understanding political\nsystem, social structures, labor laws, labor\nrelations, human right)\n• Monitor trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity using different media platforms\n• Analyze trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity\n• Engage in discourse about the local,\nnational and global issues\n• Interactive\nLecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 hour\n\n4.2 Relate local and\nglobal trends to\nworkplace context\n• Discuss the different levels of human identity\naccording to Amber Mayer (2015)\n• Explain different communities people\nbelong to and how these are connected\n• Recognize cultural differences and respect\nfor cultural diversity\n• Recognize differences and commonalities\namong people\n• Demonstrate attitudes of empathy,\nsolidarity and respect for diversity\n• Connect local issues to global trends, and\nvice versa.\n• Interactive\nLecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n\n1 hour\n\n--- PDF PAGE 84 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n82\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n4.3 Engage and take\nactions on\nworkplace issues\nand concerns\n• Identify the actions that can be taken\nindividually and collectively\n• Describe ethically responsible behaviour\n• Explain the importance and benefits of civic\nengagement\n• Employ appropriate actions to address\nworkplace issues involving national and\nglobal trends\n• Show concern and willingness to take part\nin the development efforts to discuss\nworkplace issues and concerns\n• Apply the attitude of “thinking globally and\nacting locally” in the workplace\n• Interactive\nLecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 hour\n5. Manage\ninnovative\nwork\ninstructions\n5.1 Review and\nanalyze existing\nworkplace\npractices\n• Show mastery of basic management\nconcepts according to Gallup, nine\ndimensions of innovative practices and\nclimate; and different types of innovation\n• Contextualize innovation to different\nvariables in the organization\n• Review current organizational practices\nwhere innovation is contextualized\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n1 hour\n\n--- PDF PAGE 85 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n83\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n5.2 Examine\nopportunities for\ncontinuous\nimprovement and\ninnovation of\npractices in the\nworkplace\n\n• Show mastery of the determinants of\ninnovative behaviors and principles of\ninnovation\n• Review current organizational practices\nwhere innovation is contextualized\n• Evaluate innovative practices in the\norganization\n• Assess innovative behaviors for promoting\ninnovation and learning in the workplace\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 hour\n\n5.3 Implement\ninnovative ways\nin the conduct of\nusual workplace\npractices\n\n• Show mastery of the determinants of\ninnovative behaviors, principles of\ninnovation; and dimensions of innovation\nclimate and strategies and techniques for\nimplementing innovation in the workplace\n• Evaluate impact of innovative practices in\nthe organization\n• Demonstrate skills in managing changes in\nthe workplace\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace reports\nof on-the-job\nperformance.\n\n1 hour\n\n--- PDF PAGE 86 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n84\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n6. Manage and\nevaluate usage\nof information\n\n6.1 Review\ninformation needs\nand sources\n• Lecture and discussion on:\no Kinds of information\no Information evaluation issues\no Information storage requirements and\nmethods\n• Analyzing record information\n• Identification of information sources\n•\nLecture\n•\nGroup\nDiscussion\n•\nHands on\n•\nDemonstration\n•\nPractical\nexercises\n•\nOral evaluation\n•\nWritten Test\n•\nObservation\n•\nPresentation\n2 Hours\n\n6.2 Collect and\nanalyze\ninformation\n• Lecture and discussion on:\no Information collection and collation\no Relevant trends and developments\n• Collection of information\n• Analyzing information\n•\nLecture\n•\nGroup\nDiscussion\n•\nHands on\n•\nDemonstration\n•\nPractical\nexercises\n•\nOral evaluation\n•\nWritten Test\n•\nObservation\n•\nPresentation\n2 Hours\n\n6.3 Use management\ninformation\nsystems\n• Lecture and discussion on:\no Management information systems\no Available technology in information\nmanagement\no Advance strategies for customer\nservice excellence\n• Use of available technology in information\nmanagement\no Lecture\no Group\nDiscussion\no Hands on\no Demonstration\no Practical\nexercises\no Oral evaluation\no Written Test\no Observation\no Presentation\n2 Hours\n\n6.4 Report and\ndisseminate\nanalyzed\ninformation\n• Lecture and discussion on:\no Reporting procedures of the\norganisation\no Analysis and display techniques\n• Using management information systems to\nstore and retrieve data\no Lecture\no Group\nDiscussion\no Hands on\no Demonstration\no Practical\nexercises\no Oral evaluation\no Written Test\no Observation\no Presentation\n2 Hours\n\n--- PDF PAGE 87 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n85\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n7. Lead in\nimprovement\nof\nOccupational\nSafety and\nHealth (OSH)\nprograms,\npolicies and\nprocedures\n7.1 Assess\nOccupational\nSafety and Health\n(OSH) practices\nand programs\n• Case Study in evaluating current OSH\nprograms effectiveness\n• Practice auditing the workplace\n• Lecture\n• Group\nDiscussion\n• Case Study\n• Group Project\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\nPortfolio\n2 hours\n\n7.2 Recommend\n OSH program\n improvement\n initiatives\n• Writing and Presenting Action Plans to\nimprove OSH compliance in the workplace\nand/or increase effectiveness of OSH\nPrograms\n• Lecture\n• Group\nDiscussion\n• Case Study\n• Group Project\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\n Questioning\n•\nPortfolio\n1 Hours\n\n7.3 Implement\nrecommended\nimprovements on\nOccupational\nSafety and\nHealth (OSH)\nPrograms,\nProcedures and\nPolicies\n• Role play in increasing the OSH\nawareness\n• Measuring the impact of the new OHS\nprogram or initiative\n• Lecture\n• Group\nDiscussion\n• Case Study\n• Group Project\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\n Questioning\n Portfolio\n1 Hours\n8. Lead towards\nimprovement\nof\nenvironmental\nwork\nprograms,\npolicies and\nprocedures\n8.1 Assess\nenvironmental\nwork practices\nand programs\n• Discussion of Green structural change and\nretraining needs\no What is green structural change and\nwhere is it happening\no Workforce restructuring and\nadjustment\no Employment effects of Environment\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 hour\n\n--- PDF PAGE 88 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n86\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\no Sectors most affected by green\nrestructuring\no Retraining and skills upgrading\no Effective and equitable restructuring:\nGood practices and programs by public\nand private sector actors\n• Perform Impact Assessment\n• Discussions of Gender Implications\n\n8.2 Recommend\nenvironmental\nprogram\nimprovement\ninitiatives\n• Practicing Leadership skills: The biggest\nchallenge in transition to a low-carbon\neconomy or environment friendly activities\n• Practicing Basic Business planning\n• Opportunities Management - Identification\nof low-carbon and Resource scarcity risks\n• Perform Cost–benefit Analysis\n\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 hour\n\n8.3 Implement\nrecommended\nimprovements on\nenvironmental\nprograms,\npolicies and\nprocedures\n• Practicing Environmental Awareness\nRaising (Communication/ Implementation\ncampaigns)\n• Teaching and training personnel -\nnecessary skills and methods to impart\nenvironmental knowledge, to create\nawareness and to react flexibly to ever-\nchanging labor market needs.\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Case Study\n• Reporting\n\n• W