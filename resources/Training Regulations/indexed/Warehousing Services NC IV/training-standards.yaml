      "source_text": "Trainees or students who wants to enroll in this course must possess the following\nrequirements:\n\n•\nMust have completed the ten (10) year basic education or an Alternative Learning System\n(ALS) Certificate of Completion with Grade 10 equivalent holder\n•\nMust possess good communication skills\n•\nMust be computer literate\n•\nMust be knowledgeable in Inventory Management/Warehouse Management System\n•\nMust have an experience in supervising people\n\n3.4 EQUIPMENT\nLIST OF EQUIPMENT AND MATERIALS\nWAREHOUSING SERVICES NC IV\n\nRecommended list of tools, equipment and materials for the training of a maximum of\n25 trainees for WAREHOUSING SERVICES NC IV are as follows:\n\nEQUIPMENT *\nQty\nUnit\nSpecification/s /Description\n1\nPc\nDesktop Computer Internet connection capability\n1\nPc\nLaptop With compatible printer\n1\nPc\nMulti-media projector\n1\nSet\nAudio Equipment\n\nNote:\n* The above equipment can be available on site.\n\nSAFETY/PPEs\nQty\nSpecification/s\n1 set\nSafety gloves\nReflectorized Vest\nHard hat\nSafety goggles\nSafety shoes. Steel toed\nDust Mask\nApron\n\n--- PDF PAGE 115 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n113\nROOM FURNITURES\nQty\nUnit\nSpecification/s\n25\npcs\n Arm chair, plastic 17 ½” seat height\n1\nset\nTeacher’s table and chair\nSingle pedestal, 48\" W x 30\" D x 29-1/2\" H\n1\npc\nProjector overhead stand\n1\npc\nWhite board, wall mounted. 4 ft. x 8 ft.\n1\npc\nFlip board (foldable), flip chart\n1\n pc\nCorkboard\n\nSUPPLIES / MATERIALS\nQty\nSpecification/s\n3 pcs\nWhite Board Markers\n1 pc\nWhite Board Eraser\n25 pcs\nKraft Paper\n2 pcs\neach\nScanned Sample Forms – Sales Order, Purchase Order, Delivery Order,\nTransfer Order, Bad Order Form, Count Tags, Count Sheets ,Performance\nAppraisal forms\n\nLIBRARY HOLDINGS / REFERENCE MATERIALS\nQty\nSpecification/s\n1\n101 Thoughts on Supply Chain Management\n1\nReference materials on Warehousing Management\nJournals/Magazines\n1\nBasic Supervisory Skills handbook\n1\nVideo on warehouse equipment /racks\n1\nLabor Code of the Philippines\n1\nOSHS Manual\n1\nCustomer Response System Manual\n1\nCount Manuals\n1\nCompany Policies\n1\nCompany Procedure Manuals\n\n NOTE: The Training Center has the option to partner with a private/public establishment\nthat has the capability to conduct warehousing services training.\n\n--- PDF PAGE 116 ---\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n114",
