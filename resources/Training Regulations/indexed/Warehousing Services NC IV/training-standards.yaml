CATIONS FOR WAREHOUSING SERVICES NC IV\n\nTrainers who will deliver the training on Warehousing Services NC IV should possess the\nfollowing qualifications:\n\n•\nMust be a holder of NTTC Level I in Warehousing Services NC IV\n•\nMust possess good communication skills\n•\nMust have at least 5 years’ experience as supervisor with knowledge in Inventory\nManagement –Warehouse Management (IM-WM) system\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees in a structured learning program to\ndetermine their achievement of units of competencies. It is administered by the trainer/assessor\nat end of each learning module.\n\n--- PDF PAGE 117 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n115"
