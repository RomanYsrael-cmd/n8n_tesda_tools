cuss the following:\no Inventory Management and\n Warehouse management\n➢ Inter-relationship\n➢ Importance\n➢ Software\n\no Inventory\n➢ Importance\n➢ Different\ninventory\ntransactions\n➢ Processes and controls\n➢ Policies and procedures\n➢ Reports\n\no Inventory Count\n➢ Importance\n➢ Types\n➢ Process\n➢ Frequency\n➢ Analysis and\nReconciliation\n➢ Inventory Count Reports\n\n•\nDemonstrate ability to\no Explain\nthe\nimportance\nof\nconducting an inventory count\no Enumerate the steps to be taken\nwhen conducting an inventory\ncount\no Prepare a sample report on the\nresults of the inventory count\n\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Oral Examination\n• Written\nExamination\n• Case study\n• Demonstration\n24 hrs\n\n--- PDF PAGE 108 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n106\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.3 Engage with\nefficient transport\nand logistics\nservice providers\n•\nRead and understand\no Local geographical /territorial\nmapping\no Applicable transport\ngovernment regulatory\nrequirements\n\n•\nDiscuss the following:\no Customer transport\nrequirements\no Transport planning system\n➢ Definition\n➢ Advantages\n➢ Truck Capacity\n➢ Various transport\nmodes and criteria for\nits utilization\n➢ Route planning\n➢ Metrics\n\no Efficient transport and logistics\n providers\n➢ Third party contract\nmanagement\n➢ Selection process\n➢ Awarding Contract\n➢ Terms and Conditions\n➢ Service and freight rates\nnegotiation\n➢ Metrics\n➢ Performance review\n➢ Delivery Efficiency\n➢ Customer feedback\n➢ Performance results\n➢ Regular Updates\n• Lecture\n• Group Discussion\n• Demonstration\n\n•\nOral\nExamination\n•\n Written\nExamination\n\n8 hrs\n\n--- PDF PAGE 109 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n107\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nDemonstrate the ability to\no Select the efficient transport\nmode and provider to meet\ncustomer requirements\n\n•\nDemonstrate the ability to compute\nfor\no Space capacity for different\ntransport units\no Freight charges for air\nshipments\no Weight limit for trucks\no Freight rate estimates for\ntransport routes from\nwarehouse location to a\nparticular delivery point\n\n4. Implement\nprocess\nimprovement\nsystem\n4.1 Evaluate\noperational\nperformance\n•\nDiscuss the following:\no Warehousing Operations and\nTransport Logistics Key\nPerformance Indicators\n➢ Importance\n➢ Metrics\n➢ How to measure\nperformance using KPI’s\n➢ Analysing performance\nresults\n➢\n•\nDemonstrate the ability to perform\no Assess performance using\nKPI’s\no Analyze results and make\nrecommendations\n\n• Lecture\n• Group Discussion\n• Demonstration\n\n•\nWritten Exam\n•\nOral Examination\n8 hrs\n\n--- PDF PAGE 110 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n108\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n4.2 Adapt process\nimprovement\n•\nRead and understand\no Change management\n\n•\nDiscuss the following:\no Process improvement\nprogram\n➢ Concepts and Importance\n➢ Types of process\nimprovement\n➢ Warehouse and logistics\nprocess analysis\n➢ How to develop process\nimprovements\n➢ Select and adapt process\nimprovement\n➢ Review process\nimprovement results\no Benchmarking\n➢ Concepts and importance\n➢ How to do benchmark with\nbest industry practices\n\n•\nDemonstrate the ability to\no Develop a process\nimprovement based on a\nscenario to streamline\nreceiving lead –time\n• Lecture\n• Group Discussion\n• Demonstration\n\n•\nWritten Exam\n•\nOral Examination\n16 hrs\n\n--- PDF PAGE 111 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n109\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n4.3 Calibrate targets\n based on historical\n performance\nresults\n•\nRead and understand\no Supply Chain Operational\nReference Model (SCOR)\no Warehouse and logistics\nanalytics\n•\nDiscuss the following:\no Calibration of targets\no When to consider calibration\no Factors to consider prior to\ncalibration\n➢ Timing\n➢ Historical and current\ndata\n➢ Effect on stakeholders\no Monitor performance results\no Reviews key performance\ntargets against historical\nperformance\no Adjust performance targets\n\n•\nDemonstrate ability to perform\no How to analyze historical data\no How to prepare performance\nreport\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written Exam\n• Oral Examination\n16\n\n--- PDF PAGE 112 ---\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n110\n3.2 TRAINING DELIVERY (TO BE REVISED)\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to meet industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-\nwork components.\n\n--- PDF PAGE 113 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n111\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training\nis integrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted\nby non-government organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings such as\nbarangay hall, basketball courts, etc. These programs can also be mobile\ntraining program (MTP).\n\n--- PDF PAGE 114 ---\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n112\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wants to enroll in this course must possess the following\nrequirements:\n\n•\nMust have completed the ten (10) year basic education or an Alternative Learning System\n(ALS) Certificate of Completion with Grade 10 equivalent holder\n•\nMust possess good communication skills\n•\nMust be computer literate\n•\nMust be knowledgeable in Inventory Management/Warehouse Management System\n•\nMust have an experience in supervising people\n\n3.4 EQUIPMENT\nLIST OF EQUIPMENT AND MATERIALS\nWAREHOUSING SERVICES NC IV\n\nRecommended list of tools, equipment and materials for the training of a maximum of\n25 trainees for WAREHOUSING SERVICES NC IV are as follows:\n\nEQUIPMENT *\nQty\nUnit\nSpecification/s /Description\n1\nPc\nDesktop Computer Internet connection capability\n1\nPc\nLaptop With compatible printer\n1\nPc\nMulti-media projector\n1\nSet\nAudio Equipment\n\nNote:\n* The above equipment can be available on site.\n\nSAFETY/PPEs\nQty\nSpecification/s\n1 set\nSafety gloves\nReflectorized Vest\nHard hat\nSafety goggles\nSafety shoes. Steel toed\nDust Mask\nApron\n\n--- 