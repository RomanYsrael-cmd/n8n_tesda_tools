 use\n1.9 Emergency\n procedures\n\n1.1 Completing\n workplace\n orientation and\n induction\n procedures\n1.2 Comprehending\n workplace\n information, and\n procedures\n1.3 Following\n operational\n instructions\n1.4 Working\n collaboratively\n with others\n1.5 Applying\n precautionary\n measures to\n eliminate\n workplace\n hazards\n1.6 Identifying and\n using appropriate\n personal\n protective\n equipment\n1.7 Working safely to\n avoid inflicting\n injury to self and\n others, or damage\n to goods or\n property and\n equipment\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n41\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Perform\nassigned\nworkload\n\n2.1 Priorities, schedules and\n deadlines are agreed\n with stakeholders\n2.2 Work activities are\n planned and work\n progress is\n communicated\n2.3 Work is completed in\n accordance with\n workplace procedures\n and standards.\n2.4 Work improvement is\n discussed with\n appropriate personnel\n prior to implementation\n2.1 System of\n establishing\n priorities and\n deadlines\n2.2 Work plan and\n method of\n monitoring work\n progress\n 2.3 Workplace\n metrics\n2.4 Innovation\n techniques\n\n2.1 Establishing\n priorities and\n deadlines\n2.2 Work planning\n2.3 Monitoring work\n progress\n2.4 Completing work\n within the\n acceptable\n standards\n2.5 Brainstorming\n\n3. Apply ethical\npractices\n\n3.1 Relevant regulations\nand legislation are\nidentified and complied\n3.2 Code of ethics is\nobserved\n3.3 Deadlines and\ncommitments are met\n3.4 Required confidentiality\nis maintained\n3.5 Workplace security\npolicies are followed\n3.1 Relevant\n regulations and\n legislation\n3.2 Code of Ethics\n3.3 Work ethics\n3.4 Commitment\n Dates\n3.5 Timelines\n3.6 Contract\n “confidentiality”\n clause\n3.7 Data privacy act\n3.8 Workplace\n security policies\n3.9 Gender\n Sensitivi