        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Followed proper hiring and staffing procedures\n1.2 Applied coaching and mentoring techniques in developing staff\n1.3 Conducted performance appraisal\n1.4 Developed training program\n2. Resource Implications\n\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately simulated\n environment where assessment can take place\n2.2 Documents and forms relevant to the proposed activity or task\n2.3 Company Standard Operating Procedures\n2.4 Company Code of Conduct\n2.5 Applicable Government Labor Laws\n3. Methods of Assessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Oral Examination\n3.3 Interview\n3.4 Demonstration\n4. Context of Assessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 66 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n64\n\nUNIT OF COMPETENCY:\nOVERSEE WAREHOUSE FACILITIES AND EQUIPMENT\n\nUNIT CODE :"
        },
        "source_text": "LOG333312\n\nUNIT DESCRIPTOR : This unit involves the skills and knowledge required to organize,\ntrain and supervise a warehouse team or workgroup to\nmaximize operational efficiency. This also involves the skills and\nknowledge to conduct performance appraisals and to upgrade\ncompetencies.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE as\nREQUIRED\nSKILLS\n1. Determine\nappropriate staffing\nlevels and assign\nworkload\n\n1.1 Competencies and\nskills requirements\nfor warehouse\ntasks are\ndetermined in\naccordance with the\nworkplace\nrequirements\n1.2 Job descriptions,\nroles and\nresponsibilities for\neach position are\nprepared\naccordingly\n1.3 Tasks, roles and\nresponsibilities are\nconcurred and\ndocumented with the\nwarehouse staff.\n1.4 Additional\nwarehouse staff are\nhired as needed\n\n1.1 Oral and written\n Communication\n1.2 Company Code of\n Ethics\n1.3 Personnel\n Management\n1.4 Organizational\n Development\n1.5 Warehouse\n positions,\n roles, tasks and\n responsibilities\n1.6 Competencies and\n Skills for\n warehouse positions\n1.7 Workplace hiring and\n selection process\n1.8 Preparing Job\n Description\n1.9 Labor Code of the\n Phils.\n\n1.1 Practising\n excellent\n communication\n and\n interpersonal\n skills\n1.2 Supervising\n Skills\n1.3 Practising\n code of ethics\n1.4 Determining\n warehouse\n tasks, roles and\n Responsibilities\n1.5 Screening and\n Interviewing\n1.6 Hiring and\n selecting\n warehouse\n staff\n1.7 Exercising\n Good judgment\n1.8 Writing job\n description\n1.9 Decision-\n Making\n1.10 Assigning\n workloads\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n60\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE as\nREQUIRED\nSKILLS\n2. Mentor warehouse\n staff\n2.1 Goals and targets\nare discussed with\nthe warehouse staff.\n2.2 Warehouse staff are\ntrained and re-\ntrained on new\ndevelopments\n2.3 Coaching and\nmentoring are\napplied as needed\n2.4 Cross-posting is\ndone when feasible\n2.1 Warehouse goals\n and targets\n2.2 Personnel training\n and development\n2.3 Leadership\n2.4 Coaching and\n Mentoring\n2.5 Negotiation\n2.6 Cross-posting\n\n2.1 Setting goals\n and targets\n2.2 Conducting\n personnel\n training\n2.3 Leading a team\n2.4 Coaching\n2.5 Mentoring\n2.6 Implementing\n cross-posting\n\n3. Conduct\n performance\nappraisal of\nwarehouse staff.\n3.1 Performances of\nwarehouse staff are\nassessed on regular\nintervals.\n3.2 Results of\nperformance\nappraisal of\nwarehouse staff are\ndocumented and\nconcurred.\n3.3 Assists in the\ndevelopment of\nPersonnel\nperformance\nimprovement plans\n(PPIP) through\nTraining Needs\nAnalysis (TNA)\n3.4 Commendations\nand disciplinary\nactions are given as\nnecessary\n3.1 Performance Appraisal\n3.2 Personnel\n Performance\n Improvement Plan\n3.3 Company Code of\n Conduct\n3.4 Training Needs\n Analysis (TNA)\n\n3.1 Conducting\n performance\n Appraisal\n3.2 Developing\n personnel\n performance\n improvement\n plan\n3.3 Implementing\n code of\n conduct\n3.4 Analyzing\n training\n needs\n\n4. Enhance warehouse\nstaff skills\n4.1 Assists in the\npreparation of the\ncompetencies and\nskills inventory of\neach warehouse\nstaff\n4.2 Personnel\n Performance\n Improvement plan\n (PPIP) is concurred\n4.3 Training programs\nare implemented to\nsupport PPIP\n4.1 Skills enhancement\n4.2 Competencies and\n Skills Inventory\n 4.3 Training program\n4.1 Enhancing\n Skills\n4.2 Concurring\n performance\n improvement\n plan\n4.3 Assessing\n competencies\n and skills\n\n4.4 Implementing\n Training\n programs\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n61\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Warehouse Tasks\nMay include:\n1.1 Receiving\n1.2 Storing\n1.3 Picking\n1.4 Put-away\n1.5 Issuing\n1.6 Dispatching\n1.7 Transferring\n1.8 Encoding\n1.9 Documentation\n1.10 Loading\n1.11 Attend to customer queries/complaints\n1.12 Physical Count\n1.13 Reverse logistics\n2. Job Description\nMay include:\n2.1 Job Title\n2.2 Position Description\n2.3 Job Qualifications\n2.4 Skills and Competencies\n2.5 Scope of Work\n2.6 Roles and Responsibilities\n2.7 Reporting /Accountabilities\n2.8 Performance Appraisal Schedule\n2.9 Authority Limits (if applicable)\n\n3. Goals and Targets\nMay include:\n3.1 Company goals\n3.2 Sales targets\n3.3 Performance targets\n3.4 Productivity targets\n3.5 Safety targets\n3.6 Cost Efficiency targets\n4. Cross-posting\nMay include:\n4.1 Inter-department\n4.2 Intra-department\n4.3 Company subsidiary\n4.4 Inter-branch\n5. Regular Intervals\nMay include:\n5.1 Quarterly\n5.2 Semi-Annually\n5.3 Annually\n6. Personnel Performance\nImprovement Plans\n(PPIP)\nMay include:\n6.1 On the job training\n6.2 Mentoring\n6.3 Coaching\n6.4 Seminars or workshops\n6.5 Web-based/E-learning\n6.6 Diploma course\n6.7 Values Formation/Enhancement\n6.8 Cross-posting\n6.9 Special projects\n\n--- PDF PAGE 64 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n62\nVARIABLE\nRANGE\n6.10 Task–force membership\n6.11 Field work\n6.12 Post Training Evaluation\n\n7. Commendations\n\nMay include:\n7.1 Promotion Letter\n7.2 Letter of Merit\n7.3 Recognition Award\n7.4 Letter of Commendation from Customers\n7.5 Monetary incentives\n7.6 Productivity Bonus\n\n8. Competencies and Skills\nInventory\nMay include:\n8.1 Knowledge in Forklift Operations\n8.2 Proficient in Microsoft Office software\n8.3 IM/WM software\n8.4 Administrative skills\n8.5 Occupational Safety and Health Standards\n8.6 Customer Service\n8.7 Warehouse Operation\n8.8 Materials handling equipment\n8.9 Driving Skills\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n63\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Followed proper hiring and staffing procedures\n1.2 Applied coaching and mentoring techniques in developing staff\n1.3 Conducted performance appraisal\n1.4 Developed training program\n2. Resource Implications\n\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately simulated\n environment where assessment can take place\n2.2 Documents and forms relevant to the proposed activity or task\n2.3 Company Standard Operating Procedures\n2.4 Company Code of Conduct\n2.5 Applicable Government Labor Laws\n3. Methods of Assessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Oral Examination\n3.3 Interview\n3.4 Demonstration\n4. Context of Assessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 66 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n64\n\nUNIT OF COMPETENCY:\nOVERSEE WAREHOUSE FACILITIES AND EQUIPMENT\n\nUNIT CODE :"
