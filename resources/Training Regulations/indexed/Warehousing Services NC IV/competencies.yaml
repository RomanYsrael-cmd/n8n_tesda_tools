        "source_text": "LOG432201\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to apply\nworkplace procedures in warehousing operations. It includes\nidentifying\ncritical\naspects\nof\nwarehousing\noperations,\nperforming workload, and applying ethical practices.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify critical\naspects of the\nwarehousing\noperations\n\n1.1 The layout of the\nworkplace, the flow of\nmaterials and\ngoods/stocks (where\nrelevant) and the\nworkplace procedures\nin each work area are\nidentified\n\n1.2 Organizational structure\nand working relationship\nis identified\n\n1.3 Individual responsibilities\nunder employment\ncontracts are adhered to.\n\n1.4 Workplace hazards are\nidentified and eliminated.\n\n1.5 Appropriate personal\nprotective equipment\n(PPE) are identified and\nused in accordance with\nsafety regulations and\nworkplace requirements.\n\n1.6 Workplace emergency\nprocedures are identified\nand followed in real and\nsimulated emergency\nsituation\n1.1 Site or workplace\n layout\n1.2 Workplace\n procedures and\n standards\n1.3 OS&H and\n environmental\n protection\n responsibilities\n1.4 Company rules\n and regulations\n1.5 Organizational\n and workplace\n structure\n1.6 Roles and\n responsibilities of\n individuals in the\n workplace\n1.7 Workplace\n hazards handling\n procedures\n1.8 Personal\n protective\n equipment and\n instructions of its\n use\n1.9 Emergency\n procedures\n\n1.1 Completing\n workplace\n orientation and\n induction\n procedures\n1.2 Comprehending\n workplace\n information, and\n procedures\n1.3 Following\n operational\n instructions\n1.4 Working\n collaboratively\n with others\n1.5 Applying\n precautionary\n measures to\n eliminate\n workplace\n hazards\n1.6 Identifying and\n using appropriate\n personal\n protective\n equipment\n1.7 Working safely to\n avoid inflicting\n injury to self and\n others, or damage\n to goods or\n property and\n equipment\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n41\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Perform\nassigned\nworkload\n\n2.1 Priorities, schedules and\n deadlines are agreed\n with stakeholders\n2.2 Work activities are\n planned and work\n progress is\n communicated\n2.3 Work is completed in\n accordance with\n workplace procedures\n and standards.\n2.4 Work improvement is\n discussed with\n appropriate personnel\n prior to implementation\n2.1 System of\n establishing\n priorities and\n deadlines\n2.2 Work plan and\n method of\n monitoring work\n progress\n 2.3 Workplace\n metrics\n2.4 Innovation\n techniques\n\n2.1 Establishing\n priorities and\n deadlines\n2.2 Work planning\n2.3 Monitoring work\n progress\n2.4 Completing work\n within the\n acceptable\n standards\n2.5 Brainstorming\n\n3. Apply ethical\npractices\n\n3.1 Relevant regulations\nand legislation are\nidentified and complied\n3.2 Code of ethics is\nobserved\n3.3 Deadlines and\ncommitments are met\n3.4 Required confidentiality\nis maintained\n3.5 Workplace security\npolicies are followed\n3.1 Relevant\n regulations and\n legislation\n3.2 Code of Ethics\n3.3 Work ethics\n3.4 Commitment\n Dates\n3.5 Timelines\n3.6 Contract\n “confidentiality”\n clause\n3.7 Data privacy act\n3.8 Workplace\n security policies\n3.9 Gender\n Sensitivity Policy\n\n3.1 Identifying\n relevant\n regulations and\n legislation\n3.2 Applying code of\n ethics\n3.3 Meeting deadlines\n and commitments\n3.4 Maintaining\n required\n confidentiality\n3.5 Following\n workplace security\n policies\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n42\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Workplace Procedures\nMay include:\n1.1\nCompany procedures\n1.2\nEstablished departmental procedures\n1.3\nWork Instructions/ Process Flows\n1.4\nSecurity and safety procedures\n2. Hazards\n\nMay include:\n2.1\nVehicular traffic and pedestrians\n2.2\nUneven ground, steps, roads, and work surfaces\n2.3\n Dust and vapors\n2.4\nHazardous or dangerous materials\n2.5\nHumidity and extreme temperatures\n2.6\nLight including UV rays\n2.7\nNoise\n2.8\nWorking at heights\n3. Personal Protective\nEquipment (PPE)\nMay include:\n3.1\nDust mask\n3.2\nHard Hat\n3.3\nHairnet/Head Cap\n3.4\nSafety shoes\n3.5\nGloves\n3.6\nSafety goggles\n3.7\nEar muff/ear plug\n3.8\nSunscreen\n3.9\nHigh visibility clothing\n3.10 Thermal jacket/pants\n3.11 Harness\n\n4.\nAppropriate Personnel\nMay include:\n4.1\nManagers\n4.2\nSupervisors/team leaders\n4.3\nWorkplace personnel\n4.4\nContractors\n4.5\nOfficial representatives\n4.6\nUnion representatives\n4.7\nIndustrial relations\n4.8\nOS&H specialists\n4.9\nOther professional or technical staff\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n43\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified the layout of the workplace, the flow of\nmaterials and goods and the workplace procedures in\neach work area\n1.2 Identified\nand\nfollowed\nworkplace\nemergency\nprocedures in real and simulated emergency situation\n1.3 Planned work activities and prepared work progress\nreport\n1.4 Completed work in accordance with the workplace\nprocedures and standards\n1.5 Identified relevant regulations and legislation\n1.6 Applied appropriate code of ethics\n\n2. Resource Implications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant\nto the activities\n3. Methods of Assessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Test\n3.2 Direct observation and oral questioning\n3.3 Interview\n4. Context of Assessment\n\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA accredited Assessment\nCenter.\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n44\nUNIT OF COMPETENCY:\nPERFORM INDUSTRY CALCULATIONS IN\nWAREHOUSING OPERATIONS\n\nUNIT CODE :"
