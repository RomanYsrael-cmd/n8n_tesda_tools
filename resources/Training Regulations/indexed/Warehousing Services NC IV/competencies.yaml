          "source_text": "REQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Evaluate \neffectiveness \nand efficiency \nof the \nworkplace \nsystems, \nprocesses and \nprocedures. \n1.1 Effectiveness and \nefficiency of \nworkplace standards \nand procedures are \nexamined. \n1.2. Usage of inquiry and \ndialogue to \ncommunicate \nevaluation measures \nand results are \nimplemented. \n1.3   Evaluation reports are \nprepared and \ncommunicated to team \nmembers. \n \n1.1  Systems,   \n standards,   \n procedures and  \n protocols in the  \n workplace. \n1.2  Different \nmethods of \ncritical and \nappreciative \ninquiry and their \nrelevance to \ndifferent \nsituations \n1.3 Techniques to \nassist in forming \nthe habit of \nasking questions \nand taking \nresponsibility for \nanswers. \n1.4 Why questions \nare important and \nthe benefits of \nasking good \nquestions for \nindividuals, \nbusinesses and \ncommunities (the \nimportance of \ncritical thinking). \n1.1 Using range of \nanalytical \ntechniques (e.g., \nplanning, attention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation). \n1.2 Communicating to \nactive listening and \nasking questions to \nothers in a \nconstructive way. \n1.3 Using critical \nthinking pathway to \nformulating and \nasking relevant \nquestions and \ncoming up with \nappropriate \nanswers. \n1.4 Performing \nassimilation and \naccommodation \nskills to interpret \nand distil key \ninformation of \nrelevance to a \ngiven situation. \n1.5 Assessing and \nmeasuring the \nextent of \neffectiveness and \nefficiency of the \nsystems, processes \nand procedures in \nthe workplace.\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing Services NC IV  \nPromulgated (12/17/2019)  \n \n \n \n14 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2. Foster the \nhabit of critical \ninquiry and \ncuriosity in the \nworkplace. \n2.1 Issues and situations \nare reflected on and \nwondered about. \n2.2 Issues and problems \nin the workplace \nparticularly in the \npolicies, procedures \nand protocols are \ndiscussed and \nevaluated between \nand among teams. \n2.3 Evaluation of \nefficiency and \neffectiveness of \nworkplace policies, \nprocedures and \nprotocols are \ndocumented, \ncommunicated and \nagreed upon between \nand among teams. \n2.4 Growth mindset and \npositive relationship \nand communication is \napplied in the context \nof curiosity and \ncritical inquiry in the \nworkplace. \n2.1 Different methods \nof critical and \nappreciative \ninquiry and their \nrelevance to \ndifferent \nsituations. \n2.2 Techniques to \nassist in forming \nthe habit of \nasking questions \nand taking \nresponsibility for \nanswers. \n2.3 Why questions \nare important and \nthe benefits of \nasking good \nquestions for \nindividuals, \nbusinesses and \ncommunities (the \nimportance of \ncritical thinking). \n2.4 Growth mindset \nand positive \ncommunication \nand relationship \nstrategies and \ntechniques. \n2.1 Using range of \nanalytical \ntechniques (e.g., \nplanning, attention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation). \n2.2 Communicating to \nactive listening and \nasking questions to \nothers in a \nconstructive way. \n2.3 Using critical \nthinking pathway to \nformulating and \nasking relevant \nquestions and \ncoming up with \nappropriate \nanswers. \n2.4 Performing \nassimilation and \naccommodation \nskills to interpret and \ndistil key information \nof relevance to a \ngiven situation. \n2.5 Assessing and \nmeasuring the \nextent of \neffectiveness and \nefficiency of the \nsystems, processes \nand procedures in \nthe workplace. \n2.6 Communicating \ninsights on \nworkplace \neffectiveness and \nefficiency.\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing Services NC IV  \n \nPromulgated (12/17/2019)  \n \n \n15 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Develop \npractical \naction plans \nfor improving \nworkplace \nconditions. \n3.1 Evaluation of efficiency \nand effectiveness of \nworkplace policies, \nprocedures and \nprotocols are \ndocumented, \ncommunicated to \nstakeholders. \n3.2 Practical action plans \nin improving workplace \nconditions are \nformulated, presented \nand negotiated with \nstakeholders. \n3.3 Proposed changes and \ndirections are inquired, \nprocessed and \nnegotiated between \nand among teams, and \nstakeholders as well of \nthe organization. \n3.4 Commitment to \ncontinuous \nimprovement and \nchange is highlighted. \n3.5 Passion and dedication \nfor changing and \nadapting to the \ndemands of the 21st \ncentury workplace are \nconsidered. \n3.1 Different methods \nof critical and \nappreciative \ninquiry and their \nrelevance to \ndifferent \nsituations. \n3.2 Techniques to \nassist in forming \nthe habit of \nasking questions \nand taking \nresponsibility for \nanswers. \n3.3 Why questions \nare important and \nthe benefits of \nasking good \nquestions for \nindividuals, \nbusinesses and \ncommunities (the \nimportance of \ncritical thinking). \n3.4 Growth mindset \nand positive \ncommunication \nand relationship \nstrategies and \ntechniques. \n3.5 Creative \nnegotiation skills. \n3.6 Change \nmanagement and \ncontinuous \nimprovement \nconcepts. \n3.1 Using range of \nanalytical techniques \n(e.g., planning, \nattention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation). \n3.2 Communicating to \nactive listening and \nasking questions to \nothers in a \nconstructive way. \n3.3 Using critical thinking \npathway to \nformulating and \nasking relevant \nquestions and \ncoming up with \nappropriate answers. \n3.4 Performing \nassimilation and \naccommodation \nskills to interpret and \ndistil key information \nof relevance to a \ngiven situation. \n3.5 Assessing and \nmeasuring the extent \nof effectiveness and \nefficiency of the \nsystems, processes \nand procedures in \nthe workplace. \n3.6 Communicating \npractical insights on \nimproving workplace \nconditions.\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing Services NC IV  \nPromulgated (12/17/2019)  \n \n \n \n16 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Effectiveness and \nefficiency  \nMay include but not limited to: \n1.1 Developing a more efficient way of doing something \n1.2 Developing a new idea \n1.3 Developing and improving products and services  \n1.4 Enhancing skills and career opportunities \n1.5 Enhancing the physical environment \n1.6 Financial benefit \n1.7 Greater personal satisfaction \n1.8 Improving interpersonal relationships \n1.9 Evaluating overall workplace conditions \n2. Curiosity and critical \ninquiry \nMay include but not limited to: \n2.1 \nAccuracy \n2.2 \nBreadth \n2.3 \nClarity \n2.4 \nDepth \n2.5 \nEmotion \n2.6 \nFairness \n2.7 \nLogic \n2.8 \nMeaning \n2.9 \nPlanning \n2.10 \nAttention \n2.11 \nPrecision \n2.12 \nRelevance  \n2.13 \nSignificance \n2.14 \nSocial engagement \n2.15 \nSociety  \n2.16 \nStyle \n2.17 \nGrowth mindset \n2.18 \nPositive communication \n2.19 \nPositive negotiation \n2.20 \nWorkplace conditions \n2.21 \nAppreciative inquiry methods\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing Services NC IV  \n \nPromulgated (12/17/2019)  \n \n \n17 \nVARIABLE \nRANGE \n3. Practical action plans \nMay include but not limited to: \n3.1     Insights on continuous improvement \n3.2     Creative strategies and techniques for becoming better at    \n    work and real life \n3.3     Career plans \n3.4     Challenging workplace policies, procedures and protocols \n3.5     Specifying plans for change and adapting to the demands    \n            of the contemporary workforce \n3.6     Challenges in negotiating with stakeholders and teams \n3.7     Change management, innovation and knowledge creation \n3.8     Contractual agreements \n3.9     Extreme time pressure or non-negotiable deadlines \n3.10 Financial limitations \n3.11 Procedures determined by laws or other regulations \n3.12 Safety issues \n3.13 When others are totally closed to new ideas \n3.14 acknowledging shared responsibility  \n3.15 adopting a positive 'can do' attitude \n3.16 following up on practical details \n3.17 pro-actively seeking information  \n3.18 suggesting a new approach \n3.19 talking to others about possible answers \n3.20 constraints of the broader context and environment \n3.21 overall goal - what needs to be achieved \n3.22 personal hopes and expectations\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing Services NC IV  \nPromulgated (12/17/2019)  \n \n \n \n18"
