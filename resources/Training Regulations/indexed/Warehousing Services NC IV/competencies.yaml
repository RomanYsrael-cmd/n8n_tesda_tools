        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Identified and implemented learning opportunities for others\n1.2. Gave and received feedback constructively\n1.3. Facilitated participation of individuals in the work of the team\n1.4. Negotiated learning plans to improve the effectiveness of learning\n1.5. Prepared learning plans to match skill needs\n1.6. Accessed and designated learning opportunities\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated environment\nwhere assessment can take place\n2.2. Materials relevant to the proposed activity or tasks\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation of work activities of the individual member in relation to the\nwork activities of the group\n3.2. Observation of simulation and or role play involving the participation of\nindividual member to the attainment of organizational goal\n3.3. Case studies and scenarios as a basis for discussion of issues and\nstrategies in teamwork\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a simulated\nworkplace setting\n4.2. Assessment shall be observed while tasks are being undertaken\nwhether individually or in-group\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n13\nUNIT OF COMPETENCY :\nPERFORM HIGHER-ORDER THINKING PROCESSES AND\nAPPLY TECHNIQUES IN THE WORKPLACE\n\nUNIT CODE\n:"
        },
        "source_text": "500311402\n\nUNIT DESCRIPTOR\n : This unit covers the skills, knowledge and attitudes required to\ndetermine individual and team development needs and facilitate\nthe development of the workgroup.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Foster\nindividual\ngrowth\n1.1 Learning and\ndevelopment needs\nof team members are\nsystematically\nidentified in line with\norganizational\nrequirements\n1.2 Development plan to\nmeet individual needs\nis collaboratively\ndeveloped and\nimplemented\n1.3 Individuals are\nencouraged to self -\nevaluate performance\nand identify areas for\nimprovement\n1.4 Feedback on\nperformance of team\nmembers is collected\nfrom relevant sources\nand compared with\nestablished team\nlearning process\n1.1 Effective\nworkplace\ncommunication,\ncoaching and\nmentoring\nprinciples\n1.2 Feedback\nprinciples and\nprocedures\n1.3 Working\ninterdependently:\nstrategies and\ntechniques\n1.4 Leadership\nConcepts:\n• Types of\nDecisions\nTeams Make\n• Team\nResponsibilities\n• Problems That\nAffect Teams\n• Building Strong\nTeam\nCommunication\n• Expressing\nYourself on a\nTeam\n• Team Problem\nSolving\n\n1.1 Reading and\nunderstanding a\nvariety of texts,\npreparing general\ninformation and\ndocumenting\naccording to target\naudience; spelling\nwith accuracy;\nusing grammar and\npunctuation\n1.2 Effectively\nmanaging\nrelationships and\nconflict\n1.3 Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n1.4 Communicating\nincluding receiving\nfeedback and\nreporting\n1.5 Relating to people\nfrom a range of\nsocial, cultural,\nphysical and\nmental\nbackgrounds\n1.6 Planning to\norganizing\nresources and\nequipment to meet\nlearning needs\n1.7 Reporting skills to\norganize\ninformation;\n assessing\ninformation for\nrelevance and\naccuracy;\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPro