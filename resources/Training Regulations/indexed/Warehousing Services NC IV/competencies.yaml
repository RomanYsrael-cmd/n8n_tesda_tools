  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the units of competency required in\nWAREHOUSING SERVICES NC IV.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nUTILIZE SPECIALIZED COMMUNICATION SKILLS\n\nUNIT CODE\n:\n500311401\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nuse specialized communication skills to meet specific needs of\ninternal and external clients, conduct interviews, facilitate\ndiscussion with groups, and contribute to the development of\ncommunication strategies.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Meet common\nand specific\ncommunication\nneeds of clients\nand colleagues\n1.1 Specific\ncommunication needs\nof clients and\ncolleagues are\nidentified and met\n1.2 Different approaches\nare used to meet\ncommunication needs\nof clients and\ncolleagues\n1.3 Conflict is addressed\npromptly in a manner\nwhich does not\ncompromise the\norganization\n\n1.1 Communication\nprocesses\n1.2 Dynamics of\ngroups and\ndifferent styles\nof group\nleadership\n\n1.1 Full range of\n communication\n techniques\n including:\n 1.1.1 Communicating\n effectively\n 1.1.2 Active listening\n 1.1.3 Giving /\n receiving\n feedback\n 1.1.4 Interpreting\n information\n 1.1.5 Role boundaries\n setting\n 1.1.6 Negotiating\n 1.1.7 Establishing\n empathy\n 1.1.8 Conducting\n seminars\n 1.1.9 Public speaking\n 1.1.10 Communication\n skills required to\n fulfill job roles\n as specified by\n the organization\n\n--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n4\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n2.1 Strategies for internal\nand external\ndissemination of\ninformation are\ndeveloped, promoted,\nimplemented and\nreviewed as required\n2.2 Channels of\ncommunication are\nestablished and\nreviewed regularly\n2.3 Coaching in effective\ncommunication is\nprovided\n2.4 Work related network\nand relationship are\nmaintained\n2.5 Negotiation and\nconflict resolution\nstrategies are used\nwhere required\n2.6 Communication with\nclients and colleagues is\nperformed appropriate to\nindividual needs and\norganizational objectives\n2.1 Communication\nprocess\n2.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n\n2.1 Full range of\n communication\n techniques\n including:\n 2.1.1 Communicating\n effectively\n 2.1.2 Active listening\n 2.1.3 Giving /\n receiving\n feedback\n 2.1.4 Interpreting\n information\n 2.1.5 Role boundaries\n setting\n 2.1.6 Negotiating\n 2.1.7 Establishing\n empathy\n 2.1.8 Communicating with\n openness and\n flexibility\n 2.1.9 Communication\n skills required to\n fulfill job roles\n as specified by\n the organization\n\n3. Deliver a\ntechnical\npresentation\n3.1 Presentation is\ndelivered clearly,\nsequential and\ndelivered within\nallotted time\n3.2 Utilize appropriate\nmedia to enhance\npresentation\n3.3 Differences in\nviews/opinions are\nrespected\n3.4 Questions during\nfora are responded in\na manner consistent\nwith organizational\nstandard\n3.1 Communication\nprocess\n3.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n\n 3.1 Full range of\n communication\n techniques\n including:\n 3.1.1 Communicating\n effectively\n 3.1.2 Active listening\n 3.1.3 Giving / receiving\n feedback\n 3.1.4 Interpreting\n information\n 3.1.5 Role boundaries\n setting\n 3.1.6 Negotiating\n 3.1.7 Establishing\n empathy\n 3.1.8 Communicating with\n openness and\n flexibility\n 3.1.9 Communication\n skills required to\n fulfill job roles\n as specified by\n the organization\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n5\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Represent the\norganization\n4.1 When participating in\n internal or external\n forums, presentation is\n relevant, appropriately\n researched and\n presented in a manner\n to promote the\n organization\n4.2 Presentation is clear\n and sequential and\n delivered within a\n predetermined time\n4.3 Utilize appropriate\n media to enhance\n presentation\n4.4 Differences in views\n are respected\n4.5 Written communication\n is consistent with\n organizational\n standards\n4.6 Inquiries are\n responded\n in a manner consistent\n with organizational\n standard\n4.7 Consolidate ideas and\n suggestions\n4.8 Generalize and\n summarize all ideas\n and suggestions\n4.1 Communication\nprocess\n4.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n\n4.1 Full range of\n communication\n techniques\n including:\n 4.1.1 Communicating\n effectively\n 4.1.2 Public speaking\n 4.1.3 Active listening\n 4.1.4 Giving /\n receiving\n feedback\n 4.1.5 Interpreting\n information\n 4.1.6 Role boundaries\n setting\n 4.1.7 Negotiating\n 4.1.8 Establishing\n empathy\n 4.1.9 Communicating with\n openness and\n flexibility\n 4.1.10 Communication\n skills required to\n fulfill job roles\n as specified by\n the organization\n\n5. Facilitate group\ndiscussion\n5.1 Mechanisms which\nenhance effective\ngroup interaction is\ndefined and\nimplemented\n5.2 Strategies which\nencourage all group\nmembers to\nparticipate are used\nroutinely\n5.3 Objectives and agenda\nfor meetings and\ndiscussions are\nroutinely set and\nfollowed\n5.4 Relevant information is\nprovided to group to\nfacilitate outcomes\n5.5 Evaluation of group\ncommunication\n5.1 Communication\nprocess\n5.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n5.3 How to facilitate\n a group\ndiscussion or\n meeting\n\n5.1 Full range of\n communication\n techniques\n including:\n 5.1.1 Communicating\n effectively\n 5.1.2 Active listening\n 5.1.3 Facilitating\n a meeting\n 5.1.4 Giving /\n receiving\n feedback\n 5.1.5 Interpreting\n information\n 5.1.6 Role boundaries\n setting\n 5.1.7 Negotiating\n 5.1.8 Establishing\n empathy\n 5.1.9 Communicating with\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n6\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\nstrategies is\nundertaken to promote\nparticipation of all\nparties\n5.6 Specific\ncommunication needs\nof individuals are\nidentified and\naddressed\n openness and\n flexibility\n 5.1.10 Communication\n skills required to\n fulfill job roles\n as specified by\n the organization\n\n6. Conduct\ninterview\n6.1 A range of appropriate\ncommunication\nstrategies are\nemployed in interview\nsituations\n6.2 Records of interviews\nare made and\nmaintained in\naccordance with\norganizational\nprocedures\n6.3 Effective questioning,\nlistening and\nnonverbal\ncommunication\ntechniques are used to\nensure that required\nmessage is\ncommunicated\n6.1 Communication\nprocess\n6.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n6.3 Effective\nquestioning\ntechniques\n6.4 Communication\nskills relevant to\nclient groups\n\n6.1 Full range of\n communication\n techniques including:\n 6.1.1 Communicating\n effectively\n 6.1.2 Active listening\n 6.1.3 Giving/ receiving\n feedback\n 6.1.4 Conducting interview\n 6.1.5 Role boundaries\n setting\n 6.1.6 Negotiating\n 6.1.7 Establishing empathy\n 6.1.8 Questioning skills\n (Effective clarifying\n and probing\n techniques)\n 6.1.9 Communication skills\n required to fulfill job\n roles as specified by\n the organization\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies\nMay include but not limited to:\n1.1\nRecognizing own 