        "descriptor": "This unit covers the knowledge, skills and attitudes required to use specialized communication skills to meet specific needs of internal and external clients, conduct interviews, facilitate discussion with groups, and contribute to the development of communication strategies. ELEMENTS",
        "elements": [
          {
            "number": 1,
            "title": "Meet common and specific communication needs of clients and colleagues",
            "performance_criteria": [
              {
                "number": "1.1",
                "text": "Specific communication needs of clients and colleagues are identified and met"
              },
              {
                "number": "1.2",
                "text": "Different approaches are used to meet communication needs of clients and colleagues"
              },
              {
                "number": "1.3",
                "text": "Conflict is addressed promptly in a manner which does not compromise the organization"
              }
            ],
            "required_knowledge": [
              "1.1 Communication processes",
              "1.2 Dynamics of groups and different styles of group leadership"
            ],
            "required_skills": [
              "1.1 Full range of communication techniques including:",
              "1.1 1 Communicating effectively",
              "1.1 2 Active listening",
