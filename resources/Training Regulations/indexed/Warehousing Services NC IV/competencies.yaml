        "source_text": "500311409\n\n UNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to update and continue\none’s professional development along entrepreneurship,\nincluding applying such growth in skills toward expanding the\nenterprise and developing its work force.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Enhance one’s\nbusiness skills\n1.1 Entrepreneurial skills\ndevelopment needs\nare identified and\nresponded to promptly.\n1.2 Market trends are\nmonitored, anticipated\nand taken advantage\nof where feasible.\n1.3 New technologies,\nproducts and\nprocesses are\nincluded/utilized where\nadvantageous to the\nenterprise.\n1.4 Constant\ndialog/linkages with\nother\nentrepreneurs/peers\nand stakeholders are\nmaintained\n1.5 Circulation and\nparticipation in\nbusiness fora,\nmeetings, conventions\nand exhibits are\nmaintained.\n1.6\n1.1 Business models\nand strategies\n1.2 Types and\ncategories of\nbusinesses\n1.3 Business internal\ncontrols\n1.4 Market Trends\n1.5 Relevant national\nand local\nlegislation and\nregulations\n1.6 Basic quality\ncontrol and\nassurance\nconcepts\n\n1.1 Basic bookkeeping/\naccounting skills\n1.2 Communicating\n1.3 Building relations\nwith customer and\nemployees\n1.4 Building competitive\nadvantage of the\nenterprise\n1.5 Networking and\nLinkaging skills\n2. Manage\nentrepreneurial\npractices\n2.1 Ideas and comments\nfor improvements are\nsought from workers\nand clients.\n2.2 Staff/workers are\nencouraged and\nsupported in their skills\ndevelopment and\nenhancement.\n2.3 A culture of\ncontinuous\nimprovement is\n2.1 Public relations\nconcepts\n2.2 Basic product\npromotion\nstrategies\n2.3 Basic market and\nfeasibility studies\n2.4 Basic business\nethics\n2.1 Building customer\nrelations\n2.2 Individual marketing\n2.3 Using basic\nadvertising (posters/\ntarpaulins, flyers,\nsocial media, etc.)\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n38\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\nfostered within the\nenterprise.\n2.4 Innovations on the\nexisting lines of\nproducts and services\nare encouraged\n3. Expand markets\nand clientele\n3.1 Enterprise is built up\nand sustained through\njudicious control of\ncash flows.\n3.2 Profitability of\nenterprise is ensured\nthough appropriate\ninternal controls.\n3.3 Unnecessary or lower-\npriority expenses and\npurchases are\navoided.\n3.4 New markets and\nclients are identified\nbased on current\nmarket trends\n\n3.1 Basic cost-benefit\nanalysis\n3.2 Basic financial\nmanagement\n3.3 Basic financial\naccounting\n3.4 Business internal\ncontrols\n\n3.1 Setting business\npriorities and\nstrategies\n3.2 Interpreting basic\nfinancial statements\n3.3 Preparing business\nplans\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n39\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Entrepreneurial skills\nMay include but not limited to:\n1.1. Financial management skills\n1.2. People management skills\n1.3. Operations management skills\n1.4. Business acumen\n\n2. Internal controls\nMay include but not limited to:\n2.1 Accounting systems\n2.2 Financial statements/reports\n2.3 Cash management\n2.4 Managing property, plant and equipment\n3. Continuous\nimprovement\nMay include but not limited to:\n3.1 Quality management systems (PDCA, ISO 9001,TQM, Six-\nSigma, etc.)\n3.2 Client feedback systems\n3.3 Quality assurance/Quality control systems\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated enhancement of one’s entrepreneurial skills through\nperformance of business, supervisor evaluation, worker and client\ntestimony\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Interview guide for entrepreneurs, enterprise workers and third parties\n2.2 Materials and location relevant to the proposed activity and tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written report\n3.2 Written examination\n3.3 Demonstration/observation with oral questioning\n3.4 Portfolio assessment with interview\n3.5 Third-party report\n\n4. Context of\nAssessment\n4.1 Competency may be assessed in workplace or in a simulated\nworkplace setting\n4.2 Assessment shall be observed while tasks are being undertaken\nwhether individually or in-group\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n40\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nAPPLY WORKPLACE PROCEDURES IN WAREHOUSING\nOPERATIONS\n\nUNIT CODE :"
