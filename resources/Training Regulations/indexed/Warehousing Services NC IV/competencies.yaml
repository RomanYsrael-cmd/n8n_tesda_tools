              },
              {
                "number": "2.3",
                "text": "Coaching in effective communication is provided"
              },
              {
                "number": "2.4",
                "text": "Work related network and relationship are maintained"
              },
              {
                "number": "2.5",
                "text": "Negotiation and conflict resolution strategies are used where required"
              },
              {
                "number": "2.6",
                "text": "Communication with clients and colleagues is performed appropriate to individual needs and organizational objectives"
              }
