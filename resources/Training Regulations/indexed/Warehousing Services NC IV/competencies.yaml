          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Consulted appropriate personnel or environmental reference guides for\nproper guidance based on workplace policies*\n1.2. Evaluated current practices and standards based acceptable level of\nenvironmental work standards\n1.3. Organized environmental standard improvement plans based on\nworkplace policies and procedures\n1.4. Presented environmental standard improvement plans based on\nworkplace policies and procedures*\n1.5. Promoted approved environmental work initiatives based on workplace\npolicies and procedures\n1.6. Evaluated the implementation of approved environmental\nimprovements based on workplace policies and procedures\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace/Assessment location\n2.2 Legislation, policies, procedures, protocols and local ordinances relating\nto environmental protection\n2.3 Case studies/scenarios relating to environmental protection\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written/ Oral Examination\n3.2 Interview/Third Party Reports\n3.3 Portfolio (citations/awards from GOs and NGOs, certificate of\ntraining – local and abroad)\n 3.4 Simulations and role-plays\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or\n at the designated TESDA center.\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n37\n UNIT OF COMPETENCY\n:\nSUSTAIN ENTREPRENEURIAL SKILLS\n\n UNIT CODE\n:"
