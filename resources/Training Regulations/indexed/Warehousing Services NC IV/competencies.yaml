ng cut-off\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n70\nVARIABLE\nRANGE\n3. Stock Inventory Control\nPolicies\nMay include:\n3.1 Buffer stock\n3.2 Inventory level\n3.3 Forward Days cover stock\n3.4 Slow moving stocks\n3.5 Obsolete and expired stocks\n3.6 Stock disposal\n\n4. Efficient Transport\nProviders\nMay include:\n4.1 Road worthiness of trucks\n4.2 Preferred trucker\n4.3 Track record\n4.4 Multiple fleet size\n4.5 Preventive maintenance\n4.6 Updated technology\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Organized warehouse activities\n1.2 Identified warehouse operational resources\n1.3 Adapted inventory and warehouse management system\n1.4 Determined selection criteria for transport providers\n2. Resource Implications\n\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2 Materials, supplies, tools and equipment relevant to the\n\n3. Methods of Assessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Observation\n3.3 Oral Examination\n3.4 Demonstration with questioning\n4. Context of Assessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 73 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n71\nUNIT OF COMPETENCY:\nIMPLEMENT PROCESS IMPROVEMENT SYSTEM\n\nUNIT CODE :"
