        "source_text": "LOG432202\n\nUNIT DESCRIPTOR : This unit involves the skills and knowledge required to carry out\nbasic routine workplace calculations. It specifically includes\ncarrying out required mathematical operations; preparing basic\nestimates of mass, size and volume; and interpreting basic\ngraphical representations of data.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Carry out\ncalculations\n\n1.1\nItems are counted singly\nand in batches and\nsorted numerically, as\nrequired in workplace\ntasks\n1.2\nCalculations needed to\ncomplete work tasks are\nperformed using the\nmathematical\noperations in\naccordance with\nworkplace procedures.\n1.3\nResults of calculations\nare validated.\n1.1 Mathematical\n operations and\n techniques\n1.2 Procedures in\n using relevant\n workplace\n technology in\n carrying out\n calculations\n1.3 Problem analysis\n and solving\n\n1.1 Counting of items\n singly and in\n batches and\n storing\n numerically as\n required in\n workplace tasks\n1.2 Performing\n needed\n calculations in\n accordance with\n workplace\n procedures\n1.3 Validating results\n of calculations\n2. Prepare\nestimates\n\n2.1 Materials and\nresources that require\nestimates are identified\n2.2 Estimates on materials\nand resources are\nprepared in accordance\nwith workplace\nrequirements\n2.3 Adjustment is made for\nany discrepancy between\nthe estimates and\nactual materials and\nresources\n2.1 Classification of\n materials and\n resources\n2.2 Materials and\n resource\n planning\n2.3 Techniques in\n preparing\n estimates\n2.4 Analysis of\n deviation versus\n standards\n\n2.1 Preparing\n estimates on\n materials and\n resources\n2.2 Analyzing\n deviation\n2.3 Preparing\n adjustment for\n discrepancies\n\n3. Interpret\ngraphical\nrepresentations\nof data\n\n3.1 Data are collated.\n3.2 Data are translated into\ngraphical representations\n3.3 Graphical\nrepresentations are\ninterpreted in accordance\nwith workplace\nrequirements\n3.1 Data analysis\n3.2 Graphical\n representations\n3.3 Methods of\n interpreting\n graphs\n\n3.1 Collating data\n3.2 Analyzing data\n3.3 Interpreting\n graphs\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n45\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Calculations\n\nMay include:\n1.1\nMoney\n1.2\nVolume\n1.3\nWidth\n1.4\nHeight\n1.5\nWeight\n1.6\nTime\n1.7\nDimensions\n1.8\nLength and distance\n1.9\nArea\n1.10\nPerimeter\n1.11\nCapacity\n2. Mathematical Operations\nMay include:\n2.1\nMultiplication\n2.2\nDivision\n2.3\nAddition\n2.4\nSubtraction\n2.5\nFraction\n2.6\nPercentages\n2.7\nRatio and proportion\n2.8\nConversion\n3. Materials and Resources\nMay include:\n3.1 Raw materials\n3.2 Packaging materials\n3.3 Finished goods\n3.4 Work-in process\n3.5 Promo items\n3.6 Manpower\n3.7 Man hours\n3.8 Pallet\n3.9 Pallet spaces\n3.10 Collaterals\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n46\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed calculations in accordance with workplace procedures\n1.2 Made accurate estimates to complete assigned work activities\n1.3 Recognized, interpreted and acted upon graphical information\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Test\n3.2 Direct observation and oral questioning\n3.3 Demonstration with questioning\n4. Context of\nAssessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n47\nUNIT OF COMPETENCY:\nENSURE SECURITY OF STOCKS AND CARGO\n\nUNIT CODE :"
