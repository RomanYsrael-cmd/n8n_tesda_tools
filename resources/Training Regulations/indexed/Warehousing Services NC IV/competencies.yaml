        "source_text": "--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing Services NC IV  \n \nPromulgated (12/17/2019)  \n \n \n51 \nUNIT OF COMPETENCY: \nPROVIDE EFFICIENT CUSTOMER SERVICE \n \nUNIT CODE                     : \nLOG493204 \n \nUNIT DESCRIPTOR        : This unit involves the skills and knowledge required to provide \nefficient customer service. It includes defining customer service \nrequirements, rendering customer service, and monitoring \ncustomer satisfaction. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variable \nREQUIRED  \nKNOWLEDGE \nREQUIRED  \nSKILLS \n1. Define \ncustomer \nservice \nrequirements \n \n1.1 Products and services are \nunderstood \n1.2 Customers are identified \n1.3 Customer service \nrequirements are determined \n \n \n1.1 Products and  \n       Services \n1.2 Type of  \n       Customers \n1.3 Customer  \n       service  \n       requirements \n \n1.1 Knowing  \n       products \n       and services \n1.2 Communicating  \n       Skills \n1.3 Applying  \n       interpersonal  \n       skills \n2. Render \ncustomer \nservice  \n \n \n \n \n \n2.1 Workplace standards on \ncustomer service are \ndisseminated \n2.2 Customer inquiries and \ncomplaints are dealt with in \naccordance with workplace \nprocedures \n2.3  Customer service is delivered \nefficiently. \n2.1 Customer  \n       service  \n2.2 Workplace  \n       procedures  \n2.3 Techniques  \n       in handling  \n       customer  \n       inquiries and \n       complaints \n2.4 Phone  \n       etiquette \n2.1 Handling  \n       customer  \n       inquiries and  \n       complaints \n2.2 Communicating  \n       skills \n2.3 Problem solving  \n       skills \n2.4 Rendering  \n       customer service \n3.  Monitor  \n     customer  \n    satisfaction \n \n3.1   Customer feedback \n        mechanism is in place \n3.2   Customer satisfaction is  \n        monitored  \n3.3   Reports are analyzed for  \n        customer service  \n        improvement \n \n \n 3.1 Customer  \n       Feedback \n       Mechanism \n3.2 Customer  \n        feedback  \n        reports \n3.3 Data analysis \n \n \n3.1 Soliciting  \n       Feedback \n3.2 Analyzing data \n3.3 Documenting  \n        Skills \n3.4 Monitoring  \n        customer  \n        satisfaction \n3.5 Negotiating  \n       Skills\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing Services NC IV  \nPromulgated (12/17/2019)  \n \n \n \n52 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Customers \nMay include: \n1.1 \nInternal  \n1.2 \nExternal  \n2. Customer Service \nRequirements \nMay include: \n2.1 Transport mode \n2.2 Packaging configuration \n2.3 Delivery instructions \n3. Workplace standards on \ncustomer service \nMay include: \n3.1 Prompt delivery \n3.2 Correct delivery \n3.3 Zero damage \n3.4 Zero complaint \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects \nof Competency \n \n \n \nAssessment requires evidence that the candidate: \n1.1 Determined customer service requirements \n1.2 Rendered customer service \n1.3 Monitored customer satisfaction  \n1.4 Prepared reports on customer satisfaction \n \n2. Resource \nImplications \n \n \n \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Materials relevant to the unit of competency \n2.3 Technical plans, drawings and specifications relevant to the \nactivities \n3. Methods of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Test \n3.2 Direct observation and oral questioning \n3.3 Demonstration with questioning \n3.4 Interview \n4. Context of \nAssessment \n \n \n \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n",
