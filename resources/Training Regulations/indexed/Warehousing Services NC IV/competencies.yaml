in information that\nis not available or\naccessible within the\norganization.\n1.1. Analysis and\ndisplay\ntechniques\n1.2. Information\nevaluation issues\n1.3. Information\nstorage\nrequirements and\nmethods\n1.4. Reporting\nprocedures of the\norganisation\n1.1. Analysing record\ninformation\n1.2. Communicating\neffectively\n1.3. Disseminating\ninformation\n1.4. Presenting\ninformation\n\n2. Collect and\nanalyze\ninformation\n2.1. Collection of\ninformation is\ninterpreted timely and\nrelevant to the needs of\nindividuals/teams.\n2.2. Information is collected\nin formal suitable for\nanalysis, interpretation\nand dissemination.\n2.3. Information is analyzed\nto identify relevant\ntrends and\ndevelopments in terms\nof the needs for which\nis acquired.\n2.1. Information\ncollection,\ncollation\n2.2. Analysis and\ndisplay\ntechniques\n2.3. Information\nevaluation issues\n2.4. Information\nstorage\nrequirements and\nmethods\n2.5. Reporting\nprocedures of the\norganisation\n2.1. Collecting and\ncollating information\n2.2. Analysing record\ninformation\n2.3. Communicating\neffectively\n2.4. Disseminating\ninformation\n2.5. Presenting\ninformation\n\n3. Use\nmanagement\ninformation\nsystems\n3.1. Management\ninformation systems\nare used to store and\nretrieve data for\ndecision making.\n3.2. Technology available in\nthe work area/\norganisation is used to\nmanage information.\n3.3. Recommendations for\nimproving the\ninformation system are\nsubmitted to\ndesignated persons/\ngroups.\n3.1. Analysis and\ndisplay\ntechniques\n3.2. Information\ncollection,\ncollation\n3.3. Information\nevaluation issues\n3.4. Information\nstorage\nrequirements and\nmethods\n3.5. Reporting\nprocedures of the\norganization\n3.1. Analysing record\ninformation\n3.2. Collecting and\ncollating information\n3.3. Communicating\neffectively\n3.4. Disseminating\ninformation\n3.5. Presenting\ninformation\n3.6. Using management\ninformation systems\nto store and retrieve\ndata\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n26\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Report and\ndisseminate\nanalyzed\ninformation\n\n4.1. The results of\ninformation gathering,\nanalysis and synthesis\nare reported within\nspecified time frames\nand to the standard\ndefined by the\norganisation.\n4.2. The results of\ninformation gathering,\nanalysis and synthesis\nare reported so they\ncan be inputs to policy\ndevelopment and\norganisation decision\nmaking.\n4.3. Information which is\ngathered is\ndisseminated to\nappropriate personnel\nwithin the specified\ntimeframe\n4.1. Analysis and\ndisplay\ntechniques\n4.2. Information\ncollection,\ncollation\n4.3. Information\nevaluation issues\n4.4. Information\nstorage\nrequirements and\nmethods\n4.5. Reporting\nprocedures of the\norganisation\n\n4.1. Analysing record\ninformation\n4.2. Collecting and\ncollating information\n4.3. Communicating\neffectively\n4.4. Disseminating\ninformation\n4.5. Presenting\ninformation\n4.6. Using management\ninformation systems\nto store and retrieve\ndata\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information\nMay include but not limited to:\n1.1 Routine and complex reports and submissions\n1.2 Briefing notes\n1.3 Ministerial\n1.4 Proposals\n1.5 Project plans\n1.6 Articles and promotional material\n\n2. Collection\ntechniques or\nmethods\nMay include but not limited to:\n2.1 Collection techniques may include:\n2.1.1 Research\n2.1.2 Surveys\n2.1.3 Literature search\n2.1.4 Interviews\n2.1.5 Data bases\n2.1.6 Observation\n2.2 Collection methods may include:\n2.2.1 Indexing\n2.2.2 linking\n2.2.3 Sorting\n2.2.4 Comparing\n2.2.5 Categorizing\n2.2.6 Integrating\n\n3. Analysis\nMay include but not limited to:\n3.1.\napplication of statistical methods\