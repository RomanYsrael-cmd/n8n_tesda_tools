        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified standards of safe and secured warehouse facility and\nequipment\n1.2\nContributed to the design of an efficient warehouse lay-out with\nstock locator system\n1.3\nDetermined applicable storage requirements for materials stored\nin a warehouse\n1.4\nIdentified applicable DOLE OSHS, environment and government\nregulations in the workplace\n\n2. Resource Implications\n\nThe following resources should be provided:\n2.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2\nMaterials, supplies, tools and equipment relevant to the\nproposed activity or task\n2.3\nWarehouse stock locator system\n2.4\nWork instructions and Manuals\n2.5\nStandard Operating Procedures\n2.6\nInternet connectivity\n2.7\nComputer and appropriate warehouse management system\n\n3. Methods of Assessment\n\nCompetency in this unit may be assessed through:\n3.1\nWritten Examination\n3.2\nObservation\n3.3\nOral Examination\n3.4\nDemonstration with questioning\n\n4. Context of Assessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 70 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n68\nUNIT OF COMPETENCY:\nSUPERVISE WAREHOUSE OPERATIONS\n\nUNIT CODE :"
        },
        "source_text": "LOG333313\n\nUNIT DESCRIPTOR : This unit involves the skills and knowledge required to oversee\nthe safe, secured and efficient operation of warehouse facilities\nand equipment for the seamless flow of goods in accordance with\nworkplace requirements and in compliance with applicable\nOccupational\nSafety\nand\nHealth\nStandards\n(OSHS),\nenvironment, and other government regulatory requirements.\n.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Comply with the\n standards of a\n safe and\n secured\n warehouse\n facility and\n equipment\n\n1.1 Good warehousing\npractices on facility and\nequipment are\nimplemented and\nmonitored in accordance\nwith workplace\nprocedures\n1.2 Applicable OSHS,\nenvironment, and other\ngovernment regulatory\nrequirements are\ncomplied with.\n1.3 A security system is\nestablished for controlling\naccess to the facility and\nequipment\n1.1 Material\n handling\n equipment and its\n uses\n1.2 Safety standards of\n a warehouse facility\n and equipment\n1.3 Fire Protection\n Equipment\n1.4 Security system\n1.5 Uses and\n maintenance of\n different security\n and surveillance\n equipment\n1.6 Safety\n management\n1.7 Good Warehousing\n Practices (GWP)\n1.8 Occupational\n Safety and Health\n Standards (OSHS)\n on warehousing\n operations\n1.9 Relevant\n government\n regulatory\n requirements on\n warehouse facility\n and equipment\n1.10 5S\n1.11 Ergonomics\n1.12 Storage and\n racking system\n\n1.1 Maintaining\n warehouse\n facility and\n equipment\n1.2 Complying to\n requirements of\n government\n agencies\n pertaining to\n warehouse facility\n and equipment\n1.3 Maintaining\n Security system\n1.4 Implementing\n good warehousing\n practices\n1.5 Implementing\n 5S\n\n--- PDF PAGE 67 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n65\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Contribute in the\ndesign of the\nwarehouse\nstorage facility\n\n2.1 A warehouse lay-out is\ndrawn based on flow of\ngoods\n2.2 Storage requirements\nand relevant\ngovernment regulatory\nrequirements are\nconsidered in\nwarehouse design\n2.3 Capacity requirements\nis factored in the design\n2.4 Stock Locator Map and\nvisual cues are\nprominently displayed\nat strategic areas.\n\n2.1 Warehouse\n Lay-out\n2.2 Different product\n storage requirements\n2.3 Relevant\n government\n regulatory\n requirements\n pertaining to\n warehouse design\n2.4 Stock Locator Map\n And visual cues\n2.5 Capacity\n requirements\n planning\n2.6 Stock keeping unit\n (SKU)\n2.7 Stacking height and\n palletizing scheme\n2.1 Lay-outing a\n warehouse\n2.2 Handling products\n with different\n storage\n requirements\n2.3 Calculating\n stock capacity\n requirements\n2.4 Designing a\n stock locator\n map and visual cues\n\n3. Maintain\nwarehouse\nfacility and\nequipment\n3.1 A warehouse\n maintenance checklist is\n made available\n3.2 Warehouse facility and\nequipment are assessed\nto maximize operational\nefficiency\n3.3 Warehouse facility and\nequipment are upgraded\nas necessary\n\n3.1 Warehouse Facility\n and Equipment\n Maintenance\n3.2 Factors to consider\n in upgrading\n warehouse facility\n and equipment\n3.3 Preventive\n maintenance\n program\n\n3.1 Maintaining\n warehouse\n facility and\n equipment\n3.2 Upgrading facility\n and equipment\n3.3 Sourcing\n warehouse facility\n and equipment\n\n--- PDF PAGE 68 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n66\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Good Warehousing\nPractices\nMay include:\n1.1 Good Housekeeping\n1.2 Materials segregation and identification\n1.3 Preventive maintenance and equipment calibration\n1.4 Hazardous and flammable materials handling\n1.5 Pest Control\n1.6 Environment protection\n1.7 Safety and security\n1.8 5S\n1.9 Document control\n\n2. Storage\nRequirements\nMay include:\n2.1 Temperature-controlled\n2.2 Ambient storage\n2.3 Flammable storage area\n2.4 Humidity Controlled\n2.5 Hazardous storage area\n2.6 Perishable/non-perishable\n2.7 High valued items\n\n3. Government\nRegulatory\nRequirements\n\nMay include:\n3.1 Dangerous Drugs Board requirements\n3.2 Food and Drug Administration regulations\n3.3 Source and receiving country regulatory requirements\n 3.4 Department of Environment and Natural Resources\n regulations\n 3.5 Occupational Safety and Health Standards\n3.6 Philippine National Police requirements\n3.7 Bureau of Fire Protection\n3.8 National Meat Inspection Services\n3.9 Philippine Economic Zone Authority\n3.10 Bureau of Customs (for bonded warehouse)\n3.11 Philippine Ports Authority\n3.12 Philippine Drug Enforcement Agency\n\n4. Security System\nMay include:\n4.1 Surveillance camera\n4.2 Security personnel\n4.3 Biometrics\n4.4 Burglar alarm\n4.5 Security risk protocol\n5. Capacity\nRequirements\nMay include:\n5.1 Stock level\n5.2 Racking system\n5.3 Stacking height\n5.4 Pallet space\n\n--- PDF PAGE 69 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n67\nVARIABLE\nRANGE\n6. Visual Cues\nMay include:\n6.1 Stock Locator chart\n6.2 Rack signages\n6.3 Bin signages\n6.4 Room signages\n6.5 Safety and security signages\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified standards of safe and secured warehouse facility and\nequipment\n1.2\nContributed to the design of an efficient warehouse lay-out with\nstock locator system\n1.3\nDetermined applicable storage requirements for materials stored\nin a warehouse\n1.4\nIdentified applicable DOLE OSHS, environment and government\nregulations in the workplace\n\n2. Resource Implications\n\nThe following resources should be provided:\n2.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2\nMaterials, supplies, tools and equipment relevant to the\nproposed activity or task\n2.3\nWarehouse stock locator system\n2.4\nWork instructions and Manuals\n2.5\nStandard Operating Procedures\n2.6\nInternet connectivity\n2.7\nComputer and appropriate warehouse management system\n\n3. Methods of Assessment\n\nCompetency in this unit may be assessed through:\n3.1\nWritten Examination\n3.2\nObservation\n3.3\nOral Examination\n3.4\nDemonstration with questioning\n\n4. Context of Assessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 70 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n68\nUNIT OF COMPETENCY:\nSUPERVISE WAREHOUSE OPERATIONS\n\nUNIT CODE :"
