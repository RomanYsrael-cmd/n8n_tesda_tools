        "source_title": "MAINTAIN WAREHOUSE RECORDS",
        "source_text": "--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing Services NC IV  \n \nPromulgated (12/17/2019)  \n \n \n57 \nUNIT OF COMPETENCY: \n MAINTAIN WAREHOUSE RECORDS \n \nUNIT CODE                     : \n LOG493207 \n \nUNIT DESCRIPTOR        : \nThis unit covers the knowledge, skills and attitudes and values \nneeded to maintain warehouse records. This includes data \nrecording, document control and preparing reports. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILLS \n1. Record \nwarehouse \ndata \n1.1. Sources of data are \ncollected \n1.2. Warehouse data are \nclassified \n1.3. Data are recorded either \nmanually or electronically \n1.4. Proof-reading is done to \nensure data accuracy  \n1.1 Types and uses of  \n       warehouse  \n       documents \n1.2 Ways of recording  \n        data \n1.3 Computer  \n       operation \n \n1.1 Collecting data \n1.2 Encoding data \n1.3 Recording data  \n1.4 Proof-reading \n \n \n2. Control \ndocument \n2.1 Records are maintained  \n       based on workplace  \n       procedures \n2.2 Access to documents is  \n       limited to authorized  \n       personnel \n2.3 Records are disposed \n       based on workplace  \n       procedures \n2.1 Warehouse  \n       documents \n2.2 Document control  \n       procedures \n2.3 Document disposal  \n       procedures \n2.4 Organizational  \n       chart \n2.1 Controlling  \n       documents \n2.2 Organizing skills \n2.3  Record-keeping \n3. Prepare \nreports \n \n3.1 Relevant warehouse  \n      reports are identified \n3.2 Warehouse reports are  \n       prepared based on  \n       workplace procedures \n3.3 Reports are distributed to  \n      stakeholders \n \n3.1 Warehouse reports \n3.2 Workplace  \n       procedures \n \n3.1 Preparing  \n       reports\n\n--- PDF PAGE 60 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing Services NC IV  \nPromulgated (12/17/2019)  \n \n \n \n58 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Sources of Data \nMay include: \n1.1. Supplier delivery receipts \n1.2. Production transfer reports \n1.3. Damage reports \n1.4. Stock return reports \n1.5. Customer delivery receipts \n1.6. Shipment reports \n1.7. Pilferage reports \n2. Warehouse Data \nMay include: \n2.1 Customer deliveries \n2.2 Production transfers \n2.3 Returns \n2.4 Supplier deliveries \n2.5 Damages \n3. Warehouse Reports \nMay include: \n3.1. Productivity reports \n3.2. On-time delivery \n3.3. Line item fill rate reports \n3.4. Inventory movement reports \n3.5. Customer feedback reports \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1   Recorded warehouse data accurately \n1.2   Controlled document effectively \n1.3   Prepared timely warehouse reports \n2. Resource Implications \n \n \n \nThe following resources should be provided: \n2.1   Workplace location \n2.2   Materials relevant to the unit of competency \n2.3   Technical plans, drawings and specifications relevant to  \n        the activities \n3. Methods of Assessment \n \nCompetency in this unit must be assessed through: \n3.1   Written Test \n3.2   Direct observation and oral questioning \n4. Context of Assessment \n \n \n \n4.1 Competency maybe assessed in actual workplace or at \nthe designated TESDA accredited Assessment Center.\n",
