        "source_text": "LOG333315\n\nUNIT DESCRIPTOR :\nThis unit involves skills and knowledge required to measure,\nanalyze and evaluate performance results against targets.\n\nThis unit also involves knowledge and skills to implement\nsustainable process improvement system.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Evaluate\noperational\nperformance\n\n1.1 Key Performance\n Indicators are identified\n1.2 Operational performance\n is measured\n1.3 Current performance\n results are analysed\n\n1.1 Warehouse\n operational\n key performance\n1.2 Key performance\n Indicators\n1.3 Performance\n measurement\n1.4 Customer service\n\n1.1 Establishing Key\n Performance\n Indicators\n1.2 Measuring\n operational\n performance\n1.3 Analyzing data\n and information\n1.4 Making sound\n Judgment\n\n2. Adapt process\nimprovement\n\n2.1 Process improvement\nprograms are\nimplemented\n2.2 Results of process\nimprovements are\nregularly reviewed\n2.3 Benchmarking with best\nindustry practices is\ndone\n2.1 Process\n Improvement\n Programs\n2.2 Change\n Management\n2.3 Benchmarking\n2.4 Time management\n2.5 Cause and effect\n2.6 Cost- Budget\n Analysis\n2.1 Implementing\n process\n improvement\n2.2 Benchmarking\n2.3 Reviewing\n process\n Improvements\n\n3. Calibrate targets\nbased on\nhistorical\nperformance\nresults\n3.1 Performance results are\nreviewed at regular\nintervals\n3.2 Key performance\ntargets are reviewed\nagainst historical\nperformance results\n3.3 Adjust performance\n targets as necessary\n\n3.1 Change\n Management\n3.2 Key performance\n targets\n3.2 Data analysis\n\n3.1 Practicing\n excellent\n communication\n and interpersonal\n skills\n3.2 Reviewing\n historical data\n3.3 Analyzing data\n\n--- PDF PAGE 74 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n72\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Key Performance\n Targets\n\nMay include:\n 1.1 Inventory Record Accuracy (IRA)\n 1.2 Inventory turnover\n 1.3 Receiving efficiency\n 1.4 Put-away efficiency\n 1.5 Order picking/packing\n 1.6 Cost of carrying inventory\n\n2. Key Performance\n Indicators\nMay include:\n\n2.1 Inventory Record Accuracy (IRA)\n2.2 Truck turn-around time\n2.3 Order fill-rate\n2.4 Line Item Fill Rate\n 2.5 Delivery lead time\n 2.6 Cost and Budget\n\n3. Process Improvement\n Programs\nMay include:\n\n 3.1 Cost Control / Reduction Program\n 3.2 Productivity Improvement Program\n 3.3 Total Quality Management\n 3.4 GWP Awareness (Good Warehousing Practices)\n 3.5 Employee Wellness Program\n 3.6 Process Re-engineering\n 3.7 Technology Integration\n 3.8 Work simplification\n 3.9 Process mapping\n\n--- PDF PAGE 75 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n73\nEVIDENCE GUIDE\n\n1.Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified the operational efficiency standards\n1.2 Established the key performance indicators\n1.3 Adapted process improvement programs\n1.4 Benchmarked with best industry practices\n2.Resource Implications\n\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2 Access to relevant workplace data and information (previous\nand current)\n2.3 Materials, supplies, tools and equipment relevant to the\nproposed activity or task\n2.4\nStandard Operating Procedures on warehousing\n2.5\nPolicies and Procedures\n2.6\nApplicable government regulations\n2.7\nInternet connectivity\n2.8\nAppropriate hardware and software\n3 Methods of Assessment\n\nCompetency in this unit may be assessed through:\n 3.1 Written Examination\n 3.2 Observation\n 3.3 Oral Examination\n 3.4 Demonstration\n4 Context of Assessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 76 ---\n