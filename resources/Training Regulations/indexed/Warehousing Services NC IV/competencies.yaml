        "source_text": "LOG493206\n\nUNIT DESCRIPTOR : This unit involves the skills and knowledge required to comply\nwith workplace procedures in handling stocks. It includes\ncategorizing stocks, identifying storage locations and handling\nstocks.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.Categorize\n stocks\n\n1.1 Warehouse personnel is\nrequired to attend\nproduct orientation\n1.2 Stocks are grouped\naccording to\nclassification\n1.3 Stock movements are\nconsidered in stocks\nclassification\n\n1.1 Stocks\n Classification\n1.2 Sources of product\n information\n1.3 Organizational\n Chart\n1.4 Product codes\n1.5 Barcode structure\n1.6 Shelf life\n1.7 Batch number\n1.8 Quality status\n1.9 Inventory reports\n1.1 Identifying stocks\n1.2 Classifying\n stocks\n1.3 Interpreting\n codes\n\n2. Identify\nstorage\nlocations\n\n2.1 Stocks storage\nrequirements are\nidentified.\n2.2 Stocks storage\nlocations are assigned\nbased on product storage\nrequirements, volume,\nmovements, and\navailable space\n2.3 Stock locator chart is\ndesigned for efficient\n stock movements\n2.1 Warehouse layout\n2.2 Stock locator chart\n2.3 Stocks storage\n Requirements\n2.4 Inventory reports\n2.5 Stock movement\n reports\n2.6 Stacking height\n2.7 Palletizing scheme\n\n2.1 Determining\n storage locations\n\n2.2 Interpreting\n barcodes\n\n3. Follow stocks\nhandling\nprocedures\n\n3.1 Orientation on stock\n handling procedures is\n undertaken\n3.2 Stock handling\n procedures are observed\n3.3 Stock handling\n procedures are updated\n as necessary\n\n3.1 Stocks handling\n procedures\n3.2 Workplace\n procedures\n3.3 Deviations from\n procedures\n\n3.1 Handling stocks\n3.2 Reporting skills\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n56\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Stocks Classification\nMay include:\n1.1\nFlammable\n1.2\nHazardous\n1.3\nPerishable\n1.4\nTemperature controlled\n1.5\nPremium items\n2. Stocks Storage Locations\nMay include:\n2.1 Raw and Packaging Materials\n2.2 Work-in-process\n2.3 Finished Products\n2.4 Damaged stocks/Returned stocks\n2.5 Loose items\n3. Stocks Handling Procedure\nMay include:\n3.1 Stock rotation procedures\n3.2 Flammable stocks\n3.3 Hazardous stocks\n3.4 Damaged/returned stocks\n3.5 Promo bundling\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Categorized stocks according to stocks classification\n1.2 Identified storage locations according to product storage\nrequirements, volume, movements, and available space\n1.3 Followed stocks handling procedures\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the\n activities\n3. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Test\n3.2 Direct observation and oral questioning\n3.3 Demonstration with questioning\n3.4 Interview\n\n4. Context of\nAssessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n57\nUNIT OF COMPETENCY:\n MAINTAIN WAREHOUSE RECORDS\n\nUNIT CODE :"
