        "source_text": "LOG333314\n\nUNIT DESCRIPTOR : This unit involves the skills and knowledge required to supervise\nthe warehouse operations from receiving of stocks, order\nprocessing to dispatching using cost efficient transport and\nlogistics resources.\nThis also involves the skills and knowledge required to apply\nwarehouse management systems in managing stocks.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Organize\nwarehouse\noperations\n\n1.1 Warehouse activities are\nexecuted to meet\nobjectives\n1.2 Operational resources\nare made available\n1.3 Work schedules and\ncut-offs are observed\n1.4 Warehouse policies and\nprocedures are complied\nwith\n1.5 Key performance\nindicators are put in place\nto measure effectiveness\nof warehouse operations\n\n1.1 Warehouse\n Operations\n1.2 Warehouse policies\n and procedures\n1.3 Warehouse\n Operational\n Resources\n1.4 Workplace\n Schedules and\n Cut-offs\n1.5 Warehouse key\n performance\n indicators\n\n1.1 Organizing\n warehouse\n operations\n1.2 Delegating tasks\n1.3 Scheduling\n activities and\n tasks\n1.4 Implementing\n workplace policies\n and procedures\n1.5 Using key\n performance\n indicators\n\n2. Supervise\nwarehouse\ninventory\nactivities\n2.1 Inventory Management\nand Warehouse\nManagement (IM/WM)\nsystem is adapted\n2.2 Stock inventory control\n policies are reinforced\n 2.3 Physical counts are\n conducted to validate\n inventory records\n accuracy\n\n2.1 Inventory\n Management/\n Warehouse\n Management\n System\n2.2 Personnel\n Management\n2.3 Stock inventory\n control policies\n2.4 Cycle counts\n2.5 Physical counts\n2.6 Problem solving\n2.7 Decision-making\n2.8 Occupational\n Safety and Health\n Standards (OSHS)\n on warehousing\n operations\n2.9 Relevant\n government\n regulatory\n requirements on\n warehousing\n operations\n2.10 Report writing\n\n2.1 Supervising skills\n2.2 Working\n collaboratively with\n