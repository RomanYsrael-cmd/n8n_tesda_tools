IA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Foster\nindividual\ngrowth\n1.1 Learning and\ndevelopment needs\nof team members are\nsystematically\nidentified in line with\norganizational\nrequirements\n1.2 Development plan to\nmeet individual needs\nis collaboratively\ndeveloped and\nimplemented\n1.3 Individuals are\nencouraged to self -\nevaluate performance\nand identify areas for\nimprovement\n1.4 Feedback on\nperformance of team\nmembers is collected\nfrom relevant sources\nand compared with\nestablished team\nlearning process\n1.1 Effective\nworkplace\ncommunication,\ncoaching and\nmentoring\nprinciples\n1.2 Feedback\nprinciples and\nprocedures\n1.3 Working\ninterdependently:\nstrategies and\ntechniques\n1.4 Leadership\nConcepts:\n• Types of\nDecisions\nTeams Make\n• Team\nResponsibilities\n• Problems That\nAffect Teams\n• Building Strong\nTeam\nCommunication\n• Expressing\nYourself on a\nTeam\n• Team Problem\nSolving\n\n1.1 Reading and\nunderstanding a\nvariety of texts,\npreparing general\ninformation and\ndocumenting\naccording to target\naudience; spelling\nwith accuracy;\nusing grammar and\npunctuation\n1.2 Effectively\nmanaging\nrelationships and\nconflict\n1.3 Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n1.4 Communicating\nincluding receiving\nfeedback and\nreporting\n1.5 Relating to people\nfrom a range of\nsocial, cultural,\nphysical and\nmental\nbackgrounds\n1.6 Planning to\norganizing\nresources and\nequipment to meet\nlearning needs\n1.7 Reporting skills to\norganize\ninformation;\n assessing\ninformation for\nrelevance and\naccuracy;\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n9\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n identifying and\nelaborating on\nlearning outcomes\n1.8 Facilitating small\ngroup tra