              "1.1 5 Role boundaries setting",
              "1.1 6 Negotiating",
              "1.1 7 Establishing empathy",
              "1.1 8 Conducting seminars",
              "1.1 9 Public speaking",
              "1.1 10 Communication skills required to fulfill job roles as specified by the organization"
            ],
            "source_number": 1
          },
