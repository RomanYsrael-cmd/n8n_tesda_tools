        "source_title": "SUPERVISE WAREHOUSE OPERATIONS",
        "source_text": "--- PDF PAGE 70 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing Services NC IV  \nPromulgated (12/17/2019)  \n \n \n \n68 \nUNIT OF COMPETENCY: \nSUPERVISE WAREHOUSE OPERATIONS \n \nUNIT CODE                     : \nLOG333314 \n \nUNIT DESCRIPTOR        : This unit involves the skills and knowledge required to supervise \nthe warehouse operations from receiving of stocks, order \nprocessing to dispatching using cost efficient transport and \nlogistics resources. \nThis also involves the skills and knowledge required to apply \nwarehouse management systems in managing stocks. \n \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILLS \n1. Organize \nwarehouse \noperations \n \n1.1 Warehouse activities are \nexecuted to meet \nobjectives \n1.2 Operational resources \nare made available \n1.3 Work schedules and \ncut-offs are observed \n1.4 Warehouse policies and \nprocedures are complied \nwith  \n1.5 Key performance \nindicators are put in place \nto measure effectiveness \nof warehouse operations \n \n1.1 Warehouse  \n     Operations \n1.2 Warehouse policies \n      and procedures \n1.3 Warehouse  \n     Operational \n     Resources \n1.4 Workplace \n     Schedules and \n     Cut-offs  \n1.5 Warehouse key \n      performance \n      indicators \n \n1.1 Organizing  \n      warehouse \n      operations  \n1.2 Delegating tasks  \n1.3 Scheduling  \n       activities and  \n       tasks \n1.4 Implementing  \n       workplace policies \n       and procedures \n1.5 Using key \n    performance  \n    indicators \n \n2. Supervise \nwarehouse  \ninventory \nactivities \n2.1 Inventory Management \nand Warehouse \nManagement (IM/WM) \nsystem is adapted \n2.2 Stock inventory control  \n      policies are reinforced \n 2.3 Physical counts are  \n       conducted to validate  \n       inventory records  \n       accuracy \n \n \n \n \n \n  \n2.1 Inventory  \n       Management/  \n       Warehouse \n       Management \n       System \n2.2 Personnel  \n       Management \n2.3 Stock inventory  \n       control policies \n2.4 Cycle counts \n2.5 Physical counts \n2.6 Problem solving \n2.7 Decision-making \n2.8 Occupational  \n       Safety and Health  \n       Standards (OSHS) \n       on warehousing  \n       operations \n2.9 Relevant  \n       government   \n       regulatory   \n       requirements on  \n       warehousing  \n       operations \n2.10 Report writing \n \n2.1 Supervising skills \n2.2 Working  \n       collaboratively with \n       others \n2.3 Coordinating  \n       activities \n2.4 Conducting \n       Physical counts \n2.5 Reinforcing \n       inventory control \n       policies   \n2.6 Dealing with  \n       complexity \n2.7 Implementing  \n      workplace policies \n      and procedures \n2.8 Preparing \n       warehouse and \n       inventory reports \n2.9 Resolving  \n         conflicts\n\n--- PDF PAGE 71 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing Services NC IV  \n \nPromulgated (12/17/2019)  \n \n \n69 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILLS \n3.  Engage with  \nefficient transport \nand logistics \nservice providers  \n3.1 Customer transport \nrequirements are \nidentified \n3.2 Services of efficient \ntransport providers are \nengaged with \n3.3 Transport planning \nsystem is utilized \n3.4 Conducts a review of \nperformance with  \ntransport and logistics \nservice providers  \n3.1 Different transport \n      Mode      \n3.2 Third Party Logistics ProviderOutsourcing  \n      Service Providers \n      service \n      management \n3.3 Cost-Budget  \n      Analysis \n3.4  Negotiation \n3.5  Relevant \n     Government \n      Regulations on \n      Transport and \n      Logistics \n3.6  Fleet Management \n3.7  Safety Management  \n3.8 Transport  \n      Planning \n       \n \n3.1 Selecting and \n       hiring logistics \n       service provider \n3.2 Dealing with  \n       logistics service \n       providers \n3.3 Assessing \n       performance of \n       service providers \n3.4 Negotiating  \n3.5 Transport Planning  \n \n \n \n \n \n \n \n \n  \n \n \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Operational Resources    \n \n \n \n \n \n \nMay include: \n1.1 Tools \n1.2 Material Handling Equipment \n1.3 Dock leveler \n1.4 Pallets \n1.5 Office Equipment \n1.6 Hardware and Software \n2. Work schedules and cut-\noffs  \nMay include: \n2.1 Staff schedules \n2.1.1 Day Shift \n2.1.2 Mid Shift \n2.1.3 Night Shift \n2.1.4 Flexi-time \n2.2   Other schedules and cut-offs \n2.2.1 Transfer and Document cut-off \n          2.2.1.1 Raw & Packaging Materials   \n2.2.1.2 Work-in-Process  \n                   2.2.1.3 Finished Goods Transfer \n        2.2.2 Supplier delivery schedule \n        2.2.3 Sales order processing cut-off \n        2.2.4 Trade returns receiving schedule \n        2.2.5 Shipping cut-off\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing Services NC IV  \nPromulgated (12/17/2019)  \n \n \n \n70 \nVARIABLE \nRANGE \n3. Stock Inventory Control \nPolicies  \nMay include: \n3.1   Buffer stock \n3.2   Inventory level \n3.3   Forward Days cover stock \n3.4   Slow moving stocks \n3.5   Obsolete and expired stocks \n3.6   Stock disposal \n \n4.  Efficient Transport \nProviders \nMay include: \n4.1   Road worthiness of trucks \n4.2   Preferred trucker  \n4.3   Track record \n4.4   Multiple fleet size \n4.5   Preventive maintenance \n4.6   Updated technology \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Organized warehouse activities    \n1.2 Identified warehouse operational resources   \n1.3 Adapted inventory and warehouse management system  \n1.4 Determined selection criteria for transport providers \n2. Resource Implications \n \n \nThe following resources should be provided: \n2.1 Access to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2 Materials, supplies, tools and equipment relevant to the  \n \n3. Methods of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Examination  \n3.2 Observation \n3.3 Oral Examination \n3.4 Demonstration with questioning \n4. Context of Assessment \n \n \n \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n",
