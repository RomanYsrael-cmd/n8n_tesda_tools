quirements\n2.4 Safety policies, procedures and programs\n2.5 Confidentiality and security requirements\n2.6 Business and performance plans\n2.7 Ethical standards\n2.8 Quality and continuous improvement processes and\nstandards\n3. Feedback on\n Performance\nMay include but not limited to:\n3.1 Formal/informal performance appraisals\n3.2 Obtaining feedback from supervisors and\ncolleagues\n3.3 Obtaining feedback from clients\n3.4 Personal and reflective behavior strategies\n3.5 Routine and organizational methods for monitoring service\ndelivery\n4. Learning delivery\n Methods\nMay include but not limited to:\n4.1 On the job coaching or mentoring\n4.2 Problem solving\n4.3 Presentation/demonstration\n4.4 Formal course participation\n4.5 Work experience\n4.6 Involvement in professional networks\n4.7 Conference and seminar attendance\n4.8 Induction\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n12\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Identified and implemented learning opportunities for others\n1.2. Gave and received feedback constructively\n1.3. Facilitated participation of individuals in the work of the team\n1.4. Negotiated learning plans to improve the effectiveness of learning\n1.5. Prepared learning plans to match skill needs\n1.6. Accessed and designated learning opportunities\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated environment\nwhere assessment can take place\n2.2. Materials relevant to the proposed activity or tasks\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation of work activities of the individual member in relation to the\nwork activities of the group\n3.2. Observation of simulation and or role play involving the participation of\nindividual member to the attainment of organizational goal\n3.3. Case studies and scenarios as a basis for discussion of issues and\nstrategies in teamwork\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a simulated\nworkplace setting\n4.2. Assessment shall be observed while tasks are being undertaken\nwhether individually or in-group\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n13\nUNIT OF COMPETENCY :\nPERFORM HIGHER-ORDER THINKING PROCESSES AND\nAPPLY TECHNIQUES IN THE WORKPLACE\n\nUNIT CODE\n: 500311403\n\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes\n required to use fundamental critical thinking skills in the\n workplace.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Evaluate\neffectiveness\nand efficiency\nof the\nworkplace\nsystems,\nprocesses and\nprocedures.\n1.1 Effectiveness and\nefficiency of\nworkplace standards\nand procedures are\nexamined.\n1.2. Usage of inquiry and\ndialogue to\ncommunicate\nevaluation measures\nand results are\nimplemented.\n1.3 Evaluation reports are\nprepared and\ncommunicated to team\nmembers.\n\n1.1 Systems,\n standards,\n procedures and\n protocols in the\n workplace.\n1.2 Different\nmethods of\ncritical and\nappreciative\ninquiry and their\nrelevance to\ndifferent\nsituations\n1.3 Techniques to\nassist in forming\nthe habit of\nasking questions\nand taking\nresponsibility for\nanswers.\n1.4 Why questions\nare important and\nthe benefits of\nasking good\nquestions for\nindividuals,\nbusinesses and\ncommunities (the\nimportance of\ncritical thinking).\n1.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning, attention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n1.2 Communicating to\nactive listening and\nasking questions to\nothers in a\nconstructive way.\n1.3 Using critical\nthinking pathway to\nformulating and\nasking relevant\nquestions and\ncoming up with\nappropriate\nanswers.\n1.4 Performing\nassimilation and\naccommodation\nskills to interpret\nand distil key\ninformation of\nrelevance to a\ngiven situation.\n1.5 Assessing and\nmeasuring the\nextent of\neffectiveness and\nefficiency of the\nsystems, processes\nand procedures in\nthe workplace.\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n14\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Foster the\nhabit of critical\ninquiry and\ncuriosity in the\nworkplace.\n2.1 Issues and situations\nare reflected on and\nwondered about.\n2.2 Issues and problems\nin the workplace\nparticularly in the\npolicies, procedures\nand protocols are\ndiscussed and\nevaluated between\nand among teams.\n2.3 Evaluation of\nefficiency and\neffectiveness of\nworkplace policies,\nprocedures and\nprotocols are\ndocumented,\ncommunicated and\nagreed upon between\nand among teams.\n2.4 Growth mindset and\npositive relationship\nand communication is\napplied in the context\nof curiosity and\ncritical inquiry in the\nworkplace.\n2.1 Different methods\nof critical and\nappreciative\ninquiry and their\nrelevance to\ndifferent\nsituations.\n2.2 Techniques to\nassist in forming\nthe habit of\nasking questions\nand taking\nresponsibility for\nanswers.\n2.3 Why questions\nare important and\nthe benefits of\nasking good\nquestions for\nindividuals,\nbusinesses and\ncommunities (the\nimportance of\ncritical thinking).\n2.4 Growth mindset\nand positive\ncommunication\nand relationship\nstrategies and\ntechniques.\n2.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning, attention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n2.2 Communicating to\nactive listening and\nasking questions to\nothers in a\nconstructive way.\n2.3 Using critical\nthinking pathway to\nformulating and\nasking relevant\nquestions and\ncoming up with\nappropriate\nanswers.\n2.4 Performing\nassimilation and\naccommodation\nskills to interpret and\ndistil key information\nof relevance to a\ngiven situation.\n2.5 Assessing and\nmeasuring the\nextent of\neffectiveness and\nefficiency of the\nsystems, processes\nand procedures in\nthe workplace.\n2.6 Communicating\ninsights on\nworkplace\neffectiveness and\nefficiency.\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n15\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Develop\npractical\naction plans\nfor improving\nworkplace\nconditions.\n3.1 Evaluation of efficiency\nand effectiveness of\nworkplace policies,\nprocedures and\nprotocols are\ndocumented,\ncommunicated to\nstakeholders.\n3.2 Practical action plans\nin improving workplace\nconditions are\nformulated, presented\nand negotiated with\nstakeholders.\n3.3 Proposed changes and\ndirections are inquired,\nprocessed and\nnegotiated between\nand among teams, and\nstakeholders as well of\nthe organization.\n3.4 Commitment to\ncontinuous\nimprovement and\nchange is highlighted.\n3.5 Passion and dedication\nfor changing and\nadapting to the\ndemands of the 21st\ncentury workplace are\nconsidered.\n3.1 Different methods\nof critical and\nappreciative\ninquiry and their\nrelevance to\ndifferent\nsituations.\n3.2 Techniques to\nassist in forming\nthe habit of\nasking questions\nand taking\nresponsibility for\nanswers.\n3.3 Why questions\nare important and\nthe benefits of\nasking good\nquestions for\nindividuals,\nbusinesses and\ncommunities (the\nimportance of\ncritical thinking).\n3.4 Growth mindset\nand positive\ncommunication\nand relationship\nstrategies and\ntechniques.\n3.5 Creative\nnegotiation skills.\n3.6 Change\nmanagement and\ncontinuous\nimprovement\nconcepts.\n3.1 Using range of\nanalytical techniques\n(e.g., planning,\nattention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n3.2 Communicating to\nactive listening and\nasking questions to\nothers in a\nconstructive way.\n3.3 Using critical thinking\npathway to\nformulating and\nasking relevant\nquestions and\ncoming up with\nappropriate answers.\n3.4 Performing\nassimilation and\naccommodation\nskills to interpret and\ndistil key information\nof relevance to a\ngiven situation.\n3.5 Assessing and\nmeasuring the extent\nof effectiveness and\nefficiency of the\nsystems, processes\nand procedures in\nthe workplace.\n3.6 Communicating\npractical insights on\nimproving workplace\nconditions.\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n16\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Effectiveness and\nefficiency\nMay include but not limited to:\n1.1 Developing a more efficient way of doing something\n1.2 Developing a new idea\n1.3 Developing and improving products and services\n1.4 Enhancing skills and career opportunities\n1.5 Enhancing the physical environment\n1.6 Financial benefit\n1.7 Greater personal satisfaction\n1.8 Improving interpersonal relationships\n1.9 Evaluating overall workplace conditions\n2. Curiosity and critical\ninquiry\nMay include but not limited to:\n2.1\nAccuracy\n2.2\nBreadth\n2.3\nClarity\n2.4\nDepth\n2.5\nEmotion\n2.6\nFairness\n2.7\nLogic\n2.8\nMeaning\n2.9\nPlanning\n2.10\nAttention\n2.11\nPrecision\n2.12\nRelevance\n2.13\nSignificance\n2.14\nSocial engagement\n2.15\nSociety\n2.16\nStyle\n2.17\nGrowth mindset\n2.18\nPositive communication\n2.19\nPositive negotiation\n2.20\nWorkplace conditions\n2.21\nAppreciative inquiry methods\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n17\nVARIABLE\nRANGE\n3. Practical action plans\nMay include but not limited to:\n3.1 Insights on continuous improvement\n3.2 Creative strategies and techniques for becoming better at\n work and real life\n3.3 Career plans\n3.4 Challenging workplace policies, procedures and protocols\n3.5 Specifying plans for change and adapting to the demands\n of the contemporary workforce\n3.6 Challenges in negotiating with stakeholders and teams\n3.7 Change management, innovation and knowledge creation\n3.8 Contractual agreements\n3.9 Extreme time pressure or non-negotiable deadlines\n3.10 Financial limitations\n3.11 Procedures determined by laws or other regulations\n3.12 Safety issues\n3.13 When others are totally closed to new ideas\n3.14 acknowledging shared responsibility\n3.15 adopting a positive 'can do' attitude\n3.16 following up on practical details\n3.17 pro-actively seeking information\n3.18 suggesting a new approach\n3.19 talking to others about possible answers\n3.20 constraints of the broader context and environment\n3.21 overall goal - what needs to be achieved\n3.22 personal hopes and expectations\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n18\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nEvaluated the effectiveness and efficiency of workplace systems,\nprocesses and procedures.\n1.2\nModelled the conscious process of critical inquiry to get new\ninsights that s/he can get in formulating action plans on continuous\nimprovement in the workplace and real-life\n1.3\nPracticed the habit of critical inquiry and curiosity in the workplace\n1.4\nShown a thorough knowledge and understanding of how critical\nthinking impacts on individual lives, the broader community and\nwork situations.\n1.5\nDeveloped practical action plans for improving workplace\nconditions.\n2. Resource\nImplications\n2.1.\nInteractions with specific challenges and situations to demonstrate\nthe application of critical thinking (this would usually involve\ninteractions with others).\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDirect questioning combined with review of portfolios of evidence\nand third-party workplace reports of on-the-job performance by the\ncandidate\n3.2\nEvaluation of a candidate blog exploring different ideas and\nquestions\n3.3\nReview of candidate response to scenarios that allow the\ncandidate to apply critical thinking techniques to a life or work\nsituation, and to demonstrate ability to portray curiosity and\nexploration of new concepts\n3.4\nEvaluation of candidate response to the challenge of adopting\ndifferent perspectives on a situation, and ability to both develop\nand respond to questions from those perspectives\n3.5\nObservation of the candidate participating in a group problem-\nsolving session\n3.6\nOral or written questioning to assess knowledge of typical blockers\nto the critical thinking process.\n3.7\nLife Narrative Inquiry to reflect life stories that reflect how critical\nthinking and problem solving is applied in the lives.\n4. Context for\nAssessment\n4.1.\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n19\nUNIT OF COMPETENCY : CONTRIBUTE TO THE PRACTICE OF SOCIAL JUSTICE IN\nTHE WORKPLACE\n\nUNIT CODE\n: 500311404\n\nUNIT DESCRIPTOR\n: This unit covers ways and means to assume active roles in\nresolving local and global challenges and to become proactive\ncontributors to a more peaceful and sustainable world.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Update self\non local,\nnational and\nglobal\ntrends/\nissues in the\nworkplace\n1.1 Media are regularly\nscanned/ monitored\nfor trends and issues\nrelevant to human\nrights, gender equality,\npromotion of culture of\npeace and non-\nviolence, global\ncitizenship and\nappreciation of cultural\ndiversity.\n1.2 Knowledge and\nunderstanding of local,\nnational and global\nissues and their\ninterconnectedness and\ninterdependency are\nacquired.\n1.3 Notable issues and\ntrends are critically\nexamined and\ndiscussed with peers,\ncolleagues, or family\nmembers.\n1.1 Local, national\nand global\nsystems and\nstructures\n1.2 Issues affecting\ninteraction and\nconnectedness of\ncommunities at\nlocal, national\nand global levels\n1.3 Underlying\nassumptions and\npower dynamics\n(politics,\nunderstanding\npolitical system,\nsocial structures,\nlabor laws, labor\nrelations, human\nright)\n\n1.1 Monitoring trends\nand issues\nrelevant to human\nrights, gender\nequality, culture of\npeace, global\ncitizenship, and\ncultural diversity\nusing different\nmedia platforms\n1.2 Analyzing trends\nand issues\nrelevant to human\nrights, gender\nequality, culture of\npeace, global\ncitizenship, and\ncultural diversity\n1.3 Engaging in\ndiscourse about\nthe local, national\nand global issues\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n20\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Relate local\nand global\ntrends to\nworkplace\ncontext\n2.1 Local events are\nreflected on for\nimplications in one’s\nown situation and in the\nexternal global\nenvironment.\n2.2 Sense of belonging to a\ncommon humanity,\nsharing values and\nresponsibilities are\ndeveloped.\n2.3 Attitudes of empathy,\nsolidarity and respect\nfor differences and\ndiversity are\nstrengthened.\n2.1 Different levels of\nhuman identity\naccording to\nAmber Mayer\n(2015)\n2.2 Different\ncommunities\npeople belong to\nand how these\nare connected\n2.3 Difference and\nrespect for\ncultural diversity\n2.1 Recognizing\ndifferences and\ncommonalities\namong people\n2.2 Strengthening\nattitudes of\nempathy, solidarity\nand respect for\ndiversity\n2.3 Connecting local\nissues to global\ntrends, and vice\nversa.\n3. Engage and\ntake actions\non workplace\nissues and\nconcerns\n3.1 Effective and\nresponsible actions at\nlocal, national and\nglobal levels are\nidentified.\n3.2 Motivation and\nwillingness to take\nnecessary actions are\ndeveloped.\n3.3 Attitude of “thinking\nglobally and acting\nlocally” is practiced.\n3.1 Actions that can\nbe taken\nindividually and\ncollectively\n3.2 Ethically\nresponsible\nbehaviour\n3.3 Importance and\nbenefits of civic\nengagement\n3.4 Strategies and\ntechniques of\n“thinking globally\nand acting\nlocally\n3.1 Employing\nappropriate actions\nto address\nworkplace issues\ninvolving national\nand global trends\n3.2 Showing concern\nand willingness to\ntake part in the\ndevelopment\nefforts to discuss\nworkplace issues\nand concerns\n3.3 Applying the\nattitude of “thinking\nglobally and acting\nlocally” in the\nworkplace\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n21\n RANGE OF VARIABLES\n\n EVIDENCE GUIDE\n\nVARIABLE\nRANGE\n1. Media\nMay include but not limited to:\n1.1\nPrint media\n1.2\nBroadcast media\n1.3\nInternet and social media\n2. Scanning/Monitoring\nMay include but not limited to:\n2.1\nSourcing from key informants\n2.2\nConversation with clients\n2.3\nMan-on-the-street conversation\n2.4\nScanning print and broadcast media\n3. Local, national and global issues\n\nMay include but not limited to:\n3.1\nPoverty\n3.2\nUnemployment\n3.3\nGlobal warming\n3.4\nSafety, security, and well-being\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated ability and attitude to keep oneself updated of\nrelevant issues/trends\n1.2\nDemonstrated ability to think and act based on one’s principles\nand values\n1.3\nDemonstrated a holistic/global outlook on internal and external\nevents in the workplace\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Access to workplace and resources\n2.2 Case studies\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration or simulation with oral questioning\n3.2\nCase problems involving global and local issues\n3.3\nThird-party report\n4. Context for\nAssessment\n4.1\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n22\n UNIT OF COMPETENCY : MANAGE INNOVATIVE WORK INSTRUCTIONS\n\n UNIT CODE\n : 500311405\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\n required to sustain and develop a workplace environment\n in which improvement, innovation and learning are\n promoted and reinforced.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Review and\nanalyze existing\nworkplace\npractices\n1.1 Current instructions\nand strategies to\nperform tasks in the\nworkplace are\nreviewed\n1.2 Climate for\ninnovation at the\norganizational level\nis defined\n1.3 Innovation drivers in\nthe workplace are\nidentified\n1.1. Four drivers of\ninnovation\naccording to\nGallup\nManagement\nJournal (2007)\n1.2. Contextual\nvariables\nrelated to\ninnovative\npractices in the\norganization\n1.3. The nine\ndimensions of\ninnovation\nclimate (Isaksen\n& Isaksen,\n2018)\n1.4. Types of\nInnovation\nidentified by\nGopalakrishnan\nand Damanpour\n(1997)\n1.1 Investigating the\norganizational\nneeds in the\ninnovation process\n1.2 Defining current\norganizational\ninnovative\npractices\n1.3 Linking innovation\nto contextual\nvariables in the\norganization\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n23\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Examine\nopportunities\nfor continuous\nimprovement\nand innovation\nof practices in\nthe workplace\n2.1. Effectiveness of\ninnovative practices in\nthe workplace is\ndetermined\n2.2. Innovative behaviors\nof leaders or managers\nin the organization are\nassessed\n2.3. Driving principles of\ninnovation are\ndiscussed\n2.1 Determinants of\ninnovative\nbehavior by\nScott and Bruce\n(1992)\n2.2 Four principles of\ninnovation\naccording to\nGallup\nManagement\nJournal (2007)\n\n2.1 Evaluating\norganizational\ninnovative\npractices\n2.2 Gauging innovative\nbehaviors of the\nleaders and\nmanagers in the\norganization\n2.3 Deliberating\nopportunities and\nchallenges in\nimplementing\ninnovation\n3. Implement\ninnovative\nways in the\nconduct of\nusual\nworkplace\npractices\n3.1. Innovative behaviors in\nthe workplace are\nperformed\n3.2. Innovative climate in the\nworkplace is maintained\n3.3. Adoption or modification\nof new ideas relevant to\nthe organizational needs\nis achieved\n3.1 Determinants of\ninnovative\nbehavior by\nScott and Bruce\n(1992)\n3.2 The nine\ndimensions of\ninnovation\nclimate (Isaksen\n& Isaksen, 2018)\n3.3 Techniques in\nimplementing\ninnovative\nchange in the\nworkplace\n\n3.1 Developing risk\nmanagement\ntechniques and\ncontrol systems\n3.2 Evaluating impact\nof changes and\ndeveloping action\nplans\n3.3 Demonstrating\nstrategies and\ntechniques in\nmanaging changes\nin the workplace\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\nPromulgated (12/17/2019)\n\n24\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Innovation\nMay include but not limited to:\n1.1\nProducts versus processes\n1.2\nRadical versus incremental\n1.3 Technical versus administrative\n2. Innovative behaviors\nMay include but not limited to:\n2.1 Always generate creative ideas or new solutions\n2.2 Exploring and secure funds or resources required for\nimplementing new ideas\n2.3 Establishing adequate plans and schedules for\nimplementing new ideas\n2.4 Contributing suggestions or approaches for others’ creative\nideas\n\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n