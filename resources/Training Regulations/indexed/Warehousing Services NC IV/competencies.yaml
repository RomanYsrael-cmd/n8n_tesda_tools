and \nresources \n2.1 Classification of  \n        materials and  \n        resources  \n2.2 Materials and  \n        resource  \n        planning \n2.3 Techniques in  \n        preparing  \n        estimates \n2.4  Analysis of  \n       deviation versus  \n       standards \n \n2.1  Preparing  \n        estimates on  \n        materials and  \n        resources  \n2.2  Analyzing  \n        deviation \n2.3  Preparing     \n        adjustment for  \n        discrepancies \n \n3. Interpret \ngraphical \nrepresentations \nof data \n \n3.1 Data are collated. \n3.2 Data are translated into \ngraphical representations \n3.3 Graphical \nrepresentations are \ninterpreted in accordance \nwith workplace \nrequirements \n3.1   Data analysis \n3.2   Graphical  \n         representations \n3.3   Methods of  \n         interpreting  \n         graphs  \n \n3.1 Collating data \n3.2 Analyzing data \n3.3 Interpreting  \n        graphs\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing Services NC IV  \n \nPromulgated (12/17/2019)  \n \n \n45 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Calculations \n \n \nMay include: \n1.1 \nMoney \n1.2 \nVolume \n1.3 \nWidth \n1.4 \nHeight \n1.5 \nWeight \n1.6 \nTime \n1.7 \nDimensions \n1.8 \nLength and distance \n1.9 \nArea  \n1.10 \nPerimeter \n1.11 \nCapacity \n2. Mathematical Operations  \nMay include: \n2.1 \nMultiplication \n2.2 \nDivision \n2.3 \nAddition \n2.4 \nSubtraction \n2.5 \nFraction \n2.6 \nPercentages \n2.7 \nRatio and proportion \n2.8 \nConversion \n3. Materials and Resources \nMay include: \n3.1       Raw materials \n3.2       Packaging materials \n3.3       Finished goods \n3.4       Work-in process \n3.5       Promo items \n3.6       Manpower \n3.7       Man hours \n3.8       Pallet \n3.9       Pallet spaces \n3.10    Collaterals\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing Services NC IV  \nPromulgated (12/17/2019)  \n \n \n \n46 \nEVIDENCE GUIDE \n \n1. Critical Aspects \nof Competency \n \n 