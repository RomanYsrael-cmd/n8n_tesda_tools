loring and secure funds or resources required for \nimplementing new ideas \n2.3  Establishing adequate plans and schedules for \nimplementing new ideas \n2.4  Contributing suggestions or approaches for others’ creative \nideas \n \n \n        \n      EVIDENCE GUIDE \n \n1.   Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nAnalyzed and evaluated systems and performance in key \nareas of the organization and identify opportunities for \nimprovement, seeking advice from experts as appropriate \n1.2 \nPromoted the value of creativity, innovation and sustainability \nand recognize successes \n1.3 \nSupported the testing and trialling of new ideas and \nundertake risk management and cost-benefit analysis for \noptions \n1.4 \nPlanned for and implemented improvements using \norganization’s processes for approvals, project management \nand change management \n1.5 \nFacilitated effective contributions to and communications \nabout continuous improvement and innovation \n1.6 \nCaptured insights, experiences and ideas for improvements \nand incorporate them into the organization’s knowledge \nmanagement systems and future planning. \n2.   Resource Implications \nThe following resources should be provided: \n2.1   Impact evaluation materials (guide and form) \n \n3.   Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Interview \n3.2 Written Evaluation \n3.3 Case analysis \n \n4.   Context for Assessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions\n",
