stination with promptness and speed Entrepreneurial skills combine a range of technical management and personal skills vital to promoting innovation, competitiveness and economic growth --- PDF PAGE 122 --- Warehousing Services NC IV Promulgated (12/17/2019) 120 Ergonomics scientific discipline concerned with the understanding of interactions among humans and other elements of a system. Feedback mechanism an effective way to gather, learn, and apply your customer suggestions in order to enhance product or service Forklift a powered industrial truck (usually engine, hydraulics or electricity used to lift and move materials in short distances Goal an idea of the future or desired result that a group of people plans and commits to achieve Good warehousing practices a list of principles applied in warehousing operations to optimize cost so that products are always available, accessible and in good condition Government regulatory laws passed by legislative bodies to conform to rules, policies, specifications and standards requirements Inventory total amount of goods and/or materials contained in a warehouse, store or factory at any given time. Inventory count a carefully coordinated counting process for an actual count of goods in stock compared to the quantities reported on the detailed inventory records Inventory record accuracy (IRA) a measure of how closely inventory records match the physical Job description an informative documentation that describes the general tasks or other related duties and responsibilities expected to be done at work Key Performance Indicators a type of performance measurement. It demonstrates how effectively a company is achieving key business objectives. It is use to evaluate business’ success at reaching targets Key Performance Target desired level of performance as measured by indicators Lift truck a vehicle used to lift, move, stack, rack, or otherwise manipulate loads. Lay-out the manner in which parts of the warehouse are arranged or laid-out Lift truck a vehicle used to lift, move, stack, rack, or otherwise manipulate loads. Load describes the materials being handled by a piece of equipment. Loading Dock also called loading bay is an area of a warehouse building where goods vehicles (usually road or rail) are loaded and unloaded. --- PDF PAGE 123 --- TESDA-SOP-QSO-01-F08 Warehousing Services NC IV Promulgated (12/17/2019) 121 Logistics Provider a company that provides management over the flow of goods and materials between points of origin to end- use destination. The provider will often handle shipping, inventory, warehousing, packaging and security functions for shipment Maintenance checklist tool commonly used to keep building and equipment safe by periodical planning, checkups and maintenance activities Mentoring an experienced person assist a mentee in developing specific skills and knowledge that will enhance professional and personal growth Negotiation discussion aimed at reaching an agreement. Objectives a result that a company aims to achieve within a time frame and resources available Order a request by one party to another to make, supply, deliver, transfer or receive goods and services. Order fulfillment complete process from point of sales inquiry to a delivery of product to the customer Outbound managing and controlling outgoing materials starting from the download of materials to the shipping of products from the warehouse Pallet loader a warehousing or manufacturing equipment designed to lift and move load on a pallet Pallet truck an equipment used to lift and move pallets are either manually operated or powered by means of electricity and hydraulics Palletizing scheme create a number of alternative patterns or arrangement which ensures cargo stability, taking into account pallet and box volumes Performance appraisal regular review of an employee’s job performance and overall contribution to a company. Performance metrics measures an organization to assess how well workers are doing their tasks and how companies are accomplishing their objectives Personnel management an administrative specialization that focuses on hiring and development of employees to become more valuable to the company Pest control the regulation or management of a species defined as a pest Pilferage theft of part of the contents of a package in small amounts Preventive maintenance maintenance regularly performed on a piece of equipment to lessen the likelihood of breakdown --- PDF PAGE 124 --- Warehousing Services NC IV Promulgated (12/17/2019) 122 Project management practice of initiating, planning, executing, controlling, closing the work of a team to achieve specific goals and meet success criteria within a specified time Process improvement program process of identifying, analyzing, improving existing business processes to eliminate weak points or bottlenecks in operations Purchase Order a document used to approve, track, and process purchased items Racking system storage system designed to stack materials in horizontal rows with multiple levels Receipt involves the transfer of ownership of incoming goods ensuring that the documentation is accurate, correct and allows the goods to be made available as soon as possible Reconciliation a process where a company balances its physical inventory with the figures in its accounting books. Reverse logistics process of moving goods beyond their typical final destination for re-use, capturing value or proper disposal Shelf Life length of time that a product maybe stored without becoming unfit for use, consumption or for sale Signages and visual cues information or instruction on a signboard Skills type of work and activity which requires special training and knowledge Skills inventory report containing information on knowledge skills abilities and experiences of current employees Stacking height an orderly pile of stocks/goods, especially one arranged in layers. Stock level quantity of stocks kept on the warehouse required for