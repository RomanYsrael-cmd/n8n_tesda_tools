  "source_text": "SECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an individual\ncan perform the workplace requirements based on the relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies\n\n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS\n\n4.1.1\nThe full National Qualification of WAREHOUSING SERVICES NC IV shall be obtained\nwhen a candidate demonstrates competence in all units of competency listed in Section\n1. A successful candidate shall be awarded a National Certificate signed by the TESDA\nDirector General.\n\n4.1.2\nAssessment shall focus on the core units of competency. The basic and common units\nare assessed concurrently with the core units.\n\n4.1.3\nRecognition of Prior Learning (RPL). Candidates who have gained competencies\nthrough education, informal training, and work or life experiences may apply for\nrecognition in a particular qualification through competency assessment.\n\n4.1.4\nThe following are qualified to apply for assessment for certification for WAREHOUSING\nSERVICES NC IV:\n4.1.4.1 Graduating students/trainees of with Training Regulation (WTR)-registered\nprograms, graduates of No-Training Regulation (NTR) programs or graduates\nof formal/non-formal/informal including enterprise based training programs\nrelated to warehousing services Industry workers in warehousing operations.\n\n4.1.4.2\nExperienced workers in warehousing and logistics\n\n4.1.5 Re-assessment shall focus only on the specific areas/where the candidate has not\nsatisfactorily achieved the required level of competence AND must be undertaken\nwithin two (2) months during the period of validity of the Training Regulations\n\n4.1.6 A candidate who fails the assessment for two (2) consecutive times shall be advised to\ngo through a refresher course (on failed competencies) before taking another\nassessment.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the\ncandidate prior to actual competency assessment. SAG is a pre-assessment tool to\nhelp the candidate and the assessor determine what evidence is available, where gaps\nexists, including readiness for assessment.\n\n This document can:\n\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence that\nneeds to be presented\nd) Assist the candidate to identify key areas in which practice is needed or additional\ninformation or skills that should be gained prior to assessment.\n\n--- PDF PAGE 118 ---\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n116\n4.2.2 Accredited Assessment Center. Only a TESDA-accredited assessment center is\nauthorized to conduct competency assessment. The center has to undergo a quality\nassured procedure for accreditation before it is authorized by TESDA to manage the\nassessment for National Certification. It shall enter into a Memorandum of Agreement\nwith a company that has warehousing facility and other requirements that maybe\ndeemed necessary in the conduct of assessment.\n\n4.2.3 Accredited Competency Assessor. Only an accredited competency assessor is\nauthorized to conduct assessment of competence. A competency assessor undergoes\na quality assured system of accreditation procedure before being authorized by TESDA\nto assess the competencies of candidates for National Certification.\n\n4.2.3.1. Qualification of Competency Assessors\n\nFor Trainer-Assessor\n•\nHolder of National TVET Trainer Certificate Level 1 (NTTC) on\nWarehousing Services NC III with at least three (3) years work experience\nin warehousing/logistics industry.\n•\nKnowledgeable in Inventory Management / Warehouse Management\nSystem\n•\nHave assisted in the actual conduct of assessment to at least two (2)\ncandidates.\n\nFor Industry Assessor\n•\nHolder of National Certificate in Warehousing Services NC IV\n•\nHolder of Certificate of Competency (COC) in Conduct Competency\nAssessment under the Trainers Methodology Level 1 (TM 1\n•\nHave at least three (3) years work experience in warehousing/logistics\nindustry\n•\nKnowledgeable in Inventory Management / Warehouse Management\nSystem\n•\nHave assisted in the actual conduct of assessment to at least two (2)\ncandidates\n\n--- PDF PAGE 119 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n117\n COMPETENCY MAP – LOGISTICS TRANSPORT SECTOR (WAREHOUSING SERVICES NC IV)\n\nBASIC COMPETENCIES\n\nUtilize specialized\ncommunication\nskills\n\nDevelop and lead\nteams\nPerform\nhigher-order\nthinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute to\nthe practice of\nsocial justice\nin the\nworkplace\n\nManage\ninnovative work\ninstructions\n\nManage and\nevaluate usage of\ninformation\n\nLead in\nimprovement of\nOccupational\nSafety and\nHealth (OSH)\nprograms,\npolicies and\nprocedures\nLead towards\nimprovement of\nenvironmental work\nprograms, policies\nand procedures\nSustain\nentrepreneurial\nskills\n\nCOMMON COMPETENCIES\n\nApply workplace\nprocedures in\nwarehousing\noperations\nPerform industry\ncalculations in\nwarehousing\noperations\nEnsure security\nof stocks and\ncargo\n\nProvide efficient\ncustomer\nservice\nContribute to\nquality systems\nComply with\nworkplace\nprocedures in\nhandling stocks\nMaintain warehouse\nrecords\n\n--- PDF PAGE 120 ---\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n118\nCORE COMPETENCIES\n\nSupervise a warehouse\nteam or workgroup\n\nOversee the\nwarehouse facilities\nand equipment\nSupervise\nwarehouse\noperations\nImplement\nprocess\nimprovement\nsystem\n\n--- PDF PAGE 121 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n119\nGLOSSARY OF TERMS:\n\nBarcode\nOptical machine-readable representation of data relating to the\nobject to which it is attached. It is a small\n image of lines (bars) and spaces that is affixed to store items\nidentification cards, and etc. to identify a\n particular product number, person, or location.\n\nBenchmarking\nProcess of comparing business performance against best\npractices of other businesses in the industry\n\nBest Industry Practice\nMethod that has been generally accepted as superior and is\nused as a benchmark\n\nCapacity Planning Identifying how much space is needed in order to maximize\nproductivity, reduce costs, and support sales\n growth.\n\nCertificate of Compliance Document certified by a competent authority that the supplied\ngood or service meets the required\n specifications.\n\nCoaching\n process that aims to improve performance and focuses on the\n here and now' rather than on the distant past or future.\n\nCode of Ethics outlines the mission and values of the business or organization.\nIt lays out the rules of behavior and provides\n groundwork for ethical conduct of employees to follow\n\nCompetency ability to do something successfully or efficiently\n\nCount sheet form used to record physical inventory\n\nCount team group of people who conducts physical inventory\n\nCross-posting management initiative wherein employee is transferred to\nanother department for a defined period of time\n\nCustomer person that buys goods or services from a business\n\nCustomer service process of ensuring customer satisfaction with a product or\nservice.\n\nCut-off point or level that is a designated limit of something\n\nCycle count inventory auditing procedure where a small subset of inventory\nin a specific location is counted on a specific date\n\nDocument control policy regulates documents by number, name, version, effective date,\nreview date and history of amendments..\n\nDispatch sending something to a destination with promptness and speed\n\nEntrepreneurial skills combine a range of technical management and personal skills\nvital to promoting innovation, competitiveness and economic\ngrowth\n\n--- PDF PAGE 122 ---\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n120\n\nErgonomics scientific discipline concerned with the understanding of\ninteractions among humans and other elements of a\n system.\n\nFeedback mechanism an effective way to gather, learn, and apply your customer\nsuggestions in order to enhance product or service\n\nForklift a powered industrial truck (usually engine, hydraulics or\nelectricity used to lift and move materials in short\n distances\n\nGoal an idea of the future or desired result that a group of people\nplans and commits to achieve\n\nGood warehousing practices a list of principles applied in warehousing operations to optimize\ncost so that products are always available,\n accessible and in good condition\n\nGovernment regulatory laws passed by legislative bodies to conform to rules, policies,\nspecifications and standards requirements\n\nInventory total amount of goods and/or materials contained in a\nwarehouse, store or factory at any given time.\n\nInventory count a carefully coordinated counting process for an actual count of\ngoods in stock compared to the quantities\n reported on the detailed inventory records\n\nInventory record accuracy (IRA) a measure of how closely inventory records match the physical\n\nJob description an informative documentation that describes the general tasks\nor other related duties and responsibilities\n expected to be done at work\n\nKey Performance Indicators a type of performance measurement. It demonstrates how\neffectively a company is achieving key business\n objectives. It is use to evaluate business’ success at reaching\ntargets\n\nKey Performance Target desired level of performance as measured by indicators\n\nLift truck a vehicle used to lift, move, stack, rack, or otherwise manipulate\nloads.\n\nLay-out the manner in which parts of the warehouse are arranged or\nlaid-out\n\nLift truck a vehicle used to lift, move, stack, rack, or otherwise manipulate\nloads.\n\nLoad describes the materials being handled by a piece of equipment.\n\nLoading Dock also called loading bay is an area of a warehouse building\nwhere goods vehicles (usually road or rail) are\n loaded and unloaded.\n\n--- PDF PAGE 123 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n121\nLogistics Provider a company that provides management over the flow of goods\nand materials between points of origin to end-\n use destination. The provider will often handle shipping,\ninventory, warehousing, packaging and security\n functions for shipment\n\nMaintenance checklist tool commonly used to keep building and equipment safe by\nperiodical planning, checkups and maintenance\n activities\n\nMentoring an experienced person assist a mentee in developing specific\nskills and knowledge that will enhance\n professional and personal growth\n\nNegotiation discussion aimed at reaching an agreement.\n\nObjectives a result that a company aims to achieve within a time frame and\nresources available\n\nOrder a request by one party to another to make, supply, deliver,\ntransfer or receive goods and services.\n\nOrder fulfillment complete process from point of sales inquiry to a delivery of\nproduct to the customer\n\nOutbound managing and controlling outgoing materials starting from the\ndownload of materials to the shipping of\n products from the warehouse\n\nPallet loader a warehousing or manufacturing equipment designed to lift and\nmove load on a pallet\n\nPallet truck an equipment used to lift and move pallets are either manually\noperated or powered by means of electricity\n and hydraulics\n\nPalletizing scheme create a number of alternative patterns or arrangement which\nensures cargo stability, taking into account\n pallet and box volumes\n\nPerformance appraisal regular review of an employee’s job performance and overall\ncontribution to a company.\n\nPerformance metrics measures an organization to assess how well workers are doing\ntheir tasks and how companies are\n accomplishing their objectives\n\nPersonnel management an administrative specialization that focuses on hiring and\ndevelopment of employees to become more\n valuable to the company\n\nPest control the regulation or management of a species defined as a pest\n\nPilferage theft of part of the contents of a package in small amounts\n\nPreventive maintenance maintenance regularly performed on a piece of equipment to\nlessen the likelihood of breakdown\n\n--- PDF PAGE 124 ---\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n122\n\nProject management practice of initiating, planning, executing, controlling, closing the\nwork of a team to achieve specific goals and\n meet success criteria within a specified time\n\nProcess improvement program process of identifying, analyzing, improving existing business\nprocesses to eliminate weak points or\n bottlenecks in operations\n\nPurchase Order a document used to approve, track, and process purchased\nitems\n\nRacking system storage system designed to stack materials in horizontal rows with\nmultiple levels\n\nReceipt involves the transfer of ownership of incoming goods ensuring\nthat the documentation is accurate, correct and\n allows the goods to be made available as soon as possible\n\nReconciliation a process where a company balances its physical inventory with\nthe figures in its accounting books.\n\nReverse logistics process of moving goods beyond their typical final destination\nfor re-use, capturing value or proper disposal\n\nShelf Life length of time that a product maybe stored without becoming\nunfit for use, consumption or for sale\n\nSignages and visual cues information or instruction on a signboard\n\nSkills type of work and activity which requires special training and\nknowledge\n\nSkills inventory report containing information on knowledge skills abilities and\nexperiences of current employees\n\nStacking height an orderly pile of stocks/goods, especially one arranged in\nlayers.\n\nStock level quantity of stocks kept on the warehouse required for efficient\nand effective control\n\nStock Locator System a system with the capability of tracking supplies and inventory\nduring transport and storage.\n\nStorage location a place where stock is physically kept\n\nStrategies plans of action designed to achieve over-all aim\n\nSurveillance Equipment system to monitor activities, behavior or information for the\npurpose of managing operations\n\nTactics conceptual action aiming at the achievement of a goal\n\n--- PDF PAGE 125 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n123\nTransport provider a company that provides management over the flow of goods\nand materials between points of origin to end-\n use destination. The provider will often handle shipping,\ninventory, warehousing, packaging and security\n functions for shipment\n\nTransport-Route planning process to plan for the most cost-effective route by minimizing\nthe distance traveled and time taken in the\n delivery process\n\nTruck turnaround process of readying a transport vehicle for departure after its\narrival\n\nWarehouse Facility a facility where raw materials and manufactured goods materials\nare stored before distribution.\n\nWork-in-Process part of manufacturer’s inventory that has not yet been completed\nand transferred as finished goods inventory\n\n--- PDF PAGE 126 ---\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n124\nACRONYMS:\n\nBFP Bureau of Fire Protection\nBIR Bureau of Internal Revenues\nDA Department of Agriculture\nDENR Department of Environment and Natural Resources\nDOLE – OSHS Department of Labor and Employment – Occupational Safety and Health\nStandards\nDTI Department of Trade and Industry\nFDA Food and Drug Administration\nFIFO First in First Out\nGPS Global Positioning System\nGWP Good Warehousing Practices\nIM Inventory Management\nIMWM Inventory Management Warehouse Management\nIRA Inventory Records Accuracy\nKPI Key Performance Indicators\nLIFO Last In First Out\nLIFR Line Item Fill Rate\nMSME Micro Small Medium Enterprise\nOFR Order Fill Rate\nPDEA Philippine Drug Enforcement Agency\nPPIP Personnel Performance Improvement Plan\nRFID Radio Frequency Identification\nSCMAP Supply Chain Management Association of the Philippines\nSCOR Supply Chain Operations Reference\nSKU Stock Keeping Unit\nSWOT Strengths Weaknesses Opportunities Threats\nTNA Training Needs Analysis\nTPLP Third Party Logistics Provider\nWMS Warehouse Management System\n 5S Sort, Set, Shine, Standardize, Sustain, - A system organizing spaces so\nwork can be performed efficiently, effectively\n and safely\n\n--- PDF PAGE 127 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n125\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nWarehousing Services NC IV\nQualification Code:\nLOGWHS419\n\nRevision\nNo.\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nWarehousing Services NC IV\n\n2019-74/\nDec 17, 2019\n\n01\n\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 128 ---\nWarehousing Services NC IV\n\nPromulgated (12/17/2019)\n\n126\nACKNOWLEDGMENT\n\nThe Technical Education and Skills Development Authority (TESDA) would like to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies and labor groups who rendered their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n• THE TECHNICAL EXPERTS PANEL (TEP)\n\nMr. Sebastian G.Arceo\nMr. Pierre Carlo C. Curay\nTechnical Expert\nSCMAP