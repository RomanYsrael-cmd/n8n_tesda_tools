  "source_text": "COMPETENCY MAP – HUMAN HEALTH/HEALTH CARE SECTOR\nASSISTIVE REHABILITATION TECHNOLOGY SERVICES (WHEELCHAIR) NC II\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\n\n--- PDF PAGE 136 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 132\nPrepare and\nmaintain beds\nCollect and\nmaintain linen\nstocks at end-\nusers location\nAssist in patient\nmobility\nAssist in\ntransporting\npatients\nAssist in bio-\npsychosocial\nsupport care of\npatients\nHandle waste in a\nhealth care\nenvironment\nPlan the hilot wellness\nprogram of client/s\nProvide pre-\nservice to hilot\nclient/s\nApply hilot wellness\nmassage\ntechniques\nProvide post\nadvice and post-\nservices to hilot\nclients\nPractice good\nhousekeeping\nMonitor supply/\ninventory of\npharmaceutical\nproducts\nHandle and control\npharmaceutical\nproducts\nArrange and display\npharmaceutical\nproducts\nPerform good\nlaboratory\npractices\nAdhere to good\nmanufacturing\npractices\nDemonstrate product\nknowledge on\nmedicines\nDispense\npharmaceutical\nproducts\nPerform health\npromotion\neducation, vigilance\nInstall biomedical\nequipment\nPerform corrective\nmaintenance on\nbiomedical\nequipment\nPerform\npreventive\nmaintenance on\nbiomedical\nequipment\nRepair\nbiomedical\nequipment\nAssess and refer\nbiomedical\nequipment\nDevelop massage\npractice\nPerform client\nconsultation\nPerform body\nmassage and work\narea\nMaintain and\norganize tools,\nequipment,\nsupplies\nPerform basic life\nsupport\nMaintain life\nsupport\nequipment and\nresources\nImplement safe\naccess and\nextrication\nprocedures in an\nemergency\nManage request\nfor ambulance\nservice\nAllocate\nambulance\nservice\nresources\nCoordinate\nemergency\nresources\nDeliver basic\nambulance\ncommunication skills\nSupervise on-\nroad operations\nManage the scene of\nan emergency\nManage the scene\nof a special event\nManage routine\nscene\nDeliver pre-\nhospital patient\ncare\nDeliver intensive\npre-hospital\npatient care\nManage\nambulance\noperations\nTransport\nemergency\npatients\nTransport non-\nemergency\npatients\nDrive vehicles\nunder operational\nconditions\nAssist the\nhousehold to\nidentify health\nproblems to\npromote health\nand well-being\nShare knowledge and\nskills among members\nto provide information,\neducation and\ncommunication (IEC)\nand/or household\nteaching in disease\nprevention and control\nEnsure the proper\nmaintenance of\nhealth station and\nsafe custody of its\nequipment,\nmedical supplies,\nmaterials, and\nhealth records\nMonitor health\nstatus of household\nmembers under\nhis/her area of\nservice coverage\nMaintain updated\nlist/records of\nhealth activities\nAnalyze and\ninterpret\nophthalmic lens\nprescription\nEdge and mount\nophthalmic\nappliances\nApply UV coat/\ntint to\nophthalmic\nlenses\nFabricate models\nFabricate custom\nimpression trays\nFabricate\nregistration bite\nrims\nArticulate models and\ntransfer records\nFabricate\nmouthguard\nFabricate metal\ncrown and bridge\nstructures\nFabricate ceramic\nrestorations\nFabricate indirect\ncomposite/\npolymer fixed\nrestorations\nJoin alloy\nstructures\nArrange artificial\nteeth for\ncomplete\ndentures\nSet-up and wax\nremovable partial\ndentures\nWax, process and\nfinish acrylic\ndentures and\nappliances\nFabricate thermo\nformed bases and\nappliances\nRepair and modify\ndentures and\nappliances\nFabricate oral\nsplints\nFabricate\northodontic\nappliances\nFabricate cast\nmetal removable\npartial denture\nframework\nPerform oral\nexamination\nPromote oral\nhealth and\nhygiene\nOperate a\ndental\nradiographic\nequipment\nApply the\nprinciple of\nradiology biology\nand protection in\ndental practice\nPerform scaling\nand polishing\nMaintain dental\nrecords and\nresources\nProvide effective\npatient/client service\nManage dental\nlaboratory\nproduction and\noperation\nPerform\nadministrative\nfunctions\nContinue\nprofessional\ngrowth and\ndevelopment\nParticipate in the\nimplementation\nand monitoring of\nnewborn’s care\nplan\nDevelop the ability\nto recognize\nnewborn’s growth\nand development\nPerform caring\nskills for\nnewborn\nParticipate in the\nimplementation and\nmonitoring of infant’s\ncare plan\nProvide physical\nneeds, care and\nsupport to infant\nFoster social,\nintellectual and\nemotional\ndevelopment of\ninfant\nParticipate in the\nimplementation and\nmonitoring of toddler’s\ncare plan\nDevelop the ability\nto recognize\ntoddler’s growth\nand development\nPerform caring\nskills for toddler\nParticipate in the\nimplementation and\nmonitoring of pre-\nschooler’s care plan\n\n--- PDF PAGE 137 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 133\nDevelop the ability\nto recognize pre-\nschooler’s growth\nand development\nPerform caring\nskills for pre-\nschooler\nProvide\nassistance and\ncare to personal\nneeds of grade\nschooler\nFoster\nphysiological\nneeds and\ncognitive\ndevelopment of\ngrade schooler\nFoster physical\ngrowth and\ndevelopment of\ngrade schooler\nRespond to\nemergency for\ngrade schooler\nFoster physical growth\nand development of\nadolescent\nPromote\ndevelopmental\ntasks for\nadolescent\nRespond to\nemergency for\nadolescent\nDevelop the ability\nto recognize aging\nprocess\nParticipate in the\nimplementation\nand monitoring of\nclient’s care plan\nPerform caring\nskills\nPerform\nspecialty care\nprocedures\nAssist client in\nadministering\nprescribed\nmedication\nParticipate in the\nimplementation\nand monitoring of\nclient’s care plan\nProvide\nassistance and\nsupport on\nenvironment and\nbiopsychosocial\nneeds of clients\nDevelop the ability to\nrecognize healthy\nbody systems and\napply medical\nterminologies\nProvide care and\nsupport to\nactivities of daily\nliving (ADL) of\nclients\nProvide assistance\nin administering\nprescribed\nmedications to\nclients\nProvide care and\nsupport to clients\nwith special needs\nRespond to\nemergency\nsituations\nProvide\nimmediate care\nand support to\nchildren with\nspecial needs\nProvide\nimmediate care\nand support to\nadults and\nelderly with\nspecial needs\nCarry out\nresponse\nintegration and\ncoordination in a\nmass casualty\nincident\nPerform patient\nassessment\nProvide\nemergency care\nfor suspected\nspine injury\nProvide pre-hospital\ninterventions for\ntrauma patients\nProvide pre-\nhospital\ninterventions for\nshock patients\nProvide pre-hospital\ninterventions for\nmedical patients\nPerform basic life\nsupport and use\nairway adjuncts\nProvide pre-\nhospital\ninterventions for\nspecial patient\npopulations\nPerform patient\npackaging\nConduct patient\ntransport\nDeliver basic pre-\nhospital\ncommunication\nskills\nCreate a positive\nmold from a\nnegative cast\nFabricate a\ntranstibial/ankle\ndisarticulation\nprosthesis\nFabricate a\ntransfemoral/knee\ndisarticulation\nprosthesis\nFabricate a\ntransradial/wrist\ndisarticulation\nprosthesis\nFabricate a\ntranshumeral/elbow\ndisarticulation/shoul\nder disarticulation\nprosthesis\nPerform basic\nrepair and/or\nreplacement of\nthe prosthetic\ndevices\nFabricate a foot\northosis\nFabricate an\nankle-foot orthosis\nFabricate a\nknee-ankle-foot\northosis\nFabricate a wrist-\nhand orthosis\nFabricate a\ncustomized\nplastic thoraco-\nlumbo-sacral\northosis\nPerform basic\nrepair and/or\nreplacement of\nthe orthotic\ndevices\nReceive wheelchair\nreferral and\nappointment\nAssist the\nwheelchair\nclinician during\nassessment\nCoordinate\nprocurement of the\nappropriate\nwheelchair size and\nits parts\nPerform\nwheelchair\nassembly and\nmodifications\nAssist the\nwheelchair\nclinician in\nwheelchair\ncheckout and\nfitting\nAssist wheelchair\nclinician in user\ntraining\nPerform\nmaintenance\nand repair on\nwheelchair\n\n--- PDF PAGE 138 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 134\nGLOSSARY OF TERMS\n\nAmputation – surgical loss of a limb (i.e. upper extremity or lower extremity) that may be\ndue to trauma or medical condition (e.g. cancer, gangrene)\nArm rest - part of a wheelchair where a patient may put his arms for support while sitting\non a wheelchair\nBackrest - part of a wheelchair that provides support to the trunk of the patient while\nsitting. Height of this support depends on the sitting balance of the patient.\nCarer - a person responsible for providing appropriate care to the patient. He or she may\nbe a family member (e.g. parent, siblings, or relatives) or a hired individual\n(see also caregiver)\nCaregiver - a person responsible for providing appropriate care to the patient. He or she\nmay be a family member (e.g. parent, siblings, or relatives) or a hired\nindividual (see also carer)\nCaster (castor) wheels - a pair of wheels on a rotating mount that is found at the front of\na wheelchair\nCerebral Palsy (CP) - a group of permanent disorders of the development of movement\nand posture causing activity limitation that occurred in the developing fetal or\ninfant brain\nCerebrovascular Disease (CVD) – commonly known as stroke or brain attack; disease\nof the blood vessels supplying the brain (i.e. arteries). This may include (but\nnot limited to) carotid stenosis, aneurysm, arteriovenous malformation. (see\nalso stroke)\nChronic Kidney Disease (CKD) - a prolonged injury to the kidney that may be due to\nsome medical conditions (e.g. diabetes, hypertension) that results to\ngeneralized weakness of a patient that eventually affects the mobility\nFoot rest - a part of the wheelchair where a patient puts the feet on\nFoot support - a part of a foot rest that keeps the foot in place\nFrailty - marked vulnerability of an elderly person as a result of physiologic decline\nHead support - part of a wheelchair that is located above the backrest to provide\nadditional support to a patient with poor head and neck control\nLeg rest - part of a wheelchair that allows for additional support on the leg when\nrepositioning is done as part of pressure relief technique.\nMobility - a state of being mobile\nMuscular Dystrophy - a genetic disease that leads to progressive weakness of a child\nPoliomyelitis - an infectious disease caused by poliovirus\nPelvic support - part of a wheelchair that provides additional support to the patient by\nkeeping the pelvis in place while seated on the wheelchair\nPostural support devices - parts of a wheelchair that are added based on the needs of\na patient\nRear wheels - 2 big wheels on the rear part of the wheelchair. They spin on an axle as\nthe patient propels it (or when a caregiver pushes the wheelchair)\nSeat cushion - part of the wheelchair where the patient sits. It is cushioned to provide\ncomfort and adequate pressure on the buttocks of the patient\n\n--- PDF PAGE 139 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 135\nSpinal Cord Injury (SCI) - a damage to any of the levels of the spinal cord (i.e. cervical,\nthoracic, lumbar, sacral) that may be secondary to trauma or medical\ncondition (e.g. cancer, transverse myelitis) that causes mobility impairment\nto an individual\nStroke - a brain disorder resulting from an interrupted blood supply to the brain\nThigh support - part of the wheelchair that keeps the thigh in proper position while the\npatient sits\nTransfer technique - a safe technique followed by the patient and caregiver to facilitate\nsafe movement in and out of the wheelchair\nTransverse Myelitis - an inflammatory disease of the spinal cord that leads to pain,\nmuscle weakness or paralysis, and bowel and bladder disorder\nTraumatic Braid Injury (TBI) - an injury to the brain after an individual sustained a violent\nblow or jolt to the head or body\nWheelchair - an assistive technology that facilitates easier mobility of an individual with\ninability or difficulty in standing and walking, either caregiver-propelled or self-\npropelled. This may be used temporarily or permanently\nWheelchair brake - wheel lock to keep the wheelchair in a safe stop while the patient is\nresting on it or is about to transfer\nWheelchair Clinician - a medical or paramedical specialist who was trained and licensed\nas a wheelchair assessor that will direct or guide the wheelchair technician-\nin-training on how to come up with the prescribed wheelchair (see also\nwheelchair service provider)\nWheelchair frame - a part of the wheelchair that holds all the other parts of the wheelchair\nin place\nWheelchair prescription - a detailed design of a wheelchair as a result of a thorough\nassessment of the clinician on a patient. This contains the needs of the\npatient that a technician will follow to assemble a safe and comfortable\nwheelchair\nWheelchair service provider - trained wheelchair assessor who will provide the\nnecessary direction to the wheelchair technician-in-training (see also\nclinician)\nWheelchair service provision - the service rendered to an individual who will potentially\nneed a wheelchair. This includes physical assessment of the patient,\nprescribing of the wheelchair by the assessor, assembly and fitting of the\nprescribed wheelchair, follow up, and repair of the wheelchair if there is any\ndamage from overuse\nWheelchair technician - an individual who is undergoing training in the aspect of\nassembling and repair of wheelchair\nWheelchair user - patient who will be needing a wheelchair. He may have a temporary\nor permanent disability that will require the use of this assistive technology\n\n--- PDF PAGE 140 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 136\nREFERENCES\n\nDisability and health [Internet]. World Health Organization. 2017 [cited 29 December\n2017]. http://www.who.int/mediacentre/factsheets/fs352/en/\n\nData from Latter Day Saints Charities and Physicians for Peace\n\nInternational Society of Wheelchair Professionals\n\nAt a glance: The Philippine health care system https://www.manilatimes.net/at-a-\nglance-the-philippine-health-care-system/395117/\n\n--- PDF PAGE 141 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 137",
