      "number": "4",
      "text": "2 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences with at least 9 months experience in wheelchair service provision (within the last 3 years) may apply for recognition in this Qualification through Portfolio Assessment. The candidates should provide proof of providing wheelchair services to at least 5 wheelchair-user clients from referral to follow-up. The type of wheelchairs used by the clients should be composed of at least 1 basic long base, 1 basic short base and 3 intermediate wheelchairs. Requirements and implementation procedure of Portfolio Assessment must be consistent with TESDA Circular No. 47, series of 2018 on “Implementing Guidelines on the Implementation of Portfolio Assessment Leading to Recognition of Prior Learning (RPL) within the TESDA Assessment and Certification System”."
