t ophthalmic lens prescription Edge and mount ophthalmic appliances Apply UV coat/ tint to ophthalmic lenses Fabricate models Fabricate custom impression trays Fabricate registration bite rims Articulate models and transfer records Fabricate mouthguard Fabricate metal crown and bridge structures Fabricate ceramic restorations Fabricate indirect composite/ polymer fixed restorations Join alloy structures Arrange artificial teeth for complete dentures Set-up and wax removable partial dentures Wax, process and finish acrylic dentures and appliances Fabricate thermo formed bases and appliances Repair and modify dentures and appliances Fabricate oral splints Fabricate orthodontic appliances Fabricate cast metal removable partial denture framework Perform oral examination Promote oral health and hygiene Operate a dental radiographic equipment Apply the principle of radiology biology and protection in dental practice Perform scaling and polishing Maintain dental records and resources Provide effective patient/client service Manage dental laboratory production and operation Perform administrative functions Continue professional growth and development Participate in the implementation and monitoring of newborn’s care plan Develop the ability to recognize newborn’s growth and development Perform caring skills for newborn Participate in the implementation and monitoring of infant’s care plan Provide physical needs, care and support to infant Foster social, intellectual and emotional development of infant Participate in the implementation and monitoring of toddler’s care plan Develop the ability to recognize toddler’s growth and development Perform caring skills for toddler Participate in the implementation and monitoring of pre- schooler’s care plan --- PDF PAGE 137 --- Assistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 133 Develop the ability to recognize pre- schooler’s growth and development Perform caring skills for pre- schooler Provide assistance and care to personal needs of grade schooler Foster physiological needs and cognitive development of grade schooler Foster physical growth and development of grade schooler Respond to emergency for grade schooler Foster physical growth and development of adolescent Promote developmental tasks for adolescent Respond to emergency for adolescent Develop the ability to recognize aging process Participate in the implementation and monitoring of client’s care plan Perform caring skills Perform specialty care procedures Assist client in administering prescribed medication Participate in the implementation and monitoring of client’s care plan Provide assistance and support on environment and biopsychosocial needs of clients Develop the ability to recognize healthy body systems and apply medical terminologies Provide care and support to activities of daily living (ADL) of clients Provide assistance in administering prescribed medications to clients Provide care and support to clients with special needs Respond to emergency situations Provide immediate care and support to children with special needs Provide immediate care and support to adults and elderly with special needs Carry out response integration and coordination in a mass casualty incident Perform patient assessment Provide emergency care for suspected spine injury Provide pre-hospital interventions for trauma patients Provide pre- hospital interventions for shock patients Provide pre-hospital interventions for medical patients Perform basic life support and use airway adjuncts Provide pre- hospital interventions for special patient populations Perform patient packaging Conduct patient transport Deliver basic pre- hospital communication skills Create a positive mold from a negative cast Fabricate a transtibial/ankle disarticulation prosthesis Fabricate a transfemoral/knee disarticulation prosthesis Fabricate a transradial/wrist disarticulation prosthesis Fabricate a transhumeral/elbow disarticulation/shoul der disarticulation prosthesis Perform basic repair and/or replacement of the prosthetic devices Fabricate a foot orthosis Fabricate an ankle-foot orthosis Fabricate a knee-ankle-foot orthosis Fabricate a wrist- hand orthosis Fabricate a customized plastic thoraco- lumbo-sacral orthosis Perform basic repair and/or replacement of the orthotic devices Receive wheelchair referral and appointment Assist the wheelchair clinician during assessment Coordinate procurement of the appropriate wheelchair size and its parts Perform wheelchair assembly and modifications Assist the wheelchair clinician in wheelchair checkout and fitting Assist wheelchair clinician in user training Perform maintenance and repair on wheelchair --- PDF PAGE 138 --- Assistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 134 Amputation – surgical loss of a limb (i.e. upper extremity or lower extremity) that may be due to trauma or medical condition (e.g. cancer, gangrene) Arm rest - part of a wheelchair where a patient may put his arms for support while sitting on a wheelchair Backrest - part of a wheelchair that provides support to the trunk of the patient while sitting. Height of this support depends on the sitting balance of the patient. Carer - a person responsible for providing appropriate care to the patient. He or she may be a family member (e.g. parent, siblings, or relatives) or a hired individual (see also caregiver) Caregiver - a person responsible for providing appropriate care to the patient. He or she may be a family member (e.g. parent, siblings, or relatives) or a hired individual (see also carer) Caster (castor) wheels - a pair of wheels on a rotating mount that is found at the front of a wheelchair Cerebral Palsy (CP) - a group of permanent disorders of the development of movement and posture causing activity limitation that occurred in the developing fetal or infant brain Cerebrovascular Disease (CVD) – commonly known as stroke or brain attack; disease of the blood vessels supplying the brain (i.e. arteries). This may include (but not limited to) carotid stenosis, aneurysm, arteriovenous malformation. (see also stroke) Chronic Kidney Disease (CKD) - a prolonged injury to the kidney that may be due to some medical conditions (e.g. diabetes, hypertension) that results to generalized weakness of a patient that eventually affects the mobility Foot rest - a part of the wheelchair where a patient puts the feet on Foot support - a part of a foot rest that keeps the foot in place Frailty - marked vulnerability of an elderly person as a result of physiologic decline Head support - part of a wheelchair that is located above the backrest to provide additional support to a patient with poor head and neck control Leg rest - part of a wheelchair that allows for additional support on the leg when repositioning is done as part of pressure relief technique. Mobility - a state of being mobile Muscular Dystrophy - a genetic disease that leads to progressive weakness of a child Poliomyelitis - an infectious disease caused by poliovirus Pelvic support - part of a wheelchair that provides additional support to the patient by keeping the pelvis in place while seated on the wheelchair Postural support devices - parts of a wheelchair that are added based on the needs of a patient Rear wheels - 2 big wheels on the rear part of the wheelchair. They spin on an axle as the patient propels it (or when a caregiver pushes the wheelchair) Seat cushion - part of the wheelchair where the patient sits. It is cushioned to provide comfort and adequate pressure on the buttocks of the patient --- PDF PAGE 139 --- Assistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 135 Spinal Cord Injury (SCI) - a damage to any of the levels of the spinal cord (i.e. cervical, thoracic, lumbar, sacral) that may be secondary to trauma or medical condition (e.g. cancer, transverse myelitis) that causes mobility impairment to an individual Stroke - a brain disorder resulting from an interrupted blood supply to the brain Thigh support - part of the wheelchair that keeps the thigh in proper position while the patient sits Transfer technique - a safe technique followed by the patient and caregiver to facilitate safe movement in and out of the wheelchair Transverse Myelitis - an inflammatory disease of the spinal cord that leads to pain, muscle weakness or paralysis, and bowel and bladder disorder Traumatic Braid Injury (TBI) - an injury to the brain after an individual sustained a violent blow or jolt to the head or body Wheelchair - an assistive technology that facilitates easier mobility of an individual with inability or difficulty in standing and walking, either caregiver-propelled or self- propelled. This may be used temporarily or permanently Wheelchair brake - wheel lock to keep the wheelchair in a safe stop while the patient is resting on it or is about to transfer Wheelchair Clinician - a medical or paramedical specialist who was trained and licensed as a wheelchair assessor that will direct or guide the wheelchair technician- in-training on how to come up with the prescribed wheelchair (see also wheelchair service provider) Wheelchair frame - a part of the wheelchair that holds all the other parts of the wheelchair in place Wheelchair prescription - a detailed design of a wheelchair as a result of a thorough assessment of the clinician on a patient. This contains the needs of the patient that a technician will follow to assemble a safe and comfortable wheelchair Wheelchair service provider - trained wheelchair assessor who will provide the necessary direction to the wheelchair technician-in-training (see also clinician) Wheelchair service provision - the service rendered to an individual who will potentially need a wheelchair. This includes physical assessment of the patient, prescribing of the wheelchair by the assessor, assembly and fitting of the prescribed wheelchair, follow up, and repair of the wheelchair if there is any damage from overuse Wheelchair technician - an individual who is undergoing training in the aspect of assembling and repair of wheelchair Wheelchair user - patient who will be needing a wheelchair. He may have a temporary or permanent disability that will require the use of this assistive technology --- PDF PAGE 140 --- Assistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 136 Disability and health [Internet]. World Health Organization. 2017 [cited 29 December 2017]. http://www.who.int/mediacentre/factsheets/fs352/en/ Data from Latter Day Saints Charities and Physicians for Peace International Society of Wheelchair Professionals At a glance: The Philippine health care system https://www.manilatimes.net/at-a- glance-the-philippine-health-care-system/395117/ --- PDF PAGE 141 --- Assistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 137 The Technical Education and Skills Development Authority (TESDA) would like to extend sincerest thank you and appreciation to the representatives of business, industry, academe and government agencies who provided their time and expertise in the development and validation of this Training Regulations. MR. ABNER MANLAPAZ President Life Haven Center for Independent Living 2033 Santos Subdivision, Gen. T. De Leon Valenzuela City, 1442 MS. WENNAH G. MARQUEZ Division Chief (Public Services Officer IV) Persons with Disabilities Affairs Division City Government of Mandaluyong City Hall Complex, Maysilo Circle, Boni Avenue Barangay Plainview, Mandaluyong City DR. JEFFREY B. MONTES Director, Consultant JBM Physical Medicine and Rehabilitation Centre Inc. St. Vincent Polyclinic Building, Paseo del Congreso Malolos City, Bulacan DR. BILLY JAY N. PEDRON, PH.D Clinical Faculty (PT) De La Salle Medical and Health Sciences Institute - College of Rehabilitation Sciences Governor D. Mangubat Avenu