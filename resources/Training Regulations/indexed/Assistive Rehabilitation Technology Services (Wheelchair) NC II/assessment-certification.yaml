  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To\nattain\nthe\nnational\nqualification\nof\nASSISTIVE\nREHABILITATION\nTECHNOLOGY SERVICES (WHEELCHAIR) NC II, the candidate must\ndemonstrate competence in all units listed in Section 1. Successful candidates shall\nbe awarded a National Certificate signed by the TESDA Director General.\n\n4.1.2 Assessment shall cover all competencies with basic and common integrated or\nassessed concurrently with the core units of competency.\n\n4.1.3 Any of the following are qualified to undergo assessment and certification:\n\n4.1.3.1\nGraduates of WTR-registered, NTR-registered programs or formal/non-\nformal/informal including enterprise-based trainings related to Assistive\nRehabilitation Technology Services (Wheelchair) NC II; or\n\n4.1.3.2\nExperienced workers (wage employed or self-employed) who gained\ncompetencies in providing wheelchair services for at least 1 year within\nthe last 5 years.\n\n4.2\nRecognition of Prior Learning (RPL). Candidates who have gained competencies\nthrough education, informal training, previous work or life experiences with at least\n9 months experience in wheelchair service provision (within the last 3 years)\nmay apply for recognition in this Qualification through Portfolio Assessment. The\ncandidates should provide proof of providing wheelchair services to at least 5\nwheelchair-user clients from referral to follow-up. The type of wheelchairs used by\nthe clients should be composed of at least 1 basic long base, 1 basic short base and\n3 intermediate wheelchairs.\n\nRequirements and implementation procedure of Portfolio Assessment must be\nconsistent with TESDA Circular No. 47, series of 2018 on “Implementing Guidelines\non the Implementation of Portfolio Assessment Leading to Recognition of Prior\nLearning (RPL) within the TESDA Assessment and Certification System”.\n\n4.3\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the “Philippine TVET Competency Assessment and Certification\nSystem (PTCACS)”.\n\n--- PDF PAGE 134 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 130\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior to\nassessment.\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized t