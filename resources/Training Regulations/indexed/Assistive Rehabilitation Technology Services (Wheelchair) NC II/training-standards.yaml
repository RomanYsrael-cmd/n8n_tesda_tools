ith spring; Durable release handle\n1\npcs\nHeat Gun; rated power: Minimum of 1600W; voltage frequency:\n220-240V\n\n--- PDF PAGE 129 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 125\n3\npcs\nTire Pump without pressure gauge; max capacity: 120 PSI;\nbody: Aluminum or alloy [not plastic]\n3\npcs\nTire pump with pressure gauge; body: Aluminum or alloy [not\nplastic]\n2\npcs\nMetal pipe cutter\n2\npcs\nBench vise\n2\npcs\nTire lever\n6\npcs\nGun Tacker\n5\nsets\nDrill Bits for wood and metal\n\nEQUIPMENT\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n5\nsets\nHand held Electric Drill and Driver; 3-13 mm chuck; Multispeed\nfeatures; Power: 12-18volts; Voltage frequency: 220-240V\n2\npc\nProjector with White Screen OR Television set for lectures\n1\nset\nMicrophone and speakers\n5\npc\nWork bench (see WHO recommendations)\n2\nsets\nPersonal Computer with camera, microphone, with good internet\nconnection\n\nSource: WHO Wheelchair Service Training Package for Managers (Additional\nResources)\n\n--- PDF PAGE 130 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 126\nMATERIALS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n5\npcs\nBasic Wheelchair\n-\nShould be of varying sizes\n-\nShould be compatible with wheelchair parts itemized below:\n*Wheelchairs should be a combination of different models:\nAccording to seat type:\n-\nwith fixed, slung seat\n-\nwith tension adjustable seat\n\nAccording to back rest type:\n-\nwith fixed, slung backrest\n-\nwith tension adjustable backrest\n-\nwith solid backrest with comfort cushion\n\nAccording to arm rest type:\n-\nwith fixed, padded arm rests\n-\nwith removable, padded arm rests\n-\nwith flip-up, padded arm rests\n-\nwith sliding backwards arm rests\n-\nwith contoured or no armrest\n\nAccording to brake type:\n-\nwith long lever arm brake\n-\nwith short lever arm brake\n5\npcs\nFixed Frame Supportive Wheelchair\n-\nShould be of varying s