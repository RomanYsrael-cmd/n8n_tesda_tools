erly in\naccordance with the prescription\n• Discussion\n• Demonstration\n• Lecture\n• Blended learning\n•\nDemonstration\nwith questioning\n•\nObservation with\nquestioning\n•\nInterview\n4 hours\n\n--- PDF PAGE 120 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 116\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Elicit feedback from the wheelchair user\nregarding comfort of the postural support\ndevices in accordance with the initial fitting\n• Perform appropriate adjustment of postural\nsupport devices in accordance with the\nwheelchair user’s feedback\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Demonstrate interpersonal skills\n• Demonstrate communication skills\n• Demonstrate record-keeping skills\n• Follow safety manual\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n6. Assists\nwheelchair\nclinician in user\ntraining\n(20 hours)\n6.1 Instill wheelchair\nsafety practices\nto the client\n• Lecture and discussion on the following topics:\n-\nSafety protocol\n-\nIdentification of risks and hazards\n• Explain, model and implement safety protocol\nin accordance with the standard of practice\n• Identify and act upon potential risks to prevent\nor minimize the risk\n• Identify hazards and potential hazards in the\nenvironment and inform clients accordingly\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Demonstrate interpersonal skills\n• Demonstrate communication skills\n• Demonstrate record-keeping skills\n• Discussion\n• Demonstration\n• Lecture\n• Blended learning\n•\nDemonstration\nwith questioning\n•\nInterview\n•\nWritten Test\n4 hours\n\n--- PDF PAGE 121 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 117\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Follow safety manual\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n6.2 Correlate\nwheelchair user\ntraining to\nwheelchair parts\nand\nmodifications\n• Lecture and discussion on the following topics:\n-\nPressure sores\n-\nGuidelines in performing transfer\ntechniques\n-\nVarious wheelchair mobility techniques\n-\nProper care of Wheelchair components\nand parts\n• Explain wheelchair handling according to\nguidelines.\n• Explain prevention of pressure sore according\nto guidelines\n• Explain and demonstrate transfer techniques\naccording to the guidelines\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Demonstrate interpersonal skills\n• Demonstrate communication skills\n• Demonstrate record-keeping skills\n• Follow safety manual\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Discussion\n• Demonstration\n• Lecture\n• Blended learning\n•\nDemonstration\nwith questioning\n•\nInterview\n•\nWritten Test\n8 hours\n\n--- PDF PAGE 122 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 118\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6.3 Assist\nwheelchair\nclinician in\nmobility training\nfor wheelchair\nuser focusing on\nthe technical\naspect\n• Lecture and discussion on the following topics:\n- Wheelchair User training guidelines\n• Facilitate mobility training according to the\nwheelchair specification and guidelines\n• Explain, model and implement rules for safe\npractice during mobility training according to\nthe institutions protocol\n• Perform close monitoring of the wheelchair\nuser in accordance with established\nprocedures\n• Inform wheelchair clinician about the effects of\ndaily mobility on the wheelchair parts\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Demonstrate interpersonal skills\n• Demonstrate communication skills\n• Demonstrate record-keeping skills\n• Follow safety manual\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Discussion\n• Demonstration\n• Lecture\n• Blended learning\n•\nDemonstration\nwith questioning\n•\nInterview\n•\nWritten Test\n8 hours\n7. Perform\nmaintenance\nand repair on\nwheelchairs\n(13 hours)\n7.1 Follow up on the\nwheelchair user\nand the\nwheelchair\n• Lecture and discussion on the following topics:\n-\nConcept of a well-maintained wheelchair\n-\nWheelchair maintenance protocol\n• Check tires for pneumatic pressure, tire splits,\ncracks, bulging or loss of threads breaks in\naccordance with the wheelchair type\n• Check wheel attachment in accordance with\nthe wheelchair type\n• Check rear wheels for its alignment and in\naccordance with the wheelchair type\n• Discussion\n• Demonstration\n• Lecture\n• Blended learning\n•\nDirect\nobservation\nwhile tasks are\nbeing performed\n•\nQuestions/\nInterview\n•\nWritten\nEvaluation\n2 hours\n\n--- PDF PAGE 123 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 119\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Check castor wheels for its alignment, no hair,\nfluff or grit and castor forks run free and are not\nbent and in accordance with the wheelchair\ntype\n• Ensure all bearings, nut and bolts complete\nand secure and in accordance with the\nwheelchair type\n• Check, lock and secure armrest / side guards\nin place and in accordance with the wheelchair\ntype\n• Check and securely place footrest and in\naccordance with the wheelchair type\n• Check wheelchair frame and in accordance\nwith the wheelchair type\n• Check brakes if it can be locked or has any\nworn-out parts and in accordance with the\nwheelchair type\n• Check upholstery and fabrics for wear and tear\nand in accordance with the wheelchair type\n• Check cushions for any worn out parts and in\naccordance with the wheelchair type\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Demonstrate interpersonal skills\n• Demonstrate communication skills\n• Demonstrate record-keeping skills\n• Follow safety manual\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n\n--- PDF PAGE 124 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 120\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n7.2 Repair\nwheelchair parts\nor replaces\ndefective\nwheelchair parts\n• Lecture and discussion on the following topics:\n-\nWheelchair repair protocols\n• Repair or replace tires for any tire splits,\ncracks, bulging or loss of threads breaks and in\naccordance with the wheelchair type\n• Repair rear wheels for its alignment and in\naccordance with the wheelchair type.\n• Replace bent or maligned spokes and in\naccordance with the wheelchair type\n• Replace castor wheels and in accordance with\nthe wheelchair type.\n• Tighten or replace bearings, nut and bolts and\nin accordance with the wheelchair type.\n• Replace armrest / mudguard and in\naccordance with the wheelchair type.\n• Repair footrest lock and in accordance with the\nwheelchair type\n• Repair frames for cracks, splits and large dents\nand in accordance with the wheelchair type.\n• Replace worn-out brakes and in accordance\nwith the wheelchair type\n• Replace worn out upholstery and in\naccordance with the wheelchair type\n• Replace worn out seat cushion and in\naccordance with the wheelchair type\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Demonstrate interpersonal skills\n• Demonstrate communication skills\n• Demonstrate record-keeping skills\n• Follow safety manual\n• Demonstrate hazard/risks identification and\n• Discussion\n• Demonstration\n• Lecture\n• Blended learning\n•\nDirect\nobservation\nwhile tasks are\nbeing performed\n•\nQuestions/\nInterview\n•\nWritten\nEvaluation\n7 hours\n\n--- PDF PAGE 125 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 121\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n7.3 Conduct final\nquality check on\ncompleted work\n• Lecture and discussion on the following topics:\n-\nQuality control for Wheelchair\nmaintenance and repair\n• Check wheelchair service provision for\ncompliance with manufacturer, institution and\nwheelchair user specification\n• Ensure product quality according to\nmanufacturer, institution and wheelchair user\nspecification\n• Perform documentation in accordance to the\ninstitution’s quality procedure\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Demonstrate interpersonal skills\n• Demonstrate communication skills\n• Demonstrate record-keeping skills\n• Follow safety manual\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Discussion\n• Demonstration\n• Lecture\n• Blended learning\n•\nDirect\nobservation\nwhile tasks are\nbeing performed\n•\nQuestions/\nInterview\n•\nWritten\nEvaluation\n4 hours\n\n--- PDF PAGE 126 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021)\n122\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies; or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative\n\n--- PDF PAGE 127 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 123\nthat the deployment of trainees in the workplace is adhered to training\nprograms agreed by the institution and enterprise and status and\nprogress of trainees are closely monitored by the training institutions to\nprevent opportunity for work exploitation.\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the\nagreement may be written or oral and the master craftsperson commits\nto training the apprentice in all the skills relevant to his or her trade over\na significant period of time, usually between one and four years, while the\napprentice commits to contributing productively to the work of the\nbusiness. Training is integrated into the production process and\napprentices learn by working alongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based\n\n• Community-Based – short term programs conducted by non-government\norganizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training\nprogram (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this program should possess the\nfollowing requirements:\n\n• Must have completed at least 10 years basic education or a Holder of\nAlternative Learning Systems (ALS) certificate of completion with grade 10\nequivalent; and\n• Must possess good communication skills\n\n--- PDF PAGE 128 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 124\n3.4 TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 24\ntrainees for Assistive Rehabilitation Technology Services (Wheelchair) NC II.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used\nas alternatives. This also applies in consideration of community practices and their\navailability in the local market.\n\nTOOLS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n26\npcs.\nMetal Tape Measure; 3 meters; Lock lever with automatic\nretraction; with printed measures in metric (centimeters) and\nimperial (inches)\n6\npcs.\nFabric Tape Measure; 60 inches or 150 cm; Fabric (or PVC) [not\npaper]; with printed measures in metric (centimeters) and\nimperial (inches)\n6\npcs.\nMeter Stick; wood; 1 meter; with printed measures in metric\n(centimeters) other side in imperial\n6\npcs\nGoniometer; decimal and fractional graduated scales in metric\nand / or imperial measurements\n2\npcs\nVernier caliper\n13\nsets\nAllen Wrench / Hex keys Set; steel (no rust);\n1.5/2/2.5/3/4/5/6/8/1