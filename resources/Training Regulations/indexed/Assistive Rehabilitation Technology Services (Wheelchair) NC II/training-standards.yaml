 of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Elicit feedback from the wheelchair user\nregarding comfort of the postural support\ndevices in accordance with the initial fitting\n• Perform appropriate adjustment of postural\nsupport devices in accordance with the\nwheelchair user’s feedback\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Demonstrate interpersonal skills\n• Demonstrate communication skills\n• Demonstrate record-keeping skills\n• Follow safety manual\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n6. Assists\nwheelchair\nclinician in user\ntraining\n(20 hours)\n6.1 Instill wheelchair\nsafety practices\nto the client\n• Lecture and discussion on the following topics:\n-\nSafety protocol\n-\nIdentification of risks and hazards\n• Explain, model and implement safety protocol\nin accordance with the standard of practice\n• Identify and act upon potential risks to prevent\nor minimize the risk\n• Identify hazards and potential hazards in the\nenvironment and inform clients accordingly\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Demonstrate interpersonal skills\n• Demonstrate communication skills\n• Demonstrate record-keeping skills\n• Discussion\n• Demonstration\n• Lecture\n• Blended learning\n•\nDemonstration\nwith questioning\n•\nInterview\n•\nWritten Test\n4 hours\n\n--- PDF PAGE 121 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 117\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Follow safety manual\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n6.2 Correlate\nwheelchair user\ntraining to\nwheelchair parts\nand\nmodifications\n• Lecture and discussion on the following topics:\n-\nPressure sores\n-\nGuidelines in performing transfer\ntechniques\n-\nVarious wheelchair mobility techniques\n-\nProper care of Wheelchair components\nand parts\n• Explain wheelchair handling according to\nguidelines.\n• Explain prevention of pressure sore according\nto guidelines\n• Explain and demonstrate transfer techniques\naccording to the guidelines\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Demonstrate interpersonal skills\n• Demonstrate communication skills\n• Demonstrate record-keeping skills\n• Follow safety manual\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Discussion\n• Demonstration\n• Lecture\n• Blended learning\n•\nDemonstration\nwith questioning\n•\nInterview\n•\nWritten Test\n8 hours\n\n--- PDF PAGE 122 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 118\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6.3 Assist\nwheelchair\nclinician in\nmobility training\nfor wheelchair\nuser focusing on\nthe technical\naspect\n• Lecture and discussion on the following topics:\n- Wheelchair User training guidelines\n• Facilitate mobility training according to the\nwheelchair specification and guidelines\n• Explain, model and implement rules for safe\npractice during mobility training according to\nthe institutions protocol\n• Perform close monitoring of the wheelchair\nuser in accordance with established\nprocedures\n• Inform wheelchair clinician about the effects of\ndaily mobility on the wheelchair parts\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Demonstrate interpersonal skills\n• Demonstrate communication skills\n• Demonstrate record-keeping skills\n• Follow safety manual\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Discussion\n• Demonstration\n• Lecture\n• Blended learning\n•\nDemonstration\nwith questioning\n•\nInterview\n•\nWritten Test\n8 hours\n7. Perform\nmaintenance\nand repair on\nwheelchairs\n(13 hours)\n7.1 Follow up on the\nwheelchair user\nand the\nwheelchair\n• Lecture and discussion on the following topics:\n-\nConcept of a well-maintained wheelchair\n-\nWheelchair maintenance protocol\n• Check tires for pneumatic pressure, tire splits,\ncracks, bulging or loss of threads breaks in\naccordance with the wheelchair type\n• Check wheel attachment in accordance with\nthe wheelchair type\n• Check rear wheels for its alignment and in\naccordance with the wheelchair type\n• Discussion\n• Demonstration\n• Lecture\n• Blended learning\n•\nDirect\nobservation\nwhile tasks are\nbeing performed\n•\nQuestions/\nInterview\n•\nWritten\nEvaluation\n2 hours\n\n--- PDF PAGE 123 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 119\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Check castor wheels for its alignment, no hair,\nfluff or grit and castor forks run free and are not\nbent and in accordance with the wheelchair\ntype\n• Ensure all bearings, nut and bolts complete\nand secure and in accordance with the\nwheelchair type\n• Check, lock and secure armrest / side guards\nin place and in accordance with the wheelchair\ntype\n• Check and securely place footrest and in\naccordance with the wheelchair type\n• Check wheelchair frame and in accordance\nwith the wheelchair type\n• Check brakes if it can be locked or has any\nworn-out parts and in accordance with the\nwheelchair type\n• Check upholstery and fabrics for wear and tear\nand in accordance with the wheelchair type\n• Check cushions for any worn out parts and in\naccordance with the wheelchair type\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Demonstrate interpersonal skills\n• Demonstrate communication skills\n• Demonstrate record-keeping skills\n• Follow safety manual\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n\n--- PDF PAGE 124 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 120\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n7.2 Repair\nwheelchair parts\nor replaces\ndefective\nwheelchair parts\n• Lecture and discussion on the following topics:\n-\nWheelchair repair protocols\n• Repair or replace tires for any tire splits,\ncracks, bulging or loss of threads breaks and in\naccordance with the wheelchair type\n• Repair rear wheels for its alignment and in\naccordance with the wheelchair type.\n• Replace bent or maligned spokes and in\naccordance with the wheelchair type\n• Replace castor wheels and in accordance with\nthe wheelchair type.\n• Tighten or replace bearings, nut and bolts and\nin accordance with the wheelchair type.\n• Replace armrest / mudguard and in\naccordance with the wheelchair type.\n• Repair footrest lock and in accordance with the\nwheelchair type\n• Repair frames for cracks, splits and large dents\nand in accordance with the wheelchair type.\n• Replace worn-out brakes and in accordance\nwith the wheelchair type\n• Replace worn out upholstery and in\naccordance with the wheelchair type\n• Replace worn out seat cushion and in\naccordance with the wheelchair type\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Demonstrate interpersonal skills\n• Demonstrate communication skills\n• Demonstrate record-keeping skills\n• Follow safety manual\n• Demonstrate hazard/risks identification and\n• Discussion\n• Demonstration\n• Lecture\n• Blended learning\n•\nDirect\nobservation\nwhile tasks are\nbeing performed\n•\nQuestions/\nInterview\n•\nWritten\nEvaluation\n7 hours\n\n--- PDF PAGE 125 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 121\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n7.3 Conduct final\nquality check on\ncompleted work\n• Lecture and discussion on the following topics:\n-\nQuality control for Wheelchair\nmaintenance and repair\n• Check wheelchair service provision for\ncompliance with manufacturer, institution and\nwheelchair user specification\n• Ensure product quality according to\nmanufacturer, institution and wheelchair user\nspecification\n• Perform documentation in accordance to the\ninstitution’s quality procedure\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Demonstrate interpersonal skills\n• Demonstrate communication skills\n• Demonstrate record-keeping skills\n• Follow safety manual\n• Demonstrate hazard/risks identification and\ncontrol\n• Demonstrate basic competency needed to\naccess the internet\n• Discussion\n• Demonstration\n• Lecture\n• Blended learning\n•\nDirect\nobservation\nwhile tasks are\nbeing performed\n•\nQuestions/\nInterview\n•\nWritten\nEvaluation\n4 hours\n\n--- PDF PAGE 126 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021)\n122",
