ine\n/ face to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n12 hours\n\n--- PDF PAGE 102 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 98\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n-\nintra and Interpersonal skills\n1.2 Integrate the\norganization's\ninfection control\npolicy and\nprocedure into\nwork practices\n•\nLecture and discussion on:\n-\nUse of verbal and non-verbal therapeutic\ncommunication\n-\nRA 11058 – OSH Law\n-\nRA 9008 – Ecological Solid Waste\nManagement Act\n-\nRA 856 – Sanitation Code of the Phil.\n-\nHazards and infectious risk\n-\nSafe work procedures\n-\nUse of computer for documentation and\nreporting\n•\nDemonstrate appropriate wearing, removal\nand disposal of PPE (Personal Protective\nEquipment)\n•\nEncourage employees to report hazards and\nrisks in the work place\n•\nRecognize suggestions of employees to\nimprove infection control practices\n• Lecture (online /\nface to face)\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Role play\n\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration\nwith questioning\n12 hours\n\n1.3 Monitor infection\ncontrol\nperformance and\nimplement\nimprovements in\npractices\n•\nLecture and discussion on:\n-\nKey performance indicators of infection\ncontrol and prevention\n-\nMonitoring, surveillance and investigation of\ninfection risks and hazardous events\n-\nAggregate infection control information\nreports\n•\nDemonstrate identification, correction and\nreporting inadequacies in work procedures\nand infection control measures\n• Lecture (online /\nface to face)\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n• Demonstration\nwith oral\nquestioning\n8 hours\n\n--- PDF PAGE 103 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 99\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Respond\neffectively to\ndifficult/\nchallenging\nbehavior\n(24 hours)\n2.1 Plan responses\n•\nLecture and discussion on:\n-\nConcepts and modes of communication\n-\nEnvironmental and institutional, rules,\nguidelines, policies and procedures\n-\nIssues relating to difficult and challenging\nbehavior\n-\nPatient / client issues which need to be\nreferred to an appropriate health\nprofessional\n-\nPolicies and rules of health professionals\ninvolved with the care of patient / client\n-\nLiteracy levels and communication skills of\nwork group members and consequent\nsuitable communication techniques\n-\nModes of verbal, non-verbal, and written\ncommunication\n•\nApply thinking and responding quickly and\nstrategically\n•\nRemain alert to potential incidents of difficult\nor challenging behavior\n•\nDemonstrate working with others and display\nempathy with patient / client and relatives\n•\nApply intra and interpersonal skills\n•\nDemonstrate reporting and documentation\nwith accuracy\n• Lecture (online /\nface to face)\n• Discussion (online\n/ face to face)\n• Self-Learning\n• Video Presentation\n(offline / face to\nface)\n• Demonstration\n• Written test\n(online / face to\nface)\n• Interview\n• Portfolio\nassessment\n• Demonstration\nwith oral\nquestioning\n12 hours\n2.2 Apply response\n•\nLecture and discussion on:\n-\nSuitable communication techniques to\nachieve the desired outcomes in responding\nto difficult or challenging behavior\n•\nApply thinking and responding quickly