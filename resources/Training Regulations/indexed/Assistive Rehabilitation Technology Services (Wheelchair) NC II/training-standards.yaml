ciency and\neffectiveness of\nresource\nutilization\n• Identify the processes on environmental\npolicies\n• Relate the necessary skills in response to\nchanging environmental policies needs\n- Waste Management Skills\n- Conservation of Energy in workplace\n• Lecture\n• Group Discussion\n• Simulation\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n8.2 Determine\ncauses of\ninefficiency\nand/or\nineffectiveness\nof resource\nutilization\n• Discussion of environmental protection and\nresource efficiency targets\n• Analysis on the relevant work procedure\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n8.3 Convey\ninefficient and\nineffective\nenvironmental\npractices\n• Identification of (re)training needs and usage\nof environment friendly methods and\ntechnologies\n• Identification of environmental corrective\nactions\n• Practicing environment awareness\n• Lecture\n• Group Discussion\n• Role Play\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n9. Practice\nentrepreneurial\nskills in the\nworkplace\n9.1 Apply\nentrepreneurial\nworkplace best\npractices\n\n• Case studies on best entrepreneurial practices\n• Discussion on quality procedures and\npractices\n• Case studies on cost consciousness in\nresource utilization\n• Case Study\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n1 hour\n9.2 Communicate\nentrepreneurial\n• Discussion on communicating entrepreneurial\nworkplace best practices\n\n• Lecture/\nDiscussion\n• Written Test\n• Interview\n1 hour\n\n--- PDF PAGE 100 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 96\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nworkplace best\npractices\n9.3 Communicate\nentrepreneuria