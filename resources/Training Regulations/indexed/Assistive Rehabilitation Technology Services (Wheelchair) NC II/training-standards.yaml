x points*\n2\npcs\nPelvic straps\n-\n1 piece 2 point strap\n-\n1 piece 4 point strap\n2\npcs\nThigh straps*\n2\npcs\nAnkle straps*\n2\npcs\nHead straps*\n2\npcs\nHeadrest – fixed flat*\n2\npcs\nHeadrest – fixed, contoured*\n2\npcs\nHeadrest – movable*\n2\npcs\nLateral head support, right*\n2\npcs\nLateral head support, left*\n13\nbottles\nContact Rubber Cement\n26\npcs\nPrinted Training Module specific to the institution\n4\nboxes\nDisposable gloves\n*other PPEs such as mask and face shield to be provided by the\ntrainee\n3\nbottles\nBleach / disinfectant recommended by DOH; 1 liter\n* Should be compatible with the wheelchairs above\n\n--- PDF PAGE 132 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 128",
