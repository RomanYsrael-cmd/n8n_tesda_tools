\nfemale)\n4x2 for male\n4x2 for female\n16\n16\nB. Laboratory Areas\n\nLaboratory/Workshop/Activity\narea\n10 x 10\n100\n100\nTool room & S/M storage area\n5 x 5\n25\n25\nLearning resource area\n5 x 10\n50\n50\nTotal workshop area\n236 sq. m.\n\nNOTE: Access to and use of equipment /facilities can be provided through cooperative\narrangements or MOA with other partner companies/agencies.\n\n* Versatile facilities allowed\n* Wheelchair accessible areas (esp. wash area)\n* For those who have special facilities requirements, they are required to provide a\nseparate computation of training facilities\n* There should at least be 1 trainer to facilitate lectures / activities involving a\nmaximum of 8 trainees. Skills related activities should be supervised with a\ntrainer-trainee ratio of 1:4.\n\n3.6\nTRAINER’S QUALIFICATIONS\n\n● Must be a holder of National TVET Trainer Certificate (NTTC) Level I in\nAssistive Rehabilitation Technology Services (Wheelchair) NC II;\n● Must be a graduate of any Allied Health Courses or Bachelor’s Degree of any\nrelated course; and\n● Must have at least two (2) years industry experience in wheelchair service\nprovision within the last five (5) years\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgment whether the trainee is competent or not competent.\n\n--- PDF PAGE 133 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 129"
