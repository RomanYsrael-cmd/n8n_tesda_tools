  "present": true,
  "entries": [
    {
      "term": "Amputation",
      "definition": "surgical loss of a limb (i.e. upper extremity or lower extremity) that may be due to trauma or medical condition (e.g. cancer, gangrene)"
    },
    {
      "term": "Arm rest",
      "definition": "part of a wheelchair where a patient may put his arms for support while sitting on a wheelchair"
    },
    {
      "term": "Backrest",
      "definition": "part of a wheelchair that provides support to the trunk of the patient while sitting. Height of this support depends on the sitting balance of the patient."
    },
    {
      "term": "Carer",
      "definition": "a person responsible for providing appropriate care to the patient. He or she may be a family member (e.g. parent, siblings, or relatives) or a hired individual (see also caregiver)"
    },
    {
      "term": "Caregiver",
      "definition": "a person responsible for providing appropriate care to the patient. He or she may be a family member (e.g. parent, siblings, or relatives) or a hired individual (see also carer)"
    },
    {
      "term": "Caster (castor) wheels",
      "definition": "a pair of wheels on a rotating mount that is found at the front of a wheelchair"
    },
    {
      "term": "Cerebral Palsy (CP)",
      "definition": "a group of permanent disorders of the development of movement and posture causing activity limitation that occurred in the developing fetal or infant brain"
    },
    {
      "term": "Cerebrovascular Disease (CVD)",
      "definition": "commonly known as stroke or brain attack; disease of the blood vessels supplying the brain (i.e. arteries). This may include (but not limited to) carotid stenosis, aneurysm, arteriovenous malformation. (see also stroke)"
    },
    {
      "term": "Chronic Kidney Disease (CKD)",
      "definition": "a prolonged injury to the kidney that may be due to some medical conditions (e.g. diabetes, hypertension) that results to generalized weakness of a patient that eventually affects the mobility"
    },
    {
      "term": "Foot rest",
      "definition": "a part of the wheelchair where a patient puts the feet on"
    },
    {
      "term": "Foot support",
      "definition": "a part of a foot rest that keeps the foot in place"
    },
    {
      "term": "Frailty",
      "definition": "marked vulnerability of an elderly person as a result of physiologic decline"
    },
    {
      "term": "Head support",
      "definition": "part of a wheelchair that is located above the backrest to provide additional support to a patient with poor head and neck control"
    },
    {
      "term": "Leg rest",
      "definition": "part of a wheelchair that allows for additional support on the leg when repositioning is done as part of pressure relief technique."
    },
    {
      "term": "Mobility",
      "definition": "a state of being mobile"
    },
    {
      "term": "Muscular Dystrophy",
      "definition": "a genetic disease that leads to progressive weakness of a child"
    },
    {
      "term": "Poliomyelitis",
      "definition": "an infectious disease caused by poliovirus"
    },
    {
      "term": "Pelvic support",
      "definition": "part of a wheelchair that provides additional support to the patient by keeping the pelvis in place while seated on the wheelchair"
    },
    {
      "term": "Postural support devices",
      "definition": "parts of a wheelchair that are added based on the needs of a patient"
    },
    {
      "term": "Rear wheels",
      "definition": "2 big wheels on the rear part of the wheelchair. They spin on an axle as the patient propels it (or when a caregiver pushes the wheelchair)"
    },
    {
      "term": "Seat cushion",
      "definition": "part of the wheelchair where the patient sits. It is cushioned to provide comfort and adequate pressure on the buttocks of the patient"
    },
    {
      "term": "Assistive Rehabilitation Technology Services (Wheelchair) NC II",
      "definition": "HHCARW221 Promulgated (05/2021) 135"
    },
    {
      "term": "Spinal Cord Injury (SCI)",
      "definition": "a damage to any of the levels of the spinal cord (i.e. cervical, thoracic, lumbar, sacral) that may be secondary to trauma or medical condition (e.g. cancer, transverse myelitis) that causes mobility impairment to an individual"
    },
    {
      "term": "Stroke",
      "definition": "a brain disorder resulting from an interrupted blood supply to the brain"
    },
    {
      "term": "Thigh support",
      "definition": "part of the wheelchair that keeps the thigh in proper position while the patient sits"
    },
    {
      "term": "Transfer technique",
      "definition": "a safe technique followed by the patient and caregiver to facilitate safe movement in and out of the wheelchair"
    },
    {
      "term": "Transverse Myelitis",
      "definition": "an inflammatory disease of the spinal cord that leads to pain, muscle weakness or paralysis, and bowel and bladder disorder"
    },
    {
      "term": "Traumatic Braid Injury (TBI)",
      "definition": "an injury to the brain after an individual sustained a violent blow or jolt to the head or body"
    },
    {
      "term": "Wheelchair",
      "definition": "an assistive technology that facilitates easier mobility of an individual with inability or difficulty in standing and walking, either caregiver-propelled or self- propelled. This may be used temporarily or permanently"
    },
    {
      "term": "Wheelchair brake",
      "definition": "wheel lock to keep the wheelchair in a safe stop while the patient is resting on it or is about to transfer"
    },
    {
      "term": "Wheelchair Clinician",
      "definition": "a medical or paramedical specialist who was trained and licensed as a wheelchair assessor that will direct or guide the wheelchair technician- in-training on how to come up with the prescribed wheelchair (see also wheelchair service provider)"
    },
    {
      "term": "Wheelchair frame",
      "definition": "a part of the wheelchair that holds all the other parts of the wheelchair in place"
    },
    {
      "term": "Wheelchair prescription",
      "definition": "a detailed design of a wheelchair as a result of a thorough assessment of the clinician on a patient. This contains the needs of the patient that a technician will follow to assemble a safe and comfortable wheelchair"
    },
    {
      "term": "Wheelchair service provider",
      "definition": "trained wheelchair assessor who will provide the necessary direction to the wheelchair technician-in-training (see also clinician)"
    },
    {
      "term": "Wheelchair service provision",
      "definition": "the service rendered to an individual who will potentially need a wheelchair. This includes physical assessment of the patient, prescribing of the wheelchair by the assessor, assembly and fitting of the prescribed wheelchair, follow up, and repair of the wheelchair if there is any damage from overuse"
    },
    {
      "term": "Wheelchair technician",
      "definition": "an individual who is undergoing training in the aspect of assembling and repair of wheelchair"
    },
    {
      "term": "Wheelchair user",
      "definition": "patient who will be needing a wheelchair. He may have a temporary or permanent disability that will require the use of this assistive technology"
    },
    {
      "term": "Assistive Rehabilitation Technology Services (Wheelchair) NC II",
      "definition": "HHCARW221 Promulgated (05/2021) 136"
