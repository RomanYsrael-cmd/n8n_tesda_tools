y maybe assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 45 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 41\nUNIT OF COMPETENCY\n: RESPOND EFFECTIVELY TO DIFFICULT/\nCHALLENGING BEHAVIOR\n\nUNIT CODE\n: HHC321202\n\nUNIT DESCRIPTOR\n: This unit of competency covers the knowledge, skills and\nattitudes to effectively respond to difficult or challenging\nbehaviour of patient / client.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan\nresponses\n1.1 Responses are\nplanned to instances of\ndifficult or challenging\nbehavior to maximize\nthe availability of other\nappropriate staff and\nresources based on\nestablished standard\npractice\n1.2 Specific manifestations\nof difficult or\nchallenging behavior\nare identified and\nstrategies appropriate\nto these behaviors are\nplanned as required\nbased on established\nprocedure\n1.3 Safety of self and others\nis given priority in\nresponding to difficult or\nchallenging behavior\naccording to institutional\npolicies and procedures\n1.1 Use of therapeutic\ncommunication\n1.2 RA 11058 - OSH\nLaw\n1.3 Reporting and\ndocumentation\n1.4 Environmental\nRA 9003 (Ecological\nSolid Waste\nManagement Act)\n1.5 Difficult and\nchallenging behavior\n1.6 Client issues which\nneed to be referred\nto an appropriate\nhealth professional\n1.7 Rules of health\n professionals\ninvolved with the\ncare of client\n1.1 Applying\ntherapeutic\ncommunication\n1.2 Implementing\nenvironmental and\ninstitutional, rules,\nguidelines, policies\nand procedures\n1.3 Identifying issues\nrelating to difficult\nand challenging\nbehavior\n1.4 Identifying client\nissues which need\nto be referred to an\nappropriate health\nprofessional\n1.5 Thinking and\nresponding quickly\nand strategically\n1.6 Remaining alert to\npotential incidents\nof difficult or\nchalleng