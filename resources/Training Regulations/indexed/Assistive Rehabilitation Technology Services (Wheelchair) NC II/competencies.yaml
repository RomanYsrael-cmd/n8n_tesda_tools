        "source_text": "400311212\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required to\napply problem-solving techniques to determine the origin of\nproblems and plan for their resolution. It also includes\naddressing procedural problems through documentation, and\nreferral.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nroutine\nproblems\n1.1 Routine problems or\nprocedural problem\nareas are identified\n1.2 Problems to be\ninvestigated are\ndefined and determined\n1.3 Current conditions of\nthe problem are\nidentified and\ndocumented\n1.1 Current industry\nhardware and\nsoftware products\nand services\n1.2 Industry\nmaintenance,\nservice and\nhelpdesk practices,\nprocesses and\nprocedures\n1.3 Industry standard\ndiagnostic tools\n1.4 Malfunctions and\nresolutions\n\n1.1 Identifying current\nindustry hardware\nand software\nproducts and\nservices\n1.2 Identifying current\nindustry\nmaintenance,\nservices and\nhelpdesk practices,\nprocesses and\nprocedures.\n1.3 Identifying current\nindustry standard\ndiagnostic tools\n1.4 Describing common\nmalfunctions and\nresolutions.\n1.5 Determining the\nroot cause of a\nroutine malfunction\n\n--- PDF PAGE 15 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 11\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Look for\nsolutions to\nroutine\nproblems\n2.1 Potential solutions to\nproblem are identified\n2.2 Recommendations\nabout possible\nsolutions are\ndeveloped,\ndocumented, ranked\nand presented to\nappropriate person\nfor decision\n2.1 Current industry\nhardware and\nsoftware products\nand services\n2.2 Industry service\nand helpdesk\npractices,\nprocesses and\nprocedures\n2.3 Operating systems\n2.4 Industry standard\ndiagnostic tools\n2.5 Malfunctions and\nresolutions.\n2.6 Root cause\nanalysis\n2.1 Identifying current\nindustry hardware\nand software\nproducts and\nservices\n2.2 Identifying services\nand helpdesk\npractices,\nprocesses and\nprocedures.\n2.3 Identifying\noperating system\n2.4 Identifying current\nindustry standard\ndiagnostic tools\n2.5 Describing common\nmalfunctions and\nresolutions.\n2.6 Determining the\nroot cause of a\nroutine malfunction\n3. Recommend\nsolutions to\nproblems\n3.1 Implementation of\nsolutions are planned\n3.2 Evaluation of\nimplemented solutions\nare planned\n3.3 Recommended\nsolutions are\ndocumented and\nsubmit to appropriate\nperson for\nconfirmation\n3.1 Standard\nprocedures\n3.2 Documentation\nproduce\n3.1 Producing\ndocumentation that\nrecommends\nsolutions to\nproblems\n3.2 Following\nestablished\nprocedures\n\n--- PDF PAGE 16 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 12\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Problems/Procedural\nProblem\n\nMay include but not limited to:\n1.1\nRoutine/non – routine processes and quality\nproblems\n1.2\nEquipment selection, availability and failure\n1.3\nTeamwork and work allocation problem\n1.4\nSafety and emergency situations and incidents\n1.5\nWork-related problems outside of own work area\n2. Appropriate person\nMay include but not limited to:\n2.1\nSupervisor or manager\n2.2\nPeers/work colleagues\n2.3\nOther members of the organization\n3.\nDocument\n\nMay include but not limited to:\n3.1\nElectronic mail\n3.2\nBriefing notes\n3.3\nWritten report\n3.4\nEvaluation report\n4.\nPlan\n\nMay include but not limited to:\n4.1\nPriority requirements\n4.2\nCo-ordination and feedback requirements\n4.3\nSafety requirements\n4.4\nRisk assessment\n4.5\nEnvironmental requirements\n\n--- PDF PAGE 17 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 13\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires