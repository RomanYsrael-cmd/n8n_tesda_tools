        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Accurately confirmed prescription.\n1.2 Scheduled patient according to protocol.\n1.3 Appropriately conducted standard protocol in requesting\nand acquiring relevant materials.\n1.4 Accounted for tools and equipment for wheelchair\nassembly and modification\n2. Resource Implications The following resources should be provided:\n2.1 A workplace environment appropriate for the unit of\ncompetency\n2.2 Facilities, equipment, tools, and materials relevant to the\nunit of competency\n2.5 Institutional workplace standard operating procedures\n2.6 Other organizational policies and procedure\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Questioning\n3.2 Portfolio Assessment\n3.3 Case Analysis\n4. Context of\nAssessment\n4.1 Competency may be assessed in the actual workplace or\nat the designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 76 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 72\nUNIT OF COMPETENCY\n: PERFORM WHEELCHAIR ASSEMBLY AND\nMODIFICATIONS\n\nUNIT CODE\n:"
