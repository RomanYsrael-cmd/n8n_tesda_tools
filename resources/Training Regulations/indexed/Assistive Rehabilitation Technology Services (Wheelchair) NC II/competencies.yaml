                "number": "9.2",
                "text": "Check Circulation – Airway - Breathing 9.2.1 Carotid pulse for adult 9.2.2 Brachial pulse for infant 9.2.3 Open airway 9.2.3.1 Head tilt chin lift maneuver 9.2.3.2 Jaw thrust maneuver 9.2.3.3 Modified jaw thrust maneuver"
