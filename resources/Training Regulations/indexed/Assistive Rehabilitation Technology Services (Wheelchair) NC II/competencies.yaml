        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate\n1.1. Communicated with team and individuals on\norganizational policy and procedures for infection\ncontrol\n1.2. Applied infection control policies and procedures which\nimpact on work processes of the specific work unit\n1.3. Applied procedures for adopting appropriate infection\npractices within work unit\n1.4. Demonstrated appropriate handwashing technique\n1.5. Demonstrated the ability to appropriately wear, remove\nand dispose PPE (Personal Protective Equipment)\n1.6. Provided appropriate supervision of work group\n2. Resource Implications\nThe following resources should be provided:\n2.1. Workplace infection control and health and safety\npolicies and procedures\n2.2. Waste management procedures\n2.3. Food safety procedures\n2.4. Other organizational policies and procedures\n2.5. Duties statements and/or job descriptions\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation\n3.2. Interview\n3.3. Portfolio\n3.4. Demonstration with questioning\n4. Context of\nAssessment\n4.1. Competency maybe assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 45 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 41\nUNIT OF COMPETENCY\n: RESPOND EFFECTIVELY TO DIFFICULT/\nCHALLENGING BEHAVIOR\n\nUNIT CODE\n:"
        },
        "source_text": "HHC321201\n\nUNIT DESCRIPTOR\n: This unit is concerned with infection control responsibilities of\nemployees with supervisory accountability to implement and\nmonitor infection control policy and procedures in a specific\nwork unit or team within an organization. This unit does not\napply to a role with organization-wide responsibilities for\ninfection\ncontrol\npolicy\nand\nprocedure\ndevelopment,\nimplementation or monitoring.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide\ninformation to\nthe work group\nabout the\norganization's\ninfection control\npolicies and\nprocedures\n1.1 Relevant information\nabout the organization's\ninfection control policy\nand procedures, and\napplicable industry\ncodes of practice are\naccurately and clearly\nexplained to the work\ngroup\n1.2 Information about\nidentified hazards and\nthe outcomes of\ninfection risk\nassessments is\nregularly provided to the\nwork group\n1.3 Opportunity is provided\nfor the work group to\nseek further information\non workplace infection\ncontrol issues and\npractices\n1.1 Literacy levels and\ncommunication skills\nof work group\nmembers and\nconsequent suitable\ncommunication\ntechniques\n1.2 Concepts of mode of\ncommunication\n1.3 Reporting,\ndocumentation and\nuse of non-verbal\nand verbal\ncommunication\n1.4 Knowledge on OSH,\ninfection control,\nenvironmental and\ninstitutional, rules,\nguidelines, policies\nand procedures\n1.5 Respect for client’s\nrights\n1.6 Knowledge on the\nuse of personal\nprotective equipment\n1.7 Basic knowledge on\ninfectious diseases\ntransmission\n1.8 Principles of\ninfection control\n1.8.1 Frequent\nhandwashing\n(WHO Standard)\n1.8.2 Body Substance\nIsolation (BSI)\n1.1 Applying effective\ncommunication\nand interpersonal\nskills\n1.1.1 Language\ncompetence\nand reading\ncompetence\n1.1.2 Negotiating\nskills\n1.1.3 Intra and\ninterpersonal\nskills\n1.2 Identifying mode of\ncommunication\n1.3 Practicing\ncommunication\nskills with ease\n1.4 Applying principles\nof infection control\n1.5 Using PPE\n(Personal\nProtective\nEquipment)\n1.6 Identifying\ntransmission of\ninfectious diseases\n1.7 Implementing\nOSH, infection\ncontrol,\nenvironmental and\ninstitutional rules,\nguidelines, policies\nand procedures\n\n--- PDF PAGE 39 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 35\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nby using PPE\n(Personal\nProtective\nEquipment)\n1.9 Use of disinfectant\n1.10 Observe “Social\nDistancing”\n1.11 Stay at home as\nneeded\n1.12 Knowledge on\nequipment for\ncommunication to\nbe used (computer,\ntelephone, cell\nphone etc.)\n1.8 Operating\nequipment for\noperation\n1.9 Reporting and\ndocumentation\nwith accuracy\n2. Integrate the\norganization's\ninfection\ncontrol policy\nand procedure\ninto work\npractices\n2.1 Therapeutic\ncommunication is\napplied to ensure\nimplementation of\ninfection control policy\nin the work place\n2.2 Infection control\npolicies and\nprocedures are\nimplemented based on\nestablished procedure\n2.3 Employer’s coaching\nand support ensures\nthe individuals/teams\nare able to practice\ninfection control\nprocedures\n2.4 Safe work procedures\nare adopted to reflect\nappropriate infection\ncontrol practices in the\nwork place\n2.5 Employees are\nencouraged to report\nhazardous and\ninfectious risks and to\nsuggest improvement of\ninfection control\nprocedures\n2.1 Use of verbal and\nnon-verbal\ntherapeutic\ncommunication\n2.2 RA 11058 – OSH\nLaw\n2.3 RA 9008 –\nEcological Solid\nWaste Management\nAct\n2.4 RA 856 – Sanitation\nCode of the Phil.\n2.5 Hazards and\ninfectious risks\n2.6 Appropriate wearing,\nremoval and\ndisposal of PPE\n(Personal Protective\nEquipment)\n2.7 Use of computer for\ndocumentation and\nreporting\n2.1 Applying verbal and\nnon-verbal\ncommunication\n2.2 Implementing\ninfection control\npolicy and\nprocedures\n2.3 Coaching\nemployees to\nensure the practice\nof infection control\n2.4 Adopting work\nprocedures to reflect\nappropriate infection\ncontrol practices\n2.5 Encouraging\nemployees to report\nhazards and risks in\nthe work place\n2.6 Recognizing\nsuggestions of\nemployees to\nimprove infection\ncontrol practices\n\n3. Monitor\ninfection control\nperformance\nand implement\nimprovements\nin practices\n3.1 Infection control\nhazardous events are\ninvestigated promptly to\nidentify their cause in\naccordance with\norganization policy and\nprocedures\n3.1 Reporting,\ndocumentation and\nuse of non-verbal\nand verbal\ncommunication\n3.2 Knowledge on OSH,\ninfection control,\nenvironmental and\n3.1 Using personal\nprotective\nequipment\n3.2 Identifying\ntransmission of\ninfectious diseases\n3.3 Using therapeutic\ncommunication\n\n--- PDF PAGE 40 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 36\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.2 Work procedures to\ncontrol infection risks\nare monitored and\nreviewed to ensure\ncompliance\n3.3 Training in work\nprocedures is provided\nas required to ensure\nmaintenance of\ninfection control\nstandards\n3.4 Inadequacies in work\nprocedures and\ninfection control\nmeasures are identified,\ncorrected or reported to\ndesignated personnel\n3.5 Records of infection\ncontrol risks and\nincidents are accurately\nmaintained as required\n3.6 Aggregate infection\ncontrol information\nreports are used to\nidentify hazards, to\nmonitor and improve\nrisk control Method and\nto indicate training\nneeds\ninstitutional, rules,\nguidelines, policies\nand procedures\n3.3 Concepts on modes\nof communication\n3.4 RA 9003 –\nEcological Solid\nWaste Management\nAct\n3.5 Knowledge on the\nuse of personal\nprotective\nequipment\n3.6 Basic knowledge on\ninfectious diseases\ntransmission\n3.7 Knowledge on\nequipment for\ncommunication to be\nused (computer,\ntelephone, cell\nphone etc.)\n3.4 Implementing\nOSH, infection\ncontrol,\nenvironmental and\ninstitutional, rules,\nguidelines, policies\nand procedures\n3.5 Applying effective\ncommunication and\ninterpersonal skills\n3.6 Monitoring of\nincidence of\ninfection in the\nworkplace\n3.7 Reporting and\ndocumentation with\naccuracy\n\n--- PDF PAGE 41 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 37\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Industry Codes of\nPractice\nMay include:\n1.1 National Health and Medical Research Council\nGuidelines for infection control\n1.2 Local & National Government Guidelines and Standards\n1.3 Manufacturer's recommendations and operating\nmanuals\n2. Hazards and the\noutcomes of infection\nrisk assessments\nMay include:\n2.1 Sharps\n2.2 Glass\n2.3 Waste\n2.4 Human waste and human tissues\n2.5 Personal contact with infectious patients / clients\n2.6 Animals, insects and vermin\n2.7\nStock, including food, which has passed \"used-by\"\ndates\n2.8 Incorrect concentration of disinfectants and chemicals\n2.9 Cleaning procedures\n2.10 Linen handling procedures\n2.11 Work flows\n2.12 Use of personal protective clothing\n2.13 Food safety\n2.14 Personal hygiene\n3. Therapeutic\ncommunication\nMay include:\n3.1 Verbal communication\n3.1.1 One on one dialogue\n3.1.2 Orientation\n3.1.3 Meeting\n3.1.4 Conference\n3.2 Non-verbal communication\n 3.2.1 Memorandum\n 3.2.2 Minutes of the meeting\n 3.2.3 Flyers\n 3.2.4 Billboards\n 3.2.5 Journals\n 3.2.6 Warning signs and devices\n4. Infection Control\nPolicies and\nProcedures\nMay include:\n4.1 Company’s manual on infection control policies and\nprocedures\n4.2 COVID 19 infection control in your workplace\n4.3 RA 11058 - OSH law\n4.4 RA 9003 – Ecological Solid Waste Management\n5. Employer’s coaching\nand support\nMay include:\n5.1 Provide a workplace free of hazards\n5.2 Comply with OSH standard\n5.3 Make sure employees have and use of safe tools and\nequipment and properly maintained\n5.4 Use color code poster labels and signs to warn\nemployees of potential hazards\n\n--- PDF PAGE 42 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 38\nVARIABLE\nRANGE\n5.5 Provide information that work areas, machinery and\nequipment are kept in a safe condition\n5.6 Provide information, training instructions and\nsupervisions of employees so they can work safely\n5.7 Provide new employees with specialized orientation\ntraining to help them become familiar with their new\nwork environment\n6. Safe work procedures\nMay include:\n6.1 DOLE manual\n6.2 OSH manual\n6.3 Company’s rules and regulations manual\n6.4 Job description for each employees hand outs\n6.5 Workplace safety tips\n6.5.1 Health and safety company protocol about\nCOVID 19\n6.5.1.1\nKeep oneself healthy thru vaccine,\nvitamins and healthy tips style\n6.5.1.2\nMaintain personal hygiene\n6.5.1.3\nEnvironmental cleaning and\ndecontamination\n6.5.1.4\nCover mouth when coughing and sneezing\n6.5.1.5\nHands off on your nose and mouth\n6.5.1.6\nFrequent handwashing and use of\ndisinfectant\n6.5.1.7\nWear, remove and dispose PPE properly\n6.5.1.8\nAlways disinfect working area\n6.5.1.9\nReducing contact by observing social\ndistancing\n6.5.1.10 Observe isolation technique if you are sick\nto prevent spread of infection\n6.5.2 “Five S” in workplace, its purpose and benefits\n6.5.3 Follow safety procedures\n6.5.4 Don’t take shortcuts\n6.5.5 Clear up\n6.5.6 Clear and organized area\n6.5.7 Emergency exit location\n6.5.8 Be alert on the job\n6.5.9 Take regular break\n6.5.10 Be vigilant\n6.5.11 F.A. box location\n6.5.12 Immediately report incident\n6.5.13 Safe and hygiene facilities including toilet,\neating area and first aid with complete contents\n7. Hazardous and\ninfectious risks\nMay include:\n7.1 Categories of hazard\n7.1.1 Safety\n7.1.2 Health\n7.1.3 Environment\n7.2 Classes of hazard\n 7.2.1 Natural\n 7.2.2 Man made\n\n--- PDF PAGE 43 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 39\nVARIABLE\nRANGE\n 7.2.2 Technology\n 7.2.3 Behavior/attitude\n7.3 Specific hazard\n 7.3.1 Mechanical\n 7.3.2 Chemical\n 7.3.3 Physical\n 7.3.4 Biological\n 7.3.5 Psychological\n7.4 Risks in the workplace\n 7.4.1 Corona virus – accommodating high risk\nemployee returning to work\n 7.4.2 Ergonomics\n 7.4.3 Risk examples\n 7.4.3.1 Health risk (smoking)\n 7.4.3.2 Exposure to computer\n 7.4.3.3 Working at height\n 7.4.3.4 Hazardous substances exposure\n 7.4.3.5 Slips and trips\n 7.4.3.6 Strain, sprain and pain\n7.5 Adapt best practices in the workplace\n 7.5.1 Provide clear expectations\n 7.5.2 Give people the opportunity to use their skills\n 7.5.3 Encourage people to contribute ideas and get\n involved in decision making\n 7.5.4 Reward effort\n 7.5.5 Stay committed\n 7.5.6 Hold regular meetings\n 7.5.7 Seek cultural cohesiveness\n8. Infection control\nstandards\nMay include:\n8.1 Goals of infection control policy\n8.2 Basic infection control\n8.3 Main universal precautions\n8.4 Standard infection control precautions\n8.5 WHO infection prevention and control\n8.6 Data analysis\n9. Designated personnel\nMay include:\n9.1 Medical team of the company or agency\n9.2 Support group\n9.2.1 Manager\n9.2.2 Infection Control Coordinator\n9.2.3 Quality Improvement Coordinator\n9.2.4 Infection Control Committee\n9.2.5 Occupational Health and Safety Committee\n10. Aggregate infection\ncontrol information\nMay include:\n10.1 Records of needle stick injuries\n10.2 Hospital-acquired infection rates\n10.3 DOH healthcare standards clinical indicators\n10.4 HACCP (Hazards Analysis Critical Control Point)\nrecords\n10.5 Hazard reports\n\n--- PDF PAGE 44 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 40\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate\n1.1. Communicated with team and individuals on\norganizational policy and procedures for infection\ncontrol\n1.2. Applied infection control policies and procedures which\nimpact on work processes of the specific work unit\n1.3. Applied procedures for adopting appropriate infection\npractices within work unit\n1.4. Demonstrated appropriate handwashing technique\n1.5. Demonstrated the ability to appropriately wear, remove\nand dispose PPE (Personal Protective Equipment)\n1.6. Provided appropriate supervision of work group\n2. Resource Implications\nThe following resources should be provided:\n2.1. Workplace infection control and health and safety\npolicies and procedures\n2.2. Waste management procedures\n2.3. Food safety procedures\n2.4. Other organizational policies and procedures\n2.5. Duties statements and/or job descriptions\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation\n3.2. Interview\n3.3. Portfolio\n3.4. Demonstration with questioning\n4. Context of\nAssessment\n4.1. Competency maybe assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 45 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 41\nUNIT OF COMPETENCY\n: RESPOND EFFECTIVELY TO DIFFICULT/\nCHALLENGING BEHAVIOR\n\nUNIT CODE\n:"
