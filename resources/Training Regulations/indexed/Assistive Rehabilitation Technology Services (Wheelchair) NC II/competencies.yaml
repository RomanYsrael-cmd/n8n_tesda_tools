cial \nconsiderations will \nbe written as \ndictated by the \nclinician down on \nthe assessment \nform in accordance \nwith institutional \nprotocols\n\n--- PDF PAGE 67 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221    Promulgated (05/2021)    63 \n2.8 Properly document \nwheelchair user \ndetails \n2.9 Properly document \nwheelchair user’s \nbody measurements \n3. Assist \nwheelchair \nclinician by \nrecording basic \nbody \nmeasurements \n3.1 The wheelchair user was \nseated to the most \ncomfortable upright sitting \nwith the minimum support \nin accordance with \nwheelchair service \nprovision guidelines  \n3.2 Appropriate \nmeasurement tool was \nused in accordance with \ninstitutional protocol \n3.3 Appropriate body \nmeasurements were \nrecorded in accordance \nwith basic wheelchair \nstandards \n3.4 Appropriate additional \nbody measurements \nthat correspond to the \npostural support \ndevices was done in \naccordance with client \ncharacteristics \n3.1 Measuring tool \n3.2 Body Measurements \n3.3 Wheelchair parts \n3.4  Different postural \nsupport devices \n3.5 Use of Mechanical \nLift \n3.1 Interpersonal skills \n3.2 Communication \nskills \n3.3 Record-keeping \n3.4 Safe Manual \nHandling \n3.5 Hazard/risks \nidentification and \ncontrol \n3.6 Ready skills to \naccess industry \ninformation \n3.7 Basic competency \nneeded to access \nthe internet \n3.8 Properly seat \nwheelchair users  \n3.9 Properly use \nmeasurement tools\n\n--- PDF PAGE 68 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221    Promulgated (05/2021)    64 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Transfer Techniques \nMay include: \n1.1   Independent, standing \n1.2   Independent using transfer board or bent pivot \n1.3   1-man assist, stand pivot \n1.4   1-man assist, bent pivot  \n1.5   sliding \n1.5   2-man assist, lift \n1.6   mechanical lift \n2.  Information \nMay include: \n2.1.  Name \n2.2.  Address \n2.3. 