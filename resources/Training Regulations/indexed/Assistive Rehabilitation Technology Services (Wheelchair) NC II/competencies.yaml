        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Secured the needed wheelchair parts and tools materials\n1.2 Observed proper workflow during actual wheelchair\nservice (initial assembly)\n1.3 Observed proper aftercare workflow\n2. Resource Implications The following resources should be provided:\n2.1 A workplace environment appropriate for the unit of\ncompetency\n2.2 Facilities, equipment, tools, and materials relevant to the\nunit of competency\n2.3 Institutional workplace standard operating procedures\n2.4 Other organizational policies and procedures\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Demonstration with questioning\n3.2 Observation with questioning\n3.3 Interview\n4. Context of\nAssessment\n4.1. Competency may be assessed in the actual workplace or\nat the designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 80 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 76\nUNIT OF COMPETENCY\n: ASSIST THE WHEELCHAIR CLINICIAN IN\nWHEELCHAIR CHECKOUT AND FITTING\n\nUNIT CODE\n:"
        },
        "source_text": "HHC321317\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nfor the wheelchair technician to assemble wheelchairs and\nfabricate/install modifications.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Secure the\nneeded\nwheelchair\nparts, tools and\nmaterials\n1.1 The wheelchair parts,\ntools and materials\nwere prepared for\nwheelchair assembly,\nfitting and/or adjustment\nin accordance with\ninstitutional protocols\n1.2 Safety and functionality of\nequipment were checked\nin accordance with\nmanufacturer’s instruction\nand specification\n1.3 Other materials were\nsecured and arranged on\ntop of the working table in\naccordance with\ninstitutional protocols\n1.1 Wheelchair parts, tools\nand materials for\nassembly, fitting and\nadjustment\n1.2 Occupational safety\nmeasures regarding\nhandling of tools\n1.1 Interpersonal\nskills\n1.2 Communication\n1.3 Time\nmanagement\nskills\n1.4 Time record skills\n1.5 Reading Skills\n1.6 Mathematical\nskills\n1.7 Safe Handling\nManual\n1.8 Hazard/risks\nidentification and\ncontrol\n1.9 Ability to handle\ntools/equipment\n1.10 Ability to follow\ncorrect\nprocedures and\ninstructions\n1.11 Proper handling\nof tools and\nequipment\n2. Follow\nwheelchair\nassembly\nworkflow\n2.1 Wheelchair parts\n(including postural\nsupport devices) were\nassembled together\nbased on wheelchair\nprescription\n2.2 The assembled\nwheelchair was adjusted\naccording to the result of\ninitial wheelchair user\nfitting\n2.3 Excess wheelchair parts\nwere secured for future\nuse in accordance with\nthe institutional protocols\n2.4 Quality control was\nconducted in accordance\nwith institutional protocols\n2.1 Materials Science\n2.2 Use of tools and\nequipment\n2.3 Wheelchair assembly\nworkflow\n2.4 Quality control\nprocedures after\nwheelchair assembly\n2.1 Reading skills\n2.2 Safe Handling\nManual\n2.3 Hazard/risks\nidentification and\ncontrol\n2.4 Ability to handle\ntools/equipment\n2.5 Ability to follow\ncorrect procedures\nand instructions\n2.6 Assemble\nwheelchair\nproperly\n2.7 Apply necessary\nwheelchair\nadjustments and\nmodifications\n\n--- PDF PAGE 77 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 73\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.8 Manage excess\nmaterials properly\n3. Observe\nproper\naftercare\nworkflow\n3.1 Equipment and tools were\ncleaned and returned to\nrespective storage in\naccordance with the\ninstitutional protocols\n3.2 The workspace was\ncleaned in accordance\nwith to institutional\nprotocols\n3.3 Garbage (non-reusable)\nwas segregated and\ndisposed properly in\naccordance with to\ninstitutional protocols\n3.4 Materials inventory was\nconducted to identify low\nstocks supply\n3.1 Proper waste\ndisposal\n3.2 Proper aftercare\nworkflow\n3.3 Materials Inventory\n3.4 Use of components\n3.5 Use of tools and\nequipment\n3.1 Reading and\nsymbol\nrecognition skills\n3.2 Safe Handling\nManual\n3.3 Hazard/risks\nidentification and\ncontrol\n3.4 Ability to handle\ntools/equipment\n3.5 Ability to follow\ncorrect\nprocedures and\ninstructions\n3.6 Interpersonal\nskills\n3.7 Communication\nskills\n3.8 Supply recording\n3.9 Properly conduct\nworkplace\naftercare\n3.10 Properly conduct\naftercare of tools\nand equipment\n\n--- PDF PAGE 78 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 74\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Wheelchair Parts\nMay include:\n1.1 Frame: foldable, collapsible or fixed (rigid)\n1.2 Rear (back) wheels\n1.3 Caster (front) wheels\n1.4 Seat cushion and cover\n1.5 Backrest and cover\n1.6 Leg rest\n1.7 Foot rest\n1.8 Arm rest\n1.9 Push Handle\n1.10 Leg rest\n1.11 Wheelchair lock (brake)\n2. Postural Support\nDevices\nMay include:\n2.1 Pelvic support\n 2.1.1 pelvic side pads\n 2.1.2 pelvic straps\n 2.1.3 Pre-ischial well\n 2.1.4 Wedge for anterior pelvic tilt\n 2.1.5 Build up for right lateral pelvic tilt\n 2.1.6 Build up for left lateral pelvic tilt\n2.2 Thigh support\n 2.2.1 Inner thigh wedge(s)\n 2.2.2 Outside thigh wedge(s)\n 2.2.3 Knee separator or abductor\n 2.2.4 Lateral thigh pads\n 2.2.5 Thigh straps\n2.3 Trunk support\n 2.3.1 Lateral trunk pads or thoracic side pads\n 2.3.2 Chest straps\n 2.3.3 Shoulder straps\n 2.3.4 Build ups\n 2.3.5 Wedges\n 2.3.6 Lumbar support (air bladder)\n2.4 Head support\n 2.4.1 Fixed headrest, flat\n 2.4.2 Fixed headrest, contoured\n 2.4.3 Movable head rest\n 2.4.4 Lateral head support, right\n 2.4.5 Lateral head support, left\n2.5 Foot Support\n 2.5.1 Foot straps\n 2.5.2 Foot wedge\n 2.5.3 Foot blocks\n2.5.4 Ankle straps\n3. Tools\nMay include:\n3.1 Hex keys\n3.2 Monkey wrench\n3.3 Tire pump\n3.4 Screw driver\n\n--- PDF PAGE 79 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 75\n3.5 Tape measure\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Secured the needed wheelchair parts and tools materials\n1.2 Observed proper workflow during actual wheelchair\nservice (initial assembly)\n1.3 Observed proper aftercare workflow\n2. Resource Implications The following resources should be provided:\n2.1 A workplace environment appropriate for the unit of\ncompetency\n2.2 Facilities, equipment, tools, and materials relevant to the\nunit of competency\n2.3 Institutional workplace standard operating procedures\n2.4 Other organizational policies and procedures\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Demonstration with questioning\n3.2 Observation with questioning\n3.3 Interview\n4. Context of\nAssessment\n4.1. Competency may be assessed in the actual workplace or\nat the designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 80 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 76\nUNIT OF COMPETENCY\n: ASSIST THE WHEELCHAIR CLINICIAN IN\nWHEELCHAIR CHECKOUT AND FITTING\n\nUNIT CODE\n:"
