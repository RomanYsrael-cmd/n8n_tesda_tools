        "source_text": "--- PDF PAGE 49 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221    Promulgated (05/2021)    45 \nUNIT OF COMPETENCY \n: APPLY BASIC FIRST AID \n \n \n \nUNIT CODE \n: HHC321203 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required to \nprovide an initial response where First Aid is required. In this \nunit it is assumed that the First Aider is working under \nsupervision and / or according to established workplace First \nAid procedures and policies. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Assess the \nsituation \n1.1 Emergency action \nprinciple of First Aid is \napplied based on \nestablished procedure \n1.2 Physical hazards to \nself and casualty’s \nhealth and safety are \nidentified based on \nestablished procedure \n1.3 Immediate risks to self \nand casualty are \nminimized by controlled \nin accordance with OHS \nrequirements \n1.4 First Aid kit must be \navailable at all times \nbased on OSH Law and \nFirst Aid manual \n1.1 First Aid standard \noperating \nprocedure \n1.2 OSH Law RA \n11058 \n1.3 Physical hazards \n1.4 Immediate risk \n1.5 Use of gloves and \nmask \n1.6 First aid kit  \n1.1 Applying \nemergency action \nprinciples of first \naid \n1.2 Identifying physical \nhazards \n1.3 Controlling and \nminimizing \nimmediate risk for \nself and casualty \n1.4 Applying principle \nto activate medical \nassistance \n1.5 Wearing of mask \nand gloves \n1.6 Using of First Aid \nkit \n2. Perform \nprimary \nsurvey of the \nvictim \n2.1 Principles of Body \nSubstance Isolation is \napplied based on \nstandard First Aid \nprocedure \n2.2 Responses and level of \nconsciousness of the \nvictim or casualty are \nchecked based on \nestablished standard \nfirst aid procedure \n2.3 Potentially life-\nthreatening condition \nis identified and then \nappropriate treatment is \nbegan based on first aid \nstandard procedure \n2.4 Activate medical \nassistance is applied \nbased on established \nfirst aid procedure \n2.5 Basic life support is \napplied based on \n2.1 OSH Law RA \n11058 \n2.2 RA 9003 Solid \nWaste \nManagement \n2.3 First Aid manual \n2.4 Principles of body \nsubstance isolation \n2.5 Basic Life Support \n2.6 Wear mask and \ngloves \n2.1 Applying OSH Law \nand RA 9003 \n2.2 Applying principles \nof body substance \nisolation \n2.3 Wearing of mask \nand gloves \n2.4 Identifying any \npotentially life-\nthreatening \ncondition of \ncasualty \n2.5 Activating medical \nassistance is \napplied \n2.6 Applying basic life \nsupport\n\n--- PDF PAGE 50 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221    Promulgated (05/2021)    46 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nestablished first aid \nprocedure \n3.  Apply \nsecondary \nsurvey of \ncasualty \n3.1 Detailed history of \ncasualty is obtained \nbased on established \nstandard procedure of \nfirst aid \n3.2 Physical examination \nof the casualty is done \nbased on established \nprocedure \n3.3 Vital signs of casualty \nare obtained based on \nestablished standard \nprocedure of first aid  \n3.4 Casualty is endorsed to \nphysician or paramedic \nbased on standard \nprocedure of first aid \n3.5 Written incident report \nis submitted based on \nstandard procedure of \ncompany or home \nfacility \n3.1 Therapeutic \ncommunication \n3.2 OSH Law RA 11058 \n3.3 RA 9003 – \nEcological Solid \nWaste Management \n3.4 Detailed history of \ncasualty \n3.5 Physical \nexamination of the \ncasualty \n3.6 Vital signs \nparaphernalia \n3.7 Write an incident \nreport using pen and \npaper \n3.8 Use of computer for \nrecording purpose \n3.1 Applying \ntherapeutic \ncommunication \n3.2 Applying OSH Law \nRA 11058 and RA \n9003 \n3.3 Obtaining history of \nca