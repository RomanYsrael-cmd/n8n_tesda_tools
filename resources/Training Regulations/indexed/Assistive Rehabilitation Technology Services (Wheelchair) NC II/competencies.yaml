        "source_title": "RECEIVE WHEELCHAIR REFERRAL AND APPOINTMENT",
        "source_text": "--- PDF PAGE 64 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221    Promulgated (05/2021)    60 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n: RECEIVE WHEELCHAIR REFERRAL AND APPOINTMENT \n \n \n \nUNIT CODE \n: HHC321314 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required \nfor the wheelchair technician to properly and systematically \nreceive wheelchair referral and appointment. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \n REQUIRED \nSKILLS \n1. Reviews \nreferral \nform/notes of \nwheelchair \nuser \n1.1 Wheelchair user was \nreceived for wheelchair \nassessment or follow-up \nin accordance with \ninstitutional protocols \n1.2 Wheelchair user details in \nreferral form were \nconfirmed in accordance \nwith institutional protocols \n1.3 Wheelchair user with \nwheelchair needing repair \nservices not available in \nthe facility was referred to \nother repair \nshops/institutions in \naccordance with \ninstitutional protocols \n1.1 Reporting \n1.2 Institutional protocol \n1.3 Referral procedures \n1.4 Referral Forms \n1.5 Data Privacy Act \n1.6 Heath conditions \nand disability \n1.7 Assessment \nterminologies \n1.8 Prescription \nterminologies and \nformat \n1.9 Wheelchair service \nprovision steps \n1.10 Roles and \nresponsibilities of \nwheelchair service \npersonnel \n1.1 Interpersonal skills \n1.2 Communication \n1.3 Time management \nskills \n1.4 Documentation skills \n1.5 Attention to details \n1.6 Review referral notes \n1.7 Receive wheelchair \nuser with proper \ncourtesy  \n1.8 Refer wheelchair user \nto other facilities as \nneeded \n \n2. Schedule \nwheelchair \nuser for \nwheelchair \nassessment, \nmodification, \nfollow up \nand/or repair \n2.1 Urgency of client’s \ncondition is checked in \naccordance with \ninstitutional protocols \n2.2 Schedule is assigned to \nthe client in accordance \nwith institutional protocols \n2.3 Schedule is written in the \nlogbook in accordance \nwith institutional protocols \n2.1 Proper scheduling  2.1 Interpersonal skills \n2.2 Communication \n2.3 Time management \nskills \n2.4 Documentation skills \n2.5 Mathematical skills \n3. Use the \nappropriate \nwheelchair \nforms  \n3.1 The appropriate forms \nwere secured in \naccordance with \ninstitutional protocols \n3.2 Wheelchair user assisted \non appropriate way of \nfilling out the forms in \naccordance with form \ndesign \n3.3 Completely filled up forms \nwere stored properly in \naccordance with storage \nprocedures \n3.1 Wheelchair Forms \n3.1 Interpersonal skills \n3.2 Communication \n3.3 Time management \nskills \n3.4 Documentation skills \n3.5 Mathematical skills \n3.6 Properly identify \nforms \n3.7 Assist wheelchair \nusers in filling out \nforms \n3.8 Store forms for \nfuture reference\n\n--- PDF PAGE 65 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221    Promulgated (05/2021)    61 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.    Client \nMay include: \n1.1 Wheelchair user \n1.2 Parent of wheelchair user (if user is a minor) \n1.3 Caregiver of wheelchair user (if user is a minor) \n1.4 Parent of wheelchair user (if user has cognitive impairment) \n1.5 Carer of wheelchair user (if user has cognitive impairment) \n2.     Forms  \nMay include: \n2.1 Wheelchair Assessment Referral form (Referral letter from \nHealth Professional)  \n2.2 Wheelchair Assessment Form \n2.3 Wheelchair Prescription (Selection) Form \n2.4 Wheelchair Quality Assurance Checklist Form \n2.5 Fitting and User Training Checklist Form \n2.6 Wheelchair Follow Up Form \n \n \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Received the client at the facility  \n1.2 Logged client’s details in the logbook \n1.2 Provided the client with a schedule slot \n1.3 Completely filled up and stored all forms properly            \n2.  Resource Implications \nThe following resources should be provided: \n2.1 A workplace environment appropriate for the unit of \ncompetency \n2.2 Facilities, equipment, tools, and materials relevant to the \nunit of competency \n2.3 Institutional workplace standard operating procedures \n2.4   Other organizational policies and procedures            \n3.  Methods of \nAssessment \nCompetency in this unit must be assessed through: \n3.1 Demonstration with questioning \n3.2 Observation with questioning \n3.3 Interview \n4.  Context of Assessment 4.1. Competency may be assessed in the actual workplace or at \nthe designated TESDA Accredited Assessment Center.\n",
