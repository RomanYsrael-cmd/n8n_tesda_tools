        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Assisted wheelchair user in transferring from chair to\nassessment bed/plinth (when applicable)\n1.2 Assisted the wheelchair service clinician in\ndocumenting wheelchair needs of client\n1.3 Measured needed postural support devices\n2. Resource Implications The following resources should be provided:\n2.1 A workplace environment appropriate for the unit of\ncompetency\n2.2 Facilities, equipment, tools, and materials relevant to\nthe unit of competency\n2.3 Institutional workplace standard operating procedures\n2.4 Other organizational policies and procedure\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Demonstration with questioning\n3.2 Observation with questioning\n3.3 Interview\n4. Context of\nAssessment\n4.1 Competency may be assessed in the actual workplace\nor at the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 71 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 67\nUNIT OF COMPETENCY\n: COORDINATE PROCUREMENT OF THE APPROPRIATE\nWHEELCHAIR SIZE AND ITS PARTS\n\nUNIT CODE\n:"
        },
        "source_text": "HHC321315\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nfor the wheelchair technician to assist the wheelchair\nclinician in user assessment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Assist\nwheelchair\nuser in\ntransferring\nfrom chair to\nassessment\nbed/plinth\n(when\napplicable)\n1.1 Permission was asked\nbefore physically assisting\nthe wheelchair user in\naccordance with\ninstitutional protocols\n1.2 Transfers were done in\naccordance with proper\ntransfer techniques\n1.3 Proper body mechanics\nwas followed at all times\nin accordance with\nwheelchair service\nprovision guidelines\n1.1 Basic Human\nAnatomy\n1.2 Safe transitions and\ntransfers\n1.3 Proper body\nmechanics\n1.1 Interpersonal skills\n1.2 Communication\nskills\n1.3 Record-keeping\n1.4 Following Safety\nManual\n1.5 Identifying and\ncontrolling hazards\n1.6 Identify best way to\nassist wheelchair\nuser in transfers\n1.7 Properly assist\nwheelchair user in\ntransfers\n1.8 Observe proper\nbody mechanics\n2. Assist\nwheelchair\nclinician in\ndocumenting\nneeds of\nwheelchair\nuser\n2.1 Information needed by\nthe wheelchair clinician\nwas written down on the\nform in accordance with\ninstitutional protocols\n2.2 Health condition of the\nwheelchair user was\nwritten on the\nassessment form in\naccordance with\nwheelchair service\nprovision guidelines\n2.3 Wheelchair user’s body\nmeasurements measured\nby the clinician was\nwritten down on the\nassessment form in\naccordance with\ninstitutional protocols\n2.1 Basic computation\n(i.e., addition,\nsubtraction,\nmultiplication and\ndivision)\n2.2 Appropriate\nwheelchair\nprescription\n2.3 Basic Anatomy\n2.4 Use of\ndocumentation\nequipment (laptop,\nprinter, etc.)\n2.1 Interpersonal skills\n2.2 Communication\nskills\n2.3 Record-keeping\n2.4 Following Safety\nManual\n2.5 Hazard/risks\nidentification and\ncontrol\n2.6 Basic competency\nneeded to access\nthe internet\n2.7 Locate the section\nof the assessment\nform where the\nwheelchair user’s\nbody measurements\nand special\nconsiderations will\nbe written as\ndictated by the\nclinician down on\nthe assessment\nform in accordance\nwith institutional\nprotocols\n\n--- PDF PAGE 67 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 63\n2.8 Properly document\nwheelchair user\ndetails\n2.9 Properly document\nwheelchair user’s\nbody measurements\n3. Assist\nwheelchair\nclinician by\nrecording basic\nbody\nmeasurements\n3.1 The wheelchair user was\nseated to the most\ncomfortable upright sitting\nwith the minimum support\nin accordance with\nwheelchair service\nprovision guidelines\n3.2 Appropriate\nmeasurement tool was\nused in accordance with\ninstitutional protocol\n3.3 Appropriate body\nmeasurements were\nrecorded in accordance\nwith basic wheelchair\nstandards\n3.4 Appropriate additional\nbody measurements\nthat correspond to the\npostural support\ndevices was done in\naccordance with client\ncharacteristics\n3.1 Measuring tool\n3.2 Body Measurements\n3.3 Wheelchair parts\n3.4 Different postural\nsupport devices\n3.5 Use of Mechanical\nLift\n3.1 Interpersonal skills\n3.2 Communication\nskills\n3.3 Record-keeping\n3.4 Safe Manual\nHandling\n3.5 Hazard/risks\nidentification and\ncontrol\n3.6 Ready skills to\naccess industry\ninformation\n3.7 Basic competency\nneeded to access\nthe internet\n3.8 Properly seat\nwheelchair users\n3.9 Properly use\nmeasurement tools\n\n--- PDF PAGE 68 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 64\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Transfer Techniques\nMay include:\n1.1 Independent, standing\n1.2 Independent using transfer board or bent pivot\n1.3 1-man assist, stand pivot\n1.4 1-man assist, bent pivot\n1.5 sliding\n1.5 2-man assist, lift\n1.6 mechanical lift\n2. Information\nMay include:\n2.1. Name\n2.2. Address\n2.3. Sex\n2.4. Contact number\n2.5. Birthdate\n2.6. Age\n2.7. Philhealth number\n2.8. Persons with Disability Identification Number\n3. Health Condition\nMay include:\n3.1 Spinal Cord Injury\n3.1.1 Level: High or Low\n3.1.2 Complete\n3.2 Cerebral Palsy\n3.2.1 Quadriplegia\n3.2.2 Diplegia\n3.2.3 Tetraplegia\n3.2.4 Spastic\n3.2.5 Athetoid\n3.3 Stroke\n3.4 Amputation\n3.4.1 Upper Limb\n3.4.2 Lower Limb\n3.5 Poliomyelitis\n3.6 Muscular dystrophy\n3.7 Traumatic Brain Injury\n3.8 Chronic Kidney Disease\n3.9 Movement disorder\n3.10 Musculoskelatal conditions\n3.11 Frail and elderly\n4. Measurement Tool\nMay include:\n4.1 Metal Tape measure\n4.2 Fabric Tape measure\n4.3 Meter stick\n4.4 Caliper\n5. Body Measurement\nMay include:\n5.1 Hip width\n5.2 Thigh Length\n5.3 Leg Length\n5.4 Level of trunk support\n 5.4.1 Low (level of 12th rib)\n\n--- PDF PAGE 69 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 65\n 5.4.2 Mid (level of inferior angle of scapula)\n 5.4.3 High (Level of shoulder)\n6. Other Body\nMeasurement\nMay include\n6.1 Chest width\n6.2 Back knees to seat bones\n6.3 Seat to occiput\n6.4 Seat to top of shoulder\n6.5 Seat to axilla\n6.6 Seat to top of the pelvis (posterior superior iliac spine,\nPSIS)\n7. Postural Support Device\nMay include:\n7.1 Pelvic support\n 7.1.1 pelvic side pads\n 7.1.1.1 L bracket with pad\n 7.1.1.2 Offset bracket with pad\n 7.1.2 pelvic straps\n 7.1.3 Pre-ischial well\n 7.1.4 Wedge for anterior pelvic tilt\n 7.1.5 Build up for right lateral pelvic tilt\n 7.1.6 Build up for left lateral pelvic tilt\n7.2 Thigh support\n 7.2.1 Inner thigh wedge(s)\n 7.2.2 Outside thigh wedge(s)\n 7.2.3 Knee separator or abductor\n 7.2.4 Lateral thigh pads\n 7.2.5 Thigh straps\n7.3 Trunk support\n 7.3.1 Lateral trunk pads or thoracic side pads\n 7.3.1.1 L bracket with pad\n 7.3.1.2 Offset bracket with pad\n 7.3.2 Chest straps\n 7.3.2.1 Four points\n 7.3.2.1 Six points\n 7.3.3 Build ups\n 7.3.4 Wedges\n 7.3.5 Lumbar support (air bladder)\n7.4 Head support\n 7.4.1 Fixed headrest, flat\n 7.4.2 Fixed headrest, contoured\n 7.4.3 Movable head rest\n 7.4.4 Lateral head support, right\n 7.4.5 Lateral head support, left\n\n--- PDF PAGE 70 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 66\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Assisted wheelchair user in transferring from chair to\nassessment bed/plinth (when applicable)\n1.2 Assisted the wheelchair service clinician in\ndocumenting wheelchair needs of client\n1.3 Measured needed postural support devices\n2. Resource Implications The following resources should be provided:\n2.1 A workplace environment appropriate for the unit of\ncompetency\n2.2 Facilities, equipment, tools, and materials relevant to\nthe unit of competency\n2.3 Institutional workplace standard operating procedures\n2.4 Other organizational policies and procedure\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Demonstration with questioning\n3.2 Observation with questioning\n3.3 Interview\n4. Context of\nAssessment\n4.1 Competency may be assessed in the actual workplace\nor at the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 71 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 67\nUNIT OF COMPETENCY\n: COORDINATE PROCUREMENT OF THE APPROPRIATE\nWHEELCHAIR SIZE AND ITS PARTS\n\nUNIT CODE\n:"
