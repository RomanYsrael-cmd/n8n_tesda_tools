        "source_text": "--- PDF PAGE 35 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221    Promulgated (05/2021)    31 \nUNIT OF COMPETENCY \n: PRACTICE ENTREPRENEURIAL SKILLS IN THE \nWORKPLACE \n \n \n \nUNIT CODE \n: 400311218 \n \n \n \nUNIT DESCRIPTOR \n: This \nunit \ncovers \nthe \noutcomes \nrequired \nto \napply \nentrepreneurial workplace best practices and implement cost-\neffective operations. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Apply    \nentrepreneurial \nworkplace best \npractices \n  \n1.1 Good practices \nrelating to workplace \noperations are \nobserved and selected \nfollowing workplace \npolicy \n1.2 Quality procedures and \npractices are complied \nwith according to \nworkplace requirements \n1.3 Cost-conscious habits \nin resource utilization \nare applied based on \nindustry standards \n1.1 Workplace best \npractices, policies \nand criteria \n1.2 Resource utilization \n1.3 Ways in fostering \nentrepreneurial \nattitudes: \n1.3.1 Patience \n1.3.2 Honesty \n1.3.3 Quality-\nconsciousness \n1.3.4 Safety-\nconsciousness \n1.3.5 Resourcefulness  \n1.1 Applying \ncommunication \nskills \n1.2 Complying with \nquality procedures \n \n \n \n2. Communicate \nentrepreneuri\nal workplace \nbest practices  \n \n2.1 Observed good \npractices relating to \nworkplace operations \nare communicated to \nappropriate person. \n2.2 Observed quality \nprocedures and \npractices are \ncommunicated to \nappropriate person \n2.3 Cost-conscious habits \nin resource utilization \nare communicated \nbased on industry \nstandards.  \n2.1 Workplace best \npractices, policies \nand criteria \n2.2 Resource utilization \n2.3 Ways in fostering \nentrepreneurial \nattitudes: \n2.3.1 Patience \n2.3.2 Honesty \n2.3.3 Quality-\nconsciousness \n2.3.4 Safety-\nconsciousness \n2.3.5 Resourcefulness  \n2.1 Applying \ncommunication \nskills \n2.2 Complying with \nquality procedures \n2.3 Following \nworkplace \ncommunication \nprotocol\n\n--- PDF PAGE 36 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221    Promulgated (05/2021)    32 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Implement \ncost-\neffective \noperations \n3.1 Preservation and \noptimization of \nworkplace resources is \nimplemented in \naccordance with \nenterprise policy \n3.2 Judicious use of \nworkplace tools, \nequipment and \nmaterials are observed \naccording to manual \nand work requirements. \n3.3 Constructive \ncontributions to office \noperations are made \naccording to enterprise \nrequirements. \n3.4 Ability to work within \none’s allotted time and \nfinances is sustained.  \n3.1 Optimization of \nworkplace resources \n3.2 5S procedures and \nconcepts \n3.3 Criteria for cost-\neffectiveness \n3.4 Workplace \nproductivity \n3.5 Impact of \nentrepreneurial \nmindset to workplace \nproductivity \n3.6 Ways in fostering \nentrepreneurial \nattitudes: \n3.6.1 Quality-\nconsciousness \n3.6.2 Safety-\nconsciousness \n3.1 Implementing \npreservation and \noptimizing \nworkplace \nresources \n3.2 Observing \njudicious use of \nworkplace tools, \nequipment and \nmaterials \n3.3 Making \nconstructive \ncontributions to \noffice operations \n3.4 Sustaining ability to \nwork within allotted \ntime and finances\n\n--- PDF PAGE 37 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221    Promulgated (05/2021)    33 \n  RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Good practices \nMay include: \n1.1 Economy in use of resources \n1.2 Documentation of quality practices  \n \n2. Resources utilization \nMay include: \n2.1 Consumption/ use of consumables \n2.2 Use/Maintenance of assigned equipment and \nfurniture \n2.3 Optimum use of allotted /available time \n \n \n   EVIDENCE GUIDE \n \n1. Critical Aspects of   \nCompetency  \nAssessment requires evidence that the candidate: \n1.1   Demonstrated ability to identify and sustain cost-\neffective activities in the workplace  \n1.2   Demonstrated ability to practice entrepreneurial \nknowledge, skills and attitudes in the workplace. \n3. Resource Implications \nThe following resources should be provided: \n2.1    Simulated or actual workplace \n2.2    Tools, materials and supplies needed to \ndemonstrate the required tasks  \n2.3    References and manuals \n2.3.1 Enterprise procedures manuals \n2.3.2 Company quality policy \n4. Methods of \nAssessment \nCompetency in this unit should be assessed through: \n3.1 Interview \n3.2 Third-party report \n4.Context of Assessment \n4.1 Competency may be assessed in workplace or in a \nsimulated workplace setting \n4.2 Assessment shall be observed while tasks are being \nundertaken whether individually or in-group\n",
