              },
              {
                "number": "10.1",
                "text": "Ask the following data: 10.1.1 Signs and symptoms of the episode 10.1.2 What occurred at the onset of accident 10.1.3 Any known allergies 10.1.4 Present medication 10.1.4.1 Name of medication 10.1.4.2 Frequency of medication 10.1.4.3 Dosage --- PDF PAGE 54 --- Assistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 50 VARIABLE RANGE 10.1.4.4 Time when last taken 10.1.5 Past history of casualty’s medical condition 10.1.6 Last oral intake, last meal, drink or medication taken prior to accident 10.1.7 Events leading to injury or illness 11 Physical examination May include:"
              },
              {
                "number": "11.1",
                "text": "Begin care and assessment in the order of importance: 11.1.1 A – Airway 11.1.2 B – Breathing 11.1.3 C – Circulation 11.1.4 D – Disabilities which includes mental status 11.1.5 E - Expose any body part that is fractured like extremities but still maintain casualty’s privacy and dignity 11.2 Techniques of physical examination 11.2.1 Inspection 11.2.2 Palpation 11.2.3 Auscultation 11.2.4 Percussion 11.3 Examine the following: 11.3.1 D - Deformity 11.3.2 C - Contusion 11.3.3 A - Abrasion 11.3.4 P – Punctured 11.3.5 B – Bleeding and burns 11.3.6 T – Tenderness 11.3.7 L - Laceration 11.3.8 S – Swelling 11.4 For casualty - fall from heights 11.4.1 Don’t move the casualty 11.4.2 Wait for the paramedics 11.4.3 Keep the casualty calm and well ventilated 12 Vital signs 12.1 Baseline vital signs 12.1.1 Body temperature 12.1.2 Pulse rate 12.1.3 Respiratory rate 12.1.4 Blood pressure 12.2 Assessment of pain 12.2.1 Use of pain scale 13 Incident report 13.1 Definition of term 13.1.1 Accident report 13.1.2 Incident report"
              },
