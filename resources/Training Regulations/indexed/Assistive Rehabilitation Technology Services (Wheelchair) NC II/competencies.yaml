          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Identified specific manifestations of difficult or\nchallenging behavior and strategies are planned,\nselected and applied as required\n1.2. Maintained personal safety and the safety of others\n1.3. Reported incidents, reviewed and responded quickly\nand effectively to contingencies\n1.4. Used debriefing mechanisms\n2. Resource Implications The following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Relevant institutional policy, guidelines, procedures and\nprotocols\n2.3. Emergency response procedures and employee support\narrangements\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation with questioning\n3.2. Demonstration with questioning\n4. Context of\nAssessment\n4.1. Competency maybe assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 49 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 45\nUNIT OF COMPETENCY\n: APPLY BASIC FIRST AID\n\nUNIT CODE\n:"
        },
        "source_text": "HHC321202\n\nUNIT DESCRIPTOR\n: This unit of competency covers the knowledge, skills and\nattitudes to effectively respond to difficult or challenging\nbehaviour of patient / client.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan\nresponses\n1.1 Responses are\nplanned to instances of\ndifficult or challenging\nbehavior to maximize\nthe availability of other\nappropriate staff and\nresources based on\nestablished standard\npractice\n1.2 Specific manifestations\nof difficult or\nchallenging behavior\nare identified and\nstrategies appropriate\nto these behaviors are\nplanned as required\nbased on established\nprocedure\n1.3 Safety of self and others\nis given priority in\nresponding to difficult or\nchallenging behavior\naccording to institutional\npolicies and procedures\n1.1 Use of therapeutic\ncommunication\n1.2 RA 11058 - OSH\nLaw\n1.3 Reporting and\ndocumentation\n1.4 Environmental\nRA 9003 (Ecological\nSolid Waste\nManagement Act)\n1.5 Difficult and\nchallenging behavior\n1.6 Client issues which\nneed to be referred\nto an appropriate\nhealth professional\n1.7 Rules of health\n professionals\ninvolved with the\ncare of client\n1.1 Applying\ntherapeutic\ncommunication\n1.2 Implementing\nenvironmental and\ninstitutional, rules,\nguidelines, policies\nand procedures\n1.3 Identifying issues\nrelating to difficult\nand challenging\nbehavior\n1.4 Identifying client\nissues which need\nto be referred to an\nappropriate health\nprofessional\n1.5 Thinking and\nresponding quickly\nand strategically\n1.6 Remaining alert to\npotential incidents\nof difficult or\nchallenging\nbehavior\n1.7 Working with\nothers and display\nempathy with client\nand relatives\n1.8 Applying intra and\ninterpersonal skills\n1.9 Reporting and\ndocumentation with\naccuracy\n2. Apply\nresponse\n2.1 Difficult or challenging\nbehavior is dealt with\npromptly, firmly and\ndiplomatically in\naccordance with\ninstitutional policies\nand procedures\n2.2 Communication is used\neffectively to achieve\n2.1 Reporting and\ndocumentation\n2.2 Knowledge on\ninstitutional, rules,\nguidelines, policies\nand procedures\n2.3 Issues relating to\ndifficult and\nchallenging behavior\n2.1 Applying\ntherapeutic\ncommunication\n2.2 Implementing\ninstitutional, rules,\nguidelines, policies\nand procedures\n2.3 Identifying issues\nrelating to difficult\n\n--- PDF PAGE 46 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 42\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nthe desired outcomes\nin responding to difficult\nor challenging behavior\n2.3 Appropriate\nstrategies are\nselected to suit\nparticular instances of\ndifficult or challenging\nbehavior\n2.4 Client issues which\nneed to be referred\nto an appropriate\nhealth professional\n2.5 Knowledge on\npolicies and rules of\nhealth professionals\ninvolved with the\ncare of client\nand challenging\nbehavior\n2.4 Identifying client\nissues which need\nto be referred to\nan appropriate\nhealth professional\n2.5 Remaining alert to\npotential incidents\nof difficult or\nchallenging\nbehavior\n2.6 Reporting and\ndocumentation\nwith accuracy\n3. Report and\nreview\nincidents\n3.1 Incidents are reported\nand reviewed\naccording to\ninstitutional policies and\nprocedures\n3.2 Incidents are reviewed\nwith appropriate staff\nand suggestions\nappropriate to area of\nresponsibility are made\n3.3 Advice and\nassistance are sought\nfrom legitimate\nsources as needed\naccording to agency\npolicies and procedures\n3.1 Use of therapeutic\ncommunication\n3.2 Reporting and\ndocumentation\n3.3 Knowledge on\nenvironment RA\n9003 – Ecological\nSolid Waste\nManagement\n3.4 Use of computer for\ndocumentation and\nreporting\n3.1 Applying\ntherapeutic\ncommunication\n3.2 Reporting and\ndocumentation\nwith accuracy\n\n--- PDF PAGE 47 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 43\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Planned responses\nMay include:\n1.1 Own ability and experience\n1.2 Established institutional procedures\n1.3 Knowledge of individual persons and underlying causes\n2. Difficult or\nchallenging behaviors\nMay include:\n2.1 Aggression/Assaultive behavior\n2.2 Confusion or other cognitive impairment\n2.3 Noisiness\n2.4 Manipulative\n2.5 Wandering\n2.6 Self-destructive\n2.7 Intoxication\n2.8 Withdrawn/depressed\n2.9 Negativistic\n2.10 Intrusive behavior\n2.11 Verbal offensiveness\n3. Strategies\nappropriate for\ndealing with\nchallenging behaviors\nMay include:\n3.1 Diversional activities\n3.2 Referring to appropriate personnel e.g. supervisor,\nsecurity officer\n3.3 Following established emergency response procedures\n4. Institutional policies\nand procedures\nMay include:\n4.1 Incident reporting and documentation\n4.2 Operational guidelines for handling incidents and/or\ncases involving difficult and challenging behavior\n4.3 Debriefing of staff involved in the incident\n5. Selection of\nappropriate strategies\nfor dealing with\nchallenging behaviors\nMay include:\n5.1 The nature of the incident\n5.2 Potential effect on different parties, patient / client, staff\nand others\n5.3 Established procedures and guidelines\n6. Report and review\nMay include:\n6.1 Purposes of the incident report review\n6.2 Characteristics of an incident report review\n6.3 Element of an effective incident report review\n7. Incident report\nMay include:\n7.1 Data of worker/s\n 7.1.1 Name of worker\n 7.1.2 Job title / occupation\n 7.1.3 Time and date of injury\n 7.1.4 Exact location of the worker at the time of injury\n 7.1.5 Exact description of how the injury was sustained\n\n--- PDF PAGE 48 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 44\n 7.1.6 If any treatment was provided to the injured and if\nso, what kind of treatment\n 7.1.7 Nature of injury and part of the body affected\n 7.1.8 Date and time reported\n 7.1.9 Name and signature of the person making the\nreport\n7.2 Ten essential elements of an incident report\n8. Advice and\nassistance from\nlegitimate source\nMay include:\n8.1 According to company’s policy\n8.2 Recommendations\n8.3 Employees training on safe work practice\n8.4 Preventive maintenance activities that keep equipment\nin good operating condition\n8.5 Evaluation of job procedures with recommendation for\nchanges\n8.6 Conducting a job hazard analysis to evaluate the task\nfor any other hazards and then train employees for\nthese hazards\n\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Identified specific manifestations of difficult or\nchallenging behavior and strategies are planned,\nselected and applied as required\n1.2. Maintained personal safety and the safety of others\n1.3. Reported incidents, reviewed and responded quickly\nand effectively to contingencies\n1.4. Used debriefing mechanisms\n2. Resource Implications The following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Relevant institutional policy, guidelines, procedures and\nprotocols\n2.3. Emergency response procedures and employee support\narrangements\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation with questioning\n3.2. Demonstration with questioning\n4. Context of\nAssessment\n4.1. Competency maybe assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 49 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 45\nUNIT OF COMPETENCY\n: APPLY BASIC FIRST AID\n\nUNIT CODE\n:"
