        "source_text": "--- PDF PAGE 71 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221    Promulgated (05/2021)    67 \nUNIT OF COMPETENCY \n: COORDINATE PROCUREMENT OF THE APPROPRIATE \nWHEELCHAIR SIZE AND ITS PARTS \n \n \n \nUNIT CODE \n: HHC321316 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required \nfor the wheelchair technician to properly and systematically \nacquire wheelchair parts in preparation for wheelchair \nassembly. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine \nwheelchair \ntype and parts \nneeded based \non the \nprescription \nprovided by \nthe clinician \n1.1 Wheelchair parts \nneeding modification \nwas identified in \naccordance with \ninstitutional protocols \n1.2 Availability of the stocks \nof wheelchair size and \nits parts was checked in \naccordance with \ninstitutional protocols \n1.3 Wheelchair clinician was \ninformed of availability of \nwheelchair size and its \nparts needed in \naccordance with \ninstitutional protocols \n1.1 Correlation of \nwheelchair parts vis-\nà-vis prescription \n \n \n1.1 Interpersonal skills \n1.2 Communication \nskills \n1.3 Record-keeping \n1.4 Safe Manual \nHandling \n1.5 Hazard/risks \nidentification and \ncontrol \n1.6 Ready skills to \naccess industry \ninformation \n1.7 Basic competency \nneeded to access \nthe internet \n1.8 Properly identify \nwheelchair parts \nand modifications \n1.9 Apply knowledge on \nappropriate \nwheelchair \nprescription \n2. Plot wheelchair \nassembly/  \nmaintenance \nand repair \nschedule  \n2.1 Work load/Projects \nassembly/maintenance \nand repair service \ntimeline was checked in \naccordance with \ninstitutional protocol \n2.2 Wheelchair assembly \nschedule plotted in \naccordance with decking \nprocedure \n2.3 Wheelchair maintenance \nschedule plotted in \naccordance with decking \nprocedure \n2.1 Decking procedure \n2.2 Wheelchair \nmaintenance \nschedule \n2.1 Interpersonal skills \n2.2 Communication \n2.3 Time management \nskills \n2.4 Documentation \nskills \n2.5 Mathematical skills \n2.6 Appropriately \nschedule \nwheelchair users \nfor service delivery \n3.  Request the \nappropriate \nwheelchair \nsize and its \nparts for its \n3.1 Request form was \nappropriately filled up in \naccordance with form \ndesign \n3.2 Acquisition schedule of \n3.1 Request Forms \n3.2 Wheelchair \ncomponents \n3.3 Materials used for \nfabrication/ \n3.1 Interpersonal \nskills \n3.2 Communication \nskills \n3.3 Record-keeping\n\n--- PDF PAGE 72 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221    Promulgated (05/2021)    68 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nassembly \norders was confirmed in \naccordance with \ninstitutional protocols \n3.3 Wheelchair and its \nparts were received in \naccordance with \ninstitutional protocols \n3.4 Orders were checked for \ncompleteness and \nspecification in \naccordance with order \nform \nmodification postural \nsupport devices \n3.4 Safe Manual \nHandling \n3.5 Hazard/risks \nidentification and \ncontrol \n3.6 Ready skills to \naccess industry \ninformation \n3.7 Basic competency \nneeded to access \nthe internet \n3.8 Properly fill out \nforms \n3.9 Properly \ncoordinate \ndelivery of \nwheelchair and \nparts \n3.10 Properly screens \nwheelchair and \nparts for factory \ndefects \n4.  Request \nmaterials for \nwheelchair \nmaintenance \nand repair for \nprocurement \n4.1 Request form was \nappropriately filled up in \naccordance with form \ndesign \n4.2 Acquisition schedule of \norders was confirmed in \naccordance with \ninstitutional protocols \n4.3 Materials were received \nin accordance with \ninstitutional protocols \n4.4 Orders were checked for \ncompleteness and \nfunctionality in \naccordance with order \nform \n4.1 Appropriate \nwheelchair \nprescription \n4.2 Materials  \n4.1 Interpersonal skills \n4.2 Communication \nskills \n4.3 Record-keeping \n4.4 Safe Manual \nHandling \n4.5 Hazard/risks \nidentification and \ncontrol \n4.6 Ready skills to \naccess industry \ninformation \n4.7 Basic competency \nneeded to access \nthe internet \n4.8 Properly fill out \nforms \n4.9 Properly coordinate \ndelivery of \nwheelchairs \n4.10 Properly screens \nparts for factory \ndefects\n\n--- PDF PAGE 73 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221    Promulgated (05/2021)    69 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Wheelchair Parts \nMay include: \n1.1 Frame \n         1.1.1 Mechanism \n                       1.1.1.1 Foldable \n                       1.1.1.2 Collapsible \n                       1.1.1.3 Fixed (rigid) \n         1.1.2 Base of support \n                       1.1.2.1 Short \n                       1.1.2.2 Long \n         1.1.3 Seat to floor height \n                       1.1.3.1 Low \n                       1.1.3.2 Middle \n                       1.1.3.3 High \n         1.1.3 Center of gravity \n                       1.1.3.1 Standard \n                       1.1.3.2 Five hole adjustment \n                       1.1.3.3 Seven hole adjustment \n1.2 Rear (back) wheels \n         1.2.1 Pneumatic \n         1.2.2.Solid \n1.3 Caster (front) wheels \n         1.3.1 Diameter \n         1.3.2 Width \n                      1.3.2.1 Narrow \n                      1.3.2.2 Wide \n1.4 Seat \n         1.4.1. Fixed, Slung \n                     1.4.1.1 Padded \n                     1.4.1.2 Leather \n         1.4.2  Tension adjustable seat \n1.5 Seat Cushion and cover \n         1.5.1 comfort flat cushion \n         1.5.2 pressure relief cushion \n1.6 Backrest and cover \n         1.6.1 Fixed, Slung \n                     1.6.1.1 padded \n                     1.6.1.2 Leather \n         1.6.2 Tension adjustable straps \n         1.6.3  Solid backrest with comfort cushion \n1.7 Leg rest \n        1.7.1 Calf Strap \n        1.7.2 Calf pads \n1.8 Foot rest \n        1.8.1 Swivel type (swing away); adjustable height \n        1.8.2 Fixed; adjustable height \n1.9 Arm rest \n        1.9.1 fixed, padded \n        1.9.2 removable, padded \n        1.9.3 flip-up, padded\n\n--- PDF PAGE 74 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221    Promulgated (05/2021)    70 \n        1.9.4 sliding backward \n        1.9.5 contoured or no armrest \n1.10 Wheelchair lock (brake) \n        1.10.1 long lever arm \n        1.10.2 short lever arm \n2. Materials \nMay include: \n2.1 Wheelchair Parts \n2.2 Foams \n2.2.1.  Comfort foams \n2.2.2.  Soft chipped foams \n2.2.3.  Firm chipped foams \n2.3 Extra straps \n2.3.1 Chest straps \n2.3.2 Thigh straps \n2.3.3 Ankle straps \n2.3.4 Foot straps \n2.3.5 Head straps \n2.4 Fabric \n        2.4.1 cotton stretchy \n        2.4.2 synthetic \n                    2.4.2.1 water resistant \n                    2.4.2.2 water repellant \n3. Tools \nMay include: \n3.1 Allen wrench/Hex keys \n3.2 Adjustable wrench (range 8-22mm) \n3.3 Combination Wrench  \n3.3.1 Size 8mm \n3.3.2 Size 10mm  \n3.3.3 Size 13mm \n3.3.4 Size 19mm \n3.4   Saw \n3.4.1 Wood \n3.4.1 Metal \n3.5 Socket Wrench \n3.6 Sockets \n3.6.1 Size 10mm \n3.6.2 Size 12mm \n3.6.3 Size 19mm \n3.7 Drill and Driver \n3.8 Drill bits, 8mm \n3.8.1 High Speed drill bits \n3.8.2 Brad point  \n3.9.   Hand Metal File \n3.9.1 Flat \n3.9.2 Round, 5mm \n3.9.3 Half round \n3.10  Tire pump \n          3.10.1 Tire pump with air pressure gauge \n          3.10.2 Tire pump without air pressure gauge \n3.11  Screwdriver \n3.11.1 Flat \n3.11.2 Philips \n3.12. Metal Hacksaw 12” with spare\n\n--- PDF PAGE 75 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221    Promulgated (05/2021)    71 \n3.13. Box cutter with spare blades \n3.14. Carving Knife, 18”/Electric Cutter \n3.15. Heavy Duty scissors \n3.16. Spoke wrench \n3.17. Safety glasses \n3.18. Rubber Mallet, 16 oz \n3.19. Vise grip or locking pliers \n3.20. Heat Gun \n3.21. Rugby \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Accurately confirmed prescription. \n1.2 Scheduled patient according to protocol. \n1.3 Appropriately conducted standard protocol in requesting \nand acquiring relevant materials. \n1.4 Accounted for tools and equipment for wheelchair \nassembly and modification \n2. Resource Implications The following resources should be provided: \n2.1   A workplace environment appropriate for the unit of \ncompetency \n2.2   Facilities, equipment, tools, and materials relevant to the \nunit of competency \n2.5 Institutional workplace standard operating procedures \n2.6 Other organizational policies and procedure \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration with Questioning  \n3.2 Portfolio Assessment \n3.3 Case Analysis \n4. Context of \nAssessment \n4.1   Competency may be assessed in the actual workplace or \nat the designated TESDA Accredited Assessment Center.\n",
