zards\n3.2 Environmental\ncorrective actions\n3.1 Applying written\nand oral\ncommunication\nskills\n3.2 Applying critical\nthinking\n3.3 Applying problem\nsolving\n3.4 Applying\nobservation Skills\n\n--- PDF PAGE 33 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 29\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.3 Feedback on\ninformation/ concerns\nraised are clarified with\nappropriate personnel\n3.5 Practicing\nEnvironmental\nAwareness\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Environmental Work\nProcedures\nMay include:\n1.1\nUtilization of Energy, Water, Fuel Procedures\n1.2\nWaster Segregation Procedures\n1.3\nWaste Disposal and Reuse Procedures\n1.4\nWaste Collection Procedures\n1.5\nUsage of Hazardous Materials Procedures\n1.6\nChemical Application Procedures\n1.7\nLabeling Procedures\n2. Appropriate\nPersonnel\nMay include:\n2.1\nManager\n2.2\nSafety Officer\n2.3\nEHS Offices\n2.4\nSupervisors\n2.5\nTeam Leaders\n2.6\nAdministrators\n2.7\nStakeholders\n2.8\nGovernment Official\n2.9\nKey Personnel\n2.10 Specialists\n2.11 Himself\n\n--- PDF PAGE 34 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 30\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Measured required resource utilization in the workplace\nusing appropriate techniques\n1.2 Recorded data in accordance with workplace protocol\n1.3 Identified causes of inefficiency and/or ineffectiveness\nthrough deductive reasoning\n1.4 Validate the identified causes of inefficiency and/or\nineffectiveness thru established environmental\nprocedures\n1.5 Report efficiency and effectives of resource utilization to\nappropriate personnel\n1.6 Clarify feedback on information/concerns raised with\nappropriate personnel\n2. Resource Implications\nThe following r