        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Provided a safe environment for wheelchair users to\nconduct user training\n1.2 Ensured safety protocols are placed before the start of the\nuser training\n1.3 Provided assistance on\n1.3.1 wheelchair handling\n1.3.2 pressure sore prevention\n1.3.3 transfer techniques\n1.3.4 assistance on wheelchair mobility training skills\n2. Resource Implications The following resources should be provided\n2.1 Wheelchairs\n2.2 User training manuals\n2.3 Wheelchair manufacturers manual and related reference\nmaterials\n2.4 Wheelchair mobility training laboratory (ramps, staircase,\nroundabouts, incline, different road surfaces)\n3. Methods of\nAssessment\nCompetency of this unit may be assessed through:\n3.1 Demonstration with questioning\n3.2 Interview\n3.3 Written exam\n4. Context of Assessment 4.1 Competency may be assessed in the actual workplace or\nat the designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 86 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 82\n\nUNIT OF COMPETENCY\n: PERFORM MAINTENANCE AND REPAIR ON\nWHEELCHAIRS\n\nUNIT CODE\n:"
        },
        "source_text": "HHC321319\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge and skills required to perform\nuser training.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Instill\nwheelchair\nsafety practices\nto the client\n1.1 Safety protocol were\nexplained, modeled and\nimplemented in\naccordance with the\nstandard of practice\n1.2 Potential risks were\nidentified and acted upon\nto prevent or minimize\nthe risk\n1.3 Hazards and potential\nhazards in the\nenvironment were\nidentified and clients are\ninformed accordingly\n1.1 Safety protocol\n1.2 Identification of risks\nand hazards\n1.1 Communication skills\nwhich includes\nverbal and non-\nverbal\n1.2 Interpersonal skills\n1.3 Ability to instruct\nwheelchair safety\nskills\n1.4 Properly instructs\nwheelchair safety\n1.5 Identify and control\nhazards\n2. Correlate\nwheelchair\nuser training to\nwheelchair\nparts and\nmodifications\n2.1 Wheelchair handling\nwas explained according\nto guidelines\n2.2 Prevention of pressure\nsore was explained\naccording to guidelines\n2.3 Transfer techniques\nwere explained and\ndemonstrated according\nto the guidelines\n2.1 Pressure sores\n2.2 Guidelines in\nperforming transfer\ntechniques\n2.3 Various wheelchair\nmobility techniques\n2.4 Proper care of\nWheelchair\ncomponents and\nparts\n2.1 Communication\nskills which includes\nverbal and non-\nverbal\n2.2 Interpersonal skills\n2.3 Ability to instruct\nwheelchair safety\nskills\n2.4 Properly instructs\nwheelchair user\ntraining\n2.5 Properly instructs\npressure sore\nprecautions\n2.6 Identify and control\nhazards\n3. Assist\nwheelchair\nclinician in\nmobility\ntraining for\nwheelchair\nuser focusing\non the\ntechnical\naspect\n3.1 Mobility training was\nfacilitated according to the\nwheelchair specification\nand guidelines\n3.2 Rules for safe practice\nduring mobility training\nwere explained, modeled\nand implemented\naccording to the\ninstitutions protocol\n3.3 Conditions and/or\nmechanics of wheelchair\nparts were monitored in\naccordance with\n3.1 Wheelchair user\ntraining guidelines\n3.1 Communication\nskills which includes\nverbal and non-\nverbal\n3.2 Interpersonal skills\n3.3 Ability to instruct\nwheelchair safety\nskills\n\n--- PDF PAGE 84 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 80\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nestablished procedures\n3.4 Wheelchair clinician was\ninformed about the effects\nof daily mobility on the\nwheelchair parts\n\nRANGE OF VARIABLES\n\nRANGE\nVARIABLES\n1. Potential Risk\n\nMay Include:\n1.1 Falls\n1.2 Injury and Accidents\n1.3 Pressure sore\n1.4 Wheelchair Damage\n1.5 Head trauma\n1.6 Spinal cord injury\n2. Hazards\n\nMay Include:\n2.1 Different surfaces\n2.2 The use of wheelchair in outdoor conditions\n2.3 Worn out parts of the wheelchair\n2.4 Weather conditions\n3.Wheelchair Handling\nMay include:\n3.1 Proper care of wheelchair during travel\n3.2 Proper Storing\n4. Pressure Sore\nMay include:\n4.1 Risk factors in developing pressure sore\n4.2 Prevention of pressure sores\n4.3 Proper treatment of pressure sores\n4.4 Referral to medical or surgical specialist\n5.Transfer Techniques\nMay include:\n5.1 Mechanical lifts\n5.2 Sliding board transfers\n5.3 Stand pivot\n5.3 Two-man lift\n5.4 Three-man lift\n6. Wheelchair Mobility\nMay include:\n6.1 Wheelchair propulsion, forward and backward and turning\n6.2 Ascending and Descending stairs\n6.3 Ascending and Descending inclined\n6.4 Partial wheelie\n6.5 Wheelie\n7. Legal Requirements\nMay include:\n7.1 Accessibility Law (BP 344)\n8. Rules for Safety Practice May include:\n8.1 Ratio of wheelchair technician to client\n8.2 Demonstration and return demonstration of various\nwheelchair mobility and techniques.\n\n--- PDF PAGE 85 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 81\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Provided a safe environment for wheelchair users to\nconduct user training\n1.2 Ensured safety protocols are placed before the start of the\nuser training\n1.3 Provided assistance on\n1.3.1 wheelchair handling\n1.3.2 pressure sore prevention\n1.3.3 transfer techniques\n1.3.4 assistance on wheelchair mobility training skills\n2. Resource Implications The following resources should be provided\n2.1 Wheelchairs\n2.2 User training manuals\n2.3 Wheelchair manufacturers manual and related reference\nmaterials\n2.4 Wheelchair mobility training laboratory (ramps, staircase,\nroundabouts, incline, different road surfaces)\n3. Methods of\nAssessment\nCompetency of this unit may be assessed through:\n3.1 Demonstration with questioning\n3.2 Interview\n3.3 Written exam\n4. Context of Assessment 4.1 Competency may be assessed in the actual workplace or\nat the designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 86 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 82\n\nUNIT OF COMPETENCY\n: PERFORM MAINTENANCE AND REPAIR ON\nWHEELCHAIRS\n\nUNIT CODE\n:"
