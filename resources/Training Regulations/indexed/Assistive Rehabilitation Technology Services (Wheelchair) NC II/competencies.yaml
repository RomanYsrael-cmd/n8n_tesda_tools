        "source_text": "HHC321320\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge and skills required to perform\nwheelchair maintenance and repair, not including welding,\nupholstery, and carpentry.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Follow up on\nthe\nwheelchair\nuser and the\nwheelchair\n1.1 Tires were checked for\npneumatic pressure, tire\nsplits, cracks, bulging or\nloss of threads breaks in\naccordance with the\nwheelchair type\n1.2 Wheel attachment was\nchecked in accordance\nwith the wheelchair type\n1.3 Rear wheels were\nchecked for its alignment\nand in accordance with\nthe wheelchair type\n1.4 Castor wheels were\nchecked for its alignment,\nno hair, fluff or grit and\ncastor forks run free and\nare not bent and in\naccordance with the\nwheelchair type.\n1.5 All bearings, nut and\nbolts were ensured\ncomplete and secured\nand in accordance with\nthe wheelchair type\n1.6 Armrest / side guards\nare checked, locked and\nsecurely in place and in\naccordance with the\nwheelchair type\n1.7 Footrest was checked\nand placed securely and\nin accordance with the\nwheelchair type\n1.8 Wheelchair frame was\nchecked and in\naccordance with the\nwheelchair type\n1.9 Brakes are checked if it\ncan be locked or has any\nworn-out parts and in\n1.1 Concept of a well-\nmaintained\nwheelchair\n1.2 Wheelchair\nmaintenance\nprotocol\n1.1 Accessing,\ninterpreting and\napplying technical\ninformation\n1.2 Using relevant tools\nand equipment\n1.3 Applying personal\nsafety procedure\n1.4 Maintaining\norderliness and\ncleanliness\n1.5 Maintaining clients\nrecord\n1.6 Properly checks\nwheelchair parts for\ndamage\n1.7 Properly repairs\nwheelchair parts\n1.8 Properly replace\nparts in need of\nreplacement\n\n--- PDF PAGE 87 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 83\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\naccordance with the\nwheelchair type\n1.10 Upholstery and fabrics\nare checked for wear\nand tear and in\naccordance with the\nwheelchair type\n1.11 Cushions are checked\nfor any worn out parts\nand in accordance with\nthe wheelchair type\n2. Repair\nwheelchair\nparts or\nreplaces\ndefective\nwheelchair\nparts\n2.1 Tires were repaired or\nreplaced for any tire\nsplits, cracks, bulging or\nloss of threads breaks\nin accordance with the\nwheelchair type\n2.2 Rear wheels were\nrepaired for its\nalignment in\naccordance with the\nwheelchair type\n2.3 Bent or maligned\nspokes were replaced\nin accordance with the\nwheelchair type\n2.4 Castor wheels were\nreplaced in accordance\nwith the wheelchair type\n2.5 Bearings, nut and\nbolts were tightened or\nreplaced in accordance\nwith the wheelchair type\n2.6 Armrest / mudguard\nwere replaced in\naccordance with the\nwheelchair type\n2.7 Footrest lock was\nrepaired in accordance\nwith the wheelchair type\n2.8 Frames were repaired\nfor cracks, splits and\nlarge dents in\naccordance with the\nwheelchair type\n2.9 Worn-out brakes were\nreplaced in accordance\nwith the wheelchair type\n2.10 Worn out upholstery\nwas replaced in\naccordance with the\nwheelchair type\n2.1 Wheelchair repair\nprotocols\n2.1 Accessing,\ninterpreting and\napplying technical\ninformation\n2.2 Using relevant tools\nand equipment\n2.3 Applying personal\nsafety procedure\n2.4 Maintaining\norderliness and\ncleanliness\n2.5 Maintaining clients\nrecord\n2.6 Properly checks\nwheelchair parts for\ndamage\n2.7 Properly repairs\nwheelchair parts\n2.8 Properly replace\nparts in need of\nreplacement\n\n--- PDF PAGE 88 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 84\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.11 Worn out seat\ncushion was replaced\nin accordance with the\nwheelchair type\n3. Conduct final\nquality check\non completed\nwork\n3.1 Wheelchair service\nprovision was checked\nfor compliance with\nmanufacturer, institution\nand wheelchair user\nspecification\n3.2 Product quality was\nassured according to\nmanufacturer, institution\nand wheelchair user\nspecification\n3.3 Documentation was\nperformed in accordance\nto the institution’s quality\nprocedure\n\n3.1 Quality control for\nwheelchair\nmaintenance and\nrepair\n3.1 Communication\nskills which includes\nverbal and non-\nverbal\n3.2 Writing skills\n3.3 Interpersonal skills\n3.4 Accessing,\ninterpreting and\napplying technical\ninformation\n3.5 Using relevant tools\nand equipment\n3.6 Applying personal\nsafety procedure\n3.7 Maintaining\norderliness and\ncleanliness\n3.8 Maintaining clients\nrecord\n3.9 Properly conduct\nquality control\ncheck\n\n--- PDF PAGE 89 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 85\nRANGE OF VARIABLES\n\nRANGE\nVARIABLES\n1. Tire\nMay Include:\n1.1 air filled\n1.2 solid\n1.3 foam filled\n2. Cushion\n\nMay Include:\n2.1 Foam\n2.2 Gel\n2.3 Air Flotation\n2.4 Urethane honeycomb\n3. Quality Problem\nMay include:\n3.1 wheelchair requiring rework\n3.2 wheelchair which does not meet wheelchair user’s\nrequirements\n3.3 wheelchair factory defect\n3.3 unavailability of wheelchair parts\n\n--- PDF PAGE 90 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 86\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Ensured safety protocols are placed before the start of the\nmaintenance and repair\n1.2. Provided wheelchair maintenance and repair on tires\n1.3. Provided wheelchair maintenance and repair on rear\nwheels\n1.4. Provided wheelchair maintenance and repair on castor\nwheels\n1.5. Provided wheelchair maintenance and repair on bearings\n1.6. Provided wheelchair maintenance and repair on armrest /\nmudguard\n1.7. Provided wheelchair maintenance and repair on footrest\n1.8. Provided wheelchair maintenance and repair on frames\n1.9. Provided wheelchair maintenance and repair on brakes\n1.10. Provided wheelchair maintenance and repair on\nupholstery\n1.11. Provided wheelchair maintenance and repair on cushion\n1.12. Conducted final quality checks on completed work order\n1.13. Reported on the quality of processes and work outcomes\n2. Resource Implications\nThe following resources should be provided\n2.1. Wheelchairs\n2.2. User training manuals\n2.3. Wheelchair manufacturers manual and related reference\nmaterials\n2.4. Materials and equipment relevant to the activity\n3. Methods of\nAssessment\nCompetency of this unit may be assessed through\n3.1 Direct observation while tasks are being performed\n3.2 Questions/ Interview\n3.3 Written Evaluation\n4. Context of Assessment 4.1 Competency may be assessed in the actual workplace or\nat the designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 91 ---\nAssistive Rehabilitation Technology Services (Wheelchair) NC II - HHCARW221 Promulgated (05/2021) 87"
