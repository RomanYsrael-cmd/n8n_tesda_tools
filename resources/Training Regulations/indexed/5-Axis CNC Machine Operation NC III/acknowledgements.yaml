    {
      "source_text": "UNIT OF COMPETENCY : WORK IN A DIVERSE ENVIRONMENT"
    },
    {
      "source_text": "UNIT CODE : 400311322"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the outcomes required to work effectively in a workplace characterized by diversity in terms of religions, beliefs, races, ethnicities and other differences."
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Develop an individual’s cultural awareness and sensitivity 1.1 Individual differences with clients, customers and fellow workers are recognized and respected in accordance with enterprise policies and core values. 1.2 Differences are responded to in a sensitive and considerate manner 1.3 Diversity is accommodated using appropriate verbal and non- verbal communication. 1.1 Understanding cultural diversity in the workplace 1.2Norms of behavior for interacting and dialogue with specific groups (e. g., Muslims and other non- Christians, non- Catholics, tribes/ethnic groups, foreigners) 1.3Different methods of verbal and non- verbal communication in a multicultural setting 1.1 Applying cross- cultural communication skills (i.e. different business customs, beliefs, communication strategies) 1.2 Showing affective skills – establishing rapport and empathy, understanding, etc. 1.3 Demonstrating openness and flexibility in communication 1.4 Recognizing diverse groups in the workplace and community as defined by divergent culture, religion, traditions and practices"
    },
    {
      "source_text": "-- PDF PAGE 22 --- 5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019)"
    },
    {
      "source_text": "18"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 2. Work effectively in an environment that acknowledges and values cultural diversity 2.1 Knowledge, skills and experiences of others are recognized and documented in relation to team objectives. 2.2 Fellow workers are encouraged to utilize and share their specific qualities, skills or backgrounds with other team members and clients to enhance work outcomes. 2.3 Relations with customers and clients are maintained to show that diversity is valued by the business. 2.1 Value of diversity in the economy and society in terms of Workforce development 2.2 Importance of inclusiveness in a diverse environment 2.3 Shared vision and understanding of and commitment to team, departmental, and organizational goals and objectives 2.4 Strategies for customer service excellence 2.1 Demonstrating cross- cultural communication skills and active listening 2.2 Recognizing diverse groups in the workplace and community as defined by divergent culture, religion, traditions and practices 2.3 Demonstrating collaboration skills 2.4 Exhibiting customer service excellence"
    },
    {
      "source_text": "-- PDF PAGE 23 --- 5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019)"
    },
    {
      "source_text": "19"
    },
    {
      "source_text": "ELEMENT"
    },
    {
      "source_text": "PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 3. Identify common issues in a multicultural and diverse environment 3.1 Diversity-related conflicts within the workplace are effectively addressed and resolved. 3.2 Discriminatory behaviors towards customers/stakeho lders are minimized and addressed accordingly. 3.3 Change management policies are in place within the organization. 3.1 Value, and leverage of cultural diversity 3.2 Inclusivity and conflict resolution 3.3 Workplace harassment 3.4 Change management and ways to overcome resistance to change 3.5 Advanced strategies for customer service excellence 3.1 Addressing diversity-related conflicts in the workplace 3.2 Eliminating discriminatory behavior towards customers and co- workers 3.3 Utilizing change management policies in the workplace"
    },
    {
      "source_text": "-- PDF PAGE 24 --- 5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019)"
    },
    {
      "source_text": "20"
    },
    {
      "source_text": "RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Diversity This refers to diversity in both the workplace and the community and may include divergence in: 1.1 Religion 1.2 Ethnicity, race or nationality 1.3 Culture 1.4 Gender, age or personality 1.5 Educational background 2. Diversity-related conflicts May include conflicts that result from: 2.1 Discriminatory behaviors 2.2 Differences of cultural practices 2.3 Differences of belief and value systems 2.4 Gender-based violence 2.5 Workplace bullying 2.6 Corporate jealousy 2.7 Language barriers 2.8 Individuals being differently-abled persons 2.9 Ageism (negative attitude and behavior towards old people)"
    },
