    {
      "source_text": "46"
    },
    {
      "source_text": "RANGE OF VARIABLES VARIABLE RANGE 1. Hazards May include: 1.1 Cluttered tools and materials 1.2 Slippery floors (caused by oil, grease or any liquid) 1.3 Exposed electrical wires 1.4 Sharp edges 1.5 Machine without guards or with exposed moving parts 1.6 Uncollected chips or other wastes etc. 2. Protective clothing and devices May include: 2.1 Safety glasses/goggles 2.2 Safety shoes 2.3 Overalls 2.4 Cap 3. Injuries May include: 3.1 Burns/scalds 3.2 Fractures 3.3 Cuts and abrasions 3.4 Poisoning 3.5 Foreign bodies in the eye 3.6 Concussion 3.7 Shock 4. Type of fires May include: 4.1 common combustibles (wood, cloth, paper, rubber and plastic) 4.2 Flammable liquids (gasoline, oil, solvents, paints, etc.) 4.3 Energized electrical equipment (wiring, fuse boxes, circuit breakers, appliances, etc. 4.4 Combustible metals (magnesium, sodium, etc.)"
    },
