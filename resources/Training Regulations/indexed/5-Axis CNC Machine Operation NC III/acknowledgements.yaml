      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Established the reasons why innovative systems are required 1.2 Established the goals of a new innovative system 1.3 Analyzed current organizational systems to identify gaps and barriers to innovation. 1.4 Assessed work procedures, processes and systems in terms of innovative practices. 1.5 Generate practical action plans for improving work procedures, and processes. 1.6 Reviewed the trial innovative work system and adjusted reflect evaluation feedback, knowledge management systems and future planning. 1.7 Evaluated the effectiveness of the proposed action plans. 2. Resource Implications The following resources should be provided: 2.1 Pens, papers and writing implements. 2.2 Cartolina. 2.3 Manila papers. 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Psychological and behavioral Interviews. 3.2 Performance Evaluation. 3.3 Life Narrative Inquiry. 3.4 Review of portfolios of evidence and third-party workplace reports of on-the-job performance. 3.5 Sensitivity analysis. 3.6 Organizational analysis. 3.7 Standardized assessment of character strengths and virtues applied. 4. Context for Assessment 4.1 Competency may be assessed individually in the actual workplace or simulation environment in TESDA accredited institutions."
