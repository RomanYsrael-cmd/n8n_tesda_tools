      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to interpret Occupational Safety and Health practices, set OSH work targets, and evaluate effectiveness of Occupational Safety and Health work instructions ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Interpret Occupational Safety and Health practices"
