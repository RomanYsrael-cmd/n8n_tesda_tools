essing / Washroom \n \n \n 3 .0m X 2.5m \n \n7.5 sqm \n \nNOTE: \nTraining center may enter into a memorandum of understanding (MOU) with an \ninstitution/company with appropriate equipment and facilities.\n\n--- PDF PAGE 127 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n123 \n \n3.6 TRAINERS’ QUALIFICATION \n \n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in 5-Axis CNC \nMachine Operation NC III \n• Must be 3D CAD/CAM literate \n• Must have at least 2 years job/industry experience in CNC 5-axis machining \n \n \n \n \n \n3.7 \nINSTITUTIONAL ASSESSMENT \n \n \nInstitutional Assessment is gathering of evidences to determine the \nachievements of the requirements of the qualification to enable the trainer make \njudgement whether the trainee is competent or not competent.\n\n--- PDF PAGE 128 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n124 \n \n SECTION 4 \n ASSESSSMENT AND CERTIFICATION ARRANGEMENT \n \n \n \nCompetency Assessment is the process of collecting evidence and making judgments \nwhether competency has been achieved. The purpose of assessment is to confirm that an \nindividual can perform to the standards expected at the workplace as expressed in relevant \ncompetency standards. \nThe assessment process is based on evidence or information gathered to prove \nachievement of competencies. The process may be applied to an employable unit(s) of \ncompetency in partial fulfillment of the requirements of the national qualification. \n \n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS \n \n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated \ncompetence in all unit/s of competency of a qualification with a promulgated Training \nRegulations. \n \n4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the \nrequirements identified in the evidence guide of the relevant unit/s of competency. \n \n4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained competencies \nthrough informal training, previous work or life experiences may apply for recognition \nin a particular qualification through competency assessment. \n \n4.1.4 The industry shall determine assessment and certification requirements for each \nqualification with promulgated Training Regulations: It includes the following: \n \na. entry requirements for candidates \nb. evidence gathering methods \nc. qualification requirements of competency assessors \nd. specific assessment and certification arrangements as identified by industry \n \n \n \n4.1.5 The following are qualified to apply for assessment and certification: \n \na. Graduating students/trainees of NTR programs or graduates of formal, non-\nformal and informal institutions including enterprise-based training programs \nrelated to 5-Axis CNC Machine Operation NC III \n \nb. Industry workers in CNC Machining.\n\n--- PDF PAGE 129 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n125 \n \n4.2 COMPETENCY ASSESSMENT REQUISITE \n \n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the \ncandidate prior to actual competency assessment. SAG is a pre-assessment tool to \nhelp the candidate and the assessor determine what evidence is available, where \ngaps exist, including readiness for assessment. \n \n \n This document can: \na. Identify the candidate’s skills and knowledge \nb. Highlight gaps in candidate’s skills and knowledge \nc. Provide critical guidance to the assessor and candidate on the evidence that need \nto be presented \nd. Assist the candidate to identify key areas in which practice is needed or additional \ninformation or skills that should be gained prior ` \n \n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is \nauthorized to conduct competency assessment. Assessment centers undergo a \nquality assured procedure for accreditation before they are authorized by TESDA to \nmanage the assessment for National Certification. \n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is \nauthorized to conduct assessment of competence. Competency assessors undergo \na quality assured system of accreditation procedure before they are authorized by \nTESDA to assess the competencies of candidates for National Certification.\n\n--- PDF PAGE 130 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n126 \n \n \n \nANNEX A \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nLead \nworkplace \ncommunication \nLead small \nteams \nApply critical \nthinking and \nproblem-\nsolving \ntechniques \nin the \nworkplace \n \nWork in a \ndiverse \nenvironment \nPropose \nmethods of \napplying \nlearning and \ninnovation \nin the \norganization \nUse \ninformation \nsystematically \nEvaluate \noccupational \nsafety and \nhealth work \npractices \n \nEvaluate \nenvironmental \nwork \npractices \n \nFacilitate \nentrepreneurial \nskills for \nmicro-small-\nmedium \nenterprises \n(MSMEs) \n \nReceive and \nrespond to \nworkplace \ncommunication \nWork with \nothers \nSolve/address \nroutine \nproblems \nEnhance \nself-\nmanagement \nskills \nSupport \nInnovation \nAccess and \nmaintain \ninformation \nFollow \noccupational \nsafety and \nhealth \npolicies and \nprocedures \nApply \nenvironmental \nwork standards \nAdopt \nentrepreneurial \nmindset in the \nworkplace \nParticipate in \nworkplace \ncommunication \nWork in \nTeam \nEnvironment \nSolve/address \ngeneral \nworkplace \nproblems \nDevelop \ncareer and \nlife decisions \nContribute to \nworkplace \ninnovation \nPresent \nrelevant \ninformation \nPractice \noccupational \nsafety and \nhealth \npolicies and \nprocedures \nExercise \nefficient and \neffective \nsustainable \npractices in the \nworkplace \nPractice \nentrepreneurial \nskills in the \nworkplace \nCOMPETENCY MAP \nMETALS AND ENGINEERING SECTOR \n5-AXIS CNC MACHINE OPERATION NC III \n \nBASIC COMPETENCIES\n\n--- PDF PAGE 131 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n127 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nUtilize specialize \nspecialized \ncommunication \nskill \nDevelop \nand lead \nteams \nPerform higher \norder thinking \nprocesses and \napply \ntechniques in \nthe workplace \nContribute \nto the \npractice of \nsocial \njustice in the \nworkplace \nManage \ninnovative \nwork \ninstructions \nManage \nevaluate \nusage of \ninformation \nLead in \nimprovement of \nOccupational \nSafety and Health \nProgram, Policies \nand Procedures \nLead towards \nimprovement of \nenvironmental \nwork programs, \npolicies and \nprocedures \nSustain \nentrepreneurial \nskills \nManage and \nsustain \neffective \ncommunication \nstrategies \nManage \nand sustain \nhigh \nperforming \nteams \nEvaluate \nhigher order \nthinking skills \nand adjust \nproblem \nsolving \ntechniques \nAdvocate \nstrategic \nthinking for \nglobal \ncitizenship \nIncorporate \ninnovation \ninto work \nprocedures \nDevelop \nsystems in \nmanaging, \nand \nmaintaining \ninformation \nManage \nImplementation of \nOSH programs in \nthe workplace \nManage \nimplementation \nof \nenvironmental \nprogram in the \nworkplace \nDevelop and \nsustain a high-\nperforming \nenterprise\n\n--- PDF PAGE 132 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n128 \n \n \n \n \n \n \n \n \n \nApply safety practices \nInterpret working drawings \nand sketches \nSelect/ cut workshop \nmaterials \nPerform shop computations \n(Basic) \nMeasure workpiece (Basic) \nPerform routine \nhousekeeping \n \nPerform shop computations \n(Intermediate) \nMeasure workpiece using \nangular measuring \ninstruments \nPerform shop computations \n(Advanced) \nMeasure workpiece using \ngages and surface texture \ncomparator \nPerform preventive and \ncorrective maintenance \nOperate a personal \ncomputer \nSelect and cut workshop \nmaterials \nPrepare cost estimates \nApply Safety Practices \nInterpret Drawings and \nSketches \nPerform Industry Calculations \nContribute to Quality System \nUse Hand Tools \nPrepare Weld Materials \nSetup Welding Equipment \nFit up Weld Materials \nRepair Welds \nPerform shop computations \n(Intermediate) \nMeasure workpiece \n(Intermediate) \nPerform preventive and \ncorrective Maintenance \n \nCOMMON COMPETENCIES\n\n--- PDF PAGE 133 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n129 \n \nCreate drawing using CAD \nsoftware \nApply CAD/CAM program \nWrite basic CNC lathe \nmachine program \nSet-up CNC lathe machine, \nworkpiece and cutting tools \nPerform basic CNC lathe \nmachine operations \nWrite advanced CNC lathe \nmachine program \nSet-up multiple-axis CNC \nlathe machine, workpiece and \ncutting tools \nPerform advanced CNC lathe \nmachine operations \nWrite basic CNC milling \nmachine program \nSet-up CNC milling machine, \nworkpiece and cutting tools \nPerform basic CNC milling \nmachine operations \nWrite advanced CNC milling \nmachine program \nSet-up multiple-axis CNC \nmilling machine, workpiece and \ncutting tools \nPerform advanced CNC \nmilling machine operations \nWeld Carbon Steel Plates \nUsing FCAW \nWeld Carbon Steel Pipes \nUsing FCAW \nWeld Alloy Steel Plates Using \nFCAW \nWeld Alloy Steel Pipes Using \nFCAW \nPerform Gas Welding in \nCarbon Steel Plates and \nTubes \nPerform Gas Welding in Alloy \nSteel Plates and Tubes \nWeld Carbon Steel Plates \nUsing GMAW \n \nWeld Carbon Steel Pipes \nUsing GMAW \nWeld Alloy Steel Plates Using \nGMAW \nWeld Alloy Steel Pipes Using \nGMAW \nWeld Carbon Steel Plates \nUsing GTAW \nWeld Carbon Steel Pipes \nUsing GTAW \nWeld Alloy Steel Plates Using \nGTAW \nWeld Alloy Steel Pipes Using \nGTAW \nPerform bench work (Basic) \nTurn workpiece \nMill workpiece \nGrind workpiece \nShape workpiece \nRepair workpiece \nPerform bench work (Basic) \nPerform bench work \n(Complex) \nTurn workpiece (Basic) \nTurn workpiece \n(Intermediate) \nMill workpiece (Basic) \nMill workpiece (Intermediate) \n \nCORE COMPETENCIES\n\n--- PDF PAGE 134 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n130 \n \nGrind workpiece (Basic) \nGrind workpiece (Complex) \nTurn workpiece (Advanced) \nMill workpiece (Advanced) \nPrepare basic engineering \ndrafting \nPerform basic engineering \ndetail drafting \nPerform Preventive \nMaintenance \nPerform Planned and \nUnplanned (Emergency) \nMaintenance \nFabricate Simple Items \nInstall Machinery \n Perform press machine \nsetting \n Perform mechanical press \noperation \nWeld Plates Using SAW \nWeld Pipes Using SAW \nWeld Carbon Steel Plates \nUsing SMAW \nWeld Carbon Steel Plates \nand Pipes Using SMAW \nWeld Alloy Steel Plates Using \nSMAW \nWeld Alloy Steel Pipes Using \nSMAW \nMachine Die Components \nFit and Assemble Dies \nTest and Try Die \nMachine mold components \n \nImplement surface finishing \n \nFit and assemble mold \n \nRectify mold flaws \nWrite 5-axis CNC machine \nprogram \nSet-up 5-axis CNC \nmachine, cutting tools and \nworkpiece \nPerform 5-axis CNC \nmachine operations \nPerform post 5-axis CNC \nmachine operations \n \nCORE COMPETENCIES\n\n--- PDF PAGE 135 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/20) \n \n131 \n \n \nGLOSSARY OF TERMS \n \n1. 5-axis CNC \n(Computerized \nNumerical Control) \nMachine \n \nThe automation of machine tools that are operated by precisely \nprogrammed commands encoded on a storage medium, as opposed to \ncontrolled manually via hand wheels or levers \n2. Machine coordinate \nsystem \nA point of reference in this system of coordinates is known as machine \nzero-point \n \n3. Work piece \ncoordinate system \nA system of coordinates taking this point as reference is called the work \npiece coordinates system \n \n4. Machine Zero \nThe position located at the farthest possible distance in a positive \ndirection along the X-, Y-, and Z-axes. This position is permanently set \nfor each particular CNC machine \n \n \n5. Micrometer \nA hand-held measuring device used to inspect the dimensions of parts. \nThy typical micrometer is accurate within 0.001 in. or 0.02 mm \n \n6. Mode \nA machine state that determines the way it executes manual and \nautomatic commands \n \n7. Optional Stop \nA code that pauses the program if the appropriate switch is selected on \nthe machine. Optional Stop allows the operator to inspect the machine \nbetween operations \n \n8. Override \nA control that adjusts a programmed speed or feed rate by a certain \npercentage during operation \n \n9. Part Program \nA series of numerical instructions used by a CNC machine to perform \nthe necessary sequence of operations to machine a specific work piece \n \n10. Part Programmer \nThe person responsible for the creation of a part program. The part \nprogrammer translates the work piece design into program instructions \nfor the CNC machine \n \n11. Proving Out \nRunning a program one block at a time in order to check for accuracy \nand proper tool set-up \n \n12. Cycle Start \nThe control used to begin a program or continue a program that has \nbeen previously stopped \n \n13. Cycle Stop \nThe control used to pause a program. Cycle Stop pauses tool feed but \ndoes not stop spindle movement\n\n--- PDF PAGE 136 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n132 \n \n14. Dry Running \nPerforming a trial run of the part program without any parts or cutting \nfluids to check the program \n \n15. Edit Mode \nThe mode that allows an operator an operator to make changes to a \npart program and store those changes \n \n16. Emergency Stop \nThe control that automatically shuts down all machine functions \n \n17. Feed rate Override \nAn override that allows the operator to adjust the feed rate of the tool \nduring operation. The override functions as a percentage of the \nprogrammed value \n \n18. Handle Mode \nThe mode that allows for the manual operation of tool movement via the \nhand wheel. Some machines may have a combined handle/jog mode \n \n19. Rapid Feed Rate \nOverride \nAn override that allows the operator to reduce the rate of rapid tool \nmovement during operation. A rapid override may be 25% of the original \nrate or less \n \n20. Rapid Mode \nThe mode that allows for the manual movement of machine components \nat high rates of travel \n \n21. Tolerance \nThe unwanted but acceptable deviation from a desired dimension \n \n22. Tool Offset \nA stored value that compensates for variations in tool length. Each tool \nrequires an offset, which is measured from the turret or spindle position \n \n23. Zero return \nThe control that automatically locates the turret or spindle in the \nmachine zero position\n\n--- PDF PAGE 137 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n133 \n \n \n \nTRAINING REGULATIONS (TR) \nDOCUMENT REVISION HISTORY \n \n \n \n \nQualification Title: \n5-AXIS CNC MACHINE OPERATION NC III \n \nQualification Code: \nMEEAMO319 \n \n \n \n \n \nRevision \nNo. \nDocument \nTypes* \nQualification Title \nTESDA Board \nResolution No./ \nDate \nDeployment \n(TESDA Circular/ \nImplementing \nGuidelines) \n00 \nDocument Created \n \n5-axis CNC \nMachine Operation \nNC IIII \n2019-30/ \n05-21-2019 \n \nLegend: *Description Types \n \n- Document Created\n\n--- PDF PAGE 138 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n134 \n \n \nACKNOWLEDGMENTS \n \n \nThe Technical Education and Skills Development Authority (TESDA) wishes to \nextend thanks and appreciation to the many representatives of business, industry, academe \nand government agencies who donated their time and expertise to the development and \nvalidation of these Training Regulations. \