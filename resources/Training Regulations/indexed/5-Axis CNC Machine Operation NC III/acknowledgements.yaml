 Issues \n \n \n4.1 Communication \nskills required for \nleading teams \n4.2 Coaching skill\n\n--- PDF PAGE 12 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n8 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nneeds and \nrequirements are \nmet \n4.6 Follow-up \ncommunication is \nprovided on all \nissues affecting the \nteam \n 4.7 All relevant \ndocumentation is \ncompleted in \naccordance with \ncompany \nprocedures\n\n--- PDF PAGE 13 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n9 \n \n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work requirements \nMay include: \n1.1. Client Profile \n1.2. Assignment instructions \n2. Team member’s \nconcerns \nMay include: \n2.1. Roster/shift details \n3. Monitor performance \nMay include: \n3.1. Formal process \n3.2. Informal process \n4. Feedback \nMay include: \n4.1. Formal process \n4.2. Informal process \n5. Performance issues \nMay include: \n5.1. Work output \n5.2. Work quality \n5.3. Team participation \n5.4. Compliance with workplace protocols \n5.5. Safety \n5.6. Customer service\n\n--- PDF PAGE 14 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n10 \n \n EVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Maintained or improved individuals and/or team \nperformance given a variety of possible scenario \n1.2. Assessed and monitored team and individual \nperformance against set criteria \n1.3. Represented concerns of a team and individual to \nnext level of management or appropriate specialist \nand to negotiate on their behalf \n1.4. Allocated duties and responsibilities, having regard to \nindividual’s knowledge, skills and aptitude and the \nneeds of the tasks to be performed \n1.5. Set and communicated performance expectations for \na range of tasks and duties within the team and \nprovided feedback to team members \n2. Resource Implications \nThe following resources should be provided: \n2.1. Access to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n2.2. Materials relevant to the proposed activity or task \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1. Written Examination \n3.2. Oral Questioning \n3.3. Portfolio \n4. Context for Assessment \n4.1 Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter.\n\n--- PDF PAGE 15 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n11 \n \nUNIT OF COMPETENCY : \nAPPLY CRITICAL THINKING AND PROBLEM- \n \n \n \nSOLVING TECHNIQUES IN THE WORKPLACE \n \nUNIT CODE \n : 400311321 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required \nto solve problems in the workplace including the application \nof problem solving techniques and to determine and resolve \nthe root cause/s of specific problems in the workplace. \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Examine \nspecific \nworkplace \nchallenges \n1.1 Variances are \nexamined from \nnormal operating \nparameters; and \nproduct quality. \n1.2 Extent, cause and \nnature of the \nspecific problem \nare defined \nthrough \nobservation, \ninvestigation and \nanalytical \ntechniques. \n1.3 Problems are \nclearly stated and \nspecified. \n1.1 Competence \nincludes a \nthorough \nknowledge and \nunderstanding of \nthe process, \nnormal operating \nparameters, and \nproduct quality to \nrecognize non-\nstandard situations. \n1.2 Competence to \ninclude the ability \nto apply and \nexplain, enough for \nthe identification of \nfundamental \ncauses of specific \nworkplace \nchallenges. \n1.3 Relevant \nequipment and \noperational \nprocesses. \n1.4 Enterprise goals, \ntargets and \nmeasures. \n1.5 Enterprise quality \nOHS and \nenvironmental \nrequirement. \n1.6 Enterprise \ninformation \nsystems and data \ncollation \n1.7 Industry codes and \nstandards. \n1.1 Using range of \nanalytical techniques \n(e.g., planning, \nattention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation) in \nexamining specific \nchallenges in the \nworkplace. \n1.2 Identifying extent \nand causes of \nspecific challenges in \nthe workplace.\n\n--- PDF PAGE 16 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n12 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2. Analyze the \ncauses of \nspecific \nworkplace \nchallenges. \n2.1 Possible causes of \nspecific problems \nare identified \nbased on \nexperience and the \nuse of problem \nsolving tools / \nanalytical \ntechniques. \n2.2 Possible cause \nstatements are \ndeveloped based \non findings. \n2.3 Fundamental \ncauses are \nidentified per \nresults of \ninvestigation \nconducted. \n2.1 Competence \nincludes a \nthorough \nknowledge and \nunderstanding of \nthe process, \nnormal operating \nparameters, and \nproduct quality to \nrecognize non-\nstandard situations. \n2.2 Competence to \ninclude the ability \nto apply and \nexplain, sufficient \nfor the identification \nof fundamental \ncause, determining \nthe corrective \naction and \nprovision of \nrecommendations. \n2.3 Relevant \nequipment and \noperational \nprocesses. \n2.4 Enterprise goals, \ntargets and \nmeasures. \n2.5 Enterprise quality \nOSH and \nenvironmental \nrequirement. \n2.6 Enterprise \ninformation \nsystems and data \ncollation. \n2.7 Industry codes and \nstandards. \n2.1 Using range of \nanalytical \ntechniques (e.g., \nplanning, \nattention, \nsimultaneous \nand successive \nprocessing of \ninformation) in \nexamining \nspecific \nchallenges in the \nworkplace. \n2.2 Identifying extent \nand causes of \nspecific \nchallenges in the \nworkplace. \n2.3 Providing clear-\ncut findings on \nthe nature of \neach identified \nworkplace \nchallenges.\n\n--- PDF PAGE 17 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n13 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Formulate \nresolutions \nto specific \nworkplace \nchallenges \n3.1 All possible options \nare considered for \nresolution of the \nproblem. \n3.2 Strengths and \nweaknesses of \npossible options \nare considered. \n3.3 Corrective actions \nare determined to \nresolve the \nproblem and \npossible future \ncauses. \n3.4 Action plans are \ndeveloped \nidentifying \nmeasurable \nobjectives, \nresource needs \nand timelines in \naccordance with \nsafety and \noperating \nprocedures \n3.1 Competence to \ninclude the ability \nto apply and \nexplain, sufficient \nfor the identification \nof fundamental \ncause, determining \nthe corrective \naction and \nprovision of \nrecommendations \n3.2 Relevant \nequipment and \noperational \nprocesses \n3.3 Enterprise goals, \ntargets and \nmeasures \n3.4 Enterprise quality \nOSH and \nenvironmental \nrequirement \n3.5 Principles of \ndecision making \nstrategies and \ntechniques \n3.6 Enterprise \ninformation \nsystems and data \ncollation \n3.7 Industry codes and \nstandards \n3.1 Using range of \nanalytical \ntechniques (e.g., \nplanning, \nattention, \nsimultaneous \nand successive \nprocessing of \ninformation) in \nexamining \nspecific \nchallenges in the \nworkplace. \n3.2 Identifying extent \nand causes of \nspecific \nchallenges in the \nworkplace. \n3.3 Providing clear-\ncut findings on \nthe nature of \neach identified \nworkplace \nchallenges. \n3.4 Devising, \ncommunicating, \nimplementing \nand evaluating \nstrategies and \ntechniques in \naddressing \nspecific \nworkplace \nchallenges.\n\n--- PDF PAGE 18 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n14 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n4. Implement \naction plans \nand \ncommunicate \nresults \n4.1 Action plans are \nimplemented and \nevaluated. \n4.2 Results of plan \nimplementation and \nrecommendations \nare prepared. \n4.2 Recommendations \nare presented to \nappropriate \npersonnel. \n4.3 Recommendations \nare followed-up, if \nrequired. \n4.1 Competence to \ninclude the ability \nto apply and \nexplain, sufficient \nfor the identification \nof fundamental \ncause, determining \nthe corrective \naction and \nprovision of \nrecommendations \n4.2. Relevant \nequipment and \noperational \nprocesses \n4.3 Enterprise goals, \ntargets and \nmeasures \n4.4 Enterprise quality, \nOSH and \nenvironmental \nrequirement \n4.5 Principles of \ndecision making \nstrategies and \ntechniques \n4.6 Enterprise \ninformation \nsystems and data \ncollation \n4.7 Industry codes and \nstandards \n4.1 Using range of \nanalytical \ntechniques \n(e.g., planning, \nattention, \nsimultaneous \nand successive \nprocessing of \ninformation) in \nexamining \nspecific \nchallenges in \nthe workplace. \n4.2 Identifying \nextent and \ncauses of \nspecific \nchallenges in \nthe workplace. \n4.3 Providing clear-\ncut findings on \nthe nature of \neach identified \nworkplace \nchallenges. \n4.4 Devising, \ncommunicating, \nimplementing \nand evaluating \nstrategies and \ntechniques in \naddressing \nspecific \nworkplace \nchallenges.\n\n--- PDF PAGE 19 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n15 \n \n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Parameters \nMay include: \n1.1 Processes \n1.2 Procedures \n1.3 Systems \n \n2. Analytical techniques \nMay include: \n2.1. Brainstorming \n2.2. Intuitions/Logic \n2.3. Cause and effect diagrams \n2.4. Pareto analysis \n2.5. SWOT analysis \n2.6. Gant chart, Pert CPM and graphs \n2.7. Scattergrams \n3. Problem \n \nMay include: \n3.1. Routine, non – routine and complex workplace \nand quality problems \n3.2. Equipment selection, availability and failure \n3.3. Teamwork and work allocation problem \n3.4. Safety and emergency situations and incidents \n3.5. Risk assessment and management \n4. Action plans \n \nMay include: \n4.1. Priority requirements \n4.2. Measurable objectives \n4.3. Resource requirements \n4.4. Timelines \n4.5. Co-ordination and feedback requirements \n4.6. Safety requirements \n4.7. Risk assessment \n4.8. Environmental requirements\n\n--- PDF PAGE 20 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n16 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nExamined specific workplace challenges. \n1.2. \nAnalyzed the causes of specific workplace challenges. \n1.3. \nFormulated resolutions to specific workplace challenges. \n1.4. \nImplemented action plans and communicated results on \nspecific workplace challenges. \n \n2. Resource \nImplications \n2.1. \nAssessment will require access to an operating plant over \nan extended period of time, or a suitable method of \ngathering evidence of operating ability over a range of \nsituations. A bank of scenarios / case studies / what ifs will \nbe required as well as bank of questions which will be used \nto probe the reason behind the observable action. \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. \nObservation \n3.2. \nCase Formulation \n3.3. \nLife Narrative Inquiry \n3.4. \nStandardized test \nThe unit will be assessed in a holistic manner as is practical and \nmay be integrated with the assessment of other relevant units of \ncompetency. Assessment will occur over a range of situations, \nwhich will include disruptions to normal, smooth operation. \nSimulation may be required to allow for timely assessment of parts \nof this unit of competency. Simulation should be based on the \nactual workplace and will include walk through of the relevant \ncompetency components. \n \nThese assessment activities should include a range of problems, \nincluding new, unusual and improbable situations that may have \nhappened. \n4. Context for \nAssessment \nIn all workplace, it may be appropriate to assess this unit \nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 21 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n17 \n \nUNIT OF COMPETENCY : \nWORK IN A DIVERSE ENVIRONMENT \n \nUNIT CODE \n : 400311322 \n \nUNIT DESCRIPTOR \n : \nThis unit covers the outcomes required to work effectively \nin a workplace characterized by diversity in terms of \nreligions, beliefs, races, ethnicities and other differences. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Develop an \nindividual’s \ncultural \nawareness and \nsensitivity \n1.1 Individual \ndifferences with \nclients, customers \nand fellow workers \nare recognized \nand respected in \naccordance with \nenterprise policies \nand core values. \n1.2 Differences are \nresponded to in a \nsensitive and \nconsiderate \nmanner \n1.3 Diversity is \naccommodated \nusing appropriate \nverbal and non-\nverbal \ncommunication. \n1.1 Understanding \ncultural diversity in \nthe workplace \n1.2Norms of behavior \nfor interacting and \ndialogue with \nspecific groups \n(e. g., Muslims and \nother non-\nChristians, non-\nCatholics, \ntribes/ethnic groups, \nforeigners) \n1.3Different methods of \nverbal and non-\nverbal \ncommunication in a \nmulticultural setting \n1.1 Applying cross-\ncultural \ncommunication \nskills (i.e. different \nbusiness customs, \nbeliefs, \ncommunication \nstrategies) \n1.2 Showing affective \nskills – establishing \nrapport and \nempathy, \nunderstanding, etc. \n1.3 Demonstrating \nopenness and \nflexibility in \ncommunication \n1.4 Recognizing \ndiverse groups in \nthe workplace and \ncommunity as \ndefined by \ndivergent culture, \nreligion, traditions \nand practices\n\n--- PDF PAGE 22 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n18 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Work \neffectively in an \nenvironment \nthat \nacknowledges \nand values \ncultural \ndiversity \n2.1 Knowledge, skills \nand experiences \nof others are \nrecognized and \ndocumented in \nrelation to team \nobjectives. \n2.2 Fellow workers are \nencouraged to \nutilize and share \ntheir specific \nqualities, skills or \nbackgrounds with \nother team \nmembers and \nclients to enhance \nwork outcomes. \n2.3 Relations with \ncustomers and \nclients are \nmaintained to \nshow that diversity \nis valued by the \nbusiness. \n2.1 Value of diversity in \nthe economy and \nsociety in terms of \nWorkforce \ndevelopment \n2.2 Importance of \ninclusiveness in a \ndiverse \nenvironment \n2.3 Shared vision and \nunderstanding of \nand commitment to \nteam, \ndepartmental, and \norganizational \ngoals and \nobjectives \n2.4 Strategies for \ncustomer service \nexcellence \n2.1 Demonstrating cross-\ncultural \ncommunication skills \nand active listening \n2.2 Recognizing diverse \ngroups in the \nworkplace and \ncommunity as \ndefined by divergent \nculture, religion, \ntraditions and \npractices \n2.3 Demonstrating \ncollaboration skills \n2.4 Exhibiting customer \nservice excellence\n\n--- PDF PAGE 23 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n19 \n \nELEMENT \n \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Identify \ncommon issues \nin a \nmulticultural \nand diverse \nenvironment \n3.1 Diversity-related \nconflicts within \nthe workplace are \neffectively \naddressed and \nresolved. \n3.2 Discriminatory \nbehaviors towards \ncustomers/stakeho\nlders are \nminimized and \naddressed \naccordingly. \n3.3 Change \nmanagement \npolicies are in \nplace within the \norganization. \n3.1 Value, and leverage \nof cultural diversity \n3.2 Inclusivity and \nconflict resolution \n3.3 Workplace \nharassment \n3.4 Change \nmanagement and \nways to overcome \nresistance to change \n3.5 Advanced strategies \nfor customer service \nexcellence \n3.1 Addressing \ndiversity-related \nconflicts in the \nworkplace \n3.2 Eliminating \ndiscriminatory \nbehavior towards \ncustomers and co-\nworkers \n3.3 Utilizing change \nmanagement \npolicies in the \nworkplace\n\n--- PDF PAGE 24 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n20 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Diversity \nThis refers to diversity in both the workplace and the \ncommunity and may include divergence in: \n1.1 \nReligion \n1.2 \nEthnicity, race or nationality \n1.3 \nCulture \n1.4 \nGender, age or personality \n1.5 \nEducational background \n2. Diversity-related conflicts \nMay include conflicts that result from: \n2.1 \nDiscriminatory behaviors \n2.2 \nDifferences of cultural practices \n2.3 \nDifferences of belief and value systems \n2.4 \nGender-based violence \n2.5 \nWorkplace bullying \n2.6 \nCorporate jealousy \n2.7 \nLanguage barriers \n2.8 \nIndividuals being differently-abled persons \n2.9 \nAgeism (negative attitude and behavior \ntowards old people)\n\n--- PDF PAGE 25 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n21 \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 \nAdjusted language and behavior as required by interactions \nwith diversity \n1.2 \nIdentified and respected individual differences in colleagues, \nclients and customers \n1.3 \nApplied relevant regulations, standards and codes of practice \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Access to workplace and resources \n2.2 Manuals and policies on Workplace Diversity \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration or simulation with oral questioning \n3.2 \nGroup discussions and interactive activities \n3.3 \nCase studies/problems involving workplace diversity issues \n3.4 \nThird-party report \n3.5 \nWritten examination \n3.6 \nRole Plays \n4. Context for \nAssessment \nCompetency assessment may occur in workplace or any \nappropriately simulated environment\n\n--- PDF PAGE 26 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n22 \n \nUNIT OF COMPETENCY : \nPROPOSE METHODS OF APPLYING LEARNING \nAND INNOVATION IN THE ORGANIZATION \n \nUNIT CODE : \n400311323 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes \n \nrequired to assess general obstacles in the application \n \nof learning and innovation in the organization and to \n \npropose practical methods of such in addressing \n \norganizational challenges. \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Assess work \nprocedures, \nprocesses and \nsystems in \nterms of \ninnovative \npractices \n1.1. Reasons for \ninnovation are \nincorporated \nto work \nprocedures. \n1.2. Models of \ninnovation are \nresearched. \n1.3. Gaps or barriers \nto innovation in \none’s work area \nare analyzed. \n1.4. Staff who can \nsupport and foster \ninnovation in the \nwork procedure \nare identified. \n \n \n \n \n \n1.1 Seven habits of \nhighly effective \npeople. \n1.2 Character \nstrengths that \nfoster innovation \nand learning \n(Christopher \nPeterson and \nMartin Seligman, \n2004) \n1.3 Five minds of the \nfuture concepts \n(Gardner, 2007). \n1.4 Adaptation \nconcepts in \nneuroscience \n(Merzenich, 2013). \n1.5 Transtheoretical \nmodel of behavior \nchange \n(Prochaska, \nDiClemente, & \nNorcross, 1992). \n \n1.1 Demonstrating \ncollaboration and \nnetworking skills. \n1.2 Applying basic \nresearch and \nevaluation skills \n1.3 Generating insights \non how to improve \norganizational \nprocedures, \nprocesses and \nsystems through \ninnovation.\n\n--- PDF PAGE 27 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n23 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2. Generate \npractical action \nplans for \nimproving work \nprocedures, \nprocesses \n2.1 Ideas for \ninnovative work \nprocedure to foster \ninnovation using \nindividual and \ngroup techniques \nare conceptualized \n2.2 Range of ideas \nwith other team \nmembers and \ncolleagues are \nevaluated and \ndiscussed \n2.3 Work procedures \nand processes \nsubject to change \nare selected based \non workplace \nrequirements \n(feasible and \ninnovative). \n2.4 Practical action \nplans are \nproposed to \nfacilitate simple \nchanges in the \nwork procedures, \nprocesses and \nsystems. \n2.5 Critical inquiry is \napplied and used \nto facilitate \ndiscourse on \nadjustments in the \nsimple work \nprocedures, \nprocesses and \nsystems. \n2.1 Seven habits of \nhighly effective \npeople. \n2.2 Character \nstrengths that \nfoster innovation \nand learning \n(Christopher \nPeterson and \nMartin Seligman, \n2004) \n2.3 Five minds of the \nfuture concepts \n(Gardner, 2007). \n2.4 Adaptation \nconcepts in \nneuroscience \n(Merzenich, 2013). \n2.5 Transtheoretical \nmodel of behavior \nchange \n(Prochaska, \nDiClemente, & \nNorcross, 1992). \n2.1 Assessing readiness \nfor change on \nsimple work \nprocedures, \nprocesses and \nsystems. \n2.2 Generating insights \non how to improve \norganizational \nprocedures, \nprocesses and \nsystems through \ninnovation. \n2.3 Facilitating action \nplans on how to \napply innovative \nprocedures in the \norganization.\n\n--- PDF PAGE 28 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n24 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Evaluate the \neffectiveness of \nthe proposed \naction plans \n3.1 Work structure is \nanalyzed to \nidentify the \nimpact of the \nnew work \nprocedures \n3.2 Co-workers/key \npersonnel is \nconsulted to \nknow who will be \ninvolved with or \naffected by the \nwork procedure \n3.3 Work instruction \noperational plan \nof the new work \nprocedure is \ndeveloped and \nevaluated. \n3.4 Feedback and \nsuggestion are \nrecorded. \n3.5 Operational plan \nis updated. \n3.6 Results and \nimpact on the \ndeveloped work \ninstructions are \nreviewed \n3.7 Results of the \nnew work \nprocedure are \nevaluated \n3.8 Adjustments are \nrecommended \nbased on results \ngathered \n3.1 \nFive minds of the \nfuture concepts \n(Gardner, 2007). \n3.2 \nAdaptation \nconcepts in \nneuroscience \n(Merzenich, \n2013). \n3.3 \nTranstheoretical \nmodel of behavior \nchange \n(Prochaska, \nDiClemente, & \nNorcross, 1992). \n3.1 Generating \ninsights on how to \nimprove \norganizational \nprocedures, \nprocesses and \nsystems through \ninnovation. \n3.2 Facilitating action \nplans on how to \napply innovative \nprocedures in the \norganization. \n3.3 Communicating \nresults of the \nevaluation of the \nproposed and \nimplemented \nchanges in the \nworkplace \nprocedures and \nsystems. \n3.4 Developing action \nplans for \ncontinuous \nimprovement on \nthe basic systems, \nprocesses and \nprocedures in the \norganization.\n\n--- PDF PAGE 29 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n25 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Reasons \nMay include: \n1.1 \nStrengths and weaknesses of the current systems, \nprocesses and procedures. \n1.2 \nOpportunities and threats of the current systems, \nprocesses and procedures. \n2. Models of innovation \nMay include: \n2.1 \nSeven habits of highly effective people. \n2.2 \nFive minds of the future concepts (Gardner, 2007). \n2.3 \nNeuroplasticity and adaptation strategies. \n3. Gaps or barriers \nMay include: \n3.1 \nMachine \n3.2 \nManpower \n3.3 \nMethods \n3.4 \nMoney \n4. \nMay include: \n4.1 \nPreparation. \n4.2 \nDiscussion. \n4.3 \nClarification of goals. \n4.4 \nNegotiate towards a Win-Win outcome. \n4.5 \nAgreement. \n4.6 \nImplementation of a course of action. \n4.7 \nEffective verbal communication. See our pages: Verbal \nCommunication and Effective Speaking. \n4.8 \nListening. \n4.9 \nReducing misunderstandings is a key part of effective \nnegotiation. \n4.10 Rapport Building. \n4.11 Problem Solving. \n4.12 Decision Making. \n4.13 Assertiveness. \n4.14 Dealing with Difficult Situations.\n\n--- PDF PAGE 30 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n26 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nEstablished the reasons why innovative systems are \nrequired \n1.2 \nEstablished the goals of a new innovative system \n1.3 \nAnalyzed current organizational systems to identify gaps \nand barriers to innovation. \n1.4 \nAssessed work procedures, processes and systems in \nterms of innovative practices. \n1.5 \nGenerate practical action plans for improving work \nprocedures, and processes. \n1.6 \nReviewed the trial innovative work system and adjusted \nreflect evaluation feedback, knowledge management \nsystems and future planning. \n1.7 \nEvaluated the effectiveness of the proposed action plans. \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 \nPens, papers and writing implements. \n2.2 \nCartolina. \n2.3 \nManila papers. \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Psychological and behavioral Interviews. \n3.2 \nPerformance Evaluation. \n3.3 \nLife Narrative Inquiry. \n3.4 \nReview of portfolios of evidence and third-party workplace \nreports of on-the-job performance. \n3.5 \nSensitivity analysis. \n3.6 \nOrganizational analysis. \n3.7 \nStandardized assessment of character strengths and virtues \napplied. \n4. Context for \nAssessment \n4.1 Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions.\n\n--- PDF PAGE 31 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n27 \n \nUNIT OF COMPETENCY \n: USE INFORMATION SYSTEMATICALLY \n \nUNIT CODE : 400311324 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required \nto use technical information systems, apply information \ntechnology (IT) systems and edit, format & check information. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Use technical \ninformation \n1.1. Information are \ncollated and \norganized into a \nsuitable form for \nreference and use \n1.2. Stored \ninformation are \nclassified so that \nit can be quickly \nidentified and \nretrieved when \nneeded \n1.3. Guidance are \nadvised and \noffered to people \nwho need to find \nand use \ninformation \n \n \n \n \n \n1.1. Application in \ncollating \ninformation \n1.2. Procedures for \ninputting, \nmaintaining and \narchiving \ninformation \n1.3. Guidance to \npeople who need \nto find and use \ninformation \n1.4. Organize \ninformation \n1.5. classify stored \ninformation for \nidentification and \nretrieval \n1.6. Operate the \ntechnical \ninformation system \nby using agreed \nprocedures \n1.1. Collating information \n1.2. Operating \nappropriate and \nvalid procedures for \ninputting, \nmaintaining and \narchiving information \n1.3. Advising and \noffering guidance to \npeople who need to \nfind and use \ninformation \n1.4. Organizing \ninformation into a \nsuitable form for \nreference and use \n1.5. Classifying stored \ninformation for \nidentification and \nretrieval \n1.6. Operating the \ntechnical information \nsystem by using \nagreed procedures\n\n--- PDF PAGE 32 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n28 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Apply information \ntechnology (IT) \n2.1. Technical \ninformation \nsystem is operated \nusing agreed \nprocedures \n2.2. Appropriate and \nvalid procedures \nare operated for \ninputting, \nmaintaining and \narchiving \ninformation \n2.3. Software \nrequired are \nutilized to execute \nthe project \nactivities \n2.4. Information and \ndata obtained are \nhandled, edited, \nformatted and \nchecked from a \nrange of internal \nand external \nsources \n2.5. Information are \nextracted, entered, \nand processed to \nproduce the \noutputs required \nby customers \n2.6. Own skills and \nunderstanding are \nshared to help \nothers \n2.7. Specified security \nmeasures are \nimplemented to \nprotect the \nconfidentiality and \nintegrity of project \ndata held in IT \nsystems \n \n2.1. Attributes and \nlimitations of \navailable software \ntools \n2.2. Procedures and \nwork instructions for \nthe use of IT \n2.3. Operational \nrequirements for IT \nsystems \n2.4. Sources and flow \npaths of data \n2.5. Security systems \nand measures that \ncan be used \n2.6. Extract data and \nformat reports \n2.7. Methods of entering \nand processing \ninformation \n2.8. WWW enabled \napplications \n2.1. Identifying attributes \nand limitations of \navailable software \ntools \n2.2. Using procedures and\nwork instructions for \nthe use of IT \n2.3. Describing \noperational \nrequirements for IT \nsystems \n2.4. Identifying sources \nand flow paths of data\n2.5. Determining security \nsystems and \nmeasures that can be \nused \n2.6. Extracting data and \nformat reports \n2.7. Describing methods \nof entering and \nprocessing \ninformation \n2.8. Using WWW \napplications\n\n--- PDF PAGE 33 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n29 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Edit, format and \ncheck \ninformation \n3.1 Basic editing \ntechniques are \nused \n3.2 Accuracy of \ndocuments are \nchecked \n3.3 Editing and \nformatting tools and \ntechniques are \nused for more \ncomplex documents \n3.4 Proof reading \ntechniques is used \nto check that \ndocuments look \nprofessional \n3.1 Basic file-handling \ntechniques \n3.2 Techniques in \nchecking \ndocuments \n3.3 Techniques in \nediting and \nformatting \n3.4 Proof reading \ntechniques \n \n3.1 Using basic file-\nhandling techniques \nis used for the \nsoftware \n3.2 Using different \ntechniques in \nchecking documents \n3.3 Applying editing and \nformatting techniques \n3.4 Applying proof \nreading techniques\n\n--- PDF PAGE 34 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n30 \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Information \nMay include: \n1.1. Property \n1.2. Organizational \n1.3. Technical reference \n2. Technical information \nMay include: \n2.1. paper based \n2.2. electronic \n3. Software \nMay include: \n3.1. spreadsheets \n3.2. databases \n3.3. word processing \n3.4. presentation \n4. Sources \nMay include: \n4.1. other IT systems \n4.2. manually created \n4.3. within own organization \n4.4. outside own organization \n4.5. geographically remote \n5. Customers \nMay include: \n5.1. colleagues \n5.2. company and project management \n5.3. clients \n6. Security measures \nMay include: \n6.1. access rights to input; \n6.2. passwords; \n6.3. access rights to outputs; \n6.4. data consistency and back-up; \n6.5. recovery plans\n\n--- PDF PAGE 35 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n31 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Used technical information systems and information \ntechnology \n1.2. Applied information technology (IT) systems \n1.3. Edited, formatted and checked information \n \n2. Resource Implications The following resources should be provided: \n2.1. Computers \n2.2. Software and IT system \n \n3. Methods of \nAssessment \nCompetency in this unit should be assessed through: \n3.1. Direct Observation \n3.2. Oral interview and written test \n \n4. Context for \nAssessment \n4.1. Competency may be assessed individually in the actual \nworkplace or through accredited institution\n\n--- PDF PAGE 36 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n32 \n \nUNIT OF COMPETENCY : \nEVALUATE OCCUPATIONAL SAFETY AND \nHEALTH WORK PRACTICES \nUNIT CODE \n : 400311325 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \nrequired to interpret Occupational Safety and Health \npractices, set OSH work targets, and evaluate \neffectiveness of Occupational Safety and Health work \ninstructions \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Interpret \nOccupational \nSafety and \nHealth \npractices \n \n1.1 OSH work practices \nissues are identified \nrelevant to work \nrequirements \n1.2 OSH work standards and \nprocedures are \ndetermined based on \napplicability to nature of \nwork \n1.3 Gaps in work practices \nare identified related to \nrelevant OSH work \nstandards \n1.1. OSH work \npractices issues \n1.2. OSH work \nstandards \n1.3. General OSH \nprinciples and \nlegislations \n1.4. Company/ \nworkplace policies/ \nguidelines \n1.5. Standards and \nsafety \nrequirements of \nwork process and \nprocedures \n1.1. Communication \nskills \n1.2. Interpersonal skills \n1.3. Critical thinking \nskills \n1.4. Observation skills \n2. Set OSH work \ntargets \n \n2.1 Relevant work \ninformation are gathered \nnecessary to determine \nOSH work targets \n2.2 OSH Indicators based on \ngathered information are \nagreed upon to measure \neffectiveness of \nworkplace OSH policies \nand procedures \n2.3 Agreed OSH indicators \nare endorsed for \napproval from \nappropriate personnel \n2.4 OSH work instructions \nare received in \naccordance with \nworkplace policies and \nprocedures* \n2.1. OSH work targets \n2.2. OSH Indicators \n2.3. OSH work \ninstructions \n2.4. Safety and health \nrequirements of \ntasks \n2.5. Workplace \nguidelines on \nproviding \nfeedback on OSH \nand security \nconcerns \n2.6. OSH regulations \nHazard control \nprocedures \n2.7. OSH trainings \nrelevant to work \n2.1. Communication \nskills \n2.2. Collaborating skills \n2.3. Critical thinking \nskills \n2.4. Observation skills\n\n--- PDF PAGE 37 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n33 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Evaluate \neffectiveness \nof \nOccupational \nSafety and \nHealth work \ninstructions \n \n \n \n3.1 OSH Practices are \nobserved based on \nworkplace standards \n3.2 Observed OSH \npractices are measured \nagainst approved OSH \nmetrics \n3.3 Findings regarding \neffectiveness are \nassessed and gaps \nidentified are \nimplemented based on \nOSH work standards \n \n \n3.1. OSH Practices \n3.2. OSH metrics \n3.3. OSH Evaluation \nTechniques \n3.4. OSH work \nstandards \n3.1. Critical thinking \nskills \n3.2. Evaluating skills\n\n--- PDF PAGE 38 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n34 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. OSH Work \nPractices Issues \nMay include: \n1.1 Workers’ experience/observance on presence of work \nhazards \n1.2 Unsafe/unhealthy administrative arrangements (prolonged \nwork hours, no break-time, constant overtime, scheduling \nof tasks) \n1.3 Reasons for compliance/non-compliance to use of PPEs or \nother OSH procedures/policies/ guidelines \n2. OSH Indicators \nMay include: \n2.1 Increased of incidents of accidents, injuries \n2.2 Increased occurrence of sickness or health \ncomplaints/symptoms \n2.3 Common complaints of workers’ related to OSH \n2.4 High absenteeism for work-related reasons \n3. OSH Work \nInstructions \nMay include: \n3.1 Preventive and control measures, and targets \n3.2 Eliminate the hazard (i.e., get rid of the dangerous \nmachine \n3.3 Isolate the hazard (i.e. keep the machine in a closed room \nand operate it remotely; barricade an unsafe area off) \n3.4 Substitute the hazard with a safer alternative (i.e., replace \nthe machine with a safer one) \n3.5 Use administrative controls to reduce the risk (i.e. give \ntrainings on how to use equipment safely; OSH-related \ntopics, issue warning signages, rotation/shifting work \nschedule) \n3.6 Use engineering controls to reduce the risk (i.e. use safety \nguards to machine) \n3.7 Use personal protective equipment \n3.8 Safety, Health and Work Environment Evaluation \n3.9 Periodic and/or special medical examinations of workers \n4. OSH metrics \nMay include: \n4.1 Statistics on incidence of accidence and injuries \n4.2 Morbidity (Type and Number of Sickness) \n4.3 Mortality (Cause and Number of Deaths) \n4.4 Accident Rate\n\n--- PDF PAGE 39 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n35 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1. Identify OSH work practices issues relevant to \nwork requirements \n1.2. Identify gaps in work practices related to relevant \nOSH work standards \n1.3. Agree upon OSH Indicators based on gathered \ninformation to measure effectiveness of workplace \nOSH policies and procedures \n1.4. Receive OSH work instructions in accordance with \nworkplace policies and procedures \n1.5. Compare Observed OSH practices with against \napproved OSH work instructions \n1.6. Assess findings regarding effectiveness based on \nOSH work standards \n2. Resource Implications \nThe following resources should be provided: \n2.1 Facilities, materials, tools and equipment \nnecessary for the activity \n3. Methods of Assessment Competency in this unit may be assessed through: \n3.1 Observation/Demonstration with oral questioning \n3.2 Third party report \n3.3 Written exam \n \n4. Context for Assessment \n4.1 Competency may be assessed in the work place \nor in a simulated work place setting\n\n--- PDF PAGE 40 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n36 \n \nUNIT OF COMPETENCY \n: EVALUATE ENVIRONMENTAL WORK PRACTICES \n \nUNIT CODE \n: 400311326 \n \nUNIT DESCRIPTOR \n \n: \n \nThis unit covers the knowledge, skills and attitude to interpret \nenvironmental Issues, establish targets to evaluate \nenvironmental practices and evaluate effectiveness of \nenvironmental practices \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Interpret \nenvironmental \npractices, \npolicies and \nprocedures \n1.1 Environmental work \npractices issues are \nidentified relevant to \nwork requirements \n1.2 Environmental \nStandards and \nProcedures nature of \nwork are determined \nbased on Applicability to \nnature of work \n1.3 Gaps in work practices \nrelated to Environmental \nStandards and \nProcedures are \nidentified \n \n1.1 Environmental \nIssues \n1.2 Environmental \nWork Procedures \n1.3 Environmental \nLaws \n1.4 Environmental \nHazardous and \nNon-Hazardous \nMaterials \n1.5 Environmental \nrequired license, \nregistration or \ncertification \n1.1. Analyzing \nEnvironmental \nIssues and \nConcerns \n1.2. Critical thinking \n1.3. Problem Solving \n1.4. Observation Skills \n \n2. Establish \ntargets to \nevaluate \nenvironmental \npractices \n \n \n2.1. Relevant information are \ngathered necessary to \ndetermine environmental \nwork targets \n2.2. Environmental \nIndicators based on \ngathered information are \nset to measure \nenvironmental work \ntargets \n2.3. Indicators are verified \nwith appropriate \npersonnel \n2.1. Environmental \nIndicators \n2.2. Relevant \nEnvironment \nPersonnel or \nexpert \n2.3. Relevant \nEnvironmental \nTrainings and \nSeminars \n2.1. Investigative \nSkills \n2.2. Critical thinking \n2.3. Problem Solving \n2.4. Observation Skills\n\n--- PDF PAGE 41 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n37 \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Evaluate \neffectiveness \nof \nenvironmental \npractices \n3.1. Work environmental \npractices are recorded \nbased on workplace \nstandards \n3.2. Recorded work \nenvironmental practices \nare compared against \nplanned indicators \n3.3. Findings regarding \neffectiveness are \nassessed and gaps \nidentified are \nimplemented based on \nenvironment work \nstandards and \nprocedures \n3.4. Results of environmental \nassessment are \nconveyed to appropriate \npersonnel \n \n3.1 Environmental \nPractices \n3.2 Environmental \nStandards and \nProcedures \n3.1 Documentation and \nRecord Keeping \nSkills \n3.2 Critical thinking \n3.3 Problem Solving \n3.4 Observation Skills\n\n--- PDF PAGE 42 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n38 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Environmental Practices \nIssues \nMay include: \n1.1 \nWater Quality \n1.2 \nNational and Local Government Issues \n1.3 \nSafety \n1.4 \nEndangered Species \n1.5 \nNoise \n1.6 \nAir Quality \n1.7 \nHistoric \n1.8 \nWaste \n1.9 \nCultural \n2. Environmental Indicators \nMay include: \n2.1 \nNoise level \n2.2 \nLighting (Lumens) \n2.3 \nAir Quality - Toxicity \n2.4 \nThermal Comfort \n2.5 \nVibration \n2.6 \nRadiation \n2.7 \nQuantity of the Resources \n2.8 \nVolume\n\n--- PDF PAGE 43 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n39 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \n Competency \nAssessment requires evidence that the candidate: \n1.1. Identified environmental issues relevant to work \nrequirements \n1.2. Identified gaps in work practices related to Environmental \nStandards and Procedures \n1.3. Gathered relevant information necessary to determine \nenvironmental work targets \n1.4. Set environmental indicators based on gathered information \nto measure environmental work targets \n1.5. Recorded work environmental practices are recorded based \non workplace standards \n1.6. Conveyed results of environmental assessment to \nappropriate personnel \n2. Resource Implications The following resources should be provided: \n2.1 Workplace/Assessment location \n2.2 Legislation, policies, procedures, protocols and local \nordinances relating to environmental protection \n2.3 Case studies/scenarios relating to environmental \n Protection \n3. Methods of Assessment Competency in this unit may be assessed through: \n3.1 Written/ Oral Examination \n3.2 Interview/Third Party Reports \n3.3 Portfolio (citations/awards from GOs and NGOs, \n Certificate of training – local and abroad) \n3.4 Simulations and role-plays \n4. Context for Assessment 4.1 Competency may be assessed in actual workplace or \n at the designated TESDA center.\n\n--- PDF PAGE 44 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n40 \n \nUNIT OF COMPETENCY : \nFACILITATE ENTREPRENEURIAL SKILLS FOR MICRO-\nSMALL-MEDIUM ENTERPRISES (MSMEs) \n \n UNIT CODE \n: \n400311327 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes required to build, operate and \ngrow a micro/small-scale enterprise. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Develop and \nmaintain micro-\nsmall-medium \nenterprise \n(MSMEs) skills \nin the \norganization \n1.1 Appropriate business \nstrategies are \ndetermined and set for \nthe enterprise based on \ncurrent and emerging \nbusiness environment. \n1.2 Business operations are \nmonitored and controlled \nfollowing established \nprocedures. \n1.3 Quality assurance \nmeasures are \nimplemented consistently. \n1.4 Good relations are \nmaintained with \nstaff/workers. \n1.5 Policies and procedures \non occupational safety \nand health and \nenvironmental concerns \nare constantly observed. \n1.1 Business models \nand strategies \n1.2 Types and \ncategories of \nbusinesses \n1.3 Business \noperation \n1.4 Basic \nBookkeeping \n1.5 Business \ninternal controls \n1.6 Basic quality \ncontrol and \nassurance \nconcepts \n1.7 Government and \nregulatory \nprocesses \n \n1.1 Basic bookkeeping/ \naccounting skills \n1.2 Communication \nskills \n1.3 Building relations \nwith customer and \nemployees \n1.4 Building \ncompetitive \nadvantage of the \nenterprise \n2. Establish and \nmaintain client-\nbase/market \n2.1 Good customer relations \nare maintained \n2.2 New customers and \nmarkets are identified, \nexplored and reached out \nto. \n2.3 Promotions/Incentives are \noffered to loyal customers \n2.4 Additional products and \nservices are evaluated \nand tried where feasible. \n2.5 Promotional/advertising \ninitiatives are carried out \nwhere necessary and \nfeasible. \n \n2.1 Public relations \nconcepts \n2.2 Basic product \npromotion \nstrategies \n2.3 Basic market \nand feasibility \nstudies \n2.4 Basic business \nethics \n2.1 Building customer \nrelations \n2.2 Individual \nmarketing skills \n2.3 Using basic \nadvertising \n(posters/ tarpaulins, \nflyers, social media, \netc.)\n\n--- PDF PAGE 45 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n41 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Apply budgeting \nand financial \nmanagement \nskills \n3.1 Enterprise is built up and \nsustained through \njudicious control of cash \nflows. \n3.2 Profitability of enterprise \nis ensured though \nappropriate internal \ncontrols. \n3.3 Unnecessary or lower-\npriority expenses and \npurchases are avoided. \n3.1 Cash flow \nmanagement \n3.1 Basic financial \nmanagement \n3.2 Basic financial \naccounting \n3.3 Business internal \ncontrols \n \n3.1 Setting business \npriorities and \nstrategies \n3.2 Interpreting basic \nfinancial statements \n3.3 Preparing business \nplans\n\n--- PDF PAGE 46 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n42 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Business strategies \nMay include: \n1.1. Developing/Maintaining niche market \n1.2. Use of organic/healthy ingredients \n1.3. Environment-friendly and sustainable practices \n1.4. Offering both affordable and high-quality products \nand services \n1.5. Promotion and marketing strategies (e. g., on-line \nmarketing) \n2. Business operations \nMay include: \n2.1 Purchasing \n2.2 Accounting/Administrative work \n2.3 Production/Operations/Sales \n3. Internal controls \nMay include: \n3.1 Accounting systems \n3.2 Financial statements/reports \n3.3 Cash management \n \n4. Promotional/Advertisi\nng initiatives \nMay include: \n4.1 Use of tarpaulins, brochures, and/or flyers \n4.2 Sales, discounts and easy payment terms \n4.3 Use of social media/Internet \n4.4 “Service with a smile” \n4.5 Extra attention to regular customers\n\n--- PDF PAGE 47 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n43 \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated basic entrepreneurial skills \n1.2 Demonstrated ability to conceptualize and plan a \nmicro/small enterprise \n 1.3 Demonstrated ability to manage/operate a \nmicro/small-scale business \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Simulated or actual workplace \n2.2 Tools, materials and supplies needed to demonstrate \nthe required tasks \n2.3 References and manuals \n3. Methods of \n Assessment \nCompetency in this unit may be assessed through: \n3.1 Written examination \n3.2 Demonstration/observation with oral questioning \n3.3 Portfolio assessment with interview \n3.4 Case problems \n4. Context of \n Assessment \n4.1 Competency may be assessed in workplace or in a \nsimulated workplace setting \n4.2 Assessment shall be observed while tasks are being \nundertaken whether individually or in-group\n\n--- PDF PAGE 48 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n44 \n \nCOMMON COMPETENCIES \n \n \nUNIT OF COMPETENCY : \nAPPLY SAFETY PRACTICES \n \nUNIT CODE \n \n: \nMEE722201 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competencies required to apply safety \npractices in the workplace. \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify hazards \n \n1.1 Hazards are identified \ncorrectly in \naccordance with OHS \nprinciples \n1.2 Safety signs and \nsymbols are identified \nand adhered to \n1.1 Shop safety \nsigns, symbols \nand alarms \n1.2 Safety \nprecautionary \nmeasures \n1.1 Identifying hazard \n1.2 Identifying safety \nsign and symbol \n \n2. Use protective \nclothing and \ndevices \n2.1 Appropriate \nprotective clothing \nand devices correctly \nselected and used in \naccordance with OHS \nrequirements or \nindustry/company \npolicy \n \n2.1 Shop safety \nsigns, symbols \nand alarms \n2.2 Safety \nprecautionary \nmeasures \n2.3 Housekeeping \n2.4 Machine tools \n2.5 First aid \n2.1 Selecting \nappropriate \nprotective \nclothing and \ndevices \n \n3. Perform safe \nhandling of tools, \nequipment and \nmaterials \n3.1 Safety procedures for \npre-use check and \noperation of tools and \nequipment followed in \naccordance with \nindustry/ company \npolicies \n3.2 Tools, equipment and \nmaterials handled \nsafely in accordance \nwith OHS \nrequirements and \nindustry/ company \npolicies \n3.1 Shop safety \nsigns, symbols \nand alarms \n3.2 Safety \nprecautionary \nmeasures \n3.3 Housekeeping \n3.4 Machine tools \n3.5 Engineering \nmaterials \n \n3.1 Checking tools \nand equipment \n3.2 Operating tools \nand equipment \n3.3 Handling tools \nand equipment\n\n--- PDF PAGE 49 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n45 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4. Perform first aid \n4.1 Surroundings are \nchecked for any \npossible risk or harm \n4.2 Call for help someone \nif seriously injured. \n4.3 First aid treatment of \ninjuries are carried \nout according to \nrecommended \nprocedures \n4.1 Shop safety \nsigns, symbols \nand alarms \n4.2 Safety \nprecautionary \nmeasures \n4.3 Housekeeping \n4.4 Machine tools \n4.5 First aid \n4.6 Engineering \nmaterials \n4.1 Determining first \naid treatment \naccording to \nrecommended \nprocedures \n4.2 Performing first \naid according to \nrecommended \nprocedures \n5. Use fire \nextinguisher \n5.1 Check for your own \nsafety before starting \nto extinguish a fire. \n5.2 Fire extinguisher is \nselected correctly \naccording to the type \nof fire. \n5.3 Fire extinguisher are \noperated correctly \naccording \nrecommended \nprocedures \n5.1 Shop safety signs, \nsymbols and \nalarms \n5.2 Safety \nprecautionary \nmeasures \n5.3 Housekeeping \n5.4 Machine tools \n5.5 First aid \n5.6 Engineering \nmaterials \n5.7 Fire extinguishers \n5.1 Selecting fire \nextinguisher \naccording to the \ntype of fire \n5.2 Operating fire \nextinguisher \naccording to the \ntype of fire\n\n--- PDF PAGE 50 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n46 \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Hazards \nMay include: \n1.1 Cluttered tools and materials \n1.2 Slippery floors (caused by oil, grease or any liquid) \n1.3 Exposed electrical wires \n1.4 Sharp edges \n1.5 Machine without guards or with exposed moving parts \n1.6 Uncollected chips or other wastes \netc. \n2. Protective clothing and \ndevices \n May include: \n2.1 Safety glasses/goggles \n2.2 Safety shoes \n2.3 Overalls \n2.4 Cap \n3. Injuries \nMay include: \n3.1 Burns/scalds \n3.2 Fractures \n3.3 Cuts and abrasions \n3.4 Poisoning \n3.5 Foreign bodies in the eye \n3.6 Concussion \n3.7 Shock \n4. Type of fires \nMay include: \n4.1 common combustibles (wood, cloth, paper, rubber and \nplastic) \n4.2 Flammable liquids (gasoline, oil, solvents, paints, etc.) \n4.3 Energized electrical equipment (wiring, fuse boxes, \ncircuit breakers, appliances, etc. \n4.4 Combustible metals (magnesium, sodium, etc.)\n\n--- PDF PAGE 51 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n47 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \ncompetency \nAssessment requires evidence that the candidate: \nAssessment requires evidence that the candidate: \n1.1 identified hazardous area \n1.2 used protective clothing and devices \n1.3 handled tools, equipment and materials properly \n1.4 performed first aid \n1.5 used fire extinguisher \n \n2. Resource implications \n \nThe following resources should be provided: \n2.1 Tools, equipment and facilities appropriate to processes \nor activity \n2.2 Materials relevant to the proposed activity \n \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration \n3.2 Written or oral short answer questions \n3.3 Practical exercises \n \n4. Context for \nassessment \n \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 52 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n48 \n \nUNIT OF COMPETENCY : \nINTERPRET WORKING DRAWINGS AND SKETCHES \n \nUNIT CODE \n \n: \nMEE722202 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competencies required to read and \ninterpret drawings and sketches. \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Interpret technical \ndrawing \n1.1 Components, \nassemblies or \nobjects recognized \nas required. \n1.2 Dimensions \nidentified as \nappropriate. \n1.3 Instructions identified \nand followed as \nrequired. \n1.4 Material \nrequirements \nidentified as \nrequired. \n1.5 Symbols recognized \nas appropriate in the \ndrawing. \n1.6 Tolerance, limits \nand fits identified in \nthe drawing. \n1.1 Alphabet of lines \n1.2 Projections \n1.3 Drawing symbols \n1.4 Dimensioning \ntechniques \n1.5 Tolerance, limits \nand fits \n1.6 Engineering \nmaterials \n1.7 Drawing tools and \nsupplies \n \n1.1 Recognizing \ncomponents, \nassemblies and \nobjects. \n1.2 Identifying \ndimension \n1.3 Identifying \ninstruction \n1.4 Identifying \nmaterial \n1.5 Recognizing \nsymbols in the \ndrawing \n1.6 Identifying \ntolerance, limits \nand fits \n2. Prepare freehand \nsketch of parts \n2.1 Sketch drawn \ncorrectly and \nappropriately. \n2.2 Sketch depicted \nobjects or part \nappropriately. \n2.3