lerance \n2.2 Angular tolerance \n2.3 Geometric tolerance \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Interpreted technical drawing \n1.2 Prepared sketches \n1.3 Interpreted sketches \n2. Resource implications \n \nThe following resources should be provided: \n2.1 Drafting room/facilities and drafting instruments and \nsupplies appropriate to the activity \n2.2 Measuring tools \n2.3 Drawings, sketches or blueprint \n2.4 Specimen parts/components \n3. Method of assessment Competency in this unit may be assessed through: \n3.1 Direct observation \n3.2 Written or oral short answer questions \n3.3 Demonstration \n3.4 Project/work sample \n3.5 Portfolio \n4. Context for \nassessment \n \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 55 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n51 \n \nUNIT OF COMPETENCY : \nSELECT/ CUT WORKSHOP MATERIALS \n \nUNIT CODE \n \n: \nMEE722203 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills and knowledge required to select \nand cut workshop materials. \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine \nrequirement \n1.1 Plans/ drawings are \ninterpreted to \nproduce component \nto specification \n1.2 Sequence of \noperation is \ndetermined to \nproduce component \nto specification \n \n1.1 Shop safety \npractices \n1.1.1 Safe working \n habits \n1.1.2 Safe handling \n of tools, \n equipment \n and materials \n1.2 Blueprint reading \n1.2.1 Standard \n drawing \n scales, \n symbols and \n abbreviations \n1.2.2 Assembly \n and details of \n drawing \n1.2.3 Dimensions \n1.3 Measurement \n1.3.1 Linear \n measuring \n tools \n \n1.1 Interpreting plans \nand drawings \n1.2 Determining \nsequence of \noperation \n \n2. Select and \nmeasure materials \n2.1 Materials are \nselected according \nto the \nrequirement of the \noperation \n2.2 Materials are \nmeasured to \nrequired level of \naccuracy using \nmeasuring tool \n2.3 Measuring tools are \nused according to \nmanufacturer’s \nspecification \n2.1 Shop safety \npractices \n2.1.1 Safe working \n habits \n2.1.2 Safe \n handling of \n tools, \n equipment \n and \n materials \n2.2 Blueprint reading \n2.2.1 Standard \n drawing \n scales, \n symbols and \n abbreviations \n2.2.2 Assembly \n and details of \n drawing \n \n \n2.1 Selecting \nmaterials \n2.2 Measuring \nmaterials \n2.3 Using measuring \ntools\n\n--- PDF PAGE 56 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n52 \n \n \n \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \n \n2.3 Dimensions \n2.3.1 Measurement \n2.3.2 Linear \n measuring \n tools \n2.4 Materials and \n related science \n2.4.1 Classification \nand \nmechanical \nproperties of \nengineering \nmaterials \n \n3. Cut materials \n3.1 Materials are cut \naccording to \nplans/drawing \ninstruction \n3.2 Cutting \ntools/equipment \nare used based on \nmanufacturers \nspecification, \nappropriate \ntechniques or the \nsafety procedure \n \n3.1 Shop safety \npractices \n3.1.1 Safe working \n habits \n3.1.2 Safe \n handling of \n tools, \n equipment \n and \n materials \n3.2 Blueprint reading \n3.2.1 Standard \n drawing \n scales, \n symbols and \n abbreviations \n3.2.2 Assembly \n and details of \n drawing \n3.2.3 Dimensions \n3.3 Measurement \n3.3.1 Linear \n measuring \n tools \n3.4 Materials and \nrelated science \n3.4.1 Classification \n and \n mechanical \n properties of \n engineering \n materials \n3.1 Cutting of material \n3.2 Using of cutting \ntools and \nequipment\n\n--- PDF PAGE 57 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n53 \n \nRANGE 