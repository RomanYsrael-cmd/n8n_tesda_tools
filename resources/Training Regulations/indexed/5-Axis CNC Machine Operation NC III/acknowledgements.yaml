      "source_text": "3.1 Machine guard is opened according to machine operating manual 3.2 Work piece is cleaned and de burred while on the fixture according to standard operating procedure 3.3 Work piece is inspected and measured according to drawing specification 3.4 Safety practices are applied according to OSHS"
