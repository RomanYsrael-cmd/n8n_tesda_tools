  "source_text": "ACKNOWLEDGEMENTS \n132-133\n\n--- PDF PAGE 5 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n1 \n \n \nTRAINING REGULATIONS FOR \n5-AXIS CNC MACHINE OPERATION NC III \n \nSECTION 1 5- AXIS CNC MACHINE OPERATION NC III QUALIFICATION \n \nThe 5-Axis CNC Machine Operation NC III Qualification consists of competencies that \na person must achieve to write advance CNC program, set up machine, work piece and cutting \ntools and perform 5-axis CNC machine operations and conduct final inspection on work piece. \n \nCODE NO. \n \nBASIC COMPETENCIES \n400311319 \nLead workplace communication \n400311320 \nLead small teams \n400311321 \n400311322 \nApply critical thinking and problem-solving techniques in the workplace \nWork in a diverse environment \n400311323 \n400311324 \n400311325 \n400311326 \n400311327 \nPropose methods of applying learning and innovation in the organization \nUse information systematically \nEvaluate occupational safety and health work practices \nEvaluate environmental work practices \nFacilitate entrepreneurial skills for micro-small-medium enterprises (MSMEs) \n \nCODE NO. \nCOMMON COMPETENCIES \n \nMEE722201 \nApply safety practices \n \nMEE722202 \nInterpret working drawings and sketches \n \nMEE722203 \nSelect/ cut workshop materials \n \nMEE722204 \nPerform shop computations (Basic) \n \nMEE722205 \nMEE722206 \nMeasure workpiece (Basic) \nPerform routine housekeeping \n \nMEE722207 \nPerform shop computations (Intermediate) \n \nMEE722208 \nMeasure workpiece using angular measuring instruments \nMEE722210 \nMeasure workpiece using gages and surface texture \ncomparator \n \nMEE722211 \nICT311201 \nPerform preventive and corrective maintenance \nOperate a personal computer \n \n \n \n \nCODE NO. \nCORE COMPETENCIES \nMEE 821321 \nWrite 5-axis CNC machine program \nMEE 821322 \nSet-up 5-axis CNC machine, cutting tools and workpiece \nMEE 821323 \nPerform 5-axis CNC machine operations \nMEE 821324 \nPerform post 5-axis CNC machine operations \n \nA person who has achieved this Qualification is competent to be: \n \n• 5-Axis CNC Machine Programmer \n• 5-Axis CNC Machine Operator \n• CNC Lathe Machine Operator \n• CNC Milling Machine Operator\n\n--- PDF PAGE 6 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n2 \n \nSECTION 2 COMPETENCY STANDARDS \n \n \nThis section gives the details and contents of the units of competency required in 5-AXIS \nCNC MACHINE OPERATION NC III. These units of competency are categorized into basic, \ncommon and core competencies. \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION \n \nUNIT CODE \n : 400311319 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to \nlead in the effective dissemination and discussion of ideas, \ninformation, and issues in the workplace. This includes \npreparation of written communication materials. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Communicate \ninformation \nabout \nworkplace \nprocesses \n1.1 Relevant \ncommunication \nmethod is selected \nbased on workplace \nprocedures \n1.2 Multiple operations \ninvolving several \ntopics/areas are \ncommunicated following \nenterprise requirements \n1.3 Questioning is applied \nto gain extra information \n1.4 Relevant sources of \ninformation are \nidentified in accordance \nwith workplace/ client \nrequirements \n1.5 Information is selected \nand organized following \nenterprise procedures \n1.6 Verbal and written \nreporting is undertaken \nwhen required \n1.7 Communication and \nnegotiation skills are \napplied and maintained \nin all relevant situations \n1.1. Organization \nrequirements \nfor written and \nelectronic \ncommunication \nmethods \n1.2. Effective verbal \ncommunication \nmethods \n1.3. Business \nwriting \n1.4. Workplace \netiquette \n1.1 Organizing \ninformation \n1.2 Conveying \n intended meaning \n1.3 Participating in a \nvariety of workplace \ndiscussions \n1.4 Complying with \norganization \nrequirements for the \nuse of written and \nelectronic \ncommunication \nmethods \n1.5 Effective business \nwriting \n1.6 Effective clarifying \nand probing skills \n1.7 Effective \nquestioning \ntechniques \n(clarifying and \nprobing)\n\n--- PDF PAGE 7 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n3 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Lead workplace \ndiscussions \n2.1 Response to workplace \nissues are sought \nfollowing enterprise \nprocedures \n2.2 Response to workplace \nissues are provided \nimmediately \n2.3 Constructive \ncontributions are made \nto workplace \ndiscussions on such \nissues as production, \nquality and safety \n2.4 Goals/ objectives and \naction plans \nundertaken in the \nworkplace are \ncommunicated promptly \n2.1 Organization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n2.2 Effective verbal \ncommunication \nmethods \n2.3 Workplace \netiquette \n2.1 Organizing \ninformation \n2.2 Conveying \nintended meaning \n2.3 Participating in \nvariety of \nworkplace \ndiscussions \n2.4 Complying with \norganization \nrequirements for \nthe use of written \nand electronic \ncommunication \nmethods \n2.5 Effective clarifying \nand probing skills \n \n3. Identify and \ncommunicate \nissues arising in \nthe workplace \n3.1 Issues and problems \nare identified as they \narise \n3.2 Information regarding \nproblems and issues \nare organized \ncoherently to ensure \nclear and effective \ncommunication \n3.3 Dialogue is initiated \nwith appropriate \npersonnel \n3.4 Communication \nproblems and issues \nare raised as they arise \n3.5 Identify barriers in \ncommunication to be \naddressed \nappropriately \n \n3.1 Organization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n3.2 Effective verbal \ncommunication \nmethods \n3.3 Workplace \netiquette \n3.4 Communication \nproblems and \nissues \n3.5 Barriers in \ncommunication \n \n3.1 Organizing \ninformation \n3.2 Conveying intended \nmeaning \n3.3 Participating in a \nvariety of workplace \ndiscussions \n3.4 Complying with \norganization \nrequirements for the \nuse of written and \nelectronic \ncommunication \nmethods \n3.5 Effective clarifying \nand probing skills \n3.6 Identifying issues \n3.7 Negotiation and \ncommunication \nskills\n\n--- PDF PAGE 8 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n4 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Methods of \ncommunication \nMay include: \n1.1. Non-verbal gestures \n1.2. Verbal \n1.3. Face-to-face \n1.4. Two-way radio \n1.5. Speaking to groups \n1.6. Using telephone \n1.7. Written \n1.8. Internet \n \n2. Workplace \ndiscussions \nMay include: \n2.1. Coordination meetings \n2.2. Toolbox discussion \n2.3. Peer-to-peer discussion\n\n--- PDF PAGE 9 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n5 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Dealt with a range of communication/information at \none time \n1.2 Demonstrated leadership skills in workplace \ncommunication \n1.3 Made constructive contributions in workplace issues \n1.4 Sought workplace issues effectively \n1.5 Responded to workplace issues promptly \n1.6 Presented information clearly and effectively written \nform \n1.7 Used appropriate sources of information \n1.8 Asked appropriate questions \n1.9 Provided accurate information \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Variety of Information \n2.2 Communication tools \n2.3 Simulated workplace \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \nCase problem \n3.1. Third-party report \n3.2. Portfolio \n3.3. Interview \n3.4. Demonstration/Role-playing \n4. Context for \nAssessment \n4.1. Competency may be assessed in the workplace or in \na simulated workplace environment\n\n--- PDF PAGE 10 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n6 \n \nUNIT OF COMPETENCY \n: \nLEAD SMALL TEAMS \n \nUNIT CODE \n \n: \n400311320 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and \n \n \n \nattitudes to lead small teams including setting, \n \n \n \nmaintaining and monitoring team and individual \n \n \n \nperformance standards. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Provide team \nleadership \n1.1 Work \nrequirements are \nidentified and \npresented to team \nmembers based on \ncompany policies \nand procedures \n1.2 Reasons for \ninstructions and \nrequirements are \ncommunicated to \nteam members \nbased on company \npolicies and \nprocedures \n1.3 Team members’ \nand leaders’ \nconcerns are \nrecognized, \ndiscussed and \ndealt with based on \ncompany practices \n1.1 Facilitation of Team \nwork \n1.2 Company policies \nand procedures \nrelating to work \nperformance \n1.3 Performance \nstandards and \nexpectations \n1.4 Monitoring \nindividual’s and \nteam’s \nperformance vis a \nvis client’s and \ngroup’s \nexpectations \n1.1 Communication \nskills required for \nleading teams \n1.2 Group facilitation \nskills \n1.3 Negotiating skills \n1.4 Setting performance \nexpectation \n2. Assign \nresponsibilities \n2.1. Responsibilities are \nallocated having \nregard to the skills, \nknowledge and \naptitude required to \nundertake the \nassigned task \nbased on company \npolicies. \n2.2. Duties are \nallocated having \nregard to individual \npreference, \ndomestic and \npersonal \nconsiderations, \nwhenever possible \n2.1 Work plan and \nproce