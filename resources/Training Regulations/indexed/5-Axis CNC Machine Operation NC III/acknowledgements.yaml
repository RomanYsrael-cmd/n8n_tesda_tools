      "source_text": "2.1 Public relations concepts 2.2 Basic product promotion strategies 2.3 Basic market and feasibility studies 2.4 Basic business ethics 2.1 Building customer relations 2.2 Individual marketing skills 2.3 Using basic advertising (posters/ tarpaulins, flyers, social media, etc.)"
