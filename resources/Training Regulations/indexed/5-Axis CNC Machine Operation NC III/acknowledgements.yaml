      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Develop and maintain micro- small-medium enterprise (MSMEs) skills in the organization 1.1 Appropriate business strategies are determined and set for the enterprise based on current and emerging business environment. 1.2 Business operations are monitored and controlled following established procedures. 1.3 Quality assurance measures are implemented consistently. 1.4 Good relations are maintained with staff/workers. 1.5 Policies and procedures on occupational safety and health and environmental concerns are constantly observed. 1.1 Business models and strategies 1.2 Types and categories of businesses 1.3 Business operation 1.4 Basic Bookkeeping 1.5 Business internal controls 1.6 Basic quality control and assurance concepts 1.7 Government and regulatory processes"
    },
