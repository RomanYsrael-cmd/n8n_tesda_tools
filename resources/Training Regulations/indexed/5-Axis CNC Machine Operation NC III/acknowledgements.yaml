    },
    {
      "source_text": "2. Submit work piece 2.1 Operator is sign out the operation sheet according to workplace procedures 2.2 Work piece and operation sheet are submitted to immediate supervisor according to work place procedures 2.3 Safety practices are applied according to OSHS 2.1 Procedures in signing out operation sheet 2.2 Submission of operation sheet and inspected work piece 2.2 OSH Rule No. 1070 – Occupational Health & Environmental Control 2.3 OSH Rule No. 1080 – Personal Protective Equipment & Devices 2.4 Air pollution 2.5 Noise pollution 2.1 Signing out operation sheet 2.2 Submitting report and work piece 2.3 Applying safety procedures"
