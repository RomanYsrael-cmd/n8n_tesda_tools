    },
    {
      "source_text": "3.1 Machine is shut- off according to manufacturer’s operating manual 3.2 Tools are maintained and stored based on established procedures 3.3 Defective tools and machines are tagged and reported according to work place procedures 3.4 Good housekeeping is performed following 5S 3.5 Wastes are disposed according to waste management procedures and environmental regulations 3.6 Safety practices are applied following OSHS 3.1 Procedures in shutting off machine 3.2 Storage of tools and materials 3.3 Tagging of defective tools and machine 3.4 5S of good house keeping 3.5 Waste management 3.6 Environmental laws to post activities 3.7 OSH Rule No. 1070 – Occupational Health & Environmental Control 3.8 OSH Rule No. 1080 – Personal Protective Equipment & Devices 3.9 Air pollution 3.10 Noise pollution 3.1 Shutting off machine 3.2 Cleaning and storing of tools and materials 3.3 Tagging defective tools and machine 3.4 Performing good house keeping 3.5 Managing wastes 3.6 Applying safety procedures"
