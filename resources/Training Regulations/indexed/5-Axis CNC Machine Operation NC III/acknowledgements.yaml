    {
      "source_text": "UNIT DESCRIPTOR"
    },
    {
      "source_text": ": This unit covers the knowledge and skills required to"
    },
    {
      "source_text": "perform 5-AXIS CNC machining operations"
    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Bold and Italicized terms are elaborated in the Range of Variables REQUIRED KNOWLEDGE REQUIRED SKILLS 1. Operate machine"
    },
    {
      "source_text": "1.1 Close machine guard according to safety standard operation procedures 1.2 Dry run is conducted in accordance with the desired tool path movement 1.3 Program is edited according to tool path movement if required. 1.4 Operate 5 axis CNC machine to produce component to meet the desired dimensions, tolerance, fits, limits and surface finish according to job requirement. 1.5 Safety practices are applied according to OSHS. 1.1 Machine safety procedures 1.2 Procedures in conducting dry run 1.3 Procedures in editing program 1.4 Procedures in operating 5 axis CNC machine 1.5 OSH Rule No. 1070 – Occupational Health & Environmental Control 1.6 OSH Rule No. 1080 – Personal Protective Equipment & Devices 1.6 Air pollution 1.7 Noise pollution"
    },
    {
      "source_text": "1.1 Conducting dry run 1.2 Editing program 1.3 Operating of 5 axis CNC machine 1.4 Applying safety procedures"
    },
    {
      "source_text": "2. Monitor machine and tool movements"
    },
    {
      "source_text": "2.1 Program parameters are checked based on computed data 2.2 Air pressure level is maintained according to machine operating manual 2.3 Cooling system is maintained according to viscosity requirements 2.4 Cutting tool sharpness is maintained according to work procedures 2.5 Safety practices are applied according to OSHS. 2.1 Procedures in checking machine parameters 2.2 Procedures in checking air pressure 2.3 Procedures in maintaining cooling system 2.4 Procedures in maintaining tool sharpness 2.5 OSH Rule No. 1070 – Occupational Health & Environmental Control 2.6 OSH Rule No. 1080 – Personal Protective Equipment & Devices 2.7 Air pollution 2.8 Noise pollution 2.1 Checking machine parameters 2.2 Checking air pressure 2.3 Maintaining cooling system 2.4 Maintaining machine lubrication system 2.5 Maintaining tool life 2.6 Applying safety procedures"
    },
    {
      "source_text": "-- PDF PAGE 92 --- 5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019)"
    },
    {
      "source_text": "88"
