      "source_text": "VARIABLE RANGE 1. Reasons May include: 1.1 Strengths and weaknesses of the current systems, processes and procedures. 1.2 Opportunities and threats of the current systems, processes and procedures. 2. Models of innovation May include: 2.1 Seven habits of highly effective people. 2.2 Five minds of the future concepts (Gardner, 2007). 2.3 Neuroplasticity and adaptation strategies. 3. Gaps or barriers May include: 3.1 Machine 3.2 Manpower 3.3 Methods 3.4 Money 4. May include: 4.1 Preparation. 4.2 Discussion. 4.3 Clarification of goals. 4.4 Negotiate towards a Win-Win outcome. 4.5 Agreement. 4.6 Implementation of a course of action. 4.7 Effective verbal communication. See our pages: Verbal Communication and Effective Speaking. 4.8 Listening. 4.9 Reducing misunderstandings is a key part of effective negotiation. 4.10 Rapport Building. 4.11 Problem Solving. 4.12 Decision Making. 4.13 Assertiveness. 4.14 Dealing with Difficult Situations."
