s and mixed \nnumbers using four \nfundamental operations \n1.1 English and metric \nsystem of \nmeasurement \n \n1.2 Performing \ncalculation using \nfour fundamental \noperation \n \n2. Perform basic \ncalculations \ninvolving \nfractions and \ndecimals \n2.1 Simple calculations are \nperformed involving \nfractions and decimals \nusing the four \nfundamental operations. \n2.2 Decimal are converted \ninto fraction (and vice \nversa) accurately \n2.1 English and metric \nsystem of \nmeasurement \n \n2.1 Identifying die \nmaterial \nrequirements \n2.2 Determining \nproduction \nvolume \n2.3 Identifying \ndesign \nparameters \n3. Perform basic \ncalculations \ninvolving \npercentages. \n3.1 Simple calculations are \nperformed to obtain \npercentages from \ninformation expressed in \neither fractional or \ndecimal format \n3.1 English and metric \nsystem of \nmeasurement \n \n3.1 Performing \ncalculation \n \n4. Perform basic \ncalculation \ninvolving ration \nand proportion \n4.1 Simple calculations are \nperformed involving \nratios and proportion \nusing whole numbers, \nfractions and decimal \nfractions. \n \n4.1 English and metric \nsystem of \nmeasurement \n \n4.1 Performing \ncalculation \n5. Perform \ncalculations on \nalgebraic \nexpressions \n5.1 Simple calculations are \nperformed on algebraic \nexpressions using the \nfour fundamental \noperations. \n5.2 Simple transposition of \nformulae is carried out to \nisolate the variable \nrequired, involving the \nfour fundamental \noperations. \n \n5.1 English and metric \nsystem of \nmeasurement \n \n5.1 Performing \ncalculation\n\n--- PDF PAGE 60 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n56 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Four fundamental \noperations \nMay include: \n1.1 Addition \n1.2 Subtraction \n1.3 Multiplication \n1.4 Division \n \n2. Algebraic expressions Calculation using formula for determining: \n2.1 tap drill size \n2.2 feed \n2.3 speed \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Using four fundamental operations \n1.2 Involving fractions and mixed numbers \n1.3 Involving fractions and decimals \n1.4 Involving percentages \n1.5 Involving ratio and proportion \n1.6 On algebraic expressions \n1.7 of simple formulae \n \n2. Resource \nimplications \nThe following resources should be provided: \n2.1 Tools, equipment and facilities appropriate to \nprocesses or activity \n2.2 Materials relevant to the proposed activity \n \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Written or oral short answer questions \n3.2 Practical exercises \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter\n\n--- PDF PAGE 61 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n57 \n \nUNIT OF COMPETENCY \n: \nMEASURE WORKPIECE (BASIC) \n \nUNIT CODE \n \n: \nMEE722205 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competencies required to measure \nworkpieces using measuring instruments such as steel rules, \nVernier calipers, micrometers, etc.…. \n \n \n \n \n \n \n \n \n \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Select and use \nmeasuring tools \n1.1 Measuring tools \nare selected and \nused according to \nthe level of accuracy \nrequired. \n1.2 Measurements \ntaken are accurate \nto the finest \ngraduation of the \nselected measuring \ninstrument. \n1.3 Measuring \ntechnique used is \ncorrect and \nappropriate to the \ndevice used. \n1.1 Types, purposes \nand accuracy of \nmeasuring \ninstruments \n1.2 Capability of \nmeasuring \ninstruments \n1.3 Part dimensions \nand tolerances \n1.4 Techniques for \nmeasuring \ndimensions \n1.5 Care and storage \nprocedure of \nmeasuring tools \n \n1.1 Selecting \nmeasuring tools \n1.2 Obtaining \naccurate \nmeasurements \n1.3 Determining \nmeasuring \ntechnique \n \n2. Clean and store \nmeasuring tools \n2.1 Cleaning of devices \nundertaken \naccording to \nstandard operating \nprocedures. \n2.2 Care of devices \nundertaken \naccording to \nmanufacturer’s \nspecifications. \n2.3 Storage of devices \nundertaken \naccording to \nstandard operating \nprocedures. \n2.1 Types, purposes \nand accuracy of \nmeasuring \ninstruments \n2.2 Capability of \nmeasuring \ninstruments \n2.3 Part dimensions \nand tolerances \n2.4 Techniques for \nmeasuring \ndimensions \n2.5 Care and storage \nprocedure of \nmeasuring tools \n \n2.1 Determining \nproper care and \nstorage of \nmeasuring tools.\n\n--- PDF PAGE 62 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n58 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Measuring tools \nMay include \n1.1 Steel tape \n1.2 Steel rule \n1.3 Straight edge \n1.4 Combination square \n1.5 Steel square \n1.6 Divider or trammel \n1.7 Caliper \n1.8 Protractor \n1.9 Vernier caliper \n1.10 Micrometer \n \n2. Measurements \nMay include: \n2.1 Length \n2.2 Diameter \n2.3 Depth \n2.4 Flatness \n2.5 Straightness \n2.6 Squareness \n \n \n \n \n EVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Selected and used measuring instruments \n1.2 Cleaned and stored measuring instruments \n \n2. Resource \nimplications \nThe following resources should be provided: \n2.1 Tools, equipment and facilities appropriate to the activity \n2.2 Specimen component or part to the proposed activity \n \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Direct observation \n3.2 Demonstration \n3.3 Written or oral short answer questions \n3.4 Portfolio \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 63 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n59 \n \nUNIT OF COMPETENCY \n: \nPERFORM ROUTINE HOUSEKEEPING \n \nUNIT CODE \n \n: \nMEE722206 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competencies required to maintain an \norganized and clean work area. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine \nrequirement \n1.1 Work area maintained in \na safe, uncluttered and \norganized manner \naccording to workshop \npolicy \n1.2 All tasks carried out \nsafely, effectively and \nefficiently with minimum \ninconvenience according \nto workshop policy \n1.3 Workshop policies and \nprocedures for tidying \nwork areas and placing \nitems in designated \nareas applied \n1.1 Shop safety \npractices \n1.2 Machine shop \nequipment \n1.3 Shop policies \nregulations \n1.4 5-S \n1.5 Shop cleaning \nequipment \n \n1.1 Maintaining work \narea, safe \nuncluttered and \norganized \n1.2 Carrying out all \ntask safely, \neffectively and \nefficiently \n1.3 Designating \nworkshop \npolicies and \nprocedures for \nwork area \n \n2 Clean work \narea \n2.1 Shop policies and \nprocedures applied for \ncleaning work area \n2.2 Wastes promptly removed \nand disposed of according \nto shop policies and \nenvironmental \nrequirements \n2.3 Spills, wastes and other \npotential hazards \nreported to appropriate \npersonnel and removed \naccording to shop \npolicies and \nenvironmental \nrequirements \n2.4 Signage promptly \ndisplayed in regard to \nunsafe areas \n2.5 Consumable materials \nmaintained and stored \ncorrectly after use \n2.6 Tools and equipment \n(including guards) \ncleaned and used in \nAccordance with \nmanufacturer’s \ninstructions \n2.1 Shop safety \npractices \n2.2 Machine shop \nequipment \n2.3 Shop policies \nregulations \n2.4 5-S \n2.5 Shop cleaning \nequipment \n \n2.1 Applying shop \npolicies and \nprocedures \n2.2 Disposing of \nwaste according \nto shop policy \nand \nenvironmental \nrequirements \n2.3 Cleaning of tools \nand equipment\n\n--- PDF PAGE 64 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n60 \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Workshop policy \nShop policy and procedure in regard to: \n1.1 Housekeeping practices \n1.2 Maintenance and storage of cleaning equipment \n1.3 Use and storage of cleaning chemicals \n2. Work area \nMay include: \n2.2 Work benches \n2.3 Walkways and aisles \n2.4 Fixtures and other working surfaces \n3. Tools and \n Equipment \nMay include: \n3.1 Drill Press \n3.2 Pedestal Grinder \n3.3 Surface plate \n3.4 Layout and marking tools \n3.5 Cutting tools (hacksaw, chisel, files) \n3.6 Inspection and measuring tools (templates, vernier \ncaliper, micrometer, straight edge, gages, etc…)\n\n--- PDF PAGE 65 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n61 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Organized and cleaned work area according shop \npolicies and environmental requirements. \n2. Resource implications \nThe following resources should be provided: \n2.1 Tools, equipment and facilities appropriate to \nprocesses or activity \n2.2 Materials and documentation relevant to the \nproposed activity \n2.3 Shop policy and/or procedures manual on \nhousekeeping, cleaning and occupational health and \nsafety \n3. Method of assessment \nCompetency in this unit may be assessed through: \n3.1 Direct observation \n3.2 Demonstration or role play \n3.3 Written or oral short answer questions \n3.4 Identify colleagues/clients who can be approached \nfor the collection of competency evidence, where \nappropriate \n4. Context for assessment \n4.1 Competency may be assessed in actual workplace \nor at the designated TESDA Accredited Assessment \nCenter\n\n--- PDF PAGE 66 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n62 \n \nUNIT OF COMPETENCY \n: \nPERFORM SHOP COMPUTATIONS (INTERMEDIATE) \n \nUNIT CODE \n \n: \nMEE722207 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competencies required to perform \ncalculation involving triangles and tapers. \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Perform \ncalculations \ninvolving triangles \n1.1 Problems involving \nright triangles are \nperformed using the \ntrigonometric \nfunctions. \n1.2 Problems involving \nnon-right triangles \nare performed using \nsine and cosine \nrules. \n1.1 \nEnglish and \n1.2 \nmetric system of \n1.3 \nmeasurements \n1.4 \nGeometrical \n1.5 \nshapes \n1.1 Performing \ntrigonometric \nfunction \n \n2. Calculate taper \n2.1 Convert the units of \nthe conical taper so \nthat all units are the \nsame. \n2.2 Visualize a cross \nsection of the cone \nwith the length being \nthe height and the \ndiameter being the \nbase. \n2.3 Taper of work \ncalculated correctly \nusing appropriate \nformula. \n2.1 \nEnglish and \nmetric system of \nmeasurements \n2.2 \nGeometrical \nshapes \n2.1 Calculating taper \nof work\n\n--- PDF PAGE 67 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n63 \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Trigonometric \nfunctions \nMay include: \n1.1 Sine \n1.2 Cosine \n1.3 Tangent \n1.4 Cotangent \n1.5 Secant \n1.6 Cosecant \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Performed calculations involving right triangles, non-\nright triangles and involving tapers \n \n2. Resource implications \nThe following resources should be provided: \n2.1 Tools, equipment and facilities appropriate to \nprocesses or activity \n2.2 Materials relevant to the proposed activity \n \n \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Written or oral short answer questions \n3.2 Practical exercises \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter\n\n--- PDF PAGE 68 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n64 \n \nUNIT OF COMPETENCY : \nMEASURE WORKPIECE USING ANGULAR MEASURING \nINSTRUMENTS \n \nUNIT CODE \n \n: \nMEE722208 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competencies required to measure \nworkpieces using angular measuring instruments. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Select and use \nangular \nmeasuring \ntools \n1.1 Angular measuring \ntools are selected \nand used according \nto the level of \naccuracy required. \n1.2 Measurements \ntaken are accurate to \nthe finest graduation \nof the selected \nmeasuring \ninstrument. \n1.3 Measuring technique \nused is correct and \nappropriate to the \ndevice used. \n \n1.1 Types, purposes and \naccuracy of angular \nmeasuring \ninstruments \n1.2 Capability of \nmeasuring tools \n1.3 Techniques for \nmeasuring angles \nand tapers \n1.1 Selecting angular \nmeasuring tools \n1.2 Obtaining \naccurate \nmeasurements \n1.3 Determining \nmeasuring \ntechniques \n \n2. Maintain \nangular \nmeasuring \ntools \n2.3 Measuring tools are \nadjusted and \nmaintained to the \nrequired accuracy \nutilizing \nmanufacturer’s or \nworksite procedures. \n \n2.1 Types, purposes and \naccuracy of angular \nmeasuring \ninstruments \n2.2 Capability of \nmeasuring tools \n2.3 Techniques for \nmeasuring angles \nand tapers \n \n2.1 Maintaining and \nadjusting \nmeasuring tool \naccuracy \n3. Clean and \nstore \nmeasuring \ntools \n3.1 Care and storage of \ndevices undertaken \nto manufacturer’s \nspecifications or \nstandard operating \nprocedures. \n \n3.3 Types, purposes and \naccuracy of angular \nmeasuring \ninstruments \n3.4 Capability of \nmeasuring tools \n3.5 Techniques for \nmeasuring angles \nand tapers \n3.6 Care and storage \nprocedure of \nmeasuring tools \n \n3.1 Storing and \ncleaning of \nmeasuring tools\n\n--- PDF PAGE 69 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n65 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Angular measuring \n tools \nMay include: \n1.1 Bevel protractor \n1.2 Gage blocks \n1.3 Sine bar \n \n2. Measurements \nMay include: \n2.1 Angle \n2.2 Taper \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Selected and used angular measuring instruments \n1.2 Maintained/adjusted instruments \n1.3 Cleaned and stored measuring instruments \n \n2. Resource implications \nThe following resources should be provided: \n2.1 Tools, equipment and facilities appropriate to the activity \n2.2 Specimen component or part to the proposed activity \n \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Direct observation \n3.2 Demonstration \n3.3 Written or oral short answer questions \n3.4 Portfolio \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 70 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n66 \n \nUNIT OF COMPETENCY \n: \nMEASURE WORKPIECE USING GAGES AND SURFACE \nTEXTURE COMPARATOR \n \nUNIT CODE \n \n: \nMEE722210 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competencies required to measure \nworkpieces using fixed and adjustable gages. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Select and use \nfixed and \nadjustable gages \n1.1 Appropriate gages \nare selected and \nused to undertake \nthe required \ncomparison or \nmeasurement using \nstandard operating \nprocedures. \n1.2 Consistent and \naccurate \nmeasurements \nobtained conforms to \ndrawing specification \n1.3 Measuring technique \nused is correct and \nappropriate to the \ndevice used. \n1.1 Types and \napplication of \nfixed and \nadjustable gages \n1.2 Gage limits and \naccuracy \n1.3 Techniques for \nmeasuring \ncomponents \n1.1 Selecting \nappropriate \ngages and \nmeasuring \ninstrument \n1.2 Obtaining \naccurate \nmeasurements \n1.3 Determining \nmeasuring \ntechniques \n2. Perform surface \ntexture \nmeasurements \n2.1 Surface texture are \nmeasured according \nworksite procedures. \n2.2 Measurements taken \nare within the level of \naccuracy required. \n \n2.1 Types and \napplication of \nfixed and \nadjustable gages \n2.2 Gage limits and \naccuracy \n2.3 Techniques for \nmeasuring \ncomponents \n2.1 Identifying die \nmaterial \nrequirements \n2.2 Determining \nproduction \nvolume \n2.3 Identifying design \nparameters \n3. Clean and store \nmeasuring tools \n3.1 Care and storage of \ndevices undertaken to \nmanufacturer’s \nspecifications or \nstandard operating \nprocedures. \n3.1 Care and storage \nprocedure of \nmeasuring tools \n3.1 Cleaning and \nstoring \nmeasuring tools\n\n--- PDF PAGE 71 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n67 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Gages \nMay include: \n1.1 Gage blocks \n1.2 Telescoping gages \n1.3 Center gages \n1.4 Thread gages \n1.5 Dial bore gages \n1.6 Height gages \n1.7 Radius gages \n1.8 Go-no-go gages \n1.9 Depth gages \n2. Measurements \nMay include: \n2.1 Linear dimensions \n2.2 Diameters \n2.3 Depths \n2.4 Fits \n2.5 Tapers \n2.6 Threads \n2.7 Radius \n2.8 Squareness \n2.9 Surface texture \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Selected and used fixed and adjustable gages \n1.2 Performed surface texture measurements \n1.3 Cleaned and stored measuring instruments \n \n2. Resource implications \nThe following resources should be provided: \n2.1 Tools, equipment and facilities appropriate to the activity \n2.2 Specimen component or part to the proposed activity \n2.3 Drawing \n \n3. Method of assessment \nCompetency in this unit may be assessed through: \n3.1 Direct observation \n3.2 Demonstration \n3.3 Written or oral short answer questions \n3.4 Portfolio \n \n4. Context for assessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 72 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n68 \n \nUNIT OF COMPETENCY \n: \nPERFORM PREVENTIVE AND CORRECTIVE \nMAINTENANCE \n \nUNIT CODE \n \n: \nMEE722211 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge and skills required in \nperforming preventive and corrective maintenance such as \ninspection and repair of hand tools, cleaning and lubrication \nof machine parts and changing drive pulley and belts. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Perform \ninspection of \nmachine \n \n1.1 Machine inspected \naccording to worksite \nprocedures. \n1.2 Status/Report \nrecorded on proforma \nor reported orally \naccording to worksite \nprocedure. \n \n1.1 Proper cleaning \nand oiling \n1.2 Parts and function \nof machine tools \n1.3 Cutting oil, coolant \nor compound \n1.4 Pulleys and belts \n1.5 Location of main \nswitches of the \nmachine \n1.6 Checklist of safe \nworking conditions \n1.1 Inspecting \nmachine \n1.2 Recording status \nreport \n2. Perform surface \ntexture \nmeasurements \n2.1 Machines lubricated \nas per manufacturer’s \nrecommendation using\ntools and materials \n2.2 Fluids and lubricants