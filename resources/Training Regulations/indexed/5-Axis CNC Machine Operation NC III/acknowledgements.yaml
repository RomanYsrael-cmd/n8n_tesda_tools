etency \nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods \nNominal \nDuration \n1. Write 5-axis CNC \nmachine program \n1.1 Determine job \nrequirements \n• Explain and interpret drawing \nsymbols \n• Explain 5 axis machining \noperation \n• Identify and explain types of \ncutting tool \n• Calculation of feeds and \nspeeds \n• Identify tools and measuring \ninstruments \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning \n \n108 hours \n1.2 Write 5-axis CNC \nmachine program \n• Explain and identify types of \nsoftware \n• Explain conversational \nprogramming \n• Explain ISO CNC \nprogramming \n \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning \n1.3 Edit 5-axis CNC program • Explain editing of program \n• Perform simulation \n• Explain procedure in saving \nprogram to the machine \n• Explain of downloading of \nprogram to machine directory \n \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning\n\n--- PDF PAGE 119 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n115 \n \nUnit of Competency \nLearning Outcomes \nLearning Activities \nMethodologies \n• Assessment \nMethods \nNominal \nDuration \n2. Set up 5-axis CNC \nmachine, cutting \ntools and workpiece \n \n2.1 Set-up machine \n \n• Explain types of oil and \ncoolant \n• Explain the standard working \nair and hydraulic pressure \n• Explain and perform setting of \nmachine zero point \n• Identify types of work holding \ndevices \n• Demonstrate how to power up \nmachine. \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning \n \n24 hours \n2.2 Set-up cutting tools \n \n• \nIdentify and select types of \ncutting tools \n• \nPerform mounting of cutting \ntools to the holder \n• \nPerform and explain set-up \nof cutting tools to required \nreference length \n• \nExplain and perform \ndesignated tool assignment \n \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning \n \n2.3 Set-up workpiece \n \n• \nExplain procedures in \nmounting work piece to \nfixture \n• \nExplain and identify types of \nmeasuring tools and \nequipments \n• \nExplain and perform datum \nreferences \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning\n\n--- PDF PAGE 120 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n116 \n \nUnit of Competency \nLearning Outcomes \nLearning Activities \nMethodologies \n• Assessment \nMethods \nNominal \nDuration \n3. Perform 5-axis CNC \nmachine operations \n \n3.1 Machine workpiece \n• \nExplain closing of machine \nguard before starting the \nmachine \n• \nExplain the importance of \nmachine dry run \n• \nExplain editing of tool path \n• \nExplain types of tolerancing \n,kinds of fitting in CNC \nmachining operation \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning \n \n100 hours \n3.2 Monitor machine and tool \nmovements \n• \nMonitoring of parameters \n• \nExplain the importance of \nmaintaining the working air \npressure level \n• \nExplain the importance of \ncooling system \n• \nExplain the importance of \nsharpness of tools \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning \n \n3.3 Check and measure \nwork piece \n \n \n \n• \nPerform open and closing of \nmachine door \n• \nPerform procedure of de \nburring work piece \n• \nExplain and perform \ninspection and measurement \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning\n\n--- PDF PAGE 121 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n117 \n \nUnit of Competency \nLearning Outcomes \nLearning Activities \nMethodologies \n• Assessment \nMethods \nNominal \nDuration \n4. Perform post 5-axis \nCNC machine \noperations \n4.1 Conduct post CNC \noperation \n• Perform and explain loading \nand unloading of workpiece \n• Perform de burring operation \n• Perform and explain final \ninspection of workpiece \n \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning \n \n40 hours \n \n4.2 Documentation of \nmachined workpiece \n• Explain the importance of \nsigning out the operation \nsheet \n• Explain the process and \nimportance of accomplishing \nreport \n• Submission of workpiece and \nreport \n \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning \n \n \n \n4.3 CNC machine shutdown \nand house keeping \n• Explain the procedure of \nshutting off of electrical \npneumatic and hydraulic \nswitches \n• Explain proper maintenance \nand storing of tools \n• Explain importance of tagging \nand reporting of defective \ntools \n• Explain and perform 5S \n• Explain and perform proper \ndisposal of industrial wastes \n \n \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning\n\n--- PDF PAGE 122 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n118 \n \n \n3.2 \nTRAINING DELIVERY \n \n \n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall \nbe guided by the principles of competency-based TVET. \n \na. Course design is based on competency standards set by the industry or recognized \nindustry sector; (Learning system is driven by competencies written to industry \nstandards) \n \nb. Training delivery is learner-centered and should accommodate individualized and \nself-paced learning strategies; \n \nc. Training can be done on an actual workplace setting, simulation of a workplace and/or \nthrough adoption of modern technology. \n \nd. Assessment is based in the collection of evidence of the performance of work to the \nindustry required standards; \n \ne. Assessment of competency takes the trainee’s knowledge and attitude into account \nbut requires evidence of actual performance of the competency as the primary source \nof evidence. \n \nf. Training program allows for recognition of prior learning (RPL) or current \ncompetencies; \n \ng. Training completion is based on satisfactory performance of all specified \ncompetencies. \n \n2. The competency-based TVET system recognizes various types of delivery modes, \nboth on-and off-the-job as long as the learning is driven by the competency standards \nspecified by the industry. The following training modalities and their \nvariations/components may be adopted singly or in combination with other modalities \nwhen designing and delivering training programs: \n \n2.1 Institution- Based: \n \n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain \nboth in-school and in-industry training or fieldwork components. Details can be \nreferred to the Implementing Rules and Regulations of the DTS Law and the \nTESDA Guidelines on the DTP; \n \n• Distance learning is a formal education process in which majority of the \ninstruction occurs when the students and instructor are not in the same place. \nDistance learning may employ correspondence study, audio, video, computer \ntechnologies or other modern technology that can be used to facilitate learning \nand formal and non-formal training. Specific guidelines on this mode shall be \nissued by the TESDA Secretariat.\n\n--- PDF PAGE 123 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n119 \n \n \n• The classroom-based or in-center instruction uses of learner-centered methods \nas well as laboratory or field-work components. \n \n2.2 Enterprise-Based: \n \n• Formal Apprenticeship – Training within employment involving a contract \nbetween an apprentice and an enterprise on an approved apprenticeable \noccupation. \n \n• Informal Apprenticeship - is based on a training (and working) agreement \nbetween an apprentice and a master craftsperson wherein the agreement may \nbe written or oral and the master craftsperson commits to training the apprentice \nin all the skills relevant to his or her trade over a significant period of time, usually \nbetween one and four years, while the apprentice commits to contributing \nproductively to the work of the business. Training is integrated into the \nproduction process and apprentices learn by working alongside the experienced \ncraftsperson. \n \n• Enterprise-based Training- where training is implemented within the company in \naccordance with the requirements of the specific company. Specific guidelines \non this mode shall be issued by the TESDA Secretariat. \n \n2.3 Community-Based – Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other TVET \nproviders which are intended to address the specific needs of a community. Such \nprograms can be conducted in informal settings such as barangay hall, basketball \ncourts, etc. These programs can also be mobile training program (MTP).\n\n--- PDF PAGE 124 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n120 \n \n3.3 TRAINEE ENTRY REQUIREMENTS \n \nTrainees or students who wish to enter this training should possess the following \nrequirements: \n \n• Holder of any certificate of competency in Machining NC I or 1-Year industry \nexperience in Machining \n• Must have completed the 10-year basic education or an Alternative Learning System \n(ALS) Certificate of Completion with grade 10 equivalent holder \n• Must have competence in CNC Lathe Machine and CNC Milling Machine Operation \nacquired through training or work experience or certification \n• Can communicate orally and or in writing \n• Can perform basic mathematical computation \n \n \n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS \n \nRecommended list of tools, equipment and materials for the training of 20 trainees for \n5-axis CNC machine operation NC III: \n \nEQUIPMENT \nQTY \nDescription \nQTY \nDescription \n1 unit \n5 axis CNC machine, Spindle \nspeed 16,00 rpm, spindle motor \noutput 26 kw, x and y axes travel \n900 mm z axis 660 mm or 5 axis \nCNC training machine \n1 unit \nOverhead/LCD Projector \n1 unit \nPower Hack saw, 230 watts/ 220 \nvolts, single phase \n1 set \nTable with drawer and chair \n1 unit \nAir Compressor, 5HP with dryer \n1 unit \nPrecision vise \n1 unit \nAir Conditioner, 3 tons capacity \n \n \nSUPPLIES AND MATERIALS \nQTY \nDescription \nQTY \nDescription \nQTY \nDescription \n25pcs \n150 grit sandpaper \n25 \npcs \n800 grit sandpaper \n25pcs \n250 grit sandpaper \n20 \npcs. \n \n \nAluminum dia 30mm \nx100mm \n20 \npcs. \nAluminum Plate \n50mm x 50mm x \n50mm \n200 \nliters \nWater base soluble \ncoolant \n5 pcs. Right hand tool \nholder \n5 pcs. Paint brush 50mm \nwidth \n5 kgs. \nRags \n1 box \nRight hand carbide \ninsert \n2 pcs. Left hand tool holder \n2 pcs. \nNeutral tool holder \n5 pcs. #3 center drill \n1 box \nLeft hand carbide \ninserts \n1 box \nNeutral carbide \ninserts \n1 set \nDrill bits, Dia.1/8” –\nDia 1/2” \n5 pcs. #2 center drill \n1 set \nDrill bits, Dia. 1mm \n– Dia. 12mm \n \n \n1 pair \nMagnetic v-block\n\n--- PDF PAGE 125 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n121 \n \n \n \n \nTRAINING MATERIALS \nQTY \nDescription \nQTY \nDescription \n \nManual \n \n \n \nReference books \n \n \n \nBrochures \n \n \n \n \nTOOLS \n \n \n \n \n \nQTY \nDescription \nQTY \nDescription \nQTY \nDESCRIPTION \n1 set \nCombination wrench \nSize 6mm to 21mm \n2 sets \n6” Needle file \n \n \n2 pcs. \nMachine tap, M8 x 1.75 \nmm \n1 pc \nGranite surface \nplate 5