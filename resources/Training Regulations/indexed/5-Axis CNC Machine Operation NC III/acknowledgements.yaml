      "source_text": "UNIT CODE : 400311323"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes"
    },
    {
      "source_text": "required to assess general obstacles in the application"
    },
    {
      "source_text": "of learning and innovation in the organization and to"
    },
