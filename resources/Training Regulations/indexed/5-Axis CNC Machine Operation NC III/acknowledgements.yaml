      "source_text": "4.1 English and metric system of measurement"
    },
    {
      "source_text": "4.1 Performing calculation 5. Perform calculations on algebraic expressions 5.1 Simple calculations are performed on algebraic expressions using the four fundamental operations. 5.2 Simple transposition of formulae is carried out to isolate the variable required, involving the four fundamental operations."
    },
