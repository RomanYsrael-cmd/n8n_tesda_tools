icating hand \n tools\n\n--- PDF PAGE 74 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n70 \n \nEVIDENCE GUIDE \n \n \n1. Critical aspects of \n competency \nAssessment requires evidence that the candidate: \n1.1 Performed inspection of machine \n1.2 Performed cleaning and lubricating of machine \n1.3 Performed minor machine repairs and adjustments \n \n2. Resource Implications \nThe following resources should be provided: \n2.1 Tools, equipment and facilities appropriate to \nprocesses or activity \n2.2 Materials relevant to the proposed activity \n \n3. Method of Assessment \nCompetency in this unit may be assessed through: \n3.1 Direct observation of activities \n3.2 Oral or written questioning \n \n4. Context for Assessment \n4.1 Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter\n\n--- PDF PAGE 75 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n71 \n \nUNIT OF COMPETENCY \n: \nOPERATE A PERSONAL COMPUTER \n \nUNIT CODE \n \n: \nICT311201 \n \nUNIT DESCRIPTOR \n: \nThis unit defines the competency required to operate a \npersonal computer by: starting the PC, logging in, using and \nworking with files, folders and programs, saving work, and \nclosing down the PC. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Start the computer \n \n1.1 The peripheral \ndevices are properly \nconnected \n1.2 Power is checked \nand the computer \nand peripheral \ndevices are switched \non \n1.3 Proper logging in and \nlogging off is \nsuccessfully done \n1.4 The operating \nsystem features and \nfunctions are \naccessed and \n1.5 Navigated Hardware \nconfiguration and \nother system \nfeatures are checked \n1.1 Computer \nfunctions \n1.2 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n1.3 Keyboard layout \nand functions \n \n \n1.1 Connecting \nperipheral \ndevices \n1.2 Logging in and \nlogging off \nproperly \n \n2. Arrange and \ncustomize desktop \ndisplay/ Windows \nsettings \n2.1 The desktop screen or \nWindows elements are\nchanged as needed \n2.2 Desktop icons are \nadded, renamed, \nmoved, copied or \ndeleted \n2.3 The online help \nfunctions are \naccessed or used as \nneeded \n2.4 Desktop icons of \napplication programs \nare selected, opened \nand closed \n2.5 Properties of icons are \ndisplayed \n2.6 Computer or desktop \nsettings are saved and \nrestored \n \n \n2.1 Keyboard layout \nand functions \n2.2 Computer \nfunctions \n2.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n2.4 Storage devices \nand file concepts \n2.5 Basic software \noperation and \nfunctionalities \n2.1 Changing \ndesktop screen \nor windows \nelement \n2.2 Adding, \nrenaming, \nmoving, copying \nand deleting \ndesk top icon \n2.3 Accessing online \nhelp function \n2.4 Opening and \nclosing desk top \nicons \n2.5 Displaying \nproperties of \nicons\n\n--- PDF PAGE 76 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n72 \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Work with files and \nfolders (or \ndirectories \n3.1 A file or folder is \ncreated, opened, \nmoved, renamed or \ncopied \n3.2 Files are located, \ndeleted and restored \n3.3 Details and properties \nof files and folders \nare displayed or \nviewed \n3.4 Various files are \norganized for easy \nlookup and use \n3.5 Files and information \nare searched \n3.6 Disks are checked, \nerased or formatted \nas necessary \n3.1 Keyboard layout \nand functions \n3.2 Computer \nfunctions \n3.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n3.4 Storage devices \nand file concepts \n3.5 Basic software \noperation and \nfunctionalities \n3.1 Creating, \nopening, moving, \nrenaming and \ncopying a file and \nfolder \n3.2 Locating, deleting \nand restoring \nfiles \n3.3 Displaying details \nand properties of \nfiles and folders \n3.4 Organizing files \n3.5 Searching file \nand information \n4. Work with user \napplication \nprograms \n4.1 Application programs \nare added, changed, \nremoved or ran \n4.2 User software or \napplication program \nare installed, updated \nand upgraded \n4.3 Information/data are \nmoved between \ndocuments or files \n4.1 Keyboard layout \nand functions \n4.2 Computer \nfunctions \n4.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n4.4 Storage devices \nand file concepts \n4.5 Basic software \noperation and \nfunctionalities \n4.1 Checking \nhardware \nconfiguration and \nother system \nfeatured \n4.2 Installing, \nupdating and \nupgrading user \nsoftware or \napplication \nprogram \n \n5. Print information \n5.1 Printer is added or \ninstalled and correct \nprinter settings is \nensured \n5.2 Default printer is \nassigned accordingly \n5.3 Information or \ndocument is printed \non the installed \nprinter \n5.4 Progress of print jobs \nare viewed and \ndeleted as required \n5.1 Keyboard layout \nand functions \n5.2 Computer \nfunctions \n5.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n5.4 Storage devices \nand file concepts \n5.5 Basic software \noperation and \nfunctionalities \n5.1 Installing printer \nsettings \n5.2 Printing \ninformation or \ndocument\n\n--- PDF PAGE 77 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n73 \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n6. Shut down \ncomputer \n6.1 All open application \nprograms are closed \n6.2 Computer and \nperipheral devices \nare properly shut \ndown \n6.1 Keyboard layout \nand functions \n6.2 Computer \nfunctions \n6.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n6.4 Storage devices \nand file concepts \n6.5 Basic software \noperation and \nfunctionalities \n \n6.1 Shutting down \ncomputer and \nperipheral \ndevices\n\n--- PDF PAGE 78 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n74 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Peripheral device \nMay include: \n1.1 \nMouse \n1.2 \nKeyboard \n1.3 \nMonitor or visual display unit \n1.4 \nPrinter \n1.5 \nScanner \n2. Computer \nMay include: \n2.1 \nLaptops/notebooks \n2.2 \nWorkstations \n2.3 \nServers \n2.4 \nother personal computer devices \n3. Application programs \nMay include: \n3.1 \nUser programs \n3.2 \nDatabase programs \n3.3 \nWord processors \n3.4 \nEmail programs \n3.5 \nInternet browsers \n3.6 \nSystem browsers \n3.7 \nSpreadsheets \n4. Operating system \nMay include: \n4.1 \nWindows \n4.2 \nNT \n4.3 \nMac OS \n4.4 \nLinux \n4.5 \nSolaris \n4.6 \nUnix \n5. System features \nMay include: \n5.1 \nMemory size \n5.2 \nDisk capacities \n5.3 \nVideo cards \n5.4 \nUsbs \n5.5 \nModems \n5.6 \n1394 and lan connectors \n5.7 \nSd and pc cards \n5.8 \nWireless and infrared connections. \n6. Online help functions \nMay include: \n6.1 An instruction manual, or a portion of the manual, \nintegrated and accessible from within the program or \nsoftware being used\n\n--- PDF PAGE 79 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n75 \n \nVARIABLE \nRANGE \n7. Properties \nMay include: \n7.1 \nFile name \n7.2 \nType of file \n7.3 \nFile size \n7.4 \nDate created and modified \n7.5 \nAttributes (hidden, read-only). \n8. Various files \nMay include: \n8.1 \nDocuments \n8.2 \nRecords \n8.3 \nPictures \n8.4 \nMusic \n8.5 \nVideo \n9. Disks \nMay include: \n9.1 \nFloppy disks \n9.2 \nCDs \n9.3 \nCD-RW (Compact discs-Read/Write) \n9.4 \nDVD RW \n9.5 \nzip disks \n9.6 \nflash drives \n9.7 \nmemory sticks \n9.8 \nhard drives \n10. Printer settings \nMay include: \n10.1 Page layout \n10.2 Paper size \n10.3 ink/cartridge type \n10.4 Number of copies \n10.5 Page orientation.\n\n--- PDF PAGE 80 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n76 \n \n EVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Ability to utilize software, navigate the desktop, using \nsystem features to perform tasks and save results of \nwork. \n2. Resource Implications \nThe following resources should be provided: \n2.1 A personal computer \n2.2 A printer \n2.3 Mouse and keyboard \n2.4 Basic systems software \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Observation in a workplace or simulated environment \n3.2 Third party reports \n3.3 Exams and tests \n3.4 Demonstration of required skills \n3.5 Interviews \n4. Context for Assessment \n4.1 Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter\n\n--- PDF PAGE 81 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n77 \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n: WRITE 5-AXIS CNC MACHINE PROGRAM \n \nUNIT CODE : \nMEE821321 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge and skills required to \n write 5-axis CNC program based on drawing specifications.\n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Determine job \nrequirements \n1.1 Drawings are \ninterpreted to produce \ncomponent according \nto specifications. \n1.2 Sequence of CNC \nmachining \noperations (tool \npathing) are \ndetermined to produce \ncomponent according \nto industry standard \n 1.3 Cutting tools are \nselected according to \nthe requirements of \nthe operations \n 1.4 Cutting speed and \nfeed rate are \ncalculated based on \ncutting tools and work \npiece specifications. \n1.5 Process / operation \nsheets are filled up \nwith relevant machine, \nwork piece, fixture, \ntools and measuring \ninstruments to be \nused. \n1.6 Safety practices are \napplied according to \nOSHS. \n \n1.1 3D Drafting \n1.2 3D Machining \n1.3 Technical \ndrawing \n1.4 Application of \nlimits, fits, \ntolerances and \nsurface texture \n1.5 Sequence of \noperation \n1.6 Different types \nof cutting tools \n1.7 Calculation of \nspeed and \nfeed rate \n1.8 Procedure in \nfilling up job \nsheets \n1.9 Appropriate \nFixtures \n1.10 OSH Rule No. \n1080 – \nPersonal \nProtective \nEquipment & \nDevices \n1.11 OSH Rule No. \n1150 – \nMaterials \nHandling & \nStorage \n1.12 Air pollution \n1.13 Noise pollution \n Quality control \n1.1 Interpreting 3D \ndrawing. \n1.2 Determining of \nsequence of \noperation \n1.3 Selecting cutting \ntools \n1.4 Calculating cutting \nspeed and feed. \n1.5 Filling up job \nsheets \n1.6 Applying safety \nprocedures\n\n--- PDF PAGE 82 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n78 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Write 5-axis CNC \nmachine program \n \n2.1 Sequence of \nprograms are \ngenerated using \nmanual \nprograming (G-\ncodes /M-codes) \nand automatic \nprogramming \nusing software \naccording to \nstandard \noperating \nprocedure \n2.2 Conversational or \nISO CNC \nprogramming \noperations are \nused based on \nmachine \ncapability. \n2.3 Safety practices \nare applied \naccording to \nOSHS. \n \n2.1 Generation of \n manual and \n automatic \n programming. \n2.2 Procedure in \n writing \nconversational \n or ISO \n CNC \n programming \n language \n2.3 OSH Rule No. 1080 \n– Personal \nProtective \nEquipment & \nDevices \n2.4 OSH Rule No. 1150 \n– Materials Handling \n& Storage \n2.5 Air pollution \n2.5 Noise pollution \n2.7 Quality control \n \n2.1 Generating \nmanual and \nautomatic program \n2.2 Writing \nconversational or \nISO CNC program \n2.3 Applying safety \nprocedures \n3. Edit 5-axis CNC \nprogram \n 3.1 Program is \nsimulated and \nedited if required \naccording to \nstandard \noperating \nprocedures \n3.2 Program is saved \nto the machine \nfile according to \nstandard \noperating \nprocedures \n3.3 \nProven program \nis copied and \nsaved to backup \nprogram files \naccording to \nstandard \noperating \nprocedures. \n 3.4 Safety practices \nare applied \naccording to \nOSHS \n \n3.1 Procedure in \nsimulation and \nediting of tool \nmovement \n3.2 Procedure in saving \nfiles to the machine \n3.3 Procedure in \ncopying saved \nproven program on \nseparate folders or \nfiles \n3.4 Occupational \n3.5 safety and \n3.6 health practice \n3.7 OSH Rule No. 1070 \n– Occupational \nHealth & \nEnvironmental \nControl \n3.8 OSH Rule No. 1080 \n– Personal \nProtective \nEquipment & \nDevices Air pollution \n3.9 Noise pollution \n \n3.1 Simulating and \nediting tool \nmovement \n3.2 Saving program in \nmachine files \n3.3 Copying proven \nprogram \n3.4 Applying safety \nprocedures\n\n--- PDF PAGE 83 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n79 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Drawing \n May include: \n1.1 Dimensions and symbols \n1.2 Geometric dimensioning and tolerancing \n1.3 Limits, fits, tolerances and surface texture \n2. CNC machining operation \nMay include: \n2.1 Point machining unit/C-axis point machining unit \n 2.1.1 Right hand counter boring (RGH CBOR) \n machining \n 2.1.2 Right hand back boring (RGH BCB) \n machining \n 2.1.3 Reaming \n 2.1.4 Tapping \n 2.1.5 Boring \n 2.1.6 Back boring \n 2.1.7 Circular milling \n 2.1.8 Counter bore-tapping \n 2.1.9 Boring of through hole \n 2.1.10 Boring of step through hole \n 2.1.11 Boring of non-through hole \n \n2.2 Line machining unit/C-axis line machining \n unit \n 2.2.1 Central linear machining \n 2.2.2 Right-hand linear machining \n 2.2.3 Left-hand linear machining \n 2.2.4 Outside linear machining \n