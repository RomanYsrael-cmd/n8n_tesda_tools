    {
      "source_text": "VARIABLE RANGE 1. Business strategies May include: 1.1. Developing/Maintaining niche market 1.2. Use of organic/healthy ingredients 1.3. Environment-friendly and sustainable practices 1.4. Offering both affordable and high-quality products and services 1.5. Promotion and marketing strategies (e. g., on-line marketing) 2. Business operations May include: 2.1 Purchasing 2.2 Accounting/Administrative work 2.3 Production/Operations/Sales 3. Internal controls May include: 3.1 Accounting systems 3.2 Financial statements/reports 3.3 Cash management"
