    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 2. Generate practical action plans for improving work procedures, processes 2.1 Ideas for innovative work procedure to foster innovation using individual and group techniques are conceptualized 2.2 Range of ideas with other team members and colleagues are evaluated and discussed 2.3 Work procedures and processes subject to change are selected based on workplace requirements (feasible and innovative). 2.4 Practical action plans are proposed to facilitate simple changes in the work procedures, processes and systems. 2.5 Critical inquiry is applied and used to facilitate discourse on adjustments in the simple work procedures, processes and systems. 2.1 Seven habits of highly effective people. 2.2 Character strengths that foster innovation and learning (Christopher Peterson and Martin Seligman, 2004) 2.3 Five minds of the future concepts (Gardner, 2007). 2.4 Adaptation concepts in neuroscience (Merzenich, 2013). 2.5 Transtheoretical model of behavior change (Prochaska, DiClemente, & Norcross, 1992). 2.1 Assessing readiness for change on simple work procedures, processes and systems. 2.2 Generating insights on how to improve organizational procedures, processes and systems through innovation. 2.3 Facilitating action plans on how to apply innovative procedures in the organization."
    },
    {
      "source_text": "-- PDF PAGE 28 --- 5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019)"
    },
    {
      "source_text": "24"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 3. Evaluate the effectiveness of the proposed action plans 3.1 Work structure is analyzed to identify the impact of the new work procedures 3.2 Co-workers/key personnel is consulted to know who will be involved with or affected by the work procedure 3.3 Work instruction operational plan of the new work procedure is developed and evaluated. 3.4 Feedback and suggestion are recorded. 3.5 Operational plan is updated. 3.6 Results and impact on the developed work instructions are reviewed 3.7 Results of the new work procedure are evaluated 3.8 Adjustments are recommended based on results gathered 3.1 Five minds of the future concepts (Gardner, 2007). 3.2 Adaptation concepts in neuroscience (Merzenich, 2013). 3.3 Transtheoretical model of behavior change (Prochaska, DiClemente, & Norcross, 1992). 3.1 Generating insights on how to improve organizational procedures, processes and systems through innovation. 3.2 Facilitating action plans on how to apply innovative procedures in the organization. 3.3 Communicating results of the evaluation of the proposed and implemented changes in the workplace procedures and systems. 3.4 Developing action plans for continuous improvement on the basic systems, processes and procedures in the organization."
    },
