      "source_text": "GLOSSARY OF TERMS"
    },
    {
      "source_text": "1. 5-axis CNC (Computerized Numerical Control) Machine"
    },
    {
      "source_text": "The automation of machine tools that are operated by precisely programmed commands encoded on a storage medium, as opposed to controlled manually via hand wheels or levers 2. Machine coordinate system A point of reference in this system of coordinates is known as machine zero-point"
    },
    {
      "source_text": "3. Work piece coordinate system A system of coordinates taking this point as reference is called the work piece coordinates system"
    },
    {
      "source_text": "4. Machine Zero The position located at the farthest possible distance in a positive direction along the X-, Y-, and Z-axes. This position is permanently set for each particular CNC machine"
    },
    {
      "source_text": "5. Micrometer A hand-held measuring device used to inspect the dimensions of parts. Thy typical micrometer is accurate within 0.001 in. or 0.02 mm"
    },
    {
      "source_text": "6. Mode A machine state that determines the way it executes manual and automatic commands"
    },
    {
      "source_text": "7. Optional Stop A code that pauses the program if the appropriate switch is selected on the machine. Optional Stop allows the operator to inspect the machine between operations"
    },
    {
      "source_text": "8. Override A control that adjusts a programmed speed or feed rate by a certain percentage during operation"
    },
    {
      "source_text": "9. Part Program A series of numerical instructions used by a CNC machine to perform the necessary sequence of operations to machine a specific work piece"
    },
    {
      "source_text": "10. Part Programmer The person responsible for the creation of a part program. The part programmer translates the work piece design into program instructions for the CNC machine"
    },
    {
      "source_text": "11. Proving Out Running a program one block at a time in order to check for accuracy and proper tool set-up"
    },
    {
      "source_text": "12. Cycle Start The control used to begin a program or continue a program that has been previously stopped"
    },
    {
      "source_text": "13. Cycle Stop The control used to pause a program. Cycle Stop pauses tool feed but does not stop spindle movement"
    },
    {
      "source_text": "-- PDF PAGE 136 --- 5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019)"
    },
    {
      "source_text": "132"
    },
    {
      "source_text": "14. Dry Running Performing a trial run of the part program without any parts or cutting fluids to check the program"
    },
    {
      "source_text": "15. Edit Mode The mode that allows an operator an operator to make changes to a part program and store those changes"
    },
    {
      "source_text": "16. Emergency Stop The control that automatically shuts down all machine functions"
    },
    {
      "source_text": "17. Feed rate Override An override that allows the operator to adjust the feed rate of the tool during operation. The override functions as a percentage of the programmed value"
    },
    {
      "source_text": "18. Handle Mode The mode that allows for the manual operation of tool movement via the hand wheel. Some machines may have a combined handle/jog mode"
    },
    {
      "source_text": "19. Rapid Feed Rate Override An override that allows the operator to reduce the rate of rapid tool movement during operation. A rapid override may be 25% of the original rate or less"
    },
    {
      "source_text": "20. Rapid Mode The mode that allows for the manual movement of machine components at high rates of travel"
    },
    {
      "source_text": "21. Tolerance The unwanted but acceptable deviation from a desired dimension"
    },
    {
      "source_text": "22. Tool Offset A stored value that compensates for variations in tool length. Each tool requires an offset, which is measured from the turret or spindle position"
    },
    {
      "source_text": "23. Zero return The control that automatically locates the turret or spindle in the machine zero position"
    },
    {
