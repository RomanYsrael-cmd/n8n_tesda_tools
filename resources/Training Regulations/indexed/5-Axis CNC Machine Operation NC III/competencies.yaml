top, using \nsystem features to perform tasks and save results of \nwork. \n2. Resource Implications \nThe following resources should be provided: \n2.1 A personal computer \n2.2 A printer \n2.3 Mouse and keyboard \n2.4 Basic systems software \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Observation in a workplace or simulated environment \n3.2 Third party reports \n3.3 Exams and tests \n3.4 Demonstration of required skills \n3.5 Interviews \n4. Context for Assessment \n4.1 Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter\n\n--- PDF PAGE 81 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n77 \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n: WRITE 5-AXIS CNC MACHINE PROGRAM \n \nUNIT CODE : \nMEE821321 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge and skills required to \n write 5-axis CNC program based on drawing specifications.\n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Determine job \nrequirements \n1.1 Drawings are \ninterpreted to produce \ncomponent according \nto specifications. \n1.2 Sequence of CNC \nmachining \noperations (tool \npathing) are \ndetermined to produce \ncomponent according \nto industry standard \n 1.3 Cutting tools are \nselected according to \nthe requirements of \nthe operations \n 1.4 Cutting speed and \nfeed rate are \ncalculated based on \ncutting tools and work \npiece specifications. \n1.5 Process / operation \nsheets are filled up \nwith relevant machine, \nwork piece, fixture, \ntools and measuring \ninstruments to be \nused. \n1.6 Safety practices are \napplied according to \nOSHS. \n \n1.1 3D Drafting \n1.2 3D Machining \n1.3 Technical \ndrawing \n1.4 Application of \nlimits, fits, \ntolerances and \nsurface texture \n1.5 Sequence of \noperation \n1.6 Different types \nof cutting tools \n1.7 Calculation of \nspeed and \nfeed rate \n1.8 Procedure in \nfilling up job \nsheets \n1.9 Appropriate \nFixtures \n1.10 OSH Rule No. \n1080 – \nPersonal \nProtective \nEquipment & \nDevices \n1.11 OSH Rule No. \n1150 – \nMaterials \nHandling & \nStorage \n1.12 Air pollution \n1.13 Noise pollution \n Quality control \n1.1 Interpreting 3D \ndrawing. \n1.2 Determining of \nsequence of \noperation \n1.3 Selecting cutting \ntools \n1.4 Calculating cutting \nspeed and feed. \n1.5 Filling up job \nsheets \n1.6 Applying safety \nprocedures\n\n--- PDF PAGE 82 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n78 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Write 5-axis CNC \nmachine program \n \n2.1 Sequence of \nprograms are \ngenerated using \nmanual \nprograming (G-\ncodes /M-codes) \nand automatic \nprogramming \nusing software \naccording to \nstandard \noperating \nprocedure \n2.2 Conversational or \nISO CNC \nprogramming \noperations are \nused based on \nmachine \ncapability. \n2.3 Safety practices \nare applied \naccording to \nOSHS. \n \n2.1 Generation of \n manual and \n automatic \n programming. \n2.2 Procedure in \n writing \nconversational \n or ISO \n CNC \n programming \n language \n2.3 OSH Rule No. 1080 \n– Personal \nProtective \nEquipment & \nDevices \n2.4 OSH Rule No. 1150 \n– Materials Handling \n& Storage \n2.5 Air pollution \n2.5 Noise pollution \n2.7 Quality control \n \n2.1 Generating \nmanual and \nautomatic program \n2.2 Writing \nconversational or \nISO CNC program \n2.3 Applying safety \nprocedures \n3. Edit 5-axis CNC \nprogram \n 3.1 Program is \nsimulated and \nedited if required \naccording to \nstandard \noperating \nprocedures \n3.2 Program is saved \nto the machine \nfile according to \nstandard \noperating \nprocedures \n3.3 \nProven program \nis copied and \nsaved to backup \nprogram files \naccording to \nstandard \noperating \nprocedures. \n 3.4 Safety practices \nare applied \naccording to \nOSHS \n \n3.1 Procedure in \nsimulation and \nediting of tool \nmovement \n3.2 Procedure in saving \nfiles to the machine \n3.3 Procedure in \ncopying saved \nproven program on \nseparate folders or \nfiles \n3.4 Occupational \n3.5 safety and \n3.6 health practice \n3.7 OSH Rule No. 1070 \n– Occupational \nHealth & \nEnvironmental \nControl \n3.8 OSH Rule No. 1080 \n– Personal \nProtective \nEquipment & \nDevices Air pollution \n3.9 Noise pollution \n \n3.1 Simulating and \nediting tool \nmovement \n3.2 Saving program in \nmachine files \n3.3 Copying proven \nprogram \n3.4 Applying safety \nprocedures\n\n--- PDF PAGE 83 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n79 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Drawing \n May include: \n1.1 Dimensions and symbols \n1.2 Geometric dimensioning and tolerancing \n1.3 Limits, fits, tolerances and surface texture \n2. CNC machining operation \nMay include: \n2.1 Point machining unit/C-axis point machining unit \n 2.1.1 Right hand counter boring (RGH CBOR) \n machining \n 2.1.2 Right hand back boring (RGH BCB) \n machining \n 2.1.3 Reaming \n 2.1.4 Tapping \n 2.1.5 Boring \n 2.1.6 Back boring \n 2.1.7 Circular milling \n 2.1.8 Counter bore-tapping \n 2.1.9 Boring of through hole \n 2.1.10 Boring of step through hole \n 2.1.11 Boring of non-through hole \n \n2.2 Line machining unit/C-axis line machining \n unit \n 2.2.1 Central linear machining \n 2.2.2 Right-hand linear machining \n 2.2.3 Left-hand linear machining \n 2.2.4 Outside linear machining \n 2.2.5 Inside linear machining \n 2.2.6 Right-hand chamfering \n 2.2.7 Left-hand chamfering \n 2.2.8 Outside chamfering \n 2.2.9 Inside chamfering \n 2.2.10 Face milling \n 2.2.11 End milling-top \n 2.2.12 End milling-step \n 2.2.13 Pocket milling \n 2.2.14 Pocket milling-mountain \n 2.2.15 Pocket milling-valley \n 2.2.16 End milling-slot \n2.2.17 3-D \n \n2.3Turning unit \n2.3.1 Bar-materials machining \n2.3.2 Copy-machining \n2.3.3 Corner-machining \n2.3.4 Edge-machining\n\n--- PDF PAGE 84 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n80 \n \nVARIABLE \nRANGE \n \n2.3.5 Threading \n2.3.6 Grooving \n2.3.7 Turning drilling \n2.3.8 Turning tapping \n2.3.9 Mill-turning \n3. Cutting tools \n \nMay include: \n3.1 Center drill \n3.2 Drill \n3.3 End mill \n3.4 Gun drill \n3.5 T slot cutter \n3.6 Dovetail cutter \n3.7 Form cutter \n3.8 Tap \n3.9 Inserts \n3.10 Face mill \n3.11 Bits \n4. Cutting speed and feed \nrate \nMay include: \n4.1Revolution per minute (RPM) \n4.2 Feed rate in inch per minute (IPM) \n4.3 Feed rate in millimeter per minute (MPM) \n5. Workpiece \nMay include: \n5.1 Aluminum \n5.2 Stainless steel \n5.3 High carbon steel \n5.4 Copper \n5.5 Brass \n5.6 HSS \n5.7 Mild steel(CRS) \n6. Tools and measuring \ninstruments \nMay include: \n6.1 Combination wrench \n6.2 Allen wrench \n6.3 Adjustable wrench \n6.4 Dial indicator \n6.5 Vernier caliper \n6,6 Micrometer \n6.7 Test indicator \n6.8 Tool holders/ arbors \n7. Software \nMay include: \n7.1 NX program \n7.2 Master cam \n7.3 Solid works \n7.4 Del cam (part maker) \n7.5 Feature cam \n7.6 Autodesk \n7.7 Admac\n\n--- PDF PAGE 85 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n81 \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \n \nAssessment requires evidence that the candidate: \n1.1 Determined job requirements \n1.2 Wrote 5 axis CNC machine program \n1.3 Edited 5 axis CNC program \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 Equipment, tools and facilities \n2.2 Consumable materials \n2.3 Machine manuals \n2.4 Laptop/desktop computer \n2.5 USB, Memory card \n \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Direct observation \n3.3 Demonstration with Oral Questioning \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 86 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n82 \n \nUNIT OF COMPETENCY \n: SET UP 5-AXIS CNC MACHINE, CUTTING TOOLS AND \n WORK PIECE \n \n \nUNIT CODE \n : MEE 821322 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge and skills required to \n set-up 5-axis CNC machine, cutting tools and workpiece. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nBold and Italicized terms \nare elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Prepare machine \n1.1 Power up machine \naccording to manual \noperating procedure. \n1.2 Oil and coolant level \nare checked \naccording to \nmanufacturers’ \nspecification \n1.3 Air and hydraulic \npressure are \nchecked according \nto manufacturers’ \nspecification \n1.4 Machine zero point \nis checked and set \nto required position \naccording to \nstandard operating \nprocedure \n1.5 Work holding and \nclamping devices \nare selected and \nmounted according \nto standard \noperating \nprocedures. \n1.6 Safety practices are \napplied according to \nOSHS \n \n1.1 Machine set up \n1.2 Types of oil and \ncoolant \n1.3 Units of air and \nhydraulic \npressure \n1.4 Machine datum \nreference point \n1.5 Procedure in \nselection and \nmounting of \nwork holding \ndevices \n1.6 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n1.6 OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n1.7 Air pollution \n1.8 Noise pollution \n \n1.1 Powering up of \nmachine \n1.2 Checking of oil \nand coolant types \n1.3 Checking the air \nand hydraulic \npressure \n1.4 Determining \ndatum reference \n1.5 Selecting and \nmounting work \nholding devices. \n1.6 Applying safety \nprocedures\n\n--- PDF PAGE 87 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n83 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nBold and Italicized terms \nare elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Prepare cutting tools \n2.1 Cutting tools are \nselected according \nto required \nsequence of \noperation \n2.2 Cutting tools are \nmounted on the \ndesignated tool \nholders according \nto standard \noperating \nprocedure \n2.3 Cutting tools are \nset-up according \nto the required \nlength \n2.4 Cutting tools with \nholders are \nmounted on the \nmachine \nmagazine/carousel \naccording to tool \nnumber location \n2.5 Safety practices are \napplied according \nto OSHS \n2.1 Different types \nof cutting tools \n2.2 Different types \nof tool holders. \n2.3 Procedure in \nmounting of \ncutting tools to \nholder \n2.4 Procedure in \nsetting of the \nrequired tool \nlength \n2.5 Procedure in \nmounting tools \nto the machine \nmagazine rack. \n2.6 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n2.7 OSH Rule No. \n1080 – \nPersonal \nProtective \nEquipment & \nDevices \n2.8 Air pollution \n2.9 Noise pollution \n2.1 Selecting of \ncutting tools \n2.2 Mounting of \ncutting tools to \nholders. \n2.3 Setting of tool set \nlength \n2.4 Mounting of tools \nto the magazine \nrack \n2.5 Applying safety \nprocedures \n \n3. Prepare \nworkpiece \n3.1 Work piece is \nmounted on \nclamping device to \nrequired level of \naccuracy using \nmeasuring tools \nand \ninstruments/equip\nment in \naccordance with \nworksite \nprocedures \n3.2 Machine coordinate \nsystem (MCS) \nvalues are set to \nrequired position \naccording to \nstandard operating \nprocedures \n3.3 Workpiece \ncoordinate system \n3.1 Procedure in \nmounting \nwork piece. \n3.2 Procedure in \ndatum \nreferencing \n3.3 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n3.4 OSH Rule No. \n1080 – \nPersonal \nProtective \nEquipment & \nDevices \n3.5 Air pollution \n3.6 Noise pollution \n \n3.1 Mounting work \npiece \n3.2 Setting and \nverifying datum \nreference \n3.3 Applying safety \nprocedures\n\n--- PDF PAGE 88 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n84 \n \n(WCS) values are \nset and verified to \nthe required \nposition according \nto standard \noperating \nprocedures \n3.4 Safety practices are \napplied according \nto OSHS\n\n--- PDF PAGE 89 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n85 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work \nholding/fixtures \nand clamping \ndevice \nMay include: \n1.1 Chucks \n1.2 Precision vise \n1.3 Parallel bars \n1.4 V-blocks \n1.5 Angle plates \n \n2. Cutting tools \nMay include: \n2.1 Center drill \n2.2 Drill \n2.3 End mill \n2.4 Gun drill \n2.5 T slot cutter \n2.6 Dovetail cutter \n2.7 Form cutter \n2.8 Tap \n2.9 Inserts \n2.10 Face mill \n2.11 Bits \n \n3.Cutting tool set up May include: \n3.1 Tool type \n3.2 Input tool length \n3.3 Input tool diameter \n3.4 Tool presetter (optional) \n \n4. Workpiece \n \n \n \n \n \n \n \nMay include: \n4.1 Aluminum \n4.2 Stainless steel \n4.3 High carbon steel \n4.4 Copper \n4.5 Brass \n4.6 High speed steel (HSS) \n4.7 Mild steel(CRS)\n\n--- PDF PAGE 90 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n86 \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \n \nAssessment requires evidence that the candidate: \nAssessment requires evidence that the candidate: \n1.1 Prepare machine \n1.2 Prepare cutting tools \n1.3 Prepare workpiece \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 Equipment, cutting tools and facilities \n2.2 Consumable materials \n2.3 Charts and tables \n2.4 Work piece \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Direct observation \n3.3 Demonstration with Oral Questioning \n4. Context for \nassessment \n \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 91 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n87 \n \nUNIT OF COMPETENCY \n: \nPERFORM 5-AXIS CNC MACHINE OPERATIONS\n \n \n \nUNIT CODE \n \n \n: \n MEE 821323 \n \n \n UNIT DESCRIPTOR \n \n: \nThis unit covers the knowledge and skills required to \n \n perform 5-AXIS CNC machining operations \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nBold and Italicized terms \nare elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Operate machine \n \n \n1.1 Close machine guard \naccording to safety \nstandard operation \nprocedures \n1.2 Dry run is conducted \nin accordance with \nthe desired tool path \nmovement \n1.3 Program is edited \naccording to tool path \nmovement if required. \n1.4 Operate 5 axis CNC \nmachine to produce \ncomponent to meet \nthe desired \ndimensions, \ntolerance, fits, limits \nand surface finish \naccording to job \nrequirement. \n1.5 Safety practices are \napplied according to \nOSHS. \n1.1 Machine safety \nprocedures \n1.2 Procedures in \nconducting dry run \n1.3 Procedures in editing \nprogram \n1.4 Procedures in \noperating 5 axis CNC \nmachine \n1.5 OSH Rule No. 1070 – \nOccupational Health \n& Environmental \nControl \n1.6 OSH Rule No. 1080 – \nPersonal Protective \nEquipment & Devices \n1.6 Air pollution \n1.7 Noise pollution \n \n1.1 Conducting \ndry run \n1.2 Editing \nprogram \n1.3 Operating of 5 \naxis CNC \nmachine \n1.4 Applying \nsafety \nprocedures \n \n2. Monitor machine and \ntool movements \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n2.1 Program parameters \nare checked based \non computed data \n2.2 Air pressure level is \nmaintained \naccording to \nmachine operating \nmanual \n2.3 Cooling system is \nmaintained \naccording to \nviscosity \nrequirements \n2.4 Cutting tool sharpness \nis maintained \naccording to work \nprocedures \n2.5 Safety practices are \napplied according to \nOSHS. \n2.1 Procedures in \nchecking machine \nparameters \n2.2 Procedures in \nchecking air pressure \n2.3 Procedures in \nmaintaining cooling \nsystem \n2.4 Procedures in \nmaintaining tool \nsharpness \n2.5 OSH Rule No. 1070 – \nOccupational Health \n& Environmental \nControl \n2.6 OSH Rule No. 1080 – \nPersonal Protective \nEquipment & Devices \n2.7 Air pollution \n2.8 Noise pollution \n2.1 Checking \nmachine \nparameters \n2.2 Checking air \npressure \n2.3 Maintaining \ncooling \nsystem \n2.4 Maintaining \nmachine \nlubrication \nsystem \n2.5 Maintaining \ntool life \n2.6 Applying \nsafety \nprocedures\n\n--- PDF PAGE 92 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n88 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nBold and Italicized terms \nare elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Check and measure \nwork piece \n \n3.1 Machine guard is \nopened according to \nmachine operating \nmanual \n3.2 Work piece is \ncleaned and de \nburred while on the \nfixture according to \nstandard operating \nprocedure \n3.3 Work piece is \ninspected and \nmeasured \naccording to drawing \nspecification \n3.4 Safety practices are \napplied according to \nOSHS \n \n3.1 Procedures in \nopening machine \nguard \n3.2 Procedures in \ncleaning and de \nburring work piece \n3.3 Procedures in \ninspecting work piece \n3.4 OSH Rule No. 1070 – \nOccupational Health \n& Environmental \nControl \n3.5 OSH Rule No. 1080 – \nPersonal Protective \nEquipment & Devices \n3.6 Air pollution \n3.7 Noise pollution \n \n3.1 Opening of \nmachine \nguard \n3.2 Cleaning and \nde burring \nwork piece \n3.3 Checking and \nmeasuring \nwork piece \n3.4 Applying \nsafety \nprocedures\n\n--- PDF PAGE 93 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n89 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. 5 axis CNC \nmachine \nMay include: \n1.1 Table/table (5 axis milling) \n1.2 Table/tool (5 axis turn-milling) \n1.3 Tool/tool (5 axis rotating head milling) \n \n2 Tolerance \nMay include: \n2.1 Unilateral tolerance \n2.2 Bilateral tolerance \n \n3. Limits and fits \n \nMay include: \n3.1 Clearance fit \n3.2 Interference fit \n3.3 Transition fit \n3.4 Line fit \n \n4. Program \nparameters \nMay include: \n4.1 Revolution per minute \n4.2 Feed rate \n4.3 Speed\n\n--- PDF PAGE 94 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n90 \n \n EVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 Operated machine workpiece \n1.2 Monitored machine and tool movements \n1.3 Checked and measured work piece \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 Equipment, tools and facilities \n2.2 Consumable materials \n2.3 Charts and tables \n2.4 Work piece \n \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1 Direct observation \n3.2 Demonstration with Oral Questioning \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 95 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n91 \n \nUNIT OF COMPETENCY \n: PERFORM POST 5-AXIS CNC MACHINE OPERATIONS \n \nUNIT CODE : \nMEE 821324 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge and skills required to \n perform post- 5-axis CNC machining operation. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Conduct post \nCNC operation \n1.1 Work piece is \nunloaded from \nthe fixture \naccording to \nwork \ninstructions \n 1.2Work piece is \ncleaned and de \nburred \naccording to \nwork instruction \n1.3 Work piece is \ninspected and \nmeasured \naccording to \ndrawing \nspecifications \n1.4 Safety practices \nare applied \naccording to \nOSHS \n1.1 Procedures in \nunloading work \npiece \n1.2 Procedures in \ndeburring work \npiece \n1.3 Procedures in \ninspecting and \nmeasuring work \npiece \n1.4 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n1.5 OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n1.6 Air pollution \n1.7 Noise pollution \n1.1 Unloading of \nwork piece \n1.2 De burring of \nwork piece \n1.3 Inspecting \nand \nmeasuring \nwork piece \n1.4 Applying \nsafety \nprocedures \n \n2. Submit work piece \n2.1 Operator is sign \nout the \noperation sheet \naccording to \nworkplace \nprocedures \n2.2 Work piece and \noperation sheet \nare submitted to \nimmediate \nsupervisor \naccording to \nwork place \nprocedures \n2.3 Safety practices \nare applied \naccording to \nOSHS \n2.1 Procedures in \nsigning out \noperation sheet \n2.2 Submission of \noperation sheet \nand inspected \nwork piece \n2.2 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n2.3 OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n2.4 Air pollution \n2.5 Noise pollution \n2.1 Signing out \noperation \nsheet \n2.2 Submitting \nreport and \nwork piece \n2.3 Applying \nsafety \nprocedures\n\n--- PDF PAGE 96 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n92 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3. Shut-off machine \nand perform house \nkeeping \n \n3.1 Machine is shut-\noff according to \nmanufacturer’s \noperating manual \n3.2 Tools are \nmaintained and \nstored based on \nestablished \nprocedures \n3.3 Defective tools \nand machines \nare tagged and \nreported \naccording to \nwork place \nprocedures \n3.4 Good \nhousekeeping is \nperformed \nfollowing 5S \n3.5 Wastes are \ndisposed \naccording to \nwaste \nmanagement \nprocedures and \nenvironmental \nregulations \n3.6 Safety practices \nare applied \nfollowing OSHS \n3.1 Procedures in \nshutting off \nmachine \n3.2 Storage of tools \nand materials \n3.3 Tagging of \ndefective tools \nand machine \n3.4 5S of good \nhouse keeping \n3.5 Waste \nmanagement \n3.6 Environmental \nlaws to post \nactivities \n3.7 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n3.8 OSH Rule No. \n1080 – \nPersonal \nProtective \nEquipment & \nDevices \n3.9 Air pollution \n3.10 Noise pollution \n3.1 Shutting off \nmachine \n3.2 Cleaning and \nstoring of tools \nand materials \n3.3 Tagging defective \ntools and \nmachine \n3.4 Performing good \nhouse keeping \n3.5 Managing wastes \n3.6 Applying safety \nprocedures\n\n--- PDF PAGE 97 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n93 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. De burr \nTools may include: \n1.1Bush burr \n1.2 Air motor \n1.3 Sand paper \n1.4 File \n1.5 Oil stone \n1.6 Surface plate \n \n2. Defective tools \n \nMay include: \n2.1 Chipped off edges \n2.2 Broken tools \n2.3 Out of specifications \n2.4 Dull tools \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \n \nAssessment requires evidence that the candidate: \n1.1 Conducted post CNC operation \n1.2 Submitted machined work piece \n1.3 Shutt-off machine and performed house keeping \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 Equipment , tools and facilities \n2.2 Consumable materials \n2.3 Work piece \n \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1 Direct observation \n3.2 Demonstration with Oral Questioning \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 98 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n94"
