        "source_text": "MEE 821323 \n \n \n UNIT DESCRIPTOR \n \n: \nThis unit covers the knowledge and skills required to \n \n perform 5-AXIS CNC machining operations \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nBold and Italicized terms \nare elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Operate machine \n \n \n1.1 Close machine guard \naccording to safety \nstandard operation \nprocedures \n1.2 Dry run is conducted \nin accordance with \nthe desired tool path \nmovement \n1.3 Program is edited \naccording to tool path \nmovement if required. \n1.4 Operate 5 axis CNC \nmachine to produce \ncomponent to meet \nthe desired \ndimensions, \ntolerance, fits, limits \nand surface finish \naccording to job \nrequirement. \n1.5 Safety practices are \napplied according to \nOSHS. \n1.1 Machine safety \nprocedures \n1.2 Procedures in \nconducting dry run \n1.3 Procedures in editing \nprogram \n1.4 Procedures in \noperating 5 axis CNC \nmachine \n1.5 OSH Rule No. 1070 – \nOccupational Health \n& Environmental \nControl \n1.6 OSH Rule No. 1080 – \nPersonal Protective \nEquipment & Devices \n1.6 Air pollution \n1.7 Noise pollution \n \n1.1 Conducting \ndry run \n1.2 Editing \nprogram \n1.3 Operating of 5 \naxis CNC \nmachine \n1.4 Applying \nsafety \nprocedures \n \n2. Monitor machine and \ntool movements \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n2.1 Program parameters \nare checked based \non computed data \n2.2 Air pressure level is \nmaintained \naccording to \nmachine operating \nmanual \n2.3 Cooling system is \nmaintained \naccording to \nviscosity \nrequirements \n2.4 Cutting tool sharpness \nis maintained \naccording to work \nprocedures \n2.5 Safety practices are \napplied according to \nOSHS. \n2.1 Procedures in \nchecking machine \nparameters \n2.2 Procedures in \nchecking air pressure \n2.3 Procedures in \nmaintaining cooling \nsystem \n2.4 Procedures in \nmaintaining tool \nsharpness \n2.5 OSH Rule No. 1070 – \nOccupational Health \n& Environmental \nControl \n2.6 OSH Rule No. 1080 – \nPersonal Protective \nEquipment & Devices \n2.7 Air pollution \n2.8 Noise pollution \n2.1 Checking \nmachine \nparameters \n2.2 Checking air \npressure \n2.3 Maintaining \ncooling \nsystem \n2.4 Maintaining \nmachine \nlubrication \nsystem \n2.5 Maintaining \ntool life \n2.6 Applying \nsafety \nprocedures\n\n--- PDF PAGE 92 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n88 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nBold and Italicized terms \nare elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Check and measure \nwork piece \n \n3.1 Machine guard is \nopened according to \nmachine operating \nmanual \n3.2 Work piece is \ncleaned and de \nburred while on the \nfixture according to \nstandard operating \nprocedure \n3.3 Work piece is \ninspected and \nmeasured \naccording to drawing \nspecification \n3.4 Safety practices are \napplied according to \nOSHS \n \n3.1 Procedures in \nopening machine \nguard \n3.2 Procedures in \ncleaning and de \nburring work piece \n3.3 Procedures in \ninspecting work piece \n3.4 OSH Rule No. 1070 – \nOccupational Health \n& Environmental \nControl \n3.5 OSH Rule No. 1080 – \nPersonal Protective \nEquipment & Devices \n3.6 Air pollution \n3.7 Noise pollution \n \n3.1 Opening of \nmachine \nguard \n3.2 Cleaning and \nde burring \nwork piece \n3.3 Checking and \nmeasuring \nwork piece \n3.4 Applying \nsafety \nprocedures\n\n--- PDF PAGE 93 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n89 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. 5 axis CNC \nmachine \nMay include: \n1.1 Table/table (5 axis milling) \n1.2 Table/tool (5 axis turn-milling) \n1.3 Tool/tool (5 axis rotating head milling) \n \n2 Tolerance \nMay include: \n2.1 Unilateral tolerance \n2.2 Bilateral tolerance \n \n3. Limits and fits \n \nMay include: \n3.1 Clearance fit \n3.2 Interference fit \n3.3 Transition fit \n3.4 Line fit \n \n4. Program \nparameters \nMay include: \n4.1 Revolution per minute \n4.2 Feed rate \n4.3 Speed\n\n--- PDF PAGE 94 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n90 \n \n EVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 Operated machine workpiece \n1.2 Monitored machine and tool movements \n1.3 Checked and measured work piece \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 Equipment, tools and facilities \n2.2 Consumable materials \n2.3 Charts and tables \n2.4 Work piece \n \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1 Direct observation \n3.2 Demonstration with Oral Questioning \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 95 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n91 \n \nUNIT OF COMPETENCY \n: PERFORM POST 5-AXIS CNC MACHINE OPERATIONS \n \nUNIT CODE :"
