        "source_text": "MEE722210 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competencies required to measure \nworkpieces using fixed and adjustable gages. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Select and use \nfixed and \nadjustable gages \n1.1 Appropriate gages \nare selected and \nused to undertake \nthe required \ncomparison or \nmeasurement using \nstandard operating \nprocedures. \n1.2 Consistent and \naccurate \nmeasurements \nobtained conforms to \ndrawing specification \n1.3 Measuring technique \nused is correct and \nappropriate to the \ndevice used. \n1.1 Types and \napplication of \nfixed and \nadjustable gages \n1.2 Gage limits and \naccuracy \n1.3 Techniques for \nmeasuring \ncomponents \n1.1 Selecting \nappropriate \ngages and \nmeasuring \ninstrument \n1.2 Obtaining \naccurate \nmeasurements \n1.3 Determining \nmeasuring \ntechniques \n2. Perform surface \ntexture \nmeasurements \n2.1 Surface texture are \nmeasured according \nworksite procedures. \n2.2 Measurements taken \nare within the level of \naccuracy required. \n \n2.1 Types and \napplication of \nfixed and \nadjustable gages \n2.2 Gage limits and \naccuracy \n2.3 Techniques for \nmeasuring \ncomponents \n2.1 Identifying die \nmaterial \nrequirements \n2.2 Determining \nproduction \nvolume \n2.3 Identifying design \nparameters \n3. Clean and store \nmeasuring tools \n3.1 Care and storage of \ndevices undertaken to \nmanufacturer’s \nspecifications or \nstandard operating \nprocedures. \n3.1 Care and storage \nprocedure of \nmeasuring tools \n3.1 Cleaning and \nstoring \nmeasuring tools\n\n--- PDF PAGE 71 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n67 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Gages \nMay include: \n1.1 Gage blocks \n1.2 Telescoping gages \n1.3 Center gages \n1.4 Thread gages \n1.5 Dial bore gages \n1.6 Height gages \n1.7 Radius gages \n1.8 Go-no-go gages \n1.9 Depth gages \n2. Measurements \nMay include: \n2.1 Linear dimensions \n2.2 Diameters \n2.3 Depths \n2.4 Fits \n2.5 Tapers \n2.6 Threads \n2.7 Radius \n2.8 Squareness \n2.9 Surface texture \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Selected and used fixed and adjustable gages \n1.2 Performed surface texture measurements \n1.3 Cleaned and stored measuring instruments \n \n2. Resource implications \nThe following resources should be provided: \n2.1 Tools, equipment and facilities appropriate to the activity \n2.2 Specimen component or part to the proposed activity \n2.3 Drawing \n \n3. Method of assessment \nCompetency in this unit may be assessed through: \n3.1 Direct observation \n3.2 Demonstration \n3.3 Written or oral short answer questions \n3.4 Portfolio \n \n4. Context for assessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 72 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n68 \n \nUNIT OF COMPETENCY \n: \nPERFORM PREVENTIVE AND CORRECTIVE \nMAINTENANCE \n \nUNIT CODE \n \n:"
