        "evidence_guide": {
          "source_text": "1. Critical aspects \nof competency \n \nAssessment requires evidence that the candidate: \n1.1 Determined job requirements \n1.2 Wrote 5 axis CNC machine program \n1.3 Edited 5 axis CNC program \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 Equipment, tools and facilities \n2.2 Consumable materials \n2.3 Machine manuals \n2.4 Laptop/desktop computer \n2.5 USB, Memory card \n \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Direct observation \n3.3 Demonstration with Oral Questioning \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 86 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n82 \n \nUNIT OF COMPETENCY \n: SET UP 5-AXIS CNC MACHINE, CUTTING TOOLS AND \n WORK PIECE \n \n \nUNIT CODE \n :"
        },
        "source_text": "MEE821321 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge and skills required to \n write 5-axis CNC program based on drawing specifications.\n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Determine job \nrequirements \n1.1 Drawings are \ninterpreted to produce \ncomponent according \nto specifications. \n1.2 Sequence of CNC \nmachining \noperations (tool \npathing) are \ndetermined to produce \ncomponent according \nto industry standard \n 1.3 Cutting tools are \nselected according to \nthe requirements of \nthe operations \n 1.4 Cutting speed and \nfeed rate are \ncalculated based on \ncutting tools and work \npiece specifications. \n1.5 Process / operation \nsheets are filled up \nwith relevant machine, \nwork piece, fixture, \ntools and measuring \ninstruments to be \nused. \n1.6 Safety practices are \napplied according to \nOSHS. \n \n1.1 3D Drafting \n1.2 3D Machining \n1.3 Technical \ndrawing \n1.4 Application of \nlimits, fits, \ntolerances and \nsurface texture \n1.5 Sequence of \noperation \n1.6 Different types \nof cutting tools \n1.7 Calculation of \nspeed and \nfeed rate \n1.8 Procedure in \nfilling up job \nsheets \n1.9 Appropriate \nFixtures \n1.10 OSH Rule No. \n1080 – \nPersonal \nProtective \nEquipment & \nDevices \n1.11 OSH Rule No. \n1150 – \nMaterials \nHandling & \nStorage \n1.12 Air pollution \n1.13 Noise pollution \n Quality control \n1.1 Interpreting 3D \ndrawing. \n1.2 Determining of \nsequence of \noperation \n1.3 Selecting cutting \ntools \n1.4 Calculating cutting \nspeed and feed. \n1.5 Filling up job \nsheets \n1.6 Applying safety \nprocedures\n\n--- PDF PAGE 82 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n78 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Write 5-axis CNC \nmachine program \n \n2.1 Sequence of \nprograms are \ngenerated using \nmanual \nprograming (G-\ncodes /M-codes) \nand automatic \nprogramming \nusing software \naccording to \nstandard \noperating \nprocedure \n2.2 Conversational or \nISO CNC \nprogramming \noperations are \nused based on \nmachine \ncapability. \n2.3 Safety practices \nare applied \naccording to \nOSHS. \n \n2.1 Generation of \n manual and \n automatic \n programming. \n2.2 Procedure in \n writing \nconversational \n or ISO \n CNC \n programming \n language \n2.3 OSH Rule No. 1080 \n– Personal \nProtective \nEquipment & \nDevices \n2.4 OSH Rule No. 1150 \n– Materials Handling \n& Storage \n2.5 Air pollution \n2.5 Noise pollution \n2.7 Quality control \n \n2.1 Generating \nmanual and \nautomatic program \n2.2 Writing \nconversational or \nISO CNC program \n2.3 Applying safety \nprocedures \n3. Edit 5-axis CNC \nprogram \n 3.1 Program is \nsimulated and \nedited if required \naccording to \nstandard \noperating \nprocedures \n3.2 Program is saved \nto the machine \nfile according to \nstandard \noperating \nprocedures \n3.3 \nProven program \nis copied and \nsaved to backup \nprogram files \naccording to \nstandard \noperating \nprocedures. \n 3.4 Safety practices \nare applied \naccording to \nOSHS \n \n3.1 Procedure in \nsimulation and \nediting of tool \nmovement \n3.2 Procedure in saving \nfiles to the machine \n3.3 Procedure in \ncopying saved \nproven program on \nseparate folders or \nfiles \n3.4 Occupational \n3.5 safety and \n3.6 health practice \n3.7 OSH Rule No. 1070 \n– Occupational \nHealth & \nEnvironmental \nControl \n3.8 OSH Rule No. 1080 \n– Personal \nProtective \nEquipment & \nDevices Air pollution \n3.9 Noise pollution \n \n3.1 Simulating and \nediting tool \nmovement \n3.2 Saving program in \nmachine files \n3.3 Copying proven \nprogram \n3.4 Applying safety \nprocedures\n\n--- PDF PAGE 83 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n79 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Drawing \n May include: \n1.1 Dimensions and symbols \n1.2 Geometric dimensioning and tolerancing \n1.3 Limits, fits, tolerances and surface texture \n2. CNC machining operation \nMay include: \n2.1 Point machining unit/C-axis point machining unit \n 2.1.1 Right hand counter boring (RGH CBOR) \n machining \n 2.1.2 Right hand back boring (RGH BCB) \n machining \n 2.1.3 Reaming \n 2.1.4 Tapping \n 2.1.5 Boring \n 2.1.6 Back boring \n 2.1.7 Circular milling \n 2.1.8 Counter bore-tapping \n 2.1.9 Boring of through hole \n 2.1.10 Boring of step through hole \n 2.1.11 Boring of non-through hole \n \n2.2 Line machining unit/C-axis line machining \n unit \n 2.2.1 Central linear machining \n 2.2.2 Right-hand linear machining \n 2.2.3 Left-hand linear machining \n 2.2.4 Outside linear machining \n 2.2.5 Inside linear machining \n 2.2.6 Right-hand chamfering \n 2.2.7 Left-hand chamfering \n 2.2.8 Outside chamfering \n 2.2.9 Inside chamfering \n 2.2.10 Face milling \n 2.2.11 End milling-top \n 2.2.12 End milling-step \n 2.2.13 Pocket milling \n 2.2.14 Pocket milling-mountain \n 2.2.15 Pocket milling-valley \n 2.2.16 End milling-slot \n2.2.17 3-D \n \n2.3Turning unit \n2.3.1 Bar-materials machining \n2.3.2 Copy-machining \n2.3.3 Corner-machining \n2.3.4 Edge-machining\n\n--- PDF PAGE 84 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n80 \n \nVARIABLE \nRANGE \n \n2.3.5 Threading \n2.3.6 Grooving \n2.3.7 Turning drilling \n2.3.8 Turning tapping \n2.3.9 Mill-turning \n3. Cutting tools \n \nMay include: \n3.1 Center drill \n3.2 Drill \n3.3 End mill \n3.4 Gun drill \n3.5 T slot cutter \n3.6 Dovetail cutter \n3.7 Form cutter \n3.8 Tap \n3.9 Inserts \n3.10 Face mill \n3.11 Bits \n4. Cutting speed and feed \nrate \nMay include: \n4.1Revolution per minute (RPM) \n4.2 Feed rate in inch per minute (IPM) \n4.3 Feed rate in millimeter per minute (MPM) \n5. Workpiece \nMay include: \n5.1 Aluminum \n5.2 Stainless steel \n5.3 High carbon steel \n5.4 Copper \n5.5 Brass \n5.6 HSS \n5.7 Mild steel(CRS) \n6. Tools and measuring \ninstruments \nMay include: \n6.1 Combination wrench \n6.2 Allen wrench \n6.3 Adjustable wrench \n6.4 Dial indicator \n6.5 Vernier caliper \n6,6 Micrometer \n6.7 Test indicator \n6.8 Tool holders/ arbors \n7. Software \nMay include: \n7.1 NX program \n7.2 Master cam \n7.3 Solid works \n7.4 Del cam (part maker) \n7.5 Feature cam \n7.6 Autodesk \n7.7 Admac\n\n--- PDF PAGE 85 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n81 \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \n \nAssessment requires evidence that the candidate: \n1.1 Determined job requirements \n1.2 Wrote 5 axis CNC machine program \n1.3 Edited 5 axis CNC program \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 Equipment, tools and facilities \n2.2 Consumable materials \n2.3 Machine manuals \n2.4 Laptop/desktop computer \n2.5 USB, Memory card \n \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Direct observation \n3.3 Demonstration with Oral Questioning \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 86 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n82 \n \nUNIT OF COMPETENCY \n: SET UP 5-AXIS CNC MACHINE, CUTTING TOOLS AND \n WORK PIECE \n \n \nUNIT CODE \n :"
