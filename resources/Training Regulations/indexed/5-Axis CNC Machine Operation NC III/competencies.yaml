        "source_text": "400311324 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required \nto use technical information systems, apply information \ntechnology (IT) systems and edit, format & check information. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Use technical \ninformation \n1.1. Information are \ncollated and \norganized into a \nsuitable form for \nreference and use \n1.2. Stored \ninformation are \nclassified so that \nit can be quickly \nidentified and \nretrieved when \nneeded \n1.3. Guidance are \nadvised and \noffered to people \nwho need to find \nand use \ninformation \n \n \n \n \n \n1.1. Application in \ncollating \ninformation \n1.2. Procedures for \ninputting, \nmaintaining and \narchiving \ninformation \n1.3. Guidance to \npeople who need \nto find and use \ninformation \n1.4. Organize \ninformation \n1.5. classify stored \ninformation for \nidentification and \nretrieval \n1.6. Operate the \ntechnical \ninformation system \nby using agreed \nprocedures \n1.1. Collating information \n1.2. Operating \nappropriate and \nvalid procedures for \ninputting, \nmaintaining and \narchiving information \n1.3. Advising and \noffering guidance to \npeople who need to \nfind and use \ninformation \n1.4. Organizing \ninformation into a \nsuitable form for \nreference and use \n1.5. Classifying stored \ninformation for \nidentification and \nretrieval \n1.6. Operating the \ntechnical information \nsystem by using \nagreed procedures\n\n--- PDF PAGE 32 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n28 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Apply information \ntechnology (IT) \n2.1. Technical \ninformation \nsystem is operated \nusing agreed \nprocedures \n2.2. Appropriate and \nvalid procedures \nare operated for \ninputting, \nmaintaining and \narchiving \ninformation \n2.3. Software \nrequired are \nutilized to execute \nthe project \nactivities \n2.4. Information and \ndata obtained are \nhandled, edited, \nformatted and \nchecked from a \nrange of internal \nand external \nsources \n2.5. Information are \nextracted, entered, \nand processed to \nproduce the \noutputs required \nby customers \n2.6. Own skills and \nunderstanding are \nshared to help \nothers \n2.7. Specified security \nmeasures are \nimplemented to \nprotect the \nconfidentiality and \nintegrity of project \ndata held in IT \nsystems \n \n2.1. Attributes and \nlimitations of \navailable software \ntools \n2.2. Procedures and \nwork instructions for \nthe use of IT \n2.3. Operational \nrequirements for IT \nsystems \n2.4. Sources and flow \npaths of data \n2.5. Security systems \nand measures that \ncan be used \n2.6. Extract data and \nformat reports \n2.7. Methods of entering \nand processing \ninformation \n2.8. WWW enabled \napplications \n2.1. Identifying attributes \nand limitations of \navailable software \ntools \n2.2. Using procedures and\nwork instructions for \nthe use of IT \n2.3. Describing \noperational \nrequirements for IT \nsystems \n2.4. Identifying sources \nand flow paths of data\n2.5. Determining security \nsystems and \nmeasures that can be \nused \n2.6. Extracting data and \nformat reports \n2.7. Describing methods \nof entering and \nprocessing \ninformation \n2.8. Using WWW \napplications\n\n--- PDF PAGE 33 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n29 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Edit, format and \ncheck \ninformation \n3.1 Basic editing \ntechniques are \nused \n3.2 Accuracy of \ndocuments are \nchecked \n3.3 Editing and \nformatting tools and \ntechniques are \nused for more \ncomplex