        "source_text": "MEE 821322 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge and skills required to \n set-up 5-axis CNC machine, cutting tools and workpiece. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nBold and Italicized terms \nare elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Prepare machine \n1.1 Power up machine \naccording to manual \noperating procedure. \n1.2 Oil and coolant level \nare checked \naccording to \nmanufacturers’ \nspecification \n1.3 Air and hydraulic \npressure are \nchecked according \nto manufacturers’ \nspecification \n1.4 Machine zero point \nis checked and set \nto required position \naccording to \nstandard operating \nprocedure \n1.5 Work holding and \nclamping devices \nare selected and \nmounted according \nto standard \noperating \nprocedures. \n1.6 Safety practices are \napplied according to \nOSHS \n \n1.1 Machine set up \n1.2 Types of oil and \ncoolant \n1.3 Units of air and \nhydraulic \npressure \n1.4 Machine datum \nreference point \n1.5 Procedure in \nselection and \nmounting of \nwork holding \ndevices \n1.6 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n1.6 OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n1.7 Air pollution \n1.8 Noise pollution \n \n1.1 Powering up of \nmachine \n1.2 Checking of oil \nand coolant types \n1.3 Checking the air \nand hydraulic \npressure \n1.4 Determining \ndatum reference \n1.5 Selecting and \nmounting work \nholding devices. \n1.6 Applying safety \nprocedures\n\n--- PDF PAGE 87 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n83 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nBold and Italicized terms \nare elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Prepare cutting tools \n2.1 Cutting tools are \nselected according \nto required \nsequence of \noperation \n2.2 Cutting tools are \nmounted on the \ndesignated tool \nholders according \nto standard \noperating \nprocedure \n2.3 Cutting tools are \nset-up according \nto the required \nlength \n2.4 Cutting tools with \nholders are \nmounted on the \nmachine \nmagazine/carousel \naccording to tool \nnumber location \n2.5 Safety practices are \napplied according \nto OSHS \n2.1 Different types \nof cutting tools \n2.2 Different types \nof tool holders. \n2.3 Procedure in \nmounting of \ncutting tools to \nholder \n2.4 Procedure in \nsetting of the \nrequired tool \nlength \n2.5 Procedure in \nmounting tools \nto the machine \nmagazine rack. \n2.6 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n2.7 OSH Rule No. \n1080 – \nPersonal \nProtective \nEquipment & \nDevices \n2.8 Air pollution \n2.9 Noise pollution \n2.1 Selecting of \ncutting tools \n2.2 Mounting of \ncutting tools to \nholders. \n2.3 Setting of tool set \nlength \n2.4 Mounting of tools \nto the magazine \nrack \n2.5 Applying safety \nprocedures \n \n3. Prepare \nworkpiece \n3.1 Work piece is \nmounted on \nclamping device to \nrequired level of \naccuracy using \nmeasuring tools \nand \ninstruments/equip\nment in \naccordance with \nworksite \nprocedures \n3.2 Machine coordinate \nsystem (MCS) \nvalues are set to \nrequired position \naccording to \nstandard operating \nprocedures \n3.3 Workpiece \ncoordinate system \n3.1 Procedure in \nmounting \nwork piece. \n3.2 Procedure in \ndatum \nreferencing \n3.3 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n3.4 OSH Rule No. \n1080 – \nPersonal \nProtective \nEquipment & \nDevices \n3.5 Air pollution \n3.6 Noise pollution \n \n3.1 Mounting work \npiece \n3.2 Setting and \nverifying datum \nreference \n3.3 Applying safety \nprocedures\n\n--- PDF PAGE 88 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n84 \n \n(WCS) values are \nset and verified to \nthe required \nposition according \nto standard \noperating \nprocedures \n3.4 Safety practices are \napplied according \nto OSHS\n\n--- PDF PAGE 89 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n85 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work \nholding/fixtures \nand clamping \ndevice \nMay include: \n1.1 Chucks \n1.2 Precision vise \n1.3 Parallel bars \n1.4 V-blocks \n1.5 Angle plates \n \n2. Cutting tools \nMay include: \n2.1 Center drill \n2.2 Drill \n2.3 End mill \n2.4 Gun drill \n2.5 T slot cutter \n2.6 Dovetail cutter \n2.7 Form cutter \n2.8 Tap \n2.9 Inserts \n2.10 Face mill \n2.11 Bits \n \n3.Cutting tool set up May include: \n3.1 Tool type \n3.2 Input tool length \n3.3 Input tool diameter \n3.4 Tool presetter (optional) \n \n4. Workpiece \n \n \n \n \n \n \n \nMay include: \n4.1 Aluminum \n4.2 Stainless steel \n4.3 High carbon steel \n4.4 Copper \n4.5 Brass \n4.6 High speed steel (HSS) \n4.7 Mild steel(CRS)\n\n--- PDF PAGE 90 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n86 \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \n \nAssessment requires evidence that the candidate: \nAssessment requires evidence that the candidate: \n1.1 Prepare machine \n1.2 Prepare cutting tools \n1.3 Prepare workpiece \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 Equipment, cutting tools and facilities \n2.2 Consumable materials \n2.3 Charts and tables \n2.4 Work piece \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Examination \n3.2 Direct observation \n3.3 Demonstration with Oral Questioning \n4. Context for \nassessment \n \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 91 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n87 \n \nUNIT OF COMPETENCY \n: \nPERFORM 5-AXIS CNC MACHINE OPERATIONS\n \n \n \nUNIT CODE \n \n \n:"
