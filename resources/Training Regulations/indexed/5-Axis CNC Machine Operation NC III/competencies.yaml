        },
        "source_text": "MEE 821324 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge and skills required to \n perform post- 5-axis CNC machining operation. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Conduct post \nCNC operation \n1.1 Work piece is \nunloaded from \nthe fixture \naccording to \nwork \ninstructions \n 1.2Work piece is \ncleaned and de \nburred \naccording to \nwork instruction \n1.3 Work piece is \ninspected and \nmeasured \naccording to \ndrawing \nspecifications \n1.4 Safety practices \nare applied \naccording to \nOSHS \n1.1 Procedures in \nunloading work \npiece \n1.2 Procedures in \ndeburring work \npiece \n1.3 Procedures in \ninspecting and \nmeasuring work \npiece \n1.4 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n1.5 OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n1.6 Air pollution \n1.7 Noise pollution \n1.1 Unloading of \nwork piece \n1.2 De burring of \nwork piece \n1.3 Inspecting \nand \nmeasuring \nwork piece \n1.4 Applying \nsafety \nprocedures \n \n2. Submit work piece \n2.1 Operator is sign \nout the \noperation sheet \naccording to \nworkplace \nprocedures \n2.2 Work piece and \noperation sheet \nare submitted to \nimmediate \nsupervisor \naccording to \nwork place \nprocedures \n2.3 Safety practices \nare applied \naccording to \nOSHS \n2.1 Procedures in \nsigning out \noperation sheet \n2.2 Submission of \noperation sheet \nand inspected \nwork piece \n2.2 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n2.3 OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n2.4 Air pollution \n2.5 Noise pollution \n2.1 Signing out \noperation \nsheet \n2.2 Submitting \nreport and \nwork piece \n2.3 Applying \nsafety \nprocedures\n\n--- PDF PAGE 96 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n92 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3. Shut-off machine \nand perform house \nkeeping \n \n3.1 Machine is shut-\noff according to \nmanufacturer’s \noperating manual \n3.2 Tools are \nmaintained and \nstored based on \nestablished \nprocedures \n3.3 Defective tools \nand machines \nare tagged and \nreported \naccording to \nwork place \nprocedures \n3.4 Good \nhousekeeping is \nperformed \nfollowing 5S \n3.5 Wastes are \ndisposed \naccording to \nwaste \nmanagement \nprocedures and \nenvironmental \nregulations \n3.6 Safety practices \nare applied \nfollowing OSHS \n3.1 Procedures in \nshutting off \nmachine \n3.2 Storage of tools \nand materials \n3.3 Tagging of \ndefective tools \nand machine \n3.4 5S of good \nhouse keeping \n3.5 Waste \nmanagement \n3.6 Environmental \nlaws to post \nactivities \n3.7 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n3.8 OSH Rule No. \n1080 – \nPersonal \nProtective \nEquipment & \nDevices \n3.9 Air pollution \n3.10 Noise pollution \n3.1 Shutting off \nmachine \n3.2 Cleaning and \nstoring of tools \nand materials \n3.3 Tagging defective \ntools and \nmachine \n3.4 Performing good \nhouse keeping \n3.5 Managing wastes \n3.6 Applying safety \nprocedures\n\n--- PDF PAGE 97 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n93 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. De burr \nTools may include: \n1.1Bush burr \n1.2 Air motor \n1.3 Sand paper \n1.4 File \n1.5 Oil stone \n1.6 Surface plate \n \n2. Defective tools \n \nMay include: \n2.1 Chipped off edges \n2.2 Broken tools \n2.3 Out of specifications \n2.4 Dull tools \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \n \nAssessment requires evidence that the candidate: \n1.1 Conducted post CNC operation \n1.2 Submitted machined work piece \n1.3 Shutt-off machine and performed house keeping \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 Equipment , tools and facilities \n2.2 Consumable materials \n2.3 Work piece \n \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1 Direct observation \n3.2 Demonstration with Oral Questioning \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center\n\n--- PDF PAGE 98 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n94"
      }
