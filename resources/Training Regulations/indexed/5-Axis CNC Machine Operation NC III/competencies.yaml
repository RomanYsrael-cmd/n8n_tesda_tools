sed or used as \nneeded \n2.4 Desktop icons of \napplication programs \nare selected, opened \nand closed \n2.5 Properties of icons are \ndisplayed \n2.6 Computer or desktop \nsettings are saved and \nrestored \n \n \n2.1 Keyboard layout \nand functions \n2.2 Computer \nfunctions \n2.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n2.4 Storage devices \nand file concepts \n2.5 Basic software \noperation and \nfunctionalities \n2.1 Changing \ndesktop screen \nor windows \nelement \n2.2 Adding, \nrenaming, \nmoving, copying \nand deleting \ndesk top icon \n2.3 Accessing online \nhelp function \n2.4 Opening and \nclosing desk top \nicons \n2.5 Displaying \nproperties of \nicons\n\n--- PDF PAGE 76 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n72 \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Work with files and \nfolders (or \ndirectories \n3.1 A file or folder is \ncreated, opened, \nmoved, renamed or \ncopied \n3.2 Files are located, \ndeleted and restored \n3.3 Details and properties \nof files and folders \nare displayed or \nviewed \n3.4 Various files are \norganized for easy \nlookup and use \n3.5 Files and information \nare searched \n3.6 Disks are checked, \nerased or formatted \nas necessary \n3.1 Keyboard layout \nand functions \n3.2 Computer \nfunctions \n3.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n3.4 Storage devices \nand file concepts \n3.5 Basic software \noperation and \nfunctionalities \n3.1 Creating, \nopening, moving, \nrenaming and \ncopying a file and \nfolder \n3.2 Locating, deleting \nand restoring \nfiles \n3.3 Displaying details \nand properties of \nfiles and folders \n3.4 Organizing files \n3.5 Searching file \nand information \n4. Work with user \napplication \nprograms \n4.1 Application programs \nare added, changed, \nremoved or ran \n4.2 User software or \napplication program \nare installed, updated \nand upgraded \n4.3 Information/data are \nmoved between \ndocuments or files \n4.1 Keyboard layout \nand functions \n4.2 Computer \nfunctions \n4.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n4.4 Storage devices \nand file concepts \n4.5 Basic software \noperation and \nfunctionalities \n4.1 Checking \nhardware \nconfiguration and \nother system \nfeatured \n4.2 Installing, \nupdating and \nupgrading user \nsoftware or \napplication \nprogram \n \n5. Print information \n5.1 Printer is added or \ninstalled and correct \nprinter settings is \nensured \n5.2 Default printer is \nassigned accordingly \n5.3 Information or \ndocument is printed \non the installed \nprinter \n5.4 Progress of print jobs \nare viewed and \ndeleted as required \n5.1 Keyboard layout \nand functions \n5.2 Computer \nfunctions \n5.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n5.4 Storage devices \nand file concepts \n5.5 Basic software \noperation and \nfunctionalities \n5.1 Installing printer \nsettings \n5.2 Printing \ninformation or \ndocument\n\n--- PDF PAGE 77 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n73 \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n6. Shut down \ncomputer \n6.1 All open application \nprograms are closed \n6.2 Computer and \nperipheral devices \nare properly shut \ndown \n6.1 Keyboard layout \nand functions \n6.2 Computer \nfunctions \n6.3 Basic parts of a \ncomputer and \nvarious hardware \ncomponents \n6.4 Storage devices \nand file concepts \n6.5 Basic software \noperation and \nfunctionalities \n \n6.1 Shutting down \ncomputer and \nperipheral \ndevices\n\n--- PDF PAGE 78 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n74 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Peripheral device \