        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nExamined specific workplace challenges. \n1.2. \nAnalyzed the causes of specific workplace challenges. \n1.3. \nFormulated resolutions to specific workplace challenges. \n1.4. \nImplemented action plans and communicated results on \nspecific workplace challenges. \n \n2. Resource \nImplications \n2.1. \nAssessment will require access to an operating plant over \nan extended period of time, or a suitable method of \ngathering evidence of operating ability over a range of \nsituations. A bank of scenarios / case studies / what ifs will \nbe required as well as bank of questions which will be used \nto probe the reason behind the observable action. \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. \nObservation \n3.2. \nCase Formulation \n3.3. \nLife Narrative Inquiry \n3.4. \nStandardized test \nThe unit will be assessed in a holistic manner as is practical and \nmay be integrated with the assessment of other relevant units of \ncompetency. Assessment will occur over a range of situations, \nwhich will include disruptions to normal, smooth operation. \nSimulation may be required to allow for timely assessment of parts \nof this unit of competency. Simulation should be based on the \nactual workplace and will include walk through of the relevant \ncompetency components. \n \nThese assessment activities should include a range of problems, \nincluding new, unusual and improbable situations that may have \nhappened. \n4. Context for \nAssessment \nIn all workplace, it may be appropriate to assess this unit \nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 21 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n17 \n \nUNIT OF COMPETENCY : \nWORK IN A DIVERSE ENVIRONMENT \n \nUNIT CODE \n :"
        },
        "source_text": "400311321 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required \nto solve problems in the workplace including the application \nof problem solving techniques and to determine and resolve \nthe root cause/s of specific problems in the workplace. \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Examine \nspecific \nworkplace \nchallenges \n1.1 Variances are \nexamined from \nnormal operating \nparameters; and \nproduct quality. \n1.2 Extent, cause and \nnature of the \nspecific problem \nare defined \nthrough \nobservation, \ninvestigation and \nanalytical \ntechniques. \n1.3 Problems are \nclearly stated and \nspecified. \n1.1 Competence \nincludes a \nthorough \nknowledge and \nunderstanding of \nthe process, \nnormal operating \nparameters, and \nproduct quality to \nrecognize non-\nstandard situations. \n1.2 Competence to \ninclude the ability \nto apply and \nexplain, enough for \nthe identification of \nfundamental \ncauses of specific \nworkplace \nchallenges. \n1.3 Relevant \nequipment and \noperational \nprocesses. \n1.4 Enterprise goals, \ntargets and \nmeasures. \n1.5 Enterprise quality \nOHS and \nenvironmental \nrequirement. \n1.6 Enterprise \ninformation \nsystems and data \ncollation \n1.7 Industry codes and \nstandards. \n1.1 Using range of \nanalytical techniques \n(e.g., planning, \nattention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation) in \nexamining specific \nchallenges in the \nworkplace. \n1.2 Identifying extent \nand causes of \nspecific challenges in \nthe workplace.\n\n--- PDF PAGE 16 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n12 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n2. Analyze the \ncauses of \nspecific \nworkplace \nchallenges. \n2.1 Possible causes of \nspecific problems \nare identified \nbased on \nexperience and the \nuse of problem \nsolving tools / \nanalytical \ntechniques. \n2.2 Possible cause \nstatements are \ndeveloped based \non findings. \n2.3 Fundamental \ncauses are \nidentified per \nresults of \ninvestigation \nconducted. \n2.1 Competence \nincludes a \nthorough \nknowledge and \nunderstanding of \nthe process, \nnormal operating \nparameters, and \nproduct quality to \nrecognize non-\nstandard situations. \n2.2 Competence to \ninclude the ability \nto apply and \nexplain, sufficient \nfor the identification \nof fundamental \ncause, determining \nthe corrective \naction and \nprovision of \nrecommendations. \n2.3 Relevant \nequipment and \noperational \nprocesses. \n2.4 Enterprise goals, \ntargets and \nmeasures. \n2.5 Enterprise quality \nOSH and \nenvironmental \nrequirement. \n2.6 Enterprise \ninformation \nsystems and data \ncollation. \n2.7 Industry codes and \nstandards. \n2.1 Using range of \nanalytical \ntechniques (e.g., \nplanning, \nattention, \nsimultaneous \nand successive \nprocessing of \ninformation) in \nexamining \nspecific \nchallenges in the \nworkplace. \n2.2 Identifying extent \nand causes of \nspecific \nchallenges in the \nworkplace. \n2.3 Providing clear-\ncut findings on \nthe nature of \neach identified \nworkplace \nchallenges.\n\n--- PDF PAGE 17 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n13 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Formulate \nresolutions \nto specific \nworkplace \nchallenges \n3.1 All possible options \nare considered for \nresolution of the \nproblem. \n3.2 Strengths and \nweaknesses of \npossible options \nare considered. \n3.3 Corrective actions \nare determined to \nresolve the \nproblem and \npossible future \ncauses. \n3.4 Action plans are \ndeveloped \nidentifying \nmeasurable \nobjectives, \nresource needs \nand timelines in \naccordance with \nsafety and \noperating \nprocedures \n3.1 Competence to \ninclude the ability \nto apply and \nexplain, sufficient \nfor the identification \nof fundamental \ncause, determining \nthe corrective \naction and \nprovision of \nrecommendations \n3.2 Relevant \nequipment and \noperational \nprocesses \n3.3 Enterprise goals, \ntargets and \nmeasures \n3.4 Enterprise quality \nOSH and \nenvironmental \nrequirement \n3.5 Principles of \ndecision making \nstrategies and \ntechniques \n3.6 Enterprise \ninformation \nsystems and data \ncollation \n3.7 Industry codes and \nstandards \n3.1 Using range of \nanalytical \ntechniques (e.g., \nplanning, \nattention, \nsimultaneous \nand successive \nprocessing of \ninformation) in \nexamining \nspecific \nchallenges in the \nworkplace. \n3.2 Identifying extent \nand causes of \nspecific \nchallenges in the \nworkplace. \n3.3 Providing clear-\ncut findings on \nthe nature of \neach identified \nworkplace \nchallenges. \n3.4 Devising, \ncommunicating, \nimplementing \nand evaluating \nstrategies and \ntechniques in \naddressing \nspecific \nworkplace \nchallenges.\n\n--- PDF PAGE 18 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n14 \n \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n4. Implement \naction plans \nand \ncommunicate \nresults \n4.1 Action plans are \nimplemented and \nevaluated. \n4.2 Results of plan \nimplementation and \nrecommendations \nare prepared. \n4.2 Recommendations \nare presented to \nappropriate \npersonnel. \n4.3 Recommendations \nare followed-up, if \nrequired. \n4.1 Competence to \ninclude the ability \nto apply and \nexplain, sufficient \nfor the identification \nof fundamental \ncause, determining \nthe corrective \naction and \nprovision of \