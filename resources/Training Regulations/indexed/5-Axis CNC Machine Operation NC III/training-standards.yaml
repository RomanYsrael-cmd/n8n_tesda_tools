\nexamination \n• Demonstration \nwith oral \nquestioning \n1.3 Edit 5-axis CNC program • Explain editing of program \n• Perform simulation \n• Explain procedure in saving \nprogram to the machine \n• Explain of downloading of \nprogram to machine directory \n \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning\n\n--- PDF PAGE 119 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n115 \n \nUnit of Competency \nLearning Outcomes \nLearning Activities \nMethodologies \n• Assessment \nMethods \nNominal \nDuration \n2. Set up 5-axis CNC \nmachine, cutting \ntools and workpiece \n \n2.1 Set-up machine \n \n• Explain types of oil and \ncoolant \n• Explain the standard working \nair and hydraulic pressure \n• Explain and perform setting of \nmachine zero point \n• Identify types of work holding \ndevices \n• Demonstrate how to power up \nmachine. \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning \n \n24 hours \n2.2 Set-up cutting tools \n \n• \nIdentify and select types of \ncutting tools \n• \nPerform mounting of cutting \ntools to the holder \n• \nPerform and explain set-up \nof cutting tools to required \nreference length \n• \nExplain and perform \ndesignated tool assignment \n \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning \n \n2.3 Set-up workpiece \n \n• \nExplain procedures in \nmounting work piece to \nfixture \n• \nExplain and identify types of \nmeasuring tools and \nequipments \n• \nExplain and perform datum \nreferences \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning\n\n--- PDF PAGE 120 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n116 \n \nUnit of Competency \nLearning Outcomes \nLearning Activities \nMethodologies \n• Assessment \nMethods \nNominal \nDuration \n3. Perform 5-axis CNC \nmachine operations \n \n3.1 Machine workpiece \n• \nExplain closing of machine \nguard before starting the \nmachine \n• \nExplain the importance of \nmachine dry run \n• \nExplain editing of tool path \n• \nExplain types of tolerancing \n,kinds of fitting in CNC \nmachining operation \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning \n \n100 hours \n3.2 Monitor machine and tool \nmovements \n• \nMonitoring of parameters \n• \nExplain the importance of \nmaintaining the working air \npressure level \n• \nExplain the importance of \ncooling system \n• \nExplain the importance of \nsharpness of tools \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning \n \n3.3 Check and measure \nwork piece \n \n \n \n• \nPerform open and closing of \nmachine door \n• \nPerform procedure of de \nburring work piece \n• \nExplain and perform \ninspection and measurement \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning\n\n--- PDF PAGE 121 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n117 \n \nUnit of Competency \nLearning Outcomes \nLearning Activities \nMethodologies \n• Assessment \nMethods \nNominal \nDuration \n4. Perform post 5-axis \nCNC machine \noperations \n4.1 Conduct post CNC \noperation \n• Perform and explain loading \nand unloading of workpiece \n• Perform de burring operation \n• Perform and explain final \ninspection of workpiece \n \n• Lecture \n• Practical / \nDemonstration \n \n• Written \nexamination \n• Demonstration \nwith oral \nquestioning \n \n40 hours \n \n4.2 Documentation of \nmachined workpiece \n• Explain the importance of \nsigning out the operation \nsheet \n• Explain the process and \nimportance of accomplishing \nreport \n• Submission of workpiece and \nrepor