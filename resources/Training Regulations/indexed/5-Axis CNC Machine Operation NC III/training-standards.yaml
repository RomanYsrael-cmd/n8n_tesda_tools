  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS \n \nThese standards are set to provide technical and vocational education and training \n(TVET) providers with information and other important requirements to consider when designing \ntraining programs for 5-AXIS CNC MACHINE OPERATION NC III. \n \nThey include information on curriculum design; training delivery; trainee entry \nrequirements; tools and equipment; training facilities; and trainer’s qualification. \n \n3.1 \nCURRICULUM DESIGN \n \n \n \nTESDA shall provide the training on the development of competency-based \ncurricula to enable training providers develop their own curricula with the components \nmentioned below. \n \nDelivery of knowledge requirements for the basic, common and core units of \ncompetency \nspecifically \nin \nthe \nareas \nof \nmathematics, \nscience/technology, \ncommunication/language and other academic subjects shall be contextualized. To this \nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany \ntheir curricula. \n \n \nCourse Title: 5-AXIS CNC MACHINE OPERATION NC III \n \nNominal Training Duration: \n 40 Hours Basic Competencies \n120 Hours Common Competencies \n 272 Hours Core Competencies \n Total 432 Hours \n \n \nCourse Description: \n \nThis course is designed to enhance the knowledge, skill and attitudes of 5-AXIS CNC \nMACHINE OPERATION NC III in accordance with industry standards. This covers \ncompetencies that a person must achieve in writing 5-axis CNC machine program, setting-up \n5-axis CNC machine, workpiece and cutting tools and performing pre and post 5-axis CNC \nmachine operations. \n \n \n \n \nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this \nqualification must be achieve\n\n--- PDF PAGE 99 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n95 \n \n \nBASIC COMPETENCIES \n(40 HOURS) \n \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n1. Lead workplace \ncommunication \n1.1 Communicate \ninformation \nabout \nworkplace \nprocesses \n• Read \n• Lecture \n• Demonstration \n• Practical \nexercises \n• Role Play \n• Written Test \n• Observation \n2 Hours \no Effective verbal communication \nmethods \no Sources of information \n• Practice organizing information \n• Identify organization requirements for \nwritten and electronic communication \nmethods \n• Follow organization requirements for \nthe use of written and electronic \ncommunication methods \n• Perform exercises on understanding \nand conveying intended meaning \nscenario \n \n \n \n1.2 Lead \nworkplace \ndiscussions \n• Describe: \no Organizational policy on production, \nquality and safety \no Goals/ objectives and action plan \nsetting \n• Read \no Effective verbal communication \nmethods \n• Prepare/set action plans based on \norganizational goals and objectives \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral evaluation \n• Written Test \n• Observation \n2 Hours \n \n \n1.3 Identify and \ncommunicate \nissues arising \nin the \nworkplace \n• Describe: \no Organizational policy in dealing with \nissues and problems \n• Read \n• Effective verbal communication \nmethods \n \n• Group \ndiscussion \n• Lecture \n• Oral evaluation \n• Written Test \n2 Hours\n\n--- PDF PAGE 100 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n96 \n \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n2. Lead small \nteams \n2.1 Provide team \nleadership \n \n• Discussion of Company policies and \nprocedures \n• Read web pages on situational \nleadership \n• Role play on situational leadership \n• \nGroup work \n• \nRole Play \n• \nLecture/ \nDiscussion \n• \nIndividual \nWork \n \n• Role Play \n• Written Test \n \n1 Hour \n \n2.2 Assign \nresponsibilities \n• Read web pages on performance \nmanagement \n• Case study on allocating roles and \nresponsibilities based on competencies \nof current staff \n \n• Individual Work \n• Case Study \n• Role Play \n• Written Test \n \n1 Hour \n \n2.3 Set \nperformance \nexpectations \nfor team \nmembers \n• Role play to communicate performance \nexpectations with staff \n• Discussion on performance issues \n \n• Lecture/ \nDiscussion \n• Role Play \n• Role Play \n• Written Test \n \n1 Hour \n \n2.4 Supervise \nteam \nperformance \n• Discussion on performance monitoring \n• Role play on providing feedback on \nperformance \n• Role play on performance coaching \n• Discussion on keeping the team \ninformed of team performance \n• Case study on Team performance \nmonitoring and feedback \n• Lecture/ \nDiscussion \n• Role Play \n• Case Study \n• Role Play \n• Written Test \n \n1 Hour \n3. Apply critical \nthinking and \nproblem-\nsolving \ntechniques in \nthe workplace \n3.1 Examine \nspecific \nworkplace \nstrategies \n \n \n \n \n• Show thorough knowledge and \nunderstanding of the process, normal \noperating parameters, and product \nquality to recognize non-standard \nsituations \n• Show mastery of the current industry \nhardware and software products and \nservices \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role playing \n• Case Formulation \n• Life Narrative \nInquiry (Interview) \n• Standardized test \n1 Hour\n\n--- PDF PAGE 101 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n97 \n \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n• Discuss process of identification of \nfundamental causes of specific \nworkplace challenges \n• Show mastery of knowledge and \nunderstanding of the process, normal \noperating parameters, and product \nquality to recognize non-standard \nsituations \n- Relevant equipment and \noperational processes \n- Enterprise goals, targets and \nmeasures \n- Enterprise quality OHS and \nenvironmental requirement \n- Enterprise information systems and \ndata collation \n- Industry codes and standards \n \n3.2 Analyze the \ncauses of \nspecific \nworkplace \nchallenges \n \n• Show thorough knowledge and \nunderstanding of the process, normal \noperating parameters, and product \nquality to recognize non-standard \nsituations \n• Show mastery of the current industry \nhardware and software products and \nservices \n• Discuss process of identification of \nfundamental causes of specific \nworkplace challenges \n• Show mastery of knowledge and \nunderstanding of the process, normal \noperating parameters, and product \nquality to recognize non-standard \nsituations \n- Relevant equipment and \noperational processes \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role playing \n• Case Formulation \n• Life Narrative \nInquiry (Interview) \n• Standardized test \n1 Hour\n\n--- PDF PAGE 102 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n98 \n \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n- Enterprise goals, targets and \nmeasures \n- Enterprise quality OHS and \nenvironmental requirement \n- Enterprise information systems and \ndata collation \n- Industry codes and standards \n• Identify extent and causes of specific \nchallenges in the workplace \n• Use of range of analytical problem-\nsolving techniques \n• Formulate clear-cut findings on the \nnature of each identified workplace \nchallenges \n \n \n \n \n \n \n3.3 Formulate \nresolutions to \nspecific \nworkplace \nchallenges \n \n• Show thorough knowledge and \nunderstanding of the process, normal \noperating parameters, and product \nquality to recognize non-standard \nsituations \n• Show mastery of the current industry \nhardware and software products and \nservices \n• Discuss process of identification of \nfundamental causes of specific \nworkplace challenges \n• Show mastery of knowledge and \nunderstanding of the process, normal \noperating parameters, and product \nquality to recognize non-standard \nsituations \n- Relevant equipment and \noperational processes \n- Enterprise goals, targets and \nmeasures \n- Enterprise quality OHS and \nenvironmental requirement \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role playing \n• Case Formulation \n• Life Narrative \nInquiry (Interview) \n• Standardized test \n \n \n \n1 Hour\n\n--- PDF PAGE 103 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n99 \n \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n- Enterprise information systems and \ndata collation \n- Industry codes and standards \n• Identify extent and causes of specific \nchallenges in the workplace \n• Use of range of analytical problem-\nsolving techniques \n• Formulate clear-cut findings on the \nnature of each identified workplace \nchallenges \n• Discus strategies on devising, \ncommunicating, implementing and \nevaluating strategies and techniques in \naddressing specific workplace \nchallenges \n \n \n3.4 Implement \naction \nplans and \ncommunicate \nresults \n• Identify extent and causes of specific \nchallenges in the workplace \n• Use of range of analytical problem-\nsolving techniques \n• Formulate clear-cut findings on the \nnature of each identified workplace \nchallenges \n• Discus strategies on devising, \ncommunicating, implementing and \nevaluating strategies and techniques in \naddressing specific workplace \nchallenges \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role playing \n• Case Formulation \n• Life Narrative \nInquiry (Interview) \n• Standardized test \n1 Hour \n4. Work in a \ndiverse \nenvironment \n \n4.1 Develop an \nindividual’s \ncultural \nawareness \nand sensitivity \n• Show understanding of cultural \ndiversity in the workplace \n• Recognize norms of behavior for \ninteracting and dialogue with specific \ngroups (e. g., Muslims and other non-\nChristians, non-Catholics, tribes/ethnic \ngroups, foreigners) \n• Small Group \nDiscussion \n• Interactive \nLecture \n• Brainstorming \n• Demonstration \n• Role-playing \n• Demonstration or \nsimulation with oral \nquestioning \n• Group discussions \nand interactive \nactivities \n• Case studies/ \nproblems involving \n1 Hour\n\n--- PDF PAGE 104 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n100 \n \nUnit of \nCompetency \nLearning \nOutcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n• Demonstrate different methods of \nverbal and non-verbal communication \nin a multicultural setting \n• Apply cross-cultural communication \nskills (i.e. different business customs, \nbeliefs, communication strategies) \n• Show affective skills – establishing \nrapport and empathy, understanding, \netc. \n• Demonstrate openness and flexibility \nin communication \n• Recognize diverse groups in the \nworkplace and community as defined \nby divergent culture, religion, traditions \nand practices \n \nworkplace diversity \nissues \n• Written \nexamination \n• Role Playing \n \n4.2 Work \neffectively in \nan \nenvironment \nthat \nacknowledges \nand values \ncultural \ndiversity \n• Explain the value of diversity in the \neconomy and society in terms of \nWorkforce development \n• Discuss the importance of \ninclusiveness in a diverse environment \n• Discuss the importance of shared \nvision and understanding of and \ncommitment to team, departmental, \nand organizational goals and \nobjectives \n• Identify and exhibit strategies for \ncustomer service excellence \n• Demonstrate cross-cultural \ncommunication skills and active \nlistening \n• Recognize diverse groups in the \nworkplace and community as defined \nby d