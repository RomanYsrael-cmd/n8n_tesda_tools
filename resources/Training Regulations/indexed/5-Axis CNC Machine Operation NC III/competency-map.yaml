  "source_text": "SECTION 1 5- AXIS CNC MACHINE OPERATION NC III QUALIFICATION\n\nThe 5-Axis CNC Machine Operation NC III Qualification consists of competencies that\na person must achieve to write advance CNC program, set up machine, work piece and cutting\ntools and perform 5-axis CNC machine operations and conduct final inspection on work piece.\n\nCODE NO.\n\nBASIC COMPETENCIES\n400311319\nLead workplace communication\n400311320\nLead small teams\n400311321\n400311322\nApply critical thinking and problem-solving techniques in the workplace\nWork in a diverse environment\n400311323\n400311324\n400311325\n400311326\n400311327\nPropose methods of applying learning and innovation in the organization\nUse information systematically\nEvaluate occupational safety and health work practices\nEvaluate environmental work practices\nFacilitate entrepreneurial skills for micro-small-medium enterprises (MSMEs)\n\nCODE NO.\nCOMMON COMPETENCIES\n\nMEE722201\nApply safety practices\n\nMEE722202\nInterpret working drawings and sketches\n\nMEE722203\nSelect/ cut workshop materials\n\nMEE722204\nPerform shop computations (Basic)\n\nMEE722205\nMEE722206\nMeasure workpiece (Basic)\nPerform routine housekeeping\n\nMEE722207\nPerform shop computations (Intermediate)\n\nMEE722208\nMeasure workpiece using angular measuring instruments\nMEE722210\nMeasure workpiece using gages and surface texture\ncomparator\n\nMEE722211\nICT311201\nPerform preventive and corrective maintenance\nOperate a personal computer\n\n\n\n\nCODE NO.\nCORE COMPETENCIES\nMEE 821321\nWrite 5-axis CNC machine program\nMEE 821322\nSet-up 5-axis CNC machine, cutting tools and workpiece\nMEE 821323\nPerform 5-axis CNC machine operations\nMEE 821324\nPerform post 5-axis CNC machine operations\n\nA person who has achieved this Qualification is competent to be:\n\n• 5-Axis CNC Machine Programmer\n• 5-Axis CNC Machine Operator\n• CNC Lathe Machine Operator\n• CNC Milling Machine Operator\n\n--- PDF PAGE 6 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019)\n\n2"
