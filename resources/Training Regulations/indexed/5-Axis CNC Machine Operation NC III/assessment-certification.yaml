igh \nperforming \nteams \nEvaluate \nhigher order \nthinking skills \nand adjust \nproblem \nsolving \ntechniques \nAdvocate \nstrategic \nthinking for \nglobal \ncitizenship \nIncorporate \ninnovation \ninto work \nprocedures \nDevelop \nsystems in \nmanaging, \nand \nmaintaining \ninformation \nManage \nImplementation of \nOSH programs in \nthe workplace \nManage \nimplementation \nof \nenvironmental \nprogram in the \nworkplace \nDevelop and \nsustain a high-\nperforming \nenterprise\n\n--- PDF PAGE 132 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n128 \n \n \n \n \n \n \n \n \n \nApply safety practices \nInterpret working drawings \nand sketches \nSelect/ cut workshop \nmaterials \nPerform shop computations \n(Basic) \nMeasure workpiece (Basic) \nPerform routine \nhousekeeping \n \nPerform shop computations \n(Intermediate) \nMeasure workpiece using \nangular measuring \ninstruments \nPerform shop computations \n(Advanced) \nMeasure workpiece using \ngages and surface texture \ncomparator \nPerform preventive and \ncorrective maintenance \nOperate a personal \ncomputer \nSelect and cut workshop \nmaterials \nPrepare cost estimates \nApply Safety Practices \nInterpret Drawings and \nSketches \nPerform Industry Calculations \nContribute to Quality System \nUse Hand Tools \nPrepare Weld Materials \nSetup Welding Equipment \nFit up Weld Materials \nRepair Welds \nPerform shop computations \n(Intermediate) \nMeasure workpiece \n(Intermediate) \nPerform preventive and \ncorrective Maintenance \n \nCOMMON COMPETENCIES\n\n--- PDF PAGE 133 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n129 \n \nCreate drawing using CAD \nsoftware \nApply CAD/CAM program \nWrite basic CNC lathe \nmachine program \nSet-up CNC lathe machine, \nworkpiece and cutting tools \nPerform basic CNC lathe \nmachine operations \nWrite advanced CNC lathe \nmachine program \nSet-up multiple-axis CNC \nlathe machine, workpiece and \ncutting tools \nPerform advanced CNC lathe \nmachine operations \nWrite basic CNC milling \nmachine program \nSet-up CNC milling machine, \nworkpiece and cutting tools \nPerform basic CNC milling \nmachine operations \nWrite advanced CNC milling \nmachine program \nSet-up multiple-axis CNC \nmilling machine, workpiece and \ncutting tools \nPerform advanced CNC \nmilling machine operations \nWeld Carbon Steel Plates \nUsing FCAW \nWeld Carbon Steel Pipes \nUsing FCAW \nWeld Alloy Steel Plates Using \nFCAW \nWeld Alloy Steel Pipes Using \nFCAW \nPerform Gas Welding in \nCarbon Steel Plates and \nTubes \nPerform Gas Welding in Alloy \nSteel Plates and Tubes \nWeld Carbon Steel Plates \nUsing GMAW \n \nWeld Carbon Steel Pipes \nUsing GMAW \nWeld Alloy Steel Plates Using \nGMAW \nWeld Alloy Steel Pipes Using \nGMAW \nWeld Carbon Steel Plates \nUsing GTAW \nWeld Carbon Steel Pipes \nUsing GTAW \nWeld Alloy Steel Plates Using \nGTAW \nWeld Alloy Steel Pipes Using \nGTAW \nPerform bench work (Basic) \nTurn workpiece \nMill workpiece \nGrind workpiece \nShape workpiece \nRepair workpiece \nPerform bench work (Basic) \nPerform bench work \n(Complex) \nTurn workpiece (Basic) \nTurn workpiece \n(Intermediate) \nMill workpiece (Basic) \nMill workpiece (Intermediate) \n \nCORE COMPETENCIES\n\n--- PDF PAGE 134 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n130 \n \nGrind workpiece (Basic) \nGrind workpiece (Complex) \nTurn workpiece (Advanced) \nMill workpiece (Advanced) \nPrepare basic engineering \ndrafting \nPerform basic engineering \ndetail drafting \nPerform Preventive \nMaintenance \nPerform Planned and \nUnplanned (Emergency) \nMaintenance \nFabricate Simple Items \nInstall Machinery \n Perform press machine \nsetting \n Perform mechanical press \noperation \nWeld Plates Using SAW \nWeld Pipes Using SAW \nWeld Carbon Steel Plates \nUsing SMAW \nWeld Carbon Steel Plates \nand Pipes Using SMAW \nWeld Alloy Steel Plates Using \nSMAW \nWeld Alloy Steel Pipes Using \nSMAW \nMachine Die Components \nFit and Assemble Dies \nTest and Try Die \nMachine mold components \n \nImplement surface finishing \n \nFit and assemble mold \n \nRectify mold flaws \nWrite 5-axis CNC machine \nprogram \nSet-up 5-axis CNC \nmachine, cutting tools and \nworkpiece \nPerform 5-axis CNC \nmachine operations \nPerform post 5-axis CNC \nmachine operations \n \nCORE COMPETENCIES\n\n--- PDF PAGE 135 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/20) \n \n131 \n \n \nGLOSSARY OF TERMS \n \n1. 5-axis CNC \n(Computerized \nNumerical Control) \nMachine \n \nThe automation of machine tools that are operated by precisely \nprogrammed commands encoded on a storage medium, as opposed to \ncontrolled manually via hand wheels or levers \n2. Machine coordinate \nsystem \nA point of reference in this system of coordinates is known as machine \nzero-point \n \n3. Work piece \ncoordinate system \nA system of coordinates taking this point as reference is called the work \npiece coordinates system \n \n4. Machine Zero \nThe position located at the farthest possible distance in a positive \ndirection along the X-, Y-, and Z-axes. This position is permanently set \nfor each particular CNC machine \n \n \n5. Micrometer \nA hand-held measuring device used to inspect the dimensions of parts. \nThy typical micrometer is accurate within 0.001 in. or 0.02 mm \n \n6. Mode \nA machine state that determines the way it executes manual and \nautomatic commands \n \n7. Optional Stop \nA code that pauses the program if the appropriate switch is selected on \nthe machine. Optional Stop allows the operator to inspect the machine \nbetween operations \n \n8. Override \nA control that adjusts a programmed speed or feed rate by a certain \npercentage during operation \n \n9. Part Program \nA series of numerical instructions used by a CNC machine to perform \nthe necessary sequence of operations to machine a specific work piece \n \n10. Part Programmer \nThe person responsible for the creation of a part program. The part \nprogrammer translates the work piece design into program instructions \nfor the CNC machine \n \n11. Proving Out \nRunning a program one block at a time in order to check for accuracy \nand proper tool set-up \n \n12. Cycle Start \nThe control used to begin a program or continue a program that has \nbeen previously stopped \n \n13. Cycle Stop \nThe control used to pause a program. Cycle Stop pauses tool feed but \ndoes not stop spindle movement\n\n--- PDF PAGE 136 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n132 \n \n14. Dry Running \nPerforming a trial run of the part program without any parts or cutting \nfluids to check the program \n \n15. Edit Mode \nThe mode that allows an operator an operator to make changes to a \npart program and store those changes \n \n16. Emergency Stop \nThe control that automatically shuts down all machine functions \n \n17. Feed rate Override \nAn override that allows the operator to adjust the feed rate of the tool \nduring operation. The override functions as a percentage of the \nprogrammed value \n \n18. Handle Mode \nThe mode that allows for the manual operation of tool movement via the \nhand wheel. Some machines may have a combined handle/jog mode \n \n19. Rapid Feed Rate \nOverride \nAn override that allows the operator to reduce the rate of rapid tool \nmovement during operation. A rapid override may be 25% of the original \nrate or less \n \n20. Rapid Mode \nThe mode that allows for the manual movement of machine components \nat high rates of travel \n \n21. Tolerance \nThe unwanted but acceptable deviation from a desired dimension \n \n22. Tool Offset \nA stored value that compensates for variations in tool length. Each tool \nrequires an offset, which is measured from the turret or spindle position \n \n23. Zero return \nThe control that automatically locates the turret or spindle in the \nmachine zero position\n\n--- PDF PAGE 137 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n133 \n \n \n \nTRAINING REGULATIONS (TR) \nDOCUMENT REVISION HISTORY \n \n \n \n \nQualification Title: \n5-AXIS CNC MACHINE OPERATION NC III \n \nQualification Code: \nMEEAMO319 \n \n \n \n \n \nRevision \nNo. \nDocument \nTypes* \nQualification Title \nTESDA Board \nResolution No./ \nDate \nDeployment \n(TESDA Circular/ \nImplementing \nGuidelines) \n00 \nDocument Created \n \n5-axis CNC \nMachine Operation \nNC IIII \n2019-30/ \n05-21-2019 \n \nLegend: *Description Types \n \n- Document Created\n\n--- PDF PAGE 138 ---\n5- Axis CNC Machine Operation NC III Revision 00 Promulgated (05/21/2019) \n \n134 \n \n \nACKNOWLEDGMENTS \n \n \nThe Technical Education and Skills Development Authority (TESDA) wishes to \nextend thanks and appreciation to the many representatives of business, industry, academe \nand government agencies who donated their time and expertise to the development and \nvalidation of these Training Regulations. \n \n \nTECHNICAL EXPERTS/TESDA EXPERTS PANEL \n \n \nMR. HECTOR D. MALONZO \nHDM TECHNOLOGIES INC., \nCHAIRMAN \nMetalworking Industry Association of \nthe Phil. (MIAP)Treasurer \n \nMR. ERNESTO C. LAURENTE, JR. \nMetalworking Industry Association of \nthe Phil. (MIAP) Manila Chapter \nTESDA Accredited Trainer \nMR. VALENTIN P. CACHO \nMetalworking Industry Association of \nthe Phil. (MIAP) Manila Chapter \nWorkshop Instructor \nMR. RAUL B. SAMSON \nFamous Secret Precision Machining \nInc. Department Head AERO Group \nMetalworking Industry Association of \nthe Phil. (MIAP) \nTESDA Accredited Trainer and \nAssessor \n \n \n \nThe PARTICIPANTS in the Validation of this Training Regulations \n \n• MESCO Inc. \nPasig City \n \n• TECHLINE MACHINE TOOLS \nLaguna Technopark Binan, Laguna \n \n• DOST / MIRDC \nGen. Santos Ave., Bicutan, Taguig City \n \n• PENTA TECHNOLOGY INC. \nMetropolitan Ave., Makati City \n \n• ROSCO MACHINE SHO