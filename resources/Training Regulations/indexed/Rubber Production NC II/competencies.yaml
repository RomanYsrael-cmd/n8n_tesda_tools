        "source_text": "AGR321202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to use farm tools and equipment. It\nincludes\nselection,\noperation\nand\npreventive\nmaintenance of farm tools and equipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select and use\nfarm tools\n1.1 Appropriate farm\ntools are identified\naccording to\nrequirement/use\n1.2 Farm tools are\nchecked for faults\nand defective tools\nreported in\naccordance with\nfarm procedures\n1.3 Appropriate tools\nare safely used\naccording to job\nrequirements and\nmanufacturers\nconditions\n1.1 Types and uses\nof farm tools\n1.2 Characteristics of\nfunctional tools\n1.3 Checking tools for\ndefects/faults\n1.4 Segregation and\nreporting\ndefective tools\n1.5 Uses of tools and\nequipment\n1.1 Identifying farm\ntools for the work\n1.2 Checking the\nconditions of\ntools\n1.3 Reporting\ndefective tools\n1.4 Using tools\n2. Select and operate\nfarm equipment\n2.1 Identify appropriate\nfarm equipment\n2.2 Instructional\nmanual of the farm\ntools and\nequipment are\ncarefully read prior\nto operation\n2.3 Pre-operation\ncheck-up is\nconducted in line\nwith manufacturers\nmanual\n2.4 Faults in farm\nequipment are\nidentified and\nreported in line with\nfarm procedures\n2.5 Farm equipment\nused according to\nits function\n2.6 Safety procedures\n2.1 Types and\noperations of farm\nequipment\n2.2 Standards\noperating\nprocedures of\nfarm equipment\n2.3 Instructional\nmanual of\nequipment\n2.4 Pre-operation\ncheck-up\n2.5 Equipment\nSpecification\n2.6 Procedures in\ncalibrating and\nuse of equipment\n2.7 Equipment faults\nidentification and\nreporting\n2.8 Operation of\nequipment\n2.1 Identifying\nappropriate farm\nequipment for\nthe work\n2.2 Reading\ninstructional\nmanual.\n2.3 Conducting pre-\noperation check-\nup\n2.4 Identifying\nfaults/defects of\nfarm equipment\n2.5 Reporting on\ndefective farm\nequipment\n2.6 Operating farm\nequipment\n2.7 Following safety\nprocedures.\n\n--- PDF PAGE 47 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 43\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nare followed.\n2.9 Codes and\nRegulations on\nenvironmental\nprotection\n2.10 Safety and\nkeeping of\nequipment every\nafter use\n2.11 Safety measures\n3. Perform preventive\nmaintenance\n3.1 Tools and\nequipment are\ncleaned\nimmediately after\nuse in line with farm\nprocedures\n3.2 Routine check-up\nand maintenance\nare performed\n3.3 Tools and\nequipment are\nstored in\ndesignated areas in\nline with farm\nprocedures\n3.1 Cleaning\nprocedures of\ntools and\nequipment\n3.2 Maintenance\nprocedures of\nfarm equipment\n3.3 Storage of tools\nand equipment\n3.4 Designated\nstorage areas\n3.1 Cleaning tools\nand equipment\n3.2 Performing\nroutinary check-\nup of tools and\nequipment\n3.3 Maintaining farm\nequipment\n3.4 Storing tools and\nequipment\n\n--- PDF PAGE 48 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 44\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Farm equipment\nFarm equipment include:\n1.1 Engine\n1.2 Pumps\n1.3 Generators\n1.4 Sprayers\n2. Farm tools\nFarm tools includes:\n2.1 Sickle\n2.2 Cutters\n2.3 Weighing scales\n2.4 Hand tools\n2.5 Measuring tools\n2.5.1 Garden tools\n3. Pre-operation check-up\nPre-operation check–up includes:\n3.1 Tires\n3.2 Brake fluid\n3.3 Fuel\n3.4 Water\n3.5 Oil\n3.6 Lubricants\n3.7 Battery\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Correctly identified appropriate farm tools and equipment\n1.2 Operated farm equipment according to manual\nspecification\n1.3 Performed preventive maintenance\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Service/operational manual of farm tools and equipment\n2.2 Tools and equipment\n2.3 Farm implements\n3. Method of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Direct observation\n3.2 Practical demonstration\n3.3 Third Party Report\n4. Context of\nAssessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 49 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 45\n\nUNIT OF COMPETENCY\n:\nPERFORM ESTIMATION AND BASIC\nCALCULATION\n\nUNIT CODE\n:"
