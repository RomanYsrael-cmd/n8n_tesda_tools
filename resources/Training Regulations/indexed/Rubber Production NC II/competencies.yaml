        "source_text": "AFF611317\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills required\nto select planting site, conduct land preparation,\nperform site laying-out and staking, plant poly-\nbagged budded rubber seedling and perform\nmaintenance activities.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select planting site\n1.1 Site inspection and\nvalidation was\nconducted based\non industry\nstandards.\n1.2 Suitability of area\nis determined as\nrubber farm\nfollowing industry\npractice.\n1.3 Updates and\ninformation on\nclimatic condition\nwas obtained based\non industry\nstandards.\n1.4 Soil sampling are\nconducted for\nlaboratory soil\nanalysis.\n1.5 Result of soil\nanalysis are used to\ndetermine soil\nnutrient deficiency.\n1.1 Procedures of site\ninspection and\nvalidation\n1.2 Suitability of area\n1.3 Updates and\ninformation on\nweather condition\n1.4 Soil sampling\nprocedure\n1.5 Result of soil\nanalysis\n1.6 OSHS\n1.1 Conducting site\ninspection and\nvalidation\n1.2 Checking water\ntable\n1.3 Determining\nsuitability of area\n1.4 Obtaining\nupdates and\ninformation on\nweather\ncondition\n1.5 Conducting soil\nsampling\n1.6 Using result of\nsoil analysis\n1.7 Applying OSHS\n2. Conduct land\npreparation\n2.1 Clearing operation\nis performed\naccording to\nindustry standards.\n2.2 Equipment service\nwas sourced out\nbased on work\nrequirements.\n2.3 Land preparation\nactivities are done\nfollowing industry\nestablished\npractices.\n2.1 Clearing\noperation\n2.2 Sourcing of\nequipment\nservice\n2.3 Land preparation\nactivities\n2.4 Establishment of\ndrainage canal to\nprevent water\nlogging\n2.5 Farm practices of\nsecuring farm\n2.1 Performing\nclearing\noperation\n2.2 Sourcing\nequipment\nservice\n2.3 Communicating\nwith equipment\nservice provider\n2.4 Preparing land\n2.5 Establishing\ndrainage canal\n2.6 Securing area\n\n--- PDF PAGE 70 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 66\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.4 Drainage canal was\nestablished to\nprevent water\nlogging.\n2.5 Canals were\nestablished to\nensure water\ndrainage.\n2.6 Area was secured\nthrough fencing\nfollowing\nestablished farm\npractices.\n2.7 Safety practices are\napplied based on\nOSHS.\narea\n2.6 OSHS on land\npreparation\nthrough fencing\n2.7 Employing\nOSHS\n3. Conduct layouting\nand staking\n3.1 Tools, materials\nand supplies are\nprepared according\nto work requirement\nand plan.\n3.2 Line staking are\nused for\nestablishing\nbaseline according\nto industry\nstandards.\n3.3 Measurement and\nstaking are\nperformed based\non plan.\n3.4 Safety practices are\nemployed based on\nOSHS.\n3.1 Types and uses\nof tools, materials\nand supplies for\nlayouting\n3.2 Line staking\nprocedures\n3.3 Industry\nstandards\n3.4 Measurement and\nstaking\n3.5 Quincux layouting\n3.6 OSHS\n3.1 Preparing tools,\nmaterials and\nsupplies\n3.2 Using line\nstaking for\nbaseline\nestablishment\n3.3 Performing\nmeasurement\nand staking\n3.4 Practicing OSHS\n4. Perform holing\n4.1 Tools and\nmaterials are\nprepared according\nwork requirements.\n4.2 Equipment and\nmanpower services\nare sourced out\nbased on work\nrequirements.\n4.3 Hole is dug\nfollowing industry\nstandards.\n4.4 Safety measures\nare practiced\nfollowing OSHS.\n4.1 Tools and\nmaterials for\nholing\n4.2 Sourcing out of\nequipment and\nmanpower\nservices\n4.3 Hole digging\nprocedure\n4.4 OSHS for holing\nactivities\n4.1 Preparing tools\nand materials\n4.2 Sourcing out\nequipment and\nmanpower\nservices\n4.3 Digging hole\n4.4 Practicing safety\nmeasures\n\n--- PDF PAGE 71 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 67\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS