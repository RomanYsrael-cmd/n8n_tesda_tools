        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Established budwood garden\n1.1.1 Collected soil.\n1.1.2 Performed land preparation.\n1.1.3 Conducted lay-outing.\n1.1.4 Performed holing.\n1.1.5 Planted true to type NSIC registered budded\nplanting materials.\n1.1.6 Established drainage canal.\n1.1.7 Applied safety practices.\n\n1.2 Maintained plant\n1.2.1 Applied fertilizer.\n1.2.2 Carried-out watering.\n1.2.3 Applied pesticides.\n1.2.4 Applied disease management.\n1.2.5 Controlled weeds.\n1.2.6 Performed pruning.\n1.2.7 Conducted regular monitoring.\n1.2.8 Disposed wastes.\n1.2.9 Performed reporting.\n1.2.10 Applied safety practices.\n\n1.3 Harvested budstick\n1.3.1 Prepared tools and materials.\n1.3.2 Selected quality budstick.\n1.3.3 Applied harvesting techniques.\n1.3.4 Performed packing.\n1.3.5 Handled and hauled budsticks.\n1.3.6 Performed record keeping.\n1.3.7 Applied safety practices.\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Actual and simulated workplace\n2.2 Materials, tools, and equipment needed to perform the\nrequired task\n2.3 References and manuals\n2.4 PPEs\n2.5 First aid kit\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration/ observation with oral questioning\n3.2 Written exam\n3.3 Oral questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 57 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 53\n\nUNIT OF COMPETENCY\n:\nESTABLISH RUBBER NURSERY\n\nUNIT CODE\n:"
        },
        "source_text": "AFF611314\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to establish budwood garden, maintain\nplant, harvest budstick and market budsticks.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Establish budwood\ngarden\n1.1 Soil is collected for\nlaboratory analysis.\n1.2 Land preparation is\nperformed following\nindustry standards.\n1.3 Lay-outing is\nconducted following\nthe industry\nstandards.\n1.4 Holing is performed\naccording to\nindustry standards.\n1.5 True to type NSIC\nregistered planting\nmaterials are\nplanted based on\nindustry standards.\n1.6 Drainage canal is\nestablished based\non soil terrain.\n1.7 Safety practices are\napplied based on\nOSHS.\n1.1 Soil moisture\n1.2 Soil sampling\n1.3 Land preparation\n1.4 Reading and\ninterpreting lay-\nout plan\n1.5 Lay-outing\ndimension\n1.6 Line staking\n1.7 Measurement\ntools\n1.8 Digging tools\n1.9 Holing procedure\n1.10 True-to-type\nrubber budded\nplanting materials\n1.11 Planting\ntechniques\n1.12 PhilGAP on\nNatural Rubber\n1.13 OSHS\n1.1 Preparing land\n1.2 Mensuration\nskills\n1.3 Lay-outing skills\n1.4 Line staking\nskills\n1.5 Using\nmeasurement\ntools\n1.6 Using digging\ntools\n1.7 Digging holes\n1.8 Planting true-to-\ntype rubber\nbudded planting\nmaterials\n1.9 Applying safety\npractices\n2. Maintain plant\n2.1 Fertilizer is applied\naccording to plant\nrequirement.\n2.2 Watering is carried-\nout according to\nplant requirement\nand soil moisture.\n2.3 Pesticides are\napplied based on\npest and disease\nmanagement.\n2.4 Disease\nmanagement is\napplied based on\n2.1 Weed control\n2.2 PNS/ BAFS 183:\n2016\n2.2.1 Pest\nManage-\nment\n2.3 Pesticides\n2.4 Waste\nmanagement\n2.5 Weed control\n2.6 Monitoring\nprocedures\n2.7 OSHS\n2.8 Record keeping\n2.1 Sampling soil\n2.2 Checking soil\nmoisture\n2.3 Applying fertilizer\n2.4 Watering plant\n2.5 Applying weed\ncontrol\n2.6 Conducting\nmonitoring\nactivities\n2.7 Disposing\nwastes\n2.8 Applying OSHS\n\n--- PDF PAGE 53 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 49\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ndisease\noccurrence.\n2.5 Weeds are\ncontrolled following\nindustry standards.\n2.6 Pruning is\nperformed following\nindustry standards.\n2.7 Regular monitoring\nis conducted based\non industry\nstandards.\n2.8 Wastes are\ndisposed following\nwaste\nmanagement.\n2.9 Reporting is\nperformed following\nindustry standards.\n2.10 Safety practices\nare applied based\non OSHS.\n2.9 Reporting\nprocedure\n3. Harvest budstick\n3.1 Tools and\nmaterials are\nprepared following\nindustry standards.\n3.2 Quality budstick is\nselected based on\nindustry standards.\n3.3 Harvesting\ntechniques are\napplied following\nindustry standards.\n3.4 Packing is\nperformed based\non established\nindustry practices.\n3.5 Budsticks are\nhandled and\nhauled following\nestablished industry\npractices.\n3.6 Record keeping is\nperformed following\nindustry standards.\n3.7 Safety practices are\napplied following\nOSHS.\n3.1 Preparation of\nharvesting tools\nand materials\n3.2 Features of\nquality budstick\n3.3 Harvesting\ntechniques\n3.4 Harvest for a day\nconsumption\n3.5 Utilization of\nharvesting tools\n3.6 Packing\ntechniques and\nprocedures for\nbudstick\n3.7 Handling of\nbudsticks\n3.8 Record keeping\n3.9 OSHS\n3.1 Preparing and\nchecking\nfunctionality of\ntools.\n3.2 Preparing\nmaterials\n3.3 Selecting quality\nbudstick\n3.4 Applying\nharvesting\ntechniques\n3.5 Utilizing\nharvesting tools\n3.6 Packing budstick\n3.7 Performing\nrecord keeping\n3.8 Applying safety\npractices\n\n--- PDF PAGE 54 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 50\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Lay-outing\nMay include:\n1.1 Measurement of distance\n1.2 Line staking\n1.3 Determining East-West orientation on flat areas\n2. Pesticides\nMay include:\n2.1 Fungicide\n2.2 Insecticide\n2.3 Rodenticide\n3. Tools and materials\nMay include:\n3.1 Tools\n3.1.1 Shovel\n3.1.2 Digging bar\n3.1.3 Measuring steel tape\n3.1.4 Handsaw\n3.1.5 Pruning shear\n3.1.6 Bolo\n\n3.2 Materials\n3.2.1 Stick\n3.2.2 Rope\n3.2.3 Fertilizer\n3.2.4 Fungicide\n3.2.5 Insecticide\n3.2.6 Rodenticide\n3.2.7 Record book\n3.2.8 Garbage bin\n3.2.9 Packing materials:\n3.2.9.1 Jute sack\n3.2.9.2 Twine\n3.2.9.3 Cellophane\n3.2.9.4 Box\n3.2.9.5 Used paper\n3.2.9.6 Packaging tape\n4. Quality budstick\nMay include:\n4.1 Matured top whorl leaves\n4.2 Size matching to rootstock\n5. Harvesting techniques\nMay include:\n5.1 Clone segregation\n5.2 Early in the morning with favorable weather\ncondition\n5.3 Budstick shall match the rootstock\n6. Handling of budsticks\nMay include:\n6.1 Placement in damped jute sack, wrapped with used\npaper or cellophane, boxed, taped, and tied\nproperly\n6.2 Avoid exposure to sunlight\n6.3 Maintain moisture\n\n--- PDF PAGE 55 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 51\nVARIABLE\nRANGE\n6.4 Provide cushion to avoid bruising\n\n--- PDF PAGE 56 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 52\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Established budwood garden\n1.1.1 Collected soil.\n1.1.2 Performed land preparation.\n1.1.3 Conducted lay-outing.\n1.1.4 Performed holing.\n1.1.5 Planted true to type NSIC registered budded\nplanting materials.\n1.1.6 Established drainage canal.\n1.1.7 Applied safety practices.\n\n1.2 Maintained plant\n1.2.1 Applied fertilizer.\n1.2.2 Carried-out watering.\n1.2.3 Applied pesticides.\n1.2.4 Applied disease management.\n1.2.5 Controlled weeds.\n1.2.6 Performed pruning.\n1.2.7 Conducted regular monitoring.\n1.2.8 Disposed wastes.\n1.2.9 Performed reporting.\n1.2.10 Applied safety practices.\n\n1.3 Harvested budstick\n1.3.1 Prepared tools and materials.\n1.3.2 Selected quality budstick.\n1.3.3 Applied harvesting techniques.\n1.3.4 Performed packing.\n1.3.5 Handled and hauled budsticks.\n1.3.6 Performed record keeping.\n1.3.7 Applied safety practices.\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Actual and simulated workplace\n2.2 Materials, tools, and equipment needed to perform the\nrequired task\n2.3 References and manuals\n2.4 PPEs\n2.5 First aid kit\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration/ observation with oral questioning\n3.2 Written exam\n3.3 Oral questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 57 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 53\n\nUNIT OF COMPETENCY\n:\nESTABLISH RUBBER NURSERY\n\nUNIT CODE\n:"
