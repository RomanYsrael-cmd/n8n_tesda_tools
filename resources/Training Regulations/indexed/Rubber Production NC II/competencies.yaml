          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Correctly identified appropriate farm tools and equipment\n1.2 Operated farm equipment according to manual\nspecification\n1.3 Performed preventive maintenance\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Service/operational manual of farm tools and equipment\n2.2 Tools and equipment\n2.3 Farm implements\n3. Method of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Direct observation\n3.2 Practical demonstration\n3.3 Third Party Report\n4. Context of\nAssessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 49 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 45\n\nUNIT OF COMPETENCY\n:\nPERFORM ESTIMATION AND BASIC\nCALCULATION\n\nUNIT CODE\n:"
