        "source_text": "AGR321203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to perform basic workplace calculations.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform estimation\n1.1 Job requirements\nare identified from\nwritten or oral\ncommunications.\n1.2 Quantities of\nmaterials and\nresources required\nto complete a work\ntask are estimated.\n1.3 The time needed to\ncomplete a work\nactivity is\nestimated.\n1.4 Accurate estimate\nfor work completion\nare made.\n1.5 Estimate of\nmaterials and\nresources are\nreported to\nappropriate person.\n1.1 Job requirements/\nlabor needs\n1.2 Calculation of\nquantities of\nmaterials and\nresources\nrequired\n1.3 Calculation of\ntime for job\ncompletion\n1.4 Preparation of\nestimate report\n1.5 Basic\nmathematical\noperations\n1.6 Percentage and\nratios\n1.7 Unit Conversion\n1.1 Identifying job\nrequirements/\nlabor\n1.2 Estimating\nquantities of\nmaterials and\nresources\nrequired\n1.3 Estimating time\nfor job\ncompletion\n1.4 Performing basic\ncalculation\n1.5 Compute\npercentage\n1.6 Convert English\nto Metric\nsystems of\nmeasurement\n1.7 Preparing\nestimate report\n2. Perform basic\nworkplace\ncalculation\n2.1 System and units\nof measurement to\nbe followed are\nascertained.\n2.2 Calculation needed\nto complete work\ntasks are performed\nusing the four\nbasic\nmathematical\noperation.\n2.3 Calculate whole\nfraction, percentage\nand mixed when\nare used to\ncomplete the\ninstructions.\n2.4 Number computed\n2.1 Four basic\nmathematical\noperation\n2.2 System and units\nof measurement\n2.3 Fraction,\npercentage and\nratio\n2.4 Material take-off\n2.5 Materials costing\n2.1 Compute bill of\nmaterials\n2.2 Compute project\ncost\n\n--- PDF PAGE 50 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 46\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nis checked following\nwork requirements.\n\n--- PDF PAGE 51 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 47\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Four basic mathematical\noperation\nMay include:\n1.1 Addition\n1.2 Subtraction\n1.3 Multiplication\n1.4 Division\n2. System of measurement\nMay include:\n2.1 English\n2.2 Metric\n3. Units of measurement\nMay include:\n3.1 Area\n3.2 Volume\n3.3 Weight\n3.4 Length\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Performed estimation\n1.2 Performed basic workplace calculation\n1.3 Applied corrective measures as maybe necessary\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Relevant tools and equipment for basic calculation\n2.2 Recommended data\n3. Method of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Practical demonstration\n3.2 Written examination\n4. Context of\nAssessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 52 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 48\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nPRODUCE BUDSTICK\n\nUNIT CODE\n:"
