nge of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\noperations\nworkplace\nresources is\nimplemented in\naccordance with\nenterprise policy\n3.2 Judicious use of\nworkplace tools,\nequipment and\nmaterials are\nobserved according\nto manual and work\nrequirements.\n3.3 Constructive\ncontributions to\noffice operations\nare made according\nto enterprise\nrequirements.\n3.4 Ability to work\nwithin one’s allotted\ntime and finances is\nsustained.\nresources\n3.2 5S procedures\nand concepts\n3.3 Criteria for cost-\neffectiveness\n3.4 Workplace\nproductivity\n3.5 Impact of\nentrepreneurial\nmindset to\nworkplace\nproductivity\n3.6 Ways in fostering\nentrepreneurial\nattitudes:\n• Quality-\nconsciousness\n• Safety-\nconsciousness\noptimizing\nworkplace\nresources\n3.2 Observing\njudicious use of\nworkplace tools,\nequipment and\nmaterials\n3.3 Making\nconstructive\ncontributions to\noffice operations\n3.4 Sustaining ability\nto work within\nallotted time and\nfinances\n\n--- PDF PAGE 41 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 37\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Good practices\nMay include:\n1.1 Economy in use of resources\n1.2 Documentation of quality practices\n2. Resources utilization\nMay include:\n2.1 Consumption/ use of consumables\n2.2 Use/Maintenance of assigned equipment and\nfurniture\n2.3 Optimum use of allotted /available time\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to identify and sustain cost-effective\nactivities in the workplace\n1.2 Demonstrated ability to practice entrepreneurial\nknowledge, skills and attitudes in the workplace.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to demonstrate the\nrequired tasks\n2.3 References and manuals\n2.3.1 Enterprise procedures manuals\n2.3.2 Company quality policy\n3. Methods of\nAs