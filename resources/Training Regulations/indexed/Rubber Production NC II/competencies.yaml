        },
        "source_text": "400311213\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and\nattitudes in managing one’s emotions, developing\nreflective practice, and boosting self-confidence\nand developing self-regulation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Manage one’s\nemotion\n1.1 Self-management\nstrategies are\nidentified.\n1.2 Skills to work\nindependently and\nto show initiative, to\nbe conscientious,\nand persevering in\nthe face of setbacks\nand frustrations are\ndeveloped.\n1.3 Techniques for\neffectively handling\nnegative emotions\nand unpleasant\nsituation in the\nworkplace are\nexamined.\n1.1 Self-management\nstrategies that\nassist in\nregulating\nbehavior and\nachieving\npersonal and\nlearning goals\n(e.g. Nine self-\nmanagement\nstrategies\naccording to\nRobert Kelley)\n1.2 Enablers and\nbarriers in\nachieving\npersonal and\ncareer goals\n1.3 Techniques in\nhandling negative\nemotions and\nunpleasant\nsituation in the\nworkplace such\nas frustration,\nanger, worry,\nanxiety, etc.\n1.1 Managing\nproperly one’s\nemotions and\nrecognizing\nsituations that\ncannot be\nchanged and\naccept them and\nremain\nprofessional\n1.2 Developing self-\ndiscipline,\nworking\nindependently\nand showing\ninitiative to\nachieve personal\nand career goals\n1.3 Showing\nconfidence, and\nresilience in the\nface of setbacks\nand frustrations\nand other\nnegative\nemotions and\nunpleasant\nsituations in the\nworkplace\n2. Develop reflective\npractice\n2.1 Personal strengths\nand achievements,\nbased on self-\nassessment\nstrategies and\nteacher feedback\nare contemplated.\n2.2 Progress when\nseeking and\n2.1 Basic SWOT\nanalysis\n2.2 Strategies to\nimprove one’s\nattitude in the\nworkplace\n2.3 Gibbs’ Reflective\nCycle/Model\n(Description,\n2.1 Using the basic\nSWOT analysis\nas self-\nassessment\nstrategy\n2.2 Developing\nreflective\npractice through\nrealization of\n\n--- PDF PAGE 21 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 17\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nresponding to\nfeedback from\nteachers to assist\nthem in\nconsolidating\nstrengths,\naddressing\nweaknesses and\nfulfilling their\npotential are\nmonitored.\n2.3 Outcomes of\npersonal and\nacademic\nchallenges by\nreflecting on\nprevious problem\nsolving and\ndecision making\nstrategies and\nfeedback from\npeers and teachers\nare predicted.\nFeelings,\nEvaluation,\nAnalysis,\nConclusion, and\nAction plan)\nlimitations, likes/\ndislikes; through\nshowing of self-\nconfidence\n2.3 Demonstrating\nself-acceptance\nand being able to\naccept\nchallenges\n3. Boost self-\nconfidence and\ndevelop self-\nregulation\n3.1 Efforts for\ncontinuous self-\nimprovement are\ndemonstrated.\n3.2 Counter-productive\ntendencies at work\nare eliminated.\n3.3 Positive outlook in\nlife are maintained.\n3.1 Four components\nof self-regulation\nbased on Self-\nRegulation\nTheory (SRT)\n3.2 Personality\ndevelopment\nconcepts\n3.3 Self-help\nconcepts (e. g., 7\nHabits by\nStephen Covey,\ntransactional\nanalysis, psycho-\nspiritual\nconcepts)\n3.1 Performing\neffective\ncommunication\nskills – reading,\nwriting,\nconversing skills\n3.2 Showing\naffective skills –\nflexibility,\nadaptability, etc.\n3.3 Self-assessment\nfor determining\none’s strengths\nand weaknesses\n\n--- PDF PAGE 22 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Self-management\nstrategies\nMay include:\n1.1 Seeking assistance in the form of job coaching or\nmentoring\n1.2 Continuing dialogue to tackle workplace grievances\n1.3 Collective negotiation/bargaining for better working\nconditions\n1.4 Share your goals to improve with a trusted co-\nworker or supervisor\n1.5 Make a negativity log of every instance when you\ncatch yourself complaining to others\n1.6 Make lists and schedules for necessary activities\n2. Unpleasant situation\nMay include:\n2.1 Job burn-out\n2.2 Drug dependence\n2.3 Sulking\n\n--- PDF PAGE 23 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 19\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Express emotions appropriately\n1.2 Work independently and show initiative\n1.3 Consistently demonstrate self-confidence and self-\ndiscipline\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Access to workplace and resource s\n2.2 Case studies\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration or simulation with oral questioning\n3.2 Case problems involving work improvement and\nsustainability issues\n3.3 Third-party report\n4. Context for\nAssessment\n4.1 Competency assessment may occur in workplace or any\nappropriately simulated environment\n\n--- PDF PAGE 24 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 20\n\nUNIT OF COMPETENCY\n:\nCONTRIBUTE TO WORKPLACE INNOVATION\n\nUNIT CODE\n:"
