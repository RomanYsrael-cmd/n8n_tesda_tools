        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency:\nAssessment requires evidence that the candidate:\n1.1 Selected planting site\n1.1.1 Conducted site inspection and validation.\n1.1.2 Determined suitability of area.\n1.1.3 Obtained updates and information on climatic\ncondition.\n1.1.4 Conducted soil sampling.\n1.1.5 Used result of soil analysis.\n\n1.2 Conducted land preparation\n1.2.1 Performed clearing operation.\n1.2.2 Sourced out equipment service.\n1.2.3 Done land preparation activities.\n1.2.4 Established drainage canal.\n1.2.5 Established canals.\n1.2.6 Secured area.\n1.2.7 Applied safety practices.\n\n1.3 Conducted layouting and staking\n1.3.1 Prepared tools, materials and supplies.\n1.3.2 Used line staking.\n1.3.3 Performed measurement and staking.\n1.3.4 Employed safety practices.\n\n1.4 Performed holing\n1.4.1 Prepared tools and materials.\n1.4.2 Sourced out equipment and manpower services.\n1.4.3 Dug hole.\n1.4.4 Practiced safety measures.\n\n1.5 Performed planting of budded rubber planting material\n1.5.1 Selected quality budded rubber planting material.\n1.5.2 Handled budded rubber planting material.\n1.5.3 Applied basal fertilizer.\n1.5.4 Done levelling and compacting hole base.\n1.5.5 Applied planting techniques.\n1.5.6 Applied safety practices.\n\n1.6 Performed routine farm maintenance\n1.6.1 Performed weeding.\n1.6.2 Planted and managed cover crop.\n1.6.3 Done application of fertilizer.\n1.6.4 Performed replanting.\n1.6.5 Conducted pruning.\n1.6.6 Performed branch induction.\n1.6.7 Monitored and controlled pest and diseases.\n1.6.8 Prepared knapsack sprayer.\n1.6.9 Safety is applied following OSHS.\n\n--- PDF PAGE 77 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 73\n\n1.7 Conducted post-farm management activities\n1.7.1 Done replanting.\n1.7.2 Performed field culling and resupplying.\n1.7.3 Segregated and composted wastes.\n1.7.4 Done tools, materials and equipment.\n1.7.5 Carried out recording and reporting of daily\nactivities.\n1.7.6 Done inventory of supplies and materials.\n1.7.7 Applied safety practices.\n2. Resource\nImplications\n2.1 All supplies, materials and equipment needed during farm\noperations should be readily available at the farm site\n2.1.1 Tools and farm implements use in activities such as\nclearing and plowing sites, digging, among others.\n2.1.2 PPE\n2.1.2.1 Soil sampler\n2.1.2.2 Fertilizers\n2.1.2.3 Insecticides/pesticides\n2.1.2.4 Layout plan\n2.1.2.5 Digging tools\n2.1.2.6 Stakes\n2.1.2.7 Sprayer\n\n2.2 All workers involved in different activities must be fully\noriented and cautioned on the different specific work\nactivities of the farm\n2.3 Technical supervisors should have skills and ability in the\nsuccessful implementation of work program activities\n2.4 Reference materials\n2.5 First aid kit\n3. Method of\nAssessment\nCompetency in this unit must be assessed through:\n3.1 Demonstration/direct observation with oral questioning\n3.2 Written examination\n4. Context of\nAssessment\n4.1 Assessment may occur in an appropriately simulated\nenvironment through TESDA accredited assessment\ncenters\n\n--- PDF PAGE 78 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 74\n\nUNIT OF COMPETENCY\n:\nHARVEST LATEX\n\nUNIT CODE\n:"
