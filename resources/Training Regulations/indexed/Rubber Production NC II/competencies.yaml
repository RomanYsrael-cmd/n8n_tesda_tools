        "source_text": "AFF611316\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to prepare tools and materials, check\nweather condition, secure budstick, perform actual\nbudding, rebudding, and perform cutback.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform\npreparatory\nactivities\n1.1 Tools and\nmaterials are\nidentify following\nindustry practices.\n1.2 Tools and\nmaterials are\nprepared following\nindustry practices.\n1.3 Weather condition\nis checked based\non industry\npractices.\n1.4 Budding tape is\nsliced based on\nindustry practice.\n1.5 Safety practices are\napplied following\nOSHS.\n1.1 Tools and\nmaterials\n1.2 PPEs\n1.3 OSHS\n1.4 Preparation of\ntools and\nmaterials\n1.5 Sharpening of\ntools\n1.6 Procedure in\nslicing budding\ntape\n1.1 Identifying tools\nand materials\n1.2 Preparing tools\nand materials\n1.3 Checking\nweather\ncondition\n1.4 Slicing budding\ntape\n1.5 Applying safety\npractices\n2. Secure budstick\n2.1 Budstick is sourced\nout from\naccredited\nsources according\nto industry\nstandards.\n2.2 Arrangements with\nreliable sources are\nconfirmed\naccording to\nindustry practices.\n2.3 Quality budstick is\nselected based on\nindustry standards.\n2.4 Harvesting\ntechniques are\napplied following\nindustry standards.\n2.5 Packing is\nperformed based\n2.1 Reliable sources\nof budstick and\nready-to-bud\nplanting materials\n2.2 Budstick condition\n2.3 Packing and\nhandling of\nbudstick\n2.4 Harvesting of\nbudstick\n2.1 Sourcing-out of\nbudstick and\nready-to-bud\nplanting\nmaterials\n2.2 Determining\nbudstick\ncondition\n2.3 Harvesting\nbudstick\n2.4 Packing and\nhandling\nbudsticks\n2.5 Applying safety\npractices\n2.6 Utilizing\nharvesting tools\n\n--- PDF PAGE 65 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 61\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\non established\nindustry practices.\n2.6 Budsticks are\nhandled and\nhauled following\nestablished industry\npractices.\n2.7 Record keeping is\nperformed following\nindustry standards.\n2.8 Safety practices are\napplied following\nOSHS.\n3. Perform actual\nbudding\n3.1 Rootstock is\ncleaned prior to\nincision following\nindustry practices.\n3.2 Size of incision in\nthe rootstock was\ndetermined based\non industry\nstandards.\n3.3 Flap of ready-to-\nbud rubber\nrootstock is\ndetached and cut\nfollowing industry\nstandards.\n3.4 Budpatch with bud\neye is extracted\nfrom budstick\nbased on industry\nstandards.\n3.5 Bud patch is\nattached and taped\nto ready-to-bud\nrubber rootstock\nfollowing industry\npractices.\n3.6 Live budded rubber\nrootstock are\nidentified following\nindustry standards.\n3.7 Budded rubber\nrootstocks are\nopened following\nindustry practices.\n3.8 Rebudding is\nperformed based\n3.1 Quality budeye\n3.2 Techniques in\ndetaching budeye\n3.3 Procedure in\ndetaching flap\n3.4 Procedure in\ntaping budded\nrubber seedling\n3.5 Procedure in\ncutting vacuum\ncellophane\n3.6 Basic\nrecordkeeping\n3.1 Detaching flap of\nready-to-bud\nrubber seedling\n3.2 Selecting and\ndetaching\nquality budeye\n3.3 Attaching and\ntaping budeye\n3.4 Identifying live\nbudded rubber\nplanting\nmaterials\n3.5 Opening budded\nrubber planting\nmaterials\n3.6 Performing\nrecord keeping\n3.7 Applying safety\npractices\n3.8 Performing\nrebudding\n\n--- PDF PAGE 66 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 62\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\non industry\npractices.\n3.9 Cutback is\nperformed to\nbudded rubber\nplanting material.\n3.10 Record keeping is\nperformed following\nindustry practices.\n3.11 Safety practices\nare applied\nfollowing industry\npractices.\n\n--- PDF PAGE 67 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 63\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools and materials\nMay include:\n1.1 Tools\n1.1.1 Budding knife\n1.1.2 Pruning saw\n1.1.3 Pruning shear\n\n1.2 Materials\n1.2.1 Vacuum cellophane (budding tape)\n1.2.2 Sand paper\n1.2.3 Sharpening stone\n1.2.4 Cloth\n1.2.5 Jute sack\n1.2.6 Banana bracts\n1.2.7 Twine\n2. Accredited sources\nMay include:\n2.1 Government established budwood garden\n2.2 Private owned budwood garden\n3. Quality budstick\nMay include:\n3.1 Matured top whorl leaves\n3.2 Size matching to rootstock\n4. Harvesting techniques\nMay include:\n4.1 Clone segregation\n4.2 Early in the morning with favorable weather\ncondition\n4.3 Budstick shall match the rootstock\n5. Handling of budsticks\nMay include:\n5.1 Placement in damped jute sack, wrapped with used\npaper or cellophane, boxed, taped, and tied\nproperly\n5.2 Avoid exposure to sunlight\n5.3 Maintain moisture\n5.4 Provide cushion to avoid bruising\n\n--- PDF PAGE 68 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 64\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Performed preparatory activities\n1.1.1 Identified tools and materials.\n1.1.2 Prepared tools and materials.\n1.1.3 Checked weather condition.\n1.1.4 Sliced budding tape.\n1.1.5 Applied safety practices.\n\n1.2 Secured budstick\n1.2.1 Sourced out budstick.\n1.2.2 Confirmed arrangements with reliable sources.\n1.2.3 Selected quality budstick.\n1.2.4 Applied harvesting techniques.\n1.2.5 Performed packing.\n1.2.6 Handled and hauled budsticks.\n1.2.7 Performed record keeping.\n1.2.8 Applied safety practices.\n\n1.3 Performed actual budding\n1.3.1 Cleaned rootstock.\n1.3.2 Determined size of incision.\n1.3.3 Detached and cut flap of ready-to-bud rubber\nrootstock.\n1.3.4 Extracted budpatch with bud eye.\n1.3.5 Attached and taped bud patch.\n1.3.6 Identified live budded rubber rootstock.\n1.3.7 Opened budded rubber rootstocks.\n1.3.8 Performed rebudding.\n1.3.9 Performed cutback.\n1.3.10 Performed record keeping.\n1.3.11 Applied safety practices.\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Actual and simulated workplace\n2.2 Materials, tools, and equipment needed to perform the\nrequired task\n2.3 References and manuals\n2.4 PPEs\n2.5 First aid kit\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration/ observation with oral questioning\n3.2 Written exam\n3.3 Oral questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 69 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 65\n\nUNIT OF COMPETENCY\n:\nPERFORM RUBBER FARM MAINTENANCE\n\nUNIT CODE\n:"
