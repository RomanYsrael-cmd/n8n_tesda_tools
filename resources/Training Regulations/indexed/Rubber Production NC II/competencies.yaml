ials\n\n--- PDF PAGE 60 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 56\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Site selection\nMay include:\n1.1 Open area\n1.2 Near water source\n1.3 Flat or undulated terrain\n1.4 Rich top soil\n1.5 Accessible to transport\n1.6 Presence of drainage canal\n2. Lay-outing\nMay include:\n2.1 Measurement of distance\n2.2 Line staking\n2.3 Determination of East-West orientation\n2.4 Flat or undulated terrain\n3. Tools and materials\nMay include:\n3.1 Tools\n3.1.1 Shovel\n3.1.2 Rice funnel\n3.1.3 Pruning shear\n3.1.4 Budding knife\n3.1.5 Knapsack sprayer\n\n3.2 Materials\n3.2.1 Polybags\n3.2.2 Water sprinkler\n3.2.3 PPEs\n3.2.3.1 Gloves\n3.2.3.2 Masks\n3.2.3.3 Long sleeve\n3.2.3.4 Boots\n3.2.3.5 Hat\n4. Seed quality standards\nMay include:\n4.1 Fresh\n4.2 Shiny\n4.3 Heavy\n5. Selection of seed bed\narea\nMay include:\n5.1 Shaded area\n5.2 Near water source\n5.3 Flat area\n6. Required standards\nMay include:\n6.1 Dimension\n6.2 With fine river sand\n7. Plant appearance\nMay include:\n7.1 Leaves’ appearance\n7.1.1 With spots\n7.1.2 Yellowing\n7.1.3 With blasts\n\n7.2 Latex dripping caused by insect bites\n\n--- PDF PAGE 61 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 57\nVARIABLE\nRANGE\n7.3 Damage plant due to rodent bites\n8. Pesticides\nMay include:\n8.1 Fungicide\n8.2 Insecticide\n8.3 Rodenticide\n\n--- PDF PAGE 62 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 58\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Established rubber polybag nursery site\n1.1.1 Performed site selection.\n1.1.2 Performed clearing of nursery area.\n1.1.3 Conducted lay-outing.\n1.1.4 Disposed debris.\n1.1.5 Applied safety practices.\n\n1.2 Performed bagging\n1.2.1 Filled polyethylene bag.\n1.2.2 Sourced out polyethylene bag.\n1.2.3 Prepared tools and materials.\n1.2.4 Hauled and arranged filled polybag.\n\n1.3 Germinated seeds\n