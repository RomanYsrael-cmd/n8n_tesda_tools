\n6.1 Performing\nweeding\n6.2 Conducting\npruning\n6.3 Managing cover\ncrop\n6.4 Applying fertilizer\n6.5 Performing\nreplanting\n6.6 Monitoring and\ncontrolling pest\nand diseases\n6.7 Marking treated\nrubber trees\n6.8 Restoring wind-\ndamaged trees\n6.9 Holing and\nplanting cover\ncrop\n6.10 Managing fire\n\n--- PDF PAGE 72 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 68\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nstandards.\n6.6 Branch induction is\nperformed following\nindustry standards.\n6.7 Pest and diseases\nare monitored and\ncontrolled\nfollowing GAP.\n6.8 Knapsack sprayer\nwas prepared\naccording to\nmanufacturer’s\nmanual.\n6.9 Safety is applied\nfollowing OSHS.\ntrees\n6.12 Holing and\nplanting of cover\ncrop\n6.13 Fire hazard\nmanagement\n6.14 OSHS for\nmaintenance of\nrubber farm\n6.15 Basic\nmathematical\noperation and\ncalculation\nhazard\n6.11 Practicing safety\nmeasures\n6.12 Basic\nmathematical\nskills\n7. Conduct post-farm\nmaintenance\nactivities\n7.1 Replanting is done\non missing hills.\n7.2 Field culling and\nresupplying is\nperformed based\non industry\nstandards.\n7.3 Wastes are\nsegregated and\ncomposted\nfollowing waste\nmanagement.\n7.4 Maintenance and\nsafe keeping of\ntools, materials and\nequipment are\ndone according\nworkplace\nprocedure\n7.5 Recording and\nreporting of daily\nactivities are\ncarried out\nfollowing industry\nprocedures.\n7.6 Inventory of\nsupplies and\nmaterials are done\nbased on standard\noperating\nprocedures.\n7.7 Safety practices are\napplied following\nOSHS.\n7.1 Dead points\n7.2 Field culling and\nresupplying\n7.3 Waste\nmanagement\n7.4 Maintenance and\nsafekeeping of\ntools, materials\nand equipment\n7.5 Recording and\nreporting of daily\nactivities\n7.6 Inventory of\nsupplies and\nmaterials\n7.7 Basic\nmathematical\noperation\n7.8 Safety practices\non post-farm\nmanagement\nactivities\n7.1 Resupplying of\ndead points\n7.2 Performing field\nculling and\nresupplying\n7.3 Conducting\nwaste\nmanagement\n7.4 Maintaining and\nsafe keeping of\ntools, materials\nand equipment\n7.5 Recording and\nreporting daily\nactivities\n7.6 Conducting\ninventory\nsupplies and\nmaterials\n7.7 Mathematical\nskills\n7.8 Practicing safety\npractices\n\n--- PDF PAGE 73 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 69\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Suitability of area\nThis pertains to the following:\n1.1 Elevation\n1.2 Soil suitability\n1.3 Topography\n1.4 Water table\n1.5 Rainfall\n1.6 Accessibility of area\n2. Climatic condition\nWeather condition includes\n2.1 Rainfall\n2.2 Wind\n3. Clearing operation\nClearing operation may include:\n3.1 Tree felling\n3.2 Uprooting and removal of stump\n3.3 Removal of debris\n4. Land preparation\nactivities\nThis may include the following but is not limited to:\n4.1 Ripping\n4.2 Plowing\n4.3 Harrowing\n4.4 Terracing\n5. Tools, materials and\nsupplies\nTools, materials, supplies and equipment may include:\n5.1 Tools\n5.1.1 Digging bar\n5.1.2 Shovel\n5.1.3 Sickle\n5.1.4 Selector knife\n5.1.5 Grab hoe\n5.1.6 Bark scraper (wood or steel)\n5.1.7 Pruning saw\n5.1.8 Pruning shear\n5.1.9 Clip pruner\n5.1.10 Cane knife\n5.1.11 A frame (for staking)\n5.1.12 Carpenters’ label\n\n5.2 Materials and Supplies\n5.2.1 Compass\n5.2.2 Pail\n5.2.3 Measuring cup\n5.2.4 Measuring tape\n5.2.5 Plastic rope\n5.2.6 Bamboo stick (marker)\n5.2.7 Bamboo stick (as digger)\n5.2.8 Bamboo pole (distance measurement)\n5.2.9 Collector of used polybag (bamboo\nstick/wire)\n5.2.10 Ready-to-plant budded rubber planting\nmaterial\n\n--- PDF PAGE 74 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 70\nVARIABLE\nRANGE\n5.2.11 Fertilizer\n5.2.12 Paint brush\n5.2.13 Plastic container (for fertilizer, liquid\npesticides)\n5.2.14 Jute sack\n5.2.15 Pesticides\n5.2.16 Fertilizers\n5.2.17 Herbicides\n5.2.18 Twine\n5.2.19 Paint marker\n