  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThese guidelines are set to provide the Technical Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for RUBBER PRODUCTION NC II.\n\nBASIC COMPETENCIES\n\nNIT OF COMPETENCY\n:\nPARTICIPATE IN WORKPLACE\nCOMMUNICATION\n\nUNIT CODE\n:\n400311210\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey\ninformation in response to workplace\nrequirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and convey\nworkplace\ninformation\n1.1 Specific and\nrelevant information\nis accessed from\nappropriate\nsources.\n1.2 Effective\nquestioning, active\nlistening and\nspeaking skills are\nused to gather and\nconvey information.\n1.3 Appropriate\nmedium is used to\ntransfer information\nand ideas.\n1.4 Appropriate non-\nverbal\ncommunication is\nused.\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and\nfollowed.\n1.6 Defined workplace\nprocedures for the\nlocation and\n1.1 Effective verbal\nand nonverbal\ncommunication\n1.2 Different modes\nof communication\n1.3 Medium of\ncommunication in\nthe workplace\n1.4 Organizational\npolicies\n1.5 Communication\nprocedures and\nsystems\n1.6 Lines of\nCommunication\n1.7 Technology\nrelevant to the\nenterprise and\nthe individual’s\nwork\nresponsibilities\n1.8 Workplace\netiquette\n1.1 Following simple\nspoken language\n1.2 Performing\nroutine\nworkplace duties\nfollowing simple\nwritten notices\n1.3 Participating in\nworkplace\nmeetings and\ndiscussions\n1.4 Preparing work-\nrelated\ndocuments\n1.5 Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n1.6 Relating/\nInteracting with\npeople of various\nlevels in the\nworkplace\n1.7 Gathering and\nproviding basic\n