      "number": "4",
      "text": "BUDDING is a form of asexual reproduction in which a new organism grows on another one. The new organism remains attached as it grows, separating from the parent organism only when it is mature. Since the reproduction is asexual, the newly created organism is a clone and is genetically identical to the parent organism. A new organism grows from an outgrowth or bud on the parent."
    },
    {
      "number": "5",
      "text": "BUD UNION Refers to the point where a new clone will emerge."
    },
    {
      "number": "6",
      "text": "CLONES Refers to an organism or cell, or group of organisms or cells, produced asexually from one ancestor or stock, to which they are genetically identical."
    },
    {
      "number": "7",
      "text": "CLONE Also known as budstick tagging."
    },
    {
      "number": "8",
