      "number": "4.1",
      "text": "1 To attain the national qualification of RUBBER PRODUCTION NC II, the candidate must demonstrate competence in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "number": "4.1",
      "text": "2 A Certificate of Competency (COC) is issued by the Authority to individuals who were assessed as competent in units of competencies, namely: COC 1: Produce budstick COC 2: Establish rubber nursery COC 3: Perform budding operation COC 4: Perform rubber farm maintenance COC 5: Harvest latex Upon accumulation and submission of all the COCs acquired, an individual shall be issued the corresponding National Certificate for the Qualification."
    },
    {
      "number": "4.1",
      "text": "3 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency."
    },
    {
      "number": "4.1",
      "text": "4 Any of the following are qualified to apply for assessment and certification:"
    },
    {
      "number": "4.1",
      "text": "4.1 Graduates of WTR-registered, NTR-registered programs or formal/non-formal/informal including enterprise-based trainings related to Rubber Production NC II."
    },
    {
      "number": "4.1",
      "text": "4.2 Experienced workers (wage employed or self-employed) who gained competencies related to all the core competencies of Rubber Production NC II, for at least 6 months in the last 2 years."
    },
    {
      "number": "4.1",
      "text": "5 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work --- PDF PAGE 129 --- TR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 125 and/or life experiences related to all the core competencies of Rubber Production NC II, for at least 1 of year (within the last 5 years) may apply for recognition in this Qualification through Portfolio Assessment. Requirements and implementation procedure of Portfolio Assessment must be consistent with TESDA Circular No. 47, series of 2018 on “Implementing Guidelines on the Implementation of Portfolio Assessment Leading to Recognition of Prior Learning (RPL) within the TESDA Assessment and Certification System, and with TESDA Circular No. 118, series of 2019 on “Addendum to the Implementing Guidelines on the Implementation Portfolio Assessment Leading to Recognition of Prior Learning (RPL) within the TESDA Assessment and Certification System.”"
    },
    {
      "number": "4.1",
      "text": "6 Holders of National Certificate (NC) or Certificates of Competency (COC) in Rubber Production NC II are required to undergo re- assessment under the amended Training Regulations (TRs), upon expiration of their Certificates."
    },
    {
      "number": "4.1",
      "text": "7 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the “Philippine Competency Assessment and Certification System (PTCACS).”"
    },
    {
      "number": "4",
      "text": "2."
