      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a.) Identify the candidate’s skills and knowledge b.) Highlight gaps in candidate’s skills and knowledge c.) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d.) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. TR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 126 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. TR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 127 BASIC COMPETENCY Receive and respond to workplace communication Participate in workplace communication Lead workplace communication Utilize specialized communication skill Manage and sustain effective communication strategies Work with others Work in a team environment Lead small teams Develop and lead teams Manage and sustain high performing teams Solve/address routine problems Solve/address general workplace problems Apply critical thinking and problem solving techniques in the workplace Perform higher-order thinking processes and apply 