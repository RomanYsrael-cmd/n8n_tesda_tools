    },
    {
      "number": "18",
      "text": "LATEX As found in nature is a milky fluid found in 10% of all flowering plants (angiosperms). It is a complex emulsion consisting of proteins, alkaloids, starches, sugars, oils, tannins, resins, and gums that coagulates on exposure to air. It is usually exuded after tissue injury. In most plants, latex is white, but some have yellow, orange, or scarlet latex."
    },
