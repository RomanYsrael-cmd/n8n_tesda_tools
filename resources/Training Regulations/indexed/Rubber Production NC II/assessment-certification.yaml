  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to a full\nqualification or employable unit(s) of competency in partial fulfillment of the\nrequirements of the national qualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the national qualification of RUBBER PRODUCTION NC II,\nthe candidate must demonstrate competence in all units listed in\nSection 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.1.2 A Certificate of Competency (COC) is issued by the Authority to\nindividuals who were assessed as competent in units of competencies,\nnamely:\n\nCOC 1: Produce budstick\nCOC 2: Establish rubber nursery\nCOC 3: Perform budding operation\nCOC 4: Perform rubber farm maintenance\nCOC 5: Harvest latex\n\nUpon accumulation and submission of all the COCs acquired, an\nindividual shall be issued the corresponding National Certificate for the\nQualification.\n\n4.1.3 Assessment shall cover all competencies with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.1.4 Any of the following are qualified to apply for assessment and\ncertification:\n\n4.1.4.1 Graduates of WTR-registered, NTR-registered programs or\nformal/non-formal/informal including enterprise-based trainings\nrelated to Rubber Production NC II.\n\n4.1.4.2 Experienced workers (wage employed or self-employed) who\ngained competencies related to all the core competencies of\nRubber Production NC II, for at least 6 months in the last 2\nyears.\n\n4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, previous work\n\n--- PDF PAGE 129 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 125\nand/or life experiences related to all the core competencies of Rubber\nProduction NC II, for at least 1 of year (within the last 5 years) may\napply for recognition in this Qualification through Portfolio Assessment.\n\nRequirements and implementation procedure of Portfolio Assessment\nmust be consistent with TESDA Circular No. 47, series of 2018 on\n“Implementing\nGuidelines\non\nthe\nImplementation\nof\nPortfolio\nAssessment Leading to Recognition of Prior Learning (RPL) within the\nTESDA Assessment and Certification System, and with TESDA\nCircular No. 118, series of 2019 on “Addendum to the Implementing\nGuidelines on the Implementation Portfolio Assessment Leading to\nRecognition of Prior Learning (RPL) within the TESDA Assessment\nand Certification System.”\n\n4.1.6 Holders of National Certificate (NC) or Certificates of Competency\n(COC) in Rubber Production NC II are required to undergo re-\nassessment under the amended Training Regulations (TRs), upon\nexpiration of their Certificates.\n\n4.1.7 The guidelines on assessment and certification are discussed in detail\nin the “Procedures Manual on Assessment and Certification” and\n“Guidelines\non\nthe\nImplementation\nof\nthe\n“Philippine\nTVET\nCompetency Assessment and Certification System (PTCACS).”\n\n4.2.\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished\nby\nthe\ncandidate\nprior\nto\nactual\ncompetency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n\nThis document can:\n\na.) Identify the candidate’s skills and knowledge\nb.) Highlight gaps in candidate’s skills and knowledge\nc.) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd.) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained prior\nto assessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited\nby TESDA is authorized to conduct competency assessment.\nAssessment centers undergo a quality assured procedure for\naccreditation before they are authorized by TESDA to manage the\nassessment for National Certification.\n\n--- PDF PAGE 130 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 126\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 131 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 127\n\nBASIC COMPETENCY\n\nReceive and respond to\nworkplace communication\nParticipate in workplace\ncommunication\nLead workplace\ncommunication\n\nUtilize specialized\ncommunication skill\nManage and sustain effective\ncommunication strategies\nWork with others\nWork in a team environment\nLead small teams\nDevelop and lead teams\nManage and sustain high\nperforming teams\nSolve/address routine\nproblems\nSolve/address general workplace\nproblems\nApply critical thinking and\nproblem solving techniques in\nthe workplace\nPerform higher-order thinking\nprocesses and apply\ntechniques in the workplace\nEvaluate higher order thinking\nskills and adjust problem\nsolving techniques\nEnhance self-management\nskills\nDevelop career and life decisions Work in a diverse environment Contribute to the practice of\nsocial justice in the workplace\nAdvocate strategic thinking for\nglobal citizenship\nSupport innovation\nContribute to workplace\ninnovation\n\nPropose methods of applying\nlearning and innovation in the\norganization\nManage innovative work\ninstructions\nIncorporate innovation into\nwork procedures\nAccess and maintain\ninformation\nPresent relevant information\n\nUse information systematically\n\nManage and evaluate usage\nof information\nDevelop systems in managing,\nand maintaining information\nFollow occupational safety\nand health policies and\nprocedures\nPractice occupational safety and\nhealth policies and procedures\n\nEvaluate occupational safety\nand health work practices\nLead in improvement of\noccupational safety and health\nprogram, policies and\nprocedures\nManage implementation of\nOSH programs in the\nworkplace\nApply environmental work\nstandards\nExercise efficient and effective\nsustainable practices in the\nworkplace\nEvaluate environmental work\npractices\nLead towards improvement of\nenvironmental work programs,\npolicies and procedures\nManage implementation of\nenvironmental programs in the\nworkplace\nAdopt entrepreneurial\nmindset in the workplace\nPractice entrepreneurial skills in\nthe workplace\n\nFacilitate entrepreneurial skills\nfor micro-small-medium\nenterprises (MSMEs)\nSustain entrepreneurial skills\n\nDevelop and sustain a high-\nperforming enterprise\n\n"
