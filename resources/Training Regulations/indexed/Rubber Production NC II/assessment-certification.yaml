ards Exercise efficient and effective sustainable practices in the workplace Evaluate environmental work practices Lead towards improvement of environmental work programs, policies and procedures Manage implementation of environmental programs in the workplace Adopt entrepreneurial mindset in the workplace Practice entrepreneurial skills in the workplace Facilitate entrepreneurial skills for micro-small-medium enterprises (MSMEs) Sustain entrepreneurial skills Develop and sustain a high- performing enterprise --- PDF PAGE 132 --- TR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 128 Apply safety measures in farm operations Use farm tools and equipment Perform estimation and calculations Apply basic first aid Apply food safety and sanitation Prevent and fight fire Provide first aid treatment on board Protect marine environment Comply with emergency procedures Process farm wastes Develop and update industry knowledge Perform record keeping Provide Quality Customer Service Comply with Quality and Ethical Standards Maintain service records Conduct Diagnosis Perform Shop Maintenance CORE COMPETENCY (FORESTRY) Establish rubber budwood and seedlings nursery Plant rubber trees/rubber seedlings Perform budding operation Harvest latex Operate bamboo nursery Establish bamboo farm Conduct bamboo clump rehabilitation Conduct harvesting and post- harvesting operations Produce budstick Establish rubber nursery Perform rubber farm maintenance --- PDF PAGE 133 --- TR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 129"
