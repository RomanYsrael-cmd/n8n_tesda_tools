  "source_text": "Section 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.1.2 A Certificate of Competency (COC) is issued by the Authority to\nindividuals who were assessed as competent in units of competencies,\nnamely:\n\nCOC 1: Produce budstick\nCOC 2: Establish rubber nursery\nCOC 3: Perform budding operation\nCOC 4: Perform rubber farm maintenance\nCOC 5: Harvest latex\n\nUpon accumulation and submission of all the COCs acquired, an\nindividual shall be issued the corresponding National Certificate for the\nQualification.\n\n4.1.3 Assessment shall cover all competencies with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.1.4 Any of the following are qualified to apply for assessment and\ncertification:\n\n4.1.4.1 Graduates of WTR-registered, NTR-registered programs or\nformal/non-formal/informal including enterprise-based trainings\nrelated to Rubber Production NC II.\n\n4.1.4.2 Experienced workers (wage employed or self-employed) who\ngained competencies related to all the core competencies of\nRubber Production NC II, for at least 6 months in the last 2\nyears.\n\n4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, previous work\n\n--- PDF PAGE 129 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 125\nand/or life experiences related to all the core competencies of Rubber\nProduction NC II, for at least 1 of year (within the last 5 years) may\napply for recognition in this Qualification through Portfolio Assessment.\n\nRequirements and implementation procedure of Portfolio Assessment\nmust be consistent with TESDA Circular No. 47, series of 2018 on\n“Implementing\nGuidelines\non\nthe\nImplementation\nof\nPortfolio\nAssessment Leading to Recognition of Prior Learning (RPL) within the\nTESDA Assessment and Certification System, and with TESDA\nCircular No. 118, series of 2019 on “Addendum to the Implementing\nGuidelines on the Implementation Portfolio Assessment Leading to\nRecognition of Prior Learning (RPL) within the TESDA Assessment\nand Certification System.”\n\n4.1.6 Holders of National Certificate (NC) or Certificates of Competency\n(COC) in Rubber Production NC II are required to undergo re-\nassessment under the amended Training Regulations (TRs), upon\nexpiration of their Certificates.\n\n4.1.7 The guidelines on assessment and certification are discussed in detail\nin the “Procedures Manual on Assessment and Certification” and\n“Guidelines\non\nthe\nImplementation\nof\nthe\n“Philippine\nTVET\nCompetency Assessment and Certification System (PTCACS).”\n\n4.2.\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished\nby\nthe\ncandidate\nprior\nto\nactual\ncompetency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n\nThis document can:\n\na.) Identify the candidate’s skills and knowledge\nb.) Highlight gaps in candidate’s skills and knowledge\nc.) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd.) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained prior\nto assessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited\nby TESDA is authorized to conduct competency assessment.\nAssessment centers undergo a quality assured procedure for\naccreditation before they are authorized by TESDA to manage the\nassessment for National Certification.\n\n--- PDF PAGE 130 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 126\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 131 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 127\n\nBASIC COMPETENCY\n\nReceive and respond to\nworkplace communication\nParticipate in workplace\ncommunication\nLead workplace\ncommunication\n\nUtilize specialized\ncommunication skill\nManage and sustain effective\ncommunication strategies\nWork with others\nWork in a team environment\nLead small teams\nDevelop and lead teams\nManage and sustain high\nperforming teams\nSolve/address routine\nproblems\nSolve/address general workplace\nproblems\nApply critical thinking and\nproblem solving techniques in\nthe workplace\nPerform higher-order thinking\nprocesses and apply\ntechniques in the workplace\nEvaluate higher order thinking\nskills and adjust problem\nsolving techniques\nEnhance self-management\nskills\nDevelop career and life decisions Work in a diverse environment Contribute to the practice of\nsocial justice in the workplace\nAdvocate strategic thinking for\nglobal citizenship\nSupport innovation\nContribute to workplace\ninnovation\n\nPropose methods of applying\nlearning and innovation in the\norganization\nManage innovative work\ninstructions\nIncorporate innovation into\nwork procedures\nAccess and maintain\ninformation\nPresent relevant information\n\nUse information systematically\n\nManage and evaluate usage\nof information\nDevelop systems in managing,\nand maintaining information\nFollow occupational safety\nand health policies and\nprocedures\nPractice occupational safety and\nhealth policies and procedures\n\nEvaluate occupational safety\nand health work practices\nLead in improvement of\noccupational safety and health\nprogram, policies and\nprocedures\nManage implementation of\nOSH programs in the\nworkplace\nApply environmental work\nstandards\nExercise efficient and effective\nsustainable practices in the\nworkplace\nEvaluate environmental work\npractices\nLead towards improvement of\nenvironmental work programs,\npolicies and procedures\nManage implementation of\nenvironmental programs in the\nworkplace\nAdopt entrepreneurial\nmindset in the workplace\nPractice entrepreneurial skills in\nthe workplace\n\nFacilitate entrepreneurial skills\nfor micro-small-medium\nenterprises (MSMEs)\nSustain entrepreneurial skills\n\nDevelop and sustain a high-\nperforming enterprise\n\nCOMPETENCY MAP\nRUBBER PRODUCTION NC II\n\n--- PDF PAGE 132 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 128\n\nCOMMON COMPETENCY\n\nApply safety measures in\nfarm operations\nUse farm tools and equipment\nPerform estimation and\ncalculations\nApply basic first aid\nApply food safety and\nsanitation\nPrevent and fight fire\nProvide first aid treatment on\nboard\nProtect marine environment\nComply with emergency\nprocedures\nProcess farm wastes\nDevelop and update industry\nknowledge\nPerform record keeping\nProvide Quality Customer\nService\nComply with Quality and\nEthical Standards\nMaintain service records\nConduct Diagnosis\nPerform Shop Maintenance\n\nCORE COMPETENCY (FORESTRY)\n\nEstablish rubber budwood\nand seedlings nursery\nPlant rubber trees/rubber\nseedlings\nPerform budding operation\nHarvest latex\nOperate bamboo nursery\nEstablish bamboo farm\nConduct bamboo clump\nrehabilitation\nConduct harvesting and post-\nharvesting operations\nProduce budstick\nEstablish rubber nursery\nPerform rubber farm\nmaintenance\n\n--- PDF PAGE 133 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 129\n\nGLOSSARY OF TERMS\n\n1) ACID SOLUTION\nRefers to acetic acid, formic acid, vinegar\n2) AREA TASKING\nRefers to the specific area with significant number of\ntappable trees.\n3) BUDDER\none that performs budding operations\n4) BUDDING\nis a form of asexual reproduction in which a new\norganism grows on another one. The new organism\nremains attached as it grows, separating from the parent\norganism only when it is mature. Since the reproduction\nis asexual, the newly created organism is a clone and is\ngenetically identical to the parent organism. A new\norganism grows from an outgrowth or bud on the parent.\n5) BUD UNION\nRefers to the point where a new clone will emerge.\n6) CLONES\nRefers to an organism or cell, or group of organisms or cells,\nproduced asexually from one ancestor or stock, to which they\nare genetically identical.\n7) CLONE\nSEGREGATION\nAlso known as budstick tagging.\n8) CUPLUMP\nWith formic acid\n9) FIELD CULLING\nRefers to the removal of stunted plant.\n10) FINAL CULLING\nHarvesting of budded planting material.\n11) FLAP\nRefers to skin of ready-to-bud seedling (rootstock).\n12) GERMINATED SEEDS Also known as ready-to-bud planting material.\n13) GERMINATING\nMEDIUM\nType of sand preferably fine river sand\n14) GIRTH\nRefers to the circumference of the tree.\n15) HARDENING\nRefers to cutting of existing roots outside the polybag.\n16) INSECT PEST\na destructive or harmful insect.\n17) IRRIGATION\nany method of supplying water to sustain plant growth\n18) LATEX\nAs found in nature is a milky fluid found in 10% of all\nflowering plants (angiosperms). It is a complex emulsion\nconsisting of proteins, alkaloids, starches, sugars, oils,\ntannins, resins, and gums that coagulates on exposure to\nair. It is usually exuded after tissue injury. In most plants,\nlatex is white, but some have yellow, orange, or scarlet\nlatex.\n19) MISSING HILLS\nAlso known as dead points.\n20) OPENING OF\nBUDDED RUBBER\nSEEDLING\nAlso known as removal of tape.\n21) PLANTING\nMATERIALS\nRefers to budded rubber planting materias\n22) POST-\nMAINTENANCE\nRefers to the activities of replanting, field culling and\nresupplying, waste segregation and composting,\nmaintenance and safekeeping of tools, materials and\nequipment, recording, and inventory.\n23) QUINCUNX\ntriangular arrangement of lay-outing\nSupermarket of Competencies\nAGRI-FISHERY Sector\n\n--- PDF PAGE 134 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 130\n24) READY-TO-BUD\nSEEDLINGS\nAlso known as buddable rootstocks.\n25) ROOTSTOCK\nAlso known as ready-to-bud\n26) RUBBER FARM\nMAINTENANCE\nAlso known as rubber farm management. It refers to the\nprocess of selecting planting site, conducting land\npreparation, performing site laying-out and staking,\nplanting poly-bagged budded rubber seedling and\nperform maintenance activities\n27) RUBBER SEEDLINGS Also known as ready-to-bud rubber seedlings\n28) REGULAR\nMONITORING\nWater-based paint used on final coat and fine details\n29) SCION\nRefers to live budded rubber seedlings.\n30) SEED SOAKING\nPre-germination of seeds.\n31) SIDE PRUNING\nRefers to removal of unwanted and/or excess sprout.\n32) SOIL SAMPLING\nProtective coating applied to finished paper mache to\nprevent it from being damaged by insects and other\nelements.\n33) SPROUTS\nAlso known as shoots. Refers to the early emergence of\nundesired sprouts.\n34) STANDARD\nthe set of criteria and specifications of quality\ndetermining the grades, described as product\ncharacteristics such as maturity, color, cleanliness,\nshape, free from decay and blemishes and uniformity of\nsize\n35) TAPPERS\nperforms tapping job\n36) TAPING (RUBBER)\nis the process by which the sap (latex) is collected from a\nrubber tree. An incision is made in the tree's bark, which\ncuts through the planting cycle to optimise the latex yield.\n37) TRANSPLANTS\nseedlings produced for transplanting\n\n--- PDF PAGE 135 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 131\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nRubber Production NC II\nQualification Code:\nAFFRPT221\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./ Date\nDeployment Circular\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument\nCreated\nRubber Production NC II\nTBR No. 2012-05\n05-09-2012\nN/A\n01\nDocument\nAmended\nRubber Production NC II\nTBR No. 2021-04\n02-09-2021\n\nLegend: *Description Types\n-\nDocument Created\n-\nDocument Amended\n-\nDocument Superseded\n\n--- PDF PAGE 136 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 132\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) is\nparticularly grateful for the valuable technical support provided by the following\nindustry stakeholders for the review and development of this Training Regulations.\nThe time and inputs generously given during this undertaking are also highly\nappreciated and recognized as they made significant contributions to the constitution\nof this TR.\n\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nALFONSO JACK F. SANDIQUE\nChief Operations Officer\nPlatinum Rubber Development\nIncorporated (PRDI)\nMakilala, North Cotabato\nANGELITO A. ABALLE, PhD.\nSenior Education Program Specialist\nDepartment of Education\nDivision of Zamboanga Sibugay\nPangi, Ipil, Zamboanga Sibugay\nCHERYL L. EUSALA, PhD.\nActing Municipal Agriculturist\nLocal Government Unit\nMakilala, North Cotabato\nROGELIO T. CANE\nFarmer/ Board of Director\nPhilippine Rubber Association\nPoblacion, Makilala, North Cotabato\nBENEDICTO ALLIRA\nBudder\nMakilala, North Cotabato\nBENJAMIN N. COCON\nFarmer (Budding, Tapping, Nursery\nPropagation)\nDepartment of Agriculture\nRFO XII, Aroman, Carmen, Cotabato\nAGUSTINO P. ARANCES\nProvincial Rubber Coordinator\nProvincial Government of Cotabato\nCapitol Compound, Kidapawan City\nCHITO L. DELA CRUZ\nHigh Value Crop Coordinator\nDA-RFO 12\nKoronadal City, South Cotabato\nFLORA H. ARCIAGA\nRubber Nursery Lead Man\nPlatinum Rubber Development\nIncorporated (PRDI)\nMakilala, North Cotabato\nHONEY FE C. GUMAY\nScience Research Specialist II\nPhilippine Rubber Research Institute\nSanito, Ipil, Zamboanga Sibugay\nALJORY JHON L. BOJE\nInstructor I\nUniversity of Southern Mindanao\nKubasan, Cotabato\nTEODORO JAMILI\nT