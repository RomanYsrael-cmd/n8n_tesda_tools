  "source_text": "1) ACID SOLUTION\nRefers to acetic acid, formic acid, vinegar\n2) AREA TASKING\nRefers to the specific area with significant number of\ntappable trees.\n3) BUDDER\none that performs budding operations\n4) BUDDING\nis a form of asexual reproduction in which a new\norganism grows on another one. The new organism\nremains attached as it grows, separating from the parent\norganism only when it is mature. Since the reproduction\nis asexual, the newly created organism is a clone and is\ngenetically identical to the parent organism. A new\norganism grows from an outgrowth or bud on the parent.\n5) BUD UNION\nRefers to the point where a new clone will emerge.\n6) CLONES\nRefers to an organism or cell, or group of organisms or cells,\nproduced asexually from one ancestor or stock, to which they\nare genetically identical.\n7) CLONE\nSEGREGATION\nAlso known as budstick tagging.\n8) CUPLUMP\nWith formic acid\n9) FIELD CULLING\nRefers to the removal of stunted plant.\n10) FINAL CULLING\nHarvesting of budded planting material.\n11) FLAP\nRefers to skin of ready-to-bud seedling (rootstock).\n12) GERMINATED SEEDS Also known as ready-to-bud planting material.\n13) GERMINATING\nMEDIUM\nType of sand preferably fine river sand\n14) GIRTH\nRefers to the circumference of the tree.\n15) HARDENING\nRefers to cutting of existing roots outside the polybag.\n16) INSECT PEST\na destructive or harmful insect.\n17) IRRIGATION\nany method of supplying water to sustain plant growth\n18) LATEX\nAs found in nature is a milky fluid found in 10% of all\nflowering plants (angiosperms). It is a complex emulsion\nconsisting of proteins, alkaloids, starches, sugars, oils,\ntannins, resins, and gums that coagulates on exposure to\nair. It is usually exuded after tissue injury. In most plants,\nlatex is white, but some have yellow, orange, or scarlet\nlatex.\n19) MISSING HILLS\nAlso known as dead points.\n20) OPENING OF\nBUDDED RUBBER\nSEEDLING\nAlso known as removal of tape.\n21) PLANTING\nMATERIALS\nRefers to budded rubber planting materias\n22) POST-\nMAINTENANCE\nRefers to the activities of replanting, field culling and\nresupplying, waste segregation and composting,\nmaintenance and safekeeping of tools, materials and\nequipment, recording, and inventory.\n23) QUINCUNX\ntriangular arrangement of lay-outing\nSupermarket of Competencies\nAGRI-FISHERY Sector\n\n--- PDF PAGE 134 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 130\n24) READY-TO-BUD\nSEEDLINGS\nAlso known as buddable rootstocks.\n25) ROOTSTOCK\nAlso known as ready-to-bud\n26) RUBBER FARM\nMAINTENANCE\nAlso known as rubber farm management. It refers to the\nprocess of selecting planting site, conducting land\npreparation, performing site laying-out and staking,\nplanting poly-bagged budded rubber seedling and\nperform maintenance activities\n27) RUBBER SEEDLINGS Also known as ready-to-bud rubber seedlings\n28) REGULAR\nMONITORING\nWater-based paint used on final coat and fine details\n29) SCION\nRefers to live budded rubber seedlings.\n30) SEED SOAKING\nPre-germination of seeds.\n31) SIDE PRUNING\nRefers to removal of unwanted and/or excess sprout.\n32) SOIL SAMPLING\nProtective coating applied to finished paper mache to\nprevent it from being damaged by insects and other\nelements.\n33) SPROUTS\nAlso known as shoots. Refers to the early emergence of\nundesired sprouts.\n34) STANDARD\nthe set of criteria and specifications of quality\ndetermining the grades, described as product\ncharacteristics such as maturity, color, cleanliness,\nshape, free from decay and blemishes and uniformity of\nsize\n35) TAPPERS\nperforms tapping job\n36) TAPING (RUBBER)\nis the process by which the sap (latex) is collected from a\nrubber tree. An incision is made in the tree's bark, which\ncuts through the planting cycle to optimise the latex yield.\n37) TRANSPLANTS\nseedlings produced for transplanting\n\n--- PDF PAGE 135 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 131\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nRubber Production NC II\nQualification Code:\nAFFRPT221\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./ Date\nDeployment Circular\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument\nCreated\nRubber Production NC II\nTBR No. 2012-05\n05-09-2012\nN/A\n01\nDocument\nAmended\nRubber Production NC II\nTBR No. 2021-04\n02-09-2021\n\nLegend: *Description Types\n-\nDocument Created\n-\nDocument Amended\n-\nDocument Superseded\n\n--- PDF PAGE 136 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 132",
