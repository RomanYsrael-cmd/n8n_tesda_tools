      "source_text": "3.6\nTRAINER’S QUALIFICATIONS FOR AGRI-FISHERY SECTOR\n\nTrainers who will deliver the training on RUBBER PRODUCTION NC II\nshould have the following:\n\nFOR NEW TRAINERS\n• Must be a holder of NTTC I (NC + TM1) on RUBBER PRODUCTION NC II\nand;\n• Must have at least 2 years’ industry experience within the last five (5)\nyears.\n\nFOR EXISTING TRAINERS\n• Must be a holder of National TVET Trainer Certificate (NTTC) Level I on\nRUBBER PRODUCTION NC II and;\n• Must have at least 40 hours industry immersion for the last three (3) years.\nOr\n• Must have at least 40 hours participation in seminars, workshops, and\nforum relevant to rubber production."
