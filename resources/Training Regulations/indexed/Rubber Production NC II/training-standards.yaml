  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for RUBBER PRODUCTION NC ll.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany the curricula.\n\nCourse Title:\nRUBBER PRODUCTION\nNC Level\nNC II\n\nNominal Training Duration:\n\n37 Hours (Basic Competencies)\n\n72 Hours (Common Competencies)\n\n212 Hours (Core Competencies)\n\n321 TOTAL HOURS\n\nThe applicable training modality for this Training Regulation is a combination\nof institution-based under (Section 3.2.2.1), enterprise-based under (Section 3.2.2.2)\nand community-based under (Section 3.2.2.3) of which at least 40 hours shall be\ndedicated to actual workplace learning/ industry training. The training design shall\nfollow the requirements of SIL as stipulated in TESDA Circular No. 089 series 2019\nentitled “Implementing Guidelines for Supervised Industry Learning (SIL)”,\nparticularly under Sections V, VI and VII thereof.\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of rubber production in accordance with industry standards. It\ncovers specialized competencies such as producing budstick, establishing rubber\nnursery, performing budding operation, performing rubber farm management and\nharvesting latex.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieve.\n\n--- PDF PAGE 85 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 81\nBASIC COMPETENCIES – NATIONAL CERTIFICATE NC II\n37 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures\nand systems\n•\nIdentify:\no Different modes of\ncommunication\no Medium of communication\no Flow of communication\no Available technology relevant\nto the enterprise and the\nindividual’s work\nresponsibilities\n•\nPrepare different Types of\nquestion\n•\nGather different sources of\ninformation\n•\nApply storage system in\nestablishing workplace information\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n1.2 Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and\ninstructions\no Workplace interactions and\nprocedures\n•\nRead instructions on work related\nforms/documents\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 86 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 82\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nPerform workplace duties scenario\nfollowing workplace instructions\n1.3 Complete\nrelevant work\nrelated\ndocuments\n•\nDescribe Communication\nprocedures and systems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and record\nroutine workplace measures\no Basic mathematical processes\nof addition, subtraction,\ndivision and multiplication\n•\nDemonstrate office activities in:\no workplace meetings and\ndiscussions scenario\n•\nPerform workplace duties scenario\nfollowing simple written notices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n•\nDemonstrate ability to relate to\npeople of social range in the\nworkplace\n•\nGather and provide information in\nresponse to workplace\nrequirements\n•\nComplete work related documents\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 87 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 83\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Work in a team\nenvironment\n2.1 Describe team\nrole and scope\n•\nDiscussion on team roles and\nscope\n•\nParticipate in the discussion:\no Definition of Team\no Difference between team and\ngroup\no Objectives and goals of team\n•\nLocate needed information from\nthe different sources of\ninformation\n• Lecture/\nDiscussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 Hour\n2.2 Identify one’s\nrole and\nresponsibility\nwithin team\n•\nRole play:\no individual role and\nresponsibility\n•\nRole Play\no Understanding Individual\ndifferences\n•\nDiscussion on gender sensitivity\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n2.3 Work as a team\nmember\n•\nParticipate in group planning\nactivities\n•\nRole play: Communication\nprotocols\n•\nParticipate in the discussion of\nstandard work procedures and\npractices\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Role Play\n• Written Test\n1 Hour\n3. Solve/address\nroutine problems\n3.1 Identify routine\nproblems\n•\nReview of the current industry\nhardware and software products\nand services\n•\nIdentify correctly the industry\nmaintenance, service and\nhelpdesk practices, processes and\nprocedures\n•\nMake use of the industry standard\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n--- PDF PAGE 88 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 84\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\ndiagnostic tools\n•\nShare best practices in\ndetermining basic malfunctions\nand resolutions to general\nproblems in the workplace\n•\nAnalyze routine/procedural\nproblems\n3.2 Look for\nsolutions to\nroutine\nproblems\n•\nReview of the current industry\nhardware and software products\nand services\n•\nIdentify correctly the industry\nmaintenance, service and\nhelpdesk practices, processes and\nprocedures\n•\nMake use of the industry standard\ndiagnostic tools\n•\nShare best practices in\ndetermining basic malfunctions\nand resolutions to general\nproblems in the workplace\n•\nFormulate possible solutions to\nproblems and document\nprocedures for reporting\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n3.3 Recommend\nsolutions to\nproblems\n•\nDiscuss standard operating\nprocedures and documentation\nprocesses\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n--- PDF PAGE 89 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 85\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4. Develop Career\nand Life\nDecisions\n4.1 Manage one’s\nemotion\n•\nDemonstrate self-management\nstrategies that assist in regulating\nbehavior and achieving personal\nand learning goals\n•\nExplain enablers and barriers in\nachieving personal and career\ngoals\n•\nIdentify techniques in handling\nnegative emotions and unpleasant\nsituation in the workplace such as\nfrustration, anger, worry, anxiety,\netc.\n•\nManage properly one’s emotions\nand recognize situations that\ncannot be changed and accept\nthem and remain professional\n•\nRecall instances that demonstrate\nself- discipline, working\nindependently and showing\ninitiative to achieve personal and\ncareer goals\n•\nShare experiences that show\nconfidence, and resilience in the\nface of setbacks and frustrations\nand other negative emotions and\nunpleasant situations in the\nworkplace\n• Discussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n1 Hour\n\n--- PDF PAGE 90 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 86\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4.2 Develop\nreflective\npractice\n•\nEnumerate strategies to improve\none’s attitude in the workplace\n•\nExplain Gibbs’ Reflective\nCycle/Model (Description,\nFeelings, Evaluation, Analysis,\nConclusion, and Action plan)\n•\nUse basic SWOT analysis as self-\nassessment strategy\n•\nDevelop reflective practice\nthrough realization of limitations,\nlikes/ dislikes through showing of\nself-confidence\n•\nDemonstrate self-acceptance and\nbeing able to accept challenges\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• 5 Role-playing\n• Demonstration or\nsimulation with\noral questioning\n• Case problems\ninvolving\nworkplace\ndiversity issues\n1 Hour\n4.3 Boost self-\nconfidence and\ndevelop self-\nregulation\n•\nDescribe the components of self-\nregulation based on Self-\nRegulat