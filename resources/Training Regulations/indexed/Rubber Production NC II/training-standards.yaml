    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for RUBBER PRODUCTION NC ll.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany the curricula.\n\nCourse Title:\nRUBBER PRODUCTION\nNC Level\nNC II\n\nNominal Training Duration:\n\n37 Hours (Basic Competencies)\n\n72 Hours (Common Competencies)\n\n212 Hours (Core Competencies)\n\n321 TOTAL HOURS\n\nThe applicable training modality for this Training Regulation is a combination\nof institution-based under (Section 3.2.2.1), enterprise-based under (Section 3.2.2.2)\nand community-based under (Section 3.2.2.3) of which at least 40 hours shall be\ndedicated to actual workplace learning/ industry training. The training design shall\nfollow the requirements of SIL as stipulated in TESDA Circular No. 089 series 2019\nentitled “Implementing Guidelines for Supervised Industry Learning (SIL)”,\nparticularly under Sections V, VI and VII thereof.\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of rubber production in accordance with industry standards. It\ncovers specialized competencies such as producing budstick, establishing rubber\nnursery, performing budding operation, performing rubber farm management and\nharvesting latex.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieve.\n\n--- PDF PAGE 85 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 81\nBASIC COMPETENCIES – NATIONAL CERTIFICATE NC II\n37 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures\nand systems\n•\nIdentify:\no Different modes of\ncommunication\no Medium of communication\no Flow of communication\no Available technology relevant\nto the enterprise and the\nindividual’s work\nresponsibilities\n•\nPrepare different Types of\nquestion\n•\nGather different sources of\ninformation\n•\nApply storage system in\nestablishing workplace information\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n1.2 Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and\ninstructions\no Workplace interactions and\nprocedures\n•\nRead instructions on work related\nforms/documents\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written\nexamination\n• Observation\n2 Hours\n\n--- PDF PAGE 86 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 82\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nPerform workplace duties scenario\nfollowing workplace instructions\n1.3 Complete\nrelevant work\nrelated\ndocuments\n•\nDescribe Communication\nprocedures and systems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n•\nRead instructions on work relat