o and use of equipment/facilities can be provided through cooperative arrangements\nor MOA with other partner/companies.\n2. Items with asterisk (*) will be required during the pandemic as mandated by the existing\nguidelines issued by the government in line with protection against virus and other infectious\ndiseases for trainees and trainers.\n\n3.5\nTRAINING FACILITIES\n\nRUBBER PRODUCTION NC II\n\nBased on a class intake of 25 learners/trainees.\n\nSPACE\nREQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nA. Building\n(permanent)\n\n184.30\n• Lecture\nRoom/Workshop\n\n40.00\n• Learning Resource\nCenter\n3.00 x 5.00\n\n15.00\n• Activity Room\n\n30.00\n- Wash room\n2X1\n2.00\n\n- Store room\n4X4\n16.00\n\n- Rest room\n(male, female &\nPWD)\n3X4\n12.00\n\n• Facilities/\nEquipment/\nCirculation Area\n(30% of teaching\naccommodation)\n\n99.30\nB. Experimental\nRubber Farm\n\n5,000.00\nTOTAL\n\n5,184.30\nNOTE: Access to and use of equipment /facilities can be provided through cooperative arrangements\nor MOA with other partner- companies/institutions.\n\n--- PDF PAGE 127 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 123\n\n3.6\nTRAINER’S QUALIFICATIONS FOR AGRI-FISHERY SECTOR\n\nTrainers who will deliver the training on RUBBER PRODUCTION NC II\nshould have the following:\n\nFOR NEW TRAINERS\n• Must be a holder of NTTC I (NC + TM1) on RUBBER PRODUCTION NC II\nand;\n• Must have at least 2 years’ industry experience within the last five (5)\nyears.\n\nFOR EXISTING TRAINERS\n• Must be a holder of National TVET Trainer Certificate (NTTC) Level I on\nRUBBER PRODUCTION NC II and;\n• Must have at least 40 hours industry immersion for the last three (3) years.\nOr\n• Must have at least 40 hours participation in seminars, workshops, and\nforum relevant to rubber production.\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee is competent or not competent.\n\n--- PDF PAGE 128 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 124"
