      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany the curricula.\n\nCourse Title:\nRUBBER PRODUCTION\nNC Level\nNC II\n\nNominal Training Duration:\n\n37 Hours (Basic Competencies)\n\n72 Hours (Common Competencies)\n\n212 Hours (Core Competencies)\n\n321 TOTAL HOURS\n\nThe applicable training modality for this Training Regulation is a combination\nof institution-based under (Section 3.2.2.1), enterprise-based under (Section 3.2.2.2)\nand community-based under (Section 3.2.2.3) of which at least 40 hours shall be\ndedicated to actual workplace learning/ industry training. The training design shall\nfollow the requirements of SIL as stipulated in TESDA Circular No. 089 series 2019\nentitled “Implementing Guidelines for Supervised Industry Learning (SIL)”,\nparticularly under Sections V, VI and VII thereof.\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of rubber production in accordance with industry standards. It\ncovers specialized competencies such as producing budstick, establishing rubber\nnursery, performing budding operation, performing rubber farm management and\nharvesting latex.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieve.\n\n--- PDF PAGE 85 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 81\nBASIC COMPETENCIES – NA