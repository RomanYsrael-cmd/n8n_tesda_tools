d statistics\n•\nApplication of data analysis\ntechniques\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n6.3 Record and\npresent\ninformation\n•\nLecture and discussion on:\no Reporting requirements to a\nrange of audiences\no Recommendations for possible\nimprovements\n•\nAnalysis and comparison of\ninterim and final reports’ outcomes\n•\nReporting of data findings\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 Hours\n7. Practice\nOccupational\nSafety And Health\nPolicies And\nProcedures\n7.1 Identify OSH\ncompliance\nrequirements\n•\nDiscussion regarding:\no Hierarchy of Controls\no Hazard Prevention and\nControls\no Work Standards and\nProcedures\no Personal Protective Equipment\n• Lecture\n• Group Discussion\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n7.2 Prepare OSH\nrequirements\nfor compliance\n•\nIdentification of required safety\nmaterials, tools and equipment\n•\nHandling of safety control\nresources\n• Lecture\n• Group Discussion\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 Hour\n\n--- PDF PAGE 94 ---\nTR-Rubber Production NC II Revision 01 Promulgated (02/09/2021) 90\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n7.3 Perform tasks in\naccordance\nwith relevant\nOSH policies\nand procedures\n•\nDiscussion of General OSH\nStandards and Principles\n•\nPerforming industry related work\nactivities in accordance with OSH\nStandards\n• Lecture\n• Group Discussion\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n2 Hours\n8. Exercise Efficient\nand Effective\nSustainable\nPractices in the\nWorkplace\n8.1 Identify the\nefficiency and\neffectiveness of\nresource\nutilizat