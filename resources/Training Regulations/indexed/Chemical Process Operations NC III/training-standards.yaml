  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for CHEMICAL PROCESS OPERATIONS NC III.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to include MLC-\n2006, green technology, issues on health and drugs and cater person with disabilities\n(PWD’s).\n\nCourse Title: CHEMICAL PROCESS OPERATIONS NC Level: NCIII\n\nNominal Training Duration:\n20\nHours\nBasic Competencies\n56\nHours\nCommon Competencies\n224\nHours\nCore Competencies\n Total:\n300\nHours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude of\nCHEMICAL PROCESS OERATIONS NC III in accordance with industry standards. This\ncovers competencies that a person must achieve to perform chemical operations and\ncontrol chemical processes.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 88 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016\n84\nBASIC COMPETENCIES\n(20 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation about\nworkplace\nprocesses\n• Read\n• Lecture\n• Written Test\n4 Hours\no Effective verbal communication\nmethods\n\no Sources of information\n\n• Practice organizing information\n• Demonstration\n• Observation\n\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Lecture\n• Written Test\n\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Demonstration\n• Practical\nexercises\n• Observation\n\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n• Demonstration\n• Role Play\n• Observation\n\n1.2 Lead workplace\ndiscussions\n• Describe:\no Organizational policy on\nproduction, quality and safety\n• Group\ndiscussion\n• Oral evaluation\n\no Goals/ objectives and action plan\nsetting\n\n• Read\n• Lecture\n• Written Test\n\no Effective verbal communication\nmethods\n•\n•\n\n• Prepare/set action plans based on\norganizational goals and objectives\n• Demonstration\n• Observation\n\n1.3 Identify and\ncommunicate\nissues arising in\nthe workplace\n• Describe:\no Organizational policy in dealing\nwith issues and problems\n• Group\ndiscussion\n• Oral evaluation\n\n• Read\n• Lecture\n• Written Test\n\no Effective verbal communication\nmethods\n\n--- PDF PAGE 89 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 85\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Practice organizing information\n• Demonstration\n• Observation\n\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n• Demonstration\n• Role Play\n• Observation\n\n2. Lead small\nteam\n2.1 Provide team\nleadership\n• Describe:\nCompany policies and procedures\n• Group\ndiscussion\n• Oral evaluation\n4 Hours\n\n• Identify client expectations\n• Lecture\n• Written\nexamination\n\n• Practice team building skills\n• Demonstration\n• Observation\n\n• Perform exercises on communication\nskills requi