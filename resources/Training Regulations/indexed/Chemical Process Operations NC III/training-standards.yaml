mpetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3. Operate\nprocess\nequipment\n\n3.1 Conduct\nReady-for-\nStart-up\nactivities\n• Describe sequence of equipment operation\n\n• Prepare equipment for production operation\n\n• Identify factors that may affect processing\nquality\n\n• Demonstrate ability to comprehend oral and\nwritten communication\n\n• Read:\n-\nEquipment operations Manual\n-\nWork instructions\n-\nDOLE-DO 136 Guidelines for the\nimplementation of GHS in Chemical Safety\nProgram in the Workplace\n\n• Self-paced\nlearning\n• Video presentation\n• Focus group\ndiscussion\n• Simulation\n• Practical exercises\n\n• Written Test\n• Oral Questioning\n• Demonstration\n\n16 hours\n\n3.2 Start up\nequipment\n• Demonstrate how to turn equipment on in\ncorrect sequence\n\n• Demonstrate ability to comprehend oral and\nwritten communication\n\n• Read:\n-\nEquipment operations Manual\n-\nWork instruction\n-\nDOLE-DO 136 Guidelines for the\nimplementation of GHS in Chemical Safety\nProgram in the Workplace\n\n• Self-paced\nlearning\n• Video presentation\n• Focus group\ndiscussion\n• Simulation\n• Practical exercises\n\n• Oral Questioning\n• Demonstration\n16hours\n\n--- PDF PAGE 108 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 104\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.3 Occupational\nhealth and\nsafety\nprotocols are\npracticed\n• Describe engineering controls and how it\nprotect workers from hazards\n• Familiarization of Safety Data sheets\n• Understand the basic safety practice in\nchemical manufacturing such as the use of\nSafety Data Sheets (SDS) and understanding\nthe Globally Harmonized System (GHS)\n• Understand the basic work operations to\ncontrol risks, for example, permit to work\nsystems and isolation procedures\n\n• Read:\n-\nDOLE-OSHS Rules and other occupational\nhealth and safety regulations\n-\nOccupational Health and Safety Hazard and\nrisk concepts\n-\nThe hierarchy of ways to control risks\n-\nDOLE-DO 136 Guidelines for the\nimplementation of GHS in Chemical Safety\nProgram in the Workplace\n\n• Self-paced\nlearning\n• Video presentation\n• Focus group\ndiscussion\n• Simulation\n• Practical exercises\n\n• Written Test\n• Oral Questioning\n• Demonstration\n\n16hours\n\n3.4 Environmental\nprotocols are\nimplemented\n•\nDescribe different types of wastes\n•\nDescribe proper ways of handling, labeling,\nstoring and treating chemical wastes.\n\n•\nRead:\n1. DAO 35, DAO 81, RA 9003, RA 6969 and\nother relevant wastes, effluent and emission\nregulations\n2. Environmental Aspect and Impact concepts\n\n• Self-paced\nlearning\n• Video presentation\n• Focus group\ndiscussion\n• Simulation\n• Practical exercises\n\n• Written Test\n• Oral Questioning\n• Demonstration\n\n16hours\n\n--- PDF PAGE 109 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 105\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4. Monitor\nprocess\nequipment\n\n4.1 Verify\noperating\nparameters\n• Describe and evaluate equipment condition.\n\n• Identify and correct equipment problem.\n\n• Demonstrate ability to comprehend oral and\nwritten communication\n\n• Read:\n-\nEquipment operations Manual\n-\nDOLE-DO 136 Guidelines for the\nimplementation of GHS in Chemical Safety\nProgram in the Workplace\n-\nWork instruction\n• Self-paced\nlearning\n• Video presentation\n• Group discussion\n• Role play\n• Written Test\n• Oral Questioning\n• Demonstration\n\n16 hours\n\n4.2 Adjust\nequipment\nsetting\n• Demonstrate manual or electronic adjustment\nof equipment settings.\n\n• Practice safety protocols in handling\nequipment.\n\n• Demonstrate ability to comprehend oral and\nwritten communication\n• Self-paced\nlearning\n• Video presentation\n• Group discussion\n• Role play\n• Written Test\n• Oral Questioning\n• Demonstration\n16 hour\n\n• Read:\n-\nEquipment operations Manual\n-\nDOLE-DO 136 Guidelines for the\nimplementation of GHS in Chemical Safety\nProgram in the Workplace\n-\nWork instruction\n-\nEquipment calibration and maintenance\n\n4.3 Update data\nsheets\n• Demonstrate proper documents and records\ncontrol\n\n• Demonstrate ability to comprehend oral and\nwritten communication\n• Self-paced\nlearning\n• Video presentation\n• Group discussion\n• Role play\n• Written Exam\n• Oral Questioning\n• Demonstration\n4 hour\n\n--- PDF PAGE 110 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 106\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5. Qualify in-\nprocess and\nfinished\nproduct\nsamples\n\n5.1 Collect\nsamples\n• Describe the protocols for sample collection\n\n• Describe the sources of sample contamination\n\n• Describe the control measures to avoid sample\ncontamination\n\n• Describe the risks associated in collecting\nsamples\n\n• Demonstrate proper use of PPEs\n\n• Demonstrate ability to comprehend oral and\nwritten communication\n\n• Read:\n-\nSampling plan\n-\nSample labeling\n-\nDOLE-DO 136 Guidelines for the\nimplementation of GHS in Chemical Safety\nProgram in the Workplace\n\n• Self-paced\nlearning\n• Video presentation\n• Group discussion\nPractical exercises\n• Written Exam\n• Oral Questioning\n• Demonstration\n16 hours\n\n5.2 Verify\nconformance\n\n• Describe product specifications.\n\n• Demonstrate ability to detect non-conformance\nto requirements\n\n• Demonstrate ability to comprehend oral and\nwritten communication\n\n• Read:\n-\nProduct specifications\n-\nDOLE-DO 136 Guidelines for the\nimplementation of GHS in Chemical Safety\nProgram in the Workplace\n• Self-paced\nlearning\n• Video presentation\n• Group discussion\n• Practical exercises\n\n• Oral Questioning\nDemonstration\n24 hours\n\n--- PDF PAGE 111 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 107\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.3 Document\nfindings\n\n• Demonstrate proper documents and records\ncontrol\n\n• Demonstrate ability to comprehend oral and\nwritten communication\n• Practical exercises\n\n•\nOral\nQuestioning\n\n4 hrs\n6. Perform\nshutdown\nactivities\n\n6.1 Prepare for\nshut down\n• Describe the requirements for shutdown\n\n• Demonstrate ability to comprehend oral and\nwritten communication\n\n• Read:\n-\nEquipment operations Manual\n-\nDOLE-DO 136 Guidelines for the\nimplementation of GHS in Chemical Safety\nProgram in the Workplace\n-\nWork instruction\n• Self-paced\nlearning\n• Video presentation\n• Group discussion\n• Practical exercises\n• Written Exam\n• Oral Questioning\n• Demonstration\n8 hours\n\n6.2 Shutdown\nprocess\nequipment\n\n• Demonstrate how to turn equipment off in\ncorrect sequence\n\n• Demonstrate ability to comprehend oral and\nwritten communication\n\n• Read:\n-\nEquipment operations Manual\n-\nDOLE-DO 136 Guidelines for the\nimplementation of GHS in Chemical Safety\nProgram in the Workplace\n-\nWork instruction\n• Self-paced\nlearning\n• Video presentation\n• Group discussion\n• Practical exercises\n\n• Oral Questioning\n• Demonstration\n.\n\n--- PDF PAGE 112 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 108\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the principles of competency-based TVET.\n\na.\nCourse design is based on competency standards set by the\nindustry or recognized industry sector; (Learning system is driven\nby competencies written to industry standards)\n\nb.\nTraining delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n\nc.\nTraining can be done on an actual workplace setting, simulation of\na workplace and/or through adoption of modern technology.\n\nd.\nAssessment is based in the collection of evidence of the\nperformance of work to the industry required standards;\n\ne.\nAssessment of competency takes the trainee’s knowledge and\nattitude into account but requires evidence of actual performance of\nthe competency as the primary source of evidence.\n\nf.\nTraining program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n\ng.\nTraining completion is based on satisfactory performance of all\nspecified competencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on- and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1 School/Institution-Based\n\n•\nDual Training System (DTS) / Dualized Training Program\n(DTP) which contain both in-school and in-industry training or\nfieldwork components.\n\n•\nSupervised Industry Training (SIT) or on-the-job training (OJT)\nis an approach in training designed to enhance the knowledge\nand skills of the trainee through actual experience in the\nworkplace to acquire specific competencies as prescribed in\nthe training regulations. It is imperative that the deployment of\ntrainees in the workplace is adhered to training programs and\nagreed by the institution and enterprise and status and\nprogress of trainees are closely monitored by the training\ninstitutions to prevent opportunity for work exploitation.\n\n--- PDF PAGE 113 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 109\n•\nProject-based instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate\nprojects that have real world applications.\n\n2.2 Enterprised-Based:\n\nEnterprised-based training may also be taken to mean a\nschool or training center with one or more partner enterprise or\nan enterprise or group of enterprises setting up a common\ntraining facility or partnering with a school or training center.\n\n•\nEnterprised-based\ntraining\n–\nwhere\ntraining\nis\nimplemented within the company in accordance with the\nrequirements of the specific company.\n\n•\nFormal Apprenticeship – Training within employment\ninvolving a contract between an apprentice and an enterprise\non an approved apprenticeable occupation.\n\n•\nInformal Apprenticeship – is based on training (and\nworking) agreement between an apprentice and an\nexperienced chemical operator wherein the agreement may\nbe written or oral. The experienced chemical operator\ncommits to training the apprentice in all the skills relevant to\nhis or her trade over a significant period of time, usually\nbetween one and four years, while the apprentice commits to\ncontributing productively to the work of the business.\nTraining is integrated into the production process and\napprentices learn by working alongside the experienced\nchemical technician.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n• Must have completed 12 years basic education\n• Can communicate in English language both oral and written\n• Must be physically fit\n\n--- PDF PAGE 114 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 110\n3.4 TOOLS AND EQUIPMENT\n\nCHEMICAL PROCESS OPERATION NC III\n\nRecommended List of tools, equipment and materials for the\ntraining of a maximum of 15trainees for CHEMICAL PROCESS\nOPERATION NC III are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQuantity\nUnit\nDescription\nQuantity\nUnit\nDescription\nQuantity\nUnit\nDescription\n2\nPCS\nWrench\n2\nPCS\nPersonal\nComputer\n1\nReam\nBond Paper\n11\nPCS\nCutting tools\n1\nSET\nAudio-video\nequipment/\nProjector\n11\nPCS\nPermanent\nMarker\n11\nSETS\nSampling tools\n