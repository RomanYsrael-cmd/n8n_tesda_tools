nexamination\n\no Relevant technology application/\nimplementation\n\no Operating instructions\n\n• Practice basic communication skill in a\ngroup activity\n• Demonstration\n• Simulation/\nRole Play\n• Observation\n\n6.2 Apply relevant\ntechnology\n• Describe different management\nconcepts\n• Group\nDiscussion\n• Oral evaluation\n\n• Read:\no Relevant technology application/\nimplementation\n• Lecture\n• Written\nexamination\n\no Technology adaptability\n\no Different management concepts\n\no Health and safety procedure\n\no Communication techniques\n\n• Apply software applications skills\n• Demonstration\n• Observation\n\n• Practice drills on installing application\nsoftware\n• Demonstration\n• Simulation/\nRole Play\n• Observation\n\n• Practice basic communication skill in a\ngroup activity\n\n6.3 Maintenance /\nenhance relevant\ntechnology\n• Read:\no Repair and maintenance procedure\n• Lecture\n• Written\nexamination\n\n--- PDF PAGE 96 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 92\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\no Operating instructions\n• Lecture\n• Written\nexamination\n\n• Practice drills:\no installing application software\n• Demonstration\n• Simulation/\nRole Play\n• Observation\n\no Basic troubleshooting skills\n\n--- PDF PAGE 97 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 93\nCOMMON COMPETENCIES\n(56 hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Observe safe\nworking\npractices\n1.1 Identify and\nfollow\nworkplace\nprocedures\nfor hazard\nidentification\nand risk\ncontrol\n\n•\nIdentify hazards and corresponding risks\n•\nIdentify environmental aspects and corresponding\nimpacts.\n•\nUnderstand the basic safety practice in chemical\nmanufacturing.\n•\nUnderstand the basic work operations to control risks,\nfor example, permit to work systems and isolation\nprocedures\n•\nRead:\n-\nOccupational Health and Safety Hazard and risk\nconcepts\n-\nThe hierarchy of ways to control risks\n-\nEnvironmental Aspect and Impact concepts\n-\nDOLE-DO 136 Guidelines for the implementation\nof GHS in Chemical Safety Program in the\nWorkplace\n-\nDOLE-OSHS Rule 1070, 1080 and 1090\n• Self-paced\nlearning\n• Discussion\n• Group work\n• Individual\nPractice\n• Written Test\n• Oral Questioning\n• Demonstration\n\n8 hours\n\n--- PDF PAGE 98 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 94\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n1.2 Contribute to\narrangement\ns for the\nmanagement\nof\noccupational\nhealth and\nsafety\n\n•\nThe company procedures in managing occupational\nhealth and safety concerns, which includes\n-\nPolicies\n-\nPlant and equipment maintenance\n-\nHazard identification\n-\nRisk assessment and control\n-\nEnvironmental aspect identification\n-\nEnvironmental impact assessment and control\n•\nTraining on basic understanding of Occupational\nHealth and Safety Rules (or Standards)\n•\nUnderstanding the role of workers in the Health and\nSafety committee.\n•\nCommunication skills\n•\nWorkplace procedures for raising Occupational\nHealth and Safety issues\n-\nDOLE-OSHS Rule 1030 Training of personnel in\nOSH\n-\nDOLE-OSHS Rule 1040 Health and Safety\nCommittee\n-\nDOLE-OSHS Rule 1070 Occupational Health and\nEnvironmental Control\n-\nDOLE-DO 136 Guidelines for the implementation\nof GHS in Chemical Safety Program in the\nWorkplace\n• Self-paced\nlearning\n• Discussion\n• Group work\n• Individual\nPractice\n• Written Test\n• Oral Questioning\n• Demonstration\n\n1.3 Complete\noccupational\nhealth and\nsafety\nrecords\n•\nUnderstand the difference between disabling and\nnon-disabling accidents\n•\nWorkplace procedures for reporting accidents\n•\nRead:\n-\nThe roles of safety officers in a chemical\nmanufacturing plant\n-\nDOLE-OSHS Rule 1050 Notification and keeping\nof records of accidents and/or occupational illness\n-\nDOLE-OSHS Rule 1960 Occupational Health\nServices\n• Self-paced\nlearning\n• Discussion\n• Group work\n• Individual\nPractice\n• Written Test\n• Oral Questioning\n• Demonstration\n\n--- PDF PAGE 99 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 95\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n2. Comply with\nemergency\nprocedures\n2.1 Take actions\nto prevent\noccurrence of\nemergency\n•\nConducts hazards and risks assessment\n•\nConducts environmental aspect and impact\nassessment\n•\nEmergency practice drills may include drills for fire,\nspillage and earthquake.\n•\nProper use of emergency equipment such as Fire\nextinguishers, Fire alarm switch, etc.\n•\nUnderstand the emergency warning signs and\nsymbols such as emergency alarms.\n•\nRead:\n-\nTypes of emergencies\n-\nPreventive programs to prevent emergency\n-\nContingency plans for emergency\n-\nDOLE-OSHS Rule 1960 Occupational Health\nServices\n-\nDOLE-OSHS Rule 1040 Health and safety\ncommittee\n-\nDOLE-OSHS Rule 1030 Training personnel in\nOSH\n• Self-paced\nlearning\n• Discussion\n• Group work\n• Individual\nPractice\n• Written Test\n• Oral Questioning\n• Demonstration\n\n8 hours\n\n2.2 Follow\nestablished\nprotocols to\ncontrol risks in\nthe work place\n•\nEmergency alarm signals and systems in use in\nmanufacturing plants and procedures to be followed\nwhen an emergency alarm is raised\n•\nEscape routes and internal and external\ncommunications systems and alarms\n•\nCommunication techniques used during emergencies\n•\nApplying appropriate action in various types of actual\nor potential emergency situations\n•\nRead:\n-\nDOLE-DO 136 Guidelines for the implementation\nof GHS in Chemical Safety Program in the\nWorkplace\n• Self-paced\nlearning\n• Discussion\n• Group work\n• Individual\nPractice\n• Written Test\n• Oral Questioning\n• Demonstration\n\n--- PDF PAGE 100 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 96\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.3 Take\nimmediate\nactions in the\nevent of an\nemergency\n•\nGeneral principles of damage control including the\nimportance of preparation, control and recovery\nstages in the emergency management plan\n•\nContingency plans for emergency including\nprocedures for review of its effectiveness after an\nemergency.\n•\nWays of controlling damage during emergency.\n•\nUsing emergency alarm signals and systems\n•\nUsing personal protective equipment\n•\nRead:\n-\nDOLE-OSHS Rule 1940 Fire Protection and\nControl\n• Self-paced\nlearning\n• Discussion\n• Group work\n• Individual\nPractice\n• Written Test\n• Oral Questioning\n• Demonstration\n\n3. Use hand and\nmeasuring tools\n3.1 Prepare the\nrequired\ntools\ncorrespondin\ng to tasks to\nbe\nundertaken\n•\nFamiliarization of the work plan and corresponding\ntools needed per activity or task\n•\nFamiliarization of tool and test equipment\nspecifications\n•\nRead:\n-\n DOLE-OSHS Rule 1422 Hand Tools\n\n• Self-paced\nlearning\n• Discussion\n• Group work\n• Individual\nPractice\n• Written Test\n• Oral Questioning\n• Demonstration\n\n16\nhours\n\n3.2 Use\nappropriate\ntools and test\nequipment\n•\nTypes of tools and test equipment used in chemical\nprocessing.\n•\nProper use of tools and test equipment\n•\nProper operation of chemical control panels.\n•\nRead:\n-\nDOLE-OSHS Rule 1422 Hand Tools\n• Self-paced\nlearning\n• Discussion\n• Group work\n• Individual\nPractice\n• Written Test\n• Oral Questioning\n• Demonstration\n\n3.3 Maintain\ntools\n•\nPreventive maintenance program for tools and\nequipment.\n•\nRecognize unsafe tools or test equipment\n•\nCoordination for repair of defective tools\n•\nFamiliarization of tool and test equipment\nspecifications\n•\nProper storage of tools.\n•\nRead:\n-\nDOLE-OSHS Rule 1422 Hand Tools\n• Self-paced\nlearning\n• Discussion\n• Group work\n• Individual\nPractice\n• Written Test\n• Oral\nQuestioning\n• Demonstration\n\n--- PDF PAGE 101 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 97\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n4. Perform\nMensuration\nand\nCalculation\n4.1 Select\nmeasuring\ninstruments\n•\nIdentify what component needs to be measured\n•\nSelection measuring instruments\n•\nBasic units of measurement\n•\nConversion of units\n•\nRead:\n-\nUnits of measurement\n-\nConversion of units\n-\nFractions and Percentages\n-\nRatio and proportion\n-\nDOLE-OSHS Rule 1422 Hand Tools\n\n• Self-paced\nlearning\n• Discussion\n• Group work\n• Individual\nPractice\n• Written Test\n• Oral Questioning\n• Demonstration\n\n16\nhours\n\n4.2 Carry out\nmeasurement\ns and\ncalculation\n•\nProper use of measuring tools\n•\nAccuracy in measurement and calculations\n•\nPerform the corresponding calculations required\n•\nRead:\n-\nDOLE-OSHS Rule 1422 Hand Tools\n-\nDOLE-OSHS Rule 1080 Protective equipment and\ndevices\n-\nDOLE-DO 136 Guidelines for the implementation\nof GHS in Chemical Safety Program in the\nWorkplace\n-\n• Self-paced\nlearning\n• Discussion\n• Group work\n• Individual\nPractice\n• Written Test\n• Oral Questioning\n• Demonstration\n\n4.3 Maintain\nmeasuring\ninstruments\n•\nProper storage of measuring equipment\n•\nPreventive maintenance of measuring equipment\n•\nCalibration of measuring equipment\n•\nRepair of measuring equipment\n•\nRead:\n-\nDOLE-OSHS Rule 1422 Hand Tools\n-\nDOLE-OSHS Rule 1080 Protective equipment and\ndevices\n• Self-paced\nlearning\n• Discussion\n• Group work\n• Individual\nPractice\n• Written Test\n• Oral Questioning\n• Demonstration\n\n--- PDF PAGE 102 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 98\nUnit of\nCompetency\nL