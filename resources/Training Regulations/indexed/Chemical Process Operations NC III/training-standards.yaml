negotiations\n• Describe:\no codes of practice and guidelines for\nthe organization\n• Group\nDiscussion\n• Oral evaluation\n2 hours\n\ndifferences between content and\nprocess\n\n• Read:\no Organizations policy and\nprocedures for negotiations\n• Lecture\n• Written\nexamination\n\no Decision making and conflict\nresolution strategies procedures\n\no Strategies to manage conflict\n• Lecture\n• Written\nexamination\n\no Steps in negotiating process\n•\n•\n\n• Identify bargaining information\n• Lecture\n• Written\nexamination\n\n• Apply strategies to manage process\n• Demonstration\n• Observation\n\n• Apply steps in negotiating process\n\n4.2 Participate in\nnegotiations\n• Describe the following strategies\nduring negotiation:\n• Group\nDiscussion\n• Case studies\n• Oral evaluation\n\no Decision making and conflict\nresolution strategies procedures\n\no Problem solving strategies on how\nto deal with unexpected questions\n\n--- PDF PAGE 93 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 89\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nand attitudes during negotiation\n\n• Practice the following scenarios in a\ngroup activity:\no Perform interpersonal skills to\ndevelop rapport with other parties\n• Demonstration\n• Simulation/\nRole play\n• Observation\n\no Perform verbal communication and\nlistening skill\n\no observation skills\n\no negotiation skills\n\n4.3 Document areas\nfor agreement\n• Describe the Procedure in\ndocumenting negotiations\n• Group\nDiscussion\n\n• Simulation/\nRole play\n• Oral evaluation\n\n• Apply a filing system in managing\ninformation\n• Demonstration\n• Observation\n\n• Demonstrate filing of documents\n\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify\nmathematical tools\nand techniques to\nsolve problems\n• Describe the four fundamental\noperation (addition, subtraction,\ndivision, multiplication)\n• Group\nDiscussion\n• Oral evaluation\n4 Hours\n• Read:\no Measurement system\n• Lecture\n• Written\nexamination\n\no Precision and accuracy\n\no Basic measuring tools/devices\n• Lecture\n• Written\nexamination\n\n• Apply mathematical computations\n• Demonstration\n• Observation\n\n• Demonstrate activities on:\nUse of calculator\n\n• Demonstration\n• Observation\n\n--- PDF PAGE 94 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 90\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Use of different measuring tools\n\n5.2 Apply mathematical\nprocedures /\nsolution\n• Read:\no Estimation\n\n• Lecture\n• Written\nexamination\n\no Problem-based questions\n\no Mathematical techniques\n\n• Apply mathematical computations\n• Demonstration\n• Simulation/\nRole play\n• Observation\n\n• Demonstrate activities on:\no Use of calculator\n• Demonstration\n• Observation\n\no Use of different measuring tools\n\no Use of mathematical tools and\nstandard formulas\n\n5.3 Analyze results\n• Describe the four fundamental\noperation (addition, subtraction,\ndivision, multiplication)\n\n• Group\nDiscussion\n• Oral evaluation\n\n• Read:\no Measurement system\n• Lecture\n• Written\nexamination\n\no Precision and accuracy\n\no Basic measuring tools/devices\n\n• Apply mathematical computations\n• Demonstration\n• Observation\n\n• Demonstrate activities on:\nUse of calculator\n• Demonstration\n• Observation\n\n--- PDF PAGE 95 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 91\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\nUse of different measuring tools\n\n• Demonstration\n• Observation\n\n6. Use relevant\ntechnologies\n6.1 Identify\nappropriate\ntechnology\n• Describe company policy in relation to\nrelevant technology\n• Group\nDiscussion\n• Oral evaluation\n4 Hours\n\n• Read:\no Awareness on technology and its\nfunction\n• Lecture\n• Written\nexamination\n\no Relevant technology application/\nimplementation\n\no Operating instructions\n\n• Practice basic communication skill in a\ngroup activity\n• Demonstration\n• Simulation/\nRole Play\n• Observation\n\n6.2 Apply relevant\ntechnology\n• Describe different management\nconcepts\n• Group\nDiscussion\n• Oral evaluation\n\n• Read:\no Relevant technology application/\nimplementation\n• Lecture\n• Written\nexamination\n\no Technology adaptability\n\no Different management concepts\n\no Health and safety procedure\n\no Communication techniques\n\n• Apply software applications skills\n• Demonstration\n• Observation\n\n• Practice drills on installing application\nsoftware\n• Demonstration\n• Simulation/\nRole Play\n• Observation\n\n• Practice basic communication skill in a\ngroup activity\n\n6.3 Maintenance /\nenhance relevant\ntechnology\n• Read:\no Repair and maintenance procedure\n• Lecture\n• Written\nexamination\n\n--- PDF PAGE 96 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 92\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\no Operating instructions\n• Lecture\n• Written\nexamination\n\n• Practice drills:\no installing application software\n• Demonstration\n• Simulation/\nRole Play\n• Observation\n\no Basic troubleshooting skills\n\n--- PDF PAGE 97 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 93\nCOMMON COMPETENCIES\n(56 hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Observe safe\nworking\npractices\n1.1 Identify and\nfollow\nworkplace\nprocedures\nfor hazard\nidentification\nand risk\ncontrol\n\n•\nIdentify hazards and corresponding risks\n•\nIdentify environmental aspects and corresponding\nimpacts.\n•\nUnderstand the basic safety practice in chemical\nmanufacturing.\n•\nUnderstand the basic work operations to control risks,\nfor example, permit