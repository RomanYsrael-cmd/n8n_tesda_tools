ning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n2. Comply with\nemergency\nprocedures\n2.1 Take actions\nto prevent\noccurrence of\nemergency\n•\nConducts hazards and risks assessment\n•\nConducts environmental aspect and impact\nassessment\n•\nEmergency practice drills may include drills for fire,\nspillage and earthquake.\n•\nProper use of emergency equipment such as Fire\nextinguishers, Fire alarm switch, etc.\n•\nUnderstand the emergency warning signs and\nsymbols such as emergency alarms.\n•\nRead:\n-\nTypes of emergencies\n-\nPreventive programs to prevent emergency\n-\nContingency plans for emergency\n-\nDOLE-OSHS Rule 1960 Occupational Health\nServices\n-\nDOLE-OSHS Rule 1040 Health and safety\ncommittee\n-\nDOLE-OSHS Rule 1030 Training personnel in\nOSH\n• Self-paced\nlearning\n• Discussion\n• Group work\n• Individual\nPractice\n• Written Test\n• Oral Questioning\n• Demonstration\n\n8 hours\n\n2.2 Follow\nestablished\nprotocols to\ncontrol risks in\nthe work place\n•\nEmergency alarm signals and systems in use in\nmanufacturing plants and procedures to be followed\nwhen an emergency alarm is raised\n•\nEscape routes and internal and external\ncommunications systems and alarms\n•\nCommunication techniques used during emergencies\n•\nApplying appropriate action in various types of actual\nor potential emergency situations\n•\nRead:\n-\nDOLE-DO 136 Guidelines for the implementation\nof GHS in Chemical Safety Program in the\nWorkplace\n• Self-paced\nlearning\n• Discussion\n• Group work\n• Individual\nPractice\n• Written Test\n• Oral Questioning\n• Demonstration\n\n--- PDF PAGE 100 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 96\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.3 Take\nimmediate\nactions in the\nevent of an\nemergency\n•\nGeneral principles of damage control including the\nimportance of preparation, control and recovery\nstages 