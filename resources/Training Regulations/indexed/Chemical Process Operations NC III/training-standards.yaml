• Demonstration\n16 hour\n\n• Read:\n-\nEquipment operations Manual\n-\nDOLE-DO 136 Guidelines for the\nimplementation of GHS in Chemical Safety\nProgram in the Workplace\n-\nWork instruction\n-\nEquipment calibration and maintenance\n\n4.3 Update data\nsheets\n• Demonstrate proper documents and records\ncontrol\n\n• Demonstrate ability to comprehend oral and\nwritten communication\n• Self-paced\nlearning\n• Video presentation\n• Group discussion\n• Role play\n• Written Exam\n• Oral Questioning\n• Demonstration\n4 hour\n\n--- PDF PAGE 110 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 106\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5. Qualify in-\nprocess and\nfinished\nproduct\nsamples\n\n5.1 Collect\nsamples\n• Describe the protocols for sample collection\n\n• Describe the sources of sample contamination\n\n• Describe the control measures to avoid sample\ncontamination\n\n• Describe the risks associated in collecting\nsamples\n\n• Demonstrate proper use of PPEs\n\n• Demonstrate ability to comprehend oral and\nwritten communication\n\n• Read:\n-\nSampling plan\n-\nSample labeling\n-\nDOLE-DO 136 Guidelines for the\nimplementation of GHS in Chemical Safety\nProgram in the Workplace\n\n• Self-paced\nlearning\n• Video presentation\n• Group discussion\nPractical exercises\n• Written Exam\n• Oral Questioning\n• Demonstration\n16 hours\n\n5.2 Verify\nconformance\n\n• Describe product specifications.\n\n• Demonstrate ability to detect non-conformance\nto requirements\n\n• Demonstrate ability to comprehend oral and\nwritten communication\n\n• Read:\n-\nProduct specifications\n-\nDOLE-DO 136 Guidelines for the\nimplementation of GHS in Chemical Safety\nProgram in the Workplace\n• Self-paced\nlearning\n• Video presentation\n• Group discussion\n• Practical exercises\n\n• Oral Questioning\nDemonstration\n24 hours\n\n--- PDF PAGE 111 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (