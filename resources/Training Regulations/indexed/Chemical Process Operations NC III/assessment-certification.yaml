    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment. 4.2.1 Accredited Assessment Center. Only a TESDA accredited Assessment Center is authorized to conduct competency assessment. The center has to undergo a quality assured procedure for accreditation before it is authorized by TESDA to manage the assessment for National Certification. It shall enter into a Memorandum of Agreement with a company that has chemical manufacturing facility and other requirements that may be deemed necessary in the conduct of assessment. 4.2.2 Accredited Competency Assessor. Only an accredited competency assessor is authorized to conduct assessment of competence. A competency assessor undergoes a quality assured system of accreditation procedure before being authorized by TESDA to assess the competencies of candidates for National Certification."
