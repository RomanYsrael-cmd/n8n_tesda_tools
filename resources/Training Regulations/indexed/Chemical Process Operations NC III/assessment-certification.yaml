      "number": "4.1",
      "text": "NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification of CHEMICAL PROCESS OPERATIONS NC III, the candidate must demonstrate competence covering all the units of competency listed in Section 1. A successful candidate shall be awarded a National Certificate by the TESDA Director General. 4.1.2 Assessment shall focus on the core units of competency. The basic and common units are assessed concurrently with the core units. 4.1.3 Recognition of Prior Learning (RPL)/Recognition of Current Competencies (RCC). Candidates who have gained competencies through education, informal training, and work or life experiences may apply for recognition in a particular qualification through competency assessment 4.1.4 The following are qualified to apply for assessment: 4.1.4.1 Graduating students/trainees of WTR-registered programs, graduates of NTR programs or graduates of formal/non- formal/informal including enterprise-based trainings related to chemical process operations. 4.1.4.2 Industry workers in chemical process operations. 4.1.5 A candidate who fails the assessment for two (2) consecutive times shall be advised to go through a refresher course before taking another assessment."
