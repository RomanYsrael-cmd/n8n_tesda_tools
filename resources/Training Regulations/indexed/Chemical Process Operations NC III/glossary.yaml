  "source_text": "1. Process\nAn action or series of actions, changes, or functions that\nconverts input into output. A process may require many\nunit operations to obtain the desired product from the\nstarting materials, or feedstocks.\n2. Unit operation\nIs a basic step in a process. Unit operations involve a\nphysical change or chemical transformation such as\nseparation,\ncrystallization,\nevaporation,\nfiltration,\npolymerization, isomerization, and other reactions. For\nexample,\nin\nmilk\nprocessing, homogenization, pasteurization,\nchilling,\nand packaging are each unit operations which are\nconnected to create the overall process\n3. Process Control\nA mechanism for maintaining the output of a\nspecific process within a desired range.\n4. Requirements\nNeed or expectation that is stated, generally implied or\nobligatory\n5. In-process sample\nRefers to samples taken during chemical processing\nstages. Test Results or Data from in-process samples\nare used in order to prevent off-specs finished product.\n6. Final Sample\nRefers to samples taken from the desired product at the\nend of the process in order to identify defects in the\nfinished product.\n\n--- PDF PAGE 121 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 117",
  "document_id": "tesda:tr:chemical-process-operations-nc-iii:e392af3693"
