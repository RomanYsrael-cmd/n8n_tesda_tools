      "term": "An action or series of actions, changes, or functions that",
      "definition": "converts input into output. A process may require many unit operations to obtain the desired product from the starting materials, or feedstocks. 2. Unit operation Is a basic step in a process. Unit operations involve a physical change or chemical transformation such as separation, crystallization, evaporation, filtration, polymerization, isomerization, and other reactions. For example, in milk processing, homogenization, pasteurization, chilling, and packaging are each unit operations which are connected to create the overall process 3. Process Control A mechanism for maintaining the output of a specific process within a desired range. 4. Requirements Need or expectation that is stated, generally implied or obligatory 5. In-process sample Refers to samples taken during chemical processing stages. Test Results or Data from in-process samples are used in order to prevent off-specs finished product. 6. Final Sample Refers to samples taken from the desired product at the end of the process in order to identify defects in the finished product."
    }
