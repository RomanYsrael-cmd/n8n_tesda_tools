PERATIONS NC III (NEW)                          Promulgated March 2016                   19 \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \naccuracy required for the \nproblem \n2.3 Results of mathematical \ncomputation are determined \nand verified based on job \nrequirements \nmathematical tools \nand standard \nformulas \n \nMathematical \ntechniques \n \nEnglish \n \nSelecting and \nusing \nappropriate and \nefficient \ntechniques and \nstrategies to \nsolve problems\n3.   Analyze results  \n3.1 Result of application are \nreviewed based on \nexpected and required \nspecifications and outcome \n3.2 Appropriate action is \napplied in case of error \n \n \nTechniques in \nanalyzing the \nresults \n \nProcess in \nreviewing the \nresults \n \nPrecision and \naccuracy \n \nFour fundamental \noperations \n \nSteps in solving \nproblem \n \nStandard formulas \n \nConversion \nmeasurement \n \nAnalyzing the \nresult based on \nthe specified \nrequirements \n \nInterpreting and \ncommunicating \nthe results of \nthe analysis\n\n--- PDF PAGE 24 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   20 \nRANGE OF VARIABLES \n \n \nVARIABLES \nRANGE \n1. Mathematical \ntechniques \nMay include: \n1.1 Four fundamental operations \n1.2 Measurements \n1.3 Use/Conversion of units of measurements \n1.4 Use of standard formulas \n2. Appropriate \naction \nMay include: \n2.1  Review in the use of mathematical techniques (e.g. recalculation, re-\nmodeling) \n2.2  Report error to immediate superior for proper action \n \n \nEVIDENCE GUIDE \n \n \n1. Critical \nAspects of \nCompetency \nAssessment requires evidence that the candidate: \nIdentified, applied and reviewed the use of mathematical concepts and \ntechniques to workplace problems \n2. Resource \nImplications \nThe following resources should be provided: \n2.1