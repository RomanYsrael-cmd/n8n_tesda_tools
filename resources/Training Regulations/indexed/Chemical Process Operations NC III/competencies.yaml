        "source_text": "CPP313201\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge and skills required to Identify\nand follow workplace procedures for hazard identification and\nrisk control; Contribute to arrangements for the management of\noccupational health and safety; and complete Occupational\nSafety and Health (OSH) records.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify and follow\nworkplace\nprocedures for\nhazard\nidentification and\nrisk control\n\n1.1 Safety regulations and\ncompany established safety\nand hazard control practices\nand procedures are\nobtained, interpreted and\napplied to day-to-day work\nactivities\n1.2 Workplace procedures for\nOccupational Health and\nSafety and related work\ninstructions for controlling\nrisks are accurately followed\n1.3 Workplace procedures for\ndealing with accidents, fire\nand emergencies are known\nand followed\n1.4 Hazards in the workplace\nare identified and appropriate\naction is taken to report them\nand to minimize or eliminate\nrisk to personnel.\n• Knowledge on hazards\nand risks, aspect and\nimpact, provision of\nPersonal Protective\nEquipment and safety\nprograms in chemical\nmanufacturing.\n• The meaning of hazard\nsymbols found on in the\nworkplace.\n• For example, the\nmeaning of Globally\nharmonized system\nGHS symbol in the\nlabeling of chemicals.\n• DOLE-OSHS Rule\n1070 Occupational\nhealth and\nenvironmental control,\nOSHS Rule 1080 PPE\nand devices, Rule 1090\nHazardous Materials\n\n• Following safety\nrules and\nregulations\n• Applying\nestablished\nhazard control\npractices\n• Applying order\nof ways to\ncontrol risks\n(known as the\nhierarchy of\ncontrol)\n\n2. Contribute to\narrangements for\nthe management\nof occupational\nhealth and safety\n\n2.1 Occupational health and\nsafety committee meetings\nare attended.\n2.2 Safety and environmental\nissues are discussed to the\nHealth and Safety committee\nmeetings or other venues in\naccordance to the company\nprocedures.\n2.3 Safety audits or inspections\nare conducted in accordance\nwith the company\nprocedures.\n2.4 Occupational Health and\nSafety Rules or Standards\nare understood and\n• Understanding the\noccupational health and\nsafety management\npolicy of the company\nincluding the following\n3.1 Programs/Plans\n3.2 Procedures\n3.3 Hazard\nidentification\n3.4 Risk assessment\nand control\n• Joint employer/\nemployee inspections\n• DOLE-OSHS Rule\n1030 Training of\n• Applying order\nof ways to\ncontrol risks\n(known as the\nhierarchy of\ncontrol)\n• Participating in\nhealth and\nsafety program\nof the company,\nfor example,\nconsultation of\nworkers that\naffect OHS\nmatters\n\n--- PDF PAGE 30 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 26\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ncomplied.\n2.5 The role of workers in the\nhealth and safety committee\nis understood.\npersonnel in OSH.\n• DOLE-OSHS 1040\nHealth and Safety\nCommittee\n• DOLE-OSHS 1070\nOccupational health\nand environmental\ncontrol\n• DOLE-D.O. 136\nGuidelines for the\nimplementation of GHS\nin Chemical Safety\nProgram in the\nworkplace\n• Communication\nskills\n3. Complete\noccupational\nhealth and safety\nrecords\n3.1 Occupational health and\nsafety records for self are\ncompleted in accordance\nwith workplace requirements.\n3.2 Legal requirements for the\nmaintenance of records of\noccupational injury and\ndiseases are followed.\n\n• DOLE-OSHS Rule\n1050 Notification and\nkeeping of records of\naccidents and/or\noccupational illness,\nDOLE-OSHS Rule\n1960 Occupational\nHealth Services\n\n• Applying proper\nrecord keeping\nin accordance\nwith company\nrequirements.\n• Following the\norder of ways to\ncontrol risks\n(known as the\nhierarchy of\ncontrol)\n\n--- PDF PAGE 31 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hazards\nMay include:\n1.1. Physical hazards\n1.2. Chemical hazards\n1.3. Biological hazards\n1.4. Psychological hazards\n1.5. Ergonomics hazards\n2. Personal\nProtective\nEquipment\nMay include:\n2.1. Gloves\n2.2. Spectacles\n2.3. Apron/overall\n2.4. Hard hat\n2.5. Respirator\n2.6. Safety shoes\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and followed workplace procedures for hazard\nidentification and risk control\n1.2 Contributed to arrangements for the management of\noccupational health and safety\n1.3 Completed occupational health and safety records\n2.Resource\nImplications\nThe following resources should be provided:\n2.1 Relevant technology\n2.2 Interview and demonstration questionnaires\n2.3 Assessment packages\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1.\nInterview\n3.2.\nActual demonstration\n3.3.\nAuthenticated portfolio (related certificates of\ntraining/seminar)\n4. Context of\nAssessment\n4.1 Competency maybe assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 32 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 28\n\nUNIT OF COMPETENCY :\nCOMPLY WITH EMERGENCY PROCEDURES\n\nUNIT CODE\n:"
