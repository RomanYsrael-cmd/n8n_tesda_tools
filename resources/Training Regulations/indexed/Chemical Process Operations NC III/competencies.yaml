        "source_text": "--- PDF PAGE 76 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   72 \nUNIT OF COMPETENCY :  QUALIFY IN-PROCESS AND FINISHED PRODUCT SAMPLES  \n \nUNIT CODE \n: CPP313305 \n \nUNIT DESCRIPTOR \n:  This unit covers the knowledge, skills and attitudes collecting \nsamples in chemical processing plant, verifying its conformance \nand documenting the findings. \n \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILLS \n1. Collect \nsamples \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n1.1 Sampling requirements are \nsecured in accordance with \nsampling plan.  \n1.2 Safety Personal Protective \nEquipment is worn in \naccordance with established \nprocedures. \n1.3 Samples are taken in \naccordance with established \nprocedures. \n1.4 Samples are labeled properly \nand turned over to \nappropriate personnel in \naccordance with established \nprocedures. \n Knowledge, \nTheory, Practices \nand Systems \nOperations \no concepts of \nmetrology \no key \nterminologies \nand concepts,  \nsuch as sample, \ncontamination, \ntraceability \no international \nsystem of units \n(SI) \no basic principles \nof taking \nsamples \no hazards, risks \nand safety   \no procedures \nassociated with  \nsampling  \no sampling \nprocedure \no Location of \nsampling points \no characteristics \nof samples \no contaminants in \nthe sample \n \n Communication  \no Written \no Oral \n \n Mathematics and \nMensuration \no Basic \ncalculation \no Conversion of \nunits \n Using appropriate \npersonal protective \nequipment. \n Collecting \nsamples. \n Identifying \nsamples relative to \nthe source \n Maintaining \nintegrity and \nsecurity of \nsamples \n Labeling of \nsamples \n Handling and \ntransporting \nsamples\n\n--- PDF PAGE 77 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   73 \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILLS \n Safety \no Personal \nProtective \nequipment \no Risk assessment \no Safety data \nsheet \n \n Codes and \nRegulations \no DOLE-OSHS \nRule 1080, 1090, \n1422 and other \nrelevant OSHS \nStandards \no DOLE-DO 136 \nGuidelines for \nthe \nimplementation \nof GHS in \nChemical Safety \nProgram in the \nWorkplace \n \n Materials, Tools & \nEquipment, Uses, \nSpecifications and \nMaintenance \no Sampling tools \no Sampling plan \n \n Values/ Attitudes     \no Resourcefulness \no Patience \no Industriousness \no Attention to \ndetails  \no Diligence \no Honesty and \nintegrity \no Consideration  \no Hard Work and \nPerseverance \n(Sipag at Tiyaga) \no Care (Malasakit) \n \n2. Verify \nconformance \n \n2.1 Results of quality control tests   \nare retrieved or received in \naccordance with established \nprocedures. \n2.2 Actual results are compared \nagainst standard product \nand process specifications \n Knowledge, \nTheory, Practices \nand Systems \nOperations \no Product \nspecifications \no\nquality \n Interpreting and \ncomparing results   \nagainst \nspecifications \n Taking appropriate \nactions.\n\n--- PDF PAGE 78 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   74 \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILLS \nin accordance with \nestablished procedures. \n2.3 Non-conforming samples are \nidentified in accordance with \nestablished procedures. \n2.3 Actions are taken to address \nnon-conformances in \naccordance with established \nprocedures. \n \nmanagement \nsystems \n Communication \no Written \no Oral \no Log sheets/ \nMonitoring forms \n \n Mathematics and \nMensuration \no Basic calculation \no Conversion of \nunits \n \n Safety  \no Personal \nProtective \nequipment \n \n Codes and \nRegulations \no A process may \nrequire many \nunit operations to \nobtain the \ndesired product \nfrom the starting \nmaterials, or \nfeedstocks. \nDOLE-OSHS \nRule 1070 and \nother relevant \nOSHS Standards\no DOLE-DO 136 \nGuidelines for \nthe \nimplementation \nof GHS in \nChemical Safety \nProgram in the \nWorkplace \n \n Values/ Attitudes \no Resourcefulness \no Patience \no Industriousness \no Attention to \ndetails  \no Honesty and \nintegrity \no Diligence \no Consideration  \no Hard Work and\n\n--- PDF PAGE 79 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   75 \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILLS \nPerseverance \n(Sipag at Tiyaga) \no Care (Malasakit) \n \n3. Document \nfindings \n \n3.1 Required data sheet is \nprepared in accordance with \nestablished procedures. \nReports are prepared and \nmaintained in accordance \nwith established procedures. \n Knowledge, \nTheory, Practices \nand Systems \nOperations \no Product \nspecifications \no Sampling \nplanning \n \n Communication \no Written \no Oral \n \n Mathematics and \nMensuration \no Basic \ncalculation \no Conversion of \nunits \n \n Safety  \no Personal \nProtective \nequipment \n \n Codes and \nRegulations \no DOLE-OSHS \n1070 and other \nrelevant OSHS \nStandards \n \n Values/ Attitudes \no Resourcefulness\no Patience \no Industriousness \no Attention to \ndetails  \no Honesty and \nintegrity \no Diligence \no Consideration \no Hard Work and \nPerseverance \n(Sipag at \nTiyaga) \no Care \n(Malasakit) \n \n Completing \nsampling records. \n Taking appropriate \ndocument and \nrecord control.\n\n--- PDF PAGE 80 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   76 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1.  Sampling \nrequirements \n \n \n \nMay include: \n1.1 Quantity \n1.2 Sampling sequence/plan \n1.3 Sampling tools \n1.4 Personal Protective Equipment \n1.5 Equipment \n1.6 Location \n1.7 Labels \n2.  Personal \nProtective \nEquipment \nMay include: \n2.1 \nSpectacles/Goggles \n2.2 \nMask \n2.3 \nGloves \n2.4 \nApron \n2.5 \nSafety Shoes \n2.6 \nHard hat \n2.7 \nLong sleeves/Jacket \n3. Standard process \nspecifications \nMay include: \n3.1 \nViscosity \n3.2 \npH/acid value \n3.3 \n% Non-volatile Solids \n3.4 \nDensity \n3.5 \nColor \n3.6 \nFilm Properties \n3.7 \nMelt Flow/Melt Index/Flow Index \n3.8 \nPellets per gram \n3.9 \nProduct specifications\n\n--- PDF PAGE 81 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   77 \nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 Took the right sample size from the right equipment. \n1.2 Retrieved and record results of QC. \n1.3 Compared results against standard specifications. \n1.4 Documented and reported the task taken. \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Equipment \n2.2 Materials \n2.3 Personal Protective equipment \n \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Interview/Questioning  \n3.2 Demonstration \n3.3 Written Examination \n \n4. Context of \nAssessment \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n",
