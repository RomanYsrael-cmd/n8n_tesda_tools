        "source_text": "CPP313203\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, attitudes and values to\nassess quality of own work and engage in quality improvement.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Assess quality of\nown work\n1.1. Required\ndocumentation within\nthe company is\nidentified.\n1.2. Completed work is\nchecked against\nworkplace standards.\n1.3. Errors are identified and\nisolated.\n1.4. Analysis of errors\nincluding actions taken\nto eliminate it are\ndocumented and\nreported in accordance\nwith the workplace’ s\nstandards operating\nprocedures.\n• Documents and\nRecords Control\n• Management\nsystem Procedure\n• Customer\nrequirements\n\n• Complying with the\ndocumentation\nrequirements\n• Identifying and\nanalyzing errors\n• Maintaining\nrecords of actions\ntaken to eliminate\nthe errors.\n2. Engage in quality\nimprovement\n2.1. Work is carried out in\naccordance with the\ncompany’s\nmanagement system.\n2.2. Performance are\nregularly monitored in\naccordance with the\nestablished company\nprocedures.\n2.3. Continual improvement\nprograms are in place in\naccordance with the\nestablished company\nprocedures.\n\n• Management\nsystem standards\n• Company\nprocedures\n• Company\nprograms\n• Customer\nrequirements\n• Complying with the\nmanagement\nsystem\nrequirements\n• Measuring and\nmonitoring\nperformance\n• Planning for\nimprovement\nprograms\n\n--- PDF PAGE 41 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 37\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Documentation\nRefer to the written policy, procedure, program, and the\nlikes of the company which may include:\n1.1\nOrganization work procedures\n1.2\nManufacturer’s instruction manual\n1.3\nCustomer requirements\n1.4\nForms\n1.5\nChecklists\n2. Errors\nErrors may include:\n2.1\nDeviation from the requirements of the Client\n2.2\nDeviation from the requirement of the organization\n2.3\nDeviation from applicable legal requirements\n3. Management\nsystems\n\nManagement system may include:\n3.1\nThe company’s documented management system\n3.2\nISO 9001 or Quality Management system\n3.3\nOSHS 18001 or Occupational Health and Safety\nManagement System\n3.4\nGLP or Good Laboratory Practice\n3.5\nRC or Responsible Care\n3.6\nGMP or Good Manufacturing Practice\n3.7\nHACCP or Hazard Analysis Critical Control Point\n3.8\nISO 14001 or Environmental Management System\n3.9"
