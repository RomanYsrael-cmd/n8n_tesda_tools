        "source_text": "ELC311201\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills, attitudes and values\nneeded in the selection and maintenance of measuring\ninstruments and carrying out measurements and calculations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select\nmeasuring\ninstruments\n1.1. Object or component to\nbe measured is identified\n1.2. Correct specifications are\nobtained from relevant\nsource\n1.3. Measuring tools are\nselected in line with job\nrequirements\n\n• Principles in the\nselection of\nmeasuring\ninstruments\n• DOLE-OSHS\nRule 1422 Hand\nTools\n• Interpersonal\nRelationship\n• Practicing verbal\nand written\ncommunications\n• Keen observation\nskills\n• Coordinating\nSkills\n• Documenting\nSkills\n\n2. Carry out\nmeasurements\nand\ncalculation\n2.1. Appropriate measuring\ninstrument is selected to\nachieve required\noutcome\n2.2. Accurate measurements\nare obtained for job\n2.3. Calculation needed to\ncomplete work tasks are\nperformed using the four\nbasic process of addition\n(+), subtraction (-),\nmultiplication (x), and\ndivision (/)\n2.4. Calculation involving\nfractions, percentages\nand mixed numbers are\nused to complete\nworkplace tasks.\n2.5. Numerical computation is\nself-checked and\ncorrected for accuracy\n2.6. Instruments are read to\nthe limit of accuracy of\nthe tool.\n• Principles in the\nselection of\nmeasuring\ninstruments\n• Principles in\ncalculation\ninvolving\nfractions,\npercentages and\nmixed numbers\n• DOLE-OSHS\nRule 1422 Hand\nTools\n• DOLE-OSHS\nRule 1080\nProtective\nequipment and\ndevices\n\n• Interpersonal\nRelationship\n• Practicing verbal\nand written\ncommunications\n• Keen observation\nskills\n• Coordinating\nSkills\n• Documenting\nSkills\n\n3. Maintain\nmeasuring\ninstruments\n3.1. Measuring instruments\nare not dropped to avoid\ndamage\n3.2. Measuring instruments\nare cleaned before and\nafter using.\n• Principles of\nplanning and\npreparation of\nhand tools\n\n• Interpersonal\nRelationship\n• Practicing verbal\nand written\ncommunications\n• Keen observation\n\n--- PDF PAGE 38 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 34\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\na. Proper storage of\ninstruments\nundertaken according\nto manufacturer’s\nspecifications and\nstandard operating\nprocedures.\n\n• Hand tools types,\nuses,\nspecifications and\nmaintenance\n• Test equipment\ntypes, uses and\nspecifications\n• DOLE-OSHS\nRule 1422 Hand\nTools\n• DOLE-OSHS\nRule 1080\nProtective\nequipment and\ndevices\n\nskills\n• Coordinating\nSkills\n• Documenting\nSkills\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring instruments\nMay include:\n1.1.\nStraight edge\n1.2.\nTorque gauge\n1.3.\nTry square\n1.4.\nProtractor\n1.5.\nCombination gauge\n1.6.\nSteel rule\n2. Calculation\n\nMay include:\n2.1.\nVolume\n2.2.\nArea\n2.3.\nDisplacement\n2.4.\nInside diameter\n2.5.\nCircumference\n2.6.\nLength\n2.7.\nThickness\n2.8.\nOutside diameter\n2.9.\nTaper\n2.10. Out of roundness\n2.11. Weight\n\n--- PDF PAGE 39 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 35\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Selected proper measuring instruments\naccording to tasks\n1.2. Carried out measurement and calculations\n1.3. Maintained and stored instruments\n2. Resource Implications\nThe following resources should be provided:\n2.1. Place of assessment\n2.2. Measuring instruments\n2.3. Straight edge\n2.4. Torque gauge\n2.5. Try square\n2.6. Protractor\n2.7. Combination gauge\n2.8. Steel rule\n3. Methods of Assessment\nCompetency in this unit must be assessed\nthrough:\n3.1. Observation\n3.2. Oral questioning\n4. Context of Assessment\n4.1 Competency maybe assessed in actual workplace\nor at the designated TESDA Accredited Center.\n\n--- PDF PAGE 40 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 36\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:"
