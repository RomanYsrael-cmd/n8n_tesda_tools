  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThese guidelines are set to provide the Technical Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for CHEMICAL PROCESS OPERATIONS NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311109\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nlead in the dissemination and discussion of ideas, information\nand issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1 Communicate\ninformation\nabout workplace\nprocesses\n1.1\nAppropriate\ncommunication method\nis selected\n1.2\nMultiple operations\ninvolving several topics\nareas are communicated\naccordingly\n1.3\nQuestions are used to\ngain extra information\n1.4\nCorrect sources of\ninformation are identified\n1.5\nInformation is selected\nand organized correctly\n1.6\nVerbal and written\nreporting is undertaken\nwhen required\n1.7\nCommunication skills are\nmaintained in all situations\n\n•\nOrganization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n•\nEffective verbal\ncommunication\nmethods\n•\nOrganize\ninformation\n•\nUnderstand and\nconvey intended\nmeaning\n•\nParticipate in\nvariety of\nworkplace\ndiscussions\n•\nComply with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n2\nLead workplace\ndiscussions\n2.1\nResponse to workplace\nissues are sought\n2.2\nResponse to workplace\nissues are provided\nimmediately\n2.3\nConstructive contributions\nare made to workplace\ndiscussions on such\nissues as production,\nquality and safety\n2.4\nGoals/objectives and\n Action plan undertaken in\nthe workplace are\n•\nLeading as a\nmanagement\nfunction\n•\nBarriers of\ncommunication\n•\nEffective verbal\ncommunication\nmethods\n•\nMethod/techniques\nof discussion\n•\nHow to lead\ndiscussion\n•\nHow to solicit\n•\nCommunicating\neffectively\n•\nConsulting the\nLGs on the\nhousekeeping\nschedules\n\n--- PDF PAGE 7 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 3\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ncommunicated\nresponse\n3 Identify and\ncommunicate\nissues arising in\nthe workplace\n3.1\nIssues and problems are\nidentified as they arise\n3.2\nInformation regarding\nproblems and issues are\norganized coherently to\nensure clear and effective\ncommunication\n3.3\nDialogue is initiated with\nappropriate personnel\n3.4\nCommunication problems\nand issues are raised as\nthey arise\n\n•\nTypes of issues and\nproblems in the\nworkplace\n•\nWritten and\nelectronic\ncommunication\nmethods\n•\nCommunication\nbarriers affecting\nworkplace\ndiscussions\n•\nIdentifying cause\nof problems\n•\nIdentifying\nproblems and\nissues\n•\nOrganizing\ninformation on\nproblems and\nissues\n•\nRelating\nproblems and\nissues of call\n\n--- PDF PAGE 8 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\nMay include:\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Dealt with a range of communication/information at one time\n1.2 Made constructive contributions in workplace issues\n1.3 Sought workplace issues effectively\n1.4 Responded to workplace issues promptly\n1.5 Presented information clearly and effectively written form\n1.6 Used appropriate sources of information\n1.7 Asked appropriate questions\n1.8 Provided accurate information\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Variety of Information\n2.2. Communication tools\n2.3. Simulated workplace\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Competency in this unit must be assessed through\n3.2 Direct Observation\n3.3 Interview\n4. Context of\nAssessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 9 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 5\nUNIT OF COMPETENCY :\nLEAD SMALL TEAMS\n\nUNIT CODE\n:\n500311110\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Work requirements are\nidentified and presented\nto team members\n1.2 Reasons for instructions\nand requirements are\ncommunicated to team\nmembers\n1.3 Team members’ queries\nand concerns are\nrecognized, discussed\nand dealt with\n•\nCompany policies\nand procedures\no How\nperformance\nexpectations\nare set\no Methods of\nMonitoring\nPerformance\n•\nClient expectations\n•\nTeam member’s\nduties and\nresponsibilities\n•\nSkills and\ntechniques in\npromoting team\nbuilding\n•\nUp-to-date\ndissemination of\ninstructions and\nrequirements to\nmembers\n•\nArt of listening and\ntreating individual\nteam members\nconcern\n•\nCommunication\nskills required\nfor leading\nteams\n•\nTeam building\nskills\n•\nNegotiating\nskills\n2. Assign\nresponsibilities\n2.1. Duties, and\nresponsibilities are\nassigned in consideration\nof skills, knowledge and\naptitude required to\nproperly undertake the\nassigned task and\naccording to company\npolicy\n2.2. Duties are allocated\nhaving regard to individual\npreference, domestic and\npersonal considerations,\nwhenever possible\n•\nConcept of\ndelegation\n•\nHow to delegate\n•\nUnderstanding\nindividual\ndifferences\n•\nMethods of\nmonitoring\nperformance\n•\nDuties and\nresponsibilities of\neach team\nmember\n•\nDelegating skills\n•\nIdentifying\nindividual skills,\nknowledge and\nattitude as basis\nfor allocating\nresponsibilities\n•\nIdentifying each\nteam member\nduties and\nresponsibilities\n\n--- PDF PAGE 10 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 6\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n•\nKnowledge in\nidentifying each\nteam member\nduties and\nresponsibilities\n3. Set\nperformance\nexpectations for\nteam members\n3.1 Performance expectations\nare established based on\nclient needs and\naccording to assignment\nrequirements\n3.2 Performance expectations\nare based on individual\nteam members duties and\narea of responsibility\n3.3 Performance expectations\nare discussed and\ndisseminated to individual\nteam members\n•\nDefinition of\nperformance\nindicators/ criteria\n•\nDefinition of team\ngoals and\nexpectations\n•\nMethods of\nmonitoring\nperformance\n•\nClient expectations\n•\nTeam members\nduties and\nresponsibilities\n•\nDefining\nperformance\nexpectations\ncriteria\n•\nIdentifying\nperformance\nindicators\n•\nEvaluating\nperformance\n•\nSetting\nindividual\nperformance\ntarget/\nexpectation\nindicators\n4. Supervise team\nperformance\n4.1. Monitoring of\nperformance takes place\nagainst defined\nperformance criteria\nand/or assignment\ninstructions and corrective\naction taken if required\n4.2. Team members are\nprovided with feedback,\npositive support and\nadvice on strategies to\novercome any\ndeficiencies\n4.3. Performance issues\nwhich cannot be rectified\nor addressed within the\nteam are referenced to\nappropriate personnel\naccording to employer\npolicy\n4.4. Team members are kept\ninformed of any changes\nin the priority allocated to\nassignments or tasks\nwhich might impact on\nclient/customer needs and\nsatisfaction\n•\nUnderstanding,\nmonitoring of work\n•\nHow to undertake\ncorrective action\n•\nUnderstanding\nfeedback and\nprocedure\n•\nFeedback\nreporting\nprocedure\n•\nMethods of\nmonitoring\nperformance\n•\nTeam member’s\nduties and\nresponsibilities\n•\nMonitoring team\noperation to\nensure client\nneeds and\nsatisfaction\n\n•\nMonitoring skills\n•\nSetting priorities\n•\nEvaluating\nperformance\n•\nInformal/ formal\ncounseling skill\n\n--- PDF PAGE 11 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 7\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.5. Team operations are\nmonitored to ensure that\nemployer/client needs and\nrequirements are met\n4.6. Follow-up communication\nis provided on all issues\naffecting the team\n4.7. All relevant\ndocumentation is\ncompleted in accordance\nwith company procedures\n\n--- PDF PAGE 12 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 8\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work\nrequirements\nMay include:\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s\nqueries and\nconcerns\nMay include:\n2.1 Roster/shift details\n3. Monitor\nperformance\nMay include:\n3.1. Formal process\n3.2. Informal process\n4. Feedback\nMay include:\n4.1. Formal process\n4.2. Informal process\n5. Performance\nissues\nMay include:\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 13 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 9\nEVIDENCE GUIDE\n\n1. Critical\nAspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team performance given\na variety of possible scenario\n1.2. Assessed and monitored team and individual performance against\nset criteria\n1.3. Represented concerns of a team and individual to next level of\nmanagement or appropriate specialist and to negotiate on their\nbehalf\n1.4. Allocated duties and responsibilities, having regard to individual’s\nknowledge, skills and aptitude and the needs of the tasks to be\nperformed\n1.5. Set and communicated performance expectations for a range of\ntasks and duties within the team and provided feedback to team\nmembers\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Direct observations of work activities of the individual member in\nrelation to the work activities of the group\n3.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3. Case studies and scenarios as a basis for discussion of issues and\nstrategies in teamwork\n4. Context of\nAssessment\n4.1. Competency maybe assessed in actual workplace or the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 14 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 10\nUNIT OF COMPETENCY :\nDEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE\n:\n500311111\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required to\ncollect information in order to negotiate to a desired outcome\nand participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan\nnegotiations\n1.1 Information on preparing\nfor negotiation is\nidentified and included in\nthe plan\n1.2 Information on creating\nnon-verbal environments\nfor positive negotiating is\nidentified and included in\nthe plan\n1.3 Information on active\nlistening is identified and\nincluded in the plan\n1.4 Information on different\nquestioning techniques\nis identified and included in\nthe plan\n1.5 Information is checked to\nensure it is correct and up-\nto- date\n• Knowledge on Codes of\npractice and guidelines\nfor the organization\n• Knowledge of\norganizations policy and\nprocedures for\nnegotiations\n• Decision making and\nconflict resolution\nstrategies procedures\n• Concept of negotiation\n\n• Communication\nskills (verbal and\nlistening)\n• Active listening\n• Setting conflict\n• Preparing conflict\nresolution\n• Problem solving\nstrategies on how to\ndeal with\nunexpected\nquestions and\nattitudes during\nnegotiation\n• Interpersonal skills\nto develop rapport\nwith other parties\n2. Participate in\nnegotiations\n2.1 Criteria for successful\noutcome are agreed\nupon by all parties\n2.2 Desired outcome of all\nparties are considered\n2.3 Appropriate language is\nused throughout the\nnegotiation\n2.4 A variety of questioning\ntechniques are used\n2.5 The issues and processes\nare documented and\nagreed upon by all parties\n2.6 Possible solutions are\ndiscussed and their\nviability assessed\n2.7 Areas for agreement are\nconfirmed and recorded\n2.8 Follow-up action is agreed\nupon by all parties\n• Outcome of negotiation\n• Knowledge on\nLanguage\n• Different Questioning\ntechniques\n• Problem solving\nstrategies on how to\ndeal with unexpected\nquestions and attitudes\nduring negotiation\n• Flexibility\n• Empathy\n• Decision making and\nconflict resolution\nstrategies procedures\n• Problem solving\nstrategies on how to\ndeal with unexpected\nquestions and attitudes\nduring negotiation\n• Negotiating skill\n• Communication\nskills (verbal and\nlistening)\n• Observation skills\n• Interpersonal skills\nto develop rapport\nwith other parties\n• Applying effective\nquestioning\ntechniques\n• Setting conflict\n\n--- PDF PAGE 15 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 11\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n\n1.1\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nMay include:\nBackground information on other parties to the negotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non- verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self-disclosing\nAnalytic skills\n1.6.1 observing differences between content and process\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for resolving\nconflict\n2. Non- verbal\nenvironments\n\n2.1\n2.2\n2.3\n2.4\nMay include:\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n\n3.1\n3.2\n3.3\n3.4\n3.5\nMay include:\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n4. Questioning\ntechniques\n\n4.1\n4.2\n4.3\nMay include:\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 16 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 12\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors influencing\nnegotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to achieve an\nagreed outcome\n2. Resource\nImplications\nThe following resources be provided:\n2.1 Room with facilities necessary for the negotiation process\n2.2 Human resources (negotiators)\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Observation/demonstration and questioning\n3.2 Portfolio assessment\n3.3 Oral and written questioning\n3.4 Third party report\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated Accredited Assessment Center.\n\n--- PDF PAGE 17 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 13\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\n\nUNIT CODE\n: 500311112\n\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes required to\nsolve problems in the workplace including the application of\nproblem solving techniques and to determine and resolve the\nroot cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Explain the\nanalytical\ntechniques\n1.1 All the analytical techniques\nare identified.\n1.2 Use of each technique is\napplied in real life situations.\n•\nProblem\nidentification\ntechniques\n•\nObservation,\ninvestigation and\nanalytical techniques\n•\nCause and effect\ndiagrams\n•\nPARETO analysis\n•\nSWOT analysis\n•\nGANT chart\n•\nPERT CPM and\ngraph\n•\nSCATTERGRAMS\n\n•\nConduct\ninvestigation and\nroot cause\nanalysis\n•\nImplement\ncorrective\nactions\n2. Identify the\nproblem\n2.1. Variances are identified\nfrom normal operating\nparameters; and product\nquality\n2.2. Extent, cause and nature\nare of the problem are\ndefined through\nobservation, investigation\nand analytical techniques\n2.3. Problems are clearly\nstated and specified\n•\nCompetence\nincludes a thorough\nknowledge and\nunderstanding of the\nprocess, normal\noperating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations\n•\nCompetence to\ninclude the ability to\napply and explain,\nsufficient for the\nidentification of\nfundamental cause,\ndetermining the\ncorrective action and\nprovision of\nrecommendations\n•\nRelevant equipment\nand operational\nprocesses\n•\nEnterprise goals,\ntargets and\n•\nUse range of\nformal problem\nsolving\ntechniques\n•\nIdentify and\nclarify the nature\nof the problem\n•\nEvaluate the\neffectiveness of\na present\nprocess in the\ngalley\n•\nApply analytical\ntechniques\n\n--- PDF PAGE 18 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 14\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nmeasures\n•\nEnterprise quality,\nOSH and\nenvironmental\nrequirement\n•\nEnterprise\ninformation systems\nand data collation\n•\nIndustry codes and\nstandards\n•\nNormal operating\nparameters and\nproduct quality\n3. Determine\nfundamental\ncauses of the\nproblem\n3.1 Possible causes are\nidentified based on\nexperience and the use of\nproblem solving tools /\nanalytical techniques.\n3.2 Possible cause statements\nare developed based on\nfindings\n3.3 Fundamental causes are\nidentified per results of\ninvestigation conducted\n•\nRelevant equipment\nand operational\nprocesses\n•\nEnterprise goals,\ntargets and\nmeasures\n•\nEnterprise quality,\nOSH and\nenvironmental\nrequirements\n•\nEnterprise\ninformation systems\nand data collation\n•\nIndustry codes and\nstandards\n\n•\nAnalysis of root\ncauses\n4. Determine\ncorrective action\n4.1 All possible options are\nconsidered for resolution of\nthe problem\n4.2 Strengths and weaknesses\nof possible options are\nconsidered\n4.3 Corrective actions are\ndetermined to resolve the\nproblem and possible\nfuture causes\n4.4 Action plans are\ndeveloped in identifying\nmeasurable objectives,\nresource needs and\ntimelines in accordance\nwith safety and operating\nprocedures\n\n•\nUnderstand the\nprocedure in\nundertaking\ncorrective action\n•\nPrinciples of\ndecision making\nstrategies and\ntechniques\n•\nEnterprise\ninformation systems\nand data collation\n•\nAction planning\n\n•\nIdentify and\nclarify the nature\nof the problem\n•\nDevise the best\nsolution\n•\nEvaluate the\nsolution\n•\nImplement plan\nto rectify the\nproblem\n•\nImplementing\ncorrective and\npreventive\nactions based on\nroot cause\nanalysis\n\n--- PDF PAGE 19 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 15\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n5. Provide\nrecommendatio\nn/s to manager\n5.1 Report on\nrecommendations are\nprepared\n5.2 Recommendations are\npresented to appropriate\npersonnel.\n5.3 Recommendations are\nfollowed-up, if required\n•\nCompetence\nincludes a thorough\nknowledge and\nunderstanding of the\nprocess, normal\noperating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations\n\n•\nUsing range of\nformal problem\nsolving\ntechniques\n•\nIdentifying and\nclarifying the\nnature of the\nproblem\n•\nDevising the best\nsolution\n•\nEvaluating the\nsolution\n•\nImplementation\nof a developed\nplan to rectify the\nproblem\n\n--- PDF PAGE 20 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 16\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical\ntechniques\nMay include:\n1.1 Brainstorming\n1.2 Intuitions/Logic\n1.3 Cause and effect diagrams\n1.4 Pareto analysis\n1.5 SWOT analysis\n1.6 Gant chart, Pert CPM and graphs\n1.7 Scattergrams\n\n2. Problem\n\nMay include:\n2.1 Non – routine process and quality problems\n2.2 Equipment selection, availability and failure\n2.3 Teamwork and work allocation problem\n2.4 Safety and emergency situations and incidents\n\n3. Action plans\n\nMay include:\n3.1 Priority requirements\n3.2 Measurable objectives\n3.3 Resource requirements\n3.4 Timelines\n3.5 Co-ordination and feedback requirements\n3.6 Safety requirements\n3.7 Risk assessment\n3.8 Environmental requirements\n\n--- PDF PAGE 21 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 17\nEVIDENCE GUIDE\n\n1. Critical\nAspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified the problem\n1.2 Determined the fundamental causes of the problem\n1.3 Determined the correct / preventive action\n1.4 Provided recommendation to manager\n\nThese aspects may be best assessed using a range of scenarios / case\nstudies / what ifs as a stimulus with a walk through forming part of the\nresponse. These assessment activities should include a range of\nproblems, including new, unusual and improbable situations that may\nhave happened.\n2. Resource\nImplications\nAssessment will require access to an operating plant over an extended\nperiod of time, or a suitable method of gathering evidence of operating\nability over a range of situations. A bank of scenarios / case studies /\nwhat ifs will be required as well as bank of questions which will be used\nto probe the reason behind the observable action.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Case studies on solving problems in the workplace\n3.2 Observation\n\nThe unit will be assessed in a holistic manner as is practical and may be\nintegrated with the assessment of other relevant units of competency.\nAssessment will occur over a range of situations, which will include\ndisruptions to normal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of competency.\nSimulation should be based on the actual workplace and will include walk\nthrough of the relevant competency components.\n4. Context of\nAssessment\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 22 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 18\nUNIT OF COMPETENCY :\nUSE MATHEMATICAL CONCEPTS AND TECHNIQUES\n\nUNIT CODE\n:\n500311113\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\napplication of mathematical concepts and techniques.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify\nmathematical\ntools and\ntechniques to\nsolve problem\n1.1 Problem areas are identified\nbased on given condition\n1.2 Mathematical techniques\nare selected based on the\ngiven problem\n\n•\nFundamental\noperation (addition,\nsubtraction,\ndivision,\nmultiplication)\n•\nUnits of\nmeasurement and\nits conversion\n•\nFundamental of\nunits\n•\nStandard formulas\n•\nBasic measuring\ntools/devices\n•\nMeasurement\nsystem\n•\nBasic measuring\ntools/devices\n•\nSteps in solving\nproblem\n•\nIdentifying and\nselecting\ndifferent\nmeasuring tools\n•\nApplying\ndifferent\nformulas in\nsolving\nproblems\n•\nDescribing the\nunits of\nmeasurement\nand\nfundamental\nunits\n•\nStating\narithmetic\ncalculations\ninvolving the\nfollowing;\naddition,\nsubtraction,\ndivision,\nmultiplication\n•\nStating\narithmetic\ncalculations\ninvolving the\nfollowing:\naddition,\nsubtraction,\ndivision,\nmultiplication\n•\nApplying theory\ninto actual\napplication on\nlifeguard\nprocesses\n2. Apply\nmathematical\nprocedure/\n solution\n2.1 Mathematical techniques\nare applied based on the\nproblem identified\n2.2 Mathematical computations\nare performed to the level of\n•\nProblem-based\nquestions\n•\nEstimation\n•\nUse of\n•\nSolving\nmathematical\ncomputations\n•\nConverting\nMetric to\n\n--- PDF PAGE 23 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 19\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\naccuracy required for the\nproblem\n2.3 Results of mathematical\ncomputation are determined\nand verified based on job\nrequirements\nmathematical tools\nand standard\nformulas\n•\nMathematical\ntechniques\n\nEnglish\n•\nSelecting and\nusing\nappropriate and\nefficient\ntechniques and\nstrategies to\nsolve problems\n3. Analyze results\n3.1 Result of application are\nreviewed