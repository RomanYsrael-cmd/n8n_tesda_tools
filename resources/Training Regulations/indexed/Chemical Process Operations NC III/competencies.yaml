        "source_title": "USE RELEVANT TECHNOLOGIES (Apply technology effectively)",
        "source_text": "--- PDF PAGE 25 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   21 \nUNIT OF COMPETENCY : \nUSE RELEVANT TECHNOLOGIES   \n \n \n(Apply technology effectively) \nUNIT CODE \n: \n500311114 \nUNIT DESCRIPTOR \n: \nThis unit of competency covers the knowledge, skills, and \nattitude required in selecting, sourcing and applying appropriate \nand affordable technologies in the workplace.                          \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Study/select \nappropriate \ntechnology \n \n1.1 Usage of different \ntechnologies is \ndetermined based on job \nrequirements \n1.2 Appropriate technology is \nselected as per work  \n       specification \n \n \nAwareness on \ntechnology and its \nfunction \n \nOperating \ninstructions \n \nCommunication \ntechniques \n \nHealth and safety \nprocedure \n \nCompany policy in \nrelation to relevant \ntechnology  \n \nIdentifying relevant \ntechnology on job \n2. Apply \nrelevant \ntechnology \n \n2.1 Relevant technology is \neffectively used in \ncarrying out function \n2.2 Applicable software and \nhardware are used as per \ntask requirement \n2.3 Management concepts \nare observed and \npracticed as per \nestablished industry \npractices \n \nKnowledge on \noperating \ninstructions \n \nUnderstanding \nsoftware and \nhardware system \n \nCommunication \ntechniques \n \nHealth and safety \nprocedure \n \nCompany policy in \nrelation to relevant \ntechnology \n \nDifferent \nmanagement \nconcepts \n \nTechnology \nadaptability \n \nOffice technology \n \nIndustrial \ntechnology \n \nSystem technology \n \nTraining \ntechnology \n \nDifferent software/ \nhardware \n \n \n5S (Proper \nhousekeeping) \n \nApplying relevant \ntechnology  \n \nCommunicating \nskills \n \nUsing software \napplications skills \n \nConducting risk \nassessment\n\n--- PDF PAGE 26 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   22 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Maintain/ \nenhance relevant \ntechnology \n3.1 Maintenance of \ntechnology is applied in \naccordance with the \nindustry standard \noperating procedure, \nmanufacturer’s \noperating guidelines and \noccupational health and \nsafety procedure to \nensure its operative ability \n3.2 Updating of technology is \nmaintained through \ncontinuing education or \ntraining in accordance with \njob requirement  \n3.3  Technology failure/ defect \nis immediately reported to \nthe concern/responsible \nperson or section for \nappropriate action \n \n \nAwareness on \ntechnology and its \nfunction \n \nRepair and \nmaintenance \nprocedure \n \nHealth and safety \nprocedure  \n \nCompany policy in \nrelation to relevant \ntechnology \n \nUpgrading of \ntechnology \n \nOrganizational set-\nup/work flow \n \nPerforming basic \ntroubleshooting \nskills \n \nIdentifying failures \nor defects  \n \nCommunication \nskills \n \nApplying corrective \nand preventive \nmaintenance\n\n--- PDF PAGE 27 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   23 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Technology \nMay include: \n1.1 Office technology \n1.2 Industrial technology \n1.3 System technology \n1.4 Information technology \n1.5 Training technology \n2. Management \nconcepts \nMay include: \n2.1 Real Time Management \n2.2 KAIZEN or continuous improvement \n2.3  5 S \n2.1 Total Quality Management \n2.2 Other management/productivity tools \n3. Industry standard \noperating \nprocedure \n3.1 Written guidelines relative to the usage of office \ntechnology/equipment \n3.2 Verbal advise/instruction from the co-worker \n4. Manufacturer’s \noperating \nguidelines/ \ninstructions  \n4.1 Written instruction/manuals of specific technology/ equipment \n4.2 General instruction manual \n4.3 Verbal advise from manufacturer relative to the operation of \nequipment \n \n5. Occupational \nhealth and safety \nprocedure\n5.1 Relevant statutes on OSH \n5.2 Company guidelines in using technology/equipment \n6. Appropriate action \n6.1 Implementing preventive maintenance schedule  \n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 28 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   24 \nEVIDENCE GUIDE \n \n \n \n1. Critical \nAspects of \nCompetency \n \n \nAssessment requires evidence that the candidate: \n1.1 Studied and selected appropriate technology consistent with work \nrequirements   \n1.2 Applied relevant technology \n1.3 Maintained and enhanced operative ability of relevant technology \n \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Relevant technology \n2.2 Interview and demonstration questionnaires \n2.3 Assessment packages \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Interview \n3.2 Actual demonstration \n3.3 Authenticated portfolio (related certificates of training/seminar) \n4. Context of \nAssessment \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n",
