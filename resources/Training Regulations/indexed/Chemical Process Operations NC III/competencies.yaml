        "source_title": "LEAD WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 6 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   2 \nSECTION 2 COMPETENCY STANDARDS \n \nThese guidelines are set to provide the Technical Vocational Education and Training \n(TVET) providers with information and other important requirements to consider when designing \ntraining programs for CHEMICAL PROCESS OPERATIONS NC III. \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY :     LEAD WORKPLACE COMMUNICATION \n \nUNIT CODE \n: \n500311109 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nlead in the dissemination and discussion of ideas, information \nand issues in the workplace. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1 Communicate \ninformation \nabout workplace \nprocesses \n1.1 \nAppropriate \ncommunication method \nis selected  \n1.2 \nMultiple operations \ninvolving several topics \nareas are communicated \naccordingly \n1.3 \nQuestions are used to \ngain extra information \n1.4 \nCorrect sources of \ninformation are identified \n1.5 \nInformation is selected \nand organized correctly \n1.6 \nVerbal and written \nreporting is undertaken \nwhen required \n1.7 \nCommunication skills are \nmaintained in all situations \n \n \nOrganization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n \nEffective verbal \ncommunication \nmethods \n \nOrganize \ninformation \n \nUnderstand and \nconvey intended \nmeaning \n \nParticipate in \nvariety of \nworkplace \ndiscussions \n \nComply with \norganization \nrequirements for \nthe use of written \nand electronic \ncommunication \nmethods \n2 \nLead workplace \ndiscussions \n2.1 \nResponse to workplace \nissues are sought  \n2.2 \nResponse to workplace \nissues are provided \nimmediately \n2.3 \nConstructive contributions \nare made to workplace \ndiscussions on such \nissues as production, \nquality and safety \n2.4 \nGoals/objectives and  \n         Action plan undertaken in \nthe workplace are \n \nLeading as a \nmanagement \nfunction \n \nBarriers of \ncommunication \n \nEffective verbal \ncommunication \nmethods \n \nMethod/techniques \nof discussion \n \nHow to lead \ndiscussion \n\nHow to solicit \n \nCommunicating \neffectively \n \nConsulting the \nLGs on the \nhousekeeping \nschedules\n\n--- PDF PAGE 7 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   3 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \ncommunicated \nresponse \n3 Identify and \ncommunicate \nissues arising in \nthe workplace \n3.1 \nIssues and problems are \nidentified as they arise \n3.2 \nInformation regarding \nproblems and issues are \norganized coherently to \nensure clear and effective \ncommunication \n3.3 \nDialogue is initiated with \nappropriate personnel \n3.4 \nCommunication problems \nand issues are raised as \nthey arise \n \n \n \nTypes of issues and \nproblems in the \nworkplace \n \nWritten and \nelectronic \ncommunication \nmethods \n \nCommunication \nbarriers affecting \nworkplace \ndiscussions \n \nIdentifying cause \nof problems \n \nIdentifying \nproblems and \nissues \n \nOrganizing \ninformation on \nproblems and \nissues \n \nRelating \nproblems and \nissues of call\n\n--- PDF PAGE 8 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   4 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Methods of \ncommunication \nMay include: \n1.1. Non-verbal gestures \n1.2. Verbal \n1.3. Face to face \n1.4. Two-way radio \n1.5. Speaking to groups \n1.6. Using telephone \n1.7. Written \n1.8. Internet \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1   Dealt with a range of communication/information at one time \n1.2   Made constructive contributions in workplace issues \n1.3   Sought workplace issues effectively \n1.4   Responded to workplace issues promptly \n1.5   Presented information clearly and effectively written form \n1.6   Used appropriate sources of information \n1.7   Asked appropriate questions \n1.8   Provided accurate information  \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Variety of Information \n2.2. Communication tools \n2.3. Simulated workplace \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Competency in this unit must be assessed through \n3.2 Direct Observation \n3.3 Interview \n4. Context of \nAssessment \n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n",
