        "source_text": "500311110\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Work requirements are\nidentified and presented\nto team members\n1.2 Reasons for instructions\nand requirements are\ncommunicated to team\nmembers\n1.3 Team members’ queries\nand concerns are\nrecognized, discussed\nand dealt with\n•\nCompany policies\nand procedures\no How\nperformance\nexpectations\nare set\no Methods of\nMonitoring\nPerformance\n•\nClient expectations\n•\nTeam member’s\nduties and\nresponsibilities\n•\nSkills and\ntechniques in\npromoting team\nbuilding\n•\nUp-to-date\ndissemination of\ninstructions and\nrequirements to\nmembers\n•\nArt of listening and\ntreating individual\nteam members\nconcern\n•\nCommunication\nskills required\nfor leading\nteams\n•\nTeam building\nskills\n•\nNegotiating\nskills\n2. Assign\nresponsibilities\n2.1. Duties, and\nresponsibilities are\nassigned in consideration\nof skills, knowledge and\naptitude required to\nproperly undertake the\nassigned task and\naccording to company\npolicy\n2.2. Duties are allocated\nhaving regard to individual\npreference, domestic and\npersonal considerations,\nwhenever possible\n•\nConcept of\ndelegation\n•\nHow to delegate\n•\nUnderstanding\nindividual\ndifferences\n•\nMethods of\nmonitoring\nperformance\n•\nDuties and\nresponsibilities of\neach team\nmember\n•\nDelegating skills\n•\nIdentifying\nindividual skills,\nknowledge and\nattitude as basis\nfor allocating\nresponsibilities\n•\nIdentifying each\nteam member\nduties and\nresponsibilities\n\n--- PDF PAGE 10 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 6\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n•\nKnowledge in\nidentifying each\nteam member\nduties and\nresponsibilities\n3. Set\nperformance\nexpectations for\nteam members\n3.1 Performance expectations\nare established based on\nclient needs and\naccording to assignment\nrequirements\n3.2 Performance expectations\nare based on individual\nteam members duties and\narea of responsibility\n3.3 Performance expectations\nare discussed and\ndisseminated to individual\nteam members\n•\nDefinition of\nperformance\nindicators/ criteria\n•\nDefinition of team\ngoals and\nexpectations\n•\nMethods of\nmonitoring\nperformance\n•\nClient expectations\n•\nTeam members\nduties and\nresponsibilities\n•\nDefining\nperformance\nexpectations\ncriteria\n•\nIdentifying\nperformance\nindicators\n•\nEvaluating\nperformance\n•\nSetting\nindividual\nperformance\ntarget/\nexpectation\nindicators\n4. Supervise team\nperformance\n4.1. Monitoring of\nperformance takes place\nagainst defined\nperformance criteria\nand/or assignment\ninstructions and corrective\naction taken if required\n4.2. Team members are\nprovided with feedback,\npositive support and\nadvice on strategies to\novercome any\ndeficiencies\n4.3. Performance issues\nwhich cannot be rectified\nor addressed within the\nteam are referenced to\nappropriate personnel\naccording to employer\npolicy\n4.4. Team members are kept\ninformed of any changes\nin the priority allocated to\nassignments or tasks\nwhich might impact on\nclient/customer needs and\nsatisfaction\n•\nUnderstanding,\nmonitoring of work\n•\nHow to undertake\ncorrective action\n•\nUnderstanding\nfeedback and\nprocedure\n•\nFeedback\nreporting\nprocedure\n•\nMethods of\nmonitoring\nperformance\n•\nTeam member’s\nduties and\nresponsibilities\n•\nMonitoring team\noperation to\nensure client\nneeds and\nsatisfaction\n\n•\nMonitoring skills\n•\nSetting priorities\n•\nEvaluating\nperformance\n•\nInformal/ formal\ncounseling skill\n\n--- PDF PAGE 11 ---\nTR – CHEMICA