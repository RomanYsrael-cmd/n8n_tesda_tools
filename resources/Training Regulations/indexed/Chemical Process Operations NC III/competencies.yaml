        "source_title": "COMPLY WITH EMERGENCY PROCEDURES",
        "source_text": "--- PDF PAGE 32 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   28 \n \nUNIT OF COMPETENCY :  \nCOMPLY WITH EMERGENCY PROCEDURES \n \nUNIT CODE \n:  \nCPP313202 \n \nUNIT DESCRIPTOR \n:  \nThis unit deals with knowledge and skills required to take actions \nto prevent occurrence of emergency, follow established \nprotocols to control or manage risks in the workplace and take \nappropriate actions to control the emergency. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Take actions to \nprevent \noccurrence of \nemergency. \n1.1 Hazards and risks \nassessment is conducted to \nprior to application of new \nprocesses/ materials/ \nequipment in the workplace. \n1.2 Emergency practice drills \nare performed where \npracticable. \n1.3 Training is conducted for \nproper use of emergency \nequipment. \n1.4 Unsafe acts and conditions \nare reported and corrected \nimmediately. \n1.5 Emergency communications \nand alarm signals and \nsystems are understood and \nrequired action implemented \nin accordance with \nemergency procedures. \n Knowledge on chemical \nsafety programs that \npromotes measures to \nprevent \naccident/incident from \nhappening in the \nworkplace. \n DOLE-OSHS Rule \n1960 Occupational \nHealth Services \n DOLE-OSHS Rule \n1030 Training of \npersonnel in OSH. \n DOLE-OSHS Rule \n1040 Health and Safety \nCommittee \n \n Participating in \ncompany \nprograms that \nprevents \npotential \nemergency from \nhappening in the \nworkplace. \n Understanding \nthe emergency \nmanagement \nprogram of the \ncompany. \n \n2. Follow \nestablished \nprotocols to \ncontrol or manage \nrisks in the \nworkplace \n2.1 Critical areas or processes \nare identified. \n2.2 The safety protocols are \nstrictly followed in \naccordance with the \nprocedure of the company. \n2.3 Work permit system of the \ncompany are being \ncomplied. \n2.4 Operational controls are in \nplaced before starting work. \n Knowledge on the \nestablished emergency \nplans including its \nperiodic review or after \nan emergency has \ntaken place. \n General principles of \ndamage control \nincluding the \nimportance of \npreparation, control and \nrepair \n Ways of controlling \ndamage during \nemergency. \n \n Using \nappropriate \npersonal safety \nequipment \n Applying for \nrelevant work \npermit \n Implementing \nengineering \ncontrols where \napplicable \n \n3. Take appropriate \nactions to control \nthe emergency \n3.1 Emergency situations are \ncorrectly recognized and \n Knowledge on different \nEmergency signals and \n Using emergency \nalarm signals\n\n--- PDF PAGE 33 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   29 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \nidentified. \n3.2 Information given on raising \nalarm is prompt, accurate, \ncomplete and clear. \n3.3 Appropriate response is \ntaken in accordance with \nestablished company \nprocedures. \n3.4 Contingency plans for \nemergency response are \nknown and are implemented \nin real and simulated \nemergency situations \n3.5 Evacuation routes and \ninternal and external \ncommunications and alarm \nsystems are correctly used \nin real and simulated \nemergency situations in \naccordance with regulatory \nrequirements and \nestablished procedures. \n \n \nsystems in \nmanufacturing plants. \n Types of emergencies \n(some examples are \nearthquake, spill and \nfire) \n Production contingency \nplans \n Indications of various \ntypes of emergency \nsituations and the \naction to be followed \nwhen various types of \nactual or potential \nemergency situations \nare identified. \n DOLE-OSHS Rule \n1940 Fire Protection \nand Control.  \n Escape routes and \ninternal and external \ncommunications \nsystems and alarms  \n Communication \ntechniques used during  \nemergencies \n \nand systems \n Applying \nappropriate \naction in various \ntypes of actual or \npotential \nemergency \nsituations\n\n--- PDF PAGE 34 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   30 \n \n \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Emergency \nequipment \nMay include: \n1.1 Firefighting equipment such as fire extinguishers, eye \nwash, fire hose. \n1.2 Two-way radios  \n1.3 Emergency Alarm Systems \n1.4 Evacuation layout plan \n1.5 Flash light \n \nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \n \n \nAssessment requires evidence that the candidate: \n1.1 Implemented chemical safety programs that promotes \nmeasures to prevent accident and incident from \nhappening in the plant. \n1.2 Took actions to control or manage risks. \n1.3 Followed established emergency procedures \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Emergency equipment \n2.2 Documented emergency procedures \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Interview \n3.2 Actual demonstration \n3.3 Authenticated portfolio (related certificates of \ntraining/seminar) \n4. Context for \nAssessment\n4.1 Competency maybe assessed in actual workplace or the \ndesignated TESDA Accredited Assessment Center.\n",
