        "source_text": "CPP313304\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes in verifying\noperating parameters, adjusting equipment settings and updating\noperating records of process equipment\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Verify\noperating\nparameters.\n\n1.1 Routine checks of process\nequipment conditions during\noperation are performed and\ncompleted in accordance with\nthe established procedures.\n1.2 Indications of potential and\nactual equipment problems\nare recognized and\nimmediately reported in\naccordance with the\nestablished procedures.\n1.3 Documentation is prepared\nand forwarded immediately to\nappropriate personnel\nand/or authority in\naccordance with company\nrequirements.\n1.4 Safety protocols are\npracticed.\n• Knowledge, Theory,\nPractices and\nSystems Operations\no Standard operating\nprocedures\no Primary Operating\nParameters\no Workflow\nsequences\no Correct selection\nand use of\nequipment,\nmaterials,\nprocesses and\nprocedures\no Factors which may\naffect production\noutput\n\n• Communication\no Manufacturer’s\nspecifications and\noperations manual\no Area\ncommunications\nprotocol\no Communication\ntools\n\n• Mathematics and\nMensuration\no Basic calculation\no Conversion of units\n\n• Safety Practices\no Safety Data Sheets\n\n• Codes and\nRegulations\no DAO 35, DAO 81\nand other relevant\nEffluents and\nEmissions\n• Identifying\npotential and\nactual problems\n• Examining\nequipment,\nproducts and\nprocesses for\npossible causes of\nvariations\n• Preparing and\nrouting of\nnecessary\ndocuments to\nappropriate\npersonnel\n\n--- PDF PAGE 70 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 66\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nRegulations\no Industrial safety\nand health\nstandards\no DOLE-OSHS Rule\n1150, 1160, 1170,\n1200, 1220, 1230,\n1422 other relevant\nOSHS Standards\no DOLE-DO 136\nGuidelines for the\nimplementation of\nGHS in Chemical\nSafety Program in\nthe Workplace\n\n• Materials, Tools and\nEquipment\no Calculator\no Computer\n\n• Values/Attitudes\no Resourcefulness\no Patience\no Industriousness\no Attention to details\no Diligence\no Honesty and\nintegrity\no Consideration\no Hard Work and\nPerseverance\n(Sipag at Tiyaga)\no Care (Malasakit)\n2. Adjust\nequipment\nsetting.\n\n2.1 Manual/electronic\nadjustments and actions\nare done to address\nindications of potential and\nactual equipment problems in\naccordance with the\nestablished procedures.\n2.2 Manual/electronic\nadjustments done are\nrecorded and reported to\nimmediate supervisor in\naccordance with the\nestablished procedures.\n2.3 Safety protocols are\npracticed.\n• Knowledge, Theory,\nPractices and\nSystems Operations\no Equipment controls\nand parameters\no Basic process\ncontrol\no Basic principles in\nmechatronics\n\n• Communication\no Work schedule\no Area\ncommunications\nprotocol\no Incidents reporting\no Monitoring\nforms/checklists\n• Monitoring\nperformance data\nagainst standard\noperating\nparameters\n• Identifying and\ncorrecting\nequipment\nproblem.\n• Recording and\nreporting\nadjustments\n\n--- PDF PAGE 71 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 67\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\no Verbal and written\ncommunications\n•\nMathematics and\nMensuration\no Basic Mathematics\no Conversion of units\n\n•\nSafety Practices\no Personal Safety\nEquipment\no Work hazards\no Risk assessment\n\n•\nCodes and\nRegulations\no DAO 35, DAO 81\nand other relevant\nEffluents and\nEmissions\nRegulations\no Industrial safety\nand health\nstandards\no DOLE-OSHS Rule\n1150, 1160, 1170,\n1200, 1220, 1230,\n1422 other relevant\nOSHS Standards\no DOLE-DO 136\nGuidelines for the\nimplementation of\nGHS in Chemical\nSafety Program in\nthe Workplace\n\n• Materials, Tools\nand Equipment,\nUses\nSpecifications and\nMaintenance\no Prescribed forms\nor log sheets\no Control Panel\no Pressure Gauges\no Temperature\nGauges\no Flowmeter\no Weighing Scale\no Valves\no Pumps\no Funnel\no Mixers\n•Values/Attitudes\n\n--- PDF PAGE 72 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 68\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\no Resourcefulness\no Patience\no Industriousness\no Attention to details\no Diligence\no Honesty and\nintegrity\no Consideration\no Hard Work and\nPerseverance\n(Sipag at Tiyaga)\no Care (Malasakit)\n\n3. Update\ndata\nsheets.\n\n3.1\nRequired production data\nsheet is prepared in\naccordance with established\nprocedures.\n3.2\nProduction Data sheet is\nfilled up in accordance with\nestablished procedures.\n3.3\nData sheet is regularly\naccomplished in a timely,\ntruthful and accurate manner.\n\n• Knowledge,\nTheory, Practices\nand Systems\nOperations\no Use of data\nsheets/Log sheets/\nRecord sheets\no data collection\nmethods\n\n• Communication\no Written\no Oral\no Electronic\n\n• Mathematics and\nMensuration\no Basic calculation\no Conversion of units\n\n• Safety\no Safety Records\n\n• Codes and\nRegulations\no DOLE-OSHS Rule\n1070 and other\nOSHS Standards\n\n• Materials, Tools &\nEquipment: Uses,\nSpecifications and\nMaintenance\no Computer\no Checklists/\no forms\no Log sheets\n\n• Values/Attitudes\no Resourcefulness\n• Preparing data\nsheets/ log sheets\n• Collecting data\n• Updating and\nmaintaining\nrecords\n\n--- PDF PAGE 73 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 69\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\no Patience\no Industriousness\no Attention to details\no Hard Work and\nPerseverance\n(Sipag at Tiyaga)\no Honesty and\nintegrity\no Care (Malasakit)\n\n--- PDF PAGE 74 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 70\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Conditions\n\nMay include:\n1.1 Operating Temperature\n1.2 Operating Pressure\n1.3 Agitation Rate\n1.4 Feed Rate\n1.5 Flow rate\n1.6 Cycle time\n1.7 Amperage\n1.8 Speed\n1.9 Production rate\n2. Signs of\npotential and\nactual\nequipment\nproblems\nMay include:\n2.1 Unusual noise\n2.2 Visual defects\n2.3 Erratic vibrations\n2.4 Temperature, pressure, and flow rate deviations\n3. Appropriate\npersonnel\nMay include:\n3.1 Process Engineer\n3.2 Foreman/Leadman\n3.3 Supervisor\n3.4 Safety Officer\n3.5 Maintenance Engineer\n3.6 Quality Control Personnel\n4. Adjustments\nand actions\nMay include:\n4.1Repair or replace defective parts\n4.2Re-calibrate/validate instruments\n4.3Re-start equipment\n5. Regularly\nMay include:\n5.1 scheduled\n5.2\nrandom\n\n--- PDF PAGE 75 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 71\nEVIDENCE GUIDE\n\n1. Critical Aspects\n of Competency\nAssessment requires evidence that the candidate:\n1.1\nIdentified and corrected process equipment problems.\n1.2\nDocumented and reported the tasks undertaken.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nEquipment\n2.2\nMaterials\n2.3\nPersonal Protective equipment\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nInterview/Questioning\n3.2\nDemonstration\n3.3\nWritten Examination\n4. Context of\nAssessment\n4.1 Competency maybe assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 76 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 72\nUNIT OF COMPETENCY : QUALIFY IN-PROCESS AND FINISHED PRODUCT SAMPLES\n\nUNIT CODE\n:"
