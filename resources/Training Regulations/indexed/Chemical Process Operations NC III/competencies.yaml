        "source_text": "ELC724201\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes in preparing,\nusing and maintaining hand and measuring tools.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare the\nrequired tools\ncorresponding\nto tasks to be\nundertaken\n1.1 Tasks to be undertaken are\nproperly identified\n1.2 Appropriate measuring tools\nare identified and selected\naccording to the task\nrequirements\n• Principles of planning\nand preparation of\nmeasuring tools\n• Types and\nspecifications of\nMeasuring tools\n• DOLE-OSHS Rule\n1422 Hand Tools\n\n• Interpersonal\nRelationship\n• Planning and\npreparing skills\n• Practicing verbal\nand written\ncommunications\n• Following and\ngiving instructions\n• Keen observation\nskills\n• Coordinating Skills\n• Documenting Skills\n2. Use\nappropriate\nhand tools and\ntest equipment\n2.1 Appropriate hand tools are\nchecked for proper\noperation and safety\n2.2 Unsafe or faulty tools are\nidentified and marked for\nrepair according to standard\ncompany procedure\n2.3 Tools are used according to\ntasks undertaken\n2.4 All safety procedures in\nusing tools are observed at\nall times and appropriate\npersonal protective\nequipment (PPE) are used\n2.5 Malfunctions, unplanned or\nunusual events are reported\nto the supervisor.\n• Principles of planning\nand preparation of\nhand tools and test\nequipment\n• Hand tools types,\nuses and\nspecifications\n• Test equipment\ntypes, uses and\nspecifications\n• Personal protective\nequipment\n• DOLE-OSHS Rule\n1422 Hand Tools\n\n• Interpersonal\nRelationship\n• Planning and\npreparing skills\n• Practicing verbal\nand written\ncommunications\n• Following and\ngiving instructions\n• Keen observation\nskills\n• Coordinating Skills\n• Documenting Skills\n3. Maintain hand\ntools\n3.1 Tools are not dropped to\navoid damage\n3.2 Routine maintenance of\ntools undertaken according\nto standard operational\nprocedures, principles and\ntechniques\n3.3 Tools are stored safely in\nappropriate locations in\naccordance with\nmanufacturer’s\nspecifications or standard\noperating procedures\n\n•\nPrinciples of planning\nand preparation of\nhand tools\n•\nHand tools types,\nuses, specifications\nand maintenance\n•\nTest equipment\ntypes, uses and\nspecifications\n•\nDOLE-OSHS Rule\n1422 Hand Tools\n\n•\nInterpersonal\nRelationship\n•\nPlanning and\npreparing skills\n•\nPracticing verbal\nand written\ncommunications\n•\nFollowing and\ngiving instructions\n•\nKeen observation\nskills\n•\nCoordinating Skills\n•\nDocumenting Skills\n\n--- PDF PAGE 36 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 32\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hand tools\nHand tools for adjusting, dismantling, assembling,\nfinishing, cutting. Tools may include cutters, wrenches,\nspatula, sounding tape.\n2. Personal Protective\nEquipment (PPE)\nMay include:\n2.1 Gloves\n2.2 Spectacles\n2.3 Apron/overall\n2.4 Hard hat\n2.5 Respirator\n2.6 Safety shoes\n3. Maintenance\nMay include:\n3.1 Cleaning\n3.2 Lubricating\n3.3 Tightening\n3.4 Simple mechanical repairs\n3.5 Adjustment using correct procedures\n\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated safe working practices at all times\n1.2 Prepared and selected the appropriate tools\n1.3 Used the appropriate tools for the job\n1.4 Performed all tasks to specification\n1.5 Maintained and stored tools in appropriate location\n\n2. Resource Implications\nThe following resources should be provided:\n3.1 screw drivers\n3.2 pliers\n3.3 punches\n3.4 wrenches, files\n3. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n2.1 Observation\n2.2 Oral questioning\n4. Context of Assessment\n\n4.1 Competency maybe in the workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 37 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW) Promulgated March 2016 33\nUNIT OF COMPETENCY : PERFORM MENSURATION AND CALCULATION\n\nUNIT CODE\n:"
