        "source_text": "--- PDF PAGE 17 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   13 \nUNIT OF COMPETENCY : \nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES  \n \nUNIT CODE \n:    500311112 \n \nUNIT DESCRIPTOR \n: \nThis unit of covers the knowledge, skills and attitudes required to \nsolve problems in the workplace including the application of \nproblem solving techniques and to determine and resolve the \nroot cause of problems. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Explain the \nanalytical \ntechniques \n1.1 All the analytical techniques \nare identified. \n1.2 Use of each technique is \napplied in real life situations.\n \nProblem \nidentification \ntechniques \n \nObservation, \ninvestigation and \nanalytical techniques\n \nCause and effect \ndiagrams \n \nPARETO analysis \n \nSWOT analysis \n \nGANT chart \n \nPERT CPM and \ngraph \n \nSCATTERGRAMS \n \n \nConduct \ninvestigation and \nroot cause \nanalysis \n \nImplement \ncorrective \nactions \n2. Identify the \nproblem \n2.1. Variances are identified \nfrom normal operating \nparameters; and product \nquality \n2.2. Extent, cause and nature \nare of the problem are \ndefined through \nobservation, investigation \nand analytical techniques \n2.3. Problems are clearly \nstated and specified \n \nCompetence \nincludes a thorough \nknowledge and \nunderstanding of the \nprocess, normal \noperating \nparameters, and \nproduct quality to \nrecognize non-\nstandard situations \n \nCompetence to \ninclude the ability to \napply and explain, \nsufficient for the \nidentification of \nfundamental cause, \ndetermining the \ncorrective action and \nprovision of \nrecommendations \n \nRelevant equipment \nand operational \nprocesses \n \nEnterprise goals, \ntargets and \n \nUse range of \nformal problem \nsolving \ntechniques \n \nIdentify and \nclarify the nature \nof the problem \n \nEvaluate the \neffectiveness of \na present \nprocess in the \ngalley \n \nApply analytical \ntechniques\n\n--- PDF PAGE 18 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   14 \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nmeasures \n \nEnterprise quality, \nOSH and \nenvironmental \nrequirement \n \nEnterprise \ninformation systems \nand data collation \n \nIndustry codes and \nstandards \n \nNormal operating \nparameters and \nproduct quality \n3. Determine \nfundamental \ncauses of the \nproblem  \n3.1 Possible causes are \nidentified based on \nexperience and the use of \nproblem solving tools / \nanalytical techniques. \n3.2 Possible cause statements \nare developed based on \nfindings \n3.3 Fundamental causes are \nidentified per results of \ninvestigation conducted \n \nRelevant equipment \nand operational \nprocesses \n \nEnterprise goals, \ntargets and \nmeasures \n \nEnterprise quality, \nOSH and \nenvironmental \nrequirements \n \nEnterprise \ninformation systems \nand data collation \n \nIndustry codes and \nstandards \n \n \nAnalysis of root \ncauses \n4. Determine \ncorrective action\n4.1 All possible options are \nconsidered for resolution of \nthe problem \n4.2 Strengths and weaknesses \nof possible options are \nconsidered \n4.3 Corrective actions are \ndetermined to resolve the \nproblem and possible \nfuture causes \n4.4 Action plans are \ndeveloped in identifying \nmeasurable objectives, \nresource needs and \ntimelines in accordance \nwith safety and operating \nprocedures \n \n \nUnderstand the \nprocedure in \nundertaking \ncorrective action \n \nPrinciples of \ndecision making \nstrategies and \ntechniques \n \nEnterprise \ninformation systems \nand data collation \n \nAction planning \n \n \nIdentify and \nclarify the nature \nof the problem \n \nDevise the best \nsolution \n \nEvaluate the \nsolution \n \nImplement plan \nto rectify the \nproblem \n \nImplementing \ncorrective and \npreventive \nactions based on \nroot cause \nanalysis\n\n--- PDF PAGE 19 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   15 \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n5. Provide \nrecommendatio\nn/s to manager \n5.1 Report on \nrecommendations are \nprepared \n5.2 Recommendations are \npresented to appropriate \npersonnel. \n5.3 Recommendations are \nfollowed-up, if required \n \nCompetence \nincludes a thorough \nknowledge and \nunderstanding of the \nprocess, normal \noperating \nparameters, and \nproduct quality to \nrecognize non-\nstandard situations \n \n \nUsing range of \nformal problem \nsolving \ntechniques \n \nIdentifying and \nclarifying the \nnature of the \nproblem \n \nDevising the best \nsolution \n \nEvaluating the \nsolution \n \nImplementation \nof a developed \nplan to rectify the \nproblem\n\n--- PDF PAGE 20 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   16 \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Analytical \ntechniques \nMay include: \n1.1 Brainstorming \n1.2 Intuitions/Logic \n1.3 Cause and effect diagrams \n1.4 Pareto analysis \n1.5 SWOT analysis \n1.6 Gant chart, Pert CPM and graphs \n1.7 Scattergrams \n \n2. Problem \n \nMay include: \n2.1 Non – routine process and quality problems \n2.2 Equipment selection, availability and failure \n2.3 Teamwork and work allocation problem \n2.4 Safety and emergency situations and incidents \n \n3. Action plans  \n \nMay include: \n3.1 Priority requirements \n3.2 Measurable objectives \n3.3 Resource requirements \n3.4 Timelines \n3.5 Co-ordination and feedback requirements \n3.6 Safety requirements \n3.7 Risk assessment \n3.8 Environmental requirements\n\n--- PDF PAGE 21 ---\nTR – CHEMICAL PROCESS OPERATIONS NC III (NEW)                          Promulgated March 2016                   17 \nEVIDENCE GUIDE \n \n \n1. Critical \nAspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified the problem \n1.2 Determined the fundamental causes of the problem \n1.3 Determined the correct / preventive action \n1.4 Provided recommendation to manager \n \nThese aspects may be best assessed using a range of scenarios / case \nstudies / what ifs as a stimulus with a walk through forming part of the \nresponse. These assessment activities should include a range of \nproblems, including new, unusual and improbable situations that may \nhave happened. \n2. Resource \nImplications \nAssessment will require access to an operating plant over an extended \nperiod of time, or a suitable method of gathering evidence of operating \nability over a range of situations. A bank of scenarios / case studies / \nwhat ifs will be required as well as bank of questions which will be used \nto probe the reason behind the observable action.  \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Case studies on solving problems in the workplace \n3.2 Observation \n \nThe unit will be assessed in a holistic manner as is practical and may be \nintegrated with the assessment of other relevant units of competency. \nAssessment will occur over a range of situations, which will include \ndisruptions to normal, smooth operation. Simulation may be required to \nallow for timely assessment of parts of this unit of competency. \nSimulation should be based on the actual workplace and will include walk \nthrough of the relevant competency components.  \n4. Context of \nAssessment\n4.1 Competency maybe assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n",
