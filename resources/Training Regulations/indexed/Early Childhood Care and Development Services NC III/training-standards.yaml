    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for EARLY CHILDHOOD CARE AND\nDEVELOPMENT SERVICES NC III.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components\nmentioned below.\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title:\nEARLY CHILDHOOD CARE AND\nDEVELOPMENT SERVICES\n NC Level NC III\n\nNominal Training Duration:\n\n 40\nHours (Basic Competencies)\n\n 18\nHours (Common Competencies)\n\n160\n 80\nHours (Core Competencies)\nHours Supervised Industry Learning\n(SIL)\n\n 298 TOTAL HOURS\n\nCourse Description:\nThis course is designed to equip learners with the knowledge, practical skills,\nand attitudes necessary to manage center operation, assess children's progress and\ndevelopment, and implement the Early Childhood Care and Development (ECCD)\ncurriculum in alignment with the National Early Learning Curriculum (NELC). It outlines\nthe foundational knowledge and skills required for early childhood program service\nproviders working with young children aged 3–4 years in center-based public or private\n\n--- PDF PAGE 144 ---\n140\nTR- Early Childhood Care and Development Services NC III\nsettings. The course also supports the qualifications for service providers catering to\nchildren aged 0–2 years, following industry standards such as the Infant and Toddler\nEarly Development (ITED) Program.\nPrograms for children under three years old are guided by key resources,\nincluding Learning Resource Package 2, which specifies Standards and\nCompetencies for Domains for 0–4 Years Old, and Learning Resource Package 3,\nwhich provides a Suggested Calendar of Activities for Parent Mentors of Infants and\nToddlers.\nUpon completion of the course, the learners are expected to demonstrate the\nabove- mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieved.\n\n--- PDF PAGE 145 ---\n141\nTR- Early Childhood Care and Development Services NC III\nBASIC COMPETENCIES\n (40 hours)\n\nUnits of Competency\nModule Title\nLearning Outcomes\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Leading\nworkplace\ncommunication\n1.1.1 Communicate information about workplace\nprocesses\n1.1.2 Lead workplace discussions\n1.1.3 Identify and communicate\nissues arising in the workplace\n6 hours\n2. Lead small teams\n2.1 Leading small teams\n2.1.1 Provide team leadership\n2.1.2 Assign responsibilities\n2.1.3 Set performance expectation for team\nmembers\n2.1.4 Supervise team\nperformance\n4 hours\n3. Apply critical thinking and\nproblem-solving techniques in\nthe workplace\n3.1 Applying critical thinking\nand problem-solving\ntechniques in the\nworkplace\n3.1.1 Examine specific workplace strategies\n3.1.2 Analyze the causes of specific workplace\nchallenges\n3.1.3 Formulate resolutions to specific workplace\nchallenges\n3.1.4 Implement action plans and communicate\nresults\n4 hours\n4. Work in a diverse\nenvironment\n4.1 Working in a diverse\nenvironment\n4.1.1 Develop an individual’s cultural awareness\nand sensitivity\n4.1.2 Work effectively in an environment that\nacknowledges and values cultural diversity\n4.1.3 Identify common issues in a multicultural and\ndiverse environment\n3 hours\n\n--- PDF PAGE 146 ---\n142\nTR- Early Childhood Care and Development Services NC III\n5. Propose methods of\napplying learning and\ninnovation in the\norganization\n5.1 Proposing methods of\napplying learning and\ninnovation in the\norganization\n5.1.1 Assess work procedures, processes and\nsystems in terms of innovative practices\n5.1.2 Generate practical action plans for\nimproving work procedures, processes\n5.1.3 Evaluate the effectiveness of the proposed\naction plans\n3 hours\n6. Use information systematically\n6.1 Using\ninformation\nsystematically\n6.1.1 Use technical information\n6.1.2 Apply information technology (IT)\n6.1.3 Edit, format and check information\n8 hours\n7. Evaluate occupational safety\nand health Work practices\n7.1 Evaluating occupational\nsafety and health Work\npractices\n7.1.1 Identify Occupational Safety and Health\ncompliance requirements\n7.1.2 Prepare OSH requirements for compliance\n 7.1.3 Evaluate effectiveness of Occupational Safety\nand Health work instructions\n4 hours\n8. Evaluate environmental work\npractices\n8.1 Evaluating environmental\nwork practices\n8.1.1 Interpret environmental practices, policies\nand procedures\n8.1.2 Establish targets to evaluate environmental\npractices\n8.1.3 Evaluate effectiveness of environmental\npractices\n3 hours\n9. Facilitate entrepreneurial skills\nfor micro- small-medium\nenterprises (MSMEs)\n9.1 Facilitating\nentrepreneurial skills for\nmicro- small-medium\nenterprises (MSMEs)\n9.1.4 Develop and maintain micro- small- medium\nenterprise (MSMEs) skills in the organization\n9.1.2 Establish and maintain client-base/market\n9.1.3 Apply budgeting and financial management\nskills\n5 hours\n\n--- PDF PAGE 147 ---\n143\nTR- Early Childhood Care and Development Services NC III\n\nCOMMON COMPETENCIES\n(18 hours)\n\nUnits of Competency\nModule Title\nLearning Outcomes\nNominal\nDuration\n1. Maintain an effective\nrelationship with clients/\ncustomers\n1.1 Maintaining client\nrelations\n1.1.1 Maintain a professional image\n1.1.2 Meet client/customer requirements\n1.1.3 Build credibility with customers\n/clients\n1.1.4 Establish professional relationship with the\nclient\n1.1.5 Manage client interactions\n1.1.6 Provide effective responses to client\n6 hours\n2. Manage own performance\n2.1 Managing own\nperformance\n2.1.1 Plan for completion of own workload\n2.1.2 Maintain quality of own performance\n2.1.3 Build credibility with customers/\nclients\n6 hours\n3. Apply quality standards\n3.1 Applying\nquality standards\n3.1.1 Assess clients service needs\n3.1.2 Assess own work\n3.1.3 Engage in quality improvement\n6 hours\n\n--- PDF PAGE 148 ---\n144\nTR- Early Childhood Care and Development Services NC III\n\nCORE COMPETENCIES\n(160 hours)\n\nUNIT OF COMPETENCY\nMODULE TITLE\nLEARNING OUTCOMES\nNominal\nDuration\n1. Manage Center Operations\n1.1. Managing Center\nOperations\n1.1.1. Gather information\n1.1.2. Conduct awareness – raising activity\n1.1.3. Manage enrollment\n1.1.4. Prepare the center\n1.1.5. Conduct parent orientation\n1.1.6. Perform activities in recognition of the center\n32 hours\n2. Conduct Assessment on\nProgress and Development\nof Children\n2.1. Conducting Assessment\non Progress and\nDevelopment of\nChildren\n2.1.1. Determine initial developmental level\n2.1.2. Conduct informal assessments\n2.1.3. Conduct observation of children’s health,\nnutrition, safety and well-being\n2.1.4. Conduct formal assessment\n2.1.5. Manage reporting of assessment results\n64 hours\n3. Implement the Early\nChildhood Care Curriculum\n3.1. Implementing the Early\nChildhood Care\nCurriculum\n3.1.1. Create curriculum plan\n3.1.2. Manage curriculum plan implementation\n3.1.3. Review curriculum plan\n3.1.4. Perform culminating activities\n64 hours\n\n--- PDF PAGE 149 ---\n145\nTR- Early Childhood Care and Development Services NC III\n3.2\nTRAINING DELIVERY\n\n1.\nThe delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na.\nCourse design is based on competency standards set by the industry or recognized\nindustry sector; (Learning system is driven by competencies written to industry standards)\nb.\nTraining delivery is learner-centered and should accommodate individualized and self-\npaced learning strategies;\nc.\nTraining can be done on an actual workplace setting, simulation of a workplace and/or\nthrough adoption of modern technology.\nd.\nAssessment is based in the collection of evidence of the performance of work to the industry\nrequired standards;\ne.\nAssessment of competency takes the trainee’s knowledge and attitude into account but\nrequires evidence of actual performance of the competency as the primary source of\nevidence.\nf.\nTraining program allows for recognition of prior learning (RPL) or current competencies;\ng.\nTraining completion is based on satisfactory performance of all specified competencies.\n\n2.\nThe competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1\nSchool/Institution- Based:\n\n●\nDual Training System (DTS)/Dualized Training Program (DTP) which contain both in-\nschool and in-industry training or fieldwork components. Details can be referred to the\nImplementing Rules and Regulations of the DTS Law and the TESDA Guidelines on the\nDTP.\n\n●\nDistance learning is a formal education process in which the majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, audio, video, computer technologies or other modern\ntechnologies that can be used to facilitate learning and formal and non-formal training.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n●\nSupervised Industry Training (SIT) or on-the-job training (OJT) is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual experience in\nthe workplace to acquire specific competencies as prescribed in the training regulations. It\nis imperative that the deployment of trainees in the workplace is adhered to training\nprograms agreed by the institution and enterprise and status and progress of trainees are\nclosely monitored by the training institutions to prevent opportunity for work exploitation.\n\n●\nThe classroom-based or in-center instruction uses of learner-centered methods as well as\nlaboratory or field-work components.\n\n--- PDF PAGE 150 ---\n146\nTR- Early Childhood Care and Development Services NC III\n\n2.2\nEnterprise-Based:\n\n●\nFormal Apprenticeship – Training within employment involving a contract between an\napprentice and an enterprise on an approved apprenticeable occupation.\n\n●\nInformal Apprenticeship - is based on a training (and working) agreement between an\napprentice and a master craftsperson wherein the agreement may be written or oral and\nthe master craftsperson commits to training the apprentice in all the skills relevant to his or\nher trade over a significant period of time, usually between one and four years, while the\napprentice commits to contributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by working alongside the\nexperienced craftsperson.\n\n●\nEnterprise-based Training - where training is implemented within the company in\naccordance with the requirements of the specific company. Specific guidelines on this\nmode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – short term program conducted by non-government organizations\n(NGOs), LGUs, training centers and other TVET providers which are intended to address\nthe specific needs of a community. Such programs can be conducted in informal settings\nsuch as barangay hall, basketball courts, etc. These programs can also be mobile training\nprogram (MTP)\n\n--- PDF PAGE 151 ---\n147\nTR- Early Childhood Care and Development Services NC III\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry in any of these courses should possess the following\nrequirements:\n\n● At least high school graduate (10 years K-10/12 years K-12 Curriculum); OR Holder of\nAlternative Learning Systems (ALS) certificate of completion with grade 10 equivalent;\nOR With at least five (5) years experience and with at least 2 Trainings within the last five\n(5) years relevant to the field (Certificate of Employment is required as proof of\nexperience);\n● Basic knowledge on word processing, presentation, and spreadsheet tools is required for\ncreating documents, presentations, and managing data;\n● Must have good communication skills; and\n● Can perform basic mathematical computation\n\n3.4\nTOOLS, EQUIPMENT AND MATERIALS\n\nEARLY CHILDHOOD CARE AND DEVELOPMENT SERVICES NC III\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nEarly Childhood Care and Development Services NC III.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used as\nalternatives. This also applies in consideration of community practices and their availability in\nthe local market.\n\nTOOLS (SUBSCRIPTION)\nQuantity\nUnit\nDescription / Specification\n1\nUnit\nOffice Productivity Tools (offline or online)\n1\nUnit\nInternet access\n1\nUnit\nPresentation software\n\nTOOLS, EQUIPMENT AND MATERIALS\nQuantity\nUnit\nDescription / Specification\n6\nunits\nComputer Desktop or Laptop\n6\npcs\nComputer table\n1\nset\nOffice table with regular chairs\n1\nunit\nLCD projector and projector screen or SMART TV\n1\npc\n3 TB External hard drive or higher\n1\nUnit\nRouter, LAN or WIFI\n1\nunit\nWhite/Black/Green board\n2\npcs\nCabinet or shelves\n1\nunit\nCellphone\n1\nset\nPrinter\n1\nunit\nAir conditioning unit or Electric Fan\n\n--- PDF PAGE 152 ---\n148\nTR- Early Childhood Car