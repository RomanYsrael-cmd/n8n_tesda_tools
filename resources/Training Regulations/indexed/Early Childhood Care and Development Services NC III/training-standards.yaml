opment and\nLearning and Appropriating Funds Therefore.\n● RA No. 10121: Philippine Disaster Risk Reduction\nand Management Act of 2010\n● Environmental issues and sustainable development\n● UN Convention on the Rights of the Child\n● Department Order No. 3 s. 2021 entitled Creation of\nthe Child Protection Unit and the Child Rights in\nEducation Desk in the Department of Education\n● RA No. 11650: Inclusive Education Act\n● RA No. 10821: Children’s Emergency Relief and\nProtection Act\n\nReferences:\n● Early Childhood Curriculum and Standards and\nGuidelines\n● The National Early Learning Framework of the\nPhilippines (NELF)\n● National Early Learning Curriculum (NELC)\n● Standard Guidelines for Center - based Early\nChildhood Programs for 0 - 4 years old Filipino\nChildren.\n● Guidebook for ECCDs Service Provider and Parents\n(Managing 0 – 4 y/o children with development delays\nand disabilities in early learning programs.\n\n--- PDF PAGE 155 ---\n151\nTR- Early Childhood Care and Development Services NC III\n3.5\nTRAINING FACILITIES\n\nEARLY CHILDHOOD CARE AND DEVELOPMENT SERVICES NC III\n\nBased on a class intake of 25 learners/trainees.\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nTOTAL\nAREA IN\nSQ.\nMETERS\nContextual Learning Area\n(Lecture room)\n7 x 9\n63\n63\nPractical Work Area 1 /Child\nDevelopment Center\nClassroom (indoor space)\n1.5\n30\n30\nPractical Work Area 2 /Child\nDevelopment Center Outdoor\nSpace\n\n80\n80\nKitchen Area\n\n5\n5\nLearning Resource Area\n3 x 4\n 12\n12\nWash area/comfort\nroom (Male,\nFemale, with\nprovision for PWD)\n2 x 2\n4\n4\nGRAND TOTAL AREA:\n194\nsqm\n\nNote: Access to and use of equipment and facilities can be provided through cooperative\narrangements of MOA with other partner enterprises/organizations/institutions.\n\n--- PDF PAGE 156 ---\n152\nTR- Early Childhood Care and Development Services NC III\n3.6\nTRAINERS’ QUALIFICATIONS\n\n○ Must have a Bachelor’s Degree in Early Childhood Education, Family