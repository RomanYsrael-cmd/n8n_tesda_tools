QUIRED \nSKILLS \n2.  Apply information \ntechnology (IT)  \n2.1. Technical \ninformation \nsystem is operated \nusing agreed \nprocedures  \n2.2. Appropriate and \nvalid procedures \nare operated for \ninputting, \nmaintaining and \narchiving \ninformation \n2.3. Software  required \nare utilized to \nexecute the project \nactivities \n2.4. Information and \ndata obtained are \nhandled, edited, \nformatted and \nchecked from a \nrange of internal \nand external \nsources \n2.5. Information are \nextracted, entered, \nand processed to \nproduce the \noutputs required by \ncustomers \n2.6. Own skills and \nunderstanding are \nshared to help \nothers \n2.7. Specified security \nmeasures are \nimplemented to \nprotect the \nconfidentiality and \nintegrity of project \ndata held in IT \nsystems \n2.1. Attributes and \nlimitations of \navailable software \ntools \n2.2. Procedures and \nwork instructions \nfor the use of IT  \n2.3. Operational \nrequirements for IT \nsystems  \n2.4. Sources and flow \npaths of data  \n2.5. Security systems \nand measures that \ncan be used  \n2.6. Extract data and \nformat reports  \n2.7. Methods of \nentering and \nprocessing \ninformation \n2.8. WWW enabled \napplications \n2.1. Identifying \nattributes and \nlimitations of \navailable software \ntools \n2.2. Using procedures \nand work \ninstructions for \nthe use of IT  \n2.3. Describing \noperational \nrequirements for \nIT systems  \n2.4. Identifying \nsources and flow \npaths of data  \n2.5. Determining \nsecurity systems \nand measures \nthat can be used  \n2.6. Extracting data \nand format \nreports  \n2.7. Describing \nmethods of \nentering and \nprocessing \ninformation \n2.8. Using WWW \napplications\n\n--- PDF PAGE 34 ---\n30 \nTR- Early Childhood Care and Development Services NC III \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.  Edit, format and \ncheck information \n3.1 Basic editing \ntechniques are used  \n3.2 Accuracy of \ndocuments are \nchecked  \n3.3 Editing and \nformatting tools and \ntechniques are used \nfor more complex \ndocuments  \n3.4 Proof reading \ntechniques is used \nto check that \ndocuments look \nprofessional \n3.1 Basic file-handling \ntechniques \n3.2 Techniques in \nchecking \ndocuments \n3.3 Techniques in \nediting and \nformatting \n3.4 Proof reading \ntechniques  \n \n3.1 Using basic file-\nhandling \ntechniques is \nused for the \nsoftware \n3.2 Using different \ntechniques in \nchecking \ndocuments \n3.3 Applying editing \nand formatting \ntechniques \n3.4 Applying proof \nreading \ntechniques\n\n--- PDF PAGE 35 ---\n31 \nTR- Early Childhood Care and Development Services NC III \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Information \nMay include: \n1.1. \nProperty  \n1.2. \nOrganizational \n1.3. \nTechnical reference \n2. Technical information \nMay include: \n2.1. \npaper based  \n2.2. \nelectronic \n3. Software   \nMay include: \n3.1. \nspreadsheets  \n3.2. \ndatabases \n3.3. \nword processing \n3.4. \n presentation  \n4. Sources \nMay include: \n4.1. \nother IT systems \n4.2. \nmanually created  \n4.3. \nwithin own organization  \n4.4. \noutside own organization  \n4.5. \ngeographically remote \n5. Customers \nMay include: \n5.1. \ncolleagues \n5.2. \ncompany and project management \n5.3. \nclients \n6. Security measures \nMay include: \n6.1. \naccess rights to input;  \n6.2. \npasswords;  \n6.3. \naccess rights to outputs;  \n6.4. \ndata consistency and back-up;  \n6.5. \nrecovery plans\n\n--- PDF PAGE 36 ---\n32 \nTR- Early Childhood Care and Development Services NC III \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Used technical information systems and information \ntechnology \n1.2. Applied information technology (IT) systems \n1.3. Edited, formatted and checked information \n2. Resource \nImplications \nThe following resourc