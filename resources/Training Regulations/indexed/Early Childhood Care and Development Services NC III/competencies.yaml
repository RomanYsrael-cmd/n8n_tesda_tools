        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Established the reasons why innovative systems are required\n1.2 Established the goals of a new innovative system\n1.3 Analyzed current organizational systems to identify gaps and\nbarriers to innovation.\n1.4 Assessed work procedures, processes and systems in terms\nof innovative practices.\n1.5 Generate practical action plans for improving work\nprocedures, and processes.\n1.6 Reviewed the trial innovative work system and adjusted\nreflect evaluation feedback, knowledge management\nsystems and future planning.\n1.7 Evaluated the effectiveness of the proposed action plans.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nPens, papers and writing implements.\n2.2\nCartolina.\n2.3\nManila papers.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Psychological and behavioral Interviews.\n3.2\nPerformance Evaluation.\n3.3\nLife Narrative Inquiry.\n3.4\nReview of portfolios of evidence and third-party workplace\nreports of on-the-job performance.\n3.5\nSensitivity analysis.\n3.6\nOrganizational analysis.\n3.7\nStandardized assessment of character strengths and\nvirtues applied.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions.\n\n--- PDF PAGE 32 ---\n28\nTR- Early Childhood Care and Development Services NC III\nUNIT OF COMPETENCY\n:\nUSE INFORMATION SYSTEMATICALLY\n\nUNIT CODE\n:"
        },
        "source_text": "400311323\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to assess general obstacles in the\napplication of learning and innovation in the\norganization and to propose practical methods of\nsuch in addressing organizational challenges.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Assess work\nprocedures,\nprocesses and\nsystems in terms\nof innovative\npractices.\n1.1. Reasons for\ninnovation are\nincorporated\nto work procedures.\n1.2. Models of\ninnovation are\nresearched.\n1.3. Gaps or barriers\nto innovation in\none’s work area are\nanalyzed.\n1.4. Staff who can\nsupport and foster\ninnovation in the\nwork procedure are\nidentified.\n1.1 Seven habits of\nhighly effective\npeople.\n1.2 Character\nstrengths that\nfoster innovation\nand learning\n(Christopher\nPeterson and\nMartin Seligman,\n2004)\n1.3 Five minds of the\nfuture concepts\n(Gardner, 2007).\n1.4 Adaptation\nconcepts in\nneuroscience\n(Merzenich,\n2013).\n1.5 Transtheoretical\nmodel of\nbehavior change\n(Prochaska,\nDiClemente, &\nNorcross, 1992).\n\n1.1 Demonstrating\ncollaboration and\nnetworking skills.\n1.2 Applying basic\nresearch and\nevaluation skills\n1.3 Generating\ninsights on how\nto improve\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation.\n\n--- PDF PAGE 28 ---\n24\nTR- Early Childhood Care and Development Services NC III\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Generate practical\naction plans for\nimproving work\nprocedures,\nprocesses.\n2.1 Ideas for innovative\nwork procedure to\nfoster innovation\nusing individual and\ngroup techniques\nare conceptualized\n2.2 Range of ideas with\nother team\nmembers and\ncolleagues are\nevaluated and\ndiscussed\n2.3 Work procedures\nand processes\nsubject to change\nare selected based\non workplace\nrequirements\n(feasible and\ninnovative).\n2.4 Practical action\nplans are proposed\nto facilitate simple\nchanges in the\nwork procedures,\nprocesses and\nsystems.\n2.5 Critical inquiry is\napplied and used to\nfacilitate discourse\non adjustments in\nthe simple work\nprocedures,\nprocesses and\nsystems.\n2.1 Seven habits of\nhighly effective\npeople.\n2.2 Character\nstrengths that\nfoster innovation\nand learning\n(Christopher\nPeterson and\nMartin Seligman,\n2004)\n2.3 Five minds of the\nfuture concepts\n(Gardner, 2007).\n2.4 Adaptation\nconcepts in\nneuroscience\n(Merzenich,\n2013).\n2.5 Transtheoretical\nmodel of\nbehavior change\n(Prochaska,\nDiClemente, &\nNorcross, 1992).\n2.1 Assessing\nreadiness for\nchange on simple\nwork procedures,\nprocesses and\nsystems.\n2.2 Generating\ninsights on how\nto improve\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation.\n2.3 Facilitating action\nplans on how to\napply innovative\nprocedures in the\norganization.\n\n--- PDF PAGE 29 ---\n25\nTR- Early Childhood Care and Development Services NC III\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Evaluate the\neffectiveness of\nthe proposed\naction plans.\n3.1 Work structure is\nanalyzed to\nidentify the impact\nof the new work\nprocedures\n3.2 Co-workers/key\npersonnel is\nconsulted to know\nwho will be\ninvolved with or\naffected by the\nwork procedure\n3.3 Work instruction\noperational plan of\nthe new work\nprocedure is\ndeveloped and\nevaluated.\n3.4 Feedback and\nsuggestion are\nrecorded.\n3.5 Operational plan is\nupdated.\n3.6 Results and\nimpact on the\ndeveloped work\ninstructions are\nreviewed\n3.7 Results of the new\nwork procedure\nare evaluated\n3.8 Adjustments are\nrecommended\nbased on results\ngathered\n3.1 Five minds of the\nfuture concepts\n(Gardner,\n2007).\n3.2 Adaptation\nconcepts in\nneuroscience\n(Merzenich,\n2013).\n3.3\nTranstheoretical\nmodel of\nbehavior\nchange\n(Prochaska,\nDiClemente, &\nNorcross,\n1992).\n3.1 Generating\ninsights on how\nto improve\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation.\n3.2 Facilitating action\nplans on how to\napply innovative\nprocedures in\nthe\norganization.\n3.3 Communicating\nresults of the\nevaluation of the\nproposed and\nimplemented\nchanges in the\nworkplace\nprocedures and\nsystems.\n3.4 Developing action\nplans for\ncontinuous\nimprovement on\nthe basic\nsystems,\nprocesses and\nprocedures in\nthe\norganization.\n\n--- PDF PAGE 30 ---\n26\nTR- Early Childhood Care and Development Services NC III\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Reasons\nMay include:\n1.1 Strengths and weaknesses of the current systems,\nprocesses and procedures.\n1.2 Opportunities and threats of the current systems,\nprocesses and procedures.\n2. Models of innovation\nMay include:\n2.1 Seven habits of highly effective people.\n2.2 Five minds of the future concepts (Gardner, 2007).\n2.3 Neuroplasticity and adaptation strategies.\n3. Gaps or barriers\nMay include:\n3.1 Machine\n3.2 Manpower\n3.3 Methods\n3.4 Money\n4. Critical Inquiry\nMay include:\n4.1\nPreparation.\n4.2\nDiscussion.\n4.3\nClarification of goals.\n4.4\nNegotiate towards a Win-Win outcome.\n4.5\nAgreement.\n4.6\nImplementation of a course of action.\n4.7\nEffective verbal communication. See our pages:\nVerbal Communication and Effective Speaking.\n4.8\nListening.\n4.9\nReducing misunderstandings is a key part of\neffective negotiation.\n4.10 Rapport Building.\n4.11 Problem Solving.\n4.12 Decision Making.\n4.13 Assertiveness.\n4.14 Dealing with Difficult Situations.\n\n--- PDF PAGE 31 ---\n27\nTR- Early Childhood Care and Development Services NC III\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Established the reasons why innovative systems are required\n1.2 Established the goals of a new innovative system\n1.3 Analyzed current organizational systems to identify gaps and\nbarriers to innovation.\n1.4 Assessed work procedures, processes and systems in terms\nof innovative practices.\n1.5 Generate practical action plans for improving work\nprocedures, and processes.\n1.6 Reviewed the trial innovative work system and adjusted\nreflect evaluation feedback, knowledge management\nsystems and future planning.\n1.7 Evaluated the effectiveness of the proposed action plans.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nPens, papers and writing implements.\n2.2\nCartolina.\n2.3\nManila papers.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Psychological and behavioral Interviews.\n3.2\nPerformance Evaluation.\n3.3\nLife Narrative Inquiry.\n3.4\nReview of portfolios of evidence and third-party workplace\nreports of on-the-job performance.\n3.5\nSensitivity analysis.\n3.6\nOrganizational analysis.\n3.7\nStandardized assessment of character strengths and\nvirtues applied.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions.\n\n--- PDF PAGE 32 ---\n28\nTR- Early Childhood Care and Development Services NC III\nUNIT OF COMPETENCY\n:\nUSE INFORMATION SYSTEMATICALLY\n\nUNIT CODE\n:"
