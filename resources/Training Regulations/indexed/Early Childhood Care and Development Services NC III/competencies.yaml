utine\nDaily routine may include:\n6.1 Arrival time\n6.2 Meeting time\n6.3 Work time\n6.4 Circle time\n6.5 Outdoor play\n6.6 Self-help and hand washing\n6.7 Snack time\n6.8 Hygiene activities\n6.9 Rest time\n6.10 Story telling\n6.11 Departure\n\n7. Organize special activities\nOrganize special activities may include:\n7.1 Invite resource person\n7.2 Out of the classroom activities\n7.3 Programs on government mandated and\nlocal celebrations\n8. Inventory\nInventory may include:\n 8.1 Copy of children’s portfolio\n 8.2 Classroom equipment\n 8.3 Learning materials and supplies\n8.4 Furniture\n9. Stakeholders\nStakeholders may include:\n9.1 Parents/Parent-Substitute\n9.2 Early Childhood Care and Development\n(ECCD) focal\n9.3 Municipal Social Welfare and Development\nOfficer (MSWDO)\n9.4 Provincial Social Welfare and Development\nOfficer (PSWDO)\n9.5 Other Child Development\nWorkers/Teachers\n9.6 Specialists\n9.7 Representatives from other sectors\n\n--- PDF PAGE 141 ---\n137\nTR- Early Childhood Care and Development Services NC III\n9.7.1 Health and Nutrition\n9.7.2 Gender and Development\n9.7.3 Anti-Violence Against Women and\ntheir Children\n10. Planning of culminating\nactivities\nPlanning of culminating activities may include:\n10.1 Preparation of certificates of attendance\n10.2 Preparation of certificates of completion\n10.3 Rehearsal of children\n\n--- PDF PAGE 142 ---\n138\nTR- Early Childhood Care and Development Services NC III\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Created curriculum plan\n1.1.1 Set goals\n1.1.2 Identified themes and subthemes\n1.1.3 Organized developmentally appropriate\nactivities\n\n1.2 Managed curriculum plan implementation\n1.2.1 Written activity plan\n1.2.2 Set learning area\n1.2.3 Established daily routine\n1.2.4 Established classroom management plan\n1.2.5 Implemented classroom management plan\n1.2.6 Implemented the daily activity plan\n1.2.7 Organized special activities\n1.2.8 Documented curriculum\n\n1.3 Reviewed curriculum plan\n 1.3.1 Used result of assessment\n1.3.2 Gathered feedback\n1.3.3 Adjusted curriculum plan\n1.3.4 Implemented revised activity plan\n\n1.4 Performed culminating activities\n1.3.1 Performed coordination with parent/parent-\nsubstitute\n1.3.2 Planned culminating activity\n1.3.3 Carried out culminating activity\n1.3.4 Conducted end of the school year meeting\n\n2. Resource Implications\nThe following resources should be provided:\n2.1 Simulated workplace\n2.2 Records\n2.3 Activity plan\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Demonstration with Oral questioning\n3.2 Work-related Project (Written)\n4. Context for Assessment 4.1 Competency may be assessed in actual\nworkplace or at the designated TESDA Accredited\nAssessment Center in a simulated workplace\nsetting.\n\n--- PDF PAGE 143 ---\n139\nTR- Early Childhood Care and Development Services NC III"
