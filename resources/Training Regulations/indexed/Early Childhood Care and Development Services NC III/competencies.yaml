   \n2.1 Building customer \nrelations \n2.2 Individual \nmarketing skills  \n2.3 Using basic \nadvertising \n(posters/ \ntarpaulins, flyers,\n\n--- PDF PAGE 46 ---\n42 \nTR- Early Childhood Care and Development Services NC III \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \noffered to loyal \ncustomers  \n2.4 Additional products \nand services are \nevaluated and tried \nwhere feasible. \n2.5 Promotional/adver\ntising initiatives \nare carried out \nwhere necessary \nand feasible. \nsocial media, \netc.)  \n3. Apply budgeting \nand financial \nmanagement skills   \n3.1 Enterprise is built \nup and sustained \nthrough judicious \ncontrol of cash \nflows.  \n3.2 Profitability of \nenterprise is \nensured though \nappropriate internal \ncontrols. \n3.3 Unnecessary or \nlower-priority \nexpenses and \npurchases are \navoided.  \n3.1 Cash flow \nmanagement \n3.1 Basic financial \nmanagement \n3.2 Basic financial \naccounting \n3.3 Business internal \ncontrols  \n3.1 Setting business \npriorities and \nstrategies \n3.2 Interpreting basic \nfinancial \nstatements \n3.3 Preparing \nbusiness plans\n\n--- PDF PAGE 47 ---\n43 \nTR- Early Childhood Care and Development Services NC III \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Business strategies \nMay include: \n1.1. \nDeveloping/Maintaining niche market  \n1.2. \nUse of organic/healthy ingredients   \n1.3. \nEnvironment-friendly and sustainable practices  \n1.4. \nOffering both affordable and high-quality products \nand services  \n1.5. \nPromotion and marketing strategies (e. g., on-line \nmarketing) \n2. Business operations  \nMay include: \n2.1 Purchasing  \n2.2 Accounting/Administrative work \n2.3 Production/Operations/Sales \n3. Internal controls \nMay include: \n3.1 Accounting systems \n3.2 Financial statements/reports \n3.3 Cash management  \n4. Promotional/Advertising \ninitiatives  \nMay include: \n4.1 \nUse of tarpaulins, brochures, and/or flyers \n4.2 \n Sales, discounts and easy payment terms \n4.3 \nUse of social media/Internet \n4.4 \n“Service with a smile” \n4.5 \nExtra attention to regular customers\n\n--- PDF PAGE 48 ---\n44 \nTR- Early Childhood Care and Development Services NC III \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate : \n1.1   Demonstrated basic entrepreneurial skills \n1.2   Demonstrated ability to conceptualize and plan a \nmicro/small enterprise \n1.3   Demonstrated ability to manage/operate a micro/small-\nscale business   \n2. Resource \nImplications \nThe following resources should be provided: \n  \n2.1 Simulated or actual workplace \n2.2 Tools, materials and supplies needed to demonstrate the \nrequired tasks  \n2.3 References and manuals \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through : \n3.1 Written examination \n3.2 Demonstration/observation with oral questioning \n3.3 Portfolio assessment with interview \n3.4 Case problems \n4. Context of \nAssessment \n1.1 Competency may be assessed in workplace or in a \nsimulated  workplace setting \n1.2 Assessment shall be observed while tasks are being \nundertaken whether individually or in-group\n",
