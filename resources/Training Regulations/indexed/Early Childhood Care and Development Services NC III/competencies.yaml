ded based on\nworkplace\nstandards\n3.2. Recorded work\nenvironmental\npractices are\ncompared against\nplanned indicators\n3.3. Findings regarding\neffectiveness are\nassessed and gaps\nidentified are\nimplemented based\non environment\nwork standards and\nprocedures\n3.4. Results of\nenvironmental\nassessment are\nconveyed to\nappropriate\npersonnel\n\n1.1. Environmental\nPractices\n1.2. Environmental\nStandards and\nProcedures\n3.1 Documentation\nand Record\nKeeping Skills\n3.2 Critical thinking\n3.3 Problem Solving\n3.4 Observation\nSkills\n\n--- PDF PAGE 43 ---\n39\nTR- Early Childhood Care and Development Services NC III\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Environmental Practices\nIssues\nMay include:\n1.1\nWater Quality\n1.2\nNational and Local Government Issues\n1.3\nSafety\n1.4\nEndangered Species\n1.5\nNoise\n1.6\nAir Quality\n1.7\nHistoric\n1.8\nWaste\n1.9\nCultural\n2. Environmental Indicators\nMay include:\n2.1\nNoise level\n2.2\nLighting (Lumens)\n2.3\nAir Quality - Toxicity\n2.4\nThermal Comfort\n2.5\nVibration\n2.6\nRadiation\n2.7\nQuantity of the Resources\n2.8\nVolume\n\n--- PDF PAGE 44 ---\n40\nTR- Early Childhood Care and Development Services NC III\nEVIDENCE GUIDE\n\n1. Critical aspects\nof\n Competency\n Assessment requires evidence that the candidate:\n1.1. Identified environmental issues relevant to work\nrequirements\n1.2. Identified gaps in work practices related to\nEnvironmental Standards and Procedures\n1.3. Gathered relevant information necessary to determine\nenvironmental work targets\n1.4. Set environmental indicators based on gathered\ninformation to measure environmental work targets\n1.5. Recorded work environmental practices are recorded\nbased on workplace standards\n1.6. Conveyed results of environmental assessment to\nappropriate personnel\n 2. Resource\nImplications\n The following resources should be provided:\n2.1 Workplace/Assessment location\n2.2 Legislation, policies, procedures, protocols and local\nordinances re