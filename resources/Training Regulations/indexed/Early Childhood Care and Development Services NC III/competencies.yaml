        "evidence_guide": {
          "source_text": "1. Critical Aspects\nof Competency\n\nAssessment requires that the candidate:\n1.1 Planned for completion of own workload\n1.2 Assessed verbal or written work plan\nthrough observation and discussion of site\nand employer requirements\n1.3 Demonstrated capacity to complete task\nwithin specified time frame\n1.4 Maintained quality of own performance\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Assessment Centers/Venues\n2.2 Accredited Assessors\n2.3 Modes of Assessment\n2.4 Evaluation Reports\n2.5 Access to relevant venue, equipment and\nmaterials\n2.6 Assignment Instructions\n2.7 Logbooks\n2.8\n\nOperational\nmanuals\nand\nmakers’/customers’ instructions\n2.9 Assessment Instruments, including personal\nplanner and assessment record book\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written Test\n3.2 Demonstration\n3.3 Observation\n3.4 Questioning\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual\nworkplace or in a simulated work setting\n\n--- PDF PAGE 61 ---\n57\nTR- Early Childhood Care and Development Services NC III\nUNIT OF COMPETENCY :\nAPPLY QUALITY STANDARDS\n\n UNIT CODE\n:"
