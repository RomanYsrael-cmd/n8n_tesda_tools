  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\nThis section gives the details of the contents of the basic, common, and core\nunits of competency required in EARLY CHILDHOOD CARE AND DEVELOPMENT\nSERVICES NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nLEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n400311319\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to lead in the effective dissemination and\ndiscussion of ideas, information, and issues in the\nworkplace. This includes preparation of written\ncommunication materials.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Communicate\ninformation about\nworkplace\nprocesses\n1.1 Relevant\ncommunication\nmethod is selected\nbased on\nworkplace\nprocedures\n1.2 Multiple operations\ninvolving several\ntopics/areas are\ncommunicated\nfollowing enterprise\nrequirements\n1.3 Questioning is\napplied to gain\nextra information\n1.4 Relevant sources of\ninformation are\nidentified in\naccordance with\nworkplace/ client\nrequirements\n1.5 Information is\nselected and\norganized following\nenterprise\nprocedures\n1.6 Verbal and written\nreporting is\n1.1. Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n1.2. Effective verbal\ncommunication\nmethods\n1.3. Business writing\n1.4. Workplace\netiquette\n1.1 Organizing\ninformation\n1.2 Conveying\nintended\nmeaning\n1.3 Participating in a\nvariety of\nworkplace\ndiscussions\n1.4 Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n1.5 Effective\nbusiness writing\n1.6 Effective\nclarifying and\nprobing skills\n1.7 Effective\nquestioning\ntechniques\n(clarifying and\nprobing)\n\n--- PDF PAGE 8 ---\n4\nTR- Early Childhood Care and Development Services NC III\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nundertaken when\nrequired\n1.7 Communication and\nnegotiation skills\nare applied and\nmaintained in all\nrelevant situations\n2. Lead workplace\ndiscussions\n2.1 Response to\nworkplace issues\nare sought\nfollowing enterprise\nprocedures\n2.2 Response to\nworkplace issues\nare provided\nimmediately\n2.3 Constructive\ncontributions are\nmade to workplace\ndiscussions on\nsuch issues as\nproduction, quality\nand safety\n2.4 Goals/ objectives\nand action plans\nundertaken in the\nworkplace are\ncommunicated\npromptly\n2.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n2.2 Effective verbal\ncommunication\nmethods\n2.3 Workplace\netiquette\n2.1 Organizing\ninformation\n2.2 Conveying\nintended\nmeaning\n2.3 Participating in\nvariety of\nworkplace\ndiscussions\n2.4 Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n2.5 Effective\nclarifying and\nprobing skills\n3. Identify and\ncommunicate\nissues arising in\nthe workplace\n3.1 Issues and\nproblems are\nidentified as they\narise\n3.2 Information\nregarding problems\nand issues are\norganized\ncoherently to\nensure clear and\neffective\ncommunication\n3.3 Dialogue is initiated\nwith appropriate\npersonnel\n3.4 Communication\nproblems and\nissues are raised\nas they arise\n3.5 Identify barriers in\n3.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n3.2 Effective verbal\ncommunication\nmethods\n3.3 Workplace\netiquette\n3.4 Communication\nproblems and\nissues\n3.5 Barriers in\ncommunication\n3.1 Organizing\ninformation\n3.2 Conveying\nintended meaning\n3.3 Participating in a\nvariety of\nworkplace\ndiscussions\n3.4 Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n3.5 Effective\nclarifying and\nprobing skills\n3.6 Identifying issues\n\n--- PDF PAGE 9 ---\n5\nTR- Early Childhood Care and Development Services NC III\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ncommunication to\nbe addressed\nappropriately\n3.7 Negotiation and\ncommunication\nskills\n\n--- PDF PAGE 10 ---\n6\nTR- Early Childhood Care and Development Services NC III\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\nMay include:\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face-to-face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n2. Workplace discussions\nMay include:\n2.1. Coordination meetings\n2.2. Toolbox discussion\n2.3. Peer-to-peer discussion\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Dealt with a range of communication/information at one\ntime\n1.2 Demonstrated leadership skills in workplace\ncommunication\n1.3 Made constructive contributions in workplace issues\n1.4 Sought workplace issues effectively\n1.5 Responded to workplace issues promptly\n1.6 Presented information clearly and effectively written form\n1.7 Used appropriate sources of information\n1.8 Asked appropriate questions\n1.9 Provided accurate information\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Variety of Information\n2.2 Communication tools\n2.3 Simulated workplace\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\nCase problem\n3.1.\nThird-party report\n3.2.\nPortfolio\n3.3.\nInterview\n3.4.\nDemonstration/Role-playing\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed in the workplace or in a\nsimulated workplace environment\n\n--- PDF PAGE 11 ---\n7\nTR- Early Childhood Care and Development Services NC III\nUNIT OF COMPETENCY\n:\nLEAD SMALL TEAMS\n\nUNIT CODE\n:\n400311320\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nto lead small teams including setting, maintaining\nand monitoring team and individual performance\nstandards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Work requirements\nare identified and\npresented to team\nmembers based on\ncompany policies\nand procedures\n1.2 Reasons for\ninstructions and\nrequirements are\ncommunicated to\nteam members\nbased on company\npolicies and\nprocedures\n1.3 Team members’\nand leaders’\nconcerns are\nrecognized,\ndiscussed and\ndealt with based on\ncompany practices\n1.1 Facilitation of\nTeam work\n1.2 Company\npolicies and\nprocedures\nrelating to work\nperformance\n1.3 Performance\nstandards and\nexpectations\n1.4 Monitoring\nindividual’s and\nteam’s\nperformance vis\na vis client’s\nand group’s\nexpectations\n1.1 Communication\nskills required\nfor leading\nteams\n1.2 Group\nfacilitation\nskills\n1.3 Negotiating\nskills\n1.4 Setting\nperformance\nexpectation\n2. Assign\nresponsibilities\n2.1. Responsibilities\nare allocated\nhaving regard to\nthe skills,\nknowledge and\naptitude required to\nundertake the\nassigned task\nbased on company\npolicies.\n2.2. Duties are\nallocated having\nregard to individual\npreference,\ndomestic and\npersonal\nconsiderations,\nwhenever possible\n2.1 Work plan and\nprocedures\n2.2 Work\nrequirements\nand targets\n2.2 Individual and\ngroup\nexpectations\nand\nassignments\n\n2.3 Ways to\nimprove group\nleadership and\nmembership\n2.1 Communication\nskills\n2.2 Management\nskills\n2.3 Negotiating\nskills\n2.4 Evaluation\nskills\n2.5 Identifying\nteam\nmember’s\nstrengths and\nrooms for\nimprovement\n\n--- PDF PAGE 12 ---\n8\nTR- Early Childhood Care and Development Services NC III\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Set performance\nexpectations for\nteam members\n3.1 Performance\nexpectations are\nestablished based\non client needs\n3.2 Performance\nexpectations are\nbased on individual\nteam members\nknowledge, skills\nand aptitude\n3.3 Performance\nexpectations are\ndiscussed and\ndisseminated to\nindividual team\nmembers\n3.1 One’s roles and\nresponsibilities\nin the team\n3.2 Feedback\ngiving and\nreceiving\n3.3 Performance\nexpectation\n\n3.1 Communication\nskills\n3.2 Accurate\nempathy\n3.3 Congruence\n3.4 Unconditional\npositive regard\n3.5 Handling of\nFeedback\n\n4. Supervise team\nperformance\n4.1 Performance is\nmonitored based on\ndefined\nperformance\ncriteria and/or\nassignment\ninstruction\n 4.2 Team members\nare provided with\nfeedback, positive\nsupport and advice\non strategies to\novercome any\ndeficiencies based\non company\npractices\n4.3 Performance issues\nwhich cannot be\nrectified or\naddressed within\nthe team are\nreferred to\nappropriate\npersonnel\naccording to\nemployer policy\n4.4 Team members are\nkept informed of\nany changes in the\npriority allocated to\nassignments or\ntasks which might\nimpact on\n4.1 Performance\nCoaching\n4.2 Performance\nmanagement\n4.3 Performance\nIssues\n\n4.1 Communication\nskills required\nfor leading\nteams\n4.2 Coaching skill\n\n--- PDF PAGE 13 ---\n9\nTR- Early Childhood Care and Development Services NC III\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nclient/customer\nneeds and\nsatisfaction\n4.5 Team operations\nare monitored to\nensure that\nemployer/client\nneeds and\nrequirements are\nmet\n4.6 Follow-up\ncommunication is\nprovided on all\nissues affecting\nthe team\n 4.7 All relevant\ndocumentation is\ncompleted in\naccordance with\ncompany\nprocedures\n5. Set performance\nexpectations for team\nmembers\n5.1 Performance\nexpectations are\nestablished based\non client needs\n5.2 Performance\nexpectations are\nbased on individual\nteam members\nknowledge, skills\nand aptitude\n5.3 Performance\nexpectations are\ndiscussed and\ndisseminated to\nindividual team\nmembers\n5.1 One’s roles and\nresponsibilities\nin the team\n5.2 Feedback\ngiving and\nreceiving\n5.3 Performance\nexpectation\n\n5.1 Communication\nskills\n5.2 Accurate\nempathy\n5.3 Congruence\n5.4 Unconditional\npositive regard\n5.5 Handling of\nFeedback\n\n6. Supervise team\nperformance\n6.1 Performance is\nmonitored based on\ndefined\nperformance\ncriteria and/or\nassignment\ninstruction\n 6.2 Team members\nare provided with\nfeedback, positive\nsupport and advice\non strategies to\n6.1 Performance\nCoaching\n6.2 Performance\nmanagement\n6.3 Performance\nIssues\n\n6.1 Communication\nskills required\nfor leading\nteams\n6.2 Coaching skill\n\n--- PDF PAGE 14 ---\n10\nTR- Early Childhood Care and Development Services NC III\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\novercome any\ndeficiencies based\non company\npractices\n6.3 Performance issues\nwhich cannot be\nrectified or\naddressed within\nthe team are\nreferred to\nappropriate\npersonnel\naccording to\nemployer policy\n6.4 Team members are\nkept informed of\nany changes in the\npriority allocated to\nassignments or\ntasks which might\nimpact on\nclient/customer\nneeds and\nsatisfaction\n6.5 Team operations\nare monitored to\nensure that\nemployer/client\nneeds and\nrequirements are\nmet\n6.6 Follow-up\ncommunication is\nprovided on all\nissues affecting\nthe team\n 6.7 All relevant\ndocumentation is\ncompleted in\naccordance with\ncompany\nprocedures\n\n--- PDF PAGE 15 ---\n11\nTR- Early Childhood Care and Development Services NC III\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\nWork requirements may include:\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s\nconcerns\nTeam member’s concerns may include:\n2.1. Roster/shift details\n3. Monitor performance\nMonitor performance may include:\n3.1. Formal process\n3.2. Informal process\n4. Feedback\nFeedback may include:\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\nPerformance issues may include:\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 16 ---\n12\nTR- Early Childhood Care and Development Services NC III\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs\nof the tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Written Examination\n3.2. Oral Questioning\n3.3. Portfolio\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 17 ---\n13\nTR- Early Childhood Care and Development Services NC III\nUNIT OF COMPETENCY\n:\nAPPLY CRITICAL THINKING AND PROBLEM-\nSOLVING TECHNIQUES IN THE WORKPLACE\n\nUNIT CODE\n:\n400311321\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace\nincluding the application of problem solving\ntechniques and to determine and resolve the root\ncause/s of specific problems in the workplace.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Examine specific\nworkplace\nchallenges.\n1.1 Variances are\nexamined from\nnormal operating\nparameters; and\nproduct quality.\n1.2 Extent, cause and\nnature of the\nspecific problem\nare defined through\nobservation,\ninvestigation and\nanalytical\ntechniques.\n1.3 Problems are\nclearly stated and\nspecified.\n1.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard\nsituations.\n1.2 Competence to\ninclude the ability\nto apply and\nexplain, enough\nfor the\nidentification of\nfundamental\ncauses of\nspecific\nworkplace\nchallenges.\n1.3 Relevant\nequipment and\noperational\nprocesses.\n1.4 Enterprise goals,\ntargets and\nmeasures.\n1.5 Enterprise\nquality OHS and\nenvironmental\nrequirement.\n1.6 Enterprise\ninformation\n1.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in the\nworkplace.\n1.2 Identifying extent\nand causes of\nspecific\nchallenges in the\nworkplace.\n\n--- PDF PAGE 18 ---\n14\nTR- Early Childhood Care and Development Services NC III\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nsystems and\ndata collation\n1.7 Industry codes\nand standards.\n2. Analyze the\ncauses of specific\nworkplace\nchallenges.\n2.1 Possible causes of\nspecific problems\nare identified\nbased on\nexperience and the\nuse of problem\nsolving tools /\nanalytical\ntechniques.\n2.2 Possible cause\nstatements are\ndeveloped based\non findings.\n2.3 Fundamental\ncauses are\nidentified per\nresults of\ninvestigation\nconducted.\n2.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard\nsituations.\n2.2 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the\nidentification of\nfundamental\ncause,\ndetermining the\ncorrective action\nand provision of\nrecommendation\ns.\n2.3 Relevant\nequipment and\noperational\nprocesses.\n2.4 Enterprise goals,\ntargets and\nmeasures.\n2.5 Enterprise\nquality OSH and\nenvironmental\nrequirement.\n2.6 Enterprise\ninformation\nsystems and\ndata collation.\n2.7 Industry codes\nand standards.\n2.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in the\nworkplace.\n2.2 Identifying extent\nand causes of\nspecific\nchallenges in the\nworkplace.\n2.3 Providing clear-\ncut findings on\nthe nature of\neach identified\nworkplace\nchallenges.\n3. Formulate\nresolutions to\n3.1 All possible options\nare considered for\n3.1 Competence to\ninclude the ability\nto apply and\n3.1 Using range of\nanalytical\ntechniques (e.g.,\n\n--- PDF PAGE 19 ---\n15\nTR- Early Childhood Care and Development Services NC III\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nspecific workplace\nchallenges.\nresolution of the\nproblem.\n3.2 Strengths and\nweaknesses of\npossible options\nare considered.\n3.3 Corrective actions\nare determined to\nresolve the\nproblem and\npossible future\ncauses.\n3.4 Action plans are\ndeveloped\nidentifying\nmeasurable\nobjectives,\nresource needs\nand timelines in\naccordance with\nsafety and\noperating\nprocedures\nexplain, sufficient\nfor the\nidentification of\nfundamental\ncause,\ndetermining the\ncorrective action\nand provision of\nrecommendation\ns\n3.2Relevant\nequipment and\noperational\nprocesses\n3.3 Enterprise goals,\ntargets and\nmeasures\n3.4 Enterprise quality\nOSH and\nenvironmental\nrequirement\n3.5 Principles of\ndecision making\nstrategies and\ntechniques\n3.6 Enterprise\ninformation\nsystems and\ndata collation\n3.7 Industry codes\nand standards\nplanning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in the\nworkplace.\n3.2 Identifying extent\nand causes of\nspecific\nchallenges in the\nworkplace.\n3.3 Providing clear-\ncut findings on\nthe nature of\neach identified\nworkplace\nchallenges.\n2.4 Devising,\ncommunicating,\nimplementing\nand evaluating\nstrategies and\ntechniques in\naddressing\nspecific\nworkplace\nchallenges.\n4. Implement action\nplans and\ncommunicate\nresults.\n4.1 Action plans are\nimplemented and\nevaluated.\n4.2 Results of plan\nimplementation and\nrecommendations\nare prepared.\n4.2 Recommendations\nare presented to\nappropriate\npersonnel.\n4.3 Recommendations\nare followed-up, if\nrequired.\n4.1 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the\nidentification of\nfundamental\ncause,\ndetermining the\ncorrective action\nand provision of\nrecommendation\ns\n4.2. Relevant\nequipment and\noperational\nprocesses\n4.1 Using range of\nanalytical\ntechniques\n(e.g., planning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in\nthe workplace.\n4.2 Identifying\nextent and\ncauses of\nspecific\n\n--- PDF PAGE 20 ---\n16\nTR- Early Childhood Care and Development Services NC III\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.3 Enterprise goals,\ntargets and\nmeasures\n4.4 Enterprise\nquality, OSH and\nenvironmental\nrequirement\n4.5 Principles of\ndecision making\nstrategies and\ntechniques\n4.6 Enterprise\ninformation\nsystems and\ndata collation\n4.7 Industry codes\nand standards\nchallenges in\nthe workplace.\n4.3 Providing clear-\ncut findings on\nthe nature of\neach identified\nworkplace\nchallenges.\n4.4 Devising,\ncommunicating,\nimplementing\nand evaluating\nstrategies and\ntechniques in\naddressing\nspecific\nworkplace\nchallenges.\n\n--- PDF PAGE 21 ---\n17\nTR- Early Childhood Care and Development Services NC III\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Parameters\nParameters may include:\n1.1 Processes\n1.2 Procedures\n1.3 Systems\n2. Analytical techniques\nAnalytical techniques may include:\n2.1.\nBrainstorming\n2.2.\nIntuitions/Logic\n2.3.\nCause and effect diagrams\n2.4.\nPareto analysis\n2.5.\nSWOT analysis\n2.6.\nGant chart, Pert CPM and graphs\n2.7.\nScattergrams\n3. Problem\nProblem may include:\n3.1. Routine, non – routine and complex workplace and\nquality problems\n3.2.\nEquipment selection, availability and failure\n3.3.\nTeamwork and work allocation problem\n3.4.\nSafety and emergency situations and incidents\n3.5.\nRisk assessment and management\n4. Action plans\nAction plans may include:\n4.1.\nPriority requirements\n4.2.\nMeasurable objectives\n4.3.\nResource requirements\n4.4.\nTimelines\n4.5.\nCo-ordination and feedback requirements\n4.6.\nSafety requirements\n4.7.\nRisk assessment\n4.8.\nEnvironmental requirements\n\n--- PDF PAGE 22 ---\n18\nTR- Early Childhood Care and Development Services NC III\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Examined specific workplace challenges.\n1.2. Analyzed the causes of specific workplace challenges.\n1.3. Formulated resolutions to specific workplace challenges.\n1.4. Implemented action plans and communicated results on\nspecific workplace challenges.\n2. Resource\nImplications\n2.1. Assessment will require access to an operating plant over\nan extended period of time, or a suitable method of\ngathering evidence of operating ability over a range of\nsituations. A bank of scenarios / case studies / what ifs will\nbe required as well as bank of questions which will be used\nto probe the reason behind the observable action.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation\n3.2. Case Formulation\n3.3. Life Narrative Inquiry\n3.4. Standardized test\n\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units\nof competency. Assessment will occur over a range of\nsituations, which will include disruptions to normal, smooth\noperation. Simulation may be required to allow for timely\nassessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include walk\nthrough of the relevant competency components.\n\nThese assessment activities should include a range of\nproblems, including new, unusual and improbable situations that\nmay have happened.\n4. Context for\nAssessment\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 23 ---\n19\nTR- Early Childhood Care and Development Services NC III\nUNIT OF COMPETENCY\n:\nWORK IN A DIVERSE ENVIRONMENT\n\nUNIT CODE\n:\n400311322\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to work\neffectively in a workplace characterized by diversity\nin terms of religions, beliefs, races, ethnicities and\nother differences.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop an\nindividual’s\ncultural awareness\nand sensitivity\n1.1Individual differences\nwith clients,\ncustomers and\nfellow workers are\nrecognized and\nrespected in\naccordance with\nenterprise policies\nand core values.\n1.2 Differences are\nresponded to in a\nsensitive and\nconsiderate manner\n1.3 Diversity is\naccommodated\nusing appropriate\nverbal and non-\nverbal\ncommunication.\n1.1 Understanding\ncultural diversity in\nthe workplace\n1.2Norms of behavior\nfor interacting and\ndialogue with\nspecific groups\n(e. g., Muslims\nand other non-\nChristians, non-\nCatholics,\ntribes/ethnic\