ts of handbook \n7.4 Feedback form \n7.5 Preparedness and response plans \n8. Organized parent \norientation \nOrganized parent orientation may include: \n8.1 Announcement to parents \n8.2 Preparation of registration materials \n8.3 Set-up of orientation venue \n9. Records \nRecords may include: \n9.1 Child Intake Form \n9.2 ECCD Checklist \n9.3 Attendance \n9.4 Pictures \n9.5 Children Logs \n9.6 Activity Plan\n\n--- PDF PAGE 92 ---\n88 \nTR- Early Childhood Care and Development Services NC III \nEVIDENCE GUIDE \n1. Critical Aspect of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Gathered information \n     1.1.1 Conducted family profiling \n1.1.2 Performed community mapping \n1.1.3 Conducted record keeping \n1.2 Conducted awareness-raising activity \n1.2.1 Disseminated information \n1.3 Managed enrollment \n1.3.1 Guided parents on enrollment procedures \n1.3.2 Filed submitted requirements  \n1.3.3 Recorded data of submitted requirements \n1.3.4 Secured documents \n1.4 Prepared Center \n1.4.1 Assessed furniture, fixtures, equipment and \nlocally available materials \n1.4.2 Coordinated compliance issues on current \nstandards with LGU officials \n1.4.3 Designed classroom \n1.4.4 Organized furniture, fixtures equipment and \nlocally available materials \n1.4.5 Established feedback mechanism for \nparents/parent-substitute \n1.5 Conducted parent orientation \n1.5.1 Prepared orientation materials \n1.5.2 Presents policies and guidelines from the \nParent’s Handbook \n1.6 Performed activities for the recognition of the \ncenter \n1.6.1 Prepared records \n1.6.2 Maintained center \n1.6.3 Performed inventory \n1.6.4 Prepared annual report \n1.6.5 Secured documents \n2. Resource Implications \nThe following resources should be provided: \n2.1 Simulated workplace \n2.2 Forms \n2.2 Records \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration with Oral questioning \n3.2 Work-related Project (Written) \n4. Context for Assessment \n4.1 Competency may be assessed in actual \nworkplace or at the designated TESDA \nAccredited Assessment Center in a simulated \nworkplace setting.\n",
