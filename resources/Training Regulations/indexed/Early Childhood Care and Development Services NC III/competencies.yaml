point or \nGoogle Suite \nequivalent, \nGoogle \nForms, Basic \nvideo editing \namong others \n● Networking \nusing social \nmedia \nplatform \n \nENVIRONMENT \nAND OTHER \nRELATED LAWS  \n● Awareness on \nRepublic Act \nNo. 7610 \nentitled an Act\n\n--- PDF PAGE 123 ---\n119 \nTR- Early Childhood Care and Development Services NC III \nProviding for \nStronger \nDeterrence \nand Special \nProtection \nAgainst Child \nAbuse, \nExploitation \nand \nDiscrimination\n, and for other \npurposes. \n● Awareness on \nRepublic Act \nNo. 10410 \nentitled An Act \nRecognizing \nthe Age from \nZero (0) to \nEight (8) \nYears as the \nFirst Crucial \nStage of \nEducational \nDevelopment \nand \nStrengthening \nthe Early \nChildhood \nCare and \nDevelopment \nSystem, \nAppropriating \nFund Therefor \nand for other \npurposes. \n● Awareness on \nRepublic Act \nNo. 11148 \nentitled An Act \nScaling up the \nNational and \nLocal Health \nand Nutrition \nPrograms \nThrough \nStrengthened \nIntegrated \nStrategy for\n\n--- PDF PAGE 124 ---\n120 \nTR- Early Childhood Care and Development Services NC III \nMaternal, \nNeonatal, \nChild Health \nand Nutrition \nin the First \nOne \nThousand \n(1,000) Days \nof Life, \nAppropriating \nFunds \nTherefore and \nfor other \npurposes. \n● Awareness on \nRepublic Act \nNo. 11908 \nentitled An Act \nMandating the \nEstablishment \nand \nImplementatio\nn of the \nParent \nEffectiveness \nService \nProgram to \nStrengthen \nParental \nInvolvement in \ntheir \nChildren’s \nDevelopment \nand Learning \nand \nAppropriating \nFunds \nTherefor. \n● Awareness on \nRepublic Act \nNo. 10121 \nalso known as \nthe Philippine \nDisaster Risk \nReduction and \nManagement \nAct of 2010 \n● Awareness of \nenvironmental\n\n--- PDF PAGE 125 ---\n121 \nTR- Early Childhood Care and Development Services NC III \nissues and \nsustainable \ndevelopment \n● R.A. 10821 \nComprehensiv\ne Emergency \nPlan for \nChildren \n● UN \nConvention on \nthe Rights of \nthe Child \n