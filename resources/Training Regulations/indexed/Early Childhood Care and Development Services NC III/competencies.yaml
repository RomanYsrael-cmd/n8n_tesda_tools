        "source_text": "--- PDF PAGE 49 ---\n45 \nTR- Early Childhood Care and Development Services NC III \nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY : MAINTAIN AN EFFECTIVE RELATIONSHIP WITH \nCLIENT/CUSTOMER \n  \n    \nUNIT CODE \n: SOC514201 \n  \n    \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \nrequired in building and maintaining effective \nrelationship with client/customers. \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. \nMaintain \na \nprofessional   \nimage \n  \n  \n  \n  \n1.1Uniform \nand \npersonal \ngrooming \nmaintained \n1.2Personal \npresence \nmaintained \naccording \nto \nemployer \nstandards \n1.3     Visible work area \nkept \ntidy \nand \nuncluttered \n1.4 Equipment stored \naccording \nto \nassignment \nrequirements \n1.1   Stance \n1.2   Posture \n1.3   Grooming \n1.4   Standing Orders \n1.5 Company Policy \nand Procedures \n1.6  Role of a massage \npractitioner in the \nPhilippine \nhealthcare \nservices \n1.1Maintaining \nuniform \nand \npersonal \ngrooming \nin \naccordance with \nestablished \npolicies \nand \nprocedures \n1.2 \nMaintaining \nstance, posture, \nbody \nlanguage, \nand \nother \npersonal \npresence \nin \naccording \nto \nrequired \nstandards \n1.3 Keeping visible \nwork area tidy \nand uncluttered \n1.4 \nStoring \nequipment \naccording \nto \nassignment \nrequirements\n\n--- PDF PAGE 50 ---\n46 \nTR- Early Childhood Care and Development Services NC III \n2. \nMeet \nclient \nrequirements \n2.1Client \nrequirements \nidentified \nand \nunderstood \nby \nreferral \nto \nthe \nassignment \ninstructions \n2.2Client requirements \nmet according to \nthe \nassignment \ninstructions \n2.3 \nChanges \nto \nclient’s \nneeds \nand \nrequirements \nmonitored \nand \nappropriate \naction taken \n2.4   All communication \nwith the client or \ncustomer is clear \nand complies with \nassignment \nrequirements \n2.1 \nAssignment \ninstructions \n2.2      Post orders \n2.3 \nReviewing \nassignment \ninstructions \n2.4      Discussion \ntechniques \nwith \nclient/customer \n2.5      Implementing \nrequired \nchanges \n2.6      Referral to \nappropriate \nemployer/pers\nonnel \n2.7      Clarification of \nclient \nneeds \nand \ninstructions \n2.1 \nIdentifying \nassignment \ninstructions \nand \npost \norders \naccording to \nstandard \nprocedures \n2.2 \nAccomplishi\nng scope to \nmodify \ninstructions/\norders in the \nlight \nof \nchanged \nsituations \n2.3 \n \nMeeting \nclient \nrequirement\ns according \nto \nthe \nassignment \ninstructions \n2.4  Monitoring \nand \nappropriatin\ng action is \ntaken \nin \nchanges \nto \nclient’s \nneeds \nand \nrequirement\ns \n2.5  Clearing and \ncomplying \nwith \nassignment \nrequirement\ns \nof \nall \ncommunicati\nons with the \nclient \nor \ncustomer\n\n--- PDF PAGE 51 ---\n47 \nTR- Early Childhood Care and Development Services NC III \n3. Build \ncredibility \nwith clients \n3.1 \nClient \nexpectations \nfor \nreliability, \npunctuality \nand \nappearance \nadhered to \n3.2    Possible causes \nof \nclient \ndissatisfaction \nidentified, \ndealt \nwith and recorded \naccording \nto \nemployer policy \n3.3    Client fully \ninformed \nof \nall \nrelevant security \nmatters in a timely \nmanner \nand \naccording \nto \nagreed reporting \nprocedures \n3.1  Interpersonal skills \n3.2    Customer service \nskills \n3.3Telephone \netiquette \n3.4 \nMaintaining \nrecords \n3.1 \nAdhering \nto\nclient \nexpectations for\nreliability, \npunctuality and\nappearance \n3.2 \nIdentifying,\nattending \nand\nrecording \npossible causes\nof \nclient/customer \ndissatisfaction \naccording \nto\nemployer policy \n3.3  Informing client\nof all relevant\nsecurity matters\nin \na \ntimely\nmanner \nand\naccording \nto\nagreed reporting\nprocedures \n4. Establish \nprofessional \nrelationship \nwith the client \n4.1Establish \nrelationship within \nappropriate \nprofessional \nboundaries \n4.2 Build trust and \nrespect \nthrough \nuse of effective \ncommunication \ntechniques \n4.3 \nIdentify \nand \nrespond to client \nspecial needs \n4.4    Communicate in \nways that take \naccount \nof \ncultural \nconsiderations \n4.5 \nExercise \ndiscretion \nand \nconfidentiality \n4.1    Types of client \n4.2 Main components \nof \nclient \nrelationship \n4.3Relative \nintelligence \n4.4  Effect on customer \nsatisfaction \n4.5 \nBenefits \nof \ncustomer \nrelationship \nmanagement \n4.6    Improving client \nrelationship \nmanagement \n4.7 \nOccupational \nhealth and safety \n4.1  Demonstrating \nthe \nability \nto \nestablish \nprofessional \nrelationship \nwith client \n4.2  Demonstrating \nthe \nability \nof \ngenuine \nconcern for the \nwelfare of the \nclients \n4.3  Demonstrating \nthe \nability \nrequired \nin \nhandling clients \n4.4  Demonstrating \nthe \nability \nrequired \nin \nrendering client \nservice skills\n\n--- PDF PAGE 52 ---\n48 \nTR- Early Childhood Care and Development Services NC III \n5. Manage \nclient \ninteractions \n5.1 \nUse \na \ncollaborative \nand \nperson-\ncentered \napproach when \nworking \nwith \nclients \n5.2 Use motivational \ninterviewing as \na basis for client \ninteractions \n5.3 \nSeek \nclient \ninformation \nrespectfully and \nsensitively, \nusing \npurposeful, \nsystematic and \ndiplomatic \nquestions \n5.4  Support the \nclient to identify \nand \narticulate \nkey information \nthat \nsupports \nthe provision of \nservice \n5.5 \nEncourage \nclients to voice \nqueries \nor \nconcerns \nand \naddress \nthese \nappropriately \n5.6  Respond to \ndifficult \nor \nchallenging \nbehavior using \nestablished \ntechniques \n5.7 \nMaintain \nprofessional \nintegrity \nand \nboundaries at all \ntimes \n5.1    Manage client \ninteractions \n5.2    Causes of \nclient/customer \ndissatisfaction \n5.3    Assignment \nInstructions \n5.4    Reporting \nprocedures \n  \n5.1  Demonstrating \nability to do \nattention \nto \ndetail \nwhen \ncompleting \nclient/employ\ner \ndocumentatio\nn \n5.2  Demonstrating \nthe ability to \ndo \ninterpersonal \nand \ncommunicatio\nn \nskills \nrequired \nin \nclient contact \nassignments \n5.3  Demonstrating \nability to do \ncustomer \nservice skills \nrequired \nto \nmeet \nclient/custom\ner needs\n\n--- PDF PAGE 53 ---\n49 \nTR- Early Childhood Care and Development Services NC III \n5.8     Work within \nscope of role \nand identify and \nrespond \nto \nsituations where \ninteractions \nsuggest \nthe \nneed for client \nreferral \n5. Provide \neffective \nresponses \nto \nclient \nenquiries \n6.1    Select the most \nappropriate \nmode \nof \ncommunicatio\nn \nfor \nthe \ninformation \nbeing \nprovided \n6.2    Use language \nand \nterminology \nthat the client \nwill \nunderstand \n6.3 \n \n \n \nPresent \ninformation \nclearly \nand \nwith sufficient \ndetail to meet \nclient needs \n6.4    Confirm with \nclient that the \ninformation \nhas \nbeen \nunderstood \nand address \nany \nunresolved \nissues \n6.1 Common \nindustry \nand \ncompany \nservices, \nproblems \nand \nsolutions \n6.2 Legal and ethical \ncompany \nand \nindustry aspects \n6.3 Client \nmotivations and \nexpectations \n6.4 Effective \ncommunication \ntechniques \n6.5 Industry \nethics \nand practices \n6.6 Detailed product \nand \nservice \nknowledge \n6.1Using \ncommunicatio\nn skills \n6.2    Using language \nskills \n6.3    Using numeracy \nskills \n6.4  Using technology \nskills \n6.5 \n \nRelating \nto \npeople from a \nrange \nof \nsociety, \ncultural \nand \nethnic \nbackgrounds\n\n--- PDF PAGE 54 ---\n50 \nTR- Early Childhood Care and Development Services NC III \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Personal Presence \n  \nMay include: \n1.1    Stance \n1.2    Posture \n1.3    Body Language \n1.4    Demeanor \n           1.5  Grooming \n2.    Employer \nStandards \nMay include: \n2.1     Standing Orders \n2.2     Efficiency \n2.3     Client turn-around time \n3.   Client \nRequirements \nMay include: \n3.1   Assignment instructions (e.g. right products) \n3.2   Post Orders \n      3.3   Scope to modify instructions/orders in light \nof changed situations \n        4.    \nAssignment \n               Instructions \nMay include: \n4.1      Writing \n4.2      Verbally \n4.3      Electronically \n5.   Client’s Needs and \nRequirements \nMay include: \n5.1     Review of the client brief and/or assignment \ninstructions \n5.2     Discussion with the client/customer \n6.   \nAppropriate \nAction \nMay include: \n6.1     Implementing required changes \n6.2   Referral to appropriate employer \npersonnel \n6.3   Clarification of client needs and \ninstructions \n7.    Clients \nMay include: \n7.1 \nAll members of the public\n\n--- PDF PAGE 55 ---\n51 \nTR- Early Childhood Care and Development Services NC III \nEVIDENCE GUIDE \n  \n1.   Critical \nAspects of \nCompetency \n  \nAssessment requires evidence that the candidate: \n1.1    Maintained a professional image. \n1.2 \nInterpreted \nclient \nrequirements \nfrom \ninformation contained in the client brief \nand/or assignment instructions. \n1.3    Dealt successfully with a variety of client \ninteractions. \n1.4    Monitored and acted on varying client or \ncustomer needs. \n1.5     Met client requirements. \n1.6    Built credibility with customers/clients. \n2.  Resource \nImplications \n  \nThe following resources should be provided: \n2.1       Assessment centers/venues \n2.2       Accredited assessors \n2.3       Evaluation reports \n2.4       Access to a relevant venue, equipment  \nand materials \n2.5       Assignment instructions \n2.6       Logbooks \n2.7 \nOperational \nmanuals \nand \nmakers’/customers’ \ninstructions \n(if \nrelevant) \n2.8    Assessment Instruments, including \npersonal planner and assessment record \nbook \n3.  Methods of \nAssessment \n  \nCompetency in this unit may be assessed through: \n3.1       Written Test/Examination \n3.2       Demonstration with questioning \n3.3     Observation \n4.  Context of \nAssessment \n  \n4.1   Competency may be assessed in actual \nworkplace or at the designated TESDA \nAccredited Assessment Center\n",
