termining\nperformance\nstandards\n2.3\nInterpreting\nwork\nstandards\n2.4 Quality of\nwork\n2.1\nMonitoring\npersonal\nperformance\ncontinually\nagainst\nagreed\nperformance\nstandards\n2.2\nSeeking\nadvice\nand\nguidance\nwhen\nnecessary to\nachieve\nor\nmaintain\nagreed\nstandards\n2.3\nApplying\nguidance\nfrom\nmanagement\nto achieve or\nmaintain\nagreed\nstandards\n2.4 Clarifying and\nagreeing\non\nstandard\nof\nwork\naccording to\nemployer\npolicy\nand\nprocedures\n\n--- PDF PAGE 58 ---\n54\nTR- Early Childhood Care and Development Services NC III\n3.Build\ncredibility\nwith\ncustomers/\nclients\n3.1 Client expectations\nfor\nreliability,\npunctuality\nand\nappearance\nadhered to\n3.2 Possible causes\nof client/customer\ndissatisfaction\nidentified,\ndealt\nwith\nrecorded\naccording\nto\nemployer policy\n3.3 Client fully\ninformed\nof\nall\nrelevant\nsecurity\nmatters in a timely\nmanner\n\n3.1 Interpersonal\nskills\n3.2\nCustomer\nservice skills\n3.3\nTelephone\netiquette\n3.4 Maintaining\nrecords\n3.1 Adhering to\nclient\nexpectations\nfor reliability,\npunctuality\nand\nappearance\n3.2\nIdentifying,\nattending\nwith\nand\nrecording\npossible\ncauses\nof\nclient/custom\ner\ndissatisfactio\nn according\nto employer\npolicy\n3.3\nInforming\nclient of all\nrelevant\nsecurity\nmatters in a\ntimely\nmanner and\naccording to\nagreed\nreporting\nprocedures\n\n--- PDF PAGE 59 ---\n55\nTR- Early Childhood Care and Development Services NC III\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\n\n1.1 May be identified through:\n1.1.1 Assignment Instructions\n1.1.2\nVerbal\nInstructions\nby\nSenior\nStaff/household members\n1.1.3 Policy Documents\n1.1.4 Duty Statements\n1.1.5 Self-Assessment\n1.2 May be:\n1.2.1 Daily tasks\n1.2.2 Weekly tasks\n1.2.3 Regularly or irregularly occurring tasks\n2. Performance\nStandards\nMay include:\n2.1 Assignment Instructions\n2.2 Procedures established in policy documents\n\n--- PDF PAGE 60 ---\n56\nTR- Early Childhood Care and Developmen