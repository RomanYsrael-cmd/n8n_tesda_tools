anizational\nprocedures,\nprocesses and\nsystems through\ninnovation.\n\n--- PDF PAGE 28 ---\n24\nTR- Early Childhood Care and Development Services NC III\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Generate practical\naction plans for\nimproving work\nprocedures,\nprocesses.\n2.1 Ideas for innovative\nwork procedure to\nfoster innovation\nusing individual and\ngroup techniques\nare conceptualized\n2.2 Range of ideas with\nother team\nmembers and\ncolleagues are\nevaluated and\ndiscussed\n2.3 Work procedures\nand processes\nsubject to change\nare selected based\non workplace\nrequirements\n(feasible and\ninnovative).\n2.4 Practical action\nplans are proposed\nto facilitate simple\nchanges in the\nwork procedures,\nprocesses and\nsystems.\n2.5 Critical inquiry is\napplied and used to\nfacilitate discourse\non adjustments in\nthe simple work\nprocedures,\nprocesses and\nsystems.\n2.1 Seven habits of\nhighly effective\npeople.\n2.2 Character\nstrengths that\nfoster innovation\nand learning\n(Christopher\nPeterson and\nMartin Seligman,\n2004)\n2.3 Five minds of the\nfuture concepts\n(Gardner, 2007).\n2.4 Adaptation\nconcepts in\nneuroscience\n(Merzenich,\n2013).\n2.5 Transtheoretical\nmodel of\nbehavior change\n(Prochaska,\nDiClemente, &\nNorcross, 1992).\n2.1 Assessing\nreadiness for\nchange on simple\nwork procedures,\nprocesses and\nsystems.\n2.2 Generating\ninsights on how\nto improve\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation.\n2.3 Facilitating action\nplans on how to\napply innovative\nprocedures in the\norganization.\n\n--- PDF PAGE 29 ---\n25\nTR- Early Childhood Care and Development Services NC III\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Evaluate the\neffectiveness of\nthe proposed\naction plans.\n3.1 Work structure is\nanalyzed to\nidentify the impact\nof the new work\nprocedures\n3.2 Co-workers/key\npersonnel is\nconsulted to know\nwho will be\ninvolved with or\naffected by the\nwork procedure\n3.3 Work instruction\noperational plan of\nthe new work\nprocedure is\ndeveloped and\nevaluated.\n3.4 Feedback and\nsuggestion are\nrecorded.\n3.5 Operational plan is\nupdated.\n3.6 Results and\nimpact on the\ndeveloped work\ninstructions are\nreviewed\n3.7 Results of the new\nwork procedure\nare evaluated\n3.8 Adjustments are\nrecommended\nbased on results\ngathered\n3.1 Five minds of the\nfuture concepts\n(Gardner,\n2007).\n3.2 Adaptation\nconcepts in\nneuroscience\n(Merzenich,\n2013).\n3.3\nTranstheoretical\nmodel of\nbehavior\nchange\n(Prochaska,\nDiClemente, &\nNorcross,\n1992).\n3.1 Generating\ninsights on how\nto improve\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation.\n3.2 Facilitating action\nplans on how to\napply innovative\nprocedures in\nthe\norganization.\n3.3 Communicating\nresults of the\nevaluation of the\nproposed and\nimplemented\nchanges in the\nworkplace\nprocedures and\nsystems.\n3.4 Developing action\nplans for\ncontinuous\nimprovement on\nthe basic\nsystems,\nprocesses and\nprocedures in\nthe\norganization.\n\n--- PDF PAGE 30 ---\n26\nTR- Early Childhood Care and Development Services NC III\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Reasons\nMay include:\n1.1 Strengths and weaknesses of the current systems,\nprocesses and procedures.\n1.2 Opportunities and threats of the current systems,\nprocesses and procedures.\n2. Models of innovation\nMay include:\n2.1 Seven habits of highly effective people.\n2.2 Five minds of the future concepts (Gardner, 2007).\n2.3 Neuroplasticity and adaptation strategies.\n3. Gaps or barriers\nMay include:\n3.1 Machine\n3.2 Manpower\n3.3 Methods\n3.4 Money\n4. Critical Inquiry\nMay include:\n4.1\nPreparation.\n4.2\nDiscussion.\n4.3\nClarification of goals.\n4.4\nNegotiate towards a Win-Win outcome.\n4.5\nAgreement.\n4.6\nImplementation of a