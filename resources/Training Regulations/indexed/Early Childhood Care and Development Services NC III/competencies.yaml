        "source_text": "--- PDF PAGE 93 ---\n89 \nTR- Early Childhood Care and Development Services NC III \nUNIT OF \nCOMPETENCY \n: \nCONDUCT ASSESSMENT ON PROGRESS \nAND DEVELOPMENT OF CHILDREN \nUNIT CODE \n: \nSOC234302 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, and \nattitudes required to conduct assessment on \nprogress and development of children. This \ncompetency includes the determination of initial \ndevelopmental \nlevel, \nconduct \ninformal \nassessment, conduct observation of children’s \nhealth, safety and well-being, conduct formal \nassessment, \nand \nmanage \nreporting \nof \nassessment results. \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine \ninitial \ndevelopmen\ntal level \n1.1 Intake interview of \nparents/parent-\nsubstitute is \nconducted \nfollowing industry \npractice. \n1.2 Initial observation \nof children is \nrecorded based on \nindustry practice. \n1.3 Previous record is \nsecured following \nindustry practice. \n1.4 Inferences are \nmade based on \navailable records. \n1.5 Children’s \ndevelopmental \nlevel is identified \nbased on \navailable records. \nSCIENCE  \n● Basic \ntechniques for \nobserving and \ndocumenting \nchildren’s \nbehavior and \ndevelopment. \n● Recognizing \ndevelopmental \nmilestones and \ntypical and \natypical \nbehaviors. \n● Brain \ndevelopment/ \nNeurodevelop\nment \n \nTECHNOLOGY  \n● Utilizing a \nvariety of \nassessment \ntools and \nmethods (e.g., \nchecklists, \nanecdotal \nrecords, \nportfolios). \n1.1 Conducting \nintake \ninterview of \nparents \n1.2 Recording \ninitial \nobservation \nof children \n1.3 Securing \nprevious \nrecord \n1.4 Making \ninferences \n1.5 Identifying \nchildren’s \ndevelopment\nal level\n\n--- PDF PAGE 94 ---\n90 \nTR- Early Childhood Care and Development Services NC III \n● Conducting \nformative \nassessments \nto guide \ninstruction and 