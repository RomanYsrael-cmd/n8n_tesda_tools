ace issues\nare provided\nimmediately\n2.3 Constructive\ncontributions are\nmade to workplace\ndiscussions on\nsuch issues as\nproduction, quality\nand safety\n2.4 Goals/ objectives\nand action plans\nundertaken in the\nworkplace are\ncommunicated\npromptly\n2.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n2.2 Effective verbal\ncommunication\nmethods\n2.3 Workplace\netiquette\n2.1 Organizing\ninformation\n2.2 Conveying\nintended\nmeaning\n2.3 Participating in\nvariety of\nworkplace\ndiscussions\n2.4 Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n2.5 Effective\nclarifying and\nprobing skills\n3. Identify and\ncommunicate\nissues arising in\nthe workplace\n3.1 Issues and\nproblems are\nidentified as they\narise\n3.2 Information\nregarding problems\nand issues are\norganized\ncoherently to\nensure clear and\neffective\ncommunication\n3.3 Dialogue is initiated\nwith appropriate\npersonnel\n3.4 Communication\nproblems and\nissues are raised\nas they arise\n3.5 Identify barriers in\n3.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n3.2 Effective verbal\ncommunication\nmethods\n3.3 Workplace\netiquette\n3.4 Communication\nproblems and\nissues\n3.5 Barriers in\ncommunication\n3.1 Organizing\ninformation\n3.2 Conveying\nintended meaning\n3.3 Participating in a\nvariety of\nworkplace\ndiscussions\n3.4 Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n3.5 Effective\nclarifying and\nprobing skills\n3.6 Identifying issues\n\n--- PDF PAGE 9 ---\n5\nTR- Early Childhood Care and Development Services NC III\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ncommunication to\nbe addressed\nappropriately\n3.7 Negotiation and\ncommunication\nskills\n\n--- PDF PAGE 10 ---\n6\nTR- Early Childhood Care and Development Services NC III\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\nMay include:\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face-to-face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n2. Workplace discussions\nMay include:\n2.1. Coordination meetings\n2.2. Toolbox discussion\n2.3. Peer-to-peer discussion\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Dealt with a range of communication/information at one\ntime\n1.2 Demonstrated leadership skills in workplace\ncommunication\n1.3 Made constructive contributions in workplace issues\n1.4 Sought workplace issues effectively\n1.5 Responded to workplace issues promptly\n1.6 Presented information clearly and effectively written form\n1.7 Used appropriate sources of information\n1.8 Asked appropriate questions\n1.9 Provided accurate information\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Variety of Information\n2.2 Communication tools\n2.3 Simulated workplace\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\nCase problem\n3.1.\nThird-party report\n3.2.\nPortfolio\n3.3.\nInterview\n3.4.\nDemonstration/Role-playing\n4. Context for\nAssessment\n4.1.\nCompetency may be assessed in the workplace or in a\nsimulated workplace environment\n\n--- PDF PAGE 11 ---\n7\nTR- Early Childhood Care and Development Services NC III\nUNIT OF COMPETENCY\n:\nLEAD SMALL TEAMS\n\nUNIT CODE\n:"
