        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined initial developmental level\n1.1.1 Conducted intake interview of\nparents/parent-substitute\n1.1.2 Recorded initial observation of children\n1.1.3 Secured all records\n1.1.4 Made inferences\n1.1.5 Identified children’s developmental level\n\n1.2 Conducted informal assessment\n1.2.1 Prepared materials and equipment\n1.2.2 Recorded children’s behavior continuously\n1.2.3 Assessed children’s behavior\n1.2.4 Reported assessment result to\nparent/parent-substitute\n1.2.5 Made suggestions to parent/parent-\nsubstitute\n\n1.3 Conducted observation of children’s health,\nnutrition, safety and well-being\n1.3.1 Recorded progress of children’s health,\nnutrition, safety and well-being\n1.3.2 Coordinated the children’s health, nutrition,\nsafety and well-being with relevant\nBarangay units\n1.3.3 Reports assessment result from health and\nnutrition workers to parent/ parent-\nsubstitute\n1.3.4 Make referrals for urgent care\n1.3.5 Secured documents\n\n1.4 Conducted formal assessment\n1.4.1 Prepared assessment kits and forms\n1.4.2 Prepared classroom\n1.4.3 Prepared assessment schedule\n1.4.4 Assessed individual child\n1.4.5 Performed documentation\n\n1.5 Managed Reporting of assessment results\n1.5.1 Organized existing record\n1.5.2 Prepared children’s portfolio\n1.5.3 Secured documents\n1.5.4 Reported relevant result of assessment\n2. Resource Implications\nThe following resources should be provided:\n2.1 Simulated workplace\n2.2 Records\n2.3 Forms\n\n--- PDF PAGE 120 ---\n116\nTR- Early Childhood Care and Development Services NC III\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral questioning\n3.2 Work-related Project (Written)\n4. Context for Assessment\n4.1 Competency may be assessed in the actual\nworkplace or at the designated TESDA\nAccredited Assessment Center in a simulated\nworkplace set