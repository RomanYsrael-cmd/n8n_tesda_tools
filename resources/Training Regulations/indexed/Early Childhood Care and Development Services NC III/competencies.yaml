Act \nNo. 7610 \nentitled an Act \nProviding for \nStronger \nDeterrence \nand Special \nProtection \nAgainst Child \nAbuse, \nExploitation \nand \nDiscrimination\n, and for other \npurposes. \n● Awareness on \nRepublic Act \nNo. 10410 \nentitled An Act \nRecognizing \nthe Age from \nZero (0) to \nEight (8) \nYears as the \nFirst Crucial \nStage of \nEducational \nDevelopment \nand \nStrengthening \nthe Early \nChildhood \nCare and \nDevelopment \nSystem, \nAppropriating \nFund Therefor \nand for other \npurposes. \n● Awareness on \nRepublic Act \nNo. 11908 \nentitled An Act\n\n--- PDF PAGE 137 ---\n133 \nTR- Early Childhood Care and Development Services NC III \nMandating the \nEstablishment \nand \nImplementatio\nn of the \nParent \nEffectiveness \nService \nProgram to \nStrengthen \nParental \nInvolvement in \ntheir \nChildren’s \nDevelopment \nand Learning \nand \nAppropriating \nFunds \nTherefor. \n● Awareness on \nRepublic Act \nNo. 10121 \nalso known as \nthe Philippine \nDisaster Risk \nReduction and \nManagement \nAct of 2010 \n● Awareness of \nenvironmental \nissues and \nsustainable \ndevelopment \n● UN \nConvention on \nthe Rights of \nthe Child \n● Awareness on \nDepartment \nOrder No. 3, \ns. 2021 \nentitled \nCreation of \nthe Child \nProtection \nUnit and the \nChild Rights in\n\n--- PDF PAGE 138 ---\n134 \nTR- Early Childhood Care and Development Services NC III \nEducation \nDesk in the \nDepartment of \nEducation \n \nCOMMUNICATION \n● Recordkeepin\ng \n● Building \npositive \nrelationships \nwith children \nand their \nparent/parent-\nsubstitute\n\n--- PDF PAGE 139 ---\n135 \nTR- Early Childhood Care and Development Services NC III \nRANGE AND VARIABLES \nVARIABLE \nRANGE \n1. Data sources \nData sources may include: \n1.1 Children’s Records: \n1.1.1 ECCD checklist \n1.1.2 Health record \n1.1.3 Progress report \n1.1.4 Developmental checklist \n1.1.5 Informal assessment report \n1.1.6 Reports from stakeholders \n1.2 References: \n2.1 National Early Learning Framework (NELF) \n2.2 National Early Learning Curriculum (NELC) \n2.3 Philippines Early Learning Development \nStandards (PELDS) \n2.4 Guidebook for Early Childhood Care and \nDevelopment Service Providers and \nParents: Managing Zero to Four Year-Old \nChildren with Developmental Delays and \nDisabilities in Early Learning Programs \n2.5 Standards and Guidelines for Center-Based \nEarly Childhood Programs for 0 to 4 Years \nOld Filipino Children\", ECCD Council \n2.6 Competency Standards for Child \nDevelopment Teachers (CDTs) and Child \nDevelopment Workers (CDWs): A Manual, \nECCD Council \n3. Themes and subthemes \nThemes and subthemes may include: \n3.1 Observation records of children’s interest \n3.2 Identified skills of children \n3.3 Local context \n3.3.1 Language \n3.3.2 Songs \n3.3.3 Dance \n3.3.4 Stories \n3.3.5 Games \n3.4 Values \n4. Developmentally \nappropriate activities \nDevelopmentally appropriate activities may include: \n4.1 Stories shared by the children \n4.2 Play-based learning \n4.3 Local context (shared experience in the \ncommunity) \n4.4 Learning resources \n4.4.1 Puzzles \n4.4.2 Toys \n4.4.3 Books \n4.4.4 Audio Visuals\n\n--- PDF PAGE 140 ---\n136 \nTR- Early Childhood Care and Development Services NC III \n4.5 Government mandated activities \n4.5.1 Nutrition month \n4.5.2 National deworming month \n4.5.3 World immunization week \n4.6 Local celebrations \n5. Established schedule \nEstablished schedule may include: \n5.1 Routine \n5.2 Loose monthly plan \n5.3 Weekly activity plan \n5.4 Daily activity plan \n6. Daily routine \nDaily routine may include: \n6.1 Arrival time \n6.2 Meeting time \n6.3 Work time \n6.4 Circle time \n6.5 Outdoor play \n6.6 Self-help and hand washing \n6.7 Snack time \n6.8 Hygiene activities \n6.9 Rest time \n6.10 Story telling \n6.11 Departure \n \n7. Organize special activities \nOrganize special activities may include: \n7.1 Invite resource person \n7.2 Out of the classroom activities \n7.3 Programs on government mandated and \nlocal celebrations \n8. Inventory \nInventory may include: \n      8.1 Copy of children’s portfolio \n      8.2 Classroom equipment \n      8.3 Learning materials and supplies \n8.4 Furniture \n9. Stakeholders \nStakeholders may include: \n9.1 Parents/Parent-Substitute \n9.2 Early Childhood Care and Development \n(ECCD) focal \n9.3 Municipal Social Welfare and Development \nOfficer (MSWDO) \n9.4 Provincial Social Welfare and Development \nOfficer (PSWDO) \n9.5 Other Child Development \nWorkers/Teachers \n9.6 Specialists \n9.7 Representatives from other sectors\n\n--- PDF PAGE 141 ---\n137 \nTR- Early Childhood Care and Development Services NC III \n9.7.1 Health and Nutrition \n9.7.2 Gender and Development \n9.7.3 Anti-Violence Against Women and \ntheir Children \n10. Planning of culminating \nactivities \nPlanning of culminating activities may include: \n10.1 Preparation of certificates of attendance  \n10.2 Preparation of certificates of completion \n10.3 Rehearsal of children\n\n--- PDF PAGE 142 ---\n138 \nTR- Early Childhood Care and Development Services NC III \nEVIDENCE GUIDE \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Created curriculum plan \n1.1.1 Set goals \n1.1.2 Identified themes and subthemes \n1.1.3 Organized developmentally appropriate \nactivities \n \n1.2 Managed curriculum plan implementation \n1.2.1 Written activity plan \n1.2.2 Set learning area \n1.2.3 Established daily routine \n1.2.4 Established classroom management plan \n1.2.5 Implemented classroom management plan \n1.2.6 Implemented the daily activity plan \n1.2.7 Organized special activities \n1.2.8 Documented curriculum \n \n1.3 Reviewed curriculum plan \n        1.3.1 Used result of assessment      \n1.3.2 Gathered feedback \n1.3.3 Adjusted curriculum plan \n1.3.4 Implemented revised activity plan \n \n1.4 Performed culminating activities \n1.3.1 Performed coordination with parent/parent-\nsubstitute \n1.3.2 Planned culminating activity \n1.3.3 Carried out culminating activity \n1.3.4 Conducted end of the school year meeting \n \n2. Resource Implications \nThe following resources should be provided: \n2.1 Simulated workplace \n2.2 Records \n2.3 Activity plan \n3. Methods of Assessment Competency in this unit may be assessed through: \n3.1 Demonstration with Oral questioning \n3.2 Work-related Project (Written) \n4. Context for Assessment 4.1 Competency may be assessed in actual \nworkplace or at the designated TESDA Accredited \nAssessment Center in a simulated workplace \nsetting.\n",
