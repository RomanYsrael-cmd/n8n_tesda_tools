        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Examined specific workplace challenges. \n1.2. Analyzed the causes of specific workplace challenges. \n1.3. Formulated resolutions to specific workplace challenges. \n1.4. Implemented action plans and communicated results on \nspecific workplace challenges. \n2. Resource \nImplications \n2.1. Assessment will require access to an operating plant over \nan extended period of time, or a suitable method of \ngathering evidence of operating ability over a range of \nsituations. A bank of scenarios / case studies / what ifs will \nbe required as well as bank of questions which will be used \nto probe the reason behind the observable action.  \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Observation \n3.2. Case Formulation \n3.3. Life Narrative Inquiry \n3.4. Standardized test \n \nThe unit will be assessed in a holistic manner as is practical and \nmay be integrated with the assessment of other relevant units \nof competency. Assessment will occur over a range of \nsituations, which will include disruptions to normal, smooth \noperation. Simulation may be required to allow for timely \nassessment of parts of this unit of competency. Simulation \nshould be based on the actual workplace and will include walk \nthrough of the relevant competency components.  \n \nThese assessment activities should include a range of \nproblems, including new, unusual and improbable situations that \nmay have happened. \n4. Context for \nAssessment \nIn all workplace, it may be appropriate to assess this unit \nconcurrently with relevant teamwork or operation units.",
