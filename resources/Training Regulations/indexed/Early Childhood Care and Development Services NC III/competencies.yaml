rd\nprocedures\n2.2\nAccomplishi\nng scope to\nmodify\ninstructions/\norders in the\nlight\nof\nchanged\nsituations\n2.3\n\nMeeting\nclient\nrequirement\ns according\nto\nthe\nassignment\ninstructions\n2.4 Monitoring\nand\nappropriatin\ng action is\ntaken\nin\nchanges\nto\nclient’s\nneeds\nand\nrequirement\ns\n2.5 Clearing and\ncomplying\nwith\nassignment\nrequirement\ns\nof\nall\ncommunicati\nons with the\nclient\nor\ncustomer\n\n--- PDF PAGE 51 ---\n47\nTR- Early Childhood Care and Development Services NC III\n3. Build\ncredibility\nwith clients\n3.1\nClient\nexpectations\nfor\nreliability,\npunctuality\nand\nappearance\nadhered to\n3.2 Possible causes\nof\nclient\ndissatisfaction\nidentified,\ndealt\nwith and recorded\naccording\nto\nemployer policy\n3.3 Client fully\ninformed\nof\nall\nrelevant security\nmatters in a timely\nmanner\nand\naccording\nto\nagreed reporting\nprocedures\n3.1 Interpersonal skills\n3.2 Customer service\nskills\n3.3Telephone\netiquette\n3.4\nMaintaining\nrecords\n3.1\nAdhering\nto\nclient\nexpectations for\nreliability,\npunctuality and\nappearance\n3.2\nIdentifying,\nattending\nand\nrecording\npossible causes\nof\nclient/customer\ndissatisfaction\naccording\nto\nemployer policy\n3.3 Informing client\nof all relevant\nsecurity matters\nin\na\ntimely\nmanner\nand\naccording\nto\nagreed reporting\nprocedures\n4. Establish\nprofessional\nrelationship\nwith the client\n4.1Establish\nrelationship within\nappropriate\nprofessional\nboundaries\n4.2 Build trust and\nrespect\nthrough\nuse of effective\ncommunication\ntechniques\n4.3\nIdentify\nand\nrespond to client\nspecial needs\n4.4 Communicate in\nways that take\naccount\nof\ncultural\nconsiderations\n4.5\nExercise\ndiscretion\nand\nconfidentiality\n4.1 Types of client\n4.2 Main components\nof\nclient\nrelationship\n4.3Relative\nintelligence\n4.4 Effect on customer\nsatisfaction\n4.5\nBenefits\nof\ncustomer\nrelationship\nmanagement\n4.6 Improving client\nrelationship\nmanagement\n4.7\nOccupa