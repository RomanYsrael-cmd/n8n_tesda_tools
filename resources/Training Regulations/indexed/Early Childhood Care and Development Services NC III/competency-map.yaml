  "source_text": "Section 1. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2 The qualification of EARLY CHILDHOOD CARE AND DEVELOPMENT\nSERVICES NC III may be attained through the demonstration of Competency\nthrough project-type assessment covering all the core units of the qualification\n\n4.3 Assessment shall focus all competencies with basic and common integrated or\nassessed concurrently with the core units of competency.\n\n4.4 Any of the following are qualified to apply for assessment and certification:\n4.4.1\nGraduates of formal, non–formal and informal including enterprise-based\ntraining programs\n4.4.2\nExperienced Workers, whether wage-employed, self-employed or\notherwise, who have acquired and can demonstrate competencies\nrelated to all core (wage employed or self-employed)\n\n4.5 Recognition of Prior Learning (RPL) Candidates who have gained competencies\nthrough informal training, previous work or life experiences may opt to apply for\nRecognition of Prior Learning (RPL) through portfolio assessment.\nTo qualify for portfolio assessment, the candidate must have gained competencies\nthrough education, informal training and previous work or life experiences for at\nleast 3 years within the last five (5) years\n4.6 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n4.2\nCompetency Assessment Requisite\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\nThis document can:\n\n--- PDF PAGE 158 ---\n154\nTR- Early Childhood Care and Development Services NC III\na.\nIdentify the candidate’s skills and knowledge\nb.\nHighlight gaps in candidate’s skills and knowledge\nc.\nProvide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd.\nAssist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA\nis authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 159 ---\n155\nCOMPETENCY MAP\nEARLY CHILDHOOD CARE AND DEVELOPMENT SERVICES NC III\n\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nParticipate in workplace\ncommunication\nLead workplace communication\nUtilize specialized\ncommunication skill\nManage and sustain effective\ncommunication strategies\nWork with others\nWork in a team environment\nLead small teams\nDevelop and lead teams\nManage and sustain high\nperforming teams\nSolve/address routine problems\nSolve/address general\nworkplace problems\nApply critical thinking and\nproblem-solving techniques in\nthe workplace\nPerform higher-order thinking\nprocesses and apply techniques\nin the workplace\nEvaluate higher order thinking\nskills and adjust problem solving\ntechniques\nEnhance self-management skills\nDevelop career and life\ndecisions\nWork in a diverse environment\nContribute to the practice of\nsocial justice in the workplace\nAdvocate strategic thinking for\nglobal citizenship\nSupport innovation\nContribute to workplace\ninnovation\nPropose methods of applying\nlearning and innovation in the\norganization\nManage innovative work\ninstructions\nIncorporate innovation into work\nprocedures\nAccess and maintain information\nPresent relevant information\nUse information systematically\nManage and evaluate usage of\ninformation\nDevelop systems in managing,\nand maintaining information\nFollow occupational safety and\nhealth policies and procedures\nPractice occupational safety and\nhealth policies and procedures\nEvaluate occupational safety\nand health work practices\nLead in improvement of\noccupational safety and health\nprogram, policies and\nprocedures\nManage implementation of OSH\nprograms in the workplace\nApply environmental work\nstandards\nExercise efficient and effective\nsustainable practices in the\nworkplace\nEvaluate environmental work\npractices\nLead towards improvement of\nenvironmental work programs,\npolicies and procedures\nManage implementation of\nenvironmental programs in the\nworkplace\nAdopt entrepreneurial mindset in\nthe workplace\nPractice entrepreneurial skills in\nthe workplace\nFacilitate entrepreneurial skills\nfor micro-small-medium\nenterprises (MSMEs)\nSustain entrepreneurial skills\nDevelop and sustain a high-\nperforming enterprise\n\n--- PDF PAGE 160 ---\n156\n\nCOMMON COMPETENCIES\n\nMaintain an effective\nrelationship with client/customer\nManage own performance\nApply quality standards\n\nCORE COMPETENCIES\n\nManage Center Operations\nConduct Assessment on\nProgress and Development of\nChildren\nImplement the ECCD\nCurriculum\n\n--- PDF PAGE 161 ---\n157\nGLOSSARY OF TERMS\n\n1. Activity plan\nThis is a plan that details the different learning\nexperiences and materials that will be implemented in a\nday/week to attain class and individual goals that promote\nthe holistic and optimal development of children through\nplayful learning.\n2. Annual report\nThe annual report is a cumulative documentation or record\nof the center’s activities and initiatives in collaboration with\nother stakeholders in the community, e.g., parents of the\nchildren in the center, ECCD Focal, BNS, BHW, Barangay\nCaptain. These include, but are not limited to, official\ncommunication to parents, photos of center activities,\nattendance list of parents during Parent Effectiveness\nSeminar, official communication to local executives in the\nBarangay, city and province, etc.\n3. Assessment in\nearly childhood\nThese are formal (occurs on a set time, day, and place)\nand informal methods (occur daily throughout the class\nroutine) used to provide information on children’s learning,\ngrowth and development. These assessments occur in\nthe context of reciprocal communications between\nteachers and families, and with sensitivity to the cultural\ncontexts in which children are developing. The program\nuses assessment results to inform decisions about the\nchildren in their care, to improve teaching practices, and\nto drive program improvement.\n\n(Source: Adapted from NAEYC Early Learning Program\nAccreditation Standards and Assessment Items, 2019)\n4. Center\nThis refers to any public or private child development\ncenter or learning center.\n5. Children’s\ndevelopmental\nlevel\nPertains to children’s development at each age and stage\nin the following domains: physical health, well-being and\nmotor\ndevelopment;\nsocio-emotional\ndevelopment;\ncharacter and values development; cognitive and\nintellectual development; language development; creative\nand aesthetic development\n(Source: NELF by ECCD Council)\n6. Children’s\nportfolio\nOrganized collection of children’s work to showcase and\ndocument their progress in learning and development.\nThis may include, but are not limited to, their drawings,\nearly writing samples, anecdotal records, checklists, etc.\n7. Classroom\nManagement\nRefers to activities that the teacher takes to creating and\nmaintaining a learning environment that engages and\nsupports children’s learning and development.\n\n--- PDF PAGE 162 ---\n158\n8. Community\nmapping\nThis is accomplished to obtain a record of the families\nwithin the barangay who have children aged 0-4 years.\nIncluded in this mapping is a survey of children needing\nspecial\nassistance,\ne.g.,\nshowing\nsigns\nof\nmalnourishment, dental carries, etc.\n9. Culminating\nActivity\nThis is the final event that allows the children to showcase\nwhat they learned in a creative and meaningful manner.\nThis activity involves the families and the community.\n10. Curriculum Plan\nConsists of the learning experiences through which\nchildren\nacquire\nknowledge,\nskills,\nabilities,\nand\nunderstanding.\n(Source:\nhttps://www.naeyc.org/resources/position-\nstatements/dap/planning-curriculum)\n11. Developmentally\nappropriate\nactivities\nThese are strategies and practices that foster the optimal\nand holistic development of children using the “strengths-\nbased,\nplay-based\napproach\nto\njoyful\nlearning”\nconsidering the cultural, linguistic and ability appropriate\nfor each child”\n(Source: National Association for the Education of Young\nChildren (NAEYC)\nhttps://www.naeyc.org/resources/position-\nstatements/dap/definition)\n\n12. ECCD\nCurriculum\nRefers to the developmentally appropriate educational\nobjectives and practices, programs of activities, organized\nlearning experiences, recommended learning materials\nand appropriate assessment for children that are\nimplemented by ECCD service providers through\ncommunity-based ECCD programs. It is anchored on the\nNational Early Learning Framework (NELF) and consists\nof national program goals and guidelines, instructional\nobjectives, and content outlines that are age-appropriate,\nindividually appropriate and culturally relevant and shall\nmake\npossible a smooth\ntransition\ntowards\nthe\nKindergarten curriculum of the DepED.\n(Source: EYA 2013 IRR)\n13. Inferences\nThese are tentative conclusions that a CDT/ CDW/\nTeacher makes after a series of observations are\ngathered at various times, throughout the daily routine\nabout individual children. These help in planning activities\nfor specific or a small group of children based on observed\nskill level, capacity, needs, and interest.\n14. Intake interview\nInterview to fill-out the needed information in the Child\nIntake Form (CIF). It includes basic information about the\nchild and her/ his family, medical information, latest\n\n--- PDF PAGE 163 ---\n159\nassessment results and interview notes with the parents/\nfamily.\n15. Learning Area\nRefers to designated spaces where children engage in\nvaried activities that promote learning and development.\n16. Locally available\nmaterials\nThis includes artifacts, natural and unnatural objects\navailable in the immediate surroundings in the community,\ne.g., pinecones, seashells, textile swatches, etc., that may\nbe used in a variety of ways for instruction, arts and craft,\netc.\n17. Manipulative\nmaterials\nThese are concrete, hands-on materials that children can\nexplore and play with to enhance their learning and\ndevelopment, e.g., blocks, beads, puzzles, counters, etc.\n18. Parent’s\nHandbook\nThis is a document containing the standard operating\nprocedure of the center. This includes the following, but\nare not limited to, policies for: separation anxiety of\nchildren and how to deal with it, what to do with children\nwho are sick, healthy snacks via the center’s feeding\nprogram and the need for volunteer parents/ guardians,\nimportance of family involvement and active participation\nin the center’s activities, etc.\n19. Referral\nThe process of establishing clear communication paths\namong and between parents, child development teachers/\nworkers, health workers, social workers and specialists\n(ECCD Council, 2021).\nA referral is done for children who may not be developing\nat their desired pace. In the ECCD Checklist, if a child\nscores below than the expected score on any of the\ndomains the parent/ caregiver and the CDT’s/ CDW’s\nimmediate supervisor should be informed. These children\nmay need further evaluation, thus, a referral should be\nmade.\n20. Special\nactivities\nThese are activities planned in relation to the class theme\nand implemented by the CDT/ CDW often in coordination\nwith other stakeholders. Examples of these are: walking\ntrip to a nearby sari sari store, food experience in class\n(may or may not include heat, e.g., peanut butter ball-\nmaking), invite resource person in class to talk about their\njob and show the children the tools they use in their work\n(e.g., delivery rider who can be one of the parents of the\nchildren), etc.\n21. Subthemes\nThese are more focused or specific ideas or topics that\nbranch out from a theme. For example, for the theme\nEverything Grows a sample subtheme would be Children\ngrow, Plants grow, and Animals Grow.\n22. Themes\nThese are broad concepts or big ideas that are naturally\ninteresting to children whereby learning is centered\n\n--- PDF PAGE 164 ---\n160\naround. Some examples are, Everything Grows, We Are\na Community, etc.\n\n--- PDF PAGE 165 ---\n161\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nEarly Childhood Care and Development Services NC III\nQualification Code:\nSOCECD325\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA\nBoard\nResolution\nNo./ Date\nDeployment\nCircular (TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument\nCreated\nEarly Childhood Care\nand Development\nServices NC III\nBR No.\n2025-04\n\nN/A\n\n--- PDF PAGE 166 ---\n162\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) is\nparticularly grateful for the valuable technical support provided by the following\nindustry stakeholders for the development of this Competency Standards (CS). The\ntime and inputs generously given during this undertaking are also highly appreciated\nand recognized as they made significant contributions to the constitution of this CS.\n\nTHE TECHNICAL EXPERT PANEL (TEP)\nMS. MA. CECILIA D. ARCADIO\nECD Officer\nUNICEF Philippines\n\nMS. BARBRA MAE C. DUMLAO\nProgram Development Officer IV\nECCD Council\nMS. MARLENE F. GALVAN, RN, MGM\nNurse IV\nDisease Prevention and Control Bureau\nDepartment of Health\n\nMS. PERLA P. REYES\nPresident\nNational Federation of Child\nDevelopment Workers\nMS. MIRIAM I. UGADDAN, M.A.\nFaculty\nDepartment of Family Life and Child\nDevelopment\nUP College of Home Economics, Diliman\n\nMR. MARVIN DJ. VILLAFUERTE\nSenior Education Program Specialist\nDepartment of Education\nMS. MARIE ROSE A. YUZON, MA, LPT\nMADE\nChairperson, ECE Program\nCollege of Education\nMiriam College\n\n--- PDF PAGE 167 ---\n163\nTHE PARTICIPANTS IN THE NATIONAL VALIDATION OF THIS COMPETENCY\nSTANDARDS\n\nMA. QUEENIE ROSE G. AMOSCO-DE\nJESUS\nNational Nutrition Council\n\nKRISTAL N. AQUINO\nK-Teknika Knowledge and Skills\nDevelopment Inc.\nMARY ELEINE D. BAYTA\nKnowledge Channel Foundation Inc.\n\nGRETCHEN B. CAINOY\nProvincial Government of Misamis\nOriental\n\nEDRIC C. CALMA\nKnowledge Channel Foundation Inc.\nDIANA V. DE OCAMPO\nPSWDO Bulacan\n\nCHARLENE JOY R. DUNGCA\nLGU-City of San Fernando, Pampanga\n\nCONCHITINA D. ENRILE\nEDCOM II\nHARRIETTE D. FAGTA\nNorthskills Polytechnic College, Inc.\n\nEDWARD C. GERNALIN\nFernandez College of Arts and\nTechnology\n\nMADELINE L. HAO\nQuality Care Training Center\n\nRINA LOPEZ\nKnowledge Channel Foundation\nMARIA RITA D. LUCAS\nCentro Escolar University\n\nCATHERINE A. MANZANO\nSave the Children Philippines\nMARIS STELLA D. MAGNO\nRamon Aboitiz Foundation Inc.\n\nROSSINI G. MONSALUD\nWest Visayas State University\nMIEL S. NORA\nPlan International Pilipinas\n\nMARIFE S. PALASI\nMSWDO- Cainta\nROBERT M. PATIO\nNorthskills Polytechnic College Inc.\nJOSEPHONE GAYL PORTER-\nLAUREL\nEDCOM II\n\nFLORAMIE M. REUYAN\nRAFI\n\nJOY S. SAMPANG\nSave the Children\nJAIRA LOU J. SILOS\nProvincial Government of Misamis Oriental\n\nKARL ALFON B. STA. CRUZ\nLGU City of San Fernando\nJOMARIE L. TONGOL\nNational Nutrition Council\n\nKENNETH P. VELUYA\nAlpha Centauri Educational System, Inc.\nJUNAS LESTER C. VILLANUEVA\nKATRINA AMORE MADARANG\nVINARAO\n\n--- PDF PAGE 168 ---\n164\nPrimacare Training and Development\nCenter\n\nTESDA Region II\nMARIEVIC M. VIOLETA\nWest Visayas State University\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n● Qualification and Standards Office\n\n--- PDF PAGE 169 ---\n165\n\nTraining Regulation are available in both printed and electronic\ncopies\nfor more information, please contact:\nTechnical Education and Skills Development Authority (TESDA)\nTele Fax No.: 818-7728\nor visit our website: www.tesda.gov.ph"
