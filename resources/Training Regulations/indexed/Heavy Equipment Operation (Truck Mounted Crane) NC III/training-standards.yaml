  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for HEAVY EQUIPMENT OPERATION (TRUCK MOUNTED CRANE) NC III.\n\nThey include information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title: HEAVY EQUIPMENT OPERATION (TRUCK MOUNTED CRANE) NC III\n\nNominal Training Duration:\n40 Hours Basic Competencies\n24 Hours Common Competencies\n 160 Hours Core Competencies\n\n40 Hours - Supervised Industry Learning (SIL)\n\n Total - 264 Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and attitude,\napplicable in performing work activities involve in performing pre and post-operation procedures,\nperforming basic preventive maintenance servicing and performing productive operation for truck\nmounted crane. This includes classroom learning activities and practical work in actual work site or\nsimulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this qualification\nmust be achieve.\n\n--- PDF PAGE 88 ---\nHEAVY EQUIPMENT OPERATION (Truck Mo