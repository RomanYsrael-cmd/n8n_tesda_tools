ency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n5. Maintain tools\nand equipment\n5.1 Check condition of\ntools and\nequipment\n\n• Maintaining tools and\nequipment\n• Handling of tools and\nequipment\n• Identifying tools and equipment\ndefects\n• Lecture-\ndemonstration\n• Group discussion\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n5.2 Perform basic\npreventive\nmaintenance\n• Handling of tools and\nequipment\n• Performing preventive\nmaintenance\n\n• Simulation\n• Group discussion\n• Practical Lab\n• Demonstration\n\n• Written\nexamination\n• Third party report\n• Demonstration\nwith oral\nquestioning\n2 Hours\n\n5.3 Store tools and\nequipment\n• Storing tools and equipment\n• Handling of tools and\nequipment\n• Demonstration\n• Group discussion\n• Practical Lab\n• Practical exam\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n1 Hour\n\n--- PDF PAGE 103 ---\nHEAVY EQUIPMENT OPERATION (Truck Mounted Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n98\nCORE COMPETENCIES\n(160 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Perform pre- and\npost-operation\n procedures for\n truck-mounted\ncrane\n1.1 Perform visual\n check of equipment\n\n• Select personal protective\nequipment\n• Select truck mounted crane\ncapacity\n• Identify and explain operator\nserviceable parts\n• Perform inspection while power is\nswitched off\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n16 Hours\n1.2 Perform\n “B L O W A F”\n check\n\n• Explain procedures in performing\nBLOWAF check\n• Perform BLOWAF check\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n1.3 Perform visual\ncheck for super\nstructure, lower\nstructure and power\ntrain components\n• Explain procedures in visual check\nfor super & lower