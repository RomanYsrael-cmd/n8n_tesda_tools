    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title: HEAVY EQUIPMENT OPERATION (TRUCK MOUNTED CRANE) NC III\n\nNominal Training Duration:\n40 Hours Basic Competencies\n24 Hours Common Competencies\n 160 Hours Core Competencies\n\n40 Hours - Supervised Industry Learning (SIL)\n\n Total - 264 Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and attitude,\napplicable in performing work activities involve in performing pre and post-operation procedures,\nperforming basic preventive maintenance servicing and performing productive operation for truck\nmounted crane. This includes classroom learning activities and practical work in actual work site or\nsimulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this qualification\nmust be achieve.\n\n--- PDF PAGE 88 ---\nHEAVY EQUIPMENT OPERATION (Truck Mounted Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n83\nBASIC COMPETENCIES\n(40 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses\n• Read\no Effective verbal communication\nmethods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Role Play\n• Written Test\n• Observation\n2 Hours\n\n1.2 Lead\nworkplace\ndiscussions\n• Describe:\no Organizational policy on production,\nquality and safety\no Goals/ objectives and action plan\nsetting\n• Read\no Effective verbal communication\nmethods\n• Prepare/set action plans based on\norganizational goals and objectives\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n2 Hours\n\n1.3 Identify and\ncommunicate\nissues arising\nin the\nworkplace\n• Describe:\no Organizational policy in dealing with\nissues and problems\n• Read\n• Effective verbal communication\nmethods\n• Group\ndiscussion\n• Lecture\n• Oral evaluation\n• Written Test\n2 Hours\n\n--- PDF PAGE 89 ---\nHEAVY EQUIPMENT OPERATION (Truck Mounted Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n84\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Lead small\nteams\n2.1 Provide team\nleadership\n\n• Discussion of Company policies and\nprocedures\n• Read web pages on situational\nleadership\n• Role play on situational leadership\n•\nGroup work\n•\nRole Play\n•\nLecture/\nDiscussion\n•\nIndividual\nWork\n\n• Role Play\n• Written Test\n\n1 Hour\n\n2.2 Assign\nresponsibilities\n• Read web pages on performance\nmanagement\n• Case study on allocating roles and\nresponsibilities based on competencies\nof current staff\n\n• Individual Work\n• Case Study\n• Role Play\n• Written Test\n\n1 Hour\n\n2.3 Set\nperformance\nexpectations\nfor team\nmembers\n• Role play to communicate performance\nexpectations with staff\n• Discussion on performance issues\n\n• Lecture/\nDiscussion\n• Role Play\n• Role Play\n• Written Test\n\n1 Ho