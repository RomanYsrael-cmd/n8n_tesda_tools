  "source_text": "COMPETENCY MAP - CONSTRUCTION Sector\n(HEAVY EQUIPMENT OPERATION)\n HEAVY EQUIPMENT OPERATION (TRUCK MOUNTED CRANE) NC III\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 116 ---\nHEAVY EQUIPMENT OPERATION (Truck Mounted Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n111\n\nUtilize specialize\nspecialized\ncommunication\nskill\nDevelop and\nlead teams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute to\nthe practice\nof social\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate usage\nof information\nLead in\nimprovement\nof\nOccupational\nSafety and\nHealth\nProgram,\nPolicies and\nProcedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneu\nrial skills\nManage and\nsustain effective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate higher\norder thinking\nskills and\nadjust problem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation into\nwork\nprocedures\nDevelop\nsystems in\nmanaging, and\nmaintaining\ninformation\nManage\nimplementatio\nn of OSH\nprograms in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a\nhigh-\nperforming\nenterprise\nPrepare\nconstruction\nmaterials and tools\n\nObserve\nprocedures,\nspecifications and\nmanual of\ninstructions\n\nInterpret technical\ndrawings and plans\nPerform\nmensurations and\ncalculations\n\nMaintain tools and\nequipment\n\nBASIC COMPETENCIES\n\nCOMMON COMPETENCIES\n\n--- PDF PAGE 117 ---\nHEAVY EQUIPMENT OPERATION (Truck Mounted Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n112\n\nPerform pre and post\noperation procedures for\ntruck mounted crane\n\nPerform basic preventive\nmaintenance servicing\nfor truck mounted crane\n\nPerform productive\noperation for truck\nmounted crane\n\nPerform pre and post\noperation procedures for\nrough terrain crane\n\nPerform basic preventive\nmaintenance servicing\nfor rough terrain crane\n\nPerform productive\noperation for rough\nterrain crane\n\nPerform pre and post\noperation procedures for\ncrawler crane\n\nPerform basic preventive\nmaintenance servicing\nfor crawler crane\n\nPerform productive\noperation for crawler\ncrane\n\nPerform pre and post\noperation procedures for\nforklift\n\nPerform basic preventive\nmaintenance servicing\nfor forklift\n\nPerform productive\noperation for forklift\n\nPerform pre and post\noperation procedures for\ntower crane\n\nPerform basic preventive\nmaintenance servicing\nfor tower crane\nPerform productive\noperation for tower care\n\nPerform pre and post\noperation procedures for\noverhead and gantry\ncrane\nPerform basic preventive\nmaintenance servicing\noverhead and gantry\ncrane\n\nPerform productive\noperation for overhead\nand gantry crane\n\nPerform pre and post\noperation procedures for\nhydraulic excavator\n\nPerform basic preventive\nmaintenance servicing\nfor hydraulic excavator\nPerform productive\noperation for hydraulic\nexcavator\n\nPerform pre and post\noperation procedures for\non-highway dump truck\n(rigid)\nPerform basic preventive\nmaintenance servicing\nfor on-highway dump\ntruck (rigid)\nPerform productive\noperation for on-highway\ndump truck (rigid)\n\nCOMMON COMPETENCIES\n\n--- PDF PAGE 118 ---\nHEAVY EQUIPMENT OPERATION (Truck Mounted Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n113\n\nGLOSSARY OF TERMS\n\n1. Attachment\nRefers to anything like fly jib used instead of the conventional lift\nblock to perform different types of lifting jobs.\n\n2. Boom Length\nRefers to the measurement from the boom foot pins to the center\nof the boom point sheaves.\n\n3. Reeving\nRefers to a rope system in which the rope travels around the\ndrums and sheaves.\n\n4. Telescopic Boom\nRefers to a component of crane attached to the superstructure\nand is used to support hoisting tackle. Its extended and retracted\nmovement is controlled by hydraulic cylinder.\n\n5. Truck-mounted\ncrane\nRefers to a mobile type of crane consists of rotating\nsuperstructure with power plant operating machinery and with\ntelescopic boom mounted on a base equipped with tires. It is\nnormally based on 85 percent of tipping capacity.\n\n6. Standard\nRefers to a degree or level of requirement set by the\nmanufacturer.\n\n7. Stability\nRefers to the machine resistance to overturning (Truck-mounted\nCrane - lifting on outriggers are based on 85 percent of the\ntipping capacity).\n\n8. Safety Devices\nRefer to boom angle indicators, load moment indicators, anti-two\nblocking devices (where applicable), boom kick out lever, etc.\n\n9. Work Area\nRefers to any place inside the swing circle of the crane. It must\nbe barricaded off and only those directly involve in the lift shall\nbe allowed to entry.\n\n10. Derated capacity\nof equipment\n\n12 Load Moment\n Indicator (LMI)\n\n11. Rigging Gears\n\nRefers to the reduction of lifting capacity of equipment as\ncertified by a third party.\n\nRefers to electronic device that indicates crane configuration\nsuch as boom angle, boom length, load weight and working\nradius.\n\nRefers to equipment such as wire rope, turnbuckles, clevis,\njacks, shackles, slings used with cranes and other lifting\nequipment in material handling and structure relocation.\n\n--- PDF PAGE 119 ---\nHEAVY EQUIPMENT OPERATION (Truck Mounted Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n114\n12. Super Structure\n\n13. Lower Structure\n\n14. Power train\n\n15. Hazards\n\n16. Rigger\n\n17. Computer Literate\nRefers to upper or lifting component of the crane which includes\nthe boom.\n\nRefers to the carrier of the crane.\n\nRefers to mechanism that transmits the drive from the engine of\na vehicle to its axle.\n\nRefers to situation that poses threat to life, health, property, or\nenvironment.\n\nRefers to signalman that directs the schedule of lifts for the\ncrane, and is responsible for the safety of the loads.\n\nIs defined as the knowledge and ability to utilize computers and\nrelated technology efficiently, with a range of skills covering\nlevels from elementary use to computer programming and\nadvanced problem solving.\n\n--- PDF PAGE 120 ---\nHEAVY EQUIPMENT OPERATION (Truck Mounted Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n115\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nHeavy Equipment Operation (Truck Mounted Crane) NC III\nQualification Code:\nCONTMC319\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nHEO (Truck Mounted\nCrane) NC II\n2007-20 /\nN/A\n01\nDocument Amended\n\nHEO (Truck Mounted\nCrane) NC III\n\nLegend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 121 ---\nHEAVY EQUIPMENT OPERATION (Truck Mounted Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n116\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and validation of\nthese Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\nENGR. SEBASTIAN Q. ALAMPAYAN, JR.\nSafety & Training Manager-\nIndustry Expert\nFirst Balfour, Inc.\nParañaque City\nEDUARDO C. EMAS\nTrainer/ Assessor\nAssociation of Carriers and Equipment\nLessors, Inc. (ACEL)\nPasig City\nMARY LOU C. URLANDA\nTrainer\nAssociation of Carriers and Equipment\nLessors, Inc. (ACEL)\nPasig City\n\nENGR. CORNELIO D. PADUA\nDepartment Head - Industry Expert\nManila’s Finest Construction, Inc.\nParañaque City\n\nJESUS C. SALVACION\nLifting Superintendent\nRoyal Cargo Inc.\nBatangas City /\nRigging Gears Specialist\nAssessment Center Inc.\nChairman/ AC Manager\nROBENSON S. 