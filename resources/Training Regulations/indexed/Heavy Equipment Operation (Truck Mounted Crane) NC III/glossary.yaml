  "source_text": "1. Attachment\nRefers to anything like fly jib used instead of the conventional lift\nblock to perform different types of lifting jobs.\n\n2. Boom Length\nRefers to the measurement from the boom foot pins to the center\nof the boom point sheaves.\n\n3. Reeving\nRefers to a rope system in which the rope travels around the\ndrums and sheaves.\n\n4. Telescopic Boom\nRefers to a component of crane attached to the superstructure\nand is used to support hoisting tackle. Its extended and retracted\nmovement is controlled by hydraulic cylinder.\n\n5. Truck-mounted\ncrane\nRefers to a mobile type of crane consists of rotating\nsuperstructure with power plant operating machinery and with\ntelescopic boom mounted on a base equipped with tires. It is\nnormally based on 85 percent of tipping capacity.\n\n6. Standard\nRefers to a degree or level of requirement set by the\nmanufacturer.\n\n7. Stability\nRefers to the machine resistance to overturning (Truck-mounted\nCrane - lifting on outriggers are based on 85 percent of the\ntipping capacity).\n\n8. Safety Devices\nRefer to boom angle indicators, load moment indicators, anti-two\nblocking devices (where applicable), boom kick out lever, etc.\n\n9. Work Area\nRefers to any place inside the swing circle of the crane. It must\nbe barricaded off and only those directly involve in the lift shall\nbe allowed to entry.\n\n10. Derated capacity\nof equipment\n\n12 Load Moment\n Indicator (LMI)\n\n11. Rigging Gears\n\nRefers to the reduction of lifting capacity of equipment as\ncertified by a third party.\n\nRefers to electronic device that indicates crane configuration\nsuch as boom angle, boom length, load weight and working\nradius.\n\nRefers to equipment such as wire rope, turnbuckles, clevis,\njacks, shackles, slings used with cranes and other lifting\nequipment in material handling and structure relocation.\n\n--- PDF PAGE 119 ---\nHEAVY EQUIPMENT OPERATION (Truck Mounted Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n114\n12. Super Structure\n\n13. Lower Structure\n\n14. Power train\n\n15. Hazards\n\n16. Rigger\n\n17. Computer Literate\nRefers to upper or lifting component of the crane which includes\nthe boom.\n\nRefers to the carrier of the crane.\n\nRefers to mechanism that transmits the drive from the engine of\na vehicle to its axle.\n\nRefers to situation that poses threat to life, health, property, or\nenvironment.\n\nRefers to signalman that directs the schedule of lifts for the\ncrane, and is responsible for the safety of the loads.\n\nIs defined as the knowledge and ability to utilize computers and\nrelated technology efficiently, with a range of skills covering\nlevels from elementary use to computer programming and\nadvanced problem solving.\n\n--- PDF PAGE 120 ---\nHEAVY EQUIPMENT OPERATION (Truck Mounted Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n115",
