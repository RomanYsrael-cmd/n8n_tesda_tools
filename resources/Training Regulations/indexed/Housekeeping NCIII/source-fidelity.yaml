- record_id: tesda:tr:trshsk319:revision-01:fidelity:anomaly:revision-history-date
  location: TR document revision history, Revision 01
  source_detail: The source cell prints “2019-56/ 1015/2019”.
  handling: Normalized promulgation date is 2019-10-15, supported by the repeated page footer “Promulgated (10/15/2019)”;
    raw cell detail is recorded.
- record_id: tesda:tr:trshsk319:revision-01:fidelity:anomaly:toc-section3-3-pagination
  location: Table of Contents / Section 3.3
  source_detail: The TOC lists Trainee Entry Requirements on printed page 128, but the 3.3 heading begins on printed
    page 127.
  handling: Provenance uses the actual printed page 127; TOC discrepancy is documented.
- record_id: tesda:tr:trshsk319:revision-01:fidelity:anomaly:course-description-lines
  location: Section 3.1 Course Description
  source_detail: The source says “laundry guests’ clothes and lines”.
  handling: course_description_source preserves the source-normalized wording; course_description_normalized interprets
    “lines” as “linens” for semantic use.
- record_id: tesda:tr:trshsk319:revision-01:fidelity:anomaly:assessment-4.2.1-grave-accent
  location: Section 4.2.1
  source_detail: A trailing grave-accent-like mark appears after “prior” in the final subitem.
  handling: source_text retains normalized content while the mark is documented as a presentation/source artifact.
- record_id: tesda:tr:trshsk319:revision-01:fidelity:anomaly:competency-map-specialize-duplicate
  location: Competency Map, Basic Competencies, printed page 133
  source_detail: The source cell reads “Utilize specialize specialized communication skill”.
  handling: The competency-map semantic representation preserves that source wording and flags the apparent duplication
    rather than silently correcting it.
- record_id: tesda:tr:trshsk319:revision-01:fidelity:anomaly:400311326-table-boundary-extraction
  location: 400311326 element 2
  source_detail: PDF text extraction truncates “environmental work targets” to “environmental wo targets” and injects
    “rk” into “Relevant Environmental Trainings and Seminars” where text crosses table boundaries.
  handling: Canonical semantic text restores “work” and removes the injected extraction fragment based on visual
    inspection of the source table.
- record_id: tesda:tr:trshsk319:revision-01:fidelity:anomaly:trs141206-range-variable-14-missing
  location: TRS141206 Range of Variables
  source_detail: The printed Range of Variables numbering proceeds from variable 13 (Training venue) directly to
    variable 15 (Training topic); no variable 14 is printed.
  handling: The source numbering is preserved without inventing a variable 14.
- record_id: tesda:tr:trshsk319:revision-01:fidelity:anomaly:glossary-6-source-wording
  location: Glossary entry 6 — Computer Room/Laboratory
  source_detail: The source definition contains the wording “may be prescribe” and “holed to an ISP”.
  handling: The glossary preserves the source wording; no silent grammatical correction is made.
- record_id: tesda:tr:trshsk319:revision-01:fidelity:anomaly:glossary-33-unmatched-quote
  location: Glossary entry 33 — OSH
  source_detail: The source reads “OSH refers to ‘Occupational Safety and Health.” with an unmatched opening quotation
    mark.
  handling: The glossary preserves the source-normalized wording and this anomaly records the punctuation issue.
fidelity_records:
- record_id: tesda:tr:trshsk319:revision-01:fidelity:unit:400311321
  type: evidence_guide_expansion
  canonical_selector:
    file: competencies.yaml
    field: unit_code
    value: '400311321'
  detail: For assessment-sensitive use, preserve the full Evidence Guide source_text_normalized fields. The source
    requires evidence involving operating plant over an extended period or equivalent scenarios, banks of scenarios/case
    studies/what-ifs and questions, holistic/integrated assessment, disruptions to normal operation, simulations
    based on actual workplace, walkthroughs, new/unusual/improbable problems, and concurrent assessment context.
