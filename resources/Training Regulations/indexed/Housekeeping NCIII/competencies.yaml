      - record_id: tesda:tr:trshsk319:revision-01:unit:trs141207:range:3
        number: '3'
        variable: Staff performance assessment information
        source_text_normalized: 'May include: 3.1 mentioning organization-wide staff performance assessment at all
          interviews conducted for new staff 3.2 including mention of staff performance assessment in regular staff
          activities, including internal training, briefings, meetings, etc 3.3 explaining that the staff performance
          assessment process applies to all employees within the business, including supervisors, managers, etc
          3.4 explaining that the staff performance assessment process is on-going and cyclical in nature 3.5 talking
          to individual staff, including one-on-one basis to: a. determine the focus of the staff performance assessment
          for the up-coming period b. explaining the support available for staff c. re-assuring staff that jobs
          are not threatened by the staff performance assessment process d. confirm that all staff, including management,
          are subject to staff performance assessment 3.6 notifying staff well in advance of any meetings and special
          events relating to staff performance assessments 3.7 using experienced/senior staff to assist in selling
          the benefits’ of staff performance assessments to new staff 3.8 developing individual staff performance
          assessment deed/workplace contract, setting out the agreement between employee and supervisor exactly
          what will be assessed and how it will be adjudged during the identified period in terms of targeted staff
          performance'
