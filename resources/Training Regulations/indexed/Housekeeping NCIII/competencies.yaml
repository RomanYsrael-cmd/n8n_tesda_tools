        number: '10'
        variable: Individual staff performance
        source_text_normalized: 'May include: 10.1 meeting privately with individual staff member 10.2 reviewing
          the objectives set out in the individual staff performance assessment deed/workplace contract for the
          period 10.3 reminding the staff member of the cyclical nature of the staff performance assessment process
          10.4 explaining the data, facts, statistics that have been captured in relation to the identified targets
          for the period in question 10.5 explaining interpretation of facts and statistics 10.6 providing opportunity
          for the staff member to make input and comment on the information/data provided 10.7 congratulating the
          staff member on positive outcomes 10.8 encouraging staff member where performance has fallen short of
          the identified key performance criteria (KPIs) set for the period, where appropriate 10.9 counseling staff
          member where it is deemed actual staff performance has fallen short of agreed criteria/ key performance
          criteria (KPIs) due to lack of application, including supportive mention of disciplinary action that may
          follow if performance does not improve to the minimum required level 10.10 offering support of the organization
          and the staff for staff to achieve the required performance standards and targets'
        preamble: 'May include:'
