          source_text_normalized: 'Assessment requires evidence that the candidate: 1.1 Demonstrated ability to
            apply active listening techniques 1.2 Demonstrated ability to use effective communication skills to
            build and maintain interpersonal relationships within a designated work group or team 1.3 Demonstrated
            ability to apply the principles of good teamwork to assist self and others to complete assignments within
            designated timeframes 1.4 Demonstrated ability to interpret and comply with a range of legislative and
            procedural requirements relevant to security operations 1.5 Demonstrated ability to actively seek and
            interpret feedback on quality of work performance and identify opportunities for professional development
            to develop and improve future career options 1.6 Demonstrated ability to communicate in a clear, concise
            and accurate manner which reflects sensitivity to individual social and cultural differences'
