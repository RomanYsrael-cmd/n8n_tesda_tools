      - record_id: tesda:tr:trshsk319:revision-01:unit:trs141206:range:11
        number: '11'
        variable: Training requirements
        source_text_normalized: 'May include: 11.1 Obtaining promised financial and other resources to support training
          implementation/delivery 11.2 Obtaining identified training materials and resources 11.3 Promoting training
          sessions internally to staff/learners, including use of management to encourage participation and engagement
          with training 11.4 Obtaining necessary equipment and consumables to support training delivery 11.5 Arranging
          for identified external training support to be available, such as guest speakers, government officials,
          trainers, assessors, subject experts 11.6 Preparing hard copy training support materials, such as notes,
          exercises, presentations, etc 11.7 Recording details of learners wishing to participate in training 11.8
          Being accountable for time and money spent on the preparation of training and the purchase of materials,
          etc 11.9 Readying the training venue for training 11.10 Meeting with supervisors to explain the proposed
          workplace training, including soliciting their cooperation in relation to releasing staff for training,
          and offering assistance for maintaining necessary workplace staffing levels during training periods 11.11
          Arranging access to identified areas, equipment, etc for training and/or assessment, including demonstrations
          and practice 11.12 Ensuring safety of the equipment and venue to be used for training and/or assessment
          purposes, including understanding of the emergency management plan that applies to the training venue/area,
          and presence of required safety and first aid equipment 11.13 Identifying criteria for determining training
          effectiveness 11.14 Establishing guidelines for training plan implementation, including dissemination
          and explanation of guidelines to trainers and relevant other people'
