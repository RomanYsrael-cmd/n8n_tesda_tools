      unit_code: '400311321'
      unit_title: Apply critical thinking and problem-solving techniques in the workplace
      unit_descriptor: This unit covers the knowledge, skills and attitudes required to solve problems in the workplace
        including the application of problem solving techniques and to determine and resolve the root cause/s of
        specific problems in the workplace.
      provenance:
        printed_pages:
        - 11
        - 16
        pdf_pages:
