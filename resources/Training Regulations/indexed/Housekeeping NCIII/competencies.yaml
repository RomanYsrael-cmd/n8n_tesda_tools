          source_number: '1.3'
          text: Demonstrating openness and flexibility in communication
        - record_id: tesda:tr:trshsk319:revision-01:unit:400311322:element:1:rs:1.4:occurrence:1
          source_number: '1.4'
          text: Recognizing diverse groups in the workplace and community as defined by divergent culture, religion,
