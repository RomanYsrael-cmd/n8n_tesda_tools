          source_number: '1.2'
          text: Extent, cause and nature of the specific problem are defined through observation, investigation
            and analytical techniques.
        - record_id: tesda:tr:trshsk319:revision-01:unit:400311321:element:1:pc:1.3:occurrence:1
          source_number: '1.3'
