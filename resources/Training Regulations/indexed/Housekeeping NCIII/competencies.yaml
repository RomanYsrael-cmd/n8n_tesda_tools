      - record_id: tesda:tr:trshsk319:revision-01:unit:trs141206:range:10
        number: '10'
        variable: Individual training sessions
        source_text_normalized: 'May include: 10.1 Preparing sessions for individuals and groups 10.2 Assembling
          identified and agreed training content into training programs, where appropriate 10.3 Identifying the
          dates and timing for individual training sessions, including start and finish times, and supplementary
          training provision 10.4 Identifying and accommodating requirements for practice sessions to enable skills
          development,- including on-the-job and off-the job practice, provision of supplementary and top-up training,
          where required, and job rotation, work-sharing, out-of-work placements 10.5 Identifying and allowing for
          necessary workplace assessment, including identification of forms of assessment to be used, development
          of assessment tools, where necessary, and allocation of time to enable required on-the-job, off-the-job
          and supplementary assessments to be conducted 10.6 Determining venues for training delivery, including
          on- site and off-site 10.7 Identifying training strategies and techniques to be used to deliver identified
          content, including oral presentations, simulations, project work, demonstrations, field trips, guest speakers,
          role plays, interviews, surveys, portfolios of evidence, mentoring, coaching, computer-based training,
          self-paced learning, lectures, discussion 10.8 Identifying equipment, materials, items and consumables
          required to enable identified training delivery, including sufficient hand-outs required for the identified
          number of learners 10.9 Ensuring training sessions enable attainment of identified objectives and outcomes
          10.10 Developing session/delivery plans for individual training sessions 10.11 Matching training materials
          and resources to content of individual training sessions 10.12 Ensuring total training program accommodates
          identified need for all learners for each training topic/area 10.13 Factoring in the need to accommodate
          individual differences, where practicable to do so.'
