    - record_id: tesda:tr:trshsk319:revision-01:unit:400311322
      unit_code: '400311322'
      unit_title: Work in a diverse environment
      unit_descriptor: This unit covers the outcomes required to work effectively in a workplace characterized by
        diversity in terms of religions, beliefs, races, ethnicities and other differences.
      provenance:
        printed_pages:
        - 17
        - 20
        pdf_pages:
        - 21
        - 24
      elements:
      - record_id: tesda:tr:trshsk319:revision-01:unit:400311322:element:1
        number: '1'
        title: Develop an individual’s cultural awareness and sensitivity
        performance_criteria:
        - record_id: tesda:tr:trshsk319:revision-01:unit:400311322:element:1:pc:1.1:occurrence:1
          source_number: '1.1'
          text: Individual differences with clients, customers and fellow workers are recognized and respected in
            accordance with enterprise policies and core values.
        - record_id: tesda:tr:trshsk319:revision-01:unit:400311322:element:1:pc:1.2:occurrence:1
          source_number: '1.2'
          text: Differences are responded to in a sensitive and considerate manner
        - record_id: tesda:tr:trshsk319:revision-01:unit:400311322:element:1:pc:1.3:occurrence:1
          source_number: '1.3'
          text: Diversity is accommodated using appropriate verbal and non-verbal communication.
        required_knowledge:
        - record_id: tesda:tr:trshsk319:revision-01:unit:400311322:element:1:rk:1.1:occurrence:1
          source_number: '1.1'
          text: Understanding cultural diversity in the workplace
        - record_id: tesda:tr:trshsk319:revision-01:unit:400311322:element:1:rk:1.2:occurrence:1
          source_number: '1.2'
          text: Norms of behavior for interacting and dialogue with specific groups (e. g., Muslims and other non-
            Christians, non- Catholics, tribes/ethnic groups, foreigners)
        - record_id: tesda:tr:trshsk319:revision-01:unit:400311322:element:1:rk:1.3:occurrence:1
          source_number: '1.3'
          text: Different methods of verbal and non-verbal communication in a multicultural setting
        required_skills:
        - record_id: tesda:tr:trshsk319:revision-01:unit:400311322:element:1:rs:1.1:occurrence:1
          source_number: '1.1'
          text: Applying cross-cultural communication skills (i.e. different business customs, beliefs, communication
