      unit_title: Propose methods of applying learning and innovation in the organization
      unit_descriptor: This unit covers the knowledge, skills and attitudes required to assess general obstacles
        in the application of learning and innovation in the organization and to propose practical methods of such
        in addressing organizational challenges.
