        number: '2'
        title: Work effectively in an environment that acknowledges and values cultural diversity
        performance_criteria:
        - record_id: tesda:tr:trshsk319:revision-01:unit:400311322:element:2:pc:2.1:occurrence:1
          source_number: '2.1'
          text: Knowledge, skills and experiences of others are recognized and documented in relation to team objectives.
        - record_id: tesda:tr:trshsk319:revision-01:unit:400311322:element:2:pc:2.2:occurrence:1
          source_number: '2.2'
          text: Fellow workers are encouraged to utilize and share their specific qualities, skills or backgrounds
            with other team members and clients to enhance work outcomes.
