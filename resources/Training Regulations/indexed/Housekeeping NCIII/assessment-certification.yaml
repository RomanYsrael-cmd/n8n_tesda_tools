  - record_id: tesda:tr:trshsk319:revision-01:assessment:4.2.2
    number: 4.2.2
    source_text: Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct
      competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they
      are authorized by TESDA to manage the assessment for National Certification.
    normalized_text: Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct
