  - record_id: tesda:tr:trshsk319:revision-01:assessment:4.1.5
    number: 4.1.5
    source_text: 'The industry shall determine assessment and certification requirements for each qualification
      with promulgated Training Regulations: It includes the following: a. Entry requirements for candidates b.
      Evidence gathering methods c. Qualification requirements of competency assessors d. Specific assessment and
      certification arrangements as identified by industry 4.2 COMPETENCY ASSESSMENT REQUISITE'
