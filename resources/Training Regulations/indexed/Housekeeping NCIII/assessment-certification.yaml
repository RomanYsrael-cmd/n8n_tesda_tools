  - record_id: tesda:tr:trshsk319:revision-01:assessment:4.1.2
    number: 4.1.2
    source_text: Candidate wanting to be certified will have to be assessed in accordance with the requirements
      identified in the evidence guide of the relevant unit/s of competency.
    normalized_text: Candidate wanting to be certified will have to be assessed in accordance with the requirements
