competency_assessment_requisite:
  heading_source: 4.2 COMPETENCY ASSESSMENT REQUISITE
  provisions:
  - record_id: tesda:tr:trshsk319:revision-01:assessment:4.2.1
    number: 4.2.1
    source_text: 'Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior
      to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine
      what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify
      the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical
      guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to
      identify key areas in which practice is needed or additional information or skills that should be gained prior
      `'
