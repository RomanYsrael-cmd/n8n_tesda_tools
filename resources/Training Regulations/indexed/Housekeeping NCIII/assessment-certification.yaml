schema: tesda-assessment-certification
schema_version: '1.1'
document_id: tesda:tr:trshsk319:revision-01
qualification: Housekeeping NC III
section: SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS
overview: Competency Assessment is the process of collecting evidence and making judgments whether competency has
  been achieved. The purpose of assessment is to confirm that an individual can perform to the standards expected
  at the workplace as expressed in relevant competency standards. The assessment process is based on evidence or
  information gathered to prove achievement of competencies. The process may be applied to an employable unit(s)
  of competency in partial fulfillment of the requirements of the national qualification.
national_assessment_and_certification:
  heading_source: 4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS
  provisions:
  - record_id: tesda:tr:trshsk319:revision-01:assessment:4.1.1
    number: 4.1.1
    source_text: A National Certificate (NC) is issued when a candidate has demonstrated competence in all unit/s
      of competency of a qualification with a promulgated Training Regulations.
    normalized_text: A National Certificate (NC) is issued when a candidate has demonstrated competence in all unit/s
      of competency of a qualification with a promulgated Training Regulations.
    provenance:
