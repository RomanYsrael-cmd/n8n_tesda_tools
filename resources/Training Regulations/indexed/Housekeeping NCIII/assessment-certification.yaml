  - record_id: tesda:tr:trshsk319:revision-01:assessment:4.1.4
    number: 4.1.4
    source_text: Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training,
      previous work or life experiences may apply for recognition in a particular qualification through competency
      assessment.
    normalized_text: Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal
      training, previous work or life experiences may apply for recognition in a particular qualification through
