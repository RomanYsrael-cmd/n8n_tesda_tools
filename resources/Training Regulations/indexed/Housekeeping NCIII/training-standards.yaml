  course_description_source: This course is designed to enhance the knowledge, skills, and attitudes in accordance
    with industry standards. This covers competencies that a person must achieve in performing tasks such as supervising
    room cleaning and maintenance requirement, housekeeping services to guests, laundry guests’ clothes and lines
    as well as implementing lost and found procedures.
  course_description_normalized: This course is designed to enhance the knowledge, skills, and attitudes in accordance
    with industry standards. This covers competencies that a person must achieve in performing tasks such as supervising
    room cleaning and maintenance requirement, housekeeping services to guests, laundry guests’ clothes and linens
    as well as implementing lost and found procedures.
  course_description_fidelity_ref: tesda:tr:trshsk319:revision-01:fidelity:training:course-description
  completion_expectation: Upon completion of the course, the learners are expected to demonstrate the above-mentioned
    competencies to be employed. To obtain this, all units prescribed for this qualification must be achieved.
