n\nthe workplace\n\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 Hour\n5. Propose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\n5.1 Assess work\nprocedures,\nprocesses and\nsystems in\nterms of\ninnovative\npractices\n\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\nconcepts and transtheoretical model of\nbehavior change)\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n1 Hour\n\n--- PDF PAGE 115 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 111\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n5.2 Generate\npractical action\nplans for\nimproving work\nprocedures,\nprocesses\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\nconcepts and transtheoretical model of\nbehavior change)\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n• Set up action plans on how to apply\ninnovative procedures in the\norganization\n• Set up action plans on how to apply\ninnovative procedures in the\norganization\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n5.3 Evaluate the\neffectiveness\nof the\nproposed\naction plans\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\nconcepts and transtheoretical model of\nbehavior change)\n• Demonstrate collaboration and\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n1 Hour\n\n--- PDF PAGE 116 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 112\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on\ncontinuous improvement\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n6. Use\ninformation\nsystematically\n\n6.1 Use technical\ninformation\n• Lecture and discussion on:\n- Application in collating information\n- Procedures for inputting,\nmaintaining and archiving\ninformation\n- Guidance to people who need to\nfind and use information\n• Organizing information into a suitable\nform for reference and use\n• Classify stored information for\nidentification and retrieval\n• Operate the technical information\nsystem by using agreed procedures\n• Lecture\n• Group\nDiscussion\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n4 Hours\n\n6.2 Apply\ninformation\ntechnology (IT)\n• Lecture and discussion on:\n- Attributes and limitations of available\nsoftware tool\n- Procedures and work instructions for\nthe use of IT\n- Operational requirements for IT\nsystems\n- Sources and flow paths of data\n- Security systems and measures that\ncan be used\n- Methods of entering and processing\n• Lecture\n• Group\nDiscussion\n• Self-paced\nhandout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n--- PDF PAGE 117 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 113\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\ninformation\n• Use procedures and work instructions\nfor the use of IT\n• Extract data and format reports\n• Use WWW applications\n\n6.3 Edit, format\nand check\ninformation\n• Lecture and discussion on:\n- Basic file-handling techniques\n- Techniques in checking documents\n- Techniques in editing and formatting\n- Proof reading techniques\n• Use different techniques in checking\ndocuments\n• Edit and format information applying\ndifferent techniques\n• Proof read information applying\ndifferent techniques\n• Lecture\n• Group\nDiscussion\n• Self-paced\nhandout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n7. Evaluate\nOccupational\nSafety And\nHealth Work\nPractices\n7.1 Interpret\nOccupational\nSafety and\nHealth\npractices\n\n• Discuss the OSH standards, principles\nand legislations\n• Identify OSH work practices issues\n• Discuss standard safety requirements\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1.5 Hours\n\n7.2 Set OSH work\ntargets\n• Discussion in actions plans that are\nnecessary in achieving the OSH target\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n7.3 Evaluate\neffectiveness\nof\nOccupational\nSafety and\nHealth work\ninstructions\n• Practice evaluating safety data\n(Historical or Simulated)\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1.5 Hours\n\n--- PDF PAGE 118 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 114\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n8. Evaluate\nEnvironmenta\nl Work\nPractices\n8.1 Interpret\nenvironmental\npractices,\npolicies and\nprocedures\n• Discussion Environmental Issues\nregarding\n- Water Quality\n- National and Local Government\nIssues\n- Safety\n- Endangered Species\n- Noise\n- Air Quality\n- Historic\n- Waste\n- Cultural\n• Updating of existing occupation\npractices\n• Lecture\n• Group\nDiscussion\n• Demonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n8.2 Establish\ntargets to\nevaluate\nenvironmental\npractices\n• Discussion on\n-\nlower production costs and\nenergy consumption\n-\nEnvironmentally Sound\nProcesses\n-\nResource Efficient\n-\nRecycling and Waste\nManagement\n• Simple case study regarding energy\nefficiency\n• Lecture\n• Group\nDiscussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 Hour\n\n8.3 Evaluate\neffectiveness\nof\nenvironmental\npractices\n• Identifying effective environmental\npractices relevant to the\nindustry/occupation\n-\nImplementation of energy\nefficiency\n\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Case Study\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n9. Facilitate\nEntrepreneuri\n9.1 Develop and\nmaintain\n• Discussions on business models and\nstrategies\n• Lecture/\nDiscussion\n• Written Test\n• Portfolio\n2 Hours\n\n--- PDF PAGE 119 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 115\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nal Skills For\nMicro-Small-\nMedium\nEnterprises\n(MSMEs)\nmicro-small-\nmedium\nenterprise\n(MSMEs) skills\nin the\norganization\n• Discussion on Types and categories\nof businesses and business internal\ncontrol\n• Discussion on Relevant National and\nlocal legislations affecting businesses\n• Prepare promotional materials\n• Practice basic bookkeeping\n\n• Case Study\n• Demonstration\n• Work Related\nProject\n\n9.2 Establish and\nmaintain client-\nbase/market\n• Role play on customer and employee\nrelations\n• Discussion on Basic product\npromotion strategies\n• Preparation of Basic Feasibility study\n• Case studies on Basic Business\nethics\n• Prepare basic advertising materials\n• Role Play\n• Lecture\nDiscussion\n• Case study\n• Case problem\n• Written Test\n2 Hours\n\n9.3 Apply\nbudgeting and\nfinancial\nmanagement\nskills\n• Discussion on:\n- Basic cost-benefit analysis\n- Basic financial management\n- Basic financial accounting\n- Business internal controls\n\n• Role Play\n• Lecture\nDiscussion\n• Group work\n• Written Test\n• Case problem\n1 Hour\n\n--- PDF PAGE 120 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 116\nCOMMON COMPETENCIES\n(96 Hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Receive and\nresolve\ncustomer\ncomplaints\n1.1 Identify and\nanalyse the\ncomplaint\n•\nExplain how to received verbal complaint\nusing active listening and empathy\ntechniques\n•\nIdentify through appropriate communication\ntechniques the exact nature of the customer\ncomplaint\n•\nIdentify steps in maintain register or\ncomplaint file/s in accordance with the\nrequirements of the enterprise information\nsystem\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n\n4 Hours\n1.2 Respond to\ncomplaints\n•\nExplain how to process complaints in\naccordance with organizational standards,\npolicies and procedures\n•\nExplain how to obtain and review\ndocumentation in relation to complaints\n•\nIdentify steps in updating register of\ncomplaints/disputes\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n\n4 Hours\n\n1.3 Determine\nand agree\nupon\nappropriate\naction to\nresolve\ncomplaint\n•\nIdentify procedures and guidelines on how\nto resolve the complaint\n•\nDemonstrate a commitment to the customer\nto resolve the complaint\n\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n\n4 Hours\n\n1.4 Refer\ncomplaints\n•\nIdentify complaints that require referral to\nother personnel or external bodies\n•\nExplain how to forward all necessary\ndocumentation including investigation\nreports to appropriate personnel\n\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n• Oral Questioning\n4 Hours\n\n--- PDF PAGE 121 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 117\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2. Work\ncooperatively In\na general\nadministration\nenvironment\n2.1 Develop\neffective team\nrelationships\n•\nExplain how to develop and maintain\nrelationships with team members and\npromote benefits of cooperative work\nconsistent with organizational goals and\nobjectives\n•\nIdentify communication techniques to relay\ninformation in a clear and concise manner\n\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n\n2.2 Participate in\nteam\nassignments\n• Identify individual responsibilities within the\nworkgroup in accordance with organisational\nrequirements\n• How to recognize and accommodate cultural\ndifferences within the team\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4 Hours\n\n2.3 Contribute to\nteam\ndevelopment\n\n• Identify the internal and external customer\nneeds and expectations\n• Explain how to seek formal feedback and\ninformal feedback on individual and team\nperformance regularly from colleagues and\nsupervisors\n• Identify the non-discriminatory attitudes and\nlanguage when interacting with customers,\nstaff and management\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n3. Maintain quality\ncustomer/guest\nservice\n\n3.1 Identify\ncustomer/\nguest\nrequirements\n• Identify options to improve service\n• Explain how to assess needs of customers/or\nguests\n• Identify and conduct data analysis on\ndeficiencies in service delivery\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n\n--- PDF PAGE 122 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 118\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n3.2 Ensure\ndelivery of\nquality\nproducts/servi\nces\n•\nExplain how to ensure products/services\nmeet customers’ needs and reflect\nenterprise standards and improve on\nservice levels\n•\nExplain how to ensure team performance\nconsistently meets enterprise standards\n•\nExplain to colleagues how to meet and\nexceed customer service standards by\nproviding appropriate professional\ndevelopment\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n\n3.3 Evaluate\ncustomer\nservice\n\n•\nExplain how to review customer/guest\nsatisfaction with service delivery using\nappropriate methods that produce verifiable\ndata\n•\nIdentify steps on how to evaluate customer\nservice evaluation outcomes\n•\nObtain agreements on appropriate action to\novercome problems\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n4. Roster Staff\n\n4.1 Develop and\nimplement\nstaff rosters\n• Explain how to developed rosters in\naccordance with company agreements and\nwage budgets\n• Identify the role of rosters and their\nimportance in controlling staff costs\n• Explain how to present roster in required\nformats to ensure clarity of information in\naccordance with company standards\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n6 Hours\n4.2 Maintain staff\nrecords\n•\nExplain how to complete time sheets and\nother documentation within designated\ntimelines\n•\nExplain procedures in updating, maintaining\nand storing staff records\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4 Hours\n\n--- PDF PAGE 123 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 119\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n5. Control And\nOrder Stock\n5.1 Maintain\nstock levels\nand records\n• Explain how to monitor and maintain stock\nlevels and performance\n• Identify the steps in monitoring stock\nsecurity and adjusting systems\n• Explain how to maintain records of stock\nstorage and movement\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n6 Hours\n\n5.2 Process stock\norders\n• Explain how to process orders for stock in\naccordance with company procedures\n• Identify steps in maintaining and recording\nstock levels\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4 Hours\n5.3 Minimize\nstock losses\n• Identify reasons for stock loss and damage\n• Explain how to identify stock losses\n• Identify the recommended related\nprocedures and solutions to loss situations\nto prevent future avoidable losses\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4 Hours\n5.4 Follow-up\norders\n• Explain how to monitor delivery process and\nensure continuity of supply\n• Identify routine supply problems\n• Explain how to distribute stock to agreed\nlocations.\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 Hours\n5.5 Organize and\nadminister\nstocks\n• Explain how to organize stocks\n• Identify the stocktaking responsibilities\n• Demonstrate how to produce accurate stock\nreports\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4 hours\n\n--- PDF PAGE 124 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 120\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n6. Prepare And\nDeliver Training\nSessions\n6.1 