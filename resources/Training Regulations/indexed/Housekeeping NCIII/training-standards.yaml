training_delivery:
  record_id: tesda:tr:trshsk319:revision-01:training:delivery
  provenance:
    printed_pages:
    - 126
    - 127
    pdf_pages:
    - 130
    - 131
  source_heading: 3.2 TRAINING DELIVERY
  overarching_provisions:
  - number: '1'
    text: The delivery of training shall adhere to the design of the curriculum. Delivery shall be guided by the
      principles of competency-based TVET.
  - number: '2'
    text: The competency-based TVET system recognizes various types of delivery modes, both on-and off-the-job as
      long as the learning is driven by the competency standards specified by the industry. The training modalities
      and their variations/components may be adopted singly or in combination with other modalities when designing
      and delivering training programs.
  cbtvet_principles:
  - source_number: a
    text: Course design is based on competency standards set by the industry or recognized industry sector; learning
      system is driven by competencies written to industry standards.
  - source_number: b
    text: Training delivery is learner-centered and should accommodate individualized and self-paced learning strategies.
  - source_number: c
    text: Training can be done on an actual workplace setting, simulation of a workplace and/or through adoption
      of modern technology.
  - source_number: d
    text: Assessment is based in the collection of evidence of the performance of work to the industry required
      standards.
  - source_number: e
    text: Assessment of competency takes the trainee’s knowledge and attitude into account but requires evidence
      of actual performance of the competency as the primary source of evidence.
  - source_number: f
    text: Training program allows for recognition of prior learning (RPL) or current competencies.
  - source_number: g
    text: Training completion is based on satisfactory performance of all specified competencies.
  modalities:
    institution_based:
    - name: Dual Training System (DTS)/Dualized Training Program (DTP)
      text: Contains both in-school and in-industry training or fieldwork components; details refer to the Implementing
        Rules and Regulations of the DTS Law and TESDA Guidelines on the DTP.
    - name: Distance Learning
      text: A formal education process in which the majority of instruction occurs when students and instructor
        are not in the same place; may employ correspondence study, audio, video, computer technologies or other
        modern technology for formal and non-formal training. Specific guidelines are to be issued by the TESDA
        Secretariat.
    - name: Classroom-based / in-center instruction
      text: Uses learner-centered methods as well as laboratory or field-work components.
    enterprise_based:
    - name: Formal Apprenticeship
      text: Training within employment involving a contract between an apprentice and an enterprise on an approved
        apprenticeable occupation.
    - name: Informal Apprenticeship
      text: Based on a training and working agreement, written or oral, between an apprentice and a master craftsperson.
        The master craftsperson commits to training the apprentice in all skills relevant to the trade over a significant
        period, usually one to four years, while the apprentice contributes productively to the business. Training
        is integrated into production and learning occurs alongside the experienced craftsperson.
    - name: Enterprise-based Training
      text: Training implemented within the company in accordance with requirements of the specific company; specific
        guidelines are to be issued by the TESDA Secretariat.
    community_based:
    - name: Community-Based
      text: Short-term programs conducted by NGOs, LGUs, training centers and other TVET providers to address specific
        community needs; may be conducted in informal settings such as barangay halls or basketball courts and may
        also be delivered as a mobile training program (MTP).
