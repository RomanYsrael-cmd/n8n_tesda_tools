  "source_text": "SECTION 1 HOUSEKEEPING NC III QUALIFICATION\n\nThe HOUSEKEEPING NC III Qualification consists of competencies that a\nperson must achieve to deliver and supervise housekeeping service operations in\nTourism and hospitality related enterprises.\n\nThis Qualification is packaged from the competency map of the Tourism Sector\n(Hotel and Restaurant) as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311319\nLead workplace communication\n400311320\nLead small teams\n400311321\n\n400311322\nApply critical thinking and problem-solving techniques in\nthe workplace\nWork in a diverse environment\n400311323\n\n400311324\n400311325\n400311326\n400311327\nPropose methods of applying learning and innovation in\nthe organization\nUse information systematically\nEvaluate occupational safety and health work practices\nEvaluate environmental work practices\nFacilitate entrepreneurial skills for micro-small-medium\nenterprises (MSMEs)\n\nCODE NO.\nCOMMON COMPETENCIES\nTRS141201 Receive and resolve customer complaints\nTRS141202 Work cooperatively in a general administration environment\nTRS141203 Maintain quality customer/guest service\nTRS141204 Roster staff\nTRS141205 Control and order stock\nTRS141206 Prepare and deliver training sessions\nTRS141207 Plan, conduct and evaluate staff performance assessment\n\nCODE NO.\nCORE COMPETENCIES\n\nTRS515301 Supervise room cleaning and maintenance requirement\nTRS515302 Supervise housekeeping services to guests\nTRS515303 Implement lost and found procedures\nTRS515304 Supervise laundry of linen, uniform and guest clothes\n\n--- PDF PAGE 6 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 2\nA person who has achieved this Qualification is competent to be a:\n\n❑ Housekeeping Supervisor\n❑ Public Area Supervisor\n❑ Linen/Uniform Supervisor\n❑ Laundry Supervisor\n❑ Floor Supervisor\n\n--- PDF PAGE 7 ---\nHousekeeping NC III Revision 01 Promulgated (10/15/2019) 3"
