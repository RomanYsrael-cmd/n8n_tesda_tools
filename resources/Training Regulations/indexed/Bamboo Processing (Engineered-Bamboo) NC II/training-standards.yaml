 DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n shall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\nInstitution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can be\nreferred to the Implementing Rules and Regulations of the DTS Law and the\nTESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\n\n--- PDF PAGE 133 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 129\n\ncomputer technologies or other modern technologies that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on this\nmode shall be issued by the TESDA Secretariat.\n\n• Distance learning may employ correspondence study, audio, video, computer\ntechnologies that can be used to facilitate learning and formal and non-formal\ntraining. Specific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• The classroom- based or in – center instruction uses of learner –centered\nmethods as well as laboratory or field- work components.\n\nEnterprise-Based:\n\n•\nFormal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n•\nInformal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement may\nbe written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is integrated into\nthe production process and apprentices learn by working alongside the\nexperienced craftsperson.\n\n•\nEnterprise-based Training - where training is implemented within the company\nin accordance with the requirements of the specific company. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n Community-Based\n\n• Short term programs conducted by non- government organizations NGOs,\nLGUs, training centers and other TVET providers which are intended to\naddress the specific needs of a community. Such programs can be conducted\nin informal settings such as barangay hall, basketball courts, etc. These\nprograms can also be mobile training 