ERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n shall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\nInstitution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can be\nreferred to the Implementing Rules and Regulations of the DTS Law and the\nTESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\n\n--- PDF PAGE 133 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 129\n\ncomputer technologies or other modern technologies that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on this\nmode shall be issued by the TESDA Secretariat.\n\n• Distance learning may employ correspondence study, audio, video, computer\ntechnologies that can be used to facilitate learning and formal and non-formal\ntraining. Specific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• The classroom- based or in – center instruction uses of learner –centered\nmethods as well as laboratory or field- work components.\n\nEnterprise-Based:\n\n•\nFormal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n•\nInformal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement may\nbe written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is integrated into\nthe production process and apprentices learn by working alongside the\nexperienced craftsperson.\n\n•\nEnterprise-based Training - where training is implemented within the company\nin accordance with the requirements of the specific company. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n Community-Based\n\n• Short term programs conducted by non- government organizations NGOs,\nLGUs, training centers and other TVET providers which are intended to\naddress the specific needs of a community. Such programs can be conducted\nin informal settings such as barangay hall, basketball courts, etc. These\nprograms can also be mobile training program (MTP)\n\n--- PDF PAGE 134 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 130\n\n3.3 TRAINEE ENTRY REQUIREMENTS\nTrainees or students who would like to enroll in this course should possess\nthe following requirements:\n•\nAble to read and write\n•\nAble to communicate, both orally and in writing\n•\nAble to perform simple computations\n\n3.4 TOOLS AND EQUIPMENT\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor BAMBOO PROCESSING (ENGINEERED BAMBOO) NC II.\nA. Tools, equipment and materials for Full Qualification\nTOOLS\nQty.\nDescription\n1 pc\nBamboo Pole Cutter - 2hp, 1hp, 220V, 60hz,\n80 TCT 14\" diameter\n1 pc\nCut-off Saw\n1 pc\nTwin Rip Saw - 3hp, 1ph, 220V, 60 Hz,\n40 TCT 12\" dia saw\n1 pc\nSplitting Machine\n3hp, 1ph, 220V, 60 Hz\n1 pc\nSlicing machine\n3hp, 1ph, 220V, 60 Hz\n\nMeasuring tools\n25 pcs\nDiameter gauge\n25 pcs\nMeasuring tape\n25 pcs\nCaliper\n25 pcs\nTri-square\n\nMarking tools\n25 pcs\nPencil\n1 box\nChalk\n25 pcs\nBolo\n\n25 pcs\nShaver\n25 pcs\nSizer\n25 pcs\nKnife\n25 pcs\nScissors\n25 pcs\nCutter\n5 pcs\nMixing bowl (20 liters Capacity\n5 pcs\nStirring rod\n1 Unit\nMoisture Meter\n25 pcs\nHammer\n5 pcs\nAdjustable wrench\n5 sets\nAllen wrench\n5 pairs\nPliers\n5 pcs\nFlat screw driver\n5 pcs\nPhilip screw driver\n\n--- PDF PAGE 135 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 131\n\n5 units\nGrease gun\n25 pcs\nOil dispenser\n1 unit\nVacuum cleaner\n\nClamps\n10 pcs\nBar clamp\n(3 ft)\n10 pcs\nC-clamp (10” opening)\n10 pcs\nF Clamp\n\n25 sets\nChisel (different sizes)\n25 pcs\nCoping saw\n25sets\nFile\n3 units\nPneumatic nailer\n3 units\nPneumatic tacker\n100 sets\nDowels\n5 pcs\nHand saw\n3 pcs\nPneumatic tucker\n5 pcs\nL-square\n5 pcs\nHand planer\n\n2 sets\nHole saw (1” – 21/4” diameter X 1/8” diameter\ninterval)\n3 units\nPortable drill\n1 unit\nPortable trimmer\n1 unit\nPo