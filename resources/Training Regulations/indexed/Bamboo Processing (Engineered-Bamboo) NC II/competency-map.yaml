  "source_text": "COMPETENCY MAP – AGRICULTURE, FORESTRY AND FISHERY SECTOR BAMBOO PROCESSING\n(ENGINEERED BAMBOO) NC II\n\n--- PDF PAGE 150 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 146\n\nSupervise\nagronomic\ncrop\nmaintenance\nProduce fruit\nbearing crops\nUndertake\nagronomical\ncrop\nmaintenance\nactivities\nImplement\nvertebrate pest\ncontrol\nprogram\nImplement a\nplant\nestablishment\nprogram\nMaintain the\nworkplace\nPerform post\nharvest\noperations of\nmajor tropical\nfruits\nUndertake\nagronomic\ncrop\nharvesting\nactivities\nMonitor and\noperate water\ntreatment\nprocesses\nTransport,\nhandle and\nstore\nchemicals\nSupport\nagronomic\ncrop work\nPerform post\nharvest\noperation of\nmajor lowland\nand semi-\ntemperate\nvegetable\ncrops\nSave, prepare\nand store\nagricultural\nseed\nCollect\nsamples for a\nrural\nproduction of\nhorticulture\nmonitoring\nprogram\nSupervise\nagricultural\ncrop\nestablishment\nSupport\nhorticultural\ncrop work\nPrepare land\nfor agricultural\ncrop\nproduction\nUndertake field\nbudding and\ngrafting\nSave, prepare\nand store\nagricultural\nseed\nImplement and\nmonitor quality\nassurance\nprocedures\nSupport\nirrigation work\nPrepare and\napply\nchemicals\nCoordinate a\nhorticultural\ncrop\nmaintenance\nprogram\nUndertake\nagronomic crop\nmaintenance\nactivities\nSupport and\nreview\nbusiness\nstructures and\nrelationships\nSupport\nnursery work\nimplement a\nplant nutrition\nprogram\nEstablish\nhorticultural\ncrops\nCoordinate\nmachinery and\nequipment\nmaintenance\nand repair for\nagricultural\ncrops\nPromote plant\nhealth\nConduct pre-\nhorticultural\nfarm\noperations\nControl weeds\nUndertake a\npropagation\nprogram\nOperate\npertigation\nequipment\nImplement and\nmonitor a\nproperty\nimprovement\nplan\nProduce\nvegetables\nImplement a\npost-harvest\nprogram\nCoordinate\nhorticultural\ncrop\nharvesting\nOperate within\na budget\nframework\nSupervise\nmaintenance of\nmachinery and\nequipment\nPlan &\nimplement a\nchemical use\nprogram\nEstablish\nagronomic\ncrops\nSupervise\nhorticultural\ncrop harvesting\nComply with\nindustry quality\nassurance\nrequirements\nKeep records\nfor a farm\nbusiness\nApply basic\nfirst aid\nImplement\nvertebrate pest\ncontrol\nprogram\nControl weeds,\npests and /or\ndiseases in\ncrops\nSupervise\nagronomic crop\nharvesting\nAnalyze and\ninterpret\nproduction\ndata\nConduct\nVariety and\nSeed Selection\nPerform Land\npreparation\nCarry-out Crop\nEstablishment\nManage crop\nConduct of\nHarvest and\nPost-Harvest\nOperations\nEstablish\nsugarcane\nnursery\nPlant\nsugarcane\nCare and\nmaintain\nsugarcane and\nratoon crops\nOperate\nNursery for oil\nPalm Plants\nGrow the Oil\nPalm Plants\nSeedlings\nHarvesting\nFresh Fruit\nBunch (FFB)\nPerform basic\nbamboo\nprocessing\n\nPerform kiln\ndrying\n\nPerform milling\noperation\n\nLaminate\nbamboo\nmaterials\n\nProduce\nengineered\nbamboo\n\nPerform\nfinishing\n\nPackage\nfinished\nproduct\n\nCORE COMPETENCY\n\n--- PDF PAGE 151 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 147\nGLOSSARY OF TERMS\nBASIC BAMBOO\nPROCESS\nThe process converting bamboo poles into semi-\nprocess bamboo materials like slats, slivers, dowels,\nstick, crushed bamboo.\nBAMBOO PANEL\na wide and elongated rectangular laminated bamboo\nuse for paneling and table tops.\nBAMBOO PLANKS\nLaminated bamboo slats ideal for flooring materials\nand furniture components. Its standard size is usually\nfour inches in width\nCOLD SETTING\nA synthetic resin that can harden at room temperature\nCULM\nthe stem of the bamboo consisting of the nodes and\ninternode.\nCURING TIME\nthe time needed for an adhesive to fully cure.\nDRYING END POINT\nThe point wherein the desired moisture level is\nachieved\nFINISH MILLING\nThe shaping of the laminated components to conform\nto the desired measurements.\nFIXING MATERIALS\nMaterials used in attaching furniture components like\nglues, nails, bolts, screws etc.\nLAYERED SLATS\nbamboo slats laminated tangentially\nMILLING PROCESS\nthe processing of bamboo slats or components into the\ndesired cross section using equipment such as\njointers, planers, and single or multiple spindles.\nUsually classified as rough milling or finish milling\nMIXING RATIO\nThe ratio of solvent and the solute like in preparing\npreservative\nsolution\nor\nin\npreparing\nfinishing\nmaterials.\nMOISTURE CONTENT\nthe amount of water in bamboo express in percentage\nof its dry weight.\nOSHS\nOccupational Safety and Health Standards\nPRESERVATIVES\nchemical\nused\nin\ntreating\nbamboo\nagainst\nbiodegrading organisms.\nPROFILING\nthe process of artistic outline or contour in the edges of\nbase boards ,frames and table tops.\nROUGH MILLING\nThe two surfaces of the slats are sorted by thickness\nor color and are planed accordingly with the usual\nthickness of 5-8 mm using a planer.\n\n--- PDF PAGE 152 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 148\nSETTING TIME\nthe amount of time the adhesive needs to form a good\nbond\nSLIVERS\na thin strip of bamboo cut lengthwise with the grain.\nUsually used in weaving mats.\nSPOKES\nThin rounded bamboo stick usually used in weaving\nSURFACE\nCONTAMINANTS\nthese are foreign materials present on the surface that is\ngoing to be finished.\nTHERMOS SETTING\nA synthetic resin that hardens when heats is induced.\nTONING\nA process in finishing to make the shade of the finish\nuniform.\nWANING\nthe process process of removing the cuticula of a bamboo\nslat prior to treatment\n\n--- PDF PAGE 153 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 149\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nBamboo Processing (Engineered Bamboo) NC II\nQualification Code:\nAFFBPE218\n\nRevision\nNo.\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nBamboo Processing\n(Engineered Bamboo) NC II\nNot Applicable\nTB No. 2019-05\nJanuary 11,\n2019\nIn Transit\nLegend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 154 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 150",
