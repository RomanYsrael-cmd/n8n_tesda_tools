  "source_text": "SECTION 1\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II QUALIFICATION\nThe BAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Qualification consists of\ncompetencies that a person must have in order to perform basic bamboo processing, carry-out\ntreatment of semi-processed bamboo materials, perform kiln drying, perform milling operation,\nlaminate bamboo materials, produce engineered bamboo, perform finishing and package\nfinished product.\nIt also includes competencies of a person must have to be able to practice occupational\nsafety procedures, 7S of Good Housekeeping and observing environmental rules and\nregulations in waste management in all farm activities.\nThis Qualification is packaged from the competency map of the Agriculture, Forestry and\nFishery Sector as shown in Annex A.\nThe Units of Competency comprising this Qualification include the following:\n\nA person who has achieved this Qualification is competent to be:\n\n• Engineered-bamboo processor\nUNIT CODE\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the workplace\n400311218\nPractice entrepreneurial skills in the workplace\nUNIT CODE\nCOMMON COMPETENCIES\nAFF321201\nApply Safety Measures in Farm Operations\nAFF321202\nUse Farm Tools and Equipment\nAFF321203\nPerform Estimation and Basic Calculation\nUNIT CODE\nCORE COMPETENCIES\nAFF752301\nPerform basic bamboo processing\nAFF752302\nCarry out treatment of semi-processed bamboo materials\nAFF752303\nPerform kiln drying\nAFF752304\nPerform milling operation\nAFF752305\nLaminate bamboo materials\nAFF752306\nProduce engineered bamboo\nAFF752307\nPerform finishing\n\n--- PDF PAGE 6 ---\nTESDA-QSO-SOP-01-F08\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019\n2"
