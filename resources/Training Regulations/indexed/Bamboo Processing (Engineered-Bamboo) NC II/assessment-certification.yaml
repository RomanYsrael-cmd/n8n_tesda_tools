  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the\nnational qualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence on all units of competency in a qualification with a promulgated\nTraining Regulations.\n\n4.1.2 A Certificate of Competency (CoC) is issued by the Authority to individuals\nwho were assessed as competent in a single unit or cluster of related units\nof competency.\n\nCOC 1\nPerform basic bamboo processing\nCOC 2\nCarry out treatment of semi-processed bamboo materials\nCOC 3\nPerform kiln drying\nCOC 4\nPerform milling and produce engineered bamboo\n• Perform milling operation\n• Produce engineered bamboo\nCOC 5\nLaminate bamboo materials\nCOC 6\nPerform Finishing\n\n4.1.3 Upon accumulation of the COCs acquired, an individual shall be issued the\ncorresponding National Certificate for the Qualification.\n4.1.4 Individuals wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the relevant unit/s of competency.\n\n4.1.5 The industry shall determine assessment and certification requirements for\neach qualification with promulgated Training Regulations. It includes the\nfollowing:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\nindustry\n\n--- PDF PAGE 148 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 144\n\n4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through a recognition/\nassessment process.\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior to assessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 149 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 145\n\nANNEX\n\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife\ndecisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and health\npolicies and\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial skills\nin the workplace\n\nApply safety measures in\nfarm operations\nUse farm tools and\nequipment\nPerform estimation and\ncalculation\nApply basic first aid\nProcess farm wastes\nCOMMON COMPETENCY\nBASIC COMPETENCY\nCOMPETENCY MAP – AGRICULTURE, FORESTRY AND FISHERY SECTOR BAMBOO PROCESSING\n(ENGINEERED BAMBOO) NC II\n\n--- PDF PAGE 150 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 146\n\nSupervise\nagronomic\ncrop\nmaintenance\nProduce fruit\nbearing crops\nUndertake\nagronomical\ncrop\nmaintenance\nactivities\nImplement\nvertebrate pest\ncontrol\nprogram\nImplement a\nplant\nestablishment\nprogram\nMaintain the\nworkplace\nPerform post\nharvest\noperations of\nmajor tropical\nfruits\nUndertake\nagronomic\ncrop\nharvesting\nactivities\nMonitor and\noperate water\ntreatment\nprocesses\nTransport,\nhandle and\nstore\nchemicals\nSupport\nagronomic\ncrop work\nPerform post\nharvest\noperation of\nmajor lowland\nand semi-\ntemperate\nvegetable\ncrops\nSave, prepare\nand store\nagricultural\nseed\nCollect\nsamples for a\nrural\nproduction of\nhorticulture\nmonitoring\nprogram\nSupervise\nagricultural\ncrop\nestablishment\nSupport\nhorticultural\ncrop work\nPrepare land\nfor agricultural\ncrop\nproduction\nUndertake field\nbudding and\ngrafting\nSave, prepare\nand store\nagricultural\nseed\nImplement and\nmonitor quality\nassurance\nprocedures\nSupport\nirrigation work\nPrepare and\napply\nchemicals\nCoordinate a\nhorticultural\ncrop\nmaintenance\nprogram\nUndertake\nagronomic crop\nmaintenance\nactivities\nSupport and\nreview\nbusiness\nstructures and\nrelationships\nSupport\nnursery work\nimplement a\nplant nutrition\nprogram\nEstablish\nhorticultural\ncrops\nCoordinate\nmachinery and\nequipment\nmaintenance\nand repair for\nagricultural\ncrops\nPromote plant\nhealth\nConduct pre-\nhorticultural\nfarm\noperations\nControl weeds\nUndertake a\npropagation\nprogram\nOperate\npertigation\nequipment\nImplement and\nmonitor a\nproperty\nimprovement\nplan\nProduce\nvegetables\nImplement a\npost-harvest\nprogram\nCoordinate\nhorticultural\ncrop\nharvesting\nOperate within\na budget\nframework\nSupervise\nmaintenance of\nmachinery and\nequipment\nPlan &\nimplement a\nchemical use\nprogram\nEstablish\nagronomic\ncrops\nSupervise\nhorticultural\ncrop harvesting\nComply with\nindustry quality\nassurance\nrequirements\nKeep records\nfor a farm\nbusiness\nApply basic\nfirst aid\nImplement\nvertebrate pest\ncontrol\nprogram\nControl weeds,\npests and /or\ndiseases in\ncrops\nSupervise\nagronomic crop\nharvesting\nAnalyze and\ninterpret\nproduction\ndata\nConduct\nVariety and\nSeed Selection\nPerform Land\npreparation\nCarry-out Crop\nEstablishment\nManage crop\nConduct of\nHarvest and\nPost-Harvest\nOperations\nEstablish\nsugarcane\nnursery\nPlant\nsugarcane\nCare and\nmaintain\nsugarcane and\nratoon crops\nOperate\nNursery for oil\nPalm Plants\nGrow the Oil\nPalm Plants\nSeedlings\nHarvesting\nFresh Fruit\nBunch (FFB)\nPerform basic\nbamboo\nprocessing\n\nPerform kiln\ndrying\n\nPerform milling\noperation\n\nLaminate\nbamboo\nmaterials\n\nProduce\nengineered\nbamboo\n\nPerform\nfinishing\n\nPackage\nfinished\nproduct\n\nCORE COMPETENCY\n\n--- PDF PAGE 151 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 147\nGLOSSARY OF TERMS\nBASIC BAMBOO\nPROCESS\nThe process converting bamboo poles into semi-\nprocess bamboo materials like slats, slivers, dowels,\nstick, crushed bamboo.\nBAMBOO PANEL\na wide and elongated rectangular laminated bamboo\nuse for paneling and table tops.\nBAMBOO PLANKS\nLaminated bamboo slats ideal for flooring materials\nand furniture components. Its standard size is usually\nfour inches in width\nCOLD SETTING\nA synthetic resin that can harden at room temperature\nCULM\nthe stem of the bamboo consisting of the nodes and\ninternode.\nCURING TIME\nthe time needed for an adhesive to fully cure.\nDRYING END POINT\nThe point wherein the desired moisture level is\nachieved\nFINISH MILLING\nThe shaping of the laminated components to conform\nto the desired measurements.\nFIXING MATERIALS\nMaterials used in attaching furniture components like\nglues, nails, bolts, screws etc.\nLAYERED SLATS\nbamboo slats laminated tangentially\nMILLING PROCESS\nthe processing of bamboo slats or components into the\ndesired cross section using equipment such as\njointers, planers, and single or multiple spindles.\nUsually classified as rough milling or finish milling\nMIXING RATIO\nThe ratio of solvent and the solute like in preparing\npreservative\nsolution\nor\nin\npreparing\nfinishing\nmaterials.\nMOISTURE CONTENT\nthe amount of water in bamboo express in percentage\nof its dry weight.\nOSHS\nOccupational Safety and Health Standards\nPRESERVATIVES\nchemical\nused\nin\ntreating\nbamboo\nagainst\nbiodegrading organisms.\nPROFILING\nthe process of artistic outline or contour in the edges of\nbase boards ,frames and table tops.\nROUGH MILLING\nThe two surfaces of the slats are sorted by thickness\nor color and are planed accordingly with the usual\nthickness of 5-8 mm using a planer.\n\n--- PDF PAGE 152 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 148\nSETTING TIME\nthe amount of time the adhesive needs to form a good\nbond\nSLIVERS\na thin strip of bamboo cut lengthwise with the grain.\nUsually used in weaving mats.\nSPOKES\nThin rounded bamboo stick usually used in weaving\nSURFACE\nCONTAMINANTS\nthese are foreign materials present on the surface that is\ngoing to be finished.\nTHERMOS SETTING\nA synthetic resin that hardens when heats is induced.\nTONING\nA process in finishing to make the shade of the finish\nuniform.\nWANING\nthe process process of removing the cuticula of a bamboo\nslat prior to treatment\n\n--- PDF PAGE 153 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 149\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nBamboo Processing (Engineered Bamboo) NC II\nQualification Code:\nAFFBPE218\n\nRevision\nNo.\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nBamboo Processing\n(Engineered Bamboo) NC II\nNot Applicable\nTB No. 2019-05\nJanuary 11,\n2019\nIn Transit\nLegend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 154 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 150\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) would like\nto recognize the commitment of industry stakeholders who shared their time and expertise\nfor the development of this Training Regulations.\n• THE TECHNICAL EXPERT PANEL (TEP)\n\nMR. ELVIN T. DIMASU-AY\nTechnical Expert\nBamboo and Wood Manufacturing\n\nMR. RENATO E. PAMATIAN\nTechnical Expert\nWood and Bamboo Furniture Manufacturer\n\nMR. ALLAN B. SAYABOC\nTechnical Expert\nBamboo Processing\n\nFRANCIS KATSUMI M. GONSALEZ\nTechnical Expert\nBamboo Processing\n\n• THE PARTICIPANTS IN THE NATIONAL VALIDATION OF THIS TRAINING\nREGULATION:\n\nLUBAO, PAMPANGA\n\nILIGAN CITY\n\nMR. MARAINO Y. GALARRITA\nTechnical Expert\nLubao Bamboo Hub\nSta. Catalina, Lubao, Pampanga\n\nMR. CASTULO E. CASINO\nTechnical Expert\nHomebiz Crafts Bamboo Hub\nLuinab, Iligan City\nMR. FRNACIS KATSUMI M. GONZALES\nTechnical Expert\nCabaluyan Bamboo (C Bamboo)\nMangatarem Pangasinan\n\nMR. ROBERT L. PALOMARES\nTechnical Expert\nHomebiz Crafts Bamboo Hub\nLuinab, Iligan City\nMR. MARLO N. DE GUZMAN\nTechnical Expert\nMR. WILFREDO H. ROJERO\nTechnical Expert\n\n--- PDF PAGE 155 ---\n