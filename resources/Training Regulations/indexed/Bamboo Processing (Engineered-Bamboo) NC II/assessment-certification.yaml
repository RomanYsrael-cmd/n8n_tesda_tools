  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the\nnational qualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence on all units of competency in a qualification with a promulgated\nTraining Regulations.\n\n4.1.2 A Certificate of Competency (CoC) is issued by the Authority to individuals\nwho were assessed as competent in a single unit or cluster of related units\nof competency.\n\nCOC 1\nPerform basic bamboo processing\nCOC 2\nCarry out treatment of semi-processed bamboo materials\nCOC 3\nPerform kiln drying\nCOC 4\nPerform milling and produce engineered bamboo\n• Perform milling operation\n• Produce engineered bamboo\nCOC 5\nLaminate bamboo materials\nCOC 6\nPerform Finishing\n\n4.1.3 Upon accumulation of the COCs acquired, an individual shall be issued the\ncorresponding National Certificate for the Qualification.\n4.1.4 Individuals wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the relevant unit/s of competency.\n\n4.1.5 The industry shall determine assessment and certification requirements for\neach qualification with promulgated Training Regulations. It includes the\nfollowing:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\nindustry\n\n--- PDF PAGE 148 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 144\n\n4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through a recognition/\nassessment process.\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate and\nthe assessor determine what evidence is available, where gaps exist,\nincluding readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior to assessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 149 ---\nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00 Promulgated 01/11/2019 145\n\nANNEX\n\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife\ndecisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and health\npolicies and\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial skills\nin the workplace\n\nApply safety measures in\nfarm operations\nUse farm tools and\nequipment\nPerform estimation and\ncalculation\nApply basic first aid\nProcess farm wastes\nCOMMON COMPETENCY\nBASIC COMPETENCY\n"
}
