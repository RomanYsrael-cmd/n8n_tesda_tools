ications \nand OSHS Rule \n1070 and Rule \n1080 \n- \nRule 1080 – \nPersonal \nProtective \nEquipment \nand Devices \n \n \n4. Perform \npost \nfinishing \nactivities \n 4.1 Quality control \nof end-products \nis employed \nbased on \nproduct \nspecifications \nand OSHS Rule \n1080 \n 4.2 Corrective \nmeasures are \napplied based \non product \nspecifications \nand OSHS Rule \n1080 \n 4.3 Finished \nproducts are \npacked \nfollowing \nestablished \nindustry \nprocedures and \nOSHS Rule \n1080 and Rule \n1150 \n 4.4 Tools and \nmachines are \nmaintained and \nstored following \nworkplace \nprocedure and \nOSHS Rule \n1080 \n 4.5 Inventory and \nstorage of \n4.1 Quality control \n4.2 Corrective measure \n4.3 Quality control \nprocedures \nMaintenance and \nStoring procedures \n4.4 Mensuration and \nestimation  \n4.5 Following job \nspecifications \n4.6 RA 9003-Ecological \nSolid Waste \nManagement Act of \n2000 \n4.7 RA 6969-Toxic \nSubstances and \nHazardous and \nNuclear Wastes \nControl Act of 1990 \n4.8 RA 9275 – Clean \nWater Act of 2004 \n4.9 OSHS \n- \nRule 1070 – \nOccupational \nHealth and \nEnvironmental \nControl \n- \nRule 1080 – \nPersonal \nProtective \nEquipment \nand Devices \n4.1 Employing quality \ncontrol \n4.2 Applying corrective \nmeasures \n4.3 Maintaining and \nstoring tools, and \nmachines \n4.4 Practicing safety \nmeasures following \nOSHS \n4.5 Oral and written \nreporting \n4.6 Practicing \nprinciples of 5S of \nGood \nhousekeeping\n\n--- PDF PAGE 94 ---\nTESDA-QSO-SOP-01-F08 \nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00            Promulgated       01/11/2019                       90 \nsupplies and \nmaterials are \ndone following \nworkplace \nprocedures and \nOSHS Rule \n1080 and Rule \n1150 \n 4.6 Workplace is \nrestored \naccording \nfollowing \nprinciples of 5S \nof Good \nHousekeeping. \n 4.7 Documentation \nand report \npreparation is \ndone according \nto work \nrequirements. \n 4.8 Waste \nmanagement is \npracticed \nac