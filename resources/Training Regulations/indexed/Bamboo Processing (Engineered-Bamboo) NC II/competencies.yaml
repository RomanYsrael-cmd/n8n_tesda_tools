        "source_title": "WORK IN A TEAM ENVIRONMENT",
        "source_text": "--- PDF PAGE 11 ---\nTESDA-QSO-SOP-01-F08 \nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00            Promulgated       01/11/2019                       \n7 \nUNIT OF COMPETENCY \n \n: \nWORK IN A TEAM ENVIRONMENT \n \nUNIT CODE                 \n \n:     \n400311211 \n \nUNIT DESCRIPTOR \n       : \nThis unit covers the skills, knowledge and \n \n  \n \nattitudes to identify one’s roles and  \n \n  \n \nresponsibilities as a member of a team. \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Describe \nteam role \nand scope \n1.1  The role and objective \nof the team is \nidentified from \navailable sources of \ninformation \n1.2   Team parameters, \nreporting relationships \nand responsibilities \nare identified from \nteam discussions and \nappropriate external \nsources  \n1.1 Group \nstructure \n1.2 Group \ndevelopment \n1.3 Sources of \ninformation \n1.1 Communicating \nwith others, \nappropriately \nconsistent with the \nculture of the \nworkplace \n1.2 Developing ways \nin improving work \nstructure and  \nperforming \nrespective roles in \nthe group or \norganization \n2.  Identify one’s \nrole and \nresponsibility \nwithin a team \n2.1  Individual roles and \nresponsibilities within \nthe team environment \nare identified \n2.2  Roles and objectives \nof the team is \nidentified from \navailable sources of \ninformation            \n2.3 Team parameters, \nreporting relationships \nand responsibilities \nare identified based \non team discussions \nand appropriate \nexternal sources \n2.1 Team roles \nand \nobjectives  \n2.2 Team \nstructure and \nparameters \n2.3 Team \ndevelopment \n2.4    Sources of \ninformation \n \n2.1 Communicating \nwith others, \nappropriately \nconsistent with the \nculture of the \nworkplace \n2.2 Developing ways \nin improving work \nstructure and  \nperforming \nrespective roles in \nthe group or \norganization\n\n--- PDF PAGE 12 ---\nTESDA-QSO-SOP-01-F08 \nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00            Promulgated       01/11/2019                       \n8 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms \nare elaborated in \nthe Range of \nVariables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3.   Work as a   \nteam \nmember \n3.1  Effective and \nappropriate \nforms of \ncommunications \nare used and \ninteractions \nundertaken with \nteam members \nbased on \ncompany \npractices.  \n3.2  Effective and \nappropriate \ncontributions \nmade to \ncomplement \nteam activities \nand objectives, \nbased on \nworkplace \ncontext \n3.3  Protocols in \nreporting are \nobserved based \non standard \ncompany \npractices.  \n3.4  Contribute to the \ndevelopment of \nteam work plans \nbased on an \nunderstanding \nof  team’s role \nand objectives \n \n3.1   Communication \nProcess \n3.2   Workplace \ncommunication \nprotocol \n3.3   Team planning and \n  decision making \n3.4    Team thinking \n3.5   Team roles \n3.6  Process of team \ndevelopment \n3.7 Workplace context \n \n \n \n3.1   Communicating \nappropriately, \nconsistent with the \nculture of the \nworkplace \n3.2   Interacting \neffectively with \nothers \n3.3 Deciding as an \nindividual and as \na group using \ngroup think \nstrategies and \ntechniques \n3.4 Contributing to \nResolution of \nissues and \nconcerns\n\n--- PDF PAGE 13 ---\nTESDA-QSO-SOP-01-F08 \nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00            Promulgated       01/11/2019                       \n9 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Role and objective of \nteam  \nMay include but not limited to: \n1.1. \nWork activities in a team environment with \nenterprise or specific sector \n1.2. \nLimited discretion, initiative and judgement maybe \ndemonstrated on the job, either individually or in a \nteam environment \n2. Sources of information \nMay include but not limited to: \n2.1. \nStandard operating and/or other workplace \nprocedures \n2.2. \nJob procedures \n2.3. \nMachine/equipment manufacturer’s specifications \nand instructions \n2.4. \nOrganizational or external personnel \n2.5. \nClient/supplier instructions \n2.6. \nQuality standards \n2.7. \nOHS and environmental standards \n3. Workplace context \nMay include but not limited to: \n3.1. \nWork procedures and practices \n3.2. \nConditions of work environments \n3.3. \nLegislation and industrial agreements \n3.4. \nStandard work practice including the storage, safe \nhandling and disposal of chemicals \n3.5. \nSafety, environmental, housekeeping and quality \nguidelines\n\n--- PDF PAGE 14 ---\nTESDA-QSO-SOP-01-F08 \nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00            Promulgated       01/11/2019                       10 \n EVIDENCE GUIDE \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1  Worked in a team to complete workplace activity \n1.2 \nWorked effectively with others \n1.3 \nConveyed information in written or oral form \n1.4 \nSelected and used appropriate workplace language \n1.5 \nFollowed designated work plan for the job \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Access to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2 Materials relevant to the proposed activity or tasks \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nRole play involving the participation of individual member to \nthe attainment of organizational goal \n3.2 \nCase studies and scenarios as a basis for discussion of  \nissues and strategies in teamwork \n3.3 \nSocio-drama and socio-metric methods \n3.4 \nSensitivity techniques \n3.5 \nWritten Test \n4. Context for \nAssessment \n4.1 \nCompetency may be assessed in workplace or in a \nsimulated workplace setting \n4.2 \nAssessment shall be observed while task are 