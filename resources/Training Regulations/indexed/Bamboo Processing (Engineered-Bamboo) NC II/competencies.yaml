3.2.12 Circular saw with sliding table \n3.2.13 Bench drill \n3.2.14 Planner blade sharpening machine \n3.2.15 Universal tool grinder (glossary) \n3.2.16 Double-end tenoner  \n3.2.17 Stationary router \n3.2.18 Mortizer  \n3.2.19 Portable drill \n          3.2.19.1 Hand drill \n         3.2.19.2 Electric drill \n4. Supplies  \nSupplies may include: \n 4.1 \nMachine oil \n 4.2 \nGrease \n 4.3 \nCotton Rags  \n 4.4 \nSand paper \n 4.5 \nBlades  \n 4.6 \nDrill bits \n 4.7 \nPPE’s \n5. Machine mechanisms  Machine mechanisms may include \n5.1. \nGuide fence \n5.2. \nStopper \n5.3. \nBlade guards \n6. Industry guidelines \nIndustry guidelines may include:  \n6.1 Manufacturer’s Manual \n6.2 Air Emission Standards \n6.3 RA 9003-Ecological Solid Waste Management Act of 2000  \n6.4 OSHS  \n6.4.1 Rule 1080  \n6.4.2 Rule 1150\n\n--- PDF PAGE 75 ---\nTESDA-QSO-SOP-01-F08 \nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00            Promulgated       01/11/2019                       71 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Conducted pre-milling operations \n1.2. Set-up machine for milling operation \n1.3. Performed milling \n1.4. Performed post milling activities \n1.5. Practiced safety measures \n2. Resource Implications \nThe following resources should be provided: \n2.1. Simulated or actual milling operation area \n2.2. Materials, tools, equipment and machine relevant to the task \nto be demonstrated \n2.3. PPEs \n2.4. References and materials \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Direct Observation \n3.2. Demonstration \n3.3. Oral questioning \n3.4. Written test \n3.5. Third party report \n4.Context of Assessment \n 4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center in a \nsimulated workplace setting.\n",
