eracting \nwith people of various \nlevels in the workplace \n1.7 Gathering and \nproviding basic \ninformation in \nresponse to workplace \nrequirements\n\n--- PDF PAGE 7 ---\nTESDA-QSO-SOP-01-F08 \nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00            Promulgated       01/11/2019                       \n3 \ncolleagues are \nidentified and \nfollowed \n1.6  Defined workplace \n       procedures for the \nlocation and \nstorage of \ninformation are used \n      1.7  Personal \ninteraction is carried \nout clearly and \nconcisely \n1.8 Workplace \netiquette \n \n \n1.8 Basic business writing \nskills \n1.9 Interpersonal skills in \nthe workplace \n1.10 Active-listening skills \n \n \n \n2.  Perform \nduties \nfollowing \nworkplace \ninstructions   \n2.1 Written notices and \ninstructions are read \nand   interpreted in \naccordance with \norganizational \nguidelines \n2.2 Routine written \ninstruction are \nfollowed based on \nestablished \nprocedures \n2.3 Feedback is given to \nworkplace \nsupervisor based \ninstructions/ \ninformation received \n2.4 Workplace \ninteractions are \nconducted in a \ncourteous manner \n2.5 Where necessary, \nclarifications about \nroutine workplace \nprocedures and \nmatters concerning \nconditions of \nemployment are \nsought and asked \nfrom appropriate  \n      sources  \n2.6  Meetings outcomes \nare interpreted and \nimplemented \n2.1 Effective verbal \nand non-verbal \ncommunication \n2.2 Different modes of \ncommunication  \n2.3 Medium of \ncommunication in \nthe workplace \n2.4 Organizational/ \nWorkplace \npolicies \n2.5 Communication \nprocedures and \nsystems \n2.6 Lines of \ncommunication \n2.7 Technology \nrelevant to the \nenterprise and the \nindividual’s work \nresponsibilities \n2.8 Effective \nquestioning \ntechniques \n(clarifying and \nprobing) \n2.9 Workplace \netiquette \n \n  \n2.1  Following simple \nspoken instructions  \n2.2  Performing routine \nworkplace duties \nfollowing simple \nwritten notic