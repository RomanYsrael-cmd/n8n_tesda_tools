        "source_text": "--- PDF PAGE 62 ---\nTESDA-QSO-SOP-01-F08 \nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00            Promulgated       01/11/2019                       58 \n \n \n \n \nUNIT OF COMPETENCY \n: PERFORM KILN DRYING \n \nUNIT CODE \n: AFF752303 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes   \nrequired to perform work activities involve in performing pre-\ndrying activities, loading kiln, drying kiln charge, unloading \nkiln charge and performing post drying activities. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE  \nREQUIRED SKILLS \n1. Perform \npre-drying \nactivities \n1.1 Semi-processed \nbamboo materials \nare prepared for drying \naccording to enterprise \nprocedures following \nOSHS Rule 1080 and \nRule 1150 \n1.2 Drying process is \nplanned based on \nsemi-processed \nbamboo materials to \nbe dried \n1.3 Drying Chamber is \ncleaned following \nstandard workplace \nprocedures and OSHS \nRule 1070, Rule 1080 \nand Rule1150 \n1.4 Kiln drying equipment \nand kiln dryer \naccessories are \nchecked for \nserviceability following \nOSHS Rule 1070, \nRule 1080, Rule 1150 \nand Rule 1210 \n1.5 Samples are selected \nbased on established \nsampling procedures \nfollowing OSHS Rule \n1080 \n1.1 Drying process \n1.2 Moisture content \n1.3 Types and parts of \nKiln Dryer \n1.4 Types of drying \nchamber \n1.5 Preparations of \nsemi processed \nbamboo materials \nfor drying \n1.6 Cleaning \nprocedures of drying \nchamber \n1.7 Checking of kiln \ndryer for \nserviceability  \n1.8 Sampling \nprocedures \n1.9 Uses and functions \nof moisture meter \n1.9.1 Calibration \nprocedures \n1.10 Methods in \nMoisture Content \nDetermination \n1.10.1Using \nweighing \nscales and \noven \n1.11 Uses and functions \nof tools, materials \nand equipment \n1.1 Preparing semi- \nprocessed \nbamboo materials \n1.2 Planning drying \nprocess \n1.3 Cleanin