ressor  \n2.2 laminating table with pneumatic press  \n2.3 laminating jigs \n2.4 glue spreader \n2.5 jack lifter \n3. Supplies \n3.1 Supplies may include:\n\n--- PDF PAGE 82 ---\nTESDA-QSO-SOP-01-F08 \nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00            Promulgated       01/11/2019                       78 \nVARIABLE \n \nRANGE \n \n3.2 Machine oil \n3.3 Grease \n3.4 Cotton Rags  \n3.5 Sand paper \n3.6 Glue \n3.7 Common nails \n3.8 Plastic cover \n3.9 ¾ inch X 4 ft. X 8 ft. plywood \n3.10 lumber (2X2inchX8ft) \n3.11 PPE’s \n4. Glue \nGlue may include: \n4.1 Thermo setting  \n4.2 Cold setting \n5. Laminating \nequipment \nLaminating equipment may include: \n5.1 Pneumatic press \n5.2 Hydraulic press \n5.3 Mechanical press/Clamp \n5.3.1 bar clamp \n5.3.2 c - clamp \n6. Glue spreader \nGlue spreader may include: \n6.1 Mechanized  \n6.2 Manual \n \n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Carried-out pre-lamination activities \n1.2 Set-up laminating equipment and accessories \n1.3 Applied glue \n1.4 Performed pressing \n1.5 Performed post-lamination activities \n1.6 Practiced safety measures \n2. Resource Implications \nThe following resources should be provided: \n2.1 Simulated or actual operation area \n2.2 Materials, tools, equipment and machine relevant to the task to \nbe demonstrated \n2.3 PPEs \n2.4 References and materials \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.3 Direct Observation \n3.4 Demonstration \n3.5 Oral interview and/or written test \n3.6 Third party report \n4.Context of Assessment \n 4.2 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center in a \nsimulated workplace setting.\n",
