        "source_title": "DEVELOP CAREER AND LIFE DECISIONS",
        "source_text": "--- PDF PAGE 19 ---\nTESDA-QSO-SOP-01-F08 \nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00            Promulgated       01/11/2019                       15 \nUNIT OF COMPETENCY : \nDEVELOP CAREER AND LIFE DECISIONS \nUNIT CODE  \n           :     400311213 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, and attitudes in \nmanaging one’s emotions, developing reflective practice, \nand boosting self-confidence and developing self-\nregulation. \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Manage one’s \nemotion \n1.1  Self-management \nstrategies are \nidentified \n1.2  Skills to work \nindependently and to \nshow initiative, to be \nconscientious, and \npersevering in the \nface of setbacks and \nfrustrations are \ndeveloped \n1.3  Techniques for \neffectively handling \nnegative emotions \nand unpleasant \nsituation in the \nworkplace are \nexamined \n \n \n \n1.1  Self-\nmanagement \nstrategies that \nassist in \nregulating \nbehavior and \nachieving \npersonal and \nlearning goals \n(e.g. Nine self-\nmanagement \nstrategies \naccording to \nRobert Kelley) \n1.2  Enablers and \nbarriers in \nachieving \npersonal and \ncareer goals \n1.3 Techniques in \nhandling \nnegative \nemotions and \nunpleasant \nsituation in the \nworkplace \nsuch as \nfrustration, \nanger, worry, \nanxiety, etc. \n1.1  Managing \nproperly one’s \nemotions and \nrecognizing \nsituations that \ncannot be \nchanged and \naccept them and \nremain \nprofessional \n1.2  Developing self-\ndiscipline, \nworking \nindependently \nand showing \ninitiative to \nachieve personal \nand career goals \n1.3  Showing \nconfidence, and \nresilience in the \nface of setbacks \nand frustrations \nand other \nnegative \nemotions and \nunpleasant \nsituations in the \nworkplace\n\n--- PDF PAGE 20 ---\nTESDA-QSO-SOP-01-F08 \nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00            Promulgated       01/11/2019                       16 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Develop \nreflective \npractice \n2.1 Personal strengths \nand achievements, \nbased on self-\nassessment \nstrategies and \nteacher feedback are \ncontemplated \n2.2 Progress when \nseeking and \nresponding to \nfeedback from \nteachers to assist \nthem in consolidating \nstrengths, addressing \nweaknesses and \nfulfilling their potential \nare monitored \n2.3 Outcomes of personal \nand academic \nchallenges by \nreflecting on previous \nproblem solving and \ndecision making \nstrategies and \nfeedback from peers \nand teachers are \npredicted \n2.1 Basic SWOT \nanalysis \n2.2 Strategies to \nimprove one’s \nattitude in the \nworkplace \n2.3 Gibbs’ Reflective \nCycle/Model \n(Description, \nFeelings, \nEvaluation, \nAnalysis, \nConclusion, and \nAction plan) \n2.1 Using the basic SWOT \nanalysis as self-\nassessment strategy \n2.2 Developing reflective \npractice through \nrealization of  \nlimitations,  likes/ \ndislikes;  through \nshowing of self-\nconfidence   \n2.3 Demonstrating self-\nacceptance and being \nable to accept \nchallenges \n \n3. Boost self-\nconfidence and \ndevelop self-\nregulation \n3.1 Efforts for continuous \nself-improvement are \ndemonstrated \n3.2 Counter-productive \ntendencies at work are \neliminated \n3.3 Positive outlook in life \nare maintained.   \n3.1 Four components of \nself-regulation \nbased on Self-\nRegulation Theory \n(SRT) \n3.2 Personality \ndevelopment \nconcepts \n3.3  Self-help concepts \n(e. g., 7 Habits by \nStephen Covey, \ntransactional \nanalysis, psycho-\nspiritual concepts) \n3.1 Performing effective \ncommunication skills – \nreading, writing, \nconversing skills \n \n3.2 Showing affective skills \n– flexibility, adaptability, \netc. \n \n3.3 Self-assessment for \ndetermining one’s \nstrengths and \nweaknesses\n\n--- PDF PAGE 21 ---\nTESDA-QSO-SOP-01-F08 \nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00            Promulgated       01/11/2019                       17 \n \n \n  RANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Self-\nmanagement \nstrategies \nMay include but not limited to: \n1.1 \nSeeking assistance in the form of job coaching or mentoring  \n1.2 \nContinuing dialogue to tackle workplace grievances \n1.3 \nCollective negotiation/bargaining for better working conditions \n1.4 \nShare your goals to improve with a trusted co-worker or \nsupervisor \n1.5 \nMake a negativity log of every instance when you catch yourself \ncomplaining to others \n1.6 \nMake lists and schedules for necessary activities \n2. Unpleasant \nsituation \nMay include but not limited to: \n2.1 \nJob burn-out \n2.2 \nDrug dependence \n2.3 \nSulking \n \n \n \n  EVIDENCE GUIDE \n1. Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 Express emotions appropriately \n1.2 Work independently and show initiative \n1.3 Consistently demonstrate self-confidence and self-discipline  \n2. Resource \nImplications \nThe following resources should be provided: \n2.1. Access to workplace and resource s \n2.2. Case studies  \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Demonstration or simulation with oral questioning \n3.2. Case problems involving work improvement and sustainability \nissues \n3.3. Third-party report \n4. Context for \nAssessment \n4.1. Competency assessment may occur in workplace or any \nappropriately simulated environment\n",
