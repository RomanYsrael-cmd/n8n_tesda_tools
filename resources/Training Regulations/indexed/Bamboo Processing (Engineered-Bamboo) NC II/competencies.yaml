        "source_text": "--- PDF PAGE 83 ---\nTESDA-QSO-SOP-01-F08 \nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00            Promulgated       01/11/2019                       79 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Conduct \npre-\nproduction \nactivities \n1.1 Product \nspecifications are \nconfirmed based on \nclient’s requirement \n1.2  Materials and \nsupplies are \nselected based on \nwork requirement \nand OSHS Rule \n1080 \n1.3 Tools, machines \nand equipment are \nprepared according \nto product \nspecification and \nOSHS Rule 1080 \nand Rule 1150 \n1.1 Product \nspecification \n1.2 Selection \nprocess \n1.3 Different tools, \nmachines and \nequipment \n1.4 Checking of \ntools \n1.5 Inspection \nprocedures \n1.6 Mensuration \nand estimation  \n1.7 Following job \nspecifications \n1.8 Waste \nManagement  \n1.9 OSHS \n- \nRule 1080 – \nPersonal \nProtective \nEquipment and \nDevices \n- \nRule 1150 – \nMaterials \nHandling and \nStorage \n \n1.2 Confirming \nproduct \nspecifications \n1.3 Selecting \nmaterials \n1.4 Preparing tools, \nmachines and \nequipment \n1.5 Practicing safety \nmeasures \nfollowing OSHS \n2. Produce \nproduct \ncomponents \n2.1 Drawing plan is \ninterpolated \nfollowing \nestablished industry \npractices \n2.2 Jigs are prepared \nbased on product \nspecifications and \n2.1 Interpolation of \ndrawing plan \n2.2 Lamination \nprocedure  \n2.3 Milling \noperations \n2.4 Shaping \noperation \n2.2 Interpolating \ndrawing plan \n2.3 Preparing jigs \n2.4 Laminating \nbamboo materials \n2.5 Performing milling \noperations \nUNIT OF COMPETENCY \n: PRODUCE ENGINEERED BAMBOO \n \nUNIT CODE \n: AFF752306 \nUNIT DESCRIPTOR \n \n: This unit covers the knowledge, skills and attitudes required \nto prepare pre-production activities, produce jigs, produce \nproduct components, perform profiling, make joineries, \nassemble product and p