nare operated \naccording to \noperation manual \nfollowing OSHS \nRule 1070, Rule \n1080 and Rule \n1210 \n3.4 Dimensions are \nchecked for \nconformity of job \nspecifications \nfollowing OSHS \nRule 1080  \n3.7 Following \nmanufacturer’s \nmanual \n3.8 Following job \nspecifications \n3.9 OSHS  \n- \nRule 1070 – \nOccupational \nHealth and \nEnvironmental \nControl \n- \nRule 1080 – \nPersonal \nProtective \nEquipment and \nDevices  \n- \nRule 1150 – \nMaterials \nHandling and \nStorage \n \n4. Perform post \nmilling \nactivities \n 4.1 Tools, are cleaned \nand inspected \nfollowing operation \nmanual and OSHS \nRule 1080 \n 4.2 Preventive \nmaintenance is \nconducted \nfollowing \nmanufacturer’s \nmanual and \nindustry \nguidelines \n 4.3 Work area is \nrestored following \nworkplace \nprocedures and \nindustry guidelines \n 4.4 Work activities and \noutputs are \nrecorded and \nreported to \nimmediate \nsupervisor \n4.1 Proper tools \nand equipment \nto be used \n4.2 Maintenance \nand storage \nprocedure of \ntools and \nequipment \n4.3 Preventive \nmaintenance \n4.4 Minor trouble \nshooting and \nrepair \n4.5 Record \nkeeping and \npreparation of \nreport \n4.6 Following \nmanufacturer’s \nmanual \n4.7 5S of Good \nHousekeeping \n4.8 Waste \nmanagement \n4.9 RA 9003-\nEcological \nSolid Waste \nManagement \nAct of 2000 \n4.10 OSHS  \n4.1 Cleaning and \ninspecting tool, \nmachines and \nequipment \n4.2 Restoring work \narea \n4.3 Recording and \nreporting work \nactivities and \noutputs \n4.4 Written and oral \nreporting \n4.5 Practicing safety \nmeasures following \nOSHS and RA \n9003 \n4.6 Performing \npreventive \nmaintenance \n4.7 Performing minor \nrepairs and \ntroubleshooting\n\n--- PDF PAGE 72 ---\nTESDA-QSO-SOP-01-F08 \nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00            Promulgated       01/11/2019                       68 \n- \nRule 1070 – \nOccupational \nHealth and \nEnvironmental \nControl \n- \nRule 1080 – \nPersonal \nProtective \