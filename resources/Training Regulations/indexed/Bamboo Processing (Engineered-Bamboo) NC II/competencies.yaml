          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Conduct \npre-\nproduction \nactivities \n1.1 Product \nspecifications are \nconfirmed based on \nclient’s requirement \n1.2  Materials and \nsupplies are \nselected based on \nwork requirement \nand OSHS Rule \n1080 \n1.3 Tools, machines \nand equipment are \nprepared according \nto product \nspecification and \nOSHS Rule 1080 \nand Rule 1150 \n1.1 Product \nspecification \n1.2 Selection \nprocess \n1.3 Different tools, \nmachines and \nequipment \n1.4 Checking of \ntools \n1.5 Inspection \nprocedures \n1.6 Mensuration \nand estimation  \n1.7 Following job \nspecifications \n1.8 Waste \nManagement  \n1.9 OSHS \n- \nRule 1080 – \nPersonal \nProtective \nEquipment and \nDevices \n- \nRule 1150 – \nMaterials \nHandling and \nStorage \n \n1.2 Confirming \nproduct \nspecifications \n1.3 Selecting \nmaterials \n1.4 Preparing tools, \nmachines and \nequipment \n1.5 Practicing safety \nmeasures \nfollowing OSHS \n2. Produce \nproduct \ncomponents \n2.1 Drawing plan is \ninterpolated \nfollowing \nestablished industry \npractices \n2.2 Jigs are prepared \nbased on product \nspecifications and \n2.1 Interpolation of \ndrawing plan \n2.2 Lamination \nprocedure  \n2.3 Milling \noperations \n2.4 Shaping \noperation \n2.2 Interpolating \ndrawing plan \n2.3 Preparing jigs \n2.4 Laminating \nbamboo materials \n2.5 Performing milling \noperations \nUNIT OF COMPETENCY \n: PRODUCE ENGINEERED BAMBOO \n \nUNIT CODE \n: AFF752306 \nUNIT DESCRIPTOR \n \n: This unit covers the knowledge, skills and attitudes required \nto prepare pre-production activities, produce jigs, produce \nproduct components, perform profiling, make joineries, \nassemble product and perform post production activities\n\n--- PDF PAGE 84 ---\nTESDA-QSO-SOP-01-F08 \nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00            Promulgated       01/11/2019                       80 \nOSHS Rule 1080 \nand Rule1150 \n2.3 Bamboo materials \nare laminated \nfollowing standard \nprocess and OSHS \nRule 1080 \n2.4 Milling operations \nare performed \naccording to \nrequired dimensions \nand OSHS Rule \n1080 and Rule 1210 \n2.5 Machines are used \nfollowing operations \nmanual and OSHS \nRule 1080 \n2.6 Component are \nshaped based on \nproduct \nspecifications and \nOSHS Rule 1080 \nand Rule 1070 \n2.5 Mensuration \nand estimation  \n2.6 Following job \nspecifications \n2.7 OSHS  \n- Rule 1070 – \nOccupational   \nHealth and \nEnvironmental \nControl  \n- Rule 1080 – \nPersonal \nProtective \nEquipment \nand Devices \n- Rule 1150 – \nMaterials \nHandling and \nStorage \n- Rule 1210 – \nElectrical \nSafety \n \n2.6 Operating \nmachines \n2.7 Shaping \ncomponents \n2.8 Practicing safety \nmeasures \nfollowing OSHS \n3. Perform \nprofiling \n3.1 Work piece is \nchecked for \nreadiness in \nprofiling based on \nestablished \nprocedures  \n3.2 Profile cutter and \nmachines are \nprepared according \nto work \nrequirements and \nOSHS Rule 1080 \n3.3 Tools and machines \nare used for \nprofiling following \nproduct \nspecifications, \nmanufacturer’s \nmanual and OSHS \nRule 1080 \n3.4 Sample cuts are \nproduced for design \nconformity based on \nproduct \nspecifications and \nOSHS Rule 1080 \n3.5 Adjustments are \nmade based on the \ntest run and OSHS \n3.1 Profile designs \n3.2 Profile Cutter \nand Machines \n3.3 Profiling \nprocedures \n3.4 Sample cutting \nprocedures \n3.5 Machine \noperation \n3.6 Mensuration \nand estimation  \n3.7 Following job \nspecifications \n3.8 OSHS  \n- Rule 1080 – \nPersonal \nProtective \nequipment \nand Devices \n- Rule 1150 – \nMaterials \nHandling and \nStorage \n3.1 Producing \nprototype \n3.2 Submitting \nprototype to \nimmediate \nsupervisor \n3.3 Interpreting profile \ndesign \n3.4 Checking work \npiece \n3.5 Preparing profile \ncutter and \nmachine \n3.6 Using tools and \nmachines \n3.7 Producing sample \ncuts \n3.8 Making \nadjustment \n3.9 Practicing safety \nmeasures \nfollowin