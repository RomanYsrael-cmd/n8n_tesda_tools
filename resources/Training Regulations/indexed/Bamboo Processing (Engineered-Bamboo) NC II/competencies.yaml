aterials \nPackaging materials may include but not limited to: \n8.1 Plastic bags (single film/laminates) \n8.2 Cartons (master/inner) \n8.3 Carton straps \n8.4 Packing tapes \n8.5 Old news paper \nPackaging tools may include but not limited to: \n8.6 Tape/Adhesive dispenser \n8.7 Cutter \n8.8 Scissor \n8.9 Portable strapper \n9. Environmental \nLaws \nEnvironmental laws may include: \n9.1 RA 9003-Ecological Solid Waste Management Act of 2000 \n9.2 RA 6969-Toxic Substances and Hazardous and Nuclear Wastes \nControl Act of 1990 \n9.3 RA 9275 – Clean Water Act of 2004\n\n--- PDF PAGE 97 ---\nTESDA-QSO-SOP-01-F08 \nBAMBOO PROCESSING (ENGINEERED BAMBOO) NC II Revision 00            Promulgated       01/11/2019                       93"
