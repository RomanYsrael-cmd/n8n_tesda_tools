  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.\nTo attain the National Qualification of Animal Health Care and\nManagement NC III, the candidate must demonstrate competence in all\nthe units listed in Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.2.\nThe qualification of Animal Health Care and Management NC III may\nhave specialization in either hog/pig/swine or cattle/ox.\n\n4..2.1. The qualification Animal Health Care and Management NC III\n(Hog/Pig/Swine) may be attained through accumulation of\nCOCs in the following areas. The possession of COC in the\nUnit of Competency – Raise Swine (Unit Code AGR621303)\nis a prerequisite for taking the assessment in these areas:\n\n4.2.1.1. Administer drugs and biologics\n4.2.1.1.1. Restrain and handle animals\n4.2.1.1.2 Administer drugs and biologics\n\n4.2.1.2. Apply bio-security measures\n4.2.1.2.1. Restrain and handle animals\n4.2.1.2.2. Apply bio-security measures\n\n4.2.1.3. Collect and handle specimen\n4.2.1.3.1. Restrain and handle animals\n4.2.1.3.2. Collect and handle specimen\n\n4.2.1.4. Handle and store drugs and biologics\n\n4.2.2 The qualification Animal Health Care and Management NC III\n(Cattle/Ox) may be attained through accumulation of COCs in\nthe following areas. The possession of COC in the Unit of\nCompetency\n–\nRaise\nLarge\nRuminants\n(Unit\nCode\nAGR621304) is a prerequisite for taking the assessment in\nthese areas:\n\n4.2.2.1 Administer drugs and biologics\n4.2.2.1.1. Restrain and handle animals\n4.2.2.1.2 Administer drugs and biologics\n\n4.2.2.2. Apply bio-security measures\n4.2.2.2.1. Restrain and handle animals\n4.2.2.2.2. Apply bio-security measures\n\n--- PDF PAGE 62 ---\n_____________________________________________________________________________\nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III\n\n\n60\n\n4.2.2.3. Collect and handle specimen\n4.2.2.3.1. Restrain and handle animals\n4.2.2.3.2 Collect and handle specimen\n\n4.2.2.4 Handle and store drugs and biologics\n\n4.3.\nAccumulation and submission of all COCs acquired for the relevant\nunits of competency comprising this qualification, an individual shall be\nissues the corresponding National Certificate\n4.4.\nAssessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.5.\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs\n\n4.4.2 Experienced Workers (wage employed or self-employed)\n\n4.6.\nThe guidelines on assessment and certification are discussed in detail\nin the Procedures Manual on Assessment and Certification and\nGuidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS).\n\n--- PDF PAGE 63 ---\n_____________________________________________________________________________\nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III\n\n\n61\n COMMON\nCOMPETENCIES\nAnimal Health Care and\nManagement NC III\nCollect\nand\nHandle\nSpecimen\nHandle\nand Store\nDrugs and\nBiologics\nAdminister\nDrugs and\nBiologics\nApply Bio-\nSecurity\nMeasures\nRestrain\nand\nHandle\nAnimal\n"
}
