      "text": "The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification and Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS). --- PDF PAGE 63 --- _____________________________________________________________________________ 61 Animal Health Care and Management NC III Collect and Handle Specimen Handle and Store Drugs and Biologics Administer Drugs and Biologics Apply Bio- Security Measures Restrain and Handle Animal Apply Safely Measures in farm operations Use Farm Tools and Equipment Perform Estimation and Basic Calculation Lead workplace communication Work with others Work in team environment Lead small teams Solve problems related to work activities Receive and respond to workplace communication Participate in workplace communication Apply problem solving techniques to workplace Plan and organize work Practice career professionalism Demonstrate work values Practice occupational health and safety procedures Develop and practice negotiation skills Use mathematical method Use relevant technologies Utilize specialized communication skills Develop team and individual Collect, analayze and organize information Promote environmental protection Practice basic housekeeping procedures --- PDF PAGE 64 --- _____________________________________________________________________________ 62 Anaphylactic Shock – manifested by the acute inflammation of an immunized animal when injected. The peculiar characters of these reactions are dependent upon the site of entry of the irritating agent, which is the vascular system in one instance and tissue spaces in the other. Calf – a newly born male or female cattle or buffalo Culling – is the removal of undesirable or inferior animals in the herd based on important economic traits and overall performance Gestation period – refers to the period of carrying the young in the womb Farrowing – refers to the period of giving birth in pigs or swine Dry animal – a sow or cow whose liter has been weaned but which has not yet been bred or is not pregnant Heifer – a young female cattle or buffalo Vaccination – a preventive measure to inoculate an animal with a mildly toxic preparation of bacteria or a virus of specific disease to prevent or to lessen the effects of the disease Weanling – refers to a young animal of either sex which has been separated from the mother at the end of the lactation period Livestock – domestic animals kept for use on a farm and raised for sale and profit Selection – refers to the process of choosing males and females with desirable characteristics for replacement stocks Biologics – agents, such as vaccines, that give immunity to diseases or harmful biotic stresses Drug – a substance used in the diagnosis, treatment, or prevention of a disease or as a component of a medication Specimen – a sample, as of tissue, blood, or urine, used for analysis and diagnosis Bio-security – security from transmission of infectious diseases, parasites and pests. Biosecurity threats come from the possible introduction of a disease into a herd or flock, which is not known to have the disease. The introduction of disease usually will be of non-intentional nature Subcutaneous – below or under the skin --- PDF PAGE 65 --- _____________________________________________________________________________ 63 BAI - Bureau of Animal Industry National Meat Inspection Service Philippine Animal Health Center AO - Administrative Order Standard Operating Procedure Department of Environment and Natural Resources Immunoflourescent Antibody Test Recognition of Prior Learning United TVET Program Registration and Accreditation System Technical Vocational Education and Training Dual Training System TQ - Trainer Qualification TM - Training Methodology Certificate of Competency NC - National Certificate Philippine TVET Qualification and Certification System --- PDF PAGE 66 --- ______________________________