 techniques \n2.6 Health and safety procedure \n2.7 Company policy in relation to relevant technology \n2.8 Different management concepts \n2.9 Technology adaptability \n3. Underpinning \nSkills \n3.1 Relevant technology application/implementation \n3.2 Basic communication skills \n3.3 Software applications skills \n3.4 Basic troubleshooting skills \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1 Relevant technology \n4.2 Interview and demonstration questionnaires \n4.3 Assessment packages \n5. Methods of \nAssessment \nCompetency must be assessed through: \n5.1 Interview \n5.2 Actual demonstration \n5.3 Authenticated portfolio (related certificates of \ntraining/seminar) \n6. Context of \nAssessment \n6.1 Competency may be assessed in actual workplace or \nsimulated environment\n\n--- PDF PAGE 23 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n21\n \nCOMMON COMPETENCIES \n \nUNIT TITLE \n: \nAPPLY SAFETY MEASURES IN FARM \nOPERATIONS \n \nUNIT CODE \n: \nAGR321201 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes \nrequired to perform safety measures effectively and \nefficiently. It includes identifying areas, tools, materials, \ntime and place in performing safety measures. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. \nDetermine areas of \nconcern for safety \nmeasures \n1.1 Work tasks are identified in line with farm operations \n1.2 Place for safety measures are determined in line with \nfarm operations \n1.3 Time for safety measures are determined in line with \nfarm operations \n1.4 Appropriate tools, materials and outfits are \nprepared in line with job requirements \n2. \nApply appropriate \nsafety measures \n2.1 Tools and materials are used according to \nspecifications and procedures \n2.2 Outfits are worn according to farm requirements \n2.3 Effectivity/shelf life/expiration of materials are strictly \nobserved \n2.4 Emergency procedures are known and followed to \nensure a safe work requirement \n2.5 Hazards in the workplace are identified and reported \nin line with farm guidelines \n3. \nSafekeep/dispose \ntools, materials and \noutfit \n3.1 Used tools and outfit are cleaned after use and stored \nin designated areas \n3.2 Unused materials are properly labeled and stored \naccording to manufacturers recommendation and \nfarm requirements \n3.3 Waste materials are disposed according to \nmanufacturers, government and farm requirements\n\n--- PDF PAGE 24 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n22\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Work tasks \nWork task may be selected from any of the subsectors: \n1.1 Animal Production \n1.2 Agri-marketing \n1.3 Farm Equipment \n2. Place \n2.1 Animal pens, cages, barns \n2.2 Stock room/storage areas/warehouse \n2.3 Field/farm/orchard \n3. Time \n3.1 Vaccination and medication period \n3.2 Feed mixing and feeding \n3.3 Harvesting and hauling \n3.4 Cleaning, sanitizing and disinfecting \n3.5 Dressing, butchering and castration \n4. Tools, materials and \noutfits \n4.1 Tools \n4.1.1 \nWrenches \n4.1.2 \nScrew driver \n4.1.3 \nPliers \n4.2 Materials \n4.2.1 \nBottles \n4.2.2 \nPlastic \n4.2.3 \nBags \n4.2.4 \nSyringe \n4.3 Outfit \n4.3.1 \nMasks \n4.3.2 \nGloves \n4.3.3 \nBoots \n4.3.4 \nOverall coats \n4.3.5 \nHat \n4.3.6 \nEye goggles \n5. Emergency procedures \n5.1 Location of first aid kit \n5.2 Evacuation \n5.3 Farm emergency procedures \n6. Waste materials \n6.1 Animal manure \n6.2 Waste water \n6.3 Syringes \n6.4 Unused farm chemicals e.g. pesticides, \nchemicals, fertilizers \n6.5 Expired reagents \n6.6 Dead animals \n7. Hazards \n7.1 Chemical \n7.2 Electrical \n7.3 Falls\n\n--- PDF PAGE 25 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n23\n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Determined areas of concern for safety measures \n1.2 Applied appropriate safety measures according to \nindustry requirements \n1.3 Prepared tools, materials and outfit needed \n1.4 Performed proper disposal of used materials \n1.5 Safekeep/cleaned tools, materials and outfit in \ndesignated facilities \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 \nSafety Practices \n2.1.1 Implementation of regulatory controls and policies \nrelative to treatment of area and application of \nchemicals \n2.1.2 Proper disposal of waste materials \n2.2 \nCodes and Regulations \n2.2.1 Compliance to health program of DOH and DENR \n2.2.2 Hazard identification \n2.2.3 Emergency procedures \n2.3 \nTools & Equipment: Uses and Specification \n2.3.1 Masks, gloves, boots, overall coats for health \nprotection \n2.4 \nMaintenance \n2.4.1 \nRegular check-up and repair of tools, materials \nand outfit before and after use \n3. Underpinning \nSkills \n3.1 Ability to recognize effective tools, materials and outfit \n3.2 Ready skills required to read labels, manuals and other \nbasic safety information \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 \nPractical demonstration \n4.2 \nThird Party Report \n5. Resource \nImplications \nThe following resources MUST be provided: \n5.1 \nFarm location \n5.2 \nTools, equipment and outfits appropriate in applying \nsafety measures \n6. Context of \nAssessment \n6.1 \nAssessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 26 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n24\n \nUNIT TITLE: \n \nUSE FARM TOOLS AND EQUIPMENT \n \nUNIT CODE: \n \nAGR321202 \n \nUNIT DESCRIPTOR: \nThis unit covers the knowledge, skills and attitudes \nrequired to use farm tools and equipment. It includes \nselection, operation and preventive maintenance of farm \ntools and equipment. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. \nSelect and use farm \ntools \n \n1.1 \nAppropriate farm tools are identified according to \nrequirement/use \n1.2 \nFarm tools are checked for faults and defective tools \nreported in accordance with farm procedures \n1.3 \nAppropriate tools and equipment are safely used \naccording to job requirements and manufacturers \nconditions \n2. \nSelect and operate \nfarm equipment \n2.1 Appropriate farm equipment are identified according \nto requirement/use \n2.2 Instructional manual of the farm tools and equipment \nare carefully read prior to operation \n2.3 Pre-operation check-up is conducted in line with \nmanufacturers manual \n2.4 Faults in farm equipment are identified and reported \nin line with farm procedures \n2.5 Farm equipment is used according to its function \n2.6 Safety procedures are followed according to standard \noperating procedures \n3. \nPerform preventive \nmaintenance \n3.1 \nTools and equipment are cleaned immediately after \nuse in line with farm procedures \n3.2 \nRoutine check-up and maintenance are performed \n3.3 \nTools and equipment are stored in designated areas \nin line with farm procedures\n\n--- PDF PAGE 27 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n25\n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Farm equipment \n \n1.1 Engine \n1.2 Pumps \n1.3 Generators \n1.4 Sprayers \n2. Farm tools \n2.1 Cutters \n2.2 Weighing scales \n2.3 Hand tools \n2.4 Measuring tools \n3. Pre-operation check-up \n3.1 Tires \n3.2 Brake fluid \n3.3 Fuel \n3.4 Water \n3.5 Oil \n3.6 Lubricants \n3.7 Battery\n\n--- PDF PAGE 28 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n26\n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Correctly identified appropriate farm tools and \nequipment \n1.2 Operated farm equipments according to manual \nspecification \n1.3 Performed preventive maintenance \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 Safety Practices \n2.1.1 Ideal good work habits to demonstrate to \nworkers easy and safety standards during \noperation of farm equipment \n2.2 Codes and Regulations \n2.2.1 Environmental Compliance Certificate (ECC) \n2.2.2 Effective work supervision in the operations of \nfarm equipment \n2.3 Tools & Equipment: Uses and Specification \n2.3.1 Knowledge in calibrating and use of equipment \n2.3.2 Safety keeping of equipment every after use \n2.4 \nMaintenance \n2.4.1 Regular upkeep of equipment \n2.4.2 Preventive maintenance skills \n2.5 \nValues \n2.5.1 Positive outlook towards work \n2.5.2 Possesses pre-emptive/anticipatory skills \n3. \nUnderpinning \nSkills \n3.1 Ability to recognized defective farm equipment \n3.2 Perform proper management practices of safety \nmeasures \n4. \nMethod of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 Direct observation \n4.2 Practical demonstration \n4.3 Third Party Report \n5. \nResource \nImplications \nThe following resources MUST be provided: \n5.1 Service/operational manual of farm tools and equipment \n5.2 Tools and equipment \n5.3 Farm implements \n6. \nContext of \nAssessment \n6.1 Assessment may occur in the workplace or in a \nsimulated workplace or as part of a team under limited \nsupervision\n\n--- PDF PAGE 29 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n27\n \n \nUNIT TITLE: \n \nPERFORM ESTIMATION AND CALCULATION \n \nUNIT CODE: \n \nAGR321203 \n \nUNIT DESCRIPTOR: \nThis unit covers the knowledge, skills and attitudes \nrequired to perform basic workplace calculations. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. \nPerform estimation \n1.1 Job requirements are identified from written or oral \ncommunications \n1.2 Quantities of materials and resources required to \ncomplete a work task are estimated \n1.3 The time needed to complete a work activity is \nestimated \n1.4 Accurate estimate for work completion are made \n1.5 Estimate of materials and resources are reported to \nappropriate person \n2. \nPerform basic \nworkplace \ncalculation \n2.1 Calculations to be made are identified according to \njob requirements \n2.2 Correct method of calculation identified \n2.3 System and units of measurement to be followed \nare ascertained \n2.4 Calculation needed to complete work tasks are \nperformed using the four basic process of addition, \ndivision, multiplication and subtraction \n2.5 Calculate whole fraction, percentage and mixed when \nare used to complete the instructions \n2.6 Number computed in self checked and completed for \nalignment\n\n--- PDF PAGE 30 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n28\n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. \nCalculations \n1.1 \nQuantity of feeds \n1.2 \nAmount of medicines \n2. \nMethod of calculation \n \n2.1 \nAddition \n2.2 \nSubtraction \n2.3 \nMultiplication \n2.4 \nDivision \n2.5 \nRatio and proportion \n3. \nSystem of measurement \n3.1 \nEnglish \n3.2 \nMetric \n4. \nUnits of measurement \n4.1 \nArea \n4.2 \nVolume \n4.3 \nWeight\n\n--- PDF PAGE 31 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n29\n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Performed estimation \n1.2 Performed basic workplace calculation \n1.3 Applied corrective measures as maybe necessary \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 \nMathematics \n2.1.1 Basic mathematical operations \n2.1.2 Percentage and ratios \n2.1.3 Unit Conversion \n2.1.4 Basic accounting principles and procedures \n2.1.4.1 Production cost \n2.1.4.2 Sales \n2.1.4.3 Accounts receivables/payables \n2.2 Systems, Processes and Operations \n2.2.1 Knowledge in different management practices and \noperational procedures \n2.3 \nValues \n2.3.1 Safety consciousness \n2.3.2 Time consciousness and management \n2.3.3 Cost consciousness \n2.3.4 Precision \n3. Underpinning \nSkills \n3.1 \nAbility to perform basic calculation \n3.2 \nCommunicate effectively \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 Practical demonstration \n4.2 Written examination \n5. Resource \nImplications \nThe following resources MUST be provided: \n5.1 \nRelevant tools and equipment for basic calculation \n5.2 \nRecommended data \n6. Context of \nAssessment \n6.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 32 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n30\n \n \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nRESTRAIN AND HANDLE LIVESTOCK \n \nUNIT CODE \n \n: \nAGR321301 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes \nrequired to restrain and handle livestock according to \nindustry standards and animal welfare. It includes \nselection of animals and evaluation of animal \nconditions, \nand \nselection \nand \napplication \nof \nappropriate handling and restraining technique. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Select animal and \nobserve its condition \n1.1 The candidate livestock is identified and selected \naccording to instructions and specifications from \nsupervisor or veterinarian \n1.2 The stage of production of identified animal is \ndetermined based on observation and records \n1.3 The prevailing condition is observed and reported in \nterms of animal grouping \n2. Apply appropriate \nhandling and \nrestraining technique \n2.1 Animal is handled following standard operating \nprocedures to minimize animal stress \n2.2 Restraining technique is selected based on the \ndegree of restraint needed \n2.3 Tools and equipment and supplies and materials \nare prepared according to restraining technique to be \napplied \n2.4 The chosen technique is executed in accordance with \nanimal welfare act\n\n--- PDF PAGE 33 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n31\n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Livestock \n1.1 Cattle \n1.2 Carabao \n1.3 Swine \n2. Stage of production \n2.1 Breeding animals/Dry \n2.2 Gestating/Pregnant \n2.3 Lactating \n2.4 Weanling/Weaner/Baby pig stage/Calf \n2.5 Growers/Finishers \n3. Animal grouping \n \n3.1 Individual penning \n3.2 Communal penning \n3.3 Rauge penning \n4. Tools and \nequipment \n4.1 Driving board \n4.2 Snoozer \n4.3 Rope \n4.4 Emasculator \n4.5 Castration table/Chute \n4.6 Sacks/Hoods \n4.7 Syringes (10ml, 20ml) \n5. Supplies and \nmaterials \n5.1 Medical supplies \n5.2 Syringe (disposable) \n5.3 Needles (G21, G18, G16) \n6. Restraining \ntechnique \n6.1 Chute restraint \n6.2 Snooze restraint \n6.3 Tranquilizer \n6.4 Use of driving board \n6.5 Electric probe \n6.6 “Hood” \n6.7 Cart/truck/push cart\n\n--- PDF PAGE 34 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n32\n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified stage of production of the animal \n1.2 Identified different restraining techniques for specific \nrestraining purposes \n1.3 Selected suitable handling and restraining technique \n1.4 Handled animal with minimal stress \n1.5 Prevented harm and undue risks to restrainer and \nrestrained animals \n1.6 Communicated and worked effectively with teams \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 Communication \n 2.1.1 Ability to follow instructions from the veterinarian \n2.2 Safety Practices \n2.2.1 Prevention of undue risks to restrainer and \nrestrained animal \n2.2.2 Implementation of procedures relative to proper \nhandling of animals, use and disposal of \nbiologics and other veterinary drugs and \nsupplies based on manufacturers specifications \nor veterinarian’s recommendations \n2.3 Tools and Equipment: Uses and Specification \n2.3.1 Driving board \n2.3.2 Snoozer \n2.3.3 Rope \n2.3.4 Castration table \n2.3.5 Sacks/hoods \n2.3.6 Syringe (10ml and 20 ml) \n2.4 Maintenance \n2.4.1 Regular check-up and repair of tools and \nequipment \n2.5 Systems, Processes and Operations \n2.5.1 Follow assigned instructions from veterinarian \n2.5.2 Compliance to SOP of acceptable restraining \npractices \n2.5.3 Knowledge of the different restraining \ntechniques \n2.6 Codes and Regulations \n2.6.1 Compliance with animal health programs and \nadministrative orders (AOs) of the BAI and \nNMIS \n2.6.2 Animal Welfare Act\n\n--- PDF PAGE 35 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n33\n2.7 Values \n2.7.1 Safety consciousness of self and target animal \n2.7.2 Personal integrity and perseverance in \nperforming routine job \n2.7.3 Appropriate use of restraining technique in \naccordance to the stages of production \n2.7.4 Consideration to non-target animals \n3. Underpinning \nSkills \n3.1 \nWork safety \n3.2 \nSkills in using tools and equipment \n3.3 \nCalculations \n3.4 \nCommunicate ideas and information \n4. Method of \nAssessment \nCompetency in this unit must be assessed through: \n4.1 \nObservation/Demonstration \n4.2 \nThird party report \n4.3 \nPortfolio \n5. Resource \nImplications \nThe following resources MUST be provided: \n5.1 \nSample animals \n5.2 \nSupplies and materials \n5.3 \nTools and equipment appropriate to restrain and \nhandle animals \n6. Context of \nAssessment \n6.1 Competency may be assessed individually in the \nworkplace or in a simulated workplace individually or \nas a part of a team under limited supervision\n\n--- PDF PAGE 36 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n34\n \nUNIT OF COMPETENCY : \nAPPLY BIO-SECURITY MEASURES \n \nUNIT CODE \n \n: \nAGR321302 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes \nrequired to apply bio-security measures in livestock \nfarm operations. It includes identifying bio-security \nthreats and hazards, applying disease prevention \npractices, applying prevention practices in disease \ntransmission and maintaining records. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Identify bio-security \nthreats and hazards \n1.1 \nImmediate threats to the health of the animal are \nidentified and reported based on observation \n1.2 \nBio-security threats are identified based on \nestablished organizational policy \n2. Apply disease \nprevention practices \n2.1 \nPreparation of supplies and materials and \napplication of disinfectants are done according to \nstandard operating procedures \n2.2 \nVehicle vats and foot vats are prepared and \nmonitored regularly according to standard operating \npractice \n2.3 \nHygiene and sanitation of farm, farm personnel and \nvisitors are followed based on standard operating \npractice \n2.4 \nAll types of vehicles and equipment entering the \nfarm are disinfected according to standard operating \nprocedures \n2.5 \nNew stocks to be introduced into the herd are \nquarantined and vaccinated according to standard \noperating procedures \n2.6 \nVaccination programs and health programs are \nimplemented as designed by veterinarian \n3. Apply preventive \ndisease transmission \npractices \n3.1 \nPreventive measures on notifiable diseases as \ndeclared by BAI are followed based on industry and \nBAI standard \n3.2 \nMedication and vaccination programs are followed \nstrictly as recommended by manufacturers and \nveterinarian \n3.3 \nHygiene and sanitation of farm, farm personnel and \nvisitors are followed based on standard operating \npractice\n\n--- PDF PAGE 37 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n35\n3.4 \nSick and unfit stocks are culled or isolated in \naccordance to animal welfare act or standard \noperating procedure \n3.5 \nDead stocks and by-products are disposed using \nproper disposal method \n3.6 \nCommunication with supervising veterinarian are \ndone regularly or as the need arise based on \nobservation \n4. Maintain records \n4.1 \nAppropriate records are kept, collated and updated \nregularly in accordance with organizational policy \n4.2 \nReporting to veterinarian or supervisor are carried \nout properly based on records \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Immediate threats \n1.1 Natural calamities \n1.2 Physical threat \n1.3 Unforeseen events (prevailing diseases, outbreaks) \n2. Bio-security threats \n2.1 Animals other than stocks being taken cared of \n2.2 Diseases \n2.2.1 Bacterial \n2.2.2 Viral diseases \n2.2.3 Parasitic diseases \n2.2.4 Parasitism \n2.3 Finished products/By-products of animal production \n2.4 Traffic flow of potential carriers \n2.4.1 People \n2.4.2 Stocks \n2.4.3 Equipment \n2.4.4 Vehicles \n2.5 Birds, pests and rodents \n3. Supplies and \nmaterials \n3.1 Syringes \n3.2 Needles \n3.3 Drugs and other medical supplies \n4. Tools and \nequipment \n4.1 Boots \n4.2 Rust remover \n4.3 Power sprayer \n4.4 Portable sprayer \n4.5 Torch\n\n--- PDF PAGE 38 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n36\n \n5. Disinfectants \n5.1 Chemical disinfectants \n5.1.1 Phenols \n5.1.2 Iodophore \n5.1.3 Aldehydes \n5.1.4 Organic salts \n5.1.5 Quarternary products \n5.1.6 Combined disinfectants \n5.2 Physical disinfectants \n5.2.1 Torch \n5.2.2 Disposable suits \n5.2.3 Boots \n5.2.4 Paints \n5.2.5 Rust remover \n5.3 Lime for animal disposal \n6. Stocks \n6.1 Replacement breeder \n6.2 Outsourced piglets/heifers \n6.3 Outsourced fatteners/bulls/cows \n7. Vaccination \nprogram \n7.1 Market pig program \n7.2 Breeder stocks program \n8. Health program \n8.1 Medication program \n8.2 Deworming program \n8.3 Deticking \n9. Sick and unfit \nstocks \n9.1 Listlessness \n9.2 Increase body temperature \n9.3 Loss appetite \n9.4 Solitary separation from the group \n9.5 Mucosal discharge on the eyes and snout \n9.6 Swollen body parts \n9.7 Appearance of vesicles \n10. Disposal method \n10.1 Bury animals \n10.2 Use mortality pit \n11. Appropriate records \n(Checklist) \n11.1 Livestock population \n11.2 Vaccination \n11.3 Medication \n11.4 Standard routine procedure\n\n--- PDF PAGE 39 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n37\n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified bio-security threats \n1.2 Properly prepared and applied disinfectants \n1.3 Implemented hygiene and sanitation practices for \nhimself and for the farm \n1.4 Implemented vaccination program \n1.5 Implemented proper health program \n1.6 Identified sick and unfit animals \n1.7 Performed quarantined and acclimatization procedure \n1.8 Disposed dead stocks or by-products properly \n1.9 Maintained records appropriately \n1.10Communicated and worked effectively wih others \n2. Underpinning \nKnowledge and \nAttitudes \n \n \n2.1 Communication \n2.1.1 Accomplishing the check list \n2.2 Safety Practices \n2.2.1 Knowledge in handling disinfectants and other \nveterinary supplies \n2.2.2 Knowledge of proper waste handling and \nmanagement \n2.3 Mathematics and Mensuration \n2.3.1 Proper calculation of inclusion rates of \ndisinfectants and chemicals \n2.4 Codes and Regulations \n2.4.1 Appropriate legal and supervising regulatory \nbody pertinent to bio-security program such as \nBAI, PAHC, and DENR \n2.5 Systems, Processes and Operations \n2.5.1 Selection of replacement or new stocks \n2.5.2 Implementation of appropriate animal health \nprogram \n2.6 Materials: Uses and Specifications \n2.6.1 Drugs and medical supplies \n2.6.2 Office supplies and materials – for regular \ninventory and monitoring of animal health \nprogram \n \n2.6.2.1. Tools and Equipment: Uses and Specifications \n A Rust remover \n B Power sprayer \n C Torch \n2.6.2.2. Values \nA Honesty in reporting \nB Confidence in selecting healthy replacement or \nnew stocks \nC Personal integrity and perseverance in \nperforming routine bio-security measures \n D Ability to work well with others harmoniously\n\n--- PDF PAGE 40 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n38\n \n \n3. Underpinning \nSkills \n3.1 Work safety \n3.2 Calculations \n3.3 Communicate effectively \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 Observation/Demonstration \n4.2 Third party report \n4.3 Portfolio \n5. Resource \nImplication \nThe following resources MUST be provided: \n5.1 Farm location with required facilities \n5.2 Supplies and materials applied for bio-security measures \n6. Context of \nAssessment \n6.1 Competency may be assessed individually in the actual \nworkplace or through accredited farms/institution\n\n--- PDF PAGE 41 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n39\n \nUNIT OF COMPETENCY : \nADMINISTER DRUGS AND BIOLOGICS \n \nUNIT CODE \n \n: \nAGR321303 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes \nrequired to administer drugs and biologics in livestock \nfarms. It includes preparation of supplies, materials, \ntools and equipment, preparation of animal, application \nof drugs and biologics, and monitoring and recording \nanimal response to drugs and biologics. It requires \nmore supervision from veterinarian. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare appropriate \nsupplies, materials, \ntools and equipment \n \n1.1 Availability of necessary supplies and materials are \nchecked and prepared according to standard operating \nprocedure \n1.2 Supplies and materials are transported to the pig \nhouse/pen using approved transport tools and \nequipment \n1.3 Availability of appropriate tools and equipment are \nchecked and prepared according to standard operating \nprocedure \n1.4 Tools and equipment are transported to the animal \nhouse/pen using approved transport tools and \nequipment \n2. Prepare animals \n2.1 Animals are prepared according to standard \norganizational procedures or based on animal health \nstatus \n2.2 Animals are restrained/handled using appropriate \nrestraining technique in accordance with the relevant \nprovisions of the Animal Welfare Act \n3. Apply drugs and \nbiologics \n3.1 Drugs and biologics are checked based on the \nmanufacturer’s or veterinarian’s recommendations \n3.2 Necessary precautions when administering drugs \nand biologics are checked according to \nmanufacturer’s or veterinarian’s recommendations \n3.3 The body weight of the animal is estimated (if the \nquantity to drug to be administered is based on weight) \n3.4 The route of administration is determined based on \nmanufacturer’s recommendation \n3.5 The drugs and biologics are administered to animals \naccording to standard operating procedures \n3.6 Used supplies and materials are disposed as need \nfollowing appropriate disposal method \n3.7 Reusable supplies and materials are cleaned, \ndisinfected and stored following standard operating \nprocedures\n\n--- PDF PAGE 42 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n40\n \n4. Monitor and record \nresponse to drugs and \nbiologics \n \n4.1 The name of drugs/biologics and dosage administered \nto the pigs are recorded on the animals’ respective \nrecord card \n4.2 Reactions/responses of the animal to the medication \nare checked at least twice a day. Observations are \nrecorded \n5. Record Data \n5.1 Biologics and drug inventories are updated \n5.2 Medication and vaccination programs are monitored \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Supplies \n1.1 \nDrugs \n1.1.1 Nutritional supplements \n1.1.1.1 \nVitamins and mineral \n1.1.1.2 Colostrums supplements \n1.1.2 Hormones \n1.1.3 Antibiotics \n1.1.4 Anthelmintics \n1.1.5 Electrolytes \n1.1.6 Growth promoters \n1.1.7 Probiotics \n1.1.8 Vial of epinephrine/adrenaline \n1.2 \nBiologics \n1.2.1 Vaccines \n1.2.2 Sera \n2. Materials \n(consumables) \n2.1 \nNeedles (hypodermic or disposable) \n2.2 \nSyringe (disposable) \n2.3 \nDisinfectant (iodine) \n2.4 \nCotton balls \n2.5 \nWriting implements (pen or chalk) \n2.6 \nAnimal marker \n2.7 \nRefrigerant/ice \n3. Tools and \nequipment \n3.1 \nPig (wire) restrainer \n3.2 \nDriving board \n3.3 \nSyringe (fiberglass, metal, automatic, self-refilling) \n3.4 \nCool box \n3.5 \nAllis tissue forceps \n3.6 \nMedication tray or cart\n\n--- PDF PAGE 43 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n41\n4. Animal health \nstatus \n4.1 \nFor routine application of vaccines and supplements \n4.2 \nFor treatment of sick or recumbent animals \n4.3 \nFor routine or emergency surgical procedures \n5. Restraining \ntechniques \n5.1 \nChute restraint \n5.2 \nSnooze restraint \n5.3 \nTranquilizer \n5.4 \nUse of driving board \n5.5 \nElectric probe \n5.6 \n“Hood” \n5.7 \nCart/truck/push cart \n6. Precautions when \nadministering \ndrugs and \nbiologics \n6.1 \nContraindication \n6.2 \nSpecial instructions \n6.3 \nSide-effects \n6.4 \nEffects on the animal health technician (e.g. some \ndrugs like etiproston should not be administered to \npigs by a pregnant person; some drugs like amitraz \nneed to be administered to pigs with protective \nclothing (gloves, mask) \n7. Veterinarian’s \nrecommendation \n7.1 \nGeneric name of drugs/biologics \n7.2 \nBrand name of drugs/biologics \n7.3 \nDosage \n7.4 \nRoute of administration \n8. Route of \nadministration \n8.1 \nIntramuscular \n8.2 \nSubcutaneous \n8.3 \nIntranasal \n8.4 \nIntradermal \n8.5 \nIntraperitoneal \n8.6 \nOral \n8.7 \nTopical \n9. Disposal method \n9.1 \nIncineration \n9.2 \nGarbage pit \n9.3 \nBury \n10. Reactions/ \nResponses \n10.1 Recovering \n10.2 Adverse reaction \n10.2.1 Anaphylactic shock \n10.2.2 Allergies \n10.2.3 Mild clinical conditions (shivering, tremors, \nlethargy) \n10.2.4 Pyrexia/Fever\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n42\n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1 Selected appropriate supplies, materials, tools and \nequipment in preparation for administration of drugs and \nbiologics \n1.2 Prepared and properly restrained pigs for administration \nof drugs and biologics \n1.3 Administered drugs and biologics with standard \nprocedures \n1.4 Monitored response to administration of drugs and \nbiologics \n1.5 Communicated and worked effectively with others \n2. Underpinning \nKnowledge and \nAttitudes \n \n \n \n2.1 Communication \n2.1.1 Preparation of report \n2.2 Safety Practices \n2.1.2 Proper handling, use and disposal of drugs and \nbiologics \n2.3 Mathematics and Mensuration \n2.3.1 \nWeight estimation \n2.4 Codes and Regulations \n2.4.1 \nCompliance to animal health program of the BAI, \nPAHC, NMIS, and DENR \n2.4.2 \nCompliance to the Animal Welfare Act \n2.5 Systems, Processes and Operations \n2.5.1 \nGeneral care and herd health management of \nlivestock \n2.5.2 \n Basic on-farm hygiene procedures \n2.6 Tools and Equipment: Uses and Specifications \n2.6.1 \nSyringe (fiberglass, metal, automatic, self-\nrefilling) \n2.6.2 \nAllis tissue forceps \n2.7 Maintenance \n2.7.1 \nRegular check-up and repair and replacement \n(as needed) of tools and equipments related to \nadministering drugs and biologics \n2.8 Materials: Uses and Specifications \n2.8.1 \nMedical supplies and materials \n2.8.2 \nOffice equipment and supplies for regular \nmonitoring of animal health performance \n2.9 \nValues \n2.9.1 \nTender loving care in handling animals \n2.9.2 \nSafety consciousness on handling drugs and \nbiologics and other biological \n2.9.3 \nWork dedication \n2.9.4 \nFollowing directions obediently \n2.9.5 \nPerseverance and industriousness on care and \nmanagement of the general herd\n\n--- PDF PAGE 45 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n43\n3 Underpinning Skills \n3.1 Work safety \n3.2 Skills in using tools and equipment \n3.3 Calculations \n3.4 Communicating ideas and information \n4 Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 Observation/Demonstration \n4.2 Third party report \n4.3 Portfolio \n5. Resource \nImplications \nThe following resources MUST be provided: \n5.1 \nFarm location \n5.2 \nSupplies, materials, tools and equipment needed in \nadministering drugs and biologics \n6. Context for \nAssessment \n \n6.1 \nCompetency maybe assessed individually in the \nworkplace or in a simulated workplace under limited \nsupervision\n\n--- PDF PAGE 46 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n44\n \nUNIT OF COMPETENCY : \nHANDLE AND STORE DRUGS AND \n \n \nBIOLOGICS \n \nUNIT CODE \n \n: \nAGR321304 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes \nrequired to handle and store drugs and biologics. It \nincludes preparation and transport of drugs and \nbiologics using appropriate container, disposal of used \nbottles, storage of unused drugs and biologics and \nkeeping of records. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare and transport \ndrugs and biologics \n1.1 Drugs and biologics are checked for expiration dates, \nand the contents for any signs of damage \n1.2 Drugs and biologics are transported or carried to and \nfrom the farm building using specified \ncontainer/equipment and materials \n2. Dispose used bottles \nand biologics \n2.1 Used bottles are disposed of properly using approved \ndisposal methods or standard operating procedures \n2.2 Expired and damaged drugs and biologics are \nreported and disposed following standard operating \nprocedures \n3. Store unused drugs \nand biologics \n3.1 Unused drugs and biologics are kept and stored in \ntheir proper places based on standard operating \npractice \n3.2 Unused drugs and biologics are kept and stored \nfollowing the specific storage temperature \nrequirements as stated in the label \n3.3 Portions of unused drugs and biologics are labeled \nand sealed based on standard operating procedures \n3.4 Unused drugs and biologics are properly stored using \nfirst – in – first – out (FIFO) system \n4. Maintain records and \nprovide feedback \n4.1 Records are kept and updated according to \norganization standard \n4.2. Reporting to supervisor or veterinarian is carried out \nbased on records\n\n--- PDF PAGE 47 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n45\n \nRANGE OF VARIABLES \nVARIABLE \nSCOPE \n1. Damage \n1.1 \nDiscoloration \n1.2 \nCracks in the bottle, distorted or missing label \n1.3 \nMolds \n2. Drugs and \nbiologics \n2.1 \nAntibiotics (parenteral, oral) \n2.2 \nVitamins (parenteral, oral) \n2.3 \nHormones \n2.4 \nVaccines \n2.5 \nProbiotics \n2.6 \nEnzymes \n3. Container/ \nEquipment \n3.1 \nTool box \n3.2 \nStyropor \n3.3 \nCovered box \n4. Materials \n4.1 \nRefrigerant \n4.2 \nIce packs \n5. Disposal method \n5.1 \nDisposing thru accredited hauling institution \n5.2 \nBurning \n5.3 \nRecycling \n6. Proper places \n6.1 \nMedicine cabinet \n6.2 \nRefrigerators \n6.3 \nWaste can for empty bottles \n7. Storage \ntemperature \n7.1 \nRoom temperature (antibiotics and other drugs) \n7.2 \n20C – 80C (biologics) \n8. Records \n8.1 Inventory and consumption records \n8.2 Vaccination records (checklist) \n8.3 Drug disposal records (checklist)\n\n--- PDF PAGE 48 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n46\nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared drugs and biologics for transport to and from \nthe farm building using the appropriate procedures and \ncontainers \n1.2 Disposed used drug bottles in accordance with \nestablished procedures and methods \n1.3 Reported and disposed expired and damaged drugs \nand biologics \n1.4 Identified and monitored the proper storage \ntemperatures for various drugs and biologics \n1.5 Properly stored, labeled and sealed unused drugs and \nbiologics \n1.6 Maintained report and provided feedback \n1.7 Communicated and worked effectively with others \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 Communication \n2.1.1 Preparation of storage labels \n2.1.2 Maintain records and provide feedback \n2.2 Safety Practices \n2.2.1 Knowledge in handling biologics and other \nveterinary drugs and supplies \n2.2.2 Knowledge of proper handling and \nmanagement of disposable supplies and \nmaterials \n2.2.3 Occupational health and safety practices \n2.3 Codes and Regulations \n2.3.1 Appropriate legal and supervising regulatory \nbody pertinent to handling drugs and biologics \nsuch as BAI and DENR \n2.4 Systems, Processes and Operations \n2.4.1 Accomplishing stocking procedures in \naccordance to standard operating practices \n2.4.2 Standard operating procedures in the disposal \nof used supplies and materials \n2.4.3 Monitoring of required storage temperatures \nand other environmental conditions \n2.5 Materials: Uses and Specifications \n2.5.1 Selection of proper transport containers and \nequipment \n2.5.2 Classification of drugs and biologics \n2.6 Values \n2.6.1 Safety consciousness in handling drugs and \nbiologics \n2.6.2 Honesty in reporting “spoiled” vaccines \n2.6.3 Conscious effort to lower production costs thru \nproper handling and storage of drugs and \nbiologics\n\n--- PDF PAGE 49 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n47\n2.6.4 Personal integrity and perseverance in \nperforming routine job \n2.6.5 Empathy or “Malasakit” \n3. Underpinning Skills \n3.1 \nWork safety \n3.2 \nCommunicate effectively \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 Observation/Demonstration \n4.2 Third party report \n4.3 Portfolio \n5. Resource \nImplications \nThe following resources MUST be provided: \n5.1 Farm location with required facilities \n5.2 Tools and materials needed for proper handling and \nstorage of drugs and biologics \n6. Context of \nAssessment \n6.1 Competency shall be assessed individually in the \nworkplace or in a simulated environment\n\n--- PDF PAGE 50 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n48\nUNIT OF COMPETENCY : \nCOLLECT AND HANDLE SPECIMEN \n \n \n \nUNIT CODE \n \n: \nAGR321305 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes \nrequired to collect and handle specimen. It includes \npreparation of supplies and materials, selection and \nexecution \nof \nappropriate \nrestraining \ntechnique, \ncollection and transport of specimen under the \nsupervision of veterinarian. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare supplies, \nmaterials, tools and \nequipment \n1.1 \nSupplies and materials needed for specimen \ncollection and transport are prepared \n1.2 \nMaterials to be used are sterilized and cleaned \naccording to standard operating procedure \n1.3 \nTools and equipment needed to restrain animals are \nprepared based on the restraining technique to be \nused \n2. Prepare animal \n2.1 The appropriate restraining technique is selected \nbased on the degree of restraint needed \n2.2 The chosen technique is executed in accordance to \nthe conditions of the animal welfare act \n3. Collect and transport \nspecimen \n3.1 The specimen is collected under the supervision of \nveterinarian \n3.2 Appropriate specimen volume is collected based on \nstandard operating practice \n3.3 Collected specimen is placed in appropriate \ncontainer with cap or proper closure and properly \nlabeled according to specimen collected \n3.4 Required temperature of collected sample is \nmaintained in accordance to standard operating \nprocedure \n3.5 Specimen is transported to the diagnostic laboratory \nfollowing standard operating practice\n\n--- PDF PAGE 51 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n49\n \nRANGE OF VARIABLES \nVARIABLE \nSCOPE \n1. \nSupplies and \nmaterials \n1.1 Container \n1.2 Cap \n1.3 Refrigerant or ice \n1.4 Mineral Oil \n1.5 Formalined solution \n1.6 Vial, Test tube or glass slide \n1.7 Resealable plastic bag \n1.8 Vacutainer \n2. \nTools and \nequipment \n2.1 Syringe (5cc glass) \n2.2 Needle \n2.3 Refrigerator \n2.4 Scalpel with blade \n3. \nRestraining \ntechnique \n3.1 Chute restraint \n3.2 Snooze restraint \n3.3 Tranquilizer \n3.4 Use of driving board \n3.5 Electric probe \n3.6 “Hood” \n3.7 Cart/truck/push cart \n4. \nSpecimen \n4.1 Blood \n4.2 Organ specimen \n4.3 Fecal sample \n4.4. Skin scrapings \n4.4 Feed for Analysis and Testing \n5. \nVolume/Quantity \n4.1 Blood sample: minimum of 5cc \n4.2 Organ sample: 5 – 10 grams \n4.3 Fecal sample: 5 –10 grams \n4.4 Feed: 1 kilograms \n4.5 Tissue: minimal \n6. \nContainer \n5.1 Test tube \n5.2 Vial \n5.3 Plastic \n5.4 Styropor \n5.5 Covered box \n7. \nCap \n6.1 Cotton \n6.2 Cork \n6.3 Rubber stopper \n8. \nTemperature \n7.1 Room temperature for blood and fecal sample \n7.2 30C – 120C for organ specimen\n\n--- PDF PAGE 52 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n50\n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared supplies and materials use for the collection \nand handling of specimen and restraining of animal \n1.2 Collected specimen according to standard operating \nprocedure \n1.3 Handled and labeled specimen using the appropriate \ncontainer for transport \n1.4 Identified and monitored the required temperature in \nhandling and transporting of specimen \n1.5 Properly stored reusable supplies and materials for \nfuture specimen collection \n1.6 Communicated and worked effectively with others \n2. Underpinning \nKnowledge and \nAttitudes \n2.1 Communication \n2.1.1 Preparation of animal history report \n2.2 Safety Practices \n2.2.1 Knowledge in collection of specimen \n2.2.2 Knowledge in proper handling and transport of \nspecimen \n2.3 Systems, Processes and Operations \n2.3.1 Restraining of animals for specimen collection \n2.3.2 Proper procedure in collecting specimen \n2.3.3 Standard operating procedures in the disposal of \nused supplies and materials \n2.3.4 Monitoring of required storage temperature \n2.4 Tools and Equipment \n2.4.1 Syringe (5cc glass) \n2.4.4 Scalpel with blade \n2.5 Quantity of specimen for collection \n2.5.1 Organ specimen – 5 to 10 grams \n2.5.2 Fecal sample – 5 to 10 grams \n2.5.3 Blood sample – 55 cc \n2.5.4 Feed sample – 5 to 10 grams\n\n--- PDF PAGE 53 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n51\n \n \n2.6 Values \n2.6.1 Safety consciousness in collecting and handling \nspecimen \n2.6.2 Honesty in reporting animal history where \nsamples were taken \n2.6.3 Diligence at work \n2.6.4 Conscious effort to handle specimen correctly to \navoid contamination or spoilage \n3. Method of \nAssessment \nCompetency in this Unit must be assessed through: \n3.1 Observation/Demonstration \n3.2 Third party report \n3.3 Portfolio \n4. Resource \nImplications \nThe following resourced MUST be provided \n4.1 Farm location with required facilities \n4.2 Tools and materials needed for specimen collection, \ntransport and handling \n5. Context of \nAssessment \n5.1 Competency shall be assesses individually in the \nworkplace or in a simulated environment\n\n--- PDF PAGE 54 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n52"
