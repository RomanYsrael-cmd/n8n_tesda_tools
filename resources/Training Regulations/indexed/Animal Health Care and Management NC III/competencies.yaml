        "source_title": "ADMINISTER DRUGS AND BIOLOGICS",
        "source_text": "--- PDF PAGE 41 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III                                                                  \n \n \n39\n \nUNIT OF COMPETENCY : \nADMINISTER DRUGS AND BIOLOGICS \n \nUNIT CODE \n \n: \nAGR321303 \n \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge, skills and attitudes \nrequired to administer drugs and biologics in livestock \nfarms.  It includes preparation of supplies, materials, \ntools and equipment, preparation of animal, application \nof drugs and biologics, and monitoring and recording \nanimal  response to drugs and biologics.  It requires \nmore supervision from veterinarian. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare appropriate \nsupplies, materials, \ntools and equipment \n \n1.1  Availability of necessary supplies and materials are \nchecked and prepared according to standard operating \nprocedure \n1.2  Supplies and materials are transported to the pig \nhouse/pen using approved transport tools and \nequipment \n1.3  Availability of appropriate tools and equipment are \nchecked and prepared according to standard operating \nprocedure \n1.4  Tools and equipment are transported to the animal  \nhouse/pen using approved transport tools and \nequipment \n2. Prepare animals \n2.1  Animals are prepared according to standard \norganizational procedures or based on animal health \nstatus \n2.2  Animals are restrained/handled using appropriate \nrestraining technique in accordance with the relevant \nprovisions of the Animal Welfare Act \n3. Apply drugs and \nbiologics \n3.1  Drugs and biologics are checked based on the \nmanufacturer’s or veterinarian’s recommendations \n3.2  Necessary precautions when administering drugs \nand biologics are checked according to \nmanufacturer’s or veterinarian’s recommendations \n3.3  The body weight of the animal is estimated (if the \nquantity to drug to be administered is based on weight) \n3.4  The route of administration is determined based on \nmanufacturer’s recommendation  \n3.5  The drugs and biologics are administered to animals \naccording to standard operating procedures \n3.6  Used supplies and materials are disposed as need \nfollowing appropriate disposal method  \n3.7  Reusable supplies and materials are cleaned, \ndisinfected and stored following standard operating \nprocedures\n\n--- PDF PAGE 42 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III                                                                  \n \n \n40\n \n4.  Monitor and record \nresponse to drugs and \nbiologics \n \n4.1  The name of drugs/biologics and dosage administered \nto the pigs are recorded on the animals’ respective \nrecord card \n4.2  Reactions/responses of the animal to the medication \nare checked at least twice a day.  Observations are \nrecorded \n5. Record Data \n5.1  Biologics and drug inventories are updated \n5.2 Medication and vaccination programs are monitored \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Supplies \n1.1 \nDrugs \n1.1.1 Nutritional supplements \n1.1.1.1 \nVitamins and mineral \n1.1.1.2 Colostrums supplements \n1.1.2 Hormones \n1.1.3 Antibiotics \n1.1.4 Anthelmintics \n1.1.5 Electrolytes \n1.1.6 Growth promoters \n1.1.7 Probiotics \n1.1.8 Vial of epinephrine/adrenaline \n1.2 \nBiologics \n1.2.1 Vaccines \n1.2.2 Sera \n2. Materials \n(consumables) \n2.1 \nNeedles (hypodermic or disposable) \n2.2 \nSyringe (disposable) \n2.3 \nDisinfectant (iodine) \n2.4 \nCotton balls \n2.5 \nWriting implements (pen or chalk) \n2.6 \nAnimal marker \n2.7 \nRefrigerant/ice \n3. Tools and \nequipment \n3.1 \nPig (wire) restrainer \n3.2 \nDriving board \n3.3 \nSyringe (fiberglass, metal, automatic, self-refilling) \n3.4 \nCool box \n3.5 \nAllis tissue forceps \n3.6 \nMedication tray or cart\n\n--- PDF PAGE 43 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III                                                                  \n \n \n41\n4. Animal health \nstatus \n4.1 \nFor routine application of vaccines and supplements \n4.2 \nFor treatment of sick or recumbent animals \n4.3 \nFor routine or emergency surgical procedures \n5. Restraining \ntechniques \n5.1 \nChute restraint \n5.2 \nSnooze restraint \n5.3 \nTranquilizer \n5.4 \nUse of driving board \n5.5 \nElectric probe \n5.6 \n“Hood” \n5.7 \nCart/truck/push cart \n6. Precautions when \nadministering \ndrugs and \nbiologics \n6.1 \nContraindication \n6.2 \nSpecial instructions \n6.3 \nSide-effects \n6.4 \nEffects on the animal health technician (e.g. some \ndrugs like etiproston should not be administered to \npigs by a pregnant person; some drugs like amitraz \nneed to be administered to pigs with protective \nclothing (gloves, mask) \n7. Veterinarian’s \nrecommendation \n7.1 \nGeneric name of drugs/biologics \n7.2 \nBrand name of drugs/biologics \n7.3 \nDosage \n7.4 \nRoute of administration \n8. Route of \nadministration \n8.1 \nIntramuscular \n8.2 \nSubcutaneous \n8.3 \nIntranasal \n8.4 \nIntradermal \n8.5 \nIntraperitoneal \n8.6 \nOral \n8.7 \nTopical \n9. Disposal method \n9.1 \nIncineration \n9.2 \nGarbage pit \n9.3 \nBury \n10. Reactions/  \nResponses \n10.1 Recovering \n10.2 Adverse reaction \n10.2.1  Anaphylactic shock \n10.2.2  Allergies \n10.2.3  Mild clinical conditions (shivering, tremors, \nlethargy) \n10.2.4    Pyrexia/Fever\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III                                                                  \n \n \n42\n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency  \n \nAssessment requires evidence that the candidate: \n1.1 Selected appropriate supplies, materials, tools and \nequipment in preparation for administration of drugs and \nbiologics \n1.2 Prepared and properly restrained pigs for administration \nof drugs and biologics \n1.3 Administered drugs and biologics with standard \nprocedures \n1.4 Monitored response to administration of drugs and \nbiologics \n1.5 Communicated and worked effectively with others \n2. Underpinning \nKnowledge and \nAttitudes \n \n \n \n2.1 Communication \n2.1.1 Preparation of report \n2.2 Safety Practices \n2.1.2    Proper handling, use and disposal of drugs and \nbiologics \n2.3 Mathematics and Mensuration \n2.3.1 \nWeight estimation \n2.4 Codes and Regulations \n2.4.1 \nCompliance to animal health program of the BAI, \nPAHC, NMIS, and DENR  \n2.4.2 \nCompliance to the Animal Welfare Act \n2.5 Systems, Processes and Operations \n2.5.1 \nGeneral care and herd health management of  \nlivestock \n2.5.2 \n Basic on-farm hygiene procedures \n2.6 Tools and Equipment: Uses and Specifications \n2.6.1 \nSyringe (fiberglass, metal, automatic, self-\nrefilling) \n2.6.2 \nAllis tissue forceps \n2.7 Maintenance \n2.7.1 \nRegular check-up and repair and replacement \n(as needed) of tools and equipments related to \nadministering drugs and biologics \n2.8 Materials: Uses and Specifications \n2.8.1 \nMedical supplies and materials \n2.8.2 \nOffice equipment and supplies for regular \nmonitoring of  animal health performance  \n2.9 \nValues  \n2.9.1 \nTender loving care in handling animals \n2.9.2 \nSafety consciousness on handling drugs and \nbiologics and other biological \n2.9.3 \nWork dedication \n2.9.4 \nFollowing directions obediently \n2.9.5 \nPerseverance and industriousness on care and \nmanagement of the general herd\n\n--- PDF PAGE 45 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III                                                                  \n \n \n43\n3 Underpinning Skills \n3.1 Work safety \n3.2 Skills in using tools and equipment \n3.3 Calculations \n3.4 Communicating ideas and information \n4 Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 Observation/Demonstration \n4.2 Third party report \n4.3 Portfolio \n5. Resource \nImplications \nThe following resources MUST be provided: \n5.1 \nFarm location \n5.2 \nSupplies, materials, tools and equipment needed in \nadministering drugs and biologics \n6. Context  for \nAssessment \n \n6.1 \nCompetency maybe assessed individually in the \nworkplace or in a simulated workplace under limited \nsupervision\n",
