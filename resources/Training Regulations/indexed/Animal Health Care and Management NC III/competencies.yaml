        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified stage of production of the animal \n1.2 Identified different restraining techniques for specific \nrestraining purposes \n1.3 Selected suitable handling and restraining technique \n1.4 Handled animal with minimal stress \n1.5 Prevented harm and undue risks to restrainer and \nrestrained animals \n1.6 Communicated and worked effectively with teams \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 Communication \n 2.1.1 Ability to follow instructions from the veterinarian \n2.2 Safety Practices \n2.2.1 Prevention of undue risks to restrainer and \nrestrained animal \n2.2.2 Implementation of procedures relative to proper \nhandling of animals, use and disposal of \nbiologics and other veterinary drugs and \nsupplies based on manufacturers specifications \nor veterinarian’s recommendations \n2.3 Tools and Equipment: Uses and Specification \n2.3.1 Driving board \n2.3.2 Snoozer \n2.3.3 Rope \n2.3.4 Castration table \n2.3.5 Sacks/hoods \n2.3.6 Syringe (10ml and 20 ml) \n2.4 Maintenance \n2.4.1 Regular check-up and repair of tools and \nequipment \n2.5 Systems, Processes and Operations \n2.5.1 Follow assigned instructions from veterinarian \n2.5.2 Compliance to SOP of acceptable restraining \npractices \n2.5.3 Knowledge of the different restraining \ntechniques \n2.6 Codes and Regulations \n2.6.1 Compliance with animal health programs and \nadministrative orders (AOs) of the BAI and \nNMIS \n2.6.2 Animal Welfare Act\n\n--- PDF PAGE 35 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n33\n2.7 Values \n2.7.1 Safety consciousness of self and target animal \n2.7.2 Personal integrity and perseverance in \nperforming routine job \n2.7.3 Appropriate use of restraining technique in \naccordance to the stages of production \n2.7.4 Consideration to non-target animals \n3. Underpinning \nSkills \n3.1 \nWork safety \n3.2 \nSkills in using tools and equipment \n3.3 \nCalculations \n3.4 \nCommunicate ideas and information \n4. Method of \nAssessment \nCompetency in this unit must be assessed through: \n4.1 \nObservation/Demonstration \n4.2 \nThird party report \n4.3 \nPortfolio \n5. Resource \nImplications \nThe following resources MUST be provided: \n5.1 \nSample animals \n5.2 \nSupplies and materials \n5.3 \nTools and equipment appropriate to restrain and \nhandle animals \n6. Context of \nAssessment \n6.1 Competency may be assessed individually in the \nworkplace or in a simulated workplace individually or \nas a part of a team under limited supervision\n\n--- PDF PAGE 36 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n34\n \nUNIT OF COMPETENCY : \nAPPLY BIO-SECURITY MEASURES \n \nUNIT CODE \n \n:"
