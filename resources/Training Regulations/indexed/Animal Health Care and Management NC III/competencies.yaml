  "source_section_text": "SECTION 2 \n \nCOMPETENCY STANDARDS \n \nThese guidelines are set to provide the Technical Vocational Education and \nTraining (TVET) providers with information and other important requirements to \nconsider when designing training programs for ANIMAL HEALTH CARE AND \nMANAGEMENT NC III. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION \n \nUNIT CODE \n : 500311109 \n \n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \nrequired to lead in the dissemination and discussion of \nideas, information and issues in the workplace. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Communicate \ninformation about \nworkplace processes \n1.1 Appropriate communication method is selected \n1.2 Multiple operations involving several topics areas \nare communicated accordingly \n1.3 Questions are used to gain extra information \n1.4 Correct sources of information are identified \n1.5 Information is selected and organized correctly \n1.6 Verbal and written reporting is undertaken when \nrequired \n1.7 Communication skills are maintained in all \nsituations \n2. Lead workplace \ndiscussions \n2.1 Response to workplace issues are sought \n2.2 Response to workplace issues are provided \nimmediately \n2.3 Constructive contributions are made to \nworkplace discussions on such issues as \nproduction, quality and safety \n2.4 Goals/objectives and action plan undertaken in \nthe workplace are communicated\n\n--- PDF PAGE 5 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n3\n \n3. Identify and \ncommunicate issues \narising in the workplace \n3.1 Issues and problems are identified as they arise \n3.2 Information regarding problems and issues are \norganized coherently to ensure clear and \neffective communication \n3.3 Dialogue is initiated with appropriate personnel \n3.4 Communication problems and issues are raised \nas they arise \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Methods of \ncommunication \n1.1 Non-verbal gestures \n1.2 Verbal \n1.3 Face to face \n1.4 Two-way radio \n1.5 Speaking to groups \n1.6 Using telephone \n1.7 Written \n1.8 Internet\n\n--- PDF PAGE 6 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n4\nEVIDENCE GUIDE \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Dealt with a range of communication/information at \none time \n1.2 Made constructive contributions in workplace issues \n1.3 Sought workplace issues effectively \n1.4 Responded to workplace issues promptly \n1.5 Presented information clearly and effectively written \nform \n1.6 Used appropriate sources of information \n1.7 Asked appropriate questions \n1.8 Provided accurate information \n2. Underpinning \nknowledge \n2.1 Organization requirements for written and electronic \ncommunication methods \n2.2 Effective verbal communication methods \n3. Underpinning \nSkills \n3.1 Organize information \n3.2 Understand and convey intended meaning \n3.3 Participate in variety of workplace discussions \n3.4 Comply with organization requirements for the use of \nwritten and electronic communication methods \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1 Variety of Information \n4.2 Communication tools \n4.3 Simulated workplace \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 Competency in this unit must be assessed through \n5.2 Direct Observation \n5.3 Interview \n6. Context for \nAssessment \n6.1 Competency may be assessed in the workplace or in \nsimulated workplace environment \n6.2 Assessment shall be observed while task are being \nundertaken whether individually or in-group\n\n--- PDF PAGE 7 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n5\n \nUNIT OF COMPETENCY \n: LEAD SMALL TEAMS \n \nUNIT CODE \n : 500311110 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to \nlead small teams including setting and maintaining \nteam and individual performance standards. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Provide team \nleadership \n1.1 Work requirements are identified and \npresented to team members \n1.2 Reasons for instructions and requirements are \ncommunicated to team members \n1.3 Team members’ queries and concerns are \nrecognized, discussed and dealt with \n2. Assign responsibilities \n2.1 Duties, and responsibilities are allocated having \nregard to the skills, knowledge and aptitude \nrequired to properly undertake the assigned task \nand according to company policy \n2.2 Duties are allocated having regard to individual \npreference, domestic and personal \nconsiderations, whenever possible \n3. Set performance \nexpectations for team \nmembers \n3.1 Performance expectations are established based \non client needs and according to assignment \nrequirements \n3.2 Performance expectations are based on \nindividual team members duties and area of \nresponsibility \n3.3 Performance expectations are discussed and \ndisseminated to individual team members\n\n--- PDF PAGE 8 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n6\n4. Supervise team \nperformance \n4.1 Monitoring of performance takes place against \ndefined performance criteria and/or assignment \ninstructions and corrective action taken if \nrequired \n4.2 Team members are provided with feedback, \npositive support and advice on strategies to \novercome any deficiencies \n4.3 Performance issues which cannot be rectified \nor addressed within the team are referenced to \nappropriate personnel according to employer \npolicy \n4.4 Team members are kept informed of any \nchanges in the priority allocated to assignments \nor tasks which might impact on client/customer \nneeds and satisfaction \n4.5 Team operations are monitored to ensure that \nemployer/client needs and requirements are met \n4.6 Follow-up communication is provided on all \nissues affecting the team \n4.7 All relevant documentation is completed in \naccordance with company procedures\n\n--- PDF PAGE 9 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n7\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Work requirements \n1.1 Client Profile \n1.2 Assignment instructions \n2. Team member’s concerns \n2.1 Roster/shift details \n3. Monitor performance \n3.1 Formal process \n3.2 Informal process \n4. Feedback \n4.1 Formal process \n4.2 Informal process \n5. Performance issues \n5.1 Work output \n5.2 Work quality \n5.3 Team participation \n5.4 Compliance with workplace protocols \n5.5 Safety \n5.6 Customer service \n \n \nEVIDENCE GUIDE \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Maintained or improved individuals and/or team \nperformance given a variety of possible scenario \n1.2 Assessed and monitored team and individual \nperformance against set criteria \n1.3 Represented concerns of a team and individual to \nnext level of management or appropriate specialist \nand to negotiate on their behalf \n1.4 Allocated duties and responsibilities, having regard to \nindividual’s knowledge, skills and aptitude and the \nneeds of the tasks to be performed \n1.5 Set and communicated performance expectations for \na range of tasks and duties within the team and \nprovided feedback to team members \n2. Underpinning \nKnowledge \n2.1 Company policies and procedures \n2.2 Relevant legal requirements \n2.3 How performance expectations are set \n2.4 Methods of Monitoring Performance \n2.5 Client expectations \n2.6 Team member’s duties and responsibilities\n\n--- PDF PAGE 10 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n8\n \n3. Underpinning \nSkills \n3.1 Communication skills required for leading teams \n3.2 Informal performance counseling skills \n3.3 Team building skills \n3.4 Negotiating skills \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1 Access to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n4.2 Materials relevant to the proposed activity or task \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 Direct observations of work activities of the individual \nmember in relation to the work activities of the group \n5.2 Observation of simulation and/or role play involving \nthe participation of individual member to the \nattainment of organizational goal \n5.3 Case studies and scenarios as a basis for discussion \nof issues and strategies in teamwork \n6. Context of \nAssessment \n6.1 Competency assessment may occur in workplace or \nany appropriately simulated environment \n6.2 Assessment shall be observed while task are being \nundertaken whether individually or in-group\n\n--- PDF PAGE 11 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n9\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION \n SKILLS \n \nUNIT CODE : 500311111 \n \nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes \nrequired to collect information in order to negotiate to a \ndesired outcome and participate in the negotiation. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Plan negotiations \n1.1 Information on preparing for negotiation is \nidentified and included in the plan \n1.2 Information on creating non verbal environments \nfor positive negotiating is identified and included in \nthe plan \n1.3 Information on active listening is identified and \nincluded in the plan \n1.4 Information on different questioning techniques is \nidentified and included in the plan \n1.5 Information is checked to ensure it is correct and up-\nto- date \n2. Participate in \nnegotiations \n2.1 Criteria for successful outcome are agreed upon by \nall parties \n2.2 Desired outcome of all parties are considered \n2.3 Appropriate language is used throughout the \nnegotiation \n2.4 A variety of questioning techniques are used \n2.5 The issues and processes are documented and \nagreed upon by all parties \n2.6 Possible solutions are discussed and their viability \nassessed \n2.7 Areas for agreement are confirmed and recorded \n2.8 Follow-up action is agreed upon by all parties\n\n--- PDF PAGE 12 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n10\n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Preparing for \nnegotiation \n1.1 \n \n1.2 \n1.3 \n1.4 \n \n \n \n \n \n1.5 \n \n \n \n \n \n \n \n1.6 \nBackground information on other parties to the \nnegotiation \nGood understanding of topic to be negotiated \nClear understanding of desired outcome/s \nPersonal attributes \n1.4.1 self awareness \n1.4.2 self esteem \n1.4.3 objectivity \n1.4.4 empathy \n1.4.5 respect for others \nInterpersonal skills \n1.5.1 listening/reflecting \n1.5.2 non verbal communication \n1.5.3 assertiveness \n1.5.4 behavior labeling \n1.5.5 testing understanding \n1.5.6 seeking information \n1.5.7 self disclosing \nAnalytic skills \n1.6.1 observing differences between content \nand process \n1.6.2 identifying bargaining information \n1.6.3 applying strategies to manage process \n1.6.4 applying steps in negotiating process \n1.6.5 strategies to manage conflict \n1.6.6 steps in negotiating process \n1.6.7 options within organization and externally \nfor resolving conflict \n2. Non verbal \nenvironments \n2.1 \n2.2 \n2.3 \n2.4 \nFriendly reception \nWarm and welcoming room \nRefreshments offered \nLead in conversation before negotiation begins \n3. Active listening \n3.1 \n3.2 \n3.3 \n3.4 \n3.5 \nAttentive \nDon’t interrupt \nGood posture \nMaintain eye contact \nReflective listening \n \n4. Questioning \ntechniques \n4.1 \n4.2 \n4.3 \nDirect \nIndirect \nOpen-ended\n\n--- PDF PAGE 13 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n11\n \n \nEVIDENCE GUIDE \n1. Critical aspects of \n Competency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated sufficient knowledge of the factors \ninfluencing negotiation to achieve agreed outcome \n1.2 Participated in negotiation with at least one person to \nachieve an agreed outcome \n2. Underpinning \nKnowledge and \nAttitude \n2.1 Codes of practice and guidelines for the organization \n2.2 Organizations policy and procedures for negotiations \n2.3 Decision making and conflict resolution strategies \nprocedures \n2.4 Problem solving strategies on how to deal with \nunexpected questions and attitudes during negotiation \n2.5 Flexibility \n2.6. Empathy \n3. Underpinning \nSkills \n3.1 Interpersonal skills to develop rapport with other parties \n3.2 Communication skills (verbal and listening) \n3.3 Observation skills \n 3.4 Negotiation skills \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1 Room with facilities necessary for the negotiation \nprocess \n4.2 Human resources (negotiators) \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 Observation/demonstration and questioning \n5.2 Portfolio assessment \n5.3 Oral and written questioning \n5.4 Third party report \n6. Context of \nAssessment \n6.1 Competency to be assessed in real work environment or \nin a simulated workplace setting.\n\n--- PDF PAGE 14 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n12\n \nUNIT OF COMPETENCY : \nSOLVE PROBLEMS RELATED TO WORK \nACTIVITIES \nUNIT CODE \n: 500311112 \nUNIT DESCRIPTOR \n: \nThis unit of covers the knowledge, skills and attitudes \nrequired to solve problems in the workplace including \nthe application of problem solving techniques and to \ndetermine and resolve the root cause of problems. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Identify the problem \n1.1 Variances are identified from normal operating \nparameters; and product quality \n1.2 Extent, cause and nature are of the problem are \ndefined through observation, investigation and \nanalytical techniques \n1.3 Problems are clearly stated and specified \n2. Determine fundamental \ncauses of the problem \n2.1 Possible causes are identified based on \nexperience and the use of problem solving tools / \nanalytical techniques. \n2.2 Possible cause statements are developed based \non findings \n2.3 Fundamental causes are identified per results of \ninvestigation conducted \n3. Determine corrective \naction \n3.1 All possible options are considered for resolution \nof the problem \n3.2 Strengths and weaknesses of possible options \nare considered \n3.3 Corrective actions are determined to resolve the \nproblem and possible future causes \n3.4 Action plans are developed identifying \nmeasurable objectives, resource needs and \ntimelines in accordance with safety and operating \nprocedures \n4. Provide \nrecommendation/s to \nmanager \n4.1 Report on recommendations are prepared \n4.2 Recommendations are presented to appropriate \npersonnel. \n4.3 Recommendations are followed-up, if required\n\n--- PDF PAGE 15 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n13\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Analytical techniques \n1.1 Brainstorming \n1.2 Intuitions/Logic \n1.3 Cause and effect diagrams \n1.4 Pareto analysis \n1.5 SWOT analysis \n1.6 Gantt chart, Pert CPM and graphs \n1.7 Scattergrams \n2. Problem \n \n2.1 Non – routine process and quality problems \n2.2 Equipment selection, availability and failure \n2.3 Teamwork and work allocation problem \n2.4 Safety and emergency situations and \nincidents \n3. Action plans \n \n3.1 Priority requirements \n3.2 Measurable objectives \n3.3 Resource requirements \n3.4 Timelines \n3.5 Co-ordination and feedback requirements \n3.6 Safety requirements \n3.7 Risk assessment \n3.8 Environmental requirements\n\n--- PDF PAGE 16 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n14\nEVIDENCE GUIDE \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Identified the problem \n1.2. Determined the fundamental causes of the problem \n1.3. Determined the correct / preventive action \n1.4. Provided recommendation to manager \nThese aspects may be best assessed using a range of \nscenarios / case studies / what ifs as a stimulus with a \nwalk through forming part of the response. These \nassessment activities should include a range of \nproblems, including new, unusual and improbable \nsituations that may have happened. \n2. Underpinning \nKnowledge \n2.1 Competence includes a thorough knowledge and \nunderstanding of the process, normal operating \nparameters, and product quality to recognize non-\nstandard situations \n2.2 Competence to include the ability to apply and explain, \nsufficient for the identification of fundamental cause, \ndetermining the corrective action and provision of \nrecommendations \n2.2.1 Relevant equipment and operational \nprocesses \n2.2.2 Enterprise goals, targets and measures \n2.2.3 Enterprise quality, OHS and environmental \nrequirement \n2.2.4 Principles of decision making strategies and \ntechniques \n2.2.5 Enterprise information systems and data \ncollation \n2.2.6 Industry codes and standards \n3. Underpinning \nSkills \n3.1 Using range of formal problem solving techniques \n3.2 Identifying and clarifying the nature of the problem \n3.3 Devising the best solution \n3.4 Evaluating the solution \n3.5 Implementation of a developed plan to rectify the \nproblem\n\n--- PDF PAGE 17 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n15\n4. Resource \nImplications \n4.1 Assessment will require access to an operating plant \nover an extended period of time, or a suitable method \nof gathering evidence of operating ability over a range \nof situations. A bank of scenarios / case studies / what \nifs will be required as well as bank of questions which \nwill be used to probe the reason behind the \nobservable action. \n5. Methods of \nAssessment \nCompetency may be assessed through: \n 5.1 Case studies on solving problems in the workplace \n 5.2 Observation \nThe unit will be assessed in a holistic manner as is \npractical and may be integrated with the assessment of \nother relevant units of competency. Assessment will occur \nover a range of situations, which will include disruptions to \nnormal, smooth operation. Simulation may be required to \nallow for timely assessment of parts of this unit of \ncompetency. Simulation should be based on the actual \nworkplace and will include walk through of the relevant \ncompetency components. \n6. Context of \nAssessment \n6.1 In all workplace, it may be appropriate to assess this \nunit concurrently with relevant teamwork or operation \nunits.\n\n--- PDF PAGE 18 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n16\n \nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND \n TECHNIQUES \n \nUNIT CODE : 500311113 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \nrequired in the application of mathematical concepts \nand techniques. \n \n \nELEMENT \nPerformance Criteria \nItalicized terms are elaborated in the Range of Variables \n1. Identify mathematical \ntools and techniques to \nsolve problem \n1.1 Problem areas are identified based on given \ncondition \n1.2 Mathematical techniques are selected based \non the given problem \n2. Apply mathematical \nprocedure/solution \n2.1 Mathematical techniques are applied based on \nthe problem identified \n2.2 Mathematical computations are performed to the \nlevel of accuracy required for the problem \n2.3 Results of mathematical computation is \ndetermined and verified based on job \nrequirements \n3. Analyze results \n3.1 Result of application is reviewed based on \nexpected and required specifications and \noutcome \n3.2 Appropriate action is applied in case of error \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Mathematical techniques \nMay include but are not limited to: \n1.1 Four fundamental operations \n Measurements \n1.2 Use/Conversion of units of measurements \n1.3 Use of standard formulas \n \n2. Appropriate action \n2.1 Review in the use of mathematical \ntechniques (e.g. recalculation, re-modeling) \n2.2 Report error to immediate superior for proper \naction\n\n--- PDF PAGE 19 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n17\n \n EVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified, applied and reviewed the use of \nmathematical concepts and techniques to workplace \nproblems \n2. Underpinning \nKnowledge \n2.1 Fundamental operation (addition, subtraction, division, \nmultiplication) \n2.2 Measurement system \n2.3 Precision and accuracy \n2.4 Basic measuring tools/devices \n3. Underpinning \nSkills \n3.1 Applying mathematical computations \n3.2 Using calculator \n3.3. Using different measuring tools \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1 Calculator \n4.2 Basic measuring tools \n4.3 Case Problems \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 Authenticated portfolio \n5.2 Written Test \n5.3. Interview/Oral Questioning \n5.4. Demonstration \n6. Context of \nAssessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n\n--- PDF PAGE 20 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n18\n \nUNIT OF COMPETENCY: USE RELEVANT TECHNOLOGIES \n \nUNIT CODE : 500311114 \n \nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, \nand attitude required in selecting, sourcing and applying \nappropriate \nand \naffordable \ntechnologies \nin \nthe \nworkplace. \n \n \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Study/select appropriate \ntechnology \n \n1.1 Usage of different technologies is determined \nbased on job requirements \n1.2 Appropriate technology is selected as per work \n specification \n2. Apply relevant \ntechnology \n \n2.1 Relevant technology is effectively used in carrying \nout function \n2.2 Applicable software and hardware are used as per \ntask requirement \n2.3 Management concepts are observed and \npracticed as per established industry practices \n3. Maintain/enhance \nrelevant technology \n3.1 Maintenance of technology is applied in \naccordance with the industry standard operating \nprocedure, manufacturer’s operating \nguidelines and occupational health and safety \nprocedure to ensure its operative ability \n3.2 Updating of technology is maintained through \ncontinuing education or training in accordance with \njob requirement \n3.3 Technology failure/ defect is immediately reported \nto the concern/responsible person or