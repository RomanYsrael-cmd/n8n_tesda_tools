        "source_text": "--- PDF PAGE 50 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III                                                                  \n \n \n48\nUNIT OF COMPETENCY :  \nCOLLECT AND HANDLE SPECIMEN  \n  \n \n \nUNIT CODE  \n \n: \nAGR321305 \n \nUNIT DESCRIPTOR           : \nThis unit covers the knowledge, skills and attitudes \nrequired to collect and handle specimen. It includes \npreparation of supplies and materials, selection and \nexecution \nof \nappropriate \nrestraining \ntechnique, \ncollection and transport of specimen under the \nsupervision of veterinarian. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Prepare supplies, \nmaterials, tools and \nequipment \n1.1 \nSupplies and materials needed for specimen  \ncollection and transport are prepared \n1.2 \nMaterials to be used are sterilized and cleaned \naccording to standard operating procedure \n1.3 \nTools and equipment needed to restrain animals are \nprepared based on the restraining technique to be \nused \n2.  Prepare animal  \n2.1    The appropriate restraining technique is selected \nbased on the degree of restraint needed \n2.2    The chosen technique is executed in accordance to \nthe conditions of the animal welfare act \n3.  Collect and transport \nspecimen \n3.1   The specimen is collected under the supervision of  \nveterinarian \n3.2   Appropriate specimen volume is collected based on \nstandard operating practice \n3.3 Collected specimen is placed in appropriate \ncontainer with cap or proper closure and properly \nlabeled according to specimen collected \n3.4 Required temperature of collected sample is \nmaintained in accordance to standard operating \nprocedure \n3.5 Specimen is transported to the diagnostic laboratory \nfollowing standard operating practice\n\n--- PDF PAGE 51 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III                                                                  \n \n \n49\n \nRANGE OF VARIABLES \nVARIABLE \nSCOPE \n1. \nSupplies and \nmaterials \n1.1 Container \n1.2 Cap \n1.3 Refrigerant or ice \n1.4 Mineral Oil \n1.5 Formalined solution \n1.6 Vial, Test tube or glass slide \n1.7 Resealable plastic bag \n1.8 Vacutainer  \n2. \nTools and \nequipment \n2.1 Syringe (5cc glass)  \n2.2 Needle  \n2.3 Refrigerator \n2.4 Scalpel with blade \n3. \nRestraining \ntechnique \n3.1   Chute restraint \n3.2   Snooze restraint \n3.3   Tranquilizer \n3.4   Use of driving board \n3.5   Electric probe \n3.6   “Hood” \n3.7   Cart/truck/push cart \n4. \nSpecimen \n4.1   Blood  \n4.2   Organ specimen \n4.3   Fecal sample \n4.4.  Skin scrapings \n4.4   Feed for Analysis and Testing \n5. \nVolume/Quantity \n4.1  Blood sample: minimum of 5cc \n4.2  Organ sample: 5 – 10 grams \n4.3  Fecal sample: 5 –10 grams \n4.4  Feed: 1 kilograms \n4.5  Tissue: minimal \n6. \nContainer \n5.1  Test tube \n5.2  Vial \n5.3  Plastic \n5.4  Styropor \n5.5  Covered box \n7. \nCap \n6.1  Cotton \n6.2  Cork \n6.3  Rubber stopper \n8. \nTemperature \n7.1  Room temperature for blood and fecal sample \n7.2  30C – 120C for organ specimen\n\n--- PDF PAGE 52 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III                                                                  \n \n \n50\n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared supplies and materials use for the collection \nand handling of specimen and restraining of animal \n1.2 Collected specimen according to standard operating \nprocedure \n1.3 Handled and labeled specimen using the appropriate \ncontainer for transport  \n1.4 Identified and monitored the required temperature in \nhandling and transporting of specimen \n1.5 Properly stored reusable supplies and materials for \nfuture specimen collection \n1.6 Communicated and worked effectively with others \n2. Underpinning \nKnowledge and \nAttitudes \n2.1 Communication \n2.1.1 Preparation of animal history report  \n2.2    Safety Practices \n2.2.1   Knowledge in collection of specimen  \n2.2.2   Knowledge in proper handling and transport of \nspecimen \n2.3   Systems, Processes and Operations \n2.3.1   Restraining of animals for specimen collection \n2.3.2   Proper procedure in collecting specimen \n2.3.3   Standard operating procedures in the disposal of \nused supplies and materials \n2.3.4   Monitoring of required storage temperature \n2.4   Tools and Equipment \n2.4.1  Syringe (5cc glass) \n2.4.4  Scalpel with blade \n2.5   Quantity of specimen for collection \n2.5.1 Organ specimen – 5 to 10 grams \n2.5.2 Fecal sample – 5 to 10 grams \n2.5.3 Blood sample – 55 cc \n2.5.4 Feed sample – 5 to 10 grams\n\n--- PDF PAGE 53 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III                                                                  \n \n \n51\n \n \n2.6 Values \n2.6.1 Safety consciousness in collecting and handling \nspecimen \n2.6.2 Honesty in reporting animal history where \nsamples were taken \n2.6.3 Diligence at work \n2.6.4 Conscious effort to handle specimen correctly to \navoid contamination or spoilage \n3. Method of \nAssessment \nCompetency in this Unit must be assessed through: \n3.1  Observation/Demonstration \n3.2  Third party report \n3.3  Portfolio \n4. Resource \nImplications \nThe following resourced MUST be provided \n4.1  Farm location with required facilities \n4.2  Tools and materials needed for specimen collection, \ntransport and handling \n5.  Context of \nAssessment \n5.1 Competency shall be assesses individually in the \nworkplace or in a simulated environment\n",
        "required_knowledge": null,
        "required_skills": null
      }
