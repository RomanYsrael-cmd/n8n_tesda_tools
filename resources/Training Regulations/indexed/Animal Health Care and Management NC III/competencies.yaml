        "source_text": "--- PDF PAGE 46 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III                                                                  \n \n \n44\n \nUNIT OF COMPETENCY : \nHANDLE AND STORE DRUGS AND  \n  \n \nBIOLOGICS \n \nUNIT CODE  \n \n: \nAGR321304 \n \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge, skills and attitudes \nrequired to handle and store drugs and biologics. It \nincludes preparation and transport of drugs and \nbiologics using appropriate container, disposal of used \nbottles, storage of unused drugs and biologics and \nkeeping of records. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare and transport \ndrugs and biologics \n1.1 Drugs and biologics are checked for expiration dates, \nand the contents for any signs of damage  \n1.2 Drugs and biologics are transported or carried to and \nfrom the farm building using specified \ncontainer/equipment and materials \n2. Dispose used bottles \nand biologics \n2.1 Used bottles are disposed of properly using approved \ndisposal methods or standard operating procedures  \n2.2 Expired and damaged drugs and biologics are \nreported and disposed following standard operating \nprocedures \n3. Store unused drugs \nand biologics \n3.1 Unused drugs and biologics are kept and stored  in \ntheir proper places based on standard operating \npractice  \n3.2 Unused drugs and biologics are kept and stored \nfollowing the specific storage temperature \nrequirements as stated in the label \n3.3 Portions of unused drugs and biologics are labeled \nand sealed based on standard operating procedures \n3.4 Unused drugs and biologics are properly stored using \nfirst – in – first – out (FIFO) system \n4. Maintain records and \nprovide feedback  \n4.1    Records are kept and updated according to      \norganization standard \n4.2.  Reporting to supervisor or veterinarian is carried out \nbased on records\n\n--- PDF PAGE 47 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III                                                                  \n \n \n45\n \nRANGE OF VARIABLES \nVARIABLE \nSCOPE \n1. Damage \n1.1 \nDiscoloration \n1.2 \nCracks in the bottle, distorted or missing label \n1.3 \nMolds \n2. Drugs and \nbiologics \n2.1 \nAntibiotics (parenteral, oral) \n2.2 \nVitamins (parenteral, oral) \n2.3 \nHormones \n2.4 \nVaccines \n2.5 \nProbiotics \n2.6 \nEnzymes \n3. Container/ \nEquipment \n3.1 \nTool box \n3.2 \nStyropor \n3.3 \nCovered box \n4. Materials \n4.1 \nRefrigerant \n4.2 \nIce packs \n5. Disposal method \n5.1 \nDisposing thru accredited hauling institution \n5.2 \nBurning \n5.3 \nRecycling \n6. Proper places \n6.1 \nMedicine cabinet \n6.2 \nRefrigerators \n6.3 \nWaste can for empty bottles \n7. Storage \ntemperature \n7.1 \nRoom temperature (antibiotics and other drugs) \n7.2 \n20C – 80C (biologics) \n8. Records \n8.1 Inventory and consumption records \n8.2 Vaccination records (checklist) \n8.3 Drug disposal records (checklist)\n\n--- PDF PAGE 48 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III                                                                  \n \n \n46\nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared  drugs and biologics for transport to and from \nthe farm building using the appropriate procedures and \ncontainers \n1.2 Disposed used drug bottles in accordance with \nestablished procedures and methods \n1.3 Reported and disposed expired and damaged drugs \nand biologics \n1.4 Identified and monitored the proper storage \ntemperatures for various drugs and biologics \n1.5 Properly stored, labeled and sealed unused drugs and \nbiologics \n1.6 Maintained report and provided feedback \n1.7 Communicated and worked effectively with others \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 Communication \n2.1.1 Preparation of storage labels \n2.1.2 Maintain records and provide feedback \n2.2 Safety Practices \n2.2.1 Knowledge in handling biologics and other \nveterinary drugs and supplies \n2.2.2 Knowledge of proper handling and \nmanagement of disposable supplies and \nmaterials \n2.2.3 Occupational health and safety practices \n2.3 Codes and Regulations \n2.3.1 Appropriate legal and supervising regulatory \nbody pertinent to handling drugs and biologics \nsuch as BAI and DENR \n2.4 Systems, Processes and Operations \n2.4.1 Accomplishing stocking procedures in \naccordance to standard operating practices \n2.4.2 Standard operating procedures in the disposal \nof used supplies and materials \n2.4.3 Monitoring of required storage temperatures \nand other environmental conditions \n2.5 Materials: Uses and Specifications \n2.5.1 Selection of proper transport containers and \nequipment \n2.5.2 Classification of drugs and biologics \n2.6 Values \n2.6.1 Safety consciousness in handling drugs and \nbiologics \n2.6.2 Honesty in reporting “spoiled” vaccines \n2.6.3 Conscious effort to lower production costs thru \nproper handling and storage of drugs and \nbiologics\n\n--- PDF PAGE 49 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III                                                                  \n \n \n47\n2.6.4 Personal integrity and perseverance in \nperforming routine job \n2.6.5 Empathy or “Malasakit” \n3. Underpinning Skills \n3.1 \nWork safety \n3.2 \nCommunicate effectively \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 Observation/Demonstration \n4.2 Third party report \n4.3 Portfolio \n5. Resource \nImplications \nThe following resources MUST be provided: \n5.1 Farm location with required facilities \n5.2 Tools and materials needed for proper handling and \nstorage of drugs and biologics \n6. Context of \nAssessment \n6.1 Competency shall be assessed individually in the \nworkplace or in a simulated environment\n",
