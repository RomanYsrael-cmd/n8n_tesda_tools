        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified bio-security threats \n1.2 Properly prepared and applied disinfectants \n1.3 Implemented hygiene and sanitation practices for \nhimself and for the farm \n1.4 Implemented vaccination program \n1.5 Implemented proper health program \n1.6 Identified sick and unfit animals \n1.7 Performed quarantined and acclimatization procedure \n1.8 Disposed dead stocks or by-products properly \n1.9 Maintained records appropriately \n1.10Communicated and worked effectively wih others \n2. Underpinning \nKnowledge and \nAttitudes \n \n \n2.1 Communication \n2.1.1 Accomplishing the check list \n2.2 Safety Practices \n2.2.1 Knowledge in handling disinfectants and other \nveterinary supplies \n2.2.2 Knowledge of proper waste handling and \nmanagement \n2.3 Mathematics and Mensuration \n2.3.1 Proper calculation of inclusion rates of \ndisinfectants and chemicals \n2.4 Codes and Regulations \n2.4.1 Appropriate legal and supervising regulatory \nbody pertinent to bio-security program such as \nBAI, PAHC, and DENR \n2.5 Systems, Processes and Operations \n2.5.1 Selection of replacement or new stocks \n2.5.2 Implementation of appropriate animal health \nprogram \n2.6 Materials: Uses and Specifications \n2.6.1 Drugs and medical supplies \n2.6.2 Office supplies and materials – for regular \ninventory and monitoring of animal health \nprogram \n \n2.6.2.1. Tools and Equipment: Uses and Specifications \n A Rust remover \n B Power sprayer \n C Torch \n2.6.2.2. Values \nA Honesty in reporting \nB Confidence in selecting healthy replacement or \nnew stocks \nC Personal integrity and perseverance in \nperforming routine bio-security measures \n D Ability to work well with others harmoniously\n\n--- PDF PAGE 40 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n38\n \n \n3. Underpinning \nSkills \n3.1 Work safety \n3.2 Calculations \n3.3 Communicate effectively \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 Observation/Demonstration \n4.2 Third party report \n4.3 Portfolio \n5. Resource \nImplication \nThe following resources MUST be provided: \n5.1 Farm location with required facilities \n5.2 Supplies and materials applied for bio-security measures \n6. Context of \nAssessment \n6.1 Competency may be assessed individually in the actual \nworkplace or through accredited farms/institution\n\n--- PDF PAGE 41 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n39\n \nUNIT OF COMPETENCY : \nADMINISTER DRUGS AND BIOLOGICS \n \nUNIT CODE \n \n:"
