  "source_section_text": "Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.2.\nThe qualification of Animal Health Care and Management NC III may\nhave specialization in either hog/pig/swine or cattle/ox.\n\n4..2.1. The qualification Animal Health Care and Management NC III\n(Hog/Pig/Swine) may be attained through accumulation of\nCOCs in the following areas. The possession of COC in the\nUnit of Competency – Raise Swine (Unit Code AGR621303)\nis a prerequisite for taking the assessment in these areas:\n\n4.2.1.1. Administer drugs and biologics\n4.2.1.1.1. Restrain and handle animals\n4.2.1.1.2 Administer drugs and biologics\n\n4.2.1.2. Apply bio-security measures\n4.2.1.2.1. Restrain and handle animals\n4.2.1.2.2. Apply bio-security measures\n\n4.2.1.3. Collect and handle specimen\n4.2.1.3.1. Restrain and handle animals\n4.2.1.3.2. Collect and handle specimen\n\n4.2.1.4. Handle and store drugs and biologics\n\n4.2.2 The qualification Animal Health Care and Management NC III\n(Cattle/Ox) may be attained through accumulation of COCs in\nthe following areas. The possession of COC in the Unit of\nCompetency\n–\nRaise\nLarge\nRuminants\n(Unit\nCode\nAGR621304) is a prerequisite for taking the assessment in\nthese areas:\n\n4.2.2.1 Administer drugs and biologics\n4.2.2.1.1. Restrain and handle animals\n4.2.2.1.2 Administer drugs and biologics\n\n4.2.2.2. Apply bio-security measures\n4.2.2.2.1. Restrain and handle animals\n4.2.2.2.2. Apply bio-security measures\n\n--- PDF PAGE 62 ---\n_____________________________________________________________________________\nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III\n\n\n60\n\n4.2.2.3. Collect and handle specimen\n4.2.2.3.1. Restrain and handle animals\n4.2.2.3.2 Collect and handle specimen\n\n4.2.2.4 Handle and store drugs and biologics\n\n4.3.\nAccumulation and submission of all COCs acquired for the relevant\nunits of competency comprising this qualification, an individual shall be\nissues the corresponding National Certificate\n4.4.\nAssessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.5.\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs\n\n4.4.2 Experienced Workers (wage employed or self-employed)\n\n4.6.\nThe guidelines on assessment and certification are discussed in detail\nin the Procedures Manual on Assessment and Certification and\nGuidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS).\n\n--- PDF PAGE 63 ---\n_____________________________________________________________________________\nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III\n\n\n61\n COMMON\nCOMPETENCIES\nAnimal Health Care and\nManagement NC III\nCollect\nand\nHandle\nSpecimen\nHandle\nand Store\nDrugs and\nBiologics\nAdminister\nDrugs and\nBiologics\nApply Bio-\nSecurity\nMeasures\nRestrain\nand\nHandle\nAnimal\nCOMPETENCY MAP\nCORE COMPETENCIES\nApply Safely\nMeasures in\nfarm\noperations\nUse Farm Tools\nand Equipment\nPerform\nEstimation and\nBasic Calculation\nLead workplace\ncommunication\nWork with\nothers\nWork in team\nenvironment\nLead small\nteams\nSolve problems\nrelated to work\nactivities\nReceive and\nrespond to\nworkplace\ncommunication\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\nApply problem\nsolving techniques\nto workplace\nPlan and organize\nwork\nPractice career\nprofessionalism\nDemonstrate work\nvalues\nPractice occupational\nhealth and safety\nprocedures\nDevelop and\npractice\nnegotiation skills\nUse mathematical\n method\nUse relevant\ntechnologies\nUtilize specialized\ncommunication\nskills\nDevelop team and\nindividual\nCollect, analayze\nand organize\ninformation\nPromote\nenvironmental\nprotection\nPractice basic\nhousekeeping\nprocedures\n\n--- PDF PAGE 64 ---\n_____________________________________________________________________________\nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III\n\n\n62\nDEFINITION OF TERMS\n\n\nAnaphylactic Shock – manifested by the acute inflammation of an immunized animal\nwhen injected. The peculiar characters of these reactions are dependent upon\nthe site of entry of the irritating agent, which is the vascular system in one\ninstance and tissue spaces in the other.\n\nCalf – a newly born male or female cattle or buffalo\n\nCulling – is the removal of undesirable or inferior animals in the herd based on\nimportant economic traits and overall performance\n\nGestation period – refers to the period of carrying the young in the womb\n\nFarrowing – refers to the period of giving birth in pigs or swine\n\nDry animal – a sow or cow whose liter has been weaned but which has not yet been\nbred or is not pregnant\n\nHeifer – a young female cattle or buffalo\n\nVaccination – a preventive measure to inoculate an animal with a mildly toxic\npreparation of bacteria or a virus of specific disease to prevent or to lessen the\neffects of the disease\n\nWeanling – refers to a young animal of either sex which has been separated from the\nmother at the end of the lactation period\n\nLivestock – domestic animals kept for use on a farm and raised for sale and profit\n\nSelection – refers to the process of choosing males and females with desirable\ncharacteristics for replacement stocks\n\nBiologics – agents, such as vaccines, that give immunity to diseases or harmful biotic\nstresses\n\nDrug – a substance used in the diagnosis, treatment, or prevention of a disease or as a\ncomponent of a medication\n\nSpecimen – a sample, as of tissue, blood, or urine, used for analysis and diagnosis\n\nBio-security – security from transmission of infectious diseases, parasites and pests.\nBiosecurity threats come from the possible introduction of a disease into a herd\nor flock, which is not known to have the disease. The introduction of disease\nusually will be of non-intentional nature\nSubcutaneous – below or under the skin\n\n--- PDF PAGE 65 ---\n_____________________________________________________________________________\nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III\n\n\n63\n\nLIST OF ABBREVIATIONS\n\n\nBAI\n-\nBureau of Animal Industry\n\nNMIS -\nNational Meat Inspection Service\n\nPAHC -\nPhilippine Animal Health Center\n\nAO\n-\nAdministrative Order\n\nSOP -\nStandard Operating Procedure\n\nDENR -\nDepartment of Environment and Natural Resources\n\nIFAT -\nImmunoflourescent Antibody Test\n\nRPL -\nRecognition of Prior Learning\n\nUTPRAS-\nUnited TVET Program Registration and Accreditation System\n\nTVET -\nTechnical Vocational Education and Training\n\nDTS -\nDual Training System\n\nTQ\n-\nTrainer Qualification\n\nTM\n-\nTraining Methodology\n\nCOC -\nCertificate of Competency\n\nNC\n-\nNational Certificate\n\nPTQCS-\nPhilippine TVET Qualification and Certification System\n\n--- PDF PAGE 66 ---\n_____________________________________________________________________________\nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III\n\n\n64\nACKNOWLEDGMENTS\n\n\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend gratitude and appreciation to the many representatives of business, industry,\nacademe and government agencies and labor groups who donated their time and\nexpertise to the development and validation of these Training Regulations.\n\n• THE TECHNICAL ADVISORY PANEL (TAP)\n\nDR. MARIO S. SUBA (Chair)\nPresidential Assistant for Internal\nDevelopment/Professor\nCentral Luzon State University (CLSU)\nCity Science of Muños, Nueva Ecija\n\nDIR. PEDRO O. OCAMPO\nLivestock Development Council\nDepartment of Agriculture\n\nMS. JOSEFINA A. CONTRERAS\nOfficer-In-Charge\nBureau of Animal Industry\nValenzuela, Metro Manila\n\nDR. EDUARDO M. MARIANO (DVM)\nFarm Manager/ Consultant\nARSEN Farm Inc.\nMajayjay, Laguna\n\n• THE TECHNICAL EXPERT PANEL (TEP)\n\nDR. RAUL V. BARON\nProprietor\n3RN Farm\nSan Mateo, Rizal\nDR. BENEDICTO A. SANTIAGO\nOwner\nMelfarms\nPililla, Rizal\n\n\nDR. AMIELJUN T. SANTIAGO\nOwner/Operations Manager\nXYBAS Enterprises\nBinangonan, Rizal\n\nDR. LUNA MIRAFLOR N. AGUIRRE\nTechnical and Regulatory Manager\nVirbac Phils., Inc.\nOrtigas Center, Pasig City\nDR. RUTH M. SONACO\nSection Chief\nInternational Training Center on Pig\nHusbandry (ITCPH)\nLipa City, Batangas\n\nDR. DANILO M. COSTA\nSenior Agriculturist\nAnimal Health Division\nBureau of Animal Industry\nDiliman, Quezon City\n\nDR. LEONILO R. RESONTOC\nOfficer In-Charge\nImmunization and Disease Control\nSection\nAnimal Health Division\nBureau of Animal Industry\nDiliman, Quezon City\n\n--- PDF PAGE 67 ---\n_____________________________________________________________________________\nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III\n\n\n65\n\n\nThe Participants in the National Validation of this Training Regulation:\n\n•\nLimcoma\n•\nUNIBAT\n•\n ITCPH\n•\n Lipa City Veterinary Office\n\nThe Management and Staff of the TESDA Secretariat"
