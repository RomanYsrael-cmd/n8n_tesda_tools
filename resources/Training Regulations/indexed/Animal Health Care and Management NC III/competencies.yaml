        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Performed estimation \n1.2 Performed basic workplace calculation \n1.3 Applied corrective measures as maybe necessary \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 \nMathematics \n2.1.1 Basic mathematical operations \n2.1.2 Percentage and ratios \n2.1.3 Unit Conversion \n2.1.4 Basic accounting principles and procedures \n2.1.4.1 Production cost \n2.1.4.2 Sales \n2.1.4.3 Accounts receivables/payables \n2.2 Systems, Processes and Operations \n2.2.1 Knowledge in different management practices and \noperational procedures \n2.3 \nValues \n2.3.1 Safety consciousness \n2.3.2 Time consciousness and management \n2.3.3 Cost consciousness \n2.3.4 Precision \n3. Underpinning \nSkills \n3.1 \nAbility to perform basic calculation \n3.2 \nCommunicate effectively \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 Practical demonstration \n4.2 Written examination \n5. Resource \nImplications \nThe following resources MUST be provided: \n5.1 \nRelevant tools and equipment for basic calculation \n5.2 \nRecommended data \n6. Context of \nAssessment \n6.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 32 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n30\n \n \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nRESTRAIN AND HANDLE LIVESTOCK \n \nUNIT CODE \n \n:"
        },
        "source_text": "AGR321203 \n \nUNIT DESCRIPTOR: \nThis unit covers the knowledge, skills and attitudes \nrequired to perform basic workplace calculations. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. \nPerform estimation \n1.1 Job requirements are identified from written or oral \ncommunications \n1.2 Quantities of materials and resources required to \ncomplete a work task are estimated \n1.3 The time needed to complete a work activity is \nestimated \n1.4 Accurate estimate for work completion are made \n1.5 Estimate of materials and resources are reported to \nappropriate person \n2. \nPerform basic \nworkplace \ncalculation \n2.1 Calculations to be made are identified according to \njob requirements \n2.2 Correct method of calculation identified \n2.3 System and units of measurement to be followed \nare ascertained \n2.4 Calculation needed to complete work tasks are \nperformed using the four basic process of addition, \ndivision, multiplication and subtraction \n2.5 Calculate whole fraction, percentage and mixed when \nare used to complete the instructions \n2.6 Number computed in self checked and completed for \nalignment\n\n--- PDF PAGE 30 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n28\n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. \nCalculations \n1.1 \nQuantity of feeds \n1.2 \nAmount of medicines \n2. \nMethod of calculation \n \n2.1 \nAddition \n2.2 \nSubtraction \n2.3 \nMultiplication \n2.4 \nDivision \n2.5 \nRatio and proportion \n3. \nSystem of measurement \n3.1 \nEnglish \n3.2 \nMetric \n4. \nUnits of measurement \n4.1 \nArea \n4.2 \nVolume \n4.3 \nWeight\n\n--- PDF PAGE 31 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n29\n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Performed estimation \n1.2 Performed basic workplace calculation \n1.3 Applied corrective measures as maybe necessary \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 \nMathematics \n2.1.1 Basic mathematical operations \n2.1.2 Percentage and ratios \n2.1.3 Unit Conversion \n2.1.4 Basic accounting principles and procedures \n2.1.4.1 Production cost \n2.1.4.2 Sales \n2.1.4.3 Accounts receivables/payables \n2.2 Systems, Processes and Operations \n2.2.1 Knowledge in different management practices and \noperational procedures \n2.3 \nValues \n2.3.1 Safety consciousness \n2.3.2 Time consciousness and management \n2.3.3 Cost consciousness \n2.3.4 Precision \n3. Underpinning \nSkills \n3.1 \nAbility to perform basic calculation \n3.2 \nCommunicate effectively \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 Practical demonstration \n4.2 Written examination \n5. Resource \nImplications \nThe following resources MUST be provided: \n5.1 \nRelevant tools and equipment for basic calculation \n5.2 \nRecommended data \n6. Context of \nAssessment \n6.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 32 ---\n_____________________________________________________________________________ \nTR - ANIMAL HEALTH CARE AND MANAGEMENT NC III \n \n \n30\n \n \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nRESTRAIN AND HANDLE LIVESTOCK \n \nUNIT CODE \n \n:"
