  "source_text": "Definition of Terms\n\nFor the purpose of this Competency Standard, the words\n\nFor the purpose of this Competency Standard, the words\n\n1. Tamper\nRefers to attachment that provides initial compaction of ready\nmixed concrete or asphalt materials as they are laid by concrete or\nasphalt Paver.\n2. Screed\nRefers to the attachment that equally spreads and levels off\nasphalt mix. This attachment includes conveyor belt, auger and\ntamper.\n3. Auger\nRefers to the attachment that distributes ready mixed concrete\nfrom the hopper to the left and right portion of the Paver.\n4. Conveyor\nIt is the attachment that carries ready mixed asphalt from feed\nhopper to the auger.\n\n--- PDF PAGE 50 ---\nTR HEAVY EQUIPMENT OPERATION"
