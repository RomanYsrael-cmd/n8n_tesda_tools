      "definition": "Refers to attachment that provides initial compaction of ready mixed concrete or asphalt materials as they are laid by concrete or asphalt Paver. 2. Screed Refers to the attachment that equally spreads and levels off asphalt mix. This attachment includes conveyor belt, auger and tamper. 3. Auger Refers to the attachment that distributes ready mixed concrete from the hopper to the left and right portion of the Paver. 4. Conveyor It is the attachment that carries ready mixed asphalt from feed hopper to the auger."
