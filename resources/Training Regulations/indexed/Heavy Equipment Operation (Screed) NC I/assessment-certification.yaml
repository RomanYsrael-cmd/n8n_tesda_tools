  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1 To attain the National Qualification of HEAVY EQUIPMENT OPERATION -\nSCREED NC I, the candidate must demonstrate competence through\nproject-type assessment covering all the units listed in Section 1. The\nsuccessful candidate shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2 The qualification of Screed Operation NC I can be attained through\ndemonstration of competence through project-type assessment covering all\nthe units of qualification.\n\n4.3 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1\nGraduates of formal, non-formal and/or informal training including\nenterprise-based training programs\n\n4.4.2\nExperienced Workers (wage-employed or self-employed)\n\nThe guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\"\n\n--- PDF PAGE 47 ---\n\n--- PDF PAGE 48 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMPETENCY MAP\nCONSTRUCTION-HEAVY EQUIPMENT OPERATION -\nSUB- SECTOR\nBASIC\nPerform productive\noperation for\nhydraulic excavator\nPerform productive\noperation for truck-\nmounted crane\nPerform productive\noperation for tower crane\nPerform productive\noperation for forklift\nOperate and maintain\nscreed\nPerform productive\noperation for\nbackhoe loader\nPerform pre- and post-\noperation procedures for\nlifting equipment\nPerform basic\npreventive maintenance\nservicing for hauling\nPerform productive\noperation for off-\nhigh way dump\ntruck (articulated)\nPerform productive\noperation for\nbulldozer\nPerform productive\noperation for wheel\nloader\nPerform productive\noperation for motor\ngrader\nPerform pre- and post-\noperation procedures for\nhauling equipment\nPerform productive\noperation for road\nroller\nPerform basic preventive\nmaintenance servicing for\nlifting equipment\nPerform pre- and post operation\nchecking procedures for screed\nPerform pre- and post-\noperation procedures for\nearth moving equipment\nPerform productive\noperation for\ncrawler crane\nPerform basic preventive\nmaintenance servicing for\nearth moving equipment\nPerform productive\noperation for rough-\nterrain crane\nPerform productive\noperation for off-highway\ndump truck (rigid)\nPerform productive\noperation for\nconcrete pump\nPerform productive\noperation for paver\nPerform basic preventive\nmaintenance servicing for\nconcreting and asphalting\nequipment\nPerform productive\noperation for on-\nhighway dump truck\n(rigid)\nPerform pre- and post-\noperation procedures for\nconcreting and asphalting\nequipment\nPerform productive\noperation for transit\nmixer\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nBASIC\nCOMPETENCIES\nReceive and respond\nto workplace\ncommunication\nWork with others\nUse relevant\ntechnologies\nPractice career\nprofessionalism\nUtilize specialized\ncommunication\nskills\nPractice occupational\nhealth and safety\nprocedures\nDevelop teams and\nindividuals\nLead workplace\ncommunication\nDemonstrate work\nvalues\nSolve problems\nrelated to work\nactivities\nDevelop and\npractice negotiation\nskills\nPractice\nhousekeeping\nprocedure (5s)\nUse mathematical\nconcepts and\ntechniques\nWork in a team\nenvironment\nParticipate in\nworkplace\ncommunication\nApply problem-\nsolving techniques\nin the workplace\nPlan and organize\nwork\nCollect, analyze\nand organize\ninformation\nLead small team\nPromote\nenvironmental\nprotection\nPrepare\nconstruction\nmaterials and tools\nObserve procedures,\nspecifications and\nmanual of instructions\nPerform\nmensuration and\ncalculations\nMaintain tools\nand equipment\n\n--- PDF PAGE 49 ---\nTR HEAVY EQUIPMENT OPERATION\n\nDefinition of Terms\n\nFor the purpose of this Competency Standard, the words\n\nFor the purpose of this Competency Standard, the words\n\n1. Tamper\nRefers to attachment that provides initial compaction of ready\nmixed concrete or asphalt materials as they are laid by concrete or\nasphalt Paver.\n2. Screed\nRefers to the attachment that equally spreads and levels off\nasphalt mix. This attachment includes conveyor belt, auger and\ntamper.\n3. Auger\nRefers to the attachment that distributes ready mixed concrete\nfrom the hopper to the left and right portion of the Paver.\n4. Conveyor\nIt is the attachment that carries ready mixed asphalt from feed\nhopper to the auger.\n\n--- PDF PAGE 50 ---\nTR HEAVY EQUIPMENT OPERATION\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies and who contributed their\ntime and expertise to the development and validation of this Training\nRegulations.\n\n• THE TECHNICAL EXPERT PANEL (TEP)\n\nFLORELLO P. QUIANZON\nConsultant, Equipment Concrete Product\nDivision (Equipment Management)\nMakati Development Corporation\nAUGUSTO S. BUYAO\nTraining Manager\nMaxima Equipment Co. Inc.\n\nTito C. Tadios\nTraining Manager (Heavy Equipment\nOperation and Maintenance)\nMonark Equipment Co. Inc\n\nRUDOLFO D. ANCHETA\nQuality Controller Supervisor (Repair\nand Maintenance of Hydraulic\nExcavator/Basic Hydraulic)\nCivil Merchanidising Inc.\nEduardo C. Emas\nTrainor\nConstruction Manpower Development\nCenter\nCORNELIO D. PADUA\nHeavy Equipment Supervisor\nMakati Development Corp.\n\nAUGUST CONSEBIDO\nSales supervisor\nMonark Equipment Co. Inc.\nELIAS RODRIGUEZ\nTrainor\nMonark equipment Co. Inc.\nEUGENIO S. GUTIERREZ\nOperator\nMakati Development Corp.\nWILBERT INCHOCO\nTraining Manager\nMonark Equipment co. Inc.\nVINCENT L. ORAIS\nOperator\nMakati Development Corp\nMANUELITO S. SEVERINO\nOperator\nMakati Development Corp.\n\n--- PDF PAGE 51 ---\nTR HEAVY EQUIPMENT OPERATION\n\nERIC PEREZ\nSales Manager\nWirtgen Philippines\nALFREDO M. ABELA\nOperator\nMakati Development Corporation\n\nThe Management and Staff of the TESDA Secretariat\n\nQualifications and Standards Office\n\nThe Management and Staff of the ACEL Secretariat"
