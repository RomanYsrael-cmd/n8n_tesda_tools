    "source_text": "SECTION 3\nTRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Heavy Equipment Operations\n(screed attachment of Asphalt Paver) NC I.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: HEAVY EQUIPMENT OPERATION NC Level: NC I\n\nCourse Description:\n\n This course is designed to equip individual with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation (Screed attachment) NC I.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 39 ---\nTR HEAVY EQUIPMENT OPERATION\n\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 40 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify materials\n1.2 Requisition materials\n1.3 Receive and inspect\n materials\nAudio Visual\nsimulation\nDiscussion\nPractical\nexercise\nDemonstration\nDirect observation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral test\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\n specification/ manuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation\nOral questioning\nWritten test or\nexamination\nThird party report\nDemonstration\n(able to impart\nknowledge and\nskills)\n3. Perform\nmensurations\nand calculation\n3.1 Select measuring\n instruments\n3.2 Carry out measurements\n and calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation\nOral questioning\nWritten test or\nexamination\nThird party report\nDemonstration\n(able to impart\nknowledge and\nskills)\n4. Maintain tools\nand equipment\n4.1 Check condition of tools\nand equipment\n4.2 Perform basic preventive\nmaintenance\n4.3 Sharpen edge and tooth\ncutting tools\n4.4 Store tools and equipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation\nof application of\ntasks\nOral questioning\nWritten test or\nexamination\nThird party report\nDemonstration\n\n--- PDF PAGE 41 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCORE COMPETENCIES\n(64 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre and\npost-operation\nchecking\nprocedures for\nscreed\n\n1.1 Perform visual check\n1.2 Perform operation checks\n1.3 Perform post-operation\nchecking procedure\n1.4 Perform post-operation\n procedures\n• Lecture\n• Practical /\nDemonstration\n\n• Observation/\nDemonstration\nwith interview\n• Written test\n\n2. Operate and\nmaintain Screed\n2.1 Monitor and support\nasphalt\n overlaying\n2.2 Clean screed\n\n• Lecture\n• Practical /\nDemonstration\n\n• Observation/\nDemonstration\nwith interview\n• Written test\n\n--- PDF PAGE 42 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry-required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\n\n--- PDF PAGE 43 ---\nTR HEAVY EQUIPMENT OPERATION\n\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n• Can communicate both oral and written\n• Physically and mentally fit\n• With good moral character\n• Can perform basic mathematical computation\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n(MATERIALS HANDLING OPERATION)\n\n--- PDF PAGE 44 ---\nTR HEAVY EQUIPMENT OPERATION\n\nBelow is the recommended list of tools, equipment and materials for the\ntraining of 25 trainees for the operation of screed attachment\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n1 set •\nWrenches (box and\nopen-end 8-24 mm-\nmetric & 7/16 – 1” -\nEnglish )\n1 unit\n•\nPaver (MOA /\nrental)\n5 kilos\n•\nMulti-purpose\ngrease\n1 set •\nHammer, ball peen\n(34 lbs)\n1 unit\n•\nPressure washer\n2 cans •\nPenetrating oil\n(250 ml)\n1 set •\nPliers (mechanical\n10“)\n2 kilos\n•\nCotton rugs\n1 pc\n\n•\nAdjustable wrench\n(18“)\n\n5 liters\n•\nCleaning\nsolvent\n2 pcs\n•\nGrease gun\n\n1 pair\n•\nWorking\nClothes\n1 set •\nScrew driver (10 “\nflat &Philips)\n\n10 pairs\n•\nSafety shoes\n25\npcs\n•\nPutty knife\n\n10 pairs\n•\nGloves\n1 pc\n•\nPry bar (heavy duty)\n\n10 pcs\n•\nGoggles\n1 pc\n•\nPipe wrench (12”)\n\n10 pcs\n•\nDust Mask\n1 pc\n•\nVise grip (12 “)\n\n10 pcs\n•\nHard hats\n1 pc. • Pull push rule\n\n1 pc\n• Operator’s\nmanual\n5\npcs.\n• Steel brush\n\n25\npackets\n• Soap (hand\ncleaning)\n1 pc\n• Hydraulic jack (10\ntons)\n\nNOTE: Implementation of the training program can be made possible through a MOA between the\ntraining school and industry\n\n3.5\nTRAINING FACILITIES\n\nHEAVY EQUIPMENT OPERATION (CONCRETING AND\nASPHALTING)\n\n--- PDF PAGE 45 ---\nTR HEAVY EQUIPMENT OPERATION\n\nThe screed attachment operation workshop must be made of reinforced\nconcrete or steel structure. The size must be suited on the requirements of the\ncompetencies. The class size of 25 students/trainees is reserved for the lecture\nroom and the practical demonstration area for carrying out minor screed\nattachment maintenance servicing. Most of the learning activities are performed\nindividually in the students/trainees work area.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ.\nMETERS\nStudent/Trainee’s Working\nSpace\n\n4 sq.m per\nstudent\n100.0 sq.m.\nLecture Room\n48.00\n48.0\nLearning Resource Center\n24.00\n24.0\n172\nFacilities/Equipment\n/Circulation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n224\nWorking field\n0.5 hectare (MOA/Rental)\n\n3.6 TRAINER’S QUALIFICATIONS\n\nHEAVY EQUIPMENT OPERATION (PAVER [SCREED\nATTACHMENT]) NC I\n\n• Must be a holder of Heavy Equipment Operation (Paver) NC-\nII\n• Must have undergone training on Training Methodology II (TM\nII)\n• Must be physically and mentally fit\n• *Must have at least 5 years job/industry experience*\n• Must be a civil service eligible (for government position or\nappropriate professional license\n• issued by the Professional Regulatory Commission)\n\n * Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n--- PDF PAGE 46 ---\nTR HEAVY EQUIPMENT OPERATION"
