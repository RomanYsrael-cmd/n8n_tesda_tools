  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details and contents of the core units of competency\nrequired in HEAVY EQUIPMENT OPERATION - SCREED OPERATION NC I.\nThese units of competency are categorized into basic, common and core\ncompetencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY:\nRECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION\nUNIT CODE :\n500311101\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto receive, respond and act on verbal and written\ncommunication.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Follow routine spoken\nmessages\n1.1. Required information is gathered by listening\nattentively and correctly interpreting or understanding\ninformation/instructions\n1.2. Instructions/information are properly recorded\n1.3. Instructions are acted upon immediately in\naccordance with information received\n1.4. Clarification is sought from workplace supervisor on all\noccasions when any instruction/information is not clear\n2. Perform workplace\nduties following written\nnotices\n2.1 Written notices and instructions are read and\ninterpreted correctly in accordance with\norganizational guidelines\n2.2 Routine written instruction are followed in sequence\n2.3 Feedback is given to workplace supervisor based on\nthe instructions/information received\n\n--- PDF PAGE 5 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nIt refers to :\n1.1. Handwritten and printed material\n1.2. Internal memos\n1.3. External communications\n1.4. Electronic mail\n1.5. Briefing notes\n1.6. General correspondence\n1.7. Marketing materials\n1.8. Journal articles\n2. Organizational\nGuidelines\nIt may include:\n2.1. Information documentation procedures\n2.2. Company policies and procedures\n2.3. Organization manuals\n2.4. Service manual\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated knowledge of organizational procedures\nfor handling verbal and written communications\n1.2. Received and acted on verbal messages and\n\n--- PDF PAGE 6 ---\nTR HEAVY EQUIPMENT OPERATION\n\ninstructions\n1.3. Demonstrated competency in recording\ninstructions/information\n2. Underpinning\nKnowledge and\nAttitudes\n2.1. Knowledge of organizational policies/guidelines in\nregard to processing internal/external information\n2.2. Ethical work practices in handling communications\n2.3. Communication process\n3. Underpinning Skills\n3.1. Conciseness in receiving and clarifying\nmessages/information/communication\n3.2. Accuracy in recording messages/information\n4. Resource Implications\nThe following resources MUST be provided:\n4.1. Pens\n4.2. Note pad\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Direct Observation\n5.2. Oral interview\n5.3. Written Evaluation\n5.4. Third Party Report\n6. Context of Assessment\n6.1 Competency may be assessed individually in the actual\n workplace or simulation environment in TESDA\n accredited institutions\n\nUNIT OF COMPETENCY:\nWORK WITH OTHERS\nUNIT CODE :\n500311102\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required\nto develop workplace relationship and contribute in\nworkplace activities\n\n--- PDF PAGE 7 ---\nTR HEAVY EQUIPMENT OPERATION\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Develop effective\nworkplace relationship\n1.1 Duties and responsibilities are done in a positive\nmanner to promote cooperation and good relationship\n1.2 Assistance is sought from workgroup when difficulties\narise and addressed through discussions\n1.3 Feedback provided by others in the team is\nencouraged, acknowledged and acted upon\n1.4 Differences in personal values and beliefs are\nrespected and acknowledged in the development\n2. Contribute to work\ngroup activities\n2.1 Support is provided to team members to ensure\nworkgroup goals are met\n2.2 Constructive contributions to workgroup goals and tasks\nare made according to organizational requirements\n2.3 Information relevant to work is shared with team\nmembers to ensure designated goals are met\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements including\n\n--- PDF PAGE 8 ---\nTR HEAVY EQUIPMENT OPERATION\n\nOHS\n1.5 Code of conduct\n2. Work group\n2.1 Supervisor or manager\n2.2 Peers/work colleagues\n2.3 Other members of the organization\n3. Feedback on\nperformance\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues\nand clients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring service\ndelivery\n4. Providing support to\nteam members\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n5. Organizational\nrequirements\n\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes and\nstandards\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1. Provided support to team members to ensure goals\nare met\n1.2. Acted on feedback from clients and colleagues\n1.3. Accessed learning opportunities to extend own\npersonal work competencies to enhance team goals\nand outcomes\n\n--- PDF PAGE 9 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2. Underpinning\nKnowledge\n2.1. The relevant legislation that affects operations,\nespecially with regards to safety\n2.2. Reasons why cooperation and good relationships are\nimportant\n2.3. Knowledge of the organization’s policies, plans and\nprocedures\n2.4. Understanding how to elicit and interpret feedback\n2.5. Knowledge of workgroup member’s responsibilities\nand duties\n2.6. Importance of demonstrating respect and empathy in\ndealings with colleagues\n2.7. Understanding of how to identify and prioritize\npersonal development opportunities and options\n3. Underpinning Skills\n3.1. Ability to read and understand the organization’s\npolicies and work procedures\n3.2. Write simple instructions for particular routine tasks\n3.3. Interpret information gained from correspondence\n3.4. Communication skills to request advice, receive\nfeedback and work with a team\n3.5. Planning skills to organized work priorities and\narrangement\n3.6. Technology skills including the ability to select and use\ntechnology appropriate to a task\n3.7. Ability to relate to people from a range of social,\ncultural and ethnic backgrounds.\n\n--- PDF PAGE 10 ---\nTR HEAVY EQUIPMENT OPERATION\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2. Materials relevant to the proposed activity or task\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion of\nissues and strategies\n6. Context for\nAssessment\n6.1. Competency assessment may occur in workplace or\nany appropriately simulated environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in group\n\nUNIT OF COMPETENCY:\nDEMONSTRATE WORK VALUES\nUNIT CODE :\n50031103\nUNIT DESCRIPTOR : This unit covers the knowledge, skills, and attitude in\ndemonstrating proper work values.\n\n--- PDF PAGE 11 ---\nTR HEAVY EQUIPMENT OPERATION\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variables\n1. Define the purpose\nof work\n\n1.1 One’s unique sense of purpose for working and the\nwhy’s of work are identified, reflected on and clearly\ndefined for one’s development as a person and as a\nmember of society.\n1.2 Personal mission is in harmony with company’s values\n2. Apply work\nvalues/ethics\n2.1 Work values/ethics/concepts are classified and\n reaffirmed in accordance with the transparent company\n ethical standards, policies and guidelines\n2.2 Work practices are undertaken in compliance with\n industry work ethical standards, organizational policy\n and guidelines\n2.3 Personal behavior and relationships with co-workers\n and/or clients are conducted in accordance with ethical\n standards, policy and guidelines\n2.4 Company resources are used in accordance with\n transparent company ethical standard, policies and\n guidelines\n3. Deal with ethical\nproblems\n3.1 Company ethical standards, organizational policy and\nguidelines on the prevention and reporting of unethical\nconduct are accessed and applied in accordance with\ntransparent company ethical standard, policies and\nguidelines.\n3.2 Work incidents/situations are reported and/or resolved\nin accordance with company protocol/guidelines.\n3.3 Resolution and/or referral of ethical problems identified\nare used as learning opportunities.\n4. Maintain integrity of\nconduct in the\nworkplace\n4.1 Personal work practices and values are demonstrated\n consistently with acceptable ethical conduct and\n company’s core values\n4.2 Instructions to co-workers are provided based on\n ethical, lawful and reasonable directives\n4.3 Company values/practices are shared with co-workers\n using appropriate behavior and language\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n--- PDF PAGE 12 ---\nTR HEAVY EQUIPMENT OPERATION\n\n1. Work values / ethics /\n concepts\nMay include but are not limited to:\n1.1 Commitment/ Dedication\n1.2 Sense of urgency\n1.3 Sense of purpose\n1.4 Love for work\n1.5 High motivation\n1.6 Orderliness\n1.7 Reliability\n1.8 Competence\n1.9 Dependability\n1.10 Goal-oriented\n1.11 Sense of responsibility\n1.12 Being knowledgeable\n1.13 Loyalty to work/company\n1.14 Sensitivity to others\n1.15 Compassion/Caring attitude\n1.16 Balancing between family and work\n1.17 Pakikisama\n1.18 Bayanihan spirit/teamwork\n1.19 Sense of nationalism\n2. Work practices\n2.1 Quality of work\n2.2 Punctuality\n2.3 Efficiency\n2.4 Effectiveness\n2.5 Productivity\n2.6 Resourcefulness\n2.7 Innovativeness/Creativity\n2.8 Cost conciousness\n2.9 5S\n2.10 Attention to details\n3. Incidents/situations\n3.1 Violent/intensed dispute or argument\n3.2 Gambling\n3.3 Use of prohibited substances\n3.4 Pilferages\n3.5 Damage to person or property\n3.6 Vandalism\n3.7 Falsification\n3.8 Bribery\n3.9 Sexual Harassment\n3.10 Blackmail\n\n--- PDF PAGE 13 ---\nTR HEAVY EQUIPMENT OPERATION\n\n4. Company resources\n4.1 Consumable materials\n4.2 Equipment/Machineries\n4.3 Human\n4.4 Time\n4.5 Financial resources\n5. Instructions\n5.1 Verbal\n5.2 Written\n\n--- PDF PAGE 14 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical Aspects\n of Competency\nAssessment requires evidence that the candidate:\n1.1 Defined one’s unique sense of purpose for working\n1.2 Clarified and affirmed work values/ethics/concepts\nconsistently in the workplace\n1.3 Demonstrated work practices satisfactorily and\nconsistently in compliance with industry work ethical\nstandards, organizational policy and guidelines\n1.4 Demonstrated personal behavior and relationships with\nco-workers and/or clients consistent with ethical\nstandards, policy and guidelines\n1.5 Used company resources in accordance with company\nethical standard, policies and guidelines.\n1.6 Followed company ethical standards, organizational\npolicy and guidelines on the prevention and reporting of\nunethical conduct/behavior\n2. Underpinning\nKnowledge\n2.1 Occupational health and safety\n2.2 Work values and ethics\n2.3 Company performance and ethical standards\n2.4 Company policies and guidelines\n2.5 Fundamental rights at work including gender sensitivity\n2.6 Work responsibilities/job functions\n2.7 Corporate social responsibilities\n2.8 Company code of conduct/values\n2.9 Balancing work and family responsibilities\n3. Underpinning Skills\n3.1 Interpersonal skills\n3.2 Communication skills\n3.3 Self awareness, understanding and acceptance\n3.4 Application of good manners and right conduct\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/Scenarios\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Third Party Reports\n6. Context of Assessment 6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT OF COMPETENCY:\nPRACTICE HOUSEKEEPING PROCEDURES\nUNIT CODE :\n500311104\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto apply the basic housekeeping procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Sort and remove\nunnecessary items\n1.1 Reusable, recyclable materials are sorted in\naccordance with company/office procedures\n1.2 Unnecessary items are removed and disposed of\n in accordance with company or office procedures\n2. Arrange items\n2.1 Items are arranged in accordance with company/office\nhousekeeping procedures\n2.2 Work area is arranged according to job requirements\n2.3 Activities are prioritized based on instructions.\n2.4 Items are provided with clear and visible\n identification marks based on procedure\n2.4 Safety equipment and evacuation passages are kept\nclear and accessible based on instructions\n3. Maintain work area,\ntools and equipment\n3.1 Cleanliness and orderliness of work area is maintained\nin accordance with company/office procedures\n3.2 Tools and equipment are cleaned in accordance with\nmanufacturer’s instructions/manual\n3.3 Minor repairs are performed on tools and equipment in\naccordance with manufacturer’s instruction/manual\n3.4 Defective tools and equipment are reported to\nimmediate supervisor\n4. Follow standardized\nwork process and\nprocedures\n4.1 Materials for common use are maintained in designated\narea based on procedures\n4.2 Work is performed according to standard work\nprocedures\n4.3 Abnormal incidents are reported to immediate\nsupervisor\n5. Perform work\nspontaneously\n5.1 Work is performed as per instruction\n5.2 Company and office decorum are followed and\n complied with\n5.3 Work is performed in accordance with occupational\nhealth and safety (OHS) requirements\n\n--- PDF PAGE 16 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Unnecessary items\nMay include but are not limited to:\n1.1 Non-recyclable materials\n1.2 Unserviceable tools and equipment\n1.3 Pictures, posters and other materials not related to work\n activity\n1.4 Waste materials\n2. Identification marks\n2.1 Labels\n2.2 Tags\n2.3 Color coding\n3. Decorum\n3.1 Company/ office rules and regulations\n3.2 Company/ office uniform\n3.3 Behavior\n4. Minor repair\nMinor repair include but not limited to:\n4.1 Replacement of parts\n4.2 Application of lubricants\n4.3 Sharpening of tools\n4.4 Tightening of nuts, bolts and screws\n\n--- PDF PAGE 17 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Practiced the basic procedures of 5S\n\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Principles of 5S\n2.2 Work process and procedures\n2.3 Safety signs and symbols\n2.4 General OH&S principles and legislation\n2.5 Environmental requirements relative to work safety\n2.6 Accident/Hazard reporting procedures\n3. Underpinning Skills\n3.1 Basic communication skills\n3.2 Interpersonal skills\n3.3 Reading skills required to interpret instructions\n3.4 Reporting/recording accidents and potential hazards\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Facilities, materials tools and equipment necessary for\nthe activity\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Third party report\n5.2 Interview\n5.3 Demonstration with questioning\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nPREPARE CONSTRUCTION MATERIALS AND TOOLS\nUNIT CODE :\nCON931201\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nidentifying, requesting and receiving construction materials and\ntools based on the required performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variable\n1. Identify materials\n\n1.1 Materials are listed as per job requirements\n1.2 Quantity and description of materials conform with the\njob requirements\n1.3 Tools and accessories are identified according to job\nrequirements\n2. Requisition materials\n\n2.1 Materials and tools needed are requested according to the\n list prepared\n2.2 Request is done as per company standard operating\n procedures (SOP)\n2.3 Substitute materials and tools are provided without\nsacrificing cost and quality of work\n3. Receive and inspect\n materials\n3.1 Materials and tools issued are inspected as per quantity\nand specification\n3.2 Tools, accessories and materials are checked for\ndamages according to enterprise procedures\n3.3 Materials and tools are set aside to appropriate location\nnearest to the workplace\n\n--- PDF PAGE 19 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials and Tools\n\n1.1 Electrical supplies\n1.2 Structural\n1.3 Plumbing\n1.4 Welding/pipefitting\n1.5 Carpentry\n1.6 Masonry\n2. Description of Materials\nand Tools\n\n2.1 Brand name\n2.2 Size\n2.3 Capacity\n2.4 Kind of application\n3. Company standard\nprocedures\n3.1 Job order\n3.2 Requisition slip\n3.3 Borrower slip\n\n--- PDF PAGE 20 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Listed materials and tools according to quantity and job\n requirements\n1.2 Requested materials and tools according to the list\n prepared and as per company SOP\n1.3 Inspected issued materials and tools as per quantity and\njob specifications\n1.4 Tools provided with appropriate safety devices\n2. Underpinning\nknowledge\n\n2.1 Types and uses of construction materials and tools\n2.2 Different forms\n2.3 Requisition procedures\n3. Underpinning skills\n\n3.1 Preparing materials and tools\n3.2 Proper handling of tools and equipment\n3.3 Following instructions\n4. Resource implications\n\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Materials relevant to the unit of competency\n4.3 Technical plans, drawings and specifications relevant to\nthe activities\n5. Methods of assessment\n\nCompetency in this unit must be assessed through:\n5.1 Direct observation and oral questioning\n6. Context of assessment\n\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace\n6.2 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 21 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT OF COMPETENCY:\nOBSERVE PROCEDURES, SPECIFICATIONS AND\nMANUALS OF INSTRUCTIONS\nUNIT CODE :\nCON311201\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nidentifying, interpreting, applying services to specifications and\nmanuals and storing manuals.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Identify and access\nspecification/manuals\n\n1.1 Appropriate manuals are identified and accessed as per\n job requirements\n1.2 Version and date of manual are checked to ensure that\n correct specification and procedures are identified\n2. Interpret manuals\n2.1 Relevant sections, chapters of specifications/ manuals are\nlocated in relation to the work to be conducted\n2.2 Information and procedure in the manual are interpreted in\naccordance with industry practices\n3. Apply information in\n manual\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer's specification\n3.3 Manual data are applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n4. Store manuals\n4.1 Manual or specification is stored appropriately to prevent\ndamage, ready access and updating of information when\nrequired in accordance with company requirements\n\n--- PDF PAGE 22 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Procedures,\nSpecifications and\nManuals of Instructions\n\nKinds of Manuals:\n1.1 Manufacturer's Specification Manual\n1.2 Repair Manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 23 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Identified and accessed specification/manuals as per job\n requirements\n1.2 Interpreted manuals in accordance with industry practices\n1.3 Applied information in manuals according to the given task\n1.4 Stored manuals in accordance with company requirements\n2. Underpinning\nknowledge\n\n2.1 Types of manuals used in construction sector\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n3. Underpinning skills\n3.1 Reading and comprehension skills required to identify and\n interpret construction manuals and specifications\n3.2 Accessing information and data\n4. Resource implications\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to construction\n sector\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Questions/interview\n\nAssessment of underpinning knowledge and practical skills\nmay be combined\n6. Context of assessment\n6.1 Competency assessment must be undertaken in\n accordance with the endorsed TESDA assessment\nguidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment\n\n--- PDF PAGE 24 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT OF COMPETENCY:\nPERFORM MENSURATIONS AND CALCULATIONS\nUNIT CODE :\nCON311203\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nidentifying and measuring objects based on the required\nperformance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variable\n1. Select measuring\ninstruments\n\n1.1 Object or component to be measured is identified,\n classified and interpreted according to the appropriate\nregular geometric shape\n1.2 Measuring tools are selected/identified as per object to be\nmeasured or job requirements\n1.3 Correct specifications are obtained from relevant sources\n1.4 Appropriate measuring instruments are selected according\nto job requirements\n1.5 Alternative measuring tools are used without sacrificing\n cost and quality of work\n2. Carry out\nmeasurements and\ncalculations\n\n2.1 Accurate measurements are obtained according to job\nrequirements\n2.2 Alternative measuring tools are used without sacrificing\n cost and quality of work\n2.3 Calculation needed to complete work tasks are performed\nusing the four basic process of addition (+), subtraction (-),\nmultiplication (x) and division (/) including but not limited to:\ntrigonometric functions, algebraic computations\nCalculations involving fractions, percentages and mixed\nnumbers are used to complete workplace tasks\n2.4 Numerical computation is self-checked and corrected for\naccuracy\n2.5 Instruments are read to the limit of accuracy of the tool\n2.6 Systems of measurement identified and converted\naccording to job requirements/ISO\n2.7 Workpieces are measured according to job requirements\n\n--- PDF PAGE 25 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Geometric shape\n\nIncluding but is not limited to:\n1.1 Round\n1.2 Square\n1.3 Rectangular\n1.4 Triangle\n1.5 Sphere\n1.6 Conical\n2. Measuring instruments\nIncluding but not limited to:\n2.1 Micrometer (In-out, depth)\n2.2 Vernier caliper (out, inside)\n2.3 Dial gauge with mag, std.\n2.4 Straight edge\n2.5 Thickness gauge\n2.6 Torque gauge\n2.7 Small hole gauge\n2.8 Telescopic gauge\n2.9 Try-square\n2.10 Protractor\n2.11 Combination gauge\n2.12 Steel rule\n2.13 Voltmeter\n2.14 Ammeter\n2.15 Mega-ohmeter\n2.16 Kilowatt hour meter\n2.17 Gauges\n2.18 Thermometers\n3. Measurements and\ncalculations\n\n3.1 Linear\n3.2 Volume\n3.3 Area\n3.4 Wattage\n3.5 Voltage\n3.6 Resistance\n3.7 Amperage\n3.8 Frequency\n3.9 Impedance\n\n--- PDF PAGE 26 ---\nTR HEAVY EQUIPMENT OPERATION\n\nVARIABLE\nRANGE\n\n3.10 Conductance\n3.11 Capacitance\n3.12 Displacement\n3.13 Inside diameter\n3.14 Circumference\n3.15 Length\n3.16 Thickness\n3.17 Outside diameter\n3.18 Taper\n3.19 Out of roundness\n3.20 Oil clearance\n3.21 End play/Thrust clearance\n\n--- PDF PAGE 27 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Selected and prepared appropriate measuring instruments\nin accordance with job requirements\n1.2 Performed measurements and calculations according to\njob requirements/ ISO\n2. Underpinning\nknowledge\n\nTRADE MATHEMATICS / MENSURATION\n2.1 Four fundamental operation\n2.2 Linear measurement\n2.3 Dimensions\n2.4 Unit conversion\n2.5 Ratio and proportion\n2.6 Trigonometric functions\n2.7 Algebraic equations\n3. Underpinning skills\n3.1 Performing calculation by addition, subtraction,\n multiplication and division; trigonometric functions and\n algebraic equations\n3.2 Visualizing objects and shapes\n3.3 Interpreting formulas for volume, areas, perimeters of plane\n and geometric figures\n3.4 Proper handling of measuring instruments\n4. Resource implications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Problems to solve\n4.3 Measuring instrument appropriate to carry out tasks\n4.4 Instructional materials relevant to the propose activity\n\nAssessment of underpinning knowledge and practical skills\nmay be combined\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Actual demonstration\n5.2 Direct observation\n5.3 Written test/questioning related to underpinning knowledge\n6. Context of assessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n6.3 Competency assessment must be undertaken in\naccordance with the TESDA assessment guidelines\n\n--- PDF PAGE 28 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT OF COMPETENCY:\nMAINTAIN TOOLS AND EQUIPMENT\nUNIT CODE :\nCON311204\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nchecking condition, performing preventive maintenance and\nstoring of tools and equipment based on the required\nperformance standards.\n\nELEMENTS\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Check condition of\ntools and equipment\n\n1.1 Materials, tools and equipment are identified according\nto classification and job requirements\n1.2 Non-functional tools and equipment are segregated and\n labeled according to classification\n1.3 Safety of tools and equipment are observed in accordance\nwith manufacturer's instructions\n1.4 Condition of PPE are checked in accordance with\nmanufacturer's instructions\n2. Perform basic\npreventive\nmaintenance\n2.1 Appropriate lubricants are identified according to types of\n equipment\n2.2 Tools and equipment are lubricated according to\npreventive maintenance schedule or manufacturer's\nspecifications\n2.3 Measuring instruments are checked and calibrated in\n accordance with manufacturer’s instructions\n2.4 Tools are cleaned and lubricated according to standard\nprocedures\n2.5 Defective instruments, equipment and accessories are\n inspected and replaced according to manufacturer’s\n specifications\n2.6 Tools are inspected, repaired and replaced after use\n2.7 Work place is cleaned and kept in safe state in line with\nOHSA regulations\n3. Store tools and\nequipment\n\n3.1 Inventory of tools, instruments and equipment are\nconducted and recorded as per company practices\n3.2 Tools and equipment are stored safely in appropriate\n locations in accordance with manufacturer's specifications\n or company procedures\n\n--- PDF PAGE 29 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials\nIncluding but not limited to:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n2. Tools and equipment\n\nIncluding but not limited to:\n2.1 Tools\n Cutting tools - hacksaw, crosscut saw, rip\n saw\n Boring tools - auger, brace, grinlet, hand drill\n Holding tools - vise grip, C-clamp, bench vise\n Threading tools - die and stock, taps\n\n2.2 Measuring instruments/equipment\n3. PPE\nIncluding but not limited to:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Aprons/Coveralls\n4. Forms\nMaintenance schedule forms\n4.1 Requisition slip\n4.2 Inventory Form\n4.3 Inspection Form\n4.4 Procedures\n\n--- PDF PAGE 30 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.2 Identified functional and non-functional tools and\nequipment\n1.3 Checked, lubricated and calibrated tools, equipment and\ninstruments according to manufacturer’s specifications\n1.4 Replaced defective tools, equipment and their accessories\n1.5 Observed and applied safe handling of tools and\nequipment and safety work practices\n1.6 Prepared and submitted inventory report, where applicable\n1.7 Maintained workplace in accordance with OHSA\n regulations\n1.8 Stored tools and equipment safely in appropriate locations\n and in accordance with company practices\n2. Underpinning\nknowledge\n\n2.1 SAFETY PRACTICES\n 2.1.1 Use of PPE\n 2.1.2 Handling of tools and equipment\n 2.1.3 Good housekeeping\n2.2 MATERIALS, TOOLS AND EQUIPMENT\n 2.2.1 Types and uses of lubricants\n 2.2.2 Types and uses of cleaning materials\n 2.2.3 Types and uses of measuring instruments and\n equipment\n2.3 PREVENTIVE MAINTENANCE\n 2.3.1 Methods and techniques\n 2.3.2 Procedures\n3. Underpinning skills\n3.1 Preparing maintenance materials, tools and equipment\n3.2 Proper handling of tools and equipment\n3.3 Performing preventive maintenance\n3.4 Following instructions\n4. Resource implications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Maintenance schedule\n4.3 Maintenance materials, tools and equipment relevant to\n the proposed activity/task\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Written test/questioning relevant to underpinning\n knowledge\n\n--- PDF PAGE 31 ---\nTR HEAVY EQUIPMENT OPERATION\n\n6. Context of assessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 32 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY:\nPERFORM PRE- AND POST-OPERATION CHECKING\nPROCEDURES FOR SCREED\nUNIT CODE:\nCON833326\nUNIT DESCRIPTOR:\nThis unit deals with the knowledge, skills and attitude in\nperforming pre- and post-operation checking procedures for\nscreed attachment.\n\nELEMENTS\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Perform visual check\n\n1.1 Work instruction is secured from appropriate personnel\nbased on company standard operating procedures\n1.2 PPE is selected and used in line with job requirements\n1.3 Walk around check is performed with engine stopped /\nnot running.\n1.4 Deformities in screed are reported to operator\n2. Perform operation\nchecks\n\n2.1 Communication with operator is established and\nmaintained\n2.2 Normal function of controls and screed are checked\n2.3 Walk-around check is re-conducted while engine is\nrunning.\n2.4 Abnormal conditions are noted in checklist and reported\nto operator\n3. Perform post-operation\nchecking procedure\n\n3.1 Walk around inspection check is re-conducted while doing\n engine is cooling down\n3.2 Daily equipment time report (DETR) is accomplished /\n submitted according to company rules and regulations.\n\n--- PDF PAGE 33 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Walk-around check\n\n1.1 Hopper\n1.2 Auger\n1.3 Chain and sprocket\n1.4 Tamper\n2. Deformities\n2.1 Misaligned hopper\n2.2 Loose chain and bolts\n2.3 Cracked and misaligned sprocket and chain\n3. Abnormal conditions\n\n3.1 Stuck-up hopper (mechanical)\n3.2 Stuck-up auger\n3.3 Loose drive chain tension\n\n--- PDF PAGE 34 ---\nTR HEAVY EQUIPMENT OPERATION\n\n EVIDENCE GUIDE\n1. Critical aspects of\nevidence to be\nconsidered\n\nAssessment must confirm evidence that the candidate:\n1.1 Demonstrates ability to select PPE in line with job\n requirements\n1.2 Demonstrates ability to perform walk-around inspection\nfollowing equipment checklist and with engine stopped/not\nrunning\n1.3 Demonstrates ability to perform walk-around check while\nengine is running.\n1.4 Demonstrates ability to perform post-operation checking\nprocedure.\n1.5 Demonstrates ability to accomplish and submit daily\nequipment time report/record (DETR)\n2. Underpinning (related)\nknowledge and attitude\n\n2.1 Types and uses of personal protective equipment (PPE)\n2.2 Attachments and controls and their usage\n2.3 Familiarity with manufacturer’s operation manual\n2.4 Familiarity with pre- and post-operation checklist and\n checking procedure\n2.5 Positive work values (time and cost conscious, etc.)\n\n3. Underpinning skills\n\n3.1 Performing pre- and post-operation checking procedures of\n equipment using standard attachment\n3.2 Using personal protective equipment\n3.3 Maintaining equipment records\n3.4 Communicating with work operator\n3.5 Complying with the manufacturer’s operation manual\n3.6 Accomplishing pre- and post-operation checklist\n4. Resource implications\n\nThe following resources must be provided:\n4.1 Appropriate work area for paver\n4.2 Access to paver equipment and manuals\n4.3 PPE\n5. Method of assessment\n\nCompetency in this unit must be assessed through\n5.1 Written/oral questioning\n5.2 Observation of practical demonstration\n5.3 Third party report\n5.4 Work record and documents\n6. Context for assessment\n\n6.1 Competency shall be assessed in a normal workplace\nenvironment and in accordance with safe work procedures\n6.2 Competency shall be assessed while work is being\nundertaken independently\n\n--- PDF PAGE 35 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT OF COMPETENCY:\nOPERATE AND MAINTAIN SCREED\nUNIT CODE:\nCON833327\nUNIT DESCRIPTOR:\nThis unit deals with the knowledge, skills and attitudes in\nmonitoring asphalt overlaid by paver.\n\nELEMENTS\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n1. Monitor and support\nasphalt overlaying\n\n1.1 PPE is selected and used in line with job requirements\n1.2 Communication signal with the operator is established\nand maintained based on standard operating procedures\n1.3 Asphalt overlaid is compared against job specifications\n1.4 Variance in asphalt overlaying is noted and communicated\nwith paver operator\n1.5 Screed controls are manually adjusted based on variances,\nwhen required\n2. Clean screed\n2.1 Information to park the equipment is communicated with\nthe operator\n2.2 Cleaning procedure is performed following manufacturer’s\noperation and maintenance manual\n\n--- PDF PAGE 36 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Communication signal\n1.1 Verbal\n1.2 Hand\n2. Job specifications\n2.1 Dimension\n 2.1.1 Thickness\n 2.1.2 Width\n 2.1.3 Length\n3. Variance\n3.1 Time duration of asphalt spreading\n3.2 Uniformity of asphalt\n3.3 Tamping of asphalt\n4. Cleaning procedure\n4.1 Removal of asphalt residue for:\n 4.1.1 Conveyor belt\n 4.1.2 Auger\n 4.1.3 Tamper\n\n--- PDF PAGE 37 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment must confirm evidence that the candidate:\n1.1 Demonstrates ability to follow safe work procedures\n/practices\n1.2 Demonstrates ability to communicate with the operator\n1.3 Demonstrates ability to follow job specifications\n1.4 Demonstrates ability to manipulate emergency controls and\nmovement of attachment\n1.4 Demonstrates ability to perform cleaning procedures\n2. Underpinning\nknowledge, attitudes\n\n2.1 Safe work procedures and practices\n2.2 Emergency controls and attachment and their usage\n2.3 Cleaning procedures\n2.4 Dimensions of asphalt overlay coverage\n2.5 Positive work values\n\n3. Underpinning skills\n3.1 Following safe work procedures and practices\n3.2 Using emergency controls and attachment\n3.3 Performing cleaning procedures\n3.4 Following dimensions of asphalt overlay instructions\n3.5 Following company rules and regulations relevant to paver\n operation\n3.6 Communicating with the operator\n4. Resource implications\nThe following resources must be provided:\n4.1 Access to paver and work site/terrain\n4.2 Attachment operation and maintenance manual\n4.3 Asphalt mix\n4.4 PPE\n5. Method of assessment\nCompetency in this unit must be assessed through:\n5.1 Oral/written questioning\n5.2 Observation of practical demonstration\n5.3 Third Party report\n5.4 Work record and documents\n6. Context for assessment\n6.1 Assessment may be conducted in the work site in\naccordance with safe work practices.\n6.2 Competency shall be assessed while work is being\n undertaken\n\n--- PDF PAGE 38 ---\nTR HEAVY EQUIPMENT OPERATION"
