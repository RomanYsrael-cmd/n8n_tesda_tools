        "source_text": "--- PDF PAGE 35 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \nUNIT OF COMPETENCY:\nOPERATE AND MAINTAIN SCREED \nUNIT CODE:\nCON833327\nUNIT DESCRIPTOR: \nThis unit deals with the knowledge, skills and attitudes in \nmonitoring asphalt overlaid by paver.\n \n \nELEMENTS \nPERFORMANCE CRITERIA \nBold and italicized terms are elaborated in the  \nRange of Variables \n1. Monitor and support \nasphalt overlaying  \n \n \n \n \n1.1 PPE is selected and used in line with job requirements \n1.2 Communication signal with the operator is established \nand maintained based on standard operating procedures \n1.3 Asphalt overlaid is compared against job specifications  \n1.4 Variance in asphalt overlaying is noted and communicated \nwith paver operator \n1.5 Screed controls are manually adjusted based on variances, \nwhen required \n2. Clean screed  \n2.1 Information to park the equipment is communicated with \nthe operator \n2.2 Cleaning procedure is performed following manufacturer’s \noperation and maintenance manual\n\n--- PDF PAGE 36 ---\nTR HEAVY EQUIPMENT OPERATION  \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Communication signal  \n1.1 Verbal  \n1.2 Hand  \n2. Job specifications  \n2.1 Dimension  \n        2.1.1 Thickness  \n        2.1.2 Width  \n        2.1.3 Length \n3. Variance  \n3.1 Time duration of asphalt spreading \n3.2 Uniformity of asphalt  \n3.3 Tamping of asphalt  \n4. Cleaning procedure  \n4.1 Removal of asphalt residue for:   \n         4.1.1 Conveyor belt \n         4.1.2 Auger \n         4.1.3 Tamper\n\n--- PDF PAGE 37 ---\nTR HEAVY EQUIPMENT OPERATION  \n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment must confirm evidence that the candidate:  \n1.1 Demonstrates ability to follow safe work procedures \n/practices  \n1.2 Demonstrates ability to communicate with the operator  \n1.3 Demonstrates ability to follow job specifications \n1.4 Demonstrates ability to manipulate emergency controls and \nmovement of attachment \n1.4 Demonstrates ability to perform cleaning procedures \n2. Underpinning \nknowledge, attitudes  \n \n2.1 Safe work procedures and practices  \n2.2 Emergency controls and attachment and their usage  \n2.3 Cleaning procedures  \n2.4 Dimensions of asphalt overlay coverage \n2.5 Positive work values  \n  \n3. Underpinning skills \n3.1 Following safe work procedures and practices  \n3.2 Using emergency controls and attachment  \n3.3 Performing cleaning procedures  \n3.4 Following dimensions of asphalt overlay instructions  \n3.5 Following company rules and regulations relevant to paver \n      operation \n3.6 Communicating with the operator \n4.  Resource implications \nThe following resources must be provided: \n4.1 Access to paver and work site/terrain \n4.2 Attachment operation and maintenance manual \n4.3 Asphalt mix \n4.4 PPE  \n5.  Method of assessment \nCompetency in this unit must be assessed through: \n5.1 Oral/written questioning \n5.2 Observation of practical demonstration \n5.3 Third Party report \n5.4  Work record and documents \n6.  Context for assessment \n6.1 Assessment may be conducted in the work site in \naccordance with safe work practices. \n6.2 Competency shall be assessed while work is being  \n       undertaken\n",
