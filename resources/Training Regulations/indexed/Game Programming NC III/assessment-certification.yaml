  "source_text": "SECTION 4: NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Game Programming NC III, the candidate\nmust demonstrate competence as described in sub-section 4.2.1 of this Training\nRegulations. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director-General.\n\n4.2\nThe qualification of Game Programming NC III may be attained through\ndemonstration of competence through a single comprehensive project-type\nassessment covering all required units of competency of the qualification:\n\n4.2.1 APPLYING GAME PROGRAMMING SKILLS\n• Design game program logic\n• Apply object-oriented programming language skills\n• Apply programming skills for in-game application\n\n4.3\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1. Graduate of formal, non-formal, and informal, including enterprise-based,\ntraining programs.\n\n4.4.2. Experienced workers (wage employed or self employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 57 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 55\nANNEX A. ICT COMPETENCY MAP\n\nGAME PROGRAMMING NC III\n\nBASIC COMPETENCIES\n\nReceive And Respond\nTo Workplace\nCommunication\nWork With Others\nDemonstrate Work\nValues\nPractice Basic\nHousekeeping\nProcedures\nParticipate In\nWorkplace\nCommunication\nWork In A Team\nEnvironment\nPractice Career\nProfessionalism\nPractice\nOccupational Health\nAnd Safety\nProcedures\nLead Workplace\nCommunication\nLead Small Team\nDevelop And Practice\nNegotiation Skills\nSolve Problems\nRelated To Work\nActivities\nUse Mathematical\nConcepts And\nTechniques\nUse Relevant\nTechnologies\nUtilize Specialist\nCommunication Skills\nDevelop Team And\nIndividuals\nApply Problem\nSolving Techniques\nIn The Workplace\nCollect, Analyze And\nOrganize Information\nPlan And Organize\nWork\nPromote\nEnvironmental\nProtection\n\nCOMMON COMPETENCIES\n\nApply Critical Thinking\nAnd Proper Thought\nOrganization\nApply Quality\nStandards\nPerform\nComputer\nOperations\n\nCORE COMPETENCIES\n\nCommunicate\nEffectively In A\nCustomer Contact\nCenter\nRender Quality\nCustomer Service\nUtilize Enterprise/\nCompany\nTechnology\nConduct Contact\nCenter Campaign\nProvide Specialized\nSupport And Assistance\nTo Customers\nLead A Contact\nCenter Work Team\nManage The\nActivities Of A\nContact Center Work\nTeam\nUse Business\nTechnology\nUse Medical\nTechnology To Carry\nOut Task\nProduce Text From\nAudio Transcription\nReview/Edit\nDocuments\nProduce Key\nDrawings For\nAnimation\nProduce Cleaned-Up\nAnd In-Betweened\nDrawings\nCreate 2d Digital\nAnimation\nUse An Authoring\nTool To Create An\nInteractive Sequence\nUse 2d Digital\nAnimation Software\nBuild Library Of\nObjects\nBuild Scenes And\nAssets\nProduce 2d Digital\nAnimation Movies &\nAnimated Movie Clips\nCreate 3d Digital\nAnimation\nCoordinate The\nProduction Of\nAnimation\nProduce Storyboard\nFor Animation\nProduce Background\nDesigns\nComposite And Edit\nAnimation Sequence\nProduce Over-All\nDesigns For\nAnimation\nDesign Game\nProgram Logic\nApply Object-\nOriented Program\nLanguage Skills\nApply Programming\nSkills For In-Game\nApplication\nManage The\nActivities Of A Work\nTeam\nLead A Team In\nDelivering Quality\nService\nDesign Program\nLogic\nApply Program\nDevelopment\nApproach\nApply Programming\nSkills In A Second\nLanguage\n\n--- PDF PAGE 58 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 56\nDEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a person\nthrough assessment\n\n2) Certificate of Competency (COC) - is a certification issued to individuals who pass the\nassessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people working in\na particular industry\n\n4) Competency - is the possession and application of knowledge, skills and attitudes to\nperform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making judgments\non whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of competencies\nrequired for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be conducted or\ncarried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a particular area\nof work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for successful\nperformance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person perform in the workplace\n\n12) Evidence Guide - is a component of the unit of competency that defines or identifies the\nevidences required to determine the competence of the individual. It provides information\non critical aspects of competency, required knowledge, required skills, resource\nimplications, assessment method and context of assessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when evidence\nshould be collected\n\n15) National Certificate (NC) - is a certification issued to individuals who achieve all the\nrequired units of competency for a national qualification defined under the Training\nRegulations. NCs are aligned to specific levels within the PTQF\n\n16) Performance Criteria - are evaluative statements that specify what is to be assessed\nand the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is significant\nin the workplace. It is also a certification awarded to a person on successful completion\nof a course in recognition of having demonstrated competencies in an industry sector\n\n--- PDF PAGE 59 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 57\n\n18) Range of Variables - describes the circumstances or context in which the work is to be\nperformed\n\n19) Recognition of Prior Learning (RPL) - is the acknowledgement of an individual’s skills,\nknowledge and attitudes gained from life and work experiences outside registered\ntraining programs\n\n20) Resource Implications - refers to the resources needed for the successful performance\nof the work activity described in the unit of competency. It includes work environment\nand conditions, materials, tools and equipment\n\n21) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n22) Training Regulations (TR) - refers to the document promulgated and issued by TESDA\nconsisting of competency standards, national qualifications and training guidelines for\nspecific sectors/occupations. The TR serves as basis for establishment of qualification\nand certification under the PTQF. It also serves as guide for development of\ncompetency-based curricula and instructional materials including registration of TVET\nprograms offered by TVET providers\n\n23) Required Knowledge - refers to the competency that involves in applying knowledge to\nperform work activities. It includes specific knowledge that is essential to the\nperformance of the competency\n\n24) Required Skills - refers to the list of the skills needed to achieve the elements and\nperformance criteria in the unit of competency. It includes generic and industry specific\nskills\n\n25) Unit of Competency - is a component of the competency standards stating a specific\nkey function or role in a particular job or occupation; it is the smallest component of\nachievement that can be assessed and certified under the PTQF\n\nSECTOR SPECIFIC\n\n1. Algorithm - is a type of effective method in which a list of well-defined instructions for\ncompleting a task will, when given an initial state, proceed through a well-defined series\nof successive states, eventually terminating in an end-state. The transition from one state\nto the next is not necessarily deterministic; some algorithms, known as probabilistic\nalgorithms, incorporate randomness.\n2. Artificial intelligence programmer - develops the logic the game uses to carry out a\nlarge number of actions. An AI programmer may program pathfinding, strategy and\nenemy tactic systems. This is one of the most challenging aspects of game programming\nand its sophistication is developing rapidly.\n3. Browser - a software package that provides the user interface for accessing Internet,\nintranet and extranet Web sites.\n4. Compiler - is a computer program (or set of programs) that translates text written in a\ncomputer language (the source language) into another computer language (the target\nlanguage). The original sequence is usually called the source code and the output called\nobject code. Commonly the output has a form suitable for processing by other programs\n(e.g., a linker), but it may be a human-readable text file.\n\n--- PDF PAGE 60 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 58\n5. Computer - a device that has the ability to accept data; internally store and execute a\nprogram of instructions; perform mathematical, logical, and manipulative operations on\ndata; and report the results.\n6. Computer Terminal - any input/output device connected by telecommunications links to\na computer.\n7. Data - objective measurements of the attributes (characteristics) of entities such as\npeople, places, things, and events.\n8. Documentation - a collection of documents or information.\n9. Eclipse - is an integrated development environment (IDE) written primarily in Java. The\ninitial codebase originated from Visual Age. In its default form it is meant for Java\ndevelopers, consisting of the Java Development Tools (JDT). Users can extend its\ncapabilities by installing plug-ins written for the Eclipse software framework, such as\ndevelopment toolkits for other programming languages, and can write and contribute their\nown plug-in modules.\n10. Edit - to modify the form or format of data\n11. Encryption - to scramble data or convert it, prior to transmission, to a secret code that\nmasks the meaning of he data to unauthorized recipients.\n12. End user - anyone who uses an information system or the information it produces.\n13. Ergonomics - the science and technology emphasizing the safety, comfort, and ease of\nuse of human-operated machines. The goal of ergonomics is to produce systems that\nare user-friendly: safe, comfortable and easy to use.\n14. Flash - can manipulate vector and raster graphics and supports bi-directional streaming\nof audio and video. It contains a scripting language called ActionScript. It is available in\nmost common web browsers and some mobile phones and other electronic devices\n(using Flash Lite). Several software products, systems, and devices are able to create or\ndisplay Flash, including the Adobe Flash Player. The Adobe Flash Professional\nmultimedia authoring program is used to create content for the Adobe Engagement\nPlatform, such as web applications, games and movies, and content for mobile phones\nand other embedded devices.\n15. Game programming - a subset of game development, is the programming of computer,\nconsole or arcade games. Though often engaged in by professional game programmers,\nmany novices may program games as a hobby.\n16. Game loop - the key component of any game, from a programming standpoint. The\ngame loop allows the game to run smoothly regardless of a user's input or lack thereof.\n17. Game programmer - is a programmer who primarily develops video games or related\nsoftware (such as game development tools). Game programming has many specialized\ndisciplines; practitioners of any may regard themselves as \"game programmers\". A game\nprogrammer should not be confused with a game designer; many designers are also\nprogrammers, but not all are, and it is rare for one person to serve both roles in modern\nprofessional games\n18. Graphics programmer - historically, this title usually belonged to a programmer who\ndeveloped specialized blitter algorithms and clever optimizations for 2D graphics. Today,\nhowever, it is almost exclusively applied to programmers who specialize in developing\nand modifying complex 3D graphic renderers. Some 2D graphics skills have just recently\nbecome useful again, though, for developing games for the new generation of cell\nphones, PDAs and handheld game consoles. A 3D graphics programmer must have a\nfirm grasp on advanced mathematical concepts such as vector and matrix math,\nquaternions and linear algebra.\n\n--- PDF PAGE 61 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 59\n19. Game physics programmer - is dedicated to developing the physics a game will\nemploy. Typically, a game will only simulate a few aspects of real-world physics. For\nexample, a space game may need simulated gravity, but would not have any need for\nsimulating water viscosity.\n20. Gameplay programmer - Though all programmers add to the content and experience\nthat a game provides, a gameplay programmer focuses more on a game's strategy and\nthe \"feel\" of a game. This is usually not a separate discipline, as what this programmer\ndoes usually differs from game to game, and they will inevitably be involved with more\nspecialized areas of the game's development such as graphics or sound.\n21. Information - data placed in a meaningful and useful context for an end user.\n22. Information and Communication Technology (ICT) - refers to technologies associated\nwith the transmission and exchange of data in the form of sound, text, visual images,\nsignals or any combination of those forms through the use of digital technology. It\nencompasses such services as telecommunications, posts, multimedia, electronic\ncommerce, broadcasting, and information technology.\n23. Integrated development environment (IDE) - is a software application that provides\ncomprehensive facilities to computer programmers for software development. An IDE\nnormally consists of a source code editor, a compiler and/or interpreter, build automation\ntools, and (usually) a debugger. Typically an IDE is dedicated to a specific programming\nlanguage, so as to provide a feature set which most closely matches the programming\nparadigms of the language. However, some multiple-language IDEs are in use, such as\nEclipse, ActiveState Komodo, recent versions of NetBeans, and Microsoft Visual Studio.\n24. Key frame - is a single still image in an animated sequence that occurs at an important\npoint in that sequence; key frames are defined throughout an animated sequence, in\norder to define pivotal points of motion before the frames in between are drawn or\notherwise created to \"tween\" the motion between the two key frames.\n25. Local Area Network (LAN) - a communications network that typically connects\ncomputers, terminals, and other computerized devices within a limited physical area such\nas an office, building, manufacturing plant and other work sites.\n26. Microsoft DirectX - is a collection of application programming interfaces (APIs) for\nhandling tasks related to multimedia, especially game programming and video, on\nMicrosoft platforms.\n27. Object code - or an object file, is the representation of code that a compiler or assembler\ngenerates by processing a source code file. Object files contain compact code, often\ncalled \"binaries\". A linker is typically used to generate an executable or library by linking\nobject files together. The only essential element in an object file is machine code (code\ndirectly executed by a computer's CPU). Object files for embedded systems might contain\nnothing but machine code. However, object files often also contain data for use by the\ncode at runtime, relocation information, program symbols (names of variables and\nfunctions) for linking and/or debugging purposes, and other debugging information.\n28. Outsourcing - turning over all or part of an organization’s information systems operation\nto outside contractors, known as systems integrators or facilities management\ncompanies.\n29. Quality Assurance - methods for ensuring that information systems are free from errors\nand fraud and provide information products of high quality.\n30. Production. During production, programmers churn out a great deal of source code to\ncreate the game described in the game's design document. Along the way, the design\ndocument is modified to meet limitations or expanded to exploit new features. The design\ndocument is very much a \"living document\" much of whose life is dictated by\nprogrammer's schedules, talent and resourcefulness.\n\n--- PDF PAGE 62 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 60\n31. Prototyping - Writing prototypes of gameplay ideas and features is an important activity\nthat allows programmers and game designers to experiment with different algorithms and\nusability scenarios for a game. A great deal of prototyping may take place during pre-\nproduction before the design document is complete and may, in fact, help determine what\nfeatures the design specifies. Prototyping may also take place during active development\nto test new ideas as the game emerges.\n32. Simulation - the process of imitating a real phenomenon with a set of mathematical\nformulas. Advanced computer programs can simulate weather conditions, chemical\nreactions, atomic reactions, even biological processes.\n33. Software - computer programs and procedures concerned with the operation of an\ninformation system.\n34. Sound programmer - Not always a separate discipline, sound programming has been a\nmainstay of game programming since the days of Pong. Most games make use of audio,\nand many have a full musical score. Computer audio games eschew graphics altogether\nand use sound as their primary feedback mechanism.\n35. Source code - is the collection of files needed to convert from human-readable form to\nsome kind of computer-executable form. The source code may be converted into an\nexecutable file by a compiler, or executed on the fly from the human readable form with\nthe aid of an interpreter.\n36. Standards - measures of performance developed to evaluate the progress of a system\ntoward its objectives\n37. System - an assembly of methods, procedures, or techniques unified by regulated\ninteraction to form an organized whole\n38. Vector - is a line or a movement defined by end-points or, essentially, the distance\nbetween point A and point B. Vectors can be used to calculate animated motion\nmathematically instead of through the use of manual key frames; vectors can also be\nused to define computer-animated shapes.\n39. Video game - is a game that involves interaction with a user interface to generate visual\nfeedback on a video device. The word video in video game traditionally referred to a\nraster display device. However, with the popular use of the term \"video game\", it now\nimplies any type of display device. The electronic systems used to play video games are\nknown as platforms; examples of these are personal computers and video game\nconsoles. These platforms are broad in range, from large computers to small handheld\ndevices. Specialized video games such as arcade games, while previously common,\nhave gradually declined in use.\n40. User- friendly - a characteristic of human-operated equipment and systems that makes\nthem safe, comfortable, and easy to use.\n\n--- PDF PAGE 63 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 61\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n• THE TECHNICAL EXPERTS PANEL (TEP)\n\nCHRISTOPHER ADAM RUIZ\nPRESIDENT / CREATIVE DIRECTOR\nXelzeta Xtudios\nIGDA Manila\n\nDR. NIÑA ANA MARIE JOCELYN A. SALES\nACADEMIC DEVELOPMENT SPECIALIST\nInformatics Holdings Philippines, Incorporated\nDEAN, COLLEGE OF BUSINESS & ENTREPRENEURSHIP\nInformatics International College - Eastwood Campus\nGDAP & IGDA Manila\n\nGENE GACHO\nSENIOR GAME PROGRAMMER\nStudio of Secret 6, Incorporated\nGDAP\n\nMARNIELLE LLOYD ESTRADA\nSENIOR GAME PROGRAMMER\nAnino Games\nIGDA Manila\n\nTITONY DAMIAN I. SARMIENTO\nSENIOR GAME PROGRAMMER\nFunGuy Studios\nGDAP\n\nFRANCIS JOSEPH V.-F. SERIÑA\nGAME DEVELOPMENT COURSE MANAGER\nUniversity of the Philippines - ITTC\nIGDA Manila\n\nERNEST RICHARD G. OCSON\nINSTRUCTOR - 2\nDe La Salle - College of St. Benilde\nGDAP\n\n With special recognition to:\n\nPAUL GADI\nCO-