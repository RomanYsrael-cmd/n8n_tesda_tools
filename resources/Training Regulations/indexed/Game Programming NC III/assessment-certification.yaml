      "text": "The qualification of Game Programming NC III may be attained through demonstration of competence through a single comprehensive project-type assessment covering all required units of competency of the qualification: 4.2.1 APPLYING GAME PROGRAMMING SKILLS • Design game program logic • Apply object-oriented programming language skills • Apply programming skills for in-game application"
    },
