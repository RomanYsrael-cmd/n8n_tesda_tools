  "source_text": "section 4.2.1 of this Training\nRegulations. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director-General.\n\n4.2\nThe qualification of Game Programming NC III may be attained through\ndemonstration of competence through a single comprehensive project-type\nassessment covering all required units of competency of the qualification:\n\n4.2.1 APPLYING GAME PROGRAMMING SKILLS\n• Design game program logic\n• Apply object-oriented programming language skills\n• Apply programming skills for in-game application\n\n4.3\nAssessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1. Graduate of formal, non-formal, and informal, including enterprise-based,\ntraining programs.\n\n4.4.2. Experienced workers (wage employed or self employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 57 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 55\n"
