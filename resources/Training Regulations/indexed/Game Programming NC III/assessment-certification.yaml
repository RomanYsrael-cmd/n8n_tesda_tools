      "text": "Recognition of Prior Learning (RPL) - is the acknowledgement of an individual’s skills, knowledge and attitudes gained from life and work experiences outside registered training programs"
    },
    {
      "number": "20",
      "text": "Resource Implications - refers to the resources needed for the successful performance of the work activity described in the unit of competency. It includes work environment and conditions, materials, tools and equipment"
    },
    {
      "number": "21",
      "text": "Basic Competencies - are the skills and knowledge that everyone needs for work"
    },
    {
      "number": "22",
      "text": "Training Regulations (TR) - refers to the document promulgated and issued by TESDA consisting of competency standards, national qualifications and training guidelines for specific sectors/occupations. The TR serves as basis for establishment of qualification and certification under the PTQF. It also serves as guide for development of competency-based curricula and instructional materials including registration of TVET programs offered by TVET providers"
    },
    {
      "number": "23",
      "text": "Required Knowledge - refers to the competency that involves in applying knowledge to perform work activities. It includes specific knowledge that is essential to the performance of the competency"
    },
    {
      "number": "24",
      "text": "Required Skills - refers to the list of the skills needed to achieve the elements and performance criteria in the unit of competency. It includes generic and industry specific skills"
    },
    {
      "number": "25",
      "text": "Unit of Competency - is a component of the competency standards stating a specific key function or role in a particular job or occupation; it is the smallest component of achievement that can be assessed and certified under the PTQF"
    },
    {
      "number": "1",
      "text": "Algorithm - is a type of effective method in which a list of well-defined instructions for completing a task will, when given an initial state, proceed through a well-defined series of successive states, eventually terminating in an end-state. The transition from one state to the next is not necessarily deterministic; some algorithms, known as probabilistic algorithms, incorporate randomness."
    },
    {
      "number": "2",
      "text": "Artificial intelligence programmer - develops the logic the game uses to carry out a large number of actions. An AI programmer may program pathfinding, strategy and enemy tactic systems. This is one of the most challenging aspects of game programming and its sophistication is developing rapidly."
    },
    {
      "number": "3",
      "text": "Browser - a software package that provides the user interface for accessing Internet, intranet and extranet Web sites."
    },
    {
      "number": "4",
      "text": "Compiler - is a computer program (or set of programs) that translates text written in a computer language (the source language) into another computer language (the target language). The original sequence is usually called the source code and the output called object code. Commonly the output has a form suitable for processing by other programs (e.g., a linker), but it may be a human-readable text file. --- PDF PAGE 60 --- _________________________________________________________________________________ Game Programming NC III Promulgated __________________2012 58"
    },
    {
      "number": "5",
      "text": "Computer - a device that has the ability to accept data; internally store and execute a program of instructions; perform mathematical, logical, and manipulative operations on data; and report the results."
    },
    {
      "number": "6",
      "text": "Computer Terminal - any input/output device connected by telecommunications links to a computer."
    },
    {
      "number": "7",
      "text": "Data - objective measurements of the attributes (characteristics) of entities such as people, places, things, and events."
    },
    {
      "number": "8",
      "text": "Documentation - a collection of documents or information."
    },
    {
      "number": "9",
      "text": "Eclipse - is an integrated development environment (IDE) written primarily in Java. The initial codebase originated from Visual Age. In its default form it is meant for Java developers, consisting of the Java Development Tools (JDT). Users can extend its capabilities by installing plug-ins written for the Eclipse software framework, such as development toolkits for other programming languages, and can write and contribute their own plug-in modules."
    },
    {
      "number": "10",
      "text": "Edit - to modify the form or format of data"
    },
    {
      "number": "11",
      "text": "Encryption - to scramble data or convert it, prior to transmission, to a secret code that masks the meaning of he data to unauthorized recipients."
    },
    {
      "number": "12",
      "text": "End user - anyone who uses an information system or the information it produces."
    },
    {
      "number": "13",
      "text": "Ergonomics - the science and technology emphasizing the safety, comfort, and ease of use of human-operated machines. The goal of ergonomics is to produce systems that are user-friendly: safe, comfortable and easy to use."
    },
    {
      "number": "14",
      "text": "Flash - can manipulate vector and raster graphics and supports bi-directional streaming of audio and video. It contains a scripting language called ActionScript. It is available in most common web browsers and some mobile phones and other electronic devices (using Flash Lite). Several software products, systems, and devices are able to create or display Flash, including the Adobe Flash Player. The Adobe Flash Professional multimedia authoring program is used to create content for the Adobe Engagement Platform, such as web applications, games and movies, and content for mobile phones and other embedded devices."
    },
    {
      "number": "15",
      "text": "Game programming - a subset of game development, is the programming of computer, console or arcade games. Though often engaged in by professional game programmers, many novices may program games as a hobby."
    },
    {
      "number": "16",
      "text": "Game loop - the key component of any game, from a programming standpoint. The game loop allows the game to run smoothly regardless of a user's input or lack thereof."
    },
    {
      "number": "17",
      "text": "Game programmer - is a programmer who primarily develops video games or related software (such as game development tools). Game programming has many specialized disciplines; practitioners of any may regard themselves as \"game programmers\". A game programmer should not be confused with a game designer; many designers are also programmers, but not all are, and it is rare for one person to serve both roles in modern professional games"
    },
    {
      "number": "18",
      "text": "Graphics programmer - historically, this title usually belonged to a programmer who developed specialized blitter algorithms and clever optimizations for 2D graphics. Today, however, it is almost exclusively applied to programmers who specialize in developing and modifying complex 3D graphic renderers. Some 2D graphics skills have just recently become useful again, though, for developing games for the new generation of cell phones, PDAs and handheld game consoles. A 3D graphics programmer must have a firm grasp on advanced mathematical concepts such as vector and matrix math, quaternions and linear algebra. --- PDF PAGE 61 --- _________________________________________________________________________________ Game Programming NC III Promulgated __________________2012 59"
    },
    {
      "number": "19",
      "text": "Game physics programmer - is dedicated to developing the physics a game will employ. Typically, a game will only simulate a few aspects of real-world physics. For example, a space game may need simulated gravity, but would not have any need for simulating water viscosity."
    },
    {
      "number": "20",
      "text": "Gameplay programmer - Though all programmers add to the content and experience that a game provides, a gameplay programmer focuses more on a game's strategy and the \"feel\" of a game. This is usually not a separate discipline, as what this programmer does usually differs from game to game, and they will inevitably be involved with more specialized areas of the game's development such as graphics or sound."
    },
    {
      "number": "21",
      "text": "Information - data placed in a meaningful and useful context for an end user."
    },
    {
      "number": "22",
      "text": "Information and Communication Technology (ICT) - refers to technologies associated with the transmission and exchange of data in the form of sound, text, visual images, signals or any combination of those forms through the use of digital technology. It encompasses such services as telecommunications, posts, multimedia, electronic commerce, broadcasting, and information technology."
    },
    {
      "number": "23",
      "text": "Integrated development environment (IDE) - is a software application that provides comprehensive facilities to computer programmers for software development. An IDE normally consists of a source code editor, a compiler and/or interpreter, build automation tools, and (usually) a debugger. Typically an IDE is dedicated to a specific programming language, so as to provide a feature set which most closely matches the programming paradigms of the language. However, some multiple-language IDEs are in use, such as Eclipse, ActiveState Komodo, recent versions of NetBeans, and Microsoft Visual Studio."
    },
    {
      "number": "24",
      "text": "Key frame - is a single still image in an animated sequence that occurs at an important point in that sequence; key frames are defined throughout an animated sequence, in order to define pivotal points of motion before the frames in between are drawn or otherwise created to \"tween\" the motion between the two key frames."
    },
    {
      "number": "25",
      "text": "Local Area Network (LAN) - a communications network that typically connects computers, terminals, and other computerized devices within a limited physical area such as an office, building, manufacturing plant and other work sites."
    },
    {
      "number": "26",
      "text": "Microsoft DirectX - is a collection of application programming interfaces (APIs) for handling tasks related to multimedia, especially game programming and video, on Microsoft platforms."
    },
    {
      "number": "27",
      "text": "Object code - or an object file, is the representation of code that a compiler or assembler generates by processing a source code file. Object files contain compact code, often called \"binaries\". A linker is typically used to generate an executable or library by linking object files together. The only essential element in an object file is machine code (code directly executed by a computer's CPU). Object files for embedded systems might contain nothing but machine code. However, object files often also contain data for use by the code at runtime, relocation information, program symbols (names of variables and functions) for linking and/or debugging purposes, and other debugging information."
    },
    {
      "number": "28",
      "text": "Outsourcing - turning over all or part of an organization’s information systems operation to outside contractors, known as systems integrators or facilities management companies."
    },
    {
      "number": "29",
      "text": "Quality Assurance - methods for ensuring that information systems are free from errors and fraud and provide information products of high quality."
    },
    {
      "number": "30",
      "text": "Production. During production, programmers churn out a great deal of source code to create the game described in the game's design document. Along the way, the design document is modified to meet limitations or expanded to exploit new features. The design document is very much a \"living document\" much of whose life is dictated by programmer's schedules, talent and resourcefulness. --- PDF PAGE 62 --- _________________________________________________________________________________ Game Programming NC III Promulgated __________________2012 60"
    },
    {
      "number": "31",
      "text": "Prototyping - Writing prototypes of gameplay ideas and features is an important activity that allows programmers and game designers to experiment with different algorithms and usability scenarios for a game. A great deal of prototyping may take place during pre- production before the design document is complete and may, in fact, help determine what features the design specifies. Prototyping may also take place during active development to test new ideas as the game emerges."
    },
    {
      "number": "32",
      "text": "Simulation - the process of imitating a real phenomenon with a set of mathematical formulas. Advanced computer programs can simulate weather conditions, chemical reactions, atomic reactions, even biological processes."
    },
    {
      "number": "33",
      "text": "Software - computer programs and procedures concerned with the operation of an information system."
    },
    {
      "number": "34",
      "text": "Sound programmer - Not always a separate discipline, sound programming has been a mainstay of game programming since the days of Pong. Most games make use of audio, and many have a full musical score. Computer audio games eschew graphics altogether and use sound as their primary feedback mechanism."
    },
    {
      "number": "35",
      "text": "Source code - is the collection of files needed to convert from human-readable form to some kind of computer-executable form. The source code may be converted into an executable file by a compiler, or executed on the fly from the human readable form with the aid of an interpreter."
    },
    {
      "number": "36",
      "text": "Standards - measures of performance developed to evaluate the progress of a system toward its objectives"
    },
    {
      "number": "37",
      "text": "System - an assembly of methods, procedures, or techniques unified by regulated interaction to form an organized whole"
    },
    {
      "number": "38",
      "text": "Vector - is a line or a movement defined by end-points or, essentially, the distance between point A and point B. Vectors can be used to calculate animated motion mathematically instead of through the use of manual key frames; vectors can also be used to define computer-animated shapes."
    },
    {
      "number": "39",
      "text": "Video game - is a game that involves interaction with a user interface to generate visual feedback on a video device. The word video in video game traditionally referred to a raster display device. However, with the popular use of the term \"video game\", it now implies any type of display device. The electronic systems used to play video games are known as platforms; examples of these are personal computers and video game consoles. These platforms are broad in range, from large computers to small handheld devices. Specialized video games such as arcade games, while previously common, have gradually declined in use."
    },
