      "text": "User- friendly - a characteristic of human-operated equipment and systems that makes them safe, comfortable, and easy to use. --- PDF PAGE 63 --- _________________________________________________________________________________ Game Programming NC III Promulgated __________________2012 61 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of these Training Regulations. • THE TECHNICAL EXPERTS PANEL (TEP) Xelzeta Xtudios IGDA Manila DR. NIÑA ANA MARIE JOCELYN A. SALES Informatics Holdings Philippines, Incorporated DEAN, COLLEGE OF BUSINESS & ENTREPRENEURSHIP Informatics International College - Eastwood Campus GDAP & IGDA Manila Studio of Secret 6, Incorporated Anino Games IGDA Manila TITONY DAMIAN I. SARMIENTO FunGuy Studios FRANCIS JOSEPH V.-F. SERIÑA University of the Philippines - ITTC IGDA Manila ERNEST RICHARD G. OCSON INSTRUCTOR - 2 De La Salle - College of St. Benilde With special recognition to: CO-FOUNDER & TECHNICAL DIRECTOR, Inkstone Inc. IGDA Manila BUSINESS DEVELOPMENT MANAGER, Boomzap Entertainment IGDA Manila DIRECTOR, Sungame, Inc. IGDA Manila --- PDF PAGE 64 --- _________________________________________________________________________________ Game Programming NC III Promulgated __________________2012 62 • THE PARTICIPANTS IN THE NATIONAL VALIDATION OF THESE TRAINING Komikasi CHRISTIAN JOSEPH T. YAP Informatics Philippines IRIS H. CUSTODIO Modelworks Philippines MARIA TERESA CRISELDA C. DUMLAO RICHARD B. LOCSIN The Studio of Secret6 Inc. • PROJECT TEAM LEADER ALVIN M. JUBAN Game Development Association of the Philippines, Inc. (GDAP) The Studio of Secret6, Incorporated • THE TESDA BOARD - STANDARDS-SETTING AND SYSTEMS • THE MANAGEMENT AND STAFF OF THE TESDA SECRETARIAT • Qualifications and Standards Office (QSO) o Competency Standards Division  Zoilo C. Galang, Supervising TESD Specialist  Samuel E. Calado, Jr., Senior TESD Specialist  Stephen I. Cezar, Senior TESD Specialist  Venzel Concoles, TESD Specialist II o Curriculum and Training Aids Division  Arsenio A. Mateo, Jr., TESD Specialist II • Competency Assessment and Certification Office  Nelie Llovido, Supervising TESD Specialist"
    }
