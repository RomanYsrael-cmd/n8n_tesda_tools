ons\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 50 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 48\nCOMMON COMPETENCIES\n70 hrs.\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply critical\nthinking and\nthought\norganization\n1.1 Identify the theoretical\nfoundations of critical\nthinking\n1.2 Develop constructive\narguments\n1.3 Apply methods of\nreasoning\n1.4 Affirm generalization\n1.5 Arrive at a conclusion\n Field trip\n Symposium\n Film showing\n Simulation\n Supervised\nindustry\ntraining\n Demonstration\n& questioning\n Observation &\nquestioning\n Third party\nreport\n2. Apply Quality\nStandards\n2.1 Asses quality of received\nmaterials\n2.2 Assess own work\n2.3 Engage in quality\nimprovement\n Field trip\n Symposium\n Film showing\n Simulation\n Supervised\nindustry\ntraining\n Demonstration\n& questioning\n Observation &\nquestioning\n Third party\nreport\n3. Perform\ncomputer\noperations\n3.1 Set-up workstation\n3.2 Prepare storage media\n3.3 Work with files and objects\n3.4 Manipulate word\nprocessing software\n3.5 Manipulate spreadsheet\nsoftware\n3.6 Manipulate customize and\ndatabase applications\n3.7 Utilize the internet\n3.8 Maintain computer\nhardware and software\n\n Modular\n Film showing\n Computer\nbased training\n(e-learning)\n Project\nmethod\n Supervised\nindustry\ntraining\n Demonstration\nand\nquestioning\n Observation\nand\nquestioning\n Third party\nreport\n Assessment of\noutput product\n Portfolio\n Computer\nbased\nassessment\n\n--- PDF PAGE 51 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 49\nCORE COMPETENCIES\n1,100 hrs.\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Design game\nprogram logic\n\n200 hrs\n1.1. Analyze game\nspecifications\n1.2. Analyze game physics\n1.3. Prepare technical\ngame documentation\n1.4. Validate the technical\ngame documentation\n• Lecture/\nDiscussion\n• Hands on\n• Exercises\n• Demonstration\n• Supervised\nindustry\ntraining\n• Demonstration\n/ Practical\nexam\n• Presentation\nwith\nquestioning\n• Portfolio of\nwork samples\n• Individual\ninterview\n2. Apply object-\noriented\nprogramming\nlanguage skills\n\n200 HRS\n\n2.1. Apply basic language\nsyntax and layout\n2.2. Apply basic OO\nprinciples in the target\nlanguage\n2.3. Debug code\nDocument activities\n2.4. Test code\n• Lecture/\nDiscussion\n• Hands on\n• Exercises\n• Demonstration\n• Supervised\nindustry\ntraining\n\n• Demonstration\n/ Practical\nexam\n• Presentation\nwith\nquestioning\n• Portfolio of\nwork samples\n• Individual\ninterview\n3. Apply\nprogramming\nskills for in-\ngame\napplication\n\n400 hrs\n3.1. Apply basic language\nAnalyze TDD\n3.2. Apply basic language\nsyntax and layout\n3.3. Develop working\nprototype\n3.4. Test prototype\n3.5. Refine/Debug system\n\n• Lecture/\nDiscussion\n• Hands on\n• Exercises\n• Demonstration\n• Supervised\nindustry\ntraining\n• Demonstration\n/ Practical\nexam\n• Presentation\nwith\nquestioning\n• Individual\ninterview\n•\nGame\nPortfolio of\nwork samples\n\nNote:\nThe Supervised Industry Training (SIT) component may be implemented in\nflexible manner. It may be integrated within various modules or units of\ncompetency or at the end of the in-school or classroom training.\n\n--- PDF PAGE 52 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 50\n3.2 TRAINING DELIVERY\n\nThe delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and\nthe curriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based on both on- and off-the-job components\n• Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n• Training allows for multiple entry and exit; and\n• Training programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in - school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\njust facilitates the training delivery.\n\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n• Project-based instruction is an authentic instructional model or strategy\nin which students plan, implement and evaluate projects that have real\nworld applications.\n\n--- PDF PAGE 53 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 51\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n• High school in level and/or holder of HS diploma or equivalent.\n• With Skill Functions which will be validated by an entrance exam to be\nadministered by the training institution using a tool devised by the\nTechnical Experts Panel (TEP) and participants of the National Validation\nof this Training Regulation.\n• Knowledge of at least one (1) programming language is a preference\n• Has the capacity to communicate in both oral and written forms.\n• Physically able to manipulate a mouse, track-ball, electronic pen, etc.\n• Must have knowledge of video/computer games in any platform.\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience and others that may be\nrequired from the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the conduct of training\nfor 10 trainees in Game Programming NC III:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty\nDescription\nQty\nDescription\nQty\nDescription\n10\nlicenses\nComputer Application\n*Require At least 2\n - Visual Studio\n.NET -\nProfessional\n - Flash\n - Eclipse\n - Unity 3D\n - Game engines\n10\nComputer\n(with peripherals)\nWindows PC or Mac\n-\n17in. LCD monitor,\n-\nmulti-core 2GHz\nCPU,\n-\nDirect X10 capable\nvideo card,\n-\n4GB memory,\n-\n500 GB hard disk,\n10\nHand-outs\n10\nlicenses\nGraphics Library\ne.g. - DirectX\n10\nErgonomic computer\ntables and chairs\n10\nLearning materials/\nguide\n1\nInternet access ,\n2Mbps\n1\nLCD Projector and screen\n10\nPractice materials\n\n1\nPrinter\n10\nReference books\n\n1\nWhite board and / or glass\nboard\n\nThe quantity of tools and equipment to be used for the conduct of training for this\nqualification shall depend on the number of students, size of the class, and/or modality of\ntraining. The most important consideration is to make sure that tools and equipment are\nadequately provided to all trainees when needed. The actual list of tools, equipment,\n\n--- PDF PAGE 54 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 52\nmachines, supplies and other materials to be used shall be identified and detailed in the\nCompetency Based Curriculum (CBC) to be submitted by the TVET provider when\nregistering a course or training program with TESDA.\n\nDue to the fast-changing nature of the Information and Communications\nTechnology (ICT) sector, TVET providers are reminded to use and provide their trainees\nwith the latest technology tools/software, equipment and materials where appropriate\nand applicable.\n\nIn cases where there are specialized tools, equipment and facilities that are\nnot generally considered standard requirements or not absolute requisites for training,\nthe industry working group or TESDA may provide guidelines or specific advice on such\nmatters.\n\n3.5 TRAINING FACILITIES\n\nBased on class size of 10 students/trainees the space requirements for\n\nthe teaching/learning and circulation areas are as follows:\n\nTEACHING/LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nLecture Area (optional)\n5 x 8\n40\n1\n40\nComputer/Laboratory Area\n6 x 8\n48\n1\n48\nLearning Resource Area\n4 x 5\n20\n1\n20\nWash ,Toilet & Locker Room\n2 x 5\n10\n2\n20\n Sub-Total\n128\nFacilities/Equipment/Circulation**\n\n38\nTotal Area\n166\n\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\nAppropriate consideration should be given in providing and allocating work space,\ncommunications facilities, and the usual workplace amenities to ensure a proper learning\nenvironment. Where applicable, training shall be held or conducted in learning facilities in\naccordance with generally accepted industry standards and practice.\n\n--- PDF PAGE 55 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 53\n3.6\nTRAINERS’ QUALIFICATIONS\n\n•\nHolder of National TVET Trainer’s Certificate (NTTC) Level 1\n•\n* Must have at least 2-years relevant industry experience.\n•\nMust be physically & mentally fit.\n\n* Optional: Only when required by the hiring institution.\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement may be issued\nfor each unit of competency.\n\nAs a matter of policy, graduates of programs registered with TESDA under\nthese training regulations are required to undergo mandatory national competency\nassessment upon completion of the program.\n\n--- PDF PAGE 56 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 54"
