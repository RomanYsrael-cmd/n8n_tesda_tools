    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: Game Programming\n\nNC Level: NC III\n\nNominal Training Duration:\n64 hrs.\n- Basic Competencies\n70 hrs.\n- Common Competencies\n1,100 hrs.\n- Core Competencies\n-------------\n1,234 hrs.\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of a\nGame Programmer in accordance with industry standards. It covers the basic & common\ncompetencies in addition to the core competencies such as designing game program\nlogic, applying object-oriented programming language skills and applying programming\nskills for in-game application. The nominal duration of 800 hours training hours covers\nthe required core units at Game Programming NC III and an additional 300 hours\nsupervised-industry training (SIT). TVET providers can however, offer a longer,\nladderized course covering the NC III basic, common, and core units.\n\nBASIC COMPETENCIES\n64 hrs.\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace\nprocesses.\n1.2 Lead workplace\ndiscussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group discussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance\nexpectation for team\nmembers.\n\n2.4 Supervise team\nperformance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n\n--- PDF PAGE 49 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 47\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant\ninformation in planning\nnegotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n• Direct observation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 50 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 48\nCOMMON COMPETENCIES\n70 hrs.\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply critical\nthinking and\nthought\norganization\n1.1 Identify the theoretical\nfoundations of critical\nthinking\n1.2 Develop constructive\narguments\n1.3 Apply methods of\nreasoning\n1.4 Affirm generalization\n1.5 Arrive at a conclusion\n Field trip\n Symposium\n Film showing\n Simulation\n Supervised\nindustry\ntraining\n Demonstration\n& questioning\n Observation &\nquestioning\n Third party\nreport\n2. Apply Quality\nStandards\n2.1 Asses quality of received\nmaterials\n2.2 Assess own work\n2.3 Engage in quality\nimprovement\n Field trip\n Symposium\n Film showing\n Simulation\n Supervised\nindustry\ntraining\n Demonstration\n& questioning\n Observation &\nquestioning\n Third party\nreport\n3. Perform\ncomputer\noperations\n3.1 Set-up workstation\n3.2 Prepare storage media\n3.3 Work with files and objects\n3.4 Manipulate word\nprocessing software\n3.5 Manipulate spreadsheet\nsoftware\n3.6 Manipulate customize and\ndatabase applications\n3.7 Utilize the internet\n3.8 Maintain computer\nhardware and software\n\n Modular\n Film showing\n Computer\nbased training\n(e-learning)\n Project\nmethod\n Supervised\nindustry\ntraining\n Demonstration\nand\nquestioning\n Observation\nand\nquestioning\n Third party\nreport\n Assessment of\noutput product\n Portfolio\n Computer\nbased\nassessment\n\n--- PDF PAGE 51 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 49\nCORE COMPETENCIES\n1,100 hrs.\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Design game\nprogram logic\n\n200 hrs\n1.1. Analyze game\nspecifications\n1.2. Analyze game physics\n1.3. Prepare technical\ngame documentation\n1.4. Validate the technical\ngame documentation\n• Lecture/\nDiscussion\n• Hands on\n• Exercises\n• Demonstration\n• Supervised\nindustry\ntraining\n• Demonstration\n/ Practical\nexam\n• Presentation\nwith\nquestioning\n• Portfolio of\nwork samples\n• Individual\ninterview\n2. Apply object-\noriented\nprogramming\nlanguage skills\n\n200 HRS\n\n2.1. Apply basic language\nsyntax and layout\n2.2. Apply basic OO\nprinciples in the target\nlanguage\n2.3. Debug code\nDocument activities\n2.4. Test code\n• Lecture/\nDiscussion\n• Hands on\n• Exercises\n• Demonstration\n• Supervised\nindustry\ntraining\n\n• Demonstration\n/ Practical\nexam\n• Presentation\nwith\nquestioning\n• Portfolio of\nwork samples\n• Individual\ninterview\n3. Apply\nprogramming\nskills for in-\ngame\napplication\n\n400 hrs\n3.1. Apply basic language\nAnalyze TDD\n3.2. Apply basic language\nsyntax and layout\n3.3. Develop working\nprototype\n3.4. Test prototype\n3.5. Refine/Debug system\n\n• Lecture/\nDiscussion\n• Hands on\n• Exercises\n• Demonstration\n• Supervised\nindustry\ntraining\n• Demonstration\n/ Practical\nexam\n• Presentation\nwith\nquestioning\n• Individual\ninterview\n•\nGame\nPortfolio of\nwork samples\n\nNote:\nThe Supervised Industry Training (SIT) component may be implemented in\nflexible manner. It may be integrated within various modules or units of\ncompetency or at the end of the in-school or classroom training.\n\n--- PDF PAGE 52 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012 50"
