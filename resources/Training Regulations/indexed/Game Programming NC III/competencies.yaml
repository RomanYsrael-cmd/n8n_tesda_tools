        "source_title": "APPLY OBJECT-ORIENTED PROGRAMMING LANGUAGE SKILLS",
        "source_text": "--- PDF PAGE 38 ---\n_________________________________________________________________________________ \nGame Programming NC III                                                                      Promulgated __________________2012 36\n \nUNIT TITLE \n: \nAPPLY OBJECT-ORIENTED PROGRAMMING \nLANGUAGE SKILLS \nUNIT CODE \n: \nICT 313354 \nUNIT DESCRIPTOR \n: \nThis unit defines the knowledge, skills and attitudes \nrequired \nto \ncreate Object-Oriented (OO) program. \nCompetence includes applying basic language syntax and \nlayout, applying basic OO principles in writing codes, \ntesting and debugging codes and documenting activities.\n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  Range of Variables \n1. Apply basic \nlanguage syntax \nand layout \n1.1. Basic language syntax rules and best practices \nare followed \n1.2. Language data-types, operators and expressions \nare used in accordance with game-code standards \n1.3. The appropriate language syntax for sequence, \nselection and iteration constructs is used and \ncustomized to achieve robust efficient code \n \n2. Apply basic OO \nprinciples in the \ntarget language \n2.1. A class that contains primitive member/instance \nvariables is implemented \n2.2. A class that contains multiple options for object \nconstruction is implemented \n2.3. Enforce class security using encapsulation \n2.4. Inheritance is implemented to at least 2 levels of \ndepth \n2.5. Polymorphism is used at a simple level through \ninheritance to enable easy code extension \n \n3. Debug code \n3.1. An integrated development environment is \nused, particularly the language debugging facilities \n3.2. Program debugging techniques are used to detect \nand resolve errors \n \n4. Document \nactivities \n4.1. Guidelines for developing maintainable code \nadhering to a set of coding standard is followed \n4.2. Internal documentation standards and tools are \nfollowed and used \n \n5. Test code \n5.1. Simple tests are developed and conducted to confirm \nthe coding process meets design specification \n5.2. The tests performed are documented \n5.3. Corrections are made to the code and the \ndocumentation as needed\n\n--- PDF PAGE 39 ---\n_________________________________________________________________________________ \nGame Programming NC III                                                                      Promulgated __________________2012 37\nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. \nLanguage \nMay include but not limited: \n Java \n C++ \n C# \n2. \nIntegrated \ndevelopment \nenvironment \nMay include but not limited: \n Visual C++ \n Visual Studio Suite \n Eclipse \n J-Edit \n Code Warrior \n Jbuilder\n\n--- PDF PAGE 40 ---\n_________________________________________________________________________________ \nGame Programming NC III                                                                      Promulgated __________________2012 38\nEVIDENCE GUIDE \n \n1. \nCritical Aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 Basic language syntax and layout is applied \n1.2 Basic object-oriented principles in the target languages \nis applied \n1.3 Codes are debugged and tested \n \n2. \nRequired \nKnowledge and \nAttitude \n2.1 Understanding of Object oriented programming \nconcepts \n2.2 Object oriented programming language \n2.3 Small size application development \n2.4 Using a GUI to interact with operator \n2.5 Learning from multiple sources \n2.6 Problem solving \n2.7 Coping with stress \n2.8 Time management \n \n3. \nRequired Skills \n3.1 Reading and interpreting program specifications, \ntranslating requirements from problem space to \nmachine space \n3.2 Integrated Development environment usage \n3.3 Programming techniques \n3.4 Internal (code) documentation techniques \n3.5 Testing and debugging techniques \n3.6 Documentation techniques \n3.7 Combine applicable game programming languages \n3.8 Decision making process \n3.9 Setting realistic goals \n3.10 Develop a time frame for the project \n \n4. \nResource \nImplications \nTo demonstrate this unit of competence the following \nresources will be required: \n4.1 Programming language and development environment \n4.2 User requirements and specification \n4.3 Program and documentation standards \n4.4 Personal computer or workstation \n \n5. \nMethods of \nAssessment \nCompetency may be assessed through: \n5.1 Observation of real or simulated work processes \n5.2 Individual demonstration with oral questioning  \n5.3 Practical exam \n5.4 Portfolio assessment of work samples \n \n6. \nContext of \nAssessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated work environment.\n",
