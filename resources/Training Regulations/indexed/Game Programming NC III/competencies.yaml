  "source_section_text": "Section 1\nGAME PROGRAMMING NC III QUALIFICATIONS\n\nThe GAME PROGRAMMING NC III Qualification consists of competencies that\nare required for programming stand-alone computer game applications.\n\nThe units of competency comprising this qualification include the following:\n\nUNIT CODE\nBASIC COMPETENCIES\n\n5 00 311 1 09\nLead workplace communication\n5 00 311 1 10\nLead small teams\n5 00 311 1 11\nDevelop and practice negotiation skills\n5 00 311 1 12\nSolve problems related to work activities\n5 00 311 1 13\nUse mathematical concepts and techniques\n5 00 311 1 14\nUse relevant technologies\nCode\nCOMMON COMPETENCIES\n\nICT315203\nApply critical thinking and thought organization\nICT315202\nApply quality standards\nICT311201\nPerform computer operations\n\nCode\nCORE COMPETENCIES\n\nICT313352\nDesign game program logic\nICT313354\nApply object-oriented programming language skills\nICT313353\nApply programming skills for in-game application\n\nA person who has achieved this Qualification is competent to be:\n\n•\nGame Programmer\n•\nTechnical Game Designer\n•\nGame Tester\n•\nTools Programmer\n•\nGame Play Scripter\n\n--- PDF PAGE 4 ---\n_________________________________________________________________________________\nGame Programming NC III Promulgated __________________2012\n2"
