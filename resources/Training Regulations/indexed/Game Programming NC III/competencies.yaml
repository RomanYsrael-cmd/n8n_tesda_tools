        "source_text": "--- PDF PAGE 41 ---\n_________________________________________________________________________________ \nGame Programming NC III                                                                      Promulgated __________________2012 39\n \nUNIT TITLE \n: \nAPPLY PROGRAMMING SKILLS FOR IN-GAME \nAPPLICATION \nUNIT CODE \n: \nICT 313353 \nUNIT DESCRIPTOR \n: \nThis unit defines the knowledge, skills and attitudes \nrequired to undertake game-programming tasks using a \nprogramming language. Competence includes \ndevelopment environment preparation, basic language \nsyntax and layout application, game-related principles \napplication, assets integration as well as debugging and \ntesting techniques in support of the programming activity.\n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  Range of Variables \n1. Analyze TDD \n1.1. Game Mechanics are obtained by analyzing the \nGDD and TDD. \n1.2. Technical Storyboard and its corresponding pseudo \ncode are derived from the GDD and TDD.   \n1.3. Necessary hardware/software is set up to code, \ncompile and run according to development \nenvironment requirements. \n1.4. Source code control is set up according to \ncompany requirements.\n2. Apply basic \nlanguage syntax \nand layout \n2.1 Basic language syntax rules and best practices are \nobserved based on enterprise standards. \n2.2 Language data types, operators and expressions \nare optimized and used in accordance with game-\ncode standards. \n2.3 Language syntax for sequence, selection and \niteration constructs are used and customized to \nachieve robust efficient code. \n3. Develop working \nprototype \n3.1. Game module is identified per iteration in line with \nenterprise policies. \n3.2. Game Loop is defined and explained in line with \nkey concept and target platform. \n3.3. Program code is created and implemented in \naccordance with specifications for the game \nmodule in the technical design document (TDD). \n3.4. Mathematical concepts and techniques are used \nin controlling and implementing game systems. \n3.5. Style and design principles are used to solve \ncommon game programming problems.  \n3.6. Data structures and algorithms are used and \ncustomized to ensure robust and fast \nimplementation of game systems. \n3.7. Appropriate design patterns are identified and \napplied in coming up with initial prototype. \n3.8. Integrate and review different assets based on the \nGDD and TDD.\n\n--- PDF PAGE 42 ---\n_________________________________________________________________________________ \nGame Programming NC III                                                                      Promulgated __________________2012 40\n4. Test prototype \n4.1. Execute the prototype and check workability. \n4.2. Prototype is evaluated based on GDD. \n4.3. Prototype iteration is applied based on evaluation \nresults. \n4.4. Improvements and any lessons learned and \npossible recommendations are incorporated in \nprototype and documented. \n4.5. Iterative prototyping cycle is implemented until \ngame final prototype is approved in accordance \nwith enterprise policies. \n \n5. Refine/Debug \nsystem \n5.1. Game prototype is referred to game quality \nassurance (QA)/testing techniques for user-\nacceptability testing. \n5.2. Program errors identified are addressed and fixed \nin accordance with quality standards. \n5.3. Overall game design concerns including usability \nand accessibility issues are addressed based on \ngame quality assurance (QA)/testing techniques.   \n5.4. Game program is optimized based on project \nrequirements.\n\n--- PDF PAGE 43 ---\n_________________________________________________________________________________ \nGame Programming NC III                                                                      Promulgated __________________2012 41\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nGame \nMechanics  \nMay include but not limited: \n Gameplay \n Character behavior \n Collusion Specification \n Game Progression \n Rules \n Limitations \n Options \n User Interaction \n Game Systems \n2. \nHardware \n \n Windows PC \n Mac \n Linux \n- Ubuntu \n3. \nSoftware (IDE) \nThis may be any of the following languages, but are not \nlimited: \n Visual Studio \n   - Express \n   - Professional \n Eclipse \n Unity 3D \n   - Basic \n   - Pro \n Flash \n Game engines \n  - Unreal \n  - Cry Engine \n4. \nLanguage \nThis may be any of the following languages, but not limited:  \n C / C++ \n C# \n Java \n Python \n ActionScript \n5. \nMathematical \nconcepts and \ntechniques \n Linear algebra \n- Vectors and matrices \n- Coordinate spaces and transformations \n Geometry \n- Conic sections \n- Equation of a line\n\n--- PDF PAGE 44 ---\n_________________________________________________________________________________ \nGame Programming NC III                                                                      Promulgated __________________2012 42\n Basic trigonometry \n- Angles \n- Primary Trigonometric Functions \n Basic Differential Calculus \n- Limits \n- Polynomial differentiation \n- Basic integration \n Basic Newtonian physics \n- Projectile motion \n Collision detection \n Discrete math \n6. \nGame systems \n Graphics \n Inputs \n Gameplay \n Physics  \n Basic artificial intelligence (flee and chase) \n Sound \n7. \nStyle and design \nprinciples \nMay include but not limited: \n Object-oriented programming paradigm \n- Polymorphism \n- Inheritance \n- Interfaces \n \n Design patterns \n- Singleton \n- Observer Pattern \n- Visitor Pattern \n- Template Pattern \n- Bridge or Strategy Pattern \n \n8. \nData structures \nMay include but not limited: \n List \n- Arrays \n- Linked Lists \n Stacks \n Queue \n Trees \n Graphs \n\nVectors\n9. \nAlgorithms \nMay include but  not limited: \n Searching \n Sorting \n Broad-Phase Collision Test\n\n--- PDF PAGE 45 ---\n_________________________________________________________________________________ \nGame Programming NC III                                                                      Promulgated __________________2012 43\n \n10. Design patterns \nMay include but  not limited: \n Singleton \n Observer Pattern \n Visitor Pattern \n Template Pattern \n Bridge or Strategy Pattern \n11. Assets \nMay include but are not limited: \n Art \n Animation \n Sound \n \n12. Design patterns \nThis refers to generally accepted style and design \nprinciples such as: \n Object-oriented design patterns \n Game-design patterns \n13. Game quality \nassurance \n(QA)/testing \ntechniques \nMay include but not limited to : \n \nPair programming \n \nFocus group discussion (FGD) \n \nArcade testing with forms \n \n14. Game-design \nconcerns \nMay include but not limited to : \n Game objects and setting \n Game rules and dynamics \n Play mechanics \n Game goals \n Theme/color\n\n--- PDF PAGE 46 ---\n_________________________________________________________________________________ \nGame Programming NC III                                                                      Promulgated __________________2012 44\nEVIDENCE GUIDE \n \n1. \nCritical Aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 Game development environment is prepared \n1.2 Code for game application is written  \n1.3 Game application or programs is executed and tested \n \n2. \nRequired \nKnowledge and \nAttitude \n2.1 \nBasic interface design; use of GUIs for human-\ncomputer interaction \n2.2 \nMathematical concepts and techniques  \n2.3 \nControlling and implementing game systems  \n2.4 \nStyle and design principles  \n2.5 \nIntegrated development environment  \n2.6 \nData structures and algorithms \n2.7 \nProgram debugging techniques  \n2.8 \nLanguage data-types, operators and expressions \n2.9 \nApproaches to writing or developing game \napplications/programs \n2.10 Knowledge of various documentation tools \n2.11 Platforms/Game engines \n2.12 Knowledge In Completing a Game with Game Loop \n2.13 Language syntax \n2.13.1. \nVariable setting \n2.13.2. \nArithmetic and logic operations \n2.13.3. \nConditions  \n2.13.4. \nLoop and branch \n3. \nRequired Skills \n3.1 \nReading and interpreting program specifications, \ntranslating requirements from problem space to \nmachine space \n3.2 \nUsing Integrated Development Environment (IDE) \n3.3 \nProgramming techniques \n3.4 \nInternal (code) documentation techniques \n3.5 \nTesting and debugging techniques \n3.6 \nDocumentation techniques \n3.7 \nPlanning various programming activities \n3.8 \nProgramming in a team environment \n3.9 \nPreparing program documentation \n3.10 Interpreting program specifications and user \nrequirements \n3.11 Programming a Functional Game-Application with a \nGame Loop\n\n--- PDF PAGE 47 ---\n_________________________________________________________________________________ \nGame Programming NC III                                                                      Promulgated __________________2012 45\n \n4. \nResource \nImplications \nTo demonstrate this unit of competence the following \nresources will be required: \n4.1 \nProgramming language and development \nenvironment \n4.2 \nUser requirements and specifications \n4.3 \nProgram and documentation standards \n4.4 \nPersonal computer or workstation  \n4.5 \nProgramming standards - GDD/TDD for a specific \ngame project \n4.6 \nDocumentation standards and tools \n4.7 \nPersonal computer or workstation with game-\ndevelopment tools \n \n5. \nMethods of \nAssessment \nCompetency may be assessed through: \n5.1 \nObservation of real or simulated work processes \n5.2 \nIndividual demonstration with oral questioning  \n5.3 \nPractical exam \n5.4 \nGame portfolio assessment of work samples \n \n6. \nContext of \nAssessment \n6.1 \nCompetency may be assessed in the workplace or in \na simulated work environment.\n",
