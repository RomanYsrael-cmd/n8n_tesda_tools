        "source_title": "DESIGN GAME PROGRAM LOGIC",
        "source_text": "--- PDF PAGE 35 ---\n_________________________________________________________________________________ \nGame Programming NC III                                                                      Promulgated __________________2012 33\nCORE COMPETENCIES \nUNIT TITLE \n: \nDESIGN GAME PROGRAM LOGIC \nUNIT CODE \n: \nICT 313352 \nUNIT DESCRIPTOR \n: \nThis unit defines the knowledge, skills and attitudes \nrequired to design various game program logic to ensure \nthat there is understanding of user and design \nrequirements.\n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  Range of Variables \n1. \nAnalyze game \nspecifications \n1.1. Design documentation is obtained and the \nrequirements for the game are reviewed and clarified \nbased on enterprise standards. \n1.2. Game technical design is conceptualized based on   \nclient requirements. \n1.3. Program scope and limits are identified/clarified based \non project requirements. \n2. \nAnalyze game \nphysics \n2.1. Identify & Solve physics problems/equations based on \nGDD. \n2.2. Determine maximum and/or minimum values, sketch \ncurves, and determine the range for a given domain \nbased on identified physics problem based on \nenterprise standards. \n2.3. Convert physics formulas from mathematical notations \ninto syntax based on GDD. \n2.4. Apply differentiation based on GDD. \n3. \nPrepare \ntechnical game \ndocumentation \n3.1. Requirements are transformed to technical design \ndocument (TDD) according to enterprise standards. \n3.2. Program structures are illustrated based on game \ndesign document. \n3.3. Special routines or procedures are identified and \ndocumented based on project requirements \n3.4. Resources for coding and testing programs are \nidentified based on project requirements. \n4. \nValidate the \ntechnical game \ndocumentation  \n4.1. Technical design document is checked for compliance \nwith enterprise documentation standards \n4.2. Technical design document is checked based on \nproject specifications  \n4.3. Past project documentations are reviewed for \ncomparison with the technical design document.\n\n--- PDF PAGE 36 ---\n_________________________________________________________________________________ \nGame Programming NC III                                                                      Promulgated __________________2012 34\nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. \nDesign \ndocumentation \n Game design document (GDD)  \n Technical design document (TDD)  \n2. \nDifferentiation \n Gradients \n Tangents \n Normal \n Stationary points \n Rates of change \n3. \nRequirements \n Data types \n Variables  \n \n4. \nEnterprise standards \n Code templates \n Platform-specific templates, e.g., Android \ntemplates \n Naming conventions \n \n5. \nResources for coding \nand testing programs \n Personnel \n Hardware \n Software\n\n--- PDF PAGE 37 ---\n_________________________________________________________________________________ \nGame Programming NC III                                                                      Promulgated __________________2012 35\nEVIDENCE GUIDE \n \n1. \nCritical Aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 Technical game documentation is prepared \n1.2 Technical game documentation is validated \n1.3 Game program logic is formulated/designed   \n \n2. \nRequired \nKnowledge and \nAttitude \n2.1 \nMathematical and science concepts to : \n- \nSolve spatial problems in 2D and 3D \n- \nSimulate movement (objects) \n- \nPrecision of movement (objects) \n2.2 \nGame logic design using construct/modules/ objects \n2.3 \nConcepts of various game program design and system \nlifecycle options \n2.4 \nGame system specifications and requirements \n2.5 \nLearning from multiple sources \n2.6 \nResearching using library and printed literature \n2.7 \nUnderstanding the expectation \n2.8 \nOrganizing your thoughts \n2.9 \nOrganizing projects \n3. \nRequired Skills \n3.1 Applying the use of various design documentation tools \n3.2 Conceptualizing game technical design \n3.3 Designing and validating program logic and flow \n3.4 Combine applicable game programming languages \n3.5 Using the search engines \n3.6 Understanding key terminology \n3.7 Draft a mind map \n3.8 Task Allocation \n4. \nResource \nImplications \nTo demonstrate this unit of competence the following \nresources will be required: \n4.1 Program or design specifications \n4.2 Documentation tools \n4.3 Personal computer or workstation \n5. \nMethods of \nAssessment \nCompetency may be assessed through: \n5.1 Observation of real or simulated work processes \n5.2 Individual demonstration with oral questioning  \n5.3 Practical exam \n5.4 Portfolio assessment of work samples \n6. \nContext of \nAssessment \n \n6.1 Competency may be assessed in the workplace or in a \nsimulated work environment.\n",
