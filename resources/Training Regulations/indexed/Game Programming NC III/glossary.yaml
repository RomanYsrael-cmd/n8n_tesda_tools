      "term": "Unit of Competency",
      "definition": "is a component of the competency standards stating a specific key function or role in a particular job or occupation; it is the smallest component of achievement that can be assessed and certified under the PTQF SECTOR SPECIFIC 1. Algorithm - is a type of effective method in which a list of well-defined instructions for completing a task will, when given an initial state, proceed through a well-defined series of successive states, eventually terminating in an end-state. The transition from one state to the next is not necessarily deterministic; some algorithms, known as probabilistic algorithms, incorporate randomness. 2. Artificial intelligence programmer - develops the logic the game uses to carry out a large number of actions. An AI programmer may program pathfinding, strategy and enemy tactic systems. This is one of the most challenging aspects of game programming and its sophistication is developing rapidly. 3. Browser - a software package that provides the user interface for accessing Internet, intranet and extranet Web sites. 4. Compiler - is a computer program (or set of programs) that translates text written in a computer language (the source language) into another computer language (the target language). The original sequence is usually called the source code and the output called object code. Commonly the output has a form suitable for processing by other programs (e.g., a linker), but it may be a human-readable text file. Game Programming NC III Promulgated __________________2012 58 5. Computer - a device that has the ability to accept data; internally store and execute a program of instructions; perform mathematical, logical, and manipulative operations on data; and report the results. 6. Computer Terminal - any input/output device connected by telecommunications links to a computer. 7. Data - objective measurements of the attributes (characteristics) of entities such as people, places, things, and events. 8. Documentation - a collection of documents or information. 9. Eclipse - is an integrated development environment (IDE) written primarily in Java. The initial codebase originated from Visual Age. In its default form it is meant for Java developers, consisting of the Java Development Tools (JDT). Users can extend its capabilities by installing plug-ins written for the Eclipse software framework, such as development toolkits for other programming languages, and can write and contribute their own plug-in modules. 10. Edit - to modify the form or format of data 11. Encryption - to scramble data or convert it, prior to transmission, to a secret code that masks the meaning of he data to unauthorized recipients. 12. End user - anyone who uses an information system or the information it produces. 13. Ergonomics - the science and technology emphasizing the safety, comfort, and ease of use of human-operated machines. The goal of ergonomics is to produce systems that are user-friendly: safe, comfortable and easy to use. 14. Flash - can manipulate vector and raster graphics and supports bi-directional streaming of audio and video. It contains a scripting language called ActionScript. It is available in most common web browsers and some mobile phones and other electronic devices (using Flash Lite). Several software products, systems, and devices are able to create or display Flash, including the Adobe Flash Player. The Adobe Flash Professional multimedia authoring program is used to create content for the Adobe Engagement Platform, such as web applications, games and movies, and content for mobile phones and other embedded devices. 15. Game programming - a subset of game development, is the programming of computer, console or arcade games. Though often engaged in by professional game programmers, many novices may program games as a hobby. 16. Game loop - the key component of any game, from a programming standpoint. The game loop allows the game to run smoothly regardless of a user's input or lack thereof. 17. Game programmer - is a programmer who primarily develops video games or related software (such as game development tools). Game programming has many specialized disciplines; practitioners of any may regard themselves as \"game programmers\". A game programmer should not be confused with a game designer; many designers are also programmers, but not all are, and it is rare for one person to serve both roles in modern professional games 18. Graphics programmer - historically, this title usually belonged to a programmer who developed specialized blitter algorithms and clever optimizations for 2D graphics. Today, however, it is almost exclusively applied to programmers who specialize in developing and modifying complex 3D graphic renderers. Some 2D graphics skills have just recently become useful again, though, for developing games for the new generation of cell phones, PDAs and handheld game consoles. A 3D graphics programmer must have a firm grasp on advanced mathematical concepts such as vector and matrix math, quaternions and linear algebra. Game Programming NC III Promulgated __________________2012 59 19. Game physics programmer - is dedicated to developing the physics a game will employ. Typically, a game will only simulate a few aspects of real-world physics. For example, a space game may need simulated gravity, but would not have any need for simulating water viscosity. 20. Gameplay programmer - Though all programmers add to the content and experience that a game provides, a gameplay programmer focuses more on a game's strategy and the \"feel\" of a game. This is usually not a separate discipline, as what this programmer does usually differs from game to game, and they will inevitably be involved with more specialized areas of the game's development such as graphics or sound. 21. Information - data placed in a meaningful and useful context for an end user. 22. Information and Communication Technology (ICT) - refers to technologies associated with the transmission and exchange of data in the form of sound, text, visual images, signals or any combination of those forms through the use of digital technology. It encompasses such services as telecommunications, posts, multimedia, electronic commerce, broadcasting, and information technology. 23. Integrated development environment (IDE) - is a software application that provides comprehensive facilities to computer programmers for software development. An IDE normally consists of a source code editor, a compiler and/or interpreter, build automation tools, and (usually) a debugger. Typically an IDE is dedicated to a specific programming language, so as to provide a feature set which most closely matches the programming paradigms of the language. However, some multiple-language IDEs are in use, such as Eclipse, ActiveState Komodo, recent versions of NetBeans, and Microsoft Visual Studio. 24. Key frame - is a single still image in an animated sequence that occurs at an important point in that sequence; key frames are defined throughout an animated sequence, in order to define pivotal points of motion before the frames in between are drawn or otherwise created to \"tween\" the motion between the two key frames. 25. Local Area Network (LAN) - a communications network that typically connects computers, terminals, and other computerized devices within a limited physical area such as an office, building, manufacturing plant and other work sites. 26. Microsoft DirectX - is a collection of application programming interfaces (APIs) for handling tasks related to multimedia, especially game programming and video, on Microsoft platforms. 27. Object code - or an object file, is the representation of code that a compiler or assembler generates by processing a source code file. Object files contain compact code, often called \"binaries\". A linker is typically used to generate an executable or library by linking object files together. The only essential element in an object file is machine code (code directly executed by a computer's CPU). Object files for embedded systems might contain nothing but machine code. However, object files often also contain data for use by the code at runtime, relocation information, program symbols (names of variables and functions) for linking and/or debugging purposes, and other debugging information. 28. Outsourcing - turning over all or part of an organization’s information systems operation to outside contractors, known as systems integrators or facilities management companies. 29. Quality Assurance - methods for ensuring that information systems are free from errors and fraud and provide information products of high quality. 30. Production. During production, programmers churn out a great deal of source code to create the game described in the game's design document. Along the way, the design document is modified to meet limitations or expanded to exploit new features. The design document is very much a \"living document\" much of whose life is dictated by programmer's schedules, talent and resourcefulness. Game Programming NC III Promulgated __________________2012 60 31. Prototyping - Writing prototypes of gameplay ideas and features is an important activity that allows programmers and game designers to experiment with different algorithms and usability scenarios for a game. A great deal of prototyping may take place during pre- production before the design document is complete and may, in fact, help determine what features the design specifies. Prototyping may also take place during active development to test new ideas as the game emerges. 32. Simulation - the process of imitating a real phenomenon with a set of mathematical formulas. Advanced computer programs can simulate weather conditions, chemical reactions, atomic reactions, even biological processes. 33. Software - computer programs and procedures concerned with the operation of an information system. 34. Sound programmer - Not always a separate discipline, sound programming has been a mainstay of game programming since the days of Pong. Most games make use of audio, and many have a full musical score. Computer audio games eschew graphics altogether and use sound as their primary feedback mechanism. 35. Source code - is the collection of files needed to convert from human-readable form to some kind of computer-executable form. The source code may be converted into an executable file by a compiler, or executed on the fly from the human readable form with the aid of an interpreter. 36. Standards - measures of performance developed to evaluate the progress of a system toward its objectives 37. System - an assembly of methods, procedures, or techniques unified by regulated interaction to form an organized whole 38. Vector - is a line or a movement defined by end-points or, essentially, the distance between point A and point B. Vectors can be used to calculate animated motion mathematically instead of through the use of manual key frames; vectors can also be used to define computer-animated shapes. 39. Video game - is a game that involves interaction with a user interface to generate visual feedback on a video device. The word video in video game traditionally referred to a raster display device. However, with the popular use of the term \"video game\", it now implies any type of display device. The electronic systems used to play video games are known as platforms; examples of these are personal computers and video game consoles. These platforms are broad in range, from large computers to small handheld devices. Specialized video games such as arcade games, while previously common, have gradually declined in use. 40. User- friendly - a characteristic of human-operated equipment and systems that makes them safe, comfortable, and easy to use. Game Programming NC III Promulgated __________________2012 61"
    }
