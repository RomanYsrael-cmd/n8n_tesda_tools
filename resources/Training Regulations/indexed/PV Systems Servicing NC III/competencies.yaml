        "source_title": "REPAIR PV SYSTEMS",
        "source_text": "--- PDF PAGE 43 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV Systems Servicing NC III \n \n \n \n                                         Page 41  \n \n \n       \n \n \n \n \n \n \nUNIT OF COMPETENCY : \nREPAIR PV SYSTEMS \n \nUNIT CODE  \n \n: \nCON724330 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude in  \nrepairing small solar home systems up to 1kWp \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Prepare for service/repair \n1.1 Work instructions are read and interpreted to \ndetermine job requirements \n1.2 Tools, measuring instruments, and materials are \nprepared in accordance with job order requirements \nand checked against damage \n1.3 Appropriate personal protective equipment (PPE) is \nused in line with the job order requirement \n1.4 Work safety is observed according to industry \nregulations \n2. Verify / validate diagnosis \nresults \n2.1 System components are verified against the previous \ndiagnostic activity \n2.2 All components are cleaned and checked based on \nmanufacturer’s specs, any malfunctions and \ndeviations are noted \n2.3 Safe working practices are observed based on \nprocedures \n3. Repair/replace faulty PV \ncomponent \n3.1 Photovoltaic system components and accessories are \nrepaired/replaced \n3.2 Task is performed without causing damage to the \ncomponents, tools, and/or injury to self and others \n4. Test PV system \n4.1 Tools and measuring instruments are used based on \nsystem parameters to be tested \n4.2 PV system is checked for any more defects based on \nprocedures \n4.3 Rectification of any malfunctions/deficiencies is \nperformed based on set procedures \n4.4 PV system parameters are tested to comply within the \nnominal range  \n4.5 Safe working practices are observed throughout the \ntask based on safety procedure \n4.6 Repair and services are accomplished and recorded in \nthe logbook or accomplishment report form \n5. Debrief Customer \n5.1 Causes of PV system faults and effects are explained \naccording to company standard operating procedure \n5.2 Preventive measures (do’s and  don’ts) is \nrecommended based on the diagnosis\n\n--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV Systems Servicing NC III \n \n \n \n                                         Page 42  \n \n \n       \n \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE\nRANGE\n1. Tools, Measuring \nInstruments, and \nMaterials \n \n \n1.1 Tools: \n1.1.1 Screwdrivers \n1.1.2 Pliers \n1.1.3 Wrenches \n1.1.4 Hammer \n1.1.5 Electrician’s knife \n1.1.6 Hacksaw \n1.1.7 Cross cut saw \n1.1.8 Hand drill \n1.1.9 Soldering iron \n1.1.10 Wire stripper \n1.1.11 Steel brush \n1.1.12 Paint brush  \n1.1.13 Gun tacker \n1.1.14 Ladder/scaffolding \n1.1.15 Magnetic compass \n1.1.16 Spirit level \n1.2 Measuring instruments \n1.2.1 Clamp meter \n1.2.2 Ammeter \n1.2.3 Voltmeter \n1.2.4 Multimeter \n1.2.5 Hydrometer \n1.3Materials \n1.3.1 Wires and cables \n1.3.2 Connectors \n1.3.3 Clamps \n1.3.4 Electrical tape \n1.3.5 Oil and grease \n1.3.6 Fuse \n1.3.7 Diodes \n1.3.8 Staple wires, screws, and nails \n1.3.9 Paint/primer (if needed) \n1.3.10 Asphalt/sealant (if needed) \n1.3.11 Distilled water \n1.3.12 Electrolyte \n1.3.13 Soldering lead \n1.3.14 Bolts and nuts \n2. Personal protective \nequipment (PPE) \nIncludes but not limited to: \n2.1 Mask \n2.2 Safety Goggles \n2.3 Gloves (rubber/leather) \n2.4 Folding Ladder \n2.5 Safety harness \n2.6 First aid kit\n\n--- PDF PAGE 45 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV Systems Servicing NC III \n \n \n \n                                         Page 43  \n \n \n       \n \n \n \n \n \n \nVARIABLE\nRANGE\n2.7 Hard hat \n2.8 Safety shoes \n2.9 Leather apron \n2.10 Safety belts \n2.11 Electrician holster kit \n2.12 Safety clothes/pants \n2.13 Insulating mat \n3. System Components \n3.1 PV Module/array \n3.2 Support structures \n3.3 Charge Controller/regulator \n3.4 Battery/battery bank \n3.5 Inverter/converter \n3.6 Lighting fixtures and accessories \n3.7 Convenience outlets for appliances and devices \n3.8 Wires and cables \n3.9 Fastening fixtures \n4. Rectification \n4.1 Replace defective components such as: \n4.1.1 Fuse \n4.1.2 Diode \n4.1.3 Charge controller/regulator \n4.1.4 Inverter \n4.1.5 Battery  \n4.2 Repair/replace field serviceable parts such as: \n4.2.1 Switches \n4.2.2 Receptacles \n4.2.3 Wires/cables \n4.2.4 Battery clamps \n4.2.5 Convenience outlet \n4.2.6 Bulb \n4.2.7 Junction box \n4.2.8 Raceway pipe/plastic\n\n--- PDF PAGE 46 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV Systems Servicing NC III \n \n \n \n                                         Page 44  \n \n \n       \n \n \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Repaired/replaced PV components as per manufacturer \noperation's operation/repair manual \n1.2 Tested PV system operation according to manufacturer's \noperation/repair manual and standard operating procedures \n(SOP) \n1.3 Recorded and completed maintenance/service repair/report in \naccordance with standard operating procedures \n1.4 Demonstrated compliance with safety regulations applicable to \nworksite operations \n2. Underpinning knowledge \nand attitude \n2.1 Safety practices \n2.1.1 Personal protective equipment (PPE) \n2.1.2 Safe handling of tools and supplies/materials \n2.1.3 Safety signs and symbols \n2.1.4 Safety hazard \n2.1.5 Housekeeping \n2.2 Maintenance, Service, and Repair \n2.2.1 Preventive Maintenance \n2.3 Process Procedure \n2.3.1 Electrical control procedure \n2.3.2 Repair/replace assemble charge controller/regulator \nprocedure \n2.3.3 Repair/replace defective lamp procedure \n2.3.4 Replace diode/fuse procedure \n2.3.5 Repair/replace switch, receptacle wires, convenience \noutlet procedure \n2.3.6 Maintain/replace battery \n2.3.7 Electrical testing procedure \n2.3.8 Sort, Straighten, Shine, Systemize and Sustain  (5S) \nprocedure \n2.3.9 Safety process and procedure \n2.3.10 Maintenance procedure \n2.3.11 Troubleshooting knowledge \n2.3.12 Patient \n2.3.13 Honest \n2.3.14 Attentive/observant \n2.3.15 Frugal  \n3. Underpinning skills \n3.1 Reading and interpreting schematic diagrams, specifications \nand manuals \n3.2 Preparing materials/tools/supplies \n3.3 Proper use of electrical measuring instruments and \nmaterials/supplies \n3.4 Electronic test skills \n3.5 Troubleshooting technique \n3.6 Repairing/replacing defective parts and accessories \n3.7 Preparing reports\n\n--- PDF PAGE 47 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV Systems Servicing NC III \n \n \n \n                                         Page 45  \n \n \n       \n \n \n \n \n \n \n3.8 Communication skills \n3.9 Interpersonal skills \n3.10 Electricity/electronics background \n3.11 Installing PV components and accessories \n3.12 Electronic testing/calibrating skills \n3.13 Battery calibration/maintenance \n4. Resource implications \nThe following resources must be provided: \n4.1 Work place or site location \n4.2 Materials, tools, and supplies appropriate to repairing \nprocesses \n4.3 Schematic drawing diagrams and specifications relevant to \nthe task \n4.4 Personal protective equipment (PPE) \n4.5 Manuals, procedures and codes \n4.6 Manufacturer’s specifications\n5. Method of assessment \nCompetency must be assessed through: \n5.1 Demonstration and observation with questioning \n5.2 Interview/oral questioning \n5.3 Third party report \n5.4 Portfolio \n6. Context  of assessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated workplace \n6.2 Competency assessment must be undertaken in accordance \nwith the endorsed TESDA assessment guidelines\n",
