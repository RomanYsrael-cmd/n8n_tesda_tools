        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Performed monitoring of PV system operation\n1.2 Prepared the monitoring activities\n1.3 Checked the PV system status\n2. Underpinning\nknowledge and\nattitude\n2.1 PV Technology and systems\n2.2 Schematic diagrams\n2.3 Tools, materials, supplies\n2.4 Awareness of personal protective equipment\n2.5 Observant/Attentive to details\n2.6 Patient\n2.7 Honest\n2.8 Integrity/Code of ethics\n2.9 Standard operating procedures (SOP)\n3. Underpinning\nskills\n3.1 Proficiency in usage of tools, materials, supplies\n3.2 Familiarity with PV systems and components\n3.3 Use of personal protective equipment\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Manuals, procedures, and codes\n4.2 Tools, electrical measuring materials\n4.3 Supplies and materials\n4.4 Personal protective equipment (PPE)\n4.5 Forms\n4.6 Paper and pen\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Demonstration and observation with questioning\n5.2 Written and oral exams\n5.3 Third party report\n5.4 Portfolio\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace\n6.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 51 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 49"
        },
        "source_text": "CON724331\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the skills, knowledge and attitude\nin monitoring PV systems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for monitoring\nactivities\n1.1 Sequence of activities outlined in accordance with the\nmonitoring manual\n1.2 Monitoring forms are prepared in accordance with job\norder requirements\n1.3 Personal protective equipment is selected in line with\njob order requirement\n2. Check PV System Status\n2.1 PV system parameter is checked based on monitoring\nprocedures using appropriate tools, measuring\ninstruments, and materials.\n2.2 Monitoring form is accomplished as per company\nrequirement\n2.3 Task is performed without causing damage to the\ncomponents, tools or electrical measuring instruments\nand injury to self and others\n\n--- PDF PAGE 49 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 47\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. PV system parameters\n\n1.1 Voltage\n1.2 Current\n1.3 Specific gravity\n1.4 Flow rate\n1.5 Power\n1.6 Temperature\n1.7 Loads\n1.8 Voltage drop\n1.9 Grounding protection\n2. Tools, measuring\ninstruments, and materials\n\n2.1 Tools:\n2.1.1 Screwdrivers\n2.1.2 Pliers\n2.1.3 Wrenches\n2.1.4 Hammer\n2.1.5 Electrician’s knife\n2.1.6 Steel brush\n2.1.7 Paint brush\n2.1.8 Ladder/scaffolding\n2.1.9 Magnetic compass\n2.1.10 Spirit level\n2.2 Measuring instruments\n2.2.1 Clamp meter\n2.2.2 Ammeter\n2.2.3 Voltmeter\n2.2.4 Multimeter\n2.2.5 Hydrometer\n2.3 Materials\n2.3.1 Wires and cables\n2.3.2 Connectors\n2.3.3 Clamps\n3. Components\n3.1 Grounding system\n3.2 Mounting structure\n3.3 PV module/array\n3.4 Battery/battery bank\n3.5 Charge controller/regulator\n3.6 Inverter (if present)\n3.7 Wires/cables and accessories\n3.8 Loads\n\n--- PDF PAGE 50 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 48\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Performed monitoring of PV system operation\n1.2 Prepared the monitoring activities\n1.3 Checked the PV system status\n2. Underpinning\nknowledge and\nattitude\n2.1 PV Technology and systems\n2.2 Schematic diagrams\n2.3 Tools, materials, supplies\n2.4 Awareness of personal protective equipment\n2.5 Observant/Attentive to details\n2.6 Patient\n2.7 Honest\n2.8 Integrity/Code of ethics\n2.9 Standard operating procedures (SOP)\n3. Underpinning\nskills\n3.1 Proficiency in usage of tools, materials, supplies\n3.2 Familiarity with PV systems and components\n3.3 Use of personal protective equipment\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Manuals, procedures, and codes\n4.2 Tools, electrical measuring materials\n4.3 Supplies and materials\n4.4 Personal protective equipment (PPE)\n4.5 Forms\n4.6 Paper and pen\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Demonstration and observation with questioning\n5.2 Written and oral exams\n5.3 Third party report\n5.4 Portfolio\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace\n6.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 51 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 49"
