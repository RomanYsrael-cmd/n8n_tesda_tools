ment identified and \nconverted according to job requirements/ISO \n2.9  Workpieces are measured according to job \nrequirements\n\n--- PDF PAGE 33 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV Systems Servicing NC III \n \n \n \n                                         Page 31  \n \n \n       \n \n \n \n \n \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Geometric shape \n \n \n \n \n \n Including but is not limited to: \n1.1 Round \n1.2 Square \n1.3 Rectangular \n1.4 Triangle \n1.5 Sphere \n1.6 Conical \n2.  Measuring instruments \nIncluding but not limited to: \n2.1 Micrometer (In-out, depth) \n2.2 Vernier caliper (out, inside) \n2.3 Dial gauge with mag, std. \n2.4 Straight edge \n2.5 Thickness gauge \n2.6 Torque gauge \n2.7 Small hole gauge \n2.8 Telescopic gauge \n2.9 Try-square \n2.10 Protractor \n2.11 Combination gauge \n2.12 Steel rule \n2.13 Voltmeter \n2.14 Ammeter \n2.15 Mega-ohmeter \n2.16 Kilowatt hour meter \n2.17 Gauges \n2.18 Thermometers \n2. Measurements and \ncalculations \n \n3.1 Linear \n3.2 Volume \n3.3 Area \n3.4 Wattage \n3.5 Voltage \n3.6 Resistance \n3.7 Amperage \n3.8 Frequency \n3.9 Impedance \n3.10 Conductance \n3.11 Capacitance \n3.12 Displacement \n3.13 Inside diameter \n3.14 Circumference \n3.15 Length \n3.16 Thickness \n3.17 Outside diameter \n3.18 Taper\n\n--- PDF PAGE 34 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV Systems Servicing NC III \n \n \n \n                                         Page 32  \n \n \n       \n \n \n \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects \n     of competency \nAssessment requires that the candidate: \n1.1 Selected and prepared appropriate measuring instruments in \naccordance with job requiremen