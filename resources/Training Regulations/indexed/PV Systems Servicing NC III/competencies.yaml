        "source_text": "CON724330\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude in\nrepairing small solar home systems up to 1kWp\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for service/repair\n1.1 Work instructions are read and interpreted to\ndetermine job requirements\n1.2 Tools, measuring instruments, and materials are\nprepared in accordance with job order requirements\nand checked against damage\n1.3 Appropriate personal protective equipment (PPE) is\nused in line with the job order requirement\n1.4 Work safety is observed according to industry\nregulations\n2. Verify / validate diagnosis\nresults\n2.1 System components are verified against the previous\ndiagnostic activity\n2.2 All components are cleaned and checked based on\nmanufacturer’s specs, any malfunctions and\ndeviations are noted\n2.3 Safe working practices are observed based on\nprocedures\n3. Repair/replace faulty PV\ncomponent\n3.1 Photovoltaic system components and accessories are\nrepaired/replaced\n3.2 Task is performed without causing damage to the\ncomponents, tools, and/or injury to self and others\n4. Test PV system\n4.1 Tools and measuring instruments are used based on\nsystem parameters to be tested\n4.2 PV system is checked for any more defects based on\nprocedures\n4.3 Rectification of any malfunctions/deficiencies is\nperformed based on set procedures\n4.4 PV system parameters are tested to comply within the\nnominal range\n4.5 Safe working practices are observed throughout the\ntask based on safety procedure\n4.6 Repair and services are accomplished and recorded in\nthe logbook or accomplishment report form\n5. Debrief Customer\n5.1 Causes of PV system faults and effects are explained\naccording to company standard operating procedure\n5.2 Preventive measures (do’s and don’ts) is\nrecommended based on the diagnosis\n\n--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 42\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools, Measuring\nInstruments, and\nMaterials\n\n1.1 Tools:\n1.1.1 Screwdrivers\n1.1.2 Pliers\n1.1.3 Wrenches\n1.1.4 Hammer\n1.1.5 Electrician’s knife\n1.1.6 Hacksaw\n1.1.7 Cross cut saw\n1.1.8 Hand drill\n1.1.9 Soldering iron\n1.1.10 Wire stripper\n1.1.11 Steel brush\n1.1.12 Paint brush\n1.1.13 Gun tacker\n1.1.14 Ladder/scaffolding\n1.1.15 Magnetic compass\n1.1.16 Spirit level\n1.2 Measuring instruments\n1.2.1 Clamp meter\n1.2.2 Ammeter\n1.2.3 Voltmeter\n1.2.4 Multimeter\n1.2.5 Hydrometer\n1.3Materials\n1.3.1 Wires and cables\n1.3.2 Connectors\n1.3.3 Clamps\n1.3.4 Electrical tape\n1.3.5 Oil and grease\n1.3.6 Fuse\n1.3.7 Diodes\n1.3.8 Staple wires, screws, and nails\n1.3.9 Paint/primer (if needed)\n1.3.10 Asphalt/sealant (if needed)\n1.3.11 Distilled water\n1.3.12 Electrolyte\n1.3.13 Soldering lead\n1.3.14 Bolts and nuts\n2. Personal protective\nequipment (PPE)\nIncludes but not limited to:\n2.1 Mask\n2.2 Safety Goggles\n2.3 Gloves (rubber/leather)\n2.4 Folding Ladder\n2.5 Safety harness\n2.6 First aid kit\n\n--- PDF PAGE 45 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 43\n\nVARIABLE\nRANGE\n2.7 Hard hat\n2.8 Safety shoes\n2.9 Leather apron\n2.10 Safety belts\n2.11 Electrician holster kit\n2.12 Safety clothes/pants\n2.13 Insulating mat\n3. System Components\n3.1 PV Module/array\n3.2 Support structures\n3.3 Charge Controller/regulator\n3.4 Battery/battery bank\n3.5 Inverter/converter\n3.6 Lighting fixtures and accessories\n3.7 Convenience outlets for appliances and devices\n3.8 Wires and cables\n3.9 Fastening fixtures\n4. Rectification\n4.1 Replace defective components such as