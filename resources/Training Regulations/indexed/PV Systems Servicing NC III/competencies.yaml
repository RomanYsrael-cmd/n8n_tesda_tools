        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Dealt with a range of communication/information at one time\n1.2 Made constructive contributions in workplace issues\n1.3 Sought workplace issues effectively\n1.4 Responded to workplace issues promptly\n1.5 Presented information clearly and effectively written form\n1.6 Used appropriate sources of information\n1.7 Asked appropriate questions\n1.8 Provided accurate information\n2. Underpinning\nknowledge and\nattitude\n2.1 Organization requirements for written and electronic\ncommunication methods\n2.2 Effective verbal communication methods\n3. Underpinning\nskills\n3.1 Organize information\n3.2 Understand and convey intended meaning\n3.3 Participate in variety of workplace discussions\n3.4 Comply with organization requirements for the use of written\nand electronic communication methods\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Variety of Information\n4.2 Communication tools\n4.3 Simulated workplace\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Competency in this unit must be assessed through\n5.2 Direct Observation\n5.3 Interview\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 7 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 5\n\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\nUNIT CODE\n :"
        },
        "source_text": "500311109\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills, and attitudes required\nto lead in the dissemination and discussion of ideas,\ninformation, and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace\nprocesses\n1.1 Appropriate communication method is selected\n1.2 Multiple operations involving several topics areas are\ncommunicated accordingly\n1.3 Questions are used to gain extra information\n1.4 Correct sources of information are identified\n1.5 Information is selected and organized correctly\n1.6 Verbal and written reporting is undertaken when required\n1.7 Communication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1 Response to workplace issues are sought\n2.2 Response to workplace issues are provided immediately\n2.3 Constructive contributions are made to workplace discussions\non such issues as production, quality and safety\n2.4 Goals/objectives and action plan undertaken in the workplace\nare communicated\n3. Identify and\ncommunicate\nissues arising in\nthe workplace\n3.1 Issues and problems are identified as they arise\n3.2 Information regarding problems and issues are organized\ncoherently to ensure clear and effective communication\n3.3 Dialogue is initiated with appropriate personnel\n3.4 Communication problems and issues are raised as they arise\n\n--- PDF PAGE 5 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\n--- PDF PAGE 6 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 4\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Dealt with a range of communication/information at one time\n1.2 Made constructive contributions in workplace issues\n1.3 Sought workplace issues effectively\n1.4 Responded to workplace issues promptly\n1.5 Presented information clearly and effectively written form\n1.6 Used appropriate sources of information\n1.7 Asked appropriate questions\n1.8 Provided accurate information\n2. Underpinning\nknowledge and\nattitude\n2.1 Organization requirements for written and electronic\ncommunication methods\n2.2 Effective verbal communication methods\n3. Underpinning\nskills\n3.1 Organize information\n3.2 Understand and convey intended meaning\n3.3 Participate in variety of workplace discussions\n3.4 Comply with organization requirements for the use of written\nand electronic communication methods\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Variety of Information\n4.2 Communication tools\n4.3 Simulated workplace\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Competency in this unit must be assessed through\n5.2 Direct Observation\n5.3 Interview\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 7 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 5\n\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\nUNIT CODE\n :"
