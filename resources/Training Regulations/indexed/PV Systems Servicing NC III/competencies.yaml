        "source_title": "LEAD SMALL TEAMS",
        "source_text": "--- PDF PAGE 7 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV Systems Servicing NC III \n \n \n \n                                         Page 5  \n \n \n       \n \n \n \n \n \n \nUNIT OF COMPETENCY \n:    LEAD SMALL TEAMS \nUNIT CODE \n         :    500311110 \nUNIT DESCRIPTOR             :   This unit covers the knowledge, skills and attitudes to lead \nsmall teams including setting and maintaining team and \nindividual performance standards. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Provide team \nleadership \n1.1 Work requirements are identified and presented to team \nmembers \n1.2 Reasons for instructions and requirements are \ncommunicated to team members \n1.3 Team members’ queries and concerns are recognized, \ndiscussed and dealt with\n2. Assign responsibilities 2.1 Duties,  and responsibilities are allocated having regard to \nthe skills, knowledge and aptitude required to properly \nundertake the assigned  task and according to company \npolicy \n2.2 Duties are allocated having regard to individual preference, \ndomestic and personal considerations, whenever possible \n3. Set performance \nexpectations for team \nmembers \n3.1 Performance expectations are established based on client \nneeds and according to assignment requirements \n3.2 Performance expectations are based on individual team \nmembers duties and area of responsibility \n3.3 Performance expectations are discussed and disseminated \nto individual team members\n4. Supervised team \nperformance \n4.1 Monitoring of performance takes place against defined \nperformance criteria and/or assignment instructions and \ncorrective action taken if required \n4.2 Team members are provided with feedback, positive \nsupport and advice on strategies to overcome any \ndeficiencies \n4.3 Performance issues which cannot be rectified or addressed \nwithin the team are referenced to appropriate personnel \naccording to employer policy \n4.4 Team members are kept informed of any changes in the \npriority allocated to assignments or tasks which might impact \non client/customer needs and satisfaction \n4.5 Team operations are monitored to ensure that \nemployer/client needs and requirements are met \n4.6 Follow-up communication is provided on all issues affecting \nthe team \n4.7 All relevant documentation is completed in accordance with \ncompany procedures\n\n--- PDF PAGE 8 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV Systems Servicing NC III \n \n \n \n                                         Page 6  \n \n \n       \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work requirements \n1.1 Client Profile \n1.2 Assignment instructions \n2. Team member’s concerns \n2.1 Roster/shift details \n3. Monitor performance \n3.1 Formal process \n3.2 Informal process \n4. Feedback \n4.1 Formal process \n4.2 Informal process \n5. Performance issues \n5.1 Work output \n5.2 Work quality \n5.3 Team participation \n5.4 Compliance with workplace protocols \n5.5 Safety \n5.6 Customer service\n\n--- PDF PAGE 9 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV Systems Servicing NC III \n \n \n \n                                         Page 7  \n \n \n       \n \n \n \n \n \n \n \nEVIDENCE GUIDE \n1.  Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate: \n1.1 Maintained or improved individuals and/or team performance \ngiven a variety of possible scenario \n1.2 Assessed and monitored team and individual performance \nagainst set criteria \n1.3 Represented concerns of a team and individual to next level of \nmanagement or appropriate specialist and to negotiate on their \nbehalf \n1.4 Allocated duties and responsibilities, having regard to   \nindividual’s knowledge, skills and aptitude and the needs of the \ntasks to be performed \n1.5 Set and communicated performance expectations for a range \nof tasks and duties within the team and provided feedback to \nteam members \n \n2. Underpinning \nKnowledge \n2.1 \nCompany policies and procedures \n2.2 \nRelevant legal requirements \n2.3 \nHow performance expectations are set \n2.4 \nMethods of Monitoring Performance \n2.5 \nClient expectations \n2.6 \nTeam member’s duties and responsibilities \n3. Underpinning skills\n3.1 \nCommunication skills required for leading teams \n3.2 \nInformal performance counseling skills \n3.3 \nTeam building skills \n3.4 \nNegotiating skills \n \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n4.2 \nMaterials relevant to the proposed activity or task \n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDirect observations of work activities of the individual member \nin relation to the work activities of the group \n5.2 \nObservation of simulation and/or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n5.3 \nCase studies and scenarios as a basis for discussion of    \nissues and strategies in teamwork \n \n6. Context of \nassessment \n6.1 \nCompetency assessment may occur in workplace or any \nappropriately simulated environment \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in-group\n",
