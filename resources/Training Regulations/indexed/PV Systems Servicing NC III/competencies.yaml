        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate \nperformed: \n1.1 Diagnosed PV system \n1.2 Prepared troubleshooting activities \n1.3 Verified customer’s complaints \n1.4 Prepared troubleshooting checklist form \n1.5 Prepared maintenance procedure \n1.6 Prepared tools, measuring instrument, spare parts, and \nsupplies \n2. Underpinning knowledge \nand attitude \n2.1 PV Technology and Systems \n2.2 Interpretation of system problem \n2.3 Diagnostic procedures \n2.4 Isolation technique procedure \n2.5 Philippine Electrical Codes and standards \n2.6 Schematic diagrams \n2.7 Knowledge of tools, measuring instrument, spare \nparts, and supplies \n2.8 Tracing circuit \n2.9 Awareness of PPE \n2.10 Observant/Attentive to details \n2.11 Patient \n2.12 Honest \n2.13 Courteous \n3. Underpinning skills \n3.1 Execution of diagnostic procedures \n3.2 Ability to perform isolation technique \n3.3 Application of codes and standards \n3.4 Reading and interpretation of codes, circuit schematic \ndiagrams, symbols, and notations \n3.5 Ability to trace circuits \n3.6 Proficiency in usage of tools, measuring instruments, \nspare parts, and supplies \n3.7 Use of personal protective equipment \n3.8 Economical \n3.9 Interpersonal skills \n3.10 Communication skills \n4. Resource implications \nThe following resources must be provided: \n4.1 Manuals, procedures and codes \n4.2 Manufacturer’s specifications \n4.3 Tools, measuring instruments, and spare parts \n4.4 Supplies and materials  \n4.5 Personal protective equipment (PPE) \n4.6 Forms\n\n--- PDF PAGE 42 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV Systems Servicing NC III \n \n \n \n                                         Page 40  \n \n \n       \n \n \n \n \n \n \n5. Method of assessment \nCompetency must be assessed through: \n5.1 Observation and demonstration with questioning \n5.2 Portfolio \n5.3 Written exams\n6. Context  of assessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated workplace \n6.2 Competency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines",
