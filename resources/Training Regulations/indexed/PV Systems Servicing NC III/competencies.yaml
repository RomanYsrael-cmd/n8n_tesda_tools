        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Repaired/replaced PV components as per manufacturer\noperation's operation/repair manual\n1.2 Tested PV system operation according to manufacturer's\noperation/repair manual and standard operating procedures\n(SOP)\n1.3 Recorded and completed maintenance/service repair/report in\naccordance with standard operating procedures\n1.4 Demonstrated compliance with safety regulations applicable to\nworksite operations\n2. Underpinning knowledge\nand attitude\n2.1 Safety practices\n2.1.1 Personal protective equipment (PPE)\n2.1.2 Safe handling of tools and supplies/materials\n2.1.3 Safety signs and symbols\n2.1.4 Safety hazard\n2.1.5 Housekeeping\n2.2 Maintenance, Service, and Repair\n2.2.1 Preventive Maintenance\n2.3 Process Procedure\n2.3.1 Electrical control procedure\n2.3.2 Repair/replace assemble charge controller/regulator\nprocedure\n2.3.3 Repair/replace defective lamp procedure\n2.3.4 Replace diode/fuse procedure\n2.3.5 Repair/replace switch, receptacle wires, convenience\noutlet procedure\n2.3.6 Maintain/replace battery\n2.3.7 Electrical testing procedure\n2.3.8 Sort, Straighten, Shine, Systemize and Sustain (5S)\nprocedure\n2.3.9 Safety process and procedure\n2.3.10 Maintenance procedure\n2.3.11 Troubleshooting knowledge\n2.3.12 Patient\n2.3.13 Honest\n2.3.14 Attentive/observant\n2.3.15 Frugal\n3. Underpinning skills\n3.1 Reading and interpreting schematic diagrams, specifications\nand manuals\n3.2 Preparing materials/tools/supplies\n3.3 Proper use of electrical measuring instruments and\nmaterials/supplies\n3.4 Electronic test skills\n3.5 Troubleshooting technique\n3.6 Repairing/replacing defective parts and accessories\n3.7 Preparing reports\n\n--- PDF PAGE 47 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 45\n\n3.8 Communication skills\n3.9 Interpersonal skills\n3.10 Electricity/electronics background\n3.11 Installing PV components and accessories\n3.12 Electronic testing/calibrating skills\n3.13 Battery calibration/maintenance\n4. Resource implications\nThe following resources must be provided:\n4.1 Work place or site location\n4.2 Materials, tools, and supplies appropriate to repairing\nprocesses\n4.3 Schematic drawing diagrams and specifications relevant to\nthe task\n4.4 Personal protective equipment (PPE)\n4.5 Manuals, procedures and codes\n4.6 Manufacturer’s specifications\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Demonstration and observation with questioning\n5.2 Interview/oral questioning\n5.3 Third party report\n5.4 Portfolio\n6. Context of assessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace\n6.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 48 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 46\n\nUNIT OF COMPETENCY\n:\nMONITOR PV SYSTEM OPERATION\n\nUNIT CODE\n\n:"
