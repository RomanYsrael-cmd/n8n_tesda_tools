  "source_section_text": "SECTION 2:\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, and core units\nof competency required for PV SYSTEMS SERVICING NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311109\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills, and attitudes required\nto lead in the dissemination and discussion of ideas,\ninformation, and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace\nprocesses\n1.1 Appropriate communication method is selected\n1.2 Multiple operations involving several topics areas are\ncommunicated accordingly\n1.3 Questions are used to gain extra information\n1.4 Correct sources of information are identified\n1.5 Information is selected and organized correctly\n1.6 Verbal and written reporting is undertaken when required\n1.7 Communication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1 Response to workplace issues are sought\n2.2 Response to workplace issues are provided immediately\n2.3 Constructive contributions are made to workplace discussions\non such issues as production, quality and safety\n2.4 Goals/objectives and action plan undertaken in the workplace\nare communicated\n3. Identify and\ncommunicate\nissues arising in\nthe workplace\n3.1 Issues and problems are identified as they arise\n3.2 Information regarding problems and issues are organized\ncoherently to ensure clear and effective communication\n3.3 Dialogue is initiated with appropriate personnel\n3.4 Communication problems and issues are raised as they arise\n\n--- PDF PAGE 5 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\n--- PDF PAGE 6 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 4\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Dealt with a range of communication/information at one time\n1.2 Made constructive contributions in workplace issues\n1.3 Sought workplace issues effectively\n1.4 Responded to workplace issues promptly\n1.5 Presented information clearly and effectively written form\n1.6 Used appropriate sources of information\n1.7 Asked appropriate questions\n1.8 Provided accurate information\n2. Underpinning\nknowledge and\nattitude\n2.1 Organization requirements for written and electronic\ncommunication methods\n2.2 Effective verbal communication methods\n3. Underpinning\nskills\n3.1 Organize information\n3.2 Understand and convey intended meaning\n3.3 Participate in variety of workplace discussions\n3.4 Comply with organization requirements for the use of written\nand electronic communication methods\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Variety of Information\n4.2 Communication tools\n4.3 Simulated workplace\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Competency in this unit must be assessed through\n5.2 Direct Observation\n5.3 Interview\n6. Context of\nassessment\n6.1 Competency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 7 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 5\n\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\nUNIT CODE\n : 500311110\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1 Work requirements are identified and presented to team\nmembers\n1.2 Reasons for instructions and requirements are\ncommunicated to team members\n1.3 Team members’ queries and concerns are recognized,\ndiscussed and dealt with\n2. Assign responsibilities 2.1 Duties, and responsibilities are allocated having regard to\nthe skills, knowledge and aptitude required to properly\nundertake the assigned task and according to company\npolicy\n2.2 Duties are allocated having regard to individual preference,\ndomestic and personal considerations, whenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1 Performance expectations are established based on client\nneeds and according to assignment requirements\n3.2 Performance expectations are based on individual team\nmembers duties and area of responsibility\n3.3 Performance expectations are discussed and disseminated\nto individual team members\n4. Supervised team\nperformance\n4.1 Monitoring of performance takes place against defined\nperformance criteria and/or assignment instructions and\ncorrective action taken if required\n4.2 Team members are provided with feedback, positive\nsupport and advice on strategies to overcome any\ndeficiencies\n4.3 Performance issues which cannot be rectified or addressed\nwithin the team are referenced to appropriate personnel\naccording to employer policy\n4.4 Team members are kept informed of any changes in the\npriority allocated to assignments or tasks which might impact\non client/customer needs and satisfaction\n4.5 Team operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6 Follow-up communication is provided on all issues affecting\nthe team\n4.7 All relevant documentation is completed in accordance with\ncompany procedures\n\n--- PDF PAGE 8 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 6\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1 Client Profile\n1.2 Assignment instructions\n2. Team member’s concerns\n2.1 Roster/shift details\n3. Monitor performance\n3.1 Formal process\n3.2 Informal process\n4. Feedback\n4.1 Formal process\n4.2 Informal process\n5. Performance issues\n5.1 Work output\n5.2 Work quality\n5.3 Team participation\n5.4 Compliance with workplace protocols\n5.5 Safety\n5.6 Customer service\n\n--- PDF PAGE 9 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 7\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Maintained or improved individuals and/or team performance\ngiven a variety of possible scenario\n1.2 Assessed and monitored team and individual performance\nagainst set criteria\n1.3 Represented concerns of a team and individual to next level of\nmanagement or appropriate specialist and to negotiate on their\nbehalf\n1.4 Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs of the\ntasks to be performed\n1.5 Set and communicated performance expectations for a range\nof tasks and duties within the team and provided feedback to\nteam members\n\n2. Underpinning\nKnowledge\n2.1\nCompany policies and procedures\n2.2\nRelevant legal requirements\n2.3\nHow performance expectations are set\n2.4\nMethods of Monitoring Performance\n2.5\nClient expectations\n2.6\nTeam member’s duties and responsibilities\n3. Underpinning skills\n3.1\nCommunication skills required for leading teams\n3.2\nInformal performance counseling skills\n3.3\nTeam building skills\n3.4\nNegotiating skills\n\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or task\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual member\nin relation to the work activities of the group\n5.2\nObservation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n\n6. Context of\nassessment\n6.1\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 10 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 8\n\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge, and attitudes required\nto collect information in order to negotiate to a desired\noutcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan negotiations\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\nInformation on preparing for negotiation is identified and\nincluded in the plan\nInformation on creating non verbal environments for\npositive negotiating is identified and included in the plan\nInformation on active listening is identified and included in\nthe plan\nInformation on different questioning techniques is\nidentified and included in the plan\nInformation is checked to ensure it is correct and up-to-\ndate\n2. Participate in\nnegotiations\n2.1\n\n2.2\n2.3\n\n2.4\n2.5\n\n2.6\n\nCriteria for successful outcome are agreed upon by all\nparties\nDesired outcome of all parties are considered\nAppropriate language is used throughout the negotiation\nA variety of questioning techniques are used\nThe issues and processes are documented and agreed\nupon by all parties\nPossible solutions are discussed and their viability\nassessed\nAreas for agreement are confirmed and recorded\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 11 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 9\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\nAnalytic skills\n1.6.1 observing differences between content and\nprocess\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for\nresolving conflict\n2. Non verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 12 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 10\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors influencing\nnegotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to achieve\nan agreed outcome\n2. Underpinning\nknowledge and\nattitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies procedures\n2.4 Problem solving strategies on how to deal with unexpected\nquestions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning\nskills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation process\n4.2 Human resources (negotiators)\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context of\nassessment\n6.1 Competency to be assessed in real work environment or in a\nsimulated workplace setting.\n\n--- PDF PAGE 13 ---\n-----------------------------------------------------