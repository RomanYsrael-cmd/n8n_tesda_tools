        "source_title": "PERFORM PV SYSTEM DIAGNOSIS",
        "source_text": "--- PDF PAGE 38 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV Systems Servicing NC III \n \n \n \n                                         Page 36  \n \n \n       \n \n \n \n \n \n \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY :  \nPERFORM PV SYSTEM DIAGNOSIS  \n \nUNIT CODE  \n \n:  \nCON724329 \n \nUNIT DESCRIPTOR \n:   \nThis unit covers the skills, knowledge and attitude in  \ndiagnosis of perceived system trouble(s) based on  \ncustomer complaint. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Prepare for \ntroubleshooting activities \n1.1 Sequence of troubleshooting activities outlined in \naccordance with the maintenance manual and customer \ncomplaint   \n1.2 Tools, measuring instruments, and materials are \nselected in accordance with job order requirements \n1.3 Personal protective equipment is prepared in line \nwith job order requirement \n2. Verify customer’s \ncomplaint \n2.1 Customer interviewed based on Troubleshooting \nChecklist \n2.2 System components are checked using isolation \ntechnique based on maintenance procedures \n2.3 Task is performed without causing damage to the \ncomponents, tools, or equipment and injury to self and \nothers.\n\n--- PDF PAGE 39 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV Systems Servicing NC III \n \n \n \n                                         Page 37  \n \n \n       \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools, measuring \ninstruments, and \nmaterials \n \n1.2 Tools: \n1.1.1    Screwdrivers \n1.1.2 Pliers \n1.1.3 Wrenches \n1.1.4 Hammer \n1.1.5 Electrician’s knife \n1.1.6 Steel brush \n1.1.7 Paint brush  \n1.1.8 Ladder/scaffolding \n1.1.9 Magnetic compass \n1.1.10 Spirit level \n1.2 Measuring instruments \n1.2.1 Clamp meter \n1.2.2 Ammeter \n1.2.3 Voltmeter \n1.2.4 Multimeter \n1.2.5 Hydrometer \n1.2 Materials \n1.1 \nWires and cables \n1.2 \nConnectors \n1.3 \nClamps \n1.4\nElectrical tape\n2. Personal Protective \nEquipment \n2.1 Mask \n2.2 Safety Goggles or face shield \n2.3 Gloves (rubber/leather) \n2.4 Folding Ladder \n2.5 Safety harness \n2.6 First aid kit \n2.7 Hard hat \n2.8 Safety shoes \n2.9 Apron Leather \n2.10 Safety belts \n2.11 Electrician holster kit \n3. Troubleshooting \nChecklist \nTroubleshooting checklist forms include: \n3.1 Mode of failure \n3.2 Total Shutdown \n3.3 Decreased Capacity \n3.4 Intermittent Power \n3.5 No Output \n3.6 Time of failure and frequency  \n3.7 When was the last Maintenance procedure conducted  \n3.8 Activities/Usage prior to failure \n3.9 Significant events prior to breakdown \n3.10 Lightning Storm \n3.11 Long rainy days \n3.12Cloudy days\n\n--- PDF PAGE 40 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV Systems Servicing NC III \n \n \n \n                                         Page 38  \n \n \n       \n \n \n \n \n \n \nVARIABLE\nRANGE\n4. System \n \n \n4.1 DC Only \n4.2 AC/DC \n4.3 AC Only \n5. Maintenance procedure \n \n5.1 Refilling of Electrolyte \n5.2 Cleaning of Battery terminal \n5.3 Clearing of PV module \n5.4 Cleaning of check boxes and raceways \n5.5 Cleaning of wires/cables \n5.6 Check and cleaning of lighting fixtures and accessories \n5.7 Checking fastening fixtures \n5.8 Checking and cleaning other photovoltaic system \ncomponents \n6. Components \n6.1 Grounding system \n6.2 Mounting structure \n6.3 PV module/array \n6.4 Battery/battery banks \n6.5 Charge controller/regulator \n6.6 Inverter  \n6.7 Wires/cables and accessories \n6.8 Lighting fixtures and accessories  \n6.9 Other electrical loads\n\n--- PDF PAGE 41 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV Systems Servicing NC III \n \n \n \n                                         Page 39  \n \n \n       \n \n \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate \nperformed: \n1.1 Diagnosed PV system \n1.2 Prepared troubleshooting activities \n1.3 Verified customer’s complaints \n1.4 Prepared troubleshooting checklist form \n1.5 Prepared maintenance procedure \n1.6 Prepared tools, measuring instrument, spare parts, and \nsupplies \n2. Underpinning knowledge \nand attitude \n2.1 PV Technology and Systems \n2.2 Interpretation of system problem \n2.3 Diagnostic procedures \n2.4 Isolation technique procedure \n2.5 Philippine Electrical Codes and standards \n2.6 Schematic diagrams \n2.7 Knowledge of tools, measuring instrument, spare \nparts, and supplies \n2.8 Tracing circuit \n2.9 Awareness of PPE \n2.10 Observant/Attentive to details \n2.11 Patient \n2.12 Honest \n2.13 Courteous \n3. Underpinning skills \n3.1 Execution of diagnostic procedures \n3.2 Ability to perform isolation technique \n3.3 Application of codes and standards \n3.4 Reading and interpretation of codes, circuit schematic \ndiagrams, symbols, and notations \n3.5 Ability to trace circuits \n3.6 Proficiency in usage of tools, measuring instruments, \nspare parts, and supplies \n3.7 Use of personal protective equipment \n3.8 Economical \n3.9 Interpersonal skills \n3.10 Communication skills \n4. Resource implications \nThe following resources must be provided: \n4.1 Manuals, procedures and codes \n4.2 Manufacturer’s specifications \n4.3 Tools, measuring instruments, and spare parts \n4.4 Supplies and materials  \n4.5 Personal protective equipment (PPE) \n4.6 Forms\n\n--- PDF PAGE 42 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTR – PV Systems Servicing NC III \n \n \n \n                                         Page 40  \n \n \n       \n \n \n \n \n \n \n5. Method of assessment \nCompetency must be assessed through: \n5.1 Observation and demonstration with questioning \n5.2 Portfolio \n5.3 Written exams\n6. Context  of assessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated workplace \n6.2 Competency assessment must be undertaken in \naccordance with the endorsed TESDA assessment \nguidelines\n",
