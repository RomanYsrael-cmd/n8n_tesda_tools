ning skills\n3.1 Reading and interpreting schematic diagrams, specifications\nand manuals\n3.2 Preparing materials/tools/supplies\n3.3 Proper use of electrical measuring instruments and\nmaterials/supplies\n3.4 Electronic test skills\n3.5 Troubleshooting technique\n3.6 Repairing/replacing defective parts and accessories\n3.7 Preparing reports\n\n--- PDF PAGE 47 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 45\n\n3.8 Communication skills\n3.9 Interpersonal skills\n3.10 Electricity/electronics background\n3.11 Installing PV components and accessories\n3.12 Electronic testing/calibrating skills\n3.13 Battery calibration/maintenance\n4. Resource implications\nThe following resources must be provided:\n4.1 Work place or site location\n4.2 Materials, tools, and supplies appropriate to repairing\nprocesses\n4.3 Schematic drawing diagrams and specifications relevant to\nthe task\n4.4 Personal protective equipment (PPE)\n4.5 Manuals, procedures and codes\n4.6 Manufacturer’s specifications\n5. Method of assessment\nCompetency must be assessed through:\n5.1 Demonstration and observation with questioning\n5.2 Interview/oral questioning\n5.3 Third party report\n5.4 Portfolio\n6. Context of assessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace\n6.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 48 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 46\n\nUNIT OF COMPETENCY\n:\nMONITOR PV SYSTEM OPERATION\n\nUNIT CODE\n\n:"
