    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: PV Systems Servicing\n\nNC Level: NC III\n\nNominal Training Duration:\n158 hours\n\n20 hrs – Basic Competencies\n\n72 hrs – Common Competencies\n\n66 hrs – Core Competencies\n\nCourse Description:\n\nThe course is designed to enhance the knowledge, skills and desirable attitudes of\na PV systems service technician to perform PV system maintenance, troubleshooting,\nand repair of small solar home systems up to 1kWp based on customer complaint in\naccordance with industry standards. Specifically, it covers core competencies such\nPerform PV System Diagnosis, Repair of PV System and Monitor PV System Operation.\nBasic competencies such as: Lead workplace communication; Lead small teams;\nDevelop and practice negotiation skills; Solve problems related to work activities; Use\nmathematical concepts and techniques and Use relevant technologies are included.\nIt also include common competencies such as; Prepare construction materials and\ntools; Perform mensuration and calculation; Maintain tools and equipment; Observe\nprocedures, specifications and manuals of instructions and Interpret technical drawings\nand plans.\nBASIC COMPETENCIES\n20 hrs\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\ncommunication\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group discussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities\namong members.\n2.3 Set performance expectation\nfor team members.\n\n2.4Supervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Case studies\n• Demonstration\n• Written exam\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant information\nin planning negotiations\n3.2 Participate in negotiations\n3.3 Documen