  "source_text": "SECTION 4: NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of PV SYSTEMS SERVICING NC III, the\ncandidate must demonstrate in all the units listed in Section 1. Successful\ncandidates shall be awarded a National Certificate III signed by the TESDA\nDirector General.\n4.2\nThe qualification of PV SYSTEMS SERVICING NC III may be attained through\ndemonstration of competence through a single comprehensive project-type\nassessment covering all required units of competency of the qualification.\n\n4.2.1.\nService PV Systems\n• Perform PV System Diagnosis\n• Repair of PV System\n• Monitor PV System Operation\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1.\nGraduate of formal, non-formal, and informal including enterprise-\nbased training programs.\n\n4.4.2.\nExperienced workers (wage employed or self employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 58 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – PV Systems Servicing NC III\n\n Page 56\n\nLead workplace\ncommunication\nWork with\nothers\nWork in team\ni\nt\nLead small\nSolve problems\nrelated to work\nReceive and\nrespond to\nk l\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\n\nCOMMON\nCOMPETENCIES\nPrepare\nconstruction\nmaterials and\nObserve\nprocedures,\nspecifications\nInterpret\ntechnical\ndrawings and\nPerform\nmensuration\nand calculations\nMaintain tools\nand equipment\nCORE\n COMPETENCIES\nPerform Site\nAssessment\nCheck PV\nComponents\n/Materials\nCompliance\nSpecify\nComponents\nin Bill of\nMaterials\nInstall PV\nsystem\n\nPerform PV\nSystem Testing\nand\nCommissioning\nDetermine\nCustomer\nRequirements\n\ni\nt\n\nDesign\nCustomer\nRequirements\nCalculate\nSystem\nComponent\nRequirements\nelectrical system\nPerform PV\nSystem\nDiagnosis\nPrepare\nInstallation\nDrawings\n\nApply problem\nsolving\ntechniques to\nPlan and organize\nk\nRepair PV\nSystem\nMonitor PV\nSystem\nOperation\nPractice career\nDemonstrate\nwork values\nPractice occupational\nhealth and safety\nprocedures\nDevelop and\npractice\nnegotiation skills\nUse\nmathematical\nmethod\nUse relevant\ntechnologies\nUtilize\nspecialized\ncommunication\nkill\nDevelop team\nd i di id\nl\nCollect, analyze\nand organize\ninformation\nPromote\nenvironmental\nPractice basic\nhousekeeping\n\n"
