      "source_text": "136 Hours 80 Supervised Industry Learning (SIL) 216 TOTAL HOURS"
    },
    {
      "source_text": "Course Description:"
    },
    {
      "source_text": "This course is designed to provide the learner with knowledge, practical skills and attitude, applicable in performing work activities involved in applying safety practices, interpreting drawings and sketches, performing basic workshop measurements and computing industry calculations, contributing to Quality System, using hand tools, preparing weld materials and consumables, setting up welding equipment, preparing/fit up welding joints fit up weld materials, repairing welds and welding austenitic stainless steel plates using MMAW. This includes classroom learning activities and practical work in actual work site or simulation area."
    },
    {
      "source_text": "Upon completion of the course, the learners are expected to demonstrate the above- mentioned competencies to be employed. To obtain this, all units prescribed for this qualification must be achieved."
