      "source_text": "-- PDF PAGE 74 --- Manual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/142021) 70 SECTION 3 TRAINING ARRANGEMENTS"
    },
    {
      "source_text": "These standards are set to provide technical and vocational education and training (TVET) providers with information and other important requirements to consider when designing training programs for MANUAL METAL ARC WELDING (MMAW) NC III."
