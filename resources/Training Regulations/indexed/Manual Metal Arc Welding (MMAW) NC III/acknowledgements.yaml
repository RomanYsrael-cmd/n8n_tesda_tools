      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires evidence that the candidate: 1.1 Welded austenitic stainless steel plates in PC (2G) and PF (3G) positions to acceptable standard following the approved WPS. 1.2 Observed safety measures applicable to worksite operation 1.3 Communicated effectively with others to ensure effective work 1.4 Observed and complied with the productivity requirements 1.5 Complied with attitudinal work requirements"
    },
    {
      "source_text": "2. Resource implications The following resources must be provided: 2.1 Well ventilated work area/shop with appropriate welding machines, accessories, oven, tools, positioners, jigs and fixtures 2.2 Supplies and materials 2.3 PPE, 2.4 Relevant documentation such as WPS and working drawing 2.5 Fire Extinguishers 3. Method of assessment Competency must be assessed through: 3.1 Observation and interview 3.2 Demonstration and interview 3.3 Written test 3.4 Portfolio 3.5 Nondestructive (NDT) and/or Destructive testing(DT) of test coupon 4. Context of assessment 4.1 Competency to be assessed while a task is being undertaken in the workplace or in a simulated workplace setting or at the designated TESDA Accredited Assessment Center."
    },
