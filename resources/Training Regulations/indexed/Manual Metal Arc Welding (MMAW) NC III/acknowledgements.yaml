    },
    {
      "source_text": "VARIABLE RANGE 1. WPS WPS Requirements are the following: 1.1 Welding positions 1.1.1 PA(1F), PC(2F), PF(3F), PE(4F) 1.1.2 PA(1G), PC (2G), PF(3G) 1.2 Material thickness(s) 1.2.1 3≤s ‹12mm (plate) 1.3 Type of material 1.3.1 Austenitic Stainless Steel 1.4 Welding Electrodes (Type and Size) 1.5 Welding Parameters (Amperage, Polarity, Travel speed) 1.6 Joint preparation"
    },
    {
      "source_text": "2. Defects May include: 2.1 Porosity/Pinholes/Blowholes 2.2 Undercut 2.3 Arc Strike 2.4 Spatters 2.5 Slag inclusion 2.6 Concavity/convexity 2.7 Excessive reinforcement 2.8 Burn Through/ Melt Through 2.9 Crater cracks 2.10 Cracks 2.11 Lack of Fusion 2.12 Under Fill 2.13 Overlap 2.14 Misalignment 2.15 Distortion"
