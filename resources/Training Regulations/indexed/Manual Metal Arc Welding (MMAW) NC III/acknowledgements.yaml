    },
    {
      "source_text": "Austenitic Are classified in 200 and 300 series, with 16%-30% Stainless chromium and 2 % to 20% nickel for enhanced surfaced"
    },
    {
      "source_text": "quality, formability, increased corrosion and wear resistance."
    },
    {
      "source_text": "Austenitic stainless steels are non hardenable and non"
    },
    {
      "source_text": "magnetic."
    },
    {
      "source_text": "base metal (aka: parent metal) the metal that is to be worked, cut or welded"
    },
    {
      "source_text": "bead"
    },
    {
      "source_text": "a weld deposit resulting from a single welding pass"
    },
    {
      "source_text": "bend test A destructive testing method that calls for a test specimen taken from a test coupon to be bent to a specified bend radius. This test is used to evaluate the soundness and ductility of the welded joint"
    },
    {
      "source_text": "break test A destructive testing method in which a fillet weld test is loaded so that the weld root is in tension until it breaks. Once broken, soundness of the welded joint is evaluated by examining the fractured surface for incomplete fusion, porosity, and other internal discontinuities. This test is primarily used for welders qualification."
    },
    {
      "source_text": "discontinuity An interruption of the typical structure of a material, such as lack of homogeneity in its mechanical, metallurgical or physical characteristics. A discontinuity is not necessarily a defect."
    },
    {
      "source_text": "destructive is undertaken in order to understand a specimen’s performance testing (DT) or material behavior. These procedures are carried out to the test specimen’s failure. DT methods are commonly used for materials characterization, fabrication validation, failure investigation, and can form a key part of engineering critical assessments."
    },
    {
      "source_text": "fillet weld A weld of approximately triangular cross section joining two surfaces approximately at right angles to each other in a lap joint, T-joint, or corner joint."
    },
    {
      "source_text": "jig (aka: Fixture) A device designed to hold and maintain parts in proper relation to each other. Jig and fixture have essentially the same meaning. They both function to facilitate assembly of parts and to hold a work piece assembly in proper alignment and position during handling and welding."
    },
    {
      "source_text": "joint The junction of members or the edges of the base metal that are"
    },
    {
      "source_text": "to be joined or have been joined by welding"
    },
    {
      "source_text": "-- PDF PAGE 119 --- Manual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/14/2021)"
    },
    {
      "source_text": "115"
    },
    {
      "source_text": "liquid A non-destructive testing method in which a penetrating agent is penetrant used to detect weld defects and other possible flaws in testing (PT) non-magnetic and non-porous material"
    },
    {
      "source_text": "MMAW (A.k.a SMAW) An arc welding process with an arc between a"
    },
    {
      "source_text": "covered electrode and the weld pool. The process is used with"
    },
    {
      "source_text": "shielding from the decomposition of the electrode covering,"
    },
    {
      "source_text": "without the application of pressure, and with filler metal from the"
    },
    {
      "source_text": "electrode."
    },
    {
      "source_text": "non-destructive is a testing and analysis technique used by the industry to testing (NDT) evaluate the properties of a material, component, structure or system for characteristic differences or welding defects and"
    },
    {
      "source_text": "discontinuities without causing damage to the original part."
    },
    {
      "source_text": "Occupational refers to a set of rules issued by DOLE which mandates Safety the adoption and use of appropriate practices, means, and Health methods, reasonably standards operations or processes, and (OSH) working conditions necessary to ensure safe and healthful employment."
    },
    {
      "source_text": "quiver (Aka:portable oven, hotbox) . A temperature controlled electrode container used during welding in order to maintain the required holding temperature after baking. This ensures electrode drynessbefore use and prevents moisture absorption in the flux covering due to humidity conditions"
    },
    {
      "source_text": "shearing are multipurpose devices used in the cutting of alloys and other"
    },
    {
