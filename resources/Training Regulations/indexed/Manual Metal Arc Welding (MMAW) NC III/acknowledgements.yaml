posed and\nimplemented\nchanges in the\nworkplace\nprocedures and\nsystems.\n3.4 Developing action\nplans for\ncontinuous\nimprovement on\nthe basic systems,\nprocesses and\nprocedures in the\norganization.\n\n--- PDF PAGE 28 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/142021) 24\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Reasons\nMay include:\n1.1 Strengths and weaknesses of the current systems,\nprocesses and procedures.\n1.2 Opportunities and threats of the current systems,\nprocesses and procedures.\n2. Models of innovation\nMay include:\n2.1 Seven habits of highly effective people.\n2.2 Five minds of the future concepts (Gardner, 2007).\n2.3 Neuroplasticity and adaptation strategies.\n3. Gaps or barriers\nMay include:\n3.1 Machine\n3.2 Manpower\n3.3 Methods\n3.4 Money\n4. Critical Inquiry\nMay include:\n4.1\nPreparation.\n4.2\nDiscussion.\n4.3\nClarification of goals.\n4.4\nNegotiate towards a Win-Win outcome.\n4.5\nAgreement.\n4.6\nImplementation of a course of action.\n4.7\nEffective verbal communication. See our pages:\nVerbal Communication and Effective Speaking.\n4.8\nListening.\n4.9\nReducing misunderstandings is a key part of effective\nnegotiation.\n4.10 Rapport Building.\n4.11 Problem Solving.\n4.12 Decision Making.\n4.13 Assertiveness.\n4.14 Dealing with Difficult Situations.\n\n--- PDF PAGE 29 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/142021) 25\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\nEstablished the reasons why innovative systems are required\nEstablished the goals of a new innovative system\nAnalyzed current organizational systems to identify gaps and\nbarriers to innovation.\nAssessed work procedures, processes and systems in terms of\ninnovative practices.\nGenerate practical action plans for improving work procedures, and\nprocesses.\nReviewed the trial innovative work system and adjusted reflect\nevaluation feedback, knowledge management systems and\nfuture planning.\nEvaluated the effectiveness of the proposed action plans.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nPens, papers and writing implements.\n2.2\nCartolina.\n2.3\nManila papers.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Psychological and behavioral Interviews.\n3.2\nPerformance Evaluation.\n3.3\nLife Narrative Inquiry.\n3.4\nReview of portfolios of evidence and third-party workplace\nreports of on-the-job performance.\n3.5\nSensitivity analysis.\n3.6\nOrganizational analysis.\n3.7\nStandardized assessment of character strengths and virtues\napplied.\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions.\n\n--- PDF PAGE 30 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/142021) 26\nUNIT OF COMPETENCY\n: USE INFORMATION SYSTEMATICALLY\n\nUNIT CODE : 400311324\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nto use technical information systems, apply information\ntechnology (IT) systems and edit, format & check\ninformation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Use technical\ninformation\n1.1. Information are\ncollated and\norganized into a\nsuitable form for\nreference and use\n1.2. Stored\ninformation are\nclassified so that\nit can be quickly\nidentified and\nretrieved when\nneeded\n1.3. Guidance are\nadvised and\noffered to people\nwho need to find\nand use\ninformation\n\n1.1. Application in\ncollating\ninformation\n1.2. Procedures for\ninputting,\nmaintaining and\narchiving\ninformation\n1.3. Guidance to\npeople who need\nto find and use\ninformation\n1.4. Organize\ninformation\n1.5. classify stored\ninformation for\nidentification and\nretrieval\n1.6. Operate the\ntechnical\ninformation 