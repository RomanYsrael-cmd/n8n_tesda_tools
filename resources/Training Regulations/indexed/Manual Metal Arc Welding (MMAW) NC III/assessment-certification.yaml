      "text": "NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence on all unit/s of competency in a qualification with a promulgated Training Regulations. 4.1.2 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency. 4.1.3 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations: It includes the following: a. Entry requirements for candidates b. Evidence gathering methods c. Qualification requirements of competency assessors d. Specific assessment and certification arrangements as identified by industry 4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work and/or life experiences may apply for recognition in a particular qualification through competency assessment: 4.1.5 For all Shielded Metal Arc Welding NC III holder, the individual/holder will have to undergo assessment in the amended TR for Manual Metal Arc Welding (MMAW) NC III. Manual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/14/2021) 111"
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior ` 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. Manual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/14/2021) 112"
