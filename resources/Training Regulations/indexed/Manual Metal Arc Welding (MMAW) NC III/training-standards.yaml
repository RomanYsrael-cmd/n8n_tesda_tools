monstration\nand oral\n• 4 Hours\n\n--- PDF PAGE 103 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/14/2021) 99\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\nstandards.\n\nquestioning/\nInterview\n• Written test\n• Nondestructive\nTesting (NDT)\nand/or\nDestructive\ntesting (DT) of\ntest coupon\n\n3.2 Perform multiple pass fillet\nwelds in different positions-\nPA(1F), PC(2F), PF(3F),\nPE(4F)\n\n• Explain and obtain\nmultiple pass fillet\nwelds in different\npositions in\naccordance to\nwelding codes and\nstandards\n•\nLecture-\nDiscussion\n•\nDemonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructiv\ne Testing (NDT)\nand/or\nDestructive\ntesting (DT) of\ntest coupon\n• 8 Hours\n\n3.3 Perform root passes on\ngroove/butt joints in different\nPositions - PA(1G), PC (2G),\nPF (3G)\n\n• Explain and obtain\nroot passes weld in\ndifferent positions in\naccordance to\nwelding codes and\nstandards.\n\n•\nLecture-\nDiscussion\n•\nDemonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructive\nTesting (NDT) of\ntest coupon\n• 8 Hours\n\n--- PDF PAGE 104 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/14/2021) 100\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.4 Perform subsequent fill passes\non groove/butt joint\n in different positions- PA(1G),\nPC (2G), PF (3G)\n\n• Explain and obtain\nsubsequent fill\npasses in different\npositions in\naccordance to\nwelding codes and\nstandards.\n\n• Lecture-\nDiscussion\n• Demonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstration\nand oral\nquestioning/\nInterview\n• Written test\n• Nondestructive\nTesting (NDT)\nof test coupon\n• 20 Hours\n\n3.5 Perform capping on groove/\nbutt joint in different positions-\nPA(1G), PC (2G), PF (3G)\n• Explain and obtain\ncapping in different\npositions in\naccordance to\nwelding codes and\nstandards.\n\n•\nLecture-\nDiscussion\n•\nDemonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstratio\nn and oral\nquestioning/\nInterview\n• Written test\n• Nondestructiv\ne Testing\n(NDT) of test\ncoupon\n• 10 Hours\n4. Perform final\nvisual\nInspection\n4.1 Perform final visual Inspection\nin all test coupon in different\npositions\n• Explain and obtain\nfinal visual\nInspection in\ndifferent positions in\naccordance to\nwelding codes and\nstandards.\n\n•\nLecture-\nDiscussion\n•\nDemonstration\n• Practical\n application\n\n• Observation\nand oral\nquestioning/\nInterview\n• Demonstratio\nn and oral\nquestioning/\nInterview\n• Written test\n• Nondestructiv\ne Testing\n• 2 hours\n\n--- PDF PAGE 105 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/14/2021) 101\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n(NDT) of test\ncoupon\n\n--- PDF PAGE 106 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/14/2021) 102",
