  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training (TVET)\nproviders with information and other important requirements to consider when designing\ntraining programs for MANUAL METAL ARC WELDING (MMAW) NC III.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\n Course Title: MANUAL METAL ARC WELDING (MMAW) NC Level NC III\n\nNominal Training Duration:\n40 Hours (Basic Competencies)\n40 Hours (Common Competencies)\n 56 Hours (Core Competencies)\n\n 136 Hours\n 80 Supervised Industry Learning (SIL)\n 216 TOTAL HOURS\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involved in applying safety practices,\ninterpreting drawings and sketches, performing basic workshop measurements and computing\nindustry calculations, contributing to Quality System, using hand tools, preparing weld\nmaterials and consumables, setting up welding equipment, preparing/fit up welding joints fit up\nweld materials, repairing welds and welding austenitic stainless steel plates using MMAW.\nThis includes classroom learning activities and practical work in actual work site or simulation\narea.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieved.\n\n--- PDF PAGE 75 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/14/2021) 71\n\nBASIC COMPETENCIES\n(40 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\n\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace processes\n\n• Read\no Effective verbal\ncommunication\nmethods\no Sources of\ninformation\n• Practice\norganizing\ninformation\n• Identify\norganization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n• Follow\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n• Perform exercises\non understanding\nand conveying\nintended meaning\nscenario\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Role Play\n• Written Test\n• Observation\n2 Hours\n\n--- PDF PAGE 76 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/14/2021) 72\n\nUnit of\nCompetency\nLearning Outcomes\n\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n1.2 Lead workplace discussions\n•\nDescribe:\no Organizational\npolicy on\nproduction, quality\nand safety\no Goals/ objectives\nand action plan\nsetting\n•\nRead\no Effective verbal\ncommunication\nmethods\n•\nPrepare/set action\nplans based on\norganizational\ngoals and\nobjectives\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n2 Hours\n\n1.3 Identify and communicate\nissues arising in the workplace\n•\nDescribe:\no Organizational\npolicy in dealing\nwith issues and\nproblems\n•\nRead\n•\nEffective verbal\ncommunication\nmethods\n• Group\ndiscussion\n• Lecture\n• Oral evaluation\n• Written Test\n2 Hours\n2. Lead small\nteams\n2.1 Provide team leadership\n\n•\nDiscussion of\nCompany policies\nand procedures\n•\nRead web pages\non situational\nleadership\n•\nRole play on\nsituational\nleadership\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Individual Work\n\n• Ro