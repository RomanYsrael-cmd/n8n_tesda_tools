        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Set up and install welding machine,\naccessories, welding positioners, jigs and\nfixtures within allotted time and in accordance\nwith OH&S rules and accessible and convenient\nlocation.\n1.2 Observed safety measures applicable to\nworksite operation\n1.3 Communicated effectively with others to ensure\neffective work\n1.4 Observed and complied with the productivity\nrequirements\n1.5 Complied with attitudinal work requirements\n2.Resource implications\nThe following resources must be provided:\n2.1 Well ventilated work area/shop with appropriate\nwelding, machines, accessories, positioners,\njigs and fixtures\n2.2 PPE\n3.Method of assessment\nCompetency must be assessed through:\n3.1 Observation/evaluation\n3.2 Oral questioning\n4.Context of assessment\n4.1 Competency to be assessed while a task is\nbeing undertaken in the workplace or in a\nsimulated workplace setting or at the designated\nTESDA Accredited Assessment Center.\n\n--- PDF PAGE 65 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/142021) 61\nUNIT TITLE\n: PREPARE / FIT UP WELDING JOINTS\n\nUNIT CODE\n:"
        },
        "source_text": "MEE721321\n\nDESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes in\npreparing equipment for welding.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.1 Set up welding\nmachine\n\n1.1 Selected welding\nmachine is prepared\nin accordance with job\nrequirements, welding\nprocedures and\nspecifications,\ndrawings, sketches\nand manufacturer’s\ninstructions.\n1.2 Welding machine is\nconnected to an\nindependent power\nsupply and set to the\npolarity required in\nthe welding\nprocedures /\nspecifications.\n1.3 Current is adjusted\nconsistent with job\nrequirements to\nproduce acceptable\nweld.\n1.4 Task is completed\nwithout causing\ndamage to the\nequipment, tools and\nmaterials and injury to\nself and others.\n1.5 Task is performed in\naccordance with\ncompany or industry\nrequirements and\nsafety procedure.\n1.6 Required output is\ncompleted as per\nWPS and verified by\nimmediate supervisor\n1.7 Safety requirements\nare complied as per\nwelding machine\nmanufacturers\nrecommendations\n1.1 Basic electricity\n1.2 Welding machine\nInstruction manual\n(including\nmaintenance,\nvalidation,\ncalibration)\n1.3 Arc welding\nProcesses\n1.4 Welding Procedure\nSpecification\n1.5 OSH Standards\n1.6 Work\n Instructions\n (written and\n verbal).\n1.7 Productivity work\nmeasurements\n1.8 Adherence to\nwork\nrequirements\n1.10 5S and Proper\nHousekeeping\n1.11 Waste\nSegregation/ 3R\n1.12 AWF-CWCS/\nISO 9606-1 /\nAWS D1.6 /\nASME IX.\n1.13 DOLE DO\n198s2018\npolicies on OSH\nas applicable\n1.14 DOH guidelines\non safety and\nhealth as\napplicable\n\n1.1 Setting-up of\nwelding\nmachines\n1.2Understanding\nand applying\nwelding\nprocedure\n1.3 Applying safety\nprocedures\n\n--- PDF PAGE 62 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/142021) 58\n2. Set up welding\naccessories\n2.1 Welding accessories\nare identified in\naccordance with job\nrequirements, welding\nprocedure\nspecifications,\ndrawings, sketches\nand manufacturer’s\ninstructions.\n2.2 Welding accessories\nare set up in\naccordance with job\nrequirements, welding\nprocedure\nspecifications and\nmanufacturer’s\ninstructions and safety\nrequirements.\n2.3 Task is performed in\naccordance with\ncompany or industry\nrequirements and\nsafety procedure\n2.4 Required output is\nverified correct by\nimmediate supervisor\n2.1 Identification of\nWelding\nAccessories\n2.2 Understanding\nWelding machine\nInstruction manual\n2.3 OSH Standards\n2.4 Work instructions\n(written and\nverbal).\n2.5 Productivity work\nmeasurements\n2.6 Adherence to work\nrequirements\n2.7 5S and Proper\nHousekeeping\n2.8 Waste Segregation/\n3R\n2.9 AWF-CWCS/ ISO\n9606-1 / AWS D1.6\n/ ASME IX.\n2.10 DOLE DO\n198s2018\npolicies on OSH\nas applicable\n2.11 DOH guidelines\non safety and\nhealth as\napplicable\n\n2.1Setting-up\n welding\n accessories\n2.2 Applying\nsafety\nprocedures\n3. Set up welding\npositioner, jigs\nand fixtures\n3.1 Braces, stiffeners,\nand other jigs are\nprovided and in\nconformity with job\nrequirements.\n3.2 Task is performed in\naccordance with\ncompany or industry\nrequirements and\nsafety procedure\n3.3 Required output is\nverified correct by\nimmediate supervisor\n\n3.1 Understanding\ndrawing and\nsketches\n3.2 Familiarity in\ndifferent\npositioners, jigs\nand fixtures\n3.3 OSH Standards\n3.4 Work instructions\n(written and\nverbal).\n3.5 Productivity work\nmeasurements\n3.6 Adherence to work\nrequirements\n3.7 5S and Proper\nHousekeeping\n3.8 Waste\nSegregation/ 3R\n3.9 AWF-CWCS/ ISO\n9606-1 / AWS\nD1.6 / ASME IX.\n3.10 DOLE DO\n198s2018\npolicies on OSH\nas applicable\n3.11 DOH guidelines\n3.1 Installation of\npositioners, jigs\nand fixtures\n3.2 Applying safety\n procedures\n\n--- PDF PAGE 63 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/142021) 59\non safety and\nhealth as\napplicable\n\n--- PDF PAGE 64 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/142021) 60\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n1. Welding machine\n\nDifferent types of power sources used in MMAW/SMAW\nprocess:\n1.1 Rectifier\n1.2 Transformer\n1.3 Transformer – Rectifier\n1.4 Generator\n1.5 Inverter\n2. Welding Polarity\nDifferent types of polarity may be used:\n2.1 Direct Current /Electrode DCEN)\n2.2 Direct Current / Electrode DCEP)\n2.3 Alternating Current (AC)\n3. Accessories\n3.1 Welding cables\n3.2 Electrode holders\n3.3 Return clamps\n3.4 Male and female connectors\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Set up and install welding machine,\naccessories, welding positioners, jigs and\nfixtures within allotted time and in accordance\nwith OH&S rules and accessible and convenient\nlocation.\n1.2 Observed safety measures applicable to\nworksite operation\n1.3 Communicated effectively with others to ensure\neffective work\n1.4 Observed and complied with the productivity\nrequirements\n1.5 Complied with attitudinal work requirements\n2.Resource implications\nThe following resources must be provided:\n2.1 Well ventilated work area/shop with appropriate\nwelding, machines, accessories, positioners,\njigs and fixtures\n2.2 PPE\n3.Method of assessment\nCompetency must be assessed through:\n3.1 Observation/evaluation\n3.2 Oral questioning\n4.Context of assessment\n4.1 Competency to be assessed while a task is\nbeing undertaken in the workplace or in a\nsimulated workplace setting or at the designated\nTESDA Accredited Assessment Center.\n\n--- PDF PAGE 65 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/142021) 61\nUNIT TITLE\n: PREPARE / FIT UP WELDING JOINTS\n\nUNIT CODE\n:"
