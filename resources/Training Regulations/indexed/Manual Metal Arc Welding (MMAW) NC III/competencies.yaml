        "source_text": "--- PDF PAGE 39 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321               Promulgated  (9/142021)                       35  \n \nUNIT OF COMPETENCY \n: EVALUATE ENVIRONMENTAL WORK PRACTICES  \n \nUNIT CODE \n: 400311326 \n \nUNIT DESCRIPTOR \n \n: \n \nThis unit covers the knowledge, skills and attitude to interpret \nenvironmental \nIssues, \nestablish \ntargets \nto \nevaluate \nenvironmental practices and evaluate effectiveness of \nenvironmental practices \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Interpret \nenvironmental \npractices, \npolicies and \nprocedures \n1.1 Environmental work \npractices issues are \nidentified relevant to \nwork requirements \n1.2 Environmental \nStandards and \nProcedures nature of \nwork are determined \nbased on Applicability to \nnature of work  \n1.3 Gaps in work practices \nrelated to Environmental \nStandards and \nProcedures are \nidentified \n \n1.1 Environmental \nIssues  \n1.2 Environmental \nWork Procedures \n1.3 Environmental \nLaws \n1.4 Environmental \nHazardous and \nNon-Hazardous \nMaterials \n1.5 Environmental \nrequired license, \nregistration or \ncertification \n1.1.  Analyzing \nEnvironmental \nIssues and \nConcerns \n1.2. Critical thinking \n1.3. Problem Solving \n1.4. Observation Skills \n \n2. Establish \ntargets to \nevaluate \nenvironmental \npractices \n \n \n2.1. Relevant information are \ngathered necessary to \ndetermine environmental \nwork targets \n2.2. Environmental \nIndicators based on \ngathered information are \nset to measure \nenvironmental work \ntargets \n2.3. Indicators are verified \nwith appropriate \npersonnel \n2.1. Environmental  \nIndicators \n2.2. Relevant \nEnvironment \nPersonnel or \nexpert \n2.3. Relevant \nEnvironmental \nTrainings and \nSeminars \n2.1. Investigative \nSkills \n2.2. Critical thinking \n2.3.  Problem Solving \n2.4. Observation Skills\n\n--- PDF PAGE 40 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321               Promulgated  (9/142021)                       36  \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Evaluate \neffectiveness \nof \nenvironmental \npractices \n3.1. Work environmental \npractices are recorded \nbased on workplace \nstandards \n3.2. Recorded work \nenvironmental practices \nare compared against \nplanned indicators \n3.3. Findings regarding \neffectiveness are \nassessed and gaps \nidentified are \nimplemented based on \nenvironment work \nstandards and \nprocedures \n3.4. Results of environmental \nassessment are \nconveyed to appropriate \npersonnel \n \n3.1 Environmental \nPractices \n3.2 Environmental \nStandards and \nProcedures \n3.1 Documentation and \nRecord Keeping \nSkills \n3.2 Critical thinking \n3.3 Problem Solving \n3.4 Observation Skills\n\n--- PDF PAGE 41 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321               Promulgated  (9/142021)                       37  \nRANGE OF VARIABLES \n \nVARIABLE \nR A N G E \n1. Environmental \nPractices \nIssues \nMay include: \n1.1 \nWater Quality  \n1.2 \nNational and Local Government Issues \n1.3 \nSafety \n1.4 \nEndangered Species \n1.5 \nNoise \n1.6 \nAir Quality \n1.7 \nHistoric \n1.8 \nWaste \n1.9 \nCultural \n2. Environmental Indicators \nMay include: \n2.1 \nNoise level \n2.2 \nLighting (Lumens) \n2.3 \nAir Quality - Toxicity \n2.4 \nThermal Comfort \n2.5 \nVibration \n2.6 \nRadiation  \n2.7 \nQuantity of the Resources \n2.8 \nVolume\n\n--- PDF PAGE 42 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321               Promulgated  (9/142021)                       38  \nEVIDENCE GUIDE \n \n1. Critical aspects of  \n      Competency  \nAssessment requires evidence that the candidate: \n1.1. Identified environmental issues relevant to work \nrequirements \n1.2. Identified gaps in work practices related to Environmental \nStandards and Procedures \n1.3. Gathered relevant information necessary to determine \nenvironmental work targets \n1.4. Set environmental indicators based on gathered \ninformation to measure environmental work targets \n1.5. Recorded work environmental practices are recorded \nbased on workplace standards \n1.6. Conveyed results of environmental assessment to \nappropriate personnel \n2.  Resource   Implications The following resources should be provided: \n2.1  Workplace/Assessment location \n2.2  Legislation, policies, procedures, protocols and local \nordinances relating to environmental protection \n2.3  Case studies/scenarios relating to environmental protection \n3.  Methods of Assessment Competency in this unit may be assessed through: \n3.1  Written/ Oral Examination \n3.2  Interview/Third Party Reports \n3.3  Portfolio (citations/awards from GOs and NGOs, certificate  \n       of  training – local and abroad) \n 3.4  Simulations and role-plays \n4.  Context for Assessment 4.1  Competency may be assessed in actual workplace or  \n at the designated TESDA center.\n",
