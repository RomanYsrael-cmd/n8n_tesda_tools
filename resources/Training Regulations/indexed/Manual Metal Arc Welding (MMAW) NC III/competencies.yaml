        "source_text": "--- PDF PAGE 7 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321               Promulgated  (9/142021)                       3  \nSECTION 2 COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core units of \ncompetency required in MANUAL METAL ARC WELDING (MMAW) NC III. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY   :  LEAD WORKPLACE COMMUNICATION \n \nUNIT CODE \n      :   400311319 \n \nUNIT DESCRIPTOR         :   This unit covers the knowledge, skills and attitudes     required to \nlead in the effective dissemination and discussion of ideas, \ninformation, and issues in the workplace. This includes \npreparation of written communication materials. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Communicate \ninformation \nabout \nworkplace \nprocesses \n1.1  Relevant  \ncommunication \nmethod  is selected \nbased on workplace \nprocedures   \n1.2  Multiple operations \ninvolving several \ntopics/areas are \ncommunicated following \nenterprise requirements  \n1.3  Questioning is applied  \nto gain extra information \n1.4  Relevant sources of \ninformation are \nidentified in accordance \nwith workplace/ client \nrequirements \n1.5  Information is selected \nand organized following \nenterprise procedures \n1.6  Verbal and written \nreporting is undertaken \nwhen required \n1.7  Communication and \nnegotiation skills are \napplied and maintained \nin all relevant situations \n1.1.  Organization \nrequirements \nfor written and \nelectronic \ncommunication \nmethods \n1.2. Effective verbal \ncommunication \nmethods \n1.3. Business \nwriting \n1.4. Workplace \netiquette \n1.1  Organizing \ninformation \n1.2  Conveying \nintended meaning \n1.3 Participating in a \nvariety of workplace \ndiscussions \n1.4 Complying  with \norganization  \nrequirements for the \nuse of written and \nelectronic \ncommunication \nmethods \n1.5 Effective business \nwriting \n1.6 Effective clarifying \nand probing skills \n1.7 Effective \nquestioning \ntechniques \n(clarifying and \nprobing)\n\n--- PDF PAGE 8 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321               Promulgated  (9/142021)                       4  \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Lead workplace \ndiscussions \n2.1  Response to workplace \nissues are sought \nfollowing enterprise \nprocedures  \n2.2  Response to workplace \nissues are provided \nimmediately  \n2.3  Constructive \ncontributions are made \nto workplace \ndiscussions on such \nissues as production, \nquality and safety \n2.4  Goals/ objectives and \naction plans  \nundertaken in the \nworkplace are \ncommunicated promptly  \n2.1 Organization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n2.2 Effective verbal \ncommunication \nmethods \n2.3  Workplace \netiquette \n2.1 Organizing \ninformation \n2.2  Conveying \nintended meaning \n2.3 Participating in \nvariety of workplace \ndiscussions \n2.4  Complying with \norganization  \nrequirements for \nthe use of written \nand electronic \ncommunication \nmethods \n2.5 Effective clarifying \nand probing skills \n \n3. Identify and \ncommunicate \nissues arising in \nthe workplace \n3.1  Issues and problems \nare identified as they \narise \n3.2  Information regarding \nproblems and issues \nare organized \ncoherently to ensure \nclear and effective \ncommunication \n3.3  Dialogue is initiated \nwith appropriate \npersonnel \n3.4  Communication \nproblems and issues \nare raised as they arise \n3.5  Identify barriers in \ncommunication to be \naddressed \nappropriately \n \n3.1  Organization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n3.2  Effective verbal \ncommunication \nmethods \n3.3 Workplace \netiquette \n3.4 Communication \nproblems and \nissues \n3.5 Barriers in \ncommunication   \n \n3.1  Organizing   \ninformation \n3.2  Conveying intended \nmeaning \n3.3 Participating in a \nvariety of workplace   \ndiscussions \n3.4 Complying with \norganization  \nrequirements for the \nuse of written and \nelectronic \ncommunication \nmethods \n3.5 Effective clarifying \nand probing skills \n3.6 Identifying issues \n3.7 Negotiation and \ncommunication \nskills\n\n--- PDF PAGE 9 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321               Promulgated  (9/142021)                       5  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Methods of \ncommunication \nMay include: \n1.1. Non-verbal gestures \n1.2. Verbal \n1.3. Face-to-face \n1.4. Two-way radio \n1.5. Speaking to groups \n1.6. Using telephone \n1.7. Written \n1.8. Internet \n \n2. Workplace discussions \nMay include: \n2.1. Coordination meetings \n2.2. Toolbox discussion \n2.3. Peer-to-peer discussion \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Dealt with a range of communication/information at one \ntime \n1.2 Demonstrated leadership skills in workplace \ncommunication   \n1.3   Made constructive contributions in workplace issues \n1.4   Sought workplace issues effectively \n1.5   Responded to workplace issues promptly \n1.6   Presented information clearly and effectively written \nform \n1.7   Used appropriate sources of information \n1.8   Asked appropriate questions \n1.9   Provided accurate information  \n2. Resource \nImplications \nThe following resources should be provided: \n2.1    Variety of Information \n2.2   Communication tools \n2.3    Simulated workplace \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through:     \nCase problem \n3.1. Third-party report \n3.2. Portfolio \n3.3. Interview \n3.4. Demonstration/Role-playing \n4. Context  for \nAssessment \n4.1. Competency may be assessed in the workplace or in a \nsimulated workplace environment \n \nUNIT OF COMPETENCY  \n \n : \nLEAD SMALL TEAMS  \n \nUNIT CODE \n  \n:      \n400311320\n",
