nual Metal Arc Welding (MMAW) NC III – MEEMAW321               Promulgated  (9/142021)                       67  \n6.2 Task is performed in \naccordance with \ncompany or industry \nrequirement and safety \nprocedure. \n6.3 Required output is \ncompleted as per WPS \nand verified by \nimmediate supervisor \nMeasurement \n6.3 Productivity work \nmeasurements \n6.4 Adherence to work \nrequirements \n6.5 5S and Proper \nHousekeeping \n6.6 Waste \nSegregation/ 3R \n6.7 AWF-CWCS/ ISO \n9606-1 / AWS D1.6 \n/ ASME IX. \n6.8 DOLE DO \n198s2018 policies \non OSH as \napplicable \n6.9 DOH guidelines on \nsafety and health \nas applicable \n \n6.3 Applying safety \nprocedures \n6.4 Applying \nproductive \nmethods and \ntechniques in \nperforming final \nvisual inspection\n\n--- PDF PAGE 72 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321               Promulgated  (9/142021)                       68  \n \n \nRANGE OF VARIABLE \n \nVARIABLE \nRANGE \n1. WPS \nWPS Requirements are the following: \n1.1   Welding positions \n      1.1.1   PA(1F), PC(2F), PF(3F), PE(4F) \n      1.1.2   PA(1G), PC (2G), PF(3G) \n1.2   Material thickness(s) \n      1.2.1   3≤s ‹12mm (plate) \n1.3   Type of material \n       1.3.1   Austenitic Stainless Steel \n1.4   Welding Electrodes (Type and Size) \n1.5   Welding Parameters (Amperage, Polarity, Travel \nspeed) \n1.6   Joint preparation \n \n2. Defects \nMay include: \n2.1   Porosity/Pinholes/Blowholes \n2.2   Undercut \n2.3   Arc Strike  \n2.4   Spatters  \n2.5   Slag inclusion \n2.6   Concavity/convexity   \n2.7   Excessive reinforcement  \n2.8   Burn Through/ Melt Through \n2.9   Crater cracks \n2.10 Cracks \n2.11 Lack of Fusion \n2.12 Under Fill \n2.13 Overlap \n2.14 Misalignment \n2.15 Distortion\n\n--- PDF PAGE 73 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321               Promulgated  (9/142021)                       69  \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the \ncandidate: \n1.1 Welded austenitic stainless steel plates in \nPC (2G) and PF (3G) positions to \nacceptable standard following the approved \nWPS. \n1.2 Observed safety measures applicable to \nworksite operation \n1.3 Communicated effectively with others to \nensure effective work \n1.4 Observed and complied with the productivity \nrequirements \n1.5 Complied with attitudinal work requirements \n \n2. Resource implications \nThe following resources must be provided: \n2.1 Well ventilated work area/shop with \nappropriate welding machines, accessories, \noven, tools, positioners, jigs and fixtures \n2.2  Supplies and materials \n2.3  PPE,  \n2.4  Relevant documentation such as WPS and  \n      working drawing \n2.5 Fire Extinguishers \n3. Method of assessment \nCompetency must be assessed through: \n3.1  Observation and interview \n3.2  Demonstration and interview \n3.3  Written test \n3.4  Portfolio \n3.5  Nondestructive (NDT) and/or Destructive \n       testing(DT) of test coupon \n4. Context of assessment \n4.1 Competency to be assessed while a task is \nbeing undertaken in the workplace or in a \nsimulated workplace setting or at the \ndesignated TESDA Accredited Assessment \nCenter.\n",
