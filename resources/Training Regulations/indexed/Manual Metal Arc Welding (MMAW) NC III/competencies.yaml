  "source_section_text": "SECTION 1 MANUAL METAL ARC WELDING (MMAW) NC III\n QUALIFICATION\n\nThe Manual Metal Arc Welding (MMAW) NC III Qualification consists of competencies\nthat a person must achieve to weld austenitic stainless steel plates components as specified\ndrawings, welding procedure specification or oral instructions using MMAW process. MMAW is\nalso known as Shielded Metal Arc Welding (SMAW).\n\nThis Qualification conforms with the latest edition of ISO 9606-1: Qualification testing of\nwelders — Fusion welding — Part 1: Steels, AWS D 1.6 Structural Welding Code- Stainless\nSteel; ASME IX (Boiler and Pressure Vessel Code) Welding, Brazing, and Fusing\nQualifications; and Asian Welding Federation- Common Welders Certification Scheme (AWF-\nCWCS).\n\nThis Qualification is packaged from the competency map of the Metals and Engineering\nSector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n\n400311319\nLead workplace communication\n400311320\nLead small teams\n400311321\n400311322\nApply critical thinking and problem-solving techniques in the workplace\nWork in a diverse environment\n400311323\n\n400311324\n400311325\n400311326\n400311327\nPropose methods of applying learning and innovation in the\norganization\nUse information systematically\nEvaluate occupational safety and health work practices\nEvaluate environmental work practices\nFacilitate entrepreneurial skills for micro-small-medium enterprises\n(MSMEs)\n\nCODE NO.\nCOMMON COMPETENCIES\nMEE721202\nInterpret Drawings and Sketches\nMEE721210\nPerform Basic Workshop Measurements & Computations\nMEE721211\nContribute to Quality System\nMEE721205\nUse Hand Tools\nMEE721212\nPrepare Materials and Consumables\nInterpret Drawings and Sketches\nPerform Basic Workshop Measurements & Computations\nContribute to Quality Management System\nUse Hand Tools\nPrepare Materials and Consumables\n\nCODE NO.\nMEE721321\nMEE721322\nMEE721325\n\nCORE COMPETENCIES\nSet up Welding Equipment\nPrepare / Fit up Welding Joints\n Weld Austenitic Stainless Steel Plates using MMAW\n\n--- PDF PAGE 6 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/142021) 2\n\nA person who has achieved this Qualification is competent to be a –\n\n-\nCarbon Steel Plate/ Pipe Welder (MMAW)\n-\nAustenitic Stainless Steel Plate Welder (MMAW)\n\n--- PDF PAGE 7 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/142021) 3"
