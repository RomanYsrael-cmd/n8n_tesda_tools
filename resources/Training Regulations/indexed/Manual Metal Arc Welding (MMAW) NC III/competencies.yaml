        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Performed tack welding\n1.2 Checked root opening and alignment\n1.3 Positioned fitted weld joint\n1.4 Observed safety measures applicable to\nworksite operation\n1.5 Communicated effectively with others to ensure\neffective work\n1.6 Observed and complied with the productivity\nrequirements\n1.7 Complied with attitudinal work requirements\n2. Resource implications\nThe following resources must be provided:\n2.1 Drawing and\n2.2 Well ventilated work area/shop with appropriate\nwelding machines, accessories, positioners, jigs\nand fixtures.\n2.3 PPE\n3. Method of assessment\nCompetency must be assessed through:\n3.1 Observation/evaluation\n3.2 Oral questioning\n4. Context of assessment\n4. 1 Competency to be assessed while a task is\n being undertaken in the workplace or in a\n simulated workplace setting or at the\n designated TESDA Accredited Assessment\n Center.\n\n--- PDF PAGE 68 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/142021) 64\nUNIT OF COMPETENCY :\nWELD AUSTENITIC STAINLESS STEEL\nPLATES USING MMAW\n\nUNIT CODE\n\n:"
        },
        "source_text": "MEE721322\n\nDESCRIPTOR\n: This unit covers the skills, knowledge and attitudes in\n preparing/ fitting up welding joints.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.Set up root\nopening and\nalignment\n\n1.1\nRoot opening and\nalignment is set up\n1.2 Root opening is set up\nin accordance with the\nrequirements of WPS.\n1.3 Welding joint is\naligned within the\nrange of acceptability\nof code and standard.\n1.4 Task is performed in\naccordance with\ncompany or industry\nrequirements and\nsafety procedure\n1.5 Required output is\ncompleted as per WPS\nand verified by\nimmediate supervisor\n1.1 Basic welding\njoints\n1.2 Parts of welding\njoint\n1.3 Welding joint\ndesign\n1.4 Dimensional\nMeasurement\n1.5 OSH Standards\n1.6 Work Instructions\n(written and\nverbal).\n1.7 Productivity work\nmeasurements\n1.8 Adherence to\nwork\nrequirements.\n1.9 5S and Proper\nHousekeeping\n1.9\nWaste\nSegregation/ 3R\n1.10 AWF-CWCS/\nISO\n9606-1\n/\nAWS\nD1.6\n/\nASME IX.\n1.11 DOLE DO\n198s2018\npolicies on OSH\nas applicable\n1.12 DOH guidelines\non safety and\nhealth as\napplicable\n\n1.1 Setting up root\nopening and\nalignment\n1.2 Performing\nmeasurement\ns\n1.3 Applying\nsafety\nprocedures\n1.4 Applying\nproductive\nmethods and\ntechniques in\nsetting up root\nopening and\nalignment\n2. Perform tack\nwelding\n\n2.1 Tack welds are\nperformed on the\nwelding joints in\naccordance with the\nrequirements of WPS\nor jobs requirement.\n2.2 Backing plate,\nstiffeners, running\nplates are installed as\n2.1 Basic welding\njoints\n2.2 Parts of welding\njoint\n2.3 Welding joint\ndesign\n2.4 Dimensional\nMeasurement\n2.5 Tack welding\n2.1 Performing\nTack Welding\n2.2 Performing\nmeasurements\n2.3 Applying safety\nprocedures\n2.4 Applying\nproductive\nmethods and\n\n--- PDF PAGE 66 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/142021) 62\nrequired.\n2.3 Fitted welding joints\nare freed from rust,\npaints, slags and\nother contaminants.\n2.4 Fitted welding joints\nare visually and\ndimensionally\nacceptable.\n2.5 Task is performed in\naccordance with\ncompany or industry\nrequirements and\nsafety procedure\n2.6 Required output is\ncompleted as per\nWPS and verified by\nimmediate supervisor\n2.6 OSH Standards\n2.7 Work instructions\n(written and\nverbal).\n 2.8 Productivity work\nmeasurements\n2.9 Adherence to\nwork\nrequirements\n2.10 5S and Proper\nHousekeeping\n2.11 Waste\nSegregation/ 3R\n2.12 AWF-CWCS/\nISO 9606-1 /\nAWS D1.6 /\nASME IX.\n2.13 DOLE DO\n198s2018\npolicies on OSH\nas applicable\n2.14 DOH guidelines\non safety and\nhealth as\napplicable\n\ntechniques in\nperforming tack\nwelding\n3.Set up fitted\nwelding joints\n3.1 Fitted welding joints\nare positioned and\nsecured according to\nthe requirements.\n3.2 Task is performed in\naccordance with\ncompany or industry\nrequirements and\nsafety procedure\n3.3 Required output is\ncompleted as per WPS\nand verified by\nimmediate supervisor\n3.1 Different Welding\nPosition\n3.2 OSH Standards\n3.3 work\ninstructions\n(written and\nverbal).\n3.3 Productivity work\nmeasurements\n3.4 Adherence to\nwork requirements\n3.5 5S and Proper\nHousekeeping\n3.6 Waste\n Segregation/ 3R\n3.7 AWF-CWCS/ ISO\n9606-1 / AWS\nD1.6 / ASME IX.\n3.8 DOLE DO\n198s2018 policies\non OSH as\napplicable\n3.9 DOH guidelines\non safety and\nhealth as\napplicable\n\n3.1 Positioning of\nfitted welding\njoints\n3.2 Applying\nsafety\nprocedures\n3.3 Applying\nproductive\nmethods and\ntechniques in\nsetting up\nfitted welding\njoints\n\n--- PDF PAGE 67 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/142021) 63\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n1. Root opening\nSpecification is based on:\n1.1 WPS requirements\n1.2 Client requirements\n2.Tack welds\n\nKinds of tack welds\n2.1 Bridge\n2.2 Permanent\n2.3 Temporary\n3. Visually and\ndimensionally acceptable\nMay include:\n3.1 Fully fused to the base metal\n3.2 Free from defects\n3.3 Evenly distributed\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Performed tack welding\n1.2 Checked root opening and alignment\n1.3 Positioned fitted weld joint\n1.4 Observed safety measures applicable to\nworksite operation\n1.5 Communicated effectively with others to ensure\neffective work\n1.6 Observed and complied with the productivity\nrequirements\n1.7 Complied with attitudinal work requirements\n2. Resource implications\nThe following resources must be provided:\n2.1 Drawing and\n2.2 Well ventilated work area/shop with appropriate\nwelding machines, accessories, positioners, jigs\nand fixtures.\n2.3 PPE\n3. Method of assessment\nCompetency must be assessed through:\n3.1 Observation/evaluation\n3.2 Oral questioning\n4. Context of assessment\n4. 1 Competency to be assessed while a task is\n being undertaken in the workplace or in a\n simulated workplace setting or at the\n designated TESDA Accredited Assessment\n Center.\n\n--- PDF PAGE 68 ---\nManual Metal Arc Welding (MMAW) NC III – MEEMAW321 Promulgated (9/142021) 64\nUNIT OF COMPETENCY :\nWELD AUSTENITIC STAINLESS STEEL\nPLATES USING MMAW\n\nUNIT CODE\n\n:"
