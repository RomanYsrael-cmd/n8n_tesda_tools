needs of grade schooler Foster physiological needs and cognitive development of grade schooler Foster physical growth and development of grade schooler Respond to emergency for grade schooler Foster physical growth and development of adolescent Promote developmental tasks for adolescent Respond to emergency for adolescent Develop the ability to recognize aging process Participate in the implementation and monitoring of client’s care plan Perform caring skills Perform specialty care procedures Assist client in administering prescribed medication Participate in the implementation and monitoring of client’s care plan Provide assistance and support on environment and biopsychosoci al needs of clients Develop the ability to recognize healthy body systems and apply medical terminologies Provide care and support to activities of daily living (ADL) of clients Provide assistance in administering prescribed medications to clients Provide care and support to clients with special needs Respond to emergency situations Provide immediate care and support to children with special needs Provide immediate care and support to adults and elderly with special needs --- PDF PAGE 245 --- TR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 241 1. ADULT - is an organism that has reached sexual maturity. In human context, the term adult additionally has meanings associated with social and legal concepts. In contrast to a \"minor\", a legal adult is a person who has attained the age of majority and is therefore regarded as independent, self-sufficient, and responsible. The typical age of attaining legal adulthood is 18, although definition may vary by legal rights and country. 2. ADHD (ATTENTION DEFICIT HYPERACTIVITY DISORDER) - is a chronic condition marked by persistent inattention, hyperactivity, and sometimes impulsivity. ADHD begins in childhood and often lasts into adulthood. As many as 2 out of every 3 children with ADHD continue to have symptoms as adults. 3. ASD (AUTISM SPECTRUM DISORDER) – any of a group of developmental disorders (such as autism and Asperger’s syndrome) marked by impairments in the ability to communicate and interact socially and by the presence of repetitive behaviors or restricted interests. Also called pervasive developmental disorder. 4. AMBULATION - the act, action, or an instance of moving about or walking. Ambulation is the ability to walk without the need for any kind of assistance. It is most often used when describing the goals of a patient after a surgery or physical therapy. In order to reach a patient’s goal of ambulation, they may require assistance before they are able to walk around on their own. 5. ANATOMY - the branch of science concerned with the bodily structure of humans, animals, and other living organisms, especially as revealed by dissection and the separation of parts. 6. ARTHRITIS - painful inflammation and stiffness of the joints. 7. ASSISTIVE DEVICES - Any device that is designed, made, or adapted to assist a person perform a particular task. For examples, canes, crutches, walkers, wheel chairs, and shower chairs are all assistive devices. 8. BASIC LIFE SUPORT (BLS) - is a level of medical care which is used for victims of life-threatening illnesses or injuries until they can be given full medical care at a hospital. It can be provided by trained medical personnel, including certified first responders, emergency medical technicians, and by qualified bystanders. 9. BED SORES - A painful, often reddened area of degenerating, ulcerated skin caused by pressure and lack of movement, and worsened by exposure to urine or other irritating substances on the skin. Untreated bed sores can become seriously infected or gangrenous. Bed sores are a major problem for patients who are confined to bed or a wheelchair. They can be prevented by moving the patient frequently, changing bedding, and keeping the skin clean and dry. Also called a pressure sore, decubitus sore, or decubitus ulcer."
    },
    {
      "number": "10",
      "text": "BIOPSYCHOSOCIAL NEEDS - The biopsychosocial model is a method of understanding health and illness through biological, psychological, and social factors. The principle of the biopsychosocial model states that all issues relating to health are products of a complex interplay of these three factors. The model has --- PDF PAGE 246 --- TR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 242 been both revered and criticized in medical circles. In layman's terms, the biopsychosocial model is known as the mind-body connection."
    },
    {
      "number": "11",
      "text": "CAREGIVER – a lay individual who assumes responsibility for the physical and emotional needs of another who is incapable of self-care. A person who provides direct care (as for children, elderly people, or the chronically ill)."
    },
    {
      "number": "12",
      "text": "CARE PLAN - A care plan is a written statement of your individual assessed needs identified during a Community Care Assessment. It sets out what support you should get, why, when, and details of who is meant to provide it. You are entitled to be given a copy of your care plan and should not sign the care plan until you are happy with it."
    },
    {
      "number": "13",
      "text": "CARING SKILLS - feeling or showing concern for or kindness to others. All individuals in society have “needs” to grow, develop and maintain a healthy lifestyle. A “need” is what is required to achieve, maintain or regain the life quality factors. Caring helps individuals meet these needs to be healthy, active and independent. Caring helps individuals with everyday living and supports an individual’s life quality factors. Carers have an enormous influence over the outcome of the care that they give. Their actions can have positive or negative effects."
    },
    {
      "number": "14",
      "text": "CATHETER - a tubular medical device for insertion into canals, vessels, passageways, or body cavities usually to permit injection or withdrawal of fluids or to keep a passage open."
    },
    {
      "number": "15",
      "text": "CEREBROVASCULAR - the sudden death of some brain cells due to lack of oxygen when the blood flow to the brain is impaired by blockage or rupture of an artery to the brain. A CVA is also referred to as a stroke."
    },
    {
      "number": "16",
      "text": "CHRONIC DISEASE - A chronic disease is a condition you can control with treatment for months. Asthma, diabetes, and depression are common examples. Often, they don't have a cure, but you can live with them and manage their symptoms."
    },
    {
      "number": "17",
      "text": "CLEFT LIP - a birth defect characterized by one or more clefts in the upper lip resulting from failure of the embryonic parts of the lip to unite."
    },
    {
      "number": "18",
      "text": "CLEFT PALATE - congenital fissure of the roof of the mouth"
    },
    {
      "number": "19",
      "text": "CLIENT - a person who engages the professional advice or services of another."
    },
    {
      "number": "20",
      "text": "CLINICAL WASTE - Clinical waste is the term used to describe waste produced from healthcare and similar activities that may pose a risk of infection, for example, swabs, bandages, dressings etc. or may prove hazardous, for example medicines."
    },
    {
      "number": "21",
      "text": "CLUBFOOT- describes a range of foot abnormalities usually present at birth (congenital) in which your baby's foot is twisted out of shape or position. In clubfoot, the tissues connecting the muscles to the bone (tendons) are shorter than usual. Clubfoot is a fairly common birth defect and is usually an isolated problem for an otherwise healthy newborn --- PDF PAGE 247 --- TR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 243"
    },
    {
      "number": "22",
      "text": "COLD THERAPY - As a general rule, cold therapy is used for sudden, acute injuries such as ankle sprains, muscle years, bruising and inflammation."
    },
    {
      "number": "23",
      "text": "CONGENITAL DISORDER - is a medical condition that is present at or before birth. These conditions, also referred to as birth defects, can be acquired during the fetal stage of development or from the genetic make up of the parents."
    },
    {
      "number": "24",
      "text": "DISPENSING - is the provision of drugs or medicines as set out properly on a lawful prescription."
    },
    {
      "number": "25",
      "text": "ELDERLY- aged; individuals over 65 years old who have functional impairments; sometimes used to describe any adult over 75 years old."
    },
    {
      "number": "26",
      "text": "FIRST AID - emergency care or treatment given to an ill or injured person before regular medical aid can be obtained."
    },
    {
      "number": "27",
      "text": "GOUT - is a common and complex form of arthritis that can affect anyone. It's characterized by sudden, severe attacks of pain, swelling, redness and tenderness in the joints, often the joint at the base of the big toe."
    },
    {
      "number": "28",
      "text": "GROOMING - the things that you do to make your appearance clean and neat, for example brushing your hair, or the things that you do to keep an animal's hair or fur clean and neat"
    },
    {
      "number": "29",
      "text": "HOT THERAPY - Heat therapy is primarily used for taking the edge off of several different kinds of body pain. Those dull, persistent pains that you get with stiffness and cramping, for example."
    },
    {
      "number": "30",
      "text": "INCONTINENCE - inability of the body to control the evacuative functions of urination or defecation: partial or complete loss of bladder or bowel control."
    },
    {
      "number": "31",
      "text": "INFECTION CONTROL - is the discipline concerned with preventing healthcare- associated infections; a practical rather than academic sub-discipline of epidemiology. Infection control addresses factors related to the spread of infections within the healthcare setting, whether among patients, from patients to staff, from staff to patients, or among staff. This includes preventive measures such as hand washing, cleaning, disinfecting, sterilizing, and vaccinating. Other aspects include surveillance, monitoring, and investigating any suspected outbreak of infection, and its management."
    },
    {
      "number": "32",
      "text": "MEDICATION - a substance used for medical treatment, especially a medicine or drug."
    },
    {
      "number": "33",
      "text": "MOBILITY - the ability to move or be moved freely and easily."
    },
    {
      "number": "34",
      "text": "NEBULIZATION - is the process of medication administration via inhalation. It utilizes a nebulizer which transports medications to the lungs by means of mist inhalation."
    },
    {
      "number": "35",
      "text": "ORAL CARE – is the practice of keeping the mouth clean and healthy by brushing and flossing to prevent tooth decay and gum disease. --- PDF PAGE 248 --- TR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 244"
    },
    {
      "number": "36",
      "text": "PALLIATIVE CARE - care for the terminally ill and their families, especially that provided by an organized health service."
    },
    {
      "number": "37",
      "text": "PARKINSONS DISEASE - is a progressive nervous system disorder that affects movement. Symptoms start gradually, sometimes starting with a barely noticeable tremor in just one hand. Tremors are common, but the disorder also commonly causes stiffness or slowing of movement."
    },
    {
      "number": "38",
      "text": "PNEUMONIA - is an infection that inflames the air sacs in one or both lungs. The air sacs may fill with fluid or pus (purulent material), causing cough with phlegm or pus, fever, chills, and difficulty breathing. A variety of organisms, including bacteria, viruses and fungi, can cause pneumonia."
    },
    {
      "number": "39",
      "text": "PERENIAL CARE - involves cleaning the private areas of a patient. Because this area is prone to infection, it must be cleaned at least daily, and more if your loved one suffers from incontinence. Typical times to perform peri-care include as part of daily bathing, after the use of the bedpan, and following episodes of incontinence."
    },
    {
      "number": "40",
      "text": "PERSONAL PROTECTIVE EQUIPMENT (PPE) – is protective clothing, helmets, goggles, or other garments or equipment designed to protect the wearer's body from injury or infection."
    },
    {
      "number": "41",
      "text": "PRESCRIPTION - an instruction written by a medical practitioner that authorizes a patient to be provided a medicine or treatment."
    },
    {
      "number": "42",
      "text": "SKIN CARE - maintaining clean, comfortable and healthy skin through thorough cleansing with soap and water, and moisturizing with emollients. Basic skin care also includes treating skin conditions appropriately with medicines and lotions, and avoiding sun exposure. Age is a factor in skin care. Special consideration should be given to infants, senior adults and the infirm."
    },
    {
      "number": "43",
      "text": "SPECIAL NEEDS - any of various difficulties (such as a physical, emotional, behavioral, or learning disability or impairment) that causes an individual to require additional or specialized services or accommodations (such as in education or recreation)"
    },
    {
      "number": "44",
      "text": "THERAPEUTIC COMMUNICATION – an interaction between a health care professional and a patient that aims to enhance the patient’s comfort, safety, trust, or health and well-being."
    },
    {
      "number": "45",
      "text": "THERAPEUTIC DIET - a therapeutic diet is a meal plan that controls the intake of certain foods or nutrients. It is part of the treatment of a medical condition and are normally prescribed by a physician and planned by a dietician."
    },
    {
      "number": "46",
      "text": "TOILETING - is the act of assisting a dependent patient with his/her elimination needs."
    },
    {
      "number": "47",
      "text": "TOURETTE SYNDROME - is a disorder that involves repetitive movements or unwanted sounds (tics) that can't be easily controlled. For instance, you might repeatedly blink your eyes, shrug your shoulders or blurt out unusual sounds or offensive words. --- PDF PAGE 249 --- TR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 245"
    },
    {
      "number": "48",
      "text": "VITAL SIGNS – determination of temperature, pulse rate, rate of breathing and level of blood pressure."
    },
    {
      "number": "49",
      "text": "WOUND CARE - refers to specific types of treatment for pressure sores, skin ulcers and other wounds that break the skin. --- PDF PAGE 250 --- TR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 246 The Technical Education and Skills Development Authority (TESDA) would like to extend sincerest thank you and appreciation to the representatives of business, industry, academe and government agencies who provided their time and expertise in the development and validation of this Training Regulations. MS. BERNADETTE DC. ILAGAN, PhD, RN, LPT Member Philippine Association of Service Exporters, Inc. (PASEI) MR. JOEL JOHN A. DELA MERCED, PhD, RN, LPT Member Philippine Association of Service Exporters, Inc. (PASEI) MS. MARIETTA M. SERNA, MAN, RN Member Philippine Association of Service Exporters, Inc. (PASEI) MR. JOEY M. CADANO, PhD, RN, LPT Member Philippine Association of Service Exporters, Inc. (PASEI) MS. MILAFLOR L. VALDEZ Founder Caregivers of the Philippines Association, Inc. (CPAI) MR. ANTONIO ALVIN M. COBANGBANG Chairman, External Affairs and Rules Caregivers of the Philippines Association, Inc. (CPAI) MS. MYRA SOLEDAD E. COBANGBANG President Caregivers of the Philippines Association, Inc. (CPAI) MS. MA. CHRISTINA BERMUDEZ, RN Member Caregivers of the Philippines Association, Inc. (CPAI) MS. SHARON DIMATULAC, MAN, RN Dean, College of Nursing St. Francis of Assissi College, Las Piñas City --- PDF PAGE 251 --- TR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 247 The PARTICIPANTS in the National Validation of this Training Regulation Name Organization Designation Conradito D. Ilagan Jr. MMS Caregiver Jocelyn L. Aquino Overseas Academy, Makati Trainer/Assessor Josephine C. Maico Capt. WPA Foundation Inc., Pasay City Trainer Carolyn C. Calupitan Saint Francis of Assisi College, Las Piñas City Faculty, College of Nursing Eduardo M. Ledesma TESDA Manila Assessor Barbie S. Navarro EBCA T