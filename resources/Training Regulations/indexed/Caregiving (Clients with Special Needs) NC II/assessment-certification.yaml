  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the national qualification of CAREGIVING (CLIENTS WITH SPECIAL\nNEEDS) NC II, the candidate must demonstrate competence in all units listed\nin Section 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n4.1.2 A Certificate of Competency (COC) is issued by the Authority to individuals who\nwere assessed as competent in cluster of related units of competency, namely:\n\nCOC 1 Provide care and support for children with special needs\n• Participate in the implementation and monitoring of client’s care plan\n• Provide assistance and support on environmental and biopsychosocial\nneeds of clients\n• Develop the ability to recognize healthy body systems and apply\nmedical terminologies\n• Provide care and support to activities of daily living (ADL) of clients\n• Provide assistance in administering prescribed medications to clients\n• Provide care and support to clients with special needs\n• Respond to emergency situations\n• Provide immediate care and support to children with special needs\n\nCOC 2 Provide care and support for adults and elderly with special needs\n• Participate in the implementation and monitoring of client’s care plan\n• Provide assistance and support on environmental and biopsychosocial\nneeds of clients\n• Develop the ability to recognize healthy body systems and apply\nmedical terminologies\n• Provide care and support to activities of daily living (ADL) of clients\n• Provide assistance in administering prescribed medications to clients\n• Provide care and support to clients with special needs\n• Respond to emergency situations\n• Provide immediate care and support to adults and elderly with special\nneeds\n\nUpon accumulation and submission of all the COCs acquired, an individual shall\nbe issued the corresponding National Certificate for the Qualification.\n\n--- PDF PAGE 240 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 236\n4.1.3 Assessment shall cover all competencies with basic and common integrated\nor assessed concurrently with the core units of competency.\n\n4.1.4 Any of the following are qualified to undergo assessment and certification:\n\n4.1.4.1\nGraduates of WTR-registered program, NTR-registered programs or\nformal/non-formal/informal including enterprise-based trainings\nrelated to Caregiving (Clients with Special Needs) NC II.\n\n4.1.4.2\nExperienced workers (wage employed or self-employed) who gained\ncompetencies in providing caregiving services for at least one (1)\nyear within the last five (5) years.\n\n4.1.5\nRecognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, previous work or life\nexperiences with at least three (3) years of caregiving experience within the\nlast five (5) years may apply for recognition in this Qualification through\nPortfolio Assessment.\n\nRequirements and implementation procedure of Portfolio Assessment must be\nconsistent with TESDA Circular No. 47, series of 2018 on “Implementing\nGuidelines on the Implementation of Portfolio Assessment Leading to\nRecognition of Prior Learning (RPL) within the TESDA Assessment and\nCertification System, and with TESDA Circular No. 118, series of 2019 on\n“Addendum to the Implementing Guidelines on the Implementation Portfolio\nAssessment Leading to Recognition of Prior Learning (RPL) within the TESDA\nAssessment and Certification System.”\n\n4.1.6 Holders of National Certificate (NC) or Certificates of Competency (COC) in\nCaregiving Services NC II are required to undergo re-assessment under the\namended Training Regulations (TRs), upon expiration of their Certificates.\n\n4.1.7 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the “Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\n\n--- PDF PAGE 241 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 237\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior to assessment\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 242 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 238\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine problems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow occupational\nsafety and health\npolicies and\nprocedures\nApply\nenvironmental\nwork standards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nteam\nenvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop career\nand life\ndecisions\nContribute to\nworkplace\ninnovation\nPresent relevant\ninformation\nPractice occupational\nsafety and health\npolicies and\nprocedures\nExercise efficient\nand effective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-solving\ntechniques in\nthe workplace\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying learning\nand innovation in\nthe organization\nUse information\nsystematically\nEvaluate occupational\nsafety and health\nwork practices\nEvaluate\nenvironmental\nwork practices\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\nUtilize\nspecialized\ncommunication\nskill\nDevelop and\nlead teams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute to\nthe practice of\nsocial justice in\nthe workplace\nManage\ninnovative work\ninstructions\nManage and\nevaluate usage\nof information\nLead in improvement\nof Occupational\nSafety and Health\nProgram, Policies and\nProcedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate higher\norder thinking\nskills and adjust\nproblem solving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation into\nwork procedures\nDevelop\nsystems in\nmanaging and\nmaintaining\ninformation\nManage\nimplementation of\noccupational safety\nand health programs\nin the workplace\nManage\nimplementation of\nenvironmental\nprograms in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\n\nCOMPETENCY MAP – HUMAN HEALTH/HEALTH CARE SECTOR\nCAREGIVING (CLIENTS WITH SPECIAL NEEDS) NC II\nBASIC\nCOMPETENCIES\n\n--- PDF PAGE 243 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 239\nMaintain\ninstruments and\nequipment in\nwork area\nAssist in dental\nlaboratory\nprocedures\nAssist with\nadministration\nin dental\nlaboratory\npractice\nImplement and\nmonitor infection\ncontrol policies\nand procedures\nRespond\neffectively to\ndifficult/\nchallenging\nbehavior\nApply basic\nfirst aid\nMaintain high\nstandard of\npatient / client\nservices\nApply quality\nstandards\nMaintain a\nsafe, clean\nand efficient\nenvironment\nMaintain an\neffective\nrelationship\nwith clients/\ncustomers\n(marketing)\n\nUpdate industry\nknowledge and\npractice through\ncontinuing\neducation\nUse\npharmaceutical\ncalculation\ntechniques and\nterminologies\nMaintain an\neffective\nrelationship\nwith customers\nand clients\nManage own\nperformance\nFollow\noccupational\nhealth and\nsafety policies in\ndental laboratory\nfacilities\nMaintain\ninfection\ncontrol in\ndental\npractice\nOperate a\npersonal\ncomputer\nPerform\nworkplace\nsecurity and\nsafety\npractices\nPerform\ncomputer\noperations\n\nPrepare and\nmaintain beds\nCollect and\nmaintain linen\nstocks at end-\nusers location\nAssist in\npatient mobility\nAssist in\ntransporting\npatients\nAssist in bio-\npsychosocial\nsupport care of\npatients\nHandle waste\nin a health\ncare\nenvironment\nPlan the hilot\nwellness program of\nclient/s\nProvide pre-\nservice to hilot\nclient/s\nApply hilot\nwellness\nmassage\ntechniques\nProvide post\nadvice and\npost-services\nto hilot clients\nPractice good\nhousekeeping\nMonitor supply/\ninventory of\npharmaceutical\nproducts\nHandle and\ncontrol\npharmaceutica\nl products\nArrange and\ndisplay\npharmaceutica\nl products\nPerform good\nlaboratory\npractices\nAdhere to\ngood\nmanufacturing\npractices\nDemonstrate\nproduct knowledge\non medicines\nDispense\npharmaceutica\nl products\nPerform\nhealth\npromotion\neducation,\nvigilance\nInstall\nbiomedical\nequipment\nPerform\ncorrective\nmaintenance\non biomedical\nequipment\nPerform\npreventive\nmaintenance\non biomedical\nequipment\nRepair\nbiomedical\nequipment\nAssess and\nrefer\nbiomedical\nequipment\nDevelop\nmassage\npractice\nPerform client\nconsultation\nPerform body\nmassage and work\narea\nMaintain and\norganize tools,\nequipment,\nsupplies\nPerform\nbasic life\nsupport\nMaintain life\nsupport\nequipment and\nresources\nImplement\nsafe access\nand extrication\nprocedures in\nan emergency\nManage\nrequest for\nambulance\nservice\nAllocate\nambulance\nservice\nresources\nCoordinate\nemergency\nresources\nDeliver basic\nambulance\ncommunication\nskills\nSupervise on-\nroad\noperations\nManage the scene\nof an emergency\nManage the\nscene of a\nspecial event\nManage\nroutine\nscene\nDeliver pre-\nhospital\npatient care\nDeliver\nintensive pre-\nhospital patient\ncare\nManage\nambulance\noperations\nTransport\nemergency\npatients\nTransport non-\nemergency\npatients\nDrive vehicles\nunder\noperational\nconditions\nAssist the\nhousehold to\nidentify health\nproblems to\npromote health\nand well-being\nShare knowledge and\nskills among members\nto provide information,\neducation and\ncommunication (IEC)\nand/or household\nteaching in disease\nprevention and control\nEnsure the\nproper\nmaintenance of\nhealth station\nand safe custody\nof its equipment,\nmedical supplies,\nmaterials, and\nhealth records\nMonitor\nhealth status\nof household\nmembers\nunder his/her\narea of\nservice\ncoverage\nMaintain\nupdated\nlist/records of\nhealth\nactivities\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\n\n--- PDF PAGE 244 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 240\nAnalyze and\ninterpret\nophthalmic lens\nprescription\nEdge and\nmount\nophthalmic\nappliances\nApply UV coat/\ntint to\nophthalmic\nlenses\nFabricate\nmodels\nFabricate\ncustom\nimpression trays\nFabricate\nregistration\nbite rims\nArticulate models\nand transfer records\nFabricate\nmouthguard\nFabricate\nmetal crown\nand bridge\nstructures\nFabricate\nceramic\nrestorations\nFabricate\nindirect\ncomposite/\npolymer fixed\nrestorations\nJoin alloy\nstructures\nArrange\nartificial teeth\nfor complete\ndentures\nSet-up and\nwax\nremovable\npartial\ndentures\nWax, process\nand finish acrylic\ndentures and\nappliances\nFabricate\nthermo formed\nbases and\nappliances\nRepair and modify\ndentures and\nappliances\nFabricate oral\nsplints\nFabricate\northodontic\nappliances\nFabricate cast\nmetal\nremovable\npartial denture\nframework\nPerform oral\nexamination\nPromote oral\nhealth and\nhygiene\nOperate a\ndental\nradiographic\nequipment\nApply the\nprinciple of\nradiology\nbiology and\nprotection in\ndental practice\nPerform scaling\nand polishing\nMaintain\ndental records\nand resources\nProvide effective\npatient/client\nservice\nManage dental\nlaboratory\nproduction and\noperation\nPerform\nadministrativ\ne functions\nContinue\nprofessional\ngrowth and\ndevelopment\nParticipate in\nthe\nimplementation\nand monitoring\nof newborn’s\ncare plan\nDevelop the\nability to\nrecognize\nnewborn’s\ngrowth and\ndevelopment\nPerform caring\nskills for\nnewborn\nParticipate in the\nimplementation\nand monitoring of\ninfant’s care plan\nProvide physical\nneeds, care and\nsupport to infant\nFoster social,\nintellectual and\nemotional\ndevelopment\nof infant\nParticipate in the\nimplementation and\nmonitoring of\ntoddler’s care plan\nDevelop the\nability to\nrecognize\ntoddler’s\ngrowth and\ndevelopment\nPerform\ncaring skills\nfor toddler\nParticipate in the\nimplementation\nand monitoring of\npre-schooler’s\ncare plan\nDevelop the\nability to\nrecognize pre-\nschooler’s\ngrowth and\ndevelopment\nPerform caring\nskills for pre-\nschooler\nProvide\nassistance and\ncare to\npersonal\nneeds of grade\nschooler\nFoster\nphysiological\nneeds and\ncognitive\ndevelopment of\ngrade schooler\nFoster physical\ngrowth and\ndevelopment of\ngrade schooler\nRespond to\nemergency for\ngrade schooler\nFoster physical\ngrowth and\ndevelopment of\nadolescent\nPromote\ndevelopmental\ntasks for\nadolescent\nRespond to\nemergency\nfor\nadolescent\nDevelop the\nability to\nrecognize\naging process\nParticipate in\nthe\nimplementation\nand monitoring\nof client’s care\nplan\nPerform caring\nskills\nPerform\nspecialty care\nprocedures\nAssist client in\nadministering\nprescribed\nmedication\nParticipate in the\nimplementation\nand monitoring\nof client’s care\nplan\nProvide\nassistance and\nsupport on\nenvironment\nand\nbiopsychosoci\nal needs of\nclients\nDevelop the ability\nto recognize healthy\nbody systems and\napply medical\nterminologies\nProvide care\nand support to\nactivities of\ndaily living\n(ADL) of\nclients\nProvide\nassistance in\nadministering\nprescribed\nmedications to\nclients\nProvide care\nand support to\nclients with\nspecial needs\nRespond to\nemergency\nsituations\nProvide\nimmediate\ncare and\nsupport to\nchildren with\nspecial needs\nProvide\nimmediate\ncare and\nsupport to\nadults and\nelderly with\nspecial needs\n\n--- PDF PAGE 245 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 241\nGLOSSARY OF TERMS\n\n1.\nADULT - is an organism that has reached sexual maturity. In human context, the\nterm adult additionally has meanings associated with social and legal concepts. In\ncontrast to a \"minor\", a legal adult is a person who has attained the age of\nmajority and is therefore regarded as independent, self-sufficient, and responsible.\nThe typical age of attaining legal adulthood is 18, although definition may vary by\nlegal rights and country.\n\n2.\nADHD (ATTENTION DEFICIT HYPERACTIVITY DISORDER) - is a chronic condition\nmarked\nby\npersistent\ninattention,\nhyperactivity,\nand\nsometimes\nimpulsivity. ADHD begins in childhood and often lasts into adulthood. As many as 2 out\nof every 3 children with ADHD continue to have symptoms as adults.\n\n3.\nASD (AUTISM SPECTRUM DISORDER) – any of a group of developmental\ndisorders (such as autism and Asperger’s syndrome) marked by impairments in the\nability to communicate and interact socially and by the presence of repetitive\nbehaviors or restricted interests. Also called pervasive developmental disorder.\n\n4.\nAMBULATION - the act, action, or an instance of moving about or walking.\nAmbulation is the ability to walk without the need for any kind of assistance. It is most\noften used when describing the goals of a patient after a surgery or physical therapy.\nIn order to reach a patient’s goal of ambulation, they may require assistance before\nthey are able to walk around on their own.\n\n5.\nANATOMY - the branch of science concerned with the bodily structure of humans,\nanimals, and other living organisms, especially as revealed by dissection and the\nseparation of parts.\n\n6.\nARTHRITIS - painful inflammation and stiffness of the joints.\n\n7.\nASSISTIVE DEVICES - Any device that is designed, made, or adapted to assist a\nperson perform a particular task. For examples, canes, crutches, walkers, wheel\nchairs, and shower chairs are all assistive devices.\n\n8.\nBASIC LIFE SUPORT (BLS) - is a level of medical care which is used for victims of\nlife-threatening illnesses or injuries until they can be given full medical care at a\nhospital. It can be provided by trained medical personnel, including certified first\nresponders, emergency medical technicians, and by qualified bystanders.\n\n9.\nBED SORES - A painful, often reddened area of degenerating, ulcerated skin caused\nby pressure and lack of movement, and worsened by exposure to urine or other\nirritating substances on the skin. Untreated bed sores can become seriously infected\nor gangrenous. Bed sores are a major problem for patients who are confined to bed\nor a wheelchair. They can be prevented by moving the patient frequently, changing\nbedding, and keeping the skin clean and dry. Also called a pressure sore, decubitus\nsore, or decubitus ulcer.\n\n10. BIOPSYCHOSOCIAL NEEDS - The biopsychosocial model is a method of\nunderstanding health and illness through biological, psychological, and social\nfactors. The principle of the biopsychosocial model states that all issues relating to\nhealth are products of a complex interplay of these three factors. The model has\n\n--- PDF PAGE 246 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 242\nbeen both revered and criticized in medical circles. In layman's terms, the\nbiopsychosocial model is known as the mind-body connection.\n\n11. CAREGIVER – a lay individual who assumes responsibility for the physical and\nemotional needs of another who is incapable of self-care. A person who provides\ndirect care (as for children, elderly people, or the chronically ill).\n\n12. CARE PLAN - A care plan is a written statement of your individual assessed needs\nidentified during a Community Care Assessment. It sets out what support you should\nget, why, when, and details of who is meant to provide it. You are entitled to be given\na copy of your care plan and should not sign the care plan until you are happy with\nit.\n\n13. CARING SKILLS - feeling or showing concern for or kindness to others. All\nindividuals in society have “needs” to grow, develop and maintain a healthy\nlifestyle. A “need” is what is required to achieve, maintain or regain the life quality\nfactors. Caring helps individuals meet these needs to be healthy, active and\nindependent. Caring helps individuals with everyday living and supports an\nindividual’s life quality factors. Carers have an enormous influence over the\noutcome of the care that they give. Their actions can have positive or negative\neffects.\n\n14. CATHETER - a tubular medical device for insertion into canals, vessels,\npassageways, or body cavities usually to permit injection or withdrawal of fluids or\nto keep a passage open.\n\n15. CEREBROVASCULAR - the sudden death of some brain cells due to lack of oxygen\nwhen the blood flow to the brain is impaired by blockage or rupture of an artery to the\nbrain. A CVA is also referred to as a stroke.\n\n16. CHRONIC DISEASE - A chronic disease is a condition you can control with treatment\nfor months. Asthma, diabetes, and depression are common examples. Often, they don't\nhave a cure, but you can live with them and manage their symptoms.\n\n17. CLEFT LIP - a birth defect characterized by one or more clefts in the upper lip\nresulting from failure of the embryonic parts of the lip to unite.\n\n18. CLEFT PALATE - congenital fissure of the roof of the mouth\n\n19. CLIENT - a person who engages the professional advice or services of another.\n\n20. CLINICAL WASTE - Clinical waste is the term used to describe waste produced from\nhealthcare and similar activities that may pose a risk of infection, for example, swabs,\nbandages, dressings etc. or may prove hazardous, for example medicines.\n\n21. CLUBFOOT- describes a range of foot abnormalities usually present at birth\n(congenital) in which your baby's foot is twisted out of shape or position. In clubfoot,\nthe tissues connecting the muscles to the bone (tendons) are shorter than usual.\nClubfoot is a fairly common birth defect and is usually an isolated problem for an\notherwise healthy newborn\n\n--- PDF PAGE 247 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 243\n22. COLD THERAPY - As a general rule, cold therapy is used for sudden, acute injuries\nsuch as ankle sprains, muscle years, bruising and inflammation.\n\n23. CONGENITAL DISORDER - is a medical condition that is present at or before birth.\nThese conditions, also referred to as birth defects, can be acquired during the fetal stage\nof development or from the genetic make up of the parents.\n\n24. DISPENSING - is the provision of drugs or medicines as set out properly on\na lawful prescription.\n\n25. ELDERLY- aged; individuals over 65 years old who have functional impairments;\nsometimes used to describe any adult over 75 years old.\n\n 26. FIRST AID - emergency care or treatment given to an ill or injured person before\nregular medical aid can be obtained.\n\n 27. GOUT - is a common and complex form of arthritis that can affect anyone. It's\ncharacterized by sudden, severe attacks of pain, swelling, redness and tenderness\nin the joints, often the joint at the base of the big toe.\n\n 28. GROOMING - the things that you do to make your appearance clean and neat,\nfor example brushing your hair,\nor\nthe\nthings\nthat\nyou\ndo\nto keep an\nanimal's hair or fur clean and neat\n\n29. HOT THERAPY - Heat therapy is primarily used for taking the edge off of several\ndifferent kinds of body pain. Those dull, persistent pains that you get with stiffness\nand cramping, for example.\n\n30. INCONTINENCE - inability of the body to control the evacuative functions of\nurination or defecation: partial or complete loss of bladder or bowel control.\n\n31. INFECTION CONTROL - is the discipline concerned with preventing healthcare-\nassociated\ninfections;\na\npractical\nrather\nthan\nacademic\nsub-discipline\nof epidemiology. Infection control addresses factors related to the spread\nof infections within the healthcare setting, whether among patients, from patients to\nstaff, from staff to patients, or among staff. This includes preventive measures such\nas hand washing, cleaning, disinfecting, sterilizing, and vaccinating. Other aspects\ninclude surveillance, monitoring, and investigating any suspected outbreak of\ninfection, and its management.\n\n32. MEDICATION - a substance used for medical treatment, especially a medicine or\ndrug.\n\n33. MOBILITY - the ability to move or be moved freely and easily.\n\n34. NEBULIZATION - is the process of medication administration via inhalation. It\nutilizes a nebulizer which transports medications to the lungs by means of mist\ninhalation.\n\n35. ORAL CARE – is the practice of keeping the mouth clean and healthy by brushing\nand flossing to prevent tooth decay and gum disease.\n\n--- PDF PAGE 248 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 244\n36. PALLIATIVE CARE - care for the terminally ill and their families, especially that\nprovided by an organized health service.\n\n37. PARKINSONS DISEASE - is a progressive nervous system disorder that affects\nmovement. Symptoms start gradually, sometimes starting with a barely noticeable\ntremor in just one hand. Tremors are common, but the disorder also commonly\ncauses stiffness or slowing of movement.\n\n38. PNEUMONIA - is an infection that inflames the air sacs in one or both lungs. The air\nsacs may fill with fluid or pus (purulent material), causing cough with phlegm or pus,\nfever, chills, and difficulty breathing. A variety of organisms, including bacteria,\nviruses and fungi, can cause pneumonia.\n\n39. PERENIAL CARE - involves cleaning the private areas of a patient. Because this\narea is prone to infection, it must be cleaned at least daily, and more if your loved\none suffers from incontinence. Typical times to perform peri-care include as part of\ndaily bathing, after the use of the bedpan, and following episodes of incontinence.\n\n40. PERSONAL PROTECTIVE EQUIPMENT (PPE) – is protective clothing,\nhelmets, goggles, or other garments or equipment designed to protect the wearer's\nbody from injury or infection.\n\n41. PRESCRIPTION - an instruction written by a medical practitioner that authorizes a\npatient to be provided a medicine or treatment.\n\n42. SKIN CARE - maintaining clean, comfortable and healthy skin through thorough\ncleansing with soap and water, and moisturizing with emollients. Basic skin care also\nincludes treating skin conditions appropriately with medicines and lotions, and\navoiding sun exposure. Age is a factor in skin care. Special consideration should be\ngiven to infants, senior adults and the infirm.\n\n43. SPECIAL NEEDS - any of various difficulties (such as a physical, emotional,\nbehavioral, or learning disability or impairment) that causes an individual to require\nadditional or specialized services or accommodations (such as in education or\nrecreation)\n\n44. THERAPEUTIC COMMUNICATION – an interaction between a health care\nprofessional and a patient that aims to enhance the patient’s comfort, safety, trust,\nor health and well-being.\n\n45. THERAPEUTIC DIET - a therapeutic diet is a meal plan that controls the intake of\ncertain foods or nutrients. It is part of the treatment of a medical condition and are\nnormally prescribed by a physician and planned by a dietician.\n\n46. TOILETING - is the act of assisting a dependent patient with his/her elimination\nneeds.\n\n47. TOURETTE SYNDROME - is a disorder that involves repetitive movements or\nunwanted sounds (tics) that can't be easily controlled. For instance, you might\nrepeatedly blink your eyes, shrug your shoulders or blurt out unusual sounds or\noffensive words.\n\n--- PDF PAGE 249 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 245\n48. VITAL SIGNS – determination of temperature, pulse rate, rate of breathing and level\nof blood pressure.\n\n49. WOUND CARE - refers to specific types of treatment for pressure sores, skin ulcers\nand other wounds that break the skin.\n\n--- PDF PAGE 250 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 246\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) would like to\nextend sincerest thank you and appreciation to the representatives of business, industry,\nacademe and government agencies who provided their time and expertise in the development\nand validation of this Training Regulations.\n\nTHE TECHNICAL AND INDUSTRY EXPERT AND REVIEW PANEL\n\nMS. BERNADETTE DC. ILAGAN, PhD, RN, LPT\nMember\nPhilippine Association of Service Exporters, Inc. (PASEI)\n\nMR. JOEL JOHN A. DELA MERCED, PhD, RN, LPT\nMember\nPhilippine Association of Service Exporters, Inc. (PASEI)\n\nMS. MARIETTA M. SERNA, MAN, RN\nMember\nPhilippine Association of Service Exporters, Inc. (PASEI)\n\nMR. JOEY M. CADANO, PhD, RN, LPT\nMember\nPhilippine Association of Service Exporters, Inc. (PASEI)\n\nMS. MILAFLOR L. VALDEZ\nFounder\nCaregivers of the Philippines Association, Inc. (CPAI)\n\nMR. ANTONIO ALVIN M. COBANGBANG\nChairman, External Affairs and Rules\nCaregivers of the Philippines Association, Inc. (CPAI)\n\nMS. MYRA SOLEDAD E. COBANGBANG\nPresident\nCaregivers of the Philippines Association, Inc. (CPAI)\n\nMS. MA. CHRISTINA BERMUDEZ, RN\nMember\nCaregivers of the Philippines Association, Inc. (CPAI)\n\nMS. SHARON DIMATULAC, MAN, RN\nDean, College of Nursing\nSt. Francis of Assissi College, Las Piñas City\n\n--- PDF PAGE 251 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 247\nThe PARTICIPANTS in the National Validation of this Training Regulation\nName\nOrganization\nDesignation\nConradito D. Ilagan Jr.\nMMS\nCaregiver\nJocelyn L. Aquino\nOverseas Academy, Makati\nTrainer/Assessor\nJosephine C. Maico\nCapt. WPA Foundation Inc.,\nPasay City\nTrainer\nCarolyn C. Calupitan\nSaint Francis of Assisi College,\nLas Piñas City\nFaculty, College of\nNursing\nEduardo M. Lede