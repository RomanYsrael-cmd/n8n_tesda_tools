and procedures Sustain entrepreneurial skills Manage and sustain effective communication strategies Manage and sustain high performing teams Evaluate higher order thinking skills and adjust problem solving techniques Advocate strategic thinking for global citizenship Incorporate innovation into work procedures Develop systems in managing and maintaining information Manage implementation of occupational safety and health programs in the workplace Manage implementation of environmental programs in the workplace Develop and sustain a high- performing enterprise COMPETENCY MAP – HUMAN HEALTH/HEALTH CARE SECTOR CAREGIVING (CLIENTS WITH SPECIAL NEEDS) NC II --- PDF PAGE 243 --- TR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 239 Maintain instruments and equipment in work area Assist in dental laboratory procedures Assist with administration in dental laboratory practice Implement and monitor infection control policies and procedures Respond effectively to difficult/ challenging behavior Apply basic first aid Maintain high standard of patient / client services Apply quality standards Maintain a safe, clean and efficient environment Maintain an effective relationship with clients/ customers (marketing) Update industry knowledge and practice through continuing education Use pharmaceutical calculation techniques and terminologies Maintain an effective relationship with customers and clients Manage own performance Follow occupational health and safety policies in dental laboratory facilities Maintain infection control in dental practice Operate a personal computer Perform workplace security and safety practices Perform computer operations Prepare and maintain beds Collect and maintain linen stocks at end- users location Assist in patient mobility Assist in transporting patients Assist in bio- psychosocial support care of patients Handle waste in a health care environment Plan the hilot wellness program of client/s Provide pre- service to