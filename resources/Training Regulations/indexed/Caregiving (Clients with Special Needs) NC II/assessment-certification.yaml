    {
      "number": "4.1",
      "text": "1 To attain the national qualification of CAREGIVING (CLIENTS WITH SPECIAL NEEDS) NC II, the candidate must demonstrate competence in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "number": "4.1",
      "text": "2 A Certificate of Competency (COC) is issued by the Authority to individuals who were assessed as competent in cluster of related units of competency, namely: COC 1 Provide care and support for children with special needs • Participate in the implementation and monitoring of client’s care plan • Provide assistance and support on environmental and biopsychosocial needs of clients • Develop the ability to recognize healthy body systems and apply medical terminologies • Provide care and support to activities of daily living (ADL) of clients • Provide assistance in administering prescribed medications to clients • Provide care and support to clients with special needs • Respond to emergency situations • Provide immediate care and support to children with special needs COC 2 Provide care and support for adults and elderly with special needs • Participate in the implementation and monitoring of client’s care plan • Provide assistance and support on environmental and biopsychosocial needs of clients • Develop the ability to recognize healthy body systems and apply medical terminologies • Provide care and support to activities of daily living (ADL) of clients • Provide assistance in administering prescribed medications to clients • Provide care and support to clients with special needs • Respond to emergency situations • Provide immediate care and support to adults and elderly with special needs Upon accumulation and submission of all the COCs acquired, an individual shall be issued the corresponding National Certificate for the Qualification. --- PDF PAGE 240 --- TR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 236"
    },
    {
      "number": "4.1",
      "text": "3 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency."
    },
    {
      "number": "4.1",
      "text": "4 Any of the following are qualified to undergo assessment and certification:"
    },
    {
      "number": "4.1",
      "text": "4.1 Graduates of WTR-registered program, NTR-registered programs or formal/non-formal/informal including enterprise-based trainings related to Caregiving (Clients with Special Needs) NC II."
    },
    {
      "number": "4.1",
      "text": "4.2 Experienced workers (wage employed or self-employed) who gained competencies in providing caregiving services for at least one (1) year within the last five (5) years."
    },
    {
      "number": "4.1",
      "text": "5 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences with at least three (3) years of caregiving experience within the last five (5) years may apply for recognition in this Qualification through Portfolio Assessment. Requirements and implementation procedure of Portfolio Assessment must be consistent with TESDA Circular No. 47, series of 2018 on “Implementing Guidelines on the Implementation of Portfolio Assessment Leading to Recognition of Prior Learning (RPL) within the TESDA Assessment and Certification System, and with TESDA Circular No. 118, series of 2019 on “Addendum to the Implementing Guidelines on the Implementation Portfolio Assessment Leading to Recognition of Prior Learning (RPL) within the TESDA Assessment and Certification System.”"
    },
    {
      "number": "4.1",
      "text": "6 Holders of National Certificate (NC) or Certificates of Competency (COC) in Caregiving Services NC II are required to undergo re-assessment under the amended Training Regulations (TRs), upon expiration of their Certificates."
    },
    {
      "number": "4.1",
      "text": "7 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the “Philippine TVET Competency Assessment and Certification System (PTCACS)”."
    },
