  "source_text": "SECTION 1 DEFINITION OF QUALIFICATION\n\nThe CAREGIVING (CLIENTS WITH SPECIAL NEEDS) NC II Qualification consists\nof competencies that a person must achieve to participate in the implementation and\nmonitoring of client’s care plan, provide assistance and support to clients with special\nneeds, recognize healthy body systems and apply medical terminology, provide care to\nclients with special needs, assist in administering medications to clients with special needs,\nprovide care and support to clients with special needs, respond to emergency situations,\nprovide immediate care and support to children with special needs, and provide immediate\ncare and support to adults and elderly with special needs.\n\nThe Units of Competency comprising this Qualification include the following:\n\nUnit Code\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the workplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nUnit Code\nCOMMON COMPETENCIES\nHHC532201\nHHC532202\nHHC532203\nHHC532204\nImplement and monitor infection control policies and procedures\nRespond effectively to difficult/challenging behavior\nApply basic first aid\nMaintain high standard of patient / client services\n\nUnit Code\nCORE COMPETENCIES\nHHC532325\nParticipate in the implementation and monitoring of client’s care plan\nHHC532326\nProvide assistance and support on environment and biopsychosocial\nneeds of clients\nHHC532327\nDevelop the ability to recognize healthy body systems and apply\nmedical terminologies\nHHC532328\nProvide care and support to activities of daily living (ADL) of clients\nHHC532329\nProvide assistance in administering prescribed medications to clients\nHHC532330\nProvide care and support to clients with special needs\nHHC532331\nRespond to emergency situations\nHHC532332\nProvide immediate care and support to children with special needs\nHHC532333\nProvide immediate care and support to adults and elderly with special\nneeds\n\n--- PDF PAGE 6 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 2\n\nA person who has achieved this Qualification is competent to be a:\n Caregiver for people with special needs\n Caregiver for children with special needs\n Caregiver for adults and elderly with special needs\n\n--- PDF PAGE 7 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 3"
