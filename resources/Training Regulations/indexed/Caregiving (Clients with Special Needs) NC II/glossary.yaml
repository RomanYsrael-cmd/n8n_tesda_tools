    {
      "term": "BED SORES",
      "definition": "A painful, often reddened area of degenerating, ulcerated skin caused by pressure and lack of movement, and worsened by exposure to urine or other irritating substances on the skin. Untreated bed sores can become seriously infected or gangrenous. Bed sores are a major problem for patients who are confined to bed or a wheelchair. They can be prevented by moving the patient frequently, changing bedding, and keeping the skin clean and dry. Also called a pressure sore, decubitus sore, or decubitus ulcer. 10. BIOPSYCHOSOCIAL NEEDS - The biopsychosocial model is a method of understanding health and illness through biological, psychological, and social factors. The principle of the biopsychosocial model states that all issues relating to health are products of a complex interplay of these three factors. The model has been both revered and criticized in medical circles. In layman's terms, the biopsychosocial model is known as the mind-body connection. 11. CAREGIVER – a lay individual who assumes responsibility for the physical and emotional needs of another who is incapable of self-care. A person who provides direct care (as for children, elderly people, or the chronically ill). 12. CARE PLAN - A care plan is a written statement of your individual assessed needs identified during a Community Care Assessment. It sets out what support you should get, why, when, and details of who is meant to provide it. You are entitled to be given a copy of your care plan and should not sign the care plan until you are happy with it. 13. CARING SKILLS - feeling or showing concern for or kindness to others. All individuals in society have “needs” to grow, develop and maintain a healthy lifestyle. A “need” is what is required to achieve, maintain or regain the life quality factors. Caring helps individuals meet these needs to be healthy, active and independent. Caring helps individuals with everyday living and supports an individual’s life quality factors. Carers have an enormous influence over the outcome of the care that they give. Their actions can have positive or negative effects. 14. CATHETER - a tubular medical device for insertion into canals, vessels, passageways, or body cavities usually to permit injection or withdrawal of fluids or to keep a passage open. 15. CEREBROVASCULAR - the sudden death of some brain cells due to lack of oxygen when the blood flow to the brain is impaired by blockage or rupture of an artery to the brain. A CVA is also referred to as a stroke. 16. CHRONIC DISEASE - A chronic disease is a condition you can control with treatment for months. Asthma, diabetes, and depression are common examples. Often, they don't have a cure, but you can live with them and manage their symptoms. 17. CLEFT LIP - a birth defect characterized by one or more clefts in the upper lip resulting from failure of the embryonic parts of the lip to unite. 18. CLEFT PALATE - congenital fissure of the roof of the mouth 19. CLIENT - a person who engages the professional advice or services of another. 20. CLINICAL WASTE - Clinical waste is the term used to describe waste produced from healthcare and similar activities that may pose a risk of infection, for example, swabs, bandages, dressings etc. or may prove hazardous, for example medicines. 21. CLUBFOOT- describes a range of foot abnormalities usually present at birth (congenital) in which your baby's foot is twisted out of shape or position. In clubfoot, the tissues connecting the muscles to the bone (tendons) are shorter than usual. Clubfoot is a fairly common birth defect and is usually an isolated problem for an otherwise healthy newborn 22. COLD THERAPY - As a general rule, cold therapy is used for sudden, acute injuries such as ankle sprains, muscle years, bruising and inflammation. 23. CONGENITAL DISORDER - is a medical condition that is present at or before birth. These conditions, also referred to as birth defects, can be acquired during the fetal stage of development or from the genetic make up of the parents. 24. DISPENSING - is the provision of drugs or medicines as set out properly on a lawful prescription. 25. ELDERLY- aged; individuals over 65 years old who have functional impairments; sometimes used to describe any adult over 75 years old. 26. FIRST AID - emergency care or treatment given to an ill or injured person before regular medical aid can be obtained. 27. GOUT - is a common and complex form of arthritis that can affect anyone. It's characterized by sudden, severe attacks of pain, swelling, redness and tenderness in the joints, often the joint at the base of the big toe. 28. GROOMING - the things that you do to make your appearance clean and neat, for example brushing your hair, or the things that you do to keep an animal's hair or fur clean and neat 29. HOT THERAPY - Heat therapy is primarily used for taking the edge off of several different kinds of body pain. Those dull, persistent pains that you get with stiffness and cramping, for example. 30. INCONTINENCE - inability of the body to control the evacuative functions of urination or defecation: partial or complete loss of bladder or bowel control. 31. INFECTION CONTROL - is the discipline concerned with preventing healthcare- associated infections; a practical rather than academic sub-discipline of epidemiology. Infection control addresses factors related to the spread of infections within the healthcare setting, whether among patients, from patients to staff, from staff to patients, or among staff. This includes preventive measures such as hand washing, cleaning, disinfecting, sterilizing, and vaccinating. Other aspects include surveillance, monitoring, and investigating any suspected outbreak of infection, and its management. 32. MEDICATION - a substance used for medical treatment, especially a medicine or drug. 33. MOBILITY - the ability to move or be moved freely and easily. 34. NEBULIZATION - is the process of medication administration via inhalation. It utilizes a nebulizer which transports medications to the lungs by means of mist inhalation. 35. ORAL CARE – is the practice of keeping the mouth clean and healthy by brushing and flossing to prevent tooth decay and gum disease. 36. PALLIATIVE CARE - care for the terminally ill and their families, especially that provided by an organized health service. 37. PARKINSONS DISEASE - is a progressive nervous system disorder that affects movement. Symptoms start gradually, sometimes starting with a barely noticeable tremor in just one hand. Tremors are common, but the disorder also commonly causes stiffness or slowing of movement. 38. PNEUMONIA - is an infection that inflames the air sacs in one or both lungs. The air sacs may fill with fluid or pus (purulent material), causing cough with phlegm or pus, fever, chills, and difficulty breathing. A variety of organisms, including bacteria, viruses and fungi, can cause pneumonia. 39. PERENIAL CARE - involves cleaning the private areas of a patient. Because this area is prone to infection, it must be cleaned at least daily, and more if your loved one suffers from incontinence. Typical times to perform peri-care include as part of daily bathing, after the use of the bedpan, and following episodes of incontinence. 40. PERSONAL PROTECTIVE EQUIPMENT (PPE) – is protective clothing, helmets, goggles, or other garments or equipment designed to protect the wearer's body from injury or infection. 41. PRESCRIPTION - an instruction written by a medical practitioner that authorizes a patient to be provided a medicine or treatment. 42. SKIN CARE - maintaining clean, comfortable and healthy skin through thorough cleansing with soap and water, and moisturizing with emollients. Basic skin care also includes treating skin conditions appropriately with medicines and lotions, and avoiding sun exposure. Age is a factor in skin care. Special consideration should be given to infants, senior adults and the infirm. 43. SPECIAL NEEDS - any of various difficulties (such as a physical, emotional, behavioral, or learning disability or impairment) that causes an individual to require additional or specialized services or accommodations (such as in education or recreation) 44. THERAPEUTIC COMMUNICATION – an interaction between a health care professional and a patient that aims to enhance the patient’s comfort, safety, trust, or health and well-being. 45. THERAPEUTIC DIET - a therapeutic diet is a meal plan that controls the intake of certain foods or nutrients. It is part of the treatment of a medical condition and are normally prescribed by a physician and planned by a dietician. 46. TOILETING - is the act of assisting a dependent patient with his/her elimination needs. 47. TOURETTE SYNDROME - is a disorder that involves repetitive movements or unwanted sounds (tics) that can't be easily controlled. For instance, you might repeatedly blink your eyes, shrug your shoulders or blurt out unusual sounds or offensive words. 48. VITAL SIGNS – determination of temperature, pulse rate, rate of breathing and level of blood pressure. 49. WOUND CARE - refers to specific types of treatment for pressure sores, skin ulcers and other wounds that break the skin."
