ng, after the use of the bedpan, and following episodes of incontinence.\n\n40. PERSONAL PROTECTIVE EQUIPMENT (PPE) – is protective clothing,\nhelmets, goggles, or other garments or equipment designed to protect the wearer's\nbody from injury or infection.\n\n41. PRESCRIPTION - an instruction written by a medical practitioner that authorizes a\npatient to be provided a medicine or treatment.\n\n42. SKIN CARE - maintaining clean, comfortable and healthy skin through thorough\ncleansing with soap and water, and moisturizing with emollients. Basic skin care also\nincludes treating skin conditions appropriately with medicines and lotions, and\navoiding sun exposure. Age is a factor in skin care. Special consideration should be\ngiven to infants, senior adults and the infirm.\n\n43. SPECIAL NEEDS - any of various difficulties (such as a physical, emotional,\nbehavioral, or learning disability or impairment) that causes an individual to require\nadditional or specialized services or accommodations (such as in education or\nrecreation)\n\n44. THERAPEUTIC COMMUNICATION – an interaction between a health care\nprofessional and a patient that aims to enhance the patient’s comfort, safety, trust,\nor health and well-being.\n\n45. THERAPEUTIC DIET - a therapeutic diet is a meal plan that controls the intake of\ncertain foods or nutrients. It is part of the treatment of a medical condition and are\nnormally prescribed by a physician and planned by a dietician.\n\n46. TOILETING - is the act of assisting a dependent patient with his/her elimination\nneeds.\n\n47. TOURETTE SYNDROME - is a disorder that involves repetitive movements or\nunwanted sounds (tics) that can't be easily controlled. For instance, you might\nrepeatedly blink your eyes, shrug your shoulders or blurt out unusual sounds or\noffensive words.\n\n--- PDF PAGE 249 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 245\n48. VITAL SIGNS – determination of temperature, pulse ra