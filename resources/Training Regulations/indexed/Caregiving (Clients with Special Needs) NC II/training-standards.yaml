    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for CAREGIVING (CLIENTS WITH SPECIAL NEEDS) NC II.\n\n3.1.\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany the curricula.\n\nCourse Title:\nCAREGIVING (Clients with\nSpecial Needs)\nNC Level: NC II\n\nNominal Training Duration:\n\n37 hours\nBasic Competencies\n112 hours\nCommon Competencies\n504 hours\nCore Competencies\n653 hours\n160 hours\nSupervised Industry Learning (SIL)\n813 hours TOTAL\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, skills and\nattitude, applicable in performing work activities involve in providing care and support\nto clients with special needs – children with special needs and adult and elderly with\nspecial needs. This include classroom learning activities and practical work in actual\nwork site or simulation area.\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed\nfor this qualification must be achieve.\n\n--- PDF PAGE 154 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 150\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and systems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different types of question\n•\nGather different sources of information\n•\nApply storage system in establishing\nworkplace information\n•\nDemonstrate Telephone courtesy\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n1.2. Perform duties\nfollowing\nworkplace\ninstructions\n•\nRead:\no Written notices and instructions\no Workplace interactions and procedures\n•\nRead instructions on work related\nforms/documents\n•\nPerform workplace duties scenario following\nworkplace instructions\n• Group discussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n1.3. Complete\nrelevant work-\nrelated\ndocuments\n•\nDescribe communication procedures and\nsystems\n•\nRead:\no Meeting protocols\no Nature of workplace meetings\no Workplace interactions\no Barriers of communication\n• Group discussion\n• Lecture\n• Demonstration\n• Role play\n• Oral evaluation\n• Written examination\n• Observation\n2 hours\n\n--- PDF PAGE 155 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 151\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nRead instructions on work related\nforms/documents\n•\nPractice:\no Estimate, calculate and record routine\nworkplace measures\no Basic mathematical processes of addition,\nsubtraction, division and multiplication\n•\nDemonstrate office activities in:\no workplace meetings and discussions\nscenario\n•\nPerform workplace duties scenario following\nsimple written notices\n•\nFollow simple spoken language\n•\nIdentify the different Non-verbal\ncommunication\n•\nDemonstrate ability to relate to people of social\nrange in the workplace\n•\nGather and provide information in response to\nworkplace requirements\n•\nComplete work-related documents\n2. Work in a team\nenvironment\n2.1 Describe team\nrole and scope\n•\nDiscussion on team roles and scope\n•\nParticipate in the discussion:\no\nDefinition of Team\no\nDifference between team and group\no Objectives and goals of team\n•\nLocate needed information from the different\nsources of information\n• Lecture/ Discussion\n• Group Work\n• Individual Work\n• Role Play\n• Role Play\n• Case Study\n• Written Test\n1 hour\n2.2 Identify one’s\nrole and\nresponsibility\nwithin team\n•\nRole play:\no individual role and responsibility\n•\nRole Play\no Understanding Individual differences\n•\nDiscussion on gender sensitivity\n• Role Play\n• Lecture/ Discussion\n• Role Play\n• Written Test\n1 hour\n2.3 Work as a team\nmember\n• Participate in group planning activities\n• Role play : Communication protocols\n• Group work\n• Role Play\n• Role Play\n• Written Test\n1 hour\n\n--- PDF PAGE 156 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 152\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Participate in the discussion of standard work\nprocedures and practices\n• Lecture/ Discussion\n3. Solve/address\nroutine problems\n3.1 Identify routine\nproblems\n• Review of the current industry hardware and\nsoftware products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes and\nprocedures\n• Make use of the industry standard diagnostic\ntools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Analyze routine/procedural problems\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n3.2 Look for\nsolutions to\nroutine\nproblems\n• Review of the current industry hardware and\nsoftware products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes and\nprocedures\n• Make use of the industry standard diagnostic\ntools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Formulate possible solutions to problems and\ndocument procedures for reporting\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 hour\n3.3 Look for\nsolutions to\nroutine\nproblems\n• Review of the current industry hardware and\nsoftware products and services\n• Identify correctly the industry maintenance,\nservice and helpdesk practices, processes and\nprocedures\n• Make use of the industry standard diagnostic\ntools\n• Share best practices in determining basic\nmalfunctions and resolutions to general\nproblems in the workplace\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n\n--- PDF PAGE 157 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 153\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Formulate possible solutions to problems and\ndocument procedures for reporting\n4. Develop Career\nand Life\nDecisions\n4.1 Manage one’s\nemotion\n• Demonstrate self-management strategies that\nassist in regulating behavior and achieving\npersonal and learning goals\n• Explain enablers and barriers in achieving\npersonal and career goals\n• Identify techniques in handling negative\nemotions and unpleasant situation in the\nworkplace such as frustration, anger, worry,\nanxiety, etc.\n• Manage properly one’s emotions and recognize\nsituations that cannot be changed and accept\nthem and remain professional\n• Recall instances that demonstrate self-\ndiscipline, working independently and showing\ninitiative to achieve personal and career goals\n• Share experiences that show confidence, and\nresilience in the face of setbacks and\nfrustrations and other negative emotions and\nunpleasant situations in the workplace\n• Discussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 hour\n4.2 Develop\nreflective\npractice\n• Enumerate strategies to improve one’s attitude\nin the workplace\n• Explain Gibbs’ Reflective Cycle/Model\n(Description, Feelings, Evaluation, Analysis,\nConclusion, and Action plan)\n• Use basic SWOT analysis as self-assessment\nstrategy\n• Develop reflective practice through realization of\nlimitations, likes/ dislikes; through showing of\nself-confidence\n• Demonstrate self-acceptance and being able to\naccept challenges\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• 5 Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 hour\n\n--- PDF PAGE 158 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 154\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4.3 Boost self-\nconfidence\nand develop\nself-regulation\n• Describe the components of self-regulation\nbased on Self-Regulation Theory (SRT)\n• Explain personality development concepts\n• Cite self-help concepts (e. g., 7 Habits by\nStephen Covey, transactional analysis, psycho-\nspiritual concepts)\n• Perform effective communication skills –\nreading, writing, conversing skills\n• Show affective skills – flexibility, adaptability,\netc.\n• Determine strengths and weaknesses\n• Small Group\nDiscussion\n• Interactive Lecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Case problems\ninvolving workplace\ndiversity issues\n\n1 hour\n5. Contribute to\nworkplace\ninnovation\n5.1 Identify\nopportunities to\ndo things better\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Explain the concepts of positive impacts and\nchallenges in innovation\n• Show mastery of the different types of changes\nand levels of participation in the workplace\n• Discuss 7 habits of highly effective people\n• Interactive Lecture\n• Appreciative Inquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports of\non-the-job\nperformance\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n1 hour\n5.2 Discuss and\ndevelop ideas\nwith others\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Explain the concepts of positive impacts and\nchallenges in innovation\n• Show mastery of the different types of changes\nand levels of participation in the workplace\n• Interactive Lecture\n• Appreciative Inquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n1 hour\n\n--- PDF PAGE 159 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 155\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Discuss 7 habits of highly effective people\n• Communicate ideas through small group\ndiscussions and meetings\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports of\non-the-job\nperformance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n5.3 Integrate ideas\nfor change in\nthe workplace\n\n• Identify different roles of individuals in\ncontributing to doing things better in the\nworkplace\n• Explain the concepts of positive impacts and\nchallenges in innovation\n• Show mastery of the different types of changes\nand levels of participation in the workplace\n• Discuss 7 habits of highly effective people\n• Communicate ideas through small group\ndiscussions and meetings\n• Demonstrate basic skills in data analysis\n• Interactive Lecture\n• Appreciative Inquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of portfolios\nof evidence and\nthird-party\nworkplace reports of\non-the-job\nperformance.\n• Standardized\nassessment of\ncharacter strengths\nand virtues applied\n1 hour\n6. Present relevant\ninformation\n6.1 Gather data/\ninformation\n• Lecture and discussion on:\n- Organisational protocols\n- Confidentiality and accuracy\n- Business mathematics and statistics\n- Legislation, policy and procedures relating\nto the conduct of evaluations\n• Reviewing data/ information\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 hours\n\n--- PDF PAGE 160 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 156\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n6.2 Assess\ngathered data/\ninformation\n• Lecture and discussion on:\n- Data analysis techniques/ procedures\n- Organisational values, ethics and codes of\nconduct\n- Trends and anomalies\n• Computing business mathematics and statistics\n• Application of data analysis techniques\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 hours\n6.3 Record and\npresent\ninformation\n• Lecture and discussion on:\n- Reporting requirements to a range of\naudiences\n- Recommendations for possible\nimprovements\n• Analysis and comparison of interim and final\nreports’ outcomes\n• Reporting of data findings\n• Group discussion\n• Lecture\n• Demonstration\n• Role Play\n• Practical exercises\n\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n3 hours\n7. Practice\nOccupational\nSafety and\nHealth Policies\nand Procedures\n7.1 Identify OSH\ncompliance\nrequirements\n• Discussion regarding:\n- Hierarchy of Controls\n- Hazard Prevention and Controls\n- Work Standards and Procedures\n- Personal Protective Equipment\n•\nLecture\n•\nGroup Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 hour\n7.2 Prepare OSH\nrequirements\nfor compliance\n• Identification of required safety materials, tools\nand equipment\n• Handling of safety control resources\n\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 hour\n7.3 Perform tasks\nin accordance\nwith relevant\nOSH policies\nand procedures\n•\nDiscussion of General OSH Standards and\nPrinciples\n• Performing industry related work activities in\naccordance with OSH Standards\n• Lecture\n• Group Discussion\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n2 hours\n\n--- PDF PAGE 161 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 157\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n8. Exercise\nEfficient and\nEffective\nSustainable\nPractices in the\nWorkplace\n8.1 Identify the\nefficiency and\neffectiveness of\nresource\nutilization\n• Identify the processes on environmental policies\n• Relate the necessary skills in response to\nchanging environmental policies needs\n-\nWaste Management Skills\n-\nConservation of Energy in workplace\n• Lecture\n• Group Discussion\n• Simulation\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n8.2 Determine\ncauses of\ninefficiency\nand/or\nineffectiveness\nof resource\nutilization\n• Discussion of environmental protection and\nresource efficiency targets\n• Analysis on the relevant work procedure\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n8.3 Convey\ninefficient and\nineffective\nenvironmental\npractices\n• Identification of (re)training needs and usage of\nenvironment friendly methods and technologies\n• Identification of environmental corrective actions\n• Practicing environment awareness\n• Lecture\n• Group Discussion\n• Role Play\n• Demonstration\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\n• Questioning\n1 hour\n9. Practice\nEntrepreneurial\nSkills in the\nWorkplace\n9.1 Apply\nentrepreneurial\nworkplace best\npractices\n• Case studies on best entrepreneurial practices\n• Discussion on quality procedures and practices\n• Case studies on cost consciousness in resource\nutilization\n• Case Study\n• Lecture/\nDiscussion\n• Case Study\n• Written Test\n• Interview\n1 hour\n9.2 Communicate\nentrepreneurial\nworkplace best\npractices\n• Discussion on communicating entrepreneurial\nworkplace best practices\n\n• Lecture/\nDiscussion\n• Written Test\n• Interview\n1 hour\n9.3 Communicate\nentrepreneurial\nworkplace best\npractices\n• Discussion on communicating entrepreneurial\nworkplace best practices\n\n• Lecture/\nDiscussion\n• Written Test\n• Interview\n1 hour\n\n--- PDF PAGE 162 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 158\nCOMMON COMPETENCIES\n(112 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1 Implement\nand monitor\ninfection\ncontrol\npolicies and\nprocedures\n(32 hours)\n1.1 Provide\ninformation to\nthe work group\nabout the\norganization's\ninfection\ncontrol policies\nand\nprocedures.\n•\nLecture and discussion on:\n-\nUse of personal protective equipment (PPE)\n-\nTransmission of infectious diseases\n-\nConcepts and modes of communication\n-\nCommunication equipment (computer,\ntelephone, cell phone etc.)\n-\nOSH, infection control, environmental and\ninstitutional, rules, guidelines, policies and\nprocedures\n-\nRespecting for patient / client rights\n-\nLiteracy levels and communication skills of\nwork group members and consequent suitable\ncommunication techniques\n•\nDemonstrate proper use of personal protective\nequipment (PPE)\n•\nDemonstrate proper hand washing (WHO\nStandard)\n•\nApply Body Substance Isolation (BSI) by using\nPPE (Personal Protective Equipment)\n•\nDemonstrate use of disinfectant\n•\nApply social distancing\n•\nDemonstrate operating equipment for\ncommunication\n•\nApply effective communicating and\ninterpersonal skills including:\n-\nlanguage competence\n-\nliteracy and reading competence\n-\nnegotiating Skills\n-\nintra and Interpersonal skills\n• Lecture (online / face\nto face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to face)\n• Demonstration\n• Role play\n\n• Written test (online /\nface to face)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration with\nquestioning\n12 hours\n\n1.2 Integrate the\norganization's\n•\nLecture and discussion on:\n• Lecture (online / face\nto face)\n• Written test (online /\nface to face)\n12 hours\n\n--- PDF PAGE 163 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 159\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\ninfection\ncontrol policy\nand procedure\ninto work\npractices\n-\nUse of verbal and non-verbal therapeutic\ncommunication\n-\nRA 11058 – OSH Law\n-\nRA 9008 – Ecological Solid Waste\nManagement Act\n-\nRA 856 – Sanitation Code of the Phil.\n-\nHazards and infectious risk\n-\nSafe work procedures\n-\nUse of computer for documentation and\nreporting\n•\nDemonstrate appropriate wearing, removal and\ndisposal of PPE (Personal Protective\nEquipment)\n•\nEncourage employees to report hazards and\nrisks in the work place\n•\nRecognize suggestions of employees to\nimprove infection control practices\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to face)\n• Demonstration\n• Role play\n\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration with\nquestioning\n\n1.3 Monitor\ninfection\ncontrol\nperformance\nand implement\nimprovements\nin practices\n•\nLecture and discussion on:\n-\nKey performance indicators of infection control\nand prevention\n-\nMonitoring, surveillance and investigation of\ninfection risks and hazardous events\n-\nAggregate infection control information reports\n•\nDemonstrate identification, correction and\nreporting inadequacies in work procedures and\ninfection control measures\n• Lecture (online / face\nto face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to face)\n• Demonstration\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n• Demonstration with\noral questioning\n8 hours\n\n2. Respond\neffectively to\ndifficult/\nchallenging\nbehavior\n(24 hours)\n2.1 Plan responses\n•\nLecture and discussion on:\n-\nConcepts and modes of communication\n-\nEnvironmental and institutional, rules,\nguidelines, policies and procedures\n-\nIssues relating to difficult and challenging\nbehavior\n-\nPatient / client issues which need to be\nreferred to an appropriate health professional\n• Lecture (online / face\nto face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to face)\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n• Demonstration with\noral questioning\n12 hours\n\n--- PDF PAGE 164 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 160\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n-\nPolicies and rules of health professionals\ninvolved with the care of patient / client\n-\nLiteracy levels and communication skills of\nwork group members and consequent suitable\ncommunication techniques\n-\nModes of verbal, non-verbal, and written\ncommunication\n•\nApply thinking and responding quickly and\nstrategically\n•\nRemain alert to potential incidents of difficult or\nchallenging behavior\n•\nDemonstrate working with others and display\nempathy with patient / client and relatives\n•\nApply intra and interpersonal skills\n•\nDemonstrate reporting and documentation with\naccuracy\nDemonstratio\nn\n2.2 Apply response\n•\nLecture and discussion on:\n-\nSuitable communication techniques to achieve\nthe desired outcomes in responding to difficult\nor challenging behavior\n•\nApply thinking and responding quickly and\nstrategically\n•\nRemain alert to potential incidents of difficult or\nchallenging behavior\n•\nDemonstrate working with others and display\nempathy with patient / client and relatives\n•\nApply intra and interpersonal skills Demonstrate\nreporting and documentation with accuracy\n• Lecture (online / face\nto face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to face)\n• Demonstration\n• Role play\n\n• Written test (online /\nface to face)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration with\nquestioning\n8 hours\n2.3 Report and\nreview\nincidents\n•\nLecture and discussion about the concepts of\nincident reports and documentations\n•\nOutline organizational policies in reporting and\nre