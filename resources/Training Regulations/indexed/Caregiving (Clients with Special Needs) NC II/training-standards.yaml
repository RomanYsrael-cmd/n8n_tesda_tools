/09/2020) 233\n2\nPCS\nCervical Collar ( Type: Plastic and Foam, Quantity: 1pc per\ntype)\nMATERIALS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n26\nPCS\nTriangular Bandage ( Size: Large)\n26\nPCS\nElastic Bandage ( Size: 4 inches )\n2\nBOXES\nMicropore tape or plaster tape ( size : 1 inch, 3 inches\nQuantity: 1 box per size)\n3\nPCS\nSpinal Board strap\n1\nPC\nCast splint\nINSTRUCTIONAL MATERIALS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n5\nCOPIES\nCompetency-Based Learning Module (CBLM)\n1\nCOPY\nModule of Instruction: Providing Immediate Care and Support\nTo Adults and Elderly with Special Needs\n\n--- PDF PAGE 238 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 234\n3.5\nTRAINING FACILITIES\n The Caregiving Learning Facility must be of concrete structure. Based on a class\nintake of 25 students/trainees, the space requirements for the teaching / learning and\ncurriculum areas are as follows.\n\nSpace Requirement\nSize in\nMeters\nArea in Sq.\nMeters\nTotal Area in\nSq. Meters\nAdministrative/ Office Area\n\n15\n15\nTraining Resource Area\n\n10\n10\nPractical Work Area- Person with\nspecial needs Adult and Elderly\n\n25\n25\nPractical Work Area- Person with\nspecial needs – Children\n\n20\n20\nContextual Learning Area\n\n30\n30\nLearning Resource Area\n\n15\n15\nSupport/Computer Area\n\n10\n10\nCirculation Area\n\n30\n30\nCareer Counseling Area\n\n5\n5\nClinic/Lactating Room\n\n5\n5\nComfort Room for Special Child and\nElderly\n\n10\n10\nSeparate restrooms for female and\nmale\n\n10\n10\nTotal workshop area:\n185 sq. m.\n NOTE: Access to and use of equipment /facilities can be provided through cooperative\n arrangements or MOA with other partner/companies.\n\n3.6 TRAINER’S QUALIFICATIONS FOR CAREGIVING (CLIENTS WITH SPECIAL\nNEEDS) NC II\n• Must be a holder of a current National TVET Trainer Certificate (NTTC) Level I in\nCaregiving (Clients with Special Needs) NCII\n• Must be a holder of any allied health courses or Bachelor’s degree\n• Must possess good communication skills\n• Must have at least two (2) years industry experience within the last five (5) years\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the\nachievements of the requirements of the qualification to enable the trainer make\njudgement whether the trainee is competent or not competent.\n\n--- PDF PAGE 239 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 235"
