esentation\n(offline / face to face)\n• Written test (online\n/ face to face)\n• Interview\n• Portfolio\nassessment\n• Demonstration with\noral questioning\n12 hours\n\n--- PDF PAGE 164 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 160\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n-\nPolicies and rules of health professionals\ninvolved with the care of patient / client\n-\nLiteracy levels and communication skills of\nwork group members and consequent suitable\ncommunication techniques\n-\nModes of verbal, non-verbal, and written\ncommunication\n•\nApply thinking and responding quickly and\nstrategically\n•\nRemain alert to potential incidents of difficult or\nchallenging behavior\n•\nDemonstrate working with others and display\nempathy with patient / client and relatives\n•\nApply intra and interpersonal skills\n•\nDemonstrate reporting and documentation with\naccuracy\nDemonstratio\nn\n2.2 Apply response\n•\nLecture and discussion on:\n-\nSuitable communication techniques to achieve\nthe desired outcomes in responding to difficult\nor challenging behavior\n•\nApply thinking and responding quickly and\nstrategically\n•\nRemain alert to potential incidents of difficult or\nchallenging behavior\n•\nDemonstrate working with others and display\nempathy with patient / client and relatives\n•\nApply intra and interpersonal skills Demonstrate\nreporting and documentation with accuracy\n• Lecture (online / face\nto face)\n• Discussion (online /\nface to face)\n• Self-Learning\n• Video Presentation\n(offline / face to face)\n• Demonstration\n• Role play\n\n• Written test (online /\nface to face)\n• Interview\n• Portfolio\nassessment\n• Observation\n• Demonstration with\nquestioning\n8 hours\n2.3 Report and\nreview\nincidents\n•\nLecture and discussion about the concepts of\nincident reports and documentations\n•\nOutline organizational policies in reporting a