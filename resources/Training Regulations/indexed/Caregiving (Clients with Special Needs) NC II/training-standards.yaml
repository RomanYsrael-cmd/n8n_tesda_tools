formance of Isometric, and\nactive and passive ROM exercises to all\nextremities\n\n• Cerebrovascular Accident (CVA)\no Positioning to prevent contractures\no Using a foot board\no Applying a posterior splint\no Preventing external rotation of hip joint with a\ntrochanter roll\no Using a volar resting splint to support wrist and\nhand\no Demonstrating procedures to maintain skin\nintegrity\n\n• Pneumonia\no Demonstrating turning procedures\no Demonstrating coughing procedures\no Demonstrating percussion therapy\no Demonstrating semi fowlers position\n\n•\ndemonstration\n•\nrole play\n\n•\ndemonstration\n•\noral questioning\n\n--- PDF PAGE 213 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 209\n9.8 Provide care\nand support to\nclients with\nmuscle strain\nand muscle\nspasm\nListen / read and apply the following topics\n• Medical terminologies\n• Characteristics and causes of muscle spasm\nand muscle strain\n• Pain relieving techniques\n• Proper body mechanics\n• Posture and mobility exercises\n• Weight loss programs\n• Classifications and side effects of medications\nfor muscle spasticity\n• Types of splints, braces and casts and its\nbenefits\n• Causes and care for pressure sores\n• lecture / PowerPoint\npresentation\n• group discussion\n• self-learning\n• blended learning\n• online learning\n\n• oral questioning\n• self-check\n• written test (online /\noffline / face-to-\nface)\n8 hours\nPerform the following:\n• Demonstrating proper bed positioning of client\n• Performing diaphragmatic breathing technique\n• Demonstrating stretching exercises\n•\ndemonstration\n•\nrole play\n\n• demonstration\n• oral questioning\n\n9.9 Provide care\nand support in\na homecare\nsetting to\nclients with\nfracture and\ndislocation\nListen /read and apply the following topics\n• Types of fracture\n• Stabilization and alignment of fractures\n• Muscle relaxation techniques\n• Strength and mobility maintenance of\nunaffected muscles\n• Inflammation relief in injured tissues\n• Stress relief and emotional support techniques\n• lecture / PowerPoint\npresentation\n• group discussion\n• self-learning\n• blended learning\n• online learning\n\n• oral questioning\n• self-check\n• written test (online /\noffline / face-to-\nface)\n8 hours\nPerform the following:\n• Maintaining immobilization of affected part by\nmeans of bed rest, cast, splint, traction.\n• Demonstrating alternative comfort measures to\nimprove circulation\n• Demonstrating progressive muscle relaxation\ntechniques\n•\ndemonstration\n•\nrole play\n\n• demonstration\n• oral questioning\n\n--- PDF PAGE 214 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 210\n12.3 Document\nand report\nclient\nactivities\nListen / read and apply the following topics\n• Individual findings, including factors affecting,\ninteractions, nature of social exchanges,\nspecifics of individual behavior.\n• Cultural and religious beliefs, and expectations.\n• Plan of care.\n• Teaching plan.\n• Responses to interventions, teaching, and\nactions performed.\n• Attainment or progress toward the desired\noutcome\n• lecture / PowerPoint\npresentation\n• group discussion\n• self-learning\n• blended learning\n• online learning\n\n• oral questioning\n• self-check\n• written test (online /\noffline / face-to-\nface)\n4 hours\nPerform the following:\n• Recording of progression of activities\n• Recording possible changes in function; loss of\nabilities\n• Documenting diary form\n• Documenting client profile\n\n•\ndemonstration\n•\nrole play\n\n• demonstration\n• oral questioning\n\n--- PDF PAGE 215 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 211\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\n\n--- PDF PAGE 216 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 212\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\nthe deployment of trainees in the workplace is adhered to training\nprograms agreed by the institution and enterprise and status and progress\nof trainees are closely monitored by the training institutions to prevent\nopportunity for work exploitation.\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training\nis integrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based\n\n• Community-Based – short term programs conducted by non-government\norganizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training\nprogram (MTP).\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this program must possess the\nfollowing requirements:\n• Completed at least 10 years basic education or Holder of Alternative Learning\nSystems (ALS) certificate of completion with grade 10 equivalent;\n• Basic communication skills\n\n--- PDF PAGE 217 ---\nTR - Caregiving (Clients with Special Needs) NC II Revision 00 Promulgated (06/09/2020) 213\n3.4\nTOOLS, MATERIALS AND EQUIPMENT\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for CAREGIVING (CLIENTS WITH SPECIAL NEEDS) NC II.\nUp-to-date tools, materials, and equipment of equivalent functions can be used\nas alternatives. This also applies in consideration of community practices and their\navailability in the local market.\n\nTRAINING RESOURCE AREA\nEQUIPMENT\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n1\nPC\nComputer table\n3\nSETS\nOffice table (regular size) with chairs\n2\nPC\nSteel cabinet\n1\nSET\nComputer with complete accessories and applications\n1\nUNIT\nTelephone with internet\n1\nSET\nPrinter\n1\nUNIT\nAir conditioning unit\n1\nPC\nWall clock\n2\nSET\nFirst Aid Kit\n1\nPC\nRechargeable Emergency Lamp\n2\nPC\nFire Extinguisher\n1\nPC\nBulletin board\nTOOLS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n2\nPCS\nScissors\n1\nPCS\nStapler\n1\nPCS\nPuncher\n1\nPC\nWhite board eraser\nMATERIALS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n1\nREAM\nA4, letter, legal bond paper (each)\n25\nPCS\nLong , short Folder each\n25\nPCS\nLong , short Envelop each\n1\nREAM\nA4, letter, legal bond paper (each)\n1\nBOX\nFastener\n1\nBOX\nStaple wire\n3\nPCS\nBallpen / ink correction tape / fluid\n1\nBOX\nPaper clip\n2\nPCS\nWhite board markers (RED,BLUE, BLACK (each)\n3\nPCS\nPencil eraser\nINSTRUCTIONAL MATERIALS and LEARNING GUIDES\nQTY\nUNIT\nDESCRIPTION/SPECIFIC