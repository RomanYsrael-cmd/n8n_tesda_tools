      "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for Medical Transcription.\n\n3.1.\nCURRICULUM DESIGN\n\nCourse Title:\nMEDICAL TRANSCRIPTION NC Level: NC II\nNominal Training Hours:\n18 HOURS (Basic) + 18 Hours (Common)\nCourse Description:\n\nThis course is designed to develop the basic knowledge, desirable\nattitudes, and skills of a medical transcriptionist.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved:\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 39 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n37\n\nCOMMON COMPETENCIES\n\nSECTOR:\nINFORMATION AND COMMUNICATION TECHNOLOGY (ICT) NC II\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Apply Quality\nStandards\n\n1.1. Asses quality of\nreceived materials\n\n1.2. Assess own work\n\n1.3. Engage in quality\nimprovement\n\n1. Field trip\n\n2. Symposium\n\n3. Problem\nsolving\n\n4. Film showing\n\n5. Simulation\n\n6. Individualize\nlearning\n\n7. On the job\ntraining\n1. Demonstration\nand questioning\n\n2. Observation\nand questioning\n\n3. Third party\nreport\n\n2. Perform\nComputer\nOperation\n2.1. Set-up workstation\n\n2.2. Prepare storage\nmedia\n\n2.3. Work with files and\nobjects\n\n2.4. Manipulate word\nprocessing software\n\n2.5. Manipulate\nspreadsheet software\n\n2.6. Manipulate customize\nand database\napplications\n\n2.6. Utilize the internet\n\n2.7. Maintain computer\nhardware and\nsoftware\n1. Modular\n\n2. Film showing\n\n3. Computer\nbased training\n(e-learning)\n\n4. Project method\n\n5. On the job\ntraining\n\n1. Demonstration\nand questioning\n\n2. Observation\nand questioning\n\n3. Third party\nreport\n\n4. Assessment of\noutput product\n\n5. Portfolio\n\n6. Computer\nbased\nassessment\n\n--- PDF PAGE 40 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n38\nCORE COMPETENCIES\n\nCourse Title:\nMEDICAL TRANSCRIPTION NC Level: NC II\nNominal Training Hours:\n360 HOURS\nCourse Description:\nThis course is designed to develop knowledge, desirable attitudes, and\nskills in preparing medical reports from dictated recordings made by\nphysicians and other health care professionals. It covers specialized\ncompetencies such as using business technology, use medical terminology to\ncarry out tasks, and produce text from audio transcription.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved:\n\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Use Business\nTechnology\n\n1.1