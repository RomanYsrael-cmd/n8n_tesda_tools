      "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for Medical Transcription.\n\n3.1.\nCURRICULUM DESIGN\n\nCourse Title:\nMEDICAL TRANSCRIPTION NC Level: NC II\nNominal Training Hours:\n18 HOURS (Basic) + 18 Hours (Common)\nCourse Description:\n\nThis course is designed to develop the basic knowledge, desirable\nattitudes, and skills of a medical transcriptionist.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved:\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 39 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n37\n\nCOMMON COMPETENCIES\n\nSECTOR:\nINFORMATION AND COMMUNICATION TECHNOLOGY (ICT) NC II\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Apply Quality\nStandards\n\n1.1. Asses quality of\nreceived materials\n\n1.2. Assess own work\n\n1.3. Engage in quality\nimprovement\n\n1. Field trip\n\n2. Symposium\n\n3. Problem\nsolving\n\n4. Film showing\n\n5. Simulation\n\n6. Individualize\nlearning\n\n7. On the job\ntraining\n1. Demonstration\nand questioning\n\n2. Observation\nand questioning\n\n3. Third party\nreport\n\n2. Perform\nComputer\nOperation\n2.1. Set-up workstation\n\n2.2. Prepare storage\nmedia\n\n2.3. Work with files and\nobjects\n\n2.4. Manipulate word\nprocessing software\n\n2.5. Manipulate\nspreadsheet software\n\n2.6. Manipulate customize\nand database\napplications\n\n2.6. Utilize the internet\n\n2.7. Maintain computer\nhardware and\nsoftware\n1. Modular\n\n2. Film showing\n\n3. Computer\nbased training\n(e-learning)\n\n4. Project method\n\n5. On the job\ntraining\n\n1. Demonstration\nand questioning\n\n2. Observation\nand questioning\n\n3. Third party\nreport\n\n4. Assessment of\noutput product\n\n5. Portfolio\n\n6. Computer\nbased\nassessment\n\n--- PDF PAGE 40 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n38\nCORE COMPETENCIES\n\nCourse Title:\nMEDICAL TRANSCRIPTION NC Level: NC II\nNominal Training Hours:\n360 HOURS\nCourse Description:\nThis course is designed to develop knowledge, desirable attitudes, and\nskills in preparing medical reports from dictated recordings made by\nphysicians and other health care professionals. It covers specialized\ncompetencies such as using business technology, use medical terminology to\ncarry out tasks, and produce text from audio transcription.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved:\n\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Use Business\nTechnology\n\n1.1 Select appropriate\ntechnology and\nsoftware for MT\ntasks\n1.2 Process and\norganize MT data\n1.3 Maintain business\ntechnology\nequipment\n• Lecture\n\n• Discussions\n\n• Demonstrations\n\n• Written\nexamination\n\n• Demonstration\n\n• Interview\n\n2. Use Medical\nTerminology\nto Carry out\nTasks\n\n2.1 Prepare report\nusing medical\nterminology\n\n• Lecture\n\n• Discussions\n\n• Demonstrations\n• Written\nexamination\n\n• Demonstration\n\n• Interview\n3. Produce Text\nfrom Audio\nTranscription\n\n3.1 Prepare for audio\ntranscription\n3.2 Transcribe audio\nfiles using\nappropriate\ntechnology\n3.3 Edit and revise text\n• Lecture\n\n• Discussions\n\n• Demonstrations\n• Written\nexamination\n\n• Demonstration\n\n• Interview\n\n--- PDF PAGE 41 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n39\n3.2.\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of the competency-based\nTVET.\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and\nthe curriculum modules;\n• Assessment is based in the collection of evidence of the performance\nof work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET systems recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by\nthe competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The\ntrainer facilities the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire a specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructors are not in the\nsame place. Distance learning may employ correspondence study, or\naudio, video or computer technologies.\n\n--- PDF PAGE 42 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n40\n3.3.\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• can communicate either oral and written;\n• must be physically and mentally fit\n• with good moral character; and\n• must pass the trainability/aptitude test.\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n3.4.\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\nMEDICAL TRANSCRIPTION – NC II\n\nRecommended list of tools, equipment and materials for the training in\nMedical Transcription – NC II\nQTY.\nEQUIPMENT\n*\nComputer\n*\nAudio player software or equivalent\n\nLocal Area Network (LAN)\n\nTelephone\n\nFURNITURES\n*\nComputer Table\n*\nErgonomic Chairs\n\nMATERIALS\n\nCommercially available practice audio files with proof of purchase/source\n*\nWord Processor\n*\nFoot Pedal or equivalent audio controller for transcription\n*\nEarphones\n\nMedical Dictionary\n\nEnglish Dictionary\n\nDrug Reference Book\n\nNote: * Minimum required equipment-to-trainee ratio = 1 : 1\n (equipment includes software and furniture)\n\n--- PDF PAGE 43 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n41\n\n3.5.\nTRAINING FACILITIES\n\nThe building must be in compliance with occupational health and safety\nguidelines.\n\nSPACE REQUIREMENT\nSIZE\n(in METER)\nAREA\n(in Sq. Meters)\nTOTAL AREA\n(in Sq. Meters)\n• Trainee working space\n1 x 1\n25\n25\n• Lecture Room (Optional)\n6 x 5\n30\n30\n• Learning Resource Center\n2 x 2\n4\n4\n\nNote: Minimum required ratio of trainer to students = 1 : 25\nMinimum required ratio of student to computer workstation = 1 : 1\n\n3.6.\nTRAINERS QUALIFICATION\n\nMEDICAL TRANSCRIPTION – NC II\n\nTRAINERS QUALIFICATION (TQ II)\n\n• Must be a holder of Medical Transcription NC II or at least six (6) months\nof relevant industry experience.\n• Must have undergone training on Training Methodology II or equivalent\ntrainer’s training /experience.\n• Must be computer literate\n• Must be physically and mentally fit\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued\nfor each unit of competency.\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n42"
