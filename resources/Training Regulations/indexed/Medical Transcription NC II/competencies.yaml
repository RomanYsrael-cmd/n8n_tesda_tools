        "source_text": "ICT313309\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nnecessary to transcribe audio files and produce accurate\ntexts from the transcriptions.\n\nELEMENT\nPEFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPrepare for audio\ntranscription\n1.1.\nClient requirements relating to style,\npresentation and storage of technology are\nidentified prior to commencing the task.\n1.2.\nEquipment and materials needed for\ntranscription are obtained and checked for\ncorrect operation and safety.\n1.3.\nRequirement of the texts are clarified with the\nsuperior.\n2.\nTranscribe audio file\n2.1.\nText is produced from transcription with the\nrequired accuracy.\n2.2.\nAudio transcription reflected the intended\nmeaning of the author/physician.\n2.3.\nThe meaning of unclear speech is predicted\nfrom the context of the dictation.\n2.4.\nMeaning and spelling and technical terms are\nclarified to ensure accuracy of the text.\n2.5.\nText is produced within designated timelines.\n2.6.\nTranscription is self-checked for accuracy.\n3.\nEdit and revise text\n3.1.\nFinal text is self-checked for accuracy\n3.2.\nGrammar and syntax are appropriate for the\nintended purpose.\n3.3.\nText is revised, formatted, labeled, stored, and\nprinted in accordance with clients’\nrequirements.\n\n--- PDF PAGE 35 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n33\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nEquipment\n1.1.\nComputer and peripherals\n1.2.\npedals\n1.3.\nearphone\n2.\nMaterials\n2.1.\nManuals\n2.2.\nMedical dictionary\n3.\nDesignated timelines\n3.1.\nTimeline agreed with the supervisor\n3.2.\nOrganization timeline\n3.3.\nClient timeline\n4.\nAccuracy\n4.1.\nCorrect Spelling\n4.2.\nCorrect grammar\n4.3.\nIntended meaning\n4.4.\nCorrect use of technical vocabulary\n\n--- PDF PAGE 36 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n34\n\nEVIDENCE GUIDE\n\n1.\nCritical aspects of competency\nAssessment must show that the candidate:\n1.1.\nSelected and used hardware\ncomponents correctly and according\nto tasks requirements.\n1.2.\nUsed appropriate terminologies in\ntranscribing audio files into texts.\n1.3.\nProduced accurate and complete\ndocuments in accordance with the\nrequirements.\n2.\nUnderpinning knowledge\n2.1.\nFundamental word structure used in\nmedical terms\n2.2.\nSystems of the body (e.g., skeletal,\nrespiratory, cardiovascular)\n2.3.\nBasic Medical terminology\n2.4.\nAdvanced medical terminology\n2.5.\nOrganization’s policy and procedure\nrequirements\n2.6.\nHuman anatomy\n2.7.\nHuman physiology\n2.8.\nFundamental nature of a disease\nprocess, signs, symptoms and\nmethods of treatment\n2.9.\nCommon medical conditions\n2.10. Medical investigations and procedures\n2.11. Injuries\n2.12. Common abbreviations for medical\nand pharmacological terms (e.g.,\nBCG, HRT)\n2.13. Common medications\n2.14. Commonly used medical equipment\nand instruments\n2.15. Laboratory testing methods\n2.16. Diagnostic and surgical procedures\n2.17. Laboratory values and significance\n2.18. Medico-legal terminology\n2.19. Ergonomic guidelines\n\n--- PDF PAGE 37 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n35\n\n3.\nUnderpinning skills\n3.1.\nListening skills\n3.2.\nComprehension skills\n3.3.\nProofreading and editing skills\n3.4.\nCorrect grammar and punctuations\n3.5.\nReading skills\n3.6.\nKeyboarding skills not less than 45\nwpm\n3.7.\nResearching skills\n4.\nMethods of assessment\nThe following must be used to objectively\nassess the candidate:\n4.1.\nDirect Observation and Oral\nQuestioning\n4.2.\nThird Party report\n5.\nResource implication\nThe following resources MUST be provided:\n5.1.\nComputer and peripherals\n5.2.\nRecorded dictations\n6.\nContext of Assessment\nAssessment may be conducted in the\nworkplace or in a simulated environment.\n\n--- PDF PAGE 38 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n36"
