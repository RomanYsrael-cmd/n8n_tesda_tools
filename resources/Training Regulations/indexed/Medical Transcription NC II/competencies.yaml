sture \n3.4. \nVisual Display Unit Screen Brightness \n4. \nOrganizational Requirement \n4.1. \nLog-On Procedure \n4.2. \nLocating Data \n4.3. \nStoring Data \n4.4. \nLegal and Organizational Policy Guidelines \n& Requirement \n4.5. \nSaving & Closing Files \n4.6. \nOHS Policies & Guidelines\n\n--- PDF PAGE 28 ---\n_____________________________________________________________________________ \nTR-ICT (MEDICAL TRANSCRIPTION NC II)                                      Promulgated February 2004 \n \n26\n \n5. \nInput Device  \n5.1. \nKeyboard \n5.2. \nMouse \n5.3. \nNumerical key Pad \n6. \nStorage of  Data  \n6.1. \nStorage in Directory & Sub-Directories \n6.2. \nStorage in Directory CD ROM, Diskette, \nDrives \n6.3. \nOr Back up System \n6.4. \nAppropriate storage / filling of hard copies \nof computer generated document \n7. \nTechnology Consumables  \n7.1. \nPrinter Cartridge \n7.2. \nCD- ROM \n7.3. \nZip Disks \n7.4. \nPrint Heads \n8. \nRoutine Maintenance \n8.1. \nRegular Checking \n8.2. \nReplacing Consumables \n8.3. \n“In-House”  Cleaning and Servicing \naccording to manufacturers & guidelines\n\n--- PDF PAGE 29 ---\n_____________________________________________________________________________ \nTR-ICT (MEDICAL TRANSCRIPTION NC II)                                      Promulgated February 2004 \n \n27"
