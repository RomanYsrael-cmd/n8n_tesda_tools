  "source_section_text": "SECTION 2\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the core units of competency\nrequired for MEDICAL TRANSCRIPTION NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1 Specific and relevant information is accessed from\nappropriate sources\n1.2 Effective questioning , active listening and speaking\nskills are used to gather and convey information\n1.3 Appropriate medium is used to transfer information\nand ideas\n1.4 Appropriate non- verbal communication is used\n1.5 Appropriate lines of communication with supervisors\nand colleagues are identified and followed\n1.6 Defined workplace procedures for the location and\nstorage of information are used\n1.7 Personal interaction is carried out clearly and concisely\n2. Participate in\nworkplace meetings\nand discussions\n2.1 Team meetings are attended on time\n2.2 Own opinions are clearly expressed and those of\nothers are listened to without interruption\n2.3 Meeting inputs are consistent with the meeting purpose\nand established protocols\n2.4 Workplace interactions are conducted in a courteous\nmanner\n2.5 Questions about simple routine workplace procedures\nand maters concerning working conditions of\nemployment are asked and responded to\n2.6 Meetings outcomes are interpreted and implemented\n3. Complete relevant\nwork related\ndocuments\n3.1 Range of forms relating to conditions of employment\nare completed accurately and legibly\n3.2 Workplace data is recorded on standard workplace\nforms and documents\n3.3 Basic mathematical processes are used for routine\ncalculations\n3.4 Errors in recording information on forms/ documents\nare identified and properly acted upon\n3.5 Reporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms,\nsafety reports\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction\nand forms, non-verbal including gestures,\nsignals, signs and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 6 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n4\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using communication\nequipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the\nformal or informal communication\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1. Effective communication\n2.2. Different modes of communication\n2.3. Written communication\n2.4. Organizational policies\n2.5. Communication procedures and systems\n2.6. Technology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning Skills\n3.1. Follow simple spoken language\n3.2. Perform routine workplace duties following simple\nwritten notices\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Estimate, calculate and record routine workplace\nmeasures\n3.6. Basic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7. Ability to relate to people of social range in the\nworkplace\n3.8. Gather and provide information in response to\nworkplace Requirements\n4. Resource\nImplications\n4.1. Fax machine\n4.2. Telephone\n4.3. Writing materials\n4.4. Internet\n5. Methods of\nAssessment\n5.1. Direct Observation\n5.2. Oral interview and written test\n6. Context of\nAssessment\n6.1. Competency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 7 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n5\n\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1. The role and objective of the team is identified from\navailable sources of information\n1.2. Team parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n2. Identify own role\nand responsibility\nwithin team\n2.1. Individual role and responsibilities within the team\nenvironment are identified\n2.2. Roles and responsibility of other team members are\nidentified and recognized\n2.3. Reporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1. Effective and appropriate forms of communications\nused and interactions undertaken with team members\nwho contribute to known team activities and\nobjectives\n3.2. Effective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3. Observed protocols in reporting using standard\noperating procedures\n3.4. Contribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 8 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n6\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective\nof team\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications\nand instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 9 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n7\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning\nKnowledge and\nAttitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning Skills\n3.1.\nCommunicate appropriately, consistent with the\nculture of the workplace\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n 4.2. Materials relevant to the proposed activity or tasks\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation to\nthe work activities of the group\n5.2.\nObservation of simulation and or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 10 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n8\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1 Personal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2 Intra- and interpersonal relationships are maintained in\nthe course of managing oneself based on performance\nevaluation\n1.3 Commitment to the organization and its goal is\ndemonstrated in the performance of duties\n1. Set and meet work\npriorities\n2.1 Competing demands are prioritized to achieve personal,\nteam and organizational goals and objectives.\n2.2 Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3 Practices along economic use and maintenance of\nequipment and facilities are followed as per established\nprocedures\n2. Maintain professional\ngrowth and\ndevelopment\n3.1 Trainings and career opportunities are identified and\navailed of based on job requirements\n3.2 Recognitions are sought/received and demonstrated\nas proof of career advancement\n3.3 Licenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 11 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n9\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 12 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n10\n\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nKnowledge\n2.1 Work values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.5 Personal hygiene practices\n3. Underpinning Skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context of\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 13 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n11\n\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND\nSAFETY PROCEDURES\nUNIT CODE : 500311108\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1 Safety regulations and workplace safety and\nhazard control practices and procedures are\nclarified and explained based on organization\nprocedures\n1.2 Hazards/risks in the workplace and their\ncorresponding indicators are identified to minimize\nor eliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3 Contingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate hazards and\nrisks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are\nidentified based on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and\nrelevant workplace OHS legislation\n\n--- PDF PAGE 14 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n12\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Control hazards and\nrisks\n3.1 Occupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2 Procedures for dealing with workplace accidents, fire\nand emergencies are followed in accordance with\norganization OHS policies\n3.3 Personal protective equipment (PPE) is correctly\nused in accordance with organization OHS procedures\nand practices\n3.4 Appropriate assistance is provided in the event of a\nworkplace emergency in accordance with established\norganization protocol\n\n4. Maintain OHS\nawareness\n\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 15 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n13\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4 Ergonomics\n2.4.1 Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 Calling emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n--- PDF PAGE 16 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n14\n\nVARIABLE\nRANGE\n\n5. Emergency-related\ndrills and training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6. OHS personal\nrecords\n\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 17 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n15\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nKnowledge and\n Attitude\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Underpinning\n Skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n3. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n4.\nMethods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n5.\nContext for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n16\n\nCOMMON COMPETENCIES\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:\n506315202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, attitudes and\nvalues needed to apply quality standards in the\nworkplace. The unit also includes the application of\nrelevant safety procedures and regulations, organization\nprocedures and customer requirements.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess quality of\nreceived materials\n1.1. Work instruction is obtained and work is carried out in\naccordance with standard operating procedures.\n1.2. Received materials are checked against workplace\nstandards and specifications.\n1.3. Faulty materials related to work are identified and\nisolated.\n1.4. Faults and any identified causes are recorded and/or\nreported to the supervisor concerned in accordance\nwith workplace procedures.\n1.5. Faulty materials are replaced in accordance with\nworkplace procedures.\n2. Assess own work\n2.1. Documentation relative to quality within the company\nis identified and used.\n2.2. Completed work is checked against workplace\nstandards relevant to the task undertaken.\n2.3. Errors are identified and isolated.\n2.4. Information on the quality and other indicators of\nproduction performance are recorded in accordance\nwith workplace procedures.\n2.5. In cases of deviations from specific quality\nstandards, causes are documented and reported in\naccordance with the workplace’ s standards operating\nprocedures.\n3. Engage in quality\nimprovement\n3.1. Process improvement procedures are participated in\nrelative to workplace assignment.\n3.2. Work is carried out in accordance with process\nimprovement procedures.\n3.3. Performance of operation or quality of product of\nservice to ensure customer satisfaction is monitored.\n\n--- PDF PAGE 19 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n17\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Materials\n1.1\nMaterials may include but not limited to:\n1.1.1. Manuals\n1.1.2. Job orders\n1.1.3. Instructional videos\n2 Faults\n2.1\nFaults may include but not limited to:\n2.1.1. Materials not to specification\n2.1.2. Materials contain incorrect/outdated\ninformation\n2.1.3. Hardware defects\n2.1.4. Materials that do not conform with any\nregulatory agencies\n3 Documentation\n3.1\nOrganization work procedures\n3.2\nManufacturer’s instruction manual\n3.3\nCustomer requirements\n3.4\nForms\n4 Errors\n4.1\nErrors may be related but not limited to the\nfollowing:\n4.1.1. Deviation from the requirements of the Client\n4.1.2. Deviation from the requirement of the\norganization\n5 Quality standards\n\n5.1\nQuality standards may be related but not limited to\nthe following:\n5.1.1. Materials\n5.1.2. Hardware\n5.1.3. Final product\n5.1.4. Production processes\n5.1.5. Customer service\n6 Customer\n6.1\nCo-worker\n6.2\nSupplier/Vendor\n6.3\nClient\n6.4\nOrganization receiving the product or service\n\n--- PDF PAGE 20 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n18\n\nEVIDENCE GUIDE\n\n1 Critical aspect of\ncompetency\nAssessment must show that the candidate:\n1.1 Carried out work in accordance with the company’s\nstandard operating procedures\n1.2 Performed task according to specifications\n1.3 Reported defects detected in accordance with\nstandard operating procedures\n1.4 Carried out work in accordance with the process\nimprovement procedures\n2 Underpinning\nknowledge\n2.1 Relevant production processes, materials and\nproducts\n2.2 Characteristics of materials, software and hardware\nused in production processes\n2.3 Quality checking procedures\n2.4 Workplace procedures\n2.5 Safety and environmental aspects of production\nprocesses\n2.6 Fault identification and reporting\n2.7 Quality improvement processes\n3 Underpinning skills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills needed to interpret and apply\ndefined work procedures\n3.3 Carry out work in accordance with OHS policies and\nprocedures\n3.4 Critical thinking\n3.5 Solution providing and decision-making\n4 Method of\nassessment\nThe assessor must select two of the following to objectively\nevaluate the candidate:\n4.1 Observation and oral questioning\n4.2 Third party report\n4.3 Portfolio\n4.4 Practical demonstration\n5 Resource implication\nMaterials, software and hardware to be used in a real or\nsimulated situation\n6 Context of\nAssessment\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 21 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n19\n\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\n\nUNIT CODE\n:\n506311203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, attitudes and\nvalues needed to perform computer operations which\ninclude inputting, accessing, producing and transferring\ndata using the appropriate hardware and software.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntask to be taken\nundertaken\n1.1. Requirements of task are determined in accordance\nwith the required output.\n1.2. Appropriate hardware and software are selected\naccording to task assigned and required outcome.\n1.3. Task is planned to ensure that OH & S guidelines\nand procedures are followed.\n1.4. Client -specific guidelines and procedures are\nfollowed.\n1.5. Required data security guidelines are applied in\naccordance with existing procedures.\n2. Input data into\ncomputer\n2.1. Data are entered into the computer using\nappropriate program/application in accordance with\ncompany procedures.\n2.2. Accuracy of information is checked and information\nis saved in accordance with standard operating\nprocedures.\n2.3. Inputted data is stored in storage media according\nto requirements.\n2.4. Work is performed within ergonomic guidelines.\n3. Access information\nusing computer\n3.1. Correct program/application is selected based on\njob requirements.\n3.2. Program/application containing the information\nrequired is accessed according to company\nprocedures.\n3.3. Desktop icons are correctly selected, opened and\nclosed for navigation purposes.\n3.4. Keyboard techniques are carried out in line with OH\n& S requirements for safe use of keyboards.\n\n--- PDF PAGE 22 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n20\n\n4. Produce output/ data\nusing computer system\n4.1. Entered data are processed using appropriate\nsoftware commands.\n4.2. Data are printed out as required using computer\nhardware /peripheral devices in accordance with\nstandard operating procedures.\n4.3. Files and data are transferred between compatible\nsystems using computer software,\nhardware/peripheral devices in accordance with\nstandard operating procedures.\n5. Use basic functions of\na www-browser to\nlocate information\n5.1. Information requirements for internet search are\nestablished.\n5.2. Browser is launched.\n5.3. Search engine is loaded.\n5.4. Appropriate search criteria/or URL of site is entered.\n5.5. Relevant links are followed to locate required\ninformation.\n5.6. Useful pages are bookmarked or printed as\nrequired.\n6. Maintain computer\nequipment and\nsystems\n6.1. Procedures for ensuring security of data, including\nregular back-ups and virus checks are implemented\nin accordance with standard operating procedures.\n6.2. Basic file maintenance procedures are implemented\nin line with the standards operating procedures.\n\n--- PDF PAGE 23 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n21\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Hardware and\nperipheral devices\n1.1 Personal computers\n1.2 Networked systems\n1.3 Communication equipment\n1.4 Printers\n1.5 Scanners\n1.6 Keyboard\n1.7 Mouse\n1.8 Voice/Data logger\n2 Software\nSoftware includes the following but not limited to:\n2.1 Word processing packages\n2.2 Database packages\n2.3 Internet\n2.4 Spreadsheets\n2.5 Client Specific Software\n3 OH & S guidelines\n3.1 OHS guidelines\n3.2 Enterprise procedures\n4 Storage media\nStorage media include the following but not limited to:\n4.1 Diskettes\n4.2 CDs\n4.3 Zip disks\n4.4 hard disk drives, local and remote\n4.5 Optical drives\n5 Ergonomic guidelines\n5.1 Types of equipment used\n5.2 Appropriate furniture\n5.3 Seating posture\n5.4 Lifting posture\n5.5 Visual display unit screen brightness\n\n--- PDF PAGE 24 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n22\n\n6 Desktop icons\n6.1 Icons include the following but not limited to:\n6.2 Directories/folders\n6.3 Files\n6.4 Network devices\n6.5 Recycle bin\n6.6 Program icons\n7 Maintenance\n7.1 Creating and managing more space in the hard disk\nand other peripherals\n7.2 Reviewing programs\n7.3 Deleting unwanted files\n7.4 Backing up files\n7.5 Checking hard drive for errors\n7.6 Using up to date anti-virus programs\n7.7 Cleaning dust from internal and external surfaces\n\n--- PDF PAGE 25 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n23\n\nEVIDENCE GUIDE\n\n1 Critical aspects of\ncompetency\nAssessment must show that the candidate:\n1.1 Selected and used hardware components correctly and\naccording to the task requirement\n1.2 used basic software applications to create new files and\ndocuments\n1.3 Produced accurate and complete data in accordance with\nthe requirements\n1.4 Used appropriate devices and procedures to transfer\nfiles/data accurately\n1.5 Used basic functions of a www-browser to locate\ninformation.\n2 Underpinning\nknowledge\n2.1 Basic ergonomics of keyboard and computer user\n2.2 Main types of computers and basic features of different\noperating systems\n2.3 Main parts of a computer\n2.4 Storage devices and basic categories of memory\n2.5 Relevant types of software\n2.6 General security, privacy legislation and copyright\n2.7 Viruses\n2.8 OH & S principles and responsibilities\n2.9 Calculating computer capacity\n2.10 Productivity Application\n2.11 Business Application\n2.12 System Software\n3 Underpinning\nskills\n3.1 Reading and comprehension skills required to interpret\nwork instruction and to interpret basic user manuals.\n3.2 Communication skills to identify lines of communication,\nrequest advice, follow instructions and receive feedback.\n3.3 Technology skills to use equipment safely including\nkeyboard skills.\n4 Method of\nassessment\nThe assessor may select two of the following assessment\nmethods to objectively assess the candidate:\n4.1 Direct Observation and Oral Questioning\n4.2 Practical demonstration\n5 Resource\nimplication\n5.1 Computer hardware with peripherals\n5.2 Appropriate software\n6 Context of\nAssessment\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 26 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n24\n\nCORE COMPETENCIES\n\nUNIT TITLE\n:\nUSE BUSINESS TECHNOLOGY TO RESPOND TO\nCUSTOMERS NEEDS\nUNIT CODE\n:\nICT313307\nUNIT DESRIPTOR\n:\nThis unit covers the knowledge, skills and attitude\nrequired to respond to customer needs using appropriate\ntechnology.\n\nELEMENT\n PERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect and use\ntechnology\n1.1 Appropriate technology and software\napplications are selected to achieve the\nrequirements of the task.\n1.2 Work is performed within ergonomic guidelines.\n1.3 Technology is used according to organizational\nrequirements that promote a safe work\nenvironment.\n2.\nProcess and organize\ndata\n2.1 Files and records are identified, opened,\ngenerated or edited according to task and\norganizational requirements.\n2.2 Input devices are operated according to\norganizational requirements.\n2.3 Data is stored appropriately and application is\nexited without damage to or loss of data.\n2.4 Manuals, training booklets and / or on-line help or\nhelp-desks are used to overcome basic difficulties\nof application.\n3.\nMaintain technology\n3.1 Used technology consumables are identified\nand replaced in accordance with manufacturers’\ninstructions and organizational requirements.\n3.2 Routine maintenance is carried out and / or\narranged in order to ensure that equipment is\nmaintained in accordance with manufacturers’\ninstructions and organizational requirements.\n3.3 Equipment faults are accurately identified and\naction taken in accordance with manufacturer’s\ninstruction or fault reported to the designated\nperson.\n\n--- PDF PAGE 27 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nTechnology\n1.1.\nComputer\n1.2.\nPrinter\n1.3.\nModem\n1.4.\nZip Drive\n1.5.\nEarphones\n1.6.\nPedal\n2.\nSoftware\n2.1.\nWord Processor\n2.2.\nDatabase\n2.3.\nSpecific Software\n2.4.\nVoice Players\n2.5.\nLine Counter\n2.6.\nTemplate Macros\n2.7.\nAudio file Converter\n3.\nErgonomic Guidelines\n3.1.\nType of Equipment Used\n3.2.\nAppropriate Furniture\n3.3.\nSeating Posture\n3.4.\nVisual Display Unit Screen Brightness\n4.\nOrganizational Requirement\n4.1.\nLog-On Procedure\n4.2.\nLocating Data\n4.3.\nStoring Data\n4.4.\nLegal and Organizational Policy Guidelines\n& Requirement\n4.5.\nSaving & Closing Files\n4.6.\nOHS Policies & Guidelines\n\n--- PDF PAGE 28 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n26\n\n5.\nInput Device\n5.1.\nKeyboard\n5.2.\nMouse\n5.3.\nNumerical key Pad\n6.\nStorage of Data\n6.1.\nStorage in Directory & Sub-Directories\n6.2.\nStorage in Directory CD ROM, Diskette,\nDrives\n6.3.\nOr Back up System\n6.4.\nAppropriate storage / filling of hard copies\nof computer generated document\n7.\nTechnology Consumables\n7.1.\nPrinter Cartridge\n7.2.\nCD- ROM\n7.3.\nZip Disks\n7.4.\nPrint Heads\n8.\nRoutine Maintenance\n8.1.\nRegular Checking\n8.2.\nReplacing Consumables\n8.3.\n“In-House” Cleaning and Servicing\naccording to manufacturers & guidelines\n\n--- PDF PAGE 29 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n27\nEVIDENCE GUIDE\n\n1.\nCritical aspect of Competency\nAssessment must show that the candidate\n1.1.\nSelected and applied appropriate\ntranscription software, hardware to\nproduce document\n1.2.\nApplied OHS procedure to set up work\nstation, operation of computer and other\nactivities\n1.3.\nAccessed, retrieved and stored data\n2.\nUnderpinning Knowledge\n2.1.\nCorrect log-on sheet –down procedures\nfor computer equipment\n2.2.\nKeyboarding\n2.3.\nBack-up -virus protection procedures\n2.4.\nMethods of detecting faults in solving\nproblem with business technology\n2.5.\nMathematical ideas and techniques\n2.6.\nPlanning and organizing activities\n3.\nUnderpinning Skills\n3.1.\nKeyboarding skills\n3.2.\nInternet manipulation skills\n3.3.\nCommunication skills to identify lines of\ncommunication.\n3.4.\nTechnology skills to use business\nequipment\n4.\nMethod of Assessment\nThe assessor must use the following methods to\nobjectively assess the candidate:\n4.1.\nPractical demonstration and oral\nquestioning\n4.2.\nThird party report\n5.\nResource Implication\nThe following resources MUST be provided:\n5.1.\nAppropriate hardware\n5.2.\nAppropriate software\n5.3.\nConsumables\n6.\nContext of Assessment\nAssessment may be conducted in the workshop\nor in a simulated environment\n\n--- PDF PAGE 30 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n28\nUNIT TITLE\n:\nUSE MEDICAL TERMINOLOGY TO CARRY OUT\nTASKS\nUNIT CODE\n:\nICT313308\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude needed\nto understand and respond to instructions, carry out\nroutine tasks to prepare documents using medical\nterminology.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nRespond appropriately to\ninstruction\n1.1\nWritten and oral instructions using medical\nterminology are received, understood and\nproperly documented.\n1.2\nAbbreviation for commonly used medical\nterms and associated processes are\nunderstood.\n1.3\nClarifications are sought from references,\nif necessary.\n2.\nPerform routine tasks\n2.1\n Medical terminology is used correctly in\nthe completion of routine tasks.\n2.2\nGaps in knowledge are identified and\nclarification is sought through appropriate\nperson.\n2.3\nAbbreviation for commonly used medical\nterminologies are identified and used,\nwhere appropriate.\n3.\nUse appropriate medical\nterminology in the\npreparation of documents\n3.1\nAppropriate medical technology is used in\npreparing documents.\n3.2\nMedical terminology is spelt correctly and\nused in appropriate context.\n3.3\nAdvice is sought from designated person\nwith regards to medical terms and\naccompanying process, if necessary.\n\n--- PDF PAGE 31 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n29\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nMedical terminology\nMedical terminology may include:\n1.1.\nFundamental word structure used in\nmedical terms\n1.2.\nCommon abbreviations\n1.3.\nMedical specialties\n1.4.\nCauses to changes in the systems of\nthe body\n1.5.\nInterrelated functions of the body\n1.6.\nIllnesses\n1.7.\nInjuries\n1.8.\nDiseases\n1.9.\nMedical investigations and\nprocedures\n1.10. Pharmacological terms\n1.11. Medico-legal terminology\n2.\nReferences\n2.1.\nMedical dictionary\n2.2.\nRelevant handbook/manual\n2.3.\nDesignated person\n2.4.\nDrug and prescription information\nsources/databases\n3.\nRoutine tasks\n3.1.\nPreparing reports\n3.2.\nTranscribing documents\n3.3.\nMaintaining files of clients\n4.\nDesignated Person\n4.1.\nEditor\n4.2.\nSupervisor\n\n--- PDF PAGE 32 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n30\n\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\ncompetency\nAssessment must show that the candidate:\n1.1.\nSelected and used hardware components\ncorrectly and according to tasks requirements.\n1.2.\nUsed correct medical terminologies in\ntranscribing audio files into texts.\n1.3.\nProduced accurate and complete documents\nusing correct medical terminologies\n2.\nUnderpinning\nknowledge\n2.1.\nFundamental word structure used in medical\nterms\n2.2.\nSystems of the body (e.g., skeletal, respiratory,\ncardiovascular)\n2.3.\nBasic Medical terminology\n2.4.\nAdvanced medical terminology\n2.5.\nOrganization’s policy and procedure\nrequirements\n2.6.\nHuman anatomy\n2.7.\nHuman physiology\n2.8.\nFundamental nature of a disease process,\nsigns, symptoms and methods of treatment\n2.9.\nCommon medical conditions\n2.10. Medical investigations and procedures\n2.11. Injuries\n2.12. Common abbreviations for medical and\npharmacological terms (e.g., BCG, HRT)\n2.13. Common medications\n2.14. Commonly used medical equipment and\ninstruments\n2.15. Laboratory testing methods\n2.16. Diagnostic and surgical procedures\n2.17. Laboratory values and significance\n2.18. Medico-legal terminology\n2.19. Ergonomic guidelines\n\n--- PDF PAGE 33 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n31\n\n3.\nUnderpinning skills\n3.1.\nListening skills\n3.2.\nComprehension skills\n3.3.\nProofreading and editing skills\n3.4.\nCorrect grammar and punctuations\n3.5.\nReading skills\n3.6.\nKeyboarding skills not less than 45 wpm\n3.7.\nResearching skills\n4.\nMethods of\nassessment\nThe following must be used to objectively assess the\ncandidate:\n4.1.\nWritten test\n4.2.\nThird Party report\n5.\nResource implication\nThe following resources MUST be provided:\n5.1.\nComputer and peripherals\n5.2.\nAudio dictations\n6.\nContext of Assessment\nAssessment may be conducted in the workplace or in\na simulated environment.\n\n--- PDF PAGE 34 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n32\nUNIT TITLE\n:\nPRODUCE TEXT FROM AUDIO TRANSCRIPTION\nUNIT CODE\n:\nICT313309\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nnecessary to transcribe audio files and produce accurate\ntexts from the transcriptions.\n\nELEMENT\nPEFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPrepare for audio\ntranscription\n1.1.\nClient requirements relating to style,\npresentation and storage of technology are\nidentified prior to commencing the task.\n1.2.\nEquipment and materials needed for\ntranscription are obtained and checked for\ncorrect operation and safety.\n1.3.\nRequirement of the texts are clarified with the\nsuperior.\n2.\nTranscribe audio file\n2.1.\nText is produced from transcription with the\nrequired accuracy.\n2.2.\nAudio transcription reflected the intended\nmeaning of the author/physician.\n2.3.\nThe meaning of unclear speech is predicted\nfrom the context of the dictation.\n2.4.\nMeaning and spelling and technical terms are\nclarified to ensure accuracy of the text.\n2.5.\nText is produced within designated timelines.\n2.6.\nTranscription is self-checked for accuracy.\n3.\nEdit and revise text\n3.1.\nFinal text is self-checked for accuracy\n3.2.\nGrammar and syntax are appropriate for the\nintended purpose.\n3.3.\nText is revised, formatted, labeled, stored, and\nprinted in accordance with clients’\nrequirements.\n\n--- PDF PAGE 35 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n33\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nEquipment\n1.1.\nComputer and peripherals\n1.2.\npedals\n1.3.\nearphone\n2.\nMaterials\n2.1.\nManuals\n2.2.\nMedical dictionary\n3.\nDesignated timelines\n3.1.\nTimeline agreed with the supervisor\n3.2.\nOrganization timeline\n3.3.\nClient timeline\n4.\nAccuracy\n4.1.\nCorrect Spelling\n4.2.\nCorrect grammar\n4.3.\nIntended meaning\n4.4.\nCorrect use of technical vocabulary\n\n--- PDF PAGE 36 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n34\n\nEVIDENCE GUIDE\n\n1.\nCritical aspects of competency\nAssessment must show that the candidate:\n1.1.\nSelected and used hardware\ncomponents correctly and according\nto tasks requirements.\n1.2.\nUsed appropriate terminologies in\ntranscribing audio files into texts.\n1.3.\nProduced accurate and complete\ndocuments in accordance with the\nrequirements.\n2.\nUnderpinning knowledge\n2.1.\nFundamental word structure used in\nmedical terms\n2.2.\nSystems of the body (e.g., skeletal,\nrespiratory, cardiovascular)\n2.3.\nBasic Medical terminology\n2.4.\nAdvanced medical terminology\n2.5.\nOrganization’s policy and procedure\nrequirements\n2.6.\nHuman anatomy\n2.7.\nHuman physiology\n2.8.\nFundamental nature of a disease\nprocess, signs, symptoms and\nmethods of treatment\n2.9.\nCommon medical conditions\n2.10. Medical investigations and procedures\n2.11. Injuries\n2.12. Common abbreviations for medical\nand pharmacological terms (e.g.,\nBCG, HRT)\n2.13. Common medications\n2.14. Commonly used medical equipment\nand instruments\n2.15. Laboratory testing methods\n2.16. Diagnostic and surgical procedures\n2.17. Laboratory values and significance\n2.18. Medico-legal terminology\n2.19. Ergonomic guidelines\n\n--- PDF PAGE 37 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n35\n\n3.\nUnderpinning skills\n3.1.\nListening skills\n3.2.\nComprehension skills\n3.3.\nProofreading and editing skills\n3.4.\nCorrect grammar and punctuations\n3.5.\nReading skills\n3.6.\nKeyboarding skills not less than 45\nwpm\n3.7.\nResearching skills\n4.\nMethods of assessment\nThe following must be used to objectively\nassess the candidate:\n4.1.\nDirect Observation and Oral\nQuestioning\n4.2.\nThird Party report\n5.\nResource implication\nThe following resources MUST be provided:\n5.1.\nComputer and peripherals\n5.2.\nRecorded dictations\n6.\nContext of Assessment\nAssessment may be conducted in the\nworkplace or in a simulated environment.\n\n--- PDF PAGE 38 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n36"
