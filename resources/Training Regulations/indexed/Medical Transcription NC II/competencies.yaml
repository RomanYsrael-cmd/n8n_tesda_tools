rding skills\n3.2.\nInternet manipulation skills\n3.3.\nCommunication skills to identify lines of\ncommunication.\n3.4.\nTechnology skills to use business\nequipment\n4.\nMethod of Assessment\nThe assessor must use the following methods to\nobjectively assess the candidate:\n4.1.\nPractical demonstration and oral\nquestioning\n4.2.\nThird party report\n5.\nResource Implication\nThe following resources MUST be provided:\n5.1.\nAppropriate hardware\n5.2.\nAppropriate software\n5.3.\nConsumables\n6.\nContext of Assessment\nAssessment may be conducted in the workshop\nor in a simulated environment\n\n--- PDF PAGE 30 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n28\nUNIT TITLE\n:\nUSE MEDICAL TERMINOLOGY TO CARRY OUT\nTASKS\nUNIT CODE\n:"
