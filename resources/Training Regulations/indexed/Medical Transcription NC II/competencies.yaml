        "source_text": "--- PDF PAGE 30 ---\n_____________________________________________________________________________ \nTR-ICT (MEDICAL TRANSCRIPTION NC II)                                      Promulgated February 2004 \n \n28\nUNIT TITLE  \n: \nUSE MEDICAL TERMINOLOGY TO CARRY OUT \nTASKS \nUNIT CODE \n: \nICT313308 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude needed \nto understand and respond to instructions, carry out \nroutine tasks to prepare documents using medical \nterminology.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. \nRespond appropriately to \ninstruction \n1.1 \nWritten and oral instructions using medical \nterminology are received, understood and \nproperly documented. \n1.2 \nAbbreviation for commonly used medical \nterms and associated processes are \nunderstood. \n1.3 \nClarifications are sought from references, \nif necessary. \n2. \nPerform  routine tasks \n2.1 \n Medical terminology is used correctly in \nthe completion of routine tasks. \n2.2 \nGaps in knowledge are identified and \nclarification is sought through appropriate \nperson. \n2.3 \nAbbreviation for commonly used medical \nterminologies are identified and used, \nwhere appropriate. \n3. \nUse appropriate medical \nterminology in the \npreparation of documents \n3.1 \nAppropriate medical technology is used in \npreparing documents. \n3.2 \nMedical terminology is spelt correctly and \nused in appropriate context. \n3.3 \nAdvice is sought from designated person \nwith regards to medical terms and \naccompanying process, if necessary.\n\n--- PDF PAGE 31 ---\n_____________________________________________________________________________ \nTR-ICT (MEDICAL TRANSCRIPTION NC II)                                      Promulgated February 2004 \n \n29\nRANGE OF VARIABLES \n \nVARIABLE  \nRANGE \n1. \nMedical terminology  \nMedical terminology may include: \n1.1. \nFundamental word structure used in \nmedical terms \n1.2. \nCommon abbreviations \n1.3. \nMedical specialties \n1.4. \nCauses to changes in the systems of \nthe body \n1.5. \nInterrelated functions of the body \n1.6. \nIllnesses \n1.7. \nInjuries \n1.8. \nDiseases \n1.9. \nMedical investigations and \nprocedures \n1.10. Pharmacological terms \n1.11. Medico-legal terminology \n2. \nReferences \n2.1. \nMedical dictionary \n2.2. \nRelevant handbook/manual \n2.3. \nDesignated person \n2.4. \nDrug and prescription information \nsources/databases \n3. \nRoutine tasks \n3.1. \nPreparing reports \n3.2. \nTranscribing documents \n3.3. \nMaintaining files of clients \n4. \nDesignated Person \n4.1. \nEditor \n4.2. \nSupervisor\n\n--- PDF PAGE 32 ---\n_____________________________________________________________________________ \nTR-ICT (MEDICAL TRANSCRIPTION NC II)                                      Promulgated February 2004 \n \n30\n \nEVIDENCE GUIDE \n \n1. \nCritical aspects of \ncompetency \nAssessment must show that the candidate: \n1.1. \nSelected and used hardware components \ncorrectly and according to tasks requirements. \n1.2. \nUsed correct medical terminologies in \ntranscribing audio files into texts. \n1.3. \nProduced accurate and complete documents \nusing correct  medical terminologies \n2. \nUnderpinning \nknowledge \n2.1. \nFundamental word structure used in medical \nterms \n2.2. \nSystems of the body (e.g., skeletal, respiratory, \ncardiovascular) \n2.3. \nBasic Medical terminology \n2.4. \nAdvanced medical terminology \n2.5. \nOrganization’s policy and procedure \nrequirements \n2.6. \nHuman anatomy \n2.7. \nHuman physiology \n2.8. \nFundamental nature of a disease process, \nsigns, symptoms and methods of treatment \n2.9. \nCommon medical conditions \n2.10. Medical investigations and procedures \n2.11. Injuries \n2.12. Common abbreviations for medical and \npharmacological terms (e.g., BCG, HRT) \n2.13. Common medications \n2.14. Commonly used medical equipment and  \ninstruments \n2.15. Laboratory testing methods \n2.16. Diagnostic and surgical procedures \n2.17. Laboratory values and significance \n2.18. Medico-legal terminology \n2.19. Ergonomic guidelines\n\n--- PDF PAGE 33 ---\n_____________________________________________________________________________ \nTR-ICT (MEDICAL TRANSCRIPTION NC II)                                      Promulgated February 2004 \n \n31\n \n3. \nUnderpinning skills \n3.1. \nListening skills \n3.2. \nComprehension skills \n3.3. \nProofreading and editing skills \n3.4. \nCorrect grammar and punctuations \n3.5. \nReading skills  \n3.6. \nKeyboarding skills not less than 45 wpm \n3.7. \nResearching   skills \n4. \nMethods of \nassessment \nThe following must be used to objectively assess the \ncandidate: \n4.1. \nWritten test \n4.2. \nThird Party report  \n5. \nResource implication \nThe following resources MUST be provided: \n5.1. \nComputer and peripherals \n5.2. \nAudio dictations \n6. \nContext of Assessment \nAssessment may be conducted in the workplace or in \na simulated environment.\n",
