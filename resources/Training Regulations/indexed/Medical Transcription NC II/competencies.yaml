        "evidence_guide": {
          "source_text": "1.\nCritical aspects of\ncompetency\nAssessment must show that the candidate:\n1.1.\nSelected and used hardware components\ncorrectly and according to tasks requirements.\n1.2.\nUsed correct medical terminologies in\ntranscribing audio files into texts.\n1.3.\nProduced accurate and complete documents\nusing correct medical terminologies\n2.\nUnderpinning\nknowledge\n2.1.\nFundamental word structure used in medical\nterms\n2.2.\nSystems of the body (e.g., skeletal, respiratory,\ncardiovascular)\n2.3.\nBasic Medical terminology\n2.4.\nAdvanced medical terminology\n2.5.\nOrganization’s policy and procedure\nrequirements\n2.6.\nHuman anatomy\n2.7.\nHuman physiology\n2.8.\nFundamental nature of a disease process,\nsigns, symptoms and methods of treatment\n2.9.\nCommon medical conditions\n2.10. Medical investigations and procedures\n2.11. Injuries\n2.12. Common abbreviations for medical and\npharmacological terms (e.g., BCG, HRT)\n2.13. Common medications\n2.14. Commonly used medical equipment and\ninstruments\n2.15. Laboratory testing methods\n2.16. Diagnostic and surgical procedures\n2.17. Laboratory values and significance\n2.18. Medico-legal terminology\n2.19. Ergonomic guidelines\n\n--- PDF PAGE 33 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n31\n\n3.\nUnderpinning skills\n3.1.\nListening skills\n3.2.\nComprehension skills\n3.3.\nProofreading and editing skills\n3.4.\nCorrect grammar and punctuations\n3.5.\nReading skills\n3.6.\nKeyboarding skills not less than 45 wpm\n3.7.\nResearching skills\n4.\nMethods of\nassessment\nThe following must be used to objectively assess the\ncandidate:\n4.1.\nWritten test\n4.2.\nThird Party report\n5.\nResource implication\nThe following resources MUST be provided:\n5.1.\nComputer and peripherals\n5.2.\nAudio dictations\n6.\nContext of Assessment\nAssessment may be conducted in the workplace or in\na simulated environment.\n\n--- PDF PAGE 34 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n32\nUNIT TITLE\n:\nPRODUCE TEXT FROM AUDIO TRANSCRIPTION\nUNIT CODE\n:",
