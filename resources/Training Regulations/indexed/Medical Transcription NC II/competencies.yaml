          "source_text": "1.\nCritical aspect of Competency\nAssessment must show that the candidate\n1.1.\nSelected and applied appropriate\ntranscription software, hardware to\nproduce document\n1.2.\nApplied OHS procedure to set up work\nstation, operation of computer and other\nactivities\n1.3.\nAccessed, retrieved and stored data\n2.\nUnderpinning Knowledge\n2.1.\nCorrect log-on sheet –down procedures\nfor computer equipment\n2.2.\nKeyboarding\n2.3.\nBack-up -virus protection procedures\n2.4.\nMethods of detecting faults in solving\nproblem with business technology\n2.5.\nMathematical ideas and techniques\n2.6.\nPlanning and organizing activities\n3.\nUnderpinning Skills\n3.1.\nKeyboarding skills\n3.2.\nInternet manipulation skills\n3.3.\nCommunication skills to identify lines of\ncommunication.\n3.4.\nTechnology skills to use business\nequipment\n4.\nMethod of Assessment\nThe assessor must use the following methods to\nobjectively assess the candidate:\n4.1.\nPractical demonstration and oral\nquestioning\n4.2.\nThird party report\n5.\nResource Implication\nThe following resources MUST be provided:\n5.1.\nAppropriate hardware\n5.2.\nAppropriate software\n5.3.\nConsumables\n6.\nContext of Assessment\nAssessment may be conducted in the workshop\nor in a simulated environment\n\n--- PDF PAGE 30 ---\n_____________________________________________________________________________\nTR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004\n\n28\nUNIT TITLE\n:\nUSE MEDICAL TERMINOLOGY TO CARRY OUT\nTASKS\nUNIT CODE\n:",
