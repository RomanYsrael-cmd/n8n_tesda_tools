      "text": "5 The guidelines on assessment and certification are discussed in detail in the \"Procedures Manual on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS)\". --- PDF PAGE 45 --- _____________________________________________________________________________ TR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004 43 Receive and Respond to workplace communication Work with Others Demonstrate Work Values Participate in Workplace Communication Work in a Team Environment Practice Career Professionalism Practice occupational Health and Safety Procedures Practice Housekeeping Procedures (5S) Lead Workplace Communication Lead Small Team Develop and Practice Negotiation Skills Solve Problems Related to Work Activities Use Mathematical Concepts and Techniques Use Relevant Technologies Utilize Specialist Communication skills Develop Team and Individual Apply Problem Solving Techniques in the Workplace Collect, Analyze and Organize Information Plan and Organize Work Promote Environmental Protection Apply OHS Practices and 5 S in the workplace Apply Quality Standards Perform Computer Operations Communicate effectively in a customer contact center Render quality customer service Utilize enterprise/ company technology Conduct contact center campaign Provide specialized support and assistance to customers Manage the activities of a contact center work team Lead a contact center work team Use business technology Use medical technology to carry out task Produce text from audio transcription Review/edit documents Manage the activities of a work team Lead a team in delivering quality service Produce cleaned-up and in-betweened drawings Create 2D models and images Produce 2D colored animation Produce key drawings for animation Produce over-all designs for animation Produce background designs Composit and edit animation sequence Create 3D models and images Produce storyboard for animation Coordinate the production of animation Qualification for NC II --- PDF PAGE 46 --- _____________________________________________________________________________ TR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004 44 1. Anatomy – the branch of morphology concerned with the structure of animals or plants. 2. Browser – a software package that provides the user interface for accessing Internet, intranet and extranet Web sites. 3. Computer – a device that has the ability to accept data; internally store and execute a program of instructions; perform mathematical, logical, and manipulative operations on data; and report the results. 4. Computer Terminal – any input/output device connected by telecommunications links to a computer. 5. Data - objective measurements of the attributes (characteristics) of entities such as people, places, things, and events. 6. Documentation – a collection of documents or information. 7. Edit – to modify the form or format of data 8. Encryption – to scramble data or convert it, prior to transmission, to a secret code that masks the meaning of he data to unauthorized recipients. 9. End user – anyone who uses an information system or the information it produces. 10. Ergonomics - the science and technology emphasizing the safety, comfort, and ease of use of human-operated machines. The goal of ergonomics is to produce systems that are user-friendly: safe, comfortable and easy to use. 11. Information – data placed in a meaningful and useful context for an end user. 12. Information and Communication Technology (ICT) - refers to technologies associated with the transmission and exchange of data in the form of sound, text, visual images, signals or any combination of those forms through the use of digital technology. It encompasses such services as telecommunications, posts, multimedia, electronic commerce, broadcasting, and information technology. 13. Keyboarding – using the keyboard of a microcomputer or terminal. 14. Knowledge workers – people whose primary work activities include creating, using, and distributing information. 15. Local Area Network (LAN) – a communications network that typically connects computers, terminals, and other computerized devices within a limited physical area such as an office, building, manufacturing plant and other work sites. 16. Outsourcing – turning over all or part of an organization’s information systems operation to outside contractors, known as systems integrators or facilities management companies. --- PDF PAGE 47 --- _____________________________________________________________________________ TR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004 45 17. Physiology – the branch of biology concerned with the functions of living things. 18. Protocol – a set of rules and procedures for the control of communication in a communications network. 19. Quality Assurance – methods for ensuring that information systems are free from errors and fraud and provide information products of high quality. 20. Software – computer programs and procedures concerned with the operation of an information system. 21. Standards – measures of performance developed to evaluate the progress of a system toward its objectives 22. System – an assembly of methods, procedures, or techniques unified by regulated interaction to form an organized whole 23. Telecommunications – pertaining to the transmission of signals over long distances, including not only data communications but also the transmission of images and voices using communication technologies. 24. User- friendly – a characteristic of human-operated equipment and systems that makes them safe, comfortable, and easy to use. --- PDF PAGE 48 --- _____________________________________________________________________________ TR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004 46 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of these Training Regulations. • THE TECHNICAL ADVISORY PANEL (TAP) MS. MA. CORAZON M. AKOL (CHAIRPERSON) President JITSE Philippines Foundation 3rd Floor, OPPEN Bldg. Sen Gil J. Puyat Ave. Makati City MR. ARNEL F. HIBO (ACADEME) Vice President AMA Global Education System MR. CATALINO OBINARIO, JR. (LABOR) Rm. 605 Fil Garcia Tower 140 Kalayaan Ave., Q.C. • THE TECHNICAL EXPERT PANEL (TEP) DR. JOSEFINA V. LAUCHANGCO American Academy of Medical Transcription MS. JOAN RODRIGO Dictation Source Philippines, Inc. MS. CRISTABELLE CAMPOS SPI MS. MYLA ROSE M. REYES Total Transcription Solutions, Inc. MR. CLARENCE F. ROMANA Medscribe Asia MS. ROSARIO CAMIRING eData Services, Inc. DR. ANTON VILLANUEVA MTC Academy --- PDF PAGE 49 --- _____________________________________________________________________________ TR-ICT (MEDICAL TRANSCRIPTION NC II) Promulgated February 2004 47 The participants in the National Validation of this Training Regulation • Department of Trade and Industry – Center for International Trade Expositions and Missions (DTI – CITEM) • Medical Transcription Industry Association of the Philippines (MTIAPI) – Education Committee The Standards Setting and Systems Development Committee • Dr. Alberto Victor P. Fenix, Jr.– Chairperson • Atty. Ranulfo P. Payos • Dr. Nona Saldana Ricafort • Dr. Teresita U. Quirino • BM Teresita m. Borgoños • BM Rene Luis M. Tagle • Employers Sector Representative The Management and Staff of the TESDA Secretariat • Qualifications and Standards Office (QSO)"
