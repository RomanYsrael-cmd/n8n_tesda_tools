      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1. To attain the qualification of TRAINERS METHODOLOGY LEVEL I (IN- COMPANY TRAINER), the candidate must demonstrate competence in all units listed in Section 1. Successful candidates shall be awarded a Certificate signed by the TESDA Director General. 4.1.2. Assessment shall cover all competencies, with basic and common integrated or assessed concurrently with the core units of competency. 4.1.3 Any of the following are qualified to apply for assessment and certification: 4.1.3.1 Graduate of schools/institution-based and enterprise-based training programs in Trainers Methodology Level I (In-Company Trainer) 4.1.3.2 Individuals with certification as in-company trainer for at least 2 years within the last 5 years. 4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through competency. 4.1.4 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations. It includes the following: 4.1.4.1 entry requirements for candidates 4.1.4.2 evidence gathering methods 4.1.4.3 qualification requirements of competency assessors 4.1.4.4 specific assessment and certification arrangements as by industry. TR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018"
