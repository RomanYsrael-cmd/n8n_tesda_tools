  "source_text": "Section 1. Successful candidates shall be awarded a Certificate\nsigned by the TESDA Director General.\n\n4.1.2. Assessment shall cover all competencies, with basic and common integrated\nor assessed concurrently with the core units of competency.\n\n4.1.3 Any of the following are qualified to apply for assessment and certification:\n\n4.1.3.1 Graduate of schools/institution-based and enterprise-based training\n programs in Trainers Methodology Level I (In-Company Trainer)\n\n4.1.3.2 Individuals with certification as in-company trainer for at least 2 years\n within the last 5 years.\n\n4.1.3\nRecognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through competency.\n\n4.1.4\nThe industry shall determine assessment and certification requirements for\neach qualification with promulgated Training Regulations. It includes the\nfollowing:\n4.1.4.1 entry requirements for candidates\n4.1.4.2 evidence gathering methods\n4.1.4.3 qualification requirements of competency assessors\n4.1.4.4 specific assessment and certification arrangements as by industry.\n\n--- PDF PAGE 149 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n152\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\n\n--- PDF PAGE 150 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27, 2018\n153\n\nSupermarket of Competencies\nSupermarket of Competencies\nTVET Sector\n\nPerform job\nanalysis\n\nPrepare for\ntraining\nConduct\ntraining\nCORE\nCOMPETENCIES\nApply environmental\nprinciples and\nadvocate\nconservation\nLead workplace\ncommunication\nBASIC\nCOMPETENCIES\nUtilize IT\napplications in\ntechnical\ntraining\nLead small\nteams\nApply work\nethics, values\nand quality\nprinciples\nEnsure healthy\nand safe\nlearning\nenvironment\nMaintain and\nenhance\nprofessional\npractice\nConduct end-of-\ntraining\nassessment\nApply math and\nscience principles\nin technical\ntraining\nWork effectively\nin vocational\neducation and\ntraining\nFoster and\npromote a\nlearning culture\nDevelop and\npromote\nunderstanding of\nglobal labor\nmarkets\nDevelop and promote\nappreciation for cost-\nbenefits of technical\ntraining\n\n--- PDF PAGE 151 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27, 2018\n154\nGLOSSARY OF TERMS\n\nASSESSMENT\nACTIVITIES\nIncludes projects/problems, methods, duration and instructions\nto be used during assessment.\n\nATTITUDE\nAn innate or learned ability or distinguishing quality that allows\nan individual to complete a job.\n\nDUTY\nGeneral area of competence that successful workers in the\noccupation must demonstrate or perform on an ongoing basis.\n\nJOB\nDefined as a set of tasks and duties executed, or meant to be\nexecuted, by one person.\n\nJOB PROFILE\nA description of a particular work function that includes the\nelements deemed necessary to perform the post effectively.\nSpecifically, a job profile might include such things as job\nresponsibilities, required qualifications, advancement\nprospects, and the initial hourly pay or salary associated with\nthe position.\n\nKNOWLEDGE\nAn understanding and familiarity with facts and information.\n\nOCCUPATION\nA set of jobs whose main tasks and duties are characterized by\na high degree of similarity constitutes an occupation.\n\nREASONABLE\nADJUSTMENTS IN\nTHE ASSESSMENT\nMETHODS\nAre variations to assessment tasks including providing\nexamination questions in alternative formats, provision of\nspecialized equipment, substitution of one assessment task for\nanother of equivalent assessment task, and use of different\nvernaculars.\n\nSKILL\nDefined as the ability to carry out the tasks and duties of a\ngiven job.\n\nTASK\nA work activity that has a definite beginning and ending, is\nobservable, consist of two or more definite steps, and leads to\na product, service, or decision.\n\nTASK ANALYSIS\nIs the analysis of how a task is accomplished, including a\ndetailed description of both manual and mental activities, task\nand element durations, task frequency, task allocation, task\ncomplexity, environmental conditions, necessary clothing and\nequipment, and any other unique factors involved in or\nrequired for one or more people to perform a given task.\n\nTRAINING PLAN\na.k.a Rotation plan.\n\n--- PDF PAGE 152 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27, 2018\n155\n\n TRAINING REGULATIONS (TR)\n DOCUMENT REVISION HISTORY\n\nQualification Title : Trainers Methodology Level I (In-Company Trainer)\nQualification Code: _TVEICT118__\n\nRevision\nNo.\n\nDocument\nDescription Types*\nReplaces\nVersion\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution\nNo./ Date)\n\nDeployment\nCircular\n00\nDocument Created –\nTrainers Methodology\nLevel I (In-Company\nTrainer)\n\nNot Applicable\n\nTB No. 2018-06\nTESDA\nCircular No. 20\ns. 2018\n Legend: *Description Types\n-Document Created\n-Document Amended\n\n--- PDF PAGE 153 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27, 2018\n156\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend gratitude and appreciation to the many representatives of business, industry,\nacademe and government agencies and labor groups who donated their time and\nexpertise to the development and validation of these Training Regulations.\n\n• THE TECHNICAL EXPERT PANEL (TEP)\n\nDR. CARLA DIVINA S. VIRTUDAZO\nTechnical Expert\nIndependent Consultant\n\nMR. RODOLFO C. MENGUITA\nTechnical Expert\nDMCI\nMR. MARLON P. MIÑA\nTechnical Expert\nPhilippine Chamber of Commerce and\nIndustry\n\nMS. MARJORIE G. MENDENILLA\nTechnical Expert\nAsian Entrepreneurs Technological\nInstitute, Inc.\nMS. MARICRIS V. CAPISTRANO\nTechnical Expert\nPhilippine Chamber of Commerce and\nIndustry\n\nMS. MARIA REGINA R. AMORES\nTechnical Expert\nAsian Entrepreneurs Technological\nInstitute, Inc.\nMS. MARIA VANESSA R. VALENCIA\nTechnical Expert\nPCCI-HRDF\nMR. JOHN PAUL P. BRIONES\nTechnical Expert\nAFOS Foundation for Entrepreneurial\nDevelopment\n\n--- PDF PAGE 154 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27, 2018\n157\n\n• THE VALIDATORS:\n\nMR. RODOLFO C. MALLARI\nForeign Buyers Association of the\nPhilippines (FOBAP), Makati City\n\nMR. ROMULO M. VILLAMIN\nMASS-SPECC (Mindanao Association\nof FIs and Coops) Cooperative\nDevelopment Center, Cagayan de Oro\nCity\nDR. BENJAMIN R. QUIÑONES\nAsian Solidarity Economy Council\n(ASEC), Batasan Hills, Quezon City\n\nMR. PERCIVAL V. YAYA\nPeoples Credit and Finance\nCorporati