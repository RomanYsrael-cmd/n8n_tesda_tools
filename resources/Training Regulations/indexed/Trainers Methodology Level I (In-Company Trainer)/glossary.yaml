  "source_text": "ASSESSMENT\nACTIVITIES\nIncludes projects/problems, methods, duration and instructions\nto be used during assessment.\n\nATTITUDE\nAn innate or learned ability or distinguishing quality that allows\nan individual to complete a job.\n\nDUTY\nGeneral area of competence that successful workers in the\noccupation must demonstrate or perform on an ongoing basis.\n\nJOB\nDefined as a set of tasks and duties executed, or meant to be\nexecuted, by one person.\n\nJOB PROFILE\nA description of a particular work function that includes the\nelements deemed necessary to perform the post effectively.\nSpecifically, a job profile might include such things as job\nresponsibilities, required qualifications, advancement\nprospects, and the initial hourly pay or salary associated with\nthe position.\n\nKNOWLEDGE\nAn understanding and familiarity with facts and information.\n\nOCCUPATION\nA set of jobs whose main tasks and duties are characterized by\na high degree of similarity constitutes an occupation.\n\nREASONABLE\nADJUSTMENTS IN\nTHE ASSESSMENT\nMETHODS\nAre variations to assessment tasks including providing\nexamination questions in alternative formats, provision of\nspecialized equipment, substitution of one assessment task for\nanother of equivalent assessment task, and use of different\nvernaculars.\n\nSKILL\nDefined as the ability to carry out the tasks and duties of a\ngiven job.\n\nTASK\nA work activity that has a definite beginning and ending, is\nobservable, consist of two or more definite steps, and leads to\na product, service, or decision.\n\nTASK ANALYSIS\nIs the analysis of how a task is accomplished, including a\ndetailed description of both manual and mental activities, task\nand element durations, task frequency, task allocation, task\ncomplexity, environmental conditions, necessary clothing and\nequipment, and any other unique factors involved in or\nrequired for one or more people to perform a given task.\n\nTRAINING PLAN\na.k.a Rotation plan.