        "source_text": "--- PDF PAGE 68 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n67 \nUnit of Competency \n: MAINTAIN AND ENHANCE PROFESSIONAL PRACTICE \n \nUnit Code \n: 500232108 \n \nUnit descriptor \n: This unit covers the knowledge, skills and attitude required \nfor individuals to manage their personal professional \nperformance and to take responsibility for their professional \ndevelopment in relation to the provision of training and \nservices. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Model high \nstandards of \nperformance \n1.1  Personal performance \nis consistent with the \norganization’s goals \nand objectives. \n1.2  Appropriate \nprofessional \ntechniques and \nstrategies are \nmodeled in \naccordance with \nexisting \norganizational policies \nand guidelines. \n1.3  Personal work goals \nand plans reflect \nindividual \nresponsibilities and \naccountabilities in \naccordance with \norganizational/legal \nrequirements. \n1.4  Ethical and \ninclusive practices \nare applied in \nprofessional practice \nand in accordance \nwith existing \norganizational policies \nand guidelines. \n1.1 Organizational \ngoals/objectives \n1.2 Organizational \nprocesses, \nprocedures and \nopportunities \nrelating to \nprofessional \ndevelopment \n1.3 Continuous \nimprovement \ntechniques and \nprocesses and \ntheir application \n1.4 Organizational/leg\nal requirements \n1.5 Ethical and \ninclusive \npractices \n1.1 \nLeadership skills \n1.2 \nSelf-evaluation \nskills \n1.3 \nResearch skills \n1.4 \nLiteracy skills \n2. Determine \npersonal \ndevelopment \nneeds \n2.1  Personal knowledge \nand skills are \nassessed against \nunits of competency \nand other relevant \nbenchmarks in \naccordance with the \n2.1 Training \npackages, \ncompetency \nstandards, other \nrelevant \nbenchmarks   \n2.2 Trends in \nvocational \n2.1 Self-evaluation \nskills \n2.2 Research skills \n2.3 Literacy skills\n\n--- PDF PAGE 69 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n68 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \ndevelopment needs \nand priorities. \n2.2  Changes in vocational \neducation, training \npolicy and operating \nenvironments are \nidentified in \naccordance with the \nimpact on \nprofessional practice \nand personal \ndevelopment needs.  \n2.3  Feedback from \ncolleagues and clients \nis identified and used \nin accordance with \npersonal learning \nneeds/areas of \nprofessional \ndevelopment. \n2.4  Future career options \nare identified as \nappropriate. \n2.5  Personal learning \nneeds are \ndocumented and \nupdated in \naccordance with \nexisting policies and \nprocedures. \n2.6  Personal \ndevelopment needs \nare discussed with \nrelevant personnel for \ninclusion in \naccordance with the \nprofessional \ndevelopment plan. \neducation, \ntraining policies \nand operating \nenvironments \n2.3 Workplace \nrelations \n2.4 Tools to identify \npersonal learning \nneeds/areas of \nprofessional \ndevelopment \n3. Participate in \nprofessional \ndevelopment \nactivities \n3.1  Development \nopportunities \nsuitable to personal \nlearning style/s are \nselected and used in \naccordance with \ncontinuous support of \nlearning and \nmaintenance of \n3.1 Networks relevant \nto professional \npractice \n3.2 Industry awards/ \nenterprise \nagreements \n3.3 Relevant OHS \nknowledge \nrelating to the \n3.1 Communication \nskills \n3.2 Interpersonal \nskills \n3.3 Literacy skills \n3.4 Time \nmanagement \nskills\n\n--- PDF PAGE 70 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n69 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nR