        "source_title": "PREPARE FOR TRAINING",
        "source_text": "--- PDF PAGE 93 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n92 \n \nUnit of Competency \n: \nPREPARE FOR TRAINING  \n \nUnit Code \n:  \nTVT232315 \n \nUnit descriptor \n:  \nThis unit covers the knowledge, skills and attitudes in \nplanning and preparing for training plan for an in-\ncompany training.  It includes competencies to  identify \ntraining requirements, prepare course brief, training \nplan, learning materials and other resources and  training \nfacilities. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Identify \ntraining \nrequirements \n1.1  Relevant policies \nand guidelines are \naccessed and \ninterpreted to guide \nthe development of \nwork-based \narrangements based \non standards. \n1.2  Current competencies \nof the target group \nare identified based \non the gathered data. \n1.3  Training gaps are \nidentified based on \ncurrent competencies \nand company \nstandards. \n1.1 Company \nstandards \n1.2 Data gathering \nmethods \n1.3 Report writing \n1.4 Office \nproductivity \ntools: word \nprocessing and \nspreadsheet \n1.5 Quality \nEnvironmental \nHealth and \nSafety (QEHS) \n1.6 Concepts and \nPrinciples of \nTNA \n1.7 Analysis tools \n1.1 \nAccessing and \ninterpreting \nrelevant policies \nand guidelines \n1.2 \nIdentifying \ncurrent \ncompetencies of \ntarget group \n1.3 \nIdentifying \ntraining gaps \n1.4 \nComputer skills \n1.5 \nAnalyzing \ntraining need \n2. Prepare \ncourse brief \n2.1  Working and learning \ntasks are determined \nfor specific target \ngroup based on the \nidentified training \ngaps. \n2.2  Learning Goals of the \ntrainees are \ndiscussed and \ncoordinated with \nrelevant personnel \n2.3  Course outline is \ndrafted based on \n2.1 Components of \ncourse brief: \n2.1.1 Goal \n2.1.2 course \ndescription \n2.1.3 objectives \n2.1.4 participant \n2.1.5 course \noutline \n2.1.6 training \nduration \n2.1 Planning and \norganizational \nskills \n2.2 Technical writing \n2.3 Instructional \nDesigning\n\n--- PDF PAGE 94 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n93 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \nidentified learning \ngoals and objectives. \n2.2 Relevant \nprovisions of \nDTS Law \n2.3 Relevant \nprovisions of \nApprenticeship \nLaw \n2.4 Magna Carta for \nWomen and \nChildren \n2.5 ID theories and \nprinciples \n2.6 Factors to \nconsider in \nselecting \nlearning \ncontents \n2.7 Training/Learnin\ng methods and \nstrategies \n3.  Prepare \ntraining plan \n3.1  Rotation plan is \nconferred with \nrelevant personnel  \n3.2  Support \nmechanisms are \nidentified and \narranged according to \nthe needs of the \ntrainees \n3.3  Training delivery \nmodes are identified \n3.4  Training methods \nthat pertains to the \nrequired \ncompetencies are \naddressed. \n3.5  Learning events are \nidentified and \nsequenced based on \ncourse brief. \n3.6  Formative \nassessment method \nare identified based \non training objectives. \n3.1 Training \nDelivery Modes \n3.2 Adult learning \nprinciples \n3.3 Types of \nTraining support \nmechanism \n3.4 Sequencing \nLearning \nEvents/Activities \n3.5 Types of \nAssessment \n3.6 The training \nrotation plan \n3.6.1 Training \nvenue \n3.6.2 Training \nduration \n3.1 Instructional \nDesigning \n3.2 Assessing \nLearning \n3.3 Arranging \nlearning \nevents/activities \n3.4 Sequencing \nskills\n\n--- PDF PAGE 95 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n94 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n3.7  Finalized training plan \nis presented to the \nrelevant personnel \nfor approval. \n4.  Prepare \nlearning \nmaterials and \nother \nresources \n4.1  Availability of learning \nmaterials and other \nresources are \nconfirmed with \nrelevant personnel if \nwithin the budget \nrequirements \n4.2  Learning materials \nare prepared in \naccordance to training \nobjectives. \n4.3  Resource \nrequirements are \nprepared in \naccordance with the \norganization‘s \nprocedures. \n4.1 Instructional \nMaterials \ndevelopment \nConcepts and \nPrinciples \n4.2 Types of \nLearning \nmaterials \n4.1 \nPlanning, \ncommunication \nand \norganizational \nskills \n4.2 \nCosting skills \n4.3 \nNegotiation skills \n4.4 \nPreparing \npresentation \nmaterials \n4.5 \nPreparing \nlearning \nmaterials \n5.  Prepare \ntraining \nfacilities \n5.1  Training locations \nare identified and \narranged according to \nthe training needs. \n5.2  Training Activities are \ncoordinated with \nrelevant personnel \n5.3  Training facilities are \nset-up according to \nthe training needs. \n5.4  Safety and \nhousekeeping \npractices are \nobserved following \nOccupational Safety \nand Health Standards \n(OSHS) and relevant \nenvironmental laws. \n5.1 Factors to \nconsider in \npreparing \nlearning stations \n5.2 OSHS \n5.1 Preparing \nlearning stations \n5.2 Practicing safety \nand \nhousekeeping\n\n--- PDF PAGE 96 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n95 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Policies and \nguidelines \nMay include: \n1.1 \nRelevant acts or legislations governing \napprenticeships/learnerships  \n1.2 \nLaws on gender advocacy and development (GAD) and \npersons with disabilities (PWD) \n1.3 \nRequirements stated in the training contract \n2.  Standards \nStandards May include: \n2.1 \nNational Competency standards \n2.2 \nIndustry specific competency standards \n2.3 \nInternational Labor Organization (ILO) regional \ncompetency standards \n2.4 \nOccupational Health and Safety Standards specific to the \npreparation of learning stations \n3.  Relevant \npersonnel \nMay include: \n3.1 \nWorkplace supervisor \n3.2 \nTraining manager \n3.3 \nOther trainer/facilitator/assessor \n3.4 \nTraining or assessment personnel \n3.5 \nWorkers whose own jobs may be affected by the \nproposed changes \n4.  Course outline \nMay include: \n4.1 \nContent \n4.2 \nMethods \n4.3 \nMaterials \n4.4 \nTraining duration \n5.  Support \nmechanisms \nMechanisms may include: \n5.1 \nContact numbers for help or guidance \n5.2 \nOn-line or e-mail tutoring \n5.3 \nWork-based mentoring \n5.4 \nLearning partners \n5.5 \nContact numbers of other trainees \n5.6 \nEquipment/tools/material needs \n6.  Training \ndelivery modes \nMay include but are not limited to the following: \n6.1 \nDual training \n6.2 \nOn- the-job / off- the- job training \n6.3 \nDistance delivery \n6.4 \nSelf-paced individualized delivery \n6.5 \nCommunity training \n7.  Training \nmethods \nMay include but are not limited to the following: \n7.1 \nOral presentations \n7.2 \nSimulation activities \n7.3 \nGroup work \n7.4 \nDemonstration \n7.5 \nLaboratory work \n7.6 \nAssignments \n7.7 \nComputer-based learning\n\n--- PDF PAGE 97 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n96 \nVARIABLE \nRANGE \n7.8 \nGroup discussion \n7.9 \nLecture \n8.  Preparation of \nresource \nrequirements \nMay include reservation and procurement of: \n8.1 \nsupplies, \n8.2 \nmaterials \n8.3 \nequipment for the training \n9.  Training \nlocations \nMay include: \n9.1 \nLecture room \n9.2 \nTraining facilities \n9.3 \nWorkshop/laboratories \n10. Training plan \nTraining Plan to include: \n10.1 Competencies to be obtained \n10.2 Timeframe for achieving competencies \n10.3 Training to be undertaken \n10.4 Delivery modes \n10.5 Details for structured training \n10.6 Assessment details and arrangements \n10.7 Parties responsible for training delivery and assessment \n10.8 Title of qualification to be awarded  \n \nEVIDENCE GUIDE \n \n1.  Critical Aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 \nIdentified training requirements \n1.2 \nPrepared course brief \n1.3 \nPrepared training plan \n1.4 \nPrepared learning materials and other resources \n1.5 \nPrepared training facilities \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1 \nSimulated workplace \n2.2 \nLearning materials and other resources \n2.3 \nTools, materials, and equipment relevant to the task to be \ndemonstrated \n2.4 \nReferences and manuals \n2.5 \nRelevant PPEs \n3.  Method of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nWork related project \n3.2 \nPortfolio with interview \n3.3 \nThird party report \n3.4 \nWritten exam \n3.5 \nDemonstration with oral questioning \n4.  Context of \nAssessment \n4.1 \nCompetency must be assessed on actual job or \naccredited assessment center \n4.2 \nCompetency assessment must be undertaken in \naccordance with endorsed TESDA assessment guidelines\n",
