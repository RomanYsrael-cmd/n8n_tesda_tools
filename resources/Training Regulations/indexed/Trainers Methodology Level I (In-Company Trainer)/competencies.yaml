rs \n4.2 Evaluating \nand \ndocumenting \nresults of \napplication of \nmath and \nscience. \n4.3 Introducing \nand \ndeveloping \nlogical, \nsystematic \nand scientific \nthinking and \nmethods. \n4.4 Utilizing \ncontextual \nand \nexperiential \nlearning.\n\n--- PDF PAGE 10 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n9 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Training aids \nMay include: \n1.1 \nCurriculum/modules \n1.2 \nLearning materials/activities \n1.2.1 Self-paced materials \n1.2.2 Job sheets \n1.2.3 Related theory \n1.3 \nAudio-visual aids \n1.3.1 Charts \n1.3.2 Graphs \n1.3.2 Diagrams \n1.4 \nInteractive video \n1.5 \nComputer-based training materials \n2.  Assessment methodology \nMay include: \n2.1 \nProjects \n2.2 \nCase problems \n2.3 \nWritten tests \n2.4 \nOral questioning \n2.5 \nInterviews  \n3.  Models/representations \nMay include: \n3.1 \nSimple quantitative models \n3.1.1 mathematical formulas using elementary \nalgebra \n3.1.2 constants and variables \n3.1.3 functions and relations  \n3.2 \nBasic laws and principles \n3.2.1 Ohm’s law \n3.2.2 Newton’s laws of motion  \n3.2.3 Boyle’s law \n3.3 \nGraphs and diagrams \n3.3.1 Charts and flowcharts \n3.3.2 Characteristic curves \n3.3.3 Refrigeration cycle \n3.3.4 Schematic/block diagrams \n3.3.5 Free-body diagrams  \n4.  Learning styles \nMay include:  \n4.1 \nKolb-model styles \n4.1.1 Converger \n4.1.2 Diverger \n4.1.3 Assimilator \n4.1.4 Accommodator \n4.2 \nHoney-Mumford model styles \n4.2.1 Activist \n4.2.2 Reflector \n4.2.3 Theorist \n4.2.4 Pragmatist \n4.3 \nFleming-model styles \n4.3.1 Visual learners \n4.3.2 Auditory learners \n4.3.3 Reading/writing-preference learners \n4.3.4 Kinesthetic/tactile learners\n\n--- PDF PAGE 11 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n10 \nVARIABLE \nRANGE \n5.  Contextual and experiential \nlearning methods \nMay include: \n5.1 \nCase studies and problems \n5.2 \nProject-based instruction \n5.3 \nField trips \n5.4 \nCompany visits \n5.5 \nInterviews \n5.6 \nInstitutional attachments/immersion \n5.7 \nCommunity service  \n \n \n \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated understanding of basic math and \nscience concepts relevant to the competency or \nqualification \n1.2 \nDemonstrated ability to apply math and science \nprinciples to the competency or tasks being \nperformed \n1.3 \nDemonstrated ability to integrate and contextualize \nmath and science concepts in the design and \ndelivery of technical training \n2.  Resource Implications \nThe following resources should be provided: \n2.1 \nAccess to math and science lab or similar workshop \n2.2 \nAccess to real or simulated work area \n2.3 \nCase problems in math and science applications \n3.  Method of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nObservation or demonstration with oral questioning \n3.2 \nWritten exam \n3.3 \nCase problems \n3.4 \nInterview \n3.5 \nPortfolio \n3.6 \nThird-party report \n4.  Context of Assessment \n4.1 Competency must be assessed on actual job or \naccredited assessment center \n4.2 Competency assessment must be undertaken in \naccordance with endorsed TESDA assessment \nguidelines\n",
