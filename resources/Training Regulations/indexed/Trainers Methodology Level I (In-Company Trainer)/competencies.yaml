        "source_title": "PERFORM JOB ANALYSIS",
        "source_text": "--- PDF PAGE 90 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n89 \nCORE COMPETENCY \n \nUnit of Competency \n: \nPERFORM JOB ANALYSIS \n \nUnit Code \n:  \nTVT232314 \n \nUnit descriptor \n:  \nThis unit covers the knowledge, skills and attitudes \nrequired to establish initial job profile, improve job profile \nand perform task analysis. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1.  Establish \ninitial job \nprofile \n1.1  Scope of job is listed \nbased on company \noperation and \nstandards \n1.2  Duties and tasks are \nenumerated and \nsequenced based on \ncompany operation \nand standards \n1.3  Initial job profile is \nsubmitted following \nworkplace \nprocedures. \n1.1 Nature and \ncontent of a Job \nprofile \n1.2 Competencies of \nthe job being \nanalyzed \n1.3 Writing reports \n1.4 Job role \ndefinition \n1.1 Planning and \norganizational \nskills \n1.2 Identifying duties \nand \nresponsibilities \n1.3 Identifying \nspecific tasks \nperformed for \neach duty \n1.4 Identifying \ngeneral \nknowledge and \nskills, worker \nbehaviors \nneeded \n1.5 Sequencing duty \nand task \nstatements \n1.6 Report writing \nskills \n2.  Improve job \nprofile \n2.1  Job profile is \nreviewed through \nconsultation with \nrelevant personnel. \n2.2  Result of the review is \nconsolidated following \nworkplace \nprocedures. \n2.3  Job profile is finalized \nand submitted for \napproval based on \n2.1 Validation \ncriteria \n2.2 Process of \nvalidation \n2.3 Consolidation \nmethods \n2.4 Technical \nWriting \n2.1 Consultation and \nvalidation skills \n2.2 Consolidation \nand organizing \nskills \n2.3 Technical writing \nskills\n\n--- PDF PAGE 91 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n90 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \nthe result of \nconsultation. \n2.5 Knowledge on \nexisting \nstandards of a \nspecific skills \n3.  Perform task \nanalysis \n3.1  Steps for each task \nare identified \naccording to finalized \njob profile. \n3.2  Knowledge, skills and \nattitude are listed \naccording to finalized \njob profile. \n3.3  Resources are listed \naccording to finalized \njob profile. \n3.1 Methods of \nanalysis \n3.2 Parameters for \ndefining \nknowledge, \nskills, and \nattitudes \n3.3 Technical writing \n3.4 Resources of \neach job profile \n3.1 Analytical skills \n3.2 Identifying tools, \nequipment, \nsupplies, and \nmaterials \n3.3 Technical writing \nskills\n\n--- PDF PAGE 92 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n91 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Relevant personnel \nMay include: \n1.1 \nHR \n1.2 \nWorkplace supervisor \n1.3 \nTraining manager \n1.4 \nIndustry coordinator \n \n \n \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared written communication following \nstandard format of the organization \n1.2 \nAccessed information using communication \nequipment \n1.3 \nMade use of relevant terms as an aid to \ntransfer information effectively \n1.4 \nIdentified initial job profile \n1.5 \nReviewed and finalized job profile \n1.6 \nPerformed task analysis \n1.7 \nIdentified resources based on finalized job \nprofile \n2.  Resource Implications \nThe following resources should be provided: \n2.1 \nFax machine \n2.2 \nTelephone \n2.3 \nWriting and printing materials \n2.4 \nInternet \n2.5 \nConference room \n2.6 \nFacilitation materials \n2.7 \nSimulated workplace \n2.8 \nReferences and manuals \n3.  Method of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 \nWritten exam \n3.2 \nDemonstration with oral questioning \n3.3 \nPortfolio with interview \n4.  Context of Assessment \n4.1 Competency must be assessed on actual job or \naccredited assessment center \n4.2 Competency assessment must be undertaken in \naccordance with endorsed TESDA assessment \nguidelines\n",
