tic \n(four \nfundamental \noperations) \n2.2 Elementary \nalgebra \n2.3 Basic science \n2.4 General science \n2.5 Natural sciences \n2.1 Communicati\non skills \n2.2 Training \ndevelopment \nand \nmanagement \nskills \n2.3 Observing \nsafety and \nhealth\n\n--- PDF PAGE 8 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n7 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement \nREQUIRED \nKNOWLEDGE \nAND ATTITUDE \nREQUIRED \nSKILL \nscience concepts in their \nwork and everyday life \n2.3  Class examples/ cases, \nexercises, and \nassignments are given \nfor trainees to explore \nand reflect on the \napplications/ \nmanifestations of math \nand science along the \ncourse content \n2.6 Physical and \nbiological \nsciences \n2.7 Social sciences \n2.8 Basic training \nmethodology \nrequirements \nin the \nclassroom, \nlaboratory \nand workshop \n2.4 Instructional \nskills \n3. Assess trainees’ \ninternalization of \nmath and \nscience \nconcepts  \n3.1  Trainees’ retention of \nbasic math and science \nconcepts are reviewed \nto identify areas needing \nfurther intervention \n3.2  Trainees’ appreciation of \nmath and science \nprinciples along the \ntrade area or subject \nmatter is determined \nusing applicable \nassessment \nmethodology. \n3.3  Simple mathematical \nand scientific models/ \nrepresentations are \ndiscussed to aid in the \nunderstanding and \napplication of principles \nand theories using \nlanguage, style and \nformat that are readily \nunderstood \n3.4  Poorly-understood areas \nof math and science \nrelevant to the course \nare given extra attention \nand explained in user-\nfriendly terms in \naccordance with \ntrainees’ interests and \nlearning styles. \n3.1 Assessment \nmethodology: \n3.1.1 Projects \n3.1.2 Case \nproblems \n3.1.3 Written tests \n3.1.4 Oral \nquestioning \n3.1.5 Interviews \n3.2 Models/ \nRepresentations:  \n3.2.1 Simple \nquantitative 