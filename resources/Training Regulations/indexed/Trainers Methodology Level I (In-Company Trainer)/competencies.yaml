el evaluation  \n2.7 \nTrainee skills certification rate \n2.8 \nPer-capita training costs \n2.9 \nSkill utilization rate \n2.10 Surveys\n\n--- PDF PAGE 83 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n82 \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated ability to identify, estimate and \nevaluate training cost components \n1.2 \nDemonstrated ability to assess training \nprograms according to their cost-\neffectiveness and return on investment \n1.3 \nDemonstrated ability to explain training costs \nand benefits and advocate cost-effective \ntraining \n2.  Resource Implications \nThe following resources should be provided: \n2.1 \nAccess to training and enrolment data, e. g., \ncollection, expenses, trainee performance \ndata \n2.2 \nAccess to an ongoing training program \n2.3 \nCase problems in cost-effective training \n3.  Method of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nCase problems \n3.2 \nWritten exam \n3.3 \nInterview \n3.4 \nSubmission and presentation of written \nreport or case study \n3.5 \nPortfolio \n3.6 \nThird-party report \n4.  Context of Assessment \n4.1 \nCompetency must be assessed on actual job or \naccredited assessment center \n4.2 \nCompetency assessment must be undertaken in \naccordance with endorsed TESDA assessment \nguidelines\n",
