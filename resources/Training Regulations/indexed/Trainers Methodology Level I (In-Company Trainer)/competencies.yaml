        "source_title": "FOSTER AND PROMOTE AN INCLUSIVE LEARNING CULTURE",
        "source_text": "--- PDF PAGE 48 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n47 \nUnit of Competency \n: FOSTER AND PROMOTE AN INCLUSIVE LEARNING \nCULTURE \n \nUnit Code \n: 500232106 \n \nUnit descriptor \n: This unit covers the knowledge, skills and attitude required \nfoster and promote an environment which supports inclusive \nwork practices and learning culture. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Practice \ninclusivity \n1.1  Individual \ndifferences and \nclients with \nparticular needs are \nacknowledged, \nrespected and valued \nin accordance with \nexisting work \npractices and learning \nculture. \n1.2  Personal perceptions \nand attitudes about \ndifference are \nexamined and revised \nto improve \ncommunication and \nprofessionalism in \naccordance with \nexisting work \npractices and learning \nculture. \n1.3  Principles \nunderpinning \ninclusivity are \nintegrated into all \nwork practices. \n1.4  The training \norganization’s access \nand equity policy is \nused in accordance to \nwork practices. \n1.5  Individuals' rights and \nconfidentiality are \nrespected at all times. \n1.1 The diversity of \nclients, client \nneeds, client \nbackgrounds and \ndiffering \nexpectations for \nvocational \neducation and \ntraining services \nare valued and \nrelayed in the \nlearning and \npractice of \ninclusivity. \n1.2 The concept of the \npower of paradigm/ \nperception, in \nrelation to attitudes \nand behavior  is \nelaborated to \nimprove \ncommunication and \nprofessionalism \n1.3 The principles, \nunderpinning, \ninclusivity and how \nto integrate them \ninto work practices \n1.1 Recognizing and \nbeing sensitive to \nindividual \ndifference and \ndiversity, for \nexample: \n1.1.1 Being sensitive \nto and valuing \nculture \n1.1.2 Acting without \nbias/ \ndiscrimination \n1.1.3 Responding to \nindividuals with \nparticular \nneeds \n1.2 Improve/ use \nlanguage and \ncommunication \nskills that reflect \ninclusive \nlanguage, address \ncross cultural \ncommunication, \nindirect \ncommunication, \nparticipation of \nothers (family/ \ncommunity/elders), \nappropriate time \nand \ncommunication \nprotocols,\n\n--- PDF PAGE 49 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n48 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \nencourage \nexpression by all \nindividuals, involve \na variety of \nmediums, religion \n2. Promote and \nrespond to \ndiversity \n2.1  The ground rules for \nparticipation and \nbehavior with \ncolleagues and clients \nare established in \naccordance with a \ncooperative and \nagreed process/es. \n2.2  Individuals are \nencouraged to \nexpress themselves \nand to contribute to \nthe work and learning \nenvironment in \naccordance with \ncooperative and \nagreed process/es. \n2.3  Individuals are \nprovided with \nopportunities to \nindicate specific \nneeds to support their \nparticipation in \nlearning and work in \naccordance with a \ncooperative and \nagreed process/es. \n2.4  Relevant research, \nguidelines and \nresources are \naccessed to support \ninclusivity in \naccordance with \nexisting guidelines \nand procedures. \n2.5  Verbal and body \nlanguage is sensitive \nto different cultures \nand backgrounds and \ndifferences in physical \nand intellectual \n2.1 Ethical and \ninclusive behaviors \nexpected of \nprofessional \nrelationships with \nclients and \ncolleagues \n2.2 Availability and \ntypes of supports \nfor clients with \nspecific needs \n2.3 Relevant policies, \nlegal requirements, \ncodes of practice \non: \n2.3.1 Disability, \ndiscrimination, \ninclusiveness, \nhuman rights, \nequal \nopportunity, \nracial \ndiscrimination \n2.3.2 Duty of 