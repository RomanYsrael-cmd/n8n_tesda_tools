        "source_text": "--- PDF PAGE 25 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n24 \nUnit of Competency \n: LEAD SMALL TEAM \n \nUnit Code \n: 500311110 \n \nUnit descriptor \n: This unit covers the knowledge, skills and attitudes to lead \nsmall teams including setting and maintaining team and \nindividual performance standards. This unit is adopted from \nthe basic competencies for National Certificate Level III.  In \nthe context of the Trainers Methodology (TM), the small \nteams here would refer to groups of trainees, audience or \nparticipants in a training situation, or a group of fellow \ntrainers. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Provide team \nleadership \n1.1  Work requirements \nare identified and \npresented to team \nmembers \n1.2  Reasons for \ninstructions and \nrequirements are \ncommunicated to \nteam members \n1.3  Team members’ \nqueries and \nconcerns are \nrecognized, \ndiscussed and dealt \nwith \n1.1 Company policies \nand procedures \n1.2 Relevant legal \nrequirements \n1.3 Trainee \nexpectations \n1.4 Work \nrequirements \n1.4.1 Trainee Profile \n1.4.2 Assignment \ninstructions \n1.5 Trainees’ \nconcerns \n1.1 Communication \nskills required for \nleading teams \n1.2 Informal \nperformance \ncounseling skills \n1.3 Team building \nskills \n1.6 Negotiating skills \n2. Assign \nresponsibilities \n2.1  Duties, and \nresponsibilities are \nallocated having \nregard to the skills, \nknowledge and \naptitude required to \nproperly undertake \nthe assigned  task \nand according to \ncompany policy \n2.2  Duties are allocated \nhaving regard to \nindividual preference, \ndomestic and \npersonal \nconsiderations, \nwhenever possible \n2.1 Team member’s  \nduties and \nresponsibilities \n2.1 Communication \nskills required for \nleading teams \n2.2 Informal \nperformance \ncounseling skills \n2.3 Team building \nskills \n2.4 Negotiating skills\n\n--- PDF PAGE 26 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n25 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n3. Set \nperformance \nexpectations \nfor team \nmembers \n3.1  Performance \nexpectations are \nestablished based on \nclient needs and \naccording to \nassignment \nrequirements \n3.2  Performance \nexpectations are \nbased on individual \nteam members duties \nand area of \nresponsibility \n3.3  Performance \nexpectations are \ndiscussed and \ndisseminated to \nindividual team \nmembers \n3.1 How performance \nexpectations are \nset \n3.1 Communication \nskills required for \nleading teams \n3.2 Informal \nperformance \ncounseling skills \n3.3 Team building \nskills \n3.4 Negotiating skills \n4. Supervised \nteam \nperformance \n4.1  Monitoring of \nperformance takes \nplace against defined \nperformance criteria \nand/or assignment \ninstructions and \ncorrective action \ntaken if required \n4.2  Team members are \nprovided with \nfeedback, positive \nsupport and advice on \nstrategies to \novercome any \ndeficiencies \n4.3  Performance issues \nwhich cannot be \nrectified or addressed \nwithin the team are \nreferenced to \nappropriate personnel \naccording to employer \npolicy \n4.4  Team members are \nkept informed of any \nchanges in the priority \nallocated to \nassignments or tasks \nwhich might impact \n4.1 \nMethods of \nMonitoring \nPerformance \n4.2 \nMonitor \nperformance \n4.3 \nFormal process \n4.4 \nInformal process \n4.5 \nProviding \nFeedback \n4.6 \nFormal process \n4.7 \nInformal process \n4.8 \nPerformance \nissues \n4.9 \nWork output \n4.10 Work quality \n4.11 Team \nparticipation \n4.12 Compliance with \nworkplace \nprotocols \n4.13 Safety \n4.14 Customer \nservice \n4.1 Communication \nskills required for \nleading teams \n4.2 Informal \nperformance \ncounseling skills \n4.3 Team building \nskills \n4.4 Negotiating skills\n\n--- PDF PAGE 27 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n26 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \non client/customer \nneeds and \nsatisfaction \n4.5  Team operations are \nmonitored to ensure \nthat employer/client \nneeds and \nrequirements are met \n4.6  Follow-up \ncommunication is \nprovided on all issues \naffecting the team \n4.7  All relevant \ndocumentation is \ncompleted in \naccordance with \ncompany procedures\n\n--- PDF PAGE 28 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n27 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Work requirements \nMay include: \n1.1 \nClient Profile \n1.2 \nAssignment instructions \n2.  Team member’s queries \nand concerns \nMay include: \n2.1 \nRoster details \n2.2 \nShift details \n3.  Monitoring of performance \nMay include: \n3.1 \nFormal process \n3.2 \nInformal process \n4.  Feedback \nMay include: \n4.1 \nFormal process \n4.2 \nInformal process \n5.  Performance issues \nMay include: \n5.1 \nWork output \n5.2 \nWork quality \n5.3 \nTeam participation \n5.4 \nCompliance with workplace protocols \n5.5 \nSafety \n5.6 \nCustomer service\n\n--- PDF PAGE 29 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n28 \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nMaintained or improved individuals and/or \nteam performance given a variety of possible \nscenario \n1.2 \nAssessed and monitored team and individual \nperformance against set criteria \n1.3 \nRepresented concerns of a team and \nindividual to next level of management or \nappropriate specialist and to negotiate on \ntheir behalf \n1.4 \nAllocated duties and responsibilities, having \nregard to individual’s knowledge, skills and \naptitude and the needs of the tasks to be \nperformed \n1.5 \nSet and communicated performance \nexpectations for a range of tasks and duties \nwithin the team and provided feedback to \nteam members \n2.  Resource Implications \nThe following resources should be provided: \n2.1 \nAccess to relevant workplace or appropriately \nsimulated environment where assessment \ncan take place \n2.2 \nMaterials relevant to the proposed activity or \ntask \n3.  Method of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nDirect observations of work activities of the \nindividual member in relation to the work \nactivities of the group \n3.2 \nObservation of simulation and/or role play \ninvolving the participation of individual \nmember to the attainment of organizational \ngoal \n3.3 \nCase studies and scenarios as a basis for \ndiscussion of issues and strategies in \nteamwork \n4.  Context of Assessment \n4.1 \nCompetency must be assessed on actual job or \naccredited assessment center \n4.2 \nCompetency assessment must be undertaken in \naccordance with endorsed TESDA assessment \nguidelines\n",
