ng \n2.2 Conducting pre-\nassessment of \nlearners \n2.3 Conducting \nformative \nassessment \n3.  Monitor and \nsupport \ntrainee's \nlearning \nprocess \n3.1  Learners’ performance \nare monitored based on \nwork requirement \n3.2  Learners’ difficulties are \naddressed based on \nwork requirement  \n3.3  Feedback is provided \nto improve learners \n3.1 Learning process \nmonitoring \ntechniques \n3.2 Approaches to \naddressing CBT \nlearning gaps \nand challenges \n3.1 Process \nobservation \nskills \n3.2 Addressing CBT \nlearning gaps \nand challenges \n3.3 Administering \nfeedback \nsessions\n\n--- PDF PAGE 99 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n98 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nStatement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \nperformance based on \nwork requirement \n3.3 Dynamics of \nfeedback-giving \nand receiving \n3.4 Preparation of \nactivity checklist \n3.4 Conducting \nformative \nassessment \n3.5 Preparing \nactivity checklist \n4.  Evaluate \nlearning \nsession \n4.1  Orientation on training \nevaluation procedures \nis done according to \ncompany standards. \n4.2  Evaluation data are \ngathered according to \ncompany standards. \n4.3  Data gathered from \nevaluation are analyzed \nagainst training plan. \n4.4  Relevant parts of the \nCompetency-based \nTraining (CBT) delivery \nsystem are adjusted \nbased on session \nevaluation results \n4.1 Orientation of \ntraining \nevaluation \nprocedures \n4.2 Tools and \ntechniques for \nevaluating \ntraining sessions \n4.3 Training \nEvaluation Data \nanalysis \n4.4 Adjustment of \nCBT delivery \nsystem \n4.1 \nConducting \norientation on \ntraining \nevaluation \nprocedures \n4.2 \nAdministering \nand analyzing \ntraining session \nevaluation tools \n4.3 \nGathering \nevaluated data \n4.4 \nAdjusting \nCompetency-\nbased Training \n(CBT) delivery \nsystem \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Training delivery \nMay include: \n1.1 \nTime allocation \n1.2 \nResources \n1.3 \nStrategies \n1.4 \nContent \n1.5 \n \n2. Trainees’ profile \nMay include: \n2.1 \nAge \n2.2 \nGender \n2.3 \nEducation \n2.4 \nWork experience \n2.5 \nLanguage \n3. Resources \nMay include: \n3.1 \nphysical \n3.2 \nfinancial \n3.3 \nadministrative resources\n\n--- PDF PAGE 100 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n99 \n \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared for implementation of training \n1.2 \nAnalyzed trainees’ profile \n1.3 \nImplemented training sessions \n1.4 \nMonitored and supported trainee's learning \nprocess \n1.5 \nEvaluated training session \n2.  Resource Implications \nThe following resources should be provided: \n2.1 \nSimulated workplace \n2.2 \nTools, materials, and equipment relevant to the \ntask to be demonstrated \n2.3 \nRelevant curriculum document \n2.4 \nReferences and manuals \n3.  Method of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration with oral questioning \n3.2 \nWritten exam \n3.3 \nPortfolio \n3.4 \nThird party report \n4.  Context of Assessment \n4.1 Competency must be assessed on actual job \nor accredited assessment center \n4.2 Competency assessment must be undertaken \nin accordance with endorsed TESDA \nassessment guidelines\n",
