        "source_title": "LEAD WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 4 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n3 \nSECTION 2 COMPETENCY STANDARDS \n \nThese guidelines are set to provide the Technical Vocational Education and \nTraining (TVET) providers with information and other important requirements to consider \nwhen designing training programs for TRAINERS METHODOLOGY LEVEL I                \n(IN-COMPANY TRAINER). \n \n \nBASIC COMPETENCY \n \n \nUnit of Competency \n: LEAD WORKPLACE COMMUNICATION \n \nUnit Code \n: 500311109 \n \nUnit descriptor \n: This unit covers the knowledge, skills and attitudes required \nto lead in the dissemination and discussion of ideas, \ninformation and issues in the workplace. \n \nContext of this unit \n: This unit is adopted from the basic competencies for National Certificate \nLevel III.  In the context of the Trainers Methodology (TM), the term \n“workplace” in this unit would be understood to mean “training/learning \nenvironment.” \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Communicate \ninformation \nabout \nworkplace \nprocesses \n1.1  Appropriate \ncommunication \nmethod is selected  \n1.2  Multiple operations \ninvolving several \ntopics areas are \ncommunicated \naccordingly \n1.3  Questions are used to \ngain extra information \n1.4  Correct sources of \ninformation are \nidentified \n1.5  Information is \nselected and \norganized correctly \n1.6  Verbal and written \nreporting is \nundertaken when \nrequired \n1.7  Communication skills \nare maintained in all \nsituations \n1.1 Organization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n1.2 Effective verbal \ncommunication \nmethods \n1.2.1 Non-verbal \ngestures \n1.2.2 Face to face \n1.2.3 Speaking to \ngroups \n1.2.4 Using \ntelephone \n1.2.5 Written \n1.2.6 Internet \n \n1.1 Organize \ninformation \n1.2 Convey intended \nmeaning \n1.3 Participate in \nvariety of \nworkplace \ndiscussions \n1.4 Comply with \norganization \nrequirements for \nthe use of written \nand electronic \ncommunication \nmethods\n\n--- PDF PAGE 5 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n4 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n2. Lead \nworkplace \ndiscussion \n2.1  Response to \nworkplace issues are \nsought  \n2.2  Response to \nworkplace issues are \nprovided immediately \n2.3  Constructive \ncontributions are \nmade to workplace \ndiscussions on such \nissues as production, \nquality and safety \n2.4  Goals/objectives and \naction plan \nundertaken in the \nworkplace are \ncommunicated \n2.1 Facilitating \nworkplace \ndiscussion \n2.2 Action planning in \nthe workplace \n2.3 Managing \nworkplace \ndynamics \n2.1 Communication \nskills required for \nleading teams \n2.2 Informal \nperformance \ncounseling skills \n2.3 Team building \nskills \n2.4 Negotiating skills \n3. Communicate \nissues arising \nin the \nworkplace \n3.1  Issues and problems \nare identified as they \narise \n3.2  Information regarding \nproblems and issues \nare organized \ncoherently to ensure \nclear and effective \ncommunication \n3.3  Dialogue is initiated \nwith appropriate \npersonnel \n3.4  Communication \nproblems and issues \nare raised as they \narise \n3.1 Defining \nperformance gaps \n3.2 Identifying causes \nof performance \ngaps \n3.3 Gathering \nquantitative and \nqualitative data \n3.4 Consultation \nstrategies \n3.5 Solutions \nscreening and \nselection \n3.1 Communication \nskills required for \nleading teams \n3.2 Performance \ncounseling skills \n3.3 Team building \nskills\n\n--- PDF PAGE 6 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n5 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Methods of communication \nMay include: \n1.1 \nNon-verbal gestures \n1.2 \nVerbal \n1.3 \nFace to face \n1.4 \nTwo-way radio \n1.5 \nSpeaking to groups \n1.6 \nUsing telephone \n1.7 \nWritten \n1.8 \nInternet \n \n \n \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDealt with a range of communication/information \nat one time \n1.2 \nMade constructive contributions in workplace \nissues \n1.3 \nSought workplace issues effectively \n1.4 \nResponded to workplace issues promptly \n1.5 \nPresented information clearly and effectively \nwritten form \n1.6 \nUsed appropriate sources of information \n1.7 \nAsked appropriate questions \n1.8 \nProvided accurate information \n2.  Resource Implications \nThe following resources should be provided: \n2.1 \nVariety of Information \n2.2 \nCommunication tools \n2.3 \nSimulated workplace \n3.  Method of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nDirect Observation \n3.2 \nInterview \n4.  Context of Assessment \n4.1 Competency must be assessed on actual job or \naccredited assessment center \n4.2 Competency assessment must be undertaken in \naccordance with endorsed TESDA assessment \nguidelines\n",
