.4 \nReflected on and evaluate professional \npractice \n2.  Resource Implications \nThe following resources should be provided: \n2.1 \nrelevant organizational/legal documentation \n2.2 \naccess to relevant benchmarks \n2.3 \naccess \nto \nnetworks, \ntechnology, \ncommunication \n3.  Method of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration with questioning \n3.2 \nInterview \n3.3 \nWritten Test \n3.4 \nThird Party Report \n4.  Context of Assessment \n4.1 \nCompetency must be assessed on actual job or \naccredited assessment center \n4.2 \nCompetency assessment must be undertaken in \naccordance with endorsed TESDA assessment \nguidelines\n",
