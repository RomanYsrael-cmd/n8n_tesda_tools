ard-specific and other \nOHS regulations \n2.4 \nlegislative requirements for reporting and \nrecord keeping related to OHS \n3.  Various parties \nMay include: \n3.1 \nmanagers/supervisors \n3.2 \ndesignated person for OHS \n3.3 \nemployee OHS representatives \n3.4 \nother people with prior OHS knowledge, for \nexample: \n3.4.1 \ntrainers/facilitators and assessors \n3.4.2 \nprogram coordinators \n3.5 \ntraining and/or assessment organization \n4.  Organizational OHS \ndocumentation \nThe training organization and/or workplace in which \nthe training services take place, and may include: \n4.1 \npolicies and procedures \n4.2 \nincident reports \n4.3 \nemergency procedures \n4.4 \ninduction information \n4.5 \nrisk assessment \n4.6 \nsafety reports \n5.  Sources of information \nMay include: \n5.1 \nOHS regulatory authorities \n5.2 \nindustry bodies \n5.3 \nsubject and technical specialists including OHS \nprofessionals \n5.4 \nhazard and injury reports from similar learning \nenvironments \n6.  Hierarchy of control \nThe preferred priority for risk control, emphasizing \nhazard elimination and, where this is not possible, \nrisk minimization by such means as: \n6.1 \nsubstitution with a lesser hazard \n6.2 \nisolation of the hazard from people at risk\n\n--- PDF PAGE 66 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n65 \nVARIABLE \nRANGE \n6.3 \nengineering controls \n6.4 \nadministrative means (eg, safe work practices, \nprocedures and training) \n6.5 \nuse of personal protective equipment \n7.  Supervisory arrangements \nMay include: \n7.1 \nLevel of knowledge \n7.2 \nLevel of experience \n7.3 \nrights, responsibilities and obligations of the \nvarious parties \n7.4 \nthe code of conduct in the learning environment \n7.5 \ntypes of potential hazardous \nevents/emergencies and required responses \n7.6 \nhazards and their control in the learning \nenvironment, including the use and \nmaintenance of personal protective equipment \n8.  Appropriate information \nMay include: \n8.1 \nsafe access and egress \n8.2 \nwork procedures \n8.3 \nfirst aid provisions \n8.4 \narrangements in the learning environment for \nthe management of OHS, including: \n8.4.1 \nreporting procedures for hazards, \nincidents, injuries and faulty equipment \n8.4.2 \nprocesses to use when injury does \noccur \n8.4.3 \npolicies and procedures, including staff \nhandbooks\n\n--- PDF PAGE 67 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n66 \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nIdentified OHS responsibilities \n1.2 \nIdentified hazards in the learning environment \n1.3 \nAssessed risks in the learning environment \n1.4 \nDeveloped and implement actions to ensure the \nhealth safety and welfare of learners and/or \ncandidates \n1.5 \nProvided appropriate OHS requirements to \nlearners and/or candidates \n1.6 \nMonitored OHS arrangements in the learning \nenvironment \n2.  Resource Implications \nThe following resources should be provided: \n2.1 \naccess to resources and equipment to establish \nand maintain the safety, health and welfare of \nthe learner and/or candidate \n2.2 \naccess to legislative and training organization \ndocumentation on OHS \n3.  Method of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration with questioning \n3.2 \nCase Study/Situation \n3.3 \nInterview \n3.4 \nPortfolio Assessment \n4.  Context of Assessment \n4.1 Competency must be assessed on actual job or \naccredited assessment center \n4.2 Competency assessment must be undertaken in \naccordance with endorsed TESDA assessment \nguidelines\n",
