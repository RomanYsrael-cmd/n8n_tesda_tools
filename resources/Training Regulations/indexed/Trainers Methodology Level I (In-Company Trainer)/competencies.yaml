        "source_title": "DEVELOP AND PROMOTE UNDERSTANDING OF GLOBAL LABOR MARKETS",
        "source_text": "--- PDF PAGE 84 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n83 \nUnit of Competency \n: DEVELOP AND PROMOTE UNDERSTANDING OF \nGLOBAL LABOR MARKETS \n \nUnit Code \n: 500232110 \n \nUnit descriptor \n: This unit describes the outcomes required in understanding, \nanalyzing and disseminating information on global labor-\nmarket trends and concerns as they affect the TVET, labor \nand employer sectors. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Identify \ncurrent and \nfuture trends/ \nconcerns \n1.1  Relevant and reliable \nsources of labor-\nmarket information \n(LMI) are identified \nand accessed based \non needs \n1.2  Global and local \nrelevance of labor-\nmarket (LM) trends \nare studied and \nanalyzed for their \nimplications in the \nlabor and training \nmarket  \n1.3  Relevant events, \nincluding positions \nand interests of \ntrainees, clients and \ntraining providers are \nstudied and \nconsidered in the \ndesign and delivery of \ntraining \n1.1 Labor-market \nparadigm \n1.1.1 Supply side \n– TVET \nproviders \nand schools \ncommunitie\ns \n1.1.2 Demand \nside – \nemployers \n(governmen\nt and private \nsector) \n1.1.3 Labor \nrequirement\ns variations \nand \nseasonality \nin the LM \n1.1.4 Skills needs \nanticipation \nsystems \n1.2 TVET sector \nknowledge – work \nregime, systems, \ntechnologies and \nunique aspects \nrelevant to sector \nor geographic \narea \n1.3 Profile of TVET \nsector \n1.1 \nResearching LMI \n1.2 \nAnalyzing the \nrelevance, \naccuracy and \nshortcomings of \ninformation \n1.3 \nResearching \nskills needs \nanticipations \nsystems\n\n--- PDF PAGE 85 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n84 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \nstakeholders, \nopinion leaders \nand major players \n1.4 Legislations and \nregulations that \nimpact on the \nTVET sector \n2. Assess new \ndevelopments  \n2.1  Emerging issues of \npotential significance \nto the local and global \nlabor markets are \nidentified and studied \n2.2  Research findings are \nassessed for \nsignificance to the \ntechnical and \nvocational education \nand training (TVET)  \nsector \n2.3  Opportunities and \nrisks of new \ndevelopments are \nidentified and \nassessed \n2.4  Views of trainees, \ntraining providers and \nother stakeholders \nare identified and \nassessed for their \npotential benefit or \nimpact \n2.5  Where necessary \nresponses and \nstrategies for LM \nthreats and \nopportunities are \ndeveloped in \nconsultation with \nother TVET partners  \n2.6  New and emerging \nconcepts, \ntechnologies, \nproducts and \nprocesses are noted \nand evaluated based \non their implications \nfor the TVET and \nlabor market \n2.1 Events and trends \nthat have shaped \nthe global labor \nmarket over time \n2.2 Trends in \ncustomer \nexpectations and \nbuying patterns \n2.3 Responses and \nstrategies \n2.3.1 Retraining \n2.3.1 Search for \nnew markets \nand partners \n2.3.1 Skills \nupdating/ \nupgrading \n2.3.1 Refresher \ncourses \n2.3.1 Updating of \ncompetency \nstandards \n2.3.1 Competency \nassessment \nand \ncertification \n2.3.1 Adoption of \nnew training \nmethods and \ntechnologies \n2.3.1 Redesign of \ntraining \nprograms/ \ncourses \n2.1 Discerning \ntrends, issues \nand implications \n2.2 Assessing \nthreats and \nopportunities \n2.3 Communication \nand presentation \nskills\n\n--- PDF PAGE 86 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n85 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n3. Utilize labor \nmarket \ninformation to \nbest effect \n3.1  Awareness of LM \nsituation and related \nconcerns are \npromoted through \ntalks, lectures and \nother training \nopportunities \n3.2  Relevant information \non LM and new \ntechnologies are \nincorporated in the \ncurriculum and during \nthe training \n3.3  Mention/ \nPresentations of LMI \nand trends are made \nduring meetings, fora \nand training situations \nusing language and \ndelivery styles \nadapted to the \naudience \n3.4  Where necessary, \nresponses and \nstrategies to global \nlabor-market \ndevelopments are \ndeveloped and \nrecommended using \nanalytical tools and \ncurrent LMI \n3.1 Analytical tools \n3.1.1 SWOT \nanalysis \n3.1.2 Force-field \nanalysis \n3.1.3 Problem/Obje\nctives tree \n3.1.4 Fishbone/cau\nse-and-effect \ndiagram \n \n3.1 Research skills to: \n3.1.1 Keep up with \ntrends in \nvocational \neducation \nand training \nto obtain \ncurrent \ninformation \n3.1.2 Identify \nrelevant \nindustry \naffiliations \n3.1.3 Keep up with \ntrends/chang\nes/developme\nnts in the \nvocational \narea of \ncompetency \n3.2 communication \nskills to: \n3.2.1 Obtain \nfeedback \nfrom \ncolleagues \nand clients \n3.2.2 Participate in \nprofessional \nnetworks \n3.2.3 Consult with \ncolleagues \nand clients \n3.3 Interpersonal skills \nto: \n3.3.1 Participate in \nindustry \nevents and \nactivities \n3.3.2 Build \nprofessional \nrelationships\n\n--- PDF PAGE 87 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n86 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n3.3.3 Networking \nskills to build \nan industry \nnetwork \n3.4 literacy skills to: \n3.4.1 Document \npersonal \nlearning \nneeds \n3.4.2 Read and \ninterpret \nvocational \neducation \nand training \ninformation \nsuch as legal/ \norganizational \npolicy \ndocuments \n3.4.3 Complete and \nmaintain \nrecords \nrelated to \nprofessional \ndevelopment \n3.4.4 Ability to \nanalyze \norganizational \nfinancial \nperformance\n\n--- PDF PAGE 88 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n87 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  LMI sources \nMay include: \n1.1 \nProfessional literature and journals \n1.2 \nIndustry associations \n1.3 \nResource persons \n1.4 \nInternet sites, e. g., Jobs DB \n1.5 \nIndustry/trade meetings/conferences \n1.6 \nTrade fairs \n1.7 \nNetwork of contacts or key informants \n1.8 \nStatistical reports \n1.9 \nGovernment agencies, e. g., NSCB/NSO, \nDOLE (BLE, POEA, BLES, DILG, LGUs) \n1.10 Chambers of Commerce and Industry \n2.  Responses and strategies \nMay include: \n2.1 \nRetraining \n2.2 \nSearch for new markets and partners \n2.3 \nSkills updating/upgrading \n2.4 \nRefresher courses \n2.5 \nUpdating of competency standards \n2.6 \nCompetency assessment and certification \n2.7 \nAdoption of new training methods and \ntechnologies \n2.8 \nRedesign of training programs/courses \n3.  Analytical tools \nMay include: \n3.1 \nSWOT analysis \n3.2 \nForce-field analysis \n3.3 \nProblem/Objectives tree \n3.4 \nFishbone/cause-and-effect  diagram\n\n--- PDF PAGE 89 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n88 \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated ability to understand and \nanalyze global labor markets \n1.2 \nDemonstrated ability to identify and take \nadvantage of opportunities in the global LM \n1.3 \nDemonstrated ability to respond to potential \nthreats to TVET arising from LM trends \n1.4 \nDemonstrated ability to adapt technical \ntraining to global LM trends \n2.  Resource Implications \nThe following resources should be provided: \n2.1 \nTVET situationers and/or LMI research \nreports \n2.2 \nCase problems \n3.  Method of Assessment \nCompetency in this unit may be assessed through: \n3.1 \nInterview and oral questioning based on case \nproblems \n3.2 \nDemonstration with oral questioning of an \noral presentation made by the candidate \n3.3 \nThird-party report \n3.4 \nPortfolio (includes reports, \nrecommendations, research and information \nrelating to the global LM written by \ncandidate) \n4.  Context of Assessment \n4.1 Competency must be assessed on actual job \nor accredited assessment center \n4.2 Competency assessment must be \nundertaken in accordance with endorsed \nTESDA assessment guidelines\n",
