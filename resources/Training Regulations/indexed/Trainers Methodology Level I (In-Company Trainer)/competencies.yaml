        "source_title": "CONDUCT END-OF-TRAINING ASSESSMENT",
        "source_text": "--- PDF PAGE 101 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n100 \nUnit of Competency \n: \nCONDUCT END-OF-TRAINING ASSESSMENT \n \nUnit Code \n:  \nTVT232317 \n \nUnit descriptor \n:  \nThis unit covers the knowledge, skills and attitudes in \nconducting assessment. It details the requirements for \nreviewing evidence requirements and assessment \nmethods, organizing assessment activities, facilitating \nend-of-training and evaluating assessment activities. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n1. Review \nevidence \nrequirements \n1.1  Required \nevidences are \nrevisited from \ncompany standards \nwith reference to \nthe outcome of job \nanalysis \n1.2  Sufficiency of \nevidences are \nchecked with \nreference to \nevidence plan.  \n1.3  Required evidences \nare compiled \naccording to \ncompany standards. \n1.1 Competency \nStandards \nbased \nassessment \n1.2 Evidence \nrequirements \n1.3 Assessment \ncriteria \n1.4 Evidence \ngathering \nprocess, \nmethod and \ntools \n1.5 Rules of \nevidence \n1.6 Critical aspect \nof competence \n1.7 Purpose of \nassessment \n1.1 Accessing and \ninterpreting \nindustry and \ncompany \nstandards \n1.2 Understanding \nof the evidence \nrequirements \n1.3 Communicatio\nn skills \n1.4 Evaluation and \nanalytical skills  \n1.5 Skills in \ngathering \nevidence \n1.6 Planning and \norganizational \nskills \n2.  Review \nassessment \nmethods \nand tools \n2.1  Assessment \nmethods are \nchecked for \nappropriatness  \naccording to \nevidence \nrequirements.  \n2.2  Evidence plan is \nchecked for \nsufficiency based \non evidence \nrequirements.  \n2.3  Reasonable \nadjustments in the \nassessment \n2.1 Assessment \nMethods \n2.2 Evidence \nrequirements \n2.3 Evidence Plan \n2.4 Principles of \nAssessment \n2.5 Types of \nAssessment \n2.5.1 Formative \n2.5.2 Summative \n2.5.3 Work \nintegrated \n2.5.4 Diagnostic \n2.5.5 Dynamic \n2.1 Strategies for \ndetermining \nappropriate \nassessment \nmethods \n2.2 Analytical skills  \n2.3 Skills in making \nassessment \ndecisions \n2.4 Preparation of \nRating scale\n\n--- PDF PAGE 102 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n101 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \nmethods are \nproposed according \nto trainees’ profile. \n2.4 Assessment tools \nare reviewed for \nvalidity and \ntechnical \ncorrectness  \n2.5 Assessment criteria \nare reviewed based \non identified \nperformance criteria \n2.5.6 Synoptic \n2.6 Appropriate \nassessment \ntools for a given \nassessment \nmethod. \n2.7 Identification of \nAssessment \nCriteria \n3.  Organize \nassessment \nactivities \n3.1  Assessment \nactivities are \ncoordinated in \naccordance with the \nassessment plan.  \n3.2  Resources required \nfor assessment are \norganized according \nto assessment plan. \n3.3  Relevant \npersonnel are \ninformed of the \nassessment activity \nin line with industry \npolicy and \nprocedures. \n3.1 Assessment \nplan, \nAssessment \nmethods, \n3.2 Characteristics \nof assessment \nvenue \n3.3 Principles of \nassessment \n3.4 Equipment and \nmaterials \nspecification \n3.5 Calculation of \ncosts \n3.6 Environment \nsafety and \nHealth \nmanagement \nsystem \n3.7 Organizational \npolicy and \nprocedures on \nacceptable cost \nrange \n3.8 Organizational \npolicy on \nconduct of end \nof training \nassessment. \n3.9 Roles of \npersonnel in \nassessment \n3.1 Identifying \nassessment \nactivities \n3.2 Preparing \nrequest for \npurchase with \njustification \n3.3 Communicatio\nn skills \n3.4 Add topics \nfrom element & \nperformance \ncriteria\n\n--- PDF PAGE 103 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n102 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \n3.10 Procedure in \norganizing \nrequired \nresources: \n3.10.1 Obtaining \n3.10.2 Checking \n3.10.3 Arranging \n4.  Facilitate \nend-of-\ntraining \nassessment \n4.1  Trainees are \noriented on the \nconduct of \nassessment based \non assessment plan \n4.2  Needs of the \ntrainee are \ndetermined to \nestablish any \nallowable \nadjustments in the \nassessment \nprocedure \n4.3  Evidences are \ncollected and \ndocumented in \naccordance with the \nassessment \nprocedures \nspecified in the \nrelevant \nAssessment Plan \n4.4  Evidences are \nevaluated following \nthe designed rubrics \nand the \nrequirements of the \nindustry standards \n4.5  Assessment \ndecision is made \nbased on evaluation \nof the gathered \nevidences. \n4.6  Assessment result \nis recorded and \nsecured in \n4.1 Assessment \nprocedure, \nassessment \nplan, allowable \nadjustment, \n4.2 Context of \nassessment  \n4.3 Evidence \n4.4 Verbal and non \nverbal language \n4.5 Supportive \nassessment \nenvironment \n4.6 Evidence \ngathering \nmethods, \nobservation \netiquette, \nreasonable \nadjustment, \nassessment \ntools \n4.7 Dimensions of \ncompetency \n4.8 Use of rubrics \n4.9 Rules of \nevidence \n4.10 Evaluation of \nevidences \n4.11 Record \nmanagement \nguidelines \n4.1 Conduct \nOrientation \n4.2 Note taking \n4.3 Use of rating \nsheets \n4.4 Observation \nskills \n4.5 Decision \nmaking skills \n4.6 Use of \norganization \nassessment \nrecords \n4.7 Skills to \nprovide \nfeedback\n\n--- PDF PAGE 104 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n103 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange Statement \nREQUIRED \nKNOWLEDGE AND \nATTITUDE \nREQUIRED SKILL \naccordance with \napproved record \nkeeping guidelines \nof the organization. \n4.7 Feedback is given \nto the trainee in line \nwith the relevant \nAssessment Plan \n5.  Evaluate \nassessment \nactivities \n5.1  Assessment \nactivities are \nreviewed according \nto industry \nstandards. \n5.2  Consistency of \nassessment \ndecision is reviewed \nwith reference to \nperformance \nstandards \n5.3  Discrepancies and \ninconsistencies are \nrecorded based on \nindustry standards \n5.4  Reviewed activities \nand approach are \ndocumented based \non industry \nstandards \n5.5  Recommendation \nfor improvement is \nprepared based on \nthe result of \nevaluation \n5.1 Principles of \nassessment \n5.2 Procedure of \nassessment \nevaluation \n \n5.1 Evaluating \nassessment \nactivities \n5.2 Preparing \nevaluation \nreport\n\n--- PDF PAGE 105 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n104 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Relevant personnel \nMay include: \n1.1 \nHR \n1.2 \nWorkplace supervisor \n1.3 \nTraining manager \n1.4 \nOther trainer/facilitator/assessor \n1.5 \nTraining or assessment personnel \n1.6 \nWorkers whose own jobs may be affected by \nthe proposed changes \n2.  Evidences \nEvidences may include both: \n2.1 \nDirect evidence \n2.2 \nIndirect evidence \n2.3 \nHistorical evidence \n3.  Assessment Methods \nAssessment methods may include but are not \nlimited to: \n3.1 \nObservation \n3.2 \nQuestioning \n3.3 \nDemonstration \n3.4 \nThird Party Reports \n3.5 \nPortfolio \n3.6 \nWritten test \n3.7 \nSimulation \n4.  Record keeping \nRecord keeping may include: \n4.1 \nForms designed for the specific assessment \nresult \n4.2 \nChecklist for recording \n4.3 \nObservations/process \n4.4 \nRecords of the assessment procedure \n4.5 \nEvidence collected \n4.6 \nCombination of the above \n5.  Feedback \nMay include: \n5.1 \nAssessment decision \n5.2 \nGaps \n5.3 \nRemediation \n5.4 \nObservations (strengths and weaknesses)\n\n--- PDF PAGE 106 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)               February 27,2018       \n \n105 \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nOrganized assessment activities \n1.2 \nFacilitated end-of-training assessment \n1.3 \nEvaluated assessment activities \n2.  Resource Implications \nThe following resources should be provided: \n2.1 \nSimulated workplace \n2.2 \nTools, materials, and equipment relevant to \nthe task to be demonstrated \n2.3 \nRelevant curriculum document \n2.4 \nReferences and manuals \n3.  Method of Assessment \nCompetency in this unit may be assessed \nthrough: \n3.1 \nDemonstration/ with oral questioning \n3.2 \nWritten examination \n3.3 \nPortfolio \n3.4 \nThird party report \n4.  Context of Assessment \n4.1 Competency must be assessed on actual \njob or accredited assessment center \n4.2 \nCompetency assessment must be \nundertaken in accordance with endorsed \nTESDA assessment guidelines\n",
