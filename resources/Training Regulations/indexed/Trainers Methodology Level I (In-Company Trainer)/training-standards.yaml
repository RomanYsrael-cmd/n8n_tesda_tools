\nAssessment\nApproach\nNominal\nDuration\n• Analyze training\nevaluation data\n• Explain training\nadjustment procedure\n• Lecture-\ndiscussion\n• Interview\n4. Conduct end-\nof-training\nassessment\n4.1 Review evidence\nrequirements\n• Discuss industry\nstandards\n• Identify evidence\nrequirements\n• Differentiate evidence\ngathering methods and\ntools\n• Discuss the dimension\nof competency\n• Explain rules of\nevidence\n• Identify performance\nstandards\n• Read and interpret\nperformance standards\n• Discussion\n• Lecture\n• Video\npresentation\n• Demonstration\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n4 hrs\n4.2 Review assessment\nmethods\n• Discuss assessment\nmethods\n• Discuss evidence plan\n• Explain evidence plan\n• Review assessment\nmethods\n• Discussion\n• Lecture\n• Video\npresentation\n• Demonstration\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n4 hrs\n4.3 Organize assessment\nactivities\n• Based on the\nAssessment plan\nprepared; appropriate\nvenue is identified,\n• Lecture\nDiscussion\n• Workshop /\nWriteshop\n• Rating on\nwritten output of\nworkshops /\nwriteshops\n2 hrs\n\n--- PDF PAGE 140 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n143\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nchecklist of equipment,\nmaterials, consumables\nand tools are\ndeveloped.\n• Safety and health\nmanagement plans are\nformulated.\n• Costing are computed\nbased on the identified\nvenue and the checklist\nfor the logistics, S&H\nplan including the\npersonnel required in\nthe conduct of\nassessment.\n• Demonstration\nwith Oral\nquestioning\n• Cost Calculation\n\n4.4 Facilitate end-of-training\nassessment\n• A simulation is\nconducted in orienting\ntrainees in preparation\nfor the assessment.\nThe orientation should\ninclude the following\ninformation:\n− Context and purpose\nof Assessment\n− Any allowable\nadjustments in the\nProcedure\n− Performance to be\nassessed and the\n• Lecture on the\nconduct of\nassessment\norientation\n• Simulation on\nthe conduct of\norientation\n• Simulation or\nRole play on the\nOrientation of\ncandidates.\n• Role play on\ngathering of\nevidences\n• Demonstration\nwith oral\nquestioning\n• Observation of\nrole plays\n• Use of the\nperformance\nrating\n• Written Test\n• Interview\n10 hrs\n\n--- PDF PAGE 141 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n144\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nevidence to be\ncollected\n− The Assessment\nprocedure\n− The Grading or Rating\nsystem\n• Role play of evidence\ngathering according to the\nprepared evidence plan\nand using the prepared\nassessment tools.\n• Role play on making\nassessment decisions by\ncorroborating evidences\ngathered in the\nsimulation of evidence\ngathering.\n• Practice filling up forms to\nrecord the assessment\nresults following record\nkeeping guidelines.\n• Role play in providing\nclear and constructive\nfeedback on the\nperformance of a\ntrainee in the\nassessment activity.\nFeedback is done on a\non a one-on –one basis.\n• Role play on\ndecision making\n• Discussion on\ncorroboration of\nevidences and\nmaking decisions\n• Role play on\ndecision making\n• Group\ndiscussion on\nhow to provide\nfeedback.\n• Role play on how\nto provide\nfeedback for\nlearning to take\nplace.\n\n--- PDF PAGE 142 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n145\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Role play on providing\nadvice to the trainees on\nstrategies that can reduce\ngaps in the required\ncompetencies.\n\n--- PDF PAGE 143 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n146"
