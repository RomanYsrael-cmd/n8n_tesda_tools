ence our behavior\ntowards others\n• Explain Dignity as\nInherent Value of man\n• Lecture-\ndiscussion\n• Role-playing/\nsimulation\n• Case studies\n• Demonstration\n• Case studies\n\n--- PDF PAGE 118 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n121\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Describe how Inclusive\nEnvironment promotes\nequal opportunity\n• Describe situations on\nhow to Deal with\nLearners and various\ntypes individuals\n7. Work\neffectively in\nvocational\neducation and\ntraining\n7.1 Work within the\nvocational education\nand training policy\nframework\n• Read and discuss the\nvarious international\nand national vocational\neducation and training\npolicies and frameworks\n• Identify and discuss the\nvarious vocational\neducation and training\norganizations and\nstakeholders\n• Identify and discuss the\nrelevant legal and policy\nrequirements, codes of\npractice, national\nstandards and\nlegislations\n• Identify and learn\nvocational education\nand training terminology\n• Lecture/\nDiscussion\n• Focus group\ndiscussions\n• Written\n• Questioning\n4 hours\n\n--- PDF PAGE 119 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n122\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n7.2 Work within the training\norganization’s quality\nframework\n• Identify and discuss\nrelevant organizational\ndocumentation\n• Identify and discuss\ninternal quality policies\nand procedures\n• Identify and discuss the\norganization’s ethical\nand legal\nresponsibilities\n• Focus group\ndiscussions\n• Lecture\n• Video\npresentation\n• Written\n• Question and\nAnswer\n• Written\n4 hours\n7.3 Manage work and work\nrelationships\n• Discuss and share\nwork issues related to:\n• time pressures\n• work overload\n• competing demands\n• unexpected\ncontingencies\n• technology pro