\ngathering, nest\ndisturbance and egg\ncollecting.\n4. Utilize IT\napplications in\n4.1 Set-up work\nenvironment\n\n• Review trainee’s\nknowledge in basic\ncomputer operations\n• Discussion\n• Demonstration\n• Return-demo\n• Interview\n• Portfolio (with\nQuestioning)\n8 hours\n\n--- PDF PAGE 113 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n116\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\ntechnical\ntraining\n• Assess trainee’s skill\nlevel in software\noperating systems\n• Practice proper usage\nof printer and other\nproductivity tools and\noffice equipment\n• Practice session • Written test\n4.2 Utilize word processing\napplication\n\n• Enumerate the types of\noffice documents i.e.\nreports, information\nsheets, etc.\n• Discuss the standards\nin document formats\n• Complete various\nexercises in creating\ndocuments using\nstandard software and\ncomputer applications\n• Practice processing\ndocuments using\nsoftware application and\nprinter\n• Lecture -\ndiscussion In\ndividual Study\n• Individual\nExercise\n• Individual\nProject\n• Interview\n• Portfolio (with\nQuestioning)\n• Written test\n• Evaluate case\nstudy results\n4.3 Utilize presenter\napplication\n• Differentiate the various\npresenter software\navailable in the market\n• Demonstrate how the\npresenter software\noperates, their features\nand applications\n• Individual Study\n• Group Project\n• Group\nExercise/role\nplay\n• Interview\n• Portfolio (with\nQuestioning)\n• Written test\n\n--- PDF PAGE 114 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n117\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Relate how instructors\ncan utilize the presenter\nsoftware in their\ntrainings\n• Convert/export\npresentation into\nvarious formats to be\nutilized in different\nmedia\n• Practice the use of\nanimation and