    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)\nNC Level: LEVEL I\n\nNominal Training Duration:\n\n124 hrs – Basic Competencies\n\n 80 hrs – Core Competencies\n\n -----------\n\n204 hrs – Total\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills of\nan, in-company trainer, training officer, industry trainer, training and development officer,\ntechnical trainer, workplace trainer, training specialist, technology specialist, and training\nfacilitator. It includes competencies in performing job analysis, preparing for training,\nconducting training, planning end-of-training assessment, and conducting end-of-training\nassessment.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 108 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n111\nBASIC COMPETENCIES\n124 Hours\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\nCommunication\n1.1 Communicate\ninformation about\nworkplace processes\n• Usage of various\ncommunication\nmethods in workplace\nprocesses\n• Demonstrate use of\nquestions to gain\ninformation\n• Explain how to validate\ncorrectness of\ninformation\n• Describe how to\norganize information\n• Lecture-\ndiscussion\n• Role play\n• Interview\n8 hours\n1.2 Lead workplace\ndiscussions\n• Explain communication\nskills for leading teams\n• Lecture-\ndiscussion\n• Role Play\n• Interview\n1.3 Identify and\ncommunicate issues\narising in the workplace\n• Describe how\nperformance gaps in the\nworkplace are\naddressed\n• Lecture-\ndiscussion\n• Role play\n• Interview\n2. Apply math and\nscience\nprinciples in\ntechnical\ntraining\n2.1 Identify math and\nscience manifestations\nin the course content\nand the workplace\n• Describe math and\nscience requirements in\nthe training plan\n• Lecture-\ndiscussion\n• Portfolio\n8 hours\n2.2 Relate math and\nscience concepts to\n• Prepare class example\nand assignments for\n• Lecture-\ndiscussion\n• Portfolio\n\n--- PDF PAGE 109 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n112\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\ncommon and workplace\nsituations\napplication of math and\nscience along the\ncourse content\n2.3 Assess trainees’\ninternalization of math\nand science concepts\n• Describe assessment\nmethods to identify\ngaps in understanding\nmath and science\nprinciples along the\ntrade area or subject\nmatter\n• Lecture-\ndiscussion\n• Interview\n2.4 Introduce further\nenhancements\n3. Apply\nenvironmental\nprinciples and\nadvocate\nconservation\n3.1 Follow environmental\nworkplace practices\n• Identify Environmental\nhazard and risk analysis\n• Discuss ways to\navoiding or minimizing\nenvironmental risks and\nimproving\nenvironmental\nperformance\n• Discuss methods of\nwaste minimization and\nsegregation\n• Read and interpret data\nrelated to environmental\nmonitoring\n• Read signs and labels\n• Identify emergency\nprocedures\n• Discuss and perform\nhazard and incident\n• Lecture/\nDiscussion\n• Video\npresentation\n• Focus group\ndiscussions\n• Group work\n• Written\n• Demonstration\nwith oral\nquestioning\n2 hours\n\n--- PDF PAGE 110 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n113\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nrecording and reporting\nprocedures\n• Recognize and discuss\nbasic environmental\nhazards and threats\n• Discuss legislation,\ncodes, national and\ninternational standards\nrelated to environment\nprotection.\n3.2 Contribute to improve\nenvironmental work\npractices\n• Discuss strategies and\napproaches concerning\nthe ff.:\n- Minimize hazards and\nrisks,\n- Reduce and dispose\nof waste,\n- Efficient use energy\n- Conserve water\n- Reduce air and noise\npollution\n- Make more efficient\nuse of resources and\nimprove\nenvironmental\nperformance,\n- Reduce soil\ndisturbance and\nimprove habitat\nresources.\n• Focus group\ndiscussions\n• Written\n• Question and\nAnswer\n2 hours\n\n--- PDF PAGE 111 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n114\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Discuss environmental\npractices and policies\nrelated to:\n- Waste minimization\nand management,\n- Sustainability,\n- Local, regional, state\nand national strategies\non weed and pest\nmanagement,\n- Protection of land and\nhabitat and\nconservation of\nresources,\n- Energy use,\n- Greenhouse gas\nemissions,\n- Use of chemicals,\nplant and equipment.\n3.3 Recognize and report\npotential environmental\nthreats\n• Discuss potential\nenvironmental threat or\nhazards that include:\n- spills, leaks, pollution,\nplanned and\nunplanned emissions,\nsoil compaction,\ndisturbance and\nerosion,\n- Accidents and\ndisposal of waste, and\n• Group Work\n• Focus Group\nDiscussion\n• Presentation\n• Case Studies\n• Written\n• Observation\n• Question and\nanswer\n• Presentation\n(Practical\ndemonstration)\n4 hours\n\n--- PDF PAGE 112 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n115\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\ndamage or disruption\nto ecosystems\nresulting from work\npractices.\n- Also includes plants,\nanimals or diseases\nthat are classified as\nan environmental\nthreat or problem in an\narea,\n- Unauthorized changes\nin land use\n- Fire risks and threats,\nand inappropriate\nhuman interaction on\nthe environment.\n- This may include\ndamage to habitat\nresources, disruption\nof animal behavior\nand territorial use,\nillegal vegetation\nclearance, seed\ncollection, firewood\ngathering, nest\ndisturbance and egg\ncollecting.\n4. Utilize IT\napplications in\n4.1 Set-up work\nenvironment\n\n• Review trainee’s\nknowledge in basic\ncomputer operations\n• Discussion\n• Demonstration\n• Return-demo\n• Interview\n• Portfolio (with\nQuestioning)\n8 hours\n\n--- PDF PAGE 113 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n116\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\ntechnical\ntraining\n• Assess trainee’s skill\nlevel in software\noperating systems\n• Practice proper usage\nof printer and other\nproductivity tools and\noffice equipment\n• Practice session • Written test\n4.2 Utilize word processing\napplication\n\n• Enumerate the types of\noffice documents i.e.\nreports, information\nsheets, etc.\n• Discuss the standards\nin document formats\n• Complete various\nexercises in creating\ndocuments using\nstandard software and\ncomputer applications\n• Practice processing\ndocuments using\nsoftware application and\nprinter\n• Lecture -\ndiscussion In\ndividual Study\n• Individual\nExercise\n• Individual\nProject\n• Interview\n• Portfolio (with\nQuestioning)\n• Written test\n• Evaluate case\nstudy results\n4.3 Utilize presenter\napplication\n• Differentiate the various\npresenter software\navailable in the market\n• Demonstrate how the\npresenter software\noperates, their features\nand applications\n• Individual Study\n• Group Project\n• Group\nExercise/role\nplay\n• Interview\n• Portfolio (with\nQuestioning)\n• Written test\n\n--- PDF PAGE 114 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n117\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Relate how instructors\ncan utilize the presenter\nsoftware in their\ntrainings\n• Convert/export\npresentation into\nvarious formats to be\nutilized in different\nmedia\n• Practice the use of\nanimation and\ntransitions in the\npresentation\n4.4 Utilize spread sheet\napplication\n• Review the basics in\nrecord keeping and\nbook keeping\n• Understand the features\nof the work sheet\nsoftware, its features\nand its applications\n• Apply formulas in the\nwork sheet software\n• Learn the importance\nand proper application\nof charts and graphs\n• Practice utilizing other\nfunctions of the work\nsheet software relevant\nto the trainee’s work\nenvironment\n• Lecture-\ndiscussion\n• Individual study\n• Group Project\n• Interview\n• Portfolio (with\nQuestioning)\n• Written test\n\n--- PDF PAGE 115 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n118\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4.5 Utilize internet and\nwww to communicate\nand collect information\n• Review knowledge on\ninternet browsing, email\nand other electronic\ncommunication\napplication / software.\n• Exercise in configuring\nbrowser settings,\nprivacy and security\n• Discuss best practices\nin avoiding data risks,\nmalware and other\nsecurity concerns\nrelated to internet usage\n• Learn the basics in\ninternet network\nhardware and software\nconnectivity\n• Lecture-\ndiscussion\n• Individual study\n• Group project\n• Interview\n• Written test\n• Portfolio (with\nQuestioning)\n5. Lead small\nteams\n5.1 Provide team\nleadership\n• Explain work\nrequirements\n• Define role of team\nmembers\n• Explain the factors to\nconsider in performance\ncounselling\n• Lecture\n• Demonstration\n• Structured\nLearning\nExercise\n• Demonstration\n• Case studies\n8 hours\n5.2 Assign responsibilities\n\n• Perform teambuilding\nexercises\n• Role play team\nnegotiation and\nperformance\ncounselling\n• Lecture\n• Demonstration\n• Structured\nLearning\nExercise\n• Demonstration\n• Case studies\n\n--- PDF PAGE 116 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n119\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n5.3 Set performance\nexpectations for team\nmembers\n• Define performance\nexpectation\n• Explain the factors to\nconsider in setting\nperformance\nexpectations\n• Draft a KRA indicating\nnegotiated individual\nperformance\nexpectations\n• Lecture\n• Demonstration\n• Group Work\n• Demonstration\n• Case studies\n5.4 Supervised team\nperformance\n• Identify methods of\nmonitoring performance\n• Explain importance of\nperformance monitoring\n• Explain various\nperformance issues\n• Explain different ways\nof providing feedback\n• Role play how to\nprovide feedback\n• Lecture\n• Demonstration\n• Role Play\n• Demonstration\n• Case studies\n6. Apply work\nethics, values\nand quality\nprinciples\n6.1 Observe workplace\npolicies and guidelines\n• Explain Nature of Work\n• Discuss Dignity of Work\n• Explain the relationship\nbetween Values and\nWork Ethics\n• Compare and contrast\nCore Values and\nPersonal Values\n• Lecture-\ndiscussion\n• Role-playing/\nsimulation\n• Case studies\n• Demonstration\n• Case studies\n8 hours\n\n--- PDF PAGE 117 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n120\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Discuss the importance\nof Work Ethics\n• Explain how Excellence\nand Quality are\npracticed at Work\n• Analyze Work Functions\nof a person\n6.2 Value self-worth and\nprofession\n• Compare and contrast\nPersonal Leadership\nand Personal\nManagement\n• Describe how\nProfessional Image and\npractice are observed at\nwork\n• Role play how to\nRespect the individuality\nof Learners and co-\nworkers\n• Analyze how\nProfessionalism is\napplied at work\n• Lecture-\ndiscussion\n• Role-playing/\nsimulation\n• Case studies\n• Demonstration\n• Case studies\n6.3 Observe proper\nconduct in dealing with\nlearners and parents\n• Describe the Nature of\nMan and how it\ninfluence our behavior\ntowards others\n• Explain Dignity as\nInherent Value of man\n• Lecture-\ndiscussion\n• Role-playing/\nsimulation\n• Case studies\n• Demonstration\n• Case studies\n\n--- PDF PAGE 118 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n121\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Describe how Inclusive\nEnvironment promotes\nequal opportunity\n• Describe situations on\nhow to Deal with\nLearners and various\ntypes individuals\n7. Work\neffectively in\nvocational\neducation and\ntraining\n7.1 Work within the\nvocational education\nand training policy\nframework\n• Read and discuss the\nvarious international\nand national vocational\neducation and training\npolicies and frameworks\n• Identify and discuss the\nvarious vocational\neducation and training\norganizations and\nstakeholders\n• Identify and discuss the\nrelevant legal and policy\nrequirements, codes of\npractice, national\nstandards and\nlegislations\n• Identify and learn\nvocational education\nand training terminology\n• Lecture/\nDiscussion\n• Focus group\ndiscussions\n• Written\n• Questioning\n4 hours\n\n--- PDF PAGE 119 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n122\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n7.2 Work within the training\norganization’s quality\nframework\n• Identify and discuss\nrelevant organizational\ndocumentation\n• Identify and discuss\ninternal quality policies\nand procedures\n• Identify and discuss the\norganization’s ethical\nand legal\nresponsibilities\n• Focus group\ndiscussions\n• Lecture\n• Video\npresentation\n• Written\n• Question and\nAnswer\n• Written\n4 hours\n7.3 Manage work and work\nrelationships\n• Discuss and share\nwork issues related to:\n• time pressures\n• work overload\n• competing demands\n• unexpected\ncontingencies\n• technology problems\n• relations with other\npersonnel\n• Discuss planning and\nrelevant technological\nskills to manage and\naddress client\nissues/relations\n• Group Work\n• Focus Group\nDiscussion\n• Presentation\n• Sharing of\nexperiences\n• Written\n• Question and\nanswer\n4 hours\n7.4 Demonstrate a client-\nfocused approach to\nwork\n• Discuss clients and their\nneeds and expectations\n• Discuss effective\ncommunication\n• Focus Group\ndiscussion\n• Lectures\n• Written\n• Oral\nquestioning\n4 hours\n\n--- PDF PAGE 120 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n123\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nstrategies in\naccordance with\nbuilding better client\nrelationships.\n• Identify and discuss\nprocesses for\nevaluating and\nimproving client\nsatisfaction\n• Video\npresentation\n8. Foster and\npromote an\ninclusive\nlearning culture\n8.1 Practice inclusivity\n• Identify principles\nunderpinning inclusivity\n• discuss how to integrate\ninclusivity into learning,\nteaching and work\npractices\n• Describe the diversity of\nclients, client needs,\nclient backgrounds and\ndiffering expectations\nfor vocational education\nand training services.\n• Perform role-play to\nimprove communication\nskills to reflect inclusive\nlanguage and\naddressing cross-\ncultural communication.\n• Emphasize\ncommunication\nprotocols\n• Lecturette\n• Simulation/ role\nplaying\n• Written Test\n• Demonstration\n2 hours\n\n--- PDF PAGE 121 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n124\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n8.2 Promote and respond\nto diversity\n• Discuss relevant\npolicies, legal\nrequirements, codes of\npractice on: disability,\ndiscrimination,\ninclusiveness, human\nrights, equal\nopportunity, racial\ndiscrimination, duty of\ncare responsibilities and\naccess and equity\npolicies.\n• Perform role-play on\nverbal and body\nlanguage relative to\ndifferent cultures and\nbackgrounds and\ndifferences in physical\nand intellectual abilities.\n• Discuss availability and\ntypes of supports for\nspecific needs\nresponding to diversity\nby stakeholders.\n• Lecture\n• Demonstration\n• Demonstration\n• Oral\nquestioning\n2 hours\n8.3 Develop and implement\nwork strategies to\nsupport inclusivity\n• Discuss issues\nidentified to support\ninclusivity that are\nincorporated into work\npractices such as:\n• Lecture\n• Writeshop/\nworkshop\n• Oral\nquestioning\n• Written test\n4 hours\n\n--- PDF PAGE 122 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n125\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n- Availability of\nDocumented\nresources\n- Needs for physical\nenvironment support\n- OHS relating to the\nwork role/work\ncontext,\n- Internal policies and\nprocedures to meet\nOHS requirements\n8.4 Promote a culture of\nlearning\n• Identify and discuss\nstrategies, policies and\nsystems of promoting a\nculture of inclusive\nlearning emphasizing\ninternationally accepted\npractices and\nstandards.\n• Lecture\n• Writeshop\n• Written test\n• Oral\nquestioning\n4 hours\n8.5 Monitor and improve\nwork practices\n• Identify and discuss\nwork practice\nimprovement systems\nto enhance inclusivity\n• Lecture\n• Writeshop/\nworkshop\n• Written test\n4 hours\n9. Ensure healthy\nand safe\nlearning\nenvironment\n9.1 Identify Occupational\nHealth and Safety\n(OHS) responsibilities\n• Explain the concepts on\nOccupational Health\nand Safety\n• Understand the safety\npractices\n• Discuss the importance\nof Occupational Health\n• Lecture-\ndiscussion\n• Case studies\n• Demonstration\nwith oral\nquestioning\n• Case\nproblems\n• Interview\n16 hours\n\n--- PDF PAGE 123 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 