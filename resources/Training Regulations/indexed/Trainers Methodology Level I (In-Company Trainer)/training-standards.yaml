  "source_section_text": "SECTION 3. TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for TRAINERS METHODOLOGY LEVEL I (IN-\nCOMPANY TRAINER).\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER)\nNC Level: LEVEL I\n\nNominal Training Duration:\n\n124 hrs – Basic Competencies\n\n 80 hrs – Core Competencies\n\n -----------\n\n204 hrs – Total\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills of\nan, in-company trainer, training officer, industry trainer, training and development officer,\ntechnical trainer, workplace trainer, training specialist, technology specialist, and training\nfacilitator. It includes competencies in performing job analysis, preparing for training,\nconducting training, planning end-of-training assessment, and conducting end-of-training\nassessment.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 108 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n111\nBASIC COMPETENCIES\n124 Hours\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\nCommunication\n1.1 Communicate\ninformation about\nworkplace processes\n• Usage of various\ncommunication\nmethods in workplace\nprocesses\n• Demonstrate use of\nquestions to gain\ninformation\n• Explain how to validate\ncorrectness of\ninformation\n• Describe how to\norganize information\n• Lecture-\ndiscussion\n• Role play\n• Interview\n8 hours\n1.2 Lead workplace\ndiscussions\n• Explain communication\nskills for leading teams\n• Lecture-\ndiscussion\n• Role Play\n• Interview\n1.3 Identify and\ncommunicate issues\narising in the workplace\n• Describe how\nperformance gaps in the\nworkplace are\naddressed\n• Lecture-\ndiscussion\n• Role play\n• Interview\n2. Apply math and\nscience\nprinciples in\ntechnical\ntraining\n2.1 Identify math and\nscience manifestations\nin the course content\nand the workplace\n• Describe math and\nscience requirements in\nthe training plan\n• Lecture-\ndiscussion\n• Portfolio\n8 hours\n2.2 Relate math and\nscience concepts to\n• Prepare class example\nand assignments for\n• Lecture-\ndiscussion\n• Portfolio\n\n--- PDF PAGE 109 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n112\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\ncommon and workplace\nsituations\napplication of math and\nscience along the\ncourse content\n2.3 Assess trainees’\ninternalization of math\nand science concepts\n• Describe assessment\nmethods to identify\ngaps in understanding\nmath and science\nprinciples along the\ntrade area or subject\nmatter\n• Lecture-\ndiscussion\n• Interview\n2.4 Introduce further\nenhancements\n3. Apply\nenvironmental\nprinciples and\nadvocate\nconservation\n3.1 Follow environmental\nworkplace practices\n• Identify Environmental\nhazard and risk analysis\n• Discuss ways to\navoiding or minimizing\nenvironmental risks and\nimproving\nenvironmental\nperformance\n• Discuss methods of\nwaste minimization and\nsegregation\n• Read and interpret data\nrelated to environmental\nmonitoring\n• Read signs and labels\n• Identify emergency\nprocedures\n• Discuss and perform\nhazard and incident\n• Lecture/\nDiscussion\n• Video\npresentation\n• Focus group\ndiscussions\n• Group work\n• Written\n• Demonstration\nwith oral\nquestioning\n2 hours\n\n--- PDF PAGE 110 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n113\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nrecording and reporting\nprocedures\n• Recognize and discuss\nbasic environmental\nhazards and threats\n• Discuss legislation,\ncodes, national and\ninternational standards\nrelated to environment\nprotection.\n3.2 Contribute to improve\nenvironmental work\npractices\n• Discuss strategies and\napproaches concerning\nthe ff.:\n- Minimize hazards and\nrisks,\n- Reduce and dispose\nof waste,\n- Efficient use energy\n- Conserve water\n- Reduce air and noise\npollution\n- Make more efficient\nuse of resources and\nimprove\nenvironmental\nperformance,\n- Reduce soil\ndisturbance and\nimprove habitat\nresources.\n• Focus group\ndiscussions\n• Written\n• Question and\nAnswer\n2 hours\n\n--- PDF PAGE 111 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n114\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Discuss environmental\npractices and policies\nrelated to:\n- Waste minimization\nand management,\n- Sustainability,\n- Local, regional, state\nand national strategies\non weed and pest\nmanagement,\n- Protection of land and\nhabitat and\nconservation of\nresources,\n- Energy use,\n- Greenhouse gas\nemissions,\n- Use of chemicals,\nplant and equipment.\n3.3 Recognize and report\npotential environmental\nthreats\n• Discuss potential\nenvironmental threat or\nhazards that include:\n- spills, leaks, pollution,\nplanned and\nunplanned emissions,\nsoil compaction,\ndisturbance and\nerosion,\n- Accidents and\ndisposal of waste, and\n• Group Work\n• Focus Group\nDiscussion\n• Presentation\n• Case Studies\n• Written\n• Observation\n• Question and\nanswer\n• Presentation\n(Practical\ndemonstration)\n4 hours\n\n--- PDF PAGE 112 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n115\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\ndamage or disruption\nto ecosystems\nresulting from work\npractices.\n- Also includes plants,\nanimals or diseases\nthat are classified as\nan environmental\nthreat or problem in an\narea,\n- Unauthorized changes\nin land use\n- Fire risks and threats,\nand inappropriate\nhuman interaction on\nthe environment.\n- This may include\ndamage to habitat\nresources, disruption\nof animal behavior\nand territorial use,\nillegal vegetation\nclearance, seed\ncollection, firewood\ngathering, nest\ndisturbance and egg\ncollecting.\n4. Utilize IT\napplications in\n4.1 Set-up work\nenvironment\n\n• Review trainee’s\nknowledge in basic\ncomputer operations\n• Discussion\n• Demonstration\n• Return-demo\n• Interview\n• Portfolio (with\nQuestioning)\n8 hours\n\n--- PDF PAGE 113 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n116\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\ntechnical\ntraining\n• Assess trainee’s skill\nlevel in software\noperating systems\n• Practice proper usage\nof printer and other\nproductivity tools and\noffice equipment\n• Practice session • Written test\n4.2 Utilize word processing\napplication\n\n• Enumerate the types of\noffice documents i.e.\nreports, information\nsheets, etc.\n• Discuss the standards\nin document formats\n• Complete various\nexercises in creating\ndocuments using\nstandard software and\ncomputer applications\n• Practice processing\ndocuments using\nsoftware application and\nprinter\n• Lecture -\ndiscussion In\ndividual Study\n• Individual\nExercise\n• Individual\nProject\n• Interview\n• Portfolio (with\nQuestioning)\n• Written test\n• Evaluate case\nstudy results\n4.3 Utilize presenter\napplication\n• Differentiate the various\npresenter software\navailable in the market\n• Demonstrate how the\npresenter software\noperates, their features\nand applications\n• Individual Study\n• Group Project\n• Group\nExercise/role\nplay\n• Interview\n• Portfolio (with\nQuestioning)\n• Written test\n\n--- PDF PAGE 114 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n117\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Relate how instructors\ncan utilize the presenter\nsoftware in their\ntrainings\n• Convert/export\npresentation into\nvarious formats to be\nutilized in different\nmedia\n• Practice the use of\nanimation and\ntransitions in the\npresentation\n4.4 Utilize spread sheet\napplication\n• Review the basics in\nrecord keeping and\nbook keeping\n• Understand the features\nof the work sheet\nsoftware, its features\nand its applications\n• Apply formulas in the\nwork sheet software\n• Learn the importance\nand proper application\nof charts and graphs\n• Practice utilizing other\nfunctions of the work\nsheet software relevant\nto the trainee’s work\nenvironment\n• Lecture-\ndiscussion\n• Individual study\n• Group Project\n• Interview\n• Portfolio (with\nQuestioning)\n• Written test\n\n--- PDF PAGE 115 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n118\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4.5 Utilize internet and\nwww to communicate\nand collect information\n• Review knowledge on\ninternet browsing, email\nand other electronic\ncommunication\napplication / software.\n• Exercise in configuring\nbrowser settings,\nprivacy and security\n• Discuss best practices\nin avoiding data risks,\nmalware and other\nsecurity concerns\nrelated to internet usage\n• Learn the basics in\ninternet network\nhardware and software\nconnectivity\n• Lecture-\ndiscussion\n• Individual study\n• Group project\n• Interview\n• Written test\n• Portfolio (with\nQuestioning)\n5. Lead small\nteams\n5.1 Provide team\nleadership\n• Explain work\nrequirements\n• Define role of team\nmembers\n• Explain the factors to\nconsider in performance\ncounselling\n• Lecture\n• Demonstration\n• Structured\nLearning\nExercise\n• Demonstration\n• Case studies\n8 hours\n5.2 Assign responsibilities\n\