al\nresponsibilities\n• Focus group\ndiscussions\n• Lecture\n• Video\npresentation\n• Written\n• Question and\nAnswer\n• Written\n4 hours\n7.3 Manage work and work\nrelationships\n• Discuss and share\nwork issues related to:\n• time pressures\n• work overload\n• competing demands\n• unexpected\ncontingencies\n• technology problems\n• relations with other\npersonnel\n• Discuss planning and\nrelevant technological\nskills to manage and\naddress client\nissues/relations\n• Group Work\n• Focus Group\nDiscussion\n• Presentation\n• Sharing of\nexperiences\n• Written\n• Question and\nanswer\n4 hours\n7.4 Demonstrate a client-\nfocused approach to\nwork\n• Discuss clients and their\nneeds and expectations\n• Discuss effective\ncommunication\n• Focus Group\ndiscussion\n• Lectures\n• Written\n• Oral\nquestioning\n4 hours\n\n--- PDF PAGE 120 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n123\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nstrategies in\naccordance with\nbuilding better client\nrelationships.\n• Identify and discuss\nprocesses for\nevaluating and\nimproving client\nsatisfaction\n• Video\npresentation\n8. Foster and\npromote an\ninclusive\nlearning culture\n8.1 Practice inclusivity\n• Identify principles\nunderpinning inclusivity\n• discuss how to integrate\ninclusivity into learning,\nteaching and work\npractices\n• Describe the diversity of\nclients, client needs,\nclient backgrounds and\ndiffering expectations\nfor vocational education\nand training services.\n• Perform role-play to\nimprove communication\nskills to reflect inclusive\nlanguage and\naddressing cross-\ncultural communication.\n• Emphasize\ncommunication\nprotocols\n• Lecturette\n• Simulation/ role\nplaying\n• Written Test\n• Demonstration\n2 hours\n\n--- PDF PAGE 121 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n124\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n8.2 Promote and respond\nto diversity\n• Discuss relevant\npolicies, legal\nrequirements, codes of\npractice on: disability,\ndiscrimination,\ninclusiveness, human\nrights, equal\nopportunity, racial\ndiscrimination, duty of\ncare responsibilities and\naccess and equity\npolicies.\n• Perform role-play on\nverbal and body\nlanguage relative to\ndifferent cultures and\nbackgrounds and\ndifferences in physical\nand intellectual abilities.\n• Discuss availability and\ntypes of supports for\nspecific needs\nresponding to diversity\nby stakeholders.\n• Lecture\n• Demonstration\n• Demonstration\n• Oral\nquestioning\n2 hours\n8.3 Develop and implement\nwork strategies to\nsupport inclusivity\n• Discuss issues\nidentified to support\ninclusivity that are\nincorporated into work\npractices such as:\n• Lecture\n• Writeshop/\nworkshop\n• Oral\nquestioning\n• Written test\n4 hours\n\n--- PDF PAGE 122 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n125\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n- Availability of\nDocumented\nresources\n- Needs for physical\nenvironment support\n- OHS relating to the\nwork role/work\ncontext,\n- Internal policies and\nprocedures to meet\nOHS requirements\n8.4 Promote a culture of\nlearning\n• Identify and discuss\nstrategies, policies and\nsystems of promoting a\nculture of inclusive\nlearning emphasizing\ninternationally accepted\npractices and\nstandards.\n• Lecture\n• Writeshop\n• Written test\n• Oral\nquestioning\n4 hours\n8.5 Monitor and improve\nwork practices\n• Identify and discuss\nwork practice\nimprovement systems\nto enhance inclusivity\n• Lecture\n• Writeshop/\nworkshop\n• Written test\n4 hours\n9. Ensure healthy\nand safe\nlearning\nenvironment\n9.1 Identify Occupational\nHealth and Safety\n(OHS) responsibilities\n• Explain the concepts on\nOccupational Health\nand