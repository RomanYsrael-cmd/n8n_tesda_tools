l actions to\nconcerned parties\n• Demonstrate the use of\npersonal protective\nequipment (PPEs)\n• Apply proper responses\nto potential hazards\n• Explain communication\nskills to the person-in-\ncharge of Occupational\nHealth and Safety\n(OHS)\n• Lecture-\ndiscussion\n• Case studies\n• Demonstration\nwith oral\nquestioning\n• Case\nproblems\n• Interview\n\n--- PDF PAGE 125 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n128\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n9.5 Provide appropriate\nOccupational Health\nand Safety (OHS)\nrequirements to\nlearners and/or\ncandidates\n• Discuss the concepts of\nOccupational Health\nand Safety (OHS)\n• Analyze the hazards in\nentrance and exit points\n• Apply proper first aid\nrequirements\n• Differentiate the\nconcepts or hazards,\nincidents, injuries and\nfaulty equipment\n• Identify proper actions\nwhen injury occur\n• Lecture-\ndiscussion\n• Case studies\n• Demonstration\nwith oral\nquestioning\n• Case\nproblems\n• Interview\n9.6 Monitor Occupational\nHealth and Safety\n(OHS) arrangements in\nthe learning\nenvironment\n• Explain the effective risk\ncontrols\n• Prepare the important\nitems in writing incident\nand accident reports\n• Practice proper flow of\ninvestigation process\n• Draft investigation,\nincident and accident\nreports\n• Apply the monitoring\nsystem\n• Document and analyze\nthe risk control and\naction plan\n• Lecture-\ndiscussion\n• Case studies\n• Demonstration\nwith oral\nquestioning\n• Case\nproblems\n• Interview\n\n--- PDF PAGE 126 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n129\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n10. Maintain and\nenhance\nprofessional\npractice\n10.1 Model high standards\nof performance\n• Describe standards of\nprofessional\nperformance\n• Elaborate on\norganizationa