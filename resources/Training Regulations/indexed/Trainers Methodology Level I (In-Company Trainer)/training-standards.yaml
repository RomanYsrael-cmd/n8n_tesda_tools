\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nand Safety (OHS) in the\nworkplace\n• Describe the purpose\nand approaches of\nOccupational Health\nand Safety (OHS)\nresponsibilities\n• Organize\ndocumentation of the\nOccupational Health\nand Safety (OHS)\ndocuments\n• Analyze the safety\npolicies and\nresponsibilities\n9.2 Identify hazards in the\nlearning environment\n• Examination of the\nlearning environment\n• List down all potential\nhazards in the learning\nenvironment\n• Discuss potential\nhazards with the\nspecialist advisers\n• Lecture-\ndiscussion\n• Case studies\n• Demonstration\nwith oral\nquestioning\n• Case\nproblems\n• Interview\n9.3 Assess risks in the\nlearning environment\n• Describe the different\npotential hazards in the\nlearning environment\n• Role play potential\nhazards and the\ncountermeasures\n• Lecture-\ndiscussion\n• Case studies\n• Role playing\n• Demonstration\nwith oral\nquestioning\n• Case\nproblems\n• Interview\n\n--- PDF PAGE 124 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n127\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Explain factors to\nconsider in risk\nassessment\n• Assess the hierarchy of\nrisks in the learning\nenvironment\n9.4 Develop and implement\nactions to ensure the\nhealth safety and\nwelfare of learners\nand/or candidates\n• Learn the importance\nand of risk controls\n• Apply the concepts of\nhierarchy of control\n• Analyze the importance\nand proper application\nof risk control action\nplan\n• Explain the outstanding\nrisk control actions to\nconcerned parties\n• Demonstrate the use of\npersonal protective\nequipment (PPEs)\n• Apply proper responses\nto potential hazards\n• Explain communication\nskills to the person-in-\ncharge of Occupational\nHealth and Safety\n(OHS)\n• Lecture-\ndiscussion\n• Case studies\n• Demonstration\nwith oral\nquestioning\