\n• Identify and discuss\nemerging issues of\npotential significance to\nthe local and global\nlabor markets\n• Discuss and evaluate\nnew and emerging\nconcepts, technologies,\nproducts and based on\ntheir implications for the\nTVET and labor market\n• Discuss events and\ntrends that have shaped\nthe global labor market\nover time\n• Identify and discuss\ntrends in customer\nexpectations and buying\npatterns\n• Focus group\ndiscussions\n• Lecture\n• Video\npresentation\n• Written\n• Question and\nAnswer\n• Written\n2 hours\n\n--- PDF PAGE 130 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n133\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n12.3 Utilize labor market\ninformation to best\neffect\n• Discuss relevant\ninformation on LM and\nnew technologies as\nthey apply to the\ncompany\n• Discuss analytical tools\nrelated to Labor Market\nInformation and trends\n• Discuss planning and\nrelevant technological\nskills to manage and\naddress client\nissues/relations\n• Group Work\n• Focus Group\nDiscussion\n• Written\n• Question and\nanswer\n2 hours\n12.4 Demonstrate a client-\nfocused approach to\nwork\n• Discuss clients and their\nneeds and expectations\n• Discuss effective\ncommunication\nstrategies in\naccordance with\nbuilding better client\nrelationships.\n• Identify and discuss\nprocesses for\nevaluating and\nimproving client\nsatisfaction\n• Focus Group\ndiscussion\n• Lectures\n• Video\npresentation\n• Written\n• Oral\nquestioning\n2 hours\n\n--- PDF PAGE 131 ---\nTR- TRAINERS METHODOLOGY LEVEL I (IN-COMPANY TRAINER) February 27,2018\n\n134\nCORE COMPETENCIES\n80 Hours\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Perform job\nanalysis\n1.1 Establish initial job\nprofile\n• Identify job role\n• List scope of job\n• Enumerate and\nsequence duties and\ntasks\n• Identify general\nknowledge and 