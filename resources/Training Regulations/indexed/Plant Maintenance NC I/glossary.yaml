      "definition": "A collection of systematic actions performed to retained equipment in satisfactory operational condition and to prevent sudden malfunction. It includes routine, repetitive inspections, calibration, overhauls and lubrication. Work on a non-routine, non-repetitive basis performed to restore an item to a satisfactory condition after a malfunction has caused a degradation of the item below the specified performance level. (Sometimes called emergency maintenance) Study of equipment failures and breakdowns and taking the action necessary to prevent recurrence. Maintenance that requires an extended equipment shutdown that needs to be planned and scheduled in advance. - Failure that renders a machine totally inoperable or - Failure that leads to an unacceptable reduction in performance. A logical system of investigation designed to yield the correct cause of breakdown in the shortest possible time and with least likelihood of error Period of time during which an item is not in a condition to perform its intended use. A record of usage events and action as appropriate relating to a particular item Document reporting the departure of an item from an acceptable condition has occurred. A statement recording the work done and the condition of an item. A written instruction detailing work to be carried out. A document describing the work to be done. A document requesting work to be carried out. ‘to make smooth and slippery’ two contacting surfaces by introducing a lubricant that separates these surfaces in contact to reduce the effect of friction The transformation of matter by use and it results in a diminishing of the dimension of machinery parts."
