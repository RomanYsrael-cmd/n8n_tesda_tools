rials:\n6\n Dividers\n12\n Scribers\n24\n\nCardboard\n6\n• Compass\n6\n• Triangles\n24\n\nCartolina\n\n•\n\n•\n6\n\nScissors\n\nHousekeeping materials:\n20\n Brooms\n10\n Mops\n2\n Trash can\n10\n Clean rags\n2\n Soap\n5\n Dustpan\n\n--- PDF PAGE 49 ---\nPlant Maintenance Mechanic\n12/02/07\n47",
