    "source_text": "SECTION 3. TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for PLANT MAINTENANCE NC I.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title\n\n:\nPLANT MAINTENANCE NC Level: NC I\n\nNominal Training Duration :\n 358 Hours\n\nThis qualification is designed to develop knowledge, desirable attitudes and skills\nin Plant Maintenance NC I.\n\n It covers the competencies required to Perform Preventive Maintenance, Perform\nCorrective Maintenance and Install Machinery.\n\n To obtain this, all units of competency prescribed for this qualification must be\nachieved.\n\n--- PDF PAGE 40 ---\nPlant Maintenance Mechanic\n12/02/07\n38\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Explain routinary\n speaking & messages\n in a workplace\n1.2 Follow routinary\n speaking & messages\n1.3 Perform work duties\n following written notices\n• Group\ndiscussion\n• Interaction\n\n•\nInterviews/\nquestioning\n•\nObservation\n2. Work with\nothers\n2.1 Develop effective\n workplace relationship\n2.2 Contribute to work\n group activities\n• Group\ndiscussion\n• Interaction\n\n•\nInterviews/\nquestioning\n•\nDemonstration\n•\nObservation\n3. Demonstrate\nwork values\n\n3.1 Define the purpose of\n work\n3.2 Apply work values/\n ethics\n3.3 Deal with ethical\n problems\n3.4 Maintain integrity of\n conduct in the\n workplace\n• Group\ndiscussion\n• Interaction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\n unnecessary items\n4.2 Arrange items\n4.3 Maintain work areas,\n tools and equipment\n4.4 Follow standardize work\n process and procedures\n4.5 Perform work\n spontaneously\n• Group\ndiscussion\n• Interaction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n\n--- PDF PAGE 41 ---\nPlant Maintenance Mechanic\n12/02/07\n39\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment Approach\n1. Apply safety\n practices\n\n1.1 Identify hazards\n1.2 Use protective\n clothing and devices\n1.3 Perform safe handling\n of tools, equipment\n and materials\n1.4 Perform first aid\n1.5 Use fire extinguisher\n• Lecture\n• Group\n discussion\n• Interaction\n• Role\n playing /\n Simulation\n\n• Observation\n• Demonstration\n• Interview /\n Questioning\n\n2. Interpret\nworking\ndrawing and\nsketches\n\n2.1 Interpret technical\ndrawing\n2.2 Prepare freehand\nsketch of parts\n2.3 Interpret details from\nfreehand sketch\n• Lecture\n• Group\n discussion\n• Interaction\n• Observation\n• Interview /\n Questioning\n3. Perform\n shop\n computations\n\n3.1 Perform four\n fundamental operations\n3.2 Perform basic\n calculations involving\n fractions and decimals\n3.3 Perform basic\n calculations involving\n percentages\n3.4 Perform basic\n calculations involving\n ratio and proportion\n3.5 Perform calculations on\n algebraic expressions\n• Lecture\n• Demonstration\n• Practical\n exercise\n• Demonstration\n• Observation\n• Performance\n test\n• Interview /\n Questioning\n4. Measure\n workpiece\n\n4.1 Select and use\n measuring tools\n4.2 Clean and store\n measuring tools\n\n• Lecture\n• Demonstration\n• Practical\n exercise\n• Demonstration\n• Observation\n• Performance\n test\n\n--- PDF PAGE 42 ---\nPlant Maintenance Mechanic\n12/02/07\n40\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nPreventive\nMaintenance\n1.1 Explain why prevention is\n underlying theme of all\n maintenance work.\n\n1.3 Identify external symptoms\nof malfunction of a running\nmachine\n\n1.4 Inspect machine as per\n Inspection Checklist to find\n Internal evidence of\n symptoms\n\n1.5 Dismantle accessible\n portion of machine for\n cleaning and closer\n inspection of parts\n\n1.6 Adjust loose bolts, belt\n tension, chain slacks,\n covers, etc.\n\n1.7 Inspect lubrication system\nfor adequacy and correct as\nrequired.\n\n1.8 Prepare Inspection Report.\n and recommended actions\n for submission to superiors.\n\n1.9 Perform routine\nmaintenance in all power\ndrive components such as V-\nbelts, chain drives,\ncouplings, clutches, gears,\nbearings, etc., and fluid\npower systems\n\nFor process machineries,\n\n1.10 Inspect machines as per\nmanufacturer’s\nrecommendations\n\n• Lecture/\n discussion\n• Self-paced\ninstructions\n• Demonstration\n• Dualized\ntraining\n\n• Written or oral\n\n• Demonstration\n\n--- PDF PAGE 43 ---\nPlant Maintenance Mechanic\n12/02/07\n41\n\nUnit of\nCompetency\n\nLearning Outcomes\n\nMethodolgy\n\nAssessment\nApproach\n2. Perform\nplanned\nmaintainance\n2.1 Perform maintenance work\nplanned in advance.\n\n2.2 Gather work instructions\nabout maintenance work to\nbe done; work authorization\n\n2.3 Observe safety precautions\n before and during\n maintenance work. Tag in/\n Tag out\n\n2.4 Dismantle equipment to\n gain access to part to be\n replaced.\n\n2.5 Remove defective item and\n install the replacement.\n\n2.6 Inspect the defective item\n for cause of failure and note\n down for inclusion in report.\n\n2.6 Re-assemble, align and\n make minimum checks\n and/or adjustments\n\n2.8 Perform minimum tests\n required to ensure fault is\n eliminated.\n\nFor unplanned maintenance\n(emergency) where failure and\ncause is unknown\n\n2.9 Gather all necessary data\n to find the fault from\n operators or from data\n available (operational &\n background information..\n\n• Lecture/\n discussion\n• Self-paced\ninstructions\n• Demonstration\n• Dualized\nTraining\n\n• Written or oral\n\n• Demonstration\n\n--- PDF PAGE 44 ---\nPlant Maintenance Mechanic\n12/02/07\n42\n\n2.10 Divide mentally the\n machine into functional\n zones to check each\n zone separately in the\n drawing and/or the\n actual machine.\n\n2.11 Continue investigating all\n zones by eliminating\n those zones unaffected\n by the fault, until a zone\n is finally isolated.\n\n2.12 Dismantle the zone\n affected and each\n element of the zone\n Investigated by testing to\n pinpoint the particular\n element in the assembly\n where the fault lies.\n\n2.13 Investigate the cause of\n failure: whether wear\n failure, misuse\n failure or inherent\n weakness of the part\n failure .\n\n2.14 Make report of the job\n using Job Report Form\n\n3. Fabricate\nsimple items\n3.1 Prepare materials as per\n drawing and instruction\n3.2 Mark and cut materials\nusing different cutting\nmethods\n3.3 Process materials using\ndifferent machining and\nfitting methods\n3.4 Assemble and join materials\nusing different joining\nmethods\n3.5 Install items safely\n\n• Lecture/\n discussion\n• Self-paced\ninstructions\n• Demonstration\n• Dualized\nTraining\n\n• Written or oral\n\n• Demonstration\n\n--- PDF PAGE 45 ---\nPlant Maintenance Mechanic\n12/02/07\n43\n4. Install\nmachinery\n4.1 Remove equipment and\nclean area\n\n4.2 Move machinery using\n manual methods and\n moving machinery safely.\n\n4.3 Install machine and\nauxiliary connections\n\n4.4 Bolt down and level\nmachinery\n\n4.5 Test machinery\n\n• Lecture/\n discussion\n• Self-paced\ninstructions\n• Demonstration\n• Dualized\nTraining\n\n• Written or oral\n\n• Demonstration\n\n…\n\n--- PDF PAGE 46 ---\nPlant Maintenance Mechanic\n12/02/07\n44\n3.2 TRAINING DELIVERY\n\n The delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of Competency-Based TVET.\n\nThe training is based on curriculum developed from the competency standards;\n\n\nLearning is modular in its structure;\n\n\nTraining delivery is individualized and self-paced;\n\n\nTraining is based on work that must be performed;\n\n\nTraining materials are directly related to the competency standards and curriculum\nmodules;\n\n\n Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n\n\nTraining is based both on and off-the–job component;\n\n\nAllows for the recognition of prior learning ( RPL ) or current competencies;\n\n\nTraining allows for multiple entry and exit ; and\n\n\nApproved training programs are nationally accredited.\n\n The competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the–job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be adopted\nwhen designing training programs:\n\n\nThe dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in school and in-industry training of fieldwork components. Details\ncan be referred to the Dual Training System ( DTS )\nImplementing Rules and Regulations\n\n\n Modular / self-paced learning is a competency- based training modality wherein the\ntrainee is allowed to progress at his own pace. The trainer facilitates the training delivery\n\n\nPeer teaching / mentoring is training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n\n\nSupervised industry training or on-the-hob training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n\n Distance learning is formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer technologies.\n\n--- PDF PAGE 47 ---\nPlant Maintenance Mechanic\n12/02/07\n45\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n•\nMust possess Certificate of Competency in Benchwork, Turning, Milling\n•\nWith good moral character\n•\nAbility to communicate\n• Physically and mentally fit\n\n 3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n PLANT MAINTENANCE NC I\n\nRecommended list of tools, equipment and materials for the training of 12\ntrainees for Plant Maintenance NC I\n\n TOOLS\nQTY\n\nQTY\n\nQTY\n\n Maintenance Equipment\n4\n• Workbench\n12\n• Set of screwdriver\n4\n• Set of tin snips\n8\n• Bench vise\n12\n• Set of open\nwrench\n6\n• Hacksaw\n4\n• Anvil\n12\n• Set of socket\nwrench\n12\n• Chisels\n4\n• Sledge hammer\n12 • Set of Allen\nwrench\n12\n• Files\n12\n• Ball pein hammer\n12\n• Set of pliers\n4\n• Set of Scraper\n6\n• Mallet\n6\n• Set of drills\n1\n• Pipe threader\n3\n• Adjustable\nreamers\n6\n• Set of taps with\nwrench\n4\n• Adjustable wrench\n1\n• Hook spanner\n1\n• Impact spanner\n1\n• Machinist hammer\n2\n• Precision level\n2\n• Straightedge\n4\n• Steel rule\n6\n• Knife\n6\n• Paper cutter\n4\n• Torque wrench\n\n• Portable drill\n\n•\n\n•\n\n--- PDF PAGE 48 ---\nPlant Maintenance Mechanic\n12/02/07\n46\n\n Measuring Tools:\n6\n• Vernier caliper, 150\n12\n• Steel tape\n3\n• Micrometer, 50-75\n6\n• Vernier caliper, 200\n3\n• Micrometer, 25-50\n4\n• Outside caliper\n12\n• Steel measure tape\n3\n• Vernier depth gage\n4\n• Spring caliper\n4\n• Straight edge\n3\n• Inside caliper\n4\n• Dial indicator w/\nmounting bracket\n\n• Surface plate\n3\n• Outside caliper\n\n•\n\n Safety Device:\n3\n•First –Aid kit\n12\n• Face shield\n12\nWelding gloves\n4\n•Fire extinguisher\n12\n•\nSafety goggles\n24\nHand gloves\n4\n•Welding mask\n4\n•\nWelding goggles\n4\nWelding apron\n\nEQUIPMENT\nQTY\nQTY\nQTY\n3\nWelding machine\n2\nBench shear\n4\nOxyfuel Cutting\n1\nPower hacksaw\n1\nBench lathe\n1\nDrill press\n1\nBar cutter\n1\nBench Miller\n1\nBench grinder\n1\nPuncher\n2\nHand truck\n1\nForge\n1\nArbor press\n4\nElectric welder\n4\nWelding table\n6\nDollies\nChain block, 5T\n\nMATERIALS\n1\n• Solvents\n2\n\nFlat bar\n6mm x 150 x 6000 mm\n\n\nSteel plate, 3mm x\n1200 x 2400\n1\n• Kerosene\n6\n\nSteel sheet,\n1.2mm1200x 2400\n\n\nScissors\n\nLayout materials:\n6\n Dividers\n12\n Scribers\n24\n\nCardboard\n6\n• Compass\n6\n• Triangles\n24\n\nCartolina\n\n•\n\n•\n6\n\nScissors\n\nHousekeeping materials:\n20\n Brooms\n10\n Mops\n2\n Trash can\n10\n Clean rags\n2\n Soap\n5\n Dustpan\n\n--- PDF PAGE 49 ---\nPlant Maintenance Mechanic\n12/02/07\n47\n\n3.5 TRAINING FACILITIES\n PLANT MAINTENANCE NC I\n\nThe Drafting workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation areas\nare as follows:\n\nSPACE\nREQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n•\nBuilding\n(permanent)\n\n 10 M X 30 M\n\n 300 Sq. M\n Trainee working\nspace\n\n 2 M X 2 M\n\n4 Sq.M / trainee\n\n 100 sq. M.\nLecture Room\n 8 M X 10 M\n 80 Sq. M.\n 80 Sq. M\n Learning\nResource Center\n\n 4 M X 8 M.\n\n 32 Sq. M\n\n 32 Sq. M\n Facilities/\nEquipment/\nCirculation Area\n\n 88 Sq. M.\n\n3.6 TRAINER’S QUALIFICATIONS FOR METALS AND ENGINEERING\n SECTOR\n\n TRAINER QUALIFICATION (TQ I)\n\n• Must be a holder of Plant Maintenance NC I\n• Must have undergone training on Training Methodology I (TM I)\n• Must be computer literate\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience\n• Must be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 50 ---\nPlant Maintenance Mechanic\n12/02/07\n48"
