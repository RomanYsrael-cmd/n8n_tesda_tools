        "source_text": "MEE723304\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitude required to\nmove and install machineries.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPrepare designated\narea\n1.1\n\n1.2\n\nEquipment and its connections removed from the\ndesignated according to worksite procedure\n\nArea cleared of dirt and marked according to\nrequirement and causeways cleared of obstructions.\n2.\nMove machinery\n2.1\n\n2.2\n\n2.3\n\nSafety practices observed in handling heavy loads.\n\nMachinery lifted , and moved according to available\nhandling equipment or any manual method.\n\nMachinery lowered into position, bolted and leveled\naccording to standard procedure.\n3.\nInstall machinery\n3.1\n\n3.2\n\nMachinery installed, cleaned, and compressed air,\nhydraulic lines and other accessories connected.\n\nManual studied for operational procedures and safety\nprecautions for safe star-up procedures.\n4.\n\nTest machinery\n4.1\nTest machine with operator\n\n--- PDF PAGE 38 ---\nPlant Maintenance Mechanic\n12/02/07\n36\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1 Handling\nequipment\n1.1 Overhead crane\n1.2 Forklift\n1.3 A-frames\n1.4 Chain Blocks\n1.5 Dollies\n2. Manual moving\nmethods\n2.1 Crowbars\n2.2 Jacks\n2.3 Wedge\n2.4 Rollers\n2.5 Shim washers\n3. Communication\n3.1 Hand signals\n4. Accessories\n\n 4.1 Foundation\n 4.2 Anchor bolts\n 4.3 Hold down bolts\n 4.4 Leveling screw\n 4.5 Grout\n 4.6 Air distribution lines\n 4.7 Tapping of air lines\n 4.8 Power pack\n\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.4 Designated area and access ways cleared\n1.5 Machinery lifted and moved safely\n1.6 Machinery installed\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Principle of operation of machine\n2.2 Methods of lifting machines\n2.3 Methods of moving machines manually\n2.4 Lifting capacity of lifting equipment\n2.5 Principle of leveling\n2.6 Foundation design\n3.\nUnderpinning\nskills\n3.1 Use of hand signals\n3.2 Moving machines using manual method\n3.3 Use of claw bars, wedges and rollers in moving machines\n3.4 Working with a group\n\n4.\nResource\nimplications\n4.1 Machine to be installed\n4.2 Material handling equipment\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 Observation with a group and questioning\n5.2 Demonstration with questioning\n5.3 Portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 39 ---\nPlant Maintenance Mechanic\n12/02/07\n37"
      }
