ing machine assembly and sectional details \n      2.3 Sequence of dismantling parts of a machine \n      2.4  Inspection procedures as per manufacturer \n3. \nUnderpinning \nskills \n      3.1 Safe use of hand tools and equipment \n      3.2 dismantling and mounting of parts \n      3.3 using inspection report  routine maintenance report form \n      3.4 lubricating procedure \n      3.5 coupling alignment \n      3.6  adjusting belt tension and chain slacks \n      3.7 cleaning procedure      \n4. \nResource \nimplications \nThe following resources MUST be provided: \n      4.1  appropriate hand tools and supplies \n      4.2  drawings and manuals \n      4.3  inspection checklist \n      4.3  inspection and routine maintenance report form       \n5. \nMethod of \nassessment \nCompetency may be assessed through: \n5.1   Observation with questioning \n5.2   Demonstration with questioning \n5.3   Written examination  \n5.4   Portfolio \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
