welding \n 4.5  seaming  \n \n5.  Installation  methods \n \n5.1  expansion  bolts\n\n--- PDF PAGE 36 ---\nPlant Maintenance Mechanic  \n12/02/07 \n34\n \nEVIDENCE GUIDE \n \n \n1. \n \nCritical aspects of \nCompetency \n \nAssessment requires evidence that the candidate:  \n \n1.1  Work instruction understood \n1.2  Work prepared safely \n1.3  Material fabricated and assemble safely \n1.4  Item installed safely \n \n2. \n \nUnderpinning \nknowledge and attitude \n \n2.1 Interpreting drawings \n2.2 Cutting methods \n2.3 Bench work practices \n2.4 Machine shop practice  \nTurning \n Milling \n2.5 Off-hand grinding \n2.6 Gas welding \n2.7 Arc welding \n2.8 Pipe fitting \n \n3. \n \nUnderpinning skills \n \n3.1  Use of hand and power tools \n3.2  Use of oxyacetylene cutter and welding \n3.3  Use lathe machine \n3.3  Use milling machine \n3.4  Use of arc welder \n3.5  U of pipe threader \n \n4. \n \nResource implications \n \n4.1  Machines required for the job \n4.2  Hand appropriate to the job \n \n5. \n \nMethod of assessment \n \nCompetency may be assessed through: \n \n5.1   Observation with a group and questioning \n5.2   Demonstration with questioning \n5.3   Portfolio \n \n6. \n \nContext for \nassessment \n \nCompetency may be assessed in the workplace or in \nsimulated workplace environment.\n",
