y lifted and moved safely \n1.6 Machinery installed  \n2. \nUnderpinning \nknowledge and \nattitude  \n2.1 Principle of operation of machine \n2.2 Methods of lifting machines \n2.3 Methods of moving machines manually \n2.4 Lifting capacity of lifting equipment \n2.5 Principle of leveling \n2.6 Foundation design \n3. \nUnderpinning \nskills \n3.1  Use of hand signals \n3.2  Moving machines using manual method \n3.3  Use of claw bars, wedges and rollers in moving machines \n3.4  Working with a group \n \n4. \nResource \nimplications\n4.1  Machine to be installed  \n4.2  Material handling equipment\n5. \nMethod of \nassessment \nCompetency may be assessed through: \n5.1   Observation with a group and questioning \n5.2   Demonstration with questioning \n5.3   Portfolio \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
