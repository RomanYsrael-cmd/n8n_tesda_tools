ication \n3.1 \n3.2 \n3.3 \n3.4 \n3.5 \nPrinciples of Lubrication \nTypes of Lubricants \nLubricant points \nLubrication breakdown \nLubrication recommendation \n4. Minor Adjustments \n4.1 \n4.2 \n4.3 \n4.4 \n4.5 \nAlignment \nLoose bolts \nDrive tension \nChain slacks \nGuards and covers   \n5.  Operating \nsymptoms \n5.1 \n5.2 \n5.3 \n5.4 \n5.5 \n5.6 \n5.7 \n5.8 \nOperating Symptoms may also include \nUnusual noise \nOverheating \nBurnt odor \nVibration \nMisalignment \nLeakages \nOthers as per manufacturer \n6. Evidence of \nSymptoms \n \n \n \n \n \n6.1 \n6.2 \n6.3 \n6.4 \n6.5 \nEvidence of symptoms may include: \nWear \nFatigue \nWear pattern \nScoring \nOthers as per Manufacturers manual  \n7. Forms \n7.1 \n7.2 \n7.3 \n7.4 \nRoutine Maintenance Report Inspection Schedules \nInspection Report Forms \nInspection Checklists \nInspection Procedures\n\n--- PDF PAGE 29 ---\nPlant Maintenance Mechanic  \n12/02/07 \n27"
