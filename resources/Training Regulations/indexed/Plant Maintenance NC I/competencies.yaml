  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\n This section gives the details of the contents of the basic, common and core\nunits of competency required in PLANT MAINTENANCE NC I.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY: RECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION\nUNIT CODE : 500311101\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to receive, respond and act on verbal and written\ncommunication.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Follow routine spoken\nmessages\n1.1.\nRequired information is gathered by listening\nattentively and correctly interpreting or\nunderstanding information/instructions\n1.2.\nInstructions/information are properly recorded\n1.3.\nInstructions are acted upon immediately in\naccordance with information received\n1.4.\nClarification is sought from workplace supervisor\non all occasions when any instruction/information\nis not clear\n2. Perform workplace\nduties following written\nnotices\n2.1 Written notices and instructions are read and\ninterpreted correctly in accordance with\norganizational guidelines\n2.2 Routine written instruction are followed in\nsequence\n2.3 Feedback is given to workplace supervisor based\non the instructions/information received\n\n--- PDF PAGE 5 ---\nPlant Maintenance Mechanic\n12/02/07\n3\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nIt refers to :\n1.1. Handwritten and printed material\n1.2. Internal memos\n1.3. External communications\n1.4. Electronic mail\n1.5. Briefing notes\n1.6. General correspondence\n1.7. Marketing materials\n1.8. Journal articles\n2. Organizational Guidelines\nIt may include:\n2.1. Information documentation procedures\n2.2. Company policies and procedures\n2.3. Organization manuals\n2.4. Service manual\n\n--- PDF PAGE 6 ---\nPlant Maintenance Mechanic\n12/02/07\n4\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated knowledge of organizational procedures for\nhandling verbal and written communications\n1.2. Received and acted on verbal messages and instructions\n1.3. Demonstrated competency in recording\ninstructions/information\n\n2. Underpinning\nKnowledge and\nAttitudes\n2.1. Knowledge of organizational policies/guidelines in regard\nto processing internal/external information\n2.2. Ethical work practices in handling communications\n2.3. Communication process\n3. Underpinning\nSkills\n3.1. Conciseness in receiving and clarifying messages/\ninformation/communication\n3.2. Accuracy in recording messages/information\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Pens\n4.2. Note pads\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Direct Observation\n5.2. Oral interview\n5.3. Written Evaluation\n5.4. Third Party Report\n\n6. Context of\nAssessment\nCompetency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 7 ---\nPlant Maintenance Mechanic\n12/02/07\n5\nUNIT OF COMPETENCY : WORK WITH OTHERS\n\nUNIT CODE\n:\n500311102\n\nUNIT DESCRIPTOR\n:\nThis unit cover the skills, knowledge and attitudes\nrequired to develop workplace relationship and contribute\nin workplace activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Develop effective\nworkplace relationship\n1.1 Duties and responsibilities are done in a positive\nmanner to promote cooperation and good relationship\n1.2 Assistance is sought from workgroup when\ndifficulties arise and addressed through discussions\n1.3 Feedback provided by others in the team is\nencouraged, acknowledged and acted upon\n1.4 Differences in personal values and beliefs are\nrespected and acknowledged in the development\n2. Contribute to work\ngroup activities\n2.1 Support is provided to team members to ensure\nworkgroup goals are met\n2.2 Constructive contributions to workgroup goals and\ntasks are made according to organizational\nrequirements\n2.3 Information relevant to work is shared with team\nmembers to ensure designated goals are met\n\n--- PDF PAGE 8 ---\nPlant Maintenance Mechanic\n12/02/07\n6\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements including OHS\n1.5 Code of conduct\n2. Work group\n2.1 Supervisor or manager\n2.2 Peers/work colleagues\n2.3 Other members of the organization\n3. Feedback on\nperformance\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues and\nclients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring service\ndelivery\n4. Providing\nsupport to team\nmembers\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n5. Organizational\nrequirements\n\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes and\nstandards\n\n--- PDF PAGE 9 ---\nPlant Maintenance Mechanic\n12/02/07\n7\n EVIDENCE GUIDE\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1.\nProvided support to team members to ensure goals\nare met\n1.2.\nActed on feedback from clients and colleagues\n1.3.\nAccessed learning opportunities to extend own\npersonal work competencies to enhance team goals\nand outcomes\n2. Underpinning\nKnowledge\n2.1.\nThe relevant legislation that affects operations,\nespecially with regards to safety\n2.2.\nReasons why cooperation and good relationships are\nimportant\n2.3.\nKnowledge of the organization’s policies, plans and\nprocedures\n2.4.\nUnderstanding how to elicit and interpret feedback\n2.5.\nKnowledge of workgroup member’s responsibilities\nand duties\n2.6.\nImportance of demonstrating respect and empathy in\ndealings with colleagues\n2.7.\nUnderstanding of how to identify and prioritize\npersonal development opportunities and options\n3. Underpinning Skills\n3.1.\nAbility to read and understand the organization’s\npolicies and work procedures\n3.2.\nWrite simple instructions for particular routine tasks\n3.3.\nInterpret information gained from correspondence\n3.4.\nCommunication skills to request advice, receive\nfeedback and work with a team\n3.5.\nPlanning skills to organized work priorities and\narrangement\n3.6.\nTechnology skills including the ability to select and\nuse technology appropriate to a task\n3.7.\nAbility to relate to people from a range of social,\ncultural and ethnic backgrounds.\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2.\nMaterials relevant to the proposed activity or task\n5. Methods of\nAssessment\nCompetency may be assessed through:\n\n--- PDF PAGE 10 ---\nPlant Maintenance Mechanic\n12/02/07\n8\n5.1.\nDirect observations of work activities of the\nindividual member in relation to the work activities of\nthe group\n5.2.\nObservation of simulation and/or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3.\nCase studies and scenarios as a basis for\ndiscussion of issues and strategies\n6. Context for\nAssessment\n6.1.\nCompetency assessment may occur in workplace or\nany appropriately simulated environment\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 11 ---\nPlant Maintenance Mechanic\n12/02/07\n9\nUNIT OF COMPETENCY: DEMONSTRATE WORK VALUES\nUNIT CODE\n 500311103\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, and attitude in\ndemonstrating proper work values.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Define the purpose\nof work\n\n1.1 One’s unique sense of purpose for working and the\nwhy’s of work are identified, reflected on and clearly\ndefined for one’s development as a person and as a\nmember of society.\n1.2 Personal mission is in harmony with company’s values\n2. Apply work\nvalues/ethics\n2.1 Work values/ethics/concepts are classified and\nreaffirmed in accordance with the transparent company\nethical standards, policies and guidelines.\n2.2 Work practices are undertaken in compliance with\nindustry work ethical standards, organizational policy\nand guidelines\n2.3 Personal behavior and relationships with co-workers\nand/or clients are conducted in accordance with ethical\nstandards, policy and guidelines.\n2.4 Company resources are used in accordance with\n transparent company ethical standard, policies and\n guidelines.\n3. Deal with ethical\n problems\n3.1 Company ethical standards, organizational policy and\nguidelines on the prevention and reporting of unethical\nconduct are accessed and applied in accordance with\ntransparent company ethical standard, policies and\nguidelines.\n3.2 Work incidents/situations are reported and/or\nresolved in accordance with company\nprotocol/guidelines.\n3.3 Resolution and/or referral of ethical problems identified\nare used as learning opportunities.\n4. Maintain integrity of\nconduct in the\nworkplace\n4.1 Personal work practices and values are demonstrated\nconsistently with acceptable ethical conduct and\ncompany’s core values.\n4.2 Instructions to co-workers are provided based on\n ethical, lawful and reasonable directives.\n4.3 Company values/practices are shared with co-workers\n using appropriate behavior and language.\n\n--- PDF PAGE 12 ---\nPlant Maintenance Mechanic\n12/02/07\n10\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Work values/ethics/\nconcepts\nMay include but are not\nlimited to:\n1.1 Commitment/ Dedication\n1.2 Sense of urgency\n1.3 Sense of purpose\n1.4 Love for work\n1.5 High motivation\n1.6 Orderliness\n1.7 Reliability\n1.8 Competence\n1.9 Dependability\n1.10 Goal-oriented\n1.11 Sense of responsibility\n1.12 Being knowledgeable\n\n1.13 Loyalty to work/\n company\n1.14 Sensitivity to others\n1.15 Compassion/Caring\n attitude\n1.16 Balancing between\n family and work\n1.17 Pakikisama\n1.18 Bayanihan spirit/\n teamwork\n1.19 Sense of nationalism\n2. Work practices\n2.1 Quality of work\n2.2 Punctuality\n2.3 Efficiency\n2.4 Effectiveness\n2.5 Productivity\n2.6 Resourcefulness\n2.7 Innovativeness/Creativity\n2.8 Cost conciousness\n2.9 5S\n2.10 Attention to details\n3. Incidents/situations\n3.1 Violent/intensed dispute or argument\n3.2 Gambling\n3.3 Use of prohibited substances\n3.4 Pilferages\n3.5 Damage to person or property\n3.6 Vandalism\n3.7 Falsification\n3.8 Bribery\n3.9 Sexual Harassment\n3.10 Blackmail\n\n4. Company resources\n\n4.1 Consumable materials\n4.2 Equipment/Machineries\n4.3 Human\n4.4 Time\n4.5 Financial resources\n\n5. Instructions\n\n5.1 Verbal\n5.2 Written\n\n--- PDF PAGE 13 ---\nPlant Maintenance Mechanic\n12/02/07\n11\n\nEVIDENCE GUIDE\n1. Critical Aspects\n of Competency\nAssessment requires evidence that the candidate:\n1.1 Defined one’s unique sense of purpose for working\n1.2 Clarified and affirmed work values/ethics/concepts\n consistently in the workplace\n1.3 Demonstrated work practices satisfactorily and consistently\n in compliance with industry work ethical standards,\n organizational policy and guidelines\n1.4 Demonstrated personal behavior and relationships with co-\n workers and/or clients consistent with ethical standards,\n policy and guidelines\n 1.5 Used company resources in accordance with company\n ethical standard, policies and guidelines.\n1.6 Followed company ethical standards, organizational policy\n and guidelines on the prevention and reporting of unethical\n conduct/behavior\n\n2. Underpinning\nKnowledge\n2.1 Occupational health and safety\n2.2 Work values and ethics\n2.3 Company performance and ethical standards\n2.4 Company policies and guidelines\n2.5 Fundamental rights at work including gender sensitivity\n2.6 Work responsibilities/job functions\n2.7 Corporate social responsibilities\n2.8 Company code of conduct/values\n2.9 Balancing work and family responsibilities\n\n3. Underpinning Skills\n3.1 Interpersonal skills\n3.2 Communication skills\n3.3 Self awareness, understanding and acceptance\n3.4 Application of good manners and right conduct\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/Scenarios\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Third Party Reports\n6. Context of\nAssessment\nCompetency may be assessed in the work place or in a\n simulated work place setting\n\n--- PDF PAGE 14 ---\nPlant Maintenance Mechanic\n12/02/07\n12\n\nUNIT OF COMPETENCY: PRACTICE HOUSEKEEPING PROCEDURES\n\nUNIT CODE : 500311104\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto apply the basic housekeeping procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Sort and remove\n unnecessary items\n1.1 Reusable, recyclable materials are sorted in\naccordance with company/office procedures\n1.2 Unnecessary items are removed and disposed of\nin accordance with company or office procedures\n2. Arrange items\n2.1 Items are arranged in accordance with\ncompany/office housekeeping procedures\n2.2 Work area is arranged according to job\nrequirements\n2.3 Activities are prioritized based on instructions.\n2.4 Items are provided with clear and visible\nidentification marks based on procedure\n2.5 Safety equipment and evacuation passages are\nkept clear and accessible based on instructions\n3. Maintain work area, tools\nand equipment\n3.1 Cleanliness and orderliness of work area is\nmaintained in accordance with company/office\nprocedures\n3.2 Tools and equipment are cleaned in accordance\nwith manufacturer’s instructions/manual\n3.3 Minor repairs are performed on tools and\nequipment in accordance with manufacturer’s\ninstruction/manual\n3.4 Defective tools and equipment are reported to\nimmediate supervisor\n4. Follow standardized work\nprocess and procedures\n4.1 Materials for common use are maintained in\ndesignated area based on procedures\n4.2 Work is performed according to standard work\nprocedures\n4.3 Abnormal incidents are reported to immediate\nsupervisor\n5. Perform work\nspontaneously\n5.1 Work is performed as per instruction\n5.2 Company and office decorum are followed and\ncomplied with\n5.3 Work is performed in accordance with\noccupational health and safety (OHS)\nrequirements\n\n--- PDF PAGE 15 ---\nPlant Maintenance Mechanic\n12/02/07\n13\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Unnecessary items\nMay include but are not limited to:\n1.1 Non-recyclable materials\n1.2 Unserviceable tools and equipment\n1.3 Pictures, posters and other materials not\n related to work activity\n1.4 Waste materials\n2. Identification marks\n2.1 Labels\n2.2 Tags\n2.3 Color coding\n3. Decorum\n3.1 Company/ office rules and regulations\n3.2 Company/ office uniform\n3.3 Behavior\n4. Minor repair\nMinor repair include but not limited to:\n4.1 Replacement of parts\n4.2 Application of lubricants\n4.3 Sharpening of tools\n4.4 Tightening of nuts, bolts and screws\n\n--- PDF PAGE 16 ---\nPlant Maintenance Mechanic\n12/02/07\n14\n\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate\n Practiced the basic procedures of 5S\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Principles of 5S\n2.2 Work process and procedures\n2.3 Safety signs and symbols\n2.4 General OH&S principles and legislation\n2.5 Environmental requirements relative to work safety\n2.6 Accident/Hazard reporting procedures\n3. Underpinning\nSkills\n3.1 Basic communication skills\n3.2 Interpersonal skills\n3.3 Reading skills required to interpret instructions\n3.4 Reporting/recording accidents and potential hazards\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Facilities, materials tools and equipment necessary for\nthe activity\n5. Methods of\nAssessment\nCompetency may be assessed through:\n\n5.1 Third party report\n5.2 Interview\n5.3 Demonstration with questioning\n6. Context for\nAssessment\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 17 ---\nPlant Maintenance Mechanic\n12/02/07\n15\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY : APPLY SAFETY PRACTICES\n\nUNIT CODE\n\n: MEE722201\n\nUNIT DESCRIPTOR\n : This unit covers the competencies required to apply safety\npractices in the workplace.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nIdentify hazards\n1.1\n\n1.2\nHazards are identified correctly in accordance\nwith OHS principles.\nSafety signs and symbols are identified and\nadhered to.\n\n2.\nUse protective clothing\nand devices\n2.1\n\nAppropriate protective clothing and devices\ncorrectly selected and used in accordance with\nOHS requirements or industry/company policy\n\n3.\nPerform safe handling of\ntools, equipment and\nmaterials\n3.1\n\n 3.2\nSafety procedures for pre-use check and\noperation of tools and equipment followed in\naccordance with industry/ company policies.\nTools, equipment and materials handled safely in\naccordance with OHS requirements and industry/\ncompany policies.\n\n4.\nPerform first aid\n4.1\nFirst aid treatment of injuries are carried out\naccording to recommended procedures\n\n5.\nUse fire extinguisher\n5.1\nFire extinguisher selected and operated correctly\naccording to the type of fire.\n\n--- PDF PAGE 18 ---\nPlant Maintenance Mechanic\n12/02/07\n16\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Hazards\n1.1 Cluttered tools and materials\n1.2 Slippery floors (caused by oil, grease or any liquid)\n1.3 Exposed electrical wires\n1.4 Sharp edges\n1.5 Machine without guards or with exposed moving\nparts\n1.6 Uncollected chips or other wastes\netc.\n2. Protective clothing\n and devices\nProtective clothing and devices may include but is not\nlimited to:\n2.1 safety glasses/goggles\n2.2 safety shoes\n2.3 overalls\n2.4 cap\n3. Injuries\nInjuries may include:\n3.1 burns/scalds\n3.2 fractures\n3.3 cuts and abrasions\n3.4 poisoning\n3.5 foreign bodies in the eye\n3.6 concussion\n3.7 shock\n4. Type of fires\nFires involving or caused by:\n4.1 common combustibles (wood, cloth, paper, rubber\nand plastic)\n4.2 flammable liquids (gasoline, oil, solvents, paints,\netc.)\n4.3 energized electrical equipment (wiring, fuse boxes,\ncircuit breakers, appliances, etc.\n4.4 combustible metals (magnesium, sodium, etc.)\n\n--- PDF PAGE 19 ---\nPlant Maintenance Mechanic\n12/02/07\n17\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 identified hazardous area\n1.2 used protective clothing and devices\n1.3 handled tools, equipment and materials properly\n1.4 performed first aid\n1.5 used fire extinguisher\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Shop safety signs, symbols and alarms\n2.2 Safety precautionary measures\n2.3 Housekeeping\n2.4 Machine tools\n2.5 First aid\n2.6 Engineering materials\n2.7 Fire extinguishers\n3.\nUnderpinning\nskills\n3.1 Operating machine tools\n3.2 Handling tools and materials\n3.3 Communicating with superiors and co-workers\n3.4 Interpreting instructions\n4.\nResource\nimplications\nThe following resources MUST be provided\n4.1 Tools, equipment and facilities appropriate to processes\nor activity\n4.2 Materials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 Demonstration\n5.2 Written or oral short answer questions\n5.3 Practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 20 ---\nPlant Maintenance Mechanic\n12/02/07\n18\nUNIT OF COMPETENCY : INTERPRET WORKING DRAWINGS AND SKETCHES\n\nUNIT CODE\n\n: MEE722202\n\nUNIT DESCRIPTOR\n: This unit covers the competencies required to read and\n\n interpret drawings and sketches.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nInterpret technical\ndrawing\n1.1\n\n1.2\n1.3\n1.4\n1.5\n1.6\nComponents, assemblies or objects recognized as\nrequired.\nDimensions identified as appropriate.\nInstructions identified and followed as required.\nMaterial requirements identified as required.\nSymbols recognized as appropriate in the drawing.\nTolerance, limits and fits identified in the drawing.\n2.\nPrepare freehand\nsketch of parts\n2.1\n2.2\n2.3\n2.4\n2.5\nSketch drawn correctly and appropriately.\nSketch depicted objects or part appropriately.\nDimensions indicated in sketch are clear and correct.\nInstructions included in sketch are clear and correct.\nBase line or datum points indicated as required.\n3.\nInterpret details from\nfreehand sketch\n3.1\n\n3.2\n3.3\n3.4\n3.5\nComponents, assemblies or objects recognized as\nrequired.\nDimensions identified as appropriate.\nInstructions identified and followed as required.\nMaterial requirements identified as required.\nSymbols recognized as appropriate in the drawing.\n\n--- PDF PAGE 21 ---\nPlant Maintenance Mechanic\n12/02/07\n19\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Drawing\n1.1 Drawing technique include\n1.1.1\nPerspective\n1.1.2\nExploded view\n1.1.3\nHidden view technique\n\n1.2 Projections\n1.2.1\nFirst angle projections\n1.2.2\nThird angle projections\n2. Tolerance\n2.1 General tolerance\n2.2 Angular tolerance\n2.3 Geometric tolerance\n\n--- PDF PAGE 22 ---\nPlant Maintenance Mechanic\n12/02/07\n20\nEVIDENCE GUIDE\n1.\nCritical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted technical drawing\n1.2 Prepared sketches\n1.3 Interpreted sketches.\n2.\nUnderpinning\nknowledge\n2.1 Alphabet of lines\n2.2 Projections\n2.3 Drawing symbols\n2.4 Dimensioning techniques\n2.5 Tolerance, limits and fits\n2.6 Engineering materials\n2.7 Drawing tools and supplies\n3.\nUnderpinning\nskills\n3.1 Handling tools and drawing instruments\n3.2 Using measuring instruments\n4.\nResource\nimplications\nThe following resources MUST be provided\n4.1 Drafting room/facilities and drafting instruments and\n supplies appropriate to the activity\n4.2 Measuring tools\n4.3 Drawings, sketches or blueprint\n4.4 Specimen parts/components\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation\n5.2 written or oral short answer questions\n5.3 demonstration\n5.4 project/work sample\n5.5 portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 23 ---\nPlant Maintenance Mechanic\n12/02/07\n21\nUNIT OF COMPETENCY : PERFORM SHOP COMPUTATIONS (BASIC)\n\nUNIT CODE\n\n: MEE722204\n\nUNIT DESCRIPTOR\n\n: This unit covers the competencies required to perform\nbasic calculations using the four fundamental operation.\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPerform four\nfundamental operations.\n1.1\n\n1.2\n\nSimple calculations performed using four\nfundamental operations.\nSimple calculations performed involving fractions\nand mixed numbers using four fundamental\noperations\n2.\nPerform basic\ncalculations involving\nfractions and decimals\n2.1\n\n2.2\n\nSimple calculations are performed involving\nfractions and decimals using the four fundamental\noperations.\nDecimal are converted into fraction (and vice\nversa) accurately,\n3.\nPerform basic\ncalculations involving\npercentages.\n3.1\nSimple calculations are performed to obtain\npercentages from information expressed in either\nfractional or decimal format\n4.\nPerform basic\ncalculation involving\nration and proportion\n4.1\nSimple calculations are performed involving ratios\nand proportion using whole numbers, fractions and\ndecimal fractions.\n5.\nPerform calculations on\nalgebraic expressions\n5.1\n\n5.2\nSimple calculations are performed on algebraic\nexpressions using the four fundamental\noperations.\nSimple transposition of formulae is carried out to\nisolate the variable required, involving the four\nfundamental operations.\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Four fundamental\n operations\n1.1 Addition\n1.2 Subtraction\n1.3 Multiplication\n1.4 Division\n2. Algebraic expressions\nCalculation using formula for determining\n\n2.1 tap drill size\n2.2 feed\n2.3\nspeed\n\n--- PDF PAGE 24 ---\nPlant Maintenance Mechanic\n12/02/07\n22\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate performed\ncalculations:\n1.1 using four fundamental operations\n1.2 involving fractions and mixed numbers\n1.3 involving fractions and decimals\n1.4 involving percentages\n1.5 involving ratio and proportion\n1.6 on algebraic expressions\n1.7 of simple formulae\n2.\nUnderpinning\nknowledge and\nattitude\nEnglish and metric system of measurements\n3.\nUnderpinning\nskills\nPerforming calculations using pen and paper or on a calculator.\n4.\nResource\nimplications\nThe following resources MUST be provided:\n4.1 Tools, equipment and facilities appropriate to processes or\n activity\n4.2 Materials relevant to the proposed activity\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 written or oral short answer questions\n5.2 practical exercises\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 25 ---\nPlant Maintenance Mechanic\n12/02/07\n23\nUNIT OF COMPETENCY : MEASURE WORKPIECE\n\nUNIT CODE\n\n: MEE722205\n\nUNIT DESCRIPTOR\n: This unit covers the competencies required to measure\nworkpieces using measuring instruments such as steel rules,\nvernier calipers , micrometers, etc….\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect and use\nmeasuring tools\n1.1\n\n1.2\n\n1.3\nMeasuring tools are selected and used according\nto the level of accuracy required.\nMeasurements taken are accurate to the finest\ngraduation of the selected measuring instrument.\nMeasuring technique used is correct and\nappropriate to the device used.\n\n2.\nClean and store\nmeasuring tools\n2.1\n\nCare and storage of devices undertaken to\nmanufacturer’s specifications or standard operating\nprocedures.\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Measuring tools\nMeasuring tools include:\n1.1 Steel tape\n1.2 Steel rule\n1.3 Straight edge\n1.4 Combination square\n1.5 Steel square\n1.6 Divider or trammel\n1.7 Caliper\n1.8 Protractor\n1.9 Vernier caliper\n1.10 Micrometer\n2. Measurements\n2.1 length\n2.2 diameter\n2.3 depth\n2.4 flatness\n2.5 straightness\n2.6 squareness\n\n--- PDF PAGE 26 ---\nPlant Maintenance Mechanic\n12/02/07\n24\n\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Selected and used measuring instruments\n1.2 Cleaned and stored measuring instruments\n2.\nUnderpinning\nknowledge\n2.1 Types, purposes and accuracy of measuring instruments\n2.2 Capability of measuring instruments\n2.3 Part dimensions and tolerances\n2.4 Techniques for measuring dimensions\n2.5 Care and storage procedure of measuring tools\n3.\nUnderpinning\nskills\n3.1 Safe handling of measuring tools and materials\n4.\nResource\nimplications\nThe following resources MUST be provided\n4.1 Tools, equipment and facilities appropriate to the activity\n4.2 Specimen component or part to the proposed activity\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation\n5.2 demonstration\n5.3 written or oral short answer questions\n5.4 portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 27 ---\nPlant Maintenance Mechanic\n12/02/07\n25\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM PREVENTIVE MAINTENANCE\n\nUNIT CODE\n\n:\nMEE723301\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes involved\nin the prevention or delay of breakdown through routine\nmaintenance work and primarily through scheduled or\nperiodic inspections.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nInterpret work\ninstructions\n\n1.1\n\n1.2\n\n1.3\n\nWork instruction interpreted and fully understood .\n\nOperation manual of machines and parts concerned\nobtained as reference for manufacturer’s recommendations.\n Work permits obtained\n\n2.\n\nPerform routine\nmaintenance\nwork\n2.1\n\n2.2\n\n2.3\nMachine parts or entire machine cleaned of dust and dirt\naccording to manufacturer’s recommendations.\n\nLubrication points of machine and condition of lubricants\nchecked according to work procedures.\n\nMinor adjustments made on loose bolts, drive slacks, guards\nand covers.\n\n3.\n\nPerform\ninspection\nprocedures\n3.1\n\n3.2\n\n3.3\n\n3.4\n\n3.5\n\n3.6\nInspection Checklists gathered as guide for inspection.\n\nInspection tools in good condition gathered\n\nOperational symptoms of malfunction or impending failure\nobserved through the human senses.\n\nEvidence of symptoms of malfunction or impending failure\nsearched through closer inspection of parts.\n\nInspection with the inspection instruments and methods\nused to detect start of failures such as cracks, unbalance,\netc.\n\nFindings of inspection with recommended course of action\nnoted in a report in accordance with company procedures.\n\n--- PDF PAGE 28 ---\nPlant Maintenance Mechanic\n12/02/07\n26\nRANGE OF VARIABLES\nVARIABLE\n\nRANGE\n1. Preventive\nMaintenance\n\n1.1\n1.2\n1.3\nImportance of Maintenance\nPrevention vs repair\nPlanned vs unplanned maintenance\n2. Machines,\nequipment and\nparts\n2.1\n2.2\n2.3\n2.4\n2.5\n2.6\nProcess machineries\nStorage Tanks\nPumps and Compressors\nFans and Blowers\nMachine Tools\nPower transmission elements\nV-belts & pulleys\nChain & sprockets\nShafts and keys\nShaft couplings\nClutches and brakes\nBearings: plain and rolling element\nGears\nSeals\nPackings and O-rings\nLip seals\nFluid system\n3. Lubrication\n3.1\n3.2\n3.3\n3.4\n3.5\nPrinciples of Lubrication\nTypes of Lubricants\nLubricant points\nLubrication breakdown\nLubrication recommendation\n4. Minor Adjustments\n4.1\n4.2\n4.3\n4.4\n4.5\nAlignment\nLoose bolts\nDrive tension\nChain slacks\nGuards and covers\n5. Operating\nsymptoms\n5.1\n5.2\n5.3\n5.4\n5.5\n5.6\n5.7\n5.8\nOperating Symptoms may also include\nUnusual noise\nOverheating\nBurnt odor\nVibration\nMisalignment\nLeakages\nOthers as per manufacturer\n6. Evidence of\nSymptoms\n\n6.1\n6.2\n6.3\n6.4\n6.5\nEvidence of symptoms may include:\nWear\nFatigue\nWear pattern\nScoring\nOthers as per Manufacturers manual\n7. Forms\n7.1\n7.2\n7.3\n7.4\nRoutine Maintenance Report Inspection Schedules\nInspection Report Forms\nInspection Checklists\nInspection Procedures\n\n--- PDF PAGE 29 ---\nPlant Maintenance Mechanic\n12/02/07\n27\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Maintenance work instruction fully understood\n1.2 Performed routine maintenance such as cleaning,\n lubrication and adjustments.\n1.3 Maintenance inspection performed using inspection\nchecklists and manuals\n1.4 Inspection reports and Routine Maintenance Reports\n submitted.\n2.\nUnderpinning\nknowledge and\nattitude\n 2.1 Normal running characteristics of a machine\n 2.2 Interpreting machine assembly and sectional details\n 2.3 Sequence of dismantling parts of a machine\n 2.4 Inspection procedures as per manufacturer\n3.\nUnderpinning\nskills\n 3.1 Safe use of hand tools and equipment\n 3.2 dismantling and mounting of parts\n 3.3 using inspection report routine maintenance report form\n 3.4 lubricating procedure\n 3.5 coupling alignment\n 3.6 adjusting belt tension and chain slacks\n 3.7 cleaning procedure\n4.\nResource\nimplications\nThe following resources MUST be provided:\n 4.1 appropriate hand tools and supplies\n 4.2 drawings and manuals\n 4.3 inspection checklist\n 4.3 inspection and routine maintenance report form\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 Observation with questioning\n5.2 Demonstration with questioning\n5.3 Written examination\n5.4 Portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 30 ---\nPlant Maintenance Mechanic\n12/02/07\n28\n\nUNIT OF COMPETENCY :\nPERFORM PLANNED MAINTENANCE WORK\n\nUNIT CODE\n\n:\nMEE723302\n\nUNIT DESCRIPTOR:\n\nThis unit covers the knowledge, skills and attitude\nrequired to perform planned and unplanned (emergency)\nmaintenance work.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nObtain work\ninstructions\n1.1\n1.2\n1.3\n\nExtent of work clearly understood.\nAll materials and tools to be used gathered.\nWork permit obtained and all safety precautions\narranged such as equipment shutdown and danger\ntags.\n2.\nDismantle\nequipment\n2.1\n\n2.2\n\n2.3\nManual studied to determine sequence and extent of\ndismantling to gain access to the affected area.\naccording to procedure\nMachine dismantled and parts inspected closely and\ncleaned for closer inspection as per manufacturer’s\nrecommended procedure.\nSafety precautions observed in dismantling\n3.\nInspect closely for\ncause of failure\n\n3.1\n\n3.2\n\n3.3\nSigns of failure determined through visual inspection\nor use of other methods such as dye penetrant test.\nCause of failure of part determined if wear-out,\nmisuse failure or inherent weakness.\nNote down findings for inclusion in report , history\ncard and failure analysis studies.\n4.\nReplace\ncomponents\n4.1\n\n4.2\nComponent replaced and machine re-assembled\nusing the reverse of dismantling procedure.\nReport made and submitted to supervisor\n5\nTroubleshoot\nmachine\nbreakdown\n(In case work is emergency\nand therefore unplanned)\n5.1\n\n5.2\nBackground data and operational data. about the\nmachine gathered .to define the problem\nThe area suspected where failure is most likely to\noccur is closely investigated\n\n5.3\n\n5.4\nMachine divided mentally into functional zones to\ncheck each zone separately in the drawing and/or the\nactual machine itself the input and output\nEliminate by testing those zones unaffected by the\nfault, until finally it is isolated to one part of the system\n\n--- PDF PAGE 31 ---\nPlant Maintenance Mechanic\n12/02/07\n29\n\n5.5\n\n5.6\n\n5.7\n\n5.8\n\nMachine dismantled and each element of the zone\nInvestigated by testing to pinpoint the particular element in\nthe assembly where the fault lies.\nEliminate those elements unaffected by fault by bypassing\nthem or substituting components that are known to work.\nCause of failure pinpointed as to wear failure, misuse\nfailure or inherent weakness in design of parts.\nNote down findings for inclusion in report , history card and\nfailure analysis studies.\n\n--- PDF PAGE 32 ---\nPlant Maintenance Mechanic\n12/02/07\n30\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Extent of work\nPlanned work\n1.1 Major overhaul\n1.2 Replacement work\n1.3 Machine modification\nUnplanned work\n1.4 Emergency (breakdown maintenance)\n2. Signs of failure\n2.1 Wear\n2.2 Corrosion\n2.3 Fatigue\n2.4 Plastic flow\n2.5 Material damage\n2.6 Cracks\n2.7 Fraying\n2.8 Swelling\n2.9 Stretching\n2.10 Tooth breakage\n2.11 Fretting\n2.12 Pitting\n\n3. Causes of failure\n3.1 Dirt\n3.2 Inadequate lubrication\n3.3 Improper assembly\n3.4 Misalignment\n3.5 Overload\n3.6 Moisture\n3.7 Lubricant breakdown\n3.8 Contamination\n3.9 External vibration\n3.10 Out of mesh\n\n4. Report\n4.1 Job report\n4.2 Failure Report\n3. Background data\n\n3.1 Manufacturer’s information\n3.2 Equipment history record\n3.3 Systems drawing\n3.4 Process drawings\n3.5 Troubleshooting charts\n3.6 Operator interview\n4. Operational data\n4.1 Operating records\n4.2 Operator’s report\n4.3 Test readings\n\n--- PDF PAGE 33 ---\nPlant Maintenance Mechanic\n12/02/07\n31\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Planned work to be done clearly understood\n1.2 Machine dismantled safely\n1.3 Replacements made\n1.4 Troubleshooting made on breakdown of machine\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Assembly and detail drawings of machine\n2.2 Inspection Report form\n2.3 Job Report form\n2.4 Use of hand tools and equipment\n2.5 Linear measuring instruments\n2.6 Signs of failure\n2.7 Causes of failure\n2.8 Troubleshooting skills\n2.9 Report making using forms\n3\nUnderpinning\nskills\n3.1 Use of hand tools\n3.2 Safe handling of tools and materials\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Appropriate tools for the job\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 Observation with questioning\n5.2 Demonstration with questioning\n5.3 Written examination\n5.4 Portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 34 ---\nPlant Maintenance Mechanic\n12/02/07\n32\n\nUNIT OF COMPETENCY : FABRICATE SIMPLE ITEMS\n\nUNIT CODE\n\n: MEE723303\n\nUNIT DESCRIPTOR\n\n: This unit covers the knowledge, skills and attitude required\n\n to fabricate simple parts required for machines being\n\n repaired and items required for maintenance work..\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1.\n\nInterpret work\ninstruction\n\n1.1\n\n1.2\n\nWork instruction on the items to be made interpreted\nclarified and understood.\nMaterials required listed as per requirement.\n\n2.\n\nPrepare materials\nand tools\n\n2.1\n\n2.2\n\n2.3\n\nMaterials marked and cut by different cutting methods\naccording to standard procedures\n\nMaterials processed using required fabricating\nmethods according to standard practices\n\nMaterials fitted and assembled using joining methods\naccording to drawing requirements\n\n3.\nI\nnstall items\n\n3.1\n\nItem installed safely using standard installation tools\naccording to workplace procedures.\n\n--- PDF PAGE 35 ---\nPlant Maintenance Mechanic\n12/02/07\n33\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1 Items\n\n1.1 Safety equipment\n- guards & handrails\n-\nCovers\n-\ndividers\n1.2 Ladders\n1.3 A-frames\n1.4 Brackets\n1.5 Simple parts\n- baseplates\n- pins\n- bushings\n- shafts\n- spacers\n-\n\n2. Cutting methods\n\n2.1 Hacksawing\n2.2 Oxyacetylene cutting\n2.3 Power hacksawing\n2.4 bandsawing\n2.5 abrasive cutting\n\n3. Fabricating methods\n\n3.1 Benchwork drilling, tapping\n3.2 Turning round workpieces, bushings, pins\n3.3 Milling keyseats, keyways, flats\n3.4 Sheet metal work simple development and seaming\n3.5 Pipe bending\n\n4. Joining methods\n\n 4.1 screwing\n 4.2 bolting\n 4.3 gas welding\n 4.4 arc welding\n 4.5 seaming\n\n5. Installation methods\n\n5.1 expansion bolts\n\n--- PDF PAGE 36 ---\nPlant Maintenance Mechanic\n12/02/07\n34\n\nEVIDENCE GUIDE\n\n1.\n\nCritical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n\n1.1 Work instruction understood\n1.2 Work prepared safely\n1.3 Material fabricated and assemble safely\n1.4 Item installed safely\n\n2.\n\nUnderpinning\nknowledge and attitude\n\n2.1 Interpreting drawings\n2.2 Cutting methods\n2.3 Bench work practices\n2.4 Machine shop practice\nTurning\n Milling\n2.5 Off-hand grinding\n2.6 Gas welding\n2.7 Arc welding\n2.8 Pipe fitting\n\n3.\n\nUnderpinning skills\n\n3.1 Use of hand and power tools\n3.2 Use of oxyacetylene cutter and welding\n3.3 Use lathe machine\n3.3 Use milling machine\n3.4 Use of arc welder\n3.5 U of pipe threader\n\n4.\n\nResource implications\n\n4.1 Machines required for the job\n4.2 Hand appropriate to the job\n\n5.\n\nMethod of assessment\n\nCompetency may be assessed through:\n\n5.1 Observation with a group and questioning\n5.2 Demonstration with questioning\n5.3 Portfolio\n\n6.\n\nContext for\nassessment\n\nCompetency may be assessed in the workplace or in\nsimulated workplace environment.\n\n--- PDF PAGE 37 ---\nPlant Maintenance Mechanic\n12/02/07\n35\nUNIT OF COMPETENCY\n:\nINSTALL MACHINERY\n\nUNIT CODE\n\n:\nMEE723304\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitude required to\nmove and install machineries.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPrepare designated\narea\n1.1\n\n1.2\n\nEquipment and its connections removed from the\ndesignated according to worksite procedure\n\nArea cleared of dirt and marked according to\nrequirement and causeways cleared of obstructions.\n2.\nMove machinery\n2.1\n\n2.2\n\n2.3\n\nSafety practices observed in handling heavy loads.\n\nMachinery lifted , and moved according to available\nhandling equipment or any manual method.\n\nMachinery lowered into position, bolted and leveled\naccording to standard procedure.\n3.\nInstall machinery\n3.1\n\n3.2\n\nMachinery installed, cleaned, and compressed air,\nhydraulic lines and other accessories connected.\n\nManual studied for operational procedures and safety\nprecautions for safe star-up procedures.\n4.\n\nTest machinery\n4.1\nTest machine with operator\n\n--- PDF PAGE 38 ---\nPlant Maintenance Mechanic\n12/02/07\n36\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1 Handling\nequipment\n1.1 Overhead crane\n1.2 Forklift\n1.3 A-frames\n1.4 Chain Blocks\n1.5 Dollies\n2. Manual moving\nmethods\n2.1 Crowbars\n2.2 Jacks\n2.3 Wedge\n2.4 Rollers\n2.5 Shim washers\n3. Communication\n3.1 Hand signals\n4. Accessories\n\n 4.1 Foundation\n 4.2 Anchor bolts\n 4.3 Hold down bolts\n 4.4 Leveling screw\n 4.5 Grout\n 4.6 Air distribution lines\n 4.7 Tapping of air lines\n 4.8 Power pack\n\nEVIDENCE GUIDE\n1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.4 Designated area and access ways cleared\n1.5 Machinery lifted and moved safely\n1.6 Machinery installed\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Principle of operation of machine\n2.2 Methods of lifting machines\n2.3 Methods of moving machines manually\n2.4 Lifting capacity of lifting equipment\n2.5 Principle of leveling\n2.6 Foundation design\n3.\nUnderpinning\nskills\n3.1 Use of hand signals\n3.2 Moving machines using manual method\n3.3 Use of claw bars, wedges and rollers in moving machines\n3.4 Working with a group\n\n4.\nResource\nimplications\n4.1 Machine to be installed\n4.2 Material handling equipment\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 Observation with a group and questioning\n5.2 Demonstration with questioning\n5.3 Portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 39 ---\nPlant Maintenance Mechanic\n12/02/07\n37"
