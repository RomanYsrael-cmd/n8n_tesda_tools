          "source_text": "1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Planned work to be done clearly understood\n1.2 Machine dismantled safely\n1.3 Replacements made\n1.4 Troubleshooting made on breakdown of machine\n2.\nUnderpinning\nknowledge and\nattitude\n2.1 Assembly and detail drawings of machine\n2.2 Inspection Report form\n2.3 Job Report form\n2.4 Use of hand tools and equipment\n2.5 Linear measuring instruments\n2.6 Signs of failure\n2.7 Causes of failure\n2.8 Troubleshooting skills\n2.9 Report making using forms\n3\nUnderpinning\nskills\n3.1 Use of hand tools\n3.2 Safe handling of tools and materials\n4.\nResource\nimplications\nThe following resources must be provided\n4.1 Appropriate tools for the job\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 Observation with questioning\n5.2 Demonstration with questioning\n5.3 Written examination\n5.4 Portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 34 ---\nPlant Maintenance Mechanic\n12/02/07\n32\n\nUNIT OF COMPETENCY : FABRICATE SIMPLE ITEMS\n\nUNIT CODE\n\n:",
