        "source_title": "PERFORM PLANNED MAINTENANCE WORK",
        "source_text": "--- PDF PAGE 30 ---\nPlant Maintenance Mechanic  \n12/02/07 \n28\n \nUNIT OF COMPETENCY  :    \nPERFORM PLANNED  MAINTENANCE WORK \n \nUNIT CODE  \n \n:     \nMEE723302 \n \nUNIT DESCRIPTOR:    \n \nThis unit covers the knowledge, skills and attitude \nrequired to perform planned and unplanned (emergency) \nmaintenance work. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. \nObtain work \ninstructions \n1.1 \n1.2 \n1.3 \n \nExtent of work clearly understood.  \nAll materials and tools to be used gathered. \nWork permit obtained and all safety precautions \narranged such as equipment shutdown and danger \ntags. \n2. \nDismantle \nequipment \n2.1 \n \n \n2.2 \n \n2.3 \nManual studied to determine sequence and extent of \ndismantling to gain access to the affected area. \naccording to procedure \nMachine dismantled and parts inspected closely and \ncleaned for closer inspection as per manufacturer’s \nrecommended procedure. \nSafety precautions observed in dismantling  \n3. \nInspect closely for \ncause of failure \n \n3.1 \n \n3.2 \n \n3.3 \nSigns of failure determined through visual inspection \nor use of other methods such as dye penetrant test. \nCause of failure of part determined if wear-out, \nmisuse  failure or inherent weakness. \nNote down findings for inclusion in report , history \ncard and failure analysis studies.\n4. \nReplace \ncomponents \n4.1 \n \n4.2 \nComponent replaced and machine re-assembled \nusing the reverse of dismantling procedure. \nReport  made and  submitted  to  supervisor \n5 \nTroubleshoot \nmachine \nbreakdown \n(In case work is emergency \nand therefore unplanned) \n5.1 \n \n5.2 \nBackground data and operational data. about the \nmachine gathered .to define the problem  \nThe area suspected where failure is most likely to \noccur is closely investigated  \n \n \n5.3 \n \n \n5.4 \nMachine divided mentally into functional zones to \ncheck  each zone separately in the drawing and/or the \nactual machine itself  the input and output \nEliminate by testing those zones unaffected by the \nfault, until finally it is isolated to one part of the system\n\n--- PDF PAGE 31 ---\nPlant Maintenance Mechanic  \n12/02/07 \n29\n \n \n \n5.5  \n \n \n5.6 \n \n \n5.7 \n \n5.8 \n \nMachine dismantled and each element of the zone \nInvestigated  by testing to pinpoint the particular element in \nthe assembly where the fault lies.  \nEliminate those elements unaffected by fault by bypassing \nthem or substituting components that are known to work.   \nCause of failure pinpointed as to wear failure, misuse \nfailure or inherent weakness in design of parts. \nNote down findings for inclusion in report , history card and \nfailure analysis studies.\n\n--- PDF PAGE 32 ---\nPlant Maintenance Mechanic  \n12/02/07 \n30\n \nRANGE OF VARIABLES \nVARIABLE\nRANGE\n1. Extent  of work \nPlanned work \n1.1 Major overhaul \n1.2 Replacement work \n1.3 Machine modification \nUnplanned work  \n1.4   Emergency (breakdown maintenance) \n2. Signs of failure  \n2.1 Wear \n2.2 Corrosion \n2.3 Fatigue \n2.4 Plastic flow \n2.5 Material damage \n2.6 Cracks \n2.7 Fraying \n2.8 Swelling \n2.9 Stretching \n2.10  Tooth breakage \n2.11  Fretting \n2.12  Pitting\n \n3. Causes of failure \n3.1 Dirt \n3.2 Inadequate lubrication  \n3.3 Improper assembly \n3.4 Misalignment \n3.5 Overload \n3.6  Moisture  \n3.7  Lubricant breakdown \n3.8  Contamination \n3.9  External vibration \n3.10  Out of mesh\n \n4. Report  \n4.1 Job report \n4.2  Failure Report  \n3. Background data \n \n \n \n3.1 Manufacturer’s information \n3.2 Equipment history record \n3.3 Systems drawing \n3.4 Process drawings \n3.5 Troubleshooting charts \n3.6  Operator interview\n4. Operational data \n4.1 Operating records \n4.2 Operator’s report \n4.3 Test readings\n\n--- PDF PAGE 33 ---\nPlant Maintenance Mechanic  \n12/02/07 \n31\nEVIDENCE GUIDE \n1. \nCritical aspects \nof Competency \nAssessment requires evidence that the candidate:  \n1.1  Planned work to be done clearly understood \n1.2  Machine dismantled safely \n1.3  Replacements made  \n1.4  Troubleshooting made on breakdown of machine \n2. \nUnderpinning \nknowledge and \nattitude  \n2.1 Assembly and detail drawings of machine \n2.2 Inspection Report form \n2.3 Job Report form \n2.4 Use of hand tools and equipment \n2.5 Linear measuring instruments \n2.6 Signs of failure \n2.7 Causes of failure \n2.8 Troubleshooting skills \n2.9   Report  making using forms     \n3 \nUnderpinning \nskills \n3.1 Use of hand tools \n3.2  Safe handling of tools and materials \n4. \nResource \nimplications \nThe following resources must be provided \n4.1 Appropriate tools for the job \n5. \nMethod of \nassessment \nCompetency may be assessed through: \n5.1   Observation with questioning \n5.2   Demonstration with questioning \n5.3   Written examination  \n5.4   Portfolio \n6. \nContext for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
