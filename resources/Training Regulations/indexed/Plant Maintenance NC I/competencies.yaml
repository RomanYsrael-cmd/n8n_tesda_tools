        "source_text": "MEE722205\n\nUNIT DESCRIPTOR\n: This unit covers the competencies required to measure\nworkpieces using measuring instruments such as steel rules,\nvernier calipers , micrometers, etc….\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nSelect and use\nmeasuring tools\n1.1\n\n1.2\n\n1.3\nMeasuring tools are selected and used according\nto the level of accuracy required.\nMeasurements taken are accurate to the finest\ngraduation of the selected measuring instrument.\nMeasuring technique used is correct and\nappropriate to the device used.\n\n2.\nClean and store\nmeasuring tools\n2.1\n\nCare and storage of devices undertaken to\nmanufacturer’s specifications or standard operating\nprocedures.\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Measuring tools\nMeasuring tools include:\n1.1 Steel tape\n1.2 Steel rule\n1.3 Straight edge\n1.4 Combination square\n1.5 Steel square\n1.6 Divider or trammel\n1.7 Caliper\n1.8 Protractor\n1.9 Vernier caliper\n1.10 Micrometer\n2. Measurements\n2.1 length\n2.2 diameter\n2.3 depth\n2.4 flatness\n2.5 straightness\n2.6 squareness\n\n--- PDF PAGE 26 ---\nPlant Maintenance Mechanic\n12/02/07\n24\n\nEVIDENCE GUIDE\n\n1.\nCritical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Selected and used measuring instruments\n1.2 Cleaned and stored measuring instruments\n2.\nUnderpinning\nknowledge\n2.1 Types, purposes and accuracy of measuring instruments\n2.2 Capability of measuring instruments\n2.3 Part dimensions and tolerances\n2.4 Techniques for measuring dimensions\n2.5 Care and storage procedure of measuring tools\n3.\nUnderpinning\nskills\n3.1 Safe handling of measuring tools and materials\n4.\nResource\nimplications\nThe following resources MUST be provided\n4.1 Tools, equipment and facilities appropriate to the activity\n4.2 Specimen component or part to the proposed activity\n5.\nMethod of\nassessment\nCompetency may be assessed through:\n5.1 direct observation\n5.2 demonstration\n5.3 written or oral short answer questions\n5.4 portfolio\n6.\nContext for\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 27 ---\nPlant Maintenance Mechanic\n12/02/07\n25\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM PREVENTIVE MAINTENANCE\n\nUNIT CODE\n\n:"
