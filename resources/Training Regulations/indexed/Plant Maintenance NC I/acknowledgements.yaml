    {
      "source_text": "UNIT OF COMPETENCY : PERFORM PLANNED MAINTENANCE WORK"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": MEE723302"
    },
    {
      "source_text": "UNIT DESCRIPTOR:"
    },
    {
      "source_text": "This unit covers the knowledge, skills and attitude required to perform planned and unplanned (emergency) maintenance work."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Obtain work instructions 1.1 1.2 1.3"
    },
    {
      "source_text": "Extent of work clearly understood. All materials and tools to be used gathered. Work permit obtained and all safety precautions arranged such as equipment shutdown and danger tags. 2. Dismantle equipment 2.1"
    },
    {
      "source_text": "2.2"
    },
    {
      "source_text": "2.3 Manual studied to determine sequence and extent of dismantling to gain access to the affected area. according to procedure Machine dismantled and parts inspected closely and cleaned for closer inspection as per manufacturer’s recommended procedure. Safety precautions observed in dismantling 3. Inspect closely for cause of failure"
    },
    {
      "source_text": "3.1"
    },
    {
      "source_text": "3.2"
    },
    {
      "source_text": "3.3 Signs of failure determined through visual inspection or use of other methods such as dye penetrant test. Cause of failure of part determined if wear-out, misuse failure or inherent weakness. Note down findings for inclusion in report , history card and failure analysis studies. 4. Replace components 4.1"
    },
    {
      "source_text": "4.2 Component replaced and machine re-assembled using the reverse of dismantling procedure. Report made and submitted to supervisor 5 Troubleshoot machine breakdown (In case work is emergency and therefore unplanned) 5.1"
    },
    {
      "source_text": "5.2 Background data and operational data. about the machine gathered .to define the problem The area suspected where failure is most likely to occur is closely investigated"
    },
    {
      "source_text": "5.3"
    },
    {
      "source_text": "5.4 Machine divided mentally into functional zones to check each zone separately in the drawing and/or the actual machine itself the input and output Eliminate by testing those zones unaffected by the fault, until finally it is isolated to one part of the system"
    },
    {
      "source_text": "-- PDF PAGE 31 --- Plant Maintenance Mechanic 12/02/07 29"
    },
    {
      "source_text": "5.5"
    },
    {
      "source_text": "5.6"
    },
    {
      "source_text": "5.7"
    },
    {
      "source_text": "5.8"
    },
    {
      "source_text": "Machine dismantled and each element of the zone Investigated by testing to pinpoint the particular element in the assembly where the fault lies. Eliminate those elements unaffected by fault by bypassing them or substituting components that are known to work. Cause of failure pinpointed as to wear failure, misuse failure or inherent weakness in design of parts. Note down findings for inclusion in report , history card and failure analysis studies."
    },
    {
      "source_text": "-- PDF PAGE 32 --- Plant Maintenance Mechanic 12/02/07 30"
    },
    {
      "source_text": "RANGE OF VARIABLES VARIABLE RANGE 1. Extent of work Planned work 1.1 Major overhaul 1.2 Replacement work 1.3 Machine modification Unplanned work 1.4 Emergency (breakdown maintenance) 2. Signs of failure 2.1 Wear 2.2 Corrosion 2.3 Fatigue 2.4 Plastic flow 2.5 Material damage 2.6 Cracks 2.7 Fraying 2.8 Swelling 2.9 Stretching 2.10 Tooth breakage 2.11 Fretting 2.12 Pitting"
    },
    {
      "source_text": "3. Causes of failure 3.1 Dirt 3.2 Inadequate lubrication 3.3 Improper assembly 3.4 Misalignment 3.5 Overload 3.6 Moisture 3.7 Lubricant breakdown 3.8 Contamination 3.9 External vibration 3.10 Out of mesh"
    },
    {
      "source_text": "4. Report 4.1 Job report 4.2 Failure Report 3. Background data"
    },
    {
      "source_text": "3.1 Manufacturer’s information 3.2 Equipment history record 3.3 Systems drawing 3.4 Process drawings 3.5 Troubleshooting charts 3.6 Operator interview 4. Operational data 4.1 Operating records 4.2 Operator’s report 4.3 Test readings"
    },
    {
      "source_text": "-- PDF PAGE 33 --- Plant Maintenance Mechanic 12/02/07 31 EVIDENCE GUIDE 1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Planned work to be done clearly understood 1.2 Machine dismantled safely 1.3 Replacements made 1.4 Troubleshooting made on breakdown of machine 2. Underpinning knowledge and attitude 2.1 Assembly and detail drawings of machine 2.2 Inspection Report form 2.3 Job Report form 2.4 Use of hand tools and equipment 2.5 Linear measuring instruments 2.6 Signs of failure 2.7 Causes of failure 2.8 Troubleshooting skills 2.9 Report making using forms 3 Underpinning skills 3.1 Use of hand tools 3.2 Safe handling of tools and materials 4. Resource implications The following resources must be provided 4.1 Appropriate tools for the job 5. Method of assessment Competency may be assessed through: 5.1 Observation with questioning 5.2 Demonstration with questioning 5.3 Written examination 5.4 Portfolio 6. Context for assessment Competency may be assessed in the workplace or in simulated workplace environment."
    },
