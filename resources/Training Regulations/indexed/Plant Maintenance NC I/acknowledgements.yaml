    },
    {
      "source_text": "4.1 To attain the National Qualification of Plant Maintenance Mechanic NC I, the candidate must demonstrate competence in all the units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "source_text": "4.2 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "source_text": "4.3 The following are qualified to apply for assessment and certification:"
    },
