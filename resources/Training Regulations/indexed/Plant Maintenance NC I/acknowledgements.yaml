      "source_text": "TRAINING REGULATIONS FOR PLANT MAINTENANCE NC I"
    },
    {
      "source_text": "SECTION 1 PLANT MAINTENANCE NC I QUALIFICATION"
    },
    {
      "source_text": "The Plant Maintenance NC I Qualification consists of competencies that a person must achieve to perform preventive and corrective maintenance, perform planned and unplanned maintenance, fabricate simple items and install machinery."
    },
    {
      "source_text": "The Units of Competency comprising this qualification include the following:"
    },
    {
      "source_text": "Code No. BASIC COMPETENCIES 500311101 Receive and respond to workplace communication 500311102 Work with others 500311103 Demonstrate Work Values 500311104 Practice Housekeeping Procedures"
    },
    {
      "source_text": "Code No. COMMON COMPETENCIES MEE722201 Apply safety practices MEE722202 Interpret working drawings and sketches MEE722204 Perform shop computations (Basic) MEE722205 Measure workpiece (Basic)"
    },
    {
      "source_text": "Code No. CORE COMPETENCIES MEE723301 Perform Preventive Maintenance MEE723302 Perform Planned and Unplanned (Emergency) Maintenance MEE723303 Fabricate Simple Items MEE723304 Install Machinery"
    },
    {
      "source_text": "A person who has achieved this qualification is competent to be:"
    },
    {
      "source_text": "Plant Maintenance Mechanic"
    },
    {
      "source_text": "-- PDF PAGE 4 --- Plant Maintenance Mechanic 12/02/07 2"
