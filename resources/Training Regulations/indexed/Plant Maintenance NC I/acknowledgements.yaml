    },
    {
      "source_text": "RANGE OF VARIABLES VARIABLE RANGE 1. Hazards 1.1 Cluttered tools and materials 1.2 Slippery floors (caused by oil, grease or any liquid) 1.3 Exposed electrical wires 1.4 Sharp edges 1.5 Machine without guards or with exposed moving parts 1.6 Uncollected chips or other wastes etc. 2. Protective clothing and devices Protective clothing and devices may include but is not limited to: 2.1 safety glasses/goggles 2.2 safety shoes 2.3 overalls 2.4 cap 3. Injuries Injuries may include: 3.1 burns/scalds 3.2 fractures 3.3 cuts and abrasions 3.4 poisoning 3.5 foreign bodies in the eye 3.6 concussion 3.7 shock 4. Type of fires Fires involving or caused by: 4.1 common combustibles (wood, cloth, paper, rubber and plastic) 4.2 flammable liquids (gasoline, oil, solvents, paints, etc.) 4.3 energized electrical equipment (wiring, fuse boxes, circuit breakers, appliances, etc. 4.4 combustible metals (magnesium, sodium, etc.)"
    },
