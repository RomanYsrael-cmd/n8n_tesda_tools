      "source_text": ": MEE722201"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the competencies required to apply safety practices in the workplace."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Identify hazards 1.1"
    },
    {
      "source_text": "1.2 Hazards are identified correctly in accordance with OHS principles. Safety signs and symbols are identified and adhered to."
    },
    {
      "source_text": "2. Use protective clothing and devices 2.1"
    },
    {
      "source_text": "Appropriate protective clothing and devices correctly selected and used in accordance with OHS requirements or industry/company policy"
    },
    {
      "source_text": "3. Perform safe handling of tools, equipment and materials 3.1"
    },
    {
      "source_text": "3.2 Safety procedures for pre-use check and operation of tools and equipment followed in accordance with industry/ company policies. Tools, equipment and materials handled safely in accordance with OHS requirements and industry/ company policies."
    },
    {
      "source_text": "4. Perform first aid 4.1 First aid treatment of injuries are carried out according to recommended procedures"
    },
    {
      "source_text": "5. Use fire extinguisher 5.1 Fire extinguisher selected and operated correctly according to the type of fire."
    },
