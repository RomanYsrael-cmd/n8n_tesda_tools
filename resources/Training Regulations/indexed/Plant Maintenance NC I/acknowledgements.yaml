      "source_text": "UNIT OF COMPETENCY : PERFORM PREVENTIVE MAINTENANCE"
    },
    {
      "source_text": "UNIT CODE"
    },
    {
      "source_text": ": MEE723301"
    },
    {
      "source_text": "UNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes involved in the prevention or delay of breakdown through routine maintenance work and primarily through scheduled or periodic inspections."
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Interpret work instructions"
    },
    {
      "source_text": "1.1"
    },
    {
      "source_text": "1.2"
    },
    {
      "source_text": "1.3"
    },
    {
      "source_text": "Work instruction interpreted and fully understood ."
    },
    {
      "source_text": "Operation manual of machines and parts concerned obtained as reference for manufacturer’s recommendations. Work permits obtained"
    },
    {
      "source_text": "2."
    },
    {
      "source_text": "Perform routine maintenance work 2.1"
    },
    {
      "source_text": "2.2"
    },
    {
      "source_text": "2.3 Machine parts or entire machine cleaned of dust and dirt according to manufacturer’s recommendations."
    },
    {
      "source_text": "Lubrication points of machine and condition of lubricants checked according to work procedures."
    },
    {
      "source_text": "Minor adjustments made on loose bolts, drive slacks, guards and covers."
    },
    {
      "source_text": "3."
    },
    {
      "source_text": "Perform inspection procedures 3.1"
    },
    {
      "source_text": "3.2"
    },
    {
      "source_text": "3.3"
    },
    {
      "source_text": "3.4"
    },
    {
      "source_text": "3.5"
    },
    {
      "source_text": "3.6 Inspection Checklists gathered as guide for inspection."
    },
    {
      "source_text": "Inspection tools in good condition gathered"
    },
    {
      "source_text": "Operational symptoms of malfunction or impending failure observed through the human senses."
    },
    {
      "source_text": "Evidence of symptoms of malfunction or impending failure searched through closer inspection of parts."
    },
    {
      "source_text": "Inspection with the inspection instruments and methods used to detect start of failures such as cracks, unbalance, etc."
    },
    {
      "source_text": "Findings of inspection with recommended course of action noted in a report in accordance with company procedures."
    },
    {
