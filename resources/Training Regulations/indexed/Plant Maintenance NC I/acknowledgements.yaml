    },
    {
      "source_text": "ELEMENT PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables 1. Sort and remove unnecessary items 1.1 Reusable, recyclable materials are sorted in accordance with company/office procedures 1.2 Unnecessary items are removed and disposed of in accordance with company or office procedures 2. Arrange items 2.1 Items are arranged in accordance with company/office housekeeping procedures 2.2 Work area is arranged according to job requirements 2.3 Activities are prioritized based on instructions. 2.4 Items are provided with clear and visible identification marks based on procedure 2.5 Safety equipment and evacuation passages are kept clear and accessible based on instructions 3. Maintain work area, tools and equipment 3.1 Cleanliness and orderliness of work area is maintained in accordance with company/office procedures 3.2 Tools and equipment are cleaned in accordance with manufacturer’s instructions/manual 3.3 Minor repairs are performed on tools and equipment in accordance with manufacturer’s instruction/manual 3.4 Defective tools and equipment are reported to immediate supervisor 4. Follow standardized work process and procedures 4.1 Materials for common use are maintained in designated area based on procedures 4.2 Work is performed according to standard work procedures 4.3 Abnormal incidents are reported to immediate supervisor 5. Perform work spontaneously 5.1 Work is performed as per instruction 5.2 Company and office decorum are followed and complied with 5.3 Work is performed in accordance with occupational health and safety (OHS) requirements"
    },
