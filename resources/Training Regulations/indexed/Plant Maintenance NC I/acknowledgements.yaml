    },
    {
      "source_text": "1.1 1.2 1.3 Importance of Maintenance Prevention vs repair Planned vs unplanned maintenance 2. Machines, equipment and parts 2.1 2.2 2.3 2.4 2.5 2.6 Process machineries Storage Tanks Pumps and Compressors Fans and Blowers Machine Tools Power transmission elements V-belts & pulleys Chain & sprockets Shafts and keys Shaft couplings Clutches and brakes Bearings: plain and rolling element Gears Seals Packings and O-rings Lip seals Fluid system 3. Lubrication 3.1 3.2 3.3 3.4 3.5 Principles of Lubrication Types of Lubricants Lubricant points Lubrication breakdown Lubrication recommendation 4. Minor Adjustments 4.1 4.2 4.3 4.4 4.5 Alignment Loose bolts Drive tension Chain slacks Guards and covers 5. Operating symptoms 5.1 5.2 5.3 5.4 5.5 5.6 5.7 5.8 Operating Symptoms may also include Unusual noise Overheating Burnt odor Vibration Misalignment Leakages Others as per manufacturer 6. Evidence of Symptoms"
    },
    {
      "source_text": "6.1 6.2 6.3 6.4 6.5 Evidence of symptoms may include: Wear Fatigue Wear pattern Scoring Others as per Manufacturers manual 7. Forms 7.1 7.2 7.3 7.4 Routine Maintenance Report Inspection Schedules Inspection Report Forms Inspection Checklists Inspection Procedures"
    },
    {
      "source_text": "-- PDF PAGE 29 --- Plant Maintenance Mechanic 12/02/07 27 EVIDENCE GUIDE 1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1 Maintenance work instruction fully understood 1.2 Performed routine maintenance such as cleaning, lubrication and adjustments. 1.3 Maintenance inspection performed using inspection checklists and manuals 1.4 Inspection reports and Routine Maintenance Reports submitted. 2. Underpinning knowledge and attitude 2.1 Normal running characteristics of a machine 2.2 Interpreting machine assembly and sectional details 2.3 Sequence of dismantling parts of a machine 2.4 Inspection procedures as per manufacturer 3. Underpinning skills 3.1 Safe use of hand tools and equipment 3.2 dismantling and mounting of parts 3.3 using inspection report routine maintenance report form 3.4 lubricating procedure 3.5 coupling alignment 3.6 adjusting belt tension and chain slacks 3.7 cleaning procedure 4. Resource implications The following resources MUST be provided: 4.1 appropriate hand tools and supplies 4.2 drawings and manuals 4.3 inspection checklist 4.3 inspection and routine maintenance report form 5. Method of assessment Competency may be assessed through: 5.1 Observation with questioning 5.2 Demonstration with questioning 5.3 Written examination 5.4 Portfolio 6. Context for assessment Competency may be assessed in the workplace or in simulated workplace environment."
    },
