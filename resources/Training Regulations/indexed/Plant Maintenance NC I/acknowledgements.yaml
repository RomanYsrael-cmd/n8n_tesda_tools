    {
      "source_text": "UNIT OF COMPETENCY: RECEIVE AND RESPOND TO WORKPLACE COMMUNICATION UNIT CODE : 500311101 UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to receive, respond and act on verbal and written communication."
    },
