      "source_text": "-- PDF PAGE 44 --- Plant Maintenance Mechanic 12/02/07 42"
    },
    {
      "source_text": "2.10 Divide mentally the machine into functional zones to check each zone separately in the drawing and/or the actual machine."
    },
    {
      "source_text": "2.11 Continue investigating all zones by eliminating those zones unaffected by the fault, until a zone is finally isolated."
    },
    {
      "source_text": "2.12 Dismantle the zone affected and each element of the zone Investigated by testing to pinpoint the particular element in the assembly where the fault lies."
    },
    {
      "source_text": "2.13 Investigate the cause of failure: whether wear failure, misuse failure or inherent weakness of the part failure ."
    },
    {
      "source_text": "2.14 Make report of the job using Job Report Form"
    },
    {
