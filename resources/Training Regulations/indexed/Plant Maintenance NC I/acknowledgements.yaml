    {
      "source_text": "Assessment Approach 2. Perform planned maintainance 2.1 Perform maintenance work planned in advance."
    },
    {
      "source_text": "2.2 Gather work instructions about maintenance work to be done; work authorization"
    },
    {
      "source_text": "2.3 Observe safety precautions before and during maintenance work. Tag in/ Tag out"
    },
    {
      "source_text": "2.4 Dismantle equipment to gain access to part to be replaced."
    },
    {
      "source_text": "2.5 Remove defective item and install the replacement."
    },
    {
      "source_text": "2.6 Inspect the defective item for cause of failure and note down for inclusion in report."
    },
    {
      "source_text": "2.6 Re-assemble, align and make minimum checks and/or adjustments"
    },
    {
      "source_text": "2.8 Perform minimum tests required to ensure fault is eliminated."
    },
    {
      "source_text": "For unplanned maintenance (emergency) where failure and cause is unknown"
    },
    {
      "source_text": "2.9 Gather all necessary data to find the fault from operators or from data available (operational & background information.."
    },
    {
      "source_text": "Lecture/ discussion"
    },
    {
      "source_text": "Self-paced instructions"
    },
