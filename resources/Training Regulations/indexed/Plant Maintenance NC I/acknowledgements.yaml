    },
    {
      "source_text": "-- PDF PAGE 6 --- Plant Maintenance Mechanic 12/02/07 4 EVIDENCE GUIDE 1. Critical aspects of Competency Assessment requires evidence that the candidate: 1.1. Demonstrated knowledge of organizational procedures for handling verbal and written communications 1.2. Received and acted on verbal messages and instructions 1.3. Demonstrated competency in recording instructions/information"
    },
    {
      "source_text": "2. Underpinning Knowledge and Attitudes 2.1. Knowledge of organizational policies/guidelines in regard to processing internal/external information 2.2. Ethical work practices in handling communications 2.3. Communication process 3. Underpinning Skills 3.1. Conciseness in receiving and clarifying messages/ information/communication 3.2. Accuracy in recording messages/information 4. Resource Implications The following resources MUST be provided: 4.1. Pens 4.2. Note pads 5. Methods of Assessment Competency may be assessed through: 5.1. Direct Observation 5.2. Oral interview 5.3. Written Evaluation 5.4. Third Party Report"
