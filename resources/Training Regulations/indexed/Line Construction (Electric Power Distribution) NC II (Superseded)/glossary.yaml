    {
      "term": "Unit of Competency",
      "definition": "is a component of the competency standards stating a specific key function or role in a particular job or occupation; it is the smallest component of achievement that can be assessed and certified under the PTQF TRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II Page 53 Promulgated – November 2010 SPECIFIC 1. Anchor - A device that supports and holds in place conductors when they are terminated at a pole or structure. The anchor is buried and attached to the pole by way of guy wire to counteract the mechanical forces of these conductors. 2. Armor - An outer metal layer applied to a cable for mechanical protection. Armor is comprised of factory formed wire, designed to be applied to a range of conductor sizes. 3. Armor Rod - An outer metal layer applied to a cable for mechanical protection. Armor Rods are comprised of factory formed wire, designed to be applied to a range of conductor sizes. 4. Baker Board - A platform used to work above the ground on a wood pole. 5. Block and tackle - an apparatus of pulley blocks and ropes or cables used for hauling and hoisting heavy objects. 6. Cable - A term generally applied to the larger sizes of bare or weatherproofed (covered) and insulated conductors. It is also applied to describe a number of insulated conductors twisted or grouped together. 7. Cable Pulling Lubricant - A chemical compound used to reduce pulling tension by lubricating a cable when pulled into a duct or conduit. 8. Climbers - Hooks for climbing poles that are attached to a lineman's boots. 9. Cum-a-long - A wire grip for holding a conductor or strand under tension. 10. Conductor - 1) a wire or combination of wires suitable for carrying an electrical current. Conductors may be insulated or bare. 2) any material that allows electrons to flow through it. 11. Connector - A conductive coupling device used to connect conductors together. 12. Cross-arm - A wooden/steel support attached to a pole that holds wire and insulators. 13. Cut-out - A transformer fuse so named because when the fuse is removed the circuit opens. 14. Digger-derrick - A type electric utility line truck that digs holes and sets poles. 15. Distribution System - A term used to describe that part of an electric power system that distributes the electricity to consumers from a bulk power location such as a substation. It includes distribution line, line equipment and power substation. 16. Distribution Transformer - A line equipment that reduces voltage from the supply lines for direct connection to operate consumer devices. TRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II Page 54 Promulgated – November 2010 17. Distribution Voltage - A nominal operating voltage below 69 kV. 18. Double Arming Bolt - A special long bolt used to assemble two cross arms, one on each side of the pole. 19. Electrical Hazard - A dangerous condition such that contact or equipment failure can result in electric shock, arc flash burn, thermal burn, or blast. 20. Electric meter or energy meter is a device that measures the amount of electrical energy consumed by a residence, business, or an electrically-powered device. Electric meters are typically calibrated in billing units, the most common one being the kilowatt hour. 21. Electrical Safety - Recognizing hazards associated with the use of electrical energy and taking precautions so that hazards do not cause injury or death. 22. Electrically Safe Work Condition - A state in which the conductor or circuit part to be worked on or near has been disconnected from energized parts, locked/tagged in accordance with established standards, tested to ensure the absence of voltage, and grounded if determined necessary. 23. Grip All Stick - See Shotgun Stick. 24. Groundman - a person working at ground level in support of a lineman working above. 25. Guy - a rope, cord, or wire used to steady, guide, or secure something. 26. Guy-wire or guy-rope is a tensioned cable designed to add stability to structures (frequently ship masts, radio masts, wind turbines, utility poles, and tents). One end of the cable is attached to the structure, and the other is anchored to the ground at a distance from the structure's base. This allows the tension of each guy-wire to offset the others. 27. Hotstick - An insulated stick usually made of fiberglass that is used to work energized overhead conductors and operate electrical equipment that is overhead, underground and pad mounted. 28. Insulator - a device that is used to electrically isolate a conductor or electrical device from ground or a different electrical potential. Insulators are broadly classified as either pin-type, which support the conductor above the structure, or suspension type, where the conductor hangs below the structure. Insulators are usually made of wet- process porcelain or toughened glass, with increasing use of glass-reinforced polymer insulators. 29. Jumper - An electrical connection between two points. 30. Kilowatt - 1000 watts of real power. Expressed at kW. 31. Kilowatt Hour - The use of one thousand watts for one hour. TRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II Page 55 Promulgated – November 2010 32. Line - refers to the conductor in an overhead or underground distribution or transmission line. 33. Line worker - a person whose duties include climbing wood poles or steel structures to perform work on electric power distribution line construction. 34. Personal Protective Equipment (PPE) - The term shall include, but is not limited to, devices designed to be worn by workers for eye, face, head, respiratory, hand, arm, body, leg, foot, and fall protection. 35. Pole pike - a device with a sharp metal point in one end that is used to hold utility poles upright while they are being erected. 36. Right-of-way - A strip of land owned by another party on which a utility places poles, wires, substations, and other facilities. 37. Service Drop - an electrical line running from a utility pole to a customer's building or other premises. It is the point where electric utilities provide power to their customers. 38. Service Entrance Cable - The conductors that connect the service conductors (drop or lateral) to the service equipment of the building. 39. Shotgun Stick - A specialized hot stick that allows the capture of certain types of clamps and devices in its hook. It is also called a \"Grip All\" stick. 40. Stringing - The act of installing overhead electrical wire or conductor. 41. Tag Line - A rope used to control the position of equipment being lifted. This is not to be confused with the rope used to actually lift the equipment. 42. Tension - The force in pounds of kilograms on a conductor installed overhead. Too much tension on an overhead line can contribute to mechanical failure. ANNEX A UTILITIES SECTOR COMPETENCY MAP LINE CONSTRUCTION (ELECTRIC POWER DISTRIBUTION) NC II BASIC COMPETENCIES Receive and Respond to Workplace Communication Work with Others Demonstrate work values Practice basic housekeeping procedures Participate in Workplace Communication Work in a Team Environment Practice career professionalism Practice occupational health and safety procedures Lead Workplace Communication Lead Small Working Teams Develop and Practice Negotiating Skills With Team Members Guide Effective Solutions to Problems Arising from Work Activities Check and Develop the Use of Mathematical Concepts & Techniques Use Relevant Technologies Applicable to Assigned Work Lead in Utilizing Specialized Communication Skills Assist in Developing Team and Individuals Apply Problem Solving Techniques in the Workplace Collect, analyze and organize information Plan and Organize Work for Several Working Teams Promote Environmental Protection COMMON COMPETENCIES Apply quality standards Comply with environmental protection procedures Observe procedures, specifications and manual of instruction Operate and maintain tools and equipment Operate a personal computer CORE COMPETENCIES Tender Diesel Engine Operate Diesel Power plant Maintain and Repair Diesel Engine Systems and Alternator Service Alternator/ Generator Diagnose and Repair Diesel Engine Diagnose and Repair Electrical System Overhaul Diesel Engine Perform transmission line pole erection Perform overhead transmission line work Perform cold-line maintenance work Perform live-line maintenance work Perform ground line maintenance work Install emergency restoration structure (ERS) Plan transmission line maintenance job Implement transmission line maintenance works Inspect/Assess transmission line components’ conditions Erect distribution line poles Climb pole and install pole assembly/ conductors Install distribution line equipment and devices Install consumer service connection facility Perform maintenance work on de-energized line Perform maintenance work on live-line (energized) Perform ground line maintenance work TRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II Page 57 Promulgated – November 2010"
