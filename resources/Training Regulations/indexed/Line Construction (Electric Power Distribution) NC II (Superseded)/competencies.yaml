        "source_text": "UTL311205\nDESCRIPTOR : This unit covers the knowledge, skills and attitude to operate\nand maintain hand/line tools and equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1. Plan and prepare for\nwork\n1.1 Work instruction is secured and interpreted according to\n job requirements\n1.2 Relevant occupational health and safety requirements\nare identified following job specifications\n1.3 Relevant distribution hand/line tools and equipment are\nidentified and requested in accordance with job\nspecifications\n2. Prepare hand/line\ntools and equipment\n\n2.1 Personal protective equipment (PPE) are obtained\nfollowing job requirements\n2.2 Hand/Line tools, equipment and hardware are acquired\nand secured in accordance with job requirements\n\n3. Check condition of\nline tools and\nequipment\n3.1 Hand/Line tools and equipment are identified according to\nclassification and job requirements\n3.2 Non-functional hand/line tools and equipment are\nsegregated and labeled according to classification\n3.3 Safety of hand/line tools and equipment are observed in\naccordance with manufacturer's instructions\n3.4 Condition of PPE are checked in accordance with\nmanufacturer's instructions\n4. Operate hand/line\ntools and equipment\n\n4.1 PPE are used in line with job requirements\n4.2 Hand/Line tools and equipment are used in accordance\nwith job requirements\n5. Perform basic\npreventive\nmaintenance\n5.1 Appropriate lubricants are identified according to types of\nequipment\n5.2 Equipment are lubricated according to preventive\nmaintenance schedule or manufacturer's specifications\n5.3 Hand/Line tools are cleaned and tested according to\nstandard procedures\n5.4 Hand/Line tools and equipment are inspected, and\nrepaired and replaced, if necessary, after use\n5.5 Work place is cleaned and kept in safe state in accordance\nwith OHSA regulations\n6. Store tools and\nequipment\n\n6.1 Inventory of hand/line tools and equipment are conducted\nand recorded as per company practices\n6.2 Hand/Line tools and equipment are stored safely in\nappropriate locations in accordance with manufacturer's\nspecifications or company procedures\n\n--- PDF PAGE 27 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II Page 25\nPromulgated – November 2010\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Job requirements\nMay include but not limited to:\n1.1 Erect pole\n1.2 Perform overhead line work\n1.3 Perform cold line construction work\n1.4 Perform other basic works in distribution line\nconstruction\n\n2. Occupational health\nand safety\nrequirements\nMay include but not limited to:\n2.1 Personal protective equipment (PPE)\n2.1.1 Safety hat\n2.1.2 Rain suits\n2.1.3 Rubber boots\n2.1.4 Working clothes\n2.1.5 Goggles/Eye protector\n2.1.6 Work gloves\n2.1.7 Lineman boots\n\n3. Hand/Line tools &\nequipment\nMay include but not limited to:\n3.1 Hand tools\n3.1.1 Lineman’s Plier\n3.1.2 Screwdrivers\n3.1.3 Adjustable lineman wrench\n3.1.4 Ball peen hammer\n3.1.5 Wire skinning knife\n3.1.6 Ruler (wood, folding)\n3.2 Equipment\n3.2.1 Motorized capstan\n3.2.2 Pole climbing equipment\n3.2.3 Line truck/Boom truck\n3.3 Set of digging/line/stringing tools & ropes\n\n--- PDF PAGE 28 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II Page 26\nPromulgated – November 2010\n\nEVIDENCE GUIDE\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to identify and comply with\n occupational health and safety standards in operating and\n maintaining line tools and equipment\n1.2 Demonstrates ability to identify and safely use of tools and\nequipment\n1.3 Demonstrates ability to perform basic preventive\n maintenance servicing for line equipment\n\n2. Underpinning\n knowledge and\n attitude\n2.1 Relevant occupational health and safety standards\n2.2 Proper procedure for the use of line tools and equipment\n2.3 Basic preventive maintenance servicing for line equipment\n\n3. Underpinning skills\n3.1 Following and complying occupational health and safety\n standards\n3.2 Following procedures for the safe use of line tools and\nequipment\n3.3 Performing basic preventive maintenance servicing for\n line equipment\n\n4. Resource Implications\nThe following resources must be available:\n4.1 Line tools, equipment and PPE\n4.2 Work area\n\n5. Method of assessment 5.1 Observation and Oral questioning\n5.2 Demonstration with oral questioning\n5.3 Written test\n\n6. Context of\n assessment\n6.1 Competency may be assessed in the workplace or in a\n simulated workplace setting\n6.2 Assessment shall be undertaken either individually or part\n of team under limited supervision\n\n--- PDF PAGE 29 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II Page 27\nPromulgated – November 2010\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nERECT DISTRIBUTION LINE POLES\nUNIT CODE\n:"
