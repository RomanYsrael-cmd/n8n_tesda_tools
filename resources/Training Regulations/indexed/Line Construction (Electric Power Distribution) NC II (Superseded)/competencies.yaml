        "source_title": "CLIMB POLE AND INSTALL POLE ASSEMBLY/ CONDUCTORS",
        "source_text": "--- PDF PAGE 33 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II                                        Page 31 \nPromulgated – November 2010 \n \nUNIT OF COMPETENCY : \nCLIMB POLE AND INSTALL POLE ASSEMBLY/ \nCONDUCTORS  \nUNIT CODE \n:    UTL723220 \nDESCRIPTOR \n: \nThis unit covers the outcomes required for climbing pole \nand installing pole top, anchor, guy, conductor (primary/ \nsecondary), grounding assemblies. The scope of this unit \ncovers climbing techniques, dressing/framing of pole, \ninstalling pole anchor and guy, conductor pay-out/stringing, \ntensioning, armoring and tying of conductors. This involves \nworking with a team. \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized Bold terms are elaborated in the range of variables) \n1. Plan and prepare \nfor work \n \n1.1 Work instruction is secured and interpreted according to job \nrequirements \n1.2 Relevant occupational health and safety requirements are \nidentified following job specifications \n1.3 Relevant distribution line tools, equipment and hardware \nare identified, requested and acquired in accordance with \nconstruction specifications \n1.4 Personal protective equipment (PPE) are obtained following \njob requirements \n2. Dress/Frame pole \n \n2.1 Pole climbing technique is demonstrated in line with \noccupational health and safety standards. \n2.2 Installation of pole top (conductor) assembly is performed \nin accordance with construction specifications  \n2.3 Boring is performed, if necessary, in accordance with the \nconstruction specification \n2.4 Housekeeping procedure is performed in line with established \nprocedure  \n3. Install pole \nanchor and guy \n3.1 Boring is performed in accordance with the construction \nspecification \n3.2 Guy wire is installed on the pole with other hardware based \non construction specification \n3.3 Anchor is installed based on type of construction. \n4. Perform stringing \nand tensioning of \nconductor \n(primary/ \nsecondary) \n4.1 Conductor is prepared with pay-out stand. \n4.2 Conductor is pulled out from the conductor rack (reel) to \nvarious electric poles. \n4.3 Conductor is installed on the conductor support based on \nconstruction specification. \n4.4 Tensioning is applied to attain the required sag of conductor. \n5. Apply Conductor \nArmoring and \nTying \n5.1   Armoring is applied for protection of conductor. \n5.2 Tying of conductors is applied to avoid detachment from \nthe insulators. \n6. Perform line \ngrounding \n6.1   Pole ground to neutral condition and guys jumpering are \ninstalled in conformity with line construction specifications. \n6.2   Rigid grounding taps and connectors are installed to avoid \nloose connection.\n\n--- PDF PAGE 34 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II                                        Page 32 \nPromulgated – November 2010 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Occupational \nhealth and safety \nrequirements \nMay include but not limited to: \n1.1 \nPersonal protective equipment (PPE) \n1.1.1. Hard hat/Safety hat \n1.1.2. Goggles/Eye protector \n1.1.3. Work gloves \n1.1.4. Lineman boots/Rubber boots \n1.1.5. Working clothes \n1.1.6. Rain suits \n1.2 \nPole climbing equipment  \n1.2.1. Safety strap/cord \n1.2.2. Body belt \n1.2.3. pair of climbers \n2. Distribution line \ntools, equipment \nand hardware \nMay include but not limited to: \n2.1 \nTools \n2.1.1. Rope/Hand line \n2.1.2. Adjustable wrench or lineman wrench \n2.1.3. Pliers \n2.1.4. Ball peen hammer \n2.1.5. Measuring rule / steel tape \n2.1.6. Screw driver \n2.1.7. Auger bit \n2.1.8. Ratchet  \n2.1.9. Cum-a-long \n2.1.10. Bolt cutter \n2.1.11. wire skinning knife \n2.1.12. Bolo/Sickle \n2.1.13. Bull line \n2.1.14. Pulling line \n2.1.15. Conductor rack \n2.1.16. Compression tool \n2.1.17. Pulley \n2.2 \nEquipment \n2.2.1 Boom truck or derrick truck \n2.2.2 Chain saw \n2.2.3 Pole climbing equipment \n2.2.4 Wench  \n2.2.5 Ladder \n2.3 \nConstruction materials for pole top, anchor, guy, conductor, \ngrounding assemblies \n2.4 \nConductors or wires (bare or insulated) \n2.4.1. Aluminum Conductor Steel Reinforced (ACSR) \n2.4.2. Copper wire \n3. pole top/ \nconductor \nassembly \n3.1 \nPrimary \n3.1.1. Single-phase \n3.1.2. Vee-phase \n3.1.3. Three-phase \n3.2 \nSecondary \n3.2.1. Open \n3.2.2. Underbuilt\n\n--- PDF PAGE 35 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II                                        Page 33 \nPromulgated – November 2010 \n \n \n4. Anchor assembly May include: \n4.1 \nAnchor lag \n4.2 \nLine anchors \n4.2.1. expanding  \n4.2.2. screw or swamp type \n4.2.3. plate \n4.2.4. cone  \n \n5. Conductor rack \n(Reel) \n5.1 \nStationary or fixed reel \n5.2 \nMounted or moving reel \n6. Tying of \nconductors \n6.1 \nTop groove tie \n6.2 \nSide groove tie \n7. line construction \nspecifications \n7.1 specifications for 13.2 / 7.6 KV line construction \n7.2 specifications for 34.5 / 20 KV line construction \n7.3 specifications for other distribution utilities\n\n--- PDF PAGE 36 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II                                        Page 34 \nPromulgated – November 2010 \n \n EVIDENCE GUIDE \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Demonstrates ability to interpret job requirements  \n1.2 Demonstrates ability to dress/frame Pole \n1.3 Demonstrates ability to install pole anchor and guy \n1.4 Demonstrates ability to string and tension conductor \n1.5 Demonstrates ability to apply conductor armoring and tying \n2. Underpinning \nknowledge and \nattitude \n \n \n \n \n2.1 Basic electricity \n2.2 Basic distribution line construction works \n2.3 Occupational safety and health standards for line workers \n2.4 Hand signal communication  \n2.5 Uses and specifications of distribution line tools, equipment and \nhardware  \n2.6 Safety procedures for installing pole hardware and conductors  \n2.7 Different pole type assembly  \n2.8 Power distribution industry standards and specifications \n2.9 Desirable work values and attitudes (team player, cost conscious, \nquality man-hours, quality conscious, etc.) \n3. Underpinning \nvalues and \nattitudes \nDesirable work values and attitudes includes: \n3.1 Integrity \n3.2 Team player \n3.3 Responsible \n3.4 Customer service oriented \n3.5 Quality and standard consciousness \n3.6 Environment steward \n4. Underpinning \nskills \n4.1. Identifying and following occupational health and safety standards \nfor line workers \n4.2. Using distribution hand/line tools, equipment and hardware \n4.3. Following safety procedures for pole hardware and conductors \n4.4. Pole climbing skills \n4.5. Knot tying skills \n4.6. Using hand signal communication \n4.7. Perform conductor riding technique \n4.8. Communication skills  \n4.9. First aid skills \n4.10. Working in a team environment \n4.11. Interpreting and following power distribution industry standards \n4.12. Proper care, handling and assembling DX materials and hardware \n5. Resource \nimplications \nThe following resources should be available: \n5.1 Tools, equipment, hardware and PPE (see range of variables) \n5.2 Site or work area \n5.3 Boom or derrick truck (if necessary) \n6. Method of \nassessment \nCompetency may be assessed through: \n6.1 Direct observation with oral questioning \n6.2 Demonstration of skills with oral questioning \n6.3 Portfolio \n6.4 Written test \n6.5 Third party report (Instructor/Trainor’s report) \n7. Context of \nassessment \n7.1 Competency maybe assessed in the workplace or in a simulated \nworkplace setting \n7.2 Assessment shall be undertaken either individually or part of team \nunder limited supervision\n",
