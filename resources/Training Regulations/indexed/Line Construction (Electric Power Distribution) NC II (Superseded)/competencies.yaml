        "source_text": "UTL724604\nDESCRIPTOR\n:\nThis unit covers the outcomes required for installing\ndistribution line equipment and devices. The scope of this\nunit covers performing installation of distribution line\nequipment and devices as well as tapping/connecting line\nequipment and devices to distribution line. This involves\nworking with a team.\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are elaborated in the range of variables)\n1. Plan and prepare\nfor work\n\n1.1 Work instructions are secured and interpreted according\nto job requirements\n1.2 Relevant occupational health and safety requirements\nare identified following job specifications\n1.3 Relevant distribution line tools, equipment, materials and\ndevices are identified, requested and acquired in\naccordance with construction specifications\n1.4 Personal protective equipment (PPE) are obtained following\njob requirements\n\n2. Install line\nequipment and\ndevices\n2.1 Lifting devices is installed securely to the top of the pole.\n2.2 Boring is performed, if necessary, in accordance with the\nconstruction specification\n2.3 Line equipment and devices are installed in accordance\nwith construction specifications and standards\n2.4 Housekeeping procedure is performed in line with\nestablished procedure\n\n3. Tap/Connect line\nequipment and\ndevices to\ndistribution line\n3.1 Connectors/jumpers are installed between line conductors\nfor safety, conductivity and reliability purposes.\n3.2 Line tapping and connection is performed in accordance\nwith the construction specification\n3.3 Grounding for equipment is installed in accordance with\nline construction specifications.\n\n--- PDF PAGE 38 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II Page 36\nPromulgated – November 2010\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work instruction\nMay include but are not limited to:\n1.1\njob order form\n1.2\nwork order form\n\n2. Occupational\nhealth and safety\nrequirements\nMay include but not limited to:\n2.1\nPersonal protective equipment (PPE)\n2.1.1. Hard hat/Safety hat\n2.1.2. Goggles/Eye protector\n2.1.3. Working gloves\n2.1.4. Lineman boots\n2.1.5. Working clothes\n2.1.6. Rain suits\n2.1.7. Rubber boots\n2.2\nPole climbing equipment\n2.2.1. Safety strap/cord\n2.2.2. Body belt\n2.2.3. pair of climbers\n\n3. Distribution line\ntools, materials,\nequipment and\ndevices\nMay include but not limited to:\n3.1\nTools\n3.1.1. Rope/Hand line/Bull line\n3.1.2. Adjustable wrench or lineman wrench\n3.1.3. Pliers\n3.1.4. Ball peen hammer\n3.1.5. Measuring rule / steel tape\n3.1.6. Screw driver\n3.1.7. Auger bit\n3.1.8. Wire skinning knife\n3.1.9. Compression tool\n3.2\nMaterials/Hardware\n3.2.1. conductors\n3.2.2. insulators and pins\n3.2.3. ground rod\n3.2.4. ground lead\n3.2.5. connectors\n3.2.6. ground clip\n3.2.7. bolts and accessories\n3.2.8. wire staple\n3.2.9. wedge clamps\n3.2.10. hot line clamps\n3.3\nEquipment and devices\n3.3.1. Transformer gin\n3.3.2. Cut-out\n3.3.3. Distribution transformer\n3.3.4. Pulley or block and tackle\n3.3.5. Ladder\n3.3.6. Boom truck or derrick truck\n3.3.7. Pole climbing equipment\n\n--- PDF PAGE 39 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II Page 37\nPromulgated – November 2010\n\n4. Lifting devices\nMay include:\n4.1\nTransformer gin\n4.2\nPulley or block and tackle\n4.3\nHandline / Rope / Bull line\n\n5. construction\nspecifications\n5.1\nspecifications for 13.2 / 7.62 KV line construction\n5.2\nspecifications for 34.5 / 20 KV line construction\n5.3\nspecifications for other distribution utilities\n\n6. line equipment\nand devices\nMay include:\n6.1\ndistribution transformer\n6.2\ncut-out and lightning arrester\n\n--- PDF PAGE 40 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II Page 38\nPromulgated – November 2010\n\n EVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Demonstrates ability to interpret job requirements\n1.2. Demonstrates ability to install line equipment and devices\n1.3. Demonstrates ability to connect line equipment and devices to\ndistribution line\n2. Underpinning\nknowledge and\nattitude\n\n2.1 Basic electricity\n2.2 Basic distribution line construction works\n2.3 Occupational safety and health standards for line workers\n2.4 Hand signal communication\n2.5 Uses and specifications of distribution line tools, equipment and\nhardware\n2.6 Safety procedures for installing line equipment and devices\n2.7 Knowledge of different lifting devices\n2.8 Power distribution system standards and specifications\n3. Underpinning\nvalues and\nattitudes\nDesirable work values and attitudes includes:\n3.1 Integrity\n3.2 Team player\n3.3 Responsible\n3.4 Customer service oriented\n3.5 Quality and standard consciousness\n3.6 Environment steward\n4. Underpinning\nskills\n4.1. Identifying and following occupational health and safety standards\nfor line workers\n4.2. Proper use of distribution hand/line tools, equipment and devices\n4.3. Following safety procedures for line equipment and devices\ninstallation\n4.4. Pole climbing skills\n4.5. Knot tying skills\n4.6. Using hand signal communication\n4.7. Perform conductor riding technique\n4.8. Communication skills\n4.9. Working in a team environment\n4.10. Interpreting and following power distribution industry standards\n4.11. Proper care, handling and assembling of distribution materials and\nhardware.\n5. Resource\nimplications\nThe following resources should be available:\n5.1 PPE, tools, equipment and devices (see range of variables)\n5.2 Site or work area\n\n6. Method of\nassessment\nCompetency may be assessed through:\n6.1 Direct observation with oral questioning\n6.2 Demonstration of skills with oral questioning\n6.3 Portfolio\n6.4 Written test\n6.5 Third party report (Instructor/Trainor’s report)\n7. Context of\nassessment\n7.1. Competency maybe assessed in the workplace or in a simulated\nworkplace setting\n7.2. Assessment shall be undertaken either individually or part of team\nunder limited supervision\n\n--- PDF PAGE 41 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II Page 39\nPromulgated – November 2010\n\nUNIT OF COMPETENCY :\nINSTALL CONSUMER SERVICE CONNECTION\nFACILITY\nUNIT CODE\n:"
