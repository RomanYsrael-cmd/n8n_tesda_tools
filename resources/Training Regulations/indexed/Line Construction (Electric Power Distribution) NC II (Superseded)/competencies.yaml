n--- PDF PAGE 19 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II Page 17\nPromulgated – November 2010\n\nUNIT TITLE\n:\nCOMPLY WITH ENVIRONMENTAL PROTECTION\nPROCEDURES\n\nUNIT CODE\n:\nUTL311206\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\nimplement and monitor environmental protection policies and\nprocedures including accessing relevant information\nconcerning environmental protection regulations and\nprocedures, and implementing and monitoring procedures\nconcerning environmental hazards, related control procedures,\nenvironmental training arrangements, and required records\nand documentation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Access information\nconcerning\nenvironmental\nprotection regulations\nand procedures\n\n1.1 Relevant provisions of environmental legislation and\ncodes of practice are accurately followed\n1.2 Information on workplace environmental policies,\nprocedures and programs is stored in a readily\naccessible location and manner\n1.3 Information is accurately and clearly explained to the\nwork team and updated according to change in\nworkplace policy\n1.4 Information about the outcomes of environmental risk\nidentification and control procedures is provided to the\nappropriate personnel\n\n2. Implement and monitor\nprocedures concerning\nenvironmental hazards\n\n2.1 Existing and potential environmental hazards in the\nworkplace are identified and reported\n2.2 Identified hazards are assessed in relation to relevant\nenvironmental protection policies\n2.3 Workplace procedures for dealing with hazardous\nevents are implemented wherever necessary to ensure\nthat prompt control action is taken\n2.4 Personal protective equipment (PPE) are obtained\nand used in accordance with job requirements\n2.5 Hazardous events are investigated to identify causes,\nand control measures are implemented to prevent\nrecurrence and minimize risks of such events\n\n3. Implement and monitor\nenvironmental control\nprocedures\n\n3.1 Existing environmental protection measures are\nimplemented, monitored and reviewed\n3.2 Work procedures to protect environment are\nimplemented and adherence to them by the work group\nis monitored\n3.3 Required improvements to existing control measures\nare identified, including required resources for\nimplementation, and reported to appropriate personnel\n\n--- PDF PAGE 20 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II Page 18\nPromulgated – November 2010\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 environment\n\nEnvironment may include:\n1.1\nindoor\n1.2\noutdoor\n1.3\nmarine\n1.4\natmospheric\n2 Information\nInformation/documents may include:\n2.1\nWorkplace procedures and practices related to\nenvironmental protection, including all\nfinancial, operating and customer service\npolicies and procedures\n2.2\nOHS and environmental protection regulations\n2.3\nWorkplace housekeeping procedures and\npolicies\n2.4\nCode of practice for environmental protection\n2.5\nMaterial safety data sheets\n2.6\nPolicies and procedures for entry and work in\nconfined spaces\n2.7\nManufacturer’s instructions concerning the use\nand servicing of equipment\n2.8\nEmergency procedures\n2.9\nRegulations and policies concerning noise,\nwaste disposal/reprocessing, handling of\ndangerous goods/hazardous substances and\nother environmental protection issues\n2.10 Standards and certification requirements\n2.11 Quality assurance procedures\n3 Appropriate personnel\nAppropriate personnel may include:\n3.1\nWorkplace personnel including supervisors\nand management\n3.2\nSite visitors\n3.3\nContractors\n3.4\nOfficial representatives\n4 Environmental hazards\n4.1\nOils and lubricants\n4.2\nExhaust fumes\n4.3\nGas\n4.4\nSmoke\n4.5\nChemicals and detergents\n4.6\nRubbish\n4.7\nNoise\n4.8\nwastes\n\n--- PDF PAGE 21 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II Page 19\nPromulgated – November 2010\n\n5 Workplace procedures for\ndealing with hazardous\nevents\nProcedures may include:\n5.1\nInspection and housekeeping\n5.2\nMaintenance including plant and equipment\n5.3\nPurchasing\n5.4\nEvacuation\n5.5\nHazardous substance containment\n5.6\nOperational instruction\n5.7\nEnvironmental information including incident\nand management practices\n5.8\nSpecific hazardous materials policies and\nprocedures\n5.9\nRisk assessment and control\n5.10 First aid\n6 Personal protective\nequipment (PPE)\nPPE may include:\n6.1\nSafety hat\n6.2\nRain suits\n6.3\nRubber boots\n6.4\nWork gloves\n6.5\nGoggles/Eye protector\n6.6\nLineman boots\n6.7\nWorking clothes\n\n--- PDF PAGE 22 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II Page 20\nPromulgated – November 2010\n\nEVIDENCE GUIDE\n\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Identified and monitored environmental hazards in the workplace\n1.2 Implemented effective procedures for dealing with hazardous events\n1.3 Monitored workplace adherence to environmental practices\n1.4 Communicated effectively with the team members\n2. Underpinning\nknowledge and\nattitude\n\n2.1 Relevant envi