        "source_text": "--- PDF PAGE 41 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II                                        Page 39 \nPromulgated – November 2010 \n \nUNIT OF COMPETENCY : \nINSTALL CONSUMER SERVICE CONNECTION \nFACILITY \nUNIT CODE \n:    UTL724605 \nDESCRIPTOR \n: \nThis unit covers the outcomes required for installing \nconsumer service connection facility. The scope of this unit \ncovers installing service drop and KWH meter. This \ninvolves working with a team. \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized Bold terms are elaborated in the range of variables) \n1. Plan and prepare \nfor work \n \n1.1 Work instruction is secured and interpreted according to \njob requirements \n1.2 Relevant occupational health and safety requirements \nare identified following job specifications \n1.3 Necessary tools, hardware, equipment and devices \nneeded for the work are identified, requested and acquired \nin accordance with construction specifications \n1.4 Personal protective equipment (PPE) are obtained \nfollowing job requirements \n \n2. Install Service \nDrop \n2.1 Approved electrical/house wiring permit is secured. \n2.2 Service drop accessories are installed according \nconstruction standards and requirements \n2.3 Service drop cables are installed according construction \nstandards and requirements \n2.4 Service drop clearance is checked in conformity to road \nvertical clearance. \n3. Install KWH \nmeter \n3.1 Meter base is installed, if necessary, according to \nconstruction standards and requirements \n3.2 KWH meter is installed according to construction \nstandards and requirements \n3.3 Customer is advised for completion of work and verify \navailability of electric power \n3.4 Housekeeping procedure is performed in line with \nestablished procedure\n\n--- PDF PAGE 42 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II                                        Page 40 \nPromulgated – November 2010 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Occupational \nhealth and safety \nrequirements \nMay include but not limited to: \n1.1 \nPersonal protective equipment (PPE) \n1.1.1. Hard hat/Safety hat \n1.1.2. Goggles/Eye protector \n1.1.3. Work gloves \n1.1.4. Lineman boots \n1.1.5. Working clothes \n1.1.6. Rubber boots \n1.1.7. Rain suits \n1.2 \nPole climbing equipment  \n1.2.1. Safety strap/cord \n1.2.2. Body belt \n1.2.3. pair of climbers \n2. Tools, hardware, \nequipment and \ndevices \nMay include but not limited to: \n2.1 \nTools \n2.1.1. Rope/Hand line \n2.1.2. Adjustable wrench or lineman wrench \n2.1.3. Pliers \n2.1.4. Ball peen hammer \n2.1.5. Measuring rule (wood) \n2.1.6. Screw driver \n2.1.7. Auger bit \n2.1.8. Electric tape \n2.1.9. Wire skinning knife \n2.1.10. Compression/crimping tool \n2.2 \nEquipment and devices \n2.2.1. Ladder  \n2.2.2. Pole climbing equipment \n2.2.3. KWH meter \n2.2.4. Multi-tester (amps-volt) \n2.3 \nHardware \n2.3.1 Service drop cables \n2.3.2 Service connection accessories \n3. Service drop \naccessories \nMay include: \n3.1 \nOval eye bolt/nut  \n3.2 \nService swinging clevis \n3.3 \nSpool insulator \n3.4 \nService grip / Dead-end loop clamp \n3.5 \nService drop wire \n3.6 \nService wire grip \n3.7 \nStrain/Screw insulators \n3.8 \nCompression connector/ Clamps \n4. Service drop \ncable \nMay include: \n4.1 \nTriplex aluminum/copper cable \n4.2 \nDuplex aluminum/copper cable \n5. KWH meter \nMay include: \n5.1 \nSingle phase \n5.2 \nSocket type or button connected\n\n--- PDF PAGE 43 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II                                        Page 41 \nPromulgated – November 2010 \n \n \n     EVIDENCE GUIDE \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1. Demonstrates ability to interpret job requirements  \n1.2. Demonstrates ability to install service drop   \n1.3. Demonstrates ability to install KWH meter \n \n2. Underpinning \nknowledge  \n \n \n \n2.1 Basic distribution line construction works  \n2.2 Basic electricity  \n2.3 Occupational safety and health standards for line workers \n2.4 Uses and specifications of tools, equipment and hardware  \n2.5 Safety procedures for proper installation of service drop and KWH \nmeter  \n2.6 Power distribution system standards and specifications \n3. Underpinning \nvalues and \nattitudes \nDesirable work values and attitudes includes: \n3.1 Integrity \n3.2 Team player \n3.3 Responsible \n3.4 Customer service oriented \n3.5 Quality and standard consciousness \n3.6 Environment steward \n \n4. Underpinning \nskills \n4.1. Identifying and following occupational health and safety standards \nfor line workers \n4.2. Using tools, equipment and devices \n4.3. Following safety procedures for service drop and KWH meter \ninstallation \n4.4. Pole climbing skills \n4.5. Communication skills  \n4.6. Working in a team environment \n4.7. Interpreting and following power distribution industry standards \n \n5. Resource \nimplications \nThe following resources should be available: \n5.1. PPE, tools, equipment and devices (see range of variables) \n5.2. Site or work area \n \n6. Method of \nassessment \nCompetency may be assessed through: \n6.1. Direct observation with oral questioning \n6.2. Demonstration of skills with oral questioning \n6.3. Portfolio \n6.4. Written test \n6.5. Third party report (Instructor/Trainor’s report) \n \n7. Context of \nassessment \n7.1. Competency maybe assessed in the workplace or in a simulated \nworkplace setting \n7.2. Assessment shall be undertaken either individually or part of team \nunder limited supervision\n",
