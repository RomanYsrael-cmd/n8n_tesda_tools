 following resources MUST be provided: \n4.1. \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n 4.2.    Materials relevant to the proposed activity or tasks \n \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1. \nObservation of the individual member in relation to the work \nactivities of the group \n5.2. \nObservation of simulation and/ or role play involving the \nparticipation of the individual member to the attainment of \norganizational goals \n \n6. Context for \nAssessment \n6.1. \nCompetency may be assessed in the workplace or in a \nsimulated workplace setting \n6.2. \nAssessment shall be observed while tasks are being \nundertaken whether individually or in a group\n",
