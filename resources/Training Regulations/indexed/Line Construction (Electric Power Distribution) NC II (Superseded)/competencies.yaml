        "source_title": "ERECT DISTRIBUTION LINE POLES",
        "source_text": "--- PDF PAGE 29 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II                                        Page 27 \nPromulgated – November 2010 \n \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY : \nERECT DISTRIBUTION LINE POLES  \nUNIT CODE \n:     UTL724603 \nDESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude required \nto erect distribution line poles. This unit includes \ncompetencies for installing new distribution line pole as \nwell as transporting pole from stockyard to jobsite, \nperforming pole spotting, digging, grounding and pole \nsetting/erection.  This involves working with a team. \nELEMENT \nPERFORMANCE CRITERIA \n(Italicized Bold terms are elaborated in the range of variables) \n1. Plan and prepare \nfor work \n1.1 Work instructions are secured and interpreted according \nto job requirements \n1.2 Relevant occupational health and safety requirements \nare identified following job specifications \n1.3 Relevant distribution line tools, equipment and \nhardware/materials are identified, requested and \nacquired in accordance with construction specifications \n1.4 Personal protective equipment (PPE) are obtained \nfollowing job requirements \n2. Perform pole \nloading, hauling and  \nspotting  \n2.1 Distribution line equipment are used in line with job \nrequirements \n2.2 Personal protective equipment (PPE) are used following  \n        job requirements \n2.3 Loading and unloading procedure for poles is performed \nfollowing safety requirements  \n2.4 Poles hauling and pole spotting (unloading) is performed \nbased on staking sheet.  \n3. Perform pole \ndigging, grounding \nand setting/erection  \n3.1 Occupational and health safety (OHS) standards are \ncomplied with during erection/set-up of distribution poles. \n3.2 Distribution line tools, equipment and hardware are used \nin line with construction specifications \n3.3 Personal protective equipment (PPE) are used following  \n        job requirements \n3.4 Pole digging is performed following established depth \nrequirements \n3.5 Where necessary, pole grounding is installed in \naccordance with line construction specifications. \n3.6 Pole setting/erection procedure is performed in line with \njob requirements \n3.7 Where necessary, guy wires are installed for corner, angle \nand dead-end poles. \n3.8 Good housekeeping is performed following established \nprocedure.\n\n--- PDF PAGE 30 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II                                        Page 28 \nPromulgated – November 2010 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work instructions  \nMay include but are not limited to: \n1.1 job order \n1.2 Staking sheets \n2. Occupational health \nand safety \nrequirements \nMay include but are not limited to: \n2.1 Personal protective equipment (PPE) \n2.1.1  Hard hat/safety hat \n2.1.2  Goggles/eye protector \n2.1.3  Work gloves \n2.1.4  Lineman boots \n2.1.5  Working clothes \n2.1.6  Rain suits \n2.1.7  Rubber boots \n2.2  Pole climbing equipment  \n2.2.1. Safety strap/cord \n2.2.2. Body belt \n2.2.3. pair of climbers \n3. Distribution line tools, \nequipment and \nhardware/materials \nMay include but are not limited to: \n3.1 Tools \n3.1.1. Ropes/Bull line/Sling \n3.1.2. Cant hook  \n3.1.3. Digging bar/ Tamping bar \n3.1.4. Pole pike \n3.1.5. Pole jenny  \n3.1.6. Straight shovel (long and short) \n3.1.7. Pole hole digger \n3.1.8. Spoon shovel \n3.1.9. Butting board \n3.1.10. Ball peen hammer \n3.1.11. Ruler (wood, folding) \n3.1.12. Pliers \n3.1.13. Auger bit \n3.1.14. Working sign boards \n3.1.15. Bolt cutter \n3.2 Equipment \n3.2.1. Trailer \n3.2.2. Line truck \n3.2.3. Boom truck or derrick truck/Auger truck \n3.2.4. Wench \n3.2.5. Binder \n3.2.6. Ratchet \n3.3 Hardware/materials \n3.3.1. Ground wire \n3.3.2. Ground wire staple \n3.3.3. Butt plate/Ground rods \n3.3.4. Pole \n3.3.4.1. Wood pole (creosoted & tanalized) \n3.3.4.2. Steel pole \n3.3.4.3. Concrete pole\n\n--- PDF PAGE 31 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II                                        Page 29 \nPromulgated – November 2010 \n \n \n4. safety requirements \nMay include but are not limited to: \n4.1 Length and class of the pole is established. \n4.2 Poles are securely fastened. \n4.3 Warning devices are installed. \n4.4 Appropriate PPEs are used. \n \n5. line construction \nspecifications \n5.1 specifications for 13.2 / 7.6 KV line construction \n5.2 specifications for 34.5 / 20 KV line construction \n5.3 specifications for other distribution utilities \n \n6. Pole setting/ erection \nprocedure \n6.1 Determine depth of hole \n6.2 Determine pole facing\n\n--- PDF PAGE 32 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II                                        Page 30 \nPromulgated – November 2010 \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1. Demonstrates knowledge  of different pole erection methods \n1.2. Demonstrates ability to identify and follow occupational health and \nsafety standards for line workers \n1.3 Demonstrates ability to identify and use of distribution line tools, \nequipment and hardware \n1.4 Demonstrates ability to perform pole loading, pole hauling, pole \nspotting, pole digging, pole grounding and pole setting/erection \n1.5 Demonstrates ability to communicate and work in a team environment \n \n2. Underpinning \nknowledge  \n \n \n \n \n2.1 Basic works on distribution line construction  \n2.2 Occupational safety and health standards for line workers \n2.3 Uses and specifications of distribution line tools, equipment and \nhardware  \n2.4 Safety procedures for pole hauling, pole hole digging and pole \nsetting/erection  \n2.5 Different pole erection methods  \n2.6 Power distribution industry standards and specifications \n3. Underpinning \nvalues and \nattitudes \nDesirable work values and attitudes includes: \n3.1 Integrity \n3.2 Team player \n3.3 Responsible \n3.4 Customer service oriented \n3.5 Quality and standard consciousness \n3.6 Environment steward \n \n4. Underpinning \nskills \n4.1 Driving skills \n4.2 Identifying and following occupational health and safety standards for \nline workers \n4.3 Using distribution hand/line tools, equipment and hardware \n4.4 Following safety procedures for pole hauling, pole hole digging and pole \nsetting/erection \n4.5 Communication skills  \n4.6 Working in a team environment \n4.7 Interpreting and following power distribution industry standards \n \n5. Resource \nimplications \nThe following resources should be available: \n5.1  Tools, equipment, hardware and PPE (see range of variables) \n5.2  Site or work area \n5.3  timber hardware \n5.4  Line truck \n \n6. Method of \nassessment \nCompetency may be assessed through: \n6.1  Direct observation with oral questioning \n6.2  Demonstration of skills with oral questioning \n6.3  Portfolio \n6.4  Written test \n6.5  Third party report (Instructor/Trainor’s report) \n \n7. Context of \nassessment \n7.1 Competency maybe assessed in the workplace or in a simulated \nworkplace setting \n7.2 Assessment shall be undertaken either individually or part of team under \nlimited supervision\n",
