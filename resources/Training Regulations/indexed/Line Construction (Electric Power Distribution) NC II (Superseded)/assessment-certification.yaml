  "source_text": "SECTION 4: NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Line Construction (Electric Power\nDistribution) NC II, the candidate must demonstrate competency in all the units\nlisted in Section 1. Successful candidates shall be awarded a National\nCertificate II signed by the TESDA Director General.\n\n4.2\nThe qualification of Line Construction (Electric Power Distribution) NC II can be\nattained through:\n\n4.2.1. Demonstration of competence through project-type assessment covering\nthe core units of competency of the qualification:\n\n4.2.1.1.\nPerforming basic power distribution line construction works\n• Erect distribution line poles\n• Climb pole and install pole assembly/conductors\n• Install distribution line equipment and devices\n• Install consumer service connection facility\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1.\nGraduate of formal, non-formal, and informal including enterprise-\nbased training programs.\n\n4.4.2.\nExperienced workers (wage employed or self employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET and Certification System (PTQCS)”.\n\n--- PDF PAGE 53 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – ELECTRIC POWER DISTRIBUTION LINE CONSTRUCTION NC II Page 51\nPromulgated – November 2010\n\n"
