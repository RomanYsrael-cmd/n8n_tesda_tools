    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for PLASTIC MACHINE OPERATION NC III.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: PLASTIC MACHINE OPERATION\n\nNC Level NC II\n\nNominal Training Duration:\n20 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n105 Hours (Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive manufacturing in accordance with industry standards. It\ncovers competencies such as: Change equipment dies; Prepare and start equipment for\nproduction and Produce injection molded products. It also include competency to produce\nblow molded products. Likewise the person involved in this qualification is in-charge of\noverall equipment set-up and readiness-check for production operation.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities among\nmembers.\n2.3 Set performance expectation\nfor team members.\n1.3 Supervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n1.1 Identify relevant information in\nplanning negotiations\n1.2 Participate in negotiations\n1.3 Document areas for agreement\n• Direct\nobservation\n• Simulation/rol\ne playing\n•\nCase studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n•\nCase studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 55 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n51\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/solution\n5.3\nAnalyze results\n• Direct\nobservation\n• Simulation/rol\ne playing\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate technology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/rol\ne playing\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2.Interpret drawings\n1.3.Apply information in the\ndrawings & specifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n2. Perform\nMensuration and\nCalculation\n2.1. Select measuring instrument\nand\n2.2 Carry out measurement and\ncalculations.\n2.3. Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Simulation\n• Exercises\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n3.1 Identify/accessed manuals\nand interpret data and\nspecification\n3.2 Apply information accessed in\nmanual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nLearning\n\n• Written test\n• Direct\nobservation\n• Project\nmethod\n•Interview\n5. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and work\narea\n4.2 Store/arrange tools and shop\nequipment\n4.3 Dispose wastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Simulation\n• Written test\n• Direct\nobservation\n• Demonstration\n• Interview\n\n--- PDF PAGE 56 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n52\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Change\nequipment dies\n1.1\nPrepare to change dies\n1.2 Change dies\n1.3 Test fitting of dies\n1.4\nRespond to problems\n•Lecture/\nDemonstration\n• Discussion\n•Observation w/\nquestioning\n• Written\n•Portfolio\n2. Prepare and start\n equipment for\n production\n2.1\nPerform pre-start checks\n2.2 Carry out pre-start\noperations\n2.3 Start machine and hand over\nto operator\n•Lecture/\nDemonstration\n• Discussion\n\n•Observation w/\nquestioning\n• Written\n• Portfolio\n3. Produce\ninjection molded\nproducts\n3.1 Plan own work requirements\n3.2 Check injection molding\nprocess setup\n3.3 Operate and make\nadjustments as required to\nthe injection molding process\n3.4 Respond to problems\n•\nLecture/\nDemonstration\n• Discussion\n\n•Observation w/\nquestioning\n• Written\n• Portfolio\n4. Produce blow\nmolded products\n4.1 Plan own work requirements\n4.2 Set up and conduct pre start\nchecks\n4.3 Operate and make\nadjustments as required to\nthe blow molding process\n4.4 Respond to problems\n•Lecture/\nDemonstration\n• Discussion\n•Observation w/\nquestioning\n• Written\n• Portfolio\n\n--- PDF PAGE 57 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n53\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, or audio, video or\ncomputer technologies.\n\n--- PDF PAGE 58 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n54\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• Must possess the Plastic Machine Operation National Certificate II\n• can communicate both orally and in writing;\n• physically and mentally fit; and\n• with experience in basic machining\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\nPLASTIC MACHINE OPERATIONS NC III\n\nRecommended list of tools, equipment and materials for the training of 20\ntrainees for PLASTIC MACHINE OPERATION NC III\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n10 sets\nKnives\nFiles\nScrapers\nBand saw, Hand\nsaw\n5 sets\nElectric and/or powered\nrouters, saw, drills\ndrivers and sanders\n1 set\nWorkplace procedure\nWork instruction\nTemporary instruction\n\n1 set\nHoist/jigs/lifting\nequipment\n1 lot\nOffice supplies\n\n2 sets\nHand carts and trolley\n\n10 sets\nHand tools\n• Screw drivers\n• Pliers\n• Wrenches\n• Sockets and\ndrivers\n1 set\nBottom blow, top blow,\nneedle blow, tail to tail\nblow, parison pre-blow\nand pre-squeeze,\nparison stretching and\nparison orientation type\nmachines\n20\nsets\nPPE\n•\nGloves\n•\nRespiratory mask\n•\nFace shield\n•\nSafety shoes\n\n1 set\nDie\n\n1 set\nChillers/cooling towers\n\n1 set\nDie heating equipment\n\n1 set\nHopper driers, mixing\nhoppers, dehumidifying\ndriers\n\n1 set\nAir compressors\n\n1 set\nDosing machines\nColor blending\nequipment and\nconveyors\n\n1 set\nInjection unit\n\n1 set\nBarrel and screw\nplastification unit\n\n1 set\nMaterial loading\nequipment\n\n1 set\nElectrical, pneumatic,\n\n--- PDF PAGE 59 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n55\nmechanical\nElectromechanical and\nhydraulic injection\nmoulding machines\nand components such\nas base, frame, feed\nhoppers and material\nsupply mechanisms\n\n1 set\nMeasuring equipment\n\n2 sets\nBuffs and polishers\n\n3.5 TRAINING FACILITIES\nPLASTIC MACHINE OPERATION NC III\n\nThe automotive workshop must be made of reinforced concrete or steel\nstructure. The size must be suited on the requirements of the competencies. The class\nsize of 25 students/trainees is reserved for the lecture room and the practical\ndemonstration area for carrying out plastic machine operation training. Most of the\nlearning activities such as plastic machine operation are performed in the workshop.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n• Building (permanent)\n12.00 x 32.00\n-\n384.00\n• Student/Trainee\nWorking Space\n2.50 x 2.50 per\nstudent/trainee\n6.25 per student\n156.25\n• Contextual Learning\nLaboratory\n4.00 x 5.00\n20.00\n20.00\n•\nLecture Room\n4.00 x 7.00\n28.00\n28.00\n• Learning Resource\nCenter\n4.00 x 5.00\n20.00\n20.00\n• Facilities/Equipment/\nCirculation Area\n-\n-\n159.75\n\n--- PDF PAGE 60 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n56\n3.6 TRAINERS’ QUALIFICATION\n\nAUTOMOTIVE/LAND TRANSPORT SECTOR\n\nPLASTIC MACHINE OPERATION NC III\nTRAINER QUALIFICATION (TQ III)\n•\nMust be a holder of PLASTIC MACHINE OPERATION NC III\n• Must have undergone training on Training Methodology II (TM II) 1\n• Must be computer literate\n• Must be physically and mentally fit\n• Must have at least 2 years job/industry experience2\n•\nMust be a civil-service eligible or holder of appropriate professional license issued\nby the Professional Regulatory Commission (for government positions only)\n\n1\nThis shall be changed to “:Must be a holder of Trainer Qualification Level II (TQII) or equivalent”\nupon promulgation by the TESDA Board of the TQ/AQ training regulations\n2\nOptional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 61 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n57"
  },
