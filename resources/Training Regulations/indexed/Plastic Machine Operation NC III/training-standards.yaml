    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: PLASTIC MACHINE OPERATION\n\nNC Level NC II\n\nNominal Training Duration:\n20 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n105 Hours (Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive manufacturing in accordance with industry standards. It\ncovers competencies such as: Change equipment dies; Prepare and start equipment for\nproduction and Produce injection molded products. It also include competency to produce\nblow molded products. Likewise the person involved in this qualification is in-charge of\noverall equipment set-up and readiness-check for production operation.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities among\nmembers.\n2.3 Set performance expectation\nfor team members.\n1.3 Supervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n1.1 Identify relevant information in\nplanning negotiations\n1.2 Participate in negotiations\n1.3 Document areas for agreement\n• Direct\nobservation\n• Simulation/rol\ne playing\n•\nCase studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n•\nCase studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 55 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n51\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/solution\n5.3\nAnalyze results\n• Direct\nobservation\n• Simulation/rol\ne playing\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate technology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/rol\ne playing\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Read, Interpret\nand Apply\nEngineering\nDrawings\n1.1 Identify and access\nengineering drawings/\nspecification\n1.2.Interpret drawings\n1.3.Apply information in the\ndrawings & specifications\n1.4 Store drawings\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n2. Perform\nMensuration and\nCalculation\n2.1. Select measuring instrument\nand\n2.2 Carry out measurement and\ncalculations.\n2.3. Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Simulation\n• Exercises\n\n• Written test\n• Oral\nquestioning\n• Direct\nobservation\n3. Read, Interpret\nand Apply\nSpecifications\nand Manual\n3.1 Identify/accessed manuals\nand interpret data and\nspecification\n3.2 Apply information accessed in\nmanual\n3.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nLearning\n\n• Written test\n• Direct\nobservation\n• Project\nmethod\n•Interview\n5. Perform Shop\nMaintenance\n\n4.1 Inspect/clean tools and work\narea\n4.2 Store/arrange tools and shop\nequipment\n4.3 Dispose wastes/used\nlubricants\n4.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self paced\n(modular)\n• Simulation\n• Written test\n• Direct\nobservation\n• Demonstration\n• Interview\n\n--- PDF PAGE 56 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n52\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Change\nequipment dies\n1.1\nPrepare to change dies\n1.2 Change dies\n1.3 Test fitting of dies\n1.4\nRespond to problems\n•Lecture/\nDemonstration\n• Discussion\n•Observation w/\nquestioning\n• Written\n•Portfolio\n2. Prepare and start\n equipment for\n production\n2.1\nPerform pre-start checks\n2.2 Carry out pre-start\noperations\n2.3 Start machine and hand over\nto operator\n•Lecture/\nDemonstration\n• Discussion\n\n•Observation w/\nquestioning\n• Written\n• Portfolio\n3. Produce\ninjection molded\nproducts\n3.1 Plan own work requirements\n3.2 Check injection molding\nprocess setup\n3.3 Operate and make\nadjustments as required to\nthe injection molding process\n3.4 Respond to problems\n•\nLecture/\nDemonstration\n• Discussion\n\n•Observation w/\nquestioning\n• Written\n• Portfolio\n4. Produce blow\nmolded products\n4.1 Plan own work requirements\n4.2 Set up and conduct pre start\nchecks\n4.3 Operate and make\nadjustments as required to\nthe blow molding process\n4.4 Respond to problems\n•Lecture/\nDemonstration\n• Discussion\n•Observation w/\nquestioning\n• Written\n• Portfolio\n\n--- PDF PAGE 57 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n53"
