elivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, or audio, video or\ncomputer technologies.\n\n--- PDF PAGE 58 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n54\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• Must possess the Plastic Machine Operation National Certificate II\n• can communicate both orally and in writing;\n• physically and mentally fit; and\n• with experience in basic machining\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\nPLASTIC MACHINE OPERATIONS NC III\n\nRecommended list of tools, equipment and materials for the training of 20\ntrainees for PLASTIC MACHINE OPERATION NC III\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n10 sets\nKnives\nFiles\nScrapers\nBand saw, Hand\nsaw\n5 sets\nElectric and/or powered\nrouters, saw, drills\ndrivers and sanders\n1 set\nWorkplace procedure\nWork instruction\nTemporary instruction\n\n1 set\nHoist/jigs/lifting\nequipment\n1 lot\nOffice supplies\n\n2 sets\nHand carts and trolley\n\n10 sets\nHand tools\n• Screw drivers\n• Pliers\n• Wrenches\n• Sockets and\ndrivers\n1 set\nBottom blow, top blow,\nneedle blow, tail to tail\nblow, parison pre-blow\nand pre-squeeze,\nparison stretching and\nparison orientation type\nmachines\n20\nsets\nPPE\n•\nGloves\n•\nRespiratory mask\n•\nFace shield\n•\nSafety shoes\n\n1 set\nDie\n\n1 set\nChillers/cooling towers\n\n1 set\nDie heating equipment\n\n1 set\nHopper driers, mixing\nhoppers, dehumidifying\ndriers\n\n1 set\nAir compressors\n\n1 set\nDosing machines\nColor blending\nequipment and\nconveyors\n\n1 set\nInjection unit\n\n1 set\nBarrel and screw\nplastification unit\n\n1 set\nMaterial loading\nequipment\n\n1 set\nElectrical, pneumatic,\n\n--- PDF PAGE 59 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n55\nmechanical\nElectromechanical and\nhydraulic injection\nmoulding machines\nand components such\nas base, frame, feed\nhoppers and material\nsupply mechanisms\n\n1 set\nMeasuring equipment\n\n2 sets\nBuffs and polishers\n\n3.5 TRAINING FACILITIES\nPLASTIC MACHINE OPERATION NC III\n\nThe automotive workshop must be made of reinforced concrete or steel\nstructure. The size must be suited on the requirements of the competencies. The class\nsize of 25 students/trainees is reserved for the lecture room and the practical\ndemonstration area for carrying out plastic machine operation training. Most of the\nlearning activities such as plastic machine operation are performed in the workshop.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n• Building (permanent)\n12.00 x 32.00\n-\n384.00\n• Student/Trainee\nWorking Space\n2.50 x 2.50 per\nstudent/trainee\n6.25 per student\n156.25\n• Contextual Learning\nLaboratory\n4.00 x 5.00\n20.00\n20.00\n•\nLecture Room\n4.00 x 7.00\n28.00\n28.00\n• Learning Resource\nCenter\n4.00 x 5.00\n20.00\n20.00\n• Facilities/Equipment/\nCirculation Area\n-\n-\n159.75\n\n--- PDF PAGE 60 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n56\n3.6 TRAINERS’ QUALIFICATION\n\nAUTOMOTIVE/LAND TRANSPORT SECTOR\n\nPLASTIC MACHINE OPERATION NC III\nTRAINER QUALIFICATION (TQ III)\n•\nMust be a holder of PLASTIC MACHINE OPERATION NC III\n• Must have undergone training on Training Methodology II (TM II) 1\n• Must be computer literate\n• Must be physically and mentally fit\n• Must have at least 2 years job/industry experience2\n•\nMust be a civil-service eligible or holder of appropriate professional license issued\nby the Professional Regulatory Commission (for government positions only)\n\n1\nThis shall be changed to “:Must be a holder of Trainer Qualification Level II (TQII) or equivalent”\nupon promulgation by the TESDA Board of the TQ/AQ training regulations\n2\nOptional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 61 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n57"
