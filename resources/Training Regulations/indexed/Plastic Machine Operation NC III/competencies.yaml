        "source_title": "READ, INTERPRET AND APPLY ENGINEERING DRAWINGS.",
        "source_text": "--- PDF PAGE 25 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n21\nCOMMON COMPETENCIES \n(AUTOMOTIVE MANUFACTURING-PARTS MANUFACTURING) \n \nUNIT TITLE:  READ, INTERPRET AND APPLY ENGINEERING DRAWINGS. \n \nUNIT CODE: ALT742201 \n \nUNIT DESCRIPTOR:  This unit deals with identifying, interpreting and applying \nspecification from engineering blue prints or drawings that provides \nthe measurements of the product and pattern that is to be produced. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n1. Identify and \naccess   \nengineering  \ndrawings/   \nspecification\n \n1.1 Appropriate engineering drawings are identified and accessed as \nper job requirements. \n1.2 Version and date of drawing is checked to ensure correct \nspecification and procedure are identified. \n \n2.  Interpret drawings \n \n2.1 Relevant dimensions and sections of the drawings/ specifications \nare located in relation to the work to be conducted \n2.2 Information in the manual are interpreted in accordance to industry \npractices\n \n3 Apply information \nin the drawings & \nspecifications \n \n \n3.1 Engineering drawing is interpreted according to job requirements \n3.2 Work steps are correctly identified in accordance with the \nspecifications in the drawings. \n3.3 Dimensional data and shape are applied according to the given task\n \n4. Store drawings \n \n4.1 The drawings and specification are stored properly to  \n      ensure prevention of damage, ready access and  \n      updating of information when required in accordance  \n      with company requirements\n\n--- PDF PAGE 26 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n22\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Engineering drawings \nKinds of drawings: \n1.1 Casting drawing \n1.2 Machining drawing \n1.3 Project plan \n1.4 Technical drawing\n2. Data \nData includes but not limited to \n2.1 Material specifications \n2.2 Process specifications \n2.3 Special instructions \n2.4 Machining locating points \n2.5 Clamping points \n2.6 Amount of draft \n2.7 Surface finish\n\n--- PDF PAGE 27 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n23\nEVIDENCE GUIDE \n \n \n1.Critical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 Identified and accessed drawings/specification \n1.2 Interpreted drawings \n1.3 Applied information in drawings \n1.4 Stored drawings \n \n2.  Underpinning  \nknowledge and \nattitudes \n \n2.1 Types of drawings used in automotive manufacturing industry \n2.2 Identification of symbols used in the drawings \n2.3 Identification of units of measurements \n2.4 Unit conversion \n2.5 Attention to details, Perseverance, Honesty\n \n3. Underpinning \nskills \n \n3.1 Reading and comprehension skills required to identify and \ninterpret engineering drawings and specifications \n3.2 Accessing information and data\n \n4. Resource \nimplications \n \nThe following resources MUST be provided: \n4.1 All drawings/engineering specifications relative to automotive \nmanufacturing \n4.2 Job order, requisitions \n4.3 Product sample\n \n5 Method of \nassessment \nCompetency MUST be assessed through: \n5.1 Observation with questioning \n5.2 Interview  \n \n6 Context of \nassessment  \n \n \n6.1 Assessment must be undertaken in accordance with  \n      the endorsed TESDA assessment guidelines \n6.2 Assessment may be conducted in the workplace or a  \n       simulated environment.\n",
