        "source_title": "PRODUCE INJECTION MOLDED PRODUCTS",
        "source_text": "--- PDF PAGE 44 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n40\n \nUNIT OF COMPETENCY:    PRODUCE INJECTION MOLDED PRODUCTS \nUNIT CODE \n    :    ALT823310 \nUNIT DESCRIPTOR        : This competency covers the operation and adjustment of \ninjection molding processes and the solving of non-routine \nproblems. It does not cover die setting. \nThis competency is typically performed by operators \ndemonstrating some relevant theoretical knowledge and using \na range of well developed skills requiring some discretion and \njudgment. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Plan own work \nrequirements \n1.1 Tools and equipment and processes used for production \nprocess and upstream and downstream operations from \nproduction plan or request are identified in accordance with \nworkplace procedures \n1.2 Materials required are identified including additives as per \nproduction requirements \n1.3 Hazards are recognized and appropriate hazard control / \nminimization methods are followed \n1.4 Emergency stops, guards and controls are identified and checked \nin accordance with workplace procedures \n1.5 Requirements for materials, quality, production and equipment \nchecks are identified in accordance with workplace procedures \n1.6 Materials, waste management and housekeeping needs are \nidentified in accordance with workplace procedures  \n2. Check injection \nmolding process \nsetup \n2.1 Equipment requirements are determined in accordance with \nworkplace  \n2.2 Process is set to specifications as required \n2.3 Injection molding equipment settings and adjustments are \nchecked as required \n2.4 Materials are checked as per job requirements \n2.5 Nonconforming materials are discarded, or adjustments are made \nto the process   \n2.6 Date, batch and materials markings are set up to specifications, \nas required \n2.7 Other pre-start checks are completed in accordance with \nprocedures. \n3. Operate and \nmake \nadjustments as \nrequired to the \ninjection molding \nprocess \n3.1 Injection molding equipment is operated, noting key variables in \naccordance with procedures. \n3.2 Controls/displays/terminals for production/process data are \nmonitor in accordance with procedures. \n3.3 Product/process quality is monitored in accordance with \nprocedures \n3.4 Adjustments are made to remedy faults and nonconformity to\n\n--- PDF PAGE 45 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n41\nstandard as required \n3.5 Continuity of process is maintained in accordance with production \nrequirements  \n3.6 Scrap/trimming and other materials are collected and \nreprocessed/ discarded in accordance with procedures \n3.7 Equipment is cleaned, adjusted and lubricated as required \n3.8 Equipment is paused or stopped in an emergency, following \nworkplace and emergency procedures. \n4. Respond to \nproblems  \n4.1 Possible routine and non-routine problems in the equipment, \nmaterials or process identified in accordance with procedures \n4.2 Problems needing action are determined in accordance with \nprocedures \n4.3 Possible fault causes are determine in accordance with \nprocedures \n4.4 Problems are rectified using appropriate solutions within area of \nresponsibility \n4.5 Problems outside area of responsibility are reported to \ndesignated person.\n\n--- PDF PAGE 46 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n42\n \n      RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools and Equipment  \n1.1 Electrical, pneumatic, mechanical, electromechanical \nand hydraulic injection molding machines and \ncomponents such as base, frame, feed hoppers and \nmaterial supply mechanisms, barrel and screw \nplastification unit, injection units, die/mould tool \n1.2 Additional equipment including chillers/cooling towers, \ndie heating equipment, hopper driers, mixing hoppers, \ndehumidifying driers, air compressors, dosing \nmachines, color blending equipment and conveyors \nwhere they are integral to the operation of the injection \nmolder \n1.3 Hand tools used in the injection molding process \n1.4 Material loading equipment used for loading of raw \nmaterials like belt or steel conveyor \n1.5 Relevant personal protective equipment like gloves, \nsafety shoes, hard hut, face shield \n2. Hazards \nTypical hazards include: \n2.1 \nSpills \n2.2 \nDusts/vapors \n2.3 \nHazardous materials \n2.4 \nManual handling hazards \n2.5\nKnife hazards\n3. Procedures \n3.1 \nWorkplace procedures   \n3.2 \nWork instructions  \n3.3 \nInstructions and relevant industry and government \ncodes and standards\n4. Key variables \nKey variables to be monitored include: \n4.1 Operating temperature \n4.2 speed \n4.3 cycle time \n4.4 output rate \n4.5 concentration or dispersion of color \n4.6 product weight \n4.7 product wall thickness \n4.8 product integrity and general conformance to \nspecification / sample\n5. Routine and non routine \nproblems \nTypical problems may include: \n5.1 \nlack of cleaning leading to corrosion \n5.2 \nInadequate fitting \n5.3\nfine adjustments to optimize production\n\n--- PDF PAGE 47 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n43\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1  Identified critical materials properties and injection molding \nprocess characteristics in relation to the process \nrequirements and the end product \n1.2 Planned own work process within workplace procedures \nand explained the reasons for the steps in the process \n1.3 Operated and made adjustments as required to the \ninjection molding process \n1.4 Took appropriate action to observe equipment, materials \nand products for out of specification results, make \nadjustments and identified problems to be reported \n1.5  Achieved production quality and output consistently \n1.6 Anticipated problems from process observations \n1.7 Resolved problems efficiently \n1.8 Ensured the process runs consistently and smoothly\n2. Underpinning \nknowledge and \nattitudes \n \n2.1 Knowledge of materials, equipment and process sufficient \nto recognize conditions which may lead to out of \nspecification production. \n2.2 Company’s procedures and relevant regulatory \nrequirements  \n2.3 Products, materials and material characteristics \n2.4 Behavior of materials in relation to heat, pressure and time \n2.5 Quality requirements at each production stage \n2.6 Function and operating principles of injection molding \nequipment, machine components and ancillary equipment \n2.7 Impact of machine speed, temperature, pressure, time \nduring cycles on product quality and production output \n2.8 Nature of mechanical, hydraulic, pneumatic, electrical and \nelectronic principles which effect machine operation and \nproduct development \n2.9 Injection molding cycle and the importance of machine set \nup and warm up for effective processing of materials \n2.10 Safety procedures and the use of PPE in relation to \nhandling materials, equipment\n3. Underpinning skills \n3.1 Planning own work including predicting consequences and \nidentifying improvements \n3.2 Interpreting from production requests the correct selection \nand using equipment, materials, processes and \nprocedures \n3.3 Maintaining output and product quality using appropriate \ninstruments, controls, test information and readings \n3.4 Making adjustments to equipment operation to rectify \nvariations in equipment operation \n3.5 Checking injection molding machine for correct set up to job \nspecifications and implement adjustments or report \ndeviations immediately \n3.6 Starting up equipment and make appropriate adjustments \nto bring process on line \n3.7 Taking samples when required and identify product out of\n\n--- PDF PAGE 48 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n44\nspecification \n3.8 Shutting down equipment in normal or abnormal \ncircumstances \n3.9 Identifying hazards of the materials and process and   \nimplementing appropriate procedures for hazard control \n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Access to an operating plant or equipment  \n4.2 Tools, equipment and workplace relevant with the \nrequirements for the job. \n4.3 A bank of case studies/scenarios \n4.4 Supplies and consumable materials \n4.5 Engineering manuals \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 Direct Observation with questioning \n5.2 Portfolio assessment\n6. Context of \nassessment \nCompetency may be assessed individually in the actual \nworkplace or a simulated workplace environment.\n",
