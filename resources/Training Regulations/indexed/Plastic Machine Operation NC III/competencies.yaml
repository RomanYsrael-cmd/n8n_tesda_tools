  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in PLASTIC MACHINE OPERATION NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nLEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n\n:\n500311109\n\n UNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes\n\nrequired to lead in the dissemination and\n\ndiscussion of ideas, information and issues in the\n\nworkplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1 Appropriate communication method is selected\n1.2 Multiple operations involving several topics areas are\ncommunicated accordingly\n1.3 Questions are used to gain extra information\n1.4 Correct sources of information are identified\n1.5 Information is selected and organized correctly\n1.6 Verbal and written reporting is undertaken when\nrequired\n1.7\nCommunication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1 Response to workplace issues are sought\n2.2 Response to workplace issues are provided\nimmediately\n2.3 Constructive contributions are made to workplace\ndiscussions on such issues as production, quality and\nsafety\n2.4 Goals/objectives and action plan undertaken in the\nworkplace are communicated\n3. Identify and\ncommunicate issues\narising in the workplace\n3.1 Issues and problems are identified as they arise\n3.2 Information regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3 Dialogue is initiated with appropriate personnel\n3.4 Communication problems and issues are raised as\nthey arise\n\n--- PDF PAGE 7 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1 Non-verbal gestures\n1.2\nVerbal\n1.3 Face to face\n1.4 Two-way radio\n1.5 Speaking to groups\n1.6 Using telephone\n1.7 Written\n1.8 Internet\n\n--- PDF PAGE 8 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n4\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a range of communication/information at one\ntime\n1.2\nMade constructive contributions in workplace issues\n1.3\nSought workplace issues effectively\n1.4\nResponded to workplace issues promptly\n1.5\nPresented information clearly and effectively written form\n1.6\nUsed appropriate sources of information\n1.7\nAsked appropriate questions\n1.8\nProvided accurate information\n2. Underpinning\nknowledge\n2.1\nOrganization requirements for written and electronic\ncommunication methods\n2.2\nEffective verbal communication methods\n3. Underpinning\nskills\n3.1\nOrganize information\n3.2\nUnderstand and convey intended meaning\n3.3\nParticipate in variety of workplace discussions\n3.4\nComply with organization requirements for the use of\nwritten and electronic communication methods\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nVariety of Information\n4.2\nCommunication tools\n4.3\nSimulated workplace\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nCompetency in this unit must be assessed through\n5.2\nDirect Observation\n5.3\nInterview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 9 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n5\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\n\nUNIT CODE\n : 500311110\n\nUNIT DESCRIPTOR\n : This unit covers the knowledge, skills and attitudes to\n\n lead small teams including setting and maintaining\n\n team and individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Provide team\nleadership\n1.1\nWork requirements are identified and presented to\nteam members\n1.2\nReasons for instructions and requirements are\ncommunicated to team members\n1.3\nTeam members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign responsibilities\n2.1\nDuties, and responsibilities are allocated having\nregard to the skills, knowledge and aptitude required\nto properly undertake the assigned task and\naccording to company policy\n2.2\nDuties are allocated having regard to individual\npreference, domestic and personal considerations,\nwhenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1\nPerformance expectations are established based on\nclient needs and according to assignment\nrequirements\n3.2\nPerformance expectations are based on individual\nteam members duties and area of responsibility\n3.3\nPerformance expectations are discussed and\ndisseminated to individual team members\n4. Supervised team\nperformance\n4.1\nMonitoring of performance takes place against\ndefined performance criteria and/or assignment\ninstructions and corrective action taken if required\n4.2\nTeam members are provided with feedback, positive\nsupport and advice on strategies to overcome any\ndeficiencies\n4.3\nPerformance issues which cannot be rectified or\naddressed within the team are referenced to\nappropriate personnel according to employer policy\n4.4\nTeam members are kept informed of any changes in\nthe priority allocated to assignments or tasks which\nmight impact on client/customer needs and\nsatisfaction\n4.5\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6\nFollow-up communication is provided on all issues\naffecting the team\n4.7\nAll relevant documentation is completed in\naccordance with company procedures\n\n--- PDF PAGE 10 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1\nClient Profile\n1.2\nAssignment instructions\n2. Team member’s concerns\n2.1\nRoster/shift details\n3. Monitor performance\n3.1\nFormal process\n3.2\nInformal process\n4. Feedback\n4.1\nFormal process\n4.2\nInformal process\n5. Performance issues\n5.1\nWork output\n5.2\nWork quality\n5.3\nTeam participation\n5.4\nCompliance with workplace protocols\n5.5\nSafety\n5.6\nCustomer service\n\n--- PDF PAGE 11 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n7\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2\nAssessed and monitored team and individual performance\nagainst set criteria\n1.3\nRepresented concerns of a team and individual to next level\nof management or appropriate specialist and to negotiate on\ntheir behalf\n1.4\nAllocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs of\nthe tasks to be performed\n1.5\nSet and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Underpinning\nknowledge\n2.1\nCompany policies and procedures\n2.2\nRelevant legal requirements\n2.3\nHow performance expectations are set\n2.4\nMethods of Monitoring Performance\n2.5\nClient expectations\n2.6\nTeam member’s duties and responsibilities\n3. Underpinning\nskills\n3.1\nCommunication skills required for leading teams\n3.2\nInformal performance counseling skills\n3.3\nTeam building skills\n3.4\nNegotiating skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2\nMaterials relevant to the proposed activity or task\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2\nObservation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 12 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n8\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required to\ncollect information in order to negotiate to a desired outcome\nand participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Plan negotiations\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\nInformation on preparing for negotiation is identified\nand included in the plan\nInformation on creating non verbal environments for\npositive negotiating is identified and included in the plan\nInformation on active listening is identified and included\nin the plan\nInformation on different questioning techniques is\nidentified and included in the plan\nInformation is checked to ensure it is correct and up-to-\ndate\n2. Participate in\nnegotiations\n2.1\n\n2.2\n2.3\n\n2.4\n2.5\n\n2.6\n\n2.7\n2.8\nCriteria for successful outcome are agreed upon by all\nparties\nDesired outcome of all parties are considered\nAppropriate language is used throughout the negotiation\nA variety of questioning techniques are used\nThe issues and processes are documented and agreed\nupon by all parties\nPossible solutions are discussed and their viability\nassessed\nAreas for agreement are confirmed and recorded\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 13 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\nAnalytic skills\n1.6.1 observing differences between content and\nprocess\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for\nresolving conflict\n2. Non verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 14 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n10\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors influencing\nnegotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to achieve\nan agreed outcome\n2. Underpinning\nknowledge and\nAttitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies procedures\n2.4 Problem solving strategies on how to deal with unexpected\nquestions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning\nskills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation process\n4.2 Human resources (negotiators)\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context of\nassessment\n6.1 Competency to be assessed in real work environment or in a\nsimulated workplace setting.\n\n--- PDF PAGE 15 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n11\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of competencies covers the knowledge, skills and\nattitudes required to solve problems in the workplace\nincluding the application of problem solving techniques and\nto determine and resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1.\nIdentify the problem\n1.1\nVariances are identified from normal operating\nparameters; and product quality\n1.2\nExtent, cause and nature are of the problem are\ndefined through observation, investigation and\nanalytical techniques\n1.3\nProblems are clearly stated and specified\n2.\nDetermine\nfundamental causes\nof the problem\n2.1\nPossible causes are identified based on experience\nand the use of problem solving tools / analytical\ntechniques.\n2.2\nPossible cause statements are developed based on\nfindings\n2.3\nFundamental causes are identified per results of\ninvestigation conducted\n3.\nDetermine corrective\naction\n3.1\nAll possible options are considered for resolution of\nthe problem\n3.2\nStrengths and weaknesses of possible options are\nconsidered\n3.3\nCorrective actions are determined to resolve the\nproblem and possible future causes\n3.4\nAction plans are developed identifying measurable\nobjectives, resource needs and timelines in\naccordance with safety and operating procedures\n4.\nProvide\nrecommendation/s to\nmanager\n4.1\nReport on recommendations are prepared\n4.2\nRecommendations are presented to appropriate\npersonnel.\n4.3\nRecommendations are followed-up, if required\n\n--- PDF PAGE 16 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1\nBrainstorming\n1.2\nIntuitions/Logic\n1.3\nCause and effect diagrams\n1.4\nPareto analysis\n1.5\nSWOT analysis\n1.6\nGant chart, Pert CPM and graphs\n1.7\nScattergrams\n2. Problem\n\n2.1\nNon – routine process and quality problems\n2.2\nEquipment selection, availability and failure\n2.3\nTeamwork and work allocation problem\n2.4\nSafety and emergency situations and incidents\n3. Action plans\n\n3.1\nPriority requirements\n3.2\nMeasurable objectives\n3.3\nResource requirements\n3.4\nTimelines\n3.5\nCo-ordination and feedback requirements\n3.6\nSafety requirements\n3.7\nRisk assessment\n3.8\nEnvironmental requirements\n\n--- PDF PAGE 17 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n13\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified the problem\n1.2\nDetermined the fundamental causes of the problem\n1.3\nDetermined the correct / preventive action\n1.4\nProvided recommendation to manager\nThese aspects may be best assessed using a range of scenarios\n/ case studies / what ifs as a stimulus with a walk through forming\npart of the response. These assessment activities should include\na range of problems, including new, unusual and improbable\nsituations that may have happened.\n2. Underpinning\nknowledge\n2.1\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-standard\nsituations\n2.2\nCompetence to include the ability to apply and explain,\nsufficient for the identification of fundamental cause,\ndetermining the corrective action and provision of\nrecommendations\n2.2.1\nRelevant equipment and operational processes\n2.2.2\nEnterprise goals, targets and measures\n2.2.3\nEnterprise quality, OHS and environmental\nrequirement\n2.2.4\nPrinciples of decision making strategies and\ntechniques\n2.2.5\nEnterprise information systems and data collation\n2.2.6\nIndustry codes and standards\n3. Underpinning\nskills\n3.1\nUsing range of formal problem solving techniques\n3.2\nIdentifying and clarifying the nature of the problem\n3.3\nDevising the best solution\n3.4\nEvaluating the solution\n3.5\nImplementation of a developed plan to rectify the problem\n\n--- PDF PAGE 18 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n14\n\n4. Resource\nimplications\n4.1\nAssessment will require access to an operating plant over\nan extended period of time, or a suitable method of\ngathering evidence of operating ability over a range of\nsituations. A bank of scenarios / case studies / what ifs will\nbe required as well as bank of questions which will be\nused to probe the reason behind the observable action.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Case studies on solving problems in the workplace\n5.2 Observation\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of\nparts of this unit of competency. Simulation should be based on\nthe actual workplace and will include walk through of the relevant\ncompetency components.\n6. Context of\nassessment\n6.1\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 19 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n15\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE : 500311113\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required in\nthe application of mathematical concepts and techniques.\n\nELEMENT\nPerformance Criteria\nItalicized terms are elaborated in the\nRange of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given condition\n1.2 Mathematical techniques are selected based on the\ngiven problem\n\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on the\nproblem identified\n2.2 Mathematical computations are performed to the level\nof accuracy required for the problem\n2.3 Results of mathematical computation is determined and\nverified based on job requirements\n3. Analyze results\n3.1 Result of application is reviewed based on expected\nand required specifications and outcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 20 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n16\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical techniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical techniques (e.g.\nrecalculation, re-modeling)\n2.2 Report error to immediate superior for proper action\n\n--- PDF PAGE 21 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n17\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of mathematical\nconcepts and techniques to workplace problems\n2. Underpinning\nknowledge\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning\nskills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context of\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 22 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n18\nUNIT OF COMPETENCY: USE RELEVANT TECHNOLOGIES\n\nUNIT CODE : 500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and\nattitude\nrequired\nin\nselecting,\nsourcing\nand\napplying\nappropriate and affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n1. Study/select appropriate\ntechnology\n\n1.1 Usage of different technologies is determined based on\njob requirements\n1.2 Appropriate technology is selected as per work\n specification\n\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable software and hardware are used as per\n task requirement\n2.3 Management concepts are observed and practiced as\nper established industry practices\n\n3. Maintain/enhance of\nrelevant technology\n\n3.1 Maintenance of technology is applied in accordance with\nthe industry standard operating procedure,\nmanufacturer’s operating guidelines and\noccupational health and safety procedure to ensure\nits operative ability\n3.2 Updating of technology is maintained through continuing\neducation or training in accordance with job requirement\n3.3 Technology failure/ defect is immediately reported to the\nconcern/responsible person or section for appropriate\naction\n\n--- PDF PAGE 23 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of office\ntechnology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific technology/\nequipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to the\noperation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance schedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 24 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n20\n EVIDENCE GUIDE\n\n2 1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology consistent with\nwork requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nknowledge\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning\nskills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of training/seminar)\n6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 25 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n21\nCOMMON COMPETENCIES\n(AUTOMOTIVE MANUFACTURING-PARTS MANUFACTURING)\n\nUNIT TITLE: READ, INTERPRET AND APPLY ENGINEERING DRAWINGS.\n\nUNIT CODE: ALT742201\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying\nspecification from engineering blue prints or drawings that provides\nthe measurements of the product and pattern that is to be produced.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\nengineering\ndrawings/\nspecification\n\n1.1 Appropriate engineering drawings are identified and accessed as\nper job requirements.\n1.2 Version and date of drawing is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret drawings\n\n2.1 Relevant dimensions and sections of the drawings/ specifications\nare located in relation to the work to be conducted\n2.2 Information in the manual are interpreted in accordance to industry\npractices\n\n3 Apply information\nin the drawings &\nspecifications\n\n3.1 Engineering drawing is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with the\nspecifications in the drawings.\n3.3 Dimensional data and shape are applied according to the given task\n\n4. Store drawings\n\n4.1 The drawings and specification are stored properly to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 26 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n22\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Engineering drawings\nKinds of drawings:\n1.1 Casting drawing\n1.2 Machining drawing\n1.3 Project plan\n1.4 Technical drawing\n2. Data\nData includes but not limited to\n2.1 Material specifications\n2.2 Process specifications\n2.3 Special instructions\n2.4 Machining locating points\n2.5 Clamping points\n2.6 Amount of draft\n2.7 Surface finish\n\n--- PDF PAGE 27 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n23\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed drawings/specification\n1.2 Interpreted drawings\n1.3 Applied information in drawings\n1.4 Stored drawings\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Types of drawings used in automotive manufacturing industry\n2.2 Identification of symbols used in the drawings\n2.3 Identification of units of measurements\n2.4 Unit conversion\n2.5 Attention to details, Perseverance, Honesty\n\n3. Underpinning\nskills\n\n3.1 Reading and comprehension skills required to identify and\ninterpret engineering drawings and specifications\n3.2 Accessing information and data\n\n4. Resource\nimplications\n\nThe following resources MUST be provided:\n4.1 All drawings/engineering specifications relative to automotive\nmanufacturing\n4.2 Job order, requisitions\n4.3 Product sample\n\n5 Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 28 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n24\nUNIT OF COMPETENCY: PERFORM MENSURATION AND CALCULATION\n\nUNIT CODE: ALT311202\n\nUNIT DESCRIPTOR: This unit includes identifying, caring for, handling, using and\nmaintaining measuring instruments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Select measuring\n\n instruments\n\n1.1 Object or component to be measured is identified\n1.2 Correct specifications are obtained from relevant source\n1.3 Appropriate measuring instrument is selected according to job\nrequirements\n\n2. Carry out\n measurements\n and calculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained to job\n2.3 Calculation needed to complete work tasks are performed using\nthe four basic process of addition (+), subtraction (-),\nmultiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\n numbers are used to complete workplace tasks.\n2.5 Numerical computation is self-checked and corrected for\n accuracy\n2.6 Instruments are read to the limit of accuracy of the tool.\n\n3. Maintain\nmeasuring\ninstruments\n\n3.1 Measuring instruments are kept free from corrosion\n3.2 Measuring instruments are not dropped to avoid damage\n3.3 Measuring instruments are cleaned before and after using.\n\n--- PDF PAGE 29 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMeasuring instruments includes:\n1.1 Multitester\n1.2 Micrometer (In-out, depth)\n1.3 Vernier caliper (Out,\ninside)\n1.4 Dial Gauge with Mag. Std.\n1.5 Straight Edge\n1.6 Thickness gauge\n\n1.7 Try square\n1.8 Protractor\n1.9 Height gauge\n1.10 Steel rule\n1.11 Shrink rule\n\n2. Calculation\n\nKinds of part mensuration include:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2. 10 Out of roundness\n2.11 Shrinkage allowance\n\n--- PDF PAGE 30 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n26\nEVIDENCE GUIDE\n\n1. Critical aspect\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried-out measurements and calculations.\n1.3 Maintained measuring instruments\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Types of Measuring instruments and its uses\n2.2 Safe handling procedures in using measuring instruments\n2.3 Four fundamental operation of mathematics\n2.4 Formula for Volume, Area, Perimeter and other geometric figures\n\n3. Underpinning\n skills\n3.1 Caring and Handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.3 Performing calculation by Addition, Subtraction, Multiplication\nand Division\n3.4 Visualizing objects and shapes\n3.5 Interpreting formula for volume, area, perimeter and other\ngeometric figures\n\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3 Instructional materials relevant to the propose activity\n\n5. Method of\n assessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4 Demonstration with questioning\n\n6. Context of\n assessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.1 Assessment may be conducted in a workplace or\n simulated environment\n\n--- PDF PAGE 31 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n27\nUNIT TITLE: READ, INTERPRET AND APPLY SPECIFICATION AND MANUALS.\n\nUNIT CODE: ALT723203\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying service\nspecification manuals, maintenance procedure manuals and\nperiodic maintenance manual.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\n manual/\n specification\n\n1.1 Appropriate manuals are identified and accessed as per job\nrequirements.\n1.2 Version and date of manual is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret manuals\n\n2.1 Relevant sections, chapters of manuals/specifications are\nlocated in relations to the work to be conducted\n2.2 Information and procedure in the manual are interpreted in\naccordance to industry practices\n\n3 Apply information\nin manual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data is applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n\n4. Store manuals\n\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 32 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n28\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manuals\n\nKinds of manuals:\n1.1 Manufacturer’s specification manual\n1.2 Repair manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 33 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n29\nEVIDENCE GUIDE\n\n1.Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n\n3. Underpinning\nskills\n\n3.1.Reading and comprehension skills required to identify and interpret\nautomotive manuals and specifications\n3.1. Accessing information and data\n\n4 Resource\nImplications\n\nThe following resources must be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Job order, requisitions\n4.3 Actual vehicle or simulator\n\n5 Method of\nassessment\nCompetency must be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6 Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 34 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n30\nUNIT OF COMPETENCY : PERFORM SHOP MAINTENANCE\n\nUNIT CODE\n\n:\nALT723205\n\nUNIT DESCRIPTOR\n: This unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage and checking\nof tools/ equipment and disposal of used supplies/materials are\nalso incorporated in this competency.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n1.1\nCleaning solvent used as per workshop/tools\ncleaning requirement\n1.2\nWork area is checked and cleaned\n1.3\nWet surface/spot in work area is wiped and dried\n2. Store/arrange tools and\nshop equipment\n\n2.1 Tools/equipment are checked and stored in their\nrespective shelves/location\n2.2\nCorresponding labels are posted and visible\n2.3\nTools are safely secured and logged in the records\n3. Dispose wastes/used\nlubricants\n3.1\nContainers for used lubricants are visibly labeled\n3.2\nWastes/used lubricants are disposed as per\nworkshop SOP\n4. Report damaged\ntools/equipment\n\n4.1\nComplete inventory of tools/equipment is maintained\n4.2\nDamaged tools/equipment/facilities are identified and\nrepair recommendation is given\n4.3\nReports prepared has no error/discrepancy\n\n--- PDF PAGE 35 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n31\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work area\nWork areas include:\n1.1\nWorkshop areas for servicing/repairing light and/or heavy\nvehicle and/or plant transmissions and/or outdoor power\nequipment\n1.2\nOpen workshop/garage and enclosed, ventilated office area\n1.3\nOther variables may include workshop with:\n• Mess hall\n• Wash room\n•\nComfort room\n2. Cleaning\nrequirement\n2.1\nCleaning solvent\n2.2\nInventory of supplies, tools, equipment, facilities\n2.3\nList of mechanics/technicians\n2.4\nRags\n2.5\nBroom\n2.6\nMop\n2.7\nPail\n2.8\nUsed oil container\n2.9\nOiler\n2.10 Dust/waste bin\n3. Manuals\n3.1 Vehicle/plant manufacturer specifications\n3.2 Company operating procedures\n3.3 Industry/Workplace Codes of Practice\n3.4 Product manufacturer specifications\n3.5 Customer requirements\n3.6\nIndustry Occupational Health and Safety\n4. Company standard\noperating procedure\nWearing of Personal protective equipment include:\n4.1 Gloves\n4.2 Apron\n4.3 Goggles\n4.4\nSafety shoes\n\n--- PDF PAGE 36 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n32\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nCleaned workshop tools/facilities\n1.2\nMaintained equipment, tools and facilities\n1.3\nDisposed wastes and used lubricants/fluid as per required\nprocedure\n2. Underpinning\nknowledge and\nattitudes\n2.1 5 S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire extinguishers and prevention\n2.9 Storage/disposal of hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\nAttention to Details)\n3. Underpinning\nskills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5\nMonitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3\nMaterials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2\nDemonstration\n6. Context of\nassessment\n6.1\nCompetency must be assessed on the job or in a simulated\nenvironment.\n6.2\nThe assessment of practical skills must take place after a period\nof supervised practice and repetitive experience.\n\n--- PDF PAGE 37 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n33\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: CHANGE EQUIPMENT DIES\nUNIT CODE\n : ALT823308\nUNIT DESCRIPTOR : This competency covers the removal and refitting of dies in\npreparation for production. It applies typically to the areas of\nthe industry such as injection and blow molding.\nThis competency is typically performed by operators\ndemonstrating some relevant theoretical knowledge and using\na range of well developed skills requiring some discretion and\njudgment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1\nPrepare to\nchange dies\n1.1 Procedure for machine close-down is followed and concerned\npersonnel are informed as per workplace procedures.\n1.2 Last-off samples are taken as required for die reports\n1.3 Machine is shut down in accordance with workplace procedures\nand/or manufacturer’s instructions\n1.4 Isolating locks are activated, power is disconnected and relevant\nsignage are posted as per workplace procedures\n1.5 Dies or cores are selected to match product/ process\nspecification\n1.6 Tools and equipment are checked for safe, effective operation.\n2\nChange dies\n2.1 Removal process is planned to ensure no injury to self or others,\nand damage equipment\n2.2 Die is removed, cleaned and stored according to workplace\nprocedures\n2.3 Replacement die is fitted ensuring that locating devices and\nmarks are matched and securing devices are installed and\ntightened to specification\n2.4 Dies and immediate machinery are cleaned, corrosion protection\napplied if required.\n3\nTest fitting of\ndies\n3.1 Machine is restarted as per procedure\n3.2 Operation of die is checked against product quality\nspecifications\n3.3 Machine setting ranges is compared against documented\nrequirements\n3.4 First off sample is checked the for required standards\n3.5 Settings and other production variables are fine-tuned as\nrequired\n3.6 Variances between standard operating procedures and actual\nproduction run is noted\n3.7\nWorkplace documentation is completed and reported to\nappropriate personnel.\n\n--- PDF PAGE 38 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n34\n4\nRespond to\nproblems\n4.1 Possible routine and non-routine problems in the equipment,\nmaterials or process are identified\n4.2 Problems needing action is determined according to workplace\nprocedures\n4.3 Possible fault causes are determined according to workplace\nprocedures\n4.4 Problems within area of responsibility are rectified using\nappropriate solutions\n4.5\nProblems outside area of responsibility are reported to\ndesignated person.\n\n--- PDF PAGE 39 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n35\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Procedure\nProcedure means all relevant:\n1.1\nWorkplace procedures\n1.2\nWork instruction\n1.3\nTemporary instructions\n1.4\nIndustry and government codes and standards\n2. Tools and equipment\n2.1\nHand carts and trolleys\n2.2\nhoist/lifting equipment\n2.3\nbasic hand tools\n2.4\nPPE like gloves, hard hut, safety shoes\n3. Problems\nTypical problems include:\n3.1\nlack of cleaning leading to corrosion\n3.2\nInadequate fitting\n3.3\nfine adjustments to optimize production\n\n--- PDF PAGE 40 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n36\nEVIDENCE GUIDE\n1. Critical\naspects of\ncompetency\nIt is essential that competence is demonstrated in the ability to perform\na die-change which will put the injection molding machine back into full\nproduction of in-specification product in standard time.\nAssessment requires evidence that the candidate:\n1.1 Selected, installed and checked the performance of die and cores\n1.2 Located, interpreted and applied relevant information\n1.3 Maintained workplace records\n1.4 Identified and safely handled products and materials\n1.5 Applied safety precautions appropriate to the task\n1.6 Recognized potential situations requiring action and then\nimplement appropriate action.\n2. Underpinning\nknowledge\nand attitudes\n\n2.1 Injection/blow molding materials, equipment and process\n2.2 Company’s procedures and relevant regulatory requirements\n2.3 Explain:\n2.3.1 Impact of incorrect or faulty fitting\n2.3.2 Production workflow sequences\n2.3.3 Selection and use of equipment and procedures\n2.3.4 Hazards of the removal and fitting process and\nappropriate hazard control procedures\n2.3.5 The performance of dies\n2.3.6 Relevant information and workplace records\n2.3.7 Safety precautions appropriate to the task\n2.4 Causes of faults like faulty equipment, inadequate\nfitting/adjustment and incorrect process variables like temperature\nand pressure.\n3. Underpinning\nskills\n3.1 Plan own work including predicting consequences and identifying\nimprovements\n3.2 Using PPE, safe handling products and materials, reading\nrelevant safety information and applying safety precautions\nappropriate to the task.\n3.3 Starting up equipment and making appropriate adjustments to\nbring process on line\n3.4 Taking samples when required and identifying product out of\nspecifications\n3.5 Shutting down equipment in normal or abnormal circumstances\n3.6 Identifying factors which may affect product quality or production\noutput and appropriate remedies\n3.7 Identifying and describing own role and role of others involved\ndirectly in the process\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Access to an operating plant or equipment\n4.2 Tools, equipment and workplace relevant with the requirements\nfor the job.\n4.3 Supplies and consumable materials\n4.4 Engineering manuals relevant to the task to be performed\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct Observation with questioning\n5.2\nPortfolio\n6. Context of\nassessment\nCompetency may be assessed individually in the actual workplace or a\nsimulated workplace environment.\n\n--- PDF PAGE 41 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n37\nUNIT OF COMPETENCY\n:\nPREPARE AND START EQUIPMENT FOR\nPRODUCTION\nUNIT CODE\n\n :\n\nALT823309\n\nUNIT DESCRIPTOR\n :\n\nThis competency covers the pre-start preparations\nand start-up operations to bring a production\nmachine from ‘power-off’ to first-off product and\nhandover to the operator to continue the\nproduction run (for Injection and blow molding\nmachine).\nThis competency is typically performed by senior\noperators working either independently or as part\nof a work team.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform pre-\nstart checks\n1.1 Emergency stops, guards, controls are checked in accordance\nwith workplace procedures\n1.2 Copy of the product data sheet is collected\n1.3 Requirements for materials, quality, production run are identified\n1.4 Head/die bolts, etc, are retightened as required\n1.5 Equipment set-up is checked in accordance with workplace\nprocedures\n2. Carry out pre-\nstart operations\n2.1 Power is restored to the machine and ancillary equipment as per\nworkplace procedures and/or manufacturer’s instruction\n2.2 Ancillary equipment/heater circuit is started up and the\ntemperature and other controllers to the condition stated on the\nsetup information card is set in accordance with workplace\nprocedures and/or manufacturer’s instruction\n2.3 Machine settings is checked against setup information card and\nmachine switch on in accordance with workplace procedures\nand/or manufacturer’s instruction\n2.4 Machine is brought to operational readiness in accordance with\nworkplace procedures\n2.5 Material is selected and loaded in accordance with workplace\nprocedures\n2.6 Machine is charged, purged and cleaned as required.\n3. Start machine\nand hand over\nto operator\n3.1 Machine is started and checked in accordance with workplace\nprocedures and/or manufacturer’s instruction\n3.2 Machine is adjusted to bring to machine to operational speed/\ncondition, as required\n3.3 Machine is checked and ran until a quality product is obtained\n3.4 Adjustments to machine and extra equipment is made in line to\nproduce an acceptable product\n3.5 Required adjustments are made to ensure the machine and its\nupstream and downstream extra equipment in line are in\nbalance\n3.6 Operator is given all necessary instructions and machine is\nhanded over to the operator\n\n--- PDF PAGE 42 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n38\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Procedures\n1.1\nWorkplace procedures\n1.2\nWork instructions\n1.3\nInstructions and relevant industry and government\ncodes and standards\n2. Machine setting\n2.1\nbasic controls\n2.2\nshot size and correction capacity\n2.3\ninjection speed\n2.4\nscrew position\n2.5\ninjection pressure\n2.6\nscrew back time\n2.7\nmelt decompress position\n2.8\nsprue break\n3. Machine\n3.1\nInjection molding machine\n3.2\nBlow molding machine\n4. Upstream and\ndownstream extra\nequipment\n4.1\nElectrical, pneumatic, mechanical, electromechanical\nand hydraulic injection molding machines and\ncomponents such as base, frame, feed hoppers and\nmaterial supply mechanisms, barrel and screw\nplastification unit, injection units, die/mould tool\n4.2\nAdditional equipment including chillers/cooling\ntowers, die heating equipment, hopper driers, mixing\nhoppers, dehumidifying driers, air compressors,\ndosing machines, color blending equipment and\nconveyors where they are integral to the operation of\nthe injection molder\n4.3\nHand tools used in the injection molding process\n4.4\nMaterial loading equipment used for loading of raw\nmaterials like belt or steel conveyor\n4.5\nRelevant personal protective equipment like gloves,\nsafety shoes, hard hut, face shield\n\n--- PDF PAGE 43 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n39\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Performed pre-start checks\n1.2 Carried out pre-start operations\n1.3 Started machine and handed over to operator\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Materials, equipment and process sufficient to recognize out-of-\nspecification process problems and equipment\n2.2 Company’s procedures and relevant regulatory requirements\n2.3 Explain:\n2.3.1 machine construction\n2.3.2 machine safety interlocks and systems\n2.3.3 principles of operation\n2.3.4 machine controls, their identification and function\n2.3.5 impact of incorrect or faulty setup\n2.3.6 production workflow sequences\n2.3.7 correct selection and use of equipment and procedures\n2.3.8 hazards of the removal and fitting process and appropriate\nhazard control procedures\n2.3.9 the performance of dies and cores\n2.3.10 relevant information and workplace records\n2.3.11 safety precautions appropriate to the task\n2.3.12 distinguish between causes of faults like faulty equipment\nand standard process variables\n3. Underpinning\nskills\n3.1 Plan own work including predicting consequences and identifying\nimprovements\n3.2 Starting up equipment and making appropriate adjustments to\nbring process on line\n3.3 Taking samples when required and identifying product out of\nspecification\n3.4 Shut down equipment in normal or abnormal circumstances\n3.5 Identifying factors which may affect standard product quality or\nproduction output\n3.6 Identifying hazards of the materials and process and taking\nappropriate hazard control\n3.7 Using PPE, safe handling products and materials, reading relevant\nsafety information and applying safety precautions appropriate to\nthe task\n3.8 Reading and interpreting technical specifications and production\nschedules\n3.9 Calculating cycle times and production rates.\n3.10 Setting and interpreting numeric data\n3.11 Verbal communication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Access to an operating plant or equipment\n4.2 Tools and equipment relevant to the activity\n4.3 Supplies and consumable materials\n4.4 Engineering manuals\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct Observation with questioning\n5.2 Portfolio assessment\n6. Context of\nassessment\nCompetency may be assessed individually in the actual workplace or a\nsimulated workplace environment.\n\n--- PDF PAGE 44 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n40\n\nUNIT OF COMPETENCY: PRODUCE INJECTION MOLDED PRODUCTS\nUNIT CODE\n : ALT823310\nUNIT DESCRIPTOR : This competency covers the operation and adjustment of\ninjection molding processes and the solving of non-routine\nproblems. It does not cover die setting.\nThis competency is typically performed by operators\ndemonstrating some relevant theoretical knowledge and using\na range of well developed skills requiring some discretion and\njudgment.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan own work\nrequirements\n1.1 Tools and equipment and processes used for production\nprocess and upstream and downstream operations from\nproduction plan or request are identified in accordance with\nworkplace procedures\n1.2 Materials required are identified including additives as per\nproduction requirements\n1.3 Hazards are recognized and appropriate hazard control /\nminimization methods are followed\n1.4 Emergency stops, guards and controls are identified and checked\nin accordance with workplace procedures\n1.5 Requirements for materials, quality, production and equipment\nchecks are identified in accordance with workplace procedures\n1.6 Materials, waste management and housekeeping needs are\nidentified in accordance with workplace procedures\n2. Check injection\nmolding process\nsetup\n2.1 Equipment requirements are determined in accordance with\nworkplace\n2.2 Process is set to specifications as required\n2.3 Injection molding equipment settings and adjustments are\nchecked as required\n2.4 Materials are checked as per job requirements\n2.5 Nonconforming materials are discarded, or adjustments are made\nto the process\n2.6 Date, batch and materials markings are set up to specifications,\nas required\n2.7 Other pre-start checks are completed in accordance with\nprocedures.\n3. Operate and\nmake\nadjustments as\nrequired to the\ninjection molding\nprocess\n3.1 Injection molding equipment is operated, noting key variables in\naccordance with procedures.\n3.2 Controls/displays/terminals for production/process data are\nmonitor in accordance with procedures.\n3.3 Product/process quality is monitored in accordance with\nprocedures\n3.4 Adjustments are made to remedy faults and nonconformity to\n\n--- PDF PAGE 45 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n41\nstandard as required\n3.5 Continuity of process is maintained in accordance with production\nrequirements\n3.6 Scrap/trimming and other materials are collected and\nreprocessed/ discarded in accordance with procedures\n3.7 Equipment is cleaned, adjusted and lubricated as required\n3.8 Equipment is paused or stopped in an emergency, following\nworkplace and emergency procedures.\n4. Respond to\nproblems\n4.1 Possible routine and non-routine problems in the equipment,\nmaterials or process identified in accordance with procedures\n4.2 Problems needing action are determined in accordance with\nprocedures\n4.3 Possible fault causes are determine in accordance with\nprocedures\n4.4 Problems are rectified using appropriate solutions within area of\nresponsibility\n4.5 Problems outside area of responsibility are reported to\ndesignated person.\n\n--- PDF PAGE 46 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n42\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools and Equipment\n1.1 Electrical, pneumatic, mechanical, electromechanical\nand hydraulic injection molding machines and\ncomponents such as base, frame, feed hoppers and\nmaterial supply mechanisms, barrel and screw\nplastification unit, injection units, die/mould tool\n1.2 Additional equipment including chillers/cooling towers,\ndie heating equipment, hopper driers, mixing hoppers,\ndehumidifying driers, air compressors, dosing\nmachines, color blending equipment and conveyors\nwhere they are integral to the operation of the injection\nmolder\n1.3 Hand tools used in the injection molding process\n1.4 Material loading equipment used for loading of raw\nmaterials like belt or steel conveyor\n1.5 Relevant personal protective equipment like gloves,\nsafety shoes, hard hut, face shield\n2. Hazards\nTypical hazards include:\n2.1\nSpills\n2.2\nDusts/vapors\n2.3\nHazardous materials\n2.4\nManual handling hazards\n2.5\nKnife hazards\n3. Procedures\n3.1\nWorkplace procedures\n3.2\nWork instructions\n3.3\nInstructions and relevant industry and government\ncodes and standards\n4. Key variables\nKey variables to be monitored include:\n4.1 Operating temperature\n4.2 speed\n4.3 cycle time\n4.4 output rate\n4.5 concentration or dispersion of color\n4.6 product weight\n4.7 product wall thickness\n4.8 product integrity and general conformance to\nspecification / sample\n5. Routine and non routine\nproblems\nTypical problems may include:\n5.1\nlack of cleaning leading to corrosion\n5.2\nInadequate fitting\n5.3\nfine adjustments to optimize production\n\n--- PDF PAGE 47 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n43\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified critical materials properties and injection molding\nprocess characteristics in relation to the process\nrequirements and the end product\n1.2 Planned own work process within workplace procedures\nand explained the reasons for the steps in the process\n1.3 Operated and made adjustments as required to the\ninjection molding process\n1.4 Took appropriate action to observe equipment, materials\nand products for out of specification results, make\nadjustments and identified problems to be reported\n1.5 Achieved production quality and output consistently\n1.6 Anticipated problems from process observations\n1.7 Resolved problems efficiently\n1.8 Ensured the process runs consistently and smoothly\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Knowledge of materials, equipment and process sufficient\nto recognize conditions which may lead to out of\nspecification production.\n2.2 Company’s procedures and relevant regulatory\nrequirements\n2.3 Products, materials and material characteristics\n2.4 Behavior of materials in relation to heat, pressure and time\n2.5 Quality requirements at each production stage\n2.6 Function and operating principles of injection molding\nequipment, machine components and ancillary equipment\n2.7 Impact of machine speed, temperature, pressure, time\nduring cycles on product quality and production output\n2.8 Nature of mechanical, hydraulic, pneumatic, electrical and\nelectronic principles which effect machine operation and\nproduct development\n2.9 Injection molding cycle and the importance of machine set\nup and warm up for effective processing of materials\n2.10 Safety procedures and the use of PPE in relation to\nhandling materials, equipment\n3. Underpinning skills\n3.1 Planning own work including predicting consequences and\nidentifying improvements\n3.2 Interpreting from production requests the correct selection\nand using equipment, materials, processes and\nprocedures\n3.3 Maintaining output and product quality using appropriate\ninstruments, controls, test information and readings\n3.4 Making adjustments to equipment operation to rectify\nvariations in equipment operation\n3.5 Checking injection molding machine for correct set up to job\nspecifications and implement adjustments or report\ndeviations immediately\n3.6 Starting up equipment and make appropriate adjustments\nto bring process on line\n3.7 Taking samples when required and identify product out of\n\n--- PDF PAGE 48 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n44\nspecification\n3.8 Shutting down equipment in normal or abnormal\ncircumstances\n3.9 Identifying hazards of the materials and process and\nimplementing appropriate procedures for hazard control\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Access to an operating plant or equipment\n4.2 Tools, equipment and workplace relevant with the\nrequirements for the job.\n4.3 A bank of case studies/scenarios\n4.4 Supplies and consumable materials\n4.5 Engineering manuals\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct Observation with questioning\n5.2 Portfolio assessment\n6. Context of\nassessment\nCompetency may be assessed individually in the actual\nworkplace or a simulated workplace environment.\n\n--- PDF PAGE 49 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n45\nUNIT OF COMPETENCY : PRODUCE BLOW MOLDED PRODUCTS\nUNIT CODE\n : ALT823311\nUNIT DESCRIPTOR : This competency covers the operation and adjustment of blow\nmolding processes and the solving of non-routine problems.\nThis competency is typically performed by operators\ndemonstrating some relevant theoretical knowledge and using\na range of well developed skills requiring some discretion and\njudgment\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan own work\nrequirements\n1.1 Equipment and processes used for production process and\nupstream and downstream operations are identified from\nproduction plan or request\n1.2 Materials required including additives are identified based on\nwork requirements\n1.3 Hazards are recognized and appropriate hazard control/\nminimization methods are followed\n1.4 Emergency stops, guards and controls are identified and checked\n1.5 Requirements for materials, quality, production and equipment\nchecks are identified based on work requirements\n1.6 Waste management and housekeeping needs are identified in\naccordance with workplace procedures and/or OH & S\nrequirements.\n2. Set up and\nconduct pre\nstart checks\n2.1 Equipment is set up to specifications\n2.2 Blow molding equipment is set up and adjusted for shot size,\nparison control, die gap, temperature, screw speed, cycle speed,\nslow close setting (or cushion) and timing to specifications\n2.3 Safety gates and guards are checked in their correct working\npositions and emergency stops are identified and checked as\nrequired\n2.4 Equipment, raw material and mould are verified to match job\nrequirement\n2.5 Date, batch and material markings are set up according to\nprocedures.\n2.6 Other pre-start checks are complete according to procedures\n2.7 Equipment is started up and ‘dry run’ is performed to warm\nhydraulics and components to operating temperature before\nproduction, as required.\n3. Operate and\nmake\nadjustments as\nrequired to the\nblow molding\nprocess\n3.1. Condition of equipment is checked and raw materials is\nintroduced as required\n3.2. Blow molding equipment is operate and key variables noted in\naccordance with workplace procedures\n3.3. Controls/displays/terminals for production/process data are\nmonitored in accordance with workplace procedures\n3.4. Product/process quality is monitored according to procedures\n3.5. Adjustments are made to remedy faults and nonconformity to\nstandard as required\n3.6. Continuity of process is maintained in accordance with workplace\nprocedures\n3.7. Scrap/trimming and other materials are collected and\nreprocessed/discarded according to procedures\n3.8. Equipment is cleaned, adjusted and lubricated as required\n3.9. Logs and records are completed as required\n\n--- PDF PAGE 50 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n46\n3.10. Equipment is paused or stopped in an emergency following\nstandard operating procedures.\n4. Respond to\nproblems\n4.1. Possible routine and non-routine problems in the equipment,\nmaterials or process are identified in accordance with workplace\nprocedures\n4.2. Problems needing action are determined in accordance with\nworkplace procedures\n4.3. Possible fault causes are determine in accordance with\nworkplace procedures\n4.4. Problems within area of responsibility are rectified using\nappropriate solutions\n4.5. Problems outside area of responsibility are reported to\ndesignated person.\n\n--- PDF PAGE 51 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n47\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Equipment and\ntools\nEquipment and tools may include and but not limited to:\n1.1 Electrical, pneumatic, mechanical Electromechanical and\nhydraulic injection molding machines and components such as\nbase, frame, feed hoppers and material supply mechanisms\n1.2 Die/tool\n1.3 Injection units\n1.4 Chillers/cooling towers\n1.5 Die heating equipment\n1.6 Hopper driers, mixing hoppers, dehumidifying driers\n1.7 Air compressors\n1.8 Dosing and Brushing machines\n1.9 Color blending equipment and conveyors\n1.10 Barrel and screw plastification unit\n1.11 Material loading equipment used for loading of raw materials\n1.12 Hand tools used in the injection molding process\n1.13 Personal protective equipment\n2. Hazards\nTypical hazards include:\n2.1 Spills\n2.2 Dusts vapors\n2.3 Slip and fall, particularly due to split granules\n2.4 Temperature\n2.5 Hazardous substances\n2.6 Moving equipment\n2.7 Manual handling hazards\n3. Procedures\n3.1 Workplace procedures\n3.2 Work instructions\n3.3 Temporary instructions\n3.4 Industry and government codes and standards\n4. Key Variables\nKey variables to be monitored include:\n4.1 Operating temperature\n4.2 speed\n4.3 cycle time\n4.4 output rate\n4.5 concentration or dispersion of color\n4.6 product weight\n4.7 product wall thickness\n4.8 product integrity and general conformance to specification /\nsample\n5. Faults\nTypical routine process problems include:\n5.1 Equipment malfunction\n5.2 Variations in temperature, pressure, speed, injection dwell and\nclamp times\n5.3 Variations in materials or contamination of materials\n5.4 Die damage\n5.5 Routine blow molding faults-wall thinning, holes, poor surface\nfinish, warping, poor color dispersion, ejection damaged, color\ncontamination, black spots\n5.6 Machine malfunction\n5.7 Die/tooling problem\n5.8\nVariations in material and/or contamination of materials\n\n--- PDF PAGE 52 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n48\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified critical material properties and blow molding\nprocess characteristics in relation to the process\nrequirements and the end product\n1.2 Planned own work process within workplace procedures\nand explained the reasons for the steps in the process\n1.3 Operated and made adjustments as required to the blow\nmolding process\n1.4 Took appropriate action to observe equipment, materials\nand products for out of specification results and identified\nproblems to be reported.\n1.5 Demonstrated consistent performance particularly to see\nthat:\n1.5.1 production quality and output standards are met\nconsistently\n1.5.2 problems are anticipated from process observations\n1.5.3 problems are efficiently resolved\n1.5.4 the process runs consistently and smoothly\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Knowledge of the materials, equipment and process\nsufficient to recognize conditions which may lead to out of\nspecification production.\n2.2 Company’s procedures and relevant regulatory\nrequirements along with the ability to implement them\nwithin appropriate time constraints and work standards.\n2.3 Competence includes the ability for the practical\ncompletion of the job to:\n2.4 Operation of blow molding equipment and components\n2.5 Production workflow sequences and materials demand\n2.6 Reasons for checking process control panels and reporting\nreadings which do not conform to the work instructions\n2.7 Purpose and requirements of ‘dry running’ before starting\nproduction\n2.8 Approved hazard control and safety procedures and the\nuse of PPE in relation to handling materials, equipment\noperation and clean up\n2.9 Correct selection and use of equipment, materials,\nprocesses and procedures\n2.10 Hierarchy of control including engineering controls\n2.11 Impact of variations in raw materials and equipment\noperation in relation to final product\n2.12 Changes to materials at various stages of production\n\n--- PDF PAGE 53 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n49\n3. Underpinning skills\n3.1 Planning own work including predicting consequences and\nidentifying improvements\n3.2 Interpreting from production requests the correct selection\nand using of equipment, materials, processes and\nprocedures\n3.3 Maintaining output and product quality using appropriate\ninstruments, controls, test information and readings\n3.4 Making adjustments to equipment operation to rectify\nvariations in equipment operation\n3.5 Checking blow molding machine for correct setup to job\nspecifications and implement adjustments or report\ndeviations immediately\n3.6 Starting up equipment and make appropriate adjustments\nto bring process on line\n3.7 Taking samples when required and identify product out of\nspecification\n3.8 Shutting down equipment in normal or abnormal\ncircumstances\n3.9 Identifying hazards of the materials and process and\nimplement appropriate procedures for hazard control\n3.10 Reading and interpreting typical product specifications, job\nsheets and material labels as provided to operators.\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 A bank of scenarios and questions\n4.2 Tools, equipment and workplace relevant with the\nrequirements for the job.\n4.3 Supplies and consumable materials\n4.4 Engineering manuals\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nDirect Observation with questioning\n5.2\nPortfolio assessment\n6. Context of\nassessment\nCompetency may be assessed individually in the actual\nworkplace or a simulated workplace environment.\n\n--- PDF PAGE 54 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n50"
