        "source_title": "PRODUCE BLOW MOLDED PRODUCTS",
        "source_text": "--- PDF PAGE 49 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n45\nUNIT OF COMPETENCY :    PRODUCE BLOW MOLDED PRODUCTS \nUNIT CODE \n     :    ALT823311 \nUNIT DESCRIPTOR         : This competency covers the operation and adjustment of blow \nmolding processes and the solving of non-routine problems. \nThis competency is typically performed by operators \ndemonstrating some relevant theoretical knowledge and using \na range of well developed skills requiring some discretion and \njudgment \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Plan own work \nrequirements \n1.1 Equipment and processes used for production process and \nupstream and downstream operations are identified from \nproduction plan or request \n1.2 Materials required including additives are identified based on \nwork requirements \n1.3 Hazards are recognized and appropriate hazard control/ \nminimization methods are followed \n1.4 Emergency stops, guards and controls are identified and checked \n1.5 Requirements for materials, quality, production and equipment \nchecks are identified based on work requirements \n1.6 Waste management and housekeeping needs are identified in \naccordance with workplace procedures and/or OH & S \nrequirements. \n2. Set up and \nconduct pre \nstart checks \n2.1 Equipment is set up to specifications \n2.2 Blow molding equipment is set up and adjusted for shot size, \nparison control, die gap, temperature, screw speed, cycle speed, \nslow close setting (or cushion) and timing to specifications \n2.3 Safety gates and guards are checked in their correct working \npositions and emergency stops are identified and checked as \nrequired \n2.4 Equipment, raw material and mould are verified to match job \nrequirement \n2.5 Date, batch and material markings are set up according to \nprocedures. \n2.6 Other pre-start checks are complete according to procedures \n2.7 Equipment is started up and ‘dry run’ is performed to warm \nhydraulics and components to operating temperature before \nproduction, as required.\n3. Operate and \nmake \nadjustments as \nrequired to the \nblow molding \nprocess \n3.1. Condition of equipment is checked and raw materials is \nintroduced as required \n3.2. Blow molding equipment is operate and key variables noted in \naccordance with workplace procedures \n3.3. Controls/displays/terminals for production/process data are \nmonitored in accordance with workplace procedures \n3.4. Product/process quality is monitored according to procedures \n3.5. Adjustments are made to remedy faults and nonconformity to \nstandard as required \n3.6. Continuity of process is maintained in accordance with workplace \nprocedures \n3.7. Scrap/trimming and other materials are collected and \nreprocessed/discarded according to procedures \n3.8. Equipment is cleaned, adjusted and lubricated as required \n3.9. Logs and records are completed as required\n\n--- PDF PAGE 50 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n46\n3.10. Equipment is paused or stopped in an emergency following \nstandard operating procedures.\n4. Respond to \nproblems \n4.1. Possible routine and non-routine problems in the equipment, \nmaterials or process are identified in accordance with workplace \nprocedures \n4.2. Problems needing action are determined in accordance with \nworkplace procedures \n4.3. Possible fault causes are determine in accordance with \nworkplace procedures \n4.4. Problems within area of responsibility  are rectified using \nappropriate solutions  \n4.5. Problems outside area of responsibility are reported to \ndesignated person.\n\n--- PDF PAGE 51 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n47\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Equipment and \ntools \nEquipment and tools may include and but not limited to: \n1.1 Electrical, pneumatic, mechanical Electromechanical and \nhydraulic injection molding machines and components such as \nbase, frame, feed hoppers and material supply mechanisms \n1.2 Die/tool \n1.3 Injection units \n1.4 Chillers/cooling towers  \n1.5 Die heating equipment  \n1.6 Hopper driers, mixing hoppers, dehumidifying driers \n1.7 Air compressors \n1.8 Dosing and Brushing machines \n1.9 Color blending equipment and conveyors \n1.10 Barrel and screw plastification unit \n1.11 Material loading equipment used for loading of raw materials \n1.12 Hand tools used in the injection molding process \n1.13 Personal protective equipment\n2. Hazards \nTypical hazards include: \n2.1 Spills \n2.2 Dusts vapors \n2.3 Slip and fall, particularly due to split granules \n2.4 Temperature \n2.5  Hazardous substances \n2.6 Moving equipment \n2.7 Manual handling hazards\n3. Procedures \n3.1 Workplace procedures \n3.2 Work instructions \n3.3 Temporary instructions \n3.4 Industry and government codes and standards\n4. Key Variables \nKey variables to be monitored include: \n4.1 Operating temperature \n4.2 speed \n4.3 cycle time \n4.4 output rate \n4.5 concentration or dispersion of color \n4.6 product weight \n4.7 product wall thickness \n4.8 product integrity and general conformance to specification / \nsample\n5. Faults \nTypical routine process problems include: \n5.1 Equipment malfunction \n5.2 Variations in temperature, pressure, speed, injection dwell and \nclamp times \n5.3 Variations in materials or contamination of materials \n5.4 Die damage \n5.5 Routine blow molding faults-wall thinning, holes, poor surface \nfinish, warping, poor color dispersion, ejection damaged, color \ncontamination, black spots  \n5.6 Machine malfunction \n5.7 Die/tooling problem \n5.8\nVariations in material and/or contamination of materials\n\n--- PDF PAGE 52 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n48\nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Identified critical material properties and blow molding \nprocess characteristics in relation to the process \nrequirements and the end product \n1.2 Planned own work process within workplace procedures \nand explained the reasons for the steps in the process \n1.3 Operated and made adjustments as required to the blow \nmolding process \n1.4 Took appropriate action to observe equipment, materials \nand products for out of specification results and identified \nproblems to be reported. \n1.5 Demonstrated consistent performance particularly to see \nthat: \n1.5.1 production quality and output standards are met \nconsistently \n1.5.2 problems are anticipated from process observations \n1.5.3 problems are efficiently resolved \n1.5.4 the process runs consistently and smoothly  \n2. Underpinning \nknowledge and \nattitudes \n \n2.1 Knowledge of the materials, equipment and process \nsufficient to recognize conditions which may lead to out of \nspecification production. \n2.2 Company’s procedures and relevant regulatory \nrequirements along with the ability to implement them \nwithin appropriate time constraints and work standards. \n2.3 Competence includes the ability for the practical \ncompletion of the job to: \n2.4 Operation of blow molding equipment and components \n2.5 Production workflow sequences and materials demand \n2.6 Reasons for checking process control panels and reporting \nreadings which do not conform to the work instructions \n2.7 Purpose and requirements of ‘dry running’ before starting \nproduction \n2.8 Approved hazard control and safety procedures and the \nuse of PPE in relation to handling materials, equipment \noperation and clean up \n2.9 Correct selection and use of equipment, materials, \nprocesses and procedures \n2.10 Hierarchy of control including engineering controls \n2.11 Impact of variations in raw materials and equipment \noperation in relation to final product \n2.12 Changes to materials at various stages of production\n\n--- PDF PAGE 53 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n49\n3. Underpinning skills \n3.1 Planning own work including predicting consequences and \nidentifying improvements \n3.2 Interpreting from production requests the correct selection \nand using of equipment, materials, processes and \nprocedures \n3.3 Maintaining output and product quality using appropriate \ninstruments, controls, test information and readings \n3.4 Making adjustments to equipment operation to rectify \nvariations in equipment operation \n3.5 Checking blow molding machine for correct setup to job \nspecifications and implement adjustments or report \ndeviations immediately \n3.6 Starting up equipment and make appropriate adjustments \nto bring process on line \n3.7 Taking samples when required and identify product out of \nspecification \n3.8 Shutting down equipment in normal or abnormal \ncircumstances \n3.9 Identifying hazards of the materials and process and \nimplement appropriate procedures for hazard control \n3.10 Reading and interpreting typical product specifications, job \nsheets and material labels as provided to operators.\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 A bank of scenarios and questions \n4.2 Tools, equipment and workplace relevant with the \nrequirements for the job. \n4.3 Supplies and consumable materials \n4.4 Engineering manuals \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nDirect Observation with questioning \n5.2\nPortfolio assessment\n6. Context of \nassessment \nCompetency may be assessed individually in the actual \nworkplace or a simulated workplace environment.\n",
