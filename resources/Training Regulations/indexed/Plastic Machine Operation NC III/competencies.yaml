          "source_text": "1 \nPrepare  to \nchange dies \n1.1 Procedure for machine close-down is followed and concerned \npersonnel are informed as per workplace procedures. \n1.2 Last-off samples are taken as required for die reports \n1.3 Machine is shut down in accordance with workplace procedures \nand/or manufacturer’s instructions   \n1.4 Isolating locks are activated, power is disconnected and relevant \nsignage are posted as per workplace procedures \n1.5 Dies or cores are selected to match product/ process \nspecification \n1.6 Tools and equipment are checked for safe, effective operation. \n2 \nChange dies \n2.1 Removal process is planned to ensure no injury to self or others, \nand damage equipment  \n2.2 Die is removed, cleaned and stored according to workplace \nprocedures \n2.3 Replacement die is fitted ensuring that locating devices and \nmarks are matched and securing devices are installed and \ntightened to specification \n2.4 Dies and immediate machinery are cleaned, corrosion protection \napplied if required. \n3 \nTest fitting of \ndies \n3.1 Machine is restarted as per procedure \n3.2 Operation of die is checked against product quality \nspecifications \n3.3 Machine setting ranges is compared against documented \nrequirements \n3.4 First off sample is checked the for required standards \n3.5 Settings and other production variables are fine-tuned as \nrequired \n3.6 Variances between standard operating procedures and actual \nproduction run is noted  \n3.7 \nWorkplace documentation is completed and reported to \nappropriate personnel.\n\n--- PDF PAGE 38 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n34\n4 \nRespond to \nproblems \n4.1 Possible routine and non-routine problems in the equipment, \nmaterials or process are identified \n4.2 Problems needing action is determined according to workplace \nprocedures \n4.3 Possible fault causes are determined according to workplace \nprocedures \n4.4 Problems within area of responsibility are rectified using \nappropriate solutions \n4.5 \nProblems outside area of responsibility are reported to \ndesignated person.\n\n--- PDF PAGE 39 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n35\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Procedure \nProcedure means all relevant: \n1.1 \nWorkplace procedures \n1.2 \nWork instruction \n1.3 \nTemporary instructions \n1.4\nIndustry and government codes and standards\n2. Tools and equipment \n2.1 \nHand carts and trolleys \n2.2 \nhoist/lifting equipment \n2.3 \nbasic hand tools \n2.4\nPPE like gloves, hard hut, safety shoes\n3. Problems \nTypical problems include: \n3.1 \nlack of cleaning leading to corrosion \n3.2 \nInadequate fitting \n3.3\nfine adjustments to optimize production\n\n--- PDF PAGE 40 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n36"
        },
        "evidence_guide": {
          "source_text": "1. Critical \naspects of \ncompetency \nIt is essential that competence is demonstrated in the ability to perform \na die-change which will put the injection molding machine back into full \nproduction of in-specification product in standard time. \nAssessment requires evidence that the candidate: \n1.1 Selected, installed and checked the performance of die and cores \n1.2 Located, interpreted and applied relevant information  \n1.3 Maintained workplace records \n1.4 Identified and safely handled products and materials \n1.5 Applied safety precautions appropriate to the task \n1.6 Recognized potential situations requiring action and then \nimplement appropriate action.\n2. Underpinning \nknowledge \nand attitudes \n \n2.1 Injection/blow molding materials, equipment and process  \n2.2 Company’s procedures and relevant regulatory requirements  \n2.3 Explain: \n2.3.1 Impact of incorrect or faulty fitting \n2.3.2 Production workflow sequences \n2.3.3 Selection and use of equipment and procedures \n2.3.4 Hazards of the removal and fitting process and \nappropriate hazard control procedures \n2.3.5 The performance of dies \n2.3.6 Relevant information and workplace records \n2.3.7 Safety precautions appropriate to the task \n2.4 Causes of faults like faulty equipment, inadequate \nfitting/adjustment and incorrect process variables like temperature \nand pressure.\n3. Underpinning \nskills \n3.1 Plan own work including predicting consequences and identifying \nimprovements \n3.2 Using PPE, safe handling products and materials, reading \nrelevant safety information and applying safety precautions \nappropriate to the task. \n3.3 Starting up equipment and making appropriate adjustments to \nbring process on line \n3.4 Taking samples when required and identifying product out of \nspecifications \n3.5 Shutting down equipment in normal or abnormal circumstances  \n3.6 Identifying factors which may affect product quality or production \noutput and appropriate remedies \n3.7 Identifying and describing own role and role of others involved \ndirectly in the process\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Access to an operating plant or equipment  \n4.2 Tools, equipment and workplace relevant with the requirements \nfor the job. \n4.3 Supplies and consumable materials \n4.4 Engineering manuals relevant to the task to be performed\n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 Direct Observation with questioning \n5.2\nPortfolio\n6. Context of \nassessment \nCompetency may be assessed individually in the actual workplace or a \nsimulated workplace environment.",
