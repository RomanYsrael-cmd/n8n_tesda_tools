        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified the problem\n1.2\nDetermined the fundamental causes of the problem\n1.3\nDetermined the correct / preventive action\n1.4\nProvided recommendation to manager\nThese aspects may be best assessed using a range of scenarios\n/ case studies / what ifs as a stimulus with a walk through forming\npart of the response. These assessment activities should include\na range of problems, including new, unusual and improbable\nsituations that may have happened.\n2. Underpinning\nknowledge\n2.1\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-standard\nsituations\n2.2\nCompetence to include the ability to apply and explain,\nsufficient for the identification of fundamental cause,\ndetermining the corrective action and provision of\nrecommendations\n2.2.1\nRelevant equipment and operational processes\n2.2.2\nEnterprise goals, targets and measures\n2.2.3\nEnterprise quality, OHS and environmental\nrequirement\n2.2.4\nPrinciples of decision making strategies and\ntechniques\n2.2.5\nEnterprise information systems and data collation\n2.2.6\nIndustry codes and standards\n3. Underpinning\nskills\n3.1\nUsing range of formal problem solving techniques\n3.2\nIdentifying and clarifying the nature of the problem\n3.3\nDevising the best solution\n3.4\nEvaluating the solution\n3.5\nImplementation of a developed plan to rectify the problem\n\n--- PDF PAGE 18 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n14\n\n4. Resource\nimplications\n4.1\nAssessment will require access to an operating plant over\nan extended period of time, or a suitable method of\ngathering evidence of operating ability over a range of\nsituations. A bank of scenarios / case studies / what ifs will\nbe required as well as bank of questions which will be\nused to probe the reason behind the observable action.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Case studies on solving problems in the workplace\n5.2 Observation\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of\nparts of this unit of competency. Simulation should be based on\nthe actual workplace and will include walk through of the relevant\ncompetency components.\n6. Context of\nassessment\n6.1\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 19 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n15\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE :"
        },
        "source_text": "500311112\nUNIT DESCRIPTOR\n:\nThis unit of competencies covers the knowledge, skills and\nattitudes required to solve problems in the workplace\nincluding the application of problem solving techniques and\nto determine and resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1.\nIdentify the problem\n1.1\nVariances are identified from normal operating\nparameters; and product quality\n1.2\nExtent, cause and nature are of the problem are\ndefined through observation, investigation and\nanalytical techniques\n1.3\nProblems are clearly stated and specified\n2.\nDetermine\nfundamental causes\nof the problem\n2.1\nPossible causes are identified based on experience\nand the use of problem solving tools / analytical\ntechniques.\n2.2\nPossible cause statements are developed based on\nfindings\n2.3\nFundamental causes are identified per results of\ninvestigation conducted\n3.\nDetermine corrective\naction\n3.1\nAll possible options are considered for resolution of\nthe problem\n3.2\nStrengths and weaknesses of possible options are\nconsidered\n3.3\nCorrective actions are determined to resolve the\nproblem and possible future causes\n3.4\nAction plans are developed identifying measurable\nobjectives, resource needs and timelines in\naccordance with safety and operating procedures\n4.\nProvide\nrecommendation/s to\nmanager\n4.1\nReport on recommendations are prepared\n4.2\nRecommendations are presented to appropriate\npersonnel.\n4.3\nRecommendations are followed-up, if required\n\n--- PDF PAGE 16 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1\nBrainstorming\n1.2\nIntuitions/Logic\n1.3\nCause and effect diagrams\n1.4\nPareto analysis\n1.5\nSWOT analysis\n1.6\nGant chart, Pert CPM and graphs\n1.7\nScattergrams\n2. Problem\n\n2.1\nNon – routine process and quality problems\n2.2\nEquipment selection, availability and failure\n2.3\nTeamwork and work allocation problem\n2.4\nSafety and emergency situations and incidents\n3. Action plans\n\n3.1\nPriority requirements\n3.2\nMeasurable objectives\n3.3\nResource requirements\n3.4\nTimelines\n3.5\nCo-ordination and feedback requirements\n3.6\nSafety requirements\n3.7\nRisk assessment\n3.8\nEnvironmental requirements\n\n--- PDF PAGE 17 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n13\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified the problem\n1.2\nDetermined the fundamental causes of the problem\n1.3\nDetermined the correct / preventive action\n1.4\nProvided recommendation to manager\nThese aspects may be best assessed using a range of scenarios\n/ case studies / what ifs as a stimulus with a walk through forming\npart of the response. These assessment activities should include\na range of problems, including new, unusual and improbable\nsituations that may have happened.\n2. Underpinning\nknowledge\n2.1\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-standard\nsituations\n2.2\nCompetence to include the ability to apply and explain,\nsufficient for the identification of fundamental cause,\ndetermining the corrective action and provision of\nrecommendations\n2.2.1\nRelevant equipment and operational processes\n2.2.2\nEnterprise goals, targets and measures\n2.2.3\nEnterprise quality, OHS and environmental\nrequirement\n2.2.4\nPrinciples of decision making strategies and\ntechniques\n2.2.5\nEnterprise information systems and data collation\n2.2.6\nIndustry codes and standards\n3. Underpinning\nskills\n3.1\nUsing range of formal problem solving techniques\n3.2\nIdentifying and clarifying the nature of the problem\n3.3\nDevising the best solution\n3.4\nEvaluating the solution\n3.5\nImplementation of a developed plan to rectify the problem\n\n--- PDF PAGE 18 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n14\n\n4. Resource\nimplications\n4.1\nAssessment will require access to an operating plant over\nan extended period of time, or a suitable method of\ngathering evidence of operating ability over a range of\nsituations. A bank of scenarios / case studies / what ifs will\nbe required as well as bank of questions which will be\nused to probe the reason behind the observable action.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Case studies on solving problems in the workplace\n5.2 Observation\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of\nparts of this unit of competency. Simulation should be based on\nthe actual workplace and will include walk through of the relevant\ncompetency components.\n6. Context of\nassessment\n6.1\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 19 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n15\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE :"
