          {
            "number": 1,
            "title": "Plan own work",
            "performance_criteria": [
              {
                "number": "1.1",
                "text": "Equipment and processes used for production process and upstream and downstream operations are identified from production plan or request"
              },
              {
                "number": "1.2",
                "text": "Materials required including additives are identified based on work requirements"
              },
              {
                "number": "1.3",
                "text": "Hazards are recognized and appropriate hazard control/ minimization methods are followed"
              },
              {
                "number": "1.4",
                "text": "Emergency stops, guards and controls are identified and checked"
              },
              {
                "number": "1.5",
                "text": "Requirements for materials, quality, production and equipment checks are identified based on work requirements"
              },
              {
                "number": "1.6",
                "text": "Waste management and housekeeping needs are identified in accordance with workplace procedures and/or OH & S requirements."
              }
            ]
          },
          {
            "number": 2,
            "title": "Set up and",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "Equipment is set up to specifications"
              },
              {
                "number": "2.2",
                "text": "Blow molding equipment is set up and adjusted for shot size, parison control, die gap, temperature, screw speed, cycle speed, slow close setting (or cushion) and timing to specifications"
              },
              {
                "number": "2.3",
                "text": "Safety gates and guards are checked in their correct working positions and emergency stops are identified and checked as required"
              },
              {
                "number": "2.4",
                "text": "Equipment, raw material and mould are verified to match job requirement"
              },
              {
                "number": "2.5",
                "text": "Date, batch and material markings are set up according to procedures."
              },
              {
                "number": "2.6",
                "text": "Other pre-start checks are complete according to procedures"
              },
              {
                "number": "2.7",
                "text": "Equipment is started up and ‘dry run’ is performed to warm hydraulics and components to operating temperature before production, as required."
              }
            ]
          },
          {
            "number": 3,
            "title": "Operate and",
            "performance_criteria": [
              {
                "number": "3.1",
                "text": "Condition of equipment is checked and raw materials is introduced as required"
              },
              {
                "number": "3.2",
                "text": "Blow molding equipment is operate and key variables noted in accordance with workplace procedures"
              },
              {
                "number": "3.3",
                "text": "Controls/displays/terminals for production/process data are monitored in accordance with workplace procedures"
              },
              {
                "number": "3.4",
                "text": "Product/process quality is monitored according to procedures"
              },
              {
                "number": "3.5",
                "text": "Adjustments are made to remedy faults and nonconformity to standard as required"
              },
              {
                "number": "3.6",
                "text": "Continuity of process is maintained in accordance with workplace procedures"
              },
              {
                "number": "3.7",
                "text": "Scrap/trimming and other materials are collected and reprocessed/discarded according to procedures"
              },
              {
                "number": "3.8",
                "text": "Equipment is cleaned, adjusted and lubricated as required"
              },
              {
                "number": "3.9",
                "text": "Logs and records are completed as required --- PDF PAGE 50 --- TR-PLASTIC MACHINE OPERATION NC III Promulgated 46"
              },
              {
                "number": "3.10",
                "text": "Equipment is paused or stopped in an emergency following standard operating procedures."
              }
            ]
          },
          {
            "number": 4,
            "title": "Respond to",
            "performance_criteria": [
              {
                "number": "4.1",
                "text": "Possible routine and non-routine problems in the equipment, materials or process are identified in accordance with workplace procedures"
              },
              {
                "number": "4.2",
                "text": "Problems needing action are determined in accordance with workplace procedures"
              },
              {
                "number": "4.3",
                "text": "Possible fault causes are determine in accordance with workplace procedures"
              },
              {
                "number": "4.4",
                "text": "Problems within area of responsibility are rectified using appropriate solutions"
              },
              {
                "number": "4.5",
                "text": "Problems outside area of responsibility are reported to designated person. --- PDF PAGE 51 --- TR-PLASTIC MACHINE OPERATION NC III Promulgated 47 RANGE OF VARIABLES VARIABLE RANGE"
