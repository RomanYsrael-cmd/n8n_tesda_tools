          "source_text": "1. Critical\naspects of\ncompetency\nIt is essential that competence is demonstrated in the ability to perform\na die-change which will put the injection molding machine back into full\nproduction of in-specification product in standard time.\nAssessment requires evidence that the candidate:\n1.1 Selected, installed and checked the performance of die and cores\n1.2 Located, interpreted and applied relevant information\n1.3 Maintained workplace records\n1.4 Identified and safely handled products and materials\n1.5 Applied safety precautions appropriate to the task\n1.6 Recognized potential situations requiring action and then\nimplement appropriate action.\n2. Underpinning\nknowledge\nand attitudes\n\n2.1 Injection/blow molding materials, equipment and process\n2.2 Company’s procedures and relevant regulatory requirements\n2.3 Explain:\n2.3.1 Impact of incorrect or faulty fitting\n2.3.2 Production workflow sequences\n2.3.3 Selection and use of equipment and procedures\n2.3.4 Hazards of the removal and fitting process and\nappropriate hazard control procedures\n2.3.5 The performance of dies\n2.3.6 Relevant information and workplace records\n2.3.7 Safety precautions appropriate to the task\n2.4 Causes of faults like faulty equipment, inadequate\nfitting/adjustment and incorrect process variables like temperature\nand pressure.\n3. Underpinning\nskills\n3.1 Plan own work including predicting consequences and identifying\nimprovements\n3.2 Using PPE, safe handling products and materials, reading\nrelevant safety information and applying safety precautions\nappropriate to the task.\n3.3 Starting up equipment and making appropriate adjustments to\nbring process on line\n3.4 Taking samples when required and identifying product out of\nspecifications\n3.5 Shutting down equipment in normal or abnormal circumstances\n3.6 Identifying factors which may affect product quality or production\noutput and appropriate remedies\n3.7 Identifying and describing own role and role of others involved\ndirectly in the process\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Access to an operating plant or equipment\n4.2 Tools, equipment and workplace relevant with the requirements\nfor the job.\n4.3 Supplies and consumable materials\n4.4 Engineering manuals relevant to the task to be performed\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Direct Observation with questioning\n5.2\nPortfolio\n6. Context of\nassessment\nCompetency may be assessed individually in the actual workplace or a\nsimulated workplace environment.\n\n--- PDF PAGE 41 ---\nTR-PLASTIC MACHINE OPERATION NC III Promulgated\n\n37\nUNIT OF COMPETENCY\n:\nPREPARE AND START EQUIPMENT FOR\nPRODUCTION\nUNIT CODE\n\n :"
