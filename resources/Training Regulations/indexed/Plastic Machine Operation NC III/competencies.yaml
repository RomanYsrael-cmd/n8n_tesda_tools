        "source_title": "PREPARE AND START EQUIPMENT FOR PRODUCTION",
        "source_text": "--- PDF PAGE 41 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n37\nUNIT OF COMPETENCY \n: \nPREPARE AND START EQUIPMENT FOR \nPRODUCTION \nUNIT CODE \n \n     : \n \nALT823309 \n \nUNIT DESCRIPTOR \n : \n \nThis competency covers the pre-start preparations  \nand start-up operations to bring a production  \nmachine from ‘power-off’ to first-off product and  \nhandover to the operator to continue the  \nproduction run (for Injection and blow molding  \nmachine). \nThis competency is typically performed by senior  \noperators working either independently or as part  \nof a work team. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Perform pre-\nstart checks \n1.1 Emergency stops, guards, controls are checked in accordance \nwith workplace procedures \n1.2 Copy of the product data sheet is collected  \n1.3 Requirements for materials, quality, production run are identified \n1.4 Head/die bolts, etc, are retightened as required \n1.5 Equipment set-up is checked in accordance with workplace \nprocedures \n2. Carry out pre-\nstart operations\n2.1 Power is restored to the machine and ancillary equipment as per \nworkplace procedures and/or manufacturer’s instruction \n2.2 Ancillary equipment/heater circuit is started up and the \ntemperature and other controllers to the condition stated on the \nsetup information card is set in accordance with workplace \nprocedures and/or manufacturer’s instruction \n2.3 Machine settings is checked against setup information card and \nmachine switch on in accordance with workplace procedures \nand/or manufacturer’s instruction \n2.4 Machine is brought to operational readiness in accordance with \nworkplace procedures \n2.5 Material is selected and loaded in accordance with workplace \nprocedures \n2.6 Machine is charged, purged and cleaned as required. \n3. Start machine \nand hand over \nto operator \n3.1 Machine is started and checked in accordance with workplace \nprocedures and/or manufacturer’s instruction \n3.2 Machine is adjusted to bring to machine to operational speed/ \ncondition, as required \n3.3 Machine is checked and ran until a quality product is obtained \n3.4 Adjustments to machine and extra equipment is made in line to \nproduce an acceptable product \n3.5 Required adjustments are made to ensure the machine and its \nupstream and downstream extra equipment in line are in \nbalance \n3.6 Operator is given all necessary instructions and machine is \nhanded over to the operator\n\n--- PDF PAGE 42 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n38\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Procedures \n1.1 \nWorkplace procedures   \n1.2 \nWork instructions  \n1.3 \nInstructions and relevant industry and government \ncodes and standards\n2. Machine setting \n2.1 \nbasic controls \n2.2 \nshot size and correction capacity \n2.3 \ninjection speed \n2.4 \nscrew position \n2.5 \ninjection pressure \n2.6 \nscrew back time \n2.7 \nmelt decompress position \n2.8\nsprue break\n3. Machine \n3.1 \nInjection molding machine \n3.2\nBlow molding machine\n4. Upstream and \ndownstream extra \nequipment \n4.1 \nElectrical, pneumatic, mechanical, electromechanical \nand hydraulic injection molding machines and \ncomponents such as base, frame, feed hoppers and \nmaterial supply mechanisms, barrel and screw \nplastification unit, injection units, die/mould tool \n4.2 \nAdditional equipment including chillers/cooling \ntowers, die heating equipment, hopper driers, mixing \nhoppers, dehumidifying driers, air compressors, \ndosing machines, color blending equipment and \nconveyors where they are integral to the operation of \nthe injection molder \n4.3 \nHand tools used in the injection molding process \n4.4 \nMaterial loading equipment used for loading of raw \nmaterials like belt or steel conveyor \n4.5 \nRelevant personal protective equipment like gloves, \nsafety shoes, hard hut, face shield\n\n--- PDF PAGE 43 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n39\nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Performed pre-start checks \n1.2 Carried out pre-start operations \n1.3 Started machine and handed over to operator\n2. Underpinning \nknowledge and \nattitudes \n \n2.1  Materials, equipment and process sufficient to recognize out-of-\nspecification process problems and equipment \n2.2 Company’s procedures and relevant regulatory requirements  \n2.3 Explain: \n2.3.1 machine construction \n2.3.2 machine safety interlocks and systems \n2.3.3 principles of operation \n2.3.4 machine controls, their identification and function \n2.3.5 impact of incorrect or faulty setup \n2.3.6 production workflow sequences \n2.3.7 correct selection and use of equipment and procedures \n2.3.8 hazards of the removal and fitting process and appropriate \nhazard control procedures \n2.3.9 the performance of dies and cores \n2.3.10 relevant information and workplace records \n2.3.11 safety precautions appropriate to the task \n2.3.12 distinguish between causes of faults like faulty equipment  \nand standard process variables\n3. Underpinning \nskills \n3.1 Plan own work including predicting consequences and identifying \nimprovements \n3.2 Starting up equipment and making appropriate adjustments to \nbring process on line \n3.3 Taking samples when required and identifying product out of \nspecification \n3.4 Shut down equipment in normal or abnormal circumstances \n3.5 Identifying factors which may affect standard product quality or \nproduction output \n3.6 Identifying hazards of the materials and process and taking \nappropriate hazard control \n3.7 Using PPE, safe handling products and materials, reading relevant \nsafety information and applying safety precautions appropriate to \nthe task \n3.8 Reading and interpreting technical specifications and production \nschedules  \n3.9 Calculating cycle times and production rates.  \n3.10 Setting and interpreting numeric data \n3.11 Verbal communication skills\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Access to an operating plant or equipment  \n4.2 Tools and equipment relevant to the activity  \n4.3 Supplies and consumable materials \n4.4 Engineering manuals \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 Direct Observation with questioning \n5.2 Portfolio assessment\n6. Context of \nassessment \nCompetency may be assessed individually in the actual workplace or a \nsimulated workplace environment.\n",
