        "source_title": "PERFORM SHOP MAINTENANCE",
        "source_text": "--- PDF PAGE 34 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n30\nUNIT OF COMPETENCY :     PERFORM SHOP MAINTENANCE  \n \nUNIT CODE \n \n \n: \nALT723205 \n \nUNIT DESCRIPTOR \n:    This unit deals with inspecting and cleaning of work area \nincluding tools, equipment and facilities. Storage and checking \nof tools/ equipment and disposal of used supplies/materials are \nalso incorporated in this competency. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools \nand work area \n1.1 \nCleaning solvent used as per workshop/tools \ncleaning requirement \n1.2 \nWork area is checked and cleaned \n1.3\nWet surface/spot in work area is wiped and dried\n2. Store/arrange tools and \nshop equipment \n \n2.1    Tools/equipment are checked and stored in their \nrespective shelves/location \n2.2 \nCorresponding labels are posted and visible \n2.3\nTools are safely secured and logged in the records\n3. Dispose wastes/used \nlubricants \n3.1 \nContainers for used lubricants are  visibly labeled \n3.2 \nWastes/used lubricants are disposed as per \nworkshop SOP\n4. Report damaged \ntools/equipment \n \n4.1 \nComplete inventory of tools/equipment is maintained \n4.2 \nDamaged tools/equipment/facilities are identified and \nrepair recommendation is given \n4.3 \nReports prepared has no error/discrepancy\n\n--- PDF PAGE 35 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n31\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Work area \nWork areas include: \n1.1 \nWorkshop areas for servicing/repairing light and/or heavy \nvehicle and/or plant transmissions and/or outdoor power \nequipment \n1.2 \nOpen workshop/garage and enclosed, ventilated office area \n1.3 \nOther variables may include workshop with: \n Mess hall \n Wash room \n\nComfort room\n2.  Cleaning   \nrequirement \n2.1 \nCleaning solvent \n2.2 \nInventory of  supplies, tools, equipment, facilities \n2.3 \nList of mechanics/technicians  \n2.4 \nRags \n2.5 \nBroom \n2.6 \nMop \n2.7 \nPail \n2.8 \nUsed oil container \n2.9 \nOiler \n2.10 Dust/waste bin\n3.  Manuals \n3.1  Vehicle/plant manufacturer specifications \n3.2  Company operating procedures \n3.3  Industry/Workplace Codes of Practice \n3.4  Product manufacturer specifications \n3.5  Customer requirements \n3.6\nIndustry Occupational Health and Safety \n4.  Company standard \noperating procedure \nWearing of Personal protective equipment include: \n4.1  Gloves \n4.2  Apron \n4.3  Goggles \n4.4 \nSafety shoes\n\n--- PDF PAGE 36 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n32\nEVIDENCE GUIDE \n1.  Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 \nCleaned workshop tools/facilities \n1.2 \nMaintained equipment, tools and facilities \n1.3 \nDisposed wastes and used lubricants/fluid as per required   \nprocedure\n2.  Underpinning \nknowledge and \nattitudes \n2.1  5 S or TQM \n2.2  Service procedures \n2.3  Relevant technical information \n2.4  Safe handling of equipment and tools  \n2.5  Vehicle safety requirements \n2.6  Workshop policies \n2.7  Personal safety procedures \n2.8  Fire extinguishers and prevention \n2.9  Storage/disposal of hazardous/flammable materials \n2.10  Positive Work Values (Perseverance, Honesty, Patience, \nAttention to Details)\n3.  Underpinning \nskills \n3.1  Handling/Storing of tools/equipment/supplies and material \n3.2  Cleaning grease/lubricants \n3.3  Disposing of wastes and fluid \n3.4  Preparing inventory of s/m and tools and equipment \n3.5 \nMonitoring of s/m and tools/equipment\n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1  Workplace: Real or simulated work area \n4.2  Appropriate Tools & equipment \n4.3 \nMaterials relevant to the activity \n5.  Method of \nassessment \nCompetency MUST be assessed through: \n5.1  Written/Oral  Questioning \n5.2 \nDemonstration\n6.  Context of  \nassessment \n6.1 \nCompetency must be assessed on the job or in a simulated \nenvironment. \n6.2 \nThe assessment of practical skills must take place after a period \nof supervised practice and repetitive experience.\n",
