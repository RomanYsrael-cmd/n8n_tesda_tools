        "source_title": "LEAD SMALL TEAMS",
        "source_text": "--- PDF PAGE 9 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n5\nUNIT OF COMPETENCY \n:    LEAD SMALL TEAMS \n \nUNIT CODE \n               :    500311110 \n \nUNIT DESCRIPTOR             \n   :   This unit covers the knowledge, skills and attitudes to  \n \n \n        lead small teams including setting and maintaining  \n  \n \n        team and individual performance standards. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\n1. Provide team \nleadership \n1.1 \nWork requirements are identified and presented to \nteam members \n1.2 \nReasons for instructions and requirements are \ncommunicated to team members \n1.3 \nTeam members’ queries and concerns are \nrecognized, discussed and dealt with\n2. Assign responsibilities \n2.1 \nDuties,  and responsibilities are allocated having \nregard to the skills, knowledge and aptitude required \nto properly undertake the assigned  task and \naccording to company policy \n2.2 \nDuties are allocated having regard to individual \npreference, domestic and personal considerations, \nwhenever possible \n3. Set performance \nexpectations for team \nmembers \n3.1 \nPerformance expectations are established based on \nclient needs and according to assignment \nrequirements \n3.2 \nPerformance expectations are based on individual \nteam members duties and area of responsibility \n3.3 \nPerformance expectations are discussed and \ndisseminated to individual team members\n4. Supervised team \nperformance \n4.1 \nMonitoring of performance takes place against \ndefined performance criteria and/or assignment \ninstructions and corrective action taken if required \n4.2 \nTeam members are provided with feedback, positive \nsupport and advice on strategies to overcome any \ndeficiencies \n4.3 \nPerformance issues which cannot be rectified or \naddressed within the team are referenced to \nappropriate personnel according to employer policy \n4.4 \nTeam members are kept informed of any changes in \nthe priority allocated to assignments or tasks which \nmight impact on client/customer needs and \nsatisfaction \n4.5 \nTeam operations are monitored to ensure that \nemployer/client needs and requirements are met \n4.6 \nFollow-up communication is provided on all issues \naffecting the team \n4.7 \nAll relevant documentation is completed in \naccordance with company procedures\n\n--- PDF PAGE 10 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n6\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work requirements \n1.1 \nClient Profile \n1.2 \nAssignment instructions \n2. Team member’s concerns \n2.1 \nRoster/shift details \n3. Monitor performance \n3.1 \nFormal process \n3.2 \nInformal process \n4. Feedback \n4.1 \nFormal process \n4.2 \nInformal process \n5. Performance issues \n5.1 \nWork output \n5.2 \nWork quality \n5.3 \nTeam participation \n5.4 \nCompliance with workplace protocols \n5.5 \nSafety \n5.6 \nCustomer service\n\n--- PDF PAGE 11 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n7\nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate: \n1.1 Maintained or improved individuals and/or team \nperformance given a variety of possible scenario \n1.2 \nAssessed and monitored team and individual performance \nagainst set criteria \n1.3 \nRepresented concerns of a team and individual to next level \nof management or appropriate specialist and to negotiate on \ntheir behalf \n1.4 \nAllocated duties and responsibilities, having regard to   \nindividual’s knowledge, skills and aptitude and the needs of \nthe tasks to be performed \n1.5 \nSet and communicated performance expectations for a \nrange of tasks and duties within the team and provided \nfeedback to team members\n2. Underpinning \nknowledge \n2.1 \nCompany policies and procedures \n2.2 \nRelevant legal requirements \n2.3 \nHow performance expectations are set \n2.4 \nMethods of Monitoring Performance \n2.5 \nClient expectations \n2.6\nTeam member’s duties and responsibilities\n3. Underpinning \nskills \n3.1 \nCommunication skills required for leading teams \n3.2 \nInformal performance counseling skills \n3.3 \nTeam building skills \n3.4\nNegotiating skills\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n4.2\nMaterials relevant to the proposed activity or task\n5. Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDirect observations of work activities of the individual \nmember in relation to the work activities of the group \n5.2 \nObservation of simulation and/or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n5.3 \nCase studies and scenarios as a basis for discussion of    \nissues and strategies in teamwork\n6. Context of \nassessment \n6.1 \nCompetency assessment may occur in workplace or any \nappropriately simulated environment \n6.2 \nAssessment shall be observed while task are being \nundertaken whether individually or in-group\n",
