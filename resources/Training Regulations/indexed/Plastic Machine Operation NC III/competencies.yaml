        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Identified critical material properties and blow molding \nprocess characteristics in relation to the process \nrequirements and the end product \n1.2 Planned own work process within workplace procedures \nand explained the reasons for the steps in the process \n1.3 Operated and made adjustments as required to the blow \nmolding process \n1.4 Took appropriate action to observe equipment, materials \nand products for out of specification results and identified \nproblems to be reported. \n1.5 Demonstrated consistent performance particularly to see \nthat: \n1.5.1 production quality and output standards are met \nconsistently \n1.5.2 problems are anticipated from process observations \n1.5.3 problems are efficiently resolved \n1.5.4 the process runs consistently and smoothly  \n2. Underpinning \nknowledge and \nattitudes \n \n2.1 Knowledge of the materials, equipment and process \nsufficient to recognize conditions which may lead to out of \nspecification production. \n2.2 Company’s procedures and relevant regulatory \nrequirements along with the ability to implement them \nwithin appropriate time constraints and work standards. \n2.3 Competence includes the ability for the practical \ncompletion of the job to: \n2.4 Operation of blow molding equipment and components \n2.5 Production workflow sequences and materials demand \n2.6 Reasons for checking process control panels and reporting \nreadings which do not conform to the work instructions \n2.7 Purpose and requirements of ‘dry running’ before starting \nproduction \n2.8 Approved hazard control and safety procedures and the \nuse of PPE in relation to handling materials, equipment \noperation and clean up \n2.9 Correct selection and use of equipment, materials, \nprocesses and procedures \n2.10 Hierarchy of control including engineering controls \n2.11 Impact of variations in raw materials and equipment \noperation in relation to final product \n2.12 Changes to materials at various stages of production\n\n--- PDF PAGE 53 ---\nTR-PLASTIC MACHINE OPERATION NC III         Promulgated                                            \n \n49\n3. Underpinning skills \n3.1 Planning own work including predicting consequences and \nidentifying improvements \n3.2 Interpreting from production requests the correct selection \nand using of equipment, materials, processes and \nprocedures \n3.3 Maintaining output and product quality using appropriate \ninstruments, controls, test information and readings \n3.4 Making adjustments to equipment operation to rectify \nvariations in equipment operation \n3.5 Checking blow molding machine for correct setup to job \nspecifications and implement adjustments or report \ndeviations immediately \n3.6 Starting up equipment and make appropriate adjustments \nto bring process on line \n3.7 Taking samples when required and identify product out of \nspecification \n3.8 Shutting down equipment in normal or abnormal \ncircumstances \n3.9 Identifying hazards of the materials and process and \nimplement appropriate procedures for hazard control \n3.10 Reading and interpreting typical product specifications, job \nsheets and material labels as provided to operators.\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 A bank of scenarios and questions \n4.2 Tools, equipment and workplace relevant with the \nrequirements for the job. \n4.3 Supplies and consumable materials \n4.4 Engineering manuals \n5. Method of \nassessment \nCompetency MUST be assessed through: \n5.1 \nDirect Observation with questioning \n5.2\nPortfolio assessment\n6. Context of \nassessment \nCompetency may be assessed individually in the actual \nworkplace or a simulated workplace environment.",
