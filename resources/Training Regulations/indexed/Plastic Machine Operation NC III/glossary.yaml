  "source_text": "1. Die\nA former used to give the required shape to the product and which is\nused under pressure. Dies are typically used in the extrusion, injection,\nblow moulding and general rubber sectors. Dies used which are not\nsubject to pressure are referred to as ‘moulds’ in this Training Package.\n2. PPE\nPersonal Protective Equipment – the last line of defense against\nworkplace hazards – includes things like safety boots, gloves, goggles,\near muffs.\n3. Routine\nProblems\nTo ‘rectify routine problems’ means ‘apply known solutions to a limited\nrange of predictable problems’.\n4. OH & S\nOccupational health and safety\n\n5. Composites\nProducts consisting of a polymer matrix and a continuous layered\nreinforcing media. The reinforcing media include fiber, filament and cloth.\nThe product is generally hand or machine fabricated.\n6. Calibration\n\nInstruments and other measuring equipment are calibrated to make sure\nthe readings they yield are correct.\nTo calibrate an instrument/item of equipment is a high level unit of\ncompetency.\nTo check the calibration of an instrument/item of equipment is a routine\npart of using it and may be as simple as checking the date the calibration\ncertificate expires.\n7. Engineering\nControl\nA subset of the hierarchy of control.\n8. Hierarchy of\nControl\nThe preferred order of risk control measures from most to least preferred,\nthat is:\n elimination\n substitution\n engineering controls\n administrative controls\n personal protective equipment.\n\n9. Integral\nEquipment which forms part of the operation of a main item of equipment\nis regarded as ‘integral’ to that main item.\nExamples include feed hoppers (and even blending feed hoppers) and\nheating and cooling devices.\nTypically equipment will be regarded as being ‘integral’ to the main item\nif:\n it is close/attached to the main item\n it has simultaneous operation with the main item\n it does not require significant additional knowledge or skills.\nEquipment is not integral if it has independent operation of its own.\n\n--- PDF PAGE 64 ---\nTR-PLASTIC INJECTION MOLDING NC III Promulgated\n60",
