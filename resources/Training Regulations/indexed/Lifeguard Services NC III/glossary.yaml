  "source_text": "Action\n- Third stage of a rescue; developing a plan and effecting the rescue.\nAdvance Life Support\n (ALS)\n- The addition of oxygen and the administering of some drugs as an\nextension of Basic Life Support (BLS) techniques.\nAED\n- Automatic external defibrillator.\nAfter care\n- Fourth stage of a rescue; giving aid until medical teams arrives.\nAirway\n- Passage by which air enters and leaves the lungs.\nALS-\n- Advance Life Support.\nAquacode\n- Three, easy-to-remember rules of water safety.\nArmpit tow\n- A contact tow used for a cooperative weak, tired, or injured casualty.\nAssessment\n- Second stage of rescue; making informed judgments.\nAssisted Lift\n- A method used to land an uncooperative casualty from deep water.\nAwareness\n- First stage of a rescue; recognizing an emergency\n\naccepting responsibility.\nBack blow\n- Blow given between the shoulder blades, with the heel of the hand,\nin the direction of the head.\nBackstroke\n- A swimming stroke developed from a back float used in survival,\ncompetition and recreation.\nBasic Life Support (BLS) - The skill which will save life in an emergency. These skills include\nairway managements, rescue breathing, and cardiac compressions.\nSince 2006, organizations throughout the world have included\nunderstanding of defibrillation as a part of BLS.\nBeach Safety Flags\n- An item of colored fabric or synthetic material, of an oblong or\nsquare shape, attached by one edge to a pole or rope and used to\ngive a safety message.\nBLS\n- Basic Life Support\nBreaststroke\n- A swimming stroke used in survival, rescue, competition recreation.\nBuoyant\n- Capable of keeping float.\nButterfly\n- A completive swimming stroke developed from breaststroke.\nCapsize\n- To overturn of sink a craft.\nCardiac arrest\n- Cessation of heart beat.\nCardiopulmonary\nResuscitation (CPR)\n- Combines rescue breathing and chest compressions.\nChest compressions\n- Compression of the sternum to provide circulation to sustain life\nChin lift\n- The technique of supporting the jaw to prevent the tongue from\nBlocking the airway.\nCompact jump\n- A feet-first entry into deep water from a height of more than one\nmeter.\nCompetency test\n- Test which requires demonstration of current skill level.\nCPR\n- Cardiopulmonary resuscitation.\nCross chest tow\n- A contact tow used to retrieve an unconscious person in rough\nconditions.\nCurrent\n- Portion of a body of water moving in a certain direction.\n\n--- PDF PAGE 170 ---\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 Page 165\nDanger\n- Signal word used to indicate an imminently hazardous situation\nwhich, if not avoided, will result in death or serious injury.\nDeep\n- Extending far below surface of water and beyond where a person\ncan stand\nDefensive position\n- Position which allows a rescuer to take back away quickly.\nDefibrillation\n- The use of an electric shock to stop ventricular fibrillation.\nDefibrillator\n- An electrical machine which is used to reverse electrical\nabnormalities in the heart.\nDouble shoulder tow\n- contact tow, which permits high head elevation of an unconscious\ncasualty.\nDOH\n- Department of Health\nDrowning\n- The\nprocess\nof\nexperiencing\nrespiratory\nimpairment\nfrom\nsubmersion/immersion from liquid.\nEAR\n- Expired Air Resuscitation\nEddy\n- Whirlpool in the water created by a current.\nEggbeater kick\n- Powerful trending water technique useful in rescues.\nEmergency care\n- The aid given to the injured or suddenly ill by the first person on the\nscene.\nExpiration\n- Breathing out.\nExtended arm rollover\n- Method of turning over a face-down person, with a suspected spinal\ninjury, in water shallower than waist depth.\nFirst aid\n- Initial of emergency help given to a casualty.\nFreestyle\n- A fast swimming stroke used in competition, survival, rescue and\nrecreation.\nHazard\n- Potential source of harm\nHead tow\n- A contact tow using a firm grip on the head used to retrieve an\nunconscious person.\nHeat stroke\n- A severe, life threatening form of heat illness.\nHeart attack\n- Damage to the heart muscle due to interruption of its blood supply.\nHELP\n- Heat Escape Lessening Posture.\nHorizontal\n- Parallel to the surface of the water.\nHuddle technique\n- Small group survival technique using the same principals as the\nHELP technique.\nHydrodynamic lift\n- The force created by the unequal velocity of fluid flowing past each\nside of a body which is non-symmetrical to the flow.\nHyperthermia\n- Condition on the body when the core temperature rises above\n39degrees Celsius.\nHyperventilation\n- Excessive oxygenation of the blood resulting a rapid decrease\n\n in carbon dioxide.\nHypothermia\n- Occurs when exposure to cold air or cold water causes the body’s\ncore temperature to fall below 35 degrees Celsius.\nILCOR\n- International Liaison Committee on Resuscitation\nILS\n- International Life Saving Federation\nImmerse\n- To place under water.\nInitiative test\n- Assessment of a simulated rescue situation.\nIRB\n- Inflatable Rescue Boat\nInspiration\n- Breathing in.\n\n--- PDF PAGE 171 ---\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 Page 166\nLanding\n- Any method used to remove a casualty from the water.\nLifeguard\n- Lifesaver, whether voluntary of paid, who has professional\nResponsibility for the safety of others.\nLifesaving\n- Saving of life through prevention of accident, personal Survival and\nrescue of others.\nLongitudinal\n- Along the surface of the water.\nNTC\n- National Telecommunication Commission\nNear drowning\n- Survival or a casualty after immersion accident.\nOxygen\n- Gas essential for life and which makes up to 21 per cent of\natmospheric air.\nPFD\n- Personal flotation device.\nPiggyback carry\n- A landing technique where casualty is placed on the rescuer’s back.\nPropulsion\n- Any force which drives the body through the water.\nPulmonary\n- Pertaining to or connected to the lungs.\nReach rescue\n- A safe method of rescue where the rescuer reaches with an aid to\nassist the person in difficulty.\nRecovery position\n- Position in which an unconscious casualty is placed to allow\nobservation of breathing and prevent obstruction the airway.\nRescue breathing\n- Blowing air into a casualty’s mouth or nose to maintain life when\nbreathing has stopped.\nRespiration\n- The process of using oxygen to obtain energy in cells.\nRespiratory failure\n- A person’s breathing becomes inadequate or stops completely.\nResuscitation\n- The preservation or restoration of life by the establishment and/or\nmaintenance of airway, breathing and circulation, and related\nemergency care.\nRip\n- Fast-flowing body of water moving out to sea.\nRisk\n- Combination of the probability of occurrence of harm and the\nseverity of that harm\nRNLI\n- Royal National Lifeboat Institution of UK\nRow rescue\n- A method of rescue where the rescuer uses water craft to get closer\nto a person in difficulty.\nSculling\n- Movements of the hands, i a curved pattern, through the water to\ncreate a propulsive force.\nShoulder carry\n- A landing technique where the casualty is placed over the rescuer’s\nshoulder.\nSidestroke\n- A swimming stroke used in survival, rescue, competition and\nrecreation.\nSkill\n- An ability, usually learned and acquired through training, to perform\nactions which achieve a desired outcome.\nSmall Craft\n- Ranged of non- motorized water craft designed for personal use.\nSnag\n- An obstacle (e.g. a tree or rock) on the bottom of a waterway forming\nan impediment or danger to navigation.\nSnorkel\n- Tube designed to allow a swimmer to breathe while face down in the\nwater.\nSpinal cord injury\n- Damage to the bundle of nerves which extends from the brain to the\nlower back.\n\n--- PDF PAGE 172 ---\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 Page 167\nSternum\n- Flat bone, lying in the front of the chest, to which most of the ribs are\nattached.\nStirrup lift\n- An assisted lift from deep water when the casualty can cooperate.\nStopper\n- Suction eddy created in fast-flowing currents on the Downstream\nside of rock formations and artificial structures.\nStroke\n- Damage to the brain due to sudden blockage, or rupture of blood\nvessel in the brain.\nSupport tow\n- A contact tow used for a non-breathing unconscious casualty.\nSurvival backstroke\n- A swimming stroke which is effective for both survival and Rescue\nsituations.\nSwim rescue\n- An accompanied rescue performed by a competent swimmer.\nTalk rescue\n- The safest rescue method, using voice and gestures to assist the\nPerson in difficulty.\nThrow rescue\n- A safe method of rescue where the rescuer throws a rope or\nBuoyant aid to assist the person in difficulty.\nTidal volume\n- Volume of gas moved during each respiratory cycle.\nTow rescue\n- A method of rescue.\nTriage\n- Where there is more than one casualty, the sorting and Allocating of\naid on the basis or urgency or need.\nTurbulence\n- Current in which the motion of the water at any point is disrupted in\nmagnitude and direction.\nUSLA\n- United States Lifesaving Association\nVertical\n- Perpendicular (at 90 degrees) to the surface of the water.\nVice grip\n- Method of turning over a face-down person, with a suspected spinal\ninjury, in the water deeper than waist depth.\nVice grip tow\n- A contact tow for an unconscious casualty with a suspected spinal\ninjury.\nWade rescue\n- A method of rescue where the rescuer wades into the water to be\nable to carry out a reach or throw rescue.\nWave\n- A ridge or swell which forms on the surface of the water.\nWrist tow\n- A contact tow used for a cooperative weak, tired, or injured Casualty.\n\n--- PDF PAGE 173 ---\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 Page 168",
