    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior assessment 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. 4.2.3.1 Qualification of Competency Assessors For Trainer-Assessor • Holder of National TVET Trainer Certificate Level I (NTTC) on Lifeguard Services NC III with at least 4 years relevant industry experience • Computer literate • Physically able and mentally fit certified by Public Health Officer For Industry-Assessor • Holder of National Certificate in Lifeguard Services NC III in all field of specialization • Holder of Certificate of Competency (COC) in Conduct Competency under the Trainers Methodology Level I (TM I) • Have at least 4 years relevant industry experience in their specific field of specialization. (Leisure Pool, Beach, River and Lake and Surf) • Computer literate • Physically and mentally fit certified by Public Health Officer"
