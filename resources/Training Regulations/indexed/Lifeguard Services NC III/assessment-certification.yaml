  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1.\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n4.2.1 To attain the National Qualification of LIFEGUARD SERVICES NC III, the candidate\nmust demonstrate competence through a project-type assessment covering in all units\nlisted in Section 1. Successful candidates shall be awarded a National Certificate signed\nby the TESDA Director General.\n4.2.2 Demonstration of competence through project-type assessment covering all the required\nunits of the qualification.\n4.2.3 Assessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n4.2.4 The following are qualified to apply for assessment and certification:\n4.2.4.1 Graduates of training programs related to lifeguard services\n4.2.4.2 Experienced workers in lifeguard services/industry\n4.2.5 Reassessment is allowed only after one month from the date of assessment.\nReassessment for a National Certificate shall be done only on the task/s that the\ncandidate did not successfully achieve.\n4.2.6 A candidate who fails the assessment for two (2) consecutive times will be required to\ngo through a refresher course before taking another assessment.\n4.2.7 Only certified individuals in this Qualification may be nominated by the industry sector\nfor accreditation as competency assessor.\n4.2.8 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the “Philippine TVET Competency Assessment and Certification\nSystem PTCACS)”.\n\n4.2.\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the\ncandidate prior to actual competency assessment. SAG is a pre-assessment tool\nto help the candidate and the assessor determine what evidence is available,\nwhere gaps exist, including readiness for assessment.\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\n\n--- PDF PAGE 167 ---\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 Page 162\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior assessment\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA\nis authorized to conduct competency assessment. Assessment centers undergo\na quality assured procedure for accreditation before they are authorized by\nTESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n4.2.3.1\nQualification of Competency Assessors\n\nFor Trainer-Assessor\n• Holder of National TVET Trainer Certificate Level I (NTTC) on\nLifeguard Services NC III with at least 4 years relevant industry\nexperience\n• Computer literate\n• Physically able and mentally fit certified by Public Health Officer\n\nFor Industry-Assessor\n• Holder of National Certificate in Lifeguard Services NC III in all\nfield of specialization\n• Holder of Certificate of Competency (COC) in Conduct\nCompetency under the Trainers Methodology Level I (TM I)\n• Have at least 4 years relevant industry experience in their\nspecific field of specialization. (Leisure Pool, Beach, River and\nLake and Surf)\n• Computer literate\n• Physically and mentally fit certified by Public Health Officer\n\n--- PDF PAGE 168 ---\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 Page 163\n\n"
