      "source_text": "TESDA shall provide training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to include\nTechnology, Science, Math, English/Communication, and Safety to Environment.\nIncludes also green technology, issues on health and drugs and cater to person with\ndisabilities (PWD’s).\n\nCourse Title: LIFEGUARD SERVICES NC Level NC III\n\nNominal Training Duration:\n\n 20 hrs.\nBasic Competencies\n 240 hrs.\nCommon Competencies\n\n1520 hrs.\nCore Competencies\n(to include 800 Hrs. Supervised Lifeguard Industry Training\n(SLIT))\nTotal\n1780 hrs.\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills of\na Leisure Pool Lifeguard, Beach Lifeguard, Inland Open Water Lifeguard or a Surf\nLifeguard in accordance with industry standards. It covers competencies to achieve\naquatic accident prevention, recognition, rescue and recovery to a state of preparedness\nafter an emergency situation in leisure pools, beaches, rivers, lakes and surf environment.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 121 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 116\nBASIC COMPETENCIES\n20 hours\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1\nCommunicate\ninformation about\nworkplace\nprocesses\n• Read\n• Lecture\n• Written Test\n4 Hours\no Effective verbal communication\nmethods\n\no Sources of information\n\n• Practice organizing information\n• Demonstration\n• Observation\n\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Lecture\n• Written Test\n\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Demonstration\n• Practical\nexercises\n• Observation\n\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n• Demonstration\n• Role Play\n• Observation\n\n1.2\nLead workplace\ndiscussions\n• Describe:\no Organizational policy on\nproduction, quality and safety\n• Group\ndiscussion\n• Oral evaluation\n\no Goals/ objectives and action plan\nsetting\n\n• Read\n• Lecture\n• Written Test\n\no Effective verbal communication\nmethods\n•\n•\n\n• Prepare/set action plans based on\norganizational goals and objectives\n• Demonstration\n• Observation\n\n1.3\nIdentify and\ncommunicate\nissues arising in\nthe workplace\n• Describe:\no Organizational policy in dealing\nwith issues and problems\n• Group\ndiscussion\n• Oral evaluation\n\n• Read\n• Lecture\n• Written Test\n\no Effective verbal communication\nmethods\n\n--- PDF PAGE 122 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 117\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Practice organizing information\n• Demonstration\n• Observation\n\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n\n• Demonstration\n• Role Play\n• Observation\n\n2. Lead small\nteam\n2.1 Provide team\nleadership\n• Describe:\no Company policies and procedures\n\n• Group\ndiscussion\n• Oral evaluation\n4 Hours\n\n• Identify client expectations\n• Lecture\n• Written\nexamination\n\n• Practice team building skills\n• Demonstration\n• Observation\n\n• Perform exercises on communication\nskills required for leading teams\n• Demonstration\n• Role Play\n• Observation\n\n2.2 Assign\nresponsibilities\n• Describe:\no Team member’s duties and\nresponsibilities\