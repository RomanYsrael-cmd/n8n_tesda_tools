n• Demonstration\n• Observation\n\n• Identify course type and distance of\naquatic event\n• Lecture\n• Written Test\n\n• Familiarize beach rating on risk and\nhazard\n• Demonstration\n• Observation\n\n• Ability to define appropriate patrol\nmethod to a specific aquatic\nenvironment\n• Demonstration\n• Observation\n\n• Observe of lifeguard operational\nparameters\n\n• Negotiate signing of patrol service\nagreement\n\n--- PDF PAGE 158 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 153\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Discuss aquatic standard operating\nprocedure (SOP)\n• Group\ndiscussion\n• Oral evaluation\n\n• Identify specific patrol flags, hoisting\nand preparation of lifesaving\nequipment\n• Lecture\n• Written Test\n\n• Designating beach, identify patrol\nand safety buffer zones and\njudgment for aquatic venue closure\nfor public safety.\n• Demonstration\n• Observation\n\n• Video presentation on deploying\nflags on patrol zones\n• Video viewing\n• Oral evaluation\n\n• Demonstrate ability to comprehend\noral and written communication\n• Demonstration\n• Observation\n\n• Apply personal values in an aquatic\nvenues\n\nSupervised Lifeguard Industry\nTraining (SLIT)\n\n800 hours\n\n--- PDF PAGE 159 ---\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 Page 154\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or recognized\nindustry sector; (Learning system is driven by competencies written to industry\nstandards)\n\nb. Training delivery is learner-centered and should accommodate individualized and self-\npaced learning strategies;\n\nc.\nTraining can be done on an actual workplace setting, simulation of a workplace and/or\nthrough adoption of modern technology (Video Conferencing, Webinar, etc).\n\nd. Assessment is based in the collection of evidence of the performance of work to the\nindustry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into account\nbut requires evidence of actual performance of the competency as the primary source\nof evidence.\n\nf.\nTraining program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes, both on-\nand off-the-job as long as the learning is driven by the competency standards specified by the\nindustry. The following training modalities and their variations/components may be adopted\nsingly or in combination with other modalities when designing and delivering training\nprograms:\n\n2.1 Institution- Based\n\n•\nDual Training System (DTS) / Dualized Training Program (DTP) which contain both\nin-school and in-industry training or fieldwork components. Details can be referred to\nthe Implementing Rules and Regulations of the DTS Law and the TESDA Guidelines on the\nDTP.\n•\nDistance Learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance\nlearning may employ correspondence study, audio, video, computer technologies or\nother modern technology than can be used to facilitate learning and formal and non-\nformal training. Specific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n•\nThe traditional classroom-based or in-center instruction may be enhanced through\nuse of learner-centered methods as well as laboratory or field-work components.\n\n--- PDF PAGE 160 ---\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 Page 155\n-\nSupervised Lifeguard Industry Training (SLIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific competencies as\nprescribed in the training regulations. It is imperative that the deployment of\ntrainees in the workplace is adhered to training programs agreed by the\ninstitution and enterprise and status and progress of trainees are closely\nmonitored by the training institutions to prevent opportunity for work exploitation.\n\n-\nProject-based instruction is an authentic instructional model or strategy in which\nstudents plan, implement and evaluate projects that have real world applications.\n\n2.2 Enterprise-Based\n\nEnterprise-based training may also be taken to mean a school or training center with one\nor more partner enterprise or an enterprise or group of enterprises setting up a common\ntraining facility or partnering with a school or training center.\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement may be\nwritten or oral and the master craftsperson commits to training the apprentice in\nall the skills relevant to his or her trade over a significant period of time, usually\nbetween one and four years, while the apprentice commits to contributing\nproductively to the work of the business. Training is integrated into the production\nprocess and apprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training - where training is implemented within the company\nin accordance with the requirements of the specific company. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – refers to a short program conducted or coordinated by non-\ngovernment organizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such programs are\nusually conducted in informal settings such as barangay hall, basketball courts and other\navailable venues in a community. These programs can also be mobile training program\n(MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS\nTrainees or students who want to enroll in this course should possess the following requirements:\n\n•\nAble to communicate, both orally and in writing\n•\nMust be able to swim\n•\nPhysically able and mentally fit as certified by a Public Health Officer\n•\nHolder of Lifeguard Services NC II\n\n--- PDF PAGE 161 ---\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 Page 156\n\n3.4 LIST OF TOOLS, EQUIPMENTAND MATERIALS\nLIFEGUARD SERVICES NC III\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nLifeguard Services NC III are as follows:\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n25\nThrow Line 8mm Dia.\n18m\nPlaited Buoyant\nPolypropylene\n15\nResuscitation Anne\n25\nSets\nRed and Yellow\nUniforms\n25\n\nPersonal Flotation\nDevice Type II\n10\nResuscitation Little\nAnne\n25\nSun Protection Eye\nGlasses UV\nPolarized EPF 10\n25\n\nChlorine pH Test Kit\n8\nRescue Manikin\nHermetic Orange\nPlastic Pitted 1 m\nHalf-body\n25\nMoisturizing Sun\nScreen SPF50\n25\nRescue Tube\n2\nKayak Dual Ride\nTransparent\n4 Sets\nSafety Flags\n4\nShade UVR 50%\nCanopy/Tent\n\n1\nPace Clock\n4 Sets\nSafety Signs\n4\nTelescopic Poles\n10\nRescue Boards\n2\nCervical Collar\n2\nBlack Disc\n5\nSpine boards with\nhead immobilizer/\nstrap\n25\nSets\nBasic First Aid Set\n4\nMechanical Suctioning\n1\nMobile base radio\ntransceiver\n25\nSets\nExtended First Aid Set\n(Back Pack)\n2\nFree Flow Oxygen\nbottle static\n6\nHandheld portable\nradio transceiver\n4\nBag mask ventilation\n2\nFree Flow Oxygen\nbottle mobile\n1 set\nOxygen Therapy\nequipment and\naccessories\n4\nEye cleaning set\n4\nNon re-breathing\no