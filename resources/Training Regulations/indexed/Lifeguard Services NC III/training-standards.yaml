      "source_text": "3.7 INSTITUTIONAL ASSESSMENT\nInstitutional Assessment is undertaken by trainees in a structured learning program to determine\ntheir achievement of units of competencies. It is administered by the trainer/assessor at end of each\nlearning module.\n\nThe result of the institutional assessment may be considered as evidence for the assessment for\nnational certification.\n\nAs a matter of policy, graduates of programs registered with TESDA under these training\nregulations are required to undergo mandatory national competency assessment upon completion of\nthe program.\n\n--- PDF PAGE 166 ---\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 Page 161"
