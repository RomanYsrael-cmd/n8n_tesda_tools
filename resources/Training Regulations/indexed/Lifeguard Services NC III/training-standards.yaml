e or\nrope\n\n• Read environmental protection and\nconcerns\n• Lecture\n• Written Test\n\n• Practice in-house safety procedure\non environmental protection, good\ngrooming and hygiene, occupational\nsafety and health standards\n• Demonstration\n• Observation\n\n--- PDF PAGE 130 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 125\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Prepare red and yellow uniform, sun\nprotection devices rehydration fluids,\nand mobile phones for emergency\nservices.\n• Demonstration\n• Observation\n\n• Practice 5s in safekeeping wet\npersonal wears and lifesaving aids\n\n• Practice good grooming and personal\nhygiene\n\n• Demonstrate ability to comprehend\noral and written communication\n\n• Apply personal values in an aquatic\nenvironment\n\n1.2 Use Recognized\nClothing and\nOutdoor\nProtective\nDevices\n\n• Read:\no Getting Ready for Aquatic Works\no Sun Safety\no Red and Yellow Lifeguard Uniform\n\n• Lecture\n\n• Written\nexamination\n\n• Demonstrate applying skin sunscreen\nand proper wearing of lifeguard\nuniform, swim wear, eyewear, tents\nand first aid bag.\n• Demonstration\n• Observation\n\n• Demonstrate ability to comprehend\noral and written communication\n\n• Apply personal values in an aquatic\nenvironment\n\n--- PDF PAGE 131 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 126\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n1.3 Interpret Standard\nWater Safety\nFlags and Signs\n\n• Describe Pool Signage\n\n• Group\nDiscussion\n• Oral evaluation\n\n• Read:\nWater Safety and Beach Flags\nOperation\n• Lecture\n• Written\nexamination\n\no Standard Water Safety\nInformation and permissive,\nregulatory and warning signs\n\no Typeface for text and distance\nfactor for externally illuminated\nsafety signs\n\n• Practice proper hoisting and taking\ndown water safety flags\n• Demonstration\n• Observation\n\n• Demonstrate Inspection,\nmaintenance and storage of flags,\nflag-poles and signage\n\n• Demonstrate correct anchoring and\nunfastening of flag-pole\n\n• Demonstrate ability to comprehend\noral and written communication\n\n• Apply personal values in an aquatic\nenvironment\n\n--- PDF PAGE 132 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 127\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n1.4 Spot Dangers of\nDifferent Aquatic\nEnvironments\n\n• Describe safety guidelines for rivers,\nlakes, ponds, beaches, pools and\nhome or condominium aquatic\nenvironment\n• Group\nDiscussion\n• Oral evaluation\n\n• Read the dangers at different aquatic\nenvironments :\no rivers\n• Lecture\n• Written\nexamination\n\no lakes\n\no ponds\n\no beaches\n\no pools and\n\no home or condominium aquatic\nenvironment\n\n• Read and describe the Factors that\nmay vary water flow and current in\nriver, lake, beach and ocean.\n\n• Demonstrate detecting presence of\ncrumbling banks, uneven river beds\nand submerged obstacles in rivers,\ncreeks and waterholes.\n• Demonstration\n• Observation\n\n• Identify whirlpool in the water and\nreverse currents near the riverbank,\nrocks or semi-submerged obstacle\n• Lecture\n• Written\nexamination\n\n• Read instructions on recognizing\nstrong current (Swift Water) at river\nentry points of lakes, dams and\nlagoons.\n\n--- PDF PAGE 133 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 128\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Practice detecting strong currents\n(Swift Water) caused by irrigation\npumps and channels in ponds or\nfarms.\n• Demonstration\n• Observation\n\n• Read and follow instructions on how\nto distinguish presence of cold water,\nsurging waves, tidal and rip current in\nbeaches 