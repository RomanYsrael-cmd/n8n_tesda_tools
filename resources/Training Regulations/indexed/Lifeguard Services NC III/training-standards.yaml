      "source_text": "3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or recognized\nindustry sector; (Learning system is driven by competencies written to industry\nstandards)\n\nb. Training delivery is learner-centered and should accommodate individualized and self-\npaced learning strategies;\n\nc.\nTraining can be done on an actual workplace setting, simulation of a workplace and/or\nthrough adoption of modern technology (Video Conferencing, Webinar, etc).\n\nd. Assessment is based in the collection of evidence of the performance of work to the\nindustry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into account\nbut requires evidence of actual performance of the competency as the primary source\nof evidence.\n\nf.\nTraining program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes, both on-\nand off-the-job as long as the learning is driven by the competency standards specified by the\nindustry. The following training modalities and their variations/components may be adopted\nsingly or in combination with other modalities when designing and delivering training\nprograms:\n\n2.1 Institution- Based\n\n•\nDual Training System (DTS) / Dualized Training Program (DTP) which contain both\nin-school and in-industry training or fieldwork components. Details can be referred to\nthe Implementing Rules and Regulations of the DTS Law and the TESDA Guidelines on the\nDTP.\n•\nDistance Learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance\nlearning may employ correspondence study, audio, video, computer technologies or\nother modern technology than can be used to facilitate learning and formal and non-\nformal training. Specific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n•\nThe traditional classroom-based or in-center instruction may be enhanced through\nuse of learner-centered methods as well as laboratory or field-work components.\n\n--- PDF PAGE 160 ---\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 Page 155\n-\nSupervised Lifeguard Industry Training (SLIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific competencies as\nprescribed in the training regulations. It is imperative that the deployment of\ntrainees in the workplace is adhered to training programs agreed by the\ninstitution and enterprise and status and progress of trainees are closely\nmonitored by the training institutions to prevent opportunity for work exploitation.\n\n-\nProject-based instruction is an authentic instructional model or strategy in which\nstudents plan, implement and evaluate projects that have real world applications.\n\n2.2 Enterprise-Based\n\nEnterprise-based training may also be taken to mean a school or training center with one\nor more partner enterprise or an enterprise or group of enterprises setting up a common\ntraining facility or partnering with a school or training center.\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement may be\nwritten or oral and the master craftsperson commits to training the apprentice in\nall the skills relevant to his or her trade over a significant period of time, usually\nbetween one and four years, while the apprentice commits to contributing\nproductively to the work of the business. Training is integrated into the production\nprocess and apprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training - where training is implemented within the company\nin accordance with the requirements of the specific company. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – refers to a short program conducted or coordinated by non-\ngovernment organizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such programs are\nusually conducted in informal settings such as barangay hall, basketball courts and other\navailable venues in a community. These programs can also be mobile training program\n(MTP)."
    },
