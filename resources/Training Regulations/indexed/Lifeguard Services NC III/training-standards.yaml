vices NC III (New) Promulgated July 2, 2015 Page 153\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Discuss aquatic standard operating\nprocedure (SOP)\n• Group\ndiscussion\n• Oral evaluation\n\n• Identify specific patrol flags, hoisting\nand preparation of lifesaving\nequipment\n• Lecture\n• Written Test\n\n• Designating beach, identify patrol\nand safety buffer zones and\njudgment for aquatic venue closure\nfor public safety.\n• Demonstration\n• Observation\n\n• Video presentation on deploying\nflags on patrol zones\n• Video viewing\n• Oral evaluation\n\n• Demonstrate ability to comprehend\noral and written communication\n• Demonstration\n• Observation\n\n• Apply personal values in an aquatic\nvenues\n\nSupervised Lifeguard Industry\nTraining (SLIT)\n\n800 hours\n\n--- PDF PAGE 159 ---\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 Page 154",
