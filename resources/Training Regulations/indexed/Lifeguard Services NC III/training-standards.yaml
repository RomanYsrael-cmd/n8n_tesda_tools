    "source_text": "SECTION 3\nTRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for LIFEGUARD SERVICES NC III.\n\nThese include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1 CURRICULUM DESIGN\n\nTESDA shall provide training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to include\nTechnology, Science, Math, English/Communication, and Safety to Environment.\nIncludes also green technology, issues on health and drugs and cater to person with\ndisabilities (PWD’s).\n\nCourse Title: LIFEGUARD SERVICES NC Level NC III\n\nNominal Training Duration:\n\n 20 hrs.\nBasic Competencies\n 240 hrs.\nCommon Competencies\n\n1520 hrs.\nCore Competencies\n(to include 800 Hrs. Supervised Lifeguard Industry Training\n(SLIT))\nTotal\n1780 hrs.\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills of\na Leisure Pool Lifeguard, Beach Lifeguard, Inland Open Water Lifeguard or a Surf\nLifeguard in accordance with industry standards. It covers competencies to achieve\naquatic accident prevention, recognition, rescue and recovery to a state of preparedness\nafter an emergency situation in leisure pools, beaches, rivers, lakes and surf environment.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 121 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 116\nBASIC COMPETENCIES\n20 hours\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1\nCommunicate\ninformation about\nworkplace\nprocesses\n• Read\n• Lecture\n• Written Test\n4 Hours\no Effective verbal communication\nmethods\n\no Sources of information\n\n• Practice organizing information\n• Demonstration\n• Observation\n\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Lecture\n• Written Test\n\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Demonstration\n• Practical\nexercises\n• Observation\n\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n• Demonstration\n• Role Play\n• Observation\n\n1.2\nLead workplace\ndiscussions\n• Describe:\no Organizational policy on\nproduction, quality and safety\n• Group\ndiscussion\n• Oral evaluation\n\no Goals/ objectives and action plan\nsetting\n\n• Read\n• Lecture\n• Written Test\n\no Effective verbal communication\nmethods\n•\n•\n\n• Prepare/set action plans based on\norganizational goals and objectives\n• Demonstration\n• Observation\n\n1.3\nIdentify and\ncommunicate\nissues arising in\nthe workplace\n• Describe:\no Organizational policy in dealing\nwith issues and problems\n• Group\ndiscussion\n• Oral evaluation\n\n• Read\n• Lecture\n• Written Test\n\no Effective verbal communication\nmethods\n\n--- PDF PAGE 122 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 117\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Practice organizing information\n• Demonstration\n• Observation\n\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n\n• Demonstration\n• Role Play\n• Observation\n\n2. Lead small\nteam\n2.1 Provide team\nleadership\n• Describe:\no Company policies and procedures\n\n• Group\ndiscussion\n• Oral evaluation\n4 Hours\n\n• Identify client expectations\n• Lecture\n• Written\nexamination\n\n• Practice team building skills\n• Demonstration\n• Observation\n\n• Perform exercises on communication\nskills required for leading teams\n• Demonstration\n• Role Play\n• Observation\n\n2.2 Assign\nresponsibilities\n• Describe:\no Team member’s duties and\nresponsibilities\n• Group\ndiscussion\n• Oral evaluation\n\n• Identify client expectations\n• Lecture\n• Written\nexamination\n\n• Practice negotiating skills\n• Demonstration\n• Observation\n\n• Perform group exercises showing the\nskills and techniques in promoting\nteam building\n\n• Demonstration\n• Role Play\n• Observation\n\n2.3 Set performance\nexpectations for\nteam members\n• Describe:\no Team member’s duties and\nresponsibilities\n• Group\ndiscussion\n• Oral evaluation\n\no How performance expectations are\nset\n\n• Identify client expectations\n• Lecture\n• Written\nexamination\n\n• Perform group exercises in setting\nindividual target/ expectation\n• Demonstration\n• Role Play\n• Observation\n\n--- PDF PAGE 123 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 118\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Read instruction and requirements in\nup to date dissemination to members\n\n• Lecture\n• Written\nexamination\n\n2.4 Supervise team\nperformance\n• Describe listening and treating\nindividual team members concern\n• Group\ndiscussion\n• Oral evaluation\n\n• Identify methods of Monitoring\nPerformance\n\n• Lecture\n• Written\nexamination\n\n• Perform group exercises showing the\nskills in monitoring team performance\n\n• Demonstration\n• Observation\n\n3. Solve\n workplace\n problems\n related to work\n activities\n3.1 Identify the\nproblem\n\n• Describe Normal operating\nparameters & product quality\n• Group\ndiscussion\n• Oral evaluation\n2 Hours\n• Identify & clarify the nature of problem\n• Lecture\n• Written\nexamination\n\n• Read:\no Brainstorming\n\n• Lecture\n• Written\nexamination\n\no Cause and effect diagrams\n\no PARETO analysis\n\no SWOT analysis\n\no GANT chart\n\no PERT CPM & graph\n\no SCATTERGRAMS\n\n• Apply observation, investigation and\nanalytical techniques in solving\nproblem in the workplace\n\n• Demonstration\n• Observation\n\n--- PDF PAGE 124 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 119\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3.2 Determine\nfundamental cause\nof the problem\n• Describe Teamwork and work\nallocation problem\n\n• Group\ndiscussion\n• Oral evaluation\n\n• Read:\no Using range of formal problem\nsolving techniques\n\n• Lecture\n• Written\nexamination\n\no Enterprise goals, targets and\nmeasures\n\no Enterprise quality, OSH and\nenvironmental requirement\n\no Non-routine process and quality\nproblems\n\n• Perform group exercises showing\nsafety in emergency situations and\nincidents\n• Demonstration\n• Role Play\n• Observation\n\n• Identify & clarify the nature of problem\n• Lecture\n• Written\nexamination\n\n• Select relevant equipment and\noperational processes\n\n• Lecture\n• Written\nexamination\n\n3.3 Determine correct /\npreventive action\n\n• Describe principles of decision making\nstrategies and techniques\n• Group\nDiscussion\n• Oral evaluation\n\n• Read:\no Evaluating the solution\n• Lecture\n• Written\nexamination\n\no Devising the best solution\n\n• Perform group exercise how to\nimplement the developed plan to\nrectify a problem\n\n• Demonstration\n• Role Play\n• Observation\n\n3.4 Provide\nrecommendation to\nmanager\n• Describe industry codes and\nstandards\n• Group\nDiscussion\n• Oral evaluation\n\n--- PDF PAGE 125 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 120\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Apply enterprise information systems\nand data collation\n• Demonstration\n• Observation\n\n• Prepare recommendation letter\n\n4. Develop and\npractice\nnegotiation\nskills\n4.1 Identify relevant\ninformation in\nplanning\nnegotiations\n• Describe:\no codes of practice and guidelines for\nthe organization\n• Group\nDiscussion\n• Oral evaluation\n2 hours\n\no differences between content and\nprocess\n\n• Read:\no Organizations policy and\nprocedures for negotiations\n• Lecture\n• Written\nexamination\n\no Decision making and conflict\nresolution strategies procedures\n\no Strategies to manage conflict\n• Lecture\n• Written\nexamination\n\no Steps in negotiating process\n•\n•\n\n• Identify bargaining information\n• Lecture\n• Written\nexamination\n\n• Apply strategies to manage process\n• Demonstration\n• Observation\n\n• Apply steps in negotiating process\n\n4.2 Participate in\nnegotiations\n• Describe the following strategies\nduring negotiation:\n• Group\nDiscussion\n• Case studies\n• Oral evaluation\n\no Decision making and conflict\nresolution strategies procedures\n\no Problem solving strategies on how\nto deal with unexpected questions\nand attitudes during negotiation\n\n• Practice the following scenarios in a\ngroup activity:\no Perform interpersonal skills to\ndevelop rapport with other parties\n• Demonstration\n• Simulation/\nRole play\n• Observation\n\no Perform verbal communication and\nlistening skill\n\n--- PDF PAGE 126 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 121\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\no observation skills\n\no negotiation skills\n\n4.3 Document areas\nfor agreement\n• Describe the Procedure in\ndocumenting negotiations\n• Group\nDiscussion\n• Simulation/\nRole play\n• Oral evaluation\n\n• Apply a filing system in managing\ninformation\n• Demonstration\n• Observation\n\n• Demonstrate filing of documents\n\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify\nmathematical tools\nand techniques to\nsolve problems\n• Describe the four fundamental\noperation (addition, subtraction,\ndivision, multiplication)\n• Group\nDiscussion\n• Oral evaluation\n4 Hours\n• Read:\no Measurement system\n• Lecture\n• Written\nexamination\n\no Precision and accuracy\n\no Basic measuring tools/devices\n• Lecture\n• Written\nexamination\n\n• Apply mathematical computations\n• Demonstration\n• Observation\n\n• Demonstrate activities on:\no Use of calculator\n• Demonstration\n• Observation\n\no Use of different measuring tools\n\n5.2 Apply\nmathematical\nprocedures /\nsolution\n• Read:\no Estimation\n• Lecture\n• Written\nexamination\n\no Problem-based questions\n\no Mathematical techniques\n\n• Apply mathematical computations\n• Demonstration\n• Simulation/\nRole play\n• Observation\n\n• Demonstrate activities on:\n• Demonstration\n• Observation\n\n--- PDF PAGE 127 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 122\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Use of calculator\no Use of different measuring tools\n\no Use of mathematical tools and\nstandard formulas\n\n5.3 Analyze results\n• Describe the four fundamental\noperation (addition, subtraction,\ndivision, multiplication)\n• Group\nDiscussion\n• Oral evaluation\n\n• Read:\no Measurement system\n• Lecture\n• Written\nexamination\n\no Precision and accuracy\n\no Basic measuring tools/devices\n\n• Apply mathematical computations\n• Demonstration\n• Observation\n\n• Demonstrate activities on:\no Use of calculator\n• Demonstration\n• Observation\n\no Use of different measuring tools\n• Demonstration\n• Observation\n\n6. Use relevant\ntechnologies\n6.1 Identify\nappropriate\ntechnology\n• Describe company policy in relation to\nrelevant technology\n• Group\nDiscussion\n• Oral evaluation\n4 Hours\n\n• Read:\no Awareness on technology and its\nfunction\n• Lecture\n• Written\nexamination\n\no Relevant technology application/\nimplementation\n\no Operating instructions\n\n• Practice basic communication skill in a\ngroup activity\n• Demonstration\n• Simulation/\nRole Play\n• Observation\n\n6.2 Apply relevant\ntechnology\n• Describe different management\nconcepts\n• Group\nDiscussion\n• Oral evaluation\n\n--- PDF PAGE 128 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 123\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Read:\no Relevant technology application/\nimplementation\n• Lecture\n• Written\nexamination\n\no Technology adaptability\n\no Different management concepts\n\no Health and safety procedure\n\no Communication techniques\n\nApply software applications skills\n• Demonstration\n• Observation\n\n• Practice drills on installing application\nsoftware\n• Demonstration\n• Simulation/\nRole Play\n• Observation\n\n• Practice basic communication skill in a\ngroup activity\n\n6.3 Maintenance /\nenhance relevant\ntechnology\n• Read:\no Repair and maintenance procedure\n• Lecture\n• Written\nexamination\n\no Operating instructions\n• Lecture\n• Written\nexamination\n\n• Practice drills:\no\ninstalling application software\n• Demonstration\n• Simulation/\nRole Play\n• Observation\n\no Basic troubleshooting skills\n\n--- PDF PAGE 129 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 124\n COMMON COMPETENCIES\n240 HRS\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Demonstrate\nKnowledge and\nSkills on Water\nSafety\n\n1.1 Implement the\nAquacode\n\n• Read:\no The Principle of Aquacode\n- G = go together\n- S = stay afloat and wave\n- R = reach to rescue\n•\nLecture\n• Written\nexamination\n80 Hours\no Definition of Drowning\n\no Types of drowning victim\n\no Water Safety\n\no Types of grabbing\n\no Safety consideration as a\nLifesaver\n\no Prevention of aquatic\nemergencies\n\n• Practice buddy system, calmly\nwaving while floating in water and\nconduct reach rescue using a stick or\na rope.\n• Demonstration\n• Observation\n\n• Estimate distance to safety and feel\ndepth of water.\n\n• Prepare materials, specification and\nmaintenance of swim wear, eye\nwear, foot wear and throw line or\nrope\n\n• Read environmental protection and\nconcerns\n• Lecture\n• Written Test\n\n• Practice in-house safety procedure\non environmental protection, good\ngrooming and hygiene, occupational\nsafety and health standards\n• Demonstration\n• Observation\n\n--- PDF PAGE 130 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 125\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Prepare red and yellow uniform, sun\nprotection devices rehydration fluids,\nand mobile phones for emergency\nservices.\n• Demonstration\n• Observation\n\n• Practice 5s in safekeeping wet\npersonal wears and lifesaving aids\n\n• Practice good grooming and personal\nhygiene\n\n• Demonstrate ability to comprehend\noral and written communication\n\n• Apply personal values in an aquatic\nenvironment\n\n1.2 Use Recognized\nClothing and\nOutdoor\nProtective\nDevices\n\n• Read:\no Getting Ready for Aquatic Works\no Sun Safety\no Red and Yellow Lifeguard Uniform\n\n• Lecture\n\n• Written\nexamination\n\n• Demonstrate applying skin sunscreen\nand proper wearing of lifeguard\nuniform, swim wear, eyewear, tents\nand first aid bag.\n• Demonstration\n• Observation\n\n• Demonstrate ability to comprehend\noral and written communication\n\n• Apply personal values in an aquatic\nenvironment\n\n--- PDF PAGE 131 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 126\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNomi