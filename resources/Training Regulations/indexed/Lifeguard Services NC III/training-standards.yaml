 of programs registered with TESDA under these training\nregulations are required to undergo mandatory national competency assessment upon completion of\nthe program.\n\n--- PDF PAGE 166 ---\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 Page 161"
