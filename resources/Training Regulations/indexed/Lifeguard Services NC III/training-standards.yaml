      "source_text": "3.6 TRAINER QUALIFICATIONS FOR HEALTH SECTOR\n Trainers who will deliver the training on LIFEGUARD SERVICESNC III should possess the\nfollowing qualifications:\n\n•\nMust be a holder of National TVET Trainers Certificate Level I in Lifeguard Services NC III\n•\nMust be physically and mentally fit as certified by a Public Health Officer\n•\nMust have at least 4 years relevant industry experience in their specific field of\nspecialization. (Leisure Pool, Beach, River and Lake and Surf)"
