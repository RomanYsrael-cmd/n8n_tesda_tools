QUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ. METERS\nGRAND TOTAL\nAREA IN SQ. M\no Chemical Storage\nRoom\n4 x 5\n20\n\n20\no Male Shower\n Rooms\n\n8 x 5\n\n40\n\n40\no Female Shower\nRooms\n8 x 5\n40\n\n40\no Students /\n Trainees\n Reception Area\n8 x 5\n40\n\n40\n\n*NOTE: The Training Center has the option to partner with a private/public establishment in\nproviding facilities and equipment during the conduct of training and assessment.\n\n3.6 TRAINER QUALIFICATIONS FOR HEALTH SECTOR\n Trainers who will deliver the training on LIFEGUARD SERVICESNC III should possess the\nfollowing qualifications:\n\n•\nMust be a holder of National TVET Trainers Certificate Level I in Lifeguard Services NC III\n•\nMust be physically and mentally fit as certified by a Public Health Officer\n•\nMust have at least 4 years relevant industry experience in their specific field of\nspecialization. (Leisure Pool, Beach, River and Lake and Surf)\n\n3.7 INSTITUTIONAL ASSESSMENT\nInstitutional Assessment is undertaken by trainees in a structured learning program to determine\ntheir achievement of units of competencies. It is administered by the trainer/assessor at end of each\nlearning module.\n\nThe result of the institutional assessment may be considered as evidence for the assessment for\nnational certification.\n\nAs a matter of policy, graduates of programs registered with TESDA under these training\nregulations are required to undergo mandatory national competency assessment upon completion of\nthe program.\n\n--- PDF PAGE 166 ---\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 Page 161"
