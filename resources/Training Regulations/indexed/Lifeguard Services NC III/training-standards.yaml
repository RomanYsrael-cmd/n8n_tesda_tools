d-held\ncommunication devices\n• Video viewing\n• Oral evaluation\n\n• Demonstrate proper handling and\ncare of radio equipment\n• Demonstration\n• Observation\n\n• Identify types of radio or Network\n\n• Perform radio signal check\n\n• Operate hand-held and mobile-base\nradio equipment\n\n• Record radio communication clearly\non log book\n\n• Demonstrate ability to comprehend\noral and written communication\n\n• Apply personal values in an aquatic\nvenues\n\n--- PDF PAGE 155 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 150\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.2 Communicate\nemergency calls\n\n• Read:\no Procedural Words in Radio\nCommunication\n• Lecture\n• Written Test\n20 hours\n\no Call signs of stations in a network\n\n• Identify 4Ps method of relaying\ninformation\n\n• Video presentation on responding to\nemergency calls\n• Video viewing\n• Oral evaluation\n\n• Handle incoming communication and\nmanage radio interruption\n• Demonstration\n• Observation\n\n• Demonstrate relaying proper\nemergency information over radio\n\n• Demonstrate transmit and receive\nemergency call on radio\n\n• Demonstrate ability to comprehend\noral and written communication\n\n• Apply personal values in an aquatic\nvenues\n\n5.3 Maintain radio\nequipment\n• Read specific battery charging\nsystem\n• Lecture\n• Written Test\n10 hours\n\n• Perform Routine Radio Maintenance\nProcedure\n\n• Demonstration\n• Observation\n\n• Demonstrate Emergency\nMaintenance Procedures\n\n• Maintain radio equipment\n\n--- PDF PAGE 156 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 151\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Charge accordingly radio battery\npacks\n\n• Demonstrate ability to comprehend\noral and written communication\n• Demonstration\n• Observation\n\n• Apply personal values in a