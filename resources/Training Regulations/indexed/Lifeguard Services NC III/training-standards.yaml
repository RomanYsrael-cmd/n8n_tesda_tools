      "source_text": "3.1 CURRICULUM DESIGN\n\nTESDA shall provide training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to include\nTechnology, Science, Math, English/Communication, and Safety to Environment.\nIncludes also green technology, issues on health and drugs and cater to person with\ndisabilities (PWD’s).\n\nCourse Title: LIFEGUARD SERVICES NC Level NC III\n\nNominal Training Duration:\n\n 20 hrs.\nBasic Competencies\n 240 hrs.\nCommon Competencies\n\n1520 hrs.\nCore Competencies\n(to include 800 Hrs. Supervised Lifeguard Industry Training\n(SLIT))\nTotal\n1780 hrs.\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills of\na Leisure Pool Lifeguard, Beach Lifeguard, Inland Open Water Lifeguard or a Surf\nLifeguard in accordance with industry standards. It covers competencies to achieve\naquatic accident prevention, recognition, rescue and recovery to a state of preparedness\nafter an emergency situation in leisure pools, beaches, rivers, lakes and surf environment.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 121 ---\nTR – Lifeguard Services NC III (New) Promulgated July 2, 2015 Page 116\nBASIC COMPETENCIES\n20 hours\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1\nCommunicate\ninformation about\nworkplace\nprocesses\n• Read\n• Lecture\n• Written Test\n4 Hours\no Effective verbal communication\nmethods\n\no Sources of information\n\n• Practi