        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Consulted and prepared client on desired safety requirements\nof the event.\n1.2 Assessed Aquatic risks and conduct hazard mapping on the\nevent venue\n1.3 Discussed with clients possible risks\n1.4 Set up safety signage to minimize risk wherever possible\n1.5 Advised Clients if event venue needs to be transferred to a\nmore safe location.\n1.6 Set up lifesaving equipment\n1.7 Set up Patrol Flags and aquatic zoning\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Beach area\n2.2 Tools, equipment and supplies/materials relevant to the\nactivity to be performed\n2.3 Work area/facilities\n\n3. Methods of\nassessment\nCompetency may be assessed through:\n3.1 Demonstration with Oral Questioning\n3.2 Third-Party Report\n3.3 Portfolio\n4. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\nAccredited assessment center\n\n--- PDF PAGE 120 ---\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 115"
        },
        "source_text": "SOC541312\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes in conducting\naquatic risk assessment, hazard mapping and setting up\nlifeguard patrols for events at leisure pools, beaches, rivers and\nlakes.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Conduct Aquatic\nRisk\nAssessment and\nHazard Mapping\n1.1 Clients or aquatic\nevent organizer is\ncoordinated in\naccordance with\nILS as specified in\nPublic Safety and\nAquatic Rescue\nHandbook.\n\n1.2 Risk and hazards\nassociated with\naquatic events are\nidentified, rated,\nanalyzed and\nprioritized in\naccordance Coastal\nPublic Safety\nGuidelines.\n\n1.3 Measures to\nminimize sources\nof risk and hazards\nto event organizers\nand clients are\ndiscussed in\naccordance to\nCoastal Public\nSafety Guidelines.\n\n1.4 Hazards in the area\nare controlled by\nputting signage or\nevent organizer\n/clients advised to a\nsafer activity venue,\nwhere necessary.\n•\nTrade Theory\no Roles and\nresponsibilities\nof lifesaver/\nlifeguard\no Roles and\nresponsibilities\nof patrol captain\no Patrol Logs\no Aquatic facility\nrisk analyses\nand hazard\nmapping\n\n•\nCommunications\no Oral and Written\ncommunication\n\n•\nMathematics and\nMensuration\no Demographics\nand volume of\npeople for an\naquatic event\no Size and\ndistance of\nsetbacks due to\nwater and\nweather\nConditions\no Access to the\nbeach activity\narea must be\nsafe.\no Determine\nhazard rating in\nthe area to\ndesign\nappropriate\ncontrol\n•\nDetect aquatic\nrisk and hazard\n\n•\nConduct critical\nrisk analysis\n\n•\nPlot and explain\nhazards and\n\n•\nComprehend\noral and written\ncommunication\n\n•\nCommunicate by\nradio transceiver\n\n•\nMensuration\napplied for\nefficiency of risk\nanalysis and\nhazard mapping.\n\n•\nFollow in-house\nsafety procedure\non environmental\nprotection, good\ngrooming and\nhygiene,\noccupational\