, they are often in distress\n2.3\nIn pain and holding the arm, leg, head or stomach –\nsuch people might be suffering injury, shock, or both.\n2.4\nVisibly holding breath – cheeks puffed out and not\nlooking very comfortable.\n2.5\nPassive – upright or horizontal, on the surface,\nsubmerged, or on the bottom, with a wide-eyed,\nfearful look on their face.\n2.6\nStruggling at the surface or bobbing in the water –\noften those at or near the surface will make\ndownward sweeps of the arms with little or no leg\naction.\n3. Passive\nInclude but not limited to:\n3.1\nPassive drowning person slips underwater without\nwaving, calling out for help or struggling on the\nsurface.\n3.2\nOften this type of emergency is caused by a heart\nattack, stroke, hyperventilation, a blow to the head,\ncold water immersion or excessive alcohol\nconsumption.\n4. Active\nInclude but not limited to:\n4.1\nExhibit easily detectable behaviors such as a little\nnoise or call for help.\n4.2\nNot being dressed for swimming\n4.3\nVertical body position\n4.4\nMinimal or non-supportive leg action\n4.5\nVigorous arm movements, with the arms either to the\nsides or extended in front in an effort to climb out the\nwater\n4.6\nHead tilted up and back, face turned towards safety\nor help\n4.7\nA toddler or small infant unsupervised.\n\n--- PDF PAGE 88 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 83\nVARIABLE\nRANGE\n5. Minor emergency\nInclude but not limited to:\n5.1\nGutter (Pool Side) grabbers\n5.2\nLost person\n5.3\nMinor bleeding\n5.4\nStubbed toe\n5.5\nTile cut to finger\n5.6\nWeak swimmer\n5.7\nNon-delicate Insect bites\n6. Major emergency\nInclude but not limited to:\n6.1 Immediate life-threatening situation such as drowning\n6.2 Spinal Incident\n6.3 Heart Attack\n6.4 Life-threatening bleeding\n6.5 Unconsciousness\n6.5 May require evacuation\n7. Evacuation\nInclude but not limited to:\n7.1\nImmediate life-threatening and urgent respond to fire,\nbomb threat, chlorine or other gas leaks\n7.2\nLightning\n7.3\nExtended power failure in an indoor facility\n8. Emergency Action Plan\n(EAP)\nInclude but not limited to:\n8.1 Generally answers the questions: Who will do what?\nWhen? Where? And How?\n8.2 Specifically answers the questions: Where are the\nlifeguards located and how many are on duty?\n8.3 What communication system is being used between\nlifeguards?\n8.4 Where is the emergency equipment? How will it be\nbrought to the incident site?\n8.5 Who responds first? Second? Third?\n8.6 Who takes the major responsibility for handling the\nincident? For giving directions? For crowd control?\n8.7 What are the preferred locations where injured people\ncan be removed from the water?\n8.8 Which emergency service (police, fire, ambulance)\nshould be called and under what circumstances?\nWhat is the response time for these services?\n8.9 Where are the access points for emergency services?\n8.10 What signals do lifeguards use for communicating\nwith the public?\n8.11 Who talks with police, press and relatives?\n8.12 What reports are needed? Who completes the reports\nand initiates the follow-up action resulting from the\nemergency?\n9. Established emergency\nprocedures\nInclude but not limited to:\n9.1\nWell-rehearsed emergency procedures promotes\nconfident, controlled and orderly lifeguard response.\n9.2 Emergency Drills ensure all staff understand their\n\n--- PDF PAGE 89 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 84\nVARIABLE\nRANGE\nroles in an emergency\n9.3 Regularly scheduled practice promotes efficient\nteamwork\n9.4\nSimulated emergencies can approximate the stresses\nof a real emergency situation.\n9.5\nTo practice lifeguard buddy system, apprenticeship\nor“ shadow guarding” is a useful bridge for a newly\nqualified lifeguard or for one who is unfamiliar with a\nnew facility\n9.6\nMental rehearsal – lifeguard self-assessment is\neffectively practiced while on duty by visualizing your\nreaction and rescue procedures as you pass over\ndanger spots and potential people in difficulty.\n9.10 Emergency response procedures, as well as\nindividual lifeguard and team performance, should be\ncritically analyzed and evaluated following each\npractice.\n10. Bystanders\nInclude but not limited to:\n10.1 Assist with crowd control\n10.2 Assist in simple first aid\n10.3 Assist in bringing first aid supplies\n10.4 Opening doors or gates\n10.5 Perform other helpful tasks\n11. Crowd Control\nInclude but not limited to:\n11.1 Aimed at protecting people from injury\n11.2 Protecting the person in difficulty\n11.3 Protecting lifeguards from interference.\n11,4 Behavior of the crowd varies on several factors:\n11.4.1 The number and type of people in a crowd\n11.4.2 The space available for accommodating the\ncrowd\n11.4.3 The ability of the crowd to see the incident\n11.4.4 The ability of the lifeguards to communicate\neffectively with the crowd\n11.4.5 The authoritative but polite manner of\nlifeguards\n12. Emergency services\nInclude but not limited to:\n12.1 Activate send ambulance as soon as the victim is\nfound unresponsive – known as “phone first”\napproach\n12.2 In some instances, emergency service will not\nassume responsibility for casualties of an aquatic\naccident until the person is removed from the water\n13. Emergency telephone\n procedure\nInclude but not limited to:\n13.1 Call for 117 or dial individual service number\n13.2 Confirm the service you want (ambulance, police,\nfire)\n13.3 Specify the type of emergency\n13.4 Provide your name and the facility name and\naddress\n\n--- PDF PAGE 90 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 85\nVARIABLE\nRANGE\n including the nearest cross streets or landmark\n13.5 Provide the telephone number of the facility\n13.6 Describe the condition of the casualty\n13.7 Describe the treat currently being given to the\ncasualty\n13.8 Ask for the estimated time of arrival of emergency\n Service\n13.7 Provide directions for emergency access to the\nfacility and specify whether anyone will meet the\nemergency service at the access point.\n13.8 Ask for further instructions\n13.9 Do not hang up until after the emergency service\nhangs up.\n14. Legal response procedures\nInclude but not limited to:\n14.1 Legal ramifications that should be followed\n14.1.1 Immediately notifying superiors\n14.1.2 Gathering and controlling information\n14.1.3 Supporting and assisting colleagues\n14.1.4 Analyzing and evaluating the accident\n14.2 Those involved should perform the following:\n14.2.1 Identify witnesses, get statements and\npreserve evidence\n14.2.2 Follow up with venue personnel and\nwitnesses to obtain statements and detailed\nrecollection of events\n14.2.3 Complete all the required documentation\nthoroughly and accurately\n14.2.4 Maintain a professional, competent\napproach.\n15. Carries and Supports\nInclude but not limited to:\n15.1 Before moving a patient, take following into account:\n15.1.1 Danger and safety\n15.1.2 Location\n15.1.3 Route of movement\n15.1.4 Equipment\n15.1.5 Personnel\n15.1.6 Urgency\n15.1.7 Lifting and carrying techniques\n15.2 Picking up, carrying and lowering the patient\n15.2.1 Two-person carry\n15.2.2 Two-person carry with IRB variation\n15.2.3 Two-handed seat\n15.2.4 Two-person drag\n16. Spinal Injury\nInclude but not limited to:\n16.1\nPrinciples of spinal rescue and treatment\n16.2\nExtended arm rollover and stretcher carry\nmaneuvers\n15.3\nManeuvers for conscious patient in a lying position\n15.4\nManeuvers for conscious patient in a standing\nposition\n15.5\nProcedures for five-person carry\n\n--- PDF PAGE 91 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 86\nVARIABLE\nRANGE\n17. Mass rescues\nInclude but not limited to:\n17.1\nWhen unsuspecting bathers are suddenly washed\noff a sandbank and into deep water where their feet\ncannot touch the bottom\n17.2\nWhen a flash rip current, resulting from a large\nbuild-up of surf in a short period and an intense pull\nseaward, drags swimmers into deep water\n17.3\nWhen a large surging wave washes up the face of a\nsloping beach, engulfing swimmers and pulling\nthem out of their depths, dragging them out to sea.\n17.4\nWhen a boat carrying a number of passengers\noverturns just outside the surf break.\n18. Motorized rescue crafts\nMay include\n18.1\nJet ski,\n18.2\ninflatable rescue boat\n18.3\nmotor pump boats\n\n--- PDF PAGE 92 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 87\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDiagnosed/ checked for Dangers, Reaction, Airways,\nBreathing, and Compression (DRABC).\n1.2\nDiagnosed/ checked for Dangers, Reaction, Airways,\nBreathing, and Compression (DRABC).\n1.3\nCalled for help.\n1.4\nPositioned the patient in Recovery position\n1.5\nDemonstrated Expired Air Resuscitation (EAR) for adults,\nchildren and infants.\n1.6\nPerformed Cardio Pulmonary Resuscitation (CPR) for\nadults, children and infants.\n1.7\nSet-up and used of oxygen equipment\n1.8\nIdentified and managed different injuries and emergencies\n1.9\nChecked possible signs and symptoms of possible head,\nneck or back injury of the patient in the water.\n1.10 Immobilized and maintain airways of the patient.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1\nSwimming pools\n2.2\nResuscitation Manikins\n2.3\nCopies of Relevant Standards in First AID and Emergency\nProcedures\n2.4\nTraining Books\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration with questioning\n3.2\nDirect observation\n3.3\nOral examination\n3.4\nThird Party Report\n4. Context of\nassessment\nCompetency may be assessed in the workplace or in a simulated\nworkplace setting.\n\n--- PDF PAGE 93 ---\nTESDA-SOP-QSO-01-