  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThese guidelines are set to provide the Technical Vocational Education and Training\n(TVET) providers with information on the competencies and similar important requirements to\nconsider when designing training programs for LIFEGUARD SERVICES NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nLEAD WORKPLACE COMMUNICATION\nUNIT CODE\n:\n500311109\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to lead in\nthe dissemination and discussion of ideas, information and issues in\nthe workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1 Appropriate\ncommunication method\nis selected\n1.2 Multiple operations\ninvolving several topics\nareas are communicated\naccordingly\n1.3 Questions are used to gain\nextra information\n1.4 Correct sources of\ninformation are identified\n1.5 Information is selected and\norganized correctly\n1.6 Verbal and written\nreporting is undertaken\nwhen required\n1.7 Communication skills are\nmaintained in all situations\n•\nOrganization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n\n•\nEffective verbal\ncommunication\nmethods\n•\nOrganize\ninformation\n•\nUnderstand and\nconvey intended\nmeaning\n•\nParticipate in\nvariety of\nworkplace\ndiscussions\n•\nComply with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n2. Lead\nworkplace\ndiscussions\n2.1 Response to workplace\nissues are sought\n2.2 Response to workplace\nissues are provided\nimmediately\n2.3 Constructive contributions\nare made to workplace\ndiscussions on such issues\nas production, quality and\nsafety\n2.4 Goals/objectives and\n Action plan undertaken in\nthe workplace are\ncommunicated\n•\nLeading as a\nmanagement\nfunction\n•\nBarriers of\ncommunication\n•\nEffective verbal\ncommunication\nmethods\n•\nMethod/technique\ns of discussion\n•\nHow to lead\ndiscussion\n•\nHow to solicit\nresponse\n•\nCommunicating\neffectively\n\n•\nConsulting the\nLGs on the\nhousekeeping\nschedules\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 3\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n3.1 Issues and problems are\nidentified as they arise\n3.2 Information regarding\nproblems and issues are\norganized coherently to\nensure clear and effective\ncommunication\n3.3 Dialogue is initiated with\nappropriate personnel\n3.4 Communication problems\nand issues are raised as\nthey arise\n•\nTypes of issues\nand problems in\nthe workplace\n•\nWritten and\nelectronic\ncommunication\nmethods\n•\nCommunication\nbarriers affecting\nworkplace\ndiscussions\n•\nIdentifying cause\nof problems\n•\nIdentifying\nproblems and\nissues\n•\nOrganizing\ninformation on\nproblems and\nissues\n•\nRelating\nproblems and\nissues of call\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 4\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Dealt with a range of communication/information at one time\n1.2 Made constructive contributions in workplace issues\n1.3 Sought workplace issues effectively\n1.4 Responded to workplace issues promptly\n1.5 Presented information clearly and effectively written form\n1.6 Used appropriate sources of information\n1.7 Asked appropriate questions\n1.8 Provided accurate information\n\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1. Variety of Information\n2.2. Communication tools\n2.3. Simulated workplace\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Competency in this unit must be assessed through\n3.2 Direct Observation\n3.3 Interview\n\n4. Context for\nAssessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 5\n\nUNIT OF COMPETENCY\n:\nLEAD SMALL TEAMS (Guide and Lead Others/Be Responsible to\nOthers)\nUNIT CODE\n:\n500311110\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes to lead\nsmall\nteams\nincluding\nsetting\nand\nmaintaining\nteam\nand\nindividual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Work requirements are\nidentified and presented\nto team members\n1.2 Reasons for instructions\nand requirements are\ncommunicated to team\nmembers\n1.3 Team members’ queries\nand concerns are\nrecognized, discussed\nand dealt with\n•\nCompany policies\nand procedures\no How\nperformance\nexpectations\nare set\no Methods of\nMonitoring\nPerformance\n•\nClient\nexpectations\n•\nTeam member’s\nduties and\nresponsibilities\n•\nSkills and\ntechniques in\npromoting team\nbuilding\n•\nUp-to-date\ndissemination of\ninstructions and\nrequirements to\nmembers\n•\nArt of listening\nand treating\nindividual team\nmembers concern\n•\nCommunication\nskills required for\nleading teams\n•\nTeam building\nskills\n•\nNegotiating skills\n2. Assign\nresponsibilities\n2.1. Duties, and\nresponsibilities are\nassigned in consideration\nof skills, knowledge and\naptitude required to\nproperly undertake the\nassigned task and\naccording to company\npolicy\n2.2. Duties are allocated\nhaving regard to individual\npreference, domestic and\npersonal considerations,\nwhenever possible\n•\nConcept of\ndelegation\n•\nHow to delegate\n•\nUnderstanding\nindividual\ndifferences\n•\nMethods of\nmonitoring\nperformance\n•\nDuties and\nresponsibilities of\neach team\nmember\n\n•\nKnowledge in\nidentifying each\nteam member\n•\nDelegating skills\n•\nIdentifying\nindividual skills,\nknowledge and\nattitude as basis\nfor allocating\nresponsibilities\n•\nIdentifying each\nteam member\nduties and\nresponsibilities\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 6\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nduties and\nresponsibilities\n3. Set\nperformance\nexpectations for\nteam members\n3.1 Performance expectations\nare established based on\nclient needs and\naccording to assignment\nrequirements\n3.2 Performance expectations\nare based on individual\nteam members duties and\narea of responsibility\n3.3 Performance expectations\nare discussed and\ndisseminated to individual\nteam members\n•\nDefinition of\nperformance\nindicators/ criteria\n•\nDefinition of team\ngoals and\nexpectations\n•\nMethods of\nmonitoring\nperformance\n•\nClient\nexpectations\n•\nTeam members\nduties and\nresponsibilities\n•\nDefining\nperformance\nexpectations\ncriteria\n•\nIdentifying\nperformance\nindicators\n•\nEvaluating\nperformance\n•\nSetting individual\nperformance\ntarget/\nexpectation\nindicators\n4. Supervise team\nperformance\n4.1. Monitoring of\nperformance takes place\nagainst defined\nperformance criteria\nand/or assignment\ninstructions and corrective\naction taken if required\n4.2 Team members are\nprovided with feedback,\npositive support and\nadvice on strategies to\novercome any\ndeficiencies\n4.3 Performance issues which\ncannot be rectified or\naddressed within the team\nare referenced to\nappropriate personnel\naccording to employer\npolicy\n4.4 Team members are kept\ninformed of any changes\nin the priority allocated to\nassignments or tasks\nwhich might impact on\nclient/customer needs and\nsatisfaction\n4.5 Team operations are\nmonitored to ensure that\nemployer/client needs and\nrequirements are met\n4.6 Follow-up communication\nis provided on all issues\naffecting the team\n•\nUnderstanding,\nmonitoring of\nwork\n•\nHow to undertake\ncorrective action\n•\nUnderstanding\nfeedback and\nprocedure\n•\nFeedback\nreporting\nprocedure\n•\nMethods of\nmonitoring\nperformance\n•\nTeam member’s\nduties and\nresponsibilities\n•\nMonitoring team\noperation to\nensure client\nneeds and\nsatisfaction\n\n•\nMonitoring skills\n•\nSetting priorities\n•\nEvaluating\nperformance\n•\nInformal/ formal\ncounseling skill\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 7\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.7 All relevant\ndocumentation is\ncompleted in accordance\nwith company procedures\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work\nrequirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team\nmember’s\nconcerns\n2.1. Roster/shift details\n3. Monitor\nperformance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance\nissues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 8\nEVIDENCE GUIDE\n\n1. Critical\naspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team performance given\na variety of possible scenario\n1.2. Assessed and monitored team and individual performance against\nset criteria\n1.3. Represented concerns of a team and individual to next level of\nmanagement or appropriate specialist and to negotiate on their\nbehalf\n1.4. Allocated duties and responsibilities, having regard to individual’s\nknowledge, skills and aptitude and the needs of the tasks to be\nperformed\n1.5. Set and communicated performance expectations for a range of\ntasks and duties within the team and provided feedback to team\nmembers\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Materials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Direct observations of work activities of the individual member in\nrelation to the work activities of the group\n3.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3. Case studies and scenarios as a basis for discussion of issues and\nstrategies in teamwork\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n4.2. Assessment shall be observed while task are being undertaken\nwhether individually or in-group\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 9\nUNIT OF COMPETENCY\n:\nDEVELOP AND PRACTICE NEGOTIATION SKILLS\nUNIT CODE\n:\n500311111\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required to collect\ninformation in order to negotiate to a desired outcome and participate\nin the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan\nnegotiations\n1.1 Information on preparing for\nnegotiation is identified and\nincluded in the plan\n1.2 Information on creating non-\nverbal environments for\np