to the shore of the\nbeach through the\n•\nImplementation of\nsafety guidelines\nfor different\naquatic activities:\no Swimming at\nSwimming\nPools\no Swimming at\nBeaches\no Swimming in\nWaves\no 5Swimming at\nRivers\no Safe Fishing\no Safe Watercraft\nRecreation\no Safe Surfing\no Safe\nRecreational\nDiving and\nSnorkeling\no Conduct of\nWater Safety\nEducation and\nPrograms\n\n•\nAbility to\ncomprehend oral\nand written\ncommunication\n\n•\nAbility to swim by\norienting body at\nan angle to current\nflow, facing\nupstream for\nsurvival at river.\n\n•\nAbility to swim\nparallel with the\nwaves to escape a\nrip current.\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 31\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nHandbook.\n\nbreaking waves.\no Float and wave, if\nunable to escape\nfrom the rip.\no For swimming in\nwaves, strength is\nneeded to break\nthrough a wave\nand gain as much\ndistance before the\nnext wave.\no Appropriate PFDs /\nharness are worn\nduring beach or\nrock fishing.\n\n•\nSafety Practices\no Environmental\nprotection and\nconcerns\no Good grooming\nand personal\nhygiene\n\n•\nOccupational Safety\nand Health\nStandards\no Choosing and\nWearing of\nAppropriate PFD\n\n•\nCodes and\nRegulations\no Standards PFD\nClassification:\nType 1 to 3.\n\n•\nMaterials, Tools &\nEquipment: Uses,\nSpecifications and\nMaintenance\no Parts and\nfunctions of\nPersonal Flotation\nDevices (PFDs)\no Proper cleaning\nand stowing of\nPFDs\no PFDs storage and\nproper\nsafekeeping for\neasy pullout /\nuse\n\no Ability to float\nand wave inside\na rip current\n(simulating\ninability to\nescape a rip)\nperson\n\n•\nGet in and out\nof the water while\nwearing a PFD.\n\n5.1 Utilize and\nmaintain PFDs\n\n5.2 Practice\npersonal values\nin an aquatic\nenvironment\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 32\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n•\nValues\no Self-esteem\no Punctual/ Time\nconscious\no Environmental and\npollution conscious\no Flexible/ adaptable\no Honest\no Socially\nresponsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no Determined\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Aqua Code\nMay refer to but not limited to:\n1.1\nGSR Aquacode: Go together, Stay afloat and wave and\nReach to rescue.\n1.2\nP3R concept in lifesaving practice: Prevention, Recognition,\nRescue and Recovery.\n1.3\nSTAR Rescue Guide by RNLI: Stop, Think, Act and Review.\n1.4\nRCS2 Swimming Rescue components by the USLA:\nRecognize and Respond, Contact and Control, and Signal\nand Save.\n1.5\nILS Medical Position Statement MPS13 on Aquatic\nDisasters: Prevention, Rescue, Health Management and\nDebriefing.\n2. Uniforms\nMay refer to but not limited to :\n2.1\nWearing visible, identifiable and international consistent\nworkplace uniform of Yellow (Pantone 136-137) and Red\n(Pantone 186C) are encouraged to Aquatic Safety providers.\n2.2\nIdeally, upper body clothing (shirts, jacket, etc.) will be\nyellow and lower body clothing (swimsuit, shorts, pants etc.)\nin Red.\n2.3\nA set of Uniform should comprise of\n2.3.1 Swimwear\n2.3.2 Shirt (long sleeves are preferred for outdoor work to\nmaximize\n sun protection)\n2.3.3 Pants (long legged pants are preferred for outdoor\nwork to\n maximize sun protection)\n2.3.4 Hat (a broad brim is preferred for outdoor work to\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 33\nVARIABLE\nRANGE\nmaximize sun protection). Where peaked caps are\nused, there should be an attachment at the sides and\nrear which provides cover for the ears and neck.\n2.3.5 Polarized sunglasses for outdoor work.\n2.4\nClothing should allow protection from extreme temperatures\n(lightweight in predominantly hot environments, heavy\nweight in predominantly cold environments).\n2.5\nUniform should provide sun protection with recommended\nUPF50 or 50+.\n2.6\nOrganizations responsible are encouraged to provide\nUniforms. Uniforms are maintained in good condition and\nare worn at all times the lifesaver is on duty.\n2.7\nUniforms should have words prominently displayed that\nwould lead the user of the aquatic venue to believe the\nperson wearing the uniform is a lifesaver or a lifeguard. The\nwords should be bold, in a contrast color and a minimum of\n65mm in height.\n2.8\nCool/cold weather areas, lifesavers may need special\nprotective clothing such as thermal coats and wet/thermal\nsuits. Where appropriate these clothing should be red and\nyellow.\n\n2.9\nIn certain conditions, colors red and yellow are applied to\nother special protective items such as “Stinger” suits to\nprotect against dangerous marine creatures, footwear due to\nextreme hot or cold and rough ground conditions, lifejackets\nand helmets\n3. Sun protection\ndevices\nMay include:\n3 1\nSpectrum, water resistant SPF 30+ Sunscreen applied\ngenerously on all clean, dry, exposed skin 20 minutes before\ngoing outdoor\n3.2 100% UV resistant EPF 10 polarized Sunglasses with side\nthat does not obscure peripheral vision\n3.3\nShade Canopy / tent that block out UVR to 50% minimum.\n4. Flags\nMay include:\n4.1 Red and Yellow Flag hoisted at lifeguard stand indicating\nPool is supervised by Lifeguard.\n4.2\nRed Flag hoisted indicating No Swim instruction to guests.\n5. Signs\nMay include :\n5.1 Regulatory Symbols\n5.2 Warning Symbols\n5.3 Information Symbols\n5.4 Permissive Symbols\n5.5 Regulatory, Permissible and Safety symbols\n5.6 HazChem Symbols\n6. Currents\nMay include:\n6.1\nFactors that causes variable water flow\n6.1.1 Flooding\n6.1.2 Projecting Headlands\n6.1.3 Islands\n6.1.4 Winding River Course\n6.1.5 Hazards like debris, submerged trees or rocks.\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 34\nVARIABLE\nRANGE\n6.2 Factors that contribute to strength of current\n6.2.1 Volume of water\n6.2.2 Width and Depth of the River\n6.2.3 Rate of drop in the river bed\n6.2.4 Heavy rainfall\n6.2.5 Release of Water from storage areas or dams\n6.2.6 Tidal changes\n7. Submerged obstacles\nMay include:\n7.1 Trees\n7.2\nBranches\n7.3 Rocks\n7.4\nDiscarded rubbish\n8. Dangers in lakes,\ndams and lagoons.\nMay include:\n8.1 River entry points\n8.2 Cold water\n8.3\nWaves\n9. Water bodies in\nfarms or ponds\nMay include:\n9.1 Farm dams\n9.2 Irrigation channels\n9.3 Water Troughs\n9.4 Post Holes\n9.5\nWater Tanks\n10. Dangers in beach\nand ocean\nMay include:\n10.1 Waves in Open Water\n10.1.1 Plunging wave\n10.1.2 Spilling wave\n10.1.3 Surging wave\n10.2 Currents in Open Water\n10.2.1 Tidal Currents\n10.2.2 Runback Currents\n10.2.3 Rip Currents\n11. Potential dangers in\nswimming pool\nMay include:\n11.1 Large crowds with young children, elderly people or\ninexperienced swimmers\n11.2 Slippery surfaces around edges.\n11.3 Varied depths of water in the pool.\n12. Home aquatic\nEnvironment\nMay include:\n12.1 Unfenced Home Pools\n12.2 Gates and Barriers left open allowing easy access to a pool\n12.3 Uncovered SPA baths\n12.4 Buckets or pails filled with liquids\n12.5 Fish ponds in gardens which may attract unsupervised\nchildren\n12.6 Bath Tubs filled with water or with plug left in\n12.7 Toilets with open or accessible lids\n13. Guidelines for\nswimming at\nswimming pools\nMay include:\n13.1 Reading of Signs\n13.2 Obeying lifeguards\n13.3 Diving only where water is deep\n13.4 Staying in shallow water when not a strong swimmer.\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 35\nVARIABLE\nRANGE\n14. Guidelines for\nswimming at the\nbeach\nMay include:\n14.1 Swim only at patrolled beaches and stay between\nRed/Yellow flags.\n14.2 Identify a reference point on the beach to avoid drifting too\nfar from swimming area.\n14.3 Check with lifeguards if unsure of swimming conditions.\n14.4 Make sure on sound knowledge of waves, rips and currents\nif swimming on surf waters.\n14.5 Leave water immediately when instructed by lifeguards\n14.6 Swimming after dark means that you cannot be seen if in\ndifficulty.\n14.7 Swim parallel to the waves if caught in a rip current.\n14.8 Float and Wave, if unable to escape from the rip.\n15. Guidelines for\nswimming in waves\nMay include:\n15.1 Dive towards the bottom just before the wave arrives.\n15.2 Hold unto the bottom with both hands\n15.3 Bring down the feet and place them on the bottom.\n15.4 Push off the bottom back to the surface on the seaward side\nof the wave.\n15.5 Swim until next wave arrives and then repeat action.\n16. Guidelines for\nswimming at a river\nMay include:\n16.1 Being careful not to stand on an overhanging bank\n16.2 Checking the presence and strength of current before\nentering the water\n16.3 Spreading the body’s weight by lying flat on the surface, if\ntrapped in deep mud.\n16.4 Float feet first in a half-sitting position, if caught by a fast-\nflowing river or swift water drains.\n16.5 Angle (45 Degrees) into the current and swim so that you\nare pushed across to the edge, if caught by a current.\n17. Guidelines for safe\nFishing\nMay include:\n17.1 Guidelines for Beach Fishing\n17.2 Guidelines for Rock Fishing\n17.3 Guidelines for Boat Fishing\n17.4 Guidelines for Fishing on the bank of lake or river.\n18. Guidelines for safe\nwatercraft recreation\nMay include:\n18.1 Guidelines for Safe Boating\n18.2 Guidelines for Power Boats and Jet Skis\n18.3 Guidelines for Canoeing and Kayaking\n18.4 Choosing and Using PFDs\n19. Guidelines for safe\nsurfing\nMay include:\n19.1 Surfing always at patrolled beaches and designated surfing\narea.\n19.2 Obeying lifeguards\n19.3 Never surf after consuming alcohol.\n20. Guidelines for safe\n recreational diving\n and snorkeling\n\nMay include:\n20.1 Plan your dive before entering water, if a qualified diver.\n20.2 Practice all signals and emergency procedures\n20.3 Maintain a thorough logbook of dives\n20.4 Always take and use dive flags to enable others to see\nwhere you are diving.\n20.5 Test your Equipment and wear appropriate clothing and\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 36\nVARIABLE\nRANGE\nprotection for the dive duration.\n20.6 Tell someone where you are going and your estimated time\nof return.\n20.7 Snorkel in shallow, protected waters.\n21. Guidelines for the\n conduct of water\n safety programs\nMay include:\n21.1 Infant Aquatics\n21.2 Swim and Survive Program\n21.3 Junior Lifeguard Clubs\n21.4 Bronze Rescue\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 37\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge on aquacode, use of proper uniform\nand sun protection and the dangers of different aquatic\nenvironments\n1.2 Received and acted on messages and instruction of standard\nwater safety signage.\n1.3 Demonstrated swim competency based on swimming\nguidelines at the pool, beach, river and surf.\n1.4 Demonstrated water safety knowledge for fishing, water craft,\nsurfing, recreational diving and snorkeling.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Recognized Uniform\n2.2 Swimming Pool\n2.3 Alternative aquatic locations where pools are not available.\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation\n3.2 Oral interview\n3.3 Written Evaluation\n3.4 Third Party Report\n4. Context of\nassessment\nCompetency may be assessed individually in the actual workplace\nor simulation environment in TESDA accredited institutions.\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 38\nUNIT OF COMPETENCY :\nPERFORM RESUSCITATION (CPR + ILCOR + After Care)\nUNIT CODE\n:"
