        "source_text": "SOC541308\nUNIT DESCRIPTOR\n:\nThis unit covers skills and techniques for supervising patrons\nto include preventive actions to eliminate hazards and risks in\naquatic venues\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Perform\nlifeguarding\nscanning\n1.1\nSenses are used to\nsweep happenings\naround an aquatic\nenvironment.\n\n1.2 Danger points are\nattended in an\naquatic venue.\n\n1.3 Potential trouble or\ndistressed\nbehaviors of\nactive bathers are\ndetected.\n\n1.4 Sensory input\n scanning is\n provided in\n screening patrons\n for child\n supervision.\n\n1.5 Scanning strategy\nis applied to quickly\nrecognize / respond\nto aquatic incidents\nin accordance with\nILS as specified in\nHandbook on\nLifeguarding.\n\n1.6 Supervision zones\nare plotted and\ndegree of\nsupervision for\nphysically able and\npregnant women\nare intensified in\naccordance with\nILS as specified in\nHandbook on\n•\nTrade Theory\no The Senses and\nwhat they tell us\no Principles of\nscanning\no Different\nScanning\nStrategies and\nTechniques\no Scanning\nMethodology\n•\nCommunications\no Oral and Written\ncommunication\no Whistle and hand\nsignals\no Public Address\n(PA) System\no Alarms\n•\nMathematics and\nMensuration\no Repeated sweeps\nwithin 5 minutes\nallows focusing\non each patron at\nleast once.\n•\nSafety Practices\no Environmental\nprotection and\nconcerns\no Good grooming\nand personal\nhygiene\no Occupational\nSafety and\nHealth Standards\n•\nCodes and\nRegulations\no Guidelines for\no Safe Pool\nOperation\n(GSPO)\no Lifeguarding\nHandbook\n•\nAbility to effectively\nscan aquatic zone\nat the least time.\n\n•\nFamiliarized\ncharacteristic\nsights, sounds,\npatterns and\nrhythms of activity\nconsidered normal\nand unique to an\naquatic venue\nbeing served.\n\n•\nIdentify hazards\nand danger points\nin aquatic venues. .\n\n•\nComprehend oral\nand written\ncommunication\n\n•\nInterpret hand and\nwhistle\ncommunication\n\n•\nMensuration\napplied for\nefficiency of\nscanning tasks.\n\n•\nFollow in-house\nsafety procedures\non environmental\nprotection, good\ngrooming and\nhygiene,\noccupational safety\nand health\n\n•\nOperate and\nmaintain\nmultimedia\npresentation\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 67\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nLifeguarding.\n1.7 Communication\nwith patrons is\nmaintained in\naccordance with\nILS as specified in\nHandbook\n on Lifeguarding.\n\n•\nMaterials, Tools\n&Equipment: Uses,\nSpecifications and\nMaintenance\no Blast whistle\no PA System\no Alarm System\n•\nValues\no Self-esteem\no Punctual/\no Time conscious\no Environmental\nand pollution\nconscious\no Flexible/\nadaptable\no Honest\no Socially\nresponsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no Determined\nmaterials and\nequipment\n\n•\nAccess Guidelines\nfor Safe Pool\nOperation (GSPO)\nand Lifeguarding\nHandbook on\nSupervision\n\n•\nPractice personal\nvalues in aquatic\nvenues\n\n2. Strategize\npreventive\nactions for\nhazards and\nrisks control\n\n2.1 Degree of\nsupervision on\naquatic facilities is\nintensified in\naccordance with ILS\nas specified in\nLifeguarding\nHandbook.\n\n2.1 Aquatic safety\nsupervision is\nperformed in\naccordance with ILS\nas specified in\nLifeguarding\nHandbook.\n\n2.3 On-site\nsurveillance is\ndemonstrated in\naccordance with ILS\nas specified in\nLifeguarding\nHandbook.\n•\nTrade Theory\no Prevention\nthrough\nsupervision of\npatrons\no Safety\nsupervision in\nleisure facilities\no Number and\npositioning of\nlifeguards,\no Low patronage\npools\no Factors affecting\nsupervision\no Failure to\nrecognize\ndrowning\no Other duties and\ndistractions on\nlifeguards\n•\nCommunica