rd Services NC III (New) Promulgated December 16, 2015 70\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\no Alarms\n•\nMathematics and\nMensuration\no Five (5) minutes\nlimit of visual\ntasks\no Continuous\nmovement of\nhead and eyes\no Frequency of\nLifeguard rotation\no Establish rotation\nin 5-minute\nincrements for\nevery rotation\no Accounting of\npatrons in your\nzone scan period\n•\nSafety Practices\no Environmental\nprotection and\nconcerns\no Good grooming\nand personal\nhygiene\no Occupational\nSafety and Health\nStandards\no Buddy and\nCheck-in System\no Water Checks\no Safety Stops\n•\nCodes and\nRegulations\no Guidelines for\nSafe Pool\nOperation\n(GSPO)\n•\nMaterials, Tools\n&Equipment: Uses,\nSpecifications and\nMaintenance\no Blast whistle\no PA System\no Alarm System\n•\nValues\no Self-esteem\no Punctual/\no Time conscious\no Environmental\nand pollution\nconscious\no Flexible/\nadaptable\n•\nOperate and\nmaintain multimedia\npresentation\nmaterials and\nequipment\n•\n\n•\nAccess Guidelines\nfor Safe Pool\nOperation (GSPO)\nand Handbook on\nLifeguarding\n•\n\n•\nPractice personal\nvalues in aquatic\nvenues\n•\n\n•\n\n•\n\n--- PDF PAGE 76 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 71\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\no Honest\no Socially\nresponsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no Determined\n4. Monitor water\nquality for\nswimming\n4.1. Appropriate\namount of water\nsample is retrieved\nin test tubes using\nchlorine testing kit.\n4.2. Clarity and color of\nwater sample is\ncompared versus\nthe sealed tubes\nprovided in the test\nkit.\n4.3. Actual chlorine\nlevel is determined\nby reading the\nmarked number in\nthe most identical\nsealed tube of the\ntest kit.\n4.4. Rechecking\nchlorine level\nreading is\nrepeated.\n4.5. Chlorine test result\nis recorded and\nnotified to\nimmediate\nsuperior.\n4.6. Records of\nchlorine level\ntested is\nmaintained\naccording to\ncompany policies\nand procedures\n•\nTrade Theory\no Operation of\nChlorine Test Kit\no Parameters of an\nacceptable\nchlorine level for\nbathing\no Procedure for the\nconduct of\nchlorine level test\nin pool.\n•\nCommunication\no Oral and written\ncommunication\n•\nMathematics and\nMensuration\no Volume reading\nof water sample\no Comparison of\nwater sample\nbased on given\ncolor chart\no Reading of test\nlevel.\n•\nPerform chlorine\ntest procedure at\npool\n\n•\nDetermine\nappropriate chlorine\nlevel using the test\nkit.\n\n•\nComprehend oral\nand written\ncommunication\n\n•\nReport writing\n\n•\nAbility to extract the\nrequired volume of\nwater sample as\nread in test kit.\n\n•\nDetermine the right\nmatching color as in\nthe test kit color\nchart\n\n•\nRead tested\nchlorine level\n\n--- PDF PAGE 77 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 72\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Senses\nMay include:\n1.1\nVision\n1.2\nHearing\n1.3\nSmell\n1.4\nTouch\n2. Sweeps\nMay include:\n2.1\nVisual check of your zones and last only for few seconds\n2.2\nTracking patrons by their ages\n2.3\nTracking patrons by their heights\n2.4\nTracking patrons joining the dots between swimmers\n3. Danger points\nMay refer to but not limited to:\n3.1\nSweep eyes over entire zone\n3.2\nPatrons and activity directly in front of a Lifeguard\n3.3\nTower Lifeguards should look directly downwards\n3.4\nChecking of adjacent lifeguards on each sweep for signals\n3.5\nScan below the surface regularly.\n3.7\nDiving boards\n3.8\nDrop offs\n3.9\nLadders\n3.10 Toys and\n3.11 Small children\n3.12 Check to see that those who enter water from a dive, slide\nor diving boards resurface.\n4. Distressed Behaviors\nNot limited to:\n4.1\nDistressed Swimmers Behaviors\n4.2\nActive Drowning Behaviors\n4.3\nPassive Drowning Behaviors\n4.4\nUnconscious Victim\n\n5. Sensory input\nNot limited to:\n5.1\nHead counting\n5.2\nGrouping\n5.3\nMental filing\n5.4\nProfile matching\n5.5\nTracking\n6. Screening of patrons\nNot limited to\n6.1\nSupervision by parents to children\n6.2\nPromote water safety at the venue\n6.3\nEducate patrons about safety practices\n\n7. Active bathers\nNot limited to:\n7.1\nWater bobbers\n7.2\nCorner jumpers\n7.3\nSide jumpers\n7.4\nGutter grabbers / rope holders\n7.5\nSwimmers under diving boards\n7.6\nDisoriented people\n7.7\nBreath holders\n\n--- PDF PAGE 78 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 73\nVARIABLE\nRANGE\n8. Scanning Strategy\nNot limited to:\n8.1\nPosture\n8.2\nPosition\n8.3\nPattern (Circular, rectangular, horizontal and vertical, and\njoining the dots)\n8.4\nPatrons\n9. Supervision Zones\nNot limited to:\n9.1\nIntensive Scan\n9.2\nExtensive Scan\n9.3\nCombined Scan\n10. Communication with\n patrons\nNot limited to:\n10.1 Whistle signals\n10.2 Voice communication\n10.3 Public Address (PA) System\n10.4 Alarms\n11. Degree of Supervision\nNot limited to\n11.1 Size of the area\n11.2 Number of users and their activities\n11.3 Water activities offered\n11.4 Venue designs and shapes of pools\n11.5 Leisure area and features\n12. Safety Supervision\n\nNot limited to:\n12.1 Buddy and check-in systems\n12.2 Water checks\n12.3 Safety stops\n12.4 Number of lifeguards\n12.5 Low patronage pools\n12.6 Positioning of lifeguards\n12.7 Failure to recognize\n12.8 Other lifeguard duties\n12.9 Distractions\n13. On-site surveillance\nNot limited to:\n13.1 Number of lifeguards and their location\n13.2 Venue design or layout\n13.3 Supervision zones shape and size\n13.4 Lighting conditions\n13.5 Lifeguard line of sight and field of vision\n13.6 Roving supervision or ground-level station\n13.7 Elevated stations\n13.8 Rotations and breaks\n14. Potential difficulties\nNot limited to:\n14.1 Water flow in water slides and river rides\n14.1.1 Sliding and viscous friction\n14.1.2 Acceleration through a curve\n14.1.3 Kinetic energy resulted from movement\n14.1.4 Somersaulting riders\n\n--- PDF PAGE 79 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 74\nVARIABLE\nRANGE\n14.1.5 Currents – main, hydraulic and vortex currents\n14.1.6 Venturi effect\n14.1.7 Pendulum swing\n15. Special environment\nNot limited to:\n15.1 Activity basins and play structure\n15.2 Tarzan ropes, cargo nets and flying fox rides\n15.3 Inflatables\n16. Aquatic leisure facilities\nNot limited to:\n16.1 Spas\n16.2 Hydrotherapy pools (Wave pools, water slides, river rides,\noverhead chariot rides and rope swings, watercraft,\n16.3 Swimming pools\n16.4 Rivers and lake bathing areas\n16.5 Beaches\n16.6 Surf\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge and fitness skill in swimming 300\nmeters distance in 9 minutes at pool.\n1.2 Demonstrate entry and exits, floating and treading water.\n2. Resource implications\nThe following resources MUST be provided:\n2.1 Recognized Uniform\n2.2 Swimming Pool\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation\n3.2 Oral interview\n3.3 Written Evaluation\n3.4 Third Party Report\n4. Context of assessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment of TESDA accredited\ninstitutions.\n4.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 80 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 75\nUNIT OF COMPETENCY :\nPERFORM EMERGENCY RESPONSE TECHNIQUES\nUNIT CODE\n:"
