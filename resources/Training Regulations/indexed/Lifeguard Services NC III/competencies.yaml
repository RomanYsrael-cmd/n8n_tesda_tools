s and\nequipment\n\n•\nAccess Public\nSafety and\nAquatic Rescue\nHandbook and\nResuscitation\nCouncil\nGuidelines\n\n•\nPractice personal\nvalues in aquatic\nvenues\n\n--- PDF PAGE 85 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 80\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\no\nSelf-esteem\no\nPunctual/ Time\nconscious\no\nEnvironmental and\npollution conscious\no\nFlexible/ adaptable\no\nHonest\no\nSocially\nresponsible\no\nDependable\no\nInnovative\no\nAlert\no\nSystematic and\norganized\no\nCommitted\no\nCreative\no\nPatience\no\nDetermined\n4. Use appropriate\nlifeguarding and\nrescue aid,\nequipment and\nwatercrafts\n\n4.1 Use of rescue tube\nwhen retrieving\npatients in open\nwater is\ndemonstrated in\naccordance with\nILS as specified in\nPublic Safety and\nAquatic Rescue\nHandbook\n4.2 Use of rescue\nboards for reaching\npatients in open\nwater is\ndemonstrated in\naccordance with\nILS as specified in\nPublic Safety and\nAquatic Rescue\nHandbook\n\n4.3 Open water\nmaneuvers of\nmotorized rescue\ncrafts (Jet ski,\ninflatable rescue\nboats and motor\npump boats) are\nperformed in\naccordance with\nILS as specified in\nthe Handbook on\nSwimming and\nLifesaving.\n\n•\nTrade Theory\no\nPrinciple of rescue\ntube rescue\no\nPrinciple of rescue\nboard rescue\no\nGeneral principle\nof body board\no\nrescue\no\nLaunching the\nIRBs into open\nwater\n\n•\nCommunication\no\nOral and written\ncommunication\no\nHand and whistle\ncommunication\n\n•\nMathematics and\nMensuration\no\nKnow exactly\nwhere rescue unit\noperates including\nits call sign and\ntransmission\nprocedure\no\nEstimated time to\narrive for\nassistance\n\n•\nSafety Practices\no\nEnvironmental\n•\nPerform rescue\ntube rescue\n\n•\nAbility to use\nrescue boards for\nreaching victims\n\n•\nOperate personal\nwater craft or\njetski\n\n•\nLaunch IRBs from\nshore to open\nwater