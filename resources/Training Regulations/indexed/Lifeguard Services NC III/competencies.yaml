        "source_text": "SOC541203\nUNIT DESCRIPTOR\n:\nThis unit covers knowledge, skills and attitude to be safe in and\naround waters of recreation venues or places of normal abode.\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Implement the\nAqua code\n1.1 “Buddy system’ is\npracticed on or near\nwater.\n\n1.2 Aqua code drills for\nstaying afloat and\nwaving if in trouble\nwith water is applied\nin accordance with\nestablished\nstandards.\n\n1.3 Procedure in\nreaching out a stick\nor throwing a rope is\ndemonstrated in\naccordance with\nAqua code.\n\n•\nTrade Theory\no\nUnderstanding\nWater Safety\no\nDefinition of\nDrowning\no\nTypes of\ndrowning victim\no\nSafety\nconsideration as\na Lifesaver\no\nPrevention of\naquatic\nemergencies\no\nTypes of\ngrabbing\n-\nSingle grab\n-\nDouble grab\n-\nFront grab\n-\nBack Grab\no\nThe Principle of\nAqua code\n-\nG- Go\ntogether\n-\nS- Stay\nafloat and\nwave\n-\nR- Reach to\nrescue\n\n•\nCommunications\no\nOral and written\ncommunication\n\n•\nMathematics and\nMensuration\no\nDepth of water\no\nDistance to\nSafety\no\nLength of\no\nStick or Rope\no\nSafety Practices\n\n•\nCommunication\nskills\n•\nAbility to stay\nafloat and wave\none arm calmly\nwhen in trouble in\nthe water.\n•\nAbility to reach out\nwith a stick or a\nrope to rescue a\nconscious victim.\n•\nComprehension\nskills\n•\nAbility to practice\nin-house safety\nprocedure on\nenvironmental\nprotection, good\ngrooming and\nhygiene,\noccupational\nsafety and health\n•\nUse of appropriate\nclothing for aquatic\nactivity\n•\nAbility to prepare\nsun protection\ndevices and fluids\nfor rehydration.\n•\nAbility to prepare\nmobile phone for\nuse in any\nemergency.\n•\nProper use and\nSafe keep of wet\npersonal wears to\ninclude throw lines\nor ropes.\n•\nAbility to practice\npersonal values in\nan aquatic\nenvironment\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Servic