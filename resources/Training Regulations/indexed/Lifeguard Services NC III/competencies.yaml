          "source_text": "1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors influencing\nnegotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to achieve an\nagreed outcome\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Room with facilities necessary for the negotiation process\n2.2 Human resources (negotiators)\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Observation/demonstration and questioning\n3.2 Portfolio assessment\n3.3 Oral and written questioning\n3.4 Third party report\n4. Context for\nAssessment\nCompetency to be assessed in real work environment or in a simulated\nworkplace setting.\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 12\nUNIT OF COMPETENCY\n:\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n:"
