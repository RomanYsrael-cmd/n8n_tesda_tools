on\nconscious\no\nFlexible/\nadaptable\no\nHonest\no\nSocially\nresponsible\no\nDependable\no\nInnovative\no\nAlert\no\nSystematic\nand organized\no\nCommitted\no\nCreative\no\nPatience\no\nDetermined\n\nin aquatic\nvenues\n\n--- PDF PAGE 101 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 96\nRANGE OF VARIABLE\n\nVARIABLE\nRANGE\n1. AED accessories\nNot limited to:\n1. 1 resuscitation mask\n1.2\nGloves\n1.3\nRazors\n1.4\nGauze wipes (or similar)\n1.5\nSpare battery (if applicable to AED)\n1.6\nBlanket\n1.7\nPen and paper\n1.8\nTowel\n2. Equipment\nNot limited to:\n2.1\nAED machine (trainer type)\n2.2\nPortable Oxygen tank with regulator set\n3. Normal Operation\nNot limited to:\n3.1\nAED machine is functioning normally when tested\n3.2\nSpare battery for AED is available, when necessary\n3.3\n4. Signs of Life\nNot limited to:\n4.1 moving\n4.2 breathing\n4.3 respondent\n5. Preparation for\n operation of AED\n machine\nNot limited to:\n5.1 Confirm that the patient needs defibrillation\n5.2 Check that conditions are safe for the use of AED\n5.3 Turn on AED and follow prompts\n5.4 Apply electrode to the patient’s chest\n5.5 Respond to the AED prompt\n5.6 Deliver shock in an appropriate and safe manner when\nprompted\n5.7 Check for signs of life and commence CPR if required.\n6. AED prompts\nNot limited to:\n6.1 “Press on” to turn on defibrillator\n6.2 “Attach electrodes” to attach electrode pads to patient\n6.3 “Press to analyze” to initiate analysis to patient\n6.4 “Charging” to warn that charging is taking place\n6.5 “Stand Clear” or “Do not touch patient” to warn not to\ntouch the patient\n6.6 ”Shock Advised” to initiate shock\n6.7 “No shock advised” to state that a non-shockable rhythm\nis present. Must check for signs of life.\n6.8 “Check electrodes” to warn that ECG signal is\nUnsatisfactory\n6.9\n“Stand clear” is advise to shock.\n7. Basic Life Support\nProtocol\nNot limited to:\n7.1 Check for signs of life\n7.2\nCommence CPR if required\n\n--- PDF PAGE 102 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 97\n\nVARIABLE\nRANGE\n8. Victim in need of oxygen\ntherapy\nNot limited to:\n8.1\nUnconscious\n8.2 In shock\n8.3 Has blood loss\n8.4 Experience chest pain\n8.5 Has shortness of breath\n8.6 Received resuscitation\n8.7 Not breathing\n8.8 In severe pain\n9. Materials\nNot limited to:\n9.1\nTherapy mask\n9.2 Tubing\n9.3 Portable oxygen tank\n\n10. Precautions in using\noxygen\nNot limited to:\n10.1 There is no open flame or lighted cigarette in immediate\nvicinity\n10.2 No grease or oil is used with oxygen equipment\n10.3 Remember that oxygen promotes all types of combustion\n10.4 Do not allow anyone to tamper with oxygen equipment\n10.5 Store oxygen in cool, well-ventilated place\n10.6 Oxygen bottles are lying flat, or securely fastened\n10.7 Only medical oxygen is used\n10.8 Never use oxygen when delivering a shock via a\nDefibrillator\n11. Oxygen therapy\nmethod\n\nNot limited to:\n11.1 Conscious patient and does not want to use mask-\nprovide oxygen-rich air without mask\n11.2 Conscious patient – place mask onto patient’s face from\nthe chest upwards, cupping the patient’s chin in the mask\nfirst and the gently placing the nosepiece into position\n11.3 Unconscious breathing patient – oxygen should be\nadministered in the lateral position while observing\nairway, breathing and signs of life.\n\n--- PDF PAGE 103 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 98\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Explain and demonstrate safety protocol in the use of AED\nMachine\n1.2 Explain and demonstrate safety protocol in the use of Oxygen\nEquipment\n1.3 Operate AED machine\n1.4 Operate Oxygen Therapy Equipment\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1. AED Machine (trainer)\n2.2. Portable Oxygen set\n2.3. Tools, equipment and supplies/materials relevant to the activity to\nbe performed\n2.4. Work area/facilities\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with Oral Questioning\n3.2 Third-Party Report\n3.3 Portfolio\n4. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\naccredited assessment center\n\n--- PDF PAGE 104 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 99\nUNIT OF COMPETENCY :\nCOMMUNICATE USING RADIO TRANSCEIVER\nUNIT CODE\n:"
