        "source_text": "500311111\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required to collect\ninformation in order to negotiate to a desired outcome and participate\nin the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan\nnegotiations\n1.1 Information on preparing for\nnegotiation is identified and\nincluded in the plan\n1.2 Information on creating non-\nverbal environments for\npositive negotiating is\nidentified and included in the\nplan\n1.3 Information on active\nlistening is identified and\nincluded in the plan\n1.4 Information on different\nquestioning techniques is\nidentified and included in the\nplan\n1.5 Information is checked to\nensure it is correct and up-to-\ndate\n•\nKnowledge on\nCodes of practice\nand guidelines for\nthe organization\n•\nKnowledge of\norganizations\npolicy and\nprocedures for\nnegotiations\n•\nDecision making\nand conflict\nresolution\nstrategies\nprocedures\n•\nConcept of\nnegotiation\n\n•\nCommunication\nskills (verbal\nand listening)\n•\nActive listening\n•\nSetting conflict\n•\nPreparing\nconflict\nresolution\n•\nProblem solving\nstrategies on\nhow to deal with\nunexpected\nquestions and\nattitudes during\nnegotiation\n•\nInterpersonal\nskills to develop\nrapport with\nother parties\n\n2. Participate in\nnegotiations\n2.1 Criteria for successful\noutcome are agreed upon by\nall parties\n2.2 Desired outcome of all\nparties are considered\n2.3 Appropriate language is used\nthroughout the negotiation\n2.4 A variety of questioning\ntechniques are used\n2.5 The issues and processes\nare documented and agreed\nupon by all parties\n2.6 Possible solutions are\ndiscussed and their viability\nassessed\n2.7 Areas for agreement are\nconfirmed and recorded\n2.8 Follow-up action is agreed\nupon by all parties\n•\nOutcome of\nnegotiation\n•\nKnowledge on\nLanguage\n•\nDifferent\nQuestioning\ntechniques\n•\nProblem solving\nstrategies on how\nto deal with\nunexpected\nquestions and\nattitudes during\nnegotiation\n•\nFlexibility\n•\nEmpathy\n•\nDecision making\nand conflict\nresolution\nstrategies\nprocedures\n•\nProblem solving\nstrategies on how\nto deal with\nunexpected\nquestions and\n•\nNegotiating skill\n•\nCommunication\nskills (verbal\nand listening)\n•\nObservation\nskills\n•\nInterpersonal\nskills to develop\nrapport with\nother parties\n•\nApplying\neffective\nquestioning\ntechniques\n•\nSetting conflict\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 10\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nattitudes during\nnegotiation\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the negotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non- verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self-disclosing\nAnalytic skills\n1.6.1 observing differences between content and process\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for resolving\nconflict\n2. Non- verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 11\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors influencing\nnegotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to achieve an\nagreed outcome\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Room with facilities necessary for the negotiation process\n2.2 Human resources (negotiators)\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Observation/demonstration and questioning\n3.2 Portfolio assessment\n3.3 Oral and written questioning\n3.4 Third party report\n4. Context for\nAssessment\nCompetency to be assessed in real work environment or in a simulated\nworkplace setting.\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 12\nUNIT OF COMPETENCY\n:\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n:"
