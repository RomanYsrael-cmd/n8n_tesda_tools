red in\ncompliance with\nISO20712-1-\n2008,ISO20712-2-\n2008For Water\nSafety signs and\nBeach Safety Flags\n\n2.5 Lifesaving\nEquipment is\nprepared in the\ndesignated swim or\nactivity area.\n\n2.6 Patrol flags are\n•\nTrade Theory\no Coastal public\nsafety – general\nprinciples\no Designating the\nbeach\no Aquatic activity\nzoning and\nsafety buffer\nzones\no Safety Signs\no General\nOperation (GO)\nof Beaches\no Guidelines for\nlifesaving\nservices\no Responsibilities\nof lifesaver/\nlifeguard\no Guidelines for\nCoastal Tourism\no Safety\no Patrol Briefing\nProcedures\no Closing aquatic\nvenues\n\n•\nCommunication\no Oral and Written\ncommunication\no Hand and\nwhistle Signals\no Radio\nCommunication\n\n•\nMathematics and\nMensuration\no Beach access\nand traffic\nmanagement for\naquatic activity\no Ratio of number\nof swimmers per\n•\nAbility to define\nappropriate\npatrol method to\na specific aquatic\nenvironment\n\n•\nObservance of\nLifeguard\noperational\nparameters\n\n•\nNegotiate\nsigning of patrol\nservice\nagreement\n\n•\nDiscussed\naquatic standard\noperating\nprocedure\n(SOP)\n\n•\nIdentify specific\npatrol flags and\nhoisting\n\n•\nPreparation of\nlifesaving\nequipment\n\n•\nIdentify patrol\nand safety buffer\nzones\n\n•\nJudgment for\naquatic venue\nclosure for public\nsafety.\n•\n•\nComprehend\noral and written\ncommunication\n•\n•\nCommunicate by\nhand and whistle\nsignals\n\n--- PDF PAGE 116 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 111\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nhoisted based on\nacceptable\nlifeguard patrol\nand zoning\nprotocols in\ncompliance with\nISO20712-1-\n2008,ISO20712-2-\n2008 for Water\nSafety signs and\nBeach Safety Flags\n\n2.7 Patrolled areas\nand safety buffer\nzones are\nestablished in\naccordance to\nCoastal Public\nSafety Guidelines.\n\n2.8 Closing of aquatic\nvenue is\nrecommended to\nevent organizer\nshould prevailing\nsituation endanger\npublic safety.\n\nlifeguard\no Beach rating on\nrisk and hazard\no Peak visitation\nhours\no Course type and\ndistance of\naquatic event\n\n•\nSafety Practices\no Environmental\nprotection and\nconcerns\no Good grooming\nand personal\nhygiene\no Occupational\nSafety and\nHealth\nStandards\n\n•\nCodes and\nRegulations\no Coastal Public\nSafety\nGuidelines\no Handbook on\nPublic Safety\nand Aquatic\nRescue\n\n•\nMaterials, Tools &\nEquipment: Uses,\nSpecifications and\nMaintenance\no Blast whistle\no Radio\nEquipment\no Patrol Flags\no Lifesaving\nequipment\n\n•\nValues\no Self-esteem\no Punctual/ Time\nconscious\no Environmental\nand pollution\nconscious\no Flexible/\n•\n•\nMensuration\napplied for\nefficiency of\nlifeguard patrol\nservices\n•\nFollow in-house\nsafety\nprocedures on\nenvironmental\nprotection, good\ngrooming and\nhygiene,\noccupational\nsafety and health\n•\n•\nOperate and\nmaintain\nmultimedia\npresentation\nmaterials and\nequipment\n•\n•\nAccess the\nCoastal Public\nSafety\nGuidelines\n(2008) and\nPublic Safety\nand Aquatic\nRescue\nHandbook (33rd\nEdition or later)\n•\n•\nPractice\npersonal values\nin aquatic\nvenues\n•\n•\n\n--- PDF PAGE 117 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 112\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nadaptable\no Honest\no Socially\nresponsible\no Dependable\no Innovative\no Alert\no Systematic\nand organized\no Committed\no Creative\no Patience\no Determined\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Aquatic Events\nNot limited to:\n1.1 Sporting Event\n1.2 Lifesaving and open water competition\n1.3 Aquatic recreational activities to include swimming, surfing,\nboating and fishing\n1.4 Organized games and activities\n1.5 Aquatic training\n1.6 Sub-aqua and power craft to include personal watercraft and\nwaterskiing\n1.7 Sporting sailing or regattas\n2. Sources of risk\nNot limited to:\n2.1 Human factor\n2.2 Environmental factor\n2.3 External Factor\n2.4 Administrative factor\n\n3. Patrolling Methods\nNot limited to:\n3.1 Between the flags method\n3.2 Roving method\n3.3 Outpost method\n3.4 Watching the public\n3.5 Scanning\n\n4. Parameters for\n Lifeguard Operation\nNot limited to:\n4.1 Length of season\n4.2 Times of day you will patrol\n4.3 Patrol strength\n\n--- PDF PAGE 118 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 113\nVARIABLE\nRANGE\n4.4 Equipment\n4.5 Patrol member qualification\n5. Patrol Service\nAgreement or\nStandard Operating\nProcedures (SOP)\nNot limited to:\n5.1 Patrol Season, times, strength and area\n5.2 Specific patrol operation (Opening and closing beach, activity\n zoning, lost/missing person, lost property, breach of peace in\n beaches, what to do if insufficient numbers on patrol,\nlightning,\n sharks, tsunami warning, marine pollution and inappropriate\n behavior)\n5.3 Patrol uniforms\n5.4 Patrol equipment\n5.5 Reporting and forms\n5.6 Watercraft management\n5.7 Junior activities and water safety requirements\n5.8 Vehicle operation and traffic in aquatic area\n5.9 Peer support arrangement\n5.10 Media procedures\n6. Patrol Flags\nNot limited to:\n6.1 Red and Yellow Flags\n6.2 Black and white Checkered Flags\n6.3 Red Flags\n7. Lifesaving Equipment\nNot limited to:\n7.1 Rescue Tube\n7.2 Rescue Board\n7.3 First Aid Kit\n7.4 Spine board\n7.5 Fins\n7.6 Watercrafts\n8. Lifeguard patrol and\nzoning protocols\nNot limited to:\n8.1 Two (2) red and yellow flags means patrolled area\n8.2 One (1) red and yellow flag means lifeguard on duty\n8.3 Black and white checkered flag beside red and yellow flags\nmeans buffer zone for watercraft area\n8.4 Red flag means Beach is closed\n8.5 Full Patrol method of operation\n8.6 Surveillance method of operation\n8.7 Patrol Strength compliance\n9. Patrolled areas and\nsafety buffer zones\nNot limited to:\n9.1 Identifiable both from in the water and from the land/beach\nusing buoyage.\n9.2 Areas that have been zoned for a particular use can be\ndefined using flags, signs and buoys.\n9.3 Time zones should be used as a tool allowing or restricting\nspecified activities to be conducted at prescribed times\n\n--- PDF PAGE 119 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 114\nVARIABLE\nRANGE\n9.4 Wherever possible, signs on the shore be used in addition to\nbuoys in the water.\n9.5 Once established, monitoring and maintaining zone areas\nmust be ensured.\n9.6 Provide zoning scheme or diagram\n10. Closing of aquatic\nvenue\nNot limited to:\n10.1 Where access points to the beach can be identified,\n“Swimming Prohibited” sign should be posted\n10.2 Where swimming area would normally be located, “No\nSwimming” sign should be posted.\n10.3 At intervals along water edge, “Swimming Prohibited” sign\nshould be displayed\n10.4 Red and yellow patrol flags must be taken down and may be\nreplaced by a red flag.\n10.5 When the beach is closed, at least two (2) resort personnel\nwill be assigned to patrol beach and make sure swimmers do\nnot go to the water.\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Consulted and prepared client on desired safety requirements\nof the event.\n1.2 Assessed Aquatic risks and conduct hazard mapping on the\nevent venue\n1.3 Discussed with clients possible risks\n1.4 Set up safety signage to minimize risk wherever possible\n1.5 Advised Clients if event venue needs to be transferred to a\nmore safe location.\n1.6 Set up lifesaving equipment\n1.7 Set up Patrol Flags and aquatic zoning\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Beach area\n2.2 Tools, equipment and supplies/materials relevant to the\nactivity to be performed\n2.3 Work area/facilities\n\n3. Methods of\nassessment\nCompetency may be assessed through:\n3.1 Demonstration with Oral Questioning\n3.2 Third-Party Report\n3.3 Portfolio\n4. Context of\nassessment\nCompetency may be assessed in the workplace or TESDA\nAccredited assessment center\n\n--- PDF PAGE 120 ---\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 115"
