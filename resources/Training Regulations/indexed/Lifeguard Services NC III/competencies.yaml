\nLifesaving.\n\n•\nSafety Practices\no Environmental\nprotection and\nconcerns\no Good grooming\nand personal\nhygiene\no Occupational\nSafety and Health\nStandards\n\n•\nCodes and\nRegulations\no GSPO Section 3-\nF8 on First Aid\nForms\no GSPO Section 3\n– FA4 on First Aid\nKits.\no GSPO Section 3-\nF7 on Personal\nProtective\nEquipment and\nSafety.\n\n•\nMaterials, Tools &\nEquipment: Uses,\nSpecifications and\nMaintenance\no First aid kit or bag\no Emergency\nHygiene Pack:\nwash soap,\ndisposable\ngloves, household\nbleach and trash\ndisposal plastic\nbag\no First aid record\nCompilation\no Spine Board with\nhead immobilizer\no Folding Stretcher\nwith roller\n\n•\nValues\no Self-esteem\no Punctual/\no Time conscious\no Environmental\nand pollution\nconscious\no Flexible/\nadaptable\noral and written\ncommunication\n\n•\nPractice in-house\nsafety procedure on\nenvironmental\nprotection, good\ngrooming and\nhygiene,\noccupational safety\nand health\n\n•\nAccess Handbook\nfor Swimming and\nLifesaving on\nEmergency Care.\n\n•\nMonitor\nmaintenance\nsystem for\nmultimedia\nillustrations on\nEmergency Care\n\n•\nClean and Maintain\nFirst aid kit or bag,\nfirst aid log, spine\nboard and folding\nstretcher.\n\n•\nDispose properly\nhygiene packs used\nin emergency and\nclean treatment\narea.\n\n•\nPractice personal\nvalues in classroom\nand in an aquatic\nenvironment\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 50\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\no Honest\no Socially\nresponsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no Determined\n3. Communicate\ndetails of the\nincident\n\n3.1\nFirst Aid records or\nlogs of injury or\nincident is\ndocumented in\naccordance with\nILS as specified in\nthe Handbook on\nSwimming and\nLifesaving.\n3.2\nData on injury or\nincident is\nsubmitted to\nemergency or\nmedical service\nproviders in\naccordance with ILS\nas specified in the\nHandbook on\nSwimming and\nLifesaving.\n•\nTrade Theory\no Use of Incident\nReport Form\no Fill-out forms for\nFirst Aid or\nIncident\nRecording\n\n•\nCommunications\no Oral and written\ncommunication\n\n•\nMathematics and\nMensuration\no Provide relevant\ndata on injury or\nincident for\nmedical service\nuse and future\nreference.\n\n•\nSafety Practices\no Environmental\nprotection and\nconcerns\no Good grooming\nand personal\nhygiene\no Occupational\nSafety and Health\nStandards\n\n•\nCodes and\nRegulations\no Emergency Log\nProcedure is\nconsistent with\nLifesaving and\nSwimming\nHandbook on\nEmergency Care\n\n•\nFill out Incident /\nFirst Aid Report\nForm\n\n•\nTurn-over a copy of\nIncident/First Aid\nReport to\nresponding\nemergency service.\n\n•\nComprehend oral\nand written\ncommunication\n\n•\nPractice in-House\nsafety procedure on\nenvironmental\nprotection, good\ngrooming and\nhygiene,\noccupational safety\nand health\n\n•\nAccess Handbook\nfor Lifeguarding on\nRisk Management.\n\n•\nMonitor\nmaintenance\nsystem for\nmultimedia\nillustrations on\nEmergency Care\n\n•\nClean and Maintain\nIncident/first aid\nReport Compilation.\n\n•\nPractice personal\nvalues in classroom\nand in an aquatic\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 51\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n•\nMaterials, Tools &\nEquipment: Uses,\nSpecifications and\nMaintenance\no First aid kit or\nbag\no First aid record\nCompilation\n\n•\nValues\no Self-esteem\no Punctual/\no Time conscious\no Environmental\nand pollution\nconscious\no Flexible/\nadaptable\no Honest\no Socially\nresponsible\no Dependable\no Innovative\no Alert\no Systematic and\norganized\no Committed\no Creative\no Patient\no Determined\nenvironment\n•\n\n•\n\n•\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 52\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Signs and symptoms\n for aquatic injury\n\nMay include but are not limited to:\n1.1\nAsthma\n1.2\nBites and Stings.\n1.3\nBleeding\n1.4\nBurns.\n1.5\nChest Injuries.\n1.6\nChoking.\n1.7\nCold Injury.\n1.8\nDiabetes.\n1.9\nDrowning and Near-drowning.\n1.10 Ear Problem.\n1.11 Environmental Exposure.\n1.12 Facial Injuries.\n1.13 Fainting.\n1.14 Foreign bodies in the eye, ear and nose.\n1.15 Fractures.\n1.16 Head Injury.\n1.17 Heat illness.\n1.18 Hyperthermia.\n1.19 Muscle Injuries.\n1.20 Poisoning.\n1.21 Seizures and Convulsions.\n1.22 Shock.\n1.23 Spinal Injuries.\n1.24 Stroke\n2. First Aid Kits\nMay include :\n2.1\nMaking First aid Kits available at Home and Cars\n2.2\nInstall First aid Kits in proper location where employees in a\nwork place can access easily.\n2.3\nFirst aid Kits must be regularly checked and maintained.\n3. Triage\nMay include:\n3.1\nSorting and allocating of aid on the basis of need for a likely\nbenefit from medical treatment\n3.2\nClassifying casualties according to injury category:\n3.2.1 Trivial Injuries\n3.2.2 Injuries that require medical treatment but not\n hospitalization\n3.2.3 Urgent Medical Aid and hospitalization\n3.2.4 Clinically dead or likely to die before arrival to hospital\n3.3\nObservance of the order of treatment and evacuation\n3.3.1 In most situations\n3.3.2 In mass emergencies\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 53\nVARIABLE\nRANGE\n4. Hygiene\nMay include:\n4.1 The use of the cleanest equipment available.\n4.2 Washing of hands with water and soap..\n4.3 Wearing of disposable gloves\n4.4 Use of pre-packed disposable sterile equipment, dressing\nand bandages.\n4.5 Careful disposal of all items contaminated by blood after\ngiving treatment.\n4.6 Clean or sanitize areas used in emergency treatment\n4.7 Careful disposal of gloves used and thoroughly washed\nhands with water and soap.\n5. Records or Logs\nMay include:\n5.1 Protection of the Casualties\n5.2 Protection of the First aider\n5.3 Indications of Patterns and provide data for evaluation on\ninjury trends.\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\nPracticed the basic procedures of Aquatic Emergency Care\n2. Resource\nimplications\nThe following resources MUST be provided:\nFacilities, materials, tools and equipment necessary for the activity\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Third Party Report\n3.2 Interview\n3.3 Demonstration with questioning\n4. Context of\nassessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting.\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 54\nUNIT OF COMPETENCY :\nPERFORM LIFEGUARDING HAND AND WHISTLE SIGNALS\nUNIT CODE\n:"
