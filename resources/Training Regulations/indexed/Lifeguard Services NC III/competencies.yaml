        },
        "source_text": "500311109\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to lead in\nthe dissemination and discussion of ideas, information and issues in\nthe workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1 Appropriate\ncommunication method\nis selected\n1.2 Multiple operations\ninvolving several topics\nareas are communicated\naccordingly\n1.3 Questions are used to gain\nextra information\n1.4 Correct sources of\ninformation are identified\n1.5 Information is selected and\norganized correctly\n1.6 Verbal and written\nreporting is undertaken\nwhen required\n1.7 Communication skills are\nmaintained in all situations\n•\nOrganization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n\n•\nEffective verbal\ncommunication\nmethods\n•\nOrganize\ninformation\n•\nUnderstand and\nconvey intended\nmeaning\n•\nParticipate in\nvariety of\nworkplace\ndiscussions\n•\nComply with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n2. Lead\nworkplace\ndiscussions\n2.1 Response to workplace\nissues are sought\n2.2 Response to workplace\nissues are provided\nimmediately\n2.3 Constructive contributions\nare made to workplace\ndiscussions on such issues\nas production, quality and\nsafety\n2.4 Goals/objectives and\n Action plan undertaken in\nthe workplace are\ncommunicated\n•\nLeading as a\nmanagement\nfunction\n•\nBarriers of\ncommunication\n•\nEffective verbal\ncommunication\nmethods\n•\nMethod/technique\ns of discussion\n•\nHow to lead\ndiscussion\n•\nHow to solicit\nresponse\n•\nCommunicating\neffectively\n\n•\nConsulting the\nLGs on the\nhousekeeping\nschedules\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 3\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n3.1 Issues and problems are\nidentified as they arise\n3.2 Information regarding\nproblems and issues are\norganized coherently to\nensure clear and effective\ncommunication\n3.3 Dialogue is initiated with\nappropriate personnel\n3.4 Communication problems\nand issues are raised as\nthey arise\n•\nTypes of issues\nand problems in\nthe workplace\n•\nWritten and\nelectronic\ncommunication\nmethods\n•\nCommunication\nbarriers affecting\nworkplace\ndiscussions\n•\nIdentifying cause\nof problems\n•\nIdentifying\nproblems and\nissues\n•\nOrganizing\ninformation on\nproblems and\nissues\n•\nRelating\nproblems and\nissues of call\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 4\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Dealt with a range of communication/information at one time\n1.2 Made constructive contributions in workplace issues\n1.3 Sought workplace issues effectively\n1.4 Responded to workplace issues promptly\n1.5 Presented information clearly and effectively written form\n1.6 Used appropriate sources of information\n1.7 Asked appropriate questions\n1.8 Provided accurate information\n\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1. Variety of Information\n2.2. Communication tools\n2.3. Simulated workplace\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Competency in this unit must be assessed through\n3.2 Direct Observation\n3.3 Interview\n\n4. Context for\nAssessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 5\n\nUNIT OF COMPETENCY\n:\nLEAD SMALL TEAMS (Guide and Lead Others/Be Responsible to\nOthers)\nUNIT CODE\n:"
