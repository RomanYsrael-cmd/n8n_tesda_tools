        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge on aquacode, use of proper uniform\nand sun protection and the dangers of different aquatic\nenvironments\n1.2 Received and acted on messages and instruction of standard\nwater safety signage.\n1.3 Demonstrated swim competency based on swimming\nguidelines at the pool, beach, river and surf.\n1.4 Demonstrated water safety knowledge for fishing, water craft,\nsurfing, recreational diving and snorkeling.\n2. Resource\nimplications\nThe following resources MUST be provided:\n2.1 Recognized Uniform\n2.2 Swimming Pool\n2.3 Alternative aquatic locations where pools are not available.\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation\n3.2 Oral interview\n3.3 Written Evaluation\n3.4 Third Party Report\n4. Context of\nassessment\nCompetency may be assessed individually in the actual workplace\nor simulation environment in TESDA accredited institutions.\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nTR – Lifeguard Services NC III (New) Promulgated December 16, 2015 38\nUNIT OF COMPETENCY :\nPERFORM RESUSCITATION (CPR + ILCOR + After Care)\nUNIT CODE\n:"
