        "source_text": "ICT313361\nUNIT DESCRIPTOR : This unit introduces the fundamentals of SQL using Oracle\nDatabase technology. Specifically it teaches the concepts of\nrelational databases and the SQL programming language. It\nteaches how to write queries against single and multiple tables,\nmanipulate data in tables, and create database objects. It also\nteaches how to use single row functions to customize output, use\nconversion functions and conditional expressions.\n\nThis unit also focuses on how to effectively use SQL commands\nagainst business data. It teaches features that will help query and\ndata manipulation within the database and also how to use the\ndictionary views to retrieve metadata and create reports about their\nschema objects. Further, it also teaches features on how to set\nuser access level and usage of scalar and correlated sub-queries.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Retrieve Data\nUsing the SQL\nSELECT Statement\n\n1.1 Capabilities of SQL SELECT statements are listed in accordance\nwith PL/SQL framework\n1.2 Report of data from the output of a basic SELECT statement is\ngenerated in accordance with PL/SQL framework\n1.3 Arithmetic expressions and NULL values are used in accordance\nwith PL/SQL framework\n1.4 Column aliases are implemented in accordance with PL/SQL\nframework\n1.5 Concatenation operator, literal character strings, alternative\nquote operator, and the DISTINCT keyword are described in\naccordance with PL/SQL framework\n1.6 Data is Sorted and Restricted in accordance with PL/SQL\nframework\n2. Use Single-Row\nFunctions to\nCustomize Output\n2.1 Single row and multiple row functions are differentiated in\naccordance with PL/SQL framework\n2.2 Strings using character functions are manipulated in accordance\nwith PL/SQL framework\n2.3 Numbers with the ROUND, TRUNC, and MOD functions are\nmanipulated in accordance with PL/SQL framework\n2.4 Arithmetic with date data are performed in accordance with\nPL/SQL framework\n2.5 Dates with the DATE functions are manipulated in\n accordance with PL/SQL framework\n2.6 Functions and Conditional Expressions are converted\n in accordance with PL/SQL framework\n\n--- PDF PAGE 32 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n30\n3. Display Data From\nMultiple Tables\nUsing Joins\n\n3.1 SELECT statements to access data from more than one table\nare written in accordance with PL/SQL framework\n3.2 Tables Using SQL:1999 Syntax are joined in accordance with\nPL/SQL framework\n3.3 Data that does not meet a join condition by using outer joins are\nviewed in accordance with PL/SQL framework\n3.5 Cross Joins are created in accordance with PL/SQL framework\n4. Manipulate Data\n4.1 New Rows to a Table are added in accordance with PL/SQL\nframework\n4.2 Data in a Table are changed in accordance with PL/SQL\nframework\n4.3 DELETE and TRUNCATE Statements are used in accordance\nwith PL/SQL framework\n4.4 COMMIT and ROLLBACK statements are saved in accordance\nwith PL/SQL framework\n4.5 Read Consistency is implemented in accordance with PL/SQL\nframework\n4.6 FOR UPDATE Clause is described in accordance with PL/SQL\nframework\n4.7 DDL Statements to Create and Manage Tables are used in\naccordance with PL/SQL framework\n5. Control User\nAccess\n5.1 System and Object Privileges are identified in accordance with\nPL/SQL framework\n5.2 Users are created in accordance with PL/SQL framework\n5.3 System Privileges are granted in accordance with PL/SQL\nframework\n5.4 Privileges to a Role are created and granted in accordance with\nPL/SQL framework\n5.5 Object Privileges are granted in accordance with PL/SQL\nframework\n5.6 Privileges are passed in accordance with PL/SQL framework\n5.7 Object Privileges are revoked in accordance with PL/SQL\nframework\n5.8 Schema Objects are managed in accordance with PL/SQL\nframework\n5.9 Objects with Data Dictionary Views are managed in\naccordance with PL/SQL framework\n6. Manipulate Large\nData Sets\n6.1 Subqueries to Manipulate Data are used in accordance with\nPL/SQL framework\n6.3 Data Using a Subquery as Source are retrieved in accordance\nwith PL/SQL framework\n6.4 Data Using a Subquery as a Target are inserted in accordance\nwith PL/SQL framework\n6.5 The WITH CHECK OPTION Keyword on DML Statements are\nused in accordance with PL/SQL framework\n6.6 The types of Multitable INSERT Statements are listed in\naccordance with PL/SQL framework\n6.7 Multitable INSERT Statements are identified in accordance with\nPL/SQL framework\n\n--- PDF PAGE 33 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n31\n7. Manage Data in\nDifferent Time\nZones\n7.1 Date and Time in a Session’s Time Zone are compared in\naccordance with PL/SQL framework\n7.2 DBTIMEZONE and SESSIONTIMEZONE are described in\naccordance with PL/SQL framework\n7.3 The differences between DATE and TIMESTAMP are listed in\naccordance with PL/SQL framework\n7.4 The INTERVAL Data Types are identified in accordance with\nPL/SQL framework\n7.5 EXTRACT, TZ_OFFSET and FROM_TZ functions are used in\naccordance with PL/SQL framework\n7.6 TO_TIMESTAMP, TO_YMINTERVAL, and TO_DSINTERVAL\nare used in accordance with PL/SQL framework\n8. Retrieve Data\nUsing Subqueries\n8.1 Pairwise and Nonpairwise are compared in accordance with\nPL/SQL framework\n8.2 Scalar Subquery Expressions are used in accordance with\nPL/SQL framework\n8.3 Problems with Correlated Subqueries are solved in accordance\nwith PL/SQL framework\n8.4 Correlated Subqueries are updated and deleted in accordance\nwith PL/SQL framework\n8.5 The EXISTS and NOT EXISTS operators are used in accordance\nwith PL/SQL framework\n8.6 The WITH clause is used in accordance with PL/SQL framework\n8.7 The Recursive WITH clause is used in accordance with PL/SQL\nframework\n\n--- PDF PAGE 34 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n32\n\nRANGE OF VARIABLES:\n\nVARIABLE\nRANGE\n1. Data restriction and\nSorting\n•\nWrite queries with a WHERE clause to limit the output\nretrieved\n•\nUse the comparison operators and logical operators\n•\nIdentify the rules of precedence for comparison and\nlogical operators\n•\nUsage of character string literals in the WHERE clause\n•\nWrite queries with an ORDER BY clause\n•\nSort output in descending and ascending order\n2. Conversion Functions\nand Conditional\nExpressions\n•\nDescribe implicit and explicit data type conversion\n•\nDescribe TO_CHAR, TO_NUMBER, and TO_DATE\nconversion functions\n•\nNesting multiple functions\n•\nApply the NVL, NULLIF, and COALESCE functions to\ndata\n•\nUse conditional IF THEN ELSE logic\n3. DDL Statements to\nCreate and Manage\nTables\n•\nCategorize Database Objects\n•\nCreate Tables using the CREATE TABLE Statement\n•\nIdentify the data types\n•\nDescribe Constraints\n•\nCreate a table using a subquery\n•\nHow to alter a table?\n•\nDrop a table\n4. Schema Objects\n•\nAdd, Modify, and Drop a Column\n•\nAdd, Drop, and Defer a Constraint\n•\nEnable and Disable a Constraint\n•\nCreate and Remove Indexes\n•\nCreate a Function-Based Index\n•\nPerform Flashback Operations\n•\nCreate an External Table by Using ORACLE_LOADER\nand by Using ORACLE_DATAPUMP\n•\nQuery External Tables\n5. Objects with Data\nDictionary Views\n•\nUSER_OBJECTS and ALL_OBJECTS Views\n•\nView Table and Column Information\n•\nQuery the dictionary views for constraint information\n•\nQuery the dictionary views for view, sequence, index and\nsynonym information\n•\nAdd a comment to a table\n•\nQuery the dictionary views for comment information\n\n--- PDF PAGE 35 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n33\nEVIDENCE GUIDE\n\n1.Critical aspect\nof competency\nAssessment requires evidence that the candidate:\n1.1 Displayed data from multiple tables using the ANSI SQL 99 JOIN\nsyntax.\n1.2 Employed SQL functions to generate customized data.\n1.3 Created reports of aggregated data.\n1.4 Controlled privileges at the object and system level.\n1.5 Created indexes, constraints and alter existing schema objects.\n1.6 Created and query external tables and use the advanced features of\nSQL to query and manipulate data within the database.\n1.7 Used the dictionary views to retrieve metadata and create reports\nabout their schema objects.\n2. Underpinning\nKnowledge\n2.1 Use single row functions to customize output, use conversion\nfunctions and conditional expressions.\n2.2 The usage of group functions to report aggregated data is also dealt\nwith. Demonstrations and hands-on\n2.3 Familiarity with data processing concepts and techniques\n2.4 Data processing\n2.6 SQL concepts, syntax and flavors\n2.7 RDBMS concepts\n2.8 Control database access to specific objects.\n2.9 Manage schema objects.\n2.10 Manipulate large data sets in the Oracle database by using\nsubqueries.\n2.11 Manage data in different time zones.\n2.12 Retrieve data by using advanced subqueries.\n2.13 Use the regular expression support in SQL to search, match, and\nreplace strings in terms of regular expressions\n3. Underpinning\nskills\n3.1 Basic computer operation skills\n3.2 Logic analysis\n3.3 Communication skills\n3.4 Code writing and debugging skills\n4. Method of\nassessment\nThe assessor will assess candidate with-\n4.1 Portfolio\n•\nResult of Oracle Vendor Examinations\n•\nSample codes\n4.2 Interview\n5.Resource\nimplication\n5.1 Computer hardware with peripherals\n5.2 Appropriate software\n5.3 Access to internet\n5.4 Conducive testing environment\n6.Context of\nassessment\nAssessment may take place in an accredited 