          "source_text": "1. Critical Aspect of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Designed PL/SQL packages and program units that\nexecute efficiently\n1.2 Wrote code to interface with external applications and\nthe operating system\n1.3 Created PL/SQL applications that use collections\n1.4 Wrote and tuned PL/SQL code effectively to maximize\nperformance\n1.5 Implemented virtual private database with fine-grained\naccess control\n2.Underpinning\nKnowledge\n2.1 PL/SQL designing best practices.\n2.2 Create PL/SQL applications that use collections.\n2.3 Implement a virtual private database with fine-grained\naccess control.\n2.4 Write code to interface with external C and Java\napplications.\n2.5 Write code to interface with large objects and use\nSecureFile LOBs.\n2.6 Write and tune PL/SQL code effectively to maximize\nperformance\n3.Underpinning Skills\n3.1 Basic computer operation skills\n3.2 Logic analysis\n3.3 Communication skills\n3.4 Code writing and debugging skills\n4.Method of Assessment\nThe assessor will assess candidate with-\n4.1 Portfolio\n•\nResult of Oracle Vendor Examinations\n•\nSample codes\n4.2 Interview\n5.Resource Implication\n•\nComputer hardware with peripherals\n•\nAppropriate software\n•\nAccess to internet\n•\nConducive testing environment\n6.Context of\nAssessment\nAssessment may take place in an accredited Oracle testing\ncenter\n\n--- PDF PAGE 44 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n42"
