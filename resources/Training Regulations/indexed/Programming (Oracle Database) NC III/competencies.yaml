        "source_text": "ICT313363\n\nUNIT DESCRIPTION : This unit introduces the student to PL/SQL language and\nexplains the benefits of this programming language. The\nstudent will learn to develop stored procedures, functions,\npackages and other basic functions.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Declare PL/SQL\nIdentifiers\n1.1 PL/SQL language is introduced in accordance with\nPL/SQL framework\n1.2 List the different Types of Identifiers in a PL/SQL\nsubprogram in accordance with PL/SQL framework\n1.3 Declarative Section to Define Identifiers are used in\naccordance with PL/SQL framework\n1.4 Variables to store data are used in accordance with\nPL/SQL framework\n1.5 Scalar Data Types are identified in accordance with\nPL/SQL framework\n1.6 Sequences in PL/SQL Expressions are used in\naccordance with PL/SQL framework\n1.7 Executable Statements are written in accordance with\nPL/SQL framework\n2. Apply Interaction with\nthe Oracle Server\n\n2.1 SELECT Statements in PL/SQL are invoked in\naccordance with PL/SQL framework\n2.2 Data in PL/SQL are retrieved in accordance with\nPL/SQL framework\n2.3 Errors by using Naming Conventions when using\nRetrieval and DML Statements are avoided in\naccordance with PL/SQL framework\n2.4 Data in the Server using PL/SQL is manipulated in\naccordance with PL/SQL framework\n2.5 SQL Cursor Attributes to Obtain Feedback on DML are\nused in accordance with PL/SQL framework\n3. Apply Exception\nHandling\n\n3.1 Exceptions are understood in accordance with PL/SQL\nframework\n3.2 Exceptions with PL/SQL are handled in accordance\nwith PL/SQL framework\n3.3 Predefined Oracle Server Errors are trapped in\naccordance with PL/SQL framework\n3.4 Non-Predefined Oracle Server Errors are trapped in\naccordance with PL/SQL framework\n3.5 User-Defined Exceptions are trapped in accordance\nwith PL/SQL framework\n3.6 Exceptions are propagated in accordance with PL/SQL\nframework\n\n--- PDF PAGE 37 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n35\n4. Store Procedures\n4.1 Modularized and Layered Subprogram Design are\ncreated in accordance with PL/SQL framework\n4.2 Development With PL/SQL Blocks are modularized in\naccordance with PL/SQL framework\n4.3 PL/SQL Execution Environment are understood in\naccordance with PL/SQL framework\n4.4 Benefits of using PL/SQL Subprograms are listed in\naccordance with PL/SQL framework\n4.5 Differences between Anonymous Blocks and\nSubprograms are listed in accordance with PL/SQL\nframework\n4.6 Procedures Parameters and Parameters Modes are\nimplemented in accordance with PL/SQL framework\n4.7 Procedure Information is viewed in accordance with\nPL/SQL framework\n\n--- PDF PAGE 38 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n36\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. PL/SQL language is\nintroduced\n•\nOverview of PL/SQL\n•\nIdentify the benefits of PL/SQL Subprograms\n•\nOverview of the types of PL/SQL blocks\n•\nCreate a Simple Anonymous Block\n•\nHow to generate output from a PL/SQL Block\n2. Executable Statements\n•\nDescribe Basic PL/SQL Block Syntax Guidelines\n•\nLearn to Comment the Code\n•\nDeployment of SQL Functions in PL/SQL\n•\nHow to convert Data Types?\n•\nDescribe Nested Blocks\n•\nIdentify the Operators in PL/SQL\n\n--- PDF PAGE 39 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n37\nEVIDENCE GUIDE\n\n1. Critical Aspect of\nCompetency\n1.1 Created and debug stored procedures and functions\n1.2 Used conditional compilation to customize the functionality\nin a PL/SQL application without removing any source code\n1.3 Designed PL/SQL packages to group related constructs\n1.4 Created overloaded package subprograms for more\nflexibility\n1.5 Designed PL/SQL anonymous blocks that execute\nefficiently\n2. Underpinning\nKnowledge\n2.1 Conditionally control code flow (loops, control structures).\n2.2 Use PL/SQL packages to group and contain related\nconstructs.\n2.3 Generate triggers to solve business challenges.\n2.4 Create anonymous PL/SQL blocks, as well as stored\nprocedures and functions.\n2.5 Use some of the Oracle supplied PL/SQL packages to\ngenerate screen output and file output.\n2.7 Create anonymous PL/SQL blocks, functions and\nprocedures.\n3. Underpinning Skills\n3.1 Basic computer operation skills\n3.2 Logic analysis\n3.3 Communication skills\n3.4 Code writing and debugging skills\n4. Method of\nAssessment\nThe assessor will assess candidate with-\n4.1 Portfolio\n•\nResult of Oracle Vendor Examinations\n•\nSample codes\n4.2 Interview\n5. Resource\nImplication\n5.1 Computer hardware with peripherals\n5.2 Appropriate software\n5.3 Access to internet\n5.4 Conducive testing environment\n6. Context of\nAssessment\nAssessment may take place in an accredited Oracle testing\ncenter\n\n--- PDF PAGE 40 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n38\nUNIT OF COMPETENCY: DESIGN AND TUNE PL/SQL LANGUAGE\nUNIT CODE :"
