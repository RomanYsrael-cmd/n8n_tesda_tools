  "source_section_text": "SECTION 2\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units\nof competency required in Programming (Oracle Database) NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY: LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311109\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to lead in the dissemination and discussion of\nideas, information and issues in the workplace.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace\nprocesses\n1.1. Appropriate communication method is selected\n1.2. Multiple operations involving several topics areas\nare communicated accordingly\n1.3. Questions are used to gain extra information\n1.4. Correct sources of information are identified\n1.5. Information is selected and organized correctly\n1.6. Verbal and written reporting is undertaken when\nrequired\n1.7. Communication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1. Response to workplace issues are sought\n2.2. Response to workplace issues are provided\nimmediately\n2.3. Constructive contributions are made to workplace\ndiscussions on such issues as production, quality\nand safety\n2.4. Goals/objectives and action plan undertaken in the\nworkplace are communicated\n3. Identify and\ncommunicate\nissues arising in the\nworkplace\n3.1. Issues and problems are identified as they arise\n3.2. Information regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3. Dialogue is initiated with appropriate personnel\n3.4. Communication problems and issues are raised as\nthey arise\n\n--- PDF PAGE 6 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n4\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\n--- PDF PAGE 7 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n5\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at\none time\n1.2.\nMade constructive contributions in workplace\nissues\n1.3.\nSought workplace issues effectively\n1.4.\nResponded to workplace issues promptly\n1.5.\nPresented information clearly and effectively\nwritten form\n1.6.\nUsed appropriate sources of information\n1.7.\nAsked appropriate questions\n1.8.\nProvided accurate information\n2. Underpinning\nknowledge\n2.1.\nOrganization\nrequirements\nfor\nwritten\nand\nelectronic communication methods\n2.2.\nEffective verbal communication methods\n3. Underpinning Skills\n3.1.\nOrganize information\n3.2.\nUnderstand and convey intended meaning\n3.3.\nParticipate in variety of workplace discussions\n3.4.\nComply with organization requirements for the use\nof written and electronic communication methods\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nVariety of Information\n4.2.\nCommunication tools\n4.3.\nSimulated workplace\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nCompetency in this unit must be assessed through\n5.2.\nDirect Observation\n5.3.\nInterview\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in the workplace or\nin simulated workplace environment\n\n--- PDF PAGE 8 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n6\nUNIT OF COMPETENCY: LEAD SMALL TEAMS\n\nUNIT CODE\n : 500311110\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1. Work requirements are identified and presented to\nteam members\n1.2. Reasons for instructions and requirements are\ncommunicated to team members\n1.3. Team members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign\nresponsibilities\n2.1. Duties, and responsibilities are allocated having regard\nto the skills, knowledge and aptitude required to\nproperly undertake the assigned task and according to\ncompany policy\n2.2. Duties are allocated having regard to individual\npreference, domestic and personal considerations,\nwhenever possible\n3. Set performance\nexpectations for\nteam members\n3.1. Performance expectations are established based on\nclient needs and according to assignment requirements\n3.2. Performance expectations are based on individual team\nmembers duties and area of responsibility\n3.3. Performance expectations are discussed and\ndisseminated to individual team members\n4. Supervise team\nperformance\n4.1. Monitoring of performance takes place against\ndefined performance criteria and/or assignment\ninstructions and corrective action taken if required\n4.2. Team members are provided with feedback, positive\nsupport and advice on strategies to overcome any\ndeficiencies\n4.3. Performance issues which cannot be rectified or\naddressed within the team are referenced to appropriate\npersonnel according to employer policy\n4.4. Team members are kept informed of any changes in the\npriority allocated to assignments or tasks which might\nimpact on client/customer needs and satisfaction\n4.5. Team operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6. Follow-up communication is provided on all issues\naffecting the team\n4.7. All relevant documentation is completed in accordance\nwith company procedures\n\n--- PDF PAGE 9 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s\nconcerns\n2.1. Roster/shift details\n3. Monitor performance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 10 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n8\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs\nof the tasks to be performed\n1.5. Set and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Underpinning\nKnowledge\n2.1. Company policies and procedures\n2.2. Relevant legal requirements\n2.3. How performance expectations are set\n2.4. Methods of Monitoring Performance\n2.5. Client expectations\n2.6.\nTeam member’s duties and responsibilities\n3. Underpinning\nSkills\n3.1. Communication skills required for leading teams\n3.2. Informal performance counseling skills\n3.3. Team building skills\n3.4.\nNegotiating skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2.\nMaterials relevant to the proposed activity or task\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nAssessment\n6.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 11 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n9\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE :\n 500311111\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes\nrequired to collect information in order to negotiate to a\ndesired outcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan negotiations\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\nInformation on preparing for negotiation is\nidentified and included in the plan\nInformation on creating nonverbal environments\nfor positive negotiating is identified and included in\nthe plan\nInformation on active listening is identified and\nincluded in the plan\nInformation on different questioning techniques is\nidentified and included in the plan\nInformation is checked to ensure it is correct and up-\nto- date\n2. Participate in\nnegotiations\n2.1\n\n2.2\n2.3\n\n2.4\n2.5\n\n2.6\n\n2.7\n2.8\nCriteria for successful outcome are agreed upon by\nall parties\nDesired outcome of all parties are considered\nAppropriate language is used throughout the\nnegotiation\nA variety of questioning techniques are used\nThe issues and processes are documented and\nagreed upon by all parties\nPossible solutions are discussed and their viability\nassessed\nAreas for agreement are confirmed and recorded\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 12 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n10\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1\n\n1.2\n1.3\n1.4\n\n1.5\n\n1.6\nBackground information on other parties to the\nnegotiation\nGood understanding of topic to be negotiated\nClear understanding of desired outcome/s\nPersonal attributes\n1.4.1 self-awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 nonverbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self-disclosing\nAnalytic skills\n1.6.1 observing differences between content\nand process\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and\nexternally for resolving conflict\n\n2. Non-verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 13 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n11\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person\nto achieve an agreed outcome\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Codes of practice and guidelines for the\norganization\n2.2 Organizations policy and procedures for\nnegotiations\n2.3 Decision making and conflict resolution strategies\nprocedures\n2.4 Problem solving strategies on how to deal with\nunexpected questions and attitudes during\nnegotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning Skills\n3.1 Interpersonal skills to develop rapport with other\nparties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation\nprocess\n4.2 Human resources (negotiators)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context for\nAssessment\n6.1 Competency to be assessed in real work\nenvironment or in a simulated workplace setting.\n\n--- PDF PAGE 14 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n12\nUNIT OF COMPETENCY:\nSOLVE PROBLEMS RELATED TO WORK\nACTIVITIES\nUNIT CODE\n : 500311112\nUNIT DESCRIPTOR\n : This unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including\nthe application of problem solving techniques and to\ndetermine and resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the problem\n1.1.\nVariances are identified from normal operating\nparameters; and product quality\n1.2.\nExtent, cause and nature are of the problem\nare defined through observation, investigation\nand analytical techniques\n1.3.\nProblems are clearly stated and specified\n2. Determine\nfundamental causes\nof the problem\n2.1.\nPossible causes are identified based on\nexperience and the use of problem solving\ntools / analytical techniques.\n2.2.\nPossible cause statements are developed\nbased on findings\n2.3.\nFundamental causes are identified per results\nof investigation conducted\n3. Determine corrective\naction\n3.1.\nAll possible options are considered for\nresolution of the problem\n3.2.\nStrengths and weaknesses of possible options\nare considered\n3.3.\nCorrective actions are determined to resolve\nthe problem and possible future causes\n3.4.\nAction plans are developed identifying\nmeasurable objectives, resource needs and\ntimelines in accordance with safety and\noperating procedures\n4. Provide\nrecommendation/s to\nmanager\n4.1.\nReport on recommendations are prepared\n4.2.\nRecommendations are presented to\nappropriate personnel.\n4.3.\nRecommendations are followed-up, if required\n\n--- PDF PAGE 15 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n1.6.\nGant chart, Pert CPM and graphs\n1.7.\nScatter grams\n\n2. Problem\n\n2.1.\nNon – routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and\nincidents\n\n3. Action plans\n\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCo-ordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n--- PDF PAGE 16 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n14\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a\nwalk through forming part of the response. These\nassessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may\nhave happened.\n2. Underpinning\nKnowledge\n2.1.\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2.\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of\nfundamental cause, determining the corrective\naction and provision of recommendations\n2.2.1. Relevant equipment and operational\nprocesses\n2.2.2. Enterprise goals, targets and measures\n2.2.3. Enterprise quality, OHS and environmental\nrequirement\n2.2.4. Principles of decision making strategies and\ntechniques\n2.2.5. Enterprise information systems and data\ncollation\n2.2.6. Industry codes and standards\n\n3. Underpinning\nSkills\n3.1.\nUsing range of formal problem solving techniques\n3.2.\nIdentifying and clarifying the nature of the problem\n3.3.\nDevising the best solution\n3.4.\nEvaluating the solution\n3.5.\nImplementation of a developed plan to rectify the\nproblem\n\n--- PDF PAGE 17 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n15\n4. Resource\nImplications\n4.1.\nAssessment will require access to an operating\nplant over an extended period of time, or a suitable\nmethod of gathering evidence of operating ability\nover a range of situations. A bank of scenarios /\ncase studies / what ifs will be required as well as\nbank of questions which will be used to probe the\nreason behind the observable action.\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nCase studies on solving problems in the workplace\n5.2.\nObservation\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation. Simulation may be required to\nallow for timely assessment of parts of this unit of\ncompetency. Simulation should be based on the actual\nworkplace and will include walk through of the relevant\ncompetency components.\n6. Context of\nAssessment\n6.1.\nIn all workplace, it may be appropriate to assess\nthis unit concurrently with relevant teamwork or\noperation units.\n\n--- PDF PAGE 18 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n16\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\nUNIT CODE :\n500311113\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired in the application of mathematical concepts\nand techniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given\ncondition\n1.2 Mathematical techniques are selected based\non the given problem\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on\nthe problem identified\n2.2 Mathematical computations are performed to the\nlevel of accuracy required for the problem\n2.3 Results of mathematical computation is\ndetermined and verified based on job\nrequirements\n3. Analyze results\n3.1 Result of application is reviewed based on\nexpected and required specifications and\noutcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 19 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n17\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical\ntechniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical\ntechniques (e.g. recalculation, re-modeling)\n2.2 Report error to immediate superior for proper\naction\n\n--- PDF PAGE 20 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n18\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Underpinning\nKnowledge\n2.1 Fundamental operation (addition, subtraction,\ndivision, multiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning Skills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context of\nAssessment\n6.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 21 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n19\nUNIT OF COMPETENCY: USE RELEVANT TECHNOLOGIES\n\nUNIT CODE : 500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and\nattitude required in selecting, sourcing and applying\nappropriate and affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Study/select\nappropriate\ntechnology\n\n1.1 Usage of different technologies is determined based on\njob requirements\n1.2 Appropriate technology is selected as per work\n specification\n\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable software and hardware are used as per\n task requirement\n2.3 Management concepts are observed and practiced as\nper established industry practices\n\n3. Maintain/enhance\nrelevant technology\n\n3.1 Maintenance of technology is applied in accordance with\nthe industry standard operating procedure,\nmanufacturer’s operating guidelines and\noccupational health and safety procedure to ensure\nits operative ability\n3.2 Updating of technology is maintained through continuing\neducation or training in accordance with job requirement\n3.3 Technology failure/ defect is immediately reported to the\nconcern/responsible person or section for appropriate\naction\n\n--- PDF PAGE 22 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n20\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard operating\nprocedure\n3.1 Written guidelines relative to the usage of\noffice technology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to\nthe operation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance\nschedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 23 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n21\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of\nrelevant technology\n2. Underpinning\nKnowledge\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning Skills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of\nAssessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 24 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n22\nCOMMON COMPETENCIES\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\n\nUNIT CODE\n:\n506315202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, attitudes and values\nneeded to apply quality standards in the workplace. The unit\nalso includes the application of relevant safety procedures\nand regulations, organization procedures and customer\nrequirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Assess quality of\nreceived materials\n1.1. Work instruction is obtained and work is carried out\nin accordance with standard operating procedures.\n1.2. Received materials are checked against workplace\nstandards and specifications.\n1.3. Faulty materials related to work are identified and\nisolated.\n1.4. Faults and any identified causes are recorded and/or\nreported to the supervisor concerned in accordance\nwith workplace procedures.\n1.5. Faulty materials are replaced in accordance with\nworkplace procedures.\n2. Assess own work\n2.1. Documentation relative to quality within the\ncompany is identified and used.\n2.2. Completed work is checked against workplace\nstandards relevant to the task undertaken.\n2.3. Errors are identified and isolated.\n2.4. Information on the quality and other indicators of\nproduction performance are recorded in accordance\nwith workplace procedures.\n2.5. In cases of deviations from specific quality\nstandards, causes are documented and reported in\naccordance with the workplace’ s standards\noperating procedures.\n3. Engage in quality\nimprovement\n3.1. Process improvement procedures are participated in\nrelative to workplace assignment.\n3.2. Work is carried out in accordance with process\nimprovement procedures.\n3.3. Performance of operation or quality of product of\nservice to ensure customer satisfaction is\nmonitored.\n\n--- PDF PAGE 25 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n23\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Materials\n1.1 Materials may include but not limited to:\n1.1.1. Manuals\n1.1.2. Job orders\n1.1.3. Instructional videos\n2 Faults\n2.1 Faults may include but not limited to:\n2.1.1. Materials not to specification\n2.1.2. Materials contain incorrect/outdated\ninformation\n2.1.3. Hardware defects\n2.1.4. Materials that do not conform with any\nregulatory agencies\n3 Documentation\n3.1 Organization work procedures\n3.2 Manufacturer’s instruction manual\n3.3 Customer requirements\n3.4 Forms\n4 Errors\n4.1 Errors may be related but not limited to the following:\n4.1.1. Deviation from the requirements of the Client\n4.1.2. Deviation from the requirement of the\norganization\n5 Quality standards\n\n5.1 Quality standards may be related but not limited to the\nfollowing:\n5.1.1. Materials\n5.1.2. Hardware\n5.1.3. Final product\n5.1.4. Production processes\n5.1.5. Customer service\n6 Customer\n6.1 Co-worker\n6.2 Supplier/Vendor\n6.3 Client\n6.4 Organization receiving the product or service\n\n--- PDF PAGE 26 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n24\nEVIDENCE GUIDE\n\n1 Critical aspect of\ncompetency\nAssessment must show that the candidate:\n1.1 Carried out work in accordance with the company’s\nstandard operating procedures\n1.2 Performed task according to specifications\n1.3 Reported defects detected in accordance with\nstandard operating procedures\n1.4 Carried out work in accordance with the process\nimprovement procedures\n2 Underpinning\nknowledge\n2.1 Relevant production processes, materials and\nproducts\n2.2 Characteristics of materials, software and hardware\nused in production processes\n2.3 Quality checking procedures\n2.4 Workplace procedures\n2.5 Safety and environmental aspects of production\nprocesses\n2.6 Fault identification and reporting\n2.7\nQuality improvement processes\n3 Underpinning skills\n3.1 Reading skills required to interpret work instruction\n3.2 Communication skills needed to interpret and apply\ndefined work procedures\n3.3 Carry out work in accordance with OHS policies and\nprocedures\n3.4 Critical thinking\n3.5\nSolution providing and decision-making\n4 Method of\nassessment\nThe assessor must select two of the following to\nobjectively evaluate the candidate:\n4.1 Observation and oral questioning\n4.2 Third party report\n4.3 Portfolio\n4.4\nPractical demonstration\n5 Resource implication\nMaterials, software and hardware to be used in a real or\nsimulated situation\n6 Context of\nAssessment\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 27 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n25\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\n\nUNIT CODE\n:\n506311203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, attitudes and values\nneeded to perform computer operations which include\ninputting, accessing, producing and transferring data using\nthe appropriate hardware and software.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntask to be taken\nundertaken\n1.1. Requirements of task are determined in\naccordance with the required output.\n1.2. Appropriate hardware and software are selected\naccording to task assigned and required outcome.\n1.3. Task is planned to ensure that OH & S guidelines\nand procedures are followed.\n1.4. Client -specific guidelines and procedures are\nfollowed.\n1.5. Required data security guidelines are applied in\naccordance with existing procedures.\n2. Input data into\ncomputer\n2.1. Data are entered into the computer using\nappropriate program/application in accordance with\ncompany procedures.\n2.2. Accuracy of information is checked and information\nis saved in accordance with standard operating\nprocedures.\n2.3. Inputted data is stored in storage media according\nto requirements.\n2.4. Work is performed within ergonomic guidelines.\n3. Access information\nusing computer\n3.1. Correct program/application is selected based on\njob requirements.\n3.2. Program/application containing the information\nrequired is accessed according to company\nprocedures.\n3.3. Desktop icons are correctly selected, opened and\nclosed for navigation purposes.\n3.4. Keyboard techniques are carried out in line with OH\n& S requirements for safe use of keyboards.\n\n--- PDF PAGE 28 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n26\n4. Produce output/ data\nusing computer system\n4.1. Entered data are processed using appropriate\nsoftware commands.\n4.2. Data are printed out as required using computer\nhardware /peripheral devices in accordance with\nstandard operating procedures.\n4.3. Files and data are transferred between compatible\nsystems using computer software,\nhardware/peripheral devices in accordance with\nstandard operating procedures.\n5. Use basic functions of\na www-browser to\nlocate information\n5.1. Information requirements for internet search are\nestablished.\n5.2. Browser is launched.\n5.3. Search engine is loaded.\n5.4. Appropriate search criteria/or URL of site is\nentered.\n5.5. Relevant links are followed to locate required\ninformation.\n5.6. Useful pages are bookmarked or printed as\nrequired.\n6. Maintain computer\nequipment and\nsystems\n6.1. Procedures for ensuring security of data, including\nregular back-ups and virus checks are\nimplemented in accordance with standard\noperating procedures.\n6.2. Basic file maintenance procedures are\nimplemented in line with the standards operating\nprocedures.\n\n--- PDF PAGE 29 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1 Hardware and\nperipheral devices\n1.1\nPersonal computers\n1.2\nNetworked systems\n1.3\nCommunication equipment\n1.4\nPrinters\n1.5\nScanners\n1.6\nKeyboard\n1.7\nMouse\n1.8\nVoice/Data logger\n2 Software\nSoftware includes the following but not limited to:\n2.1\nWord processing packages\n2.2\nDatabase packages\n2.3\nInternet\n2.4\nSpreadsheets\n2.5\nClient Specific Software\n3 OH & S guidelines\n3.1\nOHS guidelines\n3.2\nEnterprise procedures\n4 Storage media\nStorage media include the following but not limited to:\n4.1\nDiskettes\n4.2\nCDs\n4.3\nZip disks\n4.4\nhard disk drives, local and remote\n4.5\nOptical drives\n5 Ergonomic guidelines\n5.1\nTypes of equipment used\n5.2\nAppropriate furniture\n5.3\nSeating posture\n5.4\nLifting posture\n5.5\nVisual display unit screen brightness\n6 Desktop icons\n6.1\nIcons include the following but not limited to:\n6.2\nDirectories/folders\n6.3\nFiles\n6.4\nNetwork devices\n6.5\nRecycle bin\n6.6\nProgram icons\n7 Maintenance\n7.1\nCreating and managing more space in the hard disk\nand other peripherals\n7.2\nReviewing programs\n7.3\nDeleting unwanted files\n7.4\nBacking up files\n7.5\nChecking hard drive for errors\n7.6\nUsing up to date anti-virus programs\n7.7\nCleaning dust from internal and external surfaces\n\n--- PDF PAGE 30 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n28\nEVIDENCE GUIDE\n\n1 Critical aspects of\ncompetency\nAssessment must show that the candidate:\n1.1 Selected and used hardware components correctly and\naccording to the task requirement\n1.2 used basic software applications to create new files and\ndocuments\n1.3 Produced accurate and complete data in accordance with\nthe requirements\n1.4 Used appropriate devices and procedures to transfer\nfiles/data accurately\n1.5 Used basic functions of a www-browser to locate\ninformation.\n2 Underpinning\nknowledge\n2.1 Basic ergonomics of keyboard and computer user\n2.2 Main types of computers and basic features of different\noperating systems\n2.3 Main parts of a computer\n2.4 Storage devices and basic categories of memory\n2.5 Relevant types of software\n2.6 General security, privacy legislation and copyright\n2.7 Viruses\n2.8 OH & S principles and responsibilities\n2.9 Calculating computer capacity\n2.10 Productivity Application\n2.11 Business Application\n2.12 System Software\n3 Underpinning\nskills\n3.1 Reading and comprehension skills required to interpret\nwork instruction and to interpret basic user manuals.\n3.2 Communication skills to identify lines of communication,\nrequest advice, follow instructions and receive feedback.\n3.3 Technology skills to use equipment safely including\nkeyboard skills.\n4 Method of\nassessment\nThe assessor may select two of the following assessment\nmethods to objectively assess the candidate:\n4.1 Direct Observation and Oral Questioning\n4.2 Practical demonstration\n5 Resource\nimplication\n5.1 Computer hardware with peripherals\n5.2 Appropriate software\n6 Context of\nAssessment\n6.1 Assessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 31 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n29\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: PERFORM RELATIONAL DATABASE MANAGEMENT IN\nORACLE DATABASE TECHNOLOGY\n\nUNIT CODE\n : ICT313361\nUNIT DESCRIPTOR : This unit introduces the fundamentals of SQL using Oracle\nDatabase technology. Specifically it teaches the concepts of\nrelational databases and the SQL programming language. It\nteaches how to write queries against single and multiple tables,\nmanipulate data in tables, and create database objects. It also\nteaches how to use single row functions to customize output, use\nconversion functions and conditional expressions.\n\nThis unit also focuses on how to effectively use SQL commands\nagainst business data. It teaches features that will help query and\ndata manipulation within the database and also how to use the\ndictionary views to retrieve metadata and create reports about their\nschema objects. Further, it also teaches features on how to set\nuser access level and usage of scalar and correlated sub-queries.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Retrieve Data\nUsing the SQL\nSELECT Statement\n\n1.1 Capabilities of SQL SELECT statements are listed in accordance\nwith PL/SQL framework\n1.2 Report of data from the output of a basic SELECT statement is\ngenerated in accordance with PL/SQL framework\n1.3 Arithmetic expressions and NULL values are used in accordance\nwith PL/SQL framework\n1.4 Column aliases are implemented in accordance with PL/SQL\nframework\n1.5 Concatenation operator, literal character strings, alternative\nquote operator, and the DISTINCT keyword are described in\naccordance with PL/SQL framework\n1.6 Data is Sorted and Restricted in accordance with PL/SQL\nframework\n2. Use Single-Row\nFunctions to\nCustomize Output\n2.1 Single row and multiple row functions are differentiated in\naccordance with PL/SQL framework\n2.2 Strings using character functions are manipulated in accordance\nwith PL/SQL framework\n2.3 Numbers with the ROUND, TRUNC, and MOD functions are\nmanipulated in accordance with PL/SQL framework\n2.4 Arithmetic with date data are performed in accordance with\nPL/SQL framework\n2.5 Dates with the DATE functions are manipulated in\n accordance with PL/SQL framework\n2.6 Functions and Conditional Expressions are converted\n in accordance with PL/SQL framework\n\n--- PDF PAGE 32 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n30\n3. Display Data From\nMultiple Tables\nUsing Joins\n\n3.1 SELECT statements to access data from more than one table\nare written in accordance with PL/SQL framework\n3.2 Tables Using SQL:1999 Syntax are joined in accordance with\nPL/SQL framework\n3.3 Data that does not meet a join condition by using outer joins are\nviewed in accordance with PL/SQL framework\n3.5 Cross Joins are created in accordance with PL/SQL framework\n4. Manipulate Data\n4.1 New Rows to a Table are added in accordance with PL/SQL\nframework\n4.2 Data in a Table are changed in accordance with PL/SQL\nframework\n4.3 DELETE and TRUNCATE Statements are used in accordance\nwith PL/SQL framework\n4.4 COMMIT and ROLLBACK statements are saved in accordance\nwith PL/SQL framework\n4.5 Read Consistency is implemented in accordance with PL/SQL\nframework\n4.6 FOR UPDATE Clause is described in accordance with PL/SQL\nframework\n4.7 DDL Statements to Create and Manage Tables are used in\naccordance with PL/SQL framework\n5. Control User\nAccess\n5.1 System and Object Privileges are identified in accordance with\nPL/SQL framework\n5.2 Users are created in accordance with PL/SQL framework\n5.3 System Privileges are granted in accordance with PL/SQL\nframework\n5.4 Privileges to a Role are created and granted in accordance with\nPL/SQL framework\n5.5 Object Privileges are granted in accordance with PL/SQL\nframework\n5.6 Privileges are passed in accordance with PL/SQL framework\n5.7 Object Privileges are revoked in accordance with PL/SQL\nframework\n5.8 Schema Objects are managed in accordance with PL/SQL\nframework\n5.9 Objects with Data Dictionary Views are managed in\naccordance with PL/SQL framework\n6. Manipulate Large\nData Sets\n6.1 Subqueries to Manipulate Data are used in accordance with\nPL/SQL framework\n6.3 Data Using a Subquery as Source are retrieved in accordance\nwith PL/SQL framework\n6.4 Data Using a Subquery as a Target are inserted in accordance\nwith PL/SQL framework\n6.5 The WITH CHECK OPTION Keyword on DML Statements are\nused in accordance with PL/SQL framework\n6.6 The types of Multitable INSERT Statements are listed in\naccordance with PL/SQL framework\n6.7 Multitable INSERT Statements are identified in accordance with\nPL/SQL framework\n\n--- PDF PAGE 33 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n31\n7. Manage Data in\nDifferent Time\nZones\n7.1 Date and Time in a Session’s Time Zone are compared in\naccordance with PL/SQL framework\n7.2 DBTIMEZONE and SESSIONTIMEZONE are described in\naccordance with PL/SQL framework\n7.3 The differences between DATE and TIMESTAMP are listed in\naccordance with PL/SQL framework\n7.4 The INTERVAL Data Types are identified in accordance with\nPL/SQL framework\n7.5 EXTRACT, TZ_OFFSET and FROM_TZ functions are used in\naccordance with PL/SQL framework\n7.6 TO_TIMESTAMP, TO_YMINTERVAL, and TO_DSINTERVAL\nare used in accordance with PL/SQL framework\n8. Retrieve Data\nUsing Subqueries\n8.1 Pairwise and Nonpairwise are compared in accordance with\nPL/SQL framework\n8.2 Scalar Subquery Expressions are used in accordance with\nPL/SQL framework\n8.3 Problems with Correlated Subqueries are solved in accordance\nwith PL/SQL framework\n8.4 Correlated Subqueries are updated and deleted in accordance\nwith PL/SQL framework\n8.5 The EXISTS and NOT EXISTS operators are used in accordance\nwith PL/SQL framework\n8.6 The WITH clause is used in accordance with PL/SQL framework\n8.7 The Recursive WITH clause is used in accordance with PL/SQL\nframework\n\n--- PDF PAGE 34 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n32\n\nRANGE OF VARIABLES:\n\nVARIABLE\nRANGE\n1. Data restriction and\nSorting\n•\nWrite queries with a WHERE clause to limit the output\nretrieved\n•\nUse the comparison operators and logical operators\n•\nIdentify the rules of precedence for comparison and\nlogical operators\n•\nUsage of character string literals in the WHERE clause\n•\nWrite queries with an ORDER BY clause\n•\nSort output in descending and ascending order\n2. Conversion Functions\nand Conditional\nExpressions\n•\nDescribe implicit and explicit data type conversion\n•\nDescribe TO_CHAR, TO_NUMBER, and TO_DATE\nconversion functions\n•\nNesting multiple functions\n•\nApply the NVL, NULLIF, and COALESCE functions to\ndata\n•\nUse conditional IF THEN ELSE logic\n3. DDL Statements to\nCreate and Manage\nTables\n•\nCategorize Database Objects\n•\nCreate Tables using the CREATE TABLE Statement\n•\nIdentify the data types\n•\nDescribe Constraints\n•\nCreate a table using a subquery\n•\nHow to alter a table?\n•\nDrop a table\n4. Schema Objects\n•\nAdd, Modify, and Drop a Column\n•\nAdd, Drop, and Defer a Constraint\n•\nEnable and Disable a Constraint\n•\nCreate and Remove Indexes\n•\nCreate a Function-Based Index\n•\nPerform Flashback Operations\n•\nCreate an External Table by Using ORACLE_LOADER\nand by Using ORACLE_DATAPUMP\n•\nQuery External Tables\n5. Objects with Data\nDictionary Views\n•\nUSER_OBJECTS and ALL_OBJECTS Views\n•\nView Table and Column Information\n•\nQuery the dictionary views for constraint information\n•\nQuery the dictionary views for view, sequence, index and\nsynonym information\n•\nAdd a comment to a table\n•\nQuery the dictionary views for comment information\n\n--- PDF PAGE 35 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n33\nEVIDENCE GUIDE\n\n1.Critical aspect\nof competency\nAssessment requires evidence that the candidate:\n1.1 Displayed data from multiple tables using the ANSI SQL 99 JOIN\nsyntax.\n1.2 Employed SQL functions to generate customized data.\n1.3 Created reports of aggregated data.\n1.4 Controlled privileges at the object and system level.\n1.5 Created indexes, constraints and alter existing schema objects.\n1.6 Created and query external tables and use the advanced features of\nSQL to query and manipulate data within the database.\n1.7 Used the dictionary views to retrieve metadata and create reports\nabout their schema objects.\n2. Underpinning\nKnowledge\n2.1 Use single row functions to customize output, use conversion\nfunctions and conditional expressions.\n2.2 The usage of group functions to report aggregated data is also dealt\nwith. Demonstrations and hands-on\n2.3 Familiarity with data processing concepts and techniques\n2.4 Data processing\n2.6 SQL concepts, syntax and flavors\n2.7 RDBMS concepts\n2.8 Control database access to specific objects.\n2.9 Manage schema objects.\n2.10 Manipulate large data sets in the Oracle database by using\nsubqueries.\n2.11 Manage data in different time zones.\n2.12 Retrieve data by using advanced subqueries.\n2.13 Use the regular expression support in SQL to search, match, and\nreplace strings in terms of regular expressions\n3. Underpinning\nskills\n3.1 Basic computer operation skills\n3.2 Logic analysis\n3.3 Communication skills\n3.4 Code writing and debugging skills\n4. Method of\nassessment\nThe assessor will assess candidate with-\n4.1 Portfolio\n•\nResult of Oracle Vendor Examinations\n•\nSample codes\n4.2 Interview\n5.Resource\nimplication\n5.1 Computer hardware with peripherals\n5.2 Appropriate software\n5.3 Access to internet\n5.4 Conducive testing environment\n6.Context of\nassessment\nAssessment may take place in an accredited Oracle testing center\n\n--- PDF PAGE 36 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n34\nUNIT OF COMPETENCY: USE AND APPLY PL/SQL PROGRAMMING LANGUAGE\n\nUNIT CODE\n : ICT313363\n\nUNIT DESCRIPTION : This unit introduces the student to PL/SQL language and\nexplains the benefits of this programming language. The\nstudent will learn to develop stored procedures, functions,\npackages and other basic functions.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Declare PL/SQL\nIdentifiers\n1.1 PL/SQL language is introduced in accordance with\nPL/SQL framework\n1.2 List the different Types of Identifiers in a PL/SQL\nsubprogram in accordance with PL/SQL framework\n1.3 Declarative Section to Define Identifiers are used in\naccordance with PL/SQL framework\n1.4 Variables to store data are used in accordance with\nPL/SQL framework\n1.5 Scalar Data Types are identified in accordance with\nPL/SQL framework\n1.6 Sequences in PL/SQL Expressions are used in\naccordance with PL/SQL framework\n1.7 Executable Statements are written in accordance with\nPL/SQL framework\n2. Apply Interaction with\nthe Oracle Server\n\n2.1 SELECT Statements in PL/SQL are invoked in\naccordance with PL/SQL framework\n2.2 Data in PL/SQL are retrieved in accordance with\nPL/SQL framework\n2.3 Errors by using Naming Conventions when using\nRetrieval and DML Statements are avoided in\naccordance with PL/SQL framework\n2.4 Data in the Server using PL/SQL is manipulated in\naccordance with PL/SQL framework\n2.5 SQL Cursor Attributes to Obtain Feedback on DML are\nused in accordance with PL/SQL framework\n3. Apply Exception\nHandling\n\n3.1 Exceptions are understood in accordance with PL/SQL\nframework\n3.2 Exceptions with PL/SQL are handled in accordance\nwith PL/SQL framework\n3.3 Predefined Oracle Server Errors are trapped in\naccordance with PL/SQL framework\n3.4 Non-Predefined Oracle Server Errors are trapped in\naccordance with PL/SQL framework\n3.5 User-Defined Exceptions are trapped in accordance\nwith PL/SQL framework\n3.6 Exceptions are propagated in accordance with PL/SQL\nframework\n\n--- PDF PAGE 37 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n35\n4. Store Procedures\n4.1 Modularized and Layered Subprogram Design are\ncreated in accordance with PL/SQL framework\n4.2 Development With PL/SQL Blocks are modularized in\naccordance with PL/SQL framework\n4.3 PL/SQL Execution Environment are understood in\naccordance with PL/SQL framework\n4.4 Benefits of using PL/SQL Subprograms are listed in\naccordance with PL/SQL framework\n4.5 Differences between Anonymous Blocks and\nSubprograms are listed in accordance with PL/SQL\nframework\n4.6 Procedures Parameters and Parameters Modes are\nimplemented in accordance with PL/SQL framework\n4.7 Procedure Information is viewed in accordance with\nPL/SQL framework\n\n--- PDF PAGE 38 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n36\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. PL/SQL language is\nintroduced\n•\nOverview of PL/SQL\n•\nIdentify the benefits of PL/SQL Subprograms\n•\nOverview of the types of PL/SQL blocks\n•\nCreate a Simple Anonymous Block\n•\nHow to generate output from a PL/SQL Block\n2. Executable Statements\n•\nDescribe Basic PL/SQL Block Syntax Guidelines\n•\nLearn to Comment the Code\n•\nDeployment of SQL Functions in PL/SQL\n•\nHow to convert Data Types?\n•\nDescribe Nested Blocks\n•\nIdentify the Operators in PL/SQL\n\n--- PDF PAGE 39 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n37\nEVIDENCE GUIDE\n\n1. Critical Aspect of\nCompetency\n1.1 Created and debug stored procedures and functions\n1.2 Used conditional compilation to customize the functionality\nin a PL/SQL application without removing any source code\n1.3 Designed PL/SQL packages to group related constructs\n1.4 Created overloaded package subprograms for more\nflexibility\n1.5 Designed PL/SQL anonymous blocks that execute\nefficiently\n2. Underpinning\nKnowledge\n2.1 Conditionally control code flow (loops, control structures).\n2.2 Use PL/SQL packages to group and contain related\nconstructs.\n2.3 Generate triggers to solve business challenges.\n2.4 Create anonymous PL/SQL blocks, as well as stored\nprocedures and functions.\n2.5 Use some of the Oracle supplied PL/SQL packages to\ngenerate screen output and file output.\n2.7 Create anonymous PL/SQL blocks, functions and\nprocedures.\n3. Underpinning Skills\n3.1 Basic computer operation skills\n3.2 Logic analysis\n3.3 Communication skills\n3.4 Code writing and debugging skills\n4. Method of\nAssessment\nThe assessor will assess candidate with-\n4.1 Portfolio\n•\nResult of Oracle Vendor Examinations\n•\nSample codes\n4.2 Interview\n5. Resource\nImplication\n5.1 Computer hardware with peripherals\n5.2 Appropriate software\n5.3 Access to internet\n5.4 Conducive testing environment\n6. Context of\nAssessment\nAssessment may take place in an accredited Oracle testing\ncenter\n\n--- PDF PAGE 40 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n38\nUNIT OF COMPETENCY: DESIGN AND TUNE PL/SQL LANGUAGE\nUNIT CODE : ICT313364\n\nUNIT DESCRIPTOR : This unit covers the advanced features of PL/SQL to design\nand tune PL/SQL. It also covers how to manage PL/SQL to\ninterface with the 