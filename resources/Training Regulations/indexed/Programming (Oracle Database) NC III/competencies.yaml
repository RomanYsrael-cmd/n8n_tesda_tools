        "descriptor": "This unit introduces the fundamentals of SQL using Oracle Database technology. Specifically it teaches the concepts of relational databases and the SQL programming language. It teaches how to write queries against single and multiple tables, manipulate data in tables, and create database objects. It also teaches how to use single row functions to customize output, use conversion functions and conditional expressions. This unit also focuses on how to effectively use SQL commands against business data. It teaches features that will help query and data manipulation within the database and also how to use the dictionary views to retrieve metadata and create reports about their schema objects. Further, it also teaches features on how to set user access level and usage of scalar and correlated sub-queries.",
