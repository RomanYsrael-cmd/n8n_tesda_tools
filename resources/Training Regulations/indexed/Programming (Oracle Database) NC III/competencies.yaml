          "source_text": "1. Declare PL/SQL \nIdentifiers \n1.1 PL/SQL language is introduced in accordance with \nPL/SQL framework \n1.2 List the different Types of Identifiers in a PL/SQL \nsubprogram in accordance with PL/SQL framework \n1.3 Declarative Section to Define Identifiers are used in \naccordance with PL/SQL framework \n1.4 Variables to store data are used in accordance with \nPL/SQL framework \n1.5 Scalar Data Types are identified in accordance with \nPL/SQL framework \n1.6 Sequences in PL/SQL Expressions are used in \naccordance with PL/SQL framework \n1.7 Executable Statements are written in accordance with \nPL/SQL framework \n2. Apply Interaction with \nthe Oracle Server  \n  \n2.1 SELECT Statements in PL/SQL are invoked in \naccordance with PL/SQL framework \n2.2 Data in PL/SQL are retrieved in accordance with \nPL/SQL framework \n2.3 Errors by using Naming Conventions when using \nRetrieval and DML Statements are avoided in \naccordance with PL/SQL framework \n2.4 Data in the Server using PL/SQL is manipulated in \naccordance with PL/SQL framework \n2.5 SQL Cursor Attributes to Obtain Feedback on DML are \nused in accordance with PL/SQL framework \n3. Apply Exception \nHandling \n \n3.1 Exceptions are understood in accordance with PL/SQL \nframework \n3.2 Exceptions with PL/SQL are handled in accordance \nwith PL/SQL framework \n3.3 Predefined Oracle Server Errors are trapped in \naccordance with PL/SQL framework \n3.4 Non-Predefined Oracle Server Errors are trapped in \naccordance with PL/SQL framework \n3.5 User-Defined Exceptions are trapped in accordance \nwith PL/SQL framework \n3.6 Exceptions are propagated in accordance with PL/SQL \nframework\n\n--- PDF PAGE 37 ---\n_________________________________________________________________________________ \nTR – Programming (Oracle Database) NC III                                     Promulgated – December  2013 \n \n \n35\n4. Store Procedures \n4.1 Modularized and Layered Subprogram Design are \