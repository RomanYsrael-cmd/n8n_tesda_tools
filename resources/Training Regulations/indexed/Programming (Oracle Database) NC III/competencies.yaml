        "source_title": "DESIGN AND TUNE PL/SQL LANGUAGE",
        "source_text": "--- PDF PAGE 40 ---\n_________________________________________________________________________________ \nTR – Programming (Oracle Database) NC III                                     Promulgated – December  2013 \n \n \n38\nUNIT OF COMPETENCY:  DESIGN AND TUNE PL/SQL LANGUAGE \nUNIT CODE                     :  ICT313364 \n \nUNIT DESCRIPTOR        :  This unit covers the advanced features of PL/SQL to design \nand tune PL/SQL. It also covers how to manage PL/SQL to \ninterface with the database and other applications in the \nmost efficient manner \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1 Design PL/SQL Code  \n \n1.1 Predefined data types are described in accordance \nwith PL/SQL framework \n1.2 Subtypes based on existing types for an application \nare created in accordance with PL/SQL framework \n1.3 Different guidelines for cursor design are listed in \naccordance with PL/SQL framework \n1.4 Collections are used in accordance with PL/SQL \nframework \n1.5 Manipulating Large Objects are manipulated in \naccordance with PL/SQL framework \n2. Use Advanced Interface \nMethods \n2.1 External Procedures from PL/SQL are called in \naccordance with PL/SQL framework \n2.2 Benefits of External Procedures are listed in \naccordance with PL/SQL framework \n2.3 C advanced interface methods are shown in \naccordance with PL/SQL framework \n2.4 Java advanced interface methods are shown in \naccordance with PL/SQL framework\n3. Apply Performance and \nTuning to PL/SQL code \n \n \n3.1 The compiler is understood and influenced in \naccordance with PL/SQL framework \n3.2 PL/SQL code is tuned in accordance with PL/SQL \nframework \n3.3 Intra unit in-lining is enabled in accordance with \nPL/SQL framework \n3.4 Memory issues are identified and tuned in accordance \nwith PL/SQL framework \n3.5 Network issues are recognized in accordance with \nPL/SQL framework \n3.6 Performance with Caching is improved in \naccordance with PL/SQL framework\n\n--- PDF PAGE 41 ---\n_________________________________________________________________________________ \nTR – Programming (Oracle Database) NC III                                     Promulgated – December  2013 \n \n \n39\n4. Implement virtual \nprivate database (VPD) \nwith Fine-Grained \nAccess Control \n4.1 How fine-grained access control works overall is \nunderstood in accordance with PL/SQL framework \n4.2 Features of fine-grained access control are described \nin accordance with PL/SQL framework \n4.3 An application context is described in accordance with \nPL/SQL framework \n4.4 An application context is created in accordance with \nPL/SQL framework \n4.5 An application context is set in accordance with \nPL/SQL framework \n4.6 The DBMS_RLS procedures are listed in accordance \nwith PL/SQL framework \n4.7 A policy is implemented in accordance with PL/SQL \nframework \n4.8 Dictionary views holding information on fine-grained \naccess are queried in accordance with PL/SQL \nframework\n\n--- PDF PAGE 42 ---\n_________________________________________________________________________________ \nTR – Programming (Oracle Database) NC III                                     Promulgated – December  2013 \n \n \n40\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Collections are used \n \n• \nOverview of collections \n• \nUse Associative arrays \n• \nUse Nested tables \n• \nUse VARRAYs \n• \nCompare nested tables and VARRAYs \n• \nWrite PL/SQL programs that use collections \nUse Collections effectively  \n2. Manipulating Large \nObjects \n• \nDescribe a LOB object \n• \nUse BFILEs \n• \nUse DBMS_LOB.READ and DBMS_LOB.WRITE to \nmanipulate LOBs \n• \nCreate a temporary LOB programmatically with the \nDBMS_LOB package \n• \nUse SecureFile LOBs to store documents \n• \nConvert BasicFile LOBs to SecureFile LOB format \n• \nEnable reduplication and compression \n3. Performance and Tuning\n• \nUnderstand and influence the compiler \n• \nTune PL/SQL code \n• \nEnable intra unit inlining \n• \nIdentify and tune memory issues \n• \nRecognize network issues\n\n--- PDF PAGE 43 ---\n_________________________________________________________________________________ \nTR – Programming (Oracle Database) NC III                                     Promulgated – December  2013 \n \n \n41\nEVIDENCE GUIDE \n \n1. Critical Aspect of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Designed PL/SQL packages and program units that \nexecute efficiently \n1.2 Wrote code to interface with external applications and \nthe operating system \n1.3 Created PL/SQL applications that use collections \n1.4 Wrote and tuned PL/SQL code effectively to maximize \nperformance \n1.5 Implemented virtual private database with fine-grained \naccess control \n2.Underpinning \nKnowledge \n2.1 PL/SQL designing best practices. \n2.2 Create PL/SQL applications that use collections. \n2.3 Implement a virtual private database with fine-grained \naccess control. \n2.4 Write code to interface with external C and Java \napplications. \n2.5 Write code to interface with large objects and use \nSecureFile LOBs. \n2.6 Write and tune PL/SQL code effectively to maximize \nperformance\n3.Underpinning Skills \n3.1  Basic computer operation skills \n3.2  Logic analysis \n3.3  Communication skills \n3.4  Code writing and debugging skills\n4.Method of Assessment\nThe assessor will assess candidate with- \n4.1 Portfolio  \n• \nResult of Oracle Vendor Examinations \n• \nSample codes \n4.2 Interview\n5.Resource Implication \n• \nComputer hardware with peripherals \n• \nAppropriate software  \n• \nAccess to internet \n•\nConducive testing environment \n6.Context of \nAssessment\nAssessment may take place in an accredited Oracle testing \ncenter\n",
