  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Programming (Oracle Database)\nNC III, the candidate must demonstrate competency in all the units listed in\nSection 1. Successful candidates shall be awarded a National Certificate III\nlevel signed by the TESDA Director General.\n\n4.2\nThe qualification of Programming (Oracle Database) NC III may be attained\nby passing the following exams:\n\n4.2.1. Certification Exam 1 – Oracle Database Certified SQL Expert 1Z0-\n047 which will assess the following unit of competencies:\n•\nPerform relational database management in Oracle database\ntechnology\n\n4.2.2. Certification Exam 2 – Oracle PL/SQL Developer Certified Associate –\n1Z0 – 147 which will assess the following unit of competency:\n\n• Use and apply PL/SQL Programming Language\n\n4.2.3. Certification Exam 3 – Oracle Advanced PL/SQL Developer Certified\nProfessional – 1ZO – 146 which will assess the following unit of\ncompetency:\n• Design and tune PL/SQL Language\n\nUpon accumulation and submission of Certification Exams 1, 2 and 3, an\nindividual shall be issued the corresponding National Certificate.\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1.\nGraduate of formal, non-formal, and informal, including enterprise-\nbased, training programs.\n\n4.4.2.\nExperienced workers (wage employed or self-employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS)”.\n\n--- PDF PAGE 51 ---\n_________________________________________________________________________________\nTR – Programming (Oracle Database) NC III Promulgated – December 2013\n\n49\n"
}
