      "source_text": "3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\nSHIELDED METAL ARC WELDING – NC III\n\nRecommended list of tools and materials per trainee for SHIELDED METAL ARC\nWELDING (SMAW)\n\nTOOLS\n(for 25 trainees)\nEQUIPMENT\n(for 25 trainees)\nMATERIAL\n(per trainee)\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25 pcs.\nChipping\nHammer\n12 units\nArc Welding\nmachine AC/DC\nand accessories\n1.5 kgs.\nElectrodes 2.4mm\n/ E309 or E308\n50 pcs.\nSteel brush\n12pcs.\nWelding\npositioners\n6.5 kgs.\nElectrodes 3.2mm\n/ E309 or E308\n12 pcs.\nPlier/tongs\n1 unit\nElectrode oven\n\n16 pcs.\n(approx\n18 jts)\nAlloy (SS) steel\nplate 10mm X\n150mm X 200mm\n20 pcs.\nFiles-bastard\ncut\n12 units\nPortable disc\ngrinder\n10 pcs.\n\nMild steel plate\n6mm X 100mm X\n100mm\n25 pcs.\nWelding\nMask\n1 unit\nExhaust fan\n1 pcs\nDark glass\n25 sets\nLeather\napron/jacket\n2 units\nWork bench w/\nbench vice on 4\ncorners\n12 pcs\nLens clear glass\n25 sets\nLeather\ngloves, long\n2 sets\nOxy-\nacetylene/Oxy-\nLPG cutting outfit\n12 pcs.\n\n6 pcs\nCutting disc 3/32”\nX 5/8” X 4”\nGrinding disc 1/4”\nX 5/8” X 4”\n5 pcs.\nSafety\ngoggles,\nwide vision,\nclear\n1 unit\nPedestal /bench\ngrinding machine\n1 tube\nMetal marker\n5 pcs.\nOxy-\nacetylene\nGoggles\n1 unit\nIndustrial fan\n15 pairs\nLeather gloves\n\n--- PDF PAGE 59 ---\nWeldncii11-3\n\n58\n12 pcs.\nTry square\n300 mm.\nlong\n\n12 pcs.\nSteel square\n300 mm.\nlong\n\n12 pcs.\nFiles-half\nround\n\n5 pcs.\nFillet gauge"
