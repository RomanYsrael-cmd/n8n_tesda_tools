    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: SHIELDED METAL ARC WELDING\n\nNC Level III\n\nSuggested Nominal Training Hours: 20 hrs. ( Basic Competencies)\n\n 56 hrs. ( Common Competencies)\n\n44 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes\nin Shielded Metal Arc Welding in accordance with industry standards. It covers\ncore competencies such as Welding Alloy Steel Plates using SMAW.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead\nworkplace\ncommunicat\nion\n1.1 Communicate information about\nworkplace processes\n1.2 Lead workplace discussions\n1.3 Identify and communicate\nissues arising in the workplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership\n2.2 Assign responsibilities among\n members.\n2.3 Set performance expectation\n for team members\n2.4 Supervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n\n--- PDF PAGE 54 ---\nWeldncii11-3\n\n53\n3. Develop\nand practice\nnegotiation\nskills\n3.1 Plan negotiations\n3.2 Participate in negotiations\n\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Solve\nworkplace\nproblem\nrelated to\nwork\nactivities\n4.1 Identify the problem\n4.2 Determine fundamental causes\nof the problem\n4.3 Determine corrective action\n4.4 Provide recommendation/s to\nmanager\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematic\nal concepts\nand\ntechniques\n5.1 Identify mathematical tools and\ntechniques to solve problem\n5.2 Apply mathematical\nprocedures/solution\n5.3 Analyze results\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use\nrelevant\ntechnologies\n6.1 Study/select appropriate\n technology\n6.2 Apply relevant technology\n6.1 Maintain/enhance relevant\n technology\n• Direct\nobservation\n• Simulation/role\nplaying\n•Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply Safety\nPractices\n1.1 Identify hazardous areas\n1.2 Use protective clothing and\ndevices\n1.3 Perform safe handling of tools,\n equipment and materials\n1.4 Perform first aid\n1.5 Use fire extinguisher\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n2. Interpret\nworking\ndrawings\nand sketches\n2.1 Identify standard alphabet of\nlines\n2.2 Identify orthographic/ isometric\nviews\n2.3 Interpret standard drawing\nsymbols, dimensional\ntolerances and notations\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n\n3. Perform\nIndustry\ncalculations\n3.1 Perform four fundamental\n operations\n3.2 Perform conversion of units\n3.3 Perform calculations on\n algebraic expressions\n3.4 Compute percentage and ratio\n• Lecturette\n• Practical\n application\n\n• Oral\nquestioning\n• Written test\n\n--- PDF PAGE 55 ---\nWeldncii11-3\n\n54\n\n4. Contribute to\n quality\n system\n4.1 Inspect work done\n4.2 Apply quality standards to\nwork\n4.3 Protect company property\n and customer interest\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n5. Use hand\ntools\n5.1 Select hand tools\n5.2 Use hand tools\n5.3 Maintain hand tools\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n6. Prepare\nWeld\nMaterials\n\n6.1 Set-up cutting equipment\n6.2 Cut and prepare edge of\n materials\n6.3 Clean surfaces and edges\n6.4 Prepare welding consumables\n6.5 Prepare welding safety and\n protective equipment\n• Lecturette\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n7. Set-up\n Welding\n Equipment\n7.1 Set up welding machine\n7.2 Set up welding accessories\n7.3 Set up welding positioners,\njigs and fixtures\n7.4 Set up pre-heating\ntools/equipment as required\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n•Written test\n8. Fit up Weld\n Materials\n8.1 Perform tack welding\n8.2 Check gap and alignment\n8.3 Set up welding positioner\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n•Written test\n9. Repair\n Welds\n9.1 Mark/locate weld defects\n9.2 Prepare tools and equipment\n9.3 Remove defects\n9.4 Perform re-welding\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 56 ---\nWeldncii11-3\n\n55\nCORE COMETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Weld Alloy\nSteel Plates\nUsing\nSMAW\n1.1 Perform multiple pass fillet\n weld in all positions\n ( 1F-4F )\n1.2 Perform multiple pass groove\n weld in all positions\n ( 1G-4G )\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n•Written test\n\n--- PDF PAGE 57 ---\nWeldncii11-3\n\n56"
