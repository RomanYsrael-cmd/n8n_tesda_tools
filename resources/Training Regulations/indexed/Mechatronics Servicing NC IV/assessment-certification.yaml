      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "number": "4.1",
      "text": "1. To attain the National Qualification of Mechatronics Servicing NC IV, the candidate must demonstrate competence in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate IV signed by the TESDA Director General."
    },
    {
      "number": "4.1",
      "text": "2. The qualification of Mechatronics Servicing NC IV can be attained through demonstration of competence through project-type assessment covering all the units of competency required in the qualification."
    },
    {
      "number": "4.1",
      "text": "3. Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "number": "4.1",
      "text": "4. The following are qualified to apply for assessment and certification:"
    },
    {
      "number": "4.1",
      "text": "4.1. Graduate of formal and non-formal including enterprise- based training programs."
    },
    {
      "number": "4.1",
      "text": "4.2. Experienced workers (wage employed or self-employed)"
    },
    {
      "number": "4.1",
      "text": "5. Existing National Certificate (NC) and Certificate of Competency (COC) of individuals in Mechatronics Servicing NC IV will still be in effect until such time that such NC and COC will have expired. Individuals are advised to take the assessment for this amended TR on or before the expiration of such certificates."
    },
    {
      "number": "4.1",
      "text": "6. The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)”. --- PDF PAGE 101 --- TR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 97"
