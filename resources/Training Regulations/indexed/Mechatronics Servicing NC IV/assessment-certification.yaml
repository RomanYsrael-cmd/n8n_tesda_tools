      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1. To attain the National Qualification of Mechatronics Servicing NC IV, the candidate must demonstrate competence in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate IV signed by the TESDA Director General. 4.1.2. The qualification of Mechatronics Servicing NC IV can be attained through demonstration of competence through project-type assessment covering all the units of competency required in the qualification. 4.1.3. Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.4. The following are qualified to apply for assessment and certification: 4.1.4.1. Graduate of formal and non-formal including enterprise- based training programs. 4.1.4.2. Experienced workers (wage employed or self-employed) 4.1.5. Existing National Certificate (NC) and Certificate of Competency (COC) of individuals in Mechatronics Servicing NC IV will still be in effect until such time that such NC and COC will have expired. Individuals are advised to take the assessment for this amended TR on or before the expiration of such certificates. 4.1.6. The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)”."
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior` 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification."
    }
