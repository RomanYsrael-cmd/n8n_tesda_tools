  "source_text": "Section 1. Successful candidates shall be awarded a National\nCertificate IV signed by the TESDA Director General.\n\n4.1.2. The qualification of Mechatronics Servicing NC IV can be attained\nthrough\ndemonstration\nof\ncompetence\nthrough\nproject-type\nassessment covering all the units of competency required in the\nqualification.\n\n4.1.3. Assessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.1.4. The following are qualified to apply for assessment and certification:\n\n4.1.4.1. Graduate of formal and non-formal including enterprise-\nbased training programs.\n4.1.4.2. Experienced workers (wage employed or self-employed)\n\n4.1.5. Existing National Certificate (NC) and Certificate of Competency\n(COC) of individuals in Mechatronics Servicing NC IV will still be in\neffect until such time that such NC and COC will have expired.\nIndividuals are advised to take the assessment for this amended TR\non or before the expiration of such certificates.\n\n4.1.6. The guidelines on assessment and certification are discussed in\ndetail in the “Procedures Manual on Assessment and Certification”\nand “Guidelines on the Implementation of the Philippine TVET\nCompetency Assessment and Certification System (PTCACS)”.\n\n--- PDF PAGE 101 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 97\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate\nand the assessor determine what evidence is available, where gaps\nexist, including readiness for assessment.\nThis document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior`\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited\nby TESDA is authorized to conduct competency assessment.\nAssessment centers undergo a quality assured procedure for\naccreditation before they are authorized by TESDA to manage the\nassessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 102 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 98\n\nDEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who\npass the assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and attitudes\nto perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be conducted\nor carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a particular\narea of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by the\nindividual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person perform in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the individual. It\nprovides information on critical aspects of competency, underpinning knowledge,\nunderpinning skills, resource implications, assessment method and context of\nassessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n--- PDF PAGE 103 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 99\n15) National Certificate (NC) – is a certification issued to individuals who achieve all\nthe required units of competency for a national qualification defined under the\nTraining Regulations. NCs are aligned to specific levels within the PTQF\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and are\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work is\nto be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s\nskills, knowledge and attitudes gained from life and work experiences outside\nregistered training programs\n\n20) Resource Implications - refers to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n21) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n22) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serve as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n23) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n24) Underpinning Skills - refers to the list of the skills needed to achieve the elements\nand performance criteria in the unit of competency. It includes generic and\nindustry specific skills\n\n25) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 104 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 100\n\nSECTOR SPECIFIC\n\n1) Actuator: In a closed-loop control system, that part of the final control element that\ntranslates the control signal into action by the control device.\n\n2) Automation: (1) The conversion to and implementation of procedures, processes,\nor equipment by automated means. (2) Industrial open- or closed-loop control\nsystems in which the manual operation of controls is replaced by servo operation.\n\n3) CAD: Computer-Aided Design is the use of high-resolution graphics in a wide\nrange of design activities, allowing quick evaluation and modification of intent. It is\ncommonly used to design architectural, mechanical and electrical engineering\ndrawings.\n\n4) Conveyor: A horizontal, inclined or vertical device for moving or transporting bulk\nmaterials, packages, or objects in a path predetermined by the design of the\ndevice and having points of loading and discharge fixed, or selective.\n\n5) Ergonomics --\"The systematic application of knowledge about the psychological,\nphysical, and social attributes of human beings in the design and use of all things\nwhich affect a person's working conditions: equipment and machinery, the work\nenvironment and layout, the job itself, training and the organization of work.\"\n(Humansystems Inc).\n\n6) PLC (Programmable Logic Controller) : A class of industrially hardened devices\nthat provides hardware interface for input sensors and output actuators. PLCs can\nbe programmed using relay ladder logic to control the outputs based on input\nconditions and / or algorithms contained in the memory of the PLC.\n\n7) Robotics: The study of the design and use of robots, particularly for their use in\nmanufacturing and related processes.\n\n8) Sensor: A transducer whose input is a physical phenomenon and whose output is\na quantitative measure of the phenomenon.\n\n9) Sequence control: The control of a series of machine movements, with the\ncompletion of one movement initiating the next. The extent of movements is\ntypically not specified by numerical input data.\n\n10) Servomechanism: An automatic device for controlling large amounts of power by\nmeans of small amounts of power.\n\n11) Servomotor: A power-driven mechanism that supplements a primary control\noperated by a comparatively feeble force (as in a servomechanism).\n\n12) Simulation: (1) A device, system, or computer program that represents certain\nfeatures of the behavior of a physical or abstract system. Vendors of planning and\nscheduling, forecasting and demand management, and other types of decision-\nsupport systems make growing use of simulation to compare the consequences of\nalternative courses of action.\n\n--- PDF PAGE 105 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 101\n\n13) Software: The entire set of programs, procedures, and related documentation\nassociated with a computer.\n\n14) Static Calibration: A calibration recording pressure versus output at fixed points\nat room temperature.\n\n15) Systems integration: The ability of computers, instrumentation, and equipment to\nshare data or applications with other components in the same or other functional\nareas.\n\n--- PDF PAGE 106 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 102\nANNEX A - COMPETENCY MAP (Electrical & Electronics sector)\n\nBASIC COMPETENCIES\n\nReceive and\nRespond to\nWorkplace\nCommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nWorkplace\nCommunication\nWork in a Team\nEnvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead Workplace\nCommunication\nLead Small Team\nDevelop and practice\nnegotiation skills\nSolve Problems\nRelated to Work\nActivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize Specialist\nCommunication\nSkills\nDevelop Team and\nIndividuals\nApply Problem\nSolving Techniques\nin the Workplace\nCollect, analyze and\norganize\ninformation\nPlan and Organize\nWork\nPromote\nenvironmental\nprotection\n\nCOMMON COMPETENCIES\n\nUse Hand Tools\nPerform\nMensuration and\nCalculation\nPrepare and\nInterpret Technical\nDrawing\nApply Quality\nStandards\nPerform Computer\nOperations\nTerminate and\nConnect Electrical\nWiring and\nElectronic Circuits\nTest Electronic\ncomponents\n\nCORE COMPETENCIES\n\nInstall Instrumentation\nand Control Devices\nCalibrate\nInstrumentation and\nControl Devices\nConfigure\nInstrumentation and\nControl Devices\nLoop Check\nInstrumentation and\nControl Devices\nMaintain and Repair\nInstrumentation &\nControl Devices\nStart-up\nInstrumentation and\nControl Systems\nDiagnose and\nTroubleshoot\nInstrumentation and\nControl Systems\nInstall Mechatronics\nand Automation\nDevices\nConfigure & Test\nMechatronics and\nAutomation System\nMaintain and Repair\nPLC-based\nMechatronics and\nAutomation System\nDevelop Advanced\nPLC and HMI\nSoftware Application\nProgram\nDiagnose and\nTroubleshoot\nAdvanced PLC- and\nHMI-based\nMechatronics and\nAutomation\nSystems\nCommission\nAdvanced PLC-\nand HMI-based\nMechatronics and\nAutomation\nSystems\nDevelop Mechatronics\nand Automation\nControl Circuits & PLC\nSoftware Application\nPrograms\nDevelop Motion\nControl and System\nConfiguration\nService and Repair\nAudio Systems and\nProducts\nService and Repair\nVideo Systems and\nProducts\nService and Repair\nBusiness Machines\nAssemble and\nDisassemble\nConsumer Electronic\nProducts\nMaintain and Repair\nElectronically\nControlled Domestic\nAppliances\nMaintain and Repair\nAudio-Video Products\nand Systems\nMaintain and Repair\nCellular Phones\nCommission\nConsumer\nElectronic Products\nand Systems\nDevelop Servicing\nSystems for Consumer\nElectronic Products\nTrain service\ntechnician\nManage Servicing\nSystems for Consumer\nElectronics Products\nand Systems\nTrain service\ntechnician\nsupervisors\n\n--- PDF PAGE 107 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 103\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend gratitude and appreciation to the many representatives of business, industry,\nacademe and government agencies and labor groups who donated their time and\nexpertise to the development and validation of these Training Regulations.\n\n• THE TECHNICAL EXPERT COMMITTEE (FOR CY 2006)\n\nMR. ERNIE O. DIMALANTA\nPresident, PICS Foundation, Inc.\nPresident, PhilAsia School of Instrumentation\n\nENGR. CHUCK 