        "source_text": "500311116\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired to determine individual and team development\nneeds and facilitate the development of the workgroup.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Learning and development\nneeds are systematically\nidentified and implemented\nin line with organizational\nrequirements\n1.2 Learning plan to meet\nindividual and group training\nand developmental needs is\ncollaboratively developed\nand implemented\n1.3 Individuals are encouraged\nto self -evaluate\nperformance and identify\nareas for improvement\n1.4 Feedback on performance\nof team members is\ncollected from relevant\nsources and compared with\nestablished team learning\nprocess\n• Coaching and\nmentoring\nprinciples\n• Understanding how\nto work effectively\nwith team members\nwho have diverse\nwork styles,\naspirations,\ncultures and\nperspective\n• Understanding how\nto facilitate team\ndevelopment and\nimprovement\n• Understanding\nmethods and\ntechniques for\neliciting and\ninterpreting\nfeedback\n• Ability to :\no read and\nunderstand a\nvariety of texts,\no prepare general\ninformation and\ndocuments\naccording to\ntarget audience;\no spell with\naccuracy;\no use grammar\nand punctuation\neffective\nrelationships and\nconflict\nmanagement\n• Communication\nskills\n• Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n2. Foster\nindividual and\norganizational\ngrowth\n2.1. Learning and development\nprogram goals and\nobjectives are identified to\nmatch the specific\nknowledge and skills\nrequirements of\ncompetency standards\n2.2. Learning delivery\nmethods are appropriate to\nthe learning goals, the\nlearning style of\nparticipants and availability\nof equipment and\nresources\n2.3. Workplace learning\nopportunities and coaching/\nmentoring assistance are\nprovided to facilitate\nindividual and team\nachievement of\ncompetencies\n\n• Coaching and\nmentoring\nprinciples\n• Understanding how\nto work effectively\nwith team members\nwho have diverse\nwork styles,\naspirations,\ncultures and\nperspective\n• Understanding\nmethods and\ntechniques for\neliciting and\ninterpreting\nfeedback\n• Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n• Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n• Reporting skills to\norganize\ninformation; assess\ninformation for\nrelevance and\naccuracy; identify\nand elaborate on\nlearning outcomes\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 8\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.4. Resources and timelines\nrequired for learning\nactivities are identified and\napproved in accordance\nwith organizational\nrequirements\n• Facilitation skills to\nconduct small\ngroup training\nsessions\n3. Monitor and\nevaluate\nworkplace\nlearning\n3.1 Feedback from individuals\nor teams is used to identify\nand implement\nimprovements in future\nlearning arrangements\n3.2 Outcomes and performance\nof individuals/teams are\nassessed and recorded to\ndetermine the effectiveness\nof development programs\nand the extent of additional\nsupport\n3.3 Modifications to learning\nplans are negotiated to\nimprove the efficiency and\neffectiveness of learning\n3.4 Records and reports of\ncompetency are maintained\nwithin organizational\nrequirement\n• Understanding how\nto facilitate team\ndevelopment and\nimprovement\n• Understanding\nmethods and\ntechniques for\neliciting and\ninterpreting\nfeedback\n• Understanding\nmethods for\nidentifying and\nprioritizing personal\ndevelopment\nopportunities and\noptions\n• Knowledge of\ncareer paths and\ncompetency\nstandards in the\nindustry\n• Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n• Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n• Reporting skills to\norganize\ninformation; assess\ninformation for\nrelevance and\naccuracy; identify\nand elaborate on\nlearning outcomes\n• Ability to relate to\npeople from a\nrange of social,\ncultural, physical\nand mental\nbackgrounds\n\n4. Develop team\ncommitment\nand\ncooperation\n4.1 Open communication\nprocesses to obtain and\nshare information is used\nby team\n4.2 Decisions are reached by\nthe team in accordance\nwith its agreed roles and\nresponsibilities\n4.3 Mutual concern and\ncamaraderie are developed\nin the team\n• Understanding\nmethods and\ntechniques for\neliciting and\ninterpreting\nfeedback\n• Understanding\nmethods for\nidentifying and\nprioritizing personal\ndevelopment\nopportunities and\noptions\n• Knowledge of\ncareer paths and\ncompetency\nstandards in the\nindustry\n• Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n• Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n• Facilitation skills to\nconduct small\ngroup training\nsessions\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 9\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n• Ability to relate to\npeople from a\nrange of social,\ncultural, physical\nand mental\nbackgrounds\n\n5. Facilitate\naccomplishme\nnt of\norganizational\ngoals\n5.1 Team members actively\nparticipated in team\nactivities and\ncommunication processes\n5.2 Teams members developed\nindividual and joint\nresponsibility for their\nactions\n5.3 Collaborative efforts are\nsustained to attain\norganizational goals\n• Team activities and\ncommunication\nprocesses\n• Understanding how\nto work effectively\nwith team members\nwho have diverse\nwork styles,\naspirations,\ncultures and\nperspective\n• Understanding how\nto facilitate team\ndevelopment and\nimprovement\n• Knowledge of\ncareer paths and\ncompetency\nstandards in the\nindustry\n• Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n• Planning skills to\norganize required\nresources and\nequipment to meet\nlearning needs\n• Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n• Ability to relate to\npeople from a\nrange of social,\ncultural, physical\nand mental\nbackgrounds\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 10\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Learning and\n development needs\n\n1.1 Coaching, mentoring and/or supervision\n1.2 Formal/informal learning program\n1.3 Internal/external training provision\n1.4 Work experience/exchange/opportunities\n1.5 Personal study\n1.6 Career planning/development\n1.7 Performance appraisals\n1.8 Workplace skills assessment\n1.9\nRecognition of prior learning\n2. Organizational\n requirements\n2.1 Quality assurance and/or procedures manuals\n2.2 Goals, objectives, plans, systems and processes\n2.3 Legal and organizational policy/guidelines and\nrequirements\n2.4 Safety policies, procedures and programs\n2.5 Confidentiality and security requirements\n2.6 Business and performance plans\n2.7 Ethical standards\n2.8 Quality and continuous improvement processes\nand standards\n3. Feedback on\n performance\n3.1 Formal/informal performance appraisals\n3.2 Obtaining feedback from supervisors and\ncolleagues\n3.3 Obtaining feedback from clients\n3.4 Personal and reflective behavior strategies\n3.5 Routine and organizational methods for\nmonitoring service delivery\n4. Learning delivery\n methods\n4.1 On the job coaching or mentoring\n4.2