  "source_section_text": "SECTION 2:\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common, and core units\nof competency required for Mechatronics Servicing NC IV.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY: UTILIZE SPECIALIZED COMMUNICATION SKILLS\nUNIT CODE : 500311115\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto use specialized communication skills to meet specific\nneeds of internal and internal clients, conduct interviews,\nfacilitate group of discussions, and contribute to the\ndevelopment of communication strategies.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Meet common\nand specific\ncommunication\nneeds of\nclients and\ncolleagues\n1.1 Specific communication\nneeds of clients and\ncolleagues are identified and\nmet\n1.2 Different approaches are\nused to meet communication\nneeds of clients and\ncolleagues\n1.3 Conflict is addressed\npromptly and in a timely way\nand in a manner which does\nnot compromise the standing\nof the organization\n• Communication\nprocess\n• Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n• Communication\nskills relevant to\nclient groups\n\n• Full range of\ncommunication\ntechniques including:\no Full range of\ncommunication\no Active listening\no Feedback\no Interpretation\no Role boundaries\nsetting\no Negotiation\no Establishing\nempathy\n• Communication skills\nrequired to fulfill job\nroles as specified by\nthe organization\n2. Contribute to\nthe\ndevelopment of\ncommunication\nstrategies\n2.1 Strategies for internal and\nexternal dissemination of\ninformation are developed,\npromoted, implemented and\nreviewed as required\n2.2 Channels of communication\nare established and\nreviewed regularly\n2.3 Coaching in effective\ncommunication is provided\n2.4 Work related network and\nrelationship are maintained\nas necessary\n2.5 Negotiation and conflict\nresolution strategies are\nused where required\n• Different\ncommunication\nstrategies\n• Strategies in\nnegotiations and\nconflict resolution\n\n• Full range of\ncommunication\ntechniques including:\no Active listening\no Feedback\no Interpretation\no Role boundaries\nsetting\no Negotiation\no Establishing\nempathy\n• Communication skills\nrequired to fulfill job\nroles as specified by\nthe organization\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 3\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n\n2.6 Communication with clients\nand colleagues is appropriate\nto individual needs and\norganizational objectives\n\n3. Represent the\norganization\n3.1. When participating in internal\nor external forums,\npresentation is relevant,\nappropriately researched and\npresented in a manner to\npromote the organization\n3.2. Presentation is clear and\nsequential and delivered\nwithin a predetermined time\n3.3. Utilize appropriate media to\nenhance presentation\n3.4. Differences in views are\nrespected\n3.5. Written communication is\nconsistent with organizational\nstandards\n3.6. Inquiries are responded in a\nmanner consistent with\norganizational standard\n\n• Communication\nprocess\n• Communication\nskills relevant to\nclient groups\n• Appropriate\npresentation tools\nand materials\n\n• Computer skills\n• Communication skills\nrequired to fulfill job\nroles as specified by\nthe organization\n\n4. Facilitate\ngroup\ndiscussion\n4.1 Mechanisms which enhance\neffective group interaction\nis defined and implemented\n4.2 Strategies which encourage\nall group members to\nparticipate are used routinely\n4.3 Objectives and agenda for\nmeetings and discussions are\nroutinely set and followed\n4.4 Relevant information is\nprovided to group to facilitate\noutcomes\n4.5 Evaluation of group\ncommunication strategies is\nundertaken to promote\nparticipation of all parties\n4.6 Specific communication\nneeds of individuals are\nidentified and addressed\n\n• Communication\nprocess\n• Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n• Communication\nskills relevant to\nclient groups\n\n• Full range of\ncommunication\ntechniques including:\no Role boundaries\nsetting\no Negotiation\no Establishing\nempathy\n• Communication skills\nrequired to fulfill job\nroles as specified by\nthe organization\n\n5. Conduct\ninterview\n5.1 A range of appropriate\ncommunication strategies are\nemployed in interview\nsituations\n5.2 Records of interviews are\nmade and maintained in\naccordance with\norganizational procedures\n• Communication\nprocess\n• Effective\nquestioning,\nlistening and\nnonverbal\ncommunication\ntechniques\n• Full range of\ncommunication\ntechniques including:\no Active listening\no Feedback\no Negotiation\no Establishing\nempathy\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 4\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n5.3 Effective questioning, listening\nand nonverbal communication\ntechniques are used to\nensure that required message\nis communicated\n• Communication\nskills relevant to\nclient groups\n• Types of\nInterview\n• Communication skills\nrequired to fulfill job\nroles as specified by\nthe organization\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 5\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Strategies\n1.1\nRecognizing own limitations\n1.2\nReferral to specialists\n1.3\nUtilizing techniques and aids\n1.4\nProviding written drafts\n1.5\nVerbal and non verbal communication\n2. Effective group interaction\n2.1\nIdentifying and evaluating what is\noccurring within an interaction in a non-\njudgmental way\n2.2\nUsing active listening\n2.3\nMaking decision about appropriate words,\nbehavior\n2.4\nPutting together response which is\nculturally appropriate\n2.5\nExpressing an individual perspective\n2.6\nExpressing own philosophy, ideology and\nbackground and exploring impact with\nrelevance to communication\n3. Types of Interview\n3.1\nRelated to staff issues\n3.2\nRoutine\n3.3\nConfidential\n3.4\nEvidential\n3.5\nNon-disclosure\n3.6\nDisclosure\n4. Interview situations\n4.1\nEstablish rapport\n4.2\nElicit facts and information\n4.3\nFacilitate resolution of issues\n4.4\nDevelop action plans\n4.5\nDiffuse potentially difficult situation\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 6\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated effective communication skills with\nclients accessing service and work colleagues\n1.2 Adopted relevant communication techniques and\nstrategies to meet client particular needs and\ndifficulties\n1\nResource\nImplications\nAccess to appropriate workplace where assessment can\ntake place\n2\nMethods of\nAssessment\nCompetency in this unit may be assessed through:\n2.1\nDirect observation\n2.2\nOral Interview\n3\nContext for\nAssessment\nThis unit should be assessed on the job through simulation\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 7\nUNIT OF COMPETENCY :\nDEVELOP TEAMS AND INDIVIDUALS\nUNIT CODE\n:\n500311116\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired to determine individual and team development\nneeds and facilitate the development of the workgroup.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Learning and development\nneeds are systematically\nidentified and implemented\nin line with organizational\nrequirements\n1.2 Learning plan to meet\nindividual and group training\nand developmental needs is\ncollaboratively developed\nand implemented\n1.3 Individuals are encouraged\nto self -evaluate\nperformance and identify\nareas for improvement\n1.4 Feedback on performance\nof team members is\ncollected from relevant\nsources and compared with\nestablished team learning\nprocess\n• Coaching and\nmentoring\nprinciples\n• Understanding how\nto work effectively\nwith team members\nwho have diverse\nwork styles,\naspirations,\ncultures and\nperspective\n• Understanding how\nto facilitate team\ndevelopment and\nimprovement\n• Understanding\nmethods and\ntechniques for\neliciting and\ninterpreting\nfeedback\n• Ability to :\no read and\nunderstand a\nvariety of texts,\no prepare general\ninformation and\ndocuments\naccording to\ntarget audience;\no spell with\naccuracy;\no use grammar\nand punctuation\neffective\nrelationships and\nconflict\nmanagement\n• Communication\nskills\n• Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n2. Foster\nindividual and\norganizational\ngrowth\n2.1. Learning and development\nprogram goals and\nobjectives are identified to\nmatch the specific\nknowledge and skills\nrequirements of\ncompetency standards\n2.2. Learning delivery\nmethods are appropriate to\nthe learning goals, the\nlearning style of\nparticipants and availability\nof equipment and\nresources\n2.3. Workplace learning\nopportunities and coaching/\nmentoring assistance are\nprovided to facilitate\nindividual and team\nachievement of\ncompetencies\n\n• Coaching and\nmentoring\nprinciples\n• Understanding how\nto work effectively\nwith team members\nwho have diverse\nwork styles,\naspirations,\ncultures and\nperspective\n• Understanding\nmethods and\ntechniques for\neliciting and\ninterpreting\nfeedback\n• Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n• Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n• Reporting skills to\norganize\ninformation; assess\ninformation for\nrelevance and\naccuracy; identify\nand elaborate on\nlearning outcomes\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 8\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.4. Resources and timelines\nrequired for learning\nactivities are identified and\napproved in accordance\nwith organizational\nrequirements\n• Facilitation skills to\nconduct small\ngroup training\nsessions\n3. Monitor and\nevaluate\nworkplace\nlearning\n3.1 Feedback from individuals\nor teams is used to identify\nand implement\nimprovements in future\nlearning arrangements\n3.2 Outcomes and performance\nof individuals/teams are\nassessed and recorded to\ndetermine the effectiveness\nof development programs\nand the extent of additional\nsupport\n3.3 Modifications to learning\nplans are negotiated to\nimprove the efficiency and\neffectiveness of learning\n3.4 Records and reports of\ncompetency are maintained\nwithin organizational\nrequirement\n• Understanding how\nto facilitate team\ndevelopment and\nimprovement\n• Understanding\nmethods and\ntechniques for\neliciting and\ninterpreting\nfeedback\n• Understanding\nmethods for\nidentifying and\nprioritizing personal\ndevelopment\nopportunities and\noptions\n• Knowledge of\ncareer paths and\ncompetency\nstandards in the\nindustry\n• Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n• Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n• Reporting skills to\norganize\ninformation; assess\ninformation for\nrelevance and\naccuracy; identify\nand elaborate on\nlearning outcomes\n• Ability to relate to\npeople from a\nrange of social,\ncultural, physical\nand mental\nbackgrounds\n\n4. Develop team\ncommitment\nand\ncooperation\n4.1 Open communication\nprocesses to obtain and\nshare information is used\nby team\n4.2 Decisions are reached by\nthe team in accordance\nwith its agreed roles and\nresponsibilities\n4.3 Mutual concern and\ncamaraderie are developed\nin the team\n• Understanding\nmethods and\ntechniques for\neliciting and\ninterpreting\nfeedback\n• Understanding\nmethods for\nidentifying and\nprioritizing personal\ndevelopment\nopportunities and\noptions\n• Knowledge of\ncareer paths and\ncompetency\nstandards in the\nindustry\n• Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n• Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n• Facilitation skills to\nconduct small\ngroup training\nsessions\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 9\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n• Ability to relate to\npeople from a\nrange of social,\ncultural, physical\nand mental\nbackgrounds\n\n5. Facilitate\naccomplishme\nnt of\norganizational\ngoals\n5.1 Team members actively\nparticipated in team\nactivities and\ncommunication processes\n5.2 Teams members developed\nindividual and joint\nresponsibility for their\nactions\n5.3 Collaborative efforts are\nsustained to attain\norganizational goals\n• Team activities and\ncommunication\nprocesses\n• Understanding how\nto work effectively\nwith team members\nwho have diverse\nwork styles,\naspirations,\ncultures and\nperspective\n• Understanding how\nto facilitate team\ndevelopment and\nimprovement\n• Knowledge of\ncareer paths and\ncompetency\nstandards in the\nindustry\n• Communication\nskills including\nreceiving feedback\nand reporting,\nmaintaining\neffective\nrelationships and\nconflict\nmanagement\n• Planning skills to\norganize required\nresources and\n