        "source_text": "ELC311307\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes necessary to\nundertake the commissioning of advanced PLC- and HMI-based\nmechatronics and automation systems. This includes planning\nand preparing to undertake commissioning process,\ncommissioning and testing mechatronics and automation\nsystems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\ncommissioning\nactivities\n1.1. Commissioning\nprocedures are planned\nand prepared in line with\njob requirements.\n1.2. OH & S policies and\nprocedures are\nfollowed in line with job\nrequirements.\n1.3. Commissioning\nprocedures are checked\nagainst specifications\nand requirements\n1.4. Tools, equipment and\ntesting devices needed\nare obtained and\nchecked for correct\noperation and safety.\n1.5. Materials necessary are\nobtained in accordance\nwith job requirements\n• Use of tools\n• Use of test equipment/\ninstrument\n• Knowledge in block\ndiagram of the advanced\nPLC/ HMI system\n• Occupational health and\nsafety\n• Loop checking based on\ndesign specifications\n• Tools, equipment and\ntesting devices\no Multitester/\no Laptop / PC\no Advanced PLC\nprogrammer/ software\no Human Machine\nInterface (HMI)\no PLC\n• Materials\n• Communication/ Interface\ncables\n• Reading skills\nrequired to\nunderstand work\ninstructions\n• Diagram\ninterpretation skills\n• Communication\nskills\n• Planning skills\n2. Commission\nmechatronics\nand automation\nsystem\n2.1. Appropriate personal\nprotective equipment\n(PPE) is used and OHS\npolicies & procedures\nare followed.\n2.2. Mechatronics and\nautomation system are\nchecked using specified\nprocedures\n2.3. Commissioning\nprocedure is performed\nin accordance with\nrequirements without\ndamage to the\nsurrounding\nenvironment or services\n• Knowledge on PPE and\nOHS policies and\nprocedures\n• Knowledge on control\ncircuits\no Electro-mechanical\no Pneumatic & electro-\npneumatic\no Electro-hydraulic\n• Knowledge on verification\nof system setup based on\ndesign & expected output\nand performance\n• Advanced PLC operation\n& application\n• Field and control devices\n• Occupational and\nsafety skills\n• Reading skills\nrequired to\nunderstand work\ninstructions\n• Diagram\ninterpretation skills\n• Communication\nskills\n• Commissioning\nskills\n• Programming skills\n• Visual skills\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 61\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.4. Unplanned events or\nconditions are\nresponded to in\naccordance with\nestablished procedures\n• Advance Computer\nprogramming\n• Advanced PLC\nprogramming\n• Motion control systems\n• Knowledge on equivalent\nreplacement of parts and\nequipment\n• Knowledge on different\napproaches on system\nsetup\n3. Document\ncommissioned\nmechatronics\nand automation\nsystem\n3.1. Commissioned\nmechatronics and\nautomation system is\ndocumented according\nto established\nprocedures or\nmanufacturer’s\ninstructions.\n3.2. Report on the\ncommissioning activities\nis prepared according to\nthe company\nrequirements.\n\n• Knowledge on\ndocumentation of\ncommissioned\nmechatronics and\nautomation system\n• Knowledge on different\ntypes of technical reports\no Pre-commissioning\nreport\no Compliance output\nreport\n\n• Computer\noperation skills\n• Communication\nskills\n• Documentation\nskills\n• Technical writing\nskills\n\n--- PDF PAGE 66 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 62\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OH & S policies and\nprocedures\n1.1.\nOccupational Safety, Health and\nEnvironment (OSHE) guidelines\n1.2.\nPhilippine environmental standards\n2. Mechatronics systems\nIncludes the following but not limited to:\n2.1.\nSensoric elements\n2.2.\nElectro-mechanical elements\n2.3.\nPneumatic & electro-pneumatic elements\n2.4.\nHydraulic elements\n2.5.\nActuators & output devices\n3. Tools\nIncludes the following but not limited to:\n3.1.\nPliers; assorted\n3.2.\nScrewdrivers; assorted\n3.3.\nSoldering iron\n4. Test equipment/instruments\nIncludes the following but not limited to:\n4.1.\nMulti-tester\n4.2.\nLaptop/PC\n5. Materials\nIncludes the following but not limited to:\n5.1.\nWires\n5.2.\nTerminal lugs\n5.3.\nTerminal wire marker\n5.4.\nTerminal blocks\n6. Personal protective equipment\n6.1.\nSafety hat\n6.2.\nSafety shoes\n6.3.\nEar muffs\n6.4.\nGoggles\n6.5.\nSafety belt/Harness\n6.6.\nGloves\n6.7.\nMask\n\n--- PDF PAGE 67 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 63\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment must show that the candidate:\n1.1.\nPlanned and prepared commissioning\nprocedures in line with job requirements\n1.2.\nPerformed commissioning procedure in\naccordance with requirements without\ndamage to the surrounding environment or\nservices\n1.3.\nChecked and tested the commissioned\nmechatronics and automation system\naccording to procedures & manufacturer’s\ninstructions\n1.4.\nPrepared documentation on commissioned\nmechatronics and automation in accordance\nto the established procedures or\nmanufacturer’s instructions\n2. Method of assessment\nThe Assessor may select two of the following\nassessment methods to objectively assess the\ncandidate:\n2.1\nPractical Demonstration with Oral questioning\n2.2\nWritten Examination\n2.3\nDirect Observation with Oral questioning\n3. Resource Implication\n3.1.\nTools\n3.2.\nTest equipment/instruments\n3.3.\n PPE\n3.4.\n Materials\n3.5.\nMechatronics and automation equipment\n3.6.\nTechnical Manuals\n4. Context of Assessment\nAssessment may be conducted in the workplace or\nin a simulated environment\n\n--- PDF PAGE 68 