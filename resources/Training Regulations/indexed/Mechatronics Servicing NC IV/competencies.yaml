onnel\nconcerned\n3.2 Work plans are\nimplemented in accordance\nwith set time frames,\nresources and standards\n• Organization’s strategic\nplan, policies rules and\nregulations, laws and\nobjectives for work unit\nactivities and priorities\n• Organizations policies,\nstrategic plans,\nguidelines related to the\nrole of the work unit\n• Team work and\nconsultation strategies\n• Planning\n• Leading\n• Organizing\n• Coordinating\n• Communication\nSkills\n• Inter-and intra-\nperson/\nmotivation skills\n\n4. Monitor work\nactivities\n4.1 Work activities are\nmonitored and compared\nwith set objectives\n4.2 Work performance is\nmonitored\n4.3 Deviations from work\n• Organization’s strategic\nplan, policies rules and\nregulations, laws and\nobjectives for work unit\nactivities and priorities\n• Organizations policies,\n• Planning\n• Leading\n• Organizing\n• Coordinating\n• Communication\nSkills\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 21\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nactivities are reported and\nrecommendations are\ncoordinated with\nappropriate personnel and\nin accordance with set\nstandards\n4.4 Reporting requirements are\ncomplied with in accordance\nwith recommended format\n4.5 Observe timeliness of report\n4.6 Files are established and\nmaintained in accordance\nwith standard operating\nprocedures\nstrategic plans,\nguidelines related to the\nrole of the work unit\n• Team work and\nconsultation strategies\n• Inter-and intra-\nperson/\nmotivation skills\n\n5. Review and\nevaluate work\nplans and\nactivities\n5.1. Work plans, strategies and\nimplementation are\nreviewed based on\naccurate, relevant and\ncurrent information\n5.2. Review is based on\ncomprehensive consultation\nwith appropriate personnel\non outcomes of work plans\nand reliable feedback\n5.3. Results of review are\nprovided to c