ies any environmental\nincidents\n 2. Resource\nImplications\n The following resources should be provided:\n2.1 Workplace/Assessment location\n2.2 Legislation, policies, procedures, protocols and local\nordinances relating to environmental protection\n2.3 Case studies/scenarios relating to environmental protection\n 3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written/ Oral Examination\n3.2 Interview/Third Party Reports\n3.3 Portfolio (citations/awards from GOs and NGOs, certificate of\ntraining – local and abroad)\n 3.4 Simulations and role-plays\n 4. Context for\nAssessment\nCompetency may be assessed in actual workplace or at the\ndesignated TESDA center.\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 28\nCOMMON COMPETENCIES\n\nUNIT TITLE\n: USE HAND TOOLS\nUNIT CODE\n:\nELC311205\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes on the safe\nuse, handling and maintenance of tools.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Plan and\nprepare for\ntasks to be\nundertaken\n1.1. Tasks to be undertaken are\nproperly identified\n1.2. Appropriate hand tools are\nidentified and selected according\nto the task requirements\n• Planning and preparing\ntask/activity\n• Electronics hand tools\nand their uses\n• Function, operation and\ncommon faults in\nelectronics hand tools\n• Preparing\nrequired tasks\n• Communication\nskills\n• Using hand tools\nproperly\n2. Prepare\nhand tools\n2.1. Appropriate hand tools are\nchecked for proper operation and\nsafety\n2.2. Unsafe or faulty tools are\nidentified and marked for repair\naccording to standard company\nprocedure\n• Checking and safety\nrequirements in\nhandling tools\n• Standard procedures in\nchecking, identification\nand marking of safe or\nunsafe/ faulty tools\n• Identifying and\nchecking hand\ntools\n• Marking of safe or\nunsafe/ faulty\nhand tools\n3. Use\nappropriate\nhand tools\nand test\nequipment\n3.1. Tools are used according to\ntasks undertaken\n3.2. All safety procedures in using\ntools are observed at all times\nand appropriate personal\nprotective equipment (PPE) are\nused\n3.3. Malfunctions, unplanned or\nunusual events are reported to\nthe supervisor\n• Safety requirements in\nusing electronics hand\ntools and test\nequipment\n• Electronics hand tools\nfor adjusting,\ndismantling,\nassembling, finishing,\nand cutting.\n• Processes, Operations,\nSystems\no Proper usage and\ncare of hand tools\no Types and uses of\ntest equipment\n• Common faults in the\nuse of hand tools\n• Reading skills\nrequired to\ninterpret work\ninstruction and\nnumerical skills\n• Using PPE\nproperly\n• Problem solving\nin emergency\nsituation\n4. Maintain\nhand tools\n4.1. Tools are handled without\ndamage according to procedures.\n4.2. Routine maintenance of tools is\nundertaken according to standard\noperational procedures, principles\nand techniques\n4.3. Tools are stored safely in\nappropriate locations in\naccordance with manufacturer’s\nspecifications or standard\noperating procedures\n• Safety requirements in\nmaintenance of hand\ntools\n• Processes, Operations,\nSystems\no Maintenance of\ntools\no Storage of hand\ntools\n\n• Checking and\ncleaning hand\ntools\n• Storing hand tools\nproperly\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 29\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hand tools\nHand tools for adjusting, dismantling, assembling,\nfinishing, cutting. Tool set includes the following but not\nlimited to: screw drivers, pliers, punches, wrenches, files\n\n2. Personal Protective\nEquipment (PPE)\n2.1.\nGloves\n2.2.\nProtective eyewear\n2.3.\nApron/overall\n\n3. Maintenance\n3.1.\nCleaning\n3.2.\nLubricating\n3.3.\nTightening\n3.4.\nSimple tool repairs\n3.5.\nHand sharpening\n3.6.\nAdjustment using correct procedures\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment must show that the candidate:\n\n1.1. Demonstrated safe working practices at all times\n1.2. Communicated information about processes,\nevents or tasks being undertaken to ensure a safe\nand efficient working environment\n1.3. Planned tasks in all situations and reviewed task\nrequirements as appropriate\n1.4. Performed all tasks to specification\n1.5. Maintained and stored tools in appropriate location\n\n2. Method of assessment\nCompetency in this unit must be assessed through:\n2.1. Observation\n2.2. Oral questioning\n3. Resource Implication\nTools may include the following but not limited to:\n3.1 screw drivers\n3.2 pliers\n3.3 punches\n3.4 wrenches, files\n\n4. Context of Assessment\n\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 30\nUNIT TITLE\n:\nPERFORM MENSURATION AND CALCULATION\nUNIT CODE\n: ELC311201\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and values\nneeded identify, care, handle and use measuring instruments\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n1. Select\nmeasuring\ninstruments\n1.1. Object or component to\nbe measured is identified,\nclassified and interpreted\nto the appropriate regular\ngeometric shape\n1.2. Measuring tools are\nselected in line with job\nrequirements\n1.3. Correct specifications are\nobtained from relevant\nsource\n1.4. Appropriate measuring\ninstrument is selected to\nachieve required outcome\n1.5. Alternative measuring\ntools are used without\nsacrificing cost and quality\nof work\n\n• Category of measuring\ninstruments\n• Types and uses of\nmeasuring instruments\n• Shapes and\nDimensions\n• Formulas for volume,\nareas, perimeters of\nplane and geometric\nfigures\n• iden