        },
        "source_text": "ELC311306\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes necessary to\ndevelop, analyze, implement and review advanced PLC and HMI\napplication programs in line with requirements, software\nspecifications and applications. This includes competencies in\npreparing advanced PLC and HMI application program as well\nas testing and documenting the developed advanced PLC and\nHMI application program.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare\nadvanced\nPLC and\nHMI\napplication\nprogram\n1.1. Advanced PLC and\nHMI application\nprogram is prepared\nusing appropriate code.\n1.2. Advanced PLC and\nHMI application\nprogram is debugged\nand reworked for\ncorrection of errors\n1.3. Appropriate\nergonomic standards\nare observed to reduce\nfatigue while working\non a computer\n\n• Advanced PLC application\nprogram\no Program organization\no Data types\no Variables\no Configuration\n• HMI application program\no HMI layout\no Screen development\no Drawing tools\no PLC and HMI interfacing\no Basic HMI tools\n• Advanced PLC and HMI\nanalog program instructions\n• Advanced PLC and HMI\n• Communication setup and\nnetworking\n• Advanced PLC program\ninstructions\no Relay\no Timer\no Counter\no Math instructions\no Data manipulation\no Program control\n• Ergonomic guidelines/\nstandards\no Movement space\no Furniture dimensions\no Working postures\no Illumination and glare\n• PLC program debugging\ntechniques\no Online\no Off-line\n• Skills in computer\noperation\n• Advanced PLC\nprogramming skills\n• Debugging skills\n• Documentation\nskills\n• Analytical skills\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 57\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\n• Logic circuit analysis and\ndevelopment\no Sequential circuit\no Ladder circuit\n• Operation process\nflowcharting\n• Standard programming\nlanguages [i.e. Ladder,\nFunction block diagram\n(FBD), Instructions list (IL),\nSequential function\nflowchart (SFC), Structured\nText Language (STL)]\n2.\nTest\ndeveloped\nAdvanced\nPLC and\nHMI\napplication\nprogram\n2.1. Developed advanced\nPLC and HMI\napplication program is\nrun to ensure all syntax\nerrors are corrected.\n2.2. Program is downloaded\nusing manufacturer’s\nprocedures.\n2.3. Any limits, exceptions\nand other aspects built\ninto the control circuits,\nadvanced PLC and\nHMI application\nprogram are tested\nagainst user’s control\nrequirements.\n2.4. Advanced PLC and\nHMI application\nprogram is tested for\nuser’s acceptance\n• Advanced PLC and HMI\ninterfacing\n• Communication and\nconfiguration protocol for\nadvanced PLC and HMI\n• Downloading and uploading\nprocedures of advanced\nPLC and HMI software\nprogram\n• Standard operating\nprocedures for advanced\nPLC and HMI application\nprogram\n• Testing and commissioning\nprocedures for control\ncircuits, advanced PLC and\nHMI application program\n\n• Skills in computer\noperation\n• PLC and HMI\nprogramming skills\n• Debugging skills\n• Analytical skills\n• Testing and\ncommissioning\nskills\n3.\nDocument\nadvanced\nPLC and\nHMI\napplication\nprogram\ndeveloped\n3.1. Final control circuits,\nadvanced PLC and\nHMI application\nprogram flow or\nflowchart are prepared\naccording to company\nstandards.\n3.2. Labels and comments\nare included in the\nprogram for user–\nfriendliness.\n3.3. Final revision of the\nadvanced PLC and\nHMI application\nprogram and external\ndevices assignment are\nprepared in softcopy\nand printed formats\n• Computer software\napplications\no Computer Aided Design\n(CAD)\no Microsoft office\napplication\n• Tagging and labeling of\nprogram components\n• Exporting advanced PLC\nand HMI software program\n• Compilation of softcopy and\nprinted formats\n\n• Skills in computer\noperation\n• Documentation\nskills\n\n--- PDF PAGE 62 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 58\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Language\nInclude but not limited to:\n1.1. Standard Programming languages\n1.1.1 Ladder\n1.1.2 Function block diagram (FBD)\n1.1.3 Instructions list (IL)\n1.1.4 Sequential function flowchart (SFC)\n1.1.5 Structured Text Language (STL)\n\n1.2. Procedural language\n2. Ergonomic guidelines/\nstandards\nInclude but not limited to:\n2.1.\nMovement space\n2.2.\nFurniture dimensions\n2.3.\nWorking postures\n2.4.\nIllumination and glare\n3. Debugging\nPLC program debugging techniques:\n3.1.\nOnline\n3.2.\nOff-line\n4. Labels and comments\nInclude but not limited to:\n5.1 Elements tagging\n5.2 Labeling\n5.3 Remarks and description\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 59\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nPrepared advanced PLC and HMI application\nprogram using appropriate code\n1.2.\nDevelop advanced PLC and HMI analog program\ninstructions\n1.3.\nDownloaded program using manufacturer’s\nprocedures\n1.4.\nRun developed advanced PLC and HMI\napplication program to ensure all syntax errors are\ncorrected.\n1.5.\nTested developed advanced PLC and HMI\napplication program for user’s acceptance\n1.6.\nDebugged & tested the developed application\nprogram\n1.7.\nPrepared final revision of the advanced PLC and\nHMI application program in softcopy and printed\nformats.\n2. Method of assessment\nThe assessor may select two of the following\nassessment methods to objectively assess the\ncandidate:\n2.1\nPractical Demonstration with Oral questioning\n2.2\nWritten Examination\n2.3\nDirect Observation with Oral questioning\n3. Resource Implication\n3.1.\nComputer hardware with peripherals\n3.2.\nSoftware application programs\n3.3.\nAppropriate motion control equipment\n3.4.\nMaterials\n4. Context of Assessment\nAssessment may be conducted in the workplace or in a\nsimulated work process and procedures\n\n--- PDF PAGE 64 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 60\nUNIT TITLE :\nCOMMISSION ADVANCED PLC- AND HMI-BASED\nMECHATRONICS AND AUTOMATION SYSTEMS\n\nUNIT CODE\n:"
