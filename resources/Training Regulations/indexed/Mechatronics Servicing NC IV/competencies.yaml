        "source_text": "--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                     Promulgated Dec. 16, 2015                    2 \nSECTION 2:  \nCOMPETENCY STANDARDS \n \n \nThis section gives the details of the contents of the basic, common, and core units \nof competency required for Mechatronics Servicing NC IV. \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY:  UTILIZE SPECIALIZED COMMUNICATION SKILLS \nUNIT CODE                    :  500311115 \nUNIT DESCRIPTOR       : This unit covers the knowledge, skills and attitudes required \nto use specialized communication skills to meet specific \nneeds of internal and internal clients, conduct interviews, \nfacilitate group of discussions, and contribute to the \ndevelopment of communication strategies. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Meet common \nand specific \ncommunication \nneeds of \nclients and \ncolleagues \n1.1 Specific communication \nneeds of clients and \ncolleagues are identified and \nmet \n1.2 Different approaches  are \nused to meet communication \nneeds of clients and \ncolleagues \n1.3 Conflict is addressed \npromptly and in a timely way \nand in a manner which does \nnot compromise the standing \nof the organization \n Communication \nprocess \n Dynamics of \ngroups and \ndifferent styles of \ngroup leadership \n Communication \nskills relevant to \nclient groups \n \n Full range of \ncommunication \ntechniques including: \no Full range of \ncommunication \no Active listening \no Feedback \no Interpretation \no Role boundaries \nsetting \no Negotiation \no Establishing \nempathy \n Communication skills \nrequired to fulfill job \nroles as specified by \nthe organization \n2. Contribute to \nthe \ndevelopment of \ncommunication \nstrategies \n2.1 Strategies for internal and \nexternal dissemination of \ninformation are developed, \npromoted, implemented and \nreviewed as required \n2.2 Channels of communication \nare established and \nreviewed regularly \n2.3 Coaching in effective \ncommunication is provided \n2.4 Work related network and \nrelationship are maintained \nas necessary \n2.5  Negotiation and conflict \nresolution strategies are \nused where required \n Different \ncommunication \nstrategies \n Strategies in \nnegotiations and \nconflict resolution \n \n Full range of \ncommunication \ntechniques including: \no Active listening \no Feedback \no Interpretation \no Role boundaries \nsetting \no Negotiation \no Establishing \nempathy \n Communication skills \nrequired to fulfill job \nroles as specified by \nthe organization\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                     Promulgated Dec. 16, 2015                    3 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n \n2.6 Communication with clients \nand colleagues is appropriate \nto individual needs and \norganizational objectives \n \n \n \n3.   Represent the \norganization \n3.1. When participating in internal \nor external forums, \npresentation is relevant, \nappropriately researched and \npresented in a manner to \npromote the organization \n3.2. Presentation is clear and \nsequential and delivered \nwithin a predetermined time \n3.3. Utilize appropriate media to \nenhance presentation \n3.4. Differences in views are \nrespected \n3.5. Written communication is \nconsistent with organizational \nstandards \n3.6. Inquiries are responded in a \nmanner consistent with \norganizational standard \n \n Communication \nprocess \n Communication \nskills relevant to \nclient groups \n Appropriate \npresentation tools \nand materials \n \n Computer skills \n Communication skills \nrequired to fulfill job \nroles as specified by \nthe organization \n \n4.   Facilitate \ngroup \ndiscussion \n4.1 Mechanisms which enhance \neffective group interaction \nis defined and implemented \n4.2 Strategies which encourage \nall group members to \nparticipate are used routinely \n4.3 Objectives and agenda for \nmeetings and discussions are \nroutinely set and followed \n4.4 Relevant information is \nprovided to group to facilitate \noutcomes \n4.5 Evaluation of group \ncommunication strategies is \nundertaken to promote \nparticipation of all parties \n4.6 Specific communication \nneeds of individuals are \nidentified and addressed  \n \n Communication \nprocess \n Dynamics of \ngroups and \ndifferent styles of \ngroup leadership \n Communication \nskills relevant to \nclient groups \n \n \n Full range of \ncommunication \ntechniques including: \no Role boundaries \nsetting \no Negotiation \no Establishing \nempathy \n Communication skills \nrequired to fulfill job \nroles as specified by \nthe organization \n \n5.   Conduct \ninterview \n5.1  A range of appropriate \ncommunication strategies are \nemployed in interview \nsituations \n5.2  Records of interviews are \nmade and maintained in \naccordance with \norganizational procedures \n Communication \nprocess \n Effective \nquestioning, \nlistening and \nnonverbal \ncommunication \ntechniques \n Full range of \ncommunication \ntechniques including: \no Active listening \no Feedback \no Negotiation \no Establishing \nempathy\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                     Promulgated Dec. 16, 2015                    4 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n5.3  Effective questioning, listening \nand nonverbal communication \ntechniques are used to \nensure that required message \nis communicated \n Communication \nskills relevant to \nclient groups \n Types of \nInterview \n Communication skills \nrequired to fulfill job \nroles as specified by \nthe organization\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                     Promulgated Dec. 16, 2015                    5 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Strategies  \n1.1 \nRecognizing own limitations \n1.2 \nReferral to specialists \n1.3 \nUtilizing techniques and aids \n1.4 \nProviding written drafts \n1.5\nVerbal and non verbal communication\n2. Effective  group interaction \n2.1 \nIdentifying and evaluating what is \noccurring within an interaction in a non-\njudgmental way \n2.2 \nUsing active listening \n2.3 \nMaking decision about appropriate words, \nbehavior \n2.4 \nPutting together response which is \nculturally appropriate \n2.5 \nExpressing an individual perspective \n2.6 \nExpressing own philosophy, ideology and \nbackground and exploring impact with \nrelevance to  communication\n3. Types of Interview \n3.1 \nRelated to staff issues \n3.2 \nRoutine \n3.3 \nConfidential  \n3.4 \nEvidential \n3.5 \nNon-disclosure \n3.6\nDisclosure\n4. Interview situations \n4.1 \nEstablish rapport \n4.2 \nElicit facts and information \n4.3 \nFacilitate resolution of issues \n4.4 \nDevelop action plans \n4.5\nDiffuse potentially difficult situation\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                     Promulgated Dec. 16, 2015                    6 \n \n \nEVIDENCE GUIDE \n \n1.   Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1      Demonstrated effective communication skills with \nclients accessing service and work colleagues \n1.2      Adopted relevant communication techniques and \nstrategies to meet client particular needs and \ndifficulties\n1 \nResource \nImplications \nAccess to appropriate workplace where assessment can \ntake place \n2 \nMethods of \nAssessment \nCompetency in this unit may be assessed through: \n2.1 \nDirect observation \n2.2 \nOral Interview \n3 \nContext for \nAssessment \nThis unit should be assessed on the job through simulation\n",
