        "source_title": "APPLY PROBLEM SOLVING TECHNIQUES IN THE WORKPLACE (Critical thinking and problem solving techniques)",
        "source_text": "--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                     Promulgated Dec. 16, 2015                    12 \nUNIT OF COMPETENCY : APPLY PROBLEM SOLVING TECHNIQUES IN THE \nWORKPLACE  (Critical thinking and problem solving \ntechniques) \nUNIT CODE                      : 500311117 \nUNIT DESCRIPTOR       : \nThis competency covers the knowledge, skills and attitudes \nrequired to apply the process of problem solving and other \nproblems beyond those associated directly with the process \nunit.  It includes the application of structured processes and \nimprovement tools.  This competency is typically performed by \nan experienced technician, team leader or supervisor. \n \n \nELEMENTS \nPERFORMANCE CRITERIA\nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Analyze the \nproblem \n      (Use system \nthinking) \n1.1. Issues/concerns are \nevaluated based on \ndata gathered \n1.2. Possible causes of \nproblem are identified \nwithin the area of \nresponsibility  as \nbased on experience \nand the use of problem \nsolving tools/analytical \ntechniques \n1.3. Possible cause \nstatements are \ndeveloped based on \nfindings \n Broad understanding of \nsystems, organizational \nsystems and functions \n Broad knowledge of \nhelp desk and \nmaintenance practices \n Broad knowledge of the \nclient business domain \n Broad knowledge based \nof diagnostic tools \n General principles of \nOHS \n Divisional/unit \nresponsibilities \n Decision making within \na limited range of \noptions. \n Communication is \nclear, precise and \nvaries according to the \ntype of audience \n Time management as \napplied to self-\nmanagement. \n 1Analytical skills in \nrelation to routine \nmalfunctions. \n2. Identify \npossible \nsolutions \n2.1 All possible options are \nconsidered for \nresolution of the \nproblem in accordance \nwith safety and \noperating procedures \n2.2 Strengths and \nweaknesses of possible \noptions are considered \n2.3 Corrective action is \ndetermined to resolve \nthe problem and its \npossible future causes \n Broad understanding of \nsystems, organizational \nsystems and functions \n Broad knowledge of \nhelp desk and \nmaintenance practices \n Current industry \naccepted hardware and \nsoftware products with \nbroad and detailed \nknowledge of its general \nfeatures and capabilities \n Broad knowledge of the \noperating system \n Broad knowledge of the \nclient business domain \n Broad knowledge based \nof diagnostic tools \n \n Decision making within \na limited range of \noptions. \n Communication is \nclear, precise and \nvaries according to the \ntype of audience \n Teamwork in reference \nto personal \nresponsibility \n Time management as \napplied to self-\nmanagement. \n Analytical skills in \nrelation to routine \nmalfunctions. \n General customer \nservice skills displayed \n Questioning and active \nlistening is employed to \nclarify general \ninformation\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                     Promulgated Dec. 16, 2015                    13 \n \nELEMENTS \nPERFORMANCE CRITERIA\nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Recommend \nsolution to \nhigher \nmanagement \n    (Make \njudgment and \ndecisions/ \nSolve \nproblems ) \n3.1 Report/ communication \nor documentation are \nprepared \n3.2 Recommendations are \npresented to appropriate \npersonnel \n3.3 Recommendations are \nfollowed-up, if required \n Broad understanding of \nsystems, organizational \nsystems and functions \n Broad knowledge of \nhelp desk and \nmaintenance practices \n Broad knowledge of the \noperating system \n Broad knowledge of the \nclient business domain \n Broad knowledge \nbased incorporating \ncurrent industry \npractices related to \nescalation procedures \n Broad knowledge \nbased of diagnostic \ntools \n Decision making within \na limited range of \noptions. \n Communication is \nclear, precise and \nvaries according to the \ntype of audience \n Teamwork in reference \nto personal \nresponsibility \n Time management as \napplied to self-\nmanagement. \n Analytical skills in \nrelation to routine \nmalfunctions. \n General customer \nservice skills displayed \n4.  Implement \nsolution \n4.1 Measurable objectives \nare identified \n4.2 Resource needs are \nidentified \n4.3 Timelines are identified \nin accordance with plan \n Broad knowledge of \nhelp desk and \nmaintenance practices \n Broad knowledge of the \nclient business domain \n Broad knowledge \nbased incorporating \ncurrent industry \npractices related to \nescalation procedures \n Broad knowledge \nbased of diagnostic \ntools \n General principles of \nOHS \n Divisional/unit \nresponsibilities \n Decision making within \na limited range of \noptions. \n Time management as \napplied to self-\nmanagement. \n Analytical skills in \nrelation to routine \nmalfunctions. \n General customer \nservice skills \ndisplayed. \n Questioning and active \nlistening is employed \nto clarify general \ninformation \n5.  Evaluate/ \nMonitor \nresults and \noutcome \n5.1   Processes and \nimprovements are \nidentified based on \nevaluative assessment \nof problem \n5.2   Recommendations are \nprepared and submitted \nto superiors. \n Broad knowledge of the \nclient business domain \n Broad knowledge \nbased incorporating \ncurrent industry \npractices related to \nescalation procedures \n Broad knowledge \nbased of diagnostic \ntools \n General principles of \nOHS \n Divisional/unit \nresponsibilities\n Time management as \napplied to self-\nmanagement. \n Analytical skills in \nrelation to routine \nmalfunctions. \n General customer \nservice skills \ndisplayed. \n Questioning and active \nlistening is employed \nto clarify general \ninformation\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                     Promulgated Dec. 16, 2015                    14 \nRANGE OF VARIABLES \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nVARIABLES \nRANGE \n1. Area of responsibility \nMay include:  \n1.1. \nWork environment \n1.2. \nProblem solution processes  \n1.3. \nPreventative maintenance and diagnostic policy  \n1.4. \nRoles and technical responsibilities  \n2. Occupational Health \nand Safety \n2.1. \nAs per company, statutory and vendor \nrequirements. Ergonomic and environmental \nfactors must be considered during the \ndemonstration of this competency. \n3. Communication  \n3.1. \nVariables may include but are not limited to: \n3.2. \nWritten communication can involve both hand \nwritten and printed material, internal memos, \nelectronic mail, briefing notes and bulletin \nboards.\n4. Documentation \n4.1. \nAudit trails \n4.2. \nNaming standards  \n4.3. \nVersion control\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                     Promulgated Dec. 16, 2015                    15 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Analyzed the problem \n1.2. Identified possible solutions \n1.3. Implemented solutions \n1.4. Recommended solutions to higher management \n1.5. Outcome evaluated/monitored \nEvidence of satisfactory performance in this unit can be \nobtained by observation of performance and questioning \nto indicate knowledge and understanding of the elements \nof the competency and performance criteria.  \n2. Resource \nImplications \nAssessment will require access to an operating plant \nover an extended period of time, or a suitable method of \ngathering evidence of operating ability over a range of \nsituations. A bank of scenarios/case studies/what ifs will \nbe required as well as bank of questions which will be \nused to probe the reasoning behind the observable \nactions. \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \nThrough direct observation of application to tasks and \nquestions related to underpinning knowledge \nUnder general guidance, checking various stages of \noperation and at the completion of the activity against \nperformance criteria and specifications \n \n4. Context for \nAssessment \n4.1. Competency may be assessed in the work place or \nin a simulated work place setting \n4.2. Assessment shall be carried out through TESDA’s \nAccredited Assessment Centers/Venues while \ntasks are undertaken either individually or as part \nof a team under limited supervision\n",
