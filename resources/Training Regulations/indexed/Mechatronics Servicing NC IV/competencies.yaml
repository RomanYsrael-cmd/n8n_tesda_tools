        "source_title": "COLLECT, ANALYZE AND ORGANIZE INFORMATION (Access and evaluate information)",
        "source_text": "--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                     Promulgated Dec. 16, 2015                    16 \nUNIT OF COMPETENCY  :   COLLECT, ANALYZE AND ORGANIZE  INFORMATION \n(Access and evaluate  information) \n \nUNIT CODE                        :  500311118 \n \nUNIT DESCRIPTOR          :   This unit covers the outcomes required to process, \nanalyze, interpret and organize workplace information and \nother relevant data. \n \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.   Study \ninformation \nrequirements \n1.1  Needs  are identified  using  \nestablished research \nprocedures  \n 1.2  Relevant forms and \nrecording systems are \nused to gather the \ninformation \n 1.3  Respondents are selected \nto implement survey / \nresearch based on \nestablished procedures  \n Data processing, \nInformation analysis \nand interpretation \n Research methods  \no \nQualitative \no \nQuantitative \no \nStatistical \n Report writing \n Use of relevant \nsoftware \no Spreadsheets \no Presentation \ngraphics \no Work processor \no Statistical package \n \n Communicating \neffectively \n Performing \nresearch \n Reading / \ninterpreting data \nand information \n Problem solving \n 2.   Process data  \n 2.1  Data are collected and \ncollated based on the \nprescribed  method. \n 2.2  Relevant data are used as \nreferences in accordance \nwith the objectives of the \nprogram. \n 2.3  Information is compiled \naccording to the required \nform \n \n Data processing, \nInformation analysis \nand interpretation \n Research methods  \no \nQualitative \no \nQuantitative \no \nStatistical \n Report writing \n \n Communicating \neffectively \n Performing \nresearch \n Reading / \ninterpreting data \nand information \n Problem solving \n3.   Analyze, \ninterpret and \norganize \ninformation \ngathered \n3.1  Data are analyzed using \nrelevant   methodologies \n3.2  Where applicable, \nstatistical \nanalysis/methods are \nemployed  according to the \nobjectives of the program \n 3.3  Graphs and other visual \npresentations are prepared \nto facilitate analysis / \ninterpretation of \ninformation \n Data processing, \nInformation analysis \nand interpretation \n Research methods  \no \nQualitative \no \nQuantitative \no \nStatistical \n Report writing \n Use of relevant \nsoftware \no Spreadsheets \no Presentation \ngraphics \no Work processor \no Statistical package \n Communicating \neffectively \n Performing \nresearch \n Reading / \ninterpreting data \nand information \n Problem solving\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                     Promulgated Dec. 16, 2015                    17 \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4. Present \nfindings/ \nrecommendati\nons   \n4.1  Findings/ \nrecommendations \nsummarized and \npresented/packaged in \nuser-friendly manner \n4.2  Relevant inputs gathered to \nfinalize report  \n4.3  Draft report prepared \nbased on standard format. \n4.4  Technical reports are \nsubmitted and \ndisseminated to concerned \noffices.                  \n \n Data processing, \nInformation analysis \nand interpretation \n Research methods  \no \nQualitative \no \nQuantitative \no \nStatistical \n Report writing \n Use of relevant \nsoftware \no Spreadsheets \no Presentation \ngraphics \no Work processor \no Statistical package \n Communicating \neffectively \n Performing \nresearch \n Reading / \ninterpreting data \nand information \n Problem solving\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                     Promulgated Dec. 16, 2015                    18 \n \n \nRANGE OF VARIABLES \n \nVARIABLES \nR A N G E \n 1.  Research procedures \n May include: \n1.1 TNA \n1.2 Front-end analysis \n1.3 Surveys \n1.4 Interviews \n1.5 Functional analysis \n1.6 DACUM research \n  2. Forms  \n May include: \n 2.1  Survey forms/Questionnaires \n 2.2  Personal information/Profile \n 2.3  Accident report form \n 2.4  Requisition slip \n 2.5  Job orders \n 2.6  Purchase request form \n 2.7  Incident report form \n 3.  Methodologies \n May include: \n 3.1  Qualitative methods \n 3.2  Quantitative methods \n 4.  Statistical analysis/ \nmethods \nMay include: \n 4.1. Averages (Mean, Median, Mode) \n 4.2. Percentage \n 4.3. Ranks \n 4.4. Frequency Distribution \n 4.5  Statistical test \n  5.  Data \n May include: \nRaw Data \n  6.  Information \n May include: \nProcessed and packaged data\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                     Promulgated Dec. 16, 2015                    19 \nEVIDENCE GUIDE \n \n1.   Critical Aspects of  \nCompetency  \n Assessment requires evidence that the candidate: \n 1.1   Determined information requirements based on \norganizational goals and objectives.  \n 1.2   Used relevant forms and recording systems to gather \ndata  \n 1.3   Processed data based on the objectives of the \nprogram \n 1.4   Utilized relevant research methods based on the \nobjective of the program \n 1.5   Analyzed and organized information gathered \n 1.6   Submitted/Disseminated technical reports to \nconcerned offices \n 2.   Resource \nImplications \nThe following resources should be provided: \n2.1 Workplace or assessment location \n2.2 Access to office equipment and facilities relevant to \nthe unit \n2.3 Case studies/scenarios \n 3.   Methods of  \nAssessment \n \nCompetency may be assessed through: \n3.1   Written/ Oral Examination \n3.2   Interviews \n3.3   Portfolio \n 4.   Context for  \nAssessment \nCompetency may be assessed in actual workplace or \nTESDA Accredited Assessment Center\n",
