        "source_text": "--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                  Promulgated Dec. 16, 2015              50 \nUNIT OF COMPETENCY:   TEST ELECTRONIC COMPONENTS   \n \nUNIT CODE                     :   ELC311209 \n \nDESCRIPTON                 :   This unit covers the knowledge, skills and attitudes required to \ntest electronic components. It includes competencies in \ndetermining the criteria for testing electronics components, \nplanning an approach for component testing, testing the \ncomponents and evaluating the testing process. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine \ncriteria for \ntesting \nelectronics \ncomponents \n1.1 Work instructions are \nobtained and clarified \nbased on job order or \nclient requirements \n1.2 Responsible person is \nconsulted for effective and \nproper work coordination \n1.3 Data sheets/Application \nnotes are obtained and \ninterpreted based on \nmanufacturer’s \nspecifications \n1.4 Testing criteria are \ndefined to ensure that \ncomponents meet \ntechnical and quality \nrequirements \n1.5 Document and \ncommunicate testing \ncriteria to relevant \npersonnel \n Mensuration/ Mathematics\no Conversion of Units \no Applied Mathematics \n Safety  \no Work Safety \nrequirements and \neconomy of materials \nwith durability \n Systems and Processes \no Principles of electrical/ \nelectronic circuits \no Identifying sources of \nelectricity \no Identifying conductors \nand insulators \no Supplying different \nvoltage using variable \npower supply \no Measuring resistance \nusing VOM \no Testing resistors \no Measuring current and \nvoltage using VOM \n Testing Criteria \no controls \no effectiveness \no efficiency \no bug detection \no functionality, including \nflow \no interoperability \no performance \no reliability \no operating parameters\n Work efficiently & \nsystematically \n Communication \nskills  \n Use and \nmaintenance of \ntools and \nequipment \n Skills in testing \nelectronic \ncomponents \n Work safety \npractices and \ntime management \n Problem solving \nskills \n Reading skills \n2. Plan an \napproach for \ncomponent \ntesting \n2.1 Various testing methods \nare Identified based on \ntypes of electronic \ncomponents \n2.2 Characteristics and \nappropriateness of testing \nmethods to be used \nduring development and \non completion is \n Safety  \no Work Safety \nrequirements and \neconomy of materials \nwith durability \no Knowledge in 5S \napplication and \nobservation of \nrequired timeframe \n Work efficiently & \nsystematically \n Communication \nskills  \n Use and \nmaintenance of \ntools and \nequipment \n Skills in testing\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                  Promulgated Dec. 16, 2015              51 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \ndetermined \n2.3 Testing methods are \nconsidered/selected in \nrelation to appropriate \ntesting strategy \n2.4 Plan for testing \ncomponents is developed \nat specified points during \ndevelopment and on \ncompletion \n2.5 Required test & \nmeasuring instruments \nand tools are prepared \nand checked in \naccordance with \nestablished procedures \n2.6 Records system is \nestablished to document \ntesting results, including \nproblems and faults \n Materials, tools and \nequipment uses and \nspecifications \no Proper care and use \nof tools \n Types of electronic \ncomponents \no Passive components \no Active components \no Dynamic components \no Hybrid components \n Testing methods \no automated \no debugging \no inspection \no platform testing \no prototyping \n Systems and Processes \no Describing resistance \nand identify resistors \no Describing alternating \ncurrent circuits \no Describing \ncapacitance and \nidentifying capacitors \no Describing inductance \nand identifying \ninductors \no describing the \ncharacteristic of \ntransformers  \no describing and \nidentifying \nsemiconductor diode \no describing and \nidentifying bipolar \ntransistor \no describing and \nanalyzing digital gate \nelectronic \ncomponents \n Work safety \npractices and \ntime management \n Problem solving \nskills \n Reading skills \n3. Test \ncomponents  \n3.1 Testing methods are \napplied to ensure that \nproducts meet creative, \nproduction and technical \nrequirements \n3.2 Problems and faults \ndetected by testing are \nrecorded and remedial \nsteps taken in records \nsystem is documented \n3.3 Problems and faults \ndetected during testing \nare resolved in \naccordance with agreed \n Safety  \no Work Safety \nrequirements and \neconomy of materials \nwith durability \n Materials, tools and \nequipment uses and \nspecifications \no Proper care and use \nof tools \n Systems and Processes \no Principles of electrical/ \nelectronic circuits \no Supplying different \n Work efficiently & \nsystematically \n Communication \nskills  \n Use and \nmaintenance of \ntools and \nequipment \n Skills in testing \nelectronic \ncomponents \n Work safety \npractices and\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                  Promulgated Dec. 16, 2015              52 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nproject or industry practice\n3.4 Evaluate final products \nagainst the previously \ndetermined criteria \n3.5 Testing process is \ndocumented and \nsummarized evaluation \nreport is submitted to \nrelevant personnel \nvoltage using variable \npower supply \no Measuring resistance \nusing VOM \no Testing resistors \no Measuring current and \nvoltage using VOM \no Observing waveform \nusing oscilloscope \no generating waveform \nin various frequency \nusing function \ngenerator \no Measuring frequency \nusing oscilloscope \no Measuring \ncapacitance using \nVOM \no Testing capacitors \no Testing inductors \no testing semiconductor \ndiode \no testing bipolar \ntransistor \no testing logic gates\ntime management \n Problem solving \nskills \n Reading skills \n4 \nEvaluate the \ntesting \nprocess \n4.1 Testing methods that \nwere successful and \nthose that led to \ndifficulties are identified \nbased on industry \nstandards \n4.2 Testing process and \nrecords system are \nevaluated based on \nstandard procedures \n4.3 Test results/findings are \ndocumented for \nsubsequent components \ntesting.  \n Evaluation of testing \nprocess and records \nsystem \n Systems and Processes \no Analyzing simple \ncircuit using ohms and \npower law \no Analyzing \nseries/parallel circuits \nusing ohms and power \nlaw \no Analyzing \nseries/parallel \ncapacitances \no analyzing series \nparallel inductors \no analyzing rectifier \ncircuits \no analyzing amplifier \ncircuit \no analyzing multi-\nvibrator circuit \no analyzing logic \nnetworks \no analyzing sequence \ncircuits \n Work efficiently & \nsystematically \n Communication \nskills  \n Use and \nmaintenance of \ntools and \nequipment \n Skills in testing \nelectronic \ncomponents \n Work safety \npractices and \ntime management \n Problem solving \nskills \n Reading skills\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                  Promulgated Dec. 16, 2015              53 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Responsible person \nRelevant personnel may include: \n1.1. Immediate supervisor \n1.2. Manager \n2. Testing criteria  \nTesting criteria may include: \n2.1. controls \n2.2. effectiveness \n2.3. efficiency \n2.4. bug detection \n2.5. functionality, including flow \n2.6. interoperability \n2.7. performance \n2.8. reliability \n2.9. operating parameters \n3. Testing methods  \nTesting methods may include: \n3.1. automated \n3.2. debugging \n3.3. inspection \n3.4. platform testing \n3.5. prototyping \n4. Types of electronic components \n4.1. Passive components \n4.2. Active components \n4.3. Dynamic components \n4.4. Hybrid components \n5. Testing strategy  \nTesting strategy may be determined by: \n5.1. Passive testing \n5.2. Dynamic testing \n5.3. In-circuit testing \n6. Test and measuring instruments\nTest and measuring instruments may include: \n6.1. Variable DC power supply \n6.2. Digital VOM \n6.3. analog VOM \n6.4. dual trace triggered oscilloscope \n6.5. function generator \n7. Tools  \nTools may include: \n7.1. set of pliers \n7.2.  set of screw drivers \n7.3. set of wrenches \n7.4.  Hand drills, \n7.5.  Hack saw \n7.6.  set of files \n7.7.  tin snip \n7.8. hammer\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                  Promulgated Dec. 16, 2015              54 \n8. Records system \nRecords system may include: \n8.1. metadata that includes: \n8.1.1. description of fault \n8.1.2. identification of code \n8.1.3. user responses \n8.1.4. written or verbal comments \n8.1.5. quantitative data \n8.1.6. remedial action taken \n8.1.7. retest result \n8.1.8. date \n8.1.9. tester's details \n8.2. questionnaire \n8.3. survey\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                  Promulgated Dec. 16, 2015              55 \nEVIDENCE GUIDE \n \n1 \nCritical aspects of \ncompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nDetermined criteria for testing electronics components \n1.2 \nPlanned an approach for component testing \n1.3 \nTested components \n1.4 \nEvaluated the testing process \n \n2 Method of \nassessment \n \nCompetency may be assessed through two or more of the \nfollowing methods: \n2.1 \nDirect observation of application to tasks and questions \nrelated to required knowledge \n2.2 \nDemonstration with oral questioning \n2.3 \nThird party report \n2.4 \nWritten test \n2.5 \nPortfolio \n3 Resource \nimplications \n \nThe following resources must be provided: \n3.1 \nTools and equipment (see range of variables) \n3.2 \nWorking area/bench \n3.3 \nElectronic components \n3.4 \nTesting instruments and equipment \n3.5 \nAssessment rating sheet \n3.6 \nReporting forms \n4 Context of \nassessment \nAssessment maybe conducted in the workplace or in a \nsimulated workplace setting\n",
