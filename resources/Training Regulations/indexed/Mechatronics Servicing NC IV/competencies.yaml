        "source_text": "--- PDF PAGE 68 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                  Promulgated Dec. 16, 2015              64 \nUNIT TITLE                :    DIAGNOSE AND TROUBLESHOOT ADVANCED PLC- AND HMI-\nBASED MECHATRONICS AND AUTOMATION SYSTEMS \n \nUNIT CODE \n: \nELC311308 \n \nUNIT DESCRIPTOR  : \nThis unit covers the knowledge, skills and attitudes needed to \ndiagnose and troubleshoot defects in Mechatronics and \nautomation systems. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Plan and \nprepare for \ndiagnosis and \ntroubleshooting \nof faults in \nmechatronics \nand automation \nsystems  \n1.1. Diagnosis and \ntroubleshooting of faults is \nplanned and prepared in \nline with job requirements \n1.2. OH & S policies and \nprocedures are followed in \nline with job requirements \n1.3. Authorized personnel are \nconsulted to coordinate the \nwork effectively \n1.4. Materials necessary are \nobtained in accordance with \nestablished procedures and \njob requirements \n1.5. Tools, equipment and \ntesting devices needed are \nobtained in accordance with \njob requirements and \nchecked for proper \noperation and safety. \n1.6. Mechatronics system \nfaults are checked against \njob requirements. \n Planning and preparing \ndiagnosis of faults \n Occupational health \nand safety \n Diagnostic and \ntroubleshooting \nprocedures  \n Work place \ncommunication \n Identification of \ndiagnostic materials \no Wires \no Terminal lugs \no Terminal Blocks \no Wire Marker \n Use of tools \n Use of test equipment/ \ninstruments \n Motion Control and \nControl circuits \n Advanced PLC and \nHMI mechatronics and \nautomation system \no Sensor elements \no Electro-mechanical \nelements \no Pneumatic & \nelectro-pneumatic \nelements \no Hydraulic elements \no Actuators & output \ndevices\n Diagnostic skills \nand troubleshooting \ntechniques \n Reading skills \nrequired to \nunderstand work        \ninstructions \n Diagram \ninterpretation skills \n Communication \nskills  \n Problem solving \nskills \n2. Diagnose and \ntroubleshoot \nfaults of \nmechatronics \nand automation \nsystems \n2.1 Appropriate personal \nprotective equipment is \nused and OHS policies & \nprocedures are followed \n2.2 Fault or problem in the \nmechatronics system is \ndiagnosed and troubleshoot \nin line with the standard \noperating procedures and \ntechnical requirements. \n Knowledge on PPE \nand OHS \n Knowledge on \nadvanced PLC and \nHMI mechatronics and \nautomation system \ndiagnostic and \ntroubleshooting \n Knowledge & \ninterpretation of \n Diagnostic skills \n Reading skills \nrequired to \nunderstand work        \ninstructions \n Diagram \ninterpretation skills \n Communication \nskills  \n Problem solving\n\n--- PDF PAGE 69 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                  Promulgated Dec. 16, 2015              65 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2.3 Contingency measures are \nmanaged and implemented \nin accordance with \nestablished procedures  \n2.4 Unplanned events or \nconditions are responded to \nin accordance with \nestablished procedures \nmanufacturer’s/ \ncompany contingency  \nmeasures \n Knowledge on            \nproblems and faults \n Fault finding \ntechniques \n Out-of-control action \nplan (OCAP) on \nunplanned events or \nconditions \nskills \n Troubleshooting \nskills \n \n3. Rectify/ Correct \nfaults in the \nmechatronics \nand automation \nsystem \n3.1. Appropriate personal \nprotective equipment is \nused and OH & S policies & \nprocedures are followed \n3.2. Systems and associated \nequipment are isolated, \nwhen necessary, in \naccordance with established \nprocedures \n3.3. Defective components or \nparts are replaced or \ncorrected without damage to \nthe surrounding \nenvironment or services \n3.4. Adjustments are made in \naccordance with established \nprocedures, where \nnecessary. \n3.5. Unplanned events or \nconditions are responded to \nin accordance with \nestablished procedures. \n Knowledge in product \nreplacement and            \nspecification  \n Equipment isolation \ntechnique and \nprocedures \n Components and parts \nspecification \n Components and parts \nvisual inspection  \n Contingency \nprocedures on \nunplanned events or \nconditions at fault \ncorrection and \nrectification \n \n \n Diagnostic skills \n Analytical skills \n Reading skills \nrequired to \nunderstand work        \ninstructions \n Diagram \ninterpretation skills \n Communication \nskills  \n Problem solving \nskills \n Troubleshooting \nskills \n \n4. Test and \ndocument the \ncorrected \nmechatronics \nand automation \nsystem \n4.1 Mechatronics and \nautomation system and \nassociated equipment are \ntested using specified \ntesting procedures as per \nmanufacturer’s instructions. \n4.2 Mechatronics and \nautomation system and \nassociated equipment are \nchecked to ensure safe \noperation.  \n4.3 Unplanned events or \nconditions are responded to \nin accordance with \nestablished procedures. \n4.4 Documentation is prepared/ \ncompleted in accordance \nwith company requirements \n \n Manufacturer’s testing \nprocedures \n Advanced PLC and \nHMI mechatronics and \nautomation systems \noperation procedures \n Contingency \nprocedures on \nunplanned events or \nconditions on         \ntesting corrected \nsystem \n Knowledge on \ntechnical reports \nespecially testing and \ncommissioning report \n \n Diagnostic skills \n Reading skills \nrequired to \nunderstand work        \ninstructions \n Diagram \ninterpretation skills \n Communication \nskills  \n Problem solving \nskills \n Troubleshooting \nskills \n Documentation \nskills\n\n--- PDF PAGE 70 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                  Promulgated Dec. 16, 2015              66 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. OH & S policies and \nprocedures \n1.1. \nOH & S guidelines \n1.2. \nPhilippine environmental standards \n2. Materials \nIncludes the following but not limited to: \n2.1. \nWires  \n2.2. \nTerminal lugs \n2.3. \nTerminal wire marker \n2.4.\nTerminal blocks\n3. Tools \nIncludes the following but not limited to: \n3.1. \nPliers; assorted \n3.2. \nScrewdrivers; assorted \n3.3.\nSoldering iron\n4. Test equipment/instruments \nIncludes the following but not limited to: \n4.1. \nMulti-tester \n4.2.\nProgrammers or PC\n5. Mechatronics Systems \nIncludes the following but not limited to: \n5.1. \nSensor elements \n5.2. \nElectro-mechanical elements \n5.3. \nPneumatic & electro-pneumatic elements \n5.4. \nHydraulic elements \n5.5.\nActuators & output devices\n6. Personal protective equipment\n6.1. \nSafety hat \n6.2. \nSafety shoes \n6.3. \nEar muffs \n6.4. \nGoggles \n6.5. \nSafety belt/Harness \n6.6. \nGloves \n6.7.\nMask\n\n--- PDF PAGE 71 ---\nTESDA-SOP-QSO-01-F08 \nTR – Mechatronics Servicing NC IV (Amended)                  Promulgated Dec. 16, 2015              67 \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment must show that the candidate: \n1.1. Planned and prepared diagnosis and \ntroubleshooting of faults in line with job \nrequirements \n1.2. Diagnosed and troubleshoot fault or problem \nin the mechatronics system is in line with job \nrequirements \n1.3. Managed and implemented contingency \nmeasures in accordance with established \nprocedures \n1.4. Checked and tested mechatronics and \nautomation system and associated equipment \nusing specified testing procedures as per \nmanufacturer’s instructions \n1.5. Rectified/Corrected faults in the mechatronics \nand automation system \n1.6. Prepared/completed documentation in \naccordance with the company requirements \n2. Method of assessment \nThe Assessor may select two of the following \nassessment methods to objectively assess the \ncandidate: \n2.1 \nPractical Demonstration with Oral questioning \n2.2 \nWritten Examination \n2.3 \nDirect Observation with Oral questioning \n3. Resource Implication \n3.1. \nTools \n3.2. \nTest instruments/equipment \n3.3. \nPPE \n3.4. \nMechatronic equipment \n3.5. \nMaterials \n3.6.\nTechnical Manuals\n4. Context of Assessment \nAssessment may be conducted in the workplace or \nin a simulated environment.\n",
