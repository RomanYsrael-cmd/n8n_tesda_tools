        "source_text": "ELC311203\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and\nvalues needed to perform computer operations which include\ninputting, accessing, producing and transferring data using the\nappropriate hardware and software\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Plan and\nprepare for\ntask to be\nundertaken\n1.1. Requirements of task are\ndetermined\n1.2. Appropriate hardware and\nsoftware are selected\naccording to task assigned and\nrequired outcome\n1.3. Task is planned to ensure OH\n& S guidelines and\nprocedures are followed\n• Main types of\ncomputers and\nbasic features of\ndifferent operating\nsystems\n• Main parts of a\ncomputer\n• Information on\nhardware and\nsoftware\n• Data security\nguidelines\n• Reading and\ncomprehension skills\nrequired to interpret\nwork instruction and to\ninterpret basic user\nmanuals.\n• Communication skills to\nidentify lines of\ncommunication,\nrequest advice, follow\ninstructions and receive\nfeedback.\n• Interpreting user\nmanuals and security\nguidelines\n2. Input data\ninto\ncomputer\n2.1. Data are entered into the\ncomputer using appropriate\nprogram/application in\naccordance with company\nprocedures\n2.2. Accuracy of information is\nchecked and information is\nsaved in accordance with\nstandard operating procedures\n2.3. Inputted data are stored in\nstorage media according to\nrequirements\n2.4. Work is performed within\nergonomic guidelines\n\n• Basic ergonomics\nof keyboard and\ncomputer user\n• Storage devices\nand basic\ncategories of\nmemory\n• Relevant types of\nsoftware\n\n• Technology skills to\nuse equipment safely\nincluding keyboard\nskills.\n• Entering data\n3. Access\ninformation\nusing\ncomputer\n3.1. Correct program/ application is\nselected based on job\nrequirements\n3.2. Program/application containing\nthe information required is\naccessed according to\ncompany procedures\n3.3. Desktop icons are correctly\nselected, opened and closed\nfor navigation purposes\n3.4. Keyboard techniques are\ncarried out in line with OH & S\nrequirements for safe use of\nkeyboards\n• General security,\nprivacy legislation\nand copyright\n• Productivity\nApplication\n• Business\nApplication\n• Accessing information\n• Searching and\nbrowsing files and data\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 43\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Produce/ou\ntput data\nusing\ncomputer\nsystem\n4.1. Entered data are processed\nusing appropriate software\ncommands\n4.2. Data printed out as required\nusing computer\nhardware/peripheral devices in\naccordance with standard\noperating procedures\n4.3. Files, data are transferred\nbetween compatible systems\nusing computer software,\nhardware/ peripheral devices\nin accordance with standard\noperating procedures\n• Computer\napplication in\nprinting, scanning\nand sending\nfacsimile\n• Types and\nfunction of\ncomputer\nperipheral\ndevices\n• Computer data\nprocessing\n• Printing of data\n• Transferring files and\ndata\n5. Maintain\ncomputer\nequipment\nand\nsystems\n5.1. Systems for cleaning, minor\nmaintenance and\nreplacement of consumables\nare implemented\n5.2. Procedures for ensuring\nsecurity of data, including\nregular back-ups and virus\nchecks are implemented in\naccordance with standard\noperating procedures\n5.3. Basic file maintenance\nprocedures are implemented in\nline with the standard\noperating procedures\n\n• Computer\nequipment/\nsystem basic\nmaintenance\nprocedures\n• Viruses\n• OH & S principles\nand\nresponsibilities\n• Calculating\ncomputer\ncapacity\n• System Software\n• Basic file\nmaintenance\nprocedures\n• Removing computer\nviruses from infected\nmachines\n• Making backup files\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 44\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and peripheral\ndevices\n1.1. Personal computers\n1.2. Networked systems\n1.3. Communication equipment\n1.4. Printers\n1.5. Scanners\n1.6. Keyboard\n1.7.\nMouse\n2. Software\nSoftware includes the following but not limited to:\n2.1. Word processing packages\n2.2. Data base packages\n2.3. Internet\n2.4.\nSpreadsheets\n3. OH & S guidelines\n3.1. OHS guidelines\n3.2.\nEnterprise procedures\n4. Storage media\nStorage media include the following but not limited to:\n4.1. diskettes\n4.2. CDs\n4.3. zip disks\n4.4.\nhard disk drives, local and remote\n5. Ergonomic guidelines\n5.1. Types of equipment used\n5.2. Appropriate furniture\n5.3. Seating posture\n5.4. Lifting posture\n5.5.\nVisual display unit screen brightness\n6. Desktop icons\nIcons include the following but not limited to:\n6.1. directories/folders\n6.2. files\n6.3. network devices\n6.4.\nrecycle bin\n7. Maintenance\n7.1. Creating more space in the hard disk\n7.2. Reviewing programs\n7.3. Deleting unwanted files\n7.4. Backing up files\n7.5. Checking hard drive for errors\n7.6. Using up to date anti-virus programs\n7.7. Cleaning dust from internal and external\nsurfaces\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 45\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment must show that the candidate:\n\n1.1. Selected and used hardware components\ncorrectly and according to the task\nrequirement\n1.2. Identified and explain the functions of both\nhardware and software used, their general\nfeatures and capabilities\n1.3. Produced accurate and complete data in\naccordance with the requirements\n1.4. Used appropriate devices and procedures to\ntransfer files/data accurately\n1.5. Maintained computer system\n2. Method of assessment\nThe assessor may select two of the following\nassessment methods to objectively assess the\ncandidate:\n2.1\nObservation\n2.2\nQuestioning\n2.3\nPractical demonstration\n3. Resource implication\n3.1. Computer hardware with peripherals\n3.2. Appropriate software\n4. Context of Assessment\nAssessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 46\nUNIT TITLE\n:\nTERMINATE AND CONNECT ELECTRICAL WIRING AND\nELECTRONICS CIRCUIT\nUNIT CODE\n:"
