ctronic\nschematic is drawn and\ncorrectly identified.\n3.2. Correct drawing is\nidentified, equipment are\nselected and used in\naccordance with job\nrequirements.\n\n• Drawing conventions\n• Dimensioning\nConventions\n• Mathematics\no Four fundamental\noperations\no Percentage\no Fraction\no Algebra\no Geometry\n• Reading skills\nrequired to interpret\nwork instruction\n• Communication\nskills\n• Preparing/Making\nelectrical/ electronic\nsigns and symbols\n• Computing formulas\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 35\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED SKILLS\n4. Store technical\ndrawings and\nequipment/\ninstruments\n4.1. Care and maintenance of\ndrawings are undertaken\naccording to company\nprocedures.\n4.2. Technical drawings are\nrecorded and inventory is\nprepared in accordance\nwith company\nprocedures.\n4.3. Proper storage of\ninstruments is\nundertaken according to\ncompany procedures.\n• Effective ways to\ncatalogue and store\ntechnical drawings\n• Manual methods of\nhandling, storing and\nmaintaining paper\ndrawings\n• Storing drawing in\ndigital forms\no Scanner\no CAD\n\n• Handling and storing\nof drawings\n• Scanning and\nstoring drawings in\ndigital form\n• Matching\nspecification details\nwith existing\nresources\n• Handling of drawing\ninstruments\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 36\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technical drawings\nTechnical drawings include the following but not limited to:\n1.1. Schematic diagrams\n1.2. Charts\n1.3. Block diagrams\n1.4. Lay-out plans\n1.5. Location plans\n1.6. Process and instrumentation diagrams\n1.7. Loop diagrams\n1.8. System Control Diagrams\n2. Dimensions\nDimensions may include but not limited to:\n\n2.1. Length\n2.2. Width\n2.3. Height\n2.4. Diameter\