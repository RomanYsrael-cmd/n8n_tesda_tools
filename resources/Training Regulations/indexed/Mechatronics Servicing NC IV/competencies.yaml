automation system\n1.6. Prepared/completed documentation in\naccordance with the company requirements\n2. Method of assessment\nThe Assessor may select two of the following\nassessment methods to objectively assess the\ncandidate:\n2.1\nPractical Demonstration with Oral questioning\n2.2\nWritten Examination\n2.3\nDirect Observation with Oral questioning\n3. Resource Implication\n3.1.\nTools\n3.2.\nTest instruments/equipment\n3.3.\nPPE\n3.4.\nMechatronic equipment\n3.5.\nMaterials\n3.6.\nTechnical Manuals\n4. Context of Assessment\nAssessment may be conducted in the workplace or\nin a simulated environment.\n\n--- PDF PAGE 72 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 68"
