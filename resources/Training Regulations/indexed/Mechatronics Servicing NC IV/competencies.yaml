        "evidence_guide": {
          "source_text": "1. Critical aspects of\n Competency\n Assessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of environmental legislations and local\nordinances according to the different environmental\nissues/concerns.\n1.2 Described industrial standard environmental practices\naccording to the different environmental issues/concerns.\n1.3 Resolved problems/ constraints encountered based on\nmanagement standard procedures\n1.4 Implemented and monitored environmental practices on a\nperiodic basis as per company guidelines\n1.5 Recommended solutions for the improvement of the program\n 1.6 Monitored and reported to proper authorities any environmental\nincidents\n 2. Resource\nImplications\n The following resources should be provided:\n2.1 Workplace/Assessment location\n2.2 Legislation, policies, procedures, protocols and local\nordinances relating to environmental protection\n2.3 Case studies/scenarios relating to environmental protection\n 3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written/ Oral Examination\n3.2 Interview/Third Party Reports\n3.3 Portfolio (citations/awards from GOs and NGOs, certificate of\ntraining – local and abroad)\n 3.4 Simulations and role-plays\n 4. Context for\nAssessment\nCompetency may be assessed in actual workplace or at the\ndesignated TESDA center.\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 28\nCOMMON COMPETENCIES\n\nUNIT TITLE\n: USE HAND TOOLS\nUNIT CODE\n:"
        },
        "source_text": "500311120\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required in\nadhering to environmental protection principles, strategies and\nguidelines\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Study\nguidelines for\nenvironmental\nconcerns\n1.1 Environmental\nlegislations/\nconventions and local\nordinances are identified\naccording to the different\nenvironmental\naspects/impact\n1.2 Industrial standard/\nenvironmental practices\nare described according\nto the different\nenvironmental concerns\n• Features of an\nenvironmental\nmanagement strategy\n• Environmental\nissues/concerns\n• International\nEnvironmental Protocols\n(Montreal, Kyoto)\n• Waste minimization\nhierarchy\n• Environmental planning/\nmanagement\n• Community needs and\nexpectations\n• Resource availability\n• Environment-friendly/\nenvironmental\nadvocates\n• Sanitary Code\n• Environmental Code of\npractice\n• Communicating\neffectively\n• Performing\nresearch and\nanalysis\n• Reading /\ninterpreting data\nand information\n• Problem solving\n2. Implement\nspecific\nenvironmental\nprograms\n2.1 Programs/Activities are\nidentified according to\norganizations policies and\nguidelines.\n2.2 Individual roles/\nresponsibilities are\ndetermined and\nperformed based on the\nactivities identified.\n2.3 Problems/ constraints\nencountered are resolved\nin accordance with\norganizations’ policies and\nguidelines\n2.4 Stakeholders are\nconsulted based on\ncompany guidelines\n\n• Features of an\nenvironmental\nmanagement strategy\n• Waste minimization\nhierarchy\n• Environmental planning/\nmanagement\n• Community needs and\nexpectations\n• Resource availability\n• Environment-friendly/\nenvironmental\nadvocates\n• 5S of Good\nHousekeeping\n• 3Rs – Reduce, Reuse &\nRecycle\n\n• Communicating\neffectively\n• Performing\nresearch and\nanalysis\n• Reading /\ninterpreting data\nand information\n• Problem solving\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 25\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Monitor\nactivities on\nenvironmental\nprotection/\nprograms\n3.1 Activities are periodically\nmonitored and evaluated\naccording to the objectives\nof the environmental\nprogram\n3.2 Feedback from\nstakeholders are gathered\nand considered in\nproposing enhancements\nto the program based on\nconsultations\n3.3 Data gathered are\nanalyzed based on\nevaluation requirements\n3.4 Recommendations are\nsubmitted based on the\nfindings\n3.5 Management support\nsystems are set/\nestablished to sustain and\nenhance the program\n3.6 Environmental incidents\nare monitored and reported\nto concerned/proper\nauthorities\n\n• Features of an\nenvironmental\nmanagement strategy\n• Environmental\nissues/concerns\n• International\nEnvironmental Protocols\n(Montreal, Kyoto)\n• Waste minimization\nhierarchy\n• Environmental planning/\nmanagement\n• Community needs and\nexpectations\n• Resource availability\n• Environment-friendly/\nenvironmental\nadvocates\n• 5S of Good\nHousekeeping\n• 3Rs – Reduce, Reuse &\nRecycle\n• Sanitary Code\n• Environmental Code of\npractice\n• Communicating\neffectively\n• Performing\nresearch and\nanalysis\n• Reading /\ninterpreting data\nand information\n• Problem solving\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 26\n\nRANGE OF VARIABLES\n\nVARIABLES\nR A N G E\n 1. Legislations/Conventions May include:\n 1.1 Clean Air act\n 1.2 Clean Water Act\n1.3 Solid Waste Management\n1.4 Montreal Protocol\n1.5 Kyoto Protocol\n 2. Environmental\naspects/impacts\n2.1 Air pollution\n2.2 Water pollution\n2.3 Noise pollution\n2.4 Solid waste\n2.5 Flood control\n2.6 Deforestation/Denudation\n2.7 Radiation/Nuclear /Radio Frequency/ Microwaves\n2.8 Situation\n2.9 Soil erosion (e.g. Quarrying, Mining, etc.)\n2.10 Coral reef/marine life protection\n 3. Industrial standards/\nEnvironmental practices\n3.1 ECC standards\n3.2 ISO standards\n3.3 company environmental management systems\n(EMS)\n 4. Periodic\n4.1 hourly\n4.2 daily\n4.3 weekly\n4.4 monthly\n4.5 quarterly\n4.6 yearly\n 5. Programs/Activities\n5.1 Waste disposal (on-site and off-site)\n5.2 Repair and maintenance of equipment\n5.3 Treatment and disposal operations\n5.4 Clean-up activities\n5.5 Laboratory and analytical test\n5.6 Monitoring and evaluation\n 5.7 Environmental advocacy programs\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 27\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\n Assessment requires evidence that the candidate:\n1.1 Demonstrated knowledge of environmental legislations and local\nordinances according to the different environmental\nissues/concerns.\n1.2 Described industrial standard environmental practices\naccording to the different environmental issues/concerns.\n1.3 Resolved problems/ constraints encountered based on\nmanagement standard procedures\n1.4 Implemented and monitored environmental practices on a\nperiodic basis as per company guidelines\n1.5 Recommended solutions for the improvement of the program\n 1.6 Monitored and reported to proper authorities any environmental\nincidents\n 2. Resource\nImplications\n The following resources should be provided:\n2.1 Workplace/Assessment location\n2.2 Legislation, policies, procedures, protocols and local\nordinances relating to environmental protection\n2.3 Case studies/scenarios relating to environmental protection\n 3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written/ Oral Examination\n3.2 Interview/Third Party Reports\n3.3 Portfolio (citations/awards from GOs and NGOs, certificate of\ntraining – local and abroad)\n 3.4 Simulations and role-plays\n 4. Context for\nAssessment\nCompetency may be assessed in actual workplace or at the\ndesignated TESDA center.\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 28\nCOMMON COMPETENCIES\n\nUNIT TITLE\n: USE HAND TOOLS\nUNIT CODE\n:"
