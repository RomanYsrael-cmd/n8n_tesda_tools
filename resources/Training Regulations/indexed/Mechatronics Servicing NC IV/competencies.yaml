        "source_text": "ELC311206\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and\nvalues needed to terminate and connect electrical wiring and\nelectronic circuits\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Plan and\nprepare for\ntermination/\nconnection of\nelectrical\nwiring/\nelectronics\ncircuits\n1.1. Materials are checked\naccording to specifications\nand tasks\n1.2. Appropriate tools and\nequipment are selected\naccording to tasks\nrequirements\n1.3. Task is planned to ensure\nOH & S guidelines and\nprocedures are followed\n1.4. Electrical wiring/electronic\ncircuits are correctly\nprepared for\nconnecting/termination in\naccordance with\ninstructions and work site\nprocedures\n• Use of tools\n• Use of test\ninstruments /\nequipment\n• Electrical theory\n• Principals of AC and\nDC\n• OH & S guidelines\nand procedures\n• Basic electrical and\nelectronic devices\n• Reading skills\nrequired to interpret\nwork instruction\n• Checking materials\nfor conformance to\nspecifications\n• Checking existing\nand new installation\nsite for correct\nlocation and\nspecification\n2. Terminate/\nconnect\nelectrical\nwiring/\nelectronic\ncircuits\n2.1. Safety procedures in\nusing tools are observed\nat all times and\nappropriate personal\nprotective equipment\nare used\n2.2. All work undertaken safely\nin accordance with the\nworkplace and standard\nprocedures\n2.3. Appropriate range of\nmethods in\ntermination/connection\nare used according to\nspecifications,\nmanufacturer’s\nrequirements and safety\n2.4. Correct sequence of\noperation is followed\n2.5. Accessories used are\nadjusted, if necessary\n2.6. Confirm\ntermination/connection\nundertaken successfully in\naccordance with job\nspecification\n\n• Wiring techniques\n• OH & S principles\n• Use of lead-free\nsoldering technology\n• Specifications and\nmethods for\nterminating different\nmaterials\n• Communication\nskills\n• Marking, tagging\nand labeling\nrequirements for\ncables, wires,\nconductors and\nconnections\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 47\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Test\ntermination/\nconnections\nof electrical\nwiring/\nelectronics\ncircuits\n3.1. Testing of all completed\ntermination/ connections\nof electric wiring/electronic\ncircuits is conducted for\ncompliance with\nspecifications and\nregulations using\nappropriate procedures\nand equipment\n3.2. Wiring and circuits are\nchecked using specified\ntesting procedures\n3.3. Unplanned events or\nconditions are responded\nto in accordance with\nestablished procedures\n\n• AC and DC power\nsupplies\n• Use of diagnostic\nequipment\n• Surface mount\nsoldering techniques\n• Tests for wiring and\nconnections\n• Wiring support\ntechniques and\nalternatives\n• Soldering\ntechniques\n• Printed circuit board\nrepair and\ntechniques\n• Electronic assembly\nfunctional and\nquality testing\n• Undertaking testing\nof wiring and\nconnections for\nconformance to\nspecification\n• Using language and\nliteracy skills to\ncomplete short\nreports and\nrequired\n• Adjusting and fixing\nwiring supports\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 48\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMaterials included the following but not limited to:\n1.1 Soldering lead\n1.2 Cables\n1.3 Wires\n2. Tools and equipment\n2.1 Tools for measuring, cutting, drilling,\nassembling/disassembling. Tool set includes the\nfollowing but not limited to:\n2.1.1 Pliers\n2.1.2 Cutters\n2.1.3 Screw drivers\n2.2 Equipment\n2.2.1 Soldering gun\n2.2.2 Multi-tester\n3. Personal protective\nequipment\n3.1 goggles\n3.2 gloves\n3.3 apron/overall\n4. Methods\n4.1 Clamping\n4.2 Pin connection\n4.3 Soldered joints\n4.4 Plugs\n5. Accessories\nAccessories may include the following but not limited\nto:\n5.1 brackets\n5.2 clamps\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 49\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment must show that the candidate:\n\n1.1. Undertook work safely and according to workplace\nand standard procedures\n1.2. used appropriate termination/ connection methods\n1.3. followed correct sequence in termination /\nconnection process\n1.4. conducted testing of terminated connected\nelectrical wiring/electronic circuits using appropriate\nprocedures and standards\n2. Method of assessment\nThe assessor may select two (2) of the following\nassessment methods to objectively assess the candidate:\n2.1\nObservation\n2.2\nOral Questioning\n2.3\nPractical demonstration\n3. Resource implication\nTools for measuring, cutting, drilling,\nassembling/disassembling, connecting. Tool set includes\nthe following but not limited to:\n3.1\nscrew drivers\n3.2\npliers\n3.3\ncutters\n4. Context of Assessment\nAssessment may be conducted in the workplace or in a\nsimulated environment\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 50\nUNIT OF COMPETENCY: TEST ELECTRONIC COMPONENTS\n\nUNIT CODE :"
      },
