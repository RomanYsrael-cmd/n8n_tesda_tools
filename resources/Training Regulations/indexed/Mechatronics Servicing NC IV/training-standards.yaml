    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title:\nMechatronics and Automation Servicing NC Level: NC IV\n\nNominal Training Duration:\n30 hrs – Basic Competencies\n\n64 hrs – Common Competencies\n\n 106 hrs – Core Competencies\n\n -----------\n\n 200 hrs\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\na Mechatronics Technician, in accordance with industry standards. It covers the basic &\ncommon competencies in addition to the core competencies such as developing\nadvanced PLC and HMI software programs, performing commissioning, diagnostics &\ntroubleshooting on advanced PLC- and HMI-based mechatronics and automation\nsystems.\n\n( The nominal duration of 200 hours covers only the basic, common and core units at\nMechatronics Servicing NC IV level. TVET providers can however, offer a longer,\nladderized course covering NC II, NC III and NC IV basic, common and core units.)\n\n--- PDF PAGE 73 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 69\nBASIC COMPETENCIES\n30 hrs\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Method\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1 Meet common and\nspecific\ncommunication\nneeds of clients\nand colleagues\n\n Read\no Communication process\no Dynamics of groups and\ndifferent styles of group\nleadership\n Identify different approaches to meet\nthe needs of clients and colleagues\n Lecture\n Written examination\n1 hr.\n1.2 Contribute to the\ndevelopment of\ncommunication\nstrategies\n Apply communication skills to fulfill\njob roles as specified by the\norganization\n Demonstration\n Observation\n1 hr.\n Apply communication techniques in\ncommunicating with clients and\ncolleagues\no Active listening\no Feedback\no Interpretation\no Role boundaries setting\no Negotiation\no Establishing empathy\n Demonstration\n Observation\n\n Describe strategies for internal and\nexternal dissemination of information\n Group\ndiscussion\n Oral evaluation\n\n1.3 Represent the\norganization\n\n Describe criteria for a good\npresentation\n Prepare presentation material for\ninternal or external forums to promote\nthe organization\n Use appropriate media to enhance\nthe presentation\n Demonstration\n Observation\n1 hr.\n\n--- PDF PAGE 74 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 70\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Method\nNominal\nDuration\n1.4 Facilitate group\ndiscussion\n Gather relevant information\n Apply values in facilitating differences\nin views\n Demonstration\n Observation\n1 hr.\n1.5 Conduct interview\n Describe communication strategies\nemployed in interview situations\n Group\ndiscussion\n Oral evaluation\n1 hr.\n Conduct interview\n Apply organizations procedure in\nmaintaining records of interviews\n Use questioning, listening and\nnonverbal communication techniques\nto client groups\n\n Demonstration\n\n Observation\n\n2. Develop teams\nand individuals\n2.1 Provide team\nleadership\n\n Describe\no Coaching and mentoring principles\no working effectively with team\nmembers who have diverse work\nstyles, aspirations, cultures and\nperspective\no facilitating team development and\nimprovement\n Group\ndiscussion\n Oral evaluation\n1 hr.\n\n Read\no methods for identifying and\nprioritizing personal development\nopportunities and options\no methods and techniques for\neliciting and interpreting feedback\n• Lecture\n• Written examination\n\n Apply communication skills in\nreceiving feedback and reporting,\nmaintaining effective relationships\nand conflict management\n Group\ndiscussion\n Oral evaluation\n\n--- PDF PAGE 75 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 71\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Method\nNominal\nDuration\n\n Apply team leadership skills to\nsupport colleagues:\no Planning skills\no Coaching and mentoring skills\no Reporting skills\no Facilitation skills\n Group\ndiscussion\n Oral evaluation\n\n2.2 Foster individual\nand organizational\ngrowth\n Describe Learning and development\nprogram goals and objectives\n Apply learning delivery methods in\npreparing learning and program goals\nand objectives\n Group\ndiscussion\n Oral evaluation\n1 hr.\n\n Demonstration\n Observation\n\n Identify and prioritize personal\ndevelopment opportunities and\noptions for career paths and\ncompetency standards in the industry\n• Lecture\n• Written examination\n\n2.3 Monitor and\nevaluate\nworkplace\nlearning\n Use feedback system to identify and\nimplement future learning\narrangements improvements\n Assess and record outcomes and\nperformance of individuals/teams\n Negotiate learning plan modifications\nfor learning efficiency and\neffectiveness\n Maintain records and reports of\ncompetency\n\n Demonstration\n\n Observation\n\n1 hr.\n\n2.4 Develop team\ncommitment and\ncooperation\n Use open communication processes\nto obtain and share information by\nteam\n\n1 hr.\n\n Apply decisions making skills in team\nagreed roles and responsibilities\n Demonstration\n Observation\n\n Demonstrate mutual concern and\ncamaraderie in the team\n\n--- PDF PAGE 76 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 72\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Method\nNominal\nDuration\n\n2.5 Facilitate\naccomplishment\nof organizational\ngoals\n Describe team activities and\ncommunication processes\n Apply individual and joint\nresponsibility with team members\n Prepare organizational goals in\ncollaboration with team members\n Group\ndiscussion\n Oral evaluation\n1 hr.\n\n Demonstration\n Observation\n\n3. Apply problem\nsolving\ntechniques in\nthe workplace\n(Critical thinking\nand problem\nsolving\ntechniques)\n3.1 Analyze the\nproblem (Use\nsystem thinking)\n\n Describe\no organizational systems and\nfunctions\no help desk and maintenance\npractices\n Group\ndiscussion\n Oral evaluation\n2 hrs.\n Read\no hardware and software products\no operating system\no client business domain\no industry practices on escalation\nprocedures\no diagnostic tools\n• Lecture\n• Written examination\n\n Video presentation on applying\nproblem solving techniques in the\nworkplace\n• Video viewing\n• Oral evaluation\n\n Apply in problem solving:\no Decision making skills\no Communication skills\no Teamwork\no Time management\no General customer service skills\no Questioning and active listening\n Demonstration\n Observation\n\n Gather data for evaluated\nIssues/concerns\n\n--- PDF PAGE 77 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 73\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Method\nNominal\nDuration\n\n Use problem solving tools/analytical\ntechniques to identify possible causes\nof problem\n\n Demonstration\n Observation\n\n3.2 Identify possible\nsolutions\n Apply possible options to consider in\npreparing:\no Resolution of the problem\no Strengths and weaknesses\no Corrective action\n\n Demonstration\n Observation\n1 hr.\n\n3.3 Recommend\nsolution to higher\nmanagement\n(Make judgment\nand decisions/\nSolve problems )\n\n Prepare documentation to appropriate\npersonnel:\no communication or documentation\nReport\no Recommendations\n Coordinate follow-up if required\n\n Demonstration\n Observation\n1 hr.\n3.4 Implement\nsolution\n Identify\no Measurable objectives\no Resource needs\no Timelines\n\n• Lecture\n• Written examination\n1 hr.\n\n3.5 Evaluate/\nMonitor results\nand outcome\n Read evaluative assessment of\nproblem\n Demonstration\n Observation\n1 hr.\n Evaluate results and outcome of\nproblem\n Prepare and submit\nrecommendations to superiors\n\n--- PDF PAGE 78 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 74\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Method\nNominal\nDuration\n4. Collect, Analyze\nand Organize\nInformation\n(access and\nevaluate\ninformation)\n4.1 Study information\nrequirements\n\n Describe\no Data processing, Information\nanalysis and interpretation\n Read\no Research methods:\n Qualitative\n Quantitative\n Statistical\no Report writing\no Use of relevant software\n Spreadsheets\n Presentation graphics\n Work processor\nStatistical package\n Group\ndiscussion\n Oral evaluation\n1 hr.\n• Lecture\n• Written examination\n\n Identify research procedures\n• Lecture\n• Written examination\n\n Use relevant forms and recording\nsystems to gather information\n Demonstration\n Observation\n\n Conduct survey / research to selected\nrespondents based on established\nprocedures\n\n4.2 Process data\n Use prescribed researched method\nin:\no Collecting data\no Referencing relevant data\no Compiling information in required\nform\n\n Demonstration\n Observation\n1 hr.\n\n--- PDF PAGE 79 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 75\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Method\nNominal\nDuration\n\n4.3 Analyze, interpret\nand organize\n Prepare analysis of data using:\no relevant methodologies\no statistical analysis/methods\no graphs and other visual\npresentations\n Demonstration\n Observation\n1 hs.\n4.4 Present findings/\nrecommendations\n Gather inputs to finalize report\n Demonstration\n Observation\n1 hr.\n Prepare draft report in standard\nformat\n Prepare and package summary of\nfindings\n Submit and disseminate technical\nreport to concerned offices\n5. Plan and\norganize work\n(manage\nprojects)\n5.1 Set objectives\n Describe Organization’s strategic\nplan, policies rules and regulations,\nlaws and objectives related to:\no work unit activities and priorities\no role of the work unit\n Group\ndiscussion\n Oral evaluation\n1 hr.\n Video presentation on planning and\norganizing work\n• Video viewing\n• Oral evaluation\n\n Prepare objectives consistent with\nwork activities and according to\norganizational aims with:\no measurable targets\no realistic and attainable\no support and commitment of team\nmembers\n Demonstration\n Observation\n\n--- PDF PAGE 80 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 76\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Method\nNominal\nDuration\n\n5.2 Plan and schedule\nwork activities\n Identify and prioritize tasks/work as\ndirected\n• Lecture\n• Written examination\n1 hr.\n Prepare tasking of activities with\no Set time frames\no Allocated Resources\no Schedule of work activities of\nconcerned personnel\n Demonstration\n Observation\n\n5.3 Implement work\nplans\n Identify work methods and practices\n• Lecture\n• Written examination\n\n2 hrs.\n Implement work plans with set time\nframes, resources and standards\n Demonstration\n Observation\n\n5.4 Monitor work\nactivities\n Monitor:\no work activities with set objectives\no Work performance\n Demonstration\n Observation\n1 hr.\n Use recommended format and\nreporting requirements in preparing\nreport\n Prepare report and recommendations\nof deviations from work activities\n\n5.5 Review and\nevaluate work\nplans and\nactivities\n Use accurate, relevant and current\ninformation in the review and\nimplementation of work plans and\nstrategies\n\n1 hr.\n\n Review outcomes of work plans and\nstrategies in consultation to\nappropriate personnel\n Demonstration\n Observation\n\n Prepare adjustments/simplifications\non policies, processes and activities\non results of review provided by\nconcerned parties\n\n Prepare Performance appraisal report\nas per organization requirements\n\n--- PDF PAGE 81 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 77\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Method\nNominal\nDuration\n\n Prepare and present\nrecommendations to appropriate\npersonnel/authorities\n Implement feedback mechanisms in\nline with organization policies\n Demonstration\n Observation\n\n6. Promote\nenvironmental\nprotection\n6.1 Study guidelines\nfor environmental\nconcerns\n Describe\no environmental\nlegislations/conventions and local\nordinances\n- International Environmental\nProtocols (Montreal, Kyoto)\no Industrial standard/environmental\npractices\n- Sanitary Code\n-\nEnvironmental Code of practice\n Group\ndiscussion\n Oral evaluation\n1 hr.\n\n Read\no Features of an environmental\nmanagement strategy\no Waste minimization hierarchy\no Environmental\nplanning/management\n• Lecture\n• Written examination\n\n Prepare environment research and\nanalysis\n Apply:\no 5S of Good Housekeeping\no 3Rs – Reduce, Reuse & Recycle\n Demonstration\n Observation\n\n Video presentation on Environment\n\n• Video viewing\n• Oral evaluation\n\n--- PDF PAGE 82 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 78\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment Method\nNominal\nDuration\n\n6.2 Implement specific\nenvironmental\nprograms\n identify environmental\nprograms/activities according to\norganizations policies and guidelines\n• Lecture\n• Written examination\n2 hrs.\n\n Perform individual\nroles/responsibilities based on the\nidentified activities\n Apply problem solving skill in\nresolving encountered\nproblems/constraints according to\norganizations policies and guidelines\n Demonstration\n Simulation/Role\nPlay\n Observation\n\n Coordinate environmental programs/\nactivities with stakeholders based on\ncompany guidelines\n Demonstration\n Observation\n\n6.3 Monitor activities\non environmental\nprotection/\nprograms\n Monitor activities on environmental\nprotection/ programs\n Demonstration\n Observation\n1 hr.\n Follow management support system\nin sustaining and enhancing the\nprogram\n\n Prepare environmental incidents\nreport and submit to concerned /\nproper authorities\n\n Gather feedback from stakeholders\non proposed program enhancements\n Demonstration\n Observation\n\n Evaluate and analyze findings for the\nenhanced program according to:\no gathered data\no submitted recommendations\n\n--- PDF PAGE 83 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 79\nCOMMON COMPETENCIES\n64 hrs\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n1. Use Hand\nTools\n1.1 Plan and\nprepare for\ntasks to be\nundertaken\n Plan and prepare for task/activity\n Identify different types and functions of hand tools\n Identify electronics hand tools and their uses\n Identify function, operation and common faults in\nelectronics hand tools\n Lecture /\nDemonstration\n Group\ndiscussion\n\n Written/Oral\nexamination\n\n2 hours\n1.2 Prepare hand\ntools\n Practice proper use of hand tools\n Practice checking and safety requirements in handling\ntools\n Apply standard procedures in checking, identification and\nmarking of safe or unsafe/ faulty tools\nPerform marking of safe or unsafe/ faulty hand tools\n Lecture /\nDemonstration\n Role play\n Video\npresentation\n Written/Oral\nexamination\n Practical\ndemonstration\n\n2 hours\n1.3 Use\nappropriate\nhand tools and\ntest equipment.\n Apply safety handling of hand tools and test equipment\n Identify/Select electronics hand tools for adjusting,\ndismantling, assembling, finishing, and cutting\n Use appropriate hand tools and test equipment for the job\nrequirement\n Read and learn the -\no Proper usage and care of hand tools\no Types and uses of test equipment\n Identify common faults in the use of hand tools\n Lecture /\nDemonstration\n Role play\n Video\npresentation\n\n Written/Oral\nexamination\n Practical\ndemonstration\n\n2 hours\n\n1.4 Maintain hand\ntools\n Apply safety requirements in maintenance of hand tools\n Read and understand processes, operations & systems\nfor:\no Maintenance of tools\no Storage of hand tools\nApply 5S principles in maintenance of hand tools\n Lecture /\nDemonstration\n Group\ndiscussion\n\n Written/Oral\nexamination\n Practical\ndemonstration\n\n2 hours\n2. Perform\nMensurations\nand\nCalculation\n2.1 Select\nmeasuring\ninstruments;\n\n Identify category and types of measuring tools and its\nuses\n Select measuring instruments as per category\n Interpret shapes and dimensions of objects/components\n\n Lecture\n Group\ndiscussion\n\n Written\nexamination\n Oral evaluation\n\n2 hours\n\n--- PDF PAGE 84 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 80\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n2.2 Carry-out\nmeasurements\nand\ncalculations\n\n Read\na. Measurements\n- Linear measurement\n- Geometrical measurement\nb. Trade Mathematics\n- Unit conversion\n- Ratio and proportion\n- Area\n Interpret formulas for volume, areas, perimeters of plane\nand geometric figures\n Perform measurement\n Compute measurement formulas\n\n Lecture\n Group\ndiscussion\n Problem\nanalysis\n\n Written\nexamination\n Oral evaluation\n Problem solving\n\n4 hours\n2.3 Maintain\n