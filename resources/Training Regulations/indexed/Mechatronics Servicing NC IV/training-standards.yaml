ery\n shall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized\nindustry\nsector;\n(Learning\nsystem\nis\ndriven\nby\ncompetencies written to industry standards)\n\nb. Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude\ninto account but requires evidence of actual performance of the\ncompetency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1.\nInstitution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of\nthe DTS Law and the TESDA Guidelines on the DTP;\n\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as laboratory\nor field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n--- PDF PAGE 97 ---\nTR – Mechatronics Servicing NC IV (Amended) Promulgated Dec. 16, 2015 93\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the\nfollowing requirements:\n\n•\nHolder of Mechatronics Servicing NC III\n\nThis list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may\nbe required of the trainees by the school or training center delivering the\nTVET program.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training\nof\n25 trainees for Mechatronics Servicing NC IV:\n\nTOOLS\nEQUIPMENT\nMATERIAL\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n10 pcs\nLong-nosed pliers\n5 sets\nPLC system\n1 spool\nSolder lead\n10 pcs\nStandard\nscrewdrivers\n5 sets\nPLC configuration\nsoftware\n1 spool\nShielded cable\n10 pcs\nDiagonal cutters\n10 pcs\nMultimeters\n1 lot\nTerminal lugs\n10 pcs\nPhillips\nscrewdrivers\n5 pcs\nRegulated power\nsupplies\n1 lot\nTerminal\nstrips/blocks\n10 pcs\nElectrical pliers\n4 sets\nHMI panel\n10 pcs\nCotton gloves\n10 pcs\nSoldering iron\n4 sets\nHMI software\n1 lot\nPlastic tubing\n5 sets\nPrecision\nscrewdrivers\n2 pcs\nTransmitters or\nTransducers\n1 lot\nQuick-connect\nfittings\n10 pcs\nAdjustable wrench\n1 pc.\nAir compressor\n10 rolls\nElectrical tape\n5 pcs\nWire stripper\n2 pcs\nSignal generators\n1 lot\nWire markers\n5 pcs\nCrimping tool\n20 pcs\nCylinder Actuator\n1 lot\nCable ties\n5 sets\nAllen wrench\n1 pc.\nStepper motor\n\n2 pc.\nVariable frequency\ndrive\n\n1 pc.\nServomotor\n10 pcs\nBuzzers\n\n25 pcs\nIndustrial panel\nswitches\n\n10 pcs\nIndicating lamps\n\n10 pcs\nDirectional 