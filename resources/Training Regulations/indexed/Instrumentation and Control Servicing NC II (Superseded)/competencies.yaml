        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetency\nAssessment require evidence that the candidate:\n1.1.\ninterpreted work instructions according to job\nrequirements.\n1.2.\ninstalled Instrumentation & Control devices in\naccordance with technical requirements.\n1.3.\nconducted tests accurately on the devices using\nstandard procedures\n1.4.\ndocumented the tasks undertaken\n2. Underpinning\nknowledge\nInclude but not limited to:\n2.1.\nOccupational health and safety\n2.2.\nInstrumentation & Control standards\n2.3.\nUse of tools\n2.4.\nMathematical calculations\n2.5.\nElectrical theory\n2.6.\nElectronics theory\n2.7.\nUse of test equipment and calibrators\n2.8.\nWiring techniques\n2.9.\nDrawing interpretation\n2.10. Soldering techniques\n2.11. Principles of Instrumentation\n2.12. Process variable measurements (pressure, level, flow,\ntemperature, analysis, etc.)\n2.13. Process Control Theory\n2.14. Process Control System ( single-loop & multi-loop\ncontrollers, DCS, DAS, SCADA, etc)\n2.15. Sensors, transmitters, transducers & converters\n2.16. Programmable logic controllers\n2.17. Control valves and final control elements\n3. Underpinning\nskills\n3.1.\nReading skills required to interpret work instructions\n3.2.\nCommunication skills needed to interpret and define\nwork procedures\n3.3.\nSelection & use of proper tools & equipment\n3.4.\nInstallation skills\n3.5.\nProblem solving in unplanned events\n\n--- PDF PAGE 39 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 37\n\n4. Method of\nassessment\n4.1.\nThe assessor may select at least three of the following\nassessment methods to objectively assess the\ncandidate:\n4.1.1. Observation\n4.1.2. Demonstration\n4.1.3. Questioning\n4.1.4. Third Party\n4.1.5. Portfolio\n5. Resource\nImplication\nInclude but not limited to:\n5.1.\nInstrumentation & Control devices\n5.2.\nTools\n5.3.\nTest equipment and calibrators\n5.4.\nMaterials\n5.5.\nPPE\n5.6.\nTechnical manuals\n5.7.\nInstrumentation & Control drawings\n6. Context of\nAssessment\n6.1.\nAssessment may be conducted in the workplace or in a\nsimulated work environment\n\n--- PDF PAGE 40 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 38\n\nUNIT TITLE\n:\nCALIBRATE INSTRUMENTATION AND CONTROL\nDEVICES\nUNIT CODE\n:"
        },
        "source_text": "ELC724301\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes necessary\nto install instrumentation and control devices.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized Bold terms are elaborated in the Range of Variables\n1. Interpret work instructions\n1.1.\nWork instructions are read and interpreted to\ndetermine job requirements.\n1.2.\nTools, equipment and testing devices\nneeded to carry out the installation work are\nselected in accordance with established\nprocedures and checked for correct operation\nand safety.\n1.3.\nMaterials necessary to complete the work are\nobtained in accordance with job requirements.\n\n2. Install instrumentation\nand control devices\n2.1.\nAppropriate personal protective equipment is\nworn in line with standard operating\nprocedures.\n2.2.\nOH & S policies and procedures for\ninstallation are followed in line with the\nrequirements.\n2.3.\nInstrumentation and Control standards are\nfollowed in line with the job requirements.\n2.4.\nDevices are installed in accordance with\nmanufacturer’s instructions, requirements, and\nwithout damage to the surrounding place or\nenvironment\n2.5.\nUnplanned events or conditions are responded\nto in accordance with established procedures\n\n3. Test installed\ninstrumentation and\ncontrol devices\n3.1.\nDevices are tested in accordance with standard\nprocedures.\n3.2.\nFinal inspections are undertaken to ensure that\nthe installed devices conforms to technical\nrequirements.\n3.3.\nWork site is cleaned and cleared of all debris\nand left safe in accordance with the company\nrequirements\n3.4.\nReport on installation and testing of equipment\nis prepared according to company’s\nprocedures/policies.\n\n--- PDF PAGE 36 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 34\n\nRANGE OF VARIABLES\n\nVariable\nRange\n1. Tools\nTools for: cutting, shaping, drilling, threading, tapping,\nfinishing, dismantling/assembling. Tool set includes but not\nlimited to:\n1.1.\nPliers (assorted)\n1.2.\nScrew drivers (assorted)\n1.3.\nSoldering iron/gun\n1.4.\nWrenches\n2. Equipment/testing\ndevices\n2.1.\nEquipment includes but not limited to:\n2.1.1. Communication equipment\ne.g., 2-way radio, cell phone\n2.1.2. Lifting equipment\n2.1.3. Fastening equipment\n2.2.\nTesting devices includes but not limited to:\n2.2.1. Multimeter\n2.2.2. Calibrators\n3. Materials\nInclude but not limited to:\n3.1.\nWires and cables\n3.2.\nPipes/tubes & fittings\n3.3.\nSealing materials\n3.4.\nFasteners\n4. Personal protective\nequipment\nInclude but not limited to:\n4.1.\nEar muffs/plugs\n4.2.\nGoggles/glasses/face shield\n4.3.\nSafety hat\n4.4.\nSafety apparel/suit\n4.5.\nSafety belt/harness\n4.6.\nSafety shoes\n4.7.\nMask\n4.8.\nGloves\n5. OH & S policies and\nprocedures\n5.1.\nOH & S guidelines\n5.2.\nPhilippine environmental standards\n\n--- PDF PAGE 37 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 35\n\n6. Instrumentation and\nControl Standards\nIncludes but not limited to:\n6.1.\nISA (Instrumentation, Systems and Automation)\nSociety (formerly Instrument Society of America)\n6.2.\nANSI(American National Standards Institute)\n6.3.\nASME (American Society of Mechanical Engineers)\n6.4.\nNEC (National Electrical Code)\n6.5.\nIEC (International Electrotechnical Commission)\n7. Devices\nInclude but not limited to:\n7.1.\nSensors/Transmitters/Transducers\n7.2.\nIndicators\n7.3.\nControllers\n7.4.\nControl valves\n7.5.\nActuators\n7.6.\nRecorders\n7.7.\nAnnunciators\n7.8.\nProcess switches\n\n--- PDF PAGE 38 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 36\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment require evidence that the candidate:\n1.1.\ninterpreted work instructions according to job\nrequirements.\n1.2.\ninstalled Instrumentation & Control devices in\naccordance with technical requirements.\n1.3.\nconducted tests accurately on the devices using\nstandard procedures\n1.4.\ndocumented the tasks undertaken\n2. Underpinning\nknowledge\nInclude but not limited to:\n2.1.\nOccupational health and safety\n2.2.\nInstrumentation & Control standards\n2.3.\nUse of tools\n2.4.\nMathematical calculations\n2.5.\nElectrical theory\n2.6.\nElectronics theory\n2.7.\nUse of test equipment and calibrators\n2.8.\nWiring techniques\n2.9.\nDrawing interpretation\n2.10. Soldering techniques\n2.11. Principles of Instrumentation\n2.12. Process variable measurements (pressure, level, flow,\ntemperature, analysis, etc.)\n2.13. Process Control Theory\n2.14. Process Control System ( single-loop & multi-loop\ncontrollers, DCS, DAS, SCADA, etc)\n2.15. Sensors, transmitters, transducers & converters\n2.16. Programmable logic controllers\n2.17. Control valves and final control elements\n3. Underpinning\nskills\n3.1.\nReading skills required to interpret work instructions\n3.2.\nCommunication skills needed to interpret and define\nwork procedures\n3.3.\nSelection & use of proper tools & equipment\n3.4.\nInstallation skills\n3.5.\nProblem solving in unplanned events\n\n--- PDF PAGE 39 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 37\n\n4. Method of\nassessment\n4.1.\nThe assessor may select at least three of the following\nassessment methods to objectively assess the\ncandidate:\n4.1.1. Observation\n4.1.2. Demonstration\n4.1.3. Questioning\n4.1.4. Third Party\n4.1.5. Portfolio\n5. Resource\nImplication\nInclude but not limited to:\n5.1.\nInstrumentation & Control devices\n5.2.\nTools\n5.3.\nTest equipment and calibrators\n5.4.\nMaterials\n5.5.\nPPE\n5.6.\nTechnical manuals\n5.7.\nInstrumentation & Control drawings\n6. Context of\nAssessment\n6.1.\nAssessment may be conducted in the workplace or in a\nsimulated work environment\n\n--- PDF PAGE 40 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 38\n\nUNIT TITLE\n:\nCALIBRATE INSTRUMENTATION AND CONTROL\nDEVICES\nUNIT CODE\n:"
