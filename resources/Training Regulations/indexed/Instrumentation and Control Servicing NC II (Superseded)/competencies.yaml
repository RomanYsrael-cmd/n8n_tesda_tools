          "source_text": "1. Plan and prepare \nfor calibration \n1.1. \nCalibration is planned and prepared in line with job \nrequirements. \n1.2. \nOHS policies and procedures are followed in line with \njob requirements. \n1.3. \nInstrumentation and Control standards are followed \nin line with the job requirements. \n1.4. \nInstrumentation and control devices for calibration \nare checked against specifications and requirements. \n1.5. \nMaterials necessary to complete the work are obtained \nin accordance with established procedures and checked \nagainst job requirements. \n1.6. \nTools, equipment and testing devices needed for \ncalibration are obtained and checked for correct \noperation and safety \n1.7. \nInstrumentation and control devices calibrated are \nidentified based on Job/Service Order or instructions \n2. Calibrate \ninstrumentation and \ncontrol devices \n2.1. \nAppropriate personal protective equipment is used \nbased on OHS policies and procedures. \n2.2. \nNormal functions of devices are checked in accordance \nwith manufacturer’s instructions & standard procedures. \n2.3. \nFault/s or problem/s in the device is/are diagnosed in \nline with the standard operating procedures. \n2.4. \nInstrumentation and control devices are calibrated in \nline with the standard operating procedures. \n2.5. \nUnplanned events or conditions are responded to in \naccordance with established procedures \n3. Inspect and test \ncalibrated \ninstrumentation and \ncontrol devices \n3.1. \nFinal inspections are undertaken to ensure that the \ncalibration done on the device conforms with the \nmanufacturer’s instruction/manual \n3.2. \nInstrumentation and control devices are checked and \ntested based on safety procedures. \n3.3. \nReport is prepared/completed according to company \nrequirements\n\n--- PDF PAGE 41 ---\n--------------------------------------------------------------------------------------------------------------------------------------------------------