andidate:\n4.1.1. Observation\n4.1.2. Oral Questioning\n4.1.3. Practical demonstration\n5. Resource implication\n5.1. Tools for measuring, cutting, drilling,\nassembling/disassembling, connecting. Tool set\nincludes the following but not limited to:\n5.1.1. screw drivers\n5.1.2. pliers\n5.1.3. cutters\n6. Context of Assessment\n6.1. Assessment may be conducted in the workplace or\nin a simulated work environment\n\n--- PDF PAGE 35 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 33\n\nCORE COMPETENCIES\n\nUNIT TITLE\n:\nINSTALL INSTRUMENTATION AND CONTROL DEVICES\nUNIT CODE\n:"
