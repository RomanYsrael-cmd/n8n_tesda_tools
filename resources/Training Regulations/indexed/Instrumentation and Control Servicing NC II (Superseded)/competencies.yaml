\nline with the standard operating procedures. \n2.5. \nUnplanned events or conditions are responded to in \naccordance with established procedures\n3. Inspect and test \nconfigured \ninstrumentation and \ncontrol devices \n3.1. \nFinal inspections are undertaken to ensure that the \nconfiguration done on the devices conforms with the \nmanufacturer’s instruction/manual \n3.2. \nInstrumentation and control devices are checked to \nensure safe operation. \n3.3. \nReport is prepared/completed according to company \nrequirements.\n\n--- PDF PAGE 45 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II \n \n \n \n        Page 43  \n \n \n       \n \n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. OH & S policies and \nprocedures\n1.1. \nOH & S guidelines \n1.2. \nPhilippine environmental standards \n2. Instrumentation and \nControl Standards \nInclude but not limited to: \n2.1. \nISA (Instrumentation, Systems and Automation) Society \n(formerly Instrument Society of America) \n2.2. \nANSI (American National Standards Institute) \n2.3. \nASME (American Society of Mechanical Engineers) \n2.4. \nNEC (National Electrical Code) \n2.5.\nIEC (International Electrotechnical Commission)\n3. Instrumentation and \nControl Devices \nInclude but not limited to: \n3.1. \nSensors/Transmitters/ \nTransducers \n3.2. \nIndicators \n3.3. \nControllers \n3.4. \nControl valves \n \n3.5. \nActuators \n3.6. \nRecorders \n3.7. \nAnnunciators \n3.8. \nProcess switches \n4. Materials \nInclude but not limited to: \n4.1. \nConnectors \n4.2. \nAdaptors \n4.3. \nWires and cables \n4.4. \nAppropriate softwares \n4.5.\nComputer storage media\n5. Tools \nTool set dismantling/assembling include but not limited to: \n5.1. \nPliers (assorted) \n5.2. \nScrew drivers (assorted) \n5.3. \nSoldering iron/gun \n5.4.\nWrenches\n6. Equipment/testing \ndevices \n6.1. \nEquipment include but not limited to: \n6.1.1. Configurator or programmer \n6.1.2. Computer  \n6.2. \nTesting devices includes but not limited to: \n6.2.1. Multimeter \n6.2.2. Calibrators \n6.2.3. Signal generator \n6.2.4. Oscilloscope\n7. Personal protective \nequipment \nInclude but not limited to: \n7.1. \nEar muffs/plugs \n7.2. \nGoggles/glasses/face \nshield \n7.3. \nSafety hat \n7.4. \nSafety apparel/suit \n \n7.5. \nSafety belt/ harness \n7.6. \nSafety shoes  \n7.7. \nMask  \n7.8. \nGloves \n8. Fault/s or problem/s \n8.1. \nmechanical \n8.2. \nelectrical \n8.3. \nelectronics \n8.4. \ncomputer-based\n\n--- PDF PAGE 46 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II \n \n \n \n        Page 44  \n \n \n       \n \n \n \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. \nInterpreted work instructions according to job \nrequirements. \n1.2. \nDiagnosed faults or problems on the devices \n1.3. \nConfigured the identified devices \n1.4. \nChecked configured devices to ensure safety \n1.5.\nDocumented the tasks undertaken\n2. Underpinning \nknowledge \nInclude but not limited to: \n2.1. \nOccupational health and safety \n2.2. \nInstrumentation & Control standards \n2.3. \nUse of tools \n2.4. \nMathematical calculations \n2.5. \nElectrical theory \n2.6. \nElectronics theory \n2.7. \nUse of test equipment and calibrators \n2.8. \nWiring techniques \n2.9. \nDrawing interpretation \n2.10. Soldering techniques \n2.11. Principles of Instrumentation \n2.12. Process variable measurements (pressure, level, \nflow, temperature, analysis, etc.) \n2.13. Process Control Theory \n2.14. Process Control System (single-loop & multi-loop \ncontrollers, DCS, DAS, SCADA, etc) \n2.15. Sensors, transmitters, transducers & converters \n2.16. Programmable logic controllers \n2.17. Control valves and final control elements \n2.18. Computer operations\n3. Underpinning skills \n3.1. \nReading skills required to interpret work instructions \n3.2. \nCommunication skills needed to interpret and define \nwork procedures \n3.3. \nSelection & use of proper tools & equipment \n3.4. \nConfiguration skills  \n3.5.\nProblem solving in unplanned events\n4. Method of \nassessment \n4.1. \nThe assessor may select at least three of the \nfollowing assessment methods to objectively assess \nthe candidate: \n4.1.1. Observation \n4.1.2. Demonstration \n4.1.3. Questioning \n4.1.4. Third Party \n4.1.5. Portfolio\n\n--- PDF PAGE 47 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ \nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II \n \n \n \n        Page 45  \n \n \n       \n \n \n \n \n \n \n \n5. Resource Implication \nInclude but not limited to: \n5.1. \nInstrumentation & Control devices \n5.2. \nTools  \n5.3. \nTest equipment and calibrators \n5.4. \nMaterials  \n5.5. \nPPE \n5.6. \nTechnical manuals \n5.7.\nInstrumentation & Control drawings\n6. Context of \nAssessment \n6.1. \nAssessment may be conducted in the workplace or \nin a simulated work environment\n",
