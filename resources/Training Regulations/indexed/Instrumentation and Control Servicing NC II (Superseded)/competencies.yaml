          "source_text": "1. Plan and prepare \nfor configuration \n1.1. \nConfiguration is planned and prepared in line with job \nrequirements. \n1.2. \nOHS policies and procedures are followed in line \nwith job requirements. \n1.3. \nInstrumentation and Control standards are \nfollowed in line with the job requirements \n1.4. \nInstrumentation and control devices for \nconfiguration are checked against specifications and \nrequirements. \n1.5. \nMaterials necessary to complete the work are \nobtained in accordance with established procedures \nand checked against job requirements. \n1.6. \nTools, equipment and testing devices needed for \nconfiguration of the instrumentation and control \ndevices are obtained and checked for correct \noperation and safety \n1.7. \nInstrumentation and control devices configured are \nidentified based on the Job/Service Order or \ninstructions\n2. Configure \ninstrumentation and \ncontrol devices \n2.1. \nAppropriate personal protective equipment is used \nand OHS policies and procedures are followed \n2.2. \nNormal function of systems and components is \nchecked in accordance with manufacturer’s \ninstructions \n2.3. \nFault/s or problem/s in the device are diagnosed in \nline with the standard operating procedures. \n2.4. \nInstrumentation and control devices are configured in \nline with the standard operating procedures. \n2.5. \nUnplanned events or conditions are responded to in \naccordance with established procedures\n3. Inspect and test \nconfigured \ninstrumentation and \ncontrol devices \n3.1. \nFinal inspections are undertaken to ensure that the \nconfiguration done on the devices conforms with the \nmanufacturer’s instruction/manual \n3.2. \nInstrumentation and control devices are checked to \nensure safe operation. \n3.3. \nReport is prepared/completed according to company \nrequirements.\n\n--- PDF PAGE 45 ---\n-----------------------------------------------------------------------------------------------------------