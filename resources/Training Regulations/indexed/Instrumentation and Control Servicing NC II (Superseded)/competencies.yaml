ference\n2.6. Length\n2.7. Thickness\n2.8. Outside diameter\n2.9. Taper\n2.10. Out of roundness\n\n--- PDF PAGE 22 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 20\n\nEVIDENCE GUIDE\n\n1. Critical aspect of competency\nAssessment requires evidence that the candidate:\n1.1. selected proper measuring instruments\naccording to tasks\n1.2. carried out measurement and calculations\n1.3. maintained and stores instruments\n2. Underpinning knowledge\n2.1. Types of measuring instruments and their\nuses\n2.2. Safe handling procedures in using\nmeasuring instruments\n2.3. Four fundamental operation of mathematics\n2.4. Formula for volume, area, perimeter and\nother geometric figures\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction\n3.2. Communication skills\n3.3. Handling measuring instruments\n3.4. Performing mathematical calculations using\nthe four fundamental operations\n3.5. Visualizing objects and shapes\n3.6. Interpreting formulae\n4. Method of assessment\nCompetency in this unit must be assessed\nthrough:\n\n4.1. Observation\n4.2. Oral questioning\n5. Resource implication\n5.1. Place of assessment\n5.2. Measuring instruments\n5.3. Straight edge\n5.4. Torque gauge\n5.5. Try square\n5.6. Protractor\n5.7. Combination gauge\n5.8. Steel rule\n6. Context of Assessment\n6.1. Assessment may be conducted in the\nworkplace or in a simulated work\nenvironment\n\n--- PDF PAGE 23 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 21\n\nUNIT TITLE\n:\nPREPARE AND INTERPRET TECHNICAL DRAWING\nUNIT CODE\n:"
