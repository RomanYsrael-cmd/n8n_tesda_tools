        "source_text": "ELC724302\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes needed to\ncalibrate instrumentation and control devices.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized Bold items are elaborated in the range of Variables\n1. Plan and prepare\nfor calibration\n1.1.\nCalibration is planned and prepared in line with job\nrequirements.\n1.2.\nOHS policies and procedures are followed in line with\njob requirements.\n1.3.\nInstrumentation and Control standards are followed\nin line with the job requirements.\n1.4.\nInstrumentation and control devices for calibration\nare checked against specifications and requirements.\n1.5.\nMaterials necessary to complete the work are obtained\nin accordance with established procedures and checked\nagainst job requirements.\n1.6.\nTools, equipment and testing devices needed for\ncalibration are obtained and checked for correct\noperation and safety\n1.7.\nInstrumentation and control devices calibrated are\nidentified based on Job/Service Order or instructions\n2. Calibrate\ninstrumentation and\ncontrol devices\n2.1.\nAppropriate personal protective equipment is used\nbased on OHS policies and procedures.\n2.2.\nNormal functions of devices are checked in accordance\nwith manufacturer’s instructions & standard procedures.\n2.3.\nFault/s or problem/s in the device is/are diagnosed in\nline with the standard operating procedures.\n2.4.\nInstrumentation and control devices are calibrated in\nline with the standard operating procedures.\n2.5.\nUnplanned events or conditions are responded to in\naccordance with established procedures\n3. Inspect and test\ncalibrated\ninstrumentation and\ncontrol devices\n3.1.\nFinal inspections are undertaken to ensure that the\ncalibration done on the device conforms with the\nmanufacturer’s instruction/manual\n3.2.\nInstrumentation and control devices are checked and\ntested based on safety procedures.\n3.3.\nReport is prepared/completed according to company\nrequirements\n\n--- PDF PAGE 41 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 39\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OH & S policies and\nprocedures\n1.1.\nOH & S guidelines\n1.2.\nPhilippine environmental standards\n2. Instrumentation and\nControl Standards\nInclude but not limited to:\n2.1.\nISA (Instrumentation, Systems and Automation) Society\n(formerly Instrument Society of America)\n2.2.\nANSI (American National Standards Institute)\n2.3.\nASME (American Society of Mechanical Engineers)\n2.4.\nNEC (National Electric Code)\n2.5 IEC (International Electrotechnical Commission)\n3. Instrumentation and\nControl Devices\nInclude but not limited to:\n3.1.\nSensors/Transmitters/Trans\nducers\n3.2.\nIndicators\n3.3.\nControllers\n3.4.\nControl valves\n\n3.5.\nActuators\n3.6.\nRecorders\n3.7.\nAnnunciators\n3.8.\nProcess switches\n4. Tools\nTool set for dismantling/assembling include but not limited to:\n4.1.\nPliers (assorted)\n4.2.\nScrew drivers (assorted)\n4.3.\nSoldering iron/gun\n4.4.\nWrenches\n5. Equipment/testing\ndevices\n5.1.\nEquipment include but not limited to:\n5.1.1. Calibration bench\n5.1.2. Instrument air supply equipment\n5.1.3. Power supply equipment\n5.2.\nTesting devices include but not limited to:\n5.2.1. Multimeter\n5.2.2. Calibrators, configurator or programmer\n5.2.3. Signal generator\n5.2.4. Oscilloscope\n6. Materials\nInclude but not limited to:\n6.1.\nWires and cables\n6.2.\nSealing materials\n6.3.\nPipes/tubes & fittings\n7. Personal protective\nequipment\nInclude but not limited to:\n7.1.\nEar muffs/plugs\n7.2.\nGoggles/glasses/face\nshield\n7.3.\nSafety hat\n7.4.\nSafety apparel/suit\n7.5.\nSafety belt/harness\n7.6.\nSafety shoes\n7.7.\nMask\n7.8.\nGloves\n8. Fault/s or problem/s\n8.1.\nmechanical\n8.2.\nelectrical\n8.3.\nelectronics\n8.4.\ncomputer-based\n\n--- PDF PAGE 42 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 40\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate :\n1.1.\nInterpreted work instructions according to job\nrequirements.\n1.2.\nDiagnosed faults or problems on the devices\n1.3.\nCalibrated identified devices\n1.4.\nChecked calibrated devices to ensure safety\n1.5.\nDocumented the tasks undertaken\n2. Underpinning\nknowledge\nInclude but not limited to:\n2.1.\nOccupational health and safety\n2.2.\nInstrumentation & Control standards\n2.3.\nUse of tools\n2.4.\nMathematical calculations\n2.5.\nElectrical theory\n2.6.\nElectronics theory\n2.7.\nUse of test equipment and calibrators\n2.8.\nWiring techniques\n2.9.\nDrawing interpretation\n2.10. Soldering techniques\n2.11. Principles of Instrumentation\n2.12. Process variable measurements (pressure, level,\nflow, temperature, analysis, etc.)\n2.13. Process Control Theory\n2.14. Process Control System (single-loop & multi-loop\ncontrollers, DCS, DAS, SCADA, etc)\n2.15. Sensors, transmitters, transducers & converters\n2.16. Programmable logic controllers\n2.17. Control valves and final control elements\n2.18. Computer operations\n3. Underpinning skills\n3.1.\nReading skills required to interpret work instructions\n3.2.\nCommunication skills needed to interpret and define\nwork procedures\n3.3.\nSelection & use of proper tools & equipment\n3.4.\nCalibration skills\n3.5.\nProblem solving in unplanned events\n4. Method of assessment\n4.1.\nThe assessor may select at least three of the\nfollowing assessment methods to objectively assess\nthe candidate:\n4.1.1. Observation\n4.1.2. Demonstration\n4.1.3. Questioning\n4.1.4. Third Party\n4.1.5. Portfolio\n\n--- PDF PAGE 43 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 41\n\n5. Resource Implication\nInclude but not limited to:\n5.1.\nInstrumentation & Control devices\n5.2.\nTools\n5.3.\nTest equipment and calibrators\n5.4.\nMaterials\n5.5.\nPPE\n5.6.\nTechnical manuals\n5.7.\nInstrumentation & Control drawings\n6. Context of\nAssessment\n6.1.\nAssessment may be conducted in the workplace or\nin a simulated work environment\n\n--- PDF PAGE 44 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 42\n\nUNIT TITLE\n:\nCONFIGURE INSTRUMENTATION AND CONTROL\nDEVICES\nUNIT CODE\n:"
