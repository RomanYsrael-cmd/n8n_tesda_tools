olving interpretation of a\nrange of technical drawings\n4.2. Oral questioning\n5. Resource implication\n5.1. Drawings\n5.2. Diagrams\n5.3. Charts\n5.4. Plans\n6. Context of Assessment\nAssessment may be conducted in the workplace or in a\nsimulated work environment\n\n--- PDF PAGE 26 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 24\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\nUNIT CODE\n:"
