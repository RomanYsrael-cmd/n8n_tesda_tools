    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: Instrumentation & Control Servicing\nNC Level: NC II\n\nNominal Training Duration:\n 18 hrs – Basic Competencies\n\n 60 hrs – Common Competencies\n\n160 hrs – Core Competencies\n\n-----------\n\n238 hrs\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\nan instrumentation and control technician in accordance with industry standards. It covers\nthe basic & common competencies in addition to the core competencies such as installing,\ncalibrating & configuring instrumentation & control devices.\n\nBASIC COMPETENCIES\n18 hrs\n\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\n related documents.\n1.3 Participate in workplace\n meeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\n member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\n and safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 49 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 47\n\nCOMMON COMPETENCIES\n60 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Apply Quality\nStandards\n\n1.1 Asses quality of received\nmaterials\n1.2 Assess own work\n1.3 Engage in quality\nimprovement\n\n Field trip\n Symposium\n Film showing\n Simulation\n On the job\ntraining\n\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party\nreport\n\n2. Perform\nComputer\nOperation\n\n2.1 Set-up workstation\n2.2 Prepare storage media\n2.3 Work with files and objects\n2.4 Manipulate word\nprocessing software\n2.5 Manipulate spreadsheet\nsoftware\n2.6 Manipulate customize and\ndatabase applications\n2.7 Utilize the internet\n2.8 Maintain computer\nhardware and software\n\n Modular\n Film showing\n Computer\nbased training\n(e-learning)\n Project method\n On the job\ntraining\n\n Demonstration &\nquestioning\n Observation &\nquestioning\n Third party\nreport\n Assessment of\noutput product\n Portfolio\n Computer-\nbased\nassessment\n\n3.\nUse Hand\nTools\n\n3.1 Identify, explain and apply\nthe use of different types\nof hand tools\n3.2 Perform basic\nmaintenance and proper\nstorage of hand tools\naccording to the standard\noperating procedures\n3.3 Document and record the\nsequence of events in safe\nkeeping hand tools.\n\n Lecture /\nDemonstration\n Distance\neducation\n Film Showing\n\n Written/Oral\nexamination\n Practical\ndemonstration\n\n4.\nPerform\nMensurations\nand\nCalculation\n\n4.1 Select measuring\ninstruments;\n\n4.2 Carry-out measurements\nand calculations;\n\n Self- paced/\nmodular\n Demonstration\n Small group\ndiscussion\n Distance\neducation\n\n Written/Oral\nexamination\n Practical\ndemonstration\n\n--- PDF PAGE 50 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 48\n\n5.\nInterpret\nTechnical\nDrawings\nAnd Plans\n\n5.1 Select and interpret\ntechnical drawing\n5.2 Perform freehand\nsketching\n\n Lecture/\ndemonstration\n Dualized\n Distance\nlearning\n\n Written /oral\n examinations\n Direct\n observation\n Project method\ninterview\n\n6.\nTerminate\nand Connect\nElectrical\nwiring and\nElectronic\nCircuit\n\n6.1 Terminate or join non-\nsoldered connections\n6.2 Terminate or join soldered\nconnections\n\n Film Viewing\n Individualized\nLearning\n Direct Student\nLaboratory\nExperience\n On the Job\nTraining\n Project\n Method\n\n Demonstration\nand Questioning\n Assessment of\nOutput Product\n\n--- PDF PAGE 51 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 49\n\nCORE COMPETENCIES\n160 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Install\nInstrumentation\n& Control\nDevices\n1.1 Read & interpret work\n instructions according to job\n requirements.\n\n Lecture\n Discussion\n Demonstration\n Viewing\nmultimedia\n\n Written exam\n Practical exam\n1.2 Identify the tools, equipment,\n testing devices, & materials\n needed for installation.\n1.3 Identify the PPE & OHS\n policies & procedures\n required for the installation\n job.\n1.4 Install Instrumentation &\n control devices according to\n technical requirements &\n standards\n1.5 Conduct functional test\n procedure of the installed\n Instrumentation & Control\n devices\n1.6 Prepare an installation &\n testing report\n\n2. Calibrate\nInstrumentation\n& Control\nDevices\n2.1 Read & interpret work\n instructions according to the\n calibration job.\n\n Lecture\n Discussion\n Demonstration\n Viewing\nmultimedia\n\n Written exam\n Practical exam\n Observation in\nworkplace\n2.2 Identify the tools, equipment,\n testing devices, & materials\n needed for calibration.\n2.3 Identify the PPE & OHS\n policies & procedures\n required for the calibration\n job.\n2.4 Calibrate Instrumentation &\n control devices according to\n technical requirements &\n standards\n2.5 Conduct tests to determine\n normal functionality & to\n insure safe operation.\n2.5 Prepare a calibration &\n testing report\n\n--- PDF PAGE 52 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 50\n\n3. Configure\nInstrumentation\n& Control\nDevices\n2.1 Read & interpret work\n instructions according to the\n configuration job.\n\n Lecture\n Discussion\n Demonstration\n Viewing\nmultimedia\n\n Written exam\n Practical exam\n Observation in\nworkplace\n2.2 Identify the tools, equipment,\n testing devices, & materials\n needed for configuration.\n2.3 Identify the PPE & OHS\n policies & procedures\n required for the configuration\n job.\n2.4 Configure Instrumentation &\n control devices according to\n technical requirements &\n standards\n2.5 Conduct tests to determine\n normal functionality & to\n insure safe operation.\n2.6 Prepare a configuration &\n testing report"
