  "source_text": "SECTION 4: NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Instrumentation and Control Servicing\nNC II, the candidate must demonstrate in all the units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate II signed by\nthe TESDA Director General.\n4.2\nThe qualification of Instrumentation and Control Servicing NC II may be\nattained through:\n4.2.1\nAccumulation of Certificates of Competency (COCs) in all the\nfollowing units of competencies:\n4.2.1.1\nInstall Instrumentation and Control Devices\n4.2.1.2\nCalibrate Instrumentation and Control Devices\n4.2.1.3\nConfigure Instrumentation and Control Devices\n\nSuccessful candidates shall be awarded a Certificate of\nCompetency (COC) in each of the core units.\n4.2.2\nDemonstration of competence through project-type assessment\ncovering all the units required in the qualification.\n\n4.3\nAccumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.4\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.5\nThe following are qualified to apply for assessment and certification:\n\n4.5.1.\nGraduate of formal, non-formal, and informal including enterprise-\nbased training programs.\n\n4.5.2.\nExperienced workers (wage employed or self employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n.\n\n--- PDF PAGE 57 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS – INSTRUMENTATION AND CONTROL SERVICING NC II\n\n Page 55\n\n"
}
