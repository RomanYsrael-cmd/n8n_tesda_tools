        "source_text": "CON712329\nUNIT DESCRIPTOR :\nThis unit deals with the knowledge, skills and\nattitudes in the measurement of area to be painted,\ncomputation and estimates of painting requirements\n(materials).\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Measure and compute the\nsurface area\n1.1 Plans and specifications are interpreted in\n accordance with job requirements\n1.2 Surface area is measured and computed in\n accordance with job requirements\n1.3 Computed surface area is reported to\n immediate supervisor in accordance with job\n requirements\n2. Compute painting\nrequirements\n\n2.1 Painting materials are computed in\n accordance with job requirements\n2.2 Tools and equipment are identified and\n selected in accordance with job requirements\n2.3 Estimates are prepared and submitted to\n immediate supervisor in accordance with job\n requirements\n\n--- PDF PAGE 60 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n58\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Painting materials\n\nMay include but are not limited to:\n1.1 Water base paint\n1.2 Lacquer base paint\n1.3 Oil base paint\n1.4 Filler compound\n1.5 Tinting/Acri color\n1.6 Sand paper\n1.7 Rags\n1.8 Solvent/thinner\n1.9 Masking tape\n1.10 Epoxy\n2. Tools and equipment\n\nIncluding but not limited to:\n2.1 Lifeline and anchorage\n2.2 Spray/Mortar gun\n2.3 Air compressor\n2.4 Scaffolds\n2.5 Ladder\n2.6 Appropriate PPE\n3. Estimates\nMay include but are not limited to:\n3.1 Bill of materials\n3.2 Tools and equipment\n3.3 Man-hour requirements\n\n--- PDF PAGE 61 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n59\nEVIDENCE GUIDE\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted plans and specifications in accordance with job\