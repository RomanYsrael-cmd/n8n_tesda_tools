ulations. \n4.4  Unexpected situations are dealt with in line with \n       company rules and regulations.\n\n--- PDF PAGE 55 ---\n_____________________________________________________________________________________________ \nTR CONSTRUCTION PAINTING NC III                                                                                                                                                              \n53\nRANGE OF VARIABLES \nVARIABLES \nRANGE \n1.  Tools and equipment \nMay include but not limited to: \n1.1 Paint brushes \n1.2 Scraper \n1.3 Chisel \n1.4 Paint roller \n1.5 Masking tape \n1.6 Spatula \n1.7 Mixing stick  \n1.8 Rags \n1.9 Putty knife \n1.10 Lifeline and anchorage \n1.11 Roller brush \n1.12 Spray/Mortar gun \n1.14 Air compressor \n1.15 Steel brush or Cap brush \n2.  Paint coat materials \n2.1 Sand paper \n2.2 Base coat materials \n       2.2.1 Metal primer \n           2.2.2 Wood primer \n           2.2.3 Concrete sealer \n2.3 Enamel paint (flat, gloss, semi-gloss) \n2.4 Elastromeric/ Latex paint \n2.5 Tinting/ Acri-color paint \n2.6 Paint/ Lacquer thinner and water  \n2.7 Empty cans \n2.8 Rust converter for rusted surfaces \n2.9 Patching compound (Putty, decalite/ \ncalsomine powder) \n2.10 Top/ Intermediate/Finishing coat  \n2.11 Concrete neutralizer \n3. PPE \nIncludes but not limited to: \n3.1 Gloves \n3.2 Dust mask \n3.3 Safety shoes \n3.4 Hard hat \n3.5 Respirator \n3.6 Belt/body harness \n3.7 Goggles \n3.8 Working clothes\n\n--- PDF PAGE 56 ---\n_____________________________________________________________________________________________ \nTR CONSTRUCTION PAINTING NC III                                                                                                                                                              \n54"
