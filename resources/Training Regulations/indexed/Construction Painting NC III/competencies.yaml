          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Evaluated and examined existing paints according job\n requirements/owner specifications\n1.2 Detected the cause of defects through observation of the old\n paint and familiarity with the locality environment\n1.3 Recommended corrective measures based on the nature and\n type of defects\n1.4 Applied and sanded final topcoats according to standard\n procedures\n1.5 Demonstrated compliance with safety regulations applicable to\nworksite operations\n1.6 Selected materials, tools and equipment in accordance with\n specifications and job requirements.\n1.7 Identified faults and problems that occur and take necessary\n action to rectify\n1.8 Communicated interactively with others where applicable to\n ensure safe and effective work operations\n2. Underpinning\nKnowledge\n2.1 Safety and maintenance\n 2.1.1 Hazards\n 2.1.2 Safety rules and regulations\n 2.1.4 Fire prevention\n 2.1.5 First aid treatment\n 2.1.6 Proper handling and care of tools and equipment\n 2.1.7 Housekeeping\n2.2 Tools and equipment\n 2.2.1 Types of spray equipment\n 2.2.2 Capacity of compressor\n2.3 Trade Mathematics and mensuration\n 2.3.1 Linear measurements\n 2.3.2 Areas and volume\n2.4 Methods and procedures\n 2.4.1 Color matching\n 2.4.2 Methods of mixing paint\n 2.4.3 Methods of re-painting and/or re-touching application\n 2.5.4 Paint defects and troubleshooting\n3. Underpinning\nSkills\n3.1 Following safety and maintenance procedures\n3.2 Preparing materials and tools\n3.3 Performing re-painting and/or re-touching works\n3.4 Evaluating and examining old paints\n3.5 Applying trade Mathematics and mensuration\n\n--- PDF PAGE 72 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n70\n4. Resource\nImplications\nThings necessary for the conduct of assessment:\n4.1 Workplace location\n4.2 Tools and equipment appropriate to work processes\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n4.5 Appropriate PPE\n5. Methods of\nAssessment\nCompetency in this unit must be assessed:\n5.1 Direct observation of practical demonstration of skills\n5.2 Questions related to underpinning knowledge\n5.3 Portfolio\n5.4 Third party report\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 73 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n71"
        },
        "source_text": "CON712331\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nin preparing for identifying and rectifying defects and\ncarrying-out re-painting and/or re-touching works.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Prepare for re-painting and re-\ntouching works\n\n1.1 Work instruction is secured from appropriate\n personnel according to job requirements.\n1.2 Appropriate PPE are selected and used\n according to OSHA specifications.\n1.3 Existing paints are examined and evaluated\n according to job requirements/owners\n specifications.\n1.4 Materials and tools are selected and prepared\n according to job requirements.\n2. Identify defects and corrective\nmeasures\n\n2.1 Causes of defects are detected through\n observation of the old paint and familiarity with\n the locality environment.\n2.2 Corrective measures are recommended based\n on the nature and type of defects.\n2.3 Report is prepared and completed as to required\n specifications.\n3. Carry-out re-painting and/or\nre-touching\n3.1 Damaged parts are scraped to base of materials\n or substrate and smoothened for spot priming.\n3.2 Surface is spot primed to cover scraped and\n unscraped surfaces.\n3.3 Surface is smoothened, flat and even through\n sanding as per job requirements.\n3.4 Intermediate coats are applied and sanded in\n line with job requirements.\n3.5 Final topcoat is applied in line with standard\n operating procedures and manufacturer’s\n specifications.\n3.6 Proper tool usage is observed in line with\n manufacturer's specifications.\n3.7 Worksite is cleaned and kept in safe state in line\nwith OHSA regulations.\n3.8 Unexpected situations are dealt with in line\nwith company rules and regulations.\n\n--- PDF PAGE 69 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n67\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n4. Complete work\n4.1 Final checks are made to ensure that work\n conforms with job requirements.\n4.2 Completion report is prepared and submitted to\n appropriate officer.\n4.3 Tools, equipment and any surplus resources\n and materials are checked and monitored in\n accordance with established procedures.\n4.4 Work area is monitored as to cleanliness and\n safety.\n\n--- PDF PAGE 70 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n68\n\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Materials\n\nMay include but not limited to:\n1.1 Primer coats\n1.2 Paint finisher\n1.3 Sand paper\n1.4 Intermediate coat\n1.5 Top coat\n1.6 Paint remover\n1.7 Tinting color\n1.8 Rags\n1.9 Masking tapes\n1.10 Solvents/thinners\n1.11 Filler\n2. Tools\n\nMay include but not limited to:\n2.1 Scraper\n2.2 Hammer\n2.3 Paint brush\n2.4 Mixing stick\n2.5 Putty knife\n2.6 Paint roller with pan\n2.7 Spray gun\n2.8 Compressor\n2.9 Spatula\n3. PPE\n\nMay include but not limited to:\n3.1 Gloves\n3.2 Mask/respirator\n3.3 Safety shoes\n3.4 Hard hat\n3.5 Safety belt\n3.6 Goggles\n\n--- PDF PAGE 71 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n69\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Evaluated and examined existing paints according job\n requirements/owner specifications\n1.2 Detected the cause of defects through observation of the old\n paint and familiarity with the locality environment\n1.3 Recommended corrective measures based on the nature and\n type of defects\n1.4 Applied and sanded final topcoats according to standard\n procedures\n1.5 Demonstrated compliance with safety regulations applicable to\nworksite operations\n1.6 Selected materials, tools and equipment in accordance with\n specifications and job requirements.\n1.7 Identified faults and problems that occur and take necessary\n action to rectify\n1.8 Communicated interactively with others where applicable to\n ensure safe and effective work operations\n2. Underpinning\nKnowledge\n2.1 Safety and maintenance\n 2.1.1 Hazards\n 2.1.2 Safety rules and regulations\n 2.1.4 Fire prevention\n 2.1.5 First aid treatment\n 2.1.6 Proper handling and care of tools and equipment\n 2.1.7 Housekeeping\n2.2 Tools and equipment\n 2.2.1 Types of spray equipment\n 2.2.2 Capacity of compressor\n2.3 Trade Mathematics and mensuration\n 2.3.1 Linear measurements\n 2.3.2 Areas and volume\n2.4 Methods and procedures\n 2.4.1 Color matching\n 2.4.2 Methods of mixing paint\n 2.4.3 Methods of re-painting and/or re-touching application\n 2.5.4 Paint defects and troubleshooting\n3. Underpinning\nSkills\n3.1 Following safety and maintenance procedures\n3.2 Preparing materials and tools\n3.3 Performing re-painting and/or re-touching works\n3.4 Evaluating and examining old paints\n3.5 Applying trade Mathematics and mensuration\n\n--- PDF PAGE 72 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n70\n4. Resource\nImplications\nThings necessary for the conduct of assessment:\n4.1 Workplace location\n4.2 Tools and equipment appropriate to work processes\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n4.5 Appropriate PPE\n5. Methods of\nAssessment\nCompetency in this unit must be assessed:\n5.1 Direct observation of practical demonstration of skills\n5.2 Questions related to underpinning knowledge\n5.3 Portfolio\n5.4 Third party report\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 73 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n71"
      }
