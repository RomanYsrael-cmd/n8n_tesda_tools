  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the core units of\ncompetency required for CONSTRUCTION PAINTING NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nLEAD WORKPLACE COMMUNICATION\nUNIT CODE :\n500311109\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired to lead in the dissemination and discussion of\nideas, information and issues in the workplace.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1 Appropriate communication method is selected\n1.2 Multiple operations involving several topics areas are\ncommunicated accordingly\n1.3 Questions are used to gain extra information\n1.4 Correct sources of information are identified\n1.5 Information is selected and organized correctly\n1.6 Verbal and written reporting is undertaken when\nrequired\n1.7 Communication skills are maintained in all situations\n2. Lead workplace\ndiscussions\n2.1 Response to workplace issues are sought\n2.2 Response to workplace issues are provided\nimmediately\n2.3 Constructive contributions are made to workplace\ndiscussions on such issues as production, quality and\nsafety\n2.4 Goals/objectives and action plan undertaken in the\nworkplace are communicated\n3. Identify and\ncommunicate issues\narising in the workplace\n3.1 Issues and problems are identified as they arise\n3.2 Information regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3 Dialogue is initiated with appropriate personnel\n3.4 Communication problems and issues are raised as\nthey arise\n\n--- PDF PAGE 5 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n3\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Methods of communication\n1.1 Non-verbal gestures\n1.2 Verbal\n1.3 Face to face\n1.4 Two-way radio\n1.5 Speaking to groups\n1.6 Using telephone\n1.7 Written\n1.8 Internet\n\n--- PDF PAGE 6 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n4\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Dealt with a range of communication/information at\n one time\n1.2 Made constructive contributions in workplace\n issues\n1.3 Sought workplace issues effectively\n1.4 Responded to workplace issues promptly\n1.5 Presented information clearly and effectively written\n form\n1.6 Used appropriate sources of information\n1.7 Asked appropriate questions\n1.8 Provided accurate information\n2. Underpinning\nknowledge\n2.1 Organization requirements for written and electronic\n communication methods\n2.2 Effective verbal communication methods\n3. Underpinning Skills\n3.1 Organize information\n3.2 Understand and convey intended meaning\n3.3 Participate in variety of workplace discussions\n3.4 Comply with organization requirements for the use of\n written and electronic communication methods\n4. Resource Implications The following resources MUST be provided:\n4.1 Variety of Information\n4.2 Communication tools\n4.3 Simulated workplace\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Competency in this unit must be assessed through\n5.2 Direct Observation\n5.3 Interview\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace or in\n simulated workplace environment\n\n--- PDF PAGE 7 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n5\nUNIT OF COMPETENCY :\nLEAD SMALL TEAMS\nUNIT CODE :\n500311110\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes to\nlead small teams including setting and maintaining team\nand individual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Provide team\nleadership\n1.1 Work requirements are identified and presented to\n team members\n1.2 Reasons for instructions and requirements are\n communicated to team members\n1.3 Team members’ queries and concerns are\n recognized, discussed and dealt with\n2. Assign\nresponsibilities\n2.1 Duties, and responsibilities are allocated having regard\n to the skills, knowledge and aptitude required to properly\n undertake the assigned task and according to company\n policy\n2.2 Duties are allocated having regard to individual\n preference, domestic and personal considerations,\n whenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1 Performance expectations are established based on\n client needs and according to assignment requirements\n3.2 Performance expectations are based on individual team\nmembers duties and area of responsibility\n3.3 Performance expectations are discussed and\ndisseminated to individual team members\n\n--- PDF PAGE 8 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n6\n\n4. Supervise team\nperformance\n4.1 Monitoring of performance takes place against\n defined performance criteria and/or assignment\n instructions and corrective action taken if required\n4.2 Team members are provided with feedback, positive\n support and advice on strategies to overcome any\n deficiencies\n4.3 Performance issues which cannot be rectified or\n addressed within the team are referenced to appropriate\n personnel according to employer policy\n4.4 Team members are kept informed of any changes in the\n priority allocated to assignments or tasks which might\n impact on client/customer needs and satisfaction\n4.5 Team operations are monitored to ensure that\n employer/client needs and requirements are met\n4.6 Follow-up communication is provided on all issues\n affecting the team\n4.7 All relevant documentation is completed in accordance\n with company procedures\n\n--- PDF PAGE 9 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n7\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Work requirements\n1.1 Client Profile\n1.2 Assignment instructions\n2. Team member’s\n concerns\n2.1 Roster/shift details\n3. Monitor performance\n3.1 Formal process\n3.2 Informal process\n4. Feedback\n4.1 Formal process\n4.2 Informal process\n5. Performance issues\n5.1 Work output\n5.2 Work quality\n5.3 Team participation\n5.4 Compliance with workplace protocols\n5.5 Safety\n5.6 Customer service\n\n--- PDF PAGE 10 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n8\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Maintained or improved individuals and/or team\n performance given a variety of possible scenario\n1.2 Assessed and monitored team and individual performance\n against set criteria\n1.3 Represented concerns of a team and individual to next\n level of management or appropriate specialist and to\n negotiate on their behalf\n1.4 Allocated duties and responsibilities, having regard to\n individual’s knowledge, skills and aptitude and the needs of\n the tasks to be performed\n1.5 Set and communicated performance expectations for a\n range of tasks and duties within the team and provided\n feedback to team members\n2. Underpinning\nKnowledge\n2.1 Company policies and procedures\n2.2 Relevant legal requirements\n2.3 How performance expectations are set\n2.4 Methods of Monitoring Performance\n2.5 Client expectations\n2.6 Team member’s duties and responsibilities\n3. Underpinning Skills\n3.1 Communication skills required for leading teams\n3.2 Informal performance counseling skills\n3.3 Team building skills\n3.4 Negotiating skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately simulated\n environment where assessment can take place\n4.2 Materials relevant to the proposed activity or task\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Direct observations of work activities of the individual\n member in relation to the work activities of the group\n5.2 Observation of simulation and/or role play involving the\n participation of individual member to the attainment of\n organizational goal\n5.3 Case studies and scenarios as a basis for discussion of\n issues and strategies in teamwork\n6. Context of\nAssessment\n6.1 Competency assessment may occur in workplace or any\n appropriately simulated environment\n6.2 Assessment shall be observed while task are being\n undertaken whether individually or in-group\n\n--- PDF PAGE 11 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n9\nUNIT OF COMPETENCY :\nDEVELOP AND PRACTICE NEGOTIATION SKILLS\nUNIT CODE :\n500311111\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes\nrequired to collect information in order to negotiate to a\ndesired outcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan negotiations\n1.1 Information on preparing for negotiation is identified\n and included in the plan\n1.2 Information on creating non verbal environments for\n positive negotiating is identified and included in the\n plan\n1.3 Information on active listening is identified and\n included in the plan\n1.4 Information on different questioning techniques is\n identified and included in the plan\n1.5 Information is checked to ensure it is correct and up-\n to- date\n2. Participate in negotiation\n2.1 Criteria for successful outcomes are agreed upon by\n all parties\n2.2 Desired outcome of all parties are considered\n2.3 Appropriate language is used throughout the\n negotiation\n2.4 A variety of questioning techniques are used\n2.5 The issues and processes are documented and\n agreed upon by all parties\n2.6 Possible solutions are discussed and their viability\n assessed\n2.7 Areas for agreement are confirmed and recorded\n2.8 Follow-up action is agreed upon by all parties\n\n--- PDF PAGE 12 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n10\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Preparing for negotiation\n1.1 Background information on other parties to the\n negotiation\n1.2 Good understanding of topic to be negotiated\n1.3 Clear understanding of desired outcome/s\n1.4 Personal attributes\n 1.4.1self awareness\n 1.4.2 self esteem\n 1.4.3 objectivity\n 1.4.4 empathy\n 1.4.5 respect for others\n 1.4.6 Interpersonal skills\n 1.4.7 listening/reflecting\n 1.4.8 non verbal communication\n 1.4.9 assertiveness\n 1.4.10 behavior labeling\n 1.4.11 testing understanding\n 1.4.12 seeking information\n 1.4.13 self disclosing\n1.5 Analytic skills\n 1.5.1 observing differences between content and\n process\n 1.5.2 identifying bargaining information\n 1.5.3 applying strategies to manage process\n 1.5.4 applying steps in negotiating process\n 1.5.5 strategies to manage conflict\n 1.5.6 steps in negotiating process\n 1.5.7 options within organization and externally for\n resolving conflict\n2. Non-verbal environments\n2.1 Friendly reception\n2.2 Warm and welcoming room\n2.3 Refreshments offered\n2.4 Lead in conversation before negotiation begins\n3. Active listening\n3.1 Attentive\n3.2 Don’t interrupt\n3.3 Good posture\n3.4 Maintain eye contact\n3.5 Reflective listening\n\n--- PDF PAGE 13 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n11\n\n4. Questioning techniques\n4.1 Direct\n4.2 Indirect\n4.3 Open-ended\n\n--- PDF PAGE 14 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n12\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\n influencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to\n achieve an agreed outcome\n2. Underpinning\nKnowledge and Attitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies\n procedures\n2.4 Problem solving strategies on how to deal with\n unexpected questions and attitudes during\n negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning Skills\n3.1 Interpersonal skills to develop rapport with other\n parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.4 Negotiation skills\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation\nprocess\n4.2 Human resources (negotiators)\n5. Methods of Assessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context for Assessment\n6.1 Competency to be assessed in real work\nenvironment or in a simulated workplace setting.\n\n--- PDF PAGE 15 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n13\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE :\n500311112\nUNIT DESCRIPTOR :\nThis unit of covers the knowledge, skills and attitudes\nrequired to solve problems in the workplace including the\napplication of problem solving techniques and to\ndetermine and resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify the problem\n1.1 Variances are identified from normal operating\n parameters; and product quality\n1.2 Extent, cause and nature are of the problem are\n defined through observation, investigation and\n analytical techniques\n1.3 Problems are clearly stated and specified\n2. Determine fundamental\n causes of the problem\n2.1 Possible causes are identified based on experience\n and the use of problem solving tools / analytical\n techniques.\n2.2 Possible cause statements are developed based on\n findings\n2.3 Fundamental causes are identified per results of\n investigation conducted\n3. Determine corrective\n action\n3.1 All possible options are considered for resolution of\n the problem\n3.2 Strengths and weaknesses of possible options are\n considered\n3.3 Corrective actions are determined to resolve the\n problem and possible future causes\n3.4 Action plans are developed identifying measurable\nobjectives, resource needs and timelines in\naccordance with safety and operating procedures\n4. Provide recommendation\n/ s to manager\n4.1 Report on recommendations are prepared\n4.2 Recommendations are presented to appropriate\n personnel\n4.3 Recommendations are followed-up, if required\n\n--- PDF PAGE 16 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n14\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1 Brainstorming\n1.2 Intuitions/Logic\n1.3 Cause and effect diagrams\n1.4 Pareto analysis\n1.5 SWOT analysis\n1.6 Gant chart, Pert CPM and graphs\n1.7 Scattergrams\n2. Problem\n\n2.1 Non – routine process and quality problems\n2.2 Equipment selection, availability and failure\n2.3 Teamwork and work allocation problem\n2.4 Safety and emergency situations and incidents\n3. Action plans\n\n3.1 Priority requirements\n3.2 Measurable objectives\n3.3 Resource requirements\n3.4 Timelines\n3.5 Co-ordination and feedback requirements\n3.6 Safety requirements\n3.7 Risk assessment\n3.8 Environmental requirements\n\n--- PDF PAGE 17 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n15\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified the problem\n1.2 Determined the fundamental causes of the problem\n1.3 Determined the correct / preventive action\n1.4 Provided recommendation to manager\n\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a walk\nthrough forming part of the response. These assessment\nactivities should include a range of problems, including new,\nunusual and improbable situations that may have happened.\n2. Underpinning\nKnowledge\n2.1 Competence includes a thorough knowledge and\n understanding of the process, normal operating\n parameters, and product quality to recognize non-\n standard situations\n2.2 Competence to include the ability to apply and explain,\n sufficient for the identification of fundamental cause,\n determining the corrective action and provision of\n recommendations\n2.3 Relevant equipment and operational processes\n2.4 Enterprise goals, targets and measures\n2.5 Enterprise quality, OHS and environmental requirement\n2.6 Principles of decision making strategies and techniques\n2.7 Enterprise information systems and data collation\n2.8 Industry codes and standards\n3. Underpinning Skills\n3.1 Using range of formal problem solving techniques\n3.2 Identifying and clarifying the nature of the problem\n3.3 Devising the best solution\n3.4 Evaluating the solution\n3.5 Implementation of a developed plan to rectify the\nproblem\n\n--- PDF PAGE 18 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n16\n\n4. Resource\nImplications\nAssessment will require access to an operating plant over\nan extended period of time, or a suitable method of\ngathering evidence of operating ability over a range of\nsituations. A bank of scenarios / case studies / what ifs will\nbe required as well as bank of questions which will be\nused to probe the reason behind the observable action.\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Case studies on solving problems in the workplace\n5.2 Observation\nThe unit will be assessed in a holistic manner as is\npractical and may be integrated with the assessment of\nother relevant units of competency. Assessment will occur\nover a range of situations, which will include disruptions to\nnormal, smooth operation.\n\n5.3 Simulation may be required to allow for timely\nassessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include\nwalk through of the relevant competency components.\n6. Context of\nAssessment\n6.1 In all workplace, it may be appropriate to assess this\n unit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 19 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n17\n\nUNIT OF COMPETENCY :\nUSE MATHEMATICAL CONCEPTS AND\nTECHNIQUES\nUNIT CODE :\n500311113\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nrequired in the application of mathematical concepts and\ntechniques.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given\ncondition\n1.2 Mathematical techniques are selected based on\nthe given problem\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on the\nproblem identified\n2.2 Mathematical computations are performed to the\nlevel of accuracy required for the problem\n2.3 Results of mathematical computation is determined\nand verified based on job requirements\n3. Analyze results\n3.1 Result of application is reviewed based on expected\nand required specifications and outcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 20 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n18\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Mathematical techniques May include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical techniques (e.g.\nrecalculation, re-modeling)\n2.2 Report error to immediate superior for proper action\n\n--- PDF PAGE 21 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n19\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of\nmathematical concepts and techniques to workplace\nproblems\n2. Underpinning\nKnowledge\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning Skills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context of Assessment 6.1 Competency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 22 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n20\nUNIT OF COMPETENCY :\nUSE RELEVANT TECHNOLOGIES\nUNIT CODE :\n500311114\nUNIT DESCRIPTOR :\nThis unit of competency covers the knowledge, skills,\nand attitude required in selecting, sourcing and applying\nappropriate\nand\naffordable\ntechnologies\nin\nthe\nworkplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Study/select appropriate\ntechnology\n\n1.1 Usage of different technologies is determined\nbased on job requirements\n1.2 Appropriate technology is selected as per work\n specification\n2. Apply relevant\ntechnology\n\n 2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable software and hardware are used as per\n task requirement\n2.3 Management concepts are observed and practiced\n as per established industry practices\n3. Maintain/enhance\nrelevant technology\n3.1 Maintenance of technology is applied in accordance\n with the industry standard operating procedure,\n manufacturer’s operating guidelines and\n occupational health and safety procedure to\n ensure its operative ability\n3.2 Updating of technology is maintained through\n continuing education or training in accordance with\n job requirement\n3.3 Technology failure/ defect is immediately reported to\n the concern/responsible person or section for\n appropriate action\n\n--- PDF PAGE 23 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n21\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard\noperating procedure\n3.1 Written guidelines relative to the usage of office\ntechnology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific technology/\nequipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to the\noperation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance schedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 24 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n22\n EVIDENCE GUIDE\n1. Critical Aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology\nconsistent with work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nKnowledge\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning Skills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of Assessment 6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 25 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n23\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nPREPARE CONSTRUCTION MATERIALS AND TOOLS\nUNIT CODE :\nCON931201\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nidentifying, requesting and receiving construction materials\nand tools based on the required performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variable\n1. Identify materials\n\n1.1 Materials are listed as per job requirements\n1.2 Quantity and description of materials conform\nwith the job requirements\n1.3 Tools and accessories are identified according to\njob requirements\n2. Requisition materials\n\n2.1 Materials and tools needed are requested\n according to the list prepared\n2.2 Request is done as per company standard\n operating procedures (SOP)\n2.3 Substitute materials and tools are provided\n without sacrificing cost and quality of work\n3. Receive and inspect\n materials\n3.1 Materials and tools issued are inspected as per\nquantity and specification\n3.2 Tools, accessories and materials are checked for\ndamages according to enterprise procedures\n3.3 Materials and tools are set aside to appropriate\nlocation nearest to the workplace\n\n--- PDF PAGE 26 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n24\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials and Tools\n\n1.1 Electrical supplies\n1.2 Structural\n1.3 Plumbing\n1.4 Welding/pipefitting\n1.5 Carpentry\n1.6 Masonry\n2. Description of Materials and\nTools\n\n2.1 Brand name\n2.2 Size\n2.3 Capacity\n2.4 Kind of application\n3. Company standard\nprocedures\n3.1 Job order\n3.2 Requisition slip\n3.3 Borrower slip\n\n--- PDF PAGE 27 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n25\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Listed materials and tools according to quantity and job\n requirements\n1.2 Requested materials and tools according to the list prepared\n and as per company SOP\n1.3 Inspected issued materials and tools as per quantity and job\n specifications\n1.4 Tools provided with appropriate safety devices\n2. Underpinning\nknowledge\n\n2.1 Types and uses of construction materials and tools\n2.2 Different forms\n2.3 Requisition procedures\n3. Underpinning\nskills\n\n3.1 Preparing materials and tools\n3.2 Proper handling of tools and equipment\n3.3 Following instructions\n4. Resource\nimplications\n\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Materials relevant to the unit of competency\n4.3 Technical plans, drawings and specifications relevant to the\nactivities\n5. Methods of\nassessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation and oral questioning\n6. Context of\nassessment\n\n6.1 Competency may be assessed in the workplace or in a\n simulated workplace\n6.1 Competency assessment must be undertaken in accordance\n with the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 28 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n26\nUNIT OF COMPETENCY:\nOBSERVE PROCEDURES, SPECIFICATIONS AND\nMANUALS OF INSTRUCTIONS\nUNIT CODE :\nCON311201\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nidentifying, interpreting, applying services to specifications\nand manuals and storing manuals.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Identify and access\nspecification/manuals\n\n1.1 Appropriate manuals are identified and accessed\nas per job requirements\n1.2 Version and date of manual are checked to\nensure that correct specification and procedures\nare identified\n2. Interpret manuals\n2.1 Relevant sections, chapters of specifications/\nmanuals are located in relation to the work to be\nconducted\n2.2 Information and procedure in the manual are\ninterpreted in accordance with industry practices\n3. Apply information in manual\n3.1 Manual is interpreted according to job\nrequirements\n3.2 Work steps are correctly identified in accordance\nwith manufacturer's specification\n3.3 Manual data are applied according to the given\ntask\n3.4 All correct sequencing and adjustments are\ninterpreted in accordance with information\ncontained on the manual or specifications\n4. Store manuals\n4.1 Manual or specification is stored appropriately to\nprevent damage, ready access and updating of\ninformation when required in accordance with\ncompany requirements\n\n--- PDF PAGE 29 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n27\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Procedures, Specifications\nand Manuals of Instructions\n\nKinds of Manuals:\n1.1 Manufacturer's Specification Manual\n1.2 Repair Manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 30 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n28\n\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Identified and accessed specification/manuals as per job\nrequirements\n1.2 Interpreted manuals in accordance with industry practices\n1.3 Applied information in manuals according to the given task\n1.4 Stored manuals in accordance with company requirements\n2. Underpinning\nknowledge\n\n2.1 Types of manuals used in construction sector\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n3. Underpinning\nskills\n3.1 Reading and comprehension skills required to identify and\ninterpret construction manuals and specifications\n3.2 Accessing information and data\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to construction\n sector\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Questions/interview\n\nAssessment of underpinning knowledge and practical skills may be\ncombined\n6. Context of\nassessment\n6.1 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\nsimulated environment\n\n--- PDF PAGE 31 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n29\nUNIT OF COMPETENCY:\nINTERPRET TECHNICAL DRAWINGS AND PLANS\nUNIT CODE :\nCON311202\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nanalyzing and interpreting symbols, data and work plan\nbased on the required performance standards.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Analyze signs, symbols and\ndata\n\n1.1 Technical plans are obtained according to job\n requirements\n1.2 Signs, symbols and data are identified according\n to job specifications\n1.3 Signs symbols and data are determined\n according to classification or as appropriate in\n drawing\n\n2. Interpret technical drawings\nand plans\n2.1 Necessary tools, materials and equipment are\n identified according to the plan\n2.2 Supplies and materials are listed according to\n specifications\n2.3 Components, assemblies or objects are\n recognized as required\n2.4 Dimensions are identified as appropriate to the\n plan\n2.5 Specification details are matched with\n existing/available resources and in line with job\n requirements\n2.6 Work plan is drawn following the specifications\n3. Apply freehand sketching\n3.1 Where applicable, correct freehand sketching is\n produced in accordance with the job requirements\n\n--- PDF PAGE 32 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n30\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Technical Plans\nIncluding but not limited to:\n1.1 Electrical plans\n1.2 Structural plans\n1.3 Architectural plans\n1.4 Plumbing plans\n1.5 Welding Procedures Specifications (WPS)\n2. Work plan\n\n2.1 Job requirements\n2.2 Installation instructions\n2.3 Components instruction\n3. Classification\n\nIncluding but not limited to:\n3.1 Electrical\n3.2 Mechanical\n3.3 Plumbing\n4. Drawing\n4.1 Drawing symbols\n4.2 Alphabet of lines\n4.3 Orthographic views\n4.4 Front view\n4.5 Right side view/left side view\n4.6 Top view\n4.7 Pictorial\n4.8 Schematic diagram\n4.9 Electrical drawings\n4.10 Structural drawings\n4.11 Plumbing drawings\n4.12 Water\n4.13 Sewerage/Drainage\n4.14 Ventilation\n4.15 Welding symbols\n5. Tools and materials\nIncluding but not limited to:\n5.1 Compass\n5.2 Divider\n5.3 Rulers\n5.4 Triangles\n5.5 Drawing tables\n5.6 Computer\n\n--- PDF PAGE 33 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n31\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires that the candidate:\n1.1 Identified and determined signs, symbols and data according to\n work plan, job requirements and classifications\n1.2 Identified tools and equipment in accordance with job\n requirements\n1.3 Listed supplies and materials according to blueprint\n specifications\n1.4 Drawn work plan following specifications\n1.5 Demonstrated ability to determine job specifications based on\n working / technical drawing\n2. Underpinning\nKnowledge\n\n2.1 TRADE MATHEMATICS\n 2.1.1 Linear measurement\n 2.1.2 Dimension\n 2.1.3 Unit conversion\n2.2 BLUEPRINT READING AND PLAN\n SPECIFICATION\n 2.2.1 Electrical, mechanical plan, symbols and abbreviations\n 2.2.2 Drawing standard symbols\n2.3 TRADE THEORY\n 2.3.1 Basic technical drawing\n 2.3.2 Types technical plans\n 2.3.3 Various types of drawings\n 2.3.4 Notes and specifications\n3. Underpinning\nSkills\n3.1 Interpreting drawing/orthographic drawing\n3.2 Interpreting technical plans\n3.3 Matching specification details with existing resources\n3.4 Following instructions\n3.5 Handling of drawing instruments\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Drawings and specification relevant to task\n4.3 Materials and instrument relevant to proposed activity\n\n--- PDF PAGE 34 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n32\n\n5. Methods of\nAssessment\nCompetency should be assessed through:\n5.1 Direct Observation\n5.2 Questions/Interview\n5.3 Written test related to underpinning knowledge\n6. Context of\nAssessment\n6.1 Competency assessment may occur in the workplace or in any\n appropriate simulated environment\n6.2 Assessment shall be observed while task are being undertaken\n whether individually or in group\n6.3 Competency assessment must be undertaken in accordance\n with the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 35 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n33\nUNIT OF COMPETENCY:\nPERFORM MENSURATIONS AND CALCULATIONS\nUNIT CODE :\nCON311203\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nidentifying and measuring objects based on the required\nperformance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variable\n1. Select measuring instruments\n\n1.1 Object or component to be measured is\nidentified, classified and interpreted according to\nthe appropriate regular geometric shape\n1.2 Measuring tools are selected/identified as per\nobject to be measured or job requirements\n1.3 Correct specifications are obtained from relevant\nsources\n1.4 Appropriate measuring instruments are selected\naccording to job requirements\n1.1 Alternative measuring tools are used without\nsacrificing cost and quality of work\n2. Carry out measurements and\ncalculations\n\n2.1 Accurate measurements are obtained\naccording to job requirements\n2.2 Alternative measuring tools are used\n without sacrificing cost and quality of work\n2.3 Calculation needed to complete work tasks are\nperformed using the four basic process of\naddition (+), subtraction (-), multiplication (x) and\ndivision (/) including but not limited to:\ntrigonometric functions, algebraic computations\n2.4 Calculations involving fractions, percentages\nand mixed numbers are used to complete\nworkplace tasks\n2.5 Numerical computation is self-checked and\ncorrected for accuracy\n2.6 Instruments are read to the limit of accuracy of\nthe tool\n2.7 Systems of measurement identified and\nconverted according to job requirements/ISO\n2.8 Workpieces are measured according to job\nrequirements\n\n--- PDF PAGE 36 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n34\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Geometric shape\n\n Including but is not limited to:\n1.1 Round\n1.2 Square\n1.3 Rectangular\n1.4 Triangle\n1.5 Sphere\n1.6 Conical\n2. Measuring instruments\nIncluding but not limited to:\n2.1 Micrometer (In-out, depth)\n2.2 Vernier caliper (out, inside)\n2.3 Dial gauge with mag, std.\n2.4 Straight edge\n2.5 Thickness gauge\n2.6 Torque gauge\n2.7 Small hole gauge\n2.8 Telescopic gauge\n2.9 Try-square\n2.10 Protractor\n2.11 Combination gauge\n2.12 Steel rule\n2.13 Voltmeter\n2.14 Ammeter\n2.15 Mega-ohmeter\n2.16 Kilowatt hour meter\n2.17 Gauges\n2.18 Thermometers\n3. Measurements and\ncalculations\n\n3.1 Linear\n3.2 Volume\n3.3 Area\n3.4 Wattage\n3.5 Voltage\n3.6 Resistance\n3.7 Amperage\n3.8 Frequency\n3.9 Impedance\n\n--- PDF PAGE 37 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n35\n\nVARIABLE\nRANGE\n\n3.10 Conductance\n3.11 Capacitance\n3.12 Displacement\n3.16 Inside diameter\n3.17 Circumference\n3.18 Length\n3.19 Thickness\n3.20 Outside diameter\n3.21 Taper\n3.22 Out of roundness\n3.23 Oil clearance\n3.24 End play/Thrust clearance\n\n--- PDF PAGE 38 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n36\n\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Selected and prepared appropriate measuring instruments in\naccordance with job requirements\n1.2 Performed measurements and calculations according to job\nrequirements/ ISO\n2. Underpinning\nknowledge\n\nTRADE MATHEMATICS / MENSURATION\n2.1 Four fundamental operation\n2.2 Linear measurement\n2.3 Dimensions\n2.4 Unit conversion\n2.5 Ratio and proportion\n2.6 Trigonometric functions\n2.8 Algebraic equations\n3. Underpinning\nskills\n3.1 Performing calculation by addition, subtraction, multiplication\nand division; trigonometric functions and algebraic equations\n3.2 Visualizing objects and shapes\n3.3 Interpreting formulas for volume, areas, perimeters of plane\nand geometric figures\n3.4 Proper handling of measuring instruments\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Problems to solve\n4.3 Measuring instrument appropriate to carry out tasks\n4.4 Instructional materials relevant to the propose activity\n\nAssessment of underpinning knowledge and practical skills may be\ncombined\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Actual demonstration\n5.2 Direct observation\n5.3 Written test/questioning related to underpinning knowledge\n6. Context of\nassessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n6.3 Competency assessment must be undertaken in accordance\nwith the TESDA assessment guidelines\n\n--- PDF PAGE 39 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n37\n\nUNIT OF COMPETENCY:\nMAINTAIN TOOLS AND EQUIPMENT\nUNIT CODE :\nCON311204\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nchecking condition, performing preventive maintenance and\nstoring of tools and equipment based on the required\nperformance standards.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Check condition of tools and\nequipment\n\n1.1 Materials, tools and equipment are identified\naccording to classification and job requirements\n1.2 Non-functional tools and equipment are\nsegregated\nand\nlabeled\naccording\nto\nclassification\n1.3 Safety of tools and equipment are observed in\naccordance with manufacturer's instructions\n1.4 Condition of PPE are checked in accordance\n with manufacturer's instructions\n2. Perform basic preventive\nmaintenance\n2.1 Appropriate lubricants are identified according to\n types of equipment\n2.2 Tools and equipment are lubricated according to\npreventive\nmaintenance\nschedule\nor\nmanufacturer's specifications\n2.3 Measuring instruments are checked and\n calibrated in accordance with manufacturer’s\n instructions\n2.3 Tools are cleaned and lubricated according to\n standard procedures\n2.5 Defective instruments, equipment and\n accessories are inspected and replaced\n according to manufacturer’s specifications\n2.6 Tools are inspected, repaired and replaced after\nuse\n2.7 Work place is cleaned and kept in safe state in\n line with OHSA regulations\n\n--- PDF PAGE 40 ---\n_____________________________________________________________________________________________\nT