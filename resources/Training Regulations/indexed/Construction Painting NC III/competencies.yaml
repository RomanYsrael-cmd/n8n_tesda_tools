        "source_text": "--- PDF PAGE 49 ---\n_____________________________________________________________________________________________ \nTR CONSTRUCTION PAINTING NC III                                                                                                                                                              \n47\n \nUNIT OF COMPETENCY       :\nPREPARE SURFACE FOR PAINTING \nUNIT CODE                            : \nCON712327 \nUNIT DESCRIPTOR               : \nThis unit covers the outcomes required to prepare \nsurface area for painting.\n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  \nRange of Variables\n1. Inspect surface  \n \n1.1 Scaffolds/platforms/guard rail systems/ladders \nare laid-out and assembled consistent with \ndetailed plans and manufacturer’s specifications. \n1.2 Surfaces are inspected in line with job \nrequirements and standard operating \nprocedures. \n1.3  Area is checked against paint schedule and \nplans \n1.4  Foreign matters are checked according to job \nrequirements \n1.5  Appropriate PPE is used according to job \nrequirements \n1.6  Inspection report is submitted to appropriate \npersonnel according to job requirements \n2.  Clean surface \n2.1 Appropriate PPE is used according to job    \n      requirements \n2.2 Surfaces are sanded smoothly according to  \n      industry requirements and appropriate chemicals \n      are applied when necessary \n2.3 Surfaces with minor imperfection are primed  \n      and/or putted according to job specifications \n2.4 Proper tool usage is observed in line with job \n   requirements \n2.5 Unexpected situations are responded to \n      according to company rules and regulations \n2.6 Worksite is cleaned and kept in safe state and in \n      accordance with OSHA regulations \n2.7 Daily completion report is submitted to \nappropriate personnel according to job \nrequirements.\n\n--- PDF PAGE 50 ---\n_____________________________________________________________________________________________ \nTR CONSTRUCTION PAINTING NC III                                                                                                                                                              \n48\n \n \nRANGE OF VARIABLES \nVARIABLES \nRANGE \n1. Scaffolds \n \n1.1 15-feet high  \n1.2 20-feet long  \n2. Surface \n \n2.1 Concrete \n2.2 Steel \n2.3 Wooden \n \n3. Foreign matters  \n \nMay include but are not limited to: \n3.1 Substances/Chemicals  \n       3.1.1 Grease \n       3.1.2 Oil  \n       3.1.3 Alkaline  \n       3.1.4 Dust  \n       3.1.5 Rust \n3.2  Exposed nails/rebars/wires  \n3.3  Welding spatters  \n4. PPE \n \nMay include but not limited to:  \n4.1 Body harness/Safety belt \n4.2 Gloves \n4.3 Safety shoes \n4.4 Hard hat \n4.5 Respirator/Dust mask \n4.6 Goggles \n4.7 Overall coat and pants \n5. Minor imperfection \nMay include but are not limited to: \n5.1 Minor cracks \n5.2 Surface imperfection \n5.3 Dents \n5.4 Holes \n6. Unexpected situations \nMay include but are not limited to: \n6.1 Damaged to materials \n6.2 Injury to personnel\n\n--- PDF PAGE 51 ---\n_____________________________________________________________________________________________ \nTR CONSTRUCTION PAINTING NC III                                                                                                                                                              \n49\n \n \nEVIDENCE GUIDE \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1  Laid-out and assembled scaffolds/platforms/guard rail   \n       systems/ladders consistent with detailed plans and    \n       manufacturer’s specifications. \n1.2  Inspected surfaces in line with job requirements and standard  \n       operating procedures. \n1.3  Sanded surfaces smoothly according to industry requirements  \n       and appropriate chemicals are applied when necessary. \n1.3 Patched surfaces with minor imperfection according to job  \n       specifications. \n1.4 Observed proper tool usage in line with job requirements. \n1.5 Identified, selected and used appropriate PPE in line with job   \n       requirements. \n1.6 Communicated interactively with others where applicable to  \n       ensure safe and effective work operations. \n1.8  Work completed without injury or damage to materials. \n2. Underpinning \nKnowledge \n2.1 Safety and maintenance  \n         2.1.1 Safety rules and regulations \n         2.1.2 Fire prevention \n         2.1.3 First aid treatment \n         2.1.4 Proper handling and care of tools, materials and \nequipment \n2.2 Trade theory  \n         2.2.1 Grades of sandpaper \n         2.2.2 Paint defects and troubleshooting \n         2.2.3 Various paint remover and cleaner \n2.3 Trade Mathematics and mensuration           \n2.4 Tools and equipment  \n         2.4.1 Sander (Pneumatic)         \n         2.4.2 Compressor \n         2.4.3 Handtools (spatula, hammer, nail set) \n2.5 Plans and specifications interpretation  \n         2.5.1 Painting schedule  \n         2.5.2 Architectural plans \n2.6 Methods and procedures  \n2.7 Methods/procedures of surface preparation \n2.8 5S  \n2.9 Surface inspection procedures \n2.10  Application of primer and filler\n\n--- PDF PAGE 52 ---\n_____________________________________________________________________________________________ \nTR CONSTRUCTION PAINTING NC III                                                                                                                                                              \n50\n3. Underpinning \nSkills \n3.1 Following safety and maintenance procedures \n3.2 Staging/preparing scaffolds  \n3.3 Interpreting specifications   \n3.4 Applying mensuration \n3.5 Following 5S \n3.6 Preparing surfaces for: \n         3.6.1 Concrete \n         3.6.2 Steel  \n         3.6.3 Wood \n3.7 Smoothing surfaces  \n3.8 Preparing inspection and completion reports \n4. Resource \nImplications \nThings necessary to conduct method of assessment: \n4.1  Workplace location \n4.2  Tools and equipment appropriate to work processes \n4.3  Materials relevant to the proposed activity \n4.2 Working drawings, instructions and specifications relevant to \nthe task \n4.5  Appropriate PPE \n5. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 Observation of practical demonstration of skills \n5.2 Interview/Oral questioning related to underpinning knowledge  \n5.3 Portfolio  \n6. Context for \nAssessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated workplace setting.\n",
