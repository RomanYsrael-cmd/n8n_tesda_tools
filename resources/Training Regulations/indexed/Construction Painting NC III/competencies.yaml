        "source_text": "CON712330\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nin performing mixing/tinting of paints based on job\nrequirements and specifications.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Prepare materials and tools\n\n1.1 Appropriate PPE are selected according to job\n requirements.\n1.2 Materials and tools are prepared and selected\n consistent with job requirements.\n1.3 Materials and tools are properly staged in line\n with standard operating procedures.\n2. Mix/tint paints\n2.1 Appropriate PPE are used according to job\n requirements\n2.2 Paints are mixed/tinted according to job\n requirements\n2.3 Worksite is cleaned and kept in safe state in\n accordance with OSHA regulations\n2.4 Unexpected situations are dealt with\n according to company rules and regulations\n3. Complete work\n3.1 Final checks are made to ensure that work\n conforms with instructions and to requirements.\n3.2 Completion report is prepared and submitted to\n appropriate officer.\n3.3 Tools, equipment and any surplus resources\n and materials are checked and monitored in\n accordance with established procedures.\n3.4 Work area is monitored as to cleanliness and\n safety.\n\n--- PDF PAGE 65 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n63\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Materials\n\nMay include but not limited to:\n1.1 Color guide\n1.2 Tinting color\n1.3 Paint\n1.3.1 Lacquer base\n1.3.2 Water base\n1.3.3 Spirit/alcohol base\n1.3.4 Enamel base\n1.3.5 Acrylic base\n1.4 Filler\n1.5 Solvents/thinners\n\n2. Tools\n\nMay include but not limited to:\n2.1 Mixing stick\n2.2 Empty cans\n2.3 Piece of glass/board\n2.4 Screw driver\n2.5 Hacking knife\n3. PPE\nMay include but not limited to:\n3.1 Gloves\n3.2 Dust mask\n3.3 Safety shoes\n3.4 Hard hat\n3.5 Respirator\n\n--- PDF PAGE 66 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n64\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Prepared and selected materials according to job\n requirements\n1.2 Mixed/tinted paints according to job requirements\n1.3 Demonstrated compliance with safety regulations applicable\n to worksite operations\n1.4 Identified faults and problems that occur and take necessary\n action to rectify\n1.5 Completed work without damage to materials or injury to\npersonnel\n1.6 Accomplished and submitted completion report\n2. Underpinning\nKnowledge\n2.1 Safety and maintenance\n 2.1.1 Hazards\n 2.1.2 Safety rules and regulations\n 2.1.3 Fire prevention\n 2.1.4 First aid treatment\n 2.1.5 Proper handling and care of tools and equipment\n 2.1.6 Housekeeping\n2.2 Tools and equipment\n 2.2.1 Types of spray equipment\n 2.2.2 Capacity of compressor\n2.3 Trade Mathematics and mensuration\n 2.2.1 Areas and volume\n 2.2.2 Ratio and proportion\n 2.2.3 Percentage\n 2.2.4 Linear measurements\n 2.2.5 Metric system\n 2.2.7 Basic Mathematical operation\n2.4 Plans and specification interpretation\n 2.4.1 Orthographic projection\n 2.4.2 Sectional view\n2.5 Methods and procedures\n 2.5.1 Color matching\n 2.5.2 Methods of mixing paint\n\n3. Underpinning\nSkills\n3.1 Interpreting plan and specifications\n3.2 Following safety and maintenance procedures\n3.3 Using appropriate tools and equipment\n3.4 Applying trade Mathematics and mensuration\n3.5 Mixing and tinting of paints according to job requirements\n3.6 Following company rules and regulations\n\n--- PDF PAGE 67 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n65\n4. Resource\nImplications\nThings necessary for the conduct of method of assessment:\n4.1 Well-ventilated workplace location\n4.2 Tools and equipment appropriate to mixing/tinting of color\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n4.5 Appropriate PPE\n5. Methods of\nAssessment\nCompetency in this unit must be assessed:\n5.1 Direct observation of practical demonstration of skills\n5.2 Questions related to underpinning knowledge\n5.3 Portfolio\n5.4 Third party report\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting.\n\n--- PDF PAGE 68 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n66\nUNIT OF COMPETENCY :\nPERFORM RE-PAINTING AND/OR RE-TOUCHING\nWORKS\nUNIT CODE :\n :"
