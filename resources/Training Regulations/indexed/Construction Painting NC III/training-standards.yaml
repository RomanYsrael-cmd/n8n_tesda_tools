    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: CONSTRUCTION PAINTING NC Level: III\n\nNominal Training Duration: 20 hours (Basic)\n 24 hours (Common)\n 158 hours (Core)\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills and desirable\nwork attitude in Building Construction Worker (Construction Painting) NC III. It\ncovers core competencies on preparing painting tools, materials & equipment,\npainting surfaces; performing painting works, mixing/tinting of paints, and re-\npainting and/or re-touching work; and estimating painting requirements.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\n communication\n1.1 Communicate information\n about workplace\n processes\n\n1.2 Lead workplace\n discussions\n\n1.3 Identify and communicate\n issues arising in the\n workplace\nLecture\n\nDemonstration\n\nPractical\nexercises\nObservation and\noral questioning\n\nWritten test\n\n--- PDF PAGE 74 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n72\n\n2. Lead small team\n2.1 Provide team leadership\n\n2.2 Assign responsibilities\n\n2.3 Set performance\n expectations for team\n members\n\n2.4 Supervised team\nperformance\nLecture\n\nDemonstration\n\nPractical\nexercises\nObservation and\noral questioning\n\nWritten test\n3. Solve\n workplace\n problems\n related to work\n activities\n3.1 Identify the problem\n\n3.2 Determine fundamental\n cause problem\n\n3.3 Determine correct /\n preventive action\n\n3.4 Provide recommendation\n to manager\nLecture\n\nDemonstration\n\nPractical\nexercises\nObservation and\noral questioning\n\nWritten test\n4. Develop and\npractice\nnegotiation skills\n4.1 Identify relevant\n information in planning\n negotiations\n\n4.2 Participate in\nnegotiations\n\n4.3 Document areas for\nagreement\nDirect\nobservation\n\nSimulation / role\nplaying\n\nCase studies\nWritten test\n\nPractical /\nperformance test\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\n tools and techniques to\n solve problem\n\n5.2 Apply mathematical\n procedures / solution\n\n5.3 Analyze results\nDirect observation\n\nSimulation / role\nplaying\n\nCase studies\nWritten test\n\nPractical /\nperformance test\n\n--- PDF PAGE 75 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n73\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\n technology\n\n6.2 Apply relevant\ntechnology\n\n6.3 Maintenance / enhance\n relevant technology\nDirect observation\n\nSimulation / role\nplaying\n\nCase studies\nWritten test\n\nPractical\nperformance test\n\n--- PDF PAGE 76 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n74\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n\n1.2 Requisition Materials\n\n1.3 Receive and inspect\nmaterials\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical\nExercise\n\nDemonstration\nDirect\nobservation\n\nQuestions or\ninterview\n\nPortfolio\n(credentials)\n\nWritten / Oral\nTest\n\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/ manuals\n\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect\nobservation\n\nOral\nquestioning\n\nWritten test or\nexamination\n\nThird party\nreport\n\nDemonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 77 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n75\n3. Perform\nmensuration and\ncalculation\n3.1 Select measuring\ninstruments\n\n3.2 Carry out measurements\nand calculations\nAudio Visua