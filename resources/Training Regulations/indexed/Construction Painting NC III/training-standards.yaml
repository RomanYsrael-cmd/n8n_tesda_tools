  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Construction Painting NC III.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: CONSTRUCTION PAINTING NC Level: III\n\nNominal Training Duration: 20 hours (Basic)\n 24 hours (Common)\n 158 hours (Core)\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills and desirable\nwork attitude in Building Construction Worker (Construction Painting) NC III. It\ncovers core competencies on preparing painting tools, materials & equipment,\npainting surfaces; performing painting works, mixing/tinting of paints, and re-\npainting and/or re-touching work; and estimating painting requirements.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\n communication\n1.1 Communicate information\n about workplace\n processes\n\n1.2 Lead workplace\n discussions\n\n1.3 Identify and communicate\n issues arising in the\n workplace\nLecture\n\nDemonstration\n\nPractical\nexercises\nObservation and\noral questioning\n\nWritten test\n\n--- PDF PAGE 74 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n72\n\n2. Lead small team\n2.1 Provide team leadership\n\n2.2 Assign responsibilities\n\n2.3 Set performance\n expectations for team\n members\n\n2.4 Supervised team\nperformance\nLecture\n\nDemonstration\n\nPractical\nexercises\nObservation and\noral questioning\n\nWritten test\n3. Solve\n workplace\n problems\n related to work\n activities\n3.1 Identify the problem\n\n3.2 Determine fundamental\n cause problem\n\n3.3 Determine correct /\n preventive action\n\n3.4 Provide recommendation\n to manager\nLecture\n\nDemonstration\n\nPractical\nexercises\nObservation and\noral questioning\n\nWritten test\n4. Develop and\npractice\nnegotiation skills\n4.1 Identify relevant\n information in planning\n negotiations\n\n4.2 Participate in\nnegotiations\n\n4.3 Document areas for\nagreement\nDirect\nobservation\n\nSimulation / role\nplaying\n\nCase studies\nWritten test\n\nPractical /\nperformance test\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical\n tools and techniques to\n solve problem\n\n5.2 Apply mathematical\n procedures / solution\n\n5.3 Analyze results\nDirect observation\n\nSimulation / role\nplaying\n\nCase studies\nWritten test\n\nPractical /\nperformance test\n\n--- PDF PAGE 75 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n73\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\n technology\n\n6.2 Apply relevant\ntechnology\n\n6.3 Maintenance / enhance\n relevant technology\nDirect observation\n\nSimulation / role\nplaying\n\nCase studies\nWritten test\n\nPractical\nperformance test\n\n--- PDF PAGE 76 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n74\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n\n1.2 Requisition Materials\n\n1.3 Receive and inspect\nmaterials\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical\nExercise\n\nDemonstration\nDirect\nobservation\n\nQuestions or\ninterview\n\nPortfolio\n(credentials)\n\nWritten / Oral\nTest\n\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/ manuals\n\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect\nobservation\n\nOral\nquestioning\n\nWritten test or\nexamination\n\nThird party\nreport\n\nDemonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 77 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n75\n3. Perform\nmensuration and\ncalculation\n3.1 Select measuring\ninstruments\n\n3.2 Carry out measurements\nand calculations\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect\nobservation\n\nOral\nquestioning\n\nWritten test or\nexamination\n\nThird party\nreport\n\nDemonstration\n(able to impart\nknowledge and\nskills)\n4. Maintain tools and\nequipment\n4.1 Check condition of tools\nand equipment\n\n4.2 Perform basic preventive\nmaintenance\n\n4.3 Sharpen edge and tooth\ncutting tools\n\n4.4 Store tools and\nequipment\n\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect\nobservation of\napplication of\ntasks\n\nOral\nquestioning\n\nWritten test or\nexamination\n\nThird party\nreport\n\nDemonstration\n5. Interpret\n technical\n drawings and\n plans\n\n5.1 Read / Interpret blueprints\n and plans\n\n5.2 Perform freehand\n sketching\nLecture\n\nDemonstration\n\nPractical\nexercises\nDemonstration\nand oral\nquestioning\n\nWritten test\n\n--- PDF PAGE 78 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n76\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare paint,\nand painting\nmaterials\n1.1 Prepare paint and\n painting materials\n\n1.2 Prepare painting tools\n and equipment\n\nDemonstration\n/ Film viewing\n\nModular / Self\npace\n\nDistant learning\nInterview\n\nDirect observation\n\nDemonstration\n\nWritten exam\n2. Prepare surface\n for painting\n2.1 Inspect and clean\n steel surface\n\n2.2 Inspect and clean\n wood surface\n\n2.3 Inspect and clean\n concrete surface\n\n2.4 Layout scaffolds/\n platform\n\n2.5 Assemble / install\n scaffold / platforms\n and ladder\nDemonstration\n\nModular\n\nInterview\n\nWritten\n\nPractical\n\nDirect\nobservation\n\n3. Perform painting\n Work\n3.1 Identify and prepare\n the needed materials,\n tools and surface area\n\n3.2 Apply base coating\n\n3.3 Apply intermediate\n and finish / top coating\n\n3.4 Dismantle scaffold\nDemonstration\n/ Film viewing\n\nModular / Self\npace learning\n\nE-learning\n\nInterview\n\nDemonstration\n\nObservation\n\n--- PDF PAGE 79 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n77\n4. Estimate paint\n requirements\n4.1 Determine the area to\nbe re-painted\n\n4.2 Compute the cost of\narea to be re-painted\n\nDemonstration\n\nModular / Self\npace learning\n\nDistance learning\n\nInterview\n\nWritten\n\nDemonstration\n\nObservation\n\n5. Perform mixing /\ntinting of color\npaint\n5.1 Prepare paint\n\n5.2 Tint paint\nDemonstration\n\nModular / Self\npace learning\n\nFilm Viewing\n\nDirect observation\nOral /\nquestionnaire\n\nDemonstration of\npractical Skills\n\n6. Perform painting\nrepair work\n6.1 Identify and prepare\n painting repair works\n\n6.2 Rectify defect paints\n\n6.3 Carry out painting\n repair works\n\nDemonstration\n\nModular/Self\npace learning\n\nInterview\n\nWritten\n\nPractical\n\nDirect\nobservation\n\n--- PDF PAGE 80 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n78\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and\nthe curriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n\n--- PDF PAGE 81 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n79\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video\nor computer technologies.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees. Other requirements like\nhealth and physical are also stated. Passing entry written examinations may also\nbe indicated if necessary.\n\n•\ncan communicate both oral and written\n•\nphysically and mentally fit\n•\nWith good moral character\n•\ncan perform basic mathematical computation\n\n--- PDF PAGE 82 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n80\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS CONSTRUCTION\nPAINTING NC III\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Construction Painting – NC III\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n25 pcs\nSteel brush or cap\nbrush\n1 unit\nElectrical drill\n50 qt.\nCatalyst\n50 pcs.\nNylon/paint brush\n1 unit\nCompressor\n50 qt.\nTinting color\n50 m.\nRope\n2\nunits\nSander/Sanding\nMachine\n50 pail Paint\n10 pcs.\nRipping bar/crow bar\n20\nsets\nScaffold H frame\n8 pcs.\nNail set\n10 pcs.\nCold Chisel\n2\nunits\nPulley\n100\npcs.\nSand paper\n10 pcs.\nCross cut saw\n2\nunits\nLadder\n10 gal.\nNeutralizer\n6 pcs.\nWrench/spanner\n25\nsets\nRailing system\n2 liters Alkaline remover\n2 pcs.\nScrew driver set\n20\nsets\nScaffold tubular\n20 kg.\nPatching\ncompound/\nkalsomine\n20 pcs.\nScraper\n5\nunits\nSpray gun\n5\nboxes\nLitmus paper or\nPH paper\n2 sets\nSpray gun cleaning\nkit\n\nWater\n20 pcs.\nPutty knife\n50 bot.\nPaint remover\n12 pcs.\nChipping hammer\n2 liters\nRust converter\n10 pcs.\nHose couplings and\nfittings\n\nSoaped water\n\n--- PDF PAGE 83 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n81\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n25 pcs.\nClaw hammer\n20 gal.\nPaint thinner\n10 pcs.\nCalculator\n20 gal.\nLacquer thinner\n25\nPaint roller/pan\n2 gal.\nSolvent\n10 pcs.\nPull push rule/tape\n50 ft.\nSand paper\n50 pcs.\nPutty pallet\n2 gal.\nConcrete sealer\n50 sets\nBase jack\n\n10\nkilos\nRags\n50 pcs.\nLumber sill\n50 rolls\nMasking tape\n12 pcs.\nWrecking bar\n4 kgs.\nConcrete nail\n25 sets\nPlatforms\n25 pcs,\nMixing stick\n10 pcs.\nX-brace\n25 pcs.\nMixing can\n10 pcs.\nSmooth plane\n25 pcs.\nMeasuring cups\n10 pcs.\nJack plane\n10 pcs.\nBlack plane\n50 pcs.\nGloves\n25 pcs.\nDust\nmasks/Respirator\n\n25 pcs.\nSafety shoes\n25 pcs.\nHard hat\nLEARNING MATERIALS\n25 pcs.\nBelt/safety harness\nWorking drawing\n25 pcs.\nGoggles\nColor guide\n25 pcs.\nOverall coat\nCompany forms\n\nPaint schedule and\nplans\n\nInteractive\ninstructional\nmodules\nBooks in Painting\n\n--- PDF PAGE 84 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n82\n\n3.5 TRAINING FACILITIES\n\nBased on a class size of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nTotal Area\nin\nSq. Meters\nLaboratory/Workshop Area\n\n-\n100\nLecture Room\n\n25\n25\nTool, Supply / Storage Room\n\n10\n10\nLearning Resource Center\n\n15\n15\nWash room and Toilet\n\n10\n10\nFacilities / Equipment / Circulation area (30% of Workshop Component Space)\n48\nTOTAL AREA\n208\n\n3.6 TRAINER’S QUALIFICATION CONSTRUCTION SECTOR\n\n CONSTRUCTION PAINTING – NC III\n\nMust have undergone training on Training Methodology II(TM II)\nMust be a holder of National Certificate Level III\nGood moral character\nMust be physically and mentally fit\n*Must have at least 6 months industry experience and/or teaching\nexperience\n\n*Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004-03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued\nfor each unit of competency.\n\n--- PDF PAGE 85 ---\n_____________________________________________________________________________________________\nTR CONSTRUCTION PAINTING NC III\n83"
