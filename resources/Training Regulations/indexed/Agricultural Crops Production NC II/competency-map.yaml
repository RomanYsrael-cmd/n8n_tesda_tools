  "source_text": "Section 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n\n4..2.1. Accumulation of Certificates of Competency (COCs) in the\nfollowing areas:\n\n4.2.1.1.\nPerform nursery operations\n4.2.1.2.\nPlant crops\n4.2.1.3.\nCare and maintain crops\n4.2.1.4.\nCarry-out harvest and postharvest operations\n\n Successful candidates shall be awarded Certificates of\nCompetency (COCs) bearing the signature of the Regional\nDirector and Chair of the recognized local industry body.\n\n4.2.2. Demonstration of competence through project-type assessment\ncovering all required units of the qualification.\n\n4.2.\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.3.\nThe following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs\n4.3.2. Experienced Workers (wage employed or self-employed)\n\n4.4.\nThe guidelines on assessment and certification are discussed in detail in\nthe Procedures Manual on Assessment and Certification and Guidelines\non the Implementation of the Philippine TVET Qualification and\nCertification System (PTQCS).\n\n--- PDF PAGE 62 ---\nTR-AGRICULTURAL CROP PRODUCTION NC II Promulgated December 2013\n\n\n\n\n\n60\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nANNEX A\nReceive and\nRespond to\nWorkplace\nCommunication\nParticipate in\nWorkplace\nCommunication\nLead Workplace\nCommunication\nUse relevant\ntechnologies\nDevelop Team\nand Individual\nWork with\nOthers\nWork in a Team\nEnvironment\nLead Small\nTeam\nSolve problems\nrelated to work\nactivities\nApply Problem\nSolving\nTechniques in\nthe Workplace\nPractice basic\nhousekeeping\nprocedures\nDemonstrate\nwork values\nDevelop and\npractice\nnegotiation\nskills\nUse\nmathematical\nconcepts and\ntechniques\nPlan and\nOrganize Work\nPractice career\nprofessionalism\nPractice\noccupational\nhealth and\nsafety\nprocedures\n\n\n\n\n\n\n\n\nSupervise\nagronomic crop\nmaintenance\nProduce fruit\nbearing crops\nUndertake\nagronomical\ncrop\nmaintenance\nactivities\nImplement\nvertebrate pest\ncontrol program\nImplement a\nplant\nestablishment\nprogram\nMaintain the\nworkplace\nPerform post\nharvest\noperations of\nmajor tropical\nfruits\nUndertake\nagronomic crop\nharvesting\nactivities\nMonitor and\noperate water\ntreatment\nprocesses\nTransport,\nhandle and\nstore chemicals\nSupport\nagronomic crop\nwork\nPerform post\nharvest\noperation of\nmajor lowland\nand semi-\ntemperate\nvegetable crops\nSave, prepare\nand store\nagricultural\nseed\nCollect samples\nfor a rural\nproduction of\nhorticulture\nmonitoring\nprogram\nSupervise\nagricultural crop\nestablishment\nSupport\nhorticultural\ncrop work\nPrepare land\nfor agricultural\ncrop production\nUndertake field\nbudding and\ngrafting\nSave, prepare\nand store\nagricultural\nseed\nImplement and\nmonitor quality\nassurance\nprocedures\nApply safety\nmeasures in\nfarm\noperations\nUse farm\ntools and\nequipment\nPerform\nestimation\nand\ncalculation\nProcess\nfarm waste\nPerform\nrecord\nkeeping\nApply\nbasic\nfirst aid\nCOMPETENCY MAP FOR AGRICULTURE, FORESTRY AND FISHERY SECTOR\nAgricultural Crops Production NCII\nBASIC\nCOMMON\nCORE\n\n--- PDF PAGE 63 ---\nTR-AGRICULTURAL CROP PRODUCTION NC II Promulgated December 2013\n\n\n\n\n\n61\n\nSupport\nirrigation work\nPrepare and\napply chemicals\nCoordinate a\nhorticultural\ncrop\nmaintenance\nprogram\nUndertake\nagronomic crop\nmaintenance\nactivities\nSupport and\nreview business\nstructures and\nrelationships\nSupport nursery\nwork\nimplement a\nplant nutrition\nprogram\nEstablish\nhorticultural\ncrops\nCoordinate\nmachinery and\nequipment\nmaintenance\nand repair for\nagricultural\ncrops\nPromote plant\nhealth\nConduct pre-\nhorticultural\nfarm operations\nControl weeds\nUndertake a\npropagation\nprogram\nOperate\npertigation\nequipment\nImplement and\nmonitor a\nproperty\nimprovement\nplan\nProduce\nvegetables\nImplement a\npost-harvest\nprogram\nCoordinate\nhorticultural\ncrop harvesting\nOperate within\na budget\nframework\nSupervise\nmaintenance of\nmachinery and\nequipment\nPlan &\nimplement a\nchemical use\nprogram\nEstablish\nagronomic\ncrops\nSupervise\nhorticultural\ncrop harvesting\nComply with\nindustry quality\nassurance\nrequirements\nKeep records\nfor a farm\nbusiness\nApply basic first\naid\nImplement\nvertebrate pest\ncontrol program\nControl weeds,\npests and /or\ndiseases in\ncrops\nSupervise\nagronomic crop\nharvesting\nAnalyze and\ninterpret\nproduction data\nConduct Variety\nand Seed\nSelection\nPerform Land\npreparation\nCarry-out Crop\nEstablishment\nManage crop\nConduct of\nHarvest and\nPost-Harvest\nOperations\nPerform nursery\noperations\nPlant crops\nCare and\nmaintain crops\nCarry-out\nharvest and\npostharvest\noperations\n\n--- PDF PAGE 64 ---\nTR-AGRICULTURAL CROP PRODUCTION NC II Promulgated December 2013\n\n\n\n\n\n\n62\n\nGLOSSARY OF TERMS\n\nFor the purpose of this standard, the word\n\n• Aflatoxin – the toxin produced by some strains of the fungi ASPERGILUS\nFLAVUS and ASPERGILUS PARASTICUS; the most potent carcinogen\nyet discovered.\n\n• Ambient condition– ordinary room temperature and relative humidity.\n\n• Ambient air – the surrounding air (atmospheric).\n\n• Ambient storage – any treatment or practice extending post harvest life\nof harvested commodity beyond that of similar commodity held under\nambient conditions without treatment.\n\n• Airflow rate – the amount of air passing through an obstruction per unit\nof time.\n\n• Curing – process of toughening and self-healing of bruises and skinned\nareas in root and tubes crops or the rapid closing of the neck of bulb crops\nunder favourable conditions\n\n• Driller – a machine for sowing in furrows\n\n• Drip Irrigation – application of water through small tubes and orifices or\nemitters which discharge small quantity of water to the base of the plant\n\n• Dry-bulb temperature – the temperature of air indicated by a standard\ntemperature\n\n• Equilibrium moisture content – the moisture content at which moisture\nin a product is in equilibrium with the surrounding air. The product does\nnot gain or loss moisture.\n\n• Fogging – to cover or envelope with fog\n\n• Foliar fertilizer – fertilizer formulation containing nitrogen, phosphorous\nand potassium plus selected micronutrient element such as (Ca, Mg, Mn,\nFe, Zn, Cl, B, Cu, S) applied by spraying on the leaves\n\n• Fumigant – a chemical compound which acts in the gaseous state to\ndestroy insects and their larvae.\n\n• Fumigation\n–\nthe\nprocess\nof\ntreating\nstored\nproducts\nwith\ninsecticides/pesticides and the like in fumes or vapor form.\n\n--- PDF PAGE 65 ---\nTR-AGRICULTURAL CROP PRODUCTION NC II Promulgated December 2013\n\n\n\n\n\n\n63\n\n• Furrow Irrigation – a method of supplying water through a canal system\nwherein water flows down or across the slope of the field\n\n• Furrowing – final step in land preparation by making furrows or beds for\nplanting\n\n• GATT – General Agreement on Tariff and Trade\n\n• Grading – the process of classifying into groups according to a set of\nrecognized criteria of quality and size, each group bearing an accepted\nname and size grouping.\n\n• Growing medium – mixture of different materials such as soil, sand,\ncompost, coir dust, rice hull, perlite, peat, etc. for growing seedlings\n\n• HACCP – Hazard Analysis Critical Control Points\n\n• Hardening – the process of gradually withholding water and exposing to\ndirect sunlight to prevent seedlings from transplanting stress/shock\n\n• Harrowing – breaking of large soil clods that are caused by plowing\n\n• Hilling-up – the process of covering the applied fertilizer material by\nraising the soil towards the base of the plant to further stabilize its stand\nfor better plant growth.\n\n• Hygrometer – an instrument that measures humidity.\n\n• Insect pest – a destructive or harmful insect.\n\n• Irrigation - any method of supplying water to sustain plant growth\n\n• Off-Baring- process of cultivating the soil away from the base of the\nplants\n\n• Pricking-off- methods of transferring of seedling to avoid overcrowding\n\n• Larvae – the first stage of the life cycle of insects after leaving the egg.\n\n• Manometer – an instrument that measures air pressure.\n\n• Maturity – the quality or state of ripeness, or of being fully developed\ngrain.\n\n• Maturity index – signs or indications that a commodity is mature and is\nready to be harvested.\n\n--- PDF PAGE 66 ---\nTR-AGRICULTURAL CROP PRODUCTION NC II Promulgated December 2013\n\n\n\n\n\n\n64\n\n• Moisture content – the conventional index used to determine whether\nthe seed is dry enough for safe storage or for milling usually expressed in\npercent (% M.C.).\n\n• Molds – superficial often woolly growth produced on various forms of\norganic matter, especially when damp or decaying.\n\n• NFA – National Food Authority\n\n• Packaging – technology or process to ensure adequate protection and\nsafe delivery of a product from the produces to the ultimate consumer.\n\n• Packing – act of putting commodities in a container.\n\n• Packinghouse – place where the preparatory steps for storage or\nmarketing are done.\n\n• Pallet – low portable platform made of wood or metal or in combination to\nfacilitate handling, storage or transport of materials as a unit load using\nforklift.\n\n• Perishables – food crops for which value and/or quality is maintained\nover a short period of time after harvest. These include fruits, vegetables,\nflowers, young coconut, nursery stocks and some staple root crops such\nas sweet potato, cassava and yam.\n\n• Postharvest disease – disease observed after harvest regardless of\nwhen or where initial infestation took place.\n\n• Post harvest handling – specific term used for the movement of\ncommodities and operations through which a commodity undergoes from\nharvest to possession of the fixed consumer, includes the technological\naspects of marketing and distribution.\n\n• Post harvest infection – infection that takes place after harvest.\n\n• Post harvest life – period of time during which a commodity is still\nacceptable for its intended purpose.\n\n• Pre cooling – strictly, it means the rapid cooling (48 hours or less) of a\ncommodity to a desired transit or storage temperature soon after harvest\nbefore it is stored or moved in transit.\n\n• Pupa – an intermediate stage of an insect that preys on one or more\nplants and animals that man wishes to preserve for his own use.\n\n--- PDF PAGE 67 ---\nTR-AGRICULTURAL CROP PRODUCTION NC II Promulgated December 2013\n\n\n\n\n\n\n65\n\n• Refrigeration – process of removing heat from a compartment or\nsubstance so that temperature is lowered and then maintained at a\ndesirable level, usually refers to refrigeration by mechanical means.\n\n• Relative humidity – the actual vapor pressure of the air relative to\nsaturation.\n\n• Respiration – biological process by which organic materials are broken\ndown to simpler forms accompanied by the release of energy and heat.\n\n• Ripening – the state of development of a fruit when it becomes soft and\nedible applies strictly to climacteric type fruit.\n\n• Rodents – refer to rats and mice which destroy grains and other stored\nproducts.\n\n• Senescence – final phase in the life of an organ in which a series of\nnormally irreversible events are initiated leading to cellular breakdown or\ndeath of the organ.\n\n• Side-dress fertilizer – additional amount of any fertilizer materials\napplied at the onset of flowering to complete the nutritional requirement of\nthe crop\n\n• Sprinkler irrigation – a mechanical method of supplying water over the\nstanding crop by means of a nozzle which is rotated by water pressure\n\n• Synthetic mulch – mulching materials made either of polyethylene or\nnon-woven fabric\n\n• Sorting – the process of classifying into groups designated by the person\nclassifying crops or commodities the produce either according to a set\ncriterion.\n\n• Standard – the set of criteria and specifications of quality determining the\ngrades, described as product characteristics such as maturity, color,\ncleanliness, shape, free from decay and blemishes and uniformity of size.\n\n• Storage – process of keeping horticultural crops in a structure designed\nto protect the stored products from inclement weather and pests for a\nshort or long period of time to await processing or movement to other\nlocation.\n\n• Storage life – the longest time produce can be kept in a sound marketable\ncondition.\n\n• Tachometer – an instrument that measures revolutions per minute\n\n--- PDF PAGE 68 ---\nTR-AGRICULTURAL CROP PRODUCTION NC II Promulgated December 2013\n\n\n\n\n\n\n66\n\n\n• Tillage – the mechanical manipulation of the soil\n\n• Transplants – vegetable seedlings produced for transplanting\n\n• Trellis – a support structure for viny crops and can either be T, I, Y, A\nshaped\n\n• Velometer – an instrument that measures velocity of air flow\n\n• Waxing – application of a thin film of surface coating to fruits and\nvegetables.\n\n• Wet-bulb temperature – temperature of moist air indicated by a\nthermometer whose bulb is covered with a moist wick which the air flow\npassing over has a velocity of 15 ft per second.\n\n--- PDF PAGE 69 ---\nTR-AGRICULTURAL CROP PRODUCTION NC II Promulgated December 2013\n\n\n\n\n\n\n67\n\nACKNOWLEDGEMENTS\n\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\ngratitude and appreciation to the many representatives of business, industry, academe\nand government agencies and labor groups who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n\n\nThis undertaking was also made possible through the collaborative project between\nTESDA and DA entitled DA-TESDA National Convergence Program on Enhancing\nAgricultural Productivity through Skills Development which is supported by the\nDepartment of Agriculture-Agricultural Training Institute.\n\n• THE TECHNICAL ADVISORY PANEL (TAP)\n\nDr. RODOLFO P. ESTIGOY\nMr. ALEJANDRO T. ESCANO\nChief\nPresident\nBureau of Post Harvest Research and\nExtension\nCentral Luzon State University, Science\nCity of Muñoz, Nueva Ecija\nMember\nPhilippine Society of Agricultural Engineer\nPhilippine Chamber of Agriculture and\nFood (PCAFI)\nMFI Bldg. Otigas Avenue Extension,\nPasig City\nDr. ALMA M. DELA CRUZ\nProfessor\nCentral Luzon State University\nMuñoz, Nueva Ecija\n\n\n• THE TECHNICAL EXPERT PANEL (TEP)\n\n\nMr. ROLANDO SIANGHIO\nMs. PILIPINAS BALANTAC\nPresident\nInstructor\nLacto Asia Pacific Corporation\nRizal Experimental Station and Pilot\nSchool Cottage Industries (RESPSCI)\n\nPasig City\nMs. MIRIAM A. ACDA\nMr. JAIME R. RACHO SR.\nChief\nAssistant Professor\nBureau of Post Harvest Research and\nExtension\nQuezon National Agricultural School\n(QNAS)\nCLSU Compound\nMuñoz, Nueva Ecija\nMalicboy, Pagbilao, Quezon\nMr. EDUARDO T. CAYABYAB\nMr. LITO BULAONG\nChief\nChief\nBureau of Post Harvest Research and\nExtension\nBureau of Post Harvest Research and\nExtension\nCLSU Compound\nCLSU Compound\n\n--- PDF PAGE 70 ---\nTR-AGRICULTURAL CROP PRODUCTION NC II Promulgated December 2013\n\n\n\n\n\n\n68\n\nMuñoz, Nueva Ecija\nMuñoz, Nueva Ecija\nMr. LORENZO A. BELINO\nBenguet Farmers Multipurpose\nCooperative\n\n\n• THE REVIEW PANEL\n\n\nMS. ALICIA S. ACOBA\nSupervising Agriculturist\nBureau of Plant Industry,\nSan Andres, Malate, Manila\n\nDR. DIVINA M. AMALIN\nBalikscientist\nCocoa Foundation of the Philippines,\n1365 E. Rodriguez Sr. Avenue, Quezon\nCity\n\nENGR. ENGR. REYNALDO P.\nGREGORIO\nSupervising Science Research\nSpecialist\nPhilippine Center for Post Harvest\nDevelopment and Mechanization,\nCLSU Compound, Science City of\nMuñoz\nMR. PROCESO H.