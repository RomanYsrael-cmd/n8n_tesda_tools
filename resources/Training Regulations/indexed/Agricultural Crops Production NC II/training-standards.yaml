    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: AGRICULTURAL CROPS PRODUCTION NC Level NC II\n\nNominal Training Duration:\n 18 hrs – Basic Competencies\n\n\n\n\n 58 hrs – Common Competencies\n\n\n 260 hrs – Core Competencies\n\n\n -----------\n\n\n 336 hrs – Total\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills\nof performing nursery operations, planting crops, caring and maintaining crops and\ncarrying-out harvest and post harvest operations. It also includes competencies in\nworkplace communication, teamwork, safety in the use of hand tools and equipment,\nhousekeeping antd processing of farm wastes.\n\n\n\nBASIC COMPETENCIES\n18 hours\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant\nwork related\ndocuments.\n1.3 Participate in\nworkplace meeting and\ndiscussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a\nteam.\n2.2 Describe work as a\nteam member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 55 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013\n\n54\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment.\n• Discussion\n• Interaction\n\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Identify hazards and\nrisks\n4.2 Evaluate hazard and\nrisks\n4.3 Control hazards and\nrisks\n4.4 Maintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n\nCOMMON COMPETENCIES\n58 hours\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1\nApply appropriate\nsafety measures while\nworking in farm\n1.2\nSafe keep/dispose\ntools, materials and\noutfit.\n• Self-\npaced/modular\n• Lecture/Discus\nsion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n2. Use farm tools\nand equipment\n2.1\nPrepare and use farm\ntools\n2.2\nPrepare and operate\nfarm equipment\n2.3\nPerform preventive\nmaintenance\nprocedures/practices\n• Self-\npaced/modular\n• Lecture/Discus\nsion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n•\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n3. Perform\nestimation and\nbasic calculation\n\n3.1\nPerform estimation\n3.2\nPerform basic\nworkplace calculation\n\n• Self-\npaced/modular\n• Lecture/Discus\nsion\n• Interaction\n• Practical\nExercise\n• Oral/Written\nexamination\n• Practical\nexercise\n\n--- PDF PAGE 56 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013\n\n55\n4. Process farm\nwastes\n4.1\nCollect farm wastes\n4.2\nIdentify and segregate\nwastes\n4.3\nTreat and process farm\nwastes\n4.4\nPerform housekeeping\n\n• Self-\npaced/modular\n• Lecture/Discus\nsion\n• Interaction\n• Practical\nDemonstration\n•\nVisit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n5. Perform record\nkeeping\n5.1\nCarry out inventory\nactivities\n5.2\nMaintain production\nrecord\n5.3\nPrepare financial\nrecords\n• Self-\npaced/modular\n• Lecture/Discus\nsion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Practical\nDemonstration\n\n\nCORE COMPETENCIES\n260 hour\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nnursery\noperations\n1.1. Prepare nursery tools,\nfarm implements and\nsimple equipment\n1.2. Maintain nursery\nfacilities\n1.3. Handle seeds/planting\nmaterial\n1.4. Prepare growing media\n1.5. Conduct propagation\nactivities\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n\n• Written\nexamination\n• Oral\nevaluation\n• Demonstration\nwith questions\n\n2. Plant crops\n2.1\nPrepare land for\nplanting\n2.2\nConduct field lay-out\n2.3\nDig holes\n2.4\nPerform direct seeding\n2.5\nTransplant seedlings\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n• Written\nexamination\n• Oral\nevaluation\n• Demonstration\nwith questions\n3. Care and\nmaintain\ncrops\n3.1. Apply pest control\nmeasure\n3.2. Apply fertilizer\n3.3. Water crops\n3.4. Perform pruning\n3.5. Perform physical growth-\nenhancing practices\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n• Written\nexamination\n• Oral\nevaluation\n• Demonstration\nwith questions\n\n--- PDF PAGE 57 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013\n\n56\n4. Carry-out\nharvest and\npostharvest\noperations\n4.1. Perform pre – harvest\noperations\n4.2. Perform harvesting\nactivity\n4.3. Perform postharvest\noperation\n4.4. Monitor storage pest\nand diseases\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n• Written\nexamination\n• Oral\nevaluation\n• Demonstration\nwith questions"
