      "source_text": "SECTION 3. TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for AGRICULTURAL CROPS\nPRODUCTION NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: AGRICULTURAL CROPS PRODUCTION NC Level NC II\n\nNominal Training Duration:\n 18 hrs – Basic Competencies\n\n\n\n\n 58 hrs – Common Competencies\n\n\n 260 hrs – Core Competencies\n\n\n -----------\n\n\n 336 hrs – Total\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills\nof performing nursery operations, planting crops, caring and maintaining crops and\ncarrying-out harvest and post harvest operations. It also includes competencies in\nworkplace communication, teamwork, safety in the use of hand tools and equipment,\nhousekeeping antd processing of farm wastes.\n\n\n\nBASIC COMPETENCIES\n18 hours\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant\nwork related\ndocuments.\n1.3 Participate in\nworkplace meeting and\ndiscussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a\nteam.\n2.2 Describe work as a\nteam member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 55 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013\n\n54\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment.\n• Discussion\n• Interaction\n\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Identify hazards and\nrisks\n4.2 Evaluate hazard and\nrisks\n4.3 Control hazards and\nrisks\n4.4 Maintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n\nCOMMON COMPETENCIES\n58 hours\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1\nApply appropriate\nsafety measures while\nworking in farm\n1.2\nSafe keep/dispose\ntools, materials and\noutfit.\n• Self-\npaced/modular\n• Lecture/Discus\nsion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n2. Use farm tools\nand equipment\n2.1\nPrepare and use farm\ntools\n2.2\nPrepare and operate\nfarm equipment\n2.3\nPerform preventive\nmaintenance\nprocedures/practices\n• Self-\npaced/modular\n• Lecture/Discus\nsion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n•\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n3. Perform\nestimation and\nbasic calculation\n\n3.1\nPerform estimation\n3.2\nPerform basic\nworkplace calculation\n\n• Self-\npaced/modular\n• Lecture/Discus\nsion\n• Interaction\n• Practical\nExercise\n• Oral/Written\nexamination\n• Practical\nexercise\n\n--- PDF PAGE 56 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013\n\n55\n4. Process farm\nwastes\n4.1\nCollect farm wastes\n4.2\nIdentify and segregate\nwastes\n4.3\nTreat and process farm\nwastes\n4.4\nPerform housekeeping\n\n• Self-\npaced/modular\n• Lecture/Discus\nsion\n• Interaction\n• Practical\nDemonstration\n•\nVisit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n5. Perform record\nkeeping\n5.1\nCarry out inventory\nactivities\n5.2\nMaintain production\nrecord\n5.3\nPrepare financial\nrecords\n• Self-\npaced/modular\n• Lecture/Discus\nsion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Practical\nDemonstration\n\n\nCORE COMPETENCIES\n260 hour\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nnursery\noperations\n1.1. Prepare nursery tools,\nfarm implements and\nsimple equipment\n1.2. Maintain nursery\nfacilities\n1.3. Handle seeds/planting\nmaterial\n1.4. Prepare growing media\n1.5. Conduct propagation\nactivities\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n\n• Written\nexamination\n• Oral\nevaluation\n• Demonstration\nwith questions\n\n2. Plant crops\n2.1\nPrepare land for\nplanting\n2.2\nConduct field lay-out\n2.3\nDig holes\n2.4\nPerform direct seeding\n2.5\nTransplant seedlings\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n• Written\nexamination\n• Oral\nevaluation\n• Demonstration\nwith questions\n3. Care and\nmaintain\ncrops\n3.1. Apply pest control\nmeasure\n3.2. Apply fertilizer\n3.3. Water crops\n3.4. Perform pruning\n3.5. Perform physical growth-\nenhancing practices\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n• Written\nexamination\n• Oral\nevaluation\n• Demonstration\nwith questions\n\n--- PDF PAGE 57 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013\n\n56\n4. Carry-out\nharvest and\npostharvest\noperations\n4.1. Perform pre – harvest\noperations\n4.2. Perform harvesting\nactivity\n4.3. Perform postharvest\noperation\n4.4. Monitor storage pest\nand diseases\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n• Written\nexamination\n• Oral\nevaluation\n• Demonstration\nwith questions\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n\no The training is based on curriculum developed from the\ncompetency standards;\no Learning is modular in its structure;\no Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\no Training is based on work that must be performed;\no Training materials are directly related to the competency\nstandards and the curriculum modules;\no Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\no Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\no Training allows for multiple entry and exit; and\no Training programs are registered with UTPRAS.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by\nthe competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\no The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and\nin-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\no Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer facilitates the training delivery\no Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\no Supervised industry training or on-the-job training is an approach\nin training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n\n--- PDF PAGE 58 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013\n\n57\no Distance learning is a formal education process in which majority\nof the instruction occurs when the students and instructor are not\nin the same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\no Project-Based Instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate projects\nthat have real world applications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess the\nfollowing requirements:\n\n•\nAble to read and write;\n•\nWith good moral character;\n•\nAble to communicate, both orally and in writting; and\n•\nPhysically fit and mentally healthy as certified by a Public Health Officer\n\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n AGRICULTURAL CROPS PRODUCTION NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor Agricultural Crops Production NC II\n\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nQTY\nQTY.\n25 pcs.\n• Budding knife\n5\nunits\n• Soil moisture and\npH meter\n25 pcs.\n• Petri dish\n12 pcs.\n• Bolo\n5\nunits\n• Wheel barrow\n25 pcs.\n• Calculator\n5 pcs.\n• Basin\n1 unit\n• Comb-tooth\nharrow*\n5 units\n• Puncher\n10 pcs.\n• Broomstick\n1 unit\n• Hand tractor*\n100\npcs.\n• Seedling tray\nwith different\nholes\n25 pcs.\n• Pail-12Li.\n5\nunits\n• Knapsack\nsprayer\n10 m.\n• Agri bag/plastics\nCutting tools\n5\nunits\n• Hand sprayer\n1000\npcs.\n• PE bag with\ndifferent sizes\n5 pcs.\no Pruning saw\n1 unit\n• Power sprayer\n10\nsacks\n• Growing media\n(50 kg.)\n5 pcs.\no Hedge shear\n2\nunits\n• Grass cutter*\n1 bot.\n• Rooting\nhormone\n5 pcs.\no Kitchen knife\n5\nunits\n• Overhead\nsprinkler\n25 pcs.\n• Basket\n\n--- PDF PAGE 59 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013\n\n58\n5 pcs.\no Cutter\n5\nunits\n• Sprinkler mist\n20 m.\n• Fish net\n5 pcs.\no Pliers\n5\nunits\n• Button dripper\n5 pcs.\n• Strainer\n25 pcs.\no Pruning\nshears\n1 unit\n• LCD/Overhead\nprojector\n10 kilos\n• Plastic sheet\nDigging tools\n1 unit\n• Post harvest\ntreatment\nequipment*\n10 kilos\n• Fertilizers\n5 pcs.\no Steel bar\n1 unit\n• Desktop\ncomputer/laptop\n1 kilo\n• Flower inducer\n5 pcs.\no Pick mattock\n25\nunits\n• PPE\n2 pcs.\n• Board marker\n5 pcs.\no Hole digger\n\n\n1 unit\n• White board\n5 pcs.\no Garden hoe\n\n\n1 pc.\n• Eraser\n5 pcs.\no Shovel\n\n\n1 bot.\n• Pesticides\nCrates\n\n\n1 roll\n• Rope\n25 pcs.\no Wooden\ncrates\n\n\n1 box\n• Rubber band\n25 pcs.\no Plastic\ncrates\n\n\n5 units\n• Seed box\n25 pcs.\no Styro crates\n\n100\npcs.\n• Seedlings\nassorted\nHarvesting tools\n\n1 box\n• Detergent soap\n25 pcs.\no Scythe\n\n1\nbundle\n• Bamboo stick\n13 pcs.\no Harvesting\npole\n\n1 ream\n• Bond paper\n2 pcs.\no Ladder\n\n1 box\n• Clips\n25 pcs.\no Hand trowel\n\n\n1 set\n• First aid\nsupplies\n25 pcs.\n• Hard Hat\n\n\n5 pcs.\n• Permanent pens\n2 pcs.\n• Measuring cups\n\n1 roll\n• Mulching\nmaterials\n12 pcs.\n• Sprinklers\n\n1 roll\n• String\n1 pc.\n• tools cabinet\n\n1 roll\n• Plastic twine\n1 pc.\n• Plow\n\n5 pcs.\n• Brush\n25 pcs.\n• Scissors\n\n1 pc.\n• Measuring tape\n5 pcs.\n• Rake\n\n5 pcs.\n• Meter stick\n1 unit\n• Soil auger\n\n2 pcs.\n• Sharpening\nstone\n\n--- PDF PAGE 60 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013\n\n59\n3.5 TRAINING FACILITIES\n\nAGRICULTURAL CROPS PRODUCTION NC II\n\nBased on a class size of 25 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nTOTAL\nAREA IN\nSQ.\nMETERS\nGRAND TOTAL\nAREA IN SQ.\nMETERS\nA. Building (permanent)\n\n215.00\n• Student/Trainee\nWorking Space\n2.00 x 1.00 per\nstudent/trainee\n2.00 per\nstudent\n50.00\n\n• Learning Resource\nCenter\n3.00 x 5.00\n15.00\n15.00\n\n• Activity Room\n(including facilities,\nwash room, and\nstore room)\n2.00 x 3.00\n6.00 per\nstudent\n150.00\n\nB. Demo Farm\n2,550.00\n• Nursery area\n• Field plot and\nWorking shed\n(100sq.m.)\n1 x 2 per\ntrainee\n10 x 10 per\ntrainee\n2 per\ntrainee\n100 per\ntrainee\n50.00\n2500.00\n\n\n\n\n3.6 TRAINER’S QUALIFICATIONS FOR AGRICULTURE SECTOR\n\nTrainers who will deliver the training on\nAGRICULTURAL CROPS\nPRODUCTION NCII should have the following:\n\n• Must be a holder of National TVET Trainer Certificate I (TM I and\nAgricultural Crops Production NCII)\n• Preferrably computer literate\n• Must be physically and mentally fit\n\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7.\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency . A certificate of achievement is issued for each\nunit of competency.\n\n--- PDF PAGE 61 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013\n\n60"
