        "source_title": "CARRY-OUT HARVEST AND POSTHARVEST OPERATIONS",
        "source_text": "--- PDF PAGE 48 ---\nTR-Agricultural Crops Production NCII                     Promulgated December 2013 \n \n47\nUNIT OF COMPETENCY \n: \nCARRY-OUT \nHARVEST \nAND \nPOSTHARVEST \nOPERATIONS\nUNIT CODE \n: \nAFF610304 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes  \nrequired to perform harvest and postharvest operations \nof major agricultural crops including maintaining quality \nof produce for distribution.  This unit also includes proper \nuse of tools and equipment required to perform the \nactivities. This unit does not include secondary \nprocessing.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Perform pre – harvest \noperations \n1.1 \nCrop maturity is identified according to parameters \naffecting physiological growth and physical indicators. \n1.2 \nRecords of crop agronomic history is verified and \nreferenced for maturity. \n1.3 \nObstructions from the field are removed for efficient \nharvesting  \n1.4 \nHarvesting tools and materials, and temporary shed \nare readied \n1.5\nRecords regarding crops to be harvested are checked\n2. Perform harvesting \nactivity \n2.1 \nAppropriate harvesting methods are implemented based \non best cultural practices for each crop using suitable \ntools  \n2.2 \nCrops are handled according to the postharvest \ntreatment. \n2.3 \nCrops are harvested based on maturity indices and \ncharacteristics affecting harvest quality \n2.4\nHarvesting is performed while observing GAP principles\n3. Perform postharvest \noperation \n3.1 Postharvest operations are employed based on standard \nare followed. \n3.2  Use of postharvest equipment is monitored avoiding \ndamage to crop in line with manufacturer/enterprise \nprocedures. \n3.3 Handling and packaging are done according to variety \nand destination. \n3.4 Crops are stored and stacked in cool dry place prior to \ndistribution in line with enterprise procedures\n4. Monitor storage pest \nand diseases \n4.1 \nPest are identified based on references for storage pest \nand diseases \n4.2 \nIdentified storage pest and diseases are logged and \nreported to immediate authority.\n\n--- PDF PAGE 49 ---\nTR-Agricultural Crops Production NCII                     Promulgated December 2013 \n \n48\nRANGE OF VARIABLES \n \n \nVARIABLE \nSCOPE \n1. Physiological growth \n \nInclude the following: \n1.1 Days after flower induction \n1.2 Days after fruit setting\n2. Physical indicators \n \nInclude the following: \n2.1. \nChange in color \n2.2. \nChange in size \n2.3.\nChange in texture\n3. Agronomic history \nInclude the following: \n3.1 Nursery source \n3.2 Variety of plant \n3.3 Planting calendar \n3.3.1 Days after planting \n3.3.2 Days at flowering \n3.3.3 Days at fruit set \n4. Obstructions \nMay include but not limited to: \n4.1. Weeds \n4.2. Dead branches \n4.3. Stakes and wedges\n5. Harvesting tools and \nmaterials \nMay include the following: \n5.1. \nPicking poles \n5.2. \nScythes \n5.3. \nScissors \n5.4. \nShears \n5.5. \nShovels \n5.6. \nCollecting baskets with liners \n5.7. \nHarvesting crates with liner \n5.8. \nContainer with clean water with preservative \n5.9. \nSacks \n5.10. Twines \n5.11. Labels and markers \n6. Records  \nInclude the following: \n6.1. \nCrop history \n6.2. \nFarm calendar \n6.3. \nFarm records\n7. Crops \nMay include the following but not limited to: \n7.1. Fruitcrop \n7.1.1. Mangoes \n7.1.2. Papayas \n7.1.3. Pineapple \n7.1.4. Banana \n7.1.5. Citrus \n7.2. Plantation crop \n7.2.1. Coffee\n\n--- PDF PAGE 50 ---\nTR-Agricultural Crops Production NCII                     Promulgated December 2013 \n \n49\n7.2.2. Cacao \n7.2.3. Abaca \n7.2.4. Coconut \n7.2.5. Sugarcane \n7.3. Forage  \n7.4. Ornamentals \n7.4.1. Rose \n7.4.2. Sampaguita \n7.4.3. Anthurium \n7.4.4. Chrysanthemum \n \n7.5. Cereals \n7.5.1. Rice \n7.5.2. Corn \n7.6. Vegetables \n7.6.1. Leafy \n7.6.2. Fruit vegetable \n7.6.3. Legumes \n7.6.4. Bulbs \n \n7.7. Medicinal plants \n7.7.1. Sambong \n7.7.2. Lagundi \n7.7.3. Tsaang-gubat \n7.7.4. Yierba-buena \n7.7.5. Acapulko \n7.7.6. Bayabas \n7.7.7. Ampalaya \n7.7.8. Pansit-pansitan \n7.7.9. Niyog-niyugan \n7.7.10. Bawang \n \n7.8. Essential Oil plants \n7.8.1. Ilang-ilang \n7.8.2. Sampaguita \n7.8.3. Citronella \n7.8.4. Vanilla \n \n7.9. Culinary Herbs \n7.9.1. basil \n7.9.2. lemon grass \n7.9.3. mint \n7.9.4. tarragon \n7.9.5. parsley \n \n7.10. Spices \n7.10.1. black pepper \n7.10.2. chili \n7.10.3.\n\n--- PDF PAGE 51 ---\nTR-Agricultural Crops Production NCII                     Promulgated December 2013 \n \n50\n8. Postharvest \ntreatments \nMay include the following: \n8.1 \nHot water treatment \n8.2 \nVapor heat treatment \n8.3 \nChemical treatment \n8.4 \nBest practices in drying \n8.5 \nPre-cooling treatment\n9. Characteristics \naffecting harvest \nInclude the following: \n9.1. \nContinued occurrence of physiological changes \n9.2. \nHigh in water content \n9.3. \nSusceptible to attack by pathogens and insects\n10. Postharvest \noperation \nInclude the following: \n10.1. \nWashing \n10.2. \nCleaning \n10.3. \nSorting \n10.4. \nTrimming \n10.5. \nChemical Treatment \n10.6. \nGrading \n10.7. \nFermenting \n10.8. \nDrying \n10.9. \nBlanching \n11. Postharvest \nequipment \nInclude the following: \n11.1. Hot water treatment machine \n11.2. Sorter \n11.3. Weighing scale\n12. Damage  \nInclude the following: \n12.1. Bruising \n12.2. Wounding \n12.3. Abrasion\n13. Packaging \nIncludes: \n13.1. Crates (wooden, plastics andstyro) \n13.2. Paper wrap \n13.3. Carton box \n13.4. PEB(Polyethylene bags) \n13.5. Styro \n13.6. Sacks/bags\n14. Storage and stacking \n14.1. On-farm storage \n14.2. Off-farm storage\n15. References \n15.1. Pictorial guide \n15.2. Posters \n15.3. Pamphlets\n16. Storage pest and \ndiseases \n16.1. Insect pest \n16.2. Rodents \n16.3. Fungi \n16.4. Bacteria\n\n--- PDF PAGE 52 ---\nTR-Agricultural Crops Production NCII                     Promulgated December 2013 \n \n51\nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared field and materials/tools used for harvesting \nand postharvest \n1.2 Identified and applied maturity indices when harvesting \n1.3 Harvested and handled crops properly  \n1.4 Maintained quality of crops during distribution and \nstorage applying consideration for optimum condition \n1.5 Monitored storage pest and diseases\n2. Required \nKnowledge and \nAttitudes  \n \n \n2.1 Safety Practices \n2.1.1 Knowledge on HACCP principles \n2.1.2 Knowledge on Good Manufacturing Practices \n2.2 Mathematics and Measurement \n2.2.1 Measurement of humidity and temperature \n2.2.2 Measurement of area, volume, and weight \n2.2.3 Simple mathematical computation \n2.3 Tools & Equipment: Uses and Specification \n2.3.1 Use of measuring devices  \n2.3.2 Operation of machines and equipment \n2.4 Systems, Processes and Operations \n2.4.1 Principles and practices in harvest and postharvest  \n2.4.1.1 Different storage pest and diseases \n2.4.1.2 Different handling and packaging of produce \n2.4.2 Identification of postharvest facilities,  \n2.5 Values \n2.5.1 Effective team player \n2.5.2 Smooth Interpersonal Relationship (SIR) \n2.5.3 Observant of work ethics\n3. Required Skills \n3.1 \nCommunicating ideas and info \n3.2 \nCollecting information \n3.3 \nProper use and maintenance of tools and equipment \n3.4 \nMonitoring skills \n3.5 \nMaintain quality of stored commodities \n3.6\nPhysical analysis of crop for quality standards \n4. \nResource \nImplications \nThe following resources should be provided: \n4.1 \nFacilities and equipment appropriate for harvest and      \n postharvest of crops \n4.2 \nSupplies and materials contingent to machines \n4.3 \nFarm house \n4.3.1 Packing area \n4.3.2 Storage facilities \n4.4 \nFarm tools/ implements/ equipment \n4.5 \nWriting instruments \n4.6 \nFarm supplies \n4.7 \nLogbooks \n4.8 \nReferences (catalogue, protocols, field guides, GAP, \nOHSS manuals)\n\n--- PDF PAGE 53 ---\nTR-Agricultural Crops Production NCII                     Promulgated December 2013 \n \n52\n5. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 \nDirect observation and questioning \n5.2 \nDemonstration (simulated)  \n5.3 \nOral interview and written test \n5.4\nThird party report\n6. \nContext of \nAssessment \n6.1 Competency may be assessed individually in the actual \nworkplace or through TESDA accredited institution \n6.1.1 Private farms \n6.1.2 Farm school\n",
