          "source_text": "VARIABLE \nSCOPE \n1. Physiological growth \n \nInclude the following: \n1.1 Days after flower induction \n1.2 Days after fruit setting\n2. Physical indicators \n \nInclude the following: \n2.1. \nChange in color \n2.2. \nChange in size \n2.3.\nChange in texture\n3. Agronomic history \nInclude the following: \n3.1 Nursery source \n3.2 Variety of plant \n3.3 Planting calendar \n3.3.1 Days after planting \n3.3.2 Days at flowering \n3.3.3 Days at fruit set \n4. Obstructions \nMay include but not limited to: \n4.1. Weeds \n4.2. Dead branches \n4.3. Stakes and wedges\n5. Harvesting tools and \nmaterials \nMay include the following: \n5.1. \nPicking poles \n5.2. \nScythes \n5.3. \nScissors \n5.4. \nShears \n5.5. \nShovels \n5.6. \nCollecting baskets with liners \n5.7. \nHarvesting crates with liner \n5.8. \nContainer with clean water with preservative \n5.9. \nSacks \n5.10. Twines \n5.11. Labels and markers \n6. Records  \nInclude the following: \n6.1. \nCrop history \n6.2. \nFarm calendar \n6.3. \nFarm records\n7. Crops \nMay include the following but not limited to: \n7.1. Fruitcrop \n7.1.1. Mangoes \n7.1.2. Papayas \n7.1.3. Pineapple \n7.1.4. Banana \n7.1.5. Citrus \n7.2. Plantation crop \n7.2.1. Coffee\n\n--- PDF PAGE 50 ---\nTR-Agricultural Crops Production NCII                     Promulgated December 2013 \n \n49\n7.2.2. Cacao \n7.2.3. Abaca \n7.2.4. Coconut \n7.2.5. Sugarcane \n7.3. Forage  \n7.4. Ornamentals \n7.4.1. Rose \n7.4.2. Sampaguita \n7.4.3. Anthurium \n7.4.4. Chrysanthemum \n \n7.5. Cereals \n7.5.1. Rice \n7.5.2. Corn \n7.6. Vegetables \n7.6.1. Leafy \n7.6.2. Fruit vegetable \n7.6.3. Legumes \n7.6.4. Bulbs \n \n7.7. Medicinal plants \n7.7.1. Sambong \n7.7.2. Lagundi \n7.7.3. Tsaang-gubat \n7.7.4. Yierba-buena \n7.7.5. Acapulko \n7.7.6. Bayabas \n7.7.7. Ampalaya \n7.7.8. Pansit-pansitan \n7.7.9. Niyog-niyugan \n7.7.10. Bawang \n \n7.8. Essential Oil plants \n7.8.1. Ilang-ilang \n7.8.2. Sampaguita \n7.8.3. Citronella \n7.8.4. Vanilla \n \n7.9. Culinary Herbs \n7.9.1. basil \n7.9.2. lemon grass \n7.9.3. mint \n7.9.4. tarragon \n7.9.5. parsley \n \n7.10. Spices \n7.10.1. black pepper \n7.10.2. chili \n7.10.3.\n\n--- PDF PAGE 51 ---\nTR-Agricultural Crops Production NCII                     Promulgated December 2013 \n \n50\n8. Postharvest \ntreatments \nMay include the following: \n8.1 \nHot water treatment \n8.2 \nVapor heat treatment \n8.3 \nChemical treatment \n8.4 \nBest practices in drying \n8.5 \nPre-cooling treatment\n9. Characteristics \naffecting harvest \nInclude the following: \n9.1. \nContinued occurrence of physiological changes \n9.2. \nHigh in water content \n9.3. \nSusceptible to attack by pathogens and insects\n10. Postharvest \noperation \nInclude the following: \n10.1. \nWashing \n10.2. \nCleaning \n10.3. \nSorting \n10.4. \nTrimming \n10.5. \nChemical Treatment \n10.6. \nGrading \n10.7. \nFermenting \n10.8. \nDrying \n10.9. \nBlanching \n11. Postharvest \nequipment \nInclude the following: \n11.1. Hot water treatment machine \n11.2. Sorter \n11.3. Weighing scale\n12. Damage  \nInclude the following: \n12.1. Bruising \n12.2. Wounding \n12.3. Abrasion\n13. Packaging \nIncludes: \n13.1. Crates (wooden, plastics andstyro) \n13.2. Paper wrap \n13.3. Carton box \n13.4. PEB(Polyethylene bags) \n13.5. Styro \n13.6. Sacks/bags\n14. Storage and stacking \n14.1. On-farm storage \n14.2. Off-farm storage\n15. References \n15.1. Pictorial guide \n15.2. Posters \n15.3. Pamphlets\n16. Storage pest and \ndiseases \n16.1. Insect pest \n16.2. Rodents \n16.3. Fungi \n16.4. Bacteria\n\n--- PDF PAGE 52 ---\nTR-Agricultural Crops Production NCII                     Promulgated December 2013 \n \n51"
