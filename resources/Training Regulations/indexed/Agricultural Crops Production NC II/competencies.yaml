        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \n1.1 Carry-out land clearing \n1.2 Conducted proper soil sampling/collection \n1.3 Performed appropriate land preparation \n1.4 Laid out site for planting \n1.5 Dug holes \n1.6 Sown seeds \n1.7 Planted and transplanted seeds/seedlings/saplings\n2. Required Knowledge \nand Attitudes \n \n2.1 Systems of planting \n2.2 Handling of fertilizers \n2.3 Proper use and maintenance of cutting, digging and \ntillage tools \n2.4 Use of measuring device \n2.5 Proper use of tools and equipment \n2.6 Occupational Health and Safety Standards \n2.7 Good Agriculture Practice Standards by BAFPS \n2.8 Waste management standards \n2.9 Collection of soil sample \n3. Required Skills \n3.1. Proper handling of tools and equipment \n3.2. Fertilizer application \n3.3. Interpret lay-out \n3.4. Digging holes \n3.5. Operate hand tractors\n4. Resource \nImplications \nThe following resources should be provided: \n4.1. Tool room and farm house \n4.2. Farm tools/ implements/ equipment \n4.3. Writing device \n4.4. Farm supplies \n4.5. Logbooks \n4.6. References (fertilizer and pesticide manual/ catalogue, \nprotocols, field guides, OHSP and GAP manuals) \n4.7. Production guide\n5. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. Direct Observation \n5.2. Demonstration \n5.3. Oral interview and/or written test \n5.4. Third party report\n6. Context of \nAssessment \n6.1. Competency may be assessed individually in the \nactual workplace or through accredited institution\n\n--- PDF PAGE 44 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n43\nUNIT OF COMPETENCY \n:\nCARE AND MAINTAIN CROPS \nUNIT CODE \n:"
        },
        "source_text": "AFF 610302\n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to conduct activities related to land preparation \nand planting of agricultural crops. This unit also includes \nproper handling of seeds/seedlings/saplings for planting \nand transplanting, proper use of tools and equipment, \nconduct land preparation and field lay-out. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Prepare \nland for \nplanting \n1.1 Tools, materials and equipment are prepared for land clearing \n1.2 The land is cleared according to prescribed methods of land \npreparation \n1.3 Debris are removed and disposed according to waste management \nstandards. \n1.4 Soil samples are collected for analysis based on standard procedure \n1.5 Land preparation is conducted according to crop requirement. \n1.6 Basal fertilizer is applied based on crop requirement \n1.7 Safety procedures for fertilizer application is followed according to \nOSHS\n2. Conduct \nfield lay-out\n2.1 Tools and materials are prepared for field lay-out. \n2.2 Interpret field lay-out plan according to the recommended planting \nsystem. \n2.3\nField is laid-out according to recommended planting system\n3. Dig holes \n3.1 Diggings of holes are performed based on crop requirement. \n3.2 Top soil is separated to be used in covering the hole after planting. \n3.3 Basal fertilizer application is performed based on recommended \namount.\n4. Perform \ndirect \nseeding \n4.1 Seeds are planted according to recommended rate, distance and \ndepth \n4.2 Replanting are timely done according to recommended practices for a \nparticular crop \n4.3 Safety procedures are followed according to Occupational Safety and \nHealth Standards (OSHS) and Good Agricultural Practices (GAP)\n5. Transplant \nseedlings \n5.1 \nHandling of seedlings from nursery is performed based on prescribed \npractices. \n5.2 \nTransplanting of seedlings is done based on crop practices \n5.3 \nRe-bagging is done for a particular crop requirement \n5.4 \nReplanting is timely done based on planting protocol. \n5.5 \nSafety procedures are followed according to Occupational Safety and \nHealth Standards (OSHS) and Good Agricultural Practices (GAP)\n\n--- PDF PAGE 42 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n41\nRANGE OF VARIABLES \n \n \nVARIABLE \nSCOPE \n1. Tools, materials and \nequipment \nInclude but not limited to the following: \n1.1. Bolo \n1.2. Scythe \n1.3. Spade or shovel \n1.4. Garden hoe \n1.5. Rake \n1.6. Grasscutter \n1.7. Compost \n1.8. Hand tractors and attachments\n2. Debris \n \nInclude but not limited to the following: \n2.1. Stones \n2.2. Sticks \n2.3. Unwanted vegetation \n2.4.\nOther garbage\n3. Land preparation \nInclude but not limited to the following: \n3.1. \nPlowing \n3.2. \nHarrowing \n3.3. \nLeveling \n3.4.\nFurrowing\n4. Crop \nMay include the following: \n4.1. \nOrnamental plants \n4.2. \nPlantation crops \n4.3. \nFruit crops \n4.4. \nVegetables \n4.5. \nRoot crops \n4.6. \nForage crops \n4.7. \nCereals \n4.8.\nHerbs and spices\n5. Fertilizer \nInclude the following: \n5.1. \nOrganic \n5.2.\nInorganic \n6. Planting system \nMay include but not limited to the following: \n6.1 Open Field \n6.1.1. Raised bed \n6.1.2. Square \n6.1.3. Quincunx or diagonal \n6.1.4. Hexagonal or triangular \n6.1.5. Contour system \n6.1.6. Single row \n6.1.7. Double row \n6.1.8. Broadcast method \n6.2 Green house \n6.2.1. Raised bed \n6.2.2. Potted\n\n--- PDF PAGE 43 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n42\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n1.1 Carry-out land clearing \n1.2 Conducted proper soil sampling/collection \n1.3 Performed appropriate land preparation \n1.4 Laid out site for planting \n1.5 Dug holes \n1.6 Sown seeds \n1.7 Planted and transplanted seeds/seedlings/saplings\n2. Required Knowledge \nand Attitudes \n \n2.1 Systems of planting \n2.2 Handling of fertilizers \n2.3 Proper use and maintenance of cutting, digging and \ntillage tools \n2.4 Use of measuring device \n2.5 Proper use of tools and equipment \n2.6 Occupational Health and Safety Standards \n2.7 Good Agriculture Practice Standards by BAFPS \n2.8 Waste management standards \n2.9 Collection of soil sample \n3. Required Skills \n3.1. Proper handling of tools and equipment \n3.2. Fertilizer application \n3.3. Interpret lay-out \n3.4. Digging holes \n3.5. Operate hand tractors\n4. Resource \nImplications \nThe following resources should be provided: \n4.1. Tool room and farm house \n4.2. Farm tools/ implements/ equipment \n4.3. Writing device \n4.4. Farm supplies \n4.5. Logbooks \n4.6. References (fertilizer and pesticide manual/ catalogue, \nprotocols, field guides, OHSP and GAP manuals) \n4.7. Production guide\n5. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. Direct Observation \n5.2. Demonstration \n5.3. Oral interview and/or written test \n5.4. Third party report\n6. Context of \nAssessment \n6.1. Competency may be assessed individually in the \nactual workplace or through accredited institution\n\n--- PDF PAGE 44 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n43\nUNIT OF COMPETENCY \n:\nCARE AND MAINTAIN CROPS \nUNIT CODE \n:"
      },
