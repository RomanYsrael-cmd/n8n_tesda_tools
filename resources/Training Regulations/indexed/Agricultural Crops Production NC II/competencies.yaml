  "source_section_text": "SECTION 2 \n \nCOMPETENCY STANDARDS \n \nThese guidelines are set to provide the Technical Vocational Education and \nTraining (TVET) providers with information and other important requirements to \nconsider when designing training programs for AGRICULTURAL CROPS \nPRODUCTION NC II. \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION \nUNIT CODE \n : 500311105 \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey \nworkplace \ninformation \n1.1 Specific and relevant information is accessed from \nappropriate sources \n1.2 Effective questioning, active listening and speaking \nskills are used to gather and convey information \n1.3 Appropriate medium is used to transfer information and \nideas \n1.4 Appropriate non- verbal communication is used \n1.5 Appropriate lines of communication with supervisors \nand colleagues are identified and followed \n1.6 Defined workplace procedures for the location and \nstorage of information are used \n1.7 Personal interaction is carried out clearly and concisely\n2. Participate in \nworkplace meetings \nand discussions \n2.1 Team meetings are attended on time \n2.2 Own opinions are clearly expressed and those of \nothers are listened to without interruption \n2.3 Meeting inputs are consistent with the meeting \npurpose and established protocols \n2.4 Workplace interactions are conducted in a courteous \nmanner \n2.5 Questions about simple routine workplace procedures \nand maters concerning working conditions of \nemployment are asked and responded to \n2.6 Meetings outcomes are interpreted and implemented\n3. Complete relevant \nwork related \ndocuments \n3.1 Range of forms relating to conditions of employment \nare completed accurately and legibly \n3.2 Workplace data is recorded on standard workplace \nforms and documents \n3.3 Basic mathematical processes are used for routine \ncalculations \n3.4 Errors in recording information on forms/ documents \nare identified and properly acted upon \n3.5 Reporting requirements to supervisor are completed \naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n4\nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Appropriate sources \n1.1. \nTeam members \n1.2. \nSuppliers \n1.3. \nTrade personnel \n1.4. \nLocal government \n1.5. \nIndustry bodies \n2. Medium \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation discussion \n2.5. \nFollow-up or verbal instructions \n2.6. \nFace to face communication \n3. Storage \n3.1. \nManual filing system \n3.2. \nComputer-based filing system \n4. Forms \n4.1. \nPersonnel forms \n4.2. \nTelephone message forms \n4.3. \nSafety reports \n5. Workplace interactions \n5.1. \nFace to face \n5.2. \nTelephone \n5.3. \nElectronic and two way radio \n5.4. \nWritten including electronic, memos, instruction \nand forms, non-verbal including gestures, \nsignals, signs and diagrams \n6. Protocols \n6.1. \nObserving meeting \n6.2. \nCompliance with meeting decisions \n6.3. \nObeying meeting instructions\n\n--- PDF PAGE 6 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n5\nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Prepared written communication following standard \nformat of the organization \n1.2. Accessed information using communication \nequipment \n1.3. Made use of relevant terms as an aid to transfer \ninformation effectively \n1.4. Conveyed information effectively adopting the \nformal or informal communication \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1. Effective communication \n2.2. Different modes of communication \n2.3. Written communication \n2.4. Organizational policies \n2.5. Communication procedures and systems \n2.6. Technology relevant to the enterprise and the \nindividual’s work responsibilities \n3. Underpinning Skills \n3.1. Follow simple spoken language \n3.2. Perform routine workplace duties following simple \nwritten notices \n3.3. Participate in workplace meetings and discussions \n3.4. Complete work related documents \n3.5. Estimate, calculate and record routine workplace \nmeasures \n3.6. Basic mathematical processes of addition, \nsubtraction, division and multiplication \n3.7. Ability to relate to people of social range in the \nworkplace \n3.8. Gather and provide information in response to \nworkplace Requirements \n4. Resource \nImplications \nThe following resources must be provided: \n4.1. Fax machine \n4.2. Telephone \n4.3. Writing materials \n4.4. Internet \n5. Methods of \nAssessment \n5.1. Direct Observation \n5.2. Oral interview and written test \n6. Context of \nAssessment \n6.1. Competency may be assessed individually in the \nactual workplace or through accredited institution\n\n--- PDF PAGE 7 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n6\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT \nUNIT CODE \n : 500311106 \nUNIT DESCRIPTOR : \nThis unit covers the skills, knowledge and attitudes to \nidentify role and responsibility as a member of a team. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\n1. Describe team role \nand scope \n1.1. The role and objective of the team is identified from \navailable sources of information \n1.2. Team parameters, reporting relationships and \nresponsibilities are identified from team discussions \nand appropriate external sources \n2. Identify own role \nand responsibility \nwithin team \n2.1. Individual role and responsibilities within the team \nenvironment are identified \n2.2. Roles and responsibility of other team members are \nidentified and recognized \n2.3. Reporting relationships within team and external to \nteam are identified \n3. Work as a team \nmember \n3.1. Effective and appropriate forms of communications \nused and interactions undertaken with team members \nwho contribute to known team activities and \nobjectives \n3.2. Effective and appropriate contributions made to \ncomplement team activities and objectives, based on \nindividual skills and competencies and workplace \ncontext \n3.3. Observed protocols in reporting using standard \noperating procedures \n3.4. Contribute to the development of team work plans \nbased on an understanding of team’s role and \nobjectives and individual competencies of the \nmembers.\n\n--- PDF PAGE 8 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n7\nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Role and objective \nof team \n1.1. \nWork activities in a team environment with \nenterprise or specific sector \n1.2. \nLimited discretion, initiative and judgement maybe \ndemonstrated on the job, either individually or in a \nteam environment \n2. Sources of \ninformation \n2.1. \nStandard operating and/or other workplace \nprocedures \n2.2. \nJob procedures \n2.3. \nMachine/equipment manufacturer’s specifications \nand instructions \n2.4. \nOrganizational or external personnel \n2.5. \nClient/supplier instructions \n2.6. \nQuality standards \n2.7. \nOHS and environmental standards \n3. Workplace context \n3.1. \nWork procedures and practices \n3.2. \nConditions of work environments \n3.3. \nLegislation and industrial agreements \n3.4. \nStandard work practice including the storage, safe \nhandling and disposal of chemicals \n3.5. \nSafety, environmental, housekeeping and quality \nguidelines\n\n--- PDF PAGE 9 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n8\nEVIDENCE GUIDE \n \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. \nOperated in a team to complete workplace activity \n1.2. \nWorked effectively with others \n1.3. \nConveyed information in written or oral form \n1.4. \nSelected and used appropriate workplace language \n1.5. \nFollowed designated work plan for the job \n1.6. \nReported outcomes \n2. Underpinning \nKnowledge and \nAttitude \n2.1. \nCommunication process \n2.2. \nTeam structure \n2.3. \nTeam roles \n2.4. \nGroup planning and decision making \n3. Underpinning Skills \n3.1. \nCommunicate appropriately, consistent with the \nculture of the workplace \n4. Resource \nImplications \n4.1. \nThe following resources MUST be provided: \n4.2. \nAccess to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n4.3. \n Materials relevant to the proposed activity or tasks \n5. Methods of \nAssessment \n5.1. \nCompetency may be assessed through: \n5.2. \nObservation of the individual member in relation to \nthe work activities of the group \n5.3. \nObservation of simulation and or role play involving \nthe participation of individual member to the \nattainment of organizational goal \n5.4. \nCase studies and scenarios as a basis for discussion \nof issues and strategies in teamwork \n6. Context for \nAssessment \n6.1. \nCompetency may be assessed in workplace or in a \nsimulated workplace setting \n6.2. \nAssessment shall be observed while task are being \nundertaken whether individually or in group\n\n--- PDF PAGE 10 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n9\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM \n \nUNIT CODE : 500311107 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in \npromoting career growth and advancement. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\n1. Integrate personal \nobjectives with \norganizational goals \n1.1 Personal growth and work plans are pursued towards \nimproving the qualifications set for the profession \n1.2 Intra- and interpersonal relationships is being \nmaintained in the course of managing oneself based on \nperformance evaluation \n1.3 Commitment to the organization and its goal is \ndemonstrated in the performance of duties\n2. Set and meet work \npriorities \n2.1 Competing demands are prioritized to achieve \npersonal, team and organizational goals and \nobjectives. \n2.2 Resources are utilized efficiently and effectively to \nmanage work priorities and commitments \n2.3 Practices along economic use and maintenance of \nequipment and facilities are followed as per established \nprocedures\n3. Maintain professional \ngrowth and \ndevelopment \n3.1 Trainings and career opportunities are identified and \navailed of based on job requirements \n3.2 Recognitions are sought/received and demonstrated \nas proof of career advancement \n3.3 Licenses and/or certifications relevant to job and \ncareer are obtained and renewed\n \n \n \n \n \n \n \n \n \n \n \nRANGE OF VARIABLES\n\n--- PDF PAGE 11 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n10\n \n \nVARIABLE \nRANGE \n1. Evaluation \n1.1 Performance Appraisal \n1.2 Psychological Profile \n1.3 Aptitude Tests\n2. Resources \n2.1 Human \n2.2 Financial \n2.3 Technology \n2.3.1 Hardware \n2.3.2 Software\n3. Trainings and career \nopportunities \n3.1 Participation in training programs \n 3.1.1 Technical \n 3.1.2 Supervisory \n 3.1.3 Managerial \n 3.1.4 Continuing Education \n3.2 Serving as Resource Persons in conferences and \nworkshops\n4. Recognitions \n4.1 Recommendations \n4.2 Citations \n4.3 Certificate of Appreciations \n4.4 Commendations \n4.5 Awards \n4.6 Tangible and Intangible Rewards\n5. Licenses and/or \ncertifications \n5.1 National Certificates \n5.2 Certificate of Competency \n5.3 Support Level Licenses \n5.4 Professional Licenses\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nEVIDENCE GUIDE\n\n--- PDF PAGE 12 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n11\n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Attained job targets within key result areas (KRAs) \n1.2 Maintained intra - and interpersonal relationship in the \ncourse of managing oneself based on performance \nevaluation \n1.3 Completed trainings and career opportunities which are \nbased on the requirements of the industries \n1.4 Acquired and maintained licenses and/or certifications \naccording to the requirement of the qualification \n2. Underpinning \nKnowledge and \nValues \n2.1 Work values and ethics (Code of Conduct, Code of \nEthics, etc.) \n2.2 Company policies \n2.3 Company operations, procedures and standards \n2.4 Fundamental rights at work including gender sensitivity \n2.5 Personal hygiene practices \n3. Underpinning Skills \n3.1 Appropriate practice of personal hygiene \n3.2 Intra and Interpersonal skills \n3.3 Communication skills \n4. Resource \nImplications \nThe following resources MUST be provided: \n4.1 Workplace or assessment location \n4.2 Case studies/scenarios \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 Portfolio Assessment \n5.2 Interview \n5.3 Simulation/Role-plays \n5.4 Observation \n5.5 Third Party Reports \n5.6 Exams and Tests \n6. Context of \nAssessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n\n--- PDF PAGE 13 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n12\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND SAFETY \nPROCEDURES \nUNIT CODE : 500311108 \nUNIT DESCRIPTOR : \nThis unit covers the outcomes required to comply with regulatory \nand organizational requirements for occupational health and \nsafety. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\n1. Identify hazards and risks \n1.1 Safety regulations and workplace safety and hazard control \npractices and procedures are clarified and explained based on \norganization procedures \n1.2 Hazards/risks in the workplace and their corresponding \nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with \norganization procedures. \n1.3 Contingency measures during workplace accidents, fire and \nother emergencies are recognized and established in \naccordance with organization procedures. \n2. Evaluate \nhazards \nand \nrisks \n2.1 Terms of maximum tolerable limits which when exceeded will \nresult in harm or damage are identified based on threshold \nlimit values (TLV) \n2.2 Effects of the hazards are determined \n2.3 OHS issues and/or concerns and identified safety hazards are \nreported to designated personnel in accordance with \nworkplace requirements and relevant workplace OHS \nlegislation \n3. Control hazards and risks \n3.1 Occupational Health and Safety (OHS) procedures for \ncontrolling hazards/risks in workplace are consistently \nfollowed \n3.2 Procedures for dealing with workplace accidents, fire and \nemergencies are followed in accordance with organization \nOHS policies \n3.3 Personal protective equipment (PPE) is correctly used in \naccordance with organization OHS procedures and practices \n3.4 Appropriate assistance is provided in the event of a workplace \nemergency in accordance with established organization \nprotocol. \n4. Maintain OHS \n1.1 Emergency-related drills and trainings are participated in \nas per established organization guidelines and procedures \n1.2 OHS personal records are completed and updated in \naccordance with workplace requirements.\n\n--- PDF PAGE 14 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n13\n RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Safety regulations \nMay include but are not limited to: \n1.1 Clean Air Act \n1.2 Building code \n1.3 National Electrical and Fire Safety Codes \n1.4 Waste management statutes and rules \n1.5 Philippine Occupational Safety and Health Standards \n1.6 DOLE regulations on safety legal requirements \n1.7 ECC regulations \n2. Hazards/Risks \nMay include but are not limited to: \n2.1 Physical hazards – impact, illumination, pressure, \nnoise, vibration, temperature, radiation \n2.2 Biological hazards- bacteria, viruses, plants, parasites, \nmites, molds, fungi, insects \n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke, \ngasses, vapors \n2.4 Ergonomics \n2.4.1 Psychological factors – over exertion/ excessive \nforce, awkward/static positions, fatigue, direct \npressure, varying metabolic cycles \n2.4.2 Physiological factors – monotony, personal \nrelationship, work out cycle \n3. Contingency \nmeasures \nMay include but are not limited to: \n3.1 Evacuation \n3.2 Isolation \n3.3 Decontamination \n3.4 (Calling designed) emergency personnel \n4. PPE \nMay include but are not limited to: \n4.1 Mask \n4.2 Gloves \n4.3 Goggles \n4.4 Hair Net/cap/bonnet \n4.5 Face mask/shield \n4.6 Ear muffs \n4.7 Apron/Gown/coverall/jump suit \n4.8 Anti-static suits\n\n--- PDF PAGE 15 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n14\nVARIABLE \nRANGE \n5. Emergency-related \ndrills and training \n5.1 Fire drill \n5.2 Earthquake drill \n5.3 Basic life support/CPR \n5.4 First aid \n5.5 Spillage control \n5.6 Decontamination of chemical and toxic \n5.7 Disaster preparedness/management \n6. OHS personal \nrecords \n6.1 Medical/Health records \n6.2 Incident reports \n6.3 Accident reports \n6.4 OHS-related training completed\n\n--- PDF PAGE 16 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n15\nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Explained clearly established workplace safety and hazard \ncontrol practices and procedures \n1.2 Identified hazards/risks in the workplace and its \ncorresponding indicators in accordance with company \nprocedures \n1.3 Recognized contingency measures during workplace \naccidents, fire and other emergencies \n1.4 Identified terms of maximum tolerable limits based on \nthreshold limit value- TLV. \n1.5 Followed Occupational Health and Safety (OHS) procedures \nfor controlling hazards/risks in workplace \n1.6 Used Personal Protective Equipment (PPE) in accordance \nwith company OHS procedures and practices \n1.7 Completed and updated OHS personal records in \naccordance with workplace requirements \n2. Underpinning \nKnowledge and \n Attitude \n2.1 OHS procedures and practices and regulations \n2.2 PPE types and uses \n2.3 Personal hygiene practices \n2.4 Hazards/risks identification and control \n2.5 Threshold Limit Value -TLV \n2.6 OHS indicators \n2.7 Organization safety and health protocol \n2.8 Safety consciousness \n2.9 Health consciousness \n3. Underpinning \n Skills \n3.1 Practice of personal hygiene \n3.2 Hazards/risks identification and control skills \n3.3 Interpersonal skills \n3.4 Communication skills \n4. Resource \nImplications \nThe following resources must be provided: \n4.1 Workplace or assessment location \n4.2 OHS personal records \n4.3 PPE \n4.4 Health records \n5. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 Portfolio Assessment \n5.2 Interview \n5.3 Case Study/Situation \n6. Context for \nAssessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n\n--- PDF PAGE 17 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n16\nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY : APPLY SAFETY MEASURES IN FARM OPERATIONS \nUNIT CODE : AFF 321201 \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \nrequired to perform safety measures effectively and \nefficiently. It includes identifying areas, tools, materials, \ntime and place in performing safety measures. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\n1. \nDetermine areas of \nconcern for safety \nmeasures \n1.1 \nWork tasks are identified in line with farm \noperations \n1.2 \nPlace for safety measures are determined in line \nwith farm operations \n1.3 \nTime for safety measures are determined in line \nwith farm operations \n1.4 \nAppropriate tools, materials and outfits are \nprepared in line with job requirements\n2. \nApply appropriate \nsafety measures \n2.1 \nTools and materials are used according to \nspecifications and procedures \n2.2 \nOutfits are worn according to farm requirements \n2.3 \nEffectivity/shelf life/expiration of materials are \nstrictly observed \n2.4 \nEmergency procedures are known and followed \nto ensure a safework requirement \n2.5 \nHazards in the workplace are identified and \nreported in line with farm guidelines\n3. \nSafekeep/dispose \ntools, materials and \noutfit \n3.1 \nUsed tools and outfit are cleaned after use and \nstored in designated areas \n3.2 \nUnused materials are properly labeled and stored \naccording to manufacturers recommendation and \nfarm requirements \n3.3 \nWaste materials are disposed according to \nmanufacturers, government and farm \nrequirements\n\n--- PDF PAGE 18 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n17\n \n \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Work tasks \nWork task may be selected from any of the \nsubsectors: \n1.1 Aquaculture \n1.2 Animal Production \n1.3 Crop Production \n1.4 Post-harvest \n1.5 Agri-marketing \n1.6\nFarm Equipment\n2. Place \n2.1 Animal pens, cages, barns \n2.2 Fish ponds, cages \n2.3 Stock room/storage areas/warehouse \n2.4 Field/farm/orchard \n3. Time \n3.1 Vaccination and medication period \n3.2 Fertilizer and pesticides application \n3.3 Feed mixing and feeding \n3.4 Harvesting and hauling \n3.5 Cleaning, sanitizing and disinfecting \n3.6\nDressing, butchering and castration\n4. Tools, materials and \noutfits \n4.1 Tools \n4.1.1 Wrenches \n4.1.2 Screw driver \n4.1.3 Pliers \n4.2 Materials \n4.2.1 Bottles \n4.2.2 Plastic \n4.2.3 Bags \n4.2.4 Syringe \n4.3 Outfit \n4.3.1 Masks \n4.3.2 Gloves \n4.3.3 Boots \n4.3.4 Overall coats \n4.3.5 Hat \n4.3.6 Eye goggles\n5. Emergency procedures \n5.1 Location of first aid kit \n5.2 Evacuation \n5.3 Agencies contract \n5.4\nFarm emergency procedures\n6. Waste materials \n6.1 Animal manure \n6.2 Waste water \n6.3\nSyringes\n\n--- PDF PAGE 19 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n18\n6.4 Unused farm chemicals e.g. pesticides, \nchemicals, fertilizers \n6.5 Expired reagents \n6.6\nDead animals\n7. \nHazards \n7.1 Chemical \n7.2 Electrical \n7.3\nFalls\n \n \nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Determined areas of concern for safety measures \n1.2 Applied appropriate safety measures according to \nindustry requirements \n1.3 Prepared tools, materials and outfit needed \n1.4 Performed proper disposal of used materials \n1.5 Safekeep/cleaned tools, materials and outfit in designated \nfacilities \n2. Required \nKnowledge \n2.1 Safety Practices \n2.1.1 Implementation of regulatory controls and \npolicies relative to treatment of area and \napplication of chemicals \n2.1.2 Proper disposal of waste materials \n2.2 Codes and Regulations \n2.2.1 Compliance to health program of DOH and \nDENR \n2.2.2 Hazard identification \n2.2.3 Emergency procedures \n2.3 Tools & Equipment: Uses and Specification \n2.3.1 Masks, gloves, boots, overall coats for health \nprotection \n2.4 Maintenance \n2.4.1 Regular check-up and repair of tools, materials \nand outfit before and after use\n3. Required Skills \n3.1 Ability to recognize effective tools, materials and outfit \n3.2 Ready skills required to read labels, manuals and other \nbasic safety information\n4. Resource \nImplications \nThe following resources should be provided: \n4.1 Farm location \n4.2 Tools, equipment and outfits appropriate in applying \nsafety measures\n5. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1. Practical demonstration \n5.2. Third Party Report \n6. Context of \nAssessment \n6.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 20 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n19\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nUNIT OF COMPETENCY : USE FARM TOOLS AND EQUIPMENT \nUNIT CODE : AFF 321202 \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \nrequired to use farm tools and equipment. It includes \nselection, operation and preventive maintenance of farm \ntools and equipment. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\n1. \nSelect and use farm \ntools \n \n1.1 Appropriate farm tools are identified according to \nrequirement/use \n1.2 Farm tools are checked for faults and defective \ntools reported in accordance with farm procedures \n1.3 Appropriate tools and equipment are safely used \naccording to job requirements and manufacturers \nconditions\n2. \nSelect and operate \nfarm equipment \n2.1 Appropriate farm equipment is identified \n2.2 Instructional manual of the farm tools and \nequipment are carefully read prior to operation \n2.3 Pre-operation check-up is conducted in line with \nmanufacturers manual \n2.4 Faults in farm equipment are identified and \nreported in line with farm procedures \n2.5 Farm equipment is used according to its function \n2.6\nSafety procedures are followed\n3. \nPerform preventive \nmaintenance \n3.1 Tools and equipment are cleaned immediately after \nuse in line with farm procedures \n3.2 Routine check-up and maintenance are performed \n3.3 Tools and equipment are stored in designated \nareas in line with farm procedures\n\n--- PDF PAGE 21 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n20\nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Farm equipment \n \n1.1 Engine \n1.2 Pumps \n1.3 Generators \n1.4 Sprayers\n2. Farm tools \n2.1 Sickle \n2.2 Cutters \n2.3 Weighing scales \n2.4 Hand tools \n2.5 Measuring tools \n2.6 Garden tools\n3. Pre-operation check-up \n3.1 Tires \n3.2 Brake fluid \n3.3 Fuel \n3.4 Water \n3.5 Oil \n3.6 Lubricants \n3.7 Battery\n\n--- PDF PAGE 22 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n21\nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Correctly identified appropriate farm tools and equipment \n1.2 Operated farm equipments according to manual \nspecification \n1.3\nPerformed preventive maintenance\n2. Required \nKnowledge and \nAttitudes \n \n2.1 Safety Practices \n2.1.1 Ideal good work habits to demonstrate to workers \neasy and safety standards during operation of \nfarm equipment \n \n2.2 \nCodes and Regulations \n2.2.1 Environmental Compliance Certificate (ECG) \n2.2.2 Effective work supervision in the operations of \nfarm equipment \n \n2.3 Tools & Equipment: Uses and Specification \n2.3.1 Knowledge in calibrating and use of equipment \n2.3.2 Safety keeping of equipments every after use \n \n2.4 Maintenance \n2.4.1 Regular upkeep of equipments \n2.4.2 Preventive maintenance skills \n \n2.5 \nValues \n2.5.1 Positive outlook towards work \n2.5.2\nPossesses pre-emptive/anticipatory skills\n3. \nRequired Skills \n3.1 \nAbility to recognized defective farm equipment \n3.2 \nPerform proper management practices of safety \nmeasures\n4. \nResource \nImplications \nThe following resources should be provided: \n4.1 Service/operational manual of farm tools and equipment \n4.2 \nTools and equipment \n4.3 \nFarm implements \n5. \nMethod of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 Direct observation \n5.2 Practical demonstration \n5.3\nThird Party Report\n6. \nContext of \nAssessment \n6.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 23 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n22\nUNIT OF COMPETENCY : PERFORM ESTIMATION AND BASIC CALCULATION \nUNIT CODE : AFF 321203 \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \nrequired to perform basic workplace calculations. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\n1. \nPerform estimation \n1.1 Job requirements are identified from written or oral \ncommunications \n1.2 Quantities of materials and resources required to \ncomplete a work task are estimated \n1.3 The time needed to complete a work activity is \nestimated \n1.4 Accurate estimate for work completion are made \n1.5 Estimate of materials and resources are reported to \nappropriate person \n2. \nPerform basic \nworkplace calculation \n2.1 Calculations to be made are identified according \nto job requirements \n2.2 Correct method of calculation identified \n2.3 System and units of measurement to be followed \nare ascertained \n2.4 Calculation needed to complete work tasks are \nperformed using the four basic process of addition, \ndivision, multiplication and subtraction \n2.5 Calculate whole fraction, percentage and mixed \nwhen are used to complete the instructions \n2.6 Number computed in self checked and completed \nfor alignment\n\n--- PDF PAGE 24 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n23\nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. \nCalculations \n \n1.1 \nQuantity of feeds \n1.2 \nAmount of fertilizer \n1.3 \nAmount of medicines \n2. \nMethod of calculation \n \n2.1 \nAddition \n2.2 \nSubtraction \n2.3 \nMultiplication \n2.4 \nDivision \n2.5\nRatio and proportion\n3. \nSystem of measurement \n3.1 \nEnglish \n3.2 \nMetric \n4. \nUnits of measurement \n4.1 \nArea \n4.2 \nVolume \n4.3 \nWeight\n\n--- PDF PAGE 25 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n24\n \nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Performed estimation \n1.2 Performed basic workplace calculation \n1.3\nApplied corrective measures as maybe necessary\n2. Required \nKnowledge and \nAttitudes \n \n2.1 Mathematics \n2.1.1 \nBasic mathematical operations \n2.1.2 \nPercentage and ratios \n2.1.3 \nUnit Conversion \n2.1.4 \nBasic accounting principles and procedures \n2.1.4.1 Production cost \n2.1.4.2 Sales \n2.1.4.3 Accounts receivables/payables \n2.2 Systems, Processes and Operations \n2.2.1 Knowledge in different management practices and \noperational procedures \n2.3 \nValues \n2.3.1 Safety consciousness \n2.3.2 Time consciousness and management \n2.3.3 Cost consciousness \n2.3.4 Precision\n3. Required Skills \n3.1 \nAbility to perform basic calculation \n3.2 \nCommunicate effectively \n4. Resource \nImplications \nThe following resources should be provided: \n4.1 \nRelevant tools and equipment for basic calculation \n4.2 \nRecommended data \n5. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 \nPractical demonstration \n5.2 \nWritten examination \n6. Context of \nAssessment \n6.1 Assessment may occur in the workplace or in a \nsimulated workplace or as part of a team under limited \nsupervision\n\n--- PDF PAGE 26 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n25\nUNIT OF COMPETENCY : \nPROCESS FARM WASTES \nUNIT CODE\n:\nAFF 321206\n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to process farm wastes. It comprises functions \nsuch as collecting farm wastes, conducting waste \nidentification and segregation, treating and processing \nfarm wastes and performing housekeeping duties. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Collect farm wastes \n1.1 Tools and materials are prepared for collection \nof farm wastes. \n1.2 Wastes are collected following OSHS and waste \ncollection requirements and plan. \n1.3 Dangerous and hazardous wastes are collected \nfollowing the HAZMAT(hazardous material) \nprotocol. \n1.4 Appropriate personal protective equipment (PPE) \nare worn as prescribed by Occupational Safety \nand Health Standards (OSHS). \n2. Identify and segregate \nwastes \n \n2.1 Wastes are identified by categories according to \nindustry standards and environmental legislation. \n2.2 Wastes are segregated according to \norganizational requirements and relevant \nlegislation. \n2.3 Sorted waste is placed into labelled container to \navoid littering and prevent cross-contamination. \n2.4 Information on waste is obtained by asking \nauthority to ensure correct identification.\n3. Treat and process farm \nwastes \n3.1 Dangerous and hazardous wastes are handled \naccording to organizational requirements and \nrelevant legislation following OSHS procedures. \n3.2 Processing of farm wastes is done following \nenvironmental legislation and codes. \n3.3 Principles of 3Rs (reduce, reuse and recycle) are \napplied accordingly. \n3.4 Farm wastes are disposed of according to \nenvironmental legislation and codes.\n4. Perform housekeeping \n4.1 Appropriate warning signs and labels are \ndisplayed in conspicuous places around the \nworkplace. \n4.2 Work area is cleaned according to 5S principles.\n\n--- PDF PAGE 27 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n26\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n4.3 Tools are checked, cleaned and stowed \naccording to established industry procedures and \nfollowing user’s manual. \n4.4 Materials are stored following industry standard \nprocedures and manufacturer’s specifications. \n4.5 PPE is checked for damage prior to ensuring that \nclean and undamaged equipment is stored. \n4.6 Storage facility is checked to ensure no \ncontamination in the area according to \norganizational requirements and legislation and \ncodes. \n4.7 Record keeping is done according to industry \nrequirements.\nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Tools and materials \nTools and materials include: \n1.1. Tools \n1.1.1 Spade \n1.1.2 Wheel borrow \n1.1.3 Broomstick \n1.1.4 Sprayer or pressurized pump \n1.2. Materials \n1.2.1 Sacks \n1.2.2 Containers \n1.2.3 Disinfectants \n1.2.4 Detergents \n1.2.5 First-aid kit \n1.2.6 Chemical spill kit \n1.2.7 Personal Protective Equipment \no Goggles \no Disposal gloves \no Face mask \no Rubber boots \no\nOverall\n2. Agricultural wastes \nAgricultural wastes may include: \n2.1. Plant materials \n2.2. Hay \n2.3. Weeds \n2.4. Twigs \n2.5. Twines \n2.6. Empty wooden crates \n2.7. Animal manure \n2.8. Feed refuse \n2.9. Spoiled feeds (Forage and feed supplements)\n\n--- PDF PAGE 28 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n27\nVARIABLE \nRANGE \n2.10. \nSpent bedding materials \n2.11. \nEmpty sacks \n2.12. \nTrash fish \n2.13. \nFish meal \n2.14.\nEffluent\n3. Dangerous and \nhazardous wastes \nDangerous and hazardous wastes may include: \n3.1 Pesticides \n3.2 Syringes \n3.3 Expired biologics \n3.4 Expired veterinary drugs \n3.5 Spoiled milk \n3.6 Diseased plant and plant parts \n3.7 Empty veterinary bottles/syringes\n4. Categories \nCategories may include: \n4.1 Re-usable \n4.2 Recyclable \n4.3 Solid \n4.4 Liquid\n5. Processing of wastes \nProcessing of wastes may include: \n5.1. Composting \n5.2. Compacting \n5.3. Liquefying \n5.4. Shredding \n5.5. Carbonizing \n5.6. Charcoaling\n6. Record \nRecord includes: \n6.1. Record of farm wastes generated and disposed \n6.2. Record of incidence of infection and accidents \n6.3. Record of chemical spillage \n6.4. Record of destroyed carcasses \n6.5. Inventory of tools, materials and equipment\n \n \nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Collected farm wastes \n1.2. Identified and segregated farm wastes \n1.3. Processed farm wastes \n1.4. Performed housekeeping \n2. Required \nKnowledge and \nAttitudes \n \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. Tools and materials use in wastes management \n2.1.2. Categories of farm wastes \n2.1.3. Wastes collection and segregation procedures \n2.1.4. Farm-waste handling, storage and disposal \nprocedures\n\n--- PDF PAGE 29 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n28\n2.1.5. Dangerous and hazardous wastes, hazardous \nmaterials (hazmat) protocols \n2.1.6. Principles of 5S and 3R \n2.2. Communications \n2.2.1 Preparation of inventory reports and production \nrecords \n2.2.2 Report on untoward incidence in the area \n2.3. Mathematics and Mensuration \n2.3.1. Profitability of the operation \n2.3.2. Volume of farm wastes \n2.4. Safety Practices \n2.4.1. Personal Protective Equipment (PPE) \n2.4.2. Material Safety Data Sheets(MSDS) \n2.5. Codes and Regulations \n2.5.1. Appropriate legal regulatory body such as BAI, EMB \nand DOH,BFAD \n2.5.2. Occupational Safety and Health Standards \n2.5.3. RA 9003 \n2.5.4. RA 6969 \n2.6. Materials, Tools & Equipment: Uses, Specifications and \nMaintenance \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional manuals\n2.6.1.2. Safe keeping of equipment every after use \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies, materials \nand equipment needed in the maintenance of \nthe poultry house and farm \n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills for farm area \n2.7. Values \n2.7.1. Safety and health consciousness \n2.7.2. Resourcefulness \n2.7.3. Diligence \n2.7.4. Time consciousness \n2.7.5. Cost-consciousness \n2.7.6. Personal integrity in doing routine management \npractices \n2.7.7. Perseverance in executing routine works \n2.7.8.\nAbility to work with others harmoniously\n3. Required Skills \n3.1 Occupational health safety \n3.2 Skills in using tools and equipment \n3.3 Calculations \n3.4\nCommunicate effectively\n4. Resource \nImplications \nThe following resources should be provided: \n4.1 Farm area \n4.2 Different farm wastes \n4.3\nFarm-waste processing area\n\n--- PDF PAGE 30 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n29\n4.4 Tools, supplies and materials use in farm wastes collection, \nsegregation and processing \n4.5 Housekeeping tools and supplies \n4.6\nPPE\n5. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 Observation and questioning \n5.2 Third-Party Report \n5.3 Demonstration and oral questioning\n6. Context of \nAssessment \n6.1 Competency maybe assessed individually in the actual \nworkplace or in accredited farms or institution\n\n--- PDF PAGE 31 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n30\nUNIT OF COMPETENCY : \nPERFORM RECORD-KEEPING \n \nUNIT CODE \n \n: \nSOC 413206 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitude \nrequired to carry-out inventory activities, maintain \nproduction record and prepare financial records. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Carry out inventory \nactivities \n1.1 Inventory inputs are determined according \nenterprise requirements. \n1.2 Defective tools and equipment are determined \naccording to operation manuals \n1.3 Facilities are inspected according to according \nstandard codes and laws. \n2. Maintain production \nrecord \n \n2.1 Production plan are prepared according to \nenterprise requirements. \n2.2 Schedule for production activities are prepared \nbased from enterprise requirements and plan. \n2.3 Production report are prepared in accordance with \nenterprise reporting procedures \n2.4 Input and production are monitored using \nmonitoring chart. \n3. Prepare financial \nrecords \n3.1. Production cost are computed using established \ncomputation procedures. \n3.2. Revenue is computed using established \ncomputation procedures.\n\n--- PDF PAGE 32 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n31\nRANGE OF VARIABLES \n \n \nVARIABLE \nSCOPE \n1. Inventory inputs\n \n1.1 Plant\n1.1.1. Planting materials \n1.1.2. Fertilizer \n1.1.3. Concoctions (Pesticides and insecticides) \n1.1.4. Beneficial microorganisms \n1.2 Animals \n1.2.1. Stocks \n1.2.2. Feeds \n1.2.3. Concoctions \n1.2.4. Medications \n1.2.5. Beneficial microorganisms \n1.2 Miscellaneous materials\n2. Production activities\n2.1.\nPlant\no Planting \no Fertilizer application \no Pesticides application \no Implementation of bio-security measures \no Irrigation/watering \no Weeding \no Harvesting \no Post-harvesting \n2.2. \nAnimal \no \nFeeding \no \nCleaning and Sanitization \no \nImplementation of bio-security measures \no \nGrowth and health condition \no \nHarvesting \no \nPost harvesting \n2.3.\nMiscellaneous activities \n3. Production report\n3.1.\nCategorize and record quality of harvest\n3.2.\nvolume /quantity of products harvested\n4. Input\n4.1.\nInput(plant)\no Fertilizer \no Concoctions (Pesticides and insecticides) \no Beneficial microorganisms \n4.2. \nInput(animal) \no Feeds \no Concoctions \no Medications \no Beneficial microorganisms \n4.3.\nMiscellaneous inputs\n5. Production\n5.1\nGrowth rate\n5.2\nSurvival rate\n6. Production cost\n6.1.\nLabor \n6.2. \nInputs \n6.3. \nTools, equipment and facility depreciation cost \n6.4. \nAdministrative cost \n6.5.\nMiscellaneous\n\n--- PDF PAGE 33 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n32\nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Determined inventory inputs according enterprise requirements \n1.2. Determined defective tools and equipments according to \noperation manuals. \n1.3. Inspected facilities according to standard codes and laws. \n1.4. Prepared production plan and report according to enterprise \nrequirements and reporting procedures.\n2. Required Knowledge \nand Attitudes \n \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. \nKinds of tools and equipment \n2.1.2. \nDefects of tools and equipment \n2.1.3. \nMonitoring method \n2.1.4. \nFarm planning and budgeting \n2.1.5. \nMethods and process of production \n2.1.6. \nQuality control \n2.1.7. \nBasic bookkeeping \n2.1.8. \nPractice 3Rs and 5S \n2.1.9. \nProgram of work activities are implemented as scheduled \n2.2. Communication \n2.2.1. Prepare and submit required reports \n2.2.2. Documentation of production and financial data \n2.3. Mathematics and Mensuration \n2.3.1. Basic mathematical operations \n2.3.2. Metric system \n2.3.3. Computation for production of organic fertilizer \n2.3.4. Unit conversion \n2.4. Safety Practices \n2.4.1. Safety during inspections of tools, farm implements and \nequipment. \n2.5. Codes and Regulations \n2.5.1. Codes and laws on quality control \n2.5.2. Codes and laws on inspection of facilities \n2.6. Materials, Tools & Equipment: Uses, Specifications and \nMaintenance \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional manuals \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies and materials \nneeded in record keeping \n2.6.3. Maintenance \n2.6.3.1. Maintenance of records \n2.7. Values \n2.7.1. Time consciousness and management \n2.7.2. Resourcefulness \n2.7.3. Cost consciousness \n2.7.4. Diligence \n2.7.5. Determined\n\n--- PDF PAGE 34 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n33\n\n--- PDF PAGE 35 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n34\n3. Required Skills \n \n \n \n3.1 \nWork safety \n3.2 \nSkills in determining defective tools and equipment \n3.3 \nMeasuring and calculations \n3.4 \n Estimation \n3.1. Basic mathematical skills \n3.2. Skills in preparation of reports \n3.3. Bookkeeping \n3.4. Oral and written communication \n4. Resource \nImplications \nThe following resources should be provided: \n4.1. All supplies, materials and farm implements needed during farm \noperations should be readily available at the farm site: \n4.1.1. Farm site \n4.1.2. Office supplies, materials, tools and farm equipment \n4.2. Protective clothing equipment and materials. All workers involved \nin different activities must be fully oriented and cautioned on the \ndifferent specific work activities of the farm. \n4.3. Technical supervisors should have skills and ability in the \nsuccessful implementation of work program activities.\n5. Method of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. Demonstration with questioning \n5.2. Written examination \n6. Context of \nAssessment \n6.1. Assessment may occur in an appropriately simulated \nenvironment through TESDA accredited assessment centers\n\n--- PDF PAGE 36 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n35\nCORE COMPETENCY \n \nUNIT OF COMPETENCY : \nPERFORM NURSERY OPERATIONS \n \nUNIT CODE \n \n: \nAFF 610301 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes \nrequired to perform nursery operations for agricultural \ncrops including establishing nursery shed, preparation \nand handling of planting materials, preparation of \ngrowing media, transplanting germinated seedlings \nand handling of nursery tools and equipment. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Prepare \nnursery tools, \nfarm \nimplements \nand simple \nequipment \n1.1 Tools, farm implements and simple equipment are \nprepared according work requirements. \n1.2 Basic pre-operative checking of tools, farm implements \nand equipment is performed in accordance with \nmanufacturer’s manual and GAP standard. \n1.3 Tools with wear and corrosions are segregated and \ntreated according to maintenance plan and procedures. \n2. Maintain nursery \nfacilities \n2.1 Nursery sanitation is maintained according to \n GAP standard. \n2.2 Repair and maintenance of nursery facilities are \nperformed to maximize their efficiency and \neffectiveness. \n2.3 Preventive measures are applied for inclement \n weather. \n2.4\nSafety measures are practice according to OSHS.\n3. Handle \nseeds/planting \nmaterial \n3.1 Planting materials are determined according to kinds and \nvarieties. \n3.2 Quality seeds are selected according to prescribed \ncharacteristics. \n3.3 Seed testing is conducted to determine the \npercentage germination of the seedstock in accordance \nwith the standard procedures \n3.4 Planting materials are treated following standard protocol. \n3.5 Seed scarification is performed for germination purposes \nbased on type of crop. \n4. Prepare growing \nmedia \n4.1 Growing media are prepared according to prescribed \nmixture and crop requirement. \n4.2 Growing media are placed in prescribed containers \naccording to crop requirements. \n4.3 Containers are arranged and labelled according to \nvarieties/species. \n4.4 Seedbed is prepared based on crop species.\n\n--- PDF PAGE 37 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n36\nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n5. Conduct \npropagation \nactivities \n \n5.1 Nursery shed is set-up according to plant requirement \n5.2 Quality seedlings are selected based on prescribed \ncharacteristics. \n5.3 Propagation materials are selected according to \npropagation activity. \n5.4 Plant propagation techniques are performed based on \nrecommended practices. \n5.5 Germinated seedlings are maintained until fully \nestablished. \n5.6 Pricking and thinning of seedlings are performed based on \nrecommended practices. \n \n \n \nRANGE OF VARIABLES \n \n \nVARIABLE \nSCOPE \n1. Tools, farm implements \nand simple equipment \nInclude the following but not limited to: \n1.1. Tools: \n1.1.1. Digging tools \n1.1.2. Propagation tools \n1.1.3. Harvesting tools \n1.1.4. Measuring tools \n1.2. Farm implements and simple equipment: \n1.2.1. Water pumps \n1.2.2. Hand tractor \n1.2.3. Plow \n1.2.4. Harrow \n1.2.5. Sprayer\n2. Planting materials \nInclude the following but not limited to: \n2.1. Seeds \n2.2. Suckers \n2.3. Tissue cultured plantlets \n2.4. Cuttings \n2.5. Rhizome \n2.6. Corm \n2.7. Grafted material \n2.8. Tuber \n2.9. Runner/Stolon \n2.10.Bulb\n3. Quality seeds \nCharacteristics of quality seeds include the \nfollowing: \n3.1. Damage free \n3.2. Viability \n3.3. Free from mixture\n\n--- PDF PAGE 38 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n37\n4. Seed Testing \nSeed testing methods include the following but not \nlimited to: \n4.1. \nRag doll method \n4.2. \nPetri dish \n4.3.\nSeed bed/seedbox\n5. Seed scarification \nSeed scarification include the following: \n5.1. Physical \n5.2. Chemical\n6. Growing media \nInclude but not limited to the following: \n6.1. \nGarden soil \n6.2. \nPeat moss \n6.3. \nSaw dust \n6.4. \nCoco coir \n6.5. \nRice hull/carbonized rice hull \n6.6. \nCompost \n6.7. \nRiver sand \n6.8. \nAnimal manure \n6.9. \nWood cuttings \n6.10. \nFern slabs \n6.11.\nDrift wood\n7. Containers \nInclude but not limited to the following: \n7.1. Polyethylene bags \n7.2. Clay pots \n7.3. Plastic containers \n7.4. Seed tray \n7.5. Seed box \n7.6. Coconut husk \n7.7. Wired basket\n8. Quality seedlings \nInclude but not limited to the following: \n8.1. Healthy \n8.2. Vigorous growth \n8.3. Height \n8.4. Age \n8.5. Number of leaves\n9. Plant propagation \ntechniques \nInclude but not limited to the following: \n9.1. Sexual (Seeds) \n9.2. Asexual \n9.2.1 Grafting (cleft, side, saddle) \n9.2.2 Budding \n9.2.3 Marcotting/ air layering \n9.2.4 Inarching/approached grafting \n9.2.5 Cuttings \n9.2.6 Division\n\n--- PDF PAGE 39 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n38\nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1. Selected planting materials. \n2. Conducted seed testing \n3. Prepared growing medium. \n4.\nPerformed plant propagation techniques\n2. Required \nKnowledge and \nAttitudes \n \n2.1 \nSafety Practices \n2.1.1 Knowledge on HACCP principles \n2.1.2 Knowledge on Good Agricultural Practices (GAP) \n2.1.3 Knowledge on Occupational Safety and Health \nStandards (OSHS) \n2.2 \nMathematics and Measurement \n2.2.1 Measurement of humidity and temperature \n2.2.2 Measurement of area, volume, and weight \n2.2.3 Measurement of fertilizer and pesticides \n2.3 \nTools & Equipment: Uses and Specification \n2.3.1 Use of measuring devices \n2.3.2 Use of tools and equipment \n2.4 \nSystems, Processes and Operations \n2.4.1 Preparation of calendar of activities \n2.4.2 Irrigation methods \n2.4.3 Different seed/planting materials \n2.4.4 Different growing media \n2.4.5 Preparation and mixing of growing media \n2.4.6 Transplanting procedure \n2.4.7 Propagation techniques \n2.4.8 5S and 3Rs \n2.5 \nPest control procedures \n2.5.1 Pest monitoring \n2.5.2 Pesticide application methods \n \n2.6 \nValues \n2.6.1 Effective team player \n2.6.2 Smooth Interpersonal Relationship (SIR) \n2.6.3 Observant of work ethics\n3. Required Skills \n3.1 Basic mathematical processes of addition, subtraction, \ndivision and multiplication \n3.2 Skills in plant propagation techniques \n3.3 Interpretation of procedural manuals \n4. Resource \nImplications \nThe following resources should be provided: \n4.1 Shed/ Greenhouse \n4.2 Writing instruments \n4.3 Nursery tools/ implements/ equipment \n4.4 Nursery supplies \n4.5 Logbooks \n4.6 Irrigation system and parts\n\n--- PDF PAGE 40 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n39\n4.7 References (NSIC catalogue, GAP, OSHS, HACCP manuals, \netc.)\n5. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. Direct Observation and questioning \n5.2. Demonstration \n5.3. Oral interview and written test \n5.4. Third party report\n6. Context of \nAssessment\n6.1 Competency may be assessed individually in the actual \nworkplace or through accredited institution\n\n--- PDF PAGE 41 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n40\nUNIT OF COMPETENCY \n: \nPLANT CROPS \nUNIT CODE\n:\nAFF 610302\n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to conduct activities related to land preparation \nand planting of agricultural crops. This unit also includes \nproper handling of seeds/seedlings/saplings for planting \nand transplanting, proper use of tools and equipment, \nconduct land preparation and field lay-out. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Prepare \nland for \nplanting \n1.1 Tools, materials and equipment are prepared for land clearing \n1.2 The land is cleared according to prescribed methods of land \npreparation \n1.3 Debris are removed and disposed according to waste management \nstandards. \n1.4 Soil samples are collected for analysis based on standard procedure \n1.5 Land preparation is conducted according to crop requirement. \n1.6 Basal fertilizer is applied based on crop requirement \n1.7 Safety procedures for fertilizer application is followed according to \nOSHS\n2. Conduct \nfield lay-out\n2.1 Tools and materials are prepared for field lay-out. \n2.2 Interpret field lay-out plan according to the recommended planting \nsystem. \n2.3\nField is laid-out according to recommended planting system\n3. Dig holes \n3.1 Diggings of holes are performed based on crop requirement. \n3.2 Top soil is separated to be used in covering the hole after planting. \n3.3 Basal fertilizer application is performed based on recommended \namount.\n4. Perform \ndirect \nseeding \n4.1 Seeds are planted according to recommended rate, distance and \ndepth \n4.2 Replanting are timely done according to recommended practices for a \nparticular crop \n4.3 Safety procedures are followed according to Occupational Safety and \nHealth Standards (OSHS) and Good Agricultural Practices (GAP)\n5. Transplant \nseedlings \n5.1 \nHandling of seedlings from nursery is performed based on prescribed \npractices. \n5.2 \nTransplanting of seedlings is done based on crop practices \n5.3 \nRe-bagging is done for a particular crop requirement \n5.4 \nReplanting is timely done based on planting protocol. \n5.5 \nSafety procedures are followed according to Occupational Safety and \nHealth Standards (OSHS) and Good Agricultural Practices (GAP)\n\n--- PDF PAGE 42 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n41\nRANGE OF VARIABLES \n \n \nVARIABLE \nSCOPE \n1. Tools, materials and \nequipment \nInclude but not limited to the following: \n1.1. Bolo \n1.2. Scythe \n1.3. Spade or shovel \n1.4. Garden hoe \n1.5. Rake \n1.6. Grasscutter \n1.7. Compost \n1.8. Hand tractors and attachments\n2. Debris \n \nInclude but not limited to the following: \n2.1. Stones \n2.2. Sticks \n2.3. Unwanted vegetation \n2.4.\nOther garbage\n3. Land preparation \nInclude but not limited to the following: \n3.1. \nPlowing \n3.2. \nHarrowing \n3.3. \nLeveling \n3.4.\nFurrowing\n4. Crop \nMay include the following: \n4.1. \nOrnamental plants \n4.2. \nPlantation crops \n4.3. \nFruit crops \n4.4. \nVegetables \n4.5. \nRoot crops \n4.6. \nForage crops \n4.7. \nCereals \n4.8.\nHerbs and spices\n5. Fertilizer \nInclude the following: \n5.1. \nOrganic \n5.2.\nInorganic \n6. Planting system \nMay include but not limited to the following: \n6.1 Open Field \n6.1.1. Raised bed \n6.1.2. Square \n6.1.3. Quincunx or diagonal \n6.1.4. Hexagonal or triangular \n6.1.5. Contour system \n6.1.6. Single row \n6.1.7. Double row \n6.1.8. Broadcast method \n6.2 Green house \n6.2.1. Raised bed \n6.2.2. Potted\n\n--- PDF PAGE 43 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n42\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n1.1 Carry-out land clearing \n1.2 Conducted proper soil sampling/collection \n1.3 Performed appropriate land preparation \n1.4 Laid out site for planting \n1.5 Dug holes \n1.6 Sown seeds \n1.7 Planted and transplanted seeds/seedlings/saplings\n2. Required Knowledge \nand Attitudes \n \n2.1 Systems of planting \n2.2 Handling of fertilizers \n2.3 Proper use and maintenance of cutting, digging and \ntillage tools \n2.4 Use of measuring device \n2.5 Proper use of tools and equipment \n2.6 Occupational Health and Safety Standards \n2.7 Good Agriculture Practice Standards by BAFPS \n2.8 Waste management standards \n2.9 Collection of soil sample \n3. Required Skills \n3.1. Proper handling of tools and equipment \n3.2. Fertilizer application \n3.3. Interpret lay-out \n3.4. Digging holes \n3.5. Operate hand tractors\n4. Resource \nImplications \nThe following resources should be provided: \n4.1. Tool room and farm house \n4.2. Farm tools/ implements/ equipment \n4.3. Writing device \n4.4. Farm supplies \n4.5. Logbooks \n4.6. References (fertilizer and pesticide manual/ catalogue, \nprotocols, field guides, OHSP and GAP manuals) \n4.7. Production guide\n5. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. Direct Observation \n5.2. Demonstration \n5.3. Oral interview and/or written test \n5.4. Third party report\n6. Context of \nAssessment \n6.1. Competency may be assessed individually in the \nactual workplace or through accredited institution\n\n--- PDF PAGE 44 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n43\nUNIT OF COMPETENCY \n:\nCARE AND MAINTAIN CROPS \nUNIT CODE \n:\nAFF 610303 \nUNIT DESCRIPTOR \n:\nThis unit covers the knowledge, skills and attitudes \nrequired to apply pest control, measure, apply fertilizer, \nwater crops, perform pruning and perform physical \ngrowth-enhancing practices. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Apply pest \ncontrol \nmeasure \n1.1 Pests incidence is monitored based on prescribed procedure. \n1.2 Tools and materials are prepared according to specific pest \ncontrol measure. \n1.3 Appropriate pest control measures are followed based on GAP \n1.4 Safety measures are observed and practiced according to \nOccupational Health and Safety (OHS) procedures.\n2. Apply \nfertilizer \n2.1 Tools and materials are prepared according to prescribed user’s \nmanual \n2.2 Fertilizers are identified based on kinds. \n2.3 Fertilizer rates are applied based on crop requirements. \n2.4 Appropriate method of fertilizer application is employed based \non crop requirements. \n2.5 Precautionary measures are applied to avoid cross contamination \nbased on GAP. \n2.6 Safety procedures are followed according to Occupational Safety \nand Health Standards \n3. Water crops \n3.1. Soil moisture content is determined based on soil field capacity \n3.2. Watering performed following the prescribed method and \nschedule \n3.3. Good Agricultural Practices is observed. \n4. Perform \npruning \n4.1. Pruning method is performed according to crops. \n4.2. Tools and materials for pruning are prepared. \n4.3. Safety procedures is followed according to Occupational Safety \nand Health Standards and PNS:PAES 101 \n5. Perform \nphysical \ngrowth-\nenhancing \npractices \n \n5.1. Tools and equipment for cultivation are prepared according to \nPNS:PAES 101. \n5.2. Cultivation practices are carried out based on crop requirement. \n5.3. Rejuvenating activities are performed according to established \ncultural practices. \n5.4. Growth training technique are performed for different crops \n5.5. Mulching techniques are carried out based on crops. \n5.6. Safety procedures are followed according to Occupational \nSafety and Health Standards.\n\n--- PDF PAGE 45 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n44\nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Pests \nInclude but not limited to: \n1.1. \nWeeds \n1.2. \nInsects \n1.3. \nDiseases \n1.4. \nMites \n1.5. \nRodents \n1.6.\nOther pests\n2. Tools and materials \nIncludes but not limited to: \n2.1. \nKnapsack/ power sprayers \n2.2. \nMeasuring devices \n2.3. \nInsect traps \n2.4. \nPesticides (bio or synthetic) \n2.5. \nPruning shears \n2.6. \nShovel \n2.7. \nSafety gears \n2.8. \nPaper/plastic sleeves \n2.9. \nFertilizer \n2.10. Pail \n2.11. Measuring cup \n2.12. Hoe \n2.13. Shovel \n2.14. Carabao pulled implements \n2.15. Pruning shear \n2.16. Pruning saw \n2.17. Bolo \n2.18. Paint\n3. Pest control \nmeasures \nInclude but not limited to: \n3.1. \nPhysical \n3.2. \nMechanical \n3.3. \nBiological \n3.4. \nCultural \n3.5. \nChemical (biopesticide, synthetic) \n3.6. \nIPM \n3.7.\nSanitation\n4. Fertilizers \nInclude the following: \n4.1. \nOrganic \n4.2.\nInorganic\n5. Method of fertilizer \napplication \nInclude but not limited to the following: \n5.1. \nBasal \n5.2. \nSidedress \n5.3. \nTopdress \n5.4. \nLocalized \n5.5. \nBand \n5.6.\nFoliar/Spray\n\n--- PDF PAGE 46 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n45\nVARIABLE \nRANGE \n5.7. \nBroadcast \n6. Watering \nInclude but not limited to: \n6.1. \nDrip \n6.2. \nFurrow \n6.3.\nSprinkler\n7. Rejuvenating \nactivities \nInclude but not limited to the following: \n7.1. \nGrafting \n7.2. \nRatooning \n7.3.\nDe-suckering\n8. Growth training \ntechnique \nInclude but not limited to the following: \n8.1. \nHardening \n8.2. \nPricking \n8.3.\nThinning\n\n--- PDF PAGE 47 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n46\nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Performed pruning according to crops \n1.2. Controlled weed population \n1.3. Monitored pests through recording and reporting of \npests incidence. \n1.4. Practiced pest control measures \n1.5. Applied fertilizer with appropriate method \n1.6. Applied proper irrigation/watering of crops \n1.7. Carried out cultivation practices based on crop \nrequirement \n1.8. Performed rejuvenating activities \n1.9. Performed growth training technique for different \ncrops \n1.10. Carried out mulching techniques \n1.11. Followed Occupational Health and Safety \nStandards\n2. Required Knowledge \nand Attitudes \n \n2.1. Pruning techniques \n2.2. Weeding methods \n2.3. Pest control procedures \n2.4. Fertilizer application \n2.5. Irrigation methods \n2.6. Occupational Safety and Health Standards \n3. Required Skills \n3.1. Basic mathematical processes of addition, \nsubtraction, division and multiplication \n3.2. Proper handling of tools and equipment \n3.3. Pest monitoring by recording and reporting pests \nincidence \n3.4.\nFertilizer and pesticide application \n4. Resource \nImplications \nThe following resources should be provided: \n4.1. Farm or plantation area \n4.2. Storage shed \n4.3. Farm tools/ implements/ equipment \n4.4. Farm supplies \n4.5. Logbooks \n4.6. Irrigation system and parts \n4.7. References (fertilizer and pesticide manual/ \ncatalogue, protocols, field guides, etc.)\n5. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. Direct Observation \n5.2. Demonstration \n5.3. Oral interview and/or written test \n5.4.\nThird party report\n6. Context of \nAssessment \n6.1. Competency may be assessed individually in the \nactual workplace or through accredited institution\n\n--- PDF PAGE 48 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n47\nUNIT OF COMPETENCY \n: \nCARRY-OUT \nHARVEST \nAND \nPOSTHARVEST \nOPERATIONS\nUNIT CODE \n: \nAFF610304 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to perform harvest and postharvest operations \nof major agricultural crops including maintaining quality \nof produce for distribution. This unit also includes proper \nuse of tools and equipment required to perform the \nactivities. This unit does not include secondary \nprocessing. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Perform pre – harvest \noperations \n1.1 \nCrop maturity is identified according to parameters \naffecting physiological growth and physical indicators. \n1.2 \nRecords of crop agronomic history is verified and \nreferenced for maturity. \n1.3 \nObstructions from the field are removed for efficient \nharvesting \n1.4 \nHarvesting tools and materials, and temporary shed \nare readied \n1.5\nRecords regarding crops to be harvested are checked\n2. Perform harvesting \nactivity \n2.1 \nAppropriate harvesting methods are implemented based \non best cultural practices for each crop using suitable \ntools \n2.2 \nCrops are handled according to the postharvest \ntreatment. \n2.3 \nCrops are harvested based on maturity indices and \ncharacteristics affecting harvest quality \n2.4\nHarvesting is performed while observing GAP principles\n3. Perform postharvest \noperation \n3.1 Postharvest operations are employed based on standard \nare followed. \n3.2 Use of postharvest equipment is monitored avoiding \ndamage to crop in line with manufacturer/enterprise \nprocedures. \n3.3 Handling and packaging are done according to variety \nand destination. \n3.4 Crops are stored and stacked in cool dry place prior to \ndistribution in line with enterprise procedures\n4. Monitor storage pest \nand diseases \n4.1 \nPest are identified based on references for storage pest \nand diseases \n4.2 \nIdentified storage pest and diseases are logged and \nreported to immediate authority.\n\n--- PDF PAGE 49 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n48\nRANGE OF VARIABLES \n \n \nVARIABLE \nSCOPE \n1. Physiological growth \n \nInclude the following: \n1.1 Days after flower induction \n1.2 Days after fruit setting\n2. Physical indicators \n \nInclude the following: \n2.1. \nChange in color \n2.2. \nChange in size \n2.3.\nChange in texture\n3. Agronomic history \nInclude the following: \n3.1 Nursery source \n3.2 Variety of plant \n3.3 Planting calendar \n3.3.1 Days after planting \n3.3.2 Days at flowering \n3.3.3 Days at fruit set \n4. Obstructions \nMay include but not limited to: \n4.1. Weeds \n4.2. Dead branches \n4.3. Stakes and wedges\n5. Harvesting tools and \nmaterials \nMay include the following: \n5.1. \nPicking poles \n5.2. \nScythes \n5.3. \nScissors \n5.4. \nShears \n5.5. \nShovels \n5.6. \nCollecting baskets with liners \n5.7. \nHarvesting crates with liner \n5.8. \nContainer with clean water with preservative \n5.9. \nSacks \n5.10. Twines \n5.11. Labels and markers \n6. Records \nInclude the following: \n6.1. \nCrop history \n6.2. \nFarm calendar \n6.3. \nFarm records\n7. Crops \nMay include the following but not limited to: \n7.1. Fruitcrop \n7.1.1. Mangoes \n7.1.2. Papayas \n7.1.3. Pineapple \n7.1.4. Banana \n7.1.5. Citrus \n7.2. Plantation crop \n7.2.1. Coffee\n\n--- PDF PAGE 50 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n49\n7.2.2. Cacao \n7.2.3. Abaca \n7.2.4. Coconut \n7.2.5. Sugarcane \n7.3. Forage \n7.4. Ornamentals \n7.4.1. Rose \n7.4.2. Sampaguita \n7.4.3. Anthurium \n7.4.4. Chrysanthemum \n \n7.5. Cereals \n7.5.1. Rice \n7.5.2. Corn \n7.6. Vegetables \n7.6.1. Leafy \n7.6.2. Fruit vegetable \n7.6.3. Legumes \n7.6.4. Bulbs \n \n7.7. Medicinal plants \n7.7.1. Sambong \n7.7.2. Lagundi \n7.7.3. Tsaang-gubat \n7.7.4. Yierba-buena \n7.7.5. Acapulko \n7.7.6. Bayabas \n7.7.7. Ampalaya \n7.7.8. Pansit-pansitan \n7.7.9. Niyog-niyugan \n7.7.10. Bawang \n \n7.8. Essential Oil plants \n7.8.1. Ilang-ilang \n7.8.2. Sampaguita \n7.8.3. Citronella \n7.8.4. Vanilla \n \n7.9. Culinary Herbs \n7.9.1. basil \n7.9.2. lemon grass \n7.9.3. mint \n7.9.4. tarragon \n7.9.5. parsley \n \n7.10. Spices \n7.10.1. black pepper \n7.10.2. chili \n7.10.3.\n\n--- PDF PAGE 51 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n50\n8. Postharvest \ntreatments \nMay include the following: \n8.1 \nHot water treatment \n8.2 \nVapor heat treatment \n8.3 \nChemical treatment \n8.4 \nBest practices in drying \n8.5 \nPre-cooling treatment\n9. Characteristics \naffecting harvest \nInclude the following: \n9.1. \nContinued occurrence of physiological changes \n9.2. \nHigh in water content \n9.3. \nSusceptible to attack by pathogens and insects\n10. Postharvest \noperation \nInclude the following: \n10.1. \nWashing \n10.2. \nCleaning \n10.3. \nSorting \n10.4. \nTrimming \n10.5. \nChemical Treatment \n10.6. \nGrading \n10.7. \nFermenting \n10.8. \nDrying \n10.9. \nBlanching \n11. Postharvest \nequipment \nInclude the following: \n11.1. Hot water treatment machine \n11.2. Sorter \n11.3. Weighing scale\n12. Damage \nInclude the following: \n12.1. Bruising \n12.2. Wounding \n12.3. Abrasion\n13. Packaging \nIncludes: \n13.1. Crates (wooden, plastics andstyro) \n13.2. Paper wrap \n13.3. Carton box \n13.4. PEB(Polyethylene bags) \n13.5. Styro \n13.6. Sacks/bags\n14. Storage and stacking \n14.1. On-farm storage \n14.2. Off-farm storage\n15. References \n15.1. Pictorial guide \n15.2. Posters \n15.3. Pamphlets\n16. Storage pest and \ndiseases \n16.1. Insect pest \n16.2. Rodents \n16.3. Fungi \n16.4. Bacteria\n\n--- PDF PAGE 52 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n51\nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared field and materials/tools used for harvesting \nand postharvest \n1.2 Identified and applied maturity indices when harvesting \n1.3 Harvested and handled crops properly \n1.4 Maintained quality of crops during distribution and \nstorage applying consideration for optimum condition \n1.5 Monitored storage pest and diseases\n2. Required \nKnowledge and \nAttitudes \n \n \n2.1 Safety Practices \n2.1.1 Knowledge on HACCP principles \n2.1.2 Knowledge on Good Manufacturing Practices \n2.2 Mathematics and Measurement \n2.2.1 Measurement of humidity and temperature \n2.2.2 Measurement of area, volume, and weight \n2.2.3 Simple mathematical computation \n2.3 Tools & Equipment: Uses and Specification \n2.3.1 Use of measuring devices \n2.3.2 Operation of machines and equipment \n2.4 Systems, Processes and Operations \n2.4.1 Principles and practices in harvest and postharvest \n2.4.1.1 Different storage pest and diseases \n2.4.1.2 Different handling and packaging of produce \n2.4.2 Identification of postharvest facilities, \n2.5 Values \n2.5.1 Effective team player \n2.5.2 Smooth Interpersonal Relationship (SIR) \n2.5.3 Observant of work ethics\n3. Required Skills \n3.1 \nCommunicating ideas and info \n3.2 \nCollecting information \n3.3 \nProper use and maintenance of tools and equipment \n3.4 \nMonitoring skills \n3.5 \nMaintain quality of stored commodities \n3.6\nPhysical analysis of crop for quality standards \n4. \nResource \nImplications \nThe following resources should be provided: \n4.1 \nFacilities and equipment appropriate for harvest and \n postharvest of crops \n4.2 \nSupplies and materials contingent to machines \n4.3 \nFarm house \n4.3.1 Packing area \n4.3.2 Storage facilities \n4.4 \nFarm tools/ implements/ equipment \n4.5 \nWriting instruments \n4.6 \nFarm supplies \n4.7 \nLogbooks \n4.8 \nReferences (catalogue, protocols, field guides, GAP, \nOHSS manuals)\n\n--- PDF PAGE 53 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n52\n5. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 \nDirect observation and questioning \n5.2 \nDemonstration (simulated) \n5.3 \nOral interview and written test \n5.4\nThird party report\n6. \nContext of \nAssessment \n6.1 Competency may be assessed individually in the actual \nworkplace or through TESDA accredited institution \n6.1.1 Private farms \n6.1.2 Farm school\n\n--- 