        "source_text": "AFF 321206\n \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to process farm wastes. It comprises functions \nsuch as collecting farm wastes, conducting waste \nidentification and segregation, treating and processing \nfarm wastes and performing housekeeping duties. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Collect farm wastes \n1.1 Tools and materials are prepared for collection \nof farm wastes. \n1.2 Wastes are collected following OSHS and waste \ncollection requirements and plan. \n1.3 Dangerous and hazardous wastes are collected \nfollowing the HAZMAT(hazardous material) \nprotocol. \n1.4 Appropriate personal protective equipment (PPE) \nare worn as prescribed by Occupational Safety \nand Health Standards (OSHS). \n2. Identify and segregate \nwastes \n \n2.1 Wastes are identified by categories according to \nindustry standards and environmental legislation. \n2.2 Wastes are segregated according to \norganizational requirements and relevant \nlegislation. \n2.3 Sorted waste is placed into labelled container to \navoid littering and prevent cross-contamination. \n2.4 Information on waste is obtained by asking \nauthority to ensure correct identification.\n3. Treat and process farm \nwastes \n3.1 Dangerous and hazardous wastes are handled \naccording to organizational requirements and \nrelevant legislation following OSHS procedures. \n3.2 Processing of farm wastes is done following \nenvironmental legislation and codes. \n3.3 Principles of 3Rs (reduce, reuse and recycle) are \napplied accordingly. \n3.4 Farm wastes are disposed of according to \nenvironmental legislation and codes.\n4. Perform housekeeping \n4.1 Appropriate warning signs and labels are \ndisplayed in conspicuous places around the \nworkplace. \n4.2 Work area is cleaned according to 5S principles.\n\n--- PDF PAGE 27 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n26\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n4.3 Tools are checked, cleaned and stowed \naccording to established industry procedures and \nfollowing user’s manual. \n4.4 Materials are stored following industry standard \nprocedures and manufacturer’s specifications. \n4.5 PPE is checked for damage prior to ensuring that \nclean and undamaged equipment is stored. \n4.6 Storage facility is checked to ensure no \ncontamination in the area according to \norganizational requirements and legislation and \ncodes. \n4.7 Record keeping is done according to industry \nrequirements.\nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Tools and materials \nTools and materials include: \n1.1. Tools \n1.1.1 Spade \n1.1.2 Wheel borrow \n1.1.3 Broomstick \n1.1.4 Sprayer or pressurized pump \n1.2. Materials \n1.2.1 Sacks \n1.2.2 Containers \n1.2.3 Disinfectants \n1.2.4 Detergents \n1.2.5 First-aid kit \n1.2.6 Chemical spill kit \n1.2.7 Personal Protective Equipment \no Goggles \no Disposal gloves \no Face mask \no Rubber boots \no\nOverall\n2. Agricultural wastes \nAgricultural wastes may include: \n2.1. Plant materials \n2.2. Hay \n2.3. Weeds \n2.4. Twigs \n2.5. Twines \n2.6. Empty wooden crates \n2.7. Animal manure \n2.8. Feed refuse \n2.9. Spoiled feeds (Forage and feed supplements)\n\n--- PDF PAGE 28 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n27\nVARIABLE \nRANGE \n2.10. \nSpent bedding materials \n2.11. \nEmpty sacks \n2.12. \nTrash fish \n2.13. \nFish meal \n2.14.\nEffluent\n3. Dangerous and \nhazardous wastes \nDangerous and hazardous wastes may include: \n3.1 Pesticides \n3.2 Syringes \n3.3 Expired biologics \n3.4 Expired veterinary drugs \n3.5 Spoiled milk \n3.6 Diseased plant and plant parts \n3.7 Empty veterinary bottles/syringes\n4. Categories \nCategories may include: \n4.1 Re-usable \n4.2 Recyclable \n4.3 Solid \n4.4 Liquid\n5. Processing of wastes \nProcessing of wastes may include: \n5.1. Composting \n5.2. Compacting \n5.3. Liquefying \n5.4. Shredding \n5.5. Carbonizing \n5.6. Charcoaling\n6. Record \nRecord includes: \n6.1. Record of farm wastes generated and disposed \n6.2. Record of incidence of infection and accidents \n6.3. Record of chemical spillage \n6.4. Record of destroyed carcasses \n6.5. Inventory of tools, materials and equipment\n \n \nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Collected farm wastes \n1.2. Identified and segregated farm wastes \n1.3. Processed farm wastes \n1.4. Performed housekeeping \n2. Required \nKnowledge and \nAttitudes \n \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. Tools and materials use in wastes management \n2.1.2. Categories of farm wastes \n2.1.3. Wastes collection and segregation procedures \n2.1.4. Farm-waste handling, storage and disposal \nprocedures\n\n--- PDF PAGE 29 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n28\n2.1.5. Dangerous and hazardous wastes, hazardous \nmaterials (hazmat) protocols \n2.1.6. Principles of 5S and 3R \n2.2. Communications \n2.2.1 Preparation of inventory reports and production \nrecords \n2.2.2 Report on untoward incidence in the area \n2.3. Mathematics and Mensuration \n2.3.1. Profitability of the operation \n2.3.2. Volume of farm wastes \n2.4. Safety Practices \n2.4.1. Personal Protective Equipment (PPE) \n2.4.2. Material Safety Data Sheets(MSDS) \n2.5. Codes and Regulations \n2.5.1. Appropriate legal regulatory body such as BAI, EMB \nand DOH,BFAD \n2.5.2. Occupational Safety and Health Standards \n2.5.3. RA 9003 \n2.5.4. RA 6969 \n2.6. Materials, Tools & Equipment: Uses, Specifications and \nMaintenance \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional manuals\n2.6.1.2. Safe keeping of equipment every after use \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies, materials \nand equipment needed in the maintenance of \nthe poultry house and farm \n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills for farm area \n2.7. Values \n2.7.1. Safety and health consciousness \n2.7.2. Resourcefulness \n2.7.3. Diligence \n2.7.4. Time consciousness \n2.7.5. Cost-consciousness \n2.7.6. Personal integrity in doing routine management \npractices \n2.7.7. Perseverance in executing routine works \n2.7.8.\nAbility to work with others harmoniously\n3. Required Skills \n3.1 Occupational health safety \n3.2 Skills in using tools and equipment \n3.3 Calculations \n3.4\nCommunicate effectively\n4. Resource \nImplications \nThe following resources should be provided: \n4.1 Farm area \n4.2 Different farm wastes \n4.3\nFarm-waste processing area\n\n--- PDF PAGE 30 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n29\n4.4 Tools, supplies and materials use in farm wastes collection, \nsegregation and processing \n4.5 Housekeeping tools and supplies \n4.6\nPPE\n5. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 Observation and questioning \n5.2 Third-Party Report \n5.3 Demonstration and oral questioning\n6. Context of \nAssessment \n6.1 Competency maybe assessed individually in the actual \nworkplace or in accredited farms or institution\n\n--- PDF PAGE 31 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n30\nUNIT OF COMPETENCY : \nPERFORM RECORD-KEEPING \n \nUNIT CODE \n \n:"
