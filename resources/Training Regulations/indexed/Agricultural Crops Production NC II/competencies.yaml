        "source_text": "AFF 321201 \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \nrequired to perform safety measures effectively and \nefficiently. It includes identifying areas, tools, materials, \ntime and place in performing safety measures. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\n1. \nDetermine areas of \nconcern for safety \nmeasures \n1.1 \nWork tasks are identified in line with farm \noperations \n1.2 \nPlace for safety measures are determined in line \nwith farm operations \n1.3 \nTime for safety measures are determined in line \nwith farm operations \n1.4 \nAppropriate tools, materials and outfits are \nprepared in line with job requirements\n2. \nApply appropriate \nsafety measures \n2.1 \nTools and materials are used according to \nspecifications and procedures \n2.2 \nOutfits are worn according to farm requirements \n2.3 \nEffectivity/shelf life/expiration of materials are \nstrictly observed \n2.4 \nEmergency procedures are known and followed \nto ensure a safework requirement \n2.5 \nHazards in the workplace are identified and \nreported in line with farm guidelines\n3. \nSafekeep/dispose \ntools, materials and \noutfit \n3.1 \nUsed tools and outfit are cleaned after use and \nstored in designated areas \n3.2 \nUnused materials are properly labeled and stored \naccording to manufacturers recommendation and \nfarm requirements \n3.3 \nWaste materials are disposed according to \nmanufacturers, government and farm \nrequirements\n\n--- PDF PAGE 18 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n17\n \n \nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Work tasks \nWork task may be selected from any of the \nsubsectors: \n1.1 Aquaculture \n1.2 Animal Production \n1.3 Crop Production \n1.4 Post-harvest \n1.5 Agri-marketing \n1.6\nFarm Equipment\n2. Place \n2.1 Animal pens, cages, barns \n2.2 Fish ponds, cages \n2.3 Stock room/storage areas/warehouse \n2.4 Field/farm/orchard \n3. Time \n3.1 Vaccination and medication period \n3.2 Fertilizer and pesticides application \n3.3 Feed mixing and feeding \n3.4 Harvesting and hauling \n3.5 Cleaning, sanitizing and disinfecting \n3.6\nDressing, butchering and castration\n4. Tools, materials and \noutfits \n4.1 Tools \n4.1.1 Wrenches \n4.1.2 Screw driver \n4.1.3 Pliers \n4.2 Materials \n4.2.1 Bottles \n4.2.2 Plastic \n4.2.3 Bags \n4.2.4 Syringe \n4.3 Outfit \n4.3.1 Masks \n4.3.2 Gloves \n4.3.3 Boots \n4.3.4 Overall coats \n4.3.5 Hat \n4.3.6 Eye goggles\n5. Emergency procedures \n5.1 Location of first aid kit \n5.2 Evacuation \n5.3 Agencies contract \n5.4\nFarm emergency procedures\n6. Waste materials \n6.1 Animal manure \n6.2 Waste water \n6.3\nSyringes\n\n--- PDF PAGE 19 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n18\n6.4 Unused farm chemicals e.g. pesticides, \nchemicals, fertilizers \n6.5 Expired reagents \n6.6\nDead animals\n7. \nHazards \n7.1 Chemical \n7.2 Electrical \n7.3\nFalls\n \n \nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Determined areas of concern for safety measures \n1.2 Applied appropriate safety measures according to \nindustry requirements \n1.3 Prepared tools, materials and outfit needed \n1.4 Performed proper disposal of used materials \n1.5 Safekeep/cleaned tools, materials and outfit in designated \nfacilities \n2. Required \nKnowledge \n2.1 Safety Practices \n2.1.1 Implementation of regulatory controls and \npolicies relative to treatment of area and \napplication of chemicals \n2.1.2 Proper disposal of waste materials \n2.2 Codes and Regulations \n2.2.1 Compliance to health program of DOH and \nDENR \n2.2.2 Hazard identification \n2.2.3 Emergency procedures \n2.3 Tools & Equipment: Uses and Specification \n2.3.1 Masks, gloves, boots, overall coats for health \nprotection \n2.4 Maintenance \n2.4.1 Regular check-up and repair of tools, materials \nand outfit before and after use\n3. Required Skills \n3.1 Ability to recognize effective tools, materials and outfit \n3.2 Ready skills required to read labels, manuals and other \nbasic safety information\n4. Resource \nImplications \nThe following resources should be provided: \n4.1 Farm location \n4.2 Tools, equipment and outfits appropriate in applying \nsafety measures\n5. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1. Practical demonstration \n5.2. Third Party Report \n6. Context of \nAssessment \n6.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 20 ---\nTR-Agricultural Crops Production NCII Promulgated December 2013 \n \n19\n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nUNIT OF COMPETENCY : USE FARM TOOLS AND EQUIPMENT \nUNIT CODE :"
