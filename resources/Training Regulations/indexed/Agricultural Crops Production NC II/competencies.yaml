        "source_text": "--- PDF PAGE 31 ---\nTR-Agricultural Crops Production NCII                     Promulgated December 2013 \n \n30\nUNIT OF COMPETENCY : \nPERFORM RECORD-KEEPING \n \nUNIT CODE  \n \n: \nSOC 413206 \n \nUNIT DESCRIPTOR          :  \nThis unit covers the knowledge, skills and attitude \nrequired to carry-out inventory activities, maintain \nproduction record and prepare financial records. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Carry out inventory \nactivities \n1.1 Inventory inputs are determined according \nenterprise requirements. \n1.2 Defective tools and equipment are determined \naccording to operation manuals \n1.3 Facilities are inspected according to according \nstandard codes and laws. \n2. Maintain production \nrecord \n \n2.1 Production plan are prepared according to \nenterprise requirements. \n2.2 Schedule for production activities are prepared \nbased from enterprise requirements and plan. \n2.3 Production report are prepared in accordance with \nenterprise reporting procedures \n2.4 Input and production are monitored using \nmonitoring chart. \n3. Prepare financial \nrecords \n3.1. Production cost are computed using established \ncomputation procedures.  \n3.2. Revenue is computed using established \ncomputation procedures.\n\n--- PDF PAGE 32 ---\nTR-Agricultural Crops Production NCII                     Promulgated December 2013 \n \n31\nRANGE OF VARIABLES \n \n \nVARIABLE \nSCOPE \n1. Inventory inputs\n \n1.1 Plant\n1.1.1. Planting materials \n1.1.2. Fertilizer \n1.1.3. Concoctions (Pesticides and insecticides) \n1.1.4. Beneficial microorganisms  \n1.2 Animals \n1.2.1. Stocks \n1.2.2. Feeds \n1.2.3. Concoctions \n1.2.4. Medications \n1.2.5. Beneficial microorganisms \n1.2 Miscellaneous materials\n2. Production activities\n2.1.\nPlant\no Planting \no Fertilizer application \no Pesticides application \no Implementation of bio-security measures \no Irrigation/watering \no Weeding \no Harvesting \no Post-harvesting \n2.2. \nAnimal \no \nFeeding \no \nCleaning and Sanitization \no \nImplementation of bio-security measures \no \nGrowth and health condition \no \nHarvesting \no \nPost harvesting \n2.3.\nMiscellaneous activities \n3. Production report\n3.1.\nCategorize and record quality of harvest\n3.2.\nvolume /quantity of products harvested\n4. Input\n4.1.\nInput(plant)\no Fertilizer \no Concoctions (Pesticides and insecticides) \no Beneficial microorganisms \n4.2. \nInput(animal) \no Feeds \no Concoctions \no Medications \no Beneficial microorganisms \n4.3.\nMiscellaneous inputs\n5. Production\n5.1\nGrowth rate\n5.2\nSurvival rate\n6. Production cost\n6.1.\nLabor \n6.2. \nInputs \n6.3. \nTools, equipment and facility depreciation cost  \n6.4. \nAdministrative cost \n6.5.\nMiscellaneous\n\n--- PDF PAGE 33 ---\nTR-Agricultural Crops Production NCII                     Promulgated December 2013 \n \n32\nEVIDENCE GUIDE \n \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Determined inventory inputs according enterprise requirements \n1.2. Determined defective tools and equipments according to \noperation manuals. \n1.3. Inspected facilities according to standard codes and laws. \n1.4. Prepared production plan and report according to enterprise \nrequirements and reporting procedures.\n2. Required Knowledge \nand Attitudes  \n \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. \nKinds of tools and equipment \n2.1.2. \nDefects of tools and equipment \n2.1.3. \nMonitoring method \n2.1.4. \nFarm planning and budgeting \n2.1.5. \nMethods and process of production \n2.1.6. \nQuality control \n2.1.7. \nBasic bookkeeping \n2.1.8. \nPractice 3Rs and 5S \n2.1.9. \nProgram of work activities are implemented as scheduled \n2.2. Communication \n2.2.1.  Prepare and submit required reports  \n2.2.2. Documentation of production and financial data \n2.3. Mathematics and Mensuration \n2.3.1.