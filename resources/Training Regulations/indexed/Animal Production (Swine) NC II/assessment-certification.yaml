  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.\nTo attain the National Qualification of Animal Production (Swine) NC II,\nthe candidate must demonstrate competence in all the units listed in\nSection 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2.\nThe qualification of Animal Production (Swine) NC II may be attained\nthrough:\n\n4..2.1. Accumulation of Certificates of Competency (COCs) in the\nfollowing areas:\n\n4.2.1.1.\nHandle Breeders\n4.2.1.2.\nHandle farrowing sows and sucklings\n4.2.1.3.\nRaise weanlings\n4.2.1.4.\nProduce finishers\n4.2.1.5.\nMaintain healthy animal environment\n4.2.1.6.\nApply biosecurity measures\n\n Successful candidates shall be awarded Certificates of\nCompetency (COCs) bearing the signature of the Regional\nDirector and Chair of the recognized local industry body.\n\n4.2.2. Demonstration of competence through project-type assessment\ncovering all required units of the qualification.\n\n4.3.\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4.\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs\n\n4.4.2 Experienced Workers (wage employed or self-employed)\n\n\n4.5.\nThe guidelines on assessment and certification are discussed in detail in\nthe Procedures Manual on Assessment and Certification and Guidelines\non the Implementation of the Philippine TVET Qualification and\nCertification System (PTQCS).\n\n--- PDF PAGE 74 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II\nPROMULGATED December 2013\n73\nSupermarket of Competencies\nAGRI-FISHERY Sector\n"
}
