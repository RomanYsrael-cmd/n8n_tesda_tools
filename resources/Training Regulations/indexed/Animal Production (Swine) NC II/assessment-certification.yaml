      "text": "The guidelines on assessment and certification are discussed in detail in the Procedures Manual on Assessment and Certification and Guidelines on the Implementation of the Philippine TVET Qualification and Certification System (PTQCS). --- PDF PAGE 74 --- TR-ANIMAL PRODUCTION (SWINE) NC II PROMULGATED December 2013 73 Supermarket of Competencies AGRI-FISHERY Sector Animal Production (Swine) NCII Handle Breeders Handle Farrowing Sows and Sucklings Raise Weanlings Produce Finishers Apply Safety Measures in Farm Operations Use Farm Tools and Equipment Perform Estimation and Basic Calculation Work in a team environment Participate in workplace communication Practice career professionalism Practice occupational health and safety procedures Process Farm Wastes Maintain Healthy Animal Environment Apply Biosecurity Measures --- PDF PAGE 75 --- TR-ANIMAL PRODUCTION (SWINE) NC II PROMULGATED December 2013 74 Barrow – a male swine, castrated (testicles removed) before it reaches sexual maturity Boar – uncastrated male swine usually kept for breeding Colostrum – first milk from a female animal after giving birth Crossbreed – a group of animals produced by mating two or more different breeds or strains of animals Culling – is the removal of undesirable or inferior animals in the herd based on important economic traits and overall performance Estrus – period of time when the female will accept male. Also known as heat period Farrowing – the act of giving birth in pigs or swine Gestation Period – refers to the period of carrying the young in the womb Gilt – a young female hog that has not given birth yet Immunization – prevention of diseases by providing appropriate vaccines to animals Inbreeding – mating of closely related animals in a herd Livestock – domestic animals kept for use on a farm and raised for sale and profit Litter – the offsprings at one birth of a multiparous or animal like swine Litter Size – refers to the aggregate number of piglets per farrowing Nutrients – food elements or substance found in the feeds such as protein, carbohydrates, fats and others Dry sow – a sow whose litter has been weaned but which has not yet been bred or is not pregnant Purebreeding – is the mating of the unrelated individuals in the same breed Ration – the total amount of feeds taken in by an animal during a 24 hour period Selection – refers to the process of choosing males and females with desirable characteristics either for breeding or replacement stocks Sow – a mature female hog that had given birth Swine – a collective term for hogs --- PDF PAGE 76 --- TR-ANIMAL PRODUCTION (SWINE) NC II PROMULGATED December 2013 75 Vaccination – a preventive measure to inoculate an animal with a mildly toxic preparation of bacteria or a virus of specific disease to prevent or to lessen the effects of the disease Waterer – equipment used in providing water to animals Weanling – refers to a young animal of either sex which has been separated from the mother at the end of the lactation period --- PDF PAGE 77 --- TR-ANIMAL PRODUCTION (SWINE) NC II PROMULGATED December 2013 76 The Technical Education and Skills Development Authority (TESDA) wishes to extend gratitude and appreciation to the many representatives of business, industry, academe and government agencies and labor groups who donated their time and expertise to the development and validation of these Training Regulations. • THE TECHNICAL ADVISORY PANEL (TAP) DR. MARIO S. SUBA (Chair) DIR. PETE OCAMPO Presidential Assistant for Internal Development / Professor Livestock Development Council Department of Agriculture Central Luzon State University (CLSU) City Science of Muños, Nueva Ecija MS. JOSEFINA A. CONTRERAS Officer-In-Charge DR. EDUARDO M. MARIANO (DVM) Farm Manager/ Consultant ARSEN Farm Inc. Bureau of Animal Industry Majayjay, Laguna Valenzuela Metro Manila • THE TECHNICAL EXPERT PANEL (TEP) MR. ERNESTO DOBLON MR. ELMER PERMITES Trainer Royal Chicks Farm Quezon National Agricultural 