        "source_title": "RAISE WEANLINGS",
        "source_text": "--- PDF PAGE 45 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n44\nUNIT OF COMPETENCY \n: RAISE WEANLINGS  \nUNIT CODE \n \n \n:    AFF621218 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes  \n \n \nrequired to strategically prevent post-weaning lag,  \n \n \neffectively and efficiently, thus ensuring a healthy  \nstarter stocks for finishing. It includes preparation of \npiglets for weaning; handling of newly-weaned \npiglets; maintaining health and record keeping.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Prepare piglets for \nweaning \n1.2 \nPens are cleaned and disinfected based on farm \nspecifications \n1.3 \nMaterials and equipment are adjusted and supplied \n1.4 \nWeaners are grouped based on farm specifications. \n1.5 \nWeaners are transferred in compliance with the \nAnimal Welfare Act \n1.6\nAnimals are fed according to animal requirements.\n2. Maintain conducive \natmosphere and facilities \nfor feeding \n \n2.1 Pen is cleaned regularly following standard hygienic \nprocedures.   \n2.2 Proper temperature is provided based on the \nMinimum Standards on the Welfare of Pigs and Code \nof Good Animal Husbandry Practices (GAHP) \n2.3 Feeders are checked and adjusted to ensure proper \nfunctioning \n2.4 Feed ration is gradually shifted and increased based \non animal requirements \n2.5 Fresh and clean water is provided at all times (adli \nbitum )\n3. Maintain health of newly-\nweaned piglets \n3.2 Animal condition is monitored following enterprise \nprocedures. \n3.3 Uniformity of litter is monitored following farm \nprocedures. \n3.4 Weaners are dewormed based on farm protocols \n3.5 Vaccination programs are implemented based on \nveterinary recommendations.\n4. Record data \n4.1 Weanling records are updated using standard \nenterprise \n4.2 Weaning  schedules are monitored  \n4.3 Production performance of weanlings are monitored \nand reported according to enterprise procedures.\n\n--- PDF PAGE 46 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n45\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Materials and \nequipment \n1.1 \nAutomatic drinkers \n1.2 \nFeeders \n1.3 \nHeat lamps/bulbs \n1.4 \nBrooders \n1.5 \nIdentification markers \n1.6\nDisinfectants\n2. Adjusted \n2.1. \nIncrease quantity of feeds \n2.2.\nDecrease quantity of feeds\n3. Feed ration shifted \n3.1. \nBooster to pre-starter \n3.2. \nStarter-grower \n3.3.\nGrower-Finisher\n4. Animal condition \n4.1. \nChanges in animal behavior \n Listlessness \n Increase in body temperature \n Loss appetite \n Solitary separation from the group \n Huddling \n Thumping \n4.2. \nChanges fecal consistency \n Constipation \n Diarrhea – liquid, pasty \n4.3. \nChanges in fecal color \n Yellowish \n Greenish \n Fatty \n Orange \n Whitish \n5. Production \nperformance \n7.1 \nAverage daily gain \n7.2 \nFeed conversion ratio\n\n--- PDF PAGE 47 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n46\nEVIDENCE GUIDE \n \n1 Critical Aspects of \nCompetency  \n \nAssessment requires evidence that the candidate: \n1.1. \nPrepared piglets for weaning  \n1.2. \nManaged newly-weaned piglets \n1.3. \nMaintained health of newly-weaned piglets \n1.4.\nRecorded data\n2 2. Required \nKnowledge and \nAttitudes \n \n \n \n2.1 Communication \n2.1.1 \nPreparation of weaners’card, performance and \nhealth records, mortality and morbidity rates, \nfinancial transactions and indicators of production \nefficiency \n \n2.2 Safety Practices \n2.2.1 \nImplementation of regulatory controls and policies \nrelative to proper handling, use and disposal of \nbiologics and other veterinary drugs and supplies \n2.2.2 \nProper attire inside the farm premises \n \n2.3 Mathematics and Mensuration \n2.3.1 \nComputation of mortality rates, piglets weaned per \nsow per year, feed conversion efficiency, and \nfinancial viability of the swine enterprise  \n \n2.4 Codes and Regulations \n2.4.1 \nCompliance to animal health program, standards \nand accreditation program of the Bureau of Animal \nIndustry (BAI) and Local Government Units (LGUs) \n2.4.2 \nCompliance with environmental standards set by \nthe DENR and LGUs \n2.4.3 \nCompliance with standards set by the Bureau of \nAgriculture and Fishery Products Standards \n(BAFPS) \n \n2.5 Systems, Processes and Operations \n2.5.1 \nGeneral care and herd health management from \npiglet to weaning age and weight \n \n2.6 Tools and Equipment: Uses and Specifications \n2.6.1 \nAutomatic drinkers and feeders \n2.6.2 \nPower sprayer \n2.6.3 \nFeeding scoops \n2.6.4 \nWeighing  scale (500 kg cap.) – \n2.6.5 \nTooth clipper, forceps, scissor and other tools for \nidentification of animals \n2.6.6 \nAutomatic syringe and needles \n \n2.7 Maintenance \n2.7.1 \nRegular check-up and repair of tools and \nequipment\n\n--- PDF PAGE 48 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n47\n \n2.8 Materials: Uses and Specifications \n2.8.1 \nOffice equipment and supplies for regular \nmonitoring of production performance and \neconomic viability of the swine operation \n2.9 Values  \n2.9.1 \nSafety consciousness on vaccine handling and \nother biological \n2.9.2 \nAccuracy in medication and treatment of hog’s \ndiseases \n2.9.3 \nCompetence and self-confidence towards selection \nof good weaners \n2.9.4 \nHonesty in marketing and financial transactions \n2.9.5 \nPerseverance and industriousness on care and \nmanagement of the general heard\n3 Required Skills \n3.1 Work safety \n3.2 Skills in using tools and equipment \n3.3 Calculations \n3.4 Communicating ideas and info\n4 Resource \nImplications \n4.1 Farm  \n4.2 Pens \n4.3 Tools and equipment appropriate in raising weanlings \n4.4 Piglets (weanlings)\n5 Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 Practical demonstration related to underpinning knowledge, \nskills and attitudes \n5.2 Assessment by immediate superiors with regards to the \nwork accomplishment \n5.3 Interviews with the participants on actual work or training \nsettings\n6 Context of \nAssessment \n \n6.1 Competency maybe assessed individually in the workplace \nor in a simulated workplace individually or as a part of a \nteam under limited supervision\n",
