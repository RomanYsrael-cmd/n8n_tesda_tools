\n2.2. Wastes are segregated according to organizational \nrequirements and relevant legislation. \n2.3. Sorted waste is placed into labelled container to avoid \nlittering and prevent cross-contamination. \n2.4. Information on waste is obtained by asking authority \nto ensure correct identification.\n3. Treat and process \nfarm wastes \n3.1. Dangerous and hazardous wastes are handled \naccording to organizational requirements and \nrelevant legislation following OSHS procedures. \n3.2. Processing of farm wastes is done following \nenvironmental legislation and codes. \n3.3. Principles of 3Rs (reduce, reuse and recycle) are \napplied accordingly. \n3.4. Farm wastes are disposed of according to \nenvironmental legislation and codes.\n4. Perform \nhousekeeping \n4.1. Appropriate warning signs and labels are displayed \nin conspicuous places around the workplace. \n4.2. Work area is cleaned according to 5S principles. \n4.3. Tools are checked, cleaned and stowed according to \nestablished industry procedures and following user’s \nmanual. \n4.4. Materials are stored following industry standard\n\n--- PDF PAGE 28 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n27\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \nprocedures and manufacturer’s specifications. \n4.5. PPE is checked for damage prior to ensuring that \nclean and undamaged equipment is stored. \n4.6. Storage facility is checked to ensure no \ncontamination in the area according to organizational \nrequirements and legislation and codes. \n4.7. Record keeping is done according to industry \nrequirements.\n\n--- PDF PAGE 29 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n28\nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Tools and materials \nTools and materials include: \n1.1. Tools \n• Spade \n• Wheel borrow \n• Broomstick \n• Sprayer or pressurized pump \n1.2. Materials \n• Sacks \n• Containers \n• Disinfectants \n• Detergents \n• First-aid kit \n• Chemical spill kit \n• Personal Protective Equipment \no Goggles \no Disposal gloves \no Face mask \no Rubber boots \no\nOverall\n2. Agricultural wastes \nMay include: \n2.1. \nPlant materials \n2.2. \nHay \n2.3. \nWeeds \n2.4. \nTwigs \n2.5. \nTwines \n2.6. \nEmpty wooden crates \n2.7. \nAnimal manure \n2.8. \nFeed refuse \n2.9. \nSpoiled feeds (Forage and feed supplements) \n2.10. Spent bedding materials \n2.11. Empty sacks \n2.12. Trash fish \n2.13. Fish meal \n2.14. Effluent\n3. Dangerous and \nhazardous wastes \n5.1. Pesticides \n5.2. Syringes \n5.3. Expired biologics \n5.4. Expired veterinary drugs \n5.5. Spoiled milk \n5.6. Diseased plant and plant parts \n5.7.\nEmpty veterinary bottles/syringes\n4. Categories \n3.1. Re-usable \n3.2. Recyclable \n3.3. Solid \n3.4.\nLiquid\n\n--- PDF PAGE 30 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n29\nVARIABLE \nSCOPE \n5. Processing of wastes \n4.1. Composting \n4.2. Compacting \n4.3. Liquefying \n4.4. Shredding \n4.5. Carbonizing \n4.6.\nCharcoaling\n6. Record \n6.1. Record of farm wastes generated and \ndisposed \n6.2. Record of incidence of infection and accidents \n6.3. Record of chemical spillage \n6.4. Record of destroyed carcasses \n6.5.\nInventory of tools, materials and equipment\n\n--- PDF PAGE 31 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n30\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Collected farm waste \n1.2. Identified and segregated farm waste \n1.3. Processed farm waste \n1.4. Performed housekeeping\n2. Required \nKnowledge and \nAttitudes \n \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. Tools and materials use in wastes management \n2.1.2. Categories of farm wastes \n2.1.3. Wastes collection and segregation procedures \n2.1.4. Farm-waste handling, storage and disposal \nprocedures \n2.1.5. Dangerous and hazardous wastes, hazardous \nmaterials (hazmat) protocols \n2.1.6. Principles of 5S and 3R \n2.2. Communications \n2.4.1 Preparation of inventory reports and production \nrecords \n2.4.2 Report on untoward incidence in the area \n2.3. Mathematics and Mensuration \n2.3.1. Profitability of the operation \n2.3.2. Volume of farm wastes \n2.4. Safety Practices \n2.4.1. Personal Protective Equipment (PPE) \n2.4.2. Material Safety Data Sheets(MSDS) \n2.5. Codes and Regulations \n2.5.1. Appropriate legal regulatory body such as BAI, EMB \nand DOH,BFAD \n2.5.2. Occupational Safety and Health Standards \n2.5.3. RA 9003 \n2.5.4. RA 6969 \n2.6. Materials, Tools & Equipment: Uses, Specifications and \nMaintenance \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional manuals \n2.6.1.2. Safe keeping of equipment every after use \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies, materials \nand equipment needed in the maintenance of \nthe poultry house and farm \n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills for farm area \n2.7. Values \n2.7.1. Safety and health consciousness \n2.7.2. Resourcefulness \n2.7.3. Diligence \n2.7.4. Time consciousness \n2.7.5.Cost-consciousness\n\n--- PDF PAGE 32 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n31\n2.7.6. Personal integrity in doing routine management \npractices \n2.7.7. Perseverance in executing routine works \n2.7.8.Ability to work with others harmoniously\n3. Required Skills \n3.1 \nOccupational health and safety \n3.2 \nSkills in using tools and equipment \n3.3 \nCalculations \n3.4\nCommunicate effectively\n4. Resource \nImplications \nThe following resources should be provided: \n4.1 Farm area \n4.2 Different farm wastes \n4.3 Farm-waste processing area \n4.4 Tools, supplies and materials use in farm wastes \ncollection, segregation and processing \n4.5 Housekeeping tools and supplies \n4.6\nPPE\n5. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 \nObservation and questioning \n5.2 \nThird-Party Report \n5.3\nDemonstration and oral questioning\n6. Context of \nAssessment \n6.1 \nCompetency maybe assessed individually in the \nactual workplace or in accredited farms or institution\n\n--- PDF PAGE 33 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n32\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n: HANDLE BREEDERS \nUNIT CODE \n \n \n: AFF621216 \n \n \n \nUNIT DESCRIPTOR \n \n: This unit covers the knowledge, skills and attitudes \nrequired to select the genetically superior breeders \nand replacement stocks, proper handling and \nfeeding of boar, sows and gilts, providing care and \nmonitoring the health of the breeders \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Perform preparatory \nbreeding activities \n \n \n \n \n1.1 Acclimatization of newly-arrived stocks is done \nfollowing industy standard as prescribed by \nveterinarian or an animal health technician. \n1.2 Animals are given routine medication as \nprescribed by veterinary. \n1.3 Suitable breeds are selected based on industry \nstandards and choice of enterprise. \n1.4 Breeder stocks are selected based on industry \nand enterprise standards \n2. Breed sows and gilts \n \n \n \n2.1 Signs of heat are monitored based on standards \nprotocol. \n2.2 Heat-detection techniques are performed \nfollowing established protocol. \n2.3 Sows/Gilts are bred using breeding systems \nbased on choice of enterprise. \n3. Prepare and train boar for \nbreeding \n \n3.1 Boar is trained to mount a female or a dummy sow \n3.2 Boar is given prescribed vaccines and medications \n3.3 Ideal weight and age are determined according \nindustry standards. \n3.4 Optimum boar to sow ratio is observed following \nstandard monitoring scheme. \n4. Monitor signs of pregnancy \n4.1 Signs of pregnancy are monitored according to \nstandards protocol. \n4.2 Pregnancy diagnosis is performed according to \nstandard procedures. \n5. Maintain and monitor \nanimal health condition \n \n5.1. Periodic activities are performed following work \nplan and breeding schedules. \n5.2. Animal stocks are fed based on physiological \ngrowths and production cycle. \n5.3. Non-performing breeders are selected for culling\n\n--- PDF PAGE 34 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n33\nbased on industry standards \n5.4. Changes in animal behavior is monitored following \nstandard procedures and GAHP. \n6. Record Data \n6.1 Stock inventory is updated according to established \nfarm recording system \n6.2 Breeding schedule is monitored and recorded \nfollowing work plan. \n6.3 Production performance of breeders are recorded \nand reported according to enterprise protocol.\n\n--- PDF PAGE 35 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n34\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Acclimatization \n1.1 \nIsolation of animals in quarantine pens \n1.2 \nObservance of animals for abnormal behavior \n1.3 \nTesting for possible disease \n1.4 \nVaccination depending on disease outbreak in the areas \n1.5\nBoar semen evaluation\n2. Routine \nmedication \n2.1 \nDeworming \n2.2 \nVaccination \n3. Breeds \n3.1 \nLandrace \n3.2 \nLarge white \n3.3 \nDuroc \n3.4 \nPietrain \n3.5 \nNew Hampshire \n3.6\nHybrids (Hypor, PIC, etc)\n4. Breeder stocks \n4.1 \nFemale breeder \n4.2\nMale breeder or boar\n5. Signs of heat \n5.1 \nGrunting and mounting of other sows \n5.2 \nSwelling and reddening of the vulva \n5.3 \nLoss of appetite \n5.4 \nErect ears \n5.5 \nAppearance of mucous discharge from the vagina \n5.6 \nCan only be moved with great efforts \n5.7\nFrequent attempts to urinate with little or no discharge at all\n6. Heat detection \ntechniques \n6.1 \nHaunch-pressure test \n6.2 \nRiding-the-back test \n6.3 \nSemen-on-the-snout \n6.4\nTeaser Method\n7. Breeding systems \n7.1 \nInbreeding \n7.2 \nPurebreeding \n7.3 \nCrossbreeding \n7.4\nUpgrading\n8. Signs of \npregnancy \n8.1 \nAbsence of heat/estrus \n8.2 \nIncrease in weight \n8.3 \nEnlargement of the abdomen \n8.4\nDevelopment of mammary glands\n9. Pregnancy \ndiagnosis \n9.1 \nPregnancy control \n9.2 \nPhysical signs of pregnancy \n9.3 \nBoar exposure \n9.4 \nDoppler \n9.5\nScanner\n10. Periodic activities \n10.1 Transfer to dry and pregnant unit \n10.2 Regulate in feed intake based on stage of production \n10.3 Vaccination \n10.4 Deworming \n10.5 Mange Treatment (External Parasites) \n10.6 Sow cleaning \n10.7 Transfer to farrowing pens\n\n--- PDF PAGE 36 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n35\n11. Physiological \ngrowth \n11.1 Gilts \n11.2 Junior boars \n11.3 Sows \n11.4 Senior boars\n12. Production cycle \n12.1 Dry period \n12.2 Gestation period \n12.3 Lactation period\n13. Production \nperformance \n13.1 Breeding performance record (computation of breedings \nper month, farrowings per year, recycles per month and \nrebred per month) \n13.2 Reproduction parameters (litter size at birth, at weaning, \npigs per sow per year, birth weight)\n\n--- PDF PAGE 37 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n36\nEVIDENCE GUIDE \n \n1 Critical Aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n \n1.1. Performed preparatory breeding activities \n1.2. Bred sows and gilts \n1.3. Prepared and trained boar for breeding \n1.4. Monitored signs of pregnancy \n1.5. Maintained and monitored animal health condition \n1.6.\nRecorded data\n2 Required \nKnowledge and \nAttitudes \n \n \n \n2.1 Communication \n2.1.1 \nPreparation of stock inventory, performance and \nhealth records, mortality and morbidity rates, \nfinancial transactions and indicators of production \nefficiency \n \n2.2 Safety Practices \n2.2.1 \nImplementation of regulatory controls and policies \nrelative to proper handling, use and disposal of \nbiologics and other veterinary drugs and supplies \n2.2.2 \nProper attire inside the farm premises \n \n2.3 Mathematics and Mensuration \n2.3.1 \nComputation of sow productivity index, feed \nconversion efficiency, parameters of reproductive \nefficiency and financial viability of the swine \nenterprise \n \n2.4 Codes and Regulations \n2.4.1 \nCompliance to animal health program, standards \nand accreditation program of the Bureau of Animal \nIndustry (BAI) and Local Government Units (LGUs) \n2.4.2 \nCompliance with environmental standards set by \nthe DENR and LGUs \n2.4.3 \nCompliance with standards set by the Bureau of \nAgriculture and Fishery Products Standards \n(BAFPS) \n \n2.5 Systems, Processes and Operations \n2.5.1 \nSelection of breeder and replacement stocks, \ngeneral care and herd health \n \n2.6 Tools and Equipment: Uses and Specifications \n2.6.1 \nArtificial Insemination Kit – for successful \ninsemination of gilts and sows \n2.6.2 \nMicroscope for qualitative semen evaluation \n2.6.3 \nAutomatic drinkers and feeders \n2.6.4 \nFeed scoops \n2.6.5 \nPregnancy detector \n2.6.6\nAutomatic syringe and needles\n\n--- PDF PAGE 38 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n37\n2.6.7 \nDriving board and rubber slapper \n \n2.7 Maintenance \n2.7.1 \nRegular check-up and repair of tools and equipment \n \n2.8 Materials: Uses and Specifications \n2.8.1 \nOffice equipment and supplies for regular \nmonitoring of production performance and economic \nviability of the swine operation \n \n2.9 Values \n2.9.1 \nSafety consciousness on vaccine handling and \nother biological \n2.9.2 \nAccuracy in medication and treatment of hog’s \ndiseases \n2.9.3 \nCompetence and self-confidence towards selection \nof breeding stocks \n2.9.4 \nHonesty in marketing and financial transactions \n2.9.5 \nPerseverance and industriousness on care and \nmanagement of the general heard\n3 Required Skills \n3.1 \nWork safety \n3.2 \nSkills in using tools and equipment \n3.3 \nCalculations \n3.4\nCommunicating ideas and info\n5. Resource \nImplications \n4.1. \nFarm \n4.2. \nPens and corrals \n4.3. \nDummy \n4.4. \nTrained boars for artificial insemination \n4.5. \nIn-heat, sows/gilts \n4.6. \nArtificial insemination kit \n4.7. \nTools and equipment appropriate to swine breeding \n4.8.\nMicroscope\n4 Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n5.1. Practical demonstration related to underpinning \nknowledge, skills and attitudes \n5.2. Assessment by immediate superiors with regards to the \nwork accomplishment \n5.3. Interviews with the participants on actual work or training \nsettings\n6. Context of \nAssessment \n \n6.1 Competency maybe assessed individually in the workplace \nor in a simulated workplace individually or as a part of a \nteam under limited supervision\n\n--- PDF PAGE 39 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n38\nUNIT OF COMPETENCY \n: HANDLE FARROWING SOWS AND SUCKLINGS \nUNIT CODE \n \n \n: AFF621217 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \n \n \nrequired to raise swine effectively and efficiently. It \nincludes \npreparing \nanimals \nfor \nfarrowing; \nperformance of farrowing activities; caring of piglets \nto weaning and recording of technical and production \ndata. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Prepare animals for \nfarrowing \n1.1. \nFarrowing stalls or pens are cleaned and \ndisinfected following standard hygienic \nprocedures. \n1.2. \nBathing of sows is conducted following Good \nAnimal Husbandry Practices (GAHP) \n1.3. \nPregnant sows are transferred to farrowing stalls \nor pens according to industry standards. \n1.4. \nFeed intake is determined based on farm \nprotocols \n1.5. \nSigns of approaching farrowing are monitored. \n1.6. \nFarrowing materials and supplies are prepared \nbased on work requirements. \n1.7. \nAppropriate personal protective equipment (PPE) \nare worn following Occupational Safety and Health \nStandard (OSHS). \n2. Perform farrowing-related \nactivities \n2.1. \nFarrowing problems are monitored following \nenterprise protocol. \n2.2. \nFeed intake is adjusted based on nutrient \nrequirements of animals. \n2.3. \nSow or gilt is manually assisted based on animal \nrequirement. \n2.4. \nManagement of newborn piglets are conducted \naccording to GAHP. \n2.5. \nPlacenta and dead piglets are disposed following \nDENR regulations.\n3. Raise piglets to weaning \n \n3.1 Proper temperature/micro-climate is provided based \non the Minimum Requirements for the Welfare of \nPigs and the Code of Good Animal Husbandry \nPractices (GAHP) \n3.2 Colostrum and milk intake are ensured based from \nGAHP. \n3.3 Iron preparations are injected based on industry \nstandards and manufacturer’s specification. \n3.4 Castrate male animals based on the Minimum \nRequirements for the Welfare of Pigs and the Code \nof Good Animal Husbandry Practices (GAHP)\n\n--- PDF PAGE 40 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n39\n3.5 Piglets are fed based on their physiological growth \nrequirements \n3.6 Piglets are weaned based on industry standards.\n4. Maintain Health \n4.1 Changes in piglet behavior is monitored following \nenterprise protocol. \n4.2 Animal condition are monitored thru changes in \nfecal color, odor and consistency of piglets \naccording to industry standard procedures. \n4.3 Uniformity of litter is monitored based on enterprise \nrequirements. \n4.4 Sow discharges is monitored following instructions \nof veterinarian. \n4.5 Vaccination programs are implemented based on \nveterinary recommendation.\n5. Record data \n5.1. Farrowing card is updated following enterprise \nprocedures. \n5.2. Farrowing schedules are monitored with reference \nto work plan. \n5.3. Prodution performance are recorded and \nreported to immediate authority.\n\n--- PDF PAGE 41 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n40\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Bathing sows \n1.1 \nWashing and cleaning of mammary gland \n1.2 \nWashing and cleaning of external genitalia \n1.3\nWashing and cleaning other parts of animal bodies\n2. Signs of farrowing \n2.1 \nBiting of hurdles and guard rails \n2.2 \nSows assume “dog-sitting” position \n2.3 \nProminent distention and enlargement of the udder \n2.4 \nEnlargement and swelling of the vulva \n2.5 \nFrequent urination \n2.6 \nMilk letdown \n2.7\nMucous discharge with meconium\n3. Farrowing materials and \nsupplies \n \n3.1 \nOld newspaper \n3.2 \nBrooders \n3.3 \nThree 50-watt incandescent bulb \n3.4 \nTooth clipper \n3.5 \nMild antiseptic \n3.6\nTattoing materials\n4. Farrowing problems \n4.1 \nSow \n4.2 \nAbnormal vaginal discharge \n4.3 \nMastitis – inflammation of the mammary gland \n4.4 \nAgalactia – absence of milk production \n4.5 \nDystocia – difficult birth or farrowing \n4.6 \nPiglets \n4.7 \nCrushing \n4.8 \nCannibalism \n4.9\nWeak\n5. Management of \nnewborn piglets \n5.1 \nDrying or wiping with powder or cloth \n5.2 \nNavel cord care \n5.3 \nTooth clipping \n5.4 \nTattooing piglet identification (tattooing, earnotch,) \n5.5 \nBrooding \n5.6\nTail docking (as per enterprise requirements)\n6. Changes in piglet \nanimal behavior \n6.1 \nListlessness \n6.2 \nIncrease in body temperature \n6.3 \nLoss of appetite \n6.4 \nSolitary or separation from the group \n6.5 \nHuddling \n6.6 \nThumping \n6.7\nShivering\n7. Animal condition \n7.1 \nConstipation \n7.2\nDiarrhea – liquid, pasty\n8. Changes in fecal color \nand odor \n8.1 \nColor \n• Yellowish \n• Greenish \n• Fatty \n• Orange \n• Whitish\n\n--- PDF PAGE 42 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n41\n8.2 \nOdor \n• Offensive (fishy odor) \n•\nNon-offensive\n9. Production performance 10.1 \nWeaning weights \n10.2\nPercentage runts\n\n--- PDF PAGE 43 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n42\nEVIDENCE GUIDE \n \n1 Critical Aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1. \nPrepared animals for farrowing \n1.2. \nPerformed farrowing-related activities \n1.3. \nRaised piglets to weaning \n1.4. \nMaintained health \n1.5.\nRecorded data\n2 Required \nKnowledge and \nAttitudes \n \n \n \n2.1. \nCommunication \n2.1.1 Preparation of farrowing card, performance and \nhealth records, mortality and morbidity rates, \nfinancial transactions and indicators of production \nefficiency \n2.2. \nSafety Practices \n2.2.1 Implementation of regulatory controls and policies \nrelative to proper handling, use and disposal of \nbiologics and other veterinary drugs and supplies \n2.2.2 Proper disposal of placenta and dead fetuses \n2.2.3 Proper attire inside the farm premises \n2.3. \nMathematics and Mensuration \n2.3.1 Computation of sow productivity index, feed \nconversion efficiency, parameters of reproductive \nefficiency and financial viability of the swine \nenterprise \n2.4. \nCodes and Regulations \n2.4.1 Compliance to animal health program, standards \nand accreditation program of the Bureau of Animal \nIndustry (BAI) and Local Government Units (LGUs) \n2.4.2 Compliance with environmental standards set by \nthe DENR and LGUs \n2.4.3 Compliance with standards set by the Bureau of \nAgriculture and Fishery Products Standards \n(BAFPS) \n \n2.5. \nSystems, Processes and Operations \n2.5.1 General care and herd health management from \npiglet to marketable age and weight \n \n2.6. \nTools and Equipment: Uses and Specifications \n2.6.1 Weighing scale (10 kg cap.) – for monitoring of \npiglets \n2.6.2 Automatic drinkers and feeders \n2.6.3 Feed scoops \n2.6.4 Power sprayer \n2.6.5 Tooth clipper, forceps, scissor and other tools for \nidentification of animals \n2.7. \nMaintenance \n2.7.1 Regular check-up and repair of tools and \nequipment \n2.8.\nMaterials: Uses and Specifications\n\n--- PDF PAGE 44 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n43\n2.8.1 Office equipment and supplies for regular \nmonitoring of production performance and \neconomic viability of the swine operation \n2.9. \nValues \n2.9.1 Safety consciousness on vaccine handling and \nother biological \n2.9.2 Accuracy in medication and treatment of hog’s \ndiseases \n2.9.3 Honesty in marketing and financial transactions \n2.9.4 Perseverance and industriousness on care and \nmanagement of the general heard\n3 Required Skills \n3.1 \nWork safety \n3.2 \nSkills in using tools and equipment \n3.3 \nCalculations \n3.4\nCommunicating ideas and info\n4 Resource \nImplications \n4.1. \nFarm \n4.2. \nPens and cages \n4.3. \nTools and equipment appropriate to forrowing of sow and \nsucklings. \n4.4.\nSows with piglets\n5 Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1. \nPractical demonstration related to underpinning \nknowledge, skills and attitudes \n5.2. \nAssessment by immediate superiors with regards to the \nwork accomplishment \n5.3. \nInterviews with the participants on actual work or training \nsettings\n6 Context of \nAssessment \n \n6.1 \nCompetency maybe assessed individually in the \nworkplace or in a simulated workplace individually or as a \npart of a team under limited supervision\n\n--- PDF PAGE 45 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n44\nUNIT OF COMPETENCY \n: RAISE WEANLINGS \nUNIT CODE \n \n \n: AFF621218 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \n \n \nrequired to strategically prevent post-weaning lag, \n \n \neffectively and efficiently, thus ensuring a healthy \nstarter stocks for finishing. It includes preparation of \npiglets for weaning; handling of newly-weaned \npiglets; maintaining health and record keeping. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Prepare piglets for \nweaning \n1.2 \nPens are cleaned and disinfected based on farm \nspecifications \n1.3 \nMaterials and equipment are adjusted and supplied \n1.4 \nWeaners are grouped based on farm specifications. \n1.5 \nWeaners are transferred in compliance with the \nAnimal Welfare Act \n1.6\nAnimals are fed according to animal requirements.\n2. Maintain conducive \natmosphere and facilities \nfor feeding \n \n2.1 Pen is cleaned regularly following standard hygienic \nprocedures. \n2.2 Proper temperature is provided based on the \nMinimum Standards on the Welfare of Pigs and Code \nof Good Animal Husbandry Practices (GAHP) \n2.3 Feeders are checked and adjusted to ensure proper \nfunctioning \n2.4 Feed ration is gradually shifted and increased based \non animal requirements \n2.5 Fresh and clean water is provided at all times (adli \nbitum )\n3. Maintain health of newly-\nweaned piglets \n3.2 Animal condition is monitored following enterprise \nprocedures. \n3.3 Uniformity of litter is monitored following farm \nprocedures. \n3.4 Weaners are dewormed based on farm protocols \n3.5 Vaccination programs are implemented based on \nveterinary recommendations.\n4. Record data \n4.1 Weanling records are updated using standard \nenterprise \n4.2 Weaning schedules are monitored \n4.3 Production performance of weanlings are monitored \nand reported according to enterprise procedures.\n\n--- PDF PAGE 46 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n45\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Materials and \nequipment \n1.1 \nAutomatic drinkers \n1.2 \nFeeders \n1.3 \nHeat lamps/bulbs \n1.4 \nBrooders \n1.5 \nIdentification markers \n1.6\nDisinfectants\n2. Adjusted \n2.1. \nIncrease quantity of feeds \n2.2.\nDecrease quantity of feeds\n3. Feed ration shifted \n3.1. \nBooster to pre-starter \n3.2. \nStarter-grower \n3.3.\nGrower-Finisher\n4. Animal condition \n4.1. \nChanges in animal behavior \n• Listlessness \n• Increase in body temperature \n• Loss appetite \n• Solitary separation from the group \n• Huddling \n• Thumping \n4.2. \nChanges fecal consistency \n• Constipation \n• Diarrhea – liquid, pasty \n4.3. \nChanges in fecal color \n• Yellowish \n• Greenish \n• Fatty \n• Orange \n• Whitish \n5. Production \nperformance \n7.1 \nAverage daily gain \n7.2 \nFeed conversion ratio\n\n--- PDF PAGE 47 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n46\nEVIDENCE GUIDE \n \n1 Critical Aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1. \nPrepared piglets for weaning \n1.2. \nManaged newly-weaned piglets \n1.3. \nMaintained health of newly-weaned piglets \n1.4.\nRecorded data\n2 2. Required \nKnowledge and \nAttitudes \n \n \n \n2.1 Communication \n2.1.1 \nPreparation of weaners’card, performance and \nhealth records, mortality and morbidity rates, \nfinancial transactions and indicators of production \nefficiency \n \n2.2 Safety Practices \n2.2.1 \nImplementation of regulatory controls and policies \nrelative to proper handling, use and disposal of \nbiologics and other veterinary drugs and supplies \n2.2.2 \nProper attire inside the farm premises \n \n2.3 Mathematics and Mensuration \n2.3.1 \nComputation of mortality rates, piglets weaned per \nsow per year, feed conversion efficiency, and \nfinancial viability of the swine enterprise \n \n2.4 Codes and Regulations \n2.4.1 \nCompliance to animal health program, standards \nand accreditation program of the Bureau of Animal \nIndustry (BAI) and Local Government Units (LGUs) \n2.4.2 \nCompliance with environmental standards set by \nthe DENR and LGUs \n2.4.3 \nCompliance with standards set by the Bureau of \nAgriculture and Fishery Products Standards \n(BAFPS) \n \n2.5 Systems, Processes and Operations \n2.5.1 \nGeneral care and herd health management from \npiglet to weaning age and weight \n \n2.6 Tools and Equipment: Uses and Specifications \n2.6.1 \nAutomatic drinkers and feeders \n2.6.2 \nPower sprayer \n2.6.3 \nFeeding scoops \n2.6.4 \nWeighing scale (500 kg cap.) – \n2.6.5 \nTooth clipper, forceps, scissor and other tools for \nidentification of animals \n2.6.6 \nAutomatic syringe and needles \n \n2.7 Maintenance \n2.7.1 \nRegular check-up and repair of tools and \nequipment\n\n--- PDF PAGE 48 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n47\n \n2.8 Materials: Uses and Specifications \n2.8.1 \nOffice equipment and supplies for regular \nmonitoring of production performance and \neconomic viability of the swine operation \n2.9 Values \n2.9.1 \nSafety consciousness on vaccine handling and \nother biological \n2.9.2 \nAccuracy in medication and treatment of hog’s \ndiseases \n2.9.3 \nCompetence and self-confidence towards selection \nof good weaners \n2.9.4 \nHonesty in marketing and financial transactions \n2.9.5 \nPerseverance and industriousness on care and \nmanagement of the general heard\n3 Required Skills \n3.1 Work safety \n3.2 Skills in using tools and equipment \n3.3 Calculations \n3.4 Communicating ideas and info\n4 Resource \nImplications \n4.1 Farm \n4.2 Pens \n4.3 Tools and equipment appropriate in raising weanlings \n4.4 Piglets (weanlings)\n5 Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 Practical demonstration related to underpinning knowledge, \nskills and attitudes \n5.2 Assessment by immediate superiors with regards to the \nwork accomplishment \n5.3 Interviews with the participants on actual work or training \nsettings\n6 Context of \nAssessment \n \n6.1 Competency maybe assessed individually in the workplace \nor in a simulated workplace individually or as a part of a \nteam under limited supervision\n\n--- PDF PAGE 49 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n48\nUNIT OF COMPETENCY \n: PRODUCE FINISHERS \n \nUNIT CODE \n \n \n: AFF621219 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \nrequired to care for finishers effectively and \nefficiently. It includes preparing animals for finishing; \nproper management and feeding finishers, providing \ncare and monitoring the health \nof the animals and profitable marketing of hogs either \nas replacements stocks/breeders or market \n \n \nhogs. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Prepare animals for \nfinishing \n \n1.1. Suitable growers are selected for finishing based \non weight and age. \n1.2. Finishers building are cleaned and disinfected \nfollowing enterprise procedures. \n1.3. Materials and equipment are adjusted and \nsupplied according to work requirements. \n1.4. Growers are grouped based on industry standards \nand enterprise specifications. \n1.5. Growers are transferred based on the Minimum \nStandards on the Welfare of Pigs and Code of \nGood Animal Husbandry Practices (GAHP)\n2. Maintain conducive \natmosphere and facilities \n \n \n \n \n \n \n2.1. Pen is cleaned regularly following hygienic \nprocedures. \n2.2. Proper temperature is monitored and provided \nbased on the Minimum Standards on the Welfare \nof Pigs and Code of Good Animal Husbandry \nPractices (GAHP) \n2.3. Height of drinkers are checked and adjusted to \nensure proper functioning based on the Minimum \nStandards on the Welfare of Pigs and Code of \nGood Animal Husbandry Practices (GAHP) \n2.4. Enough floor space is provided based on the \nMinimum Standards on the Welfare of Pigs and \nCode of Good Animal Husbandry Practices \n(GAHP) \n2.5. Weak animals are isolated based on industry \nstandards.\n3. Feed finishers \n3.1 \nFeeders are checked and adjusted to ensure \nproper functioning \n3.2 \nAnimals are fed according to a standard feeding \nsystem. \n3.3 \nFeed ration is adjusted and shifted based on farm \nprotocols and physiological growth.\n\n--- PDF PAGE 50 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n49\n3.4 \nMedicated feeds are withdrawn according to \nveterinarian instructions.\n4. Maintain herd health care \nand medication program \n4.1 \nChanges in animal behavior are monitored \nfollowing Animal Welfare Act and GAHP. \n4.2 \nChanges in posture of animal is monitored \nAnimal Welfare Act and GAHP. \n4.3 \nChanges in respiration of animal is monitored \nAnimal Welfare Act and GAHP. \n4.4 \nChanges in skin color is monitored Animal \nWelfare Act and GAHP. \n4.5 \nUniformity of stocks is monitored following \nenterprise protocol. \n4.6 \nVaccination and medication programs are \nimplemented based on veterinarian instructions \n5. Prepare animals for \nmarketing \n5.2 \nAnimal weight is determined using weighing scales.\n5.3 \nMarketable animals are prepared and reserved \nfollowing marketing requirements and procedures. \n5.4 \nLoading facility and ramp are prepared with \nreference to Animal Welfare Act. \n5.5 \nAnimals are moved to loading facility following \nAnimal Welfare Act. \n5.6 \nEnsure the transportation vehicle is cleaned and \ndisinfected prior to entering farm premises in line \nwith GAHP.\n6. Record Data \n6.1 \nFinishing records are is updated following \nenterprise protocol. \n6.2 \nProduction parameters for finishers are \nmonitored with reference to production \nrequirements.\n\n--- PDF PAGE 51 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n50\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Materials and \nEquipment \n1.1 \ndriving board \n1.2 \nrubber slappers \n1.3 \nfeeders \n1.4 \ndrinkers \n1.5 \ndisinfectants \n1.6\nidentification markers\n2. Feeding systems \n2.1 \nAd libitum feeding \n2.2 \nRestricted feeding \n2.3 \nCombined \n2.4 \nWet feeding \n2.5\nDry feeding\n3. Changes in animal \nbehavior \n3.1 \nListlessness \n3.2 \nIncrease in body temperature \n3.3 \nLoss appetite \n3.4 \nSolitary separation from the group \n3.5 \nMucosal discharge on the eyes and snout \n3.6 \nDiarrhea \n3.7\nConstipation\n4. Changes in posture \n4.1 \nLateral recumbency \n4.2 \nSternal recumbency \n4.3 \nDog – sitting \n4.4 \nExtended head \n4.5\nCircling movements\n5. Changes in \nrespiration \n5.1 \nRapid breathing \n5.2 \nAbdominal breathing \n5.3 \nOther upper respiratory sounds \n5.4\nAbnormal respiratory excretions\n6. Changes in skin \ncolor \n6.1 \nPale \n6.2 \nBluish \n6.3 \nYellowish \n6.4 \nReddish \n6.5\nGrayish/Crusted\n7. Production \nparameters \n7.1 \nFeed Conversion Ration(FCR) \n7.2 \nAverage Daily Gain (ADG) \n7.3\nPercentage mortalities\n\n--- PDF PAGE 52 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n51\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1. Prepared animals for finishing \n1.2. Managed finishers \n1.3. Fed finishers \n1.4. Maintained herd health management and medication \nprogram \n1.5. Sold animals \n1.6. Recorded Data \n2. Required \nKnowledge and \nAttitudes \n \n \n \n2.1 Communication \n2.1.1 Preparation of stock inventory, performance and \nhealth records, mortality and morbidity rates, \nfinancial transactions and indicators of production \nefficiency \n2.2 Safety Practices \n2.2.1 Implementation of regulatory controls and policies \nrelative to proper handling, use and disposal of \nbiologics and other veterinary drugs and supplies \n2.2.2 Proper attire inside the farm premises \n2.3 Mathematics and Mensuration \n2.3.1 Computation feed conversion efficiency, average \ndaily gain, feed profit and financial viability of the \nswine enterprise \n2.4 Codes and Regulations \n2.4.1 Compliance to animal health program, standards \nand accreditation program of the Bureau of Animal \nIndustry (BAI) and Local Government Units (LGUs) \n2.4.2 Compliance with environmental standards set by \nthe DENR and LGUs \n2.4.3 Compliance with standards set by the Bureau of \nAgriculture and Fishery Standards \n \n2.5 Systems, Processes and Operations \n2.5.1 Selection of good starters, general care and herd \nhealth management from to marketable age and \nweight \n2.6 Tools and Equipment: Uses and Specifications \n2.6.1 Automatic drinkers and feeders \n2.6.2 Feed scoops \n2.6.3 Power sprayer \n2.6.4 Driving board \n2.6.5 Automatic and disposable syringes \n2.6.6 Weighing balance(500 kg cap.) – for monitoring and \nmarketing of hogs\n\n--- PDF PAGE 53 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n52\n \n2.7 Maintenance \n2.7.1 Regular check-up and repair of tools and equipment \n \n2.8 Materials: Uses and Specifications \n2.8.1 Office equipment and supplies for regular monitoring \nof production performance and economic viability of \nthe swine operation \n \n2.9 Values \n2.9.1 Safety consciousness on vaccine handling and other \nbiological \n2.9.2 Accuracy in medication and treatment of hog’s \ndiseases \n2.9.3 Competence and self-confidence towards selection \nof breeding stocks \n2.9.4 Honesty in marketing and financial transactions \n2.9.5 Perseverance and industriousness on care and \nmanagement of the general heard\n3. Required Skills \n3.1 Work safety \n3.2 Skills in using tools and equipment \n3.3 Calculations \n3.4 Communicating ideas and info\n4. Resource \nImplications \n4.1. \nFarm facility \n4.2. \nTools and equipment appropriate to finisher production \n4.3.\nStarters – finishers\n5. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n5.1. \nPractical demonstration related to underpinning \nknowledge, skills and attitudes \n5.2. \nAssessment by immediate superiors with regards to the \nwork accomplishment \n5.3. \nInterviews with the participants on actual work or training \nsettings\n6. Context of \nAssessment \n \n6.1 Competency maybe assessed individually in the workplace \nor in a simulated workplace individually or as a part of a \nteam under limited supervision.\n\n--- PDF PAGE 54 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n53\n \nUNIT OF COMPETENCY \n:\nMAINTAIN HEALTHY ANIMAL ENVIRONMENT \nUNIT CODE \n:\nAFF621220 \nUNIT DESCRIPTOR \n:\nThis unit covers the knowledge, skills and attitudes \nrequired to maintain healthy environment effectively and \nefficiently. It includes proper attainment of relative \nhumidity, controlling the required temperature and \nventilation, sustaining quality air and water supplies, \napplication of chemicals to eliminate vermin and proper \ndisposal of the hazardous wastes. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Maintain relative humidity \n1.1 \nRelative humidity is measured using hygrometer for \ncalibration \n1.2 \nCurtains and blowers are adjusted following \nproduction requirements. \n1.3 \nMonitoring schedules for RH readings is followed \naccording to work plan.\n2. Control temperature \n2.1 \nTemperature is measured is using thermometer. \n2.2 \nCurtains, blowers and window shutter are adjusted \nfollowing production requirements. \n2.3 \nMonitoring schedules for temperature readings is \nfollowed according to work plan. \n2.4 \nIn extreme conditions, contingency procedures \nare implemented\n3. Sustain air quality \n3.1 \nApproximate air quality is evaluated using sensory \nmeans. \n3.2 \nCommon air pollutants are recognized following \nstandards procedures. \n3.3 \nSources of air pollutants are identified, neutralized \nand removed according to DENR standards. \n3.4\nAffected animals are referred to veterinarian.\n4. Sustain water quality \n4.1. Schedule for routine testing of water is observed \naccording to work plan. \n4.2. Water samples are properly collected according to \nestablished protocols. \n4.3. Water samples are submitted for testing to \nauthority. \n4.4. Regular cleaning and disinfection of pipes and \ntanks are done according to established protocols.\n5. Maintain ventilation \n5.1 \nCurtain management is performed according to the \nanimal requirements. \n5.2\nMaintenance of blowers is done regularly.\n6. Control vermin \n6.1 \nBreeding places of vermin are eliminated following\n\n--- PDF PAGE 55 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n54\nenterprise procedures. \n6.2 \nFarm wastes that attract vermins are disposed \nproperly \n6.3 \nPerimeter fences are routinely checked and \nrepaired to prevent entry of stray animals \n6.4 \nApplications of appropriate chemicals are used \naccording to FPA guidelines. \n6.5 \nBreeding grounds of mosquitoes are eliminated \nfollowing standard procedures.\n\n--- PDF PAGE 56 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n55\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Contingency \nprocedures \n1.1 \nShowering of all animals \n1.2 \nCooling of roof \n1.3 \nCooling of water source \n1.4 \nInstallation of additional blower fans \n1.5\nProvision of wallowing pools\n2. Sensory means \n2.1. \nChest tightness \n2.2. \nLachrymation, \n2.3.\nOffensive odor\n3. Common air \npollutants \n3.1. \nDust, \n3.2. \nAmmonia, \n3.3. \nHydrogen sulfide, \n3.4.\nAirborne pathogen\n4. Disinfection \n4.1 \nChlorination \n4.2 \nLiming \n4.3 \nDisinfectants \no QUAT \no ammonium compounds, \no\nperoxygen\n5. Vermins \n5.1. \nRats \n5.2. \nStray animals \n5.3. \nFlies \n5.4.\nMosquitoes\n6. Breeding grounds \nof mosquitoes \n6.1. \nStagnant bodies of water \n6.2. \nDamp areas \n6.3.\nClogged drainage\n\n--- PDF PAGE 57 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n56\nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nMaintained relative humidity \n1.2 \nControlled temperature \n1.3 \nSustained air quality \n1.4 \nSustained water quality \n1.5 \nMaintained ventilation \n1.6\nControlled vermin\n2. Required \nKnowledge and \nAttitudes \n \n \n \n2.1 \nCommunication \n2.1.1 \nPreparation of stock inventory, performance and \nhealth records, mortality and morbidity rates, \nfinancial transactions and indicators of production \nefficiency \n \n2.2 \nSafety Practices \n2.2.1 \nImplementation of regulatory controls and policies \nrelative to proper handling, use and disposal of \nbiologics and other veterinary drugs and supplies \n2.2.2 \nProper disposal of placenta and dead fetuses \n2.3 \nMathematics and Mensuration \n2.3.1 \nComputation of sow productivity index, feed \nconversion efficiency, parameters of reproductive \nefficiency and financial viability of the swine \nenterprise \n2.3.2 \nCodes and Regulations Compliance to animal \nhealth program, standards and accreditation \nprogram of the Bureau of Animal Industry (BAI) and \nLocal Government Units (LGUs) \n \n2.4 \nSystems, Processes and Operations \n2.4.1 \nBreeding procedures (AI, Natural and Combination)\n2.4.2 \nTransferring of animals in compliance of Animal \nWelfare \n2.4.3 \nSelection of breeder and replacement stocks, \ngeneral care and herd health management from \npiglet to marketable age and weight \n2.5 \nTools and Equipment: Uses and Specifications \n2.5.1 \nCarpentry tools \n \n2.6 \nMaintenance \n2.6.1 \nRegular check-up and repair of tools and \nequipment \n \n2.7 \nMaterials: Uses and Specifications \n2.7.1 \nOffice equipment and supplies for regular \nmonitoring of production performance and \neconomic viability of the swine operation\n\n--- PDF PAGE 58 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n57\n \n2.8 \nBlue Printing \n2.8.1 \nInfrastructure plans and lay-out approved based on \nexisting regulatory policies and proper zoning \nscheme of the government and local ordinances \n2.9 \nValues \n2.9.1 \nHonesty in marketing and financial transactions \n2.9.2 \nPerseverance and industriousness on care and \nmanagement of the general herd\n3. Required Skills \n3.1 \nWork safety \n3.2 \nSkills in using tools and equipment \n3.3 \nCalculations \n3.4\nCommunicating ideas and information\n4. Resource \nImplications \n4.1. \nFarm \n4.2. \nCarpentry tools \n5. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1. Practical demonstration related to underpinning \nknowledge, skills and attitudes \n5.2. Assessment by immediate superiors with regards to the \nwork accomplishment \n5.3. Interviews with the participants on actual work or training \nsettings\n6. Context of \nAssessment \n \n6.1 \nCompetency maybe assessed individually in the \nworkplace or in a simulated workplace individually or as a \npart of a team under limited supervision.\n\n--- PDF PAGE 59 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n58\nUNIT OF COMPETENCY \n: \nAPPLY BIO-SECURITY MEASURES \n \nUNIT CODE \n \n: \nAFF321302 \nUNIT DESCRIPTOR \n : \nThis unit covers the knowledge, skills and \nattitudes \nrequired \nto \napply \nbio-security \nmeasures in livestock farm operations. It \nincludes identifying bio-security threats and \nhazards, \napplying \ndisease \nprevention \npractices, applying prevention practices in \ndisease transmission and maintaining records. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Identify bio-security \nthreats and hazards \n1.1 \nImmediate threats to the health of the animal are \nidentified and reported to immediate authority. \n1.2 \nBio-security threats are identified based on \nestablished organizational policy. \n2. Apply disease \nprevention practices \n2.1 \nPreparation of supplies and materials and \napplication of disinfectants are done according to \nstandard operating procedures \n2.2 \nVehicle and foot vats disinfections are prepared and \nmonitored regularly according to standard operating \npractice \n2.3 \nHygiene and sanitation of farm, farm personnel and \nvisitors are followed based on standard operating \npractice \n2.4 \nAll types of vehicles and equipment entering the \nfarm are disinfected according to standard operating \nprocedures \n2.5 \nNew stocks to be introduced into the herd are \nquarantined and vaccinated according to standard \noperating procedures \n2.6 \nVaccination programs and health programs are \nimplemented as instructed by veterinarian. \n3. Apply preventive \ndisease transmission \npractices \n3.1 \nSamples are collected and prepared for serological \nmonitoring of notifiable diseases. \n3.2 \nPreventive measures on notifiable diseases as \ndeclared by BAI are followed based on industry and \nBAI standard \n3.3 \nMedication and vaccination programs are followed \nstrictly as recommended by manufacturers and \nveterinarian \n3.4 \nHygiene and sanitation of farm, farm personnel and \nvisitors are followed based on standard operating\n\n--- PDF PAGE 60 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n59\npractice \n3.5 \nSick and unfit stocks are culled and isolated in \naccordance to Animal Welfare Act and standard \noperating procedure \n3.6 \nDead stocks and by-products are disposed using \nproper disposal method \n3.7 \nTools and equipment used in sick and dead animals \nare properly clean and disinfected. \n3.8 \nCommunication with supervising veterinarian are \ndone regularly following enterprise requirements. \n4. Maintain records \n4.1 \nAppropriate records in checklist format are kept, \ncollated and updated regularly in accordance with \norganizational policy \n4.2 \nReporting to veterinarian or supervisor are carried \nout based on industry standards.\n\n--- PDF PAGE 61 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n60\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Immediate threats \n1.1 Natural calamities \n1.2 Physical threat \n1.3 Unforeseen events (prevailing diseases, outbreaks) \n2. Bio-security threats \n2.1 Animals other than stocks being taken cared of \n2.2 Diseases \n2.2.1 Bacterial \n2.2.2 Viral diseases \n2.2.3 Parasitic diseases \n2.2.4 Parasitism \n2.3 Finished products/By-products of animal production \n2.4 Traffic flow of potential carriers \n2.4.1 People \n2.4.2 Stocks \n2.4.3 Equipment \n2.4.4 Vehicles \n2.5 Birds, pests and rodents \n3. Supplies and \nmaterials \n3.1 Syringes \n3.2 Needles \n3.3 Drugs and other medical supplies \n4. Tools and \nequipment \n4.1 Boots \n4.2 Rust remover \n4.3 Power sprayer \n4.4 Portable sprayer \n4.5 Torch \n5. Disinfectants \n5.1 Chemical disinfectants \n5.1.1 Phenols \n5.1.2 Iodophore \n5.1.3 Aldehydes \n5.1.4 Organic salts \n5.1.5 Quarternary products \n5.1.6 Combined disinfectants \n5.2 Physical disinfectants \n5.2.1 Torch \n5.2.2 Disposable suits \n5.2.3 Boots \n5.2.4 Paints \n5.2.5 Rust remover \n5.3 Lime for animal disposal \n6. Stocks \n6.1 Replacement breeder \n6.2 Outsourced piglets/ \n6.3 Outsourced fatteners\n\n--- PDF PAGE 62 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n61\n7. Vaccination \nprogram \n7.1 Market pig program \n7.2 Breeder stocks program \n8. Health program \n8.1 Medication program \n8.2 Deworming program \n9. Standard operating \nprocedures \n9.1 Annual health certificate \n9.2 At least 3 days downtime \n9.3 Change of clothes before entering farm \n9.4 Hand washing before and after each activities \n9.5 Shower –in and shower-out \n9.6 Wearing of appropriate footwear \n9.7 Foot baths in all entry points \n9.8 Self-isolation when sick \n9.9 Not allowed to raise pigs in their house \n9.10 Not allowed to bring in fresh or cooked meat \n9.11 Not allowed to entertain personal visitors inside the \nfarm \n10. Sick and unfit \nstocks \n10.1 Listlessness \n10.2 Increase body temperature \n10.3 Loss appetite \n10.4 Solitary separation from the group \n10.5 Mucosal discharge on the eyes and snout \n10.6 Swollen body parts \n10.7 Appearance of vesicles \n11. Disposal method \n11.1 Bury animals \n11.2 Use mortality pit \n12. Appropriate records \n12.1 Swine population \n12.2 Vaccination \n12.3 Medication \n12.4 Standard routine procedure\n\n--- PDF PAGE 63 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n62\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nIdentified bio-security threats and hazards \n1.2 \n Applied disease prevention practices \n1.3 \nApplied preventive disease transmission practices \n1.4\nMaitained records\n2. Required \nKnowledge and \nAttitudes \n \n \n2.1 Communication \n2.1.1 Accomplishing the check list \n2.2 Safety Practices \n2.2.1 Knowledge in handling disinfectants and other \nveterinary supplies \n2.2.2 Knowledge of proper waste handling and \nmanagement \n2.3 Mathematics and Mensuration \n2.3.1 Proper calculation of inclusion rates of \ndisinfectants and chemicals \n2.4 Codes and Regulations \n2.4.1 Appropriate legal and supervising regulatory \nbody pertinent to bio-security program such as \nBAI, PAHC, and DENR \n2.5 Systems, Processes and Operations \n2.5.1 Selection of replacement or new stocks \n2.5.2 Implementation of appropriate animal health \nprogram \n2.6 Materials: Uses and Specifications \n2.6.1 Drugs and medical supplies \n2.6.2 Office supplies and materials – for regular \ninventory and monitoring of animal health \nprogram \n2.7 Tools and Equipment: Uses and Specifications \n2.7.1 Rust remover \n2.7.2 Power sprayer \n2.7.3 Torch \n2.8 Values \n \n2.8.1 Honesty in reporting \n2.8.2 Confidence in selecting healthy replacement or \nnew stocks \n2.8.3 Personal integrity and perseverance in \nperforming routine bio-security measures \n2.8.4 Ability to work well with others harmoniously\n3. Required Skills \n3.1 Work safety \n3.2 Calculations \n3.3 Communicate effectively \n4. Resource \nImplication \nThe following resources MUST be provided: \n5.1. \nFarm location with required facilities \n5.2.\nSupplies and materials applied for bio-security\n\n--- PDF PAGE 64 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n63\nmeasures \n5. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1. Observation/Demonstration \n5.2. Third party report \n5.3. Portfolio \n6. Context of \nAssessment \n6.1 Competency may be assessed individually in the actual \nworkplace or through accredited farms/institution\n\n--- PDF PAGE 65 