        "source_text": "AFF321205 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \nrequired to process farm wastes. It comprises functions \nsuch as collecting farm wastes, conducting waste \nidentification and segregation, treating and processing \nfarm wastes and performing housekeeping duties. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Collect farm wastes \n1.1. Tools and materials are prepared for collection of \nfarm wastes. \n1.2. Wastes are collected following OSHS and waste \ncollection requirements and plan. \n1.3. Dangerous and hazardous wastes are collected \nfollowing the HAZMAT(hazardous material) protocol. \n1.4. Appropriate personal protective equipment (PPE) are \nworn as prescribed by Occupational Safety and \nHealth Standards (OSHS). \n2. Identify and segregate \nwastes \n \n2.1. Wastes are identified by categories according to \nindustry standards and environmental legislation. \n2.2. Wastes are segregated according to organizational \nrequirements and relevant legislation. \n2.3. Sorted waste is placed into labelled container to avoid \nlittering and prevent cross-contamination. \n2.4. Information on waste is obtained by asking authority \nto ensure correct identification.\n3. Treat and process \nfarm wastes \n3.1. Dangerous and hazardous wastes are handled \naccording to organizational requirements and \nrelevant legislation following OSHS procedures. \n3.2. Processing of farm wastes is done following \nenvironmental legislation and codes. \n3.3. Principles of 3Rs (reduce, reuse and recycle) are \napplied accordingly. \n3.4. Farm wastes are disposed of according to \nenvironmental legislation and codes.\n4. Perform \nhousekeeping \n4.1. Appropriate warning signs and labels are displayed \nin conspicuous places around the workplace. \n4.2. Work area is cleaned according to 5S principles. \n4.3. Tools are checked, cleaned and stowed according to \nestablished industry procedures and following user’s \nmanual. \n4.4. Materials are stored following industry standard\n\n--- PDF PAGE 28 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n27\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \nprocedures and manufacturer’s specifications. \n4.5. PPE is checked for damage prior to ensuring that \nclean and undamaged equipment is stored. \n4.6. Storage facility is checked to ensure no \ncontamination in the area according to organizational \nrequirements and legislation and codes. \n4.7. Record keeping is done according to industry \nrequirements.\n\n--- PDF PAGE 29 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n28\nRANGE OF VARIABLES \n \nVARIABLE \nSCOPE \n1. Tools and materials \nTools and materials include: \n1.1. Tools \n• Spade \n• Wheel borrow \n• Broomstick \n• Sprayer or pressurized pump \n1.2. Materials \n• Sacks \n• Containers \n• Disinfectants \n• Detergents \n• First-aid kit \n• Chemical spill kit \n• Personal Protective Equipment \no Goggles \no Disposal gloves \no Face mask \no Rubber boots \no\nOverall\n2. Agricultural wastes \nMay include: \n2.1. \nPlant materials \n2.2. \nHay \n2.3. \nWeeds \n2.4. \nTwigs \n2.5. \nTwines \n2.6. \nEmpty wooden crates \n2.7. \nAnimal manure \n2.8. \nFeed refuse \n2.9. \nSpoiled feeds (Forage and feed supplements) \n2.10. Spent bedding materials \n2.11. Empty sacks \n2.12. Trash fish \n2.13. Fish meal \n2.14. Effluent\n3. Dangerous and \nhazardous wastes \n5.1. Pesticides \n5.2. Syringes \n5.3. Expired biologics \n5.4. Expired veterinary drugs \n5.5. Spoiled milk \n5.6. Diseased plant and plant parts \n5.7.\nEmpty veterinary bottles/syringes\n4. Categories \n3.1. Re-usable \n3.2. Recyclable \n3.3. Solid \n3.4.\nLiquid\n\n--- PDF PAGE 30 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n29\nVARIABLE \nSCOPE \n5. Processing of wastes \n4.1. Composting \n4.2. Compacting \n4.3. Liquefying \n4.4. Shredding \n4.5. Carbonizing \n4.6.\nCharcoaling\n6. Record \n6.1. Record of farm wastes generated and \ndisposed \n6.2. Record of incidence of infection and accidents \n6.3. Record of chemical spillage \n6.4. Record of destroyed carcasses \n6.5.\nInventory of tools, materials and equipment\n\n--- PDF PAGE 31 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n30\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Collected farm waste \n1.2. Identified and segregated farm waste \n1.3. Processed farm waste \n1.4. Performed housekeeping\n2. Required \nKnowledge and \nAttitudes \n \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. Tools and materials use in wastes management \n2.1.2. Categories of farm wastes \n2.1.3. Wastes collection and segregation procedures \n2.1.4. Farm-waste handling, storage and disposal \nprocedures \n2.1.5. Dangerous and hazardous wastes, hazardous \nmaterials (hazmat) protocols \n2.1.6. Principles of 5S and 3R \n2.2. Communications \n2.4.1 Preparation of inventory reports and production \nrecords \n2.4.2 Report on untoward incidence in the area \n2.3. Mathematics and Mensuration \n2.3.1. Profitability of the operation \n2.3.2. Volume of farm wastes \n2.4. Safety Practices \n2.4.1. Personal Protective Equipment (PPE) \n2.4.2. Material Safety Data Sheets(MSDS) \n2.5. Codes and Regulations \n2.5.1. Appropriate legal regulatory body such as BAI, EMB \nand DOH,BFAD \n2.5.2. Occupational Safety and Health Standards \n2.5.3. RA 9003 \n2.5.4. RA 6969 \n2.6. Materials, Tools & Equipment: Uses, Specifications and \nMaintenance \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional manuals \n2.6.1.2. Safe keeping of equipment every after use \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies, materials \nand equipment needed in the maintenance of \nthe poultry house and farm \n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills for farm area \n2.7. Values \n2.7.1. Safety and health consciousness \n2.7.2. Resourcefulness \n2.7.3. Diligence \n2.7.4. Time consciousness \n2.7.5.Cost-consciousness\n\n--- PDF PAGE 32 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n31\n2.7.6. Personal integrity in doing routine management \npractices \n2.7.7. Perseverance in executing routine works \n2.7.8.Ability to work with others harmoniously\n3. Required Skills \n3.1 \nOccupational health and safety \n3.2 \nSkills in using tools and equipment \n3.3 \nCalculations \n3.4\nCommunicate effectively\n4. Resource \nImplications \nThe following resources should be provided: \n4.1 Farm area \n4.2 Different farm wastes \n4.3 Farm-waste processing area \n4.4 Tools, supplies and materials use in farm wastes \ncollection, segregation and processing \n4.5 Housekeeping tools and supplies \n4.6\nPPE\n5. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 \nObservation and questioning \n5.2 \nThird-Party Report \n5.3\nDemonstration and oral questioning\n6. Context of \nAssessment \n6.1 \nCompetency maybe assessed individually in the \nactual workplace or in accredited farms or institution\n\n--- PDF PAGE 33 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n32\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n: HANDLE BREEDERS \nUNIT CODE \n \n \n:"
