        "source_text": "AFF621220 \nUNIT DESCRIPTOR \n:\nThis unit covers the knowledge, skills and attitudes \nrequired to maintain healthy environment effectively and \nefficiently. It includes proper attainment of relative \nhumidity, controlling the required temperature and \nventilation, sustaining quality air and water supplies, \napplication of chemicals to eliminate vermin and proper \ndisposal of the hazardous wastes. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Maintain relative humidity \n1.1 \nRelative humidity is measured using hygrometer for \ncalibration \n1.2 \nCurtains and blowers are adjusted following \nproduction requirements. \n1.3 \nMonitoring schedules for RH readings is followed \naccording to work plan.\n2. Control temperature \n2.1 \nTemperature is measured is using thermometer. \n2.2 \nCurtains, blowers and window shutter are adjusted \nfollowing production requirements. \n2.3 \nMonitoring schedules for temperature readings is \nfollowed according to work plan. \n2.4 \nIn extreme conditions, contingency procedures \nare implemented\n3. Sustain air quality \n3.1 \nApproximate air quality is evaluated using sensory \nmeans. \n3.2 \nCommon air pollutants are recognized following \nstandards procedures. \n3.3 \nSources of air pollutants are identified, neutralized \nand removed according to DENR standards. \n3.4\nAffected animals are referred to veterinarian.\n4. Sustain water quality \n4.1. Schedule for routine testing of water is observed \naccording to work plan. \n4.2. Water samples are properly collected according to \nestablished protocols. \n4.3. Water samples are submitted for testing to \nauthority. \n4.4. Regular cleaning and disinfection of pipes and \ntanks are done according to established protocols.\n5. Maintain ventilation \n5.1 \nCurtain management is performed according to the \nanimal requirements. \n5.2\nMaintenance of blowers is done regularly.\n6. Control vermin \n6.1 \nBreeding places of vermin are eliminated following\n\n--- PDF PAGE 55 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n54\nenterprise procedures. \n6.2 \nFarm wastes that attract vermins are disposed \nproperly \n6.3 \nPerimeter fences are routinely checked and \nrepaired to prevent entry of stray animals \n6.4 \nApplications of appropriate chemicals are used \naccording to FPA guidelines. \n6.5 \nBreeding grounds of mosquitoes are eliminated \nfollowing standard procedures.\n\n--- PDF PAGE 56 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n55\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Contingency \nprocedures \n1.1 \nShowering of all animals \n1.2 \nCooling of roof \n1.3 \nCooling of water source \n1.4 \nInstallation of additional blower fans \n1.5\nProvision of wallowing pools\n2. Sensory means \n2.1. \nChest tightness \n2.2. \nLachrymation, \n2.3.\nOffensive odor\n3. Common air \npollutants \n3.1. \nDust, \n3.2. \nAmmonia, \n3.3. \nHydrogen sulfide, \n3.4.\nAirborne pathogen\n4. Disinfection \n4.1 \nChlorination \n4.2 \nLiming \n4.3 \nDisinfectants \no QUAT \no ammonium compounds, \no\nperoxygen\n5. Vermins \n5.1. \nRats \n5.2. \nStray animals \n5.3. \nFlies \n5.4.\nMosquitoes\n6. Breeding grounds \nof mosquitoes \n6.1. \nStagnant bodies of water \n6.2. \nDamp areas \n6.3.\nClogged drainage\n\n--- PDF PAGE 57 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n56\nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1 \nMaintained relative humidity \n1.2 \nControlled temperature \n1.3 \nSustained air quality \n1.4 \nSustained water quality \n1.5 \nMaintained ventilation \n1.6\nControlled vermin\n2. Required \nKnowledge and \nAttitudes \n \n \n \n2.1 \nCommunication \n2.1.1 \nPreparation of stock inventory, performance and \nhealth records, mortality and morbidity rates, \nfinancial transactions and indicators of production \nefficiency \n \n2.2 \nSafety Practices \n2.2.1 \nImplementation of regulatory controls and policies \nrelative to proper handling, use and disposal of \nbiologics and other veterinary drugs and supplies \n2.2.2 \nProper disposal of placenta and dead fetuses \n2.3 \nMathematics and Mensuration \n2.3.1 \nComputation of sow productivity index, feed \nconversion efficiency, parameters of reproductive \nefficiency and financial viability of the swine \nenterprise \n2.3.2 \nCodes and Regulations Compliance to animal \nhealth program, standards and accreditation \nprogram of the Bureau of Animal Industry (BAI) and \nLocal Government Units (LGUs) \n \n2.4 \nSystems, Processes and Operations \n2.4.1 \nBreeding procedures (AI, Natural and Combination)\n2.4.2 \nTransferring of animals in compliance of Animal \nWelfare \n2.4.3 \nSelection of breeder and replacement stocks, \ngeneral care and herd health management from \npiglet to marketable age and weight \n2.5 \nTools and Equipment: Uses and Specifications \n2.5.1 \nCarpentry tools \n \n2.6 \nMaintenance \n2.6.1 \nRegular check-up and repair of tools and \nequipment \n \n2.7 \nMaterials: Uses and Specifications \n2.7.1 \nOffice equipment and supplies for regular \nmonitoring of production performance and \neconomic viability of the swine operation\n\n--- PDF PAGE 58 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n57\n \n2.8 \nBlue Printing \n2.8.1 \nInfrastructure plans and lay-out approved based on \nexisting regulatory policies and proper zoning \nscheme of the government and local ordinances \n2.9 \nValues \n2.9.1 \nHonesty in marketing and financial transactions \n2.9.2 \nPerseverance and industriousness on care and \nmanagement of the general herd\n3. Required Skills \n3.1 \nWork safety \n3.2 \nSkills in using tools and equipment \n3.3 \nCalculations \n3.4\nCommunicating ideas and information\n4. Resource \nImplications \n4.1. \nFarm \n4.2. \nCarpentry tools \n5. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1. Practical demonstration related to underpinning \nknowledge, skills and attitudes \n5.2. Assessment by immediate superiors with regards to the \nwork accomplishment \n5.3. Interviews with the participants on actual work or training \nsettings\n6. Context of \nAssessment \n \n6.1 \nCompetency maybe assessed individually in the \nworkplace or in a simulated workplace individually or as a \npart of a team under limited supervision.\n\n--- PDF PAGE 59 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n58\nUNIT OF COMPETENCY \n: \nAPPLY BIO-SECURITY MEASURES \n \nUNIT CODE \n \n:"
