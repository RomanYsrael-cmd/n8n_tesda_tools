        "source_title": "APPLY BIO-SECURITY MEASURES",
        "source_text": "--- PDF PAGE 59 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n58\nUNIT OF COMPETENCY  \n: \nAPPLY BIO-SECURITY MEASURES \n \nUNIT CODE \n \n:  \nAFF321302 \nUNIT DESCRIPTOR          \n : \nThis unit covers the knowledge, skills and \nattitudes \nrequired \nto \napply \nbio-security \nmeasures in livestock farm operations. It \nincludes identifying bio-security threats and \nhazards, \napplying \ndisease \nprevention \npractices, applying prevention practices in \ndisease transmission and maintaining records. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Identify bio-security \nthreats and hazards \n1.1 \nImmediate threats to the health of the animal are \nidentified and reported to immediate authority. \n1.2 \nBio-security threats are identified based  on \nestablished organizational policy. \n2. Apply disease \nprevention practices \n2.1 \nPreparation of  supplies and materials and \napplication of disinfectants are done according to \nstandard operating procedures \n2.2 \nVehicle and foot vats disinfections are prepared and \nmonitored regularly according to standard operating \npractice \n2.3 \nHygiene and sanitation of farm, farm personnel and \nvisitors are followed based on standard operating \npractice \n2.4 \nAll types of vehicles and equipment entering the \nfarm are disinfected according to standard operating \nprocedures \n2.5 \nNew stocks to be introduced into the herd are \nquarantined and vaccinated according to standard \noperating procedures \n2.6 \nVaccination programs and health programs are \nimplemented as instructed by veterinarian. \n3. Apply preventive \ndisease transmission  \npractices \n3.1 \nSamples are collected and prepared for serological \nmonitoring of notifiable diseases. \n3.2 \nPreventive measures on notifiable diseases as \ndeclared by BAI are followed based on industry and \nBAI standard \n3.3 \nMedication and vaccination programs are followed \nstrictly as recommended by manufacturers and \nveterinarian \n3.4 \nHygiene and sanitation of farm, farm personnel and \nvisitors are followed based on standard operating\n\n--- PDF PAGE 60 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n59\npractice \n3.5 \nSick and unfit stocks are culled and isolated in \naccordance to Animal Welfare Act and standard \noperating procedure \n3.6 \nDead stocks and by-products are disposed using \nproper disposal method  \n3.7 \nTools and equipment used in sick and dead animals \nare properly clean and disinfected. \n3.8 \nCommunication with supervising veterinarian are \ndone regularly following enterprise requirements. \n4. Maintain records \n4.1 \nAppropriate records in checklist format are kept, \ncollated and updated regularly in accordance with \norganizational policy \n4.2 \nReporting to veterinarian or supervisor are carried \nout based on industry standards.\n\n--- PDF PAGE 61 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n60\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Immediate threats \n1.1 Natural calamities \n1.2 Physical threat \n1.3 Unforeseen events (prevailing diseases, outbreaks) \n2. Bio-security threats \n2.1 Animals other than stocks being taken cared of \n2.2 Diseases  \n2.2.1 Bacterial \n2.2.2 Viral diseases \n2.2.3 Parasitic diseases \n2.2.4 Parasitism \n2.3 Finished products/By-products of animal production \n2.4 Traffic flow of potential carriers \n2.4.1 People \n2.4.2 Stocks \n2.4.3 Equipment \n2.4.4 Vehicles \n2.5 Birds, pests and rodents \n3. Supplies and \nmaterials \n3.1 Syringes \n3.2 Needles \n3.3 Drugs and other medical supplies \n4. Tools and \nequipment \n4.1 Boots \n4.2 Rust remover \n4.3 Power sprayer \n4.4 Portable sprayer \n4.5 Torch \n5. Disinfectants \n5.1 Chemical disinfectants \n5.1.1 Phenols \n5.1.2 Iodophore \n5.1.3 Aldehydes \n5.1.4 Organic salts \n5.1.5 Quarternary products \n5.1.6 Combined disinfectants \n5.2 Physical disinfectants \n5.2.1 Torch \n5.2.2 Disposable suits \n5.2.3 Boots \n5.2.4 Paints \n5.2.5 Rust remover \n5.3 Lime for animal disposal \n6. Stocks \n6.1 Replacement breeder \n6.2 Outsourced piglets/ \n6.3 Outsourced fatteners\n\n--- PDF PAGE 62 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n61\n7. Vaccination \nprogram \n7.1 Market pig program \n7.2 Breeder stocks program \n8. Health program \n8.1 Medication program \n8.2 Deworming program \n9. Standard operating \nprocedures \n9.1 Annual  health certificate  \n9.2 At least 3 days downtime \n9.3 Change of clothes before entering farm \n9.4  Hand washing before and after each activities \n9.5 Shower –in and shower-out \n9.6 Wearing of appropriate footwear \n9.7 Foot baths in all entry points \n9.8 Self-isolation when sick \n9.9 Not allowed to raise pigs in their house \n9.10 Not allowed to bring in fresh or cooked meat  \n9.11 Not allowed to entertain personal visitors inside the \nfarm \n10. Sick and unfit \nstocks \n10.1 Listlessness \n10.2 Increase body temperature \n10.3 Loss appetite \n10.4 Solitary separation from the group \n10.5 Mucosal discharge on the eyes and snout \n10.6 Swollen body parts \n10.7 Appearance of vesicles \n11. Disposal method \n11.1 Bury animals \n11.2 Use mortality pit \n12. Appropriate records \n12.1 Swine population \n12.2 Vaccination \n12.3 Medication \n12.4 Standard routine procedure\n\n--- PDF PAGE 63 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n62\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nIdentified bio-security threats and hazards \n1.2 \n Applied disease prevention practices \n1.3 \nApplied preventive disease transmission practices \n1.4\nMaitained records\n2. Required \nKnowledge and \nAttitudes \n \n \n2.1 Communication \n2.1.1 Accomplishing the check list \n2.2 Safety Practices \n2.2.1 Knowledge in handling disinfectants and other \nveterinary supplies \n2.2.2  Knowledge of proper waste handling and \nmanagement \n2.3 Mathematics and Mensuration \n2.3.1 Proper calculation of inclusion rates of \ndisinfectants and chemicals  \n2.4 Codes and Regulations \n2.4.1 Appropriate legal and supervising regulatory \nbody pertinent to bio-security program such as \nBAI, PAHC, and DENR \n2.5 Systems, Processes and Operations \n2.5.1 Selection of replacement or new stocks \n2.5.2 Implementation of appropriate animal health \nprogram  \n2.6 Materials: Uses and Specifications \n2.6.1 Drugs and medical supplies \n2.6.2 Office supplies and materials – for regular \ninventory and monitoring of animal health \nprogram  \n2.7  Tools and Equipment: Uses and Specifications \n2.7.1 Rust remover \n2.7.2 Power sprayer \n2.7.3 Torch \n2.8  Values \n \n2.8.1 Honesty in reporting \n2.8.2 Confidence in selecting healthy replacement or \nnew stocks \n2.8.3 Personal integrity and perseverance in  \nperforming routine bio-security measures \n2.8.4 Ability to work well with others harmoniously\n3. Required Skills \n3.1 Work safety \n3.2 Calculations \n3.3 Communicate effectively \n4. Resource \nImplication \nThe following resources MUST be provided: \n5.1. \nFarm location with required facilities  \n5.2.\nSupplies and materials applied for bio-security\n\n--- PDF PAGE 64 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n63\nmeasures \n5. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1. Observation/Demonstration \n5.2. Third party report \n5.3. Portfolio \n6. Context of \nAssessment \n6.1  Competency may be assessed individually in the actual \nworkplace or through accredited farms/institution\n",
