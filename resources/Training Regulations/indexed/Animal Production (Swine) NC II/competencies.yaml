        "source_title": "HANDLE BREEDERS",
        "source_text": "--- PDF PAGE 33 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n32\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY  \n:  HANDLE BREEDERS \nUNIT CODE \n \n \n:  AFF621216 \n \n \n \nUNIT DESCRIPTOR \n \n:  This unit covers the knowledge, skills and attitudes  \nrequired to select the genetically superior breeders \nand replacement stocks, proper handling  and \nfeeding of boar, sows and gilts, providing care and \nmonitoring the health of the breeders \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Perform preparatory \nbreeding activities \n \n \n \n \n1.1 Acclimatization of newly-arrived stocks is done \nfollowing industy standard as prescribed by \nveterinarian or an animal health technician. \n1.2  Animals are given routine medication as \nprescribed by veterinary. \n1.3 Suitable breeds are selected based on industry \nstandards and choice of enterprise. \n1.4 Breeder stocks are selected based on industry  \nand enterprise standards \n2. Breed sows and gilts  \n \n \n \n2.1 Signs of heat are monitored based on standards \nprotocol.  \n2.2 Heat-detection techniques are performed \nfollowing established protocol. \n2.3 Sows/Gilts are bred using breeding systems \nbased on choice of enterprise.  \n3. Prepare and train boar for \nbreeding \n \n3.1 Boar is trained to mount a female or a dummy sow \n3.2 Boar is given prescribed vaccines and medications \n3.3 Ideal weight and age are determined according \nindustry standards. \n3.4 Optimum boar to sow ratio is observed following \nstandard monitoring scheme. \n4. Monitor signs of pregnancy \n4.1 Signs of pregnancy are monitored according to \nstandards protocol. \n4.2 Pregnancy diagnosis is performed according to \nstandard procedures. \n5. Maintain and monitor \nanimal health condition \n \n5.1. Periodic activities are performed following work \nplan and breeding schedules. \n5.2. Animal stocks are fed based on physiological \ngrowths  and production cycle.  \n5.3. Non-performing breeders are selected for culling\n\n--- PDF PAGE 34 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n33\nbased on industry standards \n5.4. Changes in animal behavior is monitored following \nstandard procedures and GAHP. \n6. Record Data  \n6.1 Stock inventory is updated according to established \nfarm recording system \n6.2 Breeding schedule is monitored and recorded \nfollowing work plan. \n6.3 Production performance of breeders are recorded \nand reported according to enterprise protocol.\n\n--- PDF PAGE 35 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n34\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Acclimatization  \n1.1 \nIsolation of animals in quarantine pens \n1.2 \nObservance of animals for abnormal behavior \n1.3 \nTesting for possible disease \n1.4 \nVaccination depending on disease outbreak in the areas \n1.5\nBoar semen evaluation\n2. Routine \nmedication \n2.1 \nDeworming \n2.2 \nVaccination \n3. Breeds  \n3.1 \nLandrace \n3.2 \nLarge white \n3.3 \nDuroc \n3.4 \nPietrain \n3.5 \nNew Hampshire \n3.6\nHybrids (Hypor, PIC, etc)\n4. Breeder stocks \n4.1 \nFemale breeder \n4.2\nMale breeder or boar\n5. Signs of heat \n5.1 \nGrunting and mounting of other sows \n5.2 \nSwelling and reddening of the vulva \n5.3 \nLoss of appetite \n5.4 \nErect ears \n5.5 \nAppearance of mucous discharge from the vagina \n5.6 \nCan only be moved with great efforts \n5.7\nFrequent attempts to urinate with little or no discharge at all\n6. Heat detection \ntechniques \n6.1 \nHaunch-pressure test \n6.2 \nRiding-the-back test \n6.3 \nSemen-on-the-snout  \n6.4\nTeaser Method\n7. Breeding systems \n7.1 \nInbreeding \n7.2 \nPurebreeding \n7.3 \nCrossbreeding \n7.4\nUpgrading\n8. Signs of \npregnancy \n8.1 \nAbsence of heat/estrus \n8.2 \nIncrease in weight \n8.3 \nEnlargement of the abdomen \n8.4\nDevelopment of mammary glands\n9. Pregnancy \ndiagnosis \n9.1 \nPregnancy control \n9.2 \nPhysical signs of pregnancy \n9.3 \nBoar exposure \n9.4 \nDoppler \n9.5\nScanner\n10. Periodic activities \n10.1 Transfer to dry and pregnant unit \n10.2 Regulate in feed intake based on stage of production \n10.3 Vaccination  \n10.4 Deworming \n10.5 Mange Treatment (External Parasites) \n10.6 Sow cleaning \n10.7 Transfer to farrowing pens\n\n--- PDF PAGE 36 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n35\n11. Physiological \ngrowth \n11.1 Gilts \n11.2 Junior boars \n11.3 Sows \n11.4 Senior boars\n12. Production cycle \n12.1 Dry period \n12.2 Gestation period \n12.3 Lactation period\n13. Production \nperformance \n13.1 Breeding performance record (computation of breedings \nper month, farrowings per year, recycles per month and \nrebred per month) \n13.2 Reproduction parameters (litter size at birth, at weaning, \npigs per sow per year, birth weight)\n\n--- PDF PAGE 37 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n36\nEVIDENCE GUIDE \n \n1 Critical Aspects of \nCompetency  \n \nAssessment requires evidence that the candidate: \n \n1.1. Performed preparatory breeding activities \n1.2. Bred sows and gilts  \n1.3. Prepared and trained boar for breeding \n1.4. Monitored signs of pregnancy \n1.5. Maintained and monitored animal health condition \n1.6.\nRecorded data\n2 Required  \nKnowledge and \nAttitudes \n \n \n \n2.1 Communication \n2.1.1 \nPreparation of stock inventory, performance and \nhealth records, mortality and morbidity rates, \nfinancial transactions and indicators of production \nefficiency \n \n2.2 Safety Practices \n2.2.1 \nImplementation of regulatory controls and policies \nrelative to proper handling, use and disposal of \nbiologics and other veterinary drugs and supplies \n2.2.2 \nProper attire inside the farm premises \n \n2.3 Mathematics and Mensuration \n2.3.1 \nComputation of sow productivity index, feed \nconversion efficiency, parameters of reproductive \nefficiency and financial viability of the swine \nenterprise  \n \n2.4 Codes and Regulations \n2.4.1 \nCompliance to animal health program, standards \nand accreditation program of the Bureau of Animal \nIndustry (BAI) and Local Government Units (LGUs) \n2.4.2 \nCompliance with environmental standards set by \nthe DENR and LGUs \n2.4.3 \nCompliance with standards set by the Bureau of \nAgriculture and Fishery Products Standards \n(BAFPS) \n \n2.5 Systems, Processes and Operations \n2.5.1 \nSelection of breeder and replacement stocks, \ngeneral care and herd health  \n \n2.6 Tools and Equipment: Uses and Specifications \n2.6.1 \nArtificial Insemination Kit – for successful \ninsemination of gilts and sows \n2.6.2 \nMicroscope for qualitative semen evaluation \n2.6.3 \nAutomatic drinkers and feeders \n2.6.4 \nFeed scoops \n2.6.5 \nPregnancy detector \n2.6.6\nAutomatic syringe and needles\n\n--- PDF PAGE 38 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n37\n2.6.7 \nDriving board and rubber slapper \n \n2.7 Maintenance \n2.7.1 \nRegular check-up and repair of tools and equipment \n \n2.8 Materials: Uses and Specifications \n2.8.1 \nOffice equipment and supplies for regular \nmonitoring of production performance and economic \nviability of the swine operation \n \n2.9 Values  \n2.9.1 \nSafety consciousness on vaccine handling and \nother biological \n2.9.2 \nAccuracy in medication and treatment of hog’s \ndiseases \n2.9.3 \nCompetence and self-confidence towards selection \nof breeding stocks \n2.9.4 \nHonesty in marketing and financial transactions \n2.9.5 \nPerseverance and industriousness on care and \nmanagement of the general heard\n3 Required Skills \n3.1 \nWork safety \n3.2 \nSkills in using tools and equipment \n3.3 \nCalculations \n3.4\nCommunicating ideas and info\n5. Resource \nImplications \n4.1. \nFarm \n4.2. \nPens and corrals \n4.3. \nDummy \n4.4. \nTrained boars for artificial insemination \n4.5. \nIn-heat, sows/gilts \n4.6. \nArtificial insemination kit \n4.7. \nTools and equipment appropriate to swine breeding  \n4.8.\nMicroscope\n4 Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n5.1. Practical demonstration related to underpinning \nknowledge, skills and attitudes \n5.2. Assessment by immediate superiors with regards to the \nwork accomplishment \n5.3. Interviews with the participants on actual work or training \nsettings\n6. Context of \nAssessment \n \n6.1 Competency maybe assessed individually in the workplace \nor in a simulated workplace individually or as a part of a \nteam under limited supervision\n",
