        "source_text": "AFF621219 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes \nrequired to care for finishers effectively and \nefficiently. It includes preparing animals for finishing; \nproper management and feeding finishers, providing \ncare and monitoring the health \nof the animals and profitable marketing of hogs either \nas replacements stocks/breeders or market \n \n \nhogs. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Prepare animals for \nfinishing \n \n1.1. Suitable growers are selected for finishing based \non weight and age. \n1.2. Finishers building are cleaned and disinfected \nfollowing enterprise procedures. \n1.3. Materials and equipment are adjusted and \nsupplied according to work requirements. \n1.4. Growers are grouped based on industry standards \nand enterprise specifications. \n1.5. Growers are transferred based on the Minimum \nStandards on the Welfare of Pigs and Code of \nGood Animal Husbandry Practices (GAHP)\n2. Maintain conducive \natmosphere and facilities \n \n \n \n \n \n \n2.1. Pen is cleaned regularly following hygienic \nprocedures. \n2.2. Proper temperature is monitored and provided \nbased on the Minimum Standards on the Welfare \nof Pigs and Code of Good Animal Husbandry \nPractices (GAHP) \n2.3. Height of drinkers are checked and adjusted to \nensure proper functioning based on the Minimum \nStandards on the Welfare of Pigs and Code of \nGood Animal Husbandry Practices (GAHP) \n2.4. Enough floor space is provided based on the \nMinimum Standards on the Welfare of Pigs and \nCode of Good Animal Husbandry Practices \n(GAHP) \n2.5. Weak animals are isolated based on industry \nstandards.\n3. Feed finishers \n3.1 \nFeeders are checked and adjusted to ensure \nproper functioning \n3.2 \nAnimals are fed according to a standard feeding \nsystem. \n3.3 \nFeed ration is adjusted and shifted based on farm \nprotocols and physiological growth.\n\n--- PDF PAGE 50 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n49\n3.4 \nMedicated feeds are withdrawn according to \nveterinarian instructions.\n4. Maintain herd health care \nand medication program \n4.1 \nChanges in animal behavior are monitored \nfollowing Animal Welfare Act and GAHP. \n4.2 \nChanges in posture of animal is monitored \nAnimal Welfare Act and GAHP. \n4.3 \nChanges in respiration of animal is monitored \nAnimal Welfare Act and GAHP. \n4.4 \nChanges in skin color is monitored Animal \nWelfare Act and GAHP. \n4.5 \nUniformity of stocks is monitored following \nenterprise protocol. \n4.6 \nVaccination and medication programs are \nimplemented based on veterinarian instructions \n5. Prepare animals for \nmarketing \n5.2 \nAnimal weight is determined using weighing scales.\n5.3 \nMarketable animals are prepared and reserved \nfollowing marketing requirements and procedures. \n5.4 \nLoading facility and ramp are prepared with \nreference to Animal Welfare Act. \n5.5 \nAnimals are moved to loading facility following \nAnimal Welfare Act. \n5.6 \nEnsure the transportation vehicle is cleaned and \ndisinfected prior to entering farm premises in line \nwith GAHP.\n6. Record Data \n6.1 \nFinishing records are is updated following \nenterprise protocol. \n6.2 \nProduction parameters for finishers are \nmonitored with reference to production \nrequirements.\n\n--- PDF PAGE 51 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n50\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Materials and \nEquipment \n1.1 \ndriving board \n1.2 \nrubber slappers \n1.3 \nfeeders \n1.4 \ndrinkers \n1.5 \ndisinfectants \n1.6\nidentification markers\n2. Feeding systems \n2.1 \nAd libitum feeding \n2.2 \nRestricted feeding \n2.3 \nCombined \n2.4 \nWet feeding \n2.5\nDry feeding\n3. Changes in animal \nbehavior \n3.1 \nListlessness \n3.2 \nIncrease in body temperature \n3.3 \nLoss appetite \n3.4 \nSolitary separation from the group \n3.5 \nMucosal discharge on the eyes and snout \n3.6 \nDiarrhea \n3.7\nConstipation\n4. Changes in posture \n4.1 \nLateral recumbency \n4.2 \nSternal recumbency \n4.3 \nDog – sitting \n4.4 \nExtended head \n4.5\nCircling movements\n5. Changes in \nrespiration \n5.1 \nRapid breathing \n5.2 \nAbdominal breathing \n5.3 \nOther upper respiratory sounds \n5.4\nAbnormal respiratory excretions\n6. Changes in skin \ncolor \n6.1 \nPale \n6.2 \nBluish \n6.3 \nYellowish \n6.4 \nReddish \n6.5\nGrayish/Crusted\n7. Production \nparameters \n7.1 \nFeed Conversion Ration(FCR) \n7.2 \nAverage Daily Gain (ADG) \n7.3\nPercentage mortalities\n\n--- PDF PAGE 52 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n51\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1. Prepared animals for finishing \n1.2. Managed finishers \n1.3. Fed finishers \n1.4. Maintained herd health management and medication \nprogram \n1.5. Sold animals \n1.6. Recorded Data \n2. Required \nKnowledge and \nAttitudes \n \n \n \n2.1 Communication \n2.1.1 Preparation of stock inventory, performance and \nhealth records, mortality and morbidity rates, \nfinancial transactions and indicators of production \nefficiency \n2.2 Safety Practices \n2.2.1 Implementation of regulatory controls and policies \nrelative to proper handling, use and disposal of \nbiologics and other veterinary drugs and supplies \n2.2.2 Proper attire inside the farm premises \n2.3 Mathematics and Mensuration \n2.3.1 Computation feed conversion efficiency, average \ndaily gain, feed profit and financial viability of the \nswine enterprise \n2.4 Codes and Regulations \n2.4.1 Compliance to animal health program, standards \nand accreditation program of the Bureau of Animal \nIndustry (BAI) and Local Government Units (LGUs) \n2.4.2 Compliance with environmental standards set by \nthe DENR and LGUs \n2.4.3 Compliance with standards set by the Bureau of \nAgriculture and Fishery Standards \n \n2.5 Systems, Processes and Operations \n2.5.1 Selection of good starters, general care and herd \nhealth management from to marketable age and \nweight \n2.6 Tools and Equipment: Uses and Specifications \n2.6.1 Automatic drinkers and feeders \n2.6.2 Feed scoops \n2.6.3 Power sprayer \n2.6.4 Driving board \n2.6.5 Automatic and disposable syringes \n2.6.6 Weighing balance(500 kg cap.) – for monitoring and \nmarketing of hogs\n\n--- PDF PAGE 53 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n52\n \n2.7 Maintenance \n2.7.1 Regular check-up and repair of tools and equipment \n \n2.8 Materials: Uses and Specifications \n2.8.1 Office equipment and supplies for regular monitoring \nof production performance and economic viability of \nthe swine operation \n \n2.9 Values \n2.9.1 Safety consciousness on vaccine handling and other \nbiological \n2.9.2 Accuracy in medication and treatment of hog’s \ndiseases \n2.9.3 Competence and self-confidence towards selection \nof breeding stocks \n2.9.4 Honesty in marketing and financial transactions \n2.9.5 Perseverance and industriousness on care and \nmanagement of the general heard\n3. Required Skills \n3.1 Work safety \n3.2 Skills in using tools and equipment \n3.3 Calculations \n3.4 Communicating ideas and info\n4. Resource \nImplications \n4.1. \nFarm facility \n4.2. \nTools and equipment appropriate to finisher production \n4.3.\nStarters – finishers\n5. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n5.1. \nPractical demonstration related to underpinning \nknowledge, skills and attitudes \n5.2. \nAssessment by immediate superiors with regards to the \nwork accomplishment \n5.3. \nInterviews with the participants on actual work or training \nsettings\n6. Context of \nAssessment \n \n6.1 Competency maybe assessed individually in the workplace \nor in a simulated workplace individually or as a part of a \nteam under limited supervision.\n\n--- PDF PAGE 54 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n53\n \nUNIT OF COMPETENCY \n:\nMAINTAIN HEALTHY ANIMAL ENVIRONMENT \nUNIT CODE \n:"
