        "source_title": "HANDLE FARROWING SOWS AND SUCKLINGS",
        "source_text": "--- PDF PAGE 39 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n38\nUNIT OF COMPETENCY \n:   HANDLE FARROWING SOWS AND SUCKLINGS  \nUNIT CODE \n \n \n:    AFF621217 \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes  \n \n \nrequired to raise swine effectively and efficiently. It  \nincludes \npreparing \nanimals \nfor \nfarrowing; \nperformance of farrowing activities; caring of piglets \nto weaning and recording of technical and production \ndata. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Prepare animals for  \nfarrowing \n1.1. \nFarrowing stalls or pens are cleaned and \ndisinfected following standard hygienic \nprocedures. \n1.2. \nBathing of sows is conducted following Good \nAnimal Husbandry Practices (GAHP)  \n1.3. \nPregnant sows are transferred to farrowing stalls \nor pens according to industry standards. \n1.4. \nFeed intake is  determined based on farm \nprotocols  \n1.5. \nSigns of approaching farrowing are monitored.  \n1.6. \nFarrowing materials and supplies are prepared \nbased on work requirements. \n1.7. \nAppropriate personal protective equipment (PPE) \nare worn following Occupational Safety and Health \nStandard (OSHS). \n2. Perform farrowing-related \nactivities  \n2.1. \nFarrowing problems are monitored following \nenterprise protocol. \n2.2. \nFeed intake is adjusted based on nutrient \nrequirements of animals. \n2.3. \nSow or gilt is manually assisted based on animal \nrequirement. \n2.4. \nManagement of newborn piglets are conducted \naccording to GAHP. \n2.5. \nPlacenta and dead piglets  are disposed following  \nDENR regulations.\n3. Raise piglets to weaning \n \n3.1 Proper temperature/micro-climate is provided based \non the Minimum Requirements for the Welfare of \nPigs and the Code of Good Animal Husbandry \nPractices (GAHP) \n3.2 Colostrum and milk intake are ensured based from \nGAHP. \n3.3 Iron preparations are injected based on industry \nstandards and manufacturer’s specification. \n3.4 Castrate male animals based on the Minimum \nRequirements for the Welfare of Pigs and the Code \nof Good Animal Husbandry Practices (GAHP)\n\n--- PDF PAGE 40 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n39\n3.5 Piglets  are fed based on their physiological growth \nrequirements  \n3.6 Piglets are weaned based on industry standards.\n4. Maintain Health \n4.1 Changes in piglet behavior is monitored following \nenterprise protocol. \n4.2 Animal condition  are monitored  thru changes in \nfecal color, odor and consistency of piglets \naccording to industry standard procedures. \n4.3 Uniformity of litter is monitored based on enterprise \nrequirements. \n4.4 Sow discharges is monitored following instructions \nof veterinarian. \n4.5 Vaccination programs are implemented based on \nveterinary recommendation.\n5. Record data  \n5.1. Farrowing card is updated following enterprise \nprocedures. \n5.2. Farrowing schedules are monitored with reference \nto work plan. \n5.3. Prodution performance  are recorded and \nreported to immediate authority.\n\n--- PDF PAGE 41 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n40\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Bathing sows \n1.1 \nWashing and cleaning  of mammary gland \n1.2 \nWashing and cleaning  of external genitalia \n1.3\nWashing and cleaning other parts of animal bodies\n2. Signs of farrowing \n2.1 \nBiting of hurdles and guard rails \n2.2 \nSows  assume “dog-sitting” position \n2.3 \nProminent distention and enlargement of the udder \n2.4 \nEnlargement and swelling of the vulva \n2.5 \nFrequent urination \n2.6 \nMilk letdown \n2.7\nMucous discharge with meconium\n3. Farrowing materials and \nsupplies \n \n3.1 \nOld newspaper \n3.2 \nBrooders \n3.3 \nThree 50-watt incandescent bulb \n3.4 \nTooth clipper \n3.5 \nMild antiseptic \n3.6\nTattoing materials\n4. Farrowing problems \n4.1 \nSow \n4.2 \nAbnormal vaginal discharge \n4.3 \nMastitis – inflammation of the mammary gland \n4.4 \nAgalactia – absence of milk production \n4.5 \nDystocia – difficult birth or farrowing \n4.6 \nPiglets \n4.7 \nCrushing \n4.8 \nCannibalism \n4.9\nWeak\n5. Management of \nnewborn piglets \n5.1 \nDrying or wiping with powder or cloth \n5.2 \nNavel cord care \n5.3 \nTooth clipping \n5.4 \nTattooing piglet identification (tattooing, earnotch,)  \n5.5 \nBrooding \n5.6\nTail docking (as per enterprise requirements)\n6. Changes in piglet \nanimal behavior  \n6.1 \nListlessness \n6.2 \nIncrease in body temperature \n6.3 \nLoss of appetite \n6.4 \nSolitary or separation from the group \n6.5 \nHuddling \n6.6 \nThumping \n6.7\nShivering\n7. Animal condition \n7.1 \nConstipation \n7.2\nDiarrhea – liquid, pasty\n8. Changes in fecal color \nand odor  \n8.1 \nColor \n Yellowish \n Greenish \n Fatty \n Orange \n Whitish\n\n--- PDF PAGE 42 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n41\n8.2 \nOdor \n Offensive (fishy odor) \n\nNon-offensive\n9. Production performance  10.1 \nWeaning weights \n10.2\nPercentage runts\n\n--- PDF PAGE 43 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n42\nEVIDENCE GUIDE \n \n1 Critical Aspects of \nCompetency  \n \nAssessment requires evidence that the candidate: \n1.1. \nPrepared animals for  farrowing \n1.2. \nPerformed farrowing-related activities \n1.3. \nRaised piglets to weaning \n1.4. \nMaintained health \n1.5.\nRecorded data\n2 Required \nKnowledge and \nAttitudes \n \n \n \n2.1. \nCommunication \n2.1.1 Preparation of farrowing card, performance and \nhealth records, mortality and morbidity rates, \nfinancial transactions and indicators of production \nefficiency \n2.2. \nSafety Practices \n2.2.1 Implementation of regulatory controls and policies \nrelative to proper handling, use and disposal of \nbiologics and other veterinary drugs and supplies \n2.2.2 Proper disposal of placenta and dead fetuses \n2.2.3 Proper attire inside the farm premises \n2.3. \nMathematics and Mensuration \n2.3.1 Computation of sow productivity index, feed \nconversion efficiency, parameters of reproductive \nefficiency and financial viability of the swine \nenterprise  \n2.4. \nCodes and Regulations \n2.4.1 Compliance to animal health program, standards \nand accreditation program of the Bureau of Animal \nIndustry (BAI) and Local Government Units (LGUs) \n2.4.2 Compliance with environmental standards set by \nthe DENR and LGUs \n2.4.3 Compliance with standards set by the Bureau of \nAgriculture and Fishery Products Standards \n(BAFPS) \n \n2.5. \nSystems, Processes and Operations \n2.5.1 General care and herd health management from \npiglet to marketable age and weight \n \n2.6. \nTools and Equipment: Uses and Specifications \n2.6.1 Weighing scale (10 kg cap.) – for monitoring of \npiglets \n2.6.2 Automatic drinkers and feeders \n2.6.3 Feed scoops \n2.6.4 Power sprayer \n2.6.5 Tooth clipper, forceps, scissor and other tools for \nidentification of animals \n2.7. \nMaintenance \n2.7.1 Regular check-up and repair of tools and \nequipment \n2.8.\nMaterials: Uses and Specifications\n\n--- PDF PAGE 44 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II                          \nPROMULGATED December 2013 \n43\n2.8.1 Office equipment and supplies for regular \nmonitoring of production performance and \neconomic viability of the swine operation \n2.9. \nValues  \n2.9.1 Safety consciousness on vaccine handling and \nother biological \n2.9.2 Accuracy in medication and treatment of hog’s \ndiseases \n2.9.3 Honesty in marketing and financial transactions \n2.9.4 Perseverance and industriousness on care and \nmanagement of the general heard\n3 Required  Skills \n3.1 \nWork safety \n3.2 \nSkills in using tools and equipment \n3.3 \nCalculations \n3.4\nCommunicating ideas and info\n4 Resource \nImplications \n4.1. \nFarm \n4.2. \nPens and cages \n4.3. \nTools and equipment appropriate to forrowing of sow and \nsucklings. \n4.4.\nSows with piglets\n5 Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1. \nPractical demonstration related to underpinning \nknowledge, skills and attitudes \n5.2. \nAssessment by immediate superiors with regards to the \nwork accomplishment \n5.3. \nInterviews with the participants on actual work or training \nsettings\n6 Context of \nAssessment \n \n6.1 \nCompetency maybe assessed individually in the \nworkplace or in a simulated workplace individually or as a \npart of a team under limited supervision\n",
