    "source_text": "SECTION 3. TRAINING STANDARDS \nThese guidelines are set to provide the Technical and Vocational Education \nand Training (TVET) providers with information and other important requirements to \nconsider when designing training programs for ANIMAL PRODUCTION (SWINE) NC \nII. \n \n3.1 CURRICULUM DESIGN \n \nNominal Training Duration: \n18 hrs – Basic Competencies \n \n \n \n \n 48 hrs – Common Competencies \n \n \n 240 hrs – Core Competencies \n \n \n \n \n ------------ \n 306 hrs - Total Duration \nCourse Description: \n \nThis course is designed to enhance the knowledge, desirable attitudes and skills of \nanimal production technician in accordance with industry standards. It covers \ncompetencies in handling breeders, handling farrowing sows and sucklings, raising \nweanlings, producing finishers, maintaining animal healthy environment and applying \nbio-security measures. \n \n \n \nBASIC COMPETENCIES \n18 hours \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n1. Participate in \nworkplace \ncommunication \n1.1 Obtain and convey \nworkplace information. \n1.2 Complete relevant \nwork related \ndocuments. \n1.3 Participate in \nworkplace meeting and \ndiscussion.\n• Group \ndiscussion \n• Interaction \n• \n• Demonstration\n• Observation \n• Interviews/ \nquestioning \n2. Work in a team \nenvironment \n2.1 Describe and identify \nteam role and \nresponsibility in a \nteam. \n2.2 Describe work as a \nteam member.\n• Discussion \n• Interaction \n• \n• Demonstration\n• Observation \n• Interviews/ \nquestioning \n3. Practice career \nprofessionalism \n3.1 Integrate personal \nobjectives with \norganizational goals. \n3.2 Set and meet work \npriorities. \n3.3 Maintain professional \ngrowth and \ndevelopment.\n• Discussion \n• Interaction \n• \n• \n• Demonstration\n• Observation \n• Interviews/ \nquestioning\n\n--- PDF PAGE 66 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n65\n4. Practice \noccupational \nhealth and \nsafety \n4.1 Identify hazards and \nrisks \n4.2 Evaluate hazard and \nrisks \n4.3 Control hazards and \nrisks \n4.4 Maintain occupational \nhealth and safety \nawareness\n• Discussion \n• Plant tour \n• Symposium \n• Observation \n• Interview \n \n \nCOMMON COMPETENCIES \n48 hours \n \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n1. Apply safety \nmeasures in \nfarm operations \n1.1 \nApply appropriate \nsafety measures while \nworking in farm \n1.2 \nSafe keep/dispose \ntools, materials and \noutfit. \n• Self-\npaced/modular \n• Lecture/Discu\nssion \n• Interaction \n• Practical \nDemonstration \n•\nVisit/tour\n• Oral/Written \nInterviews \n• Direct \nObservation \n• Practical \nDemonstration \n2. Use farm tools \nand equipment \n2.1 \nPrepare and use farm \ntools \n2.2 \nPrepare and operate \nfarm equipment \n2.3 \nPerform preventive \nmaintenance \nprocedures/practices \n• Self-\npaced/modular \n• Lecture/Discu\nssion \n• Interaction \n• Practical \nDemonstration \n• Visit/tour \n•\n• Oral/Written \nInterviews \n• Direct \nObservation \n• Practical \nDemonstration \n3. Perform \nestimation and \nbasic calculation\n \n3.1 \nPerform estimation \n3.2 \nPerform basic \nworkplace calculation \n \n• Self-\npaced/modular \n• Lecture/Discu\nssion \n• Interaction \n• Practical \nExercise\n• Oral/Written \nexamination \n• Practical \nexercise \n4. Process farm \nwastes \n4.1 \nCollect farm wastes \n4.2 \nIdentify and segregate \nwastes \n4.3 \nTreat and process farm \nwastes \n4.4 \nPerform housekeeping \n \n• Self-\npaced/modular \n• Lecture/Discu\nssion \n• Interaction \n• Practical \nDemonstration \n•\nVisit/tour\n• Oral/Written \nInterviews \n• Direct \nObservation \n• Practical \nDemonstration\n\n--- PDF PAGE 67 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n66\nCORE COMPETENCIES \n240 hours \n \nUnit of \nCompetency\nLearning Outcomes \nMethodology \nAssessment \nApproach\n1. Handle \nBreeders \n1.1 \nPerform preparatory \nbreeding activities \n1.2 \nBreed sows and gilts \n1.3 \nPrepare and train boar for \nbreeding \n1.4 \nMonitor signs of \npregnancy \n1.5 \nMaintain and monitor \nanimal health condition \n1.6\nRecord data \n• Hands- on \n• Lectures/ \nDiscussion \n• Videos/ \nIllustrations \n• Demonstration \n \n• Written \nexamination \n• Oral \nevaluation \n• Demonstrati\non with \nquestions \n \n2. Handle \nFarrowing \nSows and \nSucklings \n2.1 \nPrepare animals for \nfarrowing \n2.2 \nPerform farrowing related \nactivities \n2.3 \nRaise piglets to weaning \n2.4 \nMaintain Health \n2.5 \nRecord Data \n• Hands- on \n• Lectures/ \nDiscussion \n• Videos/ \nIllustrations \n• Demonstration \n \n• Written \nexamination \n• Oral \nevaluation \n• Demonstrati\non with \nquestions \n3. Raise \nWeanlings \n3.1 \nPrepare piglets for \nweaning \n3.2 \nMaintain conducive \natmosphere and facilities \nfor feeding \n3.3 \nMaintain health of newly-\nweaned piglets \n3.4 \nRecord Data \n• Hands- on \n• Lectures/ \nDiscussion \n• Videos/ \nIllustrations \n• Demonstration \n \n• Written \nexamination \n• Oral \nevaluation \n• Demonstrati\non with \nquestions \n4. Produce \nFinishers \n4.1 \nPrepare animals for \nfinishing \n4.2 \nMaintain conducive \natmosphere and facilities \n4.3 \nFeed finishers \n4.4 \nMaintain heard health \ncare and medication \nprogram \n4.5 \nPrepare animals for \nmarketing \n4.6\nRecord data\n• Hands- on \n• Lectures/ \nDiscussion \n• Videos/ \nIllustrations \n• Demonstration \n \n• Written \nexamination \n• Oral \nevaluation \n• Demonstrati\non with \nquestions \n \n5. Maintain \nAnimal \nHealthy \nEnvironment \n5.1 \nMaintain relative humidity \n5.2 \nControl temperature \n5.3 \nSustain air quality \n5.4 \nSustain water quality \n5.5 \nMaintain ventilation \n5.6 \nControl vermin \n• Hands- on \n• Lectures/ \nDiscussion \n• Videos/ \nIllustrations \n• Demonstration \n• Written \nexamination \n• Oral \nevaluation \n• Demonstrati\non with \nquestions\n\n--- PDF PAGE 68 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n67\n6. Apply Bio-\nSecurity \nMeasures \n6.1 \nIdentify bio-security \nthreats and hazards \n6.2 \nApply disease prevention \npractices \n6.3 \nApply preventive disease \ntransmission practices \n6.4 \nMaintain records \n \n• Hands- on \n• Lectures/ \nDiscussion \n• Videos/ \nIllustrations \n• Demonstration \n \n• Written \nexamination \n• Oral \nevaluation \n• Demonstrati\non with \nquestions\n\n--- PDF PAGE 69 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n68\n3.2 TRAINING DELIVERY \n \nThe delivery of training should adhere to the design of the curriculum. \nDelivery should be guided by the 10 basic principles of competency-based \nTVET. \n \n \no The training is based on curriculum developed from the \ncompetency standards; \no Learning is modular in its structure; \no Training delivery is learner-centered and should accommodate \nindividualized and self-paced learning strategies; \no Training is based on work that must be performed; \no Training materials are directly related to the competency \nstandards and the curriculum modules; \no Assessment is based in the collection of evidence of the \nperformance of work to the industry required standard; \no Training program allows for recognition of prior learning (RPL) or \ncurrent competencies; \no Training allows for multiple entry and exit; and \no Training programs are registered with UTPRAS. \n \nThe competency-based TVET system recognizes various types of \ndelivery modes, both on and off-the-job as long as the learning is driven by \nthe competency standards specified by the industry. The following training \nmodalities may be adopted when designing training programs: \n \no The dualized mode of training delivery is preferred and \nrecommended. Thus programs would contain both in-school and \nin-industry training or fieldwork components. Details can be \nreferred to the Dual Training System (DTS) Implementing Rules \nand Regulations. \no Modular/self-paced learning is a competency-based training \nmodality wherein the trainee is allowed to progress at his own \npace. The trainer facilitates the training delivery \no Peer teaching/mentoring is a training modality wherein fast \nlearners are given the opportunity to assist the slow learners. \no Supervised industry training or on-the-job training is an approach \nin training designed to enhance the knowledge and skills of the \ntrainee through actual experience in the workplace to acquire \nspecific competencies prescribed in the training regulations. \no Distance learning is a formal education process in which majority \nof the instruction occurs when the students and instructor are not \nin the same place. Distance learning may employ correspondence \nstudy, or audio, video or computer technologies. \no Project-Based Instruction is an authentic instructional model or \nstrategy in which students plan, implement and evaluate projects \nthat have real world applications. \n \n3.3 TRAINEE ENTRY REQUIREMENTS\n\n--- PDF PAGE 70 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n69\nTrainees or students wishing to enroll in this course should possess \nthe following requirements: \n \n• Able to read and write; \n• With good moral character; \n• Able to communicate, both orally and in writting; and \n• Physically fit and mentally healthy as certified by a Public Health Officer \n \n \n3.1 LIST OF TOOLS, EQUIPMENT AND MATERIALS \n \n ANIMAL PRODUCTION (SWINE) NC II \n \nRecommended list of tools, equipment and materials for the training of 25 \ntrainees for Animal Production (Swine) NC II \n \nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n100 \npcs.\nCatheters \n4 \nMicroscope \n50 \nbottles\nSemen bottles \n1 set \nFirst aid kit \n12 sets \nPersonal Protective \nParaphernalia(scru\nb suits, powder-free \nvinyl gloves, rubber \nboots)\n1pc \nFemale \nReproductive \nOrgan \nSpecimens \n12 pcs.\nTraining bag \n12 \nLaboratory gown \n2 sets \nPail and dipper \n1 \nShovel \n1 \nVehicle \n10 m \nHose \n1 \nsandbag \n1 \nCamera \n6 \nbottles\nIsopropyl alcohol \n(70%)\n \n \n1 \nPower sprayer \n6 pcs. \nGermicidal Soap \n \n \n1 \nGenerator set \n6 packs Paper towels \n \n \n1 \nRefrigerator (16 to \n17 degree C)\n5 boxes\nGlass slides \n \n \n1 \nFire extinguisher \n5 boxes\nCover slips \n \n \n1 \nSet Audio visuals \nwith screen\n2 \nTrash can \n \n \n1 \nWhite board\n50 pcs. \nDisposal waste \nbags\n \n \n12 sets \nChairs and tables \n2 pcs. \nBroomstick \n \n \n2 Units \nComputer \n2 pcs. \nBrooms \n \n \n1 \nPrinter\n6 pcs. \nBrush \n \n \n1 \nPhotocopier\n6 \nBoard marker \n \n \n1 unit \nDryer-Sterilizer \n2 rolls \nMaskingTapes \n \n \n1 \nSemen transport \nbox\n12 pcs \nPencil/ballpen \n \n \n \n \n \n5 reams \nBond paper \n \n \n \n \n2 spray \nPheromones\n\n--- PDF PAGE 71 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n70\nbottles \n \n \n \n \n2 bottles \nSemen (for the \nsnout for heat \ndetection)\n \n \n \n \n100 \nbottles\nSemen (for AI) \n \n \n \n \n4 pcs \nPre-warmed \ncollecting cup\n \n \n \n \n1 box \nSemen filter \n \n \n \n \n1 box \nRubber band \n \n \n \n \n30 L. \nDistilled water \n \n \n \n \n1 box \nPlastic gloves \n \n \n \n \n12 pcs. \nNutrient agar plates \n \n \n \n \n2 bottles \nLubricant \n \n \n \n \n4 \nLaboratory \nthermometer\n \n \n \n \n \nIce \n \n \n \n \n \nDamp cloth/ used \nnewspaper\n \n \n \n \n6 rolls \nTissue paper \n \n \n \nModels/actual \nobjects\n \nLearning Materials\n \n \n2 \nPractice animals \n(boar)\n12 pcs \nTraining manuals \n \n \n5 \nPractice animals \n(Sow/gilt)\n1 \nAnimal charts \n \n \n1 \nDummy sow \n1 \nAnimal breeds \n \n \n \n \n1 \nVideo materials \n \n \n12 pcs \nForms(animal \ninformation sheets, \nsow card, boar \ncard)\n\n--- PDF PAGE 72 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n71\n3.5 TRAINING FACILITIES \n \n ANIMAL PRODUCTION(SWINE) NC II \n \nBased on a class size of 25 students/trainees \n \nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ. \nMETERS \nTOTAL AREA \nIN SQ. \nMETERS \nGRAND \nTOTAL \nAREA IN \nSQ.M. \n• Building \n(permanent)\n13.00 x 15.00 \n195.00 \n \n195.00 \no Student/Trainee \nWorking Space\n2.00 x 2.00 per \nstudent/trainee\n4.00 per student\n100.00 \n \no Lecture Room\n7.00 x 5.00\n35.00\n35.00\no Learning \nResource Center\n3.00 x 5.00 \n15.00 \n15.00 \n \no Tool \nroom/Storage \nroom\n5 x 5 \n25 x 1 \n25 \n \no Wash area, Toilet \n& Locker room\n2 x 5 \n10 x 2 \n20 \n \n• Housing with \nfacilities\n \n \n \n \n• Farm area \n \n \n \n 300 \n \nNote: **1ha./100 sows \n \nPrior to accreditation, a training provide must have a Memorandum of Agreement with private \nswine farm with a at least five-sow level farm as practice farm/workplace for the trainees. \n \n3.6 TRAINER’S QUALIFICATIONS FOR AGRICULTURE SECTOR \n \nTrainers who will deliver the training on ANIMAL PRODUCTION (SWINE) NC II \nshould have the following : \n \n• Must be a holder of National TVET Trainer Certificate I (TM I and NC) \n• Preferrably computer literate \n• Must be physically and mentally fit \n \n \nReference: TESDA Board Resolution No. 2004 03 \n \n3.7. \nINSTITUTIONAL ASSESSMENT \n \nInstitutional assessment is undertaken by trainees to determine their achievement \nof units of competency . A certificate of achievement is issued for each unit of \ncompetency.\n\n--- PDF PAGE 73 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n72"
