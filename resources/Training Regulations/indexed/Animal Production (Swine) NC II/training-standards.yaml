      "source_text": "--- PDF PAGE 70 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n69\nTrainees or students wishing to enroll in this course should possess \nthe following requirements: \n \n• Able to read and write; \n• With good moral character; \n• Able to communicate, both orally and in writting; and \n• Physically fit and mentally healthy as certified by a Public Health Officer \n \n \n3.1 LIST OF TOOLS, EQUIPMENT AND MATERIALS \n \n ANIMAL PRODUCTION (SWINE) NC II \n \nRecommended list of tools, equipment and materials for the training of 25 \ntrainees for Animal Production (Swine) NC II \n \nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n100 \npcs.\nCatheters \n4 \nMicroscope \n50 \nbottles\nSemen bottles \n1 set \nFirst aid kit \n12 sets \nPersonal Protective \nParaphernalia(scru\nb suits, powder-free \nvinyl gloves, rubber \nboots)\n1pc \nFemale \nReproductive \nOrgan \nSpecimens \n12 pcs.\nTraining bag \n12 \nLaboratory gown \n2 sets \nPail and dipper \n1 \nShovel \n1 \nVehicle \n10 m \nHose \n1 \nsandbag \n1 \nCamera \n6 \nbottles\nIsopropyl alcohol \n(70%)\n \n \n1 \nPower sprayer \n6 pcs. \nGermicidal Soap \n \n \n1 \nGenerator set \n6 packs Paper towels \n \n \n1 \nRefrigerator (16 to \n17 degree C)\n5 boxes\nGlass slides \n \n \n1 \nFire extinguisher \n5 boxes\nCover slips \n \n \n1 \nSet Audio visuals \nwith screen\n2 \nTrash can \n \n \n1 \nWhite board\n50 pcs. \nDisposal waste \nbags\n \n \n12 sets \nChairs and tables \n2 pcs. \nBroomstick \n \n \n2 Units \nComputer \n2 pcs. \nBrooms \n \n \n1 \nPrinter\n6 pcs. \nBrush \n \n \n1 \nPhotocopier\n6 \nBoard marker \n \n \n1 unit \nDryer-Sterilizer \n2 rolls \nMaskingTapes \n \n \n1 \nSemen transport \nbox\n12 pcs \nPencil/ballpen \n \n \n \n \n \n5 reams \nBond paper \n \n \n \n \n2 spray \nPheromones\n\n--- PDF PAGE 71 ---\nTR-ANIMAL PRODUCTION (SWINE) NC II \nPROMULGATED December 2013 \n70\nbottles \n \n \n \n \n2 bottles \nSemen (for the \nsnout for heat \ndetection)\n \n \n \n