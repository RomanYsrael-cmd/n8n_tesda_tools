      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany the curricula.\n\nCourse Title: HANDLOOM WEAVING (UPRIGHT)\n\nNC Level NC II\n\nNominal Training Duration:\n37 Hours (Basic Competencies)\n\n301 Hours (Common Competencies)\n\n91 Hours (Core Competencies)\n\n429 TOTAL HOURS\n\n80 Supervised Industry Learning (SIL)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills of\nconducting pre-handloom weaving activities, performing upright loom weaving, and conducting\npost-weaving activities.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieve.\n\n--- PDF PAGE 88 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 84\nBASIC COMPETENCIES\n37 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n•\nPrepare different Types of question\n•\nGather different sources 