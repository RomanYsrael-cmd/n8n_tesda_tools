      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the Full National Qualification of Handloom Weaving (Upright) NC II the candidate must demonstrate competence all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 The Qualification of HANDLOOM WEAVING (UPRIGHT) NC II may be acquired through the accumulation of Certificates of Competency (COCs) in the following units of competencies: COC 1 - Conduct pre-handloom weaving activities COC 2 - Perform upright loom weaving COC 3 - Conduct post- weaving activities 4.1.3 Certificates of Competency (COCs) shall be issued to candidates who have been assessed as competent in any of the above COCs (COC 1, COC 2, COC 3). Upon accumulation and submission of all the COCs acquired, an individual shall be issued the corresponding National Certificate for the Handloom Weaving (Upright) NC II. 4.1.4 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency. 4.1.5 Any of the following are qualified to apply for assessment and certification: a. Graduates or graduating students/trainees of WTR-registered program, graduates of NTR-registered programs or formal/non-formal/informal including enterprise-based trainings related to Handloom weaving (Upright). b. Workers with at least 6 months apprenticeship or work experience in Handloom weaving (Upright) or related field (wage employed or self- employed). 4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through competency 4.1.7 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations. It includes the following: a. entry requirements for candidates b. evidence gathering methods c. qualification requirements of competency assessors • Must be a holder of NTTC I (NC + TM1) in Handloom Weaving (Upright) NC II • Must have at least 2 years’ job/industry experience d. specific assessment and certification arrangements as by industry."
    },
