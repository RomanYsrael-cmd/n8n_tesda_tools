  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the Full National Qualification of Handloom Weaving (Upright) NC II\nthe candidate must demonstrate competence all units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.1.2 The Qualification of HANDLOOM WEAVING (UPRIGHT) NC II may be acquired\nthrough the accumulation of Certificates of Competency (COCs) in the following\nunits of competencies:\n\nCOC 1 - Conduct pre-handloom weaving activities\nCOC 2 - Perform upright loom weaving\nCOC 3 - Conduct post- weaving activities\n\n4.1.3 Certificates of Competency (COCs) shall be issued to candidates who have\nbeen assessed as competent in any of the above COCs (COC 1, COC 2, COC\n3). Upon accumulation and submission of all the COCs acquired, an individual\nshall be issued the corresponding National Certificate for the Handloom Weaving\n(Upright) NC II.\n\n4.1.4 Assessment shall cover all competencies with basic and common integrated or\nassessed concurrently with the core units of competency.\n\n4.1.5 Any of the following are qualified to apply for assessment and certification:\n\na. Graduates or graduating students/trainees of WTR-registered program,\ngraduates of NTR-registered programs or formal/non-formal/informal\nincluding enterprise-based trainings related to Handloom weaving (Upright).\n\nb. Workers with at least 6 months apprenticeship or work experience in\nHandloom weaving (Upright) or related field (wage employed or self-\nemployed).\n\n4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences may\napply for recognition in a particular qualification through competency\n\n4.1.7 The industry shall determine assessment and certification requirements for each\nqualification with promulgated Training Regulations. It includes the following:\n\n--- PDF PAGE 119 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 115\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\n• Must be a holder of NTTC I (NC + TM1) in Handloom Weaving (Upright)\nNC II\n• Must have at least 2 years’ job/industry experience\n\nd. specific assessment and certification arrangements as by industry.\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-assessment\ntool to help the candidate and the assessor determine what evidence is\navailable, where gaps exist, including readiness for assessment.\n\nThis document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA\nis authorized to conduct competency assessment. Assessment centers undergo\na quality assured procedure for accreditation before they are authorized by\nTESDA to manage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 120 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 116\n\nSupermarket of Competencies\nSupermarket of Competencies\nCREATIVE Sector\nConduct pre-\nhandloom\nweaving\nactivities\nPerform upright\nloom weaving\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nDevelop\nand update\nindustry\nknowledge\nDevelop creative\nand artistic skills\nand cultural\nawareness\nWork in a team\nenvironment\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\nPractice career\nprofessionalism\n\nPractice occupational health\nand safety procedures\nObserve\nprocedures,\nspecifications and\nmanuals of\ninstructions\nOperate\nequipment\nManage own\nperformance\nMaintain a safe,\nclean and efficient\nwork environment\nProvide and\nmaintain effective\nclient relations\nObserve quality\nsystem\nConduct post-\nweaving\nactivities\n\n--- PDF PAGE 121 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 117\n\nGLOSSARY OF TERMS\n\n1. APRON\nIs a canvas attached to the warp ends to start weaving\n2. APRONING\nIs a process of typing the warp ends to the apron cloth that is\nattached to the cloth beam which start weaving process.\n3. BACK BEAM\n Located above the warp beam. The warp beam passes over\nthis firm support to maintain its tension. A corresponding\nsurface called the breast beam, can be found at the upper front\nof the loom.\n\nAlso known as sambayunan.\n4. BEAMING\nIs to wind the warp onto the warp beam. The layers of warp are\nusually separated with heavy paper or warping sticks.\n5. BEATER\nA frame attached to the loom near the cloth beam to hold the\nreed to beat the weft. It consists of a frame where the reed is\ninserted. The frame's top is removable to allow the easy\ninstallation of different sizes of the reed. When the appropriate\nreed is in place, the beater is used to press the weft\nperpendicularly against the warp and as weaving progress\nagainst the warp and as weaving progresses against the\nwoven cloth. Beaters may either swing from a bar laid\ncrosswise over the loom or from the side beam at the part of\nthe loom.\n6. BEATING /\nJERK\nMeans filling the thread to give firmness on the fabric.\n7. BOBBIN\nIs a fabricated thread / yarn holder made of straw or bamboo\nwhere strands of fiber are winded to form the weft.\n\nAlso known as talinyas (Aklan), kalinyas (Ilocos).\n8. CLOTH BEAM /\nLIKISAN\nHolds the web or the woven fabric that can be found in the\nlower front of the loom. It is a beam directly below the breast\nbeam. The newly woven cloth is wound and stored here.\n9. COUNTERBALA\nNCE LOOM\nAre quiet and have a faster and softer treadling (requiring less\nweight) than jack-type looms.\n10. CROSS STICK\nIs a guide stick inserted to cross on the warp.\n\nAlso known as salidsiran (Aklan), runo (Ilocos).\n11. HEDDLES\nIs a cord with an eye. It carries the ends of the cord to the\nharness. Fabricated thru the use of strings, flat metal or iron.\nThey have end loops where the harnesses and heddle bars\nare inserted in the central eye where the warp is threaded\naccording to the draft or design plan. Heddles lift the individual\nwarp thread during the weaving process so that the desired\npattern may merge.\n12. HEAD ROLLER\nRefers to the round bar placed crosswise at the top of the loom\nand to the parallel bar below it. These roller support the ropes\nwhich keep the hanging in place.\n\nAlso known as ligid-ligid (Aklan).\n13. HEDDLE BARS\nThese are narrow horizontal bars lie below the roller and are\nmuch shorter so they they can be raised or lowered by\npressing the loom's treadles to create a shed or opening on the\n\n--- PDF PAGE 122 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 118\n\nwarp. Heddle bars come in pairs.The upper bars are tied to the\nrollers which the lower bars are attached to the foot treadles\nwith the heddles suspended between the bars. The set of\nharness per loom can range from two to as much as 24. Two-\nharness looms are so called because they have only two set of\nharnesses. In some looms, pairs of heddle frames, instead of\nbars are used to contain the heddles\n14. IN-LAID STICKS\n/ BALILA\nIs a flat wood measured 2.5\" in x 0.25\" in thickness. The length\ndepends on the width of the cloth. It aids the weaver in creating\ndesigns on the woven cloth.\n\nAlso known as balila (Aklan).\n15. LEASE STICKS\nAre sticks that come with a loom. They usually match the loom\nwidth. Lease sticks can be used during the warping process to\nhold the cross\n16. REED / SUYOD\nIt is tool made of very fine vertical equidistant metal strips\nenclosed with in a metal frame. Keep the warp threads neatly\nparallell & evenly spaced. During the weaving process, the\nreed beats the weft into place. Reeds are available in different\ndensities. The densities are determined by the number of dents\nper inch. Although the finished web or cloth cannot exceed the\nwidth of the reed, the fineness or coarness of a fabric is partly\naffected by the size of the reed used and how it is threaded.\n\nAlso known as suyod (Tagalog).\n17. SET-UP\nProcess of something ready to be used\n18. SHUTTLE\nIs a boat-like piece of wood which carries the bobbin with\nknotted fiber and is being thrown back and forth to form the\ndesired cloth.\n\nAlso known as sikuan (Aklan), bartilya (Ilocos).\n19. SLEYING\nPassing the warp through reed.\n20. SPINDLE\nA steel, wire, or coconut midrib stick (kugong) to secure the\nbobbin inside the shuttle. Several bobbins are prepared so that\nweaving may be done continuosly.\n21. SPOOL / SKEIN\nHOLDER\nUsed to substitute a thread spreader when one is dealing with\nlesser quantities of thread. It is wooden block with vertical\npegs projecting from surface. Each cone or skein of thread to\nbe used is placed around a peg. An extra peg, longer than the\nothers, is placed at one end of the block and a screw eye is\nembedded in it.\n22. TREADLE /\nPEDALS\nIt can be made of bamboo tied up to the harness so that the\ntreadle will move up and down to inter-twine with the warp floor\nloom are operated by foot treadles or pedals attached to the\nharnesses this action creates a shed through which the weft is\ndrawn. Being foot controlled the weaver hands can throw and\ncatch\" the weft-filled unhindered. The number of treadles on a\nloom will depend on the number of sent ie-, a 2 harness loo will\nhave 2 treadles.\nAlso known as siknan.\n23. WARPING\nWHEEL/ FRAME\nIs a warping equipment used in preliminary process in\nweaving.\n\n--- PDF PAGE 123 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 119\n\n24. WARP-OUT\nExcess warp.\n25. WARP BEAM\nIt is the beam or bar at the lower back of the loom where the\nunwoven warp threads are stored. It is periodically rotated so\nthat the warp may advance during the weaving process. A\ncorresponding beam, called the cloth beam, can be found at\nthe lower front of the loom, which in turn, holds the web or\nwoven fabric.\n26. WARPING\nIt is the process of winding necessary warp threads to the\nwarping frame.\n27. WEAVING\nHOOK\nLooks like a flattened bamboo or steel similar to broader\nversion of the crochet hook. It is available in different forms\nand sizes. It is used to draw the warp threads through the reed.\n\nAlso known as sleying hook or denting hook.\n\n--- PDF PAGE 124 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 120\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nHandloom Weaving (Upright) NC II\nQualification Code:\nCREHWU220\n\nRevision\nNo.\nDocument\nTypes*\nQualification