      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. Supermarket of Competencies Supermarket of Competencies CREATIVE Sector Conduct pre- handloom weaving activities Perform upright loom weaving CORE COMPETENCIES COMMON COMPETENCIES Develop and update industry knowledge Develop creative and artistic skills and cultural awareness Work in a team environment Participate in workplace communication BASIC COMPETENCIES Practice career professionalism Practice occupational health and safety procedures Observe procedures, specifications and manuals of instructions Operate equipment Manage own performance Maintain a safe, clean and efficient work environment Provide and maintain effective client relations Observe quality system Conduct post- weaving activities"
