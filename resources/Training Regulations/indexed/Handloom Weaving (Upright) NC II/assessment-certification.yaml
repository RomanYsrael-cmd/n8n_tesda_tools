    {
      "number": "1",
      "text": "APRON Is a canvas attached to the warp ends to start weaving"
    },
    {
      "number": "2",
      "text": "APRONING Is a process of typing the warp ends to the apron cloth that is attached to the cloth beam which start weaving process."
    },
    {
      "number": "3",
      "text": "BACK BEAM Located above the warp beam. The warp beam passes over this firm support to maintain its tension. A corresponding surface called the breast beam, can be found at the upper front of the loom. Also known as sambayunan."
    },
    {
      "number": "4",
      "text": "BEAMING Is to wind the warp onto the warp beam. The layers of warp are usually separated with heavy paper or warping sticks."
    },
    {
      "number": "5",
      "text": "BEATER A frame attached to the loom near the cloth beam to hold the reed to beat the weft. It consists of a frame where the reed is inserted. The frame's top is removable to allow the easy installation of different sizes of the reed. When the appropriate reed is in place, the beater is used to press the weft perpendicularly against the warp and as weaving progress against the warp and as weaving progresses against the woven cloth. Beaters may either swing from a bar laid crosswise over the loom or from the side beam at the part of the loom."
    },
    {
