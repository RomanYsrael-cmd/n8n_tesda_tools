  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the Full National Qualification of Handloom Weaving (Upright) NC II\nthe candidate must demonstrate competence all units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.1.2 The Qualification of HANDLOOM WEAVING (UPRIGHT) NC II may be acquired\nthrough the accumulation of Certificates of Competency (COCs) in the following\nunits of competencies:\n\nCOC 1 - Conduct pre-handloom weaving activities\nCOC 2 - Perform upright loom weaving\nCOC 3 - Conduct post- weaving activities\n\n4.1.3 Certificates of Competency (COCs) shall be issued to candidates who have\nbeen assessed as competent in any of the above COCs (COC 1, COC 2, COC\n3). Upon accumulation and submission of all the COCs acquired, an individual\nshall be issued the corresponding National Certificate for the Handloom Weaving\n(Upright) NC II.\n\n4.1.4 Assessment shall cover all competencies with basic and common integrated or\nassessed concurrently with the core units of competency.\n\n4.1.5 Any of the following are qualified to apply for assessment and certification:\n\na. Graduates or graduating students/trainees of WTR-registered program,\ngraduates of NTR-registered programs or formal/non-formal/informal\nincluding enterprise-based trainings related to Handloom weaving (Upright).\n\nb. Workers with at least 6 months apprenticeship or work experience in\nHandloom weaving (Upright) or related field (wage employed or self-\nemployed).\n\n4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences may\napply for recognition in a particular qualification through competency\n\n4.1.7 The industry shall determine assessment and certification requirements for each\nqualification with promulgated Training Regulations. It includes the following:\n\n--- PDF PAGE 119 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 115\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\n• Must be a holder of NTTC I (NC + TM1) in Handloom Weaving (Upright)\nNC II\n• Must have at least 2 years’ job/industry experience\n\nd. specific assessment and certification arrangements as by industry.\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-assessment\ntool to help the candidate and the assessor determine what evidence is\navailable, where gaps exist, including readiness for assessment.\n\nThis document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA\nis authorized to conduct competency assessment. Assessment centers undergo\na quality assured procedure for accreditation before they are authorized by\nTESDA to manage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 120 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 116\n\nSupermarket of Competencies\nSupermarket of Competencies\nCREATIVE Sector\nConduct pre-\nhandloom\nweaving\nactivities\nPerform upright\nloom weaving\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nDevelop\nand update\nindustry\nknowledge\nDevelop creative\nand artistic skills\nand cultural\nawareness\nWork in a team\nenvironment\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\nPractice career\nprofessionalism\n\nPractice occupational health\nand safety procedures\nObserve\nprocedures,\nspecifications and\nmanuals of\ninstructions\nOperate\nequipment\nManage own\nperformance\nMaintain a safe,\nclean and efficient\nwork environment\nProvide and\nmaintain effective\nclient relations\nObserve quality\nsystem\nConduct post-\nweaving\nactivities\n\n--- PDF PAGE 121 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 117\n\n"
