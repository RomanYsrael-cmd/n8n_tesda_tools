place policies\nand procedures.\n2.2 Required OSH\nmaterials, tools and\nequipment are\nacquired in\naccordance with\nworkplace policies\nand procedures.\n2.3 Required OSH\nmaterials, tools and\n2.1 Resources\nnecessary to\nexecute hierarchy\nof controls\n2.2 General OSH\nprinciples\n2.3 Work standards\nand procedures\n2.4 Safe handling\nprocedures of\ntools, equipment\nand materials\n2.5 Different OSH\ncontrol measures\n2.1 Communication\nskills\n2.2 Estimation skills\n2.3 Interpersonal\nskills\n2.4 Critical thinking\nskills\n2.5 Observation\nskills\n2.6 Material, tool and\nequipment\nidentification\nskills\n\n--- PDF PAGE 30 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 26\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nequipment are\narranged/ placed in\naccordance with\nOSH work\nstandards.\n3. Perform tasks in\naccordance with\nrelevant OSH\npolicies and\nprocedures\n3.1 Relevant OSH work\nprocedures are\nidentified in\naccordance with\nworkplace policies\nand procedures.\n3.2 Work Activities are\nexecuted in\naccordance with\nOSH work\nstandards.\n3.3 Non-compliance\nwork activities are\nreported to\nappropriate\npersonnel.\n3.1 OSH work\nstandards\n3.2 Industry related\nwork activities\n3.3 General OSH\nprinciples\n3.4 OSH Violations\nNon-compliance\nwork activities\n3.1 Communication\nskills\n3.2 Interpersonal\nskills\n3.3 Troubleshooting\nskills\n3.4 Critical thinking\nskills\n3.5 Observation\nskills\n\n--- PDF PAGE 31 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Requirements,\nRegulations, Policies and\nProcedures\nMay include:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Permit to Operate\n1.6 Philippine Occupational Safety and Health\nStandards\n1.7 Department Order No.