        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Confirmed job requirement.\n1.1.1 Selected weaving pattern.\n1.1.2 Interpreted pattern.\n1.1.3 Clarified product specification.\n1.1.4 Calculated materials requirements.\n1.1.5 Done documentation of information.\n1.1.6 Completed required output.\n\n1.2 Prepared tools and materials.\n1.2.1 Acquired quality materials.\n1.2.2 Selected and checked tools.\n1.2.3 Conducted minor troubleshooting and repair.\n1.2.4 Completed required output.\n1.2.5 Applied safety practices.\n\n1.3 Performed warping activities.\n1.3.1 Prepared yarns.\n1.3.2 Arranged yarns.\n1.3.3 Applied corrective actions.\n1.3.4 Applied upright loom dressing technique.\n1.3.5 Completed required output.\n1.3.6 Applied safety practices.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Tools, materials, and equipment in conducting pre-\nhandloom weaving activities\n2.2 Manuals and references\n2.3 Actual or simulated workplace\n2.4 PPEs\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration/Direct Observation with Oral questioning\n3.2 Written test\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited institution\n\n--- PDF PAGE 77 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 73\n\nUNIT OF COMPETENCY\n:\nPERFORM UPRIGHT LOOM WEAVING\n\nUNIT CODE\n:"
        },
        "source_text": "CRE731301\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to confirm job requirement, prepare raw\nmaterials\nand\nprepare\ntools,\nmaterials\nand\naccessories.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Confirm job\nrequirement\n1.1 Weaving pattern is\nselected according\nto client’s\nrequirements.\n1.2 Pattern is\ninterpreted based\non established\nindustry practices.\n1.3 Product\nspecification is\nclarified based on\nindustry practice.\n1.4 Materials\nrequirements are\ncalculated based on\nthe work\nrequirement.\n1.5 Documentation of\ninformation is\ndone according to\nindustry practice.\n1.6 Required output is\ncompleted as\nspecified by the\nimmediate\nsupervisor based\non work.\n1.1 Basic weaving\npattern\n1.2 Types of basic\nstructure\n1.3 Calculation of\nneeded materials\n1.4 Interpretation of\ndesign\n1.5 Product\nspecifications\n1.6 Types of\nmaterials\n1.7 Color combination\n1.8 Communication\nskills\n1.9 Factors affecting\nproductivity\n1.10 Productivity work\nmeasurements\n1.11 Ways of\nimproving\nproductivity\n1.12 Adherence to\nwork\nrequirements\n1.1 Communication\nskills\n1.2 Selecting design\n1.3 Interpreting\ndesign\n1.4 Clarifying\nproduct\nspecifications\n1.5 Calculating\nmaterials\nrequirements\n1.6 Following\ninstructions\n1.7 Mathematical\nskills\n2. Prepare tools and\nmaterials\n2.1 Quality materials\nare acquired from\nreliable sources.\n2.2 Tools are selected\nand checked\naccording to work\nrequirements.\n2.3 Minor\ntroubleshooting and\nrepair is conducted\n2.1 Quality materials\n2.2 Types of tools\nand accessories\n2.3 Proper usage of\ntools\n2.4 OSHS\n2.5 Factors affecting\nproductivity\n2.6 Productivity work\nmeasurements\n2.1 Acquiring quality\nmaterials\n2.2 Selecting tools\n2.3 Checking loom\nfunctions\n2.4 Using tools,\nequipment and\naccessories\n2.5 Adjusting loom\nand accessories\n\n--- PDF PAGE 73 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 69\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nfollowing\nestablished industry\nprocedures.\n2.4 Required output is\ncompleted as\nspecified by the\nimmediate\nsupervisor based\non work.\n2.5 Safety practices are\napplied following\nOSHS.\n2.7 Ways of\nimproving\nproductivity\n2.8 Adherence to\nwork\nrequirements\n2.6 Reporting\ndefective loom\n2.7 Conducting\nminor\ntroubleshooting\nand repair\n2.8 Applying safety\npractices\n3. Perform warping\nactivities\n3.1 Yarns are prepared\naccording to\nproduct\nspecifications.\n3.2 Yarns are arranged\nfollowing warping\ntechnique.\n3.3 Corrective actions\nare applied based\non warping\nproblems.\n3.4 Upright loom\ndressing technique\nis applied following\nloom dressing\nprocedures.\n3.5 Required output is\ncompleted as\nspecified by the\nimmediate\nsupervisor based\non work.\n3.6 Safety practices are\napplied following\nOSHS.\n3.1 Warping\nprocedure\n3.2 Loom dressing\nprocedures\n3.3 OSHS\n3.4 Reliable sources\nof materials\n3.5 Warping problems\n3.6 Application of\ncorrective actions\n3.7 Factors affecting\nproductivity\n3.8 Productivity work\nmeasurements\n3.9 Ways of\nimproving\nproductivity\n3.10 Adherence to\nwork\nrequirements\n3.1 Applying\nWarping\nprocedures\n3.2 Performing loom\ndressing\nprocedures\n3.3 Applying safety\npractices\n3.4 Communication\nskills\n3.5 Identifying\nwarping\nproblems\n3.6 Applying\ncorrective\nactions\n\n--- PDF PAGE 74 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 70\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Weaving pattern\nBasic weaving pattern includes:\n1.1 Warp (vertical pattern)\n1.2 Weft (horizontal pattern)\n1.3 Stripes pattern\n1.4 Checkered pattern\n1.5 Color combination\n2. Product Specification\nProduct Specification may include:\n2.1 Color\n2.2 Costing\n2.3 Lead time\n2.4 Measurement\n2.4.1 Width\n2.4.2 Length\n3. Material\nMaterial may include:\n3.1 Cotton\n3.2 Abaca\n3.3 Polyester\n3.4 Pina\n3.5 Fiber-Blends\n3.5.1 Cotton-abaca\n3.5.2 Cotton-pina\n3.5.3 Cotton-water hyacinth\n3.6 Cotton-banana\n4. Information\nInformation may include:\n4.1 Warp ends\n4.2 Material used for weft\n4.3 Type of weave used\n4.4 Weaver\n4.5 Handling of materials\n4.6 Origin of materials\n5. Tools, accessories and\nequipment\nTools, equipment and accessories may include:\nTools:\n5.1 Shuttles\n5.2 Bobbins\n5.3 Bobbin winder\n5.4 Warping device\n-Warping frame\n-Warping board\n-Circular device\n-Sectional warper\n5.5 Scissors\n5.6 Needles\n5.7 Dressmaker pins\n5.8 Ruler\n5.9 Tape measure\n5.10 Marking pen\n5.11 Record book\n\n--- PDF PAGE 75 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 71\nVARIABLE\nRANGE\n\nEquipment:\n5.12 Upright loom\n\nPPEs:\n5.13 Face mask\n5.14 Gloves\n6. Preparation of yarns\nPreparation of yarns includes:\n6.1 Determination of length and width\n6.2 Determination of color combination\n6.3 Number of yarns to be used\n7. Warping problems\nWarping problems may include:\n7.1 Broken warp threads\n7.2 Crossed warp threads\n7.3 Uneven tension\n7.4 Incorrect calculation of warp threads\n8. Loom dressing\nprocedures\nLoom dressing procedures may include:\n8.1 Beaming\n8.2 Drawing-in\n8.3 Denting\n8.4 Tying handloom and loom\n8.5 Trial weaving\n\n--- PDF PAGE 76 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 72\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Confirmed job requirement.\n1.1.1 Selected weaving pattern.\n1.1.2 Interpreted pattern.\n1.1.3 Clarified product specification.\n1.1.4 Calculated materials requirements.\n1.1.5 Done documentation of information.\n1.1.6 Completed required output.\n\n1.2 Prepared tools and materials.\n1.2.1 Acquired quality materials.\n1.2.2 Selected and checked tools.\n1.2.3 Conducted minor troubleshooting and repair.\n1.2.4 Completed required output.\n1.2.5 Applied safety practices.\n\n1.3 Performed warping activities.\n1.3.1 Prepared yarns.\n1.3.2 Arranged yarns.\n1.3.3 Applied corrective actions.\n1.3.4 Applied upright loom dressing technique.\n1.3.5 Completed required output.\n1.3.6 Applied safety practices.\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Tools, materials, and equipment in conducting pre-\nhandloom weaving activities\n2.2 Manuals and references\n2.3 Actual or simulated workplace\n2.4 PPEs\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration/Direct Observation with Oral questioning\n3.2 Written test\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or through an accredited institution\n\n--- PDF PAGE 77 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 73\n\nUNIT OF COMPETENCY\n:\nPERFORM UPRIGHT LOOM WEAVING\n\nUNIT CODE\n:"
