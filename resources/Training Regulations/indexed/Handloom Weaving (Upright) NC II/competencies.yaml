        },
        "source_text": "CRE731207\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge,\nskills and attitudes to maintain a good business\nimage, respond to customer needs and strengthen\nrelations with customers. The unit focuses on\npersonal presentations and providing effective client\nservice.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Maintain a good\nbusiness image\n1.1 Personal presence\nis maintained\naccording to\nemployer\nstandards.\n1.2 Interpersonal\nskills are used to\nidentify customer\nneeds following\nworkplace\nstandards.\n1.3 Work area is kept\ntidy and uncluttered\naccording to\nworkplace\nprocedure.\n1.4 Equipment and\nother resources are\nstored and\norganized\naccording to\nworkplace\nprocedures.\n1.5 Product orientation\nis conducted\naccording to\nindustry practices.\n1.1 Communication\n1.1.1 Interactive\ncommunicat\nion with\nothers\n1.1.2 Interper-\nsonal skills/\nsocial\ngraces with\nsincerity\n1.1.3 Personal\npresence\n1.2 Safety Practices\n1.2.1 Safe work\npractices\n1.2.2 Personal\nhygiene\n1.3 Maintain\nteamwork and\ncooperation\n1.4 5S of Good\nhousekeeping\n1.5 Time\nmanagement\n1.6 IKSP\n1.7 OSHS\n1.8 5Rs\n1.9 Product\norientation\n1.9.1 Heritage\nvalues\n1.10 Attitude\n1.10.1 Attentive,\npatient and\ncordial\n1.10.2 Honest\n1.10.3 Punctual\n1.1 Communication\nskills\n1.2 Maintaining\npersonal\npresence\n1.3 Using\ninterpersonal\nskills\n1.4 Tidying and\nuncluttering work\narea\n1.5 Organizing\nequipment and\nother resources\n1.6 Applying 5S of\nGood\nHousekeeping\n1.7 Applying 5Rs\n1.8 Conducting\nproduct\norientation\n\n--- PDF PAGE 65 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 61\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Respond to\ncustomer needs\n2.1 Customer needs\nare identified\nacco