        "source_text": "CRE731206\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge,\nskills and attitudes to comply with safety and health\nregulations, maintain work area and maintain tools,\nequipment, materials and other resources. This\nincludes competencies needed to maintain clean\nand\nsafe\nworking\nenvironment.\nThe\nunit\nincorporates the work safety guidelines.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Comply with safety\nand health\nregulations\n1.1 Safety and health\nmeasures are\napplied based on\nOSHS.\n1.2 Policies and\nprocedures are\nadapted and\napplied according\nto industry\nstandards.\n1.3 Emergencies are\naddressed following\nworkplace\nprocedures.\n1.4 Work areas are set-\nup and secured\nfollowing safety\nprocedures.\n1.1 Indigenous\nKnowledge\nSystem Practices\n(IKSP) on safety\nand health\n1.1.1 Handling of\nchemicals\n1.2 Geographical\nlocation\n1.3 Traditional PPEs\n1.4 Industrial PPEs\n1.5 Community\nprocedures\n1.6 Workplace\nemergencies\n1.7 Addressing\nworkplace\nemergencies\n1.8 Setting-up and\nsecuring of work\nareas\n1.9 Alternative work\nareas\n1.10 3Rs\n1.11 5S of Good\nHousekeeping\n1.12 OSHS\n1.13 Attitude\n1.13.1 Patience\n1.13.2 Honesty\n1.13.3 Focus on\ndetails\n1.1 Complying with\nIndigenous\nKnowledge\nSystem\nPractices (IKSP)\non safety and\nhealth\n1.2 Handling of\nchemicals\n1.3 Adapting and\napplying policies\nand procedures\n1.4 Setting-up and\nsecuring work\nareas\n1.5 Applying safety\npractices\n1.6 Addressing\nemergencies\n1.7 Identifying\nalternative work\nareas\n2. Maintain work area\n2.1 Attributes of\nconducive\nworking areas are\nchecked following\n2.1 Work Hazards\nPolicies and\nProcedures\n2.1.1 Topogra-\n2.1 Complying with\nhealth and safety\nregulations\n2.2 Checking\n\n--- PDF PAGE 60 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 56\nELEMENT\nPERFORMANCE\nCR