ry\nprocedures.\n4.1 Cultural skilled-\nshared\nknowledge\n4.2 Cultural\nauthorities\n4.1 Identifying and\nselecting\ncommunity\n4.2 Facilitating\ncultural\n\n--- PDF PAGE 46 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 42\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.2 Cultural exchange\nis facilitated\naccording to\nindustry procedure.\n4.3 Community\npractices are\nidentified and\nselected following\nindustry\nprocedures.\n4.4 Cultural\nauthorities are\nconsulted for\ncultural skilled –\nshared knowledge\nbased on\nestablished\nprotocol.\n4.5 Best practice is\napplied based on\napproval of cultural\nauthorities.\n4.6 Adjustments are\napplied based on\nconsultation with\nthe cultural\nauthorities.\n4.7 Documentation is\nperformed based\non the result of\nconsultation.\n4.3 Cultural sensitivity\n4.4 Different\ncommunity\npractices\n4.5 Facilitation\nprocedures\n4.6 Types of cultural\ncommunity\n4.7 Consultation and\napproval\nprocedures\n4.8 Best cultural\npractices\n4.9 Documentation\nprocedure\n4.10 Attitude\n4.10.1 Awareness\non details\n4.10.2 Organized\n4.10.3 Resource-\nfulness\n4.10.4 Patience\n4.10.5 Politeness\n4.10.6\nIndustrious-\nness\n4.10.7 Respect-\nfulness\nexchange\n4.3 Identifying\ncommunity\npractices\n4.4 Consulting\ncultural\nauthorities\n4.5 Applying best\npractices\n4.6 Communication\nskills\n4.7 Documentation\nskills\n\n--- PDF PAGE 47 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 43\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Cultural authorities\nMay include:\n1.1 Cultural masters/ bearers\n1.2 Traditional leaders\n1.3 Traditional elders\n1.4 Cultural Elders\n1.5 Cultural Master\n1.6 Cultural Bearers\n2. Capacitation strategies\nMay include:\n2.1 Training\n2.1.1 Mentoring\n2.1.2 School-based\n2.2 Community immersion\n3. Cultural events\nCultural events may include:\n3.1 Exhibits\n3.2 F