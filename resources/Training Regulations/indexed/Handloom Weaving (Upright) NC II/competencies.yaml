        "source_text": "CRE731203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\non identifying, interpreting, applying services to\nspecifications and manuals and storing manuals.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify and access\nspecification/\nmanuals\n1.1 Manuals are\nidentified and\naccessed as per job\nrequirements.\n1.2 Version and date of\nmanual are\nchecked to ensure\nthat correct\nspecification and\nprocedures are\nidentified.\n1.1 Types of manuals\nused in plumbing\n1.2 Identification of\nsymbols used in\nthe manuals\n1.1 Identifying\nmanuals and\nspecifications\n1.2 Accessing\ninformation and\ndata\n2. Interpret manuals\n2.1 Relevant sections,\nchapters of\nspecifications/\nmanuals are\nlocated in relation\nto the work to be\nconducted.\n2.2 Information and\nprocedure in the\nmanual are\ninterpreted in\naccordance with\nindustry practices.\n2.1 Types of manuals\n2.2 Types of symbols\nused in manuals\n2.3 Systems of\nmeasurements\n2.4 Unit conversion\n2.1 Interpreting\nsymbols and\nspecifications\n2.2 Accessing\ninformation and\ndata\n2.3 Applying\nconversion of\nunits of\nmeasurements\n3. Apply information\nin manual\n3.1 Manual is\ninterpreted\naccording to job\nrequirements.\n3.2 Work steps are\ncorrectly identified\nin accordance with\nmanufacturer's\nspecification.\n3.3 Manual data are\napplied according\nto the given task.\n3.4 All correct\nsequencing and\nadjustments are\ninterpreted in\n3.1 Types of manuals\n3.2 Types and\napplication of\nsymbols in\nmanuals\n3.3 Unit conversion\n3.1 Applying\ninformation from\nmanuals\n\n--- PDF PAGE 50 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 46\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\naccordance with\ninformation\ncontained on the\nmanual or\nspecifications.\n4. Store manuals\n4.1 Manual of\nspecification is\nstored to prevent\ndamage and be\nreadily accessible.\n4.2 Information is\nupdated when\nrequired in\naccordance with\ncompany\nrequirements.\n4.1 Types of manuals\n4.2 Manual storing\nand maintaining\nprocedures\n4.1 Storing and\nmaintaining\nmanuals\n\n--- PDF PAGE 51 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 47\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Manual\nMay include:\n1.1 Printed References (e.g. Books, Handbooks)\n1.2 Manufacturer's Specification Manual\n1.3 Maintenance Procedure Manual\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed specification/manuals as per\njob requirements\n1.2 Interpreted manuals in accordance with industry\npractices\n1.3 Applied information in manuals according to the given\ntask\n1.4 Stored manuals in accordance with company\nrequirements\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 All manuals/catalogues relative to creative – film/\ntheatre industry\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration/ observation with oral questioning\n3.2 Written exam\n3.3 Direct observation\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions.\n\n--- PDF PAGE 52 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 48\n\nUNIT OF COMPETENCY\n:\nOPERATE EQUIPMENT\n\nUNIT CODE\n:"
