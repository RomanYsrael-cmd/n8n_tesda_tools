          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Comply with safety and health regulations\n1.1.1 Applied community procedures on safety and\nhealth\n1.1.2 Adapted and applied policies and procedures\n1.1.3 Addressed emergencies\n1.1.4 Set-up and secured work areas\n1.2 Maintain work area\n1.2.1 Checked attributes of conducive working areas\n1.2.2 Identified and reported repairs\n1.2.3 Stored and disposed waste\n1.2.4 Applied safety practices\n1.3 Check and maintain tools, equipment and resources\n1.3.1 Stored tools, equipment and materials\n1.3.2 Checked tools, and equipment for maintenance\n1.3.3 Monitored and maintained resources\n1.3.4 Referred tools and equipment for repair\n1.3.5 Applied safety practices\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Actual and simulated workplace\n2.2 Materials, tools, and equipment needed to perform the\nrequired task\n2.3 References and manuals\n2.4 PPEs\n2.5 First aid kit\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration/ observation with oral questioning\n3.2 Written exam\n3.3 Oral questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 64 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 60\n\nUNIT OF COMPETENCY\n:\nPROVIDE AND MAINTAIN EFFECTIVE\nCUSTOMER SERVICE\n\nUNIT CODE\n:"
