gy\n2.2 Developing\nreflective\npractice through\nrealization of\nlimitations, likes/\ndislikes; through\n\n--- PDF PAGE 20 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 16\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nteachers to assist\nthem in\nconsolidating\nstrengths,\naddressing\nweaknesses and\nfulfilling their\npotential are\nmonitored.\n2.3 Outcomes of\npersonal and\nacademic\nchallenges by\nreflecting on\nprevious problem\nsolving and\ndecision making\nstrategies and\nfeedback from\npeers and teachers\nare predicted.\nAnalysis,\nConclusion, and\nAction plan)\nshowing of self-\nconfidence\n2.3 Demonstrating\nself-acceptance\nand being able\nto accept\nchallenges\n3. Boost self-\nconfidence and\ndevelop self-\nregulation\n3.1 Efforts for\ncontinuous self-\nimprovement are\ndemonstrated.\n3.2 Counter-productive\ntendencies at work\nare eliminated.\n3.3 Positive outlook in\nlife are maintained.\n3.1 Four components\nof self-regulation\nbased on Self-\nRegulation\nTheory (SRT)\n3.2 Personality\ndevelopment\nconcepts\n3.3 Self-help\nconcepts (e. g., 7\nHabits by\nStephen Covey,\ntransactional\nanalysis, psycho-\nspiritual concepts)\n\n3.1 Performing\neffective\ncommunication\nskills – reading,\nwriting,\nconversing skills\n3.2 Showing\naffective skills –\nflexibility,\nadaptability, etc.\n3.3 Self-assessment\nfor determining\none’s strengths\nand weaknesses\n\n--- PDF PAGE 21 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 17\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Self-management\nstrategies\nMay include:\n1.1 Seeking assistance in the form of job coaching or\nmentoring\n1.2 Continuing dialogue to tackle workplace grievances\n1.3 Collective negotiation/bargaining for better working\nconditions\n1.4 Share your goals to improve with a trusted co-\nworker or supervisor\n1.5 Make a negativity log of every instan