eld.\n1.3.4 Done inventory activities.\n1.3.5 Completed required output.\n\n1.4 Conducted restoration activities.\n1.4.1 Cleaned and stored tools and equipment.\n1.4.2 Stored materials.\n1.4.3 Practiced waste management.\n1.4.4 Restored workplace.\n1.4.5 Completed required output.\n1.4.6 Applied safety practices.\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Workplace location or simulated workplace\n2.2 Materials, Supplies, Tools and Equipment relevant to\nthe unit of competency\n2.2.1 A range of yarns and threads\n2.2.2 A range of quality weaving tools and equipment\n2.3 Technical plans, drawings and specifications relevant\nto the activities\n2.4 Computer hardware and internet\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration/ observation with oral questioning\n3.2 Written exam\n3.3 Oral questioning\n3.4 Direct observation\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 87 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 83"
