        "source_text": "CRE731201\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge,\nskills required to source out information, update\nindustry knowledge and prepare prototype.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Source out\ninformation\n1.1 Sources of\ninformation on the\nindustry are\nidentified and\ncoordinated\naccording to\nindustry\nprocedures.\n1.2 Sources of\ninformation are\naccessed based on\nindustry\nprocedures.\n1.3 Sourced\ninformation are\ndocumented\nbased on industry\nprocedures.\n1.4 Documentation\ntools, materials,\nand equipment are\nprepared and used\nbased on industry\nprocedures.\n1.1 Sources of\nindustry\ninformation\n1.2 Industry\nprocedure\n1.2.1 FPIC (free\nprior inform\nconsent)\n1.2.2 Documen-\ntary require-\nments in\nseeking\ninformation\n1.3 Documentation\nprocedure\n1.4 Types and uses\nof documentation\ntools, materials,\nand equipment\n1.5 Capacity building\non sourcing of\ninformation\n1.6 Safety measures\n1.7 Gender sensitivity\n1.8 Cultural sensitivity\n1.9 Attitude\n1.9.1 Patience\n1.9.2 Resource-\nfulness\n1.9.3 Organized\n1.9.4 Focus on\ndetails\n1.9.5 Polite\n1.1 Sourcing out\ninformation\n1.2 Coordination\nskills\n1.3 Communication\nskills\n1.4 Research skills\n1.5 Documentation\nskills\n1.6 Use and\noperating tools,\nmaterials, and\nequipment\n1.7 Applying safety\nmeasures during\ndocumentation\n2. Update industry\nknowledge\n2.1 Sourced\ninformation are\nused based on\nindustry\nprocedures.\n2.1 Use of sourced\ninformation\n2.2 Documentation\n2.3 Copyright\nprocedures\n2.1 Using and\nsharing sourced\ninformation\n2.2 Documentation\nskills\n\n--- PDF PAGE 41 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 37\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.2 Sourced\ninformation are\nshared to\ncolleagues based\non industry\nprocedures.\n2.3 Documentation is\ndone based on\nindustry\nprocedures.\n2.4 Indigenous\nknowledge\nsystem and\npractices (IKSP)\n2.4.1 Rituals\n2.4.2 Chanting\n2.5 Gender sensitivity\n2.6 Cultural sensitivity\n2.7 OSHS\n2.8 Attitude\n2.8.1 Patience\n2.8.2 Resource-\nfulness\n2.8.3 Organized\n2.8.4 Focus on\ndetails\n2.8.5 Polite\n2.3 Following\ncopyright\nprocedures\n2.4 Practicing IKSP\n2.5 Communication\nskills\n3. Prepare prototype\n3.1 Experimentation is\nperformed based\non sourced\ninformation.\n3.2 Product is improved\nbased on\nexperimental\nfindings.\n3.3 Improved product is\nchecked for quality\nbased on industry\nprocedures.\n3.4 Safety practices are\napplied following\nOSHS\n3.1 Prototyping\n3.2 Experimentation\nprocedures\n3.3 Product\nimprovement\n3.4 Quality checking\n3.5 OSHS\n3.6 Attitude\n3.6.1 Patience\n3.6.2 Resource-\nfulness\n3.6.3 Organized\n3.6.4 Focus on\ndetails\n3.6.5 Polite\n3.1 Preparing\nprototype\n3.2 Conducting\nexperimentation\n3.3 Improving\nproduct\n3.4 Quality checking\n3.5 Applying OSHS\n\n--- PDF PAGE 42 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 38\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sources of information\nMay include:\n1.1 Cultural Elders\n1.2 Cultural Master\n1.3 Cultural Bearers\n1.4 Manuals\n1.5 Personal observation and experience\n1.6 Training\n1.7 Partners\n1.7.1 Local Government Unit (LGU)\n1.7.2 National Government Agencies\n1.7.3 Civil Society Organizations (CSO)\n1.7.4 Academic institutions\n2. Documentation of\nsourced information\nMay include:\n2.1 Photo documentation\n2.2 Preparation of Write-ups\n2.3 Videos documentation\n2.4 Recordings\n2.5 Documenting pattern thru drawing\n2.6 Obtaining sample product\n3. Documentation tools,\nmaterials, and equipment\nMay include:\n3.1 Tools\n3.1.1 Questionnaires\n3.1.2 Survey\n3.2 Materials\n3.2.1 Record book\n3.2.2 Ball pen\n3.3 Equipment\n3.3.1 Video camera\n3.3.2 Mobile phone\n4. Usage o