        },
        "source_text": "CRE731205\n\nUNIT DESCRIPTOR\n:\nThis unit of competency covers the knowledge,\nskills and attitudes to perform planning activities,\nmaintain quality of performance and improve own\nwork. It includes also an effective management of\nown competency to produce quality work.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform planning\nactivities\n1.1 Tasks are listed\naccording to job\nrequirements.\n1.2 Work plans and\nschedules are\nprepared based on\ntasks.\n1.3 Coordination is\napplied based on\nindustry practices.\n1.4 Budgetary\nrequirements are\ncomputed based on\nthe work plans\nand schedules.\n1.1 Different tasks\n1.2 Work plan\n1.3 Budgetary\nrequirements\n1.4 Arithmetic\noperation\n1.5 Geographical\nindicator (GI)\n1.6 IPR\n1.7 Coordination\nprocedure\n1.8 Simple\nbookkeeping\n1.9 Attitude:\n1.9.1 Teamwork\n1.1 Planning and\norganizing work\nloads\n1.2 Listing of tasks\n1.3 Preparing work\nplans schedules\n1.4 Coordination\nskills\n1.5 Computing\nbudgetary\nrequirements\n2. Maintain quality of\nperformance\n2.1 Personal\nperformance is\nmonitored\naccording to\nindustry\nstandards.\n2.2 Advice and\nguidance is\nobtained to\nmaintain industry\nstandards.\n2.3 Guidance from\ncommunity\ncultural\nauthorities is\napplied to maintain\nindustry\nstandards.\n2.4 Specifications from\ncustomers are\nobtained based on\nindustry\nstandards.\n2.1 Indicators of\nappropriate\nperformance for\neach area of\nresponsibility\n2.2 Steps for\nimproving or\nmaintaining\nperformance\n2.3 Industry\nstandards\n2.4 IKSP\n2.5 Community\ncultural\nauthorities\n2.6 Procedural\nchecklist\n2.7 Specifications\nfrom customers\n2.8 Attitude:\n2.8.1 Time\nconscious-\nness\n2.8.2 Attention to\n2.1 Monitoring\npersonal\nperformance\n2.2 Obtaining advice\nand guidance\n2.3 Following\nguidance of\ncultural\nauthorities\n2.4 Applying\nprocedural\nchecklist\n2.5 Obtaining\nspecifications\n\n--- PDF PAGE 56 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 52\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ndetails\n2.8.3 Resource-\nfulness\n3. Improve own work\n3.1 Actual work output\nis assessed in\nrelation to work\nplan and\nschedules.\n3.2 Work expenses are\ncomputed against\nbudget.\n3.3 Feedback is\nobtained from\ncustomer based on\njob requirements.\n3.4 Improvement is\ndone according to\nfeedback.\n3.1 Quality control\n3.2 Work plan and\nschedules\n3.3 Computation of\nwork expenses\n3.4 Customer\nfeedback\n3.5 Arithmetic\noperation\n3.6 IKSP\n3.7 Attitude\n3.7.1 Time\nconscious-\nness\n3.7.2 Attention to\ndetails\n3.7.3 Resource-\nfulness\n3.7.4 Patience\n3.7.5 Honesty\n3.1 Assessing actual\nwork output\n3.2 Computation\nskills\n3.3 Obtaining\ncustomer\nfeedback\n3.4 Applying\nimprovements\n\n--- PDF PAGE 57 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 53\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\nMay include:\n1.1 Acquire tools, materials and equipment\n1.2 Set-up equipment\n1.3 Select basic designs\n1.4 Prepare prototype\n1.5 Identify production target\n1.6 Identify timelines\n1.7 Conduct mass production\n1.8 Package products\n1.9 Conduct quality control\n1.10 Perform marketing\n1.11 Prepare inventory\n2. Work plans and\nschedules\nMay include\n2.1 Production schedule\n2.2 Milestone and delivery dates\n3. Industry standards\nMay include:\n3.1 Application of techniques\n3.2 Choosing raw materials\n3.3 Following the designs\n3.4 Observation of product sizes\n3.5 Durability of products\n3.6 Costing\n4. Community cultural\nauthorities\nMay include:\n4.1 Cultural Elders\n4.2 Cultural Master\n4.3 Cultural Bearers\n5. Customer\nMay include:\n5.1 Client\n5.2 Peer\n5.3 Team leader\n\n--- PDF PAGE 58 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 54\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Perform planning activities\n1.1.1 Listed tasks of job requirements\n1.1.2 Prepared work plans and schedules\n1.1.3 Computed budgetary requirements\n1.2 Maintain quality of performance.\n1.2.1 Monitored personal performance.\n1.2.2 Obtained advice and guidance.\n1.2.3 Applied guidance from community cultural\nauthorities\n1.3 Improve own work\n1.3.1 Assessed Actual work output in relation to work\nplan and schedules.\n1.3.2 Computed work expenses against budget.\n1.3.3 Carried-out improvement\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Actual and simulated workplace\n2.2 Materials, tools, and equipment needed to perform the\nrequired task\n2.3 References and manuals\n2.4 PPEs\n2.5 First aid kit\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration/ observation with oral questioning\n3.2 Written exam\n3.3 Portfolio (work plan and schedules) with interview\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 59 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 55\n\nUNIT OF COMPETENCY\n:\nMAINTAIN A SAFE, CLEAN AND EFFICIENT\nWORK ENVIRONMENT\n\nUNIT CODE\n:"
