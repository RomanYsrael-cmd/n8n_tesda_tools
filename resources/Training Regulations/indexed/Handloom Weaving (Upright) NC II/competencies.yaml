        "source_text": "CRE731302\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to perform basic upright loom weaving.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare loom\nweaving machine\nand workplace\n1.1 Workplace is\nprepared according\nto work procedures.\n1.2 Safety measure is\napplied based on\nOSHS.\n1.3 Loom parts and\naccessories are\nchecked based on\nestablished industry\nprocedure.\n1.4 Loom parts and\naccessories are\nadjusted based on\nestablished industry\nprocedure.\n1.5 Defective loom\nparts are reported\nto immediate\nauthority based on\nestablished industry\nprocedure.\n1.6 Upright loom\nweaving machine\nis set up following\nindustry procedures\nand manuals.\n1.7 Required output is\ncompleted as\nspecified by the\nimmediate\nsupervisor based\non work.\n1.1 Systems of\nmeasurements\n1.2 Unit conversion\n1.3 Standard\noperating\nprocedures prior\nto weaving\n1.4 OSHS principles\nand\nresponsibilities\n1.5 Loom Parts and\nits functions\n1.6 Adjustment\nprocedures\n1.7 Loom defects\n1.8 Minor\ntroubleshooting\nand repair of\nhandloom\n1.10 Factors affecting\nproductivity\n1.11 Productivity work\nmeasurements\n1.12 Ways of\nimproving\nproductivity\n1.13 Adherence to\nwork\nrequirements\n1.1 Exhibiting\neffective\ncommunication\nskills for\ndocumentation of\nprocesses\n1.2 Following\nworkplace\ninstructions\n1.3 Applying proper\nmaterial usage\n1.4 Checking loom\nfunctions\n1.5 Using tools,\nequipment and\naccessories\n1.6 Adjusting loom\nand accessories\n1.7 Reporting\ndefective loom\n1.8 Conducting\nminor\ntroubleshooting\nand repair\n2. Weave textile\n2.1 Woven textile is\nproduced according\nto upright loom\nweaving\nprocedures.\n2.2 On-the-loom\ninspection is\nperformed following\nstandard\nprocedures.\n2.1 Standard\noperating\nprocedures for\nhand loom\nweaving\n2.2 Quality criteria for\nhandwoven\ntextiles\n2.3 On-the-loom\nweaving\n2.1 Performing basic\nweaving\noperations on a\nhand loom\n2.2 Maintaining\nOSHS all\nthroughout the\nweaving process\n2.3 Maintaining own\nwork-quality\n\n--- PDF PAGE 78 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 74\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.3 Rectification of\nweaving is applied\nfollowing industry\nprocedures.\n2.4 Required output is\ncompleted as\nspecified by the\nimmediate\nsupervisor based\non work.\ncorrective\ntechniques\n2.4 OSHS principles\nand\nresponsibilities\n2.5 Factors affecting\nproductivity\n2.6 Productivity work\nmeasurements\n2.7 Ways of\nimproving\nproductivity\n2.8 Adherence to\nwork\nrequirements\n3. Complete upright\nloom weaving\n3.1 Off-the-loom\ninspection is\nperformed following\nstandard\nprocedures.\n3.2 Finishing of fabric is\napplied based on\nestablished\ntechniques.\n3.3 Woven textile is\nclassified\naccording to\nindustry criteria.\n3.4 Required output is\ncompleted as\nspecified by the\nimmediate\nsupervisor based\non work.\n3.1 Standard\noperating\nprocedures for\nfinishing\nhandwoven\ntextiles\n3.2 Factors affecting\nproductivity\n3.3 Productivity work\nmeasurements\n3.4 Ways of\nimproving\nproductivity\n3.5 Adherence to\nwork\nrequirements\n3.1 Performing\nquality\nassessment\npractices\n3.2 Housekeeping\n3.3 Time\nManagement\n\n--- PDF PAGE 79 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 75\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\nMay include:\n1.1 Team members\n1.2 Supervisor/Department Head\n1.3 Suppliers\n1.4 Trade personnel\n1.5 Local government\n1.6 Industry bodies\n2. Material\nMay include but not limited to:\n2.1 Cotton\n2.2 Abaca\n2.3 Polyester\n2.4 Pina\n2.5 Fiber-Blends\n2.5.1 Cotton-abaca\n2.5.2 Cotton-pina\n2.5.3 Cotton-water hyacinth\n2.6 Cotton-banana\n3. Tools and equipment,\naccessories\nMay include:\nTools:\n3.1 Shuttles\n3.2 Bobbin\n3.3 Weaving hook\n3.4 Lease sticks\n3.5 Bobbin winder\n3.6 Warping frame\n3.7 Warp rods\n3.8 Cloth rod\n3.9 Heddles\n3.10 Dowels\n\nEquipment:\n3.11 Upright loom\n\nAccessories:\n3.12 Weaving hook\n3.13 Reed\n3.14 Lease sticks\n3.15 Cloth rod\n3.16 Heddles\n3.17 Dowels\n3.18 Warp rod\n4. Documentation\nMay include:\n4.1 Materials used for warp\n4.2 Material used for weft\n4.3 Type of weave used\n4.4 Weaver\n4.5 Handling of the materials\n4.6 Origin of material\n\n--- PDF PAGE 80 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 76\nVARIABLE\nRANGE\n5. Upright loom weaving\nmachine\nMay include:\n5.1 Jack type loom\n5.2 Counter balance loom\n6. Established techniques\nMay include:\n6.1 Fringing\n6.2 Hand Sewing\n6.3 Machine Sewing\n6.4 Trimming\n7. Classification of woven\ntextile\nMay include:\n\n7.1 Class A\n7.1.1 Consistency in density of weave\n7.1.2 Premium weave\n\n7.2 Class B\n7.2.1 Less density of weave\n7.2.2 Regular weave\n\n--- PDF PAGE 81 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 77\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared loom weaving machine and workplace.\n1.1.1 Prepared workplace.\n1.1.2 Applied safety measure.\n1.1.3 Checked loom parts and accessories.\n1.1.4 Adjusted loom parts and accessories.\n1.1.5 Reported defective loom parts.\n1.1.6 Set-up upright loom weaving machine.\n1.1.7 Completed required output.\n\n1.2 Weaved textile.\n1.2.1 Produced woven textile.\n1.2.2 Performed on-the-loom inspection.\n1.2.3 Applied rectification of weaving.\n1.2.4 Completed required output.\n\n1.3 Completed upright loom weaving.\n1.3.1 Performed off-the-loom inspection.\n1.3.2 Applied finishing of fabric.\n1.3.3 Classified woven textile.\n1.3.4 Completed required output.\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1 Tools, materials, and equipment in conducting pre-\nhandloom weaving activities.\n2.2 Manuals and references.\n2.3 Actual or simulated workplace.\n2.4 PPEs.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration/ observation with oral questioning\n3.2 Written exam\n3.3 Oral questioning\n3.4 Direct observation\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 82 ---\nTR - Handloom Weaving (Upright) NC II Revision 00 Promulgated (02/18/2020) 78\n\nUNIT OF COMPETENCY\n:\nCONDUCT POST-WEAVING ACTIVITIES\n\nUNIT CODE\n:"
