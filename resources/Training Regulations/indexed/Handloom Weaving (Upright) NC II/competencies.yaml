        "source_text": "CRE731202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired\nto\nplan\nfor\nthe\nactivities,\nconduct\ncapacitation activity, conduct cultural awareness\nactivity and perform benchmarking. It also includes\ncompetency required to exhibit professional practice\nthat describes development of creative, artistic and\nconceptual skills required to work as a practicing\nartist. It also deals with communicating effectively\nand working strategically to achieve planned\noutcomes as an artist.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan for the\nactivities\n1.1 Information on\ncultural skills and\npractices is\naccessed and used.\n1.2 Areas for\nimprovement are\nidentified based on\ngathered\ninformation.\n1.3 Action plan is\nprepared based on\nconsultation.\n1.4 Consultation is\nmade with cultural\nauthorities.\n1.5 Artistic skills group\nare formed.\n1.1 Intervention\nprocedures\n1.2 Cultural skills and\npractices\n1.3 Action plan\n1.4 Consultation\nprocedures\n1.4.1 IKSP\n1.4.2 FPIC\n1.5 Cultural\nauthorities\n1.6 Artistic skills\ngroup\n1.7 Cultural mapping\nand profiling\n1.8 Attitude\n1.8.1 Patience\n1.8.2 Organized\n1.8.3 Time\nconscious\n1.8.4 Resource-\nfulness\n1.8.5 Focused\n1.1 Accessing and\nusing information\non cultural skills\n1.2 Identifying areas\nof improvement\n1.3 Preparing action\nplan\n1.4 Conducting\nconsultation\n1.5 Conducting\ncultural mapping\nand profiling\n2. Conduct\ncapacitation\nactivity\n2.1 Training and\nspecialization is\nselected with\nreference to\nimprovement area.\n2.2 Capacitation\nstrategies are\napplied based on\nindustry\nprocedures.\n2.1 Types and\nprocedures of\ncapacitation\nstrategies\n2.2 Types of training\nand specialization\n2.3 Administrative\nrequirements\n2.4 Preparation\nprocedures\n2.1 Selecting training\nand\nspecialization\n2.2 Applying\ncapacitation\nstrategies