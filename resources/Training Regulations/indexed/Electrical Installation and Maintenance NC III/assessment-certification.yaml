    {
      "number": "4.1",
      "text": "1. To attain the National Qualification of Electrical Installation and Maintenance NC III, the candidate must demonstrate competence in all units listed in Section 1. Successful candidates shall be awarded a National Certificate III signed by the TESDA Director General."
    },
    {
      "number": "4.1",
      "text": "2. The qualification of Electrical Installation & Maintenance NC III can be attained through demonstration of competence through project-type assessment covering all the required units of the qualification."
    },
    {
      "number": "4.1",
      "text": "3. Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "number": "4.1",
      "text": "4. The following are qualified to apply for assessment and certification: (1) Graduates of formal, non-formal and informal including enterprise- based education/training programs/courses (2) Experienced Workers (wage-employed or self-employed)"
    },
    {
      "number": "4.1",
      "text": "5. For those holders of existing National Certificate (NC) of individuals in Electrical Installation and Maintenance NC III, automatic conversion will be implemented."
    },
    {
      "number": "4.1",
      "text": "6. Clustering of competencies is not applicable."
    },
    {
      "number": "4.1",
      "text": "7. Individuals who already possess Certificate of Competency (COC) in Electrical Installation and Maintenance NC III are advised to take the NC assessment for this amended TR upon expiration of their COCs."
    },
