orks\n• Demonstration\n• Modular (self-\n paced)\n• Lecture/\n• Discussion\n• Audio Visual\n• Practical\nLaboratory\n\n• Direct\nobservation of\napplication of\ntasks\n• Oral\nquestioning\n• Written test or\nexamination\n• Demonstration\n 16 Hrs\n1.4 Notify\ncompletion\nof work\n\n• Read and familiarize:\no Processes, Operations Systems\n\nMaintenance of tools & materials\n\nStorage of tools\n• Check and conform the installation procedures\nbased on job requirement\n• Practice good housekeeping\n• Perform commissioning activities\n•Document work\n•\nDemonstration\n•\nModular (self-\npaced)\n•\nLecture/\nDiscussion\n•\nPractical\nLaboratory\n\n•\nDirect\nobservation of\napplication of\ntask\n•\nWritten Test\n•\nOral\nquestioning\n•\nDemonstration\n4 Hrs.\n2. Perform\ninstallation of\ndata\nmeasurement\nand control\nsystem on\nelectrical and\nauxiliary\nequipment\n2.1 Plan and\nprepare\nworks\n\n• Read and familiarized:\no Type and specification of the needed devices.\no Function and the used of power supply of data\nmeasurement system and auxiliary equipment.\n• Identify the tools and materials according to the\njob requirements\n• Interpret plans & detail drawing\n• Practice proper handling of materials, tools and\nequipment\n• Demonstration\n• Modular (self-\npaced)\n• Lecture/\nDiscussion\n• Audio Visual\n• Practical\nLaboratory\n\n• Direct\n• Observation\n• Written Test\n• Demonstration\n• Oral questioning\n\n4 Hrs\n\n--- PDF PAGE 77 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 73\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Check and quantify item as needed in the job\nrequirement\n• Apply active and non-active test to ensure functionality.\n\n1.2 Install\nelectrical\nsystem and\nauxiliary\nequipment\n\n• Follow procedure on installation of auxiliary\nequipment.\n• Apply proper usage of power tools and equipment in\nan installation.\n• Identify types and usage of auxiliary equipment\n• Practice proper usage of safety harness.\n• Perform splicing, dressing and harnessing of wires.\n• Perform termination and mounting of devices.\n• Perform the installation economically\n• Demonstration\n• Modular (self-\npaced)\n• Lecture/\nDiscussion\n• Audio Visual\n• Practical\nLaboratory\n\n• Direct\nobservation\n• Written test or\nexamination\n• Third party\nreport\n• Demonstration\nwith oral\nquestioning\n16 Hrs.\n\n1.3 Notify\ncompletion\nof work\n\n• Read and familiarize:\no Processes, Operations Systems\n\nMaintenance of tools & materials\n\nStorage of tools\n• Check and conform the installation procedures\nbased on job requirement\n• Practice good housekeeping\n• Perform commissioning activities\n•Document work\n• Demonstration\n• Modular (self-\npaced)\n• Lecture/\nDiscussion\n• Practical\nLaboratory\n\n• Direct\nobservation of\napplication of\ntask\n• Demonstration\n• Oral questioning\n\n4 hrs\n\n3. Install,\nassemble,\ntest and\nmaintain\nmotor control\nsystem\n\n3.1 Check/\nReview type\nand purpose\nof motor\ncontrol\nsystem\n\n• Interpret electrical drawing and wiring diagram.\n• Read and familiarize:\no Function of every devices used in the line/ job\nrequirements.\no Motor specification for the seclection of control\ndevices.\no Type of motor control components & wiring\ndevices\no NEMA Standard in mounting of MCC.\n• Demonstration\n• Modular (self-\npaced)\n• Lecture/\nDiscussion\n• Practical\nLaboratory\n\n• Direct\nobservation\n• Written test or\nexamination\n• Third party\nreport\n• Demonstration\nwith oral\nquestioning\n4 Hrs\n\n--- PDF PAGE 78 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 74\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Check and quantify the item needed in the job\nrequirement.\n• Check the required rating based on its specification\nin accordance with standard.\n\n3.2 Install and\nassemble\nmotor\ncontrol\nsystem\n• Read and familiarize:\no Lay-out and dimension of electrical drawing or\nwiring diagram.\no Uses and functions of Electrical motor control\ndevices\no Types and operation of motor control system.\no Types and uses of termination either point to\npoint termination or terminal strip.\no Proper terminal conection of motor leads outs.\n• Interpret electrical wiring diagram of motor control\nsystem\n• Perform wiring-up on the required electrical control\nbased on the standard.\n• Perform procedures in connection and termination of\nmotor terminal leads out and control devices.\n• Perform checking for continuity test or ohmmeter\ntest of motor terminal.\n• Perform the installation economically.\n• Demonstration\n• Modular (self-\npaced)\n• Lecture/\nDiscussion\n• Practical\nLaboratory\n• Direct\nobservation of\napplication of\ntasks.\n• Oral questioning\n• Written test or\nexamination\n• Third party\nreport\n• Demonstration\n\n16 Hrs\n\n3.3 Notify\ncompletion\nof work\n• Condut performance testing for motor control system\n• Observe environmental requirements on waste\nmanagement\n• Apply 5’S principles\n• Practice good housekeeping\n• Perform commissioning activities\n• Demonstration\n• Modular (self-\npaced)\n• Lecture/\nDiscussion\n• Practical\nLaboratory\n• Direct\nobservation\n• Written test\n• Third party\nreport\n• Demonstration\nwith oral\nquestioning\n\n4 Hrs.\n\n--- PDF PAGE 79 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 75\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.4 Maintain\nelectrical\nmotor\ncontrol\nsystem\n• Obseve safety practices in the use of PPE, handling\nof tools, instrument and equipment.\n• Practice good housekeeping of materials, tools and\nequipment\n• Identify types and uses of lubricants and cleaning\nmaterials\n• Apply methods, techniques and procedures in\nmaintenance of motor control system\n• Practice proper handling of tools, instrument and\nequipment.\n• Schedule and perform preventive maintenance\n• Perform basic troubleshooting skills\n• Identify failures or defects\n• Implement corrective and preventive actions based\non root cause of trouble.\n• Demonstration\n• Modular (self-\npaced)\n• Lecture/\nDiscussion\n• Practical\nLaboratory\n• Direct\nobservation of\napplication of\ntasks.\n• Oral questioning\n• Written test or\nexamination\n• Third party\nreport\n• Demonstration\n\n12 Hrs\n\n--- PDF PAGE 80 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 76",
