          "source_text": "VARIABLE  \n \nRANGE \n \n1. Wiring diagrams \n1.1   Power circuit \n1.2   Control circuit \n2. Motor control components \n& wiring devices \n \n \nMay include but are not limited to: \n2.1     Circuit breakers/Fuses \n2.2     Magnetic Contactors \n2.3     Overload heater \n2.4     Power Cabinet or MCC \n2.5     Power and Timers Relays \n2.6     Terminal Blocks/Lugs \n2.7     Pilot lamps and Buzzer \n2.8     Actuators \n2.9     Push buttons \n2.10  Selector Switches \n2.11  Cable duct \n2.12  Din rail \n2.13  Wire Strap \n2.14  Wire Markers \n2.15  Cable Tie \n2.16  Tie Mount \n2.17  Cable Glands/Grommet \n2.18  Automotive wires/Conductors \n2.19  Insulators \n3. Degree of Protection \n3.1   Nema Standards \n-   Nema 1 \n-   Nema 2 \n-   Nema 3/3R \n-   Nema 4/4x \n-   Nema 6 \n-   Nema 11 \n-   Nema 12 \n3.2   IEC Standards \n-  International Protection (IP) \n3.3    Bureau of Product Standards (BPS) \n4. Tools, equipment & testing \ninstruments \nMay include but are not limited to: \n4.1   Tools \n-  Pliers \n-  Screw drivers \n-  Wrenches \n-  Wire splicers/strippers \n-  Electrician knives \n-  Electric Hand drill \n-  Hand or electric taping/threading \n-  Hack saw \n-  File \n-  Manual/Hydraulic puncher \n-  Measuring tools (e.g. Push-pull meter)\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              51 \nVARIABLE  \n \nRANGE \n \n \n-  Crimping tools \n-  Soldering tools \n-  Manual/Hydraulic pipe bender \n-  Manual/Electrical Pipe Threader/Reamer \n-  High-speed cutter \n \n4.2    Testing Instruments \n-  Multi-tester \n-  Clamp ammeter \n-  Insulation resistance tester \n-  Ground resistance tester \n-  Earth leakage tester \n-  Harmonic meter \n-  Phase Sequence Tester \n4.3   Three-Phase Motor \n         -  SCRIM \n         -  WRIM \n         - Synchronous Motor \n4.4   Single Phase Motor \n \n5. Personal protective \nequipment (PPE) \n \n \nMay include but are not limited to: \n5.1   Proper working clothes \n5.2   Working gloves \n5.3   Safety shoes \n5.4   Gas/Dust mask \n5.5   Hard hat \n5.6   Safety goggles \n6. Specifications \n6.1   Brand/Make \n-  Classification/Type \n6.2   Rating \n-  Voltage \n-  Current \n-  Power \n-  Frequency \n-  Temperature Rise \n-  Service factor \n-  Degree of protection \n-  Utilization category \n-  Harmonics \n6.3   Phase \n6.4   Range (Tools must be specific) \n6.5   Needed accessories \n7. PEC standard and \nrequirements \n7.1   Splicing and joining of electrical conductor \n7.2   Soldering electrical conductors \n7.3   Solderless electrical connectors \n7.4   Creepage distances \n7.5   Clearances\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              52 \nVARIABLE  \n \nRANGE \n \n8. Preliminary Check/Tests \nMay include but are not limited to: \n8.1   Mechanical  \n-  Board/Panel properly leveled \n-  Doors can be opened/closed with ease. Paint \nnot easily scratched/removed \n-  Tightness of bolts and nuts \n-  Type of protection \n-  Cleanliness \n-  Cable trays \n8.2   Electrical  \n-  Conductor size or Cross-section \n-  Conductor Color Coding \n-  Cables laid to avoid risk of short circuit \n-  Grounding busbar conductor \n-  Voltage Clearances/Creepage Distances \n-  Control Voltage \n-  High Voltage Test \n-  Insulation Test \n-  Continuity Test/Contact Resistance Test \n- Correct use of wire markers & terminals\n9. Performance Tests \n9.1   Simulation Test/No Load Test \n9.2   Phase sequence \n9.3   Actual Operation \n9.4   Temperature rise \n9.5   Insulation Resistance Test \n \n10. Materials \n \n \n \n \n \n \n \n \n \n \n \n \nMay include but not limited to: \n10.1 Contact cleaner \n10.2 Insulating varnish/materials \n10.3 Carbon brushes \n10.4 Sand paper \n10.5 Waste rugs \n10.6 Electrical tapes \n10.7 Warning tags \n10.8 Signages \n10.9 Lockout/tagout \n10.10 Lubricants \n10.11 Motor cleaner \n10.12 Insulating oil \n10.13 Coolant\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              53 \nVARIABLE  \n \nRANGE \n \n11. Tools, equipment and \ntesting devices \nIncluding but not limited to: \n11.1 Electrician’s hand tools  \n-   Pliers  \n-   Screwdrivers  \n-   Wrenches  \n-   Wire splicers \n-   Knives \n-   Bolt/Cable cutter \n-   Knockout puncher \n-   Torque wrench \n11.2 Testing instruments/devices  \n-   Multi-tester (VOM) \n-   Insulation resistance tester (Megger) \n-   High potential tester \n-   Low resistance tester \n-   Phase sequence meter \n-   Ammeter \n-   Torque meter \n11.3 Equipment \n-   Labeling machine \n-   Vacuum cleaner \n-   Air blower \n-   Dryer \n-   Welding machine \n-   Pressure washer \n- Vacuum pump\n12. Personal protective \nequipment (PPE) \nIncluding but not limited to: \n12.1 Working gloves \n12.2 Safety shoes \n12.3 Hard hat \n12.4 Face shield \n12.5 Insulating mat \n12.6 Lockout tags \n12.7 Safety goggles \n12.8 Safety belt \n12.1\nSafety ladder\n13. Potential hazards \nIncluding but not limited to: \n13.1 Live wires \n13.2 Oil spill \n13.3 Chemical hazards \n13.4 Flammable materials \n13.5 Sources of energy \n13.6 Moving machine parts \n13.7 Sharp/pointed objects  \n13.8 Noise hazards \n13.9\nConfined space\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              54 \nVARIABLE  \n \nRANGE \n \n14. Maintenance records \n \n \n \n \n \n \n \n \n \n \n \n \nMay include but are not limited to: \n14.1 Electrical plans \n14.2 Equipment electrical diagrams \n14.3 Historical records \n-   Job orders \n-   Commissioning test record \n-   Preventive Maintenance schedules \n-   Corrective Maintenance records \n-   Manufacturer’s maintenance guides \n-   Equipment breakdown records \n-   Periodic monitoring data \n-   Service reports \n14.4 Log book \n15. Quality Management \nSystem \n15.1 ISO 9001 \n15.2 QS 9000 \n15.3 TS 16949 \n15.4 ISO 14000 \n15.5 ISO14001\n\n--- PDF PAGE 59 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              55"
