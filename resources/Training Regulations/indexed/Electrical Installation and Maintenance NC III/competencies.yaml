        "source_text": "ELC311212\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on checking\ncondition, performing preventive maintenance and storing of\ntools and equipment based on the required performance\nstandards.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Check condition\nof tools and\nequipment\n\n1.1 Materials, tools and\nequipment are identified\naccording to classification\nand job requirements\n1.2 Non-functional tools and\nequipment are\nsegregated and labeled\naccording to classification\n1.3 Safety of tools and\nequipment are observed in\naccordance with\nmanufacturer's instructions\n1.4 Condition of PPE are\nchecked in accordance\nwith manufacturer's\ninstructions\n• Safety Practices\no Use of PPE\no Handling of tools\nand equipment\no Good\nhousekeeping\n• Materials, Tools and\nEquipment\no Types and uses of\nlubricants\no Types and uses of\ncleaning materials\no Types and uses of\nplumbing tools\no Types and uses of\nplumbing\nequipment\n• Operational conditions\nof electrical tools and\nequipment\n• Electrical tools and\nequipment defects\n• Maintaining\ntools and\nequipment\n• Handling of\ntools and\nequipment\n• Identifying\ntools and\nequipment\ndefects\n\n2. Perform basic\npreventive\nmaintenance\n2.1 Appropriate lubricants are\nidentified according to\ntypes of equipment\n2.2 Tools and equipment are\nlubricated according to\npreventive maintenance\nschedule or manufacturer's\nspecifications\n2.3 Measuring instruments are\nchecked and calibrated in\naccordance with\nmanufacturer’s instructions\n2.4 Tools are cleaned and\nlubricated according to\nstandard procedures\n2.5 Defective instruments,\nequipment and accessories\nare inspected and replaced\naccording to manufacturer’s\nspecifications\n• Safety Practices\no Use of PPE\no Handling of tools\nand equipment\no Good\nhousekeeping\n• Materials, Tools and\nEquipment\no Types and uses of\nlubricants\no Types and uses of\ncleaning materials\n• Preventive\nMaintenance\no Methods and\ntechniques\no Procedures\n\n• Handling of\ntools and\nequipment\n• Performing\npreventive\nmaintenance\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 37\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n2.6 Tools are inspected,\nrepaired and replaced after\nuse\n2.7 Work place is cleaned and\nkept in safe state in line with\nOHSA regulations\n\n3. Store tools and\nequipment\n\n3.1 Inventory of tools,\ninstruments and equipment\nare conducted and\nrecorded as per company\npractices\n3.2 Tools and equipment are\nstored safely in\nappropriate locations in\naccordance with\nmanufacturer's\nspecifications or company\n procedures\n\n• Safety Practices\no Use of PPE\no Handling of tools\nand equipment\no Storing procedures\nand techniques\no Storage\nconditions/\nlocations\n\n• Storing tools\nand equipment\n• Handling of\ntools and\nequipment\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 38\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Materials\nIncluding but not limited to:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n2. Tools and equipment\n\nIncluding but not limited to:\n2.1 Tools\n-\nCutting tools - hacksaw, crosscut saw, rip saw\n-\nBoring tools - auger, brace, grinlet, hand drill\n-\nHolding tools - vise grip, C-clamp, bench vise\n-\nThreading tools - die and stock, taps\n2.2 Measuring instruments/equipment\n\n3. PPE\n\nIncluding but not limited to:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Aprons/Coveralls\n\n4. Forms\n\n4.1 Maintenance schedule forms\n4.2 Requisition slip\n4.3 Inventory Form\n4.4 Inspection Form\n4.5 Procedures\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 39\n\n EVIDENCE GUIDE\n\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.2 Identified functional and non-functional tools and\nequipment\n1.3 Checked, lubricated and calibrated tools, equipment\nand instruments according to manufacturer’s\nspecifications\n1.4 Replaced defective tools, equipment and their\naccessories\n1.5 Observed and applied safe handling of tools and\nequipment and safety work practices\n1.6 Prepared and submitted inventory report, where\napplicable\n1.7 Maintained workplace in accordance with OHSA\nregulations\n1.8 Stored tools and equipment safely in appropriate\nlocations and in accordance with company practices\n2. Resource implications\nThe following resources should be provided:\n2.1 Workplace\n2.2 Maintenance schedule\n2.3 Maintenance materials, tools and equipment relevant\nto the proposed activity/task\n3. Methods of assessment\nCompetency should be assessed through:\n3.1 Direct observation\n3.2 Written test/questioning relevant to\nUnderpinning knowledge\n4. Context of assessment\n4.1 Competency assessment may occur in workplace\nor any appropriate simulated environment\n4.2 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 40\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM ROUGHING-IN AND WIRING ACTIVITIES\nFOR THREE-PHASE DISTRIBUTION SYSTEM FOR\nPOWER, LIGHTING AND MOTOR CONTROL PANEL\n\nUNIT CODE :"
