        "source_title": "PERFORM ROUGHING-IN AND WIRING ACTIVITIES FOR THREE-PHASE DISTRIBUTION SYSTEM FOR POWER, LIGHTING AND MOTOR CONTROL PANEL",
        "source_text": "--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              40 \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY : \nPERFORM ROUGHING-IN AND WIRING ACTIVITIES \nFOR THREE-PHASE DISTRIBUTION SYSTEM FOR \nPOWER, LIGHTING AND MOTOR CONTROL PANEL \n \nUNIT CODE                      : \nELC741304 \n \n \nUNIT DESCRIPTOR         : \nThis unit of Core Electrical Competencies covers the \nknowledge and attitudes on installing cable tray, power \npanel, lighting panel and motor control center (MCC), \nfittings, under the required performance standard. This \nalso includes wiring and completion works.\n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variable  \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Prepare for \nrough-in \nand wiring \nworks \n \n \n1.1 Technical drawings and plans are \ninterpreted determine job \nrequirements \n1.2 Correct type and quantity of cable \ntrays, power and lighting panels \nand MCC are identified and \nselected in line with job \nrequirements \n1.3 Tools and equipment are \nselected in line with job \nrequirements \n1.4 Correct PPE are identified and \nselected in line with safety \nrequirements \n Types of wiring \ndiagram based on \nANSI or IEC       \nStandard. \n Types of enclosure, \nproofing and mounting \nconfiguration \n Types and uses of  \ntools, materials and \nequipment for \nroughing-in and wiring. \n Proper used of safety \nharness. \n Interpreting \nplan and \ndetails \ndrawing.  \n Identifying  the  \nrequired  \n proofing of the \npanel and \nenclosure. \n Identifying the \nfunctional     \nand defective \ntools, materials \nand \nequipment.   \n \n2. Install \ncable tray \nand panel \n \n \n2.1 Safety procedures are followed \n2.2  Correct procedures for \ninstallation of cable tray and \npanel is performed in line with \njob requirements \n2.3 Schedule of work is monitored to \nensure work is completed in an \nagreed time, to a quality \nstandard and with a minimum of \nwaste \n2.4  Unplanned events or conditions \noccurred are responded to \naccordingly \n2.5 Checks of quality of work are  \nundertaken in accordance with \ninstructions and requirements \n Interpretation of      \nelectrical/ mechanical     \ndrawings \n Cable trays \no Uses and \nspecifications \n Panel board \no Uses and \nspecifications  \no Circuit breaker \no Types of mounting \nof protective device \no Circuit home run \nrequirements \n Proper procedure in \ninstallation of cable \ntray, fittings and \npanels. \n Installation techniques \nfor maintenance \naccessibility \n Blue Print \nreading skills \nrequired to \ninterpret work \ninstructions. \n Performing \ninstallation  \n economically \nand based on \njob \nspecifications\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              41 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variable  \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n Proper use of safety \nharness. \n PEC requirements in \ncable tray and panel \ninstallation \n3. Perform \nwiring \nworks  \n \n \n3.1 Safety procedures are followed \nbased on safety regulations PPE \nare identified and selected in line \nwith safety requirements \n3.2 Tools, equipment, pulling \ncompound and safety \nrequirements are identified and \nobtained for the lay out and \ninstallation. \n3.3 Pulling materials are properly \ninstalled and tensioned to \nrequired specifications \n3.4 Cable is secured permanently to \nsupport structure in accordance \nwith standard installation \nprocedures \n3.5 Bending radius and loops \ntolerance is observed for cable \nmaterials at all times \n3.6 Schedule of wire cutting lists is \nfollowed based on estimates, \nquantity and sizes to avoid \nwastage. \n3.7 Further instructions are sought if \nunplanned events or conditions \noccur \n3.8 Checking of quality of work is \ndone in accordance with \ninstructions and         \nrequirements. \n Wiring works provisions \nin DOLE Department  \nOrder No. 13 s. 1998- \nGuidelines Governing \nOccupational Safety \nand Health in the      \nConstruction  Industry \n Wiring procedures such \nas cable lay-out, pulling \nsplicing and wire \ntermination. \n Usage of different type \nof wires and cables and \nits applications  \n Markings of circuit \nhomeruns \n Application of pulling \ncompound. \n Bundling of wire size as \nper job requirement. \n PEC requirements in \nwiring works \n \n Interpreting \nplans  and \ndrawings \n Handling of \nmaterials, tools \nand equipment \n Applying \nmethods and  \n techniques in \nvarious type of \nwiring wires \nand cables \n Splicing and \nterminating \nwires \n \n \n4. Complete \nwork \nactivity \n4.1  Final checks are made to ensure \nthat work conforms with \ninstructions and to requirements \n4.2 Tools, equipment and any \nsurplus resources and materials \nare checked/ monitored in \naccordance with established \nprocedures \n4.3  Work area is checked as to \ncleanliness and safety. \n4.4 Waste materials and hazardous \nsubstances are disposal of in \naccordance with environmental \nrules and procedures.  \n Processes, Operations, \nSystems \no Maintenance of \ntools \no Storage of tools \n Procedures in checking \nand conforming the \ninstallation based on \njob requirement  \n Proper disposal of \nwaste materials and \nhazardous substances \n Principles of good \nhousekeeping \n Performing  \ncommisioning \nactivities \n Performing \ngood \nhousekeeping\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              42 \n \nRANGE OF VARIABLES \n \nVARIABLE  \nRANGE  \n \n1. Tools and equipment \n \nIncluding but not limited to: \n2.1 Pliers                  2.7. Rivet \n2.2 Screwdrivers       2.8   Mallet \n2.3 Wrenches            \n2.4 Wire splicers \n2.5 Knives \n2.6 Face shield \n \n2. Personal protective  \nequipment (PPE) \n \n \nIncluding but not limited to: \n3.1 Working gloves \n3.2 Safety shoes \n3.3 Hard hat \n \n3. Safety procedures \nIncludes safety procedures in: \n4.1 Philippine Electrical Code \n4.2 Industrial safety standards \n4.3 Electrical safety standards \n \n \n4. Correct procedures for \nInstallation of bus ducts \nand  cable tray   \n \n \n5.1 Bus ducts \n- \nJoints between sections and fittings are \naccessible for maintenance purposes \n- \nBus ducts shall be securely supported \n- \nVertically and horizontally aligned \n- \nDead end of busway shall be closed \n5.2 Cable tray \n- \nProperly supported, aligned and spaced \n- \nMeasurements referred to center of insert holes \n       \n5. Installation procedures \n5.1 Horizontally and vertically aligned \n5.2 No gap between plate cover and wall \n5.3 Wire cut to requirement \n5.4 All bolts tightened for rigid mounting\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              43 \nEVIDENCE GUIDE \n \n1.  Critical \naspects of \ncompetency \nAssessment required evidence that the candidate: \n1.1 Interpreted technical drawings and plans to determine job  \n       requirements  \n1.2 Selected appropriate tools, equipment and materials for  \n       performing rough-in and wiring activities \n1.3  Selected and used correct personnel protective equipment \n1.4  Demonstrated correct procedures for performing rough-in  \n       activities such as installing bus ducts, cable tray and panel \n1.5  Followed safety procedures \n1.6 Performed wiring works \n1.7 Made final checks to ensure work completion and conforms \nwith the working plan \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Tools and equipment appropriate to building wiring electrical   \n        installation \n2.3  Materials relevant to the proposed activity \n2.4  Drawings and specifications relevant to the task \n3.  Methods of  \nAssessment \nCompetency in this unit must be assessed: \n3.1  Direct observation/Demonstration of application of tasks. \n3.2  Questions related to underpinning knowledge  \n3.3  Written Test \n4.  Context for  \nAssessment \n4.1 Competency may be assessed in the workplace or in a   \n       simulated workplace setting \n4.2 Assessment shall be observed while the tasks are being \nundertaken either individually or as part of a team under limited \nsupervision\n",
