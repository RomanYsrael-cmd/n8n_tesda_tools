        "source_text": "ELC741306\n\nUNIT DESCRIPTOR :\nThis unit of Core Electrical Competency covers the\nknowledge, skills and attitudes in installing, assembling,\ntesting and maintaining motor control system.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Check/\nReview type\nand purpose\nof motor\ncontrol\nsystem.\n\n1.1. Wiring diagrams and layout/\nshop drawings are obtained\naccording to job requirements\n1.2. Drawings are read and\ninterpreted in accordance with\njob requirements\n1.3. Correct rating, quantity, sizes\nand type of motor control\ncomponents & wiring devices\nand other materials are identified\nin line with job requirements\n1.4. Correct size and degree of\nprotection of enclosures are\nverified in line with job\nrequirements\n1.5. Tools, equipment and testing\ninstruments are properly\nselected in line with job\nrequirements\n1.6. Correct PPE are identified and\nselected in line with safety\nrequirements\n• Interpretation of\nelectrical drawing\nand wiring diagram.\n• Function of every\ndevices used in the\nline/ job\nrequirements\n• Motor specification\nfor the selection of\ncontrol devices.\n• NEMA Standard in\nmounting of MCC.\n• Electrical control\ncomponents and\ndevices\n• Safe working\nhabits/Safety\nprocedures\n\n• Interpreting\nelectrical\ndrawing and\nwiring diagram\n• Checking and\nquantifying\nitems needed in\nthe job\nrequirement\n• Checking the\nrequired rating\nbased on its\nspecification in\naccordance with\nstandard.\n\n2. Install and\nassemble\nmotor control\nsystem\n2.1 Safety procedures are followed\naccording to enterprise or based\non PEC standard and\nrequirements.\n2.2 Electrical components and wiring\ndevices are laid-out, mounted or\ninstalled according to drawings,\nplans, specifications and PEC\nstandards\n2.3 Electrical motor control\ncomponents are wired correctly\nin accordance with wiring\ndiagrams and PEC standards\n2.4 Preliminary checks/ tests are\nconducted in line/ job\nrequirements.\n2.5 Work schedule is followed to\nensure job is completed on time\nin accordance to a quality\nstandard and minimum wastage.\n\n• Lay-out and\ndimensions of\nelectrical drawing or\nwiring diagram.\n• Types and operation\nof motor control\nsystem.\n• Types and uses of\ntermination either\npoint to point\ntermination or\nterminal strip.\n• Correct procedures\nin assembling motor\ncontrol system\n• Proper procedure\nmounting and\ninstallation of\npanels/MCC.\n• Proper terminal\nconnection of motor\nleads outs.\n• Interpreting the\nelectrical wiring\ndiagram of\nmotor control\nsystem.\n• Wiring-up the\nrequired\nelectrical control\nbased on the\nstandard.\n• Connecting and\nTerminating of\nmotor terminal/\nleads out and\nthe control\ndevices.\n• Checking for\ncontinuity test\nor ohmmeter\ntest of motor\nterminal\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 49\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n• PEC standards -\nArticle 4.30\n• Performing the\ninstallation\neconomically.\n3. Notify\ncompletion of\nwork\n\n3.1 Immediate superior is notified\nupon completion of work.\n3.2 Performance tests are made to\nensure that work conforms to\ninstructions and job\nrequirements.\n3.3 Tools, equipment and any\nsurplus materials are cleaned,\nchecked and returned to storage\nin accordance with established\nprocedures.\n3.4 Waste materials and hazardous\nsubstances are disposed of in\naccordance with environmental\nrules and regulations.\n3.5 Work area is cleaned up and\nmade safe in accordance with\nOSHA requirements\n• Checked and\nconformed the\ninstallation based on\njob requirement\n• Principles of 5S\n• Proper disposal of\nwaste materials and\nhazardous\nsubstances\n• Good housekeeping\n\n• Performing\ncommissioning\nactivities\n• Storing excess\nmaterials\n• Checking\nquality of work\n• Communicating\nskills (both\nwritten & oral)\n\n4. Maintain\nelectrical\nmotor control\nsystem.\n\n4.1 Safety policies and procedures\nare followed in accordance with\nOSH and enterprise procedures.\n4.2 Materials, tools, equipment,\ntesting devices and PPE\nneeded are prepared for the\nmaintenance work requirements.\n4.3 Potential hazards are identified\nfor prevention and control\nmeasures are selected in\naccordance with the work plan\nand site procedures\n4.4 Routine/visual/sensory\ninspection is regularly\n conducted in line with normal\noperation.\n4.5 Maintenance work schedule is\nprepared in accordance with\nmachine/equipment operating\ntime/condition\n4.6 Work instructions are prepared\naccording to machine’s manual\nand established enterprise\nprocedures\n4.7 Concerned department/\npersonnel are informed on the\nschedule of work according to\nstandard operating procedure.\n4.8 Availability of maintenance\nrecords are prepared in\naccordance with established\nprocedure, or based on\nenterprise Quality Management\nSystem (QMS).\n• Safety Practices in\nthe use of PPE,\nhandling of tools,\ninstrument and\nequipment.\n• Types and uses of\nlubricants and\ncleaning materials\n• Preventive\nMaintenance\nMethods and\nTechniques and\nProcedures.\n• Types of potential\nhazards\n• Maintenance and\ntroubleshooting\nprocedures\n• Good housekeeping\nof materials, tools\nand equipment\n\n• Selecting\nprevention\nand/or control\nmeasures\n• Handling of\ntools,\ninstrument and\nequipment.\n• Performing\nbasic\ntroubleshooting\nskills\n• Identifying\nfailures or\ndefects\n• Implementing\ncorrective and\npreventive\nactions based\non root cause of\ntrouble\n• Application of\nmaintenance\nprocedures\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 50\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Wiring diagrams\n1.1 Power circuit\n1.2 Control circuit\n2. Motor control components\n& wiring devices\n\nMay include but are not limited to:\n2.1 Circuit breakers/Fuses\n2.2 Magnetic Contactors\n2.3 Overload heater\n2.4 Power Cabinet or MCC\n2.5 Power and Timers Relays\n2.6 Terminal Blocks/Lugs\n2.7 Pilot lamps and Buzzer\n2.8 Actuators\n2.9 Push buttons\n2.10 Selector Switches\n2.11 Cable duct\n2.12 Din rail\n2.13 Wire Strap\n2.14 Wire Markers\n2.15 Cable Tie\n2.16 Tie Mount\n2.17 Cable Glands/Grommet\n2.18 Automotive wires/Conductors\n2.19 Insulators\n3. Degree of Protection\n3.1 Nema Standards\n- Nema 1\n- Nema 2\n- Nema 3/3R\n- Nema 4/4x\n- Nema 6\n- Nema 11\n- Nema 12\n3.2 IEC Standards\n- International Protection (IP)\n3.3 Bureau of Product Standards (BPS)\n4. Tools, equipment & testing\ninstruments\nMay include but are not limited to:\n4.1 Tools\n- Pliers\n- Screw drivers\n- Wrenches\n- Wire splicers/strippers\n- Electrician knives\n- Electric Hand drill\n- Hand or electric taping/threading\n- Hack saw\n- File\n- Manual/Hydraulic puncher\n- Measuring tools (e.g. Push-pull meter)\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 51\nVARIABLE\n\nRANGE\n\n- Crimping tools\n- Soldering tools\n- Manual/Hydraulic pipe bender\n- Manual/Electrical Pipe Threader/Reamer\n- High-speed cutter\n\n4.2 Testing Instruments\n- Multi-tester\n- Clamp ammeter\n- Insulation resistance tester\n- Ground resistance tester\n- Earth leakage tester\n- Harmonic meter\n- Phase Sequence Tester\n4.3 Three-Phase Motor\n - SCRIM\n - WRIM\n - Synchronous Motor\n4.4 Single Phase Motor\n\n5. Personal protective\nequipment (PPE)\n\nMay include but are not limited to:\n5.1 Proper working clothes\n5.2 Working gloves\n5.3 Safety shoes\n5.4 Gas/Dust mask\n5.5 Hard hat\n5.6 Safety goggles\n6. Specifications\n6.1 Brand/Make\n- Classification/Type\n6.2 Rating\n- Voltage\n- Current\n- Power\n- Frequency\n- Temperature Rise\n- Service factor\n- Degree of protection\n- Utilization category\n- Harmonics\n6.3 Phase\n6.4 Range (Tools must be specific)\n6.5 Needed accessories\n7. PEC standard and\nrequirements\n7.1 Splicing and joining of electrical conductor\n7.2 Soldering electrical conductors\n7.3 Solderless electrical connectors\n7.4 Creepage distances\n7.5 Clearances\n\n--- PDF PAGE 56 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 52\nVARIABLE\n\nRANGE\n\n8. Preliminary Check/Tests\nMay include but are not limited to:\n8.1 Mechanical\n- Board/Panel properly leveled\n- Doors can be opened/closed with ease. Paint\nnot easily scratched/removed\n- Tightness of bolts and nuts\n- Type of protection\n- Cleanliness\n- Cable trays\n8.2 Electrical\n- Conductor size or Cross-section\n- Conductor Color Coding\n- Cables laid to avoid risk of short circuit\n- Grounding busbar conductor\n- Voltage Clearances/Creepage Distances\n- Control Voltage\n- High Voltage Test\n- Insulation Test\n- Continuity Test/Contact Resistance Test\n- Correct use of wire markers & terminals\n9. Performance Tests\n9.1 Simulation Test/No Load Test\n9.2 Phase sequence\n9.3 Actual Operation\n9.4 Temperature rise\n9.5 Insulation Resistance Test\n\n10. Materials\n\nMay include but not limited to:\n10.1 Contact cleaner\n10.2 Insulating varnish/materials\n10.3 Carbon brushes\n10.4 Sand paper\n10.5 Waste rugs\n10.6 Electrical tapes\n10.7 Warning tags\n10.8 Signages\n10.9 Lockout/tagout\n10.10 Lubricants\n10.11 Motor cleaner\n10.12 Insulating oil\n10.13 Coolant\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 53\nVARIABLE\n\nRANGE\n\n11. Tools, equipment and\ntesting devices\nIncluding but not limited to:\n11.1 Electrician’s hand tools\n- Pliers\n- Screwdrivers\n- Wrenches\n- Wire splicers\n- Knives\n- Bolt/Cable cutter\n- Knockout puncher\n- Torque wrench\n11.2 Testing instruments/devices\n- Multi-tester (VOM)\n- Insulation resistance tester (Megger)\n- High potential tester\n- Low resistance tester\n- Phase sequence meter\n- Ammeter\n- Torque meter\n11.3 Equipment\n- Labeling machine\n- Vacuum cleaner\n- Air blower\n- Dryer\n- Welding machine\n- Pressure washer\n- Vacuum pump\n12. Personal protective\nequipment (PPE)\nIncluding but not limited to:\n12.1 Working gloves\n12.2 Safety shoes\n12.3 Hard hat\n12.4 Face shield\n12.5 Insulating mat\n12.6 Lockout tags\n12.7 Safety goggles\n12.8 Safety belt\n12.1\nSafety ladder\n13. Potential hazards\nIncluding but not limited to:\n13.1 Live wires\n13.2 Oil spill\n13.3 Chemical hazards\n13.4 Flammable materials\n13.5 Sources of energy\n13.6 Moving machine parts\n13.7 Sharp/pointed objects\n13.8 Noise hazards\n13.9\nConfined space\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 54\nVARIABLE\n\nRANGE\n\n14. Maintenance records\n\nMay include but are not limited to:\n14.1 Electrical plans\n14.2 Equipment electrical diagrams\n14.3 Historical records\n- Job orders\n- Commissioning test record\n- Preventive Maintenance schedules\n- Corrective Maintenance records\n- Manufacturer’s maintenance guides\n- Equipment breakdown records\n- Periodic monitoring data\n- Service reports\n14.4 Log book\n15. Quality Management\nSystem\n15.1"
