        "source_title": "PERFORM INSTALLATION OF DATA MEASUREMENT AND CONTROL SYSTEM ON ELECTRICAL AND AUXILLIARY EQUIPMENT",
        "source_text": "--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              44 \n \nUNIT OF COMPETENCY: \nPERFORM INSTALLATION OF DATA MEASUREMENT \nAND CONTROL SYSTEM ON ELECTRICAL AND \nAUXILLIARY EQUIPMENT \nUNIT CODE                    :\nELC741305\n \nUNIT DESCRIPTOR       : \nThis unit of Core Electrical Competency covers the \nknowledge, skills and attitudes in installing wiring devices \nfor power supply of data measurement and control system \non electrical and auxiliary equipment such as UPS, drytype, \ntransformer, capacitor bank AVR and rectifier based on \nrequired performance standard.\n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Plan and prepare \nfor installation \nwork \n \n1.1 Instructions for the preparation \nof  work activity are \ncommunicated and confirmed \nto ensure clear understanding \n1.2 Tools, equipment and \npersonnel protective \nequipment needed to \nelectrical system and \nauxiliary equipment are \nidentified and checked to \nensure usability and safety in \naccordance with established \nprocedures \n1.3 Materials needed to do the \nwork are obtained and \nestimated in accordance with \nestablished procedures and \nplan\n  Types and \nspecification of \nwiring devices for \ndata measurement \nand control system.  \n Functions and uses \nof power supply on \ndata measurement \nsystem and auxiliary \nequipment. \n Identification of tools \nand materials for  \ninstallation of data \nmeasurement and \ncontrol system on \nelectrical and \nauxiliary equipment \n Interpreting \nplans  and \ndetails drawing. \n Handling of \nmaterials,       \ntools and \nequipment  \n Checking and \nquantifying the \nitem needed, in \nthe job \nrequirement. \n \n \n2.  Install electrical \nsystem and \nauxiliary \nequipment \n \n \n2.1 Safety procedures are \nfollowed in line with job \nrequirements \n2.2 Correct procedures for \ninstallation of electrical \nsystem and auxiliary \nequipment are performed in \nline with job requirements \n2.3 Schedule of work is followed to \nensure work is completed in an \nagreed time, to a quality \nstandard and with a minimum \nof waste \n2.4 Unplanned events or conditions \noccurred are responded to \naccordingly  \n2.5 On going checks of quality of \nwork are undertaken in \naccordance with instructions \nand requirements  \n2.6 Conductors/wires are \nterminated/spliced in \naccordance with electrical \nstandards \n Procedures on \ninstallation of \nelectrical system \nand auxiliary \nequipment. \n Proper used of \npower tools and \nequipment in an \ninstallation. \n Splicing, dressing \nand harnessing of \nwires. \n Proper termination \nand mounting of \ndevices. \n Proper use of safety \nharness \n Types and uses of: \no UPS \no Drytype \nTransformer \no Capacitor bank \no AVR \n Installing AVR \nand UPS \n Performing \nsplicing, \ndressing and \nharnessing of \nwires. \n Mounting  of \ndevices. \n Performing the \ninstallation \neconomically. \n Applying active \nand non-active \ntest to ensure \nits functionality.\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              45 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \no Rectifier \no other metering/ \ncentral aux. \nequipment \n PEC requirements in \ninstallation of \nelectrical system \nand auxiliary \nequipment \n3. Notify \ncompletion of    \nwork \n3.1 Final checks are made to \nensure that work  conforms \nwith instructions and to \nrequirements  \n3.2 Completion report is prepared \nand submitted to appropriate \nofficer \n3.3 Tools, equipment and any \nsurplus resources and \nmaterials are checked and \nmonitored  in         \naccordance with established \nprocedures \n3.4 Work area is monitored as to \ncleanliness and safety \n Procedures in \nchecking and \nconforming the \ninstallation based on \njob requirement \n Procedures in report \npreparation and \nsubmission \n Principles of good \nhousekeeping \n Performing        \ncommisioning \nactivities \n Performing \ngood \nhousekeeping\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              46 \n \nRANGE OF VARIABLES \n \nVARIABLE  \nRANGE  \n \n1.  Tools and equipment \n \n1.1 Electrical power tools \n1.2 Hand tools \n1.3 Multi-testers, mega-ohmmeter, clamp-on meter \n \n2.  Personal protective \nequipment (PPE) \n \nIncludes but is not limited to: \n2.1 Working gloves \n2.2 Safety shoes \n2.3 Hard hat \n2.4 Goggles/face shield\n \n3.  Electrical system and \nauxiliary equipment \n \n3.1 UPS \n3.2 Drytype \n3.3 Transformer \n3.4 Capacitor bank \n3.5 AVR \n3.6 Rectifier/Frequency converter \n3.7 Fire alarm system \n3.8 Intercom \n3.9 Digital watt meter \n \n4.  Safety procedures \n \n4.1 Philippine Electrical Code (PEC) \n4.2 Industrial safety \n4.3 Electrical safety \n \n5.  Installation of electrical \nsystem and auxiliary \nequipment \n \n5.1 Installed and connected as per plan \n5.2 Magnetic switches installed \n5.3 Conducted preliminary testing prior to \ncommissioning\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              47 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Correctly followed work instructions \n1.2 Identified  and checked appropriate tools, equipment and \nmaterials for installing  electrical system and auxiliary \nequipment \n1.3 Selected and used correct personal protective equipment \n1.4 Performed correct procedures for installation of electrical   \nsystem and auxiliary equipment  \n1.5 Terminated/Spliced conductors/wires in accordance with \nthe existing electrical standards \n1.6 Made final checks to ensure work conforms with the plan  \n1.7 Followed safety procedures \n2.  Resource  \nImplications \nThe following resources should be provided: \n2.1  Workplace location \n2.2  Tools and equipment appropriate to installation of \nelectrical and auxiliary equipment \n2.3  Materials relevant to the activity \n2.4  Wiring diagrams, layout/shop drawings and specifications \nrelevant to the task \n3.  Methods of \nAssessment \nCompetency in this unit must be assessed: \n3.1  Direct observation/Demonstration of application of tasks. \n3.2  Questions related to underpinning knowledge  \n3.3  Written Test\n4.  Context for \nAssessment \n4.1 Competency may be assessed in the workplace or in a   \n       simulated workplace setting \n4.2 Assessment shall be observed while the tasks are being \nundertaken either individually or as part of a team under \nlimited supervision\n",
