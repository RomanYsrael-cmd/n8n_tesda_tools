        "source_title": "USE RELEVANT TECHNOLOGIES",
        "source_text": "--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              17 \nUNIT OF COMPETENCY:   USE RELEVANT TECHNOLOGIES \n \nUNIT CODE                     :   500311114 \n \nUNIT DESCRIPTOR        :  This unit of competency covers the knowledge, skills, and \nattitude \nrequired \nin \nselecting, \nsourcing \nand \napplying \nappropriate and affordable technologies in the workplace.                         \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED \nSKILLS \n1. Study/select \nappropriate \ntechnology \n1.1 Usage of different \ntechnologies is determined \nbased on job requirements \n1.2 Appropriate technology is \nselected as per work \nspecification \n Awareness on technology \nand its function \n Communication techniques \n Health and safety \nprocedure \n Company policy in relation \nto relevant technology  \n Machineries/ equipment \nand their application \nSoftware programs\n Identifying \nrelevant \ntechnology  on \njob \n \n \n  \n \n2. Apply \nrelevant \ntechnology \n \n2.1 Relevant technology is \neffectively used in carrying \nout function \n2.2 Applicable software and \nhardware are used as per \ntask requirement \n2.3 Management concepts are \nobserved and practiced as \nper established industry \npractices \n Knowledge on operating \ninstructions \n Understanding software \nand hardware system \n Communication techniques \n Health and safety \nprocedure \n Company policy in relation \nto relevant technology  \n Different management \nconcepts \nTechnology adaptability\n Applying  \nrelevant \ntechnology  \n Communicating  \nskills \n Using software \napplications \nskills \n Conducting risk \nassessment \n \n3.  Maintain/ \nenhance  \nrelevant \ntechnology \n3.1 Maintenance of technology is \napplied in accordance with \nthe industry standard \noperating procedure, \nmanufacturer’s operating \nguidelines and \noccupational health and \nsafety procedure to ensure \nits operative ability \n3.2 Updating of technology is \nmaintained through \ncontinuing education or \ntraining in accordance with \njob requirement  \n3.3 Technology failure/ defect is \nimmediately reported to the \nconcern/responsible person \nor section for appropriate \naction \n Awareness on technology \nand its function \n Repair and maintenance \nprocedure \n Health and safety \nprocedure \n Company policy in relation \nto relevant technology \n Upgrading of technology \n Organizational set-up/work \nflow \n Performing \nbasic  \ntroubleshooting \nskills \n Identifying \nfailures or  \ndefects  \n Communication \nskills \n Applying \ncorrective and \npreventive \nmaintenance\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              18 \n   RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Technology \nMay include but are not limited to: \n1.1 Office technology \n1.2 Industrial technology \n1.3 System technology \n1.4 Information technology \n1.5 Training technology \n \n2. Management concepts \nMay include but not limited to: \n2.1  Real Time Management \n2.2  KAIZEN or continuous improvement \n2.3  5s \n2.4  Total Quality Management \n2.5 Other management/productivity tools \n3. Industry standard \noperating procedure \nWritten guidelines relative to the usage of office \ntechnology/equipment \nVerbal advise/instruction from the co-worker \n4. Manufacturer’s operating \nguidelines/ instructions  \n4.1 Written instruction/manuals of specific technology/ \nequipment \n4.2 General instruction manual \n4.3 Verbal advise from manufacturer relative to the \noperation of equipment\n5. Occupational health and \nsafety procedure \n5.1 Relevant statutes on OHS \n5.2 Company guidelines in using  \n      technology/equipment \n \n6. Appropriate action \n6.1 Implementing preventive maintenance schedule  \n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              19 \n \n   EVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1  Studied and selected appropriate technology \nconsistent with work requirements   \n1.2  Applied relevant technology \n1.3  Maintained and enhanced operative ability of \nrelevant technology \n \n2.  Resource Implications \nThe following resources MUST be provided: \n2.1 Relevant technology \n2.2 Interview and demonstration questionnaires \n2.3  Assessment packages \n \n3.  Methods of Assessment \nCompetency must be assessed through: \n3.1  Interview \n3.2  Actual demonstration \n3.3  Authenticated portfolio (related certificates of \ntraining/seminar) \n \n4.  Context for Assessment \nCompetency may be assessed in actual workplace or \nsimulated environment\n",
