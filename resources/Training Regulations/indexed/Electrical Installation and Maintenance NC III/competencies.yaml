ality of work\n• Communicating\nskills (both\nwritten & oral)\n\n4. Maintain\nelectrical\nmotor control\nsystem.\n\n4.1 Safety policies and procedures\nare followed in accordance with\nOSH and enterprise procedures.\n4.2 Materials, tools, equipment,\ntesting devices and PPE\nneeded are prepared for the\nmaintenance work requirements.\n4.3 Potential hazards are identified\nfor prevention and control\nmeasures are selected in\naccordance with the work plan\nand site procedures\n4.4 Routine/visual/sensory\ninspection is regularly\n conducted in line with normal\noperation.\n4.5 Maintenance work schedule is\nprepared in accordance with\nmachine/equipment operating\ntime/condition\n4.6 Work instructions are prepared\naccording to machine’s manual\nand established enterprise\nprocedures\n4.7 Concerned department/\npersonnel are informed on the\nschedule of work according to\nstandard operating procedure.\n4.8 Availability of maintenance\nrecords are prepared in\naccordance with established\nprocedure, or based on\nenterprise Quality Management\nSystem (QMS).\n• Safety Practices in\nthe use of PPE,\nhandling of tools,\ninstrument and\nequipment.\n• Types and uses of\nlubricants and\ncleaning materials\n• Preventive\nMaintenance\nMethods and\nTechniques and\nProcedures.\n• Types of potential\nhazards\n• Maintenance and\ntroubleshooting\nprocedures\n• Good housekeeping\nof materials, tools\nand equipment\n\n• Selecting\nprevention\nand/or control\nmeasures\n• Handling of\ntools,\ninstrument and\nequipment.\n• Performing\nbasic\ntroubleshooting\nskills\n• Identifying\nfailures or\ndefects\n• Implementing\ncorrective and\npreventive\nactions based\non root cause of\ntrouble\n• Application of\nmaintenance\nprocedures\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 50\nRANGE OF VARIABLES\n\nVARIABLE\n\nRANGE\n\n1. Wiring diagrams\n1.1 Power circuit\n1.2 Control circuit\n2. Motor control co