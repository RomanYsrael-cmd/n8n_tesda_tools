ments\n\n• Category of measuring\ninstruments\n• Types and uses of\nmeasuring instruments\n• Shapes and\nDimensions\n• Formulas for volume,\nareas, perimeters of\nplane and geometric\nfigures\n• Identifying and\nselecting\nmeasuring\ninstruments\n• Visualizing\nobjects and\nshapes\n2. Carry out\nmeasurements\nand calculation\n1.1 Appropriate measuring\ninstrument is selected to\nachieve required outcome\n1.2 Accurate measurements are\nobtained for job\n1.3 Calculation needed to\ncomplete work tasks are\nperformed using the four\nbasic process of addition (+),\nsubtraction (-), multiplication\n(x), and division (/)\n1.4 Calculation involving\nfractions, percentages and\nmixed numbers are used to\ncomplete workplace tasks.\n1.5 Numerical computation is\nself-checked and corrected\nfor accuracy\n1.6 Instruments are read to the\nlimit of accuracy of the tool.\n• Calculation &\nmeasurement\n• Four fundamental\noperation\n• Linear measurement\n• Dimensions\n• Unit conversion\n• Ratio and proportion\n\n• Performing\ncalculation by\naddition,\nsubtraction,\nmultiplication\nand division;\n• Interpreting\nformulas for\nvolume, areas,\nperimeters of\nplane and\ngeometric\nfigures\n• Handling of\nmeasuring\ninstruments\n3. Maintain\nmeasuring\ninstruments\n1.1\nMeasuring instruments are\nnot dropped to avoid\ndamage\n1.2\nMeasuring instruments are\ncleaned before and after\nusing.\n1.3\nProper storage of\ninstruments undertaken\naccording to manufacturer’s\nspecifications and standard\noperating procedures.\n• Types of measuring\ninstruments and their\nuses\n• Safe handling\nprocedures in using\nmeasuring instruments\n• Four fundamental\noperation of\nmathematics\n• Formula for volume,\narea, perimeter and\nother geometric figures\n• Handling and\nmaintaining\nmeasuring\ninstruments\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 23\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring i