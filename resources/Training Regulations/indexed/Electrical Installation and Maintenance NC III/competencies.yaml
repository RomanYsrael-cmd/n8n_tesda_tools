        "source_title": "PREPARE AND INTERPRET TECHNICAL DRAWING",
        "source_text": "--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              24 \nUNIT TITLE \n \n:    PREPARE AND INTERPRET TECHNICAL DRAWING \n \nUNIT CODE                  :    ELC311202  \n \nUNIT DESCRIPTOR     : \nThis unit covers the knowledge, skills and attitudes and values \nneeded to prepare/interpret diagrams, engineering \nabbreviation and drawings, symbols, dimension. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated \nin the Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Identify \ndifferent \nkinds of \ntechnical \ndrawings  \n1.1. Correct technical drawing is \nselected according to job \nrequirements. \n1.2. Technical drawings are \nsegregated in accordance \nwith the types and kinds of \ndrawings \n Types of technical \ndrawings \n Applications for technical \ndrawing  \n Methods of technical \ndrawings \n Symbols \n Mark up/Notation of \nDrawings \n \n Reading skills \nrequired to \ninterpret work \ninstruction \n Interpreting \nelectrical/ \nelectronic signs \nand symbols   \n2. Interpret \ntechnical \ndrawing \n2.1. Components, assemblies or \nobjects are recognized as \nrequired. \n2.2. Dimensions of the key \nfeatures of the objects \ndepicted in the drawing are \ncorrectly identified. \n2.3. Symbols used in the \ndrawing are identified and \ninterpreted correctly. \n2.4. Drawing is checked and \nvalidated against job \nrequirements or equipment in \naccordance with standard \noperating procedures. \n \n Trade Mathematics \no Linear measurement \no Dimension \no Unit conversion \n Blueprint Reading and \nPlan Specification \no Architectural, \nelectrical, electronics, \nmechanical plan, \nsymbols and \nabbreviations \no Drawing standard \nsymbols \n Trade Theory \no Basic technical \ndrawing \no Types technical plans \no Various types of \ndrawings \no Notes and \nspecifications \n \n Interpreting \ndrawing/ \northographic \ndrawing \n Interpreting \ntechnical plans \n Matching \nspecification \ndetails with \nexisting resources \n Safety handling of \ndrawing \ninstruments \n \n3. Prepare/ \nmake \nchanges to \nelectrical/ \nelectronic \nschematics \nand \ndrawings \n3.1. Electrical/electronic \nschematic is drawn and \ncorrectly identified. \n3.2. Correct drawing is identified, \nequipment are selected and \nused in accordance with job \nrequirements. \n Drawing conventions \n Dimensioning \nConventions \n Mathematics \no Four fundamental \noperations \no Percentage \no Fraction \no Algebra \no Geometry \n \n Reading skills \nrequired to \ninterpret work \ninstruction \n Communication \nskills \n Preparing/ Making \nelectrical/ \nelectronic signs \nand symbols   \n Computing \nformulas\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              25 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated \nin the Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n4. Store \ntechnical \ndrawings \nand \nequipment/ \ninstruments \n4.1. Care and maintenance of \ndrawings are undertaken \naccording to company \nprocedures. \n4.2. Technical drawings are \nrecorded and inventory is \nprepared in accordance with \ncompany procedures. \n4.3. Proper storage of \ninstruments is undertaken \naccording to company \nprocedures.  \n \n Effective ways to \ncatalogue and store \ntechnical drawings \n Manual methods of \nhandling, storing and \nmaintaining paper \ndrawings \n Storing drawing in digital \nforms \no Scanner \no CAD \n \n Handling and \nstoring of drawings \n Scanning and \nstoring drawings in \ndigital form \n Matching \nspecification \ndetails with \nexisting resources \n Handling of \ndrawing \ninstruments\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              26 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Technical drawings \nTechnical drawings include the following but not \nlimited to: \n \n1.1. Schematic diagrams \n1.2. Charts \n1.3. Block diagrams \n1.4. Lay-out plans \n1.5. Location plans \n1.6. Process and instrumentation diagrams \n1.7. Loop diagrams \n1.8. System Control Diagrams \n2. Dimensions   \nDimensions may include but not limited to: \n \n2.1. Length \n2.2. Width \n2.3. Height \n2.4. Diameter \n2.5. Angles \n3. Symbols \nMay include but not limited to: \n \n3.1. NEC- National Electric Code \n3.2. IEC -International Electrotechnical \nCommission \n3.3. ASME - American Society of Mechanical \nEngineers \n3.4. IEEE - Institute of Electrical and \nElectronics Engineers \n3.5. ISA - Instrumentation System and \nAutomation Society \n4. Instruments/Equipment \n4.1. Components/dividers \n4.2. Drawing boards \n4.3. Rulers \n4.4. T-square \n4.5. Calculator\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              27 \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetencies \nAssessment requires evidence that the candidate: \n1.1. selected correct technical drawing in line with \njob requirements \n1.2. correctly identified the objects represented in \nthe drawing \n1.3. identified and interpreted symbols used in the \ndrawing correctly \n1.4. prepared/produced electrical/electronic \ndrawings including all relevant specifications \n1.5. stored diagrams/equipment \n2. Method of assessment \nCompetency in this unit must be assessed through: \n \n2.1. Practical tasks involving interpretation of a \nrange of technical drawings \n2.2. Oral questioning \n3. Resource implication \n3.1. Drawings \n3.2. Diagrams \n3.3. Charts \n3.4. Plans \n4. Context of Assessment \n4.1 Assessment may be conducted in the workplace \nor in a simulated environment\n",
