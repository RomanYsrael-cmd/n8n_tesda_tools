l\ncauses of the\nproblem\n2.1 Possible causes are\nidentified based on\nexperience and the use of\nproblem solving tools/\nanalytical techniques.\n2.2 Possible cause statements\nare developed based on\nfindings\n2.3 Fundamental causes are\nidentified per results of\ninvestigation conducted\n• Relevant equipment and\noperational processes\n• Enterprise goals, targets\nand measures\n• Enterprise quality, OHS\nand environmental\nrequirements\n• Enterprise information\nsystems and data collation\n• Industry codes and\nstandards\n• Analysis of\nroot causes\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 12\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED KNOWLEDGE\nREQUIRED\nSKILLS\n3. Determine\ncorrective\naction\n3.1 All possible options are\nconsidered for resolution\nof the problem\n3.2 Strengths and\nweaknesses of possible\noptions are considered\n3.3 Corrective actions are\ndetermined to resolve the\nproblem and possible\nfuture causes\n3.4 Action plans are\ndeveloped identifying\nmeasurable objectives,\nresource needs and\ntimelines in accordance\nwith safety and operating\nprocedures\n\n• Understanding the\nprocedure in undertaking\ncorrective action\n• Principles of decision\nmaking strategies and\ntechniques\n• Enterprise information\nsystems and data collation\n• Action planning\n• Identifying and\nclarifying the\nnature of the\nproblem\n• Devising the\nbest solution\n• Evaluating the\nsolution\n• Implementing\ndeveloped plan\nto rectify the\nproblem\n• Implementing\ncorrective and\npreventive\nactions based\non root cause\nanalysis\n4. Provide\nrecommenda\ntion/s to\nmanager\n4.1 Report on\nrecommendations are\nprepared according to\nprocedures.\n4.2 Recommendations are\npresented to appropriate\npersonnel.\n4.3 Recommendations are\nfollowed-up, if required\n• How to make a report and\nrecommendation\n• Writing report\nand\nrecommendati\nons\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1.\nBrainstorming\n1.2.\nIntuitions/Logic\n1.3.\nCause and effect diagrams\n1.4.\nPareto analysis\n1.5.\nSWOT analysis\n1.6.\nGant chart, Pert CPM and graphs\n1.7.\nScattergrams\n2. Problem\n\n2.1.\nNon – routine process and quality problems\n2.2.\nEquipment selection, availability and failure\n2.3.\nTeamwork and work allocation problem\n2.4.\nSafety and emergency situations and incidents\n3. Action plans\n\n3.1.\nPriority requirements\n3.2.\nMeasurable objectives\n3.3.\nResource requirements\n3.4.\nTimelines\n3.5.\nCo-ordination and feedback requirements\n3.6.\nSafety requirements\n3.7.\nRisk assessment\n3.8.\nEnvironmental requirements\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 14\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified the problem\n1.2.\nDetermined the fundamental causes of the problem\n1.3.\nDetermined the correct / preventive action\n1.4.\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a walk\nthrough forming part of the response. These assessment\nactivities should include a range of problems, including new,\nunusual and improbable situations that may have happened.\n2. Resource\nImplications\nAssessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A bank of\nscenarios / case studies / what ifs will be required as well as bank\nof questions which will be used to probe the reason behind the\nobservable action.\n3. Methods of\nAssessment