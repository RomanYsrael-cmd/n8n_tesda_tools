        "source_text": "--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              2 \nSECTION 2.    COMPETENCY STANDARDS \n \n \nThis section gives the details of the contents of the units of competency required in \nELECTRICAL INSTALLATION & MAINTENANCE NC III.  These units of competency are \ncategorized into basic, common and core competencies. \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY :   LEAD WORKPLACE COMMUNICATION \n \nUNIT CODE \n      :   500311109 \n \n    UNIT DESCRIPTOR        :  This unit covers the knowledge, skills and attitudes    required \nto lead in the dissemination and discussion of ideas, \ninformation and issues in the workplace. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS\n1. Communicate \ninformation \nabout \nworkplace \nprocesses \n1.1. Appropriate \ncommunication method \nis selected  \n1.2. Multiple operations \ninvolving several topics \nareas are communicated \naccordingly \n1.3. Questions are used to \ngain extra information \n1.4. Correct sources of \ninformation are identified \n1.5. Information is selected \nand organized correctly \n1.6. Verbal and written \nreporting is undertaken \nwhen required \n1.7. Communication skills are \nmaintained in all situations\n Organization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n Effective verbal \ncommunication \nmethods \n Methods of \nCommunication \n Types of Question \n Communication \nTools \n Questioning \nTechniques \n Organizing  \ninformation \n Understanding and \nconveying intended \nmeaning \n Participating in \nvariety of workplace \ndiscussions \n Complying with \norganization  \nrequirements for \nthe use of written \nand electronic \ncommunication \nmethods \n Reporting \noccupational \nhazards during \nsafety meeting\n2. Lead \nworkplace \ndiscussions \n2.1. Response to workplace \nissues are sought  \n2.2. Response to workplace \nissues are provided \nimmediately \n2.3. Constructive contributions \nare made to workplace \ndiscussions on such \nissues as production, \nquality and safety \n2.4. Goals/objectives and \naction plan are \nundertaken in the \nworkplace are \ncommunicated \n Leading as a \nmanagement \nfunction \n Barriers of \ncommunication \n Effective verbal \ncommunication \nmethods \n Methods/ techniques \nof discussion \n How to lead \ndiscussion \n How to solicit \nresponse \n Goal setting and \naction planning \n Communicating \neffectively \n Consulting the crew \non the prepared \nmenu for the month\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              3 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS\n3. Identify and \ncommunicate \nissues arising \nin the \nworkplace \n3.1 Issues and problems are \nidentified as they arise \n3.2 Information regarding \nproblems and issues are \norganized coherently to \nensure clear and effective \ncommunication \n3.3 Dialogue is initiated with \nappropriate personnel \n3.4 Communication problems \nand issues are raised as \nthey arise \n \n Types of issues and \nproblems in the \nworkplace \n Written and \nelectronic \ncommunication \nmethods \n Communication \nbarriers affecting \nworkplace \ndiscussions \n Identifying cause of \nproblems \n Identifying \nproblems and \nissues \n Organizing \ninformation on \nproblems and \nissues \n Relating problems \nand issues in the \nworkplace\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08 \n TR – Electrical Installation and Maintenance NC III (Amended)       Promulgated December 16, 2015              4 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Methods of \ncommunication \n1.1. Non-verbal gestures \n1.2. Verbal \n1.3. Face to face \n1.4. Two-way radio \n1.5. Speaking to groups \n1.6. Using telephone \n1.7. Written \n1.8. Internet \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nDealt with a range of communication/information at one \ntime \n1.2. \nMade constructive contributions in workplace issues \n1.3. \nSought workplace issues effectively \n1.4. \nResponded to workplace issues promptly \n1.5. \nPresented information clearly and effectively written form \n1.6. \nUsed appropriate sources of information \n1.7. \nAsked appropriate  questions \n1.8. \nProvided accurate information  \n2. Resource \nImplications \nThe following resources MUST be provided: \n2.1. \nVariety of Information \n2.2. \nCommunication tools \n2.3. \nSimulated workplace \n3. Methods of \nAssessment \nCompetency may be assessed through: \n3.1. \nCompetency in this unit must be assessed through \n3.2. \nDirect Observation \n3.3. \nInterview \n4. Context  for \nAssessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment\n",
