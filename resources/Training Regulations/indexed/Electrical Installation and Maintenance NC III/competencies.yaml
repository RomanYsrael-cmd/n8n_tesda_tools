E 36 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 32\n\nUNIT TITLE\n:\nTERMINATE AND CONNECT ELECTRICAL WIRING\nAND ELECTRONICS CIRCUIT\n\nUNIT CODE\n:\nELC311206\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, (and) attitudes and\nvalues needed to terminate and connect electrical wiring\nand electronic circuits\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\ntermination/\nconnection of\nelectrical\nwiring/electronic\ns circuits\n1.1. Materials are checked\naccording to specifications\nand tasks\n1.2. Appropriate tools and\nequipment are selected\naccording to tasks\nrequirements\n1.3. Task is planned to ensure\nOH & S guidelines and\nprocedures are followed\n1.4. Electrical wiring/electronic\ncircuits are correctly\nprepared for\nconnecting/termination in\naccordance with\ninstructions and work site\nprocedures\n• Use of tools\n• Use of test\ninstruments/\nequipment\n• Electrical theory\n• Principals of AC\nand DC\n• OH & S guidelines\nand procedures\n• Basic electrical and\nelectronic devices\n• Reading skills\nrequired to\ninterpret work\ninstruction\n• Checking\nmaterials for\nconformance to\nspecifications\n• Checking existing\nand new\ninstallation site for\ncorrect location\nand specification\n2. Terminate/\nconnect\nelectrical wiring/\nelectronic\ncircuits\n2.1. Safety procedures in using\ntools are observed at all\ntimes and appropriate\npersonal protective\nequipment are used\n2.2. Work is undertaken safely\nin accordance with the\nworkplace and standard\nprocedures\n2.3. Appropriate range of\nmethods in termination/\nconnection are used\naccording to specifications,\nmanufacturer’s\nrequirements and safety\n2.4. Correct sequence of\noperation is followed\n2.5. Accessories used are\nadjusted, if necessary\n2.6. Confirmed\ntermination/connection is\nundert