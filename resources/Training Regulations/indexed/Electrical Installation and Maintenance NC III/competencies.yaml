  "source_section_text": "SECTION 2. COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the units of competency required in\nELECTRICAL INSTALLATION & MAINTENANCE NC III. These units of competency are\ncategorized into basic, common and core competencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311109\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto lead in the dissemination and discussion of ideas,\ninformation and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1. Appropriate\ncommunication method\nis selected\n1.2. Multiple operations\ninvolving several topics\nareas are communicated\naccordingly\n1.3. Questions are used to\ngain extra information\n1.4. Correct sources of\ninformation are identified\n1.5. Information is selected\nand organized correctly\n1.6. Verbal and written\nreporting is undertaken\nwhen required\n1.7. Communication skills are\nmaintained in all situations\n• Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n• Effective verbal\ncommunication\nmethods\n• Methods of\nCommunication\n• Types of Question\n• Communication\nTools\n• Questioning\nTechniques\n• Organizing\ninformation\n• Understanding and\nconveying intended\nmeaning\n• Participating in\nvariety of workplace\ndiscussions\n• Complying with\norganization\nrequirements for\nthe use of written\nand electronic\ncommunication\nmethods\n• Reporting\noccupational\nhazards during\nsafety meeting\n2. Lead\nworkplace\ndiscussions\n2.1. Response to workplace\nissues are sought\n2.2. Response to workplace\nissues are provided\nimmediately\n2.3. Constructive contributions\nare made to workplace\ndiscussions on such\nissues as production,\nquality and safety\n2.4. Goals/objectives and\naction plan are\nundertaken in the\nworkplace are\ncommunicated\n• Leading as a\nmanagement\nfunction\n• Barriers of\ncommunication\n• Effective verbal\ncommunication\nmethods\n• Methods/ techniques\nof discussion\n• How to lead\ndiscussion\n• How to solicit\nresponse\n• Goal setting and\naction planning\n• Communicating\neffectively\n• Consulting the crew\non the prepared\nmenu for the month\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 3\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n3.1 Issues and problems are\nidentified as they arise\n3.2 Information regarding\nproblems and issues are\norganized coherently to\nensure clear and effective\ncommunication\n3.3 Dialogue is initiated with\nappropriate personnel\n3.4 Communication problems\nand issues are raised as\nthey arise\n\n• Types of issues and\nproblems in the\nworkplace\n• Written and\nelectronic\ncommunication\nmethods\n• Communication\nbarriers affecting\nworkplace\ndiscussions\n• Identifying cause of\nproblems\n• Identifying\nproblems and\nissues\n• Organizing\ninformation on\nproblems and\nissues\n• Relating problems\nand issues in the\nworkplace\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face to face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with a range of communication/information at one\ntime\n1.2.\nMade constructive contributions in workplace issues\n1.3.\nSought workplace issues effectively\n1.4.\nResponded to workplace issues promptly\n1.5.\nPresented information clearly and effectively written form\n1.6.\nUsed appropriate sources of information\n1.7.\nAsked appropriate questions\n1.8.\nProvided accurate information\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1.\nVariety of Information\n2.2.\nCommunication tools\n2.3.\nSimulated workplace\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1.\nCompetency in this unit must be assessed through\n3.2.\nDirect Observation\n3.3.\nInterview\n4. Context for\nAssessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 5\nUNIT OF COMPETENCY : LEAD SMALL TEAMS\nUNIT CODE\n : 500311110\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1. Work requirements are\nidentified and presented\nto team members\n1.2. Reasons for instructions\nand requirements are\ncommunicated to team\nmembers\n1.3. Team members’ queries\nand concerns are\nrecognized, discussed\nand dealt with\n• Company policies and\nprocedures\n• How performance\nexpectations are set\n• Methods of Monitoring\nPerformance\n• Client expectations\n• Team member’s\nduties and\nresponsibilities\n• Definition of Team\n• Skills and techniques\nin promoting team\nbuilding\n• Up-to-date\ndissemination of\ninstructions and\nrequirements to\nmembers\n• Art of listening and\ntreating individual\nteam members\nconcern\n• Communication\nskills required for\nleading teams\n• Team building\nskills\n• Negotiating skills\n• Evaluation skills\n2. Assign\nresponsibilities\n2.1 Duties and responsibilities\nare allocated having regard\nto the skills, knowledge\nand aptitude required to\nproperly undertake the\nassigned task and\naccording to company\npolicy\n2.2 Duties are allocated having\nregard to individual\npreference, domestic and\npersonal considerations,\nwhenever possible\n• Concept of delegation\n• How to delegate\n• Understanding\nindividual differences\n• Methods of monitoring\nperformance\n• Duties and\nresponsibilities of\neach team member\n• Knowledge in\nidentifying each team\nmember duties and\nresponsibilities\n• Delegating skills\n• Identifying\nindividual skills,\nknowledge and\nattitude as basis\nfor allocating\nresponsibilities\n• Identifying each\nteam member\nduties and\nresponsibilities\n3. Set\nperformance\nexpectations\nfor team\nmembers\n3.1 Performance expectations\nare established based on\nclient needs and according\nto assignment\nrequirements\n3.2 Performance expectations\nare based on individual\nteam members duties and\narea of responsibility\n\n• Definition of\nperformance\nindicators/ criteria\n• Definition of team\ngoals and\nexpectations\n• Methods of monitoring\nperformance\n• Client expectations\n• Identifying\nperformance\nindicators\n• Evaluating\nperformance\n• Setting individual\nperformance\ntarget/\nexpectation\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 6\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.3 Performance expectations\nare discussed and\ndisseminated to individual\nteam members\n• Team members duties\nand responsibilities\n• Defining performance\nexpectations criteria\nindicators\n4. Supervise\nteam\nperformance\n4.1 Monitoring of\nperformance takes place\nagainst defined\nperformance criteria and/or\nassignment instructions\nand corrective action taken\nif required\n4.2 Team members are\nprovided with feedback,\npositive support and advice\non strategies to overcome\nany deficiencies\n4.3 Performance issues\nwhich cannot be rectified or\naddressed within the team\nare referenced to\nappropriate personnel\naccording to employer\npolicy\n4.4 Team members are kept\ninformed of any changes in\nthe priority allocated to\nassignments or tasks\nwhich might impact on\nclient/customer needs and\nsatisfaction\n4.5 Team operations are\nmonitored to ensure that\nemployer/client needs and\nrequirements are met\n4.6 Follow-up communication\nis provided on all issues\naffecting the team\n4.7 All relevant documentation\nis completed in accordance\nwith company procedures\n• Understanding\nMonitoring of work\n• How to undertake\ncorrective action\n• Understanding\nfeedback and\nprocedure\n• Feedback reporting\nprocedure\n• Methods of monitoring\nperformance\n• Team member’s\nduties and\nresponsibilities\n• Monitoring team\noperation to ensure\nclient needs and\nsatisfaction\n• Monitoring skills\n• Setting priorities\n• Evaluating\nperformance\n• Informal/ formal\ncounseling skills\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s concerns\n2.1. Roster/shift details\n3. Monitor performance\n3.1. Formal process\n3.2. Informal process\n4. Feedback\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\nEVIDENCE GUIDE\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team performance\ngiven a variety of possible scenario\n1.2. Assessed and monitored team and individual performance\nagainst set criteria\n1.3. Represented concerns of a team and individual to next level\nof management or appropriate specialist and to negotiate on\ntheir behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the needs of\nthe tasks to be performed\n1.5. Set and communicated performance expectations for a range\nof tasks and duties within the team and provided feedback to\nteam members\n2. Resource\nImplications\nThe following resources MUST be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2.\nMaterials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1. Direct observations of work activities of the individual\nmember in relation to the work activities of the group\n3.2. Observation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3. Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n4. Context for\nAssessment\n4.1. Competency assessment may occur in workplace or any\nappropriately simulated environment\n4.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 8\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required to\ncollect information in order to negotiate to a desired outcome\nand participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Plan\nnegotiations\n1.1 Information on preparing\nfor negotiation is identified\nand included in the plan\n1.2 Information on creating\nnonverbal environments\nfor positive negotiating is\nidentified and included in\nthe plan\n1.3 Information on active\nlistening is identified and\nincluded in the plan\n1.4 Information on different\nquestioning techniques is\nidentified and included in\nthe plan\n1.5 Information is checked to\nensure it is correct and up-\nto- date\n• Knowledge on\nCodes of practice\nand guidelines for\nthe organization\n• Knowledge of\norganizations\npolicy and\nprocedures for\nnegotiations\n• Decision making\nand conflict\nresolution\nstrategies\nprocedures\n• Concept of\nnegotiation\n\n• Communication\nskills (verbal and\nlistening)\n• Active listening\n• Setting conflict\n• Preparing conflict\nresolution\n• Problem solving\nstrategies on how\nto deal with\nunexpected\nquestions and\nattitudes during\nnegotiation\n• Interpersonal skills\nto develop rapport\nwith other parties\n2. Participate in\nnegotiations\n2.1 Criteria for successful\noutcome are agreed upon by\nall parties\n2.2 Desired outcome of all\nparties are considered\n2.3 Appropriate language is\nused throughout the\nnegotiation\n2.4 A variety of questioning\ntechniques are used\n2.5 The issues and processes\nare documented and agreed\nupon by all parties\n2.6 Possible solutions are\ndiscussed and their viability\nassessed\n2.7 Areas for agreement are\nconfirmed and recorded\n2.8 Follow-up action is agreed\nupon by all parties\n• Outcome of\nnegotiation\n• Knowledge on\nLanguage\n• Different\nQuestioning\ntechniques\n• Problem solving\nstrategies on how\nto deal with\nunexpected\nquestions and\nattitudes during\nnegotiation\n\n• Negotiating skill\n• Communication\nskills (verbal and\nlistening)\n• Observation skills\n• Interpersonal skills\nto develop rapport\nwith other parties\n• Applying effective\nquestioning\ntechniques\n• Setting conflict\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1