          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nIdentified the problem \n1.2. \nDetermined the fundamental causes of the problem \n1.3. \nDetermined the correct / preventive action \n1.4. \nProvided recommendation to manager \nThese aspects may be best assessed using a range of \nscenarios / case studies / what ifs as a stimulus with a walk \nthrough forming part of the response. These assessment \nactivities should include a range of problems, including new, \nunusual and improbable situations that may have happened. \n2. Resource \nImplications \nAssessment will require access to an operating plant over an \nextended period of time, or a suitable method of gathering \nevidence of operating ability over a range of situations. A bank of \nscenarios / case studies / what ifs will be required as well as bank \nof questions which will be used to probe the reason behind the \nobservable action.  \n3.  Methods of \nAssessment \nCompetency may be assessed through: \n3.1. Case studies on solving problems in the workplace \n3.2.  Observation \nThe unit will be assessed in a holistic manner as is practical and \nmay be integrated with the assessment of other relevant units of \ncompetency. Assessment will occur over a range of situations, \nwhich will include disruptions to normal, smooth operation. \nSimulation may be required to allow for timely assessment of \nparts of this unit of competency. Simulation should be based on \nthe actual workplace and will include walk through of the \nrelevant competency components.  \n4. Context for \nAssessment \nIn all workplace, it may be appropriate to assess this unit \nconcurrently with relevant teamwork or operation units.",
