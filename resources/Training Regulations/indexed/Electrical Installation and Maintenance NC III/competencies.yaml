iplication\n• Applying theory into\nactual application on\nshipboard catering\nprocesses\n2. Apply\nmathematical\nprocedure/\nsolution\n2.1. Mathematical techniques\nare applied based on the\nproblem identified\n2.2. Mathematical\ncomputations are\nperformed to the level of\naccuracy required for the\nproblem\n2.3. Results of mathematical\ncomputation is\ndetermined and verified\nbased on job\nrequirements\n• Problem-based\nquestions\n• Estimation\n• Use of mathematical\ntools and standard\nformulas\n• Mathematical\ntechniques\n• Solving\nmathematical\ncomputations\n• Converting Metric to\nEnglish\n• Selecting and using\nappropriate and\nefficient techniques\nand strategies to\nsolve problems\n3. Analyze\nresults\n3.1 Result of application is\nreviewed based on\nexpected and required\nspecifications and\noutcome\n3.2 Appropriate action is\napplied in case of error\n\n• Techniques in analyzing\nthe results\n• Process in reviewing the\nresults\n• Precision and accuracy\n• Four fundamental\noperations\n• Steps in solving problem\n• Standard formulas\n• Conversion\nmeasurement\n• Analyzing the result\nbased on the\nspecified\nrequirements\n• Interpreting and\ncommunicating the\nresults of the\nanalysis\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\n TR – Electrical Installation and Maintenance NC III (Amended) Promulgated December 16, 2015 16\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical techniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical techniques\n(e.g. recalculation, re-modeling)\n2.2 Report error to immediate superior for proper\naction\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\nIdentified, applied and reviewed the use of mathematical\nconcepts and techniques to workplace problems\n2. Resource\nImplications\nThe 