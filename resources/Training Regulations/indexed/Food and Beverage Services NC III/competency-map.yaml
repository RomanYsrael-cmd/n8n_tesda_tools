  "source_text": "SECTION 1 FOOD AND BEVERAGE SERVICES NC III QUALIFICATION\n\nThe FOOD AND BEVERAGE SERVICES NC III Qualification consists of competencies\nthat a person must achieve to deliver and supervise food and beverage service operations in\nvarious food and beverage service facilities.\n\nThis Qualification is packaged from the competency map of the Tourism Sector (Hotel\nand Restaurant) as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311319\nLead workplace communication\n400311320\nLead small teams\n400311321\n\n400311322\nApply critical thinking and problem-solving techniques in\nthe workplace\nWork in a diverse environment\n400311323\n\n400311324\n400311325\n400311326\n400311327\nPropose methods of applying learning and innovation in\nthe organization\nUse information systematically\nEvaluate occupational safety and health work practices\nEvaluate environmental work practices\nFacilitate entrepreneurial skills for micro-small-medium\nenterprises (MSMEs)\n\nCODE NO.\nCOMMON COMPETENCIES\nTRS141201 Receive and resolve customer complaints\nTRS141202 Work cooperatively in a general administration environment\nTRS141203 Maintain quality customer/guest service\nTRS141204 Roster staff\nTRS141205 Control and Order stock*\nTRS141206 Prepare and deliver training sessions\nTRS311207 Plan, conduct and evaluate staff performance assessment\n\nCODE NO.\nCORE COMPETENCIES\nTRS513301 Direct and lead service team in the dining area/restaurant\nTRS513302 Promote and prepare extensive range of food and beverage products\n for table side service requirements\nTRS513303 Organize functions related to Food and Beverage Service at a hotel or\n restaurant\nTRS513304 Process financial sale transactions\nTRS513305 Monitor and maintain stock\n\nA person who has achieved this Qualification is competent to be a:\n❑ Assistant Head Water/Waitress\n❑ Head Waiter/Waitress\n❑ Maitre d’Hotel\n❑ Captain Waiter/Waitress\n❑ Banquet Head Waiter/Waitress\n\n--- PDF PAGE 6 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n2"
