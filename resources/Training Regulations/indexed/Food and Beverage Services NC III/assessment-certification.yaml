  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s)\nof competency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence in all unit/s of competency of a qualification with a promulgated\nTraining Regulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the evidence guide of the relevant unit/s\nof competency.\n\n4.1.3 Holders of valid National Certificate (NC) Food and Beverage Services NC\nIII will have to undergo re-assessment to the amended TR for Food and\nBeverage Services NC III;\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through competency\nassessment:\n\n4.1.5 The industry shall determine assessment and certification requirements for\neach qualification with promulgated Training Regulations: It includes the\nfollowing:\n\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\nd. specific assessment and certification arrangements as identified by\nindustry\n\n4.2 Competency Assessment Requisite\n\n--- PDF PAGE 164 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 160\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of accreditation\nprocedure before they are authorized by TESDA to assess the\ncompetencies of candidates for National Certification.\n.\nFor Trainer-Assessor\n• Must be a holder of National TVET Trainer Certificate (NTTC) Level I\nin Food and Beverage Services NC III\n• Must have at least 2 years industry experience as waiter, head waiter\nor in at least a supervisory level position or at least 3 years teaching\nexperience in the related field\n• Have assisted in the actual conduct of assessment to at least two (2)\ncandidates.\n\nFor Industry Assessor\n• Holder of National Certificate in Food and Beverage Services NC III\n• Holder of Certificate of Competency (COC) in Conduct Competency\nAssessment under the Trainers Methodology Level I (TM I)\n• Must have at least 2 years industry experience as a Captain Waiter or\nHead Waiter or at least a supervisory level position in the food and\nbeverage department\n• Have assisted in the actual conduct of assessment to at least two (2)\ncandidates.\n\n--- PDF PAGE 165 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 161\n\nANNEX A\n\nLead\nworkplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques\nin the\nworkplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation\nin the\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironmental\nwork\npractices\n\nFacilitate\nentrepreneurial\nskills for\nmicro-small-\nmedium\nenterprises\n(MSMEs)\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine\nproblems\nEnhance\nself-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth\npolicies and\nprocedures\nApply\nenvironmental\nwork standards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth\npolicies and\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\n\nCOMPETENCY MAP - TOURISM Sector\n(Hotel and Restaurant)\n FOOD AND BEVERAGE SERVICES NC III\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 166 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 162\n\nUtilize\nspecialize\nspecialized\ncommunication\nskill\nDevelop\nand lead\nteams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\neval