SERVICES NC III Revision 02 Promulgated (10/29/2018) 163\n\nDirect and lead service\nteam in the dining\narea/ restaurant\nPromote and prepare\nextensive range of food and\nbeverage products for table\nside service requirements\nOrganize functions related to\nFood and Beverage Service at\na hotel or restaurant\n\nProcess financial sale\ntransactions\nMonitor and maintain\nstock\nManage food and\nbeverage service\nteam\nOversee dining area\noperations\nImplement food and\nbeverage promotional\nactivities\nOrganize catering functions\n\nManage a Food and\nBeverage Operation\nDevelop Entrepreneurial\nOpportunities for the Food and\nBeverage Operations\nMonitor Food and Beverage\nRevenues and Expenditures\nManage the Effective Use of\nHuman Resources in Food\nand Beverage Operations\n\n--- PDF PAGE 168 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 164\n\nGLOSSARY OF TERMS\n\n1. Banquet – a function held inside a hotel.\n2. Break Even Analysis – the point at which revenue received equals the costs\nassociated with receiving the revenue\n3. Complaints-products and services that give dissatisfaction to customers.\n4. Corrective action-improvements to an organization's processes taken to eliminate\ncauses of non-conformities or other undesirable situations.\n5. Cost estimates- the approximation of the cost of a program, project, or operation;\nthe cost estimate is the product of the cost estimating process.\n6. Critical thinking skill- the ability to actively conceptualize, apply, analyze,\nsynthesize, and/or evaluate information gathered from, or generated by,\nobservation, experience, reflection, reasoning, or communication, as a guide to\nbelief and action.\n7. Cross-training-training in two or more related tasks, jobs or skills to enhance job\nperformance\n8. Delegation- the assignment of responsibility or authority to another person\n(normally from a manager to a subordinate) to carry out specific activities.\n9. Employee feedback-either positive or negative comments from the superior\n10. English language proficiency- a high degree of competence or skill in\ncommunicating in English language.\n11. Ethics- standards of behavior or moral principles that govern a person's or group's\nbehavior\n12. Fixed costs - costs which remain constant regardless of production volumes\n13. Food safety- the principle which involves proper table ware handling, food handling\nand employee hygiene practices\n14. Function book- in a hotel or conference center, the official record that controls\nroom assignments for meetings and other events\n15. Function costs-the cost or value of supplies for a certain event\n16. Function sheet- document that outlines the details of an event ; it serves as a\nguideline for the hotel or restaurant to execute and communicate logistics to all\nnecessary departments.\n17. Function style-the nature of event or banquet that requires food and beverage\nservice.\n\n--- PDF PAGE 169 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 165\n\n18. Informal feedback- the in-the moment advice outside of the formal performance\nreview.\n19. Liaise- establish a working relationship, typically in order to cooperate on a matter\nof mutual concern.\n20. Literacy skill- the skills needed for reading and writing. They include such things\nas awareness of the sounds of language, awareness of print and the relationship\nbetween letters and sounds. Other literacy skills include vocabulary, spelling, and\ncomprehension\n21. Marketing- the action or business of promoting and selling products or services,\nincluding market research and advertising.\n22. Market intelligence- the information relevant to a company's markets, gathered\nand analyzed specifically for the purpose of accurate and confident decision-\nmaking in determining strategy in areas such as\nmarket opportunity, market penetration strategy, and market development.\n23. Marketing plan- is a comprehensive blueprint which outlines an organization's\noverall marketing efforts.\n24. On-Premise-refers to the venue of the function that is usually inside a hotel.\n25. Off-Premise-refers to the venue of the function that is usually in any available area\nexcept inside the hotel.\n26. POS (Point of Sale)-a computer software that is used in processing food and\nbeverage orders, bills and other necessary reports essential in managing an\noutlet.\n27. Potential revenue- the possible amount of money that a company actually\nreceives during a specific period; possible gross income\n28. Proposal - a formal offer to do work/provide products &services for someone or a\nbusiness\n29. Prospects- people who are potential customer, client, etc\n30. Request for Tender/Proposal - a document from a person or business asking you\nto tender for the provision of identified products and services\n31. Risk management standards- the standards in forecasting and evaluating the\nfinancial risks together with the identification of procedures to avoid or minimize\ntheir impact\n32. Roster-list of employees with their assigned job or task schedules.\n33. Running sheet- a list of every task that needs to be done for an event: it is set up\nin the order the tasks will begin.\n\n--- PDF PAGE 170 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 166\n\n34. Sales activities- initiatives and actions to increase the revenue of a food service\nfacility.\n35. Sales calls- pre-arranged and face-to-face meeting between a salesperson and\na customer or prospect for the purpose of generating a sale.\n36. Sales meeting- gathering in which a product or service is being discussed, and the\nbenefits are outlined to the potential buyer; not always a presentation format; it can\nsometimes be an informal conversation, phone call or online affair to promote\nproducts and services to prospects.\n37. Sales report- record of calls made and products sold during a particular time\nframe kept by a salesperson or their management.\n38. Self-management skill- defined as the personal application of behavior change\ntactics that produces a desired change in behavior. The term self-control is also\nused to refer to this type of behavior change program.\n39. Service levels- measure the performance of a system; certain goals are\ndefined and the service level gives the percentage to which those goals should be\nachieved\n40. Service points-areas where the actual pick-up of food after production are located\n41. Service stations-the areas where the wait staff place the necessary and extra\nsupplies such as table wares for re-setting and sometimes beverages for re-filling.\n42. Service style-the manner of serving food from the production area to dining area.\n43. Sustainability issues-issues on activities in meeting the present and future\nbusiness supplies of products or services, including reducing waste, reusing\nsupplies or recycling.\n44. Tender - proposal\n45. Training skill- teaching, or developing in oneself or others, any skills and\nknowledge that relate to specific useful competencies usually to improving one's\ncapability, capacity, productivity and performance.\n46. Variable Costs - costs associated with expenditure which varies with levels/volume\nof production\n\n--- PDF PAGE 171 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 167\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nFood and Beverage Services NC III\nQualification Code:\nTRSFBS318\n\nRevision\nNo.\nDocument\nDescription Types*\nReplaces\nVersion\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA\nBoard\nResolution\nNo./ Date)\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nFood and Beverage\nServices NC III\n2007-13 /\n04/20/07\nNot Applicable\nNot\nApplicable\n01\nDocument Amended\nFood and Beverage\nServices NC III\n2007-13 /\n04/20/07\n2013-17 /\n12/17/13\nNot\nApplicable\n02\nDocument Amended\nFood and Beverage