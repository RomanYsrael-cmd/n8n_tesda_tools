      "text": "Competency Assessment Requisite FOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 160 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior ` 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. . For Trainer-Assessor • Must be a holder of National TVET Trainer Certificate (NTTC) Level I in Food and Beverage Services NC III • Must have at least 2 years industry experience as waiter, head waiter or in at least a supervisory level position or at least 3 years teaching experience in the related field • Have assisted in the actual conduct of assessment to at least two (2) candidates. For Industry Assessor • Holder of National Certificate in Food and Beverage Services NC III • Holder of Certificate of Competency (COC) in Conduct Competency Assessment under the Trainers Methodology Level I (TM I) • Must have at 