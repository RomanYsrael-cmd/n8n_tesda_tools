 of trade\n\n•\nComplete end of shift documentation in\naccordance with enterprise policy\n\n•\nLecture-\ndiscussion\n\n•\nSimulation\n• Observation\n• Demonstration\n• Written test\n• Oral\nExamination\n\n6 Hours\n•\nDetermine balance between register/terminal\nreading and cash and non-cash totals\n•\nLecture-\ndiscussion\n•\nIndividual\nactivity\n• Written test\n• Oral questioning\n•\nInvestigate and resolve discrepancies with\ntakings in accordance with enterprise policy\n•\nLecture-\n•\nDiscussion\n•\nSimulation\n• Written test\n• Oral questioning\n• Case study\n\n--- PDF PAGE 155 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n151\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n5. Monitor and\nmaintain stock\n5.1 Accept\ndelivery of\nstock\n\n•\nCheck stock received against stock ordered\n•\nLecture-\ndiscussion\n•\nIndividual\nactivity\n• Written test\n• Oral questioning\n\n8 Hours\n•\nFollow-up variations between delivery and\ndocumentation are identified and relevant\ndocumentation\n•\nLecture\n•\nDiscussion\n•\nGroup\nDiscussion\n\n• Written test\n• Oral questioning\n\n•\nIdentify stock to be returned to the supplier.\n•\nLecture\n•\nDiscussion\n•\nGroup\nDiscussion\n• Written test\n• Oral questioning\n• Case study\n\n•\nManage excess stock within the organization\n•\nLecture\n•\nDiscussion\n•\nGroup\nDiscussion\n• Written test\n• Oral questioning\n• Case study\n\n•\nSecure new stock against damage and/or theft\n\n•\nLecture\n•\nDiscussion\n•\nGroup\nDiscussion\n• Written test\n• Oral questioning\n• Case study\n\n5.3 Store stock\n\n•\nMove stock to the required operational area\n•\nLecture\n•\nDiscussion\n•\nSimulation\n• Written test\n• Oral questioning\n• Case study\n\n6 Hours\n•\nApply appropriate occupational health and\nsafety skills according to the enterprise policy\n•\nLecture\n•\nDiscussion\n•\nDemonstration\n•\nSimulation\n• Written test\n• Oral questioning\n• Case study\n• Demonstration\n•\nRemove waste from the storage areas following\nthe standard procedures of the enterprise.\n•\nLecture\n•\nDemonstration\n\n• Observation\n• Written test\n• Oral questioning\n• Case study\n\n--- PDF PAGE 156 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n152\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n5.3 Maintain\ninventory and\nstorage areas\n•\nControl inventory of food, equipment, small\nware and liquors in accordance with the\nenterprise procedures\n• Lecture-\ndiscussion\n• Observation\n• Oral Questioning\n• Case study\n\n8 Hours\n\n•\nCheck slow and fast moving items in\naccordance with enterprise standards.\n\n• Lecture-dicussion\n• Group discussion\n\n• Observation\n• Oral Questioning\n• Case study\n\n•\nRotate stock aligning with enterprise and stock\nitem requirements\n• Lecture\n• Discussion\n• Group discusion\n• Observation\n• Written test\n• Oral\nExamination\n•\nTake remedial action where stock related issues\nare identified\n• Lecture\n• Discussion\n• Group discussion\n• Observation\n• Written test\n• Oral\nExamination\n• Case study\n•\nRequest needed food items, supplies and\nequipment to ensure quality and timely delivery\nof service.\n• Lecture\n• Group Discussion\n• Demonstration\n• Simulation\n\n• Observation\n• Written test\n• Oral\nExamination\n\n--- PDF PAGE 157 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 153"
