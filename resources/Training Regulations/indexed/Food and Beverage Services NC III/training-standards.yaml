    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for FOOD AND BEVERAGE SERVICES NC III\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\n Course Title: FOOD AND BEVERAGE SERVICES NC Level: III\n\nNominal Training Duration: 40 Hours (Basic)\n\n 96 Hours (Common)\n\n 214 Hours (Core)\n\n 350 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills, and attitudes in\naccordance with industry standards. This covers competencies that a person must\nachieve in performing task such as directing and leading service team in the dining area,\norganizing and preparing specialized menu requirements, banquet and catering\nfunctions, processing financial transactions and monitoring and maintaining stock.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for\nthis qualification must be achieved.\n\n--- PDF PAGE 123 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n119\n\nBASIC COMPETENCIES\n(40 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses\n• Read\no Effective verbal communication\nmethods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Role Play\n• Written Test\n• Observation\n2 Hours\n\n1.2 Lead\nworkplace\ndiscussions\n• Describe:\no Organizational policy on production,\nquality and safety\no Goals/ objectives and action plan\nsetting\n• Read\no Effective verbal communication\nmethods\n• Prepare/set action plans based on\norganizational goals and objectives\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n2 Hours\n\n1.3 Identify and\ncommunicate\nissues arising\nin the\nworkplace\n• Describe:\no Organizational policy in dealing with\nissues and problems\n• Read\n• Effective verbal communication\nmethods\n• Group\ndiscussion\n• Lecture\n• Oral evaluation\n• Written Test\n2 Hours\n\n--- PDF PAGE 124 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n120\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Lead small\nteams\n2.1 Provide team\nleadership\n\n• Discussion of Company policies and\nprocedures\n• Read web pages on situational\nleadership\n• Role play on situational leadership\n•\nGroup work\n•\nRole Play\n•\nLecture/\nDiscussion\n•\nIndividual\nWork\n• Role Play\n• Written Test\n\n1 Hour\n\n2.2 Assign\nresponsibilities\n• Read web pages on performance\nmanagement\n• Case study on allocating roles and\nresponsibilities based on competencies\nof current staff\n\n• Individual Work\n• Case Study\n• Role Play\n• Written Test\n\n1 Hour\n\n2.3 Set\nperformance\nexpectations\nfor team\nmembers\n• Role play to communicate performance\nexpectations with staff\n• Discussion on performance issues\n\n• Lecture/\nDiscussion\n• Role Play\n• Role Play\n• Written Test\n\n1 Hour\n\n2.4 Supervise\nteam\nperformance\n• Discussion on performance monitoring\n• Role play on providing feedback on\nperformance\n• Role play on performance coaching\n• Discussion on keeping the team\ninformed of team performance\n• Case study on Team performance\nmonitoring and feedback\n• Lecture/\nDiscussion\n• Role Play\n• Case Study\n• Role Play\n• Written Test\n\n1 Hour\n3. Apply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n3.1 Examine\nspecific\nworkplace\nstrategies\n\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n• Show mastery of the current industry\nhardware and software products and\nservices\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 125 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n121\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Discuss process of identification of\nfundamental causes of specific\nworkplace challenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n- Relevant equipment and\noperational processes\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n\n3.2 Analyze the\ncauses of\nspecific\nworkplace\nchallenges\n\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n• Show mastery of the current industry\nhardware and software products and\nservices\n• Discuss process of identification of\nfundamental causes of specific\nworkplace challenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n- Relevant equipment and\noperational processes\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 126 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n122\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-\nsolving techniques\n• Formulate clear-cut findings on the\nnature of each identified workplace\nchallenges\n\n3.3 Formulate\nresolutions to\nspecific\nworkplace\nchallenges\n\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n• Show mastery of the current industry\nhardware and software products and\nservices\n• Discuss process of identification of\nfundamental causes of specific\nworkplace challenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n- Relevant equipment and\noperational processes\n- Enterprise goals, targets and\nmeasures\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n\n1 Hour\n\n--- PDF PAGE 127 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n123\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-\nsolving techniques\n• Formulate clear-cut findings on the\nnature of each identified workplace\nchallenges\n• Discus strategies on devising,\ncommunicating, implementing and\nevaluating strategies and techniques in\naddressing specific workplace\nchallenges\n\n3.4 Implement\naction\nplans and\ncommunicate\nresults\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-\nsolving techniques\n• Formulate clear-cut findings on the\nnature of each identified workplace\nchallenges\n• Discus strategies on devising,\ncommunicating, implementing and\nevaluating strategies and techniques in\naddressing specific workplace\nchallenges\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 128 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n124\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4. Work in a\ndiverse\nenvironment\n\n4.1 Develop an\nindividual’s\ncultural\nawareness and\nsensitivity\n• Show understanding of cultural\ndiversity in the workplace\n• Recognize norms of behavior for\ninteracting and dialogue with specific\ngroups (e. g., Muslims and other non-\nChristians, non-Catholics, tribes/ethnic\ngroups, foreigners)\n• Demonstrate different methods of\nverbal and non-verbal communication\nin a multicultural setting\n• Apply cross-cultural communication\nskills (i.e. different business customs,\nbeliefs, communication strategies)\n• Show affective skills – establishing\nrapport and empathy, understanding,\netc.\n• Demonstrate openness and flexibility\nin communication\n• Recognize diverse groups in the\nworkplace and community as defined\nby divergent culture, religion, traditions\nand practices\n\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 Hour\n\n4.2 Work\neffectively in\nan\nenvironment\nthat\nacknowledges\nand values\ncultural\ndiversity\n• Explain the value of diversity in the\neconomy and society in terms of\nWorkforce development\n• Discuss the importance of\ninclusiveness in a diverse environment\n• Discuss the importance of shared\nvision and understanding of and\ncommitment to team, departmental,\nand organizational goals and\nobjectives\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n1 Hour\n\n--- PDF PAGE 129 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n125\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Identify and exhibit strategies for\ncustomer service excellence\n• Demonstrate cross-cultural\ncommunication skills and active\nlistening\n• Recognize diverse groups in the\nworkplace and community as defined\nby divergent culture, religion, traditions\nand practices\n• Demonstrate collaboration skills\n• Written\nexamination\n• Role Playing\n\n4.3 Identify\ncommon\nissues in a\nmulticultural\nand diverse\nenvironment\n• Explain the value, and leverage of\ncultural diversity\n• Discuss the inclusivity and conflict\nresolution\n• Describe the workplace harassment\n• Explain the change management and\ncite ways to overcome resistance to\nchange\n• Demonstrate advanced strategies for\ncustomer service excellence\n• Address diversity-related conflicts in\nthe workplace\n• Eliminate discriminatory behavior\ntowards customers and co-workers\n• Utilize change management policies in\nthe workplace\n\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 Hour\n5. Propose\nmethods of\napplying\nlearning and\ninnovation in\nthe organization\n5.1 Assess work\nprocedures,\nprocesses and\nsystems in\nterms of\ninnovative\npractices\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\nconcepts and transtheoretical model of\nbehavior change)\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n1 Hour\n\n--- PDF PAGE 130 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n126\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n5.2 Generate\npractical action\nplans for\nimproving work\nprocedures,\nprocesses\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\nconcepts and transtheoretical model of\nbehavior change)\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n• Set up action plans on how to apply\ninnovative procedures in the\norganization\n• Set up action plans on how to apply\ninnovative procedures in the\norganization\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n--- PDF PAGE 131 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n127\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.3 Evaluate the\neffectiveness\nof the\nproposed\naction plans\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\nconcepts and transtheoretical model of\nbehavior change)\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on\ncontinuous improvement\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n6. Use information\nsystematically\n\n6.1 Use technical\ninformation\n• Lecture and discussion on:\n- Application in collating information\n- Procedures for inputting,\nmaintaining and archiving\ninformation\n- Guidance to people who need to\nfind and use information\n• Organizing information into a suitable\nform for reference and use\n• Classify stored information for\nidentification and retrieval\n• Operate the technical information\nsystem by using agreed procedures\n• Lecture\n• Group\nDiscussion\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n4 Hours\n\n--- PDF PAGE 132 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n128\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n6.2 Apply\ninformation\ntechnology (IT)\n• Lecture and discussion on:\n- Attributes and limitations of available\nsoftware tool\n- Procedures and work instructions for\nthe use of IT\n- Operational requirements for IT\nsystems\n- Sources and flow paths of data\n- Security systems and measures that\ncan be used\n- Methods of entering and processing\ninformation\n• Use procedures and work instructions\nfor the use of IT\n• Extract data and format reports\n• Use WWW applications\n• Lecture\n• Group\nDiscussion\n• Self-paced\nhandout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n6.3 Edit, format\nand check\ninformation\n• Lecture and discussion on:\n- Basic file-handling techniques\n- Techniques in checking documents\n- Techniques in editing and formatting\n- Proof reading techniques\n• Use different techniques in checking\ndocuments\n• Edit and format information applying\ndifferent techniques\n• Proof read information applying\ndifferent techniques\n• Lecture\n• Group\nDiscussion\n• Self-paced\nhandout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n7. Evaluate\nOccupational\nSafety And\nHealth Work\nPractices\n7.1 Interpret\nOccupational\nSafety and\nHealth\npractices\n\n• Discuss the OSH standards, principles\nand legislations\n• Identify OSH work practices issues\n• Discuss standard safety requirements\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n3.1 Hours\n\n--- PDF PAGE 133 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n129\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n7.2 Set OSH work\ntargets\n• Discussion in actions plans that are\nnecessary in achieving the OSH target\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n\n7.3 Evaluate\neffectiveness\nof\nOccupational\nSafety and\nHealth work\ninstructions\n• Practice evaluating safety data\n(Historical or Simulated)\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1.1 Hours\n8. Evaluate\nEnvironmental\nWork Practices\n8.1 Interpret\nenvironmental\npractices,\npolicies and\nprocedures\n• Discussion Environmental Issues\nregarding\n- Water Quality\n- National and Local Government\nIssues\n- Safety\n- Endangered Species\n- Noise\n- Air Quality\n- Historic\n- Waste\n- Cultural\n• Updating of existing occupation\npractices\n\n• Lecture\n• Group\nDiscussion\n• Demonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n8.2 Establish\ntargets to\nevaluate\nenvironmental\npractices\n• Discussion on\n-\nlower production costs and\nenergy consumption\n-\nEnvironmentally Sound\nProcesses\n-\nResource Efficient\n• Lecture\n• Group\nDiscussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 Hour\n\n--- PDF PAGE 134 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n130\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n-\nRecycling and Waste\nManagement\n• Simple case study regarding energy\nefficiency\n\n8.3 Evaluate\neffectiveness of\nenvironmental\npractices\n• Identifying effective environmental\npractices relevant to the\nindustry/occupation\n-\nImplementation of energy\nefficiency\n\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Case Study\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n9. Facilitate\nEntrepreneurial\nSkills For Micro-\nSmall-Medium\nEnterprises\n(MSMEs)\n9.1 Develop and\nmaintain micro-\nsmall-medium\nenterprise\n(MSMEs) skills\nin the\norganization\n• Discussions on business models and\nstrategies\n• Discussion on Types and categories\nof businesses and business internal\ncontrol\n• Discussion on Relevant National and\nlocal legislations affecting businesses\n• Prepare promotional materials\n• Practice basic bookkeeping\n\n• Lecture/\nDiscussion\n• Case Study\n• Demonstration\n• Written Test\n• Portfolio\n• Work Related\nProject\n2 Hours\n\n9.2 Establish and\nmaintain client-\nbase/market\n• Role play on customer and employee\nrelations\n• Discussion on Basic product\npromotion strategies\n• Preparation of Basic Feasibility study\n• Case studies on Basic Business\nethics\n• Prepare basic advertising materials\n• Role Play\n• Lecture\nDiscussion\n• Case study\n• Case problem\n• Written Test\n2 Hours\n\n9.3 Apply budgeting\nand financial\nmanagement\nskills\n• Discussion on:\n- Basic cost-benefit analysis\n- Basic financial management\n- Basic financial accounting\n- Business internal controls\n• Role Play\n• Lecture\nDiscussion\n• Group work\n• Written Test\n• Case problem\n1 Hour\n\n--- PDF PAGE 135 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n131\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n--- PDF PAGE 136 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n132\n\nCOMMON COMPETENCIES\n(96 Hours)\n\nUnit of Competency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Receive and resolve customer\ncomplaints\n1.1 Identify and\nanalyse the\ncomplaint\n•\nExplain how to received verbal\ncomplaint using active listening and\nempathy techniques\n•\nIdentify through appropriate\ncommunication techniques the exact\nnature of the customer complaint\n•\nIdentify steps in maintain register or\ncomplaint file/s in accordance with the\nrequirements of the enterprise\ninformation system\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n\n4\nHours\n1.2 Respond to\ncomplaints\n•\nExplain how to process complaints in\naccordance with organizational\nstandards, policies and procedures\n•\nExplain how to obtain and review\ndocumentation in relation to complaints\n•\nIdentify steps in updating register of\ncomplaints/disputes\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n\n4\nHours\n\n1.3 Determine\nand agree\nupon\nappropriate\naction to\nresolve\ncomplaint\n•\nIdentify procedures and guidelines on\nhow to resolve the complaint\n•\nDemonstrate a commitment to the\ncustomer to resolve the complaint\n\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n\n4\nHours\n\n1.4 Refer\ncomplaints\n•\nIdentify complaints that require referral\nto other personnel or external bodies\n•\nExplain how to forward all necessary\ndocumentation including investigation\nreports to appropriate personnel\n\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n• Oral\nQuestioning\n4\nHours\n\n--- PDF PAGE 137 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n133\n\nUnit of Competency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2. Work cooperatively In a general\nadministration environment\n2.1 Develop\neffective\nteam\nrelationships\n•\nExplain how to develop and maintain\nrelationships with team members and\npromote benefits of cooperative work\nconsistent with organizational goals and\nobjectives\n•\nIdentify communication techniques to\nrelay information in a clear and concise\nmanner\n\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nHours\n\n2.2 Participate in\nteam\nassignments\n• Identify individual responsibilities within\nthe workgroup in accordance with\norganisational requirements\n• How to recognize and accommodate\ncultural differences within the team\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nHours\n\n2.3 Contribute to\nteam\ndevelopment\n\n• Identify the internal and external\ncustomer needs and expectations\n• Explain how to seek formal feedback\nand informal feedback on individual and\nteam performance regularly from\ncolleagues and supervisors\n• Identify the non-discriminatory attitudes\nand language when interacting with\ncustomers, staff and management\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nHours\n3. Maintain quality customer/guest\nservice\n\n3.1 Identify\ncustomer/ guest\nrequirements\n• Identify options to improve service\n• Explain how to assess needs of\ncustomers/or guests\n• Identify and conduct data analysis on\ndeficiencies in service delivery\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nHours\n\n--- PDF PAGE 138 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n134\n\nUnit of Competency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n3.2 Ensure\ndelivery of quality\nproducts/services\n•\nExplain how to ensure products/services\nmeet customers’ needs and reflect\nenterprise standards and improve on\nservice levels\n•\nExplain how to ensure team\nperformance consistently meets\nenterprise standards\n•\nExplain to colleagues how to meet and\nexceed customer service standards by\nproviding appropriate professional\ndevelopment\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nHours\n\n3.3 Evaluate\ncustomer service\n\n•\nExplain how to review customer/guest\nsatisfaction with service delivery using\nappropriate methods that produce\nverifiable data\n•\nIdentify steps on how to evaluate\ncustomer service evaluation outcomes\n•\nObtain agreements on appropriate\naction to overcome problems\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nHours\n4. Roster Staff\n\n4.1 Develop and\nimplement\nstaff rosters\n• Explain how to developed rosters in\naccordance with company agreements\nand wage budgets\n• Identify the role of rosters and their\nimportance in controlling staff costs\n• Explain how to present roster