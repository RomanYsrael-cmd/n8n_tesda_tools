 records\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nHours\n\n--- PDF PAGE 139 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n135\n\nUnit of Competency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Simulation\n5. Control And Order Stock\n5.1 Maintain\nstock levels and\nrecords\n• Explain how to monitor and maintain\nstock levels and performance\n• Identify the steps in monitoring stock\nsecurity and adjusting systems\n• Explain how to maintain records of stock\nstorage and movement\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n6\nHours\n\n5.2 Process\nstock orders\n• Explain how to process orders for stock\nin accordance with company procedures\n• Identify steps in maintaining and\nrecording stock levels\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nHours\n\n5.3 Minimize\nstock losses\n• Identify reasons for stock loss and\ndamage\n• Explain how to identify stock losses\n• Identify the recommended related\nprocedures and solutions to loss\nsituations to prevent future avoidable\nlosses\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n4\nHours\n\n5.4 Follow-up\norders\n• Explain how to monitor delivery process\nand ensure continuity of supply\n• Identify routine supply problems\n• Explain how to distribute stock to agreed\nlocations.\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nHours\n\n5.5 Organize and\nadminister\nstocks\n• Explain how to organize stocks\n• Identify the stocktaking responsibilities\n• Discussion\n• Demonstration\n• Lecture\n• Observation\n• Demonstration\n4\nhours\n\n--- PDF PAGE 140 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n136\n\nUnit of Competency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Demonstrate how to produce accurate\nstock reports\n• Group\ndiscussion\n• Simulation\n• Written\nexamination\n• Interview\n\n6. Prepare And Deliver Training\nSessions\n6.1 Determine\ntraining\nrequirements\n\n• Identify required competencies for\nlearners\n• Describe the training gap for learners\n• Explain the identified training gaps and\nrecommendation for training\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nHours\n\n6.2 Prepare\ntraining plan\n\n• Explain how to develop session outlines,\ntraining content, training resources and\nmaterials and individual training session\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nHours\n\n6.3 Deliver\ntraining\nsessions\n\n•\nExplain the training and assessment\nactivities involved in the training session\n•\nIdentify steps in preparing training venue\nfor the training session\n• Identify safety of learners during training\ndelivery and practice\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nHours\n7. Plan, conduct and evaluate staff\nperformance assessment\n\n7.1 Plan a staff\nperformance\nassessment\n•\nIdentify context for staff performance\nassessment\n•\nDetermine the initial focus of the staff\nperformance assessment for each staff\nmember\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n