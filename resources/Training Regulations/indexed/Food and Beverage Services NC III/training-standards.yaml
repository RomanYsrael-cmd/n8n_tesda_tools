      "source_text": "3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of a minimum of\n25 trainees for FOOD AND BEVERAGE SERVICES NC III are as follows:\n\nWAITERING TOOLS, MATERIALS AND EQUIPMENT\nQTY\nDINNERWARE\nQTY\nCUTLERIES\nQTY\nGLASSWARE\n24\nDinner plates, 10”\n24\nDinner knives\n24\nRed wine glasses\n24\nShow/service\nplates, 11-14”\n24\nDinner forks\n24\nWhite wine glasses\n24\nAppetizer / Salad\nplates 7-8”\n24\nSalad knives\n24\nWater goblets\n24\nFish plates, 8-9”\n24\nSalad forks\n24\nJuice glasses/Hi ball\n24\nDessert plates, 7-\n8”\n24\nFish knives\n24\nChampagne flute\n24\nSide plates or\nbread plates, 6”\n24\nFish forks\n24\nCollins glasses\n24\nSoup plate/bowl /\nconsommé cup\n24\nSoup spoons (cream\nand consume)\n24\nPilsner glasses/Ice tea\nglasses\n24\nCups and saucers\n5-6 oz\n24\nDessert spoons\n\nWINE DECANTING\nREQUISITES\n12\nOval platter (small)\n24\nDessert forks\n6\nWine Decanter\n12\nOval platter (large)\n24\nTeaspoons\n6\nCandle / match\n\n24\nCocktail forks\n6\nWater’s friend\n\n12\nService forks\n6\nWine basket\n\n--- PDF PAGE 160 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 156\n\nWAITERING TOOLS, MATERIALS AND EQUIPMENT\nQTY\nDINNERWARE\nQTY\nCUTLERIES\nQTY\nGLASSWARE\n\n12\nService spoons\n\n24\nSteak knives\n\n24\nButter knives\n\n24\nOyster forks\n\nQTY\nOTHER\nSERVICEWARE\nQTY\n\nQTY\nOTHER ACCESSORIES\n6\nCoffee pot\n6\n Table cloths for\nsquare table\n6\nMenu Folders\n6\nTea pot\n6\nSide towels\n6\nOrder pads\n6\nSalt and Pepper\nshakers\n30\n20” x 20” Cloth Table\nnapkin\n6\nBill folder/change trays\n12\nRectangular trays\n6\nTable cloth for round\ntable 8’s\n2\nWaiter station/cabinet\n8\nSilver platters\n\n2\nTray stand (Dummy\nwaiter)\n12\nRound (bar) trays\n\n2\nBoning knives\n4\nTooth pick holders\n\n6\nAll-purpose knives\n6\nNapkin holders\n\n4\nChopping boards\n6\nSugar basin /\ncontainers\n\n10\nUtility bowls/plates\n6\