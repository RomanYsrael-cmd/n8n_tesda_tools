e different techniques in checking\ndocuments\n• Edit and format information applying\ndifferent techniques\n• Proof read information applying\ndifferent techniques\n• Lecture\n• Group\nDiscussion\n• Self-paced\nhandout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n7. Evaluate\nOccupational\nSafety And\nHealth Work\nPractices\n7.1 Interpret\nOccupational\nSafety and\nHealth\npractices\n\n• Discuss the OSH standards, principles\nand legislations\n• Identify OSH work practices issues\n• Discuss standard safety requirements\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n3.1 Hours\n\n--- PDF PAGE 133 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n129\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n7.2 Set OSH work\ntargets\n• Discussion in actions plans that are\nnecessary in achieving the OSH target\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n\n7.3 Evaluate\neffectiveness\nof\nOccupational\nSafety and\nHealth work\ninstructions\n• Practice evaluating safety data\n(Historical or Simulated)\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1.1 Hours\n8. Evaluate\nEnvironmental\nWork Practices\n8.1 Interpret\nenvironmental\npractices,\npolicies and\nprocedures\n• Discussion Environmental Issues\nregarding\n- Water Quality\n- National and Local Government\nIssues\n- Safety\n- Endangered Species\n- Noise\n- Air Quality\n- Historic\n- Waste\n- Cultural\n• Updating of existing occupation\npractices\n\n• Lecture\n• Group\nDiscussion\n• Demonstration\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n1 Hour\n\n8.2 Establish\ntargets to\nevaluate\nenvironmental\npractices\n• Discussion on\n-\nlower production costs and\nenergy consumption\n-\nEnvironmentally Sound\nProcesses\n-\nResource Efficient\n• Lecture\n• Group\nDiscussion\n• Demonstration\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n1 Hour\n\n--- PDF PAGE 134 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n130\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n-\nRecycling and Waste\nManagement\n• Simple case study regarding energy\nefficiency\n\n8.3 Evaluate\neffectiveness of\nenvironmental\npractices\n• Identifying effective environmental\npractices relevant to the\nindustry/occupation\n-\nImplementation of energy\nefficiency\n\n• Lecture\n• Group\nDiscussion\n• Demonstration\n• Case Study\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n9. Facilitate\nEntrepreneurial\nSkills For Micro-\nSmall-Medium\nEnterprises\n(MSMEs)\n9.1 Develop and\nmaintain micro-\nsmall-medium\nenterprise\n(MSMEs) skills\nin the\norganization\n• Discussions on business models and\nstrategies\n• Discussion on Types and categories\nof businesses and business internal\ncontrol\n• Discussion on Relevant National and\nlocal legislations affecting businesses\n• Prepare promotional materials\n• Practice basic bookkeeping\n\n• Lecture/\nDiscussion\n• Case Study\n• Demonstration\n• Written Test\n• Portfolio\n• Work Related\nProject\n2 Hours\n\n9.2 Establish and\nmaintain client-\nbase/market\n• Role play on customer and employee\nrelations\n• Discussion on Basic product\npromotion strategies\n• Preparation of Basic Feasibility study\n• Case studies on Basic Business\nethics\n• Prepare basic advertising materials\n• Role Play\n• Lecture\nDiscussion\n• Case study\n• Case problem\n• Written Test\n2 Hours\n\n9.3 Apply budgeting\nand financial\nmanagement\nskills\n• Discussion on:\n- Basic cost-benefit analysis\n- Basic financial management\n- Basic financial accounting\n- Business internal controls\n• Role Play\n• Lecture\nDiscussion\n• Group work\n• Written Test\n• Case problem\n1 Hour\n\n--- PDF PAGE 135 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n131\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n--- PDF PAGE 136 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n132\n\nCOMMON COMPETENCIES\n(96 Hours)\n\nUnit of Competency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Receive and resolve customer\ncomplaints\n1.1 Identify and\nanalyse the\ncomplaint\n•\nExplain how to received verbal\ncomplaint using active listening and\nempathy techniques\n•\nIdentify through appropriate\ncommunication techniques the exact\nnature of the customer complaint\n•\nIdentify steps in maintain register or\ncomplaint file/s in accordance with the\nrequirements of the enterprise\ninformation system\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n\n4\nHours\n1.2 Respond to\ncomplaints\n•\nExplain how to process complaints in\naccordance with organizational\nstandards, policies and procedures\n•\nExplain how to obtain and review\ndocumentation in relation to complaints\n•\nIdentify steps in updating register of\ncomplaints/disputes\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n\n4\nHours\n\n1.3 Determine\nand agree\nupon\nappropriate\naction to\nresolve\ncomplaint\n•\nIdentify procedures and guidelines on\nhow to resolve the complaint\n•\nDemonstrate a commitment to the\ncustomer to resolve the complaint\n\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n\n4\nHours\