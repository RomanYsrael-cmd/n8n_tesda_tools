norders\n• Explain how to monitor delivery process\nand ensure continuity of supply\n• Identify routine supply problems\n• Explain how to distribute stock to agreed\nlocations.\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nHours\n\n5.5 Organize and\nadminister\nstocks\n• Explain how to organize stocks\n• Identify the stocktaking responsibilities\n• Discussion\n• Demonstration\n• Lecture\n• Observation\n• Demonstration\n4\nhours\n\n--- PDF PAGE 140 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n136\n\nUnit of Competency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n• Demonstrate how to produce accurate\nstock reports\n• Group\ndiscussion\n• Simulation\n• Written\nexamination\n• Interview\n\n6. Prepare And Deliver Training\nSessions\n6.1 Determine\ntraining\nrequirements\n\n• Identify required competencies for\nlearners\n• Describe the training gap for learners\n• Explain the identified training gaps and\nrecommendation for training\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nHours\n\n6.2 Prepare\ntraining plan\n\n• Explain how to develop session outlines,\ntraining content, training resources and\nmaterials and individual training session\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nHours\n\n6.3 Deliver\ntraining\nsessions\n\n•\nExplain the training and assessment\nactivities involved in the training session\n•\nIdentify steps in preparing training venue\nfor the training session\n• Identify safety of learners during training\ndelivery and practice\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nHours\n7. Plan, conduct and evaluate staff\nperformance assessment\n\n7.1 Plan a staff\nperformance\nassessment\n•\nIdentify context for staff performance\nassessment\n•\nDetermine the initial focus of the staff\nperformance assessment for each staff\nmember\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nHours\n\n--- PDF PAGE 141 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n137\n\nUnit of Competency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n•\nPrepare Documents to record identified\nstaff performance assessment statistics\nand performance data\n•\nDesign action plan to guide the conduct\nof staff performance assessment\n\n7. 2 Conduct a\nstaff\nperformance\nassessment\n•\nIdentify steps in gathering workplace-\nbased evidence of staff performance\n•\nExplain how to interpret employee\nperformance data\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nHours\n\n7.3 Evaluate a\nstaff\nperformance\nassessment\n•\nPrepare staff performance assessment\ninterview\n•\nIdentify steps in reviewing individual\nstaff performance\n•\nExplain how to prepare staff\nperformance assessment targets for\nnext period\n• Discussion\n• Demonstration\n• Lecture\n• Group\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written\nexamination\n• Interview\n\n4\nHours\n\n--- PDF PAGE 142 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n138\n\nCORE COMPETENCIES\n(214 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Direct and lead\nservice team in\nthe dining area/\nrestaurant\n1.1 Supervise pre-\nopening\npreparations\n\n•\nMonitor guest reservation and ensure table\nassignment allocations.\n• Lecture-\nDiscussion\n\n• Observation\n• Demonstration\n• Oral Questioning\n10 Hours\n•\nInspect waiter service stations for\ncompleteness in stocks and supplies.\n• Lecture-Discussion\n• Demonstration\n• Observation\n• Oral\nExamination\n• Written\nExamination\n•\nRe-check tables for accuracy in setting\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Oral\nExamination\n• Written\nExamination\n•\nCheck the cleanliness of the dining\narea/restaurant in accordance to standards of\nthe establishment.\n• Lecture-Discussion\n• Demonstration\n• Simulation\n• Brainstorming\n• Observation\n• Written test\n• Oral\nExamination\n• Assignment\n•\nGrooming of the personnel is checked in\naccordance with the company’s standards\n• Lecture-discussion\n• Brainstorming\n• Oral questioning\n• Observation\n• Dining equipment is inspected to ensure\nefficient operations.\n• Lecture-discussion\n• Demonstration\n• Oral questioning\n• Observation\n\n--- PDF PAGE 143 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n139\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1.2 Oversee food\nand beverage\nservice in the\ndining area\n•\nConduct service briefing among service staff at the\nbeginning of the shift.\n• Lecture-Discussion\n• Role playing\n• Observation\n• Demonstration\n• Oral Questioning\n16 Hours\n\n•\nCoordinate flow of service with the kitchen.\n• Lecture-\nDiscussion\n•\nRole play\n•\nGroup Activity\n\n• Observation\n• Case study\n• Oral questioning\n\n•\nControl and ensure quality in all service areas.\n• Lecture-Discussion\n• Group Discussion\n• Self-paced\nhandout or\nmodule\n• Observation\n• Written test\n• Oral Questioning\n• Case Study\n\n•\nCommunicate guests concerns to the chef and\nkitchen staff.\n• Lecture-Discussion\n• Brainstorming\n• Group Activity\n\n• Demonstration\n• Written test\n• Oral Questioning\n\n•\n`Express and monitor policies on energy and water\nconservation and waste disposal.\n• Lecture-Discussion\n\n• Written test\n•\nOral\nQuestioning\n\n•\nCommunicate policies on sexual harassments\n• Lecture-Discussion\n•\nOral\nquestioning\n\n1.3 Oversee end\nof shift and\nclosing\nprocedures\n•\nCheck end of shift / Closing tasks of the\nservice staff in accordance to enterprise\nstandards\n• Lecture-Discussion\n• Demonstration\n• Simulation\n• Group Activity\n\n• Observation\n• Demonstration\n• Written test\n• Oral Questioning\n\n12 Hours\n\n--- PDF PAGE 144 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n140\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n•\nRecord daily sales and cover count of the\noutlet\n• Lecture-Discussion\n• Demonstration\n• Simulation\n• Group Activity\n\n• Observation\n• Demonstration\n• Written test\n• Oral Questioning\n\n•\nConduct Post-briefing is conducted to discuss\nand solve concerns of the day.\n• Lecture-Discussion\n• Demonstration\n• Simulation\n• Group Activity\n• Observation\n• Demonstration\nOral Questioning\n\n•\nCheck electrical equipment and fixtures if\nproperly turned-off\n• Role playing\n• Demonstration\n\n•\nSegregate food wastes and packaging wastes\n• Lecture-\nDiscussion\n• Simulation\nObservation\nOral questioning\n\n--- PDF PAGE 145 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n141\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n2. Promote and\nprepare extensive\nrange of food and\nbeverage products\nfor table side\nservice\nrequirements.\n2.1 Promote table\nside menu\nitems to\nguests\n\n•\nIdentify the range of menu items that may be\noffered via gueridon service\n• Lecture\n• Discussion\n• Group activity\n• Observation\n• Demonstration\n• Written test\n• Oral\nExamination\n\n16 Hours\n•\nDescribe and promote a range of gueridon\nmenu items to guests and potential guests\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Written test\n• Oral\nExamination\n•\nDescribe the procedures involved in the\nprovision of gueridon service to guests\n• Lecture\n• Discussion\n\n• Observation\n• Written test\n• Oral\nquestioning\n\n•\nIdentify, describe and explain the role of\ningredients used in gueridon service of menu\nitems\n• Lecture\n• Discussion\n• Brainstorming\n\n• Written test\n• Oral\nQuestioning\n\n•\nSelect and use appropriate materials on\ngueridon trolley to assist in the promotion of\ngueridon service\n• Lecture\n• Discussion\n• Group\ndiscussion\n\n• Written test\n• Oral\nquestioning\n\n--- PDF PAGE 146 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n142\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n2.2 Develop and\nupdate wine\nknowledge\n•\nIdentify and differentiated wine styles, major\ngrape varieties used in wine production and\nmajor wine producing countries.\n•\nLecture\n•\nInteractive\nDiscussion\n\n•\nWritten test\n•\nOral\nquestioning\n\n16 Hours\n•\nDescribe the steps in wine production and wine\nproduction techniques\n• Lecture\n• Discussion\n\n•\nWritten test\n•\nOral\nQuestioning\n\n•\nInterpret wine labels to identify and make\nassessment of wine contained within the bottle.\n•\nLecture\n•\nDiscussion\n\n•\nWritten test\n•\nOral\nquestioning\n•\nFamiliarize wine storage facilities and retrieval\n\n• Lecture -\nDiscussion\n\n•\nWritten test\n•\nOral\nExamination\n• Work Project\n\n•\nUndertake sensory appraisal of wine if\nnecessary\n• Lecture-Discussion\n• Wine evaluation\n•\nOral\nExamination\n•\nDemonstration\n\n2.3 Provide\nadvice on\nfood and wine\nto patrons\n•\nPresent wine list/lists to patrons in accordance\nwith the enterprise standards\n\n• Lecture\n• Discussion\n• Demonstration\n\n•\nObservation\n•\nDemonstration\n•\nWritten test\n•\nOral\nQuestioning\n\n--- PDF PAGE 147 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n143\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n•\nRecommend suitable wine and food\ncombinations to meet identified needs and\npreferences of patrons\n• Lecture\n• Discussion\n• Demonstration\n\n• Observation\n• Demonstration\n• Written test\n• Oral Questioning\n\n12 Hours\n\n•\nExplain to guests relevant wine production\ncountries, grape varieties, wine production\ntechniques and associated wine industry\ninformation, trends and details when necessary\n\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Observation\n• Demonstration\n• Written test\n• Oral questioning\n\n 2.4 Prepare\ngueridon\nequipment /\nservice trolley\nfor service\n\n•\nClean and maintain gueridon trolleys,\nequipment and utensils\n• Lecture-\nDiscussion\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Written test\n• Oral questioning\n\n•\nPrepare trolleys and service area for service\nwith equipment, utensils and linen\n• Lecture-\nDiscussion\n• Demonstration\n• Group Activity\n\n• Observation\n• Demonstration\nOral Examination\n• Oral Questioning\n\n--- PDF PAGE 148 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n144\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n•\nSelect food and non-food items for service to\nmatch menu items\n• Lecture-\nDiscussion\n• Group Discussion\n\n• Written test\n• Oral\nExamination\n• Assignment\n• Work project\n\n16 Hours\n•\nVerify the quality and condition of food and non-\nfood items prior to use\n• Lecture-\nDiscussion\n• Group Discussion\n\n• Observation\n\n• Written test\n• Oral Questioning\n• Case study\n\n•\nPosition gueridon trolleys for maximum impact\non sales potential\n• Lecture-\nDiscussion\n• Demonstration\n\n• Demonstration\n• Written test\n• Oral Questioning\n\n2.5 Prepare and\nserve menu\nitems\n•\nPrepare and serve a range of food menu items\nusing the gueridon\n• Lecture-\nDiscussion\n• Group Discussion\n• Demonstration\n• Simulation\n• Observation\n• Demonstration\n• Written test\n• Oral\nExamination\n• Oral Questioning\n24 Hours\n•\nCarry out specialized dining room service\nefficiently in accordance with the standards of\nthe establishment\n• Demonstration\n• Lecture\n• Observation\n• Demonstration\n• Oral questioning\n\n•\nEngage guests as part of the gueridon service\nexperience\n• Lecture\nDemonstration\n\n• Observation\n• Demonstration\n• Oral\nQuestioning\n\n--- PDF PAGE 149 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n145\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n•\nPresent prepared menu items in a professional\nand attractive manner\n• Demonstration\n• Lecture\n• Observation\n• Demonstration\n• Oral questioning\n\n•\nClear and clear trolleys and other gueridon\nequipment and utensils on completion of the\nprovision of service\n• Lecture\n• Demonstration\n• Observation\n• Demonstration\n• Oral questioning\n\n2.6 Manage\nresponsible\nservice of\nalcohol\n•\nApply enterprise and licensing authority\neligibility standards and/or requirements to be\nserved alcohol\n• Lecture\n• Group Discussion\n• Group Activity\n\n• Observation\n• Written test\n• Oral\nExamination\n• Case study\n\n12 Hours\n•\nExplain restrictions for service courteously and\ndiplomatically\n• Lecture-\nDiscussion\n• Group discussion\n• Written test\n• Oral\nExamination\n• Case study\n•\nPrepare and serve standard drinks in\naccordance with the enterprise standards\n• Lecture-\nDiscussion\n\nDemonstration\n\n• Observation\n• Written test\n• Oral\nExamination\n• Demonstration\n\n--- PDF PAGE 150 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n146\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n3. Organize functions\nat a hotel or\nrestaurant\n\n3.1 Supervise pre-\nfunction mise-\nen place\n•\nObtain adequate supplies in accordance to\nevent/function requirements\n.\n•\nLecture\n•\nDiscussion\n•\nSimulation\n\n•\nObservation\n•\nWritten test\n•\nOral\nQuestioning\n20 Hours\n•\nSet up Tables and chairs according to\nevent/function requirements\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Oral\nQuestioning\n\n•\nSet up serving stations/food islands in\ndesignated locations.\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Oral\nQuestioning\n\n•\nInspect Tableware for damages and cleanliness\n• Simulation\n• Lecture -\ndiscussion\n\n• Observation\n• Demonstration\n\n•\nPrepare floor plan/ seating diagram available for\nreference of the banquet staff\n• Lecture\n• Discussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written test\n• Oral questioning\n• Work Project\n\n•\nSet appropriate flatware according to the menu.\n• Lecture\n• Discussion\n• Simulation\n• Group Activity\n\n• Observation\n• Demonstration\n• Written test\n• Oral questioning\n\n--- PDF PAGE 151 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n147\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n•\nConduct meetings and briefings\n•\nprior to the banquet function.\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Written test\n• Oral\nExamination\n\n•\nExecute and interpret Banquet Event Order\nbased on the event requirement and resources\n• Lecture –\ndiscussion\n• Individual and\nGroup activity\n\n• Written test\n• Case study\n• Oral questioning\n•\nCheck the quality of the food to be served\nbased on guest’s request\n• Lecture –\ndiscussion\n• Individual and\nGroup activity\n\n• Written test\n• Case study\n• Oral questioning\n• Demonstration\n\n3..2 Oversee meal\nservice\n•\n Maintain contact with host, chef and kitchen\nstaff all throughout the event.\n• Lecture-\ndiscussion\n\n• Observation\n• Demonstration\n• Oral questioning\n\n10 Hours\n•\nEnsure prompt delivery of each course to every\ntable.\n• Lecture-\ndiscussion\n• Demonstration\n\n• Observation\n• Written test\n• Oral questioning\n\n•\nCoordinate timing of service of each course of\nthe meal with the kitchen, service staff and host.\n• Lecture\n• Simulation\n• Group\nActivity\n\n• Observation\n• Demonstration\n• Oral questioning\n• Case study\n•\nMonitor banquet staff work and pace all\nthroughout the meal service.\n• Lecture-\ndiscussion\n• Simulation\n\n• Observation\n• Demonstration\n• Oral\nQuestioning\n• Case study\n\n--- PDF PAGE 152 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n148\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n•\nImplemented the banquet service style in\naccordance with what is stipulated in the event\norder form or with special arrangement with the\nhost.\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Oral questioning\n•\nControl HVAC relative to ambient temperature\n• Demonstration\n• Lecture-\ndiscussion\n\n• Observation\n• Demonstration\n• Oral questioning\n\n3.3 Supervise\nafter meal\nservice\n•\nProvide coffee and tea service upon guest\nrequest.\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Oral questioning\n\n8 Hours\n•\n Supervise banquet area “break down”\naccording to enterprise standards.\n• Lecture\n• Discussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written test\n• Oral questioning\n\n•\n Prepare event report after each function\n• Lecture\n• Discussion\n• Individual Activity\n\n• Written test\n• Oral\nExamination\n• Work project\n•\nMonitor waste disposal procedures after each\nfunction.\n• Lecture-\ndiscussion\n• Group discussion\n• Observation\nWritten test\nOral questioning\n\n3.4 Perform\ncustomer\nrelations\n•\nAttend promptly to guest needs and concerns.\n• Lecture\n• Discussion\n• Role playing\n\n• Observation\n• Demonstration\n• Written test\n• Oral questioning\n• Case study\n\n4 Hours\n\n•\nCheck professional demeanor of the staff at all\ntimes.\n• Lecture\n• Group Discussion\n• Group Activity\n\n• Observation\n• Demonstration\n• Written test\n• Oral questioning\n\n--- PDF PAGE 153 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n149\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n4. Process financial\nsale transactions\n4.1 Prepare point\nof sale area\nfor operation\n\n•\nPrepare point of sale register/terminal for\noperation in accordance with the enterprise\nstandard\n• Lecture\n• Discussion\n• Simulation\n• Demonstration\n\n• Observation\n• Written test\n• Oral\nExamination\n• Oral\nQuestioning\n• Portfolio\n\n4 Hours\n•\nObtain and ensure cash float and supplies of\nchange.\n• Lecture-\ndiscussion\n• Simulation\n\n• Demonstration\n• Written test\n• Oral Questioning\n\n•\nObtain supplies of point of sale documentation\n• Lecture-\ndiscussion\n• Simulation\n\n• Written test\n• Oral\nExamination\n\n4.2 Process\npayments and\nreceipts during\ntrade\n\n•\nCalculate or verify amount due from\ncustomer/guest\n• Lecture-\ndiscussion\n• Simulation\n\n• Written test\n• Oral\nExamination\n• Case study\n\n6 Hours\n•\nAccept cash and non-cash payments and issue\nreceipts.\n• Lecture\n• Discussion\n• Simulation\n\n• Observation\n• Demonstration\n• Written test\n\n--- PDF PAGE 154 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n150\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n•\nProcess advanced deposits payments and\nrefunds in accordance with enterprise policy.\n•\nLecture\n•\nDiscussion\n•\nDemonstration\n•\nSimulation\n• Observation\n• Demonstration\n• Written test\n• Oral questioning\n\n•\nApply appropriate customer/guest service skills\nin processing payments.\n•\nLecture\n•\nDiscussion\n•\nGroup\nDiscussion\n•\nDemonstration\n•\nSimulation\n• Observation\n• Demonstration\n• Written test\n• Oral questioning\n• Case study\n\n4.3 Reconcile\nfinancial\ntransaction at\nend of trade\n\n•\nComplete end of shift documentation in\naccordance with enterprise policy\n\n•\nLecture-\ndiscussion\n\n•\nSimulation\n• Observation\n• Demonstration\n• Written test\n• Oral\nExamination\n\n6 Hours\n•\nDetermine balance between register/terminal\nreading and cash and non-cash totals\n•\nLecture-\ndiscussion\n•\nIndividual\nactivity\n• Written test\n• Oral questioning\n•\nInvestigate and resolve discrepancies with\ntakings in accordance with enterprise policy\n•\nLecture-\n•\nDiscussion\n•\nSimulation\n• Written test\n• Oral questioning\n• Case study\n\n--- PDF PAGE 155 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n151\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n5. Monitor and\nmaintain stock\n5.1 Accept\ndelivery of\nstock\n\n•\nCheck stock received against stock ordered\n•\nLecture-\ndiscussion\n•\nIndividual\nactivity\n• Written test\n• Oral questioning\n\n8 Hours\n•\nFollow-up variations between delivery and\ndocumentation are identified and relevant\ndocumentation\n•\nLecture\n•\nDiscussion\n•\nGroup\nDiscussion\n\n• Written test\n• Oral questioning\n\n•\nIdentify stock to be returned to the supplier.\n•\nLecture\n•\nDiscussion\n•\nGroup\nDiscussion\n• Written test\n• Oral questioning\n• Case study\n\n•\nManage excess stock within the organization\n•\nLecture\n•\nDiscussion\n•\nGroup\nDiscussion\n• Written test\n• Oral questioning\n• Case study\n\n•\nSecure new stock against damage and/or theft\n\n•\nLecture\n•\nDiscussion\n•\nGroup\nDiscussion\n• Written test\n• Oral questioning\n• Case study\n\n5.3 Store stock\n\n•\nMove stock to the required operational area\n•\nLecture\n•\nDiscussion\n•\nSimulation\n• Written test\n• Oral questioning\n• Case study\n\n6 Hours\n•\nApply appropriate occupational health and\nsafety skills according to the enterprise policy\n•\nLecture\n•\nDiscussion\n•\nDemonstration\n•\nSimulation\n• Written test\n• Oral questioning\n• Case study\n• Demonstration\n•\nRemove waste from the storage areas following\nthe standard procedures of the enterprise.\n•\nLecture\n•\nDemonstration\n\n• Observation\n• Written test\n• Oral questioning\n• Case study\n\n--- PDF PAGE 156 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018)\n152\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n5.3 Maintain\ninventory and\nstorage areas\n•\nControl inventory of food, equipment, small\nware and liquors in accordance with the\nenterprise procedures\n• Lecture-\ndiscussion\n• Observation\n• Oral Questioning\n• Case study\n\n8 Hours\n\n•\nCheck slow and fast moving items in\naccordance with enterprise standards.\n\n• Lecture-dicussion\n• Group discussion\n\n• Observation\n• Oral Questioning\n• Case study\n\n•\nRotate stock aligning with enterprise and stock\nitem requirements\n• Lecture\n• Discussion\n• Group discusion\n• Observation\n• Written test\n• Oral\nExamination\n•\nTake remedial action where stock related issues\nare identified\n• Lecture\n• Discussion\n• Group discussion\n• Observation\n• Written test\n• Oral\nExamination\n• Case study\n•\nRequest needed food items, supplies and\nequipment to ensure quality and timely delivery\nof service.\n• Lecture\n• Group Discussion\n• Demonstration\n• Simulation\n\n• Observation\n• Written test\n• Oral\nExamination\n\n--- PDF PAGE 157 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 153\n\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\n\n--- PDF PAGE 158 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 154\n\naudio, video, computer technologies or other modern technology that\ncan be used to facilitate learning and formal and non-formal training.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson wherein\nthe agreement may be written or oral and the master craftsperson\ncommits to training the apprentice in all the skills relevant to his or her\ntrade over a significant period of time, usually between one and four\nyears, while the apprentice commits to contributing productively to the\nwork of the business. Training is integrated into the production process\nand apprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs\nconducted by non-government organizations (NGOs), LGUs, training\ncenters and other TVET providers which are intended to address the\nspecific needs of a community. Such programs can be conducted in\ninformal settings such as barangay hall, basketball courts, etc. These\nprograms can also be mobile training program (MTP).\n\n--- PDF PAGE 159 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 155\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the following\nrequirements:\n\n•\nMust have completed the 10-year basic education or an Alternative Learning\nSystem (ALS) Certificate of Completion with grade 10 equivalent holder\n•\nComputer literate\n•\nCan communicate in basic English in both oral and written form\n•\nMust be competent in the entire Food and Beverage Services NCII\nqualification either through training, experience or certification\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of a minimum of\n25 trainees for FOOD AND BEVERAGE SERVICES NC III are as follows:\n\nWAITERING TOOLS, MATERIALS AND EQUIPMENT\nQTY\nDINNERWARE\nQTY\nCUTLERIES\nQTY\nGLASSWARE\n24\nDinner plates, 10”\n24\nDinner knives\n24\nRed wine glasses\n24\nShow/service\nplates, 11-14”\n24\nDinner forks\n24\nWhite wine glasses\n24\nAppetizer / Salad\nplates 7-8”\n24\nSalad knives\n24\nWater goblets\n24\nFish plates, 8-9”\n24\nSalad forks\n24\nJuice glasses/Hi ball\n24\nDessert plates, 7-\n8”\n24\nFish knives\n24\nChampagne flute\n24\nSide plates or\nbread plates, 6”\n24\nFish forks\n24\nCollins glasses\n24\nSoup plate/bowl /\nconsommé cup\n24\nSoup spoons (cream\nand consume)\n24\nPilsner glasses/Ice tea\nglasses\n24\nCups and saucers\n5-6 oz\n24\nDessert spoons\n\nWINE DECANTING\nREQUISITES\n12\nOval platter (small)\n24\nDessert forks\n6\nWine Decanter\n12\nOval platter (large)\n24\nTeaspoons\n6\nCandle / match\n\n24\nCocktail forks\n6\nWater’s friend\n\n12\nService forks\n6\nWine basket\n\n--- PDF PAGE 160 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 156\n\nWAITERING TOOLS, MATERIALS AND EQUIPMENT\nQTY\nDINNERWARE\nQTY\nCUTLERIES\nQTY\nGLASSWARE\n\n12\nService spoons\n\n24\nSteak knives\n\n24\nButter knives\n\n24\nOyster forks\n\nQTY\nOTHER\nSERVICEWARE\nQTY\n\nQTY\nOTHER ACCESSORIES\n6\nCoffee pot\n6\n Table cloths for\nsquare table\n6\nMenu Folders\n6\nTea pot\n6\nSide towels\n6\nOrder pads\n6\nSalt and Pepper\nshakers\n30\n20” x 20” Cloth Table\nnapkin\n6\nBill folder/change trays\n12\nRectangular trays\n6\nTable cloth for round\ntable 8’s\n2\nWaiter station/cabinet\n8\nSilver platters\n\n2\nTray stand (Dummy\nwaiter)\n12\nRound (bar) trays\n\n2\nBoning knives\n4\nTooth pick holders\n\n6\nAll-purpose knives\n6\nNapkin holders\n\n4\nChopping boards\n6\nSugar basin /\ncontainers\n\n10\nUtility bowls/plates\n6\nCreamer\ncontainers / Milk\njug\n\nEQUIPMENT\n2\nsets\nWooden fork and\nspoons\n6\nSauce/gravy boats\n1\nTableside service cart\nw/ rechaud (Gueridon)\n2\nWooden bowls (Caesar\nsalad preparation)\n4\nSoup tureen\n1\n(push) cart to\ntransport/move\nbanquet operating\nequipment\n4\nPlastic bin boxes to be\nused when moving\nbanquet operating\nequipment\n2\nPeppermill\n\nPoint of Sale (POS)\n2\nNon-stick round\n(crepe) pan\n6\nService forks and\nspoons\n\nINGREDIENTS for\ngueridon service\n2\nTurners (for non-stick\npans)\n6\nFood tongs\n\nCaesar Salad\n6\nFood cover\n\n--- PDF PAGE 161 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 157\n\nWAITERING TOOLS, MATERIALS AND EQUIPMENT\nQTY\nDINNERWARE\nQTY\nCUTLERIES\nQTY\nGLASSWARE\n6\nSauce ladles\n\nFilleting Fish\n\n4\nSoup ladles\n\nFlambe\nTABLES/CHAIRS\n2\nCake servers\n\nCarving poultry\n4\nSquare/rectangular\ntables (4’s/6’s)\n6\nWater pitchers\n\n3\nround tables (8’s)\n2\nIce buckets with\ntongs\n\n30\nDining/Banquet chairs\n\nForms:\n\nSample Forms for\ninventory, receiving\nand storing stock,\nEvent Order Form\n\n*NOTE:\nImplementation of the training program can be made possible through a MOA between\nthe Training school and Industry (Full Service Restaurant or Catering Service) for the\nuse of the facilities.\n\n3.5\nTRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees.\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in Sq.\nMeters\nStudent/Trainee\nWorking Space\n1 x 1 m.\n1 sq. m.\n25 sq. m\nLecture/Demo Room\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLaboratory\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLearning Resource\nCenter\n3 x 5 m.\n15 sq. m.\n15 sq. m.\nFacilities/Equipment/\nCirculation Area\n\n36 sq. m.\nTotal workshop area:\n156 sq. m.\n\n--- PDF PAGE 162 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 158\n\n3.6 TRAINER’S QUALIFICATIONS\n\n• Must be a holder of National TVET Trainer Certificate (NTTC) Level I in Food\nand Beverage Services NC III\n• Must have at least 3 years industry experience as waiter, head waiter or\nsupervisor in food and beverage department\n• Must have attended relevant upgrading food and beverage services training\nand seminars\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of\ncompetency.\n\n--- PDF PAGE 163 ---\nFOOD AND BEVERAGE SERVICES NC III Revision 02 Promulgated (10/29/2018) 159"
