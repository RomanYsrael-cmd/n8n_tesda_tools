g stock is aligned with designated storage \nareas, bins etc. \n12.Remedial action \nMay include: \n12.1 Notifying relevant personnel\n\n--- PDF PAGE 119 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n115 \n \nVARIABLE \nRANGE \n12.2 Arranging for maintenance, including in-house and \nexternal \n12.3 Re-locating stock \n12.4 Protecting stock \n12.5 \nDisposing of damaged stock, including disposal to \nwaste, or returning items to suppliers \n12.6 Arranging for nominated stock items to be used \nimmediately \n12.7 Arranging for stock to be returned to suppliers \n12.8 Acting to address identified problems and threats as \nthe need demands, including pest control, repairs to \nstore rooms, removal of threats and damaged stock, \ncleaning, re-positioning stock to designated areas.\n\n--- PDF PAGE 120 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n116 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated knowledge in conducting inventory of \nsupplies and food and beverage items  \n1.2 \nExplained the enterprise policies and procedures in \nchecking and receiving stocks.  \n1.3 \nDemonstrated ability to place a nominated range of \nfood, beverage or other stock items into appropriate \nstorage ensuring compliance with required safe food \nhandling, manual handling, stock rotation and stock \nrecording practices \n1.4 \nDemonstrated ability to update a nominated stock \ncontrol system, paper-based or electronic, to reflect the \nreceipt of a nominated delivery and the removal of \ndamaged items from inventory. \n2. Resource  Implications \nThe following resources should be provided: \n2.1 \nAccess to a real or simulated workplace;  \n2.2 \naccess to workplace standards, procedures, policies, \nguidelines, tools and equipment. \n2.3 \nSample documentation: \n2.3.1 \nPurchase orders/Purchase order book \n2.3.2 \nStanding orders \n2.3.3 \nPurchase specifications \n2.3.4 \nDelivery dockets \n2.3.5 \nInvoices \n2.3.6 \nCombined Delivery Dockets-Invoices \n2.3.7 \nCombined Invoices-Statements \n2.3.8 \nGoods ordered register \n2.3.9 \nProduct recall notices \n2.3.10 \nStock take sheets \n2.3.11 \nRequisition forms \n2.3.12 \nInternal transfer sheets \n2.3.13 \nMaterial Safety Data Sheets \n2.3.14 \nInspection schedules \n2.3.15 \nInspection checklists \n2.3.16 \nMaintenance cards \n2.3.17 \nSales dockets and cash register audit rolls/tapes \n2.3.18 \nStock order/s from computerised stock \ncontrol/management system/s \n2.3.19 \nSpillage and breakage form \n2.3.20 \nPar stock \n3. Methods of Assessment \nCompetency maybe assessed through: \n3.1 \nDemonstration with Oral questioning \n3.2 \nPortfolio\n\n--- PDF PAGE 121 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n117\n",
