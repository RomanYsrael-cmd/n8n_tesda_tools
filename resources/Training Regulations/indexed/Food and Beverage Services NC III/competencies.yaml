            "number": 1,
            "title": "Develop an individual’s cultural awareness and sensitivity",
            "performance_criteria": [
              {
                "number": "1.1",
                "text": "Individual differences with clients, customers and fellow workers are recognized and respected in accordance with enterprise policies and core values."
              },
              {
                "number": "1.2",
                "text": "Differences are responded to in a sensitive and considerate manner"
              },
              {
                "number": "1.3",
                "text": "Diversity is accommodated using appropriate verbal and non- verbal communication."
              }
            ],
            "required_knowledge": [
              "1.1 Understanding cultural diversity in the workplace",
              "1.2 Norms of behavior for interacting and dialogue with specific groups (e. g., Muslims and other non- Christians, non- Catholics, tribes/ethnic groups, foreigners)",
              "1.3 Different methods of verbal and non- verbal communication in a multicultural setting"
            ],
            "required_skills": [
              "1.1 Applying cross- cultural communication skills (i.e. different business customs, beliefs, communication strategies)",
              "1.2 Showing affective skills – establishing rapport and empathy, understanding, etc.",
              "1.3 Demonstrating openness and flexibility in communication",
              "1.4 Recognizing diverse groups in the workplace and community as defined by divergent culture, religion, traditions and practices"
            ],
            "source_number": 1
          },
          {
            "number": 2,
            "title": "Work effectively in an environment that acknowledges and values cultural diversity",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "Knowledge, skills and experiences of others are recognized and documented in relation to team objectives."
              },
              {
                "number": "2.2",
                "text": "Fellow workers are encouraged to utilize and share their specific qualities, skills or backgrounds with other team members and clients to enhance work outcomes."
              },
              {
                "number": "2.3",
                "text": "Relations with customers and clients are maintained to show that diversity is valued by the business."
              }
            ],
            "required_knowledge": [
              "2.1 Value of diversity in the economy and society in terms of Workforce development",
