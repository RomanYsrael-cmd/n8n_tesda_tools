          "source_text": "REQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \n1. Promote   table \nside  menu items \nto guests \n \n1.1 Range of menu \nitems that may be \noffered via gueridon \nservice are identified \n1.2 Range of gueridon/ \ntable side menu \nitems are described \nand promoted to \nguests and potential \nguests* \n1.3  The procedures \ninvolved in the \nprovision of \ngueridon service are \ndescribed to guests \n1.4 The role of \ningredients used in \ngueridon service of \nmenu items are \nidentified, described \nand explained.  \n1.5 Gueridon trolleys, \nequipment and \nutensils are selected \nand  used to assist in \nthe promotion of \ngueridon service \n1.1 Gueridon Menu \nitems including \ningredients \n1.2 Gueridon Service \nprocedures \n1.3 Gueridon trolley, \nmaterials, and \nequipment  \n \n1.1 Communication  \nskills \n1.2 Ability to explain \ngueridon service and \nmenu items to guests \n1.3 Suggestive  selling / \nupselling techniques\n\n--- PDF PAGE 95 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n91 \n \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \n2.   Develop and \nupdate wine \nknowledge \n2.1 Wine styles, major \ngrape varieties used \nin wine production and \nmajor wine \nproducing countries \nare identified and \ndifferentiated.* \n2.2 Steps in basic wine \nproduction and wine \nproduction techniques \nare described.  \n2.3 Wine labels are \ninterpreted to identify \nand make assessment \nof wine contained \nwithin bottles \n2.4 Wine storage and \nretrieval are \nfamiliarized to ensure \nwine condition. \n2.5 Sensory appraisal of \nwine is undertaken, if \nnecessary \n2.1 Wine styles \n2.2 Major grape \nVarieties \n2.3 Major wine  \n2.4 Producing \ncountries \n2.5 Wine labels \n2.6 Wine storage \nconditions \n2.7 Quality and \ncharacteristics  of \nwine \n2.8 Wine service \n2.9 Wine decanting   \nrequisites  \n2.10 Wine storage \nfacilities \n \n2.1 Wine identification \n2.2 Communication Skills \n2.3 Read and interpret \nwine labels / product \ninformation \n2.4 storing and retrieving \nwines \n2.5 Evaluating wine \n2.6 Wine decanting\n\n--- PDF PAGE 96 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n92 \n \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \n3. Provide advice \non food and wine \nto patrons \n3.1 Wine lists are \npresented to patrons \nin accordance with the \nenterprise standards.  \n3.2 Suitable wine and \nfood combinations \nare recommended to \nmeet identified needs \nand preferences of \npatrons \n3.3 Countries, grape \nvarieties, wine \nproduction techniques \nand associated wine \nindustry information, \ntrends and details are \nexplained to guests \nwhen necessary \n \n3.1 Policies and           \nprocedures in regard \nto the sale, service \nand promotion of \nalcohol  \n3.2 Wine and food \ncombination \n3.3 Major food types, \ntheir characteristics \nand how those \ncharacteristics affect \ncompatibility with \nbeverage \n3.4 Wine quality and \ncharacteristics \n3.5 Suggestive selling \nand upselling \ntechniques \n3.6 Menu knowledge \n3.1 Wine and food \npairing \n3.2 Suggestive selling \nand upselling \n3.3 Communication skills \nto articulate advice \non food and \nbeverage matching  \n4. Prepare gueridon \nequipment / \nservice trolley for \nservice  \n4.1 Gueridon trolleys, \nequipment and \nutensils are regularly \ncleaned and \nmaintained \n4.2 Trolleys and service \narea for service with \nequipment, utensils \nand linen are prepared \nfor efficient service.  \n4.3 Food and non-food \nitems for service to \nmatch menu items are \nselected.  \n4.4 The quality and \ncondition of food and \nnon-food items prior to \nuse are verified. \n4.5 Gueridon trolleys are \npositioned for \nmaximum impact on \nsales potential \n4.1 Mis-en-place \n4.2 Standard industry \nprocedures for \ngueridon service  \n4.3 Principles of safety, \nhygiene and \nsanitation \n4.4 Quality Control \n4.5 use and operate \ngueridon trolley \n4.6 Gueridon service \nrequisites  \n4.1 Gueridon service \n4.2 Planning and \norganizing skills to \nselect appropriate \ngueridon equipment \nand ingredients for a \ngiven menu \n4.3 Ability to apply \nSelling techniques \n4.4 Problem solving skills \nto identify \ndeficiencies in \nequipment and  \ningredients\n\n--- PDF PAGE 97 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n93 \n \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \n5. Prepare and \nserve menu \nitems \n \n5.1 A range of food and \nbeverage menu items \nare prepared and \nserved using the \ngueridon.* \n5.2 Specialized dining \nroom service is \ncarried out efficiently \nin accordance  with \nthe standards of the \nestablishment.* \n5.3 Guests  are engaged \nas part of the gueridon \nservice experience. \n5.4  Prepared menu items \nare presented for \nservice in a \nprofessional and \nattractive manner. \n5.5 Trolleys and other \ngueridon equipment \nand utensils are \ncleared and cleaned \non completion of the \nprovision of gueridon \nservice. \n5.6 Safety precautions are \ntaken and made \ncertain all the time.  \n5.1 Specialized dining \nroom service \n5.2 Gueridon menu \naccompaniments \n5.3 Principles of safety, \nhygiene and \nsanitation \n5.4 Contingency \nPlanning \n5.5 Correct \nmeasurement of \ningredients  \n \n \n1.5 Ability to perform \nSpecialized dining \nroom service \n1.6 Effective customer \nrelation skills \n1.7 Creativity in food \npreparation, plating \nand presentation\n\n--- PDF PAGE 98 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n94 \n \n \n \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \n6.  Manage \nresponsible \nservice of \nalcohol \n6.1 Enterprise and \nlicensing authority \neligibility standards \nand/or requirements  \nto be served alcohol \nare appropriately \napplied  \n6.2 Restrictions for \nservice are explained \nto patrons courteously \nand diplomatically. \n1.1 Standard drinks are \nprepared and served \nin accordance with the \nenterprise standards \n \n6.1 Effects of alcohol \nand factors that \ninfluence it \n6.2 Legal requirements \nfor alcohol service \nand consumption \n6.3 Legal restrictions of \nalcohol use  \n6.4 Standard drinks and \nacceptable \nmeasures of alcohol  \n6.5 Ways of assessing \nintoxication of \ncustomers \n \n \n6.1 Assessing customer \ncondition before and \nduring service of \nalcohol \n6.2 Communication skills  \n6.3 Applying intervention \ntechniques to restrict \nintoxication of \ncustomers \n6.4 Effective customer \nrelations  \n6.5 Solving problems, \nconflict resolution \nand anger \nmanagement \n6.6 Defusing conflict\n\n--- PDF PAGE 99 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n95 \n \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Range of menu items \nMay include :  \n1.1 Appetisers, hors d’oeuvres and entrees, including pre-\nprepared and prepared/finished at table \n1.2 Main dishes from a variety of raw materials, including \nbut not limited to meats, chicken/poultry, seafood, \npasta, vegetables, fruits and salads \n1.3 Hot and cold dishes, including salads \n1.4 Hot and cold desserts, including pre-prepared and \nprepared/finished at table, such as crepes and fruits \n1.5 Signature dishes \n  1.6  Hot and cold beverages, including alcoholic and non-\nalcoholic choices,  coffees and teas \n1.7   Sauces, accompaniments and garnishes \n \n2. Promote a range of \ngueridon menu items \nMay include: \n2.1 \nPhysically supporting the point-of-sale displays \n2.2 \nThe attractive use and presentation of trolleys and \ngueridon equipment \n2.3 \nMenus, wine lists, drink lists \n2.4   Point-of-sale advertising materials such as tent cards, \nrecipe sheets, fliers and brochures \n3.  Procedures involved in the \nprovision of gueridon \nservice \nMay include : \n3.1 \nPortioning of ingredients \n3.2 \nTrimming, peeling, skinning and \nslicing \n3.3 \nCooking using various techniques appropriate to \nvariety of different menu items. \n3.4 \nMixing, whisking, combining \n3.5 \nSeparating eggs. \n3.6 \nCarving and filleting \n3.7 \nSilver service and/or plate service techniques,  \n            including lifting, folding, transferring, placement of    \n           food, serving \n3.8 \nPouring alcohol and flaming.\n\n--- PDF PAGE 100 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n96 \n \nVARIABLE \nRANGE \n6. Gueridon trolleys,     \nequipment and utensils \nMay include: \n4.1 \nFlambé trolleys \n4.2 \nHot carving trolleys \n4.3 \nHors d’oeuvres trolleys \n4.4 \nSweets trolleys \n4.5 \nLiqueur and liquor trolleys \n4.6 \nCigar humidors \n4.7 \nBurners/cooking lamps and their fuel source/s \n4.8 \nSuzette pans \n4.9 \nSilver service gear, ladles, crockery items, silverware, \nsauce boats \n4.10 Glassware \n4.11 Linen and napkins \n5. Wine styles, major grape \nvarieties, major wine \nproducing countries  \nWine styles may include: \n5.4 \nStill reds and still whites \n5.5 \nSparkling reds and sparkling whites \n5.6 \nPink wines \n5.7 \nFortified wines \n5.8 \nRice wines \n5.9 \nStyles of wines distinctive to, or popular within,     \nindividual  establishments and/or host countries \n5.10 Generic wines and varietals \n5.11 Impact of European Union (EU) And European  \nEconomic Community (EEC) on wine production and \nnaming protocols. \nMajor grape varieties may include: \n5.9     Red, such as but not limited to Shiraz, Cabernet   \nSauvignon, Merlot, Pinot Noir \n5.10  White, such as but not limited to Chardonnay, Rhine \nRiesling, Semillon, Sauvignon Blanc, Chenin Blanc, \nColombard \n5.11 Grape varieties distinctive to, or popular within,  \nindividual establishments and/or host countries. \nMajor wine producing countries must include: \n5.12 Australia, France (including Bordeaux, Burgundy,    \nChampagne), Germany, Italy, Portugal, New Zealand, \nChile, South Africa, California, Bali \n5.13  Other countries and/or regions popular within \nindividual establishments and/or host countries.\n\n--- PDF PAGE 101 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n97 \n \nVARIABLE \nRANGE \n6.  Steps in basic wine \nproduction \nMay include: \n6.1 \nThe basic steps:, harvesting grapes, crushing, \npressing, yeast addition, fermentation, clarification and \nstabilization, storage, bottling, bottle maturation \n6.2 \nConsideration of variations in winemaking including \nwhite wine, red wine, sparkling wine and fortified wine \nproduction techniques. \n7. Wine storage facilities \nMay include: \n 7.1  Storage facilities for red, white, sparkling and fortified   \nwines appropriate storage conditions for each wine \nclassification, including suitable space, temperatures \nand humidity \n7.2  Facilities to allow the cellaring of vintage wines for   \nfuture  use \n7.3   Consideration of a system to store wines according to       \ntype, vintage, style, maker or country \n \n8  Wine retrieval  \nMay  include: \n8.1    Completion of necessary in-house documentation to \ntrack stock movement of wine \n8.2    Retrieval of designated red, white, sparkling and \nfortified wines to meet customer requests and/or \ndisplay and other internal requirements \n8.3    Verifying the condition of wines that are retrieved. \n9. Sensory appraisal of wine  \nMay Include: \n9.1 Swirling of wines, assessing clarity, describing color   \nand its intensity and assessment of alcohol content by \n‘legs‘ (viscosity). \n9.2 Recognizing ‘off’ odors, describing smell \ncharacteristics and assessing wine age. \n9.3 Recognized tasting and spitting techniques,       \nrecognizing acidity, sweetness, weight/body, length  \nand faults. \n9.4 Describing flavor intensity and assessing balance of         \nthe wine on the palate.  \n9.5 Consideration and evaluation of wine clarity, color, \ntype, alcohol, aroma, flavor, sweetness, acidity, body, \nweight, mouth feel, tannin, balance and length \n9.6 Consideration of the suitability of wines for  ageing/ \ncellaring.\n\n--- PDF PAGE 102 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n98 \n \nVARIABLE \nRANGE \n10.   Wine faults \nMay include:  \n10.1   Deposits, haze, tartrates, oxidation, cork taint and       \nexcessive sulphur. \n10.2   Visible problems with bottles, labels and corks before       \nwines are opened. \n10.3   Decanting of wines that have thrown deposits \n11. Wine and food  \ncombinations \nMay include: \n 11.1     Appetizers and entrees \n  11.2     Main course dishes, including primary ingredients \nthat include meat, such as beef, lamb, pork, and \npoultry, fish and seafood, pasta, wet dishes, salads, \nand cuisine dishes specific to the host country \n  11.3     Hot and cold desserts \n  11.4     Cheese platters \n  11.5     Nominated occasions, celebrations and special \nevents. \n12. Specialized dining room  \nservice \nMay include: \n12.1    Flaming or flambé service \n12.2    Food carving (poultry and game etc) \n12.3    Salad preparation \n12.4    Fruit slicing \n12.5    Deboning / Filleting fish \n \n 13.Guests engagement  \nMay include: \n13.1    Explaining the preparation and cooking process,        \nculinary terms, cooking styles and service options \n13.2   Telling of the history of the dish being prepared \n 13.3   Advising guests of the alternatives available within \nthe recipe for the dish being prepared. \n13.4    Seeking guest preferences and making suggestions \nfor dish variations. \n13.5    Allowing guests to sample products \n13.6    Provision of showmanship. \n14. Professional and attractive \nmanner. \nMay include: \n14.1    Hygienic presentation of completed items \n14.2    Neatness, balance, equal serve sizes when serving    \nmore than one person. \n14.3    Use of correct service wear, cutlery and glassware \n 14.4    Use of patron service and interpersonal skills.\n\n--- PDF PAGE 103 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n99 \n \nVARIABLE \nRANGE \n1. Restrictions for service \nMay include: \n15.1    Customers behaving in an intoxicated manner \n15.2    Customers behaving in a violent or disorderly manner \n15.3    Under-age persons \n15.4    Persons under an exclusion order \n15.5    Persons requesting service outside licensing hours \n15.6    Safe drinking and/or responsible service of alcohol   \nguidelines.\n\n--- PDF PAGE 104 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n100"
