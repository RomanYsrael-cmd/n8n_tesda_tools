tective clothing as appropriate which may \ninclude thermal clothing, gloves, and protective boots \n8. Waste Removal \n May include: \n8.1 Taking packaging out of storage areas \n8.2 Identifying and removing damaged or un-saleable       \nitems from the storage areas. \n8.3 Applying environmentally friendly practices to waste \nmaterials where appropriate, including the re-use of \nmaterials within the organization and recycling of suitable \nmaterials \n9. Stock labeling \nMay Include:  \n9.1 Placing labels on storage containers and shelving to    \nidentify stock items and indicate delivery date. \n9.2 Preparing hand written labels and attaching them to \nindividual stock items \n9.3 Using electronic bar coding and labelling equipment \n9.4 Observing food safety requirements in relation to the \nlabelling of food \n10.Stock rotation \nMay include: \n10.1 Applying stock rotation protocols relevant to individual \nstock type including: \n10.1.1 First In, First Out \n10.1.2 First In, Last Out \n10.1.3 Last In, First Out \n10.1.4 Last In, Last Out \n11.Stock inspection \nMay include:  \n11.1 Undertaking Visual Inspections Of Storage Area  \n11.2 Identifying stock approaching use-by date and out of \ndate stock \n11.3 Adhering to internal inspection schedules and checklists \n11.4 Checking stock quality \n11.5 Looking for signs of pest infestation, physical damage \nto the storage area itself, damage or degradation to \nstock items \n11.6 Ensuring stock is aligned with designated storage \nareas, bins etc. \n12.Remedial action \nMay include: \n12.1 Notifying relevant personnel\n\n--- PDF PAGE 119 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n115 \n \nVARIABLE \nRANGE \n12.2 Arranging for maintenance, including in-house and \nexternal \n12.3 Re-locating stock \n12.4 Protecting stock \n12.5 \nDisposing of damaged stock, including disposal to \nwaste, or returning items to suppliers \n12.6 Arranging for nominated stock items to be used \nimmediately \n12.7 Arranging for stock to be returned to suppliers \n12.8 Acting to address identified problems and threats as \nthe need demands, including pest control, repairs to \nstore rooms, removal of threats and damaged stock, \ncleaning, re-positioning stock to designated areas.\n\n--- PDF PAGE 120 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n116"
