        "source_text": "--- PDF PAGE 51 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n47 \n \n  \n      UNIT OF COMPETENCY    :      WORK COOPERATIVELY IN A GENERAL   \nADMINISTRATION ENVIRONMENT \n                                                    \n   UNIT CODE  \n   : \nTRS141202 \n \n   UNIT DESCRIPTOR            : \nThis unit deals with the skills and knowledge required to work \ncooperatively in a general administration environment in a \nrange of settings within the labor divisions of the hospitality \nindustry. \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \n1. Develop \neffective team \nrelationships \n1.1 Relationships with \nteam members and \npromote benefits of \ncooperative work \nconsistent with \norganizational goals \nand objectives are \ndeveloped and \nmaintained \n1.2 Responsibilities and \nassignments in a \npositive manner to \npromote effective \nrelationships within \nthe work group are \nundertaken \n1.3 Courteous and \nappropriate \ncommunication with \nothers in a manner, \nwhich reflects \nsensitivity to \nindividual social and \ncultural differences \nin accordance with \norganizational \nrequirements, are \nconducted  \n1.4 Communication \ntechniques to relay \ninformation in a clear \nand concise manner \nare used  \n1.5 Language and tone \nappropriate to a \nparticular audience, \npurpose and \nsituation, taking into \naccount the relevant \n1.1 Principles of \neffective \ncommunication skills \n1.2 Feedback \ntechniques and \nteam building \ntechniques to build \nand maintain \ninterpersonal \nrelationships within \na designated work \ngroup or team \n1.3 Communicate \neffectively with a \nrange of people \nrelevant to position \nand role \n1.4 Customer relations \n1.5 Enterprise’s policies \nand procedures in \nresolving complaints \nand conflict \n \n1.1 Questioning and \ncommunication skills \n1.2 Research skills \n1.3 Analytical skills \n1.4 Ability to research \nindustry information \nsources \n1.5 Identifying relevant \ninformation \n1.6 Compilation and \nclassification of \ninformation and data \n1.7 Networking skills\n\n--- PDF PAGE 52 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n48 \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \nfactors involved are \nused \n1.6 Issues that may lead \nto, or involve conflict \nwith team members, \nor refer to \nappropriate persons \nare recognized and \ndiscussed \n1.7 Routine workplace \ndocumentation is \ncompleted accurately \nand in a timely \nmanner  \n2.  Participate in \nteam \nassignments \n2.1 Individual \nresponsibilities within \nthe workgroup in \naccordance with \norganisational \nrequirements are \nidentified and met \n2.1 Cultural differences \nwithin the team are \nrecognized and \naccommodated  \n2.1 Principles of \neffective \ncommunication \nskills \n2.2 Feedback \ntechniques and \nteam building \ntechniques to build \nand maintain \ninterpersonal \nrelationships within \na designated work \ngroup or team \n2.3 Communicate \neffectively with a \nrange of people \nrelevant to position \nand role \n2.4 Customer relations \n2.5 Enterprise’s policies \nand procedures in  \nresolving \ncomplaints and \nconflict \n \n2.1 Questioning and \ncommunication skills \n2.2 Research skills \n2.3 Analytical skills \n2.4 Ability to research \nindustry information \nsources \n2.5 Identifying relevant \ninformation \n2.6 Compilation and \nclassification of \ninformation and data \n2.7 Networking skills \n \n \n \n3.  Contribute to \nteam \ndevelopment \n \n \n \n3.1  Both internal \ncustomer and \nexternal customer \nneeds and \nexpectations in \naccordance with \norganiza