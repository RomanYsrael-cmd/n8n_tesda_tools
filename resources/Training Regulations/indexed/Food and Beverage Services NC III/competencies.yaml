ure \n2.3 Principles of OHS \n2.4 Waste Management \n \n2.1 Stock management \nskills \n2.2 Ability to apply safe \nmanual handling \nprocedures\n\n--- PDF PAGE 116 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n112 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED  \nKNOWLEDGE \nREQUIRED  \n           SKILLS \n3 Maintain \ninventory and \nstorage areas \n \n3.1 Inventory of food, \nequipment, small-\nware and liquors are \ncontrolled in \naccordance with the \nenterprise \nprocedures. \n3.2 Slow and fast moving \nitems are checked in \naccordance with \nenterprise standards. \n3.3 Needed food items, \nsupplies and \nequipment are \nrequested to ensure \nquality and timely \ndelivery of service \n3.4 Stock aligning  are \nrotated with \nenterprise and stock \nitem requirements \n3.5 Remedial action are \ntaken where stock \nrelated issues are \nidentified \n \n \n \n3.1 Principles of stock \ncontrol and rotation  \n3.2 Segregation of non-\nfood items from food \nitems that have \npotential to cross-\ncontaminate \n3.3 Computerized stock \ncontrol system \n3.4 Correct and \nenvironmentally \nsound waste \ndisposal  methods \n \n3.1 Organizing Skills \n3.2 Communication skills \nto make accurate \ninventory and \nrequisition of stock  \n3.3 Problem-solving skills \n3.4 Arithmetic and \nnumeracy skills \n3.5 Manual inventory \n3.6 Ability to use safe \nfood and beverage \nstorage practices in \naccordance with \ncountry’s legislated \nrequirements \n3.7 Problem solving skills \nto identify, record, \nand report order \ndiscrepancies and \nquality of stock items \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nRANGE OF VARIABLES\n\n--- PDF PAGE 117 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n113 \n \n \nVARIABLE \nRANGE \n1. Inventory \nMay 