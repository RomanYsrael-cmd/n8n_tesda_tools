ge of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \n4.3 Routine supply \nproblems are \nfollowed up or \nreferred to the \nappropriate person \nin accordance with \ncompany policy. \n4.4 Stock is distributed \nto agreed locations \n4.3 Stock recording \nsystems \n4.4 Stock security \nsystems \n4.5 Types of stock \ncontrol \ndocumentation and \nsystems that may be \napplied in the \nhospitality industry \n4.6 Reasons for stock \nloss and damage \n4.7 Company \nprocedures \n \n \n \n5. Organize and \nadminister \nstocks \n5.1 Stocks are organized \nat appropriate \nintervals according to \ncompany policy and \nprocedures \n5.2 Stocktaking \nresponsibilities are \nallocated to staff \n5.3 Accurate stock \nreports are produced \nwithin designated \ntimelines \n5.1 Stock level \nmaintenance \ntechniques  \n5.2 Typical stocktaking \nprocedures as \nappropriate to the \nindustry sector \n5.3 Stock recording \nsystems \n5.4 Stock security \nsystems \n5.5 Types of stock \ncontrol \ndocumentation and \nsystems that may be \napplied in the \nhospitality industry \n5.6 Reasons for stock \nloss and damage \n5.7 Company \nprocedures \n \n5.1 Collect, organize and \nanalyze information \n5.2 Plan and organize \nactivities \n5.3 Monitoring delivery \nprocess \n5.4 Organizing stocks\n\n--- PDF PAGE 70 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n66 \n \n      RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Stock \nMay include: \n1.1 Food \n1.2 Beverages \n1.3 Equipment such as maintenance and cleaning \nequipment, office equipment \n1.4 Linen \n1.5 Stationery \n1.6 Brochures and promotional materials \n1.7 Cleaning supplies and chemicals \n1.8 Vouchers and tickets \n1.9 Souvenir products \n2. Stock losses \nMay include: \n2.1 Lack of rotation leading to product deterioration \n2.2 Inappropriate storage conditions \n2.3 Access by pests or vermin \n2.4 Theft \n2.5 Overstocking\n\n--- PDF PAGE 