        "source_text": "--- PDF PAGE 72 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n68 \n \nUNIT OF COMPETENCY \n:    PREPARE AND DELIVER TRAINING SESSIONS \n \nUNIT CODE \n        :    TRS141206 \n \nUNIT DESCRIPTOR           :    This unit deals with skills and knowledge required to prepare \nand deliver in-house training sessions in a range of settings \nwithin the hospitality industry workplace context. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italicized terms \nare elaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1.  Determine \ntraining \nrequirements \n \n1.1 Current competencies of \nlearners are identified  \n1.2 Required competencies \nfor learners are identified  \n1.3 The training gap for \nlearners are described \n1.4 The identified training gap \nwith relevant personnel \nare confirmed  \n1.5 Support available for \ntraining provision are \ndetermined \n1.6 Recommendations for \ntraining are presented \n1.1 Active listening \ntechniques \n1.2 Record keeping \n1.3 Assessment process \n1.4 Enterprise’s policies \nand procedures \n1.5 Appropriate \nperformance \nassessment \n \n \n1.1 Questioning and \ncommunication \nskills \n1.2 Research skills \n1.3 Analytical skills \n1.4 Ability to research \nindustry information \nsources \n1.5 Identifying relevant \ninformation \n1.6 Compilation and \nclassification of \ninformation and \ndata \n1.7 Networking skills \n2. Prepare \ntraining plan \n \n2.1 Session outlines for \napproved training are \ndeveloped \n2.2 Training content are \ndeveloped \n2.3 Training resources and \nmaterials are developed \n2.4 Individual training \nsessions are developed \n2.5 Training requirements are \norganized \n2.1 Active listening \ntechniques \n2.2 Record keeping \n2.3 Assessment process \n2.4 Enterprise’s policies \nand procedures \n2.5 Appropriate \nperformance \nassessment \n \n \n2.1 Questioning and \ncommunication \nskills \n2.2 Research skills \n2.3 Analytical skills \n2.4 Ability to research \nindustry information \nsources \n2.5 Identifying relevant \ninformation \n2.6 Compilation and \nclassification of \ninformation and \ndata \n2.7 Networking skills \n3. Deliver \ntraining \nsessions \n \n3.1 Attendance of learners at \nthe training session is \nconfirmed \n3.2 The training venue for the \ntraining session is \nprepared.  \n3.3 Training topic to learners \nis introduced. \n3.4 The training and \nassessment activities \ninvolved in the training \nsession is explained. \n3.5 Training session is \npresented.  \n3.1 Active listening  \ntechniques \n3.2   Record keeping \n3.3   Assessment    \n3.4   process \n3.5   Enterprise’s \npolicies and \nprocedures \n3.6   Appropriate \nperformance \nassessment \n \n \n3.1 Questioning and \ncommunication \nskills \n3.2 Research skills \n3.3 Analytical skills \n3.4 Ability to research \nindustry information \nsources \n3.5 Identifying relevant \ninformation \n3.6 Compilation and \nclassification of \ninformation and \ndata\n\n--- PDF PAGE 73 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n69 \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italicized terms \nare elaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3.6 Opportunities for learners \nto practice skills are \nprovided \n3.7 Feedback to learners is \nprovided \n3.8 On-going safety of learners \nduring training delivery and \npractice is ensured \n3.7 Networking skills\n\n--- PDF PAGE 74 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n70 \n \n  RANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Current competencies of \nlearners  \nMay include: \n1.1 Observing workers’ practices \n1.2 Undertaking peer reviews \n1.3 Administering self-evaluation and analysis forms to \nworkers 