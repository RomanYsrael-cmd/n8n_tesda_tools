        "evidence_guide": {
          "source_text": "--- PDF PAGE 110 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n106 \n \nUNIT OF COMPETENCY :     PROCESS FINANCIAL SALE TRANSACTIONS \n \nUNIT CODE \n: \nTRS513304  \n \nUNIT DESCRIPTOR \n: \nThis unit deals with skills and knowledge required to ready point \nof sale for operation and process cash or other payments, and to \nreconcile takings at the end of the service period or day.  \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \n1. Prepare point of \nsale area for \noperation \n \n1.1  Point of sale \nregister/ terminal is \nprepared for \noperation in \naccordance with the \nenterprise standard.  \n1.2  Cash float and \nsupplies of change are \nobtained and ensured. \n1.3 Supplies of point of \nsale documentation \nare obtained at the \nbeginning of the shift.  \n1.1 Established policies \nand procedures for \npoint-of-sale  \n1.1.1 Cash handling \n1.1.2 cash \nprocessing  \n1.2 Point of sale \ndocumentation \n \n \n \n1.1 Numeracy and \nArithmetic Skills \n1.2 Working with others  \n1.3 Cooperate with \nothers in relation to \nobtaining cash float, \nchange, \ndocumentation and \ninformation \n1.4 Organizing Skills \n2. Process \npayments and \nreceipts during \ntrade \n \n2.1 Amount due from     \ncustomer/guest are \ncalculated and \nverified.  \n2.2 Cash and non-cash \npayments are \naccepted, accurately \ncounted and receipts \nare issued.  \n2.1 Advanced deposits \npayments and refunds \nare processed in \naccordance with \nenterprise policy. \n2.2 Customer/guest \nservice skills  in \nprocessing payments \nare applied \n \n2.1 Procedures for \nprocessing cash and \nnon-cash payments \n2.2 Cash security \nprotocols  \n2.3 Procedures for \nprocessing advance \ndeposits and \nrefunds  \n2.4 Tax related \nrequirements \n2.5 Use of cash register, \ncalculator POS  \n2.6 issuing receipts  \n \n2.1 Accurate and fast \nCash counting skills \n2.2 Numeracy and \nArithmetic Skills \n2.3 Basic Accounting \nskills \n2.4 Communication skills \nin explaining charges \nto customers \n2.5 Customer relations \nskills \n2.6 Problem Solving \nskills in case of \ndiscrepancies\n\n--- PDF PAGE 111 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n107 \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \n3. Reconcile \nfinancial \ntransaction at \nend of trade \n \n3.1 End of shift \ndocumentation are \ncompleted in \naccordance with the \nenterprise policy. \n3.2 Balance between \nregister/terminal \nreading and cash and \nnon-cash totals are \nproperly determined. \n3.3 Discrepancies in \ntakings are \ninvestigated and \nresolved in \naccordance with the \nenterprise policy \n \n3.1 Reconciliation \nprocess \n3.2 Documentation \nsecurity procedures \n3.3 Operating \nprocedures of cash \nregister / POS \nterminal  \n \n    \n3.1 Scheduling \nreconciliation \nactivities  \n3.2  Basic accounting \nskills \n3.3 Problem solving skills \n3.4 Resolving  and \nreconciling \ndiscrepancies  \n3.5 Recording and \nDocumentation skills\n\n--- PDF PAGE 112 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n108 \n \nRANGE OF VARIABLES  \n \n \nVARIABLE \nRANGE \n1.Prepare point of sale \nregister/ terminal \nMay include: \n1.1 \nTurning equipment on \n1.2 \nAltering date \n1.3 \nUpdating price/product look up (plus) to reflect \nspecials and deals \n1.4 \nChecking operation of register/terminal \n1.5 \nVerifying audit roll and/or replacing as \nrequired \n1.6 \nCleaning register/terminal. \n \n2.Point of sale documentation \nMay include: \n2.1 \nRegister/terminal audit rolls \n2.2 \nRegister/terminal receipt roll \n2.3 \nReceipt book \n2.4 \nRefund documentation \n2.5 \nChange ordering documentation \n2.6 \nReconciliation documentation \n2.7  Credit card documentation \n2.8 Payment documentation \n2.9 Void transactions \n \n3. Amount due \nMay include: \n3.1 \nCalculating all service fees \n3.2 \nEnsuring appropriate discounts are given to \ncustomers/guests \n3.3 \nCalculating appropriate taxes, fees and levies \n3.4  Explaining all charges to customers/guests. \n \n4. Cash payments \nMay include: \n4.1     Payment in a foreign currency \n4.2     Verifying money presented by customer/guest \n4.3     Calculating currency exchange rates and relevant \nfees,   where applicable. \n \n5. Non-cash payments \nMay Include : \n5.1     Debit and credit cards \n5.2     Checks, including personal, business and travellers’’ \nchecks. \n5.3     Electronic funds transfers at point of sale \n1.8   In-house vouchers \n5.5    Charges to company accounts \n5.6    Foreign currency \n5.7    Making required checks to ensure authenticity of    \npayment option.\n\n--- PDF PAGE 113 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n109 \n \nVARIABLE \nRANGE \n6. Customer/ guest service \nskills \nMay include: \n6.1     Creating and maintaining positive environment \n6.2     Resolving charging issues and problems \n6.3     Negotiating solutions  \n6.4     Providing sales and product advice to \ncustomers/guests \n6.5     Maintaining security of cash. \n \n7. End of shift documentation \nMay include: \n7.1 \n Completing change order forms \n7.2 \n Completing daily takings sheets \n7.3 \n Completing non-cash documentation \n7.4 \n Signing off from register / terminal. \n \n8. Balance determination  \nMay include: \n8.1    Determining expected totals \n8.2    Calculating actual cash and non-cash takings \n8.3    Comparing expected and actual figures \n8.4    Factoring in relevant documentation such as cash out \nslips, refunds, disbursements, complimentary sales \nand excess monies removed from the register/terminal \nduring trade. \n \n9. Discrepancies investigation \nMay include: \n9.1    Re-counting cash  \n9.2    Re-calculating non-cash totals \n9.3    Checking audit roll for comments in relation to over-rings \n9.4    Analysing sales shown on audit roll \n9.5    Checking with staff to identify possible causes of    \ndiscrepancies. \n9.6    Verifying additions and all documented calculations \n9.7   Checking supporting documents.\n\n--- PDF PAGE 114 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n110 \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrated ability to apply the requirements of the \nhost enterprise in preparing register / terminal for \noperation.  \n1.2 Knowledge on operation of register/terminal, POS or \ncalculator \n1.3 Processed transactions during trade which include: cash \nand non-cash payments, deposits and refunds.  \n1.4 Demonstrated  ability to balance takings for a shift/day \nincluding cash and non-cash figures \n1.5 Resolved discrepancies between expected and actual \nsales figures \n2.  Resource  Implications \nThe following resources should be provided: \n2.1 Use of actual cash and non-cash transactions and \nactual internal documentation used by the host \nenterprise. \n2.2 Calculator \n2.3 Local currency examples of notes and coins \n2.4 A simulated Point of Sale Terminal or register if possible \n2.5 A cash drawer  \n2.6 Examples of bank card payments, personal cheques, \naccounts, vouchers and receipts where possible \n3.  Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Demonstrations with Oral questioning  \n3.2 Portfolio \n4. Context of Assessment \n4.1   Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center.",
