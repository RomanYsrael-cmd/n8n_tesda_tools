        "source_title": "ORGANIZE FUNCTIONS RELATED TO FOOD AND BEVERAGES SERVICE AT A HOTEL OR RESTAURANT",
        "source_text": "--- PDF PAGE 105 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n101 \n \nUNIT OF COMPETENCY :     ORGANIZE FUNCTIONS RELATED TO FOOD AND  \n \n      BEVERAGES SERVICE AT A HOTEL OR RESTAURANT  \n \nUNIT CODE \n: \nTRS513303  \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge and skills in supervising the tasks \nand duties related to the proper functioning of a banquet event. \nThis includes banquet logistics of pre-function set up, food and \nbeverage service and post event clean up. \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \n1. Supervise pre-\nfunction  mise- \nen place \n1.1 Adequate supplies \nare obtained in \naccordance to \nevent/function \nrequirements. \n1.2 Tables and chairs are \nset up according to \nevent/function \nrequirements \n1.3 Serving stations/food \nislands are set up in \ndesignated locations. \n1.4 Tableware are \ninspected for \ndamages and \ncleanliness \n1.5  Floor plan/ seating \ndiagram is prepared \nand available for \nreference of the \nbanquet staff. \n1.6 Flatware is set \naccording to the \nmenu. \n1.7 Meetings and \nbriefings are \nconducted prior to the \nbanquet function. \n1.1 Types of event \n1.2 Banquet / event \nrequirements. \n1.3 Banquet set-up and \nlayout \n1.4 Table set up \n1.5 Principles of \nhygiene, safety and \nsanitation \n1.6 Quality control \n1.7 Banquet Event \nOrder (BEO) \n \n1.1 Organizing skills \n1.2 Setting up banquet \n1.3 Creativity in \npreparing floor plan \nand layout \n1.4 Table setting \n1.5 Communication skills \n \n1.8 Contingency plans \nare created to ensure \nsmooth delivery of \nservice \n1.9 BEO are executed \nand interpreted based \non the event \nrequirement and \nresources \n1.10 Quality of the food to \nbe served is checked \nbased on the guest’s \nrequest.\n\n--- PDF PAGE 106 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n102 \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \n \nREQUIRED  \nKNOWLEDGE \n \nREQUIRED  \nSKILLS \n2. Oversee meal \nservice \n2.1 Contact with host, \nchef and kitchen staff \nis maintained all \nthroughout the event. \n2.2 Prompt delivery of \neach course to every \ntable is ensured. \n2.3 Timing of service of \neach course of the \nmeal is coordinated \nwith the kitchen, \nservice staff and host. \n2.4 Banquet staff work \nand pace are \nmonitored all \nthroughout the meal \nservice. \n2.5 The banquet service \nstyle is implemented \nin accordance with \nwhat is stipulated in \nthe event order form \nor with special \narrangement with the \nhost. \n2.6 HVAC is controlled \nrelative to ambient \ntemperature \n2.1 Banquet / Catering \nservice \n2.2 Banquet service \nstyles \n2.3 Principles of \nSafety, Hygiene \nand Sanitation  \n2.4 Banquet Event \nOrder Form \n2.5 Service delivery \ntiming  \n2.6 VIP assistance \n \n \n2.1 Ability to perform and \nmonitor banquet \nservice \n2.2 Working with team \n2.3 Interpreting Banquet \nEvent Order Forms \n2.4 Communication Skills \n2.5 Customer service \n3. Supervise after \nmeal service \n3.1 Coffee and tea \nservice is provided \nupon guest request. \n3.2 Banquet area “break \ndown” is supervised \naccording to enterprise \nstandards. \n3.3 Event report is \nprepared after each \nfunction \n3.4 Waste disposal \nprocedures are \nmonitored after each \nfunction. \n3.1 After meal service  \n3.2 Event report content \n3.1 Preparing Event \nreport \n3.2 Coffee / Tea Service \n3.3 Communications \nSkills \n \n \n4 Perform \ncustomer \nrelations \n4.1 Guest needs and \nconcerns are \nattended promptly. \n4.2 Professional \ndemeanor of the staff \nis checked at all \ntimes. \n4.1 Service etiquette \n4.2 Professional \ngrooming standards \n4.1 Communication skills \n4.2 Effective customer \nand staff relations  \n4.3 Handling guest \ncomplaints\n\n--- PDF PAGE 107 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n103 \n \nRANGE OF VARIABLES  \nVARIABLE \nRANGE \n1. Meetings and briefings \nMay include: \n1.1 \nType of event \n1.2 \nEvent date/time/number of participants \n1.3 \nMenu items and descriptions \n1.4 \nMajor ingredients of the menu \n1.5 \nSauces \n1.6 \nAccompaniments \n1.7 \nPredominant spices and seasonings \n1.8 \nDecorations/theme/concept  \n1.9 \nService style \n1.10 Station assignments \n1.11 VIP guests \n1.12 Special instructions  \n1.13 Reminders on energy conservation and waste \nmanagement \n2. Contingency plans \nMay include : \n2.1    Safety and security  \n2.2    Weather condition \n2.3  Special dietary requirements of guest \n2.4  Last minute changes /client request \n2.5  Program adjustment \n2.6  Guest attendance exceeded the reservation \n2.7  Traffic condition \n2.8 VIP arrival \n2.9 Defective equipment \n2.10 Guests’ complaints  \n3. Normal Banquet staff work \nMay include: \n3.1 Refilling of water \n3.2 \nProviding correct silverware or flatware \n3.3 \nAnticipating guest needs \n3.4 \nAnswering inquiries \n4. Room “break down” \nMay include: \n4.1 \nClear all tables \n4.2 \nClear all tablewares (silverware, glassware etc.) \n4.3 \nDispose of decorations’ \n4.4 \nCollect linen according to standards \n4.5 \nClearing out of tables and chairs \n4.6 \nCleaning/vacuuming of floors \n4.7 \nProper food waste disposal \n5. Event Report \nMay include : \n5.1 \nActual number of covers \n5.2 \nGuest concerns \n5.3 \nIncident reports \n5.4 \nPrice/cost of function \n5.5 \nBreakage reports \n5.6 \nNumber of staff \n5.7 \nSummary of the function\n\n--- PDF PAGE 108 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n104 \n \nVARIABLE \nRANGE \n6. Professional demeanor \nMay include : \n6.1 \nProper uniform \n6.2 \nGrooming and personal standards \n6.3 \nEffective communication skills \n6.4 \nProper footware \n6.5 \nPolite and courteous manner towards guests\n\n--- PDF PAGE 109 ---\nFOOD AND BEVERAGE SERVICES NC III   Revision 02                    Promulgated  (10/29/2018)                         \n105 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Set up banquet function room according to prescribed \nrequirements \n1.2 Conducted pre-event meetings or briefings with the \nstaff. \n1.3 Crafted contingency plans according to the \nrequirements of the event. \n1.4 Coordinated between the service staff and kitchen and \nother departments that are concerned with the event \n1.5 Monitored staff performance during the event \n1.6 Prepared pre and post evaluation reports \n1.7 Checked the quality of food to be served \n \n2. Resource  Implications \nThe following resources should be provided: \n2.1 Actual event or function / Simulated event \n2.2 Banquet event forms \n2.3 Staff schedules \n \n3. Methods of Assessment \nCompetency in this unit may be assessed through : \n3.1 Demonstrations with Oral questioning  \n3.2 Portfolio \n \n4. Context of Assessment \n4.1   Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center.\n",
