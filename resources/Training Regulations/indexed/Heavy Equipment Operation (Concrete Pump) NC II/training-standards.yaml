      "source_text": "3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for the operation of concrete pump.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n2 sets\n• Standard\nmechanical hand\ntools\n2 pcs\n• Two-way radio\n3 units\n• Sponge ball\n(soft)\n25 pcs.\n• Hard hat\n1 unit\n• Concrete Pump\n3 units\n• Sponge ball\n(hard)\n25 pcs.\n• Ear guards\n\n• Ready mixed\nconcrete*\n25 pairs\n• Safety shoes\n\n500\nliters\n• Water\n2 pcs.\n•\nPlier\n\n18 liters\n•Engine oil\n1 unit\n• Fire extinguisher\n\n800\nliters\n• Diesel fuel\n25 pcs.\n•\nEye goggles\n\n50 liters\n•Hydraulic oil\n25 pcs.\n•\nCover alls\n\n10 kilos • Forming\ngrease\n25 pcs.\n•\nEye goggles\n\n3 pcs.\n•Suction filter\n1 set\n•\nPressure gauge\n\n2 pcs.\n•Air filter\n5 pcs.\n•\nHammer\n\n25 kilos •\nWaste rags\n5 pcs.\n•\nBlunt chisel\n\n*Quantity will depend on actual training consumption\n\n--- PDF PAGE 76 ---\nTR HEAVY EQUIPMENT OPERATION"
