    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION - CONCRETE PUMP\nNC Level: NC II\n\n BASIC COMPETENCIES\nNominal Training Hours: 18 Hours (Basic) + 24 Hours (Common)\nCourse Description:\n\n This course is designed to equip individual with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation.\n\n To obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\n related documents\n1.3 Participate in workplace\n meeting and discussion\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 69 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and development\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 70 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Interpret\ntechnical\ndrawings and\nplans\n\n1.1 Read / Interpret blueprints\n and plans\n1.2 Perform freehand\nsketching\nLecture\nDemonstration\nPractical\nexercises\n\nDemonstration\nand oral\nquestioning\nWritten test\n\n2. Observe\nprocedures,\nspecifications\nand manuals\nof instructions.\n2.1 Identify and access\n specifications / technical\n manuals\n2.2 Interpret technical\nmanuals\n2.3 Apply information in\ntechnical manual\n2.4 Store technical manual\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n3. Perform\n mensurations\n and\ncalculations\n3.1 Select measuring\n instruments\n3.2 Carryout measurement and\n calculations\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n4. Maintain tools\nand equipment\n4.1 Check condition of tools\n and equipment\n4.2 Perform preventive\n maintenance\n4.3 Store tools and equipment\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n5. Prepare\nconstruction\nmaterials and\ntools\n5.1 Identify Materials\n5.2 Request Materials\n5.3 Receive and inspect\nmaterials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n\n--- PDF PAGE 71 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCORE COMPETENCIES\n\nCourse Title : HEAVY EQUIPMENT OPERATION Level: NC II\n\n CONCRETE PUMP\n\nNominal Training Hours: 80 Hours\n\nCourse Description:\n\n This course is designed to enhance the knowledge, desirable attitudes and\nskills in the use of concrete pump in accordance with industry standards. It\ncovers core competencies such as: perform pre- and post operation procedure,\nperform equipment operation, perform basic preventive maintenance on a given\nconcrete pump.\n\n To obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost-operation\nprocedures for\nConcrete Pump\n1.1 Identify and explain the\nfunctions of controls,\ngauges, instruments,\nsafety devices and\nhydraulic implements\n1.2 Explain the importance of\nand elaborate on\nequipment cleaning and\nchecking procedures\n1.3 Perform checking,\ntesting and cleaning\nprocedures\nLecture\nPractical\nDemonstration\n• Observation\n• Demonstration\nwith oral\nquestioning\n• Written test\n\n--- PDF PAGE 72 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2. Perform\nproductive\noperation for\nConcrete Pump\n2.1 Identify and explain the\nimportance of safe work\npractices\n2.2 Identify and explain\nprocedures for checking\npipes laid and pumping\n2.3 Set pumping station\n2.4 Perform checking of\npipes laid procedures\n2.5 Perform pumping\nprocedure\n2.6 Identify and explain the\neffects of blockage\n2.7 Identify and explain\npossible unexpected\nsituations during\nproductive operation\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration\nwith oral\nquestioning\n• Written test\n3. Perform basic\npreventive\nmaintenance\nservicing for\nConcrete Pump\n3.1 Differentiate\n between minor and\n major equipment\n defects\n3.2 Identify and explain the\n use of basic hand tools\n and consumables\n3.3 Use basic hand tools in\n servicing minor defects\n and OS parts\n3.4 Prepare equipment\n report\n3.5 Perform good\n housekeeping\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration\nwith oral\nquestioning\n• Written test\n\n--- PDF PAGE 73 ---\nTR HEAVY EQUIPMENT OPERATION"
  },
