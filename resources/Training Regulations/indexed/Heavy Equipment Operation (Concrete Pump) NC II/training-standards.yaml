  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational\nEducation and Training (TVET) providers with information and other important\nrequirements to consider when designing training programs for HEAVY\nEQUIPMENT OPERATION (CONCRETE PUMP) NC II.\n\n 3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION - CONCRETE PUMP\nNC Level: NC II\n\n BASIC COMPETENCIES\nNominal Training Hours: 18 Hours (Basic) + 24 Hours (Common)\nCourse Description:\n\n This course is designed to equip individual with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation.\n\n To obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\n related documents\n1.3 Participate in workplace\n meeting and discussion\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 69 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and development\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 70 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Interpret\ntechnical\ndrawings and\nplans\n\n1.1 Read / Interpret blueprints\n and plans\n1.2 Perform freehand\nsketching\nLecture\nDemonstration\nPractical\nexercises\n\nDemonstration\nand oral\nquestioning\nWritten test\n\n2. Observe\nprocedures,\nspecifications\nand manuals\nof instructions.\n2.1 Identify and access\n specifications / technical\n manuals\n2.2 Interpret technical\nmanuals\n2.3 Apply information in\ntechnical manual\n2.4 Store technical manual\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n3. Perform\n mensurations\n and\ncalculations\n3.1 Select measuring\n instruments\n3.2 Carryout measurement and\n calculations\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n4. Maintain tools\nand equipment\n4.1 Check condition of tools\n and equipment\n4.2 Perform preventive\n maintenance\n4.3 Store tools and equipment\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n5. Prepare\nconstruction\nmaterials and\ntools\n5.1 Identify Materials\n5.2 Request Materials\n5.3 Receive and inspect\nmaterials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n\n--- PDF PAGE 71 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCORE COMPETENCIES\n\nCourse Title : HEAVY EQUIPMENT OPERATION Level: NC II\n\n CONCRETE PUMP\n\nNominal Training Hours: 80 Hours\n\nCourse Description:\n\n This course is designed to enhance the knowledge, desirable attitudes and\nskills in the use of concrete pump in accordance with industry standards. It\ncovers core competencies such as: perform pre- and post operation procedure,\nperform equipment operation, perform basic preventive maintenance on a given\nconcrete pump.\n\n To obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost-operation\nprocedures for\nConcrete Pump\n1.1 Identify and explain the\nfunctions of controls,\ngauges, instruments,\nsafety devices and\nhydraulic implements\n1.2 Explain the importance of\nand elaborate on\nequipment cleaning and\nchecking procedures\n1.3 Perform checking,\ntesting and cleaning\nprocedures\nLecture\nPractical\nDemonstration\n• Observation\n• Demonstration\nwith oral\nquestioning\n• Written test\n\n--- PDF PAGE 72 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2. Perform\nproductive\noperation for\nConcrete Pump\n2.1 Identify and explain the\nimportance of safe work\npractices\n2.2 Identify and explain\nprocedures for checking\npipes laid and pumping\n2.3 Set pumping station\n2.4 Perform checking of\npipes laid procedures\n2.5 Perform pumping\nprocedure\n2.6 Identify and explain the\neffects of blockage\n2.7 Identify and explain\npossible unexpected\nsituations during\nproductive operation\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration\nwith oral\nquestioning\n• Written test\n3. Perform basic\npreventive\nmaintenance\nservicing for\nConcrete Pump\n3.1 Differentiate\n between minor and\n major equipment\n defects\n3.2 Identify and explain the\n use of basic hand tools\n and consumables\n3.3 Use basic hand tools in\n servicing minor defects\n and OS parts\n3.4 Prepare equipment\n report\n3.5 Perform good\n housekeeping\nLecture\nPractical\ndemonstration\n• Observation\n• Demonstration\nwith oral\nquestioning\n• Written test\n\n--- PDF PAGE 73 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency\nstandards and the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and\nin-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach\nin training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n\n--- PDF PAGE 74 ---\nTR HEAVY EQUIPMENT OPERATION\n\n•\nDistance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer\ntechnologies.\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated.\n\n• Can communicate both oral and written (English or Tagalog)\n\n• Physically and mentally fit\n\n• Can perform basic mathematical computation.\n\n--- PDF PAGE 75 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for the operation of concrete pump.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n2 sets\n• Standard\nmechanical hand\ntools\n2 pcs\n• Two-way radio\n3 units\n• Sponge ball\n(soft)\n25 pcs.\n• Hard hat\n1 unit\n• Concrete Pump\n3 units\n• Sponge ball\n(hard)\n25 pcs.\n• Ear guards\n\n• Ready mixed\nconcrete*\n25 pairs\n• Safety shoes\n\n500\nliters\n• Water\n2 pcs.\n•\nPlier\n\n18 liters\n•Engine oil\n1 unit\n• Fire extinguisher\n\n800\nliters\n• Diesel fuel\n25 pcs.\n•\nEye goggles\n\n50 liters\n•Hydraulic oil\n25 pcs.\n•\nCover alls\n\n10 kilos • Forming\ngrease\n25 pcs.\n•\nEye goggles\n\n3 pcs.\n•Suction filter\n1 set\n•\nPressure gauge\n\n2 pcs.\n•Air filter\n5 pcs.\n•\nHammer\n\n25 kilos •\nWaste rags\n5 pcs.\n•\nBlunt chisel\n\n*Quantity will depend on actual training consumption\n\n--- PDF PAGE 76 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.5\nTRAINING FACILITIES\n\n The concrete pump operation workshop must be of concrete structure.\nBased on class size of 25 students/trainees the space requirements for the\nteaching/learning and circulation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL\nAREA IN\nSQ.\nMETERS\n•\nLecture area\n8.0 x 6.0 meters\n48M2\n1\n48M2\n•\nLearning resource area\n4.0 x 6.0 meters\n24M2\n1\n24M2\n•\nTool room / Storage area\n3.0 x 3.0 meters\n9M2\n1\n9M2\n• Wash, toilet and locker\nroom\n8.0 x 4.0 meters\n32M2\n1\n32M2\nTOTAL\n-\n-\n113M2\nFacilities / Equipment /\nCirculation*\n-\n\n1,000M2\nTOTAL AREA\n1,113M2\nArea requirement is equivalent to 30 percent of total teaching / learning areas\n*Equipment maneuvering area near concrete pump location and concrete pump\n(MOA)\n\n--- PDF PAGE 77 ---\nTR HEAVY EQUIPMENT OPERATION\n\n 3.6 TRAINERS’ QUALIFICATION\nHEAVY EQUIPMENT OPERATION (CONCRETE PUMP)\n\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of Heavy Equipment Operation (Concrete\nPump) NC II\n• Must have undergone training on Training Methodology III (TM III)\nor its equivalent\n• Must be physically and mentally fit\n• Must have at least 5 years job/industry experience*\n• Must be a civil service eligible (for government position only)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n--- PDF PAGE 78 ---\nTR HEAVY EQUIPMENT OPERATION"
}
