  "source_text": "Definition of Terms\n\n For the purpose of this Competency Standard, the words\n\nConcrete pump\nRefers to equipment used to pump ready mixed concrete.\nPumpable concrete design\n(PCD)\nRefers to flowability of concrete measured in centimeters.\nBlocking test\nIt refers to performance testing for hydraulic pump.\nWater test\nIt refers to performance testing for hydraulic pump,\nincluding all implements using water as medium.\n\n--- PDF PAGE 82 ---\nTR HEAVY EQUIPMENT OPERATION"
