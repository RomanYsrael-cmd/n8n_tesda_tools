ngine performance (low power, hard starting)  \n2.3 Poor working hydraulic implement \n \nTransit Mixer and Paver \n2.4 Defective electrical system  \n2.4.1 Charging \n2.4.2 Lighting \n2.4.3 Starting \n2.4.4 Monitoring / gauges \n \n2.5 Leakage on \n2.5.1 Air \n2.5.2 Fuel  \n2.5.3 Cooling \n2.5.4 Hydraulic system \n2.5.5 Gas \n \nTransit Mixer \n2.6 Weak / defective brakes \n \nPaver \n2.7 Busted hydraulic hose \n2.8 Worn-out track group  \n \n3. Appropriate \npersonnel \n \n \n \nMay include but not limited to: \n3.1 Operation equipment maintenance supervisor \n3.2 Maintenance Personnel  \nPaver \n3.3 Equipment Foreman\n\n--- PDF PAGE 56 ---\nTR HEAVY EQUIPMENT OPERATION                                                                            \n \n \n4. Operator- \nServiceable (OS) \nparts \n \n \n \n \n \n4.1 Filters  \n         4.1.1 Air cleaner \n         4.1.2 Water fuel separator \n4.2 All caps (oil, water, fluid and fuel)  \n \nTransit Mixer and Concrete Pump  \n4.3 Battery distilled water, clamps and holders \n4.4 Tire inflation \n \nConcrete Pump and Paver \n4.5 Belts \n \nPaver \n4.6 Battery terminal / connection \n4.7 Track tension \n4.8 Grease / lube points \n4.9 Cylinders \n4.10 Electrical and electronic components  \n4.10.1 Sensors \n4.10.2 Switches, relays \n4.10.3 Fuses\n\n--- PDF PAGE 57 ---\nTR HEAVY EQUIPMENT OPERATION                                                                            \n \n5. Fluid and Lubricants \nMay include but not limited to: \n5.1 Engine oil \n5.2 Hydraulic oil \n5.3 Battery distilled water  \n5.4 Coolant  \n \nConcrete Pump and Transit Mixer \n5.5 Cleaning solutions \n5.6 Water \n \nTransit Mixer and Paver \n5.7 Multi-purpose grease \n \nConcrete Pump \n5.8 Forming grease \n \nTransit Mixer \n5.9 Washer fluids \n5.10 Brake fluid oil \n5.11 Steering oil \n5.12 Gear oil \n5.13 Automatic Transmission Fluid\n\n--- PDF PAGE 58 ---\nTR HEAVY EQUIPMENT OPERATION                                                             