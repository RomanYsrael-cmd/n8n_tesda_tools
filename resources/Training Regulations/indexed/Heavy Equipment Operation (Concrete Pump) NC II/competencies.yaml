sing \n         8.1.14 Push over valve \n \n         Transit Mixer \n         8.1.15 PTO \n         8.1.16 Steering \n         8.1.17 Shifting lever                 \n         8.1.18 Mixing / discharging lever \n         8.1.19 Differential lock \n \n8.2 Gauges \n         8.2.1 Battery charging \n         8.2.2 Pressure (oil and air) \n         8.2.3 Temperature (oil and water) \n \n         Concrete Pump and Transit Mixer \n         8.2.4 Fuel level \n \n         Transit Mixer and Paver \n         8.2.5 Hour meter     \n \n         Concrete Pump \n          8.2.6 Vacuum pressure \n \n         Transit Mixer \n          8.2.7 Tachometer\n\n--- PDF PAGE 47 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n   \nContinuation \n8.3 Indicator  \n         \n        Concrete Pump           \n        8.3.1 Hour meter \n        8.3.2 Stroke count \n        8.3.3 Reset horn \n        8.3.4 Proximity lit \n \n        Transit Mixer \n        8.3.5 Differential and inter axle lock \n        8.3.6 PTO \n        8.3.7 Parking brake \n        8.3.8 Engine / exhaust brake \n         \n8.4 Leaks \n \n         8.4.1 Coolant \n         8.4.2 Fuel \n \n         Concrete Pump and Transit Mixer     \n         8.4.3 Air \n         8.4.4 Hydraulic \n \n         Concrete Pump       \n         8.4.5 Form grease \n         8.4.6 Water \n \n         Transit Mixer \n         8.4.7 Suspension charge \n         8.4.8 Lubricating \n         8.4.9 Washer fluid \n         8.4.10 Exhaust pipes \n \n         Paver \n         8.4.11 Fuel \n         8.4.12 Oil\n\n--- PDF PAGE 48 ---\nTR HEAVY EQUIPMENT OPERATION  \n \n \n   \n \n \n8.5 Electrical/ switches \n          8.5.1 Lights \n          8.5.2 Horn \n \n          Concrete Pump and Transit Mixer   \n          8.5.3 Safety devices \n \nConcrete Pump \n8.6 Grout leaks \n          8.6.1 Water box \n          8.6.2 Transfer tube \n          8.6.3 Agitator paddle shaft bearing \n          8.6.4 Pressure connection \n \nTransit Mixer \n8.7 Steering and brakes\n\n-