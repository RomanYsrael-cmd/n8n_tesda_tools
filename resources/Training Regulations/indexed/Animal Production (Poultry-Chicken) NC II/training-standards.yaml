      "source_text": "3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n\no The training is based on curriculum developed from the\ncompetency standards;\no Learning is modular in its structure;\no Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\no Training is based on work that must be performed;\no Training materials are directly related to the competency standards\nand the curriculum modules;\no Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\no Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\no Training allows for multiple entry and exit; and\no Training programs are registered with UTPRAS.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by\nthe competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\no The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\no Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery\no Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\no Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\no Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\no Project-Based Instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate projects\nthat have real world applications.\n\n--- PDF PAGE 66 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II\nPromulgated December 2013\n64"
    },
