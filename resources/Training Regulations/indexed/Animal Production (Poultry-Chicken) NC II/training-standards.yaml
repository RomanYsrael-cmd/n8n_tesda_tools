    "source_text": "SECTION 3. TRAINING STANDARDS \n \nThese guidelines are set to provide the Technical and Vocational Education and \nTraining (TVET) providers with information and other important requirements to \nconsider when designing training programs for ANIMAL PRODUCTION (POUTLRY-\nCHICKEN) NC II. \n \n3.1 CURRICULUM DESIGN \n \nCourse Title: ANIMAL PRODUCTION (POULTRY-CHICKEN) NC Level NC II \n \nNominal Training Duration: \n18 hrs – Basic Competencies \n \n \n \n \n \n48 hrs – Common Competencies \n \n \n \n 160 hrs – Core Competencies \n \n \n 40 hrs – Elective Competencies \n \n \n \n \n \n---------- \n \n \n \n \n \n226 hrs -Total \nCourse Description: \n \nThis course is designed to enhance the knowledge, desirable attitudes and skills \nof animal production technician in accordance with industry standards. It covers \nmaintaining of poultry house, performing brooding and growing of birds, \nperforming pre-lay and lay activities and beak trimming of birds,. It also includes \ncompetencies in workplace communication, teamwork, safety in the use of hand tools \nand equipment, and housekeeping \n \n \nBASIC COMPETENCIES \n18 hours \nUnit of Competency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n1. Participate in \nworkplace \ncommunication \n1.1 Obtain and convey \nworkplace information. \n1.2 Complete relevant work \nrelated documents. \n1.3 Participate in workplace \nmeeting and discussion. \n• Group \ndiscussion \n• Interaction \n \n• Demonstration \n• Observation \n• Interviews/ \nquestioning \n2. Work in a team \nenvironment \n2.1 Describe and identify \nteam role and \nresponsibility in a team. \n2.2 Describe work as a team \nmember. \n• Discussion \n• Interaction \n \n• Demonstration \n• Observation \n• Interviews/ \nquestioning \n3. Practice career \nprofessionalism \n3.1 Integrate personal \nobjectives with \norganizational goals. \n3.2 Set and meet work \npriorities. \n3.3 Maintain professional \ngrowth and \ndevelopment. \n• Discussion \n• Interaction \n \n \n• Demonstration \n• Observation \n• Interviews/ \nquestioning\n\n--- PDF PAGE 63 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n61\n4. Practice \noccupational \nhealth and safety \n4.1 Evaluate hazard and \nrisks \n4.2 Control hazards and \nrisks \n4.3 Maintain occupational \nhealth and safety \nawareness \n• Discussion \n• Plant tour \n• Symposium \n• Observation \n• Interview \n \nCOMMON COMPETENCIES \n48 hours \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n1. Apply safety \nmeasures in \nfarm operations \n1.1 \nApply appropriate \nsafety measures while \nworking in farm \n1.2 \nSafe keep/dispose \ntools, materials and \noutfit. \n• Self-\npaced/modular \n• Lecture/Discu\nssion \n• Interaction \n• Practical \nDemonstration \n• Visit/tour \n• Oral/Written \nInterviews \n• Direct \nObservation \n• Practical \nDemonstration \n2. Use farm tools \nand equipment \n2.1 \nPrepare and use farm \ntools \n2.2 \nPrepare and operate \nfarm equipment \n2.3 \nPerform preventive \nmaintenance \nprocedures/practices \n• Self-\npaced/modular \n• Lecture/Discu\nssion \n• Interaction \n• Practical \nDemonstration \n• Visit/tour \n• \n• Oral/Written \nInterviews \n• Direct \nObservation \n• Practical \nDemonstration \n3. Perform \nestimation and \nbasic calculation \n \n3.1 \nPerform estimation \n3.2 \nPerform basic \nworkplace calculation \n \n• Self-\npaced/modular \n• Lecture/Discu\nssion \n• Interaction \n• Practical \nExercise \n• Oral/Written \nexamination \n• Practical \nexercise \n4. Process farm \nwastes \n4.1 \nCollect farm wastes \n4.2 \nIdentify and segregate \nwastes \n4.3 \nTreat and process farm \nwastes \n4.4 \nPerform housekeeping \n \n• Self-\npaced/modular \n• Lecture/Discu\nssion \n• Interaction \n• Practical \nDemonstration \n• Visit/tour \n• Oral/Written \nInterviews \n• Direct \nObservation \n• Practical \nDemonstration\n\n--- PDF PAGE 64 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n62\nCORE COMPETENCIES \n160 hours \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n1. Maintain \npoultry \nenvironment \n1.1 \nPerform preparatory \nactivities \n1.2 \nMaintain poultry house \nand facilities \n1.3 \nMaintain farm area \n1.4 \nPerform completion \nactivities \n• Hands- on \n• Lectures/ \nDiscussion \n• Videos/ \nIllustrations \n• Demonstration \n \n• Written \nexamination \n• Oral \nevaluation \n• Demonstratio\nn with \nquestions \n2. Brood and \ngrow chicks \n2.1 \nPerform preparatory \nactivities \n2.2 \nPlace chicks and pullets \nin brooder house \n2.3 \nPerform feeding of birds \n2.4 \nProvide optimum \nenvironment for the birds \n2.5 \nPerform preventive and \ntreatment measures \n2.6 \nPerform flock selection \n• Hands- on \n• Lectures/ \nDiscussion \n• Videos/ \nIllustrations \n• Demonstration \n \n• Written \nexamination \n• Oral \nevaluation \n• Demonstratio\nn with \nquestions \n \n3. Perform \npre-lay and \nlay activities \n3.1 \nPerform preparatory \nactivities \n3.2 \nTransfer layers in laying \nhouse \n3.3 \nEmploy lighting program \n3.4 \nApply feeding activities \n3.5 \nPerform health care \n3.6 \nPerform harvesting and \npost-laying activities \n• Hands- on \n• Lectures/ \nDiscussion \n• Videos/ \nIllustrations \n• Demonstration \n \n• Written \nexamination \n• Oral \nevaluation \n• Demonstratio\nn with \nquestions \n \n4. Trim beak \n1.1 \nCarry-out preparatory \nactivities \n1.2 \nTrim beak \n1.3 \nRetrim beak \n1.4 \nCarry-out work to \ncompletion \n• Hands- on \n• Lectures/ \nDiscussion \n• Videos/ \nIllustrations \n• Demonstration \n \n• Written \nexamination \n• Oral \nevaluation \n• Demonstratio\nn with \nquestions \n \nELECTIVE COMPETENCIES \n40 hours \nUnit of \nCompetency \nLearning Outcomes \nMethodology \nAssessment \nApproach \n1. Breed \nchicken \n1.1 Perform preparatory \nbreeding activities \n1.2 Carry-out breeding to in- \nlay activities \n1.3 Collect eggs \n1.4 Care for hatching eggs \n• Hands- on \n• Lectures/ \nDiscussion \n• Videos/ \nIllustrations \n• Demonstration \n• Written \nexamination \n• Oral \nevaluation \n• Demonstration \nwith questions\n\n--- PDF PAGE 65 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n63\n3.2 TRAINING DELIVERY \n \nThe delivery of training should adhere to the design of the curriculum. \nDelivery should be guided by the 10 basic principles of competency-based \nTVET. \n \n \no The training is based on curriculum developed from the \ncompetency standards; \no Learning is modular in its structure; \no Training delivery is learner-centered and should accommodate \nindividualized and self-paced learning strategies; \no Training is based on work that must be performed; \no Training materials are directly related to the competency standards \nand the curriculum modules; \no Assessment is based in the collection of evidence of the \nperformance of work to the industry required standard; \no Training program allows for recognition of prior learning (RPL) or \ncurrent competencies; \no Training allows for multiple entry and exit; and \no Training programs are registered with UTPRAS. \n \nThe competency-based TVET system recognizes various types of \ndelivery modes, both on and off-the-job as long as the learning is driven by \nthe competency standards specified by the industry. The following training \nmodalities may be adopted when designing training programs: \n \no The dualized mode of training delivery is preferred and \nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to \nthe Dual Training System (DTS) Implementing Rules and \nRegulations. \no Modular/self-paced learning is a competency-based training \nmodality wherein the trainee is allowed to progress at his own pace. \nThe trainer facilitates the training delivery \no Peer teaching/mentoring is a training modality wherein fast learners \nare given the opportunity to assist the slow learners. \no Supervised industry training or on-the-job training is an approach in \ntraining designed to enhance the knowledge and skills of the \ntrainee through actual experience in the workplace to acquire \nspecific competencies prescribed in the training regulations. \no Distance learning is a formal education process in which majority of \nthe instruction occurs when the students and instructor are not in \nthe same place. Distance learning may employ correspondence \nstudy, or audio, video or computer technologies. \no Project-Based Instruction is an authentic instructional model or \nstrategy in which students plan, implement and evaluate projects \nthat have real world applications.\n\n--- PDF PAGE 66 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n64\n3.3 TRAINEE ENTRY REQUIREMENTS \n \nTrainees or students wishing to enroll in this course should possess the \nfollowing requirements: \n \n• Able to read and write; \n• Able to communicate, both orally and in writting; and \n• Physically fit and mentally healthy as certified by a Public Health Officer \n \n \n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS \n \n ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \n \nRecommended list of tools, equipment and materials for the training of 25 trainees \nfor Animal Production (Poultry) NC II \n \nQTY \nTOOLS \nQTY \nEQUIPMENT \nQTY \nMATERIALS \n3 \nElectric lamps \n \n 1 \nGenerator \n \n10 \nPlastic drinking \njars- ¼, ½, 1 \ngallon cap. \n3 \nPail \n1 \nHeater \n10 \nChicks size \nfeeders \n3 \nFeed scoop \n \n \n1 \nWelded wire \n30 \nSyringe and \nneedles \n1 \nWeighing scale \n \n1 \nPlastic poultry wire \n1 \nDebeaker \n1 \nWheel barrow \n2 \nPVC pipe \n1 \nKnapsack \nsprayer \n1 \nFeed bin \n10 \nFeeding troughs \n(local materials-\nbamboo or PVC \npipe) \n3 \nEgg grader \n1 \nFeed cart \n10 \nDrinking trough \n \n1 \nHover \n \n1 \nInfrared gas \nbrooder \n \n10 \nPlastic waterers \n3 \nChick guard \n30 \nFabricated layer \ncages \n10 \nSacks \n1 \nCurtains \n1 \nPower Sprayer \n \n10 \nNests \n1 \nPortable heater \n \n \n \n3 \nPlastic feeders, \n5-10 kgs \n \n \n1 \nOld tire \n3 \nWeighing scale \n(500 kg. cap.) \n \n \n5 \nAluminum sheets \n5 \nSyringes (5 to \n20ml cap.) \n \n \n1 \nPlain GI sheets \n5 \nHammer \n \n \n2 \nLawanit\n\n--- PDF PAGE 67 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n65\n \n5 \nShovel, wheel \nbarrow \n \n \n5 \nHard card boards \n15 \nMineral boxes, \n \n \n5 \nPlywood \n5 \nWaterer \n \n \n \nOld newspaper \n5 \nFeeding trough \n \n \n \nSaw dust \n \n \n \n \nRice hulls \n \n \n \n \nFeeds \n• Chicks booster \n– from 1 day to 2 \nweeks old \n• Starter mash – \n3-4 weeks old \n• Finisher mash – \n5 weeks old until \nmarket age \n \n \n \n \nEgg trays \n• Plastic egg \ntrays (30 pcs \ncapacity) \n• Cartoon egg \ntrays \n \n \n \n \nEgg cart \n \n \n \n \nEgg boxes \n \n \n \n \nVeterinary drugs \n \n \n \n \nDewormer \n \n \n \n \n \nVaccines \n \n \n \n \nSupplements \n \n \n \n25 \nset \nPPE: \n• Dust coats \n• Mask \n• Hand gloves \n• Boots \n• Rain coats \n• Fire extinguisher \n• Foot baths \n \n \n \nModels/actual \nobjects \n \nLearning \nMaterials \n \n \n \n \n60 \n \n \n \n \n \n \nBreed/strain/ \nhybrid: \nBroiler strains: \n \nHydro G \n \nPilch-de-kalb \n \nLohman \n \nStarbro \n \nArbor acre \n \nAvian Peterson \n \n• Production \nrecords \n Rearing flock \nrecords \n• Laying flock \nrecords \n• Financial \nrecords \n• Inventory\n\n--- PDF PAGE 68 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n66\n \n30 \n \nCobb \nStrains of layers: \n \nBabcock \n \nDekalb \n \nH & N \n \nHi-sex white \n \nStarcross \n \nLohman LSL \n \nrecords \n• \nPhysical \nrecords: \n Brooding and \ngrowing \nrecords \n Laying flock \nproduction \nrecords \n• Financial \nrecords: \n Value of \nproduction \nand disposal \n Other \nsources of \nincome \n Farm \nexpenses \n \n \n \n30 \nEgg layers \nclassification \n(Based on Phil. \nProduct Standard, \nclassification of \nchicken eggs) \n• Jumbo >70 g \n• XL 65-70 g \n• L 60-65 g \n• M 55-60 g \n• S 50-55 g \n• Pullets 45-50 g \n• Peewee 40-45 g \n• no weight <40 g\n\n--- PDF PAGE 69 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n67\n3.5 TRAINING FACILITIES \n \n ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \n \nBased on a class size of 25 students/trainees \n \nSPACE \nREQUIREMENT \nSIZE IN \nMETERS \nAREA IN \nSQ. \nMETERS \nQTY \nTOTAL \nAREA IN SQ. \nMETERS \nGRAND \nTOTAL \nAREA IN SQ. \nMETER \n• Building \n(permanent) \n13.00 x 15.00 \n195.00 \n1 \n \n195.00 \no Student/ \nTrainee \nWorking Space \n2.00 x 2.00 per \nstudent/trainee \n4.00 per \nstudent \n25 \n100.00 \n \no Lecture Room \n7.00 x 5.00 \n35.00 \n1 \n35.00 \n \no Learning \nResource Area \n3.00 x 5.00 \n15.00 \n1 \n15.00 \n \no Tool \nroom/Storage \nroom \n5 x 5 \n25 \n1 \n25 \n \no Wash area, \nToilet & Locker \nroom \n2 x 5 \n10 \n2 \n20 \n \n• Poultry house \nand facilities \n \n \n \n40** \n \n• Farm area \n \n \n \n \n100 \nNote: ** Land area of poultry house good for one hundred (120) birds \n \nPrior to accreditation, a training provide must have a Memorandum of Agreement with private \npoultry farm with a at least one poultry house as practice farm/workplace for the trainees. \n \n3.6 TRAINER’S QUALIFICATIONS FOR AGRICULTURE SECTOR \n \nTrainers who will deliver the training on ANIMAL PRODUCTION (POULTRY-\nCHICKEN) NC II should have the following : \n \n• \nMust be a holder of National TVET Trainer Certificate I (TM I and NC) \n• \nMust be physically and mentally fit \n• \nPreferrably computer literate \n \n \nReference: TESDA Board Resolution No. 2004 03 \n \n3.7. \nINSTITUTIONAL ASSESSMENT \n \nInstitutional assessment is undertaken by trainees to determine their \nachievement of units of competency. A certificate of achievement is issued for each \nunit of competency.\n\n--- PDF PAGE 70 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n68"
