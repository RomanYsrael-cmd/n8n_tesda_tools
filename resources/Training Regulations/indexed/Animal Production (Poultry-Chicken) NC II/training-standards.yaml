ratory\nactivities\n1.2\nMaintain poultry house\nand facilities\n1.3\nMaintain farm area\n1.4\nPerform completion\nactivities\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n\n• Written\nexamination\n• Oral\nevaluation\n• Demonstratio\nn with\nquestions\n2. Brood and\ngrow chicks\n2.1\nPerform preparatory\nactivities\n2.2\nPlace chicks and pullets\nin brooder house\n2.3\nPerform feeding of birds\n2.4\nProvide optimum\nenvironment for the birds\n2.5\nPerform preventive and\ntreatment measures\n2.6\nPerform flock selection\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n\n• Written\nexamination\n• Oral\nevaluation\n• Demonstratio\nn with\nquestions\n\n3. Perform\npre-lay and\nlay activities\n3.1\nPerform preparatory\nactivities\n3.2\nTransfer layers in laying\nhouse\n3.3\nEmploy lighting program\n3.4\nApply feeding activities\n3.5\nPerform health care\n3.6\nPerform harvesting and\npost-laying activities\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n\n• Written\nexamination\n• Oral\nevaluation\n• Demonstratio\nn with\nquestions\n\n4. Trim beak\n1.1\nCarry-out preparatory\nactivities\n1.2\nTrim beak\n1.3\nRetrim beak\n1.4\nCarry-out work to\ncompletion\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n\n• Written\nexamination\n• Oral\nevaluation\n• Demonstratio\nn with\nquestions\n\nELECTIVE COMPETENCIES\n40 hours\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Breed\nchicken\n1.1 Perform preparatory\nbreeding activities\n1.2 Carry-out breeding to in-\nlay activities\n1.3 Collect eggs\n1.4 Care for hatching eggs\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n• Written\nexamination\n• Oral\nevaluation\n• Demonstration\nwith questions\n\n--- PDF PAGE 65 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II\nPromulgated December 2013\n63\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n\no The training is based on curriculum developed from the\ncompetency standards;\no Learning is modular in its structure;\no Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\no Training is based on work that must be performed;\no Training materials are directly related to the competency standards\nand the curriculum modules;\no Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\no Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\no Training allows for multiple entry and exit; and\no Training programs are registered with UTPRAS.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by\nthe competency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\no The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\no Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery\no Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\no Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\no Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\no Project-Based Instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate projects\nthat have real world applications.\n\n--- PDF PAGE 66 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II\nPromulgated December 2013\n64\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess the\nfollowing requirements:\n\n• Able to read and write;\n• Able to communicate, both orally and in writting; and\n• Physically fit and mentally healthy as certified by a Public Health Officer\n\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor Animal Production (Poultry) NC II\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n3\nElectric lamps\n\n 1\nGenerator\n\n10\nPlastic drinking\njars- ¼, ½, 1\ngallon cap.\n3\nPail\n1\nHeater\n10\nChicks size\nfeeders\n3\nFeed scoop\n\n\n1\nWelded wire\n30\nSyringe and\nneedles\n1\nWeighing scale\n\n1\nPlastic poultry wire\n1\nDebeaker\n1\nWheel barrow\n2\nPVC pipe\n1\nKnapsack\nsprayer\n1\nFeed bin\n10\nFeeding troughs\n(local materials-\nbamboo or PVC\npipe)\n3\nEgg grader\n1\nFeed cart\n10\nDrinking trough\n\n1\nHover\n\n1\nInfrared gas\nbrooder\n\n10\nPlastic waterers\n3\nChick guard\n30\nFabricated layer\ncages\n10\nSacks\n1\nCurtains\n1\nPower Sprayer\n\n10\nNests\n1\nPortable heater\n\n\n\n3\nPlastic feeders,\n5-10 kgs\n\n\n1\nOld tire\n3\nWeighing scale\n(500 kg. cap.)\n\n\n5\nAluminum sheets\n5\nSyringes (5 to\n20ml cap.)\n\n\n1\nPlain GI sheets\n5\nHammer\n\n\n2\nLawanit\n\n--- PDF PAGE 67 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II\nPromulgated December 2013\n65\n\n5\nShovel, wheel\nbarrow\n\n\n5\nHard card boar