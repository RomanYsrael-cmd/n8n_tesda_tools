    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: ANIMAL PRODUCTION (POULTRY-CHICKEN) NC Level NC II\n\nNominal Training Duration:\n18 hrs – Basic Competencies\n\n\n\n\n\n48 hrs – Common Competencies\n\n\n\n 160 hrs – Core Competencies\n\n\n 40 hrs – Elective Competencies\n\n\n\n\n\n----------\n\n\n\n\n\n226 hrs -Total\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills\nof animal production technician in accordance with industry standards. It covers\nmaintaining of poultry house, performing brooding and growing of birds,\nperforming pre-lay and lay activities and beak trimming of birds,. It also includes\ncompetencies in workplace communication, teamwork, safety in the use of hand tools\nand equipment, and housekeeping\n\n\nBASIC COMPETENCIES\n18 hours\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment.\n• Discussion\n• Interaction\n\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 63 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II\nPromulgated December 2013\n61\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n48 hours\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1\nApply appropriate\nsafety measures while\nworking in farm\n1.2\nSafe keep/dispose\ntools, materials and\noutfit.\n• Self-\npaced/modular\n• Lecture/Discu\nssion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n2. Use farm tools\nand equipment\n2.1\nPrepare and use farm\ntools\n2.2\nPrepare and operate\nfarm equipment\n2.3\nPerform preventive\nmaintenance\nprocedures/practices\n• Self-\npaced/modular\n• Lecture/Discu\nssion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n•\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n3. Perform\nestimation and\nbasic calculation\n\n3.1\nPerform estimation\n3.2\nPerform basic\nworkplace calculation\n\n• Self-\npaced/modular\n• Lecture/Discu\nssion\n• Interaction\n• Practical\nExercise\n• Oral/Written\nexamination\n• Practical\nexercise\n4. Process farm\nwastes\n4.1\nCollect farm wastes\n4.2\nIdentify and segregate\nwastes\n4.3\nTreat and process farm\nwastes\n4.4\nPerform housekeeping\n\n• Self-\npaced/modular\n• Lecture/Discu\nssion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstration\n\n--- PDF PAGE 64 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II\nPromulgated December 2013\n62\nCORE COMPETENCIES\n160 hours\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Maintain\npoultry\nenvironment\n1.1\nPerform preparatory\nactivities\n1.2\nMaintain poultry house\nand facilities\n1.3\nMaintain farm area\n1.4\nPerform completion\nactivities\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n\n• Written\nexamination\n• Oral\nevaluation\n• Demonstratio\nn with\nquestions\n2. Brood and\ngrow chicks\n2.1\nPerform preparatory\nactivities\n2.2\nPlace chicks and pullets\nin brooder house\n2.3\nPerform feeding of birds\n2.4\nProvide optimum\nenvironment for the birds\n2.5\nPerform preventive and\ntreatment measures\n2.6\nPerform flock selection\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n\n• Written\nexamination\n• Oral\nevaluation\n• Demonstratio\nn with\nquestions\n\n3. Perform\npre-lay and\nlay activities\n3.1\nPerform preparatory\nactivities\n3.2\nTransfer layers in laying\nhouse\n3.3\nEmploy lighting program\n3.4\nApply feeding activities\n3.5\nPerform health care\n3.6\nPerform harvesting and\npost-laying activities\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n\n• Written\nexamination\n• Oral\nevaluation\n• Demonstratio\nn with\nquestions\n\n4. Trim beak\n1.1\nCarry-out preparatory\nactivities\n1.2\nTrim beak\n1.3\nRetrim beak\n1.4\nCarry-out work to\ncompletion\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n\n• Written\nexamination\n• Oral\nevaluation\n• Demonstratio\nn with\nquestions\n\nELECTIVE COMPETENCIES\n40 hours\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Breed\nchicken\n1.1 Perform preparatory\nbreeding activities\n1.2 Carry-out breeding to in-\nlay activities\n1.3 Collect eggs\n1.4 Care for hatching eggs\n• Hands- on\n• Lectures/\nDiscussion\n• Videos/\nIllustrations\n• Demonstration\n• Written\nexamination\n• Oral\nevaluation\n• Demonstration\nwith questions\n\n--- PDF PAGE 65 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II\nPromulgated December 2013\n63"
