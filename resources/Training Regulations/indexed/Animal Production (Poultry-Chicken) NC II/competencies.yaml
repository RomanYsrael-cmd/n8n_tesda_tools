        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Performed preparatory activities \n1.2. Transferred ready-to-lay pullete in laying house \n1.3. Employed lighting program \n1.4. Applied feeding activities \n1.5. Performed health care \n1.6. Performed harvesting and post-laying activities \n2. Required \nKnowledge and \nAttitudes \n \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. Functions and uses of tools in pre-lay and lay \nactivities \n2.1.2. Different poultry strains of layers \n2.1.3. Different abnormalities for culling \n2.1.4. Lighting program for layers \n2.1.5. Feeding for layers \n2.1.6. Deworming procedures \n2.1.7. Vaccination for layers \n2.1.8. Supplements for layers \n2.1.9. Egg harvesting procedures \n2.1.10. Grading of eggs \n2.1.11. Record keeping \n2.1.12. Disposal of wastes \n2.2. Communication \n2.2.1. Updating and keeping records and data \n2.2.2. Preparation of report to immediate authority \n2.2.3. Following verbal and written instructions \n2.3. Mathematics and Mensuration \n2.3.1. Feed ration computation \n2.3.2. Computing data and records during pre-laying and \nlaying operations \n2.3.3. Inventory of stocks and other supplies \n2.4. Safety Practices \n2.4.1. Wearing of PPE \n2.4.2. Following Occupational Safety and Hazard Standard \n(OSHS) \n2.5. Codes and Regulations \n2.5.1. DENR legislations in wastes disposal \n2.5.2. OSHS \n2.5.3. GAHP \n2.6. Materials, Tools & Equipment: Uses, Specifications and \nMaintenance \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional manuals \n2.6.1.2. Safe keeping of equipment every after use \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies, materials \nand equipment needed in pre-laying and laying \nactivities\n\n--- PDF PAGE 51 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n49\n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills during pre-laying \nand laying activities \n2.7. Values \n2.7.1. Safety and health consciousness \n2.7.2. Time consciousness and management \n2.7.3. Resourcefulness \n2.7.4. Cost consciousness \n2.7.5. Diligence \n2.7.6. Determined \n2.7.7. Observes hygiene \n2.7.8. Honesty in records \n2.7.9. Personal integrity in doing routine management \npractice \n2.7.10. Perseverance \n2.7.11. Ability to work with others harmoniously \n3. Required Skills \n3.1. Oriented on farm and equipment layout \n3.2. Simple electrical work \n3.3. Work safety \n3.4. Skills in using tools and equipment \n3.5. Basic mathematical computation \n3.6. Communicate effectively \n3.7. Basic record keeping \n4. Resource \nImplications \nThe following resources should be provided: \n4.1. Poultry houses and nest set-up \n4.2. Set of pre-laying and laying tools, materials and equipment \n4.3. Medication and nutritional requirements \n4.4. Weighing scale and other tools and equipment for grading \nof eggs \n5. Method of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. Passing written exam \n5.2. Practical demonstration \n6. Context of \nAssessment \n6.1 Competency may be assessed individually in the actual \nworkplace or through accredited farms/institutions\n\n--- PDF PAGE 52 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n50\nUNIT OF COMPETENCY : \nTRIM BEAK \n \nUNIT CODE \n \n:"
