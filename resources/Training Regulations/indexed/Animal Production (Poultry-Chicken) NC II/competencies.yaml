COMPETENCY : \nPERFORM PRE-LAY AND LAY ACTIVITIES \n \nUNIT CODE \n \n: \nAFF622103 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes \nrequired to perform pre-lay and lay activities. It comprises \nof performing preparatory activities, transfer layers in \nlaying house, employing lighting program, apply feeding \nprogram, perform harvesting and post-laying activities, \n \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Perform preparatory \nactivities \n1.1. Laying houses are cleaned and disinfected \naccording to industry procedures. \n1.2. Tools, materials and equipment are prepared \naccording to work requirements. \n2. Transfer layers in laying \nhouse \n2.1. Ready to lay-pulletsare selected for transfer to \nlaying house. \n2.2. Pullets with abnormalities are culled from the \nflock. \n2.3. Ready-to-lay-pullets are transferred to laying house \nreference to Animal Welfare Act and Good Animal \nPractices. \n3. Employ lighting program \n3.1. Lighting program is followed according to prepared \nschedule. \n3.2. Lighting fixtures are installed according to required \nlight intensity. \n3.3. Monitoring of sexual development are performed \nin accordance with breed standards \n4. Apply feeding activities \n4.1. Feeders and water trough are prepared and \ncleaned regularly \n4.2. Poultry species are fed according to industry \nstandards \n4.3. Feeding to peak and challenge feeding are applied \naccording to layer’s status. \n4.4. Feed left-over is properly secured and spoiled feed \nis disposed properly \n4.5. Monitoring of productivity is performed with \nrefrence to bird’s status. \n5. Perform health care \n5.1. Deworming is done as recommended by \nveterinarian or authority. \n5.2. Booster vaccination program is done as \nrecommended by veterinarian or authority. \n5.3. Applications of vaccines are done following \nveterinarian instructions. \n5.4. Vitamins and minerals supplementations are given \nbased on assessment and recommendations of \nveterinarian or animal nutritionist .\n\n--- PDF PAGE 47 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n45\n6. Perform harvesting and \npost-laying activities \n6.1. Eggs are collected on a regular basis using \nappropriate materials and standard c collecting \nprocedures. \n6.2. Eggs are classified according to industry \nclassification standards \n6.3. Eggs are packed and stored at appropriate room \ntemperature. \n6.4. Unproductive layers are culled out according to \nstandard industry procedures. \n6.5. Records are kept following enterprise standard.\n\n--- PDF PAGE 48 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n46\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Tools and \nequipment \n1.1. Equipment \n• Generator \n• Electric lamps \n• Egg sorting machine \n• Lux meter \n• Feeders (farm implements) \n• Feed bin \n• Feed cart \n• Industrial fan \n• Knapsack sprayer \n• Feed cart \n• Fabricated layer cages \n• Feed scoop \n• Ligth meter \n• Curtains (ventilation and lighting management) \n1.2. Tools \n• Scissors \n• Wheel barrow \n• Plastic drinking jars \n• \n1.3. Materials \n• Egg trays \n• Light bulbs \n• Syringes and needles \n• Biologics \n• Medicated sacks(for foot bath) \n• Pail and Basins \n2. Poultry strains of \nlayers \nStrains of layers include: \n2.1. Babcock \n2.2. Dekalb \n2.3. H & N \n2.4. Hi-sex white \n2.5. Kimber \n2.6. Starcross \n2.7. Lohmann LSL \n2.8. Bovan \n2.9. ISA White \n2.10. Hyline \n2.11. Novogen \n3. Abnormalities \n3.1. Crossed-beak \n3.2. Abnormal legs and toes \n3.3. Abnormal wings \n3.4. Emaciated \n4. Feeding \n4.1. Approximate feed consumption of egg-type chickens per bird \n4.2. Feed to weight ratio\n\n--- PDF PAGE 49 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n47\n4.3. Feed for uniformity \n4.4. Feed to productivity \n5. Applications of \nvaccines \n5.1. Intra nasal \n5.2. Intra ocular \n5.3. Per os via drinking water \n5.4. Intra muscular \n5.5. Intra subcutaneous \n5.6. Prick or wing web method \n5.7. Fine spray \n5.8. Coarse spray \n6. Appropriate \nmaterials \nMay include: \n6.1. Egg trays \n6.1.1. Plastic egg trays (30 pcs) \n6.1.2. Cartoon egg trays \n6.2. Egg cart \n6.3. Egg boxes \n7. Industry \nclassification \nstandards \nLayer eggs classification includes: \n7.1. XL and jumbo \n7.2. Large \n7.3. Medium \n7.4. Small \n7.5. Very small/peewee \n8. Records \n8.1. Production records \n8.2. Livability records \n8.3. Laying flock records (records of Hen house production) \n8.4. Egg production record \n8.5. Physical records \n8.5.1. Laying flock \n8.5.2. Inventory\n\n--- PDF PAGE 50 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n48\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Performed preparatory activities \n1.2. Transferred ready-to-lay pullete in laying house \n1.3. Employed lighting program \n1.4. Applied feeding activities \n1.5. Performed health care \n1.6. Performed harvesting and post-laying activities \n2. Required \nKnowledge and \nAttitudes \n \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. Functions and uses of tools in pre-lay and lay \nactivities \n2.1.2. Different poultry strains of layers \n2.1.3. Different abnormalities for culling \n2.1.4. Lighting program for layers \n2.1.5. Feeding for layers \n2.1.6. Deworming procedures \n2.1.7. Vaccination for layers \n2.1.8. Supplements for layers \n2.1.9. Egg harvesting procedures \n2.1.10. Grading of eggs \n2.1.11. Record keeping \n2.1.12. Disposal of wastes \n2.2. Communication \n2.2.1. Updating and keeping records and data \n2.2.2. Preparation of report to immediate authority \n2.2.3. Following verbal and written instructions \n2.3. Mathematics and Mensuration \n2.3.1. Feed ration computation \n2.3.2. Computing data and records during pre-laying and \nlaying operations \n2.3.3. Inventory of stocks and other supplies \n2.4. Safety Practices \n2.4.1. Wearing of PPE \n2.4.2. Following Occupational Safety and Hazard Standard \n(OSHS) \n2.5. Codes and Regulations \n2.5.1. DENR legislations in wastes disposal \n2.5.2. OSHS \n2.5.3. GAHP \n2.6. Materials, Tools & Equipment: Uses, Specifications and \nMaintenance \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional manuals \n2.6.1.2. Safe keeping of equipment every after use \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies, materials \nand equipment needed in pre-laying and laying \nactivities\n\n--- PDF PAGE 51 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n49\n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills during pre-laying \nand laying activities \n2.7. Values \n2.7.1. Safety and health consciousness \n2.7.2. Time consciousness and management \n2.7.3. Resourcefulness \n2.7.4. Cost consciousness \n2.7.5. Diligence \n2.7.6. Determined \n2.7.7. Observes hygiene \n2.7.8. Honesty in records \n2.7.9. Personal integrity in doing routine management \npractice \n2.7.10. Perseverance \n2.7.11. Ability to work with others harmoniously \n3. Required Skills \n3.1. Oriented on farm and equipment layout \n3.2. Simple electrical work \n3.3. Work safety \n3.4. Skills in using tools and equipment \n3.5. Basic mathematical computation \n3.6. Communicate effectively \n3.7. Basic record keeping \n4. Resource \nImplications \nThe following resources should be provided: \n4.1. Poultry houses and nest set-up \n4.2. Set of pre-laying and laying tools, materials and equipment \n4.3. Medication and nutritional requirements \n4.4. Weighing scale and other tools and equipment for grading \nof eggs \n5. Method of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. Passing written exam \n5.2. Practical demonstration \n6. Context of \nAssessment \n6.1 Competency may be assessed individually in the actual \nworkplace or through accredited farms/institutions\n\n--- PDF PAGE 52 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n50\nUNIT OF COMPETENCY : \nTRIM BEAK \n \nUNIT CODE \n \n: \nAFF622104 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes \nrequired to debeak and redebeak birds. It includes \nfunctions such as carry-out preparatory activities, debeak \nbirds, redebeak birds and carry-out work to completion. \n \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Carry-out preparatory \nactivities \n1.1. Materials, tools and equipment for the operation \nare prepared according to work requirements. \n1.2. Birds are conditioned for debeaking following \nGood Animal Practices and Animal Welfare Act. \nSafety measures are practiced following \nOccupational Safety and Health Standards \n(OSHS). \n2. Trim beak \n2.1. Beak are trimmed in appropriate age following \nstandard industry procedures. \n2.2. Birds are restrained with net to facilitate calm \ncapture. \n2.3. Task is performed observing safety practices and \nfollowing Good Animal Husbandry Practices \n(GAHP) \n3. Retrim beak \n3.1. Beaks are retrimmed according to standard \noperating procedures. \n3.2. Birds are restrained with net to facilitate calm \ncapture. \n3.3. Task is performed practicing OSHS and following \nGAHP \n4. Carry-out work to \ncompletion \n4.1. Proper disposal is practiced according to \nenvironmental rules and regulations. \n4.2. Tools, materials and equipment are stored \naccording to industry protocol. \n4.3. Records are collected and updated for reporting \npurposes. (daily/weekly)\n\n--- PDF PAGE 53 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n51\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools, materials \nand equipment \n1.1. Materials \n1.1.1. Medicines (analgesic, blood coagulants) \n1.1.2. Net for restraining \n1.1.3. Old tire \n1.1.4. Pail \n1.2. Tools and Equipment \n1.2.1. Debeaking machine \n1.2.2. Sprayer \n1.2.3. Heater \n2. Conditioned \n2.1. Giving blood coagulants \n2.2. Antipyretic \n2.3. Analgesic \n3. Records \n3.1. Data on numbers of properly trimmed birds \n3.2. Data on numbers of improperly retrimmed birds\n\n--- PDF PAGE 54 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n52\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nCarried-out preparatory activities \n1.2. \nTrimmed beak \n1.3. \nRetrimmed beak \n1.4. \nCarried-out work to completion \n2. Required \nKnowledge and \nAttitudes \n \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. Different tools, materials and equipment use in \nbeak trimming \n2.1.2. Procedures in conditioning birds before trimming \noperation \n2.1.3. Beak trimming and retrimming procedures \n2.1.4. Proper wastes disposal \n2.1.5. Record keeping \n2.1.6. OSHS \n2.1.7. GAHP \n2.2. Communication \n2.2.1. Record updating and keeping \n2.2.2. Preparation of report \n2.2.3. Following verbal and written instructions \n2.3. Mathematics and Mensuration \n2.3.1. Inventory of stocks and supplies \n2.3.2. Monitoring number of trimmed and retrimmed birds \n2.4. Safety Practices \n2.4.1. Wearing of PPE \n2.4.2. Following OSHS \n2.5. Codes and Regulations \n2.5.1. OSHS \n2.5.2. GAHP \n2.5.3. DENR regulations on wastes disposal \n2.6. Materials, Tools & Equipment: Uses, Specifications and \nMaintenance \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional manuals \n2.6.1.2. Safe keeping of equipment every after use \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies, materials \nand equipment needed in trimming beaks of birds \n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills during trimming \nand retrimming activities \n2.7. Values \n2.7.1. Resourcefulness \n2.7.2. Cost consciousness \n2.7.3. Ability to work with others harmoniously \n2.7.4. Safety and health conciousness \n2.7.5. Diligence\n\n--- PDF PAGE 55 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n53\n2.7.6. Determined \n2.7.7. Observes hygiene \n2.7.8. Honesty in records \n2.7.9. Personal integrity in doing routine management \npractice \n2.7.10. Perseverance \n3. Required Skills \n3.1. Work safety \n3.2. Hygienic practice in doing the task \n3.3. Skills in using tools and equipment \n3.4. Basic mathematical computation \n3.5. Communicate effectively \n3.6. Basic record keeping \n4. Resource \nImplications \nThe following resources should be provided: \n4.1. Poultry house \n4.2. Medicines (analgesic, blood coagulants) \n4.3. Net for restraining \n4.4. Old tire \n4.5. Pail \n4.6. Debeaking machine \n4.7. Sprayer \n4.8. Heater \n5. Method of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. \nPassing written exam \n5.2. \nPractical demonstration \n6. Context of \nAssessment \n6.1 Competency may be assessed individually in the actual \nworkplace or through accredited farms/institutions\n\n--- PDF PAGE 56 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n54\nELECTIVE COMPETENCY \n \nUNIT OF COMPETENCY : \nBREED CHICKEN \n \nUNIT CODE \n \n: \nAFF622105 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes \nrequired to breed chicken. This includes functions such as \nconduct \npreparatory \nbreeding \nactivities, \ncarry-out \nbreeding to in-lay activities, collect eggs and care for \nhatching eggs. \n \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Conduct preparatory \nbreeding activities \n1.1. Poultry breeder are obtained from reliable source \naccording to enterprise production requirement. \n1.2. Characteristics of rooster suited for breeding are \ndetermined following enterprise protocol. \n1.3. Breeder sheds are maintained according to \nestablished farm practices following GAHP. \n1.4. Nests are set-up in suitable place in reference to \nestablished breeding practices. \n1.5. Poultry breeder are transferred to appropriate \nbreeder sheds following GAHP. \n1.6. Hygienic environment is maintained according to \nenterprise standard procedures and requirements. \n2. Carry-out breeding to in- lay \nactivities \n2.1. Male (rooster) is left with the females (hens) to \nmate following enterprise breeding schedule and \nplan. \n2.2. Birds are trained to lay in nests with minimal \nnumber of eggs on floor following recognized \nindustry standards. \n2.3. Temperature of the hen shed are kept constant and \nwarm according to established enterprise \nprocedures. \n2.4. Maintenance of breeder poultry are done in line \nwith egg production objective. \n2.5. Any drafts are prevented from entering the building \naccording to enterprise protocol. \n2.6. In-lay activities are conducted according to \nenterprise protocol and production plan. \n2.7. Safety practices are employed according to \nOccupational Safety and Hazard Standards. \n3. Collect eggs \n3.1. Fertile eggs are collected according to established \nenterprise protocol and requirement. \n3.2. Identification and grading of egg are carried out in\n\n--- PDF PAGE 57 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n55\naccordance with production requirements and \nbreeding objectives. \n3.3. Livestock is handled during egg collection is \nhumanely handled. \n3.4. Eggs cleaning and sanitation are done following \ncompany requirements and required hygienic \nprocedures. \n3.5. Hygienic environment maintained following \nenterprise procedures and requirement. \n3.6. Records of all collections are completed to \naccurately monitor production. \n4. Care for hatching eggs \n \n4.1. Hatching eggs are selected following standard \nenterprise protocol. \n4.2. Eggs are stored in accordance to industry \nstandard procedures. \n4.3. Eggs that are neglected by hens are took for \nincubation purposes. \n4.4. Floor egg problems are minimized following \nenterprise procedures.\n\n--- PDF PAGE 58 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n56\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Poultry breeder \n1.1. Rooster (Male) \n1.2. Hen (Female) \n2. Characteristics of \nrooster \n2.1. Big \n2.2. With good temperament \n2.3. Same breed of the other chickens. \n3. Suitable place \n3.1. Shed or dark areas \n3.2. At the center \n3.3. Shed divided into small sections (for 200 hens) to minimize \nfighting. \n4. Maintenance of \nbreeder poultry \n4.1. Management of females from 5% production until peak egg \nproduction \n4.2. Management of Males Post Light Stimulation until peak egg \nproduction \n4.3. Provision of good food \n4.4. Maintain cleanliness \n4.5. separate a low-ranking hen from the rest of the flock, so \nthat she may brood in peace. \n4.6. Broody hens are identified and handled following welfare \nrequirements \n5. In-lay activities \n5.1. Reduction of feeds according to general guidelines and \nbased on target performance character \n5.2. Monitor feed reduction \n5.3. Manage males (roosters) after peak production through to \ndepletion \n6. Collection \n6.1. Egg collection frequency is relative to number of \n6.2. Egg collection to minimise egg soiling. \n6.3. Regular collection protects eggs from the heat of the day \n7. Records \n7.1. Location of collection \n7.2. Numbers of eggs \n8. Egg cleaning and \nsanitation \n8.1. Collection as soon after laying to avoid manure spreading \non the egg \n8.2. Wiping with a dry cloth \n8.3. Fumigation by formaldehyde gas soon as possible after \ncollection \n9. Selection of \nhatching eggs \n9.1. Eggs should be from healthy, matured and developed \nbreeders \n9.2. Avoid too much of the humidity and moisture for this will \ncause critical damage to eggs \n9.3. Avoid really large or small eggs. Large eggs seem to hatch \npoorly and small eggs produce small chicks. \n9.4. Avoid eggs with cracked or thin shells. \n9.5. Choose clean eggs \n10. Storage \n10.1. Have a regular hatching schedule avoiding storage \nproblems and reduction of hatches. \n10.2. Placing in fillers prior to storage. \n10.3. Store eggs in a cool-humid storage area.\n\n--- PDF PAGE 59 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n57\n10.4. Store the eggs with the small end pointed downward. \n10.5. Alter egg position periodically if not incubating within 4-6 \ndays. \n10.6. Do not store eggs more than 7 days before incubating. \n10.7. Storage equipment and area are maintained in hygienic \nstate. \n10.8. Allow cool eggs to warm slowly to room temperature \nbefore placing in the incubator.\n\n--- PDF PAGE 60 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n58\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Conducted preparatory breeding activities \n1.2. Carried-out breeding to in-lay activities \n1.3. Collected eggs \n1.4. Cared for hatching eggs \n2. Required \nKnowledge and \nAttitudes \n \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. \nPoultry breeder \n2.1.2. \nCharacteristics of rooster \n2.1.3. \nMaintaining breeder sheds \n2.1.4. \nSuitable nesting place \n2.1.5. \nEgg collection procedures \n2.1.6. \nIdentification and grading of eggs \n2.1.7. \nEggs cleaning and sanitation \n2.1.8. \nRecords on poultry breeding \n2.1.9. \nMaintenance of breeder poultry \n2.1.10. In-lay activities \n2.1.11. Care and storage of hatching eggs \n \n2.2. Communication \n2.2.1. Record collection and keeping of poultry breeding data \n2.2.2. Following the schedules of breeding and regular \nhatching schedule \n2.2.4. Records of location of collection \n2.3. Mathematics and Mensuration \n2.3.1. Number of fertile eggs \n2.3.2. Number of soiled eggs \n2.3.3. Number of eggs for hatching \n2.4. Safety Practices \n2.4.1. Maintenance of hygienic environment \n2.4.2. Occupational Safety and Hazard Standards(OSHS) \n2.5. Codes and Regulations \n2.5.1. GAHP \n2.5.2. OSHS \n2.6. Materials, Tools & Equipment: Uses, Specifications and \nMaintenance \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional manual \n2.6.1.2. Safe keeping of equipment every after use \n2.6.1.3. Maintain hygienic breeding sheds, nesting place \nand egg storage room \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies and \nmaterials needed in breeding operations of \npoultry. \n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills for breeding sheds\n\n--- PDF PAGE 61 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n59\nand nesting areas \n2.7. Values \n2.7.1. Resourceful \n2.7.2. Honest \n2.7.3. Time conscious \n2.7.4. Diligent \n2.7.5. Patient \n2.7.6. Hard-working \n3. Required Skills \n3.1. Simple carpentry \n3.2. Record keeping \n3.3. Communication skills \n4. Resource \nImplications \nThe following resources should be provided: \n4.1. Breeding sheds and nesting place \n4.2. Farm area \n4.3. Egg storage room and facilities \n4.4. Supplies, tools and materials to be used for poultry \nbreeding operation. \n5. Method of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. Written exam \n5.2. Practical demonstration \n6. Context of \nAssessment \n6.1 Competency may be assessed individually in the actual \nworkplace or through accredited farms/institutions\n\n--- PDF PAGE 62 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n60"
