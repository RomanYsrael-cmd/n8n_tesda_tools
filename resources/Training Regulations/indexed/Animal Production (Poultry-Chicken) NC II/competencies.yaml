 (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n43\n2.7.2. Time consciousness and management \n2.7.3. Resourcefulness \n2.7.4. Cost consciousness \n2.7.5. Diligence \n2.7.6. Determined \n2.7.7. Observes hygiene \n2.7.8. Honesty in records \n2.7.9. Personal integrity in doing routine management \npractice \n2.7.10. Perseverance  \n2.7.11. Ability to work with others harmoniously \n3. Required Skills \n3.1. Oriented on farm and equipment layout \n3.2. Work safety \n3.3. Skills in using tools and equipment \n3.4. Basic mathematical computation \n3.5. Communicate effectively \n3.6. Basic record keeping \n4. Resource \nImplications \nThe following resources should be provided: \n4.1. Poultry houses \n4.2. Set of brooding equipment \n4.3. Medication and nutritional requirements \n4.4. Weighing scale and other tools and equipment \n5. Method of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. \nPassing written exam \n5.2. \nPractical demonstration \n6. Context of \nAssessment \n6.1     Competency may be assessed individually in the actual \nworkplace or through accredited farms/institutions.",
