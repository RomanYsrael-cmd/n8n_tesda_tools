        "source_text": "AFF321203 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \nrequired to perform basic workplace calculations. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables \n1. \nPerform estimation \n1.1 Job requirements are identified from written or oral \ncommunications \n1.2 Quantities of materials and resources required to \ncomplete a work task are estimated \n1.3 The time needed to complete a work activity is \nestimated \n1.4 Accurate estimate for work completion are made \n1.5 Estimate of materials and resources are reported to \nappropriate person \n2. \nPerform basic \nworkplace calculation \n2.1 Calculations to be made are identified according \nto job requirements \n2.2 Correct method of calculation identified \n2.3 System and units of measurement to be followed \nare ascertained \n2.4 Calculation needed to complete work tasks are \nperformed using the four basic process of addition, \ndivision, multiplication and subtraction \n2.5 Calculate whole fraction, percentage and mixed \nwhen are used to complete the instructions \n2.6 Number computed in self checked and completed \nfor alignment\n\n--- PDF PAGE 25 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n23\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nCalculations \n \n1.1 \nQuantity of feeds \n1.2 \nAmount of fertilizer \n1.3 \nAmount of medicines \n2. \nMethod of calculation \n \n2.1 \nAddition \n2.2 \nSubtraction \n2.3 \nMultiplication \n2.4 \nDivision \n2.5 \nRatio and proportion \n3. \nSystem of measurement \n3.1 \nEnglish \n3.2 \nMetric \n4. \nUnits of measurement \n4.1 \nArea \n4.2 \nVolume \n4.3 \nWeight\n\n--- PDF PAGE 26 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n24\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPerformed estimation \n1.2 \nPerformed basic workplace calculation \n1.3 \nApplied corrective measures as maybe necessary \n2. Required \nKnowledge and \nAttitudes \n \n2.1 \nMathematics \n2.1.1 \nBasic mathematical operations \n2.1.2 \nPercentage and ratios \n2.1.3 \nUnit Conversion \n2.1.4 \nBasic accounting principles and procedures \n2.1.4.1 Production cost \n2.1.4.2 Sales \n2.1.4.3 Accounts receivables/payables \n2.2 \nSystems, Processes and Operations \n2.2.1 Knowledge in different management practices and \noperational procedures \n2.3 \nValues \n2.3.1 Safety consciousness \n2.3.2 Time consciousness and management \n2.3.3 Cost consciousness \n2.3.4 Precision \n3. Required Skills \n3.1 \nAbility to perform basic calculation \n3.2 \nCommunicate effectively \n \n4. Resource \nImplications \nThe following resources should be provided: \n4.1 \nRelevant tools and equipment for basic calculation \n4.2 \nRecommended data \n \n5. Method of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 \nPractical demonstration \n5.2 \nWritten examination \n \n6. Context of \nAssessment \n6.1 \nAssessment may occur in the workplace or in a \nsimulated workplace or as part of a team under limited \nsupervision\n\n--- PDF PAGE 27 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n25\n \nUNIT OF COMPETENCY \n: PROCESS FARM WASTES \n \n \n \nUNIT CODE \n:"
