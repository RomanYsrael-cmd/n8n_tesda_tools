        "source_text": "AFF622104 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes \nrequired to debeak and redebeak birds. It includes \nfunctions such as carry-out preparatory activities, debeak \nbirds, redebeak birds and carry-out work to completion. \n \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Carry-out preparatory \nactivities \n1.1. Materials, tools and equipment for the operation \nare prepared according to work requirements. \n1.2. Birds are conditioned for debeaking following \nGood Animal Practices and Animal Welfare Act. \nSafety measures are practiced following \nOccupational Safety and Health Standards \n(OSHS). \n2. Trim beak \n2.1. Beak are trimmed in appropriate age following \nstandard industry procedures. \n2.2. Birds are restrained with net to facilitate calm \ncapture. \n2.3. Task is performed observing safety practices and \nfollowing Good Animal Husbandry Practices \n(GAHP) \n3. Retrim beak \n3.1. Beaks are retrimmed according to standard \noperating procedures. \n3.2. Birds are restrained with net to facilitate calm \ncapture. \n3.3. Task is performed practicing OSHS and following \nGAHP \n4. Carry-out work to \ncompletion \n4.1. Proper disposal is practiced according to \nenvironmental rules and regulations. \n4.2. Tools, materials and equipment are stored \naccording to industry protocol. \n4.3. Records are collected and updated for reporting \npurposes. (daily/weekly)\n\n--- PDF PAGE 53 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n51\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools, materials \nand equipment \n1.1. Materials \n1.1.1. Medicines (analgesic, blood coagulants) \n1.1.2. Net for restraining \n1.1.3. Old tire \n1.1.4. Pail \n1.2. Tools and Equipment \n1.2.1. Debeaking machine \n1.2.2. Sprayer \n1.2.3. Heater \n2. Conditioned \n2.1. Giving blood coagulants \n2.2. Antipyretic \n2.3. Analgesic \n3. Records \n3.1. Data on numbers of properly trimmed birds \n3.2. Data on numbers of improperly retrimmed birds\n\n--- PDF PAGE 54 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n52\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nCarried-out preparatory activities \n1.2. \nTrimmed beak \n1.3. \nRetrimmed beak \n1.4. \nCarried-out work to completion \n2. Required \nKnowledge and \nAttitudes \n \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. Different tools, materials and equipment use in \nbeak trimming \n2.1.2. Procedures in conditioning birds before trimming \noperation \n2.1.3. Beak trimming and retrimming procedures \n2.1.4. Proper wastes disposal \n2.1.5. Record keeping \n2.1.6. OSHS \n2.1.7. GAHP \n2.2. Communication \n2.2.1. Record updating and keeping \n2.2.2. Preparation of report \n2.2.3. Following verbal and written instructions \n2.3. Mathematics and Mensuration \n2.3.1. Inventory of stocks and supplies \n2.3.2. Monitoring number of trimmed and retrimmed birds \n2.4. Safety Practices \n2.4.1. Wearing of PPE \n2.4.2. Following OSHS \n2.5. Codes and Regulations \n2.5.1. OSHS \n2.5.2. GAHP \n2.5.3. DENR regulations on wastes disposal \n2.6. Materials, Tools & Equipment: Uses, Specifications and \nMaintenance \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional manuals \n2.6.1.2. Safe keeping of equipment every after use \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies, materials \nand equipment needed in trimming beaks of birds \n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills during trimming \nand retrimming activities \n2.7. Values \n2.7.1. Resourcefulness \n2.7.2. Cost consciousness \n2.7.3. Ability to work with others harmoniously \n2.7.4. Safety and health conciousness \n2.7.5. Diligence\n\n--- PDF PAGE 55 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n53\n2.7.6. Determined \n2.7.7. Observes hygiene \n2.7.8. Honesty in records \n2.7.9. Personal integrity in doing routine management \npractice \n2.7.10. Perseverance \n3. Required Skills \n3.1. Work safety \n3.2. Hygienic practice in doing the task \n3.3. Skills in using tools and equipment \n3.4. Basic mathematical computation \n3.5. Communicate effectively \n3.6. Basic record keeping \n4. Resource \nImplications \nThe following resources should be provided: \n4.1. Poultry house \n4.2. Medicines (analgesic, blood coagulants) \n4.3. Net for restraining \n4.4. Old tire \n4.5. Pail \n4.6. Debeaking machine \n4.7. Sprayer \n4.8. Heater \n5. Method of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. \nPassing written exam \n5.2. \nPractical demonstration \n6. Context of \nAssessment \n6.1 Competency may be assessed individually in the actual \nworkplace or through accredited farms/institutions\n\n--- PDF PAGE 56 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n54\nELECTIVE COMPETENCY \n \nUNIT OF COMPETENCY : \nBREED CHICKEN \n \nUNIT CODE \n \n:"
