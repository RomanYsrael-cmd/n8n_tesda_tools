Placing in fillers prior to storage. \n10.3. Store eggs in a cool-humid storage area.\n\n--- PDF PAGE 59 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n57\n10.4. Store the eggs with the small end pointed downward.  \n10.5. Alter egg position periodically if not incubating within 4-6 \ndays. \n10.6. Do not store eggs more than 7 days before incubating.  \n10.7. Storage equipment and area are maintained in hygienic \nstate. \n10.8. Allow cool eggs to warm slowly to room temperature \nbefore placing in the incubator.\n\n--- PDF PAGE 60 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n58"
