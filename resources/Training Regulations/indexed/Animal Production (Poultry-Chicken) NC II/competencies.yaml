es \n1.3 Recognized contingency measures during workplace \naccidents, fire and other emergencies \n1.4 Identified terms of maximum tolerable limits based on \nthreshold limit value- TLV. \n1.5 Followed Occupational Health and Safety (OHS) \nprocedures for controlling hazards/risks in workplace \n1.6 Used Personal Protective Equipment (PPE) in \naccordance with company OHS procedures and \npractices \n1.7 Completed and updated OHS personal records in \naccordance with workplace requirements \n \n2. Required \nKnowledge and \n Attitude \n2.1 OHS procedures and practices and regulations \n2.2 PPE types and uses \n2.3 Personal hygiene practices \n2.4 Hazards/risks identification and control \n2.5 Threshold Limit Value -TLV \n2.6 OHS indicators \n2.7 Organization safety and health protocol \n2.8 Safety consciousness \n2.9 Health consciousness \n3. Required \n Skills \n3.1 Practice of personal hygiene \n3.2 Hazards/risks identification and control skills \n3.3 Interpersonal skills \n3.4 Communication skills \n2. Resource \nImplications \nThe following resources must be provided: \n4.1 Workplace or assessment location \n4.2 OHS personal records \n4.3 PPE \n4.4 Health records \n3. \nMethods of \nAssessment \nCompetency may be assessed through: \n5.1 Portfolio Assessment \n5.2 Interview \n5.3 Case Study/Situation \n4. Context for \nAssessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n\n--- PDF PAGE 18 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n16\nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY : APPLY SAFETY MEASURES IN FARM OPERATIONS \n \nUNIT CODE : AFF321201 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \nrequired to perform safety measures effectively and \nefficiently. It includes identifying areas, tools, materials, \ntime and place in performing safety measures. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables \n1. \nDetermine areas of \nconcern for safety \nmeasures \n1.1 \nWork tasks are identified in line with farm \noperations \n1.2 \nPlace for safety measures are determined in line \nwith farm operations \n1.3 \nTime for safety measures are determined in line \nwith farm operations \n1.4 \nAppropriate tools, materials and outfits are \nprepared in line with job requirements \n2. \nApply appropriate \nsafety measures \n2.1 \nTools and materials are used according to \nspecifications and procedures \n2.2 \nOutfits are worn according to farm requirements \n2.3 \nEffectivity/shelf life/expiration of materials are \nstrictly observed \n2.4 \nEmergency procedures are known and followed \nto ensure a safework requirement \n2.5 \nHazards in the workplace are identified and \nreported in line with farm guidelines \n3. \nSafekeep/dispose \ntools, materials and \noutfit \n3.1 \nUsed tools and outfit are cleaned after use and \nstored in designated areas \n3.2 \nUnused materials are properly labeled and stored \naccording to manufacturers recommendation and \nfarm requirements \n3.3 \nWaste materials are disposed according to \nmanufacturers, government and farm \nrequirements\n\n--- PDF PAGE 19 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n17\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nWork tasks \nWork task may be selected from any of the subsectors: \n1.1 \nAquaculture \n1.2 \nAnimal Production \n1.3 \nCrop Production \n1.4 \nPost-harvest \n1.5 \nAgri-marketing \n1.6 \nFarm Equipment \n2. \nPlace \n2.1 \nAnimal pens, cages, barns \n2.2 \nFish ponds, cages \n2.3 \nStock room/storage areas/warehouse \n2.4 \nField/farm/orchard \n3. \nTime \n3.1 \nVaccination and medication period \n3.2 \nFertilizer and pesticides application \n3.3 \nFeed mixing and feeding \n3.4 \nHarvesting and hauling \n3.5 \nCleaning, sanitizing and disinfecting \n3.6 \nDressing, butchering and castration \n4. \nTools, materials and \noutfits \n4.1 \nTools \n4.1.1