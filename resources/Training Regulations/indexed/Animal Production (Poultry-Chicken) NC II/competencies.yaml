        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Conducted preparatory breeding activities \n1.2. Carried-out breeding to in-lay activities \n1.3. Collected eggs \n1.4. Cared for hatching eggs \n2. Required \nKnowledge and \nAttitudes \n \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. \nPoultry breeder \n2.1.2. \nCharacteristics of rooster \n2.1.3. \nMaintaining breeder sheds \n2.1.4. \nSuitable nesting place \n2.1.5. \nEgg collection procedures \n2.1.6. \nIdentification and grading of eggs \n2.1.7. \nEggs cleaning and sanitation \n2.1.8. \nRecords on poultry breeding \n2.1.9. \nMaintenance of breeder poultry \n2.1.10. In-lay activities \n2.1.11. Care and storage of hatching eggs \n \n2.2. Communication \n2.2.1. Record collection and keeping of poultry breeding data \n2.2.2. Following the schedules of breeding and regular \nhatching schedule \n2.2.4. Records of location of collection \n2.3. Mathematics and Mensuration \n2.3.1. Number of fertile eggs \n2.3.2. Number of soiled eggs \n2.3.3. Number of eggs for hatching \n2.4. Safety Practices \n2.4.1. Maintenance of hygienic environment \n2.4.2. Occupational Safety and Hazard Standards(OSHS) \n2.5. Codes and Regulations \n2.5.1. GAHP \n2.5.2. OSHS \n2.6. Materials, Tools & Equipment: Uses, Specifications and \nMaintenance \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional manual \n2.6.1.2. Safe keeping of equipment every after use \n2.6.1.3. Maintain hygienic breeding sheds, nesting place \nand egg storage room \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies and \nmaterials needed in breeding operations of \npoultry. \n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills for breeding sheds\n\n--- PDF PAGE 61 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n59\nand nesting areas \n2.7. Values \n2.7.1. Resourceful \n2.7.2. Honest \n2.7.3. Time conscious \n2.7.4. Diligent \n2.7.5. Patient \n2.7.6. Hard-working \n3. Required Skills \n3.1. Simple carpentry \n3.2. Record keeping \n3.3. Communication skills \n4. Resource \nImplications \nThe following resources should be provided: \n4.1. Breeding sheds and nesting place \n4.2. Farm area \n4.3. Egg storage room and facilities \n4.4. Supplies, tools and materials to be used for poultry \nbreeding operation. \n5. Method of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. Written exam \n5.2. Practical demonstration \n6. Context of \nAssessment \n6.1 Competency may be assessed individually in the actual \nworkplace or through accredited farms/institutions\n\n--- PDF PAGE 62 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n60"
        },
        "source_text": "AFF622105 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes \nrequired to breed chicken. This includes functions such as \nconduct \npreparatory \nbreeding \nactivities, \ncarry-out \nbreeding to in-lay activities, collect eggs and care for \nhatching eggs. \n \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Conduct preparatory \nbreeding activities \n1.1. Poultry breeder are obtained from reliable source \naccording to enterprise production requirement. \n1.2. Characteristics of rooster suited for breeding are \ndetermined following enterprise protocol. \n1.3. Breeder sheds are maintained according to \nestablished farm practices following GAHP. \n1.4. Nests are set-up in suitable place in reference to \nestablished breeding practices. \n1.5. Poultry breeder are transferred to appropriate \nbreeder sheds following GAHP. \n1.6. Hygienic environment is maintained according to \nenterprise standard procedures and requirements. \n2. Carry-out breeding to in- lay \nactivities \n2.1. Male (rooster) is left with the females (hens) to \nmate following enterprise breeding schedule and \nplan. \n2.2. Birds are trained to lay in nests with minimal \nnumber of eggs on floor following recognized \nindustry standards. \n2.3. Temperature of the hen shed are kept constant and \nwarm according to established enterprise \nprocedures. \n2.4. Maintenance of breeder poultry are done in line \nwith egg production objective. \n2.5. Any drafts are prevented from entering the building \naccording to enterprise protocol. \n2.6. In-lay activities are conducted according to \nenterprise protocol and production plan. \n2.7. Safety practices are employed according to \nOccupational Safety and Hazard Standards. \n3. Collect eggs \n3.1. Fertile eggs are collected according to established \nenterprise protocol and requirement. \n3.2. Identification and grading of egg are carried out in\n\n--- PDF PAGE 57 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n55\naccordance with production requirements and \nbreeding objectives. \n3.3. Livestock is handled during egg collection is \nhumanely handled. \n3.4. Eggs cleaning and sanitation are done following \ncompany requirements and required hygienic \nprocedures. \n3.5. Hygienic environment maintained following \nenterprise procedures and requirement. \n3.6. Records of all collections are completed to \naccurately monitor production. \n4. Care for hatching eggs \n \n4.1. Hatching eggs are selected following standard \nenterprise protocol. \n4.2. Eggs are stored in accordance to industry \nstandard procedures. \n4.3. Eggs that are neglected by hens are took for \nincubation purposes. \n4.4. Floor egg problems are minimized following \nenterprise procedures.\n\n--- PDF PAGE 58 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n56\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Poultry breeder \n1.1. Rooster (Male) \n1.2. Hen (Female) \n2. Characteristics of \nrooster \n2.1. Big \n2.2. With good temperament \n2.3. Same breed of the other chickens. \n3. Suitable place \n3.1. Shed or dark areas \n3.2. At the center \n3.3. Shed divided into small sections (for 200 hens) to minimize \nfighting. \n4. Maintenance of \nbreeder poultry \n4.1. Management of females from 5% production until peak egg \nproduction \n4.2. Management of Males Post Light Stimulation until peak egg \nproduction \n4.3. Provision of good food \n4.4. Maintain cleanliness \n4.5. separate a low-ranking hen from the rest of the flock, so \nthat she may brood in peace. \n4.6. Broody hens are identified and handled following welfare \nrequirements \n5. In-lay activities \n5.1. Reduction of feeds according to general guidelines and \nbased on target performance character \n5.2. Monitor feed reduction \n5.3. Manage males (roosters) after peak production through to \ndepletion \n6. Collection \n6.1. Egg collection frequency is relative to number of \n6.2. Egg collection to minimise egg soiling. \n6.3. Regular collection protects eggs from the heat of the day \n7. Records \n7.1. Location of collection \n7.2. Numbers of eggs \n8. Egg cleaning and \nsanitation \n8.1. Collection as soon after laying to avoid manure spreading \non the egg \n8.2. Wiping with a dry cloth \n8.3. Fumigation by formaldehyde gas soon as possible after \ncollection \n9. Selection of \nhatching eggs \n9.1. Eggs should be from healthy, matured and developed \nbreeders \n9.2. Avoid too much of the humidity and moisture for this will \ncause critical damage to eggs \n9.3. Avoid really large or small eggs. Large eggs seem to hatch \npoorly and small eggs produce small chicks. \n9.4. Avoid eggs with cracked or thin shells. \n9.5. Choose clean eggs \n10. Storage \n10.1. Have a regular hatching schedule avoiding storage \nproblems and reduction of hatches. \n10.2. Placing in fillers prior to storage. \n10.3. Store eggs in a cool-humid storage area.\n\n--- PDF PAGE 59 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n57\n10.4. Store the eggs with the small end pointed downward. \n10.5. Alter egg position periodically if not incubating within 4-6 \ndays. \n10.6. Do not store eggs more than 7 days before incubating. \n10.7. Storage equipment and area are maintained in hygienic \nstate. \n10.8. Allow cool eggs to warm slowly to room temperature \nbefore placing in the incubator.\n\n--- PDF PAGE 60 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n58\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Conducted preparatory breeding activities \n1.2. Carried-out breeding to in-lay activities \n1.3. Collected eggs \n1.4. Cared for hatching eggs \n2. Required \nKnowledge and \nAttitudes \n \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. \nPoultry breeder \n2.1.2. \nCharacteristics of rooster \n2.1.3. \nMaintaining breeder sheds \n2.1.4. \nSuitable nesting place \n2.1.5. \nEgg collection procedures \n2.1.6. \nIdentification and grading of eggs \n2.1.7. \nEggs cleaning and sanitation \n2.1.8. \nRecords on poultry breeding \n2.1.9. \nMaintenance of breeder poultry \n2.1.10. In-lay activities \n2.1.11. Care and storage of hatching eggs \n \n2.2. Communication \n2.2.1. Record collection and keeping of poultry breeding data \n2.2.2. Following the schedules of breeding and regular \nhatching schedule \n2.2.4. Records of location of collection \n2.3. Mathematics and Mensuration \n2.3.1. Number of fertile eggs \n2.3.2. Number of soiled eggs \n2.3.3. Number of eggs for hatching \n2.4. Safety Practices \n2.4.1. Maintenance of hygienic environment \n2.4.2. Occupational Safety and Hazard Standards(OSHS) \n2.5. Codes and Regulations \n2.5.1. GAHP \n2.5.2. OSHS \n2.6. Materials, Tools & Equipment: Uses, Specifications and \nMaintenance \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional manual \n2.6.1.2. Safe keeping of equipment every after use \n2.6.1.3. Maintain hygienic breeding sheds, nesting place \nand egg storage room \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies and \nmaterials needed in breeding operations of \npoultry. \n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills for breeding sheds\n\n--- PDF PAGE 61 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n59\nand nesting areas \n2.7. Values \n2.7.1. Resourceful \n2.7.2. Honest \n2.7.3. Time conscious \n2.7.4. Diligent \n2.7.5. Patient \n2.7.6. Hard-working \n3. Required Skills \n3.1. Simple carpentry \n3.2. Record keeping \n3.3. Communication skills \n4. Resource \nImplications \nThe following resources should be provided: \n4.1. Breeding sheds and nesting place \n4.2. Farm area \n4.3. Egg storage room and facilities \n4.4. Supplies, tools and materials to be used for poultry \nbreeding operation. \n5. Method of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. Written exam \n5.2. Practical demonstration \n6. Context of \nAssessment \n6.1 Competency may be assessed individually in the actual \nworkplace or through accredited farms/institutions\n\n--- PDF PAGE 62 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n60"
