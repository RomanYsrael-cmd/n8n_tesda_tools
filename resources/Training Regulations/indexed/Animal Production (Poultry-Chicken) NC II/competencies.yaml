ance with Environmental Compliance \nCertificate. \n1.4. Tools, materials and equipment are prepared \naccording to maintenance requirements and \ninstructions of authority. \n2. Maintain poultry house \nand facilities \n2.1. Poultry housing and facilities are cleaned and \ndisinfected in regular basis. \n2.2. Minor repairs and maintenance are done as per \ninstruction of the authority and per work \nrequirements. \n2.3. Major malfunctions and irregular conditions in \nthe poultry house and facilities are reported \nimmediately. \n2.4. Wearing of appropriate personal protective \nequipment (PPE) is practiced following OSHS \nprocedures. \n2.5. Downtime (rest period) is practiced prior to \nsucceeding loading for at least one week. \n2.6. Safety measures are practiced according to \nOccupational Safety and Health Standards \n(OSHS). \n3. Maintain farm area \n3.1. Maintenance of farm area and vicinities are \ndone according to production management and \nenterprise procedures. \n3.2. Vermin and insects control is performed\n\n--- PDF PAGE 34 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n32\naccording to Fertilizer and Pesticides Authority \nguidelines and DENR regulations. \n3.3. Maintenance of farm vegetation are conducted to \navoid common vermins and insects proliferation. \n4. Perform completion \nactivities \n4.1. Records are kept and updated for reporting and \ninventory purposes following enterprise \nprocedures. \n4.2. Tools and equipment are cleaned and stored \naccording to manuals and enterprise procedures. \n4.3. Housekeeping is practiced following 5S principles \nand enterprise procedures. \n4.4. Wastes are managed following 3Rs principles and \nDENR regulations.\n\n--- PDF PAGE 35 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n33\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Poultry house and \nfacilities \n1.1. \nWork area \n1.2. \nStorage room \n1.3. \nBrooding/growing area \n2. Tools,