        "source_title": "BROOD AND GROW CHICKS",
        "source_text": "--- PDF PAGE 39 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n37\n \nUNIT OF COMPETENCY :   BROOD AND GROW CHICKS \n \nUNIT CODE                      :   AFF622102 \n \nUNIT DESCRIPTOR        :    This unit covers the knowledge, skills and attitudes \nrequired to brood and grow chicks. It includes conducting \nof preparatory activities, placing of brooder in growing \nhouse, \nfeeding \nof \nbirds, \nproviding \nof \noptimum \nenvironment for the birds, performing prophylactic and \ntherapeutic measures and performing flock selections for \nbroiler and layer. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Conduct preparatory \nactivities \n1.1. Wearing of personal protective equipment (PPE) \nis applied according to OHS procedures. \n1.2. Poultry house was cleaned and disinfected \naccording to company standard procedures. \n1.3. Materials, tools and equipment are prepared \naccording to production requirements. \n1.4. Chick guard, curtains and portable heaters are \ninstalled and adjusted based on industry standards. \n1.5. Litter materials are cleaned and  laid-out, \nregularly following farm plans and schedule. \n2. Place chicks and \npullets  in brooder \nhouse \n2.1. Broiler and layer stocks  are obtained from \nreliable/recommended sources. \n2.2. A day-old chicks (DOC) and day-old pullets (DOP) \nare placed to respective brooding houses \nobserving Good Animal Practices and Animal \nWelfare Act. \n2.3. Chicks with abnormalities are culled from the \nflock. \n3. Perform feeding of \nbirds \n3.1. Feeders and waterers are prepared and cleaned \nregularly \n3.2. Poultry is fed according to company feeds and \nfeeding guide. \n3.3. Nutrient supplementation is practiced as remedial \nmeasures according to instructions of immediate \nauthority. \n3.4. Water is given according to industry standards and \nbird requirements.  \n3.5. Feed left-over is properly secured and spoiled feed \nis disposed properly. \n4. Provide optimum \nenvironment for the \nbirds \n4.1. Lighting program is provided based on industry \nstandards.  \n4.2. Ventilation is augmented during hot climatic \nconditions.\n\n--- PDF PAGE 40 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n38\n4.3. Curtain management is done based on prevailing \nconditions. \n4.4. Bio-security measures are applied  according to \nindustry procedures. \n4.5. Vermin control is done following industry \nprocedures. \n4.6. Disposal of  wastes are performed following DENR \nregulations.  \n5. Perform preventive \nand treatment \nmeasures \n5.1. Distress conditions of poultry are determined and \nreported to immediate authority or veterinarian. \n5.2. Preventive measures are administered according \nto veterinarian recommendations and instructions. \n5.3. Sick birds are isolated for treatment following \ninstructions of veterinarian. \n5.4. Culling procedures are applied with reference to \neconomic considerations and according to \ninstructions of immediate authority. \n6. Perform flock \nselection \n6.1. Missexed are removed from flock following  \nindustry standards.. \n6.2. Flock selection is performed according to company \nrequirements and productivity standards. \n6.3. Birds with poor physical conditions are culled out \nfor according company requirements on a regular \nbasis. \n6.4. Relevant records are updated  on regular basis \nfollowing enteriprise protocol.\n\n--- PDF PAGE 41 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n39\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools and \nequipment \n \n1.1 Equipment \n1.1.1. Generator \n1.1.2. Brooder \n1.1.3. Electric lamps \n1.1.4. Weighing scale \n1.1.5. Feed bin \n1.1.6. Feed cart \n1.1.7. Industrial fan \n1.1.8. Knapsack sprayer \n1.1.9. Fire extinguisher \n1.1.10. Chicken crates/coops \n1.1.11. Vaccinator \n1.1.12. Debeaker \n1.2 Tools \n1.2.1. Pail and Basin \n1.2.2. Feed scoop \n1.2.3. Wheel barrow \n1.2.4. Ring guard \n1.2.5. Chick guard  \n1.2.6. Scissors  \n1.2.7. Measuring cups/spoons \n2. Materials  \n2.1. Gas and gas tanks \n2.2. Biologics  \n2.3. Veterinary drugs \n2.4. Vaccination set \n2.4.1. Cottons \n2.4.2. Alcohol \n2.4.3. Syringe \n2.4.4. Ice chest \n2.5. Feeds (pre-starter, starter and grower/finisher) \n3. Chick guard  \n3.1 Aluminum sheets \n3.2 Plain GI sheets \n3.3 PVC roll \n3.4 Hard card boards \n3.5 Plywood \n4. Litter materials  \n4.1 Old newspapers \n4.2 Saw dust \n4.3 Rice hulls \n4.4 Shredded rice straw \n5. Personal \nProtective \nEquipment \n(PPE) \n5.1. Dust coats \n5.2. Mask \n5.3. Hand gloves \n5.4. Rubber boots \n5.5. Rain coats \n6. Broiler and layer 6.1. Broiler\n\n--- PDF PAGE 42 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n40\nstocks \n6.1.1. Indian river \n6.1.2. Arbor acres  \n6.1.3. Ross \n6.1.4. Cobb  \n6.1.5. Hubbard (alphabetically arranged) \n6.2. Layers: \n6.2.1. \nBabcock \n6.2.2. \nDekalb \n6.2.3. \nH & N \n6.2.4. \nHi-sex white \n6.2.5. \nShaver \n6.2.6. \nLohmann LSL \n6.2.7. \nISA White \n6.2.8. \nHy-line \n6.2.9. \nNovogen (alphabetically arranged) \n6.3.  Strains for breeder  \n7. Abnormalities \n7.1. \nUnderweight chicks \n7.2. \nSteely and dirty down \n7.3. \nBlind or one-eyed chicks \n7.4. \nTwisted neck chicks \n7.5. \nMisaligned and twisted beaks \n7.6. \nAbnormal legs and toes \n7.7. \nAbnormal wings  \n7.8. \nSeverely unhealed navel \n7.9. \nWeak chicks \n7.10. Paralyzed chicks \n7.11. Chicks with red hocks \n8. Feeders and \nwaterers  \n8.1. \nPlastic feeders, 5-10 kg  \n8.2. \nFeeding troughs (local materials) \n8.2.1. Bamboo \n8.2.2. PVC pipes \n8.3. \nPlastic jars, ¼, ½, 1 gallon  \n9. Feeds \nMay include: \n9.1. Broiler  feed type \n9.1.1. Chicks booster – from 1 day to 2 weeks old \n9.1.2. Starter mash/crumble/pellets – 3-4 weeks old                   \n9.1.3. Finisher mash /crumble/pellets – 5 weeks old until \nmarket age \n9.2. Layer feed type  \n9.3. Breeder feed type                             \n10. Wastes \nMay include: \n10.1. Dead  poultry, \n10.2. Biologics left-over  \n10.3. Syringes  \n10.4. Containers \n11. Distress \nconditions \nDistress conditions include: \n11.1. Heat  \n11.2. Cold  \n11.3. Draft\n\n--- PDF PAGE 43 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n41\n11.4. Lack of appetite \n11.5. Abnormal bird activities \n12. Economic \nconsiderations \n12.1. Age \n12.2. Cost of operations (feeds and medications) \n12.3. Feed conversions efficiency \n12.4. Livability of birds \n13.  Relevant \nrecords \n13.1. Health program records  \n13.1.1. Vaccination program \n13.1.2. Blood titer \n13.1.3. Medication program \n13.2. Production performance \n13.3. Livability records\n\n--- PDF PAGE 44 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n42\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1. Conducted preparatory activities \n2. Placed chicks and pullets  in brooder house \n3. Performed feeding of birds \n4. Provided optimum environment for the birds \n5. Performed preventive and therapeutic measures \n6. Performed flock selection \n2. Required \nKnowledge and \nAttitudes \n \n2.1. \nKnowledge, Theory, Practices and Systems Operations \n2.1.1. \nDifferent tools, materials and equipment and their \nfunctions for brooding and growing chicks \n2.1.2. \nPoultry strains for broiler, layer and breeder \n2.1.3. \nProcedures in brooding and growing chicks \n2.1.4. \nFeeding ration for chicks and pullets \n2.1.5. \nAbnormalities of chicks \n2.1.6. \nOptimum environment in growing chicks \n2.1.7. \nBio-security measures \n2.1.8. \nDistress conditions \n2.1.9. \nFlock selection procedures \n2.1.10. Records on brooding and growing chicks \n2.2. \nCommunication \n2.2.1. Record updating and keeping \n2.2.2. Report preparation \n2.2.3. Following instructions both verbal and written \n2.3. \nMathematics and Mensuration \n2.3.1. \nComputing for feed ration \n2.3.2. \nNumber of broiler, layer and breeder \n2.4. \nSafety Practices \n2.4.1. Wearing of PPE \n2.4.2. Bio-security practices \n2.5. \nCodes and Regulations \n2.5.1. \nDENR regulations \n2.5.2. \nOSHS \n2.6. \nMaterials, Tools & Equipment: Uses, Specifications and \nMaintenance \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional manuals \n2.6.1.2. Safe keeping of equipment every after use \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies, materials \nand equipment needed in the brooding and \ngrowing chicks \n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills in brooding and \ngrowing chicks \n2.7. \nValues \n2.7.1. Safety and health consciousness\n\n--- PDF PAGE 45 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n43\n2.7.2. Time consciousness and management \n2.7.3. Resourcefulness \n2.7.4. Cost consciousness \n2.7.5. Diligence \n2.7.6. Determined \n2.7.7. Observes hygiene \n2.7.8. Honesty in records \n2.7.9. Personal integrity in doing routine management \npractice \n2.7.10. Perseverance  \n2.7.11. Ability to work with others harmoniously \n3. Required Skills \n3.1. Oriented on farm and equipment layout \n3.2. Work safety \n3.3. Skills in using tools and equipment \n3.4. Basic mathematical computation \n3.5. Communicate effectively \n3.6. Basic record keeping \n4. Resource \nImplications \nThe following resources should be provided: \n4.1. Poultry houses \n4.2. Set of brooding equipment \n4.3. Medication and nutritional requirements \n4.4. Weighing scale and other tools and equipment \n5. Method of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. \nPassing written exam \n5.2. \nPractical demonstration \n6. Context of \nAssessment \n6.1     Competency may be assessed individually in the actual \nworkplace or through accredited farms/institutions.\n",
