        "source_title": "PERFORM PRE-LAY AND LAY ACTIVITIES",
        "source_text": "--- PDF PAGE 46 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n44\nUNIT OF COMPETENCY : \nPERFORM PRE-LAY AND LAY ACTIVITIES \n \nUNIT CODE  \n \n: \nAFF622103 \n \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge, skills and attitudes \nrequired to perform pre-lay and lay activities. It comprises \nof performing preparatory activities, transfer layers in \nlaying house, employing lighting program, apply feeding \nprogram, perform harvesting and post-laying activities,  \n \nELEMENT \n \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range Statement \n1. Perform preparatory \nactivities \n1.1. Laying houses are cleaned and disinfected \naccording to industry procedures. \n1.2. Tools, materials and equipment are prepared \naccording to work requirements. \n2. Transfer layers in laying \nhouse \n2.1. Ready to lay-pulletsare selected for transfer to \nlaying house. \n2.2. Pullets with abnormalities are culled from the \nflock. \n2.3. Ready-to-lay-pullets are transferred to laying house \nreference to Animal Welfare Act and Good Animal \nPractices. \n3. Employ lighting program \n3.1. Lighting program is followed according to prepared \nschedule. \n3.2. Lighting fixtures are installed according to required \nlight intensity.  \n3.3. Monitoring of sexual development  are performed \nin accordance with breed standards \n4. Apply feeding activities \n4.1. Feeders and water trough are prepared and \ncleaned regularly \n4.2. Poultry species are fed according to industry \nstandards \n4.3. Feeding to peak and challenge feeding are applied \naccording to layer’s status.  \n4.4. Feed left-over is properly secured and spoiled feed \nis disposed properly \n4.5. Monitoring of productivity is performed with \nrefrence to bird’s status. \n5. Perform health care \n5.1. Deworming is done as recommended by \nveterinarian or  authority. \n5.2. Booster vaccination program is done as \nrecommended by veterinarian or authority. \n5.3. Applications of vaccines are done following \nveterinarian instructions. \n5.4. Vitamins and minerals supplementations are given \nbased on assessment and recommendations of \nveterinarian or animal nutritionist .\n\n--- PDF PAGE 47 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n45\n6. Perform harvesting and \npost-laying activities \n6.1. Eggs are collected on a regular basis using \nappropriate materials and standard c collecting \nprocedures. \n6.2. Eggs are classified according to industry \nclassification standards   \n6.3. Eggs are packed and stored at appropriate room \ntemperature. \n6.4. Unproductive layers are culled out according to \nstandard industry procedures. \n6.5. Records are kept following enterprise standard.\n\n--- PDF PAGE 48 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n46\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Tools and \nequipment \n1.1.  Equipment  \n Generator \n Electric lamps \n Egg sorting machine \n Lux meter \n Feeders (farm implements) \n Feed bin \n Feed cart \n Industrial fan  \n Knapsack sprayer \n Feed cart \n Fabricated layer cages \n Feed scoop \n Ligth meter \n Curtains (ventilation and lighting management) \n1.2. Tools  \n Scissors  \n Wheel barrow \n Plastic drinking jars  \n  \n1.3. Materials \n Egg trays \n Light bulbs \n Syringes and needles  \n Biologics \n Medicated sacks(for foot bath) \n Pail and Basins \n2. Poultry strains of \nlayers \nStrains of layers include: \n2.1. Babcock \n2.2. Dekalb \n2.3. H & N \n2.4. Hi-sex white \n2.5. Kimber \n2.6. Starcross \n2.7. Lohmann LSL \n2.8. Bovan \n2.9. ISA White \n2.10. Hyline \n2.11. Novogen \n3. Abnormalities \n3.1. Crossed-beak \n3.2. Abnormal legs and toes \n3.3. Abnormal wings  \n3.4. Emaciated  \n4. Feeding  \n4.1. Approximate feed consumption of egg-type chickens per bird \n4.2. Feed to weight ratio\n\n--- PDF PAGE 49 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n47\n4.3. Feed for uniformity \n4.4. Feed to productivity \n5. Applications of \nvaccines \n5.1. Intra nasal \n5.2. Intra ocular \n5.3. Per os via drinking water \n5.4. Intra muscular \n5.5. Intra subcutaneous \n5.6. Prick  or wing web method \n5.7. Fine spray \n5.8. Coarse spray \n6. Appropriate \nmaterials \nMay include: \n6.1. Egg trays \n6.1.1. Plastic egg trays (30 pcs) \n6.1.2. Cartoon egg trays \n6.2. Egg cart \n6.3. Egg boxes \n7. Industry \nclassification \nstandards \nLayer eggs classification includes: \n7.1. XL and jumbo \n7.2. Large  \n7.3. Medium  \n7.4. Small  \n7.5. Very small/peewee  \n8. Records \n8.1. Production records \n8.2. Livability records \n8.3. Laying flock records (records of Hen house production) \n8.4. Egg production record \n8.5. Physical records \n8.5.1. Laying flock \n8.5.2. Inventory\n\n--- PDF PAGE 50 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n48\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Performed preparatory activities \n1.2. Transferred ready-to-lay pullete in laying house \n1.3. Employed lighting program \n1.4. Applied feeding activities \n1.5. Performed health care \n1.6. Performed harvesting and post-laying activities \n2. Required \nKnowledge and \nAttitudes \n \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. Functions and uses of tools in pre-lay and lay \nactivities \n2.1.2. Different poultry strains of layers \n2.1.3. Different abnormalities for culling \n2.1.4. Lighting program for layers \n2.1.5. Feeding for layers \n2.1.6. Deworming procedures \n2.1.7. Vaccination for layers \n2.1.8. Supplements for layers \n2.1.9. Egg harvesting procedures \n2.1.10. Grading of eggs \n2.1.11. Record keeping \n2.1.12. Disposal of wastes \n2.2. Communication \n2.2.1. Updating and keeping records and data  \n2.2.2. Preparation of report to immediate authority \n2.2.3. Following verbal and written instructions \n2.3. Mathematics and Mensuration \n2.3.1. Feed ration computation \n2.3.2. Computing data and records during pre-laying and \nlaying operations \n2.3.3. Inventory of stocks and other supplies \n2.4. Safety Practices \n2.4.1. Wearing of PPE \n2.4.2. Following Occupational Safety and Hazard Standard \n(OSHS) \n2.5. Codes and Regulations \n2.5.1. DENR legislations in wastes disposal \n2.5.2. OSHS \n2.5.3. GAHP \n2.6. Materials, Tools & Equipment: Uses, Specifications and \nMaintenance \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional manuals \n2.6.1.2. Safe keeping of equipment every after use \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies, materials \nand equipment needed in pre-laying and laying \nactivities\n\n--- PDF PAGE 51 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n49\n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills during pre-laying \nand laying activities \n2.7. Values \n2.7.1. Safety and health consciousness \n2.7.2. Time consciousness and management \n2.7.3. Resourcefulness \n2.7.4. Cost consciousness \n2.7.5. Diligence \n2.7.6. Determined \n2.7.7. Observes hygiene \n2.7.8. Honesty in records \n2.7.9. Personal integrity in doing routine management \npractice \n2.7.10. Perseverance  \n2.7.11. Ability to work with others harmoniously \n3. Required Skills \n3.1. Oriented on farm and equipment layout \n3.2. Simple electrical work \n3.3. Work safety \n3.4. Skills in using tools and equipment \n3.5. Basic mathematical computation \n3.6. Communicate effectively \n3.7. Basic record keeping \n4. Resource \nImplications \nThe following resources should be provided: \n4.1. Poultry houses and nest set-up  \n4.2. Set of pre-laying and laying tools, materials and equipment \n4.3. Medication and nutritional requirements \n4.4. Weighing scale and other tools and equipment for grading \nof eggs \n5. Method of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. Passing written exam \n5.2. Practical demonstration \n6. Context of \nAssessment \n6.1     Competency may be assessed individually in the actual \nworkplace or through accredited farms/institutions\n",
