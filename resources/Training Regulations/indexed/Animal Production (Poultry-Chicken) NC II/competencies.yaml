        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Conducted preparation activities \n1.2. Carried out maintenance of poultry house and facilities \n1.3. Maintained farm area \n1.4. Performed completion activities \n2. Required \nKnowledge and \nAttitudes \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. Housing designs and housing equipment \n2.1.2. Maintenance procedures  of poultry house and \nfacilities \n2.1.3. Simple carpentry  \n2.1.4. Maintenance procedures of farm sites \n2.1.5. Different vermin and insects and their control \n2.1.6. Practice of downtime \n2.1.7. Setting-up fence   \n2.1.8. Knowledge on record-keeping  \n2.1.9. \nPractice 3Rs and 5S \n2.1.10. Labelling and handling of chemicals \n2.1.11. Parts and functions of specific tools and farm \nimplements use in raising poultry \n2.1.12. Program of work activities are implemented as \nscheduled \n2.2. Communication \n2.2.1. Prepare and submit required reports  \n2.2.2. Documentation on chicken performance and raising \n2.2.3. Record keeping and filing \n2.3. Mathematics and Mensuration \n2.3.1. \nBasic mathematical operations \n2.3.2. \nInventory of supplies, tools and equipment \n2.3.3. \nUnit of measurement conversion \n2.3.4. \nSimple/basic calculation \n2.4. Safety Practices \n2.4.1. Proper use of  farm tools, farm implements and \nequipment. \n2.4.2. Proper use of carpentry tools \n2.4.3. Wear appropriate PPE \n2.4.4. Proper waste disposal \n2.4.5. Practice of Occupational Health and Safety (OHS) \nprocedures. \n2.5. Codes and Regulations \n2.5.1. Fertilizer and Pesticides Authority (FPA) guidelines \nGood Animal Husbandry Practices (GAHP) \n2.5.2. DENR rules and regulations, zoning ordinances \n2.5.3. Animal Welfare Act – Minimum Standards on the \nWelfare of Poultry \n2.5.4. Appropriate legal regulatory body that supervises the \nanimal industry such as BAI and Phil. Animal Health \nCenter (PAHC).\n\n--- PDF PAGE 38 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n36\n2.5.5. Environmental Compliance Certificate \n2.6. Materials, Tools & Equipment: Uses, Specifications and \nMaintenance \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional manuals \n2.6.1.2. Safe keeping of equipment  \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies, materials \nand equipment needed in the maintenance of the \npoultry house and farm  \n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills for poultry house \nand farm area \n2.7. Values \n2.7.1. \nSafety and health consciousness \n2.7.2. \nTime consciousness and management \n2.7.3. \nResourcefulness \n2.7.4. \nCost consciousness \n2.7.5. \nDiligence \n2.7.6. \nDetermined \n2.7.7. \nObserves hygiene \n2.7.8. \nHonesty in records \n2.7.9. \nPersonal integrity in doing routine management \npractice \n2.7.10. Perseverance  \n2.7.11. Ability to work with others harmoniously \n3. Required Skills \n3.1 \nBasic carpentry skills \n3.2 \nOriented on farm and equipment layout \n3.3 \nWork safety \n3.4 \nSkills in using tools and equipment \n3.5 \nBasic mathematical computation \n3.6 \nCommunicate effectively \n3.7 \nBasic record keeping \n4. Resource \nImplications \nThe following resources should be provided: \n4.1. Poultry houses and facilities \n4.2. Farm area \n4.3. Foot and vehicle baths \n4.4. Supplies, tools and equipment for maintenance of poultry \nhouse and farm area \n5. Method of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. \nWritten exam \n5.2. \nPractical demonstration \n5.3. \nPortfolio \n6. Context of \nAssessment \n6.1     Competency may be assessed individually in the actual \nworkplace or through accredited farms/institutions",
