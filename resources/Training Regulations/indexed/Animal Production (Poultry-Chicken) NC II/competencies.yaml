ct observation \n5.2 \nPractical demonstration \n5.3 \nThird Party Report \n6. \nContext of \nAssessment \n6.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 24 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n22\n \nUNIT OF COMPETENCY : PERFORM ESTIMATION AND BASIC CALCULATION \n \nUNIT CODE : AFF321203 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \nrequired to perform basic workplace calculations. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables \n1. \nPerform estimation \n1.1 Job requirements are identified from written or oral \ncommunications \n1.2 Quantities of materials and resources required to \ncomplete a work task are estimated \n1.3 The time needed to complete a work activity is \nestimated \n1.4 Accurate estimate for work completion are made \n1.5 Estimate of materials and resources are reported to \nappropriate person \n2. \nPerform basic \nworkplace calculation \n2.1 Calculations to be made are identified according \nto job requirements \n2.2 Correct method of calculation identified \n2.3 System and units of measurement to be followed \nare ascertained \n2.4 Calculation needed to complete work tasks are \nperformed using the four basic process of addition, \ndivision, multiplication and subtraction \n2.5 Calculate whole fraction, percentage and mixed \nwhen are used to complete the instructions \n2.6 Number computed in self checked and completed \nfor alignment\n\n--- PDF PAGE 25 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n23\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nCalculations \n \n1.1 \nQuantity of feeds \n1.2 \nAmount of fertilizer \n1.3 \nAmount of medicines \n2. \nMethod of calculation \n \n2.1 \nAddition \n2.2 \nSubtraction \n2.3 \nMultiplication \n2.4 \nDivision \n2.5 \nRatio and proportion \n3. \nSystem o