  "source_section_text": "Section 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n4.2. The qualification of Animal Production (Poultry-Chicken) NC II may be\nattained through accumulation of Certificates of Competency (COCs) in the\nfollowing areas:\n\n4.2. 1.\nMaintain poultry house\n4.2. 2.\nBrood and grow birds\n4.2. 3.\nPerform pre-lay and lay activities\n4.2. 4.\nTrim beak\n\n4.3. The following elective competency for breeding also equivalent to a COC can\nalso be taken to enhance one’s employability as holder of Animal Production\n(Poultry-Chicken) NC II:\n\n4.3. 1.\n Breed chicken\n\nSuccessful candidates shall be awarded Certificates of Competency (COCs)\nbearing the signature of the Regional Director and Chair of the recognized\nlocal industry body.\n\n4.4. Demonstration of competence through project-type assessment covering all\nrequired units of the qualification.\n\n4.5. Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.6. The following are qualified to apply for assessment and certification:\n\n4.6.1. Graduates of formal, non-formal and informal including enterprise-\nbased training programs\n\n4.6.2. Experienced Workers (wage employed or self-employed)\n\n4.7. The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\n\n--- PDF PAGE 71 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II\nPromulgated December 2013\n69\nSupermarket of Competencies\nAGRI-FISHERY Sector\nCOMPETENCY MAP\nAnimal Production (Poultry-Chicken) NCII\nMaintain Poultry\nHouse\nBrood and Grow\nChicks\nPerform Pre-lay\nand Lay Activities\nTrim Beak\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nApply Safety\nMeasures in\nFarm\nOperations\nUse Farm Tools\nand Equipment\nPerform\nEstimation and\nBasic Calculation\nWork in a team\nenvironment\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\nPractice career\nprofessionalism\n\nPractice occupational\nhealth and safety\nprocedures\nProcess Farm\nWastes\nBreed Chicken\nELECTIVE\nCOMPETENCIES\n\n--- PDF PAGE 72 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II\nPromulgated December 2013\n70\nGLOSSARY OF TERMS\n\n\nBroiler – any commercial meat type chicken usually raised up to six weeks of age\n\nBrooder – an area used for raising young fowl that provides sufficient light and\nprotection\n\nBrooding – a management practice where chicks are given extra supplemental heat\nand proper care and management\n\nCage Housing – a type or system of poultry housing where layers could be kept alone,\nby two or in big groups in cage\n\nCulling – is the removal of undesirable or inferior animals in the herd based on\nimportant economic traits and overall performance\n\nDowntime- rest period\n\nImmunization – prevention of diseases by providing appropriate vaccines to animals\n\nIncubation – refers to the development of the birds from the fertilized eggs to fully\nformed chicks\n\nLivestock – domestic animals kept for use on a farm and raised for sale and profit\n\nNutrients – food elements or substance found in the feeds such as protein,\ncarbohydrates, fats and others\n\nPewee egg – the first egg of a pullet or the smallest sized egg\n\nPoultry – a collective term for birds used either for breeding, egg production, meat\nproduction and recreation\n\nPullet – a young bird ready to lay egg\n\nRation – the total amount of feeds taken in by an animal during a 24 hour period\n\nRooster – a matured male poultry used for breeding\n\nVaccination – a preventive measure to inoculate an animal with a mildly toxic\npreparation of bacteria or a virus of specific disease to prevent or to lessen the effects\nof the disease\n\nWaterer – equipment used in providing water to animals\n