--\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n37\n \nUNIT OF COMPETENCY : BROOD AND GROW CHICKS \n \nUNIT CODE : AFF622102 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \nrequired to brood and grow chicks. It includes conducting \nof preparatory activities, placing of brooder in growing \nhouse, \nfeeding \nof \nbirds, \nproviding \nof \noptimum \nenvironment for the birds, performing prophylactic and \ntherapeutic measures and performing flock selections for \nbroiler and layer. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Conduct preparatory \nactivities \n1.1. Wearing of personal protective equipment (PPE) \nis applied according to OHS procedures. \n1.2. Poultry house was cleaned and disinfected \naccording to company standard procedures. \n1.3. Materials, tools and equipment are prepared \naccording to production requirements. \n1.4. Chick guard, curtains and portable heaters are \ninstalled and adjusted based on industry standards. \n1.5. Litter materials are cleaned and laid-out, \nregularly following farm plans and schedule. \n2. Place chicks and \npullets in brooder \nhouse \n2.1. Broiler and layer stocks are obtained from \nreliable/recommended sources. \n2.2. A day-old chicks (DOC) and day-old pullets (DOP) \nare placed to respective brooding houses \nobserving Good Animal Practices and Animal \nWelfare Act. \n2.3. Chicks with abnormalities are culled from the \nflock. \n3. Perform feeding of \nbirds \n3.1. Feeders and waterers are prepared and cleaned \nregularly \n3.2. Poultry is fed according to company feeds and \nfeeding guide. \n3.3. Nutrient supplementation is practiced as remedial \nmeasures according to instructions of immediate \nauthority. \n3.4. Water is given according to industry standards and \nbird requirements. \n3.5. Feed left-over is properly secured and spoiled feed \nis disposed properly. \n4. Provide optimum \nenvironment for the \nbirds \n4.1. Lighting program is provided based on industry \nstandards. \n4.2. Ventilation is augmented during hot climatic \nconditions.\n\n--- PDF PAGE 40 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n38\n4.3. Curtain management is done based on prevailing \nconditions. \n4.4. Bio-security measures are applied according to \nindustry procedures. \n4.5. Vermin control is done following industry \nprocedures. \n4.6. Disposal of wastes are performed following DENR \nregulations. \n5. Perform preventive \nand treatment \nmeasures \n5.1. Distress conditions of poultry are determined and \nreported to immediate authority or veterinarian. \n5.2. Preventive measures are administered according \nto veterinarian recommendations and instructions. \n5.3. Sick birds are isolated for treatment following \ninstructions of veterinarian. \n5.4. Culling procedures are applied with reference to \neconomic considerations and according to \ninstructions of immediate authority. \n6. Perform flock \nselection \n6.1. Missexed are removed from flock following \nindustry standards.. \n6.2. Flock selection is performed according to company \nrequirements and productivity standards. \n6.3. Birds with poor physical conditions are culled out \nfor according company requirements on a regular \nbasis. \n6.4. Relevant records are updated on regular basis \nfollowing enteriprise protocol.\n\n--- PDF PAGE 41 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n39\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Tools and \nequipment \n \n1.1 Equipment \n1.1.1. Generator \n1.1.2. Brooder \n1.1.3. Electric lamps \n1.1.4. Weighing scale \n1.1.5. Feed bin \n1.1.6. Feed cart \n1.1.7. Industrial fan \n1.1.8. Knapsack sprayer \n1.1.9. Fire extinguisher \n1.1.10. Chicken crates/coops \n1.1.11. Vaccinator \n1.1.12. Debeaker \n1.2 Tools \n1.2.1. Pail and Basin \n1.2.2. Feed scoop \n1.2.3. Wheel barrow \n1.2.4. Ring guard \n1.2.5. Chic