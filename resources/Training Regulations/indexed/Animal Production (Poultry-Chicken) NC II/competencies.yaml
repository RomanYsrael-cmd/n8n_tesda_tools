        "source_text": "--- PDF PAGE 33 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n31\nCORE COMPETENCIES \n \nUNIT OF COMPETENCY :   MAINTAIN POULTRY ENVIRONMENT \n \nUNIT CODE                      :   AFF622101 \n \nUNIT DESCRIPTOR        :    This unit covers the knowledge, skills and attitudes \nrequired to maintain poultry house and its facilities. It \nincludes activities such as conducting preparation \nactivities, maintaining poultry house and facilities, \nmaintain farm area and perform work to completion.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Conduct preparation \nactivities \n1.1. Farm layout of poultry house and facilities are \ndetermined with reference to the housing plan.  \n1.2. Poultry housing and facilities are checked \naccording to enterprise procedures. \n1.3. Conditions of poultry housing and facilities are \nreported to the immediate authority and in \ncompliance with Environmental Compliance \nCertificate. \n1.4. Tools, materials and equipment are prepared \naccording to maintenance requirements and \ninstructions of authority. \n2. Maintain poultry house \nand facilities \n2.1. Poultry housing and facilities are cleaned and \ndisinfected in regular basis.  \n2.2. Minor repairs and maintenance are done as per \ninstruction of the authority and per work \nrequirements. \n2.3. Major malfunctions and irregular conditions in \nthe poultry house and facilities are reported \nimmediately.  \n2.4. Wearing of appropriate personal protective \nequipment (PPE) is practiced following OSHS \nprocedures. \n2.5. Downtime (rest period) is practiced prior to \nsucceeding loading for at least one week. \n2.6. Safety measures are practiced according to \nOccupational Safety and  Health Standards \n(OSHS).  \n3. Maintain farm area \n3.1. Maintenance of farm area and vicinities are \ndone according to production management and \nenterprise procedures. \n3.2. Vermin and insects control is performed\n\n--- PDF PAGE 34 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n32\naccording to Fertilizer and Pesticides Authority \nguidelines and DENR regulations. \n3.3. Maintenance of farm vegetation are conducted to \navoid common vermins and insects proliferation. \n4. Perform completion \nactivities \n4.1. Records are kept and updated for reporting and \ninventory purposes following enterprise \nprocedures. \n4.2. Tools and equipment are cleaned and stored \naccording to manuals and enterprise procedures. \n4.3. Housekeeping is practiced following 5S principles \nand enterprise procedures. \n4.4. Wastes  are managed following 3Rs principles and \nDENR regulations.\n\n--- PDF PAGE 35 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n33\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Poultry house and \nfacilities \n1.1. \nWork area \n1.2. \nStorage room \n1.3. \nBrooding/growing area \n2. Tools, materials \nand equipment \n2.1. \nEquipment \n2.1.1. Electric fans (ventilation) \n2.1.2. Lighting equipment \n2.1.3. Feeders \n2.1.4. Waterers \n2.1.5. Knapsack sprayer \n2.1.6. Power sprayer \n2.1.7. Knapsack sprayer \n2.1.8. Electric generator \n2.1.9. Heater \n2.2. \nTools \n2.2.1. Carpentry tools \n2.2.2. Wheel borrow \n2.2.3. Chick guard \n2.2.4. Shovel \n2.2.5. Spade \n2.2.6. Crow bar \n2.2.7. Electrical tools \n2.3. \nMaterials \n2.3.1. Sponge \n2.3.2. Scrub \n2.3.3. Broomstick and broom \n2.3.4. Trash can \n2.3.5. Sacks \n2.3.6. Dust fan \n2.3.7. Pipes \n2.3.8. Pale and basin \n2.3.9. Disinfectants \n2.3.10. Detergent \n2.3.11. Bleaching agent \n2.3.12. Water hose \n2.3.13. Drum \n3. Minor repairs and \nmaintenance \n3.1. Minor repairs \n3.1.1. Roof repair \n3.1.2. Pipe repair \n3.1.3. Floor slat repair \n3.1.4. Curtain fixing and  or replacement \n3.1.5. Cage repair \n3.1.6. Net repair and maintenance \n3.1.7. Feeder repair \n3.1.8. Waterer repair \n3.2. \nMaintenance\n\n--- PDF PAGE 36 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n34\n3.2.1. Foot bathing prior to entry to farm house \n3.2.2. Cloth changing prior to entry to farm house \n3.2.3. Shower before farm entry \n4. Major malfunctions \nand irregular \nconditions \n4.1. \nElectrical problem \n4.2. \nVentilation problem \n4.3. \nLighting system problem \n4.4. \nGenerator malfunction \n4.5. \nSludge flushing \n5. Personal Protective \nEquipment (PPE) \n5.1. \nMasks \n5.2. \nGloves \n5.3. \nRubber boots \n5.4. \nHats \n6. Vermin and insects \n6.1. Vermin  \n6.1.1. Monitor lizards \n6.1.2. Rats  \n6.1.3. Snakes \n6.2. Insects \n6.2.1. Mosquitoes \n6.2.2. Flies \n6.2.3. Cackroach \n6.2.4. Ants \n6.2.5. Tribolium beetle \n7. Maintenance of \nfarm area and \nvicinities \n7.1. Disposal of wastes and farm by-products \n7.2. Disposal of necropsied and dead animals  \n7.3. Weeding \n7.4. Minor repair of farm fences \n7.5. Foot bathing in farm gate \n7.6. Vehicle bathing in farm gate \n7.7. Maintenance of drainage canal\n\n--- PDF PAGE 37 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n35\nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Conducted preparation activities \n1.2. Carried out maintenance of poultry house and facilities \n1.3. Maintained farm area \n1.4. Performed completion activities \n2. Required \nKnowledge and \nAttitudes \n2.1. Knowledge, Theory, Practices and Systems Operations \n2.1.1. Housing designs and housing equipment \n2.1.2. Maintenance procedures  of poultry house and \nfacilities \n2.1.3. Simple carpentry  \n2.1.4. Maintenance procedures of farm sites \n2.1.5. Different vermin and insects and their control \n2.1.6. Practice of downtime \n2.1.7. Setting-up fence   \n2.1.8. Knowledge on record-keeping  \n2.1.9. \nPractice 3Rs and 5S \n2.1.10. Labelling and handling of chemicals \n2.1.11. Parts and functions of specific tools and farm \nimplements use in raising poultry \n2.1.12. Program of work activities are implemented as \nscheduled \n2.2. Communication \n2.2.1. Prepare and submit required reports  \n2.2.2. Documentation on chicken performance and raising \n2.2.3. Record keeping and filing \n2.3. Mathematics and Mensuration \n2.3.1. \nBasic mathematical operations \n2.3.2. \nInventory of supplies, tools and equipment \n2.3.3. \nUnit of measurement conversion \n2.3.4. \nSimple/basic calculation \n2.4. Safety Practices \n2.4.1. Proper use of  farm tools, farm implements and \nequipment. \n2.4.2. Proper use of carpentry tools \n2.4.3. Wear appropriate PPE \n2.4.4. Proper waste disposal \n2.4.5. Practice of Occupational Health and Safety (OHS) \nprocedures. \n2.5. Codes and Regulations \n2.5.1. Fertilizer and Pesticides Authority (FPA) guidelines \nGood Animal Husbandry Practices (GAHP) \n2.5.2. DENR rules and regulations, zoning ordinances \n2.5.3. Animal Welfare Act – Minimum Standards on the \nWelfare of Poultry \n2.5.4. Appropriate legal regulatory body that supervises the \nanimal industry such as BAI and Phil. Animal Health \nCenter (PAHC).\n\n--- PDF PAGE 38 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II    \nPromulgated December 2013 \n36\n2.5.5. Environmental Compliance Certificate \n2.6. Materials, Tools & Equipment: Uses, Specifications and \nMaintenance \n2.6.1. Tools and Equipment \n2.6.1.1. Can understand and follow instructional manuals \n2.6.1.2. Safe keeping of equipment  \n2.6.2. Materials \n2.6.2.1. Where to source good quality supplies, materials \nand equipment needed in the maintenance of the \npoultry house and farm  \n2.6.3. Maintenance \n2.6.3.1. Regular upkeep of equipment and facilities \n2.6.3.2. Preventive maintenance skills for poultry house \nand farm area \n2.7. Values \n2.7.1. \nSafety and health consciousness \n2.7.2. \nTime consciousness and management \n2.7.3. \nResourcefulness \n2.7.4. \nCost consciousness \n2.7.5. \nDiligence \n2.7.6. \nDetermined \n2.7.7. \nObserves hygiene \n2.7.8. \nHonesty in records \n2.7.9. \nPersonal integrity in doing routine management \npractice \n2.7.10. Perseverance  \n2.7.11. Ability to work with others harmoniously \n3. Required Skills \n3.1 \nBasic carpentry skills \n3.2 \nOriented on farm and equipment layout \n3.3 \nWork safety \n3.4 \nSkills in using tools and equipment \n3.5 \nBasic mathematical computation \n3.6 \nCommunicate effectively \n3.7 \nBasic record keeping \n4. Resource \nImplications \nThe following resources should be provided: \n4.1. Poultry houses and facilities \n4.2. Farm area \n4.3. Foot and vehicle baths \n4.4. Supplies, tools and equipment for maintenance of poultry \nhouse and farm area \n5. Method of \nAssessment \nCompetency in this unit may be assessed through: \n5.1. \nWritten exam \n5.2. \nPractical demonstration \n5.3. \nPortfolio \n6. Context of \nAssessment \n6.1     Competency may be assessed individually in the actual \nworkplace or through accredited farms/institutions\n",
