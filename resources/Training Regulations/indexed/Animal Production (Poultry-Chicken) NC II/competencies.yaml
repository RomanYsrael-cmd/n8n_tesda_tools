        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nCorrectly identified appropriate farm tools and equipment \n1.2 \nOperated farm equipments according to manual \nspecification \n1.3 \nPerformed preventive maintenance \n2. Required \nKnowledge and \nAttitudes \n \n2.1 \nSafety Practices \n2.1.1 Ideal good work habits to demonstrate to workers \neasy and safety standards during operation of \nfarm equipment \n2.2 \nCodes and Regulations \n2.2.1 Environmental Compliance Certificate (ECG) \n2.2.2 Effective work supervision in the operations of \nfarm equipment \n \n2.3 \nTools & Equipment: Uses and Specification \n2.3.1 Knowledge in calibrating and use of equipment \n2.3.2 Safety keeping of equipments every after use \n \n2.4 \nMaintenance \n2.4.1 Regular upkeep of equipments \n2.4.2 Preventive maintenance skills \n \n2.5 \nValues \n2.5.1 Positive outlook towards work \n2.5.2 Possesses pre-emptive/anticipatory skills \n3. \nRequired Skills \n3.1 \nAbility to recognized defective farm equipment \n3.2 \nPerform proper management practices of safety \nmeasures \n4. \nResource \nImplications \nThe following resources should be provided: \n4.1 \nService/operational manual of farm tools and equipment \n4.2 \nTools and equipment \n4.3 \nFarm implements \n \n5. \nMethod of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 \nDirect observation \n5.2 \nPractical demonstration \n5.3 \nThird Party Report \n6. \nContext of \nAssessment \n6.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 24 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n22\n \nUNIT OF COMPETENCY : PERFORM ESTIMATION AND BASIC CALCULATION \n \nUNIT CODE :"
        },
        "source_text": "AFF321202 \n \nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes \nrequired to use farm tools and equipment. It includes \nselection, operation and preventive maintenance of farm \ntools and equipment. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables \n1. \nSelect and use farm \ntools \n \n1.1 \nIdentified appropriate farm tools according to \nrequirement/use \n1.2 \nFarm tools are checked for faults and defective \ntools reported in accordance with farm procedures \n1.3 \nAppropriate tools and equipment are safely used \naccording to job requirements and manufacturers \nconditions \n2. \nSelect and operate \nfarm equipment \n2.1 \nIdentify appropriate farm equipment \n2.2 \nInstructional manual of the farm tools and \nequipment are carefully read prior to operation \n2.3 \nPre-operation check-up is conducted in line with \nmanufacturers manual \n2.4 \nFaults in farm equipment are identified and \nreported in line with farm procedures \n2.5 \nFarm equipment used according to its function \n2.6 \nFollowed safety procedures \n3. \nPerform preventive \nmaintenance \n3.1 \nTools and equipment are cleaned immediately \nafter use in line with farm procedures \n3.2 \nRoutine check-up and maintenance are \nperformed \n3.3 \nTools and equipment are stored in designated \nareas in line with farm procedures\n\n--- PDF PAGE 22 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n20\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Farm equipment \n \n1.1 Engine \n1.2 Pumps \n1.3 Generators \n1.4 Sprayers \n2. Farm tools \n2.1 Sickle \n2.2 Cutters \n2.3 Weighing scales \n2.4 Hand tools \n2.5 Measuring tools \n2.6 Garden tools \n3. Pre-operation check-up \n3.1 Tires \n3.2 Brake fluid \n3.3 Fuel \n3.4 Water \n3.5 Oil \n3.6 Lubricants \n3.7 Battery\n\n--- PDF PAGE 23 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n21\n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nCorrectly identified appropriate farm tools and equipment \n1.2 \nOperated farm equipments according to manual \nspecification \n1.3 \nPerformed preventive maintenance \n2. Required \nKnowledge and \nAttitudes \n \n2.1 \nSafety Practices \n2.1.1 Ideal good work habits to demonstrate to workers \neasy and safety standards during operation of \nfarm equipment \n2.2 \nCodes and Regulations \n2.2.1 Environmental Compliance Certificate (ECG) \n2.2.2 Effective work supervision in the operations of \nfarm equipment \n \n2.3 \nTools & Equipment: Uses and Specification \n2.3.1 Knowledge in calibrating and use of equipment \n2.3.2 Safety keeping of equipments every after use \n \n2.4 \nMaintenance \n2.4.1 Regular upkeep of equipments \n2.4.2 Preventive maintenance skills \n \n2.5 \nValues \n2.5.1 Positive outlook towards work \n2.5.2 Possesses pre-emptive/anticipatory skills \n3. \nRequired Skills \n3.1 \nAbility to recognized defective farm equipment \n3.2 \nPerform proper management practices of safety \nmeasures \n4. \nResource \nImplications \nThe following resources should be provided: \n4.1 \nService/operational manual of farm tools and equipment \n4.2 \nTools and equipment \n4.3 \nFarm implements \n \n5. \nMethod of \nAssessment \n \nCompetency in this unit may be assessed through: \n5.1 \nDirect observation \n5.2 \nPractical demonstration \n5.3 \nThird Party Report \n6. \nContext of \nAssessment \n6.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 24 ---\nTR-ANIMAL PRODUCTION (POULTRY-CHICKEN) NC II \nPromulgated December 2013 \n22\n \nUNIT OF COMPETENCY : PERFORM ESTIMATION AND BASIC CALCULATION \n \nUNIT CODE :"
