        "source_text": "TRS311204\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nand attitudes in following health, safety and security\npractices. It includes dealing with emergency situations\nand maintaining safe personal presentation standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Follow workplace\nprocedures for health,\nsafety and security\npractices\n1.1\nCorrect health, safety and security procedures are\nfollowed in line with legislation, regulations and\nenterprise procedures\n1.2\nBreaches of health, safety and security procedures\nare identified and reported in line with enterprise\nprocedure\n1.3\nSuspicious behavior or unusual occurrence are\nreported in line with enterprise procedure\n\n2. Deal with emergency\nsituations\n2.1\nEmergency and potential emergency situations are\nrecognized and appropriate action are taken within\nindividual’s scope of responsibility\n2.2\nEmergency procedures are followed in line with\nenterprise procedures\n2.3\nAssistance is sought from colleagues to resolve or\nrespond to emergency situations\n2.4\nDetails of emergency situations are reported in line\nwith enterprise procedures\n\n3. Maintain safe personal\npresentation standards\n3.1\nSafe personal standards are identified and followed in\nline with enterprise requirements\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n24\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Health, safety and\nsecurity procedures\nMay include:\n1.1\nuse of personal protective clothing and equipment\n1.2\nsafe posture including sitting, standing, bending\n1.3\nmanual handling including lifting, transferring\n1.4\nsafe work techniques including knives and equipment,\nhandling hot surfaces, computers and electronic\nequipment\n1.5\nsafe handling of chemicals, poisons and dangerous\nmaterials\n1.6\nergonomically sound furniture and work stations\n1.7\nemergency fire and accident\n1.8\nhazard identification and control\n1.9\nsecurity of documents, cash, equipment, people\n1.10 key control systems\n\n2. Breaches of procedure\nMay include:\n2.1\nloss of keys\n2.2\nstrange or suspicious persons\n2.3\nbroken or malfunctioning equipment\n2.4\nloss of property, goods or materials\n2.5\ndamaged property or fittings\n2.6\nlack of suitable signage when required\n2.7\nlack of training on health and safety issues\n2.8\nunsafe work practices\n\n3. Emergency\nMay include:\n3.1\npersonal injuries\n3.2\nfire\n3.3\nelectrocution\n3.4\nnatural calamity i.e. earthquake/flood\n3.5\ncriminal acts i.e. robbery\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n25\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nComplied with industry practices and procedures\n1.2\nUsed interactive communication with others\n1.3\nComplied with workplace safety, security and hygiene\npractices\n1.4\nIdentified faults & problems and the necessary\ncorrective action\n1.5\nPromoted public relation among others\n1.6\nComplied with quality standards\n1.7\nResponded to emergency situations in line with\nenterprise guidelines\n1.8\nComplied with proper dress code\n2. Underpinning\nKnowledge and\nAttitude\n2.1\nCommunication\n2.1.1 Interactive communication with others\n2.1.2 Interpersonal skills\n2.1.3 Good working attitude\n2.1.4 Ability to work quietly; with cooperation;\npatience, carefulness, cleanliness and aesthetic\nvalues\n2.1.5 Ability to focus on task at hand\n2.2\nSystems, Processes and Operations\n2.2.1 Workplace health, safety and security\nprocedures\n2.2.2 Emergency procedures\n2.2.3 Personal presentation\n2.3\nSafety Practices\n2.3.1 Proper disposal of garbage\n2.3.2 Practice safety measures\n2.3.3 5S Implementation\n\n3. Underpinning Skills\n3.1\nAbility to make decision\n3.2\nTime management\n3.3\nAbility to offer alternative steps\n3.4\nCare in handling and operating equipment\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nProcedures Manual on safety, security, health and\nemergency\n4.2\nAvailability of tools, equipment, supplies and materials\n\n5. Methods of\nAssessment\nCompetency in this unit should be assessed through:\n5.1 Written examination\n5.1\nPractical demonstration\n5.2\nInterview\n\n6. Context for\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n26\n\nUNIT OF COMPETENCY\n:\nPROVIDE EFFECTIVE CUSTOMER SERVICE\n\nUNIT CODE\n\n:"
