        "descriptor": "This unit deals with the skills and knowledge required to make and administer bookings for tourism or hospitality products and services. It describes the coordination of bookings with suppliers, normally a business to business transaction.",
        "elements": [
          {
            "number": 1,
            "title": "Request services",
            "performance_criteria": [
              {
                "number": "1.1",
                "text": "Customers’ required document and other materials are prepared and issued.",
                "source_number": "1.2"
              },
              {
                "number": "1.2",
                "text": "Customer’s records of the financial status are accurately updated in accordance with enterprise procedures.",
                "source_number": "1.3"
              },
              {
                "number": "1.3",
                "text": "Supplier’s services to be booked are identified according to the customer’s requirements and requests.",
                "source_number": "1.4"
              },
              {
                "number": "1.4",
                "text": "Details of specific products and services which have been sold are identified and confirmed to the customer.",
                "source_number": "1.5"
              },
              {
                "number": "1.5",
                "text": "Where no specific product/s or service/s has been confirmed to the customer, appropriate suppliers are selected to ensure customer needs are met according to prices quoted.",
                "source_number": "1.6"
              },
              {
                "number": "1.6",
                "text": "Supplier is selected according to any pre-negotiated enterprise arrangements.",
                "source_number": "1.7"
              },
              {
                "number": "1.7",
                "text": "Products and services are requested from suppliers using the appropriate method in accordance with enterprise procedures.",
                "source_number": "2.1"
              },
              {
                "number": "1.8",
                "text": "Details of the required booking are provided to ensure the customer receives the correct product or service including:",
                "source_number": "2.2"
              },
              {
                "number": "1.9",
                "text": "1 Customer details",
                "source_number": "2.2"
              },
              {
                "number": "1.10",
                "text": "2 Inclusive date, time and location of commencement and conclusion of service",
                "source_number": "2.2"
              },
              {
                "number": "1.11",
                "text": "3 Any pre-negotiated costs and payment detail",
                "source_number": "2.2"
              },
              {
                "number": "1.12",
                "text": "4 Nature of service to be provided",
                "source_number": "2.2"
              },
              {
                "number": "1.13",
                "text": "5 Special request or requirements",
                "source_number": "2.2"
              },
              {
                "number": "1.14",
                "text": "Multiple services are requested in the most practical and sequential order.",
                "source_number": "2.3"
              },
              {
                "number": "1.15",
                "text": "Alternative choices are requested if desired bookings are not available",
                "source_number": "2.4"
              },
              {
                "number": "1.16",
                "text": "Changes made to original bookings are identified and action flow-on impacts are adjusted accordingly",
                "source_number": "2.5"
              },
              {
                "number": "1.17",
                "text": "Revisions to bookings are made as requested/required including adjustment to other arrangements, accordingly",
                "source_number": "2.6"
              }
            ],
            "source_number": 2
          },
          {
            "number": 2,
            "title": "Record request and confirmation",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "Records of all bookings made are kept including requests and confirmations then filed in accordance with company policies and procedures.",
                "source_number": "3.1"
              },
              {
                "number": "2.2",
                "text": "Files are monitored to ensure that all confirmations have been received and follow up pending bookings/reservations.",
                "source_number": "3.2"
              },
              {
                "number": "2.3",
                "text": "Actions to be taken in relation to bookings are noted and scheduled in accordance with system and/or company policies and procedures.",
                "source_number": "3.3"
              }
            ],
            "source_number": 3
          },
          {
            "number": 3,
            "title": "Update and finalize bookings",
            "performance_criteria": [
              {
                "number": "3.1",
                "text": "Amendments/adjustments made are accurately recorded in accordance with enterprise procedures.",
                "source_number": "4.1"
              },
              {
                "number": "3.2",
                "text": "Payments required by the supplier are processed at the appropriate time in accordance with enterprise procedures.",
                "source_number": "4.2"
              },
              {
                "number": "3.3",
                "text": "Booking changes are relayed to suppliers in accordance with agreed procedures and any contractual arrangements.",
                "source_number": "4.3"
              },
              {
                "number": "3.4",
                "text": "Client’s final details and requirements are finalized with suppliers in accordance with the standard operating procedures.",
                "source_number": "4.4"
              },
              {
                "number": "3.5",
                "text": "Clients payment are collected and corresponding proof of payment is provided in accordance to company policies and procedures",
                "source_number": "4.5"
              }
            ],
            "source_number": 4
          }
