        "source_text": "--- PDF PAGE 4 ---\nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n2 \n \nSECTION 2 COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core units \nof competency required in TRAVEL SERVICES NC II.  \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY \n: \nPARTICIPATE IN WORKPLACE COMMUNICATION \n \nUNIT CODE \n: \n500311105 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Obtain and convey \nworkplace information \n1.1 \nSpecific and  relevant information is accessed from \nappropriate sources  \n1.2 \nEffective questioning , active listening and speaking \nskills are used to gather and convey information \n1.3 \nAppropriate medium is used to transfer information \nand ideas \n1.4 \nAppropriate non- verbal communication is used \n1.5 \nAppropriate lines of communication with supervisors \nand colleagues are identified and followed \n1.6 \nDefined workplace procedures for the location and \nstorage of information are used \n1.7 \nPersonal interaction is carried out clearly and \nconcisely \n \n2. Participate in \nworkplace meetings \nand discussions \n2.1 \nTeam meetings are attended on time \n2.2 \nOwn opinions are clearly expressed and those of \nothers are listened to without interruption \n2.3 \nMeeting inputs are consistent with the meeting \npurpose and established protocols \n2.4 \nWorkplace interactions are conducted in a \ncourteous manner  \n2.5 \nQuestions about simple routine workplace procedures \nand maters concerning working conditions of \nemployment are asked and responded to \n2.6 \nMeetings outcomes are interpreted and implemented \n \n3. Complete relevant \nwork related \ndocuments \n3.1 \nRange of forms relating to conditions of employment \nare completed accurately and legibly \n3.2 \nWorkplace data is recorded on standard workplace \nforms and documents \n3.3 \nBasic mathematical processes are used for routine \ncalculations \n3.4 \nErrors in recording information on forms/ documents \nare identified and properly acted upon \n3.5 \nReporting requirements to supervisor are completed \naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n3 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \n1.1. Team members \n1.2. Suppliers \n1.3. Trade personnel \n1.4. Local government \n1.5. Industry bodies \n \n2. Medium \n2.1. Memorandum \n2.2. Circular \n2.3. Notice \n2.4. Information discussion \n2.5. Follow-up or verbal  instructions \n2.6. Face to face communication \n \n3. Storage \n3.1. Manual filing system \n3.2. Computer-based filing system \n \n4. Forms \n4.1. Personnel forms, telephone message forms, safety \nreports \n \n5. Workplace interactions \n5.1. Face to face \n5.2. Telephone \n5.3. Electronic and two way radio \n5.4. Written including electronic, memos, instruction and \nforms, non-verbal including gestures, signals, signs \nand diagrams \n \n6. Protocols \n6.1. Observing meeting \n6.2. Compliance with meeting decisions \n6.3. Obeying meeting instructions\n\n--- PDF PAGE 6 ---\nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n4 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Prepared written communication following standard \nformat of the organization \n1.2. Accessed information using communication equipment \n1.3. Made use of relevant terms as an aid to transfer \ninformation effectively \n1.4. Conveyed information effectively adopting the formal \nor informal communication \n \n2. Required Knowledge  \n \n2.1. Effective communication \n2.2. Different modes of communication  \n2.3. Written communication \n2.4. Organizational policies \n2.5. Communication procedures and systems \n2.6. Technology relevant to the enterprise and the \nindividual’s work responsibilities \n3. Required Skills \n3.1. Follow simple spoken language \n3.2. Perform routine workplace duties following simple \nwritten notices \n3.3. Participate in workplace meetings and discussions \n3.4. Complete work related documents \n3.5. Estimate, calculate and record routine workplace \nmeasures \n3.6. Basic mathematical processes of addition, subtraction, \ndivision and multiplication \n3.7. Ability to relate to people of social range in the \nworkplace \n3.8. Gather and provide information in response to \nworkplace requirements \n \n4. Resource \nImplications \n4.1. Fax machine \n4.2. Telephone \n4.3. Writing materials \n4.4. Internet \n \n5. Methods of \nAssessment \n5.1. Direct Observation \n5.2. Oral interview and written test \n \n6. Context of \nAssessment \n6.1 \nCompetency may be assessed individually in the \nactual workplace or through accredited institution\n",
