          "source_text": "1.  Critical aspects of  \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated knowledge of  passport requirements and \nprocedures \n1.2 \nDemonstrate knowledge of visa documentation \nrequirements and procedure \n1.3 \nDemonstrate knowledge of Immigration Exit clearance and \nReentry permit procedure and other Immigration procedure \nrequirements . \n1.4 \nDemonstrated ability to correctly apply DFA, Embassies, \nand Bureau of Immigration rules and procedures within \nenterprise acceptable timeframes. \n1.5 \nDemonstrated ability to assist clients in acquiring travel \ndocuments within the soonest time before date of travel \n2.  Required Knowledge  \n2.1 \nRole of DFA, Embassies, Bureau of Quarantine, TIEZA & \nBureau of Immigration in international travel \n2.2 \nDFA, Embassies, Bureau of Quarantine, TIEZA & Bureau \nof Immigration agency accreditation requirements. \n2.3 \nDFA, Embassies, Bureau of Quarantine, TIEZA & Bureau \nof Immigration procedures \n2.4 \nDFA, Embassies, Bureau of Quarantine, TIEZA & Bureau \nof Immigration timeframes. \n2.5 \nDFA, Embassies, Bureau of Quarantine, TIEZA & Bureau \nof Immigration  documentation. \n2.6 \nGeneral understanding of travel documentation \nprocedures. \n2.7 \nBasic and advanced geography and airline geography \n3.  Required Skills \n3.1 \nTravel documentation handling \n3.2 \nApplication of Department of Foreign Affairs, Embassies, \nBureau of Quarantine, TIEZA and Bureau of Immigration \nprocedures within enterprise acceptable timeframes and \nother relevant agencies/ authorities \n3.3 \nCorrect pronunciation of destination \n3.4 \nComputer operation (GDS) literacy \n3.5 \nCommunication skills \n4.  Resource implications \nThe following resources should be provided: \n4.1 \nTelephone, fax, e-mail \n4.2 \nComputer reservations system or global distribution \nsystem, internet connection \n4.3 \nTimatic/Maps and updated Atlas \n4.4 \nUpdated PTAA Outbound Travel Operations Manual \n5.  Methods of Assessment \nCompetency may be assessed through: \n5.1 \nWritten exercises, quizzes and tests of DFA, Embassies, Bureau \nof Quarantine, TIEZA and Bureau of Immigration procedures \n5.2 \nReview of DFA, Embassies, Bureau of Quarantine, TIEZA and \nBureau of Immigration application forms, actual or facsimile \n5.3 \nWritten and oral questioning or interview to test knowledge of \nrules and procedures applicable to the completion of DFA, \nEmbassies, Bureau of Quarantine, TIEZA and Bureau of \nImmigration documents \n5.4 \nReview of portfolios of evidence and third party workplace reports \nof on-the-job performance by the candidate \n5.5 \nHands on assessment on the knowledge of flight reservation \nusing a GDS \n6.  Context for Assessment \n6.1 \nAssessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 \nAssessment activities are carried out through TESDA’s \naccredited assessment center with the right assessment \nequipment.",
