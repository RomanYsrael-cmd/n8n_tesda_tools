        "source_title": "PROVIDE ASSISTANCE IN TRAVEL DOCUMENTATION PREPARATION",
        "source_text": "--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n37 \n \nUNIT OF COMPETENCY \n: \nPROVIDE ASSISTANCE IN TRAVEL \nDOCUMENTATION PREPARATION  \n \nUNIT CODE \n: \nTRS5113120 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the skills and knowledge required to \nassist clients in preparation of travel documents ie \npassport, visa, immigration papers in preparation for \ntravel abroad. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare and assist \nclient’s passport \napplication \n1.1 \nInformation and documentary requirements of client’s \npassport application is collated in accordance with \ncompany policies and procedures and appropriate \nnational and foreign government authorities \n1.2 \nPassport application documents are checked for \naccuracy, completeness and identified discrepancies \nare corrected or referred to client where necessary \n1.3 \nPassport application documents are filed with proper \nauthorities/DFA and corresponding fees are paid  \n1.4 \nNew passport is claimed from appropriate national and \nforeign government authorities within same day of \nrelease \n1.5 \nPassport is logged and released to client according to \ntravel agency policies and procedures \n \n2.  Assist client in securing \nvisa and/or permits for \ncountry of destination \nand transit points, as \napplicable \n2.1 \nVisa requirements for client’s country of destination \nare determined \n2.2 \nVisa applicant is informed on the requirements and \nfees required by preferred country of destination  \n2.3 \nWhere applicable, visa applicant is assisted in paying \nthe fees, securing appointments and in filling up and \nsubmitting  the accomplished forms required by the  \ncountry of destination and/or transit points \n2.4 \nVisa documentary requirements are prepared \naccording to the requirements of the country of \ndestination  \n2.5 \nVisa applicant is informed of the date of personal \nappearance or interview at the Embassy, if applicable  \n2.6 \nVisa applicant is informed on procedures on how and \nwhen the visa is to be released by the Embassy \n2.7 \nVisa is logged and released to client according to \ntravel agency policies and procedures\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08 \nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n38 \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n3.  Assist client’s in \nsecuring immigration \nclearance application \nfor travel abroad \n3.1 \nImmigration clearance requirements are inquired and \ndetermined from the Immigration department \n3.2 \nImmigration clearance applicant is assisted in paying the \nfees and in filling up forms required by the immigration \ndepartment \n3.3 \nImmigration clearance documentary requirements are \nprepared according to the requirements of the immigration \ndepartment  \n3.4 \nImmigration clearance applicant is informed on procedures \non how and when is the clearance to be released by the \nimmigration department \n3.5 \nImmigration clearance document is logged and released \nto client according to travel agency policies and procedures  \n \n4.  Provide assistance in \nsecuring additional \nrequirements for travel  \n4.1 \nNecessary additional travel documents requirements for \nvisitors, OFWs, minors etc. are inquired and determined \n4.2 \nApplicant is assisted in paying the fees and in filling up \nforms required by the immigration department \n4.3 \nDocumentary requirements are prepared according to the \nrequirements for travel \n4.4 \nApplicant is informed on procedures on how  and when is \nthe required travel documents to be released by the \nimmigration department \n4.5 \nDocument is logged and released to client according to \ntravel agency policies and procedures\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08 \nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n39 \n \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1.  Passport \nMay be for: \n1.1 Filipinos \n1.2 Resident Foreign Nationals \n \n \n2.  Visa \nMay include: \n2.1 \nWorldwide destination \n2.2 \nTourist \n2.3 \nTemporary Visitors \n2.4 \nBusinessman \n2.5 \nStudents \n \n3.  Immigration \nDocumentation \nMay include \n3.1 \nTravel Exit clearance & reentry permit \n3.2 \nExtension of visa \n3.3 \nApplication of change of visa status \n3.4 \nAnnual Registration of foreign nationals \n3.5 \nApplication of I-Card \n3.6 \nTravel clearance for person with the same name \n3.7 \nApplication of extension of reentry permit \n3.8 \nPayment of Head tax \n \n4.  Additional travel \ndocuments \n4.1 \nDSWD clearance \n4.2 \nCourt clearance \n4.3 \nCFO (Commission on Filipinos Overseas) \n4.4 \nPOEA clearance \n4.5 \nNBI clearance \n4.6 \nBureau of Quarantine vaccination card \n4.7 \nAnd other similar government agencies\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08 \nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n40 \n \nEVIDENCE GUIDE \n1.  Critical aspects of  \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated knowledge of  passport requirements and \nprocedures \n1.2 \nDemonstrate knowledge of visa documentation \nrequirements and procedure \n1.3 \nDemonstrate knowledge of Immigration Exit clearance and \nReentry permit procedure and other Immigration procedure \nrequirements . \n1.4 \nDemonstrated ability to correctly apply DFA, Embassies, \nand Bureau of Immigration rules and procedures within \nenterprise acceptable timeframes. \n1.5 \nDemonstrated ability to assist clients in acquiring travel \ndocuments within the soonest time before date of travel \n2.  Required Knowledge  \n2.1 \nRole of DFA, Embassies, Bureau of Quarantine, TIEZA & \nBureau of Immigration in international travel \n2.2 \nDFA, Embassies, Bureau of Quarantine, TIEZA & Bureau \nof Immigration agency accreditation requirements. \n2.3 \nDFA, Embassies, Bureau of Quarantine, TIEZA & Bureau \nof Immigration procedures \n2.4 \nDFA, Embassies, Bureau of Quarantine, TIEZA & Bureau \nof Immigration timeframes. \n2.5 \nDFA, Embassies, Bureau of Quarantine, TIEZA & Bureau \nof Immigration  documentation. \n2.6 \nGeneral understanding of travel documentation \nprocedures. \n2.7 \nBasic and advanced geography and airline geography \n3.  Required Skills \n3.1 \nTravel documentation handling \n3.2 \nApplication of Department of Foreign Affairs, Embassies, \nBureau of Quarantine, TIEZA and Bureau of Immigration \nprocedures within enterprise acceptable timeframes and \nother relevant agencies/ authorities \n3.3 \nCorrect pronunciation of destination \n3.4 \nComputer operation (GDS) literacy \n3.5 \nCommunication skills \n4.  Resource implications \nThe following resources should be provided: \n4.1 \nTelephone, fax, e-mail \n4.2 \nComputer reservations system or global distribution \nsystem, internet connection \n4.3 \nTimatic/Maps and updated Atlas \n4.4 \nUpdated PTAA Outbound Travel Operations Manual \n5.  Methods of Assessment \nCompetency may be assessed through: \n5.1 \nWritten exercises, quizzes and tests of DFA, Embassies, Bureau \nof Quarantine, TIEZA and Bureau of Immigration procedures \n5.2 \nReview of DFA, Embassies, Bureau of Quarantine, TIEZA and \nBureau of Immigration application forms, actual or facsimile \n5.3 \nWritten and oral questioning or interview to test knowledge of \nrules and procedures applicable to the completion of DFA, \nEmbassies, Bureau of Quarantine, TIEZA and Bureau of \nImmigration documents \n5.4 \nReview of portfolios of evidence and third party workplace reports \nof on-the-job performance by the candidate \n5.5 \nHands on assessment on the knowledge of flight reservation \nusing a GDS \n6.  Context for Assessment \n6.1 \nAssessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 \nAssessment activities are carried out through TESDA’s \naccredited assessment center with the right assessment \nequipment.\n",
