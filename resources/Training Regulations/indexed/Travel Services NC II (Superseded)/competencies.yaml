        "source_title": "CREATE TRAVEL-RELATED RESERVATIONS AND TRANSACTIONS",
        "source_text": "--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08 \nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n29 \n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n: \nCREATE TRAVEL-RELATED RESERVATIONS AND \nTRANSACTIONS \n \nUNIT CODE \n: \nTRS5113119 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the skills and knowledge required to \nmake and administer bookings for tourism or hospitality \nproducts and services. It describes the coordination of \nbookings with suppliers, normally a business to \nbusiness transaction.  \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Administer client file \nand identify booking \nrequirements \n1.1 \nCustomers records of new or existing booking \nrequirements are interpreted or created  \n1.2 \nCustomers’ required document and other materials are \nprepared and issued. \n1.3 \nCustomer’s records of the financial status are \naccurately updated in accordance with enterprise \nprocedures. \n1.4 \nSupplier’s services to be booked are identified \naccording to the customer’s requirements and \nrequests. \n1.5 \nDetails of specific products and services which have \nbeen sold are identified and confirmed to the \ncustomer. \n1.6 \nWhere no specific product/s or service/s has been \nconfirmed to the customer, appropriate suppliers are \nselected to ensure customer needs are met according \nto prices quoted. \n1.7 \nSupplier is selected according to any pre-negotiated \nenterprise arrangements. \n \n2. Request services \n2.1 Products and services are requested from suppliers \nusing the appropriate method in accordance with \nenterprise procedures. \n2.2 Details of the required booking are provided to ensure \nthe customer receives the correct product or service \nincluding: \n2.2.1 Customer details \n2.2.2 Inclusive date, time and location of  \ncommencement and conclusion of  service \n2.2.3 Any pre-negotiated costs and payment detail \n2.2.4 Nature of  service to be provided \n2.2.5 Special request or requirements \n2.3 Multiple services are requested in the most practical \nand sequential order. \n2.4 Alternative choices are requested if desired bookings \nare not available \n2.5 Changes made to original bookings are identified and \naction flow-on impacts are adjusted accordingly \n2.6 Revisions to bookings are made as requested/required \nincluding adjustment to other arrangements, \naccordingly\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08 \nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n30\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n31 \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n3. Record request and \nconfirmation \n3.1 Records of all bookings made are kept including \nrequests and confirmations then filed in accordance \nwith company policies and procedures. \n3.2 Files are monitored to ensure that all confirmations \nhave been received and follow up pending \nbookings/reservations. \n3.3 Actions to be taken in relation to bookings are noted \nand scheduled in accordance with system and/or \ncompany policies and procedures. \n \n4. Update and finalize \nbookings \n4.1 Amendments/adjustments made are accurately \nrecorded in accordance with enterprise procedures. \n4.2 Payments required by the supplier are processed at \nthe appropriate time in accordance with enterprise \nprocedures. \n4.3 Booking changes are relayed to suppliers in \naccordance with agreed procedures and any \ncontractual arrangements. \n4.4 Client’s final details and requirements are finalized with \nsuppliers in accordance with the standard operating \nprocedures. \n4.5 Clients payment are collected and corresponding proof \nof payment is provided in accordance to company \npolicies  and procedures\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n32 \n \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1. Suppliers \nMay either be: \n1.1 \nInternal \n1.2 \nExternal to the organization \n \n2. Travel Services \nMay include: \n2.1 \nDomestic \n2.2 \nInternational \n \n3. Reservations/Bookings May include: \n3.1 \nManually administered \n3.2 \nElectronically administered \n \n4. Customer records \nMay include: \n4.1 \nA computer generated file \n4.2 \nA manual file \n \n5. Products and services \nMay include: \n5.1 \nTransportation \n5.2 \nTransfers \n5.3 \nAccommodations \n5.4 \nEntertainment \n5.5 \nTours \n5.6 \nCruises \n5.7 \nEntrance to attractions or sites \n5.8 \nTourist guiding services \n5.9 \nActivities \n5.10 Meals \n5.11 Functions \n5.12 Special items with customer’s corporate branding \n5.13 Venue bookings \n5.14 Speaker services \n5.15 Audio visual services  \n5.16 Meeting or event equipment \n5.17 Special event consumable items \n5.18 Catering \n5.19 Refund Services \n5.20 Other requirements of the client \n \n6. Communication System May be requested or confirmed thru: \n6.1 \nTelephone \n6.2 \nFax \n6.3 \nEmail \n6.4 \nInternet \n6.5 \nMail/courier service \n6.6 \nComputer Reservation System (CRS) or Global \nDistribution System (GDS)\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08 \nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n33 \n \n7. Confirmation details \nMay include: \n7.1 \nCost \n7.2 \nPayment method and deadline\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08 \nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n34 \n \n \nVARIABLE \nRANGE \n \n7.3 \nSpecial requests \n7.4 \nArrangements \n \n8. Types of \nReservations/Bookings \nMay be made for: \n8.1 \nA single product or service \n8.2 \nMultiple products and services making up a complete \nitinerary \n8.3 \nGroups \n8.4 \nIndividuals \n8.5 \nAd Hoc touring arrangements \n8.6 \nSeries tours \n8.7 \nIncentive tours \n8.8 \nMeetings \n8.9 \nConferences \n8.10 A combination of any of the above  \n \n9. Amendments/ \nadjustments to \nbookings \nMay include: \n9.1 \nCancellation of  booking \n9.2 \nChange of date, time. \n9.3 \nChange of location of commencement and conclusions \nof service. \n9.4 \nReduction or increase in number of  bookings held \n \n10. Final customer details \nMay include: \n10.1 Final numbers for a group booking \n10.2 Arrival and departure flights and times  (or any other \nform of  transportation) \n10.3 Final name list \n10.4 Final rooming list \n10.5 Details of  tourist guides/tour managers/crew \naccompanying customers \n10.6 Itinerary – if packaged tour \n \n11. Documents issued to \ncustomers \nMay include: \n11.1 Invoices \n11.2 Credit notes \n11.3 Receipts \n11.4 Service Voucher/s \n11.5 Tickets (air, sea and land) \n11.6 Travel documents (passports, visas, immigration \nclearances, etc) \n11.7 Insurance Certificates \n11.8 Information packs \n11.9 Travel reminders, itineraries \n \n12. Updating customer/s’ \nfinancial record  \nMay include: \n12.1 Receiving, processing and recording payments \n12.2 Generating and issuing invoices and credit notes for \nchanged arrangements \n12.3 Checking that the customer has fully paid\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08 \nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n35 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of  \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nInterpreted the customer’s requirements correctly and \nconfirmed specific services to the customer. \n1.2 \nCoordinated effectively, the booking process from \ninitial request to finalization of  the booking \n1.3 \nKept records of all bookings made accurately. \n1.4 \nDemonstrated knowledge on industry booking \nsystems and procedures for a range of products and \nservices. (The range of products and services booked \nwill vary according to the industry sector and \nworkplace). \n \n2. Required Knowledge  \n2.1 \nBooking systems and procedures as appropriate to \nthe specific industry sector. \n2.2 \nProduct knowledge as appropriate to specific industry \nsector. \n2.3 \nPrinciples that underpin reservations and booking \nprocedures. \n2.4 \nRelationships between different sectors of  the \ntourism industry in relation to reservations and \nbookings. \n2.5 \nNegotiated costs, contractual arrangements preferred \nsupplier arrangements in place. \n2.6 \nTour components familiarity \n \n3. Required Skills \n3.1 \nInterpretation of the customer’s requirements. \n3.2 \nInterpretation of any quotations previously supplied to \ncustomer. \n3.3 \nDemonstration of skills in booking and coordinating \nsupplier services for multiple and different customer \nsituations and varying products and services (ideally \nas a component of integrated work activity). \n3.4 \nDemonstration of skills within a fully-equipped \nindustry-realistic office environment using appropriate \ncomputers, printers, information programs and \npublications. \n3.5 \nUse of industry-current operational documentation eg. \ndetails of supplier contracts and customer files. \n3.6 \nThe completion of coordination of  bookings and \nmaintenance of  files within timeframes and \nconstraints that reflect typical industry practice. \n3.7 \nCommunication Skills\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08 \nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n36 \n \n4. Resource Implications \nThe following resources should be provided: \n4.1 \nTelephone, fax and email \n4.2 \nComputer with internet connection and reservation \nsystem or global distribution system \n4.3 \nUpdated brochures \n4.4 \nUpdated maps \n4.5 \nUpdated Official Airline Guide or GDS \n4.6 \nUpdated Official Hotels & Resorts Guide or GDS \n4.7 \nOfficial Cruiseline Guide or GDS \n4.8 \nOfficial Train Guide or GDS \n4.9 \nUpdated Destination Travel Planner \n4.10 Tourism Calendar of Conferences & Events \n \n5. Methods of \nAssessment \nCompetency in this unit may be assessed through : \n5.1 \nEvaluation of  integrated activities completed by the \ncandidate (may include destinations, products, \nquotations and ticketing) Simulation/Demonstration \n5.2 \nCase studies to assess ability to complete the \nbooking process for different tourism products, \nservices and customers. \n5.3 \nWritten and oral questioning or interview to test \nknowledge of the principles which underpin booking \nprocedures and the relationship between different \nsectors of the tourism industry. \n5.4 \nReview of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate. \n \n6. Context for \nAssessment \n6.1 \nAssessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 \nAssessment activities are carried out through \nTESDA’s accredited assessment center with the right \nequipment.\n",
