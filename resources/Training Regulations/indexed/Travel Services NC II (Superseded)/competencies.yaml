  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units\nof competency required in TRAVEL SERVICES NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nPARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n500311105\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace information\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking\nskills are used to gather and convey information\n1.3\nAppropriate medium is used to transfer information\nand ideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors\nand colleagues are identified and followed\n1.6\nDefined workplace procedures for the location and\nstorage of information are used\n1.7\nPersonal interaction is carried out clearly and\nconcisely\n\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of\nothers are listened to without interruption\n2.3\nMeeting inputs are consistent with the meeting\npurpose and established protocols\n2.4\nWorkplace interactions are conducted in a\ncourteous manner\n2.5\nQuestions about simple routine workplace procedures\nand maters concerning working conditions of\nemployment are asked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment\nare completed accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace\nforms and documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents\nare identified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1. Team members\n1.2. Suppliers\n1.3. Trade personnel\n1.4. Local government\n1.5. Industry bodies\n\n2. Medium\n2.1. Memorandum\n2.2. Circular\n2.3. Notice\n2.4. Information discussion\n2.5. Follow-up or verbal instructions\n2.6. Face to face communication\n\n3. Storage\n3.1. Manual filing system\n3.2. Computer-based filing system\n\n4. Forms\n4.1. Personnel forms, telephone message forms, safety\nreports\n\n5. Workplace interactions\n5.1. Face to face\n5.2. Telephone\n5.3. Electronic and two way radio\n5.4. Written including electronic, memos, instruction and\nforms, non-verbal including gestures, signals, signs\nand diagrams\n\n6. Protocols\n6.1. Observing meeting\n6.2. Compliance with meeting decisions\n6.3. Obeying meeting instructions\n\n--- PDF PAGE 6 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n4\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using communication equipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the formal\nor informal communication\n\n2. Required Knowledge\n\n2.1. Effective communication\n2.2. Different modes of communication\n2.3. Written communication\n2.4. Organizational policies\n2.5. Communication procedures and systems\n2.6. Technology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Required Skills\n3.1. Follow simple spoken language\n3.2. Perform routine workplace duties following simple\nwritten notices\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Estimate, calculate and record routine workplace\nmeasures\n3.6. Basic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7. Ability to relate to people of social range in the\nworkplace\n3.8. Gather and provide information in response to\nworkplace requirements\n\n4. Resource\nImplications\n4.1. Fax machine\n4.2. Telephone\n4.3. Writing materials\n4.4. Internet\n\n5. Methods of\nAssessment\n5.1. Direct Observation\n5.2. Oral interview and written test\n\n6. Context of\nAssessment\n6.1\nCompetency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 7 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n5\n\nUNIT OF COMPETENCY\n:\nWORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n:\n500311106\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role and\nscope\n1.1. The role and objective of the team is identified from\navailable sources of information\n1.2. Team parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n\n2. Identify own role and\nresponsibility within\nteam\n2.1. Individual role and responsibilities within the team\nenvironment are identified\n2.2. Roles and responsibility of other team members are\nidentified and recognized\n2.3. Reporting relationships within team and external to\nteam are identified\n\n3. Work as a team\nmember\n3.1. Effective and appropriate forms of communications\nused and interactions undertaken with team members\nwho contribute to known team activities and objectives\n3.2. Effective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3. Observed protocols in reporting using standard\noperating procedures\n3.4. Contribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 8 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n6\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1. Work activities in a team environment with enterprise\nor specific sector\n1.2. Limited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n\n2. Sources of information\n2.1. Standard operating and/or other workplace procedures\n2.2. Job procedures\n2.3. Machine/equipment, manufacturer’s specifications and\ninstructions\n2.4. Organizational or external personnel\n2.5. Client/supplier instructions\n2.6. Quality standards\n2.7. OHS and environmental standards\n\n3. Workplace context\n3.1. Work procedures and practices\n3.2. Conditions of work environments\n3.3. Legislation and industrial agreements\n3.4. Standard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5. Safety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 9 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n7\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Operated in a team to complete workplace activity\n1.2. Worked effectively with others\n1.3. Conveyed information in written or oral form\n1.4. Selected and used appropriate workplace language\n1.5. Followed designated work plan for the job\n1.6. Reported outcomes\n\n2. Required Knowledge\n2.1. Communication process\n2.2. Team structure\n2.3. Team roles\n2.4. Group planning and decision making\n\n3. Required Skills\n3.1. Communicate appropriately, consistent with the culture\nof the workplace\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2. Materials relevant to the proposed activity or tasks\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Observation of the individual member in relation to\nthe work activities of the group\n5.2. Observation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3. Case studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n\n6. Context for\nAssessment\n6.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 10 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n8\n\nUNIT OF COMPETENCY\n:\nPRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2\nIntra- and interpersonal relationships are maintained in\nthe course of managing oneself based on performance\nevaluation\n1.3\nCommitment to the organization and its goal is\ndemonstrated in the performance of duties\n\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2\nResources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3\nPractices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified\nand availed of based on job requirements\n3.2\nRecognitions are sought/received and demonstrated\nas proof of career advancement\n3.3\nLicenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 11 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n9\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance Appraisal\n1.2\nPsychological Profile\n1.3\nAptitude Tests\n\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2\nServing as Resource Persons in conferences and\nworkshops\n\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of Appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and Intangible Rewards\n\n5. Licenses and/or\ncertifications\n5.1\nNational Certificates\n5.2\nCertificate of Competency\n5.3\nSupport Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 12 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n10\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3\nCompleted trainings and career opportunities which\nare based on the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n\n2. Required Knowledge\n2.1\nWork values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n\n3. Required Skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 13 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n11\n\nUNIT OF COMPETENCY\n:\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE\n:\n500311108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard\ncontrol practices and procedures are clarified and\nexplained based on organization procedures\n1.2\nHazards/risks in the workplace and their\ncorresponding indicators are identified to minimize or\neliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3\nContingency measures during workplace accidents,\nfire and other emergencies are recognized and\nestablished in accordance with organization\nprocedures\n\n2. Evaluate hazards and\nrisks\n2.1\nTerms of maximum tolerable limits which when\nexceeded will result in harm or damage are identified\nbased on threshold limit values (TLV)\n2.2\nEffects of the hazards are determined\n2.3\nOHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and relevant\nworkplace OHS legislation\n\n3. Control hazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2\nProcedures for dealing with workplace accidents, fire\nand emergencies are followed in accordance with\norganization OHS policies\n3.3\nPersonal protective equipment (PPE) is correctly\nused in accordance with organization OHS procedures\nand practices\n3.4\nAppropriate assistance is provided in the event of a\nworkplace emergency in accordance with established\norganization protocol\n\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2\nOHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 14 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n12\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n\n2. Hazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants,\nparasites, mites, molds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes,\nsmoke, gasses, vapors\n2.4\nErgonomics\n2.4.1 Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n\n3. Contingency measures May include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\nCalling emergency personnel\n\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n\n6. OHS personal records\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 15 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n13\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and\nhazard control practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5\nFollowed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7\nCompleted and updated OHS personal records in\naccordance with workplace requirements\n\n2. Required Knowledge\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n\n3. Required Skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n\n4. Resource Implications\nThe following resources must be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n14\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nDEVELOP AND UPDATE INDUSTRY KNOWLEDGE\n\nUNIT CODE\n\n:\nTRS311201\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nand attitude required to access, increase and update\nindustry knowledge. It includes seek information on the\nindustry and update industry knowledge\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Seek information on\nthe industry\n1.1\nSources of information on the industry are correctly\nidentified and accessed\n1.2\nInformation to assist effective work performance is\nobtained in line with job requirements\n1.3\nSpecific information on sector of work is accessed and\nupdated\n1.4\nIndustry information is correctly applied to day-to-day\nwork activities\n\n2. Update industry\nknowledge\n2.1\nInformal and/or formal research is used to update\ngeneral knowledge of the industry\n2.2\nUpdated knowledge is shared with customers and\ncolleagues as appropriate and incorporated into day-\nto-day working activities\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n15\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information sources\nMay include:\n1.1\nmedia\n1.2\nreference books\n1.3\nlibraries\n1.4\nunions\n1.5\nindustry associations\n1.6\nindustry journals\n1.7\ninternet\n1.8\npersonal observation and experience\n\n2. Information to assist\neffective work\nperformance\n2.1\ndifferent sectors of the industry and the services\navailable in each sector\n2.2\nrelationship between tourism and hospitality\n2.3\nrelationship between the industry and other\nindustries\n2.4\nindustry working conditions\n2.5\nlegislation that affects the industry\n2.5.1 liquor\n2.5.2 health and safety\n2.5.3 hygiene\n2.5.4 gaming\n2.5.5 workers compensation\n2.5.6 consumer protection\n2.5.7 duty of care\n2.5.8 building regulations\n2.6\ntrade unions environmental issues and\nrequirements\n2.7\nindustrial relations issues and major\norganizations\n2.8\ncareer opportunities within the industry\n2.9\nwork ethic required to work in the industry and\nindustry expectations of staff\n2.10 quality assurance\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n16\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nKnew key sources of information on the industry\n1.2\nUpdated industry knowledge\n1.3\nAccessed and used industry information\n\n2. Required Knowledge\n2.1\nOverview of quality assurance in the industry\n2.2\nRole of individual staff members\n2.3\nIndustry information sources\n\n3. Required Skills\n3.1\nTime management\n3.2\nReady skills needed to access industry information\n3.3\nBasic competency skills needed to access the internet\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nSources of information on the industry\n4.2\nIndustry knowledge\n\n5. Methods of\nAssessment\nCompetency in this assessment may be assessed through:\n5.1\nInterview/questions\n5.2\nPractical demonstration\n5.3\nPortfolio of industry information related to trainee’s\nwork\n\n6. Context for\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n17\n\nUNIT OF COMPETENCY\n:\nOBSERVE WORKPLACE HYGIENE PROCEDURES\n\nUNIT CODE\n:\nTRS311202\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nand\nattitudes\nin\nobserving\nworkplace\nhygiene\nprocedures. It includes following hygiene procedures\nand identifying and preventing hygiene risks.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Follow hygiene\nprocedures\n1.1\nWorkplace hygiene procedures are implemented in\nline with enterprise and legal requirements\n1.2\nHandling and storage of items are undertaken in line\nwith enterprise and legal requirements\n\n2. Identify and prevent\nhygiene risks\n2.1\nPotential hygiene risks are identified in line with\nenterprise procedures\n2.2\nAction to minimize and remove risks are taken\nwithin scope of individual responsibility of\nenterprise/legal requirements\n2.3\nHygiene risks beyond the control of individual staff\nmembers are reported to the appropriate person for\nfollow up\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n18\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hygiene procedures\nMay include :\n1.1\nsafe and hygienic handling of food and beverage\n1.2\nregular hand washing\n1.3\ncorrect food storage\n1.4\nappropriate and clean clothing\n1.5\navoidance of cross-contamination\n1.6\nsafe handling disposal of papers & other paper\nproducts\n1.7\nappropriate handling and disposal of garbage\n1.8\ncleaning and sanitizing procedures\n1.9\npersonal hygiene\n\n2. Hygiene risk\n2.1\nbacterial and other contamination arising from poor\nhandling of food\n2.2\ninappropriate storage of foods\n2.3\nstorage at incorrect temperatures\n2.4\nfoods left uncovered\n2.5\npoor personal hygiene practices\n2.6\npoor work practices\n2.6.1 cleaning\n2.6.2 housekeeping\n2.6.3 food handling\n2.6.4 vermin\n2.6.5 airborne dust\n2.7\ncross-contamination through cleaning inappropriate\ncleaning practices\n2.8\ninappropriate handling of potentially infectious linen\n2.9\ncontaminated wastes such as blood and body\nsecretions\n2.10 disposal of garbage and contaminated or potentially\ncontaminated wastes\n\n3. Minimizing or removing\nrisk\n3.1\nauditing staff skills and providing training\n3.2\nensuring policies and procedures are followed strictly\n3.3\naudits or incidents with follow up actions\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n19\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nFollowed hygiene procedures\n1.2\nIdentified and responded to hygiene risk\n1.3\nPracticed personal grooming and hygiene\n\n2. Required Knowledge\n2.1\nTypical hygiene and control procedures in the\nhospitality and tourism industries\n2.2\nOverview of legislation and regulation in relation to\nfood handling, personal and general hygiene\n2.3\nKnowledge on factors which contribute to workplace\nhygiene problems\n2.4\nGeneral hazards in handling of food, linen and laundry\nand garbage, including major causes of contamination\nand cross-infection\n2.5\nSources of and reasons for food poisoning\n\n3. Required Skills\n3.1\nAbility to follow correct procedures and instructions\n3.2\nAbility to handle operating tools/ equipment\n3.3\nApplication to hygiene principles\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nHygiene procedures, actual or simulated workplace,\nproducts used in hotel/restaurant /tourism workplace\n\n5. Methods of\nAssessment\nCompetency in this unit should be assessed through:\n5.1\nWritten examination\n5.2\nPractical demonstration\n\n6. Context for\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n20\n\nUNIT OF COMPETENCY\n:\nPERFORM COMPUTER OPERATIONS\n\nUNIT CODE\n:\nTRS311203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and\nvalues needed to perform computer operations which\nincludes inputting, accessing, producing and transferring\ndata using the appropriate hardware and software\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntask to be undertaken\n1.1\nRequirements of task are determined\n1.2\nAppropriate hardware and software is selected\naccording to task assigned and required outcome\n1.3\nTask is planned to ensure OH & S guidelines and\nprocedures are followed\n\n2. Input data into\ncomputer\n2.1\nData are entered into the computer using appropriate\nprogram/application in accordance with company\nprocedures\n2.2\nAccuracy of information is checked and information is\nsaved in accordance with standard operating\nprocedures\n2.3\nInputted data are stored in storage media according\nto requirements\n2.4\nWork is performed within ergonomic guidelines\n\n3. Access information\nusing computer\n3.1\nCorrect program/application is selected based on job\nrequirements\n3.2\nProgram/application containing the information\nrequired is accessed according to company\nprocedures\n3.3\nDesktop icons are correctly selected, opened and\nclosed for navigation purposes\n3.4\nKeyboard techniques are carried out in line with OH &\nS requirements for safe use of keyboards\n\n4. Produce/output data\nusing computer system\n4.1\nEntered data are processed using appropriate\nsoftware commands\n4.2\nData are printed out as required using computer\nhardware/peripheral devices in accordance with\nstandard operating procedures\n4.3\nFiles and data are transferred between compatible\nsystems using computer software, hardware/\nperipheral devices in accordance with standard\noperating procedures\n\n5. Maintain computer\nequipment and\nsystems\n5.1\nSystems for cleaning, minor maintenance and\nreplacement of consumables are implemented\n5.2\nProcedures for ensuring security of data, including\nregular back-ups and virus checks are implemented in\naccordance with standard operating procedures\n5.3\nBasic file maintenance procedures are implemented in\nline with the standard operating procedures\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n21\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Hardware and\nperipheral devices\n1.1\nPersonal computers\n1.2\nNetworked systems\n1.3\nCommunication equipment\n1.4\nPrinters\n1.5\nScanners\n1.6\nKeyboard\n1.7\nMouse\n\n2. Software\nMay include:\n2.1\nWord processing packages\n2.2\nData base packages\n2.3\nInternet\n2.4\nSpreadsheets\n\n3. OH & S guidelines\n3.1\nOHS guidelines\n3.2\nEnterprise procedures\n\n4. Storage media\nMay include:\n4.1\ndiskettes\n4.2\nCDs\n4.3\nzip disks\n4.4\nhard disk drives, local and remote\n4.5\nusb flash drives\n\n5. Ergonomic guidelines\n5.1\nTypes of equipment used\n5.2\nAppropriate furniture\n5.3\nSeating posture\n5.4\nLifting posture\n5.5\nVisual display unit screen brightness\n\n6. Desktop icons\nMay include:\n6.1\ndirectories/folders\n6.2\nfiles\n6.3\nnetwork devices\n6.4\nrecycle bin\n\n7. Maintenance\n7.1\nCreating more space in the hard disk\n7.2\nReviewing programs\n7.3\nDeleting unwanted files\n7.4\nBacking up files\n7.5\nChecking hard drive for errors\n7.6\nUsing up to date anti-virus programs\n7.7\nCleaning dust from internal and external surfaces\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n22\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nSelected and used hardware components correctly\nand according to the task requirement\n1.2\nIdentified and explain the functions of both hardware\nand software used, their general features and\ncapabilities\n1.3\nProduced accurate and complete data in accordance\nwith the requirements\n1.4\nUsed appropriate devices and procedures to transfer\nfiles/data accurately\n1.5\nMaintained computer system\n2. Required Knowledge\n2.1\nBasic ergonomics of keyboard and computer use\n2.2\nMain types of computers and basic features of\ndifferent operating systems\n2.3\nMain parts of a computer\n2.4\nStorage devices and basic categories of memory\n2.5\nRelevant types of software\n2.6\nGeneral security\n2.7\nViruses\n2.8\nOH & S principles and responsibilities\n2.9\nCalculating computer capacity\n\n3. Required Skills\n3.1\nReading skills required to interpret work instruction\n3.2\nCommunication skills\n4. Methods of\nAssessment\nCompetency in this unit should be assessed through:\n4.1\nObservation\n4.2\nQuestioning\n4.3\nPractical demonstration\n5. Resource Implications\n5.1\nComputer hardware with peripherals\n5.2\nAppropriate software\n6. Context for\nAssessment\n6.1\nAssessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n23\n\nUNIT OF COMPETENCY\n:\nPERFORM WORKPLACE AND SAFETY PRACTICES\n\nUNIT CODE\n:\nTRS311204\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nand attitudes in following health, safety and security\npractices. It includes dealing with emergency situations\nand maintaining safe personal presentation standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Follow workplace\nprocedures for health,\nsafety and security\npractices\n1.1\nCorrect health, safety and security procedures are\nfollowed in line with legislation, regulations and\nenterprise procedures\n1.2\nBreaches of health, safety and security procedures\nare identified and reported in line with enterprise\nprocedure\n1.3\nSuspicious behavior or unusual occurrence are\nreported in line with enterprise procedure\n\n2. Deal with emergency\nsituations\n2.1\nEmergency and potential emergency situations are\nrecognized and appropriate action are taken within\nindividual’s scope of responsibility\n2.2\nEmergency procedures are followed in line with\nenterprise procedures\n2.3\nAssistance is sought from colleagues to resolve or\nrespond to emergency situations\n2.4\nDetails of emergency situations are reported in line\nwith enterprise procedures\n\n3. Maintain safe personal\npresentation standards\n3.1\nSafe personal standards are identified and followed in\nline with enterprise requirements\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n24\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Health, safety and\nsecurity procedures\nMay include:\n1.1\nuse of personal protective clothing and equipment\n1.2\nsafe posture including sitting, standing, bending\n1.3\nmanual handling including lifting, transferring\n1.4\nsafe work techniques including knives and equipment,\nhandling hot surfaces, computers and electronic\nequipment\n1.5\nsafe handling of chemicals, poisons and dangerous\nmaterials\n1.6\nergonomically sound furniture and work stations\n1.7\nemergency fire and accident\n1.8\nhazard identification and control\n1.9\nsecurity of documents, cash, equipment, people\n1.10 key control systems\n\n2. Breaches of procedure\nMay include:\n2.1\nloss of keys\n2.2\nstrange or suspicious persons\n2.3\nbroken or malfunctioning equipment\n2.4\nloss of property, goods or materials\n2.5\ndamaged property or fittings\n2.6\nlack of suitable signage when required\n2.7\nlack of training on health and safety issues\n2.8\nunsafe work practices\n\n3. Emergency\nMay include:\n3.1\npersonal injuries\n3.2\nfire\n3.3\nelectrocution\n3.4\nnatural calamity i.e. earthquake/flood\n3.5\ncriminal acts i.e. robbery\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n25\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nComplied with industry practices and procedures\n1.2\nUsed interactive communication with others\n1.3\nComplied with workplace safety, security and hygiene\npractices\n1.4\nIdentified faults & problems and the necessary\ncorrective action\n1.5\nPromoted public relation among others\n1.6\nComplied with quality standards\n1.7\nResponded to emergency situations in line with\nenterprise guidelines\n1.8\nComplied with proper dress code\n2. Underpinning\nKnowledge and\nAttitude\n2.1\nCommunication\n2.1.1 Interactive communication with others\n2.1.2 Interpersonal skills\n2.1.3 Good working attitude\n2.1.4 Ability to work quietly; with cooperation;\npatience, carefulness, cleanliness and aesthetic\nvalues\n2.1.5 Ability to focus on task at hand\n2.2\nSystems, Processes and Operations\n2.2.1 Workplace health, safety and security\nprocedures\n2.2.2 Emergency procedures\n2.2.3 Personal presentation\n2.3\nSafety Practices\n2.3.1 Proper disposal of garbage\n2.3.2 Practice safety measures\n2.3.3 5S Implementation\n\n3. Underpinning Skills\n3.1\nAbility to make decision\n3.2\nTime management\n3.3\nAbility to offer alternative steps\n3.4\nCare in handling and operating equipment\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nProcedures Manual on safety, security, health and\nemergency\n4.2\nAvailability of tools, equipment, supplies and materials\n\n5. Methods of\nAssessment\nCompetency in this unit should be assessed through:\n5.1 Written examination\n5.1\nPractical demonstration\n5.2\nInterview\n\n6. Context for\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n26\n\nUNIT OF COMPETENCY\n:\nPROVIDE EFFECTIVE CUSTOMER SERVICE\n\nUNIT CODE\n\n:\nTRS311205\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nand attitudes in providing effective customer service. It\nincludes greeting customer, identifying customer needs,\ndelivering service to customer, handling queries through\ntelephone, fax machine, internet and email and handling\ncomplaints, evaluation and recommendation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Greet customer\n1.1\nGuests are greeted in line with enterprise procedure\n1.2\nVerbal and non-verbal communications are\nappropriate to the given situation\n1.3\nNon verbal communication of customer is observed\nresponding to customer\n1.4\nSensitivity to cultural and social differences is\ndemonstrated\n\n2. Identify customer\nneeds\n2.1\nAppropriate interpersonal skills are used to ensure\nthat customer needs are accurately identified\n2.2\nCustomer needs are assessed for urgency so that\npriority for service delivery can be identified\n2.3\nCustomers are provided with information\n2.4\nPersonal limitation in addressing customer needs is\nidentified and where appropriate, assistance is sought\nfrom supervisor\n\n3. Deliver service to\ncustomer\n3.1\nCustomer needs are promptly attended to in line with\nenterprise procedure\n3.2\nAppropriate rapport is maintained with customer to\nenable high quality service delivery\n3.3\nOpportunity to enhance the quality of service and\nproducts are taken wherever possible\n\n4. Handle queries through\ntelephone, fax\nmachine, internet and\nemail\n4.1\nUse telephone, computer, fax machine, internet\nefficiently to determine customer requirements\n4.2\nQueries/ information are recorded in line with\nenterprise procedure\n4.3\nQueries are acted upon promptly and correctly in line\nwith enterprise procedure\n\n5. Handle complaints,\nevaluation and\nrecommendations\n5.1\nGuests are greeted with a smile and eye-to-eye\ncontact\n5.2\nResponsibility for resolving the complaint is taken\nwithin limit of responsibility\n5.3\nNature and details of complaint are established and\nagreed with the customer\n5.4\nAppropriate action is taken to resolve the complaint to\nthe customers satisfaction wherever possible\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n27\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Non-verbal\ncommunication\n1.1\nbody language\n1.2\ndress and accessories\n1.3\ngestures and mannerisms\n1.4\nvoice tonality and volume\n1.5\nuse of space\n1.6\nculturally specific communication customs and\npractices\n\n2. Cultural and social\ndifferences\nIncludes but are not limited to :\n2.1\nmodes of greeting, farewelling and conversation\n2.2\nbody language/use of body gestures\n2.3\nformality of language\n\n3. Interpersonal skills\n3.1\ninteractive communication\n3.2\npublic relation\n3.3\ngood working attitude\n3.4\nsincerity\n3.5\npleasant disposition\n3.6\neffective communication skills\n\n4. Customer needs\nCustomer with specific needs may include :\n4.1\nthose with a disability\n4.2\nthose with special cultural or language needs\n4.3\nunaccompanied children\n4.4\nparents with young children\n4.5\npregnant women\n4.6\nsingle women\n\n5. Enterprise procedure\nProtocol and enterprise procedures may include :\n5.1\nmodes of greeting and farewell\n5.2\naddressing the person by name\n5.3\ntime-lapse before a response\n5.4\nstyle manual requirements\n5.5\nstandard letters and proforma\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n28\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate :\n1.1\nComplied with industry practices and procedures\n1.2\nUsed interactive communication with others\n1.3\nComplied with occupational, health and safety\npractices\n1.4\nPromoted public relation among others\n1.5\nComplied with service manual standards\n1.6\nDemonstrated familiarity with company facilities,\nproducts and services\n1.7\nApplied company rules and standards\n1.8\nApplied telephone ethics\n1.9\nApplied correct procedure in using telephone, fax\nmachine, internet\n1.10 Handled customer complaints\n\n2. Required Knowledge\nand Attitude\n2.1\nCommunication\n2.1.1 Interactive communication with others\n2.1.2 Interpersonal skills/ social graces with sincerity\n2.2\nSafety Practices\n2.2.1 Safe work practices\n2.2.2 Personal hygiene\n2.3\nAttitude\n2.3.1 Attentive, patient and cordial\n2.3.2 Eye-to-eye contact\n2.3.3 Maintain teamwork and cooperation\n2.4\nTheory\n2.4.1 Selling/upselling techniques\n2.4.2 Interview techniques\n2.4.3 Conflict resolution\n2.4.4 Communication process\n2.4.5 Communication barriers\n\n3. Required Skills\n3.1\nEffective communication skills\n3.2\nNon-verbal communication - body language\n3.3\nGood time management\n3.4\nAbility to work calmly and unobtrusively effectively\n3.5\nAbility to handle telephone inquiries and conversations\n3.6\nCorrect procedure in handling telephone inquiries\n3.7\nProper way of handling complaints\n\n4. Resource Implications\n4.1\nAvailability of telephone, fax machine, internet, GDS,\netc.\n4.2\nAvailability of data on projects and services; tariff and\nrates, promotional activities in place etc.\n4.3\nAvailability of office supplies\n\n5. Methods of\nAssessment\n5.1\nWritten examination\n5.2\nPractical demonstration\n\n6. Context for\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n29\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nCREATE TRAVEL-RELATED RESERVATIONS AND\nTRANSACTIONS\n\nUNIT CODE\n:\nTRS5113119\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the skills and knowledge required to\nmake and administer bookings for tourism or hospitality\nproducts and services. It describes the coordination of\nbookings with suppliers, normally a business to\nbusiness transaction.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Administer client file\nand identify booking\nrequirements\n1.1\nCustomers records of new or existing booking\nrequirements are interpreted or created\n1.2\nCustomers’ required document and other materials are\nprepared and issued.\n1.3\nCustomer’s records of the financial status are\naccurately updated in accordance with enterprise\nprocedures.\n1.4\nSupplier’s services to be booked are identified\naccording to the customer’s requirements and\nrequests.\n1.5\nDetails of specific products and services which have\nbeen sold are identified and confirmed to the\ncustomer.\n1.6\nWhere no specific product/s or service/s has been\nconfirmed to the customer, appropriate suppliers are\nselected to ensure customer needs are met according\nto prices quoted.\n1.7\nSupplier is selected according to any pre-negotiated\nenterprise arrangements.\n\n2. Request services\n2.1 Products and services are requested from suppliers\nusing the appropriate method in accordance with\nenterprise procedures.\n2.2 Details of the required booking are provided to ensure\nthe customer receives the correct product or service\nincluding:\n2.2.1 Customer details\n2.2.2 Inclusive date, time and location of\ncommencement and conclusion of service\n2.2.3 Any pre-negotiated costs and payment detail\n2.2.4 Nature of service to be provided\n2.2.5 Special request or requirements\n2.3 Multiple services are requested in the most practical\nand sequential order.\n2.4 Alternative choices are requested if desired bookings\nare not available\n2.5 Changes made to original bookings are identified and\naction flow-on impacts are adjusted accordingly\n2.6 Revisions to bookings are made as requested/required\nincluding adjustment to other arrangements,\naccordingly\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n30\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n31\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Record request and\nconfirmation\n3.1 Records of all bookings made are kept including\nrequests and confirmations then filed in accordance\nwith company policies and procedures.\n3.2 Files are monitored to ensure that all confirmations\nhave been received and follow up pending\nbookings/reservations.\n3.3 Actions to be taken in relation to bookings are noted\nand scheduled in accordance with system and/or\ncompany policies and procedures.\n\n4. Update and finalize\nbookings\n4.1 Amendments/adjustments made are accurately\nrecorded in accordance with enterprise procedures.\n4.2 Payments required by the supplier are processed at\nthe appropriate time in accordance with enterprise\nprocedures.\n4.3 Booking changes are relayed to suppliers in\naccordance with agreed procedures and any\ncontractual arrangements.\n4.4 Client’s final details and requirements are finalized with\nsuppliers in accordance with the standard operating\nprocedures.\n4.5 Clients payment are collected and corresponding proof\nof payment is provided in accordance to company\npolicies and procedures\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n32\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Suppliers\nMay either be:\n1.1\nInternal\n1.2\nExternal to the organization\n\n2. Travel Services\nMay include:\n2.1\nDomestic\n2.2\nInternational\n\n3. Reservations/Bookings May include:\n3.1\nManually administered\n3.2\nElectronically administered\n\n4. Customer records\nMay include:\n4.1\nA computer generated file\n4.2\nA manual file\n\n5. Products and services\nMay include:\n5.1\nTransportation\n5.2\nTransfers\n5.3\nAccommodations\n5.4\nEntertainment\n5.5\nTours\n5.6\nCruises\n5.7\nEntrance to attractions or sites\n5.8\nTourist guiding services\n5.9\nActivities\n5.10 Meals\n5.11 Functions\n5.12 Special items with customer’s corporate branding\n5.13 Venue bookings\n5.14 Speaker services\n5.15 Audio visual services\n5.16 Meeting or event equipment\n5.17 Special event consumable items\n5.18 Catering\n5.19 Refund Services\n5.20 Other requirements of the client\n\n6. Communication System May be requested or confirmed thru:\n6.1\nTelephone\n6.2\nFax\n6.3\nEmail\n6.4\nInternet\n6.5\nMail/courier service\n6.6\nComputer Reservation System (CRS) or Global\nDistribution System (GDS)\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n33\n\n7. Confirmation details\nMay include:\n7.1\nCost\n7.2\nPayment method and deadline\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n34\n\nVARIABLE\nRANGE\n\n7.3\nSpecial requests\n7.4\nArrangements\n\n8. Types of\nReservations/Bookings\nMay be made for:\n8.1\nA single product or service\n8.2\nMultiple products and services making up a complete\nitinerary\n8.3\nGroups\n8.4\nIndividuals\n8.5\nAd Hoc touring arrangements\n8.6\nSeries tours\n8.7\nIncentive tours\n8.8\nMeetings\n8.9\nConferences\n8.10 A combination of any of the above\n\n9. Amendments/\nadjustments to\nbookings\nMay include:\n9.1\nCancellation of booking\n9.2\nChange of date, time.\n9.3\nChange of location of commencement and conclusions\nof service.\n9.4\nReduction or increase in number of bookings held\n\n10. Final customer details\nMay include:\n10.1 Final numbers for a group booking\n10.2 Arrival and departure flights and times (or any other\nform of transportation)\n10.3 Final name list\n10.4 Final rooming list\n10.5 Details of tourist guides/tour managers/crew\naccompanying customers\n10.6 Itinerary – if packaged tour\n\n11. Documents issued to\ncustomers\nMay include:\n11.1 Invoices\n11.2 Credit notes\n11.3 Receipts\n11.4 Service Voucher/s\n11.5 Tickets (air, sea and land)\n11.6 Travel documents (passports, visas, immigration\nclearances, etc)\n11.7 Insurance Certificates\n11.8 Information packs\n11.9 Travel reminders, itineraries\n\n12. Updating customer/s’\nfinancial record\nMay include:\n12.1 Receiving, processing and recording payments\n12.2 Generating and issuing invoices and credit notes for\nchanged arrangements\n12.3 Checking that the customer has fully paid\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n35\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nInterpreted the customer’s requirements correctly and\nconfirmed specific services to the customer.\n1.2\nCoordinated effectively, the booking process from\ninitial request to finalization of the booking\n1.3\nKept records of all bookings made accurately.\n1.4\nDemonstrated knowledge on industry booking\nsystems and procedures for a range of products and\nservices. (The range of products and services booked\nwill vary according to the industry sector and\nworkplace).\n\n2. Required Knowledge\n2.1\nBooking systems and procedures as appropriate to\nthe specific industry sector.\n2.2\nProduct knowledge as appropriate to specific industry\nsector.\n2.3\nPrinciples that underpin reservations and booking\nprocedures.\n2.4\nRelationships between different sectors of the\ntourism industry in relation to reservations and\nbookings.\n2.5\nNegotiated costs, contractual arrangements preferred\nsupplier arrangements in place.\n2.6\nTour components familiarity\n\n3. Required Skills\n3.1\nInterpretation of the customer’s requirements.\n3.2\nInterpretation of any quotations previously supplied to\ncustomer.\n3.3\nDemonstration of skills in booking and coordinating\nsupplier services for multiple and different customer\nsituations and varying products and services (ideally\nas a component of integrated work activity).\n3.4\nDemonstration of skills within a fully-equipped\nindustry-realistic office environment using appropriate\ncomputers, printers, information programs and\npublications.\n3.5\nUse of industry-current operational documentation eg.\ndetails of supplier contracts and customer files.\n3.6\nThe completion of coordination of bookings and\nmaintenance of files within timeframes and\nconstraints that reflect typical industry practice.\n3.7\nCommunication Skills\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n36\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nTelephone, fax and email\n4.2\nComputer with internet connection and reservation\nsystem or global distribution system\n4.3\nUpdated brochures\n4.4\nUpdated maps\n4.5\nUpdated Official Airline Guide or GDS\n4.6\nUpdated Official Hotels & Resorts Guide or GDS\n4.7\nOfficial Cruiseline Guide or GDS\n4.8\nOfficial Train Guide or GDS\n4.9\nUpdated Destination Travel Planner\n4.10 Tourism Calendar of Conferences & Events\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through :\n5.1\nEvaluation of integrated activities completed by the\ncandidate (may include destinations, products,\nquotations and ticketing) Simulation/Demonstration\n5.2\nCase studies to assess ability to complete the\nbooking process for different tourism products,\nservices and customers.\n5.3\nWritten and oral questioning or interview to test\nknowledge of the principles which underpin booking\nprocedures and the relationship between different\nsectors of the tourism industry.\n5.4\nReview of portfolios of evidence and third party\nworkplace reports of on-the-job performance by the\ncandidate.\n\n6. Context for\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through\nTESDA’s accredited assessment center with the right\nequipment.\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n37\n\nUNIT OF COMPETENCY\n:\nPROVIDE ASSISTANCE IN TRAVEL\nDOCUMENTATION PREPARATION\n\nUNIT CODE\n:\nTRS5113120\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the skills and knowledge required to\nassist clients in preparation of travel documents ie\npassport, visa, immigration papers in preparation for\ntravel abroad.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare and assist\nclient’s passport\napplication\n1.1\nInformation and documentary requirements of client’s\npassport application is collated in accordance with\ncompany policies and procedures and appropriate\nnational and foreign government authorities\n1.2\nPassport application documents are checked for\naccuracy, completeness and identified discrepancies\nare corrected or referred to client where necessary\n1.3\nPassport application documents are filed with proper\nauthorities/DFA and corresponding fees are paid\n1.4\nNew passport is claimed from appropriate national and\nforeign government authorities within same day of\nrelease\n1.5\nPassport is logged and released to client according to\ntravel agency policies and procedures\n\n2. Assist client in securing\nvisa and/or permits for\ncountry of destination\nand transit points, as\napplicable\n2.1\nVisa requirements for client’s country of destination\nare determined\n2.2\nVisa applicant is informed on the requirements and\nfees required by preferred country of destination\n2.3\nWhere applicable, visa applicant is assisted in paying\nthe fees, securing appointments and in filling up and\nsubmitting the accomplished forms required by the\ncountry of destination and/or transit points\n2.4\nVisa documentary requirements are prepared\naccording to the requirements of the country of\ndestination\n2.5\nVisa applicant is informed of the date of personal\nappearance or interview at the Embassy, if applicable\n2.6\nVisa applicant is informed on procedures on how and\nwhen the visa is to be released by the Embassy\n2.7\nVisa is logged and released to client according to\ntravel agency policies and procedures\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n38\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Assist client’s in\nsecuring immigration\nclearance application\nfor travel abroad\n3.1\nImmigration clearance requirements are inquired and\ndetermined from the Immigration department\n3.2\nImmigration clearance applicant is assisted in paying the\nfees and in filling up forms required by the immigration\ndepartment\n3.3\nImmigration clearance documentary requirements are\nprepared according to the requirements of the immigration\ndepartment\n3.4\nImmigration clearance applicant is informed on procedures\non how and when is the clearance to be released by the\nimmigration department\n3.5\nImmigration clearance document is logged and released\nto client according to travel agency policies and procedures\n\n4. Provide assistance in\nsecuring additional\nrequirements for travel\n4.1\nNecessary additional travel documents requirements for\nvisitors, OFWs, minors etc. are inquired and determined\n4.2\nApplicant is assisted in paying the fees and in filling up\nforms required by the immigration department\n4.3\nDocumentary requirements are prepared according to the\nrequirements for travel\n4.4\nApplicant is informed on procedures on how and when is\nthe required travel documents to be released by the\nimmigration department\n4.5\nDocument is logged and released to client according to\ntravel agency policies and procedures\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n39\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Passport\nMay be for:\n1.1 Filipinos\n1.2 Resident Foreign Nationals\n\n2. Visa\nMay include:\n2.1\nWorldwide destination\n2.2\nTourist\n2.3\nTemporary Visitors\n2.4\nBusinessman\n2.5\nStudents\n\n3. Immigration\nDocumentation\nMay include\n3.1\nTravel Exit clearance & reentry permit\n3.2\nExtension of visa\n3.3\nApplication of change of visa status\n3.4\nAnnual Registration of foreign nationals\n3.5\nApplication of I-Card\n3.6\nTravel clearance for person with the same name\n3.7\nApplication of extension of reentry permit\n3.8\nPayment of Head tax\n\n4. Additional travel\ndocuments\n4.1\nDSWD clearance\n4.2\nCourt clearance\n4.3\nCFO (Commission on Filipinos Overseas)\n4.4\nPOEA clearance\n4.5\nNBI clearance\n4.6\nBureau of Quarantine vaccination card\n4.7\nAnd other similar government agencies\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n40\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of passport requirements and\nprocedures\n1.2\nDemonstrate knowledge of visa documentation\nrequirements and procedure\n1.3\nDemonstrate knowledge of Immigration Exit clearance and\nReentry permit procedure and other Immigration procedure\nrequirements .\n1.4\nDemonstrated ability to correctly apply DFA, Embassies,\nand Bureau of Immigration rules and procedures within\nenterprise acceptable timeframes.\n1.5\nDemonstrated ability to assist clients in acquiring travel\ndocuments within the soonest time before date of travel\n2. Required Knowledge\n2.1\nRole of DFA, Embassies, Bureau of Quarantine, TIEZA &\nBureau of Immigration in international travel\n2.2\nDFA, Embassies, Bureau of Quarantine, TIEZA & Bureau\nof Immigration agency accreditation requirements.\n2.3\nDFA, Embassies, Bureau of Quarantine, TIEZA & Bureau\nof Immigration procedures\n2.4\nDFA, Embassies, Bureau of Quarantine, TIEZA & Bureau\nof Immigration timeframes.\n2.5\nDFA, Embassies, Bureau of Quarantine, TIEZA & Bureau\nof Immigration documentation.\n2.6\nGeneral understanding of travel documentation\nprocedures.\n2.7\nBasic and advanced geography and airline geography\n3. Required Skills\n3.1\nTravel documentation handling\n3.2\nApplication of Department of Foreign Affairs, Embassies,\nBureau of Quarantine, TIEZA and Bureau of Immigration\nprocedures within enterprise acceptable timeframes and\nother relevant agencies/ authorities\n3.3\nCorrect pronunciation of destination\n3.4\nComputer operation (GDS) literacy\n3.5\nCommunication skills\n4. Resource implications\nThe following resources should be provided:\n4.1\nTelephone, fax, e-mail\n4.2\nComputer reservations system or global distribution\nsystem, internet connection\n4.3\nTimatic/Maps and updated Atlas\n4.4\nUpdated PTAA Outbound Travel Operations Manual\n5. Methods of Assessment\nCompetency may be assessed through:\n5.1\nWritten exercises, quizzes and tests of DFA, Embassies, Bureau\nof Quarantine, TIEZA and Bureau of Immigration procedures\n5.2\nReview of DFA, Embassies, Bureau of Quarantine, TIEZA and\nBureau of Immigration application forms, actual or facsimile\n5.3\nWritten and oral questioning or interview to test knowledge of\nrules and procedures applicable to the completion of DFA,\nEmbassies, Bureau of Quarantine, TIEZA and Bureau of\nImmigration documents\n5.4\nReview of portfolios of evidence and third party workplace reports\nof on-the-job performance by the candidate\n5.5\nHands on assessment on the knowledge of flight reservation\nusing a GDS\n6. Context for Assessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA’s\naccredited assessment center with the right assessment\nequipment.\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n41\n\nUNIT OF COMPET ENCY\n:\nISSUE INFORMATION ON INTERNATIONAL AIR\nTRANSPORT ASSOCIATION (IATA)-BILLING\nSETTLEMENT PLAN (BSP) DOCUMENTS AND\nOTHER PASSAGE DOCUMENTS\n\nUNIT CODE\n:\nTRS5113121\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge and skills required\nregarding review of travel documents and Issuance and\npayment of tickets and Multi Purpose Documents\n(MPD), tour order, tour vouchers, exchange order,\npurchase order, booking request and other vouchers\nissued for inbound and outbound travel.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Gather the necessary\ninformation and other\ntravel related data\n1.1\nInformation are recorded as received\n1.2\nTravel data are encoded through electronic or manual\nmeans\n1.3\nTravel data are validated with clients and any other\ntravel related information in accordance with company\nprocedures\n1.4\nSupplementary information recorded and cleared with\nclient in accordance to company procedures\n\n2. Perform sales and\nservice tasks\n2.1\nTotal cost of travel requirements are calculated based\non updated local or International rates\n2.2\nInformation, are forwarded to the travel counselor in\naccordance with the company procedures\n\n3. Issue tickets, Multi\nPurpose Documents\n(MPD) and other travel\nrelated documents\n3.1\nInformation are inputted through automated system\nsuch as Computer Reservation System (CRS) or\nGlobal Distribution System (GDS), etc.\n3.2\nInformation are inputted manually in the absence of\nany computerized system\n3.3\nTickets are written manually or generated through\nautomated system in accordance with supplier and\ncompany procedures\n\n4. Network for latest fare\nand tariff information\n4.1\nAll travel rules and travel related services are\ndetermined and documented in accordance with\nsupplier and company procedures\n4.2\nTariff rules and regulations are gathered and\nimplemented in accordance with supplier and\ncompany procedures\n4.3\nSchedule of fare / fees are obtained from airlines and\nother suppliers\n4.4\nInformation on International Air Transport Association\n(IATA) tariff, billing and settlement plans are obtained\nand documented for schedule of remittance and\npapers\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n42\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information\nMay include:\n1.1\nCompany name\n1.2\nFirst Name\n1.3\nMiddle Initial / Name\n1.4\nLast Name\n1.5\nTitle of the passenger (Mr., Ms., Mrs., Mstr., Mist., Inf)\n1.6\nAddress\n1.7\nDate of Birth\n1.8\nBirthplace\n1.9\nGender\n1.10 Telephone Number\n1.11 Zip Code\n1.12 Age\n1.13 Type of passenger\n1.14 Overseas Filipino Workers (OFW)\n1.15 Number of passenger\n1.16 Senior Citizen\n1.17 Language\n1.18 Medical\n1.19 Dietary requirement\n1.20 Residency status\n1.21 Nationality\n1.22 Passport Number, validity, date & place of issuance\n1.23 Visa\n1.24 Handicap\n\n2. Travel data\nMay include:\n2.1\nFlight or Voyage Number\n2.2\nEstimated Time of Departure (ETD) & Arrival (ETA)\n2.3\nDate of flight / departure\n2.4\nTime of flight / departure\n2.5\nPlace of origin\n2.6\nPlace of destination\n2.7\nType of booking class / services\n2.8\nType of equipment used\n2.9\nMeals served on board\n2.10 Elapse Time of travel\n2.11 Type of aircraft/ship/vehicle use\n\n3. Tickets\n3.1\nFares – Adult, Child, Infant, Senior Citizen\n3.1.1 First Class, booking class, refundability,\nendorsability, restrictions and validity\n3.1.2 Business Class, booking class, refundability,\nendorsability restrictions and validity\n3.1.3 Economy Class, booking class, refundability,\nendorsability, restrictions and validity\n3.1.4 Promo Fares, booking class, refundability,\nendorsability, restrictions and validity\n3.2\nAir\n3.3\nSea\n3.4\nLand\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n43\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPerformed sales and service tasks\n1.2\nIssued tickets, Multi Purpose Documents (MPD) and\nother travel related documents\n1.3\nObtained information on International Air Transport\nAssociation (IATA) tariff of different carriers, billing and\nsettlement plans\n\n2. Required Knowledge\nand Attitude\n2.1\nSystems, Processes and Operations\n2.1.1 Travel document requirements eg. Passport,\nvisa & immigration clearances\n2.1.2 In-flight services\n2.1.3 Option date for ticketing\n2.1.4 Reservations and ticketing and payment\n2.1.5 Amendment Restrictions and Cancellation\ncharges\n2.1.6 Baggage allowance\n2.2\nCodes and Regulations\n2.2.1 Filipnos & Foreign nationals requirements for\nvisa\\ and immigration clearances\n2.2.2 Types of Booking Class / services\n2.2.3 Types of rooms, cabins, seats and menu,\nvehicle models\n\n3. Required Skills\n3.1\nEffective use of telephone, telefax, computer\nreservation system or global distribution system,\ninternet and email\n3.2\nEffective communication skills\n3.3\nNetworking for latest fares and tariff information\n3.4\nCommunication Skills\n3.5\nComputer (GDS) operation\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nTelephone, fax, computer reservation system or\nglobal distribution system, internet and e – mail\n4.2\nUpdated IATA Ticketing Manual\n4.3\nUpdated IATA Travel Agents’ Manual\n4.4\nUpdated Cruise line Guide or GDS\n4.5\nUpdated Official Airline Guide or GDS\n4.6\nUpdated Train Guide or GDS\n4.7\nUpdated PTAA Outbound Travel Manual\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nWritten test\n5.2\nDemonstration\n5.3\nPortfolios of evidence and third party workplace\nreports of on-the-job performance by the candidate\n\n6. Context for\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through\nTESDA’s accredited assessment center\n\n--- PDF PAGE 46 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n44"
