        "evidence_guide": {
          "source_text": "1. Critical aspects of  \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nInterpreted the customer’s requirements correctly and \nconfirmed specific services to the customer. \n1.2 \nCoordinated effectively, the booking process from \ninitial request to finalization of  the booking \n1.3 \nKept records of all bookings made accurately. \n1.4 \nDemonstrated knowledge on industry booking \nsystems and procedures for a range of products and \nservices. (The range of products and services booked \nwill vary according to the industry sector and \nworkplace). \n \n2. Required Knowledge  \n2.1 \nBooking systems and procedures as appropriate to \nthe specific industry sector. \n2.2 \nProduct knowledge as appropriate to specific industry \nsector. \n2.3 \nPrinciples that underpin reservations and booking \nprocedures. \n2.4 \nRelationships between different sectors of  the \ntourism industry in relation to reservations and \nbookings. \n2.5 \nNegotiated costs, contractual arrangements preferred \nsupplier arrangements in place. \n2.6 \nTour components familiarity \n \n3. Required Skills \n3.1 \nInterpretation of the customer’s requirements. \n3.2 \nInterpretation of any quotations previously supplied to \ncustomer. \n3.3 \nDemonstration of skills in booking and coordinating \nsupplier services for multiple and different customer \nsituations and varying products and services (ideally \nas a component of integrated work activity). \n3.4 \nDemonstration of skills within a fully-equipped \nindustry-realistic office environment using appropriate \ncomputers, printers, information programs and \npublications. \n3.5 \nUse of industry-current operational documentation eg. \ndetails of supplier contracts and customer files. \n3.6 \nThe completion of coordination of  bookings and \nmaintenance of  files within timeframes and \nconstraints that reflect typical industry practice. \n3.7 \nCommunication Skills\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08 \nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n36 \n \n4. Resource Implications \nThe following resources should be provided: \n4.1 \nTelephone, fax and email \n4.2 \nComputer with internet connection and reservation \nsystem or global distribution system \n4.3 \nUpdated brochures \n4.4 \nUpdated maps \n4.5 \nUpdated Official Airline Guide or GDS \n4.6 \nUpdated Official Hotels & Resorts Guide or GDS \n4.7 \nOfficial Cruiseline Guide or GDS \n4.8 \nOfficial Train Guide or GDS \n4.9 \nUpdated Destination Travel Planner \n4.10 Tourism Calendar of Conferences & Events \n \n5. Methods of \nAssessment \nCompetency in this unit may be assessed through : \n5.1 \nEvaluation of  integrated activities completed by the \ncandidate (may include destinations, products, \nquotations and ticketing) Simulation/Demonstration \n5.2 \nCase studies to assess ability to complete the \nbooking process for different tourism products, \nservices and customers. \n5.3 \nWritten and oral questioning or interview to test \nknowledge of the principles which underpin booking \nprocedures and the relationship between different \nsectors of the tourism industry. \n5.4 \nReview of portfolios of evidence and third party \nworkplace reports of on-the-job performance by the \ncandidate. \n \n6. Context for \nAssessment \n6.1 \nAssessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 \nAssessment activities are carried out through \nTESDA’s accredited assessment center with the right \nequipment.",
