        "source_text": "--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08 \nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n41 \n \nUNIT OF COMPET ENCY \n: \nISSUE INFORMATION ON INTERNATIONAL AIR \nTRANSPORT ASSOCIATION (IATA)-BILLING \nSETTLEMENT PLAN (BSP) DOCUMENTS AND \nOTHER PASSAGE DOCUMENTS  \n \nUNIT CODE \n: \nTRS5113121 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the knowledge and skills required \nregarding review of  travel documents and Issuance and \npayment of  tickets and Multi Purpose Documents \n(MPD), tour order, tour vouchers, exchange order, \npurchase order, booking request and other vouchers \nissued for inbound and outbound travel. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Gather the necessary \ninformation and other \ntravel related data \n1.1 \nInformation are recorded as received \n1.2 \nTravel data are encoded through electronic or manual \nmeans \n1.3 \nTravel data are validated with clients and any other \ntravel related information in accordance with company \nprocedures \n1.4 \nSupplementary information recorded and cleared with \nclient in accordance to company procedures \n \n2.  Perform sales and \nservice tasks \n2.1 \nTotal cost of travel requirements are calculated based \non updated local or International rates \n2.2 \nInformation, are forwarded to the travel counselor in \naccordance with the company procedures \n \n3.  Issue tickets, Multi \nPurpose Documents \n(MPD) and other travel \nrelated documents \n3.1 \nInformation are inputted through automated system \nsuch as Computer Reservation System (CRS) or \nGlobal Distribution System (GDS), etc. \n3.2 \nInformation are inputted manually in the absence of  \nany computerized system \n3.3 \nTickets are written manually or generated through \nautomated system in accordance with supplier and \ncompany procedures \n \n4.  Network for latest fare \nand tariff information \n4.1 \nAll travel rules and travel related services are \ndetermined and documented in accordance with \nsupplier and company procedures \n4.2 \nTariff rules and regulations are gathered and \nimplemented in accordance with supplier and \ncompany procedures \n4.3 \nSchedule of  fare / fees are obtained from airlines and \nother suppliers \n4.4 \nInformation on International Air Transport Association \n(IATA) tariff, billing and settlement plans are obtained \nand documented for schedule of  remittance and \npapers\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08 \nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n42 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Information  \nMay include: \n1.1 \nCompany name \n1.2 \nFirst Name \n1.3 \nMiddle Initial / Name \n1.4 \nLast Name \n1.5 \nTitle of the passenger (Mr., Ms., Mrs., Mstr., Mist., Inf) \n1.6 \nAddress \n1.7 \nDate of Birth \n1.8 \nBirthplace \n1.9 \nGender \n1.10 Telephone Number \n1.11 Zip Code \n1.12 Age \n1.13 Type of  passenger \n1.14 Overseas Filipino Workers (OFW) \n1.15 Number of  passenger \n1.16 Senior Citizen \n1.17 Language \n1.18 Medical \n1.19 Dietary requirement \n1.20 Residency status \n1.21 Nationality \n1.22 Passport Number, validity, date & place of issuance \n1.23 Visa \n1.24 Handicap \n \n2.  Travel data  \nMay include: \n2.1 \nFlight or Voyage Number \n2.2 \nEstimated Time of Departure (ETD) &  Arrival (ETA) \n2.3 \nDate of flight / departure \n2.4 \nTime of  flight / departure \n2.5 \nPlace of  origin \n2.6 \nPlace of  destination \n2.7 \nType of  booking class / services \n2.8 \nType of equipment used \n2.9 \nMeals served on board \n2.10 Elapse Time of travel \n2.11 Type of aircraft/ship/vehicle use \n \n3. Tickets \n3.1 \nFares – Adult, Child, Infant, Senior Citizen \n3.1.1 First Class, booking class, refundability, \nendorsability,  restrictions and validity \n3.1.2 Business Class, booking class, refundability, \nendorsability restrictions and validity \n3.1.3 Economy Class, booking class, refundability, \nendorsability, restrictions and validity \n3.1.4 Promo Fares, booking class, refundability, \nendorsability, restrictions and validity \n3.2 \nAir \n3.3 \nSea \n3.4 \nLand\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08 \nTR - TRAVEL SERVICES NC II  (Amended)                               Promulgated December 2013 \n43 \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPerformed sales and service tasks \n1.2 \nIssued tickets, Multi Purpose Documents (MPD) and \nother travel related documents \n1.3 \nObtained information on International Air Transport  \nAssociation (IATA) tariff of different carriers, billing and \nsettlement plans \n \n2.  Required Knowledge \nand Attitude \n2.1 \nSystems, Processes and Operations \n2.1.1 Travel document requirements eg. Passport, \nvisa & immigration clearances \n2.1.2 In-flight services \n2.1.3 Option date for ticketing \n2.1.4 Reservations and ticketing and payment \n2.1.5 Amendment Restrictions and Cancellation \ncharges \n2.1.6 Baggage allowance \n2.2 \nCodes and Regulations \n2.2.1 Filipnos & Foreign nationals requirements for \nvisa\\ and immigration clearances \n2.2.2 Types of  Booking Class / services \n2.2.3 Types of rooms, cabins, seats and menu, \nvehicle models   \n \n3.  Required Skills \n3.1 \nEffective use of  telephone, telefax, computer \nreservation system or global distribution system,   \ninternet and email  \n3.2 \nEffective communication skills \n3.3 \nNetworking for latest fares and tariff information \n3.4 \nCommunication Skills \n3.5 \nComputer (GDS) operation \n \n4. Resource Implications \nThe following resources should be provided: \n4.1 \nTelephone, fax, computer reservation system or \nglobal distribution system, internet and e – mail \n4.2 \nUpdated IATA Ticketing Manual \n4.3 \nUpdated IATA Travel Agents’ Manual \n4.4 \nUpdated Cruise line Guide or GDS \n4.5 \nUpdated Official Airline Guide or GDS \n4.6 \nUpdated Train Guide or GDS \n4.7 \nUpdated PTAA Outbound Travel Manual \n \n5. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1 \nWritten test  \n5.2 \nDemonstration \n5.3 \nPortfolios of evidence and third party workplace \nreports of on-the-job performance by the candidate \n \n6. Context for  \nAssessment \n6.1 \nAssessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 \nAssessment activities are carried out through \nTESDA’s accredited assessment center\n",
