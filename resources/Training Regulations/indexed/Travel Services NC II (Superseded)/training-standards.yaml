    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: TRAVEL SERVICES\n\nNC Level: NC II\n\nNominal Training Duration:\n28 Hrs. (Basic)\n28 Hrs. (Common)\n272 Hrs. (Core)\n\n 328 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of tour servicing in accordance with industry standards. It covers\nspecialized competencies such as; facilitate Issuance of travel documents; and arrange\nand make reservations for travel related services. It covers the basic, common and core\ncompetencies.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n\nGroup discussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Work in a\nteam\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\n\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n3. Practice\ncareer\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development\n\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\n\nDiscussion\nPlant tour\nSymposium\nObservation\nInterview\n\n--- PDF PAGE 47 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n45\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate\nindustry\nknowledge\n1.1 Seek information on the\nindustry\n2.1 Update continuously\nrelevant industry\nknowledge\n\nLecture\nGroup Discussion\nIndividual/Group\nAssignment\n\nInterviews/\nQuestioning\nIndividual/Group\nProject or\nReport\n2. Observe\nworkplace\nhygiene\nprocedures\n2.1 Follow hygiene\nprocedures\n2.2 Identify and prevent\nhygiene risk\nLecture\nDemonstration\nRole-play\nDemonstration\nWritten\nExamination\nInterviews/\nQuestioning\n\n3. Perform\ncomputer\noperations\n3.1 Plan and prepare task to\nbe undertaken\n3.2 Input data into a\ncomputer\n3.3 Assess information using\ncomputer\n3.4 Produce/ output data\nusing computer system\n3.5 Maintain computer\nsystem\n\nLecture\nGroup Discussion\nTutorial or self-\npace\n\nInterviews/\nQuestioning\nDemonstration\nObservation\n4. Perform\nworkplace and\nsafety practices\n4.1 Practice workplace\nprocedures for health,\nsafety and security\npractices\n4.2 Deal with emergency\nsituations\n4.3 Maintain safe personal\npresentation standards\n\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nWritten\nExamination\n5. Provide\neffective\ncustomer\nservice\n5.1 Greet customers\n5.2 Identify customer needs\n5.3 Deliver service to\ncustomer\n5.4 Handle queries through\ntelephone, fax machine,\ninternet and email\n5.5 Handle complaints,\nevaluation and\nrecommendations\n\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nObservation\n\n--- PDF PAGE 48 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n46\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Create travel-\nrelated\nreservations\nand\ntransactions\n1.1 Administer client file and\nidentify booking\nrequirements\n1.2 Request services\n1.3 Record request and\nconfirmation\n1.4 Update and finalize\nbookings\n• Demonstration\n• Discussion\n• Lectures\n• Supervised\nIndustry\nTraining (SIT)\n• Hands On\nTraining in\nLaboratory\n\n• Written\nexamination\nper subject\n• Demonstration\nof practical\nskills\n• Individual/\nG