    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Travel Services NC II.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: TRAVEL SERVICES\n\nNC Level: NC II\n\nNominal Training Duration:\n28 Hrs. (Basic)\n28 Hrs. (Common)\n272 Hrs. (Core)\n\n 328 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of tour servicing in accordance with industry standards. It covers\nspecialized competencies such as; facilitate Issuance of travel documents; and arrange\nand make reservations for travel related services. It covers the basic, common and core\ncompetencies.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n\nGroup discussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Work in a\nteam\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\n\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n3. Practice\ncareer\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development\n\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\n\nDiscussion\nPlant tour\nSymposium\nObservation\nInterview\n\n--- PDF PAGE 47 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n45\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate\nindustry\nknowledge\n1.1 Seek information on the\nindustry\n2.1 Update continuously\nrelevant industry\nknowledge\n\nLecture\nGroup Discussion\nIndividual/Group\nAssignment\n\nInterviews/\nQuestioning\nIndividual/Group\nProject or\nReport\n2. Observe\nworkplace\nhygiene\nprocedures\n2.1 Follow hygiene\nprocedures\n2.2 Identify and prevent\nhygiene risk\nLecture\nDemonstration\nRole-play\nDemonstration\nWritten\nExamination\nInterviews/\nQuestioning\n\n3. Perform\ncomputer\noperations\n3.1 Plan and prepare task to\nbe undertaken\n3.2 Input data into a\ncomputer\n3.3 Assess information using\ncomputer\n3.4 Produce/ output data\nusing computer system\n3.5 Maintain computer\nsystem\n\nLecture\nGroup Discussion\nTutorial or self-\npace\n\nInterviews/\nQuestioning\nDemonstration\nObservation\n4. Perform\nworkplace and\nsafety practices\n4.1 Practice workplace\nprocedures for health,\nsafety and security\npractices\n4.2 Deal with emergency\nsituations\n4.3 Maintain safe personal\npresentation standards\n\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nWritten\nExamination\n5. Provide\neffective\ncustomer\nservice\n5.1 Greet customers\n5.2 Identify customer needs\n5.3 Deliver service to\ncustomer\n5.4 Handle queries through\ntelephone, fax machine,\ninternet and email\n5.5 Handle complaints,\nevaluation and\nrecommendations\n\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nObservation\n\n--- PDF PAGE 48 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n46\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Create travel-\nrelated\nreservations\nand\ntransactions\n1.1 Administer client file and\nidentify booking\nrequirements\n1.2 Request services\n1.3 Record request and\nconfirmation\n1.4 Update and finalize\nbookings\n• Demonstration\n• Discussion\n• Lectures\n• Supervised\nIndustry\nTraining (SIT)\n• Hands On\nTraining in\nLaboratory\n\n• Written\nexamination\nper subject\n• Demonstration\nof practical\nskills\n• Individual/\nGroup Project\nor Report\n2. Provide\nassistance in\ntravel\ndocumentation\npreparation\n2.1 Prepare and assist\nclient’s passport\napplication\n2.2 Assist client in securing\nvisa and/or permits for\ncountry of destination\nand transit points, as\napplicable\n2.3 Assist client’s in\nsecuring immigration\nclearance application for\ntravel abroad\n2.4 Provide assistance in\nsecuring additional\nrequirements for travel\neg.vaccination card from\nBureau of Quarantine etc\n\n• Demonstration\n• Discussion\n• Lectures\n• Supervised\nIndustry\nTraining (SIT)\n\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Individual/\nGroup Project\nor Report\n3. Issue IATA-\nBSP\nDocuments\nand Other\nPassage\nDocument ‘s\n3.1 Gather necessary\ninformation and other\ntravel related data\n3.2 Perform sales and\nservice tasks\n3.3 Issue tickets,\nMultipurpose Documents\n(MPD) and other travel\nrelated document’s\n3.4 Network for latest fare\nand tariff information\n\n• Demonstration\n• Discussion\n• Lectures\n• Supervised\nIndustry\nTraining (SIT)\n\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Individual/\nGroup Project\nor Report\n\n--- PDF PAGE 49 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n47\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency standards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes,\nboth on and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities may be adopted when\ndesigning training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations\n•\nModular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners\n•\nSupervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, or audio, video or\ncomputer technologies\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n•\nmust have completed 10-year basic education\n•\ncan communicate by oral and written language; and\n•\ncan perform basic mathematical computation.\n\nThis list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees\nby the school or training center delivering the TVET program.\n\n--- PDF PAGE 50 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n48\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\n\nTRAVEL SERVICES – NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor Travel Services NC II.\nFACILITIES\nEQUIPMENT\n\nSUPPLIES AND\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\nSUPPLIES\n\nWorkshop\n1 unit\nProjector screen\n\nWriting materials\n\nLaboratory\n1 unit\nOverhead projector\n\nRequisition forms\n\nAudio-visual\nroom\n1 unit\nElectric fan\n\nSample booking forms\n\nLecture\nroom\n1 set\nFirst aid cabinet\n\nRecord books\n\nStorage/\nstock room\n1 pc\nFiling cabinet\n\nEnvelopes, folders\n\n1 unit\nFire extinguisher\nAccessories\n\n1 unit\nEmergency light\n\nComplete laboratory outfit\n\n1 unit\ndirectional signage\n\nWorking devices\n\n1 unit\nair condition\n\nPadlocks\n\n1 unit\nTelephones\n\nKeys\n\n1 unit\ncomputers with internet\nconnection\nReferences\n\n1 unit\nTV\n\nBrochures\n\n1 unit\nVideo player\n\nManuals\n\n1 unit\nFax machine\n\nCharts\n\n1 unit\nLCD\n\nMap\n\n1\nLicensed Software on\nComputerized\nReservation System\n\nCD’s\n\n 1\nLicensed on Word\nProcessing, Worksheet,\nPresentation and\nDatabase Presentation\nand Database\n\nVideo Tapes\n\nPictures\n\nUpdated Official Airline\nGuide\n\nUpdated\ndocumentation\nManual\n\nUpdated\ntravel\nagent\nticketing Manual\n\nUsed plane tickets\n\nUpdated BSP Manual\n\nUpdated\nTravel\nAgent\nHandbook\n\nUpdated Passenger and\nTariff manual\n\n--- PDF PAGE 51 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n49\n\n3.5 TRAINING FACILITIES\n\nTRAVEL SERVICES – NC II\n\nBased on a class intake of 25 students/trainees:\n\nSPACE REQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n• Building (permanent)\n\n• Student/Trainee\nWorking Space\n1m x 1m\n1 sq. meter\n25 sq. meters\n• Contextual Learning\nLaboratory\n8m x 5m\n40 sq. meters\n40 sq. meters\n• Lecture Room\n8m x 5m\n40 sq. meters\n40 sq. meters\n• Learning Resource\nCenter\n3m x 5m\n15 sq. meters\nper class\n15 sq. meters per\nclass\n• Facilities/Equipment/\nCirculation Area\n3m x 5m\n15 sq. meters\nper class\n15 sq. meters per\nclass\n\n3.6 TRAINERS’ QUALIFICATION FOR TOURISM SECTOR (TRAVELS AND TOURS)\n\nTRAVEL SERVICES NC II\nTRAINER QUALIFICATION\nFor ticketing instructor, must have an UFTAA/IATA Trainers Certification\n•\nMust be a holder of National TVET Trainer Certificate (NTTC) Level I in Travel\nServices NC II\n•\nMust be computer and (GDS) literate\n•\n*Must have at least 5 years job/industry experience in the field of\nexpertise/instruction\n\n *Optional. Only when required by the hiring institution.\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of\ncompetency.\n\n--- PDF PAGE 52 ---\nTR - TRAVEL SERVICES NC II (Amended) Promulgated December 2013\n50"
  },
