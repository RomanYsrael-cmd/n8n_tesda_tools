    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: ARTIFICIAL INSEMINATION(LARGE RUMINANTS) NC Level NC II\n\nNominal Training Duration:\n18 hrs-\nBasic Competencies\n14 hrs-\nCommon Competencies\n172 hrs Core Competencies\n204 hrs\nTotal training duration\n16 hrs\nElective Competency\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills of\nartificial insemination technician in accordance with industry standards. It covers\nestablishing readiness for artificial insemination, preparing for artificial insemination\n(AI) operation, performing artificial insemination (AI) and preparing artificial\ninsemination (AI) documentations and reports. It also includes competencies in\nworkplace communication, teamwork, practicing professionalism, safety in the use of\nhand tools and equipment, housekeeping and basic mathematical operations and\ncalculations. It has elective competency in conducting artificial insemination\nawareness for clientele.\n\nBASIC COMPETENCIES\n(18 hrs.)\nUnit of Competency\nLearning Outcomes\nTraining\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 42 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n40\nUnit of Competency\nLearning Outcomes\nTraining\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1.\nIdentify hazards and\nrisks.\n4.2.\nEvaluate hazards and\nrisks.\n4.3.\nControl hazards and\nrisks.\n4.4.\nMaintain occupational\nhealth and safety\nawareness.\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n(14 hrs.)\nUnit of Competency\nLearning Outcomes\nTraining\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1. Apply appropriate safety\nmeasures while working\nin farm\n1.2. Safe keep/dispose tools,\nmaterials and outfit\n• Self-\npaced/modular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nDemonstration\n•Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstrati\non\n2. Use farm tools\nand equipment\n2.1. Select and use farm\ntools\n2.2. Select and operate farm\nequipment\n2.3. Perform preventive\nmaintenance\n• Self-\npaced/modular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\nOral/Written\nInterviews\nDirect\nObservation\nPractical\nDemonstration\n3. Perform\nestimation\nand\nbasic calculation\n3.1. Perform estimation\n3.2. Perform basic workplace\ncalculation\nSelf-paced/modular\nLecture/Discussion\nInteraction\nPractical Exercise\nOral/Written\nexamination\nPractical\nexercise\n\n--- PDF PAGE 43 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n41\nCORE COMPETENCIES\n(172 hrs.)\nUnit of Competency\nLearning Outcomes\nTraining\nMethodology\nAssessment\nApproach\n1. Establish\nreadiness for\nartificial\ninsemination\n\n1.1. Validate gathered\ninformation on\nclientele and animal\ncondition\n1.2. Assess animal\nReadiness\n• Lecture-\ndiscussion\n• Group\nDiscussion\n• Hands-on\nPractical\ndemonstration\n• Role playing\n• Case analysis\n• Written\nexamination\n• Demonstration\n\n2. Prepare for\nartificial\ninsemination (AI)\noperation\n2.1. Carry-out\npreparatory activities\n2.2. Maintain semen\nquality\n2.3. Prepare semen and\nconduct AI procedure\n\n• Lecture\n• Lecture-\ndiscussion\n• Group-\ndiscussion\n• Demonstration\n• Hands-on\n\n• Written\nexamination\n• Demonstration\n\n3. Perform artificial\ninsemination (AI)\n4. Prepare artificial\ninsemination(AI)\ndocumentations\nand reports\n\nELECTIVE COMPETENCIES\n(16 hrs.)\nUnit of Competency\nLearning Outcomes\nTraining\nMethodology\nAssessment\nApproach\n1. Conduct artificial\ninsemination\nawareness for\nclientele\n1.1. Prepare for the conduct\nof community\nawareness programs\n1.2. Carry out community\nawareness programs\n• Lecture/demo\n• Group\nDiscussion\n• Hands-on\n\n• Written\nexamination\n• Demonstration\n\n--- PDF PAGE 44 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n42"
  },
