    "source_text": "SECTION 3. TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for ARTIFICIAL INSEMINATION\n(LARGE RUMINANTS) NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: ARTIFICIAL INSEMINATION(LARGE RUMINANTS) NC Level NC II\n\nNominal Training Duration:\n18 hrs-\nBasic Competencies\n14 hrs-\nCommon Competencies\n172 hrs Core Competencies\n204 hrs\nTotal training duration\n16 hrs\nElective Competency\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes and skills of\nartificial insemination technician in accordance with industry standards. It covers\nestablishing readiness for artificial insemination, preparing for artificial insemination\n(AI) operation, performing artificial insemination (AI) and preparing artificial\ninsemination (AI) documentations and reports. It also includes competencies in\nworkplace communication, teamwork, practicing professionalism, safety in the use of\nhand tools and equipment, housekeeping and basic mathematical operations and\ncalculations. It has elective competency in conducting artificial insemination\nawareness for clientele.\n\nBASIC COMPETENCIES\n(18 hrs.)\nUnit of Competency\nLearning Outcomes\nTraining\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 42 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n40\nUnit of Competency\nLearning Outcomes\nTraining\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and\ndevelopment.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1.\nIdentify hazards and\nrisks.\n4.2.\nEvaluate hazards and\nrisks.\n4.3.\nControl hazards and\nrisks.\n4.4.\nMaintain occupational\nhealth and safety\nawareness.\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n(14 hrs.)\nUnit of Competency\nLearning Outcomes\nTraining\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures in\nfarm operations\n1.1. Apply appropriate safety\nmeasures while working\nin farm\n1.2. Safe keep/dispose tools,\nmaterials and outfit\n• Self-\npaced/modular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nDemonstration\n•Visit/tour\n• Oral/Written\nInterviews\n• Direct\nObservation\n• Practical\nDemonstrati\non\n2. Use farm tools\nand equipment\n2.1. Select and use farm\ntools\n2.2. Select and operate farm\nequipment\n2.3. Perform preventive\nmaintenance\n• Self-\npaced/modular\n• Lecture/\nDiscussion\n• Interaction\n• Practical\nDemonstration\n• Visit/tour\nOral/Written\nInterviews\nDirect\nObservation\nPractical\nDemonstration\n3. Perform\nestimation\nand\nbasic calculation\n3.1. Perform estimation\n3.2. Perform basic workplace\ncalculation\nSelf-paced/modular\nLecture/Discussion\nInteraction\nPractical Exercise\nOral/Written\nexamination\nPractical\nexercise\n\n--- PDF PAGE 43 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n41\nCORE COMPETENCIES\n(172 hrs.)\nUnit of Competency\nLearning Outcomes\nTraining\nMethodology\nAssessment\nApproach\n1. Establish\nreadiness for\nartificial\ninsemination\n\n1.1. Validate gathered\ninformation on\nclientele and animal\ncondition\n1.2. Assess animal\nReadiness\n• Lecture-\ndiscussion\n• Group\nDiscussion\n• Hands-on\nPractical\ndemonstration\n• Role playing\n• Case analysis\n• Written\nexamination\n• Demonstration\n\n2. Prepare for\nartificial\ninsemination (AI)\noperation\n2.1. Carry-out\npreparatory activities\n2.2. Maintain semen\nquality\n2.3. Prepare semen and\nconduct AI procedure\n\n• Lecture\n• Lecture-\ndiscussion\n• Group-\ndiscussion\n• Demonstration\n• Hands-on\n\n• Written\nexamination\n• Demonstration\n\n3. Perform artificial\ninsemination (AI)\n4. Prepare artificial\ninsemination(AI)\ndocumentations\nand reports\n\nELECTIVE COMPETENCIES\n(16 hrs.)\nUnit of Competency\nLearning Outcomes\nTraining\nMethodology\nAssessment\nApproach\n1. Conduct artificial\ninsemination\nawareness for\nclientele\n1.1. Prepare for the conduct\nof community\nawareness programs\n1.2. Carry out community\nawareness programs\n• Lecture/demo\n• Group\nDiscussion\n• Hands-on\n\n• Written\nexamination\n• Demonstration\n\n--- PDF PAGE 44 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n42\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\no The training is based on curriculum developed from the competency\nstandards;\no Learning is modular in its structure;\no Training\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized and self-paced learning strategies;\no Training is based on work that must be performed;\no Training materials are directly related to the competency standards and\nthe curriculum modules;\no Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\no Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\no Training allows for multiple entry and exit; and\no Training programs are registered with UTPRAS.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\no The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\no Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\no Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\no Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\no Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\no Project-Based Instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 45 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n43\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess\nthe following requirements:\n\n•\nAble to read and write;\n•\nWith good moral character;\n•\nAbility to communicate, both oral and written; and\n•\nPhysically fit and mentally healthy as certified by a Public Health\nOfficer\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n\nRecommended list of tools, equipment and materials for the training of 12\ntrainees for Artificial Insemination NC II\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n12\nAI Kit\n1\nLiquid Nitrogen\nTank\n(Dewar) with 33 L\ncapacity (Mother\ntank)\n1,200\npcs\nSemen straws\n24\nCatheters\n1\nLiquid Nitrogen\nTank\nWith 3 L capacity\n(field tank)\n1,200\npcs\nAI sheaths\n1 pc.\nBull lead\n12\nsets\nPersonal\nProtective\nParaphernalia\n(boots, coverall/\napron, surgical\nand shoulder-\nlength plastic\ngloves\n6 pcs\nFemale\nReproductive\nOrgan\nSpecimens\n1 pc.\nNail cutter\n1\nVehicle (optional)\n120 m.\nRope\n1 set\nFirst aid kit\n1\nCamera\n1L\nIodine (10%\nPovidone)\n12 pcs.\nTraining bag\n1\nMicroscope\n2 sets\nPail and dipper\n1\nShovel\n1\nPower sprayer\n(optional)\n10 m\nHose\n1\nWheel borrow\n1\nGen set (optional)\n12\nbottles\nEthyl alcohol (60%)\n\n1\nFreezer\n12\nbottles\nIsopropyl alcohol\n(70%)\n\n--- PDF PAGE 46 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n44\n\nQTY\nTOOLS\nQTY\nEQUIPMENT\nQTY\nMATERIALS\n\n1\nFire extinguisher\n12 pcs.\nGermicidal Soap\n\n1\nSet Audio visuals\nwith screen\n12 pcs.\nDisposable towel\n\n1\nWhite board\n1pcs.\nFlash lights\n\n12\nsets\nChairs and tables\n1 box\nGlass slides\n\n2\nUnits\nComputer\n1 box\nCover slips\n\n1\nPrinter\n2\nTrash can\n\n1\nPhotocopier\n(optional)\n50 pcs.\nDisposal waste\nbags\n\n12\npacks\nPaper towels\n\n2 pcs.\nBroomstick\n\n1 box\nSurgical gloves\n\n1 box\nShoulder-length\ngloves\n\nModels/actual\nobjects\n2 pcs.\nBrooms\n\n12\nPractice animals\n6 pcs.\nBrush\n\n12\nsheets\nManila paper\n\n6 pcs\nBoard marker\n\n2 rolls\nTapes\n\n12 pcs\nPencil\n\n1 ream\nBond paper\n\nLearning Materials\n\n12 pcs\n• Training manuals\n\n1 pc\n•\nAnimal charts\n\n1 pc\n•\nAnimal breeds\n\n1 lot\n• Video materials\n\n--- PDF PAGE 47 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n45\n3.5 TRAINING FACILITIES\n\n ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n\nBased on a class size of 12 students/trainees\n\nSPACE REQUIREMENT\nSIZE IN METERS\nTOTAL AREA IN SQ.\nMETERS\n•\nWorking Corral\n30 x 30\n900\n•\nAnimal House\n4 x 2 per animal x12\n96\n•\nLecture Room\n7x 5\n35.00\n•\nLaboratory room\n6 x 8\n48\n• Storage room\n4 x 3\n12\n• Locker room/ Dressing area\n\no Female\n4x3\n12\no Male\n4x3\n12\n\n3.6 TRAINER’S QUALIFICATIONS FOR AGRICULTURE SECTOR\n\nARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\nTRAINER QUALIFICATION (TM I)\n•\nAnimal Science Graduate or Doctor of Veterinary Medicine; or\n•\nMust be a holder of Artificial Insemination NC II\n•\nMust have undergone training on Training Methodology I (TM I)\n•\nMust be physically and mentally fit\n•\n*Must be computer literate\n•\n*Must have at least 2 years job/industry experience\n\n*\nOptional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7.\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency.\n\nAs a matter of policy, graduates of programs registered with TESDA under\nthese training regulations are required to undergo mandatory national competency\nassessment upon completion of the program\n\n--- PDF PAGE 48 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n46"
