ting of two distinct breeds of animals of the same species Culling –removal of undesirable or inferior animals in the herd based on important economic traits and overall performance Estrus – also refers to as heat period; time when a female animal is receptive to accept male ; physiologically, when the hormone estrogen is at its peak External genitalia –sex organ, or primary sexual characteristic, as narrowly defined, is any of the anatomical parts of the body which are involved in sexual reproduction and constitute the reproductive system in a complex organism Gestation Period – refers to the period of carrying the young in the womb or pregnancy Heifer – a young female cattle or buffalo that has not given birth Inbreeding – mating of closely related animals in a herd Liquid nitrogen (LN2)- is nitrogen in a liquid state at a very low temperature (boiling point is -196oC and freezing point is -210oC), a colourless clear liquid and is often referred to by the abbreviation, LN2 or \"LIN\" or \"LN\"; and is a cryogenic fluid which can cause rapid freezing on contact with living tissue, which may lead to frostbite Large ruminants- well-known large grazing or browsing mammals. Refers to a group of large animals, cattle and water buffalo, that are characterized by the four compartments of their stomach (rumen, reticulum, omassum and abomassum), which could subsist on forage grasses or vegetation Livestock – domestic animals kept for use on a farm and raised for sale and profit Mating plan- is a system of identifying which cow/heifer is mated/bred to which bull; a systematic plan of breeding animals designed to improve a particular trait/s Nutrients – food elements or substance found in the feeds such as protein, carbohydrates, fats and others Practice animal- is an animal kept in the farm identified to be used in the practice of any production/reproduction activity and not necessarily of productive use to contribute sales in the farm, like, animals used in the practice of 