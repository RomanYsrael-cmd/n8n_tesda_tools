  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.\nTo attain the National Qualification of Artificial Insemination (Large\nRuminants) NC II, the candidate must demonstrate competence in all the\nunits listed in Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.2.\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.3.\nThe following are qualified to apply for assessment and certification:\n\n4.4.1\nGraduates of formal, non-formal and informal including enterprise-\nbased training programs with one year (1) field/work exposure.\n\n4.4.2\nExperienced Workers (wage employed or self-employed)\n\n4.4.\nThe guidelines on assessment and certification are discussed in detail in\nthe Procedures Manual on Assessment and Certification and Guidelines on\nthe Implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS).\n\n--- PDF PAGE 49 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n47\n\nSupermarket of Competencies\nAGRI-FISHERY Sector\nEstablish readiness for\nartificial insemination\nPrepare for artificial\ninsemination (AI)\noperation\nPerform artificial\ninsemination (AI)\nPrepare artificial\ninsemination (AI)\ndocumentations and reports\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nApply Safely\nmeasures in farm\noperations\nUse Farm Tools\nand Equipment\nPerform Estimation\nand basic\ncalculation\nWork in team\nenvironment\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nSupermarket of Competencies\nAGRI-FISHERY Sector\nEstablish readiness for\nartificial insemination\nPrepare for artificial\ninsemination (AI)\noperation\nPerform artificial\ninsemination (AI)\nPrepare artificial\ninsemination (AI)\ndocumentations and reports\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nApply Safely\nmeasures in farm\noperations\nUse Farm Tools\nand Equipment\nPerform Estimation\nand basic\ncalculation\nWork in team\nenvironment\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\n\n--- PDF PAGE 50 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n48\n"
