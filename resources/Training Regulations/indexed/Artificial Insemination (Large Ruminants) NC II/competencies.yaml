        "source_title": "PREPARE FOR ARTIFICIAL INSEMINATION (AI) DOCUMENTATIONS AND REPORTS",
        "source_text": "--- PDF PAGE 35 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II \n33 \n \nUNIT OF COMPETENCY \n: \nPREPARE FOR ARTIFICIAL INSEMINATION (AI) \nDOCUMENTATIONS AND REPORTS \nUNIT CODE\n:\nAGR621208\n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the required documentation for \ntechnicians in the conduct of artificial insemination \nand related activities. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalized terms are elaborated in the Range of Variable \n1. Collect and process data\n1.1. Necessary forms are secured from partners. \n1.2. Data is collected and processed as required in \nthe forms. \n1.3. Photos and other pertinent information are \ngathered as needed. \n1.4. Evidence for breed registry is secured, as \nneeded  \n2. Accomplish and submit \nforms \n2.1. Forms are accomplished and submitted to \nconcerned partners. \n2.2. Summary report is prepared and submitted \nusing required forms. \n2.3. File copies of accomplished forms and summary \nreport are kept and compiled by technicians \naccording to required filing procedures.\n\n--- PDF PAGE 36 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II \n34 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Necessary forms \nThis may include but not limited to the following: \n1.1. AI service form \n1.2. Semen utilization form \n1.3. Requisition Issuance Slip (RIS) or logbook \n2. Data \nThis refers to the following: \n2.1. Date and time of AI \n2.2. Sire \n2.3. Client’s name \n2.4. Address of the clients \n2.5. Age of animal \n2.6. Number of calving \n2.7. Breed \n2.8. Pregnancy diagnosis \n2.9. Type of estrus \n2.10. Name of Technician \n2.11. Site of deposition \n2.12. Body condition score \n3. Concerned partners\nThis includes the following: \n3.1. PCC \n3.2. NDA \n3.3. BAI-UNAIP  \n3.4. Private suppliers \n3.5. Local government units (LGUs) \n3.6. DA Regional Field Units (DA-RFU) \n4. Summary of report \nThis may include, but not limited to: \n4.1. Summary of AI service data \n4.2. Pregnancy diagnosis \n4.3. Calf drop  \n4.4. Semen utilization, as needed\n\n--- PDF PAGE 37 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II \n35 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Demonstrated data collection and processing. \n1.2. Made entries to required forms for submission. \n1.3. Prepared summary report for submission. \n2. Required \nKnowledge and \nAttitudes \n2.1 Familiarity with all the necessary forms. \n2.2 Familiarity with semen code and sire directory \n2.3 Familiarity with gestation lengths of large ruminants \n2.4 Familiarity with breeds of large ruminants \n2.5 Knowledge on basic animal husbandry practices \n2.6 Practice 3R’s and 5S \n2.7 Systematic, thorough, and prompt in the accomplishment \nand submission of reports  \n3. Required Skills \n3.1 Basic record-keeping \n3.2 Arithmetic (Multiplication, Division, Addition and \nSubtraction) \n3.3 Communication skills \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1. Oral interview \n4.2. Demonstration with questioning \n4.3. Third party report  \n4.4. Portfolio  \n5. Resource \nImplication \n \n5.1 Required forms \n5.2 Communication equipment  \n5.3 Calculator \n5.4 Breeding calendars \n5.5 Filing cabinets \n5.6 Ball pens/Pencils \n5.7 Camera \n5.8. Animals \n5.9  Tickler \n6. Context of \nAssessment \n6.1. Competency may be assessed individually in the actual \nworkplace or through accredited farms/institution.\n",
