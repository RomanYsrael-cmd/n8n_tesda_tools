        "evidence_guide": {
          "source_text": "1.   Critical aspects of \nCompetency \n \nAssessment requires evidence that the candidate:\n1.1 \nPrepared for the conduct of awareness activities for \nclientele \n1.2\nCarry-out awareness activities for clientele\n2.  Required \nKnowledge and \nAttitudes \n2.1\nData collection methods to support the development \nof materials  \n2.2 \nLegislation relevant to the subject matter of the \npresentation  \n2.3 \nOrganisational policies and procedures relating to \npresenting information to the public  \n2.4 \nPrinciples of animal welfare and ethics  \n2.5 \nPractice 3R’s and 5S \n2.6 \nRange of presentation aids and materials available to \nsupport the presentation  \n2.7 \nRange of communication strategies  \n2.8 \nRelevant and current community awareness programs \n2.9 \nTechnical information relevant to the presentation or \nsubject matter. \n2.10 \nAttitude \n2.10.1 Courtesy \n2.10.2 Patience \n2.10.3 Innovative \n2.10.4 Resourceful\n3.  Required Skills\n3.1\nListening questioning techniques.\n3.2 \nVerbal and non-verbal communication skills \n3.2.1 negotiation techniques. \n3.2.2 types and clients needs \n3.2.3 handling clients objections \n3.2.4 performance analysis techniques \n3.3 \nBasic level of artificial insemination (AI) servicing \n3.4 \nPublic speaking skills to include \n3.4.1 opening techniques to awaken clients interest \n3.4.2 strategies to focus clients specific needs \n3.4.3 answering clients questions \n3.4.4 handling customer objections and adverse \nreactions \n3.5\nSkills in making aids and presentation materials\n4. Resource Implications\nThe following resource MUST be provided:\n4.1 \na work environment \n4.2 \nrelevant documentation, such as policy and \nprocedures manuals \n4.3 \na range of clients with different requirements \n4.4 \npromotional materials (films, pamphlets, \npresentations, etc.) \n4.5\ncommunication gadgets (telephone, cellphone, etc.)\n5.   Methods of \nAssessment \nCompetency may be assessed through:\n5.1 \nObservation with questioning \n5.2 \nDemonstration with questioning \n5.3 \nThird-party reports  \n5.4 \nOral questioning/Interview \n5.5\nPortfolio assessment\n6.   Context of \nAssessment \n6.1    Assessment may be performed in the workplace or \nsimulated workplace situation \n6.2     Assessment activities are carried out through \nTESDA's accredited assessment center",
