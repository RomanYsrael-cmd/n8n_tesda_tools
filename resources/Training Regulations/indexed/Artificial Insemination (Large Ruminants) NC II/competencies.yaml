ct sunlight \n2.2. Free from direct rain \n2.3. Open space or well-ventilated area. \n2.4. Free from dust and other contaminants \n3. Defective semen \nstraw \nThe following are the non-complying qualities of frozen semen: \n3.1. Popping semen straws  \n3.2. Accidental dropped straws \n3.3. Broken straws \n3.4. Unsealed straws \n3.5. Sticking together or clamping straws\n4. Recommended \nstandards for \ninsemination \nThis refers to the following: \n4.1. Locating and holding of the cervix  \n4.2. Insertion of the AI gun  \n4.3. Semen deposition \n4.4. AI gun withdrawal \n5. Suitable materials \nThis refers to the following: \n5.1. Water \n5.2. Soap \n5.3. Tissue paper \n5.4. Paper towel\n6. Environmental \nregulations \nThis may include but not limited to the following: \n6.1. Water \n6.1.1. RA 9275 ( Clean Water Act) \n6.1.2. DAO 1990-35 ( Revised effluent regulation) \n6.1.3. DAO 2004-25 ( Discharge permit) \n6.2. Solid \n6.2.1. RA 9003 ( Ecological Solid Waste Management Act \nof 2000 IRR RA 9003\n7. Management of \nanimals \n7.1. Avoid overwork \n7.2. Proper feeding  \n7.3. Perform heat detection every after 18-21 days  \n7.4. Humane handling of animals\n\n--- PDF PAGE 34 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II \n32 \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated preparation and deposition of semen in \nthe female reproductive tract within the time frame. \n \n2. Required \nKnowledge and \nAttitudes \n2.1 \nProcedures on semen preparation and deposition \n2.2 \nReproductive system and estrous cycle of large \nruminants \n2.3 \nWaste management \n2.4 \nPractice 3R’s and 5S \n2.5 \nCommunication \n2.5.1 \nPreparation of inventory reports, production \nand performance records.  \n2.6 \nSafety Practices \n2.6.1 \nPersonal protective paraphernalia or device \n2.6.2 \nHumane handling of the animal \n2.7 \nCodes and Regulations \n2.7.1 \nAnimal Welfare Act (RA 8485) \n2.8 \nValues \n2.8.1 \nPunctuality  \n2.8.2 \nPersonal hygiene \n2.8.3 \nAbility to work well with others harmoniously \n3. Required Skills \n3.1 \nWork safety \n3.2 \nSensory and motor skills \n3.3 \nCommunication skills \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1. \nOral interview \n4.2. \nPractical demonstration  with questioning  \n4.3. \nObservation with questioning \n4.4. \nThird party report  \n4.5. \nPortfolio (certificates, awards, recognition, \ncommendations, etc.) \n5. Resource \nImplication \n \n5.1 \nPractice animals \n5.2 \nFrozen semen \n5.3 \nFarm facilities with chute  \n5.4 \nArtificial Insemination paraphernalia  and supplies \n5.5 \nPersonal Protective Paraphernalia \n5.6 \nForms \n6. Context of \nAssessment \n \n6.1 \nCompetency may be assessed individually in the \nactual workplace or through accredited \nfarms/institution.\n",
