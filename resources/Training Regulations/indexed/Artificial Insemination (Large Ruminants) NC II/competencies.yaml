n5.5\nCommunication equipment\n5.6\nForms\n6. Context of\nAssessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or through accredited farms/institution.\n\n--- PDF PAGE 29 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n27\n\nUNIT OF COMPETENCY\n:\nPREPARE FOR ARTIFICIAL INSEMINATION\n\nUNIT CODE\n:\nAGR621206\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes in the preparation and\ntransport of AI equipment, tools, supplies and\nmaterials, including hygiene and safety requirements\nto ensure the integrity and quality of the semen prior\nto the AI procedure.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalized terms are elaborated in the Range of Variable\n1. Carry-out preparatory\nactivities\n\n1.1\nSourcing of semen and LN2 supplies is made from\nthe concerned partners\n1.2\nAI kit and LN2 tank with semen are prepared and\nsecured during transport .\n1.3\nPreparation for AI is made in accordance with the\nhygiene and safety requirements.\n1.4\nAnimal is restrained using suitable restraining\nprocedures.\n\n2. Maintain semen quality\n2.1.\nLiquid nitrogen (LN2) level is monitored using the\ndip stick and replenished when necessary.\n2.2.\nSemen inventory is done and replenished as\nneeded based on recommended procedures.\n2.3.\nTasks are performed to ensure safety of the\ntechnician and other individuals.\n\n--- PDF PAGE 30 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n28\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Partners\nThe partners may include, but not limited to:\n1.1\nPhilippine Carabao Center (PCC)\n1.2\nNational Dairy Authority (NDA)\n1.3\nBureau of Animal Industry (BAI)\n1.4\nPrivate Suppliers\n1.5\nLocal government units (LGUs)\n1.6\nDA Regional Field Units (DA-RFU)\n2. AI kit and other\nsupplies\nThis may include, but not limited to the following:\n2.1\nAI Gun\n2.2\nDisposable AI sheath\n2.3\nDisposable shoulder length gloves\n2.4\nSurgical Gloves\n2.5\nPaper towels\n2.6\nSemen straw scissors/cutters\n2.7\nSemen straw forceps\n2.8\nThermometer\n2.9\nThawing jar\n2.10 Lubricant\n2.11 Disinfectant\n2.12 Brush\n2.13 Apron/ Cover all\n2.14 Pail\n2.15 Boots\n2.16 Disposable plastic waste bags\n3. Hygiene and safety\nrequirements\nThis refers to the following:\n3.1\nWear personal protective paraphernalia( i.e. cover all/\napron and boots)\n3.2\nPersonal Hygiene(eg. no long nails)\n3.3\nWear Shoulder-length and/or surgical gloves\n3.4\nUse of lubricant (soap)\n4. Suitable restraining\nprocedures.\nThis pertains to :\n4.1\nChute measuring 2m L x 1 m W x 1.2 m H\n4.2\nHumane handling of animal\n4.3\nProcedures that ensure safety of handlers and animals\n5. Recommended\nprocedures\nThis refers to the following:\n5.1\nLevel of canister relative to the neck of tank\n5.2\nTime elapsed when canister is near neck opening\n5.3\nUse of long forceps for transfer of semen\n5.4\nSemen used should be compliant with Genetic\nImprovement Program (GIP) mating plan(carabao only)\n6. Semen inventory\nThis refers in checking the following information:\n6.1\nSpecies\n6.2\nBull ID Number/Name\n6.3\nLocation in field tank\n6.4\nNumber of straws\n6.5\nBreed\n7. Tasks\nTasks refer to the following:\n7.1\nTransfer of semen into and from LN2 tank\n7.2\nTransfer of LN2 tank\n7.3\nMaintenance of LN2 above the critical level\n7.4\nLN2 level measurement\n8. Safety\nIt implies the prevention from the following:\n8.1.\nSuffocation\n8.2.\nFrost bite/burn\n\n--- PDF PAGE 31 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n29\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDemonstrated semen handling and maintenance.\n2. Required\nKnowledge and\nAttitudes\n2.1\nAnimal restraining\n2.2\nLN2 level maintenance\n2.3\nSemen handling\n2.4\nPractice 3R’s and 5S\n2.5\nCommunication\n2.5.1 Preparation of records.\n2.6\nSafety Practices\n2.6.1 Personal protective paraphernalia or devices\n2.6.2 Refilling of LN2\n2.7\nCodes and Regulations\n2.7.1 Handling of LN2\n2.7.2 Animal Welfare Act (RA 8485)\n2.8\nValues\n2.8.1 Patience\n2.8.2 Humane handling of animals\n3. Required Skills\n3.1\nWork safety\n3.2\nRecord keeping\n3.3\nAnimal handling skills\n3.4\nCommunication skills\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1.\nOral interview\n4.2.\nPractical demonstration with questioning\n4.3.\nObservation with questioning\n4.4.\nThird party report\n4.5.\nPortfolio\n5. Resource\nImplication\n\n5.1.\nPractice Animals\n5.2.\nFarm facilities with chute\n5.3.\nLN2 tank and LN2\n5.4.\nFrozen semen\n5.5.\nAI paraphernalia and other supplies\n5.6.\nPersonal protective paraphernalia and devices\n5.7.\nForms and logbook\n6. Context of\nAssessment\n6.1.\nCompetency may be assessed individually in the actual\nworkplace or through accredited farms/institution.\n\n--- PDF PAGE 32 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n30\n\nUNIT OF COMPETENCY\n:\nPERFORM ARTIFICIAL INSEMINATION\n\nUNIT CODE\n:\nAGR621207\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\non the performance of artificial insemination (AI). It\nincludes preparation and deposition of semen and\nthe performing of post-artificial insemination (AI)\nactivities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalized terms are elaborated in the Range of Variable\n1. Prepare semen\n1.1.\nSemen to be used is selected in accordance with\nthe mating plan and production objective.\n1.2.\nSemen straw is prepared for AI in accordance to\nthe established procedures.\n1.3.\nTask is performed in the recommended location\nto ensure quality of semen and avoid injuries to\ntechnician and others.\n1.4.\nDefective semen straws are discarded in\naccordance to environmental regulations.\n2. Deposit semen\n2.1.\nCleaning of the external genitalia is performed\nusing suitable materials and as needed.\n2.2.\nSemen is deposited into the female reproductive\ntract following recommended standards.\n2.3.\nTask is performed without causing injuries to the\nanimal, technician and others.\n3. Perform post-artificial\ninsemination (AI)\nactivities\n\n3.1.\nClients are advised about the management of\nanimals after AI.\n3.2.\nTask is performed without causing injuries to the\nanimal, technician and others\n3.3.\nWastes are disposed according to existing\nenvironmental regulations.\n\n--- PDF PAGE 33 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n31\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Established\nprocedures\nThis refers to the following:\n1.1. Withdrawal of semen straw from the tank\n1.2. Thawing\n1.3. Drying\n1.4. Loading semen straw to AI gun\n1.5. Cutting of semen straw\n2. Recommended\nlocation\nThis refers to the following:\n2.1. Free from direct sunlight\n2.2. Free from direct rain\n2.3. Open space or well-ventilated area.\n2.4. Free from dust and other contaminants\n3. Defective semen\nstraw\nThe following are the non-complying qualities of frozen semen:\n3.1. Popping semen straws\n3.2. Accidental dropped straws\n3.3. Broken straws\n3.4. Unsealed straws\n3.5. Sticking together or clamping straws\n4. Recommended\nstandards for\ninsemination\nThis refers to the following:\n4.1. Locating and holding of the cervix\n4.2. Insertion of the AI gun\n4.3. Semen deposition\n4.4. AI gun withdrawal\n5. Suitable materials\nThis refers to the following:\n5.1. Water\n5.2. Soap\n5.3. Tissue paper\n5.4. Paper towel\n6. Environmental\nregulations\nThis may include but not limited to the following:\n6.1. Water\n6.1.1. RA 9275 ( Clean Water Act)\n6.1.2. DAO 1990-35 ( Revised effluent regulation)\n6.1.3. DAO 2004-25 ( Discharge permit)\n6.2. Solid\n6.2.1. RA 9003 ( Ecological Solid Waste Management Act\nof 2000 IRR RA 9003\n7. Management of\nanimals\n7.1. Avoid overwork\n7.2. Proper feeding\n7.3. Perform heat detection every after 18-21 days\n7.4. Humane handling of animals\n\n--- PDF PAGE 34 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n32\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated preparation and deposition of semen in\nthe female reproductive tract within the time frame.\n\n2. Required\nKnowledge and\nAttitudes\n2.1\nProcedures on semen preparation and deposition\n2.2\nReproductive system and estrous cycle of large\nruminants\n2.3\nWaste management\n2.4\nPractice 3R’s and 5S\n2.5\nCommunication\n2.5.1\nPreparation of inventory reports, production\nand performance records.\n2.6\nSafety Practices\n2.6.1\nPersonal protective paraphernalia or device\n2.6.2\nHumane handling of the animal\n2.7\nCodes and Regulations\n2.7.1\nAnimal Welfare Act (RA 8485)\n2.8\nValues\n2.8.1\nPunctuality\n2.8.2\nPersonal hygiene\n2.8.3\nAbility to work well with others harmoniously\n3. Required Skills\n3.1\nWork safety\n3.2\nSensory and motor skills\n3.3\nCommunication skills\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1.\nOral interview\n4.2.\nPractical demonstration with questioning\n4.3.\nObservation with questioning\n4.4.\nThird party report\n4.5.\nPortfolio (certificates, awards, recognition,\ncommendations, etc.)\n5. Resource\nImplication\n\n5.1\nPractice animals\n5.2\nFrozen semen\n5.3\nFarm facilities with chute\n5.4\nArtificial Insemination paraphernalia and supplies\n5.5\nPersonal Protective Paraphernalia\n5.6\nForms\n6. Context of\nAssessment\n\n6.1\nCompetency may be assessed individually in the\nactual workplace or through accredited\nfarms/institution.\n\n--- PDF PAGE 35 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n33\n\nUNIT OF COMPETENCY\n:\nPREPARE FOR ARTIFICIAL INSEMINATION (AI)\nDOCUMENTATIONS AND REPORTS\nUNIT CODE\n:\nAGR621208\n\nUNIT DESCRIPTOR\n:\nThis unit covers the required documentation for\ntechnicians in the conduct of artificial insemination\nand related activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalized terms are elaborated in the Range of Variable\n1. Collect and process data\n1.1. Necessary forms are secured from partners.\n1.2. Data is collected and processed as required in\nthe forms.\n1.3. Photos and other pertinent information are\ngathered as needed.\n1.4. Evidence for breed registry is secured, as\nneeded\n2. Accomplish and submit\nforms\n2.1. Forms are accomplished and submitted to\nconcerned partners.\n2.2. Summary report is prepared and submitted\nusing required forms.\n2.3. File copies of accomplished forms and summary\nreport are kept and compiled by technicians\naccording to required filing procedures.\n\n--- PDF PAGE 36 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n34\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Necessary forms\nThis may include but not limited to the following:\n1.1. AI service form\n1.2. Semen utilization form\n1.3. Requisition Issuance Slip (RIS) or logbook\n2. Data\nThis refers to the following:\n2.1. Date and time of AI\n2.2. Sire\n2.3. Client’s name\n2.4. Address of the clients\n2.5. Age of animal\n2.6. Number of calving\n2.7. Breed\n2.8. Pregnancy diagnosis\n2.9. Type of estrus\n2.10. Name of Technician\n2.11. Site of deposition\n2.12. Body condition score\n3. Concerned partners\nThis includes the following:\n3.1. PCC\n3.2. NDA\n3.3. BAI-UNAIP\n3.4. Private suppliers\n3.5. Local government units (LGUs)\n3.6. DA Regional Field Units (DA-RFU)\n4. Summary of report\nThis may include, but not limited to:\n4.1. Summary of AI service data\n4.2. Pregnancy diagnosis\n4.3. Calf drop\n4.4. Semen utilization, as needed\n\n--- PDF PAGE 37 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n35\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated data collection and processing.\n1.2. Made entries to required forms for submission.\n1.3. Prepared summary report for submission.\n2. Required\nKnowledge and\nAttitudes\n2.1 Familiarity with all the necessary forms.\n2.2 Familiarity with semen code and sire directory\n2.3 Familiarity with gestation lengths of large ruminants\n2.4 Familiarity with breeds of large ruminants\n2.5 Knowledge on basic animal husbandry practices\n2.6 Practice 3R’s and 5S\n2.7 Systematic, thorough, and prompt in the accomplishment\nand submission of reports\n3. Required Skills\n3.1 Basic record-keeping\n3.2 Arithmetic (Multiplication, Division, Addition and\nSubtraction)\n3.3 Communication skills\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1. Oral interview\n4.2. Demonstration with questioning\n4.3. Third party report\n4.4. Portfolio\n5. Resource\nImplication\n\n5.1 Required forms\n5.2 Communication equipment\n5.3 Calculator\n5.4 Breeding calendars\n5.5 Filing cabinets\n5.6 Ball pens/Pencils\n5.7 Camera\n5.8. Animals\n5.9 Tickler\n6. Context of\nAssessment\n6.1. Competency may be assessed individually in the actual\nworkplace or through accredited farms/institution.\n\n--- PDF PAGE 38 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n36\nELECTIVE COMPETENCY\n\nUNIT OF COMPETENCY: CONDUCT ARITIFICIAL INSEMINATION AWARENESS\nFOR CLIENTELE\n\nUNIT CODE : AGR621209\n\nUNIT DESCRIPTOR : This unit involves the skills, knowledge and attitudes\nrequired to conduct community awareness program on\nartificial insemination to the wider public. It includes\ncompetencies in preparing for the conduct and carrying-\nout of awareness activities for clientele.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for the\nconduct of\nawareness\nactivities for\nclientele\n1.1. Clientele consultation is conducted to ensure that\nprograms meet their needs.\n1.2. Coordination with local government and relevant\npersonnel is carried-out to determine objectives of the\nprogram.\n1.3. Awareness activities are structured and finalized with\nreference to the objectives.\n1.4. Relevant equipment, aids and other materials to be\nused are sourced and organized.\n2. Carry-out\nawareness\nactivities for\nclientele\n2.1. Information on artificial insemination is presented to the\ntarget clients in a clear and logical sequence.\n2.2. Awareness activities are conducted using effective\npublic speaking techniques.\n2.3. Effective approach is used to assist the clientele in\nunderstanding the program.\n2.4. Opportunities are provided for the clientele to seek\nclarification on important points.\n2.5. Routine clients questions are answered and\nsupplemented with relevant information as needed.\n2.6. Queries outside the area of responsibility or expertise are\nreferred to appropriate personnel/area.\n2.7. Objections and adverse reactions are handled fittingly.\n\n--- PDF PAGE 39 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n37\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Clientele\nThis may include, but not limited to:\n1.1Individuals\n•\nFarmers\n•\nRanchers\n•\nAnimal enthusiasts/hobbyists\n•\nPet owners\n1.2Groups and institutions:\n•\nFarmer’s Cooperatives\n•\nCommunity groups\n•\nSchools and Training Providers\n•\nLocal Government Units\n2. Clientele consultation\nClientele consultation includes the following :\n2.1\nDetermining community expectations and needs\n2.2\nRaising community awareness on existing activities\nrelating to artificial insemination (AI)\n3. Equipment, aids and\nother materials\nThese may include the following but not limited to:\n3.1Equipment:\n•\ndata projector\n•\noverhead projector\n•\nvideo and audio-recordings\n•\nwhiteboard\n3.2Aids and materials:\n•\nCD-ROMs\n•\ncharts and posters\n•\ndata projector slides/shows\n•\ndiagrams\n•\nhandouts\n•\ninformation kits\n•\nmedia articles\n•\nmodels\n•\nnewsletters\n•\noverhead transparencies\n•\npamphlets\n•\nshow bags\n•\nvideos\n•\nwebsite material.\n4. Public speaking\ntechnique\nThis may include, but not limited to:\n4.1\naccent\n4.2\naudience interaction\n4.3\nbody language\n4.4\neye contact\n4.5\ninflection\n4.6\npace of speech\n4.7\ntone of voice\n5. Approach\nMay include but are not limited to:\n5.1\nface to face\n5.2\npersonal visitation\n5.3\nfilm viewing/visual presentation\n5.4\ninformation materials (eg. Pamphlets)\n5.5\nover the telephone and text messaging\n5.6\ninternet\n5.7\ndemonstration/orientation\n6. Routine clients\nquestions\n\nRoutine clients questions may relate but not limited to:\n6.1\nprice\n6.2\nfeatures\n6.3\nadvantages and benefits\n\n--- PDF PAGE 40 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n38\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPrepared for the conduct of awareness activities for\nclientele\n1.2\nCarry-out awareness activities for clientele\n2. Required\nKnowledge and\nAttitudes\n2.1\nData collection methods to support the development\nof materials\n2.2\nLegislation relevant to the subject matter of the\npresentation\n2.3\nOrganisational policies and procedures relating to\npresenting information to the public\n2.4\nPrinciples of animal welfare and ethics\n2.5\nPractice 3R’s and 5S\n2.6\nRange of presentation aids and materials available to\nsupport the presentation\n2.7\nRange of communication strategies\n2.8\nRelevant and current community awareness programs\n2.9\nTechnical information relevant to the presentation or\nsubject matter.\n2.10\nAttitude\n2.10.1 Courtesy\n2.10.2 Patience\n2.10.3 Innovative\n2.10.4 Resourceful\n3. Required Skills\n3.1\nListening questioning techniques.\n3.2\nVerbal and non-verbal communication skills\n3.2.1 negotiation techniques.\n3.2.2 types and clients needs\n3.2.3 handling clients objections\n3.2.4 performance analysis techniques\n3.3\nBasic level of artificial insemination (AI) servicing\n3.4\nPublic speaking skills to include\n3.4.1 opening techniques to awaken clients interest\n3.4.2 strategies to focus clients specific needs\n3.4.3 answering clients questions\n3.4.4 handling customer objections and adverse\nreactions\n3.5\nSkills in making aids and presentation materials\n4. Resource Implications\nThe following resource MUST be provided:\n4.1\na work environment\n4.2\nrelevant documentation, such as policy and\nprocedures manuals\n4.3\na range of clients with different requirements\n4.4\npromotional materials (films, pamphlets,\npresentations, etc.)\n4.5\ncommunication gadgets (telephone, cellphone, etc.)\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nObservation with questioning\n5.2\nDemonstration with questioning\n5.3\nThird-party reports\n5.4\nOral questioning/Interview\n5.5\nPortfolio assessment\n6. Context of\nAssessment\n6.1 Assessment may be performed in the workplace or\nsimulated workplace situation\n6.2 Assessment activities are carried out through\nTESDA's accredited assessment center\n\n--- PDF PAGE 41 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n39"
