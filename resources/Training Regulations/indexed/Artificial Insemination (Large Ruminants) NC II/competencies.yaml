          "source_text": "1. Prepare  for the \nconduct of \nawareness \nactivities for \nclientele  \n1.1. Clientele consultation is conducted to ensure that \nprograms meet their needs. \n1.2. Coordination with local government and relevant \npersonnel is carried-out to determine objectives of the \nprogram. \n1.3. Awareness activities are structured and finalized with \nreference to the objectives. \n1.4. Relevant equipment, aids and other materials to be \nused are sourced and organized. \n2. Carry-out \nawareness \nactivities for  \nclientele  \n2.1. Information on artificial insemination is presented to the \ntarget clients in a clear and logical sequence. \n2.2. Awareness activities are conducted using effective \npublic speaking techniques.  \n2.3. Effective approach is used to assist the clientele in \nunderstanding the program. \n2.4. Opportunities are provided for the clientele to seek \nclarification on important points. \n2.5. Routine clients questions are answered and \nsupplemented with relevant information as needed. \n2.6. Queries outside the area of responsibility or expertise are \nreferred to appropriate personnel/area. \n2.7. Objections and adverse reactions are handled fittingly.\n\n--- PDF PAGE 39 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II \n37 \nRANGE OF VARIABLES  \nVARIABLE \nRANGE \n1. Clientele\nThis may include, but not limited to:\n1.1Individuals \n \nFarmers \n \nRanchers  \n \nAnimal enthusiasts/hobbyists \n \nPet owners \n1.2Groups and institutions: \n \nFarmer’s Cooperatives \n \nCommunity groups \n \nSchools and Training Providers \n \nLocal Government Units\n2. Clientele consultation\nClientele consultation includes the following :\n2.1 \nDetermining community expectations and needs \n2.2 \nRaising community awareness on existing activities \nrelating to artificial insemination (AI) \n3. Equipment, aids and \nother materials \nThese may include the following but not limited to:\n3.1Equipment:  \n \ndata projector  \n \noverhead projector  \n \nvideo and audio-recordings  \n \nwhiteboard  \n3.2Aids and materials:  \n \nCD-ROMs  \n \ncharts and posters  \n \ndata projector slides/shows  \n \ndiagrams  \n \nhandouts  \n \ninformation kits  \n \nmedia articles  \n \nmodels  \n \nnewsletters  \n \noverhead transparencies  \n \npamphlets  \n \nshow bags  \n \nvideos  \n \nwebsite material. \n4. Public speaking \ntechnique \nThis may include, but not limited to:\n4.1 \naccent  \n4.2 \naudience interaction  \n4.3 \nbody language  \n4.4 \neye contact  \n4.5 \ninflection  \n4.6 \npace of speech  \n4.7\ntone of voice \n5. Approach\nMay include but are not limited to:\n5.1 \nface to face  \n5.2 \npersonal visitation \n5.3 \nfilm viewing/visual presentation \n5.4 \ninformation materials (eg. Pamphlets) \n5.5 \nover the telephone and text messaging \n5.6 \ninternet \n5.7\ndemonstration/orientation\n6. Routine clients \nquestions \n \nRoutine clients questions may relate  but not limited to:\n6.1 \nprice  \n6.2 \nfeatures  \n6.3\nadvantages and benefits\n\n--- PDF PAGE 40 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II \n38"
