        "source_title": "CONDUCT ARITIFICIAL INSEMINATION AWARENESS FOR CLIENTELE",
        "source_text": "--- PDF PAGE 38 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II \n36 \nELECTIVE COMPETENCY \n \nUNIT OF COMPETENCY: CONDUCT ARITIFICIAL INSEMINATION AWARENESS \nFOR CLIENTELE \n \nUNIT CODE                     :   AGR621209 \n \nUNIT DESCRIPTOR      :  This unit involves the skills, knowledge and attitudes \nrequired to conduct community awareness program on \nartificial insemination to the wider public. It includes \ncompetencies in preparing for the conduct and carrying-\nout of awareness activities for clientele. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare  for the \nconduct of \nawareness \nactivities for \nclientele  \n1.1. Clientele consultation is conducted to ensure that \nprograms meet their needs. \n1.2. Coordination with local government and relevant \npersonnel is carried-out to determine objectives of the \nprogram. \n1.3. Awareness activities are structured and finalized with \nreference to the objectives. \n1.4. Relevant equipment, aids and other materials to be \nused are sourced and organized. \n2. Carry-out \nawareness \nactivities for  \nclientele  \n2.1. Information on artificial insemination is presented to the \ntarget clients in a clear and logical sequence. \n2.2. Awareness activities are conducted using effective \npublic speaking techniques.  \n2.3. Effective approach is used to assist the clientele in \nunderstanding the program. \n2.4. Opportunities are provided for the clientele to seek \nclarification on important points. \n2.5. Routine clients questions are answered and \nsupplemented with relevant information as needed. \n2.6. Queries outside the area of responsibility or expertise are \nreferred to appropriate personnel/area. \n2.7. Objections and adverse reactions are handled fittingly.\n\n--- PDF PAGE 39 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II \n37 \nRANGE OF VARIABLES  \nVARIABLE \nRANGE \n1. Clientele\nThis may include, but not limited to:\n1.1Individuals \n \nFarmers \n \nRanchers  \n \nAnimal enthusiasts/hobbyists \n \nPet owners \n1.2Groups and institutions: \n \nFarmer’s Cooperatives \n \nCommunity groups \n \nSchools and Training Providers \n \nLocal Government Units\n2. Clientele consultation\nClientele consultation includes the following :\n2.1 \nDetermining community expectations and needs \n2.2 \nRaising community awareness on existing activities \nrelating to artificial insemination (AI) \n3. Equipment, aids and \nother materials \nThese may include the following but not limited to:\n3.1Equipment:  \n \ndata projector  \n \noverhead projector  \n \nvideo and audio-recordings  \n \nwhiteboard  \n3.2Aids and materials:  \n \nCD-ROMs  \n \ncharts and posters  \n \ndata projector slides/shows  \n \ndiagrams  \n \nhandouts  \n \ninformation kits  \n \nmedia articles  \n \nmodels  \n \nnewsletters  \n \noverhead transparencies  \n \npamphlets  \n \nshow bags  \n \nvideos  \n \nwebsite material. \n4. Public speaking \ntechnique \nThis may include, but not limited to:\n4.1 \naccent  \n4.2 \naudience interaction  \n4.3 \nbody language  \n4.4 \neye contact  \n4.5 \ninflection  \n4.6 \npace of speech  \n4.7\ntone of voice \n5. Approach\nMay include but are not limited to:\n5.1 \nface to face  \n5.2 \npersonal visitation \n5.3 \nfilm viewing/visual presentation \n5.4 \ninformation materials (eg. Pamphlets) \n5.5 \nover the telephone and text messaging \n5.6 \ninternet \n5.7\ndemonstration/orientation\n6. Routine clients \nquestions \n \nRoutine clients questions may relate  but not limited to:\n6.1 \nprice  \n6.2 \nfeatures  \n6.3\nadvantages and benefits\n\n--- PDF PAGE 40 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II \n38 \nEVIDENCE GUIDE \n1.   Critical aspects of \nCompetency \n \nAssessment requires evidence that the candidate:\n1.1 \nPrepared for the conduct of awareness activities for \nclientele \n1.2\nCarry-out awareness activities for clientele\n2.  Required \nKnowledge and \nAttitudes \n2.1\nData collection methods to support the development \nof materials  \n2.2 \nLegislation relevant to the subject matter of the \npresentation  \n2.3 \nOrganisational policies and procedures relating to \npresenting information to the public  \n2.4 \nPrinciples of animal welfare and ethics  \n2.5 \nPractice 3R’s and 5S \n2.6 \nRange of presentation aids and materials available to \nsupport the presentation  \n2.7 \nRange of communication strategies  \n2.8 \nRelevant and current community awareness programs \n2.9 \nTechnical information relevant to the presentation or \nsubject matter. \n2.10 \nAttitude \n2.10.1 Courtesy \n2.10.2 Patience \n2.10.3 Innovative \n2.10.4 Resourceful\n3.  Required Skills\n3.1\nListening questioning techniques.\n3.2 \nVerbal and non-verbal communication skills \n3.2.1 negotiation techniques. \n3.2.2 types and clients needs \n3.2.3 handling clients objections \n3.2.4 performance analysis techniques \n3.3 \nBasic level of artificial insemination (AI) servicing \n3.4 \nPublic speaking skills to include \n3.4.1 opening techniques to awaken clients interest \n3.4.2 strategies to focus clients specific needs \n3.4.3 answering clients questions \n3.4.4 handling customer objections and adverse \nreactions \n3.5\nSkills in making aids and presentation materials\n4. Resource Implications\nThe following resource MUST be provided:\n4.1 \na work environment \n4.2 \nrelevant documentation, such as policy and \nprocedures manuals \n4.3 \na range of clients with different requirements \n4.4 \npromotional materials (films, pamphlets, \npresentations, etc.) \n4.5\ncommunication gadgets (telephone, cellphone, etc.)\n5.   Methods of \nAssessment \nCompetency may be assessed through:\n5.1 \nObservation with questioning \n5.2 \nDemonstration with questioning \n5.3 \nThird-party reports  \n5.4 \nOral questioning/Interview \n5.5\nPortfolio assessment\n6.   Context of \nAssessment \n6.1    Assessment may be performed in the workplace or \nsimulated workplace situation \n6.2     Assessment activities are carried out through \nTESDA's accredited assessment center\n",
