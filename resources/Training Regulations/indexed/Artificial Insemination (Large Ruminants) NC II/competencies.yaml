elated \ndocuments \n3.1\nRange of forms relating to conditions of employment \nare completed accurately and legibly \n3.2 Workplace data is recorded on standard workplace \nforms and documents \n3.3 Basic mathematical processes are used for routine \ncalculations \n3.4 Errors in recording information on forms/ documents \nare identified and properly acted upon \n3.5 Reporting requirements to supervisor are completed \naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II \n3 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \n1.1. \nTeam members \n1.2. \nSuppliers \n1.3. \nTrade personnel \n1.4. \nLocal government \n1.5. \nIndustry bodies \n2. Medium \n2.1. \nMemorandum \n2.2. \nCircular \n2.3. \nNotice \n2.4. \nInformation discussion \n2.5. \nFollow-up or verbal  instructions \n2.6. \nFace to face communication \n3. Storage \n3.1. \nManual filing system \n3.2. \nComputer-based filing system \n4. Forms \n4.1. \nPersonnel forms, telephone message forms, \nsafety reports \n5. Workplace interactions \n5.1. \nFace to face \n5.2. \nTelephone \n5.3. \nElectronic and two way radio \n5.4. \nWritten including electronic, memos, instruction \nand forms, non-verbal including gestures, \nsignals, signs and diagrams \n \n6. Protocols \n6.1. \nObserving meeting \n6.2. \nCompliance with meeting decisions \n6.3. \nObeying meeting instructions\n\n--- PDF PAGE 6 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II \n4 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared written communication following standard \nformat  of the organization \n1.2 \nAccessed information using communication \nequipment \n1.3 \nMade use of relevant terms as an aid to transfer \ninformation effectively \n1.4 \nConveyed information effectively adopting the formal \nor informal communication \n \n2. Required Knowledge \nand Attitudes \n2.1 \nEffective 