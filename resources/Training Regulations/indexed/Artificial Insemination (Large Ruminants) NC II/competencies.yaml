        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined areas of concern for safety measures\n1.2\nApplied appropriate safety measures according to\nindustry requirements\n1.3\nPrepared tools, materials and outfit needed\n1.4\nPerformed proper disposal of used materials\n1.5\nSafekeep/cleaned tools, materials and outfit in\ndesignated facilities\n2. Required\nKnowledge and\nAttitude\n2.1\nSafety Practices\n2.1.1 Implementation of regulatory controls and policies\nrelative to treatment of area and application of\nchemicals\n2.1.2 Proper disposal of waste materials\n2.2\nCodes and Regulations\n2.2.1 Compliance to health program of DOH and DENR\n2.2.2 Hazard identification\n2.2.3 Emergency procedures\n2.3\nTools & Equipment: Uses and Specification\n2.3.1 Masks, gloves, boots, overall coats for health\nprotection\n2.4\nMaintenance\n2.4.1 Regular check-up and repair of tools, materials\nand outfit before and after use\n3. Required Skills\n3.1\nAbility to recognize effective tools, materials and outfit\n3.2\nReady skills required to read labels, manuals and other\nbasic safety information\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nPractical demonstration\n4.2\nThird Party Report\n5. Resource\nImplications\n5.1\nFarm location\n5.2\nTools, equipment and outfits appropriate in applying\nsafety measures\n6. Context of\nAssessment\nAssessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 19 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n17\nUNIT TITLE\n: USE FARM TOOLS AND EQUIPMENT\n\nUNIT CODE\n:"
        },
        "source_text": "AGR321201\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes required to\nperform safety measures effectively and efficiently. It includes\nidentifying areas, tools, materials, time and place in\nperforming safety measures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the Range of Variables\n1. Determine areas of\nconcern for safety\nmeasures\n1.1\nWork tasks are identified in line with farm\noperations\n1.2\nPlace for safety measures are determined in\nline with farm operations\n1.3\nTime for safety measures are determined in line\nwith farm operations\n1.4\nAppropriate tools, materials and outfits are\nprepared in line with job requirements\n2. Apply appropriate safety\nmeasures\n2.1\nTools and materials are used according to\nspecifications and procedures\n2.2\nOutfits are worn according to farm requirements\n2.3\nEffectivity/shelf life/expiration of materials are\nstrictly observed\n2.4\nEmergency procedures are known and\nfollowed to ensure a safework requirement\n2.5\nHazards in the workplace are identified and\nreported in line with farm guidelines\n3. Safekeep/dispose tools,\nmaterials and outfit\n3.1\nUsed tools and outfit are cleaned after use and\nstored in designated areas\n3.2\nUnused materials are properly labeled and\nstored according to manufacturers\nrecommendation and farm requirements\n3.3\nWaste materials are disposed according to\nmanufacturers, government and farm\nrequirements\n\n--- PDF PAGE 17 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work tasks\nWork task may be selected from any of the subsectors:\n1.1 Aquaculture\n1.2 Animal Production\n1.3 Crop Production\n1.4 Post-harvest\n1.5 Agri-marketing\n1.6 Farm Equipment\n2. Place\n2.1\nAnimal pens, cages, barns\n2.2 Fish ponds, cages\n2.3 Stock room/storage areas/warehouse\n2.4 Field/farm/orchard\n3. Time\n3.1\nVaccination and medication period\n3.2 Fertilizer and pesticides application\n3.3 Feed mixing and feeding\n3.4 Harvesting and hauling\n3.5 Cleaning, sanitizing and disinfecting\n3.6 Dressing, butchering and castration\n4. Tools, materials\nand outfits\n4.1\nTools\n4.1.1\nWrenches\n4.1.2\nScrew driver\n4.1.3\nPliers\n4.2 Materials\n4.2.1\nBottles\n4.2.2\nPlastic\n4.2.3\nBags\n4.2.4\nSyringe\n4.3 Outfit\n4.3.1\nMasks\n4.3.2\nGloves\n4.3.3\nBoots\n4.3.4\nOverall coats\n4.3.5\nHat\n4.3.6\nEye goggles\n5. Emergency\nprocedures\n5.1\nLocation of first aid kit\n5.2 Evacuation\n5.3 Agencies contract\n5.4 Farm emergency procedures\n6. Waste materials\n6.1\nAnimal manure\n6.2 Waste water\n6.3 Syringes\n6.4 Unused farm chemicals e.g. pesticides, chemicals,\nfertilizers\n6.5 Expired reagents\n6.6 Dead animals\n7. Hazards\n7.1\nChemical\n7.2 Electrical\n7.3\nFalls\n\n--- PDF PAGE 18 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n16\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDetermined areas of concern for safety measures\n1.2\nApplied appropriate safety measures according to\nindustry requirements\n1.3\nPrepared tools, materials and outfit needed\n1.4\nPerformed proper disposal of used materials\n1.5\nSafekeep/cleaned tools, materials and outfit in\ndesignated facilities\n2. Required\nKnowledge and\nAttitude\n2.1\nSafety Practices\n2.1.1 Implementation of regulatory controls and policies\nrelative to treatment of area and application of\nchemicals\n2.1.2 Proper disposal of waste materials\n2.2\nCodes and Regulations\n2.2.1 Compliance to health program of DOH and DENR\n2.2.2 Hazard identification\n2.2.3 Emergency procedures\n2.3\nTools & Equipment: Uses and Specification\n2.3.1 Masks, gloves, boots, overall coats for health\nprotection\n2.4\nMaintenance\n2.4.1 Regular check-up and repair of tools, materials\nand outfit before and after use\n3. Required Skills\n3.1\nAbility to recognize effective tools, materials and outfit\n3.2\nReady skills required to read labels, manuals and other\nbasic safety information\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nPractical demonstration\n4.2\nThird Party Report\n5. Resource\nImplications\n5.1\nFarm location\n5.2\nTools, equipment and outfits appropriate in applying\nsafety measures\n6. Context of\nAssessment\nAssessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 19 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n17\nUNIT TITLE\n: USE FARM TOOLS AND EQUIPMENT\n\nUNIT CODE\n:"
