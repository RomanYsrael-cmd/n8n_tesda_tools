        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Required\nKnowledge and\nAttitudes\n2.1 Work values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.5 Personal hygiene practices\n3. Required Skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context of\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 13 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n11\n\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE :"
        },
        "source_text": "500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2\nIntra- and interpersonal relationships is are maintained\nin the course of managing oneself based on\nperformance evaluation\n1.3\nCommitment to the organization and its goal is\ndemonstrated in the performance of duties\n2. Set and meet work\npriorities\n2.1 Competing demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2 Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3 Practices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n3. Maintain professional\ngrowth and\ndevelopment\n3.1 Trainings and career opportunities are identified and\navailed of based on job requirements\n3.2 Recognitions are sought/received and demonstrated\nas proof of career advancement\n3.3 Licenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 11 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 12 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n10\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3 Completed trainings and career opportunities which are\nbased on the requirements of the industries\n1.4 Acquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Required\nKnowledge and\nAttitudes\n2.1 Work values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.5 Personal hygiene practices\n3. Required Skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context of\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 13 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n11\n\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE :"
