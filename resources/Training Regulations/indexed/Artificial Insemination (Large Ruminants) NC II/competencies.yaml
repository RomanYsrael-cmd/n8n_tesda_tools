        "source_text": "AGR321203\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes required to\nperform basic workplace calculations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized fonts are elaborated in the Range of Variables\n1. Perform estimation\n1.1\nJob requirements are identified from written or\noral communications\n1.2\nQuantities of materials and resources required to\ncomplete a work task are estimated\n1.3\nThe time needed to complete a work activity is\nestimated\n1.4\nAccurate estimate for work completion are made\n1.5\nEstimate of materials and resources are reported\nto appropriate person\n2. Perform basic workplace\ncalculation\n2.1\nCalculations to be made are identified\naccording to job requirements\n2.2\nCorrect method of calculation identified\n2.3\nSystem and units of measurement to be\nfollowed are ascertained\n2.4\nCalculation needed to complete work tasks are\nperformed using the four basic process of\naddition, division, multiplication and subtraction\n2.5\nCalculate whole fraction, percentage and mixed\nwhen are used to complete the instructions\n2.6\nNumber computed in self checked and\ncompleted for alignment\n\n--- PDF PAGE 23 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n21\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Calculations\n\n1.1\nQuantity of feeds\n1.2\nAmount of fertilizer\n1.3\nAmount of medicines\n2. Method of calculation\n\n2.1\nAddition\n2.2\nSubtraction\n2.3\nMultiplication\n2.4\nDivision\n2.5\nRatio and proportion\n3. System of measurement\n3.1\nEnglish\n3.2\nMetric\n\n4. Units of measurement\n4.1\nArea\n4.2\nVolume\n4.3\nWeight\n\n--- PDF PAGE 24 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n22\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPerformed estimation\n1.2\nPerformed basic workplace calculation\n1.3\nApplied corrective measures as maybe necessary\n2. Required\nKnowledge and\nAttitudes\n2.1\nMathematics\n2.1.1 Basic mathematical operations\n2.1.2 Percentage and ratios\n2.1.3 Unit Conversion\n2.1.4 Basic accounting principles and procedures\n2.1.1.1 Production cost\n2.1.1.2 Sales\n2.1.1.3 Accounts receivables/payables\n2.2\nSystems, Processes and Operations\n2.2.1 Knowledge in different management practices\nand operational procedures\n2.3\nValues\n2.3.1 Safety consciousness\n2.3.2 Time consciousness and management\n2.3.3 Cost consciousness\n2.3.4 Precision\n3. Required Skills\n3.1\nAbility to perform basic calculation\n3.2\nCommunicate effectively\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nPractical demonstration\n4.2\nWritten examination\n5. Resource\nImplications\n5.1\nRelevant tools and equipment for basic calculation\n5.2\nRecommended data\n6. Context of\nAssessment\n6.1\nAssessment may occur in the workplace or in a\nsimulated workplace or as part of a team under limited\nsupervision\n\n--- PDF PAGE 25 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n23\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nESTABLISH READINESS FOR ARTIFICIAL\nINSEMINATION\nUNIT CODE\n:"
