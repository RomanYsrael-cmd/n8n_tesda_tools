        "source_text": "AGR621205\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes\nrequired to establish animal readiness for artificial\ninsemination. It includes validation information on\nanimal and assessing animal condition.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalized fonts are elaborated in the Range of Variable\n1. Validate information on\nanimal\n1.1\nClient’s and animal’s profile are recorded\nusing the prescribed forms and accordance to\nstandard operating procedures.\n1.2\nTransactions and coordination is made in\naccordance to communication etiquette…\n1.3\nAccurate interpretation and decision is made\nbased on the gathered information\n2. Assess animal condition\n2.1\nPhysical condition of the animal is evaluated\nbased on recommended standards.\n2.2\nSigns of estrus are monitored.\n2.3\nAnimal is restrained using the prescribed chute.\n2.4\nExamination through rectal palpation is\nconducted to determine the animal’s\nreproductive condition.\n2.5\nTask is performed without causing injuries to\nthe animal, technician and others.\n2.6\nAccurate interpretation and decision is made\nbased on the result of the actual examination.\n\n--- PDF PAGE 26 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n24\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Clients\n1.1\nFarmers\n1.2\nRanchers\n1.3\nAnimal enthusiasts/hobbyists\n2. Animal’s profile\n2.1\nSpecies\n2.2\nIdentification number(ID number)\n2.3\nAge/date of birth\n2.4\nApproximate weight\n2.5\nBreed/Strain\n2.6\nNumber of calving\n2.7\nDate of last calving\n2.8\nDam and sire\n2.9\nDate of last estrus\n2.10 Date of last breeding\n3. Transactions and\ncoordination\n3.1\nFace to face\n3.2\nTelephone conversation\n3.3\nE-mail\n3.4\nText messaging\n4. Communication\netiquette\n4.1\nPoliteness\n4.2\nCourtesy\n4.3\nMaintain composure\n4.4\nPatience\n5. Recommended\nstandards\n5.1\nBody weight\n5.2\nBody size\n5.3\nBody condition score\n5.4\nApparently healthy\n5.5\nBreed standards\n6. Signs of estrus\n6.1\nSwelling and redness of vulvar lips\n6.2\nFrequent urination\n6.3\nBellowing\n6.4\nStanding still when mounted\n6.5\nMucus discharge from the vulva\n6.6\nRestlessness\n6.7\nLoss of appetite\n6.8\nTrailing other animals\n7. Animal’s\nreproductive\ncondition\n7.1\nPregnant or not pregnant\n7.2\nIn estrus or not in estrus\n7.3\nWith or without abnormalities\n\n--- PDF PAGE 27 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n25\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nMade accurate estrus detection\n2. Required\nKnowledge and\nAttitudes\n2.1. Knowledge, Theory, Practices and Systems Operations\n2.1.1. Pregnancy diagnosis\n2.1.2. Signs of estrus\n2.1.3. Species and breeds\n2.1.4. Animal conditions\n2.1.5. Practice 3Rs and 5S\n2.1.6. Program of work activities are implemented as\nscheduled\n2.2. Communication\n2.2.1. Preparation of inventory reports, production and\nperformance record\n2.3. Mathematics and Mensuration\n2.3.1. Basic mathematical operations\n2.4. Safety Practices\n2.4.1. Proper application use of tools, farm implements and\nequipment.\n2.4.2. Wear appropriate PPE\n2.4.3. Proper waste disposal\n2.4.4. Personal protective paraphernalia or device\n2.4.5. Restraining procedures\n2.4.6. Chute construction\n2.5. Codes and Regulations\n2.5.1. Comply with DA, DENR, FPA Laws, Rules and\nRegulations\n2.6. Materials, Tools & Equipment: Uses, Specifications and\nMaintenance\n2.6.1. Tools and Equipment\n2.6.1.1. Can understand and follow instructional\nmanuals\n2.6.1.2. Safe keeping of equipments every after use\n2.6.2. Materials\n2.6.2.1. Where to source good quality supplies,\nmaterials and equipment needed in the\noperation of the farm\n2.6.3. Maintenance\n2.6.3.1. Regular upkeep of equipments and facilities\n2.6.3.2. Preventive maintenance skills\n2.7\nBreeding calendar\n2.8\nCodes and Regulations\n2.8.1\nAnimal Welfare Act (RA 8485)\n2.9\nValues\n2.9.1\nPunctuality and patience\n2.9.2\nPersonal hygiene\n2.9.3\nAbility to work well with others harmoniously\n\n--- PDF PAGE 28 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n26\n\n3. Required Skills\n3.1\nWork safety\n3.2\nArithmetic (Multiplication, Division, Addition and\nSubtraction)\n3.3\nCommunicate effectively\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nOral interview\n4.2\nPractical demonstration with questioning\n4.3\nObservation with questioning\n4.4\nThird party report\n4.5\nPortfolio\n5. Resource\nImplication\n\n5.1\nPractice animals\n5.2\nFarm facilities with chute\n5.3\nArtificial Insemination paraphernalia and supplies\n5.4\nSafety paraphernalia\n5.5\nCommunication equipment\n5.6\nForms\n6. Context of\nAssessment\n6.1\nCompetency may be assessed individually in the actual\nworkplace or through accredited farms/institution.\n\n--- PDF PAGE 29 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II\n27\n\nUNIT OF COMPETENCY\n:\nPREPARE FOR ARTIFICIAL INSEMINATION\n\nUNIT CODE\n:"
