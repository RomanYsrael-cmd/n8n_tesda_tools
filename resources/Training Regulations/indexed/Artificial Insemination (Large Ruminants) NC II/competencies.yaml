s \n2.3 \nTools & Equipment: Uses and Specification \n2.3.1 Masks, gloves, boots, overall coats for health \nprotection \n2.4 \nMaintenance \n2.4.1 Regular check-up and repair of tools, materials \nand outfit before and after use \n3. Required Skills \n3.1 \nAbility to recognize effective tools, materials and outfit \n3.2 \nReady skills required to read labels, manuals and other \nbasic safety information \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1 \nPractical demonstration  \n4.2 \nThird Party Report \n5. Resource \nImplications \n5.1 \nFarm location \n5.2 \nTools, equipment and outfits appropriate in applying \nsafety measures \n6. Context of \nAssessment \nAssessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n",
