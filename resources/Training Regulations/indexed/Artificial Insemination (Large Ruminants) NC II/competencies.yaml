        "source_text": "--- PDF PAGE 29 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II \n27 \n \nUNIT OF COMPETENCY\n:\nPREPARE FOR ARTIFICIAL INSEMINATION \n \n \nUNIT CODE\n:\nAGR621206\nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes in the preparation and \ntransport of AI equipment, tools, supplies and \nmaterials, including hygiene and safety requirements \nto ensure the integrity and quality of the semen prior \nto the AI procedure.\n \nELEMENT \nPERFORMANCE CRITERIA \nItalized terms are elaborated in the Range of Variable \n1. Carry-out preparatory \nactivities  \n \n1.1 \nSourcing of semen and LN2 supplies is made from \nthe concerned partners  \n1.2 \nAI kit and LN2 tank with semen are prepared and \nsecured during transport . \n1.3 \nPreparation for AI is made in accordance with the \nhygiene and safety requirements. \n1.4 \nAnimal is restrained using suitable restraining \nprocedures.  \n \n2. Maintain semen quality  \n2.1. \nLiquid nitrogen (LN2) level is monitored using the \ndip stick and replenished when necessary.  \n2.2. \nSemen inventory is done and replenished as \nneeded based on recommended procedures. \n2.3. \nTasks are performed to ensure safety of the \ntechnician and other individuals.\n\n--- PDF PAGE 30 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II \n28 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Partners\nThe partners may include, but not limited to:\n1.1 \nPhilippine Carabao Center (PCC) \n1.2 \nNational Dairy Authority (NDA) \n1.3 \nBureau of Animal Industry (BAI) \n1.4 \nPrivate Suppliers \n1.5 \nLocal government units (LGUs) \n1.6\nDA Regional Field Units (DA-RFU)\n2. AI kit and other \nsupplies \nThis may include, but not limited to the following:\n2.1 \nAI Gun \n2.2 \nDisposable AI sheath \n2.3 \nDisposable shoulder length gloves \n2.4 \nSurgical Gloves \n2.5 \nPaper towels \n2.6 \nSemen straw scissors/cutters \n2.7 \nSemen straw forceps \n2.8 \nThermometer \n2.9 \nThawing jar \n2.10 Lubricant \n2.11 Disinfectant \n2.12 Brush  \n2.13 Apron/ Cover all \n2.14 Pail  \n2.15 Boots \n2.16 Disposable plastic waste bags\n3. Hygiene and safety \nrequirements \nThis refers to the following:\n3.1 \nWear personal protective paraphernalia( i.e. cover all/ \napron and boots) \n3.2 \nPersonal Hygiene(eg. no long nails) \n3.3 \nWear Shoulder-length and/or surgical gloves \n3.4\nUse of lubricant (soap)\n4. Suitable restraining \nprocedures. \nThis pertains to :\n4.1 \nChute measuring 2m L x 1 m W x 1.2 m H  \n4.2 \nHumane handling of animal \n4.3\nProcedures that ensure safety of handlers and animals\n5. Recommended \nprocedures \nThis refers to the following:\n5.1 \nLevel of canister relative  to the neck of tank \n5.2 \nTime elapsed when canister is near neck opening \n5.3 \nUse of long  forceps for transfer of semen \n5.4 \nSemen used should be compliant with Genetic \nImprovement Program (GIP) mating plan(carabao only)\n6. Semen inventory\nThis refers in checking the following information:\n6.1 \nSpecies \n6.2 \nBull ID Number/Name \n6.3 \nLocation in field tank \n6.4 \nNumber of straws \n6.5\nBreed\n7. Tasks\nTasks refer to the following:\n7.1 \nTransfer of semen into and from LN2 tank \n7.2 \nTransfer  of LN2 tank \n7.3 \nMaintenance of LN2 above the critical level \n7.4\nLN2 level measurement\n8. Safety\nIt implies the prevention from the following:\n8.1. \nSuffocation \n8.2.\nFrost bite/burn\n\n--- PDF PAGE 31 ---\nTR – ARTIFICIAL INSEMINATION (LARGE RUMINANTS) NC II \n29 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nDemonstrated semen handling and maintenance.  \n2. Required \nKnowledge and \nAttitudes \n2.1 \nAnimal restraining \n2.2 \nLN2 level maintenance \n2.3 \nSemen handling  \n2.4 \nPractice 3R’s and 5S \n2.5 \nCommunication \n2.5.1 Preparation of records.  \n2.6 \nSafety Practices \n2.6.1 Personal protective paraphernalia or devices \n2.6.2 Refilling of LN2  \n2.7 \nCodes and Regulations \n2.7.1 Handling of LN2 \n2.7.2 Animal Welfare Act (RA 8485) \n2.8 \nValues \n2.8.1 Patience \n2.8.2 Humane handling of animals\n3. Required Skills \n3.1 \nWork safety \n3.2 \nRecord keeping \n3.3 \nAnimal handling skills \n3.4 \nCommunication skills \n4. Method of \nAssessment \n \nCompetency in this unit must be assessed through: \n4.1. \nOral interview \n4.2. \nPractical demonstration with questioning  \n4.3. \nObservation with questioning \n4.4. \nThird party report  \n4.5. \nPortfolio \n5. Resource \nImplication \n \n5.1. \nPractice Animals \n5.2. \nFarm facilities with chute \n5.3. \nLN2 tank and LN2  \n5.4. \nFrozen semen \n5.5. \nAI paraphernalia and other supplies  \n5.6. \nPersonal protective paraphernalia and devices \n5.7. \nForms and logbook \n6. Context of \nAssessment \n6.1. \nCompetency may be assessed individually in the actual \nworkplace or through accredited farms/institution.\n",
