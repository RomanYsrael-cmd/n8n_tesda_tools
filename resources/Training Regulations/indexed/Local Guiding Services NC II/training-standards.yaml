    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: LOCAL GUIDING SERVICES NC Level: NC II\n\nNominal Training Duration: 18 Hrs. (Basic)\n 18 Hrs. (Common)\n 160 Hrs. (Core)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of LOCAL GUIDING SERVICES NC II such as coordinating tour\nprogram/itinerary; guiding and accompanying tourist in a locality in accordance with\nindustry standards. It covers the basic, common and core competencies.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n\nGroup\ndiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n3.4 Describe work as a team\nmember\n\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals\n3.2 Set and meet work priorities\n3.3 Maintain professional growth\nand development\n\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\n\nDiscussion\nPlant tour\nSymposium\nObservation\nInterview\n\n--- PDF PAGE 44 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 42\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate\nindustry\nknowledge\n1.1 Seek information on the\nindustry\n1.2 Update continuously relevant\nindustry knowledge\n\nLecture\nGroup\nDiscussion\nIndividual/\nGroup\nAssignment\n\nInterviews/\nQuestioning\nIndividual/Grou\np Project or\nReport\n2. Observe\nworkplace\nhygiene\nprocedures\n2.1 Follow hygiene procedures\n2.2 Identify and prevent hygiene\nrisk\n\nLecture\nDemonstration\nRole-play\nDemonstration\nWritten\nExamination\nInterviews/\nQuestioning\n\n3. Perform\ncomputer\noperations\n3.1 Plan and prepare task to be\n undertaken\n3.2 Input data into a computer\n3.3 Assess information using\ncomputer\n3.4 Produce/ output data using\ncomputer system\n3.5 Maintain computer system\n\nLecture\nGroup\nDiscussion\nTutorial or self-\npace\n\nInterviews/\nQuestioning\nDemonstration\nObservation\n4. Perform\nworkplace and\nsafety\npractices\n4.1 Practice workplace\nprocedures for health,safety\nand security practices\n4.2 Deal with emergency\nsituations\n4.3 Maintain safe personal\npresentation standards\n\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nWritten\nExamination\n5. Provide\neffective\ncustomer\nservice\n5.1 Greet customers\n5.2 Identify customer needs\n5.3 Deliver service to customer\n5.4 Handle queries through\ntelephone, fax machine,\ninternet and email\n5.5 Handle complaints,\nevaluation and\nrecommendations\n\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nObservation\n\n--- PDF PAGE 45 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 43\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Research\ninformation\nrelevant to the\nlocality and\ntour itinerary\n1.1 Sources information\n1.2 Arranges and files\n Information\n1.3 Develops tour scripts and\ncommentaries relevant to the\ntour itinerary and the interest\nof the clients\n\nDemonstration\nDiscussion\nFieldtrips to\ngateway\nterminals &\ntransport\ncompanies\n Written\nexamination\n Demonstration\nof practical\nskills\n2. Coordinate\ntour\narrangements\nfor clients\n2.1 Performs pre-arrival checks\n2.2 Manages tour arrangements\n2.3 Resolves complaints and\nother emergencies\n2.4 Performs post-departure\nactivities\n\nDemonstration\nDiscussion\nFieldtrips to\nnearby\ndestinations\nWritten\nexamination\nDemonstration\nof practical\nskills\n3. Accompany\nand guide\nclients in\naccordance\nwith the tour\nitinerary\n3.1 Meets and assist the clients\nupon arrival at the\ndestination\n3. 2 Accompanies and guides\nclients while on tour\n 3.3 Delivers information, tour\nspiels and commentaries\n3.4 Resolves complaints and\nother emergencies\n 3.5 Provides send-off assistance\nand hotel departure\nformalities\n3.6 Develops tour guide-tour\ndriver work relationship\n(teamwork)\n\nDemonstration\nDiscussion\nFieldtrips to\nnearby\ndestinations\nWritten\nexamination\nDemonstration\nof practical\nskills\n\n--- PDF PAGE 46 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 44"
