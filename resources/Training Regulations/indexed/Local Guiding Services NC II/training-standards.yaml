    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Local Guiding Services NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: LOCAL GUIDING SERVICES NC Level: NC II\n\nNominal Training Duration: 18 Hrs. (Basic)\n 18 Hrs. (Common)\n 160 Hrs. (Core)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of LOCAL GUIDING SERVICES NC II such as coordinating tour\nprogram/itinerary; guiding and accompanying tourist in a locality in accordance with\nindustry standards. It covers the basic, common and core competencies.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n\nGroup\ndiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n3.4 Describe work as a team\nmember\n\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals\n3.2 Set and meet work priorities\n3.3 Maintain professional growth\nand development\n\nDiscussion\nInteraction\n\nDemonstration\nObservation\nInterviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\n\nDiscussion\nPlant tour\nSymposium\nObservation\nInterview\n\n--- PDF PAGE 44 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 42\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Develop and\nupdate\nindustry\nknowledge\n1.1 Seek information on the\nindustry\n1.2 Update continuously relevant\nindustry knowledge\n\nLecture\nGroup\nDiscussion\nIndividual/\nGroup\nAssignment\n\nInterviews/\nQuestioning\nIndividual/Grou\np Project or\nReport\n2. Observe\nworkplace\nhygiene\nprocedures\n2.1 Follow hygiene procedures\n2.2 Identify and prevent hygiene\nrisk\n\nLecture\nDemonstration\nRole-play\nDemonstration\nWritten\nExamination\nInterviews/\nQuestioning\n\n3. Perform\ncomputer\noperations\n3.1 Plan and prepare task to be\n undertaken\n3.2 Input data into a computer\n3.3 Assess information using\ncomputer\n3.4 Produce/ output data using\ncomputer system\n3.5 Maintain computer system\n\nLecture\nGroup\nDiscussion\nTutorial or self-\npace\n\nInterviews/\nQuestioning\nDemonstration\nObservation\n4. Perform\nworkplace and\nsafety\npractices\n4.1 Practice workplace\nprocedures for health,safety\nand security practices\n4.2 Deal with emergency\nsituations\n4.3 Maintain safe personal\npresentation standards\n\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nWritten\nExamination\n5. Provide\neffective\ncustomer\nservice\n5.1 Greet customers\n5.2 Identify customer needs\n5.3 Deliver service to customer\n5.4 Handle queries through\ntelephone, fax machine,\ninternet and email\n5.5 Handle complaints,\nevaluation and\nrecommendations\n\nLecture\nDemonstration\nRole-play\nSimulation\nDemonstration\nInterviews/\nQuestioning\nObservation\n\n--- PDF PAGE 45 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 43\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Research\ninformation\nrelevant to the\nlocality and\ntour itinerary\n1.1 Sources information\n1.2 Arranges and files\n Information\n1.3 Develops tour scripts and\ncommentaries relevant to the\ntour itinerary and the interest\nof the clients\n\nDemonstration\nDiscussion\nFieldtrips to\ngateway\nterminals &\ntransport\ncompanies\n Written\nexamination\n Demonstration\nof practical\nskills\n2. Coordinate\ntour\narrangements\nfor clients\n2.1 Performs pre-arrival checks\n2.2 Manages tour arrangements\n2.3 Resolves complaints and\nother emergencies\n2.4 Performs post-departure\nactivities\n\nDemonstration\nDiscussion\nFieldtrips to\nnearby\ndestinations\nWritten\nexamination\nDemonstration\nof practical\nskills\n3. Accompany\nand guide\nclients in\naccordance\nwith the tour\nitinerary\n3.1 Meets and assist the clients\nupon arrival at the\ndestination\n3. 2 Accompanies and guides\nclients while on tour\n 3.3 Delivers information, tour\nspiels and commentaries\n3.4 Resolves complaints and\nother emergencies\n 3.5 Provides send-off assistance\nand hotel departure\nformalities\n3.6 Develops tour guide-tour\ndriver work relationship\n(teamwork)\n\nDemonstration\nDiscussion\nFieldtrips to\nnearby\ndestinations\nWritten\nexamination\nDemonstration\nof practical\nskills\n\n--- PDF PAGE 46 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 44\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery modes,\nboth on and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities may be adopted when\ndesigning training programs:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n•\nModular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer facilitates the\ntraining delivery\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given\nthe opportunity to assist the slow learners.\n•\n Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, or audio, video or\ncomputer technologies.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\n Trainees or students wishing to gain entry into this course should satisfy the\nfollowing requirements:\n\n•\ncan communicate well in oral and written language; and\n•\ncan perform basic mathematical computation.\n\n This list does not include specific institutional requirements such as educational\nattainment, appropriate work experience, and others that may be required of the trainees\nby the school or training center delivering the TVET program.\n\n--- PDF PAGE 47 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 45\n3.4\nTOOLS, EQUIPMENT AND MATERIALS\n\nLOCAL GUIDING SERVICES – NC II\n\nRecommended materials, tools and equipment for the training of 25 trainees for\nLocal Guiding Services NC II\n\nTOOLS\nEQUIPMENT\n\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n25\nGeneral Information\nSheets\n1\nBull-horn\n12\nComputer with\nInternet access\n6\nDestination brochures\n1\nWhistle\n1\nTourist bus with public\naddress system\n6\nActual suppliers’\nbrochures\n1\nTour flag/tour\nbanner\n\n1\nEnterprise Policies and\nProcedures Manual -\nSOP\n\n25\n\nWriting material\n\n3\nSample tour itinerary\n1\nWhite board with\nwhite board markers\n\n25\nList of sample tour\ncomponents\n\n25\nSample accounting\ndocuments – petty\ncash and cash\nadvance voucher\n1\nFirst aid kit\n\n25\nSample tour\nvoucher/exchange\norder\n3\nMan-made indoor\ntourist attraction or\nsite\n\n25\nSample reservation\nrequest and\nconfirmation slips\n3\nNatural or man-\nmade outdoor tourist\nsite or attraction\n\n25\nList of emergency\nservices with contact\ndetails\n\n25\nTransportation fares\nand schedules\n\n25\nList of significant\nhistorical events and\nfigures\n\n25\nList of major natural\nand man-made\nattractions\n\n25\nRelevant data (socio-\neconomic,\ntrade/industry, etc)\n\n25\nGlossary of travel and\ntour terms\n\n*NOTE:\nImplementation of the training program can be made possible through a MOA between\nthe Training school and Industry for the use of the facilities. This is in response to the\nlimitations of schools due to high cost of equipment. Air-conditioned vehicles can be hired on\na per trip basis subject to requirement.\n\n--- PDF PAGE 48 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 46\n\n3.5\nTRAINING FACILITIES\n\nLOCAL GUIDING SERVICES – NC II\n\nBased on a class size of 25 students/trainees:\n\nSpace Requirement\nSize in\nMeters\nArea in Sq.\nMeters\nTotal Area in Sq.\nMeters\nStudent/Trainee Working\nSpace\n1 x 1 m.\n1 sq. m.\n25 sq. m\nLecture/Demo Room\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nLearning Resource Center\n3 x 5 m.\n15 sq. m.\n15 sq. m.\nFacilities/Equipment/\nCirculation Area\n\n24 sq. m.\nTotal workshop area:\n104 sq. m.\n\n3.6\nTRAINERS’ QUALIFICATION FOR TOURISM SECTOR (TRAVEL AND TOUR)\n\nLOCAL GUIDING SERVICES – NC II\nTRAINER’S QUALIFICATIONS\n• Must be a holder of National TVET Trainer Certification (NTTC) Level I in Local\nGuiding Services NC II\n• Duly Licensed by the LGU (Provincial, City or Municipal Level) and duly\nAccredited by the Department of Tourism DOT\n• Must be computer-literate\n• Must have at least 2 years job/industry experience\n\n3.7\n INSTITUTIONAL ASSESSMENT\n\n Institutional assessment is undertaken by trainees to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of\ncompetency.\n\n--- PDF PAGE 49 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 47"
