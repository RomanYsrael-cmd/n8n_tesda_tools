          "source_text": "1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPerformed pre – arrival checks  \n1.2 \nCoordinated tour arrangements  \n1.3 \nResolved complaints and other emergencies \n1.4 \nPerformed post – departure activities \n \n2.  Required Knowledge   \n2.1 \nCheck-in and check-out procedures \n2.1.1 Transportation company \n2.1.2 Lodging establishment  \n2.1.3 Any other establishment \n2.2 \nStandard Operating Procedures  \n2.2.1 Transportation company \n2.2.2 Lodging establishment  \n2.2.3 Other visitor-related establishments \n2.3 \nKnowledge of room categories, room types and \npublished rates and the schedules of airlines, shipping \ncompanies, bus / train companies \n2.4 \nKnowledge of other suppliers’ locations, amenities, \nservice, facilities, highlights and rates \n2.5 \nLocal/municipal travel tour regulation and ordinances \n2.6 \nAccommodations, restaurants, shopping sites and \ntourism-related establishments in the \nlocality/destination \n \n3.  Required Skills  \n3.1 \nEnglish language–fluency and effective \ncommunication skills  \n3.2 \nUse of telephone, fax and two – way radio \n3.3 \nCultural sensitivity awareness and practices \n3.4 \nDecision-making and problem solving skills  \n3.5 \nPeople skills (Emotional Quotient (EQ)) \n \n4.  Resource Implications \nThe following resources should be provided: \n4.1 \nTelephone / two – way radio, fax and computer \n4.2 \nWorkplace location \n \n5.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1 \nInterview \n5.2 \nWritten test \n5.3 \nObservation and simulated or actual demonstration \n \n6.  Context for \nAssessment \n6.1 \nAssessment may be done in the workplace or in a \nsimulated workplace setting (Accredited TESDA \nassessment centers)",
