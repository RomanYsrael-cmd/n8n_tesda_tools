        "source_title": "PROVIDE EFFECTIVE CUSTOMER SERVICE",
        "source_text": "--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – LOCAL GUIDING SERVICES NC II (Amended)                  Promulgated December 2013 \n 26 \nUNIT OF COMPETENCY : \nPROVIDE EFFECTIVE CUSTOMER SERVICE \n \nUNIT CODE \n \n: \nTRS311205 \n \nUNIT DESCRIPTOR \n: \nThis unit of competency deals with the knowledge, skills \nand attitudes in providing effective customer service. It \nincludes greeting customer, identifying customer needs, \ndelivering service to customer, handling queries through \ntelephone, fax machine, internet and email and handling \ncomplaints, evaluation and recommendation. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized  items are elaborated in the Range of Variables \n1.  Greet customer \n1.1 \nGuests are greeted in line with enterprise procedure \n1.2 \nVerbal and non-verbal communications are \nappropriate to the given situation \n1.3 \nNon verbal communication of customer is observed \nresponding to customer \n1.4 \nSensitivity to cultural and social differences is \ndemonstrated \n \n2.  Identify customer \nneeds \n2.1 \nAppropriate interpersonal skills are used to ensure \nthat customer needs are accurately identified \n2.2 \nCustomer needs are assessed for urgency so that \npriority for service delivery can be identified \n2.3 \nCustomers are provided with information \n2.4 \nPersonal limitation in addressing customer needs is \nidentified and where appropriate, assistance is sought \nfrom supervisor \n \n3.  Deliver service to   \ncustomer \n3.1 \nCustomer needs are promptly attended to in line with \nenterprise procedure \n3.2 \nAppropriate rapport is maintained with customer to \nenable high quality service delivery \n3.3 \nOpportunity to enhance the quality of service and \nproducts are taken wherever possible \n \n4.  Handle queries through \ntelephone, fax \nmachine, internet and \nemail \n4.1 \nUse telephone, computer, fax machine, internet              \nefficiently to determine customer requirements \n4.2 \nQueries/ information are recorded in line with \nenterprise procedure \n4.3 \nQueries are acted upon promptly and correctly in line \nwith enterprise procedure \n \n5.  Handle complaints, \nevaluation and \nrecommendations \n5.1 \nGuests are greeted with a smile and eye-to-eye \ncontact \n5.2 \nResponsibility for resolving the complaint is taken \nwithin limit of responsibility \n5.3 \nNature and details of complaint are established and \nagreed with the customer  \n5.4 \nAppropriate action is taken to resolve the complaint to \nthe customers satisfaction wherever possible\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – LOCAL GUIDING SERVICES NC II (Amended)                  Promulgated December 2013 \n 27 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Non-verbal \ncommunication \nMay include: \n1.1 \nbody language \n1.2 \ndress and accessories \n1.3 \ngestures and mannerisms \n1.4 \nvoice tonality and volume \n1.5 \nuse of space \n1.6 \nculturally specific communication customs and \npractices \n \n2.  Cultural and social \ndifferences \nMay include: \n2.1 \nmodes of greeting, farewelling and conversation \n2.2 \nbody language/  use of body gestures \n2.3 \nformality of language \n \n3.  Interpersonal skills \nMay include: \n3.1 \ninteractive communication \n3.2 \npublic relation \n3.3 \ngood working attitude \n3.4 \nsincerity \n3.5 \npleasant disposition \n3.6 \neffective communication skills \n \n4.  Customer needs \nMay  include : \n4.1 \nthose with a disability \n4.2 \nthose with special cultural or language needs \n4.3 \nunaccompanied children \n4.4 \nparents with young children \n4.5 \npregnant women \n4.6 \nsingle women \n \n5.  Enterprise procedure \nMay include: \n5.1 \nmodes of greeting and farewelling \n5.2 \naddressing the person by name \n5.3 \ntime-lapse before a response \n5.4 \nstyle manual requirements \n5.5 \nstandard letters and proformas\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – LOCAL GUIDING SERVICES NC II (Amended)                  Promulgated December 2013 \n 28 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \n \nAssessment requires evidence that the candidate : \n1.1 \nComplied with industry practices and procedures \n1.2 \nUsed interactive communication with others \n1.3 \nComplied with occupational, health and safety \npractices \n1.4 \nPromoted public relation among others \n1.5 \nComplied with service manual standards \n1.6 \nDemonstrated familiarity with company facilities, \nproducts and services \n1.7 \nApplied company rules and standards \n1.8 \nApplied telephone ethics \n1.9 \nApplied correct procedure in using telephone, fax \nmachine, internet \n1.10 Handled customer complaints \n \n2.  Required Knowledge \n2.1 \nCommunication \n3.3.1 Interactive communication with others \n3.3.2 Interpersonal skills/ social graces with           \nsincerity \n2.2 \nSafety Practices \n2.2.1 Safe work practices \n2.2.2 Personal hygiene \n2.3 \nAttitude \n2.3.1 Attentive, patient and cordial \n2.3.2 Eye-to-eye contact \n2.3.3 Maintain teamwork and cooperation \n2.4 \nTheory \n2.4.1 Selling/upselling techniques \n2.4.2 Interview techniques \n2.4.3 Conflict resolution  \n2.4.4 Communication process \n2.4.5 Communication barriers \n \n3.  Required Skills \n3.1 \nEffective communication skills \n3.2 \nNon-verbal communication - body language \n3.3 \nGood time management \n3.4 \nAbility to work calmly and unobtrusively effectively  \n3.5 \nAbility to handle telephone inquiries and conversations \n3.6 \nCorrect procedure in handling telephone inquiries \n3.7 \nProper way of handling complaints \n \n4.  Resource Implications  \nThe following resources should be provided: \n4.1 \nAvailability of telephone, fax machine, internet, etc. \n4.2 \nAvailability of data on projects and services; tariff and \nrates, promotional activities in place etc. \n4.3 \nAvailability of office supplies \n \n5.  Methods of \nAssessment \nCompetency in this unit must be assessed through: \n5.1 \nWritten examination \n5.2 \nPractical demonstration  \n \n6.  Context for \nAssessment \n6.1 \nAssessment may be done in the workplace or in a \nsimulated workplace setting (assessment centers) \n6.2 \nAssessment activities are carried out through \nTESDA's accredited assessment center\n",
