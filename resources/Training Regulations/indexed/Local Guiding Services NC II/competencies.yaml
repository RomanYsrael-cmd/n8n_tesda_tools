        "source_title": "RESEARCH INFORMATION RELEVANT TO THE LOCALITY AND TOUR ITINERARY",
        "source_text": "--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – LOCAL GUIDING SERVICES NC II (Amended)                  Promulgated December 2013 \n 29 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY : \nRESEARCH INFORMATION RELEVANT TO THE \nLOCALITY AND TOUR ITINERARY  \n \nUNIT CODE  \n: \nTRS5113116 \n \nUNIT DESCRIPTOR \n: \nThis unit deals with the knowledge, skills and attitudes \nrequired to access and research information about a \nspecific \nlocation/destination \nfor \ndeveloping \nand \ncompleting the itinerary of a tour package. The local guide \nalways undertakes this competency whenever the \nitinerary includes extra-ordinary sites and sights. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Source information  \n1.1 \nResearch sources and appropriate methodologies \nare selected based on the type of information sought \n1.2 \nEssential information on the locality/ destination is \nidentified \n1.3 \nLocal sites, sights, events and features are \nidentified in consultation with other tour guides, \ncolleagues and company officials  \n1.4 \nSites and sights are assessed for client suitability \nincluding: \n1.4.1 accessibility  \n1.4.2 features, benefits and significance  \n1.4.3 environmental impact; historical value  \n \n2. Arrange information \n \n2.1 \nResearched information is classified, arranged and \nfiled for reference \n2.2 \nMultiple components to create maximum value  and \ninterest are combined and integrated \n2.3 \nInformation researched are classified and filed in a \nlogical manner according to client’s interest  \n2.4 \nCompany officials are informed of changes in costs of \ntour components based on researched information \n2.5 \nRevised costs structures to include full details of all \nchanges, inclusions, exclusions and add -on are \npresented to company officials \n2.6 \nChanges in response to feedback from \nvisitors/colleagues are reviewed and adjusted \n2.7 \nLegal requirements are checked and incorporated in \nthe files based on national and local statutes \n \n3. Develop tour scripts \nand commentaries \nrelevant to the tour \nitinerary and/or to the \ninterest of the clients \n3.1 \nTour spiels are developed in accordance with \nrequirements of specific tour itineraries  or \nspecific clients of the locality  \n3.2 \nAppropriate commentary and tour spiels are prepared \nbased on research conducted  \n3.3 \nOn a case-to-case basis, tour spiel are tailored-fit to \nthe interest of the clients \n3.4 \nCommentary and tour spiel that are acceptable to the \nclients, without political or religious attachments are \ndeveloped \n3.5 \nTour spiel and itinerary are presented to the tour \noperator for information prior to implementation\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – LOCAL GUIDING SERVICES NC II (Amended)                  Promulgated December 2013 \n 30 \nRANGE OF VARIABLES  \n \nVARIABLE \nRANGE \n1.  Appropriate \nmethodologies \nMay include: \n1.1 \ndesk research \n1.2 \npersonal contact with tourism authorities \n1.3 \nproduct suppliers \n1.4 \ndistribution networks \n1.5 \nocular inspections and sharing of information with \nindustry colleagues \n \n2.  Essential information \non the \nlocality/destination \nMay include: \n2.1 \nClimate and geography – location and major geo-\nphysical features; weather patters of the locality; \nextreme weather conditions and seasons \n2.2 \nEnvironment, flora and fauna – an overview of native \nflora and fauna and their characteristics; major natural \nattractions and the key features in the locality; the \nnatural environment as a tourism asset \n2.3 \nHistory – overview of Philippine history and the history \nof the region – main events, dates, characters and \nstructures \n2.4 \nPhilippines and Indigenous Culture – art, theatre, \nmusic and literature – key performer, writers and \nartists; major works by the Filipinos and major cultural \nevents; Architecture – major styles and their \nproponents; Key cultural structures in the locality.  \nIndigenous cultures and activities within the local area \n(if any) \n2.5 \nReligion and Education – religious make-up Filipino \nsociety; religious beliefs, practices and events in the \nlocality; K-12. Filipino as the national language; \nEnglish as a second language.  Local languages \n2.6 \nGovernment and governance – political units of \ngovernance; political parties, major political figures, \ncurrent political issues. \n2.7 \nTransportation and other services – mainstream \nmodes of transport in the locality and the Philippines; \nother support:  banking services, communications, \nhealth, sanitation \n2.8 \nEconomy – key elements: agriculture, trade and \nindustry.   Major local and Philippine products;  current \nissues of the economy; science and technology: key \ninventions or discoveries \n2.9 \nFruits, food, beverages and crafts.  Best known local \nnational dishes and fruits.  Native drinks and local \nhandicrafts. \n2.10 Social structure, life style and Filipino family and social \nvalues. “utang na loob” and “pakikisama\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – LOCAL GUIDING SERVICES NC II (Amended)                  Promulgated December 2013 \n 31 \n \nVARIABLE \nRANGE \n3.  Local sites,sights, \nevents and features  \n \nMay include:  \n3.1 \nman-made attractions and structures \n3.2 \nnatural attractions and locations \n3.3 \nsites of historical events \n3.4 \nreligious and cultural festivals \n3.5 \nconference and social events \n3.6 \nextraordinary natural formations  \n3.7 \nspecial events or festivities \n3.8 \nindigenous peoples \n3.9 \nflora and fauna \n3.10 remote and inaccessible places \n3.11 special interest/activities   \n \n4.  Visitors profiles \nMay include: \n4.1 \nEconomy – agriculture, aqua-culture, trade, commerce \nand industry \n4.2 \nSocial Sciences – geography, history, heritage, \nculture, music, arts, crafts \n4.3 \nEnvironment – climate, endemic flora, fauna, fruits, \nenvironmental protection and conservation \n4.4 \nReligion, Education, Sports and Governance – K to 12, \npolitical and sports figures \n4.5 \nSupport Services – transportation and accessibility, \nbanking and finance, health and sanitation, food and \nbeverages \n \n5.  Requirements of \nspecific visitors \nMay include:  \n5.1 \naccommodations, attractions, accessibility, budget, \nproduct or service \n5.2 \npreference, time-constraints, cultural, political and \nreligious issues \n5.3 \nSpecial interest integrated w/in a wider tour program (e.g\nscuba diving, land-based or sea based)\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – LOCAL GUIDING SERVICES NC II (Amended)                  Promulgated December 2013 \n 32 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nSourced and wrote a range of spiel on different sites \nand sights  \n1.2 \nDeveloped and delivered a tour spiel that meets both \nvisitor expectations and needs and the requirements \nof the enterprise  \n1.3 \nDemonstrated knowledge of the components of the \ntour or tour itinerary product  \n1.4 \nDemonstrated working knowledge of the client’s \nprofile  \n \n2.  Required  \nKnowledge  \n2.1 \nLocal regulations and their impact on the tour itinerary  \n2.2 \nIndustry practices relevant to sites and sights \n2.3 \nKnowledge of the  clients’ interest in relation to the \ntour itinerary \n2.4 \nIndustry practices in the packaging of tour products as \nappropriate to different sectors \n2.5 \nTour spiel formats \n2.6 \nResearch methodology \n \n3. Required Skills \n3.1 \nUse of electronic resources for research \n3.2 \nCommunication skills \n3.3 \nSpiel constructions sequencing and development \nskills \n \n4. Resource Implications \nThe following resources should be provided: \n4.1 \nAccess to a simulated work environment e.g. mock \ntour   \n4.2 \nActivities that allow the candidate to create range of \nguiding scenarios and situations for the various types \nof visitor  e.g. role play \n4.3 \nAdequate timeframes for the assessment process \n4.4 \nPresence of typical constraints in the guiding activity \n(e.g. schedules, weather conditions, time limitations, \nbudget) \n \n5. Methods of Assessment Competency in this unit may be assessed through: \n5.1 \nInterview on the knowledge of tour package \ncomponents and information relevant the tour itinerary \nand the visitors’ profile \n5.2 \nDemonstration on how to plan and conduct a tour visit \nto a sites and sights  \n5.3 \nObservation of the delivery process through \nsimulation or actual performance \n5.4 \nReview of portfolios of evidence  \n5.5 \nThird party workplace reports of on-the-job \nperformance  \n \n6. Context for \nAssessment \n \n6.1 \nAssessment may be done in the workplace or in a \nsimulated workplace setting (accredited TESDA \nassessment centers)\n",
