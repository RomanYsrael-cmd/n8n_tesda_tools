        "source_title": "PARTICIPATE IN WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 4 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended)                  Promulgated December 2013 \n 2 \nSECTION 2 COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core units \nof competency required in LOCAL GUIDING SERVICES NC II.  \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY :  \nPARTICIPATE IN WORKPLACE COMMUNICATION \n \nUNIT CODE \n: \n 500311105 \n \nUNIT DESCRIPTOR \n: \n This unit covers the knowledge, skills and attitudes \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Obtain and convey \nworkplace information \n1.1 \nSpecific and  relevant information is accessed from \nappropriate sources  \n1.2 \nEffective questioning , active listening and speaking \nskills are used to gather and convey information \n1.3 \nAppropriate medium is used to transfer information \nand ideas \n1.4 \nAppropriate non- verbal communication is used \n1.5 \nAppropriate lines of communication with supervisors \nand colleagues are identified and followed \n1.6 \nDefined workplace procedures for the location and \nstorage of information are used \n1.7 \nPersonal interaction is carried out clearly and concisely \n \n2. Participate in \nworkplace meetings \nand discussions \n2.1 \nTeam meetings are attended on time \n2.2 \nOwn opinions are clearly expressed and those of \nothers are listened to without interruption \n2.3 \nMeeting inputs are consistent with the meeting \npurpose and established protocols \n2.4 \nWorkplace interactions are conducted in a courteous \nmanner  \n2.5 \nQuestions about simple routine workplace procedures \nand maters concerning working conditions of \nemployment are asked and responded to \n2.6 \nMeetings outcomes are interpreted and implemented \n \n3. Complete relevant \nwork related \ndocuments \n3.1 \nRange of forms relating to conditions of employment \nare completed accurately and legibly \n3.2 \nWorkplace data is recorded on standard workplace \nforms and documents \n3.3 \nBasic mathematical processes are used for routine \ncalculations \n3.4 \nErrors in recording information on forms/ documents \nare identified and properly acted upon \n3.5 \nReporting requirements to supervisor are completed \naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended)                  Promulgated December 2013 \n 3 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \n1.1 \nTeam members \n1.2 \nSuppliers \n1.3 \nTrade personnel \n1.4 \nLocal government \n1.5 \nIndustry bodies \n \n2. Medium \n2.1 \nMemorandum \n2.2 \nCircular \n2.3 \nNotice \n2.4 \nInformation discussion \n2.5 \nFollow-up or verbal  instructions \n2.6 \nFace to face communication \n \n3. Storage \n3.1 \nManual filing system \n3.2 \nComputer-based filing system \n \n4. Forms \n4.1 \nPersonnel forms, telephone message forms, safety \nreports \n \n5. Workplace interactions \n5.1 \nFace to face \n5.2 \nTelephone \n5.3 \nElectronic and two way radio \n5.4 \nWritten including electronic, memos, instruction and \nforms, non-verbal including gestures, signals, signs \nand diagrams \n \n6. Protocols \n6.1 \nObserving meeting \n6.2 \nCompliance with meeting decisions \n6.3 \nObeying meeting instructions\n\n--- PDF PAGE 6 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended)                  Promulgated December 2013 \n 4 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared written communication following standard \nformat of the organization \n1.2 \nAccessed information using communication equipment \n1.3 \nMade use of relevant terms as an aid to transfer \ninformation effectively \n1.4 \nConveyed information effectively adopting the formal \nor informal communication \n \n2. Underpinning \nKnowledge and \nAttitudes \n \n2.1 \nEffective communication \n2.2 \nDifferent modes of communication  \n2.3 \nWritten communication \n2.4 \nOrganizational policies \n2.5 \nCommunication procedures and systems \n2.6 \nTechnology relevant to the enterprise and the \nindividual’s work responsibilities \n \n3. Underpinning Skills \n3.1 \nFollow simple spoken language \n3.2 \nPerform routine workplace duties following simple \nwritten notices \n3.3 \nParticipate in workplace meetings and discussions \n3.4 \nComplete work related documents \n3.5 \nEstimate, calculate and record routine workplace \nmeasures \n3.6 \nBasic mathematical processes of addition, subtraction, \ndivision and multiplication \n3.7 \nAbility to relate to people of social range in the \nworkplace \n3.8 \nGather and provide information in response to \nworkplace requirements \n \n4. Resource Implications \n4.1 \nFax machine \n4.2 \nTelephone \n4.3 \nWriting materials \n4.4 \nInternet \n \n5. Methods of \nAssessment \n5.1 \nDirect Observation \n5.2 \nOral interview and written test \n \n6. Context of Assessment 6.1 \nCompetency may be assessed individually in the \nactual workplace or through accredited institution\n",
