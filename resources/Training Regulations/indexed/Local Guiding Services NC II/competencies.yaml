          "source_text": "1.  Perform pre-arrival  \n     checks \n1.1 Inclusions of the tour itinerary are determined as to \nclient’s requirements \n1.2 Tours components that are for the visitors’ personal \naccount are determined based on enterprise policy \n1.3 Reserved tour components are verified and changes \neffected as necessary \n1.4 Required tour documents are collected and cash \nadvances are secured,  as necessary \n \n2. Coordinate tour \narrangements  \n \n2.1 \nDelivery of tour components are supervised in \naccordance with tour arrangements \n2.2 \nCompliance of suppliers of reserved tour components \nare checked  \n2.3 \nProper accounting of money paid or accounts dues to \nand from visitors and/or suppliers are conducted \nbased on enterprise instructions and procedures \n2.4 \nRelevant information on the suppliers services, \namenities and facilities is provided   \n2.5 \nOptional  visitors’ request from the suppliers are \nfacilitated   \n2.6 \nVisitors are politely reminded to pay for all expenses \nof a personal nature \n \n3. Resolve complaints \nand other emergencies \n3.1 \nResolution of complaints and other emergencies are \ngiven assistance based on enterprise policy \n3.2 \nNature of complaint with supplier concerned is \nevaluated \n3.3 \nAppropriate solutions are determined and applied \n3.4 \nConcerned government authorities are notified about \nthe situation whenever necessary  \n3.5 \nTour operator or organizer are notified about the \nsituation \n3.6 \nAll incidents are documented in final report  \n \n4. Perform post-departure \nactivities \n4.1 \nRevisions and cancellations of services rendered or \nnot rendered are reported in accordance with \nenterprise guidelines and procedures \n4.2 \nAdditional revenue or expenses incurred are  \naccounted \n4.3 \nClients’ feedbacks are reported based on enterprise \npolicy \n4.4 \nReport on expenses incurred in connection with the   \ntour itinerary submitted\n\n--- PDF PAGE 36 ---\nTESDA-