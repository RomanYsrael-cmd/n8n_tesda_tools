        "source_text": "TRS5113118\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills required for\naccompanying and guiding clients, perform safety\npractices and resolve complaints and other emergencies\nin locality as contracted by a tour operator or local\norganization.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Meet and assist the\nclients upon arrival at\nthe destination\n1.1\nComposition and responsibility of the local tour\nguide are determined as per company policies and\nprocedures\n1.2\nArrival schedules are checked\n1.3\nReservations of the tour itinerary are double-checked\n1.4\nTour itinerary is checked for compliance with clients’\nrequirements\n1.5\nClients are met and greeted at the gateway\n1.6\nClients are segregated from the general crowd to give\nwelcome briefing before boarding\n1.7\nClients’ baggage is checked and boarded\n1.8\nClients are accompanied to the place of lodging and a\nwelcome spiel and relevant commentary are delivered\n1.9\nAssistance is provided with the registration formalities\nat the place of lodging during check-in\n1.10 Clients are reminded of the next activity\n\n2. Accompany and guide\nthe clients while on\ntour\n\n2.1\nAppropriate attire is worn during tour\n2.2\nPersonal hygiene as per accepted social norms is\nobserved and practiced\n2.3\nPick up points, routing and stopovers are coordinated\nwith tourist vehicle driver\n2.4\nClients are provided with a summary of the days’\nactivities – routings, stop overs and durations at the\nstart of the activity\n2.5\nClients are provided assistance and\nquestions/concerned are addressed\n2.6\nClients movements are properly and safely managed\nduring tour stop overs and walkabouts\n2.7\nHead counts are conducted before starting the tour,\nduring and after the activity – or whenever or wherever\npossible\n2.8\nOptional tours are recommended and sold\n2.9\nClients are reminded of safety precautions\n2.10 Vehicles are checked for belonging left behind after\nevery tour\n2.11 Situation awareness and presence of mind is practiced\nat all times to prevent accidents and other unforeseen\nsituations\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 37\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Deliver of information,\ntour spiels and\ncommentaries\n\n3.1\nRelevant and timely commentaries are provided\n3.2\nRelevant and timely instructions are provided, when\nneeded\n3.3\nProper posture and position is assumed at all times\n3.4\nCommentaries are delivered with proper voice\nmodulation and pronunciation\n3.5\nAppropriate terminologies and up-to-date information\nare used at all times\n3.6\nPositive interaction and rapport with visitors is\ndeveloped and practiced\n\n4. Resolve complaints\nand other emergencies\n4.1\nComplaints are addressed and referred to the\nperson/s concerned\n4.2\nVisitors comfort is ensured throughout the tour\n4.3\nStress situations are avoided and handled tactfully\n4.4\nDamage control in abnormal situations is adopted\nwithout blaming anybody\n4.5\nTour operator is notified of the remedial measures in\nabnormal situations\n4.6\nBest solutions to abnormal situations are determined\nand applied with the company’s approval\n5. Provides send-off\nassistance in hotel\ndeparture formalities\n5.1\nAssistance is provided with check-out formalities at the\nplace of lodging in accordance with establishment\nprocedures\n5.2\nCollection of luggage and boarding of visitors’ luggage\nare overseen\n5.3\nReturn of hotel room keys or room access cards are\noverseen\n5.4\nVisitors are accompanied to the departure place –\nairport, pier or bus station\n5.5\nRelevant information en route is provided and bade\ngood bye to visitors\n\n6. Develop tour guide -\ntour driver work\nrelationship (teamwork)\n6.1\nCoach current registration is checked\n6.2\nDriver’s complete name is sought and rapport is\nestablished before the tour begins\n6.3\nSound system (PA) and microphone are double\nchecked\n6.4\nCleanliness and condition of the coach are always\nchecked, especially the defective seats or armrest\n6.5\nFull loaded first aid kit in the coach and fire\nextinguisher are checked\n6.6\nDriver is made familiar with the given itinerary – routes\nand stopovers – before the tour starts\n6.7\nDriver’s attitude and protocol to passengers are\nobserved and corrected gently, if driver has an attitude\nproblem\n6.8\nThings left behind inside the coach after the tour are\ndouble-checked\n6.9\nDriver’s meals and physical condition are checked,\nespecially on long trips\n6.10 Whenever applicable, assistance is provided to the\ndriver when unexpected developments occur(eg.flat\ntires)\n6.11 Due recognition is given to driver for a job well done\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 38\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Responsibility of local\nguide\nMay include:\n1.1\nThe use of map, compass, ballpen, pencil, camera,\ntwo-way radio, cell phone, whistle, banner, hat, bull\nhorn, sun block, lotion, first aid kit\n\n2. Appropriate attire\n2.1\nAuthorized tour guide apparel is based on the type of\ntour and type of visitor to be guided\n2.2\nTour guide name plate is desirable\n\n3. Personal hygiene\n3.1\nSocial norms require individual to bath, comb hair,\nbrush teeth, cut nails, iron clothes and polish shoes\n\n4. Personal belongings\n4.1\nVisitors’ personal belonging range from jewelry, to\nclothing and money\n\n5. Relevant information\nMay include:\n5.1\nEconomy – agriculture, aqua-culture, trade,\ncommerce and industry\n5.2\nSocial Sciences – geography, history, heritage,\nculture, music, arts, crafts\n5.3\nEnvironment – climate, endemic flora. fauna, fruits,\nenvironmental protection and conservation\n5.4\nReligion, Education, Sports and Governance – K-12,\npolitical and sports figures\n5.5\nSupport Services – transportation and accessibility,\nbanking and finance, health and sanitation, food and\nbeverage\n5.6\nCurrent events and holidays\n\n6. Complaints\nMay include:\n6.1\nLoss of luggage\n6.2\nLost, misplaced or damaged personal belongings and\ndocuments\n6.3\nPilferage\n6.4\nAlso includes arrangements not in accordance with\nthe reservations or delayed delivery of services\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 39\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nMet and assisted the visitors upon arrival\n1.2\nAccompanied and guided visitors while on tour\n1.3\nDelivered information, tour spiels and commentaries\n1.4\nResolved complaints and other emergencies\n1.5\nProvided send off assistance in hotel departure\nactivities\n1.6\nDeveloped tour guide-tour driver relationship\n(teamwork)\n\n2. Required Knowledge\nGeneral knowledge of the Philippines and specific\nknowledge of the locality including:\n2.1\nClimate (weather patterns including any extreme\nconditions, impact of climate on lifestyle, stories\nassociated with climate in a local area)\n2.2\nGeography and geology (major land\nformations/landmarks/natural attractions and their key\nfeatures for both Philippines and local region)\n2.3\nHistory (historical development of Philippines and the\nlocality, major historical events and prominent\nindividuals, key dates, overview of Philippine\nindigenous history)\n2.4\nArchitecture (major styles and their proponents, key\nbuildings and structures both in Philippines and the\nlocal area)\n2.5\nCultural elements (overview of indigenous cultures\nwithin the Philippines, different cultures within the\nPhilippines and the local area, cultural activities, local\ncustoms)\n2.6\nArt, theatre, music and literature (key performers,\nwriters and artists, major works by the Filipinos, major\ncultural events)\n2.7\nReligion (religious make-up for Filipinos and the local\narea, religious practices)\n2.8\nNatural environment and tourism (how the\nenvironment is a tourism asset, impacts of tourism on\nthe environment, land management in Philippines\nincluding the role of National Parks).\n2.9\nFlora and fauna (overview of native flora and fauna,\ntheir characteristics and key locations)\n2.10 Government and politics (general structure, political\nsystem, major political figures, current political\nissues)\n2.11 Transport (main transport systems, usage of different\nforms of transport across Philippines, historical\ndevelopment of different forms of transport)\n2.12 Agriculture (Philippines history as a primary producer,\nkey products of the Philippines, current issues)\n2.13 Science and technology (Philippine contribution both\npast and present, prominent individuals, key\ndiscoveries)\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 40\n\n2.14 Sport (main Filipinos sporting activities, Philippines\nsporting record, local sporting focus, sporting\nfacilities, sporting comparisons with other countries or\nareas)\n2.15 Economy (overview of current state of the economy,\nkey features of the local economy and local industry).\n2.16 Trade (Philippines key exports and its main trading\npartners)\n2.17 Education (overview of school and higher education\nsystems, comparisons of systems to those of other\ncountries)\n2.18 Food (Local dishes and produce)\n2.19 Local wines and spirits\n2.20 Lifestyle (key features of the day-to-day living patterns\nof Philippines and local people, family and social\ncustoms)\n2.21 Shopping (key locations, local products)\n2.22 Tourism services and local facilities of interest to\nvisitors (currency exchange locations, tour booking\noffices, accommodation, attractions, banks, dry\ncleaners, medical facilities)\n2.23 Current events in Philippines and the local region\nKnowledge of the form of government or geo-politics but not\npolitical ideas\n2.24 Tour guide’s code of ethics\n\n3. Required Skills\n3.1\nAbility to speak fluently In English and the local\ndialects\n3.2\nAbility to use office equipment\n3.3\nAbility to tactfully answer and handle sensitive\nquestion and situation\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nAccess to workplace location\n4.2\nAccess to telephone, two-way radio, fax, computer and\nany relevant equipment for tour guiding\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nInterview\n5.2\nWritten test\n5.3\nSimulated or actual demonstration (mock tour and/or\nrole play)\n5.4\nObservation\n\n6. Context of assessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (Accredited TESDA\nassessment centers)\n\n--- PDF PAGE 43 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 41"
