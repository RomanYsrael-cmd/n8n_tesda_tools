        "source_title": "COORDINATE TOUR ARRANGEMENTS FOR CLIENTS",
        "source_text": "--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – LOCAL GUIDING SERVICES NC II (Amended)                  Promulgated December 2013 \n 33 \nUNIT OF COMPETENCY : \nCOORDINATE TOUR ARRANGEMENTS FOR CLIENTS \n \nUNIT CODE \n: \nTRS5113117 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, and attitude \nrequired for coordinating the tour arrangements included \nin the tour itinerary and making provisions for additional \nchanges and revisions as contracted by a tour operator or \ntour organizer. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.  Perform pre-arrival  \n     checks \n1.1 Inclusions of the tour itinerary are determined as to \nclient’s requirements \n1.2 Tours components that are for the visitors’ personal \naccount are determined based on enterprise policy \n1.3 Reserved tour components are verified and changes \neffected as necessary \n1.4 Required tour documents are collected and cash \nadvances are secured,  as necessary \n \n2. Coordinate tour \narrangements  \n \n2.1 \nDelivery of tour components are supervised in \naccordance with tour arrangements \n2.2 \nCompliance of suppliers of reserved tour components \nare checked  \n2.3 \nProper accounting of money paid or accounts dues to \nand from visitors and/or suppliers are conducted \nbased on enterprise instructions and procedures \n2.4 \nRelevant information on the suppliers services, \namenities and facilities is provided   \n2.5 \nOptional  visitors’ request from the suppliers are \nfacilitated   \n2.6 \nVisitors are politely reminded to pay for all expenses \nof a personal nature \n \n3. Resolve complaints \nand other emergencies \n3.1 \nResolution of complaints and other emergencies are \ngiven assistance based on enterprise policy \n3.2 \nNature of complaint with supplier concerned is \nevaluated \n3.3 \nAppropriate solutions are determined and applied \n3.4 \nConcerned government authorities are notified about \nthe situation whenever necessary  \n3.5 \nTour operator or organizer are notified about the \nsituation \n3.6 \nAll incidents are documented in final report  \n \n4. Perform post-departure \nactivities \n4.1 \nRevisions and cancellations of services rendered or \nnot rendered are reported in accordance with \nenterprise guidelines and procedures \n4.2 \nAdditional revenue or expenses incurred are  \naccounted \n4.3 \nClients’ feedbacks are reported based on enterprise \npolicy \n4.4 \nReport on expenses incurred in connection with the   \ntour itinerary submitted\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – LOCAL GUIDING SERVICES NC II (Amended)                  Promulgated December 2013 \n 34 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Clients’ requirements \n(Needs of the group) \nMay include: \n1.1 \nrevised hotel accommodations \n1.2 \nrevised food requirements \n1.3 \nseating arrangements in the tour vehicle \n1.4 \nany other need arising from the tour itinerary \n \n2.  Required tour \ndocuments and cash \nadvances \nMay include: \n2.1 \nName list and/or rooming list \n2.2 \nExchange voucher \n2.3 \nTour or exchange order \n2.4 \nCash advanced for payment of service \n2.5 \nCash advanced for contingency/emergency purposes \n \n3.  Tour suppliers  \nMay include: \n3.1 \nProviders of tour services or components  \n3.2 \nProviders of optional or additional services or \ncomponents \n \n4.  Relevant information \n May include: \n4.1 \nExpenses of a personal natures, such as cover \ncharges, minimum charges, optional amenities (TV or \nrefrigerator in room)  \n4.2 \nDescription of suppliers’ location, highlights, facilities, \nservices and rates when applicable \n \n5.  Visitor’s feedbacks \nMay include: \n5.1 \nOver-charging \n5.2 \nCharging for items not consumed \n5.3 \nCharges for items available but not availed of \n5.4 \nPurchased of fake or imitation material \n5.5 \nExcess luggage charges \n5.6 \nUpgrade or down grade of services \n5.7 \nUnwarranted delays and cancellations \n5.8 \nPoor quality/quantity of food/drinks \n5.9 \nPoor performance of technical equipment \n5.10 Poor transportation services \n \n6.  Emergencies \nMay include:  \n6.1 \nTheft and robbery \n6.2 \nSnatching \n6.3 \nMuggings \n6.4 \nRoad and other accidents \n6.5 \nIllness/sickness \n6.6 \nInjury or death \n \n7.  Expenses of personal \nnature  \nMay include: \n7.1 \nAlcoholic drinks \n7.2 \nPostage and phone calls \n7.3 \nLaundry \n7.4 \nMeals not included in the tour package or tour itinerary\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – LOCAL GUIDING SERVICES NC II (Amended)                  Promulgated December 2013 \n 35 \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPerformed pre – arrival checks  \n1.2 \nCoordinated tour arrangements  \n1.3 \nResolved complaints and other emergencies \n1.4 \nPerformed post – departure activities \n \n2.  Required Knowledge   \n2.1 \nCheck-in and check-out procedures \n2.1.1 Transportation company \n2.1.2 Lodging establishment  \n2.1.3 Any other establishment \n2.2 \nStandard Operating Procedures  \n2.2.1 Transportation company \n2.2.2 Lodging establishment  \n2.2.3 Other visitor-related establishments \n2.3 \nKnowledge of room categories, room types and \npublished rates and the schedules of airlines, shipping \ncompanies, bus / train companies \n2.4 \nKnowledge of other suppliers’ locations, amenities, \nservice, facilities, highlights and rates \n2.5 \nLocal/municipal travel tour regulation and ordinances \n2.6 \nAccommodations, restaurants, shopping sites and \ntourism-related establishments in the \nlocality/destination \n \n3.  Required Skills  \n3.1 \nEnglish language–fluency and effective \ncommunication skills  \n3.2 \nUse of telephone, fax and two – way radio \n3.3 \nCultural sensitivity awareness and practices \n3.4 \nDecision-making and problem solving skills  \n3.5 \nPeople skills (Emotional Quotient (EQ)) \n \n4.  Resource Implications \nThe following resources should be provided: \n4.1 \nTelephone / two – way radio, fax and computer \n4.2 \nWorkplace location \n \n5.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1 \nInterview \n5.2 \nWritten test \n5.3 \nObservation and simulated or actual demonstration \n \n6.  Context for \nAssessment \n6.1 \nAssessment may be done in the workplace or in a \nsimulated workplace setting (Accredited TESDA \nassessment centers)\n",
