  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units\nof competency required in LOCAL GUIDING SERVICES NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\n\nUNIT CODE\n:\n 500311105\n\nUNIT DESCRIPTOR\n:\n This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace information\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking\nskills are used to gather and convey information\n1.3\nAppropriate medium is used to transfer information\nand ideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors\nand colleagues are identified and followed\n1.6\nDefined workplace procedures for the location and\nstorage of information are used\n1.7\nPersonal interaction is carried out clearly and concisely\n\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of\nothers are listened to without interruption\n2.3\nMeeting inputs are consistent with the meeting\npurpose and established protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures\nand maters concerning working conditions of\nemployment are asked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment\nare completed accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace\nforms and documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents\nare identified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 5 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety\nreports\n\n5. Workplace interactions\n5.1\nFace to face\n5.2\nTelephone\n5.3\nElectronic and two way radio\n5.4\nWritten including electronic, memos, instruction and\nforms, non-verbal including gestures, signals, signs\nand diagrams\n\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 6 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 4\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard\nformat of the organization\n1.2\nAccessed information using communication equipment\n1.3\nMade use of relevant terms as an aid to transfer\ninformation effectively\n1.4\nConveyed information effectively adopting the formal\nor informal communication\n\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1\nEffective communication\n2.2\nDifferent modes of communication\n2.3\nWritten communication\n2.4\nOrganizational policies\n2.5\nCommunication procedures and systems\n2.6\nTechnology relevant to the enterprise and the\nindividual’s work responsibilities\n\n3. Underpinning Skills\n3.1\nFollow simple spoken language\n3.2\nPerform routine workplace duties following simple\nwritten notices\n3.3\nParticipate in workplace meetings and discussions\n3.4\nComplete work related documents\n3.5\nEstimate, calculate and record routine workplace\nmeasures\n3.6\nBasic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7\nAbility to relate to people of social range in the\nworkplace\n3.8\nGather and provide information in response to\nworkplace requirements\n\n4. Resource Implications\n4.1\nFax machine\n4.2\nTelephone\n4.3\nWriting materials\n4.4\nInternet\n\n5. Methods of\nAssessment\n5.1\nDirect Observation\n5.2\nOral interview and written test\n\n6. Context of Assessment 6.1\nCompetency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 7 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 5\nUNIT OF COMPETENCY :\nWORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n:\n500311106\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role and\nscope\n1.1\nThe role and objective of the team is identified from\navailable sources of information\n1.2\nTeam parameters, reporting relationships and\nresponsibilities are identified from team discussions\nand appropriate external sources\n\n2. Identify own role and\nresponsibility within\nteam\n2.1\nIndividual role and responsibilities within the team\nenvironment are identified\n2.2\nRoles and responsibility of other team members are\nidentified and recognized\n2.3\nReporting relationships within team and external to\nteam are identified\n\n3. Work as a team\nmember\n3.1\nEffective and appropriate forms of communications\nused and interactions undertaken with team members\nwho contribute to known team activities and objectives\n3.2\nEffective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3\nObserved protocols in reporting using standard\noperating procedures\n3.4\nContribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 8 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1\nWork activities in a team environment with enterprise\nor specific sector\n1.2\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a\nteam environment\n\n2. Sources of information\n2.1\nStandard operating and/or other workplace procedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nVisitor/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 9 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 7\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n\n2. Underpinning\nKnowledge and\nAttitude\n2.1\nCommunication process\n2.2\nTeam structure\n2.3\nTeam roles\n2.4\nGroup planning and decision making\n\n3. Underpinning Skills\n3.1\nCommunicate appropriately, consistent with the culture\nof the workplace\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials relevant to the proposed activity or tasks\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nObservation of the individual member in relation to the\nwork activities of the group\n5.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in workplace or in a\nsimulated workplace setting\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 10 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 8\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2\nIntra- and interpersonal relationships are maintained in\nthe course of managing oneself based on performance\nevaluation\n1.3\nCommitment to the organization and its goal is\ndemonstrated in the performance of duties\n\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2\nResources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3\nPractices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified\nand availed of based on job requirements\n3.2\nRecognitions are sought/received and demonstrated\nas proof of career advancement\n3.3\nLicenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 11 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance Appraisal\n1.2\nPsychological Profile\n1.3\nAptitude Tests\n\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2\nServing as Resource Persons in conferences and\nworkshops\n\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of Appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and Intangible Rewards\n\n5. Licenses and/or\ncertifications\n5.1\nNational Certificates\n5.2\nCertificate of Competency\n5.3\nSupport Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 12 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 10\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra - and interpersonal relationship in the\ncourse of managing oneself based on performance\nevaluation\n1.3\nCompleted trainings and career opportunities which\nare based on the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n\n2. Underpinning\nKnowledge\n2.1\nWork values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n\n3. Underpinning Skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n\n6. Context of Assessment\n6.1\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 13 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 11\nUNIT OF COMPETENCY :\nPRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE\n:\n500311108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with\nregulatory\nand\norganizational\nrequirements\nfor\noccupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard\ncontrol practices and procedures are clarified and\nexplained based on organization procedures\n1.2\nHazards/risks in the workplace and their\ncorresponding indicators are identified to minimize or\neliminate risk to co-workers, workplace and\nenvironment in accordance with organization\nprocedures\n1.3\nContingency measures during workplace accidents,\nfire and other emergencies are recognized and\nestablished in accordance with organization\nprocedures\n\n2. Evaluate hazards and\nrisks\n2.1\nTerms of maximum tolerable limits which when\nexceeded will result in harm or damage are identified\nbased on threshold limit values (TLV)\n2.2\nEffects of the hazards are determined\n2.3\nOHS issues and/or concerns and identified safety\nhazards are reported to designated personnel in\naccordance with workplace requirements and relevant\nworkplace OHS legislation\n\n3. Control hazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2\nProcedures for dealing with workplace accidents, fire\nand emergencies are followed in accordance with\norganization OHS policies\n3.3\nPersonal protective equipment (PPE) is correctly\nused in accordance with organization OHS procedures\nand practices\n3.4\nAppropriate assistance is provided in the event of a\nworkplace emergency in accordance with established\norganization protocol\n\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2\nOHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 14 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n\n2. Hazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites,\nmites, molds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes,\nsmoke, gasses, vapors\n2.4\nErgonomics\n2.4.1 Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n\n3. Contingency measures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\nCalling emergency personnel\n\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n\n6. OHS personal records\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 15 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 13\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and\nhazard control practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5\nFollowed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7\nCompleted and updated OHS personal records in\naccordance with workplace requirements\n\n2. Underpinning\nKnowledge\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n\n3. Underpinning Skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n\n4. Resource Implications\nThe following resources must be provided:\n4.1\nWorkplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n\n6. Context for\nAssessment\n6.1\nCompetency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 14\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nDEVELOP AND UPDATE INDUSTRY KNOWLEDGE\n\nUNIT CODE\n:\nTRS311201\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nrequired to access, increase and update industry\nknowledge. It includes seek information on the industry\nand update industry knowledge\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variable\n1. Seek information on\nthe industry\n1.1\nSources of information on the industry are correctly\nidentified and accessed\n1.2\nInformation to assist effective work performance is\nobtained in line with job requirements\n1.3\nSpecific information on sector of work is accessed and\nupdated\n1.4\nIndustry information is correctly applied to day-to-day\nwork activities\n\n2. Update industry\nknowledge\n2.1\nInformal and/or formal research is used to update\ngeneral knowledge of the industry\n2.2\nUpdated knowledge is shared with customers and\ncolleagues as appropriate and incorporated into day-\nto-day working activities\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information sources\nMay include :\n1.1\nmedia\n1.2\nreference books\n1.3\nlibraries\n1.4\nunions\n1.5\nindustry associations\n1.6\nindustry journals\n1.7\ninternet\n1.8\npersonal observation and experience\n\n2. Information to assist\neffective work\nperformance\nMay include:\n2.1\ndifferent sectors of the industry and the services\navailable in each sector\n2.2\nrelationship between tourism and hospitality\n2.3\nrelationship between the industry and other\nindustries\n2.4\nindustry working conditions\n2.5\nlegislation that affects the industry\n2.5.1 liquor\n2.5.2 health and safety\n2.5.3 hygiene\n2.5.4 gaming\n2.5.5 workers compensation\n2.5.6 consumer protection\n2.5.7 duty of care\n2.5.8 building regulations\n2.6\ntrade unions environmental issues and\nrequirements\n2.7\nindustrial relations issues and major\norganizations\n2.8\ncareer opportunities within the industry\n2.9\nwork ethic required to work in the industry and\nindustry expectations of staff\n2.10 quality assurance\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 16\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nKnew key sources of information on the industry\n1.2\nUpdated industry knowledge\n1.3\nAccessed and used industry information\n\n2. Required Knowledge\n2.1 Overview of quality assurance in the industry\n2.2 Role of individual staff members\n2.3 Industry information sources\n\n3. Required Skills\n3.1\nTime management\n3.2\nReady skills needed to access industry information\n3.3\nBasic competency skills needed to access the internet\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nSources of information on the industry\n4.2\nIndustry knowledge\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nInterview/questions\n5.2\nPractical demonstration\n5.3\nPortfolio of industry information related to trainee’s\nwork\n\n6. Context of Assessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 17\nUNIT OF COMPETENCY :\nOBSERVE WORKPLACE HYGIENE PROCEDURES\n\nUNIT CODE\n:\nTRS311202\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nand attitudes in observing workplace hygiene procedures.\nIt includes following hygiene procedures and identifying\nand preventing hygiene risks.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variable\n1. Follow hygiene\nprocedures\n1.1\nWorkplace hygiene procedures are implemented in\nline with enterprise and legal requirements\n1.2\nHandling and storage of items are undertaken in line\nwith enterprise and legal requirements\n\n2. Identify and prevent\nhygiene risks\n2.1\nPotential hygiene risks are identified in line with\nenterprise procedures\n2.2\nAction to minimize and remove risks are taken within\nscope of individual responsibility of enterprise/legal\nrequirements\n2.3\nHygiene risks beyond the control of individual staff\nmembers are reported to the appropriate person for\nfollow up\n\n--- PDF PAGE 20 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hygiene procedures\nMay include :\n1.1\nsafe and hygienic handling of food and beverage\n1.2\nregular hand washing\n1.3\ncorrect food storage\n1.4\nappropriate and clean clothing\n1.5\navoidance of cross-contamination\n1.6\nsafe handling disposal of linen and laundry\n1.7\nappropriate handling and disposal of garbage\n1.8\ncleaning and sanitizing procedures\n1.9\npersonal hygiene\n\n2. Hygiene risk\nMay include:\n2.1\nbacterial and other contamination arising from poor\nhandling of food\n2.2\ninappropriate storage of foods\n2.3\nstorage at incorrect temperatures\n2.4\nfoods left uncovered\n2.5\npoor personal hygiene practices\n2.6\npoor work practices\n2.6.1 cleaning\n2.6.2 housekeeping\n2.6.3 food handling\n2.6.4 vermin\n2.6.5 airborne dust\n2.7\ncross-contamination through cleaning inappropriate\ncleaning practices\n2.8\ninappropriate handling of potentially infectious linen\n2.9\ncontaminated wastes such as blood and body\nsecretions\n2.10 disposal of garbage and contaminated or potentially\ncontaminated wastes\n\n3. Minimizing or removing\nrisk\nMay include:\n3.1\nauditing staff skills and providing training\n3.2\nensuring policies and procedures are followed strictly\n3.3\naudits or incidents with follow up actions\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 19\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nFollowed hygiene procedures\n1.2\nIdentified and responded to hygiene risk\n1.3\nPracticed personal grooming and hygiene\n\n2. Required Knowledge\n2.2\nTypical hygiene and control procedures in the\nhospitality and tourism industries\n2.3\nOverview of legislation and regulation in relation to\nfood handling, personal and general hygiene\n2.4\nKnowledge on factors which contribute to workplace\nhygiene problems\n2.5\nGeneral hazards in handling of food, linen and laundry\nand garbage, including major causes of contamination\nand cross-infection\n2.6\nSources of and reasons for food poisoning\n\n3. Required Skills\n3.1\nAbility to follow correct procedures and instructions\n3.2\nAbility to handle operating tools/ equipment\n3.3\nApplication to hygiene principles\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nHygiene procedures, actual or simulated workplace,\nproducts used in hotel/restaurant /tourism workplace\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nWritten examination\n5.2\nPractical demonstration\n\n6. Context for\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 20\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\n\nUNIT CODE\n:\nTRS311203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes and\nvalues needed to perform computer operations which\nincludes inputting, accessing, producing and transferring\ndata using the appropriate hardware and software\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\ntask to be undertaken\n1.1\nRequirements of task are determined\n1.2\nAppropriate hardware and software is selected\naccording to task assigned and required outcome\n1.3\nTask is planned to ensure OH & S guidelines and\nprocedures are followed\n\n2. Input data into\ncomputer\n2.1\nData are entered into the computer using appropriate\nprogram/application in accordance with company\nprocedures\n2.2\nAccuracy of information is checked and information is\nsaved in accordance with standard operating\nprocedures\n2.3\nInputted data are stored in storage media according to\nrequirements\n2.4\nWork is performed within ergonomic guidelines\n\n3. Access information\nusing computer\n3.1\nCorrect program/application is selected based on job\nrequirements\n3.2\nProgram/application containing the information\nrequired is accessed according to company\nprocedures\n3.3\nDesktop icons are correctly selected, opened and\nclosed for navigation purposes\n3.4\nKeyboard techniques are carried out in line with OH &\nS requirements for safe use of keyboards\n\n4. Produce/output data\nusing computer system\n4.1\nEntered data are processed using appropriate\nsoftware commands\n4.2\nData are printed out as required using computer\nhardware/peripheral devices in accordance with\nstandard operating procedures\n4.3\nFiles and data are transferred between compatible\nsystems using computer software, hardware/\nperipheral devices in accordance with standard\noperating procedures\n\n5. Maintain computer\nequipment and\nsystems\n5.1\nSystems for cleaning, minor maintenance and\nreplacement of consumables are implemented\n5.2\nProcedures for ensuring security of data, including\nregular back-ups and virus checks are implemented in\naccordance with standard operating procedures\n5.3\nBasic file maintenance procedures are implemented in\nline with the standard operating procedures\n\n--- PDF PAGE 23 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 21\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hardware and\nperipheral devices\nMay include:\n1.1\nPersonal computers\n1.2\nNetworked systems\n1.3\nCommunication equipment\n1.4\nPrinters\n1.5\nScanners\n1.6\nKeyboard\n1.7\nMouse\n\n2. Software\nMay include:\n2.1\nWord processing packages\n2.2\nData base packages\n2.3\nInternet\n2.4\nSpreadsheets\n\n3. OH & S guidelines\nMay include:\n3.1\nOHS guidelines\n3.2\nEnterprise procedures\n\n4. Storage media\nMay include:\n4.1\ndiskettes\n4.2\nCDs\n4.3\nzip disks\n4.4\nhard disk drives, local and remote\n\n5. Ergonomic guidelines\nMay include:\n5.1\nTypes of equipment used\n5.2\nAppropriate furniture\n5.3\nSeating posture\n5.4\nLifting posture\n5.5\nVisual display unit screen brightness\n\n6. Desktop icons\nMay include:\n6.1\ndirectories/folders\n6.2\nfiles\n6.3\nnetwork devices\n6.4\nrecycle bin\n\n7. Maintenance\nMay include:\n7.1\nCreating more space in the hard disk\n7.2\nReviewing programs\n7.3\nDeleting unwanted files\n7.4\nBacking up files\n7.5\nChecking hard drive for errors\n7.6\nUsing up to date anti-virus programs\n7.7\nCleaning dust from internal and external surfaces\n\n--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 22\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nSelected and used hardware components correctly\nand according to the task requirement\n1.2\nIdentified and explain the functions of both hardware\nand software used, their general features and\ncapabilities\n1.3\nProduced accurate and complete data in accordance\nwith the requirements\n1.4\nUsed appropriate devices and procedures to transfer\nfiles/data accurately\n1.5\nMaintained computer system\n\n2. Required Knowledge\n2.1\nBasic ergonomics of keyboard and computer use\n2.2\nMain types of computers and basic features of\ndifferent operating systems\n2.3\nMain parts of a computer\n2.4\nStorage devices and basic categories of memory\n2.5\nRelevant types of software\n2.6\nGeneral security\n2.7\nViruses\n2.8\nOH & S principles and responsibilities\n2.9\nCalculating computer capacity\n\n3. Required Skills\n3.1\nReading skills required to interpret work instruction\n3.2\nCommunication skills\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nComputer hardware with peripherals\n4.2\nAppropriate software\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nObservation\n5.2\nQuestioning\n5.3\nPractical Demonstration\n\n6. Context of Assessment 6.1\nAssessment may be conducted in the workplace or in\na simulated environment\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 23\nUNIT OF COMPETENCY :\nPERFORM WORKPLACE AND SAFETY PRACTICES\n\nUNIT CODE\n:\nTRS311204\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nand attitudes in following health, safety and security\npractices. It includes dealing with emergency situations\nand maintaining safe personal presentation standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated on the Range of Variables\n1. Follow workplace\nprocedures for health,\nsafety and security\npractices\n1.1\nCorrect health, safety and security procedures are\nfollowed in line with legislation, regulations and\nenterprise procedures\n1.2\nBreaches of health, safety and security procedures\nare identified and reported in line with enterprise\nprocedure\n1.3\nSuspicious behavior or unusual occurrence are\nreported in line with enterprise procedure\n\n2. Deal with emergency\nsituations\n2.1\nEmergency and potential emergency situations are\nrecognized and appropriate action are taken within\nindividual’s scope of responsibility\n2.2\nEmergency procedures are followed in line with\nenterprise procedures\n2.3\nAssistance is sought from colleagues to resolve or\nrespond to emergency situations\n2.4\nDetails of emergency situations are reported in line\nwith enterprise procedures\n\n3. Maintain safe personal\npresentation standards\n3.1\nSafe personal standards are identified and followed in\nline with enterprise requirements\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 24\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Health, safety and\nsecurity procedures\nMay include:\n1.1\nuse of personal protective clothing and equipment\n1.2\nsafe posture including sitting, standing, bending\n1.3\nmanual handling including lifting, transferring\n1.4\nsafe work techniques including knives and equipment,\nhandling hot surfaces, computers and electronic\nequipment\n1.5\nsafe handling of chemicals, poisons and dangerous\nmaterials\n1.6\nergonomically sound furniture and work stations\n1.7\nemergency fire and accident\n1.8\nhazard identification and control\n1.9\nsecurity of documents, cash, equipment, people\n1.10 key control systems\n\n2. Breaches of procedure\nMay include:\n2.1\nloss of keys\n2.2\nstrange or suspicious persons\n2.3\nbroken or malfunctioning equipment\n2.4\nloss of property, goods or materials\n2.5\ndamaged property or fittings\n2.6\nlack of suitable signage when required\n2.7\nlack of training on health and safety issues\n2.8\nunsafe work practices\n\n3. Emergency\nMay include:\n3.1\npersonal injuries\n3.2\nfire\n3.3\nelectrocution\n3.4\nnatural calamity i.e. earthquake/flood\n3.5\ncriminal acts i.e. robbery\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 25\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1\nComplied with industry practices and procedures\n1.2\nUsed interactive communication with others\n1.3\nComplied with workplace safety, security and hygiene\npractices\n1.4\nIdentified faults & problems and the necessary\ncorrective action\n1.5\nPromoted public relation among others\n1.6\nComplied with quality standards\n1.7\nResponded to emergency situations in line with\nenterprise guidelines\n1.8\nComplied with proper dress code\n\n2. Required Knowledge\n2.1\nCommunication\n2.1.1 Interactive communication with others\n2.1.2 Interpersonal skills\n2.1.3 Good working attitude\n2.1.4 Ability to work quietly; with cooperation;\npatience, carefulness, cleanliness and aesthetic\nvalues\n2.1.5 Ability to focus on task at hand\n2.2\nSystems, Processes and Operations\n2.2.1 Workplace health, safety and security\nprocedures\n2.2.2 Emergency procedures\n2.2.3 Personal presentation\n2.3\nSafety Practices\n2.3.1 Proper disposal of garbage\n2.3.2 Practice safety measures\n2.3.3 5S Implementation\n\n3. Required Skills\n3.1\nAbility to make decision\n3.2\nTime management\n3.3\nAbility to offer alternative steps\n3.4\nCare in handling and operating equipment\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nProcedures Manual on safety, security, health and\nemergency\n4.2\nAvailability of tools, equipment, supplies and materials\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nWritten examination\n5.2\nPractical demonstration\n5.3\nInterview\n\n6. Context of Assessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through TESDA's\naccredited assessment center\n\n--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 26\nUNIT OF COMPETENCY :\nPROVIDE EFFECTIVE CUSTOMER SERVICE\n\nUNIT CODE\n\n:\nTRS311205\n\nUNIT DESCRIPTOR\n:\nThis unit of competency deals with the knowledge, skills\nand attitudes in providing effective customer service. It\nincludes greeting customer, identifying customer needs,\ndelivering service to customer, handling queries through\ntelephone, fax machine, internet and email and handling\ncomplaints, evaluation and recommendation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized items are elaborated in the Range of Variables\n1. Greet customer\n1.1\nGuests are greeted in line with enterprise procedure\n1.2\nVerbal and non-verbal communications are\nappropriate to the given situation\n1.3\nNon verbal communication of customer is observed\nresponding to customer\n1.4\nSensitivity to cultural and social differences is\ndemonstrated\n\n2. Identify customer\nneeds\n2.1\nAppropriate interpersonal skills are used to ensure\nthat customer needs are accurately identified\n2.2\nCustomer needs are assessed for urgency so that\npriority for service delivery can be identified\n2.3\nCustomers are provided with information\n2.4\nPersonal limitation in addressing customer needs is\nidentified and where appropriate, assistance is sought\nfrom supervisor\n\n3. Deliver service to\ncustomer\n3.1\nCustomer needs are promptly attended to in line with\nenterprise procedure\n3.2\nAppropriate rapport is maintained with customer to\nenable high quality service delivery\n3.3\nOpportunity to enhance the quality of service and\nproducts are taken wherever possible\n\n4. Handle queries through\ntelephone, fax\nmachine, internet and\nemail\n4.1\nUse telephone, computer, fax machine, internet\nefficiently to determine customer requirements\n4.2\nQueries/ information are recorded in line with\nenterprise procedure\n4.3\nQueries are acted upon promptly and correctly in line\nwith enterprise procedure\n\n5. Handle complaints,\nevaluation and\nrecommendations\n5.1\nGuests are greeted with a smile and eye-to-eye\ncontact\n5.2\nResponsibility for resolving the complaint is taken\nwithin limit of responsibility\n5.3\nNature and details of complaint are established and\nagreed with the customer\n5.4\nAppropriate action is taken to resolve the complaint to\nthe customers satisfaction wherever possible\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 27\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Non-verbal\ncommunication\nMay include:\n1.1\nbody language\n1.2\ndress and accessories\n1.3\ngestures and mannerisms\n1.4\nvoice tonality and volume\n1.5\nuse of space\n1.6\nculturally specific communication customs and\npractices\n\n2. Cultural and social\ndifferences\nMay include:\n2.1\nmodes of greeting, farewelling and conversation\n2.2\nbody language/ use of body gestures\n2.3\nformality of language\n\n3. Interpersonal skills\nMay include:\n3.1\ninteractive communication\n3.2\npublic relation\n3.3\ngood working attitude\n3.4\nsincerity\n3.5\npleasant disposition\n3.6\neffective communication skills\n\n4. Customer needs\nMay include :\n4.1\nthose with a disability\n4.2\nthose with special cultural or language needs\n4.3\nunaccompanied children\n4.4\nparents with young children\n4.5\npregnant women\n4.6\nsingle women\n\n5. Enterprise procedure\nMay include:\n5.1\nmodes of greeting and farewelling\n5.2\naddressing the person by name\n5.3\ntime-lapse before a response\n5.4\nstyle manual requirements\n5.5\nstandard letters and proformas\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 28\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate :\n1.1\nComplied with industry practices and procedures\n1.2\nUsed interactive communication with others\n1.3\nComplied with occupational, health and safety\npractices\n1.4\nPromoted public relation among others\n1.5\nComplied with service manual standards\n1.6\nDemonstrated familiarity with company facilities,\nproducts and services\n1.7\nApplied company rules and standards\n1.8\nApplied telephone ethics\n1.9\nApplied correct procedure in using telephone, fax\nmachine, internet\n1.10 Handled customer complaints\n\n2. Required Knowledge\n2.1\nCommunication\n3.3.1 Interactive communication with others\n3.3.2 Interpersonal skills/ social graces with\nsincerity\n2.2\nSafety Practices\n2.2.1 Safe work practices\n2.2.2 Personal hygiene\n2.3\nAttitude\n2.3.1 Attentive, patient and cordial\n2.3.2 Eye-to-eye contact\n2.3.3 Maintain teamwork and cooperation\n2.4\nTheory\n2.4.1 Selling/upselling techniques\n2.4.2 Interview techniques\n2.4.3 Conflict resolution\n2.4.4 Communication process\n2.4.5 Communication barriers\n\n3. Required Skills\n3.1\nEffective communication skills\n3.2\nNon-verbal communication - body language\n3.3\nGood time management\n3.4\nAbility to work calmly and unobtrusively effectively\n3.5\nAbility to handle telephone inquiries and conversations\n3.6\nCorrect procedure in handling telephone inquiries\n3.7\nProper way of handling complaints\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nAvailability of telephone, fax machine, internet, etc.\n4.2\nAvailability of data on projects and services; tariff and\nrates, promotional activities in place etc.\n4.3\nAvailability of office supplies\n\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1\nWritten examination\n5.2\nPractical demonstration\n\n6. Context for\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (assessment centers)\n6.2\nAssessment activities are carried out through\nTESDA's accredited assessment center\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 29\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nRESEARCH INFORMATION RELEVANT TO THE\nLOCALITY AND TOUR ITINERARY\n\nUNIT CODE\n:\nTRS5113116\n\nUNIT DESCRIPTOR\n:\nThis unit deals with the knowledge, skills and attitudes\nrequired to access and research information about a\nspecific\nlocation/destination\nfor\ndeveloping\nand\ncompleting the itinerary of a tour package. The local guide\nalways undertakes this competency whenever the\nitinerary includes extra-ordinary sites and sights.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Source information\n1.1\nResearch sources and appropriate methodologies\nare selected based on the type of information sought\n1.2\nEssential information on the locality/ destination is\nidentified\n1.3\nLocal sites, sights, events and features are\nidentified in consultation with other tour guides,\ncolleagues and company officials\n1.4\nSites and sights are assessed for client suitability\nincluding:\n1.4.1 accessibility\n1.4.2 features, benefits and significance\n1.4.3 environmental impact; historical value\n\n2. Arrange information\n\n2.1\nResearched information is classified, arranged and\nfiled for reference\n2.2\nMultiple components to create maximum value and\ninterest are combined and integrated\n2.3\nInformation researched are classified and filed in a\nlogical manner according to client’s interest\n2.4\nCompany officials are informed of changes in costs of\ntour components based on researched information\n2.5\nRevised costs structures to include full details of all\nchanges, inclusions, exclusions and add -on are\npresented to company officials\n2.6\nChanges in response to feedback from\nvisitors/colleagues are reviewed and adjusted\n2.7\nLegal requirements are checked and incorporated in\nthe files based on national and local statutes\n\n3. Develop tour scripts\nand commentaries\nrelevant to the tour\nitinerary and/or to the\ninterest of the clients\n3.1\nTour spiels are developed in accordance with\nrequirements of specific tour itineraries or\nspecific clients of the locality\n3.2\nAppropriate commentary and tour spiels are prepared\nbased on research conducted\n3.3\nOn a case-to-case basis, tour spiel are tailored-fit to\nthe interest of the clients\n3.4\nCommentary and tour spiel that are acceptable to the\nclients, without political or religious attachments are\ndeveloped\n3.5\nTour spiel and itinerary are presented to the tour\noperator for information prior to implementation\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 30\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate\nmethodologies\nMay include:\n1.1\ndesk research\n1.2\npersonal contact with tourism authorities\n1.3\nproduct suppliers\n1.4\ndistribution networks\n1.5\nocular inspections and sharing of information with\nindustry colleagues\n\n2. Essential information\non the\nlocality/destination\nMay include:\n2.1\nClimate and geography – location and major geo-\nphysical features; weather patters of the locality;\nextreme weather conditions and seasons\n2.2\nEnvironment, flora and fauna – an overview of native\nflora and fauna and their characteristics; major natural\nattractions and the key features in the locality; the\nnatural environment as a tourism asset\n2.3\nHistory – overview of Philippine history and the history\nof the region – main events, dates, characters and\nstructures\n2.4\nPhilippines and Indigenous Culture – art, theatre,\nmusic and literature – key performer, writers and\nartists; major works by the Filipinos and major cultural\nevents; Architecture – major styles and their\nproponents; Key cultural structures in the locality.\nIndigenous cultures and activities within the local area\n(if any)\n2.5\nReligion and Education – religious make-up Filipino\nsociety; religious beliefs, practices and events in the\nlocality; K-12. Filipino as the national language;\nEnglish as a second language. Local languages\n2.6\nGovernment and governance – political units of\ngovernance; political parties, major political figures,\ncurrent political issues.\n2.7\nTransportation and other services – mainstream\nmodes of transport in the locality and the Philippines;\nother support: banking services, communications,\nhealth, sanitation\n2.8\nEconomy – key elements: agriculture, trade and\nindustry. Major local and Philippine products; current\nissues of the economy; science and technology: key\ninventions or discoveries\n2.9\nFruits, food, beverages and crafts. Best known local\nnational dishes and fruits. Native drinks and local\nhandicrafts.\n2.10 Social structure, life style and Filipino family and social\nvalues. “utang na loob” and “pakikisama\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 31\n\nVARIABLE\nRANGE\n3. Local sites,sights,\nevents and features\n\nMay include:\n3.1\nman-made attractions and structures\n3.2\nnatural attractions and locations\n3.3\nsites of historical events\n3.4\nreligious and cultural festivals\n3.5\nconference and social events\n3.6\nextraordinary natural formations\n3.7\nspecial events or festivities\n3.8\nindigenous peoples\n3.9\nflora and fauna\n3.10 remote and inaccessible places\n3.11 special interest/activities\n\n4. Visitors profiles\nMay include:\n4.1\nEconomy – agriculture, aqua-culture, trade, commerce\nand industry\n4.2\nSocial Sciences – geography, history, heritage,\nculture, music, arts, crafts\n4.3\nEnvironment – climate, endemic flora, fauna, fruits,\nenvironmental protection and conservation\n4.4\nReligion, Education, Sports and Governance – K to 12,\npolitical and sports figures\n4.5\nSupport Services – transportation and accessibility,\nbanking and finance, health and sanitation, food and\nbeverages\n\n5. Requirements of\nspecific visitors\nMay include:\n5.1\naccommodations, attractions, accessibility, budget,\nproduct or service\n5.2\npreference, time-constraints, cultural, political and\nreligious issues\n5.3\nSpecial interest integrated w/in a wider tour program (e.g\nscuba diving, land-based or sea based)\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 32\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nSourced and wrote a range of spiel on different sites\nand sights\n1.2\nDeveloped and delivered a tour spiel that meets both\nvisitor expectations and needs and the requirements\nof the enterprise\n1.3\nDemonstrated knowledge of the components of the\ntour or tour itinerary product\n1.4\nDemonstrated working knowledge of the client’s\nprofile\n\n2. Required\nKnowledge\n2.1\nLocal regulations and their impact on the tour itinerary\n2.2\nIndustry practices relevant to sites and sights\n2.3\nKnowledge of the clients’ interest in relation to the\ntour itinerary\n2.4\nIndustry practices in the packaging of tour products as\nappropriate to different sectors\n2.5\nTour spiel formats\n2.6\nResearch methodology\n\n3. Required Skills\n3.1\nUse of electronic resources for research\n3.2\nCommunication skills\n3.3\nSpiel constructions sequencing and development\nskills\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nAccess to a simulated work environment e.g. mock\ntour\n4.2\nActivities that allow the candidate to create range of\nguiding scenarios and situations for the various types\nof visitor e.g. role play\n4.3\nAdequate timeframes for the assessment process\n4.4\nPresence of typical constraints in the guiding activity\n(e.g. schedules, weather conditions, time limitations,\nbudget)\n\n5. Methods of Assessment Competency in this unit may be assessed through:\n5.1\nInterview on the knowledge of tour package\ncomponents and information relevant the tour itinerary\nand the visitors’ profile\n5.2\nDemonstration on how to plan and conduct a tour visit\nto a sites and sights\n5.3\nObservation of the delivery process through\nsimulation or actual performance\n5.4\nReview of portfolios of evidence\n5.5\nThird party workplace reports of on-the-job\nperformance\n\n6. Context for\nAssessment\n\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (accredited TESDA\nassessment centers)\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 33\nUNIT OF COMPETENCY :\nCOORDINATE TOUR ARRANGEMENTS FOR CLIENTS\n\nUNIT CODE\n:\nTRS5113117\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitude\nrequired for coordinating the tour arrangements included\nin the tour itinerary and making provisions for additional\nchanges and revisions as contracted by a tour operator or\ntour organizer.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform pre-arrival\n checks\n1.1 Inclusions of the tour itinerary are determined as to\nclient’s requirements\n1.2 Tours components that are for the visitors’ personal\naccount are determined based on enterprise policy\n1.3 Reserved tour components are verified and changes\neffected as necessary\n1.4 Required tour documents are collected and cash\nadvances are secured, as necessary\n\n2. Coordinate tour\narrangements\n\n2.1\nDelivery of tour components are supervised in\naccordance with tour arrangements\n2.2\nCompliance of suppliers of reserved tour components\nare checked\n2.3\nProper accounting of money paid or accounts dues to\nand from visitors and/or suppliers are conducted\nbased on enterprise instructions and procedures\n2.4\nRelevant information on the suppliers services,\namenities and facilities is provided\n2.5\nOptional visitors’ request from the suppliers are\nfacilitated\n2.6\nVisitors are politely reminded to pay for all expenses\nof a personal nature\n\n3. Resolve complaints\nand other emergencies\n3.1\nResolution of complaints and other emergencies are\ngiven assistance based on enterprise policy\n3.2\nNature of complaint with supplier concerned is\nevaluated\n3.3\nAppropriate solutions are determined and applied\n3.4\nConcerned government authorities are notified about\nthe situation whenever necessary\n3.5\nTour operator or organizer are notified about the\nsituation\n3.6\nAll incidents are documented in final report\n\n4. Perform post-departure\nactivities\n4.1\nRevisions and cancellations of services rendered or\nnot rendered are reported in accordance with\nenterprise guidelines and procedures\n4.2\nAdditional revenue or expenses incurred are\naccounted\n4.3\nClients’ feedbacks are reported based on enterprise\npolicy\n4.4\nReport on expenses incurred in connection with the\ntour itinerary submitted\n\n--- PDF PAGE 36 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 34\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Clients’ requirements\n(Needs of the group)\nMay include:\n1.1\nrevised hotel accommodations\n1.2\nrevised food requirements\n1.3\nseating arrangements in the tour vehicle\n1.4\nany other need arising from the tour itinerary\n\n2. Required tour\ndocuments and cash\nadvances\nMay include:\n2.1\nName list and/or rooming list\n2.2\nExchange voucher\n2.3\nTour or exchange order\n2.4\nCash advanced for payment of service\n2.5\nCash advanced for contingency/emergency purposes\n\n3. Tour suppliers\nMay include:\n3.1\nProviders of tour services or components\n3.2\nProviders of optional or additional services or\ncomponents\n\n4. Relevant information\n May include:\n4.1\nExpenses of a personal natures, such as cover\ncharges, minimum charges, optional amenities (TV or\nrefrigerator in room)\n4.2\nDescription of suppliers’ location, highlights, facilities,\nservices and rates when applicable\n\n5. Visitor’s feedbacks\nMay include:\n5.1\nOver-charging\n5.2\nCharging for items not consumed\n5.3\nCharges for items available but not availed of\n5.4\nPurchased of fake or imitation material\n5.5\nExcess luggage charges\n5.6\nUpgrade or down grade of services\n5.7\nUnwarranted delays and cancellations\n5.8\nPoor quality/quantity of food/drinks\n5.9\nPoor performance of technical equipment\n5.10 Poor transportation services\n\n6. Emergencies\nMay include:\n6.1\nTheft and robbery\n6.2\nSnatching\n6.3\nMuggings\n6.4\nRoad and other accidents\n6.5\nIllness/sickness\n6.6\nInjury or death\n\n7. Expenses of personal\nnature\nMay include:\n7.1\nAlcoholic drinks\n7.2\nPostage and phone calls\n7.3\nLaundry\n7.4\nMeals not included in the tour package or tour itinerary\n\n--- PDF PAGE 37 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 35\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPerformed pre – arrival checks\n1.2\nCoordinated tour arrangements\n1.3\nResolved complaints and other emergencies\n1.4\nPerformed post – departure activities\n\n2. Required Knowledge\n2.1\nCheck-in and check-out procedures\n2.1.1 Transportation company\n2.1.2 Lodging establishment\n2.1.3 Any other establishment\n2.2\nStandard Operating Procedures\n2.2.1 Transportation company\n2.2.2 Lodging establishment\n2.2.3 Other visitor-related establishments\n2.3\nKnowledge of room categories, room types and\npublished rates and the schedules of airlines, shipping\ncompanies, bus / train companies\n2.4\nKnowledge of other suppliers’ locations, amenities,\nservice, facilities, highlights and rates\n2.5\nLocal/municipal travel tour regulation and ordinances\n2.6\nAccommodations, restaurants, shopping sites and\ntourism-related establishments in the\nlocality/destination\n\n3. Required Skills\n3.1\nEnglish language–fluency and effective\ncommunication skills\n3.2\nUse of telephone, fax and two – way radio\n3.3\nCultural sensitivity awareness and practices\n3.4\nDecision-making and problem solving skills\n3.5\nPeople skills (Emotional Quotient (EQ))\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nTelephone / two – way radio, fax and computer\n4.2\nWorkplace location\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nInterview\n5.2\nWritten test\n5.3\nObservation and simulated or actual demonstration\n\n6. Context for\nAssessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (Accredited TESDA\nassessment centers)\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 36\nUNIT OF COMPETENCY :\nACCOMPANY AND GUIDE CLIENTS IN\n ACCORDANCE WITH THE TOUR ITINERARY\n\nUNIT CODE\n:\nTRS5113118\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills required for\naccompanying and guiding clients, perform safety\npractices and resolve complaints and other emergencies\nin locality as contracted by a tour operator or local\norganization.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Meet and assist the\nclients upon arrival at\nthe destination\n1.1\nComposition and responsibility of the local tour\nguide are determined as per company policies and\nprocedures\n1.2\nArrival schedules are checked\n1.3\nReservations of the tour itinerary are double-checked\n1.4\nTour itinerary is checked for compliance with clients’\nrequirements\n1.5\nClients are met and greeted at the gateway\n1.6\nClients are segregated from the general crowd to give\nwelcome briefing before boarding\n1.7\nClients’ baggage is checked and boarded\n1.8\nClients are accompanied to the place of lodging and a\nwelcome spiel and relevant commentary are delivered\n1.9\nAssistance is provided with the registration formalities\nat the place of lodging during check-in\n1.10 Clients are reminded of the next activity\n\n2. Accompany and guide\nthe clients while on\ntour\n\n2.1\nAppropriate attire is worn during tour\n2.2\nPersonal hygiene as per accepted social norms is\nobserved and practiced\n2.3\nPick up points, routing and stopovers are coordinated\nwith tourist vehicle driver\n2.4\nClients are provided with a summary of the days’\nactivities – routings, stop overs and durations at the\nstart of the activity\n2.5\nClients are provided assistance and\nquestions/concerned are addressed\n2.6\nClients movements are properly and safely managed\nduring tour stop overs and walkabouts\n2.7\nHead counts are conducted before starting the tour,\nduring and after the activity – or whenever or wherever\npossible\n2.8\nOptional tours are recommended and sold\n2.9\nClients are reminded of safety precautions\n2.10 Vehicles are checked for belonging left behind after\nevery tour\n2.11 Situation awareness and presence of mind is practiced\nat all times to prevent accidents and other unforeseen\nsituations\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 37\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Deliver of information,\ntour spiels and\ncommentaries\n\n3.1\nRelevant and timely commentaries are provided\n3.2\nRelevant and timely instructions are provided, when\nneeded\n3.3\nProper posture and position is assumed at all times\n3.4\nCommentaries are delivered with proper voice\nmodulation and pronunciation\n3.5\nAppropriate terminologies and up-to-date information\nare used at all times\n3.6\nPositive interaction and rapport with visitors is\ndeveloped and practiced\n\n4. Resolve complaints\nand other emergencies\n4.1\nComplaints are addressed and referred to the\nperson/s concerned\n4.2\nVisitors comfort is ensured throughout the tour\n4.3\nStress situations are avoided and handled tactfully\n4.4\nDamage control in abnormal situations is adopted\nwithout blaming anybody\n4.5\nTour operator is notified of the remedial measures in\nabnormal situations\n4.6\nBest solutions to abnormal situations are determined\nand applied with the company’s approval\n5. Provides send-off\nassistance in hotel\ndeparture formalities\n5.1\nAssistance is provided with check-out formalities at the\nplace of lodging in accordance with establishment\nprocedures\n5.2\nCollection of luggage and boarding of visitors’ luggage\nare overseen\n5.3\nReturn of hotel room keys or room access cards are\noverseen\n5.4\nVisitors are accompanied to the departure place –\nairport, pier or bus station\n5.5\nRelevant information en route is provided and bade\ngood bye to visitors\n\n6. Develop tour guide -\ntour driver work\nrelationship (teamwork)\n6.1\nCoach current registration is checked\n6.2\nDriver’s complete name is sought and rapport is\nestablished before the tour begins\n6.3\nSound system (PA) and microphone are double\nchecked\n6.4\nCleanliness and condition of the coach are always\nchecked, especially the defective seats or armrest\n6.5\nFull loaded first aid kit in the coach and fire\nextinguisher are checked\n6.6\nDriver is made familiar with the given itinerary – routes\nand stopovers – before the tour starts\n6.7\nDriver’s attitude and protocol to passengers are\nobserved and corrected gently, if driver has an attitude\nproblem\n6.8\nThings left behind inside the coach after the tour are\ndouble-checked\n6.9\nDriver’s meals and physical condition are checked,\nespecially on long trips\n6.10 Whenever applicable, assistance is provided to the\ndriver when unexpected developments occur(eg.flat\ntires)\n6.11 Due recognition is given to driver for a job well done\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 38\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Responsibility of local\nguide\nMay include:\n1.1\nThe use of map, compass, ballpen, pencil, camera,\ntwo-way radio, cell phone, whistle, banner, hat, bull\nhorn, sun block, lotion, first aid kit\n\n2. Appropriate attire\n2.1\nAuthorized tour guide apparel is based on the type of\ntour and type of visitor to be guided\n2.2\nTour guide name plate is desirable\n\n3. Personal hygiene\n3.1\nSocial norms require individual to bath, comb hair,\nbrush teeth, cut nails, iron clothes and polish shoes\n\n4. Personal belongings\n4.1\nVisitors’ personal belonging range from jewelry, to\nclothing and money\n\n5. Relevant information\nMay include:\n5.1\nEconomy – agriculture, aqua-culture, trade,\ncommerce and industry\n5.2\nSocial Sciences – geography, history, heritage,\nculture, music, arts, crafts\n5.3\nEnvironment – climate, endemic flora. fauna, fruits,\nenvironmental protection and conservation\n5.4\nReligion, Education, Sports and Governance – K-12,\npolitical and sports figures\n5.5\nSupport Services – transportation and accessibility,\nbanking and finance, health and sanitation, food and\nbeverage\n5.6\nCurrent events and holidays\n\n6. Complaints\nMay include:\n6.1\nLoss of luggage\n6.2\nLost, misplaced or damaged personal belongings and\ndocuments\n6.3\nPilferage\n6.4\nAlso includes arrangements not in accordance with\nthe reservations or delayed delivery of services\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 39\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nMet and assisted the visitors upon arrival\n1.2\nAccompanied and guided visitors while on tour\n1.3\nDelivered information, tour spiels and commentaries\n1.4\nResolved complaints and other emergencies\n1.5\nProvided send off assistance in hotel departure\nactivities\n1.6\nDeveloped tour guide-tour driver relationship\n(teamwork)\n\n2. Required Knowledge\nGeneral knowledge of the Philippines and specific\nknowledge of the locality including:\n2.1\nClimate (weather patterns including any extreme\nconditions, impact of climate on lifestyle, stories\nassociated with climate in a local area)\n2.2\nGeography and geology (major land\nformations/landmarks/natural attractions and their key\nfeatures for both Philippines and local region)\n2.3\nHistory (historical development of Philippines and the\nlocality, major historical events and prominent\nindividuals, key dates, overview of Philippine\nindigenous history)\n2.4\nArchitecture (major styles and their proponents, key\nbuildings and structures both in Philippines and the\nlocal area)\n2.5\nCultural elements (overview of indigenous cultures\nwithin the Philippines, different cultures within the\nPhilippines and the local area, cultural activities, local\ncustoms)\n2.6\nArt, theatre, music and literature (key performers,\nwriters and artists, major works by the Filipinos, major\ncultural events)\n2.7\nReligion (religious make-up for Filipinos and the local\narea, religious practices)\n2.8\nNatural environment and tourism (how the\nenvironment is a tourism asset, impacts of tourism on\nthe environment, land management in Philippines\nincluding the role of National Parks).\n2.9\nFlora and fauna (overview of native flora and fauna,\ntheir characteristics and key locations)\n2.10 Government and politics (general structure, political\nsystem, major political figures, current political\nissues)\n2.11 Transport (main transport systems, usage of different\nforms of transport across Philippines, historical\ndevelopment of different forms of transport)\n2.12 Agriculture (Philippines history as a primary producer,\nkey products of the Philippines, current issues)\n2.13 Science and technology (Philippine contribution both\npast and present, prominent individuals, key\ndiscoveries)\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\n\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 40\n\n2.14 Sport (main Filipinos sporting activities, Philippines\nsporting record, local sporting focus, sporting\nfacilities, sporting comparisons with other countries or\nareas)\n2.15 Economy (overview of current state of the economy,\nkey features of the local economy and local industry).\n2.16 Trade (Philippines key exports and its main trading\npartners)\n2.17 Education (overview of school and higher education\nsystems, comparisons of systems to those of other\ncountries)\n2.18 Food (Local dishes and produce)\n2.19 Local wines and spirits\n2.20 Lifestyle (key features of the day-to-day living patterns\nof Philippines and local people, family and social\ncustoms)\n2.21 Shopping (key locations, local products)\n2.22 Tourism services and local facilities of interest to\nvisitors (currency exchange locations, tour booking\noffices, accommodation, attractions, banks, dry\ncleaners, medical facilities)\n2.23 Current events in Philippines and the local region\nKnowledge of the form of government or geo-politics but not\npolitical ideas\n2.24 Tour guide’s code of ethics\n\n3. Required Skills\n3.1\nAbility to speak fluently In English and the local\ndialects\n3.2\nAbility to use office equipment\n3.3\nAbility to tactfully answer and handle sensitive\nquestion and situation\n\n4. Resource Implications\nThe following resources should be provided:\n4.1\nAccess to workplace location\n4.2\nAccess to telephone, two-way radio, fax, computer and\nany relevant equipment for tour guiding\n\n5. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n5.1\nInterview\n5.2\nWritten test\n5.3\nSimulated or actual demonstration (mock tour and/or\nrole play)\n5.4\nObservation\n\n6. Context of assessment\n6.1\nAssessment may be done in the workplace or in a\nsimulated workplace setting (Accredited TESDA\nassessment centers)\n\n--- PDF PAGE 43 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 41"
