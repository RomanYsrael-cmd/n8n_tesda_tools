        "evidence_guide": {
          "source_text": "1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nMet and assisted the visitors upon arrival \n1.2 \nAccompanied and guided visitors while on tour \n1.3 \nDelivered information, tour spiels and commentaries \n1.4 \nResolved complaints and other emergencies \n1.5 \nProvided send off assistance in hotel departure \nactivities  \n1.6 \nDeveloped tour guide-tour driver relationship \n(teamwork) \n \n2.  Required Knowledge  \nGeneral knowledge of the Philippines and specific \nknowledge of the locality including: \n2.1 \nClimate (weather patterns including any extreme \nconditions, impact of climate on lifestyle, stories \nassociated with climate in a local area) \n2.2 \nGeography and geology (major land \nformations/landmarks/natural attractions and their key \nfeatures for both Philippines and local region) \n2.3 \nHistory (historical development of Philippines and the \nlocality, major historical events and prominent \nindividuals, key dates, overview of Philippine \nindigenous history) \n2.4 \nArchitecture (major styles and their proponents, key \nbuildings and structures both in Philippines and the \nlocal area) \n2.5 \nCultural elements (overview of indigenous cultures \nwithin the Philippines, different cultures within the \nPhilippines and the local area, cultural activities, local \ncustoms) \n2.6 \nArt, theatre, music and literature (key performers, \nwriters and artists, major works by the Filipinos, major \ncultural events) \n2.7 \nReligion (religious make-up for Filipinos and the local \narea, religious practices) \n2.8 \nNatural environment and tourism (how the \nenvironment is a tourism asset, impacts of tourism on \nthe environment, land management in Philippines \nincluding the role of National Parks). \n2.9 \nFlora and fauna (overview of native flora and fauna, \ntheir characteristics and key locations) \n2.10 Government and politics (general structure, political \nsystem,  major political figures, current political \nissues) \n2.11 Transport (main transport systems, usage of different \nforms of transport across Philippines, historical \ndevelopment of different forms of transport) \n2.12 Agriculture (Philippines history as a primary producer, \nkey products of the Philippines, current issues) \n2.13 Science and technology (Philippine contribution both \npast and present, prominent individuals, key \ndiscoveries)\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08 \n \nTR – LOCAL GUIDING SERVICES NC II (Amended)                  Promulgated December 2013 \n 40 \n \n \n2.14 Sport (main Filipinos sporting activities, Philippines \nsporting record, local sporting focus, sporting \nfacilities, sporting comparisons with other countries or \nareas) \n2.15 Economy (overview of current state of the economy, \nkey features of the local economy and local industry). \n2.16 Trade (Philippines key exports and its main trading \npartners) \n2.17 Education (overview of school and higher education \nsystems, comparisons of systems to those of other \ncountries) \n2.18 Food (Local dishes and produce) \n2.19 Local wines and spirits \n2.20 Lifestyle (key features of the day-to-day living patterns \nof Philippines and local people, family and social \ncustoms) \n2.21 Shopping (key locations, local products) \n2.22 Tourism services and local facilities of interest to \nvisitors (currency exchange locations, tour booking \noffices, accommodation, attractions, banks, dry \ncleaners, medical facilities) \n2.23 Current events in Philippines and the local region \nKnowledge of the form of government or geo-politics but not \npolitical ideas \n2.24 Tour guide’s code of ethics \n \n3.  Required Skills  \n3.1 \nAbility to speak fluently In English and the local \ndialects \n3.2 \nAbility to use office equipment \n3.3 \nAbility to tactfully answer and handle sensitive \nquestion and situation \n \n4.  Resource Implications \nThe following resources should be provided: \n4.1 \nAccess to workplace location \n4.2 \nAccess to telephone, two-way radio, fax, computer and \nany relevant equipment for tour guiding \n \n5.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1 \nInterview \n5.2 \nWritten test \n5.3 \nSimulated or actual  demonstration (mock tour and/or \nrole play) \n5.4 \nObservation  \n \n6.  Context of assessment \n6.1 \nAssessment may be done in the workplace or in a \nsimulated workplace setting (Accredited TESDA \nassessment centers)",
