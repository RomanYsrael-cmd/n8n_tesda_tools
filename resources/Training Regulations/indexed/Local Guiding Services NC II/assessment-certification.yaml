  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of LOCAL GUIDING SERVICES NC II, the\ncandidate must demonstrate competence through package-type full qualification\nassessment sequentially covering the core units of competency listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2 Assessment shall focus on the core units of competency. The basic and common\nunits shall be integrated or assessed concurrently with the core units.\n\n4.3 The following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs\n\n4.3.2 Experienced workers (wage employed or self employed)\n\n4.4\nThe guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\n\n--- PDF PAGE 50 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 48\n\n--- PDF PAGE 51 ---\nTR – LOCAL GUIDING SERVICES NC II (Amended) Promulgated December 2013\n 49\n"
