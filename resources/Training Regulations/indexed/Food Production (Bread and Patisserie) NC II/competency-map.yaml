  "source_text": "COMPETENCY MAP - TOURISM Sector\n(Hotel and Restaurant)\nFOOD PRODUCTION (BREAD AND PATISSERIE) NC II\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 225 ---\nDRAFT\nDRAFT\n\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 221\n\nUtilize\nspecialize\nspecialized\ncommunication\nskill\nDevelop\nand lead\nteams\nPerform\nhigher order\nthinking\nprocesses\nand apply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate\nhigher order\nthinking skills\nand adjust\nproblem\nsolving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nimplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nDevelop and update tourism\nindustry knowledge\nObserve workplace hygiene\nknowledge\nPerform computer\noperations\nPerform workplace and\nsafety practices\nProvide effective\ncustomer service\n\nCOMMON COMPETENCIES\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 226 ---\nDRAFT\nDRAFT\n\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 222\n\nClean and maintain\nkitchen premises\nOrganize and prepare\nfood and service for\nbakery and pastry\nproduction\nPrepare and present bakery\nproducts\nPrepare and present basic\npastry products\nPrepare and present basic\nhot, cold and frozen\ndesserts\nPrepare and present\ngateaux, tortes and\ncakes\nPrepare and display petits\nfours\nPrepare chocolate and\nproduce chocolate products\nPresent desserts\n\nCORE COMPETENCIES\n\n--- PDF PAGE 227 ---\nDRAFT\nDRAFT\n\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 223\nGLOSSARY OF TERMS\n\nAeration\nThe rendering of bakery products more appetizing, palatable and\ndigestible by the incorporation of air and/or gas, in one or more of the\nstages of production before baking. Air is introduced by the production of\ncarbon dioxide gas (CO2) from yeast or baking powder. The internal\nexpansion of air and gas and the pressure of steam during baking, all\nmake a contribution to total aeration.\nAlbumen\nOne of the many proteins. Where the term is used in the bakery, it is\ngenerally accepted to mean the white of eggs.\nAll-in Process\nAll the ingredients are mixed together without any preliminary stages.\nAmaretto\nA liqueur from Italy, the primary flavour comes from sweet and bitter\nalmond.\nAngelica\nYoung leaf stalks of a plant which are candied and used for decoration.\nAnglaise Sauce\nKnown as custard sauce, vanilla sauce or crème Anglaise.\nArrowroot\nA kind of thickener, and it thickens at a lower temperature than either\ncornstarch or flour\nAtomiser\nDevices for converting a liquid (colour) into a fine spray under pressure by\nblowing or depressing an air- filled rubber bulb.\nBain Marie\nWater bath used for keeping food warm\nBaking\nTo render bakery products suitable for human consumption and digestion\nby cooking in an oven at correctly controlled temperatures.\nBaking Powder\nAny chemical or mixture of chemicals which, when moistened and heated,\ngenerates gas (usually CO2) which will aerate bread and cakes. Ideally\nthe residual salts of reaction should be tasteless and without odour. The\nbaking powder must comply with the Food and Drugs Act of the country in\nwhich it is used.\nBaking Sheet\nA metal plate on which buns, cakes, pastries and biscuits are baked.\nGenerally they have three upturned sides and an open end. The open end\nwill facilitate cleaning.\nBatch\nThe entire mixing of bread or cakes; the contents of the oven.\nBatter\nMixture of flour and liquids used to make pancakes or crepes and for\ncoating for fried desserts like fritters\nBatter\nA soft, completed cake mixture. A very soft fermented mixture as for\ncrumpets.\nBaume\nDegrees on the scale of a saccharometer (sugar hydrometer).\nBavarois\nWhipped cream and melted gelatine folded to a custard sauce (also\nknown as Bavarian Cream).\nBeat\nThe aeration of fat, sugar, eggs and other materials by beating together.\nThis can be done by hand or by machine.\nBeater\nA hand-shaped implement which, when fixed to a machine, beats\ningredients such as fat, sugar and eggs.\nBeignets\nFritters.\nBeurre Noisette\nBrown butter or hazelnut butter\nBlackjack\nDark caramelized sugar syrup used for colouring rich fruit cake mixing.\nBlanch\n\nPlunge food into boiling water to partly cook\nBlanch\nA term used to describe bringing anything to boiling point quickly. Used\nwith vegetables prior to freezing to slow microbial activity. Also used to\nenable easy removal of skins such as from almond kernels.\nBlind Bake\nBaking pastry to shape with no filling\nBombe Mixture\nMade from egg yolks, sugar, and cream (similar to a parfait)\nBombes\nA frozen dessert with a combination of either Ice Cream, Sorbet, Sherbet\nand Bombe Mixture.\n\n--- PDF PAGE 228 ---\nDRAFT\nDRAFT\n\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 224\nBoulangerie\nBakery department.\nBowl\nA rounded metal container used in the bakery for mixing, beating or\nwhipping by hand. A bowl specially made for a machine is known as a\nmachine bowl.\nBun\nA small yeast fermented or chemically aerated, sweetened cake.\nButtermilk\nIs made from sweet (or sour) milk after it has been churned to remove the\nFat.\nCachous/Dragees Small silver coloured candied sugar balls used for decorating petits fours.\nCake\nRefers generally to a baked mixture of fat, sugar, eggs and flour, with or\nwithout milk, baking powder, A cake can be of any shape or size.\nCake\nRefers generally to a baked mixture of fat, sugar, eggs and flour, with or\nwithout milk, baking powder, A cake can be of any shape or size.\nCake Hoop/Cake\nRing\nA metal ring which supports a cake during baking.\nCake Tins\nSmall or large metal shapes in which cakes are baked. They may be plain\nor fluted.\nCalvados\nApple brandy from France.\nCandied\nSuper saturated sugar solution is used to immerse product. Product\nabsorbs sugar and when dry it is preserved by the sugar\nCandied fruit\nGlace fruits\nCaramel\nSugar solution boiled above 150 ºC until turns golden brown.\nCaramel Fruits\nFruits dipped in Caramel.\nCaramelize\nCooking sugar to above 156ºc at which point it begins to brown\nCassata\nAn Ice cream and Parfait specialty.\nCentigrade\nDivided into 100 degrees, as the centigrade thermometer (first\nconstructed by Celsius, 1701-44), in which the freezing point is zero and\nboiling point is one hundred.\nCharlotte\nMoulded desserts typically made in a dome and pail-shaped moulds.\nChemise\nTo line moulds with gelatine gel or sponge cake\nChocolate\nVermicelli\nPolished granules of Chocolate used as a decorations.\nCoagulate\nSetting of protein, caused by heat\nCoat\nTo cover a cake or biscuit with almond paste and/or icing, fondant, cream\nor chocolate.\nCocoa Powder\nThe finely grown cocoa-press cake still containing a modest amount of\ncocoa butter\nCointreau\nA colourless French liqueur flavoured with peel of curacao oranges.\nCompote\nStewed or boiled fruit.\nCompound\nChocolate\nCocoa butter is replaced with hardened vegetable fat, which has similar\nmelting characteristics to cocoa butter. The cocoa mass is replaced with a\nstrong defatted cocoa powder\nCondensed Milk\nMilk that has had water removed and sugar added. Very thick and sweet\nConfiture\nPreserve fruits suspended in syrup or jelly\nConstituent\nA component part of the whole; one ingredient in a formula.\nCoulis\nLiquidised or pureed fruit sauce\nCoulis\nCooked or raw fruit purees that are sweetened, then used or served as\nsauces.\nCoupe\nAn individual serving bowl.\nCouverture\nPure chocolate Product manufactured with cocoa butter, cocoa mass, milk\npowder, sugar and flavouring. (chocolate)\nCream\nTo beat fat and sugar or fat and flour together until light and fluffy.\nTo add cream as a decoration of filling to a baked cake.\nA common term used to describe all kinds of creams such as dairy cream,\nbutter cream, marshmallow cream, custard cream, etc.\nPoured Fondant\nSugar and glucose with added flavourings\n\n--- PDF PAGE 229 ---\nDRAFT\nDRAFT\n\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 225\nCreaming\nAction of blending fat and sugar to incorporate air\nCrême de Cacao\nA chocolate-flavoured liqueur.\nCrême de Cassis\nLiqueur made from Black currants.\nCrème Fraîche\nA cultured cream made by adding an acid-producing bacteria to\npasteurized heavy cream.\nCrêpes\nThin pancakes\nCrimping\nSqueezing edges of pastry to impart design\nCroquant\nMelted sugar with nuts or rice\nCrystallization\nFormation of crystals deliberately in various sugar boiling operations.\nCup Cakes\nSmall cakes baked in crimped paper cups or cases.\nCurdle\nWhen fat, sugar and eggs are beaten together carefully, an emulsion is\nformed. If during the beating, the eggs are added too quickly, or are too\ncold, or the initial creaming of the fat and sugar is not complete, then the\nmixture will separate and lose its smooth consistency. Some aeration is\nlost when a mixture curdles.\nCurdle\nWhen fat, sugar and eggs are beaten together carefully, an emulsion is\nformed. If during the beating, the eggs are added too quickly, or are too\ncold, or the initial creaming of the fat and sugar is not complete, then the\nmixture will separate and lose its smooth consistency. Some aeration is\nlost when a mixture curdles.\nCurdling\nSeparation of liquid and solids, Emulsion has failed to form or has\nseparated due to bad technique\nDariole mould\nAngle sided mould wider at top than bottom\nDark Chocolate\nChocolate mass, cocoa butter, sugar, lecithin and flavours\nDecorate\nTo add fruits, nuts, sugar, etc. to cakes before baking for the purpose of\ndecorating. This is known as being oven-decorated or oven-finished.\nTo add such decorating materials as the above, almond paste, chocolate,\ncream or icing after baking, generally to make a pattern or a design. The\nword is given special significance in describing artistic work in royal icing.\nDeposit\nThe act of putting cake batter into hoops, pans, tins, etc., either by hand\nor by machine. The machine used is known as a depositor.\nDessert\nFinale of a fine meal\nDoilley\nPaper lace mat used to present product, normally made of paper for\ndesserts and pastry items\nDredge\nTo coat with flour or sugar\nEgg wash\nA little milk and a small pinch of salt added to egg yolk.\nEmulsifier\nA substance that will help the mixing of two products that don’t normally\nmix such as oil and water\nEmulsion\nAn intimate mixture of two fluids that normally would not mix, such as oil\nand water. This is done by means of an emulsifier, a machine that will\nbreak down the oil and water to minute particles while under pressure, for\nexample, homogenized milk. If an emulsifying agent is used then the\nemulsion may become permanent. Fat, sugar and eggs correctly beaten\ntogether form an emulsion, the lecithin in egg yolks being a good\nemulsifying agent.\nEnrobe\nCovering completely with substance\nEnrobed\nChocolate\nA centre is produced first then covered in chocolate\nEntremets\nFrench word for sweet dishes\nEssences\nAromatic compounds used for flavouring confectionery. They can be\nnatural or synthetic or blends of both.\nEssential Oils\nAromatic oils of fruit s, nuts, flowers extracted and used as flavouring.\nFat\nA mixture of triglycerides. Normally solid at room temperature\nFat Bloom\nA yellowish to greyish-white coating on the surface of the chocolate\nFinanciers\nA petit four base made by folding fine almonds into beaten egg whites,\n\n--- PDF PAGE 230 ---\nDRAFT\nDRAFT\n\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 226\nthen adding liquid butter.\nFingers\nSmall finger-shaped rolls, biscuits, meringues, sponge cakes.\nFlambee\nTo set a liqueur or brandy alight during the cooking process.\nFolding\nMethod of gently blending of fragile ingredients\nFondant\nA form of icing made by boiling sugar, water, glucose or a weak acid to\n115¼C (140¼F), then agitating when it is cool until it forms a mass of\nminute crystals. It is the reflection of light on the tiny crystals that explains\nthe gloss on correctly prepared fondant.\nFondant\nLow moisture content sugar syrup containing a small quantity of invert\nsugar which has been rapidly cooled so that the sugar crystals are very\nsmall in size.\nFramboise\nA liqueur distilled from raspberry juice\nFrangelico\nLiqueur derived primarily from hazelnuts but flavoured with berries and\nflowers as well.\nFrangipane\nA mixture of butter, sugar, eggs, almonds and flour baked in a sweet\npaste base.\nFrappé\nChilled\nFriandise\nPetit Fours.\nGalette\nRound and flaky pastry dough\nGanache\nMixture of fresh cream and couverture\nGarnish\nDecoration of the meal\nGelatine\nClear protein that is used set liquids. Can be purchased in powder or clear\nsheets\nGelatinization\nWhen water and starch are heated, the starch grains swell and absorb the\nliquid holding the liquid in suspension\nGianduja\nChocolate praline filling. Prepared from nuts or almonds, sugar and milk\nor plain chocolate\nGlacé\nIce or Ice Cream.\nGlace fruit\nFruit preserved by impregnation with concentrated sugar syrup.\nGlaze\nTo impart a gloss by coating with an agent such as apricot purée/\n Caramelizing sugar by the use of the oven, salamander or blow-torch.\nGliadin\nProtein in flour that the elasticity\nGluten\nProteins glutenin and gliadin when hydrated bond together to form viscous\nsubstance called gluten.\nGlutenin\nProtein in flour that causes strength\nGlycerine\nColourless, odourless syrup with a sweet taste. It is soluble in water and\nalcohol. Because it is highly hygroscopic it is used in cake mixings to\ndelay staling.\nGrand Marnier\nLiqueur made with oranges and aged cognac.\nGratinate\nProcess of browning the surface of foods; predominately sauces, under a\nsalamander\nGrease\nTo brush fat into cake tins or to smear fat over baking sheets.\nGum Arabic\nExudant from Acacia tree ground to powder and when rehydrated is used\nto impart glaze on confectionary products\nHigh-Ratio Cakes The name hi-ratio is registered in the USA. The term is used to describe\ncakes containing high percentages of sugar and liquids based on the\nweight of flour. Special flour and super glycerinated fats are used for this\ntype of cake.\nHulling\nRemoving calyx from strawberries\nHumidity\nMoisture in the air\nHygroscopic\nThe power of attracting moisture. For instance, glycerine is hygroscopic.\nOther examples are icing sugar and bi-carb soda.\nIcing\nThe coating and decoration of a cake with royal or plastic icing. The term\nis also used to describe the decoration of cakes with fondant, water icing,\nor fudge icing.\n\n--- PDF PAGE 231 ---\nDRAFT\nDRAFT\n\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 227\nInvert Sugar\nMixture of dextrose and fructose in approximately equal proportions,\ncreated by treating sucrose with an enzyme – Sucrose +Water = Dextrose\n+Fructose\nKirsch\nLiqueur made from cherries, also known as kirschwasser.\nKneading\nManipulating a dough to develop the gluten and improve texture from\nsticky mass to smooth dough\nLeavening\nIncorporating air into dough by manipulating ingredients\nLeavening agent\nIngredient that can cause gas within a dough or batter\nLecithin\nA phosphorized fatty substance which has a great power as an emulsion\nstabilizer. Egg yolks and soya beans are both rich in lecithin.\nLemon zest\nReferring to the finely grated oily skin of washed untreated lemons\nLiqueurs\nSpirits with an alcohol content of at least 30% vol. sweetened with sugar\nand flavoured with essences, essential oils or fruit juices.\nMacerate\nTo steep in a liquid to soften or absorb flavor, generally applied to fruit.\nMadiera\nA fortified sweet wine.\nMaraschino\nLiqueur made from cherries and used for flavouring.\nMarsala\nAn Italian dessert wine.\nMarshmallow\nConfection or sweetmeat made from water, sugar and gelatine aerated\nand piped to shape. Many uses in pastries and desserts\nMarzipan\nPaste of sugar and ground blanched almonds\nMarzipan paste\nA manufactured paste containing 2/3 blanched almonds and 1/3 sugar.\nMascarpone\nCheese\nMade from fresh cream derived from cow’s milk\nMasking\nCoating of a cake or gateau with icing or coating inside of mould with gel\nMilk Chocolate\nChocolate mass, cocoa butter, sugar, milk powder, lecithin and flavours\nMise en place\nBasic operations prior to the service.\nMoulded\nChocolate\nA shell is produced first, filled with a liquid, semi liquid or even firm fillings\nand later back (sealed) with chocolate\nMouli\nHand operated mill to pulp cooked solids; has been replaced by food\nprocessor or stick wands. It is also known as a food mill.\nMousse\nA dish which is light in consistency, served either hot or cold.\nMousseline\nSauce\nSabayon mix fold into a whipped heavy cream.\nNappe\nTo coat food with a sauce\nNibs\nSmall fragments, such as almond or sugar nibs.\nNougat\nMixture of melted sugar and almonds/hazelnut ground to a paste and mix\nwith chocolate.\nMixture of melted sugar and almonds known as praline – croquant.\nA confection made from sugar, honey, and egg whites, with added Glacé\nfruits and nuts.\nPalette Knife\nA thin, flat knife with a rounded end used for spreading icing and cake\nbatter. An offset or crank-handled palette knife has the blade at a lower\nlevel than the handle. It is used for spreading cake or sponge mixtures on\nto baking sheets.\nPan\nA broad, shallow baking tin.\nPanada\nA thickening agent made from a starch base\nParfait\nFrozen cream mixture made from syrup, egg yolks, and cream, and frozen\nin moulds.\nPectin\nFound mainly in citrus fruits and is used as a gelling agent\nPith\nIn skin wall of citrus fruits just under the white outer coating, the zest\nPound Cakes\nA term used at one time to describe cakes made from 1 lb (500 gm) each\nof butter, sugar, eggs and flour. The term is now often used for cakes\nbaked in a round hoop or oblong tin such as Madeira, Genoa and cherry.\nPraline\nAlmonds and hazelnuts crushed finely and caramelized and mixed with\nmilk chocolate. This paste is used in numerous confections of chocolate\n\n--- PDF PAGE 232 ---\nDRAFT\nDRAFT\n\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 228\nPraline\nCroquant which has been coarsely chopped or milled into a smooth paste.\nPre-gelatinised\nStarch\nPre-gelatinized or soluble starch is produced commercially by blowing a\nstarch suspension onto stem heated rotating rollers. Gelatinization and\ndrying take place and the dried material is then flaked or ground to make\na powder. The process ruptures the starch granules, without completely\ndistorting them, so that they swell in cold water to form a viscous paste.\nPudding\nA soft mixture bake or steam in a basin or dish.\nPurée\nFood passed through a sieve to make a thick pulp.\nReaction\nA chemical reaction resulting in browning, usually caused by the\ninteraction of proteins and carbohydrates\nRecipe\nAn exact formula which will include the weights of the materials to be used\nfor a particular type of bread or confectionery. All other details such as\ntemperature, times, yields, etc., will also be recorded.\nRefresh\nPlunge partly cooked food into cold or ice water to stop the cooking\nprocess\nRennet\nSetting agent derived from the stomach of a calf, used in milk dessert\n'junket'\nRomanoff Sauce\nA mixture of whipped heavy cream and sour cream.\nRoux\nMixture of cooked flour and fat that is used to thicken liquids\nRoyal Icing\nBlended eggwhite and fine icing sugar used to decorate cakes. Dries very\nhard.\nSabayon\nSauce made from the yolks of eggs or either water or wine and sugar,\nbeaten over a double boiler.\nSaccharometer\nInstrument used to measure sugar density of liquid\nSaffron\nDried stigmas of the saffron crocus.\nSalamander\nA type of grill heated from above.\nPiping Bag\nA triangular shaped bag made of cloth or a plastic material into which a\ntube is inserted. It is used for piping meringue, sponge fingers and drops,\nsoft biscuits, choux paste, etc., onto baking sheets. It is also used to pipe\ncream on, or in, cakes and pastries.\nScraper\nA small oblong piece of plastic material, with two corners rounded for\nscraping down mixing bowls. The straight edge of the scraper can be\nused to smooth the side of a cake when coating with cream or butter\ncream. The straight edge can also cut in many ways so that a pattern can\nbe made in the coating, for example, a comb scraper.\nA metal blade in a wooden handle that is used to scrape the surface of a\nbench, or for cleaning metal baking trays.\nSegments\nFruit that has been sliced or portioned with no skin attached\nSieve\nUtensil with a wire or nylon mesh through which dry materials are passed.\nSieving removes coarse particles, extraneous materials and also is a\nmeans of blending. Coarse sieves are used for the cleaning and draining\nof fruit. A sieve can also be used for fluids or semifluids.\nSodium\nBicarbonate\nThe constituent of baking powder that liberates C02. The maximum is\nliberated when the correct amount of acid is present.\nSoft Flour\nFlour containing weak gluten.\nSponge sheets\nSponge baked into thin sheets.\nStandard Recipes List of ingredients for any dish and method of process those ingredient to\nproduce a set amount of food; usually for 10 people\nSteep\nCover food in hot or cold liquid to soften, extract or induce flavour\nStock syrup\nSugar and water brought to boil and any forming scum removed, then\nstored in a clean container (five rich confection parts sugar plus 10%\nglucose in four parts water).\nStrong Flour\nFlour containing strong stable gluten.\nSugar Bloom\nA grey bloom which is generally caused by dampness or condensation\ndissolving the surface of chocolate which recrystallises on drying\n\n--- PDF PAGE 233 ---\nDRAFT\nDRAFT\n\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 229\nSugar syrup\nSee stock syrup: used to carry alcohol or strong flavours into plain sheets\nof sponge, also to add moisture to old product\nSyneresis\nSeparation of liquid from a gel. Egg custard is overcooked and as protein\nshrinks, moisture is squeezed out\nSyrup\nBoiled sugar and water mixture\nTapioca Pearl\nIs derived from the root of the South American cassava plant, it is\navailable in several forms. Tapioca must be soaked in water before\ncooking.\nTempering Kettle Vessel used for heating chocolate working on the warm air principle\nwhere it is protected from water and steam\nTexture\nInternal structure of baked products cellular walls\nTrimmings\nOff cuts of fruit and vegetables that can be utilized in other processes or\ndishes\nTruffles\nA ganache with added butter\nViscosity\nResistance of a liquid to movement or flow\nWash\nTo brush with egg, milk, water, before baking.\nTo brush with a glaze after baking.\nWater Brush\nA soft-haired brush for washing cakes or pastries with water or other\nliquids before baking, or for glazing after baking.\nWhip\nTo rapidly aerate a sponge, meringue or cream by means of a hand or\nmachine whisk.\nWhisk\nAn implement made of wire used to whip sponges, meringues and cream\nby hand. A similar implement is specially made to fix to a machine.\nWhite Chocolate\nCocoa butter, sugar, milk powder, lecithin and flavours\nYield\nThe calculated units from the total baked weight of a particular formula.\nZest\nOuter rind of citrus fruits where the volatile oils reside\nZuppa Inglese\nTrifle with fresh fruit, served in a glass bowl\n\n--- PDF PAGE 234 ---\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 230\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title :\nQualification Code :\nFood Production (Bread and Patisserie) NC II\nTRSFBP222\n\nRevision\nNo.\nDocument\nType\nQualification\nTitle\nTESDA Board\nResolution\nNo./Date\nDeployment (TESDA\nCircular/Implementing\nGuidelines)\n00\nDocument\nCreated\nBread and Pastry\nProduction NC II\n2009-12 /\n7/13/2009\n\nNA\n01\nDocument\nAmended\nFood Production\n(Bread and\nPatisserie) NC II\n2025-12 /\n9/29/2025\n039 series of 2026\nLegend:\n*Description Types\n-\nDocument Created\n-\nDocument Amended\n-\nDocument Superseded\n\n--- PDF PAGE 235 ---\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 231\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\nThe TECHNICAL AND INDUSTRY EXPERT AND REVIEW PANEL\n\nHEINZ PELAYO\nARISTEO C. CUETO\nNational Master Assessor;\nNational Master Assessor;\nChef Consultant, Peotraco Food, Inc.;\nChef Instructor,\nChair, Culinary Arts\nCollege of International Tourism\nCollege of International Tourism\nand Hospitality Management\n and Hospitality Management\nLyceum of the Philippines University-\nLyceum of the Philippines University\nBatangas\nIntramuros, Manila\nTIBFI/COHREP\nPastry Alliance of the Philippines/TIBFI\n\nABRAM EMANUEL R. PERALTA\nA