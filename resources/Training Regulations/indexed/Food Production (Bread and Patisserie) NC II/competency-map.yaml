  "source_text": "SECTION 1\nFOOD PRODUCTION (BREAD AND PATISSERIE) NC II\nQUALIFICATION\n\nThe FOOD PRODUCTION (BREAD AND PATISSERIE) NC II Qualification consists\nof competencies that a person must achieve to be able to clean equipment , tools and\nutensils and prepare, portion and present pastries, breads and other dessert items to\nguests in food production operations.\n\nThis Qualification is packaged from the competency map of the Tourism Sector\nas shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n\n400311210\nParticipate in workplace communication\n400311211\nWork in a team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the workplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\n\nTRS311201\nDevelop and update industry knowledge\nTRS311202\nObserve workplace hygiene procedures\nTRS311203\nPerform computer operations\nTRS311204\nPerform workplace and safety practices\nTRS311205\nProvide effective customer service\n\nCODE NO.\nCORE COMPETENCIES\n\nTRS751301\nClean and maintain kitchen premises, equipment and tools\nTRS751302\nOrganize and prepare food and service for bakery and pastry\nproduction\nTRS751303\nPrepare and present bakery products\nTRS751304\nPrepare and present basic pastry products\nTRS751305\nPrepare and present basic hot, cold and frozen desserts\nTRS751306\nPrepare and present gateaux, tortes and cakes\nTRS751307\nPrepare and present petits fours\nTRS751308\nPrepare chocolate and produce chocolate products\nTRS751309\nPresent desserts\n\n--- PDF PAGE 6 ---\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023 2\nA person who has achieved this Qualification is competent to be a:\n\n❑ Kitchen Hand\n❑ Commis - Pastry\n❑ Baker\n\n--- PDF PAGE 7 ---\nTR – Food Production (Patisserie) NC II Promulgated 09/16/2023 3"
