work instructions Manage and evaluate usage of information Lead in improvement of Occupational Safety and Health Program, Policies and Procedures Lead towards improvement of environmental work programs, policies and procedures Sustain entrepreneurial skills Manage and sustain effective communication strategies Manage and sustain high performing teams Evaluate higher order thinking skills and adjust problem solving techniques Advocate strategic thinking for global citizenship Incorporate innovation into work procedures Develop systems in managing, and maintaining information Manage implementation of OSH programs in the workplace Manage implementation of environmental program in the workplace Develop and sustain a high- performing enterprise Develop and update tourism industry knowledge Observe workplace hygiene knowledge Perform computer operations Perform workplace and safety practices Provide effective customer service --- PDF PAGE 226 --- Food Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023 222 Clean and maintain kitchen premises Organize and prepare food and service for bakery and pastry production Prepare and present bakery products Prepare and present basic pastry products Prepare and present basic hot, cold and frozen desserts Prepare and present gateaux, tortes and cakes Prepare and display petits fours Prepare chocolate and produce chocolate products Present desserts --- PDF PAGE 227 --- Food Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023 223 Aeration The rendering of bakery products more appetizing, palatable and digestible by the incorporation of air and/or gas, in one or more of the stages of production before baking. Air is introduced by the production of carbon dioxide gas (CO2) from yeast or baking powder. The internal expansion of air and gas and the pressure of steam during baking, all make a contribution to total aeration. Albumen One of the many proteins. Where the term is used in the bakery, it is generally accepted to mean the white of eggs. All-in Process All the ingredients are mixed together without any preliminary stages. Amaretto A liqueur from Italy, the primary flavour comes from sweet and bitter almond. Angelica Young leaf stalks of a plant which are candied and used for decoration. Anglaise Sauce Known as custard sauce, vanilla sauce or crème Anglaise. Arrowroot A kind of thickener, and it thickens at a lower temperature than either cornstarch or flour Atomiser Devices for converting a liquid (colour) into a fine spray under pressure by blowing or depressing an air- filled rubber bulb. Bain Marie Water bath used for keeping food warm Baking To render bakery products suitable for human consumption and digestion by cooking in an oven at correctly controlled temperatures. Baking Powder Any chemical or mixture of chemicals which, when moistened and heated, generates gas (usually CO2) which will aerate bread and cakes. Ideally the residual salts of reaction should be tasteless and without odour. The baking powder must comply with the Food and Drugs Act of the country in which it is used. Baking Sheet A metal plate on which buns, cakes, pastries and biscuits are baked. Generally they have three upturned sides and an open end. The open end will facilitate cleaning. Batch The entire mixing of bread or cakes; the contents of the oven. Batter Mixture of flour and liquids used to make pancakes or crepes and for coating for fried desserts like fritters Batter A soft, completed cake mixture. A very soft fermented mixture as for crumpets. Baume Degrees on the scale of a saccharometer (sugar hydrometer). Bavarois Whipped cream and melted gelatine folded to a custard sauce (also known as Bavarian Cream). Beat The aeration of fat, sugar, eggs and other materials by beating together. This can be done by hand or by machine. Beater A hand-shaped implement which, when fixed to a machine, beats ingredients such as fat, sugar and eggs. Beignets Fritters. Beurre Noisette Brown butter or hazelnut butter Blackjack Dark caramelized sugar syrup used for colouring rich fruit cake mixing. Blanch Plunge food into boiling water to partly cook Blanch A term used to describe bringing anything to boiling point quickly. Used with vegetables prior to freezing to slow microbial activity. Also used to enable easy removal of skins such as from almond kernels. Blind Bake Baking pastry to shape with no filling Bombe Mixture Made from egg yolks, sugar, and cream (similar to a parfait) Bombes A frozen dessert with a combination of either Ice Cream, Sorbet, Sherbet and Bombe Mixture. --- PDF PAGE 228 --- Food Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023 224 Boulangerie Bakery department. Bowl A rounded metal container used in the bakery for mixing, beating or whipping by hand. A bowl specially made for a machine is known as a machine bowl. Bun A small yeast fermented or chemically aerated, sweetened cake. Buttermilk Is made from sweet (or sour) milk after it has been churned to remove the Fat. Cachous/Dragees Small silver coloured candied sugar balls used for decorating petits fours. Cake Refers generally to a baked mixture of fat, sugar, eggs and flour, with or without milk, baking powder, A cake can be of any shape or size. Cake Refers generally to a baked mixture of fat, sugar, eggs and flour, with or without milk, baking powder, A cake can be of any shape or size. Cake Hoop/Cake Ring A metal ring which supports a cake during baking. Cake Tins Small or large metal shapes in which cakes are baked. They may be plain or fluted. Calvados Apple brandy from France. Candied Super saturated sugar solution is used to immerse product. Product absorbs sugar and when dry it is preserved by the sugar Candied fruit Glace fruits Caramel Sugar solution boiled above 150 ºC until turns golden brown. Caramel Fruits Fruits dipped in Caramel. Caramelize Cooking sugar to above 156ºc at which point it begins to brown Cassata An Ice cream and Parfait specialty. Centigrade Divided into 100 degrees, as the centigrade thermometer (first constructed by Celsius, 1701-44), in which the freezing point is zero and boiling point is one hundred. Charlotte Moulded desserts typically made in a dome and pail-shaped moulds. Chemise To line moulds with gelatine gel or sponge cake Chocolate Vermicelli Polished granules of Chocolate used as a decorations. Coagulate Setting of protein, caused by heat Coat To cover a cake or biscuit with almond paste and/or icing, fondant, cream or chocolate. Cocoa Powder The finely grown cocoa-press cake still containing a modest amount of cocoa butter Cointreau A colourless French liqueur flavoured with peel of curacao oranges. Compote Stewed or boiled fruit. Compound Chocolate Cocoa butter is replaced with hardened vegetable fat, which has similar melting characteristics to cocoa butter. The cocoa mass is replaced with a strong defatted cocoa powder Condensed Milk Milk that has had water removed and sugar added. Very thick and sweet Confiture Preserve fruits suspended in syrup or jelly Constituent A component part of the whole; one ingredient in a formula. Coulis Liquidised or pureed fruit sauce Coulis Cooked or raw fruit purees that are sweetened, then used or served as sauces. Coupe An individual serving bowl. Couverture Pure chocolate Product manufactured with cocoa butter, cocoa mass, milk powder, sugar and flavouring. (chocolate) Cream To beat fat and sugar or fat and flour together until light and fluffy. To add cream as a decoration of filling to a baked cake. A common term used to describe all kinds of creams such as dairy cream, butter cream, marshmallow cream, custard cream, etc. Poured Fondant Sugar and glucose with added flavourings --- PDF PAGE 229 --- Food Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023 225 Creaming Action of blending fat and sugar to incorporate air Crême de Cacao A chocolate-flavoured liqueur. Crême de Cassis Liqueur made from Black currants. Crème Fraîche A cultured cream made by adding an acid-producing bacteria to pasteurized heavy cream. Crêpes Thin pancakes Crimping Squeezing edges of pastry to impart design Croquant Melted sugar with nuts or rice Crystallization Formation of crystals deliberately in various sugar boiling operations. Cup Cakes Small cakes baked in crimped paper cups or cases. Curdle When fat, sugar and eggs are beaten together carefully, an emulsion is formed. If during the beating, the eggs are added too quickly, or are too cold, or the initial creaming of the fat and sugar is not complete, then the mixture will separate and lose its smooth consistency. Some aeration is lost when a mixture curdles. Curdle When fat, sugar and eggs are beaten together carefully, an emulsion is formed. If during the beating, the eggs are added too quickly, or are too cold, or the initial creaming of the fat and sugar is not complete, then the mixture will separate and lose its smooth consistency. Some aeration is lost when a mixture curdles. Curdling Separation of liquid and solids, Emulsion has failed to form or has separated due to bad technique Dariole mould Angle sided mould wider at top than bottom Dark Chocolate Chocolate mass, cocoa butter, sugar, lecithin and flavours Decorate To add fruits, nuts, sugar, etc. to cakes before baking for the purpose of decorating. This is known as being oven-decorated or oven-finished. To add such decorating materials as the above, almond paste, chocolate, cream or icing after baking, generally to make a pattern or a design. The word is given special significance in describing artistic work in royal icing. Deposit The act of putting cake batter into hoops, pans, tins, etc., either by hand or by machine. The machine used is known as a depositor. Dessert Finale of a fine meal Doilley Paper lace mat used to present product, normally made of paper for desserts and pastry items Dredge To coat with flour or sugar Egg wash A little milk and a small pinch of salt added to egg yolk. Emulsifier A substance that will help the mixing of two products that don’t normally mix such as oil and water Emulsion An intimate mixture of two fluids that normally would not mix, such as oil and water. This is done by means of an emulsifier, a machine that will break down the oil and water to minute particles while under pressure, for example, homogenized milk. If an emulsifying agent is used then the emulsion may become permanent. Fat, sugar and eggs correctly beaten together form an emulsion, the lecithin in egg yolks being a good emulsifying agent. Enrobe Covering completely with substance Enrobed Chocolate A centre is produced first then covered in chocolate Entremets French word for sweet dishes Essences Aromatic compounds used for flavouring confectionery. They can be natural or synthetic or blends of both. Essential Oils Aromatic oils of fruit s, nuts, flowers extracted and used as flavouring. Fat A mixture of triglycerides. Normally solid at room temperature Fat Bloom A yellowish to greyish-white coating on the surface of the chocolate Financiers A petit four base made by folding fine almonds into beaten egg whites, --- PDF PAGE 230 --- Food Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023 226 then adding liquid butter. Fingers Small finger-shaped rolls, biscuits, meringues, sponge cakes. Flambee To set a liqueur or brandy alight during the cooking process. Folding Method of gently blending of fragile ingredients Fondant A form of icing made by boiling sugar, water, glucose or a weak acid to 115¼C (140¼F), then agitating when it is cool until it forms a mass of minute crystals. It is the reflection of light on the tiny crystals that explains the gloss on correctly prepared fondant. Fondant Low moisture content sugar syrup containing a small quantity of invert sugar which has been rapidly cooled so that the sugar crystals are very small in size. Framboise A liqueur distilled from raspberry juice Frangelico Liqueur derived primarily from hazelnuts but flavoured with berries and flowers as well. Frangipane A mixture of butter, sugar, eggs, almonds and flour baked in a sweet paste base. Frappé Chilled Friandise Petit Fours. Galette Round and flaky pastry dough Ganache Mixture of fresh cream and couverture Garnish Decoration of the meal Gelatine Clear protein that is used set liquids. Can be purchased in powder or clear sheets Gelatinization When water and starch are heated, the starch grains swell and absorb the liquid holding the liquid in suspension Gianduja Chocolate praline filling. Prepared from nuts or almonds, sugar and milk or plain chocolate Glacé Ice or Ice Cream. Glace fruit Fruit preserved by impregnation with concentrated sugar syrup. Glaze To impart a gloss by coating with an agent such as apricot purée/ Caramelizing sugar by the use of the oven, salamander or blow-torch. Gliadin Protein in flour that the elasticity Gluten Proteins glutenin and gliadin when hydrated bond together to form viscous substance called gluten. Glutenin Protein in flour that causes strength Glycerine Colourless, odourless syrup with a sweet taste. It is soluble in water and alcohol. Because it is highly hygroscopic it is used in cake mixings to delay staling. Grand Marnier Liqueur made with oranges and aged cognac. Gratinate Process of browning the surface of foods; predominately sauces, under a salamander Grease To brush fat into cake tins or to smear fat over baking sheets. Gum Arabic Exudant from Acacia tree ground to powder and when rehydrated is used to impart glaze on confectionary products High-Ratio Cakes The name hi-ratio is registered in the USA. The term is used to describe cakes containing high percentages of sugar and liquids based on the weight of flour. Special flour and super glycerinated fats are used for this type of cake. Hulling Removing calyx from strawberries Humidity Moisture in the air Hygroscopic The power of attracting moisture. For instance, glycerine is hygroscopic. Other examples are icing sugar and bi-carb soda. Icing The coating and decoration of a cake with royal or plastic icing. The term is also used to describe the decoration of cakes with fondant, water icing, or fudge icing. --- PDF PAGE 231 --- Food Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023 227 Invert Sugar Mixture of dextrose and fructose in approximately equal proportions, created by treating sucrose with an enzyme – Sucrose +Water = Dextrose +Fructose Kirsch Liqueur made from cherries, also known as kirschwasser. Kneading Manipulating a dough to develop the gluten and improve texture from sticky mass to smooth dough Leavening Incorporating air into dough by manipulating ingredients Leavening agent Ingredient that can cause gas within a dough or batter Lecithin A phosphorized fatty substance which has a great power as an emulsion stabilizer. Egg yolks and soya beans are both rich in lecithin. Lemon zest Referring to the finely grated oily skin of washed untreated lemons Liqueurs Spirits with an alcohol content of at least 30% vol. sweetened with sugar and flavoured with essences, essential oils or fruit juices. Macerate To steep in a liquid to soften or absorb flavor, generally applied to fruit. Madiera A fortified sweet wine. Maraschino Liqueur made from cherries and used for flavouring. Marsala An Italian dessert wine. Marshmallow Confection or sweetmeat made from water, sugar and gelatine aerated and piped to shape. Many uses in pastries and desserts Marzipan Paste of sugar and ground blanched almonds Marzipan paste A manufactured paste containing 2/3 blanched almonds and 1/3 sugar. Mascarpone Cheese Made from fresh cream derived from cow’s milk Masking Coating of a cake or gateau with icing or coating inside of mould with gel Milk Chocolate Chocolate mass, cocoa butter, sugar, milk powder, lecithin and flavours Mise en place Basic operations prior to the service. Moulded Chocolate A shell is produced first, filled with a liquid, semi liquid or even firm fillings and later back (sealed) with chocolate Mouli Hand operated mill to pulp cooked solids; has been replaced by food processor or stick wands. It is also known as a food mill. Mousse A dish which is light in consistency, served either hot or cold. Mousseline Sauce Sabayon mix fold into a whipped heavy cream. Nappe To coat food with a sauce Nibs Small fragments, such as almond or sugar nibs. Nougat Mixture of melted sugar and almonds/hazelnut ground to a paste and mix with chocolate. Mixture of melted sugar and almonds known as praline – croquant. A confection made from sugar, honey, and egg whites, with added Glacé fruits and nuts. Palette Knife A thin, flat knife with a rounded end used for spreading icing and cake batter. An offset or crank-handled palette knife has the blade at a lower level than the handle. It is used for spreading cake or sponge mixtures on to baking sheets. Pan A broad, shallow baking tin. Panada A thickening agent made from a starch base Parfait Frozen cream mixture made from syrup, egg yolks, and cream, and frozen in moulds. Pectin Found mainly in citrus fruits and is used as a gelling agent Pith In skin wall of citrus fruits just under the white outer coating, the zest Pound Cakes A term used at one time to describe cakes made from 1 lb (500 gm) each of butter, sugar, eggs and flour. The term is now often used for cakes baked in a round hoop or oblong tin such as Madeira, Genoa and cherry. Praline Almonds and hazelnuts crushed finely and caramelized and mixed with milk chocolate. This paste is used in numerous confections of chocolate --- PDF PAGE 232 --- Food Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023 228 Praline Croquant which has been coarsely chopped or milled into a smooth paste. Pre-gelatinised Starch Pre-gelatinized or soluble starch is produced commercially by blowing a starch suspension onto stem heated rotating rollers. Gelatinization and drying take place and the dried material is then flaked or ground to make a powder. The process ruptures the starch granules, without completely distorting them, so that they swell in cold water to form a viscous paste. Pudding A soft mixture bake or steam in a basin or dish. Purée Food passed through a sieve to make a thick pulp. Reaction A chemical reaction resulting in browning, usually caused by the interaction of proteins and carbohydrates Recipe An exact formula which will include the weights of the materials to be used for a particular type of bread or confectionery. All other details such as temperature, times, yields, etc., will also be recorded. Refresh Plunge partly cooked food into cold or ice water to stop the cooking process Rennet Setting agent derived from the stomach of a calf, used in milk dessert 'junket' Romanoff Sauce A mixture of whipped heavy cream and sour cream. Roux Mixture of cooked flour and fat that is used to thicken liquids Royal Icing Blended eggwhite and fine icing sugar used to decorate cakes. Dries very hard. Sabayon Sauce made from the yolks of eggs or either water or wine and sugar, beaten over a double boiler. Saccharometer Instrument used to measure sugar density of liquid Saffron Dried stigmas of the saffron crocus. Salamander A type of grill heated from above. Piping Bag A triangular shaped bag made of cloth or a plastic material into which a tube is inserted. It is used for piping meringue, sponge fingers and drops, soft biscuits, choux paste, etc., onto baking sheets. It is also used to pipe cream on, or in, cakes and pastries. Scraper A small oblong piece of plastic material, with two corners rounded for scraping down mixing bowls. The straight edge of the scraper can be used to smooth the side of a cake when coating with cream or butter cream. The straight edge can also cut in many ways so that a pattern can be made in the coating, for example, a comb scraper. A metal blade in a wooden handle that is used to scrape the surface of a bench, or for cleaning metal baking trays. Segments Fruit that has been sliced or portioned with no skin attached Sieve Utensil with a wire or nylon mesh through which dry materials are passed. Sieving removes coarse particles, extraneous materials and also is a means of blending. Coarse sieves are used for the cleaning and draining of fruit. A sieve can also be used for fluids or semifluids. Sodium Bicarbonate The constituent of baking powder that liberates C02. The maximum is liberated when the correct amount of acid is present. Soft Flour Flour containing weak gluten. Sponge sheets Sponge baked into thin sheets. Standard Recipes List of ingredients for any dish and method of process those ingredient to produce a set amount of food; usually for 10 people Steep Cover food in hot or cold liquid to soften, extract or induce flavour Stock syrup Sugar and water brought to boil and any forming scum removed, then stored in a clean container (five rich confection parts sugar plus 10% glucose in four parts water). Strong Flour Flour containing strong stable gluten. Sugar Bloom A grey bloom which is generally caused by dampness or condensation dissolving the surface of chocolate which recrystallises on drying --- PDF PAGE 233 --- Food Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023 229 Sugar syrup See stock syrup: used to carry alcohol or strong flavours into plain sheets of sponge, also to add moisture to old product Syneresis Separation of liquid from a gel. Egg custard is overcooked and as protein shrinks, moisture is squeezed out Syrup Boiled sugar and water mixture Tapioca Pearl Is derived from the root of the South American cassava plant, it is available in several forms. Tapioca must be soaked in water before cooking. Tempering Kettle Vessel used for heating chocolate working on the warm air principle where it is protected from water and steam Texture Internal structure of baked products cellular walls Trimmings Off cuts of fruit and vegetables that can be utilized in other processes or dishes Truffles A ganache with added butter Viscosity Resistance of a liquid to movement or flow Wash To brush with egg, milk, water, before baking. To brush with a glaze after baking. Water Brush A soft-haired brush for washing cakes or pastries with water or other liquids before baking, or for glazing after baking. Whip To rapidly aerate a sponge, meringue or cream by means of a hand or machine whisk. Whisk An implement made of wire used to whip sponges, meringues and cream by hand. A similar implement is specially made to fix to a machine. White Chocolate Cocoa butter, sugar, milk powder, lecithin and flavours Yield The calculated units from the total baked weight of a particular formula. Zest Outer rind of citrus fruits where the volatile oils reside Zuppa Inglese Trifle with fresh fruit, served in a glass bowl --- PDF PAGE 234 --- Food Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023 230 TRAINING REGULATIONS (TR) Qualification Title : Qualification Code : Food Production (Bread and Patisserie) NC II TRSFBP222 Revision No. Document Type Qualification Title TESDA Board Resolution No./Date Deployment (TESDA Circular/Implementing Guidelines) 00 Document Created Bread and Pastry Production NC II 2009-12 / 7/13/2009 NA 01 Document Amended Food Production (Bread and Patisserie) NC II 2025-12 / 9/29/2025 039 series of 2026 Legend: *Description Types - Document Created - Document Amended - Document Superseded --- PDF PAGE 235 --- Food Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023 231 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of these Training Regulations. The TECHNICAL AND INDUSTRY EXPERT AND REVIEW PANEL ARISTEO C. CUETO National Master Assessor; Natio