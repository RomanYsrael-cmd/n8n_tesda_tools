      "text": "1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "number": "4.1",
      "text": "1 A National Certificate (NC) is issued when a candidate has demonstrated competence on all units of competency in a qualification with a promulgated Training Regulations."
    },
    {
      "number": "4.1",
      "text": "2 A Certificate of Competency (COC) is issued by the Authority to individuals who were assessed as competent in a single unit or cluster of related units of competency. COC 1 Prepare and Present Bakery Products • Clean and maintain kitchen premises • Organize and prepare food and service for bakery and pastry production • Prepare and present bakery products • Present Desserts COC 2 Prepare and Present Desserts, Cakes and Pastries • Clean and maintain kitchen premises • Organize and prepare food and service for bakery and pastry production • Prepare and present basic pastries • Prepare and present gateaux, torte and cakes • Prepare and display petits fours • Prepare and present basic hot, cold and frozen desserts • Prepare chocolate and produce chocolate products • Present Desserts"
    },
    {
      "number": "4.1",
      "text": "3 National Certificate (NC) can be achieved through an assessment which primarily includes accumulation and submission of all COCs acquired. It may include assessment methodologies identified in the evidence plan of the competency assessment tool/s."
    },
    {
      "number": "4.1",
      "text": "4 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the relevant unit/s of competency. --- PDF PAGE 222 --- Food Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023 218"
    },
    {
