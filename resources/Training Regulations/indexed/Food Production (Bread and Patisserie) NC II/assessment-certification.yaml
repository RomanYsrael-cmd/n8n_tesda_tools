  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION\n ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to an employable\nunit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence on all units of competency in a qualification with a promulgated\nTraining Regulations.\n\n4.1.2 A Certificate of Competency (COC) is issued by the Authority to individuals\nwho were assessed as competent in a single unit or cluster of related units\nof competency.\n\nCOC 1 Prepare and Present Bakery Products\n•\nClean and maintain kitchen premises\n•\nOrganize and prepare food and service for bakery and pastry\nproduction\n•\nPrepare and present bakery products\n•\nPresent Desserts\n\nCOC 2 Prepare and Present Desserts, Cakes and Pastries\n•\nClean and maintain kitchen premises\n•\nOrganize and prepare food and service for bakery and pastry\nproduction\n•\nPrepare and present basic pastries\n•\nPrepare and present gateaux, torte and cakes\n•\nPrepare and display petits fours\n•\nPrepare and present basic hot, cold and frozen desserts\n•\nPrepare chocolate and produce chocolate products\n•\nPresent Desserts\n\n4.1.3 National Certificate (NC) can be achieved through an assessment which\nprimarily includes accumulation and submission of all COCs acquired. It\nmay include assessment methodologies identified in the evidence plan of\nthe competency assessment tool/s.\n\n4.1.4 Individuals wanting to be certified will have to be assessed in accordance\nwith the requirements identified in the relevant unit/s of competency.\n\n--- PDF PAGE 222 ---\nDRAFT\nDRAFT\n\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 218\n4.1.5 The industry shall determine assessment and certification requirements\nfor each qualification with promulgated Training Regulations. It includes\nthe following:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\nindustry\n\n4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences\nmay apply for recognition in a particular qualification through a\nrecognition/ assessment process.\n\n4.1.7 The following are qualified to apply for assessment and certification:\n\n4.17.1 Candidates and/or graduates of tourism and hospitality degree\n programs with knowledge of basic bakery and pastry\n production; or\n4.17.2 Graduates of the FOOD PRODUCTION (BREAD AND\n PATISSERIE) NC II; or\n4.17.3 K-12 graduates of Home Economics Strand with FOOD\n PRODUCTION (BREAD AND PATISSERIE) NC II; or\n4.17.4 Industry practitioner specifically in bakery and pastry production\n with at least two (2) years of work experience.\n\n4.1.8 Current holders of valid Bread and Pastry Production NC II are required to\nundergo assessment on the amended TR.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior `\n\n--- PDF PAGE 223 ---\nDRAFT\nDRAFT\n\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 219\n4.2.2 Accredited Assessment Center. Only TESDA Accredited Assessment\nCenters are authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n4.2.3 Accredited Competency Assessor. Only an accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of accreditation\nprocedure before they are authorized by TESDA to assess the\ncompetencies of candidates for National Certification.\n\n--- PDF PAGE 224 ---\nDRAFT\nDRAFT\n\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 220\n\n"
