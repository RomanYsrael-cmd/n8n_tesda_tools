      "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall provide Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: FOOD PRODUCTION (PATISSERIE)\n\nNC Level: NC II\n\nNominal Training Duration: 37 Hrs. (Basic)\n\n 28 Hrs. (Common)\n\n 335 Hrs. (Core)\n 400 Hrs.\n\n 200 Hrs. - Supervised Industry Learning (SIL)\n\nCourse Description:\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involved in preparing, producing, storing\nand presenting a range of high quality bakery and pastry products in commercial food\nproduction environments. This includes classroom learning activities and practical work in\nactual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieve.\n\n--- PDF PAGE 162 ---\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 158\n\nBASIC COMPETENCIES\n(37 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1. Obtain and convey\nworkplace\ninformation\n•\nDescribe Organizational policies\n•\nRead:\no Effective communication\no Written communication\no Communication procedures and\nsystems\n•\nIdentify:\no Different modes of communication\no Medium of communication\no Flow of communication\no Ava