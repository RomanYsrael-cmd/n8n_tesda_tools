      "source_text": "3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\n\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done in an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based on the collection of evidence of the performance of\nwork to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) of current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1.\nInstitution- Based:\n\n•\nDual Training System (DTS)/Dualized Training Program (DTP)\nwhich contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the\nDTP;\n\n•\nDistance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\nthe same place. Distance learning may employ correspondence\nstudy, audio, video, computer technologies or other modern\ntechnology that can be used to facilitate learning and formal and\nnon-formal training. Specific guidelines on this mode shall be issued\nby the TESDA Secretariat.\n\n--- PDF PAGE 209 ---\nDRAFT\nDRAFT\n\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 205\n\n•\nSupervised Industry Training (SIL) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills\nof the trainee through actual experience in the workplace to acquire\nspecific competencies as prescribed in the training regulations. It is\nimperative that the deployment of trainees in the workplace is\nadhered to training programs agreed by the institution and\nenterprise and status and progress of trainees are closely\nmonitored by the training institutions to prevent opportunity for work\nexploitation.\n\n•\nThe classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or\nfield-work components.\n\n2.2\nEnterprise-Based:\n\n•\nFormal Apprenticeship - Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n•\nInformal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craft person\nwherein the agreement may be written or oral and the master crafts\nperson commits to training the apprentice in all the skills relevant to\nhis or her trade over a significant period of time, usually between\none-and four years, while the apprentice commits to contributing\nproductively to the work of the business. Training is integrated into\nthe production process and apprentices learn by working alongside\nthe experienced crafts person\n\n•\nEnterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3\nCommunity-Based\n\n•\nCommunity-Based - short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and\nother TVET providers which are intended to address the specific\nneeds of a community. Such programs can be conducted in\ninformal settings such as barangay hall, basketball courts, etc.\nThese programs can also be mobile training programs (MTP).\n\n--- PDF PAGE 210 ---\nDRAFT\nDRAFT\n\nFood Production (Bread and Patisserie) NC II - TRSFBP222 Promulgated 09/16/2023\n 206"
    },
