exhaust system\nDiagnose and overhaul engine\nmechanical system\n\n--- PDF PAGE 194 ---\nTR-Automotive Servicing (Chassis Repair) NC II Revision 01 Promulgated (08/11/2020) 190\n\n--- PDF PAGE 195 ---\nTR-Automotive Servicing (Chassis Repair) NC II Revision 01 Promulgated (08/11/2020) 191\nGLOSSARY OF TERMS\n\n1. ADJUSTMENT\nA small alteration or movement made to achieve a desired fit,\nappearance, or result.\n\n2. DIAGNOSE\nIdentify the nature of problem by inspection of the symptoms.\n\n3. DIAGNOSTIC\nSYMPTOMS\nA physical manifestation that is regarded as indicating a\ncondition of malfunction.\n\n4. EVALUATION OF\nCOMPONENTS\nThe making of a judgment about the condition of a\npart/ component.\n\n5. FINAL INSPECTION\nIncludes road testing, oil leakage, functionality, etc.\n6. MAINTENANCE\nThe regular or periodic maintenance servicing of vehicles to\nkeep it in top condition.\n\n7. OUT OF STANDARD\nWorn-out, unserviceable components, not conforming to\nmanufacturer’s standard.\n\n8. OVERHAUL\nTake apart a major automobile component in order to\nexamine it and repair/replace a part if necessary to bring back\nthe major component to working condition.\n\n9. REPAIR\nFix or return to working condition a part/component. It refers\nto cleaning, adjustment, and replacement.\n\n10. SERVICE\nThe act of rendering maintenance service and repair/\nreplacement of parts of an automobile to keep it in top\ncondition.\n\n11. WHEEL ALIGNMENT\nPart of standard automobile maintenance that consists of\nadjusting the angles of wheels so that they conform to\nmanufacturer’s standard.\n\n12. WHEEL BALANCE\nDescribes the distribution of mass within an automobile tire or\nthe entire wheel (including the rim) to which it is attached.\n\n--- PDF PAGE 196 ---\nTR-Automotive Servicing (Chassis Repair) NC II Revision 01 Promulgated (08/11/2020) 192\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nAutomotive Servicing (Chassis Repair) NC II\nQualification Code:\nA