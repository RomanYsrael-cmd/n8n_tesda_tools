  "source_text": "SECTION 1 AUTOMOTIVE SERVICING (CHASSIS REPAIR) NC II\nQUALIFICATION\n\nThe AUTOMOTIVE SERVICING (CHASSIS OPERATION) NC II Qualification\nconsists of competencies that a person must achieve to inspect and repair drive lines,\nbasic diagnosing and repair clutch system, basic diagnosing and overhaul manual\ntransmission/transaxle, and basic diagnose and overhaul differential. It also includes\nthe basic diagnosing and repairing of brake system, steering system, and suspension\nsystem.\n\nThis Qualification is packaged from the competency map of the\nAutomotive/Land Transport Sector as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311210\nParticipate in workplace communication\n400311211\nWork in team environment\n400311212\nSolve/address general workplace problems\n400311213\nDevelop career and life decisions\n400311214\nContribute to workplace innovation\n400311215\nPresent relevant information\n400311216\nPractice occupational safety and health policies and procedures\n400311217\nExercise efficient and effective sustainable practices in the\nworkplace\n400311218\nPractice entrepreneurial skills in the workplace\n\nCODE NO.\nCOMMON COMPETENCIES\nALT723211\nValidate vehicle specification\nALT723212\nMove and position vehicle\nALT723214\nUtilize automotive tools\nALT723215\nPerform mensuration and calculation\nALT723216\nUtilize workshop facilities and equipment\nALT723217\nPrepare servicing parts and consumables\nALT723218\nPrepare vehicle for servicing and releasing\n\nCODE NO.\nCORE COMPETENCIES\nALT723385\nDiagnose and repair drive lines\nALT723386\nDiagnose and repair clutch system\nALT723387\nDiagnose and overhaul manual transmission/transaxle\nALT723388\nDiagnose and overhaul differential\nALT723389\nDiagnose and repair brake system\nALT723390\nDiagnose and repair steering system\nALT723391\nDiagnose and repair suspension system\n\n--- PDF PAGE 6 ---\nTR-Automotive Servicing (Chassis Repair) NC II Revision 01 Promulgated (08/11/2020) 2\nA person who has achieved this Qualification is competent to be:\n\n❑ Automotive Service Specialist (Chassis)\n❑ Automotive Chassis Specialist\n❑ Chassis Repair Personnel\n\n--- PDF PAGE 7 ---\nTR-Automotive Servicing (Chassis Repair) NC II Revision 01 Promulgated (08/11/2020) 3"
}
