ring maintenance service and repair/\nreplacement of parts of an automobile to keep it in top\ncondition.\n\n11. WHEEL ALIGNMENT\nPart of standard automobile maintenance that consists of\nadjusting the angles of wheels so that they conform to\nmanufacturer’s standard.\n\n12. WHEEL BALANCE\nDescribes the distribution of mass within an automobile tire or\nthe entire wheel (including the rim) to which it is attached.\n\n--- PDF PAGE 196 ---\nTR-Automotive Servicing (Chassis Repair) NC II Revision 01 Promulgated (08/11/2020) 192\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nAutomotive Servicing (Chassis Repair) NC II\nQualification Code:\nALTASC220\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\nCircular (TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument\nCreated\nAutomotive Servicing NC II\nTBR No. 2013-11/\n12/17/2013\n\nDocument\nSuperseded\nAutomotive Servicing NC II\nTBR No. 2013-11/\n12/17/2013\n\n01\nDocument\nAmended\nAutomotive Servicing\n(Chassis Repair) NC II\nTBR No. 2020-33/\n08/11/2020\nTESDA Circular No.\n132 series 2020\n01\nDocument\nCreated\nAutomotive Servicing\n(Electrical Repair) NC II\nTBR No. 2020-34/\n08/11/2020\n\n01\nDocument\nAmended\nAutomotive Servicing\n(Engine Repair) NC II\nTBR No. 2020-35/\n08/11/2020\n\nLegend: *Description Types\n-Document Created\n\n-Document Amended\n-Document Superseded\n\n--- PDF PAGE 197 ---\nTR-Automotive Servicing (Chassis Repair) NC II Revision 01 Promulgated (08/11/2020) 193\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) is\nparticularly grateful for the valuable technical support provided by the following\nindustry stakeholders for the review and development of this Training Regulations.\nThe time and inputs generously given during this undertaking are also highly\nappreciated and recognized as they made significant contributions to the constitution\nof this TR.\n\n• THE T