      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 The National Certificate Qualification for AUTOMOTIVE SERVICING (CHASSIS REPAIR) NC II shall be obtained when a candidate demonstrates competence through project-type assessment covering all units of competency listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General 4.1.2 Assessment shall cover all competencies, with basic and common integrated or assessed concurrently with the core units of competency. 4.1.3 The following are qualified to apply for assessment and certification, as long as they are holders of National Certificate in the amended Automotive Servicing NC I: 4.1.3.1 Graduates of WTR-registered program on Automotive Servicing (Chassis Repair) NC II, or graduates of NTR programs or of enterprise-based training programs related to automotive servicing (chassis repair) ; or 4.1.3.2 Candidates who gained competencies in implementing automotive servicing (chassis repair) or any related field through informal training or previous work experiences for at least two (2) years; or 4.1.4 Current holders of National Certificate (NC) in AUTOMOTIVE SERVICING NC II shall have their certificates renewed and converted to the amended TR provided he/she has accumulated at least 2 years (for the last five years) work experience, practicing the competencies prescribed in his/her certificate. A Certificate of Employment and Job Description must be provided as proof. He/she must be a holder of National Certificate in the amended Automotive Servicing NC I. 4.1.5 Current holders of Certificate of Competency (COC) in AUTOMOTIVE SERVICING NC II, shall have to undergo TR-Automotive Servicing (Chassis Repair) NC II Revision 01 Promulgated (08/11/2020) 185 assessment in the amended Training Regulations upon expiration of their Certificates. He or she must be a holder of National Certificate in the amended Automotive Servicing NC I. 4.1.6 Current holders of NTTC Level I in AUTOMOTIVE SERVICING NC II shall have their NC II converted to the amended TR provided that they have forty-eight (48) hours industry immersion within the last two (2) years. He or she must be a holder of National Certificate in the amended Automotive Servicing NC I."
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. TR-Automotive Servicing (Chassis Repair) NC II Revision 01 Promulgated (08/11/2020) 186"
    }
