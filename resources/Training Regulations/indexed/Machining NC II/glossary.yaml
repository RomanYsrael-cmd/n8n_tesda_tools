      "definition": "bench work the operations incident to the process of laying out, fitting, assembling, etc… when the work is placed on the bench or in a bench vise 2. boring is the operation of enlarging a hole by means of an adjustable cutting tool with only one cutting edge 3. chipping is the operation of removing/cutting metal using hammer and chisel 4. counterboring is the operation of enlarging the end of a hole cylindrically 5. drilling is the operation of producing a circular hole by removing solid metal 6. facing the lathe operation of finishing the ends of the work, to make the piece the right length. Also known as squaring 7. grinding refers to the removal of material from a workpiece with grinding wheel 8. laying out term used to include the marking or scribing of center points, circles, arcs, or straight lines upon metal surfaces, either curved or flat, for the guidance of the worker 9. milling refers to removal of metal by feeding a workpiece through the periphery of rotating circular cutter 10. reaming is an operation of sizing and finishing a hole by means of a cutting tool having several cutting edges. reaming serves to make the hole smoother, straighter, and more accurate 11. spot-facing is the operation of smoothening and squaring the surface around a hole 12. tapping is the operation of forming internal threads by means of a tool called tap 13. turning refers to shaping a workpiece by gripping it in a workholding device and rotating it under power against a suitable cutting tool"
