  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for MACHINING NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: MACHINING\nNC Level: NC II\n\nTraining Duration: 18 Hours (Basic)\n\n12 Hours (Common)\n\n307 Hours (Core)\n\nCourse Description:\n\nThis qualification is designed to develop knowledge, desirable attitudes and skills of\nMachinist. It covers the competencies required to select and use hand and power tools to perform\ncomplex bench operations, skills to set up and turn workplace to drawing specifications. Such as\ncutting tapers by offsetting tailstock or using taper attachment; machining components using\ncollets chuck and follower rest; and cutting internal Vee and internal and external ACME threads. It\nalso covers the skills required to set up and mill workpiece to drawing specifications such as\nindexing, milling splines, equally spaced grooves, 45 degrees, serrations in cylindrical workpiece,\nspur gear and rack, ratchets, converging faces, large radial slots, internal radii and plain bevel\ngear. It also covers the skills required to set up and grind workpiece to drawing specifications such\nas grinding tapers internal and external, internal radii and recess, remove warp and polish\ncomponents.\nTo obtain this, all units of competency prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace meeting\nand discussion.\n• Group\ndiscussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team member.\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives with\norganizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth and\ndevelopment.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health and\nsafety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 57 ---\nTR - Machining NC II\n Promulgated March 2005\n\n53\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Interpret\nworking\ndrawings and\nsketches\n1.1 Interpret technical drawing\n1.2 Prepare freehand sketch of\nparts\n1.3 Interpret details from freehand\nsketch\n• Lecture\n• Group\nDiscussion/\ninteraction\n• Observation\n• Interview\n• Interview/\nQuestioning\n2. Select and\ncut\n workshop\n materials\n2.1 Determine requirements\n2.2 Select and measure materials\n2.3 Cut materials\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n3. Perform shop\n computations\n (Basic)\n3.1 Perform four fundamental\noperations\n3.2 Perform basic calculations\ninvolving fractions and decimals\n3.3 Perform basic calculations\ninvolving percentages\n3.4 Perform basic calculation\ninvolving ratio and proportion\n3.5 Perform calculations on\nalgebraic expressions\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n\n4. Measure\nworkpiece\n (Basic)\n4.1 Select and use measuring\ninstruments\n4.2 Clean and store measuring\ninstruments\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n5. Perform shop\ncomputations\n(Intermediate)\n5.1 Perform calculations involving\ntriangles\n5.2 Calculate taper\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n6. Measure\nworkpiece\nusing\nangular\nmeasuring\ninstruments\n6.1 Select and use angular\nmeasuring tools.\n6.2 Maintain angular measuring\ntools\n6.3 Clean and store measuring\ntools\n• Lecture\n• Demonstration\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n7. Perform\npreventive\nand corrective\n maintenance\n7.1 Perform inspection of machine\n7.2 Perform cleaning and\nlubricating of machine\n7.3 Perform minor machine repair\nand adjustments\n7.4 Maintain hand tools\n\n• Lecture\n• Demonstration\n• Group\ndiscussion\n• Practical\nexercise\n• Demonstration\n• Observation\n• Performance\ntest\n• Interview/\nQuestioning\n\n--- PDF PAGE 58 ---\nTR - Machining NC II\n Promulgated March 2005\n\n54\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform Bench\nwork\n1.1 Explain the principle of honing.\n1.2 Procedure in honing\n1.3 Perform honing\n1.4 Explain the principle of scraping\n1.5 Procedure in scraping\n1.6 Perform scraping.\n1.7 Identify damage screws\n1.8 Procedure in removing damage\nscrews.\n1.9 Perform removing of damaged\nscrews\n• Demonstration\n• Discussion\n\n• Direct\nObservation\n• Demonstration\n• Written or oral\n\n2. Turn Work\npiece\n2.1 Explain the procedure of :\n• Facing\n• Straight turning\n• Drilling\n• Boring\n• Parting-Off\n• Cutting external\n square thread\n• Cutting multi-start\n external thread\n• Cutting taper using\n taper attachment\n• Turning between centers\n2.2 Set up work piece\n2.3 Perform turning operations\n2.4 Check / measure work piece as\nper drawing specification.\n• Demonstration\n• Discussion\n• Written /Oral\n• Direct\nObservation\n\n3. Mill Workpiece\n3.1 Explain the procedure of:\n• Indexing\n• Straddle milling\n• Milling using fly cutter\n• Milling splines\n• Milling equally spaced\ngrooves\n• Milling 45 degrees serrations\non cylindrical workpiece\n• Milling spur gear and rack\n• Milling bevel gear\n• Milling ratchet\n• Milling converging faces\n• Milling large radial slots\n• Milling internal radii\n3.2 Set up workpiece\n3.3 Perform milling operations\n3.4 Check / Measure workpiece\n• Demonstration\n• Discussion\n• Direct\nObservation\n• Written / Oral\n\n--- PDF PAGE 59 ---\nTR - Machining NC II\n Promulgated March 2005\n\n55\n4. Grind\nworkpiece\n4.1 Explain the\nprocedure of Grinding:\n• External and internal taper\n• Internal radii\n• Internal recess\n• To remove warp\n4.2 Select Wheels and accessories\n4.3.Perform grinding operations\n4.4 Check / Measure workpiece\n• Demonstration\n• Discussion\n\n• Direct\nobservation\n• Written / Oral\nexamination\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n•\nThe training is based on curriculum developed from the competency standards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the curriculum\nmodules;\n•\nAssessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are Nationally Accredited\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n•\nThe dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details\ncan be referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n•\nModular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer just facilitates the training delivery.\n•\nPeer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n•\nDistance learning is a formal education process in which majority of the instruction\noccurs when the students and instructor are not in the same place. Distance learning\nmay employ correspondence study, audio, video or computer technologies.\n\n--- PDF PAGE 60 ---\nTR - Machining NC II\n Promulgated March 2005\n\n56\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and their educational attainment.\nOther requirements like health and physical requirements are also stated. Passing entry\nwritten entrance examinations may also be indicated if necessary.\n\n•\nWith good moral character;\n•\nAble to communicate both orally and in writing; and\n•\nPhysically and mentally fit\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\nMACHINING NC II\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nMachining NC II\n\nTOOLS\n Measuring Tools:\n Bench Tools\nSafety Devices:\nQTY.\nDescription\nQTY.\nDescription\nQTY.\nDescription\n6 pcs.\n• Steel Rule 12 “\n1 Set\n• Honing tool\n1 box\n• First –Aid kit\n10 pcs.\n• Vernier caliper\n150mm\n1 set\n1 set\n• Extractor\n•Scraper (flat & curve)\n25\npcs.\n• Safety Goggle\n5 pcs.\n• Vernier caliper\n200mm\n1 Set\n• Drill 1mm to 12 mm\n10\npcs.\n• Safety Shield\n2 pcs.\n• Vernier caliper\n300mm\n1 Set\n• Center punch\n4 cyl. • Fire extinguisher\n5 pcs.\n•Micrometer 0-25\n1 Set\n•Prick punch\n\n3 pcs.\n•Micrometer 25-50\n6 pcs. •Scriber\n\n2 pcs.\n• Micrometer 50-75\n1 Set\n• Tap 4mm to 12 mm\ndia.\n\n3 Sets\n• Dial Indicator\nPlunger type\n1 set\n• Die 4 mm to 12 mm\ndia.\n\n2 pcs\n• Precision Square\n10 “\n2 pcs\n• Cold chisels 6 “\n\n1 Set\n• Vernier height\ngage\n2 pcs.\n2 pcs.\n• Cape chisel 6”\n• Diamond point Chisel\n6“\n\n1 Set\n1 set\n2 Sets\n• Gear Tooth caliper\n• Radius Gage\n•Center gage\n2 pcs. • Round nose Chisel 6“\n\n2 Sets\n• Bevel Protractors\n6 pcs.  Ball peen Hammer\n12 oz\n\n1 Set\n2 Sets\n• Gage Blocks\n•Thread Gage\n2 sets  Allen Wrench\n1 mm to 10 mm\n\n1 Set\n• Sine Bar\n2 sets  Open end wrench\n4mm to 20 mm\n\n--- PDF PAGE 61 ---\nTR - Machining NC II\n Promulgated March 2005\n\n57\n\nEQUIPMENT\nQTY.\nDescription\nQTY.\nDescription\nQTY.\nDescription\n2 units\n• Two Head Bench\nGrinder\n2\nunits\n\n• Milling Machine\nUniversal complete\nw/ accessories\nper machine:\n-Clamping bolts\n-Milling Vises\n- Angle plates\n- Rotary table\n- Indexing Head with:\n3-jaw chuck, gears,\nfootstock and center\n1 unit\n• Plain cylindrical\ngrinder complete\nw/ accessories\n2 units\n• Bench Drill w/ Drill\nVise\n1 unit\n• Universal\nCylindrical grinder\ncomplete w/\naccessories\n3 units\n• Lathe Machine 10’”\nswing\nComplete with:\n(1 unit each\nmachine)\n\n• 3-jaw chucks\n• 4-jaw chucks\n• Face Plates\n• 1 set lathe dogs\n• Revolving\nCenters\n• Drill Chucks\n• Dead Centers\n• 1 Set Boring\nBars\n• Follower rest\n• Steady Rest\n• Tool Holders:\nFacing, Straight,\nRH,LH\n• Parting-Off\n• Surface Gage\n2 pcs.\n Side milling cutter 2\n½ dia\n1 unit\n• Universal Tool\nand Cutter\nGrinder\nComplete w/\naccessories\n2 pcs.\n 45 degrees milling\ncutter 2 ½ dia.\n Additional Accessories\n1 set\n Gear Cutter 1.5 M\n- Clamps w/ bolts\n1 Set\n Gear Cutter 2.0 M\n- Angle plates\n2 pcs.\n\nSlitter cutters\n- Parallels\n2 pcs.\n\nSlot Cutters\n- Wheel balancing\n1 unit\n\n Power Saw complete\nwith accessories\n- Diamond Wheel dresser\n1 unit\n• Band Saw complete\nwith accessories\n\nMATERIALS\nQTY.\nDescription\nQTY.\nDescription\nTraining Materials :\n\n50 pcs.\n50 pcs.\n• High speed steel\ntool bit (Momax)\n3/8 x 3/8 x 2”\n1/4 x 1/4 x 2”\n10\npcs.\n• Center drill # 3 and #\n2\n• Reference books\n4 pcs.\n Grinding wheel for\nbench grinder\n• Manuals\n2 pcs.\n•CRS 12mm dia\n2 Sets\n Drill 3mm to 12 mm\n•Catalogs\n2 pcs.\n•CRS 19mm dia\n5 pcs.\n Carbide insert\n•Brochures\n1 pc.\n• CRS 50 mm dia.\n6 doz.\n Hack saw blade\n• Modules / LEs\n2 pcs.\n• CRS 25mm dia.\n1 doz\n.\n Power hack saw\nblade\n• CDs/Video tapes\n\n2 pcs\n•Oil Stone\n\n--- PDF PAGE 62 ---\nTR - Machining NC II\n Promulgated March 2005\n\n58\n3.5 TRAINING FACILITIES\nMACHINING NC II\n\nThe machining workshop must be of concrete structure for 25 students/trainees. The\nspace requirements for the teaching/learning and circulation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n• Building (permanent)\n\n 10 M X 30 M\n\n 300 Sq. M\n\nTrainee working space\n\n 2 M X 2 M\n\n 4 Sq.M /\ntrainee\n\n 100 Sq. M\n\nLecture Room\n 8 M X 10 M\n 80 Sq. M.\n80 Sq. M\n\nLearning Resource\nCenter\n\n 4 M X 8 M\n\n 32 Sq. M\n\n32 Sq. M\n\nFacilities/ Equipment/\nCirculation Area\n\n88 Sq. M\n\n3.6 TRAINER’S QUALIFICATIONS FOR MACHINING NC II\n\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of Machining NC III Qualification or its equivalent\n• Must have undergone training on Training Methodology II (TM II) or equivalent in training\nexperience\n• Must be computer literate\n• Must be physically and mentally fit\n• *Must have at least 2 years job/industry experience\n• Must be a civil service eligible (for government position or appropriate professional license\nissued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement of units\nof competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 63 ---\nTR - Machining NC II\n Promulgated March 2005\n\n59"
