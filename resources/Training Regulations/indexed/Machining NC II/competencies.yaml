d of\nassessment\nCompetency must be assessed through:\n5.1\ndirect observation of milling activities\n5.2\nwritten or oral short answer questions\n5.3\npractical exercises\n5.4\nidentify colleagues/clients who can be approached for the\ncollection of competency evidence, where appropriate\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 50 ---\nTR - Machining NC II\n Promulgated March 2005\n\n46\nUNIT OF COMPETENCY :\nGrind Workpiece (Basic)\n\nUNIT CODE\n:\nMEE722304\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills required to setup and grind workpiece to\ndrawing specifications. It details the requirements for grinding\nparallel surfaces, square surfaces, angles, radii and cutting off\nparts.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine job\nrequirements\n1.1\nDrawings are interpreted to produce component to\nspecifications.\n1.2\nSequence of operation is determined to produce component\nto specifications.\n1.3\nWorkholding\ndevices\nare\nselected\naccording\nto\nthe\nrequirements of the operation.\n2. Select wheels and\naccessories\n2.1\nGrinding wheels are selected, inspected, mounted, dressed\nand trued according to worksite procedures to produce\ncomponent to specifications.\n2.2\nAccessories selected are appropriate to the requirements of\nthe operation.\n2.3\nMachine guards, coolant and dust extraction devices are\nchecked according to worksite procedure.\n3. Perform grinding\noperations\n3.1\nGrinding machine is setup and adjusted in accordance with\nworksite procedures.\n3.2\nWorkpiece is held or clamped to avoid damage.\n3.3\nGrinding operations are performed safely, utilizing guards,\nsafety procedures and personal protective clothing and\ndevices.\n3.4\nGrinding operations are performed to produce component\nto specifications in the drawing.\n4. Check/Measure\ncomponent\n4.1\nWorkpiece is checked/measured for conformance to\nspecification using appropriate techniques, measuring tools\nand equipment.\n\n--- PDF PAGE 51 ---\nTR - Machining NC II\n Promulgated March 2005\n\n47\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Grinding wheels\nWheels are selected according to:\n1.1\ntypes\n1.2\ngrades\n1.3\nsizes\n2. Accessories\n2.1\nmagnetic chuck\n2.2\nvices\n2.3\nclamps\n2.4\nangle plates\n2.5\nadapter plates\n2.6\nparallels\n2.7\nwheel dresser\n3. Grinding machine\n3.1\nHorizontal spindle surface grinder\n3.2\nVertical spindle surface grinder\n4. Grinding operations\nGrinding\n4.1\nparallel faces\n4.2\nsquare surfaces\n4.3\nangles\n4.4\nto a square shoulder\n4.5\nradii\n4.6\nto cut off parts\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate:\n1.1\ndetermined job requirements\n1.2\nselected wheels and accessories .\n1.3\nperformed grinding operations\n1.4\nchecked/measured the workpiece\n2. Underpinning\nknowledge\n2.1\nShop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n2.2\nDrawing interpretation\n2.2.1 Alphabet of lines\n2.2.2 Drawing symbols\n2.2.3 Projections and views\n2.2.4 Fits and tolerances\n2.2.5 Surface texture\n2.2.6 Sketches and mechanical drawing\n2.3\nShop mathematics\n2.3.1 Basic arithmetic operations\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Applying trigonometric functions\n\n--- PDF PAGE 52 ---\nTR - Machining NC II\n Promulgated March 2005\n\n48\n\n2.4\nMeasurements\n2.4.1 Linear measuring tools (rules, vernier, micrometer)\n2.4.2 Dial indicator\n2.4.3 Precision square\n2.4.4 Bevel protractor\n2.4.5 Vernier height gage\n2.4.6 Gage blocks\n2.4.7 Sine bar\n2.4.8 Radius gage\n2.4.9 Precision square\n2.5\nMaterials and related science\n2.5.1 Classif