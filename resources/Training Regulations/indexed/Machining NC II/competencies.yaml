        "source_title": "MEASURE WORKPIECE (BASIC)",
        "source_text": "--- PDF PAGE 24 ---\nTR - Machining NC II \n Promulgated March 2005 \n \n20\nUNIT OF COMPETENCY : \nMEASURE WORKPIECE (BASIC) \n \nUNIT CODE \n: \nMEE722205 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competencies required to measure workpieces \nusing measuring instruments such as steel rules, vernier calipers, \nmicrometers, etc…. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Select and use  \nmeasuring tools \n1.1 \nMeasuring tools are selected and used according to the level \nof accuracy required. \n1.2 \nMeasurements taken are accurate to the finest graduation of \nthe selected measuring instrument. \n1.3 \nMeasuring technique used is correct and appropriate to the \ndevice used.  \n2. Clean and store \nmeasuring tools \n2.1 \nCare and storage of devices undertaken to manufacturer’s \nspecifications or standard operating procedures.\n\n--- PDF PAGE 25 ---\nTR - Machining NC II \n Promulgated March 2005 \n \n21\nRANGE OF VARIABLES \n \nVARIABLE\nRANGE\n1. Measuring tools \nMeasuring tools include \n1.1 Steel tape \n1.2 \nSteel rule \n1.3 \nStraight edge \n1.4 \nCombination square \n1.5 \nSteel square \n1.6 \nDivider or trammel \n1.7 \nCaliper \n1.8 \nProtractor \n1.9 \nVernier caliper \n1.10\nMicrometer \n2. Measurements \n2.1 \nlength \n2.2 \ndiameter \n2.3 \ndepth \n2.4 \nflatness \n2.5 \nstraightness \n2.6\nsquareness\n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nevidence  \nAssessment requires evidence that the candidate:   \n1.1 \nSelected and used measuring instruments \n1.2\nCleaned and stored measuring instruments\n2. Underpinning \nknowledge    \n2.1 \nTypes, purposes and accuracy of measuring instruments \n2.2 \nCapability of measuring instruments \n2.3  \nPart dimensions and tolerances \n2.4  \nTechniques for measuring dimensions \n2.5\nCare and storage procedure of measuring tools\n3. Underpinning skills\nSafe handling of measuring tools and materials\n4. Resource \nimplications \nThe following resources MUST be provided \n4.1 \nTools, equipment and facilities appropriate to the activity \n4.2\nSpecimen component or part to the proposed activity\n5. Method of \nassessment \nThe following assessment methods are suggested: \n5.1 \ndirect observation  \n5.2 \ndemonstration  \n5.3 \nwritten or oral short answer questions \n5.4\nportfolio\n6. Context of \nassessment\nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
