        "source_text": "MEE722305\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to select and use hand\nand power tools to perform complex bench work operation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Chip workpiece\n1.1\nChisels are selected according to requirements of the\noperation.\n1.2\nWorkpieces are chipped to drawing specifications\n2. File workpieces\n2.1\nFile selected is appropriate to requirement of the operation.\n2.2\nWorkpieces are filed to drawing specifications.\n2.3\nFiles are cleaned and stored according worksite procedures.\n3. Remove damaged\nand broken threaded\nfasteners.\n3.1\nExtractors are selected according to the requirements of the\noperation.\n3.2\nDamaged threaded fastener is removed according to worksite\nprocedures.\n4. Repair damaged\nthreads\n4.1\nTaps and or dies are selected according to the requirements\nof the operation.\n4.2\nThread is repaired according to worksite procedures.\n4.3\nThread is repaired to conforms with drawing specifications.\n5. Scrape and hone\nholes\n5.1\nScrapers are selected according to requirements of the\noperation.\n5.2\nHoning flushing agent is selected and applied according the\nrequirements of the operation.\n5.3\nWorkpieces are scraped and honed according to drawing\nspecifications.\n\n--- PDF PAGE 36 ---\nTR - Machining NC II\n Promulgated March 2005\n\n32\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Chisels\nChisels include\n1.1\nFlat cold chisel\n1.2\nCape chisel\n1.3\nDiamond-point chisel\n1.4\nRound nose chisel\n2. Chipped\n2.1\ngrooves\n2.2\nslots\n2.3\nkeyways\n3. File\nFile types based on\n3.1\nteeth cut (single cut, double cut, rasp and curved tooth)\n3.2\ncut (bastard, second cut)\n3.3\ncross section (square, round, triangular, half-round)\n3.4\nshape (flat, hand, pillar, mill)\n4 Filed\nFiling operations\n4.1\nContoured outline\n4.2\nContoured holes\n5. Extractors\n5.1\nScrew extractor\n5.2\nStud extractors\n6. Thread\n6.1\nInternal threads\n6.2\nExternal threads\n7. Scrapers\nScraper for\n7.1\nFlat surface (flat scraper, hook scraper)\n7.2\nCurve surface (half-round bent scraper, three-cornered\nscraper)\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate:\n1.1\nchipped grooves, slots and keyways on workpiece\n1.2\nfiled contoured outline and hole.\n1.3\nremoved damaged and broken threaded fasteners\n1.4\nrepaired threads\n1.5\nscraped and honed holes\n2. Underpinning\nknowledge and\nattitude\n2.1\nShop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.2 Drawing/Plans\n2.2.1 Standard drawing symbols\n2.2.2 Orthographic and isometric drawings\n2.3 Shop mathematics\n2.3.1 Basic arithmetic operations\n2.3.2 Fractions and decimals\n2.3.4 Percentages and ratios\n2.3.5 Conversion of units (English to metric)\n2.3.6 Trigonometric functions\n\n--- PDF PAGE 37 ---\nTR - Machining NC II\n Promulgated March 2005\n\n33\n\n2.4\nMeasurements\n2.4.1 Measuring tools (rules, vernier, micrometer, height\ngage, profile gage)\n2.5\nMaterials and related science\n2.5.1 Classification and mechanical properties of engineering\nmaterials\n2.6\nBench work\nTheory, use and care of hand tools for:\n2.6.1 layout and marking tools\n2.6.2 chipping, filing, scraping and honing\n2.6.3 cutting threads\n2.6.4 extracting fasteners\n3. Underpinning skills\n3.1\nUsing bench work tools and equipment\n3.2\nUsing measuring tools\n3.3\nOperating drill press and grinder\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nTools, equipment and facilities appropriate to processes or\nactivity\n4.2\nMaterials relevant to the proposed activity\n4.3\nDrawings, sketches or blueprint\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1\ndirect observation of bench work activities\n5.2\nwritten or oral short answer questions\n5.3\npractical exercises\n5.4\nproject work\n5.5\nidentify colleagues/clients who can be approached for the\ncollection of competency evidence, where appropriate\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 38 ---\nTR - Machining NC II\n Promulgated March 2005\n\n34\nUNIT OF COMPETENCY :\nTurn Workpiece (Basic)\n\nUNIT CODE\n:"
