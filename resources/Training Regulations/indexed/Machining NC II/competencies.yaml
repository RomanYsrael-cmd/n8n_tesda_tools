        "evidence_guide": {
          "source_text": "1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate:\n1.1\nLaid-out and marked dimensions/features on the workpiece\n1.2\nCut, chipped and filed workpiece.\n1.3\nDrilled, reamed and lapped holes.\n1.4\nCut threads\n1.5\nPerformed off-hand grinding\n2. Underpinning\nknowledge and\nattitude\n2.1\nShop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n2.2\nDrawing/Plans\n2.2.1 Standard drawing symbols\n2.2.2 Orthographic and isometric drawings\n\n--- PDF PAGE 34 ---\nTR - Machining NC II\n Promulgated March 2005\n\n30\n\n2.3\nShop mathematics\n2.3.1 Basic arithmetic operations\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Trigonometric functions\n2.3.6 Computation of feed, cutting speed and machine rpm\n2.4\nMeasurements\n2.4.1 Linear measuring tools (rules, vernier, micrometer,\nheight gage)\n2.4.2 Geometrical tolerances\n2.5\nMaterials and related science\n2.5.1 Classification and mechanical properties of engineering\nmaterials\n2.6 Bench work\n2.6.1 Theory, use and care of hand tools for:\n2.6.2 Layout and marking tools\n2.6.3 Sawing, chipping, filing, lapping\n2.6.4 Drilling, reaming, tapping\n2.6.5 External threading\n2.6.6 Off-hand grinding\n3. Underpinning skills\n3.1\nUsing bench work tools and equipment\n3.2\nUsing measuring instruments\n3.3\nOperating drill press and grinders\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nTools, equipment and facilities appropriate to processes or\nactivity\n4.2\nMaterials relevant to the proposed activity\n4.3\nDrawings, sketches or blueprint\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1\ndirect observation of bench work activities\n5.2\nwritten or oral short answer questions\n5.3\npractical exercises\n5.4\nproject work\n5.5\nidentify colleagues/clients who can be approached for the\ncollection of competency evidence, where appropriate\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 35 ---\nTR - Machining NC II\n Promulgated March 2005\n\n31\nUNIT OF COMPETENCY :\nPerform Bench Work (Complex)\n\nUNIT CODE\n:"
        },
        "source_text": "MEE722301\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to determine job\nrequirements, perform basic bench work operations (i.e. layout;\ncutting with hacksaw and chisel; filing; drilling; tapping etc…) and\ncheck the components for conformance to specifications.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Layout and mark\ndimensions/ features\non workpiece\n1.1\nMaterials are selected according to the requirements\nspecified in the drawing.\n1.2\nDimensions/features are laid out and marked in accordance\nwith drawing specifications using bench work tools and\nequipment.\n1.3\nLayouting and marking are performed applying knowledge on\nsafety procedures and using personal protective devices.\n2. Cut, chip and file flat,\nrectangular or round\nblocks\n2.1\nWorkpieces are clamped in workholding devices to avoid\ndamage and accidents.\n2.2\nWorkpieces are cut, chipped or filed to within tolerance\nspecified in the drawing.\n2.3\nBroken or dull hacksaw blades are replaced according to\nrequirements\n2.4\nBench work operations are performed applying knowledge\non safety procedures and using personal protective devices.\n3. Drill, ream and lap\nholes\n3.1\nHole is drilled, reamed, spot-faced and lapped to drawing\nspecification.\n3.2\nDrilling, reaming or lapping holes are performed according to\nrecommended sequence.\n3.3\nOperations are performed applying knowledge on safety\nprocedures and using personal protective devices.\n4. Cut threads using tap\nand stock and die\n4.1\nThread is cut to fit gage or mating screw, within tolerance\ngiven in the blueprint\n4.2\nThread is cut in accordance with the recommended tapping\nsequence\n4.3\nThread cutting operations are performed applying knowledge\non safety procedures and using personal protective devices.\n5. Off-hand grind cutting\ntools\n5.1\nCut edges are honed and free of burrs.\n5.2\nCutter is sharpened to conform with specifications.\n5.3\nCutters are ground using appropriate cooling agents.\n5.4\nCutting tool grinding is performed applying knowledge on\nsafety procedures and using personal protective devices.\n\n--- PDF PAGE 33 ---\nTR - Machining NC II\n Promulgated March 2005\n\n29\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMaterials used in bench work operations include\n1.1\nFerrous\n1.2\nNon Ferrous\n2. Bench work tools and\nEquipment\nEquipment and tools may include\n2.1\nDrill Press\n2.2\nPedestal Grinder\n2.3\nSurface plate\n2.4\nLayout and marking tools\n2.5\nCutting tools (hacksaw, chisel, files)\n2.6\nDrills, reamers, laps\n2.7\nThread cutting tools (taps and stock and die)\n2.8\nInspection and measuring tools (templates, vernier caliper,\nmicrometer, straight edge, gages, etc…)\n3. Workholding Devices\nWorkholding devices include the use of\n3.1\nClamps\n3.2\nVises\n4. Bench work\noperations\nBench work operations\n4.1\nLayout and marking\n4.2\nCutting\n4.3\nChipping\n4.4\nFiling\n4.5\nDrilling, boring, counterboring, spot-facing\n4.6\nLapping\n4.7\nReaming\n4.8\nThread cutting\n4.9\nOff-hand grinding\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate:\n1.1\nLaid-out and marked dimensions/features on the workpiece\n1.2\nCut, chipped and filed workpiece.\n1.3\nDrilled, reamed and lapped holes.\n1.4\nCut threads\n1.5\nPerformed off-hand grinding\n2. Underpinning\nknowledge and\nattitude\n2.1\nShop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n2.2\nDrawing/Plans\n2.2.1 Standard drawing symbols\n2.2.2 Orthographic and isometric drawings\n\n--- PDF PAGE 34 ---\nTR - Machining NC II\n Promulgated March 2005\n\n30\n\n2.3\nShop mathematics\n2.3.1 Basic arithmetic operations\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Trigonometric functions\n2.3.6 Computation of feed, cutting speed and machine rpm\n2.4\nMeasurements\n2.4.1 Linear measuring tools (rules, vernier, micrometer,\nheight gage)\n2.4.2 Geometrical tolerances\n2.5\nMaterials and related science\n2.5.1 Classification and mechanical properties of engineering\nmaterials\n2.6 Bench work\n2.6.1 Theory, use and care of hand tools for:\n2.6.2 Layout and marking tools\n2.6.3 Sawing, chipping, filing, lapping\n2.6.4 Drilling, reaming, tapping\n2.6.5 External threading\n2.6.6 Off-hand grinding\n3. Underpinning skills\n3.1\nUsing bench work tools and equipment\n3.2\nUsing measuring instruments\n3.3\nOperating drill press and grinders\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nTools, equipment and facilities appropriate to processes or\nactivity\n4.2\nMaterials relevant to the proposed activity\n4.3\nDrawings, sketches or blueprint\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1\ndirect observation of bench work activities\n5.2\nwritten or oral short answer questions\n5.3\npractical exercises\n5.4\nproject work\n5.5\nidentify colleagues/clients who can be approached for the\ncollection of competency evidence, where appropriate\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 35 ---\nTR - Machining NC II\n Promulgated March 2005\n\n31\nUNIT OF COMPETENCY :\nPerform Bench Work (Complex)\n\nUNIT CODE\n:"
      },
