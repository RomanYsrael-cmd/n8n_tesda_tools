  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in MACHINING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n:\n500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to workplace\nrequirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking skills are\nused to gather and convey information\n1.3\nAppropriate medium is used to transfer information and ideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6\nDefined workplace procedures for the location and storage of\ninformation are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace meetings\nand discussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete relevant\nwork related\ndocuments\n3.1\nRange of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace forms and\ndocuments\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 7 ---\nTR - Machining NC II\n Promulgated March 2005\n 3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms, safety reports\n5. Workplace\ninteractions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos, instruction and forms,\nnon-verbal including gestures, signals, signs and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 8 ---\nTR - Machining NC II\n Promulgated March 2005\n 4\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nPrepared written communication following standard format of\nthe organization\n1.2.\nAccessed information using communication equipment\n1.3.\nMade use of relevant terms as an aid to transfer information\neffectively\n1.4.\nConveyed information effectively adopting the formal or\ninformal communication\n2. Underpinning\nknowledge and\nattitudes\n\n2.1.\nEffective communication\n2.2.\nDifferent modes of communication\n2.3.\nWritten communication\n2.4.\nOrganizational policies\n2.5.\nCommunication procedures and systems\n2.6.\nTechnology relevant to the enterprise and the individual’s\nwork responsibilities\n3. Underpinning skills\n3.1.\nFollow simple spoken language\n3.2.\nPerform routine workplace duties following simple written\nnotices\n3.3.\nParticipate in workplace meetings and discussions\n3.4.\nComplete work related documents\n3.5.\nEstimate, calculate and record routine workplace measures\n3.6.\nBasic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7.\nAbility to relate to people of social range in the workplace\n3.8.\nGather and provide information in response to workplace\nRequirements\n4. Resource\nimplications\n4.1.\nFax machine\n4.2.\nTelephone\n4.3.\nWriting materials\n4.4.\nInternet\n5. Method of\nassessment\n5.1.\nDirect Observation\n5.2.\nOral interview and written test\n6. Context of\nassessment\nCompetency may be assessed individually in the actual workplace or\nthrough accredited institution\n\n--- PDF PAGE 9 ---\nTR - Machining NC II\n Promulgated March 2005\n 5\nUNIT OF COMPETENCY :\nWORK IN TEAM ENVIRONMENT\n\nUNIT CODE\n:\n500311106\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to identify role\nand responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1.\nThe role and objective of the team is identified from\navailable sources of information\n1.2.\nTeam parameters, reporting relationships and responsibilities\nare identified from team discussions and appropriate external\nsources\n2. Identify own role and\nresponsibility within\nteam\n2.1.\nIndividual role and responsibilities within the team\nenvironment are identified\n2.2.\nRoles and responsibility of other team members are identified\nand recognized\n2.3.\nReporting relationships within team and external to team are\nidentified\n3. Work as a team\nmember\n3.1.\nEffective and appropriate forms of communications used and\ninteractions undertaken with team members who contribute to\nknown team activities and objectives\n3.2.\nEffective and appropriate contributions made to complement\nteam activities and objectives, based on individual skills and\ncompetencies and workplace context\n3.3.\nObserved protocols in reporting using standard operating\nprocedures\n3.4.\nContribute to the development of team work plans based on\nan understanding of team’s role and objectives and individual\ncompetencies of the members.\n\n--- PDF PAGE 10 ---\nTR - Machining NC II\n Promulgated March 2005\n 6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1.\nWork activities in a team environment with enterprise or\nspecific sector\n1.2.\nLimited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace procedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage, safe handling\nand disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 11 ---\nTR - Machining NC II\n Promulgated March 2005\n 7\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace language\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning\nknowledge and\nattitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning skills\n3.1.\nCommunicate appropriately, consistent with the culture of the\nworkplace\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n4.2.\nMaterials relevant to the proposed activity or tasks\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation to the work\nactivities of the group\n5.2.\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3.\nCase studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n6. Context of\nassessment\n6.1.\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTR - Machining NC II\n Promulgated March 2005\n 8\nUNIT OF COMPETENCY :\nPRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE\n:\n500311107\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in promoting\ncareer growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1\nPersonal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2\nIntra- and interpersonal relationships are maintained in the\ncourse of managing oneself based on performance\nevaluation\n1.3\nCommitment to the organization and its goal is demonstrated\nin the performance of duties\n2. Set and meet work\npriorities\n2.1\nCompeting demands are prioritized to achieve personal, team\nand organizational goals and objectives.\n2.2\nResources are utilized efficiently and effectively to manage\nwork priorities and commitments\n2.3\nPractices along economic use and maintenance of equipment\nand facilities are followed as per established procedures\n3. Maintain professional\ngrowth and\ndevelopment\n3.1\nTrainings and career opportunities are identified and\navailed of based on job requirements\n3.2\nRecognitions are sought/received and demonstrated as\nproof of career advancement\n3.3\nLicenses and/or certifications relevant to job and career are\nobtained and renewed\n\n--- PDF PAGE 13 ---\nTR - Machining NC II\n Promulgated March 2005\n 9\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1\nPerformance Appraisal\n1.2\nPsychological Profile\n1.3\nAptitude Tests\n2. Resources\n2.1\nHuman\n2.2\nFinancial\n2.3\nTechnology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1\nParticipation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2\nServing as Resource Persons in conferences and workshops\n4. Recognitions\n4.1\nRecommendations\n4.2\nCitations\n4.3\nCertificate of Appreciations\n4.4\nCommendations\n4.5\nAwards\n4.6\nTangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1\nNational Certificates\n5.2\nCertificate of Competency\n5.3\nSupport Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 14 ---\nTR - Machining NC II\n Promulgated March 2005\n\n10\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra - and interpersonal relationship in the course\nof managing oneself based on performance evaluation\n1.3\nCompleted trainings and career opportunities which are based\non the requirements of the industries\n1.4\nAcquired and maintained licenses and/or certifications\naccording to the requirement of the qualification\n2. Underpinning\nknowledge\n2.1\nWork values and ethics (Code of Conduct, Code of Ethics,\netc.)\n2.2\nCompany policies\n2.3\nCompany operations, procedures and standards\n2.4\nFundamental rights at work including gender sensitivity\n2.5\nPersonal hygiene practices\n3. Underpinning skills\n3.1\nAppropriate practice of personal hygiene\n3.2\nIntra and Interpersonal skills\n3.3\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nWorkplace or assessment location\n4.2\nCase studies/scenarios\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nSimulation/Role-plays\n5.4\nObservation\n5.5\nThird Party Reports\n5.6\nExams and Tests\n6. Context of\nassessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting\n\n--- PDF PAGE 15 ---\nTR - Machining NC II\n Promulgated March 2005\n\n11\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\n\nUNIT CODE\n:\n500311108\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to comply with regulatory\nand organizational requirements for occupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1\nSafety regulations and workplace safety and hazard control\npractices and procedures are clarified and explained based on\norganization procedures\n1.2\nHazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with\norganization procedures\n1.3\nContingency measures during workplace accidents, fire and\nother emergencies are recognized and established in\naccordance with organization procedures\n2. Evaluate hazards and\nrisks\n2.1\nTerms of maximum tolerable limits which when exceeded will\nresult in harm or damage are identified based on threshold\nlimit values (TLV)\n2.2\nEffects of the hazards are determined\n2.3\n OHS issues and/or concerns and identified safety hazards\nare reported to designated personnel in accordance with\nworkplace requirements and relevant workplace OHS\nlegislation\n3. Control hazards and\nrisks\n3.1\nOccupational Health and Safety (OHS) procedures for\ncontrolling hazards/risks in workplace are consistently\nfollowed\n3.2\nProcedures for dealing with workplace accidents, fire and\nemergencies are followed in accordance with organization\nOHS policies\n3.3\nPersonal protective equipment (PPE) is correctly used in\naccordance with organization OHS procedures and practices\n3.4\nAppropriate assistance is provided in the event of a workplace\nemergency in accordance with established organization\nprotocol\n4. Maintain OHS\nawareness\n4.1\nEmergency-related drills and trainings are participated in\nas per established organization guidelines and procedures\n4.2\nOHS personal records are completed and updated in\naccordance with workplace requirements\n\n--- PDF PAGE 16 ---\nTR - Machining NC II\n Promulgated March 2005\n\n12\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites, mites,\nmolds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4\nErgonomics\n• Psychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n• Physiological factors – monotony, personal relationship,\nwork out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\n(Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n5. Emergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6. OHS personal\nrecords\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 17 ---\nTR - Machining NC II\n Promulgated March 2005\n\n13\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5\nFollowed Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in accordance\nwith company OHS procedures and practices\n1.7\nCompleted and updated OHS personal records in accordance\nwith workplace requirements\n2. Underpinning\nknowledge and\nattitude\n2.1\nOHS procedures and practices and regulations\n2.2\nPPE types and uses\n2.3\nPersonal hygiene practices\n2.4\nHazards/risks identification and control\n2.5\nThreshold Limit Value -TLV\n2.6\nOHS indicators\n2.7\nOrganization safety and health protocol\n2.8\nSafety consciousness\n2.9\nHealth consciousness\n3. Underpinning skills\n3.1\nPractice of personal hygiene\n3.2\nHazards/risks identification and control skills\n3.3\nInterpersonal skills\n3.4\nCommunication skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\n Workplace or assessment location\n4.2\nOHS personal records\n4.3\nPPE\n4.4\nHealth records\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nPortfolio Assessment\n5.2\nInterview\n5.3\nCase Study/Situation\n6. Context of\nassessment\nCompetency may be assessed in the work place or in a simulated\nwork place setting\n\n--- PDF PAGE 18 ---\nTR - Machining NC II\n Promulgated March 2005\n\n14\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nINTERPRET WORKING DRAWINGS AND SKETCHES\n\nUNIT CODE\n:\nMEE722202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to read and interpret\ndrawings and sketches.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Interpret technical\ndrawing\n1.1\nComponents, assemblies or objects recognized as required.\n1.2\nDimensions identified as appropriate.\n1.3\nInstructions identified and followed as required.\n1.4\nMaterial requirements identified as required.\n1.5\nSymbols recognized as appropriate in the drawing.\n1.6\nTolerance, limits and fits identified in the drawing.\n2. Prepare freehand\nsketch of parts\n2.1\nSketch drawn correctly and appropriately.\n2.2\nSketch depicted objects or part appropriately.\n2.3\nDimensions indicated in sketch are clear and correct.\n2.4\nInstructions included in sketch are clear and correct.\n2.5\nBase line or datum points indicated as required.\n3. Interpret details from\nfreehand sketch\n3.1\nComponents, assemblies or objects recognized as required.\n3.2\nDimensions identified as appropriate.\n3.3\nInstructions identified and followed as required.\n3.4\nMaterial requirements identified as required.\n3.5\nSymbols recognized as appropriate in the drawing.\n\n--- PDF PAGE 19 ---\nTR - Machining NC II\n Promulgated March 2005\n\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Drawing\n1.1\nDrawing technique include\n1.1.1 Perspective\n1.1.2 Exploded view\n1.1.3 Hidden view technique\n1.2\nProjections\n1.2.1 First angle projections\n1.2.2\nThird angle projections\n2. Tolerance\n2.1\nGeneral tolerance\n2.2\nAngular tolerance\n2.3\nGeometric tolerance\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate:\n1.1\nInterpreted technical drawing\n1.2\nPrepared sketches\n1.3\nInterpreted sketches.\n2. Underpinning\nknowledge\n2.1\nAlphabet of lines\n2.2\nProjections\n2.3\nDrawing symbols\n2.4\nDimensioning techniques\n2.5\nTolerance, limits and fits\n2.6\nEngineering materials\n2.7\nDrawing tools and supplies\n3. Underpinning skills\n3.1\nHandling tools and drawing instruments\n3.2\nUsing measuring instruments\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nDrafting room/facilities and drafting instruments and supplies\nappropriate to the activity\n4.2\nMeasuring tools\n4.3\nDrawings, sketches or blueprint\n4.4\nSpecimen parts/components\n5. Method of\nassessment\nThe following assessment methods are suggested:\n5.1\ndirect observation\n5.2\nwritten or oral short answer questions\n5.3\ndemonstration\n5.4\nproject/work sample\n5.5\nportfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 20 ---\nTR - Machining NC II\n Promulgated March 2005\n\n16\nUNIT OF COMPETENCY : SELECT/ CUT WORKSHOP MATERIALS\n\nUNIT CODE\n:\nMEE722203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required to select and cut\nworkshop materials\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine\nrequirement\n1.1\nPlans/ drawings are interpreted to produce component to\nspecification\n1.2\n Sequence of operation is determined to produce component\nto specification\n2. Select and measure\nmaterials\n2.1\nMaterials are selected according to the requirement of the\noperation\n2.2\nMaterials are measured to required level of accuracy using\nmeasuring tools\n2.3\nMeasuring tools are used according to manufacturers\nspecification\n3. Cut materials\n3.1\nMaterials are cut according to plans/drawing instruction\n3.2\nCutting tools/equipment are used based on manufacturers\nspecification, appropriate techniques or the safety procedure\n\n--- PDF PAGE 21 ---\nTR - Machining NC II\n Promulgated March 2005\n\n17\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Plan/drawings\n1.1\nDimensions\n1.2\nTolerance\n2. Materials\n2.1\nFerrous\n2.2\nNon-ferrous\n3. Measuring tools\n3.1\nSteel rule\n3.2\nPull-push rule\n4. Cutting\ntools/equipment\n4.1\nHacksaw\n4.2\nPower hacksaw\n5. Safety procedure\nSafety involves the handling of\n5.1\nEquipment\n5.2\nTools\n5.3\nMaterials\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate\n1.1\nInterpreted plans/drawings\n1.2\nSelected natural according to the requirement\n1.3\nPerformed cutting operation\n1.4\nCutting tools/equipment used safely\n2. Underpinning\nknowledge and\nattitude\n2.1\nShop safety practices\n2.1.1 Safe working habits\n2.1.2 Safe handling of tools, equipment and materials\n2.2\nBlueprint reading\n2.2.1 Standard drawing scales, symbols and abbreviations\n2.2.2 Assembly and details of drawing\n2.2.3 Dimensions\n2.3\nMeasurement\n2.3.1 Linear measuring tools\n2.4\nMaterials and related science\n2.4.1 Classification and mechanical properties of engineering\nmaterials\n3. Underpinning skills\n3.1\nSelecting materials\n3.2\nUsing measuring tools\n3.3\nOperating power hacksaw\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nTools, equipment and facilities appropriate processes of an\nactivity\n4.2\nMaterials relevant to the proposal activity\n4.3\nDrawings/plans\n5. Method of\nassessment\n\nThe following assessment activity are suggested\n5.1\nDirect observation\n5.2\nOral short answer question\n5.3\nPractical exercises\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated work\nenvironment\n\n--- PDF PAGE 22 ---\nTR - Machining NC II\n Promulgated March 2005\n\n18\nUNIT OF COMPETENCY :\nPERFORM SHOP COMPUTATIONS (BASIC)\n\nUNIT CODE\n:\nMEE722204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to perform basic\ncalculations using the four fundamental operation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform four\nfundamental\noperations.\n1.1\nSimple calculations performed using four fundamental\noperations.\n1.2\nSimple calculations performed involving fractions and mixed\nnumbers using four fundamental operations\n2. Perform basic\ncalculations involving\nfractions and\ndecimals\n2.1\nSimple calculations are performed involving fractions and\ndecimals using the four fundamental operations.\n2.2\nDecimal are converted into fraction (and vice versa)\naccurately.\n3. Perform basic\ncalculations involving\npercentages.\n3.1\nSimple calculations are performed to obtain percentages from\ninformation expressed in either fractional or decimal format.\n4. Perform basic\ncalculation involving\nration and proportion\n4.1\nSimple calculations are performed involving ratios and\nproportion using whole numbers, fractions and decimal\nfractions.\n5. Perform calculations\non algebraic\nexpressions\n5.1\nSimple calculations are performed on algebraic expressions\nusing the four fundamental operations.\n5.2\nSimple transposition of formulae is carried out to isolate the\nvariable required, involving the four fundamental operations.\n\n--- PDF PAGE 23 ---\nTR - Machining NC II\n Promulgated March 2005\n\n19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Four fundamental\noperations\n1.1\nAddition\n1.2\nSubtraction\n1.3\nMultiplication\n1.4\nDivision\n2. Algebraic\nexpressions\nCalculation using formula for determining\n2.1\ntap drill size\n2.2\nfeed\n2.3\nspeed\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate performed\ncalculations:\n1.1\nusing four fundamental operations\n1.2\ninvolving fractions and mixed numbers\n1.3\ninvolving fractions and decimals\n1.4\ninvolving percentages\n1.5\ninvolving ratio and proportion\n1.6\non algebraic expressions\n1.7\nof simple formulae\n2. Underpinning\nknowledge and\nattitude\n2.1\nEnglish and metric system of measurements\n3. Underpinning skills\n3.1\nPerforming calculations using pen and paper or on a\ncalculator.\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nTools, equipment and facilities appropriate to processes or\nactivity\n4.2\nMaterials relevant to the proposed activity\n5. Method of\nassessment\nThe following assessment methods are suggested:\n5.1\nwritten or oral short answer questions\n5.2\npractical exercises\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 24 ---\nTR - Machining NC II\n Promulgated March 2005\n\n20\nUNIT OF COMPETENCY :\nMEASURE WORKPIECE (BASIC)\n\nUNIT CODE\n:\nMEE722205\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to measure workpieces\nusing measuring instruments such as steel rules, vernier calipers,\nmicrometers, etc….\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select and use\nmeasuring tools\n1.1\nMeasuring tools are selected and used according to the level\nof accuracy required.\n1.2\nMeasurements taken are accurate to the finest graduation of\nthe selected measuring instrument.\n1.3\nMeasuring technique used is correct and appropriate to the\ndevice used.\n2. Clean and store\nmeasuring tools\n2.1\nCare and storage of devices undertaken to manufacturer’s\nspecifications or standard operating procedures.\n\n--- PDF PAGE 25 ---\nTR - Machining NC II\n Promulgated March 2005\n\n21\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring tools\nMeasuring tools include\n1.1 Steel tape\n1.2\nSteel rule\n1.3\nStraight edge\n1.4\nCombination square\n1.5\nSteel square\n1.6\nDivider or trammel\n1.7\nCaliper\n1.8\nProtractor\n1.9\nVernier caliper\n1.10\nMicrometer\n2. Measurements\n2.1\nlength\n2.2\ndiameter\n2.3\ndepth\n2.4\nflatness\n2.5\nstraightness\n2.6\nsquareness\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate:\n1.1\nSelected and used measuring instruments\n1.2\nCleaned and stored measuring instruments\n2. Underpinning\nknowledge\n2.1\nTypes, purposes and accuracy of measuring instruments\n2.2\nCapability of measuring instruments\n2.3\nPart dimensions and tolerances\n2.4\nTechniques for measuring dimensions\n2.5\nCare and storage procedure of measuring tools\n3. Underpinning skills\nSafe handling of measuring tools and materials\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nTools, equipment and facilities appropriate to the activity\n4.2\nSpecimen component or part to the proposed activity\n5. Method of\nassessment\nThe following assessment methods are suggested:\n5.1\ndirect observation\n5.2\ndemonstration\n5.3\nwritten or oral short answer questions\n5.4\nportfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 26 ---\nTR - Machining NC II\n Promulgated March 2005\n\n22\nUNIT OF COMPETENCY :\nPERFORM SHOP COMPUTATIONS (INTERMEDIATE)\n\nUNIT CODE\n:\nMEE722207\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to perform calculation\ninvolving triangles and tapers.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform calculations\ninvolving triangles\n1.1\nProblems involving right triangles are performed using the\ntrigonometric functions.\n1.2\nProblems involving non-right triangles are performed using sine\nand cosine rules.\n2. Calculate taper\n2.1\nTaper of work calculated correctly using appropriate formula.\n\n--- PDF PAGE 27 ---\nTR - Machining NC II\n Promulgated March 2005\n\n23\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. trigonometric\nfunctions\n1.1 Sine\n1.2 Cosine