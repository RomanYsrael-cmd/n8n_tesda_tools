l properties of engineering\nmaterials\n3. Underpinning skills\n3.1\nSelecting materials\n3.2\nUsing measuring tools\n3.3\nOperating power hacksaw\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nTools, equipment and facilities appropriate processes of an\nactivity\n4.2\nMaterials relevant to the proposal activity\n4.3\nDrawings/plans\n5. Method of\nassessment\n\nThe following assessment activity are suggested\n5.1\nDirect observation\n5.2\nOral short answer question\n5.3\nPractical exercises\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated work\nenvironment\n\n--- PDF PAGE 22 ---\nTR - Machining NC II\n Promulgated March 2005\n\n18\nUNIT OF COMPETENCY :\nPERFORM SHOP COMPUTATIONS (BASIC)\n\nUNIT CODE\n:"
