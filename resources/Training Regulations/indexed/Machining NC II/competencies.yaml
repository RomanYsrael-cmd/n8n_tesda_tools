        "source_text": "MEE722302\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills required to setup and turn workpiece to\ndrawing specifications. It details the requirements for performing\nlathe operations such as facing and straight turning; cutting\ngrooves, drilling and boring, knurling; cutting single start external\nvee- and ACME threads; and cutting tapers using compound slide\nand formed tools.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine job\nrequirements\n1.1\nDrawings are interpreted to produce component to\nspecifications.\n1.2\nSequence of operation is determined to produce component\nto specifications.\n1.3\nCutting tools are selected according to the requirements of\nthe operation.\n2. Setup workpiece\n2.1\nWorkpiece is mounted and centered on chuck to required\nlevel of accuracy using tools and equipment in accordance\nwith worksite procedures.\n2.2\nWorkpiece is setup to required level of accuracy using\ninstruments/equipment according to work site procedures.\n2.3\nSetup operations are performed applying knowledge on safety\nprocedures and using personal protective devices.\n3. Perform turning\noperations\n3.1\nSpeeds and feeds are calculated using appropriate\nmathematical techniques and reference material.\n3.2\nLathe accessories used are appropriate to the requirements\nof the operation.\n3.3\nLathe operations are performed to produce component to\nspecifications in the drawing.\n3.4\nOperations are performed applying knowledge on safety\nprocedures and using personal protective devices.\n4. Check/Measure\nworkpiece\n4.1\nWorkpiece is checked/measured for conformance to\nspecification using appropriate techniques, measuring tools\nand equipment.\n\n--- PDF PAGE 39 ---\nTR - Machining NC II\n Promulgated March 2005\n\n35\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Drawings\nReading and interpretation\n1.1\nViews and projections\n1.2\nDrawing symbols\n1.3\nDimensions and features\n1.4\nTolerances\n2. Cutting Tools\nCutting tools used in lathe operations include:\n2.1\nTool bits\n2.1.1 High speed steel\n2.1.2 Inserts\n2.2\nDrills\n2.3\nReamers\n3. Workpiece\nWorkpiece materials used in turning operations\n3.1\nFerrous metals\n3.2\nNon-ferrous metals\n4. Setup Instruments/\nequipment\n4.1\nSurface gage\n4.2\nDial indicator on magnetic stand\n5. Lathe Accessories\n5.1\n3- and 4-jaw chucks\n5.2\nLathe centers\n5.3\nDrill chucks\n5.4\nKnurling tools\n5.5\nBoring bar\n6. Lathe Operations\nBasic lathe operations\n6.1\nfacing\n6.2\nstraight turning\n6.3\ncutting recess, shoulders, grooves and chamfers\n6.4\ndrilling, boring, counterboring, countersinking, reaming\n6.5\nknurling\n6.6\nsingle-start external vee and ACME thread cutting\n6.7\nparting-off\n6.8\ncutting external taper using compound slide or formed tool\n7. Measuring Tools\n7.1\nSteel rule\n7.2\nVernier caliper\n7.3\nMicrometer caliper\n7.4\nGages (thread, drill, surface finish, radius, screw pitch, taper)\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate:\n1.1\ndetermined job requirements\n1.2\nsetup the workpiece .\n1.3\nperformed turning operations\n1.4\nchecked/measured the workpiece\n2. Underpinning\nknowledge and\nattitude\n2.1\nShop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n\n--- PDF PAGE 40 ---\nTR - Machining NC II\n Promulgated March 2005\n\n36\n\n2.2\nDrawing interpretation\n2.2.1 Standard drawing scales, symbols and abbreviations\n2.2.2 Orthographic and isometric drawings\n2.2.3 1st and 3rd angle projections\n2.2.4 Assembly and detail drawings\n2.2.5 Interpreting tolerances, limits and fits\n2.3\nShop mathematics\n2.3.1 Basic arithmetic operations\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Applying trigonometric functions\n2.4\nMeasurements\n2.4.1 Linear measuring tools (rules, vernier, micrometer)\n2.4.2 Angle measuring tools\n2.4.3 Geometrical tolerances\n2.4.4 Dial indicator\n2.4.5 Slip gages\n2.4.6 Precision levels\n2.5\nMaterials and related science\n2.5.1 Classification and mechanical properties of engineering\nmaterials\n2.6\nLathe machine operations\n2.6.1 Lathe types and specifications\n2.6.2 Lathe parts and functions\n2.6.3 Setting cutting speed, rpm, feed rate\n2.6.4 Workholding and tool holding devices\n2.6.5 Turning tools and tool geometry\n2.6.6 Tooling, set up and parameters in turning operations\n2.6.7 Lathe accessories, fixtures and attachments\n3. Underpinning skills\n3.1\nSelecting and grinding cutting tools\n3.2\nUsing measuring instruments\n3.3\nVerifying workpiece specifications\n3.4\nComputation of feed, cutting speed and machine rpm\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nTools, equipment and facilities appropriate to processes or\nactivities\n4.2\nMaterials relevant to the proposed activity\n4.3\nDrawings, sketches or blueprint\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1\ndirect observation of lathe setting activities\n5.2\nwritten or oral short answer questions\n5.3\npractical exercises\n5.4\nidentify colleagues/clients who can be approached for the\ncollection of competency evidence, where appropriate\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 41 ---\nTR - Machining NC II\n Promulgated March 2005\n\n37\nUNIT OF COMPETENCY :\nTurn Workpiece (Intermediate)\n\nUNIT CODE\n:"
