        "source_text": "MEE722208\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to measure workpieces\nusing angular measuring instruments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select and use\nangular measuring\ntools\n1.1\nAngular measuring tools are selected and used according to\nthe level of accuracy required.\n1.2\nMeasurements taken are accurate to the finest graduation of\nthe selected measuring instrument.\n1.3\nMeasuring technique used is correct and appropriate to the\ndevice used.\n2. Maintain angular\nmeasuring tools\n2.1\nMeasuring tools are adjusted and maintained to the required\naccuracy utilizing manufacturer’s or worksite procedures.\n3. Clean and store\nmeasuring tools\n3.1\nCare and storage of devices undertaken to manufacturer’s\nspecifications or standard operating procedures.\n\n--- PDF PAGE 29 ---\nTR - Machining NC II\n Promulgated March 2005\n\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Angular measuring\ntools\nMeasuring tools include\n1.1\nBevel protractor\n1.2\nGage blocks\n1.3\nSine bar\n2. Measurements\n2.1\nangle\n2.2\ntaper\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate:\n1.1\nSelected and used angular measuring instruments\n1.2\nMaintained/adjusted instruments\n1.3\nCleaned and stored measuring instruments\n2. Underpinning\nknowledge\n2.1\nTypes, purposes and accuracy of angular measuring\ninstruments\n2.2\nCapability of measuring tools\n2.3\nTechniques for measuring angles and tapers\n2.4\nCare and storage procedure of measuring tools\n3. Underpinning skills\n3.1\nSafe handling of measuring tools and materials\n3.2\nReading vernier scale\n3.3\nReading micrometer\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nTools, equipment and facilities appropriate to the activity\n4.2\nSpecimen component or part to the proposed activity\n5. Method of\nassessment\nThe following assessment methods are suggested:\n5.1\ndirect observation\n5.2\ndemonstration\n5.3\nwritten or oral short answer questions\n5.4\nportfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 30 ---\nTR - Machining NC II\n Promulgated March 2005\n\n26\nUNIT OF COMPETENCY :\nPERFORM PREVENTIVE AND CORRECTIVE MAINTENANCE\n\nUNIT CODE\n:"
