ning NC II\n Promulgated March 2005\n\n25\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Angular measuring\ntools\nMeasuring tools include\n1.1\nBevel protractor\n1.2\nGage blocks\n1.3\nSine bar\n2. Measurements\n2.1\nangle\n2.2\ntaper\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate:\n1.1\nSelected and used angular measuring instruments\n1.2\nMaintained/adjusted instruments\n1.3\nCleaned and stored measuring instruments\n2. Underpinning\nknowledge\n2.1\nTypes, purposes and accuracy of angular measuring\ninstruments\n2.2\nCapability of measuring tools\n2.3\nTechniques for measuring angles and tapers\n2.4\nCare and storage procedure of measuring tools\n3. Underpinning skills\n3.1\nSafe handling of measuring tools and materials\n3.2\nReading vernier scale\n3.3\nReading micrometer\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nTools, equipment and facilities appropriate to the activity\n4.2\nSpecimen component or part to the proposed activity\n5. Method of\nassessment\nThe following assessment methods are suggested:\n5.1\ndirect observation\n5.2\ndemonstration\n5.3\nwritten or oral short answer questions\n5.4\nportfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 30 ---\nTR - Machining NC II\n Promulgated March 2005\n\n26\nUNIT OF COMPETENCY :\nPERFORM PREVENTIVE AND CORRECTIVE MAINTENANCE\n\nUNIT CODE\n:\nMEE722211\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills required in performing\npreventive and corrective maintenance such as inspection and\nrepair of hand tools, cleaning and lubrication of machine parts and\nchanging drive pulley and belts.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform inspection of\nmachine\n1.1\nMachine inspected according to worksite procedures.\n1.2\nStatus/Report recorded on pro-forma or reported orally\naccording to worksite procedure.\n2. Perform cleaning and\nlubricating of\nmachine\n2.1\nMachines lubricated as per manufacturer’s recommendation\nusing appropriate tools and materials\n2.2\nFluids and lubricants replaced and/or topped up according to\nprescribed schedule.\n3. Perform minor\nmachine repair and\nadjustments\n3.1\nMinor machine repairs performed according to manufacturer’s\ninstruction or worksite procedures.\n3.2\nMachine moving parts adjusted to manufacturer’s\nspecifications.\n4. Maintain hand tools\n4.1\nTool cutting ground to recommended specifications\n4.2\nHand tools lubricated and stored according to prescribed\nprocedure\n\n--- PDF PAGE 31 ---\nTR - Machining NC II\n Promulgated March 2005\n\n27\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Inspected\nInspected machine parts include:\n1.1\nV-belt\n1.2\nBearing\n1.3\nGears\n1.4\nClutch\n1.5\nDrive pulley\n2. Machines\nMachine included but not limited to:\n2.1\nLathe machine\n2.2\nMilling machine\n2.3\nGrinding machine\n3. Tools and materials\nTools and materials used include:\n3.1\nLubricants\n3.2\nOil can\n3.3\nGrease gun\n3.4\nOil\n3.5\nCoolant or compound\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that that the candidate\n1.1\nperformed inspection of machine\n1.2\nperformed cleaning and lubricating of machine\n1.3\nperformed minor machine repairs and adjustments\n2. Underpinning\nknowledge\n2.1\nProper cleaning and oiling\n2.2\nKinds of oil\n2.3\nParts and function of machine tools\n2.4\nCutting oil, coolant or compound\n2.5\nPulleys and belts\n2.6\nLocation of main switches of the machine\n2.7\nHandling and storage of tools\n2.8\nChecklist of safe working conditions\n2.9\nProcedures in cleaning and disposal of waste materials\n3. Underpinning skills\n3.1\nInspecting and repairing hand tools\n3.2\nInspecting and changing drive pulleys and belts\n3.3\nReplacing and adjusting machine parts\n3.4\nDistinguishing old and new coolant\n3.5\nDistinguishing odor of polluted coolant\n3.6\nSelecting coolant, cutting oil or compounds\n3.7\nChanging coolant\n3.8\nInspecting work area for safe working environment\n3.9\nCleaning work area\n3.10\nDisposing metal scraps, chips and waste materials.\n4. Resource\nImplications\nThe following resources MUST be provided\n4.1\nTools, equipment and facilities appropriate to processes or\nactivity\n4.2\nMaterials relevant to the proposed activity\n5. Method of\nassessment\nThe following assessment methods are suggested:\n5.1\ndirect observation of activities\n5.2\noral or written questioning\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 32 ---\nTR - Machining NC II\n Promulgated March 2005\n\n28\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\nPerform Bench Work (Basic)\n\nUNIT CODE\n:\nMEE722301\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to determine job\nrequirements, perform basic bench work operations (i.e. layout;\ncutting with hacksaw and chisel; filing; drilling; tapping etc…) and\ncheck the components for conformance to specifications.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Layout and mark\ndimensions/ features\non workpiece\n1.1\nMaterials are selected according to the requirements\nspecified in the drawing.\n1.2\nDimensions/features are laid out and marked in accordance\nwith drawing specifications using bench work tools and\nequipment.\n1.3\nLayouting and marking are performed applying knowledge on\nsafety procedures and using personal protective devices.\n2. Cut, chip and file flat,\nrectangular or round\nblocks\n2.1\nWorkpieces are clamped in workholding devices to avoid\ndamage and accidents.\n2.2\nWorkpieces are cut, chipped or filed to within tolerance\nspecified in the drawing.\n2.3\nBroken or dull hacksaw blades are replaced according to\nrequirements\n2.4\nBench work operations are performed applying knowledge\non safety procedures and using personal protective devices.\n3. Drill, ream and lap\nholes\n3.1\nHole is drilled, reamed, spot-faced and lapped to drawing\nspecification.\n3.2\nDrilling, reaming or lapping holes are performed according to\nrecommended sequence.\n3.3\nOperations are performed applying knowledge on safety\nprocedures and using personal protective devices.\n4. Cut threads using tap\nand stock and die\n4.1\nThread is cut to fit gage or mating screw, within tolerance\ngiven in the blueprint\n4.2\nThread is cut in accordance with the recommended tapping\nsequence\n4.3\nThread cutting operations are performed applying knowledge\non safety procedures and using personal protective devices.\n5. Off-hand grind cutting\ntools\n5.1\nCut edges are honed and free of burrs.\n5.2\nCutter is sharpened to conform with specifications.\n5.3\nCutters are ground using appropriate cooling agents.\n5.4\nCutting tool grinding is performed applying knowledge on\nsafety procedures and using personal protective devices.\n\n--- PDF PAGE 33 ---\nTR - Machining NC II\n Promulgated March 2005\n\n29\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMaterials used in bench work operations include\n1.1\nFerrous\n1.2\nNon Ferrous\n2. Bench work tools and\nEquipment\nEquipment and tools may include\n2.1\nDrill Press\n2.2\nPedestal Grinder\n2.3\nSurface plate\n2.4\nLayout and marking tools\n2.5\nCutting tools (hacksaw, chisel, files)\n2.6\nDrills, reamers, laps\n2.7\nThread cutting tools (taps and stock and die)\n2.8\nInspection and measuring tools (templates, vernier caliper,\nmicrometer, straight edge, gages, etc…)\n3. Workholding Devices\nWorkholding devices include the use of\n3.1\nClamps\n3.2\nVises\n4. Bench work\noperations\nBench work operations\n4.1\nLayout and marking\n4.2\nCutting\n4.3\nChipping\n4.4\nFiling\n4.5\nDrilling, boring, counterboring, spot-facing\n4.6\nLapping\n4.7\nReaming\n4.8\nThread cutting\n4.9\nOff-hand grinding\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate:\n1.1\nLaid-out and marked dimensions/features on the workpiece\n1.2\nCut, chipped and filed workpiece.\n1.3\nDrilled, reamed and lapped holes.\n1.4\nCut threads\n1.5\nPerformed off-hand grinding\n2. Underpinning\nknowledge and\nattitude\n2.1\nShop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n2.2\nDrawing/Plans\n2.2.1 Standard drawing symbols\n2.2.2 Orthographic and isometric drawings\n\n--- PDF PAGE 34 ---\nTR - Machining NC II\n Promulgated March 2005\n\n30\n\n2.3\nShop mathematics\n2.3.1 Basic arithmetic operations\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Trigonometric functions\n2.3.6 Computation of feed, cutting speed and machine rpm\n2.4\nMeasurements\n2.4.1 Linear measuring tools (rules, vernier, micrometer,\nheight gage)\n2.4.2 Geometrical tolerances\n2.5\nMaterials and related science\n2.5.1 Classification and mechanical properties of engineering\nmaterials\n2.6 Bench work\n2.6.1 Theory, use and care of hand tools for:\n2.6.2 Layout and marking tools\n2.6.3 Sawing, chipping, filing, lapping\n2.6.4 Drilling, reaming, tapping\n2.6.5 External threading\n2.6.6 Off-hand grinding\n3. Underpinning skills\n3.1\nUsing bench work tools and equipment\n3.2\nUsing measuring instruments\n3.3\nOperating drill press and grinders\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nTools, equipment and facilities appropriate to processes or\nactivity\n4.2\nMaterials relevant to the proposed activity\n4.3\nDrawings, sketches or blueprint\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1\ndirect observation of bench work activities\n5.2\nwritten or oral short answer questions\n5.3\npractical exercises\n5.4\nproject 