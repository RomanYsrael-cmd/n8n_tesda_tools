        "evidence_guide": {
          "source_text": "1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate:\n1.1\ndetermined job requirements\n1.2\nset up the workpiece .\n1.3\nperformed turning operations\n1.4\nchecked/measured the workpiece\n2. Underpinning\nknowledge\n2.1\nShop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n\n--- PDF PAGE 46 ---\nTR - Machining NC II\n Promulgated March 2005\n\n42\n\n2.2\nDrawing interpretation\n2.2.1 Alphabet of lines\n2.2.2 Drawing symbols\n2.2.3 Projections and views\n2.2.4 Fits and tolerances\n2.2.5 Surface texture\n2.2.6 Sketches and mechanical drawing\n2.3\nShop mathematics\n2.3.1 Basic arithmetic operations\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Applying trigonometric functions\n2.4\nMeasurements\n2.4.1 Linear measuring tools (rules, vernier, micrometer)\n2.4.2 Dial indicator\n2.4.3 Precision square\n2.4.4 Bevel protractor\n2.4.5 Vernier height gage\n2.5\nMaterials and related science\n2.5.1 Classification and mechanical properties of engineering\nmaterials\n2.5.2 Lubricants and coolants\n2.6\nMilling operations\n2.6.1 Milling types and specifications\n2.6.2 Milling machine parts and functions\n2.6.3 Milling cutters and holders\n2.6.4 Setting cutting speed, rpm, feed rate\n2.6.5 Workholding devices\n2.6.6 Milling machine accessories, fixtures and attachments\n3. Underpinning skills\n3.1\nSelecting and setting cutting tools\n3.2\nUsing measuring instruments\n3.3\nVerifying workpiece specifications\n3.4\nComputation of feed, cutting speed and machine rpm\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nTools, equipment and facilities appropriate to processes or\nactivities\n4.2\nMaterials relevant to the proposed activity\n4.3\nDrawings, sketches or blueprint\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1\ndirect observation of milling activities\n5.2\nwritten or oral short answer questions\n5.3\npractical exercises\n5.4\nidentify colleagues/clients who can be approached for the\ncollection of competency evidence, where appropriate\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 47 ---\nTR - Machining NC II\n Promulgated March 2005\n\n43\nUNIT OF COMPETENCY :\nMill Workpiece (Intermediate)\n\nUNIT CODE\n:"
        },
        "source_text": "MEE722303\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills required to setup and mill workpiece to\ndrawing specifications . It details the requirements for performing\nmilling operations such as drilling, boring, reaming and spot facing\nholes; milling blocks, shoulder, parallel and angled faces; milling\nslots, keys, serrations; and milling castings and circular slots and\nexternal radius.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Determine job\nrequirements\n1.1\nDrawings are interpreted to produce component to\nspecifications.\n1.2\nSequence of operation is determined to produce component\nto specifications.\n1.3\nCutting tools are selected according to the requirements of\nthe operation.\n2. Setup workpiece\n2.1\nWorkpiece is setup to required level of accuracy using\ninstruments/equipment according to work site procedures.\n2.2\nSetup operations are performed applying knowledge on safety\nprocedures and using personal protective devices.\n3. Perform milling\noperations\n3.1\nSpeeds and feeds are set to requirements of the job.\n3.2\nMilling machine accessories used are appropriate to the\nrequirements of the operation.\n3.3\nMilling operations are performed to produce component to\nspecifications in the drawing.\n3.4\nMilling operations are performed applying knowledge on\nsafety procedures and using personal protective devices.\n4. Check/Measure\nworkpiece\n4.1\nWorkpiece is checked/measured for conformance to\nspecification using appropriate techniques, measuring tools\nand equipment.\n\n--- PDF PAGE 45 ---\nTR - Machining NC II\n Promulgated March 2005\n\n41\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Cutting Tools\nCutting tools used in milling operations include:\n1.1\nDrills\n1.2\nReamers\n1.3\nSlab mills\n1.4\nEnd mills\n1.5\nShell mills\n1.6\nSide and face cutters\n1.7\nFormed cutter\n1.8\nSlitter\n1.9\nT-slot cutter\n2. Workpiece\nWorkpiece materials used in milling operations\n2.1\nFerrous\n2.2\nNon-ferrous\n3. Milling machine\naccessories\n3.1\nWorkholding devices\n3.1.1 clamps\n3.1.2 vises\n3.1.3 angle plates\n3.2\nRotary tables\n4. Milling Operations\nBasic milling operations\n4.1\ndrilling\n4.2\nboring\n4.3\nspot facing\n4.4\nmilling slot and keyways\n4.5\nmilling serrations\n4.6\nmilling vees\n4.7\nparting-off\n4.8\nmilling circular slots\n5. Safety Procedures\nShop safety involves the handling of\n5.1\nEquipment\n5.2\nTools\n5.3\nMaterials\n6. Measuring Tools\n6.1\nSteel rule\n6.2\nVernier caliper\n6.3\nMicrometer caliper\n6.4\nGages (bore, surface finish, radius, depth)\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate:\n1.1\ndetermined job requirements\n1.2\nset up the workpiece .\n1.3\nperformed turning operations\n1.4\nchecked/measured the workpiece\n2. Underpinning\nknowledge\n2.1\nShop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n\n--- PDF PAGE 46 ---\nTR - Machining NC II\n Promulgated March 2005\n\n42\n\n2.2\nDrawing interpretation\n2.2.1 Alphabet of lines\n2.2.2 Drawing symbols\n2.2.3 Projections and views\n2.2.4 Fits and tolerances\n2.2.5 Surface texture\n2.2.6 Sketches and mechanical drawing\n2.3\nShop mathematics\n2.3.1 Basic arithmetic operations\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Applying trigonometric functions\n2.4\nMeasurements\n2.4.1 Linear measuring tools (rules, vernier, micrometer)\n2.4.2 Dial indicator\n2.4.3 Precision square\n2.4.4 Bevel protractor\n2.4.5 Vernier height gage\n2.5\nMaterials and related science\n2.5.1 Classification and mechanical properties of engineering\nmaterials\n2.5.2 Lubricants and coolants\n2.6\nMilling operations\n2.6.1 Milling types and specifications\n2.6.2 Milling machine parts and functions\n2.6.3 Milling cutters and holders\n2.6.4 Setting cutting speed, rpm, feed rate\n2.6.5 Workholding devices\n2.6.6 Milling machine accessories, fixtures and attachments\n3. Underpinning skills\n3.1\nSelecting and setting cutting tools\n3.2\nUsing measuring instruments\n3.3\nVerifying workpiece specifications\n3.4\nComputation of feed, cutting speed and machine rpm\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nTools, equipment and facilities appropriate to processes or\nactivities\n4.2\nMaterials relevant to the proposed activity\n4.3\nDrawings, sketches or blueprint\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1\ndirect observation of milling activities\n5.2\nwritten or oral short answer questions\n5.3\npractical exercises\n5.4\nidentify colleagues/clients who can be approached for the\ncollection of competency evidence, where appropriate\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 47 ---\nTR - Machining NC II\n Promulgated March 2005\n\n43\nUNIT OF COMPETENCY :\nMill Workpiece (Intermediate)\n\nUNIT CODE\n:"
