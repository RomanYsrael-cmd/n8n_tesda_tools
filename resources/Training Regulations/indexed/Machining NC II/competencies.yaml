          "source_text": "1. Layout and mark \ndimensions/ features \non workpiece \n1.1 \nMaterials are selected according to the requirements \nspecified in the drawing. \n1.2 \nDimensions/features are laid out and marked in accordance \nwith drawing specifications using bench work tools and \nequipment. \n1.3 \nLayouting and marking are performed applying knowledge on \nsafety procedures and using personal protective devices. \n2. Cut, chip and file flat, \nrectangular or round \nblocks \n2.1 \nWorkpieces are clamped in workholding devices to avoid \ndamage and accidents. \n2.2 \nWorkpieces are cut, chipped or filed to within tolerance \nspecified in the drawing. \n2.3 \nBroken or dull hacksaw blades are replaced according to \nrequirements  \n2.4 \nBench work operations are performed applying knowledge \non safety procedures and using personal protective devices. \n3. Drill, ream and lap \nholes \n3.1 \nHole is drilled, reamed, spot-faced and lapped to drawing \nspecification. \n3.2 \nDrilling, reaming or lapping holes are performed according to \nrecommended sequence. \n3.3 \nOperations are performed applying knowledge on safety \nprocedures and using personal protective devices.\n4. Cut threads using tap \nand stock and die \n4.1 \nThread is cut to fit gage or mating screw, within tolerance \ngiven in the blueprint \n4.2 \nThread is cut in accordance with the recommended tapping \nsequence \n4.3 \nThread cutting operations are performed applying knowledge \non safety procedures and using personal protective devices. \n5. Off-hand grind cutting \ntools \n5.1 \nCut edges are honed and free of burrs. \n5.2 \nCutter is sharpened to conform with specifications. \n5.3 \nCutters are ground using appropriate cooling agents.  \n5.4 \nCutting tool grinding is performed applying knowledge on \nsafety procedures and using personal protective devices.\n\n--- PDF PAGE 33 ---\nTR - Machining NC II \n Promulgated March 2005 \n \n29\nRANGE OF VARIABLES \n \nVARIABLE\nRANGE\n1. Materials \nMaterials used in bench work operations include \n1.1 \nFerrous \n1.2\nNon Ferrous\n2. Bench work tools and \nEquipment \nEquipment and tools may include \n2.1 \nDrill Press \n2.2 \nPedestal Grinder \n2.3 \nSurface plate \n2.4 \nLayout and marking tools \n2.5 \nCutting tools (hacksaw, chisel, files) \n2.6 \nDrills, reamers, laps \n2.7 \nThread cutting tools (taps and stock and die) \n2.8 \nInspection and measuring tools (templates, vernier caliper, \nmicrometer, straight edge, gages, etc…)\n3. Workholding Devices \nWorkholding devices include the use of \n3.1 \nClamps \n3.2\nVises\n4. Bench work \noperations \nBench work operations \n4.1 \nLayout and marking \n4.2 \nCutting \n4.3 \nChipping \n4.4 \nFiling  \n4.5 \nDrilling, boring, counterboring, spot-facing \n4.6 \nLapping \n4.7 \nReaming \n4.8 \nThread cutting \n4.9\nOff-hand grinding"
