        "source_text": "MEE722202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to read and interpret\ndrawings and sketches.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Interpret technical\ndrawing\n1.1\nComponents, assemblies or objects recognized as required.\n1.2\nDimensions identified as appropriate.\n1.3\nInstructions identified and followed as required.\n1.4\nMaterial requirements identified as required.\n1.5\nSymbols recognized as appropriate in the drawing.\n1.6\nTolerance, limits and fits identified in the drawing.\n2. Prepare freehand\nsketch of parts\n2.1\nSketch drawn correctly and appropriately.\n2.2\nSketch depicted objects or part appropriately.\n2.3\nDimensions indicated in sketch are clear and correct.\n2.4\nInstructions included in sketch are clear and correct.\n2.5\nBase line or datum points indicated as required.\n3. Interpret details from\nfreehand sketch\n3.1\nComponents, assemblies or objects recognized as required.\n3.2\nDimensions identified as appropriate.\n3.3\nInstructions identified and followed as required.\n3.4\nMaterial requirements identified as required.\n3.5\nSymbols recognized as appropriate in the drawing.\n\n--- PDF PAGE 19 ---\nTR - Machining NC II\n Promulgated March 2005\n\n15\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Drawing\n1.1\nDrawing technique include\n1.1.1 Perspective\n1.1.2 Exploded view\n1.1.3 Hidden view technique\n1.2\nProjections\n1.2.1 First angle projections\n1.2.2\nThird angle projections\n2. Tolerance\n2.1\nGeneral tolerance\n2.2\nAngular tolerance\n2.3\nGeometric tolerance\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate:\n1.1\nInterpreted technical drawing\n1.2\nPrepared sketches\n1.3\nInterpreted sketches.\n2. Underpinning\nknowledge\n2.1\nAlphabet of lines\n2.2\nProjections\n2.3\nDrawing symbols\n2.4\nDimensioning techniques\n2.5\nTolerance, limits and fits\n2.6\nEngineering materials\n2.7\nDrawing tools and supplies\n3. Underpinning skills\n3.1\nHandling tools and drawing instruments\n3.2\nUsing measuring instruments\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nDrafting room/facilities and drafting instruments and supplies\nappropriate to the activity\n4.2\nMeasuring tools\n4.3\nDrawings, sketches or blueprint\n4.4\nSpecimen parts/components\n5. Method of\nassessment\nThe following assessment methods are suggested:\n5.1\ndirect observation\n5.2\nwritten or oral short answer questions\n5.3\ndemonstration\n5.4\nproject/work sample\n5.5\nportfolio\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 20 ---\nTR - Machining NC II\n Promulgated March 2005\n\n16\nUNIT OF COMPETENCY : SELECT/ CUT WORKSHOP MATERIALS\n\nUNIT CODE\n:"
