        "source_title": "SELECT/ CUT WORKSHOP MATERIALS",
        "source_text": "--- PDF PAGE 20 ---\nTR - Machining NC II \n Promulgated March 2005 \n \n16\nUNIT OF COMPETENCY   : SELECT/ CUT WORKSHOP MATERIALS \n \nUNIT CODE \n: \nMEE722203 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills and knowledge required to select and cut \nworkshop materials \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Determine \nrequirement \n1.1 \nPlans/ drawings are interpreted to produce component to \nspecification \n1.2 \n Sequence of operation is determined to produce component \nto specification \n2. Select and measure \nmaterials \n2.1 \nMaterials are selected according to the requirement of the \noperation \n2.2 \nMaterials are measured to required level of accuracy using \nmeasuring tools \n2.3 \nMeasuring tools are used according to manufacturers \nspecification \n3. Cut materials \n3.1 \nMaterials are cut according to plans/drawing instruction \n3.2 \nCutting tools/equipment are used based on manufacturers \nspecification, appropriate techniques or the safety procedure\n\n--- PDF PAGE 21 ---\nTR - Machining NC II \n Promulgated March 2005 \n \n17\nRANGE OF VARIABLES \n \nVARIABLE             \nRANGE\n1. Plan/drawings \n1.1 \nDimensions \n1.2\nTolerance\n2. Materials \n2.1 \nFerrous \n2.2\nNon-ferrous\n3. Measuring tools \n3.1 \nSteel rule \n3.2\nPull-push rule\n4. Cutting \ntools/equipment \n4.1 \nHacksaw \n4.2\nPower hacksaw\n5. Safety procedure \nSafety involves the handling of \n5.1 \nEquipment \n5.2 \nTools \n5.3\nMaterials\n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nevidence \nAssessment requires evidence that the candidate \n1.1 \nInterpreted plans/drawings \n1.2 \nSelected natural according to the requirement \n1.3 \nPerformed cutting operation \n1.4\nCutting tools/equipment used safely\n2. Underpinning \nknowledge and \nattitude \n2.1 \nShop safety practices \n2.1.1 Safe working habits \n2.1.2 Safe handling of tools, equipment and materials \n2.2 \nBlueprint reading \n2.2.1 Standard drawing scales, symbols and abbreviations \n2.2.2 Assembly and details of drawing \n2.2.3 Dimensions \n2.3 \nMeasurement \n2.3.1 Linear measuring tools \n2.4 \nMaterials and related science \n2.4.1 Classification and mechanical properties of engineering \nmaterials\n3. Underpinning skills \n3.1 \nSelecting materials \n3.2 \nUsing measuring tools \n3.3\nOperating power hacksaw\n4. Resource \nimplications \nThe following resources MUST be provided \n4.1 \nTools, equipment and facilities appropriate processes of an \nactivity \n4.2 \nMaterials relevant to the proposal activity \n4.3\nDrawings/plans\n5. Method of \nassessment \n \nThe following assessment activity are suggested \n5.1 \nDirect observation \n5.2 \nOral short answer question \n5.3\nPractical exercises\n6. Context of \nassessment\nCompetency may be assessed in the workplace or in simulated work \nenvironment\n",
