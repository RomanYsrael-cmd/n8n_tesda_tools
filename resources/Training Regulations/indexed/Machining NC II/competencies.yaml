        "source_text": "MEE722204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to perform basic\ncalculations using the four fundamental operation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform four\nfundamental\noperations.\n1.1\nSimple calculations performed using four fundamental\noperations.\n1.2\nSimple calculations performed involving fractions and mixed\nnumbers using four fundamental operations\n2. Perform basic\ncalculations involving\nfractions and\ndecimals\n2.1\nSimple calculations are performed involving fractions and\ndecimals using the four fundamental operations.\n2.2\nDecimal are converted into fraction (and vice versa)\naccurately.\n3. Perform basic\ncalculations involving\npercentages.\n3.1\nSimple calculations are performed to obtain percentages from\ninformation expressed in either fractional or decimal format.\n4. Perform basic\ncalculation involving\nration and proportion\n4.1\nSimple calculations are performed involving ratios and\nproportion using whole numbers, fractions and decimal\nfractions.\n5. Perform calculations\non algebraic\nexpressions\n5.1\nSimple calculations are performed on algebraic expressions\nusing the four fundamental operations.\n5.2\nSimple transposition of formulae is carried out to isolate the\nvariable required, involving the four fundamental operations.\n\n--- PDF PAGE 23 ---\nTR - Machining NC II\n Promulgated March 2005\n\n19\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Four fundamental\noperations\n1.1\nAddition\n1.2\nSubtraction\n1.3\nMultiplication\n1.4\nDivision\n2. Algebraic\nexpressions\nCalculation using formula for determining\n2.1\ntap drill size\n2.2\nfeed\n2.3\nspeed\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate performed\ncalculations:\n1.1\nusing four fundamental operations\n1.2\ninvolving fractions and mixed numbers\n1.3\ninvolving fractions and decimals\n1.4\ninvolving percentages\n1.5\ninvolving ratio and proportion\n1.6\non algebraic expressions\n1.7\nof simple formulae\n2. Underpinning\nknowledge and\nattitude\n2.1\nEnglish and metric system of measurements\n3. Underpinning skills\n3.1\nPerforming calculations using pen and paper or on a\ncalculator.\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nTools, equipment and facilities appropriate to processes or\nactivity\n4.2\nMaterials relevant to the proposed activity\n5. Method of\nassessment\nThe following assessment methods are suggested:\n5.1\nwritten or oral short answer questions\n5.2\npractical exercises\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 24 ---\nTR - Machining NC II\n Promulgated March 2005\n\n20\nUNIT OF COMPETENCY :\nMEASURE WORKPIECE (BASIC)\n\nUNIT CODE\n:"
