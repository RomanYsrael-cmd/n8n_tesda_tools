        "source_title": "Turn Workpiece (Intermediate)",
        "source_text": "--- PDF PAGE 41 ---\nTR - Machining NC II \n Promulgated March 2005 \n \n37\nUNIT OF COMPETENCY : \nTurn Workpiece (Intermediate) \n \nUNIT CODE \n: \nMEE722306   \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills required to setup and turn workpiece to \ndrawing specifications. It details the requirements for performing \nlathe operations such as cutting tapers by offsetting tailstock or \nusing taper attachment; machining components using collet chuck \nand follower rest; and cutting internal vee and internal and external \nACME threads. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Determine job \nrequirements \n1.1 \nDrawings are interpreted to produce component to \nspecifications. \n1.2 \nSequence of operation is determined to produce component \nto specifications. \n1.3 \nCutting tools are selected according to the requirements of \nthe operation.\n2. Setup workpiece \n2.1 \nWorkpiece is mounted and centered on chuck to required \nlevel of accuracy using tools and equipment in accordance \nwith worksite procedures. \n2.2 \nWorkpiece  is setup using instruments/equipment according to \nrecommended procedure. \n2.3 \nSetup operations are performed applying knowledge on safety \nprocedures and using personal protective devices.\n3. Perform turning \noperations \n3.1 \nSpeeds and feeds are calculated using appropriate \nmathematical techniques and reference material. \n3.2 \nLathe accessories used are appropriate to the requirements \nof the operation. \n3.2 \nLathe operations are performed to produce component to \nspecifications in the drawing. \n3.4 \nOperations are performed applying knowledge on safety \nprocedures and using personal protective devices.\n4. Check/Measure \nworkpiece \n4.1 \nWorkpiece is checked/measured for conformance to \nspecification using appropriate techniques, measuring tools \nand equipment.\n\n--- PDF PAGE 42 ---\nTR - Machining NC II \n Promulgated March 2005 \n \n38\nRANGE OF VARIABLES \n \nVARIABLE\nRANGE\n1. Cutting Tools \nCutting tools used in lathe operations include: \n1.1 \nHigh speed steel \n1.2 \nInserts  \n1.3\ndrills\n2. Workpiece \nWorkpiece materials used in turning operations \n2.1 \nFerrous \n2.2\nnon-ferrous\n3. Lathe Accessories \n3.1 \n3- and 4-jaw chucks \n3.2 \nface plates and weights \n3.3 \nlathe centers  \n3.4 \ndrill chucks \n3.5 \nlathe dogs \n3.6 \nboring bar \n3.7\nfollower rest\n4. Lathe Operations \nMachining operations \n4.1 \nfacing \n4.2 \nstraight turning \n4.3 \ndrilling, boring \n4.4 \nparting-off  \n4.5 \nface and turn external shapes (radii, cones) \n4.6 \nexternal square thread cutting \n4.7 \nmulti-start external thread cutting \n4.8 \ncutting taper using taper turning attachment or offset tailstock \nmethod \n4.9\nturning diameters between centers\n5. Safety Procedures \nShop safety involves the handling of \n5.1 \nEquipment \n5.2 \nTools \n5.3\nMaterials\n6. Measuring Tools \n6.1 \nSteel rule \n6.2 \nVernier caliper \n6.3 \nMicrometer caliper \n6.4 \nGages (thread, drill, depth, surface finish, radius, screw pitch, \nslip or block, taper)\n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nevidence  \nAssessment requires evidence that the candidate:   \n1.1 \ndetermined job requirements \n1.2 \nsetup the workpiece . \n1.3 \nperformed turning operations \n1.4\nchecked/measured the workpiece\n2. Underpinning \nknowledge and \nattitude  \n2.1 \nShop safety practices \n2.1.1   Safe working habits \n2.1.2   Identification of hazardous areas \n2.1.3   Protective clothing and devices \n2.1.4   Safe handling of tools, equipment and materials \n2.1.5   Housekeeping \n2.1.6   First-aid \n2.1.7   Fire extinguishers\n\n--- PDF PAGE 43 ---\nTR - Machining NC II \n Promulgated March 2005 \n \n39\n \n \n2.2 \nDrawing interpretation \n2.2.1   Standard drawing scales, symbols and abbreviations \n2.2.2   Orthographic and isometric drawings \n2.2.3   1st and 3rd angle projections \n2.2.4   Assembly and detail drawings \n2.2.5   Interpreting tolerances, limits and fits \n2.3 \nShop mathematics \n2.3.1   Basic arithmetic operations \n2.3.2   Fractions and decimals \n2.3.3   Percentages and ratios \n2.3.4   Conversion of units (English to metric) \n2.3.5   Applying trigonometric functions \n2.4 \nMeasurements \n2.4.1 Linear measuring tools (rules, vernier, micrometer) \n2.4.2 Angle measuring tools \n2.4.3 Geometrical tolerances \n2.4.4 Dial indicator \n2.4.5 Slip gages \n2.4.6 Precision levels \n2.5 \nMaterials and related science \n2.5.1   Classification and mechanical properties of engineering \nmaterials \n2.6 \nLathe machine operations  \n2.6.1   Lathe types and specifications \n2.6.2   Lathe parts and functions \n2.6.3   Setting cutting speed, rpm, feed rate \n2.6.4   Workholding and tool holding devices  \n2.6.5   Turning tools and tool geometry \n2.6.6   Tooling, set up and parameters in turning operations \n2.6.7   Lathe accessories, fixtures and attachments\n3. Underpinning skills \n3.1 \nSelecting and grinding cutting tools \n3.2 \nUsing measuring instruments \n3.3 \nVerifying workpiece specifications \n3.4   Computation of feed, cutting speed and machine rpm\n4. Resource \nimplications \nThe following resources MUST be provided \n4.1 \nTools, equipment and facilities appropriate to processes or \nactivities \n4.2 \nMaterials relevant to the proposed activity \n4.3\nDrawings, sketches or blueprint\n5. Method of \nassessment \nCompetency must be assessed through: \n5.1 \ndirect observation of lathe setting activities \n5.2 \nwritten or oral short answer questions \n5.3 \npractical exercises \n5.4 \nidentify colleagues/clients who can be approached for the \ncollection of competency evidence, where appropriate\n6. Context of \nassessment\nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
        "required_knowledge": null,
        "required_skills": null
