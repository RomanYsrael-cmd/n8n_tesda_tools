        "source_text": "MEE722207\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to perform calculation\ninvolving triangles and tapers.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform calculations\ninvolving triangles\n1.1\nProblems involving right triangles are performed using the\ntrigonometric functions.\n1.2\nProblems involving non-right triangles are performed using sine\nand cosine rules.\n2. Calculate taper\n2.1\nTaper of work calculated correctly using appropriate formula.\n\n--- PDF PAGE 27 ---\nTR - Machining NC II\n Promulgated March 2005\n\n23\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. trigonometric\nfunctions\n1.1 Sine\n1.2 Cosine\n1.3 Tangent\n1.4 Cotangent\n1.5 Secant\n1.6 Cosecant\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate performed\ncalculations:\n1.1\nInvolving right triangles\n1.2\nInvolving non-right triangles\n1.3\ninvolving tapers\n2. Underpinning\nknowledge and\nattitude\n2.1\nEnglish and metric system of measurements\n2.2\nGeometrical shapes\n3. Underpinning skills\nPerforming calculations using pen and paper or on a calculator\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nTools, equipment and facilities appropriate to processes or\nactivity\n4.2\nMaterials relevant to the proposed activity\n5. Method of\nassessment\nThe following assessment methods are suggested:\n5.1\nwritten or oral short answer questions\n5.2\npractical exercises\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 28 ---\nTR - Machining NC II\n Promulgated March 2005\n\n24\nUNIT OF COMPETENCY :\nMEASURE WORKPIECE USING ANGULAR MEASURING\nINSTRUMENTS\n\nUNIT CODE\n:"
