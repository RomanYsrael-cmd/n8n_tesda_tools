        "source_title": "PERFORM PREVENTIVE AND CORRECTIVE MAINTENANCE",
        "source_text": "--- PDF PAGE 30 ---\nTR - Machining NC II \n Promulgated March 2005 \n \n26\nUNIT OF COMPETENCY : \nPERFORM PREVENTIVE AND CORRECTIVE MAINTENANCE \n \nUNIT CODE \n: \nMEE722211 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge and skills required in performing \npreventive and corrective maintenance such as inspection and \nrepair of hand tools, cleaning and lubrication of machine parts and \nchanging drive pulley and belts. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Perform inspection of \nmachine \n1.1 \nMachine inspected according to worksite procedures. \n1.2 \nStatus/Report recorded on pro-forma or reported orally \naccording to worksite procedure.\n2. Perform cleaning and \nlubricating of \nmachine \n2.1 \nMachines lubricated as per manufacturer’s recommendation \nusing appropriate tools and materials \n2.2 \nFluids and lubricants replaced and/or topped up according to \nprescribed schedule. \n3. Perform minor \nmachine repair and \nadjustments \n3.1 \nMinor machine repairs performed according to manufacturer’s \ninstruction or worksite procedures. \n3.2 \nMachine moving parts adjusted to manufacturer’s \nspecifications.\n4. Maintain hand tools \n4.1 \nTool cutting ground to recommended specifications  \n4.2 \nHand tools lubricated and stored according to prescribed \nprocedure\n\n--- PDF PAGE 31 ---\nTR - Machining NC II \n Promulgated March 2005 \n \n27\nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1.  Inspected  \nInspected machine parts include: \n1.1 \nV-belt \n1.2 \nBearing \n1.3 \nGears \n1.4 \nClutch  \n1.5\nDrive pulley\n2.  Machines \nMachine included but not limited to: \n2.1 \nLathe machine \n2.2 \nMilling machine \n2.3\nGrinding machine\n3. Tools and materials \nTools and materials used include: \n3.1 \nLubricants \n3.2 \nOil can \n3.3 \nGrease gun \n3.4 \nOil \n3.5\nCoolant or compound\n \nEVIDENCE GUIDE \n \n \n1. Critical aspects of \nevidence \nAssessment requires evidence that that the candidate \n1.1 \nperformed inspection of machine \n1.2 \nperformed cleaning and lubricating of machine \n1.3\nperformed minor machine repairs and adjustments\n2. Underpinning \nknowledge \n2.1  \nProper cleaning and oiling \n2.2  \nKinds of oil \n2.3  \nParts and function of machine tools \n2.4  \nCutting oil, coolant or compound \n2.5  \nPulleys and belts \n2.6  \nLocation of main switches of the machine \n2.7  \nHandling and storage of tools \n2.8  \nChecklist of safe working conditions \n2.9\nProcedures in cleaning and disposal of waste materials\n3. Underpinning skills \n3.1 \nInspecting and repairing hand tools \n3.2 \nInspecting and changing drive pulleys and belts \n3.3 \nReplacing and adjusting machine parts \n3.4 \nDistinguishing old and new coolant \n3.5 \nDistinguishing odor of polluted coolant \n3.6 \nSelecting coolant, cutting oil or compounds \n3.7 \nChanging coolant \n3.8 \nInspecting work area for safe working environment \n3.9 \nCleaning work area \n3.10\nDisposing metal scraps, chips and waste materials.\n4. Resource \nImplications \nThe following resources MUST be provided \n4.1 \nTools, equipment and facilities appropriate to processes  or \nactivity \n4.2\nMaterials relevant to the proposed activity\n5. Method of \nassessment \nThe following assessment methods are suggested: \n5.1 \ndirect observation of activities \n5.2\noral or written questioning\n6. Context of \nassessment\nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
