        "evidence_guide": {
          "source_text": "1. Critical aspects of\nevidence\nAssessment requires evidence that the candidate:\n1.1\ndetermined job requirements\n1.2\nsetup the workpiece .\n1.3\nperformed turning operations\n1.4\nchecked/measured the workpiece\n2. Underpinning\nknowledge and\nattitude\n2.1\nShop safety practices\n2.1.1 Safe working habits\n2.1.2 Identification of hazardous areas\n2.1.3 Protective clothing and devices\n2.1.4 Safe handling of tools, equipment and materials\n2.1.5 Housekeeping\n2.1.6 First-aid\n2.1.7 Fire extinguishers\n\n--- PDF PAGE 40 ---\nTR - Machining NC II\n Promulgated March 2005\n\n36\n\n2.2\nDrawing interpretation\n2.2.1 Standard drawing scales, symbols and abbreviations\n2.2.2 Orthographic and isometric drawings\n2.2.3 1st and 3rd angle projections\n2.2.4 Assembly and detail drawings\n2.2.5 Interpreting tolerances, limits and fits\n2.3\nShop mathematics\n2.3.1 Basic arithmetic operations\n2.3.2 Fractions and decimals\n2.3.3 Percentages and ratios\n2.3.4 Conversion of units (English to metric)\n2.3.5 Applying trigonometric functions\n2.4\nMeasurements\n2.4.1 Linear measuring tools (rules, vernier, micrometer)\n2.4.2 Angle measuring tools\n2.4.3 Geometrical tolerances\n2.4.4 Dial indicator\n2.4.5 Slip gages\n2.4.6 Precision levels\n2.5\nMaterials and related science\n2.5.1 Classification and mechanical properties of engineering\nmaterials\n2.6\nLathe machine operations\n2.6.1 Lathe types and specifications\n2.6.2 Lathe parts and functions\n2.6.3 Setting cutting speed, rpm, feed rate\n2.6.4 Workholding and tool holding devices\n2.6.5 Turning tools and tool geometry\n2.6.6 Tooling, set up and parameters in turning operations\n2.6.7 Lathe accessories, fixtures and attachments\n3. Underpinning skills\n3.1\nSelecting and grinding cutting tools\n3.2\nUsing measuring instruments\n3.3\nVerifying workpiece specifications\n3.4\nComputation of feed, cutting speed and machine rpm\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nTools, equipment and facilities appropriate to processes or\nactivities\n4.2\nMaterials relevant to the proposed activity\n4.3\nDrawings, sketches or blueprint\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1\ndirect observation of lathe setting activities\n5.2\nwritten or oral short answer questions\n5.3\npractical exercises\n5.4\nidentify colleagues/clients who can be approached for the\ncollection of competency evidence, where appropriate\n6. Context of\nassessment\nCompetency may be assessed in the workplace or in simulated\nworkplace environment.\n\n--- PDF PAGE 41 ---\nTR - Machining NC II\n Promulgated March 2005\n\n37\nUNIT OF COMPETENCY :\nTurn Workpiece (Intermediate)\n\nUNIT CODE\n:"
