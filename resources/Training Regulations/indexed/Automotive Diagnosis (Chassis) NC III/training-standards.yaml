      "source_text": "NEW TRAINER\n\n● Holder of National TVET Trainers Certificate (NTTC) Level 1 in Automotive\nDiagnosis (Chassis) NC III or Automotive Servicing NC IV; and\n● Must have at least 1-year industry experience on Automotive Diagnosis\nwithin the last 3 years.\n\nEXISTING TRAINER\n\n● Holder of National TVET Trainers Certificate (NTTC) Level 1 in Automotive\nDiagnosis (Chassis) NC III or Automotive Servicing NC IV; and\n● Must have industry immersion of 80 hours annually (industry training which\nincludes structured training program inclusive of hands-on activities,\nobservation in a workshop, and training certificates with number of hours).\n\n3.6\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidence to determine the\nachievements of the requirements of the qualification to enable the trainer to make\njudgment whether the trainee is competent or not yet competent.",
