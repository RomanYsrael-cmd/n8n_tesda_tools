      "source_text": "3.5\nTRAINING FACILITIES\n\n--- PDF PAGE 164 ---\nAutomotive Diagnosis (Chassis) NC III - ALTADC324 Promulgated (11/13/2024) 160\n\nAUTOMOTIVE DIAGNOSIS (CHASSIS) NC III\n\nBased on a class intake of 25 learners/trainees.\n\nSPACE\nREQUIREMENT\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ. METERS\nA. Building\n(permanent)\n\n● Lecture Room\n5 x 6\n30.00\n30.00\n● Workshop/\nLaboratory area\n(Work bay)\n4 x 7\n28 x 2\n56.00\n● Storage Area (Tool\nroom & S/M\nstorage area)\n\n20\n20.00\n● Learning Resource\nCenter\n5 x 4\n20.00\n20.00\n● Wash area/ comfort\nroom\n(Male, Female,\nPWD)\n\n12\n12.00\nTOTAL\n\n138.00\nNote: Access to and use of equipment and facilities can be provided through cooperative\narrangements of MOA with other partner enterprises/organizations/institutions.\n\n3.6\nTRAINERS’ QUALIFICATIONS\n\nNEW TRAINER\n\n● Holder of National TVET Trainers Certificate (NTTC) Level 1 in Automotive\nDiagnosis (Chassis) NC III or Automotive Servicing NC IV; and\n● Must have at least 1-year industry experience on Automotive Diagnosis\nwithin the last 3 years.\n\nEXISTING TRAINER\n\n● Holder of National TVET Trainers Certificate (NTTC) Level 1 in Automotive\nDiagnosis (Chassis) NC III or Automotive Servicing NC IV; and\n● Must have industry immersion of 80 hours annually (industry training which\nincludes structured training program inclusive of hands-on activities,\nobservation in a workshop, and training certificates with number of hours).\n\n3.6\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidence to determine the\nachievements of the requirements of the qualification to enable the trainer to make\njudgment whether the trainee is competent or not yet competent."
