    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title:\nAUTOMOTIVE DIAGNOSIS\n(CHASSIS)\nNC Level\nNC III\n\nNominal Training Duration:\n\n40 Hours (Basic Competencies)\n\n162 Hours (Common Competencies)\n\n170 Hours (Core Competencies)\n\n372 TOTAL HOURS\n\n150 SIL\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive diagnosis in accordance with industry standards. It\ncovers core competencies such as: diagnose and repair of electronically controlled\ntransmission; diagnose and repair of continuously variable transmission; diagnose and\nrepair of vehicle dynamics integrated management; diagnose and repair of electronic\n4-wheel drive control system; diagnose and repair of electronic 4-wheel drive\nassembly; and diagnose and repair electric power steering.\n\nThis course is also designed to enhance the basic and common knowledge,\nskills and attitudes of an individual in the field of automotive diagnosis.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 127 ---\nAutomotive Diagnosis (Chassis) NC III - ALTADC324 Promulgated (11/13/2024) 123\n\nBASIC COMPETENCIES\n40 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1.1 Read\n● Lecture\n● Written Test\n2 