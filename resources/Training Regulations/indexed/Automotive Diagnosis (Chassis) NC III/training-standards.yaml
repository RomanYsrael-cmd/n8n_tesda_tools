  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for AUTOMOTIVE DIAGNOSIS\n(CHASSIS) NC III.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\nthe curricula.\n\nCourse Title:\nAUTOMOTIVE DIAGNOSIS\n(CHASSIS)\nNC Level\nNC III\n\nNominal Training Duration:\n\n40 Hours (Basic Competencies)\n\n162 Hours (Common Competencies)\n\n170 Hours (Core Competencies)\n\n372 TOTAL HOURS\n\n150 SIL\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive diagnosis in accordance with industry standards. It\ncovers core competencies such as: diagnose and repair of electronically controlled\ntransmission; diagnose and repair of continuously variable transmission; diagnose and\nrepair of vehicle dynamics integrated management; diagnose and repair of electronic\n4-wheel drive control system; diagnose and repair of electronic 4-wheel drive\nassembly; and diagnose and repair electric power steering.\n\nThis course is also designed to enhance the basic and common knowledge,\nskills and attitudes of an individual in the field of automotive diagnosis.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 127 ---\nAutomotive Diagnosis (Chassis) NC III - ALTADC324 Promulgated (11/13/2024) 123\n\nBASIC COMPETENCIES\n40 Hours\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead workplace\ncommunication\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses\n1.1.1 Read\n● Lecture\n● Written Test\n2 Hours\no Effective verbal communication\nmethods\n\no Sources of information\n\n1.1.2 Practice organizing information\n● Demonstration\n● Observation\n\n1.1.3 Identify organization\nrequirements for written and\nelectronic communication methods\n● Lecture\n● Written Test\n\n1.1.4 Follow organization\nrequirements for the use of written\nand electronic communication\nmethods\n● Demonstration\n● Practical exercises\n● Observation\n\n1.1.5 Perform exercises on\nunderstanding and conveying\nintended meaning scenario\n● Demonstration\n● Role Play\n● Observation\n\n1.2 Lead workplace\ndiscussions\n1.2.1 Describe:\n● Organizational policy on\nproduction, quality and safety\n● Group discussion\n● Oral evaluation\n2 Hours\n\n● Goals/ objectives and action plan\nsetting\n\n1.2.2 Read\n● Lecture\n● Written Test\n\n● Effective verbal communication\nmethods\n\n1.2.3 Prepare/set action plans based\non organizational goals and\nobjectives\n● Demonstration\n● Observation\n\n--- PDF PAGE 128 ---\nAutomotive Diagnosis (Chassis) NC III - ALTADC324 Promulgated (11/13/2024) 124\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n1.3 Identify and\ncommunicate\nissues arising in\nthe workplace\n1.2.4 Describe:\n● Organizational policy in dealing\nwith issues and problems\n● Group discussion\n● Oral evaluation\n2 Hours\n\n1.2.5 Read\n● Lecture\n● Written Test\n\n● Effective verbal communication\nmethods\n\n2. Lead small teams\n2.1 Provide team\nleadership\n\n2.1.1 Discussion of Company policies\nand procedures\n2.1.2 Read web pages on situational\nleadership\n2.1.3Role play on situational\nleadership\n● Group work\n● Role Play\n● Lecture/\nDiscussion\n● Individual Work\n● Role Play\n● Written Test\n1 hour\n\n2.2 Assign\nresponsibilities\n2.2.1 Read web pages on\nperformance management\n2.2.2 Case study on allocating roles\nand responsibilities based on\ncompetencies of current staff\n● Individual Work\n● Case Study\n● Role Play\n● Written Test\n1 hour\n\n2.3 Set\nperformance\nexpectations for\nteam members\n2.3.1 Role play to communicate\nperformance expectations with\nstaff\n2.3.2 Discussion on performance\nissues\n● Lecture/\nDiscussion\n● Role Play\n● Role Play\n● Written Test\n1 hour\n\n2.4 Supervise team\nperformance\n2.4.1 Discussion on performance\nmonitoring\n2.4.2 Role play on providing feedback\non performance\n2.4.3 Role play on performance\ncoaching\n2.4.4 Discussion on keeping the team\ninformed of team performance\n● Lecture/\nDiscussion\n● Role Play\n● Case Study\n● Role Play\n● Written Test\n1 hour\n\n--- PDF PAGE 129 ---\nAutomotive Diagnosis (Chassis) NC III - ALTADC324 Promulgated (11/13/2024) 125\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2.4.5 Case study on Team\nperformance monitoring and\nfeedback\n3. Apply critical\nthinking and\nproblem-solving\ntechniques in the\nworkplace\n3.1 Examine specific\nworkplace\nstrategies\n3.1.1 Show thorough knowledge and\nunderstanding of the process,\nnormal operating parameters,\nand product quality to\nrecognize non-standard\nsituations\n3.1.2 Show mastery of the current\nindustry hardware and software\nproducts and services\n3.1.3 Discuss process of identification\nof fundamental causes of\nspecific workplace challenges\n3.1.4 Show mastery of knowledge and\nunderstanding of the process,\nnormal operating parameters,\nand product quality to\nrecognize non-standard\nsituations\n● Relevant equipment and\noperational processes\n● Enterprise goals, targets and\nmeasures\n● Enterprise quality OHS and\nenvironmental requirement\n● Enterprise information\nsystems and data collation\n● Industry codes and\nstandards\n● Group discussion\n● Lecture\n● Demonstration\n● Role playing\n● Case Formulation\n● Life Narrative\nInquiry (Interview)\n● Standardized test\n1 hour\n\n--- PDF PAGE 130 ---\nAutomotive Diagnosis (Chassis) NC III - ALTADC324 Promulgated (11/13/2024) 126\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.2 Analyze the\ncauses of\nspecific\nworkplace\nchallenges\n\n3.2.1 Show thorough knowledge and\nunderstanding of the process,\nnormal operating parameters,\nand product quality to recognize\nnon-standard situations\n3.2.2 Show mastery of the current\nindustry hardware and software\nproducts and services\n3.2.3 Discuss process of identification\nof fundamental causes of\nspecific workplace challenges\n3.2.4 Show mastery of knowledge\nand understanding of the\nprocess, normal operating\nparameters, and product quality\nto recognize non-standard\nsituations\n● Relevant equipment and\noperational processes\n● Enterprise goals, targets and\nmeasures\n● Enterprise quality OHS and\nenvironmental requirement\n● Enterprise information\nsystems and data collation\n● Industry codes and standards\n3.2.5 Identify extent and causes of\nspecific challenges in the\nworkplace\n3.2.6 Use of range of analytical\nproblem-solving techniques\n● Group discussion\n● Lecture\n● Demonstration\n● Role playing\n● Case Formulation\n● Life Narrative\nInquiry (Interview)\n● Standardized test\n1 hour\n\n--- PDF PAGE 131 ---\nAutomotive Diagnosis (Chassis) NC III - ALTADC324 Promulgated (11/13/2024) 127\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n3.2.7 Formulate clear-cut findings on\nthe nature of each identified\nworkplace challenges\n\n3.3 Formulate\nresolutions to\nspecific\nworkplace\nchallenges\n3.3.1 Show thorough knowledge and\nunderstanding of the process,\nnormal operating parameters,\nand product quality to