      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the national qualification of AUTOMOTIVE DIAGNOSIS (CHASSIS) NC III, the candidate must demonstrate competence in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 Assessment shall cover all competencies with basic and common integrated or assessed concurrently with the core units of competency. 4.1.3 The following are qualified to apply for assessment and certification, as long as they are holders of National Certificate in the amended Automotive Servicing (Chassis Repair) NC II: 4.1.3.1 Graduates of WTR-registered program on Automotive Diagnosis (Chassis) NC III, or graduates of NTR programs or formal/non-formal/informal including enterprise-based training programs related to automotive servicing (chassis repair); or 4.1.3.2 Candidates who gained competencies in implementing automotive chassis diagnosis on vehicle through informal training or previous work experiences. For informal training, a certification from any government agency or LGU or Barangay indicating the competencies of an individual. For work experience, a certificate of Employment and Job Description must be provided as proof. 4.1.4 Current holders of National Certificate (NC) and Certificate of Competency (COC) in AUTOMOTIVE SERVICING NC III shall have to undergo reassessment in the amended Training Regulations upon expiration of their Certificates. Candidate must be a holder of National Certificate in the amended Automotive Servicing (Chassis Repair) NC II. 4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through competency based on the current TESDA circular and/or implementing guidelines on portfolio assessment and RPL. Automotive Diagnosis (Chassis) NC III - ALTADC324 Promulgated (11/13/2024) 162 4.1.6 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations. It includes the following: a. entry requirements for candidates b. evidence gathering methods c. qualification requirements of competency assessors d. specific assessment and certification arrangements as by industry."
