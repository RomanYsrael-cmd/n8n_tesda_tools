  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n--- PDF PAGE 165 ---\nAutomotive Diagnosis (Chassis) NC III - ALTADC324 Promulgated (11/13/2024) 161\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is\nto confirm that an individual can perform to the standards expected at the workplace\nas expressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the\nnational qualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the national qualification of AUTOMOTIVE DIAGNOSIS\n(CHASSIS) NC III, the candidate must demonstrate competence in all\nunits listed in Section 1. Successful candidates shall be awarded a\nNational Certificate signed by the TESDA Director General.\n\n4.1.2 Assessment shall cover all competencies with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.1.3 The following are qualified to apply for assessment and certification, as\nlong as they are holders of National Certificate in the amended\nAutomotive Servicing (Chassis Repair) NC II:\n\n4.1.3.1 Graduates\nof\nWTR-registered\nprogram\non\nAutomotive\nDiagnosis (Chassis) NC III, or graduates of NTR programs or\nformal/non-formal/informal including enterprise-based training\nprograms related to automotive servicing (chassis repair); or\n\n4.1.3.2 Candidates who gained competencies in implementing\nautomotive chassis diagnosis on vehicle through informal\ntraining or previous work experiences. For informal training, a\ncertification from any government agency or LGU or Barangay\nindicating the competencies of an individual. For work\nexperience, a certificate of Employment and Job Description\nmust be provided as proof.\n\n4.1.4 Current holders of National Certificate (NC) and Certificate of\nCompetency (COC) in AUTOMOTIVE SERVICING NC III shall have to\nundergo reassessment in the amended Training Regulations upon\nexpiration of their Certificates. Candidate must be a holder of National\nCertificate in the amended Automotive Servicing (Chassis Repair) NC II.\n\n4.1.5 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life\nexperiences may apply for recognition in a particular qualification\nthrough competency based on the current TESDA circular and/or\nimplementing guidelines on portfolio assessment and RPL.\n\n--- PDF PAGE 166 ---\nAutomotive Diagnosis (Chassis) NC III - ALTADC324 Promulgated (11/13/2024) 162\n4.1.6 The industry shall determine assessment and certification requirements\nfor each qualification with promulgated Training Regulations. It includes\nthe following:\na. entry requirements for candidates\nb. evidence gathering methods\nc. qualification requirements of competency assessors\nd. specific assessment and certification arrangements as by industry.\n\n4.2\nCompetency Assessment Requisite\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before\nthey are authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to assess\nthe competencies of candidates for National Certification.\n\n--- PDF PAGE 167 ---\nAutomotive Diagnosis (Chassis) NC III - ALTADC324 Promulgated (11/13/2024) 163\n\n"
}
