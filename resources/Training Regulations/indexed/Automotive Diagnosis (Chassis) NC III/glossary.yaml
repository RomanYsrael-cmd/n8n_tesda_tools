      "term": "Occupational Safety and Health Standard",
      "definition": "9. Out of standard worn-out, unserviceable components, not conforming to manufacturer’s standard. 10. Overhaul take apart a major automobile component in order to examine it and repair/replace a part if necessary to bring back the major component to working condition. 11. Repair fix or return to working condition a part/component. It refers to cleaning, adjustment, and replacement. 12. Service the act of rendering maintenance service and repair/replacement of parts of an automobile to keep it in top condition. 13. Wheel alignment part of standard automobile maintenance that consists of adjusting the angles of wheels so that they conform to manufacturer’s standard. 14. Wheel balance describes the distribution of mass within an automobile tire or the entire wheel (including the rim) to which it is attached."
