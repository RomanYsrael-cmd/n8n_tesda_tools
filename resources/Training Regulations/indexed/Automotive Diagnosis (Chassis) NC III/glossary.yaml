  "source_text": "1. Adjustment\na small alteration or movement made to achieve a\ndesired fit, appearance, or result.\n\n2. Diagnose\nidentify the nature of problem by inspection of the\nsymptoms.\n\n3. Diagnostic\nsymptoms\na physical manifestation that is regarded as indicating a\ncondition of malfunction.\n\n4. Evaluation of\ncomponents\nthe making of a judgment about the condition of a\npart/component.\n\n5. Final inspection\nIncludes road testing, oil leakage and functionality\n\n6. Initialization\nThe process of the user specifying initialization valued is\nsometimes called configuration\n7. Maintenance\nthe regular or periodic maintenance servicing of vehicles\nto keep it in top condition.\n\n8. OSHS\nOccupational Safety and Health Standard\n9. Out of standard\nworn-out, unserviceable components, not conforming to\nmanufacturer’s standard.\n\n10. Overhaul\ntake apart a major automobile component in order to\nexamine it and repair/replace a part if necessary to bring\nback the major component to working condition.\n\n11. Repair\nfix or return to working condition a part/component. It\nrefers to cleaning, adjustment, and replacement.\n\n12. Service\nthe act of rendering maintenance service and\nrepair/replacement of parts of an automobile to keep it in\ntop condition.\n\n13. Wheel alignment\npart of standard automobile maintenance that consists of\nadjusting the angles of wheels so that they conform to\nmanufacturer’s standard.\n\n14. Wheel balance\ndescribes the distribution of mass within an automobile\ntire or the entire wheel (including the rim) to which it is\nattached.\n\n--- PDF PAGE 170 ---\nAutomotive Diagnosis (Chassis) NC III - ALTADC324 Promulgated (11/13/2024) 166",
