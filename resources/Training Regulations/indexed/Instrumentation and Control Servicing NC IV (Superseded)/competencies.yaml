          "source_text": "1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. \nInterpreted work instructions according to job \nrequirements. \n1.2. \nApplied the appropriate/correct procedures in \ncommissioning instrumentation and control system \n1.3. \nChecked the commissioned instrumentation and \ncontrol systems to insure safety \n1.4. \nDocumented the tasks undertaken \n2. Underpinning \nknowledge \nInclude but not limited to: \n2.1. \nOccupational health and safety \n2.2. \nInstrumentation & Control standards \n2.3. \nUse of tools \n2.4. \nMathematical calculations \n2.5. \nElectrical theory \n2.6. \nElectronics theory \n2.7. \nUse of test equipment and calibrators \n2.8. \nWiring techniques \n2.9. \nDrawing interpretation \n2.10. Soldering techniques \n2.11. Principles of Instrumentation \n2.12. Process variable measurements (pressure, level, \nflow, temperature, analysis, etc.) \n2.13. Process Control Theory \n2.14. Process Control System (single-loop & multi-loop \ncontrollers, DCS, DAS, SCADA, etc) \n2.15.  Sensors, transmitters, transducers & converters \n2.16. Programmable logic controllers \n2.17. Control valves and final control elements \n2.18. Computer operations \n2.19. Process and machinery operation \n3. Underpinning skills \n3.1. \nReading skills required to interpret work \ninstructions \n3.2. \nCommunication skills needed to interpret and \ndefine work procedures \n3.3. \nSelection & use of proper tools & equipment \n3.4. \nStart-up & commissioning skills  \n3.5. \nProblem solving in unplanned events\n\n--- PDF PAGE 48 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  INSTRUMENTATION AND CONTROL SERVICING NC IV   \n \n \n        Page 46  \n \n \n4. Method of assessment \nThe assessor may select at least three of the following \nassessment methods to objectively assess the candidate: \n4.1. \nObservation \n4.2. \nQuestioning \n4.3. \nThird Party \n4.4. \nPortfolio \n5. Resource Implication \n5. Include but not limited to: \n5.1. \nInstrumentation & Control devices \n5.2. \nTools  \n5.3. \nTest equipment and calibrators \n5.4. \nMaterials  \n5.5. \nPPE \n5.6. \nTechnical manuals \n5.7. \nInstrumentation & Control drawings \n6. Context of Assessment \n6.1. \nAssessment may be conducted in the workplace or \nin a simulated work environment",
