        "source_title": "DIAGNOSE AND TROUBLESHOOT INSTRUMENTATION AND CONTROL SYSTEMS",
        "source_text": "--- PDF PAGE 49 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  INSTRUMENTATION AND CONTROL SERVICING NC IV   \n \n \n        Page 47  \n \n \nUNIT TITLE \n: \nDIAGNOSE AND TROUBLESHOOT INSTRUMENTATION \nAND CONTROL SYSTEMS \nUNIT CODE \n: \nELC724307 \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes needed to \ndiagnose and troubleshoot defects in instrumentation and control \nsystems. \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated in the Range of Variables\n1. Plan and prepare for \ndiagnosis of faults of \ninstrumentation and \ncontrol systems  \n1.1. \nDiagnosis of faults is planned and prepared in line \nwith job requirements \n1.2. \nOH & S policies and procedures are followed in \nline with job requirements \n1.3. \nInstrumentation and Control standards are \nfollowed in line with the job requirements \n1.4. \nAppropriate personnel are consulted to ensure that \nthe work is effectively coordinated \n1.5. \nMaterials necessary to complete the work are \nobtained in accordance with established \nprocedures and checked against job requirements \n1.6. \nTools, equipment and testing devices needed to \ncarry out the work are obtained in accordance with \nestablished procedures and checked for proper \noperation and safety. \n1.7. \nInstrumentation and control systems defects \nare checked against job requirements.\n2. Diagnose faults of \ninstrumentation and \ncontrol systems \n2.1. \nAppropriate personal protective equipment is \nused in line with standard procedures. \n2.2. \nFaults or problems in the instrumentation and \ncontrol systems are diagnosed according to \nrequirements and in line with the standard \nprocedures. \n2.3. \nContingency measures are managed and \nimplemented in accordance with established \nprocedures  \n2.4. \nUnplanned events or conditions are responded to \nin accordance with established procedures\n3. Rectify/correct defects \nin instrumentation and \ncontrol systems \n3.1. \nAppropriate personal protective equipment is used \nin line with standard procedures. \n3.2. \nSystems and associated equipment are isolated \nwhere necessary, in accordance with established \nprocedures \n3.3. \nAdjustments, if necessary are made in accordance \nwith established procedures \n3.4. \nDefective components or parts are replaced or \ncorrected without damage to the surrounding \nenvironment or services \n3.5. \nUnplanned events or conditions are responded to \nin accordance with established procedures.\n\n--- PDF PAGE 50 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  INSTRUMENTATION AND CONTROL SERVICING NC IV   \n \n \n        Page 48  \n \n \n \n4. Test diagnosed & \ncorrected \nInstrumentation & \nControl systems  \n4.1. \nInstrumentation & control systems are tested to \nensure safe operation.  \n4.2. \nInstrumentation & control systems are tested using \nstandard testing procedures  \n4.3. \nUnplanned events or conditions are responded to \nin accordance with established procedures. \n4.4. \nReport/s are prepared and completed according to \ncompany policy\n\n--- PDF PAGE 51 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  INSTRUMENTATION AND CONTROL SERVICING NC IV   \n \n \n        Page 49  \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. OH & S policies and \nprocedures\n1.1. \nOH & S guidelines \n1.2.\nPhilippine environmental standards\n2. Instrumentation and \nControl Standards \nInclude but not limited to: \n2.1. \nISA (Instrumentation, Systems and Automation) \nSociety (formerly Instrument Society of America) \n2.2. \nANSI(American National Standards Institute) \n2.3. \nASME (American Society of Mechanical Engineers) \n2.4. \nNEC (National Electrical Code) \n2.5.\nIEC (International Electrotechnical Commission)\n3. Materials \nInclude but not limited to: \n3.1. \nSealing materials \n3.2. \nPipes/tubes & fittings \n3.3.\nWires and cables\n4. Tools \nTools for: cutting, shaping, drilling, threading, tapping, \nfinishing, dismantling/assembling.  Tool set include but not \nlimited to: \n4.1. \nPliers (assorted) \n4.2. \nScrew drivers (assorted) \n4.3. \nSoldering iron/gun \n4.4.\nWrenches\n5. Equipment/testing devices \n5.1. \nEquipment include but not limited to: \n5.1.1. Communication equipment (e.g. 2-way radio, \ncell phone) \n5.1.2. Configurator or programmer \n5.2. \nTesting devices includes but not limited to: \n5.2.1. Multimeter \n5.2.2. Calibrators \n5.2.3. Signal generators \n5.2.4. Oscilloscope\n6. Instrumentation and \nControl Systems \nInclude a combination of the following but not limited to: \n6.1. \nPressure measurement and Control loop \n6.2. \nLevel measurement and control loop \n6.3. \nFlow measurement and control loop \n6.4. \nTemperature measurement and control loop \n6.5.\nAnalytical measurement and control loop\n7. Personal protective \nequipment \nIncludes the following but \nnot limited to: \n7.1. \nEar muffs/plugs \n7.2. \nGoggles/glasses/fac\ne shield \n7.3. \nSafety hat \n7.4.\nSafety apparel/suit\n \n7.5. \nSafety belt/harness \n7.6. \nSafety shoes  \n7.7. \nMask  \n7.8. \nGloves \n8. Faults or problems \n8.1. \nmechanical \n8.2. \nelectrical \n8.3. \nelectronics \n8.4. \ncomputer-based\n\n--- PDF PAGE 52 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  INSTRUMENTATION AND CONTROL SERVICING NC IV   \n \n \n        Page 50  \n \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. \nInterpreted work instructions according to job \nrequirements. \n1.2. \nAccurately diagnosed the defects in the \ninstrumentation and control systems \n1.3. \nProperly adjusted/corrected the Instrumentation & \nControl systems identified \n1.4. \nChecked the diagnosed & corrected systems to \ninsure safety \n1.5.\nDocumented the tasks undertaken\n2. Underpinning \nknowledge \nIncludes but not limited to: \n2.1. \nOccupational health and safety \n2.2. \nInstrumentation & Control standards \n2.3. \nUse of tools \n2.4. \nMathematical calculations \n2.5. \nElectrical theory \n2.6. \nElectronics theory \n2.7. \nUse of test equipment and calibrators \n2.8. \nWiring techniques \n2.9. \nDrawing interpretation \n2.10. Soldering techniques \n2.11. Principles of Instrumentation \n2.12. Process variable measurements (pressure, level, \nflow, temperature, analysis, etc.) \n2.13. Process Control Theory \n2.14. Process Control System (single-loop & multi-loop \ncontrollers, DCS, DAS, SCADA, etc)  \n2.15. Sensors, transmitters, transducers & converters \n2.16. Programmable logic controllers \n2.17. Control valves and final control elements \n2.18. Computer operations \n2.19. Process and machinery operation \n2.20. Preventive & predictive maintenance procedures\n3. Underpinning skills \n3.1. Reading skills required to interpret work instructions \n3.2. Communication skills needed to interpret and define \nwork procedures \n3.3. Selection & use of proper tools & equipment \n3.4. System diagnostics & troubleshooting skills \n3.5.\nProblem solving in unplanned events.\n4. Method of assessment \nThe assessor may select at least three of the following \nassessment methods to objectively assess the candidate: \n4.1. \nObservation \n4.2. \nDemonstration \n4.3. \nQuestioning \n4.4. \nThird Party \n4.5.\nPortfolio\n\n--- PDF PAGE 53 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  INSTRUMENTATION AND CONTROL SERVICING NC IV   \n \n \n        Page 51  \n \n5. Resource Implication \nIncludes but not limited to: \n5.1. \nInstrumentation & Control devices \n5.2. \nTools  \n5.3. \nTest equipment, calibrators, configurator or \nprogrammer \n5.4. \nMaterials  \n5.5. \nPPE \n5.6. \nTechnical manuals \n5.7. \nInstrumentation & Control drawings \n6. Context of Assessment 6.1. \nAssessment may be conducted in the workplace or \nin a simulated work environment\n",
