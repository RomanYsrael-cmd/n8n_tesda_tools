        "source_text": "--- PDF PAGE 45 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  INSTRUMENTATION AND CONTROL SERVICING NC IV   \n \n \n        Page 43  \n \n \n \nCORE COMPETENCIES \n \nUNIT TITLE \n: \nSTART-UP & COMMISSSION INSTRUMENTATION AND \nCONTROL SYSTEMS   \nUNIT CODE \n: \nELC724306 \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills and attitudes necessary to \nundertake start-up & commissioning of instrumentation and \ncontrol systems. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized Bold terms are elaborated in the Range of Variables\n1. Plan and prepare to \nundertake start-up \nand commissioning \nprocess \n1.1. \nStart-up & Commissioning procedures are planned \nand prepared in line with job requirements. \n1.2. \nOH & S policies and procedures are followed in \nline with job requirements. \n1.3. \nInstrumentation and Control standards are \nfollowed in line with job requirements \n1.4. \nStart-up and commissioning procedures of \ninstrumentation and control systems are \nchecked against specifications and requirements \n1.5. \nTools, equipment and testing devices needed to \ncarry out the start-up commissioning work are \nobtained in accordance with established \nprocedures and checked for correct operation and \nsafety. \n1.6. \nMaterials necessary to complete the work are \nobtained in accordance with job requirements\n2. Start-up and \ncommission \ninstrumentation and \ncontrol systems \n2.1. \nAppropriate personal protective equipment is \nused in line with standard procedures. \n2.2. \nStart-up and commissioning is done    using \nspecified procedures \n2.3. \nWork is performed in accordance with requirements \nwithout damage to the surrounding environment or \nservices \n2.4. \nUnplanned events or conditions are responded to \nin accordance with established procedures\n3. Check commissioned \nsystems and \nequipment \n3.1. \nCommissioned systems are verified according to \nestablished procedures. \n3.2. \nCommissioned systems are checked to ensure \nsafety. \n3.3. \nUnplanned events or conditions are responded to \nin accordance with established procedures. \n3.4. \nReport is prepared and completed according to the \ncompany procedures.\n\n--- PDF PAGE 46 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  INSTRUMENTATION AND CONTROL SERVICING NC IV   \n \n \n        Page 44  \n \n \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. OH & S policies and \nprocedures \n1.1. \nOH & S guidelines \n1.2. \nPhilippine environmental standards \n2. Instrumentation and \nControl Standards \nInclude but not limited to: \n2.1. \nISA (Instrumentation, Systems and Automation) \nSociety (formerly Instrument Society of America) \n2.2. \nANSI (American National Standards Institute) \n2.3. \nASME (American Society of Mechanical Engineers) \n2.4. \n NEC (National Electrical Code) \n2.5.\nIEC (International Electrotechnical Commission)\n3. Instrumentation and \nControl Systems \nInclude a combination of the following but not limited to: \n3.1. \nPressure measurement and control loop \n3.2. \nLevel measurement and control loop \n3.3. \nFlow measurement and control loop \n3.4. \nTemperature measurement and control loop \n3.5.\nAnalytical measurement and control loop\n4. Tools \nTool set includes but not limited to: \n4.1. \nPliers (assorted) \n4.2. \nScrew drivers (assorted) \n4.3. \nSoldering iron/gun \n4.4.\nWrenches\n5. Equipment/testing \ndevices \n5.1. \nEquipment includes but not limited to: \n5.1.1. Communication equipment  \n           (e.g. 2-way radio, cell phone) \n5.1.2   Configurator or programmer  \n5.2. \nTesting devices includes but not limited to: \n5.2.1. Multimeter \n5.2.2. Calibrators \n5.2.3. Signal simulators\n6. Materials \nInclude but not limited to: \n6.1. \nSealing materials \n6.2. \nPipes/tubes & fittings \n6.3.\nWires and cables\n7. Personal protective \nequipment \nIncludes but not limited to: \n7.1. \nEar muffs/plugs \n7.2. \nGoggles/glasses/face shield \n7.3. \nSafety hat \n7.4. \nSafety apparel/suit \n7.5. \nSafety belt/harness \n7.6. \nSafety shoes  \n7.7. \nMask  \n7.8.\nGloves\n\n--- PDF PAGE 47 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  INSTRUMENTATION AND CONTROL SERVICING NC IV   \n \n \n        Page 45  \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. \nInterpreted work instructions according to job \nrequirements. \n1.2. \nApplied the appropriate/correct procedures in \ncommissioning instrumentation and control system \n1.3. \nChecked the commissioned instrumentation and \ncontrol systems to insure safety \n1.4. \nDocumented the tasks undertaken \n2. Underpinning \nknowledge \nInclude but not limited to: \n2.1. \nOccupational health and safety \n2.2. \nInstrumentation & Control standards \n2.3. \nUse of tools \n2.4. \nMathematical calculations \n2.5. \nElectrical theory \n2.6. \nElectronics theory \n2.7. \nUse of test equipment and calibrators \n2.8. \nWiring techniques \n2.9. \nDrawing interpretation \n2.10. Soldering techniques \n2.11. Principles of Instrumentation \n2.12. Process variable measurements (pressure, level, \nflow, temperature, analysis, etc.) \n2.13. Process Control Theory \n2.14. Process Control System (single-loop & multi-loop \ncontrollers, DCS, DAS, SCADA, etc) \n2.15.  Sensors, transmitters, transducers & converters \n2.16. Programmable logic controllers \n2.17. Control valves and final control elements \n2.18. Computer operations \n2.19. Process and machinery operation \n3. Underpinning skills \n3.1. \nReading skills required to interpret work \ninstructions \n3.2. \nCommunication skills needed to interpret and \ndefine work procedures \n3.3. \nSelection & use of proper tools & equipment \n3.4. \nStart-up & commissioning skills  \n3.5. \nProblem solving in unplanned events\n\n--- PDF PAGE 48 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  INSTRUMENTATION AND CONTROL SERVICING NC IV   \n \n \n        Page 46  \n \n \n4. Method of assessment \nThe assessor may select at least three of the following \nassessment methods to objectively assess the candidate: \n4.1. \nObservation \n4.2. \nQuestioning \n4.3. \nThird Party \n4.4. \nPortfolio \n5. Resource Implication \n5. Include but not limited to: \n5.1. \nInstrumentation & Control devices \n5.2. \nTools  \n5.3. \nTest equipment and calibrators \n5.4. \nMaterials  \n5.5. \nPPE \n5.6. \nTechnical manuals \n5.7. \nInstrumentation & Control drawings \n6. Context of Assessment \n6.1. \nAssessment may be conducted in the workplace or \nin a simulated work environment\n",
