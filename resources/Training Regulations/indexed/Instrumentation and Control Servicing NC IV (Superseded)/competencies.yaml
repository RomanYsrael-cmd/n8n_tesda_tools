nt/testing devices \n5.1. \nEquipment include but not limited to: \n5.1.1. Communication equipment (e.g. 2-way radio, \ncell phone) \n5.1.2. Configurator or programmer \n5.2. \nTesting devices includes but not limited to: \n5.2.1. Multimeter \n5.2.2. Calibrators \n5.2.3. Signal generators \n5.2.4. Oscilloscope\n6. Instrumentation and \nControl Systems \nInclude a combination of the following but not limited to: \n6.1. \nPressure measurement and Control loop \n6.2. \nLevel measurement and control loop \n6.3. \nFlow measurement and control loop \n6.4. \nTemperature measurement and control loop \n6.5.\nAnalytical measurement and control loop\n7. Personal protective \nequipment \nIncludes the following but \nnot limited to: \n7.1. \nEar muffs/plugs \n7.2. \nGoggles/glasses/fac\ne shield \n7.3. \nSafety hat \n7.4.\nSafety apparel/suit\n \n7.5. \nSafety belt/harness \n7.6. \nSafety shoes  \n7.7. \nMask  \n7.8. \nGloves \n8. Faults or problems \n8.1. \nmechanical \n8.2. \nelectrical \n8.3. \nelectronics \n8.4. \ncomputer-based\n\n--- PDF PAGE 52 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTRAINING REGULATIONS  -  INSTRUMENTATION AND CONTROL SERVICING NC IV   \n \n \n        Page 50"
