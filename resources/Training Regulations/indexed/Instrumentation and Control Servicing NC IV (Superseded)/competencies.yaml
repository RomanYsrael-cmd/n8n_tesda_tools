        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetencies\nAssessment requires evidence that the candidate:\n\n1.1. selected correct technical drawing in line with\njob requirements\n1.2. correctly identified the objects represented in\nthe drawing\n1.3. identified and interpreted symbols used in the\ndrawing correctly\n1.4. prepared/produced electrical/electronic\ndrawings including all relevant specifications\n1.5. stored diagrams/equipment\n2. Underpinning knowledge\n2.1. Drawing conventions\n2.2. Symbols\n2.3. Dimensioning Conventions\n2.4. Mark up/Notation of Drawings\n2.5. Mathematics\n2.5.1. Four fundamental operations\n2.5.2. Percentage\n2.5.3. Fraction\n2.5.4. Trigonometric Functions\n2.5.5. Algebra\n2.5.6. Geometry\n3. Underpinning skills\n3.1. Reading skills required to interpret work\ninstruction\n3.2. Communication skills\n3.3. Interpreting electrical/electronic signs and\nsymbols\n4. Method of assessment\nCompetency in this unit must be assessed through:\n\n4.1. Practical tasks involving interpretation of a\nrange of technical drawings\n4.2. Oral questioning\n5. Resource implication\n5.1. Drawings\n5.2. Diagrams\n5.3. Charts\n5.4. Plans\n6. Context of Assessment\nAssessment may be conducted in the workplace or in a\nsimulated work environment\n\n--- PDF PAGE 36 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC IV\n\n Page 34\n\nUNIT TITLE\n:\nAPPLY QUALITY STANDARDS\nUNIT CODE\n:"
