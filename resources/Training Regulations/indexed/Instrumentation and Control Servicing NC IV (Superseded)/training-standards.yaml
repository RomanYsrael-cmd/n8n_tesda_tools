    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: Instrumentation & Control Servicing\nNC Level: NC IV\n\nNominal Training Duration:\n30 hrs – Basic Competencies\n\n60 hrs – Common Competencies\n\n80 hrs – Core Competencies\n\n -----------\n\n 170 hrs\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of\nan Instrumentation & Control Technician, in accordance with industry standards. It covers\nthe basic & common competencies in addition to the core competencies such as start-up\n& commissioning Instrumentation & Control devices, and diagnosing & troubleshooting\nInstrumentation & Control systems. The nominal duration of 170 hrs. covers only the\nbasic, common and core units at Instrumentation & Control Servicing NC IV. TVET\nproviders can however, offer a longer, ladderized course covering Instrumentation &\nControl Servicing NC II, NC III and NC IV basic, common and core units.\n\nBASIC COMPETENCIES\n30 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Utilize\nspecialized\ncommunication\nskills\n1.1 Meet common and specific\ncommunication needs of clients\nand colleagues\n1.2 Contribute to the development of\ncommunication strategies\n1.3 Represent the organization\n1.4 Facilitate group discussion\n1.5 Conduct interview\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Develop teams\nand individuals\n2.1 Provide team leadership\n2.2 Foster individual and\n organizational growth\n2.3 Monitor and evaluate workplace\n learning\n2.4 Develop team commitment and\n cooperation\n2.5 Facilitate accomplishment of\n organizational goals\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n\n--- PDF PAGE 55 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC IV\n\n Page 53\n\n3. Apply problem\nsolving\ntechniques in\nthe workplace\n3.1 Analyze the problem\n3.2 Identify possible solutions\n3.3 Recommend solution to higher\nmanagement\n3.4 Implement solution\n3.5 Evaluate/Monitor results and\noutcome\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Collect,\nanalyze and\norganize\ninformation\n4.1 Study information requirements\n4.2 Process data\n4.3 Analyze, interpret and organize\ninformation gathered\n4.4 Present findings/\n Recommendations\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Plan and\norganize work\n5.1 Set objectives\n5.2 Plan and schedule work activities\n5.3 Implement work plans\n5.4 Monitor work activities\n5.5 Review and evaluate work plans\nand activities\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Promote\nenvironmental\nprotection\n\n6.1 Study guidelines for environmental\nconcerns\n6.2 Implement specific environmental\nprograms\n6.3 Monitor activities on environmental\nprotection /programs\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\n60 hrs\n\nNote: Those who have completed the course on Instrumentation and Control Servicing NC III or\nhave acquired the Instrumentation and Control Servicing NC III qualification can skip this\nportion on common competencies.\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Apply Quality\nStandards\n\n1.1 Asses quality of received\nmaterials\n1.2 Assess own work\n1.3 Engage in quality\nimprovement\n\n• Field trip\n• Symposium\n• Film showing\n• Simulation\n• On the job\ntraining\n\n• Demonstration\nand questioning\n• Observation and\nquestioning\n• Third party\nreport\n\n2 Perform\nComputer\nOperation\n\n2.1 Set-up workstation\n2.2 Prepare storage media\n2.3 Work with files and\nobjects\n\n• Modular\n• Film showing\n• Computer\n\n• Demonstration\nand questioning\n• Observation and\nquestioning\n\n--- PDF PAGE 56 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC IV\n\n Page 54\n\n2.4 Manipulate word\nprocessing software\n2.5 Manipulate spreadsheet\nsoftware\n2.6 Manipulate customize\nand database\napplications\n2.7 Utilize the internet\n2.8 Maintain computer\nhardware and software\nbased training\n(e-learning)\n• Project\nmethod\n• On the job\ntraining\n\n• Third party\nreport\n• Assessment of\noutput product\n• Portfolio\n• Computer based\nassessment\n\n3 Use Hand\nTools\n3.1 Identify, explain and\napply the use of different\ntypes of hand tools\n3.2 Perform basic\nmaintenance and proper\nstorage of hand tools\naccording to the standard\noperating procedures\n3.3 Document and record the\nsequence of events in\nsafe keeping hand tools.\n• Lecture /\nDemonstration\n• Distance\neducation\n• Film Showing\n\n• Written/Oral\nexamination\n• Practical\ndemonstration\n\n4 Perform\nMensurations\nand\nCalculation\n4.1 Select measuring\ninstruments;\n4.2 2.\nCarry-out\nmeasurements and\ncalculations;\n\n• Self- paced /\nmodular\n• Demonstration\n• Small group\ndiscussion\n• Distance\neducation\n• Written/Oral\nexamination\n• Practical\ndemonstration\n\n5 Interpret\nTechnical\nDrawings And\nPlans\n5.1 Select and interpret\ntechnical drawing\n5.2 Perform freehand\nsketching\n• Lecture/\ndemonstration\n• Dualized\n• Distance\nlearning\n• Written /oral\nexaminations\n• Direct\n• observation\n• Project method\n• interview\n6 Terminate and\nConnect\nElectrical\nwiring and\nElectronic\nCircuit\n6.1 Terminate or join non-\nsoldered connections\n6.2 Terminate or join\nsoldered connections\n• Film Viewing\n• Individualized\nLearning\n• Direct Student\nLaboratory\nExperience\n• On the Job\nTraining\n• Project\nMethod\n• Demonstration\nand Questioning\n• Assessment of\nOutput Product\n\n--- PDF PAGE 57 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC IV\n\n Page 55\n\nCORE COMPETENCIES\n80 hours\n\nNote: This course design covers only Instrumentation & Control Servicing NC level IV core units.\nThe trainee attending this course must have completed first both the units for Instrumentation\n& Control Servicing NC II and NC III.\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n1. Start-up &\nCommission\nInstrumentation\n& Control\nDevices\n1.1 Read & interpret work instructions\naccording to job requirements.\n\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n\n• Written exam\n• Practical exam\nObservation in\nworkplace\n• Interviews/\nquestioning\n1.2 Identify the tools, equipment,\ntesting devices, & materials\nneeded for start-up &\ncommissioning.\n1.3 Identify the PPE & OHS policies &\nprocedures required for the start-\nup & commissioning job.\n1.4 Start-up & commission\nInstrumentation & control devices\naccording to technical\nrequirements & standards\n1.5 Conduct functional test procedure\nof the started-up & commissioned\nInstrumentation & Control devices\n1.6 Prepare a start-up &\ncommissioning report\n\n2. Diagnose &\nTroubleshoot\nInstrumentation\n& Control\nSystems\n2.1 Read & interpret work instructions\naccording to the system\ndiagnostics & troubleshooting job.\n\n• Lecture\n• Discussion\n• Demonstration\n• Viewing\nmultimedia\n\n• Written exam\n• Practical exam\n• Observation in\nworkplace\n• Interviews/\nquestioning\n2.2 Identify the tools, equipment,\ntesting devices, & materials\nneeded for system diagnostics &\ntroubleshooting\n2.3 Identify the PPE & OHS policies\n& procedures required for the\nsystem diagnostics &\ntroubleshooting job.\n2.4 Diagnose Instrumentation & control\nsystems according to technical\nrequirements & standards\n2.5 Isolate systems & associated\nequipment necessary to implement\ncorrective action\n2.6 Rectify & correct defects in\ninstrumentation & control systems\n2.7 Conduct tests & inspection to\ndetermine normal functionality & to\ninsure safe operation.\n2.8 Prepare a system diagnostics &\ntroubleshooting report\n\n--- PDF PAGE 58 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTRAINING REGULATIONS - INSTRUMENTATION AND CONTROL SERVICING NC IV\n\n Page 56"
