    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: Drafting Level: NC II\n\nNominal Training Duration: 148 Hrs\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills and desirable work\nattitude of a draftsman or CAD operator. It covers the basic, common, core and\nelective competencies i.e. prepare architectural, structural, electrical and electronic,\nplumbing and sanitary, and mechanical layouts and details using both CAD system\nand manual drawing methods.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\ninformation\n1.2 Complete relevant\nwork related\ndocuments\n1.3 Participate in\nworkplace meeting\nand discussion.\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team role\nand responsibility in\na team\n2.2 Describe work as a\nteam member\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 58 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 57\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain\nprofessional growth\nand development\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews /\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain\noccupational health\nand safety\nawareness\n\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 59 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 58\nCOMMON COMPETENCIES\n(36 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nmensuration and\ncalculation\n1.1 Select measuring\ninstruments\n1.2 Carry out measurements\nand calculations\n• Simulation\n• Discussion\n• Practical\nexercise\n\n• Direct\nobservation\n• Written / Oral\ntest\n• Demonstration\n2. Interpret\ntechnical\ndrawings and\nplans\n2.1 Analyze signs, symbol\nand data.\n2.2 Interpret technical\ndrawings and plans\n• Audio visual\n• Simulation\n• Discussion\npractical lab\n• Demonstration\n• Direct\nobservation\n• Oral\nquestioning\n• Written test or\nexamination\n• Demonstration\n3. Apply quality\nstandards\n3.1 Assess quality of\nreceived materials\n3.2 Assess own work\n3.3 Engage in quality\nimprovement\n• Audio Visual\n• Simulation\n• Discussion\npractical lab\n• Demonstration\n• Direct\nobservation\n• Oral\nquestioning\n• Written test or\nexamination\n• Demonstration\n(able to impart\nknowledge and\nskills)\n4. Perform\ncomputer\noperations\n4.1 Apply computer basic\noperation procedures\n4.2 Organize and manipulate\nfiles\n4.3 Install, configure and work\nwith application program\n4.4 Work with internet\n4.5 Log off from a computer\n\n• Audio Visual\n• Simulation\n• Discussion\npractical lab\n• Demonstration\n• Direct\nobservation\n• Oral\nquestioning\n• Written test or\nexamination\n• Demonstration\n\n--- PDF PAGE 60 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 59\nCORE COMPETENCIES\n(94 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Draft\narchitectural\nlayout and\ndetails\n\n1.1 Plan and prepare for work\n1.2 Prepare and set-up tools and\nmaterials for drawing\n1.3 Draft Site development plan\n1.4 Draft Floor plan\n1.5 Draft roof plans\n1.6 Draft ceiling plans\n1.7 Draft elevations and sections\n1.8 Submit complete drawings\n\n• Lecture /\ndiscussion\n• Modular / self-\npaced learning\n• Practical\nexercises\n• Demonstration /\nobservation\n• Oral questioning\n• Written test\n2. Prepare\ncomputer-aided\ndrawings\n2.1 Operate CAD software and\ncomputer hardware\n2.2 Prepare plans using CAD\n\n• Lecture /\ndiscussion\n• Modular / self-\npaced\nlearning\n• Practical\nexercises\n\n• Demonstration /\nobservation\n• Oral\nquestioning\n• Written test\n\n--- PDF PAGE 61 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 60\n\nELECTIVE COMPETENCIES\n(58 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Draft structural\n layout and\n details\n1.1 Draft foundation plans\n1.2 Draft structural floor and roof\nframing plans\n• Lecture /\ndiscussion\n• Modular / self-\npaced learning\n• Practical\nexercises\n• Demonstration\n/ observation\n• Oral\nquestioning\n• Written test\n2. Draft electrical\nand electronic\nlayout and details\n2.1 Draft electrical plans and\nlayouts\n2.2 Draft auxiliary systems and\nlayout\n• Lecture /\ndiscussion\n• Modular / self-\npaced learning\n• Practical\nexercises\n• Demonstration /\nobservation\n• Oral\nquestioning\n• Written test\n3. Draft sanitary /\nplumbing layout\nand details\n3.1 Draft water distribution\nsystems\n3.2 Draft sanitary and storm\ndrainage\n• Lecture /\ndiscussion\n• Modular / self-\npaced learning\n• Practical\nexercises\n• Demonstration /\nobservation\n• Oral\nquestioning\n• Written test\n4. Draft\nmechanical\nlayout and\ndetails\n4.1 Draft heating, ventilating and\nair-conditioning systems\nlayout\n4.2 Draft mechanical details of\nconveyor system\n4.3 Draft fire protection systems\n4.4 Draft gas piping system\n\n• Lecture /\ndiscussion\n• Modular / self-\npaced learning\n• Practical\nexercises\n• Demonstration /\nobservation\n• Oral\nquestioning\n• Written test\n\n--- PDF PAGE 62 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 61"
