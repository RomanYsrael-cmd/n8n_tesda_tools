    "source_text": "SECTION 3\nTRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Technical Drafting NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: Drafting Level: NC II\n\nNominal Training Duration: 148 Hrs\n\nCourse Description:\nThis course is designed to enhance the knowledge, skills and desirable work\nattitude of a draftsman or CAD operator. It covers the basic, common, core and\nelective competencies i.e. prepare architectural, structural, electrical and electronic,\nplumbing and sanitary, and mechanical layouts and details using both CAD system\nand manual drawing methods.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\ninformation\n1.2 Complete relevant\nwork related\ndocuments\n1.3 Participate in\nworkplace meeting\nand discussion.\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team role\nand responsibility in\na team\n2.2 Describe work as a\nteam member\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 58 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 57\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain\nprofessional growth\nand development\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews /\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain\noccupational health\nand safety\nawareness\n\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 59 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 58\nCOMMON COMPETENCIES\n(36 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nmensuration and\ncalculation\n1.1 Select measuring\ninstruments\n1.2 Carry out measurements\nand calculations\n• Simulation\n• Discussion\n• Practical\nexercise\n\n• Direct\nobservation\n• Written / Oral\ntest\n• Demonstration\n2. Interpret\ntechnical\ndrawings and\nplans\n2.1 Analyze signs, symbol\nand data.\n2.2 Interpret technical\ndrawings and plans\n• Audio visual\n• Simulation\n• Discussion\npractical lab\n• Demonstration\n• Direct\nobservation\n• Oral\nquestioning\n• Written test or\nexamination\n• Demonstration\n3. Apply quality\nstandards\n3.1 Assess quality of\nreceived materials\n3.2 Assess own work\n3.3 Engage in quality\nimprovement\n• Audio Visual\n• Simulation\n• Discussion\npractical lab\n• Demonstration\n• Direct\nobservation\n• Oral\nquestioning\n• Written test or\nexamination\n• Demonstration\n(able to impart\nknowledge and\nskills)\n4. Perform\ncomputer\noperations\n4.1 Apply computer basic\noperation procedures\n4.2 Organize and manipulate\nfiles\n4.3 Install, configure and work\nwith application program\n4.4 Work with internet\n4.5 Log off from a computer\n\n• Audio Visual\n• Simulation\n• Discussion\npractical lab\n• Demonstration\n• Direct\nobservation\n• Oral\nquestioning\n• Written test or\nexamination\n• Demonstration\n\n--- PDF PAGE 60 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 59\nCORE COMPETENCIES\n(94 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Draft\narchitectural\nlayout and\ndetails\n\n1.1 Plan and prepare for work\n1.2 Prepare and set-up tools and\nmaterials for drawing\n1.3 Draft Site development plan\n1.4 Draft Floor plan\n1.5 Draft roof plans\n1.6 Draft ceiling plans\n1.7 Draft elevations and sections\n1.8 Submit complete drawings\n\n• Lecture /\ndiscussion\n• Modular / self-\npaced learning\n• Practical\nexercises\n• Demonstration /\nobservation\n• Oral questioning\n• Written test\n2. Prepare\ncomputer-aided\ndrawings\n2.1 Operate CAD software and\ncomputer hardware\n2.2 Prepare plans using CAD\n\n• Lecture /\ndiscussion\n• Modular / self-\npaced\nlearning\n• Practical\nexercises\n\n• Demonstration /\nobservation\n• Oral\nquestioning\n• Written test\n\n--- PDF PAGE 61 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 60\n\nELECTIVE COMPETENCIES\n(58 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Draft structural\n layout and\n details\n1.1 Draft foundation plans\n1.2 Draft structural floor and roof\nframing plans\n• Lecture /\ndiscussion\n• Modular / self-\npaced learning\n• Practical\nexercises\n• Demonstration\n/ observation\n• Oral\nquestioning\n• Written test\n2. Draft electrical\nand electronic\nlayout and details\n2.1 Draft electrical plans and\nlayouts\n2.2 Draft auxiliary systems and\nlayout\n• Lecture /\ndiscussion\n• Modular / self-\npaced learning\n• Practical\nexercises\n• Demonstration /\nobservation\n• Oral\nquestioning\n• Written test\n3. Draft sanitary /\nplumbing layout\nand details\n3.1 Draft water distribution\nsystems\n3.2 Draft sanitary and storm\ndrainage\n• Lecture /\ndiscussion\n• Modular / self-\npaced learning\n• Practical\nexercises\n• Demonstration /\nobservation\n• Oral\nquestioning\n• Written test\n4. Draft\nmechanical\nlayout and\ndetails\n4.1 Draft heating, ventilating and\nair-conditioning systems\nlayout\n4.2 Draft mechanical details of\nconveyor system\n4.3 Draft fire protection systems\n4.4 Draft gas piping system\n\n• Lecture /\ndiscussion\n• Modular / self-\npaced learning\n• Practical\nexercises\n• Demonstration /\nobservation\n• Oral\nquestioning\n• Written test\n\n--- PDF PAGE 62 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 61\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET:\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n• Training allows for multiple entry and exit; and\n• Training programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and in-\nindustry training or fieldwork components. Details can be referred to\nthe Dual Training System (DTS) Implementing Rules and\nRegulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n\n--- PDF PAGE 63 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 62\n• Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in\nthe same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n• Project-Based Instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate projects\nthat have real world applications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational experience.\nOther requirements like health and physical requirements are also stated. Passing\nentry written examinations may also be indicated if necessary.\n\n• Good moral character\n• Ability to communicate\n• Physically fit and mentally healthy\n• Can perform basic mathematical computation and mensuration\n\n--- PDF PAGE 64 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 63\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS FOR TECHNICAL\nDRAFTING NC II\n\nBelow is the recommended list of tools, equipment and materials for the training\nof 25 learners for TECHNICAL DRAFTING NC II.\n\n TOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n25 pcs.\n• Drawing board\n25\nsets\n• Computer\nhardware\n5 rolls\n• Tracing paper\n25 pcs.\n• T-square\n1 set\n• Plotter\n25 pcs. • Blueprint\n25 pcs.\n• Triangle\n2 sets • Printer\n50 pcs. • Pen / pencil\n25 pcs.\n• Scale\n\n4 sets\n• Ink\n50 pcs.\n• Technical pens\nand pencils\n\n3 rims\n• Paper\n25 pcs.\n• Erasers\n\n5 pcs.\n• External drive\n25 pcs.\n• Drawing\ntemplates\n\n1 box\n• Recordable or\nrewritable CD\n25 pcs.\n• Sharpeners\n\n25 sets • CAD software\n\n3.5 TRAINING FACILITIES\n\nThe size of the training facility is based on size of class intake of 25 students\nor trainees.\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nTotal Area in\nSq. Meters\nStudent or trainee’s working\nSpace\n10 x 10\n4 sq.m per\nstudent\n100.0 sq.m.\nLecture room\n6 x 8\n48.00\n48.0\nLearning resource center\n4 x 6\n24.00\n24.0\n\n172\nFacilities / Circulation area\n8 x 8\n64.00\n64.0\n\nTOTAL AREA\n236\n\n--- PDF PAGE 65 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 64\n\n3.6 TRAINER’S QUALIFICATION FOR TECHNICAL\nDRAFTING NC II\n\n• Must be a holder of Technical Drafting NC II\n• Must have undergone training on Training Methodology II (TM II)\n• Must be physically and mentally fit\n• *Must have at least 5 years job/industry experience*\n• Must be a civil service eligible (for government position or\nappropriate professional license issued by the Professional\nRegulatory Commission)\n\n*Optional. Only when required by the hiring institution\nReference: TESDA Board Resolution No. 2004-03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency.\n\n--- PDF PAGE 66 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 65"
