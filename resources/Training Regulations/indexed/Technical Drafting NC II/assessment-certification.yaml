  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1. To attain the National Qualification of Technical Drafting NC II, the\ncandidate must demonstrate competence in all the units required in\nSection 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n4.2 The qualification of TECHNICAL DRAFTING NC II can be attained\nthrough –\n\n4.2.1 Demonstration of competence in a project-type assessment\ncovering all of the following core units.\n\n4.2.1.1\nDraft architectural layout and details\n4.2.1.2\nPrepare computer-aided drawings\n4.2.1.3\nDraft structural layout and details\n4.2.1.4\nDraft electrical and electronic layout and details\n4.2.1.5\nDraft sanitary and plumbing layout and details\n4.2.1.6\nDraft mechanical layout and details\n\nFor this assessment, the candidate shall be required to demonstrate drafting of basic\narchitectural layout and details (e. g., floor plan) using both `manual drafting and\nCAD. The specialized detail drawings (structural, electrical/electronic,\nsanitary/plumbing and mechanical) shall be prepared using CAD system.\n\n4.2.2 Accumulation of Certificates of Competency in all the following\nunits of competency:\n\n4.2.2.1\nDraft architectural layout and details\n4.2.2.1.1 Draft architectural layout and details\n4.2.2.1.2 Prepare computer-aided drawings\n4.2.2.2\nDraft structural layout and details\n4.2.2.2.1 Draft structural layout and details\n4.2.2.2.2 Prepare computer-aided drawings\n4.2.2.3\nDraft electrical-electronic layout and details\n4.2.2.3.1 Draft electrical-electronic layout and details\n4.2.2.3.2 Prepare computer-aided drawings\n4.2.2.4\nDraft plumbing-sanitary layout and details\n4.2.2.4.1 Draft plumbing-sanitary layout and details\n4.2.2.4.2 Prepare computer-aided drawings\n4.2.2.5\nDraft mechanical layout and details\n4.2.2.5.1 Draft mechanical layout and details\n4.2.2.5.2 Prepare computer-aided drawings\n\nThe unit of competency “Prepare computer-aided drawings” is embedded in each\nspecialized drawing whenever the candidate shall apply for Certificate of Competency\n\n--- PDF PAGE 67 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 66\n(COC). The assessment for each of the unit of competency from 4.2.2.1 to 4.2.2.5 will\ncover both manual and computer-aided drafting. To qualify for a COC in each of the\nabove (4.2.2.1 to 4.2.2.5) areas, the candidate should demonstrate competency in BOTH\nmanual and computer-aided drafting.\n\n4.3. Assessment shall focus on the core units of competency and the preferred\nunit of competency. The basic and common units shall be integrated or\nassessed concurrently with the core and elective units of competency.\n\n4.4. The following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs\n\n4.4.2. Experienced Workers (wage employed or self-employed)\n\n4.5. The guidelines on assessment and certification are discussed in detail in\nthe “Procedures Manual on Assessment and Certification” and\n“Guidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS).”\n\n--- PDF PAGE 68 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 67\n\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\n"
