    {
      "number": "4.2",
      "text": "The qualification of TECHNICAL DRAFTING NC II can be attained through – 4.2.1 Demonstration of competence in a project-type assessment covering all of the following core units. 4.2.1.1 Draft architectural layout and details 4.2.1.2 Prepare computer-aided drawings 4.2.1.3 Draft structural layout and details 4.2.1.4 Draft electrical and electronic layout and details 4.2.1.5 Draft sanitary and plumbing layout and details 4.2.1.6 Draft mechanical layout and details For this assessment, the candidate shall be required to demonstrate drafting of basic architectural layout and details (e. g., floor plan) using both `manual drafting and CAD. The specialized detail drawings (structural, electrical/electronic, sanitary/plumbing and mechanical) shall be prepared using CAD system. 4.2.2 Accumulation of Certificates of Competency in all the following units of competency: 4.2.2.1 Draft architectural layout and details 4.2.2.1.1 Draft architectural layout and details 4.2.2.1.2 Prepare computer-aided drawings 4.2.2.2 Draft structural layout and details 4.2.2.2.1 Draft structural layout and details 4.2.2.2.2 Prepare computer-aided drawings 4.2.2.3 Draft electrical-electronic layout and details 4.2.2.3.1 Draft electrical-electronic layout and details 4.2.2.3.2 Prepare computer-aided drawings 4.2.2.4 Draft plumbing-sanitary layout and details 4.2.2.4.1 Draft plumbing-sanitary layout and details 4.2.2.4.2 Prepare computer-aided drawings 4.2.2.5 Draft mechanical layout and details 4.2.2.5.1 Draft mechanical layout and details 4.2.2.5.2 Prepare computer-aided drawings The unit of competency “Prepare computer-aided drawings” is embedded in each specialized drawing whenever the candidate shall apply for Certificate of Competency TECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 66 (COC). The assessment for each of the unit of competency from 4.2.2.1 to 4.2.2.5 will cover both manual and computer-aided drafting. To qualify for a COC in each of the above (4.2.2.1 to 4.2.2.5) areas, the candidate should demonstrate competency in BOTH manual and computer-aided drafting."
