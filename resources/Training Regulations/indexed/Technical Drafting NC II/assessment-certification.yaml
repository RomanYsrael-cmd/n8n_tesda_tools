  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1. To attain the National Qualification of Technical Drafting NC II, the\ncandidate must demonstrate competence in all the units required in\nSection 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n4.2 The qualification of TECHNICAL DRAFTING NC II can be attained\nthrough –\n\n4.2.1 Demonstration of competence in a project-type assessment\ncovering all of the following core units.\n\n4.2.1.1\nDraft architectural layout and details\n4.2.1.2\nPrepare computer-aided drawings\n4.2.1.3\nDraft structural layout and details\n4.2.1.4\nDraft electrical and electronic layout and details\n4.2.1.5\nDraft sanitary and plumbing layout and details\n4.2.1.6\nDraft mechanical layout and details\n\nFor this assessment, the candidate shall be required to demonstrate drafting of basic\narchitectural layout and details (e. g., floor plan) using both `manual drafting and\nCAD. The specialized detail drawings (structural, electrical/electronic,\nsanitary/plumbing and mechanical) shall be prepared using CAD system.\n\n4.2.2 Accumulation of Certificates of Competency in all the following\nunits of competency:\n\n4.2.2.1\nDraft architectural layout and details\n4.2.2.1.1 Draft architectural layout and details\n4.2.2.1.2 Prepare computer-aided drawings\n4.2.2.2\nDraft structural layout and details\n4.2.2.2.1 Draft structural layout and details\n4.2.2.2.2 Prepare computer-aided drawings\n4.2.2.3\nDraft electrical-electronic layout and details\n4.2.2.3.1 Draft electrical-electronic layout and details\n4.2.2.3.2 Prepare computer-aided drawings\n4.2.2.4\nDraft plumbing-sanitary layout and details\n4.2.2.4.1 Draft plumbing-sanitary layout and details\n4.2.2.4.2 Prepare computer-aided drawings\n4.2.2.5\nDraft mechanical layout and details\n4.2.2.5.1 Draft mechanical layout and details\n4.2.2.5.2 Prepare computer-aided drawings\n\nThe unit of competency “Prepare computer-aided drawings” is embedded in each\nspecialized drawing whenever the candidate shall apply for Certificate of Competency\n\n--- PDF PAGE 67 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 66\n(COC). The assessment for each of the unit of competency from 4.2.2.1 to 4.2.2.5 will\ncover both manual and computer-aided drafting. To qualify for a COC in each of the\nabove (4.2.2.1 to 4.2.2.5) areas, the candidate should demonstrate competency in BOTH\nmanual and computer-aided drafting.\n\n4.3. Assessment shall focus on the core units of competency and the preferred\nunit of competency. The basic and common units shall be integrated or\nassessed concurrently with the core and elective units of competency.\n\n4.4. The following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs\n\n4.4.2. Experienced Workers (wage employed or self-employed)\n\n4.5. The guidelines on assessment and certification are discussed in detail in\nthe “Procedures Manual on Assessment and Certification” and\n“Guidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS).”\n\n--- PDF PAGE 68 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 67\n\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nANNEX A\nTECHNICAL DRAFTING\n\nCOMPETENCY MAP\n\nRepair defective\nconcrete and\nmasonry surfaces\nPerform basic\nmasonry\nworks\nLay brick/ block\nfor structures\nPlaster\nconcrete/\nmasonry\nInstall pre-cast\nbalusters and\nhandrails\nPrepare\nmasonry\nmaterials\nPrepare tools,\npainting\nmaterials and\nPrepare surface\nfor painting\n\nApply special\ncement finishes\nto concrete and\nmasonry surfaces\nEstimate\npaint\nrequirements\nDraft mechanical\nlayout and detail\nDraft architectural\nlayout and details\nPrepare\ncomputer-aided\ndrawings\nStrip form work\ncomponents\nInstall\nFraming\n works\n\nPerform single unit\nplumbing\ninstallation and\nassemblies\nDraft structural\nlayout and detail\nDraft electrical-electronic\nlayout and detail\nDraft plumbing-sanitary\nlayout and detail\nPerform painting\nrepair work\nPerform complex and\nmulti-story plumbing\ninstallation and\nassemblies\nPerform plumbing\nrepair and\nmaintenance\nworks\nConduct pipe\nleak testing\nMake piping\njoints and\nconnections\nInstall hot and\npotable chilled\nwater piping\nsystem\nPrepare pipes\nfor installation\nDraft plumbing\ndesign\nOperate personal\ncomputer\nInterpret technical\ndrawings and plans\nApply quality\nstandards\nPerform mensuration\nand calculations\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nDemonstrate\nwork values\nPractice basic\nhousekeeping\nprocedures\nPractice\nworkplace\ncommunication\nWork in a team\nenvironment\nPractice\nprofessionalism\nPractice\noccupational health\nand safety\nprocedures\nLead workplace\ncommunication\nLead small\nteam\nDevelop and\npractice\nnegotiation skills\nSolve problems\nrelated to work\nactivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialist\ncommunication\nskills\nDevelop team\nand individual\nApply problem\nsolving\ntechniques in the\nworkplace\nCollect and\norganize\ninformation\nPlan and\norganize work\nPromote\nenvironmental\nprotection\nBASIC\nCOMPETENCIES\n\n--- PDF PAGE 69 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 68\nDEFINITION OF TERMS\n\n1. Competency\nIs the application of knowledge, skills and attitudes to perform\nwork activities to the standard expected in the workplace\n\n2. Certification\nRefers to the process of verifying and validating competencies of\na person through assessment.\n\n3. Element\nRefers to the building blocks of a unit of competency. It\ndescribes in outcome terms the functions that a person who\nworks in a particular area of work is able to perform.\n\n4. Evidence Guide\nIt is a guide for assessment that provides information on critical\naspects of competency, underpinning knowledge, underpinning\nskills, resource implications, context of assessment and\nassessment method.\n\n5. Draftsman\n\nRefers to a person who is skilled in drawing.\n6. Drafting\nis the practice of creating accurate representations of objects for\ntechnical, architectural and engineering needs.\n\n7. Philippine TVET\nQualification\nFramework\nRefers to a comprehensive, nationally consistent framework for\nqualifications in the TVET sector. It also provides the parameter\nfor the integration of learning and assessment in the middle skills\ndevelopment.\n\n8. Qualification\nRefers to the national certificate issued by the TESDA or its\naccredited industry organizations in recognition that a person has\nachieved competencies relevant to a trade or industry.\n\n9. Range of\n Variable\nIt describes the circumstances or context in which the work is to\nbe performed.\n\n10. CAD operation\n\nis the use of computer technology to aid in the design of a\nproduct. Current software packages range from 2D vector base\ndrafting systems to 3D solid and surface modellers.\n\n11. Unit of\n Competency\nRefers to a discrete aspect of work, which would normally be\nperformed by only one person.\n\n--- PDF PAGE 70 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 69\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks\nand appreciation to the many representatives of business, industry, academe and government\nagencies and who contributed their time and expertise to the development of this Training\nRegulations.\n\n•\nTHE TECHNICAL/INDUSTRY EXPERTS\n\nANA S. MANGALINO LING\nPrivate Practice\nNational Executive Vice President\nUNITED ARCHITECTS OF THE\nPHILIPPINES\n\nCORAZON F. CRUZ-ADIVOSO\nPrivate Practice\nDeputy Executive Director\nUNITED ARCHITECTS OF THE\nPHILIPPINES\n\nPAMELA N. AMADOR\nPrivate Practice\nChairperson\nUNITED ARCHITECTS OF T