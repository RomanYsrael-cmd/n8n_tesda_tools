        "source_title": "PREPARE COMPUTER-AIDED DRAWINGS",
        "source_text": "--- PDF PAGE 40 ---\nTECHNICAL DRAFTING NC II           Promulgated May 2008                       Amended April 2010                                       39 \nUNIT CODE                     : \nCON311302 \nUNIT DESCRIPTOR        :    This unit covers the knowledge, skills and attitudes required \nto prepare drawings such as architectural, structural, \nelectrical and electronic, sanitary / plumbing and mechanical \nworking drawings using CAD software and hardware. \n \n \nELEMENT \n \nPERFORMANCE CRITERIA \nBold and italicized terms are elaborated in the  \nRange of Variable \n \n1. Plan and prepare for \nwork \n1.1 Work instruction is secured following standard operating \nprocedures (SOP) and interpreted according to drawing \njob requirements \n1.2 Drawing guidelines and parameters, materials, tools \nand equipment are identified based on job \nrequirements.  \n \n2.  Prepare tools and \nmaterials and set-up \nequipment for drawing \n2.1 Material is selected and prepared according to job \nrequirements. \n2.2 System set-up procedure for working drawing is \nperformed following job requirements \n  \n3. Lay-out and produce \ncomputer-aided \ndrawings and details  \n3.1 Sheet requirement accomplishment procedure is \nperformed following technical drawing standards and \nsymbols \n3.2 Review procedure for final drawing is performed \nfollowing job requirements.  \n3.3 Page set-up and scaling procedure is performed based \non technical drawing requirements and printer \ncharacteristics. \n3.4 Saving and backup procedure for final working drawing \nis performed in accordance with enterprise procedure.    \n \n4. Submit complete \ndrawing  \n4.1 Complete drawing is submitted to personnel following \nSOP. \n4.2 Comments and corrections are noted for final drawings \nfollowing SOP. \n4.3 Comments and corrections are integrated into final \ndrawing based on job requirements \n4.4 Housekeeping procedure is performed following SOP \n \n  \n \n \nRANGE OF VARIABLES\n\n--- PDF PAGE 41 ---\nTECHNICAL DRAFTING NC II           Promulgated May 2008                       Amended April 2010                                       40 \n \nVARIABLE \n \n \nRANGE \n1. Drawing job \nrequirements  \n1.1 Architectural  \n1.2 Structural  \n1.3 Electrical and electronic \n1.4 Sanitary / plumbing \n1.5 Mechanical  \n \n2. Materials, tools and \nequipment  \nMay include but not limited to: \nMaterials and consumables \n2.1 Pen / pencil  \n2.2 Ink  \n2.3 Paper \n2.4 Flashdisk \n2.5 External drive \n2.6 Recordable or rewritable CD  \nDrawing tools \n2.7 CAD software  \n2.7.1 AUTOCAD \n2.7.2 Intellicad \n2.7.3 Intericad \n2.7.4 Sketchup \nEquipment \n2.8 Computer hardware \n2.9 Plotter \n2.10 Printer  \n \n3. System set-up \nprocedure  \n3.1 Selection of work space \n3.2 Selection of toolbars \n3.3 Definition of layers \n3.3.1 Colors \n3.3.2 Line type \n3.3.3 Line weight \n3.3.4 Layer description \n3.4 Automatic saving and recovery\n\n--- PDF PAGE 42 ---\nTECHNICAL DRAFTING NC II           Promulgated May 2008                       Amended April 2010                                       41 \n4. Sheet requirement \naccomplishment \nprocedure \nMay include but are not limited to: \n4.1 Drawing commands \n4.1.1 Lines \n4.1.2 Circles \n4.1.3 Ellipse \n4.1.4 Multi-lines \n4.1.5 Polylines \n4.2 Modifications command \n4.2.1 Trim \n4.2.2 Fillet \n4.2.3 Break \n4.2.4 Offset \n4.2.5 Extend \n4.2.6 Copy \n \n5. Technical drawing \nstandards and symbols \n5.1 Lines \n5.2 Letterings \n5.3 Targets \n5.4 Labeling \n5.5 Dimensioning  \n \n6. Review procedure \n6.1 Work space  \n6.2 Printed copy  \n \n7. Personnel  \n7.1 Job captain \n7.2 Senior draftsman  \n7.3 Supervisor  \n \n8. Housekeeping \nprocedure \n8.1 Clean drawing equipment \n8.2 Store drawing materials and storage media  \n8.3 Clean work area and drawing equipment\n\n--- PDF PAGE 43 ---\nTECHNICAL DRAFTING NC II           Promulgated May 2008                       Amended April 2010                                       42 \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \n \nEvidence must show the candidate: \n1.1 Demonstrates ability to interpret drawing job \nrequirements  \n1.2 Demonstrates ability to identify, select, and prepare \ndrawing materials and use drawing tools and equipment  \n1.3 Demonstrates ability to perform set-up procedure \nfollowing job requirements \n1.4 Demonstrates ability to lay-out produce computer-aided \ndrawings and details  \n1.5 Demonstrates ability to submit complete drawings \naccording to job schedule \n  \n2. Underpinning \nknowledge \n \n2.1 Architectural, structural, electrical and electronic, \nsanitary / plumbing and mechanical working drawings \n2.2 Drawing materials and equipment and tools  \n2.3 Procedure for setting-up system for drawing equipment \n2.4 Procedure to lay-out produce computer-aided drawings \nand details  \n2.5 Company rules and regulations and SOP \n2.6 Architectural, structural, electrical and electronic, \nsanitary / plumbing and mechanical terms \n \n3. Underpinning skills \n \n3.1 Interpreting architectural, structural, electrical and \nelectronic, sanitary / plumbing and mechanical  working \ndrawings and symbols \n3.2 Identifying, selecting, preparing and using drawing tools, \nmaterials and equipment  \n3.3 Following procedures for setting-up drawing equipment  \n3.4 Following procedures for lay-out drawing and details  \n3.5 Following company rules and regulations and SOP  \n3.6 Architectural, structural, electrical and electronic,  \nsanitary / plumbing and mechanical terms \n \n4. Resource implications \n \nThe following resources MUST be provided \n4.1 Architectural and engineering base plans and working \ndrawing  \n4.2 Drawing materials, equipment and software\n\n--- PDF PAGE 44 ---\nTECHNICAL DRAFTING NC II           Promulgated May 2008                       Amended April 2010                                       43 \n5.  Methods of Assessment \n \nCompetencies maybe assessed using the following \n5.1 Observation of practical skills with oral questioning \n5.2 Written test  \n5.3 Portfolio \n5.4 Third party report \n \n6.  Context of assessment \n \n6.1 Assessment maybe conducted in the workplace or in \nTESDA accredited assessment center.\n",
        "required_knowledge": null,
        "required_skills": null
      }
