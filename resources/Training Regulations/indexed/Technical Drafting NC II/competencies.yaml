uction processes \n3.2 Checking of materials and component parts and finished  \n      products \n3.3 Following company standard operating procedures  \n3.4 Applying safety practices  \n \n4. Method of  \n    assessment \n4.1  Observation of practical skills  \n4.2  Oral questions  \n \n5. Resource implication \n \nThe following materials must be provided:  \n5.1 Materials and component parts relevant to the activity \n5.2 Documents related to quality  \n \n6. Context of  \n    Assessment \n \n6.1 Assessment may be conducted in the workplace or in a  \n      simulated environment.\n",
