        "source_title": "DRAFT MECHANICAL LAYOUT AND DETAILS",
        "source_text": "--- PDF PAGE 54 ---\nTECHNICAL DRAFTING NC II           Promulgated May 2008                       Amended April 2010                                       53 \nUNIT OF COMPETENCY: \nDRAFT MECHANICAL LAYOUT AND DETAILS \nUNIT CODE                     : \nCON311306 \nUNIT DESCRIPTOR        :    This unit covers the knowledge, skills and attitudes required \nto manually draft mechanical drawing plans and layouts of \nheating, ventilating and air-conditioning or refrigeration, gas \npiping, vertical / horizontal / materials conveyor system, and \nfire protection system. \n \n \nELEMENT \n \nPERFORMANCE CRITERIA \nBold and italicized terms are elaborated in the  \nRange of Variable \n \n1. Plan and prepare for \nwork \n1.1 Work instruction is secured following standard operating \nprocedures (SOP) and interpreted according to \nmechanical layout drawing  job requirements \n1.2 Drawing tools, materials and equipment are identified \nbased on job requirements.  \n \n2.  Prepare and set-up \ntools and materials for \ndrawing \n2.1 Drawing tools, materials, and equipment are selected \nand prepared according to job requirements \n2.2 Set-up procedure for working drawing is performed \nfollowing job requirements \n  \n3. Lay-out mechanical \ndetails and drawings \n3.1 Sheet requirement is accomplished following technical \ndrawing standards and symbols \n3.2 Sheet requirement is reviewed based on technical \ndrawing standards and symbols \n3.3 Sheet requirement is re-accomplished following \ntechnical drawing standards, if necessary \n \n4. Submit complete \ndrawings \n4.1 Complete drawing is submitted to personnel following \nSOP. \n4.2 Comments and corrections are noted for final drawings \nfollowing SOP. \n4.3 Comments and corrections are integrated into final \ndrawing based on job requirements \n4.4 Housekeeping procedure is performed following SOP\n\n--- PDF PAGE 55 ---\nTECHNICAL DRAFTING NC II           Promulgated May 2008                       Amended April 2010                                       54 \n RANGE OF VARIABLES \n \nVARIABLE \n \n \nRANGE \n1 Mechanical layout \ndrawing job \nrequirements  \n1.1 Heating, ventilating, and air-conditioning (HVAC) or \nrefrigeration layout \n1.2 Gas piping layout \n1.3 Vertical / horizontal pedestrian / materials conveyor \nsystem layout  \n1.4 Fire protection system layout \n1.5 General notes and symbols \n \n2. Drawing tools \nMay include but not limited to: \n2.1 Drawing board \n2.2 T-square \n2.3 Triangles \n2.4 Scale \n2.5 Technical pens and pencils \n2.6 Erasers \n2.7 Drawing templates  \n2.8 Sharpener  \n \n3. Materials  \n3.1 Tracing paper \n       3.1.1 Sketch \n       3.1.2 Final  \n3.2 Blueprint  \n \n4. Set-up procedure  \n4.1 Alignment of T-square with tracing paper \n4.2 Proportioning of drawings within the sheet of \n      paper \n  \n5. Technical drawing \nstandards and symbols \n5.1 Lines \n5.2 Letterings \n5.3 Targets \n5.4 Labeling \n5.5 Dimensioning  \n \n6. Personnel  \n6.1 Job captain \n6.2 Senior draftsman  \n6.3 Supervisor  \n \n7. Housekeeping \nprocedure \n7.1 Clean drawing tools and equipment \n7.2 Store drawing tools and equipment \n7.3 Clean work area\n\n--- PDF PAGE 56 ---\nTECHNICAL DRAFTING NC II           Promulgated May 2008                       Amended April 2010                                       55 \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \n \nEvidence must show the candidate: \n1.1 Demonstrates ability to interpret mechanical layout \ndrawing job requirements \n1.2 Demonstrates ability to identify, select, prepare and use \ndrawing tools, materials and equipment  \n1.3 Demonstrates ability to perform set-up procedure \nfollowing job requirements \n1.4 Demonstrates ability to lay-out drawings and details \nbased on standard mechanical  symbols \n1.5 Demonstrates ability to submit complete drawings \naccording to job schedule \n  \n2. Underpinning \nknowledge \n \n2.1 Architectural and mechanical working drawings \n2.2 Drawing tools, materials and equipment  \n2.3 Procedure for setting-up drawing equipment \n2.4 Procedure to lay-out drawings and details \n2.5 Company rules and regulations and SOP \n2.6 Architectural and mechanical terms \n \n3. Underpinning skills \n \n3.1 Interpreting architectural and mechanical  working \ndrawings and symbols \n3.2 Identifying, selecting, preparing and using drawing tools, \nmaterials and equipment  \n3.3 Following procedures for setting-up drawing equipment  \n3.4 Following procedures for lay-out drawing and details  \n3.5 Following company rules and regulations and SOP  \n3.6 Architectural and mechanical terms \n \n4. Resource implications \n \nThe following resources MUST be provided \n4.1 Architectural and engineering base plans and working \ndrawing  \n4.2 Drawing tools, materials and equipment  \n \n5.  Methods of Assessment \n \nCompetencies maybe assessed using the following \n5.1 Observation of practical skills with oral questioning \n5.2 Written test  \n5.3 Portfolio \n5.4 Third party report \n \n6.  Context of assessment \n \n6.1 Assessment maybe conducted in the workplace and in \nTESDA accredited assessment center.\n",
