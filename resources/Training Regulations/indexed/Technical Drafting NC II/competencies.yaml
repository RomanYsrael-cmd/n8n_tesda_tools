  "source_section_text": "SECTION 2\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the competency standards\nrequired in TECHNICAL DRAFTING NC II. These competencies are categorized\ninto basic, common and core units of competency.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY: PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto gather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n\n1. Obtain and convey\nworkplace information\n1.1 Specific and relevant information is accessed from\nappropriate sources\n1.2 Effective questioning , active listening and speaking\nskills are used to gather and convey information\n1.3 Appropriate medium is used to transfer information and\nideas\n1.4 Appropriate non- verbal communication is used\n1.5 Appropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6 Defined workplace procedures for the location and\nstorage of information are used\n1.7 Personal interaction is carried out clearly and concisely\n\n2. Participate in workplace\nmeetings and\ndiscussions\n2.1 Team meetings are attended on time\n2.2 Own opinions are clearly expressed and those of others\nare listened to without interruption\n2.3 Meeting inputs are consistent with the meeting purpose\nand established protocols\n2.4 Workplace interactions are conducted in a courteous\nmanner\n2.5 Questions about simple routine workplace procedures\nand matters concerning working conditions of\nemployment are asked and responded to\n2.6 Meetings outcomes are interpreted and implemented\n\n--- PDF PAGE 6 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 5\n3. Complete relevant\nwork related\ndocuments\n3.1 Range of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2 Workplace data is recorded on standard workplace forms\nand documents\n3.3 Basic mathematical processes are used for routine\ncalculations\n3.4 Errors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5 Reporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 7 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 6\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1 Team members\n1.2 Suppliers\n1.3 Trade personnel\n1.4 Local government\n1.5 Industry bodies\n\n2. Medium\n2.1 Memorandum\n2.2 Circular\n2.3 Notice\n2.4 Information discussion\n2.5 Follow-up or verbal instructions\n2.6 Face to face communication\n\n3. Storage\n3.1 Manual filing system\n3.2 Computer-based filing system\n\n4. Forms\n4.1 Personnel forms, telephone message forms, safety reports\n\n5. Workplace interactions\n5.1 Face to face\n5.2 Telephone\n5.3 Electronic and two way radio\n5.4 Written including electronic, memos, instruction and forms,\nnon-verbal including gestures, signals, signs and\ndiagrams\n\n6. Protocols\n6.1 Observing meeting\n6.2 Compliance with meeting decisions\n6.3 Obeying meeting instructions\n\n--- PDF PAGE 8 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 7\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to prepare written communication\nfollowing standard format of the organization\n1.2 Demonstrates ability to access information using\ncommunication equipment\n1.3 Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4 Conveyed information effectively adopting the formal or\ninformal communication\n\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1 Effective communication\n2.2 Different modes of communication\n2.3 Written communication\n2.4 Organizational policies\n2.5 Communication procedures and systems\n2.6 Technology relevant to the enterprise and the individual’s\nwork responsibilities\n3. Underpinning Skills\n3.1 Follow simple spoken language\n3.2 Perform routine workplace duties following simple written\nnotices\n3.3 Participate in workplace meetings and discussions\n3.4 Complete work related documents\n3.5 Estimate, calculate and record routine workplace\nmeasures\n3.6 Basic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7 Ability to relate to people of social range in the workplace\n3.8 Gather and provide information in response to workplace\nrequirements\n\n4. Resource Implications\n4.1 Fax machine\n4.2 Telephone\n4.3 Writing materials\n4.4 Internet\n\n5. Methods of\nAssessment\n5.1 Direct Observation\n5.3 Oral interview and written test\n6. Context of Assessment 6.1 Competency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 9 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 8\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\nUNIT CODE : 500311106\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes to identify\nrole and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n\n1. Describe team role and\nscope\n1.1 The role and objective of the team is identified from\navailable sources of information\n1.2 Team parameters, reporting relationships and\nresponsibilities are identified from team discussions and\nappropriate external sources\n\n2. Identify own role and\nresponsibility within team\n2.1 Individual role and responsibilities within the team\nenvironment are identified\n2.2 Roles and responsibility of other team members are\nidentified and recognized\n2.3 Reporting relationships within team and external to team\nare identified\n\n3. Work as a team member 3.1 Effective and appropriate forms of communications used\nand interactions undertaken with team members who\ncontribute to known team activities and objectives\n3.2 Effective and appropriate contributions made to\ncomplement team activities and objectives, based on\nindividual skills and competencies and workplace\ncontext\n3.3 Observed protocols in reporting using standard\noperating procedures\n3.4 Contribute to the development of teamwork plans based\non an understanding of team’s role and objectives and\nindividual competencies of the members.\n\n--- PDF PAGE 10 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 9\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1 Work activities in a team environment with enterprise or\nspecific sector\n1.2 Limited discretion, initiative and judgement maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n2. Sources of information\n2.1 Standard operating and/or other workplace procedures\n2.2 Job procedures\n2.3 Machine/equipment manufacturer’s specifications and\ninstructions\n2.4 Organizational or external personnel\n2.5 Client/supplier instructions\n2.6 Quality standards\n2.7 OHS and environmental standards\n\n3. Workplace context\n3.1 Work procedures and practices\n3.2 Conditions of work environments\n3.3 Legislation and industrial agreements\n3.4 Standard work practice including the storage, safe\nhandling and disposal of chemicals\n3.5 Safety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 11 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 10\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to operate in a team to complete\nworkplace activity\n1.2 Demonstrates ability to work effectively with others\n1.3 Demonstrates ability to convey information in written or\noral form\n1.4 Demonstrates ability to select and use appropriate\nworkplace language\n1.5 Demonstrates ability to follow designated work plan for\nthe job\n1.6 Demonstrates ability to report outcomes\n\n2. Underpinning\nKnowledge and\nAttitude\n2.1 Communication process\n2.2 Team structure\n2.3 Team roles\n2.4 Group planning and decision making\n\n3. Underpinning Skills\n3.1 Communicate appropriately, consistent with the\n culture of the workplace\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1 Access to relevant workplace or appropriately simulated\n environment where assessment can take place\n4.2 Materials relevant to the proposed activity or tasks\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation of the individual member in relation to the\nwork activities of the group\n5.2 Observation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3 Case studies and scenarios as a basis for discussion of\nissues and strategies in teamwork\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 11\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\nUNIT CODE : 500311107\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n\n1. Integrate personal\nobjectives with\norganizational goals\n1.1 Personal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2 Intra- and interpersonal relationships is are maintained in\nthe course of managing oneself based on performance\nevaluation\n1.3 Commitment to the organization and its goal is\ndemonstrated in the performance of duties\n\n2. Set and meet work\npriorities\n2.1 Competing demands are prioritized to achieve personal,\nteam and organizational goals and objectives\n2.2 Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3 Practices along economic use and maintenance of\nequipment and facilities are followed as per established\nprocedures\n\n3. Maintain professional\ngrowth and development\n3.1 Training and career opportunities are identified and\navailed of based on job requirements\n3.2 Recognition is sought/received and demonstrated as\nproof of career advancement\n3.3 Licenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 13 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 12\n\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n 2.3.1 Hardware\n 2.3.2 Software\n\n3. Training and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n\n4. Recognition\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciation\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 14 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 13\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to attain job targets within key result\nareas (KRAs)\n1.2 Demonstrates ability to maintain intra - and interpersonal\n relationship in the course of managing oneself based on\n performance evaluation\n1.3 Demonstrates ability to complete training and career\n opportunities which are based on the requirements of\n the industries\n1.4 Demonstrates ability to acquire and maintain licenses\n and/or certifications according to the requirement of the\n qualification\n\n2. Underpinning\nKnowledge\n2.1 Work values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender sensitivity\n2.5 Personal hygiene practices\n\n3. Underpinning Skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n\n4. Resource Implications\nThe following resources MUST be provided:\nWorkplace or assessment location\nCase studies/scenarios\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in the work place or in a\n simulated work place setting\n\n--- PDF PAGE 15 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 14\nUNIT OF COMPETENCY: PRACTICE OCCUPATIONAL HEALTH AND SAFETY\nPROCEDURES\nUNIT CODE : 500311108\nUNIT DESCRIPTOR : This unit covers the outcomes required to comply with\nregulatory and organizational requirements for occupational\nhealth and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n\n1. Identify hazards and\nrisks\n1.1 Safety regulations and workplace safety and hazard\ncontrol practices and procedures are clarified and\nexplained based on organization procedures\n1.2 Hazards/risks in the workplace and their corresponding\nindicators are identified to minimize or eliminate risk to co-\nworkers, workplace and environment in accordance with\norganization procedures\n1.3 Contingency measures during workplace accidents, fire\nand other emergencies are recognized and established in\naccordance with organization procedures\n\n2. Evaluate hazards and\nrisks\n2.1 Terms of maximum tolerable limits which when exceeded\nwill result in harm or damage are identified based on\nthreshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified safety hazards\nare reported to designated personnel in accordance with\nworkplace requirements and relevant workplace OHS\nlegislation\n\n3. Control hazards and\nrisks\n3.1 Occupational Health and Safety (OHS) procedures for\n controlling hazards/risks in workplace are consistently\n followed\n3.2 Procedures for dealing with workplace accidents, fire\n and emergencies are followed in accordance with\n organization OHS policies\n3.3 Personal protective equipment (PPE) is correctly used\n in accordance with organization OHS procedures and\n practices\n3.4 Appropriate assistance is provided in the event of a\n workplace emergency in accordance with established\n organization protocol\n\n--- PDF PAGE 16 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 15\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n\n4. Maintain OHS\nawareness\n4.1 Emergency-related drills and training are participated in\nas per established organization guidelines and\nprocedures\n4.2 OHS personal records are completed and updated in\naccordance with workplace requirements\n\nRANGE OF VARIABLES\n\n--- PDF PAGE 17 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 16\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health Standards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure, noise,\n vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants, parasites,\n mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke,\n gasses, vapors\n2.4 Ergonomics\n 2.4.1 Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n 2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n\n3. Contingency measures May include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n--- PDF PAGE 18 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 17\nVARIABLE\nRANGE\n5. Emergency-related\ndrills and training\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6. OHS personal records\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n EVIDENCE GUIDE\n\n--- PDF PAGE 19 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 18\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to explain clearly established\n workplace safety and hazard control practices and\n procedures\n1.2 Demonstrates ability to identify hazards/risks in the\n workplace and its corresponding indicators in\n accordance with company procedures\n1.3 Demonstrates ability to recognize contingency measures\n during workplace accidents, fire and other emergencies\n1.4 Demonstrates ability to identify terms of maximum\n tolerable limits based on threshold limit value- TLV\n1.5 Demonstrates ability to follow Occupational Health and\n Safety (OHS) procedures for controlling hazards/risks in\n workplace\n1.6 Demonstrates ability to use PPE in accordance with\ncompany OHS procedures and practices\n1.7 Completed and updated OHS personal records in\n accordance with workplace requirements\n\n2. Underpinning\nKnowledge and\n Attitude\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n\n3. Underpinning\n Skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n\n4. Resource Implications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n\n--- PDF PAGE 20 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 19\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\n simulated work place setting\n\nCOMMON COMPETENCIES\n\n--- PDF PAGE 21 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 20\n\nUNIT OF COMPETENCY:\nPERFORM MENSURATIONS AND CALCULATIONS\nUNIT CODE :\nCON311203\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nidentifying and measuring objects based on the required\nperformance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variable\n\n1. Select measuring\ninstruments\n\n1.1 Object or component to be measured is identified,\nclassified and interpreted according to the appropriate\nregular geometric shape\n1.2 Measuring tools are selected/identified as per object to be\nmeasured or job requirements\n1.3 Correct specifications are obtained from relevant sources\n1.4 Appropriate measuring instruments are selected\naccording to job requirements\nAlternative measuring tools are used without sacrificing\ncost and quality of work\n\n2. Carry out\nmeasurements and\ncalculations\n\n2.1 Accurate measurements are obtained according to job\nrequirements\n2.2 Alternative measuring tools are used without sacrificing\ncost and quality of work\n2.3 Calculation needed to complete work tasks are\nperformed using the four basic process of addition (+),\nsubtraction (-), multiplication (x) and division (/) including\nbut not limited to: trigonometric functions, algebraic\ncomputations\n2.4 Calculations involving fractions, percentages and mixed\nnumbers are used to complete workplace tasks\n2.5 Numerical computation is self-checked and corrected for\naccuracy\n2.6 Instruments are read to the limit of accuracy of the tool\n2.7 Systems of measurement identified and converted\naccording to job requirements/ISO\n2.8 Work pieces are measured according to job requirements\n\n--- PDF PAGE 22 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 21\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Geometric shape\n\n Including but is not limited to:\n1.1 Round\n1.2 Square\n1.3 Rectangular\n1.4 Triangle\n1.5 Sphere\n1.6 Conical\n\n2. Measuring instruments\nIncluding but not limited to:\n2.1 Micrometer (In-out, depth)\n2.2 Vernier caliper (out, inside)\n2.3 Dial gauge with mag, std.\n2.4 Straight edge\n2.5 Thickness gauge\n2.6 Torque gauge\n2.7 Small hole gauge\n2.8 Telescopic gauge\n2.9 Try-square\n2.10 Protractor\n2.11 Combination gauge\n2.12 Steel rule\n2.13 Voltmeter\n2.14 Ammeter\n2.15 Mega ohmeter\n2.16 Kilowatt hour meter\n2.17 Gauges\n2.18 Thermometers\n\n3. Measurements and\ncalculations\n\n3.1 Linear\n3.2 Volume\n3.3 Area\n3.4 Wattage\n3.5 Voltage\n3.6 Resistance\n3.7 Amperage\n3.8 Frequency\n3.9 Impedance\n\n--- PDF PAGE 23 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 22\n\nVARIABLE\nRANGE\n\n3.10 Conductance\n3.11 Capacitance\n3.12 Displacement\n3.16 Inside diameter\n3.17 Circumference\n3.18 Length\n3.19 Thickness\n3.20 Outside diameter\n3.21 Taper\n3.22 Out of roundness\n3.23 Oil clearance\n3.24 End play/Thrust clearance\n\n--- PDF PAGE 24 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 23\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Demonstrates ability to select and prepare measuring\ninstruments in accordance with job requirements\n1.2 Demonstrates ability to perform measurements and\ncalculations according to job requirements/ ISO\n\n2. Underpinning\nknowledge\n\nTRADE MATHEMATICS / MENSURATION\n2.1 Four fundamental operation\n2.2 Linear measurement\n2.3 Dimensions\n2.4 Unit conversion\n2.5 Ratio and proportion\n2.6 Trigonometric functions\n2.8 Algebraic equations\n\n3. Underpinning skills\n3.1 Performing calculation by addition, subtraction,\nmultiplication and division; trigonometric functions and\nalgebraic equations\n3.2 Visualizing objects and shapes\n3.3 Interpreting formulas for volume, areas, perimeters of\nplane and geometric figures\n3.4 Proper handling of measuring instruments\n\n4. Resource implications The following resources should be provided:\n4.1 Workplace location\n4.2 Problems to solve\n4.3 Measuring instrument appropriate to carry out tasks\n4.4 Instructional materials relevant to the propose activity\n\nAssessment of underpinning knowledge and practical skills\nmay be combined\n\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Actual demonstration\n5.2 Direct observation\n5.3 Written test/questioning related to underpinning\nknowledge\n\n6. Context of\nassessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n6.3 Competency assessment must be undertaken in\naccordance with the TESDA assessment guidelines\n\n--- PDF PAGE 25 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 24\n\nUNIT OF COMPETENCY:\nINTERPRET TECHNICAL DRAWINGS AND PLANS\nUNIT CODE :\nCON311202\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nanalyzing and interpreting symbols, data and work plan based\non the required performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n\n1. Analyze signs, symbols\nand data\n\n1.1 Technical plans are obtained according to job\nrequirements\n1.2 Signs, symbols and data are identified according to job\nspecifications\n1.3 Signs symbols and data are determined\n according to classification or as appropriate in\n drawing\n\n2. Interpret technical\ndrawings and plans\n2.1 Necessary tools, materials and equipment are identified\naccording to the plan\n2.2 Supplies and materials are listed according to\nspecifications\n2.3 Components, assemblies or objects are recognized as\nrequired\n2.4 Dimensions are identified as appropriate to the plan\n2.5 Specification details are matched with existing/available\nresources and in line with job requirements\n2.6 Work plan is drawn following the specifications\n\n3. Apply freehand\nsketching\n3.1 Where applicable, correct freehand sketching is\nproduced in accordance with the job requirements\n\n--- PDF PAGE 26 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 25\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Technical plans\nIncluding but not limited to:\n1.1 Electrical plans\n1.2 Structural plans\n1.3 Architectural plans\n1.4 Plumbing plans\n1.5 Welding Procedures Specifications (WPS)\n\n2. Work plan\n\n2.1 Job requirements\n2.2 Installation instructions\n2.3 Components instruction\n3. Classification\n\nIncluding but not limited to:\n3.1 Electrical\n3.2 Mechanical\n3.3 Plumbing\n\n4. Drawing\n4.1 Drawing symbols\n4.2 Alphabet of lines\n4.3 Orthographic views\n-\nFront view\n-\nRight side view/left side view\n-\nTop view\n-\nPictorial\n4.4 Schematic diagram\n4.5 Electrical drawings\n4.6 Structural drawings\n4.7 Plumbing drawings\n-\nWater\n-\nSewerage/Drainage\n-\nVentilation\n4.8 Welding symbols\n\n5. Tools and materials\nIncluding but not limited to:\n5.1 Compass\n5.2 Divider\n5.3 Rulers\n5.4 Triangles\n5.5 Drawing tables\n5.6 Computer\n\n--- PDF PAGE 27 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 26\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires that the candidate:\n1.1 Identified and determined signs, symbols and data\naccording to work plan, job requirements and\nclassifications\n1.2 Identified tools and equipment in accordance with job\nrequirements\n1.3 Listed supplies and materials according to blueprint\nspecifications\n1.4 Drawn workplan following specifications\n1.5 Determined job specifications based on working/technical\ndrawing\n\n2. Underpinning\nknowledge\n\n2.1 TRADE MATHEMATICS\n 2.1.1 Linear measurement\n 2.1.2 Dimension\n 2.1.3 Unit conversion\n2.2 BLUEPRINT READING AND PLAN SPECIFICATION\n 2.2.1 Electrical, mechanical plan, symbols and\nabbreviations\n 2.2.2 Drawing standard symbols\n2.3 TRADE THEORY\n 2.3.1 Basic technical drawing\n 2.3.2 Types technical plans\n 2.3.3 Various types of drawings\n 2.3.4 Notes and specifications\n\n3. Underpinning skills\n3.1 Interpreting drawing/orthographic drawing\n3.2 Interpreting technical plans\n3.3 Matching specification details with existing resources\n3.4 Following instructions\n3.5 Handling of drawing instruments\n\n4. Resource implications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Drawings and specification relevant to task\n4.3 Materials and instrument relevant to proposed activity\n\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Questions/interview\n5.3 Written test related to underpinning knowledge\n\n--- PDF PAGE 28 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 27\n6. Context of\nassessment\n6.1 Competency assessment may occur in the workplace or in\nany appropriate simulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n6.3 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 29 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 28\n\nUNIT TITLE:\nAPPLY QUALITY STANDARDS\nUNIT CODE:\nFUR714202\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills, attitudes required to\napply quality standards in the workplace. The unit also includes\nthe application of relevant safety procedures and regulations,\norganization procedures and customer requirements.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n\n1. Assess quality of\n received materials or\n components\n1.1 Received materials or component parts are checked\n based on material specifications\n1.2 Defective material or components are identified and\n isolated following standard operating procedures\n1.3 Defective materials or components are replaced in\n accordance with workplace procedures.\n\n2. Assess own work\n2.1 Documents relative to quality within the company is\n identified and used\n2.2 Completed work is checked based on workplace standards\n relevant to the task undertaken\n2.3 In cases of deviations from specified quality standards,\n causes are documented and reported in accordance with\n the workplace’ standards operating procedures\n\n3. Engage in process\n improvement\n3.1 Process improvement procedures are participated in\n relation to workplace assignment\n3.2 Work is carried out in accordance with process\n improvement procedures\n3.3 Performance of operation or quality of product or service is\n monitored in accordance to customer satisfaction\n\nRANGE OF VARIABLES\n\n--- PDF PAGE 30 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 29\nVARIABLE\nRANGE\n1. Materials /\n components\nMay include but not limited to:\n1.1 Electrical materials and consumables\n1.2 Welding materials and consumables\n1.3 Furniture making materials and consumables\n1.4 Carpentry materials and consumables\n1.5 Masonry materials and consumables\n1.6 Heavy equipment materials and consumables\n\n2. Defective\nMay include but not limited to:\n2.1 Components / materials do not conform to specification\n2.2 Components / materials containing manufacturing defects\n2.3 Components / materials do not conform with government\n regulation i.e., PEC, environmental code\n2.4 Components / materials possessed safety defects\n\n3. Documents\nMay include but not limited to:\n3.1 Organization work procedures / reports\n3.2 Manufacturer’s instruction manual\n3.3 Customer requirements\n3.4 Forms\n\n4. Quality standards\nMay include but not limited to:\n4.1 Materials / consumables\n4.2 Component parts\n4.3 Final product\n4.4 Production processes\n4.5 Methods\n\n5. Customer\nMay include but not limited to:\n5.1 Co-worker\n5.2 Supplier\n5.3 Client\n5.4 Organization receiving the product or service\n\n--- PDF PAGE 31 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 30\nEVIDENCE GUIDE\n1. Critical aspect of\n competency\nAssessment must show that the candidate:\n1.1 Demonstrates ability to follow company’s standard\n operating procedures\n1.2 Demonstrates knowledge of types and uses of materials\n and component parts\n1.3 Demonstrates knowledge of quality standards\n1.4 Demonstrates ability to follow process improvement\n procedures\n\n2. Underpinning\n knowledge\n2.1 Production processes\n2.2 Types and uses of materials and components\n2.3 Company standard operating procedures\n2.4 Safety practices and applications\n\n3. Underpinning skills\n3.1 Following production processes\n3.2 Checking of materials and component parts and finished\n products\n3.3 Following company standard operating procedures\n3.4 Applying safety practices\n\n4. Method of\n assessment\n4.1 Observation of practical skills\n4.2 Oral questions\n\n5. Resource implication\n\nThe following materials must be provided:\n5.1 Materials and component parts relevant to the activity\n5.2 Documents related to quality\n\n6. Context of\n Assessment\n\n6.1 Assessment may be conducted in the workplace or in a\n simulated environment.\n\n--- PDF PAGE 32 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 31\nUNIT OF COMPETENCY: OPERATE A PERSONAL COMPUTER\nUNIT CODE\nICT311201\nUNIT DESCRIPTOR\nThis unit defines the competency required to operate a\npersonal computer by: starting the PC, logging in, using and\nworking with files, folders and programs, saving work, and\nclosing down the PC.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variables\n\n1. Start the computer\n1.1 The peripheral devices are properly connected\n1.2 Power is checked and the computer and peripheral\ndevices are switched on\n1.3 Proper logging in and logging off is successfully done\n1.4 The operating system features and functions are\naccessed and navigated\n1.5 Hardware configuration and other system features are\nchecked\n\n2. Arrange and\ncustomize desktop\ndisplay/ Windows\nsettings\n\n2.1 The desktop screen or Windows elements are changed as\nneeded\n2.2 Desktop icons are added, renamed, moved, copied or\ndeleted\n2.3 The online help functions are accessed or used as\nneeded\n2.4 Desktop icons of application programs are selected,\nopened and closed\n2.5 Properties of icons are displayed\n2.6 Computer or desktop settings are saved and restored\n\n3. Work with files and\nfolders (or directories)\n\n3.1 A file or folder is created, opened, moved, renamed or\ncopied\n3.2 Files are located, deleted and restored\n3.3 Details and properties of files and folders are displayed or\nviewed\n3.4 Various files are organized for easy lookup and use\n3.5 Files and information are searched\n3.6 Disks are checked, erased or formatted as necessary\n\n--- PDF PAGE 33 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 32\n4. Work with user\napplication programs\n4.1 Application programs are added, changed, removed or\nran\n4.2 User software or application program are installed,\nupdated and upgraded\n4.3 Information/data are moved between documents or files\n\n5. Print information\n5.1 Printer is added or installed and correct printer settings\nis ensured\n5.2 Default printer is assigned accordingly\n5.3 Information or document is printed on the installed printer\n5.4 Progress of print jobs are viewed and deleted as required\n6. Shut down computer\n6.1 All open application programs are closed\n6.2 Computer and peripheral devices are properly shut down\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Peripheral device\nThis may include but is not limited to:\n1.1 Mouse\n1.2 Keyboard\n\n--- PDF PAGE 34 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 33\n1.3 Monitor or visual display unit\n1.4 Printer\n1.5 Scanner\n\n2. Computer\nMay include:\n2.1 Laptops/notebooks\n2.2 Workstations\n2.3 Servers\n2.4 Other personal computer devices\n\n3. Application programs\nCan include:\n3.1 User programs\n3.2 Database programs\n3.3 Word processors\n3.4 Email programs\n3.5 Internet browsers\n3.6 System browsers\n3.7 Spreadsheets\n\n4. Operating system\nMay include but is not limited to the various versions and\nvariants of:\n4.1 Windows\n4.2 NT\n4.3 Mac OS\n4.4 Linux\n4.5 Solaris\n4.6 Unix\n\n5. System features\nMay include but is not limited to the operating system features\nand hardware features like:\n5.1 Memory size\n5.2 Disk capacities\n5.3 Video cards\n5.4 USBs\n5.5 Modems\n5.6 1394 and LAN connectors\n5.7 SD and PC cards\n5.8 Wireless and infrared connections.\n\n--- PDF PAGE 35 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 34\n6. Online help functions\n6.1 An instruction manual or a portion of the manual,\nintegrated and accessible from within the program or\nsoftware being used.\n\n7. Properties\nIndicates the description of the file or folder to include the:\n7.1 File name\n7.2 Type of file\n7.3 File size\n7.4 Date created and modified\n7.5 Attributes (hidden, read-only).\n\n8. Various files\n8.1 Documents\n8.2 Records\n8.3 Pictures\n8.4 Music\n8.5 Video\n\n9. Disks\nMay include but is not limited to:\n9.1 Floppy disks\n9.2 CDs\n9.3 CD-RW (Compact discs-Read/Write)\n9.4 DVD RW\n9.5 Zip disks\n9.6 Flash drives\n9.7 Memory sticks\n9.8 Hard drives\n\n10. Printer settings\nThe properties of the printer that enables it to work includes:\n10.1 Page layout\n10.2 Paper size\n10.3 Ink/cartridge type\n10.4 Number of copies\n10.5 Page orientation.\n\n--- PDF PAGE 36 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 35\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\n1.1 Assessment must confirm the ability to utilize software,\nnavigate the desktop using system features to perform\ntasks and save results of work.\n\n2. Underpinning\nKnowledge\nKnowledge includes:\n2.1 Keyboard layout and functions\n2.2 Computer functions\n2.3 Basic parts of a computer and various hardware\ncomponents\n2.4 Storage devices and file concepts\n2.5 Basic software operation and functionalities\n\n3. Underpinning Skills\nSkills include:\n3.1 Saving and retrieving files to and from various folders or\ndisk storage\n3.2 Mouse and keyboarding skills for running software\napplications\n3.3 Reading and writing at a level where basic workplace\ndocuments are understood\n3.4 Clear ability to communicate with peers and supervisors\n3.5 Interpretation of user manuals and help functions\n3.6 The ability to carry out written and verbal instructions\nusing a personal computer whether standalone or in a\nnetworked environment\n\n4. Resource Implications\nTo demonstrate competence in this unit access to the\nfollowing resources will be required:\n4.1 A personal computer\n4.2 A printer\n4.3 Mouse and keyboard\n4.4 Basic systems software\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Observation in a workplace or simulated environment\n5.2 Third party reports\n5.3 Exams and tests\n5.4 Demonstration of required skills\n5.5 Interviews\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated work environment.\n\n--- PDF PAGE 37 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 36\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY:\nDRAFT ARCHITECTURAL LAY-OUTS AND DETAILS\nUNIT CODE :\nCON311301\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\nmanually draft architectural - site development plan, floor plan,\nceiling, elevation and section, and working drawing details.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\n Range of Variable\n\n1. Plan and prepare for\nwork\n1.1 Work instruction is secured following standard operating\nprocedures (SOP) and interpreted according to\narchitectural job requirements\n1.2 Drawing tools, materials and equipment are identified\nbased on job requirements.\n\n2. Prepare and set-up\ntools and materials for\ndrawing\n2.1 Drawing tools, materials, and equipment are selected and\nprepared according to job requirements\n2.2 Set-up procedure for working drawing is performed\nfollowing job requirements\n\n3. Lay-out architectural\ndrawings and details\n3.1 Sheet requirement is accomplished following technical\ndrawing standards\n3.2 Sheet requirement is reviewed based on technical\ndrawing standards\n3.3 Sheet requirement is revised following technical drawing\nstandards, if necessary\n\n4. Submit complete\ndrawings\n4.1 Complete drawing is submitted to personnel following\nSOP.\n4.2 Comments and corrections are noted for final drawings\nfollowing SOP.\n4.3 Comments and corrections are integrated into final\ndrawing based on job requirements\n4.4 Housekeeping procedure is performed following SOP\n\nRANGE OF VARIABLES\n\n--- PDF PAGE 38 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 37\n\nVARIABLE\n\nRANGE\n1. Architectural job\nrequirements\n1.1 Site development plan\n1.2 Floor, ceiling and roof plans\n1.3 Elevations and sections\n1.4 Working drawing details\n1.5 General notes and symbols\n\n2. Drawing tools\nMay include but not limited to:\n2.1 Drawing board\n2.2 T-square\n2.3 Triangles\n2.4 Scale\n2.5 Technical pens and pencils\n2.6 Erasers\n2.7 Drawing templates\n2.8 Sharpener\n\n3. Materials\n3.1 Tracing paper\n 3.1.1 Sketch\n 3.1.2 Final\n3.2 Blueprint\n\n4. Set-up procedure\nManual\n4.1 Alignment of T-square with tracing paper\n4.2 Proportioning of drawings within the sheet of\n paper\n\n5. Technical drawing\nstandards\n5.1 Lines\n5.2 Letterings\n5.3 Targets\n5.4 Labeling\n5.5 Dimensioning\n\n6. Personnel\n6.1 Job captain\n6.2 Senior draftsman\n6.3 Supervisor\n\n7. Housekeeping\n procedure\n7.1 Clean drawing tools and equipment\n7.2 Store drawing tools and equipment\n7.3 Clean work area\n\n--- PDF PAGE 39 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 38\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nEvidence must show the candidate can:\n1.1 Demonstrates ability to interpret architectural job\nrequirements\n1.2 Demonstrates ability to identify, select, prepare and use\ndrawing tools, materials and equipment\n1.3 Demonstrates ability to perform set-up procedure\nfollowing job requirements\n1.4 Demonstrates ability to lay-out drawings and details\n1.5 Demonstrates ability to submit complete drawings\naccording to job schedule\n\n2. Underpinning\nknowledge\n\n2.1 Architectural working drawing\n2.2 Drawing tools, materials and equipment\n2.3 Procedure for setting-up drawing equipment\n2.4 Procedure to lay-out drawings and details\n2.5 Company rules and regulations and SOP\n2.6 Architectural terms\n\n3. Underpinning skills\n\n3.1 Interpreting architectural working drawing\n3.2 Identifying, selecting, preparing and using drawing tools,\nmaterials and equipment\n3.3 Following procedures for setting-up drawing equipment\n3.4 Following procedures for lay-out drawing and details\n3.5 Following company rules and regulations and SOP\n3.6 Using architectural terms\n\n4. Resource implications\n\nThe following resources MUST be provided\n4.1 Architectural working drawing\n4.2 Drawing tools, materials and equipment\n\n5. Methods of Assessment\n\nCompetencies maybe assessed using the following\n5.1 Observation of practical skills with oral questioning\n5.2 Written test\n5.3 Portfolio\n5.4 Third party report\n\n6. Context of assessment\n\n6.1 Assessment maybe conducted in the work place and in\nTESDA accredited assessment center.\n\nUNIT OF COMPETENCY:\nPREPARE COMPUTER-AIDED DRAWINGS\n\n--- PDF PAGE 40 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 39\nUNIT CODE :\nCON311302\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto prepare drawings such as architectural, structural,\nelectrical and electronic, sanitary / plumbing and mechanical\nworking drawings using CAD software and hardware.\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variable\n\n1. Plan and prepare for\nwork\n1.1 Work instruction is secured following standard operating\nprocedures (SOP) and interpreted according to drawing\njob requirements\n1.2 Drawing guidelines and parameters, materials, tools\nand equipment are identified based on job\nrequirements.\n\n2. Prepare tools and\nmaterials and set-up\nequipment for drawing\n2.1 Material is selected and prepared according to job\nrequirements.\n2.2 System set-up procedure for working drawing is\nperformed following job requirements\n\n3. Lay-out and produce\ncomputer-aided\ndrawings and details\n3.1 Sheet requirement accomplishment procedure is\nperformed following technical drawing standards and\nsymbols\n3.2 Review procedure for final drawing is performed\nfollowing job requirements.\n3.3 Page set-up and scaling procedure is performed based\non technical drawing requirements and printer\ncharacteristics.\n3.4 Saving and backup procedure for final working drawing\nis performed in accordance with enterprise procedure.\n\n4. Submit complete\ndrawing\n4.1 Complete drawing is submitted to personnel following\nSOP.\n4.2 Comments and corrections are noted for final drawings\nfollowing SOP.\n4.3 Comments and corrections are integrated into final\ndrawing based on job requirements\n4.4 Housekeeping procedure is performed following SOP\n\nRANGE OF VARIABLES\n\n--- PDF PAGE 41 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 40\n\nVARIABLE\n\nRANGE\n1. Drawing job\nrequirements\n1.1 Architectural\n1.2 Structural\n1.3 Electrical and electronic\n1.4 Sanitary / plumbing\n1.5 Mechanical\n\n2. Materials, tools and\nequipment\nMay include but not limited to:\nMaterials and consumables\n2.1 Pen / pencil\n2.2 Ink\n2.3 Paper\n2.4 Flashdisk\n2.5 External drive\n2.6 Recordable or rewritable CD\nDrawing tools\n2.7 CAD software\n2.7.1 AUTOCAD\n2.7.2 Intellicad\n2.7.3 Intericad\n2.7.4 Sketchup\nEquipment\n2.8 Computer hardware\n2.9 Plotter\n2.10 Printer\n\n3. System set-up\nprocedure\n3.1 Selection of work space\n3.2 Selection of toolbars\n3.3 Definition of layers\n3.3.1 Colors\n3.3.2 Line type\n3.3.3 Line weight\n3.3.4 Layer description\n3.4 Automatic saving and recovery\n\n--- PDF PAGE 42 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 41\n4. Sheet requirement\naccomplishment\nprocedure\nMay include but are not limited to:\n4.1 Drawing commands\n4.1.1 Lines\n4.1.2 Circles\n4.1.3 Ellipse\n4.1.4 Multi-lines\n4.1.5 Polylines\n4.2 Modifications command\n4.2.1 Trim\n4.2.2 Fillet\n4.2.3 Break\n4.2.4 Offset\n4.2.5 Extend\n4.2.6 Copy\n\n5. Technical drawing\nstandards and symbols\n5.1 Lines\n5.2 Letterings\n5.3 Targets\n5.4 Labeling\n5.5 Dimensioning\n\n6. Review procedure\n6.1 Work space\n6.2 Printed copy\n\n7. Personnel\n7.1 Job captain\n7.2 Senior draftsman\n7.3 Supervisor\n\n8. Housekeeping\nprocedure\n8.1 Clean drawing equipment\n8.2 Store drawing materials and storage media\n8.3 Clean work area and drawing equipment\n\n--- PDF PAGE 43 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 42\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nEvidence must show the candidate:\n1.1 Demonstrates ability to interpret drawing job\nrequirements\n1.2 Demonstrates ability to identify, select, and prepare\ndrawing materials and use drawing tools and equipment\n1.3 Demonstrates ability to perform set-up procedure\nfollowing job requirements\n1.4 Demonstrates ability to lay-out produce computer-aided\ndrawings and details\n1.5 Demonstrates ability to submit complete drawings\naccording to job schedule\n\n2. Underpinning\nknowledge\n\n2.1 Architectural, structural, electrical and electronic,\nsanitary / plumbing and mechanical working drawings\n2.2 Drawing materials and equipment and tools\n2.3 Procedure for setting-up system for drawing equipment\n2.4 Procedure to lay-out produce computer-aided drawings\nand details\n2.5 Company rules and regulations and SOP\n2.6 Architectural, structural, electrical and electronic,\nsanitary / plumbing and mechanical terms\n\n3. Underpinning skills\n\n3.1 Interpreting architectural, structural, electrical and\nelectronic, sanitary / plumbing and mechanical working\ndrawings and symbols\n3.2 Identifying, selecting, preparing and using drawing tools,\nmaterials and equipment\n3.3 Following procedures for setting-up drawing equipment\n3.4 Following procedures for lay-out drawing and details\n3.5 Following company rules and regulations and SOP\n3.6 Architectural, structural, electrical and electronic,\nsanitary / plumbing and mechanical terms\n\n4. Resource implications\n\nThe following resources MUST be provided\n4.1 Architectural and engineering base plans and working\ndrawing\n4.2 Drawing materials, equipment and software\n\n--- PDF PAGE 44 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 43\n5. Methods of Assessment\n\nCompetencies maybe assessed using the following\n5.1 Observation of practical skills with oral questioning\n5.2 Written test\n5.3 Portfolio\n5.4 Third party report\n\n6. Context of assessment\n\n6.1 Assessment maybe conducted in the workplace or in\nTESDA accredited assessment center.\n\n--- PDF PAGE 45 ---\nTECHNICAL DRAFTING NC II Promulgated May 2008 Amended April 2010 44\nELECTIVE COMPETENCIES\n\nUNIT OF COMPETENCY:\nDRAFT STRUCTURAL LAY-OUTS AND DETAILS\nUNIT CODE :\nCON311303\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto manually draft structural - foundation plan, framing plans,\nstructural drawing details\n\nELEMENT\n\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variable\n\n1. Plan and prepare for\nwork\n1.1 Work instruction is secured following standard operating\nprocedures (SOP) and interpreted according to\nstructural job requirements\n1.2 Drawing tools, materials and equipment are identified\nbased on job requirements.\n\n2. Prepare and set-up tools\nand materials for\ndrawing\n2.1 Drawing tools, materials, and equipment are selected\nand prepared according to job requirements\n2.2 Set-up procedure for working drawing is performed\nfollowing job requirements\n\n3. Lay-out structural\ndrawings and details\n3.1 Sheet requirement is accomplished following technical\ndrawing standards\n3.2 Sheet requirement is reviewed based on technical\ndrawing standards\n3.3 Sheet requirement is re-accomplished following\ntechnical drawing standards, if necessary\n\n4. Submit complete\ndrawings\n4.1 Complete drawing is submitted to personnel following\nSOP.\n4.2 Comments and corrections are noted for final drawings\nfollowing SOP.\n4.3 Comments and corrections are integrated into final\ndrawing based on job requirements\n4.4 Housekeepi