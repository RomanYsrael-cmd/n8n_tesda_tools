        "source_title": "DISPENSE NON-BULK INGREDIENTS",
        "source_text": "--- PDF PAGE 47 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n45\n \n \n \nUNIT OF COMPETENCY:   DISPENSE NON-BULK INGREDIENTS \n \nUNIT CODE                     :   AGR741307 \n \nUNIT DESCRIPTOR       :    This unit covers the skills, knowledge and Attitudes \nrequired to prepare, measure and/or weigh, and label non-\nbulk ingredients to meet production requirements. \n \n \nELEMENT\nPERFORMANCE CRITERIA \nBold italicized terms are elaborated in the Range of Variables \n1. Prepare to dispense \ningredients \n1.1. Materials are inspected to confirm type, quality \nclearance, quantities and identify any obvious \ncontamination or non-conformance with workplace \nrequirements \n1.2. Appropriate measuring/dispensing and weighing \nequipment are selected according to dispensing \nrequirements  \n1.3. Availability of containers/bags and labels are \nconfirmed according to dispensing requirements \n1.4. Pre-start checks are carried out according to \nmanufacturer’s specifications and workplace \nprocedures \n1.5. Appropriate personal protective equipment (PPE) \nis used according to workplace procedures and \noccupational health and safety (OHS) \nrequirements  \n2. Measure and/or weigh \ningredients \n2.1. Non-bulk ingredients and additives are \nweighed/measured according to production \nrequirements  \n2.2. Dispensed ingredients are labeled according to \nworkplace procedures \n2.3. Accurate of measuring/dispensing equipment is \nmonitored to identify variation in operating conditions \naccording to production requirements\n\n--- PDF PAGE 48 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n46\n \n2.4. Variation in equipment operation is identified and \nmaintenance requirements are reported according to \nworkplace reporting requirements \n2.5. Workplace is maintained according to housekeeping \nstandards  \n3. Complete the \ndispensing process \n3.1. Dispensing equipment is cleaned according to \nmanufacturer’s specifications and workplace \nprocedures \n3.2. Maintenance requirements and unacceptable \nequipment/utensil conditions are identified and \nreported according to workplace procedures \n3.3. Records are completed according to workplace \nprocedures\n\n--- PDF PAGE 49 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n47\n \n \nRANGE OF VARIABLES \n \nVARIABLE\nRANGE\n1. Materials \nNon-bulk ingredients / additives which may include but not \nlimited to: \n1.1 \nColors \n1.2 \nFlavors \n1.3 \nBuffered acids  \n1.4 \nPreservatives \n1.5 \nProcessing aids  \n1.6 \nSanitizing agents \n1.7 \nGRAS (Generally Recognized As Safe) and E \nnumbers\n2. Workplace \nrequirements \nMay include but not limited to: \n2.1. company policies and procedures \n2.2. standard Operating Procedures (SOPs) \n2.3. specifications, production/dispensing schedules and \ninstructions \n2.4. batch/recipe instructions \n2.5. manufacturers' advice \n2.6. standard forms and reports\n3. Measuring/Dispensing \nequipment \nMay include any one of the following: \n3.1 \nScales \n3.2 \nPipettes \n3.3 \nGraduated cylinders (dry and liquid) \n3.4 \nMeasuring cups \n3.5 \nThermometer \n3.6 \npH meter \n3.7 \nRefractometer \n3.8\nOther dispensing instruments and adjuncts\n4. Pre-start checks \nMay include but not limited to: \n4.1 \nInspecting equipment for calibration records and \nsticker \n4.2 \nInspecting equipment condition for any signs of wear \nand tear \n4.3 \nSelecting appropriate settings \n4.4 \nConfirming that equipment is clean and correctly \nconfigured for dispensing \n4.5 \nEnsuring safety guards are in place \n4.6 \nEnsuring that sensors and controls are correctly \npositioned \n4.7\nCanceling isolation or lockouts as required\n\n--- PDF PAGE 50 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n48\n5. Manufacturer’s \nspecifications \nMay include but not limited to: \n5.1. Handling requirements \n5.2. Operating requirements \n5.3. Calibration sticker \n5.4. Discharge label \n5.5. Reporting \n5.6. Testing \n5.7. Positioning \n5.8. Refilling \n6. Personal protective \nequipment (PPE) \nMay include but not limited to: \n6.1. Apron/laboratory gown \n6.2. Face masks \n6.3. Gloves \n6.4. Rubber boots/safety shoes \n6.5.\nHead gears such as caps, hair nets, ear plug\n7. OHS requirements \nOccupational Health and Safety requirements may include \nbut not limited to: \n7.1  Health/medical certificate \n7.2  DOLE requirements \n7.3  Personal hygiene and good grooming \n7.4  Plant sanitation and waste management \n7.5  Relevant permits (e.g. from City Hall) \n7.6  BFAD requirements \n7.7  PPE requirements  \n8. Label \nMay include but not limited to: \n8.1 \nName of material \n8.2 \nBatch number \n8.3 \nWeight/Measure \n8.4 \nDate of preparation \n8.5\nOperator/inspector/issuer\n9. Record \nMay include but not limited to: \n9.1 \nMaterials used  \n9.2 \nEquipment used \n9.3 \nEquipment faults, including repairs, servicing \nundertaken or recommended, preventive \nmaintenance activities \n9.4 \nOperational details \n9.5\nLabels\n\n--- PDF PAGE 51 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n49\n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n \n1.1. Prepared materials and equipment for dispensing  \n1.2. Measured and/or weighed ingredients \n1.3. Dispensed ingredients \n1.4. Used, cleaned and maintained dispensing equipment\n1.5. Followed work procedures \n1.6. Completed required records \n \nThe skills and knowledge required to dispense non-bulk \ningredients must be transferable to a different work \nenvironment. \n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this \nstandard in the workplace, to transfer the skills to other \ncontexts, and to deal with unplanned events.  The \nknowledge requirements for this competency standard are \nlisted below: \n \n2.1. Purpose and basic principles of the dispensing \nprocess \n2.2. Quality characteristics and related handling \nrequirements of materials \n2.3. Storage requirements and shelf life of ingredients \nand additives \n2.4. Contamination and food safety issues related to \ndispensing \n2.5. Corrective action implementation \n2.6. Basic operating principles of equipment \n2.7. Typical equipment malfunctions and related causes \n2.8. Pre-start checks on equipment \n2.9. Cleaning, sanitizing, care and storage of equipment \n2.10. Environmental issues and controls relevant to the \ndispensing process \n2.11. OHS hazards and controls \n2.12. Product/process changeover procedures and \nresponsibilities \n2.13. Awareness of Codes or Regulations such as \nHACCP and GMP\n\n--- PDF PAGE 52 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n50\nAttitudes: \n2.14. Accurate \n2.15. Honest \n2.16. Environment-conscious \n2.17. Positive work values \n2.18. Cost conscious \n2.19. Safety conscious \n2.20. Personal hygiene \n3. Underpinning Skills \n3.1 \nUse of basic equipment to support dispensing \nprocess \n3.2 \nMeasure materials and additives within the specified \naccurate range \n3.3 \nConduct pre-start checks on equipment \n3.4 \nCleaning and sanitation procedures for work area \nand equipment \n3.5 \nFollow work procedures \n3.6 \nOral and written communication skills \n3.7 \nWorking with others and in teams \n3.8 \nBasic mathematical skills  \n3.9 \nTime management \n3.10 Recording and reporting skills \n4. Methods of \nAssessment \nCompetency must be  assessed through: \n4.1. Direct observation with oral questioning \n4.2. Demonstration with oral questioning \n4.3.\nPortfolio\n5. Resource Implications \nThe following resources must be provided: \n5.1. Specific work area/station \n5.2. Dispensing equipment and other tools and \nequipment relevant to the proposed activity \n5.3. Materials relevant to the proposed activity \n5.4. Relevant workplace procedures, schedules and \nrecords \n6. Context of \nAssessment \n6.1. Assessment should occur on the job or in a \nsimulated workplace \n6.2. Ability to apply competency over time and on a \nnumber of occasions.\n",
