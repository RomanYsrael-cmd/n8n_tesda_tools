ing \n3.4  Plant sanitation and waste management \n3.5 \nRelevant permits \n3.6  BFAD requirements \n3.7\nPPE requirements\n\n--- PDF PAGE 55 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n53\n3.6.1 \napron/laboratory gown \n3.6.2 \nmouth masks \n3.6.3 \ngloves  \n3.6.4 \nrubber boots \n3.6.5\nhead gears such as caps, hairnets, ear plugs\n4. Specifications \nSpecifications may include but not limited to requirements in \nterms of:   \n4.1 Size \n4.2 Shape \n4.3 Weight \n4.4 Color \n4.5 Variety \n4.6 Maturity \n4.7 Freshness \n5. Washing \nWashing may include: \n5.1 Automated washing \n5.2 Manual washing \n6. Cleaning  \nCleaning may include but not limited to: \n6.1 Washing \n6.2 Brushing \n6.3 Separation of foreign material such as dirt, hair, mud, etc.\n6.4 Filtering \n7. Preparation \nFor raw materials, preparation may include any one but not \nlimited to: \n7.1 Cutting \n7.2 Chopping \n7.3 Grinding \n7.4 Crushing \n7.5 Mashing \n7.6 Draining \n7.7 Weighing \n8. Records \nMay include but not limited to: \n8.1. Materials used \n8.2. Date of preparation \n8.3. Location \n8.4. Batch number \n8.5. Weight/measure \n8.6. Name of person who prepared material\n\n--- PDF PAGE 56 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n54"
