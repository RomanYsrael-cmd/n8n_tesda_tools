          "source_text": "1. Perform Pre-\nOperation Activities  \n1.1. Appropriate tools and equipment/utensils are \nassembled according to food processing methods \n1.2. Food processing tools and equipment/utensils \nare inspected and checked according to \nmanufacturer’s specifications \n1.3. Food processing equipment is set up, adjusted  and \nreadied according to job requirements\n2. Operate Food \nprocessing \nEquipment \n \n \n \n \n \n \n2.1. Food processing equipment is switched on \naccording to manufacturer’s specifications \n2.2. Performance of food processing equipment is \nchecked to ensure conformity with specified output \n2.3. Operation of food processing equipment is managed \nto achieve planned outcomes \n2.4. Minor trouble shooting on food processing tools, \nequipment and utensils is performed when \nnecessary\n3. Perform Post-\nOperation Activities \n3.2 \nFood processing equipment is switched off and \nunplugged after  operation in accordance with \nmanufacturer’s specifications \n3.3 \nFood processing tools, equipment and instruments \nare cleaned, sanitized and stowed as required \naccording to manufacturer’s specifications and \nworkplace policies and regulations \n3.4 \nMinor preventive maintenance on equipment is \nperformed in line with organization’s maintenance \nsystem \n3.5 \nMain machine parts are inspected and checked in \nline with organization’s policy \n3.6 \nCondition of machine is monitored to ensure \nserviceability  in accordance with workplace rules \nand regulations\n\n--- PDF PAGE 27 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n25\n \n \nRANGE OF VARIABLES \n \n VARIABLE\nRANGE\n1.  Food Processing Methods\nFood Processing Methods include but not limited to: \n \n1.1 \nSalting \n1.2 \nCuring \n1.3 \nSmoking \n1.4 \nFermentation \n1.5 \nPickling \n1.6 \nCanning  \n1.7 \nBottling \n1.8 \nSugar concentration \n1.9 \nDrying  \n1.10  Dehydration \n2.   Food Processing Tools, \nEquipment and  Utensils \nTools, Equipment and Utensils used for but not limited \nto the following food processing methods: \n \n2.1. Salting \n2.2. Curing  \n2.3. Smoking  \n2.4. Fermentation  \n2.5. Pickling  \n2.6. Canning  \n2.7. Bottling  \n2.8. Sugar concentration \n2.9. Drying \n2.10. Dehydration \n3. Manufacturer’s \nSpecifications \nManufacturer’s specifications may include but not \nlimited to: \n \n3.1. Handling requirements \n3.2. Operating requirements \n3.3. Discharge Label \n3.4. Reporting \n3.5. Testing \n3.6. Positioning \n3.7. Refilling\n\n--- PDF PAGE 28 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n26\n \n4.  Minor Preventive Machine \nMaintenance \nMinor Preventive Machine Maintenance may include  \nbut not limited to checking of the following: \n \n4.1. Machine temperature \n4.2. Hydraulic fluid \n4.3. Wear and surface condition \n4.4. Crack \n4.5. Leak detection \n4.6. Vibration \n4.7. Corrosion/erosion \n4.8. Electric insulation \n5. Condition of Machine \n5.1 \nServiceable \n5.2 \nRepairable \n5.3 \nDefective\n\n--- PDF PAGE 29 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n27"
