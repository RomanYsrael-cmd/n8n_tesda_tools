        "evidence_guide": {
          "source_text": "1.\nCritical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1.\nselected and prepared equipment for use\n1.2.\nconducted pre-operational checks on equipment\n1.3.\noperated and shut-down equipment\n1.4.\ncleaned, maintained and stored equipment\n1.5.\nfollowed work procedures\n1.6.\nfollowed recording and reporting guidelines\n\nThe skills and knowledge required to operate basic\nequipment must be transferable to a different work\nenvironment.\n2.\nUnderpinning\nKnowledge\nKnowledge and understanding are essential to apply this\nstandard in the workplace, to transfer the skills to other\ncontexts, and to deal with unplanned events. The\nknowledge requirements for this competency standard are\nlisted below:\n\n2.1.\nTypes, characteristics and functions of basic\nequipment\n2.2.\nEquipment operation and shut-down\n2.3.\nPre-operational checks and procedures\n2.4.\nRoutine maintenance procedures\n2.5.\nCleaning and sanitation procedures for work area\nand equipment\n2.6.\nSecurity and storage of equipment and materials\n2.7.\nLock out and tag out procedures\n2.8.\nSafe workplace procedures\n2.9.\nEmergency procedures\n2.10. Environmental and waste disposal procedures\n2.11. Reporting and documentation requirements and\nprocesses\n2.12. Relevant legislative provisions including OHS\nrequirements\n2.13. Awareness of Codes or Regulations such as\nHACCP and GMP\n\n--- PDF PAGE 63 ---\n_________________________________________\n\nTR - Food Processing NC I\n61\nAttitudes:\n2.14. Accurate\n2.15. Environment-conscious\n2.16. Positive work values\n2.17. Cost conscious\n2.18. Safety conscious\n2.19. Personal hygiene\n3.\nUnderpinning\nSkills\n3.1.\nOperate basic equipment\n3.2.\nConduct pre-start checks on equipment\n3.3.\nApply safe workplace practices and procedures\n3.4.\nCleaning and sanitation procedures for work area\nand equipment\n3.5.\nLocate emergency stop functions on equipment\n3.6.\nEquipment shut-down procedures\n3.7.\nFollow work procedures\n3.8.\nRead and interpret written information\n3.9.\nOral and written communication skills\n3.10. Working with others and in teams\n\n3.11. Time management\n3.12. Recording and reporting skills\n4.\nMethods of\nAssessment\nCompetency must be assessed through:\n4.1.\nDirect observation with oral questioning\n4.2.\nDemonstration with oral questioning\n4.3.\nPortfolio\n5.\nResource\nImplications\nThe following resources must be provided:\n5.1. Specific work area/station\n5.2. Basic equipment\n5.3. Materials relevant to the proposed activity\n5.4. Relevant workplace procedures, schedules and\nrecords\n6.\nContext of\nAssessment\n6.1. Assessment should occur on the job or in a\nsimulated workplace\n6.2. Ability to apply competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 64 ---\n_________________________________________\n\nTR - Food Processing NC I\n62\n\nUNIT OF COMPETENCY: CLEAN AND SANITIZE EQUIPMENT AND\nPROCESSING/PACKAGING AREA\n\nUNIT CODE :"
        },
        "source_text": "AGR741309\n\nUNIT DESCRIPTOR : This competency standard covers the skills, knowledge and\nattitudes required to select, prepare, operate and maintain\nbasic equipment. It involves equipment requiring limited\napplication of equipment and process knowledge and limited\nequipment\nadjustment.\nCompetency\nalso\nrequires\nknowledge of the functions associated with operational\nequipment, including undertaking routine maintenance and\nreporting faults to appropriate persons. This unit is generic\nand should be customized for a given piece of equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the Range of Variables\n1. Select and prepare\nequipment for use\n1.1. Basic machine/equipment required to complete\ntasks is identified and accessed in accordance with\nassignment instructions and workplace\nrequirements\n1.2. Routine pre-operational checks are carried out\naccording to manufacturers’ specifications and\nworkplace procedures\n1.3. Faulty and damaged machine/equipment is identified\nand reported according to workplace procedures\n1.4. Any training required to operate machine/equipment\nis identified and notified to appropriate person(s)\naccording to supplier and workplace requirements\n2. Operate equipment\n\n2.1. Suitable personal protective equipment is\nselected, used and maintained in accordance with\noccupational health and safety (OHS)\nrequirements, and manufacturers’ specifications\n2.2. Machine/Equipment is operated in a safe and\ncontrolled manner in accordance with OHS\nrequirements and manufacturers’ specifications\n2.3. Out-of-specification product, process and equipment\nperformance is identified and reported according to\nworkplace procedures\n\n--- PDF PAGE 59 ---\n_________________________________________\n\nTR - Food Processing NC I\n57\n\n3. Maintain equipment\nand resources\n3.1. Machine/Equipment is shut down according to\nworkplace procedures and manufacturers’\nspecifications\n3.2. Work area, tools and machine/equipment are\ncleaned, maintained and stored in accordance with\nworkplace requirements and manufacturers’\nspecifications\n3.3. Faulty or damaged machine/equipment is reported\nfor repair or replacement in accordance with\nworkplace procedures\n3.4. Waste generated by both the process and cleaning\nprocedures is collected, treated, disposed of, or\nrecycled, according to workplace procedures\n3.5. Records and reports are completed and maintained\nin accordance with industry, legislative and\nworkplace requirements\n\n--- PDF PAGE 60 ---\n_________________________________________\n\nTR - Food Processing NC I\n58\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1.\nBasic machine/\nequipment\nMay include any one of the following:\n\n1.1.\nMixer\n1.2.\nBlender\n1.3.\nRoaster\n1.4.\nGrinder\n1.5.\nChopper\n1.6.\nFood processor\n1.7.\nScales\n1.8.\nWashing equipment\n\n1.9.\nFrying equipment\n1.10. Oven\n1.11. Conveyor\n1.12. Freezer\n1.13. Cutter\n1.14. Molder\n\n1.15. Filling machine (bottle, can, pouch, fill and seal)\n1.16. Plastic sealer\n1.17. Vacuum sealer\n1.18. Packing equipment\n1.19. Labeling equipment\n2.\nWorkplace\nrequirements\nMay include but not limited to:\n2.1. Company policies and procedures\n2.2. Standard Operating Procedures\n2.3. Production schedules\n2.4. Operator’s manuals\n2.5. OHS procedures\n2.6. Supervisor’s oral or written instructions\n2.7.\nStandard forms and reports\n3.\nManufacturer’s\nspecifications\nMay include but not limited to:\n3.1. Handling requirements\n3.2. Operating requirements\n3.3. Discharge label\n3.4. Reporting\n3.5. Testing\n3.6. Positioning\n3.7.\nRefilling\n\n--- PDF PAGE 61 ---\n_________________________________________\n\nTR - Food Processing NC I\n59\n4.\nPre-operational\nchecks\nMay include but not limited to:\n4.1. Checking log books\n4.2. Reading manufacturer's instructions\n4.3. Observing and monitoring noise levels for correct\noperation\n4.4. Cleaning\n4.5. Priming\n4.6. Tightening\n4.7. Basic repairs and adjustments\n4.8. Routine maintenance\n4.9. Identification and segregation of unsafe or faulty\nequipment for repair or replacement\n5.\nPersonal\nprotective\nequipment (PPE)\nMay include but not limited to:\n5.1. Masks\n5.2. Safety boots\n5.3. Head protection\n5.4. Safety glasses\n5.5. Gloves\n5.6.\nApron\n6.\nOHS requirements\nOccupational Health and Safety requirements may include\nbut not limited to:\n6.1 Health/medical certificate\n6.2 DOLE requirements\n6.3 Personal hygiene and good grooming\n6.4 Plant sanitation and waste management\n6.5 Relevant permits\n6.6 BFAD requirements\n6.7 PPE requirements\n7.\nRecords and\nreports\nMay include but not limited to:\n7.1. Operational details\n7.2. Equipment faults\n7.3. Recommended repairs or disposal of equipment\n7.4. Materials used\n\n--- PDF PAGE 62 ---\n_________________________________________\n\nTR - Food Processing NC I\n60\n\nEVIDENCE GUIDE\n\n1.\nCritical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1.\nselected and prepared equipment for use\n1.2.\nconducted pre-operational checks on equipment\n1.3.\noperated and shut-down equipment\n1.4.\ncleaned, maintained and stored equipment\n1.5.\nfollowed work procedures\n1.6.\nfollowed recording and reporting guidelines\n\nThe skills and knowledge required to operate basic\nequipment must be transferable to a different work\nenvironment.\n2.\nUnderpinning\nKnowledge\nKnowledge and understanding are essential to apply this\nstandard in the workplace, to transfer the skills to other\ncontexts, and to deal with unplanned events. The\nknowledge requirements for this competency standard are\nlisted below:\n\n2.1.\nTypes, characteristics and functions of basic\nequipment\n2.2.\nEquipment operation and shut-down\n2.3.\nPre-operational checks and procedures\n2.4.\nRoutine maintenance procedures\n2.5.\nCleaning and sanitation procedures for work area\nand equipment\n2.6.\nSecurity and storage of equipment and materials\n2.7.\nLock out and tag out procedures\n2.8.\nSafe workplace procedures\n2.9.\nEmergency procedures\n2.10. Environmental and waste disposal procedures\n2.11. Reporting and documentation requirements and\nprocesses\n2.12. Relevant legislative provisions including OHS\nrequirements\n2.13. Awareness of Codes or Regulations such as\nHACCP and GMP\n\n--- PDF PAGE 63 ---\n_________________________________________\n\nTR - Food Processing NC I\n61\nAttitudes:\n2.14. Accurate\n2.15. Environment-conscious\n2.16. Positive work values\n2.17. Cost conscious\n2.18. Safety conscious\n2.19. Personal hygiene\n3.\nUnderpinning\nSkills\n3.1.\nOperate basic equipment\n3.2.\nConduct pre-start checks on equipment\n3.3.\nApply safe workplace practices and procedures\n3.4.\nCleaning and sanitation procedures for work area\nand equipment\n3.5.\nLocate emergency stop functions on equipment\n3.6.\nEquipment shut-down procedures\n3.7.\nFollow work procedures\n3.8.\nRead and interpret written information\n3.9.\nOral and written communication skills\n3.10. Working with others and in teams\n\n3.11. Time management\n3.12. Recording and reporting skills\n4.\nMethods of\nAssessment\nCompetency must be assessed through:\n4.1.\nDirect observation with oral questioning\n4.2.\nDemonstration with oral questioning\n4.3.\nPortfolio\n5.\nResource\nImplications\nThe following resources must be provided:\n5.1. Specific work area/station\n5.2. Basic equipment\n5.3. Materials relevant to the proposed activity\n5.4. Relevant workplace procedures, schedules and\nrecords\n6.\nContext of\nAssessment\n6.1. Assessment should occur on the job or in a\nsimulated workplace\n6.2. Ability to apply competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 64 ---\n_________________________________________\n\nTR - Food Processing NC I\n62\n\nUNIT OF COMPETENCY: CLEAN AND SANITIZE EQUIPMENT AND\nPROCESSING/PACKAGING AREA\n\nUNIT CODE :"
