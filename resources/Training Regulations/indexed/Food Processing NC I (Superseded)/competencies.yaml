RIPTOR : This unit covers the knowledge, skills and attitudes required\nto apply the basic housekeeping procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the Range of Variables\n\n1. Sort and remove\nunnecessary items\n\n1.1 Reusable, recyclable materials are sorted in\naccordance with company/office procedures\n1.2 Unnecessary items are removed and disposed of in\naccordance with company or office procedures\n2. Arrange items\n2.1 Items are arranged in accordance with company/office\nhousekeeping procedures\n2.2 Work area is arranged according to job requirements\n2.3 Activities are prioritized based on instructions.\n2.4 Items are provided with clear and visible identification\nmarks based on procedure\n2.5 Safety equipment and evacuation passages are kept\nclear and accessible based on instructions\n3. Maintain work area,\ntools and\nequipment\n3.1 Cleanliness and orderliness of work area is maintained\nin accordance with company/office procedures\n3.2 Tools and equipment are cleaned in accordance with\nmanufacturer’s instructions/manual\n3.3 Minor repairs are performed on tools and equipment in\naccordance with manufacturer’s instruction/manual\n3.4 Defective tools and equipment are reported to\nimmediate supervisor\n4. Follow standardized\nwork process and\nprocedures\n4.1 Materials for common use are maintained in designated\narea based on procedures\n4.2 Work is performed according to standard work\nprocedures\n4.3 Abnormal incidents are reported to immediate\nsupervisor\n5. Perform work\nspontaneously\n5.1 Work is performed as per instruction\n5.2 Company and office decorum are followed and\ncomplied with\n5.3 Work is performed in accordance with occupational\nhealth and safety (OHS) requirements\n\n--- PDF PAGE 17 ---\n_________________________________________\n\nTR - Food Processing NC I\n15\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Unnecessary items\nMay include but are not limited to:\n1.1 Non-recyclable materials\n1.2 Unserviceable tools and equipment\n1.3 Pictures, posters and other materials not\n related to work activity\n1.4 Waste materials\n2. Identification marks\n2.1 Labels\n2.2 Tags\n2.3 Color coding\n3. Decorum\n3.1 Company/ office rules and regulations\n3.2 Company/ office uniform\n3.3 Behavior\n4. Minor repair\nMinor repair include but not limited to:\n4.1 Replacement of parts\n4.2 Application of lubricants\n4.3 Sharpening of tools\n4.4 Tightening of nuts, bolts and screws\n\n--- PDF PAGE 18 ---\n_________________________________________\n\nTR - Food Processing NC I\n16\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n\n1.1 Practiced the basic procedures of 5S\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Principles of 5S\n2.2 Work process and procedures\n2.3 Safety signs and symbols\n2.4 General OH&S principles and legislation\n2.5 Environmental requirements relative to work safety\n2.6 Accident/Hazard reporting procedures\n3. Underpinning skills\n3.1 Basic communication skills\n3.2 Interpersonal skills\n3.3 Reading skills required to interpret instructions\n3.4 Reporting/recording accidents and potential hazards\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Facilities, materials tools and equipment necessary\nfor the activity\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1. Third party report\n5.2. Interview\n5.3. Demonstration with questioning\n6. Context for\nassessment\n6.1 Competency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 19 ---\n_________________________________________\n\nTR - Food Processing NC I\n17\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: APPLY FOOD SAFETY AND SANITATION\n\nUNIT CODE\n : AGR741201\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes required to\napply food safety and sanitation in the workplace\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n11. Wear Personal\nProtective Equipment\n\n1.1 Personal protective equipment are checked\naccording to manufacturer’s specifications\n1.2 Personal protective equipment are worn\naccording to the job requirement\n2. Observe Personal\nHygiene and Good\nGrooming\n2.1 Personal hygiene and good grooming is practiced in\nline with workplace health and safety\nrequirements\n3. Implement Food\nSanitation Practices\n3.1 Sanitary food handling practices are implemented\nin line with workplace sanitation regulations\n3.2 Safety measures are observed in line with\nworkplace safety practices.\n4. Render Safety\nMeasures and First Aid\nProcedures\n4.1 Safety measures are applied according to\nworkplace rules and regulations\n4.2 First aid procedures are applied and coordinated\nwith concerned personnel according to workplace\nstandard operating procedures.\n5. Implement\nhousekeeping activities\n5.1 Work area and surroundings are cleaned in\naccordance with workplace health and safety\nregulations\n5.2 Waste is disposed according to organization’s\nwaste disposal system\n 5.3 Hazards in the work area are recognized and\nreported to designated personnel according to\nworkplace procedures\n\n--- PDF PAGE 20 ---\n_________________________________________\n\nTR - Food Processing NC I\n18\n\nRANGE OF VARIABLES\n VARIABLES\n RANGE\n1. Manufacturer’s\nSpecifications\nManufacturer’s specifications may include but not\nlimited to:\n\n1.1 Handling\n1.2 Operating\n1.3 Discharge Label\n1.4 Reporting\n1.5 Testing\n1.6 Positioning\n1.7 Refilling\n2. Personal Protective\nEquipment\nPersonal Protective Equipment may include but not\nlimited to:\n\n2.1 Apron/laboratory gown\n2.2 Mouth masks\n2.3 Gloves\n2.4 Rubber boots/safety shoes\n2.5 Head gears such as caps, hair nets, ear plug\n3. Workplace Health and\nSafety Requirements\nWorkplace and Safety Requirements may include:\n\n3.1 Health/Medical Certificate\n3.2 DOLE requirements\n3.3 BFAD requirements\n3.4 Personal Hygiene and good grooming\n3.5 Plant Sanitation and waste management\n4. Safety Measures\nSafety measures may include but not limited to:\n\n4.1 Labeling of chemicals and other sanitizing agents\n4.2 Installation of fire fighting equipment in the work\narea\n4.3 Installation of safety signages and symbols\n4.4 Implementation of 5S in the work area\n4.5 Removal of combustible material in the work area\n\n--- PDF PAGE 21 ---\n_________________________________________\n\nTR - Food Processing NC I\n19\n\n5. First Aid Procedures\nFirst Aid Procedures may include but not limited to:\n\n5.1 Mouth to mouth resuscitation\n5.2 CPR\n5.3 Application of tourniquet\n5.4 Applying pressure to bleeding wounds or cuts\n5.5 First aid treatment for burned victims\n\n6. Hazards\nHazards in the workplace may include but not limited\nto:\n\n6.1 Physical\n6.2 Biological\n6.3 Chemical\n\n--- PDF PAGE 22 ---\n_________________________________________\n\nTR - Food Processing NC I\n20\n\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Cleaned, checked and sanitized personal protective\nequipment\n1.2 Practiced proper personal hygiene and good grooming\n1.3 Implemented workplace food safety practices\n1.4 Applied first aid measures to victims\n1.5 Implemented good housekeeping activities in the work\narea\n2. Underpinning\nKnowledge\n2.1 Safety Practices\n2.1.1 Proper waste disposal\n2.1.2 Environmental protection and concerns\n2.1.3 Food safety principles and practices\n2.1.4 Good grooming and personal hygiene\n\n 2.2 Codes and Regulations\n2.2.1 TQM and other food quality system principles\n2.2.2 ISO, HACCP, EMS, 5S\n2.2.3 Good Food Manufacturing Practices\n\n2.3 Equipment: Uses and Specifications\n2.3 1 Parts and functions of personal protective\nequipment\n2.3.2 First Aid Kit\n2.3.3\nSanitizing equipment\n3. Underpinning\nSkills\n3.1 Sanitary food handling practices\n3.2 Implementing housekeeping activities\n3.3 Applying first aid treatment\n3.4\nCoordination skills\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 A combination of direct observation and questioning of a\ncandidate processing foods.\n5. Resource\nImplications\n\nThe following resources must be provided:\n5.1 Work area/station\n5.2 First Aid kit\n5.3 PPE relevant to the activities\n5.4 Fire extinguisher\n5.5 Stretcher\n5.6 Materials, tools and equipment relevant to the unit of\ncompetency\n6. Context of\nAssessment\n6.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 23 ---\n_________________________________________\n\nTR - Food Processing NC I\n21\n\nUNIT OF COMPETENCY : USE STANDARD MEASURING DEVICES AND\nINSTRUMENTS\n\nUNIT CODE\n: AGR741202\n\nUNIT DESCRIPTOR : This unit deals with the knowledge, skills and attitudes\nrequired\nto\nuse\nstandard\nmeasuring\ndevices,\ninstruments in the workplace\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the Range of Variables\n1. Identify Standard\nMeasuring Devices and\nInstruments\n\n1.1\nStandard measuring devices and\ninstruments are identified according to\nmanufacturer’s specifications\n1.2\nDevices and instruments for measuring are\nproperly checked, sanitized and calibrated prior\nto use\n2. Review the Procedures in\nUsing Standard Measuring\nDevices and Instruments\n2.1\nProcedures in using the standard measuring\ndevices and instruments are recalled according\nto manufacturer’s specifications\n2.2\nPrinted procedures/brochures/catalogues are\nconsulted according to specified food\nprocessing methods\n3. Follow Procedures of\nUsing Measuring Devices\nand Instruments\n3.1\nMethods/practices of using measuring devices\nand instruments are strictly observed according\nto manufacturer’s specifications and workplace\nrequirements\n3.2\nMeasuring devices and instruments are\ncleaned, wiped dry and stowed after use to\nensure conformity with workplace requirements\n\n--- PDF PAGE 24 ---\n_________________________________________\n\nTR - Food Processing NC I\n22\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Standard Measuring\nDevices\nStandard Measuring Devices may include but not\nlimited to the following:\n\n1.1\nWeighing scales and balances of various\ncapacities and sensitivities\n1.2\nMeasuring cups of varying capacities for dry\ningredients\n1.3\nMeasuring cups of varying capacities for liquid\ningredients\n2. Standard Measuring\nInstruments\nStandard Measuring Instruments may include but\nnot limited to the following:\n\n2.1 Salinometer\n2.2 Thermometers of varying temperature ranges\n(0-300 C )\n2.3 Refractometer of varying range ( 0 – 90 B)\n2.4 Glasswares like cylinders, beakers, flasks of\nvarying graduations\n3. Food Processing Methods\nFood Processing Methods may include but not\nlimited to the following:\n\n3.1. Process foods by Salting, Curing and\nSmoking\n3.2. Process foods by Fermentation and Pickling\n3.3. Process foods by Canning and Bottling\n3.4. Process foods by Sugar Concentration\n3.5. Process foods by Drying and Dehydration\n\n--- PDF PAGE 25 ---\n_________________________________________\n\nTR - Food Processing NC I\n23\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1\nIdentified, prepared and calibrated standard\nmeasuring devices and instruments\n1.2\nFollowed correctly the procedures in using\nstandard measuring devices and instruments\n1.3\nFollowed proper cleaning and sanitizing and\nstowing procedures of measuring devices and\nequipment before and after use\n2. Underpinning Knowledge\n2.1\nSafe handling of measuring devices and\ninstruments\n2.2\nSpecifications and functions of measuring\ndevices and instruments\n2.3\nDefects and breakages of measuring devices\nand instruments\n2.4\nProcedures in cleaning, sanitizing and\ncalibrating and stowing equipment and\ninstruments\n3. Underpinning Skills\n3.1\nCommunication skills\n3.2\nCalibrating skills\n3.3\nSanitary handling of devices and instruments\n3.4\nMeasuring devices and instruments\n3.5\nStowing measuring devices and instruments\n4. Methods of Assessment\nCompetency in this unit must be assessed through:\n4.1 Direct observation and questioning of a\ncandidate using measuring devices and\ninstruments\n5. Resource Implications\nThe following resources must be provided:\n5.1 Work area/station\n5.2 Materials, tools and equipment relevant to the\nUnit of Competency\n6. Context of Assessment\n6.1 Assessment should occur on the job or in a\nsimulated workplace\n\n--- PDF PAGE 26 ---\n_________________________________________\n\nTR - Food Processing NC I\n24\n\nUNIT OF COMPETENCY :\nUSE FOOD PROCESSING TOOLS, EQUIPMENT\nAND UTENSILS\n\nUNIT CODE\n :\nAGR741203\n\nUNIT DESCRIPTOR :\nThis unit deals with the skills, knowledge and attitudes\nrequired to operate food processing tools, equipment\nand instruments in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the Range of Variables\n1. Perform Pre-\nOperation Activities\n1.1. Appropriate tools and equipment/utensils are\nassembled according to food processing methods\n1.2. Food processing tools and equipment/utensils\nare inspected and checked according to\nmanufacturer’s specifications\n1.3. Food processing equipment is set up, adjusted and\nreadied according to job requirements\n2. Operate Food\nprocessing\nEquipment\n\n2.1. Food processing equipment is switched on\naccording to manufacturer’s specifications\n2.2. Performance of food processing equipment is\nchecked to ensure conformity with specified output\n2.3. Operation of food processing equipment is managed\nto achieve planned outcomes\n2.4. Minor trouble shooting on food processing tools,\nequipment and utensils is performed when\nnecessary\n3. Perform Post-\nOperation Activities\n3.2\nFood processing equipment is switched off and\nunplugged after operation in accordance with\nmanufacturer’s specifications\n3.3\nFood processing tools, equipment and instruments\nare cleaned, sanitized and stowed as required\naccording to manufacturer’s specifications and\nworkplace policies and regulations\n3.4\nMinor preventive maintenance on equipment is\nperformed in line with organization’s maintenance\nsystem\n3.5\nMain machine parts are inspected and checked in\nline with organization’s policy\n3.6\nCondition of machine is monitored to ensure\nserviceability in accordance with workplace rules\nand regulations\n\n--- PDF PAGE 27 ---\n_________________________________________\n\nTR - Food Processing NC I\n25\n\nRANGE OF VARIABLES\n\n VARIABLE\nRANGE\n1. Food Processing Methods\nFood Processing Methods include but not limited to:\n\n1.1\nSalting\n1.2\nCuring\n1.3\nSmoking\n1.4\nFermentation\n1.5\nPickling\n1.6\nCanning\n1.7\nBottling\n1.8\nSugar concentration\n1.9\nDrying\n1.10 Dehydration\n2. Food Processing Tools,\nEquipment and Utensils\nTools, Equipment and Utensils used for but not limited\nto the following food processing methods:\n\n2.1. Salting\n2.2. Curing\n2.3. Smoking\n2.4. Fermentation\n2.5. Pickling\n2.6. Canning\n2.7. Bottling\n2.8. Sugar concentration\n2.9. Drying\n2.10. Dehydration\n3. Manufacturer’s\nSpecifications\nManufacturer’s specifications may include but not\nlimited to:\n\n3.1. Handling requirements\n3.2. Operating requirements\n3.3. Discharge Label\n3.4. Reporting\n3.5. Testing\n3.6. Positioning\n3.7. Refilling\n\n--- PDF PAGE 28 ---\n_________________________________________\n\nTR - Food Processing NC I\n26\n\n4. Minor Preventive Machine\nMaintenance\nMinor Preventive Machine Maintenance may include\nbut not limited to checking of the following:\n\n4.1. Machine temperature\n4.2. Hydraulic fluid\n4.3. Wear and surface condition\n4.4. Crack\n4.5. Leak detection\n4.6. Vibration\n4.7. Corrosion/erosion\n4.8. Electric insulation\n5. Condition of Machine\n5.1\nServiceable\n5.2\nRepairable\n5.3\nDefective\n\n--- PDF PAGE 29 ---\n_________________________________________\n\nTR - Food Processing NC I\n27\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1\nAssembled, inspected, checked and sanitized appropriate\ntools and equipment/instruments\n1.2\nSet-up, adjusted and readied tools and equipment and\ninstruments according to requirements\n1.3\nOperated and monitored performance of equipment to\nensure specified output\n1.4\nPerformed post operation activities\n1.5\nPerformed minor trouble shooting on food processing\ntools, equipment and utensils\n2. Underpinning\nKnowledge\n2.1. Equipment, tools and instruments: Uses and\nSpecifications\n2.2. Equipment, tools and instruments: Parts and Functions\n2.3. Sanitizing agents: Uses and Specification\n2.4. Minor preventive maintenance\n2.5. Proper stowing of tools and equipment/instruments\n2.6. Minor trouble shooting\n2.7. Interpreting manufacturer’s specifications\n2.8. Equipment/machine wear and tear process\n3. Underpinning\nSkills\n3.1\nEquipment/machine parts tear down and assembly\n3.2\nInspecting and checking condition of equipment/machines\nbefore, during and after operation\n3.3\nPerforming minor trouble shooting\n3.4\nPerforming minor preventive maintenance\n3.5\nReporting equipment/machine, tools, instruments\nbreakdown and recording same in standard forms\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1. Direct observation and questioning of a candidate\noperating food processing tools and\nequipment/instruments\n4.2. Submission of written report on the performance and\ncondition of equipment/machine, tools, instruments used.\n5. Resource\nImplications\nThe following resources must be provided:\n5.1. Work area/station\n5.2. Materials, tools and equipment relevant to the Unit of\nCompetency\n6. Context of\nAssessment\n6.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 30 ---\n_________________________________________\n\nTR - Food Processing NC I\n28\n\nUNIT OF COMPETENCY: FOLLOW WORK PROCEDURES TO MAINTAIN GOOD\nMANUFACTURING PRACTICE\n\nUNIT CODE : AGR741207\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required\nto comply with Good Manufacturing Practice (GMP)\nrequirements and workplace quality standards.\n\nELEMENTS\nPERFORMANCE CRITERIA\nitalicized terms are elaborated in the\nRange of Variables\n1. Identify requirements\nfor GMP related to own\nwork\n1.1. Sources of information on GMP requirements are\nlocated according to workplace procedures\n1.2. GMP requirements and responsibilities related to own\nwork are identified according to workplace procedures\n2. Observe personal\nhygiene and conduct to\nmeet GMP\nrequirements\n2.1. Personal hygiene is observed in line with GMP\nrequirements\n2.2. Appropriate clothing and footwear is prepared, used,\nstored and disposed of according to GMP and\nworkplace procedures\n2.3. Personal movement around the workplace is made in\nline with area entry and exit procedures\n3. Follow GMP\nrequirements when\ncarrying out work\nactivities\n3.1. Raw materials, product and packaging components are\nhandled according to GMP and workplace procedures\n3.2. Work area, materials, equipment and product are\nroutinely monitored to ensure compliance with GMP\nrequirements\n3.3. Contamination is identified and appropriate control\nmeasures relating to work responsibilities are followed\nin accordance with GMP requirements\n3.4. Processes, practices or conditions which are not\nconsistent with GMP are identified and reported\naccording to workplace reporting procedures\n3.5. The workplace is kept clean and tidy in line with GMP\nhousekeeping standards\n4. Complete workplace\ndocumentation to\nsupport GMP\n4.1. Documentation and recording requirements are\nidentified according to workplace procedures and GMP\nrequirements\n4.2. Information is recorded according to workplace\nreporting procedures to meet GMP requirements\n\n--- PDF PAGE 31 ---\n_________________________________________\n\nTR - Food Processing NC I\n29\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Sources of\ninformation\n1.1. GMP manuals\n1.2. Standard Operating Procedures (SOPs)\n1.3. Workplace procedures and policies\n1.4. Quality assurance procedures\n1.5. Standard forms and reports\n1.6. Relevant legislations/regulations\n1.6.1. Food processing and food safety regulations\n1.6.2. Department of Health – Food Establishments –\nCode of Sanitation of the Philippines (PD 586)\n1.6.3. Department of Environment and Natural\nResources – Environmental Management Bureau\nregulations regarding emissions, waste treatment,\nnoise and effluent treatment and control\n2. Workplace\nprocedures\n2.1. Standard operating procedures (SOPs)\n2.2. Production and cleaning schedules and instructions\n2.3. Materials Safety Data Sheets (MSDS)\n2.4. Manufacturers' advice\n2.5. Written or verbal instructions\n2.6. Standard forms and reports\n3. GMP\nrequirements\nMay relate to:\n3.1. Own work\n3.2. Personal hygiene\n3.3. Use, storage and disposal of personal protective\nequipment\n3.4. Personal movement\n3.5. Work area, including materials, equipment and utensils\n3.6. Product handling and monitoring\n3.7. Contamination\n3.8. Pest management (e.g. flies, ants, roaches, rodents)\n3.9. Recording and reporting systems\n4. Personal hygiene\nHealth practices that include but not limited to:\n4.1. Cleaning the body (e.g. daily bath, etc.)\n4.2. Hand care (e.g. washing, maintaining nails, etc.)\n4.3. Feet care\n4.4. Hair care\n4.5. Use of clean clothing\n4.6. Personal habits (e.g. smoking, touching of mouth, nose,\netc.)\n\n--- PDF PAGE 32 ---\n_________________________________________\n\nTR - Food Processing NC I\n30\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1. identified GMP requirements related to work\n1.2. observed personal hygiene and conduct to meet\nGMP requirements\n1.3. followed GMP requirements when carrying out work\nactivities\n1.4. completed workplace documentation to support GMP\n\nThe skills and knowledge required to follow work\nprocedures to maintain GMP must be transferable to a\ndifferent work environment.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this\nstandard in the workplace, to transfer the skills to other\ncontexts, and to deal with unplanned events. The\nknowledge requirements for this competency standard are\nlisted below:\n\n2.1.\nThe role and importance of GMP\n2.2.\nThe relationship between the Code of Good\nManufacturing Practice and workplace procedures,\nsystems and processes\n2.3.\nGMP personnel and their respective responsibilities\n2.4.\nPersonal role, responsibility and accountability for\nimplementing GMP\n2.5.\nSources of advice on GMP requirements for own\nwork\n2.6.\nPersonal clothing and footwear requirements for\nworking in and/or moving between work areas\n2.7.\nPersonal clothing use, storage and disposal\nrequirements\n2.8.\nCommon types and sources of contamination that\noccurs in the work area\n2.9.\nCommon control methods and procedures used in\nthe work area to maintain GMP\n2.10. Monitoring, inspection and checking procedures\nrelevant to own work\n2.11. Standards for materials, equipment and utensils\nused in the work area\n\n--- PDF PAGE 33 ---\n_________________________________________\n\nTR - Food Processing NC I\n31\n\n2.12. Evidence of out-of-standard or unacceptable\nperformance relating to work responsibilities\n2.13. Action required in the event of non-compliance\nwithin area of responsibility\n2.14. Storage and handling requirements for raw\nmaterials, packaging components and products\nrelevant to work role\n2.15. Housekeeping requirements and responsibilities\nrelating to own work.\n2.16. Waste collection, recycling and handling\nprocedures relevant to own work responsibilities\n2.17. Responsibilities for reporting and recording\ninformation\n\nAttitudes\n2.18. Maintain work area in a clean and tidy state\n2.19. Obedience\n2.20. Accuracy\n2.21. Environment-conscious\n2.22. Positive work values\n2.23. Work ethics\n2.24. Cost consciousness\n2.25. Safety consciousness\n2.26. Personal hygiene\n3. Underpinning Skills\n3.1.\nLocate and follow workplace information relating to\nGMP responsibilities\n3.2.\nUse, store and dispose of appropriate clothing /\nfootwear as required by work tasks and consistent\nwith GMP\n3.3.\nCarry out relevant checks and inspections as\nrequired\n3.4.\nIdentify and respond to out-of-specification or\nunacceptable conditions or performance within\narea of responsibility\n3.5.\nIdentify and report situations that do or could\ncompromise GMP\n3.6.\nHandle and/or dispose of out-of-specification or\ncontaminated materials, packaging\ncomponents/consumables and product, waste and\nrecyclable material according to GMP as required\nby work responsibilities\n\n--- PDF PAGE 34 ---\n_________________________________________\n\nTR - Food Processing NC I\n32\n3.7.\nIdentify and report signs of pest infestation\n3.8.\nFollow relevant GMP and work procedures\n3.9.\nOral and written communication skills\n3.10. Recording and reporting skills\n4. Methods of\nAssessment\nCompetency must be assessed through:\n4.1.\nDirect observation with oral questioning\n4.2.\nDemonstration with oral questioning\n5. Resource Implications\nThe following resources must be provided:\n5.1. Specific work area/station\n5.2. Equipment and tools related to following GMP\nrequirements\n5.3. Materials relevant to the proposed activity\n6. Context of\nAssessment\n6.1. Assessment should occur on the job or in a\nsimulated workplace\n6.2. Ability to apply competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 35 ---\n_________________________________________\n\nTR - Food Processing NC I\n33\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: IMPLEMENT SAMPLING PROCEDURES\n\nUNIT CODE : AGR741305\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes\nrequired to implement sampling procedures. It involves\nunderstanding the requirements of sampling plans, collecting\nand transferring samples while retaining sample integrity.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the Range of Variables\n1. Prepare for sampling\n1.1. Sampling requirements are identified in\naccordance with the sampling plan\n1.2. Sampling equipment, containers and labels are\nprepared according to sampling requirements\n2. Collect samples\n2.1. Samples are collected according to sampling\nprocedures and sampling plan\n2.2. Samples are handled and prepared to preserve\nsample and source integrity according to sampling\nrequirements and OHS requirements\n2.3. Defects or abnormalities in source material and/or\nsample are identified and reported according to\nworkplace requirements\n2.4. Sample information is recorded according to\nworkplace procedures\n2.5. The workplace is cleaned and maintained according\nto workplace standards\n\n--- PDF PAGE 36 ---\n_________________________________________\n\nTR - Food Processing NC I\n34\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sampling\nrequirements\nMay involve collection and transfer of samples:\n1.1 under controlled conditions\n1.1.1 Time\n1.1.2 Temperature\n1.1.3 Light\n1.1.4 Humidity\n1.1.5 Sanitary conditions\n\n1.2\nafter processes are adjusted in response to\nvariation or non-conformance\n2. Samples\nSamples may include any one but not limited to:\n2.1.\nRaw materials\n2.2.\nGoods in process\n2.3.\nFinished products\n2.4.\nPackaging materials and supplies\n3. OHS requirements\nOccupational Health and Safety requirements may include\nbut not limited to:\n3.1 Health/medical certificate\n3.2 DOLE requirements\n3.3 Personal hygiene and good grooming\n3.4 Plant sanitation and waste management\n3.5 BFAD requirements\n3.6 PPE requirements\n3.6.1 apron/laboratory gown\n3.6.2 mouth masks\n3.6.3 gloves\n3.6.4 rubber boots\n3.6.5 head gears such as caps, hairnets, ear plugs\n4. Workplace\nrequirements\nMay include but not limited to:\n4.1. company policies and procedures\n4.2. standard operating procedures\n4.3. work instructions\n4.4. production schedules\n4.5. forms and reports\n\n--- PDF PAGE 37 ---\n_________________________________________\n\nTR - Food Processing NC I\n35\n5. Sample\ninformation\nMay include but not limited to:\n5.1. date of sampling\n5.2. location of sampling\n5.3. source of sample\n5.4. characteristics of source\n5.5. amount of sample / sample size\n5.6. characteristics of sample\n5.7. preparation, handling, preservation, and storage\nrequirements\n5.8.\nlabel\n\n--- PDF PAGE 38 ---\n_________________________________________\n\nTR - Food Processing NC I\n36\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1. identified sampling requirements\n1.2. collected, handled and prepared samples\n1.3. followed work procedures\n1.4. recorded sample information\n\nThe skills and knowledge required to implement sampling\nprocedures must be transferable to a different work\nenvironment.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this\nstandard in the workplace, to transfer the skills to other\ncontexts, and to deal with unplanned events. The\nknowledge requirements for this competency standard are\nlisted below:\n\n2.1. Sampling plan\n2.2. Basic sampling principles, with emphasis on\nsampling which is random and representative of the\nlot\n2.3. Sampling techniques\n2.4. Basic characteristics of samples to be handled\n2.5. Preparation, handling, preservation and storage\nrequirements for samples\n2.6. Awareness of Codes or Regulations such as HACCP\nand GMP\n\nAttitudes:\n2.7. Accurate\n2.8. Environment-conscious\n2.9. Positive work values\n2.10. Cost conscious\n2.11. Safety conscious\n2.12. Honest\n2.13. Cooperative\n3. Underpinning Skills\n3.1\nSelect and use appropriate personal protective\nequipment\n3.2\nFollow work procedures\n3.3\nOral and written communication skills\n3.4\nWorking with others and in teams\n3.5\nBasic mathematical skills (percentage)\n\n--- PDF PAGE 39 ---\n_________________________________________\n\nTR - Food Processing NC I\n37\n3.6\nRecording and reporting skills\n3.7\nTime management\n4. Methods of\nAssessment\nCompetency must be assessed through:\n4.1. Direct observation with oral questioning\n4.2. Demonstration with oral questioning\n4.3.\nPortfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Specific work area/station\n5.2 Equipment and tools for sampling\n5.3 Materials relevant to the proposed activity\n5.4 Relevant workplace procedures, schedules and\nrecords\n6. Context of\nAssessment\n6.1\nAssessment should occur on the job or in a\nsimulated workplace\n6.2\nAbility to apply competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 40 ---\n_________________________________________\n\nTR - Food Processing NC I\n38\n\nUNIT OF COMPETENCY: INSPECT AND SORT RAW MATERIALS AND PRODUCT\n\nUNIT CODE : AGR741306\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes required\nto inspect and sort materials and product.\n\nELEMENT\nPERFORMANCE CRITERIA\n\nBold italicized terms are elaborated in the Range of Variables\n1. Prepare\nEquipment and\nTools\n1.1 Equipment and tools for inspection and sorting are\nprepared in accordance with manufacturer’s\nspecifications and workplace requirements\n1.2 Equipment and tools are checked, cleaned and sanitized\nin accordance with manufacturer’s specifications and\nworkplace requirements\n1.3 Office equipment and materials/supplies needed are\nprepared in accordance with approved specifications\n2. Inspect and\nSort the\nMaterials and\nProduct\n2.1 Raw materials and product are received and handled\naccording to standard operating procedures.\n2.2 Inspection and sorting is done according to required\nspecifications, OHS requirements and workplace\nprocedures\n2.3 Grading is undertaken, as necessary, according to raw\nmaterial or product requirements\n2.4 Raw materials and products are inspected for visible\nsigns of defects according to set processing and\npurchasing specifications.\n2.5 Raw materials and products are sorted in accordance\nwith physical property specifications\n2.6 Inspected and sorted raw materials and products are\nweighed and kept in accordance with standard operating\nprocedures\n2.7 Rejected/sub-standard raw materials and products are\nreported to appropriate person and/or disposed\naccording to organizational guidelines\n\n--- PDF PAGE 41 ---\n_________________________________________\n\nTR - Food Processing NC I\n39\n\n3. Complete\nInspection and\nSorting Activity\n3.1 Equipment and tools are cleaned and kept according to\nmanufacturers’ specifications and workplace procedures\n3.2 Records are completed and reported according to\nworkplace procedures.\n\n--- PDF PAGE 42 ---\n_________________________________________\n\nTR - Food Processing NC I\n40\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Equipment and\nTools\nMay include any one but not limited to:\n1.1\nWeighing scales\n1.2\nJack lifts, trolleys and wheelers\n1.3\nCarts\n1.4\nStainless steel tables / Receiving tables\n1.5\nBelt and roller sorter\n1.6\nScreens\n1.7\nImage processing\n2. Inspection and\nsorting\n2.1 Manual\n2.2 Mechanical\n3. Manufacturer’s\nspecifications\nMay include but not limited to:\n3.1\nHandling requirements\n3.2\nOperating requirements\n3.3\nWork-in-progress tags/labels\n3.4\nTesting\n3.5\nPositioning\n3.6\nRefilling\n4. Workplace\nrequirements\nMay include but not limited to:\n4.1 Company policies and procedures\n4.2 Standard operating procedures\n4.3 Work instructions\n4.4 Production schedules\n4.5\nForms and Reports\n5. Office equipment\nand\nmaterials/supplies\nMay include but not limited to:\n5.1\nCalculator\n5.2\nBond papers\n5.3\nReporting and recording forms/logbooks\n5.4\nPencils/ball pen\n5.5\nDesk\n6. Raw Materials and\nProduct\nMay include any one but not limited to:\n6.1. Fruits and vegetables\n6.2. Livestock meat and products\n6.3. Poultry and poultry products\n6.4. Fish and other marine products\n6.5. Cereals and starches\n6.6. Sugar and sweeteners\n6.7. Fats and oils\n6.8. Processing supplies\n6.8.1. Salt\n6.8.2.\nSugar\n\n--- PDF PAGE 43 ---\n_________________________________________\n\nTR - Food Processing NC I\n41\n6.8.3. Condiments\n6.8.4. Spices\n6.8.5. Herbs\n6.8.6. Sauces\n7. OHS requirements\nOccupational Health and Safety requirements may include\nbut not limited to:\n7.1 Health/medical certificate\n7.2 DOLE requirements\n7.3 Personal hygiene and good grooming\n7.4 Plant sanitation and waste management\n7.5 BFAD requirements\n7.6 Relevant permits (e.g. City Hall)\n7.7 PPE requirements\n7.7.1 apron/laboratory gown\n7.7.2 mouth masks\n7.7.3 gloves\n7.7.4 rubber boots\n7.7.5 head gears such as caps, hairnets, ear plugs\n8. Defects\nDefects refer to deviations from the required specifications.\n\n8.1 For raw materials, defects may include but not limited\nto:\n8.1.1. blemishes\n8.1.2. spoilage\n8.1.3. off color\n8.1.4. irregular size and shape\n8.1.5. off-odor\n8.1.6. stale\n8.1.7. insect/disease damage\n8.1.8. presence of insects and other contaminants,\nmolds, etc.\n\n8.2 For semi-processed/finished products, defects may\ninclude but not limited to: :\n8.2.1. damaged packaging\n8.2.2. contaminated contents\n8.2.3. packaging materials(off-color, deformed,\ncracked)\n8.2.4. off-odor\n8.2.5. thawed (for frozen foods)\n\n--- PDF PAGE 44 ---\n_________________________________________\n\nTR - Food Processing NC I\n42\n9. Physical Property\nThe main physical properties to sort and grade foods are:\n9.1.\nSize\n9.2.\nShape\n9.3.\nWeight\n9.4.\nColor\n9.5.\nVariety\n9.6.\nMaturity\n9.7.\nFreshness\n\nThe acceptable ranges of values for these physical\nproperties are defined in accordance with the required\nspecifications.\n10. Records\nMay include but not limited to:\n10.1. Items inspected / sorted\n10.2. Inspector’s name\n10.3. Date and place of inspection\n10.4. Spoilage and rejects\n10.5. Yields and recoveries\n10.6. Supplier details\n11. Reports\n11.1. Oral\n11.2.\nWritten\n\n--- PDF PAGE 45 ---\n_________________________________________\n\nTR - Food Processing NC I\n43\n\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Prepared and checked equipment, tools and materials\nfor inspection and sorting\n1.2 Cleaned and sanitized equipment and tools\n1.3 Followed the procedures and techniques in inspection\nand sorting\n1.4 Operated equipment\n1.5 Cleaned and stored equipment and tools after use\n1.6 Completed records in line with workplace requirements\n\nThe skills and knowledge required in inspecting and sorting\nraw materials and product must be transferable to a different\nwork environment.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this\nstandard in the workplace, to transfer the skills to other\ncontexts, and to deal with unplanned events. The knowledge\nrequirements for this competency standard are listed below:\n2.1.\nPrinciples and procedures for inspection and sorting\n2.2.\nBasic characteristics of materials and products for\ninspection and sorting\n2.3.\nPreparation and handling of materials and products for\ninspection and sorting\n2.4.\nIdentification of out-of-specification materials and\nproducts, and required action\n2.5.\nRecording and reporting procedures relevant to\ninspection and sorting\n2.6.\nTypes,\noperation,\nand\nroutine\nmaintenance\nof\nequipment, tools and instruments for inspection and\nsorting\n2.7.\nCleaning and sanitation procedures\n2.8.\nFood safety principles and practices\n2.9.\nProper waste disposal\n2.10. Recycling/by-product utilization\n2.11. Environmental protection and concerns\n2.12. Awareness of Codes or Regulations such as Hazard\nAnalysis Critical Control Point (HACCP) and Good\nManufacturing Practice (GMP)\n2.13. Weights, measures, conversions, percentages, ratios\nand proportions\n2.14. Basic\narithmetical\noperations\nlike\nmultiplication,\ndivision, addition and subtraction\n\n--- PDF PAGE 46 ---\n_________________________________________\n\nTR - Food Processing NC I\n44\n\nAttitudes:\n2.15. Punctual/Time conscious\n2.16. Cost conscious\n2.17. Environmental and pollution conscious\n2.18. Flexible/adaptable\n2.19. Honest\n2.20. Socially responsible\n2.21. Dependable\n2.22. Innovative\n2.23. Alert\n2.24. Systematic and organized\n2.25. Good listener and fast learner\n2.26. Resourceful\n2.27. Morally responsible\n2.28. Personal hygiene\n3. Underpinning\nSkills\n3.1 Oral and written communication skills\n3.2 Ability to read and interpret instructions\n3.3 Basic mathematical skills (addition, subtraction, division,\nmultiplication, percentage)\n3.4 Computation of spoilage, rejects, yields and recoveries\n3.5 Recording and reporting skills\n3.6 Sanitary food handling practices\n4. Methods of\nAssessment\nCompetency must be assessed through:\n4.1. Direct observation with oral questioning\n4.2. Demonstration with oral questioning\n4.3. Portfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1 Specific work area/station\n5.2 Raw materials and products for inspection and sorting\n5.3 Equipment and tools for inspection and sorting\n5.4 Other materials relevant to the proposed activity\n5.5 Relevant workplace procedures, schedules and records\n\n6. Context of\nAssessment\n6.1 Assessment should occur on the job or in a simulated\nworkplace.\n6.2 Ability to apply competency over time and on a number\nof occasions.\n\n--- PDF PAGE 47 ---\n_________________________________________\n\nTR - Food Processing NC I\n45\n\nUNIT OF COMPETENCY: DISPENSE NON-BULK INGREDIENTS\n\nUNIT CODE : AGR741307\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and Attitudes\nrequired to prepare, measure and/or weigh, and label non-\nbulk ingredients to meet production requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the Range of Variables\n1. Prepare to dispense\ningredients\n1.1. Materials are inspected to confirm type, quality\nclearance, quantities and identify any obvious\ncontamination or non-conformance with workplace\nrequirements\n1.2. Appropriate measuring/dispensing and weighing\nequipment are selected according to dispensing\nrequirements\n1.3. Availability of containers/bags and labels are\nconfirmed according to dispensing requirements\n1.4. Pre-start checks are carried out according to\nmanufacturer’s specifications and workplace\nprocedures\n1.5. Appropriate personal protective equipment (PPE)\nis used according to workplace procedures and\noccupational health and safety (OHS)\nrequirements\n2. Measure and/or weigh\ningredients\n2.1. Non-bulk ingredients and additives are\nweighed/measured according to production\nrequirements\n2.2. Dispensed ingredients are labeled according to\nworkplace procedures\n2.3. Accurate of measuring/dispensing equipment is\nmonitored to identify variation in operating conditions\naccording to production requirements\n\n--- PDF PAGE 48 ---\n_________________________________________\n\nTR - Food Processing NC I\n46\n\n2.4. Variation in equipment operation is identified and\nmaintenance requirements are reported according to\nworkplace reporting requirements\n2.5. Workplace is maintained according to housekeeping\nstandards\n3. Complete the\ndispensing process\n3.1. Dispensing equipment is cleaned according to\nmanufacturer’s specifications and workplace\nprocedures\n3.2. Maintenance requirements and unacceptable\nequipment/utensil conditions are identified and\nreported according to workplace procedures\n3.3. Records are completed according to workplace\nprocedures\n\n--- PDF PAGE 49 ---\n_________________________________________\n\nTR - Food Processing NC I\n47\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nNon-bulk ingredients / additives which may include but not\nlimited to:\n1.1\nColors\n1.2\nFlavors\n1.3\nBuffered acids\n1.4\nPreservatives\n1.5\nProcessing aids\n1.6\nSanitizing agents\n1.7\nGRAS (Generally Recognized As Safe) and E\nnumbers\n2. Workplace\nrequirements\nMay include but not limited to:\n2.1. company policies and procedures\n2.2. standard Operating Procedures (SOPs)\n2.3. specifications, production/dispensing schedules and\ninstructions\n2.4. batch/recipe instructions\n2.5. manufacturers' advice\n2.6. standard forms and reports\n3. Measuring/Dispensing\nequipment\nMay include any one of the following:\n3.1\nScales\n3.2\nPipettes\n3.3\nGraduated cylinders (dry and liquid)\n3.4\nMeasuring cups\n3.5\nThermometer\n3.6\npH meter\n3.7\nRefractometer\n3.8\nOther dispensing instruments and adjuncts\n4. Pre-start checks\nMay include but not limited to:\n4.1\nInspecting equipment for calibration records and\nsticker\n4.2\nInspecting equipment condition for any signs of wear\nand tear\n4.3\nSelecting appropriate settings\n4.4\nConfirming that equipment is clean and correctly\nconfigured for dispensing\n4.5\nEnsuring safety guards are in place\n4.6\nEnsuring that sensors and controls are correctly\npositioned\n4.7\nCanceling isolation or lockouts as required\n\n--- PDF PAGE 50 ---\n_________________________________________\n\nTR - Food Processing NC I\n48\n5. Manufacturer’s\nspecifications\nMay include but not limited to:\n5.1. Handling requirements\n5.2. Operating requirements\n5.3. Calibration sticker\n5.4. Discharge label\n5.5. Reporting\n5.6. Testing\n5.7. Positioning\n5.8. Refilling\n6. Personal protective\nequipment (PPE)\nMay include but not limited to:\n6.1. Apron/laboratory gown\n6.2. Face masks\n6.3. Gloves\n6.4. Rubber boots/safety shoes\n6.5.\nHead gears such as caps, hair nets, ear plug\n7. OHS requirements\nOccupational Health and Safety requirements may include\nbut not limited to:\n7.1 Health/medical certificate\n7.2 DOLE requirements\n7.3 Personal hygiene and good grooming\n7.4 Plant sanitation and waste management\n7.5 Relevant permits (e.g. from City Hall)\n7.6 BFAD requirements\n7.7 PPE requirements\n8. Label\nMay include but not limited to:\n8.1\nName of material\n8.2\nBatch number\n8.3\nWeight/Measure\n8.4\nDate of preparation\n8.5\nOperator/inspector/issuer\n9. Record\nMay include but not limited to:\n9.1\nMaterials used\n9.2\nEquipment used\n9.3\nEquipment faults, including repairs, servicing\nundertaken or recommended, preventive\nmaintenance activities\n9.4\nOperational details\n9.5\nLabels\n\n--- PDF PAGE 51 ---\n_________________________________________\n\nTR - Food Processing NC I\n49\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1. Prepared materials and equipment for dispensing\n1.2. Measured and/or weighed ingredients\n1.3. Dispensed ingredients\n1.4. Used, cleaned and maintained dispensing equipment\n1.5. Followed work procedures\n1.6. Completed required records\n\nThe skills and knowledge required to dispense non-bulk\ningredients must be transferable to a different work\nenvironment.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this\nstandard in the workplace, to transfer the skills to other\ncontexts, and to deal with unplanned events. The\nknowledge requirements for this competency standard are\nlisted below:\n\n2.1. Purpose and basic principles of the dispensing\nprocess\n2.2. Quality characteristics and related handling\nrequirements of materials\n2.3. Storage requirements and shelf life of ingredients\nand additives\n2.4. Contamination and food safety issues related to\ndispensing\n2.5. Corrective action implementation\n2.6. Basic operating principles of equipment\n2.7. Typical equipment malfunctions and related causes\n2.8. Pre-start checks on equipment\n2.9. Cleaning, sanitizing, care and storage of equipment\n2.10. Environmental issues and controls relevant to the\ndispensing process\n2.11. OHS hazards and controls\n2.12. Product/process changeover procedures and\nresponsibilities\n2.13. Awareness of Codes or Regulations such as\nHACCP and GMP\n\n--- PDF PAGE 52 ---\n_________________________________________\n\nTR - Food Processing NC I\n50\nAttitudes:\n2.14. Accurate\n2.15. Honest\n2.16. Environment-conscious\n2.17. Positive work values\n2.18. Cost conscious\n2.19. Safety conscious\n2.20. Personal hygiene\n3. Underpinning Skills\n3.1\nUse of basic equipment to support dispensing\nprocess\n3.2\nMeasure materials and additives within the specified\naccurate range\n3.3\nConduct pre-start checks on equipment\n3.4\nCleaning and sanitation procedures for work area\nand equipment\n3.5\nFollow work procedures\n3.6\nOral and written communication skills\n3.7\nWorking with others and in teams\n3.8\nBasic mathematical skills\n3.9\nTime management\n3.10 Recording and reporting skills\n4. Methods of\nAssessment\nCompetency must be assessed through:\n4.1. Direct observation with oral questioning\n4.2. Demonstration with oral questioning\n4.3.\nPortfolio\n5. Resource Implications\nThe following resources must be provided:\n5.1. Specific work area/station\n5.2. Dispensing equipment and other tools and\nequipment relevant to the proposed activity\n5.3. Materials relevant to the proposed activity\n5.4. Relevant workplace procedures, schedules and\nrecords\n6. Context of\nAssessment\n6.1. Assessment should occur on the job or in a\nsimulated workplace\n6.2. Ability to apply competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 53 ---\n_________________________________________\n\nTR - Food Processing NC I\n51\n\nUNIT OF COMPETENCY: PREPARE RAW / PACKAGING MATERIALS AND\nSUPPLIES FOR PROCESSING\n\nUNIT CODE : AGR741308\n\nUNIT DESCRIPTOR\n: This unit deals with the skills, knowledge and attitudes\nrequired to prepare raw/packaging materials for processing.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the Range of Variables\n1. Select\nraw/packaging\nmaterials and\nsupplies for\nprocessing\n1.1. Raw/Packaging materials and supplies and their\navailability are confirmed according to production\nrequirements\n1.2. Raw/Packaging materials and supplies are received and\nhandled according to workplace and OHS\nrequirements\n1.3. Raw/Packaging materials are placed in the receiving bin\naccording to required specifications.\n2. Prepare\nraw/packaging\nmaterials\n2.1. Raw/Packaging materials are washed or cleaned\naccording to required specifications.\n2.2. Raw materials are prepared according to specifications\n2.3. Records are completed according to workplace\nrequirements\n\n--- PDF PAGE 54 ---\n_________________________________________\n\nTR - Food Processing NC I\n52\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Raw/Packaging\nMaterials and\nSupplies\n1.1 Raw materials and supplies in this Unit of Competency\nmay include any one but not limited to:\n1.1.1 Fruits and vegetables\n1.1.2 Livestock meat and products\n1.1.3 Poultry and poultry products\n1.1.4 Fish and other marine products\n1.1.5 Cereals and starches\n1.1.6 Sugar and sweeteners\n1.1.7 Fats and oils\n1.1.8 Processing supplies\n1.1.8.1 Salt\n1.1.8.2 Sugar\n1.1.8.3 Condiments\n1.1.8.4 Spices\n1.1.8.5 Herbs\n1.1.8.6 Sauces\n\n1.2 Packaging materials and supplies may include but not\nlimited to:\n1.2.1. Containers / Bottles / Cans\n1.2.2. Caps\n1.2.3. Cap seals\n1.2.4. Labels\n1.2.5. Trays\n2. Workplace\nrequirements\nMay include but not limited to:\n2.1 Company policies and procedures\n2.2 Standard operating procedures\n2.3 Work instructions\n2.4 Production schedules\n2.5\nForms and Reports\n3. OHS\nrequirements\nOccupational Health and Safety requirements may include but\nnot limited to:\n3.1 Health/medical certificate\n3.2 DOLE requirements\n3.3 Personal hygiene and good grooming\n3.4 Plant sanitation and waste management\n3.5\nRelevant permits\n3.6 BFAD requirements\n3.7\nPPE requirements\n\n--- PDF PAGE 55 ---\n_________________________________________\n\nTR - Food Processing NC I\n53\n3.6.1\napron/laboratory gown\n3.6.2\nmouth masks\n3.6.3\ngloves\n3.6.4\nrubber boots\n3.6.5\nhead gears such as caps, hairnets, ear plugs\n4. Specifications\nSpecifications may include but not limited to requirements in\nterms of:\n4.1 Size\n4.2 Shape\n4.3 Weight\n4.4 Color\n4.5 Variety\n4.6 Maturity\n4.7 Freshness\n5. Washing\nWashing may include:\n5.1 Automated washing\n5.2 Manual washing\n6. Cleaning\nCleaning may include but not limited to:\n6.1 Washing\n6.2 Brushing\n6.3 Separation of foreign material such as dirt, hair, mud, etc.\n6.4 Filtering\n7. Preparation\nFor raw materials, preparation may include any one but not\nlimited to:\n7.1 Cutting\n7.2 Chopping\n7.3 Grinding\n7.4 Crushing\n7.5 Mashing\n7.6 Draining\n7.7 Weighing\n8. Records\nMay include but not limited to:\n8.1. Materials used\n8.2. Date of preparation\n8.3. Location\n8.4. Batch number\n8.5. Weight/measure\n8.6. Name of person who prepared material\n\n--- PDF PAGE 56 ---\n_________________________________________\n\nTR - Food Processing NC I\n54\n\nEVIDENCE GUIDE\n1. Critical Aspects\nof Competency\nAssessment requires evidence that the candidate:\n\n1.1 Selected raw materials\n1.2 Prepared raw materials for processing\n1.3 Followed work procedures\n1.4 Completed records\n\nThe skills and knowledge required to prepare raw/packaging\nmaterials for processing must be transferable to a different\nwork environment.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this\nstandard in the workplace, to transfer the skills to other\ncontexts, and to deal with unplanned events. The knowledge\nrequirements for this competency standard are listed below:\n\n2.1.\nPrinciples and procedures for preparing raw materials\n2.2.\nProper handling of raw materials\n2.3.\nIdentification and proper use of cleaning/washing\nequipment, implements and utilities\n2.4.\nProper cleaning and/or washing procedure\n\n2.5.\nRecording and reporting procedures\n2.6.\nFood safety principles and practices\n2.7.\nProper waste disposal\n2.8.\nEnvironmental protection and concerns\n2.9.\nAwareness of Codes or Regulations such as HACCP\nand GMP\n\nAttitudes:\n2.10. Time conscious/punctual\n2.11. Cost conscious\n2.12. Environment and pollution conscious\n2.13. Flexible / adaptable\n2.14. Honest\n2.15. Socially responsible\n2.16. Dependable\n2.17. Alert\n2.18. Systematic and organized\n2.19. Good team worker\n2.20. Good listener and fast learner\n2.21. Creative\n\n--- PDF PAGE 57 ---\n_________________________________________\n\nTR - Food Processing NC I\n55\n3. Underpinning\nSkills\n3.1\nCommunication skills (oral and written)\n3.2\nWorking with others and in teams\n3.3\nBasic mathematical skills (weights and measurements,\nratios and proportions)\n3.4\nRecording and reporting skills\n3.5\nSanitary food handling practices\n4. Methods of\nAssessment\nCompetency must be assessed through:\n4.1. Direct observation with oral questioning\n4.2. Demonstration with oral questioning\n4.3.\nPortfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1\nWork area/ station\n5.2\nEquipment and tools to prepare raw/packaging\nmaterials for processing\n5.3\nMaterials relevant to the proposed activity\n5.4\nRelevant workplace procedures, schedules and\nrecords\n6. Context of\nAssessment\n6.1\nAssessment should occur on the job or in a simulated\nworkplace.\n6.2\nAbility to apply competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 58 ---\n_________________________________________\n\nTR - Food Processing NC I\n56\n\nUNIT OF COMPETENCY: OPERATE BASIC EQUIPMENT\n\nUNIT CODE : AGR741309\n\nUNIT DESCRIPTOR : This competency standard covers the skills, knowledge and\nattitudes required to select, prepare, operate and maintain\nbasic equipment. It involves equipment requiring limited\napplication of equipment and process knowledge and limited\nequipment\nadjustment.\nCompetency\nalso\nrequires\nknowledge of the functions associated with operational\nequipment, including undertaking routine maintenance and\nreporting faults to appropriate persons. This unit is generic\nand should be customized for a given piece of equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the Range of Variables\n1. Select and prepare\nequipment for use\n1.1. Basic machine/equipment required to complete\ntasks is identified and accessed in accordance with\nassignment instructions and workplace\nrequirements\n1.2. Routine pre-operational checks are carried out\naccording to manufacturers’ specifications and\nworkplace procedures\n1.3. Faulty and damaged machine/equipment is identified\nand reported according to workplace procedures\n1.4. Any training required to operate machine/equipment\nis identified and notified to appropriate person(s)\naccording to supplier and workplace requirements\n2. Operate equipment\n\n2.1. Suitable personal protective equipment is\nselected, used and maintained in accordance with\noccupational health and safety (OHS)\nrequirements, and manufacturers’ specifications\n2.2. Machine/Equipment is operated in a safe and\ncontrolled manner in accordance with OHS\nrequirements and manufacturers’ specifications\n2.3. Out-of-specification product, process and equipment\nperformance is identified and reported according to\nworkplace procedures\n\n--- PDF PAGE 59 ---\n_________________________________________\n\nTR - Food Processing NC I\n57\n\n3. Maintain equipment\nand resources\n3.1. Machine/Equipment is shut down according to\nworkplace procedures and manufacturers’\nspecifications\n3.2. Work area, tools and machine/equipment are\ncleaned, maintained and stored in accordance with\nworkplace requirements and manufacturers’\nspecifications\n3.3. Faulty or damaged machine/equipment is reported\nfor repair or replacement in accordance with\nworkplace procedures\n3.4. Waste generated by both the process and cleaning\nprocedures is collected, treated, disposed of, or\nrecycled, according to workplace procedures\n3.5. Records and reports are completed and maintained\nin accordance with industry, legislative and\nworkplace requirements\n\n--- PDF PAGE 60 ---\n_________________________________________\n\nTR - Food Processing NC I\n58\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1.\nBasic machine/\nequipment\nMay include any one of the following:\n\n1.1.\nMixer\n1.2.\nBlender\n1.3.\nRoaster\n1.4.\nGrinder\n1.5.\nChopper\n1.6.\nFood processor\n1.7.\nScales\n1.8.\nWashing equipment\n\n1.9.\nFrying equipment\n1.10. Oven\n1.11. Conveyor\n1.12. Freezer\n1.13. Cutter\n1.14. Molder\n\n1.15. Filling machine (bottle, can, pouch, fill and seal)\n1.16. Plastic sealer\n1.17. Vacuum sealer\n1.18. Packing equipment\n1.19. Labeling equipment\n2.\nWorkplace\nrequirements\nMay include but not limited to:\n2.1. Company policies and procedures\n2.2. Standard Operating Procedures\n2.3. Production schedules\n2.4. Operator’s manuals\n2.5. OHS procedures\n2.6. Supervisor’s oral or written instructions\n2.7.\nStandard forms and reports\n3.\nManufacturer’s\nspecifications\nMay include but not limited to:\n3.1. Handling requirements\n3.2. Operating requirements\n3.3. Discharge label\n3.4. Reporting\n3.5. Testing\n3.6. Positioning\n3.7.\nRefilling\n\n--- PDF PAGE 61 ---\n_________________________________________\n\nTR - Food Processing NC I\n59\n4.\nPre-operational\nchecks\nMay include but not limited to:\n4.1. Checking log books\n4.2. Reading manufacturer's instructions\n4.3. Observing and monitoring noise levels for correct\noperation\n4.4. Cleaning\n4.5. Priming\n4.6. Tightening\n4.7. Basic repairs and adjustments\n4.8. Routine maintenance\n4.9. Identification and segregation of unsafe or faulty\nequipment for repair or replacement\n5.\nPersonal\nprotective\nequipment (PPE)\nMay include but not limited to:\n5.1. Masks\n5.2. Safety boots\n5.3. Head protection\n5.4. Safety glasses\n5.5. Gloves\n5.6.\nApron\n6.\nOHS requirements\nOccupational Health and Safety requirements may include\nbut not limited to:\n6.1 Health/medical certificate\n6.2 DOLE requirements\n6.3 Personal hygiene and good grooming\n6.4 Plant sanitation and waste management\n6.5 Relevant permits\n6.6 BFAD requirements\n6.7 PPE requirements\n7.\nRecords and\nreports\nMay include but not limited to:\n7.1. Operational details\n7.2. Equipment faults\n7.3. Recommended repairs or disposal of equipment\n7.4. Materials used\n\n--- PDF PAGE 62 ---\n_________________________________________\n\nTR - Food Processing NC I\n60\n\nEVIDENCE GUIDE\n\n1.\nCritical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1.\nselected and prepared equipment for use\n1.2.\nconducted pre-operational checks on equipment\n1.3.\noperated and shut-down equipment\n1.4.\ncleaned, maintained and stored equipment\n1.5.\nfollowed work procedures\n1.6.\nfollowed recording and reporting guidelines\n\nThe skills and knowledge required to operate basic\nequipment must be transferable to a different work\nenvironment.\n2.\nUnderpinning\nKnowledge\nKnowledge and understanding are essential to apply this\nstandard in the workplace, to transfer the skills to other\ncontexts, and to deal with unplanned events. The\nknowledge requirements for this competency standard are\nlisted below:\n\n2.1.\nTypes, characteristics and functions of basic\nequipment\n2.2.\nEquipment operation and shut-down\n2.3.\nPre-operational checks and procedures\n2.4.\nRoutine maintenance procedures\n2.5.\nCleaning and sanitation procedures for work area\nand equipment\n2.6.\nSecurity and storage of equipment and materials\n2.7.\nLock out and tag out procedures\n2.8.\nSafe workplace procedures\n2.9.\nEmergency procedures\n2.10. Environmental and waste disposal procedures\n2.11. Reporting and documentation requirements and\nprocesses\n2.12. Relevant legislative provisions including OHS\nrequirements\n2.13. Awareness of Codes or Regulations such as\nHACCP and GMP\n\n--- PDF PAGE 63 ---\n_________________________________________\n\nTR - Food Processing NC I\n61\nAttitudes:\n2.14. Accurate\n2.15. Environment-conscious\n2.16. Positive work values\n2.17. Cost conscious\n2.18. Safety conscious\n2.19. Personal hygiene\n3.\nUnderpinning\nSkills\n3.1.\nOperate basic equipment\n3.2.\nConduct pre-start checks on equipment\n3.3.\nApply safe workplace practices and procedures\n3.4.\nCleaning and sanitation procedures for work area\nand equipment\n3.5.\nLocate emergency stop functions on equipment\n3.6.\nEquipment shut-down procedures\n3.7.\nFollow work procedures\n3.8.\nRead and interpret written information\n3.9.\nOral and written communication skills\n3.10. Working with others and in teams\n\n3.11. Time management\n3.12. Recording and reporting skills\n4.\nMethods of\nAssessment\nCompetency must be assessed through:\n4.1.\nDirect observation with oral questioning\n4.2.\nDemonstration with oral questioning\n4.3.\nPortfolio\n5.\nResource\nImplications\nThe following resources must be provided:\n5.1. Specific work area/station\n5.2. Basic equipment\n5.3. Materials relevant to the proposed activity\n5.4. Relevant workplace procedures, schedules and\nrecords\n6.\nContext of\nAssessment\n6.1. Assessment should occur on the job or in a\nsimulated workplace\n6.2. Ability to apply competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 64 ---\n_________________________________________\n\nTR - Food Processing NC I\n62\n\nUNIT OF COMPETENCY: CLEAN AND SANITIZE EQUIPMENT AND\nPROCESSING/PACKAGING AREA\n\nUNIT CODE : AGR741310\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes\nrequired to clean and sanitize equipment and\nprocessing/packaging area. This does not include\nautomated cleaning-in-place (CIP).\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the Range of Variables\n1. Prepare for\ncleaning\n1.1. Cleaning/sanitizing supplies and materials, and\nutilities are identified and availability confirmed\naccording to cleaning and sanitizing requirements\n1.2. Prepare mixture of sanitizing solutions, as necessary,\naccording to workplace requirements and application\n1.3. Equipment and processing/packaging area are cleared\nin preparation for cleaning according to workplace\nrequirements and manufacturer’s specifications\n1.4. Equipment and processing/packaging area are rendered\nsafe to clean according to workplace procedures and\nmanufacturer’s specifications\n2. Clean and sanitize\nequipment and\nprocessing/packaging\narea to meet\nworkplace\nrequirements\n2.1. Equipment and processing/packaging area are cleaned\nand sanitized according to workplace procedures, OHS\nrequirements, and manufacturer’s specifications\n2.2. Equipment and processing/packaging area are\ninspected according to required operating conditions\nand cleanliness\n2.3. Unacceptable equipment and processing/packaging\narea conditions are identified and reported according to\nworkplace procedures\n2.4. Cleaning equipment and chemicals are stored according\nto workplace procedure\n2.5. Waste from cleaning process is disposed of according to\nworkplace and OHS requirements, and\nregulatory/legislative requirements\n2.6. Equipment and processing/packaging area are restored\nto operating order according to workplace procedures\n2.7. Records are completed in line with workplace\nrequirements\n\n--- PDF PAGE 65 ---\n_________________________________________\n\nTR - Food Processing NC I\n63\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Cleaning/Sanitation\nsupplies and\nmaterials\n\nMay include but not limited to:\n1.1.\nChemicals (cleaners, sanitizers, etc.)\n1.2.\nCleaning and scouring pads\n1.3.\nWashcloth\n1.4.\nBrush\n1.5.\nPail\n1.6.\nBasin\n1.7.\nDipper\n1.8.\nHose\n1.9.\nMop\n1.10. Mop wringer\n1.11. Squeegee\n1.12. pressure washer\n1.13. vacuum cleaner\n1.14. Garbage bin / Trash bag\n1.15. Sink\n1.16. Towel dispenser\n1.17. litmus paper (for testing effectiveness of cleaning)\n1.18. ATP (adenosine triphosphate) quick test\n2. Utilities\nMay include but not limited to:\n2.1. Power\n2.2. Water\n2.3. Steam\n2.4. Compressed air\n2.5. Instrumentation air\n3. Workplace\nrequirements\nMay include but not limited to:\n3.1. Company policies and procedures\n3.2. Standard Operating Procedures\n3.3. Production and cleaning schedules and instructions\n3.4. Materials Safety Data Sheets\n3.5. Supervisor’s oral and written instructions\n3.6. Manufacturer’s advice\n3.7. Operator’s manuals\n3.8. Standard forms and reports\n\n--- PDF PAGE 66 ---\n_________________________________________\n\nTR - Food Processing NC I\n64\n\n4. Manufacturer’s\nspecifications\nMay include but not limited to:\n4.1 Handling requirements\n4.2 Operating requirements\n4.3 Cleaning requirements\n4.4 Discharge label\n4.5 Calibration sticker\n4.6 Reporting\n4.7 Testing\n4.8 Positioning\n4.9\nRefilling\n5. Cleaning and\nsanitation\n5.1 Cleaning involves the removal of soil, a substance\nwhich is in the wrong place. Soil may include but not\nlimited to the following:\n5.1.1. Organic - produced by cooking equipment\nand deposited on ceilings, walls, exhaust\nhood, food production equipment, utensils and\ntableware\n5.1.2 Inorganic – airborne (free floating) or bonded\ndust which adheres to surfaces\n5.2 Sanitation involves the destruction of pathogens that\nsurvive the cleaning process\n6. Occupational Health\nand Safety (OHS)\nrequirements\nMay include but not limited to:\n6.1\nHealth/medical certificate\n6.2\nDOLE requirements\n6.3\nPersonal hygiene and good grooming\n6.4\nPlant sanitation and waste management\n6.5\nRelevant permits\n6.6\nBFAD requirements\n6.7\nPPE requirements\n6.7.1\nprotective clothing (coverall, apron)\n6.7.2\nhead gears such as caps, hairnets, ear plugs\n6.7.3\nsafety glasses\n6.7.4\nmouth masks\n6.7.5\ngloves\n6.7.6\nrubber boots / safety shoes\n7. Regulatory/\nLegislative\nrequirements\nMay include but not limited to:\n7.1. Licensing requirements\n7.2. DOLE regulations\n7.3. Dangerous Drugs Act\n7.4. DENR/EMB regulations\n\n--- PDF PAGE 67 ---\n_________________________________________\n\nTR - Food Processing NC I\n65\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1. prepared for cleaning equipment and\nprocessing/packaging area\n1.2. prepared supplies, materials and utilities for\ncleaning and sanitation\n1.3. cleaned and sanitized equipment and\nprocessing/packaging area to meet workplace\nrequirements\n1.4. restored equipment and processing/packaging area\nto operating order\n1.5. followed work procedures\n1.6. completed records and reports\n\nThe skills and knowledge required to clean and sanitize\nequipment and processing/packaging area must be\ntransferable to a different work environment.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this\nstandard in the workplace, to transfer the skills to other\ncontexts, and to deal with unplanned events. The\nknowledge requirements for this competency standard are\nlisted below:\n\n2.1.\nPurpose and basic principles of cleaning and\nsanitation\n2.2.\nCleaning and sanitation requirements for\nequipment and processing/packaging area\n2.3.\nMethods used to render equipment and\nprocessing/packaging area safe to clean and\nsanitize\n2.4.\nCharacteristics and functions of cleaning and\nsanitizing chemicals, including proper handling, use\nand storage\n2.5.\nSafe work procedures including appropriate\nsignage of cleaning activities and safe handling\nand storage of cleaners and sanitizers used\n2.6.\nPurpose and limitations of protective clothing and\nequipment\n\n--- PDF PAGE 68 ---\n_________________________________________\n\nTR - Food Processing NC I\n66\n2.7.\nEquipment settings required for cleaning and for\noperating, respectively\n2.8.\nInspection points for cleaning and sanitation\n2.9.\nConduct swab tests\n2.10. Possible corrective actions for out-of-specification\nresults\n2.11. Consequences of contamination of process flows\nby cleaning solutions and related safeguards\n2.12. Environmental consequences of incorrect cleaning\nwaste disposal procedures\n2.13. Reporting and recording systems\n2.14. Types of waste generated by both the production\nand the cleaning process and related collection,\ntreatment and disposal requirements\n2.15. Requirements to liase/advise related work areas\n2.16. Conduct routine maintenance\n2.17. OHS hazards and risks\n2.18. Regulatory and legislative requirements\n2.19. Awareness of Codes or Regulations such as\nHACCP and GMP\n\nAttitudes:\n2.20. Accurate\n2.21. Systematic and organized\n2.22. Environment-conscious\n2.23. Positive work values\n2.24. Cost conscious\n2.25. Safety conscious\n2.26. Personal hygiene\n3. Underpinning Skills\n3.1. Ability to access workplace information relevant to\ncleaning and sanitizing equipment and\nprocessing/packaging area\n3.2. Prepare equipment and processing/packaging area\nfor cleaning and sanitizing\n3.3. Clean and sanitize equipment and\nprocessing/packaging area according to cleaning\nand sanitation process cycle and procedures\n3.4. Conduct relevant checks and inspections to confirm\neffectiveness of cleaning and sanitation\n3.5. Take corrective action for out-of-specification results\n3.6. Return equipment and processing/packaging area to\noperating order\n\n--- PDF PAGE 69 ---\n_________________________________________\n\nTR - Food Processing NC I\n67\n3.7. Follow work procedures\n3.8. Oral and written communication skills\n3.9. Recording and reporting skills\n4. Methods of\nAssessment\nCompetency must be assessed through:\n4.1. Direct observation with oral questioning\n4.2. Demonstration with oral questioning\n4.3. Portfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1. Specific work area/station\n5.2. Equipment and tools relevant to cleaning and\nsanitizing equipment and processing/packaging area\nMaterials relevant to the proposed activity\n5.3. Relevant workplace procedures, schedules and\nrecords\n6. Context of\nAssessment\n6.1. Assessment should occur on the job or in a\nsimulated workplace\n6.2. Ability to apply competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 70 ---\n_________________________________________\n\nTR - Food Processing NC I\n68\n\nUNIT OF COMPETENCY: LOAD AND UNLOAD RAW MATERIALS, PRODUCTS\nAND/OR SUPPLIES\n\nUNIT CODE : AGR741311\n\nUNIT DESCRIPTOR : This unit involves the skills, knowledge and attitudes\nrequired to load and unload raw materials, products and\nsupplies. It includes loading and unloading activities,\nsecuring and protecting the load and completing all\nrequired documentation.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the Range of Variables\n\n1. Load and unload raw\nmaterials, products and\nsupplies.\n\n1.1\nLoading and unloading procedures are selected\naccording to workplace and OHS requirements\n1.2\nDangerous or hazardous raw materials, products\nand/or supplies are identified and handled in\naccordance with OHS, regulatory and legislative\nrequirements\n1.3\nRaw materials, products and/or supplies requiring\nspecial handling and/or documentation are identified\nand appropriate procedures followed according to\nworkplace requirements\n1.4\nRaw materials, products and/or supplies are\npacked/unpacked according to workplace\nrequirements\n1.5\nRaw materials, products and/or supplies are loaded\nin accordance with relevant material loading\nregulations and workplace procedures\n1.6\nLifting aids and appliances are selected and used\naccording to loading procedures in compliance with\nworkplace requirements and legislation\n1.7\nUnloading activities are conducted safely and\nefficiently according to workplace requirements\n1.8\nHazards and risks are identified and controls\nimplemented according to OHS and workplace\nrequirements\n\n--- PDF PAGE 71 ---\n_________________________________________\n\nTR - Food Processing NC I\n69\n\n2 . Secure and protect\nload\n2.1. Load distribution is checked to ensure that it is even,\nlegal and within the working capacity according to\nworkplace procedures\n2.2. Load is checked to ensure that dangerous goods\nand hazardous substances are appropriately\nsegregated in accordance with regulatory and\nworkplace requirements\n2.3. Load is secured using the correct load restraint and\nprotection equipment, carrying and garage\nconditions according to workplace and OHS\nrequirements\n2.4. The load is protected in accordance with legal and\nworkplace safety requirements\n3. Complete\ndocumentation\n3.1. Raw materials, products and/or supplies are selected\nand checked for ability to travel in accordance with\nrelevant regulations/permit requirements\n3.2. All required records are completed in accordance\nwith legislative and workplace requirements\n\n--- PDF PAGE 72 ---\n_________________________________________\n\nTR - Food Processing NC I\n70\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1.\nWorkplace\nrequirements\nMay include but not limited to:\n1.1. Company policies and procedures\n1.2. Standard Operating Procedures\n1.3. Workplace operations manual\n1.4. Work instructions\n1.5. Production schedules\n1.6. Manufacturers' specifications\n1.7. Warehouse plan/layout\n1.8. Labels and codes\n1.9. Safety signs and symbols\n1.10.Standard forms and reports\n2.\nOccupational\nHealth and Safety\n(OHS)\nrequirements\nMay include but not limited to:\n2.1. Health/medical certificate\n2.2. DOLE requirements\n2.3. Personal hygiene and good grooming\n2.4. Plant sanitation and waste management\n2.5. Relevant permits\n2.6. BFAD requirements\n2.7. PPE requirements\n2.1.1. high visibility clothing / coveralls\n2.1.2. head gears such as caps, hairnets, ear plugs\n2.1.3. safety glasses\n2.1.4. mouth masks\n2.1.5. gloves\n2.1.6. rubber boots\n3.\nRaw materials,\nproducts and\nsupplies\nMay include but not limited to:\n5.1. Raw materials\n5.2. Goods in process\n5.3. Finished goods\n5.4. Packaging materials and supplies\n5.5. Tools and equipment\n5.6. Office and stationery supplies\n5.7. Forms, brochures and documents\n\nMay also be:\n5.8. Irregularly shaped\n5.9. Packaged or unpackaged\n5.10. Labeled or unlabelled\n5.11. In palettes or not\n\n--- PDF PAGE 73 ---\n_________________________________________\n\nTR - Food Processing NC I\n71\n4.\nRegulatory and\nlegislative\nrequirements\nMay include but not limited to:\n4.2. Licensing requirements\n4.3. DOLE regulations\n4.4. Dangerous Drugs Act\n4.5.\nDENR/EMB regulations\n5.\nHazards and risks\nMay include but not limited to:\n5.1. Chemicals\n5.2. Dangerous or hazardous substances\n5.3. Movements of equipment, goods and materials\n5.4. Wet and iced operating surfaces\n5.5. Oil on operating surface\n5.6. Faulty brakes\n5.7. Workplace obstacles and other operational\nequipment and vehicles\n5.8. Damaged loads and pallets\n5.9.\nOther personnel in work area\n6.\nRecords\nMay include but not limited to:\n6.1. Name of personnel (loader/unloader)\n6.2. Date and place of loading/unloading\n6.3. Type of raw materials, products and supplies\n6.4. Goods and container identification\n6.5. Quantity / Inventory count\n6.6. Quality specifications\n6.7. “Use by / best before” dates\n6.8. Picking slips\n6.9. Merchandise transfers\n6.10. Stock requisitions\n6.11. Operations and service record book or log\n6.12. Supplier and/or client instructions\n6.13. Warehouse/Container requirements (e.g. relative\nhumidity, temperature, and ventilation)\n6.14. Traceability information\n\n--- PDF PAGE 74 ---\n_________________________________________\n\nTR - Food Processing NC I\n72\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1. Loaded and unloaded raw materials, products and\nsupplies\n1.2. Handled properly dangerous goods and\nsubstances, and goods requiring special handling\n1.3. Identified hazards and risks and performed\nrequired action\n1.4. Selected and used lifting aids and appliances\n1.5. Secured and protected load\n1.6. Completed records and reports\n1.7. Followed work procedures\n\nThe skills and knowledge required to load and unload raw\nmaterials, products and supplies must be transferable to a\ndifferent work environment.\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge and understanding are essential to apply this\nstandard in the workplace, to transfer the skills to other\ncontexts, and to deal with unplanned events. The\nknowledge requirements for this competency standard are\nlisted below:\n\n2.1.\nBasic characteristics of raw materials, products\nand supplies relevant to loading and unloading\n2.2.\nBasic principles and procedures for loading and\nunloading\n2.3.\nProper distribution of load\n2.4.\nMethods of securing and protecting load\n2.5.\nWarehouse plan/Site layout and obstacles\n2.6.\nWorkplace operating procedures\n2.7.\nHazard and risk identification and control\n2.8.\nEmergency response procedures\n2.9.\nOHS requirements\n2.10. Regulatory requirements\n2.11. Awareness of Codes or regulations such as\nHACCP and GMP\n\nAttitudes:\n2.12. Honest\n2.13. Accurate\n2.14. Environment-conscious\n\n--- PDF PAGE 75 ---\n_________________________________________\n\nTR - Food Processing NC I\n73\n2.15. Positive work values\n2.16. Cost conscious\n2.17. Safety conscious\n2.18. Personal hygiene\n3. Underpinning Skills\n3.1. Identification of load characteristics\n3.2. Safe loading and unloading procedures\n3.3. Distributing, securing and protecting load\n3.4. Identification and use of appropriate equipment for\nloading/unloading\n3.5. Modification of activities according to risks and\nenvironments\n3.6. Identification of containers and goods coding\n3.7. Safe manual handling techniques\n3.8. Operate manual load shifting equipment\n3.9. Estimation of size, shape and special requirements\nof loads\n3.10. Locate, interpret and apply relevant information\n3.11. Follow work procedures\n3.12. Oral and written communication skills\n3.13. Recording and reporting skills\n4. Methods of\nAssessment\nCompetency must be assessed through:\n4.1. Direct observation with oral questioning\n4.2. Demonstration with oral questioning\n4.3.\nPortfolio\n5. Resource\nImplications\nThe following resources must be provided:\n5.1. Specific work area/station\n5.2. Equipment and tools relevant to loading/unloading\nraw materials, products and supplies\n5.3. Materials relevant to the proposed activity\n5.4. Workplace procedures, schedules and records\n6. Context of\nAssessment\n6.1 Assessment should occur on the job or in a\nsimulated workplace\n6.2 Ability to apply competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 76 ---\n_________________________________________\n\nTR - Food Processing NC I\n74"
