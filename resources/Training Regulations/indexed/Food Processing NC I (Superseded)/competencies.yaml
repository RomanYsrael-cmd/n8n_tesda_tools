        "source_title": "FOLLOW WORK PROCEDURES TO MAINTAIN GOOD MANUFACTURING PRACTICE",
        "source_text": "--- PDF PAGE 30 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n28\n \n \nUNIT OF COMPETENCY:    FOLLOW WORK PROCEDURES TO MAINTAIN GOOD \nMANUFACTURING PRACTICE \n \nUNIT CODE                     :    AGR741207 \n \nUNIT DESCRIPTOR      :   This unit covers the skills, knowledge and attitudes required \nto comply with Good Manufacturing Practice (GMP) \nrequirements and workplace quality standards. \n \n \nELEMENTS \nPERFORMANCE CRITERIA \nitalicized terms are elaborated in the  \nRange of Variables\n1. Identify requirements \nfor GMP related to own \nwork \n1.1. Sources of information on GMP requirements are \nlocated according to workplace procedures \n1.2. GMP requirements and responsibilities related to own \nwork are identified according to workplace procedures\n2. Observe personal \nhygiene and conduct to \nmeet GMP \nrequirements \n2.1. Personal hygiene is observed in line with GMP \nrequirements  \n2.2. Appropriate clothing and footwear is prepared, used, \nstored and disposed of according to GMP and \nworkplace procedures  \n2.3. Personal movement around the workplace is made in \nline with area entry and exit procedures\n3. Follow GMP \nrequirements when \ncarrying out work \nactivities \n3.1. Raw materials, product and packaging components are \nhandled according to GMP and workplace procedures  \n3.2. Work area, materials, equipment and product are \nroutinely monitored to ensure compliance with GMP \nrequirements \n3.3. Contamination is identified and appropriate control \nmeasures relating to work responsibilities are followed \nin accordance with GMP requirements \n3.4. Processes, practices or conditions which are not \nconsistent with GMP are identified and reported \naccording to workplace reporting procedures \n3.5. The workplace is kept clean and tidy in line with GMP \nhousekeeping standards\n4. Complete workplace \ndocumentation to \nsupport GMP \n4.1. Documentation and recording requirements are \nidentified according to workplace procedures and GMP \nrequirements \n4.2. Information is recorded according to workplace \nreporting procedures to meet GMP requirements\n\n--- PDF PAGE 31 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n29\n \n \nRANGE OF VARIABLES \n \nVARIABLES\nRANGE\n1. Sources of \ninformation \n1.1. GMP manuals \n1.2. Standard Operating Procedures (SOPs) \n1.3. Workplace procedures and policies \n1.4. Quality assurance procedures \n1.5. Standard forms and reports \n1.6. Relevant legislations/regulations \n1.6.1. Food processing and food safety regulations \n1.6.2. Department of Health – Food Establishments – \nCode of Sanitation of the Philippines (PD 586) \n1.6.3. Department of Environment and Natural \nResources – Environmental Management Bureau \nregulations regarding emissions, waste treatment, \nnoise and effluent treatment and control\n2. Workplace \nprocedures \n2.1. Standard operating procedures (SOPs) \n2.2. Production and cleaning schedules and instructions \n2.3. Materials Safety Data Sheets (MSDS) \n2.4. Manufacturers' advice \n2.5. Written or verbal instructions \n2.6. Standard forms and reports\n3. GMP \nrequirements \nMay relate to: \n3.1. Own work \n3.2. Personal hygiene \n3.3. Use, storage and disposal of personal protective \nequipment \n3.4. Personal movement \n3.5. Work area, including materials, equipment and utensils \n3.6. Product handling and monitoring \n3.7. Contamination \n3.8. Pest management (e.g. flies, ants, roaches, rodents) \n3.9. Recording and reporting systems\n4. Personal hygiene \nHealth practices that include but not limited to: \n4.1. Cleaning the body  (e.g. daily bath, etc.) \n4.2. Hand care  (e.g. washing, maintaining nails, etc.) \n4.3. Feet care  \n4.4. Hair care \n4.5. Use of clean clothing \n4.6. Personal habits (e.g. smoking, touching of mouth, nose, \netc.)\n\n--- PDF PAGE 32 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n30\n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n \n1.1. identified GMP requirements related to work \n1.2. observed personal hygiene and conduct to meet \nGMP requirements \n1.3. followed GMP requirements when carrying out work \nactivities \n1.4. completed workplace documentation to support GMP\n \nThe skills and knowledge required to follow work \nprocedures to maintain GMP must be transferable to a \ndifferent work environment.  \n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this \nstandard in the workplace, to transfer the skills to other \ncontexts, and to deal with unplanned events.  The \nknowledge requirements for this competency standard are \nlisted below: \n \n2.1. \nThe role and importance of GMP  \n2.2. \nThe relationship between the Code of Good \nManufacturing Practice and workplace procedures, \nsystems and processes \n2.3. \nGMP personnel and their respective responsibilities\n2.4. \nPersonal role, responsibility and accountability for \nimplementing GMP \n2.5. \nSources of advice on GMP requirements for own \nwork \n2.6. \nPersonal clothing and footwear requirements for \nworking in and/or moving between work areas \n2.7. \nPersonal clothing use, storage and disposal \nrequirements \n2.8. \nCommon types and sources of contamination that \noccurs in the work area  \n2.9. \nCommon control methods and procedures used in \nthe work area to maintain GMP \n2.10. Monitoring, inspection and checking procedures \nrelevant to own work \n2.11. Standards for materials, equipment and utensils \nused in the work area\n\n--- PDF PAGE 33 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n31\n \n2.12. Evidence of out-of-standard or unacceptable \nperformance relating to work responsibilities \n2.13. Action required in the event of non-compliance \nwithin area of responsibility \n2.14. Storage and handling requirements for raw \nmaterials, packaging components and products \nrelevant to work role \n2.15. Housekeeping requirements and responsibilities \nrelating to own work.  \n2.16. Waste collection, recycling and handling \nprocedures relevant to own work responsibilities \n2.17. Responsibilities for reporting and recording  \ninformation \n \nAttitudes \n2.18. Maintain work area in a clean and tidy state \n2.19. Obedience \n2.20. Accuracy \n2.21. Environment-conscious \n2.22. Positive work values \n2.23. Work ethics \n2.24. Cost consciousness \n2.25. Safety consciousness \n2.26. Personal hygiene\n3. Underpinning Skills \n3.1. \nLocate and follow workplace information relating to \nGMP responsibilities \n3.2. \nUse, store and dispose of appropriate clothing / \nfootwear as required by work tasks and consistent \nwith GMP  \n3.3. \nCarry out relevant checks and inspections as \nrequired \n3.4. \nIdentify and respond to out-of-specification or \nunacceptable conditions or performance within \narea of responsibility \n3.5. \nIdentify and report situations that do or could \ncompromise GMP \n3.6. \nHandle and/or dispose of out-of-specification or \ncontaminated materials, packaging \ncomponents/consumables and product, waste and \nrecyclable material according to GMP as required \nby work responsibilities\n\n--- PDF PAGE 34 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n32\n3.7. \nIdentify and report signs of pest infestation \n3.8. \nFollow relevant GMP and work procedures  \n3.9. \nOral and written communication skills \n3.10. Recording and reporting skills \n4. Methods of \nAssessment \nCompetency must be  assessed through: \n4.1. \nDirect observation with oral questioning \n4.2. \nDemonstration with oral questioning \n5. Resource Implications \nThe following resources must be provided: \n5.1. Specific work area/station \n5.2. Equipment and tools related to following GMP \nrequirements \n5.3. Materials relevant to the proposed activity  \n6. Context of \nAssessment \n6.1. Assessment should occur on the job or in a \nsimulated workplace \n6.2. Ability to apply competency over time and on a \nnumber of occasions.\n",
