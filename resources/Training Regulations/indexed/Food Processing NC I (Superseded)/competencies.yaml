        "source_text": "500311104\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto apply the basic housekeeping procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the Range of Variables\n\n1. Sort and remove\nunnecessary items\n\n1.1 Reusable, recyclable materials are sorted in\naccordance with company/office procedures\n1.2 Unnecessary items are removed and disposed of in\naccordance with company or office procedures\n2. Arrange items\n2.1 Items are arranged in accordance with company/office\nhousekeeping procedures\n2.2 Work area is arranged according to job requirements\n2.3 Activities are prioritized based on instructions.\n2.4 Items are provided with clear and visible identification\nmarks based on procedure\n2.5 Safety equipment and evacuation passages are kept\nclear and accessible based on instructions\n3. Maintain work area,\ntools and\nequipment\n3.1 Cleanliness and orderliness of work area is maintained\nin accordance with company/office procedures\n3.2 Tools and equipment are cleaned in accordance with\nmanufacturer’s instructions/manual\n3.3 Minor repairs are performed on tools and equipment in\naccordance with manufacturer’s instruction/manual\n3.4 Defective tools and equipment are reported to\nimmediate supervisor\n4. Follow standardized\nwork process and\nprocedures\n4.1 Materials for common use are maintained in designated\narea based on procedures\n4.2 Work is performed according to standard work\nprocedures\n4.3 Abnormal incidents are reported to immediate\nsupervisor\n5. Perform work\nspontaneously\n5.1 Work is performed as per instruction\n5.2 Company and office decorum are followed and\ncomplied with\n5.3 Work is performed in accordance with occupational\nhealth and safety (OHS) requirements\n\n--- PDF PAGE 17 ---\n_________________________________________\n\nTR - Food Processing NC I\n15\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Unnecessary items\nMay include but are not limited to:\n1.1 Non-recyclable materials\n1.2 Unserviceable tools and equipment\n1.3 Pictures, posters and other materials not\n related to work activity\n1.4 Waste materials\n2. Identification marks\n2.1 Labels\n2.2 Tags\n2.3 Color coding\n3. Decorum\n3.1 Company/ office rules and regulations\n3.2 Company/ office uniform\n3.3 Behavior\n4. Minor repair\nMinor repair include but not limited to:\n4.1 Replacement of parts\n4.2 Application of lubricants\n4.3 Sharpening of tools\n4.4 Tightening of nuts, bolts and screws\n\n--- PDF PAGE 18 ---\n_________________________________________\n\nTR - Food Processing NC I\n16\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n\n1.1 Practiced the basic procedures of 5S\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Principles of 5S\n2.2 Work process and procedures\n2.3 Safety signs and symbols\n2.4 General OH&S principles and legislation\n2.5 Environmental requirements relative to work safety\n2.6 Accident/Hazard reporting procedures\n3. Underpinning skills\n3.1 Basic communication skills\n3.2 Interpersonal skills\n3.3 Reading skills required to interpret instructions\n3.4 Reporting/recording accidents and potential hazards\n4. Resource implications\nThe following resources MUST be provided:\n4.1 Facilities, materials tools and equipment necessary\nfor the activity\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1. Third party report\n5.2. Interview\n5.3. Demonstration with questioning\n6. Context for\nassessment\n6.1 Competency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 19 ---\n_________________________________________\n\nTR - Food Processing NC I\n17\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY: APPLY FOOD SAFETY AND SANITATION\n\nUNIT CODE\n :"
