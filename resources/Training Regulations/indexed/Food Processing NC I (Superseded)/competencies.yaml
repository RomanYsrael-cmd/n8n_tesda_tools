        "evidence_guide": {
          "source_text": "1. Critical aspects\n of competency\nAssessment requires evidence that the candidate:\n\n1.1 Defined one’s unique sense of purpose for working\n1.2 Clarified and affirmed work values/ethics/concepts\nconsistently in the workplace\n1.3 Demonstrated work practices satisfactorily and\nconsistently in compliance with industry work ethical\nstandards, organizational policy and guidelines\n1.4 Demonstrated personal behavior and relationships with\nco-workers and/or clients consistent with ethical\nstandards, policy and guidelines\n1.5 Used company resources in accordance with company\nethical standard, policies and guidelines.\n1.6 Followed company ethical standards, organizational\npolicy and guidelines on the prevention and reporting of\nunethical conduct/behavior\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Occupational health and safety\n2.2 Work values and ethics\n2.3 Company performance and ethical standards\n2.4 Company policies and guidelines\n2.5 Fundamental rights at work including gender sensitivity\n2.6 Work responsibilities/job functions\n2.7 Corporate social responsibilities\n2.8 Company code of conduct/values\n2.9 Balancing work and family responsibilities\n3. Underpinning skills\n3.1. Interpersonal skills\n3.2. Communication skills\n3.3. Self awareness, understanding and acceptance\n3.4. Application of good manners and right conduct\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/Scenarios\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3\nThird Party Reports\n6. Context for\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 16 ---\n_________________________________________\n\nTR - Food Processing NC I\n14\n\nUNIT OF COMPETENCY:\nPRACTICE BASIC HOUSEKEEPING PROCEDURES\n\nUNIT CODE :"
        },
        "source_text": "500311103\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, and attitudes in\ndemonstrating proper work values.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the Range of Variables\n1. Define the\npurpose of work\n\n1.1 One’s unique sense of purpose for working and the why’s\nof work are identified, reflected on and clearly defined for\none’s development as a person and as a member of\nsociety.\n1.2 Personal mission is in harmony with company’s values\n2. Apply work\nvalues/ethics\n2.1 Work values/ethics/concepts are classified and\nreaffirmed in accordance with the transparent company\nethical standards, policies and guidelines.\n2.2 Work practices are undertaken in compliance with\nindustry work ethical standards, organizational policy and\nguidelines\n2.3 Personal behavior and relationships with co-workers\nand/or clients are conducted in accordance with ethical\nstandards, policy and guidelines.\n2.4 Company resources are used in accordance with\ntransparent company ethical standard, policies and\nguidelines.\n3. Deal with ethical\nproblems\n3.1 Company ethical standards, organizational policy and\nguidelines on the prevention and reporting of unethical\nconduct are accessed and applied in accordance with\ntransparent company ethical standard, policies and\nguidelines.\n3.2 Work incidents/situations are reported and/or resolved\nin accordance with company protocol/guidelines.\n3.3 Resolution and/or referral of ethical problems identified\nare used as learning opportunities.\n4. Maintain integrity\nof conduct in the\nworkplace\n4.1 Personal work practices and values are demonstrated\nconsistently with acceptable ethical conduct and\ncompany’s core values.\n4.2 Instructions to co-workers are provided based on ethical,\nlawful and reasonable directives.\n4.3 Company values/practices are shared with co-workers\nusing appropriate behavior and language.\n\n--- PDF PAGE 13 ---\n_________________________________________\n\nTR - Food Processing NC I\n11\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work values/ethics/\nconcepts\nMay include but are not limited to:\n1.1\nCommitment/ Dedication\n1.2\nSense of urgency\n1.3\nSense of purpose\n1.4\nLove for work\n1.5\nHigh motivation\n1.6\nOrderliness\n1.7\nReliability\n1.8\nCompetence\n1.9\nDependability\n1.10 Goal-oriented\n1.11 Sense of responsibility\n1.12 Being knowledgeable\n1.13 Loyalty to work/company\n1.14 Sensitivity to others\n1.15 Compassion/Caring attitude\n1.16 Balancing between family and work\n1.17 Pakikisama\n1.18 Bayanihan spirit/teamwork\n1.19\nSense of nationalism\n2. Work practices\n2.1\nQuality of work\n2.2\nPunctuality\n2.3\nEfficiency\n2.4\nEffectiveness\n2.5\nProductivity\n2.6\nResourcefulness\n2.7\nInnovativeness/Creativity\n2.8\nCost conciousness\n2.9\n5S\n2.10\nAttention to details\n3. Incidents/situations\n3.1\nViolent/intensed dispute or argument\n3.2\nGambling\n3.3\nUse of prohibited substances\n3.4\nPilferages\n3.5\nDamage to person or property\n3.6\nVandalism\n3.7\nFalsification\n3.8\nBribery\n3.9\nSexual Harassment\n3.10\nBlackmail\n\n--- PDF PAGE 14 ---\n_________________________________________\n\nTR - Food Processing NC I\n12\n\nVARIABLE\nRANGE\n\n4. Company resources\n\n4.1 Consumable materials\n4.2 Equipment/Machineries\n4.3 Human\n4.4 Time\n4.5 Financial resources\n\n5. Instructions\n\n5.1 Verbal\n5.2 Written\n\n--- PDF PAGE 15 ---\n_________________________________________\n\nTR - Food Processing NC I\n13\nEVIDENCE GUIDE\n\n1. Critical aspects\n of competency\nAssessment requires evidence that the candidate:\n\n1.1 Defined one’s unique sense of purpose for working\n1.2 Clarified and affirmed work values/ethics/concepts\nconsistently in the workplace\n1.3 Demonstrated work practices satisfactorily and\nconsistently in compliance with industry work ethical\nstandards, organizational policy and guidelines\n1.4 Demonstrated personal behavior and relationships with\nco-workers and/or clients consistent with ethical\nstandards, policy and guidelines\n1.5 Used company resources in accordance with company\nethical standard, policies and guidelines.\n1.6 Followed company ethical standards, organizational\npolicy and guidelines on the prevention and reporting of\nunethical conduct/behavior\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Occupational health and safety\n2.2 Work values and ethics\n2.3 Company performance and ethical standards\n2.4 Company policies and guidelines\n2.5 Fundamental rights at work including gender sensitivity\n2.6 Work responsibilities/job functions\n2.7 Corporate social responsibilities\n2.8 Company code of conduct/values\n2.9 Balancing work and family responsibilities\n3. Underpinning skills\n3.1. Interpersonal skills\n3.2. Communication skills\n3.3. Self awareness, understanding and acceptance\n3.4. Application of good manners and right conduct\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/Scenarios\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3\nThird Party Reports\n6. Context for\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 16 ---\n_________________________________________\n\nTR - Food Processing NC I\n14\n\nUNIT OF COMPETENCY:\nPRACTICE BASIC HOUSEKEEPING PROCEDURES\n\nUNIT CODE :"
