        "source_title": "USE STANDARD MEASURING DEVICES AND INSTRUMENTS",
        "source_text": "--- PDF PAGE 23 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n21\n \n \nUNIT OF COMPETENCY        :  USE STANDARD MEASURING DEVICES AND  \nINSTRUMENTS \n \nUNIT CODE \n:   AGR741202 \n \nUNIT DESCRIPTOR                :   This unit deals with the knowledge, skills and attitudes \nrequired \nto \nuse \nstandard \nmeasuring \ndevices, \ninstruments in the workplace \n \n \nELEMENT\nPERFORMANCE CRITERIA \nBold italicized terms are elaborated in the Range of Variables \n1. Identify Standard \nMeasuring Devices and  \nInstruments \n \n1.1 \nStandard measuring devices and \ninstruments are identified according to \nmanufacturer’s specifications \n1.2 \nDevices and instruments for measuring are \nproperly checked, sanitized and calibrated prior \nto use \n2. Review the Procedures in \nUsing Standard Measuring \nDevices and Instruments \n2.1 \nProcedures in using the standard measuring \ndevices and instruments are recalled according \nto manufacturer’s specifications \n2.2 \nPrinted procedures/brochures/catalogues are \nconsulted according to specified food \nprocessing methods \n3. Follow  Procedures of \nUsing  Measuring Devices \nand Instruments \n3.1 \nMethods/practices of using measuring devices \nand instruments are strictly observed according \nto manufacturer’s  specifications and workplace \nrequirements \n3.2 \nMeasuring devices and instruments are \ncleaned, wiped dry and stowed after use to \nensure conformity with workplace requirements\n\n--- PDF PAGE 24 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n22\nRANGE OF VARIABLES \nVARIABLES\nRANGE\n1. Standard Measuring   \nDevices \nStandard Measuring Devices may include but not \nlimited to the following: \n \n1.1 \nWeighing scales and balances of various \ncapacities and sensitivities \n1.2 \nMeasuring cups of varying capacities for dry \ningredients \n1.3 \nMeasuring cups of varying capacities for liquid \ningredients \n2. Standard Measuring \nInstruments \nStandard Measuring Instruments may include but \nnot limited to the following: \n \n2.1 Salinometer \n2.2 Thermometers of varying temperature ranges    \n(0-300 C ) \n2.3 Refractometer of varying range (  0 – 90 B) \n2.4 Glasswares like cylinders, beakers, flasks of \nvarying graduations \n3. Food Processing Methods \nFood Processing Methods may include but not \nlimited to the following: \n \n3.1. Process foods by Salting, Curing and \nSmoking \n3.2. Process foods by Fermentation and Pickling \n3.3. Process foods by  Canning and Bottling \n3.4. Process foods by Sugar Concentration \n3.5. Process foods by Drying and Dehydration\n\n--- PDF PAGE 25 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n23\n \n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n \n1.1 \nIdentified, prepared and calibrated  standard \nmeasuring devices and instruments \n1.2 \nFollowed correctly the procedures in using \nstandard measuring devices and instruments \n1.3 \nFollowed proper cleaning and sanitizing and \nstowing procedures of measuring devices and \nequipment before and after use \n2. Underpinning Knowledge \n2.1 \nSafe handling of measuring devices and \ninstruments \n2.2 \nSpecifications and functions of measuring \ndevices and instruments \n2.3 \nDefects and breakages of measuring devices \nand instruments \n2.4 \nProcedures in cleaning, sanitizing and \ncalibrating and stowing equipment and \ninstruments \n3. Underpinning Skills  \n3.1 \nCommunication skills \n3.2 \nCalibrating skills \n3.3 \nSanitary handling of devices and instruments \n3.4 \nMeasuring devices and instruments \n3.5 \nStowing measuring devices and instruments \n4. Methods of Assessment \nCompetency in this unit must be assessed through: \n4.1   Direct observation and questioning of a \ncandidate using measuring devices and \ninstruments \n5. Resource Implications \nThe following resources must be provided: \n5.1    Work area/station \n5.2    Materials, tools and equipment relevant to the \nUnit of Competency \n6. Context of Assessment \n6.1   Assessment should occur on the job or in a \nsimulated workplace\n",
        "required_knowledge": null,
        "required_skills": null
      },
