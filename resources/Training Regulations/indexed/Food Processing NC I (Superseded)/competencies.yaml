nt \nCompetency must be  assessed through: \n4.1. Direct observation with oral questioning \n4.2. Demonstration with oral questioning \n4.3.\nPortfolio\n5. Resource \nImplications \nThe following resources must be provided: \n5.1 \nWork area/ station \n5.2 \nEquipment and tools to prepare raw/packaging \nmaterials for processing \n5.3 \nMaterials relevant to the proposed activity \n5.4 \nRelevant workplace procedures, schedules and \nrecords \n6. Context of \nAssessment \n6.1 \nAssessment should occur on the job or in a simulated \nworkplace. \n6.2 \nAbility to apply competency over time and on a \nnumber of occasions.\n",
