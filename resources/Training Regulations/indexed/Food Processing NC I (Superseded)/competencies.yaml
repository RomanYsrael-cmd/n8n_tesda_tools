          "source_text": "1.  Select and prepare \nequipment for use \n1.1. Basic machine/equipment required to complete \ntasks is identified and accessed in accordance with \nassignment instructions and workplace \nrequirements  \n1.2. Routine pre-operational checks are carried out \naccording to manufacturers’ specifications and \nworkplace procedures  \n1.3. Faulty and damaged machine/equipment is identified \nand reported according to workplace procedures  \n1.4. Any training required to operate machine/equipment \nis identified and notified to appropriate person(s) \naccording to supplier and workplace requirements\n2.  Operate equipment  \n \n2.1. Suitable personal protective equipment is \nselected, used and maintained in accordance with \noccupational health and safety (OHS) \nrequirements,  and manufacturers’ specifications \n2.2. Machine/Equipment is operated in a safe and \ncontrolled manner in accordance with OHS \nrequirements and manufacturers’ specifications \n2.3. Out-of-specification product, process and equipment \nperformance is identified and reported according to \nworkplace procedures\n\n--- PDF PAGE 59 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n57\n \n3.  Maintain equipment \nand resources \n3.1. Machine/Equipment is shut down according to \nworkplace procedures and manufacturers’ \nspecifications \n3.2. Work area, tools and machine/equipment are \ncleaned, maintained and stored in accordance with \nworkplace requirements and manufacturers’ \nspecifications \n3.3. Faulty or damaged machine/equipment is reported \nfor repair or replacement in accordance with \nworkplace procedures \n3.4. Waste generated by both the process and cleaning \nprocedures is collected, treated, disposed of, or \nrecycled, according to workplace procedures \n3.5. Records and reports are completed and maintained \nin accordance with industry, legislative and \nworkplace requirements\n\n--- PDF PAGE 60 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n58\n \n \nRANGE OF VARIABLES \nVARIABLE\nRANGE\n1. \nBasic machine/  \nequipment  \nMay include any one of the following: \n \n1.1. \nMixer \n1.2. \nBlender \n1.3. \nRoaster \n1.4. \nGrinder \n1.5. \nChopper \n1.6. \nFood processor \n1.7. \nScales \n1.8. \nWashing equipment \n \n1.9. \nFrying equipment \n1.10. Oven \n1.11. Conveyor \n1.12. Freezer \n1.13. Cutter  \n1.14. Molder \n \n1.15. Filling machine (bottle, can, pouch, fill and seal) \n1.16. Plastic sealer \n1.17. Vacuum sealer \n1.18. Packing equipment \n1.19. Labeling equipment \n2. \nWorkplace \nrequirements \nMay include but not limited to: \n2.1. Company policies and procedures \n2.2. Standard Operating Procedures  \n2.3. Production schedules \n2.4. Operator’s manuals \n2.5. OHS procedures \n2.6. Supervisor’s oral or written instructions \n2.7.\nStandard forms and reports\n3. \nManufacturer’s \nspecifications \nMay include but not limited to: \n3.1. Handling requirements \n3.2. Operating requirements \n3.3. Discharge label \n3.4. Reporting \n3.5. Testing \n3.6. Positioning \n3.7.\nRefilling\n\n--- PDF PAGE 61 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n59\n4. \nPre-operational \nchecks  \nMay include but not limited to: \n4.1. Checking log books \n4.2. Reading manufacturer's instructions \n4.3. Observing and monitoring noise levels for correct \noperation \n4.4. Cleaning \n4.5. Priming \n4.6. Tightening \n4.7. Basic repairs and adjustments \n4.8. Routine maintenance  \n4.9. Identification and segregation of unsafe or faulty \nequipment for repair or replacement \n5. \nPersonal \nprotective \nequipment (PPE) \nMay include but not limited to: \n5.1. Masks \n5.2. Safety boots \n5.3. Head protection \n5.4. Safety glasses \n5.5. Gloves \n5.6.\nApron\n6. \nOHS requirements \nOccupational Health and Safety requirements may include \nbut not limited to: \n6.1 Health/medical certificate \n6.2 DOLE requirements \n6.3 Personal hygiene and good grooming \n6.4 Plant sanitation and waste management \n6.5 Relevant permits   \n6.6 BFAD requirements \n6.7 PPE requirements  \n7. \nRecords and \nreports  \nMay include but not limited to: \n7.1. Operational details \n7.2. Equipment faults  \n7.3. Recommended repairs or disposal of equipment \n7.4. Materials used\n\n--- PDF PAGE 62 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n60"
