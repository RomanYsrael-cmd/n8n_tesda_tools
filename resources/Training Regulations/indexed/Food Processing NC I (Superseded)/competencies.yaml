  "source_section_text": "SECTION 2\n\nCOMPETENCY STANDARDS\n\nThese guidelines are set to provide the Technical Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for FOOD PROCESSING NC I. These units\nof competency are categorized into basic, common and core competencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY: RECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION\n\nUNIT CODE\n : 500311101\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to receive, respond and act on verbal and written\ncommunication.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the Range of Variables\n1. Follow routine\nspoken messages\n1.1\nRequired information is gathered by listening\nattentively and correctly interpreting or understanding\ninformation/instructions.\n1.2\nInstructions/information are properly recorded.\n1.3\nInstructions are acted upon immediately in\naccordance with information received.\n1.4\nClarification is sought from workplace supervisor on\nall occasions when any instruction/information is not\nclear.\n2. Perform workplace\nduties following\nwritten notices\n2.1\nWritten notices and instructions are read and\ninterpreted correctly in accordance with\norganizational guidelines\n2.2\nRoutine written instruction are followed in sequence\n2.3\nFeedback is given to workplace supervisor based on\nthe instructions/information received\n\n--- PDF PAGE 6 ---\n_________________________________________\n\nTR - Food Processing NC I\n4\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nIt refers to:\n1.1.\nHandwritten and printed material\n1.2.\nInternal memos\n1.3.\nExternal communications\n1.4.\nElectronic mail\n1.5.\nBriefing notes\n1.6.\nGeneral correspondence\n1.7.\nMarketing materials\n1.8.\nJournal articles\n2. Organizational\nGuidelines\nIt may include:\n2.1.\nInformation documentation procedures\n2.2.\nCompany policies and procedures\n2.3.\nOrganization manuals\n2.4.\nService manual\n\n--- PDF PAGE 7 ---\n_________________________________________\n\nTR - Food Processing NC I\n5\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of organizational\nprocedures for handling verbal and written\ncommunications\n1.2\nReceived and acted on verbal messages and\ninstructions\n1.3\nDemonstrated competency in recording\ninstructions/information\n2. Underpinning\nKnowledge and\nAttitudes\n2.1\nKnowledge of organizational policies/guidelines in\nregard to processing internal/external information\n2.2\nEthical work practices in handling communications\n2.3\nCommunication process\n3. Underpinning Skills\n3.1\nConciseness in receiving and clarifying\nmessages/information/communication\n3.2\nAccuracy in recording messages/information\n4. Resource\nImplications\nThe following resources must be provided:\n4.1.\nPens\n4.2.\nNote pads\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1.\nDirect Observation\n5.2.\nOral interview\n5.3.\nWritten Evaluation\n5.4.\nThird Party Report\n6. Context of\nAssessment\n6.1.\nCompetency may be assessed individually in the\nactual workplace or simulation environment in\nTESDA accredited institutions\n\n--- PDF PAGE 8 ---\n_________________________________________\n\nTR - Food Processing NC I\n6\n\nUNIT OF COMPETENCY :\nWORK WITH OTHERS\n\nUNIT CODE\n:\n500311102\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes\nrequired to develop workplace relationship and contribute\nin workplace activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the Range of Variables\n1. Develop effective\nworkplace relationship\n1.1 Duties and responsibilities are done in a positive\nmanner to promote cooperation and good\nrelationship\n1.2 Assistance is sought from workgroup when\ndifficulties arise and addressed through discussions\n1.3 Feedback provided by others in the team is\nencouraged, acknowledged and acted upon\n1.4 Differences in personal values and beliefs are\nrespected and acknowledged in the development\n2. Contribute to work\ngroup activities\n2.1 Support is provided to team members to ensure\nworkgroup goals are met\n2.2 Constructive contributions to workgroup goals and\ntasks are made according to organizational\nrequirements\n2.3 Information relevant to work is shared with team\nmembers to ensure designated goals are met\n\n--- PDF PAGE 9 ---\n_________________________________________\n\nTR - Food Processing NC I\n7\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements\nincluding OHS\n1.5 Code of conduct\n2. Work group\n2.1 Supervisor or manager\n2.2 Peers/work colleagues\n2.3 Other members of the organization\n3. Feedback on\nperformance\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues\nand clients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring\nservice delivery\n4. Providing support to\nteam members\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n5. Organizational\nrequirements\n\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes and\nstandards\n\n--- PDF PAGE 10 ---\n_________________________________________\n\nTR - Food Processing NC I\n8\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1.\nProvided support to team members to ensure\ngoals are met\n1.2.\nActed on feedback from clients and colleagues\n1.3.\nAccessed learning opportunities to extend own\npersonal work competencies to enhance team\ngoals and outcomes\n2. Underpinning\nKnowledge and\nAttitudes\n2.1.\nThe relevant legislation that affects operations,\nespecially with regards to safety\n2.2.\nReasons why cooperation and good relationships\nare important\n2.3.\nKnowledge of the organization’s policies, plans and\nprocedures\n2.4.\nUnderstanding how to elicit and interpret feedback\n2.5.\nKnowledge of workgroup member’s responsibilities\nand duties\n2.6.\nImportance of demonstrating respect and empathy\nin dealings with colleagues\n2.7.\nUnderstanding of how to identify and prioritize\npersonal development opportunities and options\n3. Underpinning skills\n3.1.\nAbility to read and understand the organization’s\npolicies and work procedures\n3.2.\nWrite simple instructions for particular routine tasks\n3.3.\nInterpret information gained from correspondence\n3.4.\nCommunication skills to request advice, receive\nfeedback and work with a team\n3.5.\nPlanning skills to organized work priorities and\narrangement\n3.6.\nTechnology skills including the ability to select and\nuse technology appropriate to a task\n\n--- PDF PAGE 11 ---\n_________________________________________\n\nTR - Food Processing NC I\n9\n3.7.\nAbility to relate to people from a range of social,\ncultural and ethnic backgrounds.\n4. Resource implications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place\n4.2.\nMaterials relevant to the proposed activity or task\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1.\nDirect observations of work activities of the\nindividual member in relation to the work activities\nof the group\n5.2.\nObservation of simulation and/or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3.\nCase studies and scenarios as a basis for\ndiscussion of issues and strategies\n6. Context for\nassessment\n6.1.\nCompetency assessment may occur in workplace\nor any appropriately simulated environment\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\n_________________________________________\n\nTR - Food Processing NC I\n10\n\nUNIT OF COMPETENCY :\nDEMONSTRATE WORK VALUES\n\nUNIT CODE\n\n:\n500311103\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, and attitudes in\ndemonstrating proper work values.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold italicized terms are elaborated in the Range of Variables\n1. Define the\npurpose of work\n\n1.1 One’s unique sense of purpose for working and the why’s\nof work are identified, reflected on and clearly defined for\none’s development as a person and as a member of\nsociety.\n1.2 Personal mission is in harmony with company’s values\n2. Apply work\nvalues/ethics\n2.1 Work values/ethics/concepts are classified and\nreaffirmed in accordance with the transparent company\nethical standards, policies and guidelines.\n2.2 Work practices are undertaken in compliance with\nindustry work ethical standards, organizational policy and\nguidelines\n2.3 Personal behavior and relationships with co-workers\nand/or clients are conducted in accordance with ethical\nstandards, policy and guidelines.\n2.4 Company resources are used in accordance with\ntransparent company ethical standard, policies and\nguidelines.\n3. Deal with ethical\nproblems\n3.1 Company ethical standards, organizational policy and\nguidelines on the prevention and reporting of unethical\nconduct are accessed and applied in accordance with\ntransparent company ethical standard, policies and\nguidelines.\n3.2 Work incidents/situations are reported and/or resolved\nin accordance with company protocol/guidelines.\n3.3 Resolution and/or referral of ethical problems identified\nare used as learning opportunities.\n4. Maintain integrity\nof conduct in the\nworkplace\n4.1 Personal work practices and values are demonstrated\nconsistently with acceptable ethical conduct and\ncompany’s core values.\n4.2 Instructions to co-workers are provided based on ethical,\nlawful and reasonable directives.\n4.3 Company values/practices are shared with co-workers\nusing appropriate behavior and language.\n\n--- PDF PAGE 13 ---\n_________________________________________\n\nTR - Food Processing NC I\n11\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work values/ethics/\nconcepts\nMay include but are not limited to:\n1.1\nCommitment/ Dedication\n1.2\nSense of urgency\n1.3\nSense of purpose\n1.4\nLove for work\n1.5\nHigh motivation\n1.6\nOrderliness\n1.7\nReliability\n1.8\nCompetence\n1.9\nDependability\n1.10 Goal-oriented\n1.11 Sense of responsibility\n1.12 Being knowledgeable\n1.13 Loyalty to work/company\n1.14 Sensitivity to others\n1.15 Compassion/Caring attitude\n1.16 Balancing between family and work\n1.17 Pakikisama\n1.18 Bayanihan spirit/teamwork\n1.19\nSense of nationalism\n2. Work practices\n2.1\nQuality of work\n2.2\nPunctuality\n2.3\nEfficiency\n2.4\nEffectiveness\n2.5\nProductivity\n2.6\nResourcefulness\n2.7\nInnovativeness/Creativity\n2.8\nCost conciousness\n2.9\n5S\n2.10\nAttention to details\n3. Incidents/situations\n3.1\nViolent/intensed dispute or argument\n3.2\nGambling\n3.3\nUse of prohibited substances\n3.4\nPilferages\n3.5\nDamage to person or property\n3.6\nVandalism\n3.7\nFalsification\n3.8\nBribery\n3.9\nSexual Harassment\n3.10\nBlackmail\n\n--- PDF PAGE 14 ---\n_________________________________________\n\nTR - Food Processing NC I\n12\n\nVARIABLE\nRANGE\n\n4. Company resources\n\n4.1 Consumable materials\n4.2 Equipment/Machineries\n4.3 Human\n4.4 Time\n4.5 Financial resources\n\n5. Instructions\n\n5.1 Verbal\n5.2 Written\n\n--- PDF PAGE 15 ---\n_________________________________________\n\