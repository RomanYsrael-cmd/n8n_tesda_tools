        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency  \n \nAssessment requires evidence that the candidate: \n1.1. \nProvided support to team members to ensure \ngoals are met \n1.2. \nActed on feedback from clients and colleagues \n1.3. \nAccessed learning opportunities to extend own \npersonal work competencies to enhance team \ngoals and outcomes \n2. Underpinning \nKnowledge and \nAttitudes \n2.1. \nThe relevant legislation that affects operations, \nespecially with regards to safety  \n2.2. \nReasons why cooperation and good relationships \nare important \n2.3. \nKnowledge of the organization’s policies, plans and \nprocedures \n2.4. \nUnderstanding how to elicit and interpret feedback \n2.5. \nKnowledge of workgroup member’s responsibilities \nand duties \n2.6. \nImportance of demonstrating respect and empathy \nin dealings with colleagues \n2.7. \nUnderstanding of how to identify and prioritize \npersonal development opportunities and options \n3. Underpinning skills \n3.1. \nAbility to read and understand the organization’s \npolicies and work procedures \n3.2. \nWrite simple instructions for particular routine tasks\n3.3. \nInterpret information gained from correspondence \n3.4. \nCommunication skills to request advice, receive \nfeedback and work with a team \n3.5. \nPlanning skills to organized work priorities and \narrangement \n3.6. \nTechnology skills including the ability to select and \nuse technology appropriate to a task\n\n--- PDF PAGE 11 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n9\n3.7. \nAbility to relate to people from a range of social, \ncultural and ethnic backgrounds. \n4. Resource implications \nThe following resources MUST be provided: \n4.1. \nAccess to relevant workplace or appropriately \nsimulated environment where assessment can \ntake place \n4.2. \nMaterials relevant to the proposed activity or task \n5. Methods of \nassessment \nCompetency may be assessed through: \n5.1. \nDirect observations of work activities of the \nindividual member in relation to the work activities \nof the group \n5.2. \nObservation of simulation and/or role play involving \nthe participation of individual member to the \nattainment of organizational goal \n5.3. \nCase studies and scenarios as a basis for \ndiscussion of issues and strategies \n6. Context for \nassessment \n6.1. \nCompetency assessment may occur in workplace \nor any appropriately simulated environment \n6.2. \nAssessment shall be observed while task are being \nundertaken whether individually or in group",
