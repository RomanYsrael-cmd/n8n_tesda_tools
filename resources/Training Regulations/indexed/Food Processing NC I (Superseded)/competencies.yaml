        "source_text": "--- PDF PAGE 26 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n24\n \n \nUNIT OF COMPETENCY  :  \nUSE FOOD PROCESSING TOOLS, EQUIPMENT \nAND UTENSILS \n \nUNIT CODE  \n         :  \nAGR741203 \n \nUNIT DESCRIPTOR          :  \nThis unit deals with the skills, knowledge and attitudes \nrequired to operate food processing tools, equipment \nand instruments in the workplace. \n \n \nELEMENT\nPERFORMANCE CRITERIA \nBold italicized terms are elaborated in the Range of Variables \n1. Perform Pre-\nOperation Activities  \n1.1. Appropriate tools and equipment/utensils are \nassembled according to food processing methods \n1.2. Food processing tools and equipment/utensils \nare inspected and checked according to \nmanufacturer’s specifications \n1.3. Food processing equipment is set up, adjusted  and \nreadied according to job requirements\n2. Operate Food \nprocessing \nEquipment \n \n \n \n \n \n \n2.1. Food processing equipment is switched on \naccording to manufacturer’s specifications \n2.2. Performance of food processing equipment is \nchecked to ensure conformity with specified output \n2.3. Operation of food processing equipment is managed \nto achieve planned outcomes \n2.4. Minor trouble shooting on food processing tools, \nequipment and utensils is performed when \nnecessary\n3. Perform Post-\nOperation Activities \n3.2 \nFood processing equipment is switched off and \nunplugged after  operation in accordance with \nmanufacturer’s specifications \n3.3 \nFood processing tools, equipment and instruments \nare cleaned, sanitized and stowed as required \naccording to manufacturer’s specifications and \nworkplace policies and regulations \n3.4 \nMinor preventive maintenance on equipment is \nperformed in line with organization’s maintenance \nsystem \n3.5 \nMain machine parts are inspected and checked in \nline with organization’s policy \n3.6 \nCondition of machine is monitored to ensure \nserviceability  in accordance with workplace rules \nand regulations\n\n--- PDF PAGE 27 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n25\n \n \nRANGE OF VARIABLES \n \n VARIABLE\nRANGE\n1.  Food Processing Methods\nFood Processing Methods include but not limited to: \n \n1.1 \nSalting \n1.2 \nCuring \n1.3 \nSmoking \n1.4 \nFermentation \n1.5 \nPickling \n1.6 \nCanning  \n1.7 \nBottling \n1.8 \nSugar concentration \n1.9 \nDrying  \n1.10  Dehydration \n2.   Food Processing Tools, \nEquipment and  Utensils \nTools, Equipment and Utensils used for but not limited \nto the following food processing methods: \n \n2.1. Salting \n2.2. Curing  \n2.3. Smoking  \n2.4. Fermentation  \n2.5. Pickling  \n2.6. Canning  \n2.7. Bottling  \n2.8. Sugar concentration \n2.9. Drying \n2.10. Dehydration \n3. Manufacturer’s \nSpecifications \nManufacturer’s specifications may include but not \nlimited to: \n \n3.1. Handling requirements \n3.2. Operating requirements \n3.3. Discharge Label \n3.4. Reporting \n3.5. Testing \n3.6. Positioning \n3.7. Refilling\n\n--- PDF PAGE 28 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n26\n \n4.  Minor Preventive Machine \nMaintenance \nMinor Preventive Machine Maintenance may include  \nbut not limited to checking of the following: \n \n4.1. Machine temperature \n4.2. Hydraulic fluid \n4.3. Wear and surface condition \n4.4. Crack \n4.5. Leak detection \n4.6. Vibration \n4.7. Corrosion/erosion \n4.8. Electric insulation \n5. Condition of Machine \n5.1 \nServiceable \n5.2 \nRepairable \n5.3 \nDefective\n\n--- PDF PAGE 29 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n27\n \n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n \n1.1 \nAssembled, inspected, checked and sanitized appropriate \ntools and equipment/instruments  \n1.2 \nSet-up, adjusted and readied tools and equipment and \ninstruments according to requirements \n1.3 \nOperated and monitored performance of equipment to \nensure specified output \n1.4 \nPerformed post operation activities \n1.5 \nPerformed minor trouble shooting on food processing \ntools, equipment and utensils\n2. Underpinning \nKnowledge \n2.1. Equipment, tools and  instruments: Uses and \nSpecifications \n2.2. Equipment, tools and instruments: Parts and Functions \n2.3. Sanitizing agents: Uses and Specification \n2.4. Minor preventive maintenance \n2.5. Proper stowing of tools and equipment/instruments \n2.6. Minor trouble shooting \n2.7. Interpreting manufacturer’s specifications \n2.8. Equipment/machine wear and tear process\n3. Underpinning \nSkills \n3.1 \nEquipment/machine parts tear down and assembly \n3.2 \nInspecting and checking condition of equipment/machines \nbefore, during and after operation \n3.3 \nPerforming minor trouble shooting \n3.4 \nPerforming minor preventive maintenance \n3.5 \nReporting equipment/machine, tools, instruments \nbreakdown and recording same in standard forms\n4. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n4.1. Direct observation and questioning of a candidate \noperating food processing tools and \nequipment/instruments \n4.2. Submission of written report on the performance and \ncondition of equipment/machine, tools, instruments used. \n5. Resource \nImplications \nThe following resources must be provided: \n5.1. Work area/station \n5.2. Materials, tools and equipment relevant to the Unit of \nCompetency \n6. Context of \nAssessment \n6.1    Assessment should occur on the job or in a simulated \nworkplace\n",
