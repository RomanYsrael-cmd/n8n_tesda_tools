        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n \n1.1. prepared for cleaning equipment and \nprocessing/packaging area \n1.2. prepared supplies, materials and utilities for \ncleaning and sanitation \n1.3. cleaned and sanitized equipment and \nprocessing/packaging area to meet workplace \nrequirements \n1.4. restored equipment and processing/packaging area \nto operating order \n1.5. followed work procedures \n1.6. completed records and reports \n \nThe skills and knowledge required to clean and sanitize \nequipment and processing/packaging area must be \ntransferable to a different work environment.  \n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this \nstandard in the workplace, to transfer the skills to other \ncontexts, and to deal with unplanned events.  The \nknowledge requirements for this competency standard are \nlisted below: \n \n2.1. \nPurpose and basic principles of cleaning and \nsanitation  \n2.2. \nCleaning and sanitation requirements for \nequipment and processing/packaging area \n2.3. \nMethods used to render equipment and \nprocessing/packaging area safe to clean and \nsanitize \n2.4. \nCharacteristics and functions of cleaning and \nsanitizing chemicals, including proper handling, use \nand storage \n2.5. \nSafe work procedures including appropriate \nsignage of cleaning activities and safe handling \nand storage of cleaners and sanitizers used \n2.6. \nPurpose and limitations of protective clothing and \nequipment\n\n--- PDF PAGE 68 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n66\n2.7. \nEquipment settings required for cleaning and for \noperating, respectively \n2.8. \nInspection points for cleaning and sanitation \n2.9. \nConduct swab tests \n2.10. Possible corrective actions for out-of-specification \nresults \n2.11. Consequences of contamination of process flows \nby cleaning solutions and related safeguards \n2.12. Environmental consequences of incorrect cleaning \nwaste disposal procedures  \n2.13. Reporting and recording systems \n2.14. Types of waste generated by both the production \nand the cleaning process and related collection, \ntreatment and disposal requirements \n2.15. Requirements to liase/advise related work areas \n2.16. Conduct routine maintenance \n2.17. OHS hazards and risks \n2.18. Regulatory and legislative requirements \n2.19. Awareness of Codes or Regulations such as \nHACCP and GMP \n \nAttitudes: \n2.20. Accurate \n2.21. Systematic and organized \n2.22. Environment-conscious \n2.23. Positive work values \n2.24. Cost conscious \n2.25. Safety conscious \n2.26. Personal hygiene \n3. Underpinning Skills \n3.1. Ability to access workplace information relevant to \ncleaning and sanitizing equipment and \nprocessing/packaging area \n3.2. Prepare equipment and processing/packaging area \nfor cleaning and sanitizing \n3.3. Clean and sanitize equipment and \nprocessing/packaging area according to cleaning \nand sanitation process cycle and procedures \n3.4. Conduct relevant checks and inspections to confirm \neffectiveness of cleaning and sanitation  \n3.5. Take corrective action for out-of-specification results \n3.6. Return equipment and processing/packaging area to \noperating order\n\n--- PDF PAGE 69 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n67\n3.7. Follow work procedures \n3.8. Oral and written communication skills \n3.9. Recording and reporting skills \n4. Methods of \nAssessment \nCompetency must be  assessed through: \n4.1. Direct observation with oral questioning \n4.2. Demonstration with oral questioning \n4.3. Portfolio\n5. Resource \nImplications \nThe following resources must be provided: \n5.1. Specific work area/station \n5.2. Equipment and tools relevant to cleaning and \nsanitizing equipment and processing/packaging area \nMaterials relevant to the proposed activity   \n5.3. Relevant workplace procedures, schedules and \nrecords\n6. Context of \nAssessment \n6.1. Assessment should occur on the job or in a \nsimulated workplace \n6.2. Ability to apply competency over time and on a \nnumber of occasions.",
