        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n \n1.1. identified sampling requirements \n1.2. collected, handled and prepared samples \n1.3. followed work procedures \n1.4. recorded sample information \n \nThe skills and knowledge required to implement sampling \nprocedures must be transferable to a different work \nenvironment. \n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this \nstandard in the workplace, to transfer the skills to other \ncontexts, and to deal with unplanned events.  The \nknowledge requirements for this competency standard are \nlisted below: \n \n2.1. Sampling plan \n2.2. Basic sampling principles, with emphasis on \nsampling which is random and representative of the \nlot \n2.3. Sampling techniques \n2.4. Basic characteristics of samples to be handled  \n2.5. Preparation, handling, preservation and storage \nrequirements for samples \n2.6. Awareness of Codes or Regulations such as HACCP \nand GMP \n \nAttitudes: \n2.7. Accurate \n2.8. Environment-conscious \n2.9. Positive work values \n2.10. Cost conscious \n2.11. Safety conscious \n2.12. Honest \n2.13. Cooperative\n3. Underpinning Skills \n3.1 \nSelect and use appropriate personal protective \nequipment \n3.2 \nFollow work procedures \n3.3 \nOral and written communication skills \n3.4 \nWorking with others and in teams \n3.5\nBasic mathematical skills (percentage)\n\n--- PDF PAGE 39 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n37\n3.6 \nRecording and reporting skills \n3.7\nTime management\n4. Methods of \nAssessment \nCompetency must be  assessed through: \n4.1. Direct observation with oral questioning \n4.2. Demonstration with oral questioning \n4.3.\nPortfolio\n5. Resource \nImplications \nThe following resources must be provided: \n5.1 Specific work area/station \n5.2 Equipment and tools for sampling \n5.3 Materials relevant to the proposed activity \n5.4 Relevant workplace procedures, schedules and \nrecords  \n6. Context of \nAssessment \n6.1 \nAssessment should occur on the job or in a \nsimulated workplace \n6.2 \nAbility to apply competency over time and on a \nnumber of occasions.",
