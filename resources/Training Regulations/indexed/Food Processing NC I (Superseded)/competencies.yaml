        "source_title": "CLEAN AND SANITIZE EQUIPMENT AND PROCESSING/PACKAGING AREA",
        "source_text": "--- PDF PAGE 64 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n62\n \n \nUNIT OF COMPETENCY:       CLEAN AND SANITIZE EQUIPMENT AND \nPROCESSING/PACKAGING AREA \n \nUNIT CODE                     :       AGR741310 \n \nUNIT DESCRIPTOR        :      This unit covers the skills, knowledge and attitudes \nrequired to clean and sanitize equipment and \nprocessing/packaging area.  This does not include \nautomated cleaning-in-place (CIP).  \n \n \nELEMENT\nPERFORMANCE CRITERIA \nBold italicized terms are elaborated in the Range of Variables \n1. Prepare for \ncleaning \n1.1. Cleaning/sanitizing supplies and materials, and \nutilities are identified and availability confirmed \naccording to cleaning and sanitizing requirements \n1.2. Prepare mixture of sanitizing solutions, as necessary, \naccording to workplace requirements and application   \n1.3. Equipment and processing/packaging area are cleared \nin preparation for cleaning according to workplace \nrequirements and manufacturer’s specifications \n1.4. Equipment and processing/packaging area are rendered \nsafe to clean according to workplace procedures and \nmanufacturer’s specifications\n2. Clean and sanitize \nequipment and \nprocessing/packaging \narea to meet \nworkplace \nrequirements \n2.1. Equipment and processing/packaging area are cleaned \nand sanitized according to workplace procedures, OHS \nrequirements, and manufacturer’s specifications \n2.2. Equipment and processing/packaging area are \ninspected according to required operating conditions \nand cleanliness \n2.3. Unacceptable equipment and processing/packaging \narea conditions are identified and reported according to \nworkplace procedures \n2.4. Cleaning equipment and chemicals are stored according \nto workplace procedure \n2.5. Waste from cleaning process is disposed of according to \nworkplace and OHS requirements, and \nregulatory/legislative requirements \n2.6. Equipment and processing/packaging area are restored \nto operating order according to workplace procedures \n2.7. Records are completed in line with workplace \nrequirements\n\n--- PDF PAGE 65 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n63\n \n \nRANGE OF VARIABLES \n \nVARIABLE\nRANGE\n1. Cleaning/Sanitation \nsupplies and \nmaterials \n \nMay include but not limited to: \n1.1. \nChemicals (cleaners, sanitizers, etc.) \n1.2. \nCleaning and scouring pads  \n1.3. \nWashcloth \n1.4. \nBrush \n1.5. \nPail \n1.6. \nBasin \n1.7. \nDipper \n1.8. \nHose \n1.9. \nMop \n1.10. Mop wringer \n1.11. Squeegee  \n1.12. pressure washer \n1.13. vacuum cleaner \n1.14. Garbage bin /  Trash bag \n1.15. Sink \n1.16. Towel dispenser  \n1.17. litmus paper (for testing effectiveness of cleaning) \n1.18. ATP (adenosine triphosphate) quick test\n2. Utilities \nMay include but not limited to:  \n2.1. Power \n2.2. Water \n2.3. Steam \n2.4. Compressed air \n2.5. Instrumentation air \n3. Workplace \nrequirements \nMay include but not limited to: \n3.1. Company policies and procedures \n3.2. Standard Operating Procedures  \n3.3. Production and cleaning schedules and instructions \n3.4. Materials Safety Data Sheets \n3.5. Supervisor’s oral and written instructions  \n3.6. Manufacturer’s advice \n3.7. Operator’s manuals \n3.8. Standard forms and reports\n\n--- PDF PAGE 66 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n64\n \n4. Manufacturer’s \nspecifications \nMay include but not limited to: \n4.1 Handling requirements \n4.2 Operating requirements \n4.3 Cleaning requirements \n4.4 Discharge label \n4.5 Calibration sticker \n4.6 Reporting \n4.7 Testing \n4.8 Positioning \n4.9\nRefilling\n5. Cleaning and \nsanitation \n5.1 Cleaning involves the removal of soil, a substance \nwhich is in the wrong place.  Soil may include but not \nlimited to the following: \n5.1.1.  Organic - produced by cooking equipment \nand deposited on ceilings, walls, exhaust \nhood, food production equipment, utensils and \ntableware \n5.1.2   Inorganic – airborne (free floating) or bonded \ndust which adheres to surfaces \n5.2  Sanitation involves the destruction of pathogens that \nsurvive the cleaning process \n6. Occupational Health \nand Safety  (OHS) \nrequirements \nMay include but not limited to: \n6.1 \nHealth/medical certificate \n6.2 \nDOLE requirements \n6.3 \nPersonal hygiene and good grooming \n6.4 \nPlant sanitation and waste management \n6.5 \nRelevant permits \n6.6 \nBFAD requirements \n6.7 \nPPE requirements  \n6.7.1 \nprotective clothing (coverall, apron) \n6.7.2 \nhead gears such as caps, hairnets, ear plugs \n6.7.3 \nsafety glasses \n6.7.4 \nmouth masks \n6.7.5 \ngloves  \n6.7.6 \nrubber boots / safety shoes \n7. Regulatory/ \nLegislative \nrequirements \nMay include but not limited to: \n7.1. Licensing requirements \n7.2. DOLE regulations \n7.3. Dangerous Drugs Act \n7.4. DENR/EMB regulations\n\n--- PDF PAGE 67 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n65\n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n \n1.1. prepared for cleaning equipment and \nprocessing/packaging area \n1.2. prepared supplies, materials and utilities for \ncleaning and sanitation \n1.3. cleaned and sanitized equipment and \nprocessing/packaging area to meet workplace \nrequirements \n1.4. restored equipment and processing/packaging area \nto operating order \n1.5. followed work procedures \n1.6. completed records and reports \n \nThe skills and knowledge required to clean and sanitize \nequipment and processing/packaging area must be \ntransferable to a different work environment.  \n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this \nstandard in the workplace, to transfer the skills to other \ncontexts, and to deal with unplanned events.  The \nknowledge requirements for this competency standard are \nlisted below: \n \n2.1. \nPurpose and basic principles of cleaning and \nsanitation  \n2.2. \nCleaning and sanitation requirements for \nequipment and processing/packaging area \n2.3. \nMethods used to render equipment and \nprocessing/packaging area safe to clean and \nsanitize \n2.4. \nCharacteristics and functions of cleaning and \nsanitizing chemicals, including proper handling, use \nand storage \n2.5. \nSafe work procedures including appropriate \nsignage of cleaning activities and safe handling \nand storage of cleaners and sanitizers used \n2.6. \nPurpose and limitations of protective clothing and \nequipment\n\n--- PDF PAGE 68 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n66\n2.7. \nEquipment settings required for cleaning and for \noperating, respectively \n2.8. \nInspection points for cleaning and sanitation \n2.9. \nConduct swab tests \n2.10. Possible corrective actions for out-of-specification \nresults \n2.11. Consequences of contamination of process flows \nby cleaning solutions and related safeguards \n2.12. Environmental consequences of incorrect cleaning \nwaste disposal procedures  \n2.13. Reporting and recording systems \n2.14. Types of waste generated by both the production \nand the cleaning process and related collection, \ntreatment and disposal requirements \n2.15. Requirements to liase/advise related work areas \n2.16. Conduct routine maintenance \n2.17. OHS hazards and risks \n2.18. Regulatory and legislative requirements \n2.19. Awareness of Codes or Regulations such as \nHACCP and GMP \n \nAttitudes: \n2.20. Accurate \n2.21. Systematic and organized \n2.22. Environment-conscious \n2.23. Positive work values \n2.24. Cost conscious \n2.25. Safety conscious \n2.26. Personal hygiene \n3. Underpinning Skills \n3.1. Ability to access workplace information relevant to \ncleaning and sanitizing equipment and \nprocessing/packaging area \n3.2. Prepare equipment and processing/packaging area \nfor cleaning and sanitizing \n3.3. Clean and sanitize equipment and \nprocessing/packaging area according to cleaning \nand sanitation process cycle and procedures \n3.4. Conduct relevant checks and inspections to confirm \neffectiveness of cleaning and sanitation  \n3.5. Take corrective action for out-of-specification results \n3.6. Return equipment and processing/packaging area to \noperating order\n\n--- PDF PAGE 69 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n67\n3.7. Follow work procedures \n3.8. Oral and written communication skills \n3.9. Recording and reporting skills \n4. Methods of \nAssessment \nCompetency must be  assessed through: \n4.1. Direct observation with oral questioning \n4.2. Demonstration with oral questioning \n4.3. Portfolio\n5. Resource \nImplications \nThe following resources must be provided: \n5.1. Specific work area/station \n5.2. Equipment and tools relevant to cleaning and \nsanitizing equipment and processing/packaging area \nMaterials relevant to the proposed activity   \n5.3. Relevant workplace procedures, schedules and \nrecords\n6. Context of \nAssessment \n6.1. Assessment should occur on the job or in a \nsimulated workplace \n6.2. Ability to apply competency over time and on a \nnumber of occasions.\n",
