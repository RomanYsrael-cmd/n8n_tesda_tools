          "source_text": "1. Prepare \nEquipment and \nTools \n1.1 Equipment and tools for inspection and sorting are \nprepared in accordance with manufacturer’s \nspecifications and workplace requirements \n1.2 Equipment and tools are checked, cleaned and sanitized \nin accordance with manufacturer’s specifications and \nworkplace requirements \n1.3 Office equipment and materials/supplies needed are \nprepared in accordance with approved specifications \n2. Inspect and \nSort  the \nMaterials and \nProduct \n2.1 Raw materials and product are received and handled \naccording to standard operating procedures.  \n2.2 Inspection and sorting is done according to required \nspecifications, OHS requirements and workplace \nprocedures \n2.3 Grading is undertaken, as necessary, according to raw \nmaterial or product requirements \n2.4 Raw materials and products are inspected for visible \nsigns of defects according to set processing and \npurchasing specifications.  \n2.5 Raw materials and products are sorted in accordance \nwith physical property specifications  \n2.6 Inspected and sorted raw materials and products are \nweighed and kept in accordance with standard operating \nprocedures \n2.7 Rejected/sub-standard raw materials and products are \nreported to appropriate person and/or disposed \naccording to organizational guidelines\n\n--- PDF PAGE 41 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n39\n \n3. Complete  \nInspection and \nSorting Activity \n3.1 Equipment and tools are cleaned and kept according to \nmanufacturers’ specifications and workplace procedures  \n3.2 Records are completed and reported according to \nworkplace procedures.\n\n--- PDF PAGE 42 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n40\n \n \nRANGE OF VARIABLES \nVARIABLE\nRANGE\n1. Equipment and  \nTools  \nMay include any one but not limited to: \n1.1 \nWeighing scales  \n1.2 \nJack lifts, trolleys and wheelers \n1.3 \nCarts \n1.4 \nStainless steel tables / Receiving tables \n1.5 \nBelt and roller sorter \n1.6 \nScreens \n1.7\nImage processing\n2. Inspection and \nsorting\n2.1   Manual \n2.2   Mechanical\n3. Manufacturer’s \nspecifications \nMay include but not limited to: \n3.1 \nHandling requirements \n3.2 \nOperating requirements \n3.3 \nWork-in-progress tags/labels \n3.4 \nTesting \n3.5 \nPositioning \n3.6\nRefilling\n4. Workplace \nrequirements \nMay include but not limited to: \n4.1 Company policies and procedures \n4.2 Standard operating procedures \n4.3 Work instructions \n4.4 Production schedules \n4.5\nForms and Reports\n5. Office equipment \nand \nmaterials/supplies \nMay include but not limited to: \n5.1 \nCalculator \n5.2 \nBond papers \n5.3 \nReporting and recording forms/logbooks \n5.4 \nPencils/ball pen \n5.5\nDesk\n6. Raw Materials and \nProduct \nMay include any one but not limited to: \n6.1. Fruits and vegetables \n6.2. Livestock meat and products \n6.3. Poultry and poultry products \n6.4. Fish and other marine products \n6.5. Cereals and starches \n6.6. Sugar and sweeteners \n6.7. Fats and oils \n6.8. Processing supplies \n6.8.1. Salt \n6.8.2.\nSugar\n\n--- PDF PAGE 43 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n41\n6.8.3. Condiments \n6.8.4. Spices \n6.8.5. Herbs \n6.8.6. Sauces \n7. OHS requirements \nOccupational Health and Safety requirements may include \nbut not limited to: \n7.1   Health/medical certificate \n7.2   DOLE requirements \n7.3   Personal hygiene and good grooming \n7.4   Plant sanitation and waste management \n7.5   BFAD requirements \n7.6 Relevant permits (e.g. City Hall) \n7.7   PPE requirements  \n7.7.1 apron/laboratory gown \n7.7.2 mouth masks \n7.7.3 gloves  \n7.7.4 rubber boots \n7.7.5 head gears such as caps, hairnets, ear plugs \n8. Defects \nDefects refer to deviations from the required specifications. \n \n8.1 For raw materials, defects may include but not limited \nto:  \n8.1.1. blemishes \n8.1.2. spoilage \n8.1.3. off color \n8.1.4. irregular size and shape \n8.1.5. off-odor \n8.1.6. stale  \n8.1.7. insect/disease damage \n8.1.8. presence of insects and other contaminants, \nmolds, etc. \n \n8.2 For semi-processed/finished products, defects may \ninclude but not limited to:  : \n8.2.1. damaged packaging \n8.2.2. contaminated contents \n8.2.3. packaging materials(off-color, deformed, \ncracked)  \n8.2.4. off-odor \n8.2.5. thawed (for frozen foods)\n\n--- PDF PAGE 44 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n42\n9. Physical Property \nThe main physical properties to sort and grade foods are: \n9.1. \nSize \n9.2. \nShape \n9.3. \nWeight \n9.4. \nColor \n9.5. \nVariety \n9.6. \nMaturity \n9.7. \nFreshness \n \nThe acceptable ranges of values for these physical \nproperties are defined in accordance with the required \nspecifications. \n10. Records \nMay include but not limited to: \n10.1. Items inspected / sorted \n10.2. Inspector’s name \n10.3. Date and place of inspection \n10.4. Spoilage and rejects \n10.5. Yields and recoveries \n10.6. Supplier details \n11. Reports \n11.1. Oral \n11.2.\nWritten\n\n--- PDF PAGE 45 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n43"
        },
        "evidence_guide": {
          "source_text": "1. Critical Aspects \nof Competency  \nAssessment requires evidence that the candidate: \n1.1 Prepared and checked equipment, tools and materials \nfor inspection and sorting \n1.2 Cleaned and sanitized equipment and tools  \n1.3 Followed the procedures and techniques in inspection \nand sorting  \n1.4 Operated equipment  \n1.5 Cleaned and stored equipment and tools after use \n1.6 Completed records in line with workplace requirements \n \nThe skills and knowledge required in inspecting and sorting \nraw materials and product must be transferable to a different \nwork environment. \n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this \nstandard in the workplace, to transfer the skills to other \ncontexts, and to deal with unplanned events.  The knowledge \nrequirements for this competency standard are listed below: \n2.1. \nPrinciples and procedures for inspection and sorting \n2.2. \nBasic characteristics of materials and products for \ninspection and sorting \n2.3. \nPreparation and handling of materials and products for \ninspection and sorting \n2.4. \nIdentification of out-of-specification materials and \nproducts, and required action \n2.5. \nRecording and reporting procedures relevant to \ninspection and sorting  \n2.6. \nTypes, \noperation, \nand \nroutine \nmaintenance \nof \nequipment, tools and instruments for inspection and \nsorting  \n2.7. \nCleaning and sanitation procedures \n2.8. \nFood safety principles and practices \n2.9. \nProper waste disposal  \n2.10. Recycling/by-product utilization \n2.11. Environmental protection and concerns \n2.12. Awareness of Codes or Regulations such as Hazard \nAnalysis Critical Control Point (HACCP) and Good \nManufacturing Practice (GMP) \n2.13. Weights, measures, conversions, percentages, ratios \nand proportions \n2.14. Basic \narithmetical \noperations \nlike \nmultiplication, \ndivision, addition and subtraction\n\n--- PDF PAGE 46 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n44\n \nAttitudes: \n2.15. Punctual/Time conscious \n2.16. Cost conscious \n2.17. Environmental and pollution conscious \n2.18. Flexible/adaptable \n2.19. Honest \n2.20. Socially responsible \n2.21. Dependable \n2.22. Innovative \n2.23. Alert \n2.24. Systematic and organized \n2.25. Good listener and fast learner \n2.26. Resourceful \n2.27. Morally responsible \n2.28. Personal hygiene \n3. Underpinning \nSkills \n3.1 Oral and written communication skills \n3.2 Ability to read and interpret instructions \n3.3 Basic mathematical skills (addition,  subtraction, division, \nmultiplication, percentage) \n3.4 Computation of spoilage, rejects, yields and recoveries \n3.5 Recording and reporting skills \n3.6 Sanitary food handling practices \n4. Methods of \nAssessment \nCompetency must be  assessed through: \n4.1. Direct observation with oral questioning \n4.2. Demonstration with oral questioning \n4.3. Portfolio \n5. Resource \nImplications \nThe following resources must be provided: \n5.1 Specific work area/station \n5.2 Raw materials and products for inspection and sorting \n5.3 Equipment and tools for inspection and sorting \n5.4 Other materials relevant to the proposed activity \n5.5 Relevant workplace procedures, schedules and records \n \n6. Context of \nAssessment \n6.1 Assessment should occur on the job or in a simulated \nworkplace. \n6.2 Ability to apply competency over time and on a number \nof occasions.",
