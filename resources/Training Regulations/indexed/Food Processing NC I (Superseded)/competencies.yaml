        "source_title": "RECEIVE AND RESPOND TO WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 5 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n3\n \nSECTION 2  \n \nCOMPETENCY STANDARDS \n \nThese guidelines are set to provide the Technical Vocational Education and \nTraining (TVET) providers with information and other important requirements to \nconsider when designing training programs for FOOD PROCESSING NC I. These units \nof competency are categorized into basic, common and core competencies. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY:  RECEIVE AND RESPOND TO WORKPLACE   \nCOMMUNICATION \n \nUNIT CODE \n     :    500311101 \n \nUNIT DESCRIPTOR      : This unit covers the knowledge, skills and attitudes   \nrequired to receive, respond and act on verbal and written \ncommunication.  \n \nELEMENT \nPERFORMANCE CRITERIA \nBold italicized terms are elaborated in the Range of Variables\n1. Follow routine \nspoken messages \n1.1 \nRequired information is gathered by listening \nattentively and correctly interpreting or understanding \ninformation/instructions.   \n1.2 \nInstructions/information are properly recorded. \n1.3 \nInstructions are acted upon immediately in \naccordance with information received.  \n1.4 \nClarification is sought from workplace supervisor on \nall occasions when any instruction/information is not \nclear. \n2. Perform workplace \nduties following \nwritten notices \n2.1 \nWritten notices and  instructions are read and \ninterpreted correctly in accordance with \norganizational guidelines  \n2.2 \nRoutine written instruction are followed in sequence   \n2.3 \nFeedback is given to workplace supervisor based on \nthe instructions/information received\n\n--- PDF PAGE 6 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n4\n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Written notices and \ninstructions  \nIt refers to: \n1.1. \nHandwritten and printed material \n1.2. \nInternal memos \n1.3. \nExternal communications \n1.4. \nElectronic mail \n1.5. \nBriefing notes \n1.6. \nGeneral correspondence \n1.7. \nMarketing materials \n1.8. \nJournal articles \n2. Organizational \nGuidelines \nIt may include: \n2.1. \nInformation documentation procedures \n2.2. \nCompany policies and procedures \n2.3. \nOrganization manuals  \n2.4. \nService manual\n\n--- PDF PAGE 7 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n5\n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nDemonstrated knowledge of organizational \nprocedures for handling verbal  and written \ncommunications \n1.2 \nReceived and acted on verbal messages and \ninstructions \n1.3 \nDemonstrated competency in recording \ninstructions/information \n2. Underpinning \nKnowledge and \nAttitudes \n2.1 \nKnowledge of organizational policies/guidelines in \nregard to processing internal/external information \n2.2 \nEthical work practices in handling communications \n2.3 \nCommunication process \n3. Underpinning Skills \n3.1 \nConciseness in receiving and clarifying \nmessages/information/communication \n3.2 \nAccuracy in recording messages/information \n4. Resource \nImplications \nThe following resources must be provided: \n4.1. \nPens \n4.2. \nNote pads \n5. Methods of \nAssessment \nCompetency must be assessed through: \n5.1. \nDirect Observation \n5.2. \nOral interview \n5.3. \nWritten Evaluation \n5.4. \nThird Party Report \n6. Context of \nAssessment \n6.1. \nCompetency may be assessed individually in the \nactual workplace or simulation environment in \nTESDA accredited institutions\n",
