          "source_text": "1. Load and unload raw \nmaterials, products and \nsupplies. \n \n1.1 \nLoading and unloading procedures are selected \naccording to workplace and OHS requirements  \n1.2 \nDangerous or hazardous raw materials, products \nand/or supplies are identified and handled in \naccordance with OHS, regulatory and legislative \nrequirements \n1.3 \nRaw materials, products and/or supplies requiring \nspecial handling and/or documentation are identified \nand appropriate procedures followed according to \nworkplace requirements \n1.4 \nRaw materials, products and/or supplies are \npacked/unpacked according to workplace \nrequirements \n1.5 \nRaw materials, products and/or supplies are loaded \nin accordance with relevant material loading \nregulations and workplace procedures  \n1.6 \nLifting aids and appliances are selected and used \naccording to loading procedures in compliance with \nworkplace requirements and legislation \n1.7 \nUnloading activities are conducted safely and \nefficiently according to workplace requirements \n1.8 \nHazards and risks are identified and controls \nimplemented according to OHS and workplace \nrequirements\n\n--- PDF PAGE 71 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n69\n \n2 . Secure and protect \nload \n2.1. Load distribution is checked to ensure that it is even, \nlegal and within the working capacity according to \nworkplace procedures \n2.2. Load is checked to ensure that dangerous goods \nand hazardous substances are appropriately \nsegregated in accordance with regulatory and \nworkplace requirements \n2.3. Load is secured using the correct load restraint and \nprotection equipment, carrying and garage \nconditions according to workplace and OHS \nrequirements \n2.4. The load is protected in accordance with legal and \nworkplace safety requirements \n3. Complete \ndocumentation \n3.1. Raw materials, products and/or supplies are selected \nand checked for ability to travel in accordance with \nrelevant regulations/permit requirements  \n3.2. All required records are completed in accordance \nwith legislative and workplace requirements\n\n--- PDF PAGE 72 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n70\n \n \nRANGE OF VARIABLES \nVARIABLE\nRANGE\n1. \nWorkplace \nrequirements \nMay include but not limited to: \n1.1. Company policies and procedures \n1.2. Standard Operating Procedures \n1.3. Workplace operations manual  \n1.4. Work instructions \n1.5. Production schedules \n1.6. Manufacturers' specifications \n1.7. Warehouse plan/layout  \n1.8. Labels and codes \n1.9. Safety signs and symbols \n1.10.Standard forms and reports\n2. \nOccupational \nHealth and Safety  \n(OHS) \nrequirements \nMay include but not limited to: \n2.1. Health/medical certificate \n2.2. DOLE requirements \n2.3. Personal hygiene and good grooming \n2.4. Plant sanitation and waste management \n2.5. Relevant permits \n2.6. BFAD requirements \n2.7. PPE requirements  \n2.1.1. high visibility clothing / coveralls \n2.1.2. head gears such as caps, hairnets, ear plugs \n2.1.3. safety glasses \n2.1.4. mouth masks \n2.1.5. gloves  \n2.1.6. rubber boots\n3. \nRaw materials, \nproducts and \nsupplies \nMay include but not limited to: \n5.1. Raw materials \n5.2. Goods in process \n5.3. Finished goods \n5.4. Packaging materials and supplies \n5.5. Tools and equipment \n5.6. Office and stationery supplies \n5.7. Forms, brochures and documents \n \nMay also be: \n5.8. Irregularly shaped \n5.9. Packaged or unpackaged \n5.10. Labeled or unlabelled \n5.11. In palettes or not\n\n--- PDF PAGE 73 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n71\n4. \nRegulatory and \nlegislative \nrequirements \nMay include but not limited to: \n4.2. Licensing requirements \n4.3. DOLE regulations \n4.4. Dangerous Drugs Act \n4.5.\nDENR/EMB regulations\n5. \nHazards and risks \nMay include but not limited to:  \n5.1. Chemicals \n5.2. Dangerous or hazardous substances \n5.3. Movements of equipment, goods and materials \n5.4. Wet and iced operating surfaces \n5.5. Oil on operating surface \n5.6. Faulty brakes \n5.7. Workplace obstacles and other operational \nequipment and vehicles \n5.8. Damaged loads and pallets \n5.9.\nOther personnel in work area\n6. \nRecords \nMay include but not limited to: \n6.1. Name of personnel (loader/unloader) \n6.2. Date and place of loading/unloading \n6.3. Type of raw materials, products and supplies \n6.4. Goods and container identification  \n6.5. Quantity / Inventory count \n6.6. Quality specifications \n6.7. “Use by / best before” dates \n6.8. Picking slips \n6.9. Merchandise transfers \n6.10. Stock requisitions \n6.11. Operations and service record book or log \n6.12. Supplier and/or client instructions \n6.13. Warehouse/Container requirements (e.g. relative \nhumidity, temperature, and ventilation)  \n6.14. Traceability information\n\n--- PDF PAGE 74 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n72"
        },
        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n \n1.1. Loaded and unloaded raw materials, products and \nsupplies  \n1.2. Handled properly dangerous goods and \nsubstances, and goods requiring special handling \n1.3. Identified hazards and risks and performed \nrequired action \n1.4. Selected and used lifting aids and appliances \n1.5. Secured and protected load \n1.6. Completed records and reports  \n1.7. Followed work procedures  \n \nThe skills and knowledge required to load and unload raw \nmaterials, products and supplies must be transferable to a \ndifferent work environment. \n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this \nstandard in the workplace, to transfer the skills to other \ncontexts, and to deal with unplanned events.  The \nknowledge requirements for this competency standard are \nlisted below: \n \n2.1. \nBasic characteristics of raw materials, products \nand supplies relevant to loading and unloading  \n2.2. \nBasic principles and procedures for loading and \nunloading \n2.3. \nProper distribution of load \n2.4. \nMethods of securing and protecting load \n2.5. \nWarehouse plan/Site layout and obstacles \n2.6. \nWorkplace operating procedures \n2.7. \nHazard and risk identification and control \n2.8. \nEmergency response procedures \n2.9. \nOHS requirements \n2.10. Regulatory requirements \n2.11. Awareness of Codes or regulations such as \nHACCP and GMP \n \nAttitudes: \n2.12. Honest \n2.13. Accurate  \n2.14. Environment-conscious\n\n--- PDF PAGE 75 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n73\n2.15. Positive work values \n2.16. Cost conscious \n2.17. Safety conscious \n2.18. Personal hygiene \n3. Underpinning Skills \n3.1. Identification of load characteristics \n3.2. Safe loading and unloading procedures \n3.3. Distributing, securing and protecting load \n3.4. Identification and use of appropriate equipment for \nloading/unloading \n3.5. Modification of activities according to risks and \nenvironments \n3.6. Identification of containers and goods coding \n3.7. Safe manual handling techniques \n3.8. Operate manual load shifting equipment \n3.9. Estimation of size, shape and special requirements \nof loads \n3.10. Locate, interpret and apply relevant information \n3.11. Follow work procedures \n3.12. Oral and written communication skills \n3.13. Recording and reporting skills \n4. Methods of \nAssessment \nCompetency must be  assessed through: \n4.1. Direct observation with oral questioning \n4.2. Demonstration with oral questioning \n4.3.\nPortfolio\n5. Resource \nImplications \nThe following resources must be provided: \n5.1. Specific work area/station \n5.2. Equipment and tools relevant to loading/unloading \nraw materials, products and supplies  \n5.3. Materials relevant to the proposed activity \n5.4. Workplace procedures, schedules and records  \n6. Context of \nAssessment \n6.1 Assessment should occur on the job or in a \nsimulated workplace \n6.2 Ability to apply competency over time and on a \nnumber of occasions.",
