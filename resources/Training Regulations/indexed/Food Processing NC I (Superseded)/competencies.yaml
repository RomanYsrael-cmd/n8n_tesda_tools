        "source_text": "--- PDF PAGE 35 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n33\nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY:   IMPLEMENT SAMPLING PROCEDURES \n \nUNIT CODE                     : AGR741305 \n \nUNIT DESCRIPTOR:       This unit deals with the skills, knowledge and attitudes \nrequired to implement sampling procedures. It involves \nunderstanding the requirements of sampling plans, collecting \nand transferring samples while retaining sample integrity. \n \n \nELEMENT\nPERFORMANCE CRITERIA \nBold italicized terms are elaborated in the Range of Variables \n1. Prepare for sampling \n1.1. Sampling requirements are identified in \naccordance with the sampling plan \n1.2. Sampling equipment, containers and labels are \nprepared according to sampling requirements\n2. Collect samples \n2.1. Samples are collected according to sampling \nprocedures and sampling plan  \n2.2. Samples are handled and prepared to preserve \nsample and source integrity according to sampling \nrequirements and OHS requirements \n2.3. Defects or abnormalities in source material and/or \nsample are identified and reported according to \nworkplace requirements \n2.4. Sample information is recorded according to \nworkplace procedures \n2.5. The workplace is cleaned and maintained according \nto workplace standards\n\n--- PDF PAGE 36 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n34\n \n \nRANGE OF VARIABLES \n \nVARIABLE\nRANGE\n1. Sampling \nrequirements \nMay involve collection and transfer of samples: \n1.1   under controlled conditions \n1.1.1 Time \n1.1.2 Temperature \n1.1.3 Light \n1.1.4 Humidity \n1.1.5 Sanitary conditions  \n \n1.2 \nafter processes are adjusted in response to \nvariation or non-conformance \n2. Samples \nSamples may include any one but not limited to: \n2.1. \nRaw materials  \n2.2. \nGoods in process \n2.3. \nFinished products \n2.4. \nPackaging materials and supplies \n3. OHS requirements \nOccupational Health and Safety requirements may include \nbut not limited to: \n3.1  Health/medical certificate \n3.2  DOLE requirements \n3.3  Personal hygiene and good grooming \n3.4  Plant sanitation and waste management \n3.5  BFAD requirements \n3.6  PPE requirements  \n3.6.1 apron/laboratory gown \n3.6.2 mouth masks \n3.6.3 gloves  \n3.6.4 rubber boots \n3.6.5 head gears such as caps, hairnets, ear plugs \n4. Workplace \nrequirements \nMay include but not limited to: \n4.1. company policies and procedures \n4.2. standard operating procedures \n4.3. work instructions \n4.4. production schedules \n4.5. forms and reports\n\n--- PDF PAGE 37 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n35\n5. Sample \ninformation \nMay include but not limited to: \n5.1. date of sampling \n5.2. location of sampling \n5.3. source of sample \n5.4. characteristics of source \n5.5. amount of sample / sample size \n5.6. characteristics of sample \n5.7. preparation, handling, preservation, and storage \nrequirements \n5.8.\nlabel\n\n--- PDF PAGE 38 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n36\n \n \nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n \n1.1. identified sampling requirements \n1.2. collected, handled and prepared samples \n1.3. followed work procedures \n1.4. recorded sample information \n \nThe skills and knowledge required to implement sampling \nprocedures must be transferable to a different work \nenvironment. \n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge and understanding are essential to apply this \nstandard in the workplace, to transfer the skills to other \ncontexts, and to deal with unplanned events.  The \nknowledge requirements for this competency standard are \nlisted below: \n \n2.1. Sampling plan \n2.2. Basic sampling principles, with emphasis on \nsampling which is random and representative of the \nlot \n2.3. Sampling techniques \n2.4. Basic characteristics of samples to be handled  \n2.5. Preparation, handling, preservation and storage \nrequirements for samples \n2.6. Awareness of Codes or Regulations such as HACCP \nand GMP \n \nAttitudes: \n2.7. Accurate \n2.8. Environment-conscious \n2.9. Positive work values \n2.10. Cost conscious \n2.11. Safety conscious \n2.12. Honest \n2.13. Cooperative\n3. Underpinning Skills \n3.1 \nSelect and use appropriate personal protective \nequipment \n3.2 \nFollow work procedures \n3.3 \nOral and written communication skills \n3.4 \nWorking with others and in teams \n3.5\nBasic mathematical skills (percentage)\n\n--- PDF PAGE 39 ---\n_________________________________________ \n \nTR - Food Processing NC I                                                         \n37\n3.6 \nRecording and reporting skills \n3.7\nTime management\n4. Methods of \nAssessment \nCompetency must be  assessed through: \n4.1. Direct observation with oral questioning \n4.2. Demonstration with oral questioning \n4.3.\nPortfolio\n5. Resource \nImplications \nThe following resources must be provided: \n5.1 Specific work area/station \n5.2 Equipment and tools for sampling \n5.3 Materials relevant to the proposed activity \n5.4 Relevant workplace procedures, schedules and \nrecords  \n6. Context of \nAssessment \n6.1 \nAssessment should occur on the job or in a \nsimulated workplace \n6.2 \nAbility to apply competency over time and on a \nnumber of occasions.\n",
