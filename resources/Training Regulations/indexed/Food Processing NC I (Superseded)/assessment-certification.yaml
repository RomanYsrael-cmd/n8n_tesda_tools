      "text": "6 The guidelines on assessment and certification are discussed in detail in the Procedures manual on Assessment and Certification and Guidelines on the implementation of the Philippine TVET Qualification and Certification System (PTQCS). --- PDF PAGE 89 --- _________________________________________ TR - Food Processing NC I 87 Implement sampling procedures Load and unload raw materials, products and/or supplies Control and order stock Operate a packaging process Participate in sensory analysis Inspect and sort materials and product Process Food by Salting, Curing and Smoking Apply product knowledge to complete work operations Work in a freezer storage area Set up and operate processes in a production / packaging system Dispense non bulk ingredients Process Food by Fermentation and Pickling Perform basic tests in raw materials, in process and finished products Work with temperature controlled stock Participate in an audit process Prepare raw/packaging materials for processing Process food by sugar concentration Operate a boiler Handle dangerous goods/hazardous substances Participate in a HACCP team Operate basic equipment Package Finished / Processed Food Products Operate pumping equipment Apply raw materials / ingredients and process knowledge Monitor workplace performance and participate in improvement processes Clean and sanitize equipment and processing/packaging area Receive and store stock Operate and monitor food processes and equipment Maintain food safety when loading, unloading and transporting food --- PDF PAGE 90 --- _________________________________________ TR - Food Processing NC I 88 Continuation ….. Competency Map for Processed Food and Beverages Sector Apply Food Safety and Sanitation Use Standard Measuring Devices / Instruments Use Food Processing Tools, Equipment and Utensils Follow work procedures to maintain Good Manufacturing Practice Perform Mathematical Computation Implement Good Manufacturing Practice Procedures Implement Environmental Policies and Procedures Monitor the Implementation of Good Manufacturing Practice Procedures Monitor the Implementation of Environmental Policies and Procedures Receive and Respond to Workplace Communication Participate in Workplace Communication Lead Workplace Communication Use relevant technologies Collect, analyze and organize information Work with Others Work in a Team Environment Lead Small Team Utilize specialized communication skills Plan and Organize Work Demonstrate Work Values Practice Career Professionalism Develop and practice negotiation skills Develop Team and Individual Practice Housekeeping Procedures Practice Occupational Health and Safety Procedures Solve Workplace Problems Related to Work Activities Apply Problem Solving Techniques in the Workplace Food Processing NC I --- PDF PAGE 91 --- _________________________________________ TR - Food Processing NC I 89 For the purpose of this competency standard, the following words are defined: 1. Basic equipment - equipment requiring limited application and process knowledge and limited equipment adjustment. 2. Cleaning - the process of removing the maximum amount of soil from an article in the most efficient way. 3. Competency – the application of knowledge, skills and attitudes to perform work activities to the standard expected in the workplace. 4. Dispense – distribute, administer or bestow, as in small portions. 5. Element – building blocks of a unit of competency. It describes in outcome terms the functions that a person who works in a particular area of work is able to perform. 6. E numbers - all numbers prefixed with E are food additives which are legal in the whole of the European Union. Those prefixed with (E) are licensed for use in the United Kingdom and possibly other countries but not throughout the EU generally (International Dictionary of Food and Cooking, 1998). 7. Evidence Guide – a guide for assessment that provides information on critical aspects of competency, underpinning knowledge, underpinning skills, resource implications, context of assessment and assessment methods. 8. Food additives - substances intentionally added to foods to achieve or retain desired characteristics 9. Food processing - the methods and techniques used to transform raw ingredients into finished food products 10. Forklift - a powered industrial truck used to lift and transport materials, normally by means of steel forks inserted under the load. 11. Good Manufacturing Practice (GMP) - a combination of manufacturing and quality control procedures aimed at ensuring that products are consistently manufactured to their specifications. 12. Grading – the process of classifying into groups according to a set of recognized criteria 13. GRAS - Generally Regarded As Safe --- PDF PAGE 92 --- _________________________________________ TR - Food Processing NC I 90 14. Hazard Analysis Critical Control Point (HACCP) - a food safety management system which concentrates prevention strategies on known hazards and the risks of them occurring at specific points in the food chain. 15. Hazard – the potential to cause harm which may include bacteria, virus, toxin, parasite, chemical or physical hazard. Operational malpractices or other operations/processes can also become hazards if they lead to unacceptable contamination or growth and survival of organisms and microorganisms. 16. Packaging – any container or material used in the packaging of a product which may include materials in direct contact with the product, printed packs including labeling, and other materials including outer cartons or delivery cases. 17. Packing - act of putting materials and/or products in a container 18. Pallet - low, portable platform made of wood or metal or in combination to facilitate handling, storage or transport of materials and products as a unit load using forklift. 19. Performance Criteria – evaluative statements that specify what is to be assessed and the required level of performance. 20. pH meter - an instrument used to measure the acidity of a sample 21. Portfolio - documentary evidence of a person’s knowledge and skills 22. Processing aid – an additive which facilitates processing without significantly influencing the character or properties of the finished product (Australian Institute of Food Science and Technology, and Association of Public Analysts) 23. Range of Variables – describes the circumstances or context in which the work is to be performed. 24. Raw materials - consist of the main food material to be processed including minor food ingredients 25. Refractometer - instrument commonly used for measuring fluid concentrations such as sugar content (Brix level) of carbonated beverages, fruits, juices, and/or vegetables. --- PDF PAGE 93 --- _________________________________________ TR - Food Processing NC I 91 26. Risk - the probability that a particular adverse consequence results from a hazard within a stated time under stated conditions (Australian Institute of Food Science and Technology, and Association of Public Analysts) 27. Salinometer - instrument used to measure strength of brine 28. Sampling - the process of drawing or selecting product units from a lot to project the characteristics of a larger population. 29. Sanitation - the process of treating food contact and non-food contact surface with physical agents and chemicals to kill the residual microorganisms present after cleaning 30. Sorting - the process of classifying materials and/or products according to a set of criteria such as size, weight, color, variety, among others. 31. Unit of Competency – describes a work activity. --- PDF PAGE 94 --- _________________________________________ TR - Food Processing NC I 92 The Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and appreciation to the many representatives of business, industry, academe and government agencies who donated their time and expertise to the development and validation of this Training 