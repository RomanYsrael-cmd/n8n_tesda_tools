  "source_text": "SECTION\n4.\n\nNATIONAL\nASSESSMENT\nAND\nCERTIFICATION\nARRANGEMENTS\n\n4.1 To attain the National Qualification of Food Processing NC I, the\ncandidate must demonstrate competence covering all the units listed in\nSection 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n4.2 The qualification of Food Processing, NC I may be attained through:\n\n4.2.1 Accumulation of Certificates of Competency (COCs) in the\nfollowing areas:\n\n4.2.1.1\nImplement sampling procedures\n4.2.1.2\nInspect and sort raw materials and products\n4.2.1.3\nDispense non-bulk ingredients\n4.2.1.4\nPrepare raw/packaging materials for processing\n4.2.1.5\nOperate basic equipment\n4.2.1.6\nClean and sanitize equipment and processing /\npackaging area\n4.2.1.7\nLoad and unload raw materials, products and/or supplies\n\nSuccessful\ncandidates\nshall\nbe\nawarded\nCertificates\nof\nCompetency (COCs).\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate\n\n4.4 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n 4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non formal and informal including enterprise-\nbased training programs.\n4.5.2 Experienced workers (wage employed or self-employed)\n\n 4.6\nThe guidelines on assessment and certification are discussed in detail in\nthe Procedures manual on Assessment and Certification and Guidelines\non the implementation of the Philippine TVET Qualification and\nCertification System (PTQCS).\n\n--- PDF PAGE 89 ---\n_________________________________________\n\nTR - Food Processing NC I\n87\nCOMPETENCY MAP FOR PROCESSED FOOD AND BEVERAGES SECTOR\n\nCORE UNITS OF COMPETENCY\n\nImplement sampling\nprocedures\n\nLoad and unload raw\nmaterials, products and/or\nsupplies\n\nControl and order stock\n\nOperate a packaging process\n\nParticipate in sensory\nanalysis\n\nInspect and sort materials\nand product\n\nProcess Food by Salting,\nCuring and Smoking\n\nApply product knowledge to\ncomplete work operations\n\nWork in a freezer storage area\n\nSet up and operate\nprocesses in a production /\npackaging system\nDispense non bulk\ningredients\n\nProcess Food by\nFermentation and Pickling\n\nPerform basic tests in raw\nmaterials, in process and\nfinished products\n\nWork with temperature\ncontrolled stock\n\nParticipate in an audit\nprocess\nPrepare raw/packaging\nmaterials for processing\n\nProcess food by sugar\nconcentration\n\nOperate a boiler\n\nHandle dangerous\ngoods/hazardous substances\n\nParticipate in a HACCP\nteam\nOperate basic equipment\n\nPackage Finished /\nProcessed Food Products\n\nOperate pumping equipment\n\nApply raw materials /\ningredients and process\nknowledge\n\nMonitor workplace\nperformance and participate\nin improvement processes\n\nClean and sanitize\nequipment and\nprocessing/packaging\narea\n\nReceive and store stock\n\nOperate and monitor food\nprocesses and equipment\n\nMaintain food safety when\nloading, unloading and\ntransporting food\n\n--- PDF PAGE 90 ---\n_________________________________________\n\nTR - Food Processing NC I\n88\nContinuation ….. Competency Map for Processed Food and Beverages Sector\n\nCOMMON UNITS OF COMPETENCY\n\nApply Food Safety and\nSanitation\n\nUse Standard Measuring\nDevices / Instruments\n\nUse Food Processing Tools,\nEquipment and Utensils\n\nFollow work procedures to\nmaintain Good Manufacturing\nPractice\n\nPerform Mathematical\nComputation\nImplement Good\nManufacturing Practice\nProcedures\n\nImplement Environmental\nPolicies and Procedures\n\nMonitor the Implementation of\nGood Manufacturing Practice\nProcedures\n\nMonitor the Implementation of\nEnvironmental Policies and\nProcedures\n\nBASIC UNITS OF COMPETENCY\nReceive and Respond to\nWorkplace\nCommunication\n\nParticipate in Workplace\nCommunication\n\nLead Workplace Communication\n\nUse relevant technologies\n\nCollect, analyze and\norganize information\n\nWork with Others\n\nWork in a Team\nEnvironment\n\nLead Small Team\n\nUtilize specialized\ncommunication skills\n\nPlan and Organize Work\n\nDemonstrate Work Values\n\nPractice Career\nProfessionalism\n\nDevelop and practice\nnegotiation skills\n\nDevelop Team and Individual\n\nPractice Housekeeping\nProcedures\n\nPractice Occupational\nHealth and Safety\nProcedures\n\nSolve Workplace Problems\nRelated to Work Activities\n\nApply Problem Solving\nTechniques in the Workplace\n\nFood Processing NC I\n\n--- PDF PAGE 91 ---\n_________________________________________\n\nTR - Food Processing NC I\n89\n\nDEFINITION OF TERMS\n\nFor the purpose of this competency standard, the following words are defined:\n\n1.\nBasic equipment - equipment requiring limited application and process\nknowledge and limited equipment adjustment.\n\n2.\nCleaning - the process of removing the maximum amount of soil from an\narticle in the most efficient way.\n\n3.\nCompetency – the application of knowledge, skills and attitudes to perform\nwork activities to the standard expected in the workplace.\n\n4.\nDispense – distribute, administer or bestow, as in small portions.\n\n5.\nElement – building blocks of a unit of competency. It describes in outcome\nterms the functions that a person who works in a particular area of work is\nable to perform.\n\n6.\nE numbers - all numbers prefixed with E are food additives which are legal\nin the whole of the European Union. Those prefixed with (E) are licensed for\nuse in the United Kingdom and possibly other countries but not throughout\nthe EU generally (International Dictionary of Food and Cooking, 1998).\n\n7.\nEvidence Guide – a guide for assessment that provides information on\ncritical aspects of competency, underpinning knowledge, underpinning skills,\nresource implications, context of assessment and assessment methods.\n\n8.\nFood additives - substances intentionally added to foods to achieve or\nretain desired characteristics\n\n9.\nFood processing - the methods and techniques used to transform raw\ningredients into finished food products\n\n10.\nForklift - a powered industrial truck used to lift and transport materials,\nnormally by means of steel forks inserted under the load.\n\n11.\nGood Manufacturing Practice (GMP) - a combination of manufacturing\nand quality control procedures aimed at ensuring that products are\nconsistently manufactured to their specifications.\n\n12.\nGrading – the process of classifying into groups according to a set of\nrecognized criteria\n\n13.\nGRAS - Generally Regarded As Safe\n\n--- PDF PAGE 92 ---\n_________________________________________\n\nTR - Food Processing NC I\n90\n\n14.\nHazard Analysis Critical Control Point (HACCP) - a food safety\nmanagement system which concentrates prevention strategies on known\nhazards and the risks of them occurring at specific points in the food chain.\n\n15.\nHazard – the potential to cause harm which may include bacteria, virus,\ntoxin, parasite, chemical or physical hazard. Operational malpractices or\nother operations/processes can also become hazards if they lead to\nunacceptable contamination or growth and survival of organisms and\nmicroorganisms.\n\n16.\nPackaging – any container or material used in the packaging of a product\nwhich may include materials in direct contact with the product, printed packs\nincluding labeling, and other materials including outer cartons or delivery\ncases.\n\n17.\nPacking - act of putting materials and/or products in a container\n\n18.\nPallet - low, portable platform made of wood or metal or in combination to\nfacilitate handling, storage or transport of materials and products as a unit\nload using forklift.\n\n19.\nPerformance Criteria – evaluative statements that specify what is to be\nassessed and the required level of performance.\n\n20.\npH meter - an instrument used to measure the acidity of a sample\n\n21.\nPortfolio - documentary evidence of a person’s knowledge and skills\n\n22.\nProcessing aid – an additive which facilitates processing without\nsignificantly influencing the character or properties of the finished product\n(Australian Institute of Food Science and Technology, and Association of\nPublic Analysts)\n\n23.\nRange of Variables – describes the circumstances or context in which the\nwork is to be performed.\n\n24.\nRaw materials - consist of the main food material to be processed including\nminor food ingredients\n\n25.\nRefractometer - instrument commonly used for measuring fluid\nconcentrations such as sugar content (Brix level) of carbonated beverages,\nfruits, juices, and/or vegetables.\n\n--- PDF PAGE 93 ---\n_________________________________________\n\nTR - Food Processing NC I\n91\n\n26.\nRisk - the probability that a particular adverse consequence results from a\nhazard within a stated time under stated conditions (Australian Institute of\nFood Science and Technology, and Association of Public Analysts)\n\n27.\nSalinometer - instrument used to measure strength of brine\n\n28.\nSampling - the process of drawing or selecting product units from a lot to\nproject the characteristics of a larger population.\n\n29.\nSanitation - the process of treating food contact and non-food contact\nsurface with physical agents and chemicals to kill the residual\nmicroorganisms present after cleaning\n\n30.\nSorting - the process of classifying materials and/or products according to\na set of criteria such as size, weight, color, variety, among others.\n\n31.\nUnit of Competency – describes a work activity.\n\n--- PDF PAGE 94 ---\n_________________________________________\n\nTR - Food Processing NC I\n92\nACKNOWLEDGMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of this Training Regulation.\n\n•\nPHILIPPINE CHAMBER OF AGRICULTURE AND FOOD, INC. (PCAFI)\n\n•\nTHE TECHNICAL AND INDUSTRY EXPERT PANEL\n\nMr. EDWARD F. DAVID\nChair, PhilFoodEx\nRm. 305, Bahay ng Alumni\nPres. Ramon Magsaysay Ave.\nU.P. Campus, Diliman, Quezon City\nMs. CECILIA DELA PAZ\nNutrivina Phils.\nUnit 801, Manila Luxury Cond.\nPearl Drive cor. Goldloop St., Ortigas\nPasig City\nMr. JOSE D. GONZALES, JR.\nRizal Experimental Station and Pilot School\n of Cottage Industries\nJenny’s Avenue Extn.\nMaybunga, Pasig City\nMs. AURORA C. SUBIDA\nMaya Kitchen\n8th Flr., Liberty Building, Pasay Road\nMakati City\n\nMr. BOBBY C. PRADEL\nMofel’s Food International Corp\n20220 Arpilleda St., Makati City\n\nMr. GEORGE LORENZANA\nLorenzana Food Corp.\n551 M. Naval St., Navotas, Metro\nManila\nMR. TONY TAN\nTechnology Group Manager, Beverages\nUniversal Robina Corporation\n3/F Britania Bldg.\nE. Rodriguez Jr. Avenue\nBagong Ilog, Pasig City 1600\nMS. LOURDES LABRADOR\nPresident\nCastillejos Agri-Farms, Inc.\n#656 Boni Avenue Cor. Ligaya Alley\n1550 Mandaluyong City\nMR. ROMMEL S. GERODIAS\nGeneral Manager\nReinlab Corporation\nBlock 22 Lots 3 and 4 Francisco Village\nBrgy. Pulong, Sta Cruz\nSanta Rosa City, Laguna 4026\n\n--- PDF PAGE 95 ---\n_________________________________________\n\nTR - Food Processing NC I\n93\n\nThe PARTICIPANTS in the National Validation of this Training Regulation\n• Castillejos Agri-Farms Inc.\n• Department of Science and Technology – Industrial Technology Development\nInstitute\n• Food Development Center\n• Goldilocks\n• Marigold Commodities Corporation\n• Monde Nissin Corporation\n• Narigin Food Corporation\n• Technology Resource Center (formerly the Technology and Livelihood Resource\nCenter)\n• Universal Robina Corporation\n\nThe Management and Staff of TESDA Secretariat"
