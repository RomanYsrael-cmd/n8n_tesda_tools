  "arrangements": [
    {
      "number": "4",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "number": "4.1",
      "text": "To attain the National Qualification of Food Processing NC I, the candidate must demonstrate competence covering all the units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "number": "4.2",
      "text": "The qualification of Food Processing, NC I may be attained through: 4.2.1 Accumulation of Certificates of Competency (COCs) in the following areas: 4.2.1.1 Implement sampling procedures 4.2.1.2 Inspect and sort raw materials and products 4.2.1.3 Dispense non-bulk ingredients 4.2.1.4 Prepare raw/packaging materials for processing 4.2.1.5 Operate basic equipment 4.2.1.6 Clean and sanitize equipment and processing / packaging area 4.2.1.7 Load and unload raw materials, products and/or supplies Successful candidates shall be awarded Certificates of Competency (COCs)."
    },
    {
      "number": "4.3",
      "text": "Accumulation and submission of all COCs acquired for the relevant units of competency comprising a qualification, an individual shall be issued the corresponding National Certificate"
    },
    {
      "number": "4.4",
      "text": "Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units."
    },
    {
      "number": "4.5",
      "text": "The following are qualified to apply for assessment and certification: 4.5.1 Graduates of formal, non formal and informal including enterprise- based training programs. 4.5.2 Experienced workers (wage employed or self-employed)"
    },
    {
      "number": "4.6",
      "text": "The guidelines on assessment and certification are discussed in detail in the Procedures manual on Assessment and Certification and Guidelines on the implementation of the Philippine TVET Qualification and Certification System (PTQCS)."
    }
  ],
  "source_text": "SECTION\n4.\n\nNATIONAL\nASSESSMENT\nAND\nCERTIFICATION\nARRANGEMENTS\n\n4.1 To attain the National Qualification of Food Processing NC I, the\ncandidate must demonstrate competence covering all the units listed in\nSection 1. Successful candidates shall be awarded a National Certificate\nsigned by the TESDA Director General.\n\n4.2 The qualification of Food Processing, NC I may be attained through:\n\n4.2.1 Accumulation of Certificates of Competency (COCs) in the\nfollowing areas:\n\n4.2.1.1\nImplement sampling procedures\n4.2.1.2\nInspect and sort raw materials and products\n4.2.1.3\nDispense non-bulk ingredients\n4.2.1.4\nPrepare raw/packaging materials for processing\n4.2.1.5\nOperate basic equipment\n4.2.1.6\nClean and sanitize equipment and processing /\npackaging area\n4.2.1.7\nLoad and unload raw materials, products and/or supplies\n\nSuccessful\ncandidates\nshall\nbe\nawarded\nCertificates\nof\nCompetency (COCs).\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate\n\n4.4 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n 4.5 The following are qualified to apply for assessment and certification:\n\n4.5.1 Graduates of formal, non formal and informal including enterprise-\nbased training programs.\n4.5.2 Experienced workers (wage employed or self-employed)\n\n 4.6\nThe guidelines on assessment and certification are discussed in detail in\nthe Procedures manual on Assessment and Certification and Guidelines\non the implementation of the Philippine TVET Qualification and\nCertification System (PTQCS).\n\n--- PDF PAGE 89 ---\n_________________________________________\n\nTR - Food Processing NC I\n87\n"
}
