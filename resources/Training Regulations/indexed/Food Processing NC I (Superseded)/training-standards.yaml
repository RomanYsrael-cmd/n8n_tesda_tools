    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Food Processing NC I.\n\n3.1.\nCURRICULUM DESIGN\n\nCourse Title: FOOD PROCESSING\n\n NC Level: NC I\n\nNominal Training Duration: 28 hours (Basic)\n\n 88 hours (Common)\n\n 364 hours (Core)\n\n--------------------------------\n\n 480 hours (TOTAL)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable skills and attitudes\nFood Processing NC l in accordance with industry standards. It covers the basic,\ncommon and core competencies.\n\nBASIC COMPETENCIES\n(28 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\n•\nGroup\ndiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam\n2.2 Describe work as a team\nmember\n•\nDiscussion\n•\nInteraction\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n\n--- PDF PAGE 77 ---\n_________________________________________\n\nTR - Food Processing NC I\n75\n3. Practice career\nprofessionalism\n\n3.1 Integrate personal\nobjectives with\norganizational goals\n3.2 Set and meet work priorities\n3.3 Maintain professional\ngrowth and development\n•\nDiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\nprocedures\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\n•\nDiscussion\n•\nPlant tour\n•\nSymposium\n•\nObservation\n•\nInterview\n\nCOMMON COMPETENCIES\n(88 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply Food\nSafety and\nSanitation\n\n1.1 Wear personal\nprotective equipment\n1.2 Observe personal\nhygiene and good\ngrooming\n1.3 Implement food\nsanitation practices\n1.4 Render safety measures\nand first aid procedures\n1.5 Implement\nhousekeeping activities\n\n• Demonstration\n• Dual training\n• Individual Self-\npaced learning\n• Lecture\n\n• Written\nexamination\n• Demonstration of\npractical skills\n• Direct observation\n• Interview\n2. Use Standard\nMeasuring\nDevices/Instrum\nents\n\n2.1 Identify standard\nmeasuring devices and\ninstruments\n2.2 Review the procedures in\nusing standard measuring\ndevices and instruments\n2.3 Follow procedures of\nusing measuring devices\nand instruments\n\n• Demonstration\n• Dual training\n• Individual Self-\npaced Learning\n• Lecture\n• Written\nexamination\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 78 ---\n_________________________________________\n\nTR - Food Processing NC I\n76\n3. Use Food\nProcessing\nTools,\nEquipment and\nUtensils\n\n3.1 Perform Pre-Operation\nActivities\n3.2 Operate, monitor and\nmaintain Food processing\nEquipment\n3.3 Perform post operation\nactivities\n\n• Demonstration\n• Dual training\n• Individual Self-\npaced Learning\n• Lecture\n\n• Written\nexamination\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n4. Perform\nMathematical\nComputations\n4.1 Gather, summarize and\ntabulate the recorded\ndata\n4.2 Review the various\nformulations\n4.3 Calculate production\ninput and output\n4.4 Compute production\ncost\n• Lecture\n• Practical\nexercise\n\n•\nWritten\nexamination\n•\nPractical\nexercise\n•\nDirect\nObservation\n5. Follow work\nprocedures to\nmaintain Good\nManufacturing\nPractice\n5.1 Identify requirements for\nGMP related to own\nwork\n5.2 Observe personal\nhygiene and conduct to\nmeet GMP\nrequirements\n5.3 Follow GMP\nrequirements when\ncarrying out work\nactivities\n5.4 Complete workplace\ndocumentation to\nsupport GMP\n•\nLecture\n•\nPractical\nexercise\n\n• Written\nexamination\n• Demonstration\nof practical skills\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 79 ---\n_________________________________________\n\nTR - Food Processing NC I\n77\n\nCORE COMPETENCIES\n(364 hours)\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Implement\nsampling\nprocedures\n1.1 Prepare for sampling\n1.2 Collect samples\n•\nLecture\n•\nDiscussion\n•\nDemonstration\n\n•\nObservation\n•\nDemonstration\n•\nQuestioning\n\n2. Inspect and sort\nraw materials\nand products\n\n2.1 Prepare equipment and\ntools\n2.2 Inspect and sort raw\nmaterials and product\n2.3 Complete inspection\nand sorting activity\n\n•\nLecture\n•\nDiscussion\n•\nDemonstration\n\n•\nObservation\n•\nDemonstration\n•\nQuestioning\n\n3. Dispense non-\nbulk ingredients\n3.1 Prepare to dispense\ningredients\n3.2 Measure and/or weigh\ningredients\n3.3 Complete the\ndispensing process\n•\nLecture\n•\nDiscussion\n•\nDemonstration\n\n•\nObservation\n•\nDemonstration\n•\nQuestioning\n\n4. Prepare\nraw/packaging\nmaterials for\nprocessing\n4.1 Select raw/packaging\nmaterials\n4.2 Prepare raw/packaging\nmaterials\n\n•\nLecture\n•\nDemonstration\n•\nDiscussion\n\n•\nObservation\n•\nDemonstration\n•\nQuestioning\n\n--- PDF PAGE 80 ---\n_________________________________________\n\nTR - Food Processing NC I\n78\n5. Operate basic\nequipment\n5.1 Select and prepare\nequipment for use\n5.2 Operate equipment\n5.3 Maintain equipment and\nresources\n\n•\nLecture\n•\nDiscussion\n•\nDemonstration\n•\nObservation\n•\nDemonstration\n•\nQuestioning\n6. Clean and\nsanitize\nequipment and\nprocessing /\npackaging area\n6.1 Prepare for cleaning\n6.2 Clean and sanitize\nequipment and\nprocessing / packaging\narea to meet workplace\nrequirements\n\n•\nLecture\n•\nDiscussion\n•\nDemonstration\n•\nObservation\n•\nDemonstration\n•\nQuestioning\n7. Load and unload\nraw materials,\nproducts and/or\nsupplies\n7.1 Load and unload raw\nmaterials, products\nand/or supplies\n7.2 Secure and protect the\nload\n7.3 Complete\ndocumentation\n\n•\nLecture\n•\nDiscussion\n•\nDemonstration\n•\nObservation\n•\nDemonstration\n•\nQuestioning\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of work\nto the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited.\n\n--- PDF PAGE 81 ---\n_________________________________________\n\nTR - Food Processing NC I\n79\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein\nthe trainee is allowed to progress at his own pace. The trainer just facilitates\nthe training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in the\ntraining regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video or computer\ntechnologies.\n• Project-based instruction is an authentic instructional model or strategy in which\nstudents plan, implement and evaluate projects that have real world\napplications.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n• can communicate both oral and written\n• physically and mentally fit\n• with good moral character\n• can perform basic mathematical computation\n\n--- PDF PAGE 82 ---\n_________________________________________\n\nTR - Food Processing NC I\n80\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\n FOOD PROCESSING NC I\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor Food Processing NC I.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\n5 sets\n• Measuring\ncups (dry)\n5\n• Weighing scales\n(2 – 10 kg\ncapacity)\n\nA. FOOD\n5 sets\n• Measuring\ncups (liquid)\n5\n• Dietetic scales\n(1-kg capacity)\n10 kg\n• Fresh fruits\n5 sets\n• Measuring\nspoons\n2\n\n• Electronic scales\n\n10 kg\n•Fresh vegetables\n10\npcs\n• Dressed poultry\n5 sets\n• Mixing bowls,\nstainless steel\n1\n• Jacklift\n20 kg\n• Fresh fish and\nother marine\nproducts (medium\nsize)\n1 set\n• Funnels,\nassorted sizes\n1\n• Trolley\n20 kg\n• Fresh fish and\nother marine\nproducts (medium\nsize)\n5\n• Jars (for liquid)\n1\n• Wheeler\n10 kg • Fresh meat\n10\n• Colanders,\nstainless steel\n1\n• Image processor\n5 doz\n• Fresh eggs\n10\n• Casseroles,\nstainless steel\n5\n• Stoves\n(2-burner)\n2\nsets\n• Curing ingredients\n(for pork – ham\nand/or longanisa or\ntocino)\n10\n• Saucepan,\nstainless steel\n1\n• Laboratory scale\ncabinet drier or\nforced draft oven\n3 kg\n• Salt\n10\n• Roasting pans\n1\n• Oven\n1\nsack\n• Refined sugar\n10\n• Stock pots\n1\n• Roller sorter\n3 gal\n• Vinegar\n5\n• Double boilers\n1\n• Belt and roller\nsorter\n1 gal\n• Mother vinegar\n\n--- PDF PAGE 83 ---\n_________________________________________\n\nTR - Food Processing NC I\n81\n10\n• Hard plastic\nchopping\nboards\n1\n• Conveyor\n2 gal\n• All spice pickling\nsolution\n5\n• Wooden\nchopping\nboards\n1 set\n• Food processor\n1 kg\n• Citric acid\n10\n• Spoons,\nwooden\n1\n• Washing\nequipment\n1 kg\n• Sodium benzoate\n10\n• Spoons,\nbasting\n1\n• Stainless steel\ntable\n1 kg\n• Firming agent\n10\n• Spoons,\nslotted\n5\n• Mixers\n2 gal\n• Pineapple juice\n10\n• Skimmers\n\n1 can\n• Active dry yeast\n5\n• Paddles,\nwooden\n5\n• Blenders\n\n5\n• Wire whips\n5\n• Roasters\n\n10\n• Food tongs\n5\n• Grinders\n\n5\n• Wire baskets\n5\n• Chopper\n\n5\n• Soaking\ncontainer\n5\n• Graters\nB. NON - FOOD\n5\n• Fermenting\ncontainers\n5\n• Cutters\n5 sets\n• Packaging\nmaterials – can,\npaper, plastic,\nbottle, glass,\ncarton, laminates\n20\n• Ingredient bins\n5\n• Molders\n\n10\n• Storage\ncontainers\n5\n• Frying equipment\n2 gal\n• Disinfectants/\nsanitizers\n20\n• Utility trays\n1\n• Pressure cooker\n(5 – 10 gallons)\n5 pcs\n• Bar soaps/\ndetergents\n5\n• Pipettes\n1\n• Pressure canner\n(10 liters)\n2 sets\n• Various cleaning\nagents (e.g\nabrasives,\ndegreasers, acid\ncleaners, organic\nsolvent)\n5\n• Whisks\n1\n• Headspace\ngauge\n5 pcs\n• Cleaning and\nscouring pads\n5\n• Scalers\n1\n• Chiller\n5 pcs\n• Washclothes\n5\n• Kitchen shears\n1\n• Refrigerator\n5 pcs\n• Brushes\n10 pcs\n• Paring knives\n1\n• Freezer\n5 pcs\n• Pails\n\n--- PDF PAGE 84 ---\n_________________________________________\n\nTR - Food Processing NC I\n82\n2\n• Carborundum\n2\n• Steam jacketed\nkettle\n5 pcs\n• Basins\n10 pcs\n• Peelers\n5\n• Smoking trays\n5 pcs\n• Dippers\n5\n• Heavy duty\ncan openers\n1\n• Fish smoker\n5 pcs\n• Hoses\n5\n• Scrapers\n1\n• Meat grinder\n5 pcs\n• Mops\n5\n• Mortar and\npestle\n1\n• Stuffer/linker\n2 pcs\n• Mop wringer\n2\n• Clocks /\nTimers\n1\n• Filling machine\n5 pcs\n• Squeegees\n\n1\n• Sealing machine\n10 sets\n• ATP\n(adenosine\ntriphosphate)\nquick test\n\n1\n• Capping\nmachine\n1 pack\n• Litmus paper\n\n1\n• Packing\nequipment\n10\n•\nCorrugated\ncartons\n\n1\n• Labeling\nequipment\n10 bun-\ndles\n• Firewood\n\n1\n• Vacuum cleaner\n/ polisher\n5 pcs\n• Garbage\ncans/baskets\n\n1\n• Pressure washer 1 pack\n• Trash bags\n\n2\n• Steamers\n5\n• Spray bottles\n\n2\n• Brix\nrefractometers\n(0-20 o Brix)\n5 packs\n• Deodorizers\n\n1\n• Salinometer\n2\nbottles\n• Glue\n\n2 sets\n• Thermometers,\nvarying\ntemperature\nranges\n(0 - 300o C )\n1 pack\n• Tags/labels\n\n5\n• Dial\nthermometers\n\n2 sets\n• First aid kit\n\n--- PDF PAGE 85 ---\n_________________________________________\n\nTR - Food Processing NC I\n83\n\n5 sets\n• Glasswares -\ncylinders,\nbeakers, flasks,\nvarying\ngraduations\n\n5 sets\n• Personal\nprotective\nequipment*\n\nC. TRAINING MATERIALS\n\n2\n• Receiving tables\n\n• Books /\nReferences\n\n1\n• Hand sink with\ndrainboard\n\n• Manuals\n\n1\n• Towel dispenser\n\n• Audio visual\nmaterials\n\n2\n• Shelves / Racks\n\n• Calculator\n\n2\n• Utility carts\n\n• Bond paper\n\n1\n• Kitchen hood\n\n• Pencils / Pens\n\n1\n• Demonstration\ntable with\noverhead\nmirror\n\n• Reporting and\nrecording\nforms/log books\n\n2 sets\n• Fire fighting\nequipment\n\n* Apron/laboratory gown; Mouth masks; Gloves; Rubber boots/safety shoes; Head gears such as caps,\nhair nets, ear plugs\n\n--- PDF PAGE 86 ---\n_________________________________________\n\nTR - Food Processing NC I\n84\n\n3.5 TRAINING FACILITIES\n\nFOOD PROCESSING NC I\n\nThe food processing workshop must be of concrete structure. Based on a class\nsize of 25 students/trainees, the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nA. Building (permanent)\nLaboratory area\n6 x10\n60\n60\nTool room & S/M storage\narea\n4 x 5\n20\n20\nLearning resource area\n5 x 6\n30\n30\nWash area/comfort room\n(male & female)\n2.5 x 4\n10\n10\nTotal\n120\nFacilities/Equipment/\nCirculation (30% of\nteaching accommodation)\n\n40\nB. Experimental Land\nArea\n\nn/a\nTotal workshop area\n160\nNote: Size of experimental area may change according to availability of land.\n\n3.6 TRAINER’S QUALIFICATIONS FOR FOOD PROCESSING NC I\n\nTRAINER QUALIFICATION (TQ I)\n•\nMust be a holder of Food Processing NC I or its equivalent\n•\nMust have undergone training on Training Methodology I (TM I)\n•\nMust be computer literate\n•\nMust be physically and mentally fit\n•\n*Must have at least 2 years job/industry experience\n•\nMust be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n--- PDF PAGE 87 ---\n_________________________________________\n\nTR - Food Processing NC I\n85\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by the learner who enrolled\nin a structured learning program to determine the achievement of competencies.\nIt is administered by the trainer/assessor at end of each learning module.\n\nThe result of the institutional assessment may be considered as an\nevidence for national assessment.\n\n--- PDF PAGE 88 ---\n_________________________________________\n\nTR - Food Processing NC I\n86"
