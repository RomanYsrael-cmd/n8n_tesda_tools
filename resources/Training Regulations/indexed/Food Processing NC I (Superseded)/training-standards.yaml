 pcs\n• Paring knives\n1\n• Freezer\n5 pcs\n• Pails\n\n--- PDF PAGE 84 ---\n_________________________________________\n\nTR - Food Processing NC I\n82\n2\n• Carborundum\n2\n• Steam jacketed\nkettle\n5 pcs\n• Basins\n10 pcs\n• Peelers\n5\n• Smoking trays\n5 pcs\n• Dippers\n5\n• Heavy duty\ncan openers\n1\n• Fish smoker\n5 pcs\n• Hoses\n5\n• Scrapers\n1\n• Meat grinder\n5 pcs\n• Mops\n5\n• Mortar and\npestle\n1\n• Stuffer/linker\n2 pcs\n• Mop wringer\n2\n• Clocks /\nTimers\n1\n• Filling machine\n5 pcs\n• Squeegees\n\n1\n• Sealing machine\n10 sets\n• ATP\n(adenosine\ntriphosphate)\nquick test\n\n1\n• Capping\nmachine\n1 pack\n• Litmus paper\n\n1\n• Packing\nequipment\n10\n•\nCorrugated\ncartons\n\n1\n• Labeling\nequipment\n10 bun-\ndles\n• Firewood\n\n1\n• Vacuum cleaner\n/ polisher\n5 pcs\n• Garbage\ncans/baskets\n\n1\n• Pressure washer 1 pack\n• Trash bags\n\n2\n• Steamers\n5\n• Spray bottles\n\n2\n• Brix\nrefractometers\n(0-20 o Brix)\n5 packs\n• Deodorizers\n\n1\n• Salinometer\n2\nbottles\n• Glue\n\n2 sets\n• Thermometers,\nvarying\ntemperature\nranges\n(0 - 300o C )\n1 pack\n• Tags/labels\n\n5\n• Dial\nthermometers\n\n2 sets\n• First aid kit\n\n--- PDF PAGE 85 ---\n_________________________________________\n\nTR - Food Processing NC I\n83\n\n5 sets\n• Glasswares -\ncylinders,\nbeakers, flasks,\nvarying\ngraduations\n\n5 sets\n• Personal\nprotective\nequipment*\n\nC. TRAINING MATERIALS\n\n2\n• Receiving tables\n\n• Books /\nReferences\n\n1\n• Hand sink with\ndrainboard\n\n• Manuals\n\n1\n• Towel dispenser\n\n• Audio visual\nmaterials\n\n2\n• Shelves / Racks\n\n• Calculator\n\n2\n• Utility carts\n\n• Bond paper\n\n1\n• Kitchen hood\n\n• Pencils / Pens\n\n1\n• Demonstration\ntable with\noverhead\nmirror\n\n• Reporting and\nrecording\nforms/log books\n\n2 sets\n• Fire fighting\nequipment\n\n* Apron/laboratory gown; Mouth masks; Gloves; Rubber boots/safety shoes; Head gears such as caps,\nhair nets, ear plugs\n\n--- PDF PAGE 86 ---\n_________________________________________\n\nTR - Food Processing NC I\n84\n\n3.5 TRAINING FACILITIES\n\nFOOD PROCESSING NC I\n\nThe food processing workshop must be of concrete structure. Based on a class\nsize of 25 students/trainees, the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nA. Building (permanent)\nLaboratory area\n6 x10\n60\n60\nTool room & S/M storage\narea\n4 x 5\n20\n20\nLearning resource area\n5 x 6\n30\n30\nWash area/comfort room\n(male & female)\n2.5 x 4\n10\n10\nTotal\n120\nFacilities/Equipment/\nCirculation (30% of\nteaching accommodation)\n\n40\nB. Experimental Land\nArea\n\nn/a\nTotal workshop area\n160\nNote: Size of experimental area may change according to availability of land.\n\n3.6 TRAINER’S QUALIFICATIONS FOR FOOD PROCESSING NC I\n\nTRAINER QUALIFICATION (TQ I)\n•\nMust be a holder of Food Processing NC I or its equivalent\n•\nMust have undergone training on Training Methodology I (TM I)\n•\nMust be computer literate\n•\nMust be physically and mentally fit\n•\n*Must have at least 2 years job/industry experience\n•\nMust be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n--- PDF PAGE 87 ---\n_________________________________________\n\nTR - Food Processing NC I\n85\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by the learner who enrolled\nin a structured learning program to determine the achievement of competencies.\nIt is administered by the trainer/assessor at end of each learning module.\n\nThe result of the institutional assessment may be considered as an\nevidence for national assessment.\n\n--- PDF PAGE 88 ---\n_________________________________________\n\nTR - Food Processing NC I\n86"
