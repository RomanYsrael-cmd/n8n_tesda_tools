  "source_text": "COMPETENCY MAP FOR PROCESSED FOOD AND BEVERAGES SECTOR\n\nCORE UNITS OF COMPETENCY\n\nImplement sampling\nprocedures\n\nLoad and unload raw\nmaterials, products and/or\nsupplies\n\nControl and order stock\n\nOperate a packaging process\n\nParticipate in sensory\nanalysis\n\nInspect and sort materials\nand product\n\nProcess Food by Salting,\nCuring and Smoking\n\nApply product knowledge to\ncomplete work operations\n\nWork in a freezer storage area\n\nSet up and operate\nprocesses in a production /\npackaging system\nDispense non bulk\ningredients\n\nProcess Food by\nFermentation and Pickling\n\nPerform basic tests in raw\nmaterials, in process and\nfinished products\n\nWork with temperature\ncontrolled stock\n\nParticipate in an audit\nprocess\nPrepare raw/packaging\nmaterials for processing\n\nProcess food by sugar\nconcentration\n\nOperate a boiler\n\nHandle dangerous\ngoods/hazardous substances\n\nParticipate in a HACCP\nteam\nOperate basic equipment\n\nPackage Finished /\nProcessed Food Products\n\nOperate pumping equipment\n\nApply raw materials /\ningredients and process\nknowledge\n\nMonitor workplace\nperformance and participate\nin improvement processes\n\nClean and sanitize\nequipment and\nprocessing/packaging\narea\n\nReceive and store stock\n\nOperate and monitor food\nprocesses and equipment\n\nMaintain food safety when\nloading, unloading and\ntransporting food\n\n--- PDF PAGE 90 ---\n_________________________________________\n\nTR - Food Processing NC I\n88\nContinuation ….. Competency Map for Processed Food and Beverages Sector\n\nCOMMON UNITS OF COMPETENCY\n\nApply Food Safety and\nSanitation\n\nUse Standard Measuring\nDevices / Instruments\n\nUse Food Processing Tools,\nEquipment and Utensils\n\nFollow work procedures to\nmaintain Good Manufacturing\nPractice\n\nPerform Mathematical\nComputation\nImplement Good\nManufacturing Practice\nProcedures\n\nImplement Environmental\nPolicies and Procedures\n\nMonitor the Implementation of\nGood Manufacturing Practice\nProcedures\n\nMonitor the Implementation of\nEnvironmental Policies and\nProcedures\n\nBASIC UNITS OF COMPETENCY\nReceive and Respond to\nWorkplace\nCommunication\n\nParticipate in Workplace\nCommunication\n\nLead Workplace Communication\n\nUse relevant technologies\n\nCollect, analyze and\norganize information\n\nWork with Others\n\nWork in a Team\nEnvironment\n\nLead Small Team\n\nUtilize specialized\ncommunication skills\n\nPlan and Organize Work\n\nDemonstrate Work Values\n\nPractice Career\nProfessionalism\n\nDevelop and practice\nnegotiation skills\n\nDevelop Team and Individual\n\nPractice Housekeeping\nProcedures\n\nPractice Occupational\nHealth and Safety\nProcedures\n\nSolve Workplace Problems\nRelated to Work Activities\n\nApply Problem Solving\nTechniques in the Workplace\n\nFood Processing NC I\n\n--- PDF PAGE 91 ---\n_________________________________________\n\nTR - Food Processing NC I\n89",
