entify the different transport and\nstock issues\n\nDemonstrate the ability to:\n1. Resolve issue on transport/stock\nmovement\n2. Check the status of a shipment\n3. Compute for shipping cost of a\nparticular delivery\n\n• Lecture\n• Group Discussion\n• Demonstration\n• Video Presentation\n• Visual Presentation\n• Case Study\n\n• Written\nExamination\n• Oral Examination\n• Demonstration\n\n4 hrs.\n\n--- PDF PAGE 121 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n119\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n3.3 Maintain\ntransport/stock\nrecords\nDiscuss:\n•\nImportance of maintaining\ntransport/stock records\n•\nTypes of documents requiring\nrecord keeping and retention\n•\nGovernment and regulatory\nrequirements for transport/stock\nrecords\n•\nDocument control procedures\no Data storage\no Retention\no Access to records\no Authorization to withdraw\ndocuments\nDemonstrate ability to\n1. Discuss the importance of\n document handling and control\n2. Prepare a proper document\n handling and control procedure\n\n• Lecture\n• Group Discussion\n• Visual Presentation\n• Video Presentation\n\n• Written\nExamination\n• Oral Examination\n• Demonstration\n\n1 hr.\n4 Participate in\nstock inventory\ncount\n4.1 Prepare for stock\ninventory count\nDiscuss:\n•\nPhysical Count\no Definition\no Objective\no Types and differentiation\no Frequency\n•\nInventory Count Preparation\no Schedules and cut-offs\no Count teams\no Orientation of count\nteams\no Physical Arrangement\n• Lecture\n• Group Discussion\n• Video Presentation\n• Visual Presentation\n• Written\nExamination\n• Oral Examination\n• Demonstration\n\n4 hrs.\n\n--- PDF PAGE 122 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n120\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no Inventory count\nresources\n•\nWorkplace policies and\nprocedures related to inventory\ncount\nDemonstrate ability to:\n1. Create process flow of\ninventory count\n2. Identify critical aspects of\nphysical arrangement of stocks\nprior to inventory count\n\n4.2 Conduct inventory\ncount and record\nresults\nDiscuss:\n•\nInventory count process\no Wall to Wall\no Cycle Count\n•\nHow to do the actual inventory\ncount\no Unit of Measure\nConversion\no Matching of counts\nbetween count teams\no Reconciling\nmismatched counts\n•\nRecording of inventory count\nresults\no Manual recording\no Data encoding\n(Inventory Management\nSystem)\nDemonstrate the ability to:\n1. Conduct an inventory of stocks\n2. Convert one unit of measure to\nanother\n3. Get the total inventory cost\nbased on count\n\n• Lecture / Discussion\n• Visual Presentation\n• Video Presentation\n\n• Written\nExamination\n• Oral Evaluation\n• Demonstration\n\n4 hrs.\n\n--- PDF PAGE 123 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n121\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n4.3 Inventory\nvariances are\naccounted and\nreconciled\nDiscuss:\n• How to account inventory count\nvariances\n• The different causes of variances\n• Effects of inventory variances to\nfinancial report of the company\n• Inventory reconciliation\n• Inventory adjustments\n• Inventory count reports\n• Lecture\n• Group Discussion\n• Visual Presentation\n\n• Written\nExamination\n• Oral Examination\n• Demonstration\n\n8 hrs.\n\nDemonstrate the ability to:\n1. Account for inventory variances\nand identify possible causes\n2. Make inventory reconciliation\n3. Prepare an inventory count report\n with adjustment\n\n5. Render\n excellent\n customer\n service\n5.1 Establish\n customers profile\n\nDiscuss:\n•\nCustomer data master file\no Importance\no Uses\no Relevant customer data\n•\nFactors in classifying\ncustomers\n•\nVarious customers’ delivery\nservice requirements\n•\nConfidentiality\n•\nData privacy law\nDemonstrate ability to:\n1. Categorize customers\n2. Prepare a customer profile sheet\n3. Enumerate various customer\ndelivery service requirements\n\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written\nExamination\n• Oral Examination\n• Demonstration\n\n4 hrs.\n\n--- PDF PAGE 124 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n122\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.2 Provide services to\ncustomers\nRead and understand\n•\nLaws and government\nregulations affecting customer\nservice and consumer rights\n\nDiscuss:\n•\nCustomer Service\no Importance of customer\nservice\no Principles of customer\nservice\no Customer Service Attitude\no Importance of fulfilling\ncustomer requirements\n\nDemonstrate ability to:\n1. Define customer service and\ngive examples\n2. Discuss benefits of fulfilling\ncustomer requirements\n\n• Lecture / Discussion\n• Demonstration\n• Video Presentation\n• Role Play\n\n• Written\nExamination\n• Oral Examination\n• Demonstration\n\n4 hrs.\n\n5.3 Handle customer\ncomplaints\nDiscuss:\n•\nHandling customer complaints\n•\nKinds of customers’ complaints\nand possible solutions\n•\nDos and Don’ts in handling\ncustomer complaints\n•\nProblem-solving techniques\n•\nDocumentation of complaints\nand resolution\n•\nHow to handle difficult\ncustomer\n•\nPost activities after complaint\nresolution\n• Lecture\n• Discussion\n• Demonstration\n• Video Presentation\n• Role Play\n\n• Written\nExamination\n• Oral Examination\n• Demonstration\n\n3 hrs.\n\n--- PDF PAGE 125 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n123\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\nDemonstrate through role play\n1. Handling customer complaint due\nto\n product defect\n2. Handling customer complaint due\nto\n late delivery\n3. Post warehouse activities after\n resolving a late delivery complaint\n\n5.4 Achieve customer\nsatisfaction\nDiscuss:\n•\nCustomer service satisfaction\no Definition\no Scope and limitation\no Importance of measuring\ncustomer satisfaction\no Methods of measuring\ncustomer satisfaction\n•\nCustomer feedback\no Importance\no Mechanism\no Customer satisfaction\nrating sheet\no Customer Survey\no Company Website\no Social media\no Analysing feedback results\no How to translate results into\nuseable reports for service\nimprovement\nDemonstrate ability to\n1. Develop a sample customer\n survey form\n2. Translate customer survey\nresults to improve service\n• Lecture\n• Group Discussion\n• Demonstration\n• Video Presentation\n\n• Written\nExamination\n• Oral Examination\n• Demonstration\n\n2 hrs.\n\n--- PDF PAGE 126 ---\nWarehousing NC III Promulgated (12/17/2019) 124\n3.2 TRAINING DELIVERY (TO BE REVISED)\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to meet industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-\nwork components.\n\n--- PDF PAGE 127 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n125\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training\nis integrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted\nby non-government organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings such as\nbarangay hall, basketball courts, etc. These programs can also be mobile\ntraining program (MTP).\n\n--- PDF PAGE 128 ---\nWarehousing NC III Promulgated (12/17/2019) 126\n3.3 TRAINEE ENTRY REQUIREMENTS\n\n Trainees or students who want to enroll in this course must possess the following requirements:\n\n•\nMust have completed the ten (10) years of basic education or Alternative Learning System\n(ALS) Certificate of Completion with Grade 10 equivalent holder\n•\nMust possess good communication skills\n•\nMust be computer literate\n\n 3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\nWAREHOUSING SERVICES NC III\n\nRecommended list of tools, equipment and materials for the training of a maximum of 25\ntrainees for WAREHOUSING SERVICES NC III are as follows:\n\nEQUIPMENT *\nQty\nUnit\nSpecification/s /Description\n1\npc\nBar code scanner Long range, laser type, up to 30”\nrange\n1\npc\nDesktop Computer Internet connection capability\n1\npc\nLaptop With compatible printer\n1\npc\nMulti-media projector\n1\nset\nAudio Equipment\n\nNote:\n* The above equipment can be available on site.\n\nSAFETY/PPEs\nQty\nSpecification/s\n1 set\nLeather gloves\nReflectorized Vest\nHard hat\nSafety goggles\nSafety shoes. Steel toed\nDust Mask\nApron\n\nROOM FURNITURES\nQty\nUnit\nSpecification/s\n25\npcs\n Arm chair, plastic 17 ½” seat height\n1\npc\nTeacher’s table Single pedestal, 48\" W x 30\"\nD x 29-1/2\" H\n1\npc\nProjector overhead stand\n1\npc\nMagnetic White board, wall mounted. 4 ft. x\n8 ft.\n1\n set\nFlip board, foldable\n1\n pc\n Cork Board\n\n--- PDF PAGE 129 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n127\n\nSUPPLIES / MATERIALS\nQty\nSpecification/s\n3 pcs\nWhite Board Markers\n1 pc\nWhite Board Eraser\n25 pcs\nKraft Paper\n2 pcs\neach\nScanned Sample Forms – Sales Order, Purchase Order, Delivery Order,\nTransfer Order, Bad Order Form, Count Tags, Count Sheets etc.\n\nLIBRARY HOLDINGS / REFERENCE MATERIALS\nQty\nSpecification/s\n1\n101 Thoughts on Supply Chain Management\n1\nReference materials on Warehousing Management\nJournals/Magazines\n1\nOSHS Manual\n1\nCustomer Response System Manual\n1\nCount Manuals\n1\nCompany Policies\n1\nCompany Procedure Manuals\n\n NOTE: The Training Center has the option to partner with a private/public establishment that\nhas the capability to conduct warehousing services training.\n\n--- PDF PAGE 130 ---\nWarehousing NC III Promulgated (12/17/2019) 128\n3.5 TRAINING FACILITIES\n\nThe areas indicated here are indicative for a class size of 25 trainees. For a smaller\nclass size, they may be reduced, provided that there should be at least 1.0 sq. m. or\nmore space per trainee.\n\nSpace Requirement\nSize in Meters\nArea in Sq.\nMeters\nTotal Area in Sq.\nMeters\nLecture Room\n8 x 5 m.\n40 sq. m.\n40 sq. m.\nWarehouse Facility\n(hands-on purposes)\nActual Size\nActual Size\nActual Size\nLearning Resource\nCenter\n4 x 5 m.\n20 sq. m.\n20 sq. m.\nWash room/Comfort\nRoom (Male and Female)\n3 x 4 m.\n12 sq. m.\n12 sq. m.\nTotal workshop area:\n72 sq. m.\n\nNote:\n* Practical activities can be done in an actual Warehouse Facility\nTechnical Vocational Institute (TVI) offering the Warehousing Services Program can have a\nMemorandum of Agreement (MOA) with a private /public institution with a warehouse facility\n(with receiving, put-away and issuing activities)\n\n3.6 TRAINER’S QUALIFICATIONS FOR WAREHOUSING SERVICES NC III\n\nTrainers who will deliver the training on Warehousing Services NC III should possess the\nfollowing qualifications:\n\n•\nMust be a holder of NTTC Level I in Warehousing Services NC III\n•\nMust possess good communication skills\n•\nMust have at least 3 years experience as supervisor with knowledge Inventory\nManagement –Warehouse Management (IM-WM) system\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees in a structured learning program to\ndetermine their achievement of units of competencies. It is administered by the trainer/assessor\nat end of each learning module.\n\n--- PDF PAGE 131 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n129"
