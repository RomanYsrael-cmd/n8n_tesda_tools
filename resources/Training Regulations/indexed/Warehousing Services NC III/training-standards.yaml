matched counts\n•\nRecording of inventory count\nresults\no Manual recording\no Data encoding\n(Inventory Management\nSystem)\nDemonstrate the ability to:\n1. Conduct an inventory of stocks\n2. Convert one unit of measure to\nanother\n3. Get the total inventory cost\nbased on count\n\n• Lecture / Discussion\n• Visual Presentation\n• Video Presentation\n\n• Written\nExamination\n• Oral Evaluation\n• Demonstration\n\n4 hrs.\n\n--- PDF PAGE 123 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n121\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n4.3 Inventory\nvariances are\naccounted and\nreconciled\nDiscuss:\n• How to account inventory count\nvariances\n• The different causes of variances\n• Effects of inventory variances to\nfinancial report of the company\n• Inventory reconciliation\n• Inventory adjustments\n• Inventory count reports\n• Lecture\n• Group Discussion\n• Visual Presentation\n\n• Written\nExamination\n• Oral Examination\n• Demonstration\n\n8 hrs.\n\nDemonstrate the ability to:\n1. Account for inventory variances\nand identify possible causes\n2. Make inventory reconciliation\n3. Prepare an inventory count report\n with adjustment\n\n5. Render\n excellent\n customer\n service\n5.1 Establish\n customers profile\n\nDiscuss:\n•\nCustomer data master file\no Importance\no Uses\no Relevant customer data\n•\nFactors in classifying\ncustomers\n•\nVarious customers’ delivery\nservice requirements\n•\nConfidentiality\n•\nData privacy law\nDemonstrate ability to:\n1. Categorize customers\n2. Prepare a customer profile sheet\n3. Enumerate various customer\ndelivery service requirements\n\n• Lecture\n• Group Discussion\n• Demonstration\n\n• Written\nExamination\n• Oral Examination\n• Demonstration\n\n4 hrs.\n\n--- PDF PAGE 124 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n122\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMe