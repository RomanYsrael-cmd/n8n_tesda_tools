ic\nchallenges in the workplace\n• Use of range of analytical problem-\nsolving techniques\n• Formulate clear-cut findings on the\nnature of each identified workplace\nchallenges\n\n3.3 Formulate\nresolutions to\nspecific\nworkplace\nchallenges\n\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n• Show mastery of the current industry\nhardware and software products and\nservices\n• Discuss process of identification of\nfundamental causes of specific\nworkplace challenges\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n- Relevant equipment and\noperational processes\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n\n1 Hour\n\n--- PDF PAGE 95 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n93\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-\nsolving techniques\n• Formulate clear-cut findings on the\nnature of each identified workplace\nchallenges\n• Discuss strategies on devising,\ncommunicating, implementing and\nevaluating strategies and techniques in\naddressing specific workplace\nchallenges\n\n3.4 Implement\naction\nplans and\ncommunicate\nresults\n• Identify extent and causes of specific\nchallenges in the workplace\n• Use of range of analytical problem-\nsolving techniques\n• Formulate clear-cut findings on the\nnature of each identified workplace\nchallenges\n• Discuss strategies on devising,\ncommunicating, implementing and\nevaluating strategies and techniques in\naddressing specific workplace\nchallenges\n\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 96 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n94\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n4. Work in a\ndiverse\nenvironment\n\n4.1 Develop an\nindividual’s\ncultural\nawareness\nand\nsensitivity\n• Show understanding of cultural\ndiversity in the workplace\n• Recognize norms of behavior for\ninteracting and dialogue with specific\ngroups (e. g., Muslims and other non-\nChristians, non-Catholics, tribes/ethnic\ngroups, foreigners)\n• Demonstrate different methods of\nverbal and non-verbal communication\nin a multicultural setting\n• Apply cross-cultural communication\nskills (i.e. different business customs,\nbeliefs, communication strategies)\n• Show affective skills – establishing\nrapport and empathy, understanding,\netc.\n• Demonstrate openness and flexibility\nin communication\n• Recognize diverse groups in the\nworkplace and community as defined\nby divergent culture, religion, traditions\nand practices\n\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 Hour\n\n4.2 Work\neffectively in\nan\nenvironment\nthat\nacknowledges\nand values\ncultural\ndiversity\n• Explain the value of diversity in the\neconomy and society in terms of\nWorkforce development\n• Discuss the importance of\ninclusiveness in a diverse environment\n• Discuss the importance of shared\nvision and understanding of and\ncommitment to team, departmental,\nand organizational goals and\nobjectives\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n\n1 Hour\n\n--- PDF PAGE 97 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n95\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Identify and exhibit strategies for\ncustomer service excellence\n• Demonstrate cross-cultural\ncommunication skills and active\nlistening\n• Recognize diverse groups in the\nworkplace and community as defined\nby divergent culture, religion, traditions\nand practices\n• Demonstrate collaboration skills\n• Written\nexamination\n• Role Playing\n\n4.3 Identify\ncommon\nissues in a\nmulticultural\nand diverse\nenvironment\n• Explain the value, and leverage of\ncultural diversity\n• Discuss the inclusivity and conflict\nresolution\n• Describe the workplace harassment\n• Explain the change management and\ncite ways to overcome resistance to\nchange\n• Demonstrate advanced strategies for\ncustomer service excellence\n• Address diversity-related conflicts in\nthe workplace\n• Eliminate discriminatory behavior\ntowards customers and co-workers\n• Utilize change management policies in\nthe workplace\n• Small Group\nDiscussion\n• Interactive\nLecture\n• Brainstorming\n• Demonstration\n• Role-playing\n• Demonstration or\nsimulation with oral\nquestioning\n• Group discussions\nand interactive\nactivities\n• Case studies/\nproblems involving\nworkplace diversity\nissues\n• Written\nexamination\n• Role Playing\n1 Hour\n5. Propose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\n5.1 Assess work\nprocedures,\nprocesses\nand systems\nin terms of\ninnovative\npractices\n\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\nconcepts and trans theoretical model of\nbehavior change)\n\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n1 Hour\n\n--- PDF PAGE 98 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n96\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n\n5.2 Generate\npractical action\nplans for\nimproving work\nprocedures,\nprocesses\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\nconcepts and transtheoretical model of\nbehavior change)\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n• Set up action plans on how to apply\ninnovative procedures in the\norganization\n• Set up action plans on how to apply\ninnovative procedures in the\norganization\n• Generate practical insights on how to\nimprove organizational procedures,\nprocesses and systems\n\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n--- PDF PAGE 99 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n97\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n5.3 Evaluate the\neffectiveness\nof the\nproposed\naction plans\n• Show mastery of the following practical\nconcepts (e.g., 7 habits of highly\neffective people, character strengths\nthat foster learning and innovation, five\nminds of the future, adaptation\nconcepts and trans theoretical model of\nbehavior change)\n• Demonstrate collaboration and\nnetworking skills\n• Show basic skills in research\n• Generate practical insights on\ncontinuous improvement\n• Interactive\nLecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological and\nbehavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and third-\nparty workplace\nreports of on-the-\njob performance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n6. Use information\nsystematically\n\n6.1 Use technical\ninformation\n• Lecture and discussion on:\n- Application in collating information\n- Procedures for inputting,\nmaintaining and archiving\ninformation\n- Guidance to people who need to\nfind and use information\n• Organizing information into a suitable\nform for reference and use\n• Classify stored information for\nidentification and retrieval\n• Operate the technical information\nsystem by using agreed procedures\n• Lecture\n• Group\nDiscussion\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written\n Examination\n• Observation\n• Presentation\n4 Hours\n\n--- PDF PAGE 100 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n98\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n6.2 Apply\ninformation\ntechnology (IT)\n• Lecture and discussion on:\n- Attributes and limitations of available\nsoftware tool\n- Procedures and work instructions for\nthe use of IT\n- Operational requirements for IT\nsystems\n- Sources and flow paths of data\n- Security systems and measures that\ncan be used\n- Methods of entering and processing\ninformation\n• Use procedures and work instructions\nfor the use of IT\n• Extract data and format reports\n• Use WWW applications\n• Lecture\n• Group\nDiscussion\n• Self-paced\nhandout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written\n Examination\n• Observation\n• Presentation\n2 Hours\n\n6.3 Edit, format and\ncheck\ninformation\n• Lecture and discussion on:\n- Basic file-handling techniques\n- Techniques in checking documents\n- Techniques in editing and formatting\n- Proof reading techniques\n• Use different techniques in checking\ndocuments\n• Edit and format information applying\ndifferent techniques\n• Proof read information applying\ndifferent techniques\n• Lecture\n• Group\nDiscussion\n• Self-paced\nhandout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written\n Examination\n• Observation\n• Presentation\n2 Hours\n7. Evaluate\nOccupational\nSafety And\nHealth Work\nPractices\n7.1 Interpret\nOccupational\nSafety and\nHealth practices\n\n• Discuss the OSH standards, principles\nand legislations\n• Identify OSH work practices issues\n• Discuss standard safety requirements\n•\nLecture\n•\nGroup\nDiscussion\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\n\n 2 Hours\n\n--- PDF PAGE 101 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n99\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n7.2 Set OSH work\ntargets\n• Discussion in actions plans that are\nnecessary in achieving the OSH target\n• Lecture\n• Group\nDiscus