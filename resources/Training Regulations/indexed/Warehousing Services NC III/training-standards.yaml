ing\nrequirements\n•\nStock Keeping Unit and its\nsignificance\n•\nFactors to consider in\nallocating warehouse areas to\ndifferent stocks\n•\nStock locator system\no Concepts and Importance\no Uses\no Different warehouse\nlocations\no How to assign bin locations\nusing stock locator system\no Different warehouse\nsignages and visual cues\no Stock rotation\n•\nInventory Management\n/Warehouse Management\nSystem\n•\nWarehouse Material handling\nequipment and its uses\n•\nBarcode scanning\n•\nGood Housekeeping\n• Lecture / Discussion\n• Demonstration\n• Video Presentation\n• Visual Presentation\n\n• Written\nExamination\n• Oral Examination\n• Demonstration\n\n4 hrs.\n\n--- PDF PAGE 118 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n116\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nGood Warehousing Practices\n•\n5S (Seiri, Seiton, Seiketsu,\nSeiso and Shitsuke)\n\nDemonstrate the ability to:\n1. Classify stocks and assign bin\nlocations\n2.Identify storage requirements for\ndifferent stocks\n3.Explain the importance of inventory\nmanagement / warehouse\nmanagement\n4.Prepare a checklist of good\nwarehousing practices\n5.Give examples of 5S applications in\nthe warehouse\n\n2.2 Inspect quality of\nstored stocks\nDiscuss:\n•\nWorkplace quality standards\n•\nWarehouse inspection checklist\n•\nDamaged stocks /Stocks for\ndisposal\no Reasons\no Inventory take up\no Proper disposal\n\nDemonstrate the ability to:\n1. Explain acceptable stocks quality\n standards\n2. Discuss visual inspection checklist\n3. Inspect and recommend disposition\n on damaged stocks.\n\n• Lecture / Discussion\n• Visual Presentation\n• Video Presentation\n\n• Written\nExamination\n• Oral Examination\n• Demonstration\n\n4 hrs.\n\n--- PDF PAGE 119 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n117\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodology\