  "source_text": "GLOSSARY OF TERMS:\n\nAir Waybill\n\nBarcode\n\nCertificate of\nCompliance\n\nCertificate of\nOrigin\nIt is a receipt issued by an international airline for goods and an evidence of the\ncontract of carriage that allows it to be tracked. It is not a document of title to the\ngoods hence it is a non-negotiable instrument\n\nIt is an optical machine-readable representation of data relating to the object to\nwhich it is attached. It is a small image of lines (bars) and spaces that is affixed to\nstore items identification cards, and etc. to identify a particular product number,\nperson, or location.\n\nA document certified by a competent authority that the supplied good or service\nmeets the required specification.\n\nIt is an important international trade document attesting that goods in a particular\nexport shipment are wholly obtained, produced, manufactured or processed in a\nparticular country\n\nConsignee\nIs the entity or person who is responsible for the receipt of a shipment. Generally,\nbut not always, the consignee is the same as the receiver or the buyer.\n\nDelivery Waiver\n\nDemurrage\nA permission for claiming goods or merchandise in the absence of the consignee\nor the rightful person\n\nIt refers to charges that shall be imposed when customers have exceeded the\nstandard free time allowed for taking delivery of a shipment from the shipping or\ntransporting company’s warehouse\n\nErgonomics\nIt is the scientific discipline concerned with the understanding of interactions among\nhumans and other elements of a system, and the\nprofession that applies theory, principles, data and methods to\ndesign in order to optimize human well-being and overall system\nperformance\n\nForklift\n\n It is a powered industrial truck (usually engine, hydraulics or electricity used to lift\nand move materials in short distances\n\nInventory\n\nLay-out\nThe total amount of goods and/or materials contained in a warehouse, store or\nfactory at any given time.\n\nIt is the manner in which parts of the warehouse are arranged or laid-out\n\nLift truck\nVehicles used to lift, move, stack, rack, or otherwise manipulate loads.\n\n--- PDF PAGE 136 ---\nWarehousing NC III Promulgated (12/17/2019) 134\nLoad\nDescribes the materials being handled by a piece of equipment.\n\nLoad Leading\nA condition of pallet truck operation where the forks with the load leading on travel\nand the steering wheels behind\n\nLoading Dock\nAlso called loading bay is an area of a warehouse building where goods vehicles\n(usually road or rail) are loaded and unloaded.\n\nLogistics Provider\nA company that provides management over the flow of goods and materials\nbetween points of origin to end-use destination. The provider will often handle\nshipping, inventory, warehousing, packaging and security functions for shipments.\n\nNegotiation\nDiscussion aimed at reaching an agreement.\n\nOrder\nA request by one party to another to make, supply, deliver, transfer or receive\ngoods and services.\n\nOrder Fulfillment\nUsed to describe the act of distribution or the logistics function, however, in the\nbroader sense it refers to the way firms respond to customer orders.\n\nPacking List\n\nPallet\nIt is a document that includes details about the contents of a package to allow\ntransport agencies, government authorities and customers know the contents\n\nA portable platform designed to allow a forklift or pallet jack to lift, move, and store\nvarious loads\n\nPallet Loader\nA warehousing or manufacturing equipment designed to lift and move load on a\npallet\n\nPallet Truck\nIt is an equipment used to lift and move pallets are either manually operated or\npowered by means of electricity and hydraulics\n\nPhysical Inventory\nCount Window\nAllows many different methods of creating count lists, verifying and updating\ninventory counts.\n\nPalletizing Scheme\n\nCreate a number of alternative palletization patterns or arrangement which\nensures cargo stability, taking into account pallet and box volumes.\n\nPick List\nIt is a document that is often used to pull particular items in specific quantities\nfrom an inventory\n\nPre-Operational\nChecks\nVisual and physical checks made before operating any pallet jacks/trucks to\nidentify damage, prevent accidents and to ensure the forklift is safe to use\n\nPurchase Order\n\nA document used to approve, track, and process purchased items\n\nReconciliation\n\nShelf Life\nIt is a process where a company balances its physical inventory with the figures in\nits accounting books.\n\nShort landed\nA condition where the manifested schedule of delivery does not actually arrive on\ntime.\n\nStacking\n\nAn orderly pile of stocks/goods, especially one arranged in layers.\n\n--- PDF PAGE 137 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n135\nStock Locator\nSystem\nA system with the capability of tracking supplies and inventory during transport\nand storage.\n\nStock Take or\nInventory Count\n\nTransport-Route\nplanning\n\nWarehouse Facility\n\nWork-in-Process\n\nIs the physical verification of the quantities and condition of items held in an\ninventory or warehouse. This may be done to provide an audit of existing stock\nvaluation. It is also the source of stock discrepancy information.\n\nIt is a process to plan for the most cost-effective route by minimizing the distance\ntraveled and time taken in the delivery process\n\nA facility where raw materials and manufactured goods materials are stored\nbefore distribution.\n\nPart of manufacturer’s inventory that has not yet been completed and transferred\nas finished goods inventory\n\n--- PDF PAGE 138 ---\nWarehousing NC III Promulgated (12/17/2019) 136\n",
