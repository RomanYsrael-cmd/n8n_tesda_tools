  "source_text": "SECTION 4 ASSESSSMENTAND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an individual\ncan perform the workplace requirements based on the relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1\nThe full National Qualification of WAREHOUSING SERVICES NC III shall be obtained\nwhen a candidate demonstrates competence in all units of competency listed in Section\n1. A successful candidate shall be awarded a National Certificate signed by the TESDA\nDirector General.\n\n4.1.2\nAssessment shall focus on the core units of competency. The basic and common units\nare assessed concurrently with the core units.\n\n4.1.3\nRecognition of Prior Learning (RPL). Candidates who have gained competencies\nthrough education, informal training, and work or life experiences may apply for\nrecognition in a particular qualification through competency assessment.\n\n4.1.4\nThe following are qualified to apply for assessment for certification for WAREHOUSING\nSERVICES NC III:\n4.1.4.1 Graduating students/trainees of with Training Regulation (WTR)-registered\nprograms, graduates of No-Training Regulation (NTR) programs or graduates\nof formal/non-formal/informal including enterprise based training programs\nrelated to warehousing services Industry workers in warehousing operations.\n\n4.1.4.2\nExperienced workers in warehousing and logistics\n\n4.1.5 Re-assessment shall focus only on the specific areas/where the candidate has not\nsatisfactorily achieved the required level of competence AND must be undertaken\nwithin two (2) months during the period of validity of the Training Regulations\n\n4.1.6 A candidate who fails the assessment for two (2) consecutive times shall be advised to\ngo through a refresher course (on failed competencies) before taking another\nassessment.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the\ncandidate prior to actual competency assessment. SAG is a pre-assessment tool to\nhelp the candidate and the assessor determine what evidence is available, where gaps\nexists, including readiness for assessment.\n\n This document can:\n\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence that\nneeds to be presented\nd) Assist the candidate to identify key areas in which practice is needed or additional\ninformation or skills that should be gained prior to assessment.\n\n--- PDF PAGE 132 ---\nWarehousing NC III Promulgated (12/17/2019) 130\n4.2.2 Accredited Assessment Center. Only a TESDA-accredited assessment center is\nauthorized to conduct competency assessment. The center has to undergo a quality\nassured procedure for accreditation before it is authorized by TESDA to manage the\nassessment for National Certification. It shall enter into a Memorandum of Agreement\nwith a company that has warehousing facility and other requirements that maybe\ndeemed necessary in the conduct of assessment.\n\n4.2.3 Accredited Competency Assessor. Only an accredited competency assessor is\nauthorized to conduct assessment of competence. A competency assessor undergoes\na quality assured system of accreditation procedure before being authorized by TESDA\nto assess the competencies of candidates for National Certification.\n\n4.2.3.1. Qualification of Competency Assessors\n\nFor Trainer-Assessor\n•\nHolder of National TVET Trainer Certificate Level 1 (NTTC) on\nWarehousing Services NC III with at least three (3) years work experience\nin warehousing/logistics industry.\n•\nKnowledgeable in Inventory Management / Warehouse Management\nSystem\n•\nHave assisted in the actual conduct of assessment to at least two (2)\ncandidates.\n\nFor Industry Assessor\n•\nHolder of National Certificate in Warehousing Services NC III\n•\nHolder of Certificate of Competency (COC) in Conduct Competency\nAssessment under the Trainers Methodology Level 1 (TM 1\n•\nHave at least three (3) years work experience in warehousing/logistics\nindustry\n•\nKnowledgeable in Inventory Management / Warehouse Management\nSystem\n•\nHave assisted in the actual conduct of assessment to at least two (2)\ncandidates\n\n--- PDF PAGE 133 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n131\n"
