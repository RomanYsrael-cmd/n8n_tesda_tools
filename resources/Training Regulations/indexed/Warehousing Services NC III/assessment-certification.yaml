ldg., North Reclamation Area,Mandaue City Renz Lauren T. Estacio ADSIA Logistics Inc IE/Depot Supervisor Loreto M. Ibay ADSIA Logistics Inc Manager Head Office :Blk 3 Lot 3A Washington Rd Cebu Light Industrial Park Basak,Lapu-lapu City Ma. Rosario P. Sacueza LF Logistics Inc Asst. III Operation Leah B. Dela Paz LF Logistics Inc Operator II-TMS Imelda D. Parco LF Logistics Inc IC Teamleader Head Office :18th Floor ,One Corporate Centre Dona Julia Vargas cor. Meralco Ave.Ortigas Center, Pasig City Mark Anthony B. Jaramilla Fast Logistics Corp Inventory Analyst Ryan L. Lambio Fast Logistics Corp Customer Relations Officer Michelle F. Caudal Fast Logistics Corp Transport Dispatcher Rapunzel B. Aguinaldo Fast Logistics Corp Outbound Encoder Cora M. Castillo Fast Logistics Corp --- PDF PAGE 143 --- TESDA-SOP-QSO-01-F08 Warehousing NC III Promulgated (12/17/2019) 141 Head Office :FMW Bldg. 235 Alabang-Zapote Rd Tierra-Nueva Subd., Muntinlupa City Raymond Oliver A. Morfe Nestle Phils. Lead Education and Training for Supply Chain Mgmt. Head Office :31 Plaza Drive Rockwell Center, Makati City Enrico T. Dela Cruz Unilab Senior Warehouseman I Head Office: 66 United St.Mandaluyong City Angelo R. Elnas Zuellig Pharma Inventory Controller Km. 14, West Service Rd., South Superhighway, Corner Edison Ave. Sun Valley Paranaque City Benjamin L. Jara Gliese Inc. Sales and Marketing Rep Head Office :5th Floor King's Court I Chino Roces Ave.,Makati Members of the TESDA Board The MANAGEMENT and STAFF of the TESDA Secretariat • Qualifications and Standards Office"
