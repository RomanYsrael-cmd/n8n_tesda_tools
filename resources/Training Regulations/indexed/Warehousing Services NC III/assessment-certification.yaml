      "text": "A successful candidate shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 Assessment shall focus on the core units of competency. The basic and common units are assessed concurrently with the core units. 4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, and work or life experiences may apply for recognition in a particular qualification through competency assessment. 4.1.4 The following are qualified to apply for assessment for certification for WAREHOUSING SERVICES NC III: 4.1.4.1 Graduating students/trainees of with Training Regulation (WTR)-registered programs, graduates of No-Training Regulation (NTR) programs or graduates of formal/non-formal/informal including enterprise based training programs related to warehousing services Industry workers in warehousing operations. 4.1.4.2 Experienced workers in warehousing and logistics 4.1.5 Re-assessment shall focus only on the specific areas/where the candidate has not satisfactorily achieved the required level of competence AND must be undertaken within two (2) months during the period of validity of the Training Regulations 4.1.6 A candidate who fails the assessment for two (2) consecutive times shall be advised to go through a refresher course (on failed competencies) before taking another assessment."
