    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exists, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that needs to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment. Warehousing NC III Promulgated (12/17/2019) 130 4.2.2 Accredited Assessment Center. Only a TESDA-accredited assessment center is authorized to conduct competency assessment. The center has to undergo a quality assured procedure for accreditation before it is authorized by TESDA to manage the assessment for National Certification. It shall enter into a Memorandum of Agreement with a company that has warehousing facility and other requirements that maybe deemed necessary in the conduct of assessment. 4.2.3 Accredited Competency Assessor. Only an accredited competency assessor is authorized to conduct assessment of competence. A competency assessor undergoes a quality assured system of accreditation procedure before being authorized by TESDA to assess the competencies of candidates for National Certification. 4.2.3.1. Qualification of Competency Assessors For Trainer-Assessor • Holder of National TVET Trainer Certificate Level 1 (NTTC) on Warehousing Services NC III with at least three (3) years work experience in warehousing/logistics industry. • Knowledgeable in Inventory Management / Warehouse Management System • Have assisted in the actual conduct of assessment to at least two (2) candidates. For Industry Assessor • Holder of National Certificate in Warehousing Services NC III • Holder of Certificate of Competency (COC) in Conduct Competency Assessment under the Trainers Methodology Level 1 (TM 1 • Have at least three (3) years work experience in warehousing/logistics industry • Knowledgeable in Inventory Management / Warehouse Management System • Have assisted in the actual conduct of assessment to at least two (2) candidates TESDA-SOP-QSO-01-F08 Warehousing NC III Promulgated (12/17/2019)"
    }
