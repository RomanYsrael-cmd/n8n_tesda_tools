      "text": "3.1. Qualification of Competency Assessors For Trainer-Assessor • Holder of National TVET Trainer Certificate Level 1 (NTTC) on Warehousing Services NC III with at least three (3) years work experience in warehousing/logistics industry. • Knowledgeable in Inventory Management / Warehouse Management System • Have assisted in the actual conduct of assessment to at least two (2) candidates. For Industry Assessor • Holder of National Certificate in Warehousing Services NC III • Holder of Certificate of Competency (COC) in Conduct Competency Assessment under the Trainers Methodology Level 1 (TM 1 • Have at least three (3) years work experience in warehousing/logistics industry • Knowledgeable in Inventory Management / Warehouse Management System • Have assisted in the actual conduct of assessment to at least two (2) candidates --- PDF PAGE 133 --- TESDA-SOP-QSO-01-F08 Warehousing NC III Promulgated (12/17/2019) 131 COMPETENCY MAP – WAREHOUSING SERVICES NC III (LOGISTICS AND TRANSPORT SECTOR) Lead workplace communication Lead small teams Apply critical thinking and problem- solving techniques in the workplace Work in a diverse environment Propose methods of applying learning and innovation in the organization Use information systematically Evaluate occupational safety and health work practices Evaluate environmental work practices Facilitate entrepreneurial skills for micro- small-medium enterprises (MSMEs) Apply workplace procedures in warehousing operations Perform industry calculations in warehousing operations Ensure security of stocks and cargo Provide efficient customer service Contribute to quality systems Comply with workplace procedures in handling stocks Maintain warehouse records --- PDF PAGE 134 --- Warehousing NC III Promulgated (12/17/2019) 132 Complete receipt/ dispatch documentation Identify and inspect stored stocks Maintain transport/stock records Participate in stock inventory count Render excellent customer service --- PDF PAGE 135 --- TESDA-SOP-QSO-01-F08 Warehousing NC III Promulgated (12/17/2019) 133 GLOSSARY OF TERMS: Air Waybill Barcode Certificate of Compliance Certificate of Origin It is a receipt issued by an international airline for goods and an evidence of the contract of carriage that allows it to be tracked. It is not a document of title to the goods hence it is a non-negotiable instrument It is an optical machine-readable representation of data relating to the object to which it is attached. It is a small image of lines (bars) and spaces that is affixed to store items identification cards, and etc. to identify a particular product number, person, or location. A document certified by a competent authority that the supplied good or service meets the required specification. It is an important international trade document attesting that goods in a particular export shipment are wholly obtained, produced, manufactured or processed in a particular country Consignee Is the entity or person who is responsible for the receipt of a shipment. Generally, but not always, the consignee is the same as the receiver or the buyer. Delivery Waiver Demurrage A permission for claiming goods or merchandise in the absence of the consignee or the rightful person It refers to charges that shall be imposed when customers have exceeded the standard free time allowed for taking delivery of a shipment from the shipping or transporting company’s warehouse Ergonomics It is the scientific discipline concerned with the understanding of interactions among humans and other elements of a system, and the profession that applies theory, principles, data and methods to design in order to optimize human well-being and overall system performance Forklift It is a powered industrial truck (usually engine, hydraulics or electricity used to lift and move materials in short distances Inventory Lay-out The total amount of goods and/or materials contained in a warehouse, store or factory at any given time. It is the manner in which parts of the warehouse are arranged or laid-out Lift truck Vehicles used to lift, move, stack, rack, or otherwise manipulate loads. --- PDF PAGE 136 --- Warehousing NC III Promulgated (12/17/2019) 134 Load Describes the materials being handled by a piece of equipment. Load Leading A condition of pallet truck operation where the forks with the load leading on travel and the steering wheels behind Loading Dock Also called loading bay is an area of a warehouse building where goods vehicles (usually road or rail) are loaded and unloaded. Logistics Provider A company that provides management over the flow of goods and materials between points of origin to end-use destination. The provider will often handle shipping, inventory, warehousing, packaging and security functions for shipments. Negotiation Discussion aimed at reaching an agreement. Order A request by one party to another to make, supply, deliver, transfer or receive goods and services. Order Fulfillment Used to describe the act of distribution or the logistics function, however, in the broader sense it refers to the way firms respond to customer orders. Packing List Pallet It is a document that includes details about the contents of a package to allow transport agencies, government authorities and customers know the contents A portable platform designed to allow a forklift or pallet jack to lift, move, and store various loads Pallet Loader A warehousing or manufacturing equipment designed to lift and move load on a pallet Pallet Truck It is an equipment used to lift and move pallets are either manually operated or powered by means of electricity and hydraulics Physical Inventory Count Window Allows many different methods of creating count lists, verifying and updating inventory counts. Palletizing Scheme Create a number of alternative palletization patterns or arrangement which ensures cargo stability, taking into account pallet and box volumes. Pick List It is a document that is often used to pull particular items in specific quantities from an inventory Pre-Operational Checks Visual and physical checks made before operating any pallet jacks/trucks to identify damage, prevent accidents and to ensure the forklift is safe to use Purchase Order A document used to approve, track, and process purchased items Reconciliation Shelf Life It is a process where a company balances its physical inventory with the figures in its accounting books. Short landed A condition where the manifested schedule of delivery does not actually arrive on time. Stacking An orderly pile of stocks/goods, especially one arranged in layers. --- PDF PAGE 137 --- TESDA-SOP-QSO-01-F08 Warehousing NC III Promulgated (12/17/2019) 135 Stock Locator System A system with the capability of tracking supplies and inventory during transport and storage. Stock Take or Inventory Count Transport-Route planning Warehouse Facility Work-in-Process Is the physical verification of the quantities and condition of items held in an inventory or warehouse. This may be done to provide an audit of existing stock valuation. It is also the source of stock discrepancy information. It is a process to plan for the most cost-effective route by minimizing the distance traveled and time taken in the delivery process A facility where raw materials and manufactured goods materials are stored before distribution. Part of manufacturer’s inventory that has not yet been completed and transferred as finished goods inventory --- PDF PAGE 138 --- Warehousing NC III Promulgated (12/17/2019) 136 ACRONYMS: ASN Advanced Shipping Notice – It is a document that provides detailed information about pending delivery. It is to notify a customer when shipping occurs and provide physical characteristics about the shipment so the customer can be prepared to accept the delivery BOL Bill Of Lading- is a document issued by a carrier which details a shipment of merchandise and gives title of that shipment to a specified party. DOLE – OSHS Department of Labor and Employment – Occupational Safety and Health Standards. ETA ETD Estimated Time of Arrival- refers to the expected or projected time of arrival of either person, goods and/or services to a particular place or destination Estimated Time of Departure.-refers to the expected or projected time of departure of either person, goods and/or services to a particular place or destination First In, First Out -. It is an accounting method of costing inventory. It values items withdrawn from inventory at the cost of the oldest items assumed to remain in inventory. It is based on the assumption that the first goods purchased are also the first goods sold. GMP Good Manufacturing Practices - It describes a set of principles and procedures to ensure that products are consistently produced and controlled according to quality standards. GHK Good Housekeeping - It is an on-going process aimed to eliminate some workplace hazards and help get a job done easily and properly. A good housekeeping program plans and manages the orderly storage and movement of materials from point of entry to exit. GPS Global Positioning System - It is a space-based navigation system that provides location and time information in all weather conditions, anywhere. IM Inventory Management - It is the process of efficiently overseeing and controlling the constant flow of units in an existing inventory Inventory Management-Warehouse Management - It is a software application that supports the day-to-day operations in a warehouse to enable centralized management of tasks such as tracking inventory levels and stock locations KPI Key Performance Indicator - It is a measurable value that demonstrates how effectively a company is achieving key business objectives. Organizations use KPIs at multiple levels to evaluate their success at reaching targets. --- PDF PAGE 139 --- TESDA-SOP-QSO-01-F08 Warehousing NC III Promulgated (12/17/2019) 137 Last In, First Out - It is an accounting method of costing inventory. It values items withdrawn from inventory at the cost of the newest items assumed to remain in inventory based on the assumption that the last goods purchased are also the first goods sold. It may also refer to a policy of.issuing first what has arrived last Radio Frequency Identification – It refers to small electronic devise that consists of a small chip and antenna. It serves the same purpose as a bar code of a magnetic strip which provides a unique identifier for an object .RFID device must be scanned to retrieve the identifying information SKU Stock Keeping Unit - It is an identification code, usually alphanumeric, of a particular product that allows it to be tracked for inventory purposes. SOP Standard Operating Procedures - These are written instructions intended to document how to perform a routine activity to ensure consistency and quality in the products. WMS Warehouse Management System - It is a software application that supports the day-to-day operations in a warehouse. It enables centralized management of tasks such as tracking inventory levels and stock locations. 5S Seiri, Seiton, Seiso, Seiketsu and Shitsuke - It is a systematic and methodical approach allowing teams to organize their workplace in the safest and most efficient manner. It engages the people through the use of “standards” and “discipline”. --- PDF PAGE 140 --- Warehousing NC III Promulgated (12/17/2019) 138 TRAINING REGULATIONS (TR) Qualification Title: Warehousing Services NC III Qualification Code: LOGWHS319 Revision No. Document Description Types* Replaces Version (TESDA Board Resolution No./ Date) New Version (TESDA Board Resolution No./ Date) Deployment (TESDA Circular/ Implementing Guidelines) 00 Document Created Warehousing Services NC III 2019-73/ Dec 17, 2019 01 Legend: *Description Types - Document Created - Document Amended --- PDF PAGE 141 --- TESDA-SOP-QSO-01-F08 Warehousing NC III Promulgated (12/17/2019) 139 The Technical Education and Skills Development Authority (TESDA) wishes to ex