cal inquiry is \napplied and used \nto facilitate \ndiscourse on \nadjustments in the \nsimple work \nprocedures, \nprocesses and \nsystems. \n2.1 Seven habits of \nhighly effective \npeople. \n2.2 Character \nstrengths that \nfoster innovation \nand learning \n(Christopher \nPeterson and \nMartin Seligman, \n2004) \n2.3 Five minds of the \nfuture concepts \n(Gardner, 2007). \n2.4 Adaptation \nconcepts in \nneuroscience \n(Merzenich, 2013). \n2.5 Transtheoretical \nmodel of behavior \nchange \n(Prochaska, \nDiClemente, & \nNorcross, 1992). \n2.1 Assessing readiness \nfor change on \nsimple work \nprocedures, \nprocesses and \nsystems. \n2.2 Generating insights \non how to improve \norganizational \nprocedures, \nprocesses and \nsystems through \ninnovation. \n2.3 Facilitating action \nplans on how to \napply innovative \nprocedures in the \norganization.\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n23 \n \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Evaluate the \neffectiveness of \nthe proposed \naction plans \n3.1 Work structure is \nanalyzed to \nidentify the \nimpact of the \nnew work \nprocedures  \n3.2 Co-workers/key \npersonnel is \nconsulted to \nknow who will be \ninvolved with or \naffected by the \nwork procedure \n3.3 Work instruction \noperational plan \nof the new work \nprocedure is \ndeveloped and \nevaluated. \n3.4 Feedback and \nsuggestion are \nrecorded. \n3.5 Operational plan \nis updated. \n3.6 Results and \nimpact on the \ndeveloped work \ninstructions are \nreviewed \n3.7 Results of the \nnew work \nprocedure are \nevaluated \n3.8 Adjustments are \nrecommended \nbased on results \ngathered \n3.1 \nFive minds of the \nfuture concepts \n(Gardner, 2007). \n3.2 \nAdaptation \nconcepts in \nneuroscience \n(Merzenich, \n2013). \n3.3 \nTranstheoretical \nmodel of behavior \nchange \n(Prochaska, \nDiClemente, & \nNorcross, 1992). \n3.1 Generating \ninsights on how to \nimprove \norganizational \nprocedures, \nprocesses and \nsystems through \ninnovation. \n3.2 Facilitating action \nplans on how to \napply innovative \nprocedures in the \norganization. \n3.3 Communicating \nresults of the \nevaluation of the \nproposed and \nimplemented \nchanges in the \nworkplace \nprocedures and \nsystems. \n3.4 Developing action \nplans for \ncontinuous \nimprovement on \nthe basic systems, \nprocesses and \nprocedures in the \norganization.\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n24 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nReasons \nMay include but not limited to: \n1.1 Strengths and weaknesses of the current systems, processes \nand procedures. \n1.2 Opportunities and threats of the current systems, processes \nand procedures. \n2. \nModels of innovation \nMay include but not limited to: \n2.1 Seven habits of highly effective people. \n2.2 Five minds of the future concepts (Gardner, 2007). \n2.3 Neuroplasticity and adaptation strategies. \n3. \nGaps or barriers \nMay include but not limited to: \n3.1 Machine \n3.2 Manpower \n3.3 Methods \n3.4 Money \n4. \nCritical Inquiry \nMay include but not limited to: \n4.1 \nPreparation. \n4.2 \nDiscussion. \n4.3 \nClarification of goals. \n4.4 \nNegotiate towards a Win-Win outcome. \n4.5 \nAgreement. \n4.6 \nImplementation of a course of action. \n4.7 \nEffective verbal communication. See our pages: Verbal \nCommunication and Effective Speaking. \n4.8 \nListening. \n4.9 \nReducing misunderstandings is a key part of effective \nnegotiation. \n4.10 \nRapport Building. \n4.11 \nProblem Solving. \n4.12 \nDecision Making. \n4.13 \nAssertiveness. \n4.14 \nDealing with Difficult Situations.\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n25"
