          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Processed transport / stock documentation correctly to meet\nlocal and foreign government requirements as well as proper\ncollection standards\n1.2 Monitored transport/stock movements\n1.3 Organized records\n\n2. Resource Implications\n\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2 Work instructions and Manuals\n2.3 Standard Operating Procedures\n2.4 Internet\n2.5 Computer and appropriate warehouse management system\n\n3. Methods of Assessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Observation\n3.3 Oral Examination\n3.4 Demonstration with questioning\n\n4.Context of Assessment\n\n4.1 Competency maybe assessed in actual workplace or at\nthe designated TESDA accredited Assessment Center.\n\n--- PDF PAGE 79 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n77\nUNIT OF COMPETENCY:\nPARTICIPATE IN STOCK INVENTORY COUNT\n\nUNIT CODE :"
        },
        "source_text": "LOG432309\n\nUNIT DESCRIPTOR :\nThis unit involves the industry knowledge, technical skills\nrequired to maintain transport/stock records in accordance with\nworkplace requirements and relevant regulations within the\ntransport and logistics industry.\n\nIt includes processing transport/stock documentation, monitoring\ntransport/stock movements and maintaining records.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Process\ntransport / stock\ndocumentation\n\n1.1. Transport /stock\ndocuments are\nidentified in\naccordance with\nworkplace\ndocumentation\nrequirements.\n1.2. Transport\ndocuments are\nprocessed according\nto transport type and\nmode, valuation and\nvolume of stocks.\n1.3. Stocks movements are\ndocumented in\ncompliance with local\nand foreign\ngovernment and\nregulatory\nrequirements\n1.4. Customs taxes and\nduties as well as other\nshipping charges are\npaid.\n1.5. Internal and external\nstakeholders are\ngiven copies of the\nappropriate\ndocuments.\n\n1.1 Transport / stock\n documents\n1.2 Customer\n Service\n1.3 Different\n transport\n type\n1.4 Valuation of\n stocks\n1.5 Standard\n Operating\n Procedures\n (SOP)\n1.6 Workplace\n transport / stock\n documentation\n requirements\n1.7 Local and foreign\n government and\n regulatory\n requirements on\n Transport and\n Logistics\n1.8 Customs taxes\n and duties\n1.9 Shipping Charges\n1.10 Transport and\nroute planning\n1.11 Internal and\n external\n stakeholders of\n transport / stock\n documents\n1.1 Processing\n transport / stock\n documentation\n1.2 Documenting\n stock movements\n1.3 Working\n collaboratively\n with others\n1.4 Exercising good\n judgment\n1.5 Rendering\n excellent\n customer\n service\n1.6 Computing for\n customs duties\n and taxes as well\n as trucking and\n shipping charges\n1.7 Operating\n computer\n\n2. Monitor\ntransport/stock\nmovements\n\n2.1 Transport\nmovements /stocks\nare recorded,\nupdated and\nmonitored in\naccordance with\n2.1 Transport / stock\ndocuments\n2.2 Workplace\ntransport / stock\ndocumentation\nrequirements\n2.1\nKeeping track\nof transport /\nstock in transit\n2.2\nAddressing\ntransport /\nstocks issues\n\n--- PDF PAGE 75 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n73\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nworkplace\nprocedures and any\nregulatory\nrequirements\n2.2 Log cards on\ntransport /stock with\ncontrolled systems\nare checked\n2.3 Transport /stock\nissues encountered\nduring in transit are\npromptly reported\nand acted upon\n2.4 Return of stock\nreceipt / dispatch\ndocuments are\nmonitored and\nchecked in\naccordance with\nworkplace\nprocedures.\n2.3 Local and foreign\ngovernment and\nregulatory\nrequirements on\nTransport and\nLogistics\n2.4 Log cards\n\n2.3\nWorking\ncollaboratively\nwith others\n2.4\nExercising\ngood judgment\n2.5\nRendering\nexcellent\ncustomer\nservice\n2.6\nAccounting for\nthe return of\nstock receipt/\nstock issue\ndocuments\n3. Organize\ntransport/stock\nrecords\n3.1 Filing system is\nidentified in\naccordance with\nworkplace procedures\n3.2 Document\n handling, storage, and\nretrieval is\nimplemented based on\ndocument control\npolicy\n3.3 Document retention\nand disposal is based\non workplace and\ngovernment regulatory\nrequirement\n3.1 Document control\n policy\n3.2 Government and\n regulatory\n requirements\n3.3 Document filing\n and retrieval\n system\n3.4 Document storage\n and retention\n3.5 5s (Seiri, Seiton,\n Seiketsu,Seiso\n Shitsuke\n\n3.1 Organizing\n records\n3.2 Filing and\nmaintaining\ndocuments\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Transport/Stock\nDocuments\nMay include:\n1.1 Gate Pass\n1.2 Trip Ticket\n1.3 Proof of Delivery\n1.3.1 Commercial Invoice\n1.3.2 Delivery Receipt\n1.3.3 Counter Receipt\n1.4 Packing List\n\n--- PDF PAGE 76 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n74\nVARIABLE\nRANGE\n1.5 Bill of Lading\n1.6 Air /Sea Waybill\n1.7 Shipping and Container Manifest\n1.8 Letter of Credit\n1.9 Collection Documents\n1.10 Stock Receipt Form\n1.11 Advance Shipping Notice (ASN)\n\n2. Transport Documents\nMay include:\n2.1 Certificate of Origin\n2.2 Material Safety Data Sheet\n2.3 Certificate of Compliance\n2.4 Certificate of Analysis\n2.5 Inspection Certification\n2.6 Insurance Certificate\n2.7 Import / Export License\n\n3. Transport Type and Mode\nMay include:\n3.1 Transport Mode\n3.1.1 Land\n3.1.2 Sea\n3.1.3 Air\n3.1.4 Rail\n3.1.5 Pipeline\n3.2 Transport Type\n3.2.1 Loose\n3.2.2 Break-bulk\n3.2.3 Containerized\n3.2.4. Palletized\n3.2.5 Refrigerated.\n\n4. Valuation and Volume of\nStocks\nMay include:\n4.1 High value\n4.2 Net and gross weights and volume measurements\n\n5. Local and foreign\ngovernment and regulatory\nrequirements\nMay include:\n5.1 Dangerous Drugs Board requirements\n5.2 Food and Drug Administration regulations\n5.3 Source and receiving country regulatory requirements\n5.4 Department of Environment and Natural Resources\nregulations\n5.5 Occupational Safety and Health Standards\n5.6 National Meat Inspection Certificate\n\n6. Shipping Charges\nMay include:\n6.1 Insurance /Surety bonds\n6.2 Demurrage/ Storage fee\n6.3 Freight Charges\n6.4 Documentary stamps\n6.5 Customs duties and taxes\n6.6 Packaging charges\n6.7 Auxiliary charges\n6.8 Re-delivery charges\n6.9 Detention charges\n\n--- PDF PAGE 77 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n75\nVARIABLE\nRANGE\n7. Internal and External\nStakeholders\nMay include:\n7.1 Company Departments\n7.2 Third Party Service Providers\n7.2.1\nBrokers\n7.2.2\nShipping Lines\n7.2.3\nFreight Forwarders\n7.2.4\nInsurance Companies\n7.2.5\nClaim Adjusters\n7.3 4th Party Logistics Providers\n7.4 Customer\n8. Controlled Systems\nMay include:\n8.1 Humidity\n8.2 Temperature\n8.3 Flammability\n8.4 Regulated\n9. Transport /Stock Issues\nMay include:\n9.1 Losses\n9.2 Damage\n9.3 Pilferage\n9.4 Hijack\n9.5 Delay\n9.5.1\nPort Congestion\n9.5.2\nIncomplete Documents\n9.5.3\nTruck Breakdown\n9.5.4\nDelayed/Cancelled flight\n9.5.5\nWeather disturbance\n9.5.6\n Additional Customs requirements\n9.5.7\nTraffic Issues\n9.5.8\nBroken seal\n9.5.9\nShort-landed/over-landed\n9.5.10 Temperature excursion\n9.5.11 Wrong shipping address\n9.5.12 Wrong pricing\n9.5.13 No cash available upon delivery\n9.5.14 Near expiry\n9.5.15 Customer issues\n9.5.16 Annual Inventory Count\n9.5.17 Flood\n9.5.18 Warehouse Congestion\n9.5.19 Truck Accident\n9.5.20 Wrong packaging by warehouse\n10. Filing System\nMay include:\n10.1 Chronological order\n10.2 Alphabetical order\n10.3 By origin\n10.4 By destination\n10.5 By customer\n10.6 By stock and/services\n10.7 By transaction type\n10.8 By service provider\n11. Document Control Policy\nMay include:\n11.1 Document storage and retrieval\n11.2 Authorized access\n11.3 Traceability\n11.4 Document retention/disposal\n\n--- PDF PAGE 78 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n76\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Processed transport / stock documentation correctly to meet\nlocal and foreign government requirements as well as proper\ncollection standards\n1.2 Monitored transport/stock movements\n1.3 Organized records\n\n2. Resource Implications\n\nThe following resources should be provided:\n2.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2 Work instructions and Manuals\n2.3 Standard Operating Procedures\n2.4 Internet\n2.5 Computer and appropriate warehouse management system\n\n3. Methods of Assessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Observation\n3.3 Oral Examination\n3.4 Demonstration with questioning\n\n4.Context of Assessment\n\n4.1 Competency maybe assessed in actual workplace or at\nthe designated TESDA accredited Assessment Center.\n\n--- PDF PAGE 79 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n77\nUNIT OF COMPETENCY:\nPARTICIPATE IN STOCK INVENTORY COUNT\n\nUNIT CODE :"
