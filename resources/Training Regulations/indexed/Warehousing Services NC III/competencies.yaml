        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1\nSecured goods and stocks in accordance with workplace\nsecurity procedures and applicable security regulations\n1.2\nChecked and maintained seals, tamper proof packaging, locks\nand other security measures on goods or cargo in accordance\nwith workplace security procedures\n1.3\nIdentified and assessed security threat or situation in\naccordance with the workplace security program and\nprocedures\n1.4\nResponded to an identified security threat or situation in\naccordance with workplace security procedures, received\ninstructions,\nregulatory\nrequirements\nand\nemergency\nresponse plan\n1.5\nHandled appropriately any security threats or incidents in\naccordance with established response plan and within limits of\nresponsibility\n\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1\nWorkplace location\n2.2\nMaterials relevant to the unit of competency\n2.3\nTechnical plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1\nWritten Test\n3.2\nDirect observation and oral questioning\n3.3\nDemonstration with questioning\n3.4\nInterview\n4. Context of\nAssessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 55 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n53\nUNIT OF COMPETENCY:\nPROVIDE EFFICIENT CUSTOMER SERVICE\n\nUNIT CODE :"
