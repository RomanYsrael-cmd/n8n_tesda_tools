          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated basic entrepreneurial skills\n1.2 Demonstrated ability to conceptualize and plan a\nmicro/small enterprise\n 1.3 Demonstrated ability to manage/operate a micro/small-\nscale business\n2. Resource\nImplications\nThe following resources should be provided:\n\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to demonstrate the\nrequired tasks\n2.3 References and manuals\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Demonstration/observation with oral questioning\n3.3 Portfolio assessment with interview\n3.4 Case problems\n4. Context of\nAssessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n42\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nAPPLY WORKPLACE PROCEDURES IN\nWAREHOUSING OPERATIONS\n\nUNIT CODE :"
