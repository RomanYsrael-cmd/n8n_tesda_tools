        "evidence_guide": {
          "source_text": "1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed calculations in accordance with workplace procedures\n1.2 Made accurate estimates to complete assigned work activities\n1.3 Recognized, interpreted and acted upon graphical information\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Test\n3.2 Direct observation and oral questioning\n3.3 Demonstration with questioning\n\n4. Context of\nAssessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n49\nUNIT OF COMPETENCY:\nENSURE SECURITY OF STOCKS AND CARGO\n\nUNIT CODE :"
