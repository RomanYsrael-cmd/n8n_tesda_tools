        "source_text": "LOG432307\nUN IT DESCRIPTOR : This unit involves the industry knowledge and technical skills\nrequired to complete receipt/dispatch documentation in accordance\nwith workplace requirements and relevant government regulations\nwithin the transport and logistics industry.\nIt includes checking, processing and finalizing of receipt and\ndispatch documents.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Check receipt\nand dispatch\ndocuments\n1.1\nStock receipt/\ndispatch documents\nare checked in\ncompliance with\nworkplace\ndocumentation\nrequirements\n\n1.2\nStock receipt/ dispatch\ndocuments are\nmatched with delivery\nrequirements\n\n1.3\nStock Locator\nSystems are used to\nidentify area for\nstorage and retrieval\nof stocks\n1.4\nReturned stocks are\nprocessed according\nto protocol\n\n1.1. Workplace\n stocks receipt and\n dispatch\n documentation\n requirements and\n its authorized\n signatories\n1.2. Government\n regulatory\n requirements on\n receipt and\n delivery of stocks\n1.3. Workplace\n procedures on\n receipt and issues\n of stocks\n1.4 Stocks\n identification and\n classification\n1.5 Stock Locator\n System\n1.6 Workplace\n procedures on\n returned stocks\n1.7 Palletizing\n Scheme\n1.8 Stock storage\n and temperature\n requirements\n1.9 Barcode\n\n1.1 Validating\n receipt documents\n1.2 Matching dispatch\n documents with\nstocks issued\n1.3 Following\n workplace\n documentation\n procedures\n1.4 Checking\n availability of\n relevant\n government and\n regulatory\n requirements\n1.5 Checking\n availability of\n workplace receipt\n documentation\n requirements\n1.6 Working\n collaboratively\n with others\n1.7 Scrutinizing\n returned stocks\n1.8 Calculating skills\n1.9 Using stock\n locator system\n1.10 Scanning\n barcode\n\n--- PDF PAGE 64 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n62\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Process receipt\nand dispatch\ndocuments\n\n2.1 Delivery requirements\nare fulfilled\n2.2\nLabels are attached in\naccordance with\nworkplace procedures\n2.3\nAppropriate\ndocuments are\nattached in\naccordance with\ngovernment\nregulatory\nrequirements\n2.4\nStock movements are\npromptly recorded in\nthe system\n2.5\nSpecial\ntransportation\nrequirements are\ninstructed to\nappropriate\npersonnel\n\n2.1 Workplace delivery\n requirements\n2.2 Customer delivery\n requirements\n2.3 Workplace\n receipt and\n dispatch\n documentation\n requirements and\n its authorized\n signatories\n2.4 Government\n regulatory\n requirements on\n receipt and\n delivery of stocks\n2.5 Workplace\n procedures on\n receipt and issues\n of stocks\n2.6 Inventory\n Management\n / Warehouse\n Management\n System\n2.7 Computation of\n volume of stocks\n2.8 Assignment of\n appropriate\n delivery units\n2.9 Trucking and\n shipping cost and\n other incremental\n costs for\n special\n requirements of\n goods and loads\n2.10 Unit of Measure\n (UOM) conversion\n2.11 Currency\n conversion\n2.12 Stock Keeping\n Unit (SKU)\n2.13 Assignment of\n delivery unit\n\n2.1 Completing\n customer\n delivery\n requirements\n2.2 Processing\n workplace\n dispatch\n documents\n2.3 Complying to\n government\n documentation\n requirements\n2.4 Exercising good\n judgment\n2.5 Operating\n computer\n2.6 Recording of\n inventory\n receipts\n and issues\n2.7 Generating labels\n2.8 Computing\n volume of stocks\n2.9 Assigning\n appropriate\n delivery units\n2.10 Computing\n trucking and\n shipping costs\n\n--- PDF PAGE 65 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n63\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.Finalize\ndocumentation\n3.1 Workplace\n documentation is\n completed in\n accordance with\n relevant government\n regulatory requirements\n\n3.2 Documents are filed in\n accordance with\n workplace requirements\n\n3.3 Documents are stored\n and retrieved in\n accordance with\n workplace policies\n\n3.1 Workplace receipt\nand dispatch\ndocumentation\nrequirements and\nits authorized\nsignatories\n3.2 Government\n regulatory\n requirements on\n receipt and\n delivery of stocks\n3.3 Workplace\n procedures on\n receipt and issues\n of stocks\n3.4 Document filing\n and retrieval\nsystem\n3.5 Document storage\n and retention\n3.6 5s (Seiri, Seiton,\nSeiketsu,Seiso\nShitsuke)\n\n3.1 Transmitting\n appropriate\n receipts\n documents to\n Finance\n Department for\n processing of\n payments\n3.2 Dispatching\n complete\n delivery\n documents to\n service providers\n3.3 Practicing 5S\n3.4 Filing and storing\n of documents\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Stock receipt/dispatch\ndocuments\nMay include:\n1.1 Sales Invoices\n1.2 Delivery Receipt\n1.3 Sales Order\n1.4 Purchase Order\n1.5 Transfer Order\n1.5.1 Internal\n1.5.2 External\n1.6 Delivery Order\n1.7 Sample Order\n1.8 Return Slip\n1.9 Bad Order\n2. Workplace\ndocumentation\nrequirements\nMay include:\n2.1 Standard Operating Procedures (SOP)\n2.2 Approval Limits of Signatories\n2.3 Office protocol\n2.4 Workplace forms\n3. Delivery Requirements\n\nMay include:\n3.1 Appointment Schedule\n3.2 Advance Shipping Notice\n\n--- PDF PAGE 66 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n64\nVARIABLE\nRANGE\n\n3.3 Order volume\n3.4 Delivery date\n3.5 Line-item fill rate\n3.6 Order cancellation date\n3.7 Backorder\n3.8 Types of Delivery\n3.8.1 Door to Door\n3.8.2 Port to Port\n3.8.3 Door to Port\n3.8.4 Port to Door\n\n4. Stock Locator Systems\nMay include:\n4.1 Warehouse / Building\n4.2 Bin location\n4.3 Holding areas\n4.3.1 Floor stacking\n4.3.2 Staging Area\n4.3.3 Picking area\n4.4 Special storage\n4.4.1\nRejected\n4.4.2\nQuarantine\n4.4.3\nRegulated/Temperature Controlled\n4.4.4\nHigh Value\n4.4.5\nPiece Picking\n4.5 Virtual locations\n4.5.1 Reserved locations\n4.5.2 Overflow area\n4.6 Damaged area\n4.7 Returns area\n\n5. Stocks\nMay include:\n5.1 Raw and Packaging Materials\n5.2 Work in Process\n5.3 Finished Goods\n5.4 Perishable\n5.5 Damaged\n5.6 Rejected\n5.7 Samplers\n5.8 Returned Stocks\n5.9 Promo / Display Materials\n6. Returned Stocks\nMay include:\n6.1 Trade returns\n6.1.1\nBad Order\n6.1.2\nDamaged stocks\n6.1.3\nWrong order\n6.2 Return to production\n6.2.1\nDefective\n6.2.2\nExcess in Transfer Order\n6.3 Return to suppliers\n6.3.1\nDefective\n\n--- PDF PAGE 67 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n65\nVARIABLE\nRANGE\n6.3.2\nExcess in Purchase Order\n6.4 Excess quantity during delivery\n7. Labels\n\nMay include:\n7.1 Bar code\n7.2 Tags\n7.2.1\nQuality Assurance\n7.2.2\nWarehouse\n7.2.3\nProduction\n7.2.4\nSpecial handling tags\n7.3 Transport-route labels\n8. Government Regulatory\nRequirements\nMay include:\n8.1 Bureau of Customs Permit\n8.2 Food and Drug Administration Registration\n8.3 Drug Enforcement Agency Clearance\n8.4 Export Processing Zone Clearance\n8.5 Port Authority Permit\n8.6 Department of Environment and Natural Resources\nClearance\n8.7 Department of Agriculture Permits\n9. Special Transportation\nRequirements\nMay include:\n9.1 Special transport handling requirements\n9.1.1\n Temperature-controlled vehicles\n9.1.2\n Open and closed vans\n9.1.3\n Liquid and bulk transports\n9.1.4\n Pipeline\n9.2 Special transport packaging requirements\n9.2.1 Palletized\n9.2.2 Shrink-wrapped\n9.2.3 Bundled\n\n10. Appropriate Personnel\nMay include:\n10.1\nWorkplace personnel\n10.2\nSuppliers\n10.3\nGovernment and regulatory personnel\n10.4\nCustomers\n\n--- PDF PAGE 68 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n66\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nChecked receipt and dispatch documents\n1.2\nProcessed receipt and dispatch documents in\naccordance with government and regulatory document\nrequirements\n1.3\nFinalized receipt and dispatch documentation\n\n2. Resource Implications\n\nThe following resources must be provided:\n2.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2\nMaterials, supplies, tools and equipment relevant to the\nproposed activity or task\n2.3\nWorkplace stock locator system\n2.4\nStandard Operating Procedures\n2.5\nApplicable government regulations\n2.6\nInternet\n2.7\nAppropriate hardware and software\n3. Methods of Assessment\n\nCompetency in this unit may be assessed through:\n3.1. Written Examination\n3.2. Observation\n3.3. Oral Examination\n3.4. Demonstration\n4. Context of Assessment\n\n4.1\nCompetency maybe assessed in actual workplace or at\nthe designated TESDA accredited Assessment Center.\n\n--- PDF PAGE 69 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n67\nUNIT OF COMPETENCY:\nIDENTIFY AND INSPECT STORED STOCKS\n\nUNIT CODE :"
