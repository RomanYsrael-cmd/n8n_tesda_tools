bserving\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n36\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Evaluate\n effectiveness\n of\n environmental\n practices\n3.1 Work environmental\npractices are recorded\nbased on workplace\nstandards\n3.2 Recorded work\nenvironmental practices\nare compared against\nplanned indicators\n3.3 Findings regarding\neffectiveness are\nassessed and gaps\nidentified are\nimplemented based on\nenvironment work\nstandards and\nprocedures\n3.4 Results of environmental\nassessment are\nconveyed to appropriate\npersonnel\n\n3.1 Environmental\nPractices\n3.2 Environmental\nStandards and\nProcedures\n3.1 Documenting\n record-keeping\n3.2 Critical thinking\n3.3 Problem Solving\n3.4 Observing\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n37\nRANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n1. Environmental work practices\nissues\nMay include but not limited to:\n1.1\nWater Quality\n1.2\nNational and Local Government Issues\n1.3\nSafety\n1.4\nEndangered Species\n1.5\nNoise\n1.6\nAir Quality\n1.7\nHistoric\n1.8\nWaste\n1.9\nCultural\n2. Environmental Indicators\nMay include but not limited to:\n2.1\nNoise level\n2.2\nLighting (Lumens)\n2.3\nAir Quality - Toxicity\n2.4\nThermal Comfort\n2.5\nVibration\n2.6\nRadiation\n2.7\nQuantity of the Resources\n2.8\nVolume\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n38\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified environmental issues relevant to work requirements\n1.2.\nIdentified gaps in work practices related to Environmental\nStandards and Procedures\n1.3.\nGathered relevant information necessary to determine\nenvironmental work targets\n1.4.\nSet environmental indicators based on gathered 