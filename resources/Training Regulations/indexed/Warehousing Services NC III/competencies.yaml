iguration\n2.3 Delivery instructions\n3. Workplace Standards on\nCustomer Service\nMay include:\n3.1 Prompt delivery\n3.2 Correct delivery\n3.3 Zero damage\n3.4 Zero complaint\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Determined customer service requirements\n1.2 Rendered customer service\n1.3 Monitored customer satisfaction\n1.4 Prepared reports on customer satisfaction\n\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the\nactivities\n3. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Test\n3.2 Direct observation and oral questioning\n3.3 Demonstration with questioning\n3.4 Interview\n4. Context of\nAssessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n55\nUNIT OF COMPETENCY:\nCONTRIBUTE TO QUALITY SYSTEMS\n\nUNIT CODE :"
