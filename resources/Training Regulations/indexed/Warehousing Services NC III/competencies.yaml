        "source_title": "CONTRIBUTE TO QUALITY SYSTEMS",
        "source_text": "--- PDF PAGE 57 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n55 \nUNIT OF COMPETENCY: \nCONTRIBUTE TO QUALITY SYSTEMS \n \nUNIT CODE                     : \nLOG493205 \n \nUNIT DESCRIPTOR        : This unit involves the skills and knowledge required to contribute \nto quality systems within the workplace. It includes applying \nquality concepts to work, evaluating proposed work process \nimprovements and implementing work process improvements. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variable \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILLS \n1. Apply quality \nconcepts \n \n \n \n \n \n1.1 Workplace quality \nconcepts are identified  \n1.2 Responsibility for quality \nof work is assumed \n1.3 Quality concepts are \napplied at work  \n \n1.1 Quality concepts \n1.2 Workplace  \n        procedures \n1.3 Job roles and  \n       responsibilities \n \n \n1.1   Communicating  \n        skills \n  1.2 Documenting  \n         skills \n  1.3 Applying basic  \n         quality concepts  \n         at work \n  1.4 Comprehending \n         information and \n         work instructions \n  1.5  Working  \n         collaboratively  \n         with others \n2. Evaluate \nproposed \nwork process \nimprovements  \n \n2.1  Proposed work process  \n       improvements are  \n       drafted \n2.2  Proposed process  \n       improvements are  \n       shortlisted \n2.3  Probable work process  \n       improvements are  \n       evaluated \n2.1  Work process  \n       improvement  \n       concepts \n2.2  Methods of   \n       evaluating work  \n       process \n       improvements  \n \n \n2.1  Analyzing skills \n2.2  Evaluating work  \n       process  \n       improvements \n \n \n \n \n \n3. Implement \nwork process \nimprovements \n \n3.1 Feasible work process \nimprovements are \nselected \n3.2 Work process \nimprovement is \nimplemented \n3.3 Work process \nimprovements are \nmonitored \n \n \n3.1  Methods of \n       implementing work  \n       process  \n       improvements \n3.2 Work process  \n        improvement \n        metrics \n \n \n \n3.1  Selecting \n       feasible work  \n       process  \n       improvement \n3.2  Monitoring work  \n       process \n       improvement\n\n--- PDF PAGE 58 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n56 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Quality Concepts \n \nMay include: \n1.1 \nStocks rotation policy \n1.2 \nGuidelines on stocks identification \n1.3 \nPolicy on stocks segregation \n1.4 \nGuidelines on handling hazardous materials \n \n2. Work Process Improvements \nMay include: \n2.1 \nProcess simplification \n2.2 \nCost reduction \n2.3 \nComputerization \n2.4 \nAccounting of documents \n2.5 \nTechnology advancement \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n \n \n \nAssessment requires evidence that the candidate: \n1.1 \n Applied workplace quality concepts  \n1.2 \nEvaluated proposed work process improvements  \n1.3 \nImplemented work process improvements \n2. Resource Implications \n \n \n \nThe following resources should be provided: \n2.1 \nWorkplace location \n2.2 \nMaterials relevant to the unit of competency \n2.3 \nTechnical plans, drawings and specifications relevant to \nthe activities \n3. Methods of Assessment \n \nCompetency in this unit must be assessed through: \n3.1 \nWritten test \n3.2 \nDirect observation and oral questioning \n4. Context of Assessment \n \n \n \n4.1 \nCompetency maybe assessed in actual workplace or at \nthe designated TESDA accredited Assessment Center.\n",
