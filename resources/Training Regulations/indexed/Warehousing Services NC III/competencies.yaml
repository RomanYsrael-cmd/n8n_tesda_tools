        "source_title": "IDENTIFY AND INSPECT STORED STOCKS",
        "source_text": "--- PDF PAGE 69 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n67 \nUNIT OF COMPETENCY: \nIDENTIFY AND INSPECT STORED STOCKS \n \nUNIT CODE                     : \nLOG432308 \n \nUNIT DESCRIPTOR        : \nThis unit involves the industry knowledge, and technical skills \nrequired to identify and conduct visual inspection of stored \nstocks in accordance with workplace requirements and relevant \nregulations within the transport and logistics industries. \n \nIt includes identifying stocks in a section of a warehouse or other \nstorage area, checking on quality, reporting on stocks status, as \nwell as using inventory and labelling systems to identify and \nlocate stocks. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILLS \n1. Identify stocks \nin a section of a \nwarehouse or \nother storage \nareas \n1.1 Stocks are identified \naccording to its \nclassification, \nquality status, and \nstorage and \nhandling \nrequirements  \n1.2 Stocks storage \nlocations  are \nassigned based on \nstorage requirements, \nvolume, movements, \nand available space \n1.3 Warehouse stock \nlocator system based \non warehouse lay-out \nis adapted \n1.4 Sufficient signages \nand stock visual \ncues are visible and \nlegible \n \n \n1.1  Stocks identification  \n       and classification \n1.2  Stock Keeping Unit \n1.3  Stock storage and  \n        handling  \n        requirements  \n1.4  Stocks locator  \n       system \n1.5  Warehouse storage  \n       areas \n1.6  Warehouse  \n       signages and visual  \n       cues and where to   \n       place  \n1.7  Good Warehousing  \n        Practices (GWP) / \n1.8   Relevant  \n        DOLE- OSHS  \n        (Occupational  \n        Safety & Health  \n        Standards)    \n1.9   5S (Seiri, Seiton, \n  Seiketsu,Seiso and   \n  Shitsuke) \n1.10 Palletizing scheme \n1.11 Stock temperature   \n   requirements \n1.12  Inventory  \n         Management /  \n         Warehouse  \n         Management  \n         (IM/WM) System \n1.13  Barcode and radio   \n         frequency scanner  \n \n1.1 Categorizing \nstocks  \n1.2 Complying to  \nGood \nWarehousing \nPractices(GWP) \nand 5S \n1.3 Using stock locator \nsystem \n1.4 Proper handling  \n and storage of \n stocks \n1.5 Complying to \nrelevant DOLE- \nOSHS  \n1.6 Visual checking on \nthe quality status \nof stocks \n1.7 Calculating skills \n1.8 Operating   \n  computer  \n1.9  Barcode scanning\n\n--- PDF PAGE 70 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n68 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILLS \n2.  Inspect quality  \n     of stored stocks.  \n2.1 Random or regular \ninspection of stock \nbased on workplace \nquality standards. \n2.2 Inspection checklist \nis accomplished in \naccordance with \nworkplace \nrequirements \n2.3 Damaged stocks or \nstocks for disposal \nare properly labeled \nand segregated   \n2.4 Timely and proper \ndisposal of damaged \n/defective stocks is \nobserved and \nimplemented   \n \n \n \n2.1 Visual quality \ninspection of \nstocks \n2.2 Proper segregation \nor disposal of \nrejected and/or \ndamaged stocks \n2.3 Good Housekeeping \nPractices (GHK) \n2.4 Good Warehousing \nPractices (GWP) /  \n2.5 DOLE-OSHS Rules \n1090, 1150, 1960 \nand other relevant \nOccupational Safety \nand Health \nStandards (OSHS) \n2.6 Seiri, Seiton, \nSeiketsu,Seiso and \nShitsuke (5S) \n2.7 Palletizing scheme \n2.8 Storage and racking \nsystem \n2.9 Temperature \nrequirements \n2.1 Conducting visual \nquality inspection \nof stocks  \n2.2 Exercising good \njudgment \n2.3 Practicing  Good \nWarehousing \nPractices /5S \n2.4 Complying to \nOSHS  \n2.5 Observing proper \nsegregation and \ntimely disposal of \nrejected and/or \ndamaged stocks \n \n3.Prepare \napplicable \nreports on stock \nstatus and \nmovement \n3.1. Quality status of \nstocks stored in the \nwarehouse are \nreported to \nstakeholders based \non workplace \nrequirements \n3.2. Stock movements \nare monitored and \nreported  \n3.3. Timely and proper \ndocumentation of \ndamaged and \ndisposed stocks is \nobserved    \n3.1. \nDifferent \ninventory reports \n3.2. \nStocks \nidentification and \nclassification \n3.3. \nOrganizational \nchart \n3.4. \nGood \nWarehousing \nPractices (GWP)  \n \n3.1. Preparing \ninventory reports \n3.2. Observing timely \nand proper \ndocumentation of \ndamaged and \ndisposed stocks \n3.3. Monitoring stock \nmovements \n3.4. Complying to SOP \n3.5. Calculating skills \n3.6. Operating \ncomputer\n\n--- PDF PAGE 71 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n69 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Classification, quality \nstatus and storage and \nhandling requirements \nMay include: \n1.1 Classification \n     1.1.1 goods, specialty items \n     1.1.2 Export / Import \n     1.1.3 Perishable / non perishable  \n     1.1.4 Bulk/Loose items \n     1.1.5 Raw and Packaging Materials (RPM) / Work In  \n                 Process (WIP) / Finished Goods (FG) \n \n1.2 Quality Status \n1.2.1   Approved \n1.2.2   Rejected \n1.2.3   Quarantine \n1.2.4   Hold \n1.2.5   Restricted \n \n1.3 Storage and handling requirements \n1.3.1 Temperature-controlled  \n1.3.2 Ambient storage \n1.3.3 Flammable storage area \n1.3.4 Humidity Controlled  \n1.3.5 Hazardous storage area    \n \n2.  Stocks Storage Location \n \nMay include: \n2.1 Storage based on movement \n2.1.1 Fast Moving \n2.1.2 Medium Moving \n2.1.3 Slow Moving \n2.2 Storage based on classification \n  2.2.1 Raw and Packaging Materials \n       2.2.2 Work-in-process \n       2.2.3 Finished Products \n       2.2.4 Obsolete \n       2.2.5 Delisted \n       2.2.6 Damaged stocks/Returned stocks \n       2.2.7 Loose items \n       2.2.8 Promo items \n \n3. Signages   \nMay include: \n3.1 Bin-location  \n3.2 Aisle  \n3.3 Rack  \n3.4 Quality status  \n3.5 Security and safety\n\n--- PDF PAGE 72 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n70 \nVARIABLE \nRANGE \n4. Stock Visual Cues  \nMay include:  \n4.1 Stock logo \n4.2 Labels \n4.3 Barcodes \n4.4 Expiry dates \n4.5 Manufacturing info \n4.6 Distributor info  \n \n5. Stock Movements \nMay include: \n5.1 Receipts  \n5.2 Issuances \n5.3 Transfer Posting \n5.4 Bin-to-Bin Transfer \n5.5 Put-away \n5.6 Disposal\n\n--- PDF PAGE 73 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n71 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nIdentified stocks in a section of a warehouse or other \nstorage area \n1.2 \nInspected quality of stocks visually \n1.3 \nPrepared reports on stock status and movement \n2. Resource Implications \n \n \n \nThe following resources must be provided: \n2.1 \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2 \nMaterials, supplies, tools and equipment relevant to the \nproposed activity or task \n2.3 \nWarehouse stock locator system  \n2.4 \nWork instructions and Manuals \n2.5 \nStandard Operating Procedures \n2.6 \nInternet  \n2.7 \nComputer and appropriate warehouse management \nsystem \n \n3. Methods of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 \nWritten Examination  \n3.2 \nObservation  \n3.3 \nOral Examination  \n3.4 \nDemonstration with questioning \n \n4. Context of Assessment \n \n \n \n4.1    Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n",
