        "source_text": "--- PDF PAGE 83 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n81 \nUNIT OF COMPETENCY: \nRENDER EXCELLENT CUSTOMER SERVICE  \n \nUNIT CODE                     : \nLOG432311 \n \nUNIT DESCRIPTOR        : \nThis unit involves the industry knowledge and skills and right \nattitude required to render excellent customer service. It entails \nbeing able to communicate effectively with customers, respond \nto their complaints, receive and process sales orders and \nidentify customers’ special requirements.   \n \nIt includes dealing with customer inquiries, monitoring customer \nsatisfaction and taking appropriate action to effectively deliver \nexcellent service. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILLS \n1. Establish \ncustomers \nprofile \n \n \n \n \n \n \n \n \n1.1 Customers are \nclassified according \nto type and financial \nstanding  \n1.2 Service \nrequirements of \ncustomers are \nidentified    \n1.3 Applicable data is \nrecorded in the \ncustomer data \nmaster file according \nto workplace \nStandard Operating \nProcedures  \n \n1.1 Telephone \netiquette \n1.2 Customer profile \n1.3 Customer Service \nOrientation \n1.4 Negotiation Skills \n1.5 Customer delivery \nrequirements \n1.6 Workplace \nstandard operating \nprocedures (SOP) \n1.7 Company Code of \nEthics \n1.8 Organizational \nchart \n1.1 Communicating to \ncustomers \n1.2 Practicing \ntelephone \netiquette \n1.3 Data Encoding \n1.4 Keeping customer \nprofile \n1.5 Negotiating \n1.6 Classifying \ncustomers \n \n2. Provide \nservices to \ncustomers  \n \n \n2.1 \nSpecific customer \nrequirements are \nfulfilled with \nreference to \nworkplace policies \nand relevant \ngovernment \nregulations   \n2.2 \nCustomers \ninquiries are \nefficiently handled \nand documented \n2.3 \nPrompt feedback is \ngiven to customers \n  \n \n \n \n2.