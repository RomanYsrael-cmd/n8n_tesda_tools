        "source_text": "400311327\n\nUNIT DESCRIPTOR\n:\nThis unit covers the outcomes required to build, operate and\ngrow a micro/small-scale enterprise.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop and\nmaintain micro-\nsmall-medium\nenterprise\n(MSMEs) skills\nin the\norganization\n1.1 Appropriate business\nstrategies are\ndetermined and set for\nthe enterprise based on\ncurrent and emerging\nbusiness environment.\n1.2 Business operations are\nmonitored and controlled\nfollowing established\nprocedures.\n1.3 Quality assurance\nmeasures are\nimplemented consistently.\n1.4 Good relations are\nmaintained with\nstaff/workers.\n1.5 Policies and procedures\non occupational safety\nand health and\nenvironmental concerns\nare constantly observed.\n1.1 Business models\nand strategies\n1.2 Types and\ncategories of\nbusinesses\n1.3 Business\noperation\n1.4 Basic\nBookkeeping\n1.5 Business\ninternal controls\n1.6 Basic quality\ncontrol and\nassurance\nconcepts\n1.7 Government and\nregulatory\nprocesses\n\n1.1 Basic bookkeeping/\naccounting skills\n1.2 Communication\nskills\n1.3 Building relations\nwith customer and\nemployees\n1.4 Building\ncompetitive\nadvantage of the\nenterprise\n2. Establish and\nmaintain client-\nbase/market\n2.1 Good customer relations\nare maintained\n2.2 New customers and\nmarkets are identified,\nexplored and reached out\nto.\n2.3 Promotions/Incentives are\noffered to loyal customers\n2.4 Additional products and\nservices are evaluated\nand tried where feasible.\n2.5 Promotional/advertising\ninitiatives are carried out\nwhere necessary and\nfeasible.\n\n2.1 Public relations\nconcepts\n2.2 Basic product\npromotion\nstrategies\n2.3 Basic market\nand feasibility\nstudies\n2.4 Basic business\nethics\n2.1 Building customer\nrelations\n2.2 Individual\nmarketing skills\n2.3 Using basic\nadvertising\n(posters/ tarpaulins,\nflyers, social media,\netc.)\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n40\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Apply budgeting\nand financial\nmanagement\nskills\n3.1 Enterprise is built up and\nsustained through\njudicious control of cash\nflows.\n3.2 Profitability of enterprise\nis ensured though\nappropriate internal\ncontrols.\n3.3 Unnecessary or lower-\npriority expenses and\npurchases are avoided.\n3.1 Cash flow\n3.2 Management\n3.3 Basic financial\n management\n3.4 Basic financial\n accounting\n3.5 Business\n internal\n controls\n\n3.1 Setting business\n priorities and\n strategies\n3.2 Interpreting basic\n financial\n statements\n3.3 Preparing business\n plans\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Business strategies\nMay include but not limited to:\n1.1. Developing/Maintaining niche market\n1.2. Use of organic/healthy ingredients\n1.3. Environment-friendly and sustainable practices\n1.4. Offering both affordable and high-quality products and\nservices\n1.5. Promotion and marketing strategies (e. g., on-line\nmarketing)\n2. Business operations\nMay include but not limited to:\n2.1 Purchasing\n2.2 Accounting/Administrative work\n2.3 Production/Operations/Sales\n3. Internal controls\nMay include but not limited to:\n3.1 Accounting systems\n3.2 Financial statements/reports\n3.3 Cash management\n4. Promotional/Advertising\ninitiatives\nMay include but not limited to:\n4.1\nUse of tarpaulins, brochures, and/or flyers\n4.2\n Sales, discounts and easy payment terms\n4.3\nUse of social media/Internet\n4.4\n“Service with a smile”\n4.5\nExtra attention to regular customers\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n41\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated basic entrepreneurial skills\n1.2 Demonstrated ability to conceptualize and plan a\nmicro/small enterprise\n 1.3 Demonstrated ability to manage/operate a micro/small-\nscale business\n2. Resource\nImplications\nThe following resources should be provided:\n\n2.1 Simulated or actual workplace\n2.2 Tools, materials and supplies needed to demonstrate the\nrequired tasks\n2.3 References and manuals\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Demonstration/observation with oral questioning\n3.3 Portfolio assessment with interview\n3.4 Case problems\n4. Context of\nAssessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n42\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nAPPLY WORKPLACE PROCEDURES IN\nWAREHOUSING OPERATIONS\n\nUNIT CODE :"
