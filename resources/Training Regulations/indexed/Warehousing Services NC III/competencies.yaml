 \n3.6.4 Packaging \n3.7 Payment Terms \n3.7.1 COD \n3.7.2 Credit\n\n--- PDF PAGE 87 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n85 \nVARIABLE \nRANGE \n3.8 Payment Mode \n3.8.1 Bank Deposit \n3.8.2 Cash / Check Payment \n3.8.3 Bank to Bank Transfer \n3.8.4 Online Payment \n3.8.5 Salesman to Collect     \n4. Customer Inquiries   \n     \nMay include: \n4.1 Stock \n      4.1.1 Features \n      4.1.2 Benefits \n      4.1.3 Product Issues \n                4.1.3.1 Price \n                4.1.3.2 Expiration (Best Before)     \n4.2   Service \n         4.2.1 Types  \n         4.2.2   Delivery issues \n4.3    Personnel \n4.4    Promo mechanics \n5.  Feedback Mechanism \nMay include: \n5.1     Feedback Section on Website \n5.2     E-mail to Customer Service Section \n5.3     Telephone Feedback to Customer Service Section \n5.4     Oral feedback to Sales Department \n5.5     Customer satisfaction surveys \n5.6     Store Visits \n6. Workplace Complaint  \n    Handling Procedures \n \n \n \nMay include: \n6 1    SOP’s for Complaint Handling  \n6.2     SOP’s for Complaint Resolution  \n6.3     SOP’s on Crisis Management \n6.4     Escalation Protocol on Complaint Resolution \n6.5     Documentation on Complaint History \n6.6     Key Performance Indicators\n\n--- PDF PAGE 88 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n86 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. \nDealt with customer inquiries with confidence \n1.2. \nIdentified customers’ special requirements \n1.3. \nResponded to customer complaints/ needs with solution \nfocus mindset \n1.4. \nConducted customer survey \n2. Resource Implications \n \n \n \nThe following resources must be provided: \n2.1 Access to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2 Company documents or forms relevant to the proposed \nactivity or task \n2.3 Standard Operating Procedures \n2.4 Internet  \n2.5 Computer and appropriate operating hardware and software \n3. Methods of Assessment \n \nCompetency in this unit may be assessed through: \n3.1 Written Examination  \n3.2 Observation  \n3.3 Oral Examination  \n3.4 Demonstration with questioning \n3.5 Case Analysis \n4. Context of Assessment \n \n \n \n4.1 Competency maybe assessed in actual workplace or \nat the designated TESDA accredited Assessment \nCenter.\n",
