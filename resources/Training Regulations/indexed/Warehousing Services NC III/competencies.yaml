2. On-time delivery\n3.3. Line item fill rate reports\n3.4. Inventory movement reports\n3.5. Customer feedback reports\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Recorded warehouse data accurately\n1.2 Controlled document effectively\n1.3 Prepared timely warehouse reports\n2. Resource Implications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to\n the activities\n3. Methods of Assessment\n\nCompetency in this unit must be assessed through:\n3.1 Written test\n3.2 Direct observation and oral questioning\n4. Context of Assessment\n\n4.1 Competency maybe assessed in actual workplace or at\nthe designated TESDA accredited Assessment Center.\n\n--- PDF PAGE 63 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n61\nCORE COMPETENCIES\nUNIT OF COMPETENCY:\nCOMPLETE RECEIPT/DISPATCH DOCUMENTATION\nUNIT CODE :"
