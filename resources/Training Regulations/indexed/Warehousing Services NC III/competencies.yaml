        "source_text": "LOG432311\n\nUNIT DESCRIPTOR :\nThis unit involves the industry knowledge and skills and right\nattitude required to render excellent customer service. It entails\nbeing able to communicate effectively with customers, respond\nto their complaints, receive and process sales orders and\nidentify customers’ special requirements.\n\nIt includes dealing with customer inquiries, monitoring customer\nsatisfaction and taking appropriate action to effectively deliver\nexcellent service.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Establish\ncustomers\nprofile\n\n1.1 Customers are\nclassified according\nto type and financial\nstanding\n1.2 Service\nrequirements of\ncustomers are\nidentified\n1.3 Applicable data is\nrecorded in the\ncustomer data\nmaster file according\nto workplace\nStandard Operating\nProcedures\n\n1.1 Telephone\netiquette\n1.2 Customer profile\n1.3 Customer Service\nOrientation\n1.4 Negotiation Skills\n1.5 Customer delivery\nrequirements\n1.6 Workplace\nstandard operating\nprocedures (SOP)\n1.7 Company Code of\nEthics\n1.8 Organizational\nchart\n1.1 Communicating to\ncustomers\n1.2 Practicing\ntelephone\netiquette\n1.3 Data Encoding\n1.4 Keeping customer\nprofile\n1.5 Negotiating\n1.6 Classifying\ncustomers\n\n2. Provide\nservices to\ncustomers\n\n2.1\nSpecific customer\nrequirements are\nfulfilled with\nreference to\nworkplace policies\nand relevant\ngovernment\nregulations\n2.2\nCustomers\ninquiries are\nefficiently handled\nand documented\n2.3\nPrompt feedback is\ngiven to customers\n\n2.1 Workplace policies\n2.2 Relevant\ngovernment\nregulations\n2.3 Customer Service\nOrientation\n2.4 Basic Negotiation\nSkills\n2.5 Customer delivery\nschedule\n2.6 Standard Operating\nProcedures (SOP)\n2.7 Company Code of\nEthics\n2.8 Customer\nResponse System\n\n2.1 Documenting\ncustomer\nrequirements\n2.2 Delivering\ncustomer\nrequirements\n2.3 Handling\ncustomers’\ninquiries\n2.4 Rendering\nexcellent customer\nservice\n2.5 Practicing\ntelephone etiquette\n2.6 Giving feedback to\ncustomers\n\n--- PDF PAGE 84 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n82\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Handle\ncustomer\ncomplaints\n\n3.1 Customers\ncomplaints are\nacknowledged and\ndocumented\n3.2 Customers\ncomplaints are acted\nupon in accordance\nwith workplace\ncomplaint handling\nprocedures\n3.3 Corrective actions\nare drawn to prevent\nrecurrence of\ncomplaints\n\n3.1 Workplace\n customer\n complaint\n handling\n procedure\n3.2 Telephone\n etiquette\n3.3 Customer Service\n3.4 Company Code of\n Ethics\n3.5 Conflict\n Management\n3.6 Organizational\n chart\n3.7 How to deal with\n difficult customers\n3.8 Customer\n Response System\n\n3.1 Communicating\neffectively with\ncustomers\n3.2 Documenting\ncustomer\ncomplaint\n3.3 Handling customer\ncomplaints\n3.4 Working\ncollaboratively with\nothers\n3.5 Exercising good\njudgment\n3.6 Rendering\nexcellent customer\nservice\n3.7 Dealing with\ndifficult customers\n3.8 Practicing\ntelephone\netiquette\n4. Achieve\ncustomer\nsatisfaction\n4.1 Customer feedback\nmechanism is put in\nplace.\n4.2 Customer survey\nresults are analysed\nand translated into\nuseable reports\n4.3 Business processes\nare enhanced to\nachieve customer\nsatisfaction\n4.1 Telephone\n etiquette\n4.2 Customer Service\n4.3 Customer\n Feedback\n mechanism\n4.4 How to conduct\n customer survey\n\n4.1 Working\ncollaboratively with\nothers\n4.2 Communicating\neffectively with\nothers\n4.3 Exercising good\njudgment\n4.4 Getting\ncustomers’\nfeedback\n4.5 Practicing\ntelephone\netiquette\n4.7 Analyzing\n customer survey\n results\n4.8 Enhancing\n customer service\n\n--- PDF PAGE 85 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n83\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Type and Financial\nStanding\nMay include:\n1.1 Workplace customers\n1.1.1 Internal\n1.1.2 External\n1.2 Customer Classification\n1.2.1\nCompany size / Financial Standing\n1.2.1.1\nSmall and Medium\n1.2.1.2\nCorporation\n1.2.1.3\nInstitutional Accounts\n1.3 Ordering system\n1.3.1 Walk-in\n1.3.2 Website /On-Line Booking\n1.3.3 Booking through Salesperson\n1.3.4 Van Selling\n1.3.5 Electronic Data Interchange (EDI)\n1.3.6 Phone In Order\n2. Service Requirements\nMay include:\n2.1 Mode of Delivery\n2.1.1 By land\n2.1.1.1 Trucks\n2.1.1.2 Transport van\n2.1.1.3 Motorcycle\n2.1.1.4 Train\n2.1.1.5 Bus\n2.1.2 By sea\n2.1.2.1 Shipping vessel\n2.1.2.2 Barge\n2.1.2.3 Ferry boat\n2.1.3 By air\n2.1.4 By courier\n2.1.5 By rail\n2.1.6 By pipeline\n2.1.7 Hand carry\n\n2.2 Government regulations\n2.2.1 Truck ban\n2.2.2 Color Coding\n2.2.3 Truckload Weight Limitation (DPWH Axle Load and Truck\nLoad Limits, May 1, 2011/R.A. 8794)\n2.2.4 Local Ordinance (LGU Sticker)\n2.2.5 LTFRB Yellow Plates\n\n2.3 Special customer requirement\n 2.3.1 Special Packaging Requirement\n 2.3.1.1 Shrink-wrapped\n 2.3.1.2 With Customized Stickers\n 2.3.1.3 Bundled\n 2.3.1.4 Receptacles\n 2.3.1.5 Shelf-Ready\n\n 2.3.2 Delivery Schedule\n 2.3.2.1 With Delivery window\n\n--- PDF PAGE 86 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n84\nVARIABLE\nRANGE\n 2.3.2.2 Open Delivery\n 2.3.2.3 Day/Night delivery\n\n 2.3.3 Delivery Point\n 2.3.3.1 Direct to store / branch\n 2.3.3.2 Warehouse delivery\n 2.3.3.3 Distribution Center\n 2.3.3.4 Cross-docking station\n 2.3.3.5 Customer Pick-up\n\n 2.3.4 Material Handling Requirements\n 2.3.5 Delivery Manpower Requirement\n 2.3.6. Delivery Security Requirement (seal, locks, GPS\n etc)\n\n2.4 Delivery Document\n 2.4.1 Invoice and Delivery Receipt\n 2.4.2 Gate Pass\n 2.4.3 Trip Ticket\n 2.4.4 Purchase Order\n 2.4.5 Shipment Advice\n 2.4.6 Packing List\n 2.4.7 Official Receipt\n 2.4.8 Pallet and Tote Return Slip\n 2.4.9 Customer Deliver Note (example: sampling)\n\n2.5 Payment Mode\n 2.5.1 Bank Deposit\n 2.5.2 Cash / Check Payment\n 2.5.3 Bank to Bank Transfer\n 2.5.4 Online Payment\n 2.5.5 Salesman to Collect\n\n2.6 Returns Management / Reverse Logistics\n 2.6.1 Pick-up upon delivery\n 2.6.2 Specified pick up date and time\n 2.6.3 Auto- deduction\n 2.6.4 Pallet and Totes Management\n 2.6.5 Replacements or swaps\n 2.6.6 Customer Returns Documents\n\n3. Customer Data\nMaster file\nMay include:\n3.1 Registered Owner /Business Name\n3.2 Head Office /Branch/es Address\n3.3 Delivery Address\n3.4 Contact Details\n3.5 Risk Categories\n3.6 Customer Requirements\n3.6.1 Unit Sizes\n3.6.2 Delivery Modes\n3.6.3 Lead Time\n3.6.4 Packaging\n3.7 Payment Terms\n3.7.1 COD\n3.7.2 Credit\n\n--- PDF PAGE 87 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n85\nVARIABLE\nRANGE\n3.8 Payment Mode\n3.8.1 Bank Deposit\n3.8.2 Cash / Check Payment\n3.8.3 Bank to Bank Transfer\n3.8.4 Online Payment\n3.8.5 Salesman to Collect\n4. Customer Inquiries\n\nMay include:\n4.1 Stock\n 4.1.1 Features\n 4.1.2 Benefits\n 4.1.3 Product Issues\n 4.1.3.1 Price\n 4.1.3.2 Expiration (Best Before)\n4.2 Service\n 4.2.1 Types\n 4.2.2 Delivery issues\n4.3 Personnel\n4.4 Promo mechanics\n5. Feedback Mechanism\nMay include:\n5.1 Feedback Section on Website\n5.2 E-mail to Customer Service Section\n5.3 Telephone Feedback to Customer Service Section\n5.4 Oral feedback to Sales Department\n5.5 Customer satisfaction surveys\n5.6 Store Visits\n6. Workplace Complaint\n Handling Procedures\n\nMay include:\n6 1 SOP’s for Complaint Handling\n6.2 SOP’s for Complaint Resolution\n6.3 SOP’s on Crisis Management\n6.4 Escalation Protocol on Complaint Resolution\n6.5 Documentation on Complaint History\n6.6 Key Performance Indicators\n\n--- PDF PAGE 88 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n86\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nDealt with customer inquiries with confidence\n1.2.\nIdentified customers’ special requirements\n1.3.\nResponded to customer complaints/ needs with solution\nfocus mindset\n1.4.\nConducted customer survey\n2. Resource Implications\n\nThe following resources must be provided:\n2.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2 Company documents or forms relevant to the proposed\nactivity or task\n2.3 Standard Operating Procedures\n2.4 Internet\n2.5 Computer and appropriate operating hardware and software\n3. Methods of Assessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Observation\n3.3 Oral Examination\n3.4 Demonstration with questioning\n3.5 Case Analysis\n4. Context of Assessment\n\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA accredited Assessment\nCenter.\n\n--- PDF PAGE 89 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n87"
