          "source_text": "1.\nCritical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared for inventory count\n1.2 Conducted inventory count\n1.3 Identified count discrepancies\n1.4 Reconciled variances\n1.5 Recorded inventory count results\n1.6 Prepared inventory count report\n2.\nResource Implications\n\nThe following resources must be provided:\n2.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2 Materials, supplies, tools and equipment relevant to the\nproposed activity or task\n2.3 Warehouse stock assignment lay-out\n2.4 Work instructions and Manuals\n2.5 Standard Operating Procedures\n2.6 Internet\n2.7 Computer and appropriate warehouse management system\n3.\nMethods of Assessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Observation\n3.3 Oral Examination\n3.4 Demonstration with questioning\n4.\nContext of Assessment\n\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA accredited Assessment\nCenter.\n\n--- PDF PAGE 83 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n81\nUNIT OF COMPETENCY:\nRENDER EXCELLENT CUSTOMER SERVICE\n\nUNIT CODE :",
