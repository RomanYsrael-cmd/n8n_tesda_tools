rkplace\nstandards\n3.2 Recorded work\nenvironmental practices\nare compared against\nplanned indicators\n3.3 Findings regarding\neffectiveness are\nassessed and gaps\nidentified are\nimplemented based on\nenvironment work\nstandards and\nprocedures\n3.4 Results of environmental\nassessment are\nconveyed to appropriate\npersonnel\n\n3.1 Environmental\nPractices\n3.2 Environmental\nStandards and\nProcedures\n3.1 Documenting\n record-keeping\n3.2 Critical thinking\n3.3 Problem Solving\n3.4 Observing\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n37\nRANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n1. Environmental work practices\nissues\nMay include but not limited to:\n1.1\nWater Quality\n1.2\nNational and Local Government Issues\n1.3\nSafety\n1.4\nEndangered Species\n1.5\nNoise\n1.6\nAir Quality\n1.7\nHistoric\n1.8\nWaste\n1.9\nCultural\n2. Environmental Indicators\nMay include but not limited to:\n2.1\nNoise level\n2.2\nLighting (Lumens)\n2.3\nAir Quality - Toxicity\n2.4\nThermal Comfort\n2.5\nVibration\n2.6\nRadiation\n2.7\nQuantity of the Resources\n2.8\nVolume\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n38\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1.\nIdentified environmental issues relevant to work requirements\n1.2.\nIdentified gaps in work practices related to Environmental\nStandards and Procedures\n1.3.\nGathered relevant information necessary to determine\nenvironmental work targets\n1.4.\nSet environmental indicators based on gathered information to\nmeasure environmental work targets\n1.5.\nRecorded work environmental practices are recorded based on\nworkplace standards\n1.6.\nConveyed results of environmental assessment to appropriate\npersonnel\n2. Resource Implications\nThe following resources should be provided:\n2.1 Workplace/Assessment location\n2.2 Legislation, policies, procedures, protocols and local ordinances\nrelating to environmental protection\n2.3 Case studies/scenarios relating to environmental protection\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Written/ Oral Examination\n3.2 Interview/Third Party Reports\n3.3 Portfolio (citations/awards from GOs and NGOs, certificate\n of training – local and abroad)\n 3.4 Simulations and role-plays\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA center.\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n39\nUNIT OF COMPETENCY :\nFACILITATE ENTREPRENEURIAL SKILLS FOR MICRO-\nSMALL-MEDIUM ENTERPRISES (MSMEs)\n\n UNIT CODE\n:"
