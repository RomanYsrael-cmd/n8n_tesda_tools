          "source_text": "1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nExamined specific workplace challenges. \n1.2 \nAnalyzed the causes of specific workplace challenges. \n1.3 \nFormulated resolutions to specific workplace challenges. \n1.4 \nImplemented action plans and communicated results on specific \nworkplace challenges. \n \n2. Resource \nImplications \n2.1       Assessment will require access to an operating plant over an   \n             extended period of time, or a suitable method of gathering evidence  \n             of operating ability over a range of situations. A bank of scenarios /  \n             case studies / what ifs will be required as well as bank of questions  \n            which will be used to probe the reason behind the observable  \n            action.  \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1      Observation \n3.2      Case Formulation \n3.3      Life Narrative Inquiry \n3.4      Standardized test \nThe unit will be assessed in a holistic manner as is practical and may be \nintegrated with the assessment of other relevant units of competency. \nAssessment will occur over a range of situations, which will include \ndisruptions to normal, smooth operation. Simulation may be required to allow \nfor timely assessment of parts of this unit of competency. Simulation should \nbe based on the actual workplace and will include walk through of the relevant \ncompetency components.  \n \nThese assessment activities should include a range of problems, including \nnew, unusual and improbable situations that may have happened. \n4. Context for \nAssessment \n In all workplace, it may be appropriate to assess this unit concurrently  \n with relevant teamwork or operation units.",
