        "source_text": "LOG432310\n\nUNIT DESCRIPTOR :\nThis unit involves the skills and knowledge required to participate\nin stock inventory count in accordance with workplace\nrequirements and relevant regulations within the transport and\nlogistics industry.\nIt includes preparing and conducting stock inventory count,\nidentifying and reconciling variances, and submitting inventory\ncount reports.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare for\nstock inventory\ncount\n\n1.1 Inventory count\nschedule and cut-\noffs are set\n1.2 Inventory count\nteams are formed\n1.3 Inventory tasks are\nperformed\n1.4 Inventory count\nresources are made\navailable\n\n1.1 Workplace forms\n1.2 Workplace cut-offs\n and schedules\n1.3 Inventory count\n proceedings\n1.4 Standard\n Operating\n Procedures (SOP)\n1.5 Stocks\n identification and\n classification\n1.6 Organizational\n chart\n1.7 Good\n Warehousing\n Practices (GWP)\n1.8 Stock Locator\n System\n1.9 Unit of Measure\n (UOM) conversion\n1.10 Stock Keeping\n Unit (SKU)\n1.11 Palletizing\n scheme\n1.12 Seiri, Seiton,\n Seiketsu,Seiso\n and Shitsuke (5S)\n1.1 Preparing for\n inventory count\n1.2 Conducting\n orientation for\n count teams\n1.3 Coordinating with\n stakeholders for\n the count\n schedule and cut-\n offs\n1.4 Working\n collaboratively\n with others\n1.5 Practicing Good\n Warehousing\n Practices (GWP)\n /5S\n1.6 Calculating skills\n1.7 Generating count\n sheets and count\n labels\n\n2. Conduct\ninventory count\nand record\nresults\n2.1 Inventory counts are\nundertaken in\naccordance with\nworkplace policies\nand procedures\n2.2 Match count results\nbetween independent\ncount teams\n\n2.1 Workplace policies\n and procedures in\n the conduct of\n inventory count\n2.2 Stocks\n identification and\n classification\n2.3 Manual count\nProcedures\n\n2.1 Counting stocks\n2.2 Converting Unit of\n Measure (UOM)\n2.3 Checking\n palletizing\n scheme\n2.4 Recording count\n Results\n\n--- PDF PAGE 80 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n78\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.3 Re-count is conducted\nfor stocks with\nmismatched counts\n2.4 Inventory count\nresults are recorded\n\n2.4 Stock Locator\n System\n2.5 Unit of Measure\n(UOM) conversion\n2.6 Stock Keeping Unit\n(SKU)\n2.7 Pallet count\n2.8 Palletizing scheme\n2.5 Preparing\n inventory count\n reports\n\n3. Inventory\nvariances are\naccounted and\nreconciled\n3.1 Count results versus\ninventory system\nbalances are\ncompared and\nreconciled\n3.2 Inventory adjustments\nfor approval are\nsummarized based on\nworkplace policies.\n3.3 Inventory adjustments\nare posted in the\nsystem.\n3.4 Count results and new\ninventory stock\nbalance are printed\n3.5 Management report\n on count proceedings\n are prepared in\n accordance with\n workplace\n requirements\n3.6 Inventory count\n documents are filed\nand\n stored in accordance\n with workplace and\n government\nregulatory\n requirements\n\n3.1 Inventory count\nreconciliation\n3.2 Inventory\nAdjustments\n3.3 Workplace forms\n3.4 Workplace\ndocumentation\nprocedures\n3.5 Stocks\nidentification and\nclassification\n3.6 Unit of Measure\n(UOM) conversion\n3.7 Pallet count\n\n3.1 Reconciling count\nvariances\n3.2 Preparing\ninventory\nadjustments\n3.3 Preparing\ninventory count\nreports\n3.4 Filing inventory\ncount reports\n3.5 Operating\ncomputer with the\nsystem and\napplication\nsoftware\n\n--- PDF PAGE 81 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n79\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Schedule and Cut-Offs\nMay include:\n1.1 Inventory count date – start and finish\n1.2 Suppliers’ Delivery cut-off date\n1.3 Transfer and Document cut-off\n1.3.1 Raw & Packaging Materials\n1.3.2 Work-in-Process\n1.3.3 Finished Goods Transfer\n1.4 Billing cut-off date\n 1.4.1 Invoicing\n 1.4.2 Trade Returns\n1.5 Inventory Count Reconciliation target date\n1.6 Inventory Count Result Reporting date\n2..Count Teams\nMay include:\n2.1 Warehouse Count Team\n2.2 Finance Count Team\n2.3 External Auditor’ Count Team\n3.Inventory Tasks\n\nMay include:\n3.1 Pre-count tasks\n 3.1.1 Orientation of count participants\n 3.1.2 Identify inventory items and zones to be counted\n 3.1.3 Count locations are mapped\n 3.1.4 Assign count locations for count teams\n 3.1.5 Warehouse stocks arrangement\n 3.1.5.1 Stocks put in proper location\n 3.1.5.2 Proper segregation and labeling of stocks\n 3.1.6 Printing of inventory balance\n 3.1.7 Printing of count tags and sheets\n 3.1.8 Tagging\n 3.1.9 Accounting of unused count tags\n\n3.2 Actual inventory count\n 3.2.1 Count stocks and convert to required unit of\nmeasure.\n 3.2.2 Compare count results of count teams\n 3.2.3 Recount in case of discrepancy\n 3.2.4 Record inventory count results\n\n3.3 Post-count tasks\n 3.3.1 “Clearing” - check if all stocks are counted\n 3.3.2 Accounting of used count tags\n 3.3.3 Post count results in the system\n 3.3.4 Print new inventory balance\n4. Inventory Count Resources\nMay include:\n4.1 Material Handling Equipment\n4.2 Count Document and/or forms\n4.3 Procedure Manuals\n4.4 Computer hardware and software\n4.5 Warehouse-stock location map\n\n--- PDF PAGE 82 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n80\nEVIDENCE GUIDE\n\n1.\nCritical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Prepared for inventory count\n1.2 Conducted inventory count\n1.3 Identified count discrepancies\n1.4 Reconciled variances\n1.5 Recorded inventory count results\n1.6 Prepared inventory count report\n2.\nResource Implications\n\nThe following resources must be provided:\n2.1 Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2 Materials, supplies, tools and equipment relevant to the\nproposed activity or task\n2.3 Warehouse stock assignment lay-out\n2.4 Work instructions and Manuals\n2.5 Standard Operating Procedures\n2.6 Internet\n2.7 Computer and appropriate warehouse management system\n3.\nMethods of Assessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Examination\n3.2 Observation\n3.3 Oral Examination\n3.4 Demonstration with questioning\n4.\nContext of Assessment\n\n4.1 Competency maybe assessed in actual workplace or\nat the designated TESDA accredited Assessment\nCenter.\n\n--- PDF PAGE 83 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n81\nUNIT OF COMPETENCY:\nRENDER EXCELLENT CUSTOMER SERVICE\n\nUNIT CODE :"
