        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nIdentified stocks in a section of a warehouse or other\nstorage area\n1.2\nInspected quality of stocks visually\n1.3\nPrepared reports on stock status and movement\n2. Resource Implications\n\nThe following resources must be provided:\n2.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2\nMaterials, supplies, tools and equipment relevant to the\nproposed activity or task\n2.3\nWarehouse stock locator system\n2.4\nWork instructions and Manuals\n2.5\nStandard Operating Procedures\n2.6\nInternet\n2.7\nComputer and appropriate warehouse management\nsystem\n\n3. Methods of Assessment\n\nCompetency in this unit may be assessed through:\n3.1\nWritten Examination\n3.2\nObservation\n3.3\nOral Examination\n3.4\nDemonstration with questioning\n\n4. Context of Assessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 74 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n72\nUNIT OF COMPETENCY:\nMAINTAIN TRANSPORT /STOCK RECORDS\n\nUNIT CODE :"
