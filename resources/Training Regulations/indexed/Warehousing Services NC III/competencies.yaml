        "source_text": "400311324\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required to\nuse technical information systems, apply information\ntechnology (IT) systems and edit, format & check information.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Use technical\ninformation\n1.1 Information are\ncollated and\norganized into a\nsuitable form for\nreference and use\n1.2 Stored\ninformation are\nclassified so that\nit can be quickly\nidentified and\nretrieved when\nneeded\n1.3 Guidance are\nadvised and\noffered to people\nwho need to find\nand use\ninformation\n\n1.1 Application in\ncollating\ninformation\n1.2 Procedures for\ninputting,\nmaintaining and\narchiving\ninformation\n1.3 Guidance to\npeople who need\nto find and use\ninformation\n1.4 Organize\ninformation\n1.5 classify stored\ninformation for\nidentification and\nretrieval\n1.6 Operate the\ntechnical\ninformation system\nby using agreed\nprocedures\n1.1 Collating information\n1.2 Operating\nappropriate and\nvalid procedures for\ninputting,\nmaintaining and\narchiving information\n1.3 Advising and\noffering guidance to\npeople who need to\nfind and use\ninformation\n1.4 Organizing\ninformation into a\nsuitable form for\nreference and use\n1.5 Classifying stored\ninformation for\nidentification and\nretrieval\n1.6 Operating the\ntechnical information\nsystem by using\nagreed procedures\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n27\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Apply information\ntechnology (IT)\n2.1. Technical\ninformation\nsystem is operated\nusing agreed\nprocedures\n2.2. Appropriate and\nvalid procedures\nare operated for\ninputting,\nmaintaining and\narchiving\ninformation\n2.3. Software required\nare utilized to\nexecute the project\nactivities\n2.4. Information and\ndata obtained are\nhandled, edited,\nformatted and\nchecked from a\nrange of internal\nand external\nsources\n2.5. Information are\nextracted, entered,\nand processed to\nproduce the\noutputs required\nby customers\n2.6. Own skills and\nunderstanding are\nshared to help\nothers\n2.7. Specified security\nmeasures are\nimplemented to\nprotect the\nconfidentiality and\nintegrity of project\ndata held in IT\nsystems\n\n2.1. Attributes and\nlimitations of\navailable software\ntools\n2.2. Procedures and\nwork instructions for\nthe use of IT\n2.3. Operational\nrequirements for IT\nsystems\n2.4. Sources and flow\npaths of data\n2.5. Security systems\nand measures that\ncan be used\n2.6. Extract data and\nformat reports\n2.7. Methods of entering\nand processing\ninformation\n2.8. WWW enabled\napplications\n2.1. Identifying attributes\nand limitations of\navailable software\ntools\n2.2. Using procedures and\nwork instructions for\nthe use of IT\n2.3. Describing\noperational\nrequirements for IT\nsystems\n2.4. Identifying sources\nand flow paths of data\n2.5. Determining security\nsystems and\nmeasures that can be\nused\n2.6. Extracting data and\nformat reports\n2.7. Describing methods\nof entering and\nprocessing\ninformation\n2.8. Using WWW\napplications\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n28\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Edit, format and\ncheck\ninformation\n3.1 Basic editing\ntechniques are\nused\n3.2 Accuracy of\ndocuments are\nchecked\n3.3 Editing and\nformatting tools and\ntechniques are\nused for more\ncomplex documents\n3.4 Proof reading\ntechniques is used\nto check that\ndocuments look\nprofessional\n3.1 Basic file-handling\ntechniques\n3.2 Techniques in\nchecking\ndocuments\n3.3 Techniques in\nediting and\nformatting\n3.4 Proof reading\ntechniques\n\n3.1 Using basic file-\nhandling techniques\nis used for the\nsoftware\n3.2 Using different\ntechniques in\nchecking documents\n3.3 Applying editing and\nformatting techniques\n3.4 Applying proof\nreading techniques\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n29\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Information\nMay include but not limited to:\n1.1\nProperty\n1.2\nOrganizational\n1.3\nTechnical reference\n2. Technical information\nMay include but not limited to:\n2.1 paper based\n2.2 electronic\n3. Software\nMay include but not limited to:\n3.1 spreadsheets\n3.2 databases\n3.3 word processing\n3.4 presentation\n4. Sources\nMay include but not limited to:\n4.1 other IT systems\n4.2 manually created\n4.3 within own organization\n4.4 outside own organization\n4.5 geographically remote\n5. Customers\nMay include but not limited to:\n 5.1 colleagues\n 5.2 company and project management\n 5.3 clients\n6. Security measures\nMay include but not limited to:\n 6.1 access rights to input;\n 6.2 passwords;\n 6.3 access rights to outputs;\n 6.4 data consistency and back-up;\n 6.5 recovery plans\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n30\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Used technical information systems and information technology\n1.2. Applied information technology (IT) systems\n1.3. Edited, formatted and checked information\n\n2. Resource Implications\nThe following resources should be provided:\n2.1. Computers\n2.2. Software and IT system\n\n3. Methods of Assessment\nCompetency in this unit should be assessed through:\n3.1. Direct Observation\n3.2. Oral interview and written test\n\n4. Context for Assessment\n4.1 Competency may be assessed individually in the actual workplace\n or through accredited institution\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n31\nUNIT OF COMPETENCY :\nEVALUATE OCCUPATIONAL SAFETY AND HEALTH\nWORK PRACTICES\nUNIT CODE\n :"
