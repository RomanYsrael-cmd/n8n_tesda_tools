\n procedures\n2.3 Security threats and\n incidents\n\n2.1 Identifying\n applicable\n transport security\n legislation both\n local and\n international\n2.2 Reporting\n problems that arise\n when following\n security\n procedures\n2.3 Recognizing signs\n of pillage, theft\n and interference\n with stocks and\n goods\n2.4 Recognizing signs\n of security threats\n and situations\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n50\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.\nRespond to a\nsecurity\nthreat\n\n3.1 Response to an identified\nsecurity threat is in\naccordance with workplace\nprocedures\n3.2 Security threats are\nhandled within limits of\nresponsibility using\navailable\ncommunications\nsystems in the workplace\n3.3 Documentation of security\nthreat is prepared\n3.1 Common security p\n problems that may\n occur when\n carrying out\n operations in the\n workplace and\n action that can be\n taken to address\n and resolve the\n problems\n3.2 Relevant\n documentation and\n reporting\n requirements\n\n3.1 Completing\n required\n documentation and\n reports related to\n security\n procedures\n3.2 Working\n collaboratively with\n others when\n following security\n procedures\n3.3 Modifying activities\n depending on\n differing workplace\n contexts risk\n situations and\n environments\n3.4 Applying security\n programs and\n procedures in-\n response to\n identified security\n threats\n3.5 Promptly reporting\n and/or rectifying\n any identified\n problems that may\n arise when\n following security\n procedures in\n accordance with\n regulatory\n requirements and\n workplace\n procedures\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n51\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Security Measures\n\nMay include:\n1.1\nSecurity guards at access points and gates to\nsecured areas\n1