        "source_title": "ENSURE SECURITY OF STOCKS AND CARGO",
        "source_text": "--- PDF PAGE 51 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n49 \nUNIT OF  COMPETENCY: \nENSURE SECURITY OF STOCKS AND CARGO \n \nUNIT CODE                      : \nLOG493203 \n \nUNIT DESCRIPTOR         : \nThis unit involves the skills and knowledge required to comply \nwith the security procedures in the transport and logistics \nindustry. It includes maintaining the security of stocks and \ncargo, identifying security threats and responding to a security \nthreat. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariable \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILLS \n1. Maintain \nsecurity of \nstocks and \ncargo \n \n \n1.1 Stocks and cargo are \nsecured in accordance \nwith workplace  \nprocedures  \n1.2 Security measures on \nstocks and cargo are  \nmaintained in accordance \nwith workplace \nprocedures \n1.3 Signs of pilferage, theft \nand interference are \nreported in accordance \nwith workplace \nprocedures \n1.4 Suspicious stocks and \ncargo are reported \npromptly to appropriate \npersonnel \n1.5 Any breach of security is \nreported promptly to \nappropriate personnel  \n 1.1  Applicable  \n        transport security  \n        legislation both  \n        local and  \n        international  \n1.2  Workplace  \n        procedures  \n1.3  Security threats and  \n        incidents  \n \n1.1  Understanding  \n       security  \n        regulations both  \n        local and  \n        international \n1.2  Observing security   \n       signs and  \n       procedures \n1.3  Reporting security  \n        related incidents   \n \n \n \n \n2. \nIdentify a \nsecurity \nthreat  \n \n2.1 Information on security \nthreats is disseminated \n2.2 Simulation of security \nthreat is conducted \n2.3 Actual security threat is \nidentified  \n2.4 Security threat is \nassessed  \n \n \n \n \n \n2.1 Applicable transport  \n       security legislation \n       both local and  \n       international  \n2.2 Workplace  \n        procedures  \n2.3  Security threats and  \n        incidents \n \n \n \n2.1 Identifying \n       applicable  \n       transport security  \n       legislation both  \n       local and  \n       international  \n2.2  Reporting  \n       problems that arise  \n       when following  \n       security     \n       procedures \n2.3 Recognizing signs  \n        of pillage, theft  \n        and interference  \n        with stocks and \n        goods \n2.4   Recognizing signs  \n       of security threats  \n       and situations\n\n--- PDF PAGE 52 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n50 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are \nelaborated in the Range of \nVariable \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILLS \n3. \nRespond to a \nsecurity \nthreat  \n \n3.1 Response to an identified \nsecurity threat is in \naccordance with workplace \nprocedures  \n3.2 Security threats are \nhandled within limits of \nresponsibility using \navailable \ncommunications  \nsystems in the workplace \n3.3 Documentation of security \nthreat is prepared \n3.1 Common security p \n       problems that may  \n       occur when  \n       carrying out \n       operations in the  \n       workplace and  \n       action that can be  \n       taken to address \n       and resolve the  \n       problems \n3.2  Relevant  \n       documentation and  \n       reporting  \n       requirements \n \n3.1  Completing  \n       required  \n       documentation and  \n       reports related to     \n       security  \n       procedures \n3.2  Working  \n       collaboratively with  \n       others when  \n       following security    \n      procedures \n3.3  Modifying activities  \n       depending on  \n       differing workplace \n       contexts risk  \n       situations and  \n       environments \n3.4  Applying security  \n       programs and  \n       procedures in- \n       response to  \n       identified  security  \n       threats  \n3.5  Promptly reporting  \n       and/or rectifying  \n       any identified  \n       problems that may  \n       arise when  \n       following security  \n       procedures in  \n       accordance with  \n       regulatory  \n       requirements and  \n       workplace  \n       procedures\n\n--- PDF PAGE 53 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n51 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Security Measures \n \nMay include: \n1.1 \nSecurity guards at access points and gates to \nsecured areas  \n1.2 \nLocked doors, gates and fences  \n1.3 \nUse of personal electronic access cards \n1.4 \nRecording of carrier and vehicle registration \ndetails at gates and checkpoints  \n1.5 \nBag check points  \n1.6 \nEscorts for visitors in restricted areas  \n1.7 \nAccess control in and out of restricted security \nareas \n1.8 \nUse of ID cards  \n1.9 \nVideo surveillance equipment \n1.10 X-ray screening of baggage, cargo and goods \n1.11 Explosives trace detection (ETD) screening of \npassengers, baggage, cargo and goods  \n1.12 Screening of passengers using hand-held and \nwalk through magnetometers  \n2. Security Threats \nMay include: \n2.1   Explosive devices \n2.2  Terrorist attack \n2.3   Piracy  \n2.4   Robbery \n2.5   Hostage \n2.6   Cyber attack \n2.7   Pillaging \n3. Communications Systems \n \nMay include: \n3.1 \nPhone  \n3.2 \nRadio  \n3.3 \nEmail \n3.4 \nInternet  \n3.5 \nSMS\n\n--- PDF PAGE 54 ---\nTESDA-SOP-QSO-01-F08 \n \nWarehousing NC III \n \n \n \nPromulgated (12/17/2019) \n \n \n52 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n \n \n \n \n \n \n \nAssessment requires evidence that the candidate: \n1.1 \nSecured goods and stocks in accordance with workplace \nsecurity procedures and applicable security regulations \n1.2 \nChecked and maintained seals, tamper proof packaging, locks \nand other security measures on goods or cargo in accordance \nwith workplace security procedures \n1.3 \nIdentified and assessed security threat or situation in \naccordance with the workplace security program and \nprocedures \n1.4 \nResponded to an identified security threat or situation in \naccordance with workplace security procedures, received \ninstructions, \nregulatory \nrequirements \nand \nemergency \nresponse plan  \n1.5 \nHandled appropriately any security threats or incidents in \naccordance with established response plan and within limits of \nresponsibility  \n \n2. Resource \nImplications \n \n \n \nThe following resources should be provided: \n2.1 \nWorkplace location \n2.2 \nMaterials relevant to the unit of competency \n2.3 \nTechnical plans, drawings and specifications relevant to the \nactivities \n3. Methods of \nAssessment \n \nCompetency in this unit may be assessed through: \n3.1 \nWritten Test \n3.2 \nDirect observation and oral questioning \n3.3 \nDemonstration with questioning \n3.4 \nInterview \n4. Context of \nAssessment \n \n \n \n4.1  Competency maybe assessed in actual workplace or at the \ndesignated TESDA accredited Assessment Center.\n",
