hable\n1.4\nTemperature controlled\n1.5\nPremium items\n2. Stocks Storage Locations\nMay include:\n2.1 Raw and Packaging Materials\n2.2 Work-in-process\n2.3 Finished Products\n2.4 Damaged stocks/Returned stocks\n2.5 Loose items\n3. Stocks Handling Procedure\nMay include:\n3.1 Stock rotation procedures\n3.2 Flammable stocks\n3.3 Hazardous stocks\n3.4 Damaged/returned stocks\n3.5 Promo bundling\n\nEVIDENCE GUIDE\n\n1. Critical Aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Categorized stocks according to stocks classification\n1.2 Identified storage locations according to product storage\nrequirements, volume, movements, and available space\n1.3 Followed stocks handling procedures\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the\n activities\n3. Methods of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Written Test\n3.2 Direct observation and oral questioning\n3.3 Demonstration with questioning\n3.4 Interview\n\n4. Context of\nAssessment\n\n4.1 Competency maybe assessed in actual workplace or at the\ndesignated TESDA accredited Assessment Center.\n\n--- PDF PAGE 61 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n59\nUNIT OF COMPETENCY:\n MAINTAIN WAREHOUSE RECORDS\n\nUNIT CODE :"
