              {
                "number": "3.4",
                "text": "Standardized test The unit will be assessed in a holistic manner as is practical and may be integrated with the assessment of other relevant units of competency. Assessment will occur over a range of situations, which will include disruptions to normal, smooth operation. Simulation may be required to allow for timely assessment of parts of this unit of competency. Simulation should be based on the actual workplace and will include walk through of the relevant competency components. These assessment activities should include a range of problems, including new, unusual and improbable situations that may have happened."
              }
