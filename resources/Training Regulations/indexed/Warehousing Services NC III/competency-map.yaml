  "source_text": "COMPETENCY MAP – WAREHOUSING SERVICES NC III (LOGISTICS AND TRANSPORT SECTOR)\n\nBASIC COMPETENCIES\n\nLead workplace\ncommunication\nLead small teams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\nWork in a\ndiverse\nenvironment\n\nPropose\nmethods of\napplying\nlearning and\ninnovation in the\norganization\n\nUse information\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\nEvaluate\nenvironmental\nwork practices\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nCOMMON COMPETENCIES\n\nApply workplace\nprocedures in\nwarehousing\noperations\nPerform industry\ncalculations in\nwarehousing\noperations\nEnsure security\nof stocks and\ncargo\nProvide efficient\ncustomer\nservice\nContribute to\nquality systems\nComply with\nworkplace\nprocedures in\nhandling stocks\nMaintain warehouse\nrecords\n\n--- PDF PAGE 134 ---\nWarehousing NC III Promulgated (12/17/2019) 132\nCORE COMPETENCIES\n\nComplete receipt/\ndispatch\ndocumentation\nIdentify and\ninspect stored\nstocks\nMaintain\ntransport/stock\nrecords\nParticipate in\nstock inventory\ncount\nRender excellent\ncustomer\nservice\n\n--- PDF PAGE 135 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n133\nGLOSSARY OF TERMS:\n\nAir Waybill\n\nBarcode\n\nCertificate of\nCompliance\n\nCertificate of\nOrigin\nIt is a receipt issued by an international airline for goods and an evidence of the\ncontract of carriage that allows it to be tracked. It is not a document of title to the\ngoods hence it is a non-negotiable instrument\n\nIt is an optical machine-readable representation of data relating to the object to\nwhich it is attached. It is a small image of lines (bars) and spaces that is affixed to\nstore items identification cards, and etc. to identify a particular product number,\nperson, or location.\n\nA document certified by a competent authority that the supplied good or service\nmeets the required specification.\n\nIt is an important international trade document attesting that goods in a particular\nexport shipment are wholly obtained, produced, manufactured or processed in a\nparticular country\n\nConsignee\nIs the entity or person who is responsible for the receipt of a shipment. Generally,\nbut not always, the consignee is the same as the receiver or the buyer.\n\nDelivery Waiver\n\nDemurrage\nA permission for claiming goods or merchandise in the absence of the consignee\nor the rightful person\n\nIt refers to charges that shall be imposed when customers have exceeded the\nstandard free time allowed for taking delivery of a shipment from the shipping or\ntransporting company’s warehouse\n\nErgonomics\nIt is the scientific discipline concerned with the understanding of interactions among\nhumans and other elements of a system, and the\nprofession that applies theory, principles, data and methods to\ndesign in order to optimize human well-being and overall system\nperformance\n\nForklift\n\n It is a powered industrial truck (usually engine, hydraulics or electricity used to lift\nand move materials in short distances\n\nInventory\n\nLay-out\nThe total amount of goods and/or materials contained in a warehouse, store or\nfactory at any given time.\n\nIt is the manner in which parts of the warehouse are arranged or laid-out\n\nLift truck\nVehicles used to lift, move, stack, rack, or otherwise manipulate loads.\n\n--- PDF PAGE 136 ---\nWarehousing NC III Promulgated (12/17/2019) 134\nLoad\nDescribes the materials being handled by a piece of equipment.\n\nLoad Leading\nA condition of pallet truck operation where the forks with the load leading on travel\nand the steering wheels behind\n\nLoading Dock\nAlso called loading bay is an area of a warehouse building where goods vehicles\n(usually road or rail) are loaded and unloaded.\n\nLogistics Provider\nA company that provides management over the flow of goods and materials\nbetween points of origin to end-use destination. The provider will often handle\nshipping, inventory, warehousing, packaging and security functions for shipments.\n\nNegotiation\nDiscussion aimed at reaching an agreement.\n\nOrder\nA request by one party to another to make, supply, deliver, transfer or receive\ngoods and services.\n\nOrder Fulfillment\nUsed to describe the act of distribution or the logistics function, however, in the\nbroader sense it refers to the way firms respond to customer orders.\n\nPacking List\n\nPallet\nIt is a document that includes details about the contents of a package to allow\ntransport agencies, government authorities and customers know the contents\n\nA portable platform designed to allow a forklift or pallet jack to lift, move, and store\nvarious loads\n\nPallet Loader\nA warehousing or manufacturing equipment designed to lift and move load on a\npallet\n\nPallet Truck\nIt is an equipment used to lift and move pallets are either manually operated or\npowered by means of electricity and hydraulics\n\nPhysical Inventory\nCount Window\nAllows many different methods of creating count lists, verifying and updating\ninventory counts.\n\nPalletizing Scheme\n\nCreate a number of alternative palletization patterns or arrangement which\nensures cargo stability, taking into account pallet and box volumes.\n\nPick List\nIt is a document that is often used to pull particular items in specific quantities\nfrom an inventory\n\nPre-Operational\nChecks\nVisual and physical checks made before operating any pallet jacks/trucks to\nidentify damage, prevent accidents and to ensure the forklift is safe to use\n\nPurchase Order\n\nA document used to approve, track, and process purchased items\n\nReconciliation\n\nShelf Life\nIt is a process where a company balances its physical inventory with the figures in\nits accounting books.\n\nShort landed\nA condition where the manifested schedule of delivery does not actually arrive on\ntime.\n\nStacking\n\nAn orderly pile of stocks/goods, especially one arranged in layers.\n\n--- PDF PAGE 137 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n135\nStock Locator\nSystem\nA system with the capability of tracking supplies and inventory during transport\nand storage.\n\nStock Take or\nInventory Count\n\nTransport-Route\nplanning\n\nWarehouse Facility\n\nWork-in-Process\n\nIs the physical verification of the quantities and condition of items held in an\ninventory or warehouse. This may be done to provide an audit of existing stock\nvaluation. It is also the source of stock discrepancy information.\n\nIt is a process to plan for the most cost-effective route by minimizing the distance\ntraveled and time taken in the delivery process\n\nA facility where raw materials and manufactured goods materials are stored\nbefore distribution.\n\nPart of manufacturer’s inventory that has not yet been completed and transferred\nas finished goods inventory\n\n--- PDF PAGE 138 ---\nWarehousing NC III Promulgated (12/17/2019) 136\nACRONYMS:\n\nASN Advanced Shipping Notice – It is a document that provides detailed\n information about pending delivery. It is to notify a customer when\n shipping occurs and provide physical characteristics about the\n shipment so the customer can be prepared to accept the delivery\n\nBOL\nBill Of Lading- is a document issued by a carrier which details a shipment of\nmerchandise and gives title of that shipment to a specified party.\n\nDOLE – OSHS\n\nDepartment of Labor and Employment – Occupational Safety and Health\nStandards.\nETA\n\nETD\nEstimated Time of Arrival- refers to the expected or projected time of arrival\nof either person, goods and/or services to a particular place or destination\n\nEstimated Time of Departure.-refers to the expected or projected time of\ndeparture of either person, goods and/or services to a particular place or\ndestination\n\nFIFO\n\nFirst In, First Out -. It is an accounting method of costing inventory. It values\nitems withdrawn from inventory at the cost of the oldest items assumed to\nremain in inventory. It is based on the assumption that the first goods\npurchased are also the first goods sold.\nGMP\n\nGood Manufacturing Practices - It describes a set of principles and\nprocedures to ensure that products are consistently produced and controlled\naccording to quality standards.\n\nGHK\n\nGood Housekeeping - It is an on-going process aimed to eliminate some\nworkplace hazards and help get a job done easily and properly. A good\nhousekeeping program plans and manages the orderly storage and movement\nof materials from point of entry to exit.\n\nGPS\n\nGlobal Positioning System - It is a space-based navigation system that\nprovides location and time information in all weather conditions, anywhere.\n\nIM\n\nIM-WM\nInventory Management - It is the process of efficiently overseeing and\ncontrolling the constant flow of units in an existing inventory\n\nInventory Management-Warehouse Management - It is a software\napplication that supports the day-to-day operations in a warehouse to enable\ncentralized management of tasks such as tracking inventory levels and stock\nlocations\n\nKPI\n\nKey Performance Indicator - It is a measurable value that demonstrates\nhow effectively a company is achieving key business objectives.\nOrganizations use KPIs at multiple levels to evaluate their success at reaching\ntargets.\n\n--- PDF PAGE 139 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n137\nLIFO\n\nLast In, First Out - It is an accounting method of costing inventory. It values\nitems withdrawn from inventory at the cost of the newest items assumed to\nremain in inventory based on the assumption that the last goods purchased\nare also the first goods sold. It may also refer to a policy of.issuing first what\nhas arrived last\n\nRFID\nRadio Frequency Identification – It refers to small electronic devise that\nconsists of a small chip and antenna. It serves the same purpose as a bar\ncode of a magnetic strip which provides a unique identifier for an object .RFID\ndevice must be scanned to retrieve the identifying information\n\nSKU\nStock Keeping Unit - It is an identification code, usually alphanumeric, of a\nparticular product that allows it to be tracked for inventory purposes.\n\nSOP\n\nStandard Operating Procedures - These are written instructions intended to\ndocument how to perform a routine activity to ensure consistency and quality\nin the products.\n\nWMS\n\nWarehouse Management System - It is a software application that supports\nthe day-to-day operations in a warehouse. It enables centralized\nmanagement of tasks such as tracking inventory levels and stock locations.\n\n5S\nSeiri, Seiton, Seiso, Seiketsu and Shitsuke - It is a systematic and\nmethodical approach allowing teams to organize their workplace in the safest\nand most efficient manner. It engages the people through the use of\n“standards” and “discipline”.\n\n--- PDF PAGE 140 ---\nWarehousing NC III Promulgated (12/17/2019) 138\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nWarehousing Services NC III\nQualification Code:\nLOGWHS319\n\nRevision\nNo.\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\nWarehousing Services NC III\n\n2019-73/\nDec 17, 2019\n\n01\n\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 141 ---\nTESDA-SOP-QSO-01-F08\n\nWarehousing NC III\n\nPromulgated (12/17/2019)\n\n139\nACKNOWLEDGMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies and labor groups who rendered their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n• THE TEC