      "text": "3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. --- PDF PAGE 137 --- TR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 133 Receive and respond to workplace communication Work with others Solve/address routine problems Enhance self- management skills Support Innovation Access and maintain information Follow occupational safety and health policies and procedures Apply environmental work standards Adopt entrepreneurial mindset in the workplace Participate in workplace communication Work in team environment Solve/address general workplace problems Develop career and life decisions Contribute to workplace innovation Present relevant information Practice occupational safety and health policies and procedures Exercise efficient and effective sustainable practices in the workplace Practice entrepreneurial skills in the workplace Lead workplace communication Lead small teams Apply critical thinking and problem-solving techniques in the workplace Work in a diverse environment Propose methods of applying learning and innovation in the organization Use information systematically Evaluate occupational safety and health work practices Evaluate environmental work practices Facilitate entrepreneurial skills for micro- small-medium enterprises (MSMEs) Utilize specialized communication skill Develop and lead teams Perform higher order thinking processes and apply techniques in the workplace Contribute to the practice of social justice in the workplace Manage innovative work instructions Manage and evaluate usage of information Lead in improvement of Occupational Safety and Health Program, Policies and Procedures Lead towards improvement of environmental work programs, policies and procedures Sustain entrepreneurial skills Manage and sustain effective communication strategies Manage and sustain high performing teams Evaluate higher order thinking skills and adjust problem solving techniques Advocate strategic thinking for global citizenship Incorporate innovation into work procedures Develop systems in managing and maintaining information Manage implementation of occupational safety and health programs in the workplace Manage implementation of environmental programs in the workplace Develop and sustain a high- performing enterprise Maintain an effective relationship with clients/customers Manage own performance Apply quality standards Maintain a safe, clean and efficient environment COMPETENCY MAP – SOCIAL AND OTHER COMMUNITY DEVELOPMENT SERVICES SECTOR --- PDF PAGE 138 --- TR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 134 Perform facial cleansing Perform temporary hair removal activity Perform body scrub Perform pre and post hair care activities Perform hair and scalp treatment Perform basic hair coloring Perform basic hair bleaching Perform basic hair perming Perform hair straightening Perform basic haircutting Perform advanced and creative haircutting Perform advanced and creative hair coloring Perform advanced and creative hair perming Perform basic men’s haircutting Perform shave and style beard and mustache Perform chair manipulative relaxing services Perform manicure and pedicure Perform hand and foot spa Perform preparatory activities Prepare appropriate products, tools and equipment Perform nail enhancement technology procedures Perform post service activities Perform advanced nail polish procedures Apply facial make-up Perform body bleach --- PDF PAGE 139 --- TR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 135 Analysis Hair - an examination to determine the condition of the hair prior to a hair treatment Aniline Derivative Tints - are also known as penetrating tints, synthetic, organic tints and peroxide or oxidation tints and are commonly called tints in the industry Back Combing - combing the short hair toward the scalp while the hair strand is held in a vertical position also called teasing Baseline - the first/foundation line to be cut which subsequent sections are cut to Basic Hair shaping - shaping the hair that is not too long or too short to different head shape Bleaching - removing the natural pigmentation Blunt cutting - all hair strands must direct at the same point. The hair appears to be the same length Bob - a level haircut above the shoulders Chemical damage - damage to the hair fiber through the overuse of chemicals such as permanent waves, colour, hydrogen peroxide, ammonia Clippers - electric razors mostly used to smoothen the back of the neck Coiffure - an arrangement or dressing of the hair Color Fillers - are used if the hair is in damaged condition and there is doubt that the color result will be an even shade Color stripping - removing artificial color by bleaching or chemical color stripper Conditioner - creams, waxes and oils which help protect and maintain the health and condition of the hair Conditioning - the application of special chemical agents to the hair to help restore its strength and give it body in order to protect it against possible breakage Contour winding - a loose wave, winding the perm rods to the contour of the head - shape Cuticle - the outer layer of the hair; the hard skin at the base of the fingernail Design - a plan or arrangement of a hairstyle Digital Perm - is a new technique of creating a shiny and bouncy wave to your hair. As a new trend-setting hairstyling treatment, the digital perm uses temperature controlled rods that are all powered by a machine with a digital display. Diffuser - an attachment on a blow dryer that “shatters’ the flow of air so that the hair can be soft styled Elasticity - the ability of the hair to stretch and return to its original form without breaking Elevation - to lift the hair away from the head shape, elevation defines the technique being used --- PDF PAGE 140 --- TR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 136 Emulsifying agent - a substance used to form an emulsion, e.g. shampoo End paper - a small paper tissue used at the end of a strand of hair to assist the winding of the perm rod Hair Iron - a hair iron or hair tong is a tool used to change the structure of the hair using heat Implements - a tool, utensil. Or other piece of equipment, especially as used for a particular purpose First-Aid - means immediate assistance given in case of injury until medical aid has been obtained Flat Iron - straightening Iron or Flat irons, work by breaking down the hair’s positive hydrogen bonds found in the hair cortex, which cause hair to open, bend and become curly. Once the bond is broken hair is prevented from holding its natural form, though the hydrogen bonds can re-form if exposed to moisture. They can use ionic and nano technology. They used mainly ceramic materials for its plates. Low end straighteners use single layer of ceramic coating on its plates whereas high end straighteners use multiple layers of ceramic or even use 100% ceramic material for its plates Frosting - to lighten or darken small selected strands of hair over the entire head to blend with the root of the hair Graduation - the grade at which the hair is cut by degrees Guideline - a line to follow when shaping the balance of the hair Hair analysis - an examination to determine the condition of the hair prior to a hair treatment Hair Density - the amount of hair strands per square inch on the scalp Hair Cutting - a process to thinning, tapering and shortening of the hair into a becoming shapes or styles Hairstyling - a process of arranging the hair into a temporary design - Involves arranging the hair in a particular style, appropriately suited to the cut, and may require the use of hairstyling aid such as hair spray, gel or mousse Hair stylist - a person who designs and dresses the hair Keratin - keratin is a protein that your hair is made up of. Layer/Layering - holding the hair out from the head at a 90 degree angle and then removing a defined amount to remove volume, give movement, and added texture Layering - is a technique used by hairdressers to change the thickness of the hair, creating either a thinning or thicker appearance. In this way the hair can be given a fuller appearance, more texture and movement Lysine - an animo acid found in hair Medulla - a hollow pith or core of the hair fiber. Melanin - the dark or black pigment in the epidermis and hair, and in the choroids or coat of the eye --- PDF PAGE 141 --- TR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 137 Nano Technology - the branch of technology that deals with dimensions and tolerances of less than 100 nanometers especially the manipulation of individual atoms and molecules Neutralizer - an agent capable of neutralizing another substance Normal hair shedding - a certain amount of hair is shed daily. This is nature’s method to make way for new hair. The average daily shedding is estimated at 50-80 hairs. Hair loss beyond this estimated average indicates some scalp or hair trouble Occupational Health & Safety (OHS) - is define as the A.) Promotion and maintenance of the highest degree of physical, mental and social well-being of workers in all occupations B.) Prevention among its workers of any departures from health cause by their working conditions; C.) protection among workers in their employment from risks usually from factors adverse to health and; D.) placing and maintenance of the worker in an occupational environment adapted to his/her physiological ability Perm - abbreviation for permanent wave Personal Protective Equipment - means any clothing, device or other article that is intended to be worn or used by a worker to prevent injury or to facilitate rescue Porosity - ability of the hair to absorb liquid Rebonding - rejoining the lines and bonds on the keratin chains – neutralizing Relaxer - a chemical applied to the hair to remove the natural curl Sectioning - Hair sectioning is dividing the head into uniform working panels Shimmering - shading or tinting parts of the hair to enhance the style Shingling - is cutting the hair close to the nape and gradually longer toward the crown, without showing a definite line Slithering - tapering the hair to graduated length with scissors Streaking - layers or strands of hair with a contrasting color, usually placed so as to enhance the appearance Symmetrical - hair equally distributed on both sides of the head Taper - to diminish a strand of hair gradually toward the points by cutting. Removing bulk from the ends of the hair Texture - coarseness and fineness of the hair Texturizing - is performed after the overall cut has been completed. Thinning or notching are used to create wispy or spiky effect. Thinning - removing bulk from the hair Toners - the colors applied to hair which has been lightened – delicate pastel shades, e.g. champagne, beige, silver Touch up - improve, retouch, restore, freshen, freshen up, refurbish, repaint, smarten up Trichologist - a person trained in the science of caring for the hair Trichology - the study of the structure and functions of the hair --- PDF PAGE 142 --- TR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 138 Vent brush - a brush with widely spaced plastic bristles designed to be used while blow drying Wig - an artificial covering for the head consisting of a network of interwoven hair Workplace - refers to the office. Premises or worksite where a worker is temporary or habitually assigned. Where is no a fixed or definite workplace, the term shall include the place where the worker actually performs regular work, or where he regularly reports to render service or to take assignment --- PDF PAGE 143 --- TR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 139 The Technical Education and Skills Development Authority (TESDA) wants to extend sincerest thank you and appreciation to the representatives of business, industry, academe and government agencies who provided their time and expertise in the development and validation of this Training Regulations. MANOLITO “Ching” D. DONDONILLA Technical Expert/Member Philippine International Cosmetologists Assn. (PICA) ANDREW I. GALINDON Technical Expert/Board Member Philippine International Cosmetologists Assn. (PICA) CRISTINA P. MARPURI Technical Expert/Member Philippine International Cosmetologists Assn. (PICA) The PARTICIPANTS in the Validation of this Training Regulation Mary Helen L. Reyes Reyes Haircutters Danilo V. Romero Reyes Haircutters Alejandro S. Dungo Reyes Haircutters Marites R. Del Pilar Reyes Haircutters Andy A. Pasion, Jr. Andy Pasion Asia Training Institute Inc. Ma. Lea D. Ycoy Andy Pasion Asia Training Institute Inc. Edwin L. Labalan Edwin Lisa Brows & Aesthetics Harizon C. Olivar Harizon “Hanz” Olivar Salon Noroddin M. Manuel Felicitite Training Center Corporate Carla K. Gilhang Designer’s Cave Salon Co. Gloria R. Katipunan Designer’s Cave Salon Co. January C. Donato Graciella Beauty Salon Shaylyn E. Reburiano Uniminx Raul A. Reburiano, Jr. Unihair Expressions Rolando R. Wong Beauty Kingdom Carmela B. Ocampo ALS Cabuyao Evelyn M. Ebbat ALS Cabuyao The Participants in the Validation of this Training Regulation • Members of the Philippine International Haircutters Association (PIHA) • Members of the Philippine International Cosmetologists Association (PICA) • Members of the Haircutters and Cosmetologists Association of the Philippines (HACAP) --- PDF PAGE 144 --- TR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 140 The Members of the TESDA Board and Secretariat The MANAGEMENT and STAFF of the TESDA Secretariat Qualifications and Standards Office (QSO) - MS. IMELDA B. TAGANAS, Executive Director • Competency Standards Development Division - MS. MA. ISABEL G. GAMUROT, Division Chief - MR. EDWIN G. MAGLALANG - MS. BARBARA JANE B. REYES • Competency Programs and Standards Development Division - MS. MERCEDES E. JAVIER, Division Chief - MS. JENNIFER C. CASPE - MR. JOSEPH CYRUS P. SANTALISIS --- PDF PAGE 145 --- TR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 141 TRAINING REGULATIONS (TR) Qualification Title: Hairdressing NC III Qualification Code: SOCHDR320 Revision No. Document Types* Qualification Title TESDA Board Resolution No./ Date Deployment Circular (TESDA Circular/ Implementing Guidelines) 00 Document Created Hairdressing NC III BR No. 2010-18 11/25/2010 NA 01 Document Amended Hairdressing NC III BR No. 2020-27 06/09/2020 TESDA Circular No. 110 series of 2020 Legend: *Description Types - Document Created - Document Amended - Document Superseded --- PDF PAGE 146 --- Training Regulation are available in both printed and electronic copies for more information, please contact: Technical Education and Skills Development Authority (TESDA) Tele Fax No.: 818-7728 or visit our website: www.tesda.gov.ph"
