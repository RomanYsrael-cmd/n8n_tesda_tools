mation\n• Organizing information into a suitable form\nfor reference and use\n• Classify stored information for identification\nand retrieval\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n4 hours\n\n--- PDF PAGE 97 ---\nTR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 93\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Operate the technical information system by\nusing agreed procedures\n6.2 Apply\ninformation\ntechnology (IT)\n• Lecture and discussion on:\n- Attributes and limitations of available\nsoftware tool\n- Procedures and work instructions for the\nuse of IT\n- Operational requirements for IT systems\n- Sources and flow paths of data\n- Security systems and measures that can\nbe used\n- Methods of entering and processing\ninformation\n• Use procedures and work instructions for the\nuse of IT\n• Extract data and format reports\n• Use WWW applications\n• Lecture\n• Group Discussion\n• Self-paced handout/\nmodule\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 hours\n6.3 Edit, format and\ncheck\ninformation\n• Lecture and discussion on:\n- Basic file-handling techniques\n- Techniques in checking documents\n- Techniques in editing and formatting\n- Proof reading techniques\n• Use different techniques in checking\ndocuments\n• Edit and format information applying different\ntechniques\n• Proof read information applying different\ntechniques\n• Lecture\n• Group Discussion\n• Self-paced\nhandout/ module\n• Hands on\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n1 hours\n7. Evaluate\nOccupational\nSafety And\n7.1 Interpret\nOccupational\nSafety and\nHealth practices\n• Discuss the OSH standards, principles and\nlegislations\n• Identify OSH work practices issues\n• Discuss standard safety requirements\n•\nLecture\n•\n