      "source_text": "3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na.\nCourse design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\nb.\nTraining delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\nc.\nTraining can be done on actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology;\nd.\nAssessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\ne.\nAssessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence;\nf.\nTraining program allows for Recognition of Prior Learning (RPL) or current\ncompetencies;\ng.\nTraining completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency – based TVET system recognizes various types of delivery modes,\nboth on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or combination with other modalities\nwhen designing and delivering training programs:\n\n2.1 Institution-Based:\n\n• Dual Training System (DTS)/Dualized training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\n\n--- PDF PAGE 131 ---\nTR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 127\n\nthe deployment of trainees in the workplace is adhered to training\nprograms agreed by the institution and enterprise and status and progress\nof trainees are closely monitored by the training institutions to prevent\nopportunity for work exploitation.\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-\nwork components.\n\n 2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship – is based on training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the\nagreement may be written or oral and the master craftsperson commits\nto training the apprentice in all the skills relevant to his or her trade over\na significant period of time, usually between one and four years, while\nthe apprentice commits to contributing productively to the work of the\nbusiness. Training is integrated into the production process and\napprentices learn by working alongside the experienced craftsperson.\n\n• Enterprise-based Training – where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based\n\n• Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings such\nas barangay hall, basketball courts, etc. These programs can also be\nmobile training program (MTP)."
    },
