wing code of ethics\no Consulting and advising on hair\nmaintenance\no Cleaning, sanitizing, checking and\nstoring materials, supplies, tools and\nequipment\no Following housekeeping, safekeeping\nbookkeeping procedures and 5S\nPrinciples\no Segregating and disposing waste\nmaterials\no Cleaning and preparing workstation\no Recording, filing and storing documents\no Complying with PD 856, RA 9003, FDA\nNotification, DOH, DTI and OSH\nrequirements\no Following Environment Safety Rules\nand Regulations\no Following basic mathematics\n• Lecture/Review\n• Demonstration\n• Video Presentation\n• Self-Learning\n• Case study/\ndemonstration\n• Group\ndemonstration\n• (SLE) Self Learning\nExperienced\n\n• Observation\n• Demonstration with\noral questioning\n• Practical/\nPerformance Test\n• Interview\n\n--- PDF PAGE 130 ---\nTR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 126\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na.\nCourse design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\nb.\nTraining delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\nc.\nTraining can be done on actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology;\nd.\nAssessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\ne.\nAssessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence;\nf.\nTraining program allows for Recognition of Prior Learning (RPL) or current\ncompetencies;\ng.\nTraining completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency – based TVET system recognizes various types of delivery modes,\nboth on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or combination with other modalities\nwhen designing and delivering training programs:\n\n2.1 Institution-Based:\n\n• Dual Training System (DTS)/Dualized training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\n\n--- PDF PAGE 131 ---\nTR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 127\n\nthe deployment of trainees in the workplace is adhered to training\nprograms agreed by the institution and enterprise and status and progress\nof trainees are closely monitored by the training institutions to prevent\nopportunity for work exploitation.\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-\nwork components.\n\n 2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship – is based on training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the\nagreement may be written or oral and the master craftsperson commits\nto training the apprentice in all the skills relevant to his or her trade over\na significant period of time, usually between one and four years, while\nthe apprentice commits to contributing productively to the work of the\nbusiness. Training is integrated into the production process and\napprentices learn by working alongside the experienced craftsperson.\n\n• Enterprise-based Training – where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based\n\n• Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings such\nas barangay hall, basketball courts, etc. These programs can also be\nmobile training program (MTP).\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this program must possess the following\nrequirements:\n\n•\nCompleted at least ten (10) years of basic education or Holder of Alternative\nLearning System (ALS) certificate of completion with grade 10 equivalent;\n•\nBasic communication skills\n\n3.4\nTOOLS, MATERIALS AND EQUIPMENT\n\n--- PDF PAGE 132 ---\nTR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 128\n\nRecommended list of tools, equipment and materials for the training of 20 trainees\nfor HAIRDRESSING NC III.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used as\nalternatives. This also applies in consideration of community practices and their\navailability in the local market.\n\nSUPPLIES AND MATERIALS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n120\nPCS.\nHair clamps\n120\nPCS.\nHair clips\n3\nBOX\nFlat pins (1000 pcs)\n600\nPcs.\nInsulations pads (3’x4’)\n40\nROLLS\nTissue (10meters)\n20\nPCS.\nPowder (100g.)\n3\nGAL\nShampoo (500 ml)\n3\nGAL.\nConditioner (500ml.)\n20\nBOT.\nEthyl 70% Alcohol (500ml.)\n40\nPCS.\nTowel (white) (big) (40cmx70cm)\n20\nPCS.\nTowel (colored) (Big) (40cmx70cm)\n20\nPCS.\nChemical Cape\n20\nPCS.\nCutting cape\n20\nPCS.\nApron (10”x24”)\n3\nB0X\nFace mask (disposable non-woven fabric) (100pcs. per box)\n20\nPCS.\nFace shield\n20\nPCS.\nApplicator brush\n20\nPCS.\nMixing bowl (non-metallic)\n20\nPCS.\nRubber gloves (disposables)\n5\nPCS.\nSqueezer\n20\nPAIRS\nEar Pad (rubber)\n20\nPCS.\nShoulder pad\n10\nROLLS\nAluminum Foil (Hair coloring) (5”x10meters rolls)\n60\nTUBES\nColoring product\n4\nJARS\nBleaching powder (500ml)\n\nDevelopers\n4\nGAL\nNeutralizer 6% (20 volume)\n4\nGAL.\nNeutralizer 9% (30 volume)\n4\nGAL.\nNeutralizer 12% (40 volume)\n40\nBOT.\nPerming solution (120ml)\n40\nBOT.\nNeutralizer\n3\nBOX\nEnd paper (1000 pcs.) (1”x2”)\n20\nPCS.\nShower cap\n10\nPCS.\nDrip pan\n\nTOOLS\n\n--- PDF PAGE 133 ---\nTR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 129\n\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n20\nPCS.\nCutting comb\n20\nPCS.\nWide tooth comb (24.6cmx6cm)\n20\nPCS.\nPaddle brush\n20\nPCS.\nRound brush\n20\nPCS.\nBarber brush\n20\nPCS.\nTail comb\n20\nPCS.\nWater spray gun ((22.0 * 12.0 * 22.0 ( cm ) (.06) kg.)\n\nCUTTING TOOLS\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n20\nPCS.\nCutting scissor/Shear\n20\nPCS.\nThinning scissor/Shear\n20\nPCS.\nRazor blade (disposable)\n5\nPCS.\nClipper\n\nEQUIPMENT\nQTY\nUNIT\nDESCRIPTION/SPECIFICATION\n10\nUNITS\nBlower (25 x 8 x 9 cm ; 299 g 2200 watts)\n10\nPCS.\nFlat iron (ceramic)\n2\nUNITS\nDigital perming machine\n5\nUNITS\nHydraulic chair (L-59 cm, W-54 cm, H- from 51-78cm)\n5\nUNITS\nShampoo bowl and chair\n10\nUNITS\