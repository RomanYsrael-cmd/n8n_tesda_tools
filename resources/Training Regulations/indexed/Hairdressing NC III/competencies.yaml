        "descriptor": "This unit covers the knowledge, skills and attitude in performing advanced/creative hair perming. It involves consulting, assessing and preparing the client, actual performance of Advance and creative Hair Perming, checking of result and doing necessary final touches to achieved optimum result. It includes practicing good, proper and ethical behavior following the code of ethics.",
