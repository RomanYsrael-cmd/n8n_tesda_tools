        "evidence_guide": {
          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Performed skin test prior to application of creative hair \ncoloring following DOH, DTI and OSH guidelines. \n1.2 Checked and analyzed hair and scalp condition prior to \ncreative hair coloring application. \n1.3 Selected and handled appropriate tools, materials and \nimplements according to job requirements with DOH, DTI \nand OSH requirements.  \n1.4 Selected and mixed coloring products and developer \nbased on client’s request outcome following hair coloring \ntechnique, product specifications, manufacturer’s manual \nof instructions. \n1.5 Performed and applied mixed hair coloring following \ncoloring technique and in accordance with established \nadvanced and creative hair coloring procedures and \nproduct specifications following DOH, DTI and OSH \npolicies and procedures. \n1.6 Ensured client’s safety and comfort during the entire \nprocess. \n1.7 Applied appropriate measures in response to emergencies \nor unavoidable circumstances. \n1.8  Performed post-service activities in accordance with \nestablished advanced/creative hair coloring procedures, \nand product specifications following DOH, DTI and OSH \npolices and guidelines. \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 \nModel \n2.2 \nTools, equipment and supplies/materials relevant to the \nactivity to be performed \n2.3 \nWork area/facilities  \n3 Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration with Oral Questioning \n3.2 \nPortfolio \n3.3 \nThird-Party Report \n4. Context of \nAssessment \n4.1 Competency may be assessed in the workplace or TESDA     \naccredited assessment center",
