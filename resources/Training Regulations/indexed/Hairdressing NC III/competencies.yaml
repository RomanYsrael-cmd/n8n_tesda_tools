n7.3 \nKid’s Cut Catalog \n8. \nCreative Haircut styles \nMay include but are not limited to: \n8.1 Layered \n8.1.1 Layered bob \n8.1.2 Increased layers \n8.1.3 Graduated layers \n8.2 Crop cut \n8.3 Round layer \n8.4 Disconnection haircuts \n8.5 Trend setting haircuts \n9. \nShape of Face  \nMay include: \n9.1 Oval    \n9.2  Round  \n9.3  Square \n9.4  Heart  \n9.5  Diamond \n9.6  Inverted/Pear  \n9.7  Rectangular or Elongated \n9.8  Triangular  \n10. Hair Condition \nMay include: \n10.1 Damaged \n10.2 Tinted \n10.3 Lightened \n10.4 Porous \n10.5 Dry \n10.6 Greasy or Oily \n10.7 Normal \n11. Hair Length \nMay include: \n11.1 Short \n11.2 Medium \n11.3 Long \n12. Hair Texture \nMay include: \n12.1 Fine \n12.2 Medium \n12.3 Coarse \n12.4 Wiry \n13. Scalp condition \nMay include: \n13.1 Dry dandruff \n13.2 Oily \n13.3 Normal \n13.4 Dandruff \n13.5 Irritation  \n13.6 Flaking  \n13.7 Post chemical service itch \n13.8 With wounds \n13.9 Greasy or waxy\n\n--- PDF PAGE 68 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          64 \n \nVARIABLE \nRANGE \n14. Established procedures \nin draping client \nMay include but not limited to: \n14.1 Client is draped with bath towel with horizontal edge \nfolded 2 inches outward \n14.2 Protective material is wrapped around the neck \n14.3 Cape for haircutting is wrapped around the shoulder \n15. Established hair \nshampooing and/or \nconditioning procedures  \n \n \nMay include but are not limited to: \n15.1 Comb/brush hair to free from entanglement before \nactual shampooing and/or conditioning  \n15.2 Apply amount of shampoo and/or conditioner \naccording to clients’ hair length and volume, and \ntype of services \n15.3 Apply appropriate water temperature  \n15.4 Follow shampooing and/or conditioning technique \nand procedures \n15.5 Rinse hair thoroughly and towel-dry \n16 Parting and Section \nMay include: \n16.1 Profile \n16.2 Horseshoe \n16.3 Horizontal \n16.4