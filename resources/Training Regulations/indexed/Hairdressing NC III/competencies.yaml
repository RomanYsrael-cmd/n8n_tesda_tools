        "source_text": "--- PDF PAGE 36 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          32 \n \n1.6. Conveyed results of environmental assessment to \nappropriate personnel \n2.  Resource Implications The following resources should be provided: \n2.1  Workplace/Assessment location \n2.2  Legislation, policies, procedures, protocols and local \nordinances relating to environmental protection \n2.3  Case studies/scenarios relating to environmental \nprotection \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1  Written/ Oral Examination \n3.2  Interview/Third Party Reports \n3.3  Portfolio (citations/awards from GOs and NGOs, \ncertificate of  training – local and abroad) \n3.4  Simulations and role-plays \n4.  Context for \nAssessment \n4.1  Competency may be assessed in actual workplace or  \n at the designated TESDA center. \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nUNIT OF COMPETENCY : FACILITATE ENTREPRENEURIAL SKILLS FOR \nMICRO-SMALL-MEDIUM ENTERPRISES (MSMEs) \n \n \n \nUNIT CODE \n: 400311327 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the outcomes required to build, operate and \ngrow a micro/small-scale enterprise.\n\n--- PDF PAGE 37 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          33 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Develop and \nmaintain \nmicro-small-\nmedium \nenterprise \n(MSMEs) \nskills in the \norganization  \n1.1 Appropriate business \nstrategies are determined \nand set for the enterprise \nbased on current and \nemerging business \nenvironment \n1.2 Business operations are \nmonitored and controlled \nfollowing established \nprocedures \n1.3 Quality assurance \nmeasures are \nimplemented consistently \n1.4 Good relations are \nmaintained with \nstaff/workers \n1.5 Policies and procedures \non occupational safety and \nhealth and environmental \nconcerns are constantly \nobserved \n1.1 Business models \nand strategies \n1.2 Types and \ncategories of \nbusinesses \n1.3 Business operation  \n1.4 Basic Bookkeeping \n1.5 Business internal \ncontrols  \n1.6 Basic quality \ncontrol and \nassurance \nconcepts \n1.7 Government and \nregulatory \nprocesses \n \n1.1 Basic \nbookkeeping/ \naccounting skills  \n1.2 Communication \nskills \n1.3 Building relations \nwith customer \nand employees \n1.4 Building \ncompetitive \nadvantage of the \nenterprise \n2. Establish and \nmaintain \nclient-\nbase/market  \n2.1 Good customer relations \nare maintained \n2.2 New customers and \nmarkets are identified, \nexplored and reached out \nto  \n2.3 Promotions/Incentives are \noffered to loyal customers  \n2.4 Additional products and \nservices are evaluated and \ntried where feasible  \n2.5 Promotional/advertising \ninitiatives are carried out \nwhere necessary and \nfeasible                                 \n2.1 Public relations \nconcepts     \n2.2 Basic product \npromotion \nstrategies    \n2.3 Basic market and \nfeasibility studies \n2.4 Basic business \nethics   \n2.1 Building customer \nrelations \n2.2 Individual \nmarketing skills  \n2.3 Using basic \nadvertising \n(posters/ \ntarpaulins, flyers, \nsocial media, etc.)  \n3. Apply \nbudgeting and \nfinancial \nmanagement \nskills   \n3.1 Enterprise is built up and \nsustained through \njudicious control of cash \nflows \n3.2 Profitability of enterprise is \nensured though \nappropriate internal \ncontrols \n3.3 Unnecessary or lower-\npriority expenses and \npurchases are avoided \n3.1 Cash flow \nmanagement \n3.2 Basic financial \nmanagement \n3.3 Basic financial \naccounting \n3.4 Business internal \ncontrols  \n \n3.1 Setting business \npriorities and \nstrategies \n3.2 Interpreting basic \nfinancial \nstatements \n3.3 Preparing \nbusiness plans\n\n--- PDF PAGE 38 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          34 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Business strategies \nMay include: \n1.1. Developing/Maintaining niche market  \n1.2. Use of organic/healthy ingredients   \n1.3. Environment-friendly and sustainable practices  \n1.4. Offering both affordable and high-quality products and \nservices  \n1.5. Promotion and marketing strategies (e. g., on-line \nmarketing) \n2. Business operations  \nMay include: \n2.1 Purchasing  \n2.2 Accounting/Administrative work \n2.3 Production/Operations/Sales \n3. Internal controls \nMay include: \n3.1 Accounting systems \n3.2 Financial statements/reports \n3.3 Cash management \n4. Promotional/Advertising \ninitiatives  \nMay include: \n4.1 \nUse of tarpaulins, brochures, and/or flyers \n4.2 \nSales, discounts and easy payment terms \n4.3 \nUse of social media/Internet \n4.4 \n“Service with a smile” \n4.5 \nExtra attention to regular customers \n \n \n \n \n \n \n \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1   Demonstrated basic entrepreneurial skills \n1.2   Demonstrated ability to conceptualize and plan a \nmicro/small enterprise \n1.3   Demonstrated ability to manage/operate a micro/small-\nscale business   \n2. Resource Implications \nThe following resources should be provided: \n  \n2.1 Simulated or actual workplace \n2.2 Tools, materials and supplies needed to demonstrate \nthe required tasks  \n2.3 References and manuals\n",
