        "source_title": "MAINTAIN A SAFE, CLEAN AND EFFICIENT WORK ENVIRONMENT",
        "source_text": "--- PDF PAGE 55 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          51 \n \nUNIT OF COMPETENCY \n: MAINTAIN A SAFE, CLEAN AND EFFICIENT WORK \nENVIRONMENT \n \n \n \nUNIT CODE \n: SOC514204 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes needed to \nmaintain client relations. The unit incorporates the work safety \nguidelines. It encompasses competencies necessary to \nmaintain a safe workplace for staff, clients and others. It also \ninvolves the application of health regulations, including \npersonal hygiene practiced by staff members, provision of a \ncaring client environment and the efficient operation of the \nsalon. \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Comply with \nhealth \nregulations \n \n1.1 Salon policies and \nprocedures for personal \nhygiene applied \n1.2 Procedures and practices \nimplemented in a variety of \nsalon situations in \naccordance with \ngovernment health \nregulations \n1.1 Government \nHealth Regulations \n1.2 Salon standards \n1.3 Laundry \n1.4 Regular hand \nwashing \n1.5 Appropriate and \nclean clothing \n1.6 Safe handling \ndisposal of linen \nand laundry \n1.7 Appropriate \nhandling and \ndisposal of \ngarbage \n1.8 Cleaning and \nsanitizing \nprocedures \n1.9 Personal hygiene \n1.1 Following \nworkplace \nhygiene \nprocedures in \naccordance with \nsalon standards \nand legal \nrequirements \n1.2 Handling and \nstoring all items \naccording to \nsalon \nrequirements\n\n--- PDF PAGE 56 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          52 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \n REQUIRED \nSKILLS \n2. Assess own \nwork \n \n