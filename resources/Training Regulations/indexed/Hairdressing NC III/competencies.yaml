ructions \n3.7 Following \nestablished \nadvanced/ \ncreative hair \ncoloring \n3.8 Ability to check\n\n--- PDF PAGE 73 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          69 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \n \n \n3.9 Applying first-aid \ntreatments \n3.10 Complying PD \n856, RA 9003, \nFDA, DOH, DTI \nand OSH  \n3.11 Policies and \nprocedures \n3.12 Complying to \ntarget timeline  \n4. Perform post- \nservice \nactivities \n4.1 Client is advised on hair \ncare maintenance in \naccordance with product \nspecification  \n4.2 Tools, products, supplies, \nmaterials and equipment \nare cleaned, sanitized, \nand stored in accordance \nwith Hair Coloring \nprocedures, product \nspecification, \nmanufacturer’s manual \ninstruction, DOH, DTI and \nOSH policies and \nguidelines requirements \n4.3 Wastes material are \nsegregated and disposed \naccording to Sanitation \nCode of the Philippines.  \n4.4 Workplace is cleaned and \nprepared for next service \nactivity \n4.5 Documents are recorded, \nfiled and stored in \naccordance with \ncreative/advanced hair \ncoloring procedures \n \n \n4.1 Codes of Ethic \n4.2 Client consultation \n4.3 Familiarization on \nSalon Policies and \nProcedures, \n4.4 DOH and DTI \nProtocol and \nRequirements \n4.5 OSH Policies and \nProcedures \n4.6 PD 856 (Sanitation \nCode of the \nPhilippines) \n4.7 RA 9003 \n(Ecological Waste \nmanagement \nProgram Act 2000) \n4.8 Environment \nSafety Rules and \nRegulations \n4.9 Basic Mathematics \n4.10 \nHousekeeping \n4.11 \nSafekeeping  \n4.12 \n5S Principles \n4.13 \nBookkeeping \n \n \n \n4.1 Following code of \nethics \n4.2 Filing and \nrecording of \nclient’s record \n4.3 Advising and \napplying hair \ncare \nmaintenance   \n4.4 Filing recording, \nhandling and     \ndocumenting \ninformation of \nproducts, \nmaterials, \nsupplies, tools \nand equipment \n4.5 Following product \nspecifications \n4.6 Handling and \noperating of tools \nand equipment \n4.7 Following \nSafekeeping and \nstoring \nprocedures of \nsupplies, \nmaterials, \nproducts tools \nand equipment  \n4.8 Following \nHousekeeping       \nprocedures and \n5S Principles \n4.9 Cleaning, \nsanitizing and \nstoring tools \nmaterials and \nequipment \n4.10 Complying PD \n856, RA 9003,\n\n--- PDF PAGE 74 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          70 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nFDA, DOH, DTI \nand OSH \npolicies and \nprocedures  \n4.11 Preparing and \nSetting up \nworkplace area \n4.12 Applying first-\naid treatment\n\n--- PDF PAGE 75 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          71 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Supplies and Materials  \nMay include: \n1.1 \nApplicator brush \n1.2 \nMixing Bowl (non-metallic) \n1.3 \nClips \n1.4 \nClamps \n1.5 \nTail comb \n1.6 \nPaddle brush \n1.7 \nRubber gloves \n1.8 \nTowels \n1.9 \nSqueezer \n1.10 \nEar Pads \n1.11 \nShoulder pads \n1.12 \nApron \n1.13 \nChemical Cape  \n1.14 \nTissue Paper \n1.15 \nFace mask \n1.16 \nFoil \n1.17  Cotton \n1.18  Shampoo \n1.19  Conditioner  \n1.20 Bleaching powder \n1.21  Coloring products    \n1.22  Developers \n        1.22.1    1.5% -5 volume \n        1.22.2    3%-10 volume \n        1.22.3    6%-20 volume \n        1.22.4    9%-30 volume \n        1.22.5    12%-40 volume \n2. Tools and Equipment \nMay include but not limited to: \n2.1 \nBlower \n2.2 \nStraightening iron \n2.3 \nUltraviolet lamp or Ultraviolet sterilizer \n3. Color product forms \nMay include:  \n3.1 \nCream \n3.2 \nLiquid  \n3.3 \nHenna wax \n4. Personal Protective \nEquipment (clothing \nand materials) \nMay include but not limited to: \n4.1    Ear Pads \n4.2    Shoulder pads \n4.3 \nTowels \n4.4 \nApron \n4.5 \nChemical cape \n4.6 \nRubber Gloves \n4.7 \nFace shield \n4.8 \nFace mask\n\n--- PDF PAGE 76 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          72 \n \nVARIABLE \nRANGE \n5. Workstation \nMay include: \n5.1 \nClient chair \n5.2 \nShampoo bowl and chair \n5.3 \nMirror \n5.4 \nTowel \n5.5 \nTrolley \n5.6 \nCape and apron \n5.7 \nShampoo and conditioner \n5.8 \nTrash Bin \n6. Hair Texture \nMay include: \n6.1. \nFine \n6.2. \nMedium \n6.3. \nCoarse \n6.4. \nWiry \n7. Hair Length \nMay include: \n7.1 \nShort \n7.2 \nMedium \n7.3 \nLong \n8. Type of Hair \nMay include: \n8.1 \nStraight \n8.2 \nCurly \n8.3 \nWavy \n9. Hair Condition \nMay include: \n9.1 \nTinted \n9.2 \nLightened \n9.3 \nPorous \n9.4 \nDry \n9.5 \nGreasy or Oily \n9.6 \nNormal \n9.7 \nChemically treated  \n10. \nScalp condition \nMay include: \n10.1 Dry dandruff \n10.2 Oily \n10.3 Normal \n10.4 Dandruff \n10.5 Irritation  \n10.6 Flaking  \n10.7 Post chemical service itch \n10.8 With wounds \n10.9 Greasy or waxy \n11. Color Options \nMay include: \n11.1 Semi - permanent              \n11.2 Demi -Permanent   \n11.3 Permanent  \n11.4 Metallic dyes  \n12. Coloring Technique \nMay include: \n12.1 Foiling Technique \n12.2 Monochromatic technique/Dimension  \n12.3 Ombre Coloring technique\n\n--- PDF PAGE 77 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          73 \n \nVARIABLE \nRANGE \n12.4 Balayage Technique              \n13. Established Draping \nProcedures  \nMay include: \n13.1 Client is draped with bath towel with horizontal \nedge folded 2 inches outward \n13.2   Protective material is wrapped around the neck \n13.3   Coloring cape is wrapped around the shoulder \n14. Styling Products \nMay include: \n14.1 Gel \n14.2 Hair wax (wet and dry wax) \n14.3 Hair serum \n14.4 Hair spray \n14.5 Mousse \n14.6 Leave-on conditioners \n14.7 Fiber gum \n15. Established \nCreative/Advanced Hair \nColoring Procedures  \nMay include: \n15.1 Parting and Section hair  \n15.2 Sub-section hair and follow application techniques \n15.3 Apply Coloring Techniques, following product \nspecification, manufacturer’s manual of \ninstructions \n15.4 Check evenness of color through hair strand test. \nand expose to proper lighting following the \nrequired development time \n15.5 Rinse hair with shampoo and conditioner    \n16. Hair care and \nmaintenance  \nMay include \n16.1 Shampoo and condition hair regularly \n16.2 Leave-in or leave-on conditioner treatment \n16.3 Finishing/styling product \n16.4 Hair treatments  \n17. Waste Materials \nMay include: \n17.1 Biodegradable  \n17.2 Non-biodegradable\n\n--- PDF PAGE 78 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          74 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Performed skin test prior to application of creative hair \ncoloring following DOH, DTI and OSH guidelines. \n1.2 Checked and analyzed hair and scalp condition prior to \ncreative hair coloring application. \n1.3 Selected and handled appropriate tools, materials and \nimplements according to job requirements with DOH, DTI \nand OSH requirements.  \n1.4 Selected and mixed coloring products and developer \nbased on client’s request outcome following hair coloring \ntechnique, product specifications, manufacturer’s manual \nof instructions. \n1.5 Performed and applied mixed hair coloring following \ncoloring technique and in accordance with established \nadvanced and creative hair coloring procedures and \nproduct specifications following DOH, DTI and OSH \npolicies and procedures. \n1.6 Ensured client’s safety and comfort during the entire \nprocess. \n1.7 