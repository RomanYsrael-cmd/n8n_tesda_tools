          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Prepare \nworkstation \n1.1 Appropriate supplies, \nmaterials, tools and \nequipment are selected, \nchecked, prepared, \nsanitized and recorded in \naccordance with Creative \nhair coloring procedures, \nproduct specification, \nDOH, DTI and OSH \npolicies and guidelines \n1.2 Appropriate color \nproduct forms are \nchecked and prepared in \naccordance with Creative \nhair coloring procedures \nand product specifications \n1.3 Personal Protective \nEquipment \n(clothing/materials) is \nused in accordance with \nadvance and creative hair \ncoloring procedures, \nDOH, DTI and OSH \npolicies and guidelines \n1.4 Workstation is prepared, \nidentified, checked and \nsanitized in accordance \nwith Creative hair coloring \nprocedures, DOH, DTI \nand OSH policies and \nguidelines \n1.5 Safety practices are \nfollowed in accordance \nwith DOH, DTI and OSH \npolicies and guidelines \n \n \n1.1 Code of Ethics \n1.2 Time Management \n1.3 Familiarization on \nsalon policies and \nprocedures, \n1.4 Familiarization on \nForms and \nRecords of \nmaterials, \nsupplies, tools and \nequipment \n1.5 Familiarization of \nProduct \nSpecifications \n1.6 PD 856 (Sanitation \ncode of the \nPhilippines) \n1.7 RA 9003 \n(Ecological Waste \nmanagement \nprogram Act 2000) \n1.8 FDA Notification \n1.9 DOH and DTI \nProtocol and \nRequirements \n1.10 OSH policies and \nguidelines \n1.11 5S principles \n1.12 Environment \nSafety rules and \nRegulations   \n1.13 Basic \nMathematics \n1.14 Methods of \nSanitation \n1.15 Kinds of \nmaterials, \n1.1 Following code of \nethics \n1.2 Preparing client’s \nrecord \ninformation \n1.3 Following product \nspecifications \n1.4 Interpersonal and \nintrapersonal \nskills \n1.5 Reporting, \nhandling and \ndocumenting \ninformation of \nproducts, \nmaterials, \nsupplies, tools \nand equipment \n1.6 Applying \nMethods of \nSterilization, \nSanitation and \nSanitary Rules \n1.7 Ability to check \n1.8 Complying with \nPD 856, RA \n9003, FDA \nnotification, DOH, \nDTI and OSH, \npolicies and \nguidelines \n1.9 Applying first-aid \ntreatment\n\n--- PDF PAGE 71 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          67 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \nsupplies, tools \nand equipment \n1.16 Kinds and Forms \nof Coloring \nProducts \n1.17 Different Kinds of \nDeveloper and \ntheir Uses  \n1.18 Providing of PPE \n(Clothing/ \nmaterials) \n1.19 First-aid \ntreatment \n2.   Prepare \nclient \n2.1 Client is consulted for \npossible skin allergies in \naccordance with advance \nand creative hair coloring \nprocedures, DOH and \nOSH polices and \nguidelines \n2.2 Color chart is presented to \nthe client and color is \nselected and agreed upon \nby both parties \n2.3 Client’s hair texture, \nlength, type, condition \nand scalp condition are \nanalyzed, recognized, \nchecked and recorded in \naccordance with \nadvanced and creative \nhair coloring procedures \n2.4 Hair is checked for \nappropriate color option \napplication in accordance \nwith advanced and \ncreative hair coloring \nprocedures \n2.5 Coloring technique are \npresented and selected \naccording to client’s \nrequest in accordance \nwith creative hair coloring \nprocedures \n2.6 Client is advised to \nremove all personal \naccessories \n2.7 Protective clothing and   \nmaterials are provided in \naccordance with \n2.1 Codes of Ethic \n2.2 Client consultant \n2.3 Familiarization on \nclient’s Forms and \nRecords  \n2.4 DOH and DTI \nProtocol and \nRequirements \n2.5 OSH Policies and \nProcedures \n2.6 PD 856 (Sanitation \nCode of the \nPhilippines) \n2.7 RA 9003 \n(Ecological Waste \nmanagement \nProgram Act 2000) \n2.8 Environment \nSafety Rules and \nRegulations \n2.9 Basic Mathematics \n2.10 Skin Test \nProcedures \n(