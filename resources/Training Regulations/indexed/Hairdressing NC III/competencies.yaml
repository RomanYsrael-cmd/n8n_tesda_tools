          {
            "number": 2,
            "title": "Prepare client",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "Safety practices are followed in accordance with FDA, DOH, DTI and OSH policies and guidelines",
                "source_number": "1.6"
              },
              {
                "number": "2.2",
                "text": "Hair catalogue is presented to the client and types of hair curls is selected and agreed upon by both parties",
                "source_number": "2.1"
              },
              {
                "number": "2.3",
                "text": "Client’s hair texture, length, type and condition are analyzed, recognized, checked and recorded in accordance with advanced and creative hair perming procedures",
                "source_number": "2.2"
              },
              {
                "number": "2.4",
                "text": "Client’s Scalp condition is checked recognized and recorded if free from scratches open wounds and determined allergies and irritation following advance and creative hair perming procedures",
                "source_number": "2.3"
              },
              {
                "number": "2.5",
                "text": "Client is consulted on Creative Perm Style to be used in accordance with advance hair perming procedures",
                "source_number": "2.4"
