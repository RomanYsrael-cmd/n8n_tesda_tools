        "source_title": "PERFORM ADVANCED AND CREATIVE HAIR PERMING",
        "source_text": "--- PDF PAGE 79 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          75 \n \nUNIT OF COMPETENCY : PERFORM ADVANCED AND CREATIVE HAIR \nPERMING \n \n \n \nUNIT CODE \n: SOC514310 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitude in \nperforming advanced/creative hair perming. It involves \nconsulting, assessing and preparing the client, actual \nperformance of Advance and creative Hair Perming, \nchecking of result and doing necessary final touches to \nachieved optimum result. It includes practicing good, proper \nand ethical behavior following the code of ethics. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Prepare \nworkstation \n1.1 Appropriate supplies, \nmaterials and tools are \nselected, checked, \nprepared, sanitized, and \nrecorded in accordance \nwith Advanced and \nCreative Hair perming \nprocedures, product \nspecification, DOH, DTI \nand OSH policies and \nguidelines \n1.2 Appropriate equipment is \nprepared, set, checked, \nsanitized, and in \naccordance with \nAdvanced and Creative \nHair perming procedures, \nproduct specification, \nDOH, DTI and OSH \npolicies and guidelines \n1.3 Perming products are \nchecked and prepared in \naccordance with \nadvanced and creative \nhair perming procedures \nand product specifications \n1.4 Personal Protective \nEquipment \n(clothing/material) are \nused in accordance with \nadvanced hair perming \nprocedures, DOH, DTI \nand OSH policies and \nguidelines \n1.5 Workstation is prepared, \nchecked and sanitized in \n1.1 Code of Ethics \n1.2 Familiarization on \nsalon policies and \nprocedures, \n1.3 Familiarization of \nForms and \nRecords materials, \nsupplies, tools and \nequipment \n1.4 Familiarization of \nProduct \nSpecifications \n1.5 Pd. 856 (Sanitation \nCode of the \nPhilippines) \n1.6 RA 9003 \n(Ecological Waste \nmanagement \nprogram Act of \n2000) \n1.7 FDA Notification \n1.8 DOH and DTI \nProtocol and \nRequirements \n1.9 OSH policies and \nguidelines \n1.10 5S Principles \n1.11 Environment \nSafety Rules and \nRegulations  \n1.12 Basic \nMathematics \n1.13 Supplies, \nmaterials and \ntools \n1.1 Following code of \nethics \n1.2 Following product \nspecifications \n1.3 Interpersonal and \nintrapersonal skills \n1.4 Checking, handling \nand documenting \ninformation of \ntools, products, \nmaterials, and \nsupplies \n1.5 Checking and \nSetting of \nMachine/ \n1.6 Equipment \n1.7 Applying Methods \nSanitation and \nSanitary Rules \n1.8 Complying with PD \n856, RA 9003, \nFDA, DOH, DTI \nand OSH policies \nand guidelines\n\n--- PDF PAGE 80 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          76 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \naccordance with Creative \nhair coloring procedures, \nDOH, DTI and OSH \npolicies and guidelines \n1.6 Safety practices are \nfollowed in accordance \nwith FDA, DOH, DTI and \nOSH policies and \nguidelines \n1.13.1 Kinds and \nUses \n1.14 Hair Perming \nproducts \n1.14.1 Kinds and \nUses \n1.15 Hair perming \nMachine (manual \nof instructions) \n1.16 Methods of \nSanitation \n1.17 5S Principles \n1.18 Providing of PPE \n(clothing/ \nmaterials) \n2. Prepare \nclient \n2.1 Hair catalogue is \npresented to the client \nand types of hair curls is \nselected and agreed upon \nby both parties \n2.2 Client’s hair texture, \nlength, type and \ncondition are analyzed, \nrecognized, checked and \nrecorded in accordance \nwith advanced and \ncreative hair perming \nprocedures \n2.3 Client’s Scalp condition \nis checked recognized \nand recorded if free from \nscratches open wounds \nand determined allergies \nand irritation following \nadvance and creative hair \nperming procedures \n2.4 Client is consulted on \nCreative Perm Style to \nbe used in accordance \nwith advance hair perming \nprocedures \n2.5 Built of the client is \nassessed for appropriate \nsize of drapery in \naccordance with advance. \nCreative hair perming \nprocedures \n2.6 Client Personal Protective \nEquipment (clothing/ \nmaterial) are provided in \n2.1 Code of Ethics \n2.2 Client consultation \n2.3 Familiarization on \nSalon Policies and \nProcedures \n2.4 Familiarization of \nclient’s Forms and \nRecords \n2.5 PD 856 (Sanitation \nCode of the \nPhilippines) \n2.6 RA. 9003 \n(Ecological Waste \nManagement \nprogram Act of \n2000)  \n2.7 DOH and DTI \nProtocol and \nRequirements \n2.8 OSH Policies and \nGuidelines \n2.9 Environment \nSafety Rules and \nRegulations \n2.10 Basic Mathematics \n2.11 Hair Analysis  \n2.11.1 Texture \n2.11.2 Type \n2.11.3 Length \n2.11.4 Condition \n2.12 Scalp Analysis \n2.13 Using PPE \n(clothing/materials) \n2.14 First-Aid \n \n \n2.1 Following code of \nethics \n2.2 Interpersonal and \nintra-personal \nSkills \n2.3 Filing and \nrecording client’s \ninformation \n2.4 Consulting skin \nallergies \n2.5 Checking \nAnalyzing and \nrecording hair \nand scalp \n2.6  Applying \nshampoo and \nperforming \nshampooing/con\nditioning \nprocedures \n2.7  Performing Hair \nDraping \nProcedures \n2.8  Ability to check \n2.9  Complying with \nPD 856, RA \n9003, DOH, DTI \nand OSH policies \nand procedures  \n2.10 Applying first-\naid treatments\n\n--- PDF PAGE 81 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          77 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \naccordance with \nadvanced hair perming \nprocedures, DOH, DTI \nand OSH policies and \nguidelines \n2.7 Client is advised to \nremove all personal \naccessories \n2.8 Chemically treated hair \nis determined in order to \napply appropriate hair \ntreatment in accordance \nwith advanced and \ncreative hair coloring \nprocedures, product \nspecification \n2.9 Where necessary, client is \nadvised to defer hair \nperming based on \nadverse scalp and health \nconditions \n2.10 Where necessary, first aid \ntreatment is provided to \nclient or refers to \nappropriate health \npersonnel \n3. Perm hair \n3.1 Supplies, materials and \ntools, are checked and \nused in accordance with \nadvanced and creative \nhair perming procedures, \nDOH, DTI and OSH \npolices and guidelines \n3.2 Perming machine/ \nequipment are checked, \nand operated in \naccordance with \nadvanced and creative \nhair perming procedures, \nmanufacturer’s manual of \ninstructions, FDA \nnotification, DOH, DTI and \nOSH policies and \nguidelines \n3.3 Perm solution is checked, \nused and applied and hair \nperming is performed in \naccordance with \nestablished advanced \nand creative hair \n3.1 Code of Ethics \n3.2 Time Management \n3.3 Compliance to \nProduct \nSpecifications \n3.4 Compliance \nOperations Manual \nof Equipment \n3.5 Compliance to the \nappropriate tools \nand materials \n3.6 PD 856 (Sanitation \nCode of the \nPhilippines) \n3.7 RA 9003 \n(Ecological Waste \nmanagement \nProgram Act of \n2000) \n3.8 DOH and DTI \nProtocol and \nRequirements \n3.9 OSH Policies and \nGuidelines \n3.1 Following code of \nethics \n3.2 Interpersonal and \nintra-personal \nSkills \n3.3 Handling of \nproducts, \nmaterials, \nsupplies, tools \nand equipment \n3.4 Performing hair \nSectioning and \nwinding \ntechniques \n3.5 Following product \nspecifications \n3.6 Operating and \nfollowing perming \nmachine and \nmanufacturer’s \nmanual of \ninstructions \n3.7 Applying \nshampooing and\n\n--- PDF PAGE 82 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          78 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nperming procedures, \nproduct specification, FDA \nnotification, DOH, DTI and \nOSH policies and \nguidelines \n3.4 Perm hair result is \nchecked according to \nperm requirements or \noutcome following product \nspecification, \nmanufacturer’s manual of \ninstruction and  \nin accordance with \nadvanced and creative \nhair perming procedures \nand FDA notification \n3.5 Client’s safety and \ncomfort are ensured \nduring the entire process \nin accordance with DOH, \nDTI and OSH policies and \nprocedures \n3.6 Where necessary, first-aid \ntreatment is provided to \nthe client or referred to \nhealth personnel \n3.10 Environmental \nSafety Rules and \nRegulations \n3.11 Basic Mathematics \n3.12 Perming Products  \n3.13 Perming \nmachines/ \nequipment \nmanufacturer’s \nmanual of \ninstruction  \n3.14 Hair sectioning, \nblocking, and \npatterns \n3.15 Kinds and Sizes of \nCurling Rod  \n3.16 Winding \ntechniques \n3.17 Different Creative \nPerming Style \n3.18 Machine perming \nProcedures and \nTechnique \n3.19 Operating Perming \nmachine/ \nequipment \nperforming blow-\ndrying techniques \n3.8 Following and \nperforming \nestablished \nadvanced/ \ncreative hair \nperming \nprocedures \n3.9 Ability to check \n3.10 Complying PD \n856, RA 9003, \nDOH, DTI and \nOSH policies and \nprocedures  \n3.11 Following \ntimeline \nrequirements \n3.12 Applying first-aid \ntreatments \n \n4. Apply \nfinishing \ntouches \n \n4.1 If necessary, hair is \ntapered / trimmed and \nstyled in accordance with \nhaircutting procedures \nand advanced hair \nperming procedures \n4.2 Client’s hair is checked, \nused, applied and styled \nwith finishing products \nin accordance with \nadvanced hair perming \nprocedures following \nDOH, DTI and OSH \npolicies and guidelines \n4.3 Client’s satisfaction is \nconfirmed and \nadjustments are made if \nrequired \n4.1 Code of Ethics \n4.2 Time Management \n4.3 Familiarization of \nfinishing product \nSpecifications \n4.4 PD 856 (Sanitation \nCode of the \nPhilippines) \n4.5 RA 9003 \n(Ecological Waste \nmanagement \nProgram Act of \n2000) \n4.6 FDA notification \n4.7 DOH and DTI \nProtocol and \nRequirements \n4.8 OSH Policies and \nGuidelines \n4.9 Environmental \nSafety Rules and \nRegulations \n4.10 Basic \nMathematics \n4.11 Hair Analysis  \n4.1 Following Code \nof Ethics \n4.2 Interpersonal and \nintra-personal \nSkills \n4.3 Handling and \nFollowing \nfinishing product \nspecifications \n4.4 Performing \nTrimming and \nTexturizing \ntechnique \n4.5 Ability to check \n4.6 Complying DFA, \nDOH, DTI and \nOSH policies and \nprocedures \n4.7 Applying first-aid \ntreatments\n\n--- PDF PAGE 83 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          79 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.12 Haircutting \nprocedures \n4.13 Finishing \nproducts  \n5. Perform post- \nservice \nactivities \n5.1 Client is advised on hair \ncare maintenance in \naccordance with \nadvanced and creative \nHair Perming procedures, \nproduct specification \n5.2 Tools, materials, supplies \nand equipment are \ncleaned, sanitized, \nsterilized and stored in \naccordance with \nadvanced/creative Hair \nPerming procedures, \nmanufacturer’s manual \ninstruction, FDA \nnotification, DOH, DTI and \nOSH policies and \nguidelines \n5.3 Wastes material are \nsegregated and disposed \naccording to Sanitation \nCode of the Philippines \n5.4 Workplace is cleaned and \nprepared for next service \nactivity in accordance to \nDOH, DTI and OSH \npolicies and guidelines \n5.5 Documents are recorded, \nfiled and stored in \naccordance with \nadvanced and creative \nhair perming procedures \n \n \n5.1 Code of Ethics \n5.2 Client consultation \n5.3 Time Management \n5.4 Familiarization on \nSalon Policies and \nProcedures \n5.5 Familiarization of \nSalon Forms and \nRecords of \nsupplies, \nmaterials, tools \nand equipment \n5.6 Compliance to \nSalon Operations \n5.7 Compliance to \nOperations Manual \nof Equipment \n5.8 PD 856 (Sanitation \nCode of the \nPhilippines) \n5.9 RA 9003 \n(Ecological Waste \nmanagement \nProgram Act of \n2000) \n5.10 DOH and DTI \nProtocol and \nRequirements \n5.11 OSH Policies and \nGuidelines \n5.12 5S Principles \n5.13 Environmental \nSafety Rules and \nRegulations \n5.14 Basic Mathematics \n5.15 Hair Analysis  \n5.16 Hair maintenance  \n5.17 Storage of Tools, \nsupplies, Materials \nand Equipment \n5.18  Housekeeping \n5.19  Safekeeping \n5.20  Bookkeeping \n \n5.1. Following code of \nethics \n5.2. Filing and \nrecording of \nclient’s \ndocuments \n5.3. Filing recording, \nhandling       \ndocumenting \ninformation and \nstoring \ninformation of \nproducts, \nmaterials, \nsupplies, tools \nand equipment \n5.4. Following and \napplying Methods \nof Sterilization \nand Sanitation  \n5.5. Advising client on \nhair care \nmaintenance \n5.6. Checking of \nequipment \n5.7. Following \nSafekeeping \nprogram of tools \nand equipment \n5.8. Following \nHousekeeping       \nprocedures \n5.9. Complying PDA \n856, RA 9003, \nFDA notification, \nDOH, DTI and \nOSH policies and \nguidelines \n5.10. Preparing and \nSetting up \nworkplace \n5.11. Applying first-\naid treatment  \n \n \nRANGE OF VARIABLES\n\n--- PDF PAGE 84 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          80 \n \n \nVARIABLE \nRANGE \n1. Supplies Materials \nMay include: \n1.1 Shampoo \n1.2 Perm solution \n1.3 Neutralizer \n1.4 Conditioner \n1.5 End Paper \n1.6 Powder \n1.7 Tissue paper \n1.8 Cotton \n1.9 Disposable Gloves \n1.10 Applicator brush \n1.11 Shower cap \n1.12 Chemical Cape \n1.13 Apron \n1.14 Towel (big) \n1.15 Drip pan \n1.16 Hair clips \n1.17 Clamp \n1.18 Ear pads  \n1.19 Mask \n1.20 Insulations pads \n1.21 Flat pins \n2. Tools  \nMay include: \n2.1 Curler/Curling rods \n2.2 Large Tooth Comb \n2.3 Tail Comb \n2.4 Wide tooth comb \n2.5 Paddle brush \n3. Equipment \nMay include but not limited to: \n3.1 Digital perming \n3.2 Air perming  \n3.3 Hair blower \n3.4 Ultraviolet lamp or Ultraviolet sterilizer \n4. Personal Protective \nEquipment \n(clothing/materials) \nMay include but not limited to: \n4.1 Aron \n4.2 Chemical cape \n4.3 Face mask \n4.4 Disposable gloves \n4.5 Towel \n4.6 Shoulder cape \n4.7 Face shield \n5. Workstation \nMay include: \n5.1 Client chair \n5.2 Shampoo bowl and chair \n5.3 Mirror\n\n--- PDF PAGE 85 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          81 \n \nVARIABLE \nRANGE \n5.4 Towel \n5.5 Trolley \n5.6 Chemical Cape  \n5.7 Apron \n5.8 Shampoo and conditioner \n5.9 Bin \n6. Types of hair curls \nMay include: \n6.1 Wavy \n6.2 Curly \n6.3 Frizzy \n7. Hair Texture \nMay include: \n7.1 Fine \n7.2 Medium \n7.3 Coarse \n8. Hair Length \nMay include: \n8.1   Short \n8.2   Medium \n8.3   Long \n9. Hair Condition \nMay include: \n9.1 Damaged \n9.2 Tinted \n9.3 Lightened \n9.4 Porous \n9.5 Dry \n9.6 Greasy or Oily \n9.7 Normal \n10. Scalp condition \nMay include: \n10.1   Dry dandruff \n10.2   Oily \n10.3   Normal \n10.4   Dandruff \n10.5   Irritation  \n10.6   Flaking  \n10.7   Post chemical service itch \n10.8   With wounds \n10.9   Greasy or waxy \n11. Built of the client \nMay include: \n11.1 Small \n11.2 Medium \n11.3 Large \n11.4 Extra Large  \n12. Creative Perm Style \nMay include: \n12.1 Digital Perming  \n12.2 Air perming \n13. Chemically Treated \nHair \nMay include: \n13.1    Straightened \n13.2    Permed \n13.3    Colored  \n13.4    Bleached\n\n--- PDF PAGE 86 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          82 \n \n \nVARIABLE \nRANGE \n14. Established Hair \nCreative and Advanced \nHair Perming \nprocedures  \nMay include: \n14.1 Shampoo hair without conditioner and without \nscratching the scalp. \n14.2 Towel -dry, section and wind hair according to    \nselected type of hair curls Creative Hair Perm \nStyle and apply selected perm solution and \nprocess according to product specification and \nmanufacturer’s manual of instruction. \n14.3 Used and operate machine/equipment following \nperming technique and manufacturer’s manual of \ninstruction  \n14.4 Check progress of wave from time to time to \nachieve optimum result, following product and \nmanufacturer’s manual procedures. \n14.5 Rinse thoroughly without removing the curlers and \ntowel blot according to creative hair perming style \nprocedures or following product and machine \nspecification and manufacturer’s manual of \ninstruction \n14.6 Apply hair with neutralizer and leave-on on \nspecified time or follow creative hair perming style \nfollowing product and machine specification and \nmanufacturer’s manual of instruction. \n14.7 Remove curlers / rollers and slightly   manipulate \nhair and scalp to relax \n14.8 Shampoo and condition hair thoroughly, rinse and \ntowel-dry  \n14.9 Styled according to agreed advanced/creative hair \nperming procedures. \n15. Finishing products \nMay include: \n15.1 Hair Serum \n15.2 Mousse \n16. Hair care and \nmaintenance  \nMay include:   \n16.1   Use of wide toothed comb \n16.2   Application of hair polishing products \n16.3 Daily hair wash with appropriate shampoo and \nconditioner \n16.4 Regular hair treatment \n17.  Waste materials \nMay include: \n17.1 Biodegradable \n17.2 Non-biodegradable\n\n--- PDF PAGE 87 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          83 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \n Assessment requires evidence that the candidate: \n1.1    Consulted and prepared client and selected on chosen \ntypes of creative perm style. \n1.2    Assessed hair and scalp condition as free from \nscratches and open wounds. \n1.3    Provided personal protective (clothing/materials) to \nclient in accordance with advanced/creative hair \nperming procedures following DOH, DTI and OSH \nrequirement. \n1.4    Selected and prepared perming products according to \nclient’s requirements and product specifications \n1.5    Performed and applied advanced and creative hair \nperming products in accordance with established \ncreative hair perming procedures, product \nspecifications following FDA notification, DOH, DTI \nand OSH policies and guidelines. \n1.6    Applied finishing touches on hair according to client’s \nrequirements. \n1.7    Ensured clients safety and comfort throughout the \nprocess. \n1.8    Applied appropriate measures in response to \nemergencies or unavoidable circumstances. \n1.9    Performed post-service activities in accordance to \ncreative hair perming procedures following DOH, DTI \nand OSH policies and guidelines. \n2. Resource Implications \nThe following resources should be provided: \n2.1 Model \n2.2    Tools, equipment and supplies/materials relevant to \nthe activity to be performed \n2.3    Work area/facilities \n3. Method of assessment Competency in this unit may be assessed through the \nfollowing: \n3.1  Demonstration with Oral Questioning \n3.2  Portfolio \n3.3     Third-Party Report \n4. Context of \nassessment \n4.1    Competency may be assessed in the workplace or \nTESDA accredited assessment center\n",
