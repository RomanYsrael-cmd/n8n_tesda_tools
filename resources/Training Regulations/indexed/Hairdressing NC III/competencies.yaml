        "source_text": "--- PDF PAGE 13 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          9 \n \nUNIT OF COMPETENCY : APPLY CRITICAL THINKING AND PROBLEM-SOLVING \nTECHNIQUES IN THE WORKPLACE \n \n \n \nUNIT CODE \n: 400311321 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required \nto solve problems in the workplace including the application \nof problem-solving techniques and to determine and resolve \nthe root cause/s of specific problems in the workplace. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1 Examine \nspecific \nworkplace \nchallenges \n1.1 Variances are examined \nfrom normal operating \nparameters and product \nquality \n1.2 Extent, cause and nature of \nthe specific problem are \ndefined through \nobservation, investigation \nand analytical techniques \n1.3 Problems are clearly stated \nand specified \n1.1 Competence \nincludes a thorough \nknowledge and \nunderstanding of \nthe process, normal \noperating \nparameters, and \nproduct quality to \nrecognize non-\nstandard situations \n1.2 Competence to \ninclude the ability to \napply and explain, \nenough for the \nidentification of \nfundamental causes \nof specific \nworkplace \nchallenges \n1.3 Relevant equipment \nand operational \nprocesses \n1.4 Enterprise goals, \ntargets and \nmeasures \n1.5 Enterprise quality \nOHS and \nenvironmental \nrequirement \n1.6 Enterprise \ninformation systems \nand data collation \n1.7 Industry codes and \nstandards \n1.1 Using range of \nanalytical \ntechniques (e.g., \nplanning, \nattention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation) in \nexamining specific \nchallenges in the \nworkplace \n1.2 Identifying extent \nand causes of \nspecific \nchallenges in the \nworkplace \n \n2 Analyze the \ncauses of \nspecific \nworkplace \nchallenges \n2.1  Possible causes of \nspecific problems are \nidentified based on \nexperience and the use of \n2.1  Competence \nincludes a thorough \nknowledge and \nunderstanding of \nthe process, normal \n2.1 Using range of \nanalytical \ntechniques (e.g., \nplanning, \nattention,\n\n--- PDF PAGE 14 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          10 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nproblem solving tools / \nanalytical techniques \n2.2  Possible cause \nstatements are developed \nbased on findings \n2.3  Fundamental causes are \nidentified per results of \ninvestigation conducted \noperating \nparameters, and \nproduct quality to \nrecognize non-\nstandard situations \n2.2  Competence to \ninclude the ability to \napply and explain, \nsufficient for the \nidentification of \nfundamental cause, \ndetermining the \ncorrective action \nand provision of \nrecommendations \n2.3  Relevant equipment \nand operational \nprocesses \n2.4  Enterprise goals, \ntargets and \nmeasures \n2.5  Enterprise quality \nOSH and \nenvironmental \nrequirement \n2.6  Enterprise \ninformation systems \nand data collation \n2.7  Industry codes and \nstandards \nsimultaneous and \nsuccessive \nprocessing of \ninformation) in \nexamining \nspecific \nchallenges in the \nworkplace \n2.2 Identifying extent \nand causes of \nspecific \nchallenges in the \nworkplace \n2.3 Providing clear-\ncut findings on \nthe nature of \neach identified \nworkplace \nchallenges \n3 Formulate \nresolutions \nto specific \nworkplace \nchallenges \n3.1 All possible options are \nconsidered for resolution of \nthe problem \n3.2 Strengths and weaknesses \nof possible options are \nconsidered \n3.3 Corrective actions are \ndetermined to resolve the \nproblem and possible future \ncauses \n3.4 Action plans are \ndeveloped identifying \nmeasurable objectives, \nresource needs and \ntimelines in accordance \nwith safety and operating \nprocedures \n3.1 Competence to \ninclude the ability to \napply and explain, \nsufficient for the \nidentification of \nfundamental cause, \ndetermining the \ncorrective action \nand provision of \nrecommendation \n3.2 Relevant equipment \nand operational \nprocesses \n3.3 Enterprise goals, \ntargets and \nmeasures \n3.4 Enterprise quality \nOSH and \nenvironmental \nrequirement \n3.1 Using range of \nanalytical \ntechniques (e.g., \nplanning, attention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation) in \nexamining specific \nchallenges in the \nworkplace \n3.2 Identifying extent \nand causes of \nspecific challenges \nin the workplace \n3.3 Providing clear-cut \nfindings on the \nnature of each \nidentified\n\n--- PDF PAGE 15 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          11 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.5 Principles of \ndecision-making \nstrategies and \ntechniques \n3.6 Enterprise \ninformation systems \nand data collation \n3.7 Industry codes and \nstandards \nworkplace \nchallenges \n3.4 Devising, \ncommunicating, \nimplementing and \nevaluating \nstrategies and \ntechniques in \naddressing specific \nworkplace \nchallenges \n4 Implement \naction plans \nand \ncommunicate \nresults \n4.1 Action plans are \nimplemented and evaluated \n4.2 Results of plan \nimplementation and \nrecommendations are \nprepared \n4.3 Recommendations are \npresented to appropriate \npersonnel \n4.4 Recommendations are \nfollowed-up, if required \n4.1 Competence to \ninclude the ability to \napply and explain, \nsufficient for the \nidentification of \nfundamental cause, \ndetermining the \ncorrective action \nand provision of \nrecommendations \n4.2 Relevant equipment \nand operational \nprocesses \n4.3 Enterprise goals, \ntargets and \nmeasures \n4.4 Enterprise quality, \nOSH and \nenvironmental \nrequirement \n4.5 Principles of \ndecision-making \nstrategies and \ntechniques \n4.6 Enterprise \ninformation systems \nand data collation \n4.7 Industry codes and \nstandards \n4.1 Using range of \nanalytical \ntechniques (e.g., \nplanning, attention, \nsimultaneous and \nsuccessive \nprocessing of \ninformation) in \nexamining specific \nchallenges in the \nworkplace \n4.2 Identifying extent \nand causes of \nspecific challenges \nin the workplace \n4.3 Providing clear-cut \nfindings on the \nnature of each \nidentified \nworkplace \nchallenges \n4.4 Devising, \ncommunicating, \nimplementing and \nevaluating \nstrategies and \ntechniques in \naddressing specific \nworkplace \nchallenges\n\n--- PDF PAGE 16 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          12 \n \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Parameters \nMay include: \n1.1 Processes \n1.2 Procedures \n1.3 Systems \n2. Analytical techniques \nMay include: \n2.1. Brainstorming \n2.2. Intuitions/Logic \n2.3. Cause and effect diagrams \n2.4. Pareto analysis \n2.5. SWOT analysis \n2.6. Gant chart, Pert CPM and graphs \n2.7. Scatter grams  \n3. Problem \n \nMay include: \n3.1. Routine, non – routine and complex workplace \nand quality problems \n3.2. Equipment selection, availability and failure \n3.3. Teamwork and work allocation problem \n3.4. Safety and emergency situations and incidents \n3.5. Risk assessment and management \n4. Action plans  \n \nMay include: \n4.1. Priority requirements \n4.2. Measurable objectives \n4.3. Resource requirements \n4.4. Timelines \n4.5. Co-ordination and feedback requirements \n4.6. Safety requirements \n4.7. Risk assessment \n4.8. Environmental requirements\n\n--- PDF PAGE 17 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          13 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Examined specific workplace challenges. \n1.2. Analysed the causes of specific workplace \nchallenges. \n1.3. Formulated resolutions to specific workplace \nchallenges. \n1.4. Implemented action plans and communicated \nresults on specific workplace challenges. \n2. Resource Implications \n2.1. Assessment will require access to an operating plant \nover an extended period of time, or a suitable method \nof gathering evidence of operating ability over a \nrange of situations. A bank of scenarios / case \nstudies / what ifs will be required as well as bank of \nquestions which will be used to probe the reason \nbehind the observable action.  \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1. Observation \n3.2. Case Formulation \n3.3. Life Narrative Inquiry \n3.4. Standardized test \nThe unit will be assessed in a holistic manner as is practical \nand may be integrated with the assessment of other \nrelevant units of competency. Assessment will occur over \na range of situations, which will include disruptions to \nnormal, smooth operation. Simulation may be required to \nallow for timely assessment of parts of this unit of \ncompetency. Simulation should be based on the actual \nworkplace and will include walk through of the relevant \ncompetency components.  \n \nThese assessment activities should include a range of \nproblems, including new, unusual and improbable \nsituations that may have happened. \n4. Context for \nAssessment \n4.1 In all workplace, it may be appropriate to assess this \nunit concurrently with relevant teamwork or operation \nunits.\n",
