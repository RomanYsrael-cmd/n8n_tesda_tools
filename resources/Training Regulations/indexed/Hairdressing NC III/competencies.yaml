        "source_title": "LEAD WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 6 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          2 \n \nSECTION 2 COMPETENCY STANDARDS \n \nThis section gives the details of the contents of the basic, common and core units of \ncompetency required in HAIRDRESSING NC III. \n \n \nBASIC COMPETENCIES \n \n \nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION \n \n \n \nUNIT CODE \n: 400311319 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes required \nto lead in the effective dissemination and discussion of \nideas, information, and issues in the workplace. This \nincludes preparation of written communication materials. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Communicate \ninformation \nabout \nworkplace \nprocesses \n1.1  Relevant communication \nmethod is selected based \non workplace procedures   \n1.2  Multiple operations \ninvolving several \ntopics/areas are \ncommunicated following \nenterprise requirements  \n1.3  Questioning is applied to \ngain extra information \n1.4  Relevant sources of \ninformation are identified \nin accordance with \nworkplace/ client \nrequirements \n1.5  Information is selected and \norganized following \nenterprise procedures \n1.6  Verbal and written \nreporting is undertaken \nwhen required \n1.7  Communication and \nnegotiation skills are \napplied and maintained in \nall relevant situations \n \n1.1 Organization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n1.2 Effective verbal \ncommunication \nmethods \n1.3 Business writing \n1.4 Workplace etiquette \n1.1 Organizing \ninformation \n1.2 Conveying \nintended \nmeaning \n1.3 Participating in a \nvariety of \nworkplace \ndiscussions \n1.4 Complying with \norganization \nrequirements for \nthe use of written \nand electronic \ncommunication \nmethods \n1.5 Effective \nbusiness writing \n1.6 Effective \nclarifying and \nprobing skills \n1.7 Effective \nquestioning \ntechniques \n(clarifying and \nprobing)\n\n--- PDF PAGE 7 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          3 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Lead \nworkplace \ndiscussions \n2.1 Response to workplace \nissues are sought \nfollowing enterprise \nprocedures  \n2.2  Response to workplace \nissues are provided \nimmediately  \n2.3  Constructive contributions \nare made to workplace \ndiscussions on such \nissues as production, \nquality and safety \n2.4  Goals/ objectives and \naction plans  undertaken \nin the workplace are \ncommunicated promptly  \n2.1 Organization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n2.2 Effective verbal \ncommunication \nmethods \n2.3 Workplace \netiquette \n2.1 Organizing \ninformation \n2.2 Conveying \nintended meaning \n2.3 Participating in \nvariety of \nworkplace \ndiscussions \n2.4 Complying with \norganization \nrequirements for \nthe use of written \nand electronic \ncommunication \nmethods \n2.5 Effective clarifying \nand probing skills \n3. Identify and \ncommunicat\ne issues \narising in the \nworkplace \n3.1  Issues and problems are \nidentified as they arise \n3.2  Information regarding \nproblems and issues are \norganized coherently to \nensure clear and effective \ncommunication \n3.3  Dialogue is initiated with \nappropriate personnel \n3.4  Communication problems \nand issues are raised as \nthey arise \n3.5  Identify barriers in \ncommunication to be \naddressed appropriately \n \n3.1 Organization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n3.2 Effective verbal \ncommunication \nmethods \n3.3 Workplace etiquette \n3.4 Communication \nproblems and issues \n3.5 Barriers in \ncommunication   \n \n3.1 Organizing \ninformation \n3.2 Conveying \nintended meaning \n3.3 Participating in a \nvariety of \nworkplace   \ndiscussions \n3.4 Complying with \norganization \nrequirements for \nthe use of written \nand electronic \ncommunication \nmethods \n3.5 Effective clarifying \nand probing skills \n3.6 Identifying issues \n3.7 Negotiation and \ncommunication \nskills\n\n--- PDF PAGE 8 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          4 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Methods of \ncommunication \nMay include: \n1.1. Non-verbal gestures \n1.2. Verbal \n1.3. Face-to-face \n1.4. Two-way radio \n1.5. Speaking to groups \n1.6. Using telephone \n1.7. Written \n1.8. Internet \n2. Workplace discussions \nMay include: \n2.1. Coordination meetings \n2.2. Toolbox discussion \n2.3. Peer-to-peer discussion \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Dealt with a range of communication/information at \none time \n1.2 Demonstrated leadership skills in workplace \ncommunication \n1.3 Made constructive contributions in workplace issues \n1.4 Sought workplace issues effectively \n1.5 Responded to workplace issues promptly \n1.6 Presented information clearly and effectively written \nform \n1.7 Used appropriate sources of information \n1.8 Asked appropriate questions \n1.9 Provided accurate information  \n2. Resource Implications The following resources should be provided: \n2.1 Variety of Information \n2.2 Communication tools \n2.3 Simulated workplace \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through:     \n3.1 Case problem \n3.2 Third-party report \n3.3 Portfolio \n3.4 Interview \n3.5 Demonstration/Role-playing \n4. Context for \nAssessment \n4.1 Competency may be assessed in the workplace or in \na simulated workplace environment\n",
