        "source_title": "PERFORM ADVANCED AND CREATIVE HAIRCUTTING",
        "source_text": "--- PDF PAGE 61 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          57 \n \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY : PERFORM ADVANCED AND CREATIVE HAIRCUTTING \n \n \n \nUNIT CODE \n: SOC514308 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitude in \nperforming creative haircutting from consultation and \npreparing the client, analyzing hair, performing actual \ncreative haircutting, checking and applying finishing touches \nand performing post service activities. It includes practicing \nproper and ethical behavior at all times in accordance with \nthe code of ethics. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Prepare \nworkstation \n1.1 Appropriate supplies, \ntools and materials, are \nselected, checked, \nprepared, sanitized and \nrecorded in accordance \nwith advance and creative \nhaircutting procedures, \nproduct specification, \nDOH, DTI and OSH \npolicies and guidelines \n1.2 Appropriate cutting tools \nand equipment are \nselected, checked, \nprepared, sanitized, \nsterilized and recorded in \naccordance with advance \nand creative haircutting \nprocedures, product \nspecification, \nmanufacturer’ manual of \ninstructions, DOH, DTI \nand OSH policies and \nguidelines \n1.3 Appropriate Personal \nProtective Equipment \n(clothing/materials) is \nused in accordance with \nadvance/creative \nhaircutting procedures, \nDOH, DTI and OSH \npolicies and guidelines \n1.4 Workstation is prepared, \nidentified, checked and \nsanitized in accordance \n1.1 Code of Ethics \n1.2 Time Management \n1.3 Familiarization on \nsalon policies and \nprocedures, \n1.4 Familiarization on \nForms and \nRecords of \nsupplies, material, \nproducts, cutting \ntools and \nequipment \n1.5 PD 856 (Sanitation \nCode of the \nPhilippines) \n1.6 RA 9003 \n(Ecological Solid \nWaste \nManagement \nProgram Act of \n2000) \n1.7 FDA Notification \n1.8 DOH and DTI \nProtocol and \nRequirements \n1.9 OSH policies and \nguidelines \n1.10 5S principles \n1.11 Environment \nSafety Rules and \nRegulation \n1.12 Basic Mathematics \n1.13 Methods of \nSterilization Kinds \n1.1 Following code of \nethics \n1.2 Interpersonal and \nintrapersonal \nskills \n1.3 Recording, \npreparing and \nchecking forms \nand files of \nproducts, \nmaterials, \nsupplies. \n1.4 Recording, \npreparing and \nchecking forms \nand files of \ncutting tool and \nequipment \n1.5 Applying \nMethods of \nSterilization \n1.6 Complying with \nPD 856, RA \n9003, FDA, DOH, \nDTI and OSH, \npolicies and \nguidelines\n\n--- PDF PAGE 62 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          58 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nwith Creative Hairstyling \nprocedures, DOH, DTI \nand OSH policies and \nguidelines \n1.5 Safety practices are \nfollowed in accordance \nwith DOH, DTI and OSH \npolicies and guidelines \nof supplies, \nmaterial and \nproducts \n1.14 Kinds of Cutting \ntools and \nequipment \n1.15 Providing PPE \n(clothing/materials) \n \n2.  Prepare \nclient \n2.1 Hair catalog and haircut \nstyles is presented and \nselected to be agreed \nupon by both parties \n2.2 Fashion sense, \npersonality, lifestyles are \ndetermined according to \nclient’s personal \npreferences \n2.3 Client’s hair texture, \nlength, condition and \nscalp condition are \nchecked, analyzed and \nrecorded in accordance \nwith Advance and \nCreative Haircutting \nprocedures \n2.4 Client’s shape of face is \nchecked and analyzed in \naccordance with \nAdvance/Creative \nHaircutting procedures  \n2.5 Personal Protective \nEquipment \n(clothing/materials) is \nprovided in accordance \nwith advance and creative \nhaircutting procedures, \nDOH, DTI and OSH \npolicies and guidelines \n2.6 Client is advised to \nremove all personal \naccessories for safe \nkeeping \n2.7 Draping procedures are \nfollowed in accordance \nwith established draping \nprocedures in \naccordance with Advance \nand Creative Haircutting \nprocedures, DOH, DTI \n2.1 Code of ethics \n2.2 Client consultation \n2.3 Familiarization of \nClient Forms and \nRecords \n2.4 PD 856 (Sanitation \nCode of the \nPhilippines) \n2.5 RA 9003 \n(Ecological Solid \nWaste \nManagement \nProgram Act of \n2000) \n2.6 DOH and DTI \nProtocol and \nRequirements \n2.7 OSH policies and \nguidelines \n2.8 Environment \nSafety Rules and \nRegulations \n2.9 Basic Mathematics \n2.10 Hair Analysis \n2.10.1 Texture \n2.10.2 Length \n2.10.3   Condition \n2.11 Scalp Conditions \n2.12 Hair Catalog \n2.13 Shape of Face \n2.14 Draping \nprocedures \n2.15 Shampooing \nprocedures \n2.16 Using Personal \nProtective \nEquipment/ \nClothing (PPE) \n \n \n2.1 Following code of \nethics \n2.2 Consulting and \nAssessing with \nclients \n2.3 Checking and \nanalyzing hair and \nscalp condition \n2.4 Presenting creative \nhaircut styles and \ndesigns \n2.5 Filing and recording \nof client’s \ninformation \n2.6 Preparing and \nFollowing hair \nsectioning, draping \nprocedures \n2.7 Performing \nShampooing \nprocedures \n2.8 Complying with PD \n856, RA 9003, FDA, \nDOH, DTI and OSH \npolicies and \nguidelines\n\n--- PDF PAGE 63 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          59 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nand OSH policies and \nguidelines \n2.8 Hair is shampooed and \nor/conditioned in \naccordance with \nestablished shampooing \nand conditioning hair \nprocedures in \naccordance with Advance \nand Creative Haircutting \nprocedures, DOH, DTI \nand OSH policies and \nguidelines \n3. Perform hair \ncutting \n3.1 Appropriate supplies, \nmaterials, and hair \nimplements are used and \napplied in accordance with \nAdvanced and Creative \nHaircutting procedures, \nproduct specification, DOH, \nDTI and OSH policies and \nguidelines \n3.2 Appropriate cutting tools \nare used following \nAdvanced and Creative \nHaircutting procedures, \nproduct specification, DOH, \nDTI and OSH policies and \nguidelines \n3.3 Appropriate equipment is \noperated in accordance \nwith Advanced and \nCreative Haircutting \nprocedures, manufacturer’s \nmanual of instruction, DOH, \nDTI and OSH policies and \nguidelines \n3.4 Appropriate parting and \nsection to client is \nperformed in accordance \nwith advanced and creative \nhaircutting procedures \n3.5 Haircut is performed in \naccordance with \nestablished haircutting \nprocedures and \nhaircutting/texturizing \ntechniques, DOH, DTI and \nOSH policies and \nguidelines \n3.1 Code of ethics \n3.2 Compliance of \ntools and \nequipment Manual \nof Instructions \n3.3 PD 856 (Sanitation \nCode of the \nPhilippines) \n3.4 RA 9003 \n(Ecological Solid \nWaste \nManagement \nProgram Act of \n2000) \n3.5 FDA Notification \n3.6 DOH and DTI \nProtocol and \nRequirements \n3.7 OSH policies and \nguidelines \n3.8 5S principles \n3.9 Environment \nSafety rules and \nRegulations \n3.10 Basic Mathematics \n3.11 Hair Cut Styles \n3.12 Parting and \nSectioning \n3.13 Determination of \nDegrees \n3.14 Precision cutting \n3.15 Texturizing \ntechniques \n3.16 Trichology      \n(Anatomy of \nHair/Hair Theory \n3.1 Following code of   \nethics \n3.2 Applying and \nFollowing hair \nsectioning  \n3.3 Performing \ndifferent creative \nhaircutting, \ndesigning and \nstyling procedure \nand techniques \n3.4 Using haircutting \ntools  \n3.5 Using and \nfollowing \nequipment \nmanual of \ninstructions \n3.6 Complying with \nPD 856, RA \n9003, FDA, DOH, \nDTI, OSH \npolicies and \nguidelines \n3.7 Providing first aid \ntreatment\n\n--- PDF PAGE 64 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          60 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.6 Client’s safety and comfort \nare ensured during the \nentire process \n3.7 The necessary, first-aid \ntreatment is provided to the \nclient or referred to health \npersonnel \n3.17 Hair Parting and \nSectioning \nprocedures \n3.18 Corrective \nHaircutting \nTechniques based \non Natural hair \ngrowth \n3.19 First Aid treatment \n3.20 Using cutting tools \nand equipment \n4.  Check hair \nand apply \nappropriate \ntouch-up \n4.1 Cutting tools are used and \nTexturizing Techniques \nare applied for touch-up \nrequirements in \naccordance with \nadvanced and creative \nhaircutting procedures \n4.2 Hair is blow-dried, cross-\nchecked for accuracy in \naccordance with \nestablished blow-drying \ntechniques and finishing \nrequirements are \ncomplied with and \nnecessary adjustments \nfollowed according to \nrequired advanced and \ncreative haircutting \nprocedures \n4.3 Hair touch-up and \nfinishing products are \napplied and hair is styled \nas per client’s \nrequirements in \naccordance with Advance \nand Creative Haircutting \nprocedures, product \nspecification, DOH, DTI \nand OSH policies and \nguidelines \n4.1 Code of ethics \n4.2 Familiarization of \nFinishing Product \nSpecifications \n4.3 Compliance to \nOperations Manual \nof Equipment \n4.4 PD 856 (Sanitation \nCode of the \nPhilippines) \n4.5 RA 9003 \n(Ecological Solid \nWaste \nManagement \nProgram Act of \n2000) \n4.6 FDA Notification \n4.7 DOH and DTI \nProtocol and \nRequirements \n4.8 OSH policies and \nguidelines \n4.9 Environment \nSafety Rules and \nRegulations \n4.10 Basic Mathematics \n4.11 Texturizing \nTechniques \n4.12 Texturizing tools \n4.13 Blow Drying \nTechniques \n4.14 Finishing Product  \n4.1 Following code of \nethics \n4.2 Following hair \nsectioning \nprocedures \n4.3 Applying finishing \ntouches  \n4.4 Performing and \nfollowing blow \ndrying techniques \nand cross-\nchecking \n4.5 Applying finishing \nproduct \n4.6 Complying PD \n856, RA 9003, \nFDA, with DOH, \nDTI and OSH \npolicies and \nguidelines \n \n5.  Perform \npost-service \nactivities \n5.1 Client is advised on \nproper hair care \nmaintenance in \naccordance with \nadvanced and creative \nhaircutting procedures \nand product specification \n5.1 Code of ethics \n5.2 Client consultation \n5.3 Familiarization on \nSalon Policies and \nProcedures \n5.4 Familiarization of \nSalon Forms and \n5.1 Following code of \nethics \n5.2 Advising client \n5.3 Filing and \nrecording of \nclient’s \ndocuments\n\n--- PDF PAGE 65 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          61 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n5.2 Materials, supplies tools & \nequipment and \nimplements are cleaned, \nsanitized, replenished and \nstored in accordance with \ncreative haircutting \nprocedures, product \nspecification, \nmanufacturer’s manual of \ninstruction, DOH, DTI and \nOSH policies and \nguidelines \n5.3 Cutting tools are cleaned, \nsterilized and stored in \naccordance with creative \nhaircutting procedures, \nproduct specification, \nDOH, DTI and OSH \npolicies and guidelines \n5.4 Wastes materials are \nsegregated and disposed \nproperly following \nSanitation Code of the \nPhilippines \n5.5 Workplace area are \ncleaned and prepared for \nnext service activity \n5.6 Documents are recorded, \nfiled and stored in \naccordance with \nadvanced/ creative \nhaircutting procedures \n \nRecords of \nmaterials, \nsupplies, cutting \ntools, and \nequipment \n5.5 Familiarization of \nHair care \nmaintenance \nproducts \n5.6 PD 856 (Sanitation \nCode of the \nPhilippines) \n5.7 RA 9003 \n(Ecological Solid \nWaste \nManagement \nProgram Act of \n2000) \n5.8 FDA Notification \n5.9 DOH and DTI \nProtocol and \nRequirements \n5.10 OSH policies and \nguidelines \n5.11 5S principle \n5.12 Environment \nSafety Rules and \nRegulations \n5.13 Basic \nMathematics \n5.14 Hair Care \nMaintenance \n5.15 Housekeeping \nprocedures \n5.16 Safekeeping \nprocedures \n5.17 Bookkeeping  \n5.18 Method of \nSterilization \n5.19 Setting up of \nwork area \n5.4 Filing, and \nrecording Forms \nand Records of \nproducts, \nmaterials, \nsupplies, cutting \ntools and \nequipment \n5.5 Following and \napplying Methods \nof Sterilization \nand Sanitation  \n5.6 Cleaning and \nstoring products, \nmaterials, \nsupplies, cutting \ntools and \nequipment \n5.7 Following \nSafekeeping \nprogram of tools \nand equipment  \n5.8 Storing treatment \nproducts \n5.9 Following \nHousekeeping \nprocedures \n5.10 Following 5S \nprinciples and \nMethod of \nSterilization  \n5.11 Complying PD \n856, RA 9003, \nFDA, DOH, DTI \nand OSH policies \nand guidelines \n5.12 Preparing and \nSetting up \nworkplace\n\n--- PDF PAGE 66 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          62 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nSupplies and Materials  \n \n \n \n \n \n \n \n \n \nMay include:   \n1.1 \nClamps and Clips \n \n1.2 \nTissue  Paper \n1.3 \nTalc Powder \n1.4 Shampoo \n1.5 Conditioner \n1.6 Towel (Big) \n1.7 Cutting Cape \n1.8 Apron \n1.9 Face mask (Disposable) \n2. \nTools \nMay include; \n2.1 Cutting Comb \n2.2 Wide tooth Comb \n2.3 Water Spray Gun \n2.4 Round Brush \n2.5 Skeleton Brush \n2.6 Paddle Brush \n2.7 Barber brush   \n3. \nCutting Tools \nMay include: \n3.1  Thinning scissors \n3.2  Cutting scissors  \n3.3  Razors \n3.4  Clippers \n3.5  Razor blades \n4. \nEquipment \nMay include but not limited to: \n4.1 Blower \n4.2 Flat Iron (ceramic/titanium) \n4.3 Hydraulic chair \n4.4 Shampoo bowl and chair \n4.5 Stand mirror \n4.6 Trolley \n4.7 Ultraviolet lamp or Ultraviolet sterilizer \n5. \nPersonal Protective \nEquipment \n(clothing/materials) \nMay include but not limited to: \n5.1 Fae Mask \n5.2 Apron \n5.3 Cutting Cape \n5.4 Towels \n5.5 Face shield \n6. \nWorkstation \nMay include: \n6.1 \nClient chair \n6.2 \nShampoo bowl and chair \n6.3 \nStand Mirror \n6.4 \nTowel \n6.5 \nTrolley \n6.6 \nCutting Cape and apron \n6.7 \nShampoo and conditioner \n6.8 \nTrash Bin\n\n--- PDF PAGE 67 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          63 \n \nVARIABLE \nRANGE \n7. \nHair Catalog  \nMay include: \n7.1 \nMen’s Cut Catalog \n7.2 \nLadies Cut Catalog \n7.3 \nKid’s Cut Catalog \n8. \nCreative Haircut styles \nMay include but are not limited to: \n8.1 Layered \n8.1.1 Layered bob \n8.1.2 Increased layers \n8.1.3 Graduated layers \n8.2 Crop cut \n8.3 Round layer \n8.4 Disconnection haircuts \n8.5 Trend setting haircuts \n9. \nShape of Face  \nMay include: \n9.1 Oval    \n9.2  Round  \n9.3  Square \n9.4  Heart  \n9.5  Diamond \n9.6  Inverted/Pear  \n9.7  Rectangular or Elongated \n9.8  Triangular  \n10. Hair Condition \nMay include: \n10.1 Damaged \n10.2 Tinted \n10.3 Lightened \n10.4 Porous \n10.5 Dry \n10.6 Greasy or Oily \n10.7 Normal \n11. Hair Length \nMay include: \n11.1 Short \n11.2 Medium \n11.3 Long \n12. Hair Texture \nMay include: \n12.1 Fine \n12.2 Medium \n12.3 Coarse \n12.4 Wiry \n13. Scalp condition \nMay include: \n13.1 Dry dandruff \n13.2 Oily \n13.3 Normal \n13.4 Dandruff \n13.5 Irritation  \n13.6 Flaking  \n13.7 Post chemical service itch \n13.8 With wounds \n13.9 Greasy or waxy\n\n--- PDF PAGE 68 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          64 \n \nVARIABLE \nRANGE \n14. Established procedures \nin draping client \nMay include but not limited to: \n14.1 Client is draped with bath towel with horizontal edge \nfolded 2 inches outward \n14.2 Protective material is wrapped around the neck \n14.3 Cape for haircutting is wrapped around the shoulder \n15. Established hair \nshampooing and/or \nconditioning procedures  \n \n \nMay include but are not limited to: \n15.1 Comb/brush hair to free from entanglement before \nactual shampooing and/or conditioning  \n15.2 Apply amount of shampoo and/or conditioner \naccording to clients’ hair length and volume, and \ntype of services \n15.3 Apply appropriate water temperature  \n15.4 Follow shampooing and/or conditioning technique \nand procedures \n15.5 Rinse hair thoroughly and towel-dry \n16 Parting and Section \nMay include: \n16.1 Profile \n16.2 Horseshoe \n16.3 Horizontal \n16.4 Diagonal forward \n16.5 Diagonal back \n16.6 Radial \n16.7 Pivoting  \n17 Established procedures \nin haircutting \nMay include but not limited to: \n17.1 Parting and section hair following haircutting \nprocedures  \n17.2 Apply haircutting technique and style to achieve \ndesired creative haircut \n17.3 Cross check hair and blow dry hair for touch up \n17.4 Apply finishing products  \n18 Haircutting/Texturizing \nTechniques \nMay include: \n18.1 Point cutting \n18.2 Slashing \n18.3 Sliding \n18.4 Slicing \n19 Blow –drying technique \nMay include: \n19.1 Flat \n19.2 Medium \n19.3 Maximum volume \n20 Hair Finishing Products \nMy include: \n20.1 Setting Lotion/Gel \n20.2 Hair wax (Wet and Dry) \n20.3 Hair serum \n20.4 Hair spray \n20.5 Mousse \n20.6 Leave-on conditioners \n20.7 Fiber gum \n21 Waste Materials \nMay include: \n21.1 Biodegradable \n21.2 Non-biodegradable\n\n--- PDF PAGE 69 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          65 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared/assessed clients according to selected type   \nof creative haircut style following DOH, DTI and OSH \nguidelines. \n1.2 Appropriate supplies materials, tools and hair \nimplements are prepared and used in accordance with \nadvance/creative Haircutting procedures, product \nspecification with DOH, DTI and OSH requirements.  \n1.3 Used Personal Protective Equipment \n(clothing/materials) in accordance with \nadvance/creative haircutting procedures, DOH, DTI \nand OSH requirements. \n1.4 Performed creative haircutting and texturizing \ntechniques in accordance to required creative haircut \nstyle and established haircutting procedures following \nDOH, DTI and OSH guidelines.  \n1.5 Used and operate appropriate equipment following \nmanufacturer’s manual of instructions \n1.6 Performed cross-checking and applied appropriate \nfinishing touches according to product specification. \n1.7 Ensured client’s safety and comfort during the entire \nprocess in accordance with DOH, DTI and OSH \nguidelines. \n1.8 Applied appropriate measures in response to \nemergencies or unavoidable circumstances. \n1.9 Performed post-service activities in accordance with \nsalon policies and procedures, DOH, DTI and OSH \nrequirements. \n2. Resource Implications \nThe following resources should be provided: \n2.1 \nLive Model \n2.2 \nTools, equipment and supplies/materials relevant to \nthe activity to be performed \n2.3 \nWork area/facilities \n3. Method of \nAssessment \nCompetency may be assessed through: \n3.1    Demonstration with oral questioning \n3.2    Third-Party Report \n3.3    Portfolio \n4. Context of \nAssessment \n4.1 Assessment may be conducted in the actual workplace \nor TESDA accredited assessment center\n",
