s \n5. Provide a \nrelaxed and \ncaring \nenvironment \n5.1 \nClients are made to feel \ncomfortable according to \nsalon policy \n5.2 \nClients’ needs are \nreported to \n5.3 \nClients are consulted on \nspecific desired service \n \n5.1 Client Service \n5.2 Service \nProcesses and \nProcedures \n5.3 Environmental \nRegulations \n5.1 Making clients \nfeel comfortable \nfollowing salon \npolicy \n5.2 Consulting clients \non their needs or \ndesired service \n5.3 Reporting client’s \nneeds to the \nsalon supervisor\n\n--- PDF PAGE 59 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          55 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Relevant Salon Policies \nand Procedures \n \nMay include but not limited to: \n1.1 \nHazard Policies and Procedures \n1.2 \nEmergency, Fire and Accident Procedures \n1.3 \nPersonal Safety Procedures in accordance to \ngovernment health regulations \n1.4 \nProcedures for the use of Personal Protective \nClothing \nand \nEquipment \nin \naccordance \nto \ngovernment health regulations \n1.5 \nHazard Identification \n1.6 \nJob Procedures \n2. Occupational Safety and \nHealth Procedures \nMay include: \n2.1 \nClient  \n2.2 \nStaff \n2.3 \nEquipment/Tools \n2.4 \nPremises \n2.5 \nStock \n3. Unsafe Situations \nMay include but not limited to: \n3.1 \nDamaged Packaging Material or Containers \n3.2 \nBroken or Damaged Equipment \n3.3 \nInflammable Materials and Fire Hazards \n3.4 \nLifting Practices \n3.5 \nSpillages \n3.6 \nWaste including hair especially on floors \n3.7 \nTrolleys \n4. Linkage \nMay be related to the following: \n4.1 \nInstitutional \n4.2 \nOrganizational Linkage \n4.3 \nSocial Services \n4.4 \nInternational Market\n\n--- PDF PAGE 60 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          56 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Generated information on different client \nrequirements and needs. \n1.2 Selected and used strategies to accurately analyzed \nthe client requirements. \n1.3 Assessed current product and services as against \nclient demand. \n1.4 Identified avenues to establish relevant linkage. \n1.5 Selected promotional activities relevant to enhance \ncompetitiveness of salon. \n1.6 Assisted clients on specific desired services. \n1.7 Checked and prepared tools for the specific salon \nactivities. \n2. Resource Implications \nThe following resources should be provided: \n2.1 Client \n2.2 Relevant Information \n2.3 Appropriate Products \n3. Methods of \nAssessment \nCompetency in this unit must be assessed through: \n3.1 Observation with questioning \n3.2 Practical Demonstration with questioning \n4. Context of \nAssessment \n4.1  Assessment may be conducted in the workplace or \n       in a simulated environment\n",
