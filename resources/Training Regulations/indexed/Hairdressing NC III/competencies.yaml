            "performance_criteria": [
              {
                "number": "1.1",
                "text": "Appropriate supplies, materials and tools are selected, checked, prepared, sanitized, and recorded in accordance with Advanced and Creative Hair perming procedures, product specification, DOH, DTI and OSH policies and guidelines"
              },
              {
                "number": "1.2",
                "text": "Appropriate equipment is prepared, set, checked, sanitized, and in accordance with Advanced and Creative Hair perming procedures, product specification, DOH, DTI and OSH policies and guidelines"
              },
              {
                "number": "1.3",
                "text": "Perming products are checked and prepared in accordance with advanced and creative hair perming procedures and product specifications"
              },
              {
                "number": "1.4",
                "text": "Personal Protective Equipment (clothing/material) are used in accordance with advanced hair perming procedures, DOH, DTI and OSH policies and guidelines"
              },
              {
                "number": "1.5",
                "text": "Workstation is prepared, checked and sanitized in III Revision 01 Promulgated"
              }
            ],
