.2 Eliminating \ndiscriminatory \nbehavior towards \ncustomers and \nco-workers \n3.3 Utilizing change \nmanagement \npolicies in the \nworkplace\n\n--- PDF PAGE 20 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          16 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Diversity \nThis refers to diversity in both the workplace and the \ncommunity and may include divergence in: \n1.1 \nReligion \n1.2 \nEthnicity, race or nationality \n1.3 \nCulture \n1.4 \nGender, age or personality \n1.5 \nEducational background \n2. Diversity-related conflicts \nMay include conflicts that result from: \n2.1 \nDiscriminatory behaviors  \n2.2 \nDifferences of cultural practices \n2.3 \nDifferences of belief and value systems \n2.4 \nGender-based violence  \n2.5 \nWorkplace bullying \n2.6 \nCorporate jealousy \n2.7 \nLanguage barriers \n2.8 \nIndividuals being differently-abled persons \n2.9 \nAgeism (negative attitude and behavior towards \nold people) \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 \nAdjusted language and behavior as required by \ninteractions with diversity \n1.2 \nIdentified and respected individual differences in \ncolleagues, clients and customers \n1.3 \nApplied relevant regulations, standards and codes of \npractice \n2. Resource Implications \nThe following resources should be provided: \n2.1 Access to workplace and resources \n2.2 Manuals and policies on Workplace Diversity \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration or simulation with oral questioning \n3.2 \nGroup discussions and interactive activities \n3.3 \nCase studies/problems involving workplace diversity \nissues \n3.4 \nThird-party report \n3.5 \nWritten examination \n3.6 \nRole Plays \n4. Context for \nAssessment \n4.1 Competency assessment may occur in workplace or \nany appropriately simulate