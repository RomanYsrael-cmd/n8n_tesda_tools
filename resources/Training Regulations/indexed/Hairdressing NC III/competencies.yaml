n\n--- PDF PAGE 65 ---\nTR - Hairdressing NC III Revision 01                   Promulgated (06/09/2020)                                          61 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n5.2 Materials, supplies tools & \nequipment and \nimplements are cleaned, \nsanitized, replenished and \nstored in accordance with \ncreative haircutting \nprocedures, product \nspecification, \nmanufacturer’s manual of \ninstruction, DOH, DTI and \nOSH policies and \nguidelines \n5.3 Cutting tools are cleaned, \nsterilized and stored in \naccordance with creative \nhaircutting procedures, \nproduct specification, \nDOH, DTI and OSH \npolicies and guidelines \n5.4 Wastes materials are \nsegregated and disposed \nproperly following \nSanitation Code of the \nPhilippines \n5.5 Workplace area are \ncleaned and prepared for \nnext service activity \n5.6 Documents are recorded, \nfiled and stored in \naccordance with \nadvanced/ creative \nhaircutting procedures \n \nRecords of \nmaterials, \nsupplies, cutting \ntools, and \nequipment \n5.5 Familiarization of \nHair care \nmaintenance \nproducts \n5.6 PD 856 (Sanitation \nCode of the \nPhilippines) \n5.7 RA 9003 \n(Ecological Solid \nWaste \nManagement \nProgram Act of \n2000) \n5.8 FDA Notification \n5.9 DOH and DTI \nProtocol and \nRequirements \n5.10 OSH policies and \nguidelines \n5.11 5S principle \n5.12 Environment \nSafety Rules and \nRegulations \n5.13 Basic \nMathematics \n5.14 Hair Care \nMaintenance \n5.15 Housekeeping \nprocedures \n5.16 Safekeeping \nprocedures \n5.17 Bookkeeping  \n5.18 Method of \nSterilization \n5.19 Setting up of \nwork area \n5.4 Filing, and \nrecording Forms \nand Records of \nproducts, \nmaterials, \nsupplies, cutting \ntools and \nequipment \n5.5 Following and \napplying Methods \nof Sterilization \nand Sanitation  \n5.6 Cleaning and \nstoring products, \nmaterials, \nsupplies, cutting \ntools