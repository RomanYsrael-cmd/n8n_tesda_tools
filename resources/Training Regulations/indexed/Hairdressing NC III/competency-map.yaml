  "source_text": "Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA\nDirector General.\n\n4.1.2 Assessment shall cover all competencies with basic and common\nintegrated or assessed concurrently with the core units of competency.\n\n4.1.3 Any of the following are qualified to undergo assessment and certification:\n\n4.1.3.1\nGraduates\nof\nWTR-registered\nprogram,\nNTR-registered\nprograms or formal/non-formal/informal including enterprise-\nbased trainings related to HAIRDRESSING NC III.\n\n4.1.3.2\nExperienced workers (wage employed or self-employed) who\ngained competencies in providing hairdressing services for at\nleast two (2) years within the last five (5) years.\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, previous work or life\nexperiences with at least two (2) years of hairdressing experience within\nthe last five (5) years may apply for recognition in this Qualification through\nPortfolio Assessment.\n\nRequirements and implementation procedure of Portfolio Assessment must\nbe consistent with TESDA Circular No. 47, series of 2018 on “Implementing\nGuidelines on the Implementation of Portfolio Assessment Leading to\nRecognition of Prior Learning (RPL) within the TESDA Assessment and\nCertification System.\n\n4.1.5 Holders of National Certificate (NC) or Certificates of Competency (COC)\nin Hairdressing NC III are required to undergo re-assessment under the\namended Training Regulations (TRs), upon expiration of their Certificates.\n\n4.1.6 The guidelines on assessment and certification are discussed in detail in\nthe “Procedures Manual on Assessment and Certification” and “Guidelines\non the Implementation of the “Philippine TVET Competency Assessment\nand Certification System (PTCACS)”.\n\n--- PDF PAGE 136 ---\nTR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 132\n\n4.2\nCOMPETENCY ASSESSMENT REQUISITE\n4.2.1\nSelf-Assessment\nGuide.\nThe\nself-assessment\nguide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd) Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior to\nassessment\n\n4.2.2\nAccredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n4.2.3\nAccredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of accreditation\nprocedure before they are authorized by TESDA to assess the\ncompetencies of candidates for National Certification.\n\n--- PDF PAGE 137 ---\nTR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 133\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine problems\nEnhance self-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow occupational\nsafety and health\npolicies and\nprocedures\nApply\nenvironmental\nwork standards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nteam\nenvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop career\nand life\ndecisions\nContribute to\nworkplace\ninnovation\nPresent relevant\ninformation\nPractice occupational\nsafety and health\npolicies and\nprocedures\nExercise efficient\nand effective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-solving\ntechniques in\nthe workplace\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying learning\nand innovation in\nthe organization\nUse information\nsystematically\nEvaluate occupational\nsafety and health\nwork practices\nEvaluate\nenvironmental\nwork practices\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\nUtilize\nspecialized\ncommunication\nskill\nDevelop and\nlead teams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute to\nthe practice of\nsocial justice in\nthe workplace\nManage\ninnovative work\ninstructions\nManage and\nevaluate usage\nof information\nLead in improvement\nof Occupational\nSafety and Health\nProgram, Policies and\nProcedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate higher\norder thinking\nskills and adjust\nproblem solving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation into\nwork procedures\nDevelop\nsystems in\nmanaging and\nmaintaining\ninformation\nManage\nimplementation of\noccupational safety\nand health programs\nin the workplace\nManage\nimplementation of\nenvironmental\nprograms in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nMaintain an effective\nrelationship with\nclients/customers\nManage own performance\nApply quality standards\nMaintain a safe, clean and\nefficient environment\nCOMPETENCY MAP – SOCIAL AND OTHER COMMUNITY DEVELOPMENT SERVICES SECTOR\nHAIRDRESSING NC III\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\n\n--- PDF PAGE 138 ---\nTR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 134\n\nPerform facial\ncleansing\nPerform temporary\nhair removal activity\nPerform body\nscrub\nPerform pre and\npost hair care\nactivities\nPerform hair and\nscalp treatment\nPerform basic\nhair coloring\nPerform basic\nhair bleaching\nPerform basic\nhair perming\nPerform hair\nstraightening\nPerform basic\nhaircutting\nPerform advanced\nand creative\nhaircutting\nPerform\nadvanced and\ncreative hair\ncoloring\nPerform advanced\nand creative hair\nperming\nPerform basic\nmen’s\nhaircutting\nPerform shave\nand style beard\nand mustache\nPerform chair\nmanipulative\nrelaxing services\nPerform\nmanicure and\npedicure\nPerform hand\nand foot spa\nPerform\npreparatory\nactivities\nPrepare appropriate\nproducts, tools and\nequipment\nPerform nail\nenhancement\ntechnology\nprocedures\nPerform post\nservice activities\nPerform\nadvanced nail\npolish\nprocedures\nApply facial\nmake-up\nPerform body\nbleach\n\nCORE\nCOMPETENCIES\n\n--- PDF PAGE 139 ---\nTR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 135\n\nGLOSSARY OF TERMS\n\nAnalysis Hair\n-\nan examination to determine the condition of the hair prior to a hair\ntreatment\nAniline\nDerivative\nTints\n-\nare also known as penetrating tints, synthetic, organic tints and\nperoxide or oxidation tints and are commonly called tints in the\nindustry\nBack Combing\n-\ncombing the short hair toward the scalp while the hair strand is held\nin a vertical position also called teasing\nBaseline\n-\nthe first/foundation line to be cut which subsequent sections are\ncut to\nBasic Hair\nshaping\n-\nshaping the hair that is not too long or too short to different head\nshape\nBleaching\n-\nremoving the natural pigmentation\nBlunt cutting\n-\nall hair strands must direct at the same point. The hair appears to\nbe the same length\nBob\n-\na level haircut above the shoulders\nChemical\ndamage\n-\ndamage to the hair fiber through the overuse of chemicals such as\npermanent waves, colour, hydrogen peroxide, ammonia\nClippers\n-\nelectric razors mostly used to smoothen the back of the neck\nCoiffure\n-\nan arrangement or dressing of the hair\nColor Fillers\n-\nare used if the hair is in damaged condition and there is doubt that\nthe color result will be an even shade\nColor stripping\n-\nremoving artificial color by bleaching or chemical color stripper\nConditioner\n-\ncreams, waxes and oils which help protect and maintain the health\nand condition of the hair\nConditioning\n-\nthe application of special chemical agents to the hair to help restore\nits strength and give it body in order to protect it against possible\nbreakage\nContour\nwinding\n-\na loose wave, winding the perm rods to the contour of the head -\nshape\nCuticle\n-\nthe outer layer of the hair; the hard skin at the base of the fingernail\nDesign\n-\na plan or arrangement of a hairstyle\nDigital Perm\n-\nis a new technique of creating a shiny and bouncy wave to your\nhair. As a new trend-setting hairstyling treatment, the digital perm\nuses temperature controlled rods that are all powered by a\nmachine with a digital display.\nDiffuser\n-\nan attachment on a blow dryer that “shatters’ the flow of air so that\nthe hair can be soft styled\nElasticity\n-\nthe ability of the hair to stretch and return to its original form without\nbreaking\nElevation\n-\nto lift the hair away from the head shape, elevation defines the\ntechnique being used\n\n--- PDF PAGE 140 ---\nTR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 136\n\nEmulsifying\nagent\n-\na substance used to form an emulsion, e.g. shampoo\nEnd paper\n-\na small paper tissue used at the end of a strand of hair to assist\nthe winding of the perm rod\nHair Iron\n-\na hair iron or hair tong is a tool used to change the structure of the\nhair using heat\nImplements\n-\na tool, utensil. Or other piece of equipment, especially as used for\na particular purpose\nFirst-Aid\n-\nmeans immediate assistance given in case of injury until medical\naid has been obtained\nFlat Iron\n-\nstraightening Iron or Flat irons, work by breaking down the hair’s\npositive hydrogen bonds found in the hair cortex, which cause hair\nto open, bend and become curly. Once the bond is broken hair is\nprevented from holding its natural form, though the hydrogen\nbonds can re-form if exposed to moisture. They can use ionic and\nnano technology. They used mainly ceramic materials for its\nplates. Low end straighteners use single layer of ceramic coating\non its plates whereas high end straighteners use multiple layers of\nceramic or even use 100% ceramic material for its plates\nFrosting\n-\nto lighten or darken small selected strands of hair over the entire\nhead to blend with the root of the hair\nGraduation\n-\nthe grade at which the hair is cut by degrees\nGuideline\n-\na line to follow when shaping the balance of the hair\nHair analysis\n-\nan examination to determine the condition of the hair prior to a hair\ntreatment\nHair Density\n-\nthe amount of hair strands per square inch on the scalp\nHair Cutting\n-\na process to thinning, tapering and shortening of the hair into a\nbecoming shapes or styles\nHairstyling\n-\na process of arranging the hair into a temporary design\n\n-\nInvolves arranging the hair in a particular style, appropriately suited\nto the cut, and may require the use of hairstyling aid such as hair\nspray, gel or mousse\nHair stylist\n-\na person who designs and dresses the hair\nKeratin\n-\nkeratin is a protein that your hair is made up of.\nLayer/Layering\n-\nholding the hair out from the head at a 90 degree angle and then\nremoving a defined amount to remove volume, give movement,\nand added texture\nLayering\n-\nis a technique used by hairdressers to change the thickness of the\nhair, creating either a thinning or thicker appearance. In this way\nthe hair can be given a fuller appearance, more texture and\nmovement\nLysine\n-\nan animo acid found in hair\nMedulla\n-\na hollow pith or core of the hair fiber.\nMelanin\n-\nthe dark or black pigment in the epidermis and hair, and in the\nchoroids or coat of the eye\n\n--- PDF PAGE 141 ---\nTR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 137\n\nNano\nTechnology\n-\nthe branch of technology that deals with dimensions and\ntolerances of less than 100 nanometers especially the\nmanipulation of individual atoms and molecules\nNeutralizer\n-\nan agent capable of neutralizing another substance\nNormal hair\nshedding\n-\na certain amount of hair is shed daily. This is nature’s method to\nmake way for new hair. The average daily shedding is estimated\nat 50-80 hairs. Hair loss beyond this estimated average indicates\nsome scalp or hair trouble\nOccupational\nHealth & Safety\n(OHS)\n-\nis define as the A.) Promotion and maintenance of the highest\ndegree of physical, mental and social well-being of workers in all\noccupations B.) Prevention among its workers of any departures\nfrom health cause by their working conditions; C.) protection\namong workers in their employment from risks usually from factors\nadverse to health and; D.) placing and maintenance of the worker\nin an occupational environment adapted to his/her physiological\nability\nPerm\n-\nabbreviation for permanent wave\nPersonal\nProtective\nEquipment\n-\nmeans any clothing, device or other article that is intended to be\nworn or used by a worker to prevent injury or to facilitate rescue\nPorosity\n-\nability of the hair to absorb liquid\nRebonding\n-\nrejoining the lines and bonds on the keratin chains – neutralizing\nRelaxer\n-\na chemical applied to the hair to remove the natural curl\nSectioning\n-\nHair sectioning is dividing the head into uniform working panels\nShimmering\n-\nshading or tinting parts of the hair to enhance the style\nShingling\n-\nis cutting the hair close to the nape and gradually longer toward\nthe crown, without showing a definite line\nSlithering\n-\ntapering the hair to graduated length with scissors\nStreaking\n-\nlayers or strands of hair with a contrasting color, usually placed so\nas to enhance the appearance\nSymmetrical\n-\nhair equally distributed on both sides of the head\nTaper\n-\nto diminish a strand of hair gradually toward the points by cutting.\nRemoving bulk from the ends of the hair\nTexture\n-\ncoarseness and fineness of the hair\nTexturizing\n-\nis performed after the overall cut has been completed. Thinning or\nnotching are used to create wispy or spiky effect.\nThinning\n-\nremoving bulk from the hair\nToners\n-\nthe colors applied to hair which has been lightened – delicate\npastel shades, e.g. champagne, beige, silver\nTouch up -\nimprove, retouch, restore, freshen, freshen up, refurbish, repaint,\nsmarten up\nTrichologist\n-\na person trained in the science of caring for the hair\nTrichology\n-\nthe study of the structure and functions of the hair\n\n--- PDF PAGE 142 ---\nTR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 138\n\nVent brush\n-\na brush with widely spaced plastic bristles designed to be used\nwhile blow drying\nWig\n-\nan artificial covering for the head consisting of a network of\ninterwoven hair\nWorkplace\n-\nrefers to the office. Premises or worksite where a worker is\ntemporary or habitually assigned. Where is no a fixed or definite\nworkplace, the term shall include the place where the worker\nactually performs regular work, or where he regularly reports to\nrender service or to take assignment\n\n--- PDF PAGE 143 ---\nTR - Hairdressing NC III Revision 01 Promulgated (06/09/2020) 139\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wants to\nextend sincerest thank you and appreciation to the representatives of business, industry,\nacademe and government agencies who provided their time and expertise in the\ndevelopment and validation of this Training Regulations.\n\nTHE TECHNICAL/INDUSTRY EXPERT AND REVIEW PANEL\n\nMANOLITO “Ching” D. DONDONILLA\nTechnical Expert/M