ICK CALALANG Datem, Inc. ENGR. SALVADOR OLIVAR D.M. Consunji Inc. Members of the TESDA Board The MANAGEMENT and STAFF of the TESDA Secretariat • Qualification and Standards Office (QSO) The Management and Staff of the Philippine Constructors Association (PCA)"
