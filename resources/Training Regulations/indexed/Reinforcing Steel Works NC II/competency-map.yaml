  "source_text": "Section 1. Successful\ncandidates shall be awarded a National Certificate signed by the TESDA\nDirector General.\n\n4.2\nThe qualification of REINFORCING STEEL WOORKS NC II can be\nattained through demonstration of competence in a project-type\nassessment covering the following core units.\n\n4.1.1 Fabricate RSB materials\n4.1.2 Install RSB materials\n\n4.3. Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4. The following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including\n\nenterprise-based training programs\n\n4.4.2 Experienced Workers (wage employed or self-employed)\n\n4.5. The guidelines on assessment and certification are discussed in detail in\nthe Procedures Manual on Assessment and Certification and the\nGuidelines on the Implementation of the Philippine TVET Qualification\nand Certification System (PTQCS).\n\n--- PDF PAGE 43 ---\nReinforcing Steel Works NC II (Amended) Promulgated December 2013 41\n\nANNEX A\n\nCOMPETENCY MAP\nCIVIL WORKS SUB-SECTOR\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nREINFORCING STEEL WORKS NC II\nRepair defective\nconcrete and\nmasonry surfaces\nPerform basic\nmasonry\nworks\nLay brick/ block\nfor structures\nPlaster\nconcrete/\nmasonry\nInstall pre-cast\nbalusters and\nhandrails\nPrepare\nmasonry\nmaterials\nPrepare tools,\npainting\nmaterials and\nPrepare surface\nfor painting\n\nApply special\ncement finishes\nto concrete and\nmasonry surfaces\nEstimate\npaint\nrequirements\nPerform\npainting works\n\nStakeout\nbuilding lines\nFabricate form\nworks\nInstall form work\ncomponents\nStrip form work\ncomponents\nInstall\nFraming\n works\nPerform single unit\nplumbing\ninstallation and\nassemblies\nPerform minor\nconstruction\nworks\nUse RSB tools and\nequipment\nHandle RSB tools\nand equipment\nFabricate RSB\nmaterials\nInstall RSB\nmaterials\nPerform painting\nrepair work\nPerform complex and\nmulti-story plumbing\ninstallation and\nassemblies\nPerform plumbing\nrepair and\nmaintenance\nworks\nConduct pipe\nleak testing\nMake piping\njoints and\nconnections\nInstall hot and\npotable chilled\nwater piping\nsystem\nPrepare pipes\nfor installation\nDraft plumbing\ndesign\nReceive and respond\nto workplace\ncommunication\nWork with\nothers\nDemonstrate\nwork values\nPractice basic\nhousekeeping\nprocedures\nPracticipate in\nworkplace\ncommunication\nWork in a team\nenvironment\nPractice\nprofessionalism\nPractice\noccupational health\nand safety\nprocedures\nLead workplace\ncommunication\nLead small\nteam\nDevelop and\npractice\nnegotiation skills\nSolve problems\nrelated to work\nactivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialist\ncommunication\nskills\nDevelop team\nand individual\nApply problem\nsolving\ntechniques in the\nworkplace\nCollect and\norganize\ninformation\nPlan and\norganize work\nPromote\nenvironmental\nprotection\nBASIC\nCOMPETENCIES\nPrepare construction materials\nand tools\nObserve procedures,\nspecifications and manual of\ninstructions\nInterpret technical\ndrawings and plans\nPerform mensuration\nand calculations\nMaintain tools\nand equipment\n\n--- PDF PAGE 44 ---\nReinforcing Steel Works NC II (Amended) Promulgated December 2013\n42\nDEFINITION OF TERMS\n\n1. Competency\nIs the application of knowledge, skills and attitudes to\nperform work activities to the standard expected in the\nworkplace.\n2. Certification\nRefers to the process of verifying and validating\ncompetencies of a person through assessment.\n3. Element\nRefers to the building blocks of a unit of competency. It\ndescribes in outcome terms the functions that a person\nwho works in a particular area of work is able to perform.\n4. Evidence Guide\nIt is a guide for assessment that provides information on\ncritical aspects of competency, underpinning knowledge,\nunderpinning skills, resource implications, context of\nassessment and assessment method.\n5. Girder\nRefers to a large beam made of metal or concrete\n6. Philippine TVET\n Qualification\n Framework\nRefers to a comprehensive, nationally consistent\nframework for qualifications in the TVET sector. It also\nprovides the parameter for the integration of learning and\nassessment in the middle skills development.\n7. Qualification\nRefers to the national certificate issued by the TESDA or\nits accredited industry organizations in recognition that a\nperson has achieved competencies relevant to a trade or\nindustry.\n8. Range of\n Variable\nIt describes the circumstances or context in which the\nwork is to be performed.\n9. Slabs\nRefers to a part of a reinforced concrete floor, roof or\nplatform which spans beams, columns, walls or piers\n10. Unit of\n Competency\nRefers to a discrete aspect of work, which would\nnormally be performed by only one person.\n\n--- PDF PAGE 45 ---\nReinforcing Steel Works NC II (Amended) Promulgated December 2013\n43\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies who contributed their\ntime and expertise to the development of these Training Regulations.\n\n•\nTHE TECHNICAL/INDUSTRY EXPERTS\n\nJOHN N. CALAMIONG, Ed.D.\nProfessor II\nTechnological University of the\nPhilippines - Taguig Campus\nJIMMY GEMENTRA\nPiping Supervisor\nEEI Corporation\nLILIAN MACANDOG\nOperations Manager\nFCG Group Phils.\nRAFAEL MANALO\nExecutive Vice-President\nJ.E. Manalo Co.\nMEYNARDO PALARCA\nTrainor\nAssociation of Construction and Informal\nWorkers\nDANILO PANCHO\nProject Coordinator\nCM Pancho Construction\nMICHAEL RUDOLFO\nMaintenance Engineer\nCM Pancho Construction\nYUMUL NESTOR\nOperations Manager\nF.F. Cruz and Co.\n\n--- PDF PAGE 46 ---\nReinforcing Steel Works NC II (Amended) Promulgated December 2013\n44\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who contributed their time and expertise to the\ndevelopment of these Training Regulations.\n\nFOR THE REVISION STAGE\n\n•\nTHE TECHNICAL/INDUSTRY EXPERTS\n\nLITO G. GARCIA\nDirector\nPhilippine Constructors, Association, Inc.\nMARCELO R. ABAD\nDM Consunji Inc., Consultant\n\nDr. PETER M. URETA\nCHED Technical Expert Panel\nEngr. GERARDO J. SULIT\nProject Manager\nDATEM Incorporated\nEngr. ARNEL J. BOSTON\nConstruction Manpower Development Foundation\n\nJOHN S. JUAN\nConstruction Manpower Development\nFoundation\nIGMIDIO J. AQUINO, JR.\nSenior Trade & Industry Dev’t. Specialist\nConstruction Manpower Development Foundation\n\nThe PARTICIPANTS in the Validation of these Training Regulations\n\nENGR. DWIGHT TA-ALA\nManager\nInfra D.M. Consunji Inc. Homes\nENGR. RICHARD LORICA\nDatem, Inc.\n\nENGR. CERELITO ROSARIO\nD.M. Consunji Inc.\nENGR. MAR RESUMADERO\nDatem, Inc.\nENGR. JOHN ANDREW ESPORLAS\nDM Consunji Inc.\nENGR. CRIS PATRICK CALALANG\nDatem, Inc.\nENGR. SALVADOR OLIVAR\nD.M. Consunji Inc.\n\nMembers of the TESDA Board\n\nTESDA EXCOM\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\n•\nQualification and Standards Office (QSO)\n\nThe Management and Staff of the Philippine Constructors Association (PCA)"
