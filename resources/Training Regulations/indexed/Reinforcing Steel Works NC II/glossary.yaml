  "source_text": "DEFINITION OF TERMS\n\n1. Competency\nIs the application of knowledge, skills and attitudes to\nperform work activities to the standard expected in the\nworkplace.\n2. Certification\nRefers to the process of verifying and validating\ncompetencies of a person through assessment.\n3. Element\nRefers to the building blocks of a unit of competency. It\ndescribes in outcome terms the functions that a person\nwho works in a particular area of work is able to perform.\n4. Evidence Guide\nIt is a guide for assessment that provides information on\ncritical aspects of competency, underpinning knowledge,\nunderpinning skills, resource implications, context of\nassessment and assessment method.\n5. Girder\nRefers to a large beam made of metal or concrete\n6. Philippine TVET\n Qualification\n Framework\nRefers to a comprehensive, nationally consistent\nframework for qualifications in the TVET sector. It also\nprovides the parameter for the integration of learning and\nassessment in the middle skills development.\n7. Qualification\nRefers to the national certificate issued by the TESDA or\nits accredited industry organizations in recognition that a\nperson has achieved competencies relevant to a trade or\nindustry.\n8. Range of\n Variable\nIt describes the circumstances or context in which the\nwork is to be performed.\n9. Slabs\nRefers to a part of a reinforced concrete floor, roof or\nplatform which spans beams, columns, walls or piers\n10. Unit of\n Competency\nRefers to a discrete aspect of work, which would\nnormally be performed by only one person.\n\n--- PDF PAGE 45 ---\nReinforcing Steel Works NC II (Amended) Promulgated December 2013\n43\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies who contributed their\ntime and expertise to the development of these Training Regulations.\n\n•\nTHE TECHNICAL/INDUSTRY EXPERTS\n\nJOHN N. CALAMIONG, Ed.D.\nProfessor II\nTechnological University of the\nPhilippines - Taguig Campus\nJIMMY GEMENTRA\nPiping Supervisor\nEEI Corporation\nLILIAN MACANDOG\nOperations Manager\nFCG Group Phils.\nRAFAEL MANALO\nExecutive Vice-President\nJ.E. Manalo Co.\nMEYNARDO PALARCA\nTrainor\nAssociation of Construction and Informal\nWorkers\nDANILO PANCHO\nProject Coordinator\nCM Pancho Construction\nMICHAEL RUDOLFO\nMaintenance Engineer\nCM Pancho Construction\nYUMUL NESTOR\nOperations Manager\nF.F. Cruz and Co.\n\n--- PDF PAGE 46 ---\nReinforcing Steel Works NC II (Amended) Promulgated December 2013\n44\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies who contributed their time and expertise to the\ndevelopment of these Training Regulations.\n\nFOR THE REVISION STAGE\n\n•\nTHE TECHNICAL/INDUSTRY EXPERTS\n\nLITO G. GARCIA\nDirector\nPhilippine Constructors, Association, Inc.\nMARCELO R. ABAD\nDM Consunji Inc., Consultant\n\nDr. PETER M. URETA\nCHED Technical Expert Panel\nEngr. GERARDO J. SULIT\nProject Manager\nDATEM Incorporated\nEngr. ARNEL J. BOSTON\nConstruction Manpower Development Foundation\n\nJOHN S. JUAN\nConstruction Manpower Development\nFoundation\nIGMIDIO J. AQUINO, JR.\nSenior Trade & Industry Dev’t. Specialist\nConstruction Manpower Development Foundation\n\nThe PARTICIPANTS in the Validation of these Training Regulations\n\nENGR. DWIGHT TA-ALA\nManager\nInfra D.M. Consunji Inc. Homes\nENGR. RICHARD LORICA\nDatem, Inc.\n\nENGR. CERELITO ROSARIO\nD.M. Consunji Inc.\nENGR. MAR RESUMADERO\nDatem, Inc.\nENGR. JOHN ANDREW ESPORLAS\nDM Consunji Inc.\nENGR. CRIS PATRICK CALALANG\nDatem, Inc.\nENGR. SALVADOR OLIVAR\nD.M. Consunji Inc.\n\nMembers of the TESDA Board\n\nTESDA EXCOM\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\n•\nQualification and Standards Office (QSO