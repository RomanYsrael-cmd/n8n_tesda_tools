        "source_title": "FABRICATE RSB MATERIALS",
        "source_text": "--- PDF PAGE 30 ---\nReinforcing Steel Works NC II  (Amended)                Promulgated December 2013                           28 \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY  : \nFABRICATE RSB MATERIALS  \nUNIT CODE                       : \nCON713337 \nUNIT DESCRIPTOR          : \nThis unit covers the knowledge, skills and attitudes \nrequired to measure, mark, cut, bend and perform \nfabrication procedures for reinforcing steel bar (RSB) \nmaterials. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized and bold terms are elaborated in the Range of \nVariables \n1. Organize and prepare \nfor work \n \n1.1 Job requirement is interpreted based on drawings, \nqueries, work location and superior's instructions.  \n1.2 Occupational Safety and Health Standards (OSHS) \nspecifications are identified in line with job \nrequirements. \n1.3 Safety hazards are identified in line with job \nrequirements. \n1.4 RSB tools, materials and equipment are identified \naccording to job requirements. \n1.5 Personal protective equipment is selected and used \nin accordance to job requirements. \n1.6 Start up procedures for tools and equipment are \nperformed and abnormalities are reported to \nappropriate personnel in line with company standard \noperating procedure. \n1.7 OSH orientation, toolbox meetings and specialized \ninstructions are participated in accordance with \norganization guidelines and procedures\n2. Fabricate RSB material \n2.1 Material preparation procedure is performed in \naccordance with fabrication drawings. \n2.2 Fabrication procedure is performed in accordance \nwith job specifications and bar cutting schedules. \n2.3 Task is performed without causing damage to tools \nand equipment and injury to self and others.\n3. Perform clean-up  \n3.1 Excess “cut length” are stacked/ stored for re-use or \ndisposal. \n3.2 Work area is cleared in accordance to OSHS \nrequirements and company standard operating \nprocedure. \n3.3  Tools and equipment are cleaned, and stored  \n       according to manufacturer's recommendations.  \n3.4  Scrap are disposed following company \npolicies/procedures.\n\n--- PDF PAGE 31 ---\nReinforcing Steel Works NC II  (Amended)                Promulgated December 2013                           29 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Job requirements\nMay include: \n1.1 Frame structure \n       1.1.1 Footings  \n       1.1.2 Columns \n       1.1.3 Beams and girder \n       1.1.4 Slabs \n2. OSHS specifications \nMay include:\n2.1 Work site environment and safety  \n2.2 Personal protective equipment (PPE) \n2.3 Safe handling of RSB tools and equipment \n2.4 Safe handling of RSB materials \n2.5 Emergency procedures \n3. Safety hazards\nMay include:\n3.1  Pathway obstacles \n3.2  Excess “cut length” material \n3.3  Movement of other work personnel \n4. RSB Tools, materials and \nequipment  \nMay include:\n4.1 Tools  \n        4.1.1  Steel tape \n        4.1.2  Bar cutter (manual) \n        4.1.3  Bar bender (manual) \n4.2 Equipment  \n        4.2.1  Bar bender (electric and hydraulic) \n        4.2.2  Bar cutter (electric and hydraulic) \n4.3 Material  \n         4.1.1 RSB (deformed, plain) \n          \n5. Personal protective \nequipment \nMay include:\n5.1 Safety shoes \n5.2 Gloves \n5.3 Hard hat \n5.4 Safety glasses / goggles \n6. Appropriate personnel \nMay include:\n6.1 Rebar engineer  \n6.2 Foreman \n6.3 Leadman \n7. Material preparation \nprocedure \nMay include:\n7.1 Measuring and marking \n8. Fabrication procedure \nMay include:\n8.1 Cutting  \n8.2 Bending  \n8.3 Bundling and Tagging \n8.4 Stacking\n\n--- PDF PAGE 32 ---\nReinforcing Steel Works NC II  (Amended)                Promulgated December 2013                           30 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Organized and prepared work \n1.2 Fabricated RSB material \n1.3 Performed clean-up \n1.4 Performed OSH practices \n2. Required  Knowledge  2.1 Job requirements \n2.2 OSHS specifications \n2.3 Manufacturer’s recommendations \n2.4 Company standard operating procedures \n2.5 Fabrication procedure for RSB materials \n2.6 Quality procedures, e.g., 5S \n2.7 Environmental-conservation procedures,  \n       e.g., 3R (reduce, reuse, recycle) \n2.8 Relevant sections of DOLE DO 13 Guidelines governing \noccupational safety and health in the construction industry\n3. Required Skills \n3.1 Understanding job requirements \n3.2 Following OSHS specifications \n3.3 Following manufacturer’s recommendations \n3.4 Following company standard operating procedures \n3.5 Performing fabrication procedure for RSB materials \n4. Resource Implications The following resources should be provided: \n4.1 RSB tools, equipment and materials \n4.2 Work area \n4.3 Bar-cutting schedule  \n4.4 Fabrication drawings \n4.5 PPE \n5.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n5.1 Direct observation / Demonstration of practical skills \n5.2 Oral questioning \n5.3 Portfolio \n5.4 Third-party report \n6.  Context for \nAssessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated environment\n",
