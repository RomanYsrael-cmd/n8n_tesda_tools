    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: Reinforcing Steel Works Level: NC II\n\nNominal Training Duration: 18 Hrs. - Basic Competencies\n24 Hrs. - Common Competencies\n120 Hrs. - Core Competencies\n\n162 Hrs.\n\nCourse Description:\nThis course is designed to develop and impart knowledge, skills and\ndesirable work attitudes on Reinforcing Steel Works. It covers the basic and\ncommon as well as the core competencies of fabricating and installing RSB\nmaterials in high rise and infrastructure projects.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion.\n•\nGroup\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\n•\nDiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development\n•\nDiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews /\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Identify hazards and risks\n4.2 Evaluate hazard and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational\nhealth and safety\nawareness\n•\nDiscussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 37 ---\nReinforcing Steel Works NC II (Amended) Promulgated December 2013 35\nCOMMON COMPETENCIES\n(24 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials\nand tools\n1.1 Identify Materials\n1.2 Requisition\nMaterials\n1.3 Receive and inspect\nmaterials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n2. Observe\nprocedures,\nspecification\ns and\nmanuals of\ninstruction\n2.1 Identify and access\nspecification/\nmanuals\n2.2 Interpret manuals\n2.3 Apply information in\nmanual\n2.4 Store manuals\n\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n(able to impart\nknowledge and\nskills)\n3. Perform\nmensuration\ns and\ncalculations\n3.1 Select measuring\ninstruments\n3.2 Carry out\nmeasurements and\ncalculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n(able to impart\nknowledge and\nskills)\n4. Maintain\ntools and\nequipment\n4.1 Check condition of\ntools and\nequipment\n4.2 Perform basic\npreventive\nmaintenance\n4.3 Store tools and\nequipment\n\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation of\napplication of\ntasks\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n5. Interpret\n technical\n drawings\nand plans\n\n5.1 Analyze signs,\nsymbols and data\n5.2 Interpret technical\ndrawings and plans\n5.3 Apply freehand\nsketching\nLecture\nDemonstration\nPractical exercises\nDemonstration and\noral questioning\nWritten test\n\n--- PDF PAGE 38 ---\nReinforcing Steel Works NC II (Amended) Promulgated December 2013 36\nCORE COMPETENCIES\n(120 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Fabricate RSB\nmaterials\n1.1 Organize and prepare for\nwork\n1.2 Fabricate RSB material\n1.3 Perform clean-up\n1.4 Perform OHS practices\n• Lecture /\nDiscussion\n• Self pace