  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Reinforcing Steel Works NC II.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: Reinforcing Steel Works Level: NC II\n\nNominal Training Duration: 18 Hrs. - Basic Competencies\n24 Hrs. - Common Competencies\n120 Hrs. - Core Competencies\n\n162 Hrs.\n\nCourse Description:\nThis course is designed to develop and impart knowledge, skills and\ndesirable work attitudes on Reinforcing Steel Works. It covers the basic and\ncommon as well as the core competencies of fabricating and installing RSB\nmaterials in high rise and infrastructure projects.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion.\n•\nGroup\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\n•\nDiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development\n•\nDiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews /\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Identify hazards and risks\n4.2 Evaluate hazard and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational\nhealth and safety\nawareness\n•\nDiscussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- 