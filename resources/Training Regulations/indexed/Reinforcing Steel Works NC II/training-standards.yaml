    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Reinforcing Steel Works NC II.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: Reinforcing Steel Works Level: NC II\n\nNominal Training Duration: 18 Hrs. - Basic Competencies\n24 Hrs. - Common Competencies\n120 Hrs. - Core Competencies\n\n162 Hrs.\n\nCourse Description:\nThis course is designed to develop and impart knowledge, skills and\ndesirable work attitudes on Reinforcing Steel Works. It covers the basic and\ncommon as well as the core competencies of fabricating and installing RSB\nmaterials in high rise and infrastructure projects.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion.\n•\nGroup\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\n•\nDiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development\n•\nDiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews /\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\nprocedures\n4.1 Identify hazards and risks\n4.2 Evaluate hazard and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational\nhealth and safety\nawareness\n•\nDiscussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 37 ---\nReinforcing Steel Works NC II (Amended) Promulgated December 2013 35\nCOMMON COMPETENCIES\n(24 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials\nand tools\n1.1 Identify Materials\n1.2 Requisition\nMaterials\n1.3 Receive and inspect\nmaterials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n2. Observe\nprocedures,\nspecification\ns and\nmanuals of\ninstruction\n2.1 Identify and access\nspecification/\nmanuals\n2.2 Interpret manuals\n2.3 Apply information in\nmanual\n2.4 Store manuals\n\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n(able to impart\nknowledge and\nskills)\n3. Perform\nmensuration\ns and\ncalculations\n3.1 Select measuring\ninstruments\n3.2 Carry out\nmeasurements and\ncalculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n(able to impart\nknowledge and\nskills)\n4. Maintain\ntools and\nequipment\n4.1 Check condition of\ntools and\nequipment\n4.2 Perform basic\npreventive\nmaintenance\n4.3 Store tools and\nequipment\n\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect\nobservation of\napplication of\ntasks\nOral\nquestioning\nWritten test or\nexamination\nThird party\nreport\nDemonstration\n5. Interpret\n technical\n drawings\nand plans\n\n5.1 Analyze signs,\nsymbols and data\n5.2 Interpret technical\ndrawings and plans\n5.3 Apply freehand\nsketching\nLecture\nDemonstration\nPractical exercises\nDemonstration and\noral questioning\nWritten test\n\n--- PDF PAGE 38 ---\nReinforcing Steel Works NC II (Amended) Promulgated December 2013 36\nCORE COMPETENCIES\n(120 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Fabricate RSB\nmaterials\n1.1 Organize and prepare for\nwork\n1.2 Fabricate RSB material\n1.3 Perform clean-up\n1.4 Perform OHS practices\n• Lecture /\nDiscussion\n• Self paced\ninstruction\n• Demonstration\n• Practical\nexercises\n• Observation\n• Written/oral\nquestioning\n2. Install RSB\nmaterials\n2.1 Organize and prepare\nfor work\n2.2 Install fabricated RSB\nmaterial\n2.3 Perform clean-up\n2.4 Perform OHS practices\n\n• Lecture /\nDiscussion\n• Self paced\ninstruction\n• Demonstration\n• Practical\nexercises\n• Observation\n• Written/oral\nquestioning\n\n--- PDF PAGE 39 ---\nReinforcing Steel Works NC II (Amended) Promulgated December 2013 37\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET:\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the performance\nof work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n• Training allows for multiple entry and exit; and\n• Training programs are registered with the UTPRAS.\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n• Project-Based Instruction is an authentic instructional model or\nstrategy in which students plan, implement and evaluate projects that\nhave real world applications.\n\n--- PDF PAGE 40 ---\nReinforcing Steel Works NC II (Amended) Promulgated December 2013 38\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements may also\nbe stated. Passing written eentrance examinations may also be indicated if\nnecessary.\n\n• Can communicate both orally and written\n• Can perform basic mathematical computation and mensuration.\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS FOR\nREINFORCING STEEL WORKS NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n25 units\nSteel tape\n1 unit Bar bender (electric\nand hydraulic)\n50 pcs.\nRSB (12 mm  X 6\nm.)\n1 unit\nManual Bar cutter\n1 unit Bar cutter (electric\nand hydraulic)\n50 pcs.\nRSB (10 mm  x 6 m)\n5 pcs.\nHacksaw\n1 unit\nChain block\n50 pcs.\nRSB (16 mm  x 6 m)\n5 pcs.\nBench vise\n\n25 kgs.\nG.I tie wire (gauge\n20)\n5 pcs.\neach\nManual Bar bending\ntools\n(bending jig,\nbending pipe,\nbending bench)\n\n25 pcs.\nSoft stone\n25 sets\nPPE (Safety shoes,\ngloves, hard hat,\ngoggles)\n\n25 kgs. Rags\n25 pcs.\nWire twister\n(“Ganso”)\n\nSpacer (plastic,\ncement block)\n5 pcs.\nHose level (10\nmeters)\n\n5 pcs.\nCouplers (12mm or\n16mm)\n5 pcs.\nSpirit level, (level\nbar) 450mm (18”)\n\nLearning Materials\n5 pcs.\nChalk line box\nVideo presentation\n5 pcs.\nPlumb bob\n5 pcs.\nPliers\n\n--- PDF PAGE 41 ---\nReinforcing Steel Works NC II (Amended) Promulgated December 2013 39\n3.5 TRAINING FACILITIES\n\nThe training facility is based on the size of class of 25 students / trainees.\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nTotal Area in\nSq. Meters\nStudent/Trainee Working Space\n2 x 4\n40 sq m. /\ngroup of 5\nstudents\n200\nContextual Learning\nLaboratory / Lecture Room\n\n42\n42\nLearning Resource\nCenter\n\n20\n20\nTool Room/Storage\n10\n10\nWash room/ CR\n10\n10\nCirculation area\n10 x 6\n60\n60\nTOTAL AREA\n342\n\n3.6 TRAINER’S QUALIFICATION FOR REINFORCING STEEL WORKS NC II\n\n• Must be a holder of National TVET Trainers Certificate (NTTC)\n Level 1 in Reinforcing Steel Works NC II with 2 years industry\n experience for the reinforcing steel (rebar) works.\n• Holder of Basic Occupational Safety and Health (BOSH)\nCertificate or Construction Occupational Safety and Health\n• Must be computer literate\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 42 ---\nReinforcing Steel Works NC II (Amended) Promulgated December 2013 40"
