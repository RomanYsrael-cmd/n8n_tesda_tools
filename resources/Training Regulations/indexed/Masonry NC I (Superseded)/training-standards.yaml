________________________________________________________________\nTR - MASONRY NC I 43\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the performance\nof work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\njust facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo or computer technologies.\n\n--- PDF PAGE 46 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 44\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n•\ncan communicate either oral and written\n•\nphysically and mentally fit\n•\nwith good moral character\n•\ncan perform basic mathematical computation and mensuration\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Masonry NC Level I.\n\nTOOLS\nEQUIPMENT\nMATERIAL\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n10 pcs.\nBucket\n1 unit\nOne bagger\nmixer\n625\npcs.\nConcrete Hallow\nblocks\n1 pc\nMixing board\n25 sets PPE\n20 bags Cement\n12 pcs.\nShovel\n1 set\nAutomatic level\n(optional)\n50 pcs.\nReinforcing bars (10\nmm dia)\n25 pcs.\nSteel trowel\n1 unit\nWelding\nmachine\n6 m3\nSand\n25 pcs.\nWooden float\n2 pcs.\nPortable Grinder\nWater\n25 pcs.\nSteel tape\n2 pcs.\nHammer drill\n4o kls.\nGI wire\n6 pcs.\nMason hammer\n2 pcs.\nElectric drill\n10 kls.\nCommon wire Nails\n(assorted sizes)\n6 pcs.\nPlumb bob\n\n100\npcs.\nLumber(2” x 2” x 10’)\n1 set\nScaffolding\n\n5 kls.\nConcrete nails\n6 pcs.\nMarking gauge\n\n10 bags Lime\n6 pcs.\nHand saw\n\n10 bags Fly ash\n2 pcs.\nBar cutter\n\n25 pcs.\nPencil\n2 pcs.\nBar bender\n\n5 kls.\nNylon string\n4 pcs.\nSteel square\n\n6 m3\nGravel\n25 pcs.\nCold chisel\n\n5 m\nSand Screen 100mm\n12 pcs.\nHacksaw\n\n5 gals.\nConcrete neutralizer\n6 pcs.\nLevel hose\n\n9 pcs\nPlywood ½” X 4’ X 8’\n25 pcs.\nStraight edge\n\n6 pcs.\nSpirit level\n\n25 pcs.\nClaw hammer\n\n--- PDF PAGE 47 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 45\n25 pcs.\nChalk line\n\n25 pcs.\nSteel float\n\n4 pcs.\nMeasuring box\n\n2 dozen Hack saw\nblade\n\n5 kls.\nWelding rod\n\n12 pcs.\nTri-square\n\n25 pcs.\nSteel brush\n\n4 pcs.\nWheel borrow\n\n25 pcs.\n4” Paint Brush\n\n25 pcs.\n2” Paint Brush\n\n12 pcs.\nClaw bar\n\n4 pcs.\nSledge\nhammer\n\n20\nmeters\nRope 1“ dia.\n\n4 pcs.\nPulley\n\n1 set\nDrill bits\n\nNOTE: Estimate of materials was based on an individual project of a 1m X 2m wall with 8” X 8” X\n1m concrete post hence, the kind and quantity of materials will vary accordingly on the type of\nprojects designed.\n\n--- PDF PAGE 48 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 46\n\n3.5\nTRAINING FACILITIES\n\nMasonry NC – I\n\nThe masonry workshop must be of concrete structure. Based on class size\nof 25 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nTEACHING/LEARNING AREAS\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n Open plain ground\n\n625\n Lecture Room (job site/\nschool) including wash area\n\n62.5\nTotal Workshop Area\n\n687.50\n\n3.6\nTRAINERS QUALIFICATIONS FOR MASONRY NC I\n\nTRAINER QUALIFICATION (TQ I)\n\n•\nMust be a holder of NC II or its equivalent qualification\n•\nMust have undergone training on Training Methodology I (TM I) or\nhave attended any trainer training methodology course accredited\nby TESDA or graduate of any education course\n•\nMust be physically and mentally fit\n•\nMust have at least 1year job/industry experience\n\n Reference: TESDA Board Resolution No. 2004 03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 49 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 47"
