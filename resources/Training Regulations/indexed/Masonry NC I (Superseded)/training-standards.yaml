    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for Masonry NC Level I.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: Masonry NC Level: I\n\nNominal Training Hours: 28 hours (basic)\n 20 hours (common)\n 56 hours (core)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of\nmason in accordance with industry standards. It covers the basic, common and\ncore competencies in Masonry NC I.\n\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and respond\nto workplace\ncommunication\n\n1.1 Explain routinary\nspeaking &\nmessages in a\nworkplace\n\n 1.2 Follow routinary\nspeaking &\nmessage\n\n1.3 Perform work\nduties following\nwritten notices\n\nGroup discussion\nInteraction\n\nInterviews/\nquestioning\n\nObservation\n\n--- PDF PAGE 40 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 38\n\n2. Work with others\n2.1 Develop effective\nworkplace\nrelationship\n\n2.2 Contribute to work\ngroup activities\n\nGroup discussion\n\nInteraction\n\nInterviews/\nquestioning\n\nDemonstration\n\nObservation\n3. Demonstrate work\nvalues\n\n3.1 Define the purpose\nof work\n\n3.1 Apply work\nvalues / ethics\n\n3.2 Deal with ethical\nproblems\n\n3.3 Maintain integrity of\n conduct in the\n workplace\n\nGroup discussion\n\nInteraction\n\nDemonstration\n\nObservation\n\nInterviews /\nquestioning\n4. Practice\nhousekeeping\nprocedures\n4.1 Sort and remove\nunnecessary items\n\n4.2 Arrange items\n\n4.3 Maintain work areas,\n tools and equipment\n\n 4.4 Follow standardize\n work process and\n procedures\n\n4.4 Perform work\n spontaneously\n\nGroup discussion\n\nInteraction\n\nDemonstration\n\nObservation\n\nInterviews /\nquestioning\n\n--- PDF PAGE 41 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 39\nCOMMON COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and tools\n1.1 Identify Materials\n\n1.2 Requisition\nMaterials\n\n1.3 Receive and inspect\nmaterials\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical\nExercise\n\nDemonstration\nDirect\nobservation\n\nQuestions or\ninterview\n\nPortfolio\n(credentials)\n\nWritten / Oral\nTest\n\nDemonstration\n2. Observe\nprocedures,\nSpecifications and\nManuals of\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\n\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect\nobservation\n\nOral\nquestioning\n\nWritten test or\nexamination\n\nThird party\nreport\n\nDemonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 42 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 40\n3. Perform mensuration\nand calculation\n3.1 Select measuring\ninstruments\n\n3.2 Carry out\nmeasurements and\ncalculations\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect\nobservation\n\nOral\nquestioning\n\nWritten test or\nexamination\n\nThird party\nreport\n\nDemonstration\n(able to impart\nknowledge and\nskills)\n4. Maintain tools and\nequipment\n4.1 Check condition of\ntools and\nequipment\n\n4.2 Perform basic\npreventive\nmaintenance\n\n4.3 Sharpen edge and\ntooth cutting tools\n\n4.4 Store tools and\nequipment\n\nAudio Visual\n\nSimulation\n\nDiscussion\n\nPractical Lab\n\nDemonstration\nDirect\nobservation of\napplication of\ntasks\n\nOral\nquestioning\n\nWritten test or\nexamination\n\nThird party\nreport\n\nDemonstration\n\n--- PDF PAGE 43 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 41\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare masonry\nmaterials\n1.1 Identify and\nexplain the uses of\ntools and\nequipment in basic\nmasonry works.\n\n1.2 Identify and\nexplain the\ncomposition,\nproperties, uses\nand types of\nmasonry\nmaterials.\n\n1.3 Enumerate and\nexplain the basic\nmethods and\nprocesses in\nmasonry\nconstruction.\n\n1.4 Identify and\n Interpret drawing\n symbols and\n plans\n\n1.5 Perform trade\nmathematics and\nmensuration.\n\n1.6 Perform 5S.\n\n1.7 Identify and\ndescribe safework\npractices and first\naid regulations.\n\n1.8 Perform safe work\npractices and\nrespond to\nemergency\nsituations.\n\nLecture\nDemonstration\n\nOn-the-Job\nDual training\n\nProject-based\ninstruction\n\nObservation and\noral questioning\n\nDemonstration and\noral questioning\n\nWritten test\n\n--- PDF PAGE 44 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 42\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Perform basic\nmasonry works\n2.1 Identify and explain\n the uses of tools and\n equipment in basic\n masonry works.\n\n2.2 Identify and explain\n the materials used\n in basic masonry\n works\n\n2.3 Identify and\n interpret drawing\n symbols and plans.\n\n2.4 Perform trade\n mathematics and\n mensuration.\n\n2.6 Identify and describe\n safety practices and\n first aid regulations in\n basic masonry\n works\n\n2.7 Perform safe work\n practices and\n respond to\n emergency\n situations.\n\n2.8 Install / dismantle\nScaffold.\n\n2.9 Establish\n plumbness and\n squareness of\n surface.\n\n2.10 Check all\nmasonry works.\n\n2.11 Clean work site\nand maintain\ntools and\nequipment.\n\nLecture\nDemonstration\n\nOn-the-Job\nDual training\n\nProject-based\ninstruction\nObservation and\noral questioning\n\nDemonstration and\noral questioning\n\nWritten test\n\n--- PDF PAGE 45 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 43\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the performance\nof work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\njust facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners\nare given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo or computer technologies.\n\n--- PDF PAGE 46 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 44\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n•\ncan communicate either oral and written\n•\nphysically and mentally fit\n•\nwith good moral character\n•\ncan perform basic mathematical computation and mensuration\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Masonry NC Level I.\n\nTOOLS\nEQUIPMENT\nMATERIAL\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n10 pcs.\nBucket\n1 unit\nOne bagger\nmixer\n625\npcs.\nConcrete Hallow\nblocks\n1 pc\nMixing board\n25 sets PPE\n20 bags Cement\n12 pcs.\nShovel\n1 set\nAutomatic level\n(optional)\n50 pcs.\nReinforcing bars (10\nmm dia)\n25 pcs.\nSteel trowel\n1 unit\nWelding\nmachine\n6 m3\nSand\n25 pcs.\nWooden float\n2 pcs.\nPortable Grinder\nWater\n25 pcs.\nSteel tape\n2 pcs.\nHammer drill\n4o kls.\nGI wire\n6 pcs.\nMason hammer\n2 pcs.\nElectric drill\n10 kls.\nCommon wire Nails\n(assorted sizes)\n6 pcs.\nPlumb bob\n\n100\npcs.\nLumber(2” x 2” x 10’)\n1 set\nScaffolding\n\n5 kls.\nConcrete nails\n6 pcs.\nMarking gauge\n\n10 bags Lime\n6 pcs.\nHand saw\n\n10 bags Fly ash\n2 pcs.\nBar cutter\n\n25 pcs.\nPencil\n2 pcs.\nBar bender\n\n5 kls.\nNylon string\n4 pcs.\nSteel square\n\n6 m3\nGravel\n25 pcs.\nCold chisel\n\n5 m\nSand Screen 100mm\n12 pcs.\nHacksaw\n\n5 gals.\nConcrete neutralizer\n6 pcs.\nLevel hose\n\n9 pcs\nPlywood ½” X 4’ X 8’\n25 pcs.\nStraight edge\n\n6 pcs.\nSpirit level\n\n25 pcs.\nClaw hammer\n\n--- PDF PAGE 47 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 45\n25 pcs.\nChalk line\n\n25 pcs.\nSteel float\n\n4 pcs.\nMeasuring box\n\n2 dozen Hack saw\nblade\n\n5 kls.\nWelding rod\n\n12 pcs.\nTri-square\n\n25 pcs.\nSteel brush\n\n4 pcs.\nWheel borrow\n\n25 pcs.\n4” Paint Brush\n\n25 pcs.\n2” Paint Brush\n\n12 pcs.\nClaw bar\n\n4 pcs.\nSledge\nhammer\n\n20\nmeters\nRope 1“ dia.\n\n4 pcs.\nPulley\n\n1 set\nDrill bits\n\nNOTE: Estimate of materials was based on an individual project of a 1m X 2m wall with 8” X 8” X\n1m concrete post hence, the kind and quantity of materials will vary accordingly on the type of\nprojects designed.\n\n--- PDF PAGE 48 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 46\n\n3.5\nTRAINING FACILITIES\n\nMasonry NC – I\n\nThe masonry workshop must be of concrete structure. Based on class size\nof 25 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nTEACHING/LEARNING AREAS\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n Open plain ground\n\n625\n Lecture Room (job site/\nschool) including wash area\n\n62.5\nTotal Workshop Area\n\n687.50\n\n3.6\nTRAINERS QUALIFICATIONS FOR MASONRY NC I\n\nTRAINER QUALIFICATION (TQ I)\n\n•\nMust be a holder of NC II or its equivalent qualification\n•\nMust have undergone training on Training Methodology I (TM I) or\nhave attended any trainer training methodology course accredited\nby TESDA or graduate of any education course\n•\nMust be physically and mentally fit\n•\nMust have at least 1year job/industry experience\n\n Reference: TESDA Board Resolution No. 2004 03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 49 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 47"
