  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1.\nTo attain the National Qualification of Masonry NC I, the candidate\nmust demonstrate competence through project-type assessment\ncovering all the units listed in Section 1. Successful candidates shall\nbe awarded a National Certificate signed by the TESDA Director\nGeneral.\n\n4.2.\nThe qualification of Masonry NC I maybe attained through:\n\n4.1.1 Accumulation of Certificates of Competency (COCs) in the\nfollowing areas:\n\n4.1.1.1 Prepare masonry materials\n4.1.1.2 Perform basic masonry work\n\nSuccessful candidates shall be awarded Certificates of Competency\n(COCs)\n\n4.1.2 Demonstration of competence through project-type assessment\ncovering all required units of the qualification\n\n4.3.\nAssessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.4.\nThe following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs\n\n4.3.2. Experienced Workers (wage employed or self-employed)\n\n4.5.\nThe guidelines on assessment and certification are discussed in\ndetail in the “Procedures Manual on Assessment and Certification“\nand “Guidelines on the Implementation of the Philippine TVET\nQualification and Certification System (PTQCS)”.\n\n--- PDF PAGE 50 ---\nCOMMON\nCOMPETENCIES\nCORE COMPETENCIES\n"
