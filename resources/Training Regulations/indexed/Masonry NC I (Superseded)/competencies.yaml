  "source_section_text": "Section 1. Successful candidates shall\nbe awarded a National Certificate signed by the TESDA Director\nGeneral.\n\n4.2.\nThe qualification of Masonry NC I maybe attained through:\n\n4.1.1 Accumulation of Certificates of Competency (COCs) in the\nfollowing areas:\n\n4.1.1.1 Prepare masonry materials\n4.1.1.2 Perform basic masonry work\n\nSuccessful candidates shall be awarded Certificates of Competency\n(COCs)\n\n4.1.2 Demonstration of competence through project-type assessment\ncovering all required units of the qualification\n\n4.3.\nAssessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\n4.4.\nThe following are qualified to apply for assessment and certification:\n\n4.3.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs\n\n4.3.2. Experienced Workers (wage employed or self-employed)\n\n4.5.\nThe guidelines on assessment and certification are discussed in\ndetail in the “Procedures Manual on Assessment and Certification“\nand “Guidelines on the Implementation of the Philippine TVET\nQualification and Certification System (PTQCS)”.\n\n--- PDF PAGE 50 ---\nCOMMON\nCOMPETENCIES\nCORE COMPETENCIES\nCOMPETENCY MAP\nCONSTRUCTION - CIVIL WORKS SUB-SECTOR\n\nPerform Complex and\nMulti-Story Plumbing\nInstallation and\nAssemblies\n\nInstall Hot and\nPotable Chilled\nWater Piping\nSystem\nDraft Plumbing\nDesign\nConduct Pipe\nLeak Testing\nPerform Single Unit\nPlumbing Installation\nand Assemblies\n\nPerform Plumbing\nRepair and\nMaintenance Works\n\nPrepare\nconstruction\nMaterials and Tools\nObserve Procedures,\nSpecifications and\nManuals of Instructions\n\nPerform\nMensurations\nMaintain Tools and\nEquipment\n\nPerform\nMensurations and\nCalculations\n\nInterpret Technical\nDrawings and\nPlans\n\nPrepare Pipes\nfor Installation\nPerform Minor\nConstruction\nWorks\n\nMake Piping Joints\nand Connections\nANNEX A\n\nFabricate\nFormworks\nInstall stair\ncomponents and/or\npre-fabricated stair\nassembly\nInstall architectural\nceiling, wall\nsheats/panels/\nboards and floor\n\nFabricate/Install\nDoor/Window\nJambs and\nPanels\n\nStrip\nFormwork\nComponents\n\nInstall built-in\nand/or pre-\nfabricated\ncabinets\n\nPerform basic\nmasonry works\n\nLay brick/ block\nfor structures\n\nEstimate Paint\nRequirements\n\nPrepare tools,\npainting\nmaterials and\nequipment\nPerform\nMixing/Tinting of\nColor Paints\nPlaster concrete/\nmasonry surfaces\nPerform Painting\nWorks\nInstall pre-cast\nballusters and\nhandrails\nRepairs defective\nconcrete and\nmasonry surfaces\nApply special\ncement finishes to\nconcrete and\nmasonry surfaces\nPrepare\nmasonry\nmaterials\nPerform Painting\nRepair Work\nPrepare Surface\nfor Painting\nInstall\nFraming\nWorks\nInstall\nFormwork\nComponents\nStake-out\nBuilding\nMASONRY NC I\nLead workplace\ncommunication\nWork with\nothers\nWork in\nenvironment\nLead small\nteams\nSolve problems\nrelated to\nactivities\nReceive and\nRespond to\nworkplace\ncommunication\nParticipate in\nworkplace\ncommunication\nBASIC\nCOMPETENCIES\nApply problem\nsolving\ntechniques to\nworkplace\nPlan and\norganize work\nPractice\nprofessionalism\nDemonstrate\nwork\nPractic\noccupational\nhealth and\n Safety procedures\nDevelop and\npractice\nnegotiation\nUse\nmathematical\nmethod\nUse relevant\ntechnologies\nUtilize\nspecialized\ncommunication\nskills\nDevelop team\nand individual\nCollect,\nand organize\ninformation\nPromote\nenvironment\nprotection\nPractice basic\nhousekeeping\nprocedures\n58\n\n--- PDF PAGE 51 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 59\nDEFINITION OF TERMS\n\n1. Baluster\nRefers to a post, which supports a handrail and encloses the\nopen sections of a stairway.\n\n2. Competency\nIs the application of knowledge, skills and attitudes to perform\nwork activities to the standard expected in the workplace.\n\n3. Cement\nIs a dry powder from silica, alumina, lime, iron oxide and\nmagnesia which hardens when mix with water.\n\n4. Certification\nRefers to the process of verifying and validating competencies of\na person through assessment.\n\n5. Dowel\nA headless, cylindrical pin which, is sunk into corresponding\nholes.\n6. Element\nRefers to the building blocks of a unit of competency. It\ndescribes in outcome terms the functions that a person who\nworks in a particular area of work is able to perform.\n\n7. Evidence Guide\nIt is a guide for assessment that provides information on critical\naspects of competency, underpinning knowledge, underpinning\nskills, resource implications, context of assessment and\nassessment method.\n\n8. General Masonry Refers to the preparation and placement of concrete for\nstructures; finishing masonry surfaces by plastering, chipping,\ngrinding, jointing, sand blasting, terrazzo and other related\nprocesses; installation, laying, fitting and setting of masonry\nproducts, such as bricks, stones, marble tiles, mosaic panels\nand similar or associated materials.\n\n9. Handrail\nRefers to a narrow rail to be grasped by a person for support.\n\n10. Level\nRefers to the category following the level of difficulty and\ncomplexity of skills and knowledge required to do the job.\n\n11. Lintel\nRefers to the horizontal member over an opening such as door\nor window, usually carrying the load.\n\n--- PDF PAGE 52 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 60\n\n12. Mortar\nRefers to a mixture of cement lime and sand used for laying\nbricks or masonry.\n\n13. Philippine\n TVET\n Qualification\nFramework\nRefers to a comprehensive, nationally consistent framework for\nqualifications in the TVET sector. It also provides the parameter\nfor the integration of learning and assessment in the middle skills\ndevelopment.\n\n14. Qualification\nRefers to the national certificate issued by the TESDA or its\naccredited industry organizations in recognition that a person\nhas achieved competencies relevant to a trade or industry.\n\n15. Range of\nVariable\nIt describes the circumstances or context in which the work is to\nbe performed.\n\n16. Reinforcing bar Refers to the steel rods that are embedded in building materials\nsuch as concrete for reinforcement.\n\n17. Scaffold\nRefers to a temporary or movable platform supported on the\nground or suspended, used for working at considerable heights\nabove the ground.\n\n18. Unit of\n Competency\nRefers to a discrete aspect of work, which would normally be\nperformed by only one person.\n\n--- PDF PAGE 53 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 61\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend thanks and appreciation to the many representatives of business,\nindustry, academe and government agencies and who contributed their time and\nexpertise to the development and validation of this Training Regulations.\n\n•\nTHE TECHNICAL/INDUSTRY EXPERTS\n\nRichard M. Honrado\nEEI Corporation\n#12 Manggahan St.,\nBrgy. Bagumbayan, Quezon City\nPaulino M. Villacruzada\nDM Consunji, Inc.\nDMCI Plaza, 2281 Pasong Tamo Ext.\nMakati City\n\nVictor A. Frias\nMakati Development Corporation\nAyala FGU Bldg.,\nMadrigal Business Park\nAlabang, Muntinlupa City\n\nWilfredo V. Traya\nNational Union of Building &\n Construction Workers\nDoor 2, Monteverde Bldg.,\nBangoy St., Davao City\n\nMeynardo P. Palarca\nNational Union of Building &\n Construction Workers\n26 Matalino St.,\nDiliman, Quezon City\nRuel C. Carballo\nNational Union of Building &\n Construction Workers\nDoor 2, Monteverde Bldg.,\nBangoy St., Davao City\n\nJoan D. Tañamor\nNational Union of Building &\n Construction Workers\nDoor 2, Monteverde Bldg.,\nBangoy St., Davao City\nValeriano D. Mag-usara\nUCC / Alson