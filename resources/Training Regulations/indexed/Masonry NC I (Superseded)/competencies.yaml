              "source_text": "Competency must be assessed through: 5.1 Direct Observation on actual workplace 5.2 Questions related to underpinning knowledge 5.3 Third party report 5.4 Demonstration on simulated situation 5.5 Interview 6. Context for Assessment 6.4 Competency may be assessed in the workplace or in a simulated workplace setting"
