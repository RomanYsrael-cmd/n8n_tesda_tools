  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core\nunits of competency required in MASONRY NC I.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY:\nRECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION\nUNIT CODE :\n\n500311101\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto receive, respond and act on verbal and written\ncommunication.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Follow routine spoken\nmessages\n1.1. Required information is gathered by listening\nattentively and correctly interpreting or understanding\ninformation/instructions\n1.2. Instructions/information are properly recorded\n1.3. Instructions are acted upon immediately in\naccordance with information received\n1.4. Clarification is sought from workplace supervisor on all\noccasions when any instruction/information is not clear\n\n2. Perform workplace\nduties following written\nnotices\n2.1 Written notices and instructions are read and\ninterpreted correctly in accordance with\norganizational guidelines\n2.2 Routine written instruction are followed in sequence\n2.3 Feedback is given to workplace supervisor based on\nthe instructions/information received\n\n--- PDF PAGE 5 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 3\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nIt refers to :\n1.1. Handwritten and printed material\n1.2. Internal memos\n1.3. External communications\n1.4. Electronic mail\n1.5. Briefing notes\n1.6. General correspondence\n1.7. Marketing materials\n1.8. Journal articles\n\n2. Organizational\nGuidelines\nIt may include:\n2.1. Information documentation procedures\n2.2. Company policies and procedures\n2.3. Organization manuals\n2.4. Service manual\n\n--- PDF PAGE 6 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 4\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated knowledge of organizational procedures\nfor handling verbal and written communications\n1.2. Received and acted on verbal messages and\ninstructions\n1.3. Demonstrated competency in recording\ninstructions/information\n\n2. Underpinning\nKnowledge and\nAttitudes\n2.1. Knowledge of organizational policies/guidelines in\nregard to processing internal/external information\n2.2. Ethical work practices in handling communications\n2.3. Communication process\n3. Underpinning Skills\n3.1. Conciseness in receiving and clarifying\nmessages/information/communication\n3.2. Accuracy in recording messages/information\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1. Pens\n4.2. Note pad\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Direct Observation\n5.2. Oral interview\n5.3. Written Evaluation\n5.4. Third Party Report\n\n6. Context of Assessment\n6.1. Competency may be assessed individually in the\nactual workplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 7 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 5\nUNIT OF COMPETENCY:\nWORK WITH OTHERS\nUNIT CODE :\n\n500311102\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required\nto develop workplace relationship and contribute in\nworkplace activities\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Develop effective\nworkplace relationship\n1.1 Duties and responsibilities are done in a positive\nmanner to promote cooperation and good relationship\n1.2 Assistance is sought from workgroup when difficulties\narise and addressed through discussions\n1.3 Feedback provided by others in the team is\nencouraged, acknowledged and acted upon\n1.4 Differences in personal values and beliefs are\nrespected and acknowledged in the development\n\n2. Contribute to work\ngroup activities\n2.1 Support is provided to team members to ensure\nworkgroup goals are met\n2.2 Constructive contributions to workgroup goals and tasks\nare made according to organizational requirements\n2.3 Information relevant to work is shared with team\nmembers to ensure designated goals are met\n\n--- PDF PAGE 8 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 6\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements including\nOHS\n1.5 Code of conduct\n\n2. Work group\n2.1 Supervisor or manager\n2.2 Peers/work colleagues\n2.3 Other members of the organization\n\n3. Feedback on\nperformance\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues and\nclients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring service\ndelivery\n\n4. Providing support to\nteam members\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n\n5. Organizational\nrequirements\n\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes and\nstandards\n\n--- PDF PAGE 9 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 7\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1.\nProvided support to team members to ensure goals\nare met\n1.2.\nActed on feedback from clients and colleagues\n1.3.\nAccessed learning opportunities to extend own\npersonal work competencies to enhance team\ngoals and outcomes\n\n2. Underpinning Knowledge\n2.1.\nThe relevant legislation that affects operations,\nespecially with regards to safety\n2.2.\nReasons why cooperation and good relationships\nare important\n2.3.\nKnowledge of the organization’s policies, plans and\nprocedures\n2.4.\nUnderstanding how to elicit and interpret feedback\n2.5.\nKnowledge of workgroup member’s responsibilities\nand duties\n2.6.\nImportance of demonstrating respect and empathy\nin dealings with colleagues\n2.7.\nUnderstanding of how to identify and prioritize\npersonal development opportunities and options\n\n3. Underpinning Skills\n3.1.\nAbility to read and understand the organization’s\npolicies and work procedures\n3.2.\nWrite simple instructions for particular routine tasks\n3.3.\nInterpret information gained from correspondence\n3.4.\nCommunication skills to request advice, receive\nfeedback and work with a team\n3.5.\nPlanning skills to organized work priorities and\narrangement\n3.6.\nTechnology skills including the ability to select and\nuse technology appropriate to a task\n3.7.\nAbility to relate to people from a range of social,\ncultural and ethnic backgrounds.\n\n--- PDF PAGE 10 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 8\n\n4. Resource Implications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2.\nMaterials relevant to the proposed activity or task\n\n5. Methods of Assessment\nCompetency may be assessed through:\n5.1.\nDirect observations of work activities of the\nindividual member in relation to the work activities\nof the group\n5.2.\nObservation of simulation and/or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3.\nCase studies and scenarios as a basis for\ndiscussion of issues and strategies\n\n6. Context for Assessment\n6.1.\nCompetency assessment may occur in workplace\nor any appropriately simulated environment\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 11 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 9\n\nUNIT OF COMPETENCY:\nDEMONSTRATE WORK VALUES\nUNIT CODE :\n\n50031103\nUNIT DESCRIPTOR : This unit covers the knowledge, skills, and attitude in\ndemonstrating proper work values.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Define the purpose\nof work\n\n1.1 One’s unique sense of purpose for working and the\nwhy’s of work are identified, reflected on and clearly\ndefined for one’s development as a person and as a\nmember of society.\n1.2 Personal mission is in harmony with company’s values\n\n2. Apply work\nvalues/ethics\n2.1 Work values/ethics/concepts are classified and\nreaffirmed in accordance with the transparent company\nethical standards, policies and guidelines.\n2.2 Work practices are undertaken in compliance with\nindustry work ethical standards, organizational policy\nand guidelines\n2.3 Personal behavior and relationships with co-workers\nand/or clients are conducted in accordance with ethical\nstandards, policy and guidelines.\n2.4 Company resources are used in accordance with\ntransparent company ethical standard, policies and\nguidelines.\n\n3. Deal with ethical\nproblems\n3.1 Company ethical standards, organizational policy and\nguidelines on the prevention and reporting of unethical\nconduct are accessed and applied in accordance with\ntransparent company ethical standard, policies and\nguidelines.\n3.2 Work incidents/situations are reported and/or\nresolved in accordance with company\nprotocol/guidelines.\n3.3 Resolution and/or referral of ethical problems identified\nare used as learning opportunities.\n\n4. Maintain integrity of\nconduct in the\nworkplace\n4.1 Personal work practices and values are demonstrated\nconsistently with acceptable ethical conduct and\ncompany’s core values.\n4.2 Instructions to co-workers are provided based on\nethical, lawful and reasonable directives.\n4.3 Company values/practices are shared with co-workers\nusing appropriate behavior and language.\n\n--- PDF PAGE 12 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 10\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Work values / ethics /\n concepts\nMay include but are not limited to:\n1.1 Commitment/ Dedication\n1.2 Sense of urgency\n1.3 Sense of purpose\n1.4 Love for work\n1.5 High motivation\n1.6 Orderliness\n1.7 Reliability\n1.8 Competence\n1.9 Dependability\n1.10 Goal-oriented\n1.11 Sense of responsibility\n1.12 Being knowledgeable\n1.13 Loyalty to work/company\n1.14 Sensitivity to others\n1.15 Compassion/Caring attitude\n1.16 Balancing between family and work\n1.17 Pakikisama\n1.18 Bayanihan spirit/teamwork\n1.19 Sense of nationalism\n\n2. Work practices\n2.1 Quality of work\n2.2 Punctuality\n2.3 Efficiency\n2.4 Effectiveness\n2.5 Productivity\n2.6 Resourcefulness\n2.7 Innovativeness/Creativity\n2.8 Cost conciousness\n2.9 5S\n2.10 Attention to details\n\n3. Incidents/situations\n3.1 Violent/intensed dispute or argument\n3.2 Gambling\n3.3 Use of prohibited substances\n3.4 Pilferages\n3.5 Damage to person or property\n3.6 Vandalism\n3.7 Falsification\n3.8 Bribery\n3.9 Sexual Harassment\n3.10 Blackmail\n\n--- PDF PAGE 13 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 11\n\nVARIABLE\nRANGE\n4. Company resources\n4.1 Consumable materials\n4.2 Equipment/Machineries\n4.3 Human\n4.4 Time\n4.5 Financial resources\n\n5. Instructions\n5.1 Verbal\n5.2 Written\n\n--- PDF PAGE 14 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 12\n EVIDENCE GUIDE\n1. Critical Aspects\n of Competency\nAssessment requires evidence that the candidate:\n1.1 Defined one’s unique sense of purpose for working\n1.2 Clarified and affirmed work values/ethics/concepts\nconsistently in the workplace\n1.3 Demonstrated work practices satisfactorily and consistently\nin compliance with industry work ethical standards,\norganizational policy and guidelines\n1.4 Demonstrated personal behavior and relationships with co-\nworkers and/or clients consistent with ethical standards,\npolicy and guidelines\n1.5 Used company resources in accordance with company\nethical standard, policies and guidelines.\n1.6 Followed company ethical standards, organizational policy\nand guidelines on the prevention and reporting of unethical\nconduct/behavior\n\n2. Underpinning\nKnowledge\n2.1 Occupational health and safety\n2.2 Work values and ethics\n2.3 Company performance and ethical standards\n2.4 Company policies and guidelines\n2.5 Fundamental rights at work including gender sensitivity\n2.6 Work responsibilities/job functions\n2.7 Corporate social responsibilities\n2.8 Company code of conduct/values\n2.9 Balancing work and family responsibilities\n\n3. Underpinning\nSkills\n3.1 Interpersonal skills\n3.2 Communication skills\n3.3 Self awareness, understanding and acceptance\n3.4 Application of good manners and right conduct\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/Scenarios\n\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Third Party Reports\n\n6. Context of\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 13\nUNIT OF COMPETENCY:\nPRACTICE HOUSEKEEPING PROCEDURES\nUNIT CODE :\n\n500311104\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto apply the basic housekeeping procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Sort and remove\nunnecessary items\n1.1 Reusable, recyclable materials are sorted in\naccordance with company/office procedures\n1.2 Unnecessary items are removed and disposed of\nin accordance with company or office procedures\n\n2. Arrange items\n2.1 Items are arranged in accordance with\ncompany/office housekeeping procedures\n2.2 Work area is arranged according to job\nrequirements\n2.3 Activities are prioritized based on instructions.\n2.4 Items are provided with clear and visible\nidentification marks based on procedure\n2.4 Safety equipment and evacuation passages are\nkept clear and accessible based on instructions\n\n3. Maintain work area, tools\nand equipment\n3.1 Cleanliness and orderliness of work area is\nmaintained in accordance with company/office\nprocedures\n3.2 Tools and equipment are cleaned in accordance\nwith manufacturer’s instructions/manual\n3.3 Minor repairs are performed on tools and\nequipment in accordance with manufacturer’s\ninstruction/manual\n3.4 Defective tools and equipment are reported to\nimmediate supervisor\n\n4. Follow standardized work\nprocess and procedures\n4.1 Materials for common use are maintained in\ndesignated area based on procedures\n4.2 Work is performed according to standard work\nprocedures\n4.3 Abnormal incidents are reported to immediate\nsupervisor\n\n5. Perform work spontaneously 5.1 Work is performed as per instruction\n5.2 Company and office decorum are followed and\ncomplied with\n5.3 Work is performed in accordance with\noccupational health and safety (OHS)\nrequirements\n\n--- PDF PAGE 16 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 14\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Unnecessary items\nMay include but are not limited to:\n1.1 Non-recyclable materials\n1.2 Unserviceable tools and equipment\n1.3 Pictures, posters and other materials not\n related to work activity\n1.4 Waste materials\n\n2. Identification marks\n2.1 Labels\n2.2 Tags\n2.3 Color coding\n\n3. Decorum\n3.1 Company/ office rules and regulations\n3.2 Company/ office uniform\n3.3 Behavior\n\n4. Minor repair\nMinor repair include but not limited to:\n4.1 Replacement of parts\n4.2 Application of lubricants\n4.3 Sharpening of tools\n4.4 Tightening of nuts, bolts and screws\n\n--- PDF PAGE 17 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 15\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Practiced the basic procedures of 5S\n\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Principles of 5S\n2.2 Work process and procedures\n2.3 Safety signs and symbols\n2.4 General OH&S principles and legislation\n2.5 Environmental requirements relative to work safety\n2.6 Accident/Hazard reporting procedures\n\n3. Underpinning Skills\n3.1 Basic communication skills\n3.2 Interpersonal skills\n3.3 Reading skills required to interpret instructions\n3.4 Reporting/recording accidents and potential hazards\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Facilities, materials tools and equipment necessary for the\nactivity\n\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Third party report\n5.2 Interview\n5.3 Demonstration with questioning\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 16\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY:\nPREPARE CONSTRUCTION MATERIALS AND TOOLS\nUNIT CODE :\n\nCON931201\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nidentifying, requesting and receiving construction materials\nand tools based on the required performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variable\n1. Identify materials\n\n1.1 Materials are listed as per job requirements\n1.2 Quantity and description of materials conform\nwith the job requirements\n1.3 Tools and accessories are identified according to\njob requirements\n\n2. Requisition materials\n\n2.1 Materials and tools needed are requested\naccording to the list prepared\n2.2 Request is done as per company standard\noperating procedures (SOP)\n2.3 Substitute materials and tools are provided without\nsacrificing cost and quality of work\n\n3. Receive and inspect\n materials\n3.1 Materials and tools issued are inspected as per\nquantity and specification\n3.2 Tools, accessories and materials are checked for\ndamages according to enterprise procedures\n3.3 Materials and tools are set aside to appropriate\nlocation nearest to the workplace\n\n--- PDF PAGE 19 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 17\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials and Tools\n\n1.1 Electrical supplies\n1.2 Structural\n1.3 Plumbing\n1.4 Welding/pipefitting\n1.5 Carpentry\n1.6 Masonry\n\n2. Description of Materials and\nTools\n\n2.1 Brand name\n2.2 Size\n2.3 Capacity\n2.4 Kind of application\n\n3. Company standard\nprocedures\n3.1 Job order\n3.2 Requisition slip\n3.3 Borrower slip\n\n--- PDF PAGE 20 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 18\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Listed materials and tools according to quantity and job\nrequirements\n1.2 Requested materials and tools according to the list prepared\nand as per company SOP\n1.3 Inspected issued materials and tools as per quantity and job\nspecifications\n1.4 Tools provided with appropriate safety devices\n\n2. Underpinning\nknowledge\n\n2.1 Types and uses of construction materials and tools\n2.2 Different forms\n2.3 Requisition procedures\n\n3. Underpinning\nskills\n\n3.1 Preparing materials and tools\n3.2 Proper handling of tools and equipment\n3.3 Following instructions\n4. Resource\nimplications\n\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Materials relevant to the unit of competency\n4.3 Technical plans, drawings and specifications relevant to the\nactivities\n5. Methods of\nassessment\n\nCompetency in this unit must be assessed through:\n5.1 Direct observation and oral questioning\n\n6. Context of\nassessment\n\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace\n6.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 21 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 19\n\nUNIT OF COMPETENCY:\nOBSERVE PROCEDURES, SPECIFICATIONS AND\nMANUALS OF INSTRUCTIONS\nUNIT CODE :\n\nCON311201\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nidentifying, interpreting, applying services to specifications\nand manuals and storing manuals.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify and access\nspecification/manuals\n\n1.1 Appropriate manuals are identified and accessed\nas per job requirements\n1.2 Version and date of manual are checked to\nensure that correct specification and procedures\nare identified\n\n2. Interpret manuals\n2.1 Relevant sections, chapters of specifications/\nmanuals are located in relation to the work to be\nconducted\n2.2 Information and procedure in the manual are\ninterpreted in accordance with industry practices\n\n3. Apply information in manual\n3.1 Manual is interpreted according to job\nrequirements\n3.2 Work steps are correctly identified in accordance\nwith manufacturer's specification\n3.3 Manual data are applied according to the given\ntask\n3.4 All correct sequencing and adjustments are\ninterpreted in accordance with information\ncontained on the manual or specifications\n\n4. Store manuals\n4.1 Manual or specification is stored appropriately to\nprevent damage, ready access and updating of\ninformation when required in accordance with\ncompany requirements\n\n--- PDF PAGE 22 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 20\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Procedures, Specifications\nand Manuals of Instructions\n\nKinds of manuals:\n1.1 Manufacturer's Specification Manual\n1.2 Repair Manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 23 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 21\n\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Identified and accessed specification/manuals as per job\nrequirements\n1.2 Interpreted manuals in accordance with industry practices\n1.3 Applied information in manuals according to the given task\n1.4 Stored manuals in accordance with company requirements\n\n2. Underpinning\nknowledge\n\n2.1 Types of manuals used in construction sector\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n3. Underpinning\nskills\n3.1 Reading and comprehension skills required to identify and\ninterpret construction manuals and specifications\n3.2 Accessing information and data\n\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to construction\n sector\n\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Questions/interview\n\nAssessment of underpinning knowledge and practical skills may be\ncombined\n\n6. Context of\nassessment\n6.1 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\nsimulated environment\n\n--- PDF PAGE 24 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 22\n\nUNIT OF COMPETENCY:\nPERFORM MENSURATIONS AND CALCULATIONS\n\nUNIT CODE :\n\nCON311203\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nidentifying and measuring objects based on the required\nperformance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variable\n1. Select measuring instruments\n\n1.1 Object or component to be measured is\nidentified, classified and interpreted according to\nthe appropriate regular geometric shape\n1.2 Measuring tools are selected/identified as per\nobject to be measured or job requirements\n1.3 Correct specifications are obtained from relevant\nsources\n1.4 Appropriate measuring instruments are selected\naccording to job requirements\n1.5 Alternative measuring tools are used without\nsacrificing cost and quality of work\n\n2. Carry out measurements and\ncalculations\n\n2.1 Accurate measurements are obtained\naccording to job requirements\n2.2 Alternative measuring tools are used\n without sacrificing cost and quality of work\n2.3 Calculation needed to complete work tasks are\nperformed using the four basic process of\naddition (+), subtraction (-), multiplication (x) and\ndivision (/) including but not limited to:\ntrigonometric functions, algebraic computations\n2.4 Calculations involving fractions, percentages\nand mixed numbers are used to complete\nworkplace tasks\n2.5 Numerical computation is self-checked and\ncorrected for accuracy\n2.6 Instruments are read to the limit of accuracy of\nthe tool\n2.7 Systems of measurement identified and\nconverted according to job requirements/ISO\n2.7 Workpieces are measured according to job\nrequirements\n\n--- PDF PAGE 25 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 23\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Geometric shape\n\n Including but is not limited to:\n1.1 Round\n1.2 Square\n1.3 Rectangular\n1.4 Triangle\n1.5 Sphere\n1.6 Conical\n\n2. Measuring instruments\nIncluding but not limited to:\n2.1 Micrometer (In-out, depth)\n2.2 Vernier caliper (out, inside)\n2.3 Dial gauge with mag, std.\n2.4 Straight edge\n2.5 Thickness gauge\n2.6 Torque gauge\n2.7 Small hole gauge\n2.8 Telescopic gauge\n2.9 Try-square\n2.10 Protractor\n2.11 Combination gauge\n2.12 Steel rule\n2.13 Voltmeter\n2.14 Ammeter\n2.15 Mega-ohmeter\n2.16 Kilowatt hour meter\n2.17 Gauges\n2.18 Thermometers\n\n3. Measurements and\ncalculations\n\n3.1 Linear\n3.2 Volume\n3.3 Area\n3.4 Wattage\n3.5 Voltage\n3.6 Resistance\n3.7 Amperage\n3.8 Frequency\n3.9 Impedance\n\n--- PDF PAGE 26 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 24\n\nVARIABLE\nRANGE\n\n3.10 Conductance\n3.11 Capacitance\n3.12 Displacement\n3.16 Inside diameter\n3.17 Circumference\n3.18 Length\n3.19 Thickness\n3.20 Outside diameter\n3.21 Taper\n3.22 Out of roundness\n3.23 Oil clearance\n3.24 End play/Thrust clearance\n\n--- PDF PAGE 27 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 25\n\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Selected and prepared appropriate measuring instruments in\naccordance with job requirements\n1.2 Performed measurements and calculations according to job\nrequirements/ ISO\n\n2. Underpinning\nknowledge\n\nTRADE MATHEMATICS / MENSURATION\n2.1 Four fundamental operation\n2.2 Linear measurement\n2.3 Dimensions\n2.4 Unit conversion\n2.5 Ratio and proportion\n2.6 Trigonometric functions\n2.8 Algebraic equations\n\n3. Underpinning\nskills\n3.1 Performing calculation by addition, subtraction, multiplication\nand division; trigonometric functions and algebraic equations\n3.2 Visualizing objects and shapes\n3.3 Interpreting formulas for volume, areas, perimeters of plane\nand geometric figures\n3.4 Proper handling of measuring instruments\n\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Problems to solve\n4.3 Measuring instrument appropriate to carry out tasks\n4.4 Instructional materials relevant to the propose activity\n\nAssessment of underpinning knowledge and practical skills may be\ncombined\n\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Actual demonstration\n5.2 Direct observation\n5.3 Written test/questioning related to underpinning knowledge\n\n6. Context of\nassessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n6.3 Competency assessment must be undertaken in accordance\nwith the TESDA assessment guidelines\n\n--- PDF PAGE 28 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 26\n\nUNIT OF COMPETENCY:\nMAINTAIN TOOLS AND EQUIPMENT\n\nUNIT CODE :\n\nCON311204\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nchecking condition, performing preventive maintenance and\nstoring of tools and equipment based on the required\nperformance standards.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Check condition of tools\nand equipment\n\n1.1 Materials, tools and equipment are identified\naccording to classification and job requirements\n1.2 Non-functional tools and equipment are\nsegregated and labeled according to classification\n1.3 Safety of tools and equipment are observed in\naccordance with manufacturer's instructions\n1.4 Condition of PPE are checked in accordance with\nmanufacturer's instructions\n\n2. Perform basic preventive\nmaintenance\n2.1 Appropriate lubricants are identified according to\n types of equipment\n2.2 Tools and equipment are lubricated according to\npreventive maintenance schedule or manufacturer's\nspecifications\n2.3 Measuring instruments are checked and\n calibrated in accordance with manufacturer’s\n instructions\n2.4 Tools are cleaned and lubricated according to\nstandard procedures\n2.5 Defective instruments, equipment and\n accessories are inspected and replaced\n according to manufacturer’s specifications\n2.6 Tools are inspected, repaired and replaced after use\n2.7 Work place is cleaned and kept in safe state in line\nwith OHSA regulations\n\n3. Store tools and\nequipment\n\n3.1 Inventory of tools, instruments and equipment are\nconducted and recorded as per company practices\n3.2 Tools and equipment are stored safely in\n appropriate locations in accordance with\n manufacturer's specifications or company\n procedures\n\n--- PDF PAGE 29 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 27\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials\nIncluding but not limited to:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n\n2. Tools and equipment\n\nIncluding but not limited to:\n2.1 Tools\nCutting tools - hacksaw, crosscut saw, rip saw\nBoring tools - auger, brace, grinlet, hand drill\nHolding tools - vise grip, C-clamp, bench vise\nThreading tools - die and stock, taps\n\n2.2 Measuring instruments/equipment\n\n3. PPE\nIncluding but not limited to:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Aprons/Coveralls\n\n4. Forms\n4.1 Maintenance schedule forms\n4.2 Requisition slip\n4.3 Inventory Form\n4.4 Inspection Form\n4.5 Procedures\n\n--- PDF PAGE 30 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 28\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.2 Identified functional and non-functional tools and equipment\n1.3 Checked, lubricated and calibrated tools, equipment and\ninstruments according to manufacturer’s specifications\n1.4 Replaced defective tools, equipment and their accessories\n1.5 Observed and applied safe handling of tools and equipment\nand safety work practices\n1.6 Prepared and submitted inventory report, where applicable\n1.7 Maintained workplace in accordance with OHSA regulations\n1.8 Stored tools and equipment safely in appropriate locations and\nin accordance with company practices\n\n2. Underpinning\nknowledge\n\n2.1 SAFETY PRACTICES\n 2.1.1 Use of PPE\n2.1.2 Handling of tools and equipment\n2.1.3 Good housekeeping\n2.2 MATERIALS, TOOLS AND EQUIPMENT\n2.2.1 Types and uses of lubricants\n2.2.2 Types and uses of cleaning materials\n2.2.3 Types and uses of measuring instruments and\nequipment\n2.3 PREVENTIVE MAINTENANCE\n2.3.1 Methods and techniques\n2.3.2 Procedures\n\n3. Underpinning\nskills\n3.1 Preparing maintenance materials, tools and equipment\n3.2 Proper handling of tools and equipment\n3.3 Performing preventive maintenance\n3.4 Following instructions\n\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Maintenance schedule\n4.3 Maintenance materials, tools and equipment relevant to the\nproposed activity/task\n\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Written test/questioning relevant to Underpinning knowledge\n\n6. Context of\nassessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 31 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 29\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : PREPARE MASONRY MATERIALS\nUNIT CODE : CON712301\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npreparing mixtures used for masonry laying and\nsurface plastering under supervision by a higher-level\nmason.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select materials to be hauled\n\n1.1 Appropriate personal protective equipment\n (PPE) is selected and used according to job\n requirements.\n1.2 Work instruction is secured from immediate\n superior\n1.3 Quantity of materials to be hauled is determined\n according to the instruction of immediate\n superior\n1.4 Correct quantity and type of materials to be\nused are secured\n\n2. Haul materials\n\n2.1 Availability and serviceability of appropriate\nhauling equipment are checked as specified\nby the immediate superior\n2.2 Materials are hauled based on work schedule\nas specified\n2.3 Required materials are stockpiled based on\ninstructions\n\n3. Mix mortar/concrete\n3.1 Mixing tools and equipment to be used are\nchecked according to job requirements\n3.2 Concrete or mortar mix and quantity is\ndetermined according to the instructions\n3.3 Concrete or mortar is mixed according to the\ninstructions\n3.4 Mixed concrete or mortar is supplied to the\nappropriate personnel based on job\nrequirements\n\n--- PDF PAGE 32 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 30\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. PPE\n1.1 Helmet\n1.2 Safety shoes\n1.3 Proper uniform\n1.4 Gloves\n1.5 Dust mask\n1.6 Safety glass\n\n2. Materials\n\nMay include but are not limited to:\n2.1 Concrete hollow blocks\n2.2 Bricks\n2.3 Cement\n2.4 Sand\n2.5 Water\n2.6 Reinforcing bars / GI wires\n2.7 Concrete / CW nails\n2.8 Lumber\n2.9 Baluster\n2.10 Lime\n2.11 Fly ash\n\n3. Hauling equipment\n\nMay include but not limited to:\n3.1 Skid loader\n3.2 Dumper\n3.3 Material hoist\n3.4 Pallet\n3.5 Wheel borrow\n3.6 Buggy\n\n4. Mixing tools and equipment\n\n4.1 One bagger mixer\n4.2 Two bagger mixer\n4.3 Mixing board\n4.4 Shovel\n4.5 Pails\n4.6 Screen wire (2-3mm mesh)\n4.7 Mixing box\n4.8 Mortar bucket\n\n--- PDF PAGE 33 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 31\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to identify correct quantity and type of\nmaterials and tools / equipment used in hauling\n1.2 Demonstrated ability to proper hauling and timely delivery of\ncorrect quantity of and type of materials\n1.3 Demonstrated ability to identify correct quantity and type of\nmaterials and tools / equipment used in mixing\n1.4 Demonstrated ability to use PPEs appropriately\n\n2. Underpinning\nKnowledge\n2.1 Knowledge of basic linear measurement and simple arithmetic\n2.2 Interpret and follow instructions properly\n2.3 Prevention of accidents\n2.4 Safe handling of materials, tools and equipment\n2.5 Housekeeping for safety\n2.6 Safety signs and symbols\n2.7 Types of concrete blocks, bricks, cement and aggregates\n2.8 Uses and types of mortar\n2.9 Types of masonry anchors, ties and reinforcements\n\n3. Underpinning\nSkills\n3.1 Working safely\n3.2 Organizing materials to be used\n3.3 Mixing mortar\n3.4 Proper handling and use of tools and equipment\n3.5 Communicating effectively\n3.6 Using basic arithmetic\n\n4. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace location\n4.2 Tools, and equipment appropriate to masonry jobs\n4.3 Materials relevant to the masonry works\n\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct Observation on actual workplace\n5.2 Questions related to underpinning knowledge\n5.3 Third party report\n5.4 Demonstration on simulated situation\n5.5 Oral interview\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 34 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 32\n\nUNIT OF COMPETENCY :\nPERFORM BASIC MASONRY WORKS\nUNIT CODE :\nCON712302\nUNIT DESCRIPTOR :\nThis unit deals with the outcomes required to perform\nbasic masonry work under supervision by a higher-\nlevel mason. It covers the skills required to perform\nbasic re-bar fabrication such as cutting and bending,\nerecting and dismantling scaffolds (1.8m and below)\nperform for fabrication, and stripping, excavating,\nbackfilling and compacting.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform basic re-bar\nfabrication\n\n1.1 appropriate PPE is selected and used according\nto job requirements\n1.2 Steel bars are identified, measured, cut and\nbent as required\n1.3 Cut and bent steel bars are segregated\naccording to steel type and size\n1.4 Basic fabrication of steel bars into wall footing,\nstiffener columns and lintel beams is performed\nfollowing the re-bar cutting and bending\nschedule.\n\n2. Erect and dismantle scaffolding\n(limited height)\n\n2.1 Components of scaffolding are checked and\nverified based on job requirements\n2.2 Scaffolding is erected in accordance with safety\npractices\n2.3 Scaffolding is dismantled in accordance with\nsafety practices\n2.4 Components are inventoried and returned to\nstockpile area based on company rules and\nprocedures\n\n3. Fabricate and strip form works 3.1 Form works materials are identified,\nmeasured, cut and fabricated as required\n3.2 Cut materials are segregated according to size\n3.3 Basic fabrication of materials into forms for\nstiffener columns and lintel beams is performed\nfollowing work instructions.\n3.4 Form works are stripped following established\nprocedures\n\n--- PDF PAGE 35 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 33\n\n4. Perform excavation and back\nfilling / compaction\n4.1 Excavation work is performed based on job\n specifications\n4.2 Excavated portion is filled with gravel base\n coarse\n4.3 Back filling and compaction are performed after\n concreting of wall footing.\n\n5. Perform concreting work\n5.1 Concreting of wall footing, columns and lintel\n beam based on line and grade is performed\n5.2 Consolidation of concrete by vibration is\n performed (use of vibrator, optional)\n\n6. Perform housekeeping\n6.1 Materials such as excess re-bars, scaffolding\n and form works are recovered and stockpiled\n according to company rules and procedures\n6.2 Flooring is protected by covering it during\n concrete hollow blocks / bricks laying and\n plastering\n6.3 Flooring is protected by using mixing board\n during manual mixing work.\n6.4 Workplace is cleaned and cleared of any\n obstructions and hazards before, during and\n after work\n6.5 Tools, equipment and other materials are\n cleaned after use\n\n--- PDF PAGE 36 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 34\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Steel type and size\n1.1 Bar diameter (10, 12, 16 mm)\n1.2 Grade of re-bar (40)\n1.3 Type of bend\n\n2. Components of scaffolding\nMay include but not limited to:\n2.1 Steel\n 2.1.1 A/H frame\n 2.1.2 Cross brace\n 2.1.3 Joint pin\n 2.1.4 Base jack\n 2.1.5 Walking board\n 2.1.6 Toe board\n 2.1.7 Railing\n 2.1.8 Tubular pipe\n 2.1.9 Arm lock\n2.2 Wood\n 2.2.1 2 x 4 rough lumber\n 2.2.2 2 x 2 rough lumber\n 2.2.3 Wood planks\n 2.2.4 Nails\n\n3. Safety practices\n3.1 Standard PPE\n3.2 Check the condition of the scaffold components\n3.3 Provision of appropriate safety signs\n3.4 Sufficient lighting for the workplace\n3.5 Good housekeeping\n\n4. Form work materials\n4.1 Plywood\n4.2 Rough lumber\n4.3 Nails\n4.4 Tie wire\n4.5 Form oil\n4.6 Tie rod / form tie\n\n5. Job specifications\nMay include but not limited to:\n5.1 Established lay-out\n5.2 Soil condition\n5.3 Required depth and width\n\n--- PDF PAGE 37 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 35\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability to produce the required quantity and quality\nof fabricated re-bars\n1.2 Demonstrated ability to produce the required quantity and quality\nof fabricated form panels through correct cutting of form work\nmaterials\n1.3 Demonstrated ability to erect and dismantle scaffold based on\nstandard safety practices\n1.4 Demonstrated ability to excavate, backfill and compact soil\naccording to the required width and depth\n1.5 Demonstrated ability to mix concrete, mortar and grout that\nconform with the quality requirements\n1.6 Demonstrated knowledge on the importance of proper\nhousekeeping by cleaning and clearing the work place from any\nobstructions and safety hazards\n\n2. Underpinning\nKnowledge\n2.1 Basic linear measurement and simple arithmetic\n2.2 Interpret and follow instructions\n2.3 Prevention of accidents\n2.4 Safe handling of materials, tools and equipment\n2.5 Housekeeping for safety\n2.6 Safety signs and symbols\n2.7 Rules on safe erection, use and dismantling of scaffolds (1.8 m\n and below)\n2.8 Types of masonry anchors, ties and reinforcements\n2.9 Form works and platforms\n2.10 Scaffoldings construction elements and materials\n2.11 Fabrication of form works and re-bars\n2.12 Concrete, mortar and grout mix\n2.13 Excavation, back filling and compaction\n\n3. Underpinning\nSkills\n3.1 Working safely\n3.2 Organizing materials to be used\n3.3 Installing and dismantling scaffolds\n3.4 Proper handling and use of tools and equipment\n3.5 Communicating effectively\n3.5 Applying basic arithmetic\n3.6 Using PPE\n3.7 Basic concreting\n\n--- PDF PAGE 38 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 36\n4. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace location\n4.2 Tools, and equipment appropriate to scaffold, re-bars and\nform works\n4.3 Materials relevant to scaffold, re-bars and form works\n\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct Observation on actual workplace\n5.2 Questions related to underpinning knowledge\n5.3 Third party report\n5.4 Demonstration on simulated situation\n5.5 Interview\n\n6. Context for\nAssessment\n6.4 Competency may be assessed in the workplace or in a simulated\nworkplace setting\n\n--- PDF PAGE 39 ---\n_____________________________________________________________________________________________\nTR - MASONRY NC I 37"
