          "source_text": "1.  Mark/locate weld \ndefects \n1.1 Identified weld defects marked/located according to \n       recommended practice \n3. Prepare tools and \n      equipment \n2.1 Tools and equipment prepared are appropriate to the job \nrequirements including the provision of wind barriers.  \n2.2 Task performed in accordance with company or industry  \n       requirements and safety procedure \n3.  Remove defects  \n3.1  Weld defects removed/excavated in accordance with  \n       approved industry procedures or client requirements. \n3.2  Removal of non-defective welds is minimized and  \n       cleaned. \n3.3 Visual and dye-penetrant test performed to verify the \nextent of removal of defects, where applicable \n3.4  Welding inspector informed to verify the extent of defect  \nremoval. \n3.5  Task performed in accordance with company or industry \n       requirement and safety procedure \n \n4.  Perform re-welding \n4.1 Re-welding performed in accordance with approved \n        repair procedure.   \n4.2 Task performed in accordance with company or \n        industry requirement and safety procedure \n4.3   No new weld defects or damages occurred during  \n        re-welding. \n4.4   Weld visually checked after re-welding for acceptability\n\n--- PDF PAGE 54 ---\nWeldncii11-3 \n  \n53\nRANGE OF VARIABLE \nVARIABLE\nRANGE\n1. Weld defects \n1.1   Porosity \n1.2    Root undercut \n1.3    and solid material inclusion \n1.4    Concavity/convexity   \n1.5    Degree of reinforcement  \n1.6    Burn Through \n1.7    Crater cracks \n1.8    Cracks \n1.9    Lack of Fusion (tie-in) \n1.10  Pinholes/Blowholes \n1.11  Under Fill \n1.12  Excess/incomplete penetration  \n1.13 Slag/tungsten inclusion  \n1.14 Overlap \n1.15  Misalignment \n1.16  Distortion \n2. Tools and equipment \n2.1   Welding machine and accessories \n2.2   Gouging outfit and accessories \n2.3   Portable grinder \n2.4   Chipping hammer \n2.5   Files \n2.6   Extension cord and lightings \n2.7   Barriers \n2.8   Dye-penetrant kit \n2.9   Portable oven \n3. Removed/excavated \nDefects removed by \n3.1  Grinding \n3.2  Arc/air Gouging \n3.3  Cutting (mechanical, gas) \n3.4  Plasma gouging\n\n--- PDF PAGE 55 ---\nWeldncii11-3 \n  \n54"
