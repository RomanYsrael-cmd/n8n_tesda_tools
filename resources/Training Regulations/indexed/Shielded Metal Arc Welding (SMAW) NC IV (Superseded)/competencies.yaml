        "source_title": "REPAIR WELDS",
        "source_text": "--- PDF PAGE 53 ---\nWeldncii11-3 \n  \n52\nUNIT TITLE  \n:    REPAIR WELDS \n \nUNIT CODE  \n:    MEE721209 \n \nDESCRIPTOR \n:    This unit covers the skills, knowledge and attitudes in \n     repairing welds. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.  Mark/locate weld \ndefects \n1.1 Identified weld defects marked/located according to \n       recommended practice \n3. Prepare tools and \n      equipment \n2.1 Tools and equipment prepared are appropriate to the job \nrequirements including the provision of wind barriers.  \n2.2 Task performed in accordance with company or industry  \n       requirements and safety procedure \n3.  Remove defects  \n3.1  Weld defects removed/excavated in accordance with  \n       approved industry procedures or client requirements. \n3.2  Removal of non-defective welds is minimized and  \n       cleaned. \n3.3 Visual and dye-penetrant test performed to verify the \nextent of removal of defects, where applicable \n3.4  Welding inspector informed to verify the extent of defect  \nremoval. \n3.5  Task performed in accordance with company or industry \n       requirement and safety procedure \n \n4.  Perform re-welding \n4.1 Re-welding performed in accordance with approved \n        repair procedure.   \n4.2 Task performed in accordance with company or \n        industry requirement and safety procedure \n4.3   No new weld defects or damages occurred during  \n        re-welding. \n4.4   Weld visually checked after re-welding for acceptability\n\n--- PDF PAGE 54 ---\nWeldncii11-3 \n  \n53\nRANGE OF VARIABLE \nVARIABLE\nRANGE\n1. Weld defects \n1.1   Porosity \n1.2    Root undercut \n1.3    and solid material inclusion \n1.4    Concavity/convexity   \n1.5    Degree of reinforcement  \n1.6    Burn Through \n1.7    Crater cracks \n1.8    Cracks \n1.9    Lack of Fusion (tie-in) \n1.10  Pinholes/Blowholes \n1.11  Under Fill \n1.12  Excess/incomplete penetration  \n1.13 Slag/tungsten inclusion  \n1.14 Overlap \n1.15  Misalignment \n1.16  Distortion \n2. Tools and equipment \n2.1   Welding machine and accessories \n2.2   Gouging outfit and accessories \n2.3   Portable grinder \n2.4   Chipping hammer \n2.5   Files \n2.6   Extension cord and lightings \n2.7   Barriers \n2.8   Dye-penetrant kit \n2.9   Portable oven \n3. Removed/excavated \nDefects removed by \n3.1  Grinding \n3.2  Arc/air Gouging \n3.3  Cutting (mechanical, gas) \n3.4  Plasma gouging\n\n--- PDF PAGE 55 ---\nWeldncii11-3 \n  \n54\nEVIDENCE GUIDE \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate \nrepaired weld defects within the approved weld \nrepair procedures \n2.  Underpinning knowledge \n2.1  Interpretation of weld repair procedures and  \n       WPS \n2.2  Causes and identification of weld defects \n2.3  Materials and consumables   \n2.4  Welding Equipment and Tools \n2.5  Welding Codes (symbols) \n2.6  Repair techniques \n2.7  Selection and use of PPE \n3.  Underpinning skills \n3.1  Operating weld defect removal tools and \n       equipment \n3.2  Applying correct weld techniques \n3.3  Measuring skills \n3.4  Communication skills \n3.5  Rectifying weld defects \n3.6  Handling welding tools and equipment \n3.7  Handling materials and consumables  \n3.8  Identifying weld defects \n4.  Resource implications \nThe following resources must be provided: \n4.1  Weld defect removal and repair facilities and  \n      equipment \n4.2  Supplies and materials \n4.3  PPE \n4.4  Relevant documentation such as WPS and  \n      approved repair procedure \n5.  Method of assessment \nCompetency must be assessed through: \n5.1  Observation and interview \n5.2  Performance record  \n6.  Context of assessment \nCompetency to be assessed while a task is being \nundertaken in the workplace or in a simulated \nworkplace setting.\n",
