        "source_title": "Weld alloy steel pipes using SMAW",
        "source_text": "--- PDF PAGE 56 ---\nWeldncii11-3 \n  \n55\nCORE COMPETENCIES \n \n \n \n \nUNIT OF COMPETENCY : \nWeld alloy steel pipes using SMAW \n \nUNIT CODE \n \n: \nMEE721317 \n \nDESCRIPTOR \n \n: \nThis unit covers the skills, knowledge and \n           attitudes in welding alloy steel pipes using \n           SMAW process. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Perform root pass \n1.1  Root pass performed in accordance with WPS and/or  \n       client specifications. \n1.2 Task performed in accordance with company or industry \nrequirement and safety procedure. \n1.3 Weld visually checked for defects and repaired, as  \n      required \n1.4 Weld visually acceptable in accordance with applicable \ncodes and standards  \n2. Clean root pass \n2.1 Root pass cleaned is free from defects and  \n discontinuities \n2.2 Task performed in accordance with approved WPS \n3. Weld subsequent/ \nfilling passes \n \n3.1 Subsequent/ filling passes performed in accordance with   \n       approved WPS \n3.2 Weld visually checked for defects and repaired, as  \n      required \n3.3 Weld visually acceptable in accordance with applicable \ncodes and standards  \n4. Perform capping \n4.1 Capping performed in accordance with WPS and/or  \n      client specifications \n4.2 Weld visually checked for defects and repaired, as  \n      required \n4.3 Weld visually acceptable in accordance with applicable \ncodes and industry/company standards\n\n--- PDF PAGE 57 ---\nWeldncii11-3 \n  \n56\nRANGE OF VARIABLE \nVARIABLE\nRANGE\n1. WPS \nWPS Requirements \n1.1 Welding positions \n       1.1.1   2G and 5G and/or 6G \n1.2 Wall thickness \n      1.2.1   1.6mm and above \n1.3 Type of material \n      1.3.1   Alloy steel \n1.4 Type and size of alloy electrode \n1.5 Travel speed \n1.6 Current setting (polarity, amperage, voltage) \n1.7 Preheating requirement \n1.8 Joint preparation \n2. Defects \n2.1 Porosity \n2.2 Undercut \n2.3 Arc Strike  \n2.4 Spatters  \n2.5 Slag inclusion \n2.6 Concavity/convexity  \n2.7 Degree of reinforcement  \n2.8 Burn Through \n2.9 Crater cracks \n2.10 Cracks \n2.11 Lack of Fusion \n2.12 Pinholes/Blowholes \n2.13 Under Fill \n2.14 Overlap \n2.15 Misalignment \n2.16 Distortion\n\n--- PDF PAGE 58 ---\nWeldncii11-3 \n  \n57\nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate \nwelded alloy steel pipes in all positions and to \nacceptable standard following the approved WPS. \n2. Underpinning knowledge \n2.1  Drawing/Plan/WPS interpretation \n2.2  Materials and consumables (Electrodes, Base \n      Metal) Welding Equipment and Tools \n2.3  Basic Mathematics (MDAS) \n2.4  Welding Codes \n2.5  identification of weld defects \n3. Underpinning skills \n3.1  Measuring skills \n3.2  Communication skills \n3.3  Rectifying weld defects \n3.4  Applying weld techniques \n3.5  Handling welding tools and equipment \n3.6  Handling welding materials and consumables \n4. Resource implications \nThe following resources must be provided: \n4.1  Welding facilities and equipment \n4.2  Supplies and materials \n4.3  PPE \n4.4  Relevant documentation such as WPS and  \n      working drawing \n5. Method of assessment \nCompetency must be assessed through: \n5.1  Observation and interview \n5.2  Demonstration and interview \n5.3  Written test \n5.4  Portfolio \n6. Context of assessment \nCompetency to be assessed while a task is being \nundertaken in the workplace or in a simulated \nworkplace setting.\n",
