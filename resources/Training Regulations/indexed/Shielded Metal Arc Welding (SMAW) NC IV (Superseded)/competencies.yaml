        "source_title": "APPLY PROBLEM SOLVING TECHNIQUES IN THE WORKPLACE",
        "source_text": "--- PDF PAGE 13 ---\nWeldncii11-3 \n  \n12\nUNIT OF COMPETENCY : \nAPPLY PROBLEM SOLVING TECHNIQUES IN THE \nWORKPLACE \nUNIT CODE \n: \n50011117 \nUNIT DESCRIPTOR \n: \nThis competency covers the knowledge, skills and \nattitudes required to apply the process of problem \nsolving and other problems beyond those associated \ndirectly with the process unit.  It includes the \napplication of structured processes and improvement \ntools.  This competency is typically performed by an \nexperienced technician, team leader or supervisor. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. \nAnalyze the \nproblem \n1.1.  Issues/concerns are evaluated based on data \ngathered \n1.2.  Possible causes of problem are identified within the \narea of responsibility as based on experience and \nthe use of problem solving tools/analytical techniques \n1.3    Possible cause statements are developed based on      \nfindings \n2. \nIdentify possible \nsolutions \n2.1  All possible options are considered for resolution of      \nthe problem in accordance with safety and operating \nprocedures \n2.2  Strengths and weaknesses of possible options are      \nconsidered \n2.3  Corrective action is determined to resolve the problem \nand its possible future causes \n3. \nRecommend \nsolution to higher \nmanagement \n3.1  Report/communication or documentation are \nprepared \n3.2 Recommendations are presented to appropriate \npersonnel \n3.3   Recommendations are followed-up, if required\n\n--- PDF PAGE 14 ---\nWeldncii11-3 \n  \n13\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n4. \nImplement solution 4.1   Measurable objectives are identified \n4.2   Resource needs are identified \n4.3   Timelines are identified in accordance with plan \n5. \nEvaluate/Monitor \nresults and \noutcome \n5.1. Processes and improvements are identified based on \nevaluative assessment of problem \n5.2. Recommendations are prepared and submitted to \nsuperiors.\n\n--- PDF PAGE 15 ---\nWeldncii11-3 \n  \n14\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Area of responsibility \nVariables may include but are limited to:  \n1.1. \nWork environment \n1.2. \nProblem solution processes  \n1.3. \nPreventative maintenance and diagnostic policy  \n1.4. \nRoles and technical responsibilities  \n2. Occupational Health \nand Safety \n2.1. \nAs per company, statutory and vendor \nrequirements. Ergonomic and environmental factors \nmust be considered during the demonstration of this \ncompetency. \n3. Communication  \n3.1. \nVariables may include but are not limited to: \n3.2. \nWritten communication can involve both hand \nwritten and printed material, internal memos, \nelectronic mail, briefing notes and bulletin boards.\n4. Documentation \n4.1. \nAudit trails \n4.2. \nNaming standards  \n4.3. \nVersion control\n\n--- PDF PAGE 16 ---\nWeldncii11-3 \n  \n15\nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Analyzed the problem \n1.2. Identified possible solutions \n1.3. Implemented solutions \n1.4. Recommended solutions to higher management \n1.5. Outcome evaluated/monitored \nEvidence of satisfactory performance in this unit can be \nobtained by observation of performance and questioning \nto indicate knowledge and understanding of the elements \nof the competency and performance criteria.  \n2. Underpinning \nknowledge \n2.1. Broad understanding of systems, organizational \nsystems and functions \n2.2. Broad knowledge of help desk and maintenance \npractices \n2.3. Current industry accepted hardware and software \nproducts with broad and detailed knowledge of its \ngeneral features and capabilities  \n2.4. Broad knowledge of the operating system \n2.5. Broad knowledge of the client business domain \n2.6. Broad knowledge based incorporating current \nindustry practices related to escalation procedures \n2.7. Broad knowledge based of diagnostic tools \n2.8 .   General principles of OHS \n2.9     Divisional/unit responsibilities \n3. Underpinning skills \n3.1. Decision making within a limited range of options. \n3.2. Communication is clear, precise and varies \naccording to the type of audience \n3.3. Teamwork in reference to personal responsibility \n3.4. Time management as applied to self-management. \n3.5. Analytical skills in relation to routine malfunctions. \n3.6. General customer service skills displayed. \n3.7. Questioning and active listening is employed to \nclarify general information\n\n--- PDF PAGE 17 ---\nWeldncii11-3 \n  \n16\n4. Resource \nimplications \n4.1. Assessment will require access to an operating \nplant over an extended period of time, or a suitable \nmethod of gathering evidence of operating ability \nover a range of situations. A bank of scenarios/case \nstudies/what ifs will be required as well as bank of \nquestions which will be used to probe the reasoning \nbehind the observable actions. \n5. Methods of \nassessment \nCompetency may be assessed through: \n5.1. Through direct observation of application to tasks \nand questions related to underpinning knowledge \nUnder general guidance, checking various stages of \noperation and at the completion of the activity \nagainst performance criteria and specifications \n \n6. Context for \nassessment \n6.1. Competency may be assessed in the work place or \nin a simulated work place setting \n6.2. Assessment shall be carried out through TESDA’s \nAccredited Assessment Centers/Venues while tasks \nare undertaken either individually or as part of a \nteam under limited supervision\n",
