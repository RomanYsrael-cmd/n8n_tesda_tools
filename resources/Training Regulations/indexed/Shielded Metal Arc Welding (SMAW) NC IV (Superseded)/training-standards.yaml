  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for SHIELDED METAL ARC WELDING\n(SMAW).\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainers qualification,\namong others.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: SHIELDED METAL ARC WELDING\n\nNC Level IV\n\nSuggested Nominal Training Hours: 56 hrs. ( Basic Competencies)\n\n56 hrs. ( Common Competencies)\n\n56 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes\nin Shielded Metal Arc Welding in accordance with industry standards. It covers\ncore competencies such as Setting-up Welding Equipment, Preparing Weld\nMaterials, Fitting up Weld Materials, Weld alloy steel pipes using SMAW and\nRepairing Welds.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Utilize\nspecialized\ncommunic\nation skills\n1.1 Meet common and specific\ncommunication needs of clients\nand colleagues\n1.2 Contribute to the development of\ncommunication strategies\n1.3 Represent the organization\n1.4 Facilitate group discussion\n1.5 Conduct interview\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n\n--- PDF PAGE 60 ---\nWeldncii11-3\n\n59\n2. Develop\nteams and\nindividuals\n2.1 Provide team leadership\n2.2 Foster individual and\n organizational growth\n2.3 Monitor and evaluate workplace\n learning\n2.4 Develop team commitment and\n cooperation\n2.5 Facilitate accomplishment of\n organizational goals\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstrati\non\n• Case studies\n3. Apply\nproblem\nsolving\ntechniques\nin the\nworkplace\n3.1 Analyze the problem\n3.2 Identify possible solutions\n3.3 Recommend solution to higher\nmanagement\n3.4 Implement solution\n3.5 Evaluate/Monitor results and\noutcome\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Collect,\nanalyze\nand\norganize\ninformation\n4.1 Study information requirements\n4.2 Process data\n4.3 Analyze, interpret and organize\ninformation gathered\n4.4 Present findings/\n Recommendations\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Plan and\norganize\nwork\n5.1 Set objectives\n5.2 Plan and schedule work activities\n5.3 Implement work plans\n5.4 Monitor work activities\n5.5 Review and evaluate work plans\nand activities\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Promote\nenvironme\nntal\nprotection\n\n6.1 Study guidelines for environmental\nconcerns\n6.2 Implement specific environmental\nprograms\n6.3 Monitor activities on environmental\nprotection /programs\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 61 ---\nWeldncii11-3\n\n60\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\npractices\n1.1 Identify hazardous areas\n1.2 Use protective clothing and\n devices\n1.3 Perform safe handling of tools,\n equipment and materials\n1.4 Perform first aid\n1.5 Use fire extinguisher\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n2. Interpret\ndrawings\nand sketches\n2.1 Identify standard alphabet of\nlines\n2.2 Identify orthographic/ isometric\nviews\n2.3 Interpret standard drawing\nsymbols, dimensional\ntolerances and notations\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written test\n\n3. Perform\nindustry\ncalculations\n3.1 Perform four fundamental\n operations\n3.2 Perform conversion of units\n3.3 Perform calculations on\n algebraic expressions\n3.4 Compute percentage and ratio\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written test\n\n4. Contribute to\nquality\nsystem\n4.1 Inspect work done\n4.2 Apply quality standards to work\n4.3 Protect company property and\n customer interests\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n•Demonstration\n5. Use hand\ntools\n\n5.1 Select hand tools\n5.2 Use hand tools\n5.3 Maintain hand tools\n\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n•Demonstration\n6. Prepare\nWeld\nMaterials\n6.1 Set up cutting equipment\n6.2 Cut and prepare edge of\nmaterials\n6.3 Clean surfaces and edges\n6.4 Prepare welding consumables\n6.5 Prepare welding safety and\nprotective equipment\n• Lecturette\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n7. Set-up\nWelding\nEquipment\n7.1 Set up welding machine\n7.2 Set up welding accessories\n7.3 Set up welding positioners, jigs\nand fixtures\n7.4 Set up pre-heating\ntools/equipment as required\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n•Written test\n\n--- PDF PAGE 62 ---\nWeldncii11-3\n\n61\n8. Fit up Weld\nMaterials\n8.1 Perform tack welding\n8.2 Check gap and alignment\n8.3 Set up welding positioner\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n•Written test\n9. Repair\n Welds\n9.1 Mark/locate weld defects\n9.2 Prepare tools and equipment\n9.3 Remove defects\n9.4 Perform re-welding\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Weld Alloy\nSteel Pipes\nUsing SMAW\n1.1 Perform groove weld on pipe in\ndifferent positions\n• 2G\n• 5G\n• 6G\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 63 ---\nWeldncii11-3\n\n62\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-\nbased TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities may be adopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended. Thus\nprograms would contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video or\ncomputer technologies.\n\n--- PDF PAGE 64 ---\nWeldncii11-3\n\n63\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n• Must have completed training in SMAW NC III or a holder of SMAW NC III\n• can communicate either oral and written\n• physically and mentally fit\n• with good moral character\n• can perform basic mathematical computation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\nSHIELDED METAL ARC WELDING – NC IV\n\nRecommended list of tools and materials per trainee for SHIELDED METAL ARC\nWELDING (SMAW) IV\n\nTOOLS\n(for 25 trainees)\nEQUIPMENT\n(for 25 trainees)\nMATERIAL\n(per trainee)\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n25 pcs.\nChipping\nHammer\n12\nunits\nArc Welding\nmachine AC/DC\nand accessories\n4 kgs.\nElectrodes 2.4mm\n/ E309 or E308\n50 pcs.\nSteel brush\n12pcs.\nWelding positioners\n18 kgs.\nElectrodes 3.2mm\n/ E309 or E308\n12 pcs.\nPlier/tongs\n1 unit\nElectrode oven\n\n21 prs\n(or equiv\njts)\n6” dia. Sch. 80\nA-53 Gr. B\n20 pcs. Files-bastard\ncut\n12\nunits\nPortable disc\ngrinder\n1 pcs\nDark glass\n25 pcs.\nWelding Mask\n1 unit\nExhaust fan\n14 pcs\nLens clear glass\n25 sets\nLeather\napron/jacket\n2 units\nWork bench w/\nbench vice on 4\ncorners\n12 pcs.\n\nCutting disc 3/32”\nX 5/8” X 4”\n25 sets\nLeather\ngloves, long\n2 sets\nOxy-acetylene/Oxy-\nLPG cutting outfit\n20 pcs\nGrinding disc 1/4”\nX 5/8” X 4”\n5 pcs.\nSafety\ngoggles, wide\nvision, clear\n1 unit\nPedestal /bench\ngrinding machine\n1 tube\nMetal marker\n5 pcs.\nOxy-acetylene\nGoggles\n1 unit\nIndustrial fan\n\n12 pcs.\nTry square\n300 mm. Long\n\n12 pcs.\nSteel square\n300 mm. long\n\n--- PDF PAGE 65 ---\nWeldncii11-3\n\n64\n12 pcs. Files-half\nround\n\n5 pcs.\nFillet gauge\n\n3.5 TRAINING FACILITIES\n\nSHIELDED METAL ARC WELDING - NC IV\n\nThe welding workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation\nareas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL AREA\nIN SQ.\nMETERS\nWelding Booth\n2 X 1.5\n3\n8\n24\nGrinding Booth\n2 X 1.5\n3\n2\n6\nMaterials/Preparation\nArea*\n2 X 2\n4\n\n4\nBench work Area\n1.5 X 2.5\n4\n2\n8\nTool Room & S/M\nStorage Area\n4 X 5\n20\n\n20\nLearning Resource\nArea*\n5 X 9\n45\n\n45\nWash Area /Comfort\nRoom (male & female) *\n2.5 X 4\n10\n\n10\nTotal\n\n117\nCirculation Area**\n\n35\nTotal Workshop Area\n\n152\n\n* This area can also be used by other welding courses.\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 66 ---\nWeldncii11-3\n\n65\n3.6 TRAINERS QUALIFICATIONS FOR SMAW WELDER\n\nSHIELDED METAL ARC WELDING - NC IV\n\nTRAINER QUALIFICATION (TQ IV)\n\n•\nMust be a holder of SMAW NC IV\n•\nMust have undergone training on Training Methodology IV (TM IV)\n•\nMust be physically and mentally fit\n•\n*Must have at least 2 years job/industry experience\n•\nMust be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by trainees to determine the\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 67 ---\nWeldncii11-3\n\n66"
