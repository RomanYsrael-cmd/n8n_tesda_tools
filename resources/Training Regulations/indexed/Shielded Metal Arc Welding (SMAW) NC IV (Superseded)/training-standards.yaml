    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: SHIELDED METAL ARC WELDING\n\nNC Level IV\n\nSuggested Nominal Training Hours: 56 hrs. ( Basic Competencies)\n\n56 hrs. ( Common Competencies)\n\n56 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes\nin Shielded Metal Arc Welding in accordance with industry standards. It covers\ncore competencies such as Setting-up Welding Equipment, Preparing Weld\nMaterials, Fitting up Weld Materials, Weld alloy steel pipes using SMAW and\nRepairing Welds.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Utilize\nspecialized\ncommunic\nation skills\n1.1 Meet common and specific\ncommunication needs of clients\nand colleagues\n1.2 Contribute to the development of\ncommunication strategies\n1.3 Represent the organization\n1.4 Facilitate group discussion\n1.5 Conduct interview\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n\n--- PDF PAGE 60 ---\nWeldncii11-3\n\n59\n2. Develop\nteams and\nindividuals\n2.1 Provide team leadership\n2.2 Foster individual and\n organizational growth\n2.3 Monitor and evaluate workplace\n learning\n2.4 Develop team commitment and\n cooperation\n2.5 Facilitate accomplishment of\n organizational goals\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstrati\non\n• Case studies\n3. Apply\nproblem\nsolving\ntechniques\nin the\nworkplace\n3.1 Analyze the problem\n3.2 Identify possible solutions\n3.3 Recommend solution to higher\nmanagement\n3.4 Implement solution\n3.5 Evaluate/Monitor results and\noutcome\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n4. Collect,\nanalyze\nand\norganize\ninformation\n4.1 Study information requirements\n4.2 Process data\n4.3 Analyze, interpret and organize\ninformation gathered\n4.4 Present findings/\n Recommendations\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n5. Plan and\norganize\nwork\n5.1 Set objectives\n5.2 Plan and schedule work activities\n5.3 Implement work plans\n5.4 Monitor work activities\n5.5 Review and evaluate work plans\nand activities\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Promote\nenvironme\nntal\nprotection\n\n6.1 Study guidelines for environmental\nconcerns\n6.2 Implement specific environmental\nprograms\n6.3 Monitor activities on environmental\nprotection /programs\n• Direct\nobservation\n• Simulation/role\nplaying\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 61 ---\nWeldncii11-3\n\n60\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\npractices\n1.1 Identify hazardous areas\n1.2 Use protective clothing and\n devices\n1.3 Perform safe handling of tools,\n equipment and materials\n1.4 Perform first aid\n1.5 Use fire extinguisher\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n• Demonstration\n2. Interpret\ndrawings\nand sketches\n2.1 Identify standard alphabet of\nlines\n2.2 Identify orthographic/ isometric\nviews\n2.3 Interpret standard drawing\nsymbols, dimensional\ntolerances and notations\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written test\n\n3. Perform\nindustry\ncalculations\n3.1 Perform four fundamental\n operations\n3.2 Perform conversion of units\n3.3 Perform calculations on\n algebraic expressions\n3.4 Compute percentage and ratio\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written test\n\n4. Contribute to\nquality\nsystem\n4.1 Inspect work done\n4.2 Apply quality standards to work\n4.3 Protect company property and\n customer interests\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n•Demonstration\n5. Use hand\ntools\n\n5.1 Select hand tools\n5.2 Use hand tools\n5.3 Maintain hand tools\n\n• Lecturette\n• Practical\n application\n\n• Oral\n questioning\n• Written\n•Demonstration\n6. Prepare\nWeld\nMaterials\n6.1 Set up cutting equipment\n6.2 Cut and prepare edge of\nmaterials\n6.3 Clean surfaces and edges\n6.4 Prepare welding consumables\n6.5 Prepare welding safety and\nprotective equipment\n• Lecturette\n• Practical\n application\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n7. Set-up\nWelding\nEquipment\n7.1 Set up welding machine\n7.2 Set up welding accessories\n7.3 Set up welding positioners, jigs\nand fixtures\n7.4 Set up pre-heating\ntools/equipment as required\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n•Written test\n\n--- PDF PAGE 62 ---\nWeldncii11-3\n\n61\n8. Fit up Weld\nMaterials\n8.1 Perform tack welding\n8.2 Check gap and alignment\n8.3 Set up welding positioner\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n•Written test\n9. Repair\n Welds\n9.1 Mark/locate weld defects\n9.2 Prepare tools and equipment\n9.3 Remove defects\n9.4 Perform re-welding\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Weld Alloy\nSteel Pipes\nUsing SMAW\n1.1 Perform groove weld on pipe in\ndifferent positions\n• 2G\n• 5G\n• 6G\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 63 ---\nWeldncii11-3\n\n62"
