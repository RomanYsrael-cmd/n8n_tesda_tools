      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the national qualification of Film and Video Postproduction NC III, the candidate must demonstrate competence in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 The qualification may also be attained through the presentation of a portfolio of works covering all the units required on the conditions that: 4.1.2.1. The portfolio contains works and projects produced outside of a training or educational scenario (e.g. workshop, college course, thesis film) and were produced for a commissioned, commercial, or exhibition purpose. 4.1.2.2. The candidate has at least 3 years working experience in the field of film and video production. 4.1.2.3. The portfolio contains the candidate’s original work or work in which the candidate participated as a key or lead practitioner in the postproduction field (e.g. Editor, Visual Effects Artist, Colorist). 4.1.2.4. However, if the assessor finds the evidences presented inadequate, he/she may still require the candidate to undergo the practical demonstration depending on the need for supplementary evidences. 4.1.3 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.4 Candidates who have gained competencies through education, informal training, or work life experiences may apply for recognition in a particular qualification through competency assessment. 4.1.5 The following are qualified to apply for assessment and certification: 4.1.5.1. Graduates of WTR-registered program, NTR-registered programs or formal/non-formal/informal including enterprise-based trainings related to Film and Video Postproduction NC III; OR 4.1.5.2. Experienced Workers (wage-employed or self-employed) with at least 3 years working experience in the field of film and video production with at least 1 year working experience specifically in film and video postproduction. 4.1.6 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the FILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 109 Implementation of the “Philippine TVET Competency Assessment and Certification System (PTCACS)”."
