hical Responsibilities to Subjects and Documentary Filmmaking. Journal of Mass Media Ethics, (3), 192–206. https://doi.org/10.1080/08900523.2010.497025 Maio, A. (2019, November 21). What is Post-Production? A Quick Rundown & Why Trust Matters. Retrieved April 15, 2021, from StudioBinder website: https://www.studiobinder.com/blog/what-is-post-production/ Massey, T. (2020, May 5). How To Manage Client Expectations In Post Production. Retrieved April 15, 2021, from Ambient Skies Production website: https://ambientskies.com/blog/techniques/how-to-manage-client-expectations-in-post- production/ Mitchell, M. (2013). Visual Effects for Film and Television. Taylor & Francis. Nelson, R. (2013, October). Post-production Workflow. Retrieved April 15, 2021, from Untamed Science website: https://untamedscience.com/filmmaking/post- production/post-production-workflow/ Owsinski, B. (2016). The Mixing Engineer’s Handbook. --- PDF PAGE 121 --- FILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 117 Post-Production Workflow Model. (2017). Retrieved April 15, 2021, from Studiowide website: https://www.studiowide.co.uk/wp-content/uploads/2018/02/post- production_workflow_model.pdf Potter, C. (2012, November 13). 9 Ways to Improve Client Communication During Video Review — Video Review & Approval. Retrieved from Video Review & Approval website: https://screenlight.tv/blog/2012/11/13/9-ways-to-improve-client-communication-during- video-review Rayburn, D. (2012). Streaming and Digital Media. Taylor & Francis. Renee, V. (2016, October 10). 10 Stages of Post-Production, from Data Storage to Deliverables. Retrieved April 15, 2021, from No Film School website: https://nofilmschool.com/2016/10/10-stages-post-production-data-storage-deliverables Savage, S. (2011). The Art of Digital Audio Recording. Oxford University Press on Demand. Special Effects vs. Visual Effects: Which is a Film Essential? (2018, July 14). Retrieved from CIIT Philippines School - Multimedia Arts, Web