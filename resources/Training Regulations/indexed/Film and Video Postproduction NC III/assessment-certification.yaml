      "text": "3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. --- PDF PAGE 114 --- FILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (dd/mm/yyyy) 110 CREATIVE SECTOR – FILM AND VIDEO POSTPRODUCTION NCIII Receive and respond to workplace communication Work with others Solve/address routine problems Enhance self- management skills Support innovation Access and maintain information Follow occupational safety and health policies and procedures Apply environmental work standards Adopt entrepreneurial mindset in the workplace Participate in workplace communication Work in a team environment Solve/address general workplace problems Develop career and life decisions Contribute to workplace innovation Present relevant information Practice occupational safety and health policies and procedures Exercise efficient and effective sustainable practices in the workplace Practice entrepreneurial skills in the workplace Lead workplace communication Lead small teams Apply critical thinking and problem-solving techniques in the workplace Work in a diverse environment Propose methods of applying learning and innovation in the organization Use information systematically Evaluate occupational safety and health work practices Evaluate environmental work practices Facilitate entrepreneurial skills for micro- small-medium enterprises (MSMEs) Utilize specialized communication skills Develop and lead teams Perform higher order thinking processes and apply techniques in the workplace Contribute to the practice of social justice in the workplace Manage innovative work instructions Manage and evaluate usage of information Lead in improvement of Occupational Safety and Health (OSH) programs, policies, and procedures Lead towards improvement of environment work programs, policies, and procedures Sustain entrepreneurial skills --- PDF PAGE 115 --- FILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (dd/mm/yyyy) 111 Develop and update industry knowledge Develop creative thinking, artistic skills, and cultural awareness Observe procedures, specifications, and manuals of instructions Operate equipment Manage own performance Maintain clean, safe, and efficient work environment Provide and maintain effective client relations Prepare postproduction materials and facilities Build edits and materials for postproduction Create enhanced edits and materials for postproduction Wrap up postproduction Handle and install basic audio equipment Perform technical assistance and basic troubleshooting Prepare lighting equipment, tools and supplies Set-up lighting equipment according to the lighting plan Operate and monitor the lighting system Dismount, maintain and store lighting equipment --- PDF PAGE 116 --- FILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 112 Low-resolution sample or rendering of a visual effect or composite used for timing and work-around purposes early in the postproduction process. Animatics may also be storyboards that are played in sequence with sound or a musical score to give Clients an idea of the resulting film or video project an umbrella term that describes a route in which you take a selection of one or more instruments or tracks, from their own channels and route them to a particular place or group. A program within a DAW usually produced by a third party and not part of the core or main software system. Plugins may be effects processors, instruments, and other digital systems that may be used to enhance or strengthen elements in a sound design The technical process of improving the visual quality of film footage by adjusting brightness, contrast, saturation, and/ or hue The creative process of adding mood and atmosphere by re- coloring footage according to a pre-determined set or combination of colors known as a “color palette” a subtle way to visually enhance the emotional aspect of a film or video project and guide the viewer to respond viscerally or emotionally to a scene, character, sequence, or entire film. Color palettes are developed by selecting color combinations around the color wheel and expanding its character by varying its brightness, saturation, and tone (DAW) A dedicated computer system intended for use in recording and editing audio files. DAWs have the appropriate software and hardware to interface with audio peripherals such as mixers, microphones, and monitors PACKAGE (DCP) a collection of digital files used to store and convey digital cinema audio, image, and data streams. It is the primary system used to transport and project films in theatres and festivals. Film files are encoded and encrypted onto hard drives and distributed to cinemas and other venues; the data in a DCP cannot be “played” directly like ordinary video files, but must be decoded by a matching decoder on a digital cinema projector at the projection venue. General term used for postproduction techniques. Involves the sequencing and arrangement of audio, graphic, and video material to create a whole or cohesive project. Process of outputting a film and video project into a form that is usable for its intended purpose. Exports may be but are not limited to: --- PDF PAGE 117 --- FILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 113 General term for postproduction material that is produced outside the primary editing system or by other systems or individuals. In many cases these assets are produced by experts in these fields and integrated onto a timeline by the editor. The reproduction of everyday sound effects and adding them in postproduction. Foley is commonly heard in elements such as doors opening and closing, footsteps, and breaking glass. Professional Foley Artists are highly talented and well paid in large film projects. General term used for raw video material coming from a camera or similar recording device A player or computer that is not the primary editing platform, preferably not connected to the editing platform via network. An independent system allows final edited materials to be previewed and reviewed for compatibility and functionality Visual effects designed to be “invisible” or in the background without calling attention to itself. The process of finalizing or “locking” a film or video project at the highest possible quality or resolution. The resulting data file will be used as the source of future copies as well as form an archived copy Digital information embedded into the output files of film, audio, and video projects that communicate with playback systems. Process of non-destructive editing of video and audio footage; usually on a desktop computer system. Also known as Desktop Video Editing. A preliminary or “rough cut” of a project before effects, colors, and enhancements are finalized. Offline edits are usually used as previews and referenced by external asset producers to create digitally produced material such as CGI, graphics, and sound. Commonly offline edits are developed at a lower resolution to reduce processing time and increase work speed An edit where digital effects and external assets have been integrated and utilized in their full resolution. Online edits are usually made during the latter part of the postproduction process as the whole project approaches completion. (OMF) A platform-independent file format intended for transfer of digital media between different software applications. OMF files are used for both audio and video files, especially when sharing files between workstations and work environments Stands for Redundant Array of Independent Disks. It is a data storage virtualization technology that combines multiple physical disk drive components into a single logical unit for the purposes of data redundancy, performance improvement, or both. --- PDF PAGE 118 --- FILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 114 The length or duration of a film or video project. Some mediums have a required or prescribed Running Time such as advertising with 30- and 60-second running times. A series of scenes or shots that form a complete narrative unit. Multiple sequences are brought together to create a complete film or video project. Editing a sequence is more than just editing shots together but requires an element of storytelling as the result should contain a viable internal narrative structure. Commonly pronounced “Simptee”, stands for The Society of Motion Picture and Television Engineers is an international professional association, based in the United States, of engineers working in the motion imaging industries. An internationally recognized standards organizations, SMPTE has more than 600 Standards, Recommended Practices and Engineering Guidelines for television production, filmmaking, digital cinema, audio recording, information technology, and medical imaging. The acoustic environment perceived by humans. In film and video projects it is the 3-dimensional space in which characters exist; it is composed of the sounds that form and arise from an immersive environment. A timecode (alternatively, time code) is a sequence of numeric codes generated at regular intervals by a timing synchronization system. In video production and filmmaking, SMPTE timecode is used extensively for synchronization, and for logging and identifying material in recorded media. The primary interface for postproduction work done on audio, video, and graphic elements. All assets are sequenced on a timeline; timelines are present in all major and professional editing platforms --- PDF PAGE 119 --- FILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 115 344Audio. (2020, May 18). The Ultimate Guide To Audio Post Production & Sound Design. Retrieved April 15, 20