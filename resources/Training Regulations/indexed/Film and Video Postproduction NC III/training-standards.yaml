    "source_text": "3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/ language, and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: FILM AND VIDEO POSTPRODUCTION NC Level NC III\n\nNominal Training Duration: 40 Hours (Basic)\n\n 88 Hours (Common)\n 170 Hours (Core)\n\n 298\nHours\n\n 120 Hours - Supervised Industry Learning (SIL)\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable to perform editing for film and video projects in accordance\nwith the requirements of the project, director, producers, or other relevant members of\nthe team. It also covers training in Audio, Graphics, and Color Grading as these skills\nare required to create a well-rounded and competent film and video postproduction\nprofessional. This include classroom learning activities and practical work in actual\nwork site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for\nthis qualification must be achieve.\n\n--- PDF PAGE 81 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 77\nBASIC COMPETENCIES\n(40 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Lead\nworkplace\ncommunication\n1.1 Communicate\ninformation\nabout\nworkplace\nprocesses\n• Read\no Effective verbal communication\nmethods\no Sources of information\n• Practice organizing information\n• Identify organization requirements for\nwritten and electronic communication\nmethods\n• Follow organization requirements for\nthe use of written and electronic\ncommunication methods\n• Perform exercises on understanding\nand conveying intended meaning\nscenario\n• Lecture\n• Demonstration\n• Practical\nexercises\n• Role Play\n• Written Test\n• Observation\n2 Hours\n\n1.2 Lead\nworkplace\ndiscussions\n• Describe:\no Organizational policy on production,\nquality, and safety\no Goals/ objectives and action plan\nsetting\n• Read\no Effective verbal communication\nmethods\n• Prepare/set action plans based on\norganizational goals and objectives\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Oral evaluation\n• Written Test\n• Observation\n2 Hours\n\n1.3 Identify and\ncommunicate\nissues arising\nin the\nworkplace\n• Describe:\no Organizational policy in dealing with\nissues and problems\n• Read\n• Effective verbal communication\nmethods\n• Group\ndiscussion\n• Lecture\n• Oral evaluation\n• Written Test\n2 Hours\n\n--- PDF PAGE 82 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 78\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Lead small\nteams\n2.1 Provide team\nleadership\n\n• Discussion of Company policies and\nprocedures\n• Read web pages on situational\nleadership\n• Role play on situational leadership\n• Group work\n• Role Play\n• Lecture/\nDiscussion\n• Individual\nWork\n• Role Play\n• Written Test\n\n1 Hour\n\n2.2 Assign\nresponsibilities\n• Read web pages on performance\nmanagement\n• Case study on allocating roles and\nresponsibilities based on competencies\nof current staff\n• Individual Work\n• Case Study\n• Role Play\n• Written Test\n\n1 Hour\n\n2.3 Set\nperformance\nexpectations\nfor team\nmembers\n• Role play to communicate performance\nexpectations with staff\n• Discussion on performance issues\n\n• Lecture/\nDiscussion\n• Role Play\n• Role Play\n• Written Test\n\n1 Hour\n\n2.4 Supervise\nteam\nperformance\n• Discussion on performance monitoring\n• Role play on providing feedback on\nperformance\n• Role play on performance coaching\n• Discussion on keeping the team\ninformed of team performance\n• Case study on Team performance\nmonitoring and feedback\n• Lecture/\nDiscussion\n• Role Play\n• Case Study\n• Role Play\n• Written Test\n\n1 Hour\n3. Apply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n3.1 Examine\nspecific\nworkplace\nstrategies\n\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n• Show mastery of the current industry\nhardware and software products and\nservices\n• Discuss process of identification of\nfundamental causes of specific\nworkplace challenges\n• Group\ndiscussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 83 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 79\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Show mastery of knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n- Relevant equipment and\noperational processes\n- Enterprise goals, targets and\nmeasures\n- Enterprise quality OHS and\nenvironmental requirement\n- Enterprise information systems and\ndata collation\n- Industry codes and standards\n\n3.2 Analyze the\ncauses of\nspecific\nworkplace\nchallenges\n\n• Show thorough knowledge and\nunderstanding of the process, normal\noperating parameters, and product\nquality to recognize non-standard\nsituations\n• Show mastery of the current industry\nhardware and software products and\nservices\n• Discuss process of identification of\nfundamental ca