    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for FILM AND VIDEO POSTPRODUCTION NC III\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/ language, and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: FILM AND VIDEO POSTPRODUCTION NC Level NC III\n\nNominal Training Duration: 40 Hours (Basic)\n\n 88 Hours (Common)\n 170 Hours (Core)\n\n 298\nHours\n\n 120 Hours - Supervised Industry Learning (SIL)\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills\nand attitude, applicable to perform editing for film and video projects in accordance\nwith the requirements of the project, director, producers, or other relevant members of\nthe team. It also covers training in Audio, Graphics, and Color Grading as these skills\nare required to create a well-rounded and competent film and video postproduction\nprofessional. This include classroom learning activities and practical work in actual\nwork site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for\nthis qualification must be achieve.\n\n--- PDF PAGE 81 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 77\nBASIC COMPETENCIES\n(40 HOURS)\n\nUnit of\nCompetency\nLear