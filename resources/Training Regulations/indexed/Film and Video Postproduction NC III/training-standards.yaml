ion\n• Written\nexamination\n• Presentation\n6 hours\n\n--- PDF PAGE 106 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 102\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nrelations, and working conditions\n•\nDemonstration\no Conducting a postmortem\no Managing Creatives in a creative\nenvironment\no Powering down and securing the work\nenvironment\n\n--- PDF PAGE 107 ---\nFILM AND VIDEO POSTPRODUCTION NC III Revision 00 Promulgated (12/17/2019) 103\n\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written\nto industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/ components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1\nInstitution - Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines\non this mode shall be issued by the TESDA Secretariat.\n\n• Supervised Industry Learning (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative\n\n--- PDF PAGE 108 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 104\nthat the deployment of trainees in the workplace is adhered to training\nprograms agreed by the institution and enterprise and status and progress\nof trainees are closely monitored by the training institutions to prevent\nopportunity for work exploitation.\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2\nEnterprise-Based:\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training\nis integrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3\nCommunity-Based – short term programs conducted by non-government\norganizations (NGOs), LGUs, training centers and other TVET providers\nwhich are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall,\nbasketball courts, etc. These programs can also be mobile training program\n(MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS:\n\nThe trainees or students who want to enroll in this course should possess the following\nrequirements:\n\n• Must possess good communication skills\n• Must be computer literate\n• Must be digitally literate\n\n--- PDF PAGE 109 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 105\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment, and materials for the training of 25 trainees\nfor FILM AND VIDEO POSTPRODUCTION NCIII are as follows.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used as\nalternatives. This also applies in consideration of community practices and their\navailability in the local market.\n\nA. (Full Qualification)\nTOOLS\nQTY\nDESCRIPTION\n25 units\nCopies or Licenses: Adobe Premiere Pro, Final Cut Pro, or\ncomparable professional-grade video editing software.\n25 units\nCopies or Licenses: Adobe After Effects, or comparable\nprofessional-grade compositing software.\n25 units\nCopies or Licenses: Adobe Audition or comparable\nprofessional-grade audio postproduction software.\n1\nHigh-bandwidth network and internet access\n25 units\nCopies or Licenses: DaVinci Resolve or comparable\nprofessional-grade color grading software.\n\nEQUIPMENT\nQTY\nDESCRIPTION\n25 units\nDesktop Editing Computers with the highest possible\nspecifications particularly:\n-\nProcessor Speed\n-\nRAM\n-\nVideo Graphics Card RAM\n-\nInternal Storage (system)\nInternal Storage (data)\n25 units\nMinimum 21” computer monitor or larger (dual 17”, ultra-\nwide, or larger systems are recommended but not required)\n50\nExternal hard drives (high capacity SSD or equivalent)\n25\nRAID 5 storage systems (optional or in lieu of portable\nexternal drives)\n1\nAudio recording booth or area including:\n-\nMicrophones\n-\nMixer\n-\nMonitors and headsets\n-\nAcoustic treatment or soundproofing\n(optional but highly recommended)\n1\nHigh Lumens projector or min. 55” LED TV for\ndemonstrations and screenings\n1\nAudio system (minimum Stereo or 2.1) per teaching space\n25 units\nHeadphones or personal audio monitor\n\n--- PDF PAGE 110 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 106\nMATERIALS\nQTY\nDESCRIPTION\n48 hrs.\nLibrary of rushes/ raw footage of various genre and formats\n(for exercises/ simulations)\n\nLibrary of audio loops and soundtracks (offline or online)\n\nLibrary of sound effects (offline or online)\n\nLibrary of films and other sample/ teaching material (offline\nor online)\n\n3.5 TRAINING FACILITIES\n\nTEACHING / LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ.\nMETERS\nContextual Learning Area (Lecture room)\n5 x 6\n30\n30\nDistance Learning (Laboratory/\nWorkshop/ Activity area)\n8 x 9\n72\n72\nIsolation/ Recording Booth\n2 x 3\n6\n6\nStorage Area (S/M storage area)\n4 x 4\n16\n16\nLearning Resource Area\n2 X 3\n6\n6\nWash area/ comfort room\n(Male, Female, PWD)\n3 X 4\n12\n12\nCirculation Area\n3 X 5\n15\n15\nTotal Workshop Area\n\n157\n157\n\nNOTE: Training Center may enter into 