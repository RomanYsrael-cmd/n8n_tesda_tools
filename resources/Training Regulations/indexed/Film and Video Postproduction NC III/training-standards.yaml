n\n• Written\nexamination\n• Project\nproduction\n• Presentation\n24 hours\n\n--- PDF PAGE 104 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 100\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n•\nDemonstration:\no Creating composites\no Basic motion graphics\no Basic invisible VFX techniques (e.g.\nexplosions, background replacement, blood\nsplatters, etc.)\n•\nLecture and discussion:\no Ethics and ethical postproduction\no News, propaganda, politics, fake news,\nadvertising, and how postproduction makes\nit all “real”\no Deep fakes, audio splicing, and computer-\ngenerated imagery\no Intellectual property and Creative Commons\no Case studies in unethical postproduction\nbehavior\n•\nScene replication and simulation exercises\n\n4. Wrap up\npostproduction\n4.1 Manage client\nrevisions and\ninputs\n•\nLecture and discussion:\no Dealing with creative differences\no Pitching and presenting creative ideas\n•\nReview:\no Presentation and feedback mechanisms for\nclient interactions\n•\nRole playing and scenario-based simulations of\nvarious plausible postproduction situations\nsuch as:\no Contradicting directives/ instructions\no Out-of-contract requests or requirements\no Pitching projects and ideas to client\no Defending decisions and creative license\n•\nReadings:\no SMPTE standards for broadcast and film\no MTRCB policies for broadcast and film\no 4A’s (Advertising Association) policies\n• Lecture\n• Group\ndiscussion\n• Demonstration\n• Role playing\n• Readings and\nmanuals\n• Guided\npractice/\nsimulation\n• Case studies\n\n• Oral\nquestioning\n• Demonstration\n• Observation\n• Presentation\n6 hours\n\n--- PDF PAGE 105 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 101\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\no KBP policies for broadcasting\n\n4.2 Mix-down an