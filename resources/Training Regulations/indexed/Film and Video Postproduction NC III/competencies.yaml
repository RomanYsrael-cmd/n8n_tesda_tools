nmental\nStandards and\nProcedures\n3.1 Documentation\nand Record\nKeeping Skills\n3.2 Critical thinking\n3.3 Problem Solving\n3.4 Observation Skills\n\n--- PDF PAGE 36 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 32\nidentified are\nimplemented based on\nenvironment work\nstandards and\nprocedures\n3.4. Results of environmental\nassessment are\nconveyed to appropriate\npersonnel\n\nRANGE OF VARIABLES\n\nVARIABLE\nR A N G E\n1. Environmental Practices\nIssues\nMay include:\n1.1\nWater Quality\n1.2\nNational and Local Government Issues\n1.3\nSafety\n1.4\nEndangered Species\n1.5\nNoise\n1.6\nAir Quality\n1.7\nHistoric\n1.8\nWaste\n1.9\nCultural\n2. Environmental Indicators\nMay include:\n2.1\nNoise level\n2.2\nLighting (Lumens)\n2.3\nAir Quality - Toxicity\n2.4\nThermal Comfort\n2.5\nVibration\n2.6\nRadiation\n2.7\nQuantity of the Resources\n2.8\nVolume\n\n--- PDF PAGE 37 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 33\nEVIDENCE GUIDE\n\n1. Critical aspects of\n Competency\nAssessment requires evidence that the candidate:\n1.1. Identified environmental issues relevant to work\nrequirements\n1.2. Identified gaps in work practices related to Environmental\nStandards and Procedures\n1.3. Gathered relevant information necessary to determine\nenvironmental work targets\n1.4. Set environmental indicators based on gathered information\nto measure environmental work targets\n1.5. Recorded work environmental practices are recorded based\non workplace standards\n1.6. Conveyed results of environmental assessment to\nappropriate personnel\n2. Resource Implications The following resources should be provided:\n 2.1 Workplace/Assessment location\n 2.2 Legislation, policies, procedures, protocols and local\nordinances relating to environmental protection\n 2.3 Case studies/scenarios relating to environmental protection\n3. Methods of Assessment Competency in this unit may be assessed through:\n 3.1 Written/ Oral Exam