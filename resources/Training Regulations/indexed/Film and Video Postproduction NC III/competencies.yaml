STPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               8 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.5  Team operations \nare monitored to \nensure that \nemployer/client \nneeds and \nrequirements are \nmet \n4.6   Follow-up \ncommunication is \nprovided on all \nissues affecting \nthe team \n 4.7  All relevant \ndocumentation is \ncompleted in \naccordance with \ncompany \nprocedures \n \n \n \n    RANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1. Work requirements \nMay include: \n1.1. Client Profile \n1.2. Assignment instructions \n2. Team member’s \nconcerns \nMay include: \n2.1. Roster/shift details \n3. Monitor performance \nMay include: \n3.1. Formal process \n3.2. Informal process \n4. Feedback \nMay include: \n4.1. Formal process \n4.2. Informal process \n5. Performance issues \nMay include: \n5.1. Work output \n5.2. Work quality \n5.3. Team participation \n5.4. Compliance with workplace protocols \n5.5. Safety \n5.6. Customer service\n\n--- PDF PAGE 13 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               9 \n    EVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1. Maintained or improved individuals and/or team \nperformance given a variety of possible scenario \n1.2. Assessed and monitored team and individual \nperformance against set criteria \n1.3. Represented concerns of a team and individual to \nnext level of management or appropriate specialist \nand to negotiate on their behalf \n1.4. Allocated duties and responsibilities, having regard to   \nindividual’s knowledge, skills and aptitude and the \nneeds of the tasks to be performed \n1.5. Set and communicated performance expectations for \na range of tasks and duties within the team and \nprovided feedback to team members \n2. Resource Implications \nThe following resources should be provided: \n2.1. Access to relevant workplace or appropriately \nsimulated environment where assessment can take \nplace \n2.2. Materials relevant to the proposed activity or task \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1. Written Examination \n3.2. Oral Questioning  \n3.3. Portfolio \n4. Context for Assessment \n4.1    Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter.\n",
