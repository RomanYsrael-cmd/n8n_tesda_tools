        "source_title": "PREPARE POSTPRODUCTION MATERIALS AND FACILITIES",
        "source_text": "--- PDF PAGE 58 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               54 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY: \nPREPARE POSTPRODUCTION MATERIALS AND FACILITIES \n \nUNIT CODE                     : \n CRE343305 \n \nUNIT DESCRIPTOR        : \nThis unit covers the knowledge, skills and attitudes required to \ndetermine the materials, facilities, resources, and information \nnecessary to achieve the best performance possible and/or to \nachieve the creative and/or technical requirements for a variety of \nfilm and video projects and productions based on the required \nPerformance Standards. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Setup \npostproduction \nfacility \n1.1 Postproduction \nfacility is set up in \naccordance with \nstandard safety \nprocedures, space \navailability and \nproduction \nrequirements.  \n1.2 Production facility \nsetup is achieved \nwithin the constraints \nof time, budget, \nworking environment, \nand production \nrequirements. \n1.3 Postproduction \nsoftware are \nupdated to maintain \ncompatibility with \ncontemporary audio \nand video file \nformats. \n1.4 Microphones are \nproperly placed and \npatched inside the \nisolation booth. \n \n \n1.1 Company rules and \nregulations, standards, \nand operating \nprocedures regarding \npostproduction \nfacilities \n1.2 Applied computer \noperation \n1.3 Basic knowledge of \ncomputer and \npostproduction \nsystems \n1.4 Basic production \nterminology, \nprocesses, workflows, \nand protocols \n1.5 Postproduction system \nconfigurations, \npatching, and layout \nbased on \nmanufacturer’s and/or \ncompany \nspecifications \n1.6 Basic electrical and \nelectronic safety \nprocedures \n1.7 Basic mathematical \nprocess of addition, \nsubtraction, \nmultiplication, and \ndivision \n1.8 Basic Unit conversion \n1.9 DOLE DO 198s2018 \npolicies on OSH as \napplicable \n1.10 \nInter-Guild Alliance \n1.1 Operating computer \nsystems with media \nand digital literacy \nskills \n1.2 Handling and \noperating \npostproduction \nfacilities, equipment, \nand materials \n1.3 Maintaining clean and \norderly workplace/ \nproduction \nenvironment \n1.4 Demonstrating \nmanual dexterity \n1.5 Observing proper \nOSH procedures as \napplicable \n1.6 Maintaining an \necologically friendly \nworking practice and \nenvironment\n\n--- PDF PAGE 59 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               55 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n(IGA) 2020 Health and \nSafety protocols for \nFilm and Audiovisual \nIndustry productions \nas applicable \n1.11 \nDOH guidelines on \nsafety and health as \napplicable \n1.12 \nFundamental \nenvironmental \nawareness and \nconservation \n2. Align creative \nand technical \nmatters with \nClient \n2.1 Client expectations \non quality, workflows, \nand timetables are \nclearly defined \nthrough client \nmeetings. \n2.2 Presentation skills \nare used to \ncommunicate the \nrelevant concepts, \nvalues, and \nprocesses in the \ndelivery of expected \noutputs. \n2.3 Client is made to \nunderstand and \nagree to the \nguidelines and \ncontracts that are fair \nto all parties \nconcerned. \n \n2.1 Company rules, \nregulations, and \nstandards regarding \nclients and client \nrelations \n2.2 Basic interpersonal \ncommunication and \nculturally and gender \nsensitive behavior  \n2.3 DOLE DO 198s2018 \npolicies on OSH as \napplicable \n2.4 Inter-Guild Alliance \n(IGA) 2020 Health and \nSafety protocols for \nFilm and Audiovisual \nIndustry productions as \napplicable \n2.5  DOH guidelines on \nsafety and health as \napplicable \n2.6 Basic production \nterminology, \nprocesses, workflows, \nand protocols \n2.7 Fundamental \nknowledge on laws \nand policies as \napplicable \n2.7.1 MTRCB \n2.7.2 PANA, 4As \n2.7.3 KBP, Media Code \n2.7.4 Business laws \n2.7.5 Intellectual \nProperty Code \n2.8 Common output \npostproduction formats \nand containers \n2.1 Communicating \neffectively with: \na. Verbal skills \nb. Non-verbal skills \n2.2 Applying effective \ntime management \n2.3 Practicing \nprofessional \nworkplace interaction \nand etiquette  \n2.4 Communicating ideas \nand information to \nothers \na. Written \nb. Verbal  \n2.5 Planning and \norganizing activities \nand work tasks \n2.6 Conducting one’s self \nwith cultural and \ngender sensitivity\n\n--- PDF PAGE 60 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               56 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Manage \npostproduction \nfacilities, \nmaterials and \nresources \n \n3.1 Postproduction \nResources are \nprepared and \norganized in \naccordance with \nproduction \nrequirements.  \n3.2 Postproduction \nsystems and \nperipherals are \nsecured together with \npostproduction \nmaterials before \ncommencement of \npostproduction in \naccordance with \nproduction \nrequirements. \n3.3 Postproduction \nsoftware, plug-ins, \nand relevant add-ons \nare installed for \nseamless operation \nin accordance with \nmanufacturer’s \nspecifications and/or \ncompany policy. \n3.4 Good signal flows \nare checked and \ntracks, storage \ndevices, and folders \nare properly labeled/ \nnamed for efficient \nworkflows. \n3.5 Troubleshooting \nguide for both \nhardware and \nsoftware issues is \nprepared in \naccordance with \nproduction \nrequirements and \ncompany policy. \n \n3.1 Company rules and \nregulations, \nstandards, and \noperating procedures \nregarding \npostproduction \nfacilities \n3.2 Applied computer \noperation and digital \nmedia literacy \n3.3 Basic knowledge of \ncomputer and \npostproduction \nsystems \n3.4 Postproduction system \nconfigurations, \npatching, and layout \nbased on \nmanufacturer’s and/or \ncompany \nspecifications \n3.5 Basic electrical and \nelectronic safety \nprocedures \n3.6 Basic mathematical \nprocess of addition, \nsubtraction, \nmultiplication, and \ndivision \n3.7 Basic Unit conversion \n3.8 DOLE DO 198s2018 \npolicies on OSH as \napplicable \n3.9 Inter-Guild Alliance \n(IGA) 2020 Health and \nSafety protocols for \nFilm and Audiovisual \nIndustry productions \nas applicable \n3.10 DOH guidelines on \nsafety and health as \napplicable \n3.1 Operating computer \nsystems with media \nand digital literacy \nskills \n3.2 Handling and \noperating \npostproduction \nfacilities, equipment, \nand materials \n3.3 Maintaining clean \nand orderly \nworkplace/ \nproduction \nenvironment \n3.4 Demonstrating \nmanual dexterity \n3.5 Observing proper \nOSH procedures as \napplicable\n\n--- PDF PAGE 61 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               57 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Postproduction Facility \nMay include:  \n1.1 Editing suites or rooms/ spaces dedicated to \npostproduction \n1.2 Edit workstations \n1.3 Recording or isolation booths \n1.4 Color grading suites \n1.5 Preview or screening rooms \n2. Production Requirements \nMay include: \n2.1 Storyboard \n2.2 Script or similar guide \n2.3 Project, technical, and/or creative direction/s from \na qualified member of the production team such \nas director, writer, or producer \n2.4 Project objective or final output requirement \n3. Postproduction Software \nMay Include: \n3.1 Non-linear editing software (e.g. Adobe Premiere, \nFinal Cut Pro, Avid) \n3.2 Graphics software (e.g. Adobe Photoshop, \nPhotopea, Corel Draw) \n3.3 Audio software (e.g. Sony Vegas, Adobe Audition, \nProTools, LogicPro) \n3.4 Specialized software (e.g. color grading software, \nanimation software, plug ins, controllers, etc.) \n4. Client \nMay include: \n4.1 Corporate or business client \n4.2 Advertising producer or account executive \n4.3 Director, screenwriter, or producer \n4.4 Commissioning client or customer \n4.5 Postproduction Supervisor, Head Editor, or Traffic \nCoordinator \n4.6 Instructor, trainer, teacher, or TVI coordinator \n5. Client Meetings \nMay include: \n5.1 Treatment and Concept consultations. \n5.2 Definition of working guidelines to client for \nunderstanding and agreement purposes. \n5.3 Project briefings for client and team members. \n5.4 Presentations to Client any drafts or works in \nprogress for preview or approval \n5.5 Updates to Client regarding timeline or status of \nproject execution. \n5.6 Negotiations regarding services, fees, and \ncontracts  \n5.7 Other activities, engagements, discussions, and \ncoordination between the Production Team and \nthe Client.\n\n--- PDF PAGE 62 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               58 \n6. File format and/ or container \nFormats may include: \n6.1 Standard, High definition, or 4K \n6.2 H.264, H265, or other CODECs \n6.3 Compressed or Uncompressed \n6.4 WAV, MP3, or AIFF audio \nContainers may include: \n6.5 Video: MOV, AVI, MP4, WMV \n6.6 Audio: WAV, AIFF, AAC, MP3 \n6.7 Graphics: PSD, JPG, PNG, TIFF \n7. Postproduction Resources \nMay include: \n7.1 Edit logs and shot lists \n7.2 Library materials and lists \n7.3 Stock visuals, graphics, and sound effects \n7.4 Scripts  \n7.5 Guides and manuals \n7.6 Sound reports \n7.7 Camera logs \n8. Postproduction System \nMay include: \n8.1 Computer workstation used for postproduction \n8.2 Software or applications used in postproduction \n8.3 Peripherals, devices, or accessories added onto a \nprimary system \n9. Peripherals \nMay include: \n9.1 Portable and fixed storage (e.g. hard drives, flash \nstorage, solid state drives (SSDs)) \n9.2 Control and input systems (e.g. mouse, tablet, \ncontrol   panel, mixers, drawing tablets) \n9.3 Monitoring devices (e.g. headphones, video \nreference monitors, studio monitors) \n10. Postproduction Materials \nMay include: \n10.1 Project footage  \n10.2 Scores, music, and sound effects \n10.3 Graphics and other visual material \n10.4 Reference pegs and materials \n11. Good Signal Flows \nMay include: \n11.1 Clarity and/or level/ volume \n11.2 No extraneous noises, defects, or disruptions \n11.3 Information sent/ received is accurate or as \nintended by sender/ receiver\n\n--- PDF PAGE 63 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               59 \nEVIDENCE GUIDE \n \n1. \nCritical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Aligned technical and creative directions and requirements \nwith the Client  \n1.2 Established a functional and workable postproduction \nenvironment for the given production requirement \n1.3 Observed safety measures applicable to worksite operation \n1.4 Communicated effectively with others to ensure effective \nwork operation \n2. \nResource \nimplications \nThe following resources should be provided:  \n2.1 Computer system  \n2.1.1 Postproduction software (e.g. Premiere, Final Cut Pro,  \nVegas, etc.) \n2.1.2 Image editing software (e.g. Adobe Photoshop, Adobe \nIllustrator, Corel Draw) \n2.1.3 Audio production software (e.g. ProTools, LogicPro, \nAbleton, Audacity) \n2.1.4 Production peripherals (e.g. microphones, monitors,  \ndrawing tablets, mixers, and the like) \n2.2 Workplace location \n2.3 Materials relevant to the unit of competency \n3. \nMethods of \nassessment \nCompetency in this unit must be assessed through: \n3.1 Demonstration with oral questioning \n3.2 Written examination \n3.3 Practical examination \n4. Context of assessment \n4.1 Competency may be assessed in actual workplace or at the  \n    designated TESDA Accredited Assessment Center.\n",
