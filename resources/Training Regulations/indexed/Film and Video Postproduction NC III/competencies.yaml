IABLE\nRANGE\n1. Animatics\nMay include:\n1.1 Low-resolution renders\n1.2 Animated storyboards\n1.3 Proxy effects or materials\n2. “Invisible” Visual Effects\nMay include:\n2.1 Background replacement or enhancement such as\nadding clouds or mountains in the distance\n2.2 Erasures such as removing screen elements such\nas stunt rigging, wires, or bystanders\n2.3 Multiplications such as creating anonymous\n\n--- PDF PAGE 73 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 69\ncrowds or large armies\n2.4 Insertions such as adding extras, street elements,\nor building textures\n2.5 Enhancements such as making eyes larger or\nadding abdominal muscles\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Operated software and equipment effectively in the\npostproduction facility to create edits and postproduction\nmaterials\n1.2 Executed the requirements of a client or production task\ncreatively and efficiently\n1.3 Utilized advanced functions of the postproduction system to\nachieve complex or enhanced edits and materials\n1.4 Observed safety measures applicable to worksite operation\n1.5 Communicated effectively with others to ensure effective\nwork operation\n2. Resource implications The following resources should be provided:\n2.1 Computer system\n2.1.1 Postproduction software (e.g. Premiere, Final Cut\n Pro, Vegas, etc.)\n2.1.2 Image editing software (e.g. Adobe Photoshop, Corel\nDraw, Adobe Illustrator)\n2.1.3 Audio production software (e.g. ProTools, LogicPro,\n Ableton, Audacity)\n2.1.4 Production peripherals (e.g. microphones, monitors,\n drawing tablets, mixers, and the like)\n2.2 Workplace location\n2.3 Materials relevant to the unit of competency\n3. Methods of\nassessment\nCompetency in this unit must be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Portfolio of works with interview for those with minimum 3\nyears’ relevant industry experience\n4. Context of assessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 74 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 70\n\nUNIT OF COMPETENCY:\nWRAP UP POSTPRODUCTION\n\nUNIT CODE :\n CRE343308\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\nfinalize and complete the postproduction (editing) phase to\nachieve the creative and/or technical requirements for a variety\nof film and video projects and productions based on the\nrequired Performance Standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Manage client\nrevisions and\ninputs\n1.1 An offline edit is\nproduced and\npreviewed by client\naccording to production\nrequirements.\n1.2 Presentation skills are\nused to communicate\ncreative and technical\ndecisions in the edit\nmade by the editor in\nline with production\nrequirements and\ncreative direction.\n1.3 Client’s revisions and\ninputs are addressed\nand incorporated into\nthe edit according to\nthe agreements\nbetween client and\nproduction team.\n\n1.1 Company rules,\nregulations, and\nstandards regarding\nclients and client\nrelations\n1.2 Basic interpersonal\ncommunication and\nculturally and gender\nsensitive behavior\n1.3 Basic production\nterminology, processes,\nworkflows, and\nprotocols\n1.4 Fundamental\nknowledge on laws and\npolicies as applicable\n1.4.1 MTRCB\n1.4.2 PANA, 4As\n1.4.3 KBP, Media\nCode\n1.4.4 Business laws\n1.4.5 Intellectual\nProperty Code\n1.5 Common and\ncontemporary output\npostproduction formats\nand containers\n1.1 Communicating\neffectively with:\na. Verbal skills\nb. Non-verbal\nskills\n1.2 Applying effective\ntime management\n1.3 Practicing\nprofessional\nworkplace\ninteraction and\netiquette\n1.4 Communicating\nideas and\ninformation to\nothers\na. Written\nb. Verbal\n1.5 Planning and\norganizing activities\nand work tasks\n1.6 Conducting one’s\nself with cultural\nand gender\nsensitivity\n\n2. Mix-down and\nmaster audio\n2.1 Audio busses are used\nto organize channels\naccording to workflow\nprotocols and\nproduction\nrequirements.\n2.2 Levels and sound\nproperties of tracks are\nadjusted using different\naudio plugins\n2.1 Company rules and\nregulations, standards,\nand operating\nprocedures regarding\npostproduction facilities\n2.2 DOLE DO 198s2018\npolicies on OSH as\napplicable\n2.3 Inter-Guild Alliance\n(IGA) 2020 Health and\n2.1 Operating computer\nsystems with media\nand digital literacy\nskills\n2.2 Handling and\noperating\npostproduction\nfacilities,\nequipment, and\nmaterials\n\n--- PDF PAGE 75 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 71\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n2.3 according to industry\nstandards and creative\ndirection.\n2.4 Audio tracks are\nmastered and bounced\naccording to production\nrequirements.\n\nSafety protocols for\nFilm and Audiovisual\nIndustry productions as\napplicable\n2.4 DOH guidelines on\nsafety and health as\napplicable\n2.5 Applied computer\noperation and digital\nmedia literacy\n2.6 Applied knowledge of\ncomputer and\npostproduction systems\n2.7 File and data\nmanagement\nprocedures and\nprotocols\n2.8 Applied audio\npostproduction\ntechniques\n2.9 Applied sound theory\n2.10\nFundamental\nmixing techniques\n2.11\nFundamental\naudio mastering\ntechniques\n2.3 Maintaining clean\n2.4 and orderly\nworkplace/\nproduction\nenvironment\n2.5 Demonstrating\nmanual dexterity\n2.6 Executing work\ntasks in an efficient\nand orderly manner\n2.7 Producing creative\nand compelling\nwork and outputs\n\n3. Render and\nexport final\noutputs\n3.1 All final and full-\nresolution external\nassets are integrated\nand synched into an\nonline edit according\nto production\nrequirements.\n3.2 