entified\nworkplace\nchallenges\n4.4 Devising,\ncommunicating,\nimplementing\nand evaluating\nstrategies and\ntechniques in\naddressing\nspecific\nworkplace\nchallenges\n\n--- PDF PAGE 18 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 14\n RANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Parameters\nMay include:\n1.1 Processes\n1.2 Procedures\n1.3 Systems\n\n2. Analytical techniques\nMay include:\n2.1. Brainstorming\n2.2. Intuitions/Logic\n2.3. Cause and effect diagrams\n2.4. Pareto analysis\n2.5. SWOT analysis\n2.6. Gantt chart, PERT/CPM and graphs\n2.7. Scattergrams\n3. Problem\n\nMay include:\n3.1. Routine, non-routine and complex workplace and\nquality problems\n3.2. Equipment selection, availability and failure\n3.3. Teamwork and work allocation problem\n3.4. Safety and emergency situations and incidents\n3.5. Risk assessment and management\n4. Action plans\n\nMay include:\n4.1. Priority requirements\n4.2. Measurable objectives\n4.3. Resource requirements\n4.4. Timelines\n4.5. Coordination and feedback requirements\n4.6. Safety requirements\n4.7. Risk assessment\n4.8. Environmental requirements\n\n--- PDF PAGE 19 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 15\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nExamined specific workplace challenges\n1.2.\nAnalyzed the causes of specific workplace challenges\n1.3.\nFormulated resolutions to specific workplace challenges\n1.4.\nImplemented action plans and communicated results on\nspecific workplace challenges\n\n2. Resource\nImplications\n2.1 Assessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A bank\nof scenarios / case studies / what ifs will be required as well as\nbank of questions which will be used to probe the reason\nbehind the observable action.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Observation\n3.2 Case Formulation\n3.3 Life Narrative Inquiry\n3.4 Standardized Test\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of parts\nof this unit of competency. Simulation should be based on the\nactual workplace and will include walk through of the relevant\ncompetency components.\n\nThese assessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may have\nhappened.\n4. Context for\nAssessment\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 20 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 16\nUNIT OF COMPETENCY :\nWORK IN A DIVERSE ENVIRONMENT\n\nUNIT CODE\n : 400311322\n\nUNIT DESCRIPTOR\n :\nThis unit covers the outcomes required to work effectively in a\nworkplace characterized by diversity in terms of religions,\nbeliefs, races, ethnicities and other differences.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop an\nindividual’s\ncultural\nawareness\nand\nsensitivity\n 1.1 Individual\ndifferences with\nclients, customers\nand fellow workers\nare recognized\nand respected in\naccordance with\nenterprise policies\nand core values.\n 1.2 Differences are\nresponded to in a\nsensitive and\nconsiderate\nmanner\n1.3 Diversity is\naccommodated\nusing appropriate\nverbal and non-\nverbal\ncommunication.\n 1.1 Understanding\ncultural diversity in\nthe workplace\n1.2 Norms of behavior\nfor interacting and\ndialogue with\nspecific groups\n(e. g., Muslims and\nother non-\nChristians, non-\nCatholics,\ntribes/ethnic groups,\nforeigners)\n1.3 Different methods of\nverbal and non-\nverbal\ncommunication in a\nmulticultural setting\n1.1 Applying cross-\ncultural\ncommunication\nskills (i.e. different\nbusiness customs,\nbeliefs,\ncommunication\nstrategies)\n1.2 Showing affective\nskills – establishing\nrapport and\nempathy,\nunderstanding, etc.\n1.3 Demonstrating\nopenness and\nflexibility in\ncommunication\n1.4 Recognizing\ndiverse groups in\nthe workplace and\ncommunity as\ndefined by\ndivergent culture,\nreligion, traditions\nand practices\n\n--- PDF PAGE 21 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 17\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Work effectively\nin an\nenvironment\nthat\nacknowledges\nand values\ncultural diversity\n2.1 Knowledge, skills\nand experiences\nof others are\nrecognized and\ndocumented in\nrelation to team\nobjectives.\n2.2 Fellow workers are\nencouraged to\nutilize and share\ntheir specific\nqualities, skills or\nbackgrounds with\nother team\nmembers and\nclients to enhance\nwork outcomes.\n2.3 Relations with\ncustomers and\nclients are\nmaintained to\nshow that diversity\nis valued by the\nbusiness.\n 2.1 Value of diversity in\nthe economy and\nsociety in terms of\nworkforce\ndevelopment\n 2.2 Importance of\ninclusiveness in a\ndiverse\nenvironment\n 2.3 Shared vision and\nunderstanding of\nand commitment to\nteam,\ndepartmental, and\norganizational\ngoals and\nobjectives\n 2.4 Strategies for\ncustomer service\nexcellence\n2.1 Demonstrating cross-\ncultural\ncommunication skills\nand active listening\n2.2 Recognizing diverse\ngroups in the\nworkplace and\ncommunity as\ndefined by divergent\nculture, religion,\ntraditions and\npractices\n2.3 Demonstrating\ncollaboration skills\n2.4 Exhibiting customer\nservice excellence\n3. Identify\ncommon issues\nin a\nmulticultural\nand diverse\nenvironment\n3.1 Diversity-related\nconflicts within\nthe workplace are\neffectively\naddressed and\nresolved.\n3.2 Discriminatory\nbehaviors towards\ncustomers/\nstakeholders are\nminimized and\naddressed\naccordingly.\nChange management\npolicies are in\nplace within the\norganization.\n3.1 Value, and leverage\nof cultural diversity\n3.2 Inclusivity and\nconflict resolution\n3.3 Workplace\nharassment\n3.4 Change\nmanagement and\nways to overcome\nresistance to change\n3.5 Advanced strategies\nfor customer\nservice excellence\n3.1 Addressing\ndiversity-related\nconflicts in the\nworkplace\n3.2 Eliminating\ndiscriminatory\nbehavior towards\ncustomers and co-\nworkers\n3.3 Utilizing change\nmanagement\npolicies in the\nworkplace\n2.5\n\n--- PDF PAGE 22 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Diversity\nThis refers to diversity in both the workplace and the\ncommunity and may include divergence in:\n1.1\nReligion\n1.2\nEthnicity, race or nationality\n1.3\nCulture\n1.4\nGender, age or personality\n1.5\nEducational background\n2. Diversity-related conflicts\nMay include conflicts that result from:\n2.1\nDiscriminatory behaviors\n2.2\nDifferences of cultural practices\n2.3\nDifferences of belief and value systems\n2.4\nGender-based violence\n2.5\nWorkplace bullying\n2.6\nCorporate jealousy\n2.7\nLanguage barriers\n2.8\nIndividuals being differently abled persons\n2.9\nAgeism (negative attitude and behavior\ntowards old people)\n\nEVIDENCE GUIDE\n\n1. Critical\naspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nAdjusted language and behavior as required by interactions\nwith diversity\n1.2\nIdentified and respected individual differences in colleagues,\nclients and customers\n1.3\nApplied relevant regulations, standards and codes of practice\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Access to workplace and resources\n2.2 Manuals and policies on Workplace Diversity\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration or simulation with oral questioning\n3.2\nGroup discussions and interactive activities\n3.3\nCase studies/problems involving workplace diversity issues\n3.4\nThird-party report\n3.5\nWritten examination\n3.6\nRole Plays\n4. Context for\nAssessment\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n\n--- PDF PAGE 23 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 19\nUNIT OF COMPETENCY :\nPROPOSE METHODS OF APPLYING LEARNING AND\nINNOVATION IN THE ORGANIZATION\n\n UNIT CODE\n : 400311323\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required\nto assess general obstacles in the application of learning and\ninnovation in the organization and to propose practical\nmethods of such in addressing organizational challenges.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Assess work\nprocedures,\nprocesses and\nsystems in\nterms of\ninnovative\npractices\n1.1. Reasons for\ninnovation are\nincorporated\nto work\nprocedures.\n1.2. Models of\ninnovation are\nresearched.\n1.3. Gaps or barriers\nto innovation in\none’s work area\nare analyzed.\n1.4. Staff who can\nsupport and foster\ninnovation in the\nwork procedure\nare identified.\n\n1.1 Seven habits of\nhighly effective\npeople\n1.2 Character\nstrengths that\nfoster innovation\nand learning\n(Christopher\nPeterson and\nMartin Seligman,\n2004)\n1.3 Five minds of the\nfuture concepts\n(Gardner, 2007)\n1.4 Adaptation\nconcepts in\nneuroscience\n(Merzenich, 2013)\n1.5 Transtheoretical\nmodel of behavior\nchange\n(Prochaska,\nDiClemente, &\nNorcross, 1992)\n\n1.1 Demonstrating\ncollaboration and\nnetworking skills\n1.2 Applying basic\nresearch and\nevaluation skills\n1.3 Generating insights\non how to improve\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation\n\n--- PDF PAGE 24 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 20\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Generate\npractical\naction plans\nfor improving\nwork\nprocedures,\nprocesses\n2.1 Ideas for\ninnovative work\nprocedure to foster\ninnovation using\nindividual and\ngroup techniques\nare\nconceptualized.\n2.2 Range of ideas\nwith other team\nmembers and\ncolleagues are\nevaluated and\ndiscussed.\n2.3 Work procedures\nand processes\nsubject to change\nare selected based\non workplace\nrequirements\n(feasible and\ninnovative).\n2.4 Practical action\nplans are\nproposed to\nfacilitate simple\nchanges in the\nwork procedures,\nprocesses and\nsystems.\n2.5 Critical inquiry is\napplied and used\nto facilitate\ndiscourse on\nadjustments in the\nsimple work\nprocedures,\nprocesses and\nsystems.\n2.1 Seven habits of\nhighly effective\npeople\n2.2 Character\nstrengths that\nfoster innovation\nand learning\n(Christopher\nPeterson and\nMartin Seligman,\n2004)\n2.3 Five minds of the\nfuture concepts\n(Gardner, 2007)\n2.4 Adaptation\nconcepts in\nneuroscience\n(Merzenich, 2013)\n2.5 Transtheoretical\nmodel of behavior\nchange\n(Prochaska,\nDiClemente, &\nNorcross, 1992)\n2.1 Assessing readiness\nfor change on\nsimple work\nprocedures,\nprocesses and\nsystems\n2.2 Generating insights\non how to improve\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation\n2.3 Facilitating action\nplans on how to\napply innovative\nprocedures in the\norganization\n\n--- PDF PAGE 25 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 21\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Evaluate the\neffectiveness of\nthe proposed\naction plans\n3.1 Work structure is\nanalyzed to\nidentify the\nimpact of the\nnew work\nprocedures.\n3.2 Co-workers/key\npersonnel are\nconsulted to\nknow who will be\ninvolved with or\naffected by the\nwork procedure.\n3.3 Work instruction\noperational plan\nof the new work\nprocedure is\ndeveloped and\nevaluated.\n3.4 Feedback and\nsuggestion are\nrecorded.\n3.5 Operational plan\nis updated.\n3.6 Results and\nimpact on the\ndeveloped work\ninstructions are\nreviewed.\n3.7 Results of the\nnew work\nprocedure are\nevaluated.\n3.8 Adjustments are\nrecommended\nbased on results\ngathered.\n3.1 Five minds of the\nfuture concepts\n(Gardner, 2007)\n3.2 Adaptation\nconcepts in\nneuroscience\n(Merzenich, 2013)\n3.3 Transtheoretical\nmodel of behavior\nchange (Prochaska,\nDiClemente, &\nNorcross, 1992)\n3.1 Generating\ninsights on how to\nimprove\norganizational\nprocedures,\nprocesses and\nsystems through\ninnovation\n3.2 Facilitating action\nplans on how to\napply innovative\nprocedures in the\norganization\n3.3 Communicating\nresults of the\nevaluation of the\nproposed and\nimplemented\nchanges in the\nworkplace\nprocedures and\nsystems\n3.4 Developing action\nplans for\ncontinuous\nimprovement on\nthe basic systems,\nprocesses and\nprocedures in the\norganization\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Reasons\nMay include:\n1.1 Strengths and weaknesses of the current systems,\nprocesses and procedures\n1.2 Opportunities and threats of the current systems,\nprocesses and procedures\n\n--- PDF PAGE 26 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 22\n2. Models of innovation\nMay include:\n2.1 Seven habits of highly effective people\n2.2 Five minds of the future concepts (Gardner, 2007)\n2.3 Neuroplasticity and adaptation strategies\n3. Gaps or barriers\nMay include:\n3.1 Machine\n3.2 Manpower\n3.3 Methods\n3.4 Money\n4. Critical Inquiry\nMay include:\n4.1\nPreparation\n4.2\nDiscussion\n4.3\nClarification of goals\n4.4\nNegotiation tow