          "source_text": "1. Critical aspects of     \n   competency \nAssessment requires evidence that the candidate: \n1.1 Operated software and equipment effectively in the \npostproduction facility to create a postproduction output \n1.2 Managed the production of requirements of a client or \nproduction task creatively and efficiently \n1.3 Observed safety measures applicable to worksite operation \n1.4 Communicated effectively with others to ensure effective work \noperation \n2. Resource implications \nThe following resources should be provided:  \n2.1 Computer system  \n2.1.1 Postproduction software (e.g. Premiere, Final Cut Pro,  \n      Vegas, etc.) \n2.1.2 Image editing software (e.g. Adobe Photoshop) \n2.1.3 Audio production software (e.g. ProTools, LogicPro,  \n      Ableton, Audacity) \n2.1.4 Production peripherals (e.g. microphones, monitors, \ndrawing tablets, mixers, and the like) \n2.2 Workplace location \n2.3 Materials relevant to the unit of competency \n3. Methods of \nassessment \nCompetency in this unit must be assessed through: \n3.1 Demonstration with oral questioning \n3.2 Portfolio of works with interview for those with minimum 3 \nyears’ relevant industry experience \n4. Context of assessment \n4.1 Competency may be assessed in actual workplace or at the  \n        designated TESDA Accredited Assessment Center.",
