        "source_text": "--- PDF PAGE 7 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321       Promulgated (11/05/2021)                        3 \nSECTION 2 COMPETENCY STANDARDS \n \nThis section gives the details and contents of the units of competency required in FILM \nAND VIDEO POSTPRODUCTION NC III. These units of competency are categorized into \nbasic, common and core competencies. \n \n \n \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY   :  LEAD WORKPLACE COMMUNICATION \n \nUNIT CODE \n      :   400311319 \n \nUNIT DESCRIPTOR          :  This unit covers the knowledge, skills and attitudes required to \nlead in the effective dissemination and discussion of ideas, \ninformation, and issues in the workplace. This includes \npreparation of written communication materials. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Communicate \ninformation \nabout \nworkplace \nprocesses \n 1.1 Relevant communication \nmethod is selected based \non workplace procedures   \n 1.2 Multiple operations \ninvolving several \ntopics/areas are \ncommunicated following \nenterprise requirements  \n 1.3 Questioning is applied to \ngain extra information \n 1.4 Relevant sources of \ninformation are identified \nin accordance with \nworkplace/ client \nrequirements \n 1.5 Information is selected and \norganized following \nenterprise procedures \n 1.6 Verbal and written \nreporting is undertaken \nwhen required \n 1.7 Communication and \nnegotiation skills are \napplied and maintained in \nall relevant situations \n1.1.  Organization \nrequirements \nfor written and \nelectronic \ncommunication \nmethods \n1.2. Effective \nverbal \ncommunication \nmethods \n1.3. Business \nwriting \n1.4. Workplace \netiquette \n1.1  Organizing information \n1.2  Conveying intended \nmeaning \n1.3 Participating in a \nvariety of workplace \ndiscussions \n1.4 Complying  with \norganization  \nrequirements for the \nuse of written and \nelectronic \ncommunication \nmethods \n1.5 Effective business \nwriting \n1.6 Effective clarifying and \nprobing skills \n1.7 Effective questioning \ntechniques (clarifying \nand probing) \n \n \n2. Lead \nworkplace \ndiscussions \n 2.1 Response to workplace \nissues are sought \nfollowing enterprise \nprocedures  \n 2.2 Response to workplace \nissues are provided \nimmediately  \n 2.3 Constructive contributions \n2.1 Organization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n2.2 Effective verbal  \ncommunication  \n2.1 Organizing information \n2.2  Conveying intended \nmeaning \n2.3 Participating in variety \nof workplace \ndiscussions \n2.4 Complying with \norganization\n\n--- PDF PAGE 8 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               4 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nare made to workplace \ndiscussions on such \nissues as production, \nquality and safety \n 2.4 Goals/ objectives and \naction plans undertaken \nin the workplace are \ncommunicated promptly  \nmethods \n2.3 Workplace \netiquette \nrequirements for the \nuse of written and \nelectronic \ncommunication \nmethods \n2.5 Effective clarifying and \nprobing skills \n \n3. Identify and \ncommunicate \nissues arising \nin the \nworkplace \n 3.1 Issues and problems are \nidentified as they arise \n 3.2 Information regarding \nproblems and issues are \norganized coherently to \nensure clear and effective \ncommunication \n 3.3 Dialogue is initiated with \nappropriate personnel \n 3.4 Communication problems \nand issues are raised as \nthey arise \n 3.5 Identify barriers in \ncommunication to be \naddressed appropriately \n \n \n \n \n3.1 Organization \nrequirements for \nwritten and \nelectronic \ncommunication \nmethods \n3.2 Effective verbal \ncommunication \nmethods \n3.3 Workplace \netiquette \n3.4 Communication \nproblems and \nissues \n3.5 Barriers in \ncommunication   \n \n3.1 Organizing information \n3.2 Conveying intended \nmeaning \n3.3 Participating in a variety \nworkplace discussions \n3.4 Complying with \norganization \nrequirements for the \nuse of written and \nelectronic \ncommunication \nmethods \n3.5 Effective clarifying and \nprobing skills \n3.6 Identifying issues \n3.7 Negotiation and \ncommunication skills \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Methods of communication \nMay include but not limited to: \n1.1. Non-verbal gestures \n1.2. Verbal \n1.3. Face-to-face \n1.4. Two-way radio \n1.5. Speaking to groups \n1.6. Using telephone \n1.7. Written \n1.8. Internet \n \n2. Workplace discussions \nMay include but not limited to: \n2.1. Coordination meetings \n2.2. Toolbox discussion \n2.3. Peer-to-peer discussion\n\n--- PDF PAGE 9 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               5 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1    Dealt with a range of communication/information at one \ntime \n1.2    Demonstrated leadership skills in workplace \ncommunication   \n1.3   Made constructive contributions in workplace issues \n1.4   Sought workplace issues effectively \n1.5   Responded to workplace issues promptly \n1.6   Presented information clearly and effectively written form \n1.7   Used appropriate sources of information \n1.8   Asked appropriate questions \n1.9   Provided accurate information  \n2. Resource \nImplications \nThe following resources should be provided: \n2.1    Variety of Information \n2.2    Communication tools \n2.3    Simulated workplace \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through:     \nCase problem \n3.1. Third-party report \n3.2. Portfolio \n3.3. Interview \n3.4. Demonstration/Role-playing \n4. Context  for \nAssessment