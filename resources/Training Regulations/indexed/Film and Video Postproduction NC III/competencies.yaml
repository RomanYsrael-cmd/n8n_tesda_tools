op creative skills in art\npractice\n1.2. Developed artistic skills and ideas\n1.3. Generated studies on arts and culture\n\n2. Resource\nimplications\nThe following resources should be provided:\n2.1. Specialized materials, tools and equipment required for\neach area of specialization and used to develop\ntechnical and conceptual skills relevant to art making\npractice\n2.2. Information about relevant artist, their work, ideas and\ntechniques\n3. Method of\nassessment\n\nCompetency must be assessed through:\n3.1. Demonstration / Observation with oral questioning\n3.2. Portfolio with interview\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 47 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 43\nUNIT TITLE\n:\nOBSERVE PROCEDURES, SPECIFICATIONS AND MANUALS\nOF INSTRUCTIONS\n\nUNIT CODE\n:\nCRE265203\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes on identifying,\ninterpreting, applying services to specifications and manuals and\nstoring manuals.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify and\naccess\nspecification/\nmanuals\n\n1.1 Manuals are identified and\naccessed as per job\nrequirements.\n1.2 Version and date of\nmanual are checked to\nensure that correct\nspecification and\nprocedures are identified.\n1.1 Types of\nmanuals used\nin scriptwriting\n1.2 Identification of\nsymbols used in\nthe manuals\n1.1 Identifying\nmanuals and\nspecifications\n1.2 Accessing\ninformation and\ndata\n2. Interpret\nmanuals\n2.1 Relevant sections,\nchapters of specifications/\nmanuals are located in\nrelation to the work to be\nconducted.\n2.2 Information and procedure\nin the manual are\ninterpreted in accordance\nwith industry practices.\n\n2.1 Types of\nmanuals\n2.2 Types of\nsymbols used in\nmanuals\n2.3 Systems o