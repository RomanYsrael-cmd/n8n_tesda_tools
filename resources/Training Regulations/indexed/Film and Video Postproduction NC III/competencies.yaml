        "source_text": "CRE265202\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\nexhibit professional practice covering the development of\nconceptual, creative and artistic capabilities and the broadening of\ncultural awareness.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Acquire and\ndevelop\ncreative\nthinking\n\n1.1. Concepts and ideas are\nidentified and explored to\nensure the development of\nthe creative process\n1.2. Sources of creative thinking\nare explored and scanned\nfrom the environment\n1.3. Relevant printed reading\nmaterials and other media\nare used to stimulate\ncreative ideation\n1.4. Feedback, interaction,\ndiscussion and evaluation\nopportunities to\ncontinuously improve\ncreative thinking are used.\n\n1.1. Exposure to\ncreative thinking\ntheories, exercises\nand techniques\n1.2. Theoretical and\nhistorical contexts\nrelevant to the\narea(s) of\nspecialization(s)\n1.3. Awareness of\ncopyright, moral\nrights and\nintellectual property\nissues related to\nthe development of\nself as artist\n1.1. Communication\nskills\n1.2. Literacy skills\nsufficient to\ninterpret\ninformation and\ncommunicate\nideas\n1.3. Convergent\nthinking\n1.4. Divergent\nthinking\n1.5. Collaboration\nand brain\nstorming\n1.6. Integrated\nthinking\n1.7. Critical thinking\n2. Develop\nartistic skills\n2.1. Strategies, methods and\napproaches are identified\nand explored in developing\nthe artistic work.\n2.2. Artistic work is reviewed,\nevaluated and finalized\nbased on applicable and\naccepted standards of the\nfield.\n2.3. Relevant printed reading\nmaterials and other media\nare used to stimulate artistic\nand professional\ndevelopment.\n2.4. Capabilities of materials,\ntools and equipment are\nexplored to enable artistic\noutputs.\n2.5. Feedback, critique,\ndiscussion and evaluation\nmechanisms are\ncontinuously applied to\nimprove artistic skills.\n2.1. Theoretical and\nhistorical contexts\nrelevant to the\narea(s) of\nspecialization(s)\n2.2. Elements of arts\n2.3. Principles of\ncomposition\n2.4. Physical properties\nand capabilities of\nmaterial, tools and\nequipment and\ntheir application\n2.5. Awareness of\nsocio-cultural and\nintellectual\nproperty issues\nrelated to the\ndevelopment of\nself as artist\n2.6. Creative thinking\ntheories, exercises\nand techniques\n2.1. Literacy skills\nsufficient to\ninterpret\ninformation and\ncommunicate\nideas\n2.2. Communication\nskills\n2.3. Basic artistic/\nvisual\n2.3.1. Drawing/\nIllustration\n2.3.2. Coloring\n2.3.3. Body\nmovements\n2.3.4. Words/text/\n2.3.5. Graphics\n2.3.6. Sound\n\n--- PDF PAGE 45 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 41\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2.6. Work experiences and\nideas are discussed to\nimprove own practice.\n2.7. Other artistic works are\nstudied to stimulate the\ndevelopment of conceptual\nand artistic skills.\n\n3. Broaden\nexposure to\nculture and\narts\n3.1. Studies on arts and\nculture are generated\nbased on required learning\nobjectives.\n3.2. Cultural immersion\nopportunities that may be\nhelpful in developing career\nopportunities are\nexperienced.\n3.3. Insights and experiences on\narts and culture are shared,\ndiscussed and reflected\nupon.\n3.1. Theoretical and\nhistorical contexts\nrelevant to the\narea(s) of\nspecialization(s)\n3.2. Elements of arts\n3.3. Principles of\ncomposition\n3.4. Physical properties\nand capabilities of\nmaterial, tools and\nequipment and\ntheir application\n3.5. Awareness of\nsocio-cultural and\nintellectual\nproperty issues\nrelated to the\ndevelopment of\nself as artist\n3.6. Creative thinking\ntheories, exercises\nand techniques\n\n3.1. Literacy skills\nsufficient to\ninterpret\ninformation and\ncommunicate\nideas\n3.2. Basic\