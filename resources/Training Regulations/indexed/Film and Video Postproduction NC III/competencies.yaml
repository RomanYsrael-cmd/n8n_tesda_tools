        "source_text": "400311325\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to interpret Occupational Safety and Health\npractices, set OSH work targets, and evaluate\neffectiveness of Occupational Safety and Health work\ninstructions\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Interpret\nOccupational\nSafety and\nHealth practices\n\n1.1 OSH work practices\nissues are identified\nrelevant to work\nrequirements.\n1.2 OSH work standards and\nprocedures are\ndetermined based on\napplicability to nature of\nwork.\n1.3 Gaps in work practices\nare identified related to\nrelevant OSH work\nstandards.\n\n1.1. OSH work\npractices issues\n1.2. OSH work\nstandards\n1.3. General OSH\nprinciples and\nlegislations\n1.4. Company/\nworkplace policies/\nguidelines\n1.5. Standards and\nsafety\nrequirements of\nwork process and\nprocedures\n1.1. Communication\nskills\n1.2. Interpersonal\nskills\n1.3. Critical thinking\nskills\n1.4. Observation\nskills\n2. Set OSH work\ntargets\n\n2.1 Relevant work\ninformation are gathered\nnecessary to determine\nOSH work targets.\n2.2 OSH indicators based\non gathered information\nare agreed upon to\nmeasure effectiveness of\nworkplace OSH policies\nand procedures.\n2.3 Agreed OSH indicators\nare endorsed for\napproval from\nappropriate personnel.\n2.4 OSH work instructions\nare received in\naccordance with\nworkplace policies and\nprocedures.\n\n2.1. OSH work targets\n2.2. OSH indicators\n2.3. OSH work\ninstructions\n2.4. Safety and health\nrequirements of\ntasks\n2.5. Workplace\nguidelines on\nproviding\nfeedback on OSH\nand security\nconcerns\n2.6. OSH regulations\nHazard control\nprocedures\n2.7. OSH trainings\nrelevant to work\n2.1. Communication\nskills\n2.2. Collaborating\nskills\n2.3. Critical thinking\nskills\n2.4. Observation\nskills\n\n--- PDF PAGE 33 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 29\n3. Evaluate\neffectiveness of\nOccupational\nSafety and\nHealth work\ninstructions\n\n 3.1 OSH Practices are\nobserved based on\nworkplace standards\n 3.2 Observed OSH\npractices are measured\nagainst approved OSH\nmetrics\n 3.3 Findings regarding\neffectiveness are\nassessed and gaps\nidentified are\nimplemented based on\nOSH work standards\n3.1. OSH Practices\n3.2. OSH metrics\n3.3. OSH Evaluation\nTechniques\n3.4. OSH work\nstandards\n3.1. Critical thinking\nskills\n3.2. Evaluating skills\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Work\nPractices Issues\nMay include:\n1.1 Workers’ experience/observance on presence of work\nhazards\n1.2 Unsafe/unhealthy administrative arrangements (prolonged\nwork hours, no breaktime, constant overtime, scheduling of\ntasks)\n1.3 Reasons for compliance/non-compliance to use of\npersonal protective equipment (PPE) or other OSH\nprocedures/policies/guidelines\n2. OSH Indicators\nMay include:\n2.1 Increased of incidents of accidents, injuries\n2.2 Increased occurrence of sickness or health complaints/\nsymptoms\n2.3 Common complaints of workers related to OSH\n2.4 High absenteeism for work-related reasons\n3. OSH Work\nInstructions\nMay include:\n3.1 Preventive and control measures, and targets\n3.2 Eliminate the hazard (i.e., get rid of the dangerous\nmachine\n3.3 Isolate the hazard (i.e. keep the machine in a closed room\nand operate it remotely; barricade an unsafe area off)\n3.4 Substitute the hazard with a safer alternative (i.e., replace\nthe machine with a safer one)\n3.5 Use administrative controls to reduce the risk (i.e. give\ntrainings on how to use equipment safely; OSH-related\ntopics, issue warning signages, rotation/shifting work\nschedule)\n3.6 Use engineering controls to reduce the risk (i.e. use safety\nguards to machine)\n3.7 Use personal protective equipment (PPE)\n3.8 Safety, Health and Work Environment Evaluation\n3.9 Periodic and/or special medical examinations of workers\n4. OSH Metrics\nMay include:\n4.1 Statistics on incidence of accidence and injuries\n4.2 Morbidity (Type and Number of Sickness)\n\n--- PDF PAGE 34 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 30\n4.3 Mortality (Cause and Number of Deaths)\n4.4 Accident Rate\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1. Identify OSH work practices issues relevant to work\nrequirements\n1.2. Identify gaps in work practices related to relevant\nOSH work standards\n1.3. Agree upon OSH Indicators based on gathered\ninformation to measure effectiveness of workplace\nOSH policies and procedures\n1.4. Receive OSH work instructions in accordance with\nworkplace policies and procedures\n1.5. Compare Observed OSH practices with against\napproved OSH work instructions\n1.6. Assess findings regarding effectiveness based on\nOSH work standards\n2. Resource Implications\nThe following resources should be provided:\n2.1 Facilities, materials, tools and equipment necessary\nfor the activity\n3. Methods of Assessment Competency in this unit may be assessed through:\n3.1 Observation/Demonstration with oral questioning\n3.2 Third party report\n3.3 Written exam\n\n4. Context for Assessment\n4.1 Competency may be assessed in the workplace or\nin a simulated workplace setting\n\n--- PDF PAGE 35 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 31\n\nUNIT OF COMPETENCY\n: EVALUATE ENVIRONMENTAL WORK\nPRACTICES\n\nUNIT CODE\n:"
