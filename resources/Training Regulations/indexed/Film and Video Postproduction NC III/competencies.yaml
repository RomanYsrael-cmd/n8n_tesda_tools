        "source_text": "--- PDF PAGE 74 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               70 \n \nUNIT OF COMPETENCY: \nWRAP UP POSTPRODUCTION  \n \nUNIT CODE                     : \n CRE343308 \n \nUNIT DESCRIPTOR        : \nThis unit covers the knowledge, skills and attitudes required to \nfinalize and complete the postproduction (editing) phase to \nachieve the creative and/or technical requirements for a variety \nof film and video projects and productions based on the \nrequired Performance Standards. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Manage client \nrevisions and \ninputs \n1.1 An offline edit is \nproduced and \npreviewed by client \naccording to production \nrequirements. \n1.2 Presentation skills are \nused to communicate \ncreative and technical \ndecisions in the edit \nmade by the editor in \nline with production \nrequirements and \ncreative direction. \n1.3 Client’s revisions and \ninputs are addressed \nand incorporated into \nthe edit according to \nthe agreements \nbetween client and \nproduction team. \n   \n1.1 Company rules, \nregulations, and \nstandards regarding \nclients and client \nrelations \n1.2 Basic interpersonal \ncommunication and \nculturally and gender \nsensitive behavior  \n1.3 Basic production \nterminology, processes, \nworkflows, and \nprotocols \n1.4 Fundamental \nknowledge on laws and \npolicies as applicable \n1.4.1 MTRCB \n1.4.2 PANA, 4As \n1.4.3 KBP, Media \nCode \n1.4.4 Business laws \n1.4.5 Intellectual \nProperty Code \n1.5 Common and \ncontemporary output \npostproduction formats \nand containers \n1.1 Communicating \neffectively with: \na. Verbal skills \nb. Non-verbal \nskills \n1.2 Applying effective \ntime management \n1.3 Practicing \nprofessional \nworkplace \ninteraction and \netiquette  \n1.4 Communicating \nideas and \ninformation to \nothers \na. Written \nb. Verbal  \n1.5 Planning and \norganizing activities \nand work tasks \n1.6 Conducting one’s \nself with cultural \nand gender \nsensitivity \n \n \n2. Mix-down and \nmaster audio \n2.1 Audio busses are used \nto organize channels \naccording to workflow \nprotocols and \nproduction \nrequirements. \n2.2 Levels and sound \nproperties of tracks are \nadjusted using different \naudio plugins  \n2.1 Company rules and \nregulations, standards, \nand operating \nprocedures regarding \npostproduction facilities  \n2.2 DOLE DO 198s2018 \npolicies on OSH as \napplicable \n2.3 Inter-Guild Alliance \n(IGA) 2020 Health and \n2.1 Operating computer \nsystems with media \nand digital literacy \nskills \n2.2 Handling and \noperating \npostproduction \nfacilities, \nequipment, and \nmaterials\n\n--- PDF PAGE 75 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               71 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \n2.3 according to industry \nstandards and creative \ndirection. \n2.4 Audio tracks are \nmastered and bounced \naccording to production \nrequirements. \n \nSafety protocols for  \nFilm and Audiovisual \nIndustry productions as \napplicable \n2.4  DOH guidelines on \nsafety and health as \napplicable \n2.5 Applied computer \noperation and digital \nmedia literacy \n2.6 Applied knowledge of \ncomputer and \npostproduction systems \n2.7 File and data \nmanagement \nprocedures and \nprotocols \n2.8 Applied audio \npostproduction \ntechniques \n2.9 Applied sound theory \n2.10 \nFundamental \nmixing techniques \n2.11 \nFundamental \naudio mastering \ntechniques \n2.3 Maintaining clean  \n2.4 and orderly \nworkplace/ \nproduction \nenvironment \n2.5 Demonstrating \nmanual dexterity \n2.6 Executing work \ntasks in an efficient \nand orderly manner \n2.7 Producing creative \nand compelling \nwork and outputs  \n \n3. Render and \nexport final \noutputs \n3.1 All final and full-\nresolution external \nassets are integrated \nand synched into an \nonline edit according \nto production \nrequirements. \n3.2 Subtitles and metadata \nare produced, finalized, \nand integrated using \nappropriate encoding \nsoftware. \n3.3 The online edit timeline \nis rendered, mastered, \nand exported for \ndistribution or \nscreening according to \nclient’s needs or \nproduction \nrequirements. \n3.4 Final output is subject \nto visual and auditory \nreview and quality \n3.1 Company rules and \nregulations, standards, \nand operating \nprocedures regarding \npostproduction \nfacilities  \n3.2 DOLE DO 198s2018 \npolicies on OSH as \napplicable \n3.3 Inter-Guild Alliance \n(IGA) 2020 Health and \nSafety protocols for \nFilm and Audiovisual \nIndustry productions as \napplicable \n3.4  DOH guidelines on \nsafety and health as \napplicable \n3.5 Applied computer \noperation and digital \nmedia literacy \n3.6 Basic knowledge of \ncomputer and \npostproduction \n3.1 Operating \ncomputer systems \nwith media and \ndigital literacy skills \n3.2 Handling and \noperating \npostproduction \nfacilities, \nequipment, and \nmaterials \n3.3 Maintaining clean \nand orderly \nworkplace/ \nproduction \nenvironment \n3.4 Demonstrating \nmanual dexterity \n3.5 Executing work \ntasks in an efficient \nand orderly manner \n3.6 Producing work \noutputs that are up \nto technical and \nartistic standards\n\n--- PDF PAGE 76 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               72 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \ncontrol along company \nand industry standards  \non quality. \nsystems \n3.7 Postproduction system  \nconfigurations, \npatching, and layout \nbased on \nmanufacturer’s and/or \ncompany specifications \n3.8 Common and \ncontemporary output \npostproduction file \nformats and containers \n3.9 File and data \nmanagement \nprocedures and \nprotocols \n3.10 \nRelevant technical \nstandards as \napplicable: \n3.10.1 KBP \n3.10.2 Broadcast \nNetworks (e.g. \nGMA) \n3.10.3 Online Media \n(e.g. YouTube, \nVimeo, Twitch) \n3.10.4 MTRCB \n3.10.5 PANA, 4As \n3.10.6 SMPTE \n3.11 \nFundamental \nknowledge on laws \nand policies as \napplicable \n3.11.1 MTRCB \n3.11.2 PANA, 4As \n3.11.3 KBP, Media \nCode \n3.11.4 Business laws \n3.11.5 Intellectual \nProperty Code \n \n \n4. Close-out \npostproduction \ncycle \n4.1 The exported project is \nplayed back to ensure \nworking condition and \ncompatibility on an \nindependent \nplayback system. \n4.2 Final output is turned \nover to the Client using \ncompany protocols and \nprocedures for delivery \nand billing. \n4.1 Company rules and \nregulations, standards, \nand operating \nprocedures regarding \npostproduction facilities \n4.2 Company rules, \nregulations, and \nstandards regarding \nclients and client \nrelations \n4.3 Basic interpersonal \n4.1 Communicating \neffectively with: \na. Verbal skills \nb. Non-verbal \nskills \n4.2 Applying effective \ntime management \n4.3 Practicing \nprofessional \nworkplace \ninteraction and\n\n--- PDF PAGE 77 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               73 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.3 Postproduction \nsystems and \nperipherals are \npowered down, \nsecured, and stored \naccording to company \npolicy or instructions. \n4.4 A postmortem is \nconducted to evaluate \nthe project and work \nexperience according \nto workplace policies \nand procedures for \nproject evaluation. \n \ncommunication and \nculturally and gender \nsensitive behavior  \n4.4 Basic production \nterminology, \nprocesses, workflows, \nand protocols \n4.5 Fundamental \nknowledge on laws and \npolicies as applicable \n4.5.1 MTRCB \n4.5.2 PANA, 4As \n4.5.3 KBP, Media \nCode \n4.5.4 Business laws \n4.5.5 Intellectual \nProperty Code \n4.6 DOLE DO 198s2018 \npolicies on OSH as \napplicable \n4.7 Inter-Guild Alliance \n(IGA) 2020 Health and \nSafety protocols for \nFilm and Audiovisual \nIndustry productions as \napplicable \n4.8 DOH guidelines on \nsafety and health as \napplicable  \n4.9 Fundamental \nenvironmental \nawareness and \nconservation \n \netiquette  \n4.4 Communicating \nideas and \ninformation to \nothers \na. Written \nb. Verbal  \n4.5 Planning and \norganizing activities \nand work tasks \n4.6 Observing proper \nOSH procedures as \napplicable \n4.7 Maintaining an \necologically friendly \nworking practice \nand environment\n\n--- PDF PAGE 78 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               74 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Revisions and Inputs \nMay include: \n1.1 sequencing or order \n1.2 data or information accuracy \n1.3 spelling or other minor mistakes \n1.4 color, effect, transition, or edit assembly \n1.5 score, sound effects, or other audio concern \n1.6 duration, pace, or rhythm \n2. External Assets \nMay include: \n2.1 Audio files and tracks \n2.2 Animations and computer-generated imagery \n2.3 Graphics and images \n2.4 Color-graded footage  \n3. Metadata \nMay include: \n3.1 Producer/ client/ ownership information \n3.2 Technical data and information (e.g. resolution, \nbitrate, camera data, etc.) \n3.3 Subtitle file and language information \n3.4 Geographic information \n3.5 Internet search tags and keywords \n4. Exporting \nMay include: \n4.1 Data files (AVI, MOV, MP4, etc.) \n4.2 DVD or Blu-Ray Discs \n4.3 Uploads to social media or streaming service/s \n(e.g. YouTube, Vimeo) \n4.4 Encoding onto DCP (Digital Cinema Package) for \ncommercial screening \n5. Independent playback system \nMay include: \n5.1 Non-networked computer or laptop \n5.2 Computer system other than editing system or \npostproduction system \n5.3 Portable or mobile device \n5.4 Projection or screening room \n5.5 TV, DVD, or Blu-Ray player\n\n--- PDF PAGE 79 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               75 \nEVIDENCE GUIDE \n \n1. Critical aspects of     \n   competency \nAssessment requires evidence that the candidate: \n1.1 Operated software and equipment effectively in the \npostproduction facility to create a postproduction output \n1.2 Managed the production of requirements of a client or \nproduction task creatively and efficiently \n1.3 Observed safety measures applicable to worksite operation \n1.4 Communicated effectively with others to ensure effective work \noperation \n2. Resource implications \nThe following resources should be provided:  \n2.1 Computer system  \n2.1.1 Postproduction software (e.g. Premiere, Final Cut Pro,  \n      Vegas, etc.) \n2.1.2 Image editing software (e.g. Adobe Photoshop) \n2.1.3 Audio production software (e.g. ProTools, LogicPro,  \n      Ableton, Audacity) \n2.1.4 Production peripherals (e.g. microphones, monitors, \ndrawing tablets, mixers, and the like) \n2.2 Workplace location \n2.3 Materials relevant to the unit of competency \n3. Methods of \nassessment \nCompetency in this unit must be assessed through: \n3.1 Demonstration with oral questioning \n3.2 Portfolio of works with interview for those with minimum 3 \nyears’ relevant industry experience \n4. Context of assessment \n4.1 Competency may be assessed in actual workplace or at the  \n        designated TESDA Accredited Assessment Center.\n",
