nstructor, trainer, teacher, or TVI coordinator\n5. Client Meetings\nMay include:\n5.1 Treatment and Concept consultations.\n5.2 Definition of working guidelines to client for\nunderstanding and agreement purposes.\n5.3 Project briefings for client and team members.\n5.4 Presentations to Client any drafts or works in\nprogress for preview or approval\n5.5 Updates to Client regarding timeline or status of\nproject execution.\n5.6 Negotiations regarding services, fees, and\ncontracts\n5.7 Other activities, engagements, discussions, and\ncoordination between the Production Team and\nthe Client.\n\n--- PDF PAGE 62 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 58\n6. File format and/ or container\nFormats may include:\n6.1 Standard, High definition, or 4K\n6.2 H.264, H265, or other CODECs\n6.3 Compressed or Uncompressed\n6.4 WAV, MP3, or AIFF audio\nContainers may include:\n6.5 Video: MOV, AVI, MP4, WMV\n6.6 Audio: WAV, AIFF, AAC, MP3\n6.7 Graphics: PSD, JPG, PNG, TIFF\n7. Postproduction Resources\nMay include:\n7.1 Edit logs and shot lists\n7.2 Library materials and lists\n7.3 Stock visuals, graphics, and sound effects\n7.4 Scripts\n7.5 Guides and manuals\n7.6 Sound reports\n7.7 Camera logs\n8. Postproduction System\nMay include:\n8.1 Computer workstation used for postproduction\n8.2 Software or applications used in postproduction\n8.3 Peripherals, devices, or accessories added onto a\nprimary system\n9. Peripherals\nMay include:\n9.1 Portable and fixed storage (e.g. hard drives, flash\nstorage, solid state drives (SSDs))\n9.2 Control and input systems (e.g. mouse, tablet,\ncontrol panel, mixers, drawing tablets)\n9.3 Monitoring devices (e.g. headphones, video\nreference monitors, studio monitors)\n10. Postproduction Materials\nMay include:\n10.1 Project footage\n10.2 Scores, music, and sound effects\n10.3 Graphics and other visual material\n10.4 Reference pegs and materials\n11. Good Signal Flows\nMay include:\n11.1 Clarity and/or level