        "source_title": "CREATE ENHANCED EDITS AND MATERIALS FOR POSTPRODUCTION",
        "source_text": "--- PDF PAGE 69 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               65 \n \nUNIT OF COMPETENCY: \nCREATE ENHANCED EDITS AND MATERIALS FOR \nPOSTPRODUCTION \n \nUNIT CODE                     : \n CRE343307 \n \nUNIT DESCRIPTOR        : \nThis unit covers the knowledge, skills and attitudes required to \nproduce specialized materials and resources, or likewise \nenhance preliminary edits, materials, and resources to achieve \nthe creative and/or technical requirements for a variety of film \nand video projects and productions based on the required \nPerformance Standards. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Construct \ncomplex edited \nsequences \n1.1 Editing techniques are \nused to enhance or \ncreate tension, mood, \nand emotion according \nto production \nrequirements or \ncreative direction. \n1.2 Footage and \nSequences are \ntrimmed down to the \nRunning Time \nprescribed by \nproduction \nrequirements or \ncreative direction. \n1.3 Various assets and \nfootage are integrated \ninto a timeline to \ncreate a cohesive and \neffective project \naccording to \nproduction \nrequirements or \ncreative direction. \n \n1.1 Company rules and \nregulations, standards, \nand operating \nprocedures regarding \npostproduction \nfacilities  \n1.2 DOLE DO 198s2018 \npolicies on OSH as \napplicable \n1.3 Inter-Guild Alliance \n(IGA) 2020 Health and \nSafety protocols for \nFilm and Audiovisual \nIndustry productions as \napplicable \n1.4  DOH guidelines on \nsafety and health as \napplicable \n1.5 Applied computer \noperation and digital \nmedia literacy \n1.6 Applied knowledge of \ncomputer and \npostproduction \nsystems \n1.7 File and data \nmanagement \nprocedures and \nprotocols \n1.8 Applied film and media \nediting theory \n1.9 Complex editing \ntechniques as applied \nto films and other \nmedia products \n1.10 \nEthical \n1.1 Operating \ncomputer systems \nwith media and \ndigital literacy \nskills \n1.2 Handling and \noperating \npostproduction \nfacilities, \nequipment, and \nmaterials \n1.3 Maintaining clean \nand orderly \nworkplace/ \nproduction \nenvironment \n1.4 Demonstrating \nmanual dexterity \n1.5 Executing work \ntasks in an \nefficient and \norderly manner \n1.6 Producing creative \nand compelling \nwork and outputs\n\n--- PDF PAGE 70 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               66 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \npostproduction \npractices \n \n2. Grade colors \non a project \n2.1 Colors and footage are \ncorrected and \nenhanced according to \nproduction \nrequirements. \n2.2 A visual look is \ndesigned utilizing a \ncolor palette.  \n2.3 Footage and assets on \nthe edit timeline are \ncolor graded according \nto the approved color \npalette. \n \n2.1 Company rules and \nregulations, standards, \nand operating \nprocedures regarding \npostproduction \nfacilities  \n2.2 DOLE DO 198s2018 \npolicies on OSH as \napplicable \n2.3 Inter-Guild Alliance \n(IGA) 2020 Health and \nSafety protocols for \nFilm and Audiovisual \nIndustry productions as \napplicable \n2.4  DOH guidelines on \nsafety and health as \napplicable \n2.5 Applied computer \noperation and digital \nmedia literacy \n2.6 Applied knowledge of \ncomputer and \npostproduction \nsystems \n2.7 Principles of art and \ndesign \n2.8 Color theory \n2.9 Color theory as applied \nto films and other \nmedia products \n \n2.1 Operating \ncomputer systems \nwith media and \ndigital literacy skills \n2.2 Handling and \noperating \npostproduction \nfacilities, \nequipment, and \nmaterials \n2.3 Maintaining clean \nand orderly \nworkplace/ \nproduction \nenvironment \n2.4 Demonstrating \nmanual dexterity \n2.5 