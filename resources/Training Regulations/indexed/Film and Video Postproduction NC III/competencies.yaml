cedures\n2.2. Common and accepted practices in the industry\n3. Interpersonal\nskills\nMay include:\n3.1. Interactive communication\n3.2. Public relation\n3.3. Good working attitude\n3.4. Sincerity\n3.5. Pleasant disposition\n3.6. Effective communication skills\n3.7. Team player\n\n--- PDF PAGE 57 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 53\n4. Presentation\nskills\nMay include:\n4.1.\nVisible work area\n4.2.\nPortfolio\n4.3.\nProject proposal\n5. Client\nrequirements\nMay include:\n5.1. Client Needs Analysis\n5.2. Scope to modify instructions/orders in light of changed\n5.3. Situations\n5.4. Project brief\n5.5. Project script\n5.6. Treatment and concept\n5.7. Discussion with the client/customer\n5.8. Timeline\n6. Feedback\nmechanism\nMay include:\n6.1. Communication devices\n6.1.1. Telephone\n6.1.2. Mobile phone\n6.1.3. Fax machine\n6.1.4. Online correspondence\n6.2. Social media analytics\n6.3. Contact reports\n6.4. Focus Group Discussion\n6.5. Evaluation and Critiques\n6.6. Punch List\n7. Working\nGuidelines and\nProcedures\nMay include:\n7.1 Work order/ job order\n7.2 Services contract or production agreement\n7.3 Work plans and contingencies\n7.4 Production timetables, schedules, and/or processes\n7.5 Workflows and protocols\n7.6 Deliverables and outputs\n7.7 Non-disclosure agreements and similar agreements\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1. Maintained a professional image\n1.2. Identified and addressed client requirements\n1.3. Strengthened relations with clients\n2. Resource\nimplications\nThe following resources should be provided:\n2.1. Tools materials and equipment needed to perform the\n required tasks\n2.2. References and manuals\n2.3. Sample terms of reference\n3. Methods of\nassessment\nCompetency in this unit may be assessed through:\n3.1. Demonstration/observation with oral questioning\n\n4. Context for\nassessment\n4.1. Competency may