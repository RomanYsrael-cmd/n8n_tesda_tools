y working activities\n\n2.1 Role of\nindividual\nmembers in a\ncreative\nendeavor\n2.2 Sources of\nIndustry\ninformation\n2.1 Time\nmanagement\nskills\n2.2 Ready skills\nneeded to\naccess industry\ninformation\n\n--- PDF PAGE 42 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 38\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sources of\ninformation\nMay include:\n1.1. Media\n1.2. Reference books\n1.3. Libraries\n1.4. Unions\n1.5. Industry associations\n1.5.1. Mentors\n1.5.2. Artist organizations\n1.5.3. Technical organizations\n1.6. Industry journals\n1.7. Internet\n1.8. Personal observation and experience\n\n2. Information to\nassist effective\nwork\nperformance\nMay include:\n2.1. Different sectors of the industry and the services\navailable in each sector\n2.2. Awareness on different culture\n2.3. Relationship between the industry and other industries\n2.4. Industry working conditions\n2.5. Legislation that affects the industry\n2.5.1 Dangerous Drug Act (DDA)\n2.5.2 Intellectual Property Ownership (IPO)\n2.5.3 Health and safety\n2.5.4 Hygiene\n2.5.5 Labor work practices\n2.5.6 Workers’ rights and compensation\n2.5.7 Viewer advisory\n2.5.8 Building and other related regulations\n2.5.9 Other related legislations\n2.6. Guilds and associations\n2.7. Industrial relations issues and major organizations\n2.8. Career opportunities within the industry\n2.9. Work ethics\n2.10. Quality assurance\n\n--- PDF PAGE 43 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 39\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Knew key sources of information on the industry\n1.2. Has updated industry knowledge\n1.3. Has accessed and used industry information\n\n2. Resource\nimplications\nThe following resources should be provided:\n2.1. Sources of information on the industry\n2.2. Industry knowledge\n3. Methods of\nassessment\nCompetency in this unit may be assessed throu