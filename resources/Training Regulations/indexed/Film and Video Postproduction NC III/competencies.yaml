          "source_text": "1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Operated software and equipment effectively in the\npostproduction facility to create edits and postproduction\nmaterials\n1.2 Executed the requirements of a client or production task\ncreatively and efficiently\n1.3 Observed safety measures applicable to worksite operation\n1.4 Communicated effectively with others to ensure effective\nwork operation\n2.\nResource\nimplications\nThe following resources should be provided:\n2.1 Computer system\n2.1.1 Postproduction software (e.g. Premiere, Final Cut Pro,\nVegas, etc.)\n2.1.2 Image editing software (e.g. Adobe Photoshop, Adobe\nIllustrator, Corel Draw)\n2.1.3 Audio production software (e.g. ProTools, LogicPro,\nAbleton, Audacity)\n2.1.4 Production peripherals (e.g. microphones, monitors,\ndrawing tablets, mixers, and the like)\n2.2 Workplace location\n2.3 Materials relevant to the unit of competency\n3.\nMethods of\nassessment\nCompetency in this unit must be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Portfolio of works with interview for those with minimum 3\nyears’ relevant industry experience\n4. Context of assessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 69 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 65\n\nUNIT OF COMPETENCY:\nCREATE ENHANCED EDITS AND MATERIALS FOR\nPOSTPRODUCTION\n\nUNIT CODE :"
        },
        "source_text": "CRE343306\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\ncreate fundamental edits and other related outputs for use in\nthe postproduction process to achieve the creative and/or\ntechnical requirements for a variety of film and video projects\nand productions based on the required Performance\nStandards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Ingest or\ncapture video\nand other\nmaterials\n1.1 All raw assets are\ntransferred and secured\ninto storage media.\n1.2 Proxy files are produced\nto ensure compatibility\nacross different\npostproduction systems.\n1.3 Analog assets are\ndigitized to the formats\ncompatible with the\nediting system.\n1.4 Relevant video assets\nare transcoded to a\nstandardized format\naligned with the primary\nfootage.\n\n1.1 Company rules and\nregulations, standards,\nand operating\nprocedures regarding\npostproduction facilities\n1.2 Applied computer\noperation and digital\nmedia literacy\n1.3 DOLE DO 198s2018\npolicies on OSH as\napplicable\n1.4 Inter-Guild Alliance\n(IGA) 2020 Health and\nSafety protocols for Film\nand Audiovisual Industry\nproductions as\napplicable\n1.5 DOH guidelines on\nsafety and health as\napplicable\n1.6 Basic knowledge of\ncomputer and\npostproduction systems\n1.7 Postproduction system\nconfigurations, patching,\nand layout based on\nmanufacturer’s and/or\ncompany specifications\n1.8 Common and\ncontemporary output\npostproduction file\nformats and containers\n1.9 File and data\nmanagement\nprocedures and\nprotocols\n\n1.1 Operating\ncomputer\nsystems with\nmedia and\ndigital literacy\nskills\n1.2 Handling and\noperating\npostproduction\nfacilities,\nequipment,\nand materials\n1.3 Maintaining\nclean and\norderly\nworkplace/\nproduction\nenvironment\n1.4 Demonstrating\nmanual\ndexterity\n1.5 Executing work\ntasks in an\nefficient and\norderly manner\n\n--- PDF PAGE 65 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 61\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Record voice\nand other\nsingle-track\naudio\n2.1 Actor’s, actress’s, or\nvoice talent's voices are\nrecorded using a Digital\nAudio Workstation\n(DAW).\n2.2 Takes are reviewed by\nClient for evaluation and\nfeedback.\n2.3 Audio is edited,\nprocessed, and\nintegrated into the\nproject according to\nproduction\nrequirements.\n\n2.1 Company rules and\nregulations, standards,\nand operating\nprocedures regarding\npostproduction facilities\n2.2 Company rules,\nregulations, and\nstandards regarding\nworking with talents\n2.9 Basic interpersonal\ncommunication and\nculturally and gender\nsensitive behavior\n2.3 Applied computer\noperation and digital\nmedia literacy\n2.4 Operation of audio\npostproduction systems\n2.5 Principles of sound\n2.6 Principles of acoustics\n2.7 Microphone and\nrecording principles\n2.8 DOLE DO 198s2018\npolicies on OSH as\napplicable\n2.9 Inter-Guild Alliance\n(IGA) 2020 Health and\nSafety protocols for Film\nand Audiovisual Industry\nproductions as\napplicable\n2.10 DOH guidelines on\nsafety and health as\napplicable\n2.1 Operating\ncomputer\nsystems with\nmedia and\ndigital literacy\nskills\n2.2 Handling and\noperating\npostproduction\nfacilities,\nequipment, and\nmaterials\n2.3 Maintaining\nclean and\norderly\nworkplace/\nproduction\nenvironment\n2.4 Demonstrating\nmanual\ndexterity\n2.5 Executing work\ntasks in an\nefficient and\norderly manner\n2.6 Handling talents\n2.7 Using recording\nand\npostproduction\ntechniques\n\n3. Assemble edits\non a timeline\n3.1 Footage and assets are\nsequenced onto a\ntimeline according to\nproduction\nrequirements.\n3.2 Video edits are created\non a timeline according\nto production\nrequirements.\n3.3 Transitions and\nsimple composites are\nmade on the timeline\naccording to production\nrequirements and\ncreative direction.\n\n3.1 Company rules and\nregulations, standards,\nand operating\nprocedures regarding\npostproduction facilities\n3.2 DOLE DO 198s2018\npolicies on OSH as\napplicable\n3.3 Inter-Guild Alliance\n(IGA) 2020 Health and\nSafety protocols for Film\nand Audiovisual Industry\nproductions as\napplicable\n3.4 DOH guidelines on\nsafety and health as\n3.1 Operating\ncomputer\nsystems with\nmedia and\ndigital literacy\nskills\n3.2 Handling and\noperating\npostproduction\nfacilities,\nequipment, and\nmaterials\n3.3 Maintaining\nclean and\norderly\nworkplace/\n\n--- PDF PAGE 66 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 62\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\napplicable\n3.5 Applied computer\noperation and digital\nmedia literacy\n3.6 Operation of video\npostproduction systems\n3.7 Principles of editing and\npostproduction\n3.8 Fundamental principles\nand language of film\n3.9 Ethical postproduction\npractices\n\n3.4 production\nenvironment\n3.5 Demonstrating\nmanual dexterity\n3.6 Executing work\ntasks in an\nefficient and\norderly manner\n3.7 Using editing\nand\npostproduction\ntechniques\n4. Design\ngraphics,\ncomputer-\ngenerated\nimagery, and\nother digitally\nproduced\nassets\n4.1 Graphic Elements are\ndesigned, cleaned up,\nor generated using\nappropriate design\nsoftware.\n4.2 Graphic elements are\nintegrated, animated, or\ncomposited into the\nproject according to\nproduction\nrequirements.\n4.3 Effective questioning,\nactive listening, and\nspeaking skills are used\nto gather and convey to\nthe Client technical\ninformation and creative\ndetails pertaining to all\nthe aspects of the\npostproduction project.\n4.1 Company rules and\nregulations, standards,\nand operating\nprocedures regarding\npostproduction facilities\n4.2 Company rules,\nregulations and\nstandards regarding\nIntellectual Property and\nother non-original\nmaterial\n4.3 Fundamental\nknowledge Intellectual\nProperty Code\n4.4 DOLE DO 198s2018\npolicies on OSH as\napplicable\n4.5 Inter-Guild Alliance\n(IGA) 2020 Health and\nSafety protocols for Film\nand Audiovisual Industry\nproductions as\napplicable\n4.6 DOH guidelines on\nsafety and health as\napplicable\n4.7 Applied computer\noperation and digital\nmedia literacy\n4.8 Operation of graphic,\nanimation, and/or digital\neffects systems\n4.9 Principles and elements\nof art and design\n4.10 Basic principles of\ntypography, graphic\ndesign and layout, and\nvisual communication\n4.1 Operating\ncomputer\nsystems with\nmedia and\ndigital literacy\nskills\n4.2 Handling and\noperating\npostproduction\nfacilities,\nequipment, and\nmaterials\n4.3 Maintaining\nclean and\norderly\nworkplace/\nproduction\nenvironment\n4.4 Demonstrating\nmanual\ndexterity\n4.5 Executing work\ntasks in an\nefficient and\norderly manner\n4.6 Correct design\ntechnique\n4.7 Communicating\neffectively with:\n4.7.1 Verbal\nskills\n4.7.2 Non-\nverbal\nskills\n4.8 Practicing\nprofessional\nworkplace\ninteraction and\n\n--- PDF PAGE 67 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 63\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.11 Color theory and\nharmony\n\netiquette\n4.9 Conveying\nideas and\ninformation to\nothers\n4.9.1 Written\n4.9.2 Verbal\n4.10 Planning and\norganizing\nactivities and\nwork tasks\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Assets\nAlso known as “materials”; may include:\n1.1 Raw or unedited video/ film footage\n1.2 Pre-edited or archived video/ film footage\n1.3 Graphic elements\n1.4 Sound and audio files\n1.5 Photographs\n1.6 Printed materials\n2. Storage Media\nMay include:\n2.1 External or Internal Hard Drives\n2.2 Flash Storage\n2.3 Solid State Drive\n2.4 DVD Discs\n2.5 Blu-Ray Discs\n3. Digital Audio Workstation\n(DAW)\nMay include:\n3.1 Audio production software\n3.2 Microphone/s\n3.3 Mixer/s\n3.4 Audio Monitors\n3.5 Rack-mounted effects processors\n4. Transitions and Simple\nComposites\nMay include:\n4.1 Cross dissolves and fades\n4.2 Wipes and fly-ins\n4.3 Text and simple graphic overlays\n4.4 Picture-in-picture effects\n4.5 Split screens\n4.6 Preset filters and effects\n5. Graphic Elements\nMay include:\n5.1 Image files: JPEG, PNG, etc.\n5.2 Photographs and printed material\n5.3 Graphic Designs and Illustrations\n\n--- PDF PAGE 68 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 64\n5.4 2D and 3D animated elements produced in other\nsoftware\n5.5 Computer-generated images such as\nbackgrounds, composites, and overlays\n6. Design Software\nMay include:\n6.1 Paint: e.g. Adobe Photoshop, Photopea\n6.2 Illustration: e.g. Adobe Illustrator, Corel Draw\n6.3 Animation: e.g. ToonBoom, Maya, Unity\n6.4 Compositing: e.g. Adobe After Effects\n6.5 Color grading: e.g. DaVinci Resolve, Magic Bullet\nColorista\n\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Operated software and equipment effectively in the\npostproduction facility to create edits and postproduction\nmaterials\n1.2 Executed the requirements of a client or production task\ncreatively and efficiently\n1.3 Observed safety measures applicable to worksite operation\n1.4 Communicated effectively with others to ensure effective\nwork operation\n2.\nResource\nimplications\nThe following resources should be provided:\n2.1 Computer system\n2.1.1 Postproduction software (e.g. Premiere, Final Cut Pro,\nVegas, etc.)\n2.1.2 Image editing software (e.g. Adobe Photoshop, Adobe\nIllustrator, Corel Draw)\n2.1.3 Audio production software (e.g. ProTools, LogicPro,\nAbleton, Audacity)\n2.1.4 Production peripherals (e.g. microphones, monitors,\ndrawing tablets, mixers, and the like)\n2.2 Workplace location\n2.3 Materials relevant to the unit of competency\n3.\nMethods of\nassessment\nCompetency in this unit must be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Portfolio of works with interview for those with minimum 3\nyears’ relevant industry experience\n4. Context of assessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 69 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 65\n\nUNIT OF COMPETENCY:\nCREATE ENHANCED EDITS AND MATERIALS FOR\nPOSTPRODUCTION\n\nUNIT CODE :"
