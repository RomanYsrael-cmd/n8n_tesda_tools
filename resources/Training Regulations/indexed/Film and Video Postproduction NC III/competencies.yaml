        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Operated software and equipment effectively in the\npostproduction facility to create edits and postproduction\nmaterials\n1.2 Executed the requirements of a client or production task\ncreatively and efficiently\n1.3 Utilized advanced functions of the postproduction system to\nachieve complex or enhanced edits and materials\n1.4 Observed safety measures applicable to worksite operation\n1.5 Communicated effectively with others to ensure effective\nwork operation\n2. Resource implications The following resources should be provided:\n2.1 Computer system\n2.1.1 Postproduction software (e.g. Premiere, Final Cut\n Pro, Vegas, etc.)\n2.1.2 Image editing software (e.g. Adobe Photoshop, Corel\nDraw, Adobe Illustrator)\n2.1.3 Audio production software (e.g. ProTools, LogicPro,\n Ableton, Audacity)\n2.1.4 Production peripherals (e.g. microphones, monitors,\n drawing tablets, mixers, and the like)\n2.2 Workplace location\n2.3 Materials relevant to the unit of competency\n3. Methods of\nassessment\nCompetency in this unit must be assessed through:\n3.1 Demonstration with oral questioning\n3.2 Portfolio of works with interview for those with minimum 3\nyears’ relevant industry experience\n4. Context of assessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 74 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 70\n\nUNIT OF COMPETENCY:\nWRAP UP POSTPRODUCTION\n\nUNIT CODE :"
        },
        "source_text": "CRE343307\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required to\nproduce specialized materials and resources, or likewise\nenhance preliminary edits, materials, and resources to achieve\nthe creative and/or technical requirements for a variety of film\nand video projects and productions based on the required\nPerformance Standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Construct\ncomplex edited\nsequences\n1.1 Editing techniques are\nused to enhance or\ncreate tension, mood,\nand emotion according\nto production\nrequirements or\ncreative direction.\n1.2 Footage and\nSequences are\ntrimmed down to the\nRunning Time\nprescribed by\nproduction\nrequirements or\ncreative direction.\n1.3 Various assets and\nfootage are integrated\ninto a timeline to\ncreate a cohesive and\neffective project\naccording to\nproduction\nrequirements or\ncreative direction.\n\n1.1 Company rules and\nregulations, standards,\nand operating\nprocedures regarding\npostproduction\nfacilities\n1.2 DOLE DO 198s2018\npolicies on OSH as\napplicable\n1.3 Inter-Guild Alliance\n(IGA) 2020 Health and\nSafety protocols for\nFilm and Audiovisual\nIndustry productions as\napplicable\n1.4 DOH guidelines on\nsafety and health as\napplicable\n1.5 Applied computer\noperation and digital\nmedia literacy\n1.6 Applied knowledge of\ncomputer and\npostproduction\nsystems\n1.7 File and data\nmanagement\nprocedures and\nprotocols\n1.8 Applied film and media\nediting theory\n1.9 Complex editing\ntechniques as applied\nto films and other\nmedia products\n1.10\nEthical\n1.1 Operating\ncomputer systems\nwith media and\ndigital literacy\nskills\n1.2 Handling and\noperating\npostproduction\nfacilities,\nequipment, and\nmaterials\n1.3 Maintaining clean\nand orderly\nworkplace/\nproduction\nenvironment\n1.4 Demonstrating\nmanual dexterity\n1.5 Executing work\ntasks in an