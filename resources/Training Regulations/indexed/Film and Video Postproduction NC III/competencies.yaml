        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nExamined specific workplace challenges\n1.2.\nAnalyzed the causes of specific workplace challenges\n1.3.\nFormulated resolutions to specific workplace challenges\n1.4.\nImplemented action plans and communicated results on\nspecific workplace challenges\n\n2. Resource\nImplications\n2.1 Assessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A bank\nof scenarios / case studies / what ifs will be required as well as\nbank of questions which will be used to probe the reason\nbehind the observable action.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Observation\n3.2 Case Formulation\n3.3 Life Narrative Inquiry\n3.4 Standardized Test\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of parts\nof this unit of competency. Simulation should be based on the\nactual workplace and will include walk through of the relevant\ncompetency components.\n\nThese assessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may have\nhappened.\n4. Context for\nAssessment\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 20 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 16\nUNIT OF COMPETENCY :\nWORK IN A DIVERSE ENVIRONMENT\n\nUNIT CODE\n :"
        },
        "source_text": "400311321\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto solve problems in the workplace including the application\nof problem-solving techniques and to determine and resolve\nthe root cause/s of specific problems in the workplace.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Examine\nspecific\nworkplace\nchallenges.\n 1.1 Variances are\nexamined from\nnormal operating\nparameters and\nproduct quality.\n 1.2 Extent, cause and\nnature of the\nspecific problem\nare defined\nthrough\nobservation,\ninvestigation and\nanalytical\ntechniques.\n 1.3 Problems are\nclearly stated and\nspecified.\n 1.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations.\n 1.2 Competence to\ninclude the ability\nto apply and\nexplain, enough for\nthe identification of\nfundamental\ncauses of specific\nworkplace\nchallenges.\n 1.3 Relevant\nequipment and\noperational\nprocesses\n 1.4 Enterprise goals,\ntargets and\nmeasures\n 1.5 Enterprise quality\nOHS and\nenvironmental\nrequirement\n 1.6 Enterprise\ninformation\nsystems and data\ncollation\n 1.7 Industry codes and\nstandards\n1.1 Using range of\nanalytical techniques\n(e.g., planning,\nattention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation) in\nexamining specific\nchallenges in the\nworkplace.\n1.2 Identifying extent\nand causes of\nspecific challenges in\nthe workplace.\n\n--- PDF PAGE 15 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 11\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Analyze the\ncauses of\nspecific\nworkplace\nchallenges.\n 2.1 Possible causes of\nspecific problems\nare identified\nbased on\nexperience and the\nuse of problem-\nsolving tools /\nanalytical\ntechniques.\n 2.2 Possible cause\nstatements are\ndeveloped based\non findings.\n 2.3 Fundamental\ncauses are\nidentified per\nresults of\ninvestigation\nconducted.\n 2.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations.\n 2.2 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the identification\nof fundamental\ncause, determining\nthe corrective\naction and\nprovision of\nrecommendations.\n 2.3 Relevant\nequipment and\noperational\nprocesses\n 2.4 Enterprise goals,\ntargets and\nmeasures\n 2.5 Enterprise quality\nOSH and\nenvironmental\nrequirement\n 2.6 Enterprise\ninformation\nsystems and data\ncollation\n 2.7 Industry codes and\nstandards\n2.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in the\nworkplace\n2.2 Identifying extent\nand causes of\nspecific\nchallenges in the\nworkplace\n2.3 Providing clear-\ncut findings on\nthe nature of\neach identified\nworkplace\nchallenges\n\n--- PDF PAGE 16 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 12\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Formulate\nresolutions\nto specific\nworkplace\nchallenges.\n3.1 All possible\noptions are\nconsidered for\nresolution of the\nproblem.\n 3.2 Strengths and\nweaknesses of\npossible options\nare considered.\n 3.3 Corrective actions\nare determined to\nresolve the\nproblem and\npossible future\ncauses.\n 3.4 Action plans are\ndeveloped\nidentifying\nmeasurable\nobjectives,\nresource needs\nand timelines in\naccordance with\nsafety and\noperating\nprocedures\n3.1 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the identification\nof fundamental\ncause, determining\nthe corrective\naction and\nprovision of\nrecommendations\n 3.2 Relevant\nequipment and\noperational\nprocesses\n 3.3 Enterprise goals,\ntargets and\nmeasures\n 3.4 Enterprise quality\nOSH and\nenvironmental\nrequirement\n 3.5 Principles of\ndecision-making\nstrategies and\ntechniques\n3.6 Enterprise\ninformation\nsystems and data\ncollation\n3.7 Industry codes and\nstandards\n3.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in the\nworkplace\n3.2 Identifying extent\nand causes of\nspecific\nchallenges in the\nworkplace\n3.3 Providing clear-\ncut findings on\nthe nature of\neach identified\nworkplace\nchallenges\n3.4 Devising,\ncommunicating,\nimplementing\nand evaluating\nstrategies and\ntechniques in\naddressing\nspecific\nworkplace\nchallenges\n\n--- PDF PAGE 17 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 13\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Implement\naction plans\nand\ncommunicate\nresults.\n 4.1 Action plans are\nimplemented and\nevaluated.\n 4.2 Results of plan\nimplementation\nand\nrecommendations\nare prepared.\n 4.3 Recommendations\nare presented to\nappropriate\npersonnel.\n4.4 Recommendations\nare followed up, if\nrequired.\n 4.1 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the identification\nof fundamental\ncause, determining\nthe corrective\naction and\nprovision of\nrecommendations\n4.2. Relevant\nequipment and\noperational\nprocesses\n 4.3 Enterprise goals,\ntargets and\nmeasures\n 4.4 Enterprise quality,\nOSH and\nenvironmental\nrequirement\n 4.5 Principles of\ndecision-making\nstrategies and\ntechniques\n 4.6 Enterprise\ninformation\nsystems and data\ncollation\n 4.7 Industry codes and\nstandards\n4.1 Using range of\nanalytical\ntechniques\n(e.g., planning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in\nthe workplace\n4.2 Identifying\nextent and\ncauses of\nspecific\nchallenges in\nthe workplace\n4.3 Providing clear-\ncut findings on\nthe nature of\neach identified\nworkplace\nchallenges\n4.4 Devising,\ncommunicating,\nimplementing\nand evaluating\nstrategies and\ntechniques in\naddressing\nspecific\nworkplace\nchallenges\n\n--- PDF PAGE 18 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 14\n RANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Parameters\nMay include:\n1.1 Processes\n1.2 Procedures\n1.3 Systems\n\n2. Analytical techniques\nMay include:\n2.1. Brainstorming\n2.2. Intuitions/Logic\n2.3. Cause and effect diagrams\n2.4. Pareto analysis\n2.5. SWOT analysis\n2.6. Gantt chart, PERT/CPM and graphs\n2.7. Scattergrams\n3. Problem\n\nMay include:\n3.1. Routine, non-routine and complex workplace and\nquality problems\n3.2. Equipment selection, availability and failure\n3.3. Teamwork and work allocation problem\n3.4. Safety and emergency situations and incidents\n3.5. Risk assessment and management\n4. Action plans\n\nMay include:\n4.1. Priority requirements\n4.2. Measurable objectives\n4.3. Resource requirements\n4.4. Timelines\n4.5. Coordination and feedback requirements\n4.6. Safety requirements\n4.7. Risk assessment\n4.8. Environmental requirements\n\n--- PDF PAGE 19 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 15\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1.\nExamined specific workplace challenges\n1.2.\nAnalyzed the causes of specific workplace challenges\n1.3.\nFormulated resolutions to specific workplace challenges\n1.4.\nImplemented action plans and communicated results on\nspecific workplace challenges\n\n2. Resource\nImplications\n2.1 Assessment will require access to an operating plant over an\nextended period of time, or a suitable method of gathering\nevidence of operating ability over a range of situations. A bank\nof scenarios / case studies / what ifs will be required as well as\nbank of questions which will be used to probe the reason\nbehind the observable action.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Observation\n3.2 Case Formulation\n3.3 Life Narrative Inquiry\n3.4 Standardized Test\nThe unit will be assessed in a holistic manner as is practical and\nmay be integrated with the assessment of other relevant units of\ncompetency. Assessment will occur over a range of situations,\nwhich will include disruptions to normal, smooth operation.\nSimulation may be required to allow for timely assessment of parts\nof this unit of competency. Simulation should be based on the\nactual workplace and will include walk through of the relevant\ncompetency components.\n\nThese assessment activities should include a range of problems,\nincluding new, unusual and improbable situations that may have\nhappened.\n4. Context for\nAssessment\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 20 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 16\nUNIT OF COMPETENCY :\nWORK IN A DIVERSE ENVIRONMENT\n\nUNIT CODE\n :"
