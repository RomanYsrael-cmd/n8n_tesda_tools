  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details and contents of the units of competency required in FILM\nAND VIDEO POSTPRODUCTION NC III. These units of competency are categorized into\nbasic, common and core competencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 400311319\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\nlead in the effective dissemination and discussion of ideas,\ninformation, and issues in the workplace. This includes\npreparation of written communication materials.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Communicate\ninformation\nabout\nworkplace\nprocesses\n 1.1 Relevant communication\nmethod is selected based\non workplace procedures\n 1.2 Multiple operations\ninvolving several\ntopics/areas are\ncommunicated following\nenterprise requirements\n 1.3 Questioning is applied to\ngain extra information\n 1.4 Relevant sources of\ninformation are identified\nin accordance with\nworkplace/ client\nrequirements\n 1.5 Information is selected and\norganized following\nenterprise procedures\n 1.6 Verbal and written\nreporting is undertaken\nwhen required\n 1.7 Communication and\nnegotiation skills are\napplied and maintained in\nall relevant situations\n1.1. Organization\nrequirements\nfor written and\nelectronic\ncommunication\nmethods\n1.2. Effective\nverbal\ncommunication\nmethods\n1.3. Business\nwriting\n1.4. Workplace\netiquette\n1.1 Organizing information\n1.2 Conveying intended\nmeaning\n1.3 Participating in a\nvariety of workplace\ndiscussions\n1.4 Complying with\norganization\nrequirements for the\nuse of written and\nelectronic\ncommunication\nmethods\n1.5 Effective business\nwriting\n1.6 Effective clarifying and\nprobing skills\n1.7 Effective questioning\ntechniques (clarifying\nand probing)\n\n2. Lead\nworkplace\ndiscussions\n 2.1 Response to workplace\nissues are sought\nfollowing enterprise\nprocedures\n 2.2 Response to workplace\nissues are provided\nimmediately\n 2.3 Constructive contributions\n2.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n2.2 Effective verbal\ncommunication\n2.1 Organizing information\n2.2 Conveying intended\nmeaning\n2.3 Participating in variety\nof workplace\ndiscussions\n2.4 Complying with\norganization\n\n--- PDF PAGE 8 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 4\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nare made to workplace\ndiscussions on such\nissues as production,\nquality and safety\n 2.4 Goals/ objectives and\naction plans undertaken\nin the workplace are\ncommunicated promptly\nmethods\n2.3 Workplace\netiquette\nrequirements for the\nuse of written and\nelectronic\ncommunication\nmethods\n2.5 Effective clarifying and\nprobing skills\n\n3. Identify and\ncommunicate\nissues arising\nin the\nworkplace\n 3.1 Issues and problems are\nidentified as they arise\n 3.2 Information regarding\nproblems and issues are\norganized coherently to\nensure clear and effective\ncommunication\n 3.3 Dialogue is initiated with\nappropriate personnel\n 3.4 Communication problems\nand issues are raised as\nthey arise\n 3.5 Identify barriers in\ncommunication to be\naddressed appropriately\n\n3.1 Organization\nrequirements for\nwritten and\nelectronic\ncommunication\nmethods\n3.2 Effective verbal\ncommunication\nmethods\n3.3 Workplace\netiquette\n3.4 Communication\nproblems and\nissues\n3.5 Barriers in\ncommunication\n\n3.1 Organizing information\n3.2 Conveying intended\nmeaning\n3.3 Participating in a variety\nworkplace discussions\n3.4 Complying with\norganization\nrequirements for the\nuse of written and\nelectronic\ncommunication\nmethods\n3.5 Effective clarifying and\nprobing skills\n3.6 Identifying issues\n3.7 Negotiation and\ncommunication skills\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of communication\nMay include but not limited to:\n1.1. Non-verbal gestures\n1.2. Verbal\n1.3. Face-to-face\n1.4. Two-way radio\n1.5. Speaking to groups\n1.6. Using telephone\n1.7. Written\n1.8. Internet\n\n2. Workplace discussions\nMay include but not limited to:\n2.1. Coordination meetings\n2.2. Toolbox discussion\n2.3. Peer-to-peer discussion\n\n--- PDF PAGE 9 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 5\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Dealt with a range of communication/information at one\ntime\n1.2 Demonstrated leadership skills in workplace\ncommunication\n1.3 Made constructive contributions in workplace issues\n1.4 Sought workplace issues effectively\n1.5 Responded to workplace issues promptly\n1.6 Presented information clearly and effectively written form\n1.7 Used appropriate sources of information\n1.8 Asked appropriate questions\n1.9 Provided accurate information\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Variety of Information\n2.2 Communication tools\n2.3 Simulated workplace\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\nCase problem\n3.1. Third-party report\n3.2. Portfolio\n3.3. Interview\n3.4. Demonstration/Role-playing\n4. Context for\nAssessment\n4.1 Competency may be assessed in the workplace or in a\nsimulated workplace environment\n\n--- PDF PAGE 10 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 6\n UNIT OF COMPETENCY\n\n:\nLEAD SMALL TEAMS\n\n UNIT CODE\n :\n400311320\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and\n\nattitudes to lead small teams including setting,\n\nmaintaining and monitoring team and individual\n\nperformance standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Work\nrequirements are\nidentified and\npresented to team\nmembers based on\ncompany policies\nand procedures\n1.2 Reasons for\ninstructions and\nrequirements are\ncommunicated to\nteam members\nbased on company\npolicies and\nprocedures\n1.3 Team members’\nand leaders’\nconcerns are\nrecognized,\ndiscussed and\ndealt with based on\ncompany practices\n 1.1 Facilitation of\nTeamwork\n 1.2 Company policies\nand procedures\nrelating to work\nperformance\n 1.3 Performance\nstandards and\nexpectations\n 1.4 Monitoring\nindividual’s and\nteam’s\nperformance vis a\nvis client’s and\ngroup’s\nexpectations\n 1.1 Communication\nskills required\nfor leading\nteams\n 1.2 Group facilitation\nskills\n 1.3 Negotiating skills\n 1.4 Setting\nperformance\nexpectation\n2. Assign\nresponsibilities\n2.1. Responsibilities are\nallocated having\nregard to the skills,\nknowledge and\naptitude required to\nundertake the\nassigned task\nbased on company\npolicies.\n2.2. Duties are\nallocated having\nregard to individual\npreference,\ndomestic and\npersonal\nconsiderations,\nwhenever possible\n\n 2.1 Work plan and\nprocedures\n 2.2 Work requirements\nand targets\n 2.3 Individual and\ngroup expectations\nand assignments\n 2.4 Ways to improve\ngroup leadership\nand membership\n 2.1 Communication\nskills\n 2.2 Management\nskills\n 2.3 Negotiating skills\n 2.4 Evaluation skills\n 2.5 Identifying team\nmember’s\nstrengths and\nrooms for\nimprovement\n\n--- PDF PAGE 11 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 7\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Set\nperformance\nexpectations for\nteam members\n3.1 Performance\nexpectations are\nestablished based\non client needs\n3.2 Performance\nexpectations are\nbased on individual\nteam members\nknowledge, skills\nand aptitude\n3.3 Performance\nexpectations are\ndiscussed and\ndisseminated to\nindividual team\nmembers\n 3.1 One’s roles and\nresponsibilities in\nthe team\n 3.2 Feedback giving\nand receiving\n 3.3 Performance\nexpectation\n\n 3.1 Communication\nskills\n 3.2 Accurate\nempathy\n 3.3 Congruence\n 3.4 Unconditional\npositive regard\n 3.5 Handling of\nfeedback\n\n4. Supervise team\nperformance\n4.1 Performance is\nmonitored based on\ndefined\nperformance criteria\nand/or assignment\ninstruction\n 4.2 Team members are\nprovided with\nfeedback, positive\nsupport and advice\non strategies to\novercome any\ndeficiencies based\non company\npractices\n 4.3 Performance\nissues which\ncannot be rectified\nor addressed within\nthe team are\nreferred to\nappropriate\npersonnel\naccording to\nemployer policy\n 4.4 Team members are\nkept informed of\nany changes in the\npriority allocated to\nassignments or\ntasks which might\nimpact on\nclient/customer\nneeds and\nsatisfaction\n 4.1 Performance\nCoaching\n 4.2 Performance\nmanagement\n 4.3 Performance Issues\n\n 4.1 Communication\nskills required\nfor leading\nteams\n 4.2 Coaching skill\n\n--- PDF PAGE 12 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 8\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.5 Team operations\nare monitored to\nensure that\nemployer/client\nneeds and\nrequirements are\nmet\n4.6 Follow-up\ncommunication is\nprovided on all\nissues affecting\nthe team\n 4.7 All relevant\ndocumentation is\ncompleted in\naccordance with\ncompany\nprocedures\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\nMay include:\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s\nconcerns\nMay include:\n2.1. Roster/shift details\n3. Monitor performance\nMay include:\n3.1. Formal process\n3.2. Informal process\n4. Feedback\nMay include:\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\nMay include:\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 13 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 9\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to\nnext level of management or appropriate specialist\nand to negotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5. Set and communicated performance expectations for\na range of tasks and duties within the team and\nprovided feedback to team members\n2. Resource Implications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2. Materials relevant to the proposed activity or task\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Written Examination\n3.2. Oral Questioning\n3.3. Portfolio\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 14 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 10\n UNIT OF COMPETENCY\n:\nAPPLY CRITICAL THINKING AND PROBLEM-\n\nSOLVING TECHNIQUES IN THE WORKPLACE\n\n UNIT CODE\n : 400311321\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto solve problems in the workplace including the application\nof problem-solving techniques and to determine and resolve\nthe root cause/s of specific problems in the workplace.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Examine\nspecific\nworkplace\nchallenges.\n 1.1 Variances are\nexamined from\nnormal operating\nparameters and\nproduct quality.\n 1.2 Extent, cause and\nnature of the\nspecific problem\nare defined\nthrough\nobservation,\ninvestigation and\nanalytical\ntechniques.\n 1.3 Problems are\nclearly stated and\nspecified.\n 1.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations.\n 1.2 Competence to\ninclude the ability\nto apply and\nexplain, enough for\nthe identification of\nfundamental\ncauses of specific\nworkplace\nchallenges.\n 1.3 Relevant\nequipment and\noperational\nprocesses\n 1.4 Enterprise goals,\ntargets and\nmeasures\n 1.5 Enterprise quality\nOHS and\nenvironmental\nrequirement\n 1.6 Enterprise\ninformation\nsystems and data\ncollation\n 1.7 Industry codes and\nstandards\n1.1 Using range of\nanalytical techniques\n(e.g., planning,\nattention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation) in\nexamining specific\nchallenges in the\nworkplace.\n1.2 Identifying extent\nand causes of\nspecific challenges in\nthe workplace.\n\n--- PDF PAGE 15 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 11\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Analyze the\ncauses of\nspecific\nworkplace\nchallenges.\n 2.1 Possible causes of\nspecific problems\nare identified\nbased on\nexperience and the\nuse of problem-\nsolving tools /\nanalytical\ntechniques.\n 2.2 Possible cause\nstatements are\ndeveloped based\non findings.\n 2.3 Fundamental\ncauses are\nidentified per\nresults of\ninvestigation\nconducted.\n 2.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations.\n 2.2 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the identification\nof fundamental\ncause, determining\nthe corrective\naction and\nprovision of\nrecommendations.\n 2.3 Relevant\nequipment and\noperational\nprocesses\n 2.4 Enterprise goals,\ntargets and\nmeasures\n 2.5 Enterprise quality\nOSH and\nenvironmental\nrequirement\n 2.6 Enterprise\ninformation\nsystems and data\ncollation\n 2.7 Industry codes and\nstandards\n2.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation) in\nexamining\nspecific\nchallenges in the\nworkplace\n2.2 Identifying extent\nand causes of\nspecific\nchallenges in the\nworkplace\n2.3 Providing clear-\ncut findings on\nthe nature of\neach identified\nworkplace\nchallenges\n\n--- PDF PAGE 16 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 12\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Formulate\nresolutions\nto specific\nworkplace\nchallenges.\n3.1 All possible\noptions are\nconsidered for\nresolution of the\nproblem.\n 3.2 Strengths and\nweaknesses of\npossible options\nare considered.\n 3.3 Corrective actions\nare determined to\nresolve the\nproblem and\npossible future\ncauses.\n 3.4 Action plans are\ndeveloped\nidentifying\nmeasurable\nobjectives,\nresource needs\nand timelines in\naccordance with\nsafety and\noperating\nprocedures\n3.1 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the identification\nof fundamental\ncause, determining\nthe corrective\naction and\nprovision of\nrecommendations\n 3.2 Relevant\nequipment and\noperational\nprocesses\n 3.3 Enterprise goals,\ntargets and\nmeasures\n 3.4 Enterprise quality\nOSH and\nenvironmental\nrequirement\n 3.5 Principles of\ndecision-making\nstrate