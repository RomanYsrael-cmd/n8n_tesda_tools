        "source_text": "CRE265205\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills and\n\n attitudes in effectively managing own workload, resources\n\n and quality work.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan for\ncompletion of\nown\nworkload\n1.1. Tasks are identified\naccording to job\nrequirements.\n1.2. Work plans and\nschedules are designed\nand organized based on\ntimelines/deadlines.\n1.3. Team coordination is\napplied when required in\ncompletion of workload.\n1.4. Resource management is\ndeveloped based on job\nrequirements and/or\nbudget allocation.\n\n1.1. Team work\n1.2. Resource\nmanagement\n1.3. Timelines\n\n1.1. Planning and\norganizing\nworkload and\nresources\n1.2. Communication\nskills\n\n2. Maintain\nquality of\nperformance\n2.1. Personal performance is\nmonitored according to\nperformance standards.\n2.2. Advice and guidance is\nobtained when necessary\nto achieve or maintain\nagreed standards.\n2.3. Guidance from\nmanagement when\nnecessary is applied to\nachieve or maintain agreed\nstandards.\n\n2.1. Indicators of\nappropriate\nperformance for\neach area of\nresponsibility\n2.2. Steps for\nimproving or\nmaintaining\nperformance\n\n2.1. Ability to\nobserve and\nrecord\nperformance-\nrelated\nconcerns and\ninformation\n\n3. Evaluate and\nassess own\nwork\n3.1. Actual work output is\nevaluated and assessed in\nrelation to work plan.\n3.2. Work expenses are\nassessed in relation to\nfinancial plan/budget.\n3.3. Feedback is obtained from\nclients/audiences/\ncritics/similar persons.\n\n3.1. Financial\nManagement\n3.2. Project\nManagement\n3.3. Process\ndocumentation\n\n3.1. Project\nmanagement\nskills\n3.2. Financial\nmanagement\nskills\n3.3. Networking\nand client\nrelation\n3.4 Self-monitoring\n\n--- PDF PAGE 52 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 48\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tasks\nMay be identified through:\n1.1.\nAssignment Instructions\n1.2.\nVerbal Instructions\n1.3.\nPolicy Documents\n1.4.\nProject brief including timelines and schedules\n1.5.\nStipulated budget\n2. Work plans and\nschedules\nMay include:\n2.1.\nGantt charts\n2.2.\nProduction schedule\n2.3.\nMilestone and delivery dates\n3. Resource\nmanagement\nMay include:\n3.1.\nWork and financial plan\n3.2.\nBasic cash flow management and financial literacy\n3.3.\nOthers (time, manpower, materials/supplies, etc.)\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nPlanned for completion of own workload\n1.2\nMaintained quality of performance\n1.3\nEvaluated and assessed own work\n\n2. Resource\nimplications\nThe following resources should be provided:\n2.1\nAccess to relevant venue, equipment and materials\n2.2\nAssignment Instructions\n2.3\nLogbooks\n2.4\nCalendar of activities\n2.5\nSample liquidation and report of expenses\n\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration/observation with oral questioning\n4. Context of\nassessment:\n4.1\nCompetency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 53 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 49\nUNIT OF COMPETENCY : MAINTAIN SAFE, CLEAN AND EFFICIENT WORK\nENVIRONMENT\n\nUNIT CODE\n:"
