cess of addition,\nsubtraction,\nmultiplication, and\ndivision\n1.8 Basic Unit conversion\n1.9 DOLE DO 198s2018\npolicies on OSH as\napplicable\n1.10\nInter-Guild Alliance\n1.1 Operating computer\nsystems with media\nand digital literacy\nskills\n1.2 Handling and\noperating\npostproduction\nfacilities, equipment,\nand materials\n1.3 Maintaining clean and\norderly workplace/\nproduction\nenvironment\n1.4 Demonstrating\nmanual dexterity\n1.5 Observing proper\nOSH procedures as\napplicable\n1.6 Maintaining an\necologically friendly\nworking practice and\nenvironment\n\n--- PDF PAGE 59 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 55\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n(IGA) 2020 Health and\nSafety protocols for\nFilm and Audiovisual\nIndustry productions\nas applicable\n1.11\nDOH guidelines on\nsafety and health as\napplicable\n1.12\nFundamental\nenvironmental\nawareness and\nconservation\n2. Align creative\nand technical\nmatters with\nClient\n2.1 Client expectations\non quality, workflows,\nand timetables are\nclearly defined\nthrough client\nmeetings.\n2.2 Presentation skills\nare used to\ncommunicate the\nrelevant concepts,\nvalues, and\nprocesses in the\ndelivery of expected\noutputs.\n2.3 Client is made to\nunderstand and\nagree to the\nguidelines and\ncontracts that are fair\nto all parties\nconcerned.\n\n2.1 Company rules,\nregulations, and\nstandards regarding\nclients and client\nrelations\n2.2 Basic interpersonal\ncommunication and\nculturally and gender\nsensitive behavior\n2.3 DOLE DO 198s2018\npolicies on OSH as\napplicable\n2.4 Inter-Guild Alliance\n(IGA) 2020 Health and\nSafety protocols for\nFilm and Audiovisual\nIndustry productions as\napplicable\n2.5 DOH guidelines on\nsafety and health as\napplicable\n2.6 Basic production\nterminology,\nprocesses, workflows,\nand protocols\n2.7 Fundamental\nknowledge on laws\nand policie