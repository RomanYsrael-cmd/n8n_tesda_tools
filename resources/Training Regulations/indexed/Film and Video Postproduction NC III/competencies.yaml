plied to \nfilms and other media \nproducts \n3.14 \nScoring using \nexisting music tracks \nand loops \n3.15 \nFundamental \nknowledge on laws and \npolicies as applicable \n3.15.1 MTRCB \n3.15.2 PANA, 4As \n3.15.3 KBP, Media \nCode \n3.15.4 Intellectual \nProperty Code \n \nmanual dexterity \n3.5 Executing work \ntasks in an efficient  \nand orderly manner \n3.6 Producing creative \nand compelling \nwork and outputs  \n \n4. Composite \ncomputer-\ngenerated \nimagery \n4.1 Animatics for visual \neffects and composite \nedits are created using \nlow-resolution \nmaterials. \n4.2 Overlay, blending, \nand/or keying effects \nare utilized to create \ncomposite edits \naccording to \nproduction \n4.1 Company rules and \nregulations, standards, \nand operating \nprocedures regarding \npostproduction \nfacilities  \n4.2 DOLE DO 198s2018 \npolicies on OSH as \napplicable \n4.3 Inter-Guild Alliance \n(IGA) 2020 Health and \n4.1 Operating \ncomputer systems \nwith media and \ndigital literacy skills \n4.2 Handling and \noperating \npostproduction \nfacilities, \nequipment, and \nmaterials \n4.3 Maintaining clean\n\n--- PDF PAGE 72 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               68 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nrequirements or \ncreative direction. \n4.3 Visual effects using \ncompositing \ntechniques are created \naccording to \nproduction \nrequirements. \n4.4 “Invisible” visual \neffects and other \nvisual enhancements \nare performed and \nimplemented \naccording to creative \ndirection. \n \nSafety protocols for \nFilm and Audiovisual \nIndustry productions as \napplicable \n4.4  DOH guidelines on \nsafety and health as \napplicable \n4.5 Applied computer \noperation and digital \nmedia literacy \n4.6 Applied knowledge of \ncomputer and \npostproduction \nsystems \n4.7 Applied blending and \ncompositing \ntechniques \n4.8 Fundamental animation \nprinciples \n4.9 Fundamental graphics \nand motion graphics \ntechniques \n4.10 \nFundamental visual \neffects production and \ncompositing \ntechniques \n4.11 \nVisual effects \ntheory, principles, and \ntechniques as applied \nin film and media \nproducts \n4.12 \nEthical \npostproduction \npractices \n \nand orderly \nworkplace/ \nproduction \nenvironment \n4.4 Demonstrating \nmanual dexterity \n4.5 Executing work \ntasks in an efficient \nand orderly manner \n4.6 Producing creative \nand compelling \nwork and outputs  \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Animatics \nMay include: \n1.1 Low-resolution renders \n1.2 Animated storyboards \n1.3 Proxy effects or materials \n2. “Invisible” Visual Effects \nMay include: \n2.1 Background replacement or enhancement such as \nadding clouds or mountains in the distance \n2.2 Erasures such as removing screen elements such \nas stunt rigging, wires, or bystanders \n2.3 Multiplications such as creating anonymous\n\n--- PDF PAGE 73 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321               Promulgated (11/05/2021)               69 \ncrowds or large armies \n2.4 Insertions such as adding extras, street elements, \nor building textures  \n2.5 Enhancements such as making eyes larger or \nadding abdominal muscles \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Operated software and equipment effectively in the \npostproduction facility to create edits and postproduction \nmaterials \n1.2 Executed the requirements of a client or production task \ncreatively and efficiently \n1.3 Utilized advanced functions of the postproduction system to \nachieve complex or enhanced edits and materials \n1.4 Observed safety measures applicable to worksite operation \n1.5 Communicated effectively with others to ensure effective \nwork operation \n2. Resource implications The following resources should be provided:  \n2.1 Computer system  \n2.1.1 Postproduction software (e.g. Premiere, Final Cut  \n       Pro, Vegas, etc.) \n2.1.2 Image editing software (e.g. Adobe Photoshop, Corel \nDraw, Adobe Illustrator) \n2.1.3 Audio production software (e.g. ProTools, LogicPro,  \n       Ableton, Audacity) \n2.1.4 Production peripherals (e.g. microphones, monitors,  \n       drawing tablets, mixers, and the like) \n2.2 Workplace location \n2.3  Materials relevant to the unit of competency \n3. Methods of \nassessment \nCompetency in this unit must be assessed through: \n3.1 Demonstration with oral questioning \n3.2 Portfolio of works with interview for those with minimum 3 \nyears’ relevant industry experience \n4. Context of assessment \n4.1 Competency may be assessed in actual workplace or at the  \ndesignated TESDA Accredited Assessment Center.\n",
