        "source_text": "400311320\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and\n\nattitudes to lead small teams including setting,\n\nmaintaining and monitoring team and individual\n\nperformance standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Provide team\nleadership\n1.1 Work\nrequirements are\nidentified and\npresented to team\nmembers based on\ncompany policies\nand procedures\n1.2 Reasons for\ninstructions and\nrequirements are\ncommunicated to\nteam members\nbased on company\npolicies and\nprocedures\n1.3 Team members’\nand leaders’\nconcerns are\nrecognized,\ndiscussed and\ndealt with based on\ncompany practices\n 1.1 Facilitation of\nTeamwork\n 1.2 Company policies\nand procedures\nrelating to work\nperformance\n 1.3 Performance\nstandards and\nexpectations\n 1.4 Monitoring\nindividual’s and\nteam’s\nperformance vis a\nvis client’s and\ngroup’s\nexpectations\n 1.1 Communication\nskills required\nfor leading\nteams\n 1.2 Group facilitation\nskills\n 1.3 Negotiating skills\n 1.4 Setting\nperformance\nexpectation\n2. Assign\nresponsibilities\n2.1. Responsibilities are\nallocated having\nregard to the skills,\nknowledge and\naptitude required to\nundertake the\nassigned task\nbased on company\npolicies.\n2.2. Duties are\nallocated having\nregard to individual\npreference,\ndomestic and\npersonal\nconsiderations,\nwhenever possible\n\n 2.1 Work plan and\nprocedures\n 2.2 Work requirements\nand targets\n 2.3 Individual and\ngroup expectations\nand assignments\n 2.4 Ways to improve\ngroup leadership\nand membership\n 2.1 Communication\nskills\n 2.2 Management\nskills\n 2.3 Negotiating skills\n 2.4 Evaluation skills\n 2.5 Identifying team\nmember’s\nstrengths and\nrooms for\nimprovement\n\n--- PDF PAGE 11 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 7\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Set\nperformance\nexpectations for\nteam members\n3.1 Performance\nexpectations are\nestablished based\non client needs\n3.2 Performance\nexpectations are\nbased on individual\nteam members\nknowledge, skills\nand aptitude\n3.3 Performance\nexpectations are\ndiscussed and\ndisseminated to\nindividual team\nmembers\n 3.1 One’s roles and\nresponsibilities in\nthe team\n 3.2 Feedback giving\nand receiving\n 3.3 Performance\nexpectation\n\n 3.1 Communication\nskills\n 3.2 Accurate\nempathy\n 3.3 Congruence\n 3.4 Unconditional\npositive regard\n 3.5 Handling of\nfeedback\n\n4. Supervise team\nperformance\n4.1 Performance is\nmonitored based on\ndefined\nperformance criteria\nand/or assignment\ninstruction\n 4.2 Team members are\nprovided with\nfeedback, positive\nsupport and advice\non strategies to\novercome any\ndeficiencies based\non company\npractices\n 4.3 Performance\nissues which\ncannot be rectified\nor addressed within\nthe team are\nreferred to\nappropriate\npersonnel\naccording to\nemployer policy\n 4.4 Team members are\nkept informed of\nany changes in the\npriority allocated to\nassignments or\ntasks which might\nimpact on\nclient/customer\nneeds and\nsatisfaction\n 4.1 Performance\nCoaching\n 4.2 Performance\nmanagement\n 4.3 Performance Issues\n\n 4.1 Communication\nskills required\nfor leading\nteams\n 4.2 Coaching skill\n\n--- PDF PAGE 12 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 8\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.5 Team operations\nare monitored to\nensure that\nemployer/client\nneeds and\nrequirements are\nmet\n4.6 Follow-up\ncommunication is\nprovided on all\nissues affecting\nthe team\n 4.7 All relevant\ndocumentation is\ncompleted in\naccordance with\ncompany\nprocedures\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\nMay include:\n1.1. Client Profile\n1.2. Assignment instructions\n2. Team member’s\nconcerns\nMay include:\n2.1. Roster/shift details\n3. Monitor performance\nMay include:\n3.1. Formal process\n3.2. Informal process\n4. Feedback\nMay include:\n4.1. Formal process\n4.2. Informal process\n5. Performance issues\nMay include:\n5.1. Work output\n5.2. Work quality\n5.3. Team participation\n5.4. Compliance with workplace protocols\n5.5. Safety\n5.6. Customer service\n\n--- PDF PAGE 13 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 9\n EVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Maintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2. Assessed and monitored team and individual\nperformance against set criteria\n1.3. Represented concerns of a team and individual to\nnext level of management or appropriate specialist\nand to negotiate on their behalf\n1.4. Allocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5. Set and communicated performance expectations for\na range of tasks and duties within the team and\nprovided feedback to team members\n2. Resource Implications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n2.2. Materials relevant to the proposed activity or task\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Written Examination\n3.2. Oral Questioning\n3.3. Portfolio\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 14 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 10\n UNIT OF COMPETENCY\n:\nAPPLY CRITICAL THINKING AND PROBLEM-\n\nSOLVING TECHNIQUES IN THE WORKPLACE\n