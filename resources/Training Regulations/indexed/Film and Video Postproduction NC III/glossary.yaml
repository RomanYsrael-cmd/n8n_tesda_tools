  "source_text": "ANIMATICS\nLow-resolution sample or rendering of a visual effect or composite\nused for timing and work-around purposes early in the\npostproduction process. Animatics may also be storyboards that\nare played in sequence with sound or a musical score to give\nClients an idea of the resulting film or video project\nAUDIO BUS\nan umbrella term that describes a route in which you take a\nselection of one or more instruments or tracks, from their own\nchannels and route them to a particular place or group.\nAUDIO PLUG INS\nA program within a DAW usually produced by a third party and not\npart of the core or main software system. Plugins may be effects\nprocessors, instruments, and other digital systems that may be\nused to enhance or strengthen elements in a sound design\nCOLOR\nCORRECTION\nThe technical process of improving the visual quality of film\nfootage by adjusting brightness, contrast, saturation, and/ or hue\nCOLOR\nGRADING\nThe creative process of adding mood and atmosphere by re-\ncoloring footage according to a pre-determined set or combination\nof colors known as a “color palette”\nCOLOR\nPALETTE\na subtle way to visually enhance the emotional aspect of a film or\nvideo project and guide the viewer to respond viscerally or\nemotionally to a scene, character, sequence, or entire film. Color\npalettes are developed by selecting color combinations around the\ncolor wheel and expanding its character by varying its brightness,\nsaturation, and tone\nDIGITAL AUDIO\nWORKSTATION\n(DAW)\nA dedicated computer system intended for use in recording and\nediting audio files. DAWs have the appropriate software and\nhardware to interface with audio peripherals such as mixers,\nmicrophones, and monitors\nDIGITAL CINEMA\nPACKAGE (DCP)\na collection of digital files used to store and convey digital cinema\naudio, image, and data streams.\nIt is the primary system used to transport and project films in\ntheatres and festivals. Film files are encoded and encrypted onto\nhard drives and distributed to cinemas and other venues; the data\nin a DCP cannot be “played” directly like ordinary video files, but\nmust be decoded by a matching decoder on a digital cinema\nprojector at the projection venue.\nEDITING\nGeneral term used for postproduction techniques. Involves the\nsequencing and arrangement of audio, graphic, and video material\nto create a whole or cohesive project.\nEXPORTING\n\nProcess of outputting a film and video project into a form that is\nusable for its intended purpose. Exports may be but are not limited\nto:\n\n--- PDF PAGE 117 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 113\nEXTERNAL\nASSETS\nGeneral term for postproduction material that is produced outside\nthe primary editing system or by other systems or individuals. In\nmany cases these assets are produced by experts in these fields\nand integrated onto a timeline by the editor.\nFOLEY/ FOLEY\nARTISTS\nThe reproduction of everyday sound effects and adding them in\npostproduction. Foley is commonly heard in elements such as\ndoors opening and closing, footsteps, and breaking glass.\nProfessional Foley Artists are highly talented and well paid in large\nfilm projects.\nFOOTAGE\nGeneral term used for raw video material coming from a camera or\nsimilar recording device\nINDEPENDENT\nPLAYBACK\nSYSTEM\nA player or computer that is not the primary editing platform,\npreferably not connected to the editing platform via network. An\nindependent system allows final edited materials to be previewed\nand reviewed for compatibility and functionality\nINVISIBLE\nEFFECTS\nVisual effects designed to be “invisible” or in the background\nwithout calling attention to itself.\nMASTERING\n\nThe process of finalizing or “locking” a film or video project at the\nhighest possible quality or resolution. The resulting data file will be\nused as the source of future copies as well as form an archived\ncopy\nMETADATA\n\nDigital information embedded into the output files of film, audio,\nand video projects that communicate with playback systems.\nNON-LINEAR\nEDITING\nProcess of non-destructive editing of video and audio footage;\nusually on a desktop computer system. Also known as Desktop\nVideo Editing.\nOFFLINE EDIT\nA preliminary or “rough cut” of a project before effects, colors, and\nenhancements are finalized. Offline edits are usually used as\npreviews and referenced by external asset producers to create\ndigitally produced material such as CGI, graphics, and sound.\nCommonly offline edits are developed at a lower resolution to\nreduce processing time and increase work speed\nONLINE EDIT\n\nAn edit where digital effects and external assets have been\nintegrated and utilized in their full resolution. Online edits are\nusually made during the latter part of the postproduction process\nas the whole project approaches completion.\nOPEN MEDIA\nFRAMEWORK\n(OMF)\nA platform-independent file format intended for transfer of digital\nmedia between different software applications. OMF files are used\nfor both audio and video files, especially when sharing files\nbetween workstations and work environments\nRAID\nStands for Redundant Array of Independent Disks. It is a data\nstorage virtualization technology that combines multiple physical\ndisk drive components into a single logical unit for the purposes of\ndata redundancy, performance improvement, or both.\n\n--- PDF PAGE 118 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 114\nRUNNING TIME\nThe length or duration of a film or video project. Some mediums\nhave a required or prescribed Running Time such as advertising\nwith 30- and 60-second running times.\nSEQUENCE\nA series of scenes or shots that form a complete narrative unit.\nMultiple sequences are brought together to create a complete film\nor video project.\nEditing a sequence is more than just editing shots together but\nrequires an element of storytelling as the result 