    {
      "term": "ANIMATICS",
      "definition": "Low-resolution sample or rendering of a visual effect or composite used for timing and work-around purposes early in the postproduction process. Animatics may also be storyboards that are played in sequence with sound or a musical score to give Clients an idea of the resulting film or video project"
    },
    {
      "term": "AUDIO BUS",
      "definition": "an umbrella term that describes a route in which you take a selection of one or more instruments or tracks, from their own channels and route them to a particular place or group."
    },
    {
      "term": "AUDIO PLUG INS",
      "definition": "A program within a DAW usually produced by a third party and not part of the core or main software system. Plugins may be effects processors, instruments, and other digital systems that may be used to enhance or strengthen elements in a sound design"
    },
    {
      "term": "COLOR",
      "definition": "CORRECTION The technical process of improving the visual quality of film footage by adjusting brightness, contrast, saturation, and/ or hue"
    },
    {
      "term": "COLOR",
      "definition": "GRADING The creative process of adding mood and atmosphere by re- coloring footage according to a pre-determined set or combination of colors known as a “color palette”"
    },
    {
      "term": "COLOR",
      "definition": "PALETTE a subtle way to visually enhance the emotional aspect of a film or video project and guide the viewer to respond viscerally or emotionally to a scene, character, sequence, or entire film. Color palettes are developed by selecting color combinations around the color wheel and expanding its character by varying its brightness, saturation, and tone"
    },
    {
      "term": "DIGITAL AUDIO",
      "definition": "WORKSTATION (DAW) A dedicated computer system intended for use in recording and editing audio files. DAWs have the appropriate software and hardware to interface with audio peripherals such as mixers, microphones, and monitors"
    },
    {
      "term": "DIGITAL CINEMA",
      "definition": "PACKAGE (DCP) a collection of digital files used to store and convey digital cinema audio, image, and data streams. It is the primary system used to transport and project films in theatres and festivals. Film files are encoded and encrypted onto hard drives and distributed to cinemas and other venues; the data in a DCP cannot be “played” directly like ordinary video files, but must be decoded by a matching decoder on a digital cinema projector at the projection venue."
    },
    {
      "term": "EDITING",
      "definition": "General term used for postproduction techniques. Involves the sequencing and arrangement of audio, graphic, and video material to create a whole or cohesive project."
    },
    {
      "term": "EXPORTING",
      "definition": "Process of outputting a film and video project into a form that is usable for its intended purpose. Exports may be but are not limited to:"
    },
    {
      "term": "FILM AND VIDEO POSTPRODUCTION NC III",
      "definition": "CREFVP321 Promulgated (11/05/2021) 113"
    },
    {
      "term": "EXTERNAL",
      "definition": "ASSETS General term for postproduction material that is produced outside the primary editing system or by other systems or individuals. In many cases these assets are produced by experts in these fields and integrated onto a timeline by the editor."
    },
    {
      "term": "FOLEY/ FOLEY",
      "definition": "ARTISTS The reproduction of everyday sound effects and adding them in postproduction. Foley is commonly heard in elements such as doors opening and closing, footsteps, and breaking glass. Professional Foley Artists are highly talented and well paid in large film projects."
    },
    {
      "term": "FOOTAGE",
      "definition": "General term used for raw video material coming from a camera or similar recording device"
    },
    {
      "term": "INDEPENDENT",
      "definition": "PLAYBACK"
    },
    {
      "term": "SYSTEM",
      "definition": "A player or computer that is not the primary editing platform, preferably not connected to the editing platform via network. An independent system allows final edited materials to be previewed and reviewed for compatibility and functionality"
    },
    {
      "term": "INVISIBLE",
      "definition": "EFFECTS Visual effects designed to be “invisible” or in the background without calling attention to itself."
    },
    {
      "term": "MASTERING",
      "definition": "The process of finalizing or “locking” a film or video project at the highest possible quality or resolution. The resulting data file will be used as the source of future copies as well as form an archived copy"
    },
    {
      "term": "METADATA",
      "definition": "Digital information embedded into the output files of film, audio, and video projects that communicate with playback systems."
    },
    {
      "term": "NON-LINEAR",
      "definition": "EDITING"
    },
    {
      "term": "Process of non",
      "definition": "destructive editing of video and audio footage; usually on a desktop computer system. Also known as Desktop"
    },
    {
      "term": "Video Editing. OFFLINE EDIT",
      "definition": "A preliminary or “rough cut” of a project before effects, colors, and enhancements are finalized. Offline edits are usually used as previews and referenced by external asset producers to create digitally produced material such as CGI, graphics, and sound. Commonly offline edits are developed at a lower resolution to reduce processing time and increase work speed"
    },
    {
      "term": "ONLINE EDIT",
      "definition": "An edit where digital effects and external assets have been integrated and utilized in their full resolution. Online edits are usually made during the latter part of the postproduction process as the whole project approaches completion."
    },
    {
      "term": "OPEN MEDIA",
      "definition": "FRAMEWORK (OMF) A platform-independent file format intended for transfer of digital media between different software applications. OMF files are used for both audio and video files, especially when sharing files between workstations and work environments"
    },
    {
      "term": "RAID",
      "definition": "Stands for Redundant Array of Independent Disks. It is a data storage virtualization technology that combines multiple physical disk drive components into a single logical unit for the purposes of data redundancy, performance improvement, or both."
    },
    {
      "term": "FILM AND VIDEO POSTPRODUCTION NC III",
      "definition": "CREFVP321 Promulgated (11/05/2021) 114"
    },
    {
      "term": "RUNNING TIME",
      "definition": "The length or duration of a film or video project. Some mediums have a required or prescribed Running Time such as advertising with 30- and 60-second running times."
    },
    {
      "term": "SEQUENCE",
      "definition": "A series of scenes or shots that form a complete narrative unit. Multiple sequences are brought together to create a complete film or video project. Editing a sequence is more than just editing shots together but requires an element of storytelling as the result should contain a viable internal narrative structure."
    },
    {
      "term": "SMPTE",
      "definition": "Commonly pronounced “Simptee”, stands for The Society of Motion Picture and Television Engineers is an international professional association, based in the United States, of engineers working in the motion imaging industries. An internationally recognized standards organizations, SMPTE has more than 600 Standards, Recommended Practices and Engineering Guidelines for television production, filmmaking, digital cinema, audio recording, information technology, and medical imaging."
    },
    {
      "term": "SOUNDSCAPE",
      "definition": "The acoustic environment perceived by humans. In film and video projects it is the 3-dimensional space in which characters exist; it is composed of the sounds that form and arise from an immersive environment."
    },
    {
      "term": "TIME CODE",
      "definition": "A timecode (alternatively, time code) is a sequence of numeric codes generated at regular intervals by a timing synchronization system. In video production and filmmaking, SMPTE timecode is used extensively for synchronization, and for logging and identifying material in recorded media."
    },
    {
      "term": "TIMELINE",
      "definition": "The primary interface for postproduction work done on audio, video, and graphic elements. All assets are sequenced on a timeline; timelines are present in all major and professional editing platforms"
    },
