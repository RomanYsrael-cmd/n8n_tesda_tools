  "source_text": "Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.1.2 The qualification may also be attained through the presentation of a portfolio of\nworks covering all the units required on the conditions that:\n\n4.1.2.1. The portfolio contains works and projects produced outside of a training or\neducational scenario (e.g. workshop, college course, thesis film) and were\nproduced for a commissioned, commercial, or exhibition purpose.\n4.1.2.2. The candidate has at least 3 years working experience in the field of film\nand video production.\n4.1.2.3. The portfolio contains the candidate’s original work or work in which the\ncandidate participated as a key or lead practitioner in the postproduction\nfield (e.g. Editor, Visual Effects Artist, Colorist).\n4.1.2.4. However, if the assessor finds the evidences presented inadequate,\nhe/she may still require the candidate to undergo the practical\ndemonstration depending on the need for supplementary evidences.\n\n4.1.3 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.1.4 Candidates who have gained competencies through education, informal training,\nor work life experiences may apply for recognition in a particular qualification\nthrough competency assessment.\n\n4.1.5 The following are qualified to apply for assessment and certification:\n\n4.1.5.1.\nGraduates of WTR-registered program, NTR-registered programs or\nformal/non-formal/informal including enterprise-based trainings related to\nFilm and Video Postproduction NC III; OR\n4.1.5.2.\nExperienced Workers (wage-employed or self-employed) with at least 3\nyears working experience in the field of film and video production with at\nleast 1 year working experience specifically in film and video\npostproduction.\n\n4.1.6 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\n\n--- PDF PAGE 113 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 109\nImplementation of the “Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by\nthe candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\n This document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment centers\nundergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 114 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (dd/mm/yyyy) 110\nCOMPETENCY MAP\nCREATIVE SECTOR – FILM AND VIDEO POSTPRODUCTION NCIII\n\nBASIC COMPETENCIES\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with others\nSolve/address\nroutine problems\nEnhance self-\nmanagement skills\nSupport innovation\nAccess and\nmaintain\ninformation\nFollow\noccupational safety\nand health policies\nand procedures\nApply\nenvironmental work\nstandards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in a team\nenvironment\nSolve/address\ngeneral workplace\nproblems\nDevelop career and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent relevant\ninformation\nPractice\noccupational safety\nand health policies\nand procedures\nExercise efficient\nand effective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small teams\nApply critical\nthinking and\nproblem-solving\ntechniques in the\nworkplace\nWork in a diverse\nenvironment\nPropose methods\nof applying\nlearning and\ninnovation in the\norganization\nUse information\nsystematically\nEvaluate\noccupational\nsafety and health\nwork practices\nEvaluate\nenvironmental\nwork practices\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\nUtilize specialized\ncommunication\nskills\nDevelop and lead\nteams\nPerform higher\norder thinking\nprocesses and\napply techniques in\nthe workplace\nContribute to the\npractice of social\njustice in the\nworkplace\nManage innovative\nwork instructions\nManage and\nevaluate usage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\n(OSH) programs,\npolicies, and\nprocedures\nLead towards\nimprovement of\nenvironment work\nprograms, policies,\nand procedures\nSustain\nentrepreneurial\nskills\n\n--- PDF PAGE 115 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (dd/mm/yyyy) 111\n\nCOMMON COMPETENCIES\n\nDevelop and\nupdate industry\nknowledge\nDevelop creative\nthinking, artistic\nskills, and cultural\nawareness\nObserve\nprocedures,\nspecifications,\nand manuals of\ninstructions\nOperate\nequipment\nManage own\nperformance\nMaintain clean,\nsafe, and efficient\nwork environment\nProvide and\nmaintain effective\nclient relations\n\nCORE COMPETENCIES\n\nPrepare\npostproduction\nmaterials and\nfacilities\nBuild edits and\nmaterials for\npostproduction\nCreate enhanced\nedits and\nmaterials for\npostproduction\nWrap up\npostproduction\nHandle and install\nbasic audio\nequipment\n\nPerform technical\nassistance and\nbasic\ntroubleshooting\nPrepare lighting\nequipment, tools\nand supplies\nSet-up lighting\nequipment\naccording to the\nlighting plan\nOperate and\nmonitor the lighting\nsystem\nDismount, maintain\nand store lighting\nequipment\n\n--- PDF PAGE 116 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 112\nGLOSSARY OF TERMS\n\nANIMATICS\nLow-resolution sample or rendering of a visual effect or composite\nused for timing and work-around purposes early in the\npostproduction process. Animatics may also be storyboards that\nare played in sequence with sound or a musical score to give\nClients an idea of the resulting film or video project\nAUDIO BUS\nan umbrella term that describes a route in which you take a\nselection of one or more instruments or tracks, from their own\nchannels and route them to a particular place or group.\nAUDIO PLUG INS\nA program within a DAW usually produced by a third party and not\npart of the core or main software system. Plugins may be effects\nprocessors, instruments, and other digital systems that may be\nused to enhance or strengthen elements in a sound design\nCOLOR\nCORRECTION\nThe technical process of improving the visual quality of film\nfootage by adjusting brightness, contrast, saturation, and/ or hue\nCOLOR\nGRADING\nThe creative process of adding mood and atmosphere by re-\ncoloring footage according to a pre-determined set or combination\nof colors known as a “color palette”\nCOLOR\nPALETTE\na subtle way to visually enhance the emotional aspect of a film or\nvideo project and guide the viewer to respond viscerally or\nemotionally to a scene, character, sequence, or entire film. Color\npalettes are developed by selecting color combinations around the\ncolor wheel and expanding its character by varying its brightness,\nsaturation, and tone\nDIGITAL AUDIO\nWORKSTATION\n(DAW)\nA dedicated computer system intended for use in recording and\nediting audio files. DAWs have the appropriate software and\nhardware to interface with audio peripherals such as mixers,\nmicrophones, and monitors\nDIGITAL CINEMA\nPACKAGE (DCP)\na collection of digital files used to store and convey digital cinema\naudio, image, and data streams.\nIt is the primary system used to transport and project films in\ntheatres and festivals. Film files are encoded and encrypted onto\nhard drives and distributed to cinemas and other venues; the data\nin a DCP cannot be “played” directly like ordinary video files, but\nmust be decoded by a matching decoder on a digital cinema\nprojector at the projection venue.\nEDITING\nGeneral term used for postproduction techniques. Involves the\nsequencing and arrangement of audio, graphic, and video material\nto create a whole or cohesive project.\nEXPORTING\n\nProcess of outputting a film and video project into a form that is\nusable for its intended purpose. Exports may be but are not limited\nto:\n\n--- PDF PAGE 117 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 113\nEXTERNAL\nASSETS\nGeneral term for postproduction material that is produced outside\nthe primary editing system or by other systems or individuals. In\nmany cases these assets are produced by experts in these fields\nand integrated onto a timeline by the editor.\nFOLEY/ FOLEY\nARTISTS\nThe reproduction of everyday sound effects and adding them in\npostproduction. Foley is commonly heard in elements such as\ndoors opening and closing, footsteps, and breaking glass.\nProfessional Foley Artists are highly talented and well paid in large\nfilm projects.\nFOOTAGE\nGeneral term used for raw video material coming from a camera or\nsimilar recording device\nINDEPENDENT\nPLAYBACK\nSYSTEM\nA player or computer that is not the primary editing platform,\npreferably not connected to the editing platform via network. An\nindependent system allows final edited materials to be previewed\nand reviewed for compatibility and functionality\nINVISIBLE\nEFFECTS\nVisual effects designed to be “invisible” or in the background\nwithout calling attention to itself.\nMASTERING\n\nThe process of finalizing or “locking” a film or video project at the\nhighest possible quality or resolution. The resulting data file will be\nused as the source of future copies as well as form an archived\ncopy\nMETADATA\n\nDigital information embedded into the output files of film, audio,\nand video projects that communicate with playback systems.\nNON-LINEAR\nEDITING\nProcess of non-destructive editing of video and audio footage;\nusually on a desktop computer system. Also known as Desktop\nVideo Editing.\nOFFLINE EDIT\nA preliminary or “rough cut” of a project before effects, colors, and\nenhancements are finalized. Offline edits are usually used as\npreviews and referenced by external asset producers to create\ndigitally produced material such as CGI, graphics, and sound.\nCommonly offline edits are developed at a lower resolution to\nreduce processing time and increase work speed\nONLINE EDIT\n\nAn edit where digital effects and external assets have been\nintegrated and utilized in their full resolution. Online edits are\nusually made during the latter part of the postproduction process\nas the whole project approaches completion.\nOPEN MEDIA\nFRAMEWORK\n(OMF)\nA platform-independent file format intended for transfer of digital\nmedia between different software applications. OMF files are used\nfor both audio and video files, especially when sharing files\nbetween workstations and work environments\nRAID\nStands for Redundant Array of Independent Disks. It is a data\nstorage virtualization technology that combines multiple physical\ndisk drive components into a single logical unit for the purposes of\ndata redundancy, performance improvement, or both.\n\n--- PDF PAGE 118 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 114\nRUNNING TIME\nThe length or duration of a film or video project. Some mediums\nhave a required or prescribed Running Time such as advertising\nwith 30- and 60-second running times.\nSEQUENCE\nA series of scenes or shots that form a complete narrative unit.\nMultiple sequences are brought together to create a complete film\nor video project.\nEditing a sequence is more than just editing shots together but\nrequires an element of storytelling as the result should contain a\nviable internal narrative structure.\nSMPTE\nCommonly pronounced “Simptee”, stands for The Society of\nMotion Picture and Television Engineers is an international\nprofessional association, based in the United States, of engineers\nworking in the motion imaging industries. An internationally\nrecognized standards organizations, SMPTE has more than 600\nStandards, Recommended Practices and Engineering Guidelines\nfor television production, filmmaking, digital cinema, audio\nrecording, information technology, and medical imaging.\nSOUNDSCAPE\nThe acoustic environment perceived by humans. In film and video\nprojects it is the 3-dimensional space in which characters exist; it\nis composed of the sounds that form and arise from an immersive\nenvironment.\nTIME CODE\nA timecode (alternatively, time code) is a sequence of numeric\ncodes generated at regular intervals by a timing synchronization\nsystem. In video production and filmmaking, SMPTE timecode is\nused extensively for synchronization, and for logging and\nidentifying material in recorded media.\nTIMELINE\nThe primary interface for postproduction work done on audio,\nvideo, and graphic elements. All assets are sequenced on a\ntimeline; timelines are present in all major and professional editing\nplatforms\n\n--- PDF PAGE 119 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 115\nREFERENCES\n\n344Audio. (2020, May 18). The Ultimate Guide To Audio Post Production & Sound Design.\nRetrieved April 15, 2021, from 344-audio website: https://www.344audio.com/single-\npost/the-ultimate-guide-to-audio-post-production-sound-design\nAldredge, J. (2020, July 23). The 5 Types of Corporate Video Clients You’ll Work With Most.\nRetrieved April 15, 2021, from The Beat website:\nhttps://www.premiumbeat.com/blog/types-of-corporate-video-clients/\nAufderheide, P. A., Jaszi, P., & Chandra, M. C. (2009). HONEST TRUTHS: Documentary\nFilmmakers on Ethical Challenges in Their Work. Center for Social Media.\nBiesterfeld, P. (2014, December 28). How to Educate Clients on the Production Process.\nRetrieved April 15, 2021, from Videomaker website:\nhttps://www.videomaker.com/article/f04/17655-how-to-educate-clients-on-the-\nproduction-process\nBordwell, D., Thompson, K., & Smith, J. (2012). Film Art.\nBorwick, J. (2012). Loudspeaker and Headphone Handbook. CRC Press.\nBridge, M. (2016, February 24). Do You Have An Effective Post-Production Workflow?\nRetrieved April 15, 2021, from SLR Lounge website: https://www.slrlounge.com/post-\nproduction-workflow-tips/\nBrown, J. (n.d.). An Introduction to Color Grading. Retrieved April 15, 2021, from B&H Explora\nwebsite: https://www.bhphotovideo.com/explora/video/tips-and-solutions/introduction-\ncolor-grading\nButt, E. (2019, August 14). Dealing With Difficult Clients In Post Production Sound - Do We\nNeed To Get Organized? Retrieved April 15, 2021, from Production Expert website:\nhttps://www.pro-tools-expert.com/production-expert-1/2019/6/26/the-other-side-to-\nworking-with-clients-in-post-production-sound\nClark, B., Spohr, S., Higginbotham, D., & Bahkru, K. (n.d.). The Guide to Managing\nPostproduction for Film, TV, and Digital Distribution. Routledge.\nDancyger, K. (2013). The Technique of Film and Video Editing. Taylor & Francis.\nElwyn, J. (n.d.). Professional Colour Grading Breakdowns. Retrieved April 15, 2021, from\nhttps://jonnyelwyn.co.uk/film-and-video-editing/cool-videos-films-projects-creative-\nwork/professional-colour-grading-breakdowns/\nEnterate, K. (2018, July 5). Editing in a Nutshell— 9 Things You Need to Know About the\nPost-Production Process. Retrieved April 15, 2021, from SNEAKY BIG website:\nhttps://sneakybig.com/editing-in-a-nut-shell-9-things-you-need-to-know-about-the-post-\nproduction-process/\nFinance, C., & Zwerman, S. (2015). The Visual Effects Producer. CRC Press.\nFowler, J. (2012). Editing Digital Film. Taylor & Francis.\n\n--- PDF PAGE 120 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 116\nGalindo, J. (2021, March). Order of Mastering Operations. Retrieved April 15, 2021, from\niZotope website: https://www.izotope.com/en/learn/order-of-mastering-operations.html\nGoodman, R. M., & McGrath, P. (2002). Editing Digital Video. McGraw Hill Professional.\nGress, J. (2014). Digital Visual Effects and Compositing. Pearson Education.\nGuide to Color Grading: How to Color Grade Video Footage. (n.d.). Retrieved April 15, 2021,\nfrom MasterClass website: https://www.masterclass.com/articles/how-to-color-grade-\nvideo-footage#5-tips-for-color-grading-manually\nHaine, C. (2019). Color Grading 101. Routledge.\nHolman, T. (2012). Sound for Film and Television. Taylor & Francis.\nHolman, T., & Baum, A. (2013). Sound for Digital Video. Taylor & Francis.\nHow to Get Client Feedback During Film Post Production. (2018, September 9). Retrieved\nApril 15, 2021, from New Dawn Films website: https://newdawnfilm.com/how-to-get-\nclient-feedback-during-film-post-production/\nHurkman, A. V. (2013). Color Correction Handbook. Pearson Education.\nLorbecki, G. (2018a, August). Mixing Audio for Video, Part 1: Getting Started. Retrieved April\n15, 2021, from iZotope website: https://www.izotope.com/en/learn/mixing-audio-for-\nvideo-part-1-getting-started.html\nLorbecki, G. (2018b, August). Mixing Audio for Video, Part 2: Audio Post-Production\nWorkflows. Retrieved April 15, 2021, from iZotope website:\nhttps://www.izotope.com/en/learn/mixing-audio-for-video-part-2-audio-post-production-\nworkflows.html\nMaccarone, E. M. (2010). Ethical Responsibilities to Subjects and Documentary Filmmaking.\nJournal of Mass Media Ethics, (3), 192–206.\nhttps://doi.org/10.1080/08900523.2010.497025\nMaio, A. (2019, November 21). What is Post-Production? A Quick Rundown & Why Trust\nMatters. Retrieved April 15, 2021, from StudioBinder website:\nhttps://www.studiobinder.com/blog/what-is-post-production/\nMassey, T. (2020, May 5). How To Manage Client Expectations In Post Production. Retrieved\nApril 15, 2021, from Ambient Skies Production website:\nhttps://ambientskies.com/blog/techniques/how-to-manage-client-expectations-in-post-\nproduction/\nMitchell, M. (2013). Visual Effects for Film and Television. Taylor & Francis.\nNelson, R. (2013, October). Post-production Workflow. Retrieved April 15, 2021, from\nUntamed Science website: https://untamedscience.com/filmmaking/post-\nproduction/post-production-workflow/\nOwsinski, B. (2016). The Mixing Engineer’s Handbook.\n\n--- PDF PAGE 121 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 117\nPost-Production Workflow Model. (2017). Retrieved April 15, 2021, from Studiowide website:\nhttps://www.studiowide.co.uk/wp-content/uploads/2018/02/post-\nproduction_workflow_model.pdf\nPotter, C. (2012, November 13). 9 Ways to Improve Client Communication During Video\nReview — Video Review & Approval. Retrieved from Video Review & Approval website:\nhttps://screenlight.tv/blog/2012/11/13/9-ways-to-improve-client-communication-during-\nvideo-review\nRayburn, D. (2012). Streaming and Digital Media. Taylor & Francis.\nRenee, V. (2016, October 10). 10 Stages of Post-Production, from Data Storage to\nDeliverables. Retrieved April 15, 2021, from No Film School website:\nhttps://nofilmschool.com/2016/10/10-stages-post-production-data-storage-deliverables\nSavage, S. (2011). The Art of Digital Audio Recording. Oxford University Press on Demand.\nSpecial Effects vs. Visual Effects: Which is a Film Essential? (2018, July 14). Retrieved from\nCIIT Philippines School - Multimedia Arts, Web Design, 3D Animation, Mobile Game\nDevelopment website: https://www.ciit.edu.ph/special-effects/\nVanBreda, S. (2016, July). The Stages of Post Production Workflow - A Simplified Diagram.\nRetrieved April 15, 2021, from Chart, Diagram & Visual Workspace Software | Creately\nwebsite:\nhttps://creately.com/diagram/example/iqbxzdmm/The%20Stages%20of%20Post%20Pr\noduction%20Workflow%20-%20A%20Simplified%20Diagram\nWagner, S. (2021, January 5). Questions Of Ethics Politics And Aesthetics - Film Editing.\nRetrieved from Jukola Art Community website: https://www.jukolart.us/film-editing-\n2/questions-of-ethics-politics-and-aesthetics.html\n\n--- PDF PAGE 122 ---\nFILM AND VIDEO POSTPRODUCTION NC III - CREFVP321 Promulgated (11/05/2021) 118\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to thank\nthe following persons from the industry, academe, and government agencies for sacrificing\ntheir time and sharing expertise in the development and validation of this Training Regulations.\n\nTHE TECHNICAL AND INDUSTRY EXPERTS PANEL\n\nMR. JOSE ANTONIO W. GARCIA, MCDArtDes\nIndependent Filmmaker\nFounder and Former Chairperson, Asst. Professor – Digital Filmmaking Program\nDe La Salle-College of Saint Benilde\n950 P. Ocampo St., Malate Manila\n\nMS. RIANNE HILL I. SORIANO\nIndependent Filmmaker\nFilm Professor – Digital Filmmaking Program\nDe La Salle-College of Saint Benilde\n950 P. Ocampo St., Malate Manila\n\nMR. JOHN ANTHONY L. WONG\nPostproduction Specialist\nOwner and CEO – Shutter Post\nUnit 314 South Star Plaza, South Superhighway, Bangkal, Makati City 1233\n\nMS. MARIA IMELDA N. RAMOS\nMedia and TV Producer\nCurriculum Consultant – Asia Pacific College\n3 Humabon St., Magallanes Village, Makati C