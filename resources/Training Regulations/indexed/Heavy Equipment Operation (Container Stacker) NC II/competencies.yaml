        "source_text": "CON833328\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in\nperforming the pre- and post-operating checking procedure for\nmaterials handling equipment. It deals with the skills required\nfor performing visual, and operation and post-operation\nchecks for materials handling equipment.\n\nELEMENTS\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n\n1. Perform visual check of\nequipment\n\n1.1 Materials handling equipment is selected based on job\nrequirements.\n1.2 OS parts in container stacker are checked in accordance\nwith equipment checklist and manufacturer's procedures.\n1.3 Walk-around check is performed with equipment\nchecklist.\n1.4 Lifting gears of gantry crane are inspected for safe\nusage.\n2. Perform \"BLOWAF\"\ncheck\n\n2.1 BLOWAF check for container stacker is performed\nfollowing checklist form and with engine stopped / not\nrunning.\n2.2 Fluid levels in container stacker are maintained in\naccordance with equipment maintenance manual.\n2.3 Abnormal conditions in container stacker are noted and\nreported to authorized person.\n\n--- PDF PAGE 39 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Perform operation\ncheck\n3.1 Operation / starting running check is performed\nfollowing checklist and in accordance with manufacturer's\nrecommendations.\n3.2 Brake, steering and controls for container stacker and\nsafety devices for materials handling equipment are\nchecked for normal functioning as per manufacturer's\nspecifications.\n3.3 Walk-around check is performed with equipment checklist\nand with engine running.\n3.4 Abnormal conditions are noted in checklist and reported to\nauthorized personnel.\n4. Perform post-operation\nchecking procedures\n4.1 Materials handling equipment is turned off and container\nstacker is parked after productive operation in accordance\nwith company rules and regulations\n4.2 Equipment controls are set into neutral position and\nparking brakes for container stacker and safety locks are\nengaged according to manufacturer's operation manual\n4.3 Walk-around inspection is re-conducted while engine is\ncooling down.\n4.4 Daily equipment time record / report is accomplished /\nsubmitted according to company rules and regulations.\n\n--- PDF PAGE 40 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials handling\nequipment\n1.1 Gantry crane\n 1.1.1 Stationary\n 1.1.2 Mobile\n 1.1.2.1 Wheel type\n 1.1.2.2 Steel type\n1.2 Container stacker\n 1.2.1 Type\n 1.2.1.1 Top loader\n 1.2.1.2 Reach stacker\n 1.2.2 Lifting capacity\n 1.2.2.1 30 tons to 42 tons\n2. OS parts\n\n2.1 Air cleaner\n2.2 Battery terminals / connection\n2.3 Belts\n2.4 Tire inflation\n2.5 Grease / lube points\n2.6 Fuel water separation\n3. Walk-around check\nMaterials handling equipment\n3.1 Worn-out / damaged parts\n3.2 Loose / missing parts and accessories\n3.3 Warning and safety devices\n\nGantry crane\n3.4 Base foundation\n3.5 Communication system\n3.6 Hook block assembly and cables\n3.7 Automatic locking mechanism\n\nContainer stacker\n3.8 Leaks\n3.9 Fluid levels\n3.10 Wire rope cable and pulleys\n3.11 Gauges and controls\n3.12 Oil and leaks\n3.13 Working equipment function\n4. Lifting gears\n4.1 Sheaves\n4.2 Hook and latch\n\n--- PDF PAGE 41 ---\nTR HEAVY EQUIPMENT OPERATION\n\n5. BLOWAF check\n\n5.1 Battery (starting and charging system)\n5.2 Light (lighting system)\n5.3 Oil (lubricating system)\n5.4 Water (cooling system)\n5.5 Air (intake and exhaust system)\n5.6 Fuel (fuel system)\n\n6. Fluid levels\n6.1 Battery electrolyte\n6.2 Engine oil\n6.3 Hydraulic oil\n6.4 Radiator coolant\n6.5 Transmission / gear oil\n6.6 Brake / clutch\n6.7 Steering oil\n6.8 Windshield wiper reservoir\n7. Authorized person\n7.1 Equipment supervisor\n7.2 Maintenance personnel\n7.3 Equipment dispatcher / foreman\n\n--- PDF PAGE 42 ---\nTR HEAVY EQUIPMENT OPERATION\n\n8. Operation / starting\nrunning check\nMaterials handling equipment\n8.1 Gauges\n 8.1.1 Hour meter\n 8.1.2 Boom angle indicator\n8.2 Leaks\n 8.1.3 Oil\n8.3 Electrical / switches\n 8.1.4 Lights\n 8.1.5 Horn\n\nGantry crane\n8.4 Controls\n 8.4.1 Hoisting\n 8.4.2 Slewing\n 8.4.3 Travelling\n 8.4.4 Trollying\n 8.4.5 Luffing\n 8.4.6 Braking function\n8.5 Gauges\n 8.5.1 Voltage / current meter\n 8.5.2 Load indicator\n\nContainer stacker\n 8.5.3 Battery charging\n 8.5.4 Pressure (oil and water)\n 8.5.5 Temperature (oil and water)\n 8.5.6 RPM (tachometer)\n 8.5.7 Fuel indicator\n 8.5.8 Speedometer\n8.6 Leaks in system\n 8.6.1 Air\n 8.6.2 Cooling\n 8.6.3 Fuel\n 8.6.4 Fluid (brake / clutch)\n\n--- PDF PAGE 43 ---\nTR HEAVY EQUIPMENT OPERATION\n\n9. Safety locks\nGantry crane\n9.1 Hoisting\n9.2 Slewing\n9.3 Travelling\n9.4 Trollying\n9.5 Luffing\n9.6 Overwinding\n9.7 Door lock\n\nContainer stacker\n9.8 Swing\n9.9 Cabin door\n9.10 Control lever\n9.11 Spreader twist\n9.12 Piggy back attachment\n10. Controls\n10.1 Boom\n10.2 Hoist\n10.3 Swing\n10.4 Travel\n10.5 Spreader\n10.6 Twist lock\n10.7 Accelerator\n\n--- PDF PAGE 44 ---\nTR HEAVY EQUIPMENT OPERATION\n\n11. Safety devices\nMaterials handling\n11.1 Load moment indicator (LMI)\n11.2 Anti-two bock (limit switch)\n\nGantry crane\n11.3 Limit switch\n 11.3.1 Hoisting\n 11.3.2 Slewing\n 11.3.3 Travelling\n 11.3.4 Trollying\n 11.3.5 Luffing\n 11.3.6 Overwinding\n11.4 Emergency shut-off switch\n11.5 Beacon lights\n11.6 Lighting arrester\n11.7 Buzzer alarm\n11.8 Safety locks\n\nContainer stacker\n11.9 Twist lock sensor\n11.10 Spreader flipper\n11.11 Warning lights\n11.12 Alcogas detector\n11.13 Landing sensor\n\n--- PDF PAGE 45 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects of\nevidence to be\nconsidered\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrates knowledge of materials handling equipment\n1.2 Demonstrates ability to perform visual check of equipment\n following equipment checklist\n1.3 Demonstrates ability to perform walk-around and BLOWAF\n check for container stacker while the engine is stopped and\n/ or running\n1.4 Demonstrates ability to service and repair OS parts of\n container stacker\n1.5 Demonstrates ability to perform operation check following\n manufacturer’s recommendations.\n1.6 Demonstrates ability to observe risk-control / safe\n procedures\n1.7 Demonstrates ability to perform post-operation checking\n procedures\n1.8 Demonstrates ability to accomplish and submit Daily\n Equipment time Record / Report (DETR)\n2. Underpinning (related)\nknowledge and attitude\n\n2.1 Classification of equipment\n2.2 Types and uses of personal protective equipment (PPE)\n2.3 Equipment component structure and accessories\n2.4 Start-up and shutdown procedures\n2.5 Familiarity with manufacturer’s operation manual\n2.6 Familiarity with job site and work conditions\n2.7 Familiarity with pre- and post-operation checking\n procedures\n2.8 Positive work values (time and cost conscious, etc.)\n2.9 Metric and English conversion\n3. Underpinning skills\n\n3.1 Performing pre- and post-operation checking procedures\n for materials handling equipment\n3.2 Using personal protective equipment (PPE)\n3.3 Maintaining equipment records/reports\n3.4 Communicating with work site personnel and clients\n3.5 Complying with the manufacturer’s operation and\n maintenance manual\n3.6 Accomplishing and submitting pre- and post-operation\n checklist form / record\n3.7 Performing machine start-up and shutdown procedures\n\n--- PDF PAGE 46 ---\nTR HEAVY EQUIPMENT OPERATION\n\n4. Resource implications\n\nThings necessary for the conduct of assessment\n4.1 Access to materials handling equipment\n4.2 Appropriate work area for materials handling equipment\n4.3 Access to materials handling equipment operations\n manuals\n4.4 PPE\n5. Method of assessment\n\nCompetency in this unit must be assessed through\n5.1 Written/oral questioning\n5.2 Observation/ demonstration\n5.3 Work record and documents\n5.4 Third party report\n6. Context for\nassessment\n\n6.1 Assessment may be conducted on-the job or in a simulated\nvenue.\n6.2 Competency shall be assessed while work is being\nundertaken independently\n\n--- PDF PAGE 47 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT OF COMPETENCY:\nPERFORM BASIC PREVENTIVE MAINTENANCE\nSERVICING FOR CONTAINER STACKER\nUNIT CODE:"
