 Stored manuals in accordance with company requirements\n2. Underpinning\nknowledge\n\n2.1 Types of manuals used in construction sector\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n3. Underpinning skills\n3.1 Reading and comprehension skills required to identify and\ninterpret construction manuals and specifications\n3.2 Accessing information and data\n4. Resource implications\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to construction\n sector\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Questions/interview\n\nAssessment of underpinning knowledge and practical skills may\nbe combined\n6. Context of assessment\n6.1 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n6.2 Assessment may be conducted in the workplace or a\nsimulated environment\n\n--- PDF PAGE 25 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT OF COMPETENCY:\nINTERPRET TECHNICAL DRAWINGS AND PLANS\nUNIT CODE :"
