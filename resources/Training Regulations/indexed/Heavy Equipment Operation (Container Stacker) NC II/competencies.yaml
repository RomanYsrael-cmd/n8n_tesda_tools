        },
        "source_text": "CON931201\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes on\nidentifying, requesting and receiving construction materials and\ntools based on the required performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italicized terms are elaborated in the\nRange of Variable\n1. Identify materials\n\n1.1 Materials are listed as per job requirements\n1.2 Quantity and description of materials conform with the\njob requirements\n1.3 Tools and accessories are identified according to job\nrequirements\n2. Request materials\n\n2.1 Materials and tools needed are requested according to the\n list prepared\n2.2 Request is done as per company standard operating\nprocedures (SOP)\n2.3 Substitute materials and tools are provided without\nsacrificing cost and quality of work\n3. Receive and inspect\n materials\n3.1 Materials and tools issued are inspected as per quantity\nand specification\n3.2 Tools, accessories and materials are checked for\ndamages according to enterprise procedures\n3.3 Materials and tools are set aside to appropriate location\nnearest to the workplace\n\n--- PDF PAGE 20 ---\nTR HEAVY EQUIPMENT OPERATION\n\n RANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials and Tools\n\n1.1 Electrical supplies\n1.2 Structural\n1.3 Plumbing\n1.4 Welding/pipefitting\n1.5 Carpentry\n1.6 Masonry\n2. Description of Materials\nand Tools\n\n2.1 Brand name\n2.2 Size\n2.3 Capacity\n2.4 Kind of application\n3. Company standard\nprocedures\n3.1 Job order\n3.2 Requisition slip\n3.3 Borrower slip\n\n--- PDF PAGE 21 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Listed materials and tools according to quantity and job\n requirements\n1.2 Requested materials and tools according to the list\n prepared and as per company SOP\n1.3 Inspected issued materials and tools as per quantity and\n job specifications\n1.4 Tools provided with appropriate safety devices\n2. Underpinning\nknowledge\n\n2.1 Types and uses of construction materials and tools\n2.2 Different forms\n2.3 Requisition procedures\n3. Underpinning skills\n\n3.1 Preparing materials and tools\n3.2 Proper handling of tools and equipment\n3.3 Following instructions\n4. Resource implications\n\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Materials relevant to the unit of competency\n4.3 Technical plans, drawings and specifications relevant to\n the activities\n5. Methods of assessment\n\nCompetency in this unit must be assessed through:\n5.1 Direct observation and oral questioning\n6. Context of assessment\n\n6.1 Competency may be assessed in the workplace or in a\n simulated workplace\n6.2 Competency assessment must be undertaken in\n accordance with the endorsed TESDA assessment\n guidelines\n\n--- PDF PAGE 22 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT OF COMPETENCY:\nOBSERVE PROCEDURES, SPECIFICATIONS AND\nMANUALS OF INSTRUCTIONS\nUNIT CODE :"
