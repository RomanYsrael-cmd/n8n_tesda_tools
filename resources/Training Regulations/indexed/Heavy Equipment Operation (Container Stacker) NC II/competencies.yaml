nce schedule or manufacturer's\nspecifications\n2.3 Measuring instruments are checked and calibrated in\n accordance with manufacturer’s\n instructions\n\n--- PDF PAGE 33 ---\nTR HEAVY EQUIPMENT OPERATION\n\n2.4 Tools are cleaned and lubricated according to\n standard procedures\n2.5 Defective instruments, equipment and accessories are\n inspected and replaced according to manufacturer’s\n specifications\n2.6 Tools are inspected, repaired and replaced after use\n2.7 Work place is cleaned and kept in safe state in line with\n OHSA regulations\n\n--- PDF PAGE 34 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Store tools and\nequipment\n\n3.1 Inventory of tools, instruments and equipment are\nconducted and recorded as per company practices\n3.2 Tools and equipment are stored safely in appropriate\n locations in accordance with manufacturer's specifications\n or company procedures\n\n--- PDF PAGE 35 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLES\nRANGE\n1. Materials\nIncluding but not limited to:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n2. Tools and equipment\n\nIncluding but not limited to:\n2.1 Tools\nCutting tools - hacksaw, crosscut saw, rip saw\nBoring tools - auger, brace, grinlet, hand drill\nHolding tools - vise grip, C-clamp, bench vise\nThreading tools - die and stock, taps\n\n2.2 Measuring instruments/equipment\n3. PPE\nIncluding but not limited to:\n3.1 Goggles\n3.2 Gloves\n3.3 Safety shoes\n3.4 Aprons/Coveralls\n4. Forms\n4.1 Maintenance schedule forms\n4.2 Requisition slip\n4.3 Inventory Form\n4.4 Inspection Form\n4.5 Procedures\n\n--- PDF PAGE 36 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects\n of competency\nAssessment requires that the candidate:\n1.1 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.2 Identified functional and non-functional tools and\n equipment\n1.3 Checked, lubricated and calibrated tools, equipment and\ninstruments according to manufacturer’s specifications\n1.4 Replaced defective tools, equipment and their accessories\n1.5 Observed and applied safe handling of tools and\nequipment and safety work practices\n1.6 Prepared and submitted inventory report, where\napplicable\n1.7 Maintained workplace in accordance with OHSA\n regulations\n1.8 Stored tools and equipment safely in appropriate locations\nand in accordance with company practices\n2. Underpinning\nknowledge\n\n2.1 SAFETY PRACTICES\n 2.1.1 Use of PPE\n2.1.2 Handling of tools and equipment\n2.1.3 Good housekeeping\n2.2 MATERIALS, TOOLS AND EQUIPMENT\n2.2.1 Types and uses of lubricants\n2.2.2 Types and uses of cleaning materials\n2.2.3 Types and uses of measuring instruments and\nequipment\n2.3 PREVENTIVE MAINTENANCE\n2.3.1 Methods and techniques\n2.3.2 Procedures\n3. Underpinning skills\n3.1 Preparing maintenance materials, tools and equipment\n3.2 Proper handling of tools and equipment\n3.3 Performing preventive maintenance\n3.4 Following instructions\n4. Resource implications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Maintenance schedule\n4.3 Maintenance materials, tools and equipment relevant to\nthe proposed activity/task\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Written test/questioning relevant to Underpinning\n knowledge\n\n--- PDF PAGE 37 ---\nTR HEAVY EQUIPMENT OPERATION\n\n6. Context of assessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 38 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY:\nPERFORM PRE- AND POST OPERATION CHECKING\nPROCEDURES FOR MATERIALS HANDLING EQUIPMENT\nUNIT CODE:\nCON833328\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in\nperforming the pre- and post-operating checking procedure for\nmaterials handling equipment. It deals with the skills required\nfor performing visual, and operation and post-operation\nchecks for materials handling equipment.\n\nELEMENTS\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n\n1. Perform visual check of\nequipment\n\n1.1 Materials handling equipment is selected based on job\nrequirements.\n1.2 OS parts in container stacker are checked in accordance\nwith equipment checklist and manufacturer's procedures.\n1.3 Walk-around check is performed with equipment\nchecklist.\n1.4 Lifting gears of gantry crane are inspected for safe\nusage.\n2. Perform \"BLOWAF\"\ncheck\n\n2.1 BLOWAF check for container stacker is performed\nfollowing checklist form and with engine stopped / not\nrunning.\n2.2 Fluid levels in container stacker are maintained in\naccordance with equipment maintenance manual.\n2.3 Abnormal conditions in container stacker are noted and\nreported to authorized person.\n\n--- PDF PAGE 39 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3. Perform operation\ncheck\n3.1 Operation / starting running check is performed\nfollowing checklist and in accordance with manufacturer's\nrecommendations.\n3.2 Brake, steering and controls for container stacker and\nsafety devices for materials handling equipment are\nchecked for normal functioning as per manufacturer's\nspecifications.\n3.3 Walk-around check is performed with equipment checklist\nand with engine running.\n3.4 Abnormal conditions are noted in checklist and reported to\nauthorized personnel.\n4. Perform post-operation\nchecking procedures\n4.1 Materials handling equipment is turned off and container\nstacker is parked after productive operation in accordance\nwith company rules and regulations\n4.2 Equipment controls are set into neutral position and\nparking brakes for container stacker and safety locks are\nengaged according to manufacturer's operation manual\n4.3 Walk-around inspection is re-conducted while engine is\ncooling down.\n4.4 Daily equipment time record / report is accomplished /\nsubmitted according to company rules and regulations.\n\n--- PDF PAGE 40 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials handling\nequipment\n1.1 Gantry crane\n 1.1.1 Stationary\n 1.1.2 Mobile\n 1.1.2.1 Wheel type\n 1.1.2.2 Steel type\n1.2 Container stacker\n 1.2.1 Type\n 1.2.1.1 Top loader\n 1.2.1.2 Reach stacker\n 1.2.2 Lifting capacity\n 1.2.2.1 30 tons to 42 tons\n2. OS parts\n\n2.1 Air cleaner\n2.2 Battery terminals / connection\n2.3 Belts\n2.4 Tire inflation\n2.5 Grease / lube points\n2.6 Fuel water separation\n3. Walk-around check\nMaterials handling equipment\n3.1 Worn-out / damaged parts\n3.2 Loose / missing parts and accessories\n3.3 Warning and safety devices\n\nGantry crane\n3.4 Base foundation\n3.5 Communication system\n3.6 Hook block assembly and cables\n3.7 Automatic locking mechanism\n\nContainer stacker\n3.8 Leaks\n3.9 Fluid levels\n3.10 Wire rope cable and pulleys\n3.11 Gauges and controls\n3.12 Oil and leaks\n3.13 Working equipment function\n4. Lifting gears\n4.1 Sheaves\n4.2 Hook and latch\n\n--- PDF PAGE 41 ---\nTR HEAVY EQUIPMENT OPERATION\n\n5. BLOWAF check\n\n5.1 Battery (starting and charging system)\n5.2 Light (lighting system)\n5.3 Oil (lubricating system)\n5.4 Water (cooling system)\n5.5 Air (intake and exhaust system)\n5.6 Fuel (fuel system)\n\n6. Fluid levels\n6.1 Battery electrolyte\n6.2 Engine oil\n6.3 Hydraulic oil\n6.4 Radiator coolant\n6.5 Transmission / gear oil\n6.6 Brake / clutch\n6.7 Steering oil\n6.8 Windshield wiper reservoir\n7. Authorized person\n7.1 Equipment supervisor\n7.2 Maintenance personnel\n7.3 Equipment dispatcher / foreman\n\n--- PDF PAGE 42 ---\nTR HEAVY EQUIPMENT OPERATION\n\n8. Operation / starting\nrunning check\nMaterials handling equipment\n8.1 Gauges\n 8.1.1 Hour meter\n 8.1.2 Boom angle indicator\n8.2 Leaks\n 8.1.3 Oil\n8.3 Electrical / switches\n 8.1.4 Lights\n 8.1.5 Horn\n\nGantry crane\n8.4 Controls\n 8.4.1 