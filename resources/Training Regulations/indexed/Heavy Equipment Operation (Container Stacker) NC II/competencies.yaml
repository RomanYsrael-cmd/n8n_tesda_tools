R HEAVY EQUIPMENT OPERATION\n\nUNIT OF COMPETENCY:\nPERFORM BASIC PREVENTIVE MAINTENANCE\nSERVICING FOR CONTAINER STACKER\nUNIT CODE:\nCON833329\nUNIT DESCRIPTOR:\nThis unit involves the knowledge, skills and attitudes required\nin conducting routine basic preventive maintenance for\ncontainer stacker. It covers the skills in performing minor parts\nadjustments / replacements, carrying-out basic preventive\nmaintenance servicing and preparing equipment report.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n\n1. Perform adjustment/s\nreplacements\n\n1.1 Minor defects are identified and remedied in accordance\nwith company/manufacturer’s procedures.\n1.2 Tools are selected based on job requirements.\n1.3 Major defects are identified using check list and reported\nto appropriate personnel for action.\n2. Perform basic\npreventive maintenance\nservicing (PMS)\n\n2.1 OS parts/standards are identified and serviced according\nto manufacturer’s recommendations.\n2.2 Fluids and lubricants are used based on manufacturer’s\nmanual.\n2.3 Basic hand tools and equipment and consumable\nmaterials are identified and used in accordance with job\nrequirements.\n2.4 Basic preventive maintenance servicing (PMS) is\ncarried out in accordance with manufacturer’s\nrecommendations\n3. Prepare equipment\nreports\n\n3.1 Daily checklist form is accomplished in accordance with\nmanufacturer’s/company requirements.\n3.2 Minor/major equipment defects are reported to appropriate\npersonnel.\n\n--- PDF PAGE 48 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Minor defects\n\nMay include but not limited to:\n1.1 Loose battery terminal\n1.2 Air lock\n1.3 Tire inflation\n1.4 Belt tension\n1.5 Clogged air cleaner\n1.6 Loose bolts and nuts\n2. Major defects\n\nMay include but not limited to:\n2.1 Defective twist lock mechanism\n2.2 Busted hydraulic hose\n2.2 Hard starting engine\n2.3 Excessive engine oil consumption\n2.4 Leakage on air/fuel/cooling/hydraulic system\n2.5 Busted/flat tires\n2.6 Faulty gauges\n2.7 Broken Pulley\n2.8 Defective wire rope\n2.9 Incorrect Load Moment Indicator (LMI)\n2.10 Cracked (structures, booms) welded joints\n3. Appropriate personnel\n\n3.1 Mechanic\n3.2 Electrician\n3.3 Lubeman\n3.4 Tireman\n3.5 Immediate Supervisor\n3.6 Safety officer\n4. Operator Serviceable\n(OS) parts\n\nMay include but not limited to:\n4.1 Battery clamps\n4.2 Belts\n4.3 Filters\n 4.3.1 Air cleaner\n 4.3.2 Water fuel separator/drain valve\n4.4 All fluid caps\n4.5 All grease points and fittings\n4.6 Wire rope grease\n\n--- PDF PAGE 49 ---\nTR HEAVY EQUIPMENT OPERATION\n\n5. Standards\n5.1 Oil pressure\n5.2 Air pressure\n5.3 Temperatures\n5.4 Tension\n5.5 Clearance and distances\n5.6 Wire rope diameter and length\n5.7 Battery / charging voltage\n5.8 Lights adjustment, focus and illumination\n6. Fluids and lubricants\n6.1 Engine, hydraulic, transmission, gear and steering oils\n6.2 Brake fluid\n6.3 Multi-purpose grease\n6.4 Coolant\n6.5 Battery solutions\n7. Basic hand tools and\nequipment\n7.1 Hand tools\n 7.1.1 Wrenches\n 7.1.2 Pliers\n 7.1.3 Screw driver (positive and negative)\n 7.1.4 Paint brush\n 7.1.5 Grease gun\n 7.1.6 Hammer\n 7.1.7 Vice grip\n 7.1.8 Tire gauge (instrument)\n 7.1.9 Measuring tape (instrument)\n 7.1.10 Steel brush\n 7.1.11 Pinch bar\n7.2 Equipment\n 7.2.1 High pressure washer\n 7.2.2 Air compressor\n8. Basic preventive\nmaintenance servicing\nMay include but are not limited to:\n8.1 Check battery clamps\n8.2 Check fan belt conditions (cracked or worn-out)\n8.3 Adjust belt tensions (if necessary)\n8.4 Clean/Replace filters\n 8.4.1 Air cleaner\n 8.4.2 Water separator\n8.5 Replace defective fluid caps\n8.6 Grease all fittings or lube points\n8.7 Grease or lubricate sheaves wire ropes\n\n--- PDF PAGE 50 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects of\nevidence to be\nconsidered\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to observe safety precautions\n1.2 Demonstrates ability to identify and service minor defects\nwith checklist in accordance with operator’s and service\nmanual\n1.3 Demonstrates ability to identify and report major defects\nbased on checklist\n1.4 Demonstrates ability to identify and service OS\nparts/standards from manufacturer’s reference books /\nmanuals\n1.5 Demonstrates understanding of recommended fluids and\n lubricants\n1.6 Demonstrates ability to use appropriate basic hand tools\n and equipment\n1.7 Demonstrates ability to accomplish and submit daily\nchecklist forms and reports\n2. Underpinning (related)\nknowledge and attitude\n\n2.1 Company rules and regulations and safety procedures\n2.2 Familiarity with operator’s and maintenance manual\n2.3 Usage of basic hand tools and equipment\n2.4 Positive values (time and cost conscious, customer\nrelations, etc.)\n3. Underpinning skills\n\n3.1 Following company rules and regulations and safety\nprocedures\n3.2 Following operator’s and maintenance manual\n3.3 Performing basic preventive maintenance servicing\n3.4 Using basic hand tools and equipment\n3.5 Identifying and servicing minor defects and reporting major\ndefects\n\n4. Resource implications\n\nThings necessary for the conduct of assessment\n4.1 Access to container stacker specifications and operation\n manual\n4.2 Access container stacker\n4.3 Basic hand tools and equipment\n4.4 Fluids and lubricants\n4.5 PPE\n4.6 Safety signages/barricades\n\n--- PDF PAGE 51 ---\nTR HEAVY EQUIPMENT OPERATION\n\n5. Method of assessment\n\nCompetency in this unit must be assessed through\n5.1 Written and/or oral questioning\n5.2 Observation of practical demonstration\n5.3 Work record and documents\n6. Context for\nassessment\n\n6.1 Competency shall be assessed in a normal or simulated\n workplace environment and in accordance with safe work\n procedures\n6.2 Competency shall be assessed while work is being\n undertaken independently\n\n--- PDF PAGE 52 ---\nTR HEAVY EQUIPMENT OPERATION\n\nUNIT OF COMPETENCY:\nPERFORM PRODUCTIVE OPERATION FOR CONTAINER\nSTACKER\nUNIT CODE:\nCON833331\nUNIT DESCRIPTOR:\nThis unit involves knowledge, skills and attitudes in productive\noperation of Container Stacker. It deals with the skills required\nin handling container in the terminal.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n\n1. Interpret work\ninstruction\n\n1.1 Work assignment is secured and interpreted in line with\noperational requirements\n1.2 PPE is selected and used in line with job requirements\n\n2. Check and inspect\noperational area\n2.1 Work area is checked for unsafe conditions and\nproximity/accessibility to operational area\n2.2 Barriers or warning signages are checked in operational\narea.\n3. Perform container\nhandling operation\n\n3.1 Stacker is driven to the job site and positioned towards\nload based on operational requirements\n3.2 Lifting and stacking procedures are performed in\naccordance with job requirements and established /\nrecommended practices\n3.3 Work accomplishment is reported to appropriate\npersonnel following company rules and regulations\n3.4 Unexpected situations are responded to in line with\ncompany rules and regulations\n\n--- PDF PAGE 53 ---\nTR HEAVY EQUIPMENT OPERATION\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Work assignment\n1.1 Trip ticket\n1.2 Equipment checklist\n1.3 Location / job site\n2. Operational\nrequirements\n2.1 Sequence plan\n 2.1.1 Stacking procedure\n 2.1.2 Loading and unloading procedures\n 2.1.3 Shifting procedure\n2.2 Communication\n 2.2.1 Digital hand radio\n 2.2.2 Two-way radio\n 2.2.3 Hand signal\n2.3 Load chart\n 2.3.1 Weight\n 2.3.2 Boom length / angle\n 2.3.3 Radius\n3. Unsafe conditions\nMay include but not limited to:\n3.1 Presence of unauthorized persons\n3.2 Other equipment\n3.3 Building\n3.4 Sloping ground\n3.5 Weather condition\n3.6 Oil spillage\n4. Operational area\n4.1 Container yard\n4.2 Equipment aisle\n4.3 Access route\n5. Barriers or warning\nsignages\nMay include but are not limited to:\n5.1 Nylon cords\n5.2 Caution tapes\n5.3 Steel fence\n5.4 Signages\n 5.4.1 Off limits\n 5.4.2 No Entry\n 5.4.3 No Smoking\n 5.4.4 Safety first\n\n--- PDF PAGE 54 ---\nTR HEAVY EQUIPMENT OPERATION\n\n6. Positioned\n6.1 Speed (5 km to 15 km / hr.)\n6.2 Boom at 45 degree angle\n6.3 Spreader is secured\n7. Lifting and stacking\nprocedures\n7.1 Spot container and engage twist lock\n7.2 Lift / stack according to sequence plan\n7.3 Follow stacker “de-rating” requirement\n8. Established /\nrecommended\npractices\n8.1 Twist lock indicator light is “off” when spreader is engaged\nwith container\n8.2 Required boom angle is maintained while lifting and\nstacking container\n8.3 Warning buzzer is activated while in operation\n8.4 Spreader is handled in accordance to operation and\n maintenance manual\n9. Work accomplishment\n9.1 Accomplishing shifting report form\n9.2 Digital communication radio\n10. Appropriate personnel\n10.1 Control officer\n10.2 Equipment supervisor\n10.3 Shifting supervisor\n11. Unexpected situations\nMay include but not limited to:\n11.1 Sudden engine breakdown\n11.2 Busted hydraulic hose and oil leakages\n11.3 Broken wire rope\n11.4 Sudden loss of brake\n11.5 Loss control of steering\n11.6 Force majeure e.g., earthquake, fire, tornado\n11.7 Operator fatigue or sickness/condition\n11.8 Adverse environmental condition\n11.9 Accidents/incidents\n11.10 Failure of warning and sensor devices\n11.12 Twist lock failure\n11.13 Deteriorated container casting corner\n\n--- PDF PAGE 55 ---\nTR HEAVY EQUIPMENT OPERATION\n\nEVIDENCE GUIDE\n1. Critical aspects of\nevidence to be\nconsidered\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to interpret work assignment\n1.2 Demonstrates ability to follow safe work operation\n1.3 Demonstrates ability to identify and prevent unsafe working\nconditions\n1.4 Demonstrates ability to read and 