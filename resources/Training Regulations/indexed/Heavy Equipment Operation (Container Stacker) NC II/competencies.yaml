          "source_text": "1. Critical aspects of\nevidence to be\nconsidered\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to interpret work assignment\n1.2 Demonstrates ability to follow safe work operation\n1.3 Demonstrates ability to identify and prevent unsafe working\nconditions\n1.4 Demonstrates ability to read and interpret load chart\n1.5 Demonstrates ability to operate stacker following safe\nprocedures\n1.7 Demonstrates ability to communicate and work in a team\nenvironment\n2. Underpinning (related)\nknowledge and attitude\n\n2.1 Interpret work plan\n2.2 Safe work procedures and practices\n2.3 Understand load chart\n2.4 Company rules and regulations\n2.5 Familiarity with job site / location\n2.6 Basic mathematics\n2.7 Defensive driving and access route\n2.8 Lifting and stacking procedures\n2.9 Positive values (time and cost conscious, customer relation\netc.)\n2.10 Radio communication\n2.11 Procedures for container stacker to load to and unload\nfrom low-bed trailer\n3. Underpinning skills\n\n3.1 Interpreting work plan\n3.2 Following safe work procedures and practices\n3.3 Understanding load chart\n3.4 Following company rules and regulations\n3.5 Knowing job site / location\n3.6 Applying basic mathematics\n3.7 Following defensive driving and access route\n3.8 Following lifting and stacking procedures based on\nrecommended / established practices\n3.9 Communicating\n3.10 Performing procedures for container stacker to load to\nand unload from low-bed trailer\n4. Resource implications\n\nThings necessary for the conduct of assessment\n4.1 Access to container stacker and job site / location\n4.2 Container load\n4.3 Barricades and informative signage\n4.4 PPE\n4.2 Digital hand-held radio\n\n--- PDF PAGE 56 ---\nTR HEAVY EQUIPMENT OPERATION\n\n5. Method of assessment\n\nCompetency in this unit must be assessed through\n5.1 Written/Oral questioning\n5.2 Observation of practical demonstration\n5.3 Work record and documents\n6. Context for\nassessment\n\n6.1 Assessment maybe conducted in the work site or in a\n simulated venue.\n6.2 Competency shall be assessed while the task is being\n undertaken independently\n\n--- PDF PAGE 57 ---\nTR HEAVY EQUIPMENT OPERATION"
