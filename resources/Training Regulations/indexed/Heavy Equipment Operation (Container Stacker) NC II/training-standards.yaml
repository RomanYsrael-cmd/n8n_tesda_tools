    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: HEAVY EQUIPMENT OPERATION (CONTAINER STACKER)\nNC Level: NC II\n\nCourse Description:\n\n This course is designed to equip individual with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation (Container stacker) NC II.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 58 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMMON COMPETENCIES\n(24 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Interpret\ntechnical\ndrawings and\nplans\n\n1.1 Read / Interpret blueprints\n and plans\n1.2 Perform freehand\nsketching\nLecture\nDemonstration\nPractical\nexercises\n\nDemonstration\nand oral\nquestioning\nWritten test\n\n2. Observe\nprocedures,\nspecifications\nand manuals of\ninstructions.\n2.1 Identify and access\n specifications / technical\n manuals\n2.2 Interpret technical\nmanuals\n2.3 Apply information in\ntechnical manual\n2.4 Store technical manual\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n3. Perform\n mensurations\n and calculations\n\n3.1 Select measuring\n instruments\n3.2 Carryout measurement and\n calculations\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n4. Maintain tools\nand equipment\n4.1 Check condition of tools\n and equipment\n4.2 Perform preventive\n maintenance\n4.3 Store tools and equipment\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n5. Prepare\nconstruction\nmaterials and\ntools\n5.1 Identify Materials\n5.2 Request Materials\n5.3 Receive and inspect\nmaterials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n\n--- PDF PAGE 59 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCORE COMPETENCIES\n(80 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre-\nand post\noperation\nchecking\nprocedure for\ncontainer\nstacker\n1.1 Identify types of container\nstacker components\nstructure\n1.2 Perform visual check of\nequipment\n1.3 Check container stacker\nsystems functions\n1.4 Perform post-operation\n procedures\n• Lecture\n• Practical /\nDemonstration\n\n• Observation/\nDemonstration\nwith interview\n• Written test\n\n2. Perform basic\npreventive\nmaintenance\nservicing for\ncontainer\nstacker\n2.1 Perform safety practices and\nhousekeeping\n2.2 Perform basic\n preventive maintenance\n servicing\n• Lecture\n• Practical /\nDemonstration\n\n• Observation/\nDemonstration\nwith interview\n• Written test\n\n3. Perform\nproductive\noperation for\ncontainer\nstacker\n3.1 Interpret work instruction and\ncheck / inspect operational\narea\n3.2 Perform container stacker\noperations\n• Lecture\n• Practical /\nDemonstration\n\n• Observation/\nDemonstration\nwith interview\n• Written test\n\n--- PDF PAGE 60 ---\nTR HEAVY EQUIPMENT OPERATION"
  },
