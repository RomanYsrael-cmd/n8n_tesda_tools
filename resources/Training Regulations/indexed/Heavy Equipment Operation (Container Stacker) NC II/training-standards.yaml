  "source_section_text": "SECTION 3\nTRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational\nEducation and Training (TVET) providers with information and other important\nrequirements to consider when designing training programs for HEAVY\nEQUIPMENT OPERATION (CONTAINER STACKER) NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: HEAVY EQUIPMENT OPERATION (CONTAINER STACKER)\nNC Level: NC II\n\nCourse Description:\n\n This course is designed to equip individual with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation (Container stacker) NC II.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 58 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMMON COMPETENCIES\n(24 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Interpret\ntechnical\ndrawings and\nplans\n\n1.1 Read / Interpret blueprints\n and plans\n1.2 Perform freehand\nsketching\nLecture\nDemonstration\nPractical\nexercises\n\nDemonstration\nand oral\nquestioning\nWritten test\n\n2. Observe\nprocedures,\nspecifications\nand manuals of\ninstructions.\n2.1 Identify and access\n specifications / technical\n manuals\n2.2 Interpret technical\nmanuals\n2.3 Apply information in\ntechnical manual\n2.4 Store technical manual\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n3. Perform\n mensurations\n and calculations\n\n3.1 Select measuring\n instruments\n3.2 Carryout measurement and\n calculations\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n4. Maintain tools\nand equipment\n4.1 Check condition of tools\n and equipment\n4.2 Perform preventive\n maintenance\n4.3 Store tools and equipment\nLecture\nDemonstration\nPractical\nexercises\nDemonstration\nand oral\nquestioning\nWritten test\n\n5. Prepare\nconstruction\nmaterials and\ntools\n5.1 Identify Materials\n5.2 Request Materials\n5.3 Receive and inspect\nmaterials\nAudio Visual\nSimulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect\nobservation\nQuestions or\ninterview\nPortfolio\n(credentials)\nWritten / Oral\nTest\nDemonstration\n\n--- PDF PAGE 59 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCORE COMPETENCIES\n(80 hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre-\nand post\noperation\nchecking\nprocedure for\ncontainer\nstacker\n1.1 Identify types of container\nstacker components\nstructure\n1.2 Perform visual check of\nequipment\n1.3 Check container stacker\nsystems functions\n1.4 Perform post-operation\n procedures\n• Lecture\n• Practical /\nDemonstration\n\n• Observation/\nDemonstration\nwith interview\n• Written test\n\n2. Perform basic\npreventive\nmaintenance\nservicing for\ncontainer\nstacker\n2.1 Perform safety practices and\nhousekeeping\n2.2 Perform basic\n preventive maintenance\n servicing\n• Lecture\n• Practical /\nDemonstration\n\n• Observation/\nDemonstration\nwith interview\n• Written test\n\n3. Perform\nproductive\noperation for\ncontainer\nstacker\n3.1 Interpret work instruction and\ncheck / inspect operational\narea\n3.2 Perform container stacker\noperations\n• Lecture\n• Practical /\nDemonstration\n\n• Observation/\nDemonstration\nwith interview\n• Written test\n\n--- PDF PAGE 60 ---\nTR HEAVY EQUIPMENT OPERATION\n\n 3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards\nand the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n•\nThe dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school and\nin-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\n•\nModular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer facilitates the training delivery\n•\nPeer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach\nin training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire\nspecific competencies prescribed in the training regulations.\n\n--- PDF PAGE 61 ---\nTR HEAVY EQUIPMENT OPERATION\n\n•\nDistance learning is a formal education process in which majority\nof the instruction occurs when the students and instructor are not\nin the same place. Distance learning may employ correspondence\nstudy, or audio, video or computer technologies.\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n•\nCan communicate both oral and written\n•\nPhysically and mentally fit\n•\nWith good moral character\n•\nCan perform basic mathematical computation.\n\n--- PDF PAGE 62 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nBelow is the recommended list of tools, equipment and materials for the\ntraining of 25 trainees for the operation of container stacker.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n.\nITEM\nQTY.\nITEM\nQTY.\nITEM\n1\nset\n• Wrenches (box and\nopen-end 8-24 mm-\n metric & 7/16 –\n 1” -English )\n1 unit • Container\nStacker(MOA /\nrental)\n5 kilos • Multi-purpose\ngrease\n1\nset\n• Hammer, ball peen\n(3-4 lbs)\n1 unit • Low bed trailer with\ntractor head &\noperator (MOA/\nrental)\n4 liters • Engine oil (SAE\n15w40)\n1\nset\n• Pliers (mechanical\n10“)\n20\nliters\n• Hydraulic /\nsteering fluid\n(TELLUS\n68/10W)\n1 pc\n\n• Adjustable wrench\n(18“)\n\n10\nliters\n• Final drive/\ndifferential (gear\noil GP90/ 140)\n2 pc\n• Grease gun\n\n10\nliters\n• Transmission oil\n(ATF)\n\n--- PDF PAGE 63 ---\nTR HEAVY EQUIPMENT OPERATION\n\n1\nset\n• Screw driver (10 “ flat\n& Philips)\n\n1 liter\n•\n Brake fluid\n(DOT –4)\n5 ps •Putty knife\n\n4 liters •\nWater coolant\n1 pc • Pry bar (heavy duty)\n\n200\nliters\n•\nDiesel fuel\n1 pc • Pipe wrench (12”)\n\n5 pcs\n•\nBattery -\ndistilled water\n1 pc • Vise grip (12 “)\n\n1 set\n•\nPrimary &\nSecondary air\nfilter\n\n1 set\n• Primary &\nsecondary fuel\nfilter\n\n1 pc\n•Water separator\n\n1 set\n• Belts (air-con,\nwater pump and\nalternator)\n\n2 cans\n• Penetrating oil\n(250 ml)\n\n2 kilos •Cotton rugs\n\n5 liters •Cleaning solvent\n\nSet\n• Cleaning tool (one\neach kind)\n\n1 pair\n•Working Clothes\n\n10\npairs\n• Safety shoes\n\n10\npairs\n• Gloves\n\n10 pcs •Goggles\n\n10 pcs •Dust Mask\n\n10 pcs •Hard hats\n\n1 pc\n• Operator’s\nmanual\nNOTE: Implementation of the training program can be made possible through a MOA between the\ntraining school and industry\n\n--- PDF PAGE 64 ---\nTR HEAVY EQUIPMENT OPERATION\n\n3.5\nTRAINING FACILITIES\n\nThe container stacker operation workshop must be made of reinforced\nconcrete or steel structure. The size must be suited on the requirements of the\ncompetencies. The class size of 25 students/trainees is reserved for the lecture\nroom and the practical demonstration area for carrying out minor Container\nStacker parts maintenance. Most of the learning activities are performed\nindividually in the students/trainees work area.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n• Student/Trainee’s Working\nSpace\n\n4 sq.m per\nstudent\n100.0 sq.m.\n•\nLecture Room\n\n48.00\n48.0\n•\nLearning Resource Center\n\n24.00\n24.0\n172\n• Facilities/Equipment/\nCirculation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n224\nWorking field\n0.5 hectare (MOA/Rental)\n\n3.6 TRAINER’S QUALIFICATIONS\n HEAVY EQUIPMENT OPERATION (CONTAINER STACKER)\n\n• Must be a holder of Heavy Equipment Operation (Container\nStacker) NC II\n• Must have undergone training on Training Methodology II (TM\nII)\n• Must be physically and mentally fit\n• *Must have at least 5 years job/industry experience*\n• Must be a civil service eligible (for government position or\nappropriate professional license issued by the Professional\nRegulatory Commission)\n\n * Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n--- PDF PAGE 65 ---\nTR HEAVY EQUIPMENT OPERATION"
