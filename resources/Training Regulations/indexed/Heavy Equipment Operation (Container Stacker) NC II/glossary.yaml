      "term": "For the purpose of this Competency Standard, the words",
      "definition": "1. Attachment Refers to anything like clamshell, drag line, boring (drilling) equipment, pile driver, drop hammer of other accessories/special attachments used instead of the conventional lift block to perform different types of lifting jobs. 2. Boom Refers to the telescopic hydraulic structure used for supporting and hoisting. 3. Boom length Refers to the measurement from the boom foot pins to the center of the boom point sheaves. 4. Container stacker Refers to a container handling equipment of a top loader and reach stacker type used for lifting and stacking empty and loaded container inside the terminal. 5. Reach stacker Refers to a container handling equipment capable to stack four high containers fitted with a lifting (telescopic) boom and adjustable spreader. 6. Top loader Refers to a container handling equipment capable to stack four high containers fitted with a mast and spreader attached to it. 7. Spreader Refers to a rectangular steel frame of 20 ft. or 40 ft. locked onto the stacker head block suspended from the wire hoisting ropes boom and attached to the container top corner fittings. 8. Twist lock It is a cone shape device attached to the four lower corner of the spreader that is landed and engaged on the top of container fittings for hoisting and lifting container. 9. Flipper Is a remote control guides attached to the four corners of the container which helps the operator to and the spreader squarely on top of it for the twist lock easy engagement."
    }
