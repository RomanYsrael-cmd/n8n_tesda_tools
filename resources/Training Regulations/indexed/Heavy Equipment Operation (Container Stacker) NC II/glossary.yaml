  "source_text": "For the purpose of this Competency Standard, the words\n\n1. Attachment\nRefers to anything like clamshell, drag line, boring (drilling)\nequipment, pile driver, drop hammer of other accessories/special\nattachments used instead of the conventional lift block to perform\ndifferent types of lifting jobs.\n2. Boom\nRefers to the telescopic hydraulic structure used for supporting\nand hoisting.\n3. Boom length\nRefers to the measurement from the boom foot pins to the center\nof the boom point sheaves.\n4. Container\nstacker\nRefers to a container handling equipment of a top loader and\nreach stacker type used for lifting and stacking empty and loaded\ncontainer inside the terminal.\n5. Reach stacker\nRefers to a container handling equipment capable to stack four\nhigh containers fitted with a lifting (telescopic) boom and\nadjustable spreader.\n6. Top loader\nRefers to a container handling equipment capable to stack four\nhigh containers fitted with a mast and spreader attached to it.\n7. Spreader\nRefers to a rectangular steel frame of 20 ft. or 40 ft. locked onto\nthe stacker head block suspended from the wire hoisting ropes\nboom and attached to the container top corner fittings.\n8. Twist lock\nIt is a cone shape device attached to the four lower corner of the\nspreader that is landed and engaged on the top of container\nfittings for hoisting and lifting container.\n9. Flipper\nIs a remote control guides attached to the four corners of the\ncontainer which helps the operator to and the spreader squarely\non top of it for the twist lock easy engagement.\n\n--- PDF PAGE 68 ---\nTR HEAVY EQUIPMENT OPERATION",
