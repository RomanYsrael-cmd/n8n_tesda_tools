  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1 To attain the National Qualification of HEAVY EQUIPMENT OPERATION\n(Container Stacker) NC II, the candidate must demonstrate competence in\nall the units of competency in Section 1. The successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2 The qualification of HEAVY EQUIPMENT OPERATION (Container\nStacker) NC II maybe attained through demonstration of competence in a\nproject-type assessment covering the following core units.\n\n4.2.1\nCONTAINER STACKER OPERATION\n\n\nPerform pre- and post-operation procedures for materials\nhandling equipment\n\nPerform productive operation for container stacker\n\nPerform basic machine preventive maintenance servicing\n\n4.3 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n4.4.1\nGraduates of formal, non-formal and/or informal training including\nenterprise-based training programs\n\n4.4.2\nExperienced Workers (wage-employed or self-employed)\n\nThe guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS).\"\n\n--- PDF PAGE 66 ---\nTR HEAVY EQUIPMENT OPERATION\n\nCOMPETENCY MAP\nCONSTRUCTION-HEAVY EQUIPMENT OPERATION -\nSUB- SECTOR\nBASIC\nInspect\nrigging\ngears\nPerform productive\noperation for\nhydraulic excavator\nPerform productive\noperation for truck-\nmounted crane\nPerform productive\noperation for tower crane\nPerform productive\noperation for forklift\nInstall\nrigging\ngears\nPerform productive\noperation for\ncontainer stacker\nPerform pre- and post-\noperation procedures for\nlifting equipment\nPerform basic\npreventive maintenance\nservicing for hauling\nPerform productive\noperation for off-\nhigh way dump\ntruck (articulated)\nPerform productive\noperation for\nbulldozer\nPerform productive\noperation for wheel\nloader\nPerform productive\noperation for motor\ngrader\nPerform pre- and post-\noperation procedures for\nhauling equipment\nPerform productive\noperation for road\nroller\nPerform basic preventive\nmaintenance servicing for\ncontainer stacker\nAssist\ncrane\noperator\nPerform pre- and post-\noperation procedures for\nmaterials handling moving\nPerform productive\noperation for\ncrawler crane\nPerform basic preventive\nmaintenance servicing for\nearth moving equipment\nPerform productive\noperation for rough-\nterrain crane\nPerform productive\noperation for off-highway\ndump truck (rigid)\nPerform productive\noperation for\nconcrete pump\nPerform productive\noperation for paver\nPerform basic preventive\nmaintenance servicing for\nconcreting and asphalting\nequipment\nPerform productive\noperation for on-\nhighway dump truck\n(rigid)\nPerform pre- and post-\noperation procedures for\nconcreting and asphalting\nequipment\nPerform productive\noperation for transit\nmixer\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\nBASIC\nCOMPETENCIES\nReceive and respond\nto workplace\ncommunication\nWork with others\nUse relevant\ntechnologies\nPractice career\nprofessionalism\nUtilize specialized\ncommunication\nskills\nPractice occupational\nhealth and safety\nprocedures\nDevelop teams and\nindividuals\nLead workplace\ncommunication\nDemonstrate work\nvalues\nSolve problems\nrelated to work\nactivities\nDevelop and\npractice negotiation\nskills\nPractice\nhousekeeping\nprocedure (5s)\nUse mathematical\nconcepts and\ntechniques\nWork in a team\nenvironment\nParticipate in\nworkplace\ncommunication\nApply problem-\nsolving techniques\nin the workplace\nPlan and organize\nwork\nCollect, analyze\nand organize\ninformation\nLead small team\nPromote\nenvironmental\nprotection\nPerform\nmensurations and\ncalculations\nObserve procedures,\nspecifications and\nmanual of instructions\nInterpret technical\ndrawings and plans\nInterpret technical\ndrawings and plans\nPrepare construction\nmaterials and tools\n\n--- PDF PAGE 67 ---\nTR HEAVY EQUIPMENT OPERATION\n\nDefinition of Terms\n\nFor the purpose of this Competency Standard, the words\n\n1. Attachment\nRefers to anything like clamshell, drag line, boring (drilling)\nequipment, pile driver, drop hammer of other accessories/special\nattachments used instead of the conventional lift block to perform\ndifferent types of lifting jobs.\n2. Boom\nRefers to the telescopic hydraulic structure used for supporting\nand hoisting.\n3. Boom length\nRefers to the measurement from the boom foot pins to the center\nof the boom point sheaves.\n4. Container\nstacker\nRefers to a container handling equipment of a top loader and\nreach stacker type used for lifting and stacking empty and loaded\ncontainer inside the terminal.\n5. Reach stacker\nRefers to a container handling equipment capable to stack four\nhigh containers fitted with a lifting (telescopic) boom and\nadjustable spreader.\n6. Top loader\nRefers to a container handling equipment capable to stack four\nhigh containers fitted with a mast and spreader attached to it.\n7. Spreader\nRefers to a rectangular steel frame of 20 ft. or 40 ft. locked onto\nthe stacker head block suspended from the wire hoisting ropes\nboom and attached to the container top corner fittings.\n8. Twist lock\nIt is a cone shape device attached to the four lower corner of the\nspreader that is landed and engaged on the top of container\nfittings for hoisting and lifting container.\n9. Flipper\nIs a remote control guides attached to the four corners of the\ncontainer which helps the operator to and the spreader squarely\non top of it for the twist lock easy engagement.\n\n--- PDF PAGE 68 ---\nTR HEAVY EQUIPMENT OPERATION\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies and who contributed their\ntime and expertise to the development and validation of this Training\nRegulations.\n\n• THE TECHNICAL EXPERT PANEL (TEP)\n\nFERNANDO B. SEVA\nTraining Manager\nPPA Management\nAUGUSTO S. BUYAO\nTraining Manager\nMaxima Equipment Co. Inc.\n\nTITO C. TADIOS\nTraining Manager (Heavy Equipment\nOperation and Maintenance)\nMonark Equipment Co. Inc\n\nRUDOLFO D. ANCHETA\nQuality Controller Supervisor (Repair\nand Maintenance of Hydraulic\nExcavator/Basic Hydraulic)\nCivil Merchanidising Inc.\nFLORELLO P. QUIANZON\nConsultant, Equipment Concrete Product\nDivision (Equipment Management)\nMakati Development Corporation\nEDUARDO C. EMAS\nTrainor\nConstruction Manpower Development\nCenter\nSAMUEL M. PUQUIZ\nHead, Mechanical and Technical\n(Construction Equipment Repair and\nMaintenance)\nDM Consunji Inc.\n\nThe Management and Staff of the TESDA Secretariat\n\nQualifications and Standards Office\n\nThe Management and Staff of the ACEL Secretariat"
}
