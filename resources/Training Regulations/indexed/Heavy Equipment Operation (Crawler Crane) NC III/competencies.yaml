\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Perform visual check\nof crawler crane\n\n1.1 Capacity of crawler\ncrane is selected based\non job requirements.\n1.2 Operator-serviceable\n(OS) parts are checked\nin accordance with\nequipment checklist and\nmanufacturer’s\nprocedures.\n1.3 Walk-around check is\nperformed with\nequipment checklist and\nwith engine stopped/not\nrunning.\n1.4 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety and\nHealth Standards\n1.5 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 and\n42)\n1.6 Required output is\ncompleted based on\naccomplished checklist.\n\n1.1 DOLE\nDepartment Order\nNo. 13 s. 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n1.2 Procedures in\nconducting visual\ncheck\n1.3 Computation of\nload versus\ncapacity of\ncrawler crane\n1.4 Functions of parts\nand components\nof crawler crane\n1.5 Factors affecting\nproductivity\n1.6 Productivity work\nmeasurements\n1.7 Ways of\nimproving\nproductivity\n\n1.1 Following visual\nand inspection\nprocedures\n1.2 Calculating load\nand capacity of\ncrawler crane\n1.3 Identifying parts\nand components\nof crawler crane\nand its functions\n1.4 Accomplishing\nchecklist\n1.5 Using PPE\n1.6 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 66 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n61\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Perform\n “B L O W A F”\n check\n\n2.1 “BLOWAF” check is\nperformed using\nchecklist with engine\nstopped/not running.\n2.2 Fluid levels are\nmaintained in\naccordance with\nequipment maintenance\nmanual.\n2.3 Abnormal conditions\nnoted in checklist and\nreported to aut