 (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n75\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed adjustment or replacement for noted defects\n1.2 Performed basic preventive maintenance servicing (PMS)\n1.3 Prepare equipment reports\n1.4 Observed safety measures applicable to worksite operation\n1.5 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Access to crawler crane and manuals\n2.2 Access to crawler crane and lifting gears\n2.3 Basic hand tools and portable powered tools\n2.4 Fluids and lubricants\n2.5 PPE\n2.6 Safety signage/barricades\n3. Method of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Direct observation/Demonstration with oral questioning\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 81 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n76\nUNIT OF COMPETENCY\n:\nPERFORM PRODUCTIVE OPERATION FOR\nCRAWLER CRANE\n\nUNIT CODE\n\n:\nCON834309\n\nUNIT DESCRIPTOR\n\n:\nThis unit involves the knowledge, skills and attitudes\nin traveling, loading and unloading to low-bed trailer,\nsetting-up, interpreting load chart and lifting operation\nfor crawler crane.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Travel the crawler\ncrane\n\n1.1 Road conditions are\nconsidered before\ntravelling the crane\n1.2 Work area is surveyed\nfor potential hazards\nin accordance with safe\noperating procedures.\n1.3 Boom is secured and\nin place during travel in\naccordance with\nmanufacturers manual.\n1.4 Travel speed is\nobserved in accordance\nwith traffic rules and\nregulations\n1.5 Aid of a rigger is\nrequired on the entire\noperation in\naccordance with\nstandard operating\nprocedures.\n1.6 Unexpected\nsituations are\nresponded in line with\ncompany rules and\nregulations\n1.7 Personal Protective\n Equipment (PPE) is\n used in accordance with\n Rule 1080 of\n Occupational Safety and\n Health Standards\n\n1.1 DOLE\nDepartment Order\nNo. 13 s. 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n1.2 Traffic rules and\nregulations\n1.3 Site and weather\nconditions\n1.4 Road worthiness\n1.5 Clearance and\ndistances\n1.6 Speed limit\n1.7 Procedures in\noperating,\ntravelling of\ncrawler crane\n1.8 Factors affecting\nproductivity\n1.9 Productivity work\nmeasurements\n1.10\nWays of\nimproving\nproductivity\n\n1.1 Interpreting and\nfollowing traffic\nrules and\nregulations\n1.2 Driving skills\n1.3 Travelling the\ncrane\n1.4 Using PPE\n1.5 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 82 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n77\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Load and unload\ncrawler crane to\nlow-bed trailer\n2.1 Low-bed trailer for\ntransporting the crawler\ncrane is selected\naccording to job\nrequirements.\n2.2 Boom position is\nsecured during loading\nand unloading in\naccordance with\nmanufacturer’s\nrecommendations\n2.3 Crawler crane\ncomponents and\nattachments are\npositioned and secured\nbased on\nmanufacturer’s\nrecommendations.\n2.4 Verbal instructions and\nhand signals are\nconveyed with\nauthorized rigger during\nloading and unloading\nas per standard\noperating procedures.\n2.5 All safety locks and\ncontrol levers are\nsecured at neutral\nposition before and after\nloading based on\nmanufacturer’s\nspecifications\n2.6 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n\n2.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n2.2 Hand signals\n2.3 Site and weather\nconditions\n2.4 Clearance and\ndistances\n2.5 Procedures in\nloading and\nunloading\n2.6 Factors affecting\nproductivity\n2.7 Productivity work\nmeasurements\n2.8 Ways of\nimproving\nproductivity\n\n2.1 Interpreting verbal\ninstructions and\nhand signals\n2.2 Operating skills in\nloading and\nunloading crawler\ncrane to low-bed\ntrailer\n2.3 Using PPE\n2.4 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 83 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n78\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Set-up crawler\ncrane\n\n3.1 Site conditions are\nconsidered before\nsetting up the crane\n3.2 Crane is set-up and\npositioned in\naccordance with\nmanufacturer’s manual\n3.3 Unexpected situations\nare responded in line\nwith company rules and\nregulations\n3.4 Personal Protective\nEquipment (PPE) is used\nin accordance with Rule\n1080 of Occupational\nSafety and Health\nStandards\n3.1 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n3.2 Hand signals\n3.3 Site and weather\nconditions\n3.4 Clearance and\ndistances\n3.5 Procedures in\nsetting up the\ncrane\n3.6 Factors affecting\nproductivity\n3.7 Productivity work\nmeasurements\n3.8 Ways of\nimproving\nproductivity\n\n3.1 Setting up the\ncrawler crane\n3.2 Interpreting and\nfollowing hand\nsignals\n3.3 Using PPE\n3.4 Applying\nproductive\nmethods and\ntechniques\n\n4. Interpret load chart\nand /or load\nmoment indicator\nand construct lifting\nplan\n\n4.1 Weight of the load is\ndetermined according\nto load specification.\n4.2 Lifting capacity is\ndetermined according to\nworking radius, boom\n