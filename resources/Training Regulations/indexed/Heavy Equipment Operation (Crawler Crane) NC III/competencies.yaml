        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed visual check of crawler crane\n1.2 Performed “BLOWAF” check\n1.3 Performed visual check for super structure, lower structure and\npower train components\n1.4 Performed operation check\n1.5 Observed safety measures applicable to worksite operation\n1.6 Communicated effectively with others to ensure effective work\noperation\n2.1 Resource\nImplications\n\nThe following resources should be provided:\n2.1 Work area for crawler crane operation\n2.2 Access to crawler crane and manuals\n2.3 Basic hand tools and portable powered tools\n2.4 PPE\n2.5 Safety signage/barricades\n2.2 Method of\nAssessment\n\nCompetency in this unit may be assessed through\n3.1 Written examination\n3.2 Direct observation/Demonstration with oral questioning\n\n2.3 Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 74 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n69\nUNIT OF COMPETENCY\n:\nPERFORM BASIC PREVENTIVE MAINTENANCE\nSERVICING FOR CRAWLER CRANE\n\nUNIT CODE\n\n:"
        },
        "source_text": "CON834307\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes in\nperforming visual and operation check before and after\nproductive operation of crawler crane.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Perform visual check\nof crawler crane\n\n1.1 Capacity of crawler\ncrane is selected based\non job requirements.\n1.2 Operator-serviceable\n(OS) parts are checked\nin accordance with\nequipment checklist and\nmanufacturer’s\nprocedures.\n1.3 Walk-around check is\nperformed with\nequipment checklist and\nwith engine stopped/not\nrunning.\n1.4 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety and\nHealth Standards\n1.5 Work area is cleaned\naccording to safety and\nenvironmental\nregulations (e.g. PD\n1152 Section 6, 8 and\n42)\n1.6 Required output is\ncompleted based on\naccomplished checklist.\n\n1.1 DOLE\nDepartment Order\nNo. 13 s. 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n1.2 Procedures in\nconducting visual\ncheck\n1.3 Computation of\nload versus\ncapacity of\ncrawler crane\n1.4 Functions of parts\nand components\nof crawler crane\n1.5 Factors affecting\nproductivity\n1.6 Productivity work\nmeasurements\n1.7 Ways of\nimproving\nproductivity\n\n1.1 Following visual\nand inspection\nprocedures\n1.2 Calculating load\nand capacity of\ncrawler crane\n1.3 Identifying parts\nand components\nof crawler crane\nand its functions\n1.4 Accomplishing\nchecklist\n1.5 Using PPE\n1.6 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 66 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n61\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Perform\n “B L O W A F”\n check\n\n2.1 “BLOWAF” check is\nperformed using\nchecklist with engine\nstopped/not running.\n2.2 Fluid levels are\nmaintained in\naccordance with\nequipment maintenance\nmanual.\n2.3 Abnormal conditions\nnoted in checklist and\nreported to authorized\nperson\n2.4 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety and\nHealth Standards\n2.5 Required output is\ncompleted based on\naccomplished checklist.\n2.1 Procedures in\nperforming\n“BLOWAF” check\n2.2 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n2.3 Waste disposal\nprocedures\n2.4 Fluid’s level and\ncontamination\n2.5 Factors affecting\nproductivity\n2.6 Productivity work\nmeasurements\n2.7 Ways of improving\nproductivity\n\n2.1 Accomplishing\nchecklist\n2.2 Applying waste\ndisposal\nprocedures\n2.3 Performing\n“BLOWAF”\nchecking\nprocedures\n2.4 Determining fluid\nlevel and\ncontamination\n2.5 Using PPE\n2.6 Applying\nproductive\nmethods and\ntechniques\n\n3. Perform visual check\nfor super structure,\nlower structure and\npower train\ncomponents\n3.1 Super structure, lower\nstructure and power\ntrain components are\nchecked in accordance\nwith checklist and\nmanufacturer’s\nprocedures\n3.2 Super structure, lower\nstructure and power\ntrain components are\nsecured for safety lifting\noperation\n3.3 Abnormal conditions are\nnoted in checklist and\nreported to authorized\nperson\n3.4 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety and\nHealth Standards\n3.5 Required output is\ncompleted based on\naccomplished checklist.\n3.1 Procedures in\nvisual check for\nsuper structure,\nlower structure and\npower train\ncomponents\n3.2 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n3.3 Functions of super\nstructure, lower\nstructure and\npower train\ncomponents\n3.4 Factors affecting\nproductivity\n3.5 Productivity work\nmeasurement\n3.6 Ways of improving\nproductivity\n3.1. Accomplishing\nchecklist\n3.2. Performing visual\ncheck for super\nstructure, lower\nstructure and\npower train\ncomponents\n3.3. Identifying parts\nand functions of\nsuper structure,\nlower structure\nand power train\ncomponent\n3.4. Using PPE\n3.5. Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 67 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n62\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n4. Perform operation\ncheck\n\n4.1 Starting/running\ncheck/operation\ncheck is performed\nwith checklist and in\naccordance with\nmanufacturer’s\nrecommendations.\n4.2 Mechanical\ncomponents are\nchecked for normal\nfunctioning based on\nmanufacturer's\nspecifications.\n4.3 Function check is\nperformed with\nequipment checklist\nand while engine is\nrunning.\n4.4 Safety devices are\nchecked for proper\nfunctions in accordance\nwith safe operating\nprocedures\n4.5 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety and\nHealth Standards\n4.6 Required output is\ncompleted based on\naccomplished checklist.\n\n4.1 Start-up and\nwarming\nprocedures\n4.2 Procedures in\ninspection while\nthe engine is\nrunning\n4.3 DOLE\nDepartment Order\nNo. 13 s. 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n4.4 Warning signs\nand symbols\n4.5 Functions of all\ncomponents and\nsafety devices\n4.6 Factors affecting\nproductivity\n4.7 Productivity work\nmeasurements\n4.8 Ways of\nimproving\nproductivity\n\n4.1 Accomplishing\nchecklist\n4.2 Following\ninspection\nprocedures while\nthe engine is\nrunning\n4.3 Testing of\ncrawler crane\n4.4 Using PPE\n4.5 Applying\nproductive\nmethods and\ntechniques\n\n5. Perform post-\noperation\nprocedures\n5.1 Crawler crane is parked\nand turned off after\nproductive operation in\naccordance to\nmanufacturer’s manual\n5.2 Controls are set into\nneutral position and\nparking brakes are\nengaged in accordance\nto manufacturer’s\nmanual\n5.3 Safety locks and\nbrakes are all engaged\nin accordance\nmanufacturer’s manual\n5.4 Inspection is re-\nconducted while doing\nengine cool down\n5.1. Company rules\nand regulations\n5.2. Parking and\nshut-down\nprocedures\n5.3. DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n5.4. Factors affecting\nproductivity\n5.5. Productivity work\n5.1. Following rules\nand regulations\nin parking and\nshutting down\ncrawler crane\n5.2. Performing post-\noperation\nprocedures\n5.3. Accomplishing\nDETR\n5.4. Using PPE\n5.5. Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 68 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n63\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n5.5 Daily equipment time\nrecord/report (DETR) is\naccomplished/submitted\naccording to company\nrules and regulations\n5.6 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety and\nHealth Standards\nmeasurements\n5.6. Ways of\nimproving\nproductivity\n\n--- PDF PAGE 69 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n64\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Capacity of\ncrawler crane\nMay include:\n1.1 10 - 25 tons\n1.2 25 - 50 tons\n1.3 50 tons and above\n2. Operator\nserviceable parts\n(OS)\n\nMay include:\n2.1 Air cleaner\n2.2 Battery terminals/connection/clamp/case\n2.3 Fan belt\n2.4 Grease/lube points\n2.5 Fuel water separator\n2.6 Track adjustment\n2.7 Fuel tank\n2.8 Hydraulic and brake master cylinder\n2.9 Engine oil fan\n2.10 Lights\n2.11 Steering\n2.12 Radiator\n3. Walk-around\ncheck\n\nMay include:\n3.1 Engine off\n 3.1.1 Leaks\n 3.1.2 Worn out/damaged parts\n 3.1.3 Fluid levels\n 3.1.4 Loose parts and accessories (nuts/bolts/belts)\n 3.1.5 Missing parts and accessories\n 3.1.6 Pulleys (gantry and boom end)\n 3.1.7 Hook block assembly\n 3.1.7.1 Sheaves\n 3.1.7.2 Hook and latch\n 3.1.8 Wire rope cable/clip\n 3.1.9 Levers and controls\n 3.1.9.1 Hoist\n 3.1.9.2 Pedals\n 3.1.9.3 Hand brake\n 3.1.9.4 Swing\n 3.1.12 Counter weight\n\n--- PDF PAGE 70 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n65\n\nVARIABLE\nRANGE\n\n3.2 Engine on\n3.2.1 Gauges and controls\n3.2.2 Safety devices\n3.2.3 Oil and air leaks\n3.2.4 Working equipment function\n▪\nBoom\n▪\nHoist\n▪\nPedals\n▪\nHand brake\n▪\nSwing\n 3.2.5 Electrical lighting system\n4. Personal\nProtective\nEquipment\n(PPE)\nMay include:\n4.1 Hard hat\n4.2 Goggles\n4.3 Gloves\n4.4 Safety shoes\n4.5 Safety vest\n5. B L O W A F\ncheck\n\nMay include:\n5.1 Battery (starting and charging system)\n5.2 Light (lighting system)\n5.3 Oil (lubricating system)\n5.4 Water (cooling system)\n5.5 Air (intake and exhaust system)\n5.6 Fuel (fuel system)\n6. Fluid\nMay include:\n6.1 Engine oil\n6.2 Hydraulic oil\n6.3 Radiator coolant/radiator\n6.4 Battery electrolyte/distilled water\n6.5 Brake/clutch fluid\n6.6 Gear oil\n6.7 Fuel\n6.8 Torque converter oil\n6.9 Automatic transmission fluid\n7. Authorized\nperson\nMay include:\n7.1 Equipment Supervisor\n7.2 Equipment Dispatcher/Foreman\n7.3 Equipment Maintenance personnel\n\n--- PDF PAGE 71 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n66\nVARIABLE\nRANGE\n8. Super structure,\nlower structure\nand power train\ncomponents\nMay include:\nSuper structure components\n8.1 Boom\n8.2 Extension Boom and Jibs\n8.3 Hook\n8.4 Hoist (Main and Auxiliary)\n8.5 Counterweight\n8.6 Turntable\n8.7 Hydraulic motor (Main and Auxiliary)\n8.8 Slewing hydraulic motor\n8.9 Hydraulic cylinder (Boom)\n8.10 Hoist drum (Main and Auxiliary)\n8.11 Boom sheaves\n8.12 Anti-two block\nLower structure\n8.13 Under carriage\n 8.13.1 Track pads\n 8.13.2 Rollers\n 8.13.3 Hydraulic cylinders\n 8.13.4 Track link\n 8.13.5 Sprocket\nPower train\n8.14 Clutch and torque converter\n8.15 Travel motor\nVARIABLE\nRANGE\n9. Starting/running\ncheck/operation\ncheck\n\nMay include:\n9.1 Controls\n 9.1.1 Travel\n 9.1.2 Hoist\n 9.1.3 Swing\n 9.1.4 Boom\n9.2 Gauges\n 9.2.1 Hour meter\n 9.2.2 Battery charging\n 9.2.3 Pressure (oil and air)\n 9.2.4 Temperature (oil and water)\n 9.2.5 RPM (Tachometer)\n 9.2.6 Boom angle indicator\n 9.2.7 Fuel indicator\n 9.2.8 Speedometer\n 9.2.9 Hydraulic pressure\n9.3 Leaks in\n 9.3.1 Fuel\n 9.3.2 Engine oil\n 9.3.3 Hydraulic oil\n9.4 Electrical/switches\n 8.4.1 Lights\n 8.4.2 Horns\n 8.4.3 Wiper\n\n--- PDF PAGE 72 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n67\n10. Safety devices\nMay include:\n10.1 Load Moment Indicator (LMI)\n10.2 Anti two block (Limit switch)\n10.3 Automatic Crane Stopper (ACS)\n10.5 Back horn/warning horn\n10.6 Signal/stop light\n10.7 Blinkers\n10.8 Safety belt\n10.9 Parking brake\n10.10 Boom stopper\n10.11 Anemometer\n10.12 Ground connection near high tension wires\n11. Safety locks\nMay include:\n11.1 Swing lock\n11.2 Hoist lock\n11.3 Control lever lock\n11.4 Door lock\n\n--- PDF PAGE 73 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n68\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed visual check of crawler crane\n1.2 Performed “BLOWAF” check\n1.3 Performed visual check for super structure, lower structure and\npower train components\n1.4 Performed operation check\n1.5 Observed safety measures applicable to worksite operation\n1.6 Communicated effectively with others to ensure effective work\noperation\n2.1 Resource\nImplications\n\nThe following resources should be provided:\n2.1 Work area for crawler crane operation\n2.2 Access to crawler crane and manuals\n2.3 Basic hand tools and portable powered tools\n2.4 PPE\n2.5 Safety signage/barricades\n2.2 Method of\nAssessment\n\nCompetency in this unit may be assessed through\n3.1 Written examination\n3.2 Direct observation/Demonstration with oral questioning\n\n2.3 Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 74 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n69\nUNIT OF COMPETENCY\n:\nPERFORM BASIC PREVENTIVE MAINTENANCE\nSERVICING FOR CRAWLER CRANE\n\nUNIT CODE\n\n:"
