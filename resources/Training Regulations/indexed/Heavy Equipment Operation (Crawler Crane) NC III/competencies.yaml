hods of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation/Demonstration with Oral Questioning\n4. Context of\nassessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 60 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n55\n UNIT OF COMPETENCY\n:\nMAINTAIN TOOLS AND EQUIPMENT\n\nUNIT CODE\n\n:\nCON311204\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills and attitudes on\nchecking condition, performing preventive maintenance\nand storing of construction painting tools and\nequipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Check condition of\ntools and\nequipment\n\n1.1 Materials, tools\nand equipment\nare identified\naccording to\nclassification and\njob requirements\n1.2 Non-functional\ntools and\nequipment are\nsegregated and\nlabeled according\nto classification\n1.3 Safety of tools and\nequipment are\nobserved in\naccordance with\nmanufacturer's\ninstructions\n1.4 Condition of\nPersonal\nProtective\nEquipment (PPE)\nare checked in\naccordance with\nmanufacturer's\ninstructions\n\n1.1 Use of PPE\n1.2 Handling of tools\nand equipment\n1.3 Good\nhousekeeping\n1.4 Types and uses\nof lubricants\n1.5 Types and uses\nof cleaning\nmaterials\n\n1.1 Maintaining tools\nand equipment\n1.2 Handling of tools\nand equipment\n1.3 Identifying tools\nand equipment\ndefects\n\n--- PDF PAGE 61 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n56\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Perform basic\npreventive\nmaintenance\n2.1 Appropriate\nlubricants are\nidentified\naccording to types\nof equipment\n2.2 Tools and\nequipment are\nlubricated\naccording to\npreventive\nmaintenanc