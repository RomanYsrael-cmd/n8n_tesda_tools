        "source_text": "CON834308\n\nUNIT DESCRIPTOR\n\n:\nThis unit involves the knowledge, skills and attitudes\nrequired in cleaning/greasing, adjusting and replacing\noperator-serviceable (OS) parts of crawler crane.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform adjustment\nor replacement for\nnoted defects\n\n1.1 Minor defects are\nidentified and\nrepaired/replaced in\naccordance with\nmanufacturer’s\nprocedures.\n1.2 Basic hand tools and\nportable powered\ntools are selected\nbased on job\nrequirements.\n1.3 Major defects are\nidentified using checklist\nand referred to\nauthorized personnel\nfor action\n1.4 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n\n1.1 DOLE Department\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the Construction\nIndustry\n1.2 Waste disposal\nprocedures\n1.3 Volume/capacity\n1.4 Clearance and\ndistances\n1.5 Types of fluids and\nlubricants\n1.6 Procedures in\nperforming\nadjustments or\nreplacements for\nnoted defects.\n1.7 Types and uses of\nbasic hand tools\nand portable\npowered tools\n1.8 Structure and\nfunction of crawler\ncrane components\n1.9\nFactors affecting\nproductivity\n1.10 Productivity work\nmeasurements\n1.11 Ways of\nimproving\nproductivity\n\n1.1 Application of\ndifferent basic\nhand tools and\nportable powered\ntools\n1.2 Identifying\ndefects\n1.3 Performing\nadjustments or\nreplacements for\nminor defects\n1.4 Using PPE\n1.5 Applying\nproductive\nmethods and\ntechniques\n1.6 Implementing\nProper Waste\nManagement\n\n--- PDF PAGE 75 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n70\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Perform basic\npreventive\nmaintenance\nservicing (PMS)\n\n2.1 Operator’s\nServiceable parts are\nidentified and serviced\naccording to\nmanufacturer’s\nrecommendations.\n2.2 Standard parameters\nare checked according\nto manufacturer’s\nrecommendations.\n2.3 Fluids and lubricants\nare used based on\nmanufacturer’s\nrecommendations.\n2.4 Basic hand tools,\nportable powered tools\nand consumable\nmaterials are identified\nand used in\naccordance with job\nrequirements.\n2.5 Basic preventive\nmaintenance\nservicing (PMS) is\ncarried out in\naccordance with\nmanufacturer’s\nrecommendations and\nsite regulations\n2.6 Site conditions are\nconsidered during PMS\n2.7 Personal Protective\nEquipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards\n\n2.1 Understanding\nOperator’s\nMaintenance Manual\n(OMM)\n2.2 DOLE Department\nOrder No. 13 s. 1998\nGuidelines Governing\nOccupational Safety\nand Health in the\nConstruction Industry\n2.3 Site and weather\nconditions\n2.4 Waste disposal\nprocedures\n2.5 Volume/capacity\n2.6 Clearance and\ndistances\n2.7 Types of fluids and\nlubricants\n2.8 Procedures in basic\npreventive\nmaintenance\nservicing\n2.9 Types and uses of\nbasic hand tools and\nportable powered\ntools\n2.10 Factors affecting\nproductivity\n2.11 Productivity work\nmeasurements\n2.12 Ways of improving\nproductivity\n\n2.1 Performing\nbasic\npreventive\nmaintenance\nservicing\n(PMS)\n2.2 Application\nof basic hand\ntools and\nportable\npowered\ntools\n2.3 Application\nof fluids and\nlubricants\n2.4 Handling,\nsegregation\nand disposal\nof hazardous\nwaste\n2.5 Using PPE\n2.6 Applying\nproductive\nmethods and\ntechniques\n\n--- PDF PAGE 76 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n71\n\nELEMENT\nPERFORMANCE\nCRITERIA\nBold and Italicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Prepare equipment\nreports\n\n3.1 Equipment checklist is\naccomplished in\naccordance with\ncompany requirements\n3.2 Equipment defects are\nreported to authorized\npersonnel\n3.3 Document control\nprocedures is observed\nbased on company\nrequirements\n3.4 Personal Protective\nEquipment (PPE) is\nused in accordance with\nRule 1080 of\nOccupational Safety\nand Health Standards\n\n3.1 Completion of\nchecklist and\ndefects reports\n3.2 Document control\nprocedures\n3.3 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n\n3.1 Prepare and\naccomplish\nequipment report\n3.2 Using PPE\n\n--- PDF PAGE 77 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n72\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Minor defects\n\nMay include:\n1.1 Weak battery\n1.2 Track tension\n1.3 Belt tension\n1.4 Clogged air cleaner\n1.5 Defective radiator cap\n2. Basic hand tools\nand portable\npowered tools\nMay include:\n2.1 Hand tools\n 2.1.1 Wrenches\n 2.1.2 Pliers\n 2.1.3 Brush (steel, paint)\n 2.1.4 Grease gun\n 2.1.5 Hammer (ball-peen, rubber, test)\n 2.1.6 Vice grip\n 2.1.7 Meter tape\n 2.1.8 Screw driver (Philips and flat tip)\n2.1 Portable Powered Tools\n 2.2.1High pressure washer\n2.3 Air compressor\n3. Major defects\n\nMay include:\n3.1 Busted hydraulic hose\n3.2 Hard starting engine\n3.3 Excessive engine oil consumption\n3.4 Leakage on\n 3.4.1 Air\n 3.4.2 Fuel\n 3.4.3 Cooling\n 3.4.4 Hydraulic system\n3.5 Faulty gauges\n3.6 Damaged/broken pulley\n3.7 Incorrect/defective Load Moment Indicator (LMI)\n3.8 Defective/frayed wire rope\n3.9 Derail track link assembly\n3.10 Defective electrical components\n 3.10.1 Charging\n 3.10.2 Lighting\n 3.10.3 Starting\n3.10.4 Gauges\n4. Authorized\npersonnel\n\nMay include:\n4.1 Equipment supervisor\n4.2 Equipment Dispatcher/Foreman\n4.3 Equipment Maintenance personnel\n\n--- PDF PAGE 78 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n73\nVARIABLE\nRANGE\n5. Operator\nserviceable (OS)\nparts\n\nMay include:\n5.1 Battery clamps, battery distilled water\n5.2 Belts\n5.3 Filters\n 5.3.1 Air cleaner\n 5.3.2 Water fuel separator/drain valve\n5.3.3 Hydraulic filter\n5.3.4 Fuel filter\n5.4 All fluid caps\n5.5 All grease points and fittings\n5.6 Wire rope\n5.7 Track adjustment\n6. Standard\nparameters\nMay include:\n6.1 Oil pressure\n6.2 Air pressure\n6.3 Temperatures\n6.4 Tension\n6.5 Clearance and distances\n7. Fluids and\nlubricants\nMay include:\n7.1 Engine oil\n7.2 Hydraulic oil\n7.3 Brake fluid\n7.4 Grease\n7.5 Coolant\n7.6 Battery solutions\n7.7 Torque converter oil\n7.8 Fuel\n8. Basic preventive\nmaintenance\nservicing\nMay include:\n8.1 Check battery clamps\n8.2 Check fan belt conditions (cracked or worn-out)\n8.3 Adjust belt tensions (if necessary)\n8.4 Clean/replace filters\n 8.4.1 Air cleaner\n 8.4.2 Water separator\n 8.4.3 Hydraulic filter\n 8.4.4 Fuel filter\n8.5 Replace defective fluid caps\n8.6 Grease all fittings on lube points\n8.7 Grease wire ropes\n8.8 Check track tension\n9. Site regulations\nMay include:\n9.1 Instructions\n9.2 Signages\n9.3 Work schedules\n9.4 Work bulletin boards\n9.5 Charts\n9.6 Memos\n9.7 Site Map\n9.8 Emergency response plan\n9.9 Permits\n\n--- PDF PAGE 79 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n74\nVARIABLE\nRANGE\n10. Site conditions\nMay include:\n10.1 Dusty\n10.2 Windy\n10.3 Sunny\n10.4 Rainy\n10.5 Crowded\n10.3 Terrain (muddy and slippery)\n\n--- PDF PAGE 80 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n75\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Performed adjustment or replacement for noted defects\n1.2 Performed basic preventive maintenance servicing (PMS)\n1.3 Prepare equipment reports\n1.4 Observed safety measures applicable to worksite operation\n1.5 Communicated effectively with others to ensure effective work\noperation\n2. Resource\nImplications\n\nThe following resources should be provided:\n2.1 Access to crawler crane and manuals\n2.2 Access to crawler crane and lifting gears\n2.3 Basic hand tools and portable powered tools\n2.4 Fluids and lubricants\n2.5 PPE\n2.6 Safety signage/barricades\n3. Method of\nAssessment\n\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Direct observation/Demonstration with oral questioning\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 81 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n76\nUNIT OF COMPETENCY\n:\nPERFORM PRODUCTIVE OPERATION FOR\nCRAWLER CRANE\n\nUNIT CODE\n\n:"
