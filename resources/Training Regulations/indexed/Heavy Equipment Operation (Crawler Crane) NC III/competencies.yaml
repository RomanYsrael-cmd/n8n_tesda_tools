ENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Identify and access\nspecification/\nmanuals\n\n1.1 Appropriate manuals are\nidentified and accessed\nas per job requirements\n1.2 Version and date of\nmanual are checked to\nensure that correct\nspecification and\nprocedures are\nidentified\n1.1 Types of\nmanuals used in\nMasonry\n1.2 Identification of\nsymbols used in\nthe manuals\n\n1.1 Identifying\nmanuals and\nspecifications\n1.2 Accessing\ninformation and\ndata\n\n2. Interpret manuals\n2.1 Relevant sections,\nchapters of\nspecifications/ manuals\nare located in relation to\nthe work to be\nconducted\n2.2 Information and\nprocedure in the manual\nare interpreted in\naccordance with\nindustry practices\n\n2.1 Types of\nmanuals used in\nMasonry\n2.2 Types of\nsymbols used in\nmanuals\n2.3 System of\nmeasurements\n2.4 Unit conversion\n2.1 Interpreting\nsymbols and\nspecifications\n2.2 Accessing\ninformation and\ndata\n2.3 Applying\nconversion of units\nof measurements\n\n--- PDF PAGE 51 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n46\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Apply information in\nmanual\n3.1 Manual is interpreted\naccording to job\nrequirements\n3.2 Work steps are\ncorrectly identified in\naccordance with\nmanufacturer's\nspecification\n3.3 Manual data are\napplied according to\nthe given task\n3.4 All correct sequencing\nand adjustments are\ninterpreted in\naccordance with\ninformation contained\non the manual or\nspecifications\n3.1 Types of\nmanuals used in\nMasonry\n3.2 Types and\napplication of\nsymbols in\nmanuals\n3.3 Unit conversion\n3.1 Applying\ninformation from\nmanuals\n\n4. Store manuals\n4.1 Manual or specification\nis stored appropriately\nto prevent damage,\nready access and\nupdating of information\nwhen require