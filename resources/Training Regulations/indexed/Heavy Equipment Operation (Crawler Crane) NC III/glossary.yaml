  "source_text": "1. Attachment\nRefers to anything like fly jib used instead of the conventional lift\nblock to perform different types of lifting jobs.\n\n2. Boom length\nRefers to the measurement from the boom foot pins to the center\nof the boom point sheaves.\n\n3. Reeving\nRefers to a rope system in which the rope travels around the\ndrums and sheaves.\n\n4. Lattice boom\n\n5. Telescopic boom\n\nRefers to a type of boom which is raised and lowered by a series\nof guy wires that are powered mechanically. This boom is used\nin applications for lifting and towering large and heavy items.\n\nRefers to a component of crane attached to the superstructure\nand is used to support hoisting tackle. Its extended and retracted\nmovement is controlled by hydraulic cylinder.\n\n6. Crawler crane\nRefers to a mobile type of crane mounted on an undercarriage\nwith a set of tracks that provides stability and mobility.\n\n7. Standard\nRefers to a degree or level of requirement set by the\nmanufacturer.\n\n8. Stability\nRefers to the machine resistance to overturning (Truck-mounted\nCrane - lifting on outriggers are based on 85 percent of the\ntipping capacity).\n\n9. Safety devices\nRefer to boom angle indicators, load moment indicators, anti-two\nblocking devices (where applicable), boom kick out lever, etc.\n\n10. Work area\nRefers to any place inside the swing circle of the crane. It must\nbe barricaded off and only those directly involve in the lift shall\nbe allowed to entry.\n\n11. Derated capacity\nof equipment\n\n12. Load Moment\n Indicator (LMI)\n\n13. Rigging gears\n\n14. Super structure\n\n15. Lower structure\nRefers to the reduction of lifting capacity of equipment as\ncertified by a third party.\n\nRefers to electronic device that indicates crane configuration\nsuch as boom angle, boom length, load weight and working\nradius.\n\nRefers to equipment such as wire rope, turnbuckles, clevis,\njacks, shackles, slings used with cranes and other lifting\nequipment in material handling and structure relocation.\n\nRefers to upper or lifting component of the crane which includes\nthe boom.\n\nRefers to the carrier of the crane.\n\n--- PDF PAGE 121 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n 116\n\n16. Power train\n\n17. Hazards\n\n18. Low-bed trailer\n\n19. Rigger\n\n20. Computer\nLiterate\n\nRefers to mechanism that transmits the drive from the engine of\na vehicle to its axle.\n\nRefers to situation that poses threat to life, health, property, or\nenvironment.\n\nRefers to the trailer that carries or transport the heavy\nequipment.\n\nRefers to signalman that directs the schedule of lifts for the\ncrane, and is responsible for the safety of the loads.\n\nIs defined as the knowledge and ability to utilize computers and\nrelated technology efficiently, with a range of skills covering\nlevels from elementary use to computer programming and\nadvanced problem solving.\n\n--- PDF PAGE 122 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n 117",
