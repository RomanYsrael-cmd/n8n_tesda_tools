questioning\n\n--- PDF PAGE 106 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n101\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n1.5 Perform post-\n operation procedure\n•\nExplain inspection\nprocedures while engine is\ncooling down\n•\nExplain parking and shut-\ndown procedures\n•\nPerform parking and shut-\ndown operation\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n2. Perform basic\npreventive\nmaintenance\nservicing for crawler\ncrane\n\n2.1 Perform adjustment or\n replacement for noted\n defects\n\n• Explain procedures in\nperforming adjustments or\nreplacements for noted\ndefects\n• Explain usage of basic hand\ntools and portable powered\ntools\n• Perform adjustments or\nreplacements for minor\ndefects\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n24 Hours\n2.2 Perform basic\n preventive\n maintenance servicing\n (PMS)\n\n•\nExplain procedures in\nbasic preventive\nmaintenance servicing\n•\nEnumerate Operator’s\nServiceable parts\n•\nExecute Basic preventive\nmaintenance servicing\n(PMS)\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n2.3 Prepare equipment\n reports\n\n•\nExplain procedures in\naccomplishing equipment\nreports\n•\nAccomplish equipment\nreports\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n--- PDF PAGE 107 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n102\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n3. Perform productive\n operation for crawler\ncrane\n\n3.1 Travel the crawler\ncrane\n•\nEnumerate different road\nand weather conditions\n•\nIdentify potential hazards in\nwork area\n•\nExplain procedures in\nresponding to unexpected\nsituations\n•\nPerform travel operation\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n120\n3.2 Load and unload\ncrawler crane to low-\nbed trailer\n•\nPerform loading and\nunloading of Crawler crane\nto low-bed trailer\n•\n Identify the components\nand attachments of crawler\ncrane\n•\nExplain and demonstrate\nverbal instructions and\nhand signals\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n3.3 Set-up crawler crane\n•\nIdentify potential hazards in\nwork area\n•\nExplain procedures in\nsetting-up crawler crane\n•\nExplain procedures in\nresponding to unexpected\nsituations\n•\nPerform crawler crane set-\nup\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n3.4 Interpret load chart\n and /or load moment\n indicator and construct\nlifting plan\n\n•\nRead and interpret load\nchart and/or load moment\nindicator\n•\nPerform load computations\nbased on load chart and /or\nload moment indicator\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n--- PDF PAGE 108 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n103\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n3.5 Perform lifting and\n transferring of load\n\n•\nUnderstand site and weather\nconditions\n•\nExplain procedures and\npractices in lifting operation\n•\nUnderstand hand signals\n•\nExplain procedures in\nresponding to unexpected\nsituations\n•\nDemonstrate lifting and\ntransferring of load\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n--- PDF PAGE 109 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n104",
