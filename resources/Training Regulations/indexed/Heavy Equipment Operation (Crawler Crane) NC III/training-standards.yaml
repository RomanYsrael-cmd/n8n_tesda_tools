 for\nsuper & lower structure and\npower train components\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n1.4 Perform operation\n check\n\n• Explain start-up and warming\nprocedures\n• Explain procedures in\ninspection while the engine\nis running\n• Perform operation of crawler\ncrane components and\nsafety devices\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n--- PDF PAGE 106 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n101\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n1.5 Perform post-\n operation procedure\n•\nExplain inspection\nprocedures while engine is\ncooling down\n•\nExplain parking and shut-\ndown procedures\n•\nPerform parking and shut-\ndown operation\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n2. Perform basic\npreventive\nmaintenance\nservicing for crawler\ncrane\n\n2.1 Perform adjustment or\n replacement for noted\n defects\n\n• Explain procedures in\nperforming adjustments or\nreplacements for noted\ndefects\n• Explain usage of basic hand\ntools and portable powered\ntools\n• Perform adjustments or\nreplacements for minor\ndefects\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n24 Hours\n2.2 Perform basic\n preventive\n maintenance servicing\n (PMS)\n\n•\nExplain procedures in\nbasic preventive\nmaintenance servicing\n•\nEnumerate Operator’s\nServiceable parts\n•\nExecute Basic preventive\nmaintenance servicing\n(PMS)\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n2.3 Prepare equipment\n reports\n\n•\nExplain procedures in\naccomplishing equipment\nreports\n•\nAccomplish equipment\nreports\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n--- PDF PAGE 107 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n102\n\nUnit of Competency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n3. Perform productive\n operation for crawler\ncrane\n\n3.1 Travel the crawler\ncrane\n•\nEnumerate different road\nand weather conditions\n•\nIdentify potential hazards in\nwork area\n•\nExplain procedures in\nresponding to unexpected\nsituations\n•\nPerform travel operation\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n120\n3.2 Load and unload\ncrawler crane to low-\nbed trailer\n•\nPerform loading and\nunloading of Crawler crane\nto low-bed trailer\n•\n Identify the components\nand attachments of crawler\ncrane\n•\nExplain and demonstrate\nverbal instructions and\nhand signals\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n3.3 Set-up crawler crane\n•\nIdentify potential hazards in\nwork area\n•\nExplain procedures in\nsetting-up crawler crane\n•\nExplain procedures in\nresponding to unexpected\nsituations\n•\nPerform crawler crane set-\nup\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n3.4 Interpret load chart\n and /or load moment\n indicator and construct\nlifting plan\n\n•\nRead and interpret load\nchart and/or load moment\nindicator\n•\nPerform load computations\nbased on load chart and /or\nload moment indicator\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n--- PDF PAGE 108 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n103\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n3.5 Perform lifting and\n transferring of load\n\n•\nUnderstand site and weather\nconditions\n•\nExplain procedures and\npractices in lifting operation\n•\nUnderstand hand signals\n•\nExplain procedures in\nresponding to unexpected\nsituations\n•\nDemonstrate lifting and\ntransferring of load\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nand with oral\nquestioning\n\n--- PDF PAGE 109 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n104\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n--- PDF PAGE 110 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n105\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n\n• The classroom-based or in-center instruction may be enhanced through\nuse of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training is\nintegrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted by\nnon-government organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings such as\nbarangay hall, basketball courts, etc. These programs can also be mobile\ntraining program (MTP).\n\n--- PDF PAGE 111 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n106\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the following\nrequirements:\n\n• At least Junior High School Level Completer or an Alternative Learning\nSystem (ALS) Certificate of Completion with grade 10 equivalent holder.\n• Must possess good communication skills\n• Can perform basic mathematical computation\n• Driver’s License (Restriction 2 or 3)\n• Physically fit\n\n--- PDF PAGE 112 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n107\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25 trainees for\nCrawler Crane Operation NC III are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n1 set\nWrenches (box and\nopen-end 8-24 mm-\nmetric & 7/16 –1” -\nEnglish )\n1 unit Crawler crane with\ncamera/monitor for\nreverse mode\ncertified by Third\nParty accredited by\nDOLE-OSHC\n(Memorandum of\nAgreement (MOA)/\nrental)\n5 kgs.\nMulti- purpose\ngrease\n5 pcs.\nHammer ballpeen\n(3-4 lbs.)\n2\nunits\nTwo-way radio\n20\nliters\nEngine oil ( SAE\n15w40)\n5 pcs.\nPliers\n( mechanical 10 “)\n1 unit Vacuum cleaner\n(heavy duty)\n20\nliters\nHydraulic / steering\nfluid (TELLUS\n68/10W)\n5 pcs.\n\nAdjustable wrench\n(8”,10”, 12”,18 “)\n\n1 piece for each\nsize\n1 unit Portable electric air\ncompressor, 180\ncfm\n20\nliters\nPT