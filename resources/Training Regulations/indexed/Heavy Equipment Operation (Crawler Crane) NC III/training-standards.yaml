nance Workshop)\n 2 x 2 meters\n4 sq.m per\nstudent\n100\nLecture Room\n8 x 6\n48\n48\nLearning Resource Center\n4 x 6\n24\n24\nFacilities/Equipment/ Circulation\nArea\n6.5 x 8\n52\n52\nWorking field\n20 x 75\n1,500\n1,500\nTOTAL AREA\n\n1,724\n\nNOTE: Training Center may enter into Memorandum of Agreement (MOA) with industry for use of facilities and\nheavy equipment\n\n 3.6 TRAINERS’ QUALIFICATION FOR HEAVY EQUIPMENT OPERATION (CRAWLER\nCRANE) NC III\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in Heavy\nEquipment Operation (Crawler Crane) NC III\n• Must have completed the 40-Hour Construction Occupational Safety and Health\n(COSH) per Department Order No. 13 s. 1998, Guidelines Governing\nOccupational Safety and Health in the Construction Industry conducted by OSHC\nand DOLE accredited Safety Training Organizations\n• Must be computer-literate\n• Must have at least 5 years work/industry experience\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of Competency.\n\n--- PDF PAGE 115 ---\nHEAVY EQUIPMENT OPERATION (Crawler Crane) NC III Revision 01 Promulgated (11/07/2019)\n\n110"
