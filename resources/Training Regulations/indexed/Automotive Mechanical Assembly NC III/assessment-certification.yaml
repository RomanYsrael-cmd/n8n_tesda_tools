  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1 To attain the National Qualification of AUTOMOTIVE MECHANICAL ASSEMBLY\nNC III, the candidate must demonstrate competence through assessment\ncovering all the units of competency listed in Section 1. Successful candidates\nshall be awarded a National Certificate signed by the TESDA Director General.\n\n4.2 Individual aspiring to be awarded the qualification of AUTOMOTIVE\nMECHANICAL ASSEMBLY NC III must acquire Certificates of Competency\n(COC) in all the following core units of the Qualification. Candidates may apply\nfor assessment in any accredited assessment center.\n\n4.2.1\nConduct Engine Hot Test\n• Perform Engine Hot Test\n\n4.2.2\nRectify Assembly Faults on Assembled Mechanical Assemblies\n• Rectify Assembly Faults on Assembled Mechanical Assemblies\n\n4.2.3\nRectify Faults on Mounted/Installed Brake and Fuel System\n• Rectify Faults on Mounted/Installed Brake and Fuel System\n\n4.2.4\nRectify Faults on Mounted/Installed Power Drive System\n• Rectify Faults on Mounted/Installed Power Drive System\n\n4.2.5\nRectify Faults on Mounted/Installed Suspension Drive Train\n• Rectify Faults on Mounted/Installed Suspension Drive Train\n\n4.3 Accumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.4 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.5 The following are qualified to apply for assessment and certification:\n4.5.1\nHolder of Automotive Mechanical Assembly NC II or equivalent\nqualification; or\n\n4.5.2 Graduates of formal, non-formal and informal including enterprise-based\ntraining programs.\n\n4.5.3\nExperienced workers (wage employed or self employed)\n\n4.6 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)”.\n\n--- PDF PAGE 73 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 72\n\n"
}
