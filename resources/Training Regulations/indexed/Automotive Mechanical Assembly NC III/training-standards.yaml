anical assembly are performed\nin the workshop.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n•\nBuilding (permanent)\n12.00 x 32.00\n-\n384.00\n• Student/Trainee Working\nSpace\n2.50 x 2.50 per\nstudent/trainee\n6.25 per\nstudent\n156.25\n• Contextual Learning\nLaboratory\n4.00 x 5.00\n20.00\n20.00\n•\nLecture Room\n4.00 x 7.00\n28.00\n28.00\n•\nLearning Resource Center\n4.00 x 5.00\n20.00\n20.00\n• Facilities/Equipment/\nCirculation Area**\n-\n-\n182.00\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 71 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n70\n3.6\nTRAINERS’ QUALIFICATION\n\nAUTOMOTIVE/LAND TRANSPORT SECTOR\nAUTOMOTIVE MECHANICAL ASSEMBLY – NC III\nTRAINER QUALIFICATION (TQ II)\n\n• Must be a holder of Automotive Mechanical Assembly NC III\n• Must have undergone training on Training Methodology II (TM II) 1\n• Must be computer literate\n• Must be physically and mentally fit\n• Must have at least 2 years job/industry experience2\n• Must be a civil-service eligible or holder of appropriate professional\nlicense issued by the Professional Regulatory Commission (for\ngovernment positions only)\n\n1\nThis shall be changed to “:Must be a holder of Trainer Qualification Level II (TQII) or\nequivalent” upon promulgation by the TESDA Board of the TQ/AQ training regulations\n2\nOptional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7\n INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine\ntheir achievement of units of competency. A certificate of achievement\nis issued for each unit of competency.\n\n--- PDF PAGE 72 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n71"
