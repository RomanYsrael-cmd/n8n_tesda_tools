    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: AUTOMOTIVE MECHANICAL ASSEMBLY\n\nNC Level NC III\n\nNominal Training Duration:\n20 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n440 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of an\nindividual in the field of automotive mechanical assembly in accordance with industry\nstandards. It covers core competencies such as; conduct engine hot test, rectify\nassembly\nfaults\non\nassembled\nmechanical\nassemblies,\nrectify\nfaults\non\nmounted/installed brake and fuel system, rectify faults on mounted/installed power\ndrive system and rectify faults on mounted/installed suspension drive train.\n\nThis course is also designed to enhance the basic and common knowledge,\nskills and attitudes of an individual in the field of automotive mechanical assembly.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Lead workplace\ncommunication\n1.1 Communicate information\nabout workplace processes.\n1.2 Lead workplace discussions.\n1.3 Identify and communicate\nissues arising in the\nworkplace\n• Group\ndiscussion\n• Role Play\n• Brainstorming\n\n• Observation\n• Interviews\n2. Lead small\nteams\n2.1 Provide team leadership.\n2.2 Assign responsibilities among\nmembers.\n2.3 Set performance expectation\nfor team members.\n\n2.4 Supervise team performance\n• Lecture\n• Demonstration\n• Self-paced\n(modular)\n• Demonstration\n• Case studies\n3. Develop and\npractice\nnegotiation\nskills\n3.1 Identify relevant information in\nplanning negotiations\n3.2 Participate in negotiations\n3.3 Document areas for\nagreement\n• Direct\nobservation\n• Simulation/\nrole playing\n•\nCase studies\n• Written test\n• Practical/\nperformance\ntest\n\n--- PDF PAGE 66 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n65\n4. Solve\nworkplace\nproblem related\nto work\nactivities\n4.1 Explain the analytical\ntechniques.\n4.2 Identify the problem.\n4.3 Determine the possible\ncause/s of the problem.\n• Direct\nobservation\n• Simulation/role\nplaying\n•\nCase studies\n• Written test\n• Practical/\nperformance\ntest\n5. Use\nmathematical\nconcepts and\ntechniques\n5.1 Identify mathematical tools\nand techniques to solve\nproblem\n5.2 Apply mathematical\nprocedures/solution\n5.3\nAnalyze results\n• Direct\nobservation\n• Simulation/rol\ne playing\n• Case studies\n• Written test\n• Practical/\nperformance\ntest\n6. Use relevant\ntechnologies\n6.1 Identify appropriate\ntechnology\n6.2 Apply relevant technology\n6.3 Maintain/enhance relevant\ntechnology\n• Direct\nobservation\n• Simulation/rol\ne playing\n•\nCase studies\n• Written test\n• Practical/\nperformance\ntest\n\nCOMMON COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nmensuration\nand calculation\n1.1 Select measuring instruments\n1.2 Carry out measurements and\ncalculation\n1.3 Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Practical\nexercises\n• Simulation\n• Written test\n• Oral questioning\n• Direct\nobservation\n2. Read, interpret\nand apply\nengineering\nmanuals /\nspecifications\n2.1 Identify/access engineering\nmanuals / specification\n2.2 Interpret manual\n2.3 Apply information in manual\n2.4 Store manuals\n• Lecture/\nDemonstration\n• Dual training\n\n• Direct\nobservation\n• Interview\n3. Move and\nposition vehicle\n3.1 Prepare vehicle for driving\n3.2 Move and position vehicle\n3.3 Check the vehicle\n• Lecture/\nDemonstration\n• Practical\nexercises\n• Simulation\n• Written test\n• Oral questioning\n• Direct\nobservation\n\n4. Apply\nappropriate\nsealant /\nadhesive\n4.1 Identify appropriate sealant/\nadhesive\n4.2 4.2 Prepare surface for sealant\n/ adhesive application\n4.3 Store unused and dispose used\nsealant/adhesive\n• Lecture/\nDemonstration\n• Dual training\n• Distance\nlearning\n• Written test\n• Oral questioning\n• Direct\nobservation\n• Interview\n• Project method\n5. Perform shop\nmaintenance\n5.1 Inspect/clean tools and work\narea\n5.2 Store/arrange tools and shop\nequipment\n5.3 Dispose waste/used lubricants\n5.4 Report damaged\ntools/equipment\n• Lecture/\nDemonstration\n• Dual training\n• Self-paced\n(modular)\n\n• Written test\n• Direct\nobservation\n• Interview\n• Practical\nexercises\n\n--- PDF PAGE 67 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n66\nCORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Conduct\nEngine Hot\nTest\n1.1 Plan and prepare engine\nfor hot test\n1.2 Shift engine\n1.3 Perform engine hot test\n\n• Lecture/\nDemonstration\n• Dualized\ntraining\n\n• Observation\nwith\nquestioning\n• Demonstration\nwith\nquestioning\n• Interview\n•\nPortfolio\n2. Rectify\nAssembly\nFaults on\nAssembled\nMechanical\nAssemblies\n2.1 Prepare tools, materials\nand work area.\n2.2 Locate and rectify faults\non mechanical assembly\n2.3 Locate and rectify sealing\nsystem faults\n\n• Discussion\n• Dual training\n• Distance\nlearning\n\n• Observation\nwith\nquestioning\n• Demonstration\nwith\nquestioning\n• Interview\n•\nPortfolio\n3. Rectify Faults\non Mounted /\nInstalled Brake\nand Fuel\nSystem\n3.1 Prepare tools, materials\nand work area\n3.2 Diagnose and rectify\nmechanical fault\n• Discussion\n• Dual training\n• Distance\nlearning\n\n• Observation\nwith\nquestioning\n• Demonstration\nwith\nquestioning\n• Interview\n•\nPortfolio\n4. Rectify Faults\non Mounted /\nInstalled Power\nDrive System\n4.1 Prepare tools, materials\nand work area\n4.2 Diagnose and rectify\nfaults on power drive\nsystem\n• Discussion\n• Dual training\n• Distance\nlearning\n\n• Observation\nwith\nquestioning\n• Demonstration\nwith\nquestioning\n• Interview\n• Portfolio\nInterview\n5. Rectify Faults\non Mounted /\nInstalled\nSuspension\nDrive Train\n5.1 Plan and prepare tools,\nmaterials and work area\n5.2 Diagnose and rectify fault\non suspension drive train\nsystem\n• Discussion\n• Dual training\n• Distance\nlearning\n\n• Observation\nwith\nquestioning\n• Demonstration\nwith\nquestioning\n• Interview\n•\nPortfolio\n\n--- PDF PAGE 68 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n67"
