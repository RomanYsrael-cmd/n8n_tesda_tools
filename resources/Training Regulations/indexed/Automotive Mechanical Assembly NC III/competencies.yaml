        "source_text": "ALT723202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude needed\nto move and position vehicle in a workshop before and after\nservicing.\nELEMENT PERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare\nvehicle for\ndriving\n1.1\nCheck-up procedures is performed based on vehicle\nmanufacturer standard\n2. Move and\nposition\nvehicle\n2.1\nSelect vehicle to be moved or re-position.\n2.2 Drive the vehicle to appropriate location\n2.3\nPark vehicle following parking safety techniques and\nprocedure\n3. Check the\nvehicle\n3.1 Vehicle position is checked as per required\n3.2 Vehicle is checked for external damages\n\n--- PDF PAGE 30 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 29\n RANGE OF VARIABLE\n\nVARIABLE\nRANGE\n1. Check-up procedure\nCheck-up procedures include the following:\n1.1\nOil level\n1.2\nBrake fluid\n1.3\nClutch fluid\n1.4\nCoolant level\n1.5\nBattery (electrolyte)\n1.6\nTire pressure\n1.7\nPosition of driving gear\n1.8\nLighting and warning devices\n2. Vehicles\n2.1 Vehicles with automatic transmission\n2.2 Vehicles with manual transmission\n3. Parking safety\ntechniques\n3.1 Engaging of park brake\n3.2 Vehicle parking position\n3.3 Front wheel position\n\n--- PDF PAGE 31 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 30\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPrepared vehicle for driving.\n1.2\nMoved and positioned vehicle\n1.3\nChecked the vehicle.\n2. Underpinning\nknowledge\nand attitudes\n2.1 Driver’s code of conduct\n2.2 Workshop signs and symbols\n2.3 Driving skills\n2.4 Vehicle accessories for safe driving and parking\n3. Underpinning\nskills\n3.1\nAbility to handle vehicle/maneuver vehicle the easiest way\n3.2\nImmediate response to accident\n3.3\nPreparing vehicle for driving\n3.4\nParking downhill, uphill, parallel\n3.5\nShifting gears\n3.6\nManeuvering\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1\nDriving range/area\n4.2\nAppropriate vehicle for driving\n4.3\nVehicle accessories\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nObservation with questioning\n5.2\nWritten or oral examination\n6. Context of\nassessment\n6.1\nAssessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2\nAssessment of practical skills must be done in a workplace or\nsimulated environment.\n\n--- PDF PAGE 32 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 31\nUNIT OF COMPETENCY :\nAPPLY APPROPRIATE SEALANT/ADHESIVE\n\nUNIT CODE :"
