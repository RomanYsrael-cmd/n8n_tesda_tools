        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Located, interpreted and applied the relevant information,\nstandards and specifications.\n1.2 Complied with company safety policies and\nprocedures and OH&S legislation/regulations/codes of practice\napplicable to operations including quality requirements\n1.3 Completed diagnosis and rectification of mechanical faults on a\nminimum of five (3) separate vehicles each with different faults,\nrectified to engineers specifications and company inspection\nrequirements\n1.4 Communicated and worked effectively and safely with others\n2. Underpinning\nknowledge and\nattitudes\n2.1Workplace and equipment safety requirements\n2.2 Relevant company production quality standards\n2.3 Company manufacturing and production techniques for\nmechanical components and systems\n2.4 Automotive Industry terminology\n2.5 Tools and equipment types, characteristics, uses and limitations\n2.6 Mechanical faults and symptoms\n2.7 Engine parts and construction\n2.8 Mechanical diagnosis techniques\n2.9 Processes for the calculation of material requirements\n2.10 Material Safety Data Sheets\n2.11 Plans, drawings and specifications\n2.12 Materials handling, storage and environmentally friendly\nwaste management\n2.13 Company safety policies and procedures\n2.14 Relevant Philippine standards OH&S legislation\n3. Underpinning\nskills\n3.1Collect, organize, interpret and understand the information\nrequired for mechanical rectification, including work instructions,\nplans / sketches / diagrams, safety instructions, signage, labels,\nquality procedures, material safety data sheets and equipment\ninstructions\n3.2 Communicate ideas and information orally and in writing, in\nsimple English to enable confirmation of work requirements,\npassage of information and requests to other workers during\noperations and the reporting and recording of work outcomes\n3.3 Conduct activities associated with mechanical rectification,\nincluding the coordination and use of equipment, materials and\ntools to avoid backtracking and rework\n3.4 Work with others and in a team by recognizing dependencies\nand using co-operative approaches to optimize satisfaction and\nproductivity\n\n--- PDF PAGE 54 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n53\n\n3.5Establish safe and effective work processes which anticipate\nand/or resolve problems and downtime, to systematically\ndevelop solutions to avoid or minimize reworking and avoid\nwastage\n3.6 Use mathematical ideas and techniques to correctly calculate\ntime, assess tolerances and timing, apply accurate\nmeasurements, and establish quality check\n3.7 Use workplace technology related to mechanical rectification,\nincluding the use of computers, measuring equipment,\ncomputerized equipment, mechanical diagnostic equipment, the\nuse of communication devices and the reporting/recording of\nresults\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace\n4.2 Appropriate tools and equipment\n4.3Materials relevant to the proposed activity and tasks\n5. Method of\nassessment\nCompetency MUST be assessed through\n5.1 Observation with Questioning\n5.2 Portfolio\n6. Context of\nassessment\nCompetency may be assessed individually in the actual workplace\nor a simulated workplace environment.\n\n--- PDF PAGE 55 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n54\nUNIT OF COMPETENCY : RECTIFY FAULT ON MOUNTED / INSTALLED\nPOWER DRIVE SYSTEM\n\nUNIT CODE\n:"
        },
        "source_text": "ALT827321\n\nUNIT DESCRIPTOR\n: This unit specifies the competency required to rectify\nbrake\nand\nfuel\nsystem\nfaults\nbased\non\nrecommendations from the inspection records and\nreport of the fully assembled vehicle. The unit includes\nlocation, diagnosis and rectification of the faults in an\noff-line environment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1 Plan and\nprepare for\nwork\n\n1.1 Planning and preparation of work instructions, including\nrelevant inspection reports and forms and quality requirements\nare obtained, confirmed and applied\n1.2 Occupational health and safety (OH & S) requirements are\nfollowed in accordance with company safety policies and\nprocedures\n1.3 Tools and equipment selected to carry out tasks are consistent\nwith the requirements of the job, checked for serviceability and\nany faults are rectified or reported prior to commencement\n1.4 Materials appropriate to the work application are identified,\nobtained, prepared, safely handled and located ready for use\n1.5 Working environment considerations are identified and\nmeasures to reduce noise, dust and obstacles are applied\n2 Diagnose and\nrectify\nmechanical\nfault\n\n2.1 Inspection report is interpreted and fault is located on assembled\nvehicle.\n2.2 Mechanical fault is diagnosed and suitable method of\ncorrection is planned.\n2.3 Rectification is applied, dependent on the fault and in accordance\nwith engineering manuals\n2.4 Fault is re-diagnosed to assess outcome of rectification and to\nensure rework has eliminated the fault and final adjustments\nmade\n2.5 Documentation is completed and communication is conveyed\noutlining nature of problem, work conducted and outcome, in\naccordance with company requirements\n2.6Vehicle is returned to production sequence\n3 Clean up work\narea\n3.1 Work area is cleared and materials disposed of, reused or\nrecycled in accordance with company requirements\n3.2 Tools and equipment are cleaned, checked, maintained and\nstored in accordance with company requirements\n\n--- PDF PAGE 51 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n50\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Planning and\npreparation\nPlanning and preparation may include the following:\n1.1 Vehicle inspection\n1.2 Defect identification\n1.3 Assessment of conditions and hazards\n1.4 Determination of work requirements\n2. Quality\nrequirements\n\nQuality requirements are to include but not be limited to:\n2.1 Relevant regulations including Philippine Standards\n2.2 Internal company quality policy and standards\n2.3 Company operations and\n3. Occupational\nhealth and\nsafety (OH & S)\nrequirements\n\nOH&S requirements may include Legislation / regulations / codes of\npractice and company safety policies and procedures such as:\n3.1 Protective clothing and equipment\n3.2 Proper use of tools and equipment\n3.3 Workplace environment and safety\n3.4 Handling of materials\n3.5 Use of fire fighting equipment\n3.6 Company first aid\n3.7 Hazard control and hazardous materials and substances\n3.8 Personal protective equipment is to include that prescribed under\nlegislation/regulation/codes of practice and workplace policies\nand practices\n3.9 Safe operating procedures are to include but not be limited to the\nconduct of operational risk assessment and treatments\nassociated with heavy objects, vehicular movement, toxic\nsubstances, electrical shock, machinery movement and\noperation, production line operation, manual and mechanical\nlifting and shifting, working in proximity to others and site visitors\n3.10 Emergency procedures related to this unit are to include but\nmay not be limited to emergency shutdown and stopping of\nequipment, extinguishing fires, company first aid requirements\nand plant evacuation\n4. Tools and\nequipment\nTools and equipment are to include but not be limited to:\n4.1 Mechanical diagnostic equipment\n4.2 Relevant hand and power tools\n\n--- PDF PAGE 52 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n51\n\n5. Materials\nMaterials include:\n5.1 Replacement parts\n5.2 Fuel\n5.3 Oil\n5.4 Water\n5.5 Seals\n5.6 Gaskets,\n5.7 Brake fluids\n5.8 Lubricants\n5.9Gas\n6. Working\nEnvironment\nWorking Environment requirements includes management of :\n6.1 Waste\n6.2 Noise\n6.3 Dust\n6.4 Vibration\n6.5Workplace Housekeeping (Clean-up)\n7. Assembled\nVehicle\n7.1 Passenger Car\n7.2 Utility Vehicle\n8. Mechanical Fault Rectification of mechanical faults may include but not be limited to\ndetection of faults such as:\n8.1 Leak on Fuel system line and abnormal noises\n8.2 Clearance on Fuel and brake lines\n8.3 Brake master cylinder malfunction\n8.4 Leak on brake system line and abnormal noises\n8.5 All other mechanical operations and parts related to brake and\nfuel systems like fuel pump, brake cylinders, etc…\n9. Engineering\nManuals\n\nEngineering manuals are to include but not be limited to:\n9.1 Vehicle assembly manuals per model-variant\n9.2 Vehicle quality standard manuals per model/variant\n9.3 Process control Chart/sheets\n9.4 Vehicle Specification sheets\n9.5Materials/Parts list\n10. Communications\n\nCommunications are to include but not limited to\n10.1 Verbal\n10.2 Visual instructions\n10.3 Fault reporting\n10.4 Site specific instructions\n10.5 Written instructions\n10.6 Plans or instructions related to job/task,\n10.7\nTelephones and pagers\n\n--- PDF PAGE 53 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n52\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Located, interpreted and applied the relevant information,\nstandards and specifications.\n1.2 Complied with company safety policies and\nprocedures and OH&S legislation/regulations/codes of practice\napplicable to operations including quality requirements\n1.3 Completed diagnosis and rectification of mechanical faults on a\nminimum of five (3) separate vehicles each with different faults,\nrectified to engineers specifications and company inspection\nrequirements\n1.4 Communicated and worked effectively and safely with others\n2. Underpinning\nknowledge and\nattitudes\n2.1Workplace and equipment safety requirements\n2.2 Relevant company production quality standards\n2.3 Company manufacturing and production techniques for\nmechanical components and systems\n2.4 Automotive Industry terminology\n2.5 Tools and equipment types, characteristics, uses and limitations\n2.6 Mechanical faults and symptoms\n2.7 Engine parts and construction\n2.8 Mechanical diagnosis techniques\n2.9 Processes for the calculation of material requirements\n2.10 Material Safety Data Sheets\n2.11 Plans, drawings and specifications\n2.12 Materials handling, storage and environmentally friendly\nwaste management\n2.13 Company safety policies and procedures\n2.14 Relevant Philippine standards OH&S legislation\n3. Underpinning\nskills\n3.1Collect, organize, interpret and understand the information\nrequired for mechanical rectification, including work instructions,\nplans / sketches / diagrams, safety instructions, signage, labels,\nquality procedures, material safety data sheets and equipment\ninstructions\n3.2 Communicate ideas and information orally and in writing, in\nsimple English to enable confirmation of work requirements,\npassage of information and requests to other workers during\noperations and the reporting and recording of work outcomes\n3.3 Conduct activities associated with mechanical rectification,\nincluding the coordination and use of equipment, materials and\ntools to avoid backtracking and rework\n3.4 Work with others and in a team by recognizing dependencies\nand using co-operative approaches to optimize satisfaction and\nproductivity\n\n--- PDF PAGE 54 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n53\n\n3.5Establish safe and effective work processes which anticipate\nand/or resolve problems and downtime, to systematically\ndevelop solutions to avoid or minimize reworking and avoid\nwastage\n3.6 Use mathematical ideas and techniques to correctly calculate\ntime, assess tolerances and timing, apply accurate\nmeasurements, and establish quality check\n3.7 Use workplace technology related to mechanical rectification,\nincluding the use of computers, measuring equipment,\ncomputerized equipment, mechanical diagnostic equipment, the\nuse of communication devices and the reporting/recording of\nresults\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace\n4.2 Appropriate tools and equipment\n4.3Materials relevant to the proposed activity and tasks\n5. Method of\nassessment\nCompetency MUST be assessed through\n5.1 Observation with Questioning\n5.2 Portfolio\n6. Context of\nassessment\nCompetency may be assessed individually in the actual workplace\nor a simulated workplace environment.\n\n--- PDF PAGE 55 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n54\nUNIT OF COMPETENCY : RECTIFY FAULT ON MOUNTED / INSTALLED\nPOWER DRIVE SYSTEM\n\nUNIT CODE\n:"
