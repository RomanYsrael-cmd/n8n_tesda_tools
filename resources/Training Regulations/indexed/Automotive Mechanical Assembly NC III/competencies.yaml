  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units\nof competency required in AUTOMOTIVE MECHANICAL ASSEMBLY NC III.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : LEAD WORKPLACE COMMUNICATION\n\nUNIT CODE\n : 500311109\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to lead in the dissemination and discussion of\nideas, information and issues in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Communicate\ninformation about\nworkplace processes\n1.1 Appropriate communication method is selected\n1.2 Multiple operations involving several topics areas\nare communicated accordingly\n1.3 Questions are used to gain extra information\n1.4 Correct sources of information are identified\n1.5 Information is selected and organized correctly\n1.6 Verbal and written reporting is undertaken when\nrequired\n1.7 Communication skills are maintained in all\nsituations\n2. Lead workplace\ndiscussions\n2.1 Response to workplace issues are sought\n2.2 Response to workplace issues are provided\nimmediately\n2.3 Constructive contributions are made to workplace\ndiscussions on such issues as production, quality\nand safety\n2.4 Goals/objectives and action plan undertaken in the\nworkplace are communicated\n3. Identify and\ncommunicate issues\narising in the\nworkplace\n3.1 Issues and problems are identified as they arise\n3.2 Information regarding problems and issues are\norganized coherently to ensure clear and effective\ncommunication\n3.3 Dialogue is initiated with appropriate personnel\n3.4 Communication problems and issues are raised as\nthey arise\n\n--- PDF PAGE 5 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 4\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Methods of\ncommunication\n1.1 Non-verbal gestures\n1.2 Verbal\n1.3 Face to face\n1.4 Two-way radio\n1.5 Speaking to groups\n1.6 Using telephone\n1.7 Written\n1.8 Internet\n\n--- PDF PAGE 6 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 5\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nDealt with a range of communication/information at\none time\n1.2\nMade constructive contributions in workplace issues\n1.3\nSought workplace issues effectively\n1.4\nResponded to workplace issues promptly\n1.5\nPresented information clearly and effectively written\nform\n1.6\nUsed appropriate sources of information\n1.7\nAsked appropriate questions\n1.8\nProvided accurate information\n2. Underpinning\nknowledge\n2.1\nOrganization requirements for written and electronic\ncommunication methods\n2.2\nEffective verbal communication methods\n3. Underpinning skills\n3.1\nOrganize information\n3.2\nUnderstand and convey intended meaning\n3.3\nParticipate in variety of workplace discussions\n3.4\nComply with organization requirements for the use\nof written and electronic communication methods\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nVariety of Information\n4.2\nCommunication tools\n4.3\nSimulated workplace\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nCompetency in this unit must be assessed through\n5.2\nDirect Observation\n5.3\nInterview\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or\nin simulated workplace environment\n\n--- PDF PAGE 7 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 6\n\nUNIT OF COMPETENCY\n: LEAD SMALL TEAMS\n\nUNIT CODE\n : 500311110\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to lead\nsmall teams including setting and maintaining team and\nindividual performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Provide team\nleadership\n1.1\nWork requirements are identified and presented to\nteam members\n1.2\nReasons for instructions and requirements are\ncommunicated to team members\n1.3\nTeam members’ queries and concerns are\nrecognized, discussed and dealt with\n2. Assign responsibilities\n2.1\nDuties, and responsibilities are allocated having\nregard to the skills, knowledge and aptitude\nrequired to properly undertake the assigned task\nand according to company policy\n2.2\nDuties are allocated having regard to individual\npreference, domestic and personal considerations,\nwhenever possible\n3. Set performance\nexpectations for team\nmembers\n3.1\nPerformance expectations are established based on\nclient needs and according to assignment\nrequirements\n3.2\nPerformance expectations are based on individual\nteam members duties and area of responsibility\n3.3\nPerformance expectations are discussed and\ndisseminated to individual team members\n4. Supervised team\nperformance\n4.1\nMonitoring of performance takes place against\ndefined performance criteria and/or assignment\ninstructions and corrective action taken if required\n4.2\nTeam members are provided with feedback,\npositive support and advice on strategies to\novercome any deficiencies\n4.3\nPerformance issues which cannot be rectified or\naddressed within the team are referenced to\nappropriate personnel according to employer policy\n4.4\nTeam members are kept informed of any changes\nin the priority allocated to assignments or tasks\nwhich might impact on client/customer needs and\nsatisfaction\n4.5\nTeam operations are monitored to ensure that\nemployer/client needs and requirements are met\n4.6\nFollow-up communication is provided on all issues\naffecting the team\n4.7\nAll relevant documentation is completed in\naccordance with company procedures\n\n--- PDF PAGE 8 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 7\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work requirements\n1.1\nClient Profile\n1.2\nAssignment instructions\n2. Team member’s\nconcerns\n2.1\nRoster/shift details\n3. Monitor performance\n3.1\nFormal process\n3.2\nInformal process\n4. Feedback\n4.1\nFormal process\n4.2\nInformal process\n5. Performance issues\n5.1\nWork output\n5.2\nWork quality\n5.3\nTeam participation\n5.4\nCompliance with workplace protocols\n5.5\nSafety\n5.6\nCustomer service\n\n--- PDF PAGE 9 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 8\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nMaintained or improved individuals and/or team\nperformance given a variety of possible scenario\n1.2\nAssessed and monitored team and individual\nperformance against set criteria\n1.3\nRepresented concerns of a team and individual to next\nlevel of management or appropriate specialist and to\nnegotiate on their behalf\n1.4\nAllocated duties and responsibilities, having regard to\nindividual’s knowledge, skills and aptitude and the\nneeds of the tasks to be performed\n1.5\nSet and communicated performance expectations for a\nrange of tasks and duties within the team and provided\nfeedback to team members\n2. Underpinning\nknowledge\n2.1\nCompany policies and procedures\n2.2\nRelevant legal requirements\n2.3\nHow performance expectations are set\n2.4\nMethods of Monitoring Performance\n2.5\nClient expectations\n2.6\nTeam member’s duties and responsibilities\n3. Underpinning\nskills\n3.1\nCommunication skills required for leading teams\n3.2\nInformal performance counseling skills\n3.3\nTeam building skills\n3.4\nNegotiating skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2\nMaterials relevant to the proposed activity or task\n5. Methods of\nassessment\nCompetency may be assessed through:\n5.1\nDirect observations of work activities of the individual\nmember in relation to the work activities of the group\n5.2\nObservation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n5.3\nCase studies and scenarios as a basis for discussion\nof issues and strategies in teamwork\n6. Context of\nassessment\n6.1\nCompetency assessment may occur in workplace or\nany appropriately simulated environment\n6.2\nAssessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 10 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 9\nUNIT OF COMPETENCY: DEVELOP AND PRACTICE NEGOTIATION SKILLS\n\nUNIT CODE : 500311111\n\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes required\nto collect information in order to negotiate to a desired\noutcome and participate in the negotiation.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Plan negotiations\n1.1\n\n1.2\n\n1.3\n\n1.4\n\n1.5\nInformation on preparing for negotiation is\nidentified and included in the plan\nInformation on creating non verbal environments\nfor positive negotiating is identified and included in\nthe plan\nInformation on active listening is identified and\nincluded in the plan\nInformation on different questioning techniques is\nidentified and included in the plan\nInformation is checked to ensure it is correct and up-\nto- date\n2. Participate in\nnegotiations\n2.1\n\n2.2\n2.3\n\n2.4\n2.5\n\n2.6\n\n2.7\n2.8\nCriteria for successful outcome are agreed upon by\nall parties\nDesired outcome of all parties are considered\nAppropriate language is used throughout the\nnegotiation\nA variety of questioning techniques are used\nThe issues and processes are documented and\nagreed upon by all parties\nPossible solutions are discussed and their viability\nassessed\nAreas for agreement are confirmed and recorded\nFollow-up action is agreed upon by all parties\n\n--- PDF PAGE 11 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 10\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Preparing for\nnegotiation\n1.1 Background information on other parties to the\nnegotiation\n1.2 Good understanding of topic to be negotiated\n1.3 Clear understanding of desired outcome/s\n\n1.4 Personal attributes\n1.4.1 self awareness\n1.4.2 self esteem\n1.4.3 objectivity\n1.4.4 empathy\n1.4.5 respect for others\nInterpersonal skills\n1.5.1 listening/reflecting\n1.5.2 non verbal communication\n1.5.3 assertiveness\n1.5.4 behavior labeling\n1.5.5 testing understanding\n1.5.6 seeking information\n1.5.7 self disclosing\nAnalytic skills\n1.6.1 observing differences between content and\nprocess\n1.6.2 identifying bargaining information\n1.6.3 applying strategies to manage process\n1.6.4 applying steps in negotiating process\n1.6.5 strategies to manage conflict\n1.6.6 steps in negotiating process\n1.6.7 options within organization and externally for\nresolving conflict\n2. Non verbal\nenvironments\n2.1\n2.2\n2.3\n2.4\nFriendly reception\nWarm and welcoming room\nRefreshments offered\nLead in conversation before negotiation begins\n3. Active listening\n3.1\n3.2\n3.3\n3.4\n3.5\nAttentive\nDon’t interrupt\nGood posture\nMaintain eye contact\nReflective listening\n4. Questioning\ntechniques\n4.1\n4.2\n4.3\nDirect\nIndirect\nOpen-ended\n\n--- PDF PAGE 12 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 11\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated sufficient knowledge of the factors\ninfluencing negotiation to achieve agreed outcome\n1.2 Participated in negotiation with at least one person to\nachieve an agreed outcome\n2. Underpinning\nknowledge and\nAttitude\n2.1 Codes of practice and guidelines for the organization\n2.2 Organizations policy and procedures for negotiations\n2.3 Decision making and conflict resolution strategies\nprocedures\n2.4 Problem solving strategies on how to deal with\nunexpected questions and attitudes during negotiation\n2.5 Flexibility\n2.6 Empathy\n3. Underpinning\nskills\n3.1 Interpersonal skills to develop rapport with other parties\n3.2 Communication skills (verbal and listening)\n3.3 Observation skills\n3.1 Negotiation skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Room with facilities necessary for the negotiation process\n4.2 Human resources (negotiators)\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Observation/demonstration and questioning\n5.2 Portfolio assessment\n5.3 Oral and written questioning\n5.4 Third party report\n6. Context of\nassessment\n6.1 Competency to be assessed in real work environment or\nin a simulated workplace setting.\n\n--- PDF PAGE 13 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 12\nUNIT OF COMPETENCY :\nSOLVE PROBLEMS RELATED TO WORK ACTIVITIES\nUNIT CODE\n: 500311112\nUNIT DESCRIPTOR\n:\nThis unit of competencies covers the knowledge, skills and\nattitudes required to solve problems in the workplace\nincluding the application of problem solving techniques and\nto determine and resolve the root cause of problems.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1.\nIdentify the problem\n1.1\nVariances are identified from normal operating\nparameters; and product quality\n1.2\nExtent, cause and nature are of the problem are\ndefined through observation, investigation and\nanalytical techniques\n1.3\nProblems are clearly stated and specified\n2.\nDetermine\nfundamental causes\nof the problem\n2.1\nPossible causes are identified based on\nexperience and the use of problem solving tools\n/ analytical techniques.\n2.2\nPossible cause statements are developed\nbased on findings\n2.3\nFundamental causes are identified per results of\ninvestigation conducted\n3.\nDetermine\ncorrective action\n3.1\nAll possible options are considered for\nresolution of the problem\n3.2\nStrengths and weaknesses of possible options\nare considered\n3.3\nCorrective actions are determined to resolve the\nproblem and possible future causes\n3.4\nAction plans are developed identifying\nmeasurable objectives, resource needs and\ntimelines in accordance with safety and\noperating procedures\n4.\nProvide\nrecommendation/s\nto manager\n4.1\nReport on recommendations are prepared\n4.2\nRecommendations are presented to appropriate\npersonnel.\n4.3\nRecommendations are followed-up, if required\n\n--- PDF PAGE 14 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Analytical techniques\n1.1\nBrainstorming\n1.2\nIntuitions/Logic\n1.3\nCause and effect diagrams\n1.4\nPareto analysis\n1.5\nSWOT analysis\n1.6\nGant chart, Pert CPM and graphs\n1.7\nScatter diagrams\n2. Problem\n\n2.1\nNon – routine process and quality problems\n2.2\nEquipment selection, availability and failure\n2.3\nTeamwork and work allocation problem\n2.4\nSafety and emergency situations and\nincidents\n3. Action plans\n\n3.1\nPriority requirements\n3.2\nMeasurable objectives\n3.3\nResource requirements\n3.4\nTimelines\n3.5\nCo-ordination and feedback requirements\n3.6\nSafety requirements\n3.7\nRisk assessment\n3.8\nEnvironmental requirements\n\n--- PDF PAGE 15 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 14\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1\nIdentified the problem\n1.2\nDetermined the fundamental causes of the problem\n1.3\nDetermined the correct / preventive action\n1.4\nProvided recommendation to manager\nThese aspects may be best assessed using a range of\nscenarios / case studies / what ifs as a stimulus with a walk\nthrough forming part of the response. These assessment\nactivities should include a range of problems, including new,\nunusual and improbable situations that may have happened.\n2. Underpinning\nknowledge\n2.1\nCompetence includes a thorough knowledge and\nunderstanding of the process, normal operating\nparameters, and product quality to recognize non-\nstandard situations\n2.2\nCompetence to include the ability to apply and\nexplain, sufficient for the identification of fundamental\ncause, determining the corrective action and provision\nof recommendations\n2.2.1\nRelevant equipment and operational\nprocesses\n2.2.2\nCompany goals, targets and measures\n2.2.3\nCompany quality, OHS and environmental\nrequirement\n2.2.4\nPrinciples of decision making strategies and\ntechniques\n2.2.5\nCompany information systems and data\ncollation\n2.2.6\nIndustry codes and standards\n3. Underpinning\nskills\n3.1\nUsing range of formal problem solving techniques\n3.2\nIdentifying and clarifying the nature of the problem\n3.3\nDevising the best solution\n3.4\nEvaluating the solution\n3.5\nImplementation of a developed plan to rectify the\nproblem\n\n--- PDF PAGE 16 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 15\n\n4. Resource\nimplications\n4.1\nAssessment will require access to an operating plant\nover an extended period of time, or a suitable method\nof gathering evidence of operating ability over a range\nof situations. A bank of scenarios / case studies /\nwhat ifs will be required as well as bank of questions\nwhich will be used to probe the reason behind the\nobservable action.\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Case studies on solving problems in the workplace\n5.2 Observation\nThe unit will be assessed in a holistic manner as is practical\nand may be integrated with the assessment of other relevant\nunits of competency. Assessment will occur over a range of\nsituations, which will include disruptions to normal, smooth\noperation. Simulation may be required to allow for timely\nassessment of parts of this unit of competency. Simulation\nshould be based on the actual workplace and will include\nwalk through of the relevant competency components.\n6. Context of\nassessment\n6.1\nIn all workplace, it may be appropriate to assess this\nunit concurrently with relevant teamwork or operation\nunits.\n\n--- PDF PAGE 17 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 16\nUNIT OF COMPETENCY: USE MATHEMATICAL CONCEPTS AND\n TECHNIQUES\n\nUNIT CODE : 500311113\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nin the application of mathematical concepts and\ntechniques.\n\nELEMENT\nPerformance Criteria\nItalicized terms are elaborated in the\nRange of Variables\n1. Identify mathematical\ntools and techniques to\nsolve problem\n1.1 Problem areas are identified based on given\ncondition\n1.2 Mathematical techniques are selected based on\nthe given problem\n2. Apply mathematical\nprocedure/solution\n2.1 Mathematical techniques are applied based on the\nproblem identified\n2.2 Mathematical computations are performed to the\nlevel of accuracy required for the problem\n2.3 Results of mathematical computation is\ndetermined and verified based on job requirements\n3. Analyze results\n3.1 Result of application is reviewed based on\nexpected and required specifications and outcome\n3.2 Appropriate action is applied in case of error\n\n--- PDF PAGE 18 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 17\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Mathematical techniques\nMay include but are not limited to:\n1.1 Four fundamental operations\n1.2 Measurements\n1.3 Use/Conversion of units of measurements\n1.4 Use of standard formulas\n2. Appropriate action\n2.1 Review in the use of mathematical techniques\n(e.g. recalculation, re-modeling)\n2.2 Report error to immediate superior for proper\naction\n\n--- PDF PAGE 19 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 18\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Identified, applied and reviewed the use of mathematical\nconcepts and techniques to workplace problems\n2. Underpinning\nknowledge\n2.1 Fundamental operation (addition, subtraction, division,\nmultiplication)\n2.2 Measurement system\n2.3 Precision and accuracy\n2.4 Basic measuring tools/devices\n3. Underpinning\nskills\n3.1 Applying mathematical computations\n3.2 Using calculator\n3.3 Using different measuring tools\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Calculator\n4.2 Basic measuring tools\n4.3 Case Problems\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1 Authenticated portfolio\n5.2 Written Test\n5.3 Interview/Oral Questioning\n5.4 Demonstration\n6. Context of\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 20 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 19\nUNIT OF COMPETENCY: USE RELEVANT TECHNOLOGIES\n\nUNIT CODE : 500311114\n\nUNIT DESCRIPTOR : This unit of competency covers the knowledge, skills, and\nattitude required in selecting, sourcing and applying\nappropriate and affordable technologies in the workplace.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n\n1. Study/select\nappropriate technology\n\n1.1 Usage of different technologies is determined\nbased on job requirements\n1.2 Appropriate technology is selected as per work\n specification\n\n2. Apply relevant\ntechnology\n\n2.1 Relevant technology is effectively used in carrying\n out function\n2.2 Applicable software and hardware are used as per\n task requirement\n2.3 Management concepts are observed and\npracticed as per established industry practices\n\n3. Maintain/enhance of\nrelevant technology\n\n3.1 Maintenance of technology is applied in\naccordance with the industry standard operating\nprocedure, manufacturer’s operating guidelines\nand occupational health and safety procedure to\nensure its operative ability\n3.2 Updating of technology is maintained through\ncontinuing education or training in accordance with\njob requirement\n3.3 Technology failure/ defect is immediately reported\nto the concern/responsible person or section for\nappropriate action\n\n--- PDF PAGE 21 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 20\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Technology\nMay include but are not limited to:\n1.1 Office technology\n1.2 Industrial technology\n1.3 System technology\n1.4 Information technology\n1.5 Training technology\n2. Management concepts\nMay include but not limited to:\n2.1 Real Time Management\n2.2 KAIZEN or continuous improvement\n2.3 5s\n2.4 Total Quality Management\n2.5 Other management/productivity tools\n3. Industry standard\noperating procedure\n3.1 Written guidelines relative to the usage of office\ntechnology/equipment\n3.2 Verbal advise/instruction from the co-worker\n4. Manufacturer’s operating\nguidelines/ instructions\n4.1 Written instruction/manuals of specific\ntechnology/ equipment\n4.2 General instruction manual\n4.3 Verbal advise from manufacturer relative to the\noperation of equipment\n5. Occupational health and\nsafety procedure\n5.1 Relevant statutes on OHS\n5.2 Company guidelines in using\n technology/equipment\n6. Appropriate action\n6.1 Implementing preventive maintenance schedule\n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 22 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 21\nEVIDENCE GUIDE\n\n2 1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Studied and selected appropriate technology consistent\nwith work requirements\n1.2 Applied relevant technology\n1.3 Maintained and enhanced operative ability of relevant\ntechnology\n2. Underpinning\nknowledge\n2.1 Awareness on technology and its function\n2.2 Repair and maintenance procedure\n2.3 Operating instructions\n2.4 Applicable software\n2.5 Communication techniques\n2.6 Health and safety procedure\n2.7 Company policy in relation to relevant technology\n2.8 Different management concepts\n2.9 Technology adaptability\n3. Underpinning\nskills\n3.1 Relevant technology application/implementation\n3.2 Basic communication skills\n3.3 Software applications skills\n3.4 Basic troubleshooting skills\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Relevant technology\n4.2 Interview and demonstration questionnaires\n4.3 Assessment packages\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Interview\n5.2 Actual demonstration\n5.3 Authenticated portfolio (related certificates of\ntraining/seminar)\n6. Context of\nassessment\n6.1 Competency may be assessed in actual workplace or\nsimulated environment\n\n--- PDF PAGE 23 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 22\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nPERFORM MENSURATION AND CALCULATION\n\nUNIT CODE\n: ALT311202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\nmeasuring and calculating using tools and measuring\ninstrument. It also covers caring for and handling of\nmeasuring instrument.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Select\nmeasuring\ninstruments\n1.1\nObject or component to be measured is identified\n1.2\nCorrect specifications are obtained from relevant source\n1.3\nAppropriate measuring instrument is selected according to\njob requirements\n2. Carry out\nmeasurements\nand calculation\n\n2.1 Measuring tools are selected in line with job requirements\n2.2 Accurate measurements are obtained to job\n2.3 Calculation needed to complete work tasks are performed\nusing the four fundamental operation of addition (+),\nsubtraction (-), multiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\nnumbers are used to complete workplace tasks.\n2.5\nNumerical computation is self-checked and corrected for\naccuracy\n2.6\nInstruments are read to the limit of accuracy of the tool.\n3. Maintain\nmeasuring\ninstruments\n\n3.4\nMeasuring instruments are kept free from corrosion\n3.4\nMeasuring instruments are not dropped to avoid damage\n3.4\nMeasuring instruments are cleaned before and after using.\n\n--- PDF PAGE 24 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 23\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMeasuring instruments includes:\n1.1\nMultitester\n1.2\nMicrometer (In-out, depth)\n1.3\nVernier caliper (Out, inside)\n1.4\nDial gauge with Mag. Std.\n1.5\nPlastigauge\n1.6\nStraight edge\n1.7\nThickness gauge\n1.8\nTorque gauge\n1.9\nSmall hole gauge\n1.10 Telescopic gauge\n1.11 Try square\n1.12 Protractor\n1.13 Combination gauge\n1.14 Steel rule\n2. Calculation\n\nIncludes calculation of the following:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2.10 Out of roundness\n2.11 Oil clearance\n2.12 End play/thrust clearance\n\n--- PDF PAGE 25 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 24\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nSelected measuring instruments\n1.2\nCarried-out measurements and calculations.\n1.3\nMaintained measuring instruments\n2. Underpinning\nknowledge\n2.1\nTypes of measuring instruments and its uses\n2.2\nSafe handling procedures in using measuring instruments\n2.3\nFour fundamental operation of mathematics\n2.2\nFormula for volume, area, perimeter and other geometric figures\n3. Underpinning\n skills\n3.1\nCaring and handling measuring instruments\n3.2\nCalibrating and using measuring instruments\n3.3 Performing calculation by Addition, Subtraction, Multiplication\nand Division\n3.4 Visualizing objects and shapes\n3.4 Interpreting formula for volume, area, perimeter and other\ngeometric figures\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing processes\n4.3\nInstructional materials relevant to the propose activity\n5. Method of\nassessment\n\nCompetency may be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4\nDemonstration with questioning\n6. Context of\nassessment\n\n6.1\nCompetency elements must be assessed in a safe working\nenvironment\n6.2\nAssessment may be conducted in a workplace or simulated\nenvironment\n\n--- PDF PAGE 26 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 25\nUNIT OF COMPETENCY :\nREAD, INTERPRET AND APPLY ENGINEERING\nDRAWINGS\n\nUNIT CODE : ALT742201\n\nUNIT DESCRIPTOR :\nThis unit deals with identifying, interpreting and applying\nautomotive mechanical assembly engineering manuals /\nspecifications in accordance with requirements of the job.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\nengineering\nmanuals /\nspecifications\n\n1.1 Appropriate manuals are identified and accessed as per job\nrequirements.\n1.2 Version and date of manual is checked to ensure correct\nspecification and procedure are identified.\n\n2. Interpret\nmanuals\n\n4.1 Relevant sections, chapters of manuals/specifications are located\nin relations to the work to be conducted\n4.2 Information and procedure in the manual are interpreted in\naccordance to industry practices\n\n3. Apply\ninformation in\nmanual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data is applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted in\naccordance with information contained on the manual or\nspecifications\n\n4. Store manuals\n\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 27 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 26\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\n\n Kinds of manuals:\n1.1 Manufacturer’s specification manual\n1.2 Vehicle assembly manual\n1.3 Vehicle quality standard manual\n1.4 Vehicle specification manual\n\n--- PDF PAGE 28 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 27\n\n EVIDENCE GUIDE\n\n1.Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n2. Underpinning\nknowledge\n4.1 Types of manuals used in automotive industry\n4.2 Identification of symbols used in the manuals\n4.3 Identification of units of measurements\n4.4 Unit conversion\n3. Underpinning\nskills\n3.1 Reading and comprehension skills required to identify and\ninterpret automotive manuals and specifications\n3.2 Accessing information and data\n4. Resource\nImplications\n\nThe following resources MUST be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Work order\n4.3 Actual vehicle or simulator\n5. Method of\nassessment\n\nCompetency MUST be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n6. Context of\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 29 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 28\n\nUNIT OF COMPETENCY :\nMOVE AND POSITION VEHICLE\n\nUNIT CODE\n:\nALT723202\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude needed\nto move and position vehicle in a workshop before and after\nservicing.\nELEMENT PERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare\nvehicle for\ndriving\n1.1\nCheck-up procedures is performed based on vehicle\nmanufacturer standard\n2. Move and\nposition\nvehicle\n2.1\nSelect vehicle to be moved or re-position.\n2.2 Drive the vehicle to appropriate location\n2.3\nPark vehicle following parking safety techniques and\nprocedure\n3. Check the\nvehicle\n3.1 Vehicle position is checked as per required\n3.2 Vehicle is checked for external damages\n\n--- PDF PAGE 30 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 29\n RANGE OF VARIABLE\n\nVARIABLE\nRANGE\n1. Check-up procedure\nCheck-up procedures include the following:\n1.1\nOil level\n1.2\nBrake fluid\n1.3\nClutch fluid\n1.4\nCoolant level\n1.5\nBattery (electrolyte)\n1.6\nTire pressure\n1.7\nPosition of driving gear\n1.8\nLighting and warning devices\n2. Vehicles\n2.1 Vehicles with automatic transmission\n2.2 Vehicles with manual transmission\n3. Parking safety\ntechniques\n3.1 Engaging of park brake\n3.2 Vehicle parking position\n3.3 Front wheel position\n\n--- PDF PAGE 31 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 30\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1\nPrepared vehicle for driving.\n1.2\nMoved and positioned vehicle\n1.3\nChecked the vehicle.\n2. Underpinning\nknowledge\nand attitudes\n2.1 Driver’s code of conduct\n2.2 Workshop signs and symbols\n2.3 Driving skills\n2.4 Vehicle accessories for safe driving and parking\n3. Underpinning\nskills\n3.1\nAbility to handle vehicle/maneuver vehicle the easiest way\n3.2\nImmediate response to accident\n3.3\nPreparing vehicle for driving\n3.4\nParking downhill, uphill, parallel\n3.5\nShifting gears\n3.6\nManeuvering\n4. Resource\n implications\nThe following resources MUST be provided:\n4.1\nDriving range/area\n4.2\nAppropriate vehicle for driving\n4.3\nVehicle accessories\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nObservation with questioning\n5.2\nWritten or oral examination\n6. Context of\nassessment\n6.1\nAssessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n6.2\nAssessment of practical skills must be done in a workplace or\nsimulated environment.\n\n--- PDF PAGE 32 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 31\nUNIT OF COMPETENCY :\nAPPLY APPROPRIATE SEALANT/ADHESIVE\n\nUNIT CODE :\nALT723201\n\nUNIT DESCRIPTOR\n:\nThis competency unit covers the selection and\napplication of sealant/adhesives.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify\nappropriate\nsealant /\nadhesive\n1.1 Sealant/adhesive is selected in line with job\n requirements and manufacturer’s specification\n1.2 Sealant/adhesive checking is performed to ensure that\nproduct is fit for use.\n2. Prepare\nsurface for\nsealant /\nadhesive\napplication\n2.1 Surface materials are identified as per construction\n2.2 Surface is cleaned and free of moisture, dust and other\n foreign matters to ensure maximum adhesion or seal.\n3. Apply\nSealant /\nadhesive\n evenly\n3.1 Sealant/adhesive is applied evenly on the surface in line\n with manufacturer’s specification\n3.2 Excess sealant/adhesive is removed by sanding or\n scrapping\n\n3.3 Tools and equipment used to apply sealant/adhesive are\nappropriate to job requirements\n3.4 Safety are observed and PPE are worn in accordance with\nindustry SOP\n3.4 Hazards associated with the use of sealant and adhesives are\nidentified.\n4. Store /\nDispose of\nsealant /\nadhesive\n4.1 Sealant/adhesive are stored as per prescribed procedure\n4.2 Waste are disposed as per workshop SOP\n\n--- PDF PAGE 33 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 32\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Sealant/Adhesive\nSealant/adhesive includes:\n1.1Form in Place Gasket (FIPG)\n1.2 Ribbon Sealer\n1.3Hametite\n1.4Silicon Body sealer\n1.5 Prestite for Auto and Auto Aircon\n2.Adhesive/Sealant\n checking\n\nAdhesive/Sealant checking includes:\n2.1 Expiry date\n2.2 Free of contamination\n2.3 Cap/Covers\n2.4 Tightly closed\n2.5 Concentration\n3. Tools and\nequipment\nTools and equipment include:\n3.1 Putty knife\n3.2 Scraper\n3.3 Compressor\n3.4 Steel brush\n3.5 Paint brush\n3.6 Rubber hammer\n3.7 Hand tools\nPersonal protective equipment include:\n3.8 Gloves\n3.9 Apron\n3.10 Safety shoes\n3.11Goggles\n3.12Gas mask\n4. Safety\nSafety includes:\n4.1 Ventilation\n4.2 Handling of Flammable/Irritating substances\n4.3 Use of Personal Protective Equipment\n5. Hazards\n Hazard includes:\n5.1 Fumes\n5.2 Skin irritation\n5.3 Burns\n\n--- PDF PAGE 34 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 33\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified appropriate sealant/adhesives\n1.2 Prepared surface for sealant/adhesive\n1.3 Applied sealant/adhesive\n1.4 Stored unused or dispose of used sealant/adhesive\n2. Underpinning\nknowledge\nand attitude\n2.1 OH & S regulation\n2.2 Safe handling of sealant/adhesive\n2.3 Industry code of practice\n2.4 Procedures in sealant/adhesive application\n2.5Procedures in interpreting manuals\n3. Underpinning\nskills\n3.1 Handling sealant/adhesive\n3.2 Applying sealant/adhesive\n3.3. Sanding the surface\n3.4 Use of tools, equipment\n3.5 Mixing of body filler and epoxy base and hardener\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Materials relevant to the activity\n4.2 Appropriate tools and equipment\n4.3 Real or simulated workplace\n5. Method of\nassessment\nCompetency MUST be assessed through\n5.1 Observation with questioning\n5.2 Interview related to:\n• Safe and correct use of tools and equipment\n• Application of adhesive/sealant\n6. Context of\nassessment\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment may be done in a workplace or simulated\nenvironment\n\n--- PDF PAGE 35 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 34\nUNIT OF COMPETENCY : PERFORM SHOP MAINTENANCE\n\nUNIT CODE : ALT723205\n\nUNIT DESCRIPTOR : This unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage and\nchecking of tools/equipment and disposal of used\nmaterials are also incorporated in this competency\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n1.1 Cleaning solvent used as per workshop/tools cleaning\nrequirement\n1.2 Work area is checked and cleaned\n1.3 Wet surface/spot in work area is wiped and dried\n2. Store/arrange tools\nand shop\nequipment\n\n2.1 Tools/equipment are checked and stored in their\n respective shelves/location\n\n2.2 Corresponding labels are posted and visible\n\n2.3 Tools are safely secured and logged in the records\n3. Dispose\nwastes/used\nlubricants\n3.1 Containers for used lubricants are visibly labeled\n\n3.2 Wastes/used lubricants are disposed as per\n workshop SOP\n4. Report damaged\ntools/equipment\n\n4.1 Complete inventory of tools/equipment is maintained\n\n4.2 Damaged tools/equipment/facilities are identified and\n repair recommendation is given\n\n4.3 Reports prepared has no error/discrepancy\n\n--- PDF PAGE 36 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 35\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Cleaning\n requirement\n1.1 Cleaning solvent\n1.2 Inventory of supplies, tools, equipment, facilities\n1.3 List of mechanics/technicians\n1.4 Rags\n1.5 Broom\n1.6 Map\n1.7 Pail\n1.8 Used oil container\n1.9 Oiler\n1.10 Dust/waste bin\n2. Work Area\nWork areas include:\n2.1 Workshop areas for assembly of automotive vehicle and/or\noutdoor power equipment\n2.2 Open workshop and enclosed, ventilated office area\n2.3 Other variables may include workshop with:\n• Mess hall\n• Wash room\n•\nComfort room\n\n--- PDF PAGE 37 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n 36\n EVIDENCE GUIDE\n\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Cleaned workshop tools/facilities\n1.2 Maintained equipment, tools and facilities\n1.3 Disposed wastes and used lubricants/fluid as per required\n procedure\n2. Underpinning\nknowledge\nand attitudes\n2.1 5S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of Equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire Extinguishers and prevention\n2.9 Storage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty, Patience,\n Attention to Details)\n3. Underpinning\nskills\n3.1 Handling/Storing of tools/equipment/supplies and material\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5 Monitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1 Written/Oral Questioning\n5.2 Demonstration\n5.3 Assessment of underpinning knowledge and practical skills\n may be combined.\n6. Context of\nassessment\n6.1 Competency must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 38 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n37\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY :\n\nCONDUCT ENGINE HOT TEST\n\nUNIT CODE\n:\n\nALT827319\n\nUNIT DESCRIPTOR :\nThis unit specifies the competency required to assess the\nstatus of an engine for operating inconsistencies or faults\nby connecting it to all service requirements and running it\nfor a designated duration. The unit includes the transfer of\nthe engine to and from the inspection cradle, the\nconnection and disconnection of services, the completion\nof computer / keypad aided and manual / sensory testing to\nspecification and the reporting of non-conforming engines.\n\nThe competency must require testing beyond that involving\nonly computer/keypad aided monitoring systems\n.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare\nfor work\n\n1.1 Planning and preparation of work instruction including\nplans, specifications, quality requirements and operational\ndetails are obtained, confirmed and applied.\n1.2 Occupational health and safety (OH & S) requirements\nare followed in accordance with company safety policies\nand procedures.\n1.3 Tools and equipment selected to carry out tasks are\nconsistent with the requirements of the job, checked for\nserviceability and any faults are rectified or reported prior to\ncommencement.\n1.4 Materials appropriate to the work application are identified,\nobtained, prepared, safely handled and located ready for\nuse.\n1.5 Working environment considerations are identified and\nmeasures to reduce noise, dust and obstacles are applied.\n2. Shift engine\n2.1 Engine is transferred from the assembly line to the engine\ntesting area.\n2.2 Engine is located in position ready for hot test procedures.\n2.3 Engine which pass inspection are transferred back to the\nassembly line.\n2.4 Non-conforming engines are transferred to the rectification\narea.\n\n--- PDF PAGE 39 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n38\n\n3. Perform engine\nhot test\n3.1 Engine is mounted in the engine testing cradle.\n3.2 Services are connected to the engine simulating normal\noperating conditions.\n3.3 Engine is brought to hot operating conditions.\n3.4 Computerized / keypad aided and manual/sensory tests are\nconducted on all operating facets of the engine against\ndesignated performance specifications.\n3.5 Minor modifications are carried out in accordance with\ncompany procedures and engineering manuals.\n3.6 Engine hot test results including engine faults are recorded\nand documented\n3.7 Engine designated as conforming or requiring rectification\nare labeled and prepared for transfer.\n4. Clean up\n4.1 Work area is cleared and materials disposed of, reused or\nrecycled in accordance with company requirements.\n4.2 Tools and equipment are cleaned, checked, maintained and\nstored in accordance with company requirements.\n\n--- PDF PAGE 40 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n39\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Planning and\npreparation\nPlanning and preparation may include but not be limited to:\n1.1 Engine inspection\n1.2 Defect identification\n1.3 Assessment of conditions and hazards\n1.4 Determination of work requirements\n2. Occupational\nhealth and safety\n(OH & S)\nrequirements\nOH&S requirements are in accordance with Legislation / regulations\n/ codes of practice and company safety policies and procedures.\nThis may include but not limited to:\n2.1 Use of Protective clothing and equipment\n2.2 Proper use of tools and equipment\n2.3 Workplace and environment safety\n2.4 Handling of materials\n2.5 Use of fire fighting equipment\n2.6 Access to company first aid\n2.7 Hazard control and hazardous materials and substances\n2.8 Use of Personal protective equipment prescribed under\nlegislation/regulation/codes of practice and workplace policies\nand practices\n2.9 Following safe operating procedures which include but not be\nlimited to the conduct of operational risk assessment\nand treatments associated with heavy objects, vehicular\nmovement, toxic substances, electrical shock, machinery\nmovement and operation, production line operation, manual and\nmechanical lifting and shifting, working in proximity to others\nand site visitors.\n2.10 Emergency procedures related to this unit are to\ninclude but may not be limited to emergency shutdown\nand stopping of equipment, extinguishing fires, company first\naid requirements and plant evacuation\n3. Tools and\nequipment\nTools and equipment may include:\n3.1 Testing device\n3.2 Hoist\n3.3 Slings\n3.4 Gantry crane\n3.5 Relevant hand and power tools\n4. Materials\n\nMaterials may include:\n4.1 Fuel\n4.2 Oil\n4.3 Water\n4.4 Gas\n\n--- PDF PAGE 41 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n40\n\n5. Working\nenvironment\n\nWorking environment consideration may include management of :\n5.1 Waste\n5.2 Noise\n5.3 Dust\n5.4 Vibration\n5.5 Workplace housekeeping (Clean-up)\n6. Engineering\nmanuals\nEngineering manuals are to include but not be limited to:\n6.1 Vehicle assembly manuals per model-variant\n6.2 Vehicle quality standard manuals per model/variant\n6.3 Process control Chart/sheets\n6.4 Vehicle Specification sheets\n6.5 Materials/Parts list\n7. Engine fault\n\nTesting may include but not limited to discovery of faults such as:\n7.1 Misfire,\n7.2 Bore discrepancies\n7.3 Fuel, exhaust and electrical\n7.4 Cooling\n7.5 Faulty gaskets\n7.6 Leaks and abnormal noises\n7.7 Ignition\n7.8 All other engine operations and parts\n\n--- PDF PAGE 42 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n41\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Located interpreted and applied the relevant information,\nstandards and specifications.\n1.2 Complied with company safety policies and procedures and\nOH&S legislation / regulations / codes of practice applicable to\noperations including quality requirements\n1.3 Shifted engine\n1.4 Applied hot test procedures to correctly identify a minimum of\nthree (3) different and significant non-conforming engines, which\nmust include faults identified using both computer/ keypad aided\nsystems and manual / sensory capabilities\n1.5Communicated and worked effectively and safely with others\n2. Underpinning\nknowledge and\nattitudes\n2.1 Workplace and equipment safety requirements\n2.2 Relevant company production quality standards\n2.3 Company manufacturing and production techniques for\nmechanical components and systems\n2.4 Automotive Industry terminology\n2.5 Tools and equipment types, characteristics, uses and limitations\n2.6 Engine faults and symptoms\n2.7 Engine parts and construction\n2.8 Engine testing techniques and equipment\n2.9 Processes for the calculation of material requirements\n2.10 Material Safety Data Sheets\n2.11 Plans, drawings and specifications\n2.12 Materials handling, storage and environment-friendly waste\nmanagement\n2.13 Company safety policies and procedures\n2.14\nRelevant Philippine Standards\n3. Underpinning\nskills\n3.1 Collect, organize, interpret and understand the information\nrequired for mechanical rectification, including work instructions,\nplans / sketches / diagrams, safety instructions, signage, labels,\nquality procedures, material safety data sheets and equipment\ninstructions\n3.2 Communicate ideas and information orally and in writing, in\nsimple English to enable confirmation of work requirements,\npassage of information and requests to other workers during\noperations and the reporting and recording of work outcomes\n3.3 Conduct activities associated with mechanical rectification,\nincluding the coordination and use of equipment, materials\nand tools to avoid backtracking and rework\n3.4 Work with others and in a team by recognizing dependencies\nand using co-operative approaches to optimize satisfaction and\nproductivity\n3.5 Establish safe and effective work processes which anticipate\nand/or resolve problems and downtime, to systematically\ndevelop solutions to avoid or minimize reworking and avoid\nwastage\n\n--- PDF PAGE 43 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n42\n3.6 Use mathematical ideas and techniques to correctly calculate\ntime, assess tolerances and timing, apply accurate\nmeasurements, and establish quality checks\n3.7 Use workplace technology related to mechanical rectification,\nincluding the use of computers, measuring equipment,\ncomputerized equipment, mechanical diagnostic equipment, the\nuse of communication devices and the reporting/recording of\nresults\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1 Workplace\n4.2 Appropriate tools and equipment\n4.3 Materials relevant to the proposed activity and tasks\n5. Method of\nassessment\nCompetency MUST be assessed through\n5.1 Observation with questioning\n5.2 Portfolio\n6. Context of\nassessment\nCompetency may be assessed individually in the actual workplace\nor a simulated workplace environment.\n\n--- PDF PAGE 44 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n43\n\nUNIT OF COMPETENCY\n: RECTIFY ASSEMBLY FAULTS ON ASSEMBLED\nMECHANICAL ASSEMBLIES\n\nUNIT CODE\n: ALT827320\n\nUNIT DESCRIPTOR\n: This unit specifies the competency required to rectify\nassembly faults on assembled mechanical assemblies,\nincluding sealing systems, based on recommendations from\nthe inspection records and report of the fully assembled\nvehicle. The unit includes location, diagnosis, rectification of\nthe assembly and sealing faults and full re-assembly in an\noffline environment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Plan and prepare for\nwork\n\n1.1 Planning and preparation of work instructions, including\nrelevant inspection reports and forms and quality\nrequirements are obtained, confirmed and applied\n1.2 Occupational health and safety (OH & S) requirements are\nfollowed in accordance with company safety policies and\nprocedures\n1.3 Tools and equipment selected to carry out tasks are\nconsistent with the requirements of the job, checked for\nserviceability and any faults are rectified or reported prior to\ncommencement\n1.4 Materials appropriate to the work application are identified,\nobtained, prepared, safely handled and located ready for use\n1.5 Working environment considerations are identified and\nmeasures to reduce noise, dust and obstacles are applied\n2. Locate and rectify\nassembly faults\n2.1 Final report is interpreted and fault located on assembled\nvehicle\n2.2 Assembly fault is diagnosed and suitable method of\ncorrection planned\n2.3 Rectification is applied, depending on the fault and in\naccordance with engineering manuals\n2.4 Fault is re-diagnosed to assess outcome of rectification and to\nensure rework has eliminated the fault and final adjustments\nmade\n2.5 Documentation is completed outlining nature of problem, work\nconducted and outcome and appropriate communication is\nconveyed, in accordance with company requirements\n2.6 Vehicle is returned to production line\n\n--- PDF PAGE 45 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III\n\n44\