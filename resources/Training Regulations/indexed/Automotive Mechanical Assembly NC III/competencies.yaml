          "source_text": "1. Plan and prepare \nfor work \n \n \n1.1 Planning and preparation of work instruction including \nplans, specifications, quality requirements and operational \ndetails are obtained, confirmed and applied. \n1.2 Occupational health and safety (OH & S) requirements \nare followed in accordance with company safety policies \nand procedures.  \n1.3 Tools and equipment selected to carry out tasks are \nconsistent with the requirements of the job, checked for \nserviceability and any faults are rectified or reported prior to \ncommencement. \n1.4 Materials appropriate to the work application are identified, \nobtained, prepared, safely handled and located ready for \nuse. \n1.5 Working environment considerations are identified and \nmeasures to reduce noise, dust and obstacles are applied.\n2. Shift engine \n2.1 Engine is transferred from the assembly line to the engine \ntesting area. \n2.2 Engine is located in position ready for hot test procedures. \n2.3 Engine which pass inspection are transferred back to the \nassembly line. \n2.4 Non-conforming engines are transferred to the rectification \narea.\n\n--- PDF PAGE 39 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III                                                                      \n           \n38\n \n3. Perform engine \nhot  test  \n3.1 Engine is mounted in the engine testing cradle.  \n3.2 Services are connected to the engine simulating normal \noperating conditions. \n3.3 Engine is brought to hot operating conditions. \n3.4 Computerized / keypad aided and manual/sensory tests are \nconducted on all operating facets of the engine against \ndesignated performance specifications. \n3.5 Minor modifications are carried out in accordance with \ncompany procedures and engineering manuals. \n3.6 Engine hot test results including engine faults are recorded \nand documented \n3.7 Engine designated as conforming or requiring rectification \nare labeled and prepared for transfer.\n4. Clean up \n4.1 Work area is cleared and materials disposed of, reused or \nrecycled in accordance with company requirements. \n4.2 Tools and equipment are cleaned, checked, maintained and \nstored in accordance with company requirements.\n\n--- PDF PAGE 40 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III                                                                      \n           \n39\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Planning and \npreparation \nPlanning and preparation may include but not be limited to: \n1.1   Engine inspection \n1.2   Defect identification \n1.3   Assessment of conditions and hazards \n1.4   Determination of work requirements \n2. Occupational \nhealth and safety \n(OH & S) \nrequirements  \nOH&S requirements are in accordance with Legislation / regulations \n/ codes of practice and company safety policies and procedures. \nThis may include but not limited to: \n2.1 Use of Protective clothing and equipment \n2.2 Proper use of tools and equipment  \n2.3 Workplace and  environment safety \n2.4 Handling of materials \n2.5 Use of fire fighting equipment \n2.6 Access to company first aid \n2.7 Hazard control and hazardous materials and substances \n2.8 Use of Personal protective equipment prescribed under \nlegislation/regulation/codes of practice and workplace policies \nand practices \n2.9 Following safe operating procedures which include but not be \nlimited to the conduct of operational risk assessment \nand treatments associated with heavy objects, vehicular \nmovement, toxic substances, electrical shock, machinery \nmovement and operation, production line operation, manual and \nmechanical lifting and shifting, working in proximity to others \nand site visitors. \n2.10 Emergency procedures related to this unit are to \ninclude but may not be limited to emergency shutdown \nand stopping of equipment, extinguishing fires, company first \naid requirements and plant evacuation \n3. Tools and \nequipment  \nTools and equipment may include: \n3.1  Testing device \n3.2  Hoist \n3.3  Slings \n3.4  Gantry crane  \n3.5 Relevant hand and power tools \n4. Materials  \n \nMaterials may include: \n4.1 Fuel \n4.2 Oil \n4.3 Water  \n4.4 Gas\n\n--- PDF PAGE 41 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III                                                                      \n           \n40\n \n5. Working \nenvironment \n \nWorking environment consideration may include management of : \n5.1 Waste  \n5.2 Noise \n5.3 Dust \n5.4 Vibration  \n5.5 Workplace  housekeeping (Clean-up)\n6. Engineering \nmanuals  \nEngineering manuals are to include but not be limited to: \n6.1 Vehicle assembly manuals per model-variant \n6.2 Vehicle quality standard manuals per model/variant \n6.3 Process control Chart/sheets \n6.4 Vehicle Specification sheets \n6.5 Materials/Parts list\n7. Engine fault \n \nTesting may include but not limited to discovery of faults such as: \n7.1 Misfire,  \n7.2 Bore discrepancies \n7.3 Fuel, exhaust and electrical \n7.4 Cooling \n7.5 Faulty gaskets \n7.6 Leaks and abnormal noises \n7.7 Ignition \n7.8 All other engine operations and parts\n\n--- PDF PAGE 42 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III                                                                      \n           \n41"
        },
        "evidence_guide": {
          "source_text": "1. Critical aspects \nof competency \nAssessment requires evidence that the candidate:\n1.1 Located interpreted and applied the relevant information, \nstandards and specifications. \n1.2 Complied with company safety policies and procedures and \nOH&S legislation / regulations / codes of practice applicable to \noperations including quality requirements \n1.3 Shifted engine \n1.4 Applied hot test procedures to correctly identify a minimum of \nthree (3) different and significant non-conforming engines, which \nmust include faults identified using both computer/ keypad aided \nsystems and manual / sensory capabilities \n1.5Communicated and worked effectively and safely with others\n2. Underpinning \nknowledge and \nattitudes \n2.1 Workplace and equipment safety requirements \n2.2 Relevant company production quality standards \n2.3 Company manufacturing and production techniques for \nmechanical components and systems \n2.4 Automotive Industry terminology \n2.5 Tools and equipment types, characteristics, uses and limitations \n2.6 Engine faults and symptoms \n2.7 Engine parts and construction \n2.8 Engine testing techniques and equipment \n2.9 Processes for the calculation of material requirements \n2.10 Material Safety Data Sheets \n2.11 Plans, drawings and specifications \n2.12 Materials handling, storage and environment-friendly waste \nmanagement \n2.13 Company safety policies and procedures \n2.14\nRelevant Philippine Standards \n3. Underpinning \nskills \n3.1 Collect, organize, interpret and understand the information \nrequired for mechanical rectification, including work instructions, \nplans / sketches / diagrams, safety instructions, signage, labels, \nquality procedures, material safety data sheets and equipment \ninstructions \n3.2 Communicate ideas and information orally and in writing, in \nsimple English to enable confirmation of work requirements, \npassage of information and requests to other workers during \noperations and the reporting and recording of work outcomes \n3.3 Conduct activities associated with mechanical rectification, \nincluding the coordination and use of equipment, materials \nand tools to avoid backtracking and rework \n3.4 Work with others and in a team by recognizing dependencies \nand using co-operative approaches to optimize satisfaction and \nproductivity \n3.5 Establish safe and effective work processes which anticipate \nand/or resolve problems and downtime, to systematically \ndevelop solutions to avoid or minimize reworking and avoid \nwastage\n\n--- PDF PAGE 43 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III                                                                      \n           \n42\n3.6 Use mathematical ideas and techniques to correctly calculate \ntime, assess tolerances and timing, apply accurate \nmeasurements, and establish quality checks \n3.7 Use workplace technology related to mechanical rectification, \nincluding the use of computers, measuring equipment, \ncomputerized equipment, mechanical diagnostic equipment, the \nuse of communication devices and the reporting/recording of \nresults\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace \n4.2 Appropriate tools and equipment  \n4.3 Materials relevant to the proposed activity and tasks\n5. Method of \nassessment \nCompetency MUST be assessed through \n5.1 Observation with questioning \n5.2 Portfolio \n6. Context of \nassessment \nCompetency may be assessed individually in the actual workplace \nor a simulated workplace environment.",
