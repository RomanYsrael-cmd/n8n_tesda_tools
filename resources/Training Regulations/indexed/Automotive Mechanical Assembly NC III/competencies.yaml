        "source_title": "RECTIFY ASSEMBLY FAULTS ON ASSEMBLED MECHANICAL ASSEMBLIES",
        "source_text": "--- PDF PAGE 44 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III                                                                      \n           \n43\n \nUNIT OF COMPETENCY \n: RECTIFY ASSEMBLY FAULTS ON ASSEMBLED \nMECHANICAL ASSEMBLIES \n \nUNIT CODE \n: ALT827320 \n \nUNIT DESCRIPTOR      \n:  This unit specifies the competency required to rectify \nassembly faults on assembled mechanical assemblies, \nincluding sealing systems, based on recommendations from \nthe inspection records and report of the fully assembled \nvehicle. The unit includes location, diagnosis, rectification of \nthe assembly and sealing faults and full re-assembly in an \noffline environment. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Plan and prepare for \nwork \n \n1.1 Planning and preparation of work instructions, including   \nrelevant inspection reports and forms and quality \nrequirements are obtained, confirmed and applied \n1.2 Occupational health and safety (OH & S) requirements are \nfollowed in accordance with company safety policies and \nprocedures \n1.3 Tools and equipment selected to carry out tasks are \nconsistent with the requirements of the job, checked for \nserviceability and any faults are rectified or reported prior to \ncommencement \n1.4 Materials appropriate to the work application are identified, \nobtained, prepared, safely handled and located ready for use \n1.5 Working environment considerations are identified and \nmeasures to reduce noise, dust and obstacles are applied\n2. Locate and rectify \nassembly faults \n2.1 Final report is interpreted and fault located on assembled \nvehicle  \n2.2 Assembly fault is diagnosed and suitable method of \ncorrection planned \n2.3 Rectification is applied, depending on the fault and in \naccordance with engineering manuals \n2.4 Fault is re-diagnosed to assess outcome of rectification and to \nensure rework has eliminated the fault and final adjustments \nmade \n2.5 Documentation is completed outlining nature of problem, work \nconducted and outcome and appropriate communication is \nconveyed, in accordance with company requirements \n2.6 Vehicle is returned to production line\n\n--- PDF PAGE 45 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III                                                                      \n           \n44\n3. Locate and rectify \nsealing system faults \n \n3.1 Final report is interpreted and faults located on assembled \nvehicles. \n3.2  Sealing faults are assessed and suitable method of correction \nplanned \n3.3 Rectification is applied, dependent on the fault and in \naccordance with engineering manuals \n3.4 Faults are water tested to check outcome of rectification and to \nensure rework has eliminated the fault and final  adjustments \nmade \n3.5 Documentation is completed outlining nature of problem, work \nconducted and outcome and appropriate communication is \nconveyed, in accordance with company requirements \n3.6Vehicle is returned to production sequence\n4. Clean up work area\n \n4.1 Work area is cleared and materials disposed of, reused or \nrecycled in accordance with company requirements \n4.2 Tools and equipment are cleaned, checked, maintained and \nstored in accordance with company requirements\n\n--- PDF PAGE 46 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III                                                                      \n           \n45\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Planning and \npreparation \nPlanning and preparation may include but not limited to: \n1.1 Vehicle inspection \n1.2 Defect identification \n1.3 Assessment of conditions and hazards \n1.4Determination of work requirements\n2. Quality \nrequirements \n \nQuality requirements are to include but not be limited to: \n2.1 Relevant regulations including Philippine Standards \n2.2 Internal company quality policy and standard \n2.3 Company operations and procedures \n3. Occupational \nhealth and safety \n(OH & S) \nrequirements \n \nOH&S requirements are to be in accordance with Legislation / \nregulations / codes of practice and company safety policies and \nprocedures and may include but not limited to: \n3.1 Protective clothing and equipment \n3.2 Proper use of tools and equipment  \n3.3 Workplace environment and safety \n3.4 Handling of materials \n3.5 Use of fire fighting equipment \n3.6 Company first aid \n3.7 Hazard control and hazardous materials and substances \n3.8 Use of Personal protective equipment is to include prescribed \nunder legislation/regulation/codes of \npractice and workplace policies and practices \n3.9  Following safe operating procedures such as conduct of \noperational risk assessment and treatments associated with heavy \nobjects, vehicular movement, toxic substances, electrical shock, \nmachinery movement and operation, production line operation, \nmanual and mechanical lifting and shifting, working in proximity to \nothers and site visitors \n3.10 Emergency procedures related to this unit are to \ninclude but may not be limited to emergency shutdown \nand stopping of equipment, extinguishing fires, \ncompany first aid requirements and plant evacuation\n4. Tools and \nequipment \n4.1 Hand and power tools \n4.2 Mechanical diagnostic equipment  \n4.3 Water testing equipment\n5. Materials \n \nMaterials may include but not be limited to \n5.1 Assembly line consumables and parts \n5.2 Seal material  \n5.3 Bonding agents \n6. Working \nenvironment \n \nWorking environment requirements include management of : \n6.1 Waste  \n6.2 Noise  \n6.3 Dust  \n6.4 Vibration  \n6.5 Workplace Housekeeping (Clean-up)\n\n--- PDF PAGE 47 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III                                                                      \n           \n46\n7. Assembled \nVehicle \n7.1 Passenger Car \n7.2 Utility Vehicle  \n8. Assembly Fault \n8.1 Non-electrical aspects of the instrument panel and \n        associated parts  \n8.2 Door lock and mechanism \n8.3 Windows \n8.4 Upholstery \n8.5 Trimming \n8.6 Suspension Assembly \n8.7 Fuel Tank Assembly \n8.8 Brake, clutch and accelerator pedal assembly \n8.9 Radiator cooling system assembly \n8.10 Air conditioning system \n8.11 Front and rear bumpers assembly \n8.12 Wheel assembly \n8.13 Windshield and door glasses assembly \n9. Engineering \nManuals \n \nEngineering manuals are to include but not be limited to: \n9.1 Vehicle assembly manuals per model-variant \n9.2 Vehicle quality standard manuals per model-variant \n9.3 Process control Chart/sheets \n9.4 Vehicle Specification sheets \n9.5 Materials/Parts list \n10. Sealing system \nfault \nSealing system fault may include but not limited to; \n10.1 Holes \n10.2 Pinches \n10.3 Separation \n10.4 De-bonding \n10.5 Twisting \n10.6 Perishing and raised segments   \n11. Communications \n \nCommunications are to include but not limited to \n11.1 Verbal  \n11.2 Visual instructions  \n11.3 Fault reporting  \n11.4 Site specific instructions \n11.5 Written instructions \n11.6 Plans or instructions related to job/task, \n11.7\nTelephones and pagers\n\n--- PDF PAGE 48 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III                                                                      \n           \n47\nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Located, interpreted and applied the relevant information, \nstandards and specifications. \n1.2 Complied with company safety policies and procedures and OH&S \nlegislation/regulations/codes of practice applicable to operations \nincluding quality requirements \n1.3 Completed diagnosis, rectification and re-assembly of mechanical \nfaults rectified to engineering  specifications and company \ninspection requirements on a minimum of three (3) separate \nvehicles each with different faults including those requiring: \n \nThe removal and re-assembly of the instrument panel \n \nThe disassembly and re-assembly of  all mechanical \nassemblies and door components \n \nThe replacement of trimming parts and components \n1.4 Completed diagnosis and rectification to specification of sealing \nsystem faults on a minimum of three (3) separate vehicles \nincluding a minimum of: \n \n One involving a door \n \n One involving a windscreen seal \n \n One involving a boot seal fault \n \n One involving the forward passenger compartment floor \n1.5 Communicated and worked effectively and safely with others \n2. Underpinning \nknowledge and \nattitudes \n2.1 Workplace and equipment safety requirements \n2.2 Relevant company production quality standards \n2.3 Company manufacturing and production techniques for \nmechanical components and systems \n2.4 Automotive Industry terminology \n2.5 Tools and equipment types, characteristics, uses and limitations \n2.6 Mechanical faults symptoms and diagnosis techniques \n2.7 Sealing system testing techniques including water leak testing \n2.8 Processes for the calculation of material requirements \n2.9 Material Safety Data Sheets \n2.10 Plans, drawings and specifications \n2.11 Materials handling, storage and environmentally friendly waste \nmanagement \n2.12 Company safety policies and procedures \n2.13 Relevant Philippine Standards OH&S  \n2.14\nPositive Work Values (Patience, Perseverance, Honesty, etc.)\n\n--- PDF PAGE 49 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III                                                                      \n           \n48\n \n3. Underpinning \nskills \n3.1 Collect, organize, interpret and understand the information \nrequired for mechanical rectification, including work instructions, \nplans / sketches / diagrams, safety instructions, signage, labels, \nquality procedures, material safety data sheets and equipment \ninstructions \n3.2 Communicate ideas and information orally and in writing, in simple \nEnglish to enable confirmation of work requirements, passage of \ninformation and requests to other workers during operations and \nthe reporting and recording of work outcomes \n3.3 Conduct activities associated with assembly and sealing system \nrectification, including the coordination and use of equipment, \nmaterials and tools to avoid backtracking and rework \n3.4 Work with others and in a team by recognizing dependencies and \nusing co-operative approaches to optimize satisfaction and \nproductivity \n3.5 Establish safe and effective work processes which anticipate \nand/or resolve problems and downtime, to systematically develop \nsolutions to avoid or minimize reworking and avoid wastage \n3.6 Use mathematical ideas and techniques to correctly calculate \ntime, assess tolerances and timing, apply accurate \nmeasurements, and establish quality checks \n3.7 Use workplace technology related to assembly and sealing system \nrectification, including the use of computers, measuring \nequipment, computerized equipment, mechanical diagnostic \nequipment, water leak testing equipment, the use of \ncommunication devices and the reporting/recording of results\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate Tools & equipment \n4.3Materials relevant to the activity \n5. Method of \nassessment \nCompetency MUST be assessed through \n5.1 Observation with Questioning \n5.2Portfolio\n6. Context of \nassessment \n6.1 Competency may be assessed individually in the actual workplace \nor a simulated workplace environment.\n",
