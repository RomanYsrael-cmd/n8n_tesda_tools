        "evidence_guide": {
          "source_text": "1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Located, interpreted and applied the relevant information, \nstandards and specifications. \n1.2 Complied with company safety policies and procedures and OH&S \nlegislation/regulations/codes of practice applicable to operations \nincluding quality requirements \n1.3 Completed diagnosis, rectification and re-assembly of mechanical \nfaults rectified to engineering  specifications and company \ninspection requirements on a minimum of three (3) separate \nvehicles each with different faults including those requiring: \n \nThe removal and re-assembly of the instrument panel \n \nThe disassembly and re-assembly of  all mechanical \nassemblies and door components \n \nThe replacement of trimming parts and components \n1.4 Completed diagnosis and rectification to specification of sealing \nsystem faults on a minimum of three (3) separate vehicles \nincluding a minimum of: \n \n One involving a door \n \n One involving a windscreen seal \n \n One involving a boot seal fault \n \n One involving the forward passenger compartment floor \n1.5 Communicated and worked effectively and safely with others \n2. Underpinning \nknowledge and \nattitudes \n2.1 Workplace and equipment safety requirements \n2.2 Relevant company production quality standards \n2.3 Company manufacturing and production techniques for \nmechanical components and systems \n2.4 Automotive Industry terminology \n2.5 Tools and equipment types, characteristics, uses and limitations \n2.6 Mechanical faults symptoms and diagnosis techniques \n2.7 Sealing system testing techniques including water leak testing \n2.8 Processes for the calculation of material requirements \n2.9 Material Safety Data Sheets \n2.10 Plans, drawings and specifications \n2.11 Materials handling, storage and environmentally friendly waste \nmanagement \n2.12 Company safety policies and procedures \n2.13 Relevant Philippine Standards OH&S  \n2.14\nPositive Work Values (Patience, Perseverance, Honesty, etc.)\n\n--- PDF PAGE 49 ---\nTR AUTOMOTIVE MECHANICAL ASSEMBLY NC III                                                                      \n           \n48\n \n3. Underpinning \nskills \n3.1 Collect, organize, interpret and understand the information \nrequired for mechanical rectification, including work instructions, \nplans / sketches / diagrams, safety instructions, signage, labels, \nquality procedures, material safety data sheets and equipment \ninstructions \n3.2 Communicate ideas and information orally and in writing, in simple \nEnglish to enable confirmation of work requirements, passage of \ninformation and requests to other workers during operations and \nthe reporting and recording of work outcomes \n3.3 Conduct activities associated with assembly and sealing system \nrectification, including the coordination and use of equipment, \nmaterials and tools to avoid backtracking and rework \n3.4 Work with others and in a team by recognizing dependencies and \nusing co-operative approaches to optimize satisfaction and \nproductivity \n3.5 Establish safe and effective work processes which anticipate \nand/or resolve problems and downtime, to systematically develop \nsolutions to avoid or minimize reworking and avoid wastage \n3.6 Use mathematical ideas and techniques to correctly calculate \ntime, assess tolerances and timing, apply accurate \nmeasurements, and establish quality checks \n3.7 Use workplace technology related to assembly and sealing system \nrectification, including the use of computers, measuring \nequipment, computerized equipment, mechanical diagnostic \nequipment, water leak testing equipment, the use of \ncommunication devices and the reporting/recording of results\n4. Resource \nimplications \nThe following resources MUST be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate Tools & equipment \n4.3Materials relevant to the activity \n5. Method of \nassessment \nCompetency MUST be assessed through \n5.1 Observation with Questioning \n5.2Portfolio\n6. Context of \nassessment \n6.1 Competency may be assessed individually in the actual workplace \nor a simulated workplace environment.",
