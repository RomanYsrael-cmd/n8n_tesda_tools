  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1.To attain the National Qualification of Auto Engine Rebuilding NC II, the\ncandidate must demonstrate competence in all the units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2 The qualification of Auto Engine Rebuilding NC II may be attained through\ndemonstration of competence through a single comprehensive project-type\nassessment covering all required units of competency of the qualification.\n\n4.3 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4 The following are qualified to apply for assessment and certification:\n\n1.1.1 Graduates of formal, non-formal and informal including\nenterprise-based training programs.\n\n1.1.2 Experienced workers (wage employed or self-employed)\n\n4.5 The guidelines on assessment and certification are discussed in detail in the\nProcedures Manual on Assessment and Certification and Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS).\n\n--- PDF PAGE 78 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n76\n\nCOMPETENCY MAP- AUTOMOTIVE SECTOR\nService electronic\ndrive management\nsystem\nPerforms gas\nengine tune up\nPerform diesel\nengine tune up\nService\nautomotive\nbattery\nService ignition\nsystem\nTest & repair\nwiring/lighting\nsystem\nPerform under-\nchassis preventive\nmaintenance\nService starting\nsystem\nService charging\nsystem\nService engine\nmechanical\n system\nService clutch\nsystem\nService differential\n& front/rear axle\nService steering\nsystem\nService brake\nsystem\nService\nsuspension\nsystem\nTest & repair\nelectrical security\nsystem/components\nService electronic\nengine\n management system\nService\nautomatic\ntransmission\nOverhaul engines\n& associated\ncomponents\nPerform maintenance\n service check up\n& repair to AC\nInstall auto\nAC system\nService AC\ncompressor &\nassociated component\nOverhaul manual\ntransmission\nService electronics\nbody management\nsystem\nService diesel engine\nmanagement system\n & component\nService diesel fuel\ninjection system\ncomponents\nService emission\ncontrol system\nPrepare vehicle\nbody for repair\nRepair body\npanel\nReplace damaged\npanel/parts with pre-\nfabricated panel\nDisassemble engine\nsub-assemblies/\ncylinder head &\ncheck components\nDisassemble engine\nblock & sub-assemblies,\ncheck tolerances &\ncomponents\nSet, operate &\nmonitor specialized\nmachine\nUse and maintain\nmeasuring\ninstruments\nCarry out pre-\nrepair operation on\nengine components\nInspect engine\ncomponents &\ndetermined preferred\naction\nCarry out\nmachining\noperations\nAssemble engine sub-\nassemblies/ cylinder\nheads and check\ncomponents\nAssemble engine\nblock & sub-assemblies,\ncheck tolerances\n& components\nInterpret technical\nmanual specification\nof engine components\nAssess auto\npainting jobs\nPrepare\nundamaged\nsurface for painting\nPrepare damaged\nsurface for\n painting\nApply masking\nPerform Polishing\nPerform solid/\nmetallic color\nmixing\nSpray metallic\ncolor paint\nSpray solid\ncolor paints\nRepair solid\ncolor paints\nRepair metallic\nor special\ncolor paint\nCOMMON\nCOMPETENCIES\nPerform\nmensuration and\ncalculation\nMove and\n position vehicle\nApply appropriate\nsealant/adhesive\nUse and apply\n lubricant/ coolant\nRead, interpret and\napply specification\n and manuals\nInterpret/draw\n technical drawing\nPrepare job\nestimate/ costing\nPerform shop\nmaintenance\nReceive and\nrespond workplace\ncommunication\nParticipate in\nworkplace\ncommunication\nLead in workplace\ncommunication\nUtilize specialist\ncommunication skills\nWork in team\nenvironment\nDevelop team\n and individual\nSolve workplace\nproblems related\nto work activities\nWork with Other\nLead small Team\nApply problem\nsolving techniques\nin the workplace\nPlan and\norganize work\nBASIC\nCOMPETENCIES\nAuto Engine Rebuilding NC II\n-\nLegend:\nPerform special\ncolor matching\nSpray pearl\nor mica\ncolor paint\nCORE COMPETENCIES\nDemonstrate\nwork values\nPractice basic\n housekeeping\nprocedures\nPractice career\nprofessionalism\nPractice occupationa l\nhealth and safety\n procedures\nDevelop and\npractice negotiation\nskills\nUse mathematical\nconcepts and\n techniques\nUse relevant\n technologies\n\n--- PDF PAGE 79 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n77\nDEFINITION OF TERMS\n\n1. Babbit\nA metal used to line bearing; consisting of tin, antimony,\ncopper and other metals\n2. Bore Out\nTo increase the engine cylinder diameter by boring it larger,\nrequires the fitting of oversize piston.\n3. Calibrate\nTo check or correct the initial setting of a test instrument.\n4. Cold Welding\nProcess of repairing a crack in a metal by drilling a hole\nthrough the crack, threading the hole, and screwing in a\nsection of threaded rod to form a seal.\n5. Crankpins\nPart of the crankshaft to which the connecting rod is\nattached. Also called the crank throw or connecting rod\njournal.\n6. Dynamic Unbalance\nResults when there are two weights in separate planes that\nwill set up separate forces which causes the crankshaft to\nrock or twist on an axis perpendicular tot he axis of rotation.\n7. Guide Sleeve\nA tubular sleeve put on a connecting rod bolt before the rod\nis removed from the block to prevent scratching of the\ncrankpins by the bolt threads.\n8. Honing\nThe process of restoring the cylinder into a straight, round\nshape and smooth surface by machining to remove only a\nsmall amount of metal or to obtain the desired cylinder\nfinished after reboring.\n9. Journals\nThe part of the rotating shaft which turns in a bearing.\n10. Kinetic unbalance\nUnbalanced state that tends to throw the mass outward due\nto the centrifugal force and cause a bending or flexing of the\ncrankshaft.\n11. Line Boring\nUsing a special boring machine, centered on the original\ncenter of the cylinder-block main bearing bores, to rebore\nthe crankcase into alignment.\n12. Machining\nThe process of using a machine to remove metal from a\nmetal part.\n13. Magna Flux\nA process that uses an electromagnet and special magnet\npowder to detect surface and subsurface cracks in iron and\nsteel.\n14. Rebore\nTo increase the diameter of a cylinder.\n\n--- PDF PAGE 80 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n78\n\n15. Reboring\nReconditioning process by cutting or grinding some amount\nof metals from the cylinder surface to fit the nearest oversize\npiston.\n16. Re-sleeving\nRestoring the cylinder condition into standard diameter by\nremoving the worn sleeves and replacing them with new\nones.\n17. Rod Small End\nThe end of the connecting rod through which the piston pin\npasses to connect the piston tot he connecting rod.\n18. Rod Big End\nThe end of the connecting rod that attached around the\ncrankpins.\n19. Specifications\nInformation provided by the manufacturer for each engine\nand its components, operation, clearances. Also the service\nprocedure to be followed for a system to operate properly.\n 20. Static Unbalance\nCondition at which when the crankshaft placed on knife-\nedges and rotated will come to rest always on the heaviest\npart at the bottom.\n21. Tolerance\nThe range of variation in a given dimension.\n22. Valve seat Insert\nA metal ring installed in the cylinder head to act as a valve\nseat.\n\n--- PDF PAGE 81 ---\n_________________________________________________