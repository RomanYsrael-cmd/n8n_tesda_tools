  "source_text": "1. Babbit\nA metal used to line bearing; consisting of tin, antimony,\ncopper and other metals\n2. Bore Out\nTo increase the engine cylinder diameter by boring it larger,\nrequires the fitting of oversize piston.\n3. Calibrate\nTo check or correct the initial setting of a test instrument.\n4. Cold Welding\nProcess of repairing a crack in a metal by drilling a hole\nthrough the crack, threading the hole, and screwing in a\nsection of threaded rod to form a seal.\n5. Crankpins\nPart of the crankshaft to which the connecting rod is\nattached. Also called the crank throw or connecting rod\njournal.\n6. Dynamic Unbalance\nResults when there are two weights in separate planes that\nwill set up separate forces which causes the crankshaft to\nrock or twist on an axis perpendicular tot he axis of rotation.\n7. Guide Sleeve\nA tubular sleeve put on a connecting rod bolt before the rod\nis removed from the block to prevent scratching of the\ncrankpins by the bolt threads.\n8. Honing\nThe process of restoring the cylinder into a straight, round\nshape and smooth surface by machining to remove only a\nsmall amount of metal or to obtain the desired cylinder\nfinished after reboring.\n9. Journals\nThe part of the rotating shaft which turns in a bearing.\n10. Kinetic unbalance\nUnbalanced state that tends to throw the mass outward due\nto the centrifugal force and cause a bending or flexing of the\ncrankshaft.\n11. Line Boring\nUsing a special boring machine, centered on the original\ncenter of the cylinder-block main bearing bores, to rebore\nthe crankcase into alignment.\n12. Machining\nThe process of using a machine to remove metal from a\nmetal part.\n13. Magna Flux\nA process that uses an electromagnet and special magnet\npowder to detect surface and subsurface cracks in iron and\nsteel.\n14. Rebore\nTo increase the diameter of a cylinder.\n\n--- PDF PAGE 80 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n78\n\n15. Reboring\nReconditioning process by cutting or grinding some amount\nof metals from the cylinder surface to fit the nearest oversize\npiston.\n16. Re-sleeving\nRestoring the cylinder condition into standard diameter by\nremoving the worn sleeves and replacing them with new\nones.\n17. Rod Small End\nThe end of the connecting rod through which the piston pin\npasses to connect the piston tot he connecting rod.\n18. Rod Big End\nThe end of the connecting rod that attached around the\ncrankpins.\n19. Specifications\nInformation provided by the manufacturer for each engine\nand its components, operation, clearances. Also the service\nprocedure to be followed for a system to operate properly.\n 20. Static Unbalance\nCondition at which when the crankshaft placed on knife-\nedges and rotated will come to rest always on the heaviest\npart at the bottom.\n21. Tolerance\nThe range of variation in a given dimension.\n22. Valve seat Insert\nA metal ring installed in the cylinder head to act as a valve\nseat.\n\n--- PDF PAGE 81 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n79",
