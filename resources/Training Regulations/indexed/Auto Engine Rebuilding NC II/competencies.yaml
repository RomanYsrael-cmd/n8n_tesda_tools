at edges,  \n2.12 Dividers  \n2.13 Protractors)\n3. Measuring \ntechnique \n3.1 correct usage of the above mentioned measuring  \n      instrument and tools. \n3.2 Out of round or ovality \n3.3 Cylindricity or taper conicity\n4. OHS \nRequirements \n4.1 Wearing of personal protective instrument such as  \n      apron, goggles, gloves, safety shoes \n4.2 Disposal of wastes materials \n4.3 Workshop housekeeping\n5. Routine care \nand storage of \nmeasuring \ninstrument  \n5.1 Periodic check up of micrometer with standard bars  \n5.2 Storage in box separated from hand tools \n5.3 Proper handling \n5.4 Not to exposed to liquid such as water.\n\n--- PDF PAGE 61 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n59"
