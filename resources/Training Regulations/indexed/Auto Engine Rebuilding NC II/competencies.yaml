        "evidence_guide": {
          "source_text": "1. Critical aspects\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted the blueprint of components without damage\nor injury to tools, equipment and personnel\n1.2 Interpreted the blueprint of components to specified\ntolerances following company procedures\n2. Underpinning\nknowledge and\nattitudes\n2.1 Technical information including technical drawings and\ntechnical symbols\n2.2 Equipment safety requirements\n2.3 Personal safety requirements\n2.4 Equipment and machinery safety requirements\n2.5 Techniques in measuring, balancing and machining\n2.6 Positive Work values ( Perseverance, Patience, Honesty,\n Attention to Details)\n3. Underpinning\nskills\n3.1 Accessing and interpreting technical information\n3.2 Using relevant tools/equipment\n3.3 Applying measuring techniques\n3.4 Applying balancing techniques\n3.5 Applying relevant machining techniques\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Actual demonstration of skills in weighing, balancing,\nchecking volumes, machining, measuring and comparison\nfrom specification\n5.2Written/Oral examination\n6. Context for\nassessment\n6.1 Competency elements must be assessed in a safe\nworking environment, using tools and equipment as\nstipulated in the resources section of the Evidence Guide\n6.2 Assessment must be undertaken in accordance with the\nTESDA Assessment Guidelines.\n6.3 The assessment of practical skills must only take place\nafter a period of supervised practice and repetitive\nexperience. If workplace conditions are not available,\nassessment in simulated workplace conditions is\nacceptable.\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n38\n\nUNIT OF COMPETENCY: DISASSEMBLE ENGINE BLOCK AND SUB-\nASSEMBLIES, CHECK TOLERANCES AND\nCOMPONENTS\nUNIT CODE:"
        },
        "source_text": "ALT723328\n\nUNIT DESCRIPTOR: This unit identifies the competence required to compare\ncomponents to original manufacturer specifications and match\nin relation to weight, size, and capacity with reference to the\ntechnical data.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Carry out\ninterpretation of\nmanual\nspecifications\n\n1.1\nCorrect information is accessed and interpreted from\nappropriate manufacturer specifications\n1.2\nSymbols, codes, legends and diagrams interpreted\n1.3\nRepresentations are correctly recognized\n1.4\nParts/systems/components/item represented\n is correctly identified\n1.5\nInformation represented is correctly understood\n1.6\nComponents are prepared for inspection/\nmeasurement.\n1.7\nAppropriate measuring instrument and tools are\nused as prescribed.\n1.8\nMeasurements are compared against original\nequipment manufacturer (OEM) specifications\n1.9 Components are adjusted to meet OEM specifications\nwithout damage.\n1.10 All interpretation of manual specification are carried\nout according to industry regulations/guidelines,\noccupational health and safety (OHS)\nrequirements, and enterprise procedures/policies\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n36\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Components\nComponents to be measured includes but is not limited to:\n1.1 Crankshaft journals\n• Main journal\n• Connecting rod journal (Crank pin)\n1.2 Cylinder Head\n1.3 Cylinder Bores\n1.4 Camshaft journal\n1.5 Connecting rods\n1.6 All clearances\n•\nBearing\n•\nPiston\n•\nRing end gaps\n•\nCamshaft clearance\n•\nCrankshaft\n•\nBacklash\n2 Damages\nDamages incurred during measurement of components\nincludes:\n2.1 Useless repairs\n2.2 Unnecessary expenses\n2.3 Waste of time, efforts, and materials\n3 Measuring\ninstruments/\nequipment and\nTools\n3.1 Lifting equipment, balancing equipment, scales,\nmeasuring equipment (both graduated and volumetric\ndevices)\n3.2 Handtools, Power tool,\n3.3Manuals\n4 OHS\nRequirements\n4.1 Wearing of personal protective equipment such as\n apron, goggles, gloves, safety shoes\n4.2 Disposal of wastes materials\n4.3 Workshop housekeeping\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n37\n\nEVIDENCE GUIDE\n\n1. Critical aspects\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted the blueprint of components without damage\nor injury to tools, equipment and personnel\n1.2 Interpreted the blueprint of components to specified\ntolerances following company procedures\n2. Underpinning\nknowledge and\nattitudes\n2.1 Technical information including technical drawings and\ntechnical symbols\n2.2 Equipment safety requirements\n2.3 Personal safety requirements\n2.4 Equipment and machinery safety requirements\n2.5 Techniques in measuring, balancing and machining\n2.6 Positive Work values ( Perseverance, Patience, Honesty,\n Attention to Details)\n3. Underpinning\nskills\n3.1 Accessing and interpreting technical information\n3.2 Using relevant tools/equipment\n3.3 Applying measuring techniques\n3.4 Applying balancing techniques\n3.5 Applying relevant machining techniques\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Actual demonstration of skills in weighing, balancing,\nchecking volumes, machining, measuring and comparison\nfrom specification\n5.2Written/Oral examination\n6. Context for\nassessment\n6.1 Competency elements must be assessed in a safe\nworking environment, using tools and equipment as\nstipulated in the resources section of the Evidence Guide\n6.2 Assessment must be undertaken in accordance with the\nTESDA Assessment Guidelines.\n6.3 The assessment of practical skills must only take place\nafter a period of supervised practice and repetitive\nexperience. If workplace conditions are not available,\nassessment in simulated workplace conditions is\nacceptable.\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n38\n\nUNIT OF COMPETENCY: DISASSEMBLE ENGINE BLOCK AND SUB-\nASSEMBLIES, CHECK TOLERANCES AND\nCOMPONENTS\nUNIT CODE:"
