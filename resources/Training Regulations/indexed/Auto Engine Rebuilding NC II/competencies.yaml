        "source_title": "CARRY OUT PRE-REPAIR OPERATIONS ON ENGINE COMPONENTS",
        "source_text": "--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n44\nUNIT OF COMPETENCY:    CARRY OUT PRE-REPAIR OPERATIONS ON  \n   ENGINE COMPONENTS  \n \nUNIT CODE: ALT723331 \n \nUNIT DESCRIPTOR: This unit identifies the competence required to clean \ncomponents by chemical or mechanical means and remove \ncomponent in preparation for either storage or repair. \n \n    ELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.Clean components \nprior to repairs \nand/or storage \n1.1 Cleaning of engine components is achieved without \ncausing damage to any component or system \n1.2 Cleaning agents are used according to cleaning agent \nmanufacturer instructions \n1.3 Component of the engine is cleaned to facilitate \ninspection, assessment, replacement, repair and/or \nstorage.  \n1.4 Used cleaning agents and waste materials are safely \ndisposed of according to company policy and national \nlegislation. \n1.5 Cleaning operations are carried out according to \nindustry regulations/guidelines, occupational health \nand safety procedures and company policy.\n2. Segregate, tag \nand store \ncomponents \n2.1 Components are segregated, tagged and stored without \ncausing damage to any component or system. \n2.2 Correct information is accessed and interpreted from \nappropriate manufacturing specifications. \n2.3 Components are removed, tagged and stored in \naccordance with manufacturer specifications and \nenterprise procedures \n2.4 Removal and storage activities are carried out \naccording to industry standards/guidelines, \noccupational health and safety and company policy. \n2.5 Report on additional parts required to complete the \nrepair (not listed in quotation) is completed in \naccordance with company policy.\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n45\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Engine Components  \nKinds of Engine and  its sub-assemblies/ \nComponents include: \n1.1 Long engines and short engines,  \n1.2Cylinder heads \n1.3 Camshafts \n1.4Rocker Arm \n1.5 Idler shafts \n1.6 Timing Chains \n1.7 Timing Belts \n1.8 Pulleys \n1.9 Valve Train Mechanism \n1.10 Engine pump\n2.   Cleaning operations \n2.1 Manual cleaning \n2.2 Machine-assisted cleaning\n3.   Occupational Health \nand Safety procedures \n3.1 Use of Personal Protective Equipment \n \nSafety shoes \n \nFace Shields/safety goggles \n \nGloves \n \nApron \n \nSafety shoes \n3.2 Safe Handling of  \n \nEquipment \n \nTools \n \nMaterials\n4. Cleaning agents \n4.1 De-waxing \n4.2 Detergent \n4.3 Degreaser \n4.4 Special purpose agents\n5. Information \nSources of information/documents may include: \n5.1 Vehicle manufacturer specification \n5.2 Company operating procedure \n5.3 Insurance company instruction \n5.4 Product manufacturer specifications \n5.5 Material safety data sheets \n5.6 Industry/workplace code of practice\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n46\nEVIDENCE GUIDE \n1. Critical \naspects of \nCompetency  \nAssessment requires evidence that the candidate:   \n1.1 Interpreted and communicated operational information \n1.2 Practiced working safely  \n1.3 Observed vehicle protection methods \n1.4Removed, stored and cleaned component of engine.\n2. Underpinning \nknowledge \nand attitudes  \n2.1 Occupational health and Safety \n2.2 Personal safety protection procedures \n2.3 Manual handling techniques \n2.4 Equipment safety requirements \n2.5 Vehicle safety requirements \n2.6 Types of cleaning agents and their uses \n2.7 Procedure in removing and storing parts \n2.8 Methods in tagging components \n2.9Positive Work values ( Perseverance, Patience, Honesty,  \n       Attention to Details)\n3. Underpinning \nskills \n3.1 Accessing and applying safety and technical information \n3.2 Applying correct manual handling techniques \n3.3 Applying personal safety requirements \n3.4 Using relevant tools and equipment \n3.5 Cleaning components using the appropriate agents \n3.6 Removing and replacing components \n3.7 Storing removed components\n4. Resource \nimplications \nThe following resources must be provided \n4.1 Tools, equipment and facilities appropriate to processes or \nactivities \n4.2 Materials relevant to the proposed activity\n5. Method of \nassessment \nCompetency must be assessed through: \n5.1 Direct observation or Demonstration  \n5.2 Written or oral (short-answer) questions \n5.4 Portfolio assessment\n6. Context for \nassessment \n6.1 Competency may be assessed in the workplace or in \nsimulated workplace environment \n6.2  The underpinning knowledge and skills may be assessed \non or off-the-job. \n6.3  The prescribed outcome must be achieved without direct \nsupervision.\n",
