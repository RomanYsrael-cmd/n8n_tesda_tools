es \n2.1 Equipment safety requirements \n2.2 Machinery safety requirements \n2.3 Relevant methods of machining and/or cutting \n2.4 Measuring instruments, application and procedures \n2.5 Speed and feed ratios \n2.6 Personal safety requirements \n2.7 Positive Work values ( Perseverance, Patience, Honesty,  \n     Attention to Details)\n3 Underpinning \nskills \n3.1 Access, interpret and apply technical information \n3.2 Use relevant tools, equipment and machinery safely \n3.3 Use measuring equipment correctly \n3.4 Apply setting up procedures (relevant to application) \n3.5Apply machining procedures (relevant to application)\n4 Resource \nimplications \nThe following resources must be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate Tools & equipment \n4.3Materials relevant to the activity \n5 Method of \nassessment \nCompetency must be assessed through: \n5.1 Actual demonstration of skills in lathe turning, grinding, \ncutting, drilling. \n5.2Written examination\n6 Context for \nassessment \n6.1 The assessment of practical skills must only take place \nafter a period of supervised practice and repetitive \nexperience. If workplace conditions are not available, \nassessment in simulated workplace conditions is \nacceptable.\n",
