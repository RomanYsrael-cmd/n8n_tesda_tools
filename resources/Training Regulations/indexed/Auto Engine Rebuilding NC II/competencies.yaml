        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Disassembled and conducted accurate assessment of\ncondition of engine block and sub-assembly.\n1.2 Determined appropriate repair action\n2. Underpinning\nknowledge and\nattitudes\n2.1 Disassembling methods and procedures\n2.2 Procedure in measuring and testing\n2.3 Methods of repair\n2.4 Equipment safety requirements\n2.5 Relevant company policies\n2.6 Personal safety requirements\n2.7 Manual handling techniques\n2.8 Cleaning methods and materials\n2.9 Construction and Principle of engine operation\n2.10 Positive Work values ( Perseverance, Patience, Honesty,\n Attention to Details)\n3. Underpinning\nskills\n3.1 Accessing and interpreting technical information\n3.2 Applying dismantling procedures\n3.3 Applying testing techniques\n3.4 Using relevant tools and equipment\n3.5 Maintaining customer/company records\n3.6 Using measuring equipment and instruments\n3.7 Applying manual handling procedures\n3.8 Checking and comparing various components to actual\nspecifications\n3.9 Deciding on most appropriate repair action necessary\n3.10 Explaining to customers on repair action to be done\n4. Resource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to processes or\nactivities\n4.2 Materials relevant to the activity\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation of the task on disassembling engine\nblock and sub-assemblies and check components\n5.2 Written or oral (short-answer) questions\n5.3 Practical exercises relevant to this unit of competency.\n5.4 Portfolio assessment\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n41\n\nUNIT OF COMPETENCY: DISASSEMBLE ENGINE SUB-ASSEMBLIES/\n\n CYLINDER HEADS AND CHECK COMPONENTS\nUNIT CODE:"
        },
        "source_text": "ALT723329\n\nUNIT DESCRIPTOR: This unit identifies the competence required to disassemble,\ninspect, evaluate and determine preferred repair action for\nengine block and sub-assemblies as part of a reconditioning\nprocedure.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.Disassemble\nengine block and\nsub-assemblies\n1.1 Engine block and sub-assemblies are disassembled\nwithout causing damage to any component or system.\n1.2 Engine block and sub-assemblies are disassembled\nusing approved methods and appropriate equipment\nand tools.\n1.3 Correct information is accessed and interpreted from\nappropriate manufacturer specifications.\n1.4 Components/system are cleaned in preparation for\nevaluation\n1.5 All disassembling/cleaning activities are carried out\naccording to industry regulations/guidelines,\noccupational health and safety procedures and\ncompany policies using appropriate tools and\nequipment.\n2. Inspect/measure/\ntest engine block\nand sub-assembly\ncomponents and\ndetermine repair\nprocedures\n\n2.1 Inspection/measurement/testing method is completed\nwithout causing damage to any component or system.\n2.2 Correct information is accessed and interpreted from\nappropriate manufacturer specifications\n2.3 Engine block and sub-assembly components are\nmeasured against manufacturer specifications and\ntolerances.\n2.4 Engine block and sub-assembly components are\nevaluated against measurements, test and inspections\nmade.\n2.5 Repair requirements are identified and reported\naccording to enterprise policy and procedure.\n2.6 Appropriate workplace documentation is completed and\ndealt with relevant to inspection/measurements/testing\noutcomes.\n2.7 All inspection/measurement/testing activities are carried\nout according to industry regulations/guidelines,\noccupational health and safety and company policies\nusing appropriate tools and equipment.\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n39\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Engine\n1.1 Gasoline\n1.2Diesel\n2. Components or\nSystem\nComponents or system\nShort engines, various\nSuch as:\n2.1 Crankshafts\n2.2 Camshaft\n2.3 Cylinder blocks\n2.4 Idler shaft\n2.5 Pistons\n2.6 Connecting rods\n2.7 Bearings\n2.8 Piston Rings\nof the engine includes\nengine components\n\n2.9 Gears\n2.10 Timing Chains\n2.11 Timing Belts\n2.12 Pulleys\n2.13 Engine Oil pumps\n2.14 Cylinder head\n2.15 Rocker Arm Shaft\n3.Methods\nMethods applied under normal operating condition\nincludes:\n3.1Disassembling\n3.2 Cleaning\n3.3 Measuring against specifications\n3.4Various testing (e.g. crack and pressure tests)\n3.5Visual inspection\n3.6Comparing against specifications\n4. Tools/Equipment\n4.1 Handtools\n4.2 Power Tools/Equipment\n4.3 Special equipment\n4.4 Measuring equipment/tools\n•\nStraight edge\n•\n Caliper\n•\n feeler gage\n•\n micrometer\n•\n Vernier caliper\n•\n inside caliper\n•\n dial gage)\n4.5 Lifting equipment (Hoist or Jack)\n4.6 Testing equipment\n4.7 Cleaning equipment\n4.8 Crack testing equipment\n4.9 Pressure testing equipment\n5. Occupational\n Health and Safety\n Procedures\n5.1 Use of Personal Protective Equipment\n•\nFace Shields/safety goggles\n•\nGloves\n•\nApron\n•\nSafety shoes\n5.2 Safe Handling of\n•\nEquipment\n•\nTools and materials\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n40\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Disassembled and conducted accurate assessment of\ncondition of engine block and sub-assembly.\n1.2 Determined appropriate repair action\n2. Underpinning\nknowledge and\nattitudes\n2.1 Disassembling methods and procedures\n2.2 Procedure in measuring and testing\n2.3 Methods of repair\n2.4 Equipment safety requirements\n2.5 Relevant company policies\n2.6 Personal safety requirements\n2.7 Manual handling techniques\n2.8 Cleaning methods and materials\n2.9 Construction and Principle of engine operation\n2.10 Positive Work values ( Perseverance, Patience, Honesty,\n Attention to Details)\n3. Underpinning\nskills\n3.1 Accessing and interpreting technical information\n3.2 Applying dismantling procedures\n3.3 Applying testing techniques\n3.4 Using relevant tools and equipment\n3.5 Maintaining customer/company records\n3.6 Using measuring equipment and instruments\n3.7 Applying manual handling procedures\n3.8 Checking and comparing various components to actual\nspecifications\n3.9 Deciding on most appropriate repair action necessary\n3.10 Explaining to customers on repair action to be done\n4. Resource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to processes or\nactivities\n4.2 Materials relevant to the activity\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation of the task on disassembling engine\nblock and sub-assemblies and check components\n5.2 Written or oral (short-answer) questions\n5.3 Practical exercises relevant to this unit of competency.\n5.4 Portfolio assessment\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n41\n\nUNIT OF COMPETENCY: DISASSEMBLE ENGINE SUB-ASSEMBLIES/\n\n CYLINDER HEADS AND CHECK COMPONENTS\nUNIT CODE:"
