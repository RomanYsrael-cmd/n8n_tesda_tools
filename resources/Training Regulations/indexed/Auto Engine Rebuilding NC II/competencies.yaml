        "source_text": "--- PDF PAGE 65 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n63\n \nUNIT OF COMPETENCY:    ASSEMBLE ENGINE BLOCK AND SUB-\nASSEMBLIES, CHECK TOLERANCES AND CARRY \nOUT RELEVANT TESTING PROCEDURES \n \nUNIT CODE: ALT723334  \n \nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes required to \nassemble engine block and sub-assemblies, check tolerances, \nfit cylinder head(s) and carry out relevant testing and \nadjustment procedures as part of a re-conditioning procedure. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.Use appropriate \nmethods to check \ntolerances \n1.1 Tolerances are checked without causing damage to any \ncomponent or system \n1.2 Tolerances are checked based on industry approved \nprocedures/methods, equipment and tools and \nmaterials \n1.3 Correct tolerances are obtained using relevant \nengine/component manufacturer specifications \n1.4 Tasks are carried out to comply within established \nindustry guidelines \n1.5 All checking activities are carried out according to \nindustry regulations/guidelines, occupational health \nand safety (OHS) and company policies.\n2. Assemble engine \nblock and sub-\nassemblies/fit \ncylinder head(s) \n \n2.1 Engine block and sub-assemblies are assembled and \ncylinder head(s) are fitted without causing damage to \nany component or system \n2.2 Assembly and fitting is carried out to comply with \nmanufacturer specification and established industry \nguidelines and operating procedure \n2.3 All assembly and fitting activities are carried out \naccording to industry regulations/guidelines, OHS, and \nindustry policies. \n2.4 Inspection of new parts quality, condition, fittings are \ndone as per company standard operating procedures.\n3. Carry out relevant \ntesting and \nadjustment \nprocedures \n3.1 Test and adjustments are completed without causing \n       damage to any component or system. \n3.2 Testing and adjustment is carried out to comply with \nmanufacturer’s specifications, established industry \nguidelines and standard. \n3.3 Testing and adjusting of tightening torque is carried out \nand confirmed by the supervisor.\n\n--- PDF PAGE 66 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n64\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1.   Engine \n1.1 Gasoline                  1.2 Diesel \n2.   Components or System \nIncludes: \nShort engine , various engine components such as\n2.1 Crankshafts \n2.2 Camshaft \n2.3 Cylinder blocks \n2.4 Idler shaft \n2.5 Pistons \n2.6 Connecting rods \n2.7 Bearings \n2.8 Rings \n2.9 Cylinder head assemblies \n2.10 Gears \n2.11 Chains \n2.12 Belts \n2.13 Pulleys \n2.14 Oil pumps \n2.15 Short/long motors \n          (cylinder head fitting) \n2.16 Auxiliary-engine valve \nrailings and tensioner \n3. Methods \nMethods applied under normal operating condition \nincludes: \n3.1 Tolerance checking procedure \n3.2 Assembly/repair procedure \n3.3 Tensioning procedures \n3.4 Visual checking \n3.5\nUse of tools and equipment\n4.   Tools/Equipment and \nSupplies and Materials \n4.1 Handtools \n4.2 Power Tools \n4.3 Special equipment \n4.4 Measuring instrument/tools/materials \n Steel rule \n Vernier caliper \n Micrometer caliper \n Gages (thread, drill, surface finish, radius,  \n Screw pitch, taper, feeler gage) \n Plastigauge \n4.5 Relevant testing equipment \n4.6 Personal protective equipment \n4.7 Lubricating equipment \n4.8 Gasket sealing materials\n5.   Occupational Health \nand Safety (OHS) \n5.1 Use of Personal Protective Equipment \n Safety shoes \n Face Shields/safety goggles \n Gloves \n Apron \n Dust mask \n5.2 Safe Handling of  \n Equipment \n Tools \n Materials \n4.3 Implementation of 5S\n\n--- PDF PAGE 67 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n65\nEVIDENCE GUIDE \n1.Critical \naspects of \ncompetency  \nAssessment requires evidence that the candidate:   \n1.1 Measured and checked components against manufacturer’s \nspecifications \n1.2 Repaired engine block and sub-assemblies  \n1.3 Assembled and tested components and sub-assemblies \n1.4 Capability or skill to countercheck newly reconditioned \nengine components. \n2.Underpinning \nknowledge \nand attitudes  \n2.1 Personal safety requirements \n2.2 Construction and operation of engine block and sub-\nassemblies relevant to application \n2.3 Procedures on Assembly and repair of engine block \n2.4 Procedure on measuring, adjusting and testing engine  \n      components \n2.5 Equipment safety requirements \n2.6 Procedure on tensioning \n2.7 Relevant company policies \n2.8 Manual handling techniques \n2.9 Engine operating principles \n2.10 Familiarity with Manufacturer’s Manuals  \n2.11 Positive Work values ( Perseverance, Patience, Honesty,  \n     Attention to Details)\n3.Underpinning \nskills \n3.1 Accessing and interpreting technical information \n3.2 Checking/adjusting tolerances \n3.3 Using relevant measuring instruments \n3.4 Applying manual handling procedures \n3.5 Maintaining customer/company records \n3.6 Testing and adjusting engines for both technical and legal \nrequirements \n3.7 Tensioning various components \n3.8 Assembling/Repairing engines/components \n3.9 Ordering of Parts\n4.Resource  \n    implications \nThe following resources must be provided \n4.1 Tools, equipment and facilities appropriate to the activities \n4.2 Materials relevant to the proposed activity\n5.Method of       \n   assessment \nCompetency must be assessed through \n5.1 Observation/Demonstration of the task on assembling engine \nblock and sub-assemblies, checking tolerances and carrying \nout relevant testing procedures \n5.2 Written or oral (short-answer) questions \n5.3 Practical exercises relevant to this unit of competency. \n5.4 Portfolio\n6.Context for \n    assessment \n6.1 Competency may be assessed in the workplace or in \nsimulated workplace environment\n",
