        "source_text": "--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n38\n \nUNIT OF COMPETENCY: DISASSEMBLE ENGINE BLOCK AND SUB-\nASSEMBLIES, CHECK TOLERANCES AND \nCOMPONENTS \nUNIT CODE: ALT723329    \n \nUNIT DESCRIPTOR: This unit identifies the competence required to disassemble, \ninspect, evaluate and determine preferred repair action for \nengine block and sub-assemblies as part of a reconditioning \nprocedure. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1.Disassemble \nengine block and \nsub-assemblies \n1.1 Engine block and sub-assemblies are disassembled \nwithout causing damage to any component or system. \n1.2 Engine block and sub-assemblies are disassembled \nusing approved methods and appropriate equipment \nand tools. \n1.3 Correct information is accessed and interpreted from \nappropriate manufacturer specifications. \n1.4 Components/system are cleaned in preparation for \nevaluation \n1.5 All disassembling/cleaning activities are carried out \naccording to industry regulations/guidelines, \noccupational health and safety procedures and \ncompany policies using appropriate tools and \nequipment.\n2. Inspect/measure/ \ntest engine block \nand sub-assembly \ncomponents and \ndetermine repair \nprocedures \n \n2.1 Inspection/measurement/testing method is completed \nwithout causing damage to any component or system. \n2.2 Correct information is accessed and interpreted from \nappropriate manufacturer specifications \n2.3 Engine block and sub-assembly components are \nmeasured against manufacturer specifications and \ntolerances. \n2.4 Engine block and sub-assembly components are \nevaluated against measurements, test and inspectio