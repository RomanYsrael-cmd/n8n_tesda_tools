  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core\nunits of competency required in AUTO ENGINE REBUILDING NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n : 500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to gather, interpret and convey information in\nresponse to workplace requirements.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1\nSpecific and relevant information is accessed from\nappropriate sources\n1.2\nEffective questioning , active listening and speaking\nskills are used to gather and convey information\n1.3\nAppropriate medium is used to transfer information and\nideas\n1.4\nAppropriate non- verbal communication is used\n1.5\nAppropriate lines of communication with supervisors\nand colleagues are identified and followed\n1.6\nDefined workplace procedures for the location and\nstorage of information are used\n1.7\nPersonal interaction is carried out clearly and concisely\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1\nTeam meetings are attended on time\n2.2\nOwn opinions are clearly expressed and those of others\nare listened to without interruption\n2.3\nMeeting inputs are consistent with the meeting purpose\nand established protocols\n2.4\nWorkplace interactions are conducted in a courteous\nmanner\n2.5\nQuestions about simple routine workplace procedures\nand maters concerning working conditions of\nemployment are asked and responded to\n2.6\nMeetings outcomes are interpreted and implemented\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1\nRange of forms relating to conditions of employment\nare completed accurately and legibly\n3.2\nWorkplace data is recorded on standard workplace\nforms and documents\n3.3\nBasic mathematical processes are used for routine\ncalculations\n3.4\nErrors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5\nReporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 6 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n4\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1.\nTeam members\n1.2.\nSuppliers\n1.3.\nTrade personnel\n1.4.\nLocal government\n1.5.\nIndustry bodies\n2. Medium\n2.1.\nMemorandum\n2.2.\nCircular\n2.3.\nNotice\n2.4.\nInformation discussion\n2.5.\nFollow-up or verbal instructions\n2.6.\nFace to face communication\n3. Storage\n3.1.\nManual filing system\n3.2.\nComputer-based filing system\n4. Forms\n4.1.\nPersonnel forms, telephone message forms,\nsafety reports\n5. Workplace interactions\n5.1.\nFace to face\n5.2.\nTelephone\n5.3.\nElectronic and two way radio\n5.4.\nWritten including electronic, memos,\ninstruction and forms, non-verbal including\ngestures, signals, signs and diagrams\n6. Protocols\n6.1.\nObserving meeting\n6.2.\nCompliance with meeting decisions\n6.3.\nObeying meeting instructions\n\n--- PDF PAGE 7 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n5\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following\nstandard format of the organization\n1.2. Accessed information using communication\nequipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the\nformal or informal communication\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1. Effective communication\n2.2. Different modes of communication\n2.3. Written communication\n2.4. Organizational policies\n2.5. Communication procedures and systems\n2.6. Technology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning Skills\n3.1. Follow simple spoken language\n3.2. Perform routine workplace duties following simple\nwritten notices\n3.3. Participate in workplace meetings and\ndiscussions\n3.4. Complete work related documents\n3.5. Estimate, calculate and record routine workplace\nmeasures\n3.6. Basic mathematical processes of addition,\nsubtraction, division and multiplication\n3.7. Ability to relate to people of social range in the\nworkplace\n3.8. Gather and provide information in response to\nworkplace Requirements\n4. Resource\nImplications\n4.1. Fax machine\n4.2. Telephone\n4.3. Writing materials\n4.4. Internet\n5. Methods of\nAssessment\n5.1. Direct Observation\n5.2. Oral interview and written test\n6. Context of\nAssessment\n6.1. Competency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 8 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n6\n\nUNIT OF COMPETENCY: WORK IN TEAM ENVIRONMENT\nUNIT CODE\n : 500311106\nUNIT DESCRIPTOR :\nThis unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Describe team role\nand scope\n1.1. The role and objective of the team is identified\nfrom available sources of information\n1.2. Team parameters, reporting relationships and\nresponsibilities are identified from team\ndiscussions and appropriate external sources\n2. Identify own role\nand responsibility\nwithin team\n2.1. Individual role and responsibilities within the team\nenvironment are identified\n2.2. Roles and responsibility of other team members\nare identified and recognized\n2.3. Reporting relationships within team and external to\nteam are identified\n3. Work as a team\nmember\n3.1. Effective and appropriate forms of communications\nused and interactions undertaken with team\nmembers who contribute to known team activities\nand objectives\n3.2. Effective and appropriate contributions made to\ncomplement team activities and objectives, based\non individual skills and competencies and\nworkplace context\n3.3. Observed protocols in reporting using standard\noperating procedures\n3.4. Contribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 9 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n7\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective\nof team\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgement\nmaybe demonstrated on the job, either\nindividually or in a team environment\n\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s specifications\nand instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage,\nsafe handling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and quality\nguidelines\n\n--- PDF PAGE 10 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n8\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace activity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace\nlanguage\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning\nKnowledge and\nAttitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning Skills\n3.1.\nCommunicate appropriately, consistent with the\nculture of the workplace\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place\n 4.2. Materials relevant to the proposed activity or tasks\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation\nto the work activities of the group\n5.2.\nObservation of simulation and or role play\ninvolving the participation of individual member to\nthe attainment of organizational goal\n5.3. Case studies and scenarios as a basis for\ndiscussion of issues and strategies in teamwork\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in workplace or in\na simulated workplace setting\n6.2.\nAssessment shall be observed while task are\nbeing undertaken whether individually or in group\n\n--- PDF PAGE 11 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n9\n\nUNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\nUNIT CODE : 500311107\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\npromoting career growth and advancement.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Integrate personal\nobjectives with\norganizational goals\n1.1 Personal growth and work plans are pursued towards\nimproving the qualifications set for the profession\n1.2 Intra- and interpersonal relationships is are\nmaintained in the course of managing oneself based\non performance evaluation\n1.3 Commitment to the organization and its goal is\ndemonstrated in the performance of duties\n2.\nSet and meet work\npriorities\n2.1 Competing demands are prioritized to achieve\npersonal, team and organizational goals and\nobjectives.\n2.2 Resources are utilized efficiently and effectively to\nmanage work priorities and commitments\n2.3 Practices along economic use and maintenance of\nequipment and facilities are followed as per\nestablished procedures\n3.\nMaintain\nprofessional growth\nand development\n3.1 Trainings and career opportunities are identified\nand availed of based on job requirements\n3.2 Recognitions are sought/received and\ndemonstrated as proof of career advancement\n3.3 Licenses and/or certifications relevant to job and\ncareer are obtained and renewed\n\n--- PDF PAGE 12 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n10\n\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n 3.1.1 Technical\n 3.1.2 Supervisory\n 3.1.3 Managerial\n 3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and\nworkshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4 Professional Licenses\n\n--- PDF PAGE 13 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n11\n\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Attained job targets within key result areas (KRAs)\n1.2 Maintained intra - and interpersonal relationship in\nthe course of managing oneself based on\nperformance evaluation\n1.3 Completed trainings and career opportunities which\nare based on the requirements of the industries\n1.4 Acquired and maintained licenses and/or\ncertifications according to the requirement of the\nqualification\n2. Underpinning\nKnowledge\n2.1 Work values and ethics (Code of Conduct, Code of\nEthics, etc.)\n2.2 Company policies\n2.3 Company operations, procedures and standards\n2.4 Fundamental rights at work including gender\nsensitivity\n2.5 Personal hygiene practices\n3. Underpinning Skills\n3.1 Appropriate practice of personal hygiene\n3.2 Intra and Interpersonal skills\n3.3 Communication skills\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/scenarios\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Simulation/Role-plays\n5.4 Observation\n5.5 Third Party Reports\n5.6 Exams and Tests\n6. Context of\nAssessment\n6.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 14 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n12\n\nUNIT OF COMPETENCY : PRACTICE OCCUPATIONAL HEALTH AND\nSAFETY PROCEDURES\nUNIT CODE : 500311108\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required to comply\nwith regulatory and organizational requirements\nfor occupational health and safety.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify hazards and\nrisks\n1.1 Safety regulations and workplace safety and\nhazard control practices and procedures are\nclarified and explained based on organization\nprocedures\n1.2 Hazards/risks in the workplace and their\ncorresponding indicators are identified to\nminimize or eliminate risk to co-workers,\nworkplace and environment in accordance with\norganization procedures\n1.3 Contingency measures during workplace\naccidents, fire and other emergencies are\nrecognized and established in accordance with\norganization procedures\n2. Evaluate hazards and\nrisks\n2.1 Terms of maximum tolerable limits which when\nexceeded will result in harm or damage are\nidentified based on threshold limit values (TLV)\n2.2 Effects of the hazards are determined\n2.3 OHS issues and/or concerns and identified\nsafety hazards are reported to designated\npersonnel in accordance with workplace\nrequirements and relevant workplace OHS\nlegislation\n\n--- PDF PAGE 15 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n13\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n3. Control hazards and\nrisks\n3.1 Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace are\nconsistently followed\n3.2 Procedures for dealing with workplace accidents,\nfire and emergencies are followed in accordance\nwith organization OHS policies\n3.3 Personal protective equipment (PPE) is correctly\nused in accordance with organization OHS\nprocedures and practices\n3.4 Appropriate assistance is provided in the event of a\nworkplace emergency in accordance with\nestablished organization protocol\n\n4. Maintain OHS\nawareness\n\n4.1 Emergency-related drills and trainings are\nparticipated in as per established organization\nguidelines and procedures\n4.2 OHS personal records are completed and\nupdated in accordance with workplace\nrequirements\n\n--- PDF PAGE 16 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n14\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Safety regulations\nMay include but are not limited to:\n1.1 Clean Air Act\n1.2 Building code\n1.3 National Electrical and Fire Safety Codes\n1.4 Waste management statutes and rules\n1.5 Philippine Occupational Safety and Health\nStandards\n1.6 DOLE regulations on safety legal requirements\n1.7 ECC regulations\n2. Hazards/Risks\nMay include but are not limited to:\n2.1 Physical hazards – impact, illumination, pressure,\nnoise, vibration, temperature, radiation\n2.2 Biological hazards- bacteria, viruses, plants,\nparasites, mites, molds, fungi, insects\n2.3 Chemical hazards – dusts, fibers, mists, fumes,\nsmoke, gasses, vapors\n2.4 Ergonomics\n• Psychological factors – over exertion/ excessive\nforce, awkward/static positions, fatigue, direct\npressure, varying metabolic cycles\n• Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency\nmeasures\nMay include but are not limited to:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. PPE\nMay include but are not limited to:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n\n--- PDF PAGE 17 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n15\n\nVARIABLE\nRANGE\n\n5. Emergency-related\ndrills and training\n\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n6. OHS personal\nrecords\n\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OHS-related training completed\n\n--- PDF PAGE 18 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n16\n\n EVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and\nhazard control practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with\ncompany procedures\n1.3 Recognized contingency measures during\nworkplace accidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based\non threshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OHS)\nprocedures for controlling hazards/risks in\nworkplace\n1.6 Used Personal Protective Equipment (PPE) in\naccordance with company OHS procedures and\npractices\n1.7 Completed and updated OHS personal records in\naccordance with workplace requirements\n2. Underpinning\nKnowledge and\n Attitude\n2.1 OHS procedures and practices and regulations\n2.2 PPE types and uses\n2.3 Personal hygiene practices\n2.4 Hazards/risks identification and control\n2.5 Threshold Limit Value -TLV\n2.6 OHS indicators\n2.7 Organization safety and health protocol\n2.8 Safety consciousness\n2.9 Health consciousness\n3. Underpinning\n Skills\n3.1 Practice of personal hygiene\n3.2 Hazards/risks identification and control skills\n3.3 Interpersonal skills\n3.4 Communication skills\n4. Resource\nImplications\nThe following resources must be provided:\n4.1 Workplace or assessment location\n4.2 OHS personal records\n4.3 PPE\n4.4 Health records\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Case Study/Situation\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or\nin a simulated work place setting\n\n--- PDF PAGE 19 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n17\n\nCOMMON COMPETENCIES\n\nAUTOMOTIVE\n\nUNIT OF COMPETENCY: PERFORM MENSURATION AND CALCULATION\n\nUNIT CODE: ALT311202\n\nUNIT DESCRIPTOR:\nThis unit includes identifying caring, handling and use of\nmeasuring instruments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Select measuring\n\n instruments\n\n1.1 Object or component to be measured is identified\n1.2 Correct specifications are obtained from relevant source\n1.3 Appropriate measuring instrument is selected\naccording to job requirements\n\n2. Carry out\n measurements\n and calculation\n\n2.1 Measuring tools are selected in line with job\nrequirements\n2.2 Accurate measurements are obtained to job\n2.3 Calculation needed to complete work tasks are\nperformed using the four basic process of addition (+),\nsubtraction (-), multiplication (x) and division (/).\n2.4 Calculations involving fractions, percentages and mixed\n numbers are used to complete workplace tasks.\n2.5 Numerical computation is self-checked and corrected for\n accuracy\n2.6 Instruments are read to the limit of accuracy of the tool.\n\n3. Maintain\nmeasuring\ninstruments\n\n3.1 Measuring instruments must kept free from corrosion\n3.2 Measuring instruments not dropped to avoid damage\n3.3 Measuring instruments cleaned before and after using.\n\n--- PDF PAGE 20 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n18\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Measuring\ninstruments\nMeasuring instruments\nincludes:\n\n1.1 Multitester\n1.2 Micrometer (In-out, depth)\n1.3 Vernier caliper (Out,\ninside)\n1.4 Dial Gauge with Mag. Std.\n1.5 Plastigauge\n1.6 Straight Edge\n1.7 Thickness gauge\n\n1.8 Torque Gauge\n1.9 Small Hole gauge\n1.10 Telescopic Gauge\n1.11 Try square\n1.12 Protractor\n1.13 Combination gauge\n1.14 Steel rule\n\n2. Calculation\n\nKinds of Part Mensuration include:\n2.1 Volume\n2.2 Area\n2.3 Displacement\n2.4 Inside diameter\n2.5 Circumference\n2.6 Length\n2.7 Thickness\n2.8 Outside diameter\n2.9 Taper\n2. 10 Out of roundness\n2.11Oil clearance\n2.12 End play/thrust clearance\n\n--- PDF PAGE 21 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n19\nEVIDENCE GUIDE\n\n1. Critical aspect\nof competency\nAssessment requires evidence that the candidate:\n1.1 Selected measuring instruments\n1.2 Carried-out measurements and calculations.\n1.3 Maintained measuring instruments\n\n2. Underpinning\nknowledge and\nattitudes\n2.1 Types of Measuring instruments and its uses\n2.2 Safe handling procedures in using measuring\ninstruments\n2.3 Four fundamental operation of mathematics\n2.2 Formula for Volume, Area, Perimeter and other\ngeometric figures\n\n3. Underpinning\n skills\n3.1 Caring and Handling measuring instruments\n3.2 Calibrating and using measuring instruments\n3.1 Performing calculation by Addition, Subtraction,\nMultiplication and Division\n3.2 Visualizing objects and shapes\n3.3 Interpreting formula for volume, area, perimeter and\nother geometric figures\n\n4. Resource\n implication\nThe following resources must be provided:\n4.1 Workplace location\n4.2 Measuring instrument appropriate to servicing\nprocesses\n4.3 Instructional materials relevant to the propose activity\n\n5. Methods of\n assessment\n\nCompetency must be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n5.3 Interview\n5.4 Demonstration with questioning\n\n6. Context for\n assessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment may be conducted in a workplace or\n simulated environment\n\n--- PDF PAGE 22 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n20\nUNIT TITLE: READ, INTERPRET AND APPLY SPECIFICATION AND MANUALS.\n\nUNIT CODE: ALT723203\n\nUNIT DESCRIPTOR: This unit deals with identifying, interpreting and applying\nservice specification manuals, maintenance procedure\nmanuals and periodic maintenance manual.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify and\naccess\n manual/\n specification\n\n1.1 Appropriate manuals are identified and accessed as\nper job requirements.\n1.2 Version and date of manual is checked to ensure\ncorrect specification and procedure are identified.\n\n2. Interpret manuals\n\n2.1 Relevant sections, chapters of manuals/specifications\nare located in relations to the work to be conducted\n2.2 Information and procedure in the manual are\ninterpreted in accordance to industry practices\n\n3. Apply information\nin manual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer specification\n3.3 Manual data is applied according to the given task\n3.4 All correct sequencing and adjustments are\ninterpreted in accordance with information contained\non the manual or specifications\n\n4. Store manuals\n\n4.1 Manual or specification are stored appropriately to\n ensure prevention of damage, ready access and\n updating of information when required in accordance\n with company requirements\n\n--- PDF PAGE 23 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n21\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Manuals\n\n Kinds of manuals:\n1.1 Manufacturer’s specification manual\n1.2 Repair manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 24 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n22\nEVIDENCE GUIDE\n\n1.Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified and accessed manual/specification\n1.2 Interpreted manuals\n1.3 Applied information in manuals\n1.4 Stored manuals\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Types of manuals used in automotive industry\n2.2 Identification of symbols used in the manuals\n3.1 Identification of units of measurements\n3.2 Unit conversion\n\n3. Underpinning\nskills\n\n3.1 Reading and comprehension skills required to identify\nand interpret automotive manuals and specifications\n3.2 Accessing information and data\n\n4. Resource\nImplication\n\nThe following resources must be provided:\n4.1 All manuals/catalogues relative to Automotive\n4.2 Job order, requisitions\n4.3 Actual vehicle or simulator\n\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1 Observation with questioning\n5.2 Interview\n\n6. Context for\nassessment\n\n6.1 Assessment must be undertaken in accordance with\n the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a\n simulated environment.\n\n--- PDF PAGE 25 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n23\nUNIT OF COMPETENCY: MOVE AND POSITION VEHICLE\n\nUNIT CODE: ALT723202\n\nUNIT DESCRIPTOR: This competency unit covers the knowledge, skills and attitude\nneeded to move and position vehicle in a workshop.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Prepare vehicle for\n driving\n\n1.1 Correct check-up procedures performed based on\n vehicle manufacturer standard\n\n2. Move and position\n vehicle\n\n2.1 Select vehicle to be moved or re-position.\n2.2 Drive the vehicle to appropriate location\n2.3 Park vehicle following parking safety techniques\nand procedure\n\n3. Check the vehicle\n\n3.1 Vehicle position is checked as per required\n3.2 Vehicle is checked for external damages\n\n--- PDF PAGE 26 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n24\nRANGE OF VARIABLE\nVARIABLE\nRANGE\n\n1. Check up procedure\nCheck up procedures include the following:\n1.1 Oil level\n1.2 Brake fluid\n1.3 Clutch fluid\n1.4 Coolant level\n1.5 Battery (electrolyte)\n1.6 Tire pressure\n1.7 Position of driving gear\n1.8 Lighting and warning devices\n\n2. Vehicles\n\n2.1 Vehicles with automatic transmission\n2.2 Vehicles with manual transmission\n\n3.Parking safety\n techniques\n\n3.1 Engaging of Park brake\n3.2 Vehicle parking position\n3.3 Front wheel position\n\n--- PDF PAGE 27 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n25\nEVIDENCE GUIDE\n\n1.Critical aspect of\n competency\nAssessment requires evidence that the candidate:\n1.1 Prepared vehicle for driving.\n1.2 Moved and positioned vehicle\n1.3 Checked the vehicle.\n\n2. Underpinning\n knowledge and\n attitudes\n2.1 Driver’s Code of conduct\n2.2 Workshop signs and symbols\n2.3 Driving skills\n2.4Vehicle accessories for safe driving and parking\n\n3. Underpinning skills\n\n3.1 Ability to handle vehicle/maneuver vehicle the easiest\n way\n3.2 Immediate response to accident\n3.3 Preparing vehicle for driving\n3.4 Parking Downhill, Uphill, Parallel\n3.5 Shifting Gears\n3.6Maneuvering\n\n4. Resource\n implication\nThe following resources must be provided:\n4.1 Driving range/area\n4.2 Appropriate vehicle for driving\n4.3 Vehicle accessories\n\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Observation with questioning\n5.2 Written or oral examination\n\n6. Context for\n assessment\n\n6.1 Assessment must be undertaken in accordance with\nthe endorsed TESDA assessment guidelines\n6.3 Assessment of practical skills must be done in a\n workplace or simulated environment.\n\n--- PDF PAGE 28 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n26\nUNIT OF COMPETENCY: APPLY APPROPRIATE SEALANT/ADHESIVE\n\nUNIT CODE: ALT723201\n\nUNIT DESCRIPTOR: This competency unit covers the selection and application of\nsealant/adhesives.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify appropriate\nSealant/adhesive\n\n1.1Sealant/adhesive selected in line with job\nrequirements and manufacturer’s specification\n1.2 Sealant/adhesive checking is performed to ensure\nthat product is fit for use.\n2. Prepare surface for\nSealant/adhesive\n2.1 Surface materials are identified as per construction\n2.2 Surface is cleaned and free of moisture, dust and\nother foreign matters to ensure maximum adhesion\nor seal.\n\n3. Apply\nsealant/adhesive\n evenly\n3.1 Sealant/adhesive is applied evenly on the surface in\nline with manufacturer’s specification\n3.2 Excess sealant/adhesive is removed by sanding or\n scrapping\n3.3Tools and equipment used to apply\nsealant/adhesive are appropriate to job\nrequirements\n3.4 Safety are observed and PPE are worn in\naccordance with industry SOP\n3.5 Hazards associated with the use of sealant and\nadhesives are identified.\n4. Store/Dispose of\nsealant/adhesive\n4.1 Sealant/adhesive are stored as per prescribed\nprocedure\n4.2 Waste are disposed as per workshop SOP\n\n--- PDF PAGE 29 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n27\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Sealant/Adhesive\nSealant/adhesive includes:\n1.1Form in Place Gasket (FIPG)\n1.2 Ribbon Sealer\n1.3Hametite\n1.4Silicon Body sealer\n1.5 Prestite for Auto and Auto Aircon\n\n2. Tools and equipment\nTools and equipment include:\n2.1 Putty knife\n2.2 Scraper\n2.3 Compressor\n2.4 Steel brush\n2.5 Paint brush\n2.6 Rubber hammer\n2.7 Hand tools\nPersonal protective equipment include:\n2.8 Gloves\n2.9 Apron\n2.10 Safety shoes\n2.11Goggles\n2.12Gas mask\n\n3. Safety\nSafety includes:\n3.1 Ventilation\n3.2 Handling of Flammable/Irritating substances\n3.3 Use of Personal Protective Equipment\n\n4. Hazards\n Hazard includes:\n4.1 Fumes\n4.2 Skin irritation\n4.3 Burns\n\n5.Adhesive/Sealant\n checking\n\nAdhesive/Sealant checking includes:\n5.1 Expiry date\n5.2 Free of contamination\n6.1 Cap/Covers\n6.2 Tightly closed\n6.3 Concentration\n\n--- PDF PAGE 30 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n28\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified appropriate sealant/adhesives\n1.2 Prepared surface for sealant/adhesive\n1.3 Applied sealant/adhesive\n1.4 Stored unused or dispose of used sealant/adhesive\n\n2. Underpinning\nknowledge and\nattitude\n2.1 OH & S regulations\n2.2 Safe handling of sealant/adhesive\n2.3 Industry code of practice\n2.3 Procedures in sealant/adhesive application\n2.4 Procedures in interpreting manuals\n\n3. Underpinning skills\n3.1 Handling sealant/adhesive\n3.2 Applying sealant/adhesive\n3.3.Sanding the surface\n3.4 Use of tools, equipment\n3.5 Mixing of body filler and epoxy base and hardener\n\n4. Resource\n implication\nThe following resources must be provided:\n4.1 Materials relevant to the activity\n4.2 Appropriate tools and equipment\n4.3 Real or simulated workplace\n5. Methods of\n assessment\n\nCompetency must be assessed through\n5.1 Observation with questioning\n5.2 Interview related to:\n• Safe and correct use of tools and equipment\n•Application of adhesive/sealant\n\n7. Context for\n assessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment may be done in a workplace or\nsimulated environment\n\nUNIT OF COMPETENCY: USE AND APPLY LUBRICANTS/COOLANT\n\n--- PDF PAGE 31 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n29\n\nUNIT CODE: ALT723204\n\nUNIT DESCRIPTOR: This unit identifies the competencies required to select and\n apply different types of lubricants.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Identify types of\nlubricants/ coolant\n1.1 Correct information on lubrication schedule is\naccessed and interpreted from appropriate\nmanufacturers specifications manuals\n1.2 Type and quantity of lubricants/coolant is identified\nas per job requirements\n\n2. Use and apply\n lubricants/coolant\n2.1 Correct procedure for change of lubricant is identified\nfollowing manufacturer’s specification or manual\n2.1 Correct tools and equipment are selected and used in\n line with job requirements\n2.3 Existing lubricants is removed and replaced with\nspecified types and quantity of new materials in line\nwith manufacturer’s specification\n2.4 Safe procedure and use of PPE is observed when\nremoving or replacing lubricant\n2.5 Used lubricants are disposed in accordance with\n environmental guidelines\n2. 6 Work is checked in line with company SOP.\n\n3. Perform\nhousekeeping\nactivities\n\n3.1 Tools, equipment and materials are properly stored\nas per company SOP\n3.2 Workplace is free from waste materials\n\n--- PDF PAGE 32 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n30\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Manuals\n\n1.1 Manufacturer’s specification manual\n1.2 Periodic Maintenance manual\n1.3 Service Manual\n2.Lubricants/ Coolant\n\nKinds of lubricants include:\n2.1 Engine oil:\n•\nDiesel engine oil\n•\nGasoline engine oil\n2.2 Automatic Transmission Fluid\n•\nDestro II\n•\nT4\n2.3 Gear oil lubricants:\n•\nOil #90\n•\nOil #140\n•\nOil #30\n•\nOil #40\n2.4 Grease\n• Special (velocity joint)\n Molybdenum disolfate)\n• Ordinary\n• Multi-purpose oil\n• Contact point lubricant\n (grease)\n2.5 Brake/Clutch System\n•\nBrake fluid\n•\nDOT3\n\n2.6 Power Steering Fluid\n•\nHydraulic Fluid\n\n2.7 Radiator Coolant\n•\nLong last coolant\n\n2.8 A/C Compressor Oil\n•\nPag oil\n3. Lubricant\n Schedule\nSchedule for changing oil:\n3.1 Kilometers traveled used\n3.2 No. of Hours used\n3.3 Monthly\n4. Tool and\n equipment\nTools used includes:\n4.1 Hand tools\n4.2 Oiler\n4.3 Oil Dispenser\n4.4 Grease gun\n5. Personal\nProtective\nEquipment (PPE)\n\nPPE include:\n5.1 Apron\n5.2 Gloves\n5.3 Goggles\n5.4 Safety shoes\n\n--- PDF PAGE 33 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n31\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified types of lubricants and lubrication schedule.\n1.2 Used and applied lubricants.\n1.3 Performed housekeeping\n\n2. Underpinning\nknowledge and\nattitudes\n\n2.1 Types/Classification of Lubricants\n2.2 Identifying lubrication schedule\n2.3 Cause and Effects of Gear Oil Dilution\n2.4 Purpose of Lubrication (Problem and effects)\n2.5 Hazard associated with lubrication\n\n3. Underpinning skills\n3.1 Handling of oils (Gear, oil, engine oil)\n3.2 Familiarization/Classification of Lubricants\n3.3 Lubrication Procedure\n\n4. Resource\nimplication\n\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate tools and equipment\n4.3 Materials relevant to activity\n\n5. Methods of\nassessment\nCompetency must be assessed through\n5.1 Demonstration with questioning\n5.2 Written/Oral examination\n\n6. Context for\nassessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment must be undertaken in accordance with\nthe endorsed industry assessment guidelines\n6.3 Assessment of underpinning knowledge and skills\nmay be assessed on or off the job\n\n--- PDF PAGE 34 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n32\n\nUNIT OF COMPETENCY: PERFORM SHOP MAINTENANCE\n\nUNIT CODE: ALT723307\n\nUNIT DESCRIPTOR: This unit deals with inspecting and cleaning of work area\nincluding tools, equipment and facilities. Storage and checking of\ntools/ equipment and disposal of used materials are also\nincorporated in this competency\n\nELEMENT\n\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Inspect/clean tools\nand work area\n.\n1.1 Cleaning solvent used as per workshop/tools\n cleaning requirement\n\n1.2 Work area is checked and cleaned\n\n1.3 Wet surface/spot in work area is wiped and dried\n\n2. Store/arrange tools\nand shop equipment\n\n2.1 Tools/equipment are checked and stored in their\n respective shelves/location\n\n2.2 Corresponding labels are posted and visible\n\n2.3 Tools are safely secured and logged in the records\n\n3. Dispose wastes/used\nlubricants\n3.1 Containers for used lubricants are visibly labeled\n\n3.2 Wastes/used lubricants are disposed as per\n workshop SOP\n\n4. Report damaged\ntools/equipment\n\n4.1 Complete inventory of tools/equipment is maintained\n\n4.2 Damaged tools/equipment/facilities are identified and\n repair recommendation is given\n\n4.3 Reports prepared has no error/discrepancy\n\n--- PDF PAGE 35 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n33\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work Area\nWork areas include:\n1.1 Workshop areas for servicing/repairing light and/or heavy\nvehicle and/or\n plant transmissions and/or outdoor power equipment\n1.2 Open workshop/garage and enclosed, ventilated office\narea\n1.3 Other variables may include workshop with:\n• Mess hall\n• Wash room\n• Comfort room\n2. Cleaning\n requirement\n2.1 Cleaning solvent\n2.2 Inventory of supplies, tools, equipment, facilities\n2.3 List of mechanics/technicians\n2.4 Rags\n2.5 Broom\n2.6 Map\n2.7 Pail\n2.8 Used oil container\n2.9 Oiler\n2.10 Dust/waste bin\n3. Manuals\n3.1 Vehicle/plant manufacturer specifications\n3.2 Company operating procedures\n3.3 Industry/Workplace Codes of Practice\n3.4 Product manufacturer specifications\n3.5 Customer requirements\n3.6 Industry Occupational Health &Safety\n4. Company\nstandard\noperating\nprocedure\nWearing of Personal protective equipment include:\n4.1 Gloves\n4.2 Apron\n4.3 Goggles\n4.4 Safety shoes\n\n--- PDF PAGE 36 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n34\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1Cleaned workshop tools/facilities\n1.2Maintained equipment, tools and facilities\n1.3Disposed wastes and used lubricants/fluid as per required\n procedure\n2. Underpinning\nknowledge and\nattitudes\n2.1 5S or TQM\n2.2 Service procedures\n2.3 Relevant technical information\n2.4 Safe handling of Equipment and tools\n2.5 Vehicle safety requirements\n2.6 Workshop policies\n2.7 Personal safety procedures\n2.8 Fire Extinguishers and prevention\n2.9 Storage/Disposal of Hazardous/flammable materials\n2.10 Positive Work Values (Perseverance, Honesty,\nPatience, Attention to Details)\n3. Underpinning\nskills\n3.1 Handling/Storing of tools/equipment/supplies and\nmaterial\n3.2 Cleaning grease/lubricants\n3.3 Disposing of wastes and fluid\n3.4 Preparing inventory of s/m and tools and equipment\n3.5 Monitoring of s/m and tools/equipment\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Written/Oral Questioning\n5.2 Demonstration\n5.3 Assessment of underpinning knowledge and practical\nskills may be combined.\n\n6. Context for\nassessment\n6.1 Competency must be assessed on the job or simulated\nenvironment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 37 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n35\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: INTERPRET TECHNICAL MANUAL SPECIFICATION\n OF ENGINE COMPONENTS\n\nCODE : ALT723328\n\nUNIT DESCRIPTOR: This unit identifies the competence required to compare\ncomponents to original manufacturer specifications and match\nin relation to weight, size, and capacity with reference to the\ntechnical data.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Carry out\ninterpretation of\nmanual\nspecifications\n\n1.1\nCorrect information is accessed and interpreted from\nappropriate manufacturer specifications\n1.2\nSymbols, codes, legends and diagrams interpreted\n1.3\nRepresentations are correctly recognized\n1.4\nParts/systems/components/item represented\n is correctly identified\n1.5\nInformation represented is correctly understood\n1.6\nComponents are prepared for inspection/\nmeasurement.\n1.7\nAppropriate measuring instrument and tools are\nused as prescribed.\n1.8\nMeasurements are compared against original\nequipment manufacturer (OEM) specifications\n1.9 Components are adjusted to meet OEM specifications\nwithout damage.\n1.10 All interpretation of manual specification are carried\nout according to industry regulations/guidelines,\noccupational health and safety (OHS)\nrequirements, and enterprise procedures/policies\n\n--- PDF PAGE 38 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n36\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Components\nComponents to be measured includes but is not limited to:\n1.1 Crankshaft journals\n• Main journal\n• Connecting rod journal (Crank pin)\n1.2 Cylinder Head\n1.3 Cylinder Bores\n1.4 Camshaft journal\n1.5 Connecting rods\n1.6 All clearances\n•\nBearing\n•\nPiston\n•\nRing end gaps\n•\nCamshaft clearance\n•\nCrankshaft\n•\nBacklash\n2 Damages\nDamages incurred during measurement of components\nincludes:\n2.1 Useless repairs\n2.2 Unnecessary expenses\n2.3 Waste of time, efforts, and materials\n3 Measuring\ninstruments/\nequipment and\nTools\n3.1 Lifting equipment, balancing equipment, scales,\nmeasuring equipment (both graduated and volumetric\ndevices)\n3.2 Handtools, Power tool,\n3.3Manuals\n4 OHS\nRequirements\n4.1 Wearing of personal protective equipment such as\n apron, goggles, gloves, safety shoes\n4.2 Disposal of wastes materials\n4.3 Workshop housekeeping\n\n--- PDF PAGE 39 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n37\n\nEVIDENCE GUIDE\n\n1. Critical aspects\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted the blueprint of components without damage\nor injury to tools, equipment and personnel\n1.2 Interpreted the blueprint of components to specified\ntolerances following company procedures\n2. Underpinning\nknowledge and\nattitudes\n2.1 Technical information including technical drawings and\ntechnical symbols\n2.2 Equipment safety requirements\n2.3 Personal safety requirements\n2.4 Equipment and machinery safety requirements\n2.5 Techniques in measuring, balancing and machining\n2.6 Positive Work values ( Perseverance, Patience, Honesty,\n Attention to Details)\n3. Underpinning\nskills\n3.1 Accessing and interpreting technical information\n3.2 Using relevant tools/equipment\n3.3 Applying measuring techniques\n3.4 Applying balancing techniques\n3.5 Applying relevant machining techniques\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Actual demonstration of skills in weighing, balancing,\nchecking volumes, machining, measuring and comparison\nfrom specification\n5.2Written/Oral examination\n6. Context for\nassessment\n6.1 Competency elements must be assessed in a safe\nworking environment, using tools and equipment as\nstipulated in the resources section of the Evidence Guide\n6.2 Assessment must be undertaken in accordance with the\nTESDA Assessment Guidelines.\n6.3 The assessment of practical skills must only take place\nafter a period of supervised practice and repetitive\nexperience. If workplace conditions are not available,\nassessment in simulated workplace conditions is\nacceptable.\n\n--- PDF PAGE 40 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n38\n\nUNIT OF COMPETENCY: DISASSEMBLE ENGINE BLOCK AND SUB-\nASSEMBLIES, CHECK TOLERANCES AND\nCOMPONENTS\nUNIT CODE: ALT723329\n\nUNIT DESCRIPTOR: This unit identifies the competence required to disassemble,\ninspect, evaluate and determine preferred repair action for\nengine block and sub-assemblies as part of a reconditioning\nprocedure.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.Disassemble\nengine block and\nsub-assemblies\n1.1 Engine block and sub-assemblies are disassembled\nwithout causing damage to any component or system.\n1.2 Engine block and sub-assemblies are disassembled\nusing approved methods and appropriate equipment\nand tools.\n1.3 Correct information is accessed and interpreted from\nappropriate manufacturer specifications.\n1.4 Components/system are cleaned in preparation for\nevaluation\n1.5 All disassembling/cleaning activities are carried out\naccording to industry regulations/guidelines,\noccupational health and safety procedures and\ncompany policies using appropriate tools and\nequipment.\n2. Inspect/measure/\ntest engine block\nand sub-assembly\ncomponents and\ndetermine repair\nprocedures\n\n2.1 Inspection/measurement/testing method is completed\nwithout causing damage to any component or system.\n2.2 Correct information is accessed and interpreted from\nappropriate manufacturer specifications\n2.3 Engine block and sub-assembly components are\nmeasured against manufacturer specifications and\ntolerances.\n2.4 Engine block and sub-assembly components are\nevaluated against measurements, test and inspections\nmade.\n2.5 Repair requirements are identified and reported\naccording to enterprise policy and procedure.\n2.6 Appropriate workplace documentation is completed and\ndealt with relevant to inspection/measurements/testing\noutcomes.\n2.7 All inspection/measurement/testing activities are carried\nout according to industry regulations/guidelines,\noccupational health and safety and company policies\nusing appropriate tools and equipment.\n\n--- PDF PAGE 41 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n39\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Engine\n1.1 Gasoline\n1.2Diesel\n2. Components or\nSystem\nComponents or system\nShort engines, various\nSuch as:\n2.1 Crankshafts\n2.2 Camshaft\n2.3 Cylinder blocks\n2.4 Idler shaft\n2.5 Pistons\n2.6 Connecting rods\n2.7 Bearings\n2.8 Piston Rings\nof the engine includes\nengine components\n\n2.9 Gears\n2.10 Timing Chains\n2.11 Timing Belts\n2.12 Pulleys\n2.13 Engine Oil pumps\n2.14 Cylinder head\n2.15 Rocker Arm Shaft\n3.Methods\nMethods applied under normal operating condition\nincludes:\n3.1Disassembling\n3.2 Cleaning\n3.3 Measuring against specifications\n3.4Various testing (e.g. crack and pressure tests)\n3.5Visual inspection\n3.6Comparing against specifications\n4. Tools/Equipment\n4.1 Handtools\n4.2 Power Tools/Equipment\n4.3 Special equipment\n4.4 Measuring equipment/tools\n•\nStraight edge\n•\n Caliper\n•\n feeler gage\n•\n micrometer\n•\n Vernier caliper\n•\n inside caliper\n•\n dial gage)\n4.5 Lifting equipment (Hoist or Jack)\n4.6 Testing equipment\n4.7 Cleaning equipment\n4.8 Crack testing equipment\n4.9 Pressure testing equipment\n5. Occupational\n Health and Safety\n Procedures\n5.1 Use of Personal Protective Equipment\n•\nFace Shields/safety goggles\n•\nGloves\n•\nApron\n•\nSafety shoes\n5.2 Safe Handling of\n•\nEquipment\n•\nTools and materials\n\n--- PDF PAGE 42 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n40\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Disassembled and conducted accurate assessment of\ncondition of engine block and sub-assembly.\n1.2 Determined appropriate repair action\n2. Underpinning\nknowledge and\nattitudes\n2.1 Disassembling methods and procedures\n2.2 Procedure in measuring and testing\n2.3 Methods of repair\n2.4 Equipment safety requirements\n2.5 Relevant company policies\n2.6 Personal safety requirements\n2.7 Manual handling techniques\n2.8 Cleaning methods and materials\n2.9 Construction and Principle of engine operation\n2.10 Positive Work values ( Perseverance, Patience, Honesty,\n Attention to Details)\n3. Underpinning\nskills\n3.1 Accessing and interpreting technical information\n3.2 Applying dismantling procedures\n3.3 Applying testing techniques\n3.4 Using relevant tools and equipment\n3.5 Maintaining customer/company records\n3.6 Using measuring equipment and instruments\n3.7 Applying manual handling procedures\n3.8 Checking and comparing various components to actual\nspecifications\n3.9 Deciding on most appropriate repair action necessary\n3.10 Explaining to customers on repair action to be done\n4. Resource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to processes or\nactivities\n4.2 Materials relevant to the activity\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation of the task on disassembling engine\nblock and sub-assemblies and check components\n5.2 Written or oral (short-answer) questions\n5.3 Practical exercises relevant to this unit of competency.\n5.4 Portfolio assessment\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or in\nsimulated workplace environment\n\n--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n41\n\nUNIT OF COMPETENCY: DISASSEMBLE ENGINE SUB-ASSEMBLIES/\n\n CYLINDER HEADS AND CHECK COMPONENTS\nUNIT CODE: ALT723330\n\nUNIT DESCRIPTOR:\nThis unit identifies the competence required to disassemble,\ninspect, check and determine preferred repair action for\nengines and/or cylinder heads as a part of a reconditioning\nprocedure.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Disassemble\nengine sub-\nassembly\n/cylinder head\n\n1.1 Engine sub-assembly/cylinder head is disassembled\nwithout causing damage to any workplace property,\nequipment or components and in accordance to\ncompany standard operating procedures.\n1.2 Engine sub-assembly/cylinder head is disassembled\nusing approved methods and appropriate\ntools/equipment.\n1.3 Correct information is accessed and interpreted from\nappropriate manufacturer Manual specifications.\n1.4 Component parts are cleaned using appropriate tools\nequipment and materials in preparation for evaluation.\n2. Inspect engine\n sub-assembly /\n cylinder\n head components\nand determine\nrepair procedures.\n2.1 Inspection is completed without causing damage to any\nworkplace property, equipment or components.\n2.2 Correct information is accessed and interpreted from\nappropriate manufacturer specifications.\n2.3 Engine sub-assembly/cylinder head components are\nmeasured against manufacturer specifications and\ntolerances.\n2.4 Engine sub-assembly/cylinder head components are\nevaluated against the measurements, tests and\ninspections made.\n2.5 Repair procedures are reported for engine sub-\nassembly/cylinder head components.\n2.6 Actions performed and results achieved relative to this\ncompetency element are recorded and dealt with\naccording to company policies and procedures.\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n42\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Engine\n1.1 Gasoline engine\n1.2 Diesel engine\n2. Engine Sub-\nAssemblies\nKinds of Engine and its sub-assemblies/Components\ninclude:\n2.1 Cylinder heads\n2.2Camshafts\n2.3 Rocker Arm\n2.4Idler shafts\n2.5Timing Chains\n2.6Timing Belts\n2.7Pulleys\n2.8Valve Truing mechanism\n2.9 Engine pump\n3. Manual\n3.1 Maintenance Procedure Manual\n3.2 Periodic Maintenance Data\n3.4 Service Manual\n3.5 Parts Checklist\n4.Company\nStandard\nOperating\nProcedure\n4.1 Job Order\n4.2 Requisition slip\n4.3 Wearing of Personal Protective Equipment such as Goggles,\nhand gloves, apron, safety shoes\n5. Tools, Equipment\nand Supplies\n5.1 Hand tools, power tools,\n5.2 Special tools/equipment\n5.3 Measuring equipment (straight edge, caliper, feeler gage,\nmicrometer, Vernier caliper, inside caliper dial gage)\n5.4 Lifting equipment (Jack, Hoist)\n5.5 Testing equipment (Probing tools, multitester, VOM)\n5.6 Cleaning equipment (Degreaser, Pressurized water\n5.7Crack testing ( Megaflux powder, chemical spray, kerosene)\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n43\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Disassembled engine sub-assembly/cylinder head\n1.2 Disassembled and assessed the components without causing\ndamage or injury to tools, equipment and personnel\n1.3 Determined appropriate action for repair\n2. Underpinning\nknowledge and\nattitudes\n2.1 Dismantling methods\n2.2 Measuring and testing procedures\n2.3 Equipment safety requirements\n2.4 Relevant company policies\n2.5 Personal safety requirements\n2.6 Manual handling techniques\n2.7 Cleaning methods and materials\n2.8 Construction and Principles of operation of Engine\n2.9 Construction and operation relevant to application\n2.10 Positive Work values ( Perseverance, Patience, Honesty,\n Attention to Details)\n3. Underpinning\nskills\n3.1 Use of tools and equipment in disassembling engine\ncomponent\n3.2 Identifying defect/faults in an engine component\n3.3 Handling of parts and components\n3.4 Technique in disassembling component\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation while the tasks are being performed\n5.2 Questions/Interview related to the Underpinning skills\n6. Context for\nassessment\n6.1 Competency must be assessed on the job or in a\nsimulated environment.\n6.2 The assessment of practical skills must take place after a\nperiod of supervised practice and repetitive experience.\n\n--- PDF PAGE 46 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n44\nUNIT OF COMPETENCY: CARRY OUT PRE-REPAIR OPERATIONS ON\n ENGINE COMPONENTS\n\nUNIT CODE: ALT723331\n\nUNIT DESCRIPTOR: This unit identifies the competence required to clean\ncomponents by chemical or mechanical means and remove\ncomponent in preparation for either storage or repair.\n\n ELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.Clean components\nprior to repairs\nand/or storage\n1.1 Cleaning of engine components is achieved without\ncausing damage to any component or system\n1.2 Cleaning agents are used according to cleaning agent\nmanufacturer instructions\n1.3 Component of the engine is cleaned to facilitate\ninspection, assessment, replacement, repair and/or\nstorage.\n1.4 Used cleaning agents and waste materials are safely\ndisposed of according to company policy and national\nlegislation.\n1.5 Cleaning operations are carried out according to\nindustry regulations/guidelines, occupational health\nand safety procedures and company policy.\n2. Segregate, tag\nand store\ncomponents\n2.1 Components are segregated, tagged and stored without\ncausing damage to any component or system.\n2.2 Correct information is accessed and interpreted from\nappropriate manufacturing specifications.\n2.3 Components are removed, tagged and stored in\naccordance with manufacturer specifications and\nenterprise procedures\n2.4 Removal and storage activities are carried out\naccording to industry standards/guidelines,\noccupational health and safety and company policy.\n2.5 Report on additional parts required to complete the\nrepair (not listed in quotation) is completed in\naccordance with company policy.\n\n--- PDF PAGE 47 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n45\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Engine Components\nKinds of Engine and its sub-assemblies/\nComponents include:\n1.1 Long engines and short engines,\n1.2Cylinder heads\n1.3 Camshafts\n1.4Rocker Arm\n1.5 Idler shafts\n1.6 Timing Chains\n1.7 Timing Belts\n1.8 Pulleys\n1.9 Valve Train Mechanism\n1.10 Engine pump\n2. Cleaning operations\n2.1 Manual cleaning\n2.2 Machine-assisted cleaning\n3. Occupational Health\nand Safety procedures\n3.1 Use of Personal Protective Equipment\n•\nSafety shoes\n•\nFace Shields/safety goggles\n•\nGloves\n•\nApron\n•\nSafety shoes\n3.2 Safe Handling of\n•\nEquipment\n•\nTools\n•\nMaterials\n4. Cleaning agents\n4.1 De-waxing\n4.2 Detergent\n4.3 Degreaser\n4.4 Special purpose agents\n5. Information\nSources of information/documents may include:\n5.1 Vehicle manufacturer specification\n5.2 Company operating procedure\n5.3 Insurance company instruction\n5.4 Product manufacturer specifications\n5.5 Material safety data sheets\n5.6 Industry/workplace code of practice\n\n--- PDF PAGE 48 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n46\nEVIDENCE GUIDE\n1. Critical\naspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted and communicated operational information\n1.2 Practiced working safely\n1.3 Observed vehicle protection methods\n1.4Removed, stored and cleaned component of engine.\n2. Underpinning\nknowledge\nand attitudes\n2.1 Occupational health and Safety\n2.2 Personal safety protection procedures\n2.3 Manual handling techniques\n2.4 Equipment safety requirements\n2.5 Vehicle safety requirements\n2.6 Types of cleaning agents and their uses\n2.7 Procedure in removing and storing parts\n2.8 Methods in tagging components\n2.9Positive Work values ( Perseverance, Patience, Honesty,\n Attention to Details)\n3. Underpinning\nskills\n3.1 Accessing and applying safety and technical information\n3.2 Applying correct manual handling techniques\n3.3 Applying personal safety requirements\n3.4 Using relevant tools and equipment\n3.5 Cleaning components using the appropriate agents\n3.6 Removing and replacing components\n3.7 Storing removed components\n4. Resource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to processes or\nactivities\n4.2 Materials relevant to the proposed activity\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation or Demonstration\n5.2 Written or oral (short-answer) questions\n5.4 Portfolio assessment\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or in\nsimulated workplace environment\n6.2 The underpinning knowledge and skills may be assessed\non or off-the-job.\n6.3 The prescribed outcome must be achieved without direct\nsupervision.\n\n--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n47\nUNIT OF COMPETENCY: INSPECT ENGINE COMPONENTS AND DETERMINE\nPREFERRED REPAIR ACTION\nUNIT CODE: ALT723332\n\nUNIT DESCRIPTOR: This unit identifies the competency required to carry out an\ninspection of engine components and decide on the most\nappropriate repair/replacement methods.\n ELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n(All inspections methods are carried out according to industry\nregulations/guidelines, occupational health and safety and company\nprocedures)\n1.Conduct visual\ninspection of\nengine\ncomponents to\ndetermine defects\n1.1 Information is accessed from appropriate sources to\ngain knowledge of the fault.\n1.2 Vehicle components are isolated/disassembled to\npermit an accurate inspection for defects.\n1.3 Inspection method for engine components is\nconducted as per procedure.\n2. Lift and move\nmaterials/\ncomponents/parts\n2.1 Lift and move work is completed without causing\ndamage to any component or system\n2.2 Materials weight is determined correctly utilizing most\nappropriate techniques\n2.3 Appropriate tools and equipment are selected and\nused when required\n2.4 Items to be lifted up are checked for hazardous\n implications\n2.5 Lifting techniques are undertaken wherein types of\nmovement, methods, storage, heights and position are\nconsidered\n2.6 Parts/components/materials are placed safely on\nmoving equipment and relocated ensuring safety of\npersonnel and security of parts/components/materials.\n2.7 All activities are carried out in accordance with industry\nstandards/guidelines, occupational health and safety\nand company policies.\n\n--- PDF PAGE 50 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n48\n3. Carry out\ndiagnostic\nprocedures\n\n3.1 Information and assistance (if necessary) is accessed\nfrom appropriate sources in distinguishing between\n“symptoms” and “causes”.\n3.2 Permission to partly disassemble components is\nobtained, to accurately inspect and diagnose defects.\n3.3 A diagnosis strategy is developed that can be used to\ndetermine a fault within the engine component.\n3.4 Identification of defects and needed repairs are made\nfrom test results using appropriate tools and equipment\nand a plan of action is decided upon to rectify defects\n3.5 All inspections are carried out in accordance to industry\nregulations/guidelines, occupational health and safety,\nand company policies\n4. Prepare written\n repair quotations\n4.1 Quotation is prepared accurately on approved format.\n4.2 Repair quotation is prepared is prepared accurately as\nper enterprise-approved format\n4.4 Customer is consulted as per standard operating\nprocedures.\n4.5 Approval to complete repairs is sought as per standard\noperating procedures\n4.6 Quotation is filed as per standard operating procedures.\n\n--- PDF PAGE 51 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n49\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Inspection Methods\n1.1 Actual\n1.2 Visual\n1.3 Operational assessment\n\n2. Lift and Move work\n\n2.1 Manual lifting and moving using hand operated\nequipment\n2.2 Consideration on hazard implications (eg.\nChemical, liquids, gases)\n3. Occupational Health\nand Safety\nprocedures\n3.1 Use of Personal Protective Equipment\n•\nSafety shoes\n•\nFace Shields/safety goggles\n•\nGloves\n•\nApron\n•\nDust Mask or with Filter Diaphragm\n3.2 Safe Handling of\n•\nEquipment\n•\nTools\n•\nMaterials\n4. Tools and equipment\n\n4.1 Hand tools, power tools,\n4.2 Special equipment/tools\n4.3 Measuring equipment (straight edge, caliper, feeler\ngage, micrometer, Vernier caliper, inside caliper\ndial gage)\n4.4 Lifting equipment (Jack, Hoist)\n4.5 Testing equipment (Probing tools, multitester,\nVOM)\n4.6 Cleaning equipment (Degreaser, Pressurized water\n4.7Crack testing ( Magnaflux powder, chemical spray,\nkerosene)\n5. Repair quotation\nRepair quotation include\n5.1 light\n5.2 power\n5.3 rental\n5.4 taxes\n5.5 communication\n5.6 stationery\n5.7 charges\n5.8 Government charges\noverhead such as\n5.9 security\n5.10 professional\nassociation fee\n5.11 wage\n5.12 work schedule\n5.13 fuel\n5.14 materials\n5.15 spare parts\n\n--- PDF PAGE 52 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n50\nEVIDENCE GUIDE\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1 Located the defects without damage or injury to tools,\nequipment or personnel\n1.2 Lifted, moved and handled components or parts as per\ncompany procedure\n1.3 Conducted appropriate testing and diagnosing to\naccurately find defects.\n1.4 Prepared quotation and recommended the appropriate\nrepair action\n2. Underpinning\nknowledge and\nattitude\n2.1 Equipment safety requirements\n2.2 Correct manual handling technique/safe lifting and moving\nprocedures\n2.3 Diagnostic procedures and problem solving\n2.4 Safety requirements\n2.5 Written communication and report writing\n2.6 Oral communication\n3. Underpinning\nskills\n3.1 Preparing customer reports\n3.2 Maintaining relevant records\n3.3 Preparing/ presenting repair quotations\n3.4 Using diagnostic tools/ chart and equipment\n3.5 Exchanging technical ideas\n3.6 Applying mathematical ideas to inspection process of\nengine system and components\n3.7 Exchanging information with customers and\nrecommending repair actions\n4. Resource\nimplications\nThe following resources must be provided\n4.1 Tools, equipment and facilities appropriate to processes or\nactivities\n4.2 Materials relevant to the proposed activity\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation\n5.2 Written or oral (short-answer) questions\n5.3 Practical exercises.\n5.4 Portfolio assessment\n6. Context for\nassessment\n6.1 Competency may be assessed in the workplace or in\nsimulated workplace environment\n6.2 The underpinning knowledge and skills may be assessed\non or off-the-job.\n6.3 The prescribed outcome must be achieved without direct\nsupervision.\n\n--- PDF PAGE 53 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n51\n\nUNIT OF COMPETENCY: CARRY OUT MACHINING OPERATIONS\n\nUNIT CODE: ALT821301\n\nUNIT DESCRIPTOR:\nThis unit identifies the competence required to set up and\nmachine components to specifications using lathe, drilling\nand cutting machines for all mechanical streams\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Set up\nmachinery prior\nto machining\n\n1.1 Machinery set up is completed without causing damage to\nany components, system, tools and equipment.\n1.2 Correct information is accessed and interpreted from\nappropriate manufacturer specifications\n1.3 Material to be machined is positioned and clamped\n1.4 Correct speed and feed is selected to suit materials\n1.5 Personal safety requirement including machine guards\nare worn and positioned\n1.6 Setting up of components including machine guards are\nworn and positioned\n1.7 All machinery set up activities are carried out according\nto industry regulations/guidelines, OHS and enterprise\npolicies\n2. Machine\ncomponents\n2.1 Components are machined without causing damage to\n any components or system\n2.2 Correct information is accessed and interpreted from\nappropriate manufacturer specifications\n2.3 Components are measured for size and finish\n2.4 Size and finish are compared with specifications\n2.5 Area is cleaned prior to removal from machine\n2.6 Machining/cutting of components is carried out in\naccordance with manufacturer current specifications for\nmethods, equipment used and tolerance relative to the\ncomponent being machined out/cut\n2.7 All machining/cutting activities are carried out according to\nindustry regulations/guidelines, OHS, and enterprise\nprocedures/policies.\n\n--- PDF PAGE 54 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n52\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials\n1.1 Cast iron\n1.2 Steel\n1.3 Bronze\n1.4 Plastic (polyurethane)\n2. Tools and\nequipment\n2.1 Handtools,\n2.2 Power hacksaw or cut off saw\n2.3 Lathe and tool bits\n2.4 Measuring equipment, lifting equipment\n2.5Drills and bits\n3. Personal\nsafety\nrequirements\n3.1 Wearing of personal protective devices such as Gloves,\nGoggles, Apron Safety shoes\n3.2 Housekeeping\n3.3Maintenance of tools and equipment\n4. Machinery set-\nup\n4.1 Clamping\n4.2 Positioning\n4.3 Centering\n4.4 Checking of speed\n4.5 Setting up\n4.6 Lubricating\n4.7 Checking of oil level\n4.8 Checking of angle of tool bit\n\n--- PDF PAGE 55 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n53\nEVIDENCE GUIDE\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Performed turning and/or grinding and/or cutting\n operations.\n1.2 Reconditioned automotive components to restore surface\n1.3 Finishes, working clearances and component alignment\n1.4 Components are machined without damage to tools,\n equipment and personnel\n1.5 Components are machined to tolerances following\nmanufacturer specification\n2. Underpinning\nknowledge\nand attitudes\n2.1 Equipment safety requirements\n2.2 Machinery safety requirements\n2.3 Relevant methods of machining and/or cutting\n2.4 Measuring instruments, application and procedures\n2.5 Speed and feed ratios\n2.6 Personal safety requirements\n2.7 Positive Work values ( Perseverance, Patience, Honesty,\n Attention to Details)\n3 Underpinning\nskills\n3.1 Access, interpret and apply technical information\n3.2 Use relevant tools, equipment and machinery safely\n3.3 Use measuring equipment correctly\n3.4 Apply setting up procedures (relevant to application)\n3.5Apply machining procedures (relevant to application)\n4 Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3Materials relevant to the activity\n5 Method of\nassessment\nCompetency must be assessed through:\n5.1 Actual demonstration of skills in lathe turning, grinding,\ncutting, drilling.\n5.2Written examination\n6 Context for\nassessment\n6.1 The assessment of practical skills must only take place\nafter a period of supervised practice and repetitive\nexperience. If workplace conditions are not available,\nassessment in simulated workplace conditions is\nacceptable.\n\n--- PDF PAGE 56 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n54\n\nUNIT OF COMPETENCY: SET, OPERATE AND MONITOR SPECIALIZED\n\n MACHINES\n\nUNIT CODE: ALT821302\n\nUNIT DESCRIPTOR:\nThis unit identifies the competence required to set,\noperate and monitor specialized machines used in\nreconditioning engine and/or vehicle components\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Set machines\n\n1.1 Machines are set without causing damage to any\ncomponent or system\n1.2 Correct information is accessed and interpreted from\nappropriate manufacturer specifications\n1.3 Components are measured and repair action\ndetermined\n1.4 Components is positioned and clamped\n1.5 Machine is set in accordance with defined procedures\n1.6 Machine is adjusted to meet operational\nrequirements and specifications using appropriate\nmeasuring equipment\n1.7Tools and accessories are selected according to job\nspecifications\n1.8 Worn-out or damaged tool is identified and\nchanged/sharpened\n1.9 All setting activities are carried out according to\nindustry regulations/guidelines, OHS requirements\nand enterprise procedures/policies\n\n2. Operate and\nmonitor machine\n2.1 Machine is operated and monitored without damage\nto any component or system\n2.2 Correct information is accessed and interpreted from\nappropriate manufacturer specifications\n2.3 Machine is operated in accordance with enterprise\nprocedures\n2.4 Components are checked with appropriate\ninstruments to ensure compliance to specifications\n2.5 Sharpness of tools is monitored and tools are\nsharpened or replaced to meet requirements when\nnecessary\n2.6 Finished products is checked for alignment, tolerance\nand finish\n2.7 All machining operations are carried out according\nto industry regulations/guidelines, OHS, and\nenterprise procedures/policies\n\n--- PDF PAGE 57 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n55\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Machine\n1.1 Build Up Machine\n1.2 Straightening Machine\n1.3 Line Boring\n1.5 Crankshaft Grinding\n1.6 Balancing Machine\n1.7 Connecting Rod Balancer\n1.8 Valve Replacer\n1.9 Reboring/Honing\n2. Tools and\naccessories\n\n2.1 Measuring equipment\n2.2 Relevant safety equipment, hand tools, power/air tools,\nlathe, milling machines, line borers, pin fitting machines,\nprecision grinders, lifting equipment, cleaning equipment\n3. OHS\nRequirements\n3.1 Industry Occupational Health &Safety includes:\n3.2 Wearing of personal protective equipment such as\n apron, goggles, gloves, safety shoes\n3.3 Disposal of wastes materials\n3.4 Workshop housekeeping\n4. Instrument\n4.1 Bore Gage\n4.2 Dial Gage\n4.3 Feeler Gage\n4.4Inside Caliper\n5. Machining\noperation\n\n5.1 Reboring/Honing Operation\n5.2 Line Boring Operation\n5.3 Crankshaft Grinding\n5.4 Valve seat Grinding\n5.5 Camshaft Grinding\n5.6 Engine Balancing\n5.7 Connecting Rod and Piston Balancing\n5.8 Valve Replacer\n\n--- PDF PAGE 58 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n56\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate\n1.1 Performed machining of components without damage or injury\nto tools, equipment and personnel\n1.2 Performed machining of components to specified tolerances\nand finishes following enterprise procedures\n2. Underpinning\nknowledge and\nattitudes\n2.1The necessary cleaning/lubricating agents\n2.2 Relevant technical information including technical drawings\n2.3 Equipment safety requirements\n2.4 Machining methods\n2.5 Industry codes of Practice\n2.6 Pool sharpening methods\n2.7 Personal safety requirements\n2.8 Manual handling techniques\n2.9 Positive Work values ( Perseverance, Patience, Honesty,\n Attention to Details)\n3. Underpinning\nskills\n3.1 Access and interpret technical information\n3.2 Use relevant tools/equipment\n3.3 Carry out machining processes\n3.4 Sharpening machining tools\n3.5 Setting the machines\n3.6 Apply manual handling techniques\n3.7 Use of personal protective equipment\n3.8 Monitoring machining processes\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency must be assessed through\n5.1 Demonstration of skills in measuring equipment, relevant\nsafety equipment, handtools, power/air tools, lathes, milling\nmachines, line borers, pin fitting machines, precision grinders,\nlifting equipment, cleaning equipment\n5.2Written/Oral examination\n6. Context for\nassessment\n6.1 The assessment of practical skills must only take place after a\nperiod of supervised practice and repetitive experience in\nsafe working environment. If workplace conditions are not\navailable, assessment in simulated workplace conditions is\nacceptable.\n\n--- PDF PAGE 59 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n57\n\nUNIT OF COMPETENCY: USE AND MAINTAIN MEASURING INSTRUMENT\n\nUNIT CODE: ALT821303\n\nUNIT DESCRIPTOR: This unit identifies the competence required to measure\ncomponents or sections using non-specialist instrument and\nmaintain the measuring instrument.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Measure\ndimensions or\nvariables using\nappropriate\ninstrument\n\n1.1 Measurement of dimensions and variables are\ncompleted without causing damage to any instrument\nor components\n1.2 Appropriate measuring instrument is selected\n1.3 Relevant measuring techniques are used and results\nappropriately recorded\n1.4 All measuring activities are carried out according to\nindustry regulations/guidelines OHS & requirements\nand enterprise/procedures policies\n\n2. Maintain\nmeasuring\ninstrument\n2.1 Maintenance of measuring instrument is achieved\nwithout causing damage to any instrument or\ncomponent\n2.2 Routine care and storage of measuring instrument\nis undertaken according to manufacture specifications\n2.3 Checking and calibrating of measuring devices is done\nprior to use.\n2.4 All maintenance activities of measuring instruments are\ncarried out according to industry regulations/guidelines\nOHS legislation, and enterprise procedures policies\n\n--- PDF PAGE 60 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n58\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Dimension and\nVariables\nMeasurement\n1.1 Cylinder bore\n• Taper\n• Out of round\n1.2 Crankshaft journal (roundness, straightness, alignment)\n• Out of round\n• Taper\n• Straightness\n• Alignment\n1.3 Cylinder Head\n• Warpage\n• Thickness\n1.4 Valve depth\n1.5 Camshaft\n• cam lobe height\n• straightness\n1.6 Cylinder Block (Aluminum)\n• Warpage\n2. Measuring\ninstrument and\ntools\n2.1 Handtools\n2.2 Bore gage\n2.3 Depth gage\n2.4 Vernier Caliper\n2.5 Micrometer\n2.6 Dial Gage\n2.7 Straight edge\n2.8 Feeler gage\n2.9 Inside Caliper\n2.10 T-squares,\n2.11 Flat edges,\n2.12 Dividers\n2.13 Protractors)\n3. Measuring\ntechnique\n3.1 correct usage of the above mentioned measuring\n instrument and tools.\n3.2 Out of round or ovality\n3.3 Cylindricity or taper conicity\n4. OHS\nRequirements\n4.1 Wearing of personal protective instrument such as\n apron, goggles, gloves, safety shoes\n4.2 Disposal of wastes materials\n4.3 Workshop housekeeping\n5. Routine care\nand storage of\nmeasuring\ninstrument\n5.1 Periodic check up of micrometer with standard bars\n5.2 Storage in box separated from hand tools\n5.3 Proper handling\n5.4 Not to exposed to liquid such as water.\n\n--- PDF PAGE 61 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n59\n\nEVIDENCE GUIDE\n1. Critical aspects\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Measured components or section using correct\ninstrument.\n1.2Maintained measuring instrument.\n2. Underpinning\nknowledge and\nattitudes\n2.1 Personal and instrument safety requirements\n2.2 Measuring instrument types and their application\n2.3 Measuring procedures\n2.4 Measuring instrument graduation\n2.5 Measuring instrument maintenance procedures\n2.6 Positive Work values ( Perseverance, Patience,\n Honesty, Attention to Details)\n3. Underpinning\nskills\n3.1 Accessing, interpreting and applying technical\n information\n3.2 Using tools and instrument correctly and safely\n3.3 Maintain measuring instrument\n3.4 Using measuring instrument\n4 Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & instrument\n4.3 Materials relevant to the activity\n5 Method of\nassessment\nCompetency must be assessed through\n5.1 Demonstration of skills in measurement of length,\nsquareness, flatness, angles, roundness, depth,\nclearance or any measurements that can be taken from\nanalogue or digital devices.\n5.2 Written examination\n6 Context for\nassessment\n6.1 The assessment of practical skills must only take place\nafter a period of supervised practice and repetitive\nexperience in a safe working environment. If workplace\nconditions are not available, assessment in simulated\nworkplace conditions is acceptable.\n\n--- PDF PAGE 62 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n60\n\nUNIT OF COMPETENCY: ASSEMBLE ENGINES/CYLINDER HEADS, CHECK\n\n TOLERANCES AND CARRY OUT RELEVANT\n\n TESTING PROCEDURES\nUNIT CODE: ALT723333\n\nUNIT DESCRIPTOR:\nThis unit covers the knowledge skills and attitudes required\nto assemble engines and/or cylinder heads, check tolerances\nand carry out relevant testing procedures as part of a re-\nconditioning procedure.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variable\n(All standard of performance for Disassemble Engine\nSub-assemblies/Cylinder Heads And Evaluate\nComponents is in accordance with Company Standard Operating\nProcedure\nand\nManufacturer’s\nSpecification\nManuals\nusing\nspecified tools and equipment.)\n\n1. Use appropriate\n methods to check\n tolerances\n\n1.1 Tolerances are checked without causing damage to\n any workplace property, equipment or components.\n1.2 Correct tolerances are obtained using relevant\n engine/component manufacturer specifications.\n1.3 Tasks are carried out as per established\n industry guidelines.\n1.4 Final quality inspection procedure is performed.\n2. Assemble\n engines/cylinder\n head.\n\n2.1 Engine/cylinder head is assembled without causing\ndamage to any workplace property, equipment or\ncomponents.\n2.2 Assembly is carried out to comply with manufacturer\nspecifications and established industry guidelines.\n2.3 Checking procedure is done according to\nmanufacturer specification.\n3. Carry out relevant\n test procedures.\n3.1 Test procedures are completed without causing\ndamage to any workplace property, equipment or\ncomponents.\n3.2 Relevant test procedures are performed using industry\napproved procedures and equipment.\n3.3 Testing is carried out to comply with manufacturer\nspecifications\n\n--- PDF PAGE 63 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n61\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Engine\n1.1 Gasoline engine\n1.2 Diesel engine\n2. Engine Sub-\nAssemblies\nKinds of Engine and its sub-assemblies/Components\ninclude:\n2.1 Long engines and short engines,\n2.2 Cylinder heads\n2.3 Camshafts\n2.4 Cylinder blocks\n2.5 Idler shafts\n2.6 Chains\n2.7 Belts\n2.8 Pulleys\n2.9 Valve Train Mechanism\n.10 Engine pump\n3.Manual\nManufacturer Specification Manual\n3.1 Maintenance Procedure Manual\n3.2 Periodic Maintenance Data\n3.3 Service Manual\n3.4 Parts Checklist\n4.Company\nStandard Operating\nProcedure\n4.1 Job Order\n4.2 Requisition slip\n4.3Cancellation slip\n4.4 Additional job slip\n4.5 Letter of authority\n4.6 Insurance repair instruction\n4.7 Wearing of Personal Protective Equipment such as\n•\nGoggles, hand gloves, apron, safety shoes\n5.Tools and\nequipment\n5.1Hand tools, power tools\n5.2 Special equipment, measuring equipment, relevant\ntesting procedures, relevant tolerance checking methods,\nmeasuring equipment, lubricating equipment, gasket\nsealing materials\n\n--- PDF PAGE 64 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n62\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1 Interpreted and communicated operational information\n1.2 Measured and checked parts/components against\nmanufacturer specifications\n1.3 Assembled and conducted testing procedures\n1.4Observed safe working practices\n2. Underpinning\nknowledge and\nattitudes\n2.1 Personal safety requirements\n2.2 Construction and operation relevant to application\n2.3 Relevant assembling methods\n2.4 Measuring and testing procedures\n2.5 Equipment safety requirements\n2.6 Tensioning procedures\n2.7 Torquing procedure\n2.8 Relevant company policies\n2.9 Manual handling technique\n2.10Engine operating principles\n2.11 Positive Work values ( Perseverance, Patience,\nHonesty, Attention to Details)\n3. Underpinning\nskills\n3.1 Handling of Components and sub-assemblies parts\n3.2 Checking of tolerances\n3.3 Using Testing equipment and tools\n3.4Conducting tests procedures\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3 Materials relevant to the activity\n5. Method of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation while the tasks are being performed\n5.2 Questions/Interview related to the Underpinning skills\n5.3 Assessment of underpinning knowledge and practical\nskills may be combined.\n6. Context for\nassessment\n6.1 Competency elements must be assessed on the job or\n simulated environment.\n6.2 The assessment of practical skills must take place after a\n period of supervised practice and repetitive experience.\n\n--- PDF PAGE 65 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n63\n\nUNIT OF COMPETENCY: ASSEMBLE ENGINE BLOCK AND SUB-\nASSEMBLIES, CHECK TOLERANCES AND CARRY\nOUT RELEVANT TESTING PROCEDURES\n\nUNIT CODE: ALT723334\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes required to\nassemble engine block and sub-assemblies, check tolerances,\nfit cylinder head(s) and carry out relevant testing and\nadjustment procedures as part of a re-conditioning procedure.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.Use appropriate\nmethods to check\ntolerances\n1.1 Tolerances are checked without causing damage to any\ncomponent or system\n1.2 Tolerances are checked based on industry approved\nprocedures/methods, equipment and tools and\nmaterials\n1.3 Correct tolerances are obtained using relevant\nengine/component manufacturer specifications\n1.4 Tasks are carried out to comply within established\nindustry guidelines\n1.5 All checking activities are carried out according to\nindustry regulations/guidelines, occupational health\nand safety (OHS) and company policies.\n2. Assemble engine\nblock and sub-\nassemblies/fit\ncylinder head(s)\n\n2.1 Engine block and sub-assemblies are assembled and\ncylinder head(s) are fitted without causing damage to\nany component or system\n2.2 Assembly and fitting is carried out to comply with\nmanufacturer specification and established industry\nguidelines and operating procedure\n2.3 All assembly and fitting activities are carried out\naccording to industry regulations/guidelines, OHS, and\nindustry policies.\n2.4 Inspection of new parts quality, condition, fittings are\ndone as per company standard operating procedures.\n3. Carry out relevant\ntesting and\nadjustment\nprocedures\n3.1 Test and adjustments are completed without causing\n damage to any component or system.\n3.2 Testing and adjustment is carried out to comply with\nmanufacturer’s specifications, established industry\nguidelines and standard.\n3.3 Testing and adjusting of tightening torque is carried out\nand confirmed by the supervisor.\n\n--- PDF PAGE 66 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n64\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Engine\n1.1 Gasoline 1.2 Diesel\n2. Components or System\nIncludes:\nShort engine , various engine components such as\n2.1 Crankshafts\n2.2 Camshaft\n2.3 Cylinder blocks\n2.4 Idler shaft\n2.5 Pistons\n2.6 Connecting rods\n2.7 Bearings\n2.8 Rings\n2.9 Cylinder head assemblies\n2.10 Gears\n2.11 Chains\n2.12 Belts\n2.13 Pulleys\n2.14 Oil pumps\n2.15 Short/long motors\n (cylinder head fitting)\n2.16 Auxiliary-engine valve\nrailings and tensioner\n3. Methods\nMethods applied under normal operating condition\nincludes:\n3.1 Tolerance checking procedure\n3.2 Assembly/repair procedure\n3.3 Tensioning procedures\n3.4 Visual checking\n3.5\nUse of tools and equipment\n4. Tools/Equipment and\nSupplies and Materials\n4.1 Handtools\n4.2 Power Tools\n4.3 Special equipment\n4.4 Measuring instrument/tools/materials\n• Steel rule\n• Vernier caliper\n• Micrometer caliper\n• Gages (thread, drill, surface finish, radius,\n• Screw pitch, taper, feeler gage)\n• Plastigauge\n4.5 Relevant testing equipment\n4.6 Personal protective equipment\n4.7 Lubricating equipment\n4.8 Gasket sealing materials\n5. Occupational Health\nand Safety (OHS)\n5.1 Use of Personal Protective Equipment\n• Safety shoes\n• Face Shields/safety goggles\n• Gloves\n• Apron\n• Dust mask\n5.2 Safe Handling of\n• Equipment\n• Tools\n• Materials\n4.3 Implementation of 5S\n\n--- PDF PAGE 67 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGIN