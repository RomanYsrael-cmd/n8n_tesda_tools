        "source_title": "ASSEMBLE ENGINES/CYLINDER HEADS, CHECK TOLERANCES AND CARRY OUT RELEVANT TESTING PROCEDURES",
        "source_text": "--- PDF PAGE 62 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n60\n \nUNIT OF COMPETENCY:  ASSEMBLE ENGINES/CYLINDER HEADS, CHECK  \n         \n      TOLERANCES AND CARRY OUT RELEVANT   \n   \n      TESTING PROCEDURES \nUNIT CODE: ALT723333 \n \nUNIT DESCRIPTOR: \nThis unit covers the knowledge skills and attitudes required \nto assemble engines and/or cylinder heads, check tolerances \nand carry out relevant testing procedures as part of a re-\nconditioning procedure. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variable \n(All standard of performance for Disassemble Engine   \nSub-assemblies/Cylinder Heads And Evaluate  \nComponents is in accordance with Company Standard Operating \nProcedure \nand \nManufacturer’s \nSpecification \nManuals \nusing \nspecified tools and equipment.)\n \n \n1. Use appropriate    \n      methods to check  \n      tolerances \n \n1.1 Tolerances are checked without causing damage to  \n       any workplace property, equipment or components. \n1.2 Correct tolerances are obtained using relevant  \n       engine/component manufacturer specifications. \n1.3 Tasks are carried out as per established  \n      industry guidelines. \n1.4 Final quality inspection procedure is performed.\n2. Assemble  \n     engines/cylinder  \n     head. \n \n \n2.1 Engine/cylinder head is assembled without causing \ndamage to any workplace property, equipment or \ncomponents. \n2.2 Assembly is carried out to comply with manufacturer \nspecifications and established industry guidelines. \n2.3  Checking procedure is done according to \nmanufacturer specification.\n3. Carry out relevant  \n      test procedures. \n3.1 Test procedures are completed without causing \ndamage to any workplace property, equipment or \ncomponents. \n3.2 Relevant test procedures are performed using industry \napproved procedures and equipment. \n3.3 Testing is carried out to comply with manufacturer \nspecifications\n\n--- PDF PAGE 63 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n61\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Engine \n1.1 Gasoline engine \n1.2 Diesel engine\n2. Engine Sub-      \nAssemblies \nKinds of Engine and  its sub-assemblies/Components \ninclude: \n2.1  Long engines and short engines,  \n2.2  Cylinder heads \n2.3  Camshafts \n2.4  Cylinder blocks \n2.5  Idler shafts \n2.6  Chains \n2.7  Belts \n2.8  Pulleys \n2.9  Valve Train Mechanism \n.10 Engine pump\n3.Manual \nManufacturer Specification Manual \n3.1 Maintenance Procedure Manual \n3.2 Periodic Maintenance Data \n3.3 Service Manual \n3.4 Parts Checklist\n4.Company \nStandard Operating \nProcedure \n4.1 Job Order \n4.2 Requisition slip \n4.3Cancellation slip \n4.4 Additional job slip \n4.5 Letter of authority \n4.6 Insurance repair instruction \n4.7 Wearing of Personal Protective Equipment such as \n\nGoggles, hand gloves, apron, safety shoes\n5.Tools and \nequipment  \n5.1Hand tools, power tools \n5.2 Special equipment, measuring equipment, relevant \ntesting procedures, relevant tolerance checking methods, \nmeasuring equipment, lubricating equipment, gasket \nsealing materials\n\n--- PDF PAGE 64 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n62\n \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Interpreted and communicated operational information \n1.2 Measured and checked parts/components against \nmanufacturer specifications \n1.3 Assembled and conducted testing procedures \n1.4Observed safe working practices\n2. Underpinning \nknowledge and \nattitudes \n2.1 Personal safety requirements        \n2.2 Construction and operation relevant to application \n2.3 Relevant assembling methods \n2.4 Measuring and testing procedures \n2.5 Equipment safety requirements \n2.6 Tensioning procedures \n2.7 Torquing procedure \n2.8 Relevant company policies \n2.9 Manual handling technique \n2.10Engine operating principles \n2.11 Positive Work values ( Perseverance, Patience, \nHonesty, Attention to Details)\n3. Underpinning \nskills \n3.1 Handling of Components and sub-assemblies parts \n3.2 Checking of tolerances \n3.3 Using Testing equipment and  tools \n3.4Conducting tests procedures\n4. Resource \nimplications \nThe following resources must be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate Tools & equipment \n4.3 Materials relevant to the activity \n5. Method of \nassessment \nCompetency must be assessed through: \n5.1 Direct observation while the tasks are being performed  \n5.2 Questions/Interview related to the Underpinning skills \n5.3 Assessment of underpinning knowledge and practical \nskills may be combined.\n6. Context for \nassessment \n6.1 Competency elements must be assessed on the job or  \n      simulated environment. \n6.2 The assessment of practical skills must take place after a \n      period of supervised practice and repetitive experience.\n",
