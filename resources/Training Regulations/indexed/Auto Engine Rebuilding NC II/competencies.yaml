        "source_text": "ALT723201\n\nUNIT DESCRIPTOR: This competency unit covers the selection and application of\nsealant/adhesives.\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Identify appropriate\nSealant/adhesive\n\n1.1Sealant/adhesive selected in line with job\nrequirements and manufacturer’s specification\n1.2 Sealant/adhesive checking is performed to ensure\nthat product is fit for use.\n2. Prepare surface for\nSealant/adhesive\n2.1 Surface materials are identified as per construction\n2.2 Surface is cleaned and free of moisture, dust and\nother foreign matters to ensure maximum adhesion\nor seal.\n\n3. Apply\nsealant/adhesive\n evenly\n3.1 Sealant/adhesive is applied evenly on the surface in\nline with manufacturer’s specification\n3.2 Excess sealant/adhesive is removed by sanding or\n scrapping\n3.3Tools and equipment used to apply\nsealant/adhesive are appropriate to job\nrequirements\n3.4 Safety are observed and PPE are worn in\naccordance with industry SOP\n3.5 Hazards associated with the use of sealant and\nadhesives are identified.\n4. Store/Dispose of\nsealant/adhesive\n4.1 Sealant/adhesive are stored as per prescribed\nprocedure\n4.2 Waste are disposed as per workshop SOP\n\n--- PDF PAGE 29 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n27\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n\n1. Sealant/Adhesive\nSealant/adhesive includes:\n1.1Form in Place Gasket (FIPG)\n1.2 Ribbon Sealer\n1.3Hametite\n1.4Silicon Body sealer\n1.5 Prestite for Auto and Auto Aircon\n\n2. Tools and equipment\nTools and equipment include:\n2.1 Putty knife\n2.2 Scraper\n2.3 Compressor\n2.4 Steel brush\n2.5 Paint brush\n2.6 Rubber hammer\n2.7 Hand tools\nPersonal protective equipment include:\n2.8 Gloves\n2.9 Apron\n2.10 Safety shoes\n2.11Goggles\n2.12Gas mask\n\n3. Safety\nSafety includes:\n3.1 Ventilation\n3.2 Handling of Flammable/Irritating substances\n3.3 Use of Personal Protective Equipment\n\n4. Hazards\n Hazard includes:\n4.1 Fumes\n4.2 Skin irritation\n4.3 Burns\n\n5.Adhesive/Sealant\n checking\n\nAdhesive/Sealant checking includes:\n5.1 Expiry date\n5.2 Free of contamination\n6.1 Cap/Covers\n6.2 Tightly closed\n6.3 Concentration\n\n--- PDF PAGE 30 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n28\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Identified appropriate sealant/adhesives\n1.2 Prepared surface for sealant/adhesive\n1.3 Applied sealant/adhesive\n1.4 Stored unused or dispose of used sealant/adhesive\n\n2. Underpinning\nknowledge and\nattitude\n2.1 OH & S regulations\n2.2 Safe handling of sealant/adhesive\n2.3 Industry code of practice\n2.3 Procedures in sealant/adhesive application\n2.4 Procedures in interpreting manuals\n\n3. Underpinning skills\n3.1 Handling sealant/adhesive\n3.2 Applying sealant/adhesive\n3.3.Sanding the surface\n3.4 Use of tools, equipment\n3.5 Mixing of body filler and epoxy base and hardener\n\n4. Resource\n implication\nThe following resources must be provided:\n4.1 Materials relevant to the activity\n4.2 Appropriate tools and equipment\n4.3 Real or simulated workplace\n5. Methods of\n assessment\n\nCompetency must be assessed through\n5.1 Observation with questioning\n5.2 Interview related to:\n• Safe and correct use of tools and equipment\n•Application of adhesive/sealant\n\n7. Context for\n assessment\n\n6.1 Competency elements must be assessed in a safe\n working environment\n6.2 Assessment may be done in a workplace or\nsimulated environment\n\nUNIT OF COMPETENCY: USE AND APPLY LUBRICANTS/COOLANT\n\n--- PDF PAGE 31 ---\n__________________________________________________________________________________________________________