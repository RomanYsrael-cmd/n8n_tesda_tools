        "evidence_guide": {
          "source_text": "1. Critical aspects\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Measured components or section using correct\ninstrument.\n1.2Maintained measuring instrument.\n2. Underpinning\nknowledge and\nattitudes\n2.1 Personal and instrument safety requirements\n2.2 Measuring instrument types and their application\n2.3 Measuring procedures\n2.4 Measuring instrument graduation\n2.5 Measuring instrument maintenance procedures\n2.6 Positive Work values ( Perseverance, Patience,\n Honesty, Attention to Details)\n3. Underpinning\nskills\n3.1 Accessing, interpreting and applying technical\n information\n3.2 Using tools and instrument correctly and safely\n3.3 Maintain measuring instrument\n3.4 Using measuring instrument\n4 Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & instrument\n4.3 Materials relevant to the activity\n5 Method of\nassessment\nCompetency must be assessed through\n5.1 Demonstration of skills in measurement of length,\nsquareness, flatness, angles, roundness, depth,\nclearance or any measurements that can be taken from\nanalogue or digital devices.\n5.2 Written examination\n6 Context for\nassessment\n6.1 The assessment of practical skills must only take place\nafter a period of supervised practice and repetitive\nexperience in a safe working environment. If workplace\nconditions are not available, assessment in simulated\nworkplace conditions is acceptable.\n\n--- PDF PAGE 62 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n60\n\nUNIT OF COMPETENCY: ASSEMBLE ENGINES/CYLINDER HEADS, CHECK\n\n TOLERANCES AND CARRY OUT RELEVANT\n\n TESTING PROCEDURES\nUNIT CODE:"
        },
        "source_text": "ALT821303\n\nUNIT DESCRIPTOR: This unit identifies the competence required to measure\ncomponents or sections using non-specialist instrument and\nmaintain the measuring instrument.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Measure\ndimensions or\nvariables using\nappropriate\ninstrument\n\n1.1 Measurement of dimensions and variables are\ncompleted without causing damage to any instrument\nor components\n1.2 Appropriate measuring instrument is selected\n1.3 Relevant measuring techniques are used and results\nappropriately recorded\n1.4 All measuring activities are carried out according to\nindustry regulations/guidelines OHS & requirements\nand enterprise/procedures policies\n\n2. Maintain\nmeasuring\ninstrument\n2.1 Maintenance of measuring instrument is achieved\nwithout causing damage to any instrument or\ncomponent\n2.2 Routine care and storage of measuring instrument\nis undertaken according to manufacture specifications\n2.3 Checking and calibrating of measuring devices is done\nprior to use.\n2.4 All maintenance activities of measuring instruments are\ncarried out according to industry regulations/guidelines\nOHS legislation, and enterprise procedures policies\n\n--- PDF PAGE 60 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n58\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Dimension and\nVariables\nMeasurement\n1.1 Cylinder bore\n• Taper\n• Out of round\n1.2 Crankshaft journal (roundness, straightness, alignment)\n• Out of round\n• Taper\n• Straightness\n• Alignment\n1.3 Cylinder Head\n• Warpage\n• Thickness\n1.4 Valve depth\n1.5 Camshaft\n• cam lobe height\n• straightness\n1.6 Cylinder Block (Aluminum)\n• Warpage\n2. Measuring\ninstrument and\ntools\n2.1 Handtools\n2.2 Bore gage\n2.3 Depth gage\n2.4 Vernier Caliper\n2.5 Micrometer\n2.6 Dial Gage\n2.7 Straight edge\n2.8 Feeler gage\n2.9 Inside Caliper\n2.10 T-squares,\n2.11 Flat edges,\n2.12 Dividers\n2.13 Protractors)\n3. Measuring\ntechnique\n3.1 correct usage of the above mentioned measuring\n instrument and tools.\n3.2 Out of round or ovality\n3.3 Cylindricity or taper conicity\n4. OHS\nRequirements\n4.1 Wearing of personal protective instrument such as\n apron, goggles, gloves, safety shoes\n4.2 Disposal of wastes materials\n4.3 Workshop housekeeping\n5. Routine care\nand storage of\nmeasuring\ninstrument\n5.1 Periodic check up of micrometer with standard bars\n5.2 Storage in box separated from hand tools\n5.3 Proper handling\n5.4 Not to exposed to liquid such as water.\n\n--- PDF PAGE 61 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n59\n\nEVIDENCE GUIDE\n1. Critical aspects\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Measured components or section using correct\ninstrument.\n1.2Maintained measuring instrument.\n2. Underpinning\nknowledge and\nattitudes\n2.1 Personal and instrument safety requirements\n2.2 Measuring instrument types and their application\n2.3 Measuring procedures\n2.4 Measuring instrument graduation\n2.5 Measuring instrument maintenance procedures\n2.6 Positive Work values ( Perseverance, Patience,\n Honesty, Attention to Details)\n3. Underpinning\nskills\n3.1 Accessing, interpreting and applying technical\n information\n3.2 Using tools and instrument correctly and safely\n3.3 Maintain measuring instrument\n3.4 Using measuring instrument\n4 Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & instrument\n4.3 Materials relevant to the activity\n5 Method of\nassessment\nCompetency must be assessed through\n5.1 Demonstration of skills in measurement of length,\nsquareness, flatness, angles, roundness, depth,\nclearance or any measurements that can be taken from\nanalogue or digital devices.\n5.2 Written examination\n6 Context for\nassessment\n6.1 The assessment of practical skills must only take place\nafter a period of supervised practice and repetitive\nexperience in a safe working environment. If workplace\nconditions are not available, assessment in simulated\nworkplace conditions is acceptable.\n\n--- PDF PAGE 62 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n60\n\nUNIT OF COMPETENCY: ASSEMBLE ENGINES/CYLINDER HEADS, CHECK\n\n TOLERANCES AND CARRY OUT RELEVANT\n\n TESTING PROCEDURES\nUNIT CODE:"
