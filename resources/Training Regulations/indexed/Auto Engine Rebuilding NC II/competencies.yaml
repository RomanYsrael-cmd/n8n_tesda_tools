        "source_title": "INSPECT ENGINE COMPONENTS AND DETERMINE PREFERRED REPAIR ACTION",
        "source_text": "--- PDF PAGE 49 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n47\nUNIT OF COMPETENCY: INSPECT ENGINE COMPONENTS AND DETERMINE \nPREFERRED REPAIR ACTION \nUNIT CODE: ALT723332  \n \nUNIT DESCRIPTOR: This unit identifies the competency required to carry out an \ninspection of engine components and decide on the most \nappropriate repair/replacement methods. \n    ELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n(All inspections methods are carried out according to industry \nregulations/guidelines, occupational health and safety and company \nprocedures)\n1.Conduct visual \ninspection of \nengine \ncomponents to \ndetermine defects \n1.1 Information is accessed from appropriate sources to \ngain knowledge of the fault. \n1.2 Vehicle components are isolated/disassembled to \npermit an accurate inspection for defects. \n1.3 Inspection method for engine components is \nconducted as per procedure. \n2. Lift and move \nmaterials/ \ncomponents/parts \n2.1 Lift and move work is completed without causing \ndamage to any component or system \n2.2 Materials weight is determined correctly utilizing most \nappropriate techniques \n2.3 Appropriate tools and equipment are selected and \nused when required \n2.4 Items to be lifted up are checked for hazardous  \n       implications \n2.5 Lifting techniques are undertaken wherein types of \nmovement, methods, storage, heights and position are \nconsidered \n2.6 Parts/components/materials are placed safely on \nmoving equipment and relocated ensuring safety of \npersonnel and security of parts/components/materials. \n2.7 All activities are carried out in accordance with industry \nstandards/guidelines, occupational health and safety \nand company policies.\n\n--- PDF PAGE 50 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n48\n3. Carry out \ndiagnostic \nprocedures \n \n3.1 Information and assistance (if necessary) is accessed \nfrom appropriate sources in distinguishing between \n“symptoms” and “causes”. \n3.2 Permission to partly disassemble components is \nobtained, to accurately inspect and diagnose defects. \n3.3 A diagnosis strategy is developed that can be used to \ndetermine a fault within the engine component. \n3.4 Identification of defects and needed repairs are  made \nfrom test results using appropriate tools and equipment \nand a plan of action is decided upon to rectify defects \n3.5 All inspections are carried out in accordance to industry \nregulations/guidelines, occupational health and safety, \nand company policies\n4. Prepare written  \n    repair quotations \n4.1 Quotation is prepared accurately on approved format. \n4.2 Repair quotation is prepared is prepared accurately as \nper enterprise-approved format \n4.4 Customer is consulted as per standard operating \nprocedures. \n4.5 Approval to complete repairs is sought as per standard \noperating procedures \n4.6 Quotation is filed as per standard operating procedures.\n\n--- PDF PAGE 51 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n49\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Inspection Methods \n1.1 Actual \n1.2 Visual \n1.3 Operational assessment\n \n2.   Lift and Move work \n \n2.1 Manual lifting and moving using hand operated \nequipment \n2.2 Consideration on hazard implications (eg. \nChemical, liquids, gases)\n3.   Occupational Health \nand Safety \nprocedures \n3.1 Use of Personal Protective Equipment \n \nSafety shoes \n \nFace Shields/safety goggles \n \nGloves \n \nApron \n \nDust Mask or with Filter Diaphragm \n3.2 Safe Handling of  \n \nEquipment \n \nTools \n \nMaterials\n4. Tools and equipment \n \n4.1 Hand tools, power tools,  \n4.2 Special equipment/tools \n4.3 Measuring equipment (straight edge, caliper, feeler \ngage, micrometer, Vernier caliper, inside caliper \ndial gage) \n4.4 Lifting equipment (Jack, Hoist) \n4.5 Testing equipment (Probing tools, multitester, \nVOM)  \n4.6 Cleaning equipment (Degreaser, Pressurized water \n4.7Crack testing ( Magnaflux powder, chemical spray, \nkerosene)\n5. Repair quotation \nRepair quotation include \n5.1 light \n5.2 power \n5.3 rental \n5.4 taxes \n5.5 communication \n5.6 stationery \n5.7 charges \n5.8 Government charges\noverhead such as \n5.9 security \n5.10 professional \nassociation fee \n5.11 wage \n5.12 work schedule \n5.13 fuel \n5.14 materials \n5.15 spare parts\n\n--- PDF PAGE 52 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n50\nEVIDENCE GUIDE \n1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate:   \n1.1 Located the defects without damage or injury to tools, \nequipment or personnel \n1.2 Lifted, moved and handled components or parts as per \ncompany procedure \n1.3 Conducted appropriate testing and diagnosing to \naccurately find defects. \n1.4 Prepared quotation and recommended the appropriate \nrepair action\n2. Underpinning \nknowledge and \nattitude  \n2.1 Equipment safety requirements \n2.2 Correct manual handling technique/safe lifting and moving \nprocedures \n2.3 Diagnostic procedures and problem solving \n2.4 Safety requirements \n2.5 Written communication and report writing \n2.6 Oral communication\n3. Underpinning \nskills \n3.1 Preparing customer reports \n3.2 Maintaining relevant records \n3.3 Preparing/ presenting repair quotations \n3.4 Using diagnostic tools/ chart and equipment \n3.5 Exchanging technical ideas \n3.6 Applying mathematical ideas to inspection process of  \nengine system and components \n3.7 Exchanging information with customers and \nrecommending repair actions\n4. Resource \nimplications \nThe following resources must be provided \n4.1 Tools, equipment and facilities appropriate to processes or \nactivities \n4.2 Materials relevant to the proposed activity\n5. Method of \nassessment \nCompetency must be assessed through: \n5.1 Direct observation  \n5.2 Written or oral (short-answer) questions \n5.3 Practical exercises.  \n5.4 Portfolio assessment\n6. Context for \nassessment \n6.1 Competency may be assessed in the workplace or in  \nsimulated workplace environment \n6.2 The underpinning knowledge and skills may be assessed \non or off-the-job. \n6.3 The prescribed outcome must be achieved without direct \nsupervision.\n",
