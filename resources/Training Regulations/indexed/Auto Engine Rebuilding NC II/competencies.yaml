        "source_title": "SET, OPERATE AND MONITOR SPECIALIZED MACHINES",
        "source_text": "--- PDF PAGE 56 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n54\n \nUNIT OF COMPETENCY: SET, OPERATE AND MONITOR SPECIALIZED  \n \n     MACHINES \n \nUNIT CODE: ALT821302 \n \nUNIT DESCRIPTOR: \nThis unit identifies the competence required to set, \noperate and monitor specialized machines used in \nreconditioning engine and/or vehicle components \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n \n1. Set machines \n \n1.1 Machines are set without causing damage to any \ncomponent or system \n1.2 Correct information is accessed and interpreted from \nappropriate manufacturer specifications \n1.3 Components are measured and repair action \ndetermined \n1.4 Components is positioned and clamped \n1.5 Machine is set in accordance with defined procedures\n1.6 Machine is adjusted to meet operational \nrequirements and specifications using appropriate \nmeasuring equipment \n1.7Tools and accessories are selected according to job   \nspecifications \n1.8 Worn-out or damaged tool is identified and \nchanged/sharpened \n1.9 All setting activities are carried out according to \nindustry regulations/guidelines, OHS requirements \nand enterprise procedures/policies\n \n2. Operate and \nmonitor machine \n2.1 Machine is operated and monitored without damage \nto any component or system \n2.2 Correct information is accessed and interpreted from \nappropriate manufacturer specifications \n2.3 Machine is operated in accordance with enterprise \nprocedures \n2.4 Components are checked with appropriate \ninstruments to ensure compliance to specifications \n2.5 Sharpness of tools is monitored and tools are \nsharpened or replaced to meet requirements when \nnecessary \n2.6 Finished products is checked for alignment, tolerance \nand finish \n2.7 All machining operations are carried out according \nto industry regulations/guidelines, OHS, and \nenterprise procedures/policies\n\n--- PDF PAGE 57 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n55\nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Machine \n1.1 Build Up Machine \n1.2 Straightening Machine  \n1.3 Line Boring \n1.5 Crankshaft Grinding \n1.6  Balancing Machine \n1.7  Connecting Rod Balancer \n1.8  Valve Replacer \n1.9 Reboring/Honing\n2. Tools and \naccessories \n \n2.1 Measuring equipment \n2.2 Relevant safety equipment, hand tools, power/air tools, \nlathe,  milling machines, line borers, pin fitting machines, \nprecision grinders, lifting equipment, cleaning equipment\n3. OHS \nRequirements \n3.1 Industry Occupational Health &Safety includes: \n3.2 Wearing of personal protective equipment such as  \n      apron, goggles, gloves, safety shoes \n3.3 Disposal of wastes materials \n3.4 Workshop housekeeping\n4. Instrument \n4.1 Bore Gage\n4.2 Dial Gage \n4.3 Feeler Gage \n4.4Inside Caliper\n5. Machining \noperation \n \n5.1 Reboring/Honing Operation \n5.2  Line Boring Operation \n5.3  Crankshaft Grinding \n5.4  Valve seat Grinding \n5.5  Camshaft Grinding \n5.6  Engine Balancing \n5.7 Connecting Rod and Piston Balancing \n5.8 Valve Replacer\n\n--- PDF PAGE 58 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n56\n \nEVIDENCE GUIDE \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate \n1.1 Performed machining of components without damage or injury \nto tools, equipment and personnel \n1.2 Performed machining of components to specified tolerances \nand finishes following enterprise procedures \n2. Underpinning \nknowledge and \nattitudes \n2.1The necessary cleaning/lubricating agents \n2.2 Relevant technical information including technical drawings \n2.3 Equipment safety  requirements \n2.4 Machining methods \n2.5 Industry codes of Practice \n2.6 Pool sharpening methods \n2.7 Personal safety requirements \n2.8 Manual handling techniques \n2.9 Positive Work values ( Perseverance, Patience, Honesty,      \n     Attention to Details)\n3. Underpinning \nskills \n3.1 Access and interpret technical information \n3.2 Use relevant tools/equipment \n3.3 Carry out machining processes \n3.4 Sharpening machining tools \n3.5 Setting the machines \n3.6 Apply manual handling techniques \n3.7 Use of personal protective equipment \n3.8 Monitoring machining processes\n4. Resource \nimplications \nThe following resources must be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate Tools & equipment \n4.3 Materials relevant to the activity \n5. Method of \nassessment \nCompetency must be assessed through \n5.1 Demonstration of skills in measuring equipment, relevant \nsafety equipment, handtools, power/air tools, lathes, milling \nmachines, line borers, pin fitting machines, precision grinders, \nlifting equipment, cleaning equipment \n5.2Written/Oral examination\n6. Context for \nassessment \n6.1 The assessment of practical skills must only take place after a \nperiod of supervised practice and repetitive experience in \nsafe working environment. If workplace conditions are not \navailable, assessment in simulated workplace conditions is \nacceptable.\n",
