          "source_text": "1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Performed turning and/or grinding and/or cutting\n operations.\n1.2 Reconditioned automotive components to restore surface\n1.3 Finishes, working clearances and component alignment\n1.4 Components are machined without damage to tools,\n equipment and personnel\n1.5 Components are machined to tolerances following\nmanufacturer specification\n2. Underpinning\nknowledge\nand attitudes\n2.1 Equipment safety requirements\n2.2 Machinery safety requirements\n2.3 Relevant methods of machining and/or cutting\n2.4 Measuring instruments, application and procedures\n2.5 Speed and feed ratios\n2.6 Personal safety requirements\n2.7 Positive Work values ( Perseverance, Patience, Honesty,\n Attention to Details)\n3 Underpinning\nskills\n3.1 Access, interpret and apply technical information\n3.2 Use relevant tools, equipment and machinery safely\n3.3 Use measuring equipment correctly\n3.4 Apply setting up procedures (relevant to application)\n3.5Apply machining procedures (relevant to application)\n4 Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3Materials relevant to the activity\n5 Method of\nassessment\nCompetency must be assessed through:\n5.1 Actual demonstration of skills in lathe turning, grinding,\ncutting, drilling.\n5.2Written examination\n6 Context for\nassessment\n6.1 The assessment of practical skills must only take place\nafter a period of supervised practice and repetitive\nexperience. If workplace conditions are not available,\nassessment in simulated workplace conditions is\nacceptable.\n\n--- PDF PAGE 56 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n54\n\nUNIT OF COMPETENCY: SET, OPERATE AND MONITOR SPECIALIZED\n\n MACHINES\n\nUNIT CODE:"
        },
        "source_text": "ALT821301\n\nUNIT DESCRIPTOR:\nThis unit identifies the competence required to set up and\nmachine components to specifications using lathe, drilling\nand cutting machines for all mechanical streams\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Set up\nmachinery prior\nto machining\n\n1.1 Machinery set up is completed without causing damage to\nany components, system, tools and equipment.\n1.2 Correct information is accessed and interpreted from\nappropriate manufacturer specifications\n1.3 Material to be machined is positioned and clamped\n1.4 Correct speed and feed is selected to suit materials\n1.5 Personal safety requirement including machine guards\nare worn and positioned\n1.6 Setting up of components including machine guards are\nworn and positioned\n1.7 All machinery set up activities are carried out according\nto industry regulations/guidelines, OHS and enterprise\npolicies\n2. Machine\ncomponents\n2.1 Components are machined without causing damage to\n any components or system\n2.2 Correct information is accessed and interpreted from\nappropriate manufacturer specifications\n2.3 Components are measured for size and finish\n2.4 Size and finish are compared with specifications\n2.5 Area is cleaned prior to removal from machine\n2.6 Machining/cutting of components is carried out in\naccordance with manufacturer current specifications for\nmethods, equipment used and tolerance relative to the\ncomponent being machined out/cut\n2.7 All machining/cutting activities are carried out according to\nindustry regulations/guidelines, OHS, and enterprise\nprocedures/policies.\n\n--- PDF PAGE 54 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n52\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Materials\n1.1 Cast iron\n1.2 Steel\n1.3 Bronze\n1.4 Plastic (polyurethane)\n2. Tools and\nequipment\n2.1 Handtools,\n2.2 Power hacksaw or cut off saw\n2.3 Lathe and tool bits\n2.4 Measuring equipment, lifting equipment\n2.5Drills and bits\n3. Personal\nsafety\nrequirements\n3.1 Wearing of personal protective devices such as Gloves,\nGoggles, Apron Safety shoes\n3.2 Housekeeping\n3.3Maintenance of tools and equipment\n4. Machinery set-\nup\n4.1 Clamping\n4.2 Positioning\n4.3 Centering\n4.4 Checking of speed\n4.5 Setting up\n4.6 Lubricating\n4.7 Checking of oil level\n4.8 Checking of angle of tool bit\n\n--- PDF PAGE 55 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n53\nEVIDENCE GUIDE\n1. Critical\naspects of\ncompetency\nAssessment requires evidence that the candidate\n1.1 Performed turning and/or grinding and/or cutting\n operations.\n1.2 Reconditioned automotive components to restore surface\n1.3 Finishes, working clearances and component alignment\n1.4 Components are machined without damage to tools,\n equipment and personnel\n1.5 Components are machined to tolerances following\nmanufacturer specification\n2. Underpinning\nknowledge\nand attitudes\n2.1 Equipment safety requirements\n2.2 Machinery safety requirements\n2.3 Relevant methods of machining and/or cutting\n2.4 Measuring instruments, application and procedures\n2.5 Speed and feed ratios\n2.6 Personal safety requirements\n2.7 Positive Work values ( Perseverance, Patience, Honesty,\n Attention to Details)\n3 Underpinning\nskills\n3.1 Access, interpret and apply technical information\n3.2 Use relevant tools, equipment and machinery safely\n3.3 Use measuring equipment correctly\n3.4 Apply setting up procedures (relevant to application)\n3.5Apply machining procedures (relevant to application)\n4 Resource\nimplications\nThe following resources must be provided:\n4.1 Workplace: Real or simulated work area\n4.2 Appropriate Tools & equipment\n4.3Materials relevant to the activity\n5 Method of\nassessment\nCompetency must be assessed through:\n5.1 Actual demonstration of skills in lathe turning, grinding,\ncutting, drilling.\n5.2Written examination\n6 Context for\nassessment\n6.1 The assessment of practical skills must only take place\nafter a period of supervised practice and repetitive\nexperience. If workplace conditions are not available,\nassessment in simulated workplace conditions is\nacceptable.\n\n--- PDF PAGE 56 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n54\n\nUNIT OF COMPETENCY: SET, OPERATE AND MONITOR SPECIALIZED\n\n MACHINES\n\nUNIT CODE:"
