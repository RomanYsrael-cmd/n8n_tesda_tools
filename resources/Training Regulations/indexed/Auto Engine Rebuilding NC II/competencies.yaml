        "source_title": "DISASSEMBLE ENGINE SUB-ASSEMBLIES/ CYLINDER HEADS AND CHECK COMPONENTS",
        "source_text": "--- PDF PAGE 43 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n41\n \nUNIT OF COMPETENCY:  DISASSEMBLE ENGINE SUB-ASSEMBLIES/ \n \n     CYLINDER HEADS AND CHECK COMPONENTS \nUNIT CODE: ALT723330 \n \nUNIT DESCRIPTOR: \nThis unit identifies the competence required to disassemble, \ninspect, check and determine preferred repair action for \nengines and/or cylinder heads as a part of a reconditioning \nprocedure. \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables\n1. Disassemble \nengine sub-\nassembly     \n/cylinder head \n \n1.1 Engine sub-assembly/cylinder head is disassembled \nwithout causing damage to any workplace property, \nequipment or components and in accordance to \ncompany standard operating procedures. \n1.2 Engine sub-assembly/cylinder head is disassembled \nusing approved methods and appropriate \ntools/equipment. \n1.3 Correct information is accessed and interpreted from \nappropriate manufacturer Manual specifications. \n1.4 Component parts are cleaned using appropriate tools \nequipment and materials in preparation for evaluation.\n2. Inspect engine \n     sub-assembly  /   \n    cylinder  \n    head components \nand determine \nrepair procedures.\n2.1 Inspection is completed without causing damage to any \nworkplace property, equipment or components. \n2.2 Correct information is accessed and interpreted from \nappropriate manufacturer specifications. \n2.3 Engine sub-assembly/cylinder head components are \nmeasured against manufacturer specifications and \ntolerances. \n2.4 Engine sub-assembly/cylinder head components are \nevaluated against the measurements, tests and \ninspections made. \n2.5 Repair procedures are reported for engine sub-\nassembly/cylinder head components. \n2.6 Actions performed and results achieved relative to this \ncompetency element are recorded and dealt with \naccording to company policies and procedures.\n\n--- PDF PAGE 44 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n42\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Engine \n1.1 Gasoline engine \n1.2 Diesel engine\n2. Engine Sub-\nAssemblies \nKinds of Engine and  its sub-assemblies/Components \ninclude: \n2.1 Cylinder heads \n2.2Camshafts \n2.3 Rocker Arm \n2.4Idler shafts \n2.5Timing Chains \n2.6Timing Belts \n2.7Pulleys \n2.8Valve Truing mechanism \n2.9  Engine pump\n3. Manual \n3.1 Maintenance Procedure Manual \n3.2 Periodic Maintenance Data \n3.4 Service Manual \n3.5 Parts Checklist\n4.Company      \nStandard \nOperating \nProcedure \n4.1 Job Order \n4.2 Requisition slip \n4.3 Wearing of Personal Protective Equipment such as Goggles, \nhand gloves, apron, safety shoes \n5. Tools, Equipment    \nand Supplies \n5.1 Hand tools, power tools,  \n5.2 Special tools/equipment \n5.3 Measuring equipment (straight edge, caliper, feeler gage, \nmicrometer, Vernier caliper, inside caliper dial gage) \n5.4 Lifting equipment (Jack, Hoist) \n5.5 Testing equipment (Probing tools, multitester, VOM)  \n5.6 Cleaning equipment (Degreaser, Pressurized water \n5.7Crack testing ( Megaflux powder, chemical spray, kerosene)\n\n--- PDF PAGE 45 ---\n________________________________________________________________________________________________________________ \nTR AUTO ENGINE REBUILDING NC II                                                                                                                Promulgated  December 2004\n \n           \n43\n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nAssessment requires evidence that the candidate: \n1.1 Disassembled engine sub-assembly/cylinder head  \n1.2 Disassembled and assessed the components without causing \ndamage or injury to tools, equipment and personnel \n1.3 Determined appropriate action for repair \n2. Underpinning \nknowledge and \nattitudes \n2.1 Dismantling methods \n2.2 Measuring and testing procedures \n2.3 Equipment safety requirements \n2.4 Relevant company policies \n2.5 Personal safety requirements \n2.6 Manual handling techniques \n2.7 Cleaning methods and materials \n2.8 Construction and Principles of operation of Engine \n2.9 Construction and operation relevant to application \n2.10 Positive Work values ( Perseverance, Patience, Honesty,  \n       Attention to Details)\n3. Underpinning \nskills \n3.1 Use of tools and equipment in disassembling engine \ncomponent \n3.2 Identifying defect/faults in an engine component \n3.3 Handling of parts and components \n3.4 Technique in disassembling component \n4. Resource \nimplications \nThe following resources must be provided: \n4.1 Workplace: Real or simulated work area \n4.2 Appropriate Tools & equipment \n4.3 Materials relevant to the activity \n5. Method of \nassessment \nCompetency must be assessed through: \n5.1 Direct observation while the tasks are being performed  \n5.2 Questions/Interview related to the Underpinning skills \n6. Context for \nassessment \n6.1 Competency must be assessed on the job or in a        \nsimulated environment. \n6.2 The assessment of practical skills must take place after a       \nperiod of supervised practice and repetitive experience.\n",
