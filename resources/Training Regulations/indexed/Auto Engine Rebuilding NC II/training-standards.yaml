  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for AUTO ENGINE REBUILDING NC II.\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: AUTO ENGINE REBUILDING\n\n NC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic Competencies)\n\n20 Hours (Common Competencies)\n120 Hours (Core Competencies)\nCourse Description:\n\nThis course is designed to equip individual with operational skills in automotive\nengine rebuilding which restores defective/worn-out engine parts back to\nmanufacturer’s specifications; performs the necessary inspections; mensuration, and\ninterpretation of blueprints and repair procedures; set up and operate variety of\nspecialized metal working machines and uses precision measuring instruments in\nrepairing automotive engine parts.\n\nThis course is also designed to provide basic and common skills to equip\nindividual with operational skills in automotive engine rebuilding.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\n meeting and discussion.\n•\nGroup\ndiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\n member.\n•\nDiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\n•\nDiscussion\n•\nInteraction\n\n•\nDemonstration\n•\nObservation\n•\nInterviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health\nand safety awareness\n•\nDiscussion\n•\nPlant tour\n•\nSymposium\n•\nObservation\n•\nInterview\n\n--- PDF PAGE 69 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n67\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply\nAppropriate\nSealant/\nAdhesive\n1.1. Identify appropriate\nsealant/ adhesive\n1.2. Prepare surface for\nsealant/ adhesive\napplication\n1.3. Store unused and\ndispose used\nsealant/adhesive\n• Lecture/\nDemonstration\n• Dual training\n• Self paced (modular)\n• Distance Learning\n\n• Written test\n• Oral questioning\n• Direct observation\n• Project method\n• Interview\n2. Move and\nPosition\nVehicle\n2.1. Prepare vehicle for\ndriving\n2.2. Move and position\nvehicle\n2.3. Check the vehicle\n•\nLecture/\nDemonstration\n•\nDual training\n•\nSelf paced (modular)\n•\nDistance Learning\n\n•\nWritten test\n•\nOral questioning\n•\nDirect\nobservation\n•\nProject method\n•\nInterview\n3. Perform\nMensuration\nand\nCalculation\n3.1. Select measuring\ninstrument and carry\nout measurement and\ncalculations.\n3.2. Maintain measuring\ninstruments\n• Lecture/\nDemonstration\n• Dual training\n• Self paced (modular)\n• Distance Learning\n\n• Written test\n• Oral questioning\n• Direct observation\n• Project method\n• Interview\n4. Read, Interpret\nand Apply\nSpecifications\nand Manual\n4.1. Identify/accessed\nmanuals and interpret\ndata and specification\n4.2 Apply information\naccessed in manual\n4.3 Store manual\n• Lecture/\nDemonstration\n• Dual training\n• Self paced (modular)\n• Distance Learning\n\n• Written test\n• Oral questioning\n• Direct observation\n• Project method\n• Interview\n5. Use and Apply\nLubricant/\nCoolant\n5.1. Identify type of\nlubricant/coolant\n5.2 Use and apply\nlubricant\n\n• Lecture/\nDemonstration\n• Dual training\n• Self paced (modular)\n• Distance Learning\n• Written test\n• Oral questioning\n• Direct observation\n• Project method\n• Interview\n6. Perform Shop\nMaintenance\n\n6.1 Inspect/clean tools and\nwork area\n6.2 Store/arrange tools and\nshop equipment\n6.3 Dispose wastes/used\nlubricants\n6.4 Report damaged\ntools/equipment\n\n• Lecture/\nDemonstration\n• Dual training\n• Self paced (modular)\n• Distance Learning\n\n• Written test\n• Oral questioning\n• Direct observation\n• Project method\n• Interview\n\n--- PDF PAGE 70 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n68\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Interpret\nTechnical\nManual\nSpecifications of\nEngine\nComponents\n1.1 Carry out blueprinting\nof components to\nmanufacturer’s\nspecifications\n•\nDemonstration\n•\nDiscussion\n\n•\nWritten\nexamination\n•\nDemonstration\nof practical\nskills\n•\nPractical Test\n2. Disassemble\nEngine Block\nand Sub-\nassemblies,\nCheck\nTolerances and\nComponents\n2.1 Dismantle engine block\nsub-assemblies\n2.2 Inspect/measure/ test\nengine block and sub-\nassembly components\nand determine repair\nprocedures\n•\nDemonstration\n•\nDiscussion\n\n•\nInterview\n•\nPractical test\n•\nDirect\nObservation\n3. Disassemble\nEngine Sub-\nassemblies/\nCylinder Heads\nand Check\nComponents\n3.1 Dismantle engine sub-\nassemblies/ cylinder\nhead\n3.2 Inspect engine sub-\nassembly/cylinder head\ncomponents and\ndetermine repair\nprocedures\n•\nDemonstration\n•\nDiscussion\n\n•\nDirect\nObservation\n•\nQuestioning\n•\nInterview\n•\nPractical test\n\n4. Carry-out Pre-\nrepair Operation\non Engine\nComponents\n4.1 Clean components\nprior to repairs or\nstorage\n4.3 Segregate, tag and\nstore components\n\n•\nDemonstration\n•\nDiscussion\n\n•\nPractical test\n5. Inspect Engine\nComponents\nand Determine\nPreferred\nRepair Action\n5.1 Conduct visual\ninspection of engine\ncomponents to\ndetermine defects\n5.2. Lift and move\nmaterials/\ncomponents/parts\n•\nDemonstration\n\n•\nDirect\nObservation\n•\nQuestioning\n•\nInterview\n•\nPractical test\n\n6. Carry-out\nMachining\nOperations\n6.1 Set-up machinery prior\nto machining\n6.2 Machine components\n•\nDemonstration\n\n•\nDirect\nObservation\n•\nQuestioning\n•\nInterview\n•\nPractical test\n\n7. Set, Operate\nand Monitor\nSpecialized\nMachines\n7.1\nSet machine\n•\nDemonstration\n\n•\nDirect\nObservation\n•\nQuestioning\n•\nInterview\n•\nPractical test\n\n--- PDF PAGE 71 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n69\n\n8. Use and\nMaintain\nMeasuring\nInstruments\n8.1 Measure dimensions or\nvariables using\nappropriate instruments\n8.2 Maintain measuring\ninstruments\n•\nDemonstration\n\n•\nDirect\nObservation\n•\nQuestioning\n•\nInterview\n•\nPractical test\n9. Assemble\nEngines/\nCylinder Heads,\nCheck\nTolerances and\nCarry Out\nRelevant\nTesting\nProcedures\n9.1 Use appropriate\nmethods to check\ntolerances\n9.2 Assemble engine/\ncylinder head\n9.3 Carry out relevant test\nprocedures\n•\nDemonstration\n•\nDirect\nObservation\n•\nQuestioning\n•\nInterview\n•\nPractical test\n\n10. Assemble\nEngine Block\nand Sub-\nAssemblies,\nCheck\nTolerances and\nCarry Out\nRelevant\nTesting\n10.1 Use appropriate\nmethods to check\ntolerances\n10.2\nAssemble engine\nblock and sub-\nassemblies/fit cylinder\nhead(s)\n10.3\nCarry out relevant\ntesting and adjustment\nprocedures\n\n•\nDemonstration\n•\nDirect\nObservation\n•\nQuestioning\n•\nInterview\n•\nPractical test\n\n--- PDF PAGE 72 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n70\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n The training is based on curriculum developed from the competency\nstandards;\n Learning is modular in its structure;\n Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n Training is based on work that must be performed;\n Training materials are directly related to the competency standards and\nthe curriculum modules;\n Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n Training is based on and off-the-job components;\n Allows for recognition of prior learning (RPL) or current competencies;\n Training allows for multiple entry and exit; and\n Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training\nor fieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study, or\naudio, video or computer technologies.\n Project-Based Instruction is an authentic instructional model or strategy\nin which students plan, implement and evaluate projects that have\nreal world applications.\n\n--- PDF PAGE 73 ---\n________________________________________________________________________________________________________________\nTR AUTO ENGINE REBUILDING NC II Promulgated December 2004\n\n71\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are\nalso stated. Passing entry written examinations may also be indicated if\nnecessary.\n\n• With good moral character;\n• Ability to communicate both oral and written; and\n• Physically and mentally fit\n\n 3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n AUTO ENGINE REBUILDING – NC II\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for Auto Engine Rebuilding – NC II\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n2 sets\n•\nBox wrench\n1 pc. •\nParts cleaning\ntank\n2\ncopies\n• SDS (Service\nData\nSpecification)\n2 sets\n•\nOpen end\nwrench\n1 pc. •\nHigh-pressure\ncleaner-heated\n2\ncopies\n• Service\nManual\n2 sets\n•\nSocket\nwrench\n1 pc. •\nWork bench -\n2000mm\n2\ncopies\n• Engineering\nDrawing\n2 pcs.\n•\nAdjustable\nwrench\n1 pc. •\nWork bench -\nsteel top\n2 sets\n• Overhauling\ngasket\n- Gas engine\n- Diesel engine\n2 sets\n•\nScrew driver\n(T-handle)\n1 pc. •\nEngine stand\n2 sets\n• Piston rings ( 1\nset )\n2 set