  "source_section_text": "SECTION 3 TRAINING STANDARDS\n\nSHIELDED METAL ARC WELDING (SMAW)\n\nThese guidelines are set to provide the Technical and Vocational Education\nand Training (TVET) providers with information and other important requirements to\nconsider when designing training programs for SMAW.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainers qualification,\namong others.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: SMAW\n\nNC Level: NC II\n\nNominal Training Duration: 18 hrs. ( Basic Competencies)\n\n 56 hrs. ( Common Competencies)\n\n 194 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes\nof SMAW Welder in accordance with industry standards. It covers competencies\nsuch as Setting-up Welding Equipment, Preparing Weld Materials, Fitting up Weld\nMaterials, Welding Carbon Steel Plates Using SMAW, Welding Carbon Steel Plates\nand Pipes Using SMAW and Repairing Welds.\n\nBASIC COMPETENCIES\n\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\n related documents.\n1.3 Participate in workplace\n meeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a\nteam\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\n member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice\ncareer\nprofessionalism\n3.1Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 50 ---\nWeldncii11-3\n01/04/05\n\n48\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n\n4.2 Control hazards and risks\n\n4.3 Maintain occupational health\n and safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nwork safely\n1.1 Identify hazardous areas and\nconditions\n1.2 Use protective clothing and\ndevices\n1.3 Perform safe handling of tools,\nequipment and materials\n1.4 Explain/perform first aid\nprocedure\n1.5 Use fire extinguisher\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n• Demonstration\n2. Contribute to\nquality\nsystem\n2.1 Inspect work done\n2.2 Apply quality standards to\nwork\n2.3 Protect company/ institution\nproperties\n2.4 Protect customer interest\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n• Demonstration\n3. Use hand\ntools\n3.1 Use different handtools\n3.2 Maintain handtools\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n•Demonstration\n4. Interpret\nBlueprints\n4.1 Interpret technical drawing.\n4.2 Interpret welding symbols\n\n• Lecturette\n\n• Practical\napplication\n• Oral\nquestioning\n• Written test\n\n5. Perform\n industry\ncalculations\n5.1 Solve mathematical problems\n5.2 Convert systems of\nmeasurement\n5.3 Measure workpiece\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n\n• Written test\n6. Prepare\nWeld\nMaterials\n6.1 Identify the different cutting\nequipment and accessories\n6.2 Identify types of mild steel\nelectrodes\n6.3 Identify types of joints and\nedge preparation\n6.4 Identify protective equipment\n• Lecturette\n• Practical\napplication\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 51 ---\nWeldncii11-3\n01/04/05\n\n49\n6.5 Prepare welding\nconsumables, tools and\naccessories\n6.6 Layout on materials\n6.7 Set-up cutting equipment\n6.8 Cut and prepare edge of\nmaterials\n7. Set-up\nWelding\nEquipment\n7.1 Explain welding principles and\nconcepts.\n7.2 Identify the parts of welding\nmachine\n7.3 Set up welding machine and\naccessories\n7.4 Set up welding positioners,\njigs and fixtures\n7.5 Set up pre-heating equipment\n(as required)\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n8. Fit up Weld\nMaterials\n8.1 Explain the importance of\nbacking plate and stiffener.\n8.2 Explain the methods of\nstriking an arc\n8.3 Perform striking an arc\n8.4 Tack weld specimen, backing\nplate and stiffener.\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n9. Repair\n Welds\n9.1 Identify causes and prevention\nof the different weld defects\n9.2 Mark/locate weld defects\n9.3 Prepare tools and equipment\n9.4 Remove defects\n9.5 Perform re-welding\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n•\n\n--- PDF PAGE 52 ---\nWeldncii11-3\n01/04/05\n\n50\nCORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Weld\nCarbon\nSteel\nPlates\nUsing\nSMAW\n1.1 Explain the essentials of\nwelding\n1.2 Deposit weld beads on\nplate\n1.3 Weld plates in single pass\nfillet joints in all positions\n1.4 Weld plates in multiple\npass fillet joints in all\npositions\n1.5 Weld plates in single pass\ngroove joints in flat,\nhorizontal and vertical\npositions\n1.6 Weld plates in multiple\npass groove joints in flat,\nhorizontal and vertical\npositions\n• Discussion\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n2.\nWeld\nCarbon\nSteel\nPlates\nand\nPipes\nUsing\nSMAW\n2.1 Weld plates in single pass\ngroove joints in overhead\npositions\n2.2 Weld plates in multiple\npass groove joints in\noverhead positions\n2.3 Weld pipe in 1G, 2G, 5G\nand 6G positions\n• Discussion\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n\n--- PDF PAGE 53 ---\nWeldncii11-3\n01/04/05\n\n51\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based\nTVET.\n\n•\nThe training is based on curriculum developed from the competency\nstandards;\n•\nLearning is modular in its structure;\n•\nTraining delivery is individualized and self-paced;\n•\nTraining is based on work that must be performed;\n•\nTraining materials are directly related to the competency standards and the\ncurriculum modules;\n•\nAssessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n•\nTraining is based both on and off-the-job components;\n•\nAllows for recognition of prior learning (RPL) or current competencies;\n•\nTraining allows for multiple entry and exit; and\n•\nApproved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of\ndelivery modes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n•\nThe dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n•\nModular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer just\nfacilitates the training delivery.\n•\nPeer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n•\nSupervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n•\nDistance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video\nor computer technologies.\n\n--- PDF PAGE 54 ---\nWeldncii11-3\n01/04/05\n\n52\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to gain entry into this course should possess\nthe following requirements:\n\n•\ncompleted training in SMAW NC I or a holder of SMAW NC I\n•\ncan communicate both oral and written\n•\nphysically and mentally fit\n•\ncan perform basic mathematical computation\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for SMAW NC II\n\nTOOLS\nEQUIPMENT\nMATERIAL\nQty.\nDescription\nQty.\nDescription\nQty.\nDescription\n12 pcs.\nChipping\nHammer\n8 units\nArc Welding\nmachine AC/DC\nand accessories\n6 boxes\nElectrode\n3.2mm E6011\n12 pcs.\nSteel brush\n8 pcs.\nWelding\ntable/positioners\n6 boxes\nElectrode\n3.2mm\nE7018/6013\n8 pcs.\nBallpeen\nHammer\n1 unit\nElectrode oven\n\n20 pcs.\nMild steel plate\n10mm X 150mm\nX 6m\n12 pcs.\nPlier/tong\n1 unit\nAutomatic gas\ncutting machine\n20 pcs.\nMild steel plate\n3.2mm X\n150mm X 6m\n10 pcs. Files-bastard\ncut\n5 units\nPortable disc\ngrinder\n2 pcs.\n\nCarbon steel\npipe, schedule\n40 dia. 150 X\n3m\n12 pcs.\nHead\nshield/helmet\n1 unit\nExhaust fan\n20 pcs.\nFilter lens\n12 sets\nLeather\napron/jacket\n1 unit\nPower hacksaw\n20 pcs.\nLens clear glass\n12 sets Leather glove,\nlong\n2 units\nAnvil\n20 pcs\nCut off disc\n6mm X 15mm X\n100mm\n2 pcs.\nSafety goggle,\nwide vision,\nclear\n2 units\nWork bench w/\nbench vice on 4\ncorners\n5 pcs.\nPower saw\nblade\n2 pcs.\nOxy-acetylene\ngoggles\n2 sets\nOxy-\nacetylene/Oxy-\nLPG cylinder\nwith content\n1 box\nMetal chalk\n\n--- PDF PAGE 55 ---\nWeldncii11-3\n01/04/05\n\n53\n12 pcs.\nTry square\n300 mm. long\n1 unit\nPedestal /bench\ngrinding machine\n\n12 pcs.\nSteel square\n300 mm. long\n1 unit\nIndustrial fan\n\n10 pcs. Files-half\nround\n\n2 pcs.\nFillet gauge\n\n3.5 TRAINING FACILITIES\n SMAW NC II\n\nThe welding workshop must be of concrete structure. Based on class size\nof 25 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL AREA\nIN SQ.\nMETERS\nWelding Booth\n2 X 1.5\n3\n8\n24\nGrinding Booth\n2 X 1.5\n3\n2\n6\nMaterials/Preparation\nArea*\n2 X 2\n4\n\n4\nBench work Area\n1.5 X 2.5\n4\n2\n8\nTool Room & S/M\nStorage Area\n4 X 5\n20\n\n20\nLearning Resource\nArea*\n5 X 9\n45\n\n45\nWash Area /Comfort\nRoom (male & female) *\n2.5 X 4\n10\n\n10\nTotal\n\n117\nCirculation Area**\n\n35\nTotal Workshop Area\n\n152\n\n* This area can also be used by other welding courses.\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n--- PDF PAGE 56 ---\nWeldncii11-3\n01/04/05\n\n54\n3.6 TRAINERS QUALIFICATIONS FOR SMAW NC II\n\nTRAINER QUALIFICATION (TQ II)\n\n•\nMust be a holder of SMAW Welder II\n•\nMust have undergone training on Training Methodology II (TM II)\n•\nMust be physically and mentally fit\n•\n*Must have at least 2 years job/industry experience\n•\nMust be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is to be undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 57 ---\nWeldncii11-3\n01/04/05\n\n55"
