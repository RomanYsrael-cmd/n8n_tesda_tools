    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: SMAW\n\nNC Level: NC II\n\nNominal Training Duration: 18 hrs. ( Basic Competencies)\n\n 56 hrs. ( Common Competencies)\n\n 194 hrs. ( Core Competencies)\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes\nof SMAW Welder in accordance with industry standards. It covers competencies\nsuch as Setting-up Welding Equipment, Preparing Weld Materials, Fitting up Weld\nMaterials, Welding Carbon Steel Plates Using SMAW, Welding Carbon Steel Plates\nand Pipes Using SMAW and Repairing Welds.\n\nBASIC COMPETENCIES\n\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\n workplace information.\n1.2 Complete relevant work\n related documents.\n1.3 Participate in workplace\n meeting and discussion\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a\nteam\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\n member.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice\ncareer\nprofessionalism\n3.1Integrate personal objectives\nwith organizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth\nand development.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 50 ---\nWeldncii11-3\n01/04/05\n\n48\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n\n4.2 Control hazards and risks\n\n4.3 Maintain occupational health\n and safety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform\nwork safely\n1.1 Identify hazardous areas and\nconditions\n1.2 Use protective clothing and\ndevices\n1.3 Perform safe handling of tools,\nequipment and materials\n1.4 Explain/perform first aid\nprocedure\n1.5 Use fire extinguisher\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n• Demonstration\n2. Contribute to\nquality\nsystem\n2.1 Inspect work done\n2.2 Apply quality standards to\nwork\n2.3 Protect company/ institution\nproperties\n2.4 Protect customer interest\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n• Demonstration\n3. Use hand\ntools\n3.1 Use different handtools\n3.2 Maintain handtools\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n• Written\n•Demonstration\n4. Interpret\nBlueprints\n4.1 Interpret technical drawing.\n4.2 Interpret welding symbols\n\n• Lecturette\n\n• Practical\napplication\n• Oral\nquestioning\n• Written test\n\n5. Perform\n industry\ncalculations\n5.1 Solve mathematical problems\n5.2 Convert systems of\nmeasurement\n5.3 Measure workpiece\n• Lecturette\n• Practical\napplication\n\n• Oral\nquestioning\n\n• Written test\n6. Prepare\nWeld\nMaterials\n6.1 Identify the different cutting\nequipment and accessories\n6.2 Identify types of mild steel\nelectrodes\n6.3 Identify types of joints and\nedge preparation\n6.4 Identify protective equipment\n• Lecturette\n• Practical\napplication\n\n• Observation\n• Demonstration\nand oral\nquestioning\n• Written test\n\n--- PDF PAGE 51 ---\nWeldncii11-3\n01/04/05\n\n49\n6.5 Prepare welding\nconsumables, tools and\naccessories\n6.6 Layout on materials\n6.7 Set-up cutting equipment\n6.8 Cut and prepare edge of\nmaterials\n7. Set-up\nWelding\nEquipment\n7.1 Explain welding principles and\nconcepts.\n7.2 Identify the parts of welding\nmachine\n7.3 Set up welding machine and\naccessories\n7.4 Set up welding positioners,\njigs and fixtures\n7.5 Set up pre-heating equipment\n(as required)\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n8. Fit up Weld\nMaterials\n8.1 Explain the importance of\nbacking plate and stiffener.\n8.2 Explain the methods of\nstriking an arc\n8.3 Perform striking an arc\n8.4 Tack weld specimen, backing\nplate and stiffener.\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n9. Repair\n Welds\n9.1 Identify causes and prevention\nof the different weld defects\n9.2 Mark/locate weld defects\n9.3 Prepare tools and equipment\n9.4 Remove defects\n9.5 Perform re-welding\n\n• Lecturette\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n•\n\n--- PDF PAGE 52 ---\nWeldncii11-3\n01/04/05\n\n50\nCORE COMPETENCIES\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Weld\nCarbon\nSteel\nPlates\nUsing\nSMAW\n1.1 Explain the essentials of\nwelding\n1.2 Deposit weld beads on\nplate\n1.3 Weld plates in single pass\nfillet joints in all positions\n1.4 Weld plates in multiple\npass fillet joints in all\npositions\n1.5 Weld plates in single pass\ngroove joints in flat,\nhorizontal and vertical\npositions\n1.6 Weld plates in multiple\npass groove joints in flat,\nhorizontal and vertical\npositions\n• Discussion\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n• Written test\n\n2.\nWeld\nCarbon\nSteel\nPlates\nand\nPipes\nUsing\nSMAW\n2.1 Weld plates in single pass\ngroove joints in overhead\npositions\n2.2 Weld plates in multiple\npass groove joints in\noverhead positions\n2.3 Weld pipe in 1G, 2G, 5G\nand 6G positions\n• Discussion\n• Demonstration\n\n• Observation\nand oral\nquestioning\n• Demonstration\nand oral\nquestioning\n\n--- PDF PAGE 53 ---\nWeldncii11-3\n01/04/05\n\n51"
  },
