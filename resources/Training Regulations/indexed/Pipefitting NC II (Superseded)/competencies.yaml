          "source_text": "VARIABLE \nRANGE \n1. Job specifications \nMay include but not limited to: \n1.1  Piping code specification  \n1.2  Material specification \n1.3  Item code number specification \n1.4  Size, quantity and description \n1.5  Bill of materials   \n \n2. Occupational health and \nsafety standards \nMay include but not limited to: \n2.1 Availability of fire extinguisher \n2.2 Asbestos blanket \n2.3 Availability of PPE \n2.4 Manufacturer’s recommendation  \n2.5 Waste disposal  \n \n3. Regulatory \nrequirements \n3.1 Hot work permit  \n3.2 Cold work permit \n3.3 Job order \n \n4. Material take-off \n4.1 Size \n4.2 Quantity \n4.3 Description   \n \n5. PPE \nMay include but not limited to: \n5.1 Safety gloves \n5.2 Safety goggles, glass and face shield \n5.3 Safety helmet \n5.4 Safety harness  \n5.5 Safety clothes \n5.6 Safety shoes \n5.7 Dust masks \n5.8 Ear plug\n\n--- PDF PAGE 42 ---\nPIPEFITTING NC II                                                                                                                                             41 \n \n6. Materials, tools and \nequipment \n \nMay include but not limited to: \n6.1  Materials \n6.1.1 Metal pipes \n6.1.2 Fittings \n6.1.3 Gaskets, bolts and nuts \n6.1.4 Valves \n6.1.5 Flange \n6.2  Tools and equipment \n6.2.1  Cutting set \n6.2.2  Grinder angle \n6.2.3  Steel square \n6.2.4  Level bar / mechanical \n6.2.5  Center punch \n6.2.6  Ball hammer \n6.2.7  Contour marker \n6.2.8  Spirit level \n6.2.9  Soft stone \n6.2.10  Steel measuring tape \n6.2.11  Files \n6.2.12  Power brush \n6.2.13  Steel brush \n6.2.14  Adjustable wrench \n6.2.15  Grinder key \n6.2.16  Tip cleaner \n6.2.17  Spark lighter \n6.2.18  Plumb bob \n \n7. Wrap around procedure \n7.1 Rub wrapping material in full contact with pipe  \n      to get the roundness of pipe \n7.2 Mark pipe with soft stone and punch if    \n      necessary \n \n8. Cutting procedure \n8.1 Straight cutting \n8.2 Bevel cutting \n8.3 Allowance and cutting \n8.4 Cold cutting \n8.5 Hot cutting \n \n9. Joint preparation \n9.1 Welding gap as per WPS (Welding Procedure   \n      Specifications) \n9.2 Leveling and squareness\n\n--- PDF PAGE 43 ---\nPIPEFITTING NC II                                                                                                                                             42 \n \n10. Waste materials \nMay include but not limited to: \n10.1 Metal scrap \n10.2 Grinding discs \n10.3 Electrode butts \n10.4 Flux \n10.5 Metal dusts / metal oxide / welding slags \n \n11. Unused materials \nMay include but not limited to: \n11.1 Pipes \n11.2 Electrodes \n \n12. Personnel \n12.1 Forman \n12.2 Charge hand \n12.3 Supervisor\n\n--- PDF PAGE 44 ---\nPIPEFITTING NC II                                                                                                                                             43"
