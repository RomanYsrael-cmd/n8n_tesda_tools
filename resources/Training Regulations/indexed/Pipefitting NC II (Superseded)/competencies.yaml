        "source_title": "CUT, BEVEL AND / OR THREAD PIPES",
        "source_text": "--- PDF PAGE 40 ---\nPIPEFITTING NC II                                                                                                                                             39 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY: \nCUT, BEVEL AND / OR THREAD PIPES \nUNIT CODE                     : \nCON713340 \nUNIT DESCRIPTOR        :    This unit covers the knowledge, skill and attitudes required to \ncut and bevel pipes \n \n \nELEMENT \nPERFORMANCE CRITERIA \nBold and italized terms are elaborated in the  \nRange of Variable \n \n1. Plan and prepare for \nwork \n1.1 Blueprint is secured and interpreted according to job \nspecifications \n1.2 Occupational health and safety standards and other \nregulatory requirements are identified and complied with  \n1.3 Personal protective equipment is selected and used \nfollowing job requirements \n1.4 Material take-off is estimated according to job \nspecifications \n \n2. Prepare and lay-out \npipes  \n \n2.1 Material take-off is prepared following company standard \noperating procedures (SOP) \n2.2 Materials, tools and equipment are secured following \ncompany standard operating procedure. \n2.3 Wrap around procedure is performed following job \nrequirements \n2.4 Marked and measured pipes are checked according to job \nspecifications \n \n3. Cut, bevel and thread \n    pipes \n3.1 Cutting procedure is performed following job \nspecifications \n3.2 Beveling and grinding procedure is performed  following \njob specifications \n3.3 Threading of pipe is performed, as specified \n3.3 Joint preparation procedure is performed following job \nrequirements \n  \n4. Perform housekeeping \n4.1 Waste materials are disposed following occupational \nhealth and safety standards \n4.2 Unused materials are returned to storage area following \ncompany SOP \n4.3 Completion report is prepared and submitted to \npersonnel following company SOP.\n\n--- PDF PAGE 41 ---\nPIPEFITTING NC II                                                                                                                                             40 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Job specifications \nMay include but not limited to: \n1.1  Piping code specification  \n1.2  Material specification \n1.3  Item code number specification \n1.4  Size, quantity and description \n1.5  Bill of materials   \n \n2. Occupational health and \nsafety standards \nMay include but not limited to: \n2.1 Availability of fire extinguisher \n2.2 Asbestos blanket \n2.3 Availability of PPE \n2.4 Manufacturer’s recommendation  \n2.5 Waste disposal  \n \n3. Regulatory \nrequirements \n3.1 Hot work permit  \n3.2 Cold work permit \n3.3 Job order \n \n4. Material take-off \n4.1 Size \n4.2 Quantity \n4.3 Description   \n \n5. PPE \nMay include but not limited to: \n5.1 Safety gloves \n5.2 Safety goggles, glass and face shield \n5.3 Safety helmet \n5.4 Safety harness  \n5.5 Safety clothes \n5.6 Safety shoes \n5.7 Dust masks \n5.8 Ear plug\n\n--- PDF PAGE 42 ---\nPIPEFITTING NC II                                                                                                                                             41 \n \n6. Materials, tools and \nequipment \n \nMay include but not limited to: \n6.1  Materials \n6.1.1 Metal pipes \n6.1.2 Fittings \n6.1.3 Gaskets, bolts and nuts \n6.1.4 Valves \n6.1.5 Flange \n6.2  Tools and equipment \n6.2.1  Cutting set \n6.2.2  Grinder angle \n6.2.3  Steel square \n6.2.4  Level bar / mechanical \n6.2.5  Center punch \n6.2.6  Ball hammer \n6.2.7  Contour marker \n6.2.8  Spirit level \n6.2.9  Soft stone \n6.2.10  Steel measuring tape \n6.2.11  Files \n6.2.12  Power brush \n6.2.13  Steel brush \n6.2.14  Adjustable wrench \n6.2.15  Grinder key \n6.2.16  Tip cleaner \n6.2.17  Spark lighter \n6.2.18  Plumb bob \n \n7. Wrap around procedure \n7.1 Rub wrapping material in full contact with pipe  \n      to get the roundness of pipe \n7.2 Mark pipe with soft stone and punch if    \n      necessary \n \n8. Cutting procedure \n8.1 Straight cutting \n8.2 Bevel cutting \n8.3 Allowance and cutting \n8.4 Cold cutting \n8.5 Hot cutting \n \n9. Joint preparation \n9.1 Welding gap as per WPS (Welding Procedure   \n      Specifications) \n9.2 Leveling and squareness\n\n--- PDF PAGE 43 ---\nPIPEFITTING NC II                                                                                                                                             42 \n \n10. Waste materials \nMay include but not limited to: \n10.1 Metal scrap \n10.2 Grinding discs \n10.3 Electrode butts \n10.4 Flux \n10.5 Metal dusts / metal oxide / welding slags \n \n11. Unused materials \nMay include but not limited to: \n11.1 Pipes \n11.2 Electrodes \n \n12. Personnel \n12.1 Forman \n12.2 Charge hand \n12.3 Supervisor\n\n--- PDF PAGE 44 ---\nPIPEFITTING NC II                                                                                                                                             43 \nEVIDENCE GUIDE \n1. Critical aspect of \ncompetency \n \nEvidence must show the candidate can: \n1.1 Demonstrates ability to interpret blueprint following job \nspecifications \n1.2 Demonstrates ability to comply occupational health and \nsafety standards and other regulatory requirements in \npipefitting \n1.3 Demonstrates ability to estimate material take-off following \njob specifications \n1.4 Demonstrates ability to lay-out pipes according to job \nspecifications \n \n2. Underpinning \nknowledge \n \n2.1 Isometric and / or orthographic symbols, drawings, \nsketches and material description \n2.2  Trade Mathematics (related and applied Trigonometry) \n2.3 Occupational health and safety standards and regulatory \nrequirements for cutting and beveling pipes \n2.4 Piping material classification, specifications and uses \n2.5 Piping cutting procedure for jointing \n \n3. Underpinning skills \n \n3.1 Interpreting isometric and / or orthographic symbols, \ndrawings, sketches and material description \n3.2 Applying Trade Mathematics \n3.3 Following occupational health and safety standards \n3.4 Using piping materials \n3.5 Performing piping cutting procedure for jointing \n \n4. Resource implications \n \nThe following maybe provided \n4.1 Materials, tools and equipment relevant to the  \n      activity \n4.2 Workplace or simulated environment\n\n--- PDF PAGE 45 ---\nPIPEFITTING NC II                                                                                                                                             44 \n \n5. Methods of Assessment \n \nCompetencies maybe assessed using the following \n5.1 Written test \n5.2 Observation with oral questioning \n5.3 Demonstration of practical skills in a simulated  \n      environment \n5.4  Portfolio \n5.5  Third party report  \n  \n6. Context of assessment \n \n6.1 Assessment maybe conducted in TESDA accredited \nassessment center\n",
