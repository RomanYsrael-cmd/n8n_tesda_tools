        "evidence_guide": {
          "source_text": "--- PDF PAGE 55 ---\nPIPEFITTING NC II 54\n1. Critical aspect of\ncompetency\n\nEvidence must show the candidate can:\n1.1 Demonstrates ability to interpret blueprint following job\nspecifications\n1.2 Demonstrates ability to comply occupational health and\nsafety standards and other regulatory requirements in\npipefitting\n1.3 Demonstrates ability to perform installation and\n fit-up procedure for overhead piping system\n\n2. Underpinning\nknowledge\n\n2.1 Isometric and / or orthographic symbols, drawings,\nsketches and material description\n2.2 Trade Mathematics (related and applied Trigonometry)\n2.3 Occupational health and safety standards for installation\nand fit-up of overhead piping system\n2.4 Piping material classification, specifications and uses\n2.5 Installation and fit-up procedures for overhead\n piping system\n\n3. Underpinning skills\n\n3.1 Interpreting blueprint following job specifications\n3.2 Applying Trade Mathematics\n3.3 Complying occupational health and safety standards\n3.4 Using piping materials\n3.5 Performing installation and fit-up procedures for\noverhead piping system\n\n4. Resource implications\n\nThe following maybe provided\n4.1 Materials, tools and equipment relevant to the\n activity\n4.2 Workplace or simulated workplace\n\n5. Methods of Assessment\n\nCompetencies maybe assessed using the following\n5.1 Written test\n5.2 Observation with oral questioning\n5.3 Portfolio\n5.4 Third party report\n\n--- PDF PAGE 56 ---\nPIPEFITTING NC II 55\n\n6. Context of assessment\n\n6.1 Assessment maybe conducted in any TESDA accredited\nassessment centers\n\n--- PDF PAGE 57 ---\nPIPEFITTING NC II 56\nUNIT OF COMPETENCY:\nPERFORM TACK WELDING\nUNIT CODE :"
        },
        "source_text": "CON713341\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitude required to\ninstall and fit-up overhead piping system.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and italized terms are elaborated in the\nRange of Variable\n\n1. Plan and prepare for\n work\n1.1 Blueprint is secured and interpreted according to job\n specifications\n1.2 Occupational health and safety standards and other\nregulatory requirements are identified and complied with\n1.3 Personal protective equipment is selected and used\nfollowing job requirements\n\n2. Prepare materials, tools\n and equipment\n2.1 Materials, tools and equipment are identified following job\nspecifications\n2.2 Materials, tools and equipment are secured\n following company standard operating procedure (SOP)\n\n3. install and fit-up\n overhead piping system\n3.1 Erection of piping is monitored and checked according to\npiping plan\n3.2 Deviation from the piping plan is noted and reported to\nappropriate personnel\n3.3 Fit-up procedure is performed following job specifications\n\n4. Perform housekeeping\n4.1 Waste materials are disposed following occupational\nhealth and safety standards\n4.2 Unused materials are returned to storage area following\ncompany SOP\n4.3 Completion report is prepared and submitted to\npersonnel following company SOP.\n\nRANGE OF VARIABLES\n\n--- PDF PAGE 53 ---\nPIPEFITTING NC II 52\nVARIABLE\nRANGE\n1. Job specifications\n\nMay include but not limited to:\n1.1 Piping code specification\n1.2 Material specification\n1.3 Item code number specification\n1.4 Size, quantity and description\n1.5 Bill of materials\n\n2. Occupational health and\n safety standards\n\nMay include but not limited to:\n2.1 PPE\n2.2 Availability and functionality of scaffolding\n\n3. Regulatory requirements\n\nMay include but not limited to:\n3.1 Cold work permit\n3.2 Hot work permit\n3.3 Job order\n\n4. PPE\n\nMay include but not limited to:\n4.1 Safety gloves\n4.2 Safety goggles, glass and face shield\n4.3 Safety helmet\n4.4 Safety harness\n4.5 Safety clothes\n4.6 Safety shoes\n4.7 Dust masks\n4.8 Ear plug\n\n5. Materials, tools and\n equipment\n\nMay include but not limited to:\n5.1 Materials\n5.1.1 Metal pipes\n5.1.2 Fittings\n5.1.3 Gaskets, bolts and nuts\n5.1.4 Valves\n5.1.5 Flange\n5.2 Tools and equipment\n5.2.1 Grinder angle\n5.2.2 Steel square\n5.2.3 Level bar\n5.2.4 Center punch\n5.2.5 Ball hammer\n5.2.6 Chain block / comalomg\n5.2.7 Roller\n5.2.8 Spirit level\n5.2.9 Soft stone\n5.2.10 Steel measuring tape / tape line\n5.2.11 Plumb bob\n\n--- PDF PAGE 54 ---\nPIPEFITTING NC II 53\n5.2.12 Power brush\n5.2.13 Steel brush\n5.2.14 Adjustable wrench\n5.2.15 Grinder key\n5.2.16 Welding machine\n5.2.17 Air compressor\n5.2.18 Electric lights\n5.2.19 Safety / medical kit\n5.2.20 Scaffolding\n\n6. Personnel\n\n6.1 Charge hand\n6.2 Foreman\n6.3 Leadman\n6.4 Supervisor\n\n7. Fit-up procedure\n\n7.1 Tack welding\n7.2 Trimming\n7.3 Orientation of flanges and fittings\n7.4 Pipefitting alignment\n7.5 Fabrication of temporary supports\n 7.5.1 Jigs\n 7.5.2 Stoppers\n 7.5.3 Pipe clamps\n 7.5.4 Brazing\n\n8. Waste materials\n\nMay include but not limited to:\n8.1 Metal scraps\n8.2 Grinding discs\n8.3 Metal flux\n8.4 Electrodes\n8.5 Fabricated temporary supports\n\n9. Unused materials\n\n9.1 Metal pipes\n9.2 Electrodes\n\nEVIDENCE GUIDE\n\n--- PDF PAGE 55 ---\nPIPEFITTING NC II 54\n1. Critical aspect of\ncompetency\n\nEvidence must show the candidate can:\n1.1 Demonstrates ability to interpret blueprint following job\nspecifications\n1.2 Demonstrates ability to comply occupational health and\nsafety standards and other regulatory requirements in\npipefitting\n1.3 Demonstrates ability to perform installation and\n fit-up procedure for overhead piping system\n\n2. Underpinning\nknowledge\n\n2.1 Isometric and / or orthographic symbols, drawings,\nsketches and material description\n2.2 Trade Mathematics (related and applied Trigonometry)\n2.3 Occupational health and safety standards for installation\nand fit-up of overhead piping system\n2.4 Piping material classification, specifications and uses\n2.5 Installation and fit-up procedures for overhead\n piping system\n\n3. Underpinning skills\n\n3.1 Interpreting blueprint following job specifications\n3.2 Applying Trade Mathematics\n3.3 Complying occupational health and safety standards\n3.4 Using piping materials\n3.5 Performing installation and fit-up procedures for\noverhead piping system\n\n4. Resource implications\n\nThe following maybe provided\n4.1 Materials, tools and equipment relevant to the\n activity\n4.2 Workplace or simulated workplace\n\n5. Methods of Assessment\n\nCompetencies maybe assessed using the following\n5.1 Written test\n5.2 Observation with oral questioning\n5.3 Portfolio\n5.4 Third party report\n\n--- PDF PAGE 56 ---\nPIPEFITTING NC II 55\n\n6. Context of assessment\n\n6.1 Assessment maybe conducted in any TESDA accredited\nassessment centers\n\n--- PDF PAGE 57 ---\nPIPEFITTING NC II 56\nUNIT OF COMPETENCY:\nPERFORM TACK WELDING\nUNIT CODE :"
