    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: PIPEFITTING\n\nNC Level: NC II\n\nNominal Training Duration: 18 Hours (Basic)\n\n24 Hours (Common)\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitude in\npipefitting in accordance with industry standards. It covers the basic, common and\ncore competencies required for pipefitter to demonstrate.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\n\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional\ngrowth and development.\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 62 ---\nPIPEFITTING NC II 61\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\n\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 63 ---\nPIPEFITTING NC II 62\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify materials\n1.2 Request materials\n1.3 Receive and\n inspect materials\n• Audio Visual\n• Simulation\n• Discussion\n• Practical exercises\n• Direct observation\n• Written / Oral test\n• Demonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and\naccess\nspecification /\nmanuals\n2.2 Apply information\nin the manual\n2.3 Store manual\n\n• Audio Visual\n• Simulation\n• Discussion practical\nlaboratory\n\n• Direct observation\n• Written test or\nexamination\n• Third party report\n• Demonstration\n3. Interpret\ntechnical\ndrawing\n3.1 Analyze sign,\nsymbols and data\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand\nsketching\n• Audio Visual\n• Simulation\n• Discussion\n• Practical exercises\n\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out\nmeasurements\nand calculations\n• Audio Visual\n• Simulation\n• Discussion\n• Practical exercises\n\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n5. Maintain tools\nand equipment\n5.1 Check condition\nof tools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Store tools and\nequipment\n\n• Audio Visual\n• Simulation\n• Discussion\n• Practical exercises\n\n•\nDirect\nobservation of\napplication of\ntasks.\n•\nOral questioning\n•\nWritten test or\nexamination\n•\nThird party report\n•\nDemonstration\n\n--- PDF PAGE 64 ---\nPIPEFITTING NC II 63\n\nCORE COMPETENCIES\n(160 hours)\n\nUnit of Competency\nLearning Outcome\nMethodology\nAssessment\nApproach\n1. Cut , bevel and /or\nthread pipes\n1.1 Plan and prepare for\nwork\n1.2 Prepare materials,\ntools and equipment\n1.3 Cut, bevel and thread\npipes\n1.4 Perform\nhousekeeping\n\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical\nexercises\n• Observation/\nDemonstration\nwith questioning\n• Written /\nExamination\n\n2. Perform tack\nwelding\n2.1 Prepare welding tools\nand materials\n2.2 Set-up welding\nequipment\n2.3 Perform tack welding\n\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical\nexercises\n• Observation/\nDemonstration\nwith questioning\n• Written /\nExamination\n\n3. Install and fit-up\nunderground piping\nsystem\n3.1 Plan and prepare\nmaterials , tools and\nequipment\n3.2 Install and fit-up\nunderground piping\nsystem\n\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical\nexercises\n• Observation/\nDemonstration\nwith questioning\n• Written /\nExamination\n\n4. Install and fit-up\noverhead piping\nsystem\n4.1 Plan and prepare\nmaterials, tools and\nequipment\n4.2 Install and fit-up\noverhead piping\nsystem\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical\nexercises\n• Observation/\nDemonstration\nwith questioning\n• Written /\nExamination\n\n--- PDF PAGE 65 ---\nPIPEFITTING NC II 64"
