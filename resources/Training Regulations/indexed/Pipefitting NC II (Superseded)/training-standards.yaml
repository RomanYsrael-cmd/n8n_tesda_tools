\nexercises\n• Observation/\nDemonstration\nwith questioning\n• Written /\nExamination\n\n2. Perform tack\nwelding\n2.1 Prepare welding tools\nand materials\n2.2 Set-up welding\nequipment\n2.3 Perform tack welding\n\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical\nexercises\n• Observation/\nDemonstration\nwith questioning\n• Written /\nExamination\n\n3. Install and fit-up\nunderground piping\nsystem\n3.1 Plan and prepare\nmaterials , tools and\nequipment\n3.2 Install and fit-up\nunderground piping\nsystem\n\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical\nexercises\n• Observation/\nDemonstration\nwith questioning\n• Written /\nExamination\n\n4. Install and fit-up\noverhead piping\nsystem\n4.1 Plan and prepare\nmaterials, tools and\nequipment\n4.2 Install and fit-up\noverhead piping\nsystem\n• Discussion/\n lecture\n• Self-paced\ninstruction\n• Practical\nexercises\n• Observation/\nDemonstration\nwith questioning\n• Written /\nExamination\n\n--- PDF PAGE 65 ---\nPIPEFITTING NC II 64\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery shall be guided by the 10 basic principles of competency-based TVET:\n\n• The training is based on curriculum developed from the\n\ncompetency standards;\n\n• Learning is modular in its structure;\n\n• Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n\n• Training is based on work that must be performed;\n\n• Training materials are directly related to the competency\nstandards and the curriculum modules;\n\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n\n• Training is based both on and off-the-job components;\n\n• Training program allows for recognition of prior learning\n\n(RPL) or current competencies;\n\n• Training allows for multiple entry and exit; and\n\n• Training programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school\nand in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing\nRules and Regulations.\n\n• Modular/self-paced is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace.\nThe trainer facilitates the training delivery.\n\n--- PDF PAGE 66 ---\nPIPEFITTING NC II 65\n•\nPeer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\n\n•\nSupervised Industry Training or On-the-Job Training is an\napproach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the\ntraining regulations.\n\n•\nDistance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer\ntechnologies.\n\n•\nProject-based instruction is an authentic instructional model\nor strategy in which students plan, implement and evaluate\nprojects that have real world applications.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nTrainees or students should possess the following requirements:\n\n• Can communicate both oral and written\n• Can perform basic mathematical computation\n• Good moral character; and\n• Physically and mentally fit\n\nThe list does not include specific institutional requirements such as\neducational attainment, appropriate work experience, and others that may be\nrequired of the trainees by the school or training center delivering the TVET\nprogram.\n\n--- PDF PAGE 67 ---\nPIPEFITTING NC II 66\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\nPIPEFITTING NC II\n\nThe recommended list of tools, equipment and materials for the training\nof 25 trainees for Pipefiting NC II is as follows.\n\nTOOLS\n\nEQUIPMENT\nMATERIALS\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\n5 pcs.\nBall peen hammer,\n16 oz.\n5\nunits\nArc welding\nmachine\n1 box\nSoapstone\n5 pcs.\nCross peen\nhammer, 16 oz.\n1 unit Threading\nmachine\n2 boxes Cut-off disc\n\n1 set Gas bevelling\nmachine (pipe)\n2 boxes Grinding disc\n5 pcs.\nCenter punch\n2\nsets\nPipe clamp\nFittings\n5 pcs.\nHack saw\n\n10 pcs. Elbow 90O,\n(assorted dia.)\n1 pc.\n Pipe cutter\n1 unit Electric drill\n\n10 pcs.\nElbow 45O,\n(assorted dia.)\n5 pcs.\nC-clamp, 12”\n8\nunits\nPortable grinder\n10 pcs.\nTee branch,\n(assorted dia)\n5 pcs.\nC-clamp, 6”\n2\nsets\nOxy-acetylene\ncutting outfit\n10 pcs.\nWye branch,\n( assorted dia.)\n5 pcs.\nPull & push rule\n3\nunits\nFire extinguishers\n4 pcs.\nValves (assorted\ntypes and sizes)\n5 pcs.\nSteel rule,1 meter\n3\nunits\nWorking bench\nwith vise\n15 pcs.\nFlanges\n(assorted types\nand sizes)\n5 pcs.\nTry square\n1 unit Power brush\n\n1 box\nElectrodes\n10 pcs. Steel square\n3\nunits\nChain block\n4 pcs.\nGaskets\n\n1 set Scaffolding H- / A-\ntype\n16 pcs.\nBolts and nuts\n5 pcs.\nAdjustable wrench,\n8”\n1 roll String/ chalk line\n25 pcs.\nGloves\n5 pcs.\nAdjustable\nwrench,12 “\n\n25 pcs.\nHard hat\n\n--- PDF PAGE 68 ---\nPIPEFITTING NC II 67\n\n3 pcs.\nFiles\n(assorted)\n\n25 pcs.\nSafety shoes\n5 pcs.\nSteel brush\n\n25 pcs.\nGoggles\n2 pcs.\nwraparound\n\n8 pcs.\n Face shield\n\n5 pcs.\nWelding mask\n\n--- PDF PAGE 69 ---\nPIPEFITTING NC II 68\n\n3.5\nTRAINING FACILITIES FOR PIPEFITTING NC II\n\n This space requirement is based on a class size or intake of 25\nstudents.\n\nSPACE\nREQUIREMENT\nSIZE IN METERS\nAREA IN\nSQ. METERS\nTOTAL AREA IN\n SQ. METERS\n\n• Lecture Room/Demo\nRoom\n\n25\n\n25\n• Wash Room\n\n5\n\n 5\n• Tool Room\n\n 5\n\n5\n• Facilities/Equipment/\nCirculation area\n\n42\n\n42\nWorkshop Area\n\n225\n225\n\n TOTAL 302\n\n--- PDF PAGE 70 ---\nPIPEFITTING NC II 69\n\n3.6\nTRAINER’S QUALIFICATIONS FOR PIPEFITTING NC II\n\n•\nMust have completed a Trainers Training Methodology Course\n(TM II) or its equivalent\n•\nMust be a holder of CSC Professional eligibility (for government\nposition)\n•\nMust be a holder of Pipefitting National Certificate II\n•\nMust be physically and mentally fit\n•\n*Minimum of 2 years industry experience\n\n*Optional. Only when required by the hiring institution\nReference: TESDA Board Resolution No. 2004-03\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for\neach unit of competency.\n\n--- PDF PAGE 71 ---\nPIPEFITTING NC II 70"
