        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace\nactivity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace\nlanguage\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning\nKnowledge and\nAttitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning\nSkills\n3.1.\nCommunicate appropriately, consistent with the\nculture of the workplace\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place Materials relevant to the proposed\nactivity or tasks\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation\nto the work activities of the group\n5.2.\nObservation of simulation and or role play\ninvolving the participation of individual member to\nthe attainment of organizational goal\n5.3. Case studies and scenarios as a basis for\ndiscussion of issues and strategies in teamwork\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in workplace or in\na simulated workplace setting\n6.2.\nAssessment shall be observed while task are\nbeing undertaken whether individually or in group\n\n--- PDF PAGE 12 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n10\n UNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\n UNIT CODE :"
        },
        "source_text": "500311106\nUNIT DESCRIPTOR : This unit covers the skills, knowledge and attitudes to\nidentify role and responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Describe team role\nand scope\n1.1. The role and objective of the team is identified\nfrom available sources of information\n1.2. Team parameters, reporting relationships and\nresponsibilities are identified from team\ndiscussions and appropriate external sources\n2. Identify own role\nand responsibility\nwithin team\n2.1. Individual role and responsibilities within the team\nenvironment are identified\n2.2. Roles and responsibility of other team members\nare identified and recognized\n2.3. Reporting relationships within team and external\nto team are identified\n3. Work as a team\nmember\n3.1. Effective and appropriate forms of\ncommunications used and interactions\nundertaken with team members who contribute to\nknown team activities and objectives\n3.2. Effective and appropriate contributions made to\ncomplement team activities and objectives, based\non individual skills and competencies and\nworkplace context\n3.3. Observed protocols in reporting using standard\noperating procedures\n3.4. Contribute to the development of team work plans\nbased on an understanding of team’s role and\nobjectives and individual competencies of the\nmembers.\n\n--- PDF PAGE 10 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n8\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Role and objective\nof team\n1.1.\nWork activities in a team environment with\nenterprise or specific sector\n1.2.\nLimited discretion, initiative and judgment\nmaybe demonstrated on the job, either\nindividually or in a team environment\n2. Sources of\ninformation\n2.1.\nStandard operating and/or other workplace\nprocedures\n2.2.\nJob procedures\n2.3.\nMachine/equipment manufacturer’s\nspecifications and instructions\n2.4.\nOrganizational or external personnel\n2.5.\nClient/supplier instructions\n2.6.\nQuality standards\n2.7.\nOHS and environmental standards\n3. Workplace context\n3.1.\nWork procedures and practices\n3.2.\nConditions of work environments\n3.3.\nLegislation and industrial agreements\n3.4.\nStandard work practice including the storage,\nsafe handling and disposal of chemicals\n3.5.\nSafety, environmental, housekeeping and\nquality guidelines\n\n--- PDF PAGE 11 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n9\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nOperated in a team to complete workplace\nactivity\n1.2.\nWorked effectively with others\n1.3.\nConveyed information in written or oral form\n1.4.\nSelected and used appropriate workplace\nlanguage\n1.5.\nFollowed designated work plan for the job\n1.6.\nReported outcomes\n2. Underpinning\nKnowledge and\nAttitude\n2.1.\nCommunication process\n2.2.\nTeam structure\n2.3.\nTeam roles\n2.4.\nGroup planning and decision making\n3. Underpinning\nSkills\n3.1.\nCommunicate appropriately, consistent with the\nculture of the workplace\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can\ntake place Materials relevant to the proposed\nactivity or tasks\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nObservation of the individual member in relation\nto the work activities of the group\n5.2.\nObservation of simulation and or role play\ninvolving the participation of individual member to\nthe attainment of organizational goal\n5.3. Case studies and scenarios as a basis for\ndiscussion of issues and strategies in teamwork\n6. Context for\nAssessment\n6.1.\nCompetency may be assessed in workplace or in\na simulated workplace setting\n6.2.\nAssessment shall be observed while task are\nbeing undertaken whether individually or in group\n\n--- PDF PAGE 12 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n10\n UNIT OF COMPETENCY: PRACTICE CAREER PROFESSIONALISM\n\n UNIT CODE :"
