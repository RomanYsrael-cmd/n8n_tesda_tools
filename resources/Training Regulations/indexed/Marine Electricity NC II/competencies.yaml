        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\n1.1\n\n1.2\n\n1.3\n\n1.4\nCompetency requires evidence that the\ncandidate:\nDemonstrates ability to plan and prepare\nfor work\n Demonstrates ability to prepare hand\nand special tools and test instrument\nDemonstrates ability to test and repair\nbasic alarm system\nDemonstrates ability to perform good\nhousekeeping\n2. Underpinning knowledge\n2.1\n2.2\n\n2.3\n2.4\n\n2.5\nOccupational safety and health standards\nTypes and uses of hand and special\ntools and test instruments\nManufacturer’s manuals\nProcedure for testing and repairing basic\nalarm system\nCompany standard operating procedure\n3. Underpinning Skills\n3.1\n\n3.2\n\n3.3\n3.4\n\n3.5\nComplying occupational safety and health\nstandards\nUsing hand and special tools and test\ninstruments\nFollowing manufacturer’s manuals\nPerforming procedure for testing and\nrepairing basic alarm system\nFollowing company standard operating\nprocedure\n4. Resource implication\n\n4.1\n\n4.2\n\nThe following resources must be\nprovided:\nBasic and special hand tools and test\ninstruments\nAccess to various engine room alarm\nsystem\n\n5. Method of assessment\n\n5.1\n5.2\n5.3\n5.4\nCompetency may be assessed through:\nDemonstration with oral questioning\nThird party report\nWritten test\nPortfolio\n6. Context of assessment\n6.1\nCompetency may be assessed at work in\nthe workplace or in a simulated work\nenvironment\n\n--- PDF PAGE 91 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n89"
        },
        "source_text": "MTM311307\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes in testing,\ncalibrating and repairing alarms system on board ship as\nrequired by Classification Society for Engine Room UMS\nCertificate (Unmanned Machinery Space Certificate)\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1.\nPlan and prepare for work\n1.1\n\n1.2\n\n1.3\n\n1.4\n\nWork instruction is secured from\nimmediate superior following company\nstandard operating procedures (SOP)\nOccupational safety and health\nstandards are identified in line with job\nrequirements\nPersonal protective equipment (PPE)\nis identified and selected in line with job\nrequirements\nHand and special tools and test\ninstruments are identified and selected\nin line with job requirements\n2.\nPrepare hand and special\ntools and test instruments\n2.1\n\n2.2\n\n2.3\n2.4\nWork instruction is interpreted in line with\njob specifications\nOccupational safety and health\nstandards are complied with.\nPPE is used in line with job requirements\nHand and special tools and test\ninstruments are prepared in line with job\nrequirements\n3.\nPerform testing and repair\nof alarm system\n\n3.1\n\n3.2\n\n3.3\n\nTesting procedure for alarms system is\nperformed in line with job requirements\nand/or as per PMS schedule\nCalibration procedure is performed in\naccordance with required standard set\npoint\nCorrective maintenance servicing\nprocedure is performed in line with\nalarms system failure.\n\n--- PDF PAGE 88 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n86\n4.\nPerform good\nhousekeeping\n4.1\n\n4.2\n\n4.3\n\nWork area is cleaned following company\nSOP\nHand and special tools and test\ninstruments are cleaned and stored\nfollowing company SOP\nWork completion report is prepared and\nsubmitted to immediate supervisor\nfollowing company SOP.\n\n--- PDF PAGE 89 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n87\nRANGE OF VARIABLES\n1.\nOccupational health and\nsafety standards\n\n1.1\n1.2\n1.3\nMay include but not limited to-\nSafety checklist accomplishment\nAvailability of PPE\nAvailability and functionality of fire\nextinguisher and flashlight\n2.\nPPE\n\n2.1\n2.2\n2.3\n2.4\n2.5\nMay include but not limited to:\nSafety helmet\nSteel toe safety shoes\nGloves\nEar muff\nCoverall\n3.\nHand and special tools and\ntest instruments\n\n3.1\n3.2\n3.3\n3.4\nMay include but not limited to:\nStandard electrical hand tools\nSet of spanners\nPressure calibrator\nTemperature calibrator\n4.\nTesting procedure\n\n4.1\n4.2\n4.3\n4.4\nMay include but not limited to:\nPressure\nTemperature\nLevel\nFire alarm\n5.\nPMS Schedule\n5.1\n5.2\n5.3\n5.4\nMonthly\nQuarterly\nSemi-annually\nAnnually\n6.\nCorrective maintenance\nservicing procedure\n6.1\n6.2\nTightening\nReplacement\n7.\nAlarm system failure\n\n7.1\n7.2\n7.3\nPossible causes:\nLoose connections\nFaulty sensor\nPressure monitoring failure\n\n--- PDF PAGE 90 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n88\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\n1.1\n\n1.2\n\n1.3\n\n1.4\nCompetency requires evidence that the\ncandidate:\nDemonstrates ability to plan and prepare\nfor work\n Demonstrates ability to prepare hand\nand special tools and test instrument\nDemonstrates ability to test and repair\nbasic alarm system\nDemonstrates ability to perform good\nhousekeeping\n2. Underpinning knowledge\n2.1\n2.2\n\n2.3\n2.4\n\n2.5\nOccupational safety and health standards\nTypes and uses of hand and special\ntools and test instruments\nManufacturer’s manuals\nProcedure for testing and repairing basic\nalarm system\nCompany standard operating procedure\n3. Underpinning Skills\n3.1\n\n3.2\n\n3.3\n3.4\n\n3.5\nComplying occupational safety and health\nstandards\nUsing hand and special tools and test\ninstruments\nFollowing manufacturer’s manuals\nPerforming procedure for testing and\nrepairing basic alarm system\nFollowing company standard operating\nprocedure\n4. Resource implication\n\n4.1\n\n4.2\n\nThe following resources must be\nprovided:\nBasic and special hand tools and test\ninstruments\nAccess to various engine room alarm\nsystem\n\n5. Method of assessment\n\n5.1\n5.2\n5.3\n5.4\nCompetency may be assessed through:\nDemonstration with oral questioning\nThird party report\nWritten test\nPortfolio\n6. Context of assessment\n6.1\nCompetency may be assessed at work in\nthe workplace or in a simulated work\nenvironment\n\n--- PDF PAGE 91 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n89"
      }
