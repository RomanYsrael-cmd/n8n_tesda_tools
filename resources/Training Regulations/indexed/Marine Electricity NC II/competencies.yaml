          "source_text": "1.   Launch and  operate \nsurvival craft and life \nboats \n \n \n1.1  Preparation for the launch of lifeboat or survival \ncraft are made in accordance with vessel’s \nprocedures and manufacturer’s direction  \n1.2 An appropriate launch strategy is adopted \nfollowing  an assessment of weather and sea \nconditions and the nature of the emergency \nsituation \n1.3   Launching equipment is operated in accordance \nwith vessel’s instructions and accepted nautical \npractice \n1.4  The survival craft engine is started using the \nsequence \nof \nactions \nprovided \nin \nthe \nmanufacturer’s instruction \n1.5   Appropriate handling strategies are applied to \nmaneuver the survival craft in rough weather \nand sea conditions    \n1.6   Exposure cover is deployed on an open lifeboat \nin accordance with accepted survival practice \nand manufacturer’s specification    \n1.7   Strategies are adopted and implemented to \ncounter threats to survival following the \nabandonment of a vessel in accordance with \naccepted survival practice.   \n1.8   Food and water is rationed to survivors in \naccordance with accepted survival practice \n2. Operate life saving and \nsurvival equipment \n \n \n2.1  Location and accessibility of all life-saving and \nsurvival equipment is established \n2.2  Survival equipment is checked and operated in \naccordance with manufacturer’s instructions and \nregulatory protocols\n\n--- PDF PAGE 21 ---\n_____________________________________________________________________ \nTR- Marine Electricity NC II                                           Promulgated September 2008 \n19\n2.3  Immersion suit, various thermal protective aids, \nlife jacket and other life-saving clothing are \ncorrectly donned and used in accordance with \ninstructions \n2.4 Faulty life saving equipment is identified and \nreported to enable prompt repair and / or \nreplacement \n3.   Remove survival craft \n \n \n3.1  Persons are disembarked from the survival craft \nin accordance with vessel’s procedures \n3.2 The survival craft is recovered using the \nsequence of actions provided in vessel’s \nprocedures and manufacturer’s instruction \n3.3   Survival craft is checked for signs and damage \n3.4 Identified damage or faulty equipment on the \nsurvival craft is reported in accordance with \nvessel’s procedures \n4.  Participate in abandon \nvessel drills \n \n4.1 Participation in organization and conduct of \nabandon vessel musters and drills in consistent \nwith regulatory requirements and company \nprocedures \n4.2  Instructions is provided to others, when required, \non the correct use of life saving equipment and \nprocedures to be followed in the event of the \norder to abandon vessel \n4.3 \nDocumentation \non \nthe \nchecking \nand \nreplenishment of consumable materials used in \nlife saving, fire detection, fire fighting and other \nsafety system is completed in accordance with \ncompany \nprocedures \nand \nregulatory \nrequirements\n\n--- PDF PAGE 22 ---\n_____________________________________________________________________ \nTR- Marine Electricity NC II                                           Promulgated September 2008 \n20\nRANGE OF VARIABLES \n \n \nVARIABLE \nRANGE \n1.  Survival Craft \n1.1  Free fall life boats \n1.2  Devit launched life boats \n1.3  Life rafts \n2.  Threats to survival after \nabandoning vessel may \ninclude \n2.1  Cold water shock    \n2.2  Hypothermia    \n2.3  Psychological response to disaster  \n2.4  Loss of will to live   \n2.5  Sea sickness     \n2.6  Dehydration   \n2.7  Injuries   \n2.8  Starvation \n3.  Life saving and survival \nequipment \n3.1  Life jackets \n3.2  Life buoys \n3.3  Hard hats \n3.4  Immersion suits and other thermal protective aid \n3.5  Rocket line throwing appliances \n3.6  Pyrotechnic distress signals \n3.7  GMDSS survival craft VHF radios \n3.8 Satellite emergency position indicating radio \nbeacons  \n3.9  EPIRBs \n3.10 SARTs \n3.11 Whistles\n\n--- PDF PAGE 23 ---\n_____________________________________________________________________ \nTR- Marine Electricity NC II                                           Promulgated September 2008 \n21"
