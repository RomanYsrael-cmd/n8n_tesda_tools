          "source_text": "1. Critical aspects of\ncompetency\n\n1.1\n\n1.2\n\n1.3\n\n1.4\n\nCompetency requires evidence that the\ncandidate:\nDemonstrates ability to plan and prepare\nfor work\nDemonstrates ability to prepare hand and\nspecial tools and test instrument\nDemonstrates ability to service and\nmaintain batteries\nDemonstrates ability to perform good\nhousekeeping\n2. Underpinning knowledge\n2.1\n2.2\n\n2.3\n\n2.4\n\n2.5\n2.6\n\nOccupational safety and health standards\nTypes and uses of hand and special\ntools and test instruments\nBattery manufacturer’s instructions\nmanual\nProcedure for servicing and maintaining\nbatteries\nCompany standard operating procedure\nTypes and characteristics of storage\nbatteries\n3. Underpinning Skills\n3.1\n3.2\n\n3.3\n\n3.4\n\n3.5\n3.6\n\nComplying safety and health standards\nUsing hand and special tools and test\ninstruments\nFollowing manufacturer’s instructions\nmanual\nFollowing procedure for servicing and\nmaintaining batteries\nPerforming good housekeeping\nUnderstanding types and characteristics\nof storage batteries\n4. Resource implication\n\n4.1\n4.2\n\n4.3\n\nThe following resources must be\nprovided:\nBatteries\nBasic and special hand tools and test\ninstruments\nBattery service manual\n\n--- PDF PAGE 75 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n73\n5. Method of assessment\n\n5.1\n5.2\n5.3\n5.4\nCompetency may be assessed through:\nDemonstration and oral questioning\nThird party report\nWritten test\nPortfolio\n6. Context of assessment\n6.1\nCompetency may be assessed at work in\nthe workplace or in a simulated work\nenvironment\n\n--- PDF PAGE 76 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n74\nUNIT OF COMPETENCY: MAINTAIN MARINE MOTOR CONTROLS AND\nOTHER BASIC ELECTRONIC CONTROL\nSYSTEMS\n\nUNIT CODE:"
