          "source_text": "1. Critical aspects of\ncompetency\n\n1.1\n\n1.2\n\n1.3\n\n1.4\n\nCompetency requires evidence that the\ncandidate:\nDemonstrates ability to plan and prepare\nfor work\nDemonstrates ability to prepare hand\ntools and test instruments\nDemonstrates ability to perform minor\nmaintenance servicing for electric\ngenerator components\nDemonstrates ability to perform good\nhousekeeping\n2. Underpinning knowledge\n2.1\n2.2\n\n2.3\n2.4\n\n2.5\n2.6\n2.7\n2.8\n\n2.9\nOccupational safety and health standards\nTypes and uses of hand tools and test\ninstruments\nManufacturer’s instructions manual\nProcedure for performing minor\nmaintenance servicing for electric\ngenerators\nCompany standard operating procedure\nSchematic diagram\nParts and functions of generators\nBasic troubleshooting procedure for\nspace heater\nBasic electrical calculations\n3. Underpinning Skills\n3.1\n\n3.2\n\n3.3\n3.4\n\n3.5\n\n3.6\n3.7\n\n3.8\n\n3.9\nComplying occupational health and safety\nstandards\nFollowing manufacturer’s instruction\nmanual\nUsing hand tools and test instruments\nPerforming procedure for minor\nmaintenance servicing for electric\ngenerators\nFollowing company standard operating\nprocedure\nInterpreting schematic diagram\nUnderstanding parts and functions of\ngenerators\nFollowing basic troubleshooting\nprocedure for space heater\nApplying basic electrical calculations\n\n--- PDF PAGE 58 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n56\n4. Resource implication\n\n4.1\n4.2\nThe following resources must be\nprovided:\nHand tools and test instruments\nAccess to vessel with electrical system\n5. Method of assessment\n\n5.1\n5.2\n5.3\n5.4\nCompetency may be assessed through:\nDemonstration with oral questioning\nThird party report\nWritten test\nPortfolio\n6. Context of assessment\n6.1\nCompetency may be assessed in the\nworkplace or in a simulated work\nenvironment\n\n--- PDF PAGE 59 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n57\nUNIT OF COMPETENCY: SERVICE MARINE ELECTRIC MOTORS\n\nUNIT CODE:"
        },
        "source_text": "MTM311301\n\nUNIT DESCRIPTOR: This unit encapsulates skills, know-how and work quality\nrequired\nin\nperforming\npreventive\nand\ncorrective\nmaintenance servicing to electric generator.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1.\nPlan and prepare for work\n1.1\n\n1.2\n\n1.3\n\n1.4\nWork instruction is secured from\nimmediate superior following company\nstandard operating procedures (SOP)\nOccupational safety and health\nstandards are identified in line with job\nrequirements\nPersonal protective equipment (PPE)\nis identified and selected in line with job\nrequirements\nHand and special tools and test\ninstruments are identified and selected\nin line with job requirements\n2.\nPrepare hand and special\ntools and test instruments\n2.1\n\n2.2\n\n2.3\n2.4\nWork instruction is interpreted in line with\njob specifications\nOccupational safety and health\nstandards are complied with.\nPPE is used in line with job requirements\nHand and special tools and test\ninstruments are prepared in line with job\nrequirements\n\n--- PDF PAGE 55 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n53\n3.\nPerform preventive and\ncorrective maintenance\nservicing for electric\ngenerator components\n3.1\n\n3.2\n\n3.3\n\n3.4\nChecking procedure for generator is\nperformed in line with job requirements\nRefilling procedure for bearing lubricant\nis performed in line with job requirements\nPreventive and corrective\nmaintenance servicing procedure\nis performed in line with job requirements\nInsulation resistance measurement\nprocedure is performed in line with job\nrequirements\n4.\nPerform good housekeeping\n4.1\n\n4.2\n\n4.3\n\nWork area is cleaned following company\nSOP\nHand tools and test instruments are\ncleaned and stored following company\nSOP\nWork completion report is prepared and\nsubmitted to immediate supervisor\nfollowing company SOP.\n\n--- PDF PAGE 56 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n54\nRANGE OF VARIABLES\n1.\nOccupational safety and\nhealth standards\n\n1.1\n1.2\n1.3\nMay include but not limited to:\nSafety checklist accomplishment\nAvailability of PPE\nFlashlight\n2.\nPPE\n\n2.1\n2.2\n2.3\n2.4\n2.5\n2.6\n2.7\nMay include but not limited to:\nSafety helmet\nSteel toe safety shoes\nEye goggles\nGloves\nFace mask\nEar muff\nCoverall\n3.\nHand tools and test\ninstruments\n\n3.1\n3.2\n3.3\n3.4\nMay include but not limited to:\nStandard electrical hand tools\nMulti tester\nMegger tester\nClamp-on ammeter\n4.\nChecking procedures\n4.1\n4.2\nVisual\nPhysical\n5.\nGenerator\n5.1\n5.2\n5.3\n5.4\n\nShaft generator\nMain/auxiliary generator\n600 Volts and below\nEmergency generator\n6.\nLubricant\n6.1\n6.2\nGrease\nOil\n7.\nPreventive and corrective\nmaintenance servicing\nprocedure\n\n7.1\n7.2\n7.3\nMay include but not limited to:\nVentilation filters\nDamaged space heater\nDamaged circuit board\n\n--- PDF PAGE 57 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n55\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\n1.1\n\n1.2\n\n1.3\n\n1.4\n\nCompetency requires evidence that the\ncandidate:\nDemonstrates ability to plan and prepare\nfor work\nDemonstrates ability to prepare hand\ntools and test instruments\nDemonstrates ability to perform minor\nmaintenance servicing for electric\ngenerator components\nDemonstrates ability to perform good\nhousekeeping\n2. Underpinning knowledge\n2.1\n2.2\n\n2.3\n2.4\n\n2.5\n2.6\n2.7\n2.8\n\n2.9\nOccupational safety and health standards\nTypes and uses of hand tools and test\ninstruments\nManufacturer’s instructions manual\nProcedure for performing minor\nmaintenance servicing for electric\ngenerators\nCompany standard operating procedure\nSchematic diagram\nParts and functions of generators\nBasic troubleshooting procedure for\nspace heater\nBasic electrical calculations\n3. Underpinning Skills\n3.1\n\n3.2\n\n3.3\n3.4\n\n3.5\n\n3.6\n3.7\n\n3.8\n\n3.9\nComplying occupational health and safety\nstandards\nFollowing manufacturer’s instruction\nmanual\nUsing hand tools and test instruments\nPerforming procedure for minor\nmaintenance servicing for electric\ngenerators\nFollowing company standard operating\nprocedure\nInterpreting schematic diagram\nUnderstanding parts and functions of\ngenerators\nFollowing basic troubleshooting\nprocedure for space heater\nApplying basic electrical calculations\n\n--- PDF PAGE 58 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n56\n4. Resource implication\n\n4.1\n4.2\nThe following resources must be\nprovided:\nHand tools and test instruments\nAccess to vessel with electrical system\n5. Method of assessment\n\n5.1\n5.2\n5.3\n5.4\nCompetency may be assessed through:\nDemonstration with oral questioning\nThird party report\nWritten test\nPortfolio\n6. Context of assessment\n6.1\nCompetency may be assessed in the\nworkplace or in a simulated work\nenvironment\n\n--- PDF PAGE 59 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n57\nUNIT OF COMPETENCY: SERVICE MARINE ELECTRIC MOTORS\n\nUNIT CODE:"
