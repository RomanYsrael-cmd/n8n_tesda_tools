        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\n\n1.1\n\n1.2\n\n1.3\n\n1.4\nCompetency requires evidence that the\ncandidate:\nDemonstrates ability to plan and prepare\nfor work\nDemonstrates ability to prepare hand and\nspecial tools and test instruments and\nsupplies and materials\nDemonstrates ability to perform basic\nmaintenance for electric motor control\nand other basic electronic control\nsystems\nDemonstrates ability to perform good\nhousekeeping\n2. Underpinning knowledge\n2.1\n2.2\n\n2.3\n\n2.4\n\n2.5\nOccupational safety and health standards\nTypes and uses of hand and special tools\nand test instruments\nProcedure for performing basic\nmaintenance for electric motor controls\nand other basic electronic controls\nsystems\nTypes and functions of motor control\nsystems\nBasic calculations\n3. Underpinning Skills\n3.1\n\n3.2\n\n3.3\n\n3.4\n\n3.5\nComplying occupational safety and health\nstandards\nUsing hand and special tools and test\ninstruments\nPerforming basic maintenance procedure\nfor electric motor controls and other basic\nelectronic controls systems\nUnderstanding types and functions of\nmotor controls systems\nPerforming basic calculations\n4. Resource implication\n\n4.1\n\n4.2\n\n4.3\nThe following resources must be\nprovided:\nHand and special tools and test\ninstrument\nAccess to motor controls and other basic\nelectronic controls system\nRelevant supplies and materials\n\n--- PDF PAGE 81 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n79\n5. Method of assessment\n\n5.1\n5.2\n5.3\n5.4\nCompetency may be assessed through:\nDemonstration with oral questioning\nThird party report\nWritten test\nPortfolio\n6. Context of assessment\n6.1\nCompetency may be assessed at work in\nthe workplace or in a simulated work\nenvironment\n\n--- PDF PAGE 82 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n80\nUNIT OF COMPETENCY : SERVICE MARINE ELECTRICAL APPLIANCES\n\nUNIT CODE:"
        },
        "source_text": "MTM311305\n\nUNIT DESCRIPTOR: This unit of competency covers the knowledge, skills and\nattitudes in performing basic maintenance procedures for\nmotor controls and other electronic control systems\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1.\nPlan and prepare for work\n\n1.1\n\n1.2\n\n1.3\n\n1.4\nWork instruction is secured from immediate\nsuperior following company standard\noperating procedures (SOP)\nOccupational safety and health\nstandards are identified in line with job\nrequirements\nPersonal protective equipment (PPE) is\nidentified and selected in line with job\nrequirements\nHand and special tools and test\ninstruments and materials are identified\nand selected in line with job requirements\n2.\nPrepare hand and special\ntools and test instruments\n2.1\n\n2.2\n\n2.3\n2.4\nWork instruction is interpreted in line with\njob specifications\nOccupational safety and health standards\nare complied with.\nPPE is used in line with job requirements\nHand tools and test instruments are\nprepared in line with job requirements\n\n--- PDF PAGE 77 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n75\n3.\nPerform basic\nmaintenance\n3.1\n\n3.2\n\n3.3\n\nChecking procedure for electric motor\ncontrol and other basic electronic\ncontrol systems is performed in line with\njob requirements\nPreventive maintenance servicing\nprocedure for electric motor control and\nother electronic control systems is\nperformed in line with job requirements and\nas per PMS schedule\nCorrective maintenance servicing\nprocedure is performed in line with electric\nmotor control and other electronic control\nsystems fault.\n4.\nPerform good\nhousekeeping\n4.1\n\n4.2\n\n4.3\n\n4.4\nWork area is cleaned following company\nSOP\nHand and special tools and test\ninstruments are cleaned and stored\nfollowing company SOP\nWork completion report is prepared and\nsubmitted to immediate supervisor\nfollowing company SOP.\nPerform inventory report following\ncompany SOP\n\n--- PDF PAGE 78 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n76\nRANGE OF VARIABLES\n1.\nOccupational health and\nsafety standards\n\n1.1\n1.2\n1.3\nMay include but not limited to-\nSafety checklist accomplishment\nAvailability of PPE\nAvailability and functionality of fire\nextinguisher and flashlight\n2.\nPPE\n\n2.1\n2.2\n2.3\n2.4\n2.5\nMay include but not limited to:\nSafety helmet\nSteel toe safety shoes\nGloves\nEar muff\nCoverall\n3.\nHand and special tools and\ntest instruments\n\n3.1\n3.2\n3.3\n3.4\n3.5\nMay include but not limited to:\nStandard electrical hand tools\nMulti tester\nClamp meter\nMegger\nCalibrating instruments for sensors\n4.\nSupplies and materials\n\n4.1\n4.2\n4.3\n4.4\nMay include but not limited to:\nIndicator lamps\nBolts\nTerminal connectors\nSwitches\n5.\nChecking procedure\n4.1\n4.2\n\nVisual\nPhysical\n4.2.1 Use of multi tester\n4.2.2 Use of clamp meter\n4.2.3 Use of megger\n5.\nElectric motor controls\n\n5.1\n5.2\n\n5.3\n5.4\n5.5\nMay include but not limited to:\nPumps\nRefrigeration and air-conditioning\nequipment\nCranes\nElectrical appliances\nVentilation fans and blowers\n\n--- PDF PAGE 79 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n77\n6.\nBasic electronic control\nsystems\n\n6.1\n6.2\n6.3\n6.4\n6.5\nMay include but not limited to:\nLevel control system/bilges alarm\nBattery chargers\nFire alarm\nNavigation lights panel\nEngine room alarm\n7\nPreventive maintenance\nservicing procedure\n\n7.1\n7.2\n\n7.3\n7.4\nMay include but not limited to:\nTightening of terminal connections\nTightening of cable glands and cable\nentries\nCleaning of control panels\nRelamping indicator lamps\n8\nPMS Schedule\n8.1\n8.2\n8.3\n8.4\nMonthly\nQuarterly\nSemi-annually\nAnnually\n9.\nFault\n9.1\n9.2\n\nLoose connections\nDefective control components:\n9.2.1 Push buttons and selector switches\n9.2.2 Limit switches\n9.2.3 Proximity switches\n9.2.4 Pressure switches\n9.2.5 Temperature switches\n9.2.6 Relays and contactors\n\n--- PDF PAGE 80 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n78\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\n1.1\n\n1.2\n\n1.3\n\n1.4\nCompetency requires evidence that the\ncandidate:\nDemonstrates ability to plan and prepare\nfor work\nDemonstrates ability to prepare hand and\nspecial tools and test instruments and\nsupplies and materials\nDemonstrates ability to perform basic\nmaintenance for electric motor control\nand other basic electronic control\nsystems\nDemonstrates ability to perform good\nhousekeeping\n2. Underpinning knowledge\n2.1\n2.2\n\n2.3\n\n2.4\n\n2.5\nOccupational safety and health standards\nTypes and uses of hand and special tools\nand test instruments\nProcedure for performing basic\nmaintenance for electric motor controls\nand other basic electronic controls\nsystems\nTypes and functions of motor control\nsystems\nBasic calculations\n3. Underpinning Skills\n3.1\n\n3.2\n\n3.3\n\n3.4\n\n3.5\nComplying occupational safety and health\nstandards\nUsing hand and special tools and test\ninstruments\nPerforming basic maintenance procedure\nfor electric motor controls and other basic\nelectronic controls systems\nUnderstanding types and functions of\nmotor controls systems\nPerforming basic calculations\n4. Resource implication\n\n4.1\n\n4.2\n\n4.3\nThe following resources must be\nprovided:\nHand and special tools and test\ninstrument\nAccess to motor controls and other basic\nelectronic controls system\nRelevant supplies and materials\n\n--- PDF PAGE 81 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n79\n5. Method of assessment\n\n5.1\n5.2\n5.3\n5.4\nCompetency may be assessed through:\nDemonstration with oral questioning\nThird party report\nWritten test\nPortfolio\n6. Context of assessment\n6.1\nCompetency may be assessed at work in\nthe workplace or in a simulated work\nenvironment\n\n--- PDF PAGE 82 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n80\nUNIT OF COMPETENCY : SERVICE MARINE ELECTRICAL APPLIANCES\n\nUNIT CODE:"
