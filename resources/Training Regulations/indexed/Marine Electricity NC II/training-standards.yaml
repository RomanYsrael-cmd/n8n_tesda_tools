    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title: MARINE ELECTRICITY NC Level: NC II\n\nSuggested Nominal Training Duration:\n\n 18 Hours (Basic Competencies)\n 24 Hours (Common Competencies)\n 300 Hours (Core Competencies)\n\n 342 Hours –Total*\nCourse Description:\nThis course is designed to equip individual with operational skills, knowledge\nand attitudes in performing electrical work on board in accordance with industry\nstandards. It covers the basic, common and core competencies required of\nassistant marine electrician or cadet electrician to acquire.\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\n workplace\ncommunication\n1.1 Obtain and convey\n workplace\ninformation\n1.2 Complete relevant\nwork related\ndocuments\n1.3 Participate in work-\nplace meeting and\n discussion\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews /\nquestioning\n\n* This is the minimum training duration applicable to trainees with equivalent of one\nyear training/experience in industrial electricity (this would include graduates of\nelectrical or electronics engineering and licensed master electricians with\nexperience). This may be increased for programs intended for trainees with\nminimal or no training and experience in industrial electricity.\n\n--- PDF PAGE 92 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n90\n2. Work in a team\nenvironment\n2.1 Describe and\nidentify team role\nand responsibility\nin a team\n2.2 Describe work as a\nteam member\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews /\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational\ngoals.\n3.2 Set and meet work\npriorities\n3.3 Maintain\nprofessional\ngrowth and\ndevelopment.\n\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard\nand risks\n4.2 Control hazards\nand risks\n4.3 Maintain\noccupational\nhealth and safety\nawareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 93 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n91\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Launch survival\ncraft and rescue\nboats /\nlife boats\n1.1 Identify the\nvarious types of\nsurvival craft,\nrescue boats / life\n boats\n1.2 Operate the\nvarious types\nof life saving and\nsurvival\n equipment\n1.3 Participate in\nabandon vessel\n musters and drills\n1.4 Communicate\neffectively with\nothers during\nsurvival operation\n• Discussion\n• Lecture\n• Demonstration\n• Written\n• Questioning\n• Observation\n• Practical\nperformance\n\n--- PDF PAGE 94 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n92\n2. Prevent and fight\nfire\n2.1 Implement fire\nprevention\nmeasures and\nprocedures on\nboard a vessel.\n2.2 Check the\ncapability of fire\ndetection and fire\nfighting equipment\nand system.\nInitiate any\nrequired\nmaintenance\n2.3 Simulate on board\nfire fighting and\nsearch and rescue\nactivities\n2.4 Implement OHS\nprinciples and\npolicies when\ncarrying out fire\nfighting duties\n2.5 Communicate\neffectively with\n others during fire\nemergencies\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Observation\n• Demonstration\n• Practical\n performance\n\n--- PDF PAGE 95 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n93\n3. Perform survival\ntechniques\nduring ship\nabandonment\n3.1 Identify the\ndifferent\n emergency\n conditions to\n minimize\n potential dangers /\n threats to others\n3.2 Identify the\ndifferent types and\nmethods of\nboarding survival\ncraft and ancillary\nsurvival equipment\n3.3 Operate various\ntypes of\n survival equipment\nin accordance with\n instructions\n3.4 Simulate in\nabandon vessels\n musters and drills\n3.5 Communicate\neffectively with\n others in operating\nsurvival craft and\n ancillary survival\n equipment\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\n performance\n4. Perform first aid\ntreatment on\nboard\n4.1 Simulate\nimmediate life-\nsaving first aid\n4.2 Simulate action on\nrecognized\nsymptoms and\nacute illness /\ninjury\n4.3 Simulate action on\nwounds, bleeding,\nburns, bone, joint\nand muscle\ninjuries\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\n performance\n\n--- PDF PAGE 96 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n94\n5. Protect marine\nenvironment\n5.1 Simulate garbage\ndisposal\nProcedures\n5.2 Simulate garbage\nsegregation\n5.3 Record garbage\nsegregation and\ndisposal\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\n performance\n6. Comply with\nemergency\nprocedures\n6.1 Simulate correct\naction on\nbecoming aware of\nan emergency in\naccordance with\nvessel procedures\n6.2 Simulate\nemergency\nprocedures and\ncontingency plans\n6.3 Simulate\nprocedures for the\n use of various\nsurvival\n equipment\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n7. Conduct\nshipboard\nsecurity check\n7.1 Simulate access\nand\n identification\nsystem for visitors\n and clients\n7.2 Simulate SOPs in\nchecking\n entry of incoming /\noutgoing\n deliveries and\ncompany\n properties, bodily\nsearch, luggage /\n baggage, bags\nand parcels\n7.3 Maintain visitor’s\nlogbook, incident\n report and all keys\nand locks are\n accounted for\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\n performance\n\n--- PDF PAGE 97 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n95\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Service marine\nelectric generators\n\n1.1 Plan and prepare\nfor work\n1.2 Prepare hand tools\nand test\ninstruments\n1.3 Perform preventive\nand corrective\nmaintenance\nservicing for electric\ngenerator\ncomponents\n1.4 Perform good\nhousekeeping\n\n• Demonstration\n• Discussion\n• Shipboard\nvisitation\n(educational\ntours)\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n• Written test\n2. Service marine\nelectric motors\n\n2.1 Plan and prepare\nfor work\n2.2 Prepare hand tools\nand special and test\ninstruments\n2.3 Perform preventive\nand corrective\nmaintenance\nservicing for electric\nmotors\n2.4 Perform good\nhousekeeping\n\n• Demonstration\n• Discussion\n• Shipboard\nvisitation\n(educational\ntours)\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n• Written test\n3. Service marine\nlighting system\n\n3.1 Plan and prepare\nfor work\n3.2 Prepare hand tools\nand special and test\ninstruments\n3.3 Perform preventive\nand corrective\nmaintenance\nservicing for lighting\nsystem\n3.4 Perform good\nhousekeeping\n• Demonstration\n• Discussion\n• Shipboard\nvisitation\n(educational\ntours)\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n• Written test\n\n--- PDF PAGE 98 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n96\n4. Service and\nmaintain marine\nbatteries\n\n4.1 Plan and prepare\nfor work\n4.2 Prepare hand and\nspecial tools and\ntest instruments\n4.3 Service and\nmaintain batteries\n4.4 Perform good\nhousekeeping\n• Demonstration\n• Discussion\n• Shipboard\nvisitation\n(educational\ntours)\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n• Written test\n5. Maintain marine\nmotor controls\nand other basic\nelectronic control\nsystem\n\n5.1 Plan and prepare\nfor work\n5.2 Prepare hand and\nspecial tools and\ntest instruments\n5.3 Perform basic\nmaintenance\n5.4 Perform good\nhousekeeping\n• Demonstration\n• Discussion\n• Shipboard\nvisitation\n(educational\ntours)\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n• Written test\n6. Service marine\nelectrical\nappliances\n\n6.1 Plan and prepare\nfor work\n6.2 Prepare hand tools\nand special and test\ninstruments\n6.3 Perform preventive\nand corrective\nservicing for\nelectrical\nappliances\n6.4 Perform good\nhousekeeping\n• Demonstration\n• Discussion\n• Shipboard\nvisitation\n(educational\ntours)\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n• Written test\n7. Maintain basic\nalarms systems\non board ship\n\n7.1 Plan and prepare\nfor work\n7.2 Prepare hand and\nspecial tools and\ntest instruments\n7.3 Perform testing and\nrepair of alarm\nsystem\n7.4 Perform good\nhousekeeping\n• Demonstration\n• Discussion\n• Shipboard\nvisitation\n(educational\ntours)\n• Observation\n• Practical\ndemonstration\nand oral\nexamination\n• Written test\n\n--- PDF PAGE 99 ---\n_____________________________________________________________________\nTR- Marine Electricity NC II Promulgated September 2008\n97"
