    {
      "number": "4",
      "text": "1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "number": "4.1",
      "text": "1 To attain the national qualification of Community Nutrition Services NC II, the candidate must demonstrate competence in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General."
    },
    {
      "number": "4.1",
      "text": "2 Assessment shall cover all competencies with basic and common integrated or assess concurrently with the core units of competency."
    },
    {
      "number": "4.1",
      "text": "3 Any of the following are qualified to apply for assessment and certification:"
    },
    {
      "number": "4.1",
      "text": "3.1 Graduates of WTR-, NTR-registered programs or formal/non- formal/informal including institution-based trainings, community- based trainings or government/NGOs sponsored trainings related to Community Nutrition Services NC II; or"
    },
    {
      "number": "4.1",
      "text": "3.2 Experienced volunteer workers who gained competencies in providing community nutrition services for at least 1 year of continuous service in the last 3 years. A document or proof issued by barangay or local government unit (LGU) must be shown."
    },
    {
      "number": "4.1",
      "text": "4 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences in community nutrition services, for at least 3 years within the last 6 years, may apply for recognition in this Qualification through Portfolio Assessment. The conduct of Portfolio Assessment is subject to TESDA Circular No. 118 series of 2019."
    },
    {
      "number": "4",
      "text": "2 COMPETENCY ASSESSMENT REQUISITE"
    },
    {
      "number": "4.2",
      "text": "1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. --- PDF PAGE 159 --- Community Nutrition Services NC II – HHCCNS222 Promulgated (05/2022) 155 This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior"
    },
    {
      "number": "4.2",
      "text": "2 Accredited Assessment Center (AAC). Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality-assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. Educational/training institutions providing training related to community nutrition that passed the requirements based on the Operating Procedure or existing guidelines may be accredited as Assessment Centers or Designated Assessment Venues (DAV)."
    },
    {
