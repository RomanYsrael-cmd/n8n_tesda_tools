    {
      "number": "1",
      "text": "Acute Malnutrition - occurs when an individual suffers from current, severe nutritional restrictions, a recent bout of illness, inappropriate childcare practices or a combination of these factors."
    },
    {
      "number": "2",
      "text": "Age-in-days - the number of days from the child’s birth up to the date of measurement."
    },
    {
      "number": "3",
      "text": "Annual Investment Plan - refers to the annual slice of the Local Development Investment Program (LDIP), which constitutes the total resource requirements for all Programs, Projects and Activities (PPAs) consisting of the annual capital expenditure and regular operating requirements of the LGU."
    },
    {
      "number": "4",
      "text": "Anthropometric equipment - a measuring tool or device used to measure body dimensions."
    },
    {
      "number": "5",
      "text": "Anthropometric measurements - measures that are used to assess the size, shape, and composition of the human body."
    },
    {
      "number": "6",
      "text": "Barangay Nutrition Action Plan - local version of the Philippine Plan of Action for Nutrition (PPAN) and is formulated by the Barangay Nutrition Committee. It contains programs, projects, and activities for nutrition improvement."
    },
    {
      "number": "7",
      "text": "Barangay Nutrition Committee - is an organization at the barangay tasked to plan, implement, monitor, evaluate and coordinate the barangay nutrition action plan (BNAP)."
    },
    {
      "number": "8",
      "text": "Barangay Nutrition Scholar - barangay-based volunteer worker responsible for the delivery of nutrition and nutrition-related services in the community."
    },
    {
      "number": "9",
      "text": "Baseline - benchmark that is used as a basis for measuring or comparing past, current and future past values."
    },
    {
      "number": "10",
      "text": "Breast milk expression - a technique using the hand, manual pump, or automatic electric breast pump to express breastmilk from the breasts."
    },
    {
      "number": "11",
      "text": "Body height (standing) - body length in an upright or standing position."
    },
    {
      "number": "12",
      "text": "Body weight - amount or quantity of heaviness or mass of a person."
    },
    {
      "number": "13",
      "text": "Breastfeeding - unequalled way of providing ideal food for the healthy growth and development of infants. It is also an integral part of the reproductive process with important implications for the health of mothers."
    },
    {
      "number": "14",
      "text": "Calibration standard - used as a reference to compare against an instrument's response."
    },
    {
      "number": "15",
      "text": "Child Growth Standards - standards of growth for all children based on breastfed infants and appropriately fed children of different ethnic origins raised in optimal conditions and measured in a standardized way. Its development was based on the WHO Multicenter Growth Reference Study (WHO)."
    },
    {
      "number": "16",
      "text": "Clients – refer to the target group for a nutrition intervention, such as mothers or caregivers, fathers, children under five years old."
    },
    {
      "number": "17",
      "text": "Community nutrition assessment - the process of collecting, processing, analyzing, and interpreting information on the nutrition problem obtained from anthropometric, biochemical, clinical, and dietary methods. --- PDF PAGE 164 --- Community Nutrition Services NC II – HHCCNS222 Promulgated (05/2022) 160"
    },
    {
      "number": "18",
      "text": "Compendium of Actions on Nutrition - a tool for local government unit (LGU) mobilization which summarizes the nutrition journey of 11 high performing LGUs along nutrition program management."
    },
    {
      "number": "19",
      "text": "Compendium of Local Ordinances and Issuances on Nutrition – a knowledge- sharing platform for local government units to learn from initiatives of local government units who have successfully harnessed the strength of policy instruments in scaling up nutrition."
    },
    {
      "number": "20",
      "text": "Complementary Feeding - giving of solid and semi-solid foods to infants to complement nutrients from breastmilk to meet the infant’s nutritional requirements."
    },
    {
      "number": "21",
      "text": "Counseling (nutrition) - a “two-way interaction through which a client and a trained counselor interpret the results of nutrition assessment, identify individual nutrition needs and goals, discuss ways to meet those goals, and agree on next steps. Nutrition counseling aims to help clients understand important information about their health and focuses on practical actions to address nutrition needs, as well as the benefits of behavior change."
    },
    {
      "number": "22",
      "text": "Cycle menu - refers to a list of dishes to be served at a meal over a specified period. It is called a cycle menu, because a dish can be served in certain intervals, preferably odd-numbered days."
    },
    {
      "number": "23",
      "text": "Dietary Supplementation Program - aims to supplement the diets of nutritionally vulnerable groups, particularly pregnant women, and infants 6-23 months old in food-insecure households, and wasted school children, especially those from very poor households. It also aims to supplement the diets of children enrolled in daycare centers."
    },
    {
      "number": "24",
      "text": "e-OPT Plus tool - an Excel-based electronic system that makes data collection, calculation, and reporting for Operation Timbang Plus activity more efficient and accurate."
    },
    {
      "number": "25",
      "text": "Early Childhood Care and Development - holistic development of children including physical, cognitive, language, social and emotional development from conception to eight (8) years old."
    },
    {
      "number": "26",
      "text": "Evaluation - systematic assessment of program implementation using a set of criteria or standards, usually with reference to the objectives. It aims to understand the factors contributing to such success or failure so as to better improve the program."
    },
    {
      "number": "27",
      "text": "Exclusive breastfeeding - is giving the infant no other food or drink, not even water, except breast milk (including milk expressed or from a wet nurse) for the first six months of life, but allows the infant to receive oral rehydration solution, drops and syrups, e.g., vitamins, minerals, and medicines."
    },
    {
      "number": "28",
      "text": "Family Profile – defined as a record of basic information about the preschoolers and the family they belong to, collected using BNS Form No. 1A."
    },
    {
      "number": "29",
      "text": "First 1,000 Days - period from conception to a child’s first two years of life and is considered the “golden window of opportunity” for the child to achieve his or her full potential in the different aspects of development."
    },
    {
      "number": "30",
      "text": "First In, First Out System - a stock rotation system used for food storage wherein food with the nearest best before or use-by dates are used or sold first. --- PDF PAGE 165 --- Community Nutrition Services NC II – HHCCNS222 Promulgated (05/2022) 161"
    },
    {
      "number": "31",
      "text": "Growth Monitoring and Promotion - serial monitoring of a child’s weight in the Barangay Health Center (BHC) or Rural Health Unit (RHU) aided by the ECCD card."
    },
    {
      "number": "32",
      "text": "Hanging weighing scale - an equipment used to measure a child's weight."
    },
    {
      "number": "33",
      "text": "Height board - an equipment used to measure a child's height or length."
    },
    {
      "number": "34",
      "text": "Home and community gardening - refers to the promotion of the growing of fruits and vegetables and care of small animals like chicken in home yards or common spaces in the community. Promotion activities can include the distribution of seeds, seedlings and small animals; and provision of technical advice on the care of these fruits and vegetables, and small animals."
    },
    {
      "number": "35",
      "text": "Information, Education, and Communication materials - print materials that are intended to draw attention to information about health and nutrition information."
    },
    {
      "number": "36",
      "text": "Infant and Young Child Feeding - focuses on nutritional needs and feeding practices in children less than two years of age – the most critical period for child nutrition after which sub-optimal growth is hard to reverse."
    },
    {
      "number": "37",
      "text": "Integrated Management of Acute Malnutrition - aims to locate the acutely malnourished especially those with severe acute malnutrition, and to provide the needed medical and nutritional intervention."
    },
    {
      "number": "38",
      "text": "Integrated Management of Childhood Illness - a strategy to reduce under-five mortality caused by diarrhea and dehydration, pneumonia, measles, malaria, dengue hemorrhagic fever and malnutrition and anemia."
    },
    {
      "number": "39",
      "text": "Inpatient Therapeutic Care - involves management of complicated cases of SAM according to WHO protocols on an inpatient basis at facilities with appropriate capacity (hospitals)."
    },
    {
      "number": "40",
      "text": "Length (recumbent) - analogous measure for the height of children less than two years of age; taken while the child is lying down."
    },
    {
      "number": "41",
      "text": "Malnutrition - refers to deficiencies, excesses, or imbalances in a person's intake of protein and/or nutrients covering both undernutrition which includes suboptimal breastfeeding, stunting, wasting or thinness, underweight and micronutrient deficiencies, or insufficiencies, as well as overnutrition, which includes overweight and obesity."
    },
    {
      "number": "42",
      "text": "Mandatory Food Fortification - involves the addition of one or more nutrients to rice, flour, cooking oil as mandated by Republic Act 8976 and to salt as mandated by Republic Act 8172, or as prescribed by the NNC Governing Board."
    },
    {
      "number": "43",
      "text": "Micronutrient Supplementation - a short- to medium-term intervention, intended to prevent and/or correct high levels of micronutrient deficiencies by providing large doses of micronutrients immediately until more sustainable food-based approaches (e.g., food fortification and diet diversification) are put in place and become effective."
    },
    {
      "number": "44",
      "text": "Mid-upper arm circumference- circumference of the left upper arm, measured at the mid-point between the tip of the shoulder and the tip of the elbow (olecranon process and the acronium). Its utility is in identifying children who are not only wasted but are also at high risk of dying."
    },
    {
      "number": "45",
      "text": "Mixed feeding - a practice of feeding a baby with formula milk as well as breast milk. --- PDF PAGE 166 --- Community Nutrition Services NC II – HHCCNS222 Promulgated (05/2022) 162"
    },
    {
      "number": "46",
      "text": "Moderate acute malnutrition (MAM) - means weight of children under 5 years is between 70% and 80% of the median weight-for-height or between -3 and -2 Z- scores weight-for-height."
    },
    {
      "number": "47",
      "text": "Monitoring - process of observing and checking the progress of the program being implemented in meeting the objectives and performance targets. It is done regularly."
    },
    {
      "number": "48",
      "text": "National Nutrition Promotion Program on Behavior Change - aims to facilitate the adoption of positive practices that will impact on nutrition. It also aims to raise consciousness on the importance of improving nutrition and ensure that the various nutrition-specific services are supported with appropriate communication activities either as a separate complementary activity or as an activity integral to the service."
    },
    {
      "number": "49",
      "text": "Nutritional status - condition of the body resulting from the intake, absorption and utilization of food."
    },
    {
      "number": "50",
      "text": "Nutritionally at-risk pregnant women - are those with a low pre-pregnancy body mass index (BMI), or those who do not gain sufficient weight during pregnancy, with any of the following predisposing factors: narrowly-spaced pregnancies and births, situated in families with low income, with large number of dependents where food purchase is an economic problem, has previously given birth to a preterm or low birth weight infant, or other unfavorable prognostic factors, such as obesity or anemia, with diseases which influence nutritional status such as diabetes, tuberculosis, drug addiction, alcoholism, and mental disorder."
    },
    {
      "number": "51",
      "text": "Nutrition education - any combination of educational strategies, accompanied by environmental supports, designed to facilitate the voluntary adoption of food choices and other food- and nutrition-related behaviors conducive to health and well-being. It is delivered through multiple venues and involves activities at the individual, community, and policy levels. It aims to provide people in rural and urban areas with adequate information, skills and motivation to procure and to consume appropriate diets."
    },
    {
      "number": "52",
      "text": "Nutrition intervention - is defined as any program, project or activity that will contribute or improve the nutrition situation."
    },
    {
      "number": "53",
      "text": "Nutrition program management - is a decision-making process of identifying potential nutrition problems and needs of a specific population group; analyzing possible ways of preventing and controlling malnutrition; allocating resources based on needs and expectations; and taking deliberate action to address nutritional problems, including those related to monitoring and evaluation."
    },
    {
      "number": "54",
      "text": "Nutrition sensitive interventions - interventions that have other objectives but have been tweaked to contribute to nutritional outcomes."
    },
    {
      "number": "55",
      "text": "Nutrition specific interventions - interventions that address the immediate causes of undernutrition most of which are in the health sector."
    },
    {
      "number": "56",
      "text": "Nutrition in Emergencies - key nutrition services that are components of emergency preparedness, response, and recovery phases aimed at preventing death and worsening of malnutrition in the affected population, particularly in the most nutritionally vulnerable groups: infants, children, pregnant women and breastfeeding mothers, and older persons. --- PDF PAGE 167 --- Community Nutrition Services NC II – HHCCNS222 Promulgated (05/2022) 163"
    },
    {
      "number": "57",
      "text": "Obese Children - children aged zero to fifty-nine (0-59) months whose weight for length/height is above three (3) standard deviations from the median of the WHO Child Growth Standards."
    },
    {
      "number": "58",
      "text": "Outpatient Therapeutic Care - involves the management of non-complicated cases of SAM in outpatient care using ready-to-use therapeutic foods (RUTF) provided on a weekly/ biweekly basis."
    },
    {
      "number": "59",
      "text": "Operation Timbang Plus - annual mass weighing of all preschoolers 0-71 months old in a community to identify and locate the malnourished children."
    },
    {
      "number": "60",
      "text": "Overweight Children- children aged zero to fifty-nine (0-59) months whose weight for length/height is above two (2) standard deviations from the median of the WHO Child Growth Standards."
    },
    {
      "number": "61",
      "text": "Overweight and Obesity Management and Prevention Program - aims to prevent an increase in overweight and obesity among children 0-10 years old and decrease prevalence rates among the rest of the population."
    },
    {
      "number": "62",
      "text": "Philippine Plan of Action for Nutrition - the framework for nutrition actions in the country (Philippines). It identifies priority actions to achieve the outcomes. It should serve as a guide to LGUs, NGOs and all related stakeholders in planning for nutrition."
    },
    {
      "number": "63",
      "text": "Ready-to-Use Supplementary Food - highly fortified, nutrient dense pastes specifically designed for prevention and treatment of moderate acute malnutrition among children over 6 months."
    },
    {
      "number": "64",
      "text": "Ready-to-Use Therapeutic Food - energy-dense, mineral- and vitamin-enriched food that requires no preparation and is specifically designed to treat severe acute malnutrition (SAM)."
    },
    {
      "number": "65",
      "text": "Referral System - involves sending or referring a client or patient from a community to a healthcare facility for proper management of a specific health and/or nutrition problem."
    },
    {
      "number": "66",
      "text": "Repayment scheme - a mandatory sharing system wherein beneficiaries of inputs should return a certain quantity for re-dispersal to other families."
    },
    {
      "number": "67",
      "text": "Resource mobilization – refers to activities that aim to mobilize and generate human and financial resources"
    },
    {
      "number": "68",
      "text": "Severe Acute Malnutrition - refers to children aged 0-59 months with very low weight for length/height, defined as less than three SD below the median (<-3SD) of the WHO Growth Standards, characterized by visible severe wasting, the presence of bipedal pitting edema, or a MUAC measurement of less than one hundred fifteen millimeters (<115mm)."
    },
    {
      "number": "69",
      "text": "Spot map - an aerial view of the barangay, where the important characteristics of the barangay are indicated; it is a graphical presentation of the current nutrition situation of a barangay."
    },
    {
      "number": "70",
      "text": "Stunted - children aged 0-59 months whose height for age is below minus two (2) standard deviations (for moderate stunting) and minus three (3) standard deviations (for severe stunting) from the median of the WHO Growth Standards."
    },
    {
      "number": "71",
      "text": "Underweight - children aged 0-59 whose weight for age is below minus 2 standard deviations and minus three (3) standard deviations (for severely underweight) from the median of the WHO Growth Standards. --- PDF PAGE 168 --- Community Nutrition Services NC II – HHCCNS222 Promulgated (05/2022) 164"
    },
    {
      "number": "72",
      "text": "Wasted - a child's weight is less than expected for his/her height (underweight- for-height); indicates acute deprivation of food or bout of current infection or illness."
    },
    {
      "number": "73",
      "text": "Wall chart - is a large chart on which words are written in letters large enough for a group to read even from a distance. It is used to track progress of accomplishments of nutrition projects or activities."
    },
    {
