      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the national qualification of Community Nutrition Services NC II, the candidate must demonstrate competence in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 Assessment shall cover all competencies with basic and common integrated or assess concurrently with the core units of competency. 4.1.3 Any of the following are qualified to apply for assessment and certification: 4.1.3.1 Graduates of WTR-, NTR-registered programs or formal/non- formal/informal including institution-based trainings, community- based trainings or government/NGOs sponsored trainings related to Community Nutrition Services NC II; or 4.1.3.2 Experienced volunteer workers who gained competencies in providing community nutrition services for at least 1 year of continuous service in the last 3 years. A document or proof issued by barangay or local government unit (LGU) must be shown. 4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, previous work or life experiences in community nutrition services, for at least 3 years within the last 6 years, may apply for recognition in this Qualification through Portfolio Assessment. The conduct of Portfolio Assessment is subject to TESDA Circular No. 118 series of 2019."
