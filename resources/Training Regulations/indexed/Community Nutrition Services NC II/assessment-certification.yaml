  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the national qualification of Community Nutrition Services NC II, the\ncandidate must demonstrate competence in all units listed in Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.1.2 Assessment shall cover all competencies with basic and common integrated\nor assess concurrently with the core units of competency.\n\n4.1.3 Any of the following are qualified to apply for assessment and certification:\n\n4.1.3.1 Graduates of WTR-, NTR-registered programs or formal/non-\nformal/informal including institution-based trainings, community-\nbased trainings or government/NGOs sponsored trainings related to\nCommunity Nutrition Services NC II; or\n\n4.1.3.2 Experienced volunteer workers who gained competencies in\nproviding community nutrition services for at least 1 year of\ncontinuous service in the last 3 years. A document or proof issued\nby barangay or local government unit (LGU) must be shown.\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, previous work or life\nexperiences in community nutrition services, for at least 3 years within the\nlast 6 years, may apply for recognition in this Qualification through Portfolio\nAssessment. The conduct of Portfolio Assessment is subject to TESDA\nCircular No. 118 series of 2019.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n--- PDF PAGE 159 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n155\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior\n\n4.2.2\nAccredited Assessment Center (AAC). Only Assessment Center\naccredited by TESDA is authorized to conduct competency assessment.\nAssessment\ncenters\nundergo\na\nquality-assured\nprocedure\nfor\naccreditation before they are authorized by TESDA to manage the\nassessment for National Certification.\n\nEducational/training institutions providing training related to community\nnutrition that passed the requirements based on the Operating Procedure\nor existing guidelines may be accredited as Assessment Centers or\nDesignated Assessment Venues (DAV).\n\n4.2.3\nAccredited Competency Assessor. Only an accredited competency\nassessor is authorized to conduct an assessment of competence.\nCompetency assessors undergo a quality-assured system of accreditation\nprocedures before they are authorized by TESDA to assess the\ncompetencies of candidates for National Certification.\n\nThe qualifications of Competency Assessors are specified in TESDA’s\nImplementing Guidelines on the Deployment of Training Regulations (TR)\nand Competency Assessment Tools (CATs) for Community Nutrition\nServices NC II.\n\n--- PDF P