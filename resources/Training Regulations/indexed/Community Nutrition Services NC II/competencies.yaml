          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Coordinate with \nthe punong \nbarangay in \norganizing or \nreactivating the \nBarangay \nNutrition \nCommittee \n(BNC) \n \n1.1 The organization/ \nreactivation of the \nBarangay Nutrition \nCommittee is \ncoordinated with the \nPunong Barangay \nfollowing guidelines on \nestablishing \nfunctional local \nnutrition committees. \n1.2 The Punong Barangay \nis assisted in \nidentifying members \nand informed them of \nthe functions of the \nBarangay Nutrition \nCommittee following \nguidelines. \n1.3  Documentation of the \nBarangay Nutrition \nCommittee \norganization is \nprepared and \nsubmitted following \nworkplace \nrequirements. \n1.4  MELLPI PRO and LNC \nfunctionality \nchecklist is discussed \nwith the committee \nmembers following \nestablished \nprocedures. \n1.5 The Barangay Nutrition \nAction Officer (BNAO) \n(if available) and BNC \nChairperson are \nSCIENCE \n1.1 Policies/guidelines \non establishing local \nnutrition committees \n1.2 Indicators and \ndimensions in the \nMELLPI Pro tool for \nBarangay and Local \nNutrition Committee \n(LNC) functionality \nchecklist  \n1.3 Purpose and \nfunctions of the \nBarangay Nutrition \nCommittee  \n1.4 Organizational set-\nup of the Barangay \nNutrition Committee \n1.5 Phase 1 of Barangay \nNutrition Program \nManagement and \nkey activities \nCOMMUNICATION \n1.6 Presentation on \nBarangay Nutrition \nCommittee’s \ncomposition and \nfunctions \n1.7 Documentation of \nBarangay Nutrition \nCommittee \nOrganization \n1.1 Coordinating \nwith appropriate \nnutrition workers \n1.2 Demonstrating \ninterpersonal \nskills \n1.3 Advocating for \ninvestment on \nnutrition\n\n--- PDF PAGE 77 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n73 \n \nELEMENT \nPERFORMANCE  \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nassisted in coordin