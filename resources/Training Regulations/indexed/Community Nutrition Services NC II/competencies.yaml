  "source_section_text": "Section 1.\nSuccessful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.1.2 Assessment shall cover all competencies with basic and common integrated\nor assess concurrently with the core units of competency.\n\n4.1.3 Any of the following are qualified to apply for assessment and certification:\n\n4.1.3.1 Graduates of WTR-, NTR-registered programs or formal/non-\nformal/informal including institution-based trainings, community-\nbased trainings or government/NGOs sponsored trainings related to\nCommunity Nutrition Services NC II; or\n\n4.1.3.2 Experienced volunteer workers who gained competencies in\nproviding community nutrition services for at least 1 year of\ncontinuous service in the last 3 years. A document or proof issued\nby barangay or local government unit (LGU) must be shown.\n\n4.1.4 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through education, informal training, previous work or life\nexperiences in community nutrition services, for at least 3 years within the\nlast 6 years, may apply for recognition in this Qualification through Portfolio\nAssessment. The conduct of Portfolio Assessment is subject to TESDA\nCircular No. 118 series of 2019.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\n--- PDF PAGE 159 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n155\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior\n\n4.2.2\nAccredited Assessment Center (AAC). Only Assessment Center\naccredited by TESDA is authorized to conduct competency assessment.\nAssessment\ncenters\nundergo\na\nquality-assured\nprocedure\nfor\naccreditation before they are authorized by TESDA to manage the\nassessment for National Certification.\n\nEducational/training institutions providing training related to community\nnutrition that passed the requirements based on the Operating Procedure\nor existing guidelines may be accredited as Assessment Centers or\nDesignated Assessment Venues (DAV).\n\n4.2.3\nAccredited Competency Assessor. Only an accredited competency\nassessor is authorized to conduct an assessment of competence.\nCompetency assessors undergo a quality-assured system of accreditation\nprocedures before they are authorized by TESDA to assess the\ncompetencies of candidates for National Certification.\n\nThe qualifications of Competency Assessors are specified in TESDA’s\nImplementing Guidelines on the Deployment of Training Regulations (TR)\nand Competency Assessment Tools (CATs) for Community Nutrition\nServices NC II.\n\n--- PDF PAGE 160 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n156\n\nMaintain instruments\nand equipment in\nwork area\nAssist in dental\nlaboratory\nprocedures\nAssist with\nadministration in\ndental laboratory\npractice\nImplement and\nmonitor infection\ncontrol policies and\nprocedures\nRespond effectively\nto difficult/\nchallenging\nbehavior\nApply basic first\naid\nMaintain high\nstandard of\npatient / client\nservices\nApply quality\nstandards\nMaintain a safe,\nclean and\nefficient\nenvironment\nMaintain an\neffective\nrelationship with\nclients/ customers\n(marketing)\n\nUpdate industry\nknowledge and\npractice through\ncontinuing education\nUse pharmaceutical\ncalculation\ntechniques and\nterminologies\nMaintain an\neffective\nrelationship with\ncustomers and\nclients\nManage own\nperformance\nFollow occupational\nhealth and safety\npolicies in dental\nlaboratory facilities\nMaintain\ninfection control\nin dental\npractice\nOperate a\npersonal\ncomputer\nPerform\nworkplace\nsecurity and\nsafety practices\nPerform computer\noperations\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine problems\nEnhance self-\nmanagement skills\nSupport Innovation\nAccess and\nmaintain information\nFollow occupational safety\nand health policies and\nprocedures\nApply environmental\nwork standards\nAdopt entrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nSolve/address\ngeneral workplace\nproblems\nDevelop career\nand life decisions\nContribute to\nworkplace innovation\nPresent relevant\ninformation\nPractice occupational\nsafety and health policies\nand procedures\nExercise efficient and\neffective sustainable\npractices in the\nworkplace\nPractice\nentrepreneurial skills\nin the workplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-solving\ntechniques in the\nworkplace\nWork in a diverse\nenvironment\nPropose methods of\napplying learning and\ninnovation in the\norganization\nUse information\nsystematically\nEvaluate occupational\nsafety and health work\npractices\nEvaluate\nenvironmental work\npractices\nFacilitate\nentrepreneurial skills\nfor micro-small-\nmedium enterprises\n(MSMEs)\nUtilize specialized\ncommunication\nskill\nDevelop and\nlead teams\nPerform higher\norder thinking\nprocesses and\napply techniques in\nthe workplace\nContribute to the\npractice of social\njustice in the\nworkplace\nManage innovative\nwork instructions\nManage and\nevaluate usage of\ninformation\nLead in improvement of\nOccupational Safety and\nHealth Program, Policies\nand Procedures\nLead towards\nimprovement of\nenvironmental work\nprograms, policies\nand procedures\nSustain\nentrepreneurial skills\nManage and\nsustain effective\ncommunication\nstrategies\nManage and\nsustain high\nperforming\nteams\nEvaluate higher\norder thinking skills\nand adjust problem\nsolving techniques\nAdvocate strategic\nthinking for global\ncitizenship\nIncorporate\ninnovation into work\nprocedures\nDevelop systems in\nmanaging and\nmaintaining\ninformation\nManage implementation of\noccupational safety and\nhealth programs in the\nworkplace\nManage\nimplementation of\nenvironmental\nprograms in the\nworkplace\nDevelop and sustain a\nhigh-performing\nenterprise\nCOMPETENCY MAP – HUMAN HEALTH/HEALTH CARE SECTOR\nCOMMUNITY NUTRITION SERVICES NC II\nBASIC\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\n\n--- PDF PAGE 161 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n157\n\nPrepare and\nmaintain beds\nCollect and\nmaintain linen\nstocks at end-\nusers location\nAssist in patient\nmobility\nAssist in\ntransporting\npatients\nAssist in bio-\npsychosocial\nsupport care of\npatients\nHandle waste in a\nhealth care\nenvironment\nPlan the hilot wellness\nprogram of client/s\nProvide pre-\nservice to hilot\nclient/s\nApply hilot\nwellness\nmassage\ntechniques\nProvide post\nadvice and post-\nservices to hilot\nclients\nPractice good\nhousekeeping\nMonitor supply/\ninventory of\npharmaceutical\nproducts\nHandle and control\npharmaceutical\nproducts\nArrange and display\npharmaceutical\nproducts\nPerform good\nlaboratory\npractices\nAdhere to good\nmanufacturing\npractices\nDemonstrate product\nknowledge on\nmedicines\nDispense\npharmaceutical\nproducts\nPerform health\npromotion\neducation,\nvigilance\nInstall biomedical\nequipment\nPerform corrective\nmaintenance on\nbiomedical\nequipment\nPerform\npreventive\nmaintenance on\nbiomedical\nequipment\nRepair\nbiomedical\nequipment\nAssess and refer\nbiomedical\nequipment\nDevelop massage\npractice\nPerform client\nconsultation\nPerform body\nmassage and work\narea\nMaintain and\norganize tools,\nequipment,\nsupplies\nPerform basic life\nsupport\nMaintain life\nsupport\nequipment and\nresources\nImplement safe\naccess and\nextrication\nprocedures in an\nemergency\nManage request\nfor ambulance\nservice\nAllocate\nambulance\nservice\nresources\nCoordinate\nemergency\nresources\nDeliver basic\nambulance\ncommunication skills\nSupervise on-\nroad operations\nManage the scene of\nan emergency\nManage the scene\nof a special event\nManage routine\nscene\nDeliver pre-\nhospital patient\ncare\nDeliver intensive\npre-hospital\npatient care\nManage\nambulance\noperations\nTransport\nemergency\npatients\nTransport non-\nemergency\npatients\nDrive vehicles\nunder operational\nconditions\nAssist the\nhousehold to\nidentify health\nproblems to\npromote health\nand well-being\nShare knowledge and\nskills among\nmembers to provide\ninformation, education\nand communication\n(IEC) and/or\nhousehold teaching in\ndisease prevention\nand control\nEnsure the proper\nmaintenance of\nhealth station and\nsafe custody of its\nequipment,\nmedical supplies,\nmaterials, and\nhealth records\nMonitor health\nstatus of\nhousehold\nmembers under\nhis/her area of\nservice coverage\nMaintain updated\nlist/records of\nhealth activities\nAnalyze and\ninterpret\nophthalmic lens\nprescription\nEdge and mount\nophthalmic\nappliances\nApply UV coat/\ntint to\nophthalmic\nlenses\nFabricate models\nFabricate custom\nimpression trays\nFabricate\nregistration bite\nrims\nArticulate models and\ntransfer records\nFabricate\nmouthguard\nFabricate metal\ncrown and bridge\nstructures\nFabricate ceramic\nrestorations\nFabricate indirect\ncomposite/\npolymer fixed\nrestorations\nJoin alloy\nstructures\nArrange artificial\nteeth for\ncomplete\ndentures\nSet-up and wax\nremovable partial\ndentures\nWax, process and\nfinish acrylic\ndentures and\nappliances\nFabricate thermo\nformed bases and\nappliances\nRepair and modify\ndentures and\nappliances\nFabricate oral\nsplints\nFabricate\northodontic\nappliances\nFabricate cast\nmetal removable\npartial denture\nframework\nPerform oral\nexamination\nPromote oral\nhealth and\nhygiene\nOperate a\ndental\nradiographic\nequipment\nApply the\nprinciple of\nradiology biology\nand protection in\ndental practice\nPerform scaling\nand polishing\nMaintain dental\nrecords and\nresources\nProvide effective\npatient/client service\nManage dental\nlaboratory\nproduction and\noperation\nPerform\nadministrative\nfunctions\nContinue\nprofessional\ngrowth and\ndevelopment\nParticipate in the\nimplementation\nand monitoring of\nnewborn’s care\nplan\nDevelop the ability\nto recognize\nnewborn’s growth\nand development\nPerform caring\nskills for\nnewborn\nParticipate in the\nimplementation and\nmonitoring of infant’s\ncare plan\nProvide physical\nneeds, care and\nsupport to infant\nFoster social,\nintellectual and\nemotional\ndevelopment of\ninfant\nParticipate in the\nimplementation and\nmonitoring of toddler’s\ncare plan\nDevelop the ability\nto recognize\ntoddler’s growth\nand development\nPerform caring\nskills for toddler\nParticipate in the\nimplementation and\nmonitoring of pre-\nschooler’s care plan\nCORE\nCOMPETENCIES\n\n--- PDF PAGE 162 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n158\n\nDevelop the ability\nto recognize pre-\nschooler’s growth\nand development\nPerform caring\nskills for pre-\nschooler\nProvide\nassistance and\ncare to personal\nneeds of grade\nschooler\nFoster\nphysiological\nneeds and\ncognitive\ndevelopment of\ngrade schooler\nFoster physical\ngrowth and\ndevelopment of\ngrade schooler\nRespond to\nemergency for\ngrade schooler\nFoster physical\ngrowth and\ndevelopment of\nadolescent\nPromote\ndevelopmental\ntasks for\nadolescent\nRespond to\nemergency for\nadolescent\nDevelop the ability\nto recognize aging\nprocess\nParticipate in the\nimplementation\nand monitoring of\nclient’s care plan\nPerform caring\nskills\nPerform\nspecialty care\nprocedures\nAssist client in\nadministering\nprescribed\nmedication\nParticipate in the\nimplementation\nand monitoring of\nclient’s care plan\nProvide\nassistance and\nsupport on\nenvironment and\nbiopsychosocial\nneeds of clients\nDevelop the ability to\nrecognize healthy\nbody systems and\napply medical\nterminologies\nProvide care and\nsupport to\nactivities of daily\nliving (ADL) of\nclients\nProvide\nassistance in\nadministering\nprescribed\nmedications to\nclients\nProvide care and\nsupport to clients\nwith special needs\nRespond to\nemergency\nsituations\nProvide\nimmediate care\nand support to\nchildren with\nspecial needs\nProvide\nimmediate care\nand support to\nadults and\nelderly with\nspecial needs\nCarry out\nresponse\nintegration and\ncoordination in a\nmass casualty\nincident\nPerform patient\nassessment\nProvide\nemergency care\nfor suspected\nspine injury\nProvide pre-hospital\ninterventions for\ntrauma patients\nProvide pre-\nhospital\ninterventions for\nshock patients\nProvide pre-\nhospital\ninterventions for\nmedical patients\nPerform basic life\nsupport and use\nairway adjuncts\nProvide pre-\nhospital\ninterventions for\nspecial patient\npopulations\nPerform patient\npackaging\nConduct patient\ntransport\nDeliver basic pre-\nhospital\ncommunication\nskills\nCreate a positive\nmold from a\nnegative cast\nFabricate a\ntranstibial/ankle\ndisarticulation\nprosthesis\nFabricate a\ntransfemoral/knee\ndisarticulation\nprosthesis\nFabricate a\ntransradial/wrist\ndisarticulation\nprosthesis\nFabricate a\ntranshumeral/\nelbow\ndisarticulation/\nshoulder\ndisarticulation\nprosthesis\nPerform basic\nrepair and/or\nreplacement of\nthe prosthetic\ndevices\nFabricate a foot\northosis\nFabricate an\nankle-foot orthosis\nFabricate a\nknee-ankle-foot\northosis\nFabricate a wrist-\nhand orthosis\nFabricate a\ncustomized\nplastic thoraco-\nlumbo-sacral\northosis\nPerform basic\nrepair and/or\nreplacement of\nthe orthotic\ndevices\nReceive wheelchair\nreferral and\nappointment\nAssist the\nwheelchair\nclinician during\nassessment\nCoordinate\nprocurement of\nthe appropriate\nwheelchair size\nand its parts\nPerform\nwheelchair\nassembly and\nmodifications\nAssist the\nwheelchair\nclinician in\nwheelchair\ncheckout and\nfitting\nAssist wheelchair\nclinician in user\ntraining\nPerform\nmaintenance\nand repair on\nwheelchair\nConduct case\ninvestigation and\ncontact\nidentification\nConduct profiling\nof all contacts and\nindex cases and\nfollow-up\nConduct referral\nto health facility/\nquarantine facility/\nother relevant\nagencies\nConduct health\neducation programs\nPerform data\nrecording and\nreporting\nConduct\nmonitoring and\nsurveillance\nAssess the\nnutritional status\nof children under\nfive years old\nAssist the\nBarangay\nNutrition\nCommittee\nperform its\nfunctions\nAssist in the\ndelivery of\nnutrition and\nrelated services\nPromote\nadoption of\npositive nutrition\nbehaviors\nMonitor and\nevaluate\ncommunity\nnutrition programs\n\n--- PDF PAGE 163 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n159\n\nGLOSSARY OF TERMS\n\n1. Acute Malnutrition - occurs when an individual suffers from current, severe\nnutritional restrictions, a recent bout of illness, inappropriate childcare practices or\na combination of these factors.\n2. Age-in-days - the number of days from the child’s birth up to the date of\nmeasurement.\n3. Annual Investment Plan - refers to the annual slice of the Local Development\nInvestment Program (LDIP), which constitutes the total resource requirements for\nall Programs, Projects and Activities (PPAs) consisting of the annual capital\nexpenditure and regular operating requirements of the LGU.\n4. Anthropometric equipment - a measuring tool or device used to measure body\ndimensions.\n5. Anthropometric measurements - measures that are used to assess the size,\nshape, and composition of the human body.\n6. Barangay Nutrition Action Plan - local version of the Philippine Plan of Action\nfor Nutrition (PPAN) and is formulated by the Barangay Nutrition Committee. It\ncontains programs, projects, and activities for nutrition improvement.\n7. Barangay Nutrition Committee - is an organization at the barangay tasked to\nplan, implement, monitor, evaluate and coordinate the barangay nutrition action\nplan (BNAP).\n8. Barangay Nutrition Scholar - barangay-based volunteer worker responsible for\nthe delivery of nutrition and nutrition-related services in the community.\n9. Baseline - benchmark that is used as a basis for measuring or comparing past,\ncurrent and future past values.\n10. Breast milk expression - a technique using the hand, manual pump, or automatic\nelectric breast pump to express breastmilk from the breasts.\n11. Body height (standing) - body length in an upright or standing position.\n12. Body weight - amount or quantity of heaviness or mass of a person.\n13. Breastfeeding - unequalled way of providing ideal food for the healthy growth and\ndevelopment of infants. It is also an integral part of the reproductive process with\nimportant implications for the health of mothers.\n14. Calibration standard - used as a reference to compare against an instrument's\nresponse.\n15. Child Growth Standards - standards of growth for all children based on breastfed\ninfants and appropriately fed children of different ethnic origins raised in optimal\nconditions and measured in a standardized way. Its development was based on\nthe WHO Multicenter Growth Reference Study (WHO).\n16. Clients – refer to the target group for a nutrition intervention, such as mothers or\ncaregivers, fathers, children under five years old.\n17. Community nutrition assessment - the process of collecting, processing,\nanalyzing, and interpreting information on the nutrition problem obtained from\nanthropometric, biochemical, clinical, and dietary methods.\n\n--- PDF PAGE 164 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n160\n\n18. Compendium of Actions on Nutrition - a tool for local government unit (LGU)\nmobilization which summarizes the nutrition journey of 11 high performing LGUs\nalong nutrition program management.\n19. Compendium of Local Ordinances and Issuances on Nutrition – a knowledge-\nsharing platform for local government units to learn from initiatives of local\ngovernment units who have successfully harnessed the strength of policy\ninstruments in scaling up nutrition.\n20. Complementary Feeding - giving of solid and semi-solid foods to infants to\ncomplement nutrients from breastmilk to meet the infant’s nutritional requirements.\n21. Counseling (nutrition) - a “two-way interaction through which a client and a\ntrained counselor interpret the results of nutrition assessment, identify individual\nnutrition needs and goals, discuss ways to meet those goals, and agree on next\nsteps. Nutrition counseling aims to help clients understand important information\nabout their health and focuses on practical actions to address nutrition needs, as\nwell as the benefits of behavior change.\n22. Cycle menu - refers to a list of dishes to be served at a meal over a specified\nperiod. It is called a cycle menu, because a dish can be served in certain intervals,\npreferably odd-numbered days.\n23. Dietary Supplementation Program - aims to supplement the diets of nutritionally\nvulnerable groups, particularly pregnant women, and infants 6-23 months old in\nfood-insecure households, and wasted school children, especially those from very\npoor households. It also aims to supplement the diets of children enrolled in\ndaycare centers.\n24. e-OPT Plus tool - an Excel-based electronic system that makes data collection,\ncalculation, and reporting for Operation Timbang Plus activity more efficient and\naccurate.\n25. Early Childhood Care and Development - holistic development of children\nincluding physical, cognitive, language, social and emotional development from\nconception to eight (8) years old.\n26. Evaluation - systematic assessment of program implementation using a set of\ncriteria or standards, usually with reference to the objectives. It aims to understand\nthe factors contributing to such success or failure so as to better improve the\nprogram.\n27. Exclusive breastfeeding - is giving the infant no other food or drink, not even\nwater, except breast milk (including milk expressed or from a wet nurse) for the\nfirst six months of life, but allows the infant to receive oral rehydration solution,\ndrops and syrups, e.g., vitamins, minerals, and medicines.\n28. Family Profile – defined as a record of basic information about the preschoolers\nand the family they belong to, collected using BNS Form No. 1A.\n29. First 1,000 Days - period from conception to a child’s first two years of life and is\nconsidered the “golden window of opportunity” for the child to achieve his or her\nfull potential in the different aspects of development.\n30. First In, First Out System - a stock rotation system used for food storage wherein\nfood with the nearest best before or use-by dates are used or sold first.\n\n--- PDF PAGE 165 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n161\n\n31. Growth Monitoring and Promotion - serial monitoring of a child’s weight in the\nBarangay Health Center (BHC) or Rural Health Unit (RHU) aided by the ECCD\ncard.\n32. Hanging weighing scale - an equipment used to measure a child's weight.\n33. Height board - an equipment used to measure a child's height or length.\n34. Home and community gardening - refers to the promotion of the growing of fruits\nand vegetables and care of small animals like chicken in home yards or common\nspaces in the community. Promotion activities can include the distribution of\nseeds, seedlings and small animals; and provision of technical advice on the care\nof these fruits and vegetables, and small animals.\n35. Information, Education, and Communication materials - print materials that\nare intended to draw attention to information about health and nutrition\ninformation.\n36. Infant and Young Child Feeding - focuses on nutritional needs and feeding\npractices in children less than two years of age – the most critical period for child\nnutrition after which sub-optimal growth is hard to reverse.\n37. Integrated Management of Acute Malnutrition - aims to locate the acutely\nmalnourished especially those with severe acute malnutrition, and to provide the\nneeded medical and nutritional intervention.\n38. Integrated Management of Childhood Illness - a strategy to reduce under-five\nmortality caused by diarrhea and dehydration, pneumonia, measles, malaria,\ndengue hemorrhagic fever and malnutrition and anemia.\n39. Inpatient Therapeutic Care - involves management of complicated cases of SAM\naccording to WHO protocols on an inpatient basis at facilities with appropriate\ncapacity (hospitals).\n40. Length (recumbent) - analogous measure for the height of children less than two\nyears of age; taken while the child is lying down.\n41. Malnutrition - refers to deficiencies, excesses, or imbalances in a person's intake\nof protein and/or nutrients covering both undernutrition which includes suboptimal\nbreastfeeding, stunting, wasting or thinness, underweight and micronutrient\ndeficiencies, or insufficiencies, as well as overnutrition, which includes overweight\nand obesity.\n42. Mandatory Food Fortification - involves the addition of one or more nutrients to\nrice, flour, cooking oil as mandated by Republic Act 8976 and to salt as mandated\nby Republic Act 8172, or as prescribed by the NNC Governing Board.\n43. Micronutrient Supplementation - a short- to medium-term intervention, intended\nto prevent and/or correct high levels of micronutrient deficiencies by providing\nlarge doses of micronutrients immediately until more sustainable food-based\napproaches (e.g., food fortification and diet diversification) are put in place and\nbecome effective.\n44. Mid-upper arm circumference- circumference of the left upper arm, measured\nat the mid-point between the tip of the shoulder and the tip of the elbow (olecranon\nprocess and the acronium). Its utility is in identifying children who are not only\nwasted but are also at high risk of dying.\n45. Mixed feeding - a practice of feeding a baby with formula milk as well as breast\nmilk.\n\n--- PDF PAGE 166 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n162\n\n46. Moderate acute malnutrition (MAM) - means weight of children under 5 years is\nbetween 70% and 80% of the median weight-for-height or between -3 and -2 Z-\nscores weight-for-height.\n47. Monitoring - process of observing and checking the progress of the program\nbeing implemented in meeting the objectives and performance targets. It is done\nregularly.\n48. National Nutrition Promotion Program on Behavior Change - aims to facilitate\nthe adoption of positive practices that will impact on nutrition. It also aims to raise\nconsciousness on the importance of improving nutrition and ensure that the\nvarious nutrition-specific services are supported with appropriate communication\nactivities either as a separate complementary activity or as an activity integral to\nthe service.\n49. Nutritional status - condition of the body resulting from the intake, absorption and\nutilization of food.\n50. Nutritionally at-risk pregnant women - are those with a low pre-pregnancy body\nmass index (BMI), or those who do not gain sufficient weight during pregnancy,\nwith any of the following predisposing factors: narrowly-spaced pregnancies and\nbirths, situated in families with low income, with large number of dependents\nwhere food purchase is an economic problem, has previously given birth to a\npreterm or low birth weight infant, or other unfavorable prognostic factors, such as\nobesity or anemia, with diseases which influence nutritional status such as\ndiabetes, tuberculosis, drug addiction, alcoholism, and mental disorder.\n51. Nutrition education - any combination of educational strategies, accompanied by\nenvironmental supports, designed to facilitate the voluntary adoption of food\nchoices and other food- and nutrition-related behaviors conducive to health and\nwell-being. It is delivered through multiple venues and involves activities at the\nindividual, community, and policy levels. It aims to provide people in rural and\nurban areas with adequate information, skills and motivation to procure and to\nconsume appropriate diets.\n52. Nutrition intervention - is defined as any program, project or activity that will\ncontribute or improve the nutrition situation.\n53. Nutrition program management - is a decision-making process of identifying\npotential nutrition problems and needs of a specific population group; analyzing\npossible ways of preventing and controlling malnutrition; allocating resources\nbased on needs and expectations; and taking deliberate action to address\nnutritional problems, including those related to monitoring and evaluation.\n54. Nutrition sensitive interventions - interventions that have other objectives but\nhave been tweaked to contribute to nutritional outcomes.\n55. Nutrition specific interventions - interventions that address the immediate\ncauses of undernutrition most of which are in the health sector.\n56. Nutrition in Emergencies - key nutrition services that are components of\nemergency preparedness, response, and recovery phases aimed at preventing\ndeath and worsening of malnutrition in the affected population, particularly in the\nmost nutritionally vulnerable groups: infants, children, pregnant women and\nbreastfeeding mothers, and older persons.\n\n--- PDF PAGE 167 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n163\n\n57. Obese Children - children aged zero to fifty-nine (0-59) months whose weight for\nlength/height is above three (3) standard deviations from the median of the WHO\nChild Growth Standards.\n58. Outpatient Therapeutic Care - involves the management of non-complicated\ncases of SAM in outpatient care using ready-to-use therapeutic foods (RUTF)\nprovided on a weekly/ biweekly basis.\n59. Operation Timbang Plus - annual mass weighing of all preschoolers 0-71 months\nold in a community to identify and locate the malnourished children.\n60. Overweight Children- children aged zero to fifty-nine (0-59) months whose\nweight for length/height is above two (2) standard deviations from the median of\nthe WHO Child Growth Standards.\n61. Overweight and Obesity Management and Prevention Program - aims to\nprevent an increase in overweight and obesity among children 0-10 years old and\ndecrease prevalence rates among the rest of the population.\n62. Philippine Plan of Action for Nutrition - the framework for nutrition actions in\nthe country (Philippines). It identifies priority actions to achieve the outcomes. It\nshould serve as a guide to LGUs, NGOs and all related stakeholders in planning\nfor nutrition.\n63. Ready-to-Use Supplementary Food - highly fortified, nutrient dense pastes\nspecifically designed for prevention and treatment of moderate acute malnutrition\namong children over 6 months.\n64. Ready-to-Use Therapeutic Food - energy-dense, mineral- and vitamin-enriched\nfood that requires no preparation and is specifically designed to treat severe acute\nmalnutrition (SAM).\n65. Referral System - involves sending or referring a client or patient from a\ncommunity to a healthcare facility for proper management of a specific health\nand/or nutrition problem.\n66. Repayment scheme - a mandatory sharing system wherein beneficiaries of\ninputs should return a certain quantity for re-dispersal to other families.\n67. Resource mobilization – refers to activities that aim to mobilize and generate\nhuman and financial resources\n68. Severe Acute Malnutrition - refers to children aged 0-59 months with very low\nweight for length/height, defined as less than three SD below the median (<-3SD)\nof the WHO Growth Standards, characterized by visible severe wasting, the\npresence of bipedal pitting edema, or a MUAC measurement of less than one\nhundred fifteen millimeters (<115mm).\n69. Spot map - an aerial view of the barangay, where the important characteristics of\nthe barangay are indicated; it is a graphical presentation of the current nutrition\nsituation of a barangay.\n70. Stunted - children aged 0-59 months whose height for age is below minus two (2)\nstandard deviations (for moderate stunting) and minus three (3) standard\ndeviations (for severe stunting) from the median of the WHO Growth Standards.\n71. Underweight - children aged 0-59 whose weight for age is below minus 2\nstandard deviations and minus three (3) standard deviations (for severely\nunderweight) from the median of the WHO Growth Standards.\n\n--- PDF PAGE 168 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n164\n\n72. Wasted - a child's weight is less than expected for his/her height (underweight-\nfor-height); indicates acute deprivation of food or bout of current infection or\nillness.\n73. Wall chart - is a large chart on which words are written in letters large enough for\na group to read even from a distance. It is used to track progress of\naccomplishments of nutrition projects or activities.\n74. WASH - stands for water and sanitation hygiene; refers to services along the\nprovision of potable source of drinking water and appropriate sanitation facilities\nand services, and counselling and support on proper handwashing, personal\nhygiene, and environmental sanitation.\n\n--- PDF PAGE 169 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n165\n\nACRONYMS\n\nAIP\nAnnual Investment Plan\nALS\nAlternative Learning System\nBMI\nBody Mass Index\nBNAO\nBarangay Nutrition Action Officer\nBNAP\nBarangay Nutrition Action Plan\nBNC\nBarangay Nutrition Committee\nBNS\nBarangay Nutrition Scholar\nCAN\nCompendium on Actions for Nutrition\nCLM\nContextual Learning Matrix\nC/MNAO\nCity/