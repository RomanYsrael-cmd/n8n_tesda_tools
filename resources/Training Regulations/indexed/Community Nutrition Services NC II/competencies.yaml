nce of \nnutrition problem \n(percentage) \nCOMMUNICATION \n2.14 Setting up SMART \ngoals and objectives \n2.1 Advocating for \nincreased \ninvestment on \nnutrition projects \nand related \nactivities \n2.2 Networking and \nbuilding \npartnership \n2.3 Delivering a \npresentation \n2.4 Demonstrating \ninterpersonal \nskills \n2.5 Demonstrating \nintrapersonal \nskills \n2.6 Demonstrating \ncomputer \nliteracy in \npreparing BNAP \n2.7 Packaging of the \nBNAP\n\n--- PDF PAGE 78 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n74 \n \nELEMENT \nPERFORMANCE  \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nand mainstreaming of \nthe BNAP in another \nbarangay plans as \nappropriate. \n2.15 Packaging process \nof the Barangay \nNutrition Action Plan \n(BNAP) \n3. Assist the \nBarangay \nNutrition \nCommittee in the \nconduct of \nmeetings \n3.1 Meeting schedule is \ncoordinated to all \ncommittee members \nfollowing established \nprocedures. \n3.2 Required information \non nutrition is \nprepared as \nscheduled.  \n3.3 The Barangay \nSecretary is assisted \nin the preparation of \nminutes of the meeting \nor Minutes of the \nMeeting is prepared \n(in case BNS is the \nBNC Secretary) \naccording to \nworkplace \nrequirements. \n \nTECHNOLOGY \n3.1 Use of computer and \nappropriate software \n(MS Word) in \npreparation of \nMinutes of Meeting \nCOMMUNICATION \n3.2 Coordination of \nmeeting schedule \nand agenda \n3.3 Basic parts of a \nminutes of a meeting \n3.1 Planning and \ncoordinating the \nactivity \n3.2 Demonstrating \ninterpersonal \nskills \n3.3 Demonstrating \nuse of computers \n3.4 Writing the \nminutes of \nmeeting \n3.5 Filing the minutes \nof the meeting\n\n--- PDF PAGE 79 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n75 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Policies on \nestablish