        "source_title": "ASSESS THE NUTRITIONAL STATUS OF CHILDREN UNDER FIVE YEARS OLD",
        "source_text": "--- PDF PAGE 69 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n65 \n \n \nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY : ASSESS THE NUTRITIONAL STATUS OF CHILDREN \nUNDER FIVE YEARS OLD \n \n \n \nUNIT CODE \n: HHC226301 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills, and attitudes needed \nby the Barangay Nutrition Scholar to assess the nutritional \nstatus of children in the barangay through the preparation \nof Family Profile and master list of children under five years \nof age, classification of nutritional status of children, conduct \nof Operation Timbang (OPT) Plus, and conduct of Growth \nMonitoring and Promotion. \n \nELEMENT \nPERFORMANCE  \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Prepare family \nprofile and \nmaster list of \nchildren under \nfive years of \nage  \n1.1 Clients are \ninterviewed following \nthe Family Profile \nForm (BNS Form No. \n1A) \n1.2 The family profile is \nprepared based on the \nresults of the interview \nwith the clients \n1.3 The master list of \nchildren under five \nyears old is prepared \nfollowing the latest \nmeasurement data of \nthe barangay and \nupdated Family Profile \n1.4 The family profile is \nupdated in \naccordance with the \nset guidelines \nSCIENCE \n1.1 Information needed \nfor the Family Profile \n1.2 Latest measurement \ndata of the children \nin the barangay \n1.3 Basic data privacy \nregulation \nCOMMUNICATION \n1.4 Nutrition and health \nprofiling guidelines \n1.5 Basic interview \nguidelines \n1.6 Master list of families \n1.7 Master list of \n      children under five \n      years old \n1.1 Interviewing \nclients \n1.2 Gathering of \ninformation \n1.3 Preparing \nclients’ family \nprofiles \n1.4 Updating \nclients’ family \nprofiles \n1.5 Preparing \nmaster list of \nchildren under \nfive years old \n2. Assess the \nnutritional \nstatus of a child \nbased on age- \nin-days, \nobtained \nlength/height, \nweight, and \nmid-upper arm \ncircumference \n(MUAC) values  \n2.1 Age-in-days of target \nchildren is determined \nusing e-OPT Plus \nTool. \n2.2 Nutritional status of \na child based on \nlength/height, weight \nand age-in-days is \nclassified using ECCD \nCard. \n2.3 Nutritional status of a \nchild is classified \nSCIENCE \n2.1 Forms of malnutrition \n2.2 Section V. 3.E to F, \nImplementing \nGuidelines of \nOperation Timbang \n(OPT) Plus  \n2.3 ECCD Card  \n2.4 Mid-upper arm \ncircumference \n(MUAC) value \ninterpretation  \n2.1 Determining \nage-in-days \n2.2 Classifying the \nnutritional status \nof children \n2.3 Using ECCD \nCard in \ndetermining the \nnutritional status \nof children \n2.4 Using mid-upper \narm\n\n--- PDF PAGE 70 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n66 \n \nELEMENT \nPERFORMANCE  \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nbased on the Mid-\nUpper Arm \nCircumference \n(MUAC) value \ninterpretation \n2.5 Session 2.3 of \nNutrition in \nEmergencies Manual \n2.6 e-OPT Plus tool  \n      User’s Guide \n \ncircumference \n(MUAC) values \nin identifying \nnutritional status \nof children  \n3. Conduct \nOperation \nTimbang (OPT) \nPlus with the \nteam \n3.1 Activity schedule, \nmaterials, and \nanthropometric \nequipment are \nprepared and \ncoordinated with the \nOPT Plus team in \naccordance with the \nOperation Timbang \n(OPT) Plus guidelines \n3.2 Child’s weight and \nlength/height are \nmeasured following \nstandard procedures \n3.3 Mid-Upper Arm \nCircumference \n(MUAC) of a child is \nmeasured following \nstandard procedures \n3.4 Safety measures are \nfollowed in accordance \nwith the standard \nprocedures \n3.5 Data required in the  \ne-OPT Plus tool is \nencoded based on the \nmaster list and results \nof OPT Plus activity \nand essential nutrition \ninformation are \ngenerated \nSCIENCE \n3.1 Implementing \nGuidelines on \nOperation Timbang \n(OPT) Plus \n3.2 Length/height and \nweight measurement \nprocedures \n3.3 Mid-Upper Arm \nCircumference \n(MUAC) \nmeasurement \nprocedures  \n3.4 Safety measures \n3.5 e-OPT Plus User’s \nGuide \nTECHNOLOGY \n3.6 Use, verification, and \nmaintenance of \nlength/height board \n3.7 Use, calibration, and \nmaintenance of \nweighing scale \n3.8 Use and \nmaintenance of the \nMid-Upper Arm \nCircumference \n(MUAC) tape \n3.9 Use of computer (e-\nOPT Plus tool) \nCOMMUNICATION  \n3.10 OPT Plus Report \ngeneration, \nreporting, and \ndissemination \n3.11 Reporting flow and \nsubmission \nschedule \n3.1 Planning and \ncoordinating the \nactivity \n3.2 Calibrating or \nverifying \nanthropometric \nequipment \n3.3 Using \nanthropometric \nequipment \n3.4 Demonstrating \nsafety measures \n3.5 Measuring \nlength/height, \nweight, and \nMUAC of a child \n3.6 Preparing \nrecords \n3.7 Demonstrating \ninterpersonal \nskills \n3.8 Demonstrating \nuse of e-OPT \nPlus tool \n3.9 Referring clients \nto service \nproviders\n\n--- PDF PAGE 71 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n67 \n \nELEMENT \nPERFORMANCE  \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4. Conduct growth \nmonitoring and \npromotion  \n4.1 Growth monitoring is \nconducted following \nthe Operation Timbang \n(OPT) Plus Guidelines \n4.2 Records are updated \nbased on the results of \ngrowth monitoring \nactivity \n4.3 Parents/ families/ \ncaregivers were \nassisted in plotting \nchild growth in the \nECCD card’s growth \nchart  \n4.4 Parents/ families/ \ncaregivers informed on \ntheir child’s growth \nusing the \naccomplished growth \nchart \n4.5 Children with severe \nacute malnutrition are \nreferred to appropriate \nservice providers in \naccordance with \nPhilippine Integrated \nManagement of Acute \nMalnutrition (PIMAM) \nguidelines \nSCIENCE \n4.1 Table 1 of \nImplementing \nGuidelines of \nOperation Timbang \n(OPT) Plus \n4.2 Interpretation of the \naccomplished ECCD \ncard \nCOMMUNICATION \n4.3 Results of the most \nrecent Operation \nTimbang (OPT) Plus \n4.4 Use of Early \nChildhood Care \nDevelopment \n(ECCD) Card (with \ngrowth chart)  \n4.5 Report Generation  \n4.6 Referral form for \nseverely and \nmoderate acute \nmalnourished \nchildren  \n4.1 Planning and \ncoordinating the \nactivity \n4.2 Updating of \nrecords \n4.3 Teaching \nplotting values \nin growth chart \nto parents/ \ncaregivers \n4.4 Demonstrating \ninterpersonal \nskills \n4.5 Referring clients \nto service \nproviders\n\n--- PDF PAGE 72 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n68 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Clients \nMay include: \n1.1 Families with children under five years old \n1.2 Families with pregnant women \n1.3 Families with lactating women \n1.4 Families with senior citizen \n1.5 Families with PWD \n1.6 Families with solo parent \n1.7 Indigenous families \n2. Family Profile \nMay include: \n2.1 Number of household members \n2.2 Number of children \n2.3 Name of Household Head \n2.4 Occupational and Educational Attainment \n2.5 Presence of Pregnant and Lactating Women \n2.6 Water and Sanitation Hygiene (WASH) and Food \nProduction information  \n2.7 Usage of Iodized Salt and Iron Fortified Rice \n2.8 Family planning \n3. Master list \nMay include: \n3.1 Name of the child \n3.2 Name of the parents or caregiver \n3.3 Date of birth of the child \n3.4 Latest weight and length/height, MUAC values \n3.5 Date of measurement \n3.6 Place of birth \n3.7 Sex  \n3.8 Total number of children \n4. Measurement data \nMay include: \n4.1 Length \n4.2 Height \n4.3 Weight \n4.4 MUAC value \n5. Nutritional status of \na child based on \nlength/height, \nweight, and age-in-\ndays \nMay include: \n5.1 Weight-for-age status \n5.1.1 Normal \n5.1.2 Underweight \n5.1.3 Overweight \n5.1.4 Obese \n5.1.5 Severely Underweight \n5.2 Height-for-age status \n5.2.1 Normal \n5.2.2 Tall \n5.2.3 Stunted \n5.2.4 Severely Stunted \n5.3 Weight-for-length/height status \n5.3.1 Normal \n5.3.2 Wasted \n5.3.3 Severely Wasted \n5.3.4 Overweight\n\n--- PDF PAGE 73 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n69 \n \nVARIABLE \nRANGE \n5.3.5 Obese \n6. ECCD Card \nMay include:  \n6.1 Weight-for-Age  \n6.2 Length/Height-for-Age \n6.3 Weight-for-Length/Height \n7. Mid-Upper Arm \nCircumference \n(MUAC) value \ninterpretation \nMay include: \n7.1 Red (less than 11.5 cm (<115 mm)): Severe Acute \nMalnutrition \n7.2 Yellow (11.5 – 12.5 cm (115 – 125 mm)): Moderate \nAcute Malnutrition \n7.3 Green (more than 12.5 cm (>125 mm)): Normal \nNutritional Status \n8. Materials \nMay include: \n8.1 Master list of children 0-5 years old (0-59 months old) \n8.2 Printed forms \n8.3 Ballpen \n8.4 Calibrating standard \n8.5 Name tags of children \n8.6 Desktop or laptop computer \n9. Anthropometric \nequipment \nMay include: \n9.1 Length and Height board \n9.2 Microtoise \n9.3 Hanging weighing scale \n9.4 Digital hanging weighing scale \n9.5 Digital platform weighing scale \n9.6 Mechanical column scale \n9.7 Mid-Upper Arm Circumference tape \n10. OPT Team \nMay include: \n10.1 Rural Health Midwife \n10.2 Barangay Health Worker \n10.3 Mother leaders \n10.4 Sangguniang Kabataan Officials \n10.5 Barangay officials \n10.6 Child Development Worker \n10.7 Teacher-In-Charge \n10.8 Community Volunteers \n10.9 Other members of the barangay nutrition committee \n11. Safety Measures \nMay include: \n11.1 When weighing a child or getting the length/height \nmeasurement, ensure that the child has minimal \nclothing and not unclothed \n11.2 When weighing a child using the hanging weighing \nscale \n11.2.1 ensure that the weighing scale is safely \nsecured before weighing the child \n11.2.2 assess if the child should use a crib or weighing \npants \n11.2.3 do not carry the child by the weighing pant \nstrap only \n11.3 When using the height board, carefully lower the \nheadpiece on top of the child’s head.\n\n--- PDF PAGE 74 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n70 \n \nVARIABLE \nRANGE \n11.4 Observe minimum health protocols to prevent spread \nof COVID-19 infection, such as wearing of face mask \nand social distancing. \n11.5 When taking information or photos of children: \n11.5.1 do not take photos or videos of children and \npost or use in any platform without prior \napproval of the parents or guardians  \n11.5.2 do not take photos or videos of children without \nminimal clothing \n11.5.3 do not share information to a third-party user \nwithout written agreement in accordance with \nData Privacy Act of the Philippines, especially \npersonal identifiable information e.g., name, \nage, sex, address   \n12.  Data \nMay include: \n12.1 Name of the barangay or the Purok/Sitio \n12.2 Name of the Municipality/City \n12.3 Name of the Province \n12.4 Region \n12.5 Year covered by the OPT Plus activity \n12.6 Total population of the barangay \n12.7 Client details  \n12.7.1 Address/location \n12.7.2 Name of mother/caregiver \n12.7.3 Full name \n12.7.4 Sex \n12.7.5 Date of birth \n12.7.6 Date of measurement \n12.7.7 Weight \n12.7.8 Height/Length \n12.7.9 MUAC \n13. Nutrition \nInformation  \nMay include:  \n13.1 Summary of OPT Plus result  \n13.2 OPT Form 1A – Barangay Tally and Summary Sheet \nof Pre-school children per type of nutritional status, \nage, and sex \n13.3 OPT Form 1B – List of Affected/At-risk Preschool \nchildren, 0-59 months old  \n13.4 List of Underweight and Severely Underweight \nchildren  \n13.5 List of Stunted and Severely Stunted children  \n13.6 List of Moderately and Severely Wasted children  \n13.7 List of Overweight and Obese children \n14. Records \nMay include: \n14.1 Child’s age-in-days \n14.2 Weight \n14.3 Height/length \n14.4 Previous nutritional status \n14.5 MUAC value \n15. Service providers May include: \n15.1 Barangay Health Station\n\n--- PDF PAGE 75 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n71 \n \nVARIABLE \nRANGE \n15.2 Barangay Nutrition Office  \n15.3 In-patient therapeutic care (ITC) \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared a family profile for each client \n1.2 Prepared a master list of children under five years of \nage \n1.3 Conducted Operation Timbang (OPT) Plus with the \nOPT team \n1.4 Conducted growth monitoring and follow-up weighing \nand length/height assessment \n1.5 Determined the Mid-Upper Arm Circumference of a \nchild \n1.6 Classified the nutritional status of a child based on the \nobtained length/height, weight, age-in-days, and \nMUAC value \n1.7 Demonstrated use of e-OPT Plus Tool \n1.8 Referred identified child with severe acute malnutrition \nto appropriate service providers \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Printed copy of Implementing Guidelines on Operation \nTimbang (OPT) Plus \n2.2 WHO Child Growth Standards \n2.3 Forms (Family Profile, Master List, OPT Plus Forms) \n2.4 Office supplies \n2.5 Soft copy of e-OPT Plus tool \n2.6 Workplace appropriate to the unit of competency \n2.7 Tools, materials, and equipment appropriate to the unit \nof competency \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration with questioning    \n3.2 Interview \n3.3 Written Examination \n3.4 Observation with questioning \n3.5 Work sample \n4. Context of \nAssessment \n4.1 Competency may be assessed in the actual workplace \nor at the designated TESDA Accredited Assessment \nCenter.\n",
