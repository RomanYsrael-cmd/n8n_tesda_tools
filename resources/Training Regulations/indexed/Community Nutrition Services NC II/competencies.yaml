        "source_text": "--- PDF PAGE 33 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n29 \n \nUNIT OF COMPETENCY : EXERCISE EFFICIENT AND EFFECTIVE SUSTAINABLE \nPRACTICES IN THE WORKPLACE \n \n \n \nUNIT CODE \n: 400311217 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers knowledge, skills and attitude to identify the \nefficiency \nand \neffectiveness \nof \nresource \nutilization, \ndetermine causes of inefficiency and/or ineffectiveness of \nresource utilization and Convey inefficient and ineffective \nenvironmental practices. \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify the \nefficiency \nand \neffectiveness \nof resource \nutilization \n \n1.1 Required resource \nutilization in the \nworkplace is measured \nusing appropriate \ntechniques \n1.2 Data are recorded in \naccordance with \nworkplace protocol \n1.3 Recorded data are \ncompared to determine \nthe efficiency and \neffectiveness of \nresource utilization \naccording to \nestablished \nenvironmental work \nprocedures \n1.1 Importance of \nenvironmental \nliteracy \n1.2 Environmental \nwork procedures \n1.3 Waste \nminimization \n1.4 Efficient energy \nconsumptions \n1.1 Recording skills \n1.2 Writing skills \n1.3 Applying \ninnovation skills \n \n2. Determine \ncauses of \ninefficiency \nand/or \nineffectiveness \nof resource \nutilization \n2.1 Potential causes of \ninefficiency and/or \nineffectiveness are \nlisted \n2.2 Causes of inefficiency \nand/or ineffectiveness \nare identified through \ndeductive reasoning \n2.3 Identified causes of \ninefficiency and/or \nineffectiveness are \nvalidated thru \nestablished \nenvironmental \nprocedures \n2.1 Causes of \nenvironmental \ninefficiencies and \nineffectiveness \n \n2.1 Applying deductive \nreasoning skills \n2.2 Applying critical \nthinking \n2.3 Applying problem \nsolving skills \n2.4 Applying \nobservation skills \n \n3. Convey \ninefficient and \nineffective \nenvironmental \npractices  \n \n3.1 Efficiency and \neffectiveness of \nresource utilization are \nreported to \nappropriate \npersonnel \n3.1 Appropriate \nPersonnel to \naddress the \nenvironmental \nhazards \n3.1 Applying written \nand oral \ncommunication \nskills \n3.2 Applying critical \nthinking\n\n--- PDF PAGE 34 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n30 \n \nELEMENTS \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.2 Concerns related \nresource utilization are \ndiscussed with \nappropriate personnel \n3.3 Feedback on \ninformation/ concerns \nraised are clarified with \nappropriate personnel \n \n3.2 Environmental \ncorrective actions \n3.3 Applying problem \nsolving \n3.4 Applying \nobservation skills \n3.5 Practicing \nenvironmental \nawareness\n\n--- PDF PAGE 35 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n31 \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Environmental Work \nProcedures \nMay include: \n1.1 \nUtilization of Energy, Water, Fuel Procedures \n1.2 \nWaster Segregation Procedures \n1.3 \nWaste Disposal and Reuse Procedures \n1.4 \nWaste Collection Procedures \n1.5 \nUsage of Hazardous Materials Procedures \n1.6 \nChemical Application Procedures \n1.7 \nLabeling Procedures \n2. Appropriate \nPersonnel \nMay include: \n2.1 \nManager \n2.2 \nSafety Officer \n2.3 \nEHS Offices \n2.4 \nSupervisors \n2.5 \nTeam Leaders \n2.6 \nAdministrators \n2.7 \nStakeholders \n2.8 \nGovernment Official \n2.9 \nKey Personnel \n2.10 Specialists \n2.11 Himself\n\n--- PDF PAGE 36 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n32 \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 Measured required resource utilization in the \nworkplace using appropriate techniques \n1.2 Recorded data in accordance with workplace protocol \n1.3 Identified causes of inefficiency and/or \nineffectiveness through deductive reasoning \n1.4 Validate the identified causes of inefficiency and/or \nineffectiveness thru established environmental \nprocedures \n1.5 Report efficiency and effectives of resource utilization \nto appropriate personnel \n1.6 Clarify feedback on information/concerns raised with \nappropriate personnel \n2. Resource Implications \nThe following resources should be provided: \n2.1 Workplace  \n2.2 Tools, materials and equipment relevant to the tasks  \n2.3 PPE \n2.4 Manuals and references \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration  \n3.2 Oral questioning \n3.3 Written examination \n4. Context for \nAssessment \n4.1 Competency assessment may occur in workplace or \nany appropriately simulated environment \n4.2 Assessment shall be observed while task are being \nundertaken whether individually or in-group\n",
