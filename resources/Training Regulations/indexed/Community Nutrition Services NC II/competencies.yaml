        "source_title": "ASSIST IN THE DELIVERY OF NUTRITION AND RELATED SERVICES",
        "source_text": "--- PDF PAGE 82 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n78 \n \nUNIT OF COMPETENCY : ASSIST IN THE DELIVERY OF NUTRITION AND \nRELATED SERVICES \n \n \n \nUNIT CODE \n: HHC226303 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills, and attitudes needed \nby the Barangay Nutrition Scholar to assist in the delivery of \nnutrition and related services in the community through \nidentification of target clients, facilitation of activities along \ndietary supplementation program and home and community \nfood gardening, and documentation of nutrition and related \nservices delivery. \n \nELEMENT \nPERFORMANCE  \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \ntarget \nclients for \ndelivery of \nservices \nand referral \n1.1 Target clients for \nnutrition interventions are \ndetermined based on the \nBNAP targets and \nupdated master list. \n1.2 List of clients for referral \nto other service providers \nare prepared and \nupdated based on the \nidentified target clients. \n1.3 Vulnerable groups are \nreferred to service \nproviders for appropriate \nnutrition and related \nservices following \nestablished procedures. \n1.4 Records are updated \nbased on the \ninformation from the \nidentified target clients. \nSCIENCE \n1.1 Prioritization of \ntargets by \nintervention based \non the Philippine \nPlan of Action on \nNutrition and BNAP \n1.2 Nutrition programs, \nprojects, and \nactivities (PPAs) \noffered by different \nLGU departments \nTECHNOLOGY \n1.3 Use of computer to \nupdate records \nMATHEMATICS \n1.4 Computing total \nnumber of target \nclients per nutrition \nintervention \nCOMMUNICATION \n1.5 Identification and \nprioritization of target \nclients \n1.6 Records updating \n1.7 Referral system \n \n1.1 Identifying target \nclients \n1.2 Prioritizing \ntarget clients \n1.3 Preparing \nand/or updating \nof master list  \n1.4 Demonstrating \ninterpersonal \nskills\n\n--- PDF PAGE 83 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n79 \n \nELEMENT \nPERFORMANCE  \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Assist in the \ndelivery of \nnutrition and \nrelated \nservices  \n2.1 The delivery of nutrition \nand related services is \ncoordinated with the \nappropriate personnel \nboth during normal times \nand emergencies.  \n2.2 Clients are mobilized to \nparticipate in nutrition \nand related programs \nand services following \nestablished procedures. \n2.3 Home visits to clients are \nconducted following the \nfield activity guidelines. \nSCIENCE \n2.1 List of nutrition and \nrelated programs \nand services \naccording to the \nPhilippine Plan of \nAction on Nutrition, \nRepublic Act 11148 \n(Kalusugan at \nNutrisyon ng Mag-\nNanay Act), and \nBarangay Nutrition \nAction Plan (BNAP) \n2.2 Organizational \nlinkages of BNS \nProgram \n2.3 Policies and \nguidelines related to \nregular delivery of \nnutrition and related \nservices  \n2.4 Policies and \nguidelines related to \nnutrition in \nemergencies \n2.5 Roles of BNSs \nduring emergencies \nand in information \nmanagement \n2.6 Relevant policies \nand guidelines of \nExecutive Order 51 \n(The Milk Code) \n2.7 Checklist in \nimplementing \nnutrition \ninterventions \n2.8 List of good \npractices on \ndelivery of services \naccording to \nCompendium of \nAction on Nutrition \n(CAN) \n2.9 Compendium of \nLocal Ordinances \nand Issuances on \nNutrition \n2.10 Manual of \nOperations for the \nFirst One \n2.1 Planning the \nactivity \n2.2 Mobilizing \nResources \n2.3 Coordinating \nand executing \nnutrition \nservices  \n2.4 Demonstrating \ninterpersonal \nskills \n2.5 Demonstrating \nintrapersonal \nskills  \n2.6 Demonstrating \ncomputer \nliteracy \n2.7 Computing \npercentage of \ntarget clients \ncovered\n\n--- PDF PAGE 84 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n80 \n \nELEMENT \nPERFORMANCE  \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nThousand Days \n2.11 Ensuring Nutrition \nPriorities in Local \nDevelopment \nPlans and Budgets \n2.12 Resource \nMobilization \nMATHEMATICS \n2.13 Computation of \npercentage of \ntarget clients \ncovered in nutrition \nintervention and \nrelated services \nCOMMUNICATION \n2.14 Mobilization of \ntarget clients \n2.15 Record keeping \nand management \n2.16 Referral system \n3. Assist in the \nimplementation \nof the activities \nalong dietary \nsupplementatio\nn program  \n3.1 Assist in the \npreparation/updating of \nthe master list of clients \nfollowing program \nguidelines. \n3.2 Materials and area are \nprepared and \ncoordinated with the \nappropriate personnel. \n3.3 Baseline \nanthropometric \nmeasurements of \ntarget clients are \nrecorded based on the \nprogram guidelines. \n3.4 Staff-in-charge is \nassisted in orienting the \ntarget clients on the \nimplementation of the \nprogram in accordance \nwith the program \nguidelines. \n3.5 The delivery of food \ncommodities and food \npacks to the clients is \nfacilitated following the \nactivity schedule and \ndistribution scheme. \n3.6 Food safety measures \nare demonstrated in \nSCIENCE \n3.1 Dietary \nsupplementation \nguidelines \n3.2 Basic concepts on \nfood safety \n3.3 Basic concepts on \nmenu planning \n3.4 Cycle menu \npreparation \n3.5 Target clients for \ndietary \nsupplementation \nprogram  \n3.6 Monitoring process \nof clients’ \nnutritional status \n3.7 Possible adverse \neffects or negative \neffects of eating \nfood supplies in \nthe DSP \nCOMMUNICATION \n3.8 Record keeping and \nmanagement \n3.9 Documentation \nprocess \n3.1 Planning and \ncoordinating the \nactivity \n3.2 Calibrating or \nverifying \nanthropometric \nequipment \n3.3 Using \nanthropometric \nequipment \n3.4 Measuring \nlength/height and \nweight of target \nclients \n3.5 Demonstrating \ncompliance to \nfood safety \nmeasures \n3.6 Preparing/ \nupdating records \n3.7 Demonstrating \ninterpersonal \nskills \n3.8 Demonstrating \nintrapersonal \nskills \n3.9 Demonstrating \nuse of computer\n\n--- PDF PAGE 85 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n81 \n \nELEMENT \nPERFORMANCE  \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \naccordance with proper \nfood handling \nprocedures. \n3.7 Weight and length/height \nand nutritional status of \nthe target clients are \nmonitored closely based \non the program \nguidelines. \n3.8 Clients’ compliance to \nthe program is monitored \nfollowing the program \nguidelines. \n3.9 Daily Acknowledgement \nReceipts are \nconsolidated and \nsubmitted to the \nappropriate personnel. \n \n3.10 Monitoring the \nprogram \nimplementation  \n3.11 Monitoring of \nclients’ \nnutritional \nstatus progress \n3.12 Monitoring \nadverse or \nnegative effects \nof food \ncommodities \neaten \n3.13 Demonstrating \nskills on proper \nstorage of food \ncommodities \n4. Assist in the \nactivities \nalong home \nand \ncommunity \nfood \ngardening  \n4.1 The identification of \nSeeds, seedlings, and \nsmall animals for \ndistribution is \ncoordinated with the \nBarangay Councilor on \nAgriculture or Agriculture \nTechnologist following \nestablished procedures. \n4.2 The distribution of seeds, \nseedlings, and small \nanimals to target families \nwith malnourished \nchildren is assisted \nfollowing established \nprocedures. \n4.3 The Barangay Councilor \non Agriculture or \nAgriculture Technologist \nis assisted in orienting \ntarget clients on home \nand community \ngardening process based \non the activity guidelines.  \n4.4 Establishment and \nmaintenance of home \nand community food \ngardens are assisted \naccording to activity \nguidelines. \n4.5 Conduct of repayment \nscheme is assisted \nSCIENCE \n4.1 Types of seeds, \nseedlings, and small \nanimals   \n4.2 Target clients for \ndistribution of \nseeds, seedlings, \nand small animals \n4.3 Procedures on \nplanting seeds and \nraising small \nanimals and \nplanting calendar  \n4.4 Establishment and \nmaintenance of \nCommunity \nGardens  \n4.5 Repayment scheme \nfor target clients \nTECHNOLOGY \n4.6 Gardening tools  \nCOMMUNICATION \n4.7 Report generation \n4.8 Documentation \nprocess \n4.1 Planning and \ncoordinating the \nactivity \n4.2 Distributing \nprogram \nmaterials to \ntarget clients \n4.3 Facilitating \nmaintenance of \ncommunity \ngardens \n4.4 Demonstrating \ninterpersonal \nskills \n4.5 Demonstrating \nintrapersonal \nskills \n4.6 Monitoring the \nprogram \nimplementation \n4.7 Preparing/ \nupdating of \nrecords \n4.8 Using gardening \ntools\n\n--- PDF PAGE 86 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n82 \n \nELEMENT \nPERFORMANCE  \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nfollowing activity \nguidelines and in \ncoordination with the \nagriculture office. \n4.6 Activity implementation is \nmonitored according to \nworkplace requirements. \n5. Assist in the \nimplementati\non of the \nPIMAM \nProgram \n5.1 Systematic screenings \nfor acute malnutrition are \nconducted in applying \ncommunity Integrated \nManagement of \nChildhood Illness (IMCI) \nassessment. \n5.2 Appetite test with Ready-\nto-use Therapeutic Food \n(RUTF) is performed to \nthe identified \nmalnourished child and \noutpatient therapeutic \ncare (OTC) is started \nbased on program \nguidelines. \n5.3 Cases are recorded in \nthe OTC registry and \nOTC manager is \ninformed on admission, \nreferral, and discharges \nbased on program \nguidelines. \n5.4 Home visits to the clients \nare conducted as agreed \nwith the OTC manager. \n5.5 IYCF Counselling \nespecially on proper \nfeeding practices to \ncaregivers is provided, \nas necessary. \n5.6 OTC manager is assisted \nin the management of \nsupply and logistics \nchain based on program \nguidelines. \n5.7 Follow-ups especially on \nabsentees and defaulters \nare conducted and \ncoordinated with the \nmidwife. \n5.8 Complicated cases are \nreferred to the OTC \nSCIENCE \n5.1 Acute malnutrition \n5.2 National Guidelines \non the Management \nof Severe Acute \nMalnutrition (SAM) \nfor Children under \nfive years old \n5.3 National Guidelines \non the Management \nof Moderate Acute \nMalnutrition (MAM) \nfor Children under \nfive years \n5.4 Community \nmobilization for \nactive screening/ \ncase finding and \nreferral \n5.5 Management of \nsevere acute \nmalnutrition \n5.6 Roles and \nresponsibilities of \nprogram managers \nTECHNOLOGY \n5.7 Use and \nmaintenance of \nMUAC tape \nCOMMUNICATION \n5.8 Report generation \n5.9 OTC registry update \n5.1 Conducting \nsystematic \nscreenings for \nacute \nmalnutrition \n5.2 Performing \nappetite test for \nRUTF \n5.3 Counselling \ncaregivers on \nproper feeding \npractices \n5.4 Assisting in the \nmanagement of \nsupply and \nlogistics chain \n5.5 Conducting \nfollow ups  \n5.6 Recording \ncases and \nupdating of OTC \nregistry \n5.7 Consolidating \nand submitting \nmonthly reports \n5.8 Mobilizing peer \nsupport groups \nand caregivers \n5.9 Referring \ncomplicated \ncases to ITC\n\n--- PDF PAGE 87 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n83 \n \nELEMENT \nPERFORMANCE  \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nmanager or directly to \ninpatient therapeutic \ncare (ITC) based on \nprogram guidelines. \n5.9 Peer support groups \nand caregivers are \nmobilized based on \nprogram guidelines. \n5.10 Monthly report is \nprepared and \nsubmitted to the OTC \nmanager based on \nwork requirements. \n \n6. Document \nthe \nimplementati\non of \nnutrition and \nrelated \nservices \n6.1 Documentation of the \ndelivery of nutrition and \nrelated services is \nprepared based on work \nrequirements. \n6.2 Documentation is \nsubmitted to appropriate \npersonnel for approval. \n6.3 Records and other \nrelated documents are \nfiled in following \nworkplace requirements. \nTECHNOLOGY \n6.1 Use of computer \nand appropriate \nsoftware (MS Word) \nMATHEMATICS \n6.2 Computing \npercentages \nCOMMUNICATION \n6.3 Documentation \nguidelines \n6.4 Record keeping \n6.1 Preparing \ndocumentation \nof nutrition and \nrelated services \nand delivery \n6.2 Keeping records\n\n--- PDF PAGE 88 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n84 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Clients \nMay include: \n1.1 Families with children under five years old \n1.2 Families with pregnant women \n1.3 Families with lactating women \n1.4 Families affected by under- and over nutrition  \n1.5 Families with PWD \n1.6 Elderly \n2. Referral \nMay include: \n2.1 Sick and malnourished children to be referred to the \nrural health unit/health center through the midwife or \nnutrition action officer \n2.2 Families with 0-2 years old to be referred to IYCF \nCounselors \n2.3 Families with stunted children to be included in the list of \nbeneficiaries for livelihood programs \n2.4 Families with nutritionally at-risk pregnant women to be \nreferred to the health center  \n3. Vulnerable groups \nMay include: \n3.1 Malnourished children \n3.2 Families with 0-2 years old children \n3.3 Families with undernourished children \n3.4 Families with nutritionally at-risk pregnant and lactating \nwomen \n3.5 Elderly  \n3.6 Persons-with-disabilities \n4. Nutrition and related \nservices \nMay include: \n4.1 Infant and Young Child Feeding  \n4.2 Micronutrient Supplementation  \n4.3 