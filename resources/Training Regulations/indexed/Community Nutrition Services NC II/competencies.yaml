        "source_text": "--- PDF PAGE 40 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n36 \n \nCOMMON COMPETENCIES \n \n \nUNIT OF COMPETENCY \n: IMPLEMENT AND MONITOR INFECTION CONTROL \nPOLICIES AND PROCEDURES \n \n \n \nUNIT CODE \n: HHC321201 \n \n \n \nUNIT DESCRIPTOR \n: This unit is concerned with infection control responsibilities \nof employees with supervisory accountability to implement \nand monitor infection control policy and procedures in a \nspecific work unit or team within an organization. This unit \ndoes not apply to a role with organization-wide \nresponsibilities for infection control policy and procedure \ndevelopment, implementation or monitoring. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Provide \ninformation to \nthe work \ngroup about \nthe \norganization's \ninfection \ncontrol \npolicies and \nprocedures \n1.1 Relevant information \nabout the organization's \ninfection control policy \nand procedures, and \napplicable industry \ncodes of practice are \naccurately and clearly \nexplained to the work \ngroup \n1.2 Information about \nidentified hazards and \nthe outcomes of \ninfection risk \nassessments is \nregularly provided to \nthe work group \n1.3 Opportunity is provided \nfor the work group to \nseek further information \non workplace infection \ncontrol issues and \npractices \n1.1 Literacy levels and \ncommunication skills \nof work group \nmembers and \nconsequent suitable \ncommunication \ntechniques \n1.2 Concepts of mode of \ncommunication \n1.3 Reporting, \ndocumentation and \nuse of non-verbal \nand verbal \ncommunication \n1.4 Knowledge on OSH, \ninfection control, \nenvironmental and \ninstitutional, rules, \nguidelines, policies \nand procedures \n1.5 Respect for client’s \nrights \n1.6 Knowledge on the \nuse of personal \nprotective equipment \n1.7 Basic knowledge on