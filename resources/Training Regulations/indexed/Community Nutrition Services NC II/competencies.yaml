unity \n10. Data \nMay include: \n10.1 Number of pregnant women in the community \n10.2 Number of children 0-6 months old \n10.3 Number of children 7-11 months old \n10.4 Number of children 12-24 months old \n10.5 Number of children 25-35 months old \n11. Nutrition education \nclasses \nMay include: \n11.1    Idol ko si Nanay Learning Sessions  \n11.2    Idol ko si Tatay Learning Sessions  \n11.3    Participatory Cooking Demo \n11.4    Pabasa sa Nutrisyon \n11.5    DOST PINOY Classes  \n12. Materials \nMay include: \n12.1 Registration form \n12.2 Attendance form \n12.3 Pre-test and post-test \n12.4 Nutrition and related forms \n12.5 Visual aids \n12.6 Available IEC materials \n12.7 Manual/modules \n12.8 Kitchen tools and equipment \n12.9 Ingredients \n13. Target participants \nMay include: \n13.1 Mothers of 0-2 years old children \n13.2 Pregnant women \n13.3 Lactating women \n13.4 Caregivers/other family members \n13.5 Fathers \n13.6 4Ps members \n14. Manuals/tools \nMay include: \n14.1 Facilitator’s guide of Idol ko si Nanay \n14.2 Facilitator’s guide of Idol ko si Tatay \n14.3 FAO’s Gabay sa Pagsasagawa ng Participatory \nCooking Demonstration \n14.4 Pinggang Pinoy \n15. Preliminary activities \nMay include: \n15.1 Prayer \n15.2 Ice breaker activities \n15.3 Recap \n15.4 Messages\n\n--- PDF PAGE 97 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n93 \n \nVARIABLE \nRANGE \n15.5 Getting to know you activities \n15.6 Pre-test  \n16. Forms \nMay include: \n16.1 Registration form \n16.2 Attendance sheet \n16.3 Pre-test and post-test \n17. Information, Education, \nand Communication \n(IEC) Materials \nMay include: \n17.1 Flyers \n17.2 Posters \n17.3 Pinggang Pinoy  \n17.4 Booklet \n17.5 Pamphlet \n17.6 Brochure \n18. Basic information on \nphysical activities and \nreducing sedentary \nbehaviors \nMay include: \n18.1 Recommended minutes of exercise per day based \non age groups \n18.2 Types of physical activities and exercises \n18.3 Ways to reduce sedentary behaviors \n18.4 Recommended number of sleep for different age \ngroups \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Counseled mothers and caregivers on infant and young \nchild nutrition \n1.2 Conducted nutrition education classes \n1.3 Assisted in organizing Infant and Young Child Feeding \n(IYCF) support groups for mothers \n1.4 Distributed Information, Education, and Communication \n(IEC) materials to target clients \n1.5 Advised target clients on physical activities and reducing \nsedentary behaviors \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Printed copy of Idol ko si Nanay modules, handouts, and \nother related materials \n2.2 Sample activity forms (registration forms, attendance sheets, \npre-test and post-test) \n2.3 Office supplies \n2.4 Workplace appropriate to the unit of competency \n2.5 Tools, materials, and equipment appropriate to the unit of \ncompetency \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 Demonstration with questioning \n3.2 Interview \n3.3 Written Examination \n3.4 Observation with questioning \n3.5 Work sample \n4. Context of \nAssessment \n4.1 Competency may be assessed in the actual workplace or \nat the designated TESDA Accredited Assessment Center.\n",
