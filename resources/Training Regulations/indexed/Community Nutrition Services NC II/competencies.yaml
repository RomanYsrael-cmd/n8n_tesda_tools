h OSH \nwork standards  \n2.1 Resources \nnecessary to \nexecute hierarchy \nof controls \n2.2 General OSH \nprinciples \n2.3 Work standards \nand procedures \n2.4 Safe handling \nprocedures of \ntools, equipment \nand materials \n2.5 Different OSH \ncontrol measures  \n \n2.1 Applying \nCommunication \nskills \n2.2 Applying \nestimation skills \n2.3 Applying \ninterpersonal \nskills \n2.4 Applying critical \nthinking skills \n2.5 Applying \nobservation \nskills \n2.6 Identifying \nmaterial, tool \nand equipment\n\n--- PDF PAGE 30 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n26 \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n3. Perform tasks \nin accordance \nwith relevant \nOSH policies \nand \nprocedures  \n \n3.1 Relevant OSH work \nprocedures are \nidentified in \naccordance with \nworkplace policies and \nprocedures \n3.2 Work Activities are \nexecuted in \naccordance with OSH \nwork standards  \n3.3 Non-compliance \nwork activities are \nreported to \nappropriate \npersonnel  \n \n3.1 OSH work \nstandards \n3.2 Industry related \nwork activities \n3.3 General OSH \nprinciples \n3.4 OSH Violations \n3.5 Non-compliance \nwork activities \n \n3.1 Applying \ncommunication \nskills \n3.2 Applying \ninterpersonal \nskills \n3.3 Applying \ntroubleshooting \nskills \n3.4 Applying critical \nthinking skills \n3.5 Applying \nobservation \nskills\n\n--- PDF PAGE 31 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n27 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. OSH Requirements, \nRegulations, Policies and \nProcedures \nMay include: \n1.1 \nClean Air Act \n1.2 \nBuilding code \n1.3 \nNational Electrical and Fire Safety Codes \n1.4 \nWaste management statutes and rules \n1.5 \nPermit to Operate \n1.6 \nPhilippine Occupational Safety and Health \nStandards \n1.7 