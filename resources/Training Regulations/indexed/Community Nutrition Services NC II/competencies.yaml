ce in breastfeeding her \ninfant \n4.5 Perceived lack of breastmilk \n5. Appropriate actions \nMay include: \n5.1 Breastmilk expression and proper storage \n5.2 Proper breastfeeding positions \n5.3 Home remedies for sore and nipple problems \n5.4 Proper preparation of complementary foods for \nbabies \n5.5 Building mother’s confidence in breastfeeding \n5.6 Lactation massage \n6. Clients with special \ncases \nMay include: \n6.1 Mothers with HIV \n6.2 Mothers with infectious disease \n6.3 Mothers with chronic disease which contraindicates \nbreastfeeding \n7. Appropriate service \nproviders \nMay include: \n7.1 Rural Health Midwife \n7.2 Municipal Health Officer \n7.3 Nurses \n7.4 Pediatrician \n7.5 Other concerned offices \n8. Possible partners \nMay include: \n8.1 Faith-based/religious groups \n8.2 Youth \n8.3 Senior citizens group \n8.4 Women’s group\n\n--- PDF PAGE 96 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n92 \n \nVARIABLE \nRANGE \n8.5 Organized mothers in the barangay \n8.6 Community-based organization/NGOs \n8.7 Associations \n8.8 Civic groups \n9. Volunteers and peer \ncounsellors \nMay include: \n9.1 Women with successful breastfeeding experience \n9.2 Have similar background to the women to be \ncounseled \n9.3 Have experience in community work \n9.4 Live in the community \n9.5 Respected by the community \n10. Data \nMay include: \n10.1 Number of pregnant women in the community \n10.2 Number of children 0-6 months old \n10.3 Number of children 7-11 months old \n10.4 Number of children 12-24 months old \n10.5 Number of children 25-35 months old \n11. Nutrition education \nclasses \nMay include: \n11.1    Idol ko si Nanay Learning Sessions  \n11.2    Idol ko si Tatay Learning Sessions  \n11.3    Participatory Cooking Demo \n11.4    Pabasa sa Nutrisyon \n11.5    DOST PINOY Classes  \n12. Materials \nMay include: \n12.1 Registration form \n12.2 Attendance form \n12.3 Pre-test and post-test \n12.4 Nutrition and related forms \n12.5 Visual aids \n12.6 Available IEC materials \n12.7 Manual/modules \n12.8 Kitchen tools and equipment \n12.9 Ingredients \n13. Target participants \nMay include: \n13.1 Mothers of 0-2 years old children \n13.2 Pregnant women \n13.3 Lactating women \n13.4 Caregivers/other family members \n13.5 Fathers \n13.6 4Ps members \n14. Manuals/tools \nMay include: \n14.1 Facilitator’s guide of Idol ko si Nanay \n14.2 Facilitator’s guide of Idol ko si Tatay \n14.3 FAO’s Gabay sa Pagsasagawa ng Participatory \nCooking Demonstration \n14.4 Pinggang Pinoy \n15. Preliminary activities \nMay include: \n15.1 Prayer \n15.2 Ice breaker activities \n15.3 Recap \n15.4 Messages\n\n--- PDF PAGE 97 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n93 \n \nVARIABLE \nRANGE \n15.5 Getting to know you activities \n15.6 Pre-test  \n16. Forms \nMay include: \n16.1 Registration form \n16.2 Attendance sheet \n16.3 Pre-test and post-test \n17. Information, Education, \nand Communication \n(IEC) Materials \nMay include: \n17.1 Flyers \n17.2 Posters \n17.3 Pinggang Pinoy  \n17.4 Booklet \n17.5 Pamphlet \n17.6 Brochure \n18. Basic information on \nphysical activities and \nreducing sedentary \nbehaviors \nMay include: \n18.1 Recommended minutes of exercise per day based \non age groups \n18.2 Types of physical activities and exercises \n18.3 Ways to reduce sedentary behaviors \n18.4 Recommended number of sleep for different age \ngroups"
