        "source_text": "--- PDF PAGE 6 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n2 \n \nSECTION 2 COMPETENCY STANDARD \n \nThis section gives the details of the contents of the basic, common and core units \nof competency required in COMMUNITY NUTRITION SERVICES NC II. \n \n \nBASIC COMPETENCIES \n \n \nUNIT OF COMPETENCY : PARTICIPATE IN WORKPLACE COMMUNICATION \n \n \n \nUNIT CODE \n: 400311210 \n \n \n \nUNIT DESCRIPTOR \n: This unit covers the knowledge, skills and attitudes  \nrequired to gather, interpret and convey information in \nresponse to workplace requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.   Obtain and \nconvey \nworkplace \ninformation \n1.1 Specific and relevant \ninformation is accessed \nfrom appropriate \nsources  \n1.2 Effective questioning, \nactive listening and \nspeaking skills are \nused to gather and \nconvey information \n1.3 Appropriate medium is \nused to transfer \ninformation and ideas \n1.4 Appropriate non- verbal \ncommunication is used \n1.5 Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are \nidentified and followed \n1.6 Defined workplace \nprocedures for the \nlocation and storage of \ninformation are used \n1.7 Personal interaction is \ncarried out clearly and \nconcisely \n \n \n \n1.1 Effective verbal and \nnonverbal \ncommunication \n1.2 Different modes of \ncommunication  \n1.3 Medium of \ncommunication in \nthe workplace \n1.4 Organizational \npolicies \n1.5 Communication \nprocedures and \nsystems \n1.6 Lines of \nCommunication \n1.7 Technology relevant \nto the enterprise and \nthe individual’s work \nresponsibilities  \n1.8 Workplace etiquette \n \n \n1.1 Following simple \nspoken language \n1.2 Performing routine \nworkplace duties \nfollowing simple \nwritten notices \n1.3 Participating in \nworkplace \nmeetings and \ndiscussions \n1.4 Preparing work- \nrelated documents \n1.5 Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n1.6 Relating/ \nInteracting with \npeople of various \nlevels in the \nworkplace \n1.7 Gathering and \nproviding basic \ninformation in \nresponse to \nworkplace \nrequirements \n1.8 Applying basic \nbusiness writing \nskills\n\n--- PDF PAGE 7 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n3 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.9 Applying \ninterpersonal skills \nin the workplace \n1.10 Performing \nactive-listening \nskills \n2.  Perform \nduties \nfollowing \nworkplace \ninstructions   \n2.1 Written notices and \ninstructions are read \nand   interpreted in \naccordance with \norganizational \nguidelines \n2.2 Routine written \ninstruction is followed \nbased on established \nprocedures \n2.3 Feedback is given to \nworkplace supervisor-\nbased instructions/ \ninformation received \n2.4 Workplace \ninteractions are \nconducted in a \ncourteous manner \n2.5 Where necessary, \nclarifications about \nroutine workplace \nprocedures and \nmatters concerning \nconditions of \nemployment are \nsought and asked from \nappropriate sources  \n2.6 Meetings outcomes are \ninterpreted and \nimplemented \n2.1 Effective verbal and \nnon-verbal \ncommunication \n2.2 Different modes of \ncommunication  \n2.3 Medium of \ncommunication in \nthe workplace \n2.4 Organizational/ \nworkplace policies \n2.5 Communication \nprocedures and \nsystems \n2.6 Lines of \ncommunication \n2.7 Technology relevant \nto the enterprise and \nthe individual’s work \nresponsibilities \n2.8 Effective questioning \ntechniques (clarifying \nand probing) \n2.9 Workplace etiquette \n \n  \n2.1 Following simple \nspoken \ninstructions  \n2.2 Performing routine \nworkplace duties \nfollowing simple \nwritten notices \n2.3 Participating in \nworkplace \nmeetings and \ndiscussions \n2.4 Completing work- \nrelated documents \n2.5 Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n2.6 Relating/ \nResponding to \npeople of various \nlevels in the \nworkplace \n2.7 Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nrequirements \n2.8 Applying basic \nquestioning/ \nquerying \n2.9 Applying skills in \nreading for \ninformation  \n2.10 Applying skills in \nlocating  \n3.   Complete \nrelevant work \nrelated \ndocuments \n3.1 Range of forms \nrelating to conditions of \nemployment are \ncompleted accurately \nand legibly \n3.2 Workplace data is \nrecorded on standard \n3.1 Effective verbal and \nnon-verbal \ncommunication \n3.2 Different modes of \ncommunication  \n3.3 Workplace forms \nand documents \n3.1 Completing work- \nrelated documents \n3.2 Applying \noperations of \naddition, \nsubtraction,\n\n--- PDF PAGE 8 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n4 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the  \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nworkplace forms and \ndocuments \n3.3 Errors in recording \ninformation on forms/ \ndocuments are \nidentified and acted \nupon \n3.4 Reporting requirements \nto supervisor are \ncompleted according to \norganizational \nguidelines \n \n3.4 Organizational/ \nWorkplace policies \n3.5 Communication \nprocedures and \nsystems \n3.6 Technology relevant \nto the enterprise and \nthe individual’s work \nresponsibilities  \n \n \ndivision and \nmultiplication \n3.3 Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nrequirements \n3.4 Applying Effective \nrecord keeping \nskills\n\n--- PDF PAGE 9 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n5 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \nMay include: \n1.1. \n