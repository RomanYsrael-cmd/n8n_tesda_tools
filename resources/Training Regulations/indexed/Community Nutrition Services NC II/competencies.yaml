          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Assist in the \nconduct \nproject \nmonitoring  \nvisits \n1.1 Project visits of \nBarangay Nutrition \nCommittee members \nare planned and \ncoordinated with the \nappropriate personnel.  \n1.2 Stakeholders are \ninterviewed to track the \nprogress of the project \nfollowing established \nprocedures. \n1.3 Observations are \nincluded in the BNS \nAccomplishment Report \nand BNAP \nAccomplishment Report. \nCOMMUNICATION \n1.1 Basic interview \nskills \n1.2 Plan and coordinate \nproject visits \n1.3 Data gathering \nduring monitoring  \n1.4 Project guidelines  \n1.1 Planning and \ncoordinating \nproject visits \n1.2 Demonstrating \ninterview skills \n1.3 Gathering \nnecessary data \nand information \n1.4 Demonstrating \ninterpersonal \nskills \n1.5 Comparing \nintended project \nprocess and \nresults vis-à-vis \nactual results  \n1.6 Identifying \nrecommendation\ns based on \nresults of the visit \n \n2. Prepare the \nBNS \nAccomplish\nment report \n2.1 BNS Action Plan is \nprepared using the \nappropriate form (BNS \nForm No. 2) as means \nof verification for tasks \nundertaken as basis for \ngrant of LGU incentives.  \n2.2 Accomplishments are \nplotted in the BNS \nAction Plan against \nplanned monthly targets \nof the BNAP. \n2.3 Records are \nconsolidated and \nanalyzed based on the \nrequirements for the \npreparation of monthly \naccomplishment report. \nSCIENCE:  \n2.1 Parts of BNS \nAccomplishment \nReport and \nessential data \nrequired \nTECHNOLOGY \n2.2 Use of computer \nand appropriate \nsoftware \n2.3 Data collection and \nanalysis \nMATHEMATICS \n2.4 Computation of \npercentages  \nCOMMUNICATION \n2.5 Preparation of the \nAccomplishment \n2.1 Report writing \n2.2 Demonstrating \naccuracy in \nsimple \ncomputation  \n2.3 Demonstrating \naccuracy in \nreviewing and \nreporting data\n\n--- PDF PAGE 99 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n95 \n \nELEMENT \nPERFORMANCE  \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.4 Necessary information \nis supplied monthly in \nthe BNS \nAccomplishment Report \nForm (BNS Form No. 4) \nand compared with BNS \nAction Plan following \nestablished procedures. \n2.5 Report is submitted to \nappropriate offices \nfollowing agreed upon \ntimeframe. \n \nReport \n2.6 Preparation of the \nBarangay Nutrition \nScholar Action Plan \n2.7 Consolidation of \nreports \n2.8 Documentation of \nprojects and \nactivities \n3. Assist in the \npreparation \nof BNAP \nAccomplish\nment report \n3.1 The committee is \nassisted in the \nconsolidation of records \nof activities and outputs \nfollowing established \nprocedure. \n3.2 The committee is \nassisted in assessing \nand analyzing Data \nfollowing the targets of \nBNAP. \n3.3 Adjustments (re-\nplanning) to meet the \ntargets are decided and \nagreed by the \ncommittee. \n3.4 Presentation of the \nanalyzed data during \ncommittee meeting is \nfacilitated as scheduled. \n3.5 The committee is \nassisted in the \npreparation of the BNAP \nAccomplishment Report \nquarterly following the \nreport format. \n3.6 Report is submitted to \nappropriate offices \nfollowing the scheduled \ndeadline. \n \nSCIENCE:  \n3.1 Parts of BNAP \nAccomplishment \nReport and \nessential data \nrequired \nTECHNOLOGY \n3.2 Use of computer \nand appropriate \nsoftware (MS Word, \nMS Excel) \nCOMMUNICATION \n3.3 Accomplishment \nReport preparation \n3.4 Barangay Nutrition \nAction Plan (BNAP) \nQuarterly and \nAnnual \nAccomplishment \nReport preparation \n3.5 Consolidation of \nreports and \ndocumentation \n3.1 Report writing \n3.2 Demonstrating \nuse of computer \n3.3 Demonstrating \ninterpersonal \nskills\n\n--- PDF PAGE 100 ---\nCommunity Nutrition Services NC II – HHCCNS222                    Promulgated (05/2022) \n96 \n \nELEMENT \nPERFORMANCE  \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4. Assist the \nBarangay \nNutrition \nCommittee \nin evaluating \nthe \nimplementati\non of the \nBNAP \n4.1 The committee is \nassisted in the \npreparation and \nconsolidation of BNAP \nAccomplishment Reports \nfollowing established \nprocedures. \n4.2 The BNC is assisted in \nthe evaluation of the \nBNAP using the MELLPI \nPro tool for Barangays. \n4.3 Strengths and areas for \nimprovement are \nidentified in the \nimplementation of BNAP \nbased on the results of \nthe quarterly report. \n4.4 Assist the Barangay \nNutrition Committee in \ndeciding on the \nrecommendations for \nplan modification. \n4.5 The Barangay Secretary \nis assisted in the \ndocumentation of \nmeetings in accordance \nwith workplace \nrequirements. \n4.6 Minutes of committee \nmeetings are filed for \nrecord keeping. \n4.7 The committee is \nassisted in updating the \nresults of BNAP \nQuarterly \nAccomplishment Report \nsummarized in a wall \nchart. \n4.8 Spot map is updated with \ninputs from the members \nof the Barangay Nutrition \nCommittee. \n \nSCIENCE \n4.1 Nutrition program \nmonitoring and \nevaluation process  \n4.2 MELLPI PRO tool \nfor barangays  \n4.3 Preparation of wall \nchart \n4.4 Update of the spot \nmap \nTECHNOLOGY \n4.5 Use of computer \nand appropriate \nsoftware (MS Word, \nMS Excel) \nCOMMUNICATION \n4.6 Preparation of \nminutes of \nmeetings \n4.7 Record keeping \n4.1 Evaluating \nimplementation \nof the Barangay \nNutrition Action \nPlan using the \nMELLPI Pro tool \nfor Barangay \n4.2 Demonstrating \naccuracy in \nreviewing and \nreporting data \n4.3 Demonstrating \ninterpersonal \nskills \n4.4 Demonstrating \ncomputer literacy \n4.5 Writing minutes \nof meetings \n4.6 Updating and \nkeeping of \nrecords \n4.7 Preparing a wall \nchart of \naccomplishments  \n4.8 Updating of spot \nmap\n\n--- PDF PAGE 101 ---\nCommunity Nutrition Services NC II – HHCCNS222               