    {
      "term": "Child Growth Standards",
      "definition": "58. Outpatient Therapeutic Care - involves the management of non-complicated cases of SAM in outpatient care using ready-to-use therapeutic foods (RUTF) provided on a weekly/ biweekly basis. 59. Operation Timbang Plus - annual mass weighing of all preschoolers 0-71 months old in a community to identify and locate the malnourished children. 60. Overweight Children- children aged zero to fifty-nine (0-59) months whose weight for length/height is above two (2) standard deviations from the median of the WHO Child Growth Standards. 61. Overweight and Obesity Management and Prevention Program - aims to prevent an increase in overweight and obesity among children 0-10 years old and decrease prevalence rates among the rest of the population. 62. Philippine Plan of Action for Nutrition - the framework for nutrition actions in the country (Philippines). It identifies priority actions to achieve the outcomes. It should serve as a guide to LGUs, NGOs and all related stakeholders in planning for nutrition. 63. Ready-to-Use Supplementary Food - highly fortified, nutrient dense pastes specifically designed for prevention and treatment of moderate acute malnutrition among children over 6 months. 64. Ready-to-Use Therapeutic Food - energy-dense, mineral- and vitamin-enriched food that requires no preparation and is specifically designed to treat severe acute malnutrition (SAM). 65. Referral System - involves sending or referring a client or patient from a community to a healthcare facility for proper management of a specific health and/or nutrition problem. 66. Repayment scheme - a mandatory sharing system wherein beneficiaries of inputs should return a certain quantity for re-dispersal to other families. 67. Resource mobilization – refers to activities that aim to mobilize and generate human and financial resources 68. Severe Acute Malnutrition - refers to children aged 0-59 months with very low weight for length/height, defined as less than three SD below the median (<-3SD) of the WHO Growth Standards, characterized by visible severe wasting, the presence of bipedal pitting edema, or a MUAC measurement of less than one hundred fifteen millimeters (<115mm). 69. Spot map - an aerial view of the barangay, where the important characteristics of the barangay are indicated; it is a graphical presentation of the current nutrition situation of a barangay. 70. Stunted - children aged 0-59 months whose height for age is below minus two (2) standard deviations (for moderate stunting) and minus three (3) standard deviations (for severe stunting) from the median of the WHO Growth Standards. 71. Underweight - children aged 0-59 whose weight for age is below minus 2 standard deviations and minus three (3) standard deviations (for severely underweight) from the median of the WHO Growth Standards."
    },
    {
      "term": "Community Nutrition Services NC II",
      "definition": "HHCCNS222 Promulgated (05/2022) 72. Wasted - a child's weight is less than expected for his/her height (underweight- for-height); indicates acute deprivation of food or bout of current infection or illness. 73. Wall chart - is a large chart on which words are written in letters large enough for a group to read even from a distance. It is used to track progress of accomplishments of nutrition projects or activities. 74. WASH - stands for water and sanitation hygiene; refers to services along the provision of potable source of drinking water and appropriate sanitation facilities and services, and counselling and support on proper handwashing, personal hygiene, and environmental sanitation."
