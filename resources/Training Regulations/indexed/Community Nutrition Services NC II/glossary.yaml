      "term": "Investment Program (LDIP), which constitutes the total resource requirements for",
      "definition": "all Programs, Projects and Activities (PPAs) consisting of the annual capital expenditure and regular operating requirements of the LGU. 4. Anthropometric equipment - a measuring tool or device used to measure body dimensions. 5. Anthropometric measurements - measures that are used to assess the size, shape, and composition of the human body. 6. Barangay Nutrition Action Plan - local version of the Philippine Plan of Action for Nutrition (PPAN) and is formulated by the Barangay Nutrition Committee. It contains programs, projects, and activities for nutrition improvement. 7. Barangay Nutrition Committee - is an organization at the barangay tasked to plan, implement, monitor, evaluate and coordinate the barangay nutrition action plan (BNAP). 8. Barangay Nutrition Scholar - barangay-based volunteer worker responsible for the delivery of nutrition and nutrition-related services in the community. 9. Baseline - benchmark that is used as a basis for measuring or comparing past, current and future past values. 10. Breast milk expression - a technique using the hand, manual pump, or automatic electric breast pump to express breastmilk from the breasts. 11. Body height (standing) - body length in an upright or standing position. 12. Body weight - amount or quantity of heaviness or mass of a person. 13. Breastfeeding - unequalled way of providing ideal food for the healthy growth and development of infants. It is also an integral part of the reproductive process with important implications for the health of mothers. 14. Calibration standard - used as a reference to compare against an instrument's response. 15. Child Growth Standards - standards of growth for all children based on breastfed infants and appropriately fed children of different ethnic origins raised in optimal conditions and measured in a standardized way. Its development was based on the WHO Multicenter Growth Reference Study (WHO). 16. Clients – refer to the target group for a nutrition intervention, such as mothers or caregivers, fathers, children under five years old. 17. Community nutrition assessment - the process of collecting, processing, analyzing, and interpreting information on the nutrition problem obtained from anthropometric, biochemical, clinical, and dietary methods."
    },
    {
      "term": "Community Nutrition Services NC II",
      "definition": "HHCCNS222 Promulgated (05/2022) 18. Compendium of Actions on Nutrition - a tool for local government unit (LGU) mobilization which summarizes the nutrition journey of 11 high performing LGUs along nutrition program management. 19. Compendium of Local Ordinances and Issuances on Nutrition – a knowledge- sharing platform for local government units to learn from initiatives of local government units who have successfully harnessed the strength of policy instruments in scaling up nutrition. 20. Complementary Feeding - giving of solid and semi-solid foods to infants to complement nutrients from breastmilk to meet the infant’s nutritional requirements. 21. Counseling (nutrition) - a “two-way interaction through which a client and a trained counselor interpret the results of nutrition assessment, identify individual nutrition needs and goals, discuss ways to meet those goals, and agree on next steps. Nutrition counseling aims to help clients understand important information about their health and focuses on practical actions to address nutrition needs, as well as the benefits of behavior change. 22. Cycle menu - refers to a list of dishes to be served at a meal over a specified period. It is called a cycle menu, because a dish can be served in certain intervals, preferably odd-numbered days. 23. Dietary Supplementation Program - aims to supplement the diets of nutritionally vulnerable groups, particularly pregnant women, and infants 6-23 months old in food-insecure households, and wasted school children, especially those from very poor households. It also aims to supplement the diets of children enrolled in daycare centers. 24. e-OPT Plus tool - an Excel-based electronic system that makes data collection, calculation, and reporting for Operation Timbang Plus activity more efficient and accurate. 25. Early Childhood Care and Development - holistic development of children including physical, cognitive, language, social and emotional development from conception to eight (8) years old. 26. Evaluation - systematic assessment of program implementation using a set of criteria or standards, usually with reference to the objectives. It aims to understand the factors contributing to such success or failure so as to better improve the program. 27. Exclusive breastfeeding - is giving the infant no other food or drink, not even water, except breast milk (including milk expressed or from a wet nurse) for the first six months of life, but allows the infant to receive oral rehydration solution, drops and syrups, e.g., vitamins, minerals, and medicines. 28. Family Profile – defined as a record of basic information about the preschoolers and the family they belong to, collected using BNS Form No. 1A. 29. First 1,000 Days - period from conception to a child’s first two years of life and is considered the “golden window of opportunity” for the child to achieve his or her full potential in the different aspects of development. 30. First In, First Out System - a stock rotation system used for food storage wherein food with the nearest best before or use-by dates are used or sold first."
    },
    {
      "term": "Community Nutrition Services NC II",
      "definition": "HHCCNS222 Promulgated (05/2022) 31. Growth Monitoring and Promotion - serial monitoring of a child’s weight in the Barangay Health Center (BHC) or Rural Health Unit (RHU) aided by the ECCD card. 32. Hanging weighing scale - an equipment used to measure a child's weight. 33. Height board - an equipment used to measure a child's height or length. 34. Home and community gardening - refers to the promotion of the growing of fruits and vegetables and care of small animals like chicken in home yards or common spaces in the community. Promotion activities can include the distribution of seeds, seedlings and small animals; and provision of technical advice on the care of these fruits and vegetables, and small animals. 35. Information, Education, and Communication materials - print materials that are intended to draw attention to information about health and nutrition information. 36. Infant and Young Child Feeding - focuses on nutritional needs and feeding practices in children less than two years of age – the most critical period for child nutrition after which sub-optimal growth is hard to reverse. 37. Integrated Management of Acute Malnutrition - aims to locate the acutely malnourished especially those with severe acute malnutrition, and to provide the needed medical and nutritional intervention. 38. Integrated Management of Childhood Illness - a strategy to reduce under-five mortality caused by diarrhea and dehydration, pneumonia, measles, malaria, dengue hemorrhagic fever and malnutrition and anemia. 39. Inpatient Therapeutic Care - involves management of complicated cases of SAM according to WHO protocols on an inpatient basis at facilities with appropriate capacity (hospitals). 40. Length (recumbent) - analogous measure for the height of children less than two years of age; taken while the child is lying down. 41. Malnutrition - refers to deficiencies, excesses, or imbalances in a person's intake of protein and/or nutrients covering both undernutrition which includes suboptimal breastfeeding, stunting, wasting or thinness, underweight and micronutrient deficiencies, or insufficiencies, as well as overnutrition, which includes overweight and obesity. 42. Mandatory Food Fortification - involves the addition of one or more nutrients to rice, flour, cooking oil as mandated by Republic Act 8976 and to salt as mandated by Republic Act 8172, or as prescribed by the NNC Governing Board. 43. Micronutrient Supplementation - a short- to medium-term intervention, intended to prevent and/or correct high levels of micronutrient deficiencies by providing large doses of micronutrients immediately until more sustainable food-based approaches (e.g., food fortification and diet diversification) are put in place and become effective. 44. Mid-upper arm circumference- circumference of the left upper arm, measured at the mid-point between the tip of the shoulder and the tip of the elbow (olecranon process and the acronium). Its utility is in identifying children who are not only wasted but are also at high risk of dying. 45. Mixed feeding - a practice of feeding a baby with formula milk as well as breast milk."
    },
    {
      "term": "Community Nutrition Services NC II",
      "definition": "HHCCNS222 Promulgated (05/2022) 46. Moderate acute malnutrition (MAM) - means weight of children under 5 years is between 70% and 80% of the median weight-for-height or between -3 and -2 Z- scores weight-for-height. 47. Monitoring - process of observing and checking the progress of the program being implemented in meeting the objectives and performance targets. It is done regularly. 48. National Nutrition Promotion Program on Behavior Change - aims to facilitate the adoption of positive practices that will impact on nutrition. It also aims to raise consciousness on the importance of improving nutrition and ensure that the various nutrition-specific services are supported with appropriate communication activities either as a separate complementary activity or as an activity integral to the service. 49. Nutritional status - condition of the body resulting from the intake, absorption and utilization of food. 50. Nutritionally at-risk pregnant women - are those with a low pre-pregnancy body mass index (BMI), or those who do not gain sufficient weight during pregnancy, with any of the following predisposing factors: narrowly-spaced pregnancies and births, situated in families with low income, with large number of dependents where food purchase is an economic problem, has previously given birth to a preterm or low birth weight infant, or other unfavorable prognostic factors, such as obesity or anemia, with diseases which influence nutritional status such as diabetes, tuberculosis, drug addiction, alcoholism, and mental disorder. 51. Nutrition education - any combination of educational strategies, accompanied by environmental supports, designed to facilitate the voluntary adoption of food choices and other food- and nutrition-related behaviors conducive to health and well-being. It is delivered through multiple venues and involves activities at the individual, community, and policy levels. It aims to provide people in rural and urban areas with adequate information, skills and motivation to procure and to consume appropriate diets. 52. Nutrition intervention - is defined as any program, project or activity that will contribute or improve the nutrition situation. 53. Nutrition program management - is a decision-making process of identifying potential nutrition problems and needs of a specific population group; analyzing possible ways of preventing and controlling malnutrition; allocating resources based on needs and expectations; and taking deliberate action to address nutritional problems, including those related to monitoring and evaluation. 54. Nutrition sensitive interventions - interventions that have other objectives but have been tweaked to contribute to nutritional outcomes. 55. Nutrition specific interventions - interventions that address the immediate causes of undernutrition most of which are in the health sector. 56. Nutrition in Emergencies - key nutrition services that are components of emergency preparedness, response, and recovery phases aimed at preventing death and worsening of malnutrition in the affected population, particularly in the most nutritionally vulnerable groups: infants, children, pregnant women and breastfeeding mothers, and older persons."
    },
    {
      "term": "Community Nutrition Services NC II",
      "definition": "HHCCNS222 Promulgated (05/2022) 57. Obese Children - children aged zero to fifty-nine (0-59) months whose weight for length/height is above three (3) standard deviations from the median of the WHO"
