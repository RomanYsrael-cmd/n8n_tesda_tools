  "source_text": "1. Acute Malnutrition - occurs when an individual suffers from current, severe\nnutritional restrictions, a recent bout of illness, inappropriate childcare practices or\na combination of these factors.\n2. Age-in-days - the number of days from the child’s birth up to the date of\nmeasurement.\n3. Annual Investment Plan - refers to the annual slice of the Local Development\nInvestment Program (LDIP), which constitutes the total resource requirements for\nall Programs, Projects and Activities (PPAs) consisting of the annual capital\nexpenditure and regular operating requirements of the LGU.\n4. Anthropometric equipment - a measuring tool or device used to measure body\ndimensions.\n5. Anthropometric measurements - measures that are used to assess the size,\nshape, and composition of the human body.\n6. Barangay Nutrition Action Plan - local version of the Philippine Plan of Action\nfor Nutrition (PPAN) and is formulated by the Barangay Nutrition Committee. It\ncontains programs, projects, and activities for nutrition improvement.\n7. Barangay Nutrition Committee - is an organization at the barangay tasked to\nplan, implement, monitor, evaluate and coordinate the barangay nutrition action\nplan (BNAP).\n8. Barangay Nutrition Scholar - barangay-based volunteer worker responsible for\nthe delivery of nutrition and nutrition-related services in the community.\n9. Baseline - benchmark that is used as a basis for measuring or comparing past,\ncurrent and future past values.\n10. Breast milk expression - a technique using the hand, manual pump, or automatic\nelectric breast pump to express breastmilk from the breasts.\n11. Body height (standing) - body length in an upright or standing position.\n12. Body weight - amount or quantity of heaviness or mass of a person.\n13. Breastfeeding - unequalled way of providing ideal food for the healthy growth and\ndevelopment of infants. It is also an integral part of the reproductive process with\nimportant implications for the health of mothers.\n14. Calibration standard - used as a reference to compare against an instrument's\nresponse.\n15. Child Growth Standards - standards of growth for all children based on breastfed\ninfants and appropriately fed children of different ethnic origins raised in optimal\nconditions and measured in a standardized way. Its development was based on\nthe WHO Multicenter Growth Reference Study (WHO).\n16. Clients – refer to the target group for a nutrition intervention, such as mothers or\ncaregivers, fathers, children under five years old.\n17. Community nutrition assessment - the process of collecting, processing,\nanalyzing, and interpreting information on the nutrition problem obtained from\nanthropometric, biochemical, clinical, and dietary methods.\n\n--- PDF PAGE 164 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n160\n\n18. Compendium of Actions on Nutrition - a tool for local government unit (LGU)\nmobilization which summarizes the nutrition journey of 11 high performing LGUs\nalong nutrition program management.\n19. Compendium of Local Ordinances and Issuances on Nutrition – a knowledge-\nsharing platform for local government units to learn from initiatives of local\ngovernment units who have successfully harnessed the strength of policy\ninstruments in scaling up nutrition.\n20. Complementary Feeding - giving of solid and semi-solid foods to infants to\ncomplement nutrients from breastmilk to meet the infant’s nutritional requirements.\n21. Counseling (nutrition) - a “two-way interaction through which a client and a\ntrained counselor interpret the results of nutrition assessment, identify individual\nnutrition needs and goals, discuss ways to meet those goals, and agree on next\nsteps. Nutrition counseling aims to help clients understand important information\nabout their health and focuses on practical actions to address nutrition needs, as\nwell as the benefits of behavior change.\n22. Cycle menu - refers to a list of dishes to be served at a meal over a specified\nperiod. It is called a cycle menu, because a dish can be served in certain intervals,\npreferably odd-numbered days.\n23. Dietary Supplementation Program - aims to supplement the diets of nutritionally\nvulnerable groups, particularly pregnant women, and infants 6-23 months old in\nfood-insecure households, and wasted school children, especially those from very\npoor households. It also aims to supplement the diets of children enrolled in\ndaycare centers.\n24. e-OPT Plus tool - an Excel-based electronic system that makes data collection,\ncalculation, and reporting for Operation Timbang Plus activity more efficient and\naccurate.\n25. Early Childhood Care and Development - holistic development of children\nincluding physical, cognitive, language, social and emotional development from\nconception to eight (8) years old.\n26. Evaluation - systematic assessment of program implementation using a set of\ncriteria or standards, usually with reference to the objectives. It aims to understand\nthe factors contributing to such success or failure so as to better improve the\nprogram.\n27. Exclusive breastfeeding - is giving the infant no other food or drink, not even\nwater, except breast milk (including milk expressed or from a wet nurse) for the\nfirst six months of life, but allows the infant to receive oral rehydration solution,\ndrops and syrups, e.g., vitamins, minerals, and medicines.\n28. Family Profile – defined as a record of basic information about the preschoolers\nand the family they belong to, collected using BNS Form No. 1A.\n29. First 1,000 Days - period from conception to a child’s first two years of life and is\nconsidered the “golden window of opportunity” for the child to achieve his or her\nfull potential in the different aspects of development.\n30. First In, First Out System - a stock rotation system used for food storage wherein\nfood with the nearest best before or use-by dates are used or sold first.\n\n--- PDF PAGE 165 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n161\n\n31. Growth Monitoring and Promotion - serial monitoring of a child’s weight in the\nBarangay Health Center (BHC) or Rural Health Unit (RHU) aided by the ECCD\ncard.\n32. Hanging weighing scale - an equipment used to measure a child's weight.\n33. Height board - an equipment used to measure a child's height or length.\n34. Home and community gardening - refers to the promotion of the growing of fruits\nand vegetables and care of small animals like chicken in home yards or common\nspaces in the community. Promotion activities can include the distribution of\nseeds, seedlings and small animals; and provision of technical advice on the care\nof these fruits and vegetables, and small animals.\n35. Information, Education, and Communication materials - print materials that\nare intended to draw attention to information about health and nutrition\ninformation.\n36. Infant and Young Child Feeding - focuses on nutritional needs and feeding\npractices in children less than two years of age – the most critical period for child\nnutrition after which sub-optimal growth is hard to reverse.\n37. Integrated Management of Acute Malnutrition - aims to locate the acutely\nmalnourished especially those with severe acute malnutrition, and to provide the\nneeded medical and nutritional intervention.\n38. Integrated Management of Childhood Illness - a strategy to reduce under-five\nmortality caused by diarrhea and dehydration, pneumonia, measles, malaria,\ndengue hemorrhagic fever and malnutrition and anemia.\n39. Inpatient Therapeutic Care - involves management of complicated cases of SAM\naccording to WHO protocols on an inpatient basis at facilities with appropriate\ncapacity (hospitals).\n40. Length (recumbent) - analogous measure for the height of children less than two\nyears of age; taken while the child is lying down.\n41. Malnutrition - refers to deficiencies, excesses, or imbalances in a person's intake\nof protein and/or nutrients covering both undernutrition which includes suboptimal\nbreastfeeding, stunting, wasting or thinness, underweight and micronutrient\ndeficiencies, or insufficiencies, as well as overnutrition, which includes overweight\nand obesity.\n42. Mandatory Food Fortification - involves the addition of one or more nutrients to\nrice, flour, cooking oil as mandated by Republic Act 8976 and to salt as mandated\nby Republic Act 8172, or as prescribed by the NNC Governing Board.\n43. Micronutrient Supplementation - a short- to medium-term intervention, intended\nto prevent and/or correct high levels of micronutrient deficiencies by providing\nlarge doses of micronutrients immediately until more sustainable food-based\napproaches (e.g., food fortification and diet diversification) are put in place and\nbecome effective.\n44. Mid-upper arm circumference- circumference of the left upper arm, measured\nat the mid-point between the tip of the shoulder and the tip of the elbow (olecranon\nprocess and the acronium). Its utility is in identifying children who are not only\nwasted but are also at high risk of dying.\n45. Mixed feeding - a practice of feeding a baby with formula milk as well as breast\nmilk.\n\n--- PDF PAGE 166 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n162\n\n46. Moderate acute malnutrition (MAM) - means weight of children under 5 years is\nbetween 70% and 80% of the median weight-for-height or between -3 and -2 Z-\nscores weight-for-height.\n47. Monitoring - process of observing and checking the progress of the program\nbeing implemented in meeting the objectives and performance targets. It is done\nregularly.\n48. National Nutrition Promotion Program on Behavior Change - aims to facilitate\nthe adoption of positive practices that will impact on nutrition. It also aims to raise\nconsciousness on the importance of improving nutrition and ensure that the\nvarious nutrition-specific services are supported with appropriate communication\nactivities either as a separate complementary activity or as an activity integral to\nthe service.\n49. Nutritional status - condition of the body resulting from the intake, absorption and\nutilization of food.\n50. Nutritionally at-risk pregnant women - are those with a low pre-pregnancy body\nmass index (BMI), or those who do not gain sufficient weight during pregnancy,\nwith any of the following predisposing factors: narrowly-spaced pregnancies and\nbirths, situated in families with low income, with large number of dependents\nwhere food purchase is an economic problem, has previously given birth to a\npreterm or low birth weight infant, or other unfavorable prognostic factors, such as\nobesity or anemia, with diseases which influence nutritional status such as\ndiabetes, tuberculosis, drug addiction, alcoholism, and mental disorder.\n51. Nutrition education - any combination of educational strategies, accompanied by\nenvironmental supports, designed to facilitate the voluntary adoption of food\nchoices and other food- and nutrition-related behaviors conducive to health and\nwell-being. It is delivered through multiple venues and involves activities at the\nindividual, community, and policy levels. It aims to provide people in rural and\nurban areas with adequate information, skills and motivation to procure and to\nconsume appropriate diets.\n52. Nutrition intervention - is defined as any program, project or activity that will\ncontribute or improve the nutrition situation.\n53. Nutrition program management - is a decision-making process of identifying\npotential nutrition problems and needs of a specific population group; analyzing\npossible ways of preventing and controlling malnutrition; allocating resources\nbased on needs and expectations; and taking deliberate action to address\nnutritional problems, including those related to monitoring and evaluation.\n54. Nutrition sensitive interventions - interventions that have other objectives but\nhave been tweaked to contribute to nutritional outcomes.\n55. Nutrition specific interventions - interventions that address the immediate\ncauses of undernutrition most of which are in the health sector.\n56. Nutrition in Emergencies - key nutrition services that are components of\nemergency preparedness, response, and recovery phases aimed at preventing\ndeath and worsening of malnutrition in the affected population, particularly in the\nmost nutritionally vulnerable groups: infants, children, pregnant women and\nbreastfeeding mothers, and older persons.\n\n--- PDF PAGE 167 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n163\n\n57. Obese Children - children aged zero to fifty-nine (0-59) months whose weight for\nlength/height is above three (3) standard deviations from the median of the WHO\nChild Growth Standards.\n58. Outpatient Therapeutic Care - involves the management of non-complicated\ncases of SAM in outpatient care using ready-to-use therapeutic foods (RUTF)\nprovided on a weekly/ biweekly basis.\n59. Operation Timbang Plus - annual mass weighing of all preschoolers 0-71 months\nold in a community to identify and locate the malnourished children.\n60. Overweight Children- children aged zero to fifty-nine (0-59) months whose\nweight for length/height is above two (2) standard deviations from the median of\nthe WHO Child Growth Standards.\n61. Overweight and Obesity Management and Prevention Program - aims to\nprevent an increase in overweight and obesity among children 0-10 years old and\ndecrease prevalence rates among the rest of the population.\n62. Philippine Plan of Action for Nutrition - the framework for nutrition actions in\nthe country (Philippines). It identifies priority actions to achieve the outcomes. It\nshould serve as a guide to LGUs, NGOs and all related stakeholders in planning\nfor nutrition.\n63. Ready-to-Use Supplementary Food - highly fortified, nutrient dense pastes\nspecifically designed for prevention and treatment of moderate acute malnutrition\namong children over 6 months.\n64. Ready-to-Use Therapeutic Food - energy-dense, mineral- and vitamin-enriched\nfood that requires no preparation and is specifically designed to treat severe acute\nmalnutrition (SAM).\n65. Referral System - involves sending or referring a client or patient from a\ncommunity to a healthcare facility for proper management of a specific health\nand/or nutrition problem.\n66. Repayment scheme - a mandatory sharing system wherein beneficiaries of\ninputs should return a certain quantity for re-dispersal to other families.\n67. Resource mobilization – refers to activities that aim to mobilize and generate\nhuman and financial resources\n68. Severe Acute Malnutrition - refers to children aged 0-59 months with very low\nweight for length/height, defined as less than three SD below the median (<-3SD)\nof the WHO Growth Standards, characterized by visible severe wasting, the\npresence of bipedal pitting edema, or a MUAC measurement of less than one\nhundred fifteen millimeters (<115mm).\n69. Spot map - an aerial view of the barangay, where the important characteristics of\nthe barangay are indicated; it is a graphical presentation of the current nutrition\nsituation of a barangay.\n70. Stunted - children aged 0-59 months whose height for age is below minus two (2)\nstandard deviations (for moderate stunting) and minus three (3) standard\ndeviations (for severe stunting) from the median of the WHO Growth Standards.\n71. Underweight - children aged 0-59 whose weight for age is below minus 2\nstandard deviations and minus three (3) standard deviations (for severely\nunderweight) from the median of the WHO Growth Standards.\n\n--- PDF PAGE 168 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n164\n\n72. Wasted - a child's weight is less than expected for his/her height (underweight-\nfor-height); indicates acute deprivation of food or bout of current infection or\nillness.\n73. Wall chart - is a large chart on which words are written in letters large enough for\na group to read even from a distance. It is used to track progress of\naccomplishments of nutrition projects or activities.\n74. WASH - stands for water and sanitation hygiene; refers to services along the\nprovision of potable source of drinking water and appropriate sanitation facilities\nand services, and counselling and support on proper handwashing, personal\nhygiene, and environmental sanitation.\n\n--- PDF PAGE 169 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n165\n\nACRONYMS\n\nAIP\nAnnual Investment Plan\nALS\nAlternative Learning System\nBMI\nBody Mass Index\nBNAO\nBarangay Nutrition Action Officer\nBNAP\nBarangay Nutrition Action Plan\nBNC\nBarangay Nutrition Committee\nBNS\nBarangay Nutrition Scholar\nCAN\nCompendium on Actions for Nutrition\nCLM\nContextual Learning Matrix\nC/MNAO\nCity/Municipal Nutrition Action Officer\nDILG\nDepartment of Interior and Local Government\nDTS\nDual Training System\nDLP\nDualized Training Program\n\nDSP\nDietary Supplementation Program\nECCD\nEarly Childhood Care and Development\ne-OPT\nElectronic Operation Timbang\nFAO\nFood and Agriculture Organization\nF1K\n\nGAD\nFirst 1000 Days\n\nGender and Development\nHIV\nHuman Immunodeficiency Virus\nIEC\nInformation, Education and Communication\nITC\nInpatient Therapeutic Care\nIYCF\nInfant and Young Child Feeding\nIMCI\nIntegrated Management of Childhood Illness\nLGU\nLocal Government Unit\nLNC\nLocal Nutrition Committee\nLOI\nLetter of Instruction\nMAM\nModerate Acute Malnutrition\n\n--- PDF PAGE 170 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n166\n\nMELLPI\nPRO\nMonitoring and Evaluation of Local Level Program Implementation\nProtocol\nMS\nMicrosoft Software\nMTP\nMobile Training Program\nMUAC\nMid-Upper Arm Circumference\nNC\nNational Certificate\nNGO\nNon-Government Organization\nNTTC\nNational TVET Trainer’s Certificate\nOJT\nOn the Job Training\nOPT PLUS\nOperation Timbang Plus\nOTC\nOutpatient Therapeutic Care\nPIMAM\nPhilippine Integrated Management of Acute Malnutrition\nPPAN\nPhilippine Plan of Action for Nutrition\nPWD\nPersons with disabilities\nRPL\nRecognition of Prior Learning\nRUSF\nReady-to-use Supplemental Food\nRUTF\nReady-to-use Therapeutic Food\nSAG\nSelf-Assessment Guide\nSAM\nSevere Acute Malnutrition\nSD\nStandard Deviation\nSMART\nSpecific, Measurable, Attainable, Realistic, Time Bound\nWASH\nWater and Sanitation Hygiene\nWHO\nWorld Health Organization\nWTR\nWith Training Regulation\nTESDA\nTechnical Education and Skills Development Authority\nTVET\nTechnical and Vocational Education and Training\n\n--- PDF PAGE 171 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n167\n\nREFERENCES\n\nFood and Agriculture Organization of the United Nations. (2019). Electronic Tools for\nOperation Timbang Plus: User’s Guide. Manila, Philippines.\n\nDOH and UNICEF (2015). Manual of Operations for the National Guidelines on the\nManagement of Severe Acute Malnutrition for Children under five years. Manila,\nPhilippines.\n\nDOH and WFP (2016). Manual of Operations for the National Guidelines on the\nManagement of Moderate Acute Malnutrition for Children under five years. Manila,\nPhilippines.\n\nNational Nutrition Council. (2019). Barangay Nutrition Scholars Program Implementing\nGuidelines. Manila, Philippines.\n\nNational Nutrition Council. (2018). Compendium of Actions on Nutrition. Taguig,\nPhilippines\n\nNational Nutrition Council. (2018). Growth Monitoring and Promotion. Manila,\nPhilippines.\n\nNational Nutrition Council. (2018). Idol ko si Nanay - a facilitator’s guide: Learning\nsessions for the first 1000 days of life. Taguig, Philippines.\n\nNational Nutrition Council. (2012). Implementing Guidelines on Operation Timbang Plus\n(OPT+).\nhttps://www.nnc.gov.ph/phocadownloadpap/userupload/elavapie/OPT%20Plus%20Gui\ndelines.pdf\n\nNational Nutrition Council. Philippine Plan of Action for Nutrition 2017-2022. Manila,\nPhilippines 2017.\n\nNational Nutrition Council (2021). Philippine Plan of Action for Nutrition Implementing\nGuidelines on Dietary Supplementation in the First 1,000 Days of Life (11 February\n2021). Manila, Philippines.\n\nNational Nutrition Council and University of the Philippines Manila. (2014). Barangay\nNutrition Scholar (BNS) Handbook. Manila, Philippines.\n\nNational Nutrition Council and University of the Philippines Los Baños. (2013). Trainer’s\nManual on Basic Course for Barangay Nutrition Scholars. Manila: Philippines.\n\nPresidential Decree Number 1569. (1978). Strengthening the barangay nutrition\nprogram by providing for a barangay nutrition scholar in every barangay, providing\nfunds therefor, and for other\npurposes. https://www.officialgazette.gov.ph/1978/06/11/presidential-decree-no-1569-\ns-1978/\n\n--- PDF PAGE 172 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n168\n\nThe Implementing Rules and Regulations (IRR) of Republic Act (RA) 11148, otherwise\nknown as the “Kalusugan at Nutrisyon ng Mag-Nanay Act”. (2019).\nhttps://nnc.gov.ph/phocadownloadpap/userupload/Ro1-webpub/DOH%20MC%202019-\n0027.pdf\n\n--- PDF PAGE 173 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n169",
