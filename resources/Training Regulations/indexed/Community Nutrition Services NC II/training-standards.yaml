llowing equipment and\nmaterials:\n\nNumber\nUnit\nItem\n5\npc\nHanging-Type weighing scale\n5\npc\nHeight and Length Board\n100\npc\nMid-Upper Arm Circumference (MUAC) Tape,\nchildren\n100\npc\nMid-Upper Arm Circumference (MUAC) Tape, adult\n5\nset\nPIMAM Commodities: RUTF, RUSF, F75, F100\n15\npc\nIYCF Counseling Cards\n15\npc\nGuide on Mobilizing Community Support for Infant\nand Young Child Feeding (IYCF) Program\n15\npc\nIdol Ko Si Nanay Facilitator’s guide\n15\npc\nIdol Ko Si Tatay Facilitator’s guide\n15\npc\nFAO’s Gabay sa Pagsasagawa ng Participatory\nCooking Demonstrations with Recipe Book\n\nConsidering the wear and tear of these items, new set of equipment and\nmaterials shall be provided to accredited training centers offering the program every\nafter 3 years.\n\n--- PDF PAGE 157 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n153\n\n3.5 TRAINING FACILITIES\n\nBased on a class intake of 25 learners/trainees having 13 learners during\nlaboratory class. The computation below considers the current pandemic which\nrequires social distancing and other health protocols.\n\nTEACHING / LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nLecture area\n11 x 7.6\n83.6\n83.6\n Laboratory Area\n10.4 x 5.4\n56.0\n56.0\nTool Room and S/M storage\nArea\n2 x 4\n8.0\n8.0\nLearning Resources Area\n2 x 3\n6.0\n6.0\nWash Area/Comfort Room\n(male & female)\n3 x 2\n6.0\n6.0\nAdmin and Staff Room\n5 x 6\n30.0\n30.0\nCirculation Area\n\n30.0\nTotal Workshop Area 219.6 or 220 sq.m.\n\n3.6 TRAINER QUALIFICATIONS\n\n• Must be a holder of National TVET Trainer’s Certificate (NTTC) Level I in\nCommunity Nutrition Services NC II\n• Must be a licensed Nutritionist-Dietitian or currently practicing Allied Healthcare\nWorker with at least 3 straight years of experience on Public Health Nutrition in\nthe last 6 years.\n\n*Note: Current practice and work experience in Public Health Nutrition should be\nevidenced by a Certificate of 