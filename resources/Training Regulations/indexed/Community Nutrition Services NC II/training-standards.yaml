Modular/ Self-\npaced Learning\n• Distance\nLearning\n• Face-to-face\nlecture/\nDiscussion\n• Simulation\n• Individual home\nassignment\n• Work sample\n(accomplished\ndocumentation/\nreport)\n• Oral questioning/\ninterview\n• Written Test\n• Return\ndemonstration\n• Direct\nobservation of\ncandidate\n3 hours\n\n--- PDF PAGE 150 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n146\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nNutrition Action Plan (BNAP) based on the\nresults of the quarterly report\no Assist the Barangay Nutrition Committee in\ndeciding on the recommendations for plan\nmodification\no Assist the Barangay Secretary in\ndocumenting meetings in accordance with\nworkplace requirements\no Assist the committee in updating the results\nof the BNAP Quarterly Accomplishment\nReport summarized in a wall chart\no Update spot map with inputs from the\nmembers of BNC\no Assist the BNC in the evaluation of the\nBNAP using the MELLPI PRO tool for\nbarangays\no Demonstrate accuracy in reviewing and\nreporting data\no Demonstrate interpersonal skills\no Demonstrate computer literacy\no Write minutes of meeting\no Update and keep records\no Prepare a wall chart of accomplishments\no Update the spot map\n\n--- PDF PAGE 151 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n147\n\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\nb. Training\ndelivery\nis\nlearner-centered\nand\nshould\naccommodate\nindividualized and self-paced learning strategies;\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\nd. Assessment is based in the collection of evidence of the performance of\nwork to the industry required standards;\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\ng. Training completion is based on satisfactory completion of all specified\ncompetencies not on the specified nominal duration of learning.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities and their variations/components may be adopted singly or in\ncombination with other modalities when designing and delivering training\nprograms:\n\n2.1 Institution-Based:\n\n● Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP.\n\n● Distance learning is a formal education process in which majority of\nthe instruction occurs when the students and instructor are not in the\nsame place. Distance learning may employ correspondence study,\naudio, video, computer technologies or other modern technology that\ncan be used to facilitate learning and formal and non-formal training.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n● Supervised Industry Learning (SIL) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of\nthe trainee through actual experience in the workplace to acquire\nspecific competencies as prescribed in the training regulations. It is\nimperative that the deployment of trainees in the workplace is adhered\nto training programs agreed by the institution and enterprise and\nstatus and progress of trainees are closely monitored by the training\ninstitutions to prevent opportunity for work exploitation.\n\n--- PDF PAGE 152 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n148\n\n● The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n● Formal Apprenticeship is training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n● Informal Apprenticeship is based on a training (and working)\nagreement between an apprentice and a master craftsperson wherein\nthe agreement may be written or oral and the master craftsperson\ncommits to training the apprentice in all the skills relevant to his or her\ntrade over a significant period of time, usually between one and four\nyears, while the apprentice commits to contributing productively to the\nwork of the business. Training is integrated into the production\nprocess and apprentices learn by working alongside the experienced\ncraftsperson.\n\n● Enterprise-based Training where training is implemented within the\ncompany in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by the\nTESDA Secretariat.\n\n2.3 Community-Based\n\n● Community-Based is short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings\nsuch as barangay hall, basketball courts, etc. These programs can\nalso be mobile training program (MTP).\n\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who want to enroll in this qualification should possess the\nfollowing requirements:\n\n•\nMust have completed at least ten (10) years of basic education or Holder of\nAlternative Learning System (ALS) certificate of completion with grade ten (10)\nequivalent\n•\nMust have good communication skills\n•\nMust be physically fit (certification must be signed by the local government\nunit/municipal health office)\n•\nAt least eighteen (18) years old\n\n--- PDF PAGE 153 ---\nCommunity Nutrition Services NC II – HHCCNS222 Promulgated (05/2022)\n149\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment, and materials for the training of 25\ntrainees for Community Nutrition Services NC II.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be\nused as alternatives. This also applies in consideration of community practices and\ntheir availability in the local market.\n\nTOOLS*\nQuantity\nUnit\nSpecification/Description\nStandards\n15\nunit\ne-OPT Plus Tool (software)\n15\npc\nLocal Nutrition Committee functionality checklist\nBNAP Related\n25\npc\nBNAP Outline\n25\npc\nSample Barangay Nutrition Action Plan (BNAP)\n1\npc\nBNC Organizational Chart (mock-up)\n1\npc\nSample Problem Tree of Malnutrition (mock-up)\n1\npc\nSample Barangay Spot Map (mock-up)\n25\npc\nSample documentation of a nutrition program\n25\npc\nSample minutes of a meeting\n25\npc\nSample Annual Investment Plan\nCase Study\n25\npc\nCase Study – Sample OPT Plus Data\n25\npc\nAccomplished OPT Plus Form based on Case Study\n25\npc\nCase Study – Barangay Data for BNAP Formulation\n25\npc\nSample Cycle Menu for Dietary Supplementation\nCollaterals/IEC Materials\n25\nset\nPinggang Pinoy Collaterals\n25\nset\n10 Kumainments, fan\n*all tools can be downloaded from NNC website\n\nEQUIPMENT\nQuantity\nUnit\nSpecifications/ Description\nAnthropometric Measurements\n5\nunit\nHanging-Type Weighing Scale (or other acceptable and\nrecommended weighing scale)\n5\nunit/set\nHeight board and Length Board or 2-in-1\n25\nunit\nMid upper arm circumference tape\n5\nunit\nImprovised weight calibrator (e.g.,