duce digital cleaned-up drawings Produce digital in- between drawings Produce background designs Composite and edit animation sequence Create 3D digital animation Produce storyboard for animation Coordinate the production of animation Produce over-all designs for animation Produce key drawings for animation Create 3D models for animation Apply 3D texture and lighting to 3D models Set character rigging Animate character Composite and render animation sequence Create 2D digital animation Produce cleaned-up and in-between drawings Use an authoring tool to create an interactive sequence Produce key drawings for animation Utilize Software Methodologies Develop Responsive Web Design Create Interactive Websites (Using JavaScript) Develop Website Backend Systems Develop designs for a logo Develop designs for print media Develop designs for user experience Develop designs for user interface Develop designs for product packaging Design booth and product/window display --- PDF PAGE 88 --- __________________________________________________________________________________ 84 TR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018"
