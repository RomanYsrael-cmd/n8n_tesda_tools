IPPINES, INC. (ACPI) • THE TESDA BOARD - STANDARDS SETTING AND SYSTEMS • THE PARTICIPANTS IN THE NATIONAL VALIDATION OF THIS TRAINING • ROSELLE R. GONZALES - Tooncity Academy • NOEL ANTONIO G. VILLANO - iSTORYA Creative Studio • ARIEL G. VILLAR - Tooncity Academy • ALEXANDER C. RAGSAC - Red Door Animation, Inc. • RODILLO C. MONOY - Immersive Animation, Inc. • MARIE GRACE A. DIMARANAN - Top Peg Animation Studio • THE MANAGEMENT AND STAFF OF THE TESDA SECRETARIAT • Qualifications and Standards Office (QSO)"
