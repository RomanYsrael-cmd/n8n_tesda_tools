    {
      "number": "1",
      "text": "Certification - is the process of verifying and validating the competencies of a person through assessment"
    },
    {
      "number": "2",
      "text": "Certificate of Competency (COC) – is a certification issued to individuals who pass the assessment for a single unit or cluster of units of competency"
    },
    {
      "number": "3",
      "text": "Common Competencies - are the skills and knowledge needed by all people working in a particular industry"
    },
    {
      "number": "4",
      "text": "Competency - is the possession and application of knowledge, skills and attitudes to perform work activities to the standard expected in the workplace"
    },
    {
      "number": "5",
      "text": "Competency Assessment - is the process of collecting evidence and making judgements on whether competency has been achieved"
    },
    {
      "number": "6",
      "text": "Competency Standard (CS) - is the industry-determined specification of competencies required for effective work performance"
    },
    {
      "number": "7",
      "text": "Context of Assessment - refers to the place where assessment is to be conducted or carried out"
    },
    {
      "number": "8",
      "text": "Core Competencies - are the specific skills and knowledge needed in a particular area of work - industry sector/occupation/job role"
    },
    {
      "number": "9",
      "text": "Critical aspects of competency - refers to the evidence that is essential for successful performance of the unit of competency"
    },
    {
      "number": "10",
      "text": "Elective Competencies - are the additional skills and knowledge required by the individual or enterprise for work"
    },
    {
      "number": "11",
      "text": "Elements - are the building blocks of a unit of competency. They describe in outcome terms the functions that a person performs in the workplace"
    },
    {
      "number": "12",
      "text": "Evidence Guide - is a component of the unit of competency that defines or identifies the evidences required to determine the competence of the individual. It provides information on critical aspects of competency, underpinning knowledge, underpinning skills, resource implications, assessment method and context of assessment"
    },
    {
      "number": "13",
      "text": "Level - refers to the category of skills and knowledge required to do a job"
    },
    {
      "number": "14",
      "text": "Method of Assessment - refers to the ways of collecting evidence and when evidence should be collected"
    },
    {
      "number": "15",
      "text": "National Certificate (NC) – is a certification issued to individuals who achieve all the required units of competency for a national qualification defined under the Training Regulations. NCs are aligned to specific levels within the PTQF"
    },
    {
      "number": "16",
      "text": "Performance Criteria - are evaluative statements that specify what is to be assessed and the required level of performance --- PDF PAGE 89 --- __________________________________________________________________________________ 85 TR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018"
    },
    {
      "number": "17",
      "text": "Qualification - is a cluster of units of competencies that meets job roles and is significant in the workplace. It is also a certification awarded to a person on successful completion of a course in recognition of having demonstrated competencies in an industry sector"
    },
    {
      "number": "18",
      "text": "Range of Variables - describes the circumstances or context in which the work is to be performed"
    },
    {
      "number": "19",
      "text": "Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s skills, knowledge and attitudes gained from life and work experiences outside registered training programs"
    },
    {
      "number": "20",
      "text": "Resource Implications - refers to the resources needed for the successful performance of the work activity described in the unit of competency. It includes work environment and conditions, materials, tools and equipment"
    },
    {
      "number": "21",
      "text": "Basic Competencies - are the skills and knowledge that everyone needs for work"
    },
    {
      "number": "22",
      "text": "Training Regulations (TR) – refers to the document promulgated and issued by TESDA consisting of competency standards, national qualifications and training guidelines for specific sectors/occupations. The TR serves as basis for establishment of qualification and certification under the PTQF. It also serves as guide for development of competency-based curricula and instructional materials including registration of TVET programs offered by TVET providers"
    },
    {
      "number": "23",
      "text": "Underpinning Knowledge - refers to the competency that involves in applying knowledge to perform work activities. It includes specific knowledge that is essential to the performance of the competency"
    },
    {
      "number": "24",
      "text": "Underpinning Skills - refers to the list of the skills needed to achieve the elements and performance criteria in the unit of competency. It includes generic and industry specific skills"
    },
    {
      "number": "25",
      "text": "Unit of Competency – is a component of the competency standards stating a specific key function or role in a particular job or occupation; it is the smallest component of achievement that can be assessed and certified under the PTQF"
    },
    {
      "number": "1",
      "text": "Animation – a simulation of movement created by displaying a series of pictures, or frames. Cartoons on television are one example of animation. Animation on computers is one of the chief ingredients of multimedia presentations. There are many software applications that enable you to create animations that you can display on a computer monitor."
    },
    {
      "number": "2",
      "text": "2D Animation – the creation of moving pictures in a two-dimensional environment, such as through \"traditional\" cel animation or in computerized animation software. This is done by sequencing consecutive images, or \"frames\", that simulate motion by each image showing the next in a gradual progression of steps."
    },
    {
      "number": "3",
      "text": "Browser – a software package that provides the user interface for accessing Internet, intranet and extranet Web sites. --- PDF PAGE 90 --- __________________________________________________________________________________ 86 TR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018"
    },
    {
      "number": "4",
      "text": "Clean-up - refers to the process of refining the rough artwork of 2D animation. The purpose of clean-up is to recreate the animation with smooth, consistent line art and line weights before it is transferred to cels for painting."
    },
    {
      "number": "5",
      "text": "Computer – a device that has the ability to accept data; internally store and execute a program of instructions; perform mathematical, logical, and manipulative operations on data; and report the results."
    },
    {
      "number": "6",
      "text": "Computer Terminal – any input/output device connected by telecommunications links to a computer."
    },
    {
      "number": "7",
      "text": "Data - objective measurements of the attributes (characteristics) of entities such as people, places, things, and events."
    },
    {
      "number": "8",
      "text": "Documentation – a collection of documents or information."
    },
    {
      "number": "9",
      "text": "Edit – to modify the form or format of data"
    },
    {
      "number": "10",
      "text": "Encryption – to scramble data or convert it, prior to transmission, to a secret code that masks the meaning of he data to unauthorized recipients."
    },
    {
      "number": "11",
      "text": "End user – anyone who uses an information system or the information it produces."
    },
    {
      "number": "12",
      "text": "Ergonomics - the science and technology emphasizing the safety, comfort, and ease of use of human-operated machines. The goal of ergonomics is to produce systems that are user-friendly: safe, comfortable and easy to use."
    },
    {
      "number": "13",
      "text": "Information – data placed in a meaningful and useful context for an end user."
    },
    {
      "number": "14",
      "text": "Information and Communication Technology (ICT) - refers to technologies associated with the transmission and exchange of data in the form of sound, text, visual images, signals or any combination of those forms through the use of digital technology. It encompasses such services as telecommunications, posts, multimedia, electronic commerce, broadcasting, and information technology."
    },
    {
      "number": "15",
      "text": "Key frame - is a single still image in an animated sequence that occurs at an important point in that sequence; key frames are defined throughout an animated sequence, in order to define pivotal points of motion before the frames in between are drawn or otherwise created to \"tween\" the motion between the two key frames."
    },
    {
      "number": "16",
      "text": "Local Area Network (LAN) – a communications network that typically connects computers, terminals, and other computerized devices within a limited physical area such as an office, building, manufacturing plant and other work sites."
    },
    {
      "number": "17",
      "text": "Outsourcing – turning over all or part of an organization’s information systems operation to outside contractors, known as systems integrators or facilities management companies."
    },
    {
      "number": "18",
      "text": "Quality Assurance – methods for ensuring that information systems are free from errors and fraud and provide information products of high quality. --- PDF PAGE 91 --- __________________________________________________________________________________ 87 TR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018"
    },
    {
      "number": "19",
      "text": "Simulation - the process of imitating a real phenomenon with a set of mathematical formulas. Advanced computer programs can simulate weather conditions, chemical reactions, atomic reactions, even biological processes."
    },
    {
      "number": "20",
      "text": "Software – computer programs and procedures concerned with the operation of an information system."
    },
    {
      "number": "21",
      "text": "Standards – measures of performance developed to evaluate the progress of a system toward its objectives"
    },
    {
      "number": "22",
      "text": "System – an assembly of methods, procedures, or techniques unified by regulated interaction to form an organized whole"
    },
    {
      "number": "23",
      "text": "Tween - is actually short for \"in-between\", and refers to the creation of successive frames of animation between key frames. In computer animation, the term is most commonly used for Flash's \"shape tweening\" and \"motion tweening\" processes, where the user can define two key frames and Flash will automatically create the in-between frames, either morphing one shape into another over a set period of time or else moving a shape or shapes from point A to point B over a set period of time. 3D animation programs also have their own method of \"tweening\"."
    },
    {
      "number": "24",
      "text": "Vector - is a line or a movement defined by end-points or, essentially, the distance between point A and point B. Vectors can be used to calculate animated motion mathematically instead of through the use of manual key frames; vectors can also be used to define computer-animated shapes."
    },
    {
      "number": "25",
      "text": "Vector animation - is a term used to refer to animation whose art or motion is controlled by vectors rather than pixels. Vector animation often allows cleaner, smoother animation, because images are displayed and/or resized using mathematical values instead of stored pixel values. One of the most commonly used vector animation programs is Macromedia's Flash."
    },
