      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification of 2D Animation NC III, the candidate must demonstrate competency in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate III level signed by the TESDA Director General. 4.1.2 The qualification of 2D Animation NC III may be attained through: 4.1.2.1 Accumulation of Certificates of Competency (COCs) in all the following units of competency: COC 1 - Producing traditional key poses/drawings for animation • Produce traditional key poses/drawings for animation • Export animation to video file format COC 2 - Creating tradigital animation • Create tradigital animation • Export animation to video file format COC 3 - Creating 2D digital cut-out animation • Create 2D digital cut-out animation • Export animation to video file format Successful candidates shall be awarded a Certificate of Competency (COC) in each of the core units. 4.1.2.2 Demonstration of competence through a single comprehensive project-type assessment covering all required units of competency of this qualification. 4.1.3 Upon accumulation and submission of all COCs acquired for all the relevant units of competency comprising this qualification, an individual shall be issued the corresponding National Certificate. 4.1.4 Assessment shall cover all competencies, with basic and common integrated or assessed concurrently with the core units of competency. 4.1.5 Any of the following are qualified to apply for assessment and certification: 4.1.5.1 Graduate of formal, non-formal, and informal, including enterprise- based, training programs. 4.1.5.2 Experienced workers (wage employed or self-employed) 4.1.6 Existing National Certificates (NCs) and Certificates of Competency (COCs) of individuals in 2D Animation NCIII shall continue to be in effect until the said NCs and COCs will have expired. The NCs or COCs in this qualification maybe renewed under this amended/updated TR provided that the: 4.1.6.1 NC holders present evidence that they are currently or have been employed in animation job for the past three (3) years; and 4.1.6.2 Said NC holders pass the performance assessment of the new COC#1 (Produce Traditional key poses/drawings for animation) under this amended/updated TR; 4.1.6.3 COC holders for “Create 2D digital animation” present evidence that they are currently or have been employed in 2D animation job for the past three (3) years. 4.1.7 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)”."
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment. 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification."
