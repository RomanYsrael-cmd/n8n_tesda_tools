  "source_text": "SECTION 4. ASSESSMENT AND CERTIFICATION ARRANGEMENT \n \n \n \nCompetency Assessment is the process of collecting evidence and making \njudgments whether competency has been achieved. The purpose of assessment is to \nconfirm that an individual can perform to the standards expected at the workplace as \nexpressed in relevant competency standards. \n \nThe assessment process is based on evidence or information gathered to prove \nachievement of competencies. The process may be applied to an employable unit(s) of \ncompetency in partial fulfillment of the requirements of the national qualification. \n \n4.1. NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS \n \n4.1.1 To attain the National Qualification of 2D Animation NC III, the candidate \nmust demonstrate competency in all the units listed in Section 1. Successful \ncandidates shall be awarded a National Certificate III level signed by the \nTESDA Director General. \n \n \n4.1.2 The qualification of 2D Animation NC III may be attained through: \n \n4.1.2.1 Accumulation of Certificates of Competency (COCs) in all the \nfollowing units of competency: \nCOC 1 - Producing traditional key poses/drawings for animation \n• Produce traditional key poses/drawings for animation \n• Export animation to video file format \n \nCOC 2 - Creating tradigital animation \n• Create tradigital animation \n• Export animation to video file format \n \nCOC 3 - Creating 2D digital cut-out animation \n• Create 2D digital cut-out animation \n• Export animation to video file format \n \nSuccessful candidates shall be awarded a Certificate of \nCompetency (COC) in each of the core units. \n \n4.1.2.2 Demonstration of competence through a single comprehensive \nproject-type assessment covering all required units of competency of \nthis qualification. \n \n4.1.3 Upon accumulation and submission of all COCs acquired for all the relevant \nunits of competency comprising this qualification, an individual shall be issued \nthe corresponding National Certificate. \n \n4.1.4 Assessment shall cover all competencies, with basic and common integrated \nor assessed concurrently with the core units of competency.\n\n--- PDF PAGE 85 ---\n__________________________________________________________________________________ 81 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \n4.1.5 Any of the following are qualified to apply for assessment and certification: \n \n4.1.5.1 Graduate of formal, non-formal, and informal, including enterprise-\nbased, training programs. \n \n4.1.5.2 Experienced workers (wage employed or self-employed) \n \n4.1.6 Existing National Certificates (NCs) and Certificates of Competency (COCs) of \nindividuals in 2D Animation NCIII shall continue to be in effect until the said \nNCs and COCs will have expired. The NCs or COCs in this qualification \nmaybe renewed under this amended/updated TR provided that the: \n \n4.1.6.1 NC holders present evidence that they are currently or have been \nemployed in animation job for the past three (3) years; and \n \n4.1.6.2 Said NC holders pass the performance assessment of the new \nCOC#1 (Produce Traditional key poses/drawings for animation) \nunder this amended/updated TR; \n \n4.1.6.3 COC holders for “Create 2D digital animation” present evidence that \nthey are currently or have been employed in 2D animation job for the \npast three (3) years. \n \n4.1.7 The guidelines on assessment and certification are discussed in detail in the \n“Procedures Manual on Assessment and Certification” and “Guidelines on the \nImplementation of the Philippine TVET Competency Assessment and \nCertification System (PTCACS)”. \n \n \n4.2. COMPETENCY ASSESSMENT REQUISITE \n \n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is \naccomplished by the candidate prior to actual competency assessment. \nSAG is a pre-assessment tool to help the candidate and the assessor \ndetermine what evidence is available, where gaps exist, including \nreadiness for assessment. \n \nThis document can: \na. Identify the candidate’s skills and knowledge \nb. Highlight gaps in candidate’s skills and knowledge \nc. Provide critical guidance to the assessor and candidate on the \nevidence that need to be presented \nd. Assist the candidate to identify key areas in which practice is needed \nor additional information or skills that should be gained prior to \nassessment. \n \n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by \nTESDA is authorized to conduct competency assessment. Assessment \ncenters undergo a quality assured procedure for accreditation before they \nare authorized by TESDA to manage the assessment for National \nCertification.\n\n--- PDF PAGE 86 ---\n__________________________________________________________________________________ 82 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \n \n4.2.3 Accredited Competency Assessor. Only accredited competency assessor \nis authorized to conduct assessment of competence. Competency \nassessors undergo a quality assured system of accreditation procedure \nbefore they are authorized by TESDA to assess the competencies of \ncandidates for National Certification.\n\n--- PDF PAGE 87 ---\n__________________________________________________________________________________ 83 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nANNEX A. ICT COMPETENCY MAP – 2D ANIMATION NC III \n \nBASIC COMPETENCIES \n \nReceive and Respond \nto Workplace \nCommunication \nWork with Others \nDemonstrate work \nvalues \nPractice basic \nhousekeeping \nprocedures \nParticipate in Workplace \nCommunication \nWork in a Team \nEnvironment \nPractice career \nprofessionalism \nPractice occupational \nhealth and safety \nprocedures \nLead Workplace \nCommunication \nLead Small Team \nDevelop and practice \nnegotiation skills \nSolve Problems \nRelated to Work \nActivities \nUse mathematical \nconcepts and \ntechniques \nUse relevant \ntechnologies \nUtilize Specialist \nCommunication Skills\nDevelop Team and \nIndividuals \nApply Problem Solving \nTechniques in the \nWorkplace \nCollect, analyze and \norganize information \nPlan and Organize \nWork \nPromote environmental \nprotection \n \nCOMMON COMPETENCIES \n \nApply Quality \nStandards \nOperate a Personal \nComputer \n \n \n \n \nCORE COMPETENCIES \n \nCommunicate \neffectively in a customer \ncontact center \nRender quality \ncustomer service \nUtilize enterprise/ \ncompany technology \nConduct contact \ncenter campaign \nProvide specialized \nsupport and assistance \nto customers \nLead a contact center \nwork team \nManage the activities \nof a contact center \nwork team\nUse business \ntechnology \nUse medical \ntechnology to carry \nout task\nProduce text from audio \ntranscription \nReview/edit documents \nLead a team in \ndelivering quality \nservice \nApply traditional \ndrawing techniques \nfor animation \nProduce traditional \ncleaned-up drawings \nProduce traditional in-\nbetween drawings \nProduce Traditional \nkey poses/drawings \nfor animation\nCreate 2D digital \nanimation \nExport Animation \ninto Video file \nformat\nProduce digital \ncleaned-up drawings \nProduce digital in-\nbetween drawings \nProduce background \ndesigns \nComposite and edit \nanimation sequence \nCreate 3D digital \nanimation \nProduce storyboard \nfor animation \nCoordinate the \nproduction of animation \nProduce over-all \ndesigns for animation \nProduce key drawings \nfor animation \nCreate 3D models for \nanimation \nApply 3D texture and \nlighting to 3D models \nSet character rigging \nAnimate character \nComposite and render \nanimation sequence \nCreate 2D digital \nanimation \nProduce cleaned-up \nand in-between \ndrawings \nUse an authoring tool to \ncreate an interactive \nsequence \nProduce key drawings \nfor animation \nUtilize Software \nMethodologies \nDevelop Responsive \nWeb Design \nCreate Interactive \nWebsites (Using JavaScript) \nDevelop Website \nBackend Systems \nDevelop designs for a \nlogo \nDevelop designs for \nprint media \nDevelop designs for \nuser experience \nDevelop designs for \nuser interface \nDevelop designs for \nproduct packaging \nDesign booth and \nproduct/window display\n\n--- PDF PAGE 88 ---\n__________________________________________________________________________________ 84 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nDEFINITION OF TERMS \n \n \nGENERAL \n \n1) Certification - is the process of verifying and validating the competencies of a \nperson through assessment \n \n2) Certificate of Competency (COC) – is a certification issued to individuals who \npass the assessment for a single unit or cluster of units of competency \n \n3) Common Competencies - are the skills and knowledge needed by all people \nworking in a particular industry \n \n4) Competency - is the possession and application of knowledge, skills and attitudes \nto perform work activities to the standard expected in the workplace \n \n5) Competency Assessment - is the process of collecting evidence and making \njudgements on whether competency has been achieved \n \n6) Competency Standard (CS) - is the industry-determined specification of \ncompetencies required for effective work performance \n \n7) Context of Assessment - refers to the place where assessment is to be \nconducted or carried out \n \n8) Core Competencies - are the specific skills and knowledge needed in a particular \narea of work - industry sector/occupation/job role \n \n9) Critical aspects of competency - refers to the evidence that is essential for \nsuccessful performance of the unit of competency \n \n10) Elective Competencies - are the additional skills and knowledge required by the \nindividual or enterprise for work \n \n11) Elements - are the building blocks of a unit of competency. They describe in \noutcome terms the functions that a person performs in the workplace \n \n12) Evidence Guide - is a component of the unit of competency that defines or \nidentifies the evidences required to determine the competence of the individual. It \nprovides information on critical aspects of competency, underpinning knowledge, \nunderpinning skills, resource implications, assessment method and context of \nassessment \n \n13) Level - refers to the category of skills and knowledge required to do a job \n \n14) Method of Assessment - refers to the ways of collecting evidence and when \nevidence should be collected \n \n15) National Certificate (NC) – is a certification issued to individuals who achieve all \nthe required units of competency for a national qualification defined under the \nTraining Regulations. NCs are aligned to specific levels within the PTQF \n \n16) Performance Criteria - are evaluative statements that specify what is to be \nassessed and the required level of performance\n\n--- PDF PAGE 89 ---\n__________________________________________________________________________________ 85 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \n17) Qualification - is a cluster of units of competencies that meets job roles and is \nsignificant in the workplace. It is also a certification awarded to a person on \nsuccessful completion of a course in recognition of having demonstrated \ncompetencies in an industry sector \n \n18) Range of Variables - describes the circumstances or context in which the work is \nto be performed \n \n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s \nskills, knowledge and attitudes gained from life and work experiences outside \nregistered training programs \n \n20) Resource Implications - refers to the resources needed for the successful \nperformance of the work activity described in the unit of competency. It includes \nwork environment and conditions, materials, tools and equipment \n \n21) Basic Competencies - are the skills and knowledge that everyone needs for work \n \n22) Training Regulations (TR) – refers to the document promulgated and issued by \nTESDA consisting of competency standards, national qualifications and training \nguidelines for specific sectors/occupations. The TR serves as basis for \nestablishment of qualification and certification under the PTQF. It also serves as \nguide for development of competency-based curricula and instructional materials \nincluding registration of TVET programs offered by TVET providers \n \n23) Underpinning Knowledge - refers to the competency that involves in applying \nknowledge to perform work activities. It includes specific knowledge that is \nessential to the performance of the competency \n \n24) Underpinning Skills - refers to the list of the skills needed to achieve the elements \nand performance criteria in the unit of competency. It includes generic and industry \nspecific skills \n \n25) Unit of Competency – is a component of the competency standards stating a \nspecific key function or role in a particular job or occupation; it is the smallest \ncomponent of achievement that can be assessed and certified under the PTQF \n \n \nSECTOR SPECIFIC \n \n1. Animation – a simulation of movement created by displaying a series of pictures, \nor frames. Cartoons on television are one example of animation. Animation on \ncomputers is one of the chief ingredients of multimedia presentations. There are \nmany software applications that enable you to create animations that you can \ndisplay on a computer monitor. \n2. 2D Animation – the creation of moving pictures in a two-dimensional \nenvironment, such as through \"traditional\" cel animation or in computerized \nanimation software. This is done by sequencing consecutive images, or \"frames\", \nthat simulate motion by each image showing the next in a gradual progression of \nsteps. \n3. Browser – a software package that provides the user interface for accessing \nInternet, intranet and extranet Web sites.\n\n--- PDF PAGE 90 ---\n__________________________________________________________________________________ 86 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \n4. Clean-up - refers to the process of refining the rough artwork of 2D animation. \nThe purpose of clean-up is to recreate the animation with smooth, consistent line \nart and line weights before it is transferred to cels for painting. \n5. Computer – a device that has the ability to accept data; internally store and \nexecute a program of instructions; perform mathematical, logical, and \nmanipulative operations on data; and report the results. \n6. Computer Terminal – any input/output device connected by telecommunications \nlinks to a computer. \n7. Data - objective measurements of the attributes (characteristics) of entities such \nas people, places, things, and events. \n8. Documentation – a collection of documents or information. \n9. Edit – to modify the form or format of data \n10. Encryption – to scramble data or convert it, prior to transmission, to a secret code \nthat masks the meaning of he data to unauthorized recipients. \n11. End user – anyone who uses an information system or the information it \nproduces. \n12. Ergonomics - the science and technology emphasizing the safety, comfort, and \nease of use of human-operated machines. The goal of ergonomics is to produce \nsystems that are user-friendly: safe, comfortable and easy to use. \n13. Information – data placed in a meaningful and useful context for an end user. \n14. Information and Communication Technology (ICT) - refers to technologies \nassociated with the transmission and exchange of data in the form of sound, text, \nvisual images, signals or any combination of those forms through the use of digital \ntechnology. It encompasses such services as telecommunications, posts, \nmultimedia, electronic commerce, broadcasting, and information technology. \n15. Key frame - is a single still image in an animated sequence that occurs at an \nimportant point in that sequence; key frames are defined throughout an animated \nsequence, in order to define pivotal points of motion before the frames in between \nare drawn or otherwise created to \"tween\" the motion between the two key frames. \n16. Local Area Network (LAN) – a communications network that typically connects \ncomputers, terminals, and other computerized devices within a limited physical \narea such as an office, building, manufacturing plant and other work sites. \n17. Outsourcing – turning over all or part of an organization’s information systems \noperation to outside contractors, known as systems integrators or facilities \nmanagement companies. \n18. Quality Assurance – methods for ensuring that information systems are free from \nerrors and fraud and provide information products of high quality.\n\n--- PDF PAGE 91 ---\n__________________________________________________________________________________ 87 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \n19. Simulation - the process of imitating a real phenomenon with a set of \nmathematical formulas. Advanced computer programs can simulate weather \nconditions, chemical reactions, atomic reactions, even biological processes. \n20. Software – computer programs and procedures concerned with the operation of \nan information system. \n21. Standards – measures of performance developed to evaluate the progress of a \nsystem toward its objectives \n22. System – an assembly of methods, procedures, or techniques unified by \nregulated interaction to form an organized whole \n23. Tween - is actually short for \"in-between\", and refers to the creation of \nsuccessive frames of animation between key frames. In computer animation, the \nterm is most commonly used for Flash's \"shape tweening\" and \"motion tweening\" \nprocesses, where the user can define two key frames and Flash will automatically \ncreate the in-between frames, either morphing one shape into another over a set \nperiod of time or else moving a shape or shapes from point A to point B over a set \nperiod of time. 3D animation programs also have their own method of \"tweening\". \n24. Vector - is a line or a movement defined by end-points or, essentially, the distance \nbetween point A and point B. Vectors can be used to calculate animated motion \nmathematically instead of through the use of manual key frames; vectors can also \nbe used to define computer-animated shapes. \n25. Vector animation - is a term used to refer to animation whose art or motion is \ncontrolled by vectors rather than pixels. Vector animation often allows cleaner, \nsmoother animation, because images are displayed and/or resized using \nmathematical values instead of stored pixel values. One of the most commonly \nused vector animation programs is Macromedia's Flash. \n26. User- friendly – a characteristic of human-operated equipment and systems that \nmakes them safe, comfortable, and easy to use.\n\n--- PDF PAGE 92 ---\n__________________________________________________________________________________ 88 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \n \n \nQualification Title : 2D Animation NC III \nQualification Code: ICTA2D318 \n \n \nRevision \nNo. \n \nDocument \nDescription Types* \nReplaces Version \n(TESDA Board \nResolution No./ \nDate)\nNew Version \n(TESDA Board \nResolution No./ \nDate)\n \nDeployment \nCircular \n00 \nDocument Created – \nAnimation NC III \nNot Applicable \nTB No. 2005-19/ \nNovember 10, 2005 \nNot Applicable \n01 \nDocument Amended – \n2D Animation NC III \n \nTB No. 2005-19/ \nNovember 10, 2005 \nTB No. 2007-22/ \nJuly 27, 2007 \nNot Applicable \n02 \nDocument Amended – \n2D Animation NC III \n \nTB No. 2007-22/ \nJuly 27, 2007 \nTB No. 2018-04/ \nFebruary 27, 2018 \nTESDA Circular \nNo. __ s. 2018 \n Legend: *Description Types \n- Document Created \n- Document Amended\n\n--- PDF PAGE 93 ---\n__________________________________________________________________________________ 89 \nTR –