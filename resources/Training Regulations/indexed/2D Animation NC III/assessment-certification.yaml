  "source_text": "SECTION 4. ASSESSMENT AND CERTIFICATION ARRANGEMENT\n\n\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1. NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 To attain the National Qualification of 2D Animation NC III, the candidate\nmust demonstrate competency in all the units listed in Section 1. Successful\ncandidates shall be awarded a National Certificate III level signed by the\nTESDA Director General.\n\n\n4.1.2 The qualification of 2D Animation NC III may be attained through:\n\n4.1.2.1 Accumulation of Certificates of Competency (COCs) in all the\nfollowing units of competency:\nCOC 1 - Producing traditional key poses/drawings for animation\n• Produce traditional key poses/drawings for animation\n• Export animation to video file format\n\nCOC 2 - Creating tradigital animation\n• Create tradigital animation\n• Export animation to video file format\n\nCOC 3 - Creating 2D digital cut-out animation\n• Create 2D digital cut-out animation\n• Export animation to video file format\n\nSuccessful candidates shall be awarded a Certificate of\nCompetency (COC) in each of the core units.\n\n4.1.2.2 Demonstration of competence through a single comprehensive\nproject-type assessment covering all required units of competency of\nthis qualification.\n\n4.1.3 Upon accumulation and submission of all COCs acquired for all the relevant\nunits of competency comprising this qualification, an individual shall be issued\nthe corresponding National Certificate.\n\n4.1.4 Assessment shall cover all competencies, with basic and common integrated\nor assessed concurrently with the core units of competency.\n\n--- PDF PAGE 85 ---\n__________________________________________________________________________________ 81\nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018\n4.1.5 Any of the following are qualified to apply for assessment and certification:\n\n4.1.5.1 Graduate of formal, non-formal, and informal, including enterprise-\nbased, training programs.\n\n4.1.5.2 Experienced workers (wage employed or self-employed)\n\n4.1.6 Existing National Certificates (NCs) and Certificates of Competency (COCs) of\nindividuals in 2D Animation NCIII shall continue to be in effect until the said\nNCs and COCs will have expired. The NCs or COCs in this qualification\nmaybe renewed under this amended/updated TR provided that the:\n\n4.1.6.1 NC holders present evidence that they are currently or have been\nemployed in animation job for the past three (3) years; and\n\n4.1.6.2 Said NC holders pass the performance assessment of the new\nCOC#1 (Produce Traditional key poses/drawings for animation)\nunder this amended/updated TR;\n\n4.1.6.3 COC holders for “Create 2D digital animation” present evidence that\nthey are currently or have been employed in 2D animation job for the\npast three (3) years.\n\n4.1.7 The guidelines on assessment and certification are discussed in detail in the\n“Procedures Manual on Assessment and Certification” and “Guidelines on the\nImplementation of the Philippine TVET Competency Assessment and\nCertification System (PTCACS)”.\n\n\n4.2. COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd. Assist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior to\nassessment.\n\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they\nare authorized by TESDA to manage the assessment for National\nCertification.\n\n--- PDF PAGE 86 ---\n__________________________________________________________________________________ 82\nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor\nis authorized to conduct assessment of competence. Competency\nassessors undergo a quality assured system of accreditation procedure\nbefore they are authorized by TESDA to assess the competencies of\ncandidates for National Certification.\n\n--- PDF PAGE 87 ---\n__________________________________________________________________________________ 83\nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018\n"
