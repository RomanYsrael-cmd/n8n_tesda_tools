          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \ntraditional \nanimation \nequipment \nand materials \n \n  \n1.1 All relevant key poses/ \ndrawings requirements are \nidentified based on the \nsource material provided. \n1.2 Soundtrack is identified \nand listened to based on \nthe client’s audio track \n1.3 Key drawing soundtrack \nbreakdown requirements \nare identified based from \nthe storyboard and \nexposure sheet. \n1.4 All necessary materials \nand equipment to be used \nare identified and prepared \naccording to the task to be \nundertaken. \n1.5 Non-functioning and \nmissing materials and \nequipment are reported to \nappropriate personnel \nbased on company policy \nand procedures \n \n1.1 Verbal \nCommunication \n1.2 Written \nCommunication \n1.3 Art and film \nappreciation \n1.4 Physical Science \n1.5 Physiology \n1.6 Mechanics and \nKinematics \n1.7 Computer hardware \nrequirements for \nlinetest \n1.8 production \ninformation \n1.9 Linetest software \n1.10 Practicing 3Rs – \nReduce, Re-use, \nRecycle/Recover \nand environmental \nconcerns  \n1.1 Effective \nCommunication \nskills \n1.2 Presentation \nskills \n1.3 Computer \noperation skills \n1.4 Analytical and \ncomprehension \nskills \n1.5 Skills in reading \nand analyzing \nstoryboard, \nexposure sheet \nand layout and \nsoundtrack \nbreakdown. \n1.6 Practicing \nOSHS, EHSM, \n3Rs \n \n2. Produce \ntraditional \nkey poses/ \ndrawings \n \n2.1 Key poses/drawings are \nproduced based on the \nstoryboard, layout and the \nexposure sheets. \n2.2 Key poses/drawings of \ndialogue scenes are \nproduced in sync with the \nsoundtrack breakdown \nbased on the design \n2.3 Key poses/drawings \nproduced are compiled \nbased on the style of the \nmodel pack.  \n2.4 The basic principles of \nanimation are applied \nbased on the scene action \n2.5 Key poses/drawings and \nanimation breakdowns \nproduced are measured \n2.1 Verbal \nCommunication \n2.2 Written \nCommunication \n2.3 Physical Science \n2.4 Mechanics and \nKinematics \n2.5 Human and animal \nanatomy \n2.6 Behavioral science \n2.7 Physics \n2.8 Animation principles\n2.9 Computer hardware \nrequirements for \nlinetest \n2.10 drawing poses and \nrough expressions \n2.11 Body attitude and \nfacial expressions \n2.1 Effective \nCommunication \nskills \n2.2 Presentation \nskills \n2.3 Practicing \nOSHS, EHSM, \n3Rs and 5S \n2.4 Interpersonal \nskills Clean-up \nand In-between \nDrawing Skills \n2.5 Visualization \nand \ninterpretation \nskills \n2.6 Animation skills \nand acting \nskills\n\n--- PDF PAGE 43 ---\n__________________________________________________________________________________          39 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nbased on the action, \ndrama and staging.  \n2.6 Timing principle is applied \nbased on the scene \nrequirements and \nanimation style. \n2.7 Key poses/drawings are \nline tested based on \ntiming, acting and \nmovement in the \nstoryboard or layout and \nexposure sheet \n2.8 Finished scene is \nsubmitted to relevant \npersonnel for checking in \naccordance with company \npolicies and procedures \n \n2.12 Rough breakdowns \n2.13 Drawing and \nbreakdown labels \n2.14 Understand \ndirector’s \ninstructions  \n2.15 production \ninformation \n2.16 Linetest software \n2.17 Principles and \ntechniques of \nanimation \nproduction \n2.18 Practicing 3Rs – \nReduce, Re-use, \nRecycle/Recover \nand environmental \nconcerns \n2.19 Geometry for Basic \nShapes \n2.20 Basic math \n2.21 Physics \n Spatial \nrelationship \n2.7 Drawing skills \nfor both living & \nnon-living   \n2.8 Analytical and \ncomprehension \nskills \n2.9 Skills in \nreading and \nanalyzing \ntiming grids \nand exposure \nsheet \n2.10 Skills in \nanalyzing \nanimation \nbreakdowns \n2.11 Skills in \nanalyzing \nanimatic \n2.12 Skills in \nanalyzing \nlayout  \n2.13 Acting skills \n2.14 Understanding \n& applying \ndirector’s \ninstructions \n3. Edit/revise \nkey poses/ \ndrawings \n3.1 Off model key poses/ \ndrawings are returned for \nrevision based on the \nmodel sheet provided. \n3.2 Key poses/drawings that \nrequire additional \nbreakdowns and additional \ntiming are supplied by the \nanimator following \ninstructions of the relevant \npersonnel in accordance to \nscene requirements. \n3.3 Off-sync dialogue \nsegments are adjusted with \ncorrect mouth openings \nbased on audio track and \ntrack reading on exposure \nsheets. \n3.4 Completed revised scene \nis resubmitted  to relevant \npersonnel. \n3.1 Verbal \nCommunication \n3.2 Written \nCommunication \n3.3 Physical Science \n3.4 Mechanics and \nKinematics \n3.5 Human and animal \nanatomy \n3.6 Behavioral science \n3.7 Physics \n3.8 Spatial relationship \n3.9 Computer hardware \nrequirements for \nlinetest \n3.10 Linetest software \n3.11 Rough drawing \nposes and rough \nexpressions \n3.12 Body attitude and \nfacial expressions \n3.13 Rough breakdowns \n3.14 drawing & \nbreakdown labels \n3.1 Effective \nCommunication \nskills \n3.2 Presentation \nskills \n3.3 Clean-up and \nIn-between \nDrawing Skills \n3.4 Drawing skills \nfor both living & \nnon-living   \n3.5 Animation skills \nand acting skills \n3.6 Analytical and \ncomprehension \nskills \n3.7 Skills in reading \nand analyzing \ntiming grids and \nexposure sheet \n3.8 Skills in \nanalyzing \nanimation \nbreakdowns\n\n--- PDF PAGE 44 ---\n__________________________________________________________________________________          40 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.15 Directors \ninstructions \n3.16 production \ninforma