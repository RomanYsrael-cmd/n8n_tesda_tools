or’s \ninstructions \n4.10. Effective \nCommunicatio\nn skills \n4.11. Presentation \nskills \n4.12. Computer and \nsoftware skills \n4.13. Practicing \nOSHS, EHSM, \n3Rs and 5S\n\n--- PDF PAGE 57 ---\n__________________________________________________________________________________ 53 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Digital Model pack \nlibrary \nMay include: \n1.1. Character turnarounds \n1.2. Objects /props \n1.3. Size comparison \n1.4. Attitudes and expressions \n1.5. Mouth chart \n1.6. Background reference \n1.7.\nEffects\n2. Materials \nMay include: \n2.1. Character parts: eyes, hands, heads, etc \n2.2. Symbols / nodes \n2.3. Storyboard (softcopy) \n2.4. Animatics \n2.5. Effects \n3. Digital storyboard \nMay include: \n3.1. Title, episode, sequence / act \n3.2. Scene elements (background, poses, character, \ncamera movements) \n3.3. Dialogue / audio indication \n3.4. Action notes (time set up, location, action needed)\n4. Animatics \nMay include video of: \n4.1. Character movement \n4.2. Camera movement \n4.3. Sequence cut \n4.4. Dialogue cut \n4.5. Time elapse / frame count / FPS \n4.6. Scene/ panel number\n5. Production Technical \nspecifications \nMay include: \n5.1. Timing \n5.2. Animation style/ movement \n5.3. effects \n5.4. 3D elements\n6. Relevant personnel \nMay include: \n6.1. Animation Director \n6.2. Production Manager \n6.3. Production Coordinator\n7. Software \nMay include: \n7.1. Adobe Flash/ animate \n7.2. Toon Boom Harmony \n7.3. Retas Pro \n7.4. TV paint \n7.5. After effects \n7.6. Adobe photoshop\n\n--- PDF PAGE 58 ---\n__________________________________________________________________________________ 54 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nVARIABLE \nRANGE \n8. Delivery platforms \nMay include: \n8.1. .Fla \n8.2. .Swf \n8.3. .Avi \n8.4. .Mp4 \n8.5. .Mov \n8.6. Targa \n8.7. .Png \n8.8. Image sequence \n8.9. .gif\n9. Character turnaround \nMay include: \n9.1. Front view \n9.2. side view \n9.3. back view \n9.4. quarter view\n10. Special effects \nMay include the following: \n10.1. Explosion \n10.2. Water effects \n10.3. Smoke effects \n10.4. Dust \n10.5. Fire \n10.6. etc.\n11. Objects \nMay Include: \n11.1. Props \n11.2. Overlays \n11.3. Underlays \n11.4. Characters \n11.5. Background\n12. Items \nMay include: \n12.1. model pack \n12.2. characters \n12.3. parts: hands, eyes, heads, legs etc. \n12.4. Props / objects\n13. Digital backgrounds \nMay include \n13.1. Interior \n13.2.\nExterior \n14. Principles of \nAnimation \nMay include: \n14.1. Appeal \n14.2. Solid drawing/ Dynamic pose (silhouettes, volume) \n14.3. Staging/ composition \n14.4. Exaggeration \n14.5. Anticipation \n14.6. Follow through/ overlapping/wave/figure 8 principle \n14.7. Pose to pose / straight ahead \n14.8. Timing with texture/ Spacing/ \n◦ Balance \n◦\nweight\n\n--- PDF PAGE 59 ---\n__________________________________________________________________________________ 55 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nVARIABLE \nRANGE \n◦ body attitude \n◦ line of action \n14.9. Stretch & squash \n14.10. Arcs \n14.11. Secondary action \n14.12. Slow in / slow out\n15. Lipsync \nMay include: \n15.1. Phonetics / Visemes \n15.2. Mouth chart A,B,C,D,E, F,G,H \n15.3. Special mouths O,TH, PH etc \n15.4. 1(closed mouth) 2 (half-open mouth) 3 (open mouth)\n\n--- PDF PAGE 60 ---\n__________________________________________________________________________________ 56 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified and gathered requirements and materials for \n2D digital cut-out animation. \n1.2 Built digital library of characters and objects \n1.3 Produced 2D digital cut-out animation. \n1.4 Revised/Edit 2D digital cut-out animation. \n2. Method of Assessment \nThe assessor must assess the candidate through the ff: \n2.1 Demonstration with oral questioning \n2.2 interview \n3. Resource Implication \nThe following resources should be provided: \n3.1 Appropriate materials \n3.2 Applicable software and equipment \n4. Context of Assessment \n4.1. Competency maybe assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter.\n\n--- PDF PAGE 61 ---\n__________________________________________________________________________________ 57 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUNIT TITLE \n \n : \nEXPORT ANIMATION TO VIDEO FILE FORMAT \nUNIT CODE \n \n :"
