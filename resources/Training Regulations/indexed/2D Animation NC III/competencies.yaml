s are \nincorporated to the \nanimation in accordance \nwith director’s instruction \n4.3. Revised scene is \nresubmitted to relevant \npersonnel based on \ncompany policies and \nprocedures \n4.1. Verbal \nCommunication \n4.2. Written \nCommunication \n4.3. Intellectual Property \nrights and concerns \n4.4. OHS processes and \nprocedure for \nComputer Hardware \n4.5. Human and animal \nanatomy \n4.6. Behavioural science \n4.7. Animation principles \n4.8. Perspective \n4.9. Spatial perception \n4.10. Phonetics \n4.11. Physics \n4.1. Clean-up and \nIn-between \nDrawing Skills \n4.2. Drawing skills \nfor both living & \nnon-living \n4.3. Animation skills \n4.4. Analytical and \ncomprehension \nskills \n4.5. Skills in \nanalyzing \nanimatic \n4.6. Skills in \nanalyzing \nlayout \n4.7. Acting skills \n4.8. Voice acting \nskill\n\n--- PDF PAGE 56 ---\n__________________________________________________________________________________ 52 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.12. Computer hardware \nrequirements for \nanimation \n4.13. Digital animation \nequipment & \nmaterials \n4.14. Model sheets \n4.15. 2D animation \nsoftware \n4.16. Cross platform/ \ndelivery platform \n4.17. Basic Math \n4.18. Geometry \n \n4.9. Understanding \n& applying \ndirector’s \ninstructions \n4.10. Effective \nCommunicatio\nn skills \n4.11. Presentation \nskills \n4.12. Computer and \nsoftware skills \n4.13. Practicing \nOSHS, EHSM, \n3Rs and 5S\n\n--- PDF PAGE 57 ---\n__________________________________________________________________________________ 53 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Digital Model pack \nlibrary \nMay include: \n1.1. Character turnarounds \n1.2. Objects /props \n1.3. Size comparison \n1.4. Attitudes and expressions \n1.5. Mouth ch