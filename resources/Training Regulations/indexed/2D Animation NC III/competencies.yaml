        "source_text": "--- PDF PAGE 61 ---\n__________________________________________________________________________________          57 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nUNIT TITLE \n \n  : \nEXPORT ANIMATION TO VIDEO FILE FORMAT \nUNIT CODE \n \n  : \nICT 216307 \nUNIT DESCRIPTOR     : \nThis unit covers the knowledge, skills and attitude required to \nexport finished animation to a video file format in accordance \nto industry standards. \n \nELEMENT \n \nPERFORMANCE CRITERIA\nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Check all \nanimation \nitems in the \nscene to be \nexported \n1.1. All elements including \naudio track are checked \nand placed in correct \nlayers based on client’s \nspecifications \n1.2. All relevant layers \nneeded are visible in \nthe scene based on \nclient’s specifications \n1.3. All elements are viewed \nin accordance to \ndirector’s/ client’s \nviewing requirements. \n \n1.1. Verbal Communication \n1.2. Written Communication \n1.3. Computer hardware, \nsoftware knowledge \n1.4. production information \n1.5. Practicing 3Rs – \nReduce, Re-use, \nRecycle/Recover and \nenvironmental concerns \n1.6. Basic Math  \n1.1 Analytical and \ncomprehension \nskills \n1.2 Skills in reading \nand analyzing \nstoryboard, \nexposure sheet \nand layout and \nsoundtrack \nbreakdown. \n1.3 Effective \nCommunication \nskills \n1.4 Presentation \nskills \n1.5 Computer \noperation skills \n1.6 Practicing OSHS, \nEHSM, 3Rs \n2. Identify and \nselect delivery \nplatform to \nexport \n2.1. Specific delivery \nplatform is identified \naccording to client’s \nspecifications \n2.2. File output is selected \nas specified in the \nrequirements. \n \n2.1. Verbal Communication \n2.2. Written Communication \n2.3. Computer hardware, \nsoftware knowledge \n2.4. Production information \n2.5. Familiar with different \ntypes of media \n2.6. Practicing 3Rs – \nReduce, Re-use, \nRecycle/Recover and \nenvironmental concerns \n2.7. Basic Math \n2.1. Analytical and \ncomprehension \nskills \n2.2. Effective \nCommunication \nskills \n2.3. Presentation \nskills \n2.4. Computer \noperation skills \n2.5. Practicing OSHS, \nEHSM, 3Rs \n3. Export and \nsave digital \nanimation \n3.1. Exported animation file \nis saved in a \ndesignated folder  \n3.2. Back-ups and extra \ncopies of important \nimages and video files \nare created on the \nspecific file allocation in \naccordance to assigned \nproject. \n3.3. File is submitted and \ninformed to relevant \npersonnel. \n3.1. Verbal Communication \n3.2. Written Communication \n3.3. Computer hardware, \nsoftware knowledge \n3.4. Production information \n3.5. Familiar with different \ntypes of media \n3.6. Practicing 3Rs – \nReduce, Re-use, \nRecycle/Recover and \nenvironmental concerns \n3.7. Basic Math \n3.1. Analytical and \ncomprehension \nskills \n3.2. Effective \nCommunication \nskills \n3.3. Presentation \nskills \n3.4. Computer \noperation skills \n3.5. Practicing OSHS, \nEHSM, 3Rs\n\n--- PDF PAGE 62 ---\n__________________________________________________________________________________          58 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. File output \nMay include: \n1.1. \nVideo output format \n1.2. \nRaw files/scene folder \n \n \n \n \n \nEVIDENCE GUIDE  \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate:  \n1.1 Checked all animation items in the scene to be \nexported. \n1.2 Identified and selected delivery platform to export. \n1.3 Exported and saved digital animation/file output. \n2. Method of Assessment \nThe assessor must assess the candidate through the \nfollowing: \n2.1 Demonstration with oral questioning \n2.2 Interview \n3. Resource Implication \nThe following resources should be provided: \n3.1 Appropriate materials  \n3.2 Applicable software and equipment \n4. Context of Assessment \n4.1. Competency maybe assessed in actual workplace \nor at the designated TESDA Accredited \nAssessment Center.\n",
