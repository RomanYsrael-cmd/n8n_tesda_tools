        "evidence_guide": {
          "source_text": "1. Critical \naspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Studied and selected appropriate technology consistent with \nwork requirements \n1.2 Applied relevant technology \n1.3 Maintained and enhanced operative ability of relevant \ntechnology \n2. Resource \nImplications \nThe following resources MUST be provided: \n2.1 Relevant technology \n2.2 Interview and demonstration questionnaires \n2.3 Assessment packages \n3. Methods of \nAssessment \nCompetency must be assessed through: \n3.1 Interview \n3.2 Actual demonstration \n3.3 Authenticated portfolio (related certificates of training/seminar) \n4. Context for \nAssessment \n4.1 Competency may be assessed in actual workplace or \nsimulated environment\n\n--- PDF PAGE 24 ---\n__________________________________________________________________________________ 20 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUNIT OF COMPETENCY: APPLY CRITICAL THINKING AND PROBLEM SOLVING \nTECHNIQUES IN THE WORKPLACE \n \nUNIT CODE :"
        },
        "source_text": "500311114 \nUNIT DESCRIPTOR \n: \nThis unit of competency covers the knowledge, skills, \nand attitude required in selecting, sourcing and applying \nappropriate \nand \naffordable \ntechnologies \nin \nthe \nworkplace. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Study/ select \nappropriate \ntechnology \n1.1 Usage of different \ntechnologies is \ndetermined based on job \nrequirements \n1.2 Appropriate technology is \nselected as per work \n specification \n1.1 Awareness on technology \nand its function \n1.2 techniques \n1.3 Health and safety \nprocedure \n1.4 Company policy in relation \nto relevant technology \n1.5 Machineries/ equipment \nand their application \n1.6 Software programs\n1.1 Identifying \nrelevant \ntechnology on \njob \n2. Apply \nrelevant \ntechnology \n \n2.1 Relevant technology is \neffectively used in \ncarrying out function \n2.2 Applicable software and \nhardware are used as per \ntask requirement \n2.3 Management concepts \nare observed and \npracticed as per \nestablished industry \npractices \n2.1 Knowledge on operating \ninstructions \n2.2 Understanding software \nand hardware system \n2.3 Communication \ntechniques \n2.4 Health and safety \nprocedure \n2.5 Company policy in relation \nto relevant technology \n2.6 Different management \nconcepts \n2.7 Technology adaptability \n2.1 Applying \nrelevant \ntechnology \n2.2 Communicating \nskills \n2.3 Using software \napplications \nskills \n2.4 Conducting risk \nassessment \n \n3. Maintain/ \nenhance \nrelevant \ntechnology \n3.1 Maintenance of \ntechnology is applied in \naccordance with the \nindustry standard \noperating procedure, \nmanufacturer’s \noperating guidelines \nand occupational health \nand safety procedure to \nensure its operative ability \n3.2 Updating of technology is \nmaintained through \ncontinuing education or \ntraining in accordance \nwith job requirement \n3.3 Technology failure/ defect \nis immediately reported to \nthe concern/responsible \nperson or section for \nappropriate action \n3.1 Awareness on technology \nand its function \n3.2 Repair and maintenance \nprocedure \n3.3 Health and safety \nprocedure \n3.4 Company policy in relation \nto relevant technology \n3.5 Upgrading of technology \n3.6 Organizational set-up/work \nflow \n \n3.1 Performing \nbasic \ntroubleshooting \nskills \n3.2 Identifying \nfailures or \ndefects \n3.3 Communication \nskills \n3.4 Applying \ncorrective and \npreventive \nmaintenance\n\n--- PDF PAGE 22 ---\n__________________________________________________________________________________ 18 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Technology \nMay include but are not limited to: \n1.1 Office technology \n1.2 Industrial technology \n1.3 System technology \n1.4 Information technology \n1.5 Training technology \n2. Management \nconcepts \nMay include but not limited to: \n2.1 Real Time Management \n2.2 KAIZEN or continuous improvement \n2.3 5s principles \n2.4 Total Quality Management \n2.5 Other management/productivity tools \n3. Industry standard \noperating \nprocedure \n3.1 Written guidelines relative to the usage of office \ntechnology/equipment \n3.2 Verbal advice/instruction from the co-worker \n4. Manufacturer’s \noperating \nguidelines/ \ninstructions \n4.1 Written instruction/manuals of specific technology/ \nequipment \n4.2 General instruction manual \n4.3 Verbal advise from manufacturer relative to the operation \nof equipment \n \n5. Occupational \nhealth and safety \nprocedure\n5.1 Relevant statutes on OHS \n5.2 Company guidelines in using technology/equipment \n6. Appropriate action \n6.1 Implementing preventive maintenance schedule \n6.2 Coordinating with manufacturer’s technician\n\n--- PDF PAGE 23 ---\n__________________________________________________________________________________ 19 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nEVIDENCE GUIDE \n \n1. Critical \naspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Studied and selected appropriate technology consistent with \nwork requirements \n1.2 Applied relevant technology \n1.3 Maintained and enhanced operative ability of relevant \ntechnology \n2. Resource \nImplications \nThe following resources MUST be provided: \n2.1 Relevant technology \n2.2 Interview and demonstration questionnaires \n2.3 Assessment packages \n3. Methods of \nAssessment \nCompetency must be assessed through: \n3.1 Interview \n3.2 Actual demonstration \n3.3 Authenticated portfolio (related certificates of training/seminar) \n4. Context for \nAssessment \n4.1 Competency may be assessed in actual workplace or \nsimulated environment\n\n--- PDF PAGE 24 ---\n__________________________________________________________________________________ 20 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUNIT OF COMPETENCY: APPLY CRITICAL THINKING AND PROBLEM SOLVING \nTECHNIQUES IN THE WORKPLACE \n \nUNIT CODE :"
