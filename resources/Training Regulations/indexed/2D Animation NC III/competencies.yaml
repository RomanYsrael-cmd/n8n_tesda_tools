ed and \ndocumented in relation to \nteam objectives. \n2.2. Fellow workers are \nencouraged to utilize and \nshare their specific \nqualities, skills or \nbackgrounds with other \nteam members and clients \nto enhance work \noutcomes. \n2.3. Relations with customers \nand clients are maintained \nto show that diversity is \nvalued by the business. \n2.1. Recognizing and \nexplaining the value \nof diversity in the \neconomy and \nsociety in terms of \nWorkforce \ndevelopment \n2.2. The country’s place \nin the global \neconomy \n2.3. Innovation \n2.4. Social justice \n2.5. Recognizing the \nimportance of \ninclusiveness in a \ndiverse environment \n \n2.1. Cross-cultural \ncommunication skills \n2.2. Communication skills \n– reading, writing, \nconversational skills \n2.3. Affective skills – \nestablishing rapport \nand empathy, \nunderstanding, etc. \n2.4. Active Listening \n2.5. Openness and \nflexibility in \ncommunication \n2.6. Giving/receiving \nfeedback\n\n--- PDF PAGE 32 ---\n__________________________________________________________________________________ 28 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2.6. Developing a shared \nvision and \nunderstanding of \nand commitment to \nteam, departmental, \nand organizational \ngoals and objectives \n2.7. Strategies for \ncustomer service \nexcellence \n2.7. Identifying/ \nRecognizing diverse \ngroups in the \nworkplace and \ncommunity as \ndefined by divergent \nculture, religion, \ntraditions and \npractices \n2.8. Teamwork and \ncollaboration skills \n2.9. Intercultural relations \nand mutual \nacceptance \n2.10. Customer service \nexcellence \n3. Identify \ncommon \nissues in a \nmulticultural \nand diverse \nenvironment \n3.1. Diversity-related conflicts \nwithin the workplace are \neffectively addressed and \nresolved. \n3.2. Discriminatory behavior 