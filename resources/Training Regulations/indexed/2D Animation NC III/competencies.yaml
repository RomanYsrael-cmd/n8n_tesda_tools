NTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \nmathematical \ntools and \ntechniques to \nsolve problem \n1.1 Problem areas are \nidentified based on given \ncondition \n1.2 Mathematical \ntechniques are selected \nbased on the given \nproblem \n \n \n1.1. Fundamental \noperation (addition, \nsubtraction, division, \nmultiplication) \n1.2. Units of \nmeasurement and its \nconversion \n1.3. Fundamental of units \n1.4. Standard formulas \n1.5. Basic measuring \ntools/devices \n1.6. Measurement \nsystem \n1.7. Basic measuring \ntools/devices \n1.8. Steps in solving \nproblem \n1.1. Identifying and \nselecting different \nmeasuring tools \n1.2. Applying different \nformulas in solving \nproblems \n1.3. Describing the units \nof measurement \nand fundamental \nunits \n1.4. Stating arithmetic \ncalculations \ninvolving the \nfollowing; addition, \nsubtraction, division, \nmultiplication \n1.5. Applying theory into \nactual application on \nshipboard catering \nprocesses\n2. Apply \nmathematical \nprocedure/ \nsolution \n2.1 Mathematical techniques \nare applied based on the \nproblem identified \n2.2 Mathematical \ncomputations are \nperformed to the level of \naccuracy required for the \nproblem \n2.3 Result of mathematical \ncomputation is \ndetermined and verified \nbased on job \nrequirements\n2.1. Problem-based \nquestions \n2.2. Estimation \n2.3. Use of mathematical \ntools and standard \nformulas \n2.4. Mathematical \ntechniques \n \n2.1. Solving \nmathematical \ncomputations \n2.2. Converting Metric to \nEnglish \n2.3. Selecting and using \nappropriate and \nefficient techniques \nand strategies to \nsolve problems \n3. Analyze results \n3.1 Result of application is \nreviewed based on \nexpected and required \nspecifications and \noutcome \n3.2 Appropriate action is \napplied in case of error \n \n3.1. Techniques in \nanalyzing the results \n3.2. Process in reviewing \nthe results \n3.3. Precision and \naccuracy \n3.4. Four fundamental \noperations \n3.5. Steps in solving \nproblem \n3.6. Standard formulas \n3.7. Conversion \nmeasurement\n3.1. Analyzing the result \nbased on the \nspecified \nrequirements \n3.2. Interpreting and \ncommunicating the \nresults of the \nanalysis\n\n--- PDF PAGE 20 ---\n__________________________________________________________________________________ 16 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLES \nRANGE \n1. Mathematical techniques \nMay include: \n1.1 Four fundamental operations \n1.2 Measurements \n1.3 Use/Conversion of units of measurements \n1.4 Use of standard formulas \n2. Appropriate action \n2.1 Review in the use of mathematical techniques (e.g. \nrecalculation, re-modeling) \n2.2 Report error to immediate superior for proper \naction \n \n \n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified, applied and reviewed the use of \nmathematical concepts and techniques to \nworkplace problems \n2. Resource Implications \nThe following resources should be provided: \n2.1 Calculator \n2.2 Basic measuring tools \n2.3 Case Problems \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Authenticated portfolio \n3.2 Written Test \n3.3 Interview/Oral Questioning \n3.4 Demonstration \n4. Context for Assessment \n4.1 Competency may be assessed in the work place or \nin a simulated work place setting\n\n--- PDF PAGE 21 ---\n__________________________________________________________________________________ 17 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUNIT OF COMPETENCY : \nUSE RELEVANT TECHNOLOGIES \n \n \n(Apply technology effectively) \nUNIT CODE \n: \n500311114 \nUNIT DESCRIPTOR \n: \nThis unit of competency covers the knowledge, skills, \nand attitude required in selecting, sourcing and applying \nappropriate \na