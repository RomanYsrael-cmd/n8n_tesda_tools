        "source_text": "--- PDF PAGE 31 ---\n__________________________________________________________________________________          27 \nTR – 2D ANIMATION NC III      (Version 02)                                         Amended   February 27, 2018 \nUNIT OF COMPETENCY:  WORK IN A DIVERSE ENVIRONMENT \n \nUNIT CODE                     :   500311145 \n \nUNIT DESCRIPTOR        :  This unit of covers the knowledge, skills and attitudes \nrequired to work effectively in a workplace characterized by \ndiversity in terms of religions, beliefs, races, ethnicities and \nother differences.                          \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Develop an \nindividual’s \ncultural \nawareness \nand sensitivity \n1.1. Individual differences with \nclients, customers and \nfellow workers are \nrecognized and respected \nin accordance with \nenterprise policies and \ncore values. \n1.2. Differences are responded \nto in a sensitive and \nconsiderate manner  \n1.3. Diversity is \naccommodated using \nappropriate verbal and \nnonverbal communication.  \n1.4. Actions/decisions are \nmaintained consistent with \nlegislative requirements \nand enterprise guidelines. \n1.1. Understanding \ncultural diversity in \nthe workplace  \n1.2. Awareness of \nindividual cultures \nand world geography \n1.3. Norms of behavior \nfor interacting and \ndialogue with \nspecific groups (e.g., \nMuslims and other \nnon-Christians, non-\nCatholics, \ntribes/ethnic groups, \nforeigners)  \n1.4. Different methods of \nverbal and non-\nverbal \ncommunication in a \nmulticultural setting  \n1.5. Enterprise policies \non workplace \ndiversity (Workplace \nDiversity Policy) \n1.1. Cross-cultural \ncommunication skills \n(i.e. different business \ncustoms, beliefs, \ncommunication \nstrategies)  \n1.2. Communication skills \n– reading, writing, \nconversational skills  \n1.3. Affective skills – \nestablishing rapport \nand empathy, \nunderstanding, etc.  \n1.4. Active Listening \n1.5. Openness and \nflexibility in \ncommunication  \n1.6. Giving/receiving \nfeedback \n1.7. Identifying/ \nRecognizing diverse \ngroups in the \nworkplace and \ncommunity as defined \nby divergent culture, \nreligion, traditions and \npractices \n2. Work \neffectively in \nan \nenvironment \nthat \nacknowledges \nand values \ncultural \ndiversity \n2.1. Knowledge, skills and \nexperiences of others are \nrecognized and \ndocumented in relation to \nteam objectives.   \n2.2. Fellow workers are \nencouraged to utilize and \nshare their specific \nqualities, skills or \nbackgrounds with other \nteam members and clients \nto enhance work \noutcomes.  \n2.3. Relations with customers \nand clients are maintained \nto show that diversity is \nvalued by the business. \n2.1. Recognizing and \nexplaining the value \nof diversity in the \neconomy and \nsociety in terms of  \nWorkforce \ndevelopment \n2.2. The country’s place \nin the global \neconomy \n2.3. Innovation  \n2.4. Social justice  \n2.5. Recognizing the  \nimportance of \ninclusiveness in a \ndiverse environment \n  \n2.1. Cross-cultural \ncommunication skills  \n2.2. Communication skills \n– reading, writing, \nconversational skills  \n2.3. Affective skills – \nestablishing rapport \nand empathy, \nunderstanding, etc.  \n2.4. Active Listening \n2.5. Openness and \nflexibility in \ncommunication \n2.6. Giving/receiving \nfeedback\n\n--- PDF PAGE 32 ---\n__________________________________________________________________________________          28 \nTR – 2D ANIMATION NC III      (Version 02)                                         Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2.6. Developing a shared \nvision and \nunderstanding of \nand commitment to \nteam, departmental, \nand organizational \ngoals and objectives \n2.7. Strategies for \ncustomer service \nexcellence  \n2.7. Identifying/ \nRecognizing diverse \ngroups in the \nworkplace and \ncommunity as \ndefined by divergent \nculture, religion, \ntraditions and \npractices   \n2.8. Teamwork and \ncollaboration skills \n2.9. Intercultural relations \nand mutual \nacceptance  \n2.10. Customer service \nexcellence  \n3. Identify \ncommon \nissues in a \nmulticultural \nand diverse \nenvironment \n3.1. Diversity-related conflicts \nwithin the workplace are \neffectively addressed and \nresolved.  \n3.2. Discriminatory behavior \ntowards customers/ \nstakeholders are \nminimized and addressed \naccordingly.  \n3.3. Change management \npolicies are in place within \nthe organization. \n3.1. Understanding, \nvaluing, and \nleveraging cultural \ndiversity  \n3.2. Promoting inclusivity \nand conflict \nresolution  \n3.3. Addressing \nworkplace \nharassment  \n3.4. Managing change \nand overcoming \nresistance to change \n3.5. Advanced strategies \nfor customer service \nexcellence  \n3.6. Enterprise policies \non workplace \ndiversity (Workplace \nDiversity Policy) \n3.1. Cross-cultural \ncommunication skills  \n3.2. Communication skills \n– reading, writing, \nconversational skills  \n3.3. Affective skills – \nestablishing rapport \nand empathy, \nunderstanding, etc. \n3.4. Active Listening \n3.5. Openness and \nflexibility in \ncommunication  \n3.6. Giving/receiving \nfeedback  \n3.7. Teamwork and \ncollaboration skills  \n3.8. Intercultural relations \nand mutual \nacceptance  \n3.9. Advanced customer \nservice excellence \nskills  \n3.10. Conflict \nmanagement and \nresolution skills  \n3.11. Assertiveness and \nNegotiation\n\n--- PDF PAGE 33 ---\n__________________________________________________________________________________          29 \nTR – 2D ANIMATION NC III      (Version 02)                                         Amended   February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Diversity \nThis refers to diversity in both the workplace and the \ncommunity and may include divergence in –  \n1.1 \nReligion  \n1.2 \nEthnicity, race or nationality \n1.3 \nCulture  \n1.4 \nGender, age or personality  \n1.5 \nEducational background \n \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Adjusted language and behavior as required by \ninteractions with diversity \n1.2. Identified and respected individual differences in \ncolleagues, clients and customers \n1.3. Applied relevant regulations, standards and \ncodes of practice \n2. Resource implication \n \nThe following resources should be provided:  \n2.1. Access to workplace and resources  \n2.2. Manuals and policies on Workplace Diversity  \n3. Method of assessment \nCompetency in this unit may be assessed through:  \n3.1. Demonstration or simulation with oral questioning \n3.2. Group discussions and interactive activities  \n3.3. Case studies/problems involving workplace \ndiversity issues \n3.4. Third-party report  \n3.5. Written examination  \n3.6. Role Plays \n4. Context of Assessment \n \n4.1. Competency assessment may occur in workplace or \nany appropriately simulated environment\n",
