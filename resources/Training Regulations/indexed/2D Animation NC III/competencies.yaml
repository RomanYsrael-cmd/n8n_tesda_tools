        "source_text": "ICT315202 \n \nUNIT DESCRIPTOR : \nThis unit covers the knowledge, skills, attitudes and \nvalues needed to apply quality standards in the \nworkplace. The unit also includes the application of \nrelevant safety procedures and regulations, organization \nprocedures and customer requirements. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Assess quality \nof received \nmaterials \n1.1. Work instruction is obtained \nand work is carried out in \naccordance with standard \noperating procedures. \n1.2. Received materials are \nchecked against workplace \nstandards and specifications. \n1.3. Faulty materials related to \nwork are identified and \nisolated. \n1.4. Faults and any identified \ncauses are recorded and/or \nreported to the supervisor \nconcerned in accordance with \nworkplace procedures. \n1.5. Faulty materials are replaced \nin accordance with workplace \nprocedures. \n1.1. Relevant production \nprocesses, \nmaterials and \nproducts \n1.2. Characteristics of \nmaterials, software \nand hardware used \nin production \nprocesses \n1.3. Quality checking \nprocedures \n1.4. Quality Workplace \nprocedures \n1.5. Identification of \nfaulty materials \nrelated to work \n1.1. Reading skills \nrequired to \ninterpret work \ninstruction \n1.2. Critical \nthinking \n1.3. Interpreting \nwork \ninstructions \n2. Assess own \nwork \n2.1 Documentation relative to \nquality within the company is \nidentified and used. \n2.2 Completed work is checked \nagainst workplace standards \nrelevant to the task \nundertaken. \n2.3 Errors are identified and \nisolated. \n2.4 Information on the quality and \nother indicators of production \nperformance are recorded in \naccordance with workplace \nprocedures. \n2.5 In cases of deviations from \nspecific quality standards, \ncauses are documented and \nreported in accordance with \nthe workplace’ s standards \noperating procedures. \n2.1. Safety and \nenvironmental \naspects of \nproduction \nprocesses \n2.2. Fault identification \nand reporting \n2.3. Workplace \nprocedure in \ndocumenting \ncompleted work \n2.4. Workplace Quality \nIndicators \n2.1. Carry out \nwork in \naccordance \nwith OHS \npolicies and \nprocedures\n\n--- PDF PAGE 35 ---\n__________________________________________________________________________________ 31 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Engage in \nquality \nimprovement \n3.1 Process improvement \nprocedures are participated in \nrelative to workplace \nassignment. \n3.2 Work is carried out in \naccordance with process \nimprovement procedures. \n3.3 Performance of operation or \nquality of product of service to \nensure customer satisfaction \nis monitored. \n3.1. Quality \nimprovement \nprocesses \n3.2. Company \ncustomers defined \n3.1. Solution \nproviding and \ndecision-\nmaking \n3.2. Practice \ncompany \nprocess \nimprovement \nprocedure\n\n--- PDF PAGE 36 ---\n__________________________________________________________________________________ 32 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1 Materials \n1.1 Materials may include but not limited to: \n1.1.1. Manuals \n1.1.2. Job orders \n1.1.3. Instructional videos \n2 Faults \n2.1 Faults may include but not limited to: \n2.1.1. Materials not to specification \n2.1.2. Materials contain incorrect/outdated \ninformation \n2.1.3. Hardware defects \n2.1.4. Materials that do not conform with any \nregulatory agencies \n3 Documentation \n3.1 Organization work procedures \n3.2 Manufacturer’s instruction manual \n3.3 Customer requirements \n3.4 Forms \n4 Errors \n4.1 Errors may be related but not limited to the following: \n4.1.1. Deviation from the requirements of the Client \n4.1.2. Deviation from the requirement of the \norganization \n5 Quality standards \n \n5.1 Quality standards may be related but not limited to \nthe following: \n5.1.1. Materials \n5.1.2. Hardware \n5.1.3. Final product \n5.1.4. Production processes \n5.1.5. Customer service \n6 Customer \n6.1 Co-worker \n6.2 Supplier/Vendor \n6.3 Client \n6.4 Organization receiving the product or service\n\n--- PDF PAGE 37 ---\n__________________________________________________________________________________ 33 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nEVIDENCE GUIDE \n \n \n \n1 Critical aspect of \ncompetency \nAssessment requires evidence that candidate: \n1.1 Carried out work in accordance with the company’s \nstandard operating procedures \n1.2 Performed task according to specifications \n1.3 Reported defects detected in accordance with \nstandard operating procedures \n1.4 Carried out work in accordance with the process \nimprovement procedures\n2 Method of \nassessment \nThe assessor may select two (2) of the following \nassessment methods to objectively assess the candidate: \n2.1 Observation \n2.2 Questioning \n2.3 Practical demonstration \n3 Resource implication \n3.1 \nMaterials, software and hardware to be used in a real \nor simulated situation \n4 Context of \nAssessment \n4.1 Assessment may be conducted in the workplace or in \na simulated environment\n\n--- PDF PAGE 38 ---\n__________________________________________________________________________________ 34 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUNIT TITLE \n: \nPERFORM COMPUTER OPERATIONS \nUNIT CODE \n:"
