          "1. Identify traditional animation equipment and materials",
          "1.1 All relevant key poses/ drawings requirements are identified based on the source material provided. 1.2 Soundtrack is identified and listened to based on the client’s audio track 1.3 Key drawing soundtrack breakdown requirements are identified based from the storyboard and exposure sheet. 1.4 All necessary materials and equipment to be used are identified and prepared according to the task to be undertaken. 1.5 Non-functioning and missing materials and equipment are reported to appropriate personnel based on company policy and procedures",
