nvironment \n3.1. Diversity-related conflicts \nwithin the workplace are \neffectively addressed and \nresolved. \n3.2. Discriminatory behavior \ntowards customers/ \nstakeholders are \nminimized and addressed \naccordingly. \n3.3. Change management \npolicies are in place within \nthe organization. \n3.1. Understanding, \nvaluing, and \nleveraging cultural \ndiversity \n3.2. Promoting inclusivity \nand conflict \nresolution \n3.3. Addressing \nworkplace \nharassment \n3.4. Managing change \nand overcoming \nresistance to change \n3.5. Advanced strategies \nfor customer service \nexcellence \n3.6. Enterprise policies \non workplace \ndiversity (Workplace \nDiversity Policy) \n3.1. Cross-cultural \ncommunication skills \n3.2. Communication skills \n– reading, writing, \nconversational skills \n3.3. Affective skills – \nestablishing rapport \nand empathy, \nunderstanding, etc. \n3.4. Active Listening \n3.5. Openness and \nflexibility in \ncommunication \n3.6. Giving/receiving \nfeedback \n3.7. Teamwork and \ncollaboration skills \n3.8. Intercultural relations \nand mutual \nacceptance \n3.9. Advanced customer \nservice excellence \nskills \n3.10. Conflict \nmanagement and \nresolution skills \n3.11. Assertiveness and \nNegotiation\n\n--- PDF PAGE 33 ---\n__________________________________________________________________________________ 29 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Diversity \nThis refers to diversity in both the workplace and the \ncommunity and may include divergence in – \n1.1 \nReligion \n1.2 \nEthnicity, race or nationality \n1.3 \nCulture \n1.4 \nGender, age or personality \n1.5 \nEducational background \n \n \nEVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Adjusted language and behavior as required by \ninteractions with diversity \n1.2. Identified and respected individual differences in \ncolleagues, clients and customers \n1.3. Applied relevant regulations, standards and \ncodes of practice \n2. Resource implication \n \nThe following resources should be provided: \n2.1. Access to workplace and resources \n2.2. Manuals and policies on Workplace Diversity \n3. Method of assessment \nCompetency in this unit may be assessed through: \n3.1. Demonstration or simulation with oral questioning \n3.2. Group discussions and interactive activities \n3.3. Case studies/problems involving workplace \ndiversity issues \n3.4. Third-party report \n3.5. Written examination \n3.6. Role Plays \n4. Context of Assessment \n \n4.1. Competency assessment may occur in workplace or \nany appropriately simulated environment\n\n--- PDF PAGE 34 ---\n__________________________________________________________________________________ 30 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nCOMMON COMPETENCIES \n \n \nUNIT TITLE \n \n \n: \nAPPLY QUALITY STANDARDS \n \nUNIT CODE \n \n \n:"
