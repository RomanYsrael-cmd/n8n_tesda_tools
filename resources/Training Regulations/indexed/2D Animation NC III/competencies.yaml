        "source_title": "PRODUCE TRADITIONAL KEY POSES/DRAWINGS FOR ANIMATION",
        "source_text": "--- PDF PAGE 42 ---\n__________________________________________________________________________________          38 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nCORE COMPETENCIES \n \nUNIT TITLE \n: \nPRODUCE TRADITIONAL KEY POSES/DRAWINGS FOR \nANIMATION \nUNIT CODE   \n \n: \nICT 216305  \nUNIT DESRIPTOR  : \nThis unit covers the knowledge, skills and attitude required to \ninterpret the animation specifications to produce traditional \nkey poses/drawings for animation production. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify \ntraditional \nanimation \nequipment \nand materials \n \n  \n1.1 All relevant key poses/ \ndrawings requirements are \nidentified based on the \nsource material provided. \n1.2 Soundtrack is identified \nand listened to based on \nthe client’s audio track \n1.3 Key drawing soundtrack \nbreakdown requirements \nare identified based from \nthe storyboard and \nexposure sheet. \n1.4 All necessary materials \nand equipment to be used \nare identified and prepared \naccording to the task to be \nundertaken. \n1.5 Non-functioning and \nmissing materials and \nequipment are reported to \nappropriate personnel \nbased on company policy \nand procedures \n \n1.1 Verbal \nCommunication \n1.2 Written \nCommunication \n1.3 Art and film \nappreciation \n1.4 Physical Science \n1.5 Physiology \n1.6 Mechanics and \nKinematics \n1.7 Computer hardware \nrequirements for \nlinetest \n1.8 production \ninformation \n1.9 Linetest software \n1.10 Practicing 3Rs – \nReduce, Re-use, \nRecycle/Recover \nand environmental \nconcerns  \n1.1 Effective \nCommunication \nskills \n1.2 Presentation \nskills \n1.3 Computer \noperation skills \n1.4 Analytical and \ncomprehension \nskills \n1.5 Skills in reading \nand analyzing \nstoryboard, \nexposure sheet \nand layout and \nsoundtrack \nbreakdown. \n1.6 Practicing \nOSHS, EHSM, \n3Rs \n \n2. Produce \ntraditional \nkey poses/ \ndrawings \n \n2.1 Key poses/drawings are \nproduced based on the \nstoryboard, layout and the \nexposure sheets. \n2.2 Key poses/drawings of \ndialogue scenes are \nproduced in sync with the \nsoundtrack breakdown \nbased on the design \n2.3 Key poses/drawings \nproduced are compiled \nbased on the style of the \nmodel pack.  \n2.4 The basic principles of \nanimation are applied \nbased on the scene action \n2.5 Key poses/drawings and \nanimation breakdowns \nproduced are measured \n2.1 Verbal \nCommunication \n2.2 Written \nCommunication \n2.3 Physical Science \n2.4 Mechanics and \nKinematics \n2.5 Human and animal \nanatomy \n2.6 Behavioral science \n2.7 Physics \n2.8 Animation principles\n2.9 Computer hardware \nrequirements for \nlinetest \n2.10 drawing poses and \nrough expressions \n2.11 Body attitude and \nfacial expressions \n2.1 Effective \nCommunication \nskills \n2.2 Presentation \nskills \n2.3 Practicing \nOSHS, EHSM, \n3Rs and 5S \n2.4 Interpersonal \nskills Clean-up \nand In-between \nDrawing Skills \n2.5 Visualization \nand \ninterpretation \nskills \n2.6 Animation skills \nand acting \nskills\n\n--- PDF PAGE 43 ---\n__________________________________________________________________________________          39 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nbased on the action, \ndrama and staging.  \n2.6 Timing principle is applied \nbased on the scene \nrequirements and \nanimation style. \n2.7 Key poses/drawings are \nline tested based on \ntiming, acting and \nmovement in the \nstoryboard or layout and \nexposure sheet \n2.8 Finished scene is \nsubmitted to relevant \npersonnel for checking in \naccordance with company \npolicies and procedures \n \n2.12 Rough breakdowns \n2.13 Drawing and \nbreakdown labels \n2.14 Understand \ndirector’s \ninstructions  \n2.15 production \ninformation \n2.16 Linetest software \n2.17 Principles and \ntechniques of \nanimation \nproduction \n2.18 Practicing 3Rs – \nReduce, Re-use, \nRecycle/Recover \nand environmental \nconcerns \n2.19 Geometry for Basic \nShapes \n2.20 Basic math \n2.21 Physics \n Spatial \nrelationship \n2.7 Drawing skills \nfor both living & \nnon-living   \n2.8 Analytical and \ncomprehension \nskills \n2.9 Skills in \nreading and \nanalyzing \ntiming grids \nand exposure \nsheet \n2.10 Skills in \nanalyzing \nanimation \nbreakdowns \n2.11 Skills in \nanalyzing \nanimatic \n2.12 Skills in \nanalyzing \nlayout  \n2.13 Acting skills \n2.14 Understanding \n& applying \ndirector’s \ninstructions \n3. Edit/revise \nkey poses/ \ndrawings \n3.1 Off model key poses/ \ndrawings are returned for \nrevision based on the \nmodel sheet provided. \n3.2 Key poses/drawings that \nrequire additional \nbreakdowns and additional \ntiming are supplied by the \nanimator following \ninstructions of the relevant \npersonnel in accordance to \nscene requirements. \n3.3 Off-sync dialogue \nsegments are adjusted with \ncorrect mouth openings \nbased on audio track and \ntrack reading on exposure \nsheets. \n3.4 Completed revised scene \nis resubmitted  to relevant \npersonnel. \n3.1 Verbal \nCommunication \n3.2 Written \nCommunication \n3.3 Physical Science \n3.4 Mechanics and \nKinematics \n3.5 Human and animal \nanatomy \n3.6 Behavioral science \n3.7 Physics \n3.8 Spatial relationship \n3.9 Computer hardware \nrequirements for \nlinetest \n3.10 Linetest software \n3.11 Rough drawing \nposes and rough \nexpressions \n3.12 Body attitude and \nfacial expressions \n3.13 Rough breakdowns \n3.14 drawing & \nbreakdown labels \n3.1 Effective \nCommunication \nskills \n3.2 Presentation \nskills \n3.3 Clean-up and \nIn-between \nDrawing Skills \n3.4 Drawing skills \nfor both living & \nnon-living   \n3.5 Animation skills \nand acting skills \n3.6 Analytical and \ncomprehension \nskills \n3.7 Skills in reading \nand analyzing \ntiming grids and \nexposure sheet \n3.8 Skills in \nanalyzing \nanimation \nbreakdowns\n\n--- PDF PAGE 44 ---\n__________________________________________________________________________________          40 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.15 Directors \ninstructions \n3.16 production \ninformation \n3.17 animation \nprinciples \n3.18 Practicing 3Rs – \nReduce, Re-use, \nRecycle/Recover \nand environmental \nconcerns \n3.19 Geometry for basic \nshapes \n3.20 Basic Math \n \n3.9 Skills in \nanalyzing \nanimatic \n3.10 Skills in \nanalyzing \nlayout  \n3.11 Acting skills \n3.12 Understanding \n& applying \ndirector’s \ninstructions \n3.13 Practicing \nOSHS, EHSM, \n3Rs and 5S\n\n--- PDF PAGE 45 ---\n__________________________________________________________________________________          41 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Key poses/drawings \nMay include:  \n1.1 \nTraditional character / Object poses \n1.2 \nDigital character / Object poses \n1.3\nEffects Animation\n2. Source material \nMay include: \n2.1 \nStoryboard \n2.2 \nLayout Poses/drawings \n2.3 \nDirector’s Instruction \n2.4 \nExposure Sheet \n2.5 \nSoundtrack/ Audio File \n2.6 \nModel Sheets \n2.7 \nScene Folder \n2.8\nAnimatics\n3. Soundtrack \nBreakdown \nMay include: \n3.1 \nDialogue Track \n3.2 \nSound Effects \n3.3 \nBackground Music \n3.4\nExposure sheet slugging\n4. Storyboard \nMay include: \n4.1. TV series storyboard \n4.2. Film Storyboard \n4.3. Commercial storyboard \n4.4. AVP Presentations storyboard \n4.5.\nMotion graphics storyboard\n5. Exposure sheet \nMay include: \n5.1 \nDirector's instruction (slugging, thumbnails) \n5.2 \nCamera instruction \n5.3 \nBackground shot \n5.4 \nKey poses/drawings \n5.5 \nIn-between poses/drawings \n5.6 \nBreakdown poses/drawings \n5.7 \nProduction details \n5.8 \nTrack reading \n5.9\nMouth opening breakdowns\n6. Materials \n May include: \n6.1 \nAnimation Paper \n6.2 \nRuler \n6.3 \nBull Clip \n6.4 \nMagic Tape \n6.5 \nLight Colored Pencils \n6.6 \nLead Pencils \n6.7 \nRubber/ Kneaded Eraser \n6.8 \nPegbar \n6.9 \nReinforcement Peghole Stickers \n6.10 Bond Paper \n6.11 Copier Machine Paper \n6.12 Scene folder\n\n--- PDF PAGE 46 ---\n__________________________________________________________________________________          42 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nVARIABLE \nRANGE \n7. Equipment \nMay include: \n7.1 \nAnimation Table \n7.2 \nLightbox \n7.3 \nAnimation Disc \n7.4 \nManual/ Electric Sharpener \n7.5 \nDesk Lamp \n7.6 \nChair \n7.7 \nPhotocopy Machine \n7.8 \nPrinter \n7.9 \nLine Test Machine / Computer \n7.10 Linetest Software \n7.11 USB \n7.12 Removable Hard Drive \n7.13 Earphones \n7.14 Speakers \n7.15 Mirror \n7.16 Internet  \n7.17 Webcam for linetest \n7.18 Animation puncher \n8. Appropriate \npersonnel \nMay Include:  \n8.1 \nProduction manager \n8.2 \nAnimation director \n8.3 \nProduction coordinator / Assistants \n8.4 \nCheckers \n9.  Layout \nMay include: \n9.1 \nCharacter poses \n9.2 \nBackground setup \n9.3 \nField guides / camera instructions \n10. Model Pack \nMay include: \n10.1 Size comparison \n10.2 Character turnarounds \n10.3 Mouth chart \n10.4 Attitude & expressions poses \n10.5 Special effects guide \n10.6 Props \n10.7 Key backgrounds \n10.8 Character construction guide \n11. Principles of \nanimation \nMay include: \n11.1 Appeal \n11.2 Solid drawing/Dynamic pose (silhouettes, volume) \n11.3 Staging/ composition \n11.4 Exaggeration \n11.5 Anticipation \n11.6 Follow through/overlapping/wave/figure 8 principle \n11.7 Pose to pose / straight ahead\n\n--- PDF PAGE 47 ---\n__________________________________________________________________________________          43 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nVARIABLE \nRANGE \n11.8 Timing with texture/ Spacing/  \n◦ Balance \n◦ weight  \n◦ body attitude \n◦ line of action \n11.9 Stretch & squash \n11.10 Arcs \n11.11 Secondary action \n11.12 Slow in / slow out\n12. Animation \nbreakdown \nMay include: \n12.1 Arcs \n12.2 Favored drawing \n12.3 Secondary action \n12.4 Mouth shape  \n12.5 Eye movement/ position \n12.6 Path of action \n13. Line tested \nMay include: \n13.1 Pencil test machine \n13.2 CTP pro \n13.3 Flipbook \n13.4 Photoshop CS3 & above \n13.5 Retas Pro \n13.6 TV Paint \n14. Off model \nMay include: \n14.1 Off proportion \n14.2 Missing details \n14.3 Wrong costume \n14.4 Wrong character \n14.5 Wrong size comparison \n14.6 Size inconsistencies \n15. Mouth openings \nMay include: \n15.1 Phonetics / Visemes  \n15.2 Mouth chart A,B,C,D,E, F,G,H \n15.3 Special mouths O,TH, PH etc \n15.4 1(closed mouth); 2 (half-open mouth); 3 (open mouth)\n\n--- PDF PAGE 48 ---\n__________________________________________________________________________________          44 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nEVIDENCE GUIDE \n \n1. Critical Aspect of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified traditional animation equipment and \nmaterials. \n1.2 Produced traditional key poses/drawings.  \n1.3 Edited/revised key poses/drawings. \n2. Method of Assessment \nThe assessor must assess the candidate through the \nfollowing: \n2.1 Direct Observation/Demonstration with oral \nquestioning  \n2.2 Interview \n3. Resource Implication \nThe following resources should be provided: \n3.1 Appropriate supplies and materials  \n3.2  Applicable equipment \n4. Context of Assessment \n4.1 Competency maybe assessed in actual workplace \nor at the designated TESDA Accredited \nAssessment Center.\n",
