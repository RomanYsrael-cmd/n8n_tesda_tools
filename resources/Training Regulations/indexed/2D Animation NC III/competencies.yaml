formed to relevant \npersonnel. \n3.1. Verbal Communication \n3.2. Written Communication \n3.3. Computer hardware, \nsoftware knowledge \n3.4. Production information \n3.5. Familiar with different \ntypes of media \n3.6. Practicing 3Rs – \nReduce, Re-use, \nRecycle/Recover and \nenvironmental concerns \n3.7. Basic Math \n3.1. Analytical and \ncomprehension \nskills \n3.2. Effective \nCommunication \nskills \n3.3. Presentation \nskills \n3.4. Computer \noperation skills \n3.5. Practicing OSHS, \nEHSM, 3Rs\n\n--- PDF PAGE 62 ---\n__________________________________________________________________________________          58 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. File output \nMay include: \n1.1. \nVideo output format \n1.2. \nRaw files/scene folder"
