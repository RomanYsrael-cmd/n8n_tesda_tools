        "source_text": "--- PDF PAGE 54 ---\n__________________________________________________________________________________          50 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nUNIT TITLE \n: \nCREATE 2D DIGITAL CUT-OUT ANIMATION \nUNIT CODE \n \n \n:     ICT216306                     \nUNIT DESCRIPTOR \n: \nThis unit covers the skills and knowledge required to build \nanimation object library and use digital animation techniques \nand software to create 2D digital cut-out animation. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Identify and \ngather \nrequirements \nand materials \nfor 2D digital \ncut-out \nanimation   \n \n  \n1.1 Digital model pack, stock \nlibrary, digital storyboard \nare obtained with relevant \npersonnel based on \ncompany policies and \nprocedures \n1.2 Animatics and production \ntechnical specifications are \ndiscussed with Director/ \nsupervisor based on scene \nprovided \n1.3 Software selected is installed \nin accordance with the \nspecified delivery platform \n1.1 Verbal \nCommunication \n1.2 Written \nCommunication \n1.3 Intellectual Property \nrights and concerns \n1.4 OHS processes and \nprocedure for \nComputer Hardware \n1.5 Computer hardware \nrequirements for \nanimation \n1.6 Digital animation \nequipment & materials \n1.7 Model sheets \n1.8 2D animation software \n1.9 Cross platform/ \ndelivery platform \n1.10 Basic Math \n1.1 Effective \nCommunication \nskills \n1.2 Computer \noperation skills \n1.3 Drawing skills \n1.4 Analytical and \ncomprehension \nskills \n1.5 Reporting skills \n1.6 Skills in reading \nand analyzing \nmodel sheet, \nstoryboard and \nsoundtrack \nbreakdown. \n1.7 Presentation \nskills \n1.8 Practicing \nOSHS, EHSM, \n3Rs \n2. Build digital  \nlibrary of \ncharacters \nand objects  \n2.1 Character turn-around,  \nspecial effects, \nprops/objects are acquired \nbased on digital model \nsheet. \n2.2 All acquired elements are \ntraced, drawn or built based \non given model \nsheet/poses/drawings. \n2.3 Segmented elements are \ncolored, saved and backed \nup in accordance with \ncompany SOP \n2.4 All characters are \nsegmented and grouped \naccording to body parts’ and \njoints’ parenting structures. \n2.5 All segmented elements are \nproperly labeled with correct \nnaming convention. \n2.6 Complete segmented parts \nof characters and objects are \nsaved and submitted for final \nreview and approval based \non client’s requirements \n2.1 Verbal \nCommunication \n2.2 Written \nCommunication \n2.3 Intellectual Property \nrights and concerns \n2.4 OHS processes and \nprocedure for \nComputer Hardware \n2.5 Human and animal \nanatomy \n2.6 Behavioural science \n2.7 Computer hardware \nrequirements for \nanimation \n2.8 Digital animation \nequipment & \nmaterials \n2.9 Model sheets \n2.10 2D animation \nsoftware \n2.11 Cross platform/ \ndelivery platform \n2.12 Basic Math \n2.13 Geometry \n2.1 Effective \nCommunication \nskills \n2.2 Presentation \nskills \n2.3 Computer \noperating skills \n2.4 Drawing skills \nfor both living & \nnon-living   \n2.5 Animation skills \n2.6 Analytical and \ncomprehension \nskills \n2.7 Skills in \nanalyzing \nanimatics \n2.8 Acting skills \n2.9 Understanding \n& applying \ndirector’s \ninstructions \n2.10 OSHS, EHSM, \n3Rs and 5S\n\n--- PDF PAGE 55 ---\n__________________________________________________________________________________          51 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Produce 2D \ndigital cut-out \nanimation \n3.1 Materials of the assigned \nscene are obtained from \nrelevant personnel based on \nproduction procedures \n3.2 Required characters, \nobjects/props and \nbackground are set-up for \nthe particular scene \n3.3 Scene is digitally animated \nusing items found in the \nprovided materials based on \nthe animatic or storyboard \napplying the Principles of \nanimation \n3.4 Appropriate body parts are \nselected and substituted \nfrom the digital library for the \naction required in a particular \nscene. \n3.5 Lipsync or sound effects is \nincorporated (if necessary) \non specific dialogue areas in \nthe scene based on \nanimatics. \n3.6 Created 2D digital cut-out \nanimation is saved based on \nappropriate delivery format. \n3.7 Animated scene is reviewed \nthrough playback to check \nmovements and lipsync  \n3.8 Finished animated scene is \nsubmitted to relevant \npersonnel based on \ncompany policies and \nprocedures\n3.1 Verbal \nCommunication \n3.2 Written \nCommunication \n3.3 Intellectual Property \nrights and concerns \n3.4  OHS processes and \nprocedure for \nComputer Hardware \n3.5 Human and animal \nanatomy \n3.6 Behavioural science \n3.7 Animation principles \n3.8 Perspective \n3.9 Spatial perception \n3.10 Phonetics \n3.11 Physics \n3.12 Computer hardware \nrequirements for \nanimation \n3.13 Digital animation \nequipment & \nmaterials \n3.14 Model sheets \n3.15 2D animation \nsoftware \n3.16 Cross platform/ \ndelivery platform \n3.17 Principles and \ntechniques of \nanimation production \n3.18 Basic Math \n3.19 Geometry \n3.1 Clean-up and \nIn-between \nDrawing Skills \n3.2 Drawing skills \nfor both living & \nnon-living   \n3.3 Animation skills \n3.4 Analytical and \ncomprehension \nskills \n3.5 Skills in \nanalyzing \nanimatic \n3.6 Skills in \nanalyzing \nlayout  \n3.7 Acting skills \n3.8 Voice acting \nskill \n3.9 Understanding \n& applying \ndirector’s \ninstructions \n3.10 Effective \nCommunication \nskills \n3.11 Presentation \nskills \n3.12 Computer and \nsoftware skills \n3.13 Practicing \nOSHS, EHSM, \n3Rs and 5S \n4. Revise / Edit \n2D digital cut-\nout animation \n4.1. Revisions are received and \ndiscussed with director/ \nanimation supervisor based \non scene submitted. \n4.2. Revision changes are \nincorporated to the \nanimation in accordance \nwith director’s instruction \n4.3. Revised scene is \nresubmitted to relevant \npersonnel based on \ncompany policies and \nprocedures  \n4.1. Verbal \nCommunication \n4.2. Written \nCommunication \n4.3. Intellectual Property \nrights and concerns \n4.4. OHS processes and \nprocedure for \nComputer Hardware \n4.5. Human and animal \nanatomy \n4.6. Behavioural science \n4.7. Animation principles \n4.8. Perspective \n4.9. Spatial perception \n4.10. Phonetics \n4.11. Physics \n4.1. Clean-up and \nIn-between \nDrawing Skills \n4.2. Drawing skills \nfor both living & \nnon-living   \n4.3. Animation skills \n4.4. Analytical and \ncomprehension \nskills \n4.5. Skills in \nanalyzing \nanimatic \n4.6. Skills in \nanalyzing \nlayout  \n4.7. Acting skills \n4.8. Voice acting \nskill\n\n--- PDF PAGE 56 ---\n__________________________________________________________________________________          52 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4.12. Computer hardware \nrequirements for \nanimation \n4.13. Digital animation \nequipment & \nmaterials \n4.14. Model sheets \n4.15. 2D animation \nsoftware \n4.16. Cross platform/ \ndelivery platform \n4.17. Basic Math \n4.18. Geometry \n \n4.9. Understanding \n& applying \ndirector’s \ninstructions \n4.10. Effective \nCommunicatio\nn skills \n4.11. Presentation \nskills \n4.12. Computer and \nsoftware skills \n4.13. Practicing \nOSHS, EHSM, \n3Rs and 5S\n\n--- PDF PAGE 57 ---\n__________________________________________________________________________________          53 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Digital Model pack \nlibrary \nMay include:  \n1.1. Character turnarounds \n1.2. Objects /props \n1.3. Size comparison \n1.4. Attitudes and expressions \n1.5. Mouth chart \n1.6. Background reference \n1.7.\nEffects\n2. Materials \nMay include: \n2.1. Character parts: eyes, hands, heads, etc \n2.2. Symbols / nodes \n2.3. Storyboard (softcopy) \n2.4. Animatics \n2.5. Effects \n3. Digital storyboard \nMay include: \n3.1. Title, episode, sequence / act \n3.2. Scene elements (background, poses, character, \ncamera movements) \n3.3. Dialogue / audio indication \n3.4. Action notes (time set up, location, action needed)\n4. Animatics \nMay include video of: \n4.1. Character movement \n4.2. Camera movement \n4.3. Sequence cut \n4.4. Dialogue cut \n4.5. Time elapse / frame count / FPS \n4.6. Scene/ panel number\n5. Production Technical \nspecifications \nMay include:  \n5.1. Timing  \n5.2. Animation style/ movement \n5.3. effects  \n5.4. 3D elements\n6. Relevant personnel \nMay include: \n6.1. Animation Director \n6.2. Production Manager \n6.3. Production Coordinator\n7. Software \nMay include: \n7.1. Adobe Flash/ animate \n7.2. Toon Boom Harmony \n7.3. Retas Pro \n7.4. TV paint \n7.5. After effects \n7.6. Adobe photoshop\n\n--- PDF PAGE 58 ---\n__________________________________________________________________________________          54 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nVARIABLE \nRANGE \n8. Delivery platforms \nMay include: \n8.1. .Fla \n8.2. .Swf \n8.3. .Avi \n8.4. .Mp4 \n8.5. .Mov \n8.6. Targa \n8.7. .Png \n8.8. Image sequence \n8.9. .gif\n9. Character turnaround \nMay include: \n9.1. Front view \n9.2. side view \n9.3. back view \n9.4. quarter view\n10. Special effects \nMay include the following: \n10.1. Explosion \n10.2. Water effects \n10.3. Smoke effects \n10.4. Dust \n10.5. Fire \n10.6. etc.\n11. Objects \nMay Include: \n11.1. Props \n11.2. Overlays \n11.3. Underlays  \n11.4. Characters \n11.5. Background\n12. Items \nMay include: \n12.1. model pack \n12.2. characters \n12.3. parts: hands, eyes, heads, legs etc. \n12.4. Props / objects\n13. Digital backgrounds  \nMay include \n13.1. Interior  \n13.2.\nExterior \n14.  Principles of \nAnimation \nMay include: \n14.1. Appeal \n14.2. Solid drawing/ Dynamic pose (silhouettes, volume) \n14.3. Staging/ composition \n14.4. Exaggeration \n14.5. Anticipation \n14.6. Follow through/ overlapping/wave/figure 8 principle \n14.7. Pose to pose / straight ahead \n14.8. Timing with texture/ Spacing/  \n◦ Balance \n◦\nweight\n\n--- PDF PAGE 59 ---\n__________________________________________________________________________________          55 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nVARIABLE \nRANGE \n◦ body attitude \n◦ line of action \n14.9. Stretch & squash \n14.10. Arcs \n14.11. Secondary action \n14.12. Slow in / slow out\n15.  Lipsync  \nMay include: \n15.1. Phonetics / Visemes  \n15.2. Mouth chart A,B,C,D,E, F,G,H \n15.3. Special mouths O,TH, PH etc \n15.4. 1(closed mouth) 2 (half-open mouth) 3 (open mouth)\n\n--- PDF PAGE 60 ---\n__________________________________________________________________________________          56 \nTR – 2D ANIMATION NC III       (Version 02)                                     Amended   February 27, 2018 \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Identified and gathered requirements and materials for \n2D digital cut-out animation. \n1.2 Built digital library of characters and objects \n1.3 Produced 2D digital cut-out animation. \n1.4 Revised/Edit 2D digital cut-out animation. \n2. Method of Assessment \nThe assessor must assess the candidate through the ff: \n2.1 Demonstration with oral questioning \n2.2 interview \n3. Resource Implication \nThe following resources should be provided: \n3.1 Appropriate materials  \n3.2 Applicable software and equipment \n4. Context of Assessment \n4.1. Competency maybe assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter.\n",
