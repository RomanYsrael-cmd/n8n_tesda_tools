nmathematical \nconcepts and \ntechniques \n5.1 Identify \nmathematical tools \nand techniques to \nsolve problem \n• Discussion on the four fundamental operation \n(addition, subtraction, division, multiplication) \n• Read: \no Measurement system \no Precision and accuracy \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour\n\n--- PDF PAGE 68 ---\n__________________________________________________________________________________ 64 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods \nNominal \nDuration\no Basic measuring tools/devices \n• Apply mathematical computations \n• Demonstrate activities on: \no Use of calculator \no Use of different measuring tools \n5.2 Apply mathematical \nprocedures/ solution \n• Lecture and discussion on: \no Estimation \no Problem-based questions \no Mathematical techniques \n• Apply mathematical computations \n• Demonstrate activities on: \no Use of calculator \no Use of different measuring tools \no Use of mathematical tools and standard \nformulas \n• Lecture \n• Demonstration \n• Simulation/ Role \nplay \n• Written \nexamination \n• Observation \n4 Hours \n5.3 Analyze results \n• Discussion on the four fundamental operation \n(addition, subtraction, division, multiplication) \n• Read: \no Measurement system \no Precision and accuracy \no Basic measuring tools/devices \n• Apply mathematical computations \n• Demonstrate activities on: \no Use of calculator \no Use of different measuring tools \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n6. Use relevant \ntechnologies \n \n6.1 Identify appropriate \ntechnology \n• Discussion on company policy in relation to \nrelevant technology \n• Read: \no Awareness on technology and its function \no Relevant technology application/ \nimplementation \no Operating instructions \n• Practice basic communication skill in a group \nactivity \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Simulation/ Role \nPlay \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour\n\n--- PDF PAGE 69 ---\n__________________________________________________________________________________ 65 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods \nNominal \nDuration\n6.2 Apply relevant \ntechnology \n• Discussion on different management \nconcepts \n• Read: \no Relevant technology application/ \nimplementation \no Technology adaptability \no Different management concepts \no Health and safety procedure \no Communication techniques \no Apply software applications skills \n• Practice drills on installing application \nsoftware \n• Practice basic communication skill in a group \nactivity \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Simulation/ Role \nPlay \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n4 Hours \n6.3 Maintain/ enhance \nrelevant technology \n• Lecture and discussion on: \no Repair and maintenance procedure \no Operating instructions \n• Practice drills: \no Installing application software \no Basic troubleshooting skills\n• Lecture \n• Demonstration \n• Simulation/ Role \nPlay \n• Written \nexamination \n• Observation \n2 Hours \n7. Apply critical \nthinking and \nproblem solving \ntechniques in the \nworkplace \n7.1. Identify the problem \n• Lecture and discussion on \no Processes, normal operating parameters, \nand product quality to recognize \nnonstandard situations \no Enterprise goals, targets and measures \no Analytical techniques \no Types of problems \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n2 Hours \n7.2. Determine \nfundamental causes \nof the problem \n• Lecture and collabo