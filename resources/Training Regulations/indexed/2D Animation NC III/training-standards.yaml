    "source_text": "SECTION 3 TRAINING ARRANGEMENTS \n \n \nThese standards are set to provide technical and vocational education and training \n(TVET) providers with information and other important requirements to consider when \ndesigning training programs for 2D Animation NC III. \n \nThey include information on curriculum design; training delivery; trainee entry \nrequirements; tools and equipment; training facilities; and trainer’s qualification. \n \n \n3.1 \nCURRICULUM DESIGN \n \nTESDA shall provide the training on the development of competency-based \ncurricula to enable training providers develop their own curricula with the \ncomponents mentioned below. \n \nDelivery of knowledge requirements for the basic, common and core units \nof competency specifically in the areas of mathematics, science/technology, \ncommunication/language and other academic subjects shall be contextualized. To \nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to \ninclude green technology, issues on health and drugs and catering to persons with \ndisabilities (PWD’s) to accompany their curricula. \n \nCourse Title: 2D Animation \n \n \n \nNC Level: NC III \n \nNominal Training Duration: \n 68 hrs – Basic Competencies \n \n \n \n \n \n 28 hrs – Common Competencies \n \n \n \n \n \n 872 hrs – Core Competencies \n \n \n \n \n \n------------------------ \n \n \n \n \nTotal \n968 hrs \n \n \nCourse Description: \n \n \nThis course is designed to develop & enhance the knowledge, skills, & attitudes of \nan Animator in accordance with industry standards. It covers the basic & common \ncompetencies in addition to the core competencies such as to produce traditional key \nposes/drawings for animation, create tradigital animation, create 2D digital cut-out \nanimation and to export animation to video file format. \n \nThe nominal duration of 968 hours covers the required units at 2D Animation NC \nIII. TVET providers can however, offer a longer, ladderized course covering the NC III \nbasic, common and core units. \n \n \nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 64 ---\n__________________________________________________________________________________ 60 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nBASIC COMPETENCIES \n(68 hours) \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods\nNominal \nDuration\n1. Lead workplace \ncommunication \n \n1.1 Communicate \ninformation about \nworkplace processes\n• Lecture and discussion on: \no Effective verbal communication methods \no Sources of information \n• Practice organizing information \n• Identify organization requirements for written \nand electronic communication methods \n• Follow organization requirements for the use \nof written and electronic communication \nmethods \n• Perform exercises on understanding and \nconveying intended meaning scenario \n• Lecture \n• Demonstration \n• Practical \nexercises \n• Demonstration \n• Role Play \n• Written Test \n• Observation \n2 Hours \n1.2 Lead workplace \ndiscussions \n• Lecture and discussion on: \no Organizational policy on production, quality \nand safety \no Goals/ objectives and action plan setting \n• Read effective verbal communication \nmethods \n• Prepare/set action plans based on \norganizational goals and objectives \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written Test \n• Observation \n2 Hours \n1.3 Identify and \ncommunicate issues \narising in the \nworkplace \n• Lecture and discussion on: \no Organizational policy in dealing with issues \nand problems \n• Read effective verbal communication \nmethods \n• Practice organizing information \n• Perform exercises on understanding and \nconveying intended meaning scenario\n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written Test \n• Observation \n2 Hours \n2. Lead small \nteams \n \n \n \n2.1 Provide team \nleadership \n• Lecture and discussion on: \no Company policies and procedures \n• Identify client expectations \n• Practice team building skills \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours\n\n--- PDF PAGE 65 ---\n__________________________________________________________________________________ 61 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods \nNominal \nDuration\n \n \n \n \n \n \n \n \n \n \n• Perform exercises on communication skills \nrequired for leading teams \n2.2 Assign \nresponsibilities \namong members \n• Lecture and discussion on: \no Team member’s duties and responsibilities \n• Identify client expectations \n• Practice negotiating skills \n• Perform group exercises showing the skills \nand techniques in promoting team building \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n2.3 Set performance \nexpectation for team \nmembers. \n• Lecture and discussion on: \no Team member’s duties and responsibilities \no How performance expectations are set \n• Identify client expectations \n• Perform group exercises in setting individual \ntarget/ expectation \n• Read instruction and requirements in up to \ndate dissemination to members \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Observation \n• Written \nexamination \n2 Hours \n2.4 Supervise team \nperformance \n• Discuss listening and treating individual team \nmembers concern \n• Identify methods of Monitoring Performance \n• Perform group exercises showing the skills in \nmonitoring team performance \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n3. Develop and \npractice \nnegotiation skills \n \n \n3.1. Plan negotiations \n• Lecture and discussion on: \no codes of practice and guidelines for the \norganization \no differences between content and process \n• Read: \no Organizations policy and procedures for \nnegotiations \no Decision making and conflict resolution \nstrategies procedures \no Strategies to manage conflict \no Steps in negotiating process \n• Identify bargaining information \n•Apply strategies to manage process\n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n4 hours\n\n--- PDF PAGE 66 ---\n__________________________________________________________________________________ 62 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods \nNominal \nDuration\n• Apply steps in negotiating process \n3.2. Participate in \nnegotiations \n• Discuss/Describe the following strategies \nduring negotiation: \no Decision making and conflict resolution \nstrategies procedures \no Problem solving strategies on how to deal \nwith unexpected questions and attitudes \nduring negotiation \n• Practice the following scenarios in a group \nactivity: \no Perform interpersonal skills to develop \nrapport with other parties \no Perform verbal communication and \nlistening skill \no observation skills \no negotiation skills \n• Describe the Procedure in documenting \nnegotiations \n• Apply a filing system in managing information \n• Demonstrate filing of documents \n \n• Group \nDiscussion \n• Case studies \n• Demonstration \n• Simulation/ Role \nplay \n• Oral \nevaluation \n• Observation \n4 Hours \n4. Solve workplace \nproblem related \nto work activities \n4.1. Identify the problem \n \n• Discussion on Normal operating parameters \n& product quality \n• Identify & clarify the nature of problem \n• Read: \no Brainstorming \no Cause and effect diagrams \no PARETO analysis \no SWOT analysis \no GANT chart \no PERT CPM & graph \no SCATTERGRAMS \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours\n\n--- PDF PAGE 67 ---\n__________________________________________________________________________________ 63 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods \nNominal \nDuration\n• Apply observation, investigation and \nanalytical techniques in solving problem in the \nworkplace \n4.2. Determine \nfundamental cause \nof the problem \n• Discussion on Teamwork and work allocation \nproblem \n• Read: \no Using range of formal problem solving \ntechniques \no Enterprise goals, targets and measures \no Enterprise quality, OHS and environmental \nrequirement \no Non-routine process and quality problems \n• Perform group exercises showing safety in \nemergency situations and incidents \n• Identify & clarify the nature of problem \n• Select relevant equipment and operational \nprocesses \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour \n4.3. Determine correct / \npreventive action \n• Discussion on principles of decision making \nstrategies and techniques \n• Read: \no Evaluating the solution \no Devising the best solution \n• Perform group exercise how to implement the \ndeveloped plan to rectify a problem \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour \n4.4. Provide \nrecommendation to \nmanager \n• Discuss industry codes and standards \n• Apply enterprise information systems and \ndata collation \n• Prepare recommendation letter \n• Group \nDiscussion \n• Demonstration \n• Oral \nevaluation \n• Observation \n2 Hour \n5. Use \nmathematical \nconcepts and \ntechniques \n5.1 Identify \nmathematical tools \nand techniques to \nsolve problem \n• Discussion on the four fundamental operation \n(addition, subtraction, division, multiplication) \n• Read: \no Measurement system \no Precision and accuracy \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour\n\n--- PDF PAGE 68 ---\n__________________________________________________________________________________ 64 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods \nNominal \nDuration\no Basic measuring tools/devices \n• Apply mathematical computations \n• Demonstrate activities on: \no Use of calculator \no Use of different measuring tools \n5.2 Apply mathematical \nprocedures/ solution \n• Lecture and discussion on: \no Estimation \no Problem-based questions \no Mathematical techniques \n• Apply mathematical computations \n• Demonstrate activities on: \no Use of calculator \no Use of different measuring tools \no Use of mathematical tools and standard \nformulas \n• Lecture \n• Demonstration \n• Simulation/ Role \nplay \n• Written \nexamination \n• Observation \n4 Hours \n5.3 Analyze results \n• Discussion on the four fundamental operation \n(addition, subtraction, division, multiplication) \n• Read: \no Measurement system \no Precision and accuracy \no Basic measuring tools/devices \n• Apply mathematical computations \n• Demonstrate activities on: \no Use of calculator \no Use of different measuring tools \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n6. Use relevant \ntechnologies \n \n6.1 Identify appropriate \ntechnology \n• Discussion on company policy in relation to \nrelevant technology \n• Read: \no Awareness on technology and its function \no Relevant technology application/ \nimplementation \no Operating instructions \n• Practice basic communication skill in a group \nactivity \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Simulation/ Role \nPlay \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hour\n\n--- PDF PAGE 69 ---\n__________________________________________________________________________________ 65 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods \nNominal \nDuration\n6.2 Apply relevant \ntechnology \n• Discussion on different management \nconcepts \n• Read: \no Relevant technology application/ \nimplementation \no Technology adaptability \no Different management concepts \no Health and safety procedure \no Communication techniques \no Apply software applications skills \n• Practice drills on installing application \nsoftware \n• Practice basic communication skill in a group \nactivity \n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Simulation/ Role \nPlay \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n4 Hours \n6.3 Maintain/ enhance \nrelevant technology \n• Lecture and discussion on: \no Repair and maintenance procedure \no Operating instructions \n• Practice drills: \no Installing application software \no Basic troubleshooting skills\n• Lecture \n• Demonstration \n• Simulation/ Role \nPlay \n• Written \nexamination \n• Observation \n2 Hours \n7. Apply critical \nthinking and \nproblem solving \ntechniques in the \nworkplace \n7.1. Identify the problem \n• Lecture and discussion on \no Processes, normal operating parameters, \nand product quality to recognize \nnonstandard situations \no Enterprise goals, targets and measures \no Analytical techniques \no Types of problems \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n2 Hours \n7.2. Determine \nfundamental causes \nof the problem \n• Lecture and collaboration on \no Root cause of the problem \no Problem solving tools \n•Exercise on cause and effect \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination\n2 Hours \n7.3. Determine \ncorrective action \n• Lecture and discussion on \no Identification and analysis of possible \noptions for problem resolution \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n2 Hours\n\n--- PDF PAGE 70 ---\n__________________________________________________________________________________ 66 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods \nNominal \nDuration\no Corrective actions \no Principles of decision making strategies and \ntechniques \n•Layouting of action plans\n• Written \nExamination \n• Observation \n7.4. Provide \nrecommendation/s \nto manager \n• Using range of formal problem solving \ntechniques \n• Preparation and presentation of sample \nrecommendation report \n \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n•Presentation \n2 Hours \n8. Use information \ncreatively and \ncritically \n8.1. Use technical \ninformation systems \nand information \ntechnology \n• Lecture and discussion on: \no Application in collating information \no Procedures for inputting, maintaining and \narchiving information \no Guidance to people who need to find and \nuse information \n• Organizing information into a suitable form for \nreference and use \n• Classify stored information for identification \nand retrieval \n• Operate the technical information system by \nusing agreed procedures \n \n• Lecture \n• Group \nDiscussion \n• Self-paced \nhandout/ module \n• Hands on \n• Demonstration \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n4 Hours \n8.2. Apply information \ntechnology (IT) \n• Lecture and discussion on: \no Attributes and limitations of available \nsoftware tool \no Procedures and work instructions for the use \nof IT \no Operational requirements for IT systems \no Sources and flow paths of data \no Security systems and measures that can be \nused \no Methods of entering and processing \ninformation\n• Lecture \n• Group \nDiscussion \n• Self-paced \nhandout/ module \n• Hands on \n• Demonstration \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n2 Hours\n\n--- PDF PAGE 71 ---\n__________________________________________________________________________________ 67 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods \nNominal \nDuration\n• Use procedures and work instructions for the \nuse of IT \n• Extract data and format reports \n• Use WWW applications \n8.3. Edit, format and \ncheck information \n• Lecture and discussion on: \no Basic file-handling techniques \no Techniques in checking documents \no Techniques in editing and formatting \no Proof reading techniques \n• Use different techniques in checking \ndocuments \n• Edit and format information applying different \ntechniques \n• Proof read information applying different \ntechniques \n \n• Lecture \n• Group \nDiscussion \n• Self-paced \nhandout/ module \n• Hands on \n• Demonstration \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n2 Hours \n9. Work in a \ndiverse \nenvironment \n9.1. Develop an \nindividual’s cultural \nawareness and \nsensitivity \n• Lecture and discussion on: \no Enterprise policies and core values \no Awareness on individual cultures and world \ngeography \no Different methods of verbal and non-verbal \ncommunication in a multicultural setting \no Workplace Diversity Policy \n \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n2 hrs \n9.2. Work effectively in an \nenvironment that \nacknowledges and \nvalues cultural \ndiversity \n• Lecture and discussion on: \no The value of diversity in the economy and \nsociety in terms of Workforce development \no Innovation \no Social justice \no Customer service excellence \no Teamwork and collaboration \n• Applying strategies for customer service \nexcellence \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n2 hrs\n\n--- PDF PAGE 72 ---\n__________________________________________________________________________________ 68 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods \nNominal \nDuration\n \n9.3. Identify common \nissues in a \nmulticultural and \ndiverse environment \n• Lecture and discussion on: \no Diversity-related conflicts within the \nworkplace \no Change management policies \no Advance strategies for customer service \nexcellence \n• Identifying and addressing workplace \nharassment \n• Applying advance strategies for customer \nservice excellence \n \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n2 hrs \n \nNote: Basic competencies may be embedded in the core competencies.\n\n--- PDF PAGE 73 ---\n__________________________________________________________________________________ 69 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nCOMMON COMPETENCIES \n28 hrs \n \n \nUnit of Competency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n1. Apply Quality \nStandards \n1.1 Assess quality of \nreceived materials \n \n• Identify relevant production processes, \nmaterials and products \n• Study and interpret characteristics of \nmaterials, software and hardware used \nin production processes \n• Perform quality checking procedures \n• Apply quality Workplace procedures \n• Identify faulty materials \n• Check quality of materials or component \nparts as per manufacturer’s standards \n• Interpret specifications or symbols \n• Lecture \n• Field trip \n• Symposium \n• Video clips \n• Simulation/ Role \nplaying \n \n• Written test \n• Demonstration \n& questioning \n• Observation & \nquestioning \n \n3 hours \n1.2 Assess own work \n• Perform workplace procedure in \ndocumenting completed work \n• Perform fault identification and reporting \n• Observe safety and environmental \naspects of production processes \n• Utilize workplace quality indicators \n• Document and report deviations from \nspecified quality standards \n• Field trip \n• Symposium \n• Simulation \n• On the job \ntraining \n \n• Demonstration \n& questioning \n• Observation & \nquestioning \n \n3 hours \n1.3 Engage in quality \nimprovement \n• Participate in quality improvement \nprocesses \na. IEC/ISO standards \nb. Environmental and safety \nstandards \n• Carry out work as per process \nimprovement procedures \n• Monitor operation performance \n• Implement continuous improvement \n \n• Field trip \n• Symposium \n• Simulation \n• On the job \ntraining \n• Demonstration \n& questioning \n• Observation & \nquestioning \n \n2 hours\n\n--- PDF PAGE 74 ---\n__________________________________________________________________________________ 70 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of Competency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n2. Perform Computer \nOperations \n \n1.1 Plan and prepare \nfor task to be \nundertaken \n• Plan and prepare computer operation \nactivity \n• Determine task requirements based on \nrequired output \n• Determine appropriate hardware and \nsoftware \n• Identify/Select types of computers and \nbasic features of different operating \nsystems \n• Interpret and follow client-specific \nguidelines & procedures \n• Plan task as per data security guidelines \n• Lecture \n• Modular \n• Computer based \ntraining (e-\nlearning) \n• Project method \n• On the job \ntraining \n• Written/Oral \nexamination \n• Practical \ndemonstration \n \n \n4 hours \n1.2 Input data into \ncomputer \n• Apply basic ergonomics of keyboard and \ncomputer user \n• Enter/Encode data using appropriate \ncomputer programs/applications \n• Check accuracy of encoded \ndata/information per SOP \n• Save and store inputted data in storage \nmedia \n• Storage devices and basic categories of \nmemory \n• Identify and define relevant types of \nsoftware \n• Lecture \n• Modular \n• Group discussion \n• Project method \n• On the job \ntraining \n• Written/Oral \nexamination \n• Practical \ndemonstration \n \n \n4 hour \n1.3 Access information \nusing computer \n• Select correct program/ application \nbased on job requirements \n• Access computer data/files \n• Interpret general security, privacy \nlegislation & copyright \n• Use Productivity Application \n• Microsoft office applications \n• Learn Business Application \n• Introduction to Basic Programming \nsoftware\n• Lecture \n• Computer based \ntraining (e-\nlearning) \n• On the job \ntraining \n \n• Written/Oral \nexamination \n• Practical \ndemonstration \n \n \n5 hours\n\n--- PDF PAGE 75 ---\n__________________________________________________________________________________ 71 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of Competency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n• Apply basic ergonomics of keyboard and \ncomputer user \n \n1.4 Produce/output \ndata using \ncomputer system \n• Identify types and function of computer \nperipheral devices \n• Print and scan office documents and \nmaterials \n• Send office/ business documents \nthrough facsimile \n• Transfer files or data between \ncompatible systems using computer \nsoftware, hardware/ peripheral devices \n• Save documents in storage devices \na. CD/DVD \nb. USB drives \nc. Hard disk drives \n• Lecture \n• Group discussion \n• Modular \n• On the job \ntraining \n \n• Written/Oral \nexamination \n• Practical \ndemonstration \n \n \n5 hours \n1.5 Maintain computer \nequipment and \nsystems \n• Perform computer equipment/ system \nbasic maintenance procedures \na. Perform basic file maintenance \nprocedures \nb. Perform cleaning of PC parts/ \nhardware components \nc. Scan/Debug computer \nsoftware and applications \nd. Perform cleaning and \ndefragmentation of computer \nfiles \ne. Perform backup of computer files \n• Enumerate and define different types of \ncomputer viruses \n• Demonstration \n• Simulation \n• Modular \n• Video clips \n• Computer based \ntraining (e-\nlearning) \n \n• Written/Oral \nexamination \n• Practical \ndemonstration \n \n \n2 hours\n\n--- PDF PAGE 76 ---\n__________________________________________________________________________________ 72 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nCORE COMPETENCIES \n872 hours \n \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n1. Produce \nTraditional \nkey poses/ \ndrawings for \nanimation \n \n \n1.1 Identify \nTraditional \nanimation \nequipment and \nmaterials \n \n• Identify all relevant key drawing requirements \nbased on the source material provided. \n• Identify key drawing soundtrack breakdown \nrequirements based from the storyboard and \nexposure sheet. \n• Identify and prepare all necessary materials \nand equipment to be used according to the \ntask to be undertaken. \n• Report non-functioning and missing materials \nand equipment to appropriate personnel \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n• Demonstration \n• Viewing \nmultimedia \n• Written exam \n• Practical exam \nObservation in \nworkplace \n• Interviews/ \nquestioning \n \n16 hours \n1.2 Produce \ntraditional key \nposes/ drawings \n• Produce key poses/drawings based on the \nstoryboard, layout and the exposure sheets. \n• Comply key poses/drawings produced with \nthe style of the model pack. \n• Produce key poses/drawings of dialogue \nscenes in sync with the soundtrack \nbreakdown. \n• Apply the 12 principles of animation in relation \nand as required in the scene action. \n• Sufficient quantity of key poses/drawings and \nanimation breakdowns produced to establish \na convincing action, drama and staging. \n• Line test the Key poses/drawings to check \ntiming, acting and movement as required in \nthe exposure sheet. \n• Submit finished scene to relevant personnel \nfor checking. \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n• Demonstration \n• Viewing \nmultimedia \n• Practical exam \n• Observation in \nworkplace \n• Interviews/ \nquestioning \n \n200 hours\n\n--- PDF PAGE 77 ---\n__________________________________________________________________________________ 73 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n \n1.3 Edit/revise key \nposes/drawings \n• Return off model key poses/drawings for \nrevision. \n• Supply key poses/drawings that require \nadditional breakdowns and additional by the \nanimator following instructions of the relevant \npersonnel. \n• Adjust off sync dialogue segments with \ncorrect mouth openings. \n• Resubmit completed revised scene to \nrelevant personnel \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n• Demonstration \n• Viewing \nmultimedia \n• Practical exam \n• Observation in \nworkplace \n• Interviews/ \nquestioning \n24 hours \n2. Create \ntradigital \nanimation \n \n \n \n2.1 Identify and \ngather \nrequirements and \nmaterials for \ntradigital \nanimation \n \n• Obtain digital model pack library, digital \nstoryboard with relevant personnel. \n• Discuss animatic and production technical \nspecifications with Director / supervisor. \n• Install software selected in accordance with \nthe specified delivery platform. \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n• View \nMultimedia \n• Direct \nobservation \n• Demonstration \nwith oral \nquestioning \n16 hours \n2.2 Produce tradigital \nanimation \n• Import animatic of the assigned scene from \nrelevant personnel. \n• Scene analysis based on animatic and \ncharacter study \n• Animate scene applying the principles of \nanimation \n• Integration of sound track for lipsynch \nanimation and special effects for actions or \nobjects required in a particular scene. \n• Review animated scene through playback to \ncheck movements and lip-synch. \n• Save produced tradigital animation in \nappropriate delivery format. \n• Submit finish animated scene to relevant \npersonnel. \n \n \n \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n \n• Direct \nobservation \n• Demonstration \nwith oral \nquestioning \n \n200 hours\n\n--- PDF PAGE 78 ---\n__________________________________________________________________________________ 74 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n \n2.3 Revise / Edit \ntradigital \nanimation \n• Receive and discuss revisions with relevant \npersonnel. \n• Incorporate revision changes to the \nanimations. \n• Resubmit revised scene to relevant \npersonnel.\n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n \n• Direct \nobservation \n• Demonstration \nwith oral \nquestioning \n \n24 hours \n3. Create 2D \ndigital cut-out \nanimation \n3.1. Identify and \ngather \nrequirements and \nmaterials for 2D \ndigital cut-out \nanimation \n• Identification of Digital Model Pack or stock \nlibrary, digital storyboard. \n• Discussion on materials, animatics and \nproduction technical specifications. \n• Identify and familiarized installed software \nrequired for the production \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n• View \nMultimedia \n• Direct \nobservation \n• Demonstration \nwith oral \nquestioning \n24 hours \n3.2. Build digital \ncharacters and \nobjects \n• Import character turn-around, special effects, \nand objects from digital model sheet. \n• Trace, vectorize, digitally color, save and back \nup all acquired items in the stock library. \n• Grouping of body parts and joints through \nparenting \n• Labeling of segmented element by proper \nnaming convention \n• Saving of segmented elements to the stock \nlibrary.\n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n• View \nMultimedia \n \n• Direct \nobservation \n• Demonstration \nwith oral \nquestioning \n \n160 hours \n3.3. Produce 2D digital \ncut-out animation \n• Discussion on animatic of a scene \n• Building of scene by importing characters, \nprops and background required in a scene \n• Producing key poses (pose to pose action) \nbased on animatics \n• Animate scene using selected animation \nsoftware tools applying principles of animation \n• Substituting proper body parts to achieve \nrequired action poses, expressions and \ngestures \n• Integration of sound track to lipsynch \nanimation \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n \n• Direct \nobservation \n• Demonstration \nwith oral \nquestioning \n \n160 hours\n\n--- PDF PAGE 79 ---\n__________________________________________________________________________________ 75 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n• Applying required sound effects to the \nanimation \n• Review animated scene through playback to \ncheck movements and lip-synch. \n• Save produced 2D digital cut-out animation in \nappropriate delivery format. \n• Upload/Transfer finished animated scene to \ndesignated file folder.\n3.4. Revise / Edit 2D \ndigital cut-out \nanimation \n• Discussion of scene revisions \n• Incorporation of revision changes to the \nanimations. \n• Saving and uploading/transferring of revised \nanimation to designated file folder \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n \n• Direct \nobservation \n• Demonstration \nwith oral \nquestioning \n40 hours \n4. Export \nanimation to \nvideo file \nformat \n \n4.1. Check all \nanimation items in \nthe scene to be \nexported \n \n• Check and place all elements including audio \ntrack in correct layers. \n• Make all relevant layers visible that are \nneeded in the scene. \n• View all elements in final playback prior to \nexporting. \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n• Demonstration \n• Viewing \nmultimedia \n• Practical exam \n• Observation in \nworkplace \n• Interviews/ \nquestioning \n1 hour \n4.2. Identify and select \ndelivery platform \nto export \n• Identify video codec and correct resolution for \nthe required scene. \n• Identify specific delivery platform according to \nclient’s specifications \n• Select file output as specified in the \nrequirements. \n• Lecture/ \nDiscussion \n• Demonstration \n• Viewing \nmultimedia \n• Practical exam \n• Observation in \nworkplace \n• Interviews/ \nquestioning \n1 hour \n4.3. Export and save \ndigital animation \n• Save exported animation file in a designated \nfolder \n• Create back-ups and extra copies of \nimportant images and video files on the \nspecific file allocation for the assigned project. \n• Inform and submit file to relevant personnel \n• Demonstration \n• Viewing \nmultimedia \n• Practical exam \n• Observation in \nworkplace \n• Interviews/ \nquestioning \n6 hours\n\n--- PDF PAGE 80 ---\n__________________________________________________________________________________ 76 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \n3.2 \nTRAINING DELIVERY \n \n1. The delivery of training shall adhere to the design of the curriculum. Delivery \nshall be guided by the principles of competency-based TVET. \n \na. Course design is based on competency standards set by the industry or \nrecognized \nindustry \nsector; \n(Learning \nsystem \nis \ndriven \nby \ncompetencies written to industry standards) \n \nb. Training delivery is learner-centered and should accommodate \nindividualized and self-paced learning strategies; \n \nc. Training can be done on an actual workplace setting, simulation of a \nworkplace and/or through adoption of modern technology. \n \nd. Assessment is based in the collection of evidence of the performance of \nwork to the industry required standards; \n \ne. Assessment of competency takes the trainee’s knowledge and attitude \ninto account but requires evidence of actual performance of the \ncompetency as the primary source of evidence. \n \nf. Training program allows for recognition of prior learning (RPL) or current \ncompetencies; \n \ng. Training completion is based on satisfactory completion of all specified \ncompetencies not on the specified nominal duration of learning. \n \n2. The competency-based TVET system recognizes various types of delivery \nmodes, both on-and off-the-job as long as the learning is driven by the \ncompetency standards specified by the industry. The following training \nmodalities and their variations/components may be adopted singly or in \ncombination with other modalities when designing and delivering training \nprograms: \n \n2.1 Institution- Based: \n \n• Dual Training System (DTS)/Dualized Training Program (DTP) which \ncontain both in-school and in-industry training or fieldwork components. \nDetails can be referred to the Implementing Rules and Regulations of \nthe DTS Law and the TESDA Guidelines on the DTP; \n \n• Distance learning is a formal education process in which majority of the \ninstruction occurs when the students and instructor are not in the same \nplace. Distance learning may employ correspondence study, audio, \nvideo, computer technologies or other modern technology that can be \nused to facilitate learning and formal and non-formal training. Specific \nguidelines on this mode shall be issued by the TESDA Secretariat. \n \n• The traditional classroom-based or in-center instruction may be \nenhanced through use of learner-centered methods as well as \nlaboratory or field-work components.\n\n--- PDF PAGE 81 ---\n__________________________________________________________________________________ 77 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \n \n2.2 Enterprise-Based: \n \n• Formal Apprenticeship – Training within employment involving a contract \nbetween an apprentice and an enterprise on an approved \napprenticeable occupation. \n \n• Informal Apprenticeship - is based on a training (and working) \nagreement between an apprentice and a master craftsperson wherein \nthe agreement may be written or oral and the master craftsperson \ncommits to training the apprentice in all the skills relevant to his or her \ntrade over a significant period of time, usually between one and four \nyears, while the apprentice commits to contributing productively to the \nwork of the business. Training is integrated into the production process \nand apprentices learn by working alongside the experienced \ncraftsperson. \n \n• Enterprise-based Training- where training is implemented within the \ncompany in accordance with the requirements of the specific company. \nSpecific guidelines on this mode shall be issued by the TESDA \nSecretariat. \n \n2.3 Community-Based: \n \n• Community-Based Training – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other \nTVET providers which are intended to address the specific needs of a \ncommunity. Such programs can be conducted in informal settings such \nas barangay hall, basketball courts, etc. These programs can also be \nmobile training program (MTP). \n \n \n \n3.3 \nTRAINEE ENTRY REQUIREMENTS \n \nThe trainees who wish to enter the course should possess the following \nrequirements: \n \n• Must have Animation NCII certificate or have industry-based Asst. \nAnimator/ Clean-Up and In-Between experience \n• Must pass creative/drawing test given by institution \n• Able to communicate both oral and written \n \n \nThis list does not include specific institutional requirements such as \neducational attainment, appropriate work experience and others that may be \nrequired from the trainees by the school or training center delivering the TVET \nprogram.\n\n--- PDF PAGE 82 ---\n__________________________________________________________________________________ 78 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \n3.4 \nLIST OF TOOLS, EQUIPMENT AND MATERIALS \n \n Recommended list of tools, equipment and materials for the conduct of training in 2D \nAnimation NC III (class size of 20 students/trainees): \n \n \nTOOLS \nEQUIPMENT \nMATERIALS \nQty. \nDescription \nQty. \nDescription \nQty. \nDescription \n21 \nAny of the following: \n Lightbox (with \nanimation disc/peg \nbar) \n Animation table with \ndisc \n21pcs. Ergonomic computer \ntables and chairs \n2 sets \n( 20 sheets \nper set) \nSamples of \nanimation model \npacks – cartoony \nand realistic \n21 \nMust have any of the \nfollowing 2D software*: \n \nToonboom \n \nFlash \n \nRetas Pro \n \nAfter effects \n21units Desktop computer \nwith mouse and \nkeyboard \n(Software dependent \nspecifications} \n2 pcs. \nWhiteboard \nmarkers \n1 pc. \nWhiteboard \neraser \n3 boxes Light colored \npencils \n1 \nMust have any of the \nfollowing 2D software* \nfor line test purpose \nonly: \n \nFlip book \n \nCTP Pro \n1 unit Desktop computer \nwith mouse and \nkeyboard – for line test\n(Software dependent \nspecifications} \n \n \n21pcs Peg bar \n21units Pen Tablet 4” x 6” \n5 reams Animation paper \n16 \nOperating system \n1 unit Colored printer \n1 roll \nMasking tape 1” \n1 pc \n1 TB External hard drive\n1 unit whiteboard \n1 roll \nmagic tape 1” \n6 pairs Earphones \n1 unit Web camera \n2 boxes Lead Pencil \n1 box Eraser \n \n \n \n \n1 box\nRubber/ kneaded eraser\n4 pcs\nPencil sharpener\n3pcs\nRuler\n* Can be either educational, license and open-source software \n \nIn cases where there are specialized tools, equipment and facilities that are \nnot generally considered standard requirements or not absolute requisites for training, the \nindustry working group or TESDA may provide guidelines or specific advice on such \nmatters.\n\n--- PDF PAGE 83 ---\n__________________________________________________________________________________ 79 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \n3.5 TRAINING FACILITIES \n \nBased on class size of 20 students/trainees the space requirements for the \nteaching/learning and circulation areas are as follows: \n \nTEACHING/LEARNING \nAREAS \nSIZE IN \nMETERS \nAREA IN SQ. \nMETERS \nQT\nY \nTOTAL AREA IN \nSQ. METERS \nLecture Area\n5 x 8\n40\n1\n40\nLearning Resource Area \n4 x 5\n15\n1\n15\nWash ,Toilet & Locker Room\n2 x 5\n4\n2\n8\nFacilities / Equipment / \nCirculation**\n \n \n \n20 \nTotal Area \n \n83 \n \n** Area requirement is equivalent to 30% of the total teaching/learning areas \n \n \nAppropriate consideration should be given in providing and allocating work space, \ncommunications facilities, and the usual workplace amenities to ensure a proper learning \nenvironment. Where applicable, training shall be held or conducted in learning facilities in \naccordance with generally accepted industry standards and practice. \n \n \n3.6 TRAINERS QUALIFICATIONS \n \n• Must be a holder of National TVET Trainer Certificate (NTTC) level I in \n \n2D Animation NC III; \n• Must have at least five (5)-years animation artist industry experience within the \nlast 7 years. \n \n \n \n3.7 \nINSTITUTIONAL ASSESSMENT \n \nInstitutional assessment is undertaken by trainees to determine their \nachievement of units of competency. A certificate of achievement is issued for each \nunit of competency. The institutional assessment is administered by the \ntrainer/assessor. \n \n \n \nThe result of the institutional assessment may be considered as evidence for \nthe assessment for national certification.\n\n--- PDF PAGE 84 ---\n__________________________________________________________________________________ 80 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018"
