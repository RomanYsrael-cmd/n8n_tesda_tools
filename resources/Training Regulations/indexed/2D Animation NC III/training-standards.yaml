ures and work instructions for the use \nof IT \no Operational requirements for IT systems \no Sources and flow paths of data \no Security systems and measures that can be \nused \no Methods of entering and processing \ninformation\n• Lecture \n• Group \nDiscussion \n• Self-paced \nhandout/ module \n• Hands on \n• Demonstration \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n2 Hours\n\n--- PDF PAGE 71 ---\n__________________________________________________________________________________ 67 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods \nNominal \nDuration\n• Use procedures and work instructions for the \nuse of IT \n• Extract data and format reports \n• Use WWW applications \n8.3. Edit, format and \ncheck information \n• Lecture and discussion on: \no Basic file-handling techniques \no Techniques in checking documents \no Techniques in editing and formatting \no Proof reading techniques \n• Use different techniques in checking \ndocuments \n• Edit and format information applying different \ntechniques \n• Proof read information applying different \ntechniques \n \n• Lecture \n• Group \nDiscussion \n• Self-paced \nhandout/ module \n• Hands on \n• Demonstration \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n2 Hours \n9. Work in a \ndiverse \nenvironment \n9.1. Develop an \nindividual’s cultural \nawareness and \nsensitivity \n• Lecture and discussion on: \no Enterprise policies and core values \no Awareness on individual cultures and world \ngeography \no Different methods of verbal and non-verbal \ncommunication in a multicultural setting \no Workplace Diversity Policy \n \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n2 hrs \n9.2. Work effectively in an \nenvironment that \nacknowledges and \nvalues cultural \ndiversity \n• Lecture and discussion on: \