ply strategies to manage process\n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n4 hours\n\n--- PDF PAGE 66 ---\n__________________________________________________________________________________ 62 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods \nNominal \nDuration\n• Apply steps in negotiating process \n3.2. Participate in \nnegotiations \n• Discuss/Describe the following strategies \nduring negotiation: \no Decision making and conflict resolution \nstrategies procedures \no Problem solving strategies on how to deal \nwith unexpected questions and attitudes \nduring negotiation \n• Practice the following scenarios in a group \nactivity: \no Perform interpersonal skills to develop \nrapport with other parties \no Perform verbal communication and \nlistening skill \no observation skills \no negotiation skills \n• Describe the Procedure in documenting \nnegotiations \n• Apply a filing system in managing information \n• Demonstrate filing of documents \n \n• Group \nDiscussion \n• Case studies \n• Demonstration \n• Simulation/ Role \nplay \n• Oral \nevaluation \n• Observation \n4 Hours \n4. Solve workplace \nproblem related \nto work activities \n4.1. Identify the problem \n \n• Discussion on Normal operating parameters \n& product quality \n• Identify & clarify the nature of problem \n• Read: \no Brainstorming \no Cause and effect diagrams \no PARETO analysis \no SWOT analysis \no GANT chart \no PERT CPM & graph \no SCATTERGRAMS \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours\n\n--- PDF PAGE 67 ---\n__________________________________________________________________________________ 63 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearnin