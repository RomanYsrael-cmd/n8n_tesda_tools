TION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods \nNominal \nDuration\n \n9.3. Identify common \nissues in a \nmulticultural and \ndiverse environment \n• Lecture and discussion on: \no Diversity-related conflicts within the \nworkplace \no Change management policies \no Advance strategies for customer service \nexcellence \n• Identifying and addressing workplace \nharassment \n• Applying advance strategies for customer \nservice excellence \n \n• Lecture \n• Group \nDiscussion \n• Oral \nevaluation \n• Written \nExamination \n• Presentation \n2 hrs \n \nNote: Basic competencies may be embedded in the core competencies.\n\n--- PDF PAGE 73 ---\n__________________________________________________________________________________ 69 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nCOMMON COMPETENCIES \n28 hrs \n \n \nUnit of Competency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n1. Apply Quality \nStandards \n1.1 Assess quality of \nreceived materials \n \n• Identify relevant production processes, \nmaterials and products \n• Study and interpret characteristics of \nmaterials, software and hardware used \nin production processes \n• Perform quality checking procedures \n• Apply quality Workplace procedures \n• Identify faulty materials \n• Check quality of materials or component \nparts as per manufacturer’s standards \n• Interpret specifications or symbols \n• Lecture \n• Field trip \n• Symposium \n• Video clips \n• Simulation/ Role \nplaying \n \n• Written test \n• Demonstration \n& questioning \n• Observation & \nquestioning \n \n3 hours \n1.2 Assess own work \n• Perform workplace procedure in \ndocumenting completed work \n• Perform fault identification and reporting \n• Observe safety and environmental \naspects of production processes \n• Utilize workplace quality indicators \n• Document and report deviations from \nspecified quality standards \n• Field trip \n• Symposium \n• Simulation \n• On the job \ntraining \n \n• Demonstration \n& questioning \n• Observation & \nquestioning \n \n3 hours \n1.3 Engage in quality \nimprovement \n• Participate in quality improvement \nprocesses \na. IEC/ISO standards \nb. Environmental and safety \nstandards \n• Carry out work as per process \nimprovement procedures \n• Monitor operation performance \n• Implement continuous improvement \n \n• Field trip \n• Symposium \n• Simulation \n• On the job \ntraining \n• Demonstration \n& questioning \n• Observation & \nquestioning \n \n2 hours\n\n--- PDF PAGE 74 ---\n__________________________________________________________________________________ 70 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of Competency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n2. Perform Computer \nOperations \n \n1.1 Plan and prepare \nfor task to be \nundertaken \n• Plan and prepare computer operation \nactivity \n• Determine task requirements based on \nrequired output \n• Determine appropriate hardware and \nsoftware \n• Identify/Select types of computers and \nbasic features of different operating \nsystems \n• Interpret and follow client-specific \nguidelines & procedures \n• Plan task as per data security guidelines \n• Lecture \n• Modular \n• Computer based \ntraining (e-\nlearning) \n• Project method \n• On the job \ntraining \n• Written/Oral \nexamination \n• Practical \ndemonstration \n \n \n4 hours \n1.2 Input data into \ncomputer \n• Apply basic ergonomics of keyboard and \ncomputer user \n• Enter/Encode data using appropriate \ncomputer programs/applications \n• Check accuracy of encoded \ndata/information per SOP \n• Save and store inputted data in storage \nmedia \n• Storage devices and basic categories of \nmemory \n• Identify and define relevant types of \nsoftware \n• Lecture \n• Modular \n• Group discussion \n• Project method \n• On the job \ntraining \n• Written/Oral \nexamination \n• Practical \ndemonstration \n \n \n4 hour \n1.3 Access information \nusing computer \n• Select correct program/ application \nbased on job requirements \n• Access computer data/files \n• Interpret general security, privacy \nlegislation & copyright \n• Use Productivity Application \n• Microsoft office applications \n• Learn Business Application \n• Introduction to Basic Programming \nsoftware\n• Lecture \n• Computer based \ntraining (e-\nlearning) \n• On the job \ntraining \n \n• Written/Oral \nexamination \n• Practical \ndemonstration \n \n \n5 hours\n\n--- PDF PAGE 75 ---\n__________________________________________________________________________________ 71 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of Competency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n• Apply basic ergonomics of keyboard and \ncomputer user \n \n1.4 Produce/output \ndata using \ncomputer system \n• Identify types and function of computer \nperipheral devices \n• Print and scan office documents and \nmaterials \n• Send office/ business documents \nthrough facsimile \n• Transfer files or data between \ncompatible systems using computer \nsoftware, hardware/ peripheral devices \n• Save documents in storage devices \na. CD/DVD \nb. USB drives \nc. Hard disk drives \n• Lecture \n• Group discussion \n• Modular \n• On the job \ntraining \n \n• Written/Oral \nexamination \n• Practical \ndemonstration \n \n \n5 hours \n1.5 Maintain computer \nequipment and \nsystems \n• Perform computer equipment/ system \nbasic maintenance procedures \na. Perform basic file maintenance \nprocedures \nb. Perform cleaning of PC parts/ \nhardware components \nc. Scan/Debug computer \nsoftware and applications \nd. Perform cleaning and \ndefragmentation of computer \nfiles \ne. Perform backup of computer files \n• Enumerate and define different types of \ncomputer viruses \n• Demonstration \n• Simulation \n• Modular \n• Video clips \n• Computer based \ntraining (e-\nlearning) \n \n• Written/Oral \nexamination \n• Practical \ndemonstration \n \n \n2 hours\n\n--- PDF PAGE 76 ---\n__________________________________________________________________________________ 72 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nCORE COMPETENCIES \n872 hours \n \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n1. Produce \nTraditional \nkey poses/ \ndrawings for \nanimation \n \n \n1.1 Identify \nTraditional \nanimation \nequipment and \nmaterials \n \n• Identify all relevant key drawing requirements \nbased on the source material provided. \n• Identify key drawing soundtrack breakdown \nrequirements based from the storyboard and \nexposure sheet. \n• Identify and prepare all necessary materials \nand equipment to be used according to the \ntask to be undertaken. \n• Report non-functioning and missing materials \nand equipment to appropriate personnel \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n• Demonstration \n• Viewing \nmultimedia \n• Written exam \n• Practical exam \nObservation in \nworkplace \n• Interviews/ \nquestioning \n \n16 hours \n1.2 Produce \ntraditional key \nposes/ drawings \n• Produce key poses/drawings based on the \nstoryboard, layout and the exposure sheets. \n• Comply key poses/drawings produced with \nthe style of the model pack. \n• Produce key poses/drawings of dialogue \nscenes in sync with the soundtrack \nbreakdown. \n• Apply the 12 principles of animation in relation \nand as required in the scene action. \n• Sufficient quantity of key poses/drawings and \nanimation breakdowns produced to establish \na convincing action, drama and staging. \n• Line test the Key poses/drawings to check \ntiming, acting and movement as required in \nthe exposure sheet. \n• Submit finished scene to relevant personnel \nfor checking. \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n• Demonstration \n• Viewing \nmultimedia \n• Practical exam \n• Observation in \nworkplace \n• Interviews/ \nquestioning \n \n200 hours\n\n--- PDF PAGE 77 ---\n__________________________________________________________________________________ 73 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n \n1.3 Edit/revise key \nposes/drawings \n• Return off model key poses/drawings for \nrevision. \n• Supply key poses/drawings that require \nadditional breakdowns and additional by the \nanimator following instructions of the relevant \npersonnel. \n• Adjust off sync dialogue segments with \ncorrect mouth openings. \n• Resubmit completed revised scene to \nrelevant personnel \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n• Demonstration \n• Viewing \nmultimedia \n• Practical exam \n• Observation in \nworkplace \n• Interviews/ \nquestioning \n24 hours \n2. Create \ntradigital \nanimation \n \n \n \n2.1 Identify and \ngather \nrequirements and \nmaterials for \ntradigital \nanimation \n \n• Obtain digital model pack library, digital \nstoryboard with relevant personnel. \n• Discuss animatic and production technical \nspecifications with Director / supervisor. \n• Install software selected in accordance with \nthe specified delivery platform. \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n• View \nMultimedia \n• Direct \nobservation \n• Demonstration \nwith oral \nquestioning \n16 hours \n2.2 Produce tradigital \nanimation \n• Import animatic of the assigned scene from \nrelevant personnel. \n• Scene analysis based on animatic and \ncharacter study \n• Animate scene applying the principles of \nanimation \n• Integration of sound track for lipsynch \nanimation and special effects for actions or \nobjects required in a particular scene. \n• Review animated scene through playback to \ncheck movements and lip-synch. \n• Save produced tradigital animation in \nappropriate delivery format. \n• Submit finish animated scene to relevant \npersonnel. \n \n \n \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n \n• Direct \nobservation \n• Demonstration \nwith oral \nquestioning \n \n200 hours\n\n--- PDF PAGE 78 ---\n__________________________________________________________________________________ 74 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n \n2.3 Revise / Edit \ntradigital \nanimation \n• Receive and discuss revisions with relevant \npersonnel. \n• Incorporate revision changes to the \nanimations. \n• Resubmit revised scene to relevant \npersonnel.\n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n \n• Direct \nobservation \n• Demonstration \nwith oral \nquestioning \n \n24 hours \n3. Create 2D \ndigital cut-out \nanimation \n3.1. Identify and \ngather \nrequirements and \nmaterials for 2D \ndigital cut-out \nanimation \n• Identification of Digital Model Pack or stock \nlibrary, digital storyboard. \n• Discussion on materials, animatics and \nproduction technical specifications. \n• Identify and familiarized installed software \nrequired for the production \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n• View \nMultimedia \n• Direct \nobservation \n• Demonstration \nwith oral \nquestioning \n24 hours \n3.2. Build digital \ncharacters and \nobjects \n• Import character turn-around, special effects, \nand objects from digital model sheet. \n• Trace, vectorize, digitally color, save and back \nup all acquired items in the stock library. \n• Grouping of body parts and joints through \nparenting \n• Labeling of segmented element by proper \nnaming convention \n• Saving of segmented elements to the stock \nlibrary.\n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n• View \nMultimedia \n \n• Direct \nobservation \n• Demonstration \nwith oral \nquestioning \n \n160 hours \n3.3. Produce 2D digital \ncut-out animation \n• Discussion on animatic of a scene \n• Building of scene by importing characters, \nprops and background required in a scene \n• Producing key poses (pose to pose action) \nbased on animatics \n• Animate scene using selected animation \nsoftware tools applying principles of animation \n• Substituting proper body parts to achieve \nrequired action poses, expressions and \ngestures \n• Integration of sound track to lipsynch \nanimation \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n \n• Direct \nobservation \n• Demonstration \nwith oral \nquestioning \n \n160 hours\n\n--- PDF PAGE 79 ---\n__________________________________________________________________________________ 75 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodology \nAssessment \nApproach \nNominal \nDuration \n• Applying required sound effects to the \nanimation \n• Review animated scene through playback to \ncheck movements and lip-synch. \n• Save produced 2D digital cut-out animation in \nappropriate delivery format. \n• Upload/Transfer finished animated scene to \ndesignated file folder.\n3.4. Revise / Edit 2D \ndigital cut-out \nanimation \n• Discussion of scene revisions \n• Incorporation of revision changes to the \nanimations. \n• Saving and uploading/transferring of revised \nanimation to designated file folder \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n \n• Direct \nobservation \n• Demonstration \nwith oral \nquestioning \n40 hours \n4. Export \nanimation to \nvideo file \nformat \n \n4.1. Check all \nanimation items in \nthe scene to be \nexported \n \n• Check and place all elements including audio \ntrack in correct layers. \n• Make all relevant layers visible that are \nneeded in the scene. \n• View all elements in final playback prior to \nexporting. \n• Lecture/ \nDiscussion \n• Hands on \n• Exercises \n• Demonstration \n• Viewing \nmultimedia \n• Practical exam \n• Observation in \nworkplace \n• Interviews/ \nquestioning \n1 hour \n4.2. Identify and select \ndelivery platform \nto export \n• Identify video codec and correct resolution for \nthe required scene. \n• Identify specific delivery platform according to \nclient’s specifications \n• Select file output as specified in the \nrequirements. \n• Lecture/ \nDiscussion \n• Demonstration \n• Viewing \nmultimedia \n• Practical exam \n• Observation in \nworkplace \n• Interviews/ \nquestioning \n1 hour \n4.3. Export and save \ndigital animation \n• Save exported animation file in a designated \nfolder \n• Create back-ups and extra copies of \nimportant images and video files on the \nspecific file allocation for the assigned project. \n• Inform and submit file to relevant personnel \n• Demonstration \n• Viewing \nmultimedia \n• Practical exam \n• Observation in \nworkplace \n• Interviews/ \nquestioning \n6 hours\n\n--- PDF PAGE 80 ---\n__________________________________________________________________________________ 76 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018",
