  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS \n \n \nThese standards are set to provide technical and vocational education and training \n(TVET) providers with information and other important requirements to consider when \ndesigning training programs for 2D Animation NC III. \n \nThey include information on curriculum design; training delivery; trainee entry \nrequirements; tools and equipment; training facilities; and trainer’s qualification. \n \n \n3.1 \nCURRICULUM DESIGN \n \nTESDA shall provide the training on the development of competency-based \ncurricula to enable training providers develop their own curricula with the \ncomponents mentioned below. \n \nDelivery of knowledge requirements for the basic, common and core units \nof competency specifically in the areas of mathematics, science/technology, \ncommunication/language and other academic subjects shall be contextualized. To \nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to \ninclude green technology, issues on health and drugs and catering to persons with \ndisabilities (PWD’s) to accompany their curricula. \n \nCourse Title: 2D Animation \n \n \n \nNC Level: NC III \n \nNominal Training Duration: \n 68 hrs – Basic Competencies \n \n \n \n \n \n 28 hrs – Common Competencies \n \n \n \n \n \n 872 hrs – Core Competencies \n \n \n \n \n \n------------------------ \n \n \n \n \nTotal \n968 hrs \n \n \nCourse Description: \n \n \nThis course is designed to develop & enhance the knowledge, skills, & attitudes of \nan Animator in accordance with industry standards. It covers the basic & common \ncompetencies in addition to the core competencies such as to produce traditional key \nposes/drawings for animation, create tradigital animation, create 2D digital cut-out \nanimation and to export animation to video file format. \n \nThe nominal duration of 968 hours covers the required units at 2D Animation NC \nIII. TVET providers can however, offer a longer, ladderized course covering the NC III \nbasic, common and core units. \n \n \nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 64 ---\n__________________________________________________________________________________ 60 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nBASIC COMPETENCIES \n(68 hours) \nUnit of \nCompetency\nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods\nNominal \nDuration\n1. Lead workplace \ncommunication \n \n1.1 Communicate \ninformation about \nworkplace processes\n• Lecture and discussion on: \no Effective verbal communication methods \no Sources of information \n• Practice organizing information \n• Identify organization requirements for written \nand electronic communication methods \n• Follow organization requirements for the use \nof written and electronic communication \nmethods \n• Perform exercises on understanding and \nconveying intended meaning scenario \n• Lecture \n• Demonstration \n• Practical \nexercises \n• Demonstration \n• Role Play \n• Written Test \n• Observation \n2 Hours \n1.2 Lead workplace \ndiscussions \n• Lecture and discussion on: \no Organizational policy on production, quality \nand safety \no Goals/ objectives and action plan setting \n• Read effective verbal communication \nmethods \n• Prepare/set action plans based on \norganizational goals and objectives \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written Test \n• Observation \n2 Hours \n1.3 Identify and \ncommunicate issues \narising in the \nworkplace \n• Lecture and discussion on: \no Organizational policy in dealing with issues \nand problems \n• Read effective verbal communication \nmethods \n• Practice organizing information \n• Perform exercises on understanding and \nconveying intended meaning scenario\n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written Test \n• Observation \n2 Hours \n2. Lead small \nteams \n \n \n \n2.1 Provide team \nleadership \n• Lecture and discussion on: \no Company policies and procedures \n• Identify client expectations \n• Practice team building skills \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours\n\n--- PDF PAGE 65 ---\n__________________________________________________________________________________ 61 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods \nNominal \nDuration\n \n \n \n \n \n \n \n \n \n \n• Perform exercises on communication skills \nrequired for leading teams \n2.2 Assign \nresponsibilities \namong members \n• Lecture and discussion on: \no Team member’s duties and responsibilities \n• Identify client expectations \n• Practice negotiating skills \n• Perform group exercises showing the skills \nand techniques in promoting team building \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n2.3 Set performance \nexpectation for team \nmembers. \n• Lecture and discussion on: \no Team member’s duties and responsibilities \no How performance expectations are set \n• Identify client expectations \n• Perform group exercises in setting individual \ntarget/ expectation \n• Read instruction and requirements in up to \ndate dissemination to members \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Role Play \n• Oral \nevaluation \n• Observation \n• Written \nexamination \n2 Hours \n2.4 Supervise team \nperformance \n• Discuss listening and treating individual team \nmembers concern \n• Identify methods of Monitoring Performance \n• Perform group exercises showing the skills in \nmonitoring team performance \n• Group \ndiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n2 Hours \n3. Develop and \npractice \nnegotiation skills \n \n \n3.1. Plan negotiations \n• Lecture and discussion on: \no codes of practice and guidelines for the \norganization \no differences between content and process \n• Read: \no Organizations policy and procedures for \nnegotiations \no Decision making and conflict resolution \nstrategies procedures \no Strategies to manage conflict \no Steps in negotiating process \n• Identify bargaining information \n•Apply strategies to manage process\n• Group \nDiscussion \n• Lecture \n• Demonstration \n• Oral \nevaluation \n• Written \nexamination \n• Observation \n4 hours\n\n--- PDF PAGE 66 ---\n__________________________________________________________________________________ 62 \nTR – 2D ANIMATION NC III (Version 02) Amended February 27, 2018 \nUnit of \nCompetency \nLearning Outcomes \nLearning Activities \nMethodologies \nAssessment \nMethods \nNominal \nDuration\n• Apply steps in negotiating process \n3.2. Participate in \nnegotiations \n• Discuss/Describe the following strategies \nduring negotiation: \no Decision making and conflict resolution \nstrategies procedures \no Problem solving strategies on how to deal \nwith unexpected questions and attitudes \nduring negotiation \n• Practice the following scenarios in a group \nactivity: \no Perform interpersonal skills to develop \nrapport with other parties \no Perform verbal communication and \nlistening skill \no observation skills \no negotiation skills \n• Describe the Procedure in documenting \nnegotiations \n• Apply a filing system in managing information \n• Demonstrate filing of documents \n \n• Group \nDiscussion \n• Case studies \n• Demonstration \n• Simulation/ Role \nplay \n• Oral \nevaluation \n• Observation \n4 Hours \n4. Solve workplace \nproblem related \nto work activities \n4.1. Identify the problem \n \n• Discussion on Normal operating parameters \n& product quality \n• Identify & clarify the nature of problem \n• Read: \no Brainstorming