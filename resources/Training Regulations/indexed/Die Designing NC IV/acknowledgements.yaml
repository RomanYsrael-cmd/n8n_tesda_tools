    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 2. Foster the habit of critical inquiry and curiosity in the workplace. 2.1 Issues and situations are reflected on and wondered about. 2.2 Issues and problems in the workplace particularly in the policies, procedures and protocols are discussed and evaluated between and among teams. 2.3 Evaluation of efficiency and effectiveness of workplace policies, procedures and protocols are documented, communicated and agreed upon between and among teams. 2.4 Growth mindset and positive relationship and communication is applied in the context of curiosity and critical inquiry in the workplace. 2.1 Different methods of critical and appreciative inquiry and their relevance to different situations. 2.2 Techniques to assist in forming the habit of asking questions and taking responsibility for answers. 2.3 Why questions are important and the benefits of asking good questions for individuals, businesses and communities (the importance of critical thinking). 2.4 Growth mindset and positive communication and relationship strategies and techniques. 2.1 Using range of analytical techniques (e.g., planning, attention, simultaneous and successive processing of information). 2.2 Communicating to actively listen and to ask questions of others in a constructive way. 2.3 Using critical thinking pathway to formulate and ask relevant questions and come up with appropriate answers. 2.4 Performing assimilation and accommodation skills to interpret and distil key information of relevance to a given situation. 2.5 Assessing and measuring the extent of effectiveness and efficiency of the systems, processes and procedures in the workplace. 2.6 Communicating insights on workplace effectiveness and efficiency."
    },
    {
      "source_text": "-- PDF PAGE 21 --- Die Designing NC IV Revision 00 Promulgated 05/21/2019 17"
    },
    {
      "source_text": "ELEMENTS PERFORMANCE CRITERIA Italicized terms are elaborated in the Range of Variables"
    },
    {
      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 3. Develop practical action plans for improving workplace conditions. 3.1 Evaluation of efficiency and effectiveness of workplace policies, procedures and protocols are documented, communicated to stakeholders. 3.2 Practical action plans in improving workplace conditions are formulated, presented and negotiated with stakeholders. 3.3 Proposed changes and directions are inquired, processed and negotiated between and among teams, and stakeholders as well of the organization. 3.4 Commitment to continuous improvement and change is highlighted. 3.5 Passion and dedication for changing and adapting to the demands of the 21st century workplace are considered. 3.1 Different methods of critical and appreciative inquiry and their relevance to different situations. 3.2 Techniques to assist in forming the habit of asking questions and taking responsibility for answers. 3.3 Why questions are important and the benefits of asking good questions for individuals, businesses and communities (the importance of critical thinking). 3.4 Growth mindset and positive communication and relationship strategies and techniques. 3.5 Creative negotiation skills. 3.6 Change management and continuous improvement concepts. 3.1 Using range of analytical techniques (e.g., planning, attention, simultaneous and successive processing of information). 3.2 Communicating to actively listen and to ask questions of others in a constructive way. 3.3 Using critical thinking pathway to formulate and ask relevant questions and come up with appropriate answers. 3.4 Performing assimilation and accommodation skills to interpret and distil key information of relevance to a given situation. 3.5 Assessing and measuring the extent of effectiveness and efficiency of the systems, processes and procedures in the workplace. 3.6 Communicating practical insights on improving workplace conditions."
    },
    {
      "source_text": "-- PDF PAGE 22 --- Die Designing NC IV Revision 00 Promulgated 05/21/2019 18 RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Effectiveness and efficiency May include; 1.1 Developing a more efficient way of doing something 1.2 Developing a new idea 1.3 Developing and improving products and services 1.4 Enhancing skills and career opportunities 1.5 Enhancing the physical environment 1.6 Financial benefit 1.7 Greater personal satisfaction 1.8 Improving interpersonal relationships 1.9 Evaluating overall workplace conditions 2. Curiosity and critical inquiry May include: 2.1 Accuracy 2.2 Breadth 2.3 Clarity 2.4 Depth 2.5 Emotion 2.6 Fairness 2.7 Logic 2.8 Meaning 2.9 Planning 2.10 Attention 2.11 Precision 2.12 Relevance 2.13 Significance 2.14 Social engagement 2.15 Society 2.16 Style 2.17 Growth mindset 2.18 Positive communication 2.19 Positive negotiation 2.20 Workplace conditions 2.21 Appreciative inquiry methods"
    },
    {
