    {
      "source_text": "-- PDF PAGE 19 --- Die Designing NC IV Revision 00 Promulgated 05/21/2019 15 UNIT OF COMPETENCY : PERFORM HIGHER-ORDER THINKING PROCESSES AND APPLY TECHNIQUES IN THE WORKPLACE"
    },
    {
      "source_text": "UNIT CODE : 500311403"
