    },
    {
      "source_text": "The DIE DESIGNING NC IV qualification consists of competencies that the designer must achieve to enable them to perform tasks such as reviewing tools and design, determining the methods to assemble, testing and debugging complete tools whether single hit or progressive."
    },
    {
      "source_text": "This qualification is packaged from the competency map of the Metals and engineering sector as shown in Annex A."
    },
    {
      "source_text": "The units of competency comprising this qualification include the following:"
    },
    {
      "source_text": "CODE NO. COMMON COMPETENCIES MEE722201 MEE722202 MEE722203 MEE722204 MEE722205 MEE722206 MEE722207 MEE722208 MEE722210 MEE722211 ICT311201 Apply safety practices Interpret working drawings and sketches Select/ cut workshop materials Perform shop computations (Basic) Measure workpiece (Basic) Perform routine housekeeping Perform shop computations (Intermediate) Measure workpiece using angular measuring instruments Measure workpiece using gages and surface texture comparator Perform preventive and corrective maintenance Operate a personal computer"
    },
    {
      "source_text": "CODE NO. CORE COMPETENCIES MEE722321 MEE722322 MEE722323 MEE722324 MEE722325"
    },
    {
      "source_text": "Determine die design parameters Perform CAD operation Simulate and verify die design Modify and finalize die design Create fabrication drawing"
    },
