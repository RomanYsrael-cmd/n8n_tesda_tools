      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 1. Evaluate effectiveness and efficiency of the workplace systems, processes and procedures. 1.1 Effectiveness and efficiency of workplace standards and procedures are examined. 1.2. Usage of inquiry and dialogue to communicate evaluation measures and results are implemented. 1.3 Evaluation reports are prepared and communicated to team members."
    },
    {
      "source_text": "1.1 Systems, standards, procedures and protocols in the workplace. 1.2 Different methods of critical and appreciative inquiry and their relevance to different situations 1.3 Techniques to assist in forming the habit of asking questions and taking responsibility for answers. 1.4 Why questions are important and the benefits of asking good questions for individuals, businesses and communities (the importance of critical thinking). 1.1 Using range of analytical techniques (e.g., planning, attention, simultaneous and successive processing of information). 1.2 Communicating to actively listen and to ask questions of others in a constructive way. 1.3 Using critical thinking pathway to formulate and ask relevant questions and come up with appropriate answers. 1.4 Performing assimilation and accommodation skills to interpret and distil key information of relevance to a given situation. 1.5 Assessing and measuring the extent of effectiveness and efficiency of the systems, processes and procedures in the workplace."
    },
