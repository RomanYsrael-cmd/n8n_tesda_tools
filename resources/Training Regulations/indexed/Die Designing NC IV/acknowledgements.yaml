  "source_text": "ACKNOWLEDGEMENTS\n135-136\n\n--- PDF PAGE 5 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n1\nTRAINING REGULATIONS FOR\n\nDIE DESIGNING NC IV\n\nSECTION 1 DIE DESIGNING NC IV\n\nThe DIE DESIGNING NC IV qualification consists of competencies that the\ndesigner must achieve to enable them to perform tasks such as reviewing tools and\ndesign, determining the methods to assemble, testing and debugging complete tools\nwhether single hit or progressive.\n\nThis qualification is packaged from the competency map of the Metals and\nengineering sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nCOMMON COMPETENCIES\nMEE722201\nMEE722202\nMEE722203\nMEE722204\nMEE722205\nMEE722206\nMEE722207\nMEE722208\nMEE722210\nMEE722211\nICT311201\nApply safety practices\nInterpret working drawings and sketches\nSelect/ cut workshop materials\nPerform shop computations (Basic)\nMeasure workpiece (Basic)\nPerform routine housekeeping\nPerform shop computations (Intermediate)\nMeasure workpiece using angular measuring instruments\nMeasure workpiece using gages and surface texture comparator\nPerform preventive and corrective maintenance\nOperate a personal computer\n\nCODE NO.\nCORE COMPETENCIES\nMEE722321\nMEE722322\nMEE722323\nMEE722324\nMEE722325\n\nDetermine die design parameters\nPerform CAD operation\nSimulate and verify die design\nModify and finalize die design\nCreate fabrication drawing\n\nCODE NO.\nBASIC COMPETENCIES\n500311401\nUtilized specialized communication skills\n500311402\nDevelop and lead teams\n500311403\nPerform higher-order thinking processes and apply techniques in the\nworkplace\n500311404\nContribute to the practice of social justice in the workplace\n500311405\nManage innovative work instructions\n500311406\n500311407\n\n500311408\n\n500311409\n\nManage and evaluate usage of information\nLead in improvement of Occupational Safety and Health (OSH) programs,\npolicies and procedures\nLead towards improvement of environment work programs, policies and\nprocedures\nSustain entrepreneurial skills\n\n--- PDF PAGE 6 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n2\nA person who has achieved this qualification is competent to be:\n▪ Die Designer\n\n--- PDF PAGE 7 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n3\nSECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details and contents of the units of competency required in\nDIE DESIGNING NC IV. These units of competency are categorized into basic, common\nand core competencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nUTILIZE SPECIALIZED COMMUNICATION SKILLS\n\nUNIT CODE\n:\n500311401\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto use specialized communication skills to meet specific\nneeds of internal and internal clients, conduct interviews,\nfacilitate discussion with groups, and contribute to the\ndevelopment of communication strategies.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Meet common\nand specific\ncommunication\nneeds of clients\nand colleagues\n1.1 Specific\ncommunication needs\nof clients and\ncolleagues are\nidentified and met\n1.2 Different approaches\nare used to meet\ncommunication needs\nof clients and\ncolleagues\n1.3 Conflict is addressed\npromptly in a manner\nwhich does not\ncompromise the\norganization\n\n1.1 Communication\nprocesses\n1.2 Dynamics of\ngroups and\ndifferent styles\nof group\nleadership\n1.3 Communication\nskills relevant to\nclient groups\n1.4 Flexibility in\ncommunication\n\n1.1 Full range of\ncommunication\ntechniques\nincluding:\n1.1.1 Effective\ncommunication\nprocess\n1.1.2 Active listening\n1.1.3 Giving/ receiving\nfeedback\n1.1.4 Interpretation of\ninformation\n1.1.5 Role boundaries\nsetting\n1.1.6 Negotiation\n1.1.7 Establishing\nempathy\n1.1.8 Conduct seminars\n1.1.9 Public speaking\n1.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n--- PDF PAGE 8 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n4\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n2.1 Strategies for internal\nand external\ndissemination of\ninformation are\ndeveloped, promoted,\nimplemented and\nreviewed as required\n2.2 Channels of\ncommunication are\nestablished and\nreviewed regularly\n2.3 Coaching in effective\ncommunication is\nprovided\n2.4 Work related network\nand relationship are\nmaintained\n2.5 Negotiation and\nconflict resolution\nstrategies are used\nwhere required\n2.6 Communication with\nclients and colleagues is\nperformed appropriate to\nindividual needs and\norganizational objectives\n2.1 Communication\nprocess\n2.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n2.3 Openness and\nflexibility in\ncommunication\n2.4 Communication\nskills relevant to\nclient groups\n\n2.1 Full range of\ncommunication\ntechniques\nincluding:\n2.1.1 Effective\ncommunication\nprocess\n2.1.2 Active listening\n2.1.3 Giving/ receiving\nFeedback\n2.1.4 Interpretation of\ninformation\n2.1.5 Role boundaries\nsetting\n2.1.6 Negotiation\n2.1.7 Establishing\nempathy\n2.1.8 Openness and\nflexibility in\ncommunication\n2.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n3. Deliver a\ntechnical\npresentation\n3.1 Presentation is\ndelivered clearly,\nsequential and\ndelivered within\nallotted time\n3.2 Utilize appropriate\nmedia to enhance\npresentation\n3.3 Differences in\nviews/opinions are\nrespected\n3.4 Questions during fora\nare responded in a\nmanner consistent\nwith organizational\nstandard\n3.1 Communication\nprocess\n3.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n3.3 Openness and\nflexibility in\ncommunication\n3.4 Communication\nskills relevant to\nclient groups\n\n3.1 Full range of\ncommunication\ntechniques\nincluding:\n3.1.1 Effective\ncommunication\nprocess\n3.1.2 Active listening\n3.1.3 Giving/receiving\nfeedback\n3.1.4 Interpretation of\ninformation\n3.1.5 Role boundaries\nsetting\n3.1.6 Negotiation\n3.1.7 Establishing\nempathy\n3.1.8 Openness and\n\n--- PDF PAGE 9 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n5\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n flexibility in\ncommunication\n3.1.9 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n4. Represent the\norganization\n4.1 When participating in\ninternal or external\nforums, presentation\nis relevant,\nappropriately\nresearched and\npresented in a manner\nto promote the\norganization\n4.2 Presentation is clear\nand sequential and\ndelivered within a\npredetermined time\n4.3 Utilize appropriate\nmedia to enhance\npresentation\n4.4 Differences in views\nare respected\n4.5 Written\ncommunication is\nconsistent with\norganizational\nstandards\n4.6 Inquiries are\nresponded in a\nmanner consistent\nwith organizational\nstandard\n4.7 Consolidate ideas\nand suggestions\n4.8 Generalize and\nsummarize all ideas\nand suggestions\n4.1 Communication\nprocess\n4.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n4.3 Openness and\nflexibility in\ncommunication\n4.4 Communication\nskills relevant to\nclient groups\n\n4.1 Full range of\ncommunication\ntechniques\nincluding:\n4.1.1 Effective\ncommunication\nprocess\n4.1.2 Active listening\n4.1.3 Giving/ receiving\nfeedback\n4.1.4 Interpretation of\ninformation\n4.1.5 Role boundaries\nsetting\n4.1.6 Negotiation\n4.1.7 Establishing\nempathy\n4.1.8 Openness and\nflexibility in\ncommunication\n4.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n--- PDF PAGE 10 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n6\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n5. Facilitate group\ndiscussion\n5.1 Mechanisms which\nenhance effective group\ninteraction is defined and\nimplemented\n5.2 Strategies which\nencourage all group\nmembers to participate\nare used routinely\n5.3 Objectives and agenda for\nmeetings and discussions\nare routinely set and\nfollowed\n5.4 Relevant information is\nprovided to group to\nfacilitate outcomes\n5.5 Evaluation of group\ncommunication strategies\nis undertaken to promote\nparticipation of all parties\n5.6 Specific communication\nneeds of individuals are\nidentified and addressed\n5.1 Communication\nprocess\n5.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n5.3 Openness and\nflexibility in\ncommunication\n5.4 Communication\nskills relevant to\nclient groups\n\n5.1 Full range of\ncommunication\ntechniques\nincluding:\n5.1.1 Effective\ncommunication\nprocess\n5.1.2 Active listening\n5.1.3 Giving/receiving\nfeedback\n5.1.4 Interpretation of\ninformation\n5.1.5 Role boundaries\nsetting\n5.1.6 Negotiation\n5.1.7 Establishing\nempathy\n5.1.8 Openness and\nflexibility in\ncommunication\n5.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n6. Conduct\ninterview\n6.1 A range of appropriate\ncommunication strategies\nare employed in interview\nsituations\n6.2 Records of interviews are\nmade and maintained in\naccordance with\norganizational procedures\n6.3 Effective questioning,\nlistening and nonverbal\ncommunication techniques\nare used to ensure that\nrequired message is\ncommunicated\n6.1 Communication\nprocess\n6.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n6.3 Effective\nquestioning\ntechniques\n6.4 Communication\nskills relevant to\nclient groups\n\n6.1 Full range of\ncommunication\ntechniques\nincluding:\n6.1.1 Effective\ncommunication\nprocess\n6.1.2 Active listening\n6.1.3 Giving/ receiving\nfeedback\n6.1.4 Interpretation of\ninformation\n6.1.5 Role boundaries\nsetting\n6.1.6 Negotiation\n6.1.7 Establishing\nempathy\n6.2 Effective clarifying\nand probing\ntechniques\n(questioning skills)\n6.3 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n--- PDF PAGE 11 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies\nMay include:\n1.1 Recognizing own limitations\n1.2 Referral to specialists\n1.3 Utilizing techniques and aids\n1.4 Providing written drafts\n1.5 Verbal and non verbal communication\n2. Effective group\ninteraction\nMay include:\n2.1 Identifying and evaluating what is occurring within an\ninteraction in a non judgmental way\n2.2 Using active listening\n2.3 Making decision about appropriate words, behavior\n2.4 Putting together response which is culturally\nappropriate\n2.5 Expressing an individual perspective\n2.6 Expressing own philosophy, ideology and\nbackground and exploring impact with relevance\nto communication\n2.7 Openness and flexibility in communication\n3. Types of Interview\nMay include:\n3.1 Related to staff issues\n3.2 Routine\n3.3 Confidential\n3.4 Evidential\n3.5 Non disclosure\n3.6 Disclosure\n4. Interview situations\nMay include:\n4.1 Establish rapport\n4.2 Elicit facts and information\n4.3 Facilitate resolution of issues\n4.4 Develop action plans\n4.5 Diffuse potentially difficult situation\n\n--- PDF PAGE 12 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n8\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated effective communication skills with\nclients accessing service and work colleagues\n1.2 Adopted relevant communication techniques and\nstrategies to meet client particular needs and difficulties\n2. Resource Implications\n2.1 Access to appropriate workplace where assessment can\ntake place\n\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Case Study\n3.2 Interview\n3.3 Portfolio\n3.4 Written Test\n3.5 Role Play\n\n4. Context for Assessment\n4.1 This unit should be assessed on the job through\nsimulation\n\n--- PDF PAGE 13 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n9\nUNIT OF COMPETENCY :\nDEVELOP AND LEAD TEAMS\n\nUNIT CODE\n:\n500311402\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required\nto determine individual and team development needs and\nfacilitate the development of the workgroup.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Foster\nIndividual\ngrowth\n1.1 Learning and\ndevelopment needs\nof team members are\nsystematically\nidentified in line with\norganizational\nrequirements\n1.2 Development plan to\nmeet individual needs\nis collaboratively\ndeveloped and\nimplemented\n1.3 Individuals are\nencouraged to self -\nevaluate performance\nand identify areas for\nimprovement\n1.4 Feedback on\nperformance of team\nmembers is collected\nfrom relevant sources\nand compared with\nestablished team\nlearning process\n1.1 Effective\nworkplace\ncommunication,\ncoaching and\nmentoring\nprinciples\n1.2 Feedback\nprinciples and\nprocedures\n1.3 Working\ninterdependently:\nstrategies and\ntechniques\n1.4 Leadership\nConcepts:\n• Types of\nDecisions\nTeams Make\n• Team\nResponsibilities\n• Problems That\nAffect Teams\n• Building Strong\nTeam\nCommunication\n• Expressing\nYourself on a\nTeam\n• Team Problem\nSolving\n\n1.1 Ability to read and\nunderstand a variety of\ntexts, prepare general\ninformation and\ndocuments according to\ntarget audience; spell\nwith accuracy; use\ngrammar and\npunctuation effective\nrelationships and\nconflict management\n1.2 Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n1.3 Communication skills\nincluding receiving\nfeedback and reporting,\nmaintaining effective\nrelationships and\nconflict management\n1.4 Ability to relate to\npeople from a range of\nsocial, cultural, physical\nand mental\nbackgrounds\n1.5 Planning skills to\norganize required\nresources and\nequipment to meet\nlearning needs\n1.6 Reporting skills to\norganize information;\nassess information for\nrelevance and accuracy;\nidentify and elaborate\non learning outcomes\n1.7 Facilitation skills to\nconduct small group\ntraining sessions\n\n--- PDF PAGE 14 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n10\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Foster\nindividual and\nteam growth\n2.1. Learning and\ndevelopment program\ngoals and objectives\nare identified to match\nthe specific\nknowledge and skills\nrequirements of\ncompetency\nstandards\n2.2. Learning delivery\nmethods are\nappropriate to the\nlearning goals, the\nlearning style of\nparticipants and\navailability of\nequipment and\nresources\n2.3. Workplace learning\nopportunities and\ncoaching/ mentoring\nassistance are\nprovided to facilitate\nindividual and team\nachievement of\ncompetencies\n2.4. Resources and\ntimelines required for\nlearning activities are\nidentified and\napproved in\naccordance with\norganizational\nrequirements\n2.1 Advanced\ncoaching and\nmentoring\ntechniques\n2.2 Performance\nevaluation\nconcepts\n2.3 Training and\ndevelopment\ntechniques\n\n2.1 Instructional\nplanning and\ndelivery skills\n2.2 Monitoring and\nevaluation skills\n2.3 Mentoring and\ncoaching skills\n\n--- PDF PAGE 15 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n11\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Monitor and\nevaluate\nworkplace\nlearning\n3.1 Feedback from\nindividuals or teams is\nused to identify and\nimplement\nimprovements in\nfuture learning\narrangements\n3.2 Outcomes and\nperformance of\nindividuals/teams are\nassessed and\nrecorded to determine\nthe effectiveness of\ndevelopment\nprograms and the\nextent of additional\nsupport\n3.3 Modifications to\nlearning plans are\nnegotiated to improve\nthe efficiency and\neffectiveness of\nlearning\n3.4 Records and reports of\ncompetency are\nmaintained within\norganizational\nrequirement\n3.1 Types and levels\nof learning\nevaluation\n3.2 Learning styles\nand strategies\n3.3 Training and\ndevelopment\napproaches\n\n3.1 Instructional\nplanning and\ndelivery skills\n3.2 Monitoring and\nevaluation skills\n3.3 Mentoring and\ncoaching skills\n\n--- PDF PAGE 16 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n12\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Develop team\ncommitment\nand\ncooperation\n4.1 Open communication\nprocesses to obtain\nand share information\nis used by team\n4.2 Decisions are\nreached by the team\nin accordance with its\nagreed roles and\nresponsibilities\n4.3 Mutual concern and\ncamaraderie are\ndeveloped in the team\n4.4 Career planning for\neach member are\nmonitored\n4.1 Career\ndevelopment for\ngroup members\n4.2 Principles of\nteam commitment\nand cooperation\n4.3 Team dynamics\nand performance\n4.1 Instructional\nplanning and\ndelivery skills\n4.2 Monitoring and\nevaluation skills\n4.3 Mentoring and\ncoaching skills\n5. Facilitate\naccomplishment\nof team goals\n5.1 Team members\nactively participated\nin team activities and\ncommunication\nprocesses\n5.2 Teams members\ndeveloped individual\nand joint\nresponsibility for their\nactions\n5.3 Collaborative efforts\nare sustained to\nattain organizational\ngoals\n5.1 Group\nDevelopment\nProcess and\nPrinciples as\napplied in the\nworkplace\n5.2 Principles of\norganizational\ndevelopment\n5.3 Collaboration\nprinciples and\nprocedures\n\