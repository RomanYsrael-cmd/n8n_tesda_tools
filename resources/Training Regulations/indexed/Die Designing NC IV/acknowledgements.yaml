d terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Enhance\none’s\nbusiness\nskills\n1.1 Entrepreneurial skills\ndevelopment needs are\nidentified and\nresponded to promptly.\n1.2 Market trends are\nmonitored, anticipated\nand taken advantage of\nwhere feasible.\n1.3 New technologies,\nproducts and processes\nare included/utilized\nwhere advantageous to\nthe enterprise.\n1.4 Constant\ndialog/linkages with\nother\nentrepreneurs/peers\nand stakeholders are\nmaintained\n1.5 Circulation and\nparticipation in\nbusiness fora,\nmeetings, conventions\nand exhibits are\nmaintained.\n1.1 Business models\nand strategies\n1.2 Types and\ncategories of\nbusinesses\n1.3 Business internal\ncontrols\n1.4 Market Trends\n1.5 Relevant national\nand local\nlegislation and\nregulations\n1.6 Basic quality\ncontrol and\nassurance\nconcepts\n\n1.1 Basic bookkeeping/\naccounting skills\n1.2 Communication\nskills\n1.3 Building relations\nwith customer and\nemployees\n1.4 Building competitive\nadvantage of the\nenterprise\n1.5 Networking and\nLinkaging skills\n\n--- PDF PAGE 45 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n41\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Manage\nentrepreneurial\npractices\n2.1 Ideas and comments\nfor improvements are\nsought from workers\nand clients.\n2.2 Staff/workers are\nencouraged and\nsupported in their skills\ndevelopment and\nenhancement.\n2.3 A culture of\ncontinuous\nimprovement is\nfostered within the\nenterprise.\n2.4 Innovations on the\nexisting lines of\nproducts and services\nare encouraged\n\n2.1 Public relations\nconcepts\n2.2 Basic product\npromotion\nstrategies\n2.3 Basic market and\nfeasibility studies\n2.4 Basic business\nethics\n2.1 Building customer\nrelations\n2.2 Individual marketing\nskills\n2.3 Using basic\nadvertising (posters/\ntarpaulins, flyers,\nsocial media, etc.)\n3. Exp