structively\n1.3. Facilitated participation of individuals in the work of the team\n1.4. Negotiated learning plans to improve the effectiveness of learning\n1.5. Prepared learning plans to match skill needs\n1.6. Accessed and designated learning opportunities\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2.\nMaterials relevant to the proposed activity or tasks\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation of work activities of the individual member in relation\nto the work activities of the group\n3.2. Observation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3. Case studies and scenarios as a basis for discussion of issues\nand strategies in teamwork\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a simulated\nworkplace setting\n4.2. Assessment shall be observed while tasks are being undertaken\nwhether individually or in-group\n\n--- PDF PAGE 19 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n15\nUNIT OF COMPETENCY :\nPERFORM HIGHER-ORDER THINKING PROCESSES\nAND APPLY TECHNIQUES IN THE WORKPLACE\n\nUNIT CODE\n: 500311403\n\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes required\n\nto use fundamental critical thinking skills in the workplace.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Evaluate\neffectiveness\nand efficiency\nof the\nworkplace\nsystems,\nprocesses and\nprocedures.\n1.1 Effectiveness and\nefficiency of\nworkplace standards\nand procedures are\nexamined.\n1.2. Usage of inquiry and\ndialogue to\ncommunicate\nevaluation measures\nand results are\nimplemented.\n1.3 Evaluation reports are\nprepared and\ncommunicated to team\nmembers.\n\n1.1 Systems,\nstandards,\nprocedures and\nprotocols in the\nworkplace.\n1.2 Different methods\nof critical and\nappreciative\ninquiry and their\nrelevance to\ndifferent\nsituations\n1.3 Techniques to\nassist in forming\nthe habit of\nasking questions\nand taking\nresponsibility for\nanswers.\n1.4 Why questions\nare important and\nthe benefits of\nasking good\nquestions for\nindividuals,\nbusinesses and\ncommunities (the\nimportance of\ncritical thinking).\n1.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning, attention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n1.2 Communicating to\nactively listen and\nto ask questions of\nothers in a\nconstructive way.\n1.3 Using critical\nthinking pathway to\nformulate and ask\nrelevant questions\nand come up with\nappropriate\nanswers.\n1.4 Performing\nassimilation and\naccommodation\nskills to interpret\nand distil key\ninformation of\nrelevance to a\ngiven situation.\n1.5 Assessing and\nmeasuring the\nextent of\neffectiveness and\nefficiency of the\nsystems, processes\nand procedures in\nthe workplace.\n\n--- PDF PAGE 20 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n16\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Foster the\nhabit of critical\ninquiry and\ncuriosity in the\nworkplace.\n2.1 Issues and situations\nare reflected on and\nwondered about.\n2.2 Issues and problems\nin the workplace\nparticularly in the\npolicies, procedures\nand protocols are\ndiscussed and\nevaluated between\nand among teams.\n2.3 Evaluation of\nefficiency and\neffectiveness of\nworkplace policies,\nprocedures and\nprotocols are\ndocumented,\ncommunicated and\nagreed upon between\nand among teams.\n2.4 Growth mindset and\npositive relationship\nand communication is\napplied in the context\nof curiosity and\ncritical inquiry in the\nworkplace.\n2.1 Different methods\nof critical and\nappreciative\ninquiry and their\nrelevance to\ndifferent\nsituations.\n2.2 Techniques to\nassist in forming\nthe habit of\nasking questions\nand taking\nresponsibility for\nanswers.\n2.3 Why questions\nare important and\nthe benefits of\nasking good\nquestions for\nindividuals,\nbusinesses and\ncommunities (the\nimportance of\ncritical thinking).\n2.4 Growth mindset\nand positive\ncommunication\nand relationship\nstrategies and\ntechniques.\n2.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning, attention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n2.2 Communicating to\nactively listen and to\nask questions of\nothers in a\nconstructive way.\n2.3 Using critical\nthinking pathway to\nformulate and ask\nrelevant questions\nand come up with\nappropriate\nanswers.\n2.4 Performing\nassimilation and\naccommodation\nskills to interpret and\ndistil key information\nof relevance to a\ngiven situation.\n2.5 Assessing and\nmeasuring the\nextent of\neffectiveness and\nefficiency of the\nsystems, processes\nand procedures in\nthe workplace.\n2.6 Communicating\ninsights on\nworkplace\neffectiveness and\nefficiency.\n\n--- PDF PAGE 21 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n17\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Develop\npractical\naction plans\nfor improving\nworkplace\nconditions.\n3.1 Evaluation of efficiency\nand effectiveness of\nworkplace policies,\nprocedures and\nprotocols are\ndocumented,\ncommunicated to\nstakeholders.\n3.2 Practical action plans\nin improving workplace\nconditions are\nformulated, presented\nand negotiated with\nstakeholders.\n3.3 Proposed changes and\ndirections are inquired,\nprocessed and\nnegotiated between\nand among teams, and\nstakeholders as well of\nthe organization.\n3.4 Commitment to\ncontinuous\nimprovement and\nchange is highlighted.\n3.5 Passion and dedication\nfor changing and\nadapting to the\ndemands of the 21st\ncentury workplace are\nconsidered.\n3.1 Different methods\nof critical and\nappreciative\ninquiry and their\nrelevance to\ndifferent\nsituations.\n3.2 Techniques to\nassist in forming\nthe habit of\nasking questions\nand taking\nresponsibility for\nanswers.\n3.3 Why questions\nare important and\nthe benefits of\nasking good\nquestions for\nindividuals,\nbusinesses and\ncommunities (the\nimportance of\ncritical thinking).\n3.4 Growth mindset\nand positive\ncommunication\nand relationship\nstrategies and\ntechniques.\n3.5 Creative\nnegotiation skills.\n3.6 Change\nmanagement and\ncontinuous\nimprovement\nconcepts.\n3.1 Using range of\nanalytical techniques\n(e.g., planning,\nattention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n3.2 Communicating to\nactively listen and to\nask questions of\nothers in a\nconstructive way.\n3.3 Using critical thinking\npathway to formulate\nand ask relevant\nquestions and come\nup with appropriate\nanswers.\n3.4 Performing\nassimilation and\naccommodation\nskills to interpret and\ndistil key information\nof relevance to a\ngiven situation.\n3.5 Assessing and\nmeasuring the extent\nof effectiveness and\nefficiency of the\nsystems, processes\nand procedures in\nthe workplace.\n3.6 Communicating\npractical insights on\nimproving workplace\nconditions.\n\n--- PDF PAGE 22 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Effectiveness and\nefficiency\nMay include;\n1.1 Developing a more efficient way of doing something\n1.2 Developing a new idea\n1.3 Developing and improving products and services\n1.4 Enhancing skills and career opportunities\n1.5 Enhancing the physical environment\n1.6 Financial benefit\n1.7 Greater personal satisfaction\n1.8 Improving interpersonal relationships\n1.9 Evaluating overall workplace conditions\n2. Curiosity and critical\ninquiry\nMay include:\n2.1\nAccuracy\n2.2\nBreadth\n2.3\nClarity\n2.4\nDepth\n2.5\nEmotion\n2.6\nFairness\n2.7\nLogic\n2.8\nMeaning\n2.9\nPlanning\n2.10 Attention\n2.11 Precision\n2.12 Relevance\n2.13 Significance\n2.14 Social engagement\n2.15 Society\n2.16 Style\n2.17 Growth mindset\n2.18 Positive communication\n2.19 Positive negotiation\n2.20 Workplace conditions\n2.21 Appreciative inquiry methods\n\n--- PDF PAGE 23 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n19\nVARIABLE\nRANGE\n3. Practical action plans\nMay include:\n3.1 Insights on continuous improvement\n3.2 Creative strategies and techniques for becoming better\nat work and real life\n3.3 Career plans\n3.4 Challenging workplace policies, procedures and\nprotocols\n3.5 Specifying plans for change and adapting to the\ndemands of the contemporary workforce\n3.6 Challenges in negotiating with stakeholders and teams\n3.7 Change management, innovation and knowledge\ncreation\n3.8 Contractual agreements\n3.9 Extreme time pressure or non-negotiable deadlines\n3.10 Financial limitations\n3.11 Procedures determined by laws or other regulations\n3.12 Safety issues\n3.13 When others are totally closed to new ideas\n3.14 acknowledging shared responsibility\n3.15 adopting a positive 'can do' attitude\n3.16 following up on practical details\n3.17 pro-actively seeking information\n3.18 suggesting a new approach\n3.19 talking to others about possible answers\n3.20 constraints of the broader context and environment\n3.21 overall goal - what needs to be achieved\n3.22 personal hopes and expectations\n\n--- PDF PAGE 24 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n20\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nEvaluated the effectiveness and efficiency of workplace\nsystems, processes and procedures.\n1.2\nModelled the conscious process of critical inquiry to get new\ninsights that s/he can get in formulating action plans on\ncontinuous improvement in the workplace and real-life\n1.3\nPracticed the habit of critical inquiry and curiosity in the\nworkplace\n1.4\nShown a thorough knowledge and understanding of how\ncritical thinking impacts on individual lives, the broader\ncommunity and work situations.\n1.5\nDeveloped practical action plans for improving workplace\nconditions.\n2. Resource\nImplications\n2.1.\nInteractions with specific challenges and situations to\ndemonstrate the application of critical thinking (this would\nusually involve interactions with others).\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDirect questioning combined with review of portfolios of\nevidence and third-party workplace reports of on-the-job\nperformance by the candidate\n3.2\nEvaluation of a candidate blog exploring different ideas and\nquestions\n3.3\nReview of candidate response to scenarios that allow the\ncandidate to apply critical thinking techniques to a life or work\nsituation, and to demonstrate ability to portray curiosity and\nexploration of new concepts\n3.4\nEvaluation of candidate response to the challenge of\nadopting different perspectives on a situation, and ability to\nboth develop and respond to questions from those\nperspectives\n3.5\nObservation of the candidate participating in a group\nproblem-solving session\n3.6\nOral or written questioning to assess knowledge of typical\nblockers to the critical thinking process.\n3.7\nLife Narrative Inquiry to reflect life stories that reflect how\ncritical thinking and problem solving is applied in the lives.\n4. Context for\nAssessment\n4.1.\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 25 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n21\nUNIT OF COMPETENCY : CONTRIBUTE TO THE PRACTICE OF SOCIAL\nJUSTICE IN THE WORKPLACE\n\nUNIT CODE\n: 500311404\n\nUNIT DESCRIPTOR\n: This unit covers ways and means to assume active roles in\nresolving local and global challenges and to become\nproactive contributors to a more peaceful and sustainable\nworld.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Update self\non local,\nnational and\nglobal\ntrends/\nissues in the\nworkplace\n1.1 Media are regularly\nscanned/ monitored\nfor trends and issues\nrelevant to human\nrights, gender equality,\npromotion of culture of\npeace and non-\nviolence, global\ncitizenship and\nappreciation of cultural\ndiversity.\n1.2 Knowledge and\nunderstanding of local,\nnational and global\nissues and their\ninterconnectedness and\ninterdependency are\nacquired.\n1.3 Notable issues and\ntrends are critically\nexamined and\ndiscussed with peers,\ncolleagues, or family\nmembers.\n1.1 Local, national\nand global\nsystems and\nstructures\n1.2 Issues affecting\ninteraction and\nconnectedness of\ncommunities at\nlocal, national\nand global levels\n1.3 Underlying\nassumptions and\npower dynamics\n(politics,\nunderstanding\npolitical system,\nsocial structures,\nlabor laws, labor\nrelations, human\nright)\n\n1.1 Monitoring trends\nand issues\nrelevant to human\nrights, gender\nequality, culture of\npeace, global\ncitizenship, and\ncultural diversity\nusing different\nmedia platforms\n1.2 Analyzing trends\nand issues\nrelevant to human\nrights, gender\nequality, culture of\npeace, global\ncitizenship, and\ncultural diversity\n1.3 Engaging in\ndiscourse about\nthe local, national\nand global issues\n\n--- PDF PAGE 26 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n22\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Relate local\nand global\ntrends to\nworkplace\ncontext\n2.1 Local events are\nreflected on for\nimplications in one’s\nown situation and in the\nexternal global\nenvironment.\n2.2 Sense of belonging to a\ncommon humanity,\nsharing values and\nresponsibilities are\ndeveloped.\n2.3 Attitudes of empathy,\nsolidarity and respect\nfor differences and\ndiversity are\nstrengthened.\n2.1 Different levels of\nhuman identity\naccording to\nAmber Mayer\n(2015)\n2.2 Different\ncommunities\npeople belong to\nand how these\nare connected\n2.3 Difference and\nrespect for\ncultural diversity\n2.1 Recognizing\ndifferences and\ncommonalities\namong people\n2.2 Strengthening\nattitudes of\nempathy, solidarity\nand respect for\ndiversity\n2.3 Connecting local\nissues to global\ntrends, and vice\nversa.\n3. Engage and\ntake actions\non workplace\nissues and\nconcerns\n3.1 Effective and\nresponsible actions at\nlocal, national and\nglobal levels are\nidentified.\n3.2 Motivation and\nwillingness to take\nnecessary actions are\ndeveloped.\n3.3 Attitude of “thinking\nglobally and acting\nlocally” is practiced.\n3.1 Actions that can\nbe taken\nindividually and\ncollectively\n3.2 Ethically\nresponsible\nbehaviour\n3.3 Importance and\nbenefits of civic\nengagement\n3.4 Strategies and\ntechniques of\n“thinking globally\nand acting\nlocally\n3.1 Employing\nappropriate actions\nto address\nworkplace issues\ninvolving national\nand global trends\n3.2 Showing concern\nand willingness to\ntake part in the\ndevelopment\nefforts to discuss\nworkplace issues\nand concerns\n3.3 Applying the\nattitude of “thinking\nglobally and acting\nlocally” in the\nworkplace\n\n--- PDF PAGE 27 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n23\n RANGE OF VARIABLES\n\n EVIDENCE GUIDE\n\nVARIABLE\nRANGE\n1. Media\nMay include:\n1.1\nPrint media\n1.2\nBroadcast media\n1.3\nInternet and social media\n2. Scanning/Monitoring\nMay include:\n2.1\nSourcing from key informants\n2.2\nConversation with clients\n2.3\nMan-on-the-street conversation\n2.4\nScanning print and broadcast media\n3. Local, national and\nglobal issues\n\nMay include:\n3.1\nPoverty\n3.2\nUnemployment\n3.3\nGlobal warming\n3.4\nSafety, security, and well-being\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability and attitude to keep oneself\nupdated of relevant issues/trends\n1.2 Demonstrated ability to think and act based on one’s\nprinciples and values\n1.3 Demonstrated a holistic/global outlook on internal and\nexternal events in the workplace\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Access to workplace and resources\n2.2 Case studies\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration or simulation with oral questioning\n3.2\nCase problems involving global and local issues\n3.3\nThird-party report\n4. Context for\nAssessment\n4.1\nCompetency assessment may occur in workplace or\nany appropriately simulated environment\n\n--- PDF PAGE 28 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n24\nUNIT OF COMPETENCY\n: MANAGE INNOVATIVE WORK INSTRUCTIONS\n\nUNIT CODE\n: 500311405\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\n\n to sustain and develop a workplace environment in which\n\nimprovement, innovation and learning are promoted and\n\nreinforced.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Review and\nanalyze existing\nworkplace\npractices\n1.1 Current instructions\nand strategies to\nperform tasks in the\nworkplace are\nreviewed\n1.2 Climate for\ninnovation at the\norganizational level\nis defined\n1.3 Innovation drivers in\nthe workplace are\nidentified\n1.1. Four drivers of\ninnovation\naccording to\nGallup\nManagement\nJournal (2007)\n1.2. Contextual\nvariables\nrelated to\ninnovative\npractices in the\norganization\n1.3. The nine\ndimensions of\ninnovation\nclimate (Isaksen\n& Isaksen,\n2018)\n1.4. Types of\nInnovation\nidentified by\nGopalakrishnan\nand Damanpour\n(1997)\n1.1 Investigating the\norganizational\nneeds in the\ninnovation process\n1.2 Defining current\norganizational\ninnovative\npractices\n1.3 Linking innovation\nto contextual\nvariables in the\norganization\n\n--- PDF PAGE 29 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n25\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Examine\nopportunities\nfor continuous\nimprovement\nand innovation\nof practices in\nthe workplace\n2.1. Effectiveness of\ninnovative practices in\nthe workplace is\ndetermined\n2.2. Innovative behaviors\nof leaders or managers\nin the organization are\nassessed\n2.3. Driving principles of\ninnovation are\ndiscussed\n2.1 Determinants of\ninnovative\nbehavior by\nScott and Bruce\n(1992)\n2.2 Four principles of\ninnovation\naccording to\nGallup\nManagement\nJournal (2007)\n\n2.1 Evaluating\norganizational\ninnovative\npractices\n2.2 Gauging innovative\nbehaviors of the\nleaders and\nmanagers in the\norganization\n2.3 Deliberating\nopportunities and\nchallenges in\nimplementing\ninnovation\n3. Implement\ninnovative\nways in the\nconduct of\nusual\nworkplace\npractices\n3.1. Innovative behaviors in\nthe workplace are\nperformed\n3.2. Innovative climate in the\nworkplace is maintained\n3.3. Adoption or modification\nof new ideas relevant to\nthe organizational needs\nis achieved\n3.1 Determinants of\ninnovative\nbehavior by\nScott and Bruce\n(1992)\n3.2 The nine\ndimensions of\ninnovation\nclimate (Isaksen\n& Isaksen, 2018)\n3.3 Techniques in\nimplementing\ninnovative\nchange in the\nworkplace\n\n3.1 Developing risk\nmanagement\ntechniques and\ncontrol systems\n3.2 Evaluating impact\nof changes and\ndeveloping action\nplans\n3.3 Demonstrating\nstrategies and\ntechniques in\nmanaging changes\nin the workplace\n\n--- PDF PAGE 30 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n26\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Innovation\nMay include:\n1.1 Products versus processes\n1.2 Radical versus incremental\n1.3. Technical versus administrative\n2. Innovative behaviors\nMay include:\n2.1 