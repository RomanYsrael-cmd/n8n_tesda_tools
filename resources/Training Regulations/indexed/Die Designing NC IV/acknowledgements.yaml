Revision 00 Promulgated (05/21/2019)\n\n129\n\nApply safety practices\nInterpret working drawings\nand sketches\nSelect/ cut workshop\nmaterials\nPerform shop computations\n(Basic)\nMeasure workpiece (Basic)\nPerform routine\nhousekeeping\n\nPerform shop computations\n(Intermediate)\nMeasure workpiece using\nangular measuring\ninstruments\nPerform shop computations\n(Advanced)\nMeasure workpiece using\ngages and surface texture\ncomparator\nPerform preventive and\ncorrective maintenance\nOperate a personal\ncomputer\nSelect and cut workshop\nmaterials\nPrepare cost estimates\nApply Safety Practices\nInterpret Drawings and\nSketches\nPerform Industry Calculations\nContribute to Quality System\nUse Hand Tools\nPrepare Weld Materials\nSetup Welding Equipment\nFit up Weld Materials\nRepair Welds\nPerform shop computations\n(Intermediate)\nMeasure workpiece\n(Intermediate)\nPerform preventive and\ncorrective Maintenance\n\nCOMMON COMPETENCIES\n\n--- PDF PAGE 134 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n130\n\nCreate drawing using CAD\nsoftware\nApply CAD/CAM program\nWrite basic CNC lathe\nmachine program\nSet-up CNC lathe machine,\nworkpiece and cutting tools\nPerform basic CNC lathe\nmachine operations\nWrite advanced CNC lathe\nmachine program\nSet-up multiple-axis CNC\nlathe machine, workpiece and\ncutting tools\nPerform advanced CNC lathe\nmachine operations\nWrite basic CNC milling\nmachine program\nSet-up CNC milling machine,\nworkpiece and cutting tools\nPerform basic CNC milling\nmachine operations\nWrite advanced CNC milling\nmachine program\nSet-up multiple-axis CNC\nmilling machine, workpiece and\ncutting tools\nPerform advanced CNC\nmilling machine operations\nWeld Carbon Steel Plates\nUsing FCAW\nWeld Carbon Steel Pipes\nUsing FCAW\nWeld Alloy Steel Plates Using\nFCAW\nWeld Alloy Steel Pipes Using\nFCAW\nPerform Gas Welding in\nCarbon Steel Plates and\nTubes\nPerform Gas Welding in Alloy\nSteel Plates and Tubes\nWeld Carbon Steel Plates\nUsing GMAW\n\nWeld Carbon Steel Pipes\nUsing GMAW\nWeld Alloy Steel Plates Using\nGMAW\nWeld Alloy Steel Pipes Using\nGMAW\nWeld Carbon Steel Plates\nUsing GTAW\nWeld Carbon Steel Pipes\nUsing GTAW\nWeld Alloy Steel Plates Using\nGTAW\nWeld Alloy Steel Pipes Using\nGTAW\nPerform bench work (Basic)\nTurn workpiece\nMill workpiece\nGrind workpiece\nShape workpiece\nRepair workpiece\nPerform bench work (Basic)\nPerform bench work\n(Complex)\nTurn workpiece (Basic)\nTurn workpiece\n(Intermediate)\nMill workpiece (Basic)\nMill workpiece (Intermediate)\n\nCORE COMPETENCIES\n\n--- PDF PAGE 135 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n131\n\nGrind workpiece (Basic)\nGrind workpiece (Complex)\nTurn workpiece (Advanced)\nMill workpiece (Advanced)\nPrepare basic engineering\ndrafting\nPerform basic engineering\ndetail drafting\nPerform Preventive\nMaintenance\nPerform Planned and\nUnplanned (Emergency)\nMaintenance\nFabricate Simple Items\nInstall Machinery\n Perform press machine\nsetting\n Perform mechanical press\noperation\nWeld Plates Using SAW\nWeld Pipes Using SAW\nWeld Carbon Steel Plates\nUsing SMAW\nWeld Carbon Steel Plates\nand Pipes Using SMAW\nWeld Alloy Steel Plates Using\nSMAW\nWeld Alloy Steel Pipes Using\nSMAW\nMachine Die Components\nFit and Assemble Dies\nTest and Try Die\nMachine mold components\n\nImplement surface finishing\n\nFit and assemble mold\n\nRectify mold flaws\nDetermine die design\nparameters\nPerform CAD operation\nSimulate and verify die\ndesign\nModify and finalize die\ndesign\nCreate fabrication drawing\n\n--- PDF PAGE 136 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n132\n\nGLOSSARY OF TERMS\n\n1. Assembly\nDrawing\n\nAre used to show the position and functional relationship of parts\nin an assembly.\n2. CAD (computer-\naided design)\n\nRefers to the software used to create precision drawings or\ntechnical illustrations and can be used to create two-dimensional\n(2-D) drawings or three-dimensional (3-D) models.\n\n3. Compound Die\nA die in which two cutting operations are accomplished in\none press stroke. The most common type of compound die\nblanks and pierces a part.\n\n4. Combination Die\n\nA die in which a cutting operation and a noncutting operation\non a part are accomplished in one stroke of the press. The\nmost common type of combination die blanks and draws a\npart.\n\n5. Dimensions\n\nRefers to the collective process of modeling, defining and\ndescribing geometric sizes and feature relationships, and\nproviding all of the required technical information necessary to\nproduce and inspect the part.\n\n6. Die\n\nRefers to any various tools or devices for imparting a\ndesired shape, form, or finish to a material.\n\n7. Extrusion Die\n\nA die in which a punch forces metal to plastically flow through a\ndie orifice so that the metal assumes the contour and cross-\nsectional area of the orifice.\n\n8. Machine\n\nRefers to an equipment used for the manufacturing of formed\nproducts.\n\n9. Material\n\nRefers to the substance or substances of which the product is\nmade of composed.\n\n10. Part Drawing\n\nDetail drawing completely described a single parts with multiple\northographic projections.\n\n11. Process\n\nRefers to a continuous action or operation taking place in a\ndefinite manner.\n\n12. Product\n\nRefers to the outcome produced during forming process.\n\n13. shut height\nThe distance from the finished top face of the upper shoe to the\nfinished bottom face of the lower shoe, immediately after the die\noperation and with the work in the die.\n\n--- PDF PAGE 137 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n133\n\n14. Simulation\n\nRefers to the representation of the behavior or characteristics of\nthe product through the use of software.\n\n15. Specification\n\nRefers to a detailed description or assessment of requirements.\n\n16. Tolerance\n\nRefers to the range of permissible size\n\n17. Toolbars\n\nRefers to horizontal row or vertical column of selectable buttons\ndisplayed on a computer screen, allowing the user to select a\nvariety of functions.\n\n--- PDF PAGE 138 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n134\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nDie Designing NC IV\nQualification Code:\nMEEDID419\n\nRevision\nNo.\nDocument\nTypes*\nQualification Title\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA Circular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nDie Designing NC IV\n2019-033 /\n05-21-2019\n\nLegend: *Description Types\n- Document Created\n\n--- PDF PAGE 139 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n135\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who donated their time and expertise to the development and validation of\nthese Training Regulations.\n\nTECHNICAL EXPERTS / TESDA EXPERTS PANEL\n\nFRED P. LIZA\nIndustry Expert\nChief, Prototyping Division\nDOST-MIRDC\nBicutan, Taguig City\nDANILO N. PILAR\nIndustry Expert\nChief,\nDOST-MIRDC\nBicutan, Taguig City\nROMANICO F. SALIDO\nIndustry Expert\nProject Consultant\nDOST-MIRDC\nBicutan, Taguig City\nREYNALDO DELA CRUZ\nIndustry Expert\nSupervising SRS,\nDOST-MIRDC\nBicutan, Taguig City\nGHARRY M. BATHAN\nIndustry Expert\nSr. SRS\nDOST-MIRDC\nBicutan, Taguig City\nVIRGILIO LANZUELA\nIndustry Expert\nBoard of Trustee-Secretary\nPDMA, Inc.\nChairperson\nRollmaster Machinery and Industrial\nServices, Corporation.\nThe Management and Staff of the Philippine Die and Mold Association Inc. (PDMA)\n\nThe PARTICIPANTS in the Validation of this Training Regulations\n\n• Aichi Forging Co. of Asia, Inc.\n Sta. Rosa, Laguna\n\n• MFI Technological Institute Inc.\n Pasig City\n\n• SMC Yamamura Fuso Molds Corp.\n Cavite City\n\n• Top Choice Training Inst. & Assessment Center,