      "source_text": "GLOSSARY OF TERMS"
    },
    {
      "source_text": "1. Assembly Drawing"
    },
    {
      "source_text": "Are used to show the position and functional relationship of parts in an assembly. 2. CAD (computer- aided design)"
    },
    {
      "source_text": "Refers to the software used to create precision drawings or technical illustrations and can be used to create two-dimensional (2-D) drawings or three-dimensional (3-D) models."
    },
    {
      "source_text": "3. Compound Die A die in which two cutting operations are accomplished in one press stroke. The most common type of compound die blanks and pierces a part."
    },
    {
      "source_text": "4. Combination Die"
    },
    {
      "source_text": "A die in which a cutting operation and a noncutting operation on a part are accomplished in one stroke of the press. The most common type of combination die blanks and draws a part."
    },
    {
      "source_text": "5. Dimensions"
    },
    {
      "source_text": "Refers to the collective process of modeling, defining and describing geometric sizes and feature relationships, and providing all of the required technical information necessary to produce and inspect the part."
    },
    {
      "source_text": "6. Die"
    },
    {
      "source_text": "Refers to any various tools or devices for imparting a desired shape, form, or finish to a material."
    },
    {
      "source_text": "7. Extrusion Die"
    },
    {
      "source_text": "A die in which a punch forces metal to plastically flow through a die orifice so that the metal assumes the contour and cross- sectional area of the orifice."
    },
    {
      "source_text": "8. Machine"
    },
    {
      "source_text": "Refers to an equipment used for the manufacturing of formed products."
    },
    {
      "source_text": "9. Material"
    },
    {
      "source_text": "Refers to the substance or substances of which the product is made of composed."
    },
    {
      "source_text": "10. Part Drawing"
    },
    {
      "source_text": "Detail drawing completely described a single parts with multiple orthographic projections."
    },
    {
      "source_text": "11. Process"
    },
    {
      "source_text": "Refers to a continuous action or operation taking place in a definite manner."
    },
    {
      "source_text": "12. Product"
    },
    {
      "source_text": "Refers to the outcome produced during forming process."
    },
    {
      "source_text": "13. shut height The distance from the finished top face of the upper shoe to the finished bottom face of the lower shoe, immediately after the die operation and with the work in the die."
    },
    {
      "source_text": "-- PDF PAGE 137 --- Die Designing NC IV Revision 00 Promulgated (05/21/2019)"
    },
    {
      "source_text": "133"
    },
    {
      "source_text": "14. Simulation"
    },
    {
      "source_text": "Refers to the representation of the behavior or characteristics of the product through the use of software."
    },
    {
      "source_text": "15. Specification"
    },
    {
      "source_text": "Refers to a detailed description or assessment of requirements."
    },
    {
      "source_text": "16. Tolerance"
    },
    {
      "source_text": "Refers to the range of permissible size"
    },
    {
      "source_text": "17. Toolbars"
    },
    {
      "source_text": "Refers to horizontal row or vertical column of selectable buttons displayed on a computer screen, allowing the user to select a variety of functions."
    },
    {
