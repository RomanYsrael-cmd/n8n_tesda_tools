  "source_text": "SECTION 1 DIE DESIGNING NC IV\n\nThe DIE DESIGNING NC IV qualification consists of competencies that the\ndesigner must achieve to enable them to perform tasks such as reviewing tools and\ndesign, determining the methods to assemble, testing and debugging complete tools\nwhether single hit or progressive.\n\nThis qualification is packaged from the competency map of the Metals and\nengineering sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nCOMMON COMPETENCIES\nMEE722201\nMEE722202\nMEE722203\nMEE722204\nMEE722205\nMEE722206\nMEE722207\nMEE722208\nMEE722210\nMEE722211\nICT311201\nApply safety practices\nInterpret working drawings and sketches\nSelect/ cut workshop materials\nPerform shop computations (Basic)\nMeasure workpiece (Basic)\nPerform routine housekeeping\nPerform shop computations (Intermediate)\nMeasure workpiece using angular measuring instruments\nMeasure workpiece using gages and surface texture comparator\nPerform preventive and corrective maintenance\nOperate a personal computer\n\nCODE NO.\nCORE COMPETENCIES\nMEE722321\nMEE722322\nMEE722323\nMEE722324\nMEE722325\n\nDetermine die design parameters\nPerform CAD operation\nSimulate and verify die design\nModify and finalize die design\nCreate fabrication drawing\n\nCODE NO.\nBASIC COMPETENCIES\n500311401\nUtilized specialized communication skills\n500311402\nDevelop and lead teams\n500311403\nPerform higher-order thinking processes and apply techniques in the\nworkplace\n500311404\nContribute to the practice of social justice in the workplace\n500311405\nManage innovative work instructions\n500311406\n500311407\n\n500311408\n\n500311409\n\nManage and evaluate usage of information\nLead in improvement of Occupational Safety and Health (OSH) programs,\npolicies and procedures\nLead towards improvement of environment work programs, policies and\nprocedures\nSustain entrepreneurial skills\n\n--- PDF PAGE 6 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n2\nA person who has achieved this qualification is competent to be:\n▪ Die Designer\n\n--- PDF PAGE 7 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n3"
}
