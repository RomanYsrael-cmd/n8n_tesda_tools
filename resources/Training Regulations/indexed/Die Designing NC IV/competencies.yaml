        "source_text": "MEE722204\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to perform\nbasic calculations using the four fundamental operation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform four\nfundamental\noperations.\n1.1 Simple calculations\nperformed using four\nfundamental\noperations.\n1.2 Simple calculations\nperformed involving\nfractions and mixed\nnumbers using four\nfundamental operations\n1.1 English and metric\nsystem of\nmeasurement\n\n1.2 Performing\ncalculation using\nfour fundamental\noperation\n\n2. Perform basic\ncalculations\ninvolving\nfractions and\ndecimals\n2.1 Simple calculations are\nperformed involving\nfractions and decimals\nusing the four\nfundamental\noperations.\n2.2 Decimal are converted\ninto fraction (and vice\nversa) accurately\n2.1 English and metric\nsystem of\nmeasurement\n\n2.1 Identifying die\nmaterial\nrequirements\n2.2 Determining\nproduction\nvolume\n2.3 Identifying\ndesign\nparameters\n3. Perform basic\ncalculations\ninvolving\npercentages.\n3.1 Simple calculations are\nperformed to obtain\npercentages from\ninformation expressed\nin either fractional or\ndecimal format\n3.1 English and metric\nsystem of\nmeasurement\n\n3.1 Performing\ncalculation\n\n4. Perform basic\ncalculation\ninvolving ration\nand proportion\n4.1 Simple calculations are\nperformed involving\nratios and proportion\nusing whole numbers,\nfractions and decimal\nfractions.\n\n4.1 English and metric\nsystem of\nmeasurement\n\n4.1 Performing\ncalculation\n5. Perform\ncalculations on\nalgebraic\nexpressions\n5.1 Simple calculations are\nperformed on algebraic\nexpressions using the\nfour fundamental\noperations.\n5.2 Simple transposition of\nformulae is carried out\nto isolate the variable\nrequired, involving the\nfour fundamental\noperations.\n\n5.1 English and metric\nsystem of\nmeasurement\n\n5.1 Performing\ncalculation\n\n--- P