              "1.1 5 Role boundaries setting",
              "1.1 6 Negotiation",
              "1.1 7 Establishing empathy",
              "1.1 8 Conduct seminars",
              "1.1 9 Public speaking",
              "1.2 Communication skills required to fulfill job roles as specified by the organization"
