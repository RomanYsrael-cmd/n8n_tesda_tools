        },
        "source_text": "MEE722211\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge and skills required in\nperforming preventive and corrective maintenance such\nas inspection and repair of hand tools, cleaning and\nlubrication of machine parts and changing drive pulley\nand belts.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Perform inspection\nof machine\n\n1.1 Machine inspected\naccording to worksite\nprocedures.\n1.2 Status/Report\nrecorded on\nproforma or reported\norally according to\nworksite procedure.\n\n1.1 Proper cleaning\nand oiling\n1.2 Parts and function\nof machine tools\n1.3 Cutting oil, coolant\nor compound\n1.4 Pulleys and belts\n1.5 Location of main\nswitches of the\nmachine\n1.6 Checklist of safe\nworking conditions\n1.1 Inspecting\nmachine\n1.2 Recording status\nreport\n2. Perform surface\ntexture\nmeasurements\n2.1 Machines lubricated\nas per manufacturer’s\nrecommendation\nusing tools and\nmaterials\n2.2 Fluids and lubricants\nreplaced and/or\ntopped up according\nto prescribed\nschedule.\n2.1 Proper cleaning\nand oiling\n2.2 Kinds of oil\n2.3 Parts and function\nof machine tools\n2.4 Cutting oil, coolant\nor compound\n2.5 Location of main\nswitches of the\nmachine\n2.1 Lubricating\nmachine\n2.2 Replacing fluid\nand lubricants\n3. Perform minor\nmachine repair and\nadjustments\n\n3.1 Minor machine\nrepairs performed\naccording to\nmanufacturer’s\ninstruction or\nworksite procedures.\n3.2 Machine moving\nparts adjusted to\nmanufacturer’s\nspecifications.\n\n3.1 Proper cleaning\nand oiling\n3.2 Kinds of oil\n3.3 Parts and function\nof machine tools\n3.4 Cutting oil, coolant\nor compound\n3.5 Pulleys and belts\n3.6 Location of main\nswitches of the\nmachine\n3.7 Handling and\nstorage of tools\n3.8 Checklist of safe\nworking\nconditions\n3.1 Performing minor\nmachine repair\n3.2 Adjusting\nmachine moving\nparts\n\n--- PDF PAGE 75 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n71\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Inspected\nInspected machine parts include:\n1.1 V-belt\n1.2 Bearing\n1.3 Gears\n1.4 Clutch\n1.5 Drive pulley\n\n2. Machines\nMay include:\n2.1 Lathe machine\n2.2 Milling machine\n2.3 Grinding machine\n\n3. Tools and materials\nMay include:\n3.1 Lubricants\n3.2 Oil can\n3.3 Grease gun\n3.4 Oil\n3.5 Coolant or compound\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Maintain hand\ntools\n4.1 Tool cutting ground to\nrecommended\nspecifications\n4.2 Hand tools lubricated\nand stored according\nto prescribed\nprocedure\n\n4.1 Proper cleaning\nand oiling\n4.2 Kinds of oil\n4.3 Handling and\nstorage of tools\n4.4 Procedures in\ncleaning and\ndisposal of waste\nmaterials\n\n4.1 Recommending\n cutting tool\n4.2 Lubricating hand\n tools\n\n--- PDF PAGE 76 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n72\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1 Performed inspection of machine\n1.2 Performed cleaning and lubricating of machine\n1.3 Performed minor machine repairs and adjustments\n\n2. Resource Implications\nThe following resources should be provided:\n2.1 Tools, equipment and facilities appropriate to processes\nor activity\n2.2 Materials relevant to the proposed activity\n\n3. Method of Assessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation of activities\n3.2 Oral or written questioning\n\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 77 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n73\nUNIT OF COMPETENCY\n:\nOPERATE A PERSONAL COMPUTER\n\nUNIT CODE\n\n:"
