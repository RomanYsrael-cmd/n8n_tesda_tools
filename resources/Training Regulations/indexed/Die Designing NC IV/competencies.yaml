recommended\nimprovements\non\nOccupational\nSafety and\nHealth (OSH)\nPrograms,\nProcedures\nand Policies\n3.1 Approved\nimprovements on OSH\nwork improvement\ninitiatives are\ncommunicated based\non workplace policies\nand procedures\n3.2 Concern personnel\nare guided in\naccordance with\nworkplace policies and\nprocedures\n3.3 Implementation of the\napproved OSH\ninitiatives are\nmonitored in\naccordance with\nworkplace policies and\nprocedures\n3.4 Implementation of\napproved OSH\ninitiatives are\nevaluated based on\nworkplace policies and\nprocedures\n3.1. Coaching\nConcepts\n3.2. OSH work\nimprovement\ninitiatives\n3.3. Supervisory\nConcepts\n3.1. Monitoring Skills\n3.2. Evaluation Skills\n3.3. Auditing Skills\n3.4. Coaching Skills\n3.5. Supervisory Skills\n\n--- PDF PAGE 38 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n34\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. OSH Practices and\nPrograms\nMay include:\n1.1\nPlanning, implementation and maintenance of\nmanufacturing plants\n1.2\nWork-physiological, psychological, ergonomic and\nhygienic practices and programs\n1.3\nFirst aid within the workplace\n1.4\nSafety inspection practices\n\n2. OSH Reference Guides\nMay include:\n2.1\nOccupational Safety and Health Standards Book\n2.2\nOSHA Safety Bulletins and Magazines\n2.3\nEquipment Safety Operating Instructions\n2.4\nEstablished National Safety Management Books\n2.5\nCredible OSH Web-sites\n2.6\nSafety Solution Guide Books and Handbooks\n3. OSH Work Improvement\nInitiatives\nMay include:\n3.1\nEliminate the hazard altogether (i.e., get rid of the\ndangerous machine)\n3.2\nIsolate the hazard from anyone who could be harmed\n(i.e., keep the machine in a closed room and operate it\nremotely; barricade an unsafe area off)\n3.3\nSubstitute the hazard with a safer alternative (i.e.,\nreplace the machine with a safer one)\n3.4\nUse administrative controls to reduce the risk (i.e.,\ntrain workers how to use equipment safely; train\nworkers about the risks of harassment; issue signage)\n3.5\nUse engineering controls to reduce the risk (i.e.,\nattach guards to the machine to protect users)\n3.6\nUse personal protective equipment (i.e., wear gloves\nand goggles when using the machine)\n\n--- PDF PAGE 39 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n35\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Consult appropriate personnel or OSH reference guides for\nproper guidance based on workplace policies and procedures\n1.2. Evaluate current practices and programs based on acceptable\nlevel of OSH work standards\n1.3. Identify OSH work improvement initiatives that are relevant with\nthe workplace scenario\n1.4. Present OSH program improvement plans based on workplace\npolicies and procedures\n1.5. Communicate approved improvements on OSH work program\ninitiatives based on workplace policies and procedures\n1.6. Monitor implementation of the approved OSH initiatives in\naccordance with workplace policies and procedures\n1.7. Evaluate implementation of approved OSH initiatives based on\nworkplace policies and procedures\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 OSH personal records\n2.3 PPE\n2.4 Health records\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Case Study/Situation\n3.4 Observation/Demonstration and oral questioning\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 40 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n36\n UNIT OF COMPETENCY\n: LEAD TOWARDS IMPROVEMENT OF\nENVIRONMENTAL WORK PROGRAMS, POLICIES\nAND PROCEDURES\n\n UNIT CODE\n: 500311408\n\n UNIT DESCRIPTOR\n\n:\n\nThis unit covers the knowledge, skills and attitudes\nrequired in assessing environmental work practices and\nstandards, recommending 