        "source_text": "MEE722201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to apply\nsafety practices in the workplace.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify hazards\n\n1.1 Hazards are identified\ncorrectly in\naccordance with OHS\nprinciples\n1.2 Safety signs and\nsymbols are identified\nand adhered to\n1.1 Shop safety signs,\nsymbols and\nalarms\n1.2 Safety\nprecautionary\nmeasures\n1.1 Identifying hazard\n1.2 Identifying safety\nsign and symbol\n\n2. Use protective\nclothing and\ndevices\n2.1 Appropriate\nprotective clothing\nand devices correctly\nselected and used in\naccordance with OHS\nrequirements or\nindustry/company\npolicy\n\n2.1 Shop safety signs,\nsymbols and\nalarms\n2.2 Safety\nprecautionary\nmeasures\n2.3 Housekeeping\n2.4 Machine tools\n2.5 First aid\n2.1 Selecting\nappropriate\nprotective\nclothing and\ndevices\n\n3. Perform safe\nhandling of tools,\nequipment and\nmaterials\n3.1 Safety procedures for\npre-use check and\noperation of tools and\nequipment followed in\naccordance with\nindustry/ company\npolicies\n3.2 Tools, equipment and\nmaterials handled\nsafely in accordance\nwith OHS\nrequirements and\nindustry/ company\npolicies\n3.1 Shop safety\nsigns, symbols\nand alarms\n3.2 Safety\nprecautionary\nmeasures\n3.3 Housekeeping\n3.4 Machine tools\n3.5 Engineering\nmaterials\n\n3.1 Checking tools\nand equipment\n3.2 Operating tools\nand equipment\n3.3 Handling tools\nand equipment\n\n--- PDF PAGE 49 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n45\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Perform first aid\n4.1 Surroundings are\nchecked for any\npossible risk or harm\n4.2 Call for help someone\nif seriously injured.\n4.3 First aid treatment of\ninjuries are carried\nout according to\nrecommended\nprocedures\n4.1 Shop safety\nsigns, symbols\nand alarms\n4.2 Safety\nprecautionary\nmeasures\n4.3 Housekeeping\n4.4 Machine tools\n4.5 First aid\n4.6 Engineering\nmaterials\n4.1 Determining first\naid treatment\naccording to\nrecommended\nprocedures\n4.2 Performing first\naid according to\nrecommended\nprocedures\n5. Use fire\nextinguisher\n5.1 Check for your own\nsafety before starting\nto extinguish a fire.\n5.2 Fire extinguisher is\nselected correctly\naccording to the type\nof fire.\n5.3 Fire extinguisher are\noperated correctly\naccording\nrecommended\nprocedures\n5.1 Shop safety signs,\nsymbols and\nalarms\n5.2 Safety\nprecautionary\nmeasures\n5.3 Housekeeping\n5.4 Machine tools\n5.5 First aid\n5.6 Engineering\nmaterials\n5.7 Fire extinguishers\n5.1 Selecting fire\nextinguisher\naccording to the\ntype of fire\n5.2 Operating fire\nextinguisher\naccording to the\ntype of fire\n\n--- PDF PAGE 50 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n46\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hazards\nMay include:\n1.1 Cluttered tools and materials\n1.2 Slippery floors (caused by oil, grease or any liquid)\n1.3 Exposed electrical wires\n1.4 Sharp edges\n1.5 Machine without guards or with exposed moving parts\n1.6 Uncollected chips or other wastes\netc.\n2. Protective clothing and\ndevices\n May include:\n2.1 Safety glasses/goggles\n2.2 Safety shoes\n2.3 Overalls\n2.4 Cap\n3. Injuries\nMay include:\n3.1 Burns/scalds\n3.2 Fractures\n3.3 Cuts and abrasions\n3.4 Poisoning\n3.5 Foreign bodies in the eye\n3.6 Concussion\n3.7 Shock\n4. Type of fires\nMay include:\n4.1 common combustibles (wood, cloth, paper, rubber and\nplastic)\n4.2 Flammable liquids (gasoline, oil, solvents, paints, etc.)\n4.3 Energized electrical equipment (wiring, fuse boxes,\ncircuit breakers, appliances, etc.\n4.4 Combustible metals (magnesium, sodium, etc.)\n\n--- PDF PAGE 51 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n47\nEVIDENCE GUIDE\n\n1. Critical Aspects of\ncompetency\nAssessment requires evidence that the candidate:\nAssessment requires evidence that the candidate:\n1.1 identified hazardous area\n1.2 used protective clothing and devices\n1.3 handled tools, equipment and materials properly\n1.4 performed first aid\n1.5 used fire extinguisher\n\n2. Resource implications\n\nThe following resources should be provided:\n2.1 Tools, equipment and facilities appropriate to processes\nor activity\n2.2 Materials relevant to the proposed activity\n\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration\n3.2 Written or oral short answer questions\n3.3 Practical exercises\n\n4. Context for\nassessment\n\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 52 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n48\nUNIT OF COMPETENCY :\nINTERPRET WORKING DRAWINGS AND SKETCHES\n\nUNIT CODE\n\n:"
