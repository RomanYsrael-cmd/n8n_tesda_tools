52 \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \n \n2.3 Dimensions \n2.3.1 Measurement \n2.3.2 Linear  \n   measuring  \n       tools \n2.4 Materials and \n     related science \n2.4.1 Classification \nand \nmechanical \nproperties of \nengineering \nmaterials \n \n3. Cut materials \n3.1 Materials are cut \naccording to \nplans/drawing \ninstruction \n3.2 Cutting \ntools/equipment \nare used based on \nmanufacturers \nspecification, \nappropriate \ntechniques or the \nsafety procedure \n \n3.1 Shop safety \npractices \n3.1.1 Safe working  \n   habits \n3.1.2 Safe  \n   handling of  \n   tools,  \n   equipment   \n   and  \n   materials \n3.2 Blueprint reading \n3.2.1 Standard  \n   drawing  \n   scales,  \n   symbols and  \n   abbreviations \n3.2.2 Assembly  \n   and details of  \n   drawing \n3.2.3 Dimensions \n3.3 Measurement \n3.3.1 Linear  \n   measuring  \n   tools \n3.4 Materials and \nrelated science \n3.4.1 Classification  \n   and  \n   mechanical  \n   properties of  \n   engineering  \n   materials \n3.1 Cutting of material \n3.2 Using  of cutting \ntools and \nequipment\n\n--- PDF PAGE 57 ---\nDie Designing NC IV                  Revision 00                    Promulgated  05/21/2019         \n53 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Plan/drawings \nMay include: \n1.1  Dimensions \n1.2  Tolerance \n2. Materials \nMay include:   \n2.1 Ferrous \n2.2   Non-ferrous \n3. Measuring tools \nMay include: \n3.1  Steel rule \n3.2  Pull-push rule \n4. Cutting \ntools/equipment \nMay include: \n4.1  Hacksaw \n4.2  Power hacksaw \n5. Safety procedure \nSafety involves the handling of: \n5.1  Equipment \n5.2  Tools \n5.3  Materials\n\n--- PDF PAGE 58 ---\nDie Designing NC IV                  Revision 00                    Promulgated  05/21/2019         \n54 \nEVIDENCE GUIDE \n \n1. Critical Aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Interpreted plans/drawings \n1.2  Selected natural according to the requirement \n1.3  Performed cutting operation \n1.4  Cutting tools/equipment used safely \n2. Resource implications \n \nThe following resources should be provided: \n2.1 Tools, equipment and facilities appropriate processes \nof an activity \n2.2 Materials relevant to the proposal activity \n2.3 Drawings/plans \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Direct observation \n3.2 Oral short answer question \n3.3 Practical exercises \n4. Context for \nassessment \n \n4.1 Competency may be assessed in actual workplace or \nat the designated TESDA Accredited Assessment \nCenter\n",
