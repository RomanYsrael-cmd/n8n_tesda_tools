        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetency\n1.1 Assessment requires evidence that the\ncandidate:\n1.1.1 Prepared CAD environment\n1.1.2 Modified 3D CAD drawings\n1.1.3 Saved modified 3D CAD drawings\n1.1.4 Observed safety practices in accordance with\nOSH standards\n1.1.5 Communicated effectively with others to ensure\neffective work operation\n\n2. Resource implications\nThe following resources should be provided:\n2.1. Work instruction\n2.2. Manuals\n2.3. 3D CAD software\n2.4. Tutorials\n2.5. Workstation\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Written examination\n3.2. Direct observation/ demonstration with oral\nquestioning\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited Assessment\nCenter\n\n--- PDF PAGE 99 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n95\nUNIT OF COMPETENCY : CREATE FABRICATION DRAWING\n\nUNIT CODE :"
        },
        "source_text": "MEE722324\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills and knowledge required for\nmodifying and finalizing drawings with the use of Computer\nAided Design (CAD) software.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare the CAD\nenvironment\n\n1.1 All relevant\nmanuals,\ninstructions and\noperating\nprocedures for the\nCAD software are\nobtained in\naccordance with\nworkplace\nprocedures.\n1.2 The CAD package\nis booted up in\naccordance with\nworkplace\nprocedures.\n1.3 Screen display area\nis set to required\nCAD environment\nand design\ntoolbars are set in\naccordance with\ninstructions.\n\n1.1 CAD Manuals\n1.2 3D tutorial\n1.3 Work instructions\n1.4 CAD software\n1.5 Workstation\n1.6 OSH Rule No. 1060\n– Premises of\nEstablishments\n1.7 OSH Rule No.\n1070 –\nOccupational\nHealth &\nEnvironmental\nControl\n\n1.1 Obtaining all\nrelevant manuals,\ninstructions and\noperating\nprocedures for\nthe CAD software\n1.2 Booting up the\nCAD package\n1.3 Setting the\nscreen display\narea and design\ntoolbars\n1.4 Applying safety\nprocedures\n2. Modify 3D CAD\ndrawings\n\n2.1 3D CAD drawings\nare modified based\non simulation\nresults.\n2.2 Modified 3D CAD\ndrawings are\nprepared in\naccordance with the\nexisting standard.\n2.3 Modified 3D CAD\ndrawings are\nreviewed by\nconcerned\npersons in\naccordance with\nworkplace\nprocedures.\n\n2.1 CAD Manuals\n2.2 3D tutorial\n2.3 Work instructions\n2.4 Verbal\ncommunication\n2.5 Drafting\n2.6 CAD software\n2.7 Workstation\n2.8 OSH Rule No. 1060\n– Premises of\nEstablishments\n2.9 OSH Rule No.\n1070 –\nOccupational\nHealth &\nEnvironmental\nControl\n\n2.1 Modifying 3D\nCAD drawings\n2.2 Preparing\nmodified CAD\ndrawings\n2.3 Applying safety\nprocedures\n\n--- PDF PAGE 96 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n92\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\n\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Save modified 3D\nCAD drawings\n\n3.1. Modified 3D CAD\ndrawing files are\nsaved in the\ndesignated folder in\naccordance with\nstandard operating\nprocedures.\n3.2. Modified designs\nare verified if saved\nto the designated\nfolder\n3.3. Programs are\nclosed in\naccordance with\nworkplace\nprocedures.\n3.4. Computer is shut-\ndown in accordance\nwith workplace\nprocedures.\n\n3.1 CAD Manuals\n3.2 Work instructions\n3.3 CAD software\n3.4 Workstation\n3.5 OSH Rule No.\n1060 – Premises\nof Establishments\n3.6 OSH Rule No.\n1070 –\nOccupational\nHealth &\nEnvironmental\nControl\n\n3.1 Saving modified\n3D CAD drawing\nfiles\n3.2 Verifying\nsimulation results\n3.3 Closing and\nshutting down\nprograms and\ncomputer\n3.4 Applying safety\nprocedures\n\n--- PDF PAGE 97 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n93\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. CAD environment\n\nMay include:\n1.1 Modelling\n1.2 Drafting\n2. Design toolbars\n\nMay include:\n2.1 Standard\n2.2 Sketch\n2.3 Feature\n2.4 View\n2.5 Selection bar\n2.6 Utility\n2.7 Modelling tool\n2.8 Edit\n2.9 Surface\n3. 3D CAD drawings\nMay include:\n3.1 Product drawing\n3.2 Parts drawing\n3.3 Assembly drawing\n4. Concerned person\n\nMay include:\n4.1 Design Supervisor\n4.2 Designer\n4.3 Production supervisor\n\n--- PDF PAGE 98 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n94\n EVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\n1.1 Assessment requires evidence that the\ncandidate:\n1.1.1 Prepared CAD environment\n1.1.2 Modified 3D CAD drawings\n1.1.3 Saved modified 3D CAD drawings\n1.1.4 Observed safety practices in accordance with\nOSH standards\n1.1.5 Communicated effectively with others to ensure\neffective work operation\n\n2. Resource implications\nThe following resources should be provided:\n2.1. Work instruction\n2.2. Manuals\n2.3. 3D CAD software\n2.4. Tutorials\n2.5. Workstation\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Written examination\n3.2. Direct observation/ demonstration with oral\nquestioning\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited Assessment\nCenter\n\n--- PDF PAGE 99 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n95\nUNIT OF COMPETENCY : CREATE FABRICATION DRAWING\n\nUNIT CODE :"
