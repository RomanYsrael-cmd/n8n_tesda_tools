        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Ability to utilize software, navigate the desktop, using\nsystem features to perform tasks and save results of\nwork.\n2. Resource Implications\nThe following resources should be provided:\n2.1 A personal computer\n2.2 A printer\n2.3 Mouse and keyboard\n2.4 Basic systems software\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Observation in a workplace or simulated environment\n3.2 Third party reports\n3.3 Exams and tests\n3.4 Demonstration of required skills\n3.5 Interviews\n4. Context for Assessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter\n\n--- PDF PAGE 83 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n79\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY : DETERMINE DIE DESIGN PARAMETERS\n\nUNIT CODE :"
        },
        "source_text": "ICT311201\n\nUNIT DESCRIPTOR\n:\nThis unit defines the competency required to operate a\npersonal computer by: starting the PC, logging in, using\nand working with files, folders and programs, saving\nwork, and closing down the PC.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.\nStart the\ncomputer\n\n1.1 The peripheral\ndevices are properly\nconnected\n1.2 Power is checked\nand the computer\nand peripheral\ndevices are switched\non\n1.3 Proper logging in and\nlogging off is\nsuccessfully done\n1.4 The operating\nsystem features and\nfunctions are\naccessed and\n1.5 Navigated Hardware\nconfiguration and\nother system\nfeatures are checked\n1.1 Computer\nfunctions\n1.2 Basic parts of a\ncomputer and\nvarious hardware\ncomponents\n1.3 Keyboard layout\nand functions\n\n1.1 Connecting\nperipheral\ndevices\n1.2 Logging in and\nlogging off\nproperly\n\n2.\nArrange and\ncustomize\ndesktop display/\nWindows settings\n2.1 The desktop screen or\nWindows elements are\nchanged as needed\n2.2 Desktop icons are\nadded, renamed,\nmoved, copied or\ndeleted\n2.3 The online help\nfunctions are\naccessed or used as\nneeded\n2.4 Desktop icons of\napplication programs\nare selected, opened\nand closed\n2.5 Properties of icons are\ndisplayed\n2.6 Computer or desktop\nsettings are saved and\nrestored\n2.1 Keyboard layout\nand functions\n2.2 Computer\nfunctions\n2.3 Basic parts of a\ncomputer and\nvarious hardware\ncomponents\n2.4 Storage devices\nand file concepts\n2.5 Basic software\noperation and\nfunctionalities\n2.1 Changing\ndesktop screen\nor windows\nelement\n2.2 Adding,\nrenaming,\nmoving, copying\nand deleting\ndesk top icon\n2.3 Accessing online\nhelp function\n2.4 Opening and\nclosing desk top\nicons\n2.5 Displaying\nproperties of\nicons\n\n--- PDF PAGE 78 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n74\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized 