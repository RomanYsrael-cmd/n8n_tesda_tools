        "source_text": "--- PDF PAGE 61 ---\nDie Designing NC IV                  Revision 00                    Promulgated  05/21/2019         \n57 \nUNIT OF COMPETENCY \n: \nMEASURE WORKPIECE (BASIC) \n \nUNIT CODE \n \n: \nMEE722205 \n \nUNIT DESCRIPTOR   \n: \nThis unit covers the competencies required to measure \nworkpieces using measuring instruments such as steel \nrules, Vernier calipers, micrometers, etc.…. \n \n \n \n \n \n \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Select and use  \nmeasuring tools \n1.1 Measuring tools \nare selected and \nused according to \nthe level of accuracy \nrequired. \n1.2 Measurements \ntaken are accurate \nto the finest \ngraduation of the \nselected measuring \ninstrument. \n1.3 Measuring \ntechnique used is \ncorrect and \nappropriate to the \ndevice used. \n1.1 Types, purposes \nand accuracy of \nmeasuring \ninstruments \n1.2 Capability of \nmeasuring \ninstruments \n1.3 Part dimensions \nand tolerances \n1.4 Techniques for \nmeasuring \ndimensions \n1.5 Care and storage \nprocedure of \nmeasuring tools \n \n1.1 Selecting \nmeasuring tools \n1.2 Obtaining \naccurate \nmeasurements \n1.3 Determining \nmeasuring \ntechnique \n \n2. Clean and store \nmeasuring tools \n2.1 Cleaning of devices \nundertaken \naccording to \nstandard operating \nprocedures. \n2.2 Care of devices \nundertaken \naccording to \nmanufacturer’s \nspecifications. \n2.3 Storage of devices \nundertaken \naccording to \nstandard operating \nprocedures. \n2.1 Types, purposes \nand accuracy of \nmeasuring \ninstruments \n2.2 Capability of \nmeasuring \ninstruments \n2.3 Part dimensions \nand tolerances \n2.4 Techniques for \nmeasuring \ndimensions \n2.5 Care and storage \nprocedure of \nmeasuring tools \n \n2.1 Determining \nproper care and \nstorage of \nmeasuring tools.\n\n--- PDF PAGE 62 ---\nDie Designing NC IV                  Revision 00                    Promulgated  05/21/2019         \n58 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.   Measuring tools \nMay include \n1.1 Steel tape \n1.2 Steel rule \n1.3 Straight edge \n1.4 Combination square \n1.5 Steel square \n1.6 Divider or trammel \n1.7 Caliper \n1.8 Protractor \n1.9 Vernier caliper \n1.10 Micrometer  \n \n2.   Measurements \nMay include: \n2.1 Length \n2.2 Diameter \n2.3 Depth \n2.4 Flatness \n2.5 Straightness \n2.6 Squareness \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate:   \n1.1 Selected and used measuring instruments \n1.2 Cleaned and stored measuring instruments \n \n2. Resource implications \nThe following resources should be provided: \n2.1 Tools, equipment and facilities appropriate to the activity \n2.2 Specimen component or part to the proposed activity \n \n3. Method of assessment \nCompetency in this unit may be assessed through: \n3.1 Direct observation \n3.2 Demonstration \n3.3 Written or oral short answer questions \n3.4 Portfolio \n \n4. Context for assessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n",
