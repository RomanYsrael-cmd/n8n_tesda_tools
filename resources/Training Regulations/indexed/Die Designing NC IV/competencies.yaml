        "source_text": "MEE722323\n\nUNIT DESCRIPTOR : This unit covers the skills and knowledge required for\nsimulating and verifying die design with the use of\nsimulation software.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Determine job\nrequirements\n\n1.1 Simulation\nrequirements are\nidentified as\nrequired.\n1.2 3D CAD drawings for\nsimulations are\nprepared.\n1.3 3D CAD drawings\nare converted to\nappropriate\nextension file.\n1.1 Work\ninstructions\n1.2 Verbal\ncommunication\n1.3 Material\ncharacteristics\n1.4 CAD simulation\nsoftware\n1.5 OSH Rule No.\n1060 – Premises\nof Establishments\n1.6 OSH Rule No.\n1070 –\nOccupational\nHealth &\nEnvironmental\nControl\n\n1.1 Identifying\nsimulation\nrequirements\n1.2 Preparing 3D CAD\ndrawing for\nsimulations\n1.3 Converting 3D\nCAD drawing to\nappropriate\nextension file\n2. Prepare the CAD\nsimulation\nenvironment\n\n2.1 All relevant manuals,\ninstructions and\noperating procedures\nfor simulation are\nobtained in\naccordance with\nworkplace\nprocedures.\n2.2 The CAD package is\nbooted up in\naccordance with\nworkplace\nprocedures.\n2.3 Simulation toolbars\nand environment\nare set in\naccordance with\ninstructions.\n2.1 CAD simulation\nmanuals\n2.2 CAD Simulation\ntutorial\n2.3 Work\ninstructions\n2.4 CAD simulation\nsoftware\n2.5 Workstation\n2.6 OSH Rule No.\n1060 – Premises\nof Establishments\n2.7 OSH Rule No.\n1070 –\nOccupational\nHealth &\nEnvironmental\nControl\n\n2.1 Obtaining relevant\nmanuals,\ninstructions and\noperating\nprocedures for\nsimulation\n2.2 Booting up the\nCAD package\n2.3 Setting the\nsimulation toolbars\nand environment\n2.4 Applying safety\nprocedures\n3. Simulate and\nverify 3D CAD\ndrawings\n3.1. 3D CAD drawings\nare simulated and\nverified in\naccordance with the\nexisting standard and\nguidance is sought\nas required.\n\n3.1 CAD\nsimulation\nmanuals\n3.2 CAD\nsimulation\ntutorial\n3.3 Work\ninstructions\n3.1 Simulating and\nverifying 3D CAD\ndrawings\n3.2 Printing out\nsimulation results\n3.3 Applying safety\nprocedures\n\n--- PDF PAGE 92 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n88\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.2. Simulated results are\nverified if saved to\nthe designated\nfolder.\n3.3. Simulation results\nare reviewed by\nconcerned person\nin accordance with\ncompany\nprocedures.\n3.4. Simulation results\nare printed out in\naccordance with\nstandard operating\nprocedures, if\nrequired.\n\n3.4 Verbal\ncommunication\n3.5 Meshing\nprinciples\n3.6 Simulation\nanalysis\n3.7 CAD\nsimulation\nsoftware\n3.8 Workstation\n3.9 OSH Rule No.\n1060 – Premises\nof\nEstablishments\n3.10 OSH Rule No.\n1070 –\nOccupational\nHealth &\nEnvironmental\nControl\n4. Save simulation\nresults\n4.1 Simulation results\nare saved in the\ndesignated folder in\naccordance with\nstandard operating\nprocedures.\n4.2 Simulation results\nare verified if saved\nto the designated\nfolder.\n4.3 Programs are closed\nin accordance with\nstandard operating\nprocedures.\n4.4 Computer is shut-\ndown in accordance\nwith standard\noperating\nprocedures.\n4.1\nCAD\nsimulation\nmanuals\n4.2\nWork\ninstructions\n4.3\nCAD\nsimulation\nsoftware\n4.4\nWorkstation\n4.5\nOSH Rule No.\n1060 –\nPremises of\nEstablishments\n4.6\nOSH Rule No.\n1070 –\nOccupational\nHealth &\nEnvironmental\nControl\n\n4.1 Saving simulation\nresults\n4.2 Verifying simulation\nresults\n4.3 Closing and\nshutting down of\nprograms and\ncomputer\n4.4 Applying safety\nprocedures\n\n--- PDF PAGE 93 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n89\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Simulation\nrequirements\n\nMay include:\n1.1 Blank size\n1.2 Gravity\n1.3 Thinning\n1.4 Spring back\n1.5 Wrinkles\n\n2. Simulation toolbars\n\nMay include:\n2.1 Collectors\n2.2 Visualization\n2.3 Display\n\n3. Simulation Environment May include:\n3.1 Mesh\n3.2 Analysis\n3.3 Results\n\n4. 3D CAD Drawings\nMay include:\n4.1 Product drawing\n4.2 Parts drawing\n4.3 Assembly drawing\n\n5. Concerned person\n\nMay include:\n5.1 Design Supervisor\n5.2 Designer\n5.3 Production supervisor\n\n--- PDF PAGE 94 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n90\n EVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Determined job requirements\n1.2 Prepared simulation CAD environment\n1.3 Simulated and verified 3D CAD drawings\n1.4 Saved simulation results\n1.5 Observed safety practices in accordance with OSH\nstandards\n1.6 Communicated effectively with others to ensure\neffective work operation\n2. Resource implications\n\nThe following resources should be provided:\n2.1 Product drawing\n2.2 Reference books\n2.3 Work instruction\n2.4 Manuals\n2.5 3D CAD software\n2.6 Tutorials\n2.7 Workstation\n3. Method of assessment Competency in this unit may be assessed through:\n3.1 Written examination\n3.2 Direct observation/ demonstration with oral\nquestioning\n4. Context for\nassessment\n\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter\n\n--- PDF PAGE 95 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n91\nUNIT OF COMPETENCY :\nMODIFY AND FINALIZE DIE DESIGN\n\nUNIT CODE\n:"
