o\nfulfill job roles as\nspecified by the\norganization\n4. Represent the\norganization\n4.1 When participating in\ninternal or external\nforums, presentation\nis relevant,\nappropriately\nresearched and\npresented in a manner\nto promote the\norganization\n4.2 Presentation is clear\nand sequential and\ndelivered within a\npredetermined time\n4.3 Utilize appropriate\nmedia to enhance\npresentation\n4.4 Differences in views\nare respected\n4.5 Written\ncommunication is\nconsistent with\norganizational\nstandards\n4.6 Inquiries are\nresponded in a\nmanner consistent\nwith organizational\nstandard\n4.7 Consolidate ideas\nand suggestions\n4.8 Generalize and\nsummarize all ideas\nand suggestions\n4.1 Communication\nprocess\n4.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n4.3 Openness and\nflexibility in\ncommunication\n4.4 Communication\nskills relevant to\nclient groups\n\n4.1 Full range of\ncommunication\ntechniques\nincluding:\n4.1.1 Effective\ncommunication\nprocess\n4.1.2 Active listening\n4.1.3 Giving/ receiving\nfeedback\n4.1.4 Interpretation of\ninformation\n4.1.5 Role boundaries\nsetting\n4.1.6 Negotiation\n4.1.7 Establishing\nempathy\n4.1.8 Openness and\nflexibility in\ncommunication\n4.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n--- PDF PAGE 10 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n6\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n5. Facilitate group\ndiscussion\n5.1 Mechanisms which\nenhance effective group\ninteraction is defined and\nimplemented\n5.2 Strategies which\nencourage all group\nmembers to participate\nare used routinely\n5.3 Objectives and agenda for\nmeetings and discussions\nare routinely set and\nfollowed\n5.4 Relevant information is\nprovided to group to\nfacilitate outcomes\n5.5 Evaluation of group\ncommunication strategies\nis undertaken to promote\nparticipati