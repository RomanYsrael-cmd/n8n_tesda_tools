        "descriptor": "This unit covers the skills, knowledge and attitudes required to determine individual and team development needs and facilitate the development of the workgroup. ELEMENTS",
        "elements": [
          {
            "number": 1,
            "title": "Foster Individual growth",
            "performance_criteria": [
              {
                "number": "1.1",
                "text": "Learning and development needs of team members are systematically identified in line with organizational requirements"
              },
              {
                "number": "1.2",
                "text": "Development plan to meet individual needs is collaboratively developed and implemented"
              },
              {
                "number": "1.3",
                "text": "Individuals are encouraged to self - evaluate performance and identify areas for improvement"
              },
              {
                "number": "1.4",
                "text": "Feedback on performance of team members is collected from relevant sources and compared with established team learning process"
              }
            ],
            "required_knowledge": [
              "1.1 Effective workplace communication, coaching and mentoring principles",
              "1.2 Feedback principles and procedures",
              "1.3 Working interdependently: strategies and techniques",
              "1.4 Leadership Concepts: • Types of Decisions Teams Make • Team Responsibilities • Problems That Affect Teams • Building Strong Team Communication • Expressing Yourself on a Team • Team Problem Solving"
            ],
            "required_skills": [
              "1.1 Ability to read and understand a variety of texts, prepare general information and documents according to target audience; spell with accuracy; use grammar and punctuation effective relationships and conflict management",
              "1.2 Coaching and mentoring skills to provide support to colleagues",
              "1.3 Communication skills including receiving feedback and reporting, maintaining effective relationships and conflict management",
              "1.4 Ability to relate to people from a range of social, cultural, physical and mental backgrounds",
              "1.5 Planning skills to organize required resources and equipment to meet learning needs",
              "1.6 Reporting skills to organize information; assess information for relevance and accuracy; identify and elaborate on learning outcomes",
              "1.7 Facilitation skills to conduct small group training sessions"
            ],
            "source_number": 1
          },
          {
            "number": 2,
            "title": "Foster individual and team growth",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "Learning and development program goals and objectives are identified to match the specific knowledge and skills requirements of competency standards"
              },
              {
                "number": "2.2",
                "text": "Learning delivery methods are appropriate to the learning goals, the learning style of participants and availability of equipment and resources"
              },
              {
                "number": "2.3",
                "text": "Workplace learning opportunities and coaching/ mentoring assistance are provided to facilitate individual and team achievement of competencies"
              },
              {
                "number": "2.4",
                "text": "Resources and timelines required for learning activities are identified and approved in accordance with organizational requirements"
              }
            ],
            "required_knowledge": [
              "2.1 Advanced coaching and mentoring techniques",
              "2.2 Performance evaluation concepts",
              "2.3 Training and development techniques"
            ],
            "required_skills": [
              "2.1 Instructional planning and delivery skills",
              "2.2 Monitoring and evaluation skills",
              "2.3 Mentoring and coaching skills"
            ],
            "source_number": 2
          },
          {
            "number": 3,
            "title": "Monitor and evaluate workplace learning",
            "performance_criteria": [
              {
                "number": "3.1",
                "text": "Feedback from individuals or teams is used to identify and implement improvements in future learning arrangements"
              },
              {
                "number": "3.2",
                "text": "Outcomes and performance of individuals/teams are assessed and recorded to determine the effectiveness of development programs and the extent of additional support"
              },
              {
                "number": "3.3",
                "text": "Modifications to learning plans are negotiated to improve the efficiency and effectiveness of learning"
              },
              {
                "number": "3.4",
                "text": "Records and reports of competency are maintained within organizational requirement"
              }
            ],
            "required_knowledge": [
              "3.1 Types and levels of learning evaluation",
              "3.2 Learning styles and strategies",
              "3.3 Training and development approaches"
            ],
            "required_skills": [
              "3.1 Instructional planning and delivery skills",
              "3.2 Monitoring and evaluation skills",
              "3.3 Mentoring and coaching skills"
            ],
            "source_number": 3
