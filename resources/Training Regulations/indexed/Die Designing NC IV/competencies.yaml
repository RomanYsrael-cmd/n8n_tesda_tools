        "source_text": "--- PDF PAGE 99 ---\nDie Designing NC IV                  Revision 00                    Promulgated  05/21/2019         \n95 \nUNIT OF COMPETENCY   :      CREATE FABRICATION DRAWING \n \nUNIT CODE                        :       MEE722325 \n \nUNIT DESCRIPTOR           :      This unit covers the skills and knowledge required for \npreparing assembly and part drawings with the use of \nComputer Aided Design (CAD) software. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Prepare assembly \ndrawings \n \n1.1 \nScreen display \narea is set to \nrequired CAD  \nenvironment and \ndesign toolbars \nare set in \naccordance with \ninstructions. \n1.2 \nAssembly \ndrawings are \ncreated in \naccordance with \nthe existing \nstandard, and \nguidance is sought \nas required. \n1.3 \nAssembly drawings \nare reviewed by \nconcerned persons \nin accordance with \nworkplace \nprocedures. \n1.4 \nReviewed \nassembly drawings \nare modified, if \nnecessary. \n1.5 \nAssembly drawing \nfiles are saved in \ndesignated folder in \naccordance with \nstandard operating \nprocedures. \n1.1 Work instructions \n1.2 Verbal \ncommunication \n1.3 Drafting \n1.4 CAD software \n1.5 OSH Rule No. \n1060 – Premises \nof Establishments \n1.6 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n \n1.1 Obtaining and \nunderstanding \ninstructions and  \nrelevant materials \n1.2 Obtaining all \nrelevant manuals, \ninstructions and \noperating \nprocedures for the \nCAD software \n1.3 Booting up the \nCAD package \n1.4 Setting the screen \ndisplay area and \ndesign toolbars \n1.5 Creating assembly \ndrawings \n1.6 Preparing \nassembly \ndrawings \n1.7 Modifying \nreviewed \nassembly \ndrawings \n1.8 Saving assembly \ndrawing files \n1.9 Applying safety \nprocedures \n2. Prepare parts \ndrawing \n \n2.1 Screen display \nareas are set in \nrequired CAD \nenvironment in \naccordance with \ninstructions. \n2.2 Parts drawing are \ncreated in created in \naccordance with the \nexisting standard, \nand guidance is \nsought as required. \n2.1 Work instructions \n2.2 Verbal \ncommunication \n2.3 Drafting \n2.4 CAD software \n2.5 OSH Rule No. \n1060 – Premises \nof Establishments \n2.6 OSH Rule No. \n1070 – \nOccupational \nHealth & \n2.1 Setting screen \ndisplay areas  \n2.2 Creating parts \ndrawing \n2.3 Preparing parts \ndrawing \n2.4 Modifying \nreviewed part \ndrawings \n2.5 Saving part \ndrawing files \n2.6 Applying safety\n\n--- PDF PAGE 100 ---\nDie Designing NC IV                  Revision 00                    Promulgated  05/21/2019         \n96 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.3 Parts drawing are \nreviewed by \nconcerned \npersons in \naccordance with \nworkplace \nprocedures. \n2.4 Reviewed part \ndrawings are \nmodified, if \nnecessary.  \n2.5 Parts drawing files \nare saved in the \ndesignated folder in \naccordance with \nstandard operating \nprocedures. \nEnvironmental \nControl \n \nprocedures \n3. Print drawings \n \n \n3.1. Assembly drawings \nare printed out in \naccordance with \nstandard operating \nprocedures. \n3.2. Part drawings are \nprinted out in \naccordance with \nstandard operating \nprocedures \n3.3. Programs are \nclosed in \naccordance with \nstandard operating \nprocedures. \n3.4. Computer is shut-\ndown in accordance \nwith standard \noperating \nprocedures. \n3.1 Work instructions \n3.2 CAD software \n3.3 Workstation \n3.4 Printer \n3.5 Plotter \n3.6 OSH Rule No. \n1060 – Premises \nof Establishments \n3.7 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n \n3.1 Printing assembly \nand part drawings \n3.2 Closing and \nshutting down \nprograms and \ncomputer \n3.3 Applying safety \nprocedures\n\n--- PDF PAGE 101 ---\nDie Designing NC IV                  Revision 00                    Promulgated  05/21/2019         \n97 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. CAD environment \n \nMay include: \n1.1 Modeling \n1.2 Drafting \n2. Design toolbars \n \n \n \n \n \n \n \n \n \n \n \n \nMay include: \n2.1 Standard \n2.2 Selection bar \n2.3 View \n2.4 Utility \n2.5 Table \n2.6 Drawing \n2.7 Dimension \n2.8 Annotation \n2.9 Symbol \n2.10 \nEdit \n2.11 \nSketch \n2.12 \nLines and curve \n3. Assembly drawing  \n \nMay include: \n3.1 Bill of materials \n3.2 Isometric view \n3.3 Orthographic view \n3.4 Balloon \n3.5 Dimension \n4. Parts drawing \nMay include: \n4.1 Orthographic view \n4.2 Isometric view \n4.3 Dimension \n4.4 Label \n4.5 Section \n4.6 Tolerance \n4.7 Allowance \n4.8 Symbol \n4.9 Surface finish \n4.10 Material \n4.11 Process \n4.12 Quantity \n4.13 Instruction \n5. Concerned persons \nMay include: \n5.1 Design supervisor \n5.2 Designer \n5.3 Production supervisor \n6 Printed \nMay include: \n6.1 Printer \n6.2 Plotter\n\n--- PDF PAGE 102 ---\nDie Designing NC IV                  Revision 00                    Promulgated  05/21/2019         \n98 \n EVIDENCE GUIDE \n \n1. Critical aspect of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 Prepared assembly drawings \n1.2 Prepared parts drawing \n1.3 Printed drawings \n1.4 Observed safety practices in accordance with OSH \nstandards \n1.5 Communicated effectively with others to ensure effective \nwork operation \n2. Resource Implications \nThe following resources should be provided: \n2.1 Work instruction \n2.2 Manuals \n2.3 3D CAD software \n2.4 Tutorials \n2.5 Workstation \n3. Methods of Assessment \nCompetency in this unit may be assessed through: \n3.1 Written examination \n3.2 Direct observation/ demonstration with oral questioning \n4. Context for Assessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n",
