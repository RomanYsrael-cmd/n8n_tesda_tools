        "source_text": "--- PDF PAGE 63 ---\nDie Designing NC IV                  Revision 00                    Promulgated  05/21/2019         \n59 \nUNIT OF COMPETENCY \n: \nPERFORM ROUTINE HOUSEKEEPING \n \nUNIT CODE \n \n: \nMEE722206 \n \nUNIT DESCRIPTOR   \n: \nThis unit covers the competencies required to maintain \nan organized and clean work area. \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Determine \nrequirement \n1.1 Work area \nmaintained in a safe, \nuncluttered and \norganized manner \naccording to \nworkshop policy \n1.2 All tasks carried out \nsafely, effectively and \nefficiently with \nminimum \ninconvenience \naccording to \nworkshop policy \n1.3 Workshop policies \nand procedures for \ntidying work areas \nand placing items in \ndesignated areas \napplied \n1.1 Shop safety \npractices \n1.2 Machine shop \nequipment \n1.3 Shop policies \nregulations \n1.4 5-S \n1.5 Shop cleaning \nequipment \n \n1.1 Maintaining work \narea, safe \nuncluttered and \norganized \n1.2 Carrying out all \ntask safely, \neffectively and \nefficiently \n1.3 Designating \nworkshop \npolicies and \nprocedures for \nwork area \n \n2 Clean work area \n2.1 Shop policies and \nprocedures applied \nfor cleaning work \narea \n2.2 Wastes promptly \nremoved and disposed\nof according to shop \npolicies and \nenvironmental \nrequirements \n2.3 Spills, wastes and \nother potential \nhazards reported to \nappropriate \npersonnel and \nremoved according to \nshop policies and \nenvironmental \nrequirements \n2.4 Signage promptly \ndisplayed in regard to \nunsafe areas \n2.1 Shop safety \npractices \n2.2 Machine shop \nequipment \n2.3 Shop policies \nregulations \n2.4 5-S \n2.5 Shop cleaning \nequipment \n \n2.1 Applying shop \npolicies and \nprocedures \n2.2 Disposing of \nwaste according \nto shop policy \nand \nenvironmental \nrequirements \n2.3 Cleaning of tools \nand equipment\n\n--- PDF PAGE 64 ---\nDie Designing NC IV                  Revision 00                    Promulgated  05/21/2019         \n60 \n \n \n \n \nELEMENT \nPERFORMANC \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \n2.5 Consumable \nmaterials maintained \nand stored correctly \nafter use \n2.6 Tools and \nequipment (including \nguards) cleaned and \nused in accordance \nwith manufacturer’s \ninstructions\n\n--- PDF PAGE 65 ---\nDie Designing NC IV                  Revision 00                    Promulgated  05/21/2019         \n61 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.   Workshop policy \nShop policy and procedure in regard to: \n1.1 Housekeeping practices \n1.2 Maintenance and storage of cleaning equipment \n1.3 Use and storage of cleaning chemicals \n2.   Work area \nMay include: \n2.1 Work benches \n2.2 Walkways and aisles  \n2.3 Fixtures and other working surfaces  \n3.  Tools and  \n     Equipment \nMay include: \n3.1 Drill Press \n3.2 Pedestal Grinder \n3.3 Surface plate \n3.4 Layout and marking tools \n3.5 Cutting tools (hacksaw, chisel, files) \n3.6 Inspection and measuring tools (templates, vernier \ncaliper, micrometer, straight edge, gages, etc…)\n\n--- PDF PAGE 66 ---\nDie Designing NC IV                  Revision 00                    Promulgated  05/21/2019         \n62 \nEVIDENCE GUIDE \n \n1. \nCritical aspects of \ncompetency  \nAssessment requires evidence that the candidate:   \n1.1 Organized and cleaned work area according shop  \n        policies and environmental requirements. \n2. \nResource implications \nThe following resources should be provided: \n2.1 Tools, equipment and facilities appropriate to \nprocesses or activity \n2.2 Materials and documentation relevant to the \nproposed activity \n2.3 Shop policy and/or procedures manual on \nhousekeeping, cleaning and occupational health and \nsafety \n3. \nMethod of assessment \nCompetency in this unit may be assessed through: \n3.1 Direct observation  \n3.2 Demonstration or role play \n3.3 Written or oral short answer questions \n3.4 Identify colleagues/clients who can be approached \nfor the collection of competency evidence, where \nappropriate \n4. \nContext for assessment \n4.1 Competency may be assessed in actual workplace \nor at the designated TESDA Accredited Assessment \nCenter\n",
