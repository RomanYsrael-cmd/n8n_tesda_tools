ocesses\nare included/utilized\nwhere advantageous to\nthe enterprise.\n1.4 Constant\ndialog/linkages with\nother\nentrepreneurs/peers\nand stakeholders are\nmaintained\n1.5 Circulation and\nparticipation in\nbusiness fora,\nmeetings, conventions\nand exhibits are\nmaintained.\n1.1 Business models\nand strategies\n1.2 Types and\ncategories of\nbusinesses\n1.3 Business internal\ncontrols\n1.4 Market Trends\n1.5 Relevant national\nand local\nlegislation and\nregulations\n1.6 Basic quality\ncontrol and\nassurance\nconcepts\n\n1.1 Basic bookkeeping/\naccounting skills\n1.2 Communication\nskills\n1.3 Building relations\nwith customer and\nemployees\n1.4 Building competitive\nadvantage of the\nenterprise\n1.5 Networking and\nLinkaging skills\n\n--- PDF PAGE 45 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n41\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Manage\nentrepreneurial\npractices\n2.1 Ideas and comments\nfor improvements are\nsought from workers\nand clients.\n2.2 Staff/workers are\nencouraged and\nsupported in their skills\ndevelopment and\nenhancement.\n2.3 A culture of\ncontinuous\nimprovement is\nfostered within the\nenterprise.\n2.4 Innovations on the\nexisting lines of\nproducts and services\nare encouraged\n\n2.1 Public relations\nconcepts\n2.2 Basic product\npromotion\nstrategies\n2.3 Basic market and\nfeasibility studies\n2.4 Basic business\nethics\n2.1 Building customer\nrelations\n2.2 Individual marketing\nskills\n2.3 Using basic\nadvertising (posters/\ntarpaulins, flyers,\nsocial media, etc.)\n3. Expand\nmarkets and\nclientele\n3.1 Enterprise is built up\nand sustained through\njudicious control of\ncash flows.\n3.2 Profitability of\nenterprise is ensured\nthough appropriate\ninternal controls.\n3.3 Unnecessary or lower-\npriority expenses and\npurchases are\navoided.\n3.4 New markets and\nclients are identified\nbased on current\nmarket trends\n\n3.1 Basic cost-benefit\nanalysis\n3.2 Basic financial\nmanagement\n3.3 Basic financial\naccounting\n3.4 Business internal\ncontrols\n\n3.1 Setting business\npriorities and\nstrategies\n3.2 Interpreting basic\nfinancial statements\n3.3 Preparing business\nplans\n\n--- PDF PAGE 46 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n42\n RANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Entrepreneurial skills\nMay include:\n1.1. Financial management skills\n1.2. People management skills\n1.3. Operations management skills\n1.4. Business acumen\n\n2. Business operations\nMay include:\n2.1 Purchasing\n2.2 Accounting/Administrative work\n2.3 Production/Operations/Sales\n\n3. Internal controls\nMay include:\n3.1 Accounting systems\n3.2 Financial statements/reports\n3.3 Cash management\n3.4 Managing property, plant and equipment\n4. Continuous\nimprovement\nMay include:\n4.1 Quality management systems (PDCA, ISO 9001,TQM,\nSix-Sigma, etc.)\n4.2 Client feedback systems\n4.3 Quality assurance/Quality control systems\n\n--- PDF PAGE 47 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n43\n EVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated enhancement of one’s entrepreneurial\nskills through performance of business, supervisor\nevaluation, worker and client testimony\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Interview guide for entrepreneurs, enterprise workers\nand third parties\n2.2 Materials and location relevant to the proposed\nactivity and tasks\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through :\n3.1 Written report\n3.2 Written examination\n3.3 Demonstration/observation with oral questioning\n3.4 Portfolio assessment with interview\n3.5 Third-party report\n\n4. Context of\nAssessment\n4.1 Competency may be assessed in workplace or in a\nsimulated workplace setting\n4.2 Assessment shall be observed while tasks are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 48 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n44\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nAPPLY SAFETY PRACTICES\n\nUNIT CODE\n\n:\nMEE722201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the competencies required to apply\nsafety practices in the workplace.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify hazards\n\n1.1 Hazards are identified\ncorrectly in\naccordance with OHS\nprinciples\n1.2 Safety signs and\nsymbols are identified\nand adhered to\n1.1 Shop safety signs,\nsymbols and\nalarms\n1.2 Safety\nprecautionary\nmeasures\n1.1 Identifying hazard\n1.2 Identifying safety\nsign and symbol\n\n2. Use protective\nclothing and\ndevices\n2.1 Appropriate\nprotective clothing\nand devices correctly\nselected and used in\naccordance with OHS\nrequirements or\nindustry/company\npolicy\n\n2.1 Shop safety signs,\nsymbols and\nalarms\n2.2 Safety\nprecautionary\nmeasures\n2.3 Housekeeping\n2.4 Machine tools\n2.5 First aid\n2.1 Selecting\nappropriate\nprotective\nclothing and\ndevices\n\n3. Perform safe\nhandling of tools,\nequipment and\nmaterials\n3.1 Safety procedures for\npre-use check and\noperation of tools and\nequipment followed in\naccordance with\nindustry/ company\npolicies\n3.2 Tools, equipment and\nmaterials handled\nsafely in accordance\nwith OHS\nrequirements and\nindustry/ company\npolicies\n3.1 Shop safety\nsigns, symbols\nand alarms\n3.2 Safety\nprecautionary\nmeasures\n3.3 Housekeeping\n3.4 Machine tools\n3.5 Engineering\nmaterials\n\n3.1 Checking tools\nand equipment\n3.2 Operating tools\nand equipment\n3.3 Handling tools\nand equipment\n\n--- PDF PAGE 49 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n45\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Perform first aid\n4.1 Surroundings are\nchecked for any\npossible risk or harm\n4.2 Call for help someone\nif seriously injured.\n4.3 First aid treatment of\ninjuries are carried\nout according to\nrecommended\nprocedures\n4.1 Shop safety\nsigns, symbols\nand alarms\n4.2 Safety\nprecautionary\nmeasures\n4.3 Housekeeping\n4.4 Machine tools\n4.5 First aid\n4.6 Engineering\nmaterials\n4.1 Determining first\naid treatment\naccording to\nrecommended\nprocedures\n4.2 Performing first\naid according to\nrecommended\nprocedures\n5. Use fire\nextinguisher\n5.1 Check for your own\nsafety before starting\nto extinguish a fire.\n5.2 Fire extinguisher is\nselected correctly\naccording to the type\nof fire.\n5.3 Fire extinguisher are\noperated correctly\naccording\nrecommended\nprocedures\n5.1 Shop safety signs,\nsymbols and\nalarms\n5.2 Safety\nprecautionary\nmeasures\n5.3 Housekeeping\n5.4 Machine tools\n5.5 First aid\n5.6 Engineering\nmaterials\n5.7 Fire extinguishers\n5.1 Selecting fire\nextinguisher\naccording to the\ntype of fire\n5.2 Operating fire\nextinguisher\naccording to the\ntype of fire\n\n--- PDF PAGE 50 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n46\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Hazards\nMay include:\n1.1 Cluttered tools and materials\n1.2 Slippery floors (caused by oil, grease or any liquid)\n1.3 Exposed electrical wires\n1.4 Sharp edges\n1.5 Machine without guards or with exposed moving parts\n1.6 Uncollected chips or other wastes\netc.\n2. Protective clothing and\ndevices\n May include:\n2.1 Safety glasses/goggles\n2.2 Safety shoes\n2.3 Overalls\n2.4 Cap\n3. Injuries\nMay include:\n3.1 Burns/scalds\n3.2 Fractures\n3.3 Cuts and abrasions\n3.4 Poisoning\n3.5 Foreign bodies in the eye\n3.6 Concussion\n3.7 Shock\n4. Type of fires\nMay include:\n4.1 common combustibles (wood, cloth, paper, rubber and\nplastic)\n4.2 Flammable liquids (gasoline, oil, solvents, paints, etc.)\n4.3 Energized electrical equipment (wiring, fuse boxes,\ncircuit breakers, appliances, etc.\n4