        "source_text": "--- PDF PAGE 69 ---\nDie Designing NC IV                  Revision 00                    Promulgated  05/21/2019         \n65 \nUNIT OF COMPETENCY        : \nMEASURE WORKPIECE USING ANGULAR \nMEASURING INSTRUMENTS \n \nUNIT CODE \n \n: \nMEE722208 \n \nUNIT DESCRIPTOR   \n: \nThis unit covers the competencies required to measure \nworkpieces using angular measuring instruments. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Select and \nuse angular \nmeasuring \ntools \n1.1 Angular measuring \ntools are selected \nand used according \nto the level of \naccuracy required. \n1.2 Measurements \ntaken are accurate to \nthe finest graduation \nof the selected \nmeasuring \ninstrument. \n1.3 Measuring technique \nused is correct and \nappropriate to the \ndevice used. \n \n1.1 Types, purposes and \naccuracy of angular \nmeasuring \ninstruments \n1.2 Capability of \nmeasuring tools \n1.3 Techniques for \nmeasuring angles \nand tapers \n1.1 Selecting angular \nmeasuring tools \n1.2 Obtaining \naccurate \nmeasurements \n1.3 Determining \nmeasuring \ntechniques \n \n2. Maintain \nangular  \nmeasuring \ntools \n2.1 Measuring tools are \nadjusted and \nmaintained to the \nrequired accuracy \nutilizing \nmanufacturer’s or \nworksite procedures. \n \n2.2 Types, purposes and \naccuracy of angular \nmeasuring \ninstruments \n2.3 Capability of \nmeasuring tools \n2.4 Techniques for \nmeasuring angles \nand tapers \n \n2.1 Maintaining and \nadjusting \nmeasuring tool \naccuracy \n3. Clean and \nstore \nmeasuring \ntools \n3.1 Care and storage of \ndevices undertaken \nto manufacturer’s \nspecifications or \nstandard operating \nprocedures. \n \n3.1 Types, purposes and \naccuracy of angular \nmeasuring \ninstruments \n3.2 Capability of \nmeasuring tools \n3.3 Techniques for \nmeasuring angles \nand tapers \n3.4 Care and storage \nprocedure of \nmeasuring tools \n \n3.1 Storing and \ncleaning of \nmeasuring tools\n\n--- PDF PAGE 70 ---\nDie Designing NC IV                  Revision 00                    Promulgated  05/21/2019         \n66 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.   Angular measuring \n      tools \nMay include: \n1.1 Bevel protractor \n1.2 Gage blocks \n1.3 Sine bar \n \n2.   Measurements \nMay include: \n2.1 Angle \n2.2 Taper \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate:   \n1.1 Selected and used angular measuring instruments \n1.2 Maintained/adjusted instruments \n1.3 Cleaned and stored measuring instruments \n \n2. Resource implications \nThe following resources should be provided: \n2.1 Tools, equipment and facilities appropriate to the activity \n2.2 Specimen component or part to the proposed activity \n \n3. Method of \nassessment \nCompetency in this unit may be assessed through: \n3.1 Direct observation \n3.2 Demonstration \n3.3 Written or oral short answer questions \n3.4 Portfolio \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n",
