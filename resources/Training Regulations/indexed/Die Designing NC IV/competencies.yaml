cts recognized\nas required.\n3.2 Dimensions\nidentified as\nappropriate.\n3.3 Instructions\nidentified and\nfollowed as\nrequired.\n3.4 Material\nrequirements\nidentified as\nrequired.\n3.5 Symbols recognized\nas appropriate in the\ndrawing.\n3.1 Alphabet of lines\n3.2 Projections\n3.3 Drawing symbols\n3.4 Dimensioning\ntechniques\n3.5 Tolerance, limits\nand fits\n3.6 Engineering\nmaterials\n3.7 Drawing tools and\nsupplies\n\n3.1 Recognizing\ncomponents,\nassemblies and\nobjects.\n3.2 Identifying\ndimensions\n3.3 Identifying\ninstruction\n3.4 Identifying\nmaterial\nrequirements\n3.5 Recognizing\nsymbols\n\n--- PDF PAGE 54 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n50\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Drawing\n1.1 Drawing technique may include\n1.1.1\nPerspective\n1.1.2\nExploded view\n1.1.3\nHidden view technique\n1.2 Projections\n1.2.1\nFirst angle projections\n1.2.2\nThird angle projections\n2. Tolerance\nMay include:\n2.1 General tolerance\n2.2 Angular tolerance\n2.3 Geometric tolerance\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Interpreted technical drawing\n1.2 Prepared sketches\n1.3 Interpreted sketches\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Drafting room/facilities and drafting instruments and\nsupplies appropriate to the activity\n2.2 Measuring tools\n2.3 Drawings, sketches or blueprint\n2.4 Specimen parts/components\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1 Direct observation\n3.2 Written or oral short answer questions\n3.3 Demonstration\n3.4 Project/work sample\n3.5 Portfolio\n4. Context for\nassessment\n\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center\n\n--- PDF PAGE 55 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n51\nUNIT OF COMPETENCY\n:\nSELECT/ CUT WORKSHOP MATERIALS\n\nUNIT CODE\n\n:"
