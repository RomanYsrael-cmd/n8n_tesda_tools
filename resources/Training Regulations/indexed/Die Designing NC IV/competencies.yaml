ttitudes of\nempathy, solidarity\nand respect for\ndiversity\n2.3 Connecting local\nissues to global\ntrends, and vice\nversa.\n3. Engage and\ntake actions\non workplace\nissues and\nconcerns\n3.1 Effective and\nresponsible actions at\nlocal, national and\nglobal levels are\nidentified.\n3.2 Motivation and\nwillingness to take\nnecessary actions are\ndeveloped.\n3.3 Attitude of “thinking\nglobally and acting\nlocally” is practiced.\n3.1 Actions that can\nbe taken\nindividually and\ncollectively\n3.2 Ethically\nresponsible\nbehaviour\n3.3 Importance and\nbenefits of civic\nengagement\n3.4 Strategies and\ntechniques of\n“thinking globally\nand acting\nlocally\n3.1 Employing\nappropriate actions\nto address\nworkplace issues\ninvolving national\nand global trends\n3.2 Showing concern\nand willingness to\ntake part in the\ndevelopment\nefforts to discuss\nworkplace issues\nand concerns\n3.3 Applying the\nattitude of “thinking\nglobally and acting\nlocally” in the\nworkplace\n\n--- PDF PAGE 27 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n23\n RANGE OF VARIABLES\n\n EVIDENCE GUIDE\n\nVARIABLE\nRANGE\n1. Media\nMay include:\n1.1\nPrint media\n1.2\nBroadcast media\n1.3\nInternet and social media\n2. Scanning/Monitoring\nMay include:\n2.1\nSourcing from key informants\n2.2\nConversation with clients\n2.3\nMan-on-the-street conversation\n2.4\nScanning print and broadcast media\n3. Local, national and\nglobal issues\n\nMay include:\n3.1\nPoverty\n3.2\nUnemployment\n3.3\nGlobal warming\n3.4\nSafety, security, and well-being\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated ability and attitude to keep oneself\nupdated of relevant issues/trends\n1.2 Demonstrated ability to think and act based on one’s\nprinciples and values\n1.3 Demonstrated a holistic/global outlook on internal and\nexternal events in the workplace\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Access to workplac