          "REQUIRED SKILLS 3. Develop practical action plans for improving workplace conditions. 3.1 Evaluation of efficiency and effectiveness of workplace policies, procedures and protocols are documented, communicated to stakeholders. 3.2 Practical action plans in improving workplace conditions are formulated, presented and negotiated with stakeholders. 3.3 Proposed changes and directions are inquired, processed and negotiated between and among teams, and stakeholders as well of the organization. 3.4 Commitment to continuous improvement and change is highlighted. 3.5 Passion and dedication for changing and adapting to the demands of the 21st century workplace are considered. 3.1 Different methods of critical and appreciative inquiry and their relevance to different situations. 3.2 Techniques to assist in forming the habit of asking questions and taking responsibility for answers. 3.3 Why questions are important and the benefits of asking good questions for individuals, businesses and communities (the importance of critical thinking). 3.4 Growth mindset and positive communication and relationship strategies and techniques. 3.5 Creative negotiation skills. 3.6 Change management and continuous improvement concepts. 3.1 Using range of analytical techniques (e.g., planning, attention, simultaneous and successive processing of information). 3.2 Communicating to actively listen and to ask questions of others in a constructive way. 3.3 Using critical thinking pathway to formulate and ask relevant questions and come up with appropriate answers. 3.4 Performing assimilation and accommodation skills to interpret and distil key information of relevance to a given situation. 3.5 Assessing and measuring the extent of effectiveness and efficiency of the systems, processes and procedures in the workplace. 3.6 Communicating practical insights on improving workplace conditions.",
