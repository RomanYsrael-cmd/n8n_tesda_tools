  "source_section_text": "SECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details and contents of the units of competency required in\nDIE DESIGNING NC IV. These units of competency are categorized into basic, common\nand core competencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nUTILIZE SPECIALIZED COMMUNICATION SKILLS\n\nUNIT CODE\n:\n500311401\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required\nto use specialized communication skills to meet specific\nneeds of internal and internal clients, conduct interviews,\nfacilitate discussion with groups, and contribute to the\ndevelopment of communication strategies.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Meet common\nand specific\ncommunication\nneeds of clients\nand colleagues\n1.1 Specific\ncommunication needs\nof clients and\ncolleagues are\nidentified and met\n1.2 Different approaches\nare used to meet\ncommunication needs\nof clients and\ncolleagues\n1.3 Conflict is addressed\npromptly in a manner\nwhich does not\ncompromise the\norganization\n\n1.1 Communication\nprocesses\n1.2 Dynamics of\ngroups and\ndifferent styles\nof group\nleadership\n1.3 Communication\nskills relevant to\nclient groups\n1.4 Flexibility in\ncommunication\n\n1.1 Full range of\ncommunication\ntechniques\nincluding:\n1.1.1 Effective\ncommunication\nprocess\n1.1.2 Active listening\n1.1.3 Giving/ receiving\nfeedback\n1.1.4 Interpretation of\ninformation\n1.1.5 Role boundaries\nsetting\n1.1.6 Negotiation\n1.1.7 Establishing\nempathy\n1.1.8 Conduct seminars\n1.1.9 Public speaking\n1.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n--- PDF PAGE 8 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n4\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n2.1 Strategies for internal\nand external\ndissemination of\ninformation are\ndeveloped, promoted,\nimplemented and\nreviewed as required\n2.2 Channels of\ncommunication are\nestablished and\nreviewed regularly\n2.3 Coaching in effective\ncommunication is\nprovided\n2.4 Work related network\nand relationship are\nmaintained\n2.5 Negotiation and\nconflict resolution\nstrategies are used\nwhere required\n2.6 Communication with\nclients and colleagues is\nperformed appropriate to\nindividual needs and\norganizational objectives\n2.1 Communication\nprocess\n2.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n2.3 Openness and\nflexibility in\ncommunication\n2.4 Communication\nskills relevant to\nclient groups\n\n2.1 Full range of\ncommunication\ntechniques\nincluding:\n2.1.1 Effective\ncommunication\nprocess\n2.1.2 Active listening\n2.1.3 Giving/ receiving\nFeedback\n2.1.4 Interpretation of\ninformation\n2.1.5 Role boundaries\nsetting\n2.1.6 Negotiation\n2.1.7 Establishing\nempathy\n2.1.8 Openness and\nflexibility in\ncommunication\n2.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n3. Deliver a\ntechnical\npresentation\n3.1 Presentation is\ndelivered clearly,\nsequential and\ndelivered within\nallotted time\n3.2 Utilize appropriate\nmedia to enhance\npresentation\n3.3 Differences in\nviews/opinions are\nrespected\n3.4 Questions during fora\nare responded in a\nmanner consistent\nwith organizational\nstandard\n3.1 Communication\nprocess\n3.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n3.3 Openness and\nflexibility in\ncommunication\n3.4 Communication\nskills relevant to\nclient groups\n\n3.1 Full range of\ncommunication\ntechniques\nincluding:\n3.1.1 Effective\ncommunication\nprocess\n3.1.2 Active listening\n3.1.3 Giving/receiving\nfeedback\n3.1.4 Interpretation of\ninformation\n3.1.5 Role boundaries\nsetting\n3.1.6 Negotiation\n3.1.7 Establishing\nempathy\n3.1.8 Openness and\n\n--- PDF PAGE 9 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n5\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n\n flexibility in\ncommunication\n3.1.9 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n4. Represent the\norganization\n4.1 When participating in\ninternal or external\nforums, presentation\nis relevant,\nappropriately\nresearched and\npresented in a manner\nto promote the\norganization\n4.2 Presentation is clear\nand sequential and\ndelivered within a\npredetermined time\n4.3 Utilize appropriate\nmedia to enhance\npresentation\n4.4 Differences in views\nare respected\n4.5 Written\ncommunication is\nconsistent with\norganizational\nstandards\n4.6 Inquiries are\nresponded in a\nmanner consistent\nwith organizational\nstandard\n4.7 Consolidate ideas\nand suggestions\n4.8 Generalize and\nsummarize all ideas\nand suggestions\n4.1 Communication\nprocess\n4.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n4.3 Openness and\nflexibility in\ncommunication\n4.4 Communication\nskills relevant to\nclient groups\n\n4.1 Full range of\ncommunication\ntechniques\nincluding:\n4.1.1 Effective\ncommunication\nprocess\n4.1.2 Active listening\n4.1.3 Giving/ receiving\nfeedback\n4.1.4 Interpretation of\ninformation\n4.1.5 Role boundaries\nsetting\n4.1.6 Negotiation\n4.1.7 Establishing\nempathy\n4.1.8 Openness and\nflexibility in\ncommunication\n4.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n--- PDF PAGE 10 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n6\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n5. Facilitate group\ndiscussion\n5.1 Mechanisms which\nenhance effective group\ninteraction is defined and\nimplemented\n5.2 Strategies which\nencourage all group\nmembers to participate\nare used routinely\n5.3 Objectives and agenda for\nmeetings and discussions\nare routinely set and\nfollowed\n5.4 Relevant information is\nprovided to group to\nfacilitate outcomes\n5.5 Evaluation of group\ncommunication strategies\nis undertaken to promote\nparticipation of all parties\n5.6 Specific communication\nneeds of individuals are\nidentified and addressed\n5.1 Communication\nprocess\n5.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n5.3 Openness and\nflexibility in\ncommunication\n5.4 Communication\nskills relevant to\nclient groups\n\n5.1 Full range of\ncommunication\ntechniques\nincluding:\n5.1.1 Effective\ncommunication\nprocess\n5.1.2 Active listening\n5.1.3 Giving/receiving\nfeedback\n5.1.4 Interpretation of\ninformation\n5.1.5 Role boundaries\nsetting\n5.1.6 Negotiation\n5.1.7 Establishing\nempathy\n5.1.8 Openness and\nflexibility in\ncommunication\n5.2 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n6. Conduct\ninterview\n6.1 A range of appropriate\ncommunication strategies\nare employed in interview\nsituations\n6.2 Records of interviews are\nmade and maintained in\naccordance with\norganizational procedures\n6.3 Effective questioning,\nlistening and nonverbal\ncommunication techniques\nare used to ensure that\nrequired message is\ncommunicated\n6.1 Communication\nprocess\n6.2 Dynamics of\ngroups and\ndifferent styles of\ngroup leadership\n6.3 Effective\nquestioning\ntechniques\n6.4 Communication\nskills relevant to\nclient groups\n\n6.1 Full range of\ncommunication\ntechniques\nincluding:\n6.1.1 Effective\ncommunication\nprocess\n6.1.2 Active listening\n6.1.3 Giving/ receiving\nfeedback\n6.1.4 Interpretation of\ninformation\n6.1.5 Role boundaries\nsetting\n6.1.6 Negotiation\n6.1.7 Establishing\nempathy\n6.2 Effective clarifying\nand probing\ntechniques\n(questioning skills)\n6.3 Communication\nskills required to\nfulfill job roles as\nspecified by the\norganization\n\n--- PDF PAGE 11 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n7\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Strategies\nMay include:\n1.1 Recognizing own limitations\n1.2 Referral to specialists\n1.3 Utilizing techniques and aids\n1.4 Providing written drafts\n1.5 Verbal and non verbal communication\n2. Effective group\ninteraction\nMay include:\n2.1 Identifying and evaluating what is occurring within an\ninteraction in a non judgmental way\n2.2 Using active listening\n2.3 Making decision about appropriate words, behavior\n2.4 Putting together response which is culturally\nappropriate\n2.5 Expressing an individual perspective\n2.6 Expressing own philosophy, ideology and\nbackground and exploring impact with relevance\nto communication\n2.7 Openness and flexibility in communication\n3. Types of Interview\nMay include:\n3.1 Related to staff issues\n3.2 Routine\n3.3 Confidential\n3.4 Evidential\n3.5 Non disclosure\n3.6 Disclosure\n4. Interview situations\nMay include:\n4.1 Establish rapport\n4.2 Elicit facts and information\n4.3 Facilitate resolution of issues\n4.4 Develop action plans\n4.5 Diffuse potentially difficult situation\n\n--- PDF PAGE 12 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n8\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated effective communication skills with\nclients accessing service and work colleagues\n1.2 Adopted relevant communication techniques and\nstrategies to meet client particular needs and difficulties\n2. Resource Implications\n2.1 Access to appropriate workplace where assessment can\ntake place\n\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Case Study\n3.2 Interview\n3.3 Portfolio\n3.4 Written Test\n3.5 Role Play\n\n4. Context for Assessment\n4.1 This unit should be assessed on the job through\nsimulation\n\n--- PDF PAGE 13 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n9\nUNIT OF COMPETENCY :\nDEVELOP AND LEAD TEAMS\n\nUNIT CODE\n:\n500311402\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required\nto determine individual and team development needs and\nfacilitate the development of the workgroup.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Foster\nIndividual\ngrowth\n1.1 Learning and\ndevelopment needs\nof team members are\nsystematically\nidentified in line with\norganizational\nrequirements\n1.2 Development plan to\nmeet individual needs\nis collaboratively\ndeveloped and\nimplemented\n1.3 Individuals are\nencouraged to self -\nevaluate performance\nand identify areas for\nimprovement\n1.4 Feedback on\nperformance of team\nmembers is collected\nfrom relevant sources\nand compared with\nestablished team\nlearning process\n1.1 Effective\nworkplace\ncommunication,\ncoaching and\nmentoring\nprinciples\n1.2 Feedback\nprinciples and\nprocedures\n1.3 Working\ninterdependently:\nstrategies and\ntechniques\n1.4 Leadership\nConcepts:\n• Types of\nDecisions\nTeams Make\n• Team\nResponsibilities\n• Problems That\nAffect Teams\n• Building Strong\nTeam\nCommunication\n• Expressing\nYourself on a\nTeam\n• Team Problem\nSolving\n\n1.1 Ability to read and\nunderstand a variety of\ntexts, prepare general\ninformation and\ndocuments according to\ntarget audience; spell\nwith accuracy; use\ngrammar and\npunctuation effective\nrelationships and\nconflict management\n1.2 Coaching and\nmentoring skills to\nprovide support to\ncolleagues\n1.3 Communication skills\nincluding receiving\nfeedback and reporting,\nmaintaining effective\nrelationships and\nconflict management\n1.4 Ability to relate to\npeople from a range of\nsocial, cultural, physical\nand mental\nbackgrounds\n1.5 Planning skills to\norganize required\nresources and\nequipment to meet\nlearning needs\n1.6 Reporting skills to\norganize information;\nassess information for\nrelevance and accuracy;\nidentify and elaborate\non learning outcomes\n1.7 Facilitation skills to\nconduct small group\ntraining sessions\n\n--- PDF PAGE 14 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n10\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Foster\nindividual and\nteam growth\n2.1. Learning and\ndevelopment program\ngoals and objectives\nare identified to match\nthe specific\nknowledge and skills\nrequirements of\ncompetency\nstandards\n2.2. Learning delivery\nmethods are\nappropriate to the\nlearning goals, the\nlearning style of\nparticipants and\navailability of\nequipment and\nresources\n2.3. Workplace learning\nopportunities and\ncoaching/ mentoring\nassistance are\nprovided to facilitate\nindividual and team\nachievement of\ncompetencies\n2.4. Resources and\ntimelines required for\nlearning activities are\nidentified and\napproved in\naccordance with\norganizational\nrequirements\n2.1 Advanced\ncoaching and\nmentoring\ntechniques\n2.2 Performance\nevaluation\nconcepts\n2.3 Training and\ndevelopment\ntechniques\n\n2.1 Instructional\nplanning and\ndelivery skills\n2.2 Monitoring and\nevaluation skills\n2.3 Mentoring and\ncoaching skills\n\n--- PDF PAGE 15 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n11\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Monitor and\nevaluate\nworkplace\nlearning\n3.1 Feedback from\nindividuals or teams is\nused to identify and\nimplement\nimprovements in\nfuture learning\narrangements\n3.2 Outcomes and\nperformance of\nindividuals/teams are\nassessed and\nrecorded to determine\nthe effectiveness of\ndevelopment\nprograms and the\nextent of additional\nsupport\n3.3 Modifications to\nlearning plans are\nnegotiated to improve\nthe efficiency and\neffectiveness of\nlearning\n3.4 Records and reports of\ncompetency are\nmaintained within\norganizational\nrequirement\n3.1 Types and levels\nof learning\nevaluation\n3.2 Learning styles\nand strategies\n3.3 Training and\ndevelopment\napproaches\n\n3.1 Instructional\nplanning and\ndelivery skills\n3.2 Monitoring and\nevaluation skills\n3.3 Mentoring and\ncoaching skills\n\n--- PDF PAGE 16 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n12\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n4. Develop team\ncommitment\nand\ncooperation\n4.1 Open communication\nprocesses to obtain\nand share information\nis used by team\n4.2 Decisions are\nreached by the team\nin accordance with its\nagreed roles and\nresponsibilities\n4.3 Mutual concern and\ncamaraderie are\ndeveloped in the team\n4.4 Career planning for\neach member are\nmonitored\n4.1 Career\ndevelopment for\ngroup members\n4.2 Principles of\nteam commitment\nand cooperation\n4.3 Team dynamics\nand performance\n4.1 Instructional\nplanning and\ndelivery skills\n4.2 Monitoring and\nevaluation skills\n4.3 Mentoring and\ncoaching skills\n5. Facilitate\naccomplishment\nof team goals\n5.1 Team members\nactively participated\nin team activities and\ncommunication\nprocesses\n5.2 Teams members\ndeveloped individual\nand joint\nresponsibility for their\nactions\n5.3 Collaborative efforts\nare sustained to\nattain organizational\ngoals\n5.1 Group\nDevelopment\nProcess and\nPrinciples as\napplied in the\nworkplace\n5.2 Principles of\norganizational\ndevelopment\n5.3 Collaboration\nprinciples and\nprocedures\n\n5.1\nInstructional\nplanning and\ndelivery skills\n5.2\nMonitoring and\nevaluation skills\n5.3\nMentoring and\ncoaching skills\n5.4\nOrganizational\nleadership\n\n--- PDF PAGE 17 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n13\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Learning and\n development needs\n\nMay include:\n1.1 Coaching, mentoring and/or supervision\n1.2 Formal/informal learning program\n1.3 Internal/external training provision\n1.4 Work experience/exchange/opportunities\n1.5 Personal study\n1.6 Career planning/development\n1.7 Performance appraisals\n1.8 Workplace skills assessment\n1.9 Recognition of prior learning\n1.10 Job design and enrichment\n2. Organizational\n requirements\nMay include:\n2.1 Quality assurance and/or procedures manuals\n2.2 Goals, objectives, plans, systems and processes\n2.3 Legal and organizational policy/guidelines and\n requirements\n2.4 Safety policies, procedures and programs\n2.5 Confidentiality and security requirements\n2.6 Business and performance plans\n2.7 Ethical standards\n2.8 Quality and continuous improvement processes and\nstandards\n3. Feedback on\n performance\nMay include:\n3.1 Formal/informal performance appraisals\n3.2 Obtaining feedback from supervisors and\ncolleagues\n3.3 Obtaining feedback from clients\n3.4 Personal and reflective behavior strategies\n3.5 Routine and organizational methods for monitoring\nservice delivery\n4. Learning delivery\n methods\nMay include:\n4.1 On the job coaching or mentoring\n4.2 Problem solving\n4.3 Presentation/demonstration\n4.4 Formal course participation\n4.5 Work experience\n4.6 Involvement in professional networks\n4.7 Conference and seminar attendance\n4.8 Induction\n\n--- PDF PAGE 18 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n14\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\nAssessment requires evidence that the candidate:\n1.1. Identified and implemented learning opportunities for others\n1.2. Gave and received feedback constructively\n1.3. Facilitated participation of individuals in the work of the team\n1.4. Negotiated learning plans to improve the effectiveness of learning\n1.5. Prepared learning plans to match skill needs\n1.6. Accessed and designated learning opportunities\n2. Resource\nImplications\nThe following resources should be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2.\nMaterials relevant to the proposed activity or tasks\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1. Observation of work activities of the individual member in relation\nto the work activities of the group\n3.2. Observation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3. Case studies and scenarios as a basis for discussion of issues\nand strategies in teamwork\n4. Context for\nAssessment\n4.1. Competency may be assessed in workplace or in a simulated\nworkplace setting\n4.2. Assessment shall be observed while tasks are being undertaken\nwhether individually or in-group\n\n--- PDF PAGE 19 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n15\nUNIT OF COMPETENCY :\nPERFORM HIGHER-ORDER THINKING PROCESSES\nAND APPLY TECHNIQUES IN THE WORKPLACE\n\nUNIT CODE\n: 500311403\n\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes required\n\nto use fundamental critical thinking skills in the workplace.\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Evaluate\neffectiveness\nand efficiency\nof the\nworkplace\nsystems,\nprocesses and\nprocedures.\n1.1 Effectiveness and\nefficiency of\nworkplace standards\nand procedures are\nexamined.\n1.2. Usage of inquiry and\ndialogue to\ncommunicate\nevaluation measures\nand results are\nimplemented.\n1.3 Evaluation reports are\nprepared and\ncommunicated to team\nmembers.\n\n1.1 Systems,\nstandards,\nprocedures and\nprotocols in the\nworkplace.\n1.2 Different methods\nof critical and\nappreciative\ninquiry and their\nrelevance to\ndifferent\nsituations\n1.3 Techniques to\nassist in forming\nthe habit of\nasking questions\nand taking\nresponsibility for\nanswers.\n1.4 Why questions\nare important and\nthe benefits of\nasking good\nquestions for\nindividuals,\nbusinesses and\ncommunities (the\nimportance of\ncritical thinking).\n1.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning, attention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n1.2 Communicating to\nactively listen and\nto ask questions of\nothers in a\nconstructive way.\n1.3 Using critical\nthinking pathway to\nformulate and ask\nrelevant questions\nand come up with\nappropriate\nanswers.\n1.4 Performing\nassimilation and\naccommodation\nskills to interpret\nand distil key\ninformation of\nrelevance to a\ngiven situation.\n1.5 Assessing and\nmeasuring the\nextent of\neffectiveness and\nefficiency of the\nsystems, processes\nand procedures in\nthe workplace.\n\n--- PDF PAGE 20 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n16\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Foster the\nhabit of critical\ninquiry and\ncuriosity in the\nworkplace.\n2.1 Issues and situations\nare reflected on and\nwondered about.\n2.2 Issues and problems\nin the workplace\nparticularly in the\npolicies, procedures\nand protocols are\ndiscussed and\nevaluated between\nand among teams.\n2.3 Evaluation of\nefficiency and\neffectiveness of\nworkplace policies,\nprocedures and\nprotocols are\ndocumented,\ncommunicated and\nagreed upon between\nand among teams.\n2.4 Growth mindset and\npositive relationship\nand communication is\napplied in the context\nof curiosity and\ncritical inquiry in the\nworkplace.\n2.1 Different methods\nof critical and\nappreciative\ninquiry and their\nrelevance to\ndifferent\nsituations.\n2.2 Techniques to\nassist in forming\nthe habit of\nasking questions\nand taking\nresponsibility for\nanswers.\n2.3 Why questions\nare important and\nthe benefits of\nasking good\nquestions for\nindividuals,\nbusinesses and\ncommunities (the\nimportance of\ncritical thinking).\n2.4 Growth mindset\nand positive\ncommunication\nand relationship\nstrategies and\ntechniques.\n2.1 Using range of\nanalytical\ntechniques (e.g.,\nplanning, attention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n2.2 Communicating to\nactively listen and to\nask questions of\nothers in a\nconstructive way.\n2.3 Using critical\nthinking pathway to\nformulate and ask\nrelevant questions\nand come up with\nappropriate\nanswers.\n2.4 Performing\nassimilation and\naccommodation\nskills to interpret and\ndistil key information\nof relevance to a\ngiven situation.\n2.5 Assessing and\nmeasuring the\nextent of\neffectiveness and\nefficiency of the\nsystems, processes\nand procedures in\nthe workplace.\n2.6 Communicating\ninsights on\nworkplace\neffectiveness and\nefficiency.\n\n--- PDF PAGE 21 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n17\n\nELEMENTS\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n3. Develop\npractical\naction plans\nfor improving\nworkplace\nconditions.\n3.1 Evaluation of efficiency\nand effectiveness of\nworkplace policies,\nprocedures and\nprotocols are\ndocumented,\ncommunicated to\nstakeholders.\n3.2 Practical action plans\nin improving workplace\nconditions are\nformulated, presented\nand negotiated with\nstakeholders.\n3.3 Proposed changes and\ndirections are inquired,\nprocessed and\nnegotiated between\nand among teams, and\nstakeholders as well of\nthe organization.\n3.4 Commitment to\ncontinuous\nimprovement and\nchange is highlighted.\n3.5 Passion and dedication\nfor changing and\nadapting to the\ndemands of the 21st\ncentury workplace are\nconsidered.\n3.1 Different methods\nof critical and\nappreciative\ninquiry and their\nrelevance to\ndifferent\nsituations.\n3.2 Techniques to\nassist in forming\nthe habit of\nasking questions\nand taking\nresponsibility for\nanswers.\n3.3 Why questions\nare important and\nthe benefits of\nasking good\nquestions for\nindividuals,\nbusinesses and\ncommunities (the\nimportance of\ncritical thinking).\n3.4 Growth mindset\nand positive\ncommunication\nand relationship\nstrategies and\ntechniques.\n3.5 Creative\nnegotiation skills.\n3.6 Change\nmanagement and\ncontinuous\nimprovement\nconcepts.\n3.1 Using range of\nanalytical techniques\n(e.g., planning,\nattention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n3.2 Communicating to\nactively listen and to\nask questions of\nothers in a\nconstructive way.\n3.3 Using critical thinking\npathway to formulate\nand ask relevant\nquestions and come\nup with appropriate\nanswers.\n3.4 Performing\nassimilation and\naccommodation\nskills to interpret and\ndistil key information\nof relevance to a\ngiven situation.\n3.5 Assessing and\nmeasuring the extent\nof effectiveness and\nefficiency of the\nsystems, processes\nand procedures in\nthe workplace.\n3.6 Communicating\npractical insights on\nimproving workplace\nconditions.\n\n--- PDF PAGE 22 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n18\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Effectiveness and\nefficiency\nMay include;\n1.1 Developing a more efficient way of doing something\n1.2 Developing a new idea\n1.3 Developing and improving products and services\n1.4 Enhancing skills and career opportunities\n1.5 Enhancing the physical environment\n1.6 Financial benefit\n1.7 Greater personal satisfaction\n1.8 Improving interpersonal relationships\n1.9 Evaluating overall workplace conditions\n2. Curiosity and critical\ninquiry\nMay include:\n2.1\nAccuracy\n2.2\nBreadth\n2.3\nClarity\n2.4\nDepth\n2.5\nEmotion\n2.6\nFairness\n2.7\nLogic\n2.8\nMeaning\n2.9\nPlanning\n2.10 Attention\n2.11 Precision\n2.12 Relevance\n2.13 Significance\n2.14 Social engagement\n2.15 Society\n2.16 Style\n2.17 Growth mindset\n2.18 Positive communication\n2.19 Positive negotiation\n2.20 Workplace conditions\n2.21 Appreciative inquiry methods\n\n--- PDF PAGE 23 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n19\nVARIABLE\nRANGE\n3. Practical action plans\nMay include:\n3.1 Insights on continuous improvement\n3.2 Creative strategies and techniques for becoming better\nat work and real life\n3.3 Career plans\n3.4 Challenging workplace policies, procedures and\nprotocols\n3.5 Specifying plans for change and adapting to the\ndemands of the contemporary workforce\n3.6 Challenges in negotiating with stakeholders and teams\n3.7 Change management, innovation and knowledge\ncreation\n3.8 Contractual agreements\n3.9 Extreme time pressure or non-negotiable deadlines\n3.10 Financial limitations\n3.11 Procedures determined by laws or other regulations\n3.12 Safety issues\n3.13 When others are totally closed to new ideas\n3.14 acknowledging shared responsibility\n3.15 adopting a positive 'can do' attitude\n3.16 following up on practical details\n3.17 pro-actively seeking information\n3.18 suggesting a new approach\n3.19 talking to others about possible answers\n3.20 constraints of the broader context and environment\n3.21 overall goal - what needs to be achieved\n3.22 personal hopes and expectations\n\n--- PDF PAGE 24 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n20\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nEvaluated the effectiveness and efficiency of workplace\nsystems, processes and procedures.\n1.2\nModelled the conscious process of critical inquiry to get new\ninsights that s/he can get in formulating action plans on\ncontinuous improvement in the workplace and real-life\n1.3\nPracticed the habit of critical inquiry and curiosity in the\nworkplace\n1.4\nShown a thorough knowledge and understanding of how\ncritical thinking impacts on individual lives, the broader\ncommunity and work situations.\n1.5\nDeveloped practical action plans for improving workplace\nconditions.\n2. Resource\nImplications\n2.1.\nInteractions with specific challenges and situations to\ndemonstrate the application of critical thinking (this would\nusually involve interactions with others).\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nDirect questioning combined with review of portfolios of\nevidence and third-party workplace reports of on-the-job\nperformance by the candidate\n3.2\nEvaluation of a candidate blog exploring different ideas and\nquestions\n3.3\nReview of candidate response to scenarios that allow the\ncandidate to apply critical thinking techniques to a life or work\nsituation, and to demonstrate ability to portray curiosity and\nexploration of new concepts\n3.4\nEvaluation of candidate response to the challenge of\nadopting different perspectives on a situation, and ability to\nboth develop and respond to questions from those\nperspectives\n3.5\nObservation of the candidate participating in a group\nproblem-solving session\n3.6\nOral or written questioning to assess knowledge of typical\nblockers to the critical thinking process.\n3.7\nLife Narrative Inquiry to reflect life stories that reflect how\ncritical thinking and problem solving is applied in the lives.\n4. Context for\nAssessment\n4.1.\nIn all workplace, it may be appropriate to assess this unit\nconcurrently with relevant teamwork or operation units.\n\n--- PDF PAGE 25 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n21\nUNIT OF COMPETENCY : CONTRIBUTE TO THE PRACTICE OF SOCIAL\nJUSTICE IN THE WORKPLACE\n\nUNIT CODE\n: 500311404\n\nUNIT DESCRIPTOR\n: This unit covers ways and means to assume active roles in\nresolving local and global challenges and to become\nproactive contributors to a more peaceful and sustainable\nworld.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Update self\non local,\nnational and\nglobal\ntrends/\nissues in the\nworkplace\n1.1 Media are regularly\nscanned/ monitored\nfor trends and issues\nrelevant to human\nrights, 