        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified product requirements\n1.2 Identified die material parameters\n1.3 Determined equipment\n1.4 Observed safety practices in accordance with OSH\nstandards\n1.5 Communicated effectively with others to ensure\neffective work operation\n2. Resource implications\n\nThe following resources should be provided:\n2.1 Sample product\n2.2 Product drawing\n2.3 Reference books\n2.4 Instruction\n2.5 Manuals\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Direct observation/ demonstration with oral questioning\n4. Context for assessment\n\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter\n\n--- PDF PAGE 87 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n83\nUNIT OF COMPETENCY\n\n :\nPERFORM CAD OPERATION\n\nUNIT CODE\n\n :"
        },
        "source_text": "MEE722321\n\nUNIT DESCRIPTOR : This unit covers the skills and knowledge required to\ndetermine die design parameters in accordance with product\nspecifications.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify product\nrequirements\n\n1.1 Product material is\nidentified as\nrequired.\n1.2 Die classification is\ndetermined based on\nproduction volume.\n1.3 Production process\nis identified based on\nproduct requirements\nin all situations\n1.1 Customer\nexpectations\n1.2 Types and\nproperties of\nproduct material\n1.3 Die classification\n1.4 Types of production\nprocess\n1.5 OSH Rule No. 1060\n– Premises of\nEstablishments\n1.6 OSH Rule No. 1070\n– Occupational\nHealth &\nEnvironmental\nControl\n\n1.1 Identifying product\nmaterial\n1.2 Determining die\nclassification\n1.3 Identifying\nproduction\nprocess(es)\n\n2. Identify die\nmaterial\nparameters\n\n2.1 Die material\nrequirements are\nidentified as\nrequired.\n2.2 Production volume\nis determined based\non product\nrequirements.\n2.3 Design parameters\nare identified based\non product\nrequirements.\n2.1 Company Policy\n2.2 Handbooks and\ncatalogs\n2.3 Types of material\n2.4 Properties of\nmaterial\n2.5 Metrology\n2.6 Calculation\n2.7 Material selection\n2.8 Standard parts\nidentification\n2.9 OSH Rule No.\n1060 – Premises\nof Establishments\n2.10 OSH Rule No.\n1070 –\nOccupational\nHealth &\nEnvironmental\nControl\n\n2.1 Identifying die\nmaterial\nrequirements\n2.2 Determining\nproduction volume\n2.3 Identifying design\nparameters\n\n--- PDF PAGE 84 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n80\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range\nof Variables\n\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Determine\nequipment\n3.1. Press machine type\nend capacity is\ndetermined based on\ndie requirements.\n3.2. Product volume is\ndetermined based on\ncycle time.\n3.3. Die design is\ndetermined based on\ntype of Machine\n3.1 Customer\nexpectations\n3.2 Manuals and\ncatalogs\n3.3 Principles of press\nworking\n3.4 Calculation\n3.5 Types of machines\n3.6 Parts and\nfunctions of\nequipment\n3.7 OSH Rule No.\n1060 – Premises\nof Establishments\n3.8 OSH Rule No.\n1070 –\nOccupational\nHealth &\nEnvironmental\nControl\n3.9 OSH Rule No.\n1080 – Personal\nProtective\nEquipment &\nDevices\n3.10 OSH Rule No.\n1200 – Machine\nGuarding\n3.11 Noise pollution\n3.12 Air pollution\n3.1 Determining press\nmachine capacity\n3.2 Determining\nproduct volume\n3.3 Determining die\ndesign\n\n--- PDF PAGE 85 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n81\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Product material\nMay include:\n1.1 Metallic\n1.2 Non-metallic\n2. Die classification\nMay include:\n2.1 Simple\n2.2 Compound\n2.3 Progressive\n2.4 Combination\n2.5 Compression\n3. Production process\nMay include:\n3.1 Rolling\n3.2 Extrusion\n3.3 Press working\n4. Die material\nMay include:\n4.1 Carbon steel\n4.2 Alloyed steel\n4.3 Cast steel\n4.4 Cast iron\n4.5 Carbide\n4.6 High speed steel\n5. Production volume\nMay include:\n5.1 Short run\n5.2 Medium run\n5.3 Long run\n6. Design parameters\nMay include:\n6.1 Clearance\n6.2 Dimension\n6.3 Allowance\n6.4 Surface finish\n6.5 Hardness\n6.6 Standard parts\n7. Machine capacity\nMay include:\n7.1 Tonnage\n7.2 Shot height\n7.3 Table size\n7.4 Shank dimension\n8. Type of Machine\nMay include:\n8.1 Press machine\n 8.1.1 Mechanical\n 8.1.2 Hydraulic\n 8.1.3 Pneumatic\n8.1.4 Combination\n8.1.5 Knuckle\n8.2 Rolling Machine\n8.3 Extrusion machine\n\n--- PDF PAGE 86 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n82\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1 Identified product requirements\n1.2 Identified die material parameters\n1.3 Determined equipment\n1.4 Observed safety practices in accordance with OSH\nstandards\n1.5 Communicated effectively with others to ensure\neffective work operation\n2. Resource implications\n\nThe following resources should be provided:\n2.1 Sample product\n2.2 Product drawing\n2.3 Reference books\n2.4 Instruction\n2.5 Manuals\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1 Written examination\n3.2 Direct observation/ demonstration with oral questioning\n4. Context for assessment\n\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter\n\n--- PDF PAGE 87 ---\nDie Designing NC IV Revision 00 Promulgated 05/21/2019\n83\nUNIT OF COMPETENCY\n\n :\nPERFORM CAD OPERATION\n\nUNIT CODE\n\n :"
