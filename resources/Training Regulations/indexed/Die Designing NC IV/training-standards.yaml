ure-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n4.4 Perform basic\ncalculation\ninvolving ration\nand proportion\n•\nDescribe simple calculation\ninvolving ratios and proportion\nusing whole numbers, fractions\nand decimal fraction\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n4.5 Perform\ncalculations on\nalgebraic\nexpressions\n• Explain simple calculations on\nalgebraic expressions using the\nfour fundamental operations\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n5. Measure\nworkpiece\n(basic)\n\n5.1 Select and use\nmeasuring tools\n• Determine Measuring tools to be\nused according to the level of\naccuracy required\n• Determine appropriate measuring\ntechnique\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n8 Hours\n5.2 Clean and store\nmeasuring tools\n•\nExplain Care and storage of\ndevices according to\nmanufacturer’s specifications\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n--- PDF PAGE 118 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n114\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n6. Perform\nroutine\nhousekeeping\n\n6.1 Organize work\narea\n•\nDetermine workshop policy to work\narea\n\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n8 Hours\n6.2 Clean work area\n•\nDescribe work shop policies and\nprocedure in specific work area\n•\nDescribe signage’s displayed in\nthe work area\n•\nKnow how to clean and used tools\nand equipment according to\nmanufacturer’s specification\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n7. Perform shop\ncomputations\n(Intermediate)\n\n7.1 Perform\ncalculations\ninvolving triangles\n•\nKnow how to calculate problems\ninvolving right triangle using\ntrigonometric function.\n•\nKnow how to calculate problems\ninvolving non-right triangle using\nsine and cosine rules.\n•\n\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n10 Hours\n7.2 Calculate taper\n•\nKnow how to calculate taper using\nappropriate formula\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n8. Measure\nworkpiece\nusing angular\nmeasuring\ninstruments\n8.1 Select and use\nangular\nmeasuring tools\n•\nDetermine angular measuring tools\naccording to level of accuracy\n•\nDetermine measuring techniques\nto the device.\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n8 Hours\n\n8.2 Maintain angular\nmeasuring tools\n•\nKnow how to adjust and\nmaintained the measuring tools to\nthe required accuracy according to\nworkplace procedures\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n--- PDF PAGE 119 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n115\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n8.3 Clean and store\nmeasuring tools\n•\nExplain Care and storage\naccording to standard operating\nprocedures\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n9. Measure\nworkpiece\nusing gages\nand surface\ntexture\ncomparator\n\n9.1 Select and use\nfixed and\nadjustable gages\n•\nDetermine Appropriate gages\nrequired\n•\nKnow and obtained accurate\nmeasurement according to drawing\nspecification\n•\nDetermine measuring technique of\nthe device\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n8 Hours\n9.2 Perform surface\ntexture\nmeasurements\n•\nDetermine surface texture\naccording to worksite procedure\n•\nObtain measurements according to\nlevel of accuracy\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n9.3 Clean and store\nmeasuring tools\n•\nExplain care and storage according\nto standard operating procedures\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n10. Perform\npreventive\nand corrective\nmaintenance\n\n10.1 Perform\ninspection of\nmachine\n•\nKnow how to inspect machines\naccording to worksite procedure\n•\nPrepare statue reports according to\nworksite procedure\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n8 Hours\n10.2 Perform cleaning\nand lubricating of\nmachine\n•\nKnow how to lubricate machines\nusing appropriate tools\n•\nKnow when to lubricate machines\naccording prescribe schedule\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n--- PDF PAGE 120 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n116\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n10.3 Perform minor\nmachine repair\nand adjustments\n\n•\nKnow how to perform minor\nmachine repair according to\nworksite procedure\n•\nKnow how to adjust machine\nmoving parts according to\nmanufacturer’s specification\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n10.4 Maintain hand\ntools\n•\nKnow how to grind cutting tools