ions\nand decimals\n• Explain simple calculation\nperformed involving fraction and\ndecimal using four fundamentals\noperations\n• Know how to convert decimal to\nfraction and vice versa\n\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n4.3 Perform basic\ncalculations\ninvolving\npercentages\n•\nKnow and obtain percentages from\ninformation using simple\ncalculation\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n4.4 Perform basic\ncalculation\ninvolving ration\nand proportion\n•\nDescribe simple calculation\ninvolving ratios and proportion\nusing whole numbers, fractions\nand decimal fraction\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n4.5 Perform\ncalculations on\nalgebraic\nexpressions\n• Explain simple calculations on\nalgebraic expressions using the\nfour fundamental operations\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n5. Measure\nworkpiece\n(basic)\n\n5.1 Select and use\nmeasuring tools\n• Determine Measuring tools to be\nused according to the level of\naccuracy required\n• Determine appropriate measuring\ntechnique\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n8 Hours\n5.2 Clean and store\nmeasuring tools\n•\nExplain Care and storage of\ndevices according to\nmanufacturer’s specifications\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n--- PDF PAGE 118 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n114\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n6. Perform\nroutine\nhousekeeping\n\n6.1 Organize work\narea\n•\nDetermine workshop policy to work\narea\n\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n8 Hours\n6.2 Clean work area\n•\nDescribe work shop policies and\nprocedure in specific work area\n•\nDescribe signage’s displayed in\nthe work area\n•\nKnow how to clean and used tools\nand equipment according to\nmanufacturer’s specification\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n7. Perform shop\ncomputations\n(Intermediate)\n\n7.1 Perform\ncalculations\ninvolving triangles\n•\nKnow how to calculate problems\ninvolving right triangle using\ntrigonometric function.\n•\nKnow how to calculate problems\ninvolving non-right triangle using\nsine and cosine rules.\n•\n\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n10 Hours\n7.2 Calculate taper\n•\nKnow how to calculate taper using\nappropriate formula\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n8. Measure\nworkpiece\nusing angular\nmeasuring\ninstruments\n8.1 Select and use\nangular\nmeasuring tools\n•\nDetermine angular measuring tools\naccording to level of accuracy\n•\nDetermine measuring techniques\nto the device.\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n8 Hours\n\n8.2 Maintain angular\nmeasuring tools\n•\nKnow how to adjust and\nmaintained the measuring tools to\nthe required accuracy according to\nworkplace procedures\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n--- PDF PAGE 119 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n115\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n8.3 Clean and store\nmeasuring tools\n•\nExplain Care and storage\naccording to standard operating\nprocedures\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n9. Measure\nworkpiece\nusing gages\nand surface\ntexture\ncomparator\n\n9.1 Select and use\nfixed and\nadjustable gages\n•\nDetermine Appropriate gages\nrequired\n•\nKnow and obtained accurate\nmeasurement according to drawing\nspecification\n•\nDetermine measuring technique of\nthe device\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n8 Hours\n9.2 Perform surface\ntexture\nmeasurements\n•\nDetermine surface texture\naccording to worksite procedure\n•\nObtain measurements according to\nlevel of accuracy\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n9.3 Clean and store\nmeasuring tools\n•\nExplain care and storage according\nto standard operating procedures\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n10. Perform\npreventive\nand corrective\nmaintenance\n\n10.1 Perform\ninspection of\nmachine\n•\nKnow how to inspect machines\naccording to worksite procedure\n•\nPrepare statue reports according to\nworksite procedure\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n8 Hours\n10.2 Perform cleaning\nand lubricating of\nmachine\n•\nKnow how to lubricate machines\nusing appropriate tools\n•\nKnow when to lubricate machines\naccording prescribe schedule\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n--- PDF PAGE 120 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n116\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n10.3 Perform minor\nmachine repair\nand adjustments\n\n•\nKnow how to perform minor\nmachine repair according to\nworksite procedure\n•\nKnow how to adjust machine\nmoving parts according to\nmanufacturer’s specification\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n10.4 Maintain hand\ntools\n•\nKnow how to grind cutting tools\naccording to recommended\nspecification\n\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Written\nExamination\n• Oral Questioning\n11. Operate a\npersonal\ncomputer\n11.1 Start the\ncomputer\n\n•\nObtained properly connected\nperipheral devices\n•\nKnow how to proper logging in and\nlogging off\n•\nKnow how to check system\nfeatures and hardware\nconfiguration\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n16\nhours\n\n11.2 Arrange and\ncustomize\ndesktop display/\nWindows\nsettings\n•\nKnow how to add, rename, move,\ncopy and delete desktop icon\n•\nKnow how to access online help\n•\nKnow how to select and desktop\nicons of application program\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n11.3 Work with files\nand folders (or\ndirectories\n•\nKnow how to create, open, move,\nrename and copy a file or folder\n•\nKnow how to organize various files\n•\nKnow how to search files and\ninformation\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n11.4 Work with user\napplication\nprograms\n•\nKnow how to add, change remove\nand ran application program\n•\nKnow how to install, update and\nupgrade software and application\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n--- PDF PAGE 121 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n117\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n11.5 Print information\n•\nKnow how to install printer program\nand ensure correct printer setting\n\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n11.6 Shut down\ncomputer\n•\nKnow how to properly shut down\ncomputer and peripheral devices\n\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n--- PDF PAGE 122 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n118\n\nCORE COMPETENCIES\n(257 Hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Determine die\ndesign\nparameters\n1.1\nIdentify product\nrequirements\n•\nExamine the product drawing\nincluding product sample and\nascertain the material and\nproduction volume requirement\n•\nKnow how to identify appropriate\ndie classification and production\nprocess\n•\nDetermine design parameters\nusing product and production data\n• Lecture-Discussion\n• Demonstration\n• Interaction\n• Video presentation\n• Practical Exercises\n\n• Written\nExamination\n• Observation\n• Oral Questioning\n4 hrs\n1.2\nIdentify die\nmaterial\nparameters\n\n•\nExplain how to select appropriate\ndie material based on selected\nproduction process\n•\nDescribe the properties of different\ndie materials\n•\nDetermine die design parameters\nusing die material and production\nvolume data\n• Lecture-Discussion\n• Demonstration\n• Interaction\n• Video presentation\n• Practical Exercises\n\n• Written\nExamination\n• Observation\n• Oral Questioning\n4 hrs\n1.3\nDetermine\nappropriate\nequipment\n•\nExplain how to select appropriate\nmachine capacity\n•\nDescribe the parts and functions of\nvarious types of machine\n\n• Lecture-Discussion\n• Demonstration\n• Interaction\n• Video presentation\n• Practical Exercises\n• Written\nExamination\n• Observation\n\n• Oral Questioning\n3 hrs\n2. Perform CAD\noperation\n2.1\nDetermine job\nrequirements\n\n•\nKnow and obtain the required\ninformation to perform CAD\noperation\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n4 hrs\n\n2.2 Prepare the\nCAD\nenvironment\n\n•\nExplain the features of the CAD\nsoftware package\n•\nSet the CAD software package to\nrequired environment\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Written\nExamination\n• Observation\n• Oral Questioning\n40 hrs\n\n--- PDF PAGE 123 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n119\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n2.3 Create 3D CAD\ndrawings\n\n•\nKnow and explain the steps in\npreparing and modifying 3D CAD\ndrawings\n•\nPerform step-by-step process to\ncreate 3D CAD drawings\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Tutorial\n• Observation\n• Oral Questioning\n• Demonstration\n• Evaluation\n80 hrs\n\n2.4 Save 3D CAD\ndrawing\n•\nSave drawing files in accordance\nwith standard operating procedures\n•\nClose CAD program and shutdown\ncomputer\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Observation\n• Oral Questioning\n8 hrs\n3. Simulate and\nverify die\ndesign\n3.1 Determine job\nrequirements\n•\nIdentify and describe possible\nproduct material flaws\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Written\nExamination\n• Oral Questioning\n4 hrs\n3.2 Prepare the\nCAD\nenvironment\n•\nExplain the simulation features of\nthe CAD package\n• Set the CAD software to required\nsimulation toolbars and\nenvironment\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Written\nExamination\n• Observation\n• Oral Questioning\n16 hrs\n3.3 Simulate and\nverify 3D CAD\ndrawings\n• Know and explain the steps in\nsimulating and verifying 3D CAD\ndrawings\n• Perform step-by-step process to\nsimulate and verify 3D CAD\ndrawings\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Tutorial\n• Observation\n• Oral Questioning\n• Demonstration\n• Evaluation\n24 hrs\n3.4 Save\nsimulation\nresults\n•\nSave simulation results in\naccordance with standard\noperating procedures\n• Close CAD program and shutdown\ncomputer\n\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Observation\n• Oral Questioning\n4 hrs\n\n--- PDF PAGE 124 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n120\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n4. Modify and\nfinalize die\ndesign\n\n4.1 Prepare the\nCAD\nenvironment\n\n•\nSet the CAD software package to\nrequired environment\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Written\nExamination\n• Observation\n• Oral Questioning\n2 hrs\n4.2 Modify 3D CAD\ndrawings\n\n•\nKnow and explain the steps in\nmodifying and finalizing 3D CAD\ndrawings\n•\nPerform step-by-step process to\nmodify and finalize 3D CAD drawings\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Tutorial\n• Observation\n• Oral Questioning\n• Demonstration\n• Evaluation\n4 hrs\n4.3 Save modified\n3D CAD\ndrawings\n\n•\nSave modified 3D CAD drawings in\naccordance with standard operating\nprocedures\n•\nClose CAD program and shutdown\ncomputer\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Observation\n• Oral Questioning\n2 hrs\n5. Create\nfabrication\ndrawing\n5.1 Prepare\nassembly\ndrawings\n\n•\nKnow and explain the steps in\npreparing and modifying assembly\ndrawings\n•\nPerform step-by-step process to\ncreate assembly drawings\n•\nSave assembly drawing files in\naccordance with standard operating\nprocedures\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Tutorial\n• Observation\n• Oral Questioning\n• Demonstration\n• Evaluation\n16 hrs\n5.2 Prepare parts\ndrawing\n\n•\nKnow and explain the steps in\npreparing and modifying parts\ndrawings\n• Perform step-by-step process to\ncreate parts drawings\n• Save parts drawings files in\naccordance with standard operating\nprocedures\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Tutorial\n• Observation\n• Oral Questioning\n• Demonstration\n• Evaluation\n40 hrs\n5.3 Print drawings\n\n•\nPrint assembly and parts drawings in\naccordance with standard operating\nprocedures\n•\nClose CAD program and shutdown\ncomputer\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n• Observation\n• Oral Questioning\n2 hrs\n\n--- PDF PAGE 125 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n121\n\n3.1 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or recognized\nindustry sector; (Learning system is driven by competencies written to industry\nstandards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to the\nindustry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into account\nbut requires evidence of actual performance of the competency as the primary\nsource of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2.\nThe competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can be\nreferred to the Implementing Rules and Regulations of the DTS Law and the\nTESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video, computer\ntechnologies or other modern technology that can be used to facilitate learning\n\n--- PDF PAGE 126 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n122\n\nand formal and non-formal training. Specific guidelines on this mode shall be\nissued by the TESDA Secretariat.\n\n• The classroom-based or in-center instruction uses of learner-centered\nmethods as well as laboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement may\nbe written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant period\nof time, usually between one and four years, while the apprentice commits to\ncontributing productively to the work of the business. Training is integrated into\nthe production process and apprentices learn by working alongside the\nexperienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the company\nin accordance with the requirements of the specific company. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs conducted by\nnon-government organizations (NGOs), LGUs, training centers and other TVET\nproviders which are intended to address the specific needs of a community. Such\nprograms can be conducted in informal settings such as barangay hall, basketball\ncourts, etc. These programs can also be mobile training program (MTP).\n\n--- PDF PAGE 127 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n123\n\n3.2\nTRAINEE ENTRY REQUIREMENTS\n\n Trainees or students wishing to enroll in this course should possess the following\nrequirements:\n\n•\nTechnology Graduate or have completed basic engineering course\n•\nComputer literate with CAD background\n•\nIndustrial experience in die making with CNC background\n•\nCan communicate both orally and in writing\n•\nCan perform mathematical computation (including the application of strength of\nmaterials)\n\n3.3\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 10 trainees\nfor DIE DESIGN NC IV are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\n10 unit\n3D CAD\nsoftware\nlicense\n10 unit\nWorkstation\n(As per minimum\nrequirement of design\nand manufacturing\nsoftware)\n2 rim\nBond paper (A4 &\nA3 size)\n10 unit\nCAD\nSimulation\nsoftware\nlicense\n1 unit\nPrinter (A4/A3 size)\n\n5 units\nPrinter ink (black/\ncolored)\n10 unit\nCaliper\n(300mm)\n1 unit\nCopier machines (A3/A4\nsize)\n1 lot\nToner\n10 unit\nMicrometer\n1 unit\nPlotter (Optional)\n1 lot\nWhit board markers\n& Eraser\n10 unit\nScientific\nCalculator\n1 unit\nDigital light projector\n10 pcs\nMechanical Pencil\n10 pcs.\nSteel Rule\n1 lot\nAudio system\n10 pcs. Eraser\n10 unit\nChairs\n\n10 unit\nTable\n\n5 unit\nLocker\ncabinet\n\n1 lot\npresentation\nmaterials\n\n1 unit\nWhite board\n\n1 lot\nReferences\n\n--- PDF PAGE 128 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n124\n\n3.4\nTRAINING FACILITIES\n\nBased on class intake of 10 students/trainees.\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nLecture Area\n5 x 8\n40\n1\n40\nLaboratory Area\n5 x 8\n40\n1\n40\nTool Room / Storage\nArea\n4 x 5\n20\n1\n20\nWash, Toilet & Locker\nRoom\n1 x 2\n2\n1\n2\n Total Area\n102\n\nNote:\n\nTraining center may enter into a Memorandum of Understanding (MOU) with an\ninstitution/company with appropriate equipment and facilities.\n\n3.5\nTRAINERS QUALIFICATION FOR DIE DESIGNING NC IV\n\n•\nHolder of National TVET Trainer Certificate Level I (NTTC Level I) in DIE\nDESIGNING NC IV\n•\nAt least technology graduate related to Mechanical Engineering\n•\nMust be computer literate\n•\nMust have at least 3 years experience in Die Designing with working knowledge\nin CNC programming and machining or at least 5 years teaching experience and\n240 hours relevant training in Die Designing and Fabrication\n•\nMust have at least 2 years experience in designing using CAD software.\n\n3.6\nINSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is gathering of evidences to determine the achievements of\nthe requirements of the qualification to enable the trainer make judgement whether the\ntrainee is competent or not competent.\n\n--- PDF PAGE 129 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n125"
