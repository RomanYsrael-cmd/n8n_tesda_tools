2 Foster the habit\nof critical inquiry\nand curiosity in\nthe workplace\n• Discuss different methods of critical and\nappreciative inquiry and their relevance to\ndifferent situations\n• Form habit of asking questions and taking\nresponsibility for answers\n• Appreciate importance of why questions\nfor individuals, businesses and\ncommunities\n• Use range of analytical techniques, growth\nmindset and positive communication\nstrategies\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n• Discuss insights on workplace\neffectiveness and efficiency\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n3.3 Develop practical\naction plans for\nimproving\nworkplace\nconditions\n• Use range of analytical techniques, growth\nmindset and positive communication\nstrategies in developing action plans for\nefficiency and effectiveness\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n• Discuss concepts creative negotiation\nskills, change management and\nimprovement strategies\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n• Project-based\nlearning\n2 Hours\n\n--- PDF PAGE 109 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n105\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n4. Contribute to\nthe practice of\nsocial justice in\nthe workplace\n\n4.1 Update self on\nlocal, national\nand global trends/\nissues in the\nworkplace\n• Explain the local, national and global\nsystems and structures\n• Discuss issues affecting interaction and\nconnectedness of communities at local,\nnational and global levels\n• Explain underlying assumptions and\npower dynamics (politics, understanding\npolitical system, social structures, labor\nlaws, labor relations, human right)\n• Monitor trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity using different media platforms\n• Analyze trends and issues relevant to\nhuman rights, gender equality, culture of\npeace, global citizenship, and cultural\ndiversity\n• Engage in discourse about the local,\nnational and global issues\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions and\ninteractive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 Hour\n\n4.2 Relate local and\nglobal trends to\nworkplace\ncontext\n• Discuss the different levels of human\nidentity according to Amber Mayer (2015)\n• Explain different communities people\nbelong to and how these are connected\n• Recognize cultural differences and respect\nfor cultural diversity\n• Recognize differences and commonalities\namong people\n• Demonstrate attitudes of empathy,\nsolidarity and respect for diversity\n• Connect local issues to global trends, and\nvice versa.\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions and\ninteractive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n1 Hour\n\n--- PDF PAGE 110 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n106\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n4.3 Engage and take\nactions on\nworkplace issues\nand concerns\n• Identify the actions that can be taken\nindividually and collectively\n• Describe ethically responsible behaviour\n• Explain the importance and benefits of\ncivic engagement\n• Employ appropriate actions to address\nworkplace issues involving national and\nglobal trends\n• Show concern and willingness to take part\nin the development efforts to discuss\nworkplace issues and concerns\n• Apply the attitude of “thinking globally and\nacting locally” in the workplace\n• Interactive Lecture\n• Small Group\nDiscussion\n• Brainstorming\n• Role-playing\n• Demonstration\nor simulation\nwith oral\nquestioning\n• Group\ndiscussions and\ninteractive\nactivities\n• Case studies/\nproblems\ninvolving\nworkplace\ndiversity issues\n• Written\nexamination\n(Essay)\n• Role Playing\n1 Hour\n5. Manage\ninnovative\nwork\ninstructions\n5.1 Review and\nanalyze existing\nworkplace\npractices\n• Show mastery of basic management\nconcepts according to Gallup, nine\ndimensions of innovative practices and\nclimate; and different types of innovation\n• Contextualize innovation to different\nvariables in the organization\n• Review current organizational practices\nwhere innovation is contextualized\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\n1 Hour\n\n--- PDF PAGE 111 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n107\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\nvirtues applied\n\n5.2 Examine\nopportunities for\ncontinuous\nimprovement and\ninnovation of\npractices in the\nworkplace\n\n• Show mastery of the determinants of\ninnovative behaviors and principles of\ninnovation\n• Review current organizational practices\nwhere innovation is contextualized\n• Evaluate innovative practices in the\norganization\n• Assess innovative behaviors for promoting\ninnovation and learning in the workplace\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n1 Hour\n\n5.3 Implement\ninnovative ways\nin the conduct of\nusual workplace\npractices\n\n• Show mastery of the determinants of\ninnovative behaviors, principles of\ninnovation; and dimensions of innovation\nclimate and strategies and techniques for\nimplementing innovation in the workplace\n• Evaluate impact of innovative practices in\nthe organization\n• Demonstrate skills in managing changes\nin the workplace\n• Interactive Lecture\n• Appreciative\nInquiry\n• Demonstration\n• Group work\n• Psychological\nand behavioral\nInterviews\n• Performance\nEvaluation\n• Life Narrative\nInquiry\n• Review of\nportfolios of\nevidence and\nthird-party\nworkplace\nreports of on-\nthe-job\n1 Hour\n\n--- PDF PAGE 112 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n108\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\nperformance.\n• Standardized\nassessment of\ncharacter\nstrengths and\nvirtues applied\n6. Manage and\nevaluate\nusage of\ninformation\n\n6.1 Review\ninformation needs\nand sources\n• Lecture and discussion on:\no Kinds of information\no Information evaluation issues\no Information storage requirements\nand methods\n• Analysing record information\n• Identification of information sources\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n6.2 Collect and\nanalyze\ninformation\n• Lecture and discussion on:\no Information collection and collation\no Relevant trends and developments\n• Collection of information\n• Analyzation of information\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n6.3 Use management\ninformation\nsystems\n• Lecture and discussion on:\no Management information systems\no Available technology in information\nmanagement\no Advance strategies for customer\nservice excellence\n• Use of available technology in information\nmanagement\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n6.4 Report and\ndisseminate\nanalyzed\ninformation\n• Lecture and discussion on:\no Reporting procedures of the\norganisation\no Analysis and display techniques\n• Using management information systems to\nstore and retrieve data\n• Lecture\n• Group Discussion\n• Hands on\n• Demonstration\n• Practical exercises\n• Oral evaluation\n• Written Test\n• Observation\n• Presentation\n2 Hours\n\n--- PDF PAGE 113 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n109\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n7. Lead in\nimprovement\nof\nOccupational\nSafety and\nHealth (OSH)\nprograms,\npolicies and\nprocedures\n7.1 Assess\nOccupational\nSafety and Health\n(OSH) practices\nand programs\n• Case Study in evaluating current OSH\nprograms effectiveness\n• Practice auditing the workplace\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\nPortfolio\n2 Hours\n\n7.2 Recommend\nOSH\n program\n improvement\n initiatives\n• Writing and Presenting Action Plans to\nimprove OSH compliance in the\nworkplace and/or increase effectiveness\nof OSH Programs\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\nPortfolio\n4 Hours\n\n7.3 Implement\nrecommended\nimprovements on\nOccupational\nSafety and Health\n(OSH) Programs,\nProcedures and\nPolicies\n• Role play in increasing the OSH\nawareness\n• Measuring the impact of the new OHS\nprogram or initiative\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\n Questioning\n Portfolio\n2 Hours\n8. Lead towards\nimprovement\nof\nenvironmental\nwork\nprograms,\npolicies and\nprocedures\n8.1 Assess\nenvironmental\nwork practices\nand programs\n• Discussion of Green structural change\nand retraining needs\n-\nWhat is green structural change and\nwhere is it happening\n-\nWorkforce restructuring and\nadjustment\n-\nEmployment effects of Environment\n-\nSectors most affected by green\nrestructuring\n-\nRetraining and skills upgrading\n-\nEffective and equitable restructuring:\nGood practices and programs by\npublic and private sector actors\n• Lecture\n• Group Discussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n\n--- PDF PAGE 114 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n110\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n• Perform Impact Assessment\n• Discussions of Gender Implications\n\n8.2 Recommend\nenvironmental\nprogram\nimprovement\ninitiatives\n• Practicing Leadership skills: The biggest\nchallenge in transition to a low-carbon\neconomy or environment friendly activities\n• Practicing Basic Business planning\n• Opportunities Management - Identification\nof low-carbon and Resource scarcity risks\n• Perform Cost–benefit Analysis\n• Lecture\n• Group Discussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n\n8.3 Implement\nrecommended\nimprovements on\nenvironmental\nprograms,\npolicies and\nprocedures\n• Practicing Environmental Awareness\nRaising (Communication/ Implementation\ncampaigns)\n• Teaching and training personnel -\nnecessary skills and methods to impart\nenvironmental knowledge, to create\nawareness and to react flexibly to ever-\nchanging labor market needs.\n• Lecture\n• Group Discussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n9. Sustain\nentrepreneurial\nskills\n9.1 Enhance one’s\nbusiness skills\n• Discussion on entrepreneurial skills\n• Identifying market trends\n• Case studies on new technologies,\nproducts and processes\n• Practice gathering information on new\ntrends\n• Lecture/ Discussion\n• Case study\n• Group work\n• Written Report\n• Case problem\n2 Hours\n9.2 Manage\nentrepreneurial\npractices\n\n• Discussion on continuous improvement\n• Presentation of plans for continuous\nimprovement\n• Evaluation of new products and services\n• Lecture discussion\n• Group work\n• Written Report\n• Case problem\n1 Hour\n9.3 Expand markets\nand clientele\n• Prepare business plan and proposal\n• Lecture discussion\n• Group work\n• Portfolio\n1 Hour\n\n--- PDF PAGE 115 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n111\n\nCOMMON COMPETENCIES\n(120 Hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Apply safety\npractices\n1.1 Identify hazards\n• Identified hazards in accordance\nwith safety standards\n• Identified safety signs and symbols\nin the workplace\n• Lecture-Discussion\n• Demonstration\n• Interaction\n• Video presentation\n• Practical Exercises\n• Written\nExamination\n• Observation\n• Oral Questioning\n8 Hours\n\n1.2 Use protective\nclothing and\ndevices\n\n• Determine appropriate protective\nclothing and devices in accordance\nwith safety standards.\n• Select appropriate protective\nclothing and devices in accordance\nwith safety standards\n• Lecture-Discussion\n• Demonstration\n• Interaction\n• Video presentation\n• Practical Exercises\n• Written\nExamination\n• Observation\n• Oral Questioning\n\n1.3 Perform safe\nhandling of\ntools, equipment\nand materials\n•\nexplain the safety procedure of\ntools and equipment\n•\nDescribe safety handling of tools,\nequipment and materials.\n• Lecture-Discussion\n• Demonstration\n• Interaction\n• Video presentation\n• Practical Exercises\n• Written\nExamination\n• Observation\n\n• Oral Questioning\n\n1.4 Perform first aid\n\n•\nDetermine possible injuries in the\nwork place.\n•\nDescribe recommended first aid\ntreatment according to injury\n• Lecture-Discussion\n• Demonstration\n• Interaction\n• Video presentation\n• Practical Exercises\n• Written\nExamination\n• Observation\n\n• Oral Questioning\n\n1.5 Use fire\nextinguisher\n\n•\nSelect fire extinguisher according\nto type of fire.\n• Lecture-Discussion\n• Demonstration\n• Interaction\n• Video presentation\n• Practical Exercises\n• Written\nExamination\n• Observation\n\n• Oral Questioning\n\n2. Interpret\nworking\ndrawings and\nsketches\n2.1 Interpret technical\ndrawing\n\n•\nDetermine components,\nassemblies according to drawing.\n•\nExplain critical dimension,\ntolerances, and instruction\naccording to drawing.\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n16 Hours\n\n--- PDF PAGE 116 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n112\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n2.2 Prepare freehand\nsketch of parts\n•\nDescribe the sketch drawing of a\npart\n•\nDetermine critical dimension,\ndatum points on the sketch\n•\nExp