ctions\nand decimals\n• Explain simple calculation\nperformed involving fraction and\ndecimal using four fundamentals\noperations\n• Know how to convert decimal to\nfraction and vice versa\n\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n4.3 Perform basic\ncalculations\ninvolving\npercentages\n•\nKnow and obtain percentages from\ninformation using simple\ncalculation\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n4.4 Perform basic\ncalculation\ninvolving ration\nand proportion\n•\nDescribe simple calculation\ninvolving ratios and proportion\nusing whole numbers, fractions\nand decimal fraction\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n4.5 Perform\ncalculations on\nalgebraic\nexpressions\n• Explain simple calculations on\nalgebraic expressions using the\nfour fundamental operations\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n5. Measure\nworkpiece\n(basic)\n\n5.1 Select and use\nmeasuring tools\n• Determine Measuring tools to be\nused according to the level of\naccuracy required\n• Determine appropriate measuring\ntechnique\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n8 Hours\n5.2 Clean and store\nmeasuring tools\n•\nExplain Care and storage of\ndevices according to\nmanufacturer’s specifications\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n--- PDF PAGE 118 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n114\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n6. Perform\nroutine\nhousekeeping\n\n6.1 Organize work\narea\n•