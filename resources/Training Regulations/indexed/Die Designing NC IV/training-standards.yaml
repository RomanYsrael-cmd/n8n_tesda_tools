\nDuration\n\n8.3 Clean and store\nmeasuring tools\n•\nExplain Care and storage\naccording to standard operating\nprocedures\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n9. Measure\nworkpiece\nusing gages\nand surface\ntexture\ncomparator\n\n9.1 Select and use\nfixed and\nadjustable gages\n•\nDetermine Appropriate gages\nrequired\n•\nKnow and obtained accurate\nmeasurement according to drawing\nspecification\n•\nDetermine measuring technique of\nthe device\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n8 Hours\n9.2 Perform surface\ntexture\nmeasurements\n•\nDetermine surface texture\naccording to worksite procedure\n•\nObtain measurements according to\nlevel of accuracy\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n9.3 Clean and store\nmeasuring tools\n•\nExplain care and storage according\nto standard operating procedures\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n10. Perform\npreventive\nand corrective\nmaintenance\n\n10.1 Perform\ninspection of\nmachine\n•\nKnow how to inspect machines\naccording to worksite procedure\n•\nPrepare statue reports according to\nworksite procedure\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n8 Hours\n10.2 Perform cleaning\nand lubricating of\nmachine\n•\nKnow how to lubricate machines\nusing appropriate tools\n•\nKnow when to lubricate machines\naccording prescribe schedule\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n--- PDF PAGE 120 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n116\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMetho