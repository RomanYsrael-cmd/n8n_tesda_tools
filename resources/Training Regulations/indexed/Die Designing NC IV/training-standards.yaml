ure\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\nPortfolio\n4 Hours\n\n7.3 Implement\nrecommended\nimprovements on\nOccupational\nSafety and Health\n(OSH) Programs,\nProcedures and\nPolicies\n• Role play in increasing the OSH\nawareness\n• Measuring the impact of the new OHS\nprogram or initiative\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\n Questioning\n Portfolio\n2 Hours\n8. Lead towards\nimprovement\nof\nenvironmental\nwork\nprograms,\npolicies and\nprocedures\n8.1 Assess\nenvironmental\nwork practices\nand programs\n• Discussion of Green structural change\nand retraining needs\n-\nWhat is green structural change and\nwhere is it happening\n-\nWorkforce restructuring and\nadjustment\n-\nEmployment effects of Environment\n-\nSectors most affected by green\nrestructuring\n-\nRetraining and skills upgrading\n-\nEffective and equitable restructuring:\nGood practices and programs by\npublic and private sector actors\n• Lecture\n• Group Discussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n\n--- PDF PAGE 114 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n110\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n• Perform Impact Assessment\n• Discussions of Gender Implications\n\n8.2 Recommend\nenvironmental\nprogram\nimprovement\ninitiatives\n• Practicing Leadership skills: The biggest\nchallenge in transition to a low-carbon\neconomy or environment friendly activities\n• Practicing Basic Business planning\n• Opportunities Management - Identification\nof low-carbon and Resource scarcity risks\n• Perform Cost–benefit Analysis\n• Lecture\n• Group Discussion\n• Demonstration\n• Case Study\n• Reporti