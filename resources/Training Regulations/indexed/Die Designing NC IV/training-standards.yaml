  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for DIE DESIGNING NC IV.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the\ncomponents mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title: DIE DESIGNING NC IV\n\nNominal Training Duration\n47 Hours\nBasic Competencies\n\n120\n257\nHours\nHours\nCommon Competencies\nCore Competencies\n Total -\n424\n\nHours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skill and attitudes of DIE DESIGNING\nNC IV in accordance with industry standards. This covers competencies that a person\nmust achieve in performing tasks such as determining die design parameters, performing\nCAD operation, simulation and verification of die design, modifying and finalizing of die\ndesign and creating fabrication drawing\n\nUpon completion of the course, the learners are expected to demonstrate the\nabove-mentioned competencies to be employed. To obtain this, all units prescribed for\nthis qualification must be achieve.\n\n--- PDF PAGE 104 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n100\n\nBASIC COMPETENCIES\n(47 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1 Meet common\nand specific\ncommunication\nneeds of clients\nand colleagues\n\n• Read\n➢\nCommunication process\n➢\nDynamics of groups and different\nstyles of group leadership\n• Identify different approaches to meet the\nneeds of clients and colleagues\n• Lecture\n• Written\nexamination\n1 Hour\n1.2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n• Apply communication skills to fulfill job\nroles as specified by the organization\n• Apply communication techniques in\ncommunicating with clients and colleagues\n➢\nActive listening\n➢\nFeedback\n➢\nInterpretation\n➢\nRole boundaries setting\n➢\nNegotiation\n➢\nEstablishing empathy\n• Describe strategies for internal and external\ndissemination of information\n• Demonstration\n• Group discussion\n• Observation\n• Oral evaluation\n1 Hour\n1.3. Deliver a\ntechnical\npresentation\n• Enhance the presentation using\nappropriate media\n• Deliver a clear and sequential presentation\nwithin given time\n• Demonstration\n• Observation\n1 Hour\n1.4 Represent the\norganization\n\n• Describe criteria for a good presentation\n• Prepare presentation material for internal or\nexternal forums to promote the organization\n• Demonstration\n• Observation\n1 Hour\n1.5 Facilitate group\ndiscussion\n• Gather relevant information\n• Apply values in facilitating differences in\nviews\n• Demonstration\n• Observation\n1 Hour\n\n--- PDF PAGE 105 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n101\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n1.6 Conduct\ninterview\n• Describe communication strategies\nemployed in interview situations\n• Conduct interview\n• Apply organizations procedure in\nmaintaining records of interviews\n• Use questioning, listening and nonverbal\ncommunication techniques to client groups\n• Group discussion\n• Demonstration\n• Oral evaluation\n• Observation\n1 Hour\n2. Develop and\nlead teams\n2.1 Foster individual\ngrowth\n\n• Discussion on Team Leadership and\nexpectation from team leaders\n• Case study on learning and development\nneeds of team members\n• Discussion on organizational requirements\nfrom team members\n• Role play on coaching and mentoring\n• Discussion on preparation of team\nmembers development plan\n• Role Play on providing feedback on\nperformance\n•\nObservation\nLecture/\nDiscussion\n•\nCase Study\n•\nRole Play\n•\nRole Play\n•\nCase Study\n•\nWritten Test\n• Observation\n• Role Play\n• Case Study\n▪ Written Test\n2 Hours\n\n--- PDF PAGE 106 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n102\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n2.2 Foster individual\nand team growth\n• Discussion on learning and development\nprogram goal setting\n• Preparation of learning and development\nprogram goals\n• Discussion on learning delivery methods\n• Role play on the different learning delivery\nmethods\n• Discussion on workplace learning\nopportunities\n• Role play on coaching and mentoring\n• Lecture/ Discussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 Hours\n\n2.3 Monitor and\nevaluate\nworkplace\nlearning\n•\nDiscussion on the different levels of\nlearning evaluation.\n•\nDiscussion on the different methods\nused to evaluate learning\n•\nDevelop reporting system for\nmonitoring of performance attributed to\nlearning programs\n•\nGathering of information to evaluate\nindividual performance attributed to\nlearning programs\n•\nCase study on modification of learning\nplan based on performance\n• Lecture/ Discussion\n• Case Study\nRole Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n2 Hours\n\n2.4 Develop team\ncommitment and\ncooperation\n• Discussion on team commitment and\ncooperation and its impact to attainment\nof goals\n• Play games on team commitment and\ncooperation\n• Discussion on team dynamics and its\nrelation to team performance\n• Play games on team dynamics and\nperformance\n• Development of career plans\n\n• Lecture/ Discussion\n• Case Study\n• Role Play\n• Observation\n• Role Play\n• Case Study\n• Written Test\n1 Hour\n\n--- PDF PAGE 107 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n103\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n2.5 Facilitate\naccomplishment\nof team goals\n• Perform team building activities towards\nimproving communication among team\nmembers, goal setting and improving\nperformance\n• Case studies involving collaborative\nactivities to improve attainment of group\ngoals\n• Group Activity\n• Case Study\n\n• Role Play\n• Case Study\n• Observation\n1 Hour\n3. Perform\nhigher-order\nthinking\nprocesses and\napply\ntechniques in\nthe workplace\n3.1 Evaluate\neffectiveness and\nefficiency of the\nworkplace\nsystems,\nprocesses and\nprocedures\n• Examine current systems, standards,\nprocedures and protocols in the\nworkplace\n• Discuss different methods of critical and\nappreciative inquiry and their relevance to\ndifferent situations\n• Form habit of asking questions and taking\nresponsibility for answers\n• Appreciate importance of why questions\nfor individuals, businesses and\ncommunities\n• Use range of analytical techniques\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case Formulation\n• Life Narrative\nInquiry (Interview)\n• Standardized test\n1 Hour\n\n--- PDF PAGE 108 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n104\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n3.2 Foster the habit\nof critical inquiry\nand curiosity in\nthe workplace\n• Discuss different methods of critical and\nappreciative inquiry and their relevance to\ndifferent situations\n• Form habit of asking questions and taking\nresponsibility for answers\n• Appreciate importance of why questions\nfor individuals, businesses and\ncommunities\n• Use range of analytical techniques, growth\nmindset and positive communication\nstrategies\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n• Discuss insights on workplace\neffectiveness and efficiency\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n1 Hour\n\n3.3 Develop practical\naction plans for\nimproving\nworkplace\nconditions\n• Use range of analytical techniques, growth\nmindset and positive communication\nstrategies in developing action plans for\nefficiency and effectiveness\n• Examine different strategies and\ntechniques in communicating results,\napplying critical thinking pathway,\nassessing effectiveness and efficiency of\nsystems, processes and procedures\n• Discuss concepts creative negotiation\nskills, change management and\nimprovement strategies\n• Group discussion\n• Lecture\n• Demonstration\n• Role playing\n• Case\nFormulation\n• Life Narrative\nInquiry\n(Interview)\n• Standardized\ntest\n• Project-based\nlearning\n2 Hours\n\n--- PDF PAGE 109 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n105\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n4. Contribute to\nthe practice of\nsocial justice in\nthe workplace\n\n4.1 Update self on\nlocal, national\nand global trends/\nissues in the\nworkplace\n• Explain the local, national and global\nsystems and structures\n• Discuss issues affecti