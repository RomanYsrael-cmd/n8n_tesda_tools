he safety procedure of\ntools and equipment\n•\nDescribe safety handling of tools,\nequipment and materials.\n• Lecture-Discussion\n• Demonstration\n• Interaction\n• Video presentation\n• Practical Exercises\n• Written\nExamination\n• Observation\n\n• Oral Questioning\n\n1.4 Perform first aid\n\n•\nDetermine possible injuries in the\nwork place.\n•\nDescribe recommended first aid\ntreatment according to injury\n• Lecture-Discussion\n• Demonstration\n• Interaction\n• Video presentation\n• Practical Exercises\n• Written\nExamination\n• Observation\n\n• Oral Questioning\n\n1.5 Use fire\nextinguisher\n\n•\nSelect fire extinguisher according\nto type of fire.\n• Lecture-Discussion\n• Demonstration\n• Interaction\n• Video presentation\n• Practical Exercises\n• Written\nExamination\n• Observation\n\n• Oral Questioning\n\n2. Interpret\nworking\ndrawings and\nsketches\n2.1 Interpret technical\ndrawing\n\n•\nDetermine components,\nassemblies according to drawing.\n•\nExplain critical dimension,\ntolerances, and instruction\naccording to drawing.\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n16 Hours\n\n--- PDF PAGE 116 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n112\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n2.2 Prepare freehand\nsketch of parts\n•\nDescribe the sketch drawing of a\npart\n•\nDetermine critical dimension,\ndatum points on the sketch\n•\nExplain the instruction in the sketch\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n\n2.3 Interpret details\nfrom freehand\nsketch\n• Determine components,\nassemblies on the sketch\n• Determine critical dimension,\ndatum points on the sketch\n• Determine material requirements\non the sketch\n• Explain standard symbols in the\nsketch\n• Lecture-Discussion\n• Practical exercise\n