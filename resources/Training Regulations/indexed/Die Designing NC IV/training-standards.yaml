e\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\nQuestioning\nPortfolio\n4 Hours\n\n7.3 Implement\nrecommended\nimprovements on\nOccupational\nSafety and Health\n(OSH) Programs,\nProcedures and\nPolicies\n• Role play in increasing the OSH\nawareness\n• Measuring the impact of the new OHS\nprogram or initiative\n•\nLecture\n•\nGroup\nDiscussion\n•\nCase Study\n•\nGroup Project\n•\nWritten Exam\n•\nDemonstration\n•\nObservation\n•\nInterviews /\n Questioning\n Portfolio\n2 Hours\n8. Lead towards\nimprovement\nof\nenvironmental\nwork\nprograms,\npolicies and\nprocedures\n8.1 Assess\nenvironmental\nwork practices\nand programs\n• Discussion of Green structural change\nand retraining needs\n-\nWhat is green structural change and\nwhere is it happening\n-\nWorkforce restructuring and\nadjustment\n-\nEmployment effects of Environment\n-\nSectors most affected by green\nrestructuring\n-\nRetraining and skills upgrading\n-\nEffective and equitable restructuring:\nGood practices and programs by\npublic and private sector actors\n• Lecture\n• Group Discussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n\n--- PDF PAGE 114 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n110\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n• Perform Impact Assessment\n• Discussions of Gender Implications\n\n8.2 Recommend\nenvironmental\nprogram\nimprovement\ninitiatives\n• Practicing Leadership skills: The biggest\nchallenge in transition to a low-carbon\neconomy or environment friendly activities\n• Practicing Basic Business planning\n• Opportunities Management - Identification\nof low-carbon and Resource scarcity risks\n• Perform Cost–benefit Analysis\n• Lecture\n• Group Discussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n\n8.3 Implement\nrecommended\nimprovements on\nenvironmental\nprograms,\npolicies and\nprocedures\n• Practicing Environmental Awareness\nRaising (Communication/ Implementation\ncampaigns)\n• Teaching and training personnel -\nnecessary skills and methods to impart\nenvironmental knowledge, to create\nawareness and to react flexibly to ever-\nchanging labor market needs.\n• Lecture\n• Group Discussion\n• Demonstration\n• Case Study\n• Reporting\n\n• Written Exam\n• Demonstration\n• Observation\n• Interviews /\nQuestioning\n• Third Party\nReports\n1 Hour\n9. Sustain\nentrepreneurial\nskills\n9.1 Enhance one’s\nbusiness skills\n• Discussion on entrepreneurial skills\n• Identifying market trends\n• Case studies on new technologies,\nproducts and processes\n• Practice gathering information on new\ntrends\n• Lecture/ Discussion\n• Case study\n• Group work\n• Written Report\n• Case problem\n2 Hours\n9.2 Manage\nentrepreneurial\npractices\n\n• Discussion on continuous improvement\n• Presentation of plans for continuous\nimprovement\n• Evaluation of new products and services\n• Lecture discussion\n• Group work\n• Written Report\n• Case problem\n1 Hour\n9.3 Expand markets\nand clientele\n• Prepare business plan and proposal\n• Lecture discussion\n• Group work\n• Portfolio\n1 Hour\n\n--- PDF PAGE 115 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n111\n\nCOMMON COMPETENCIES\n(120 Hours)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n1. Apply safety\npractices\n1.1 Identify hazards\n• Identified hazards in accordance\nwith safety standards\n• Identified safety signs and symbols\nin the workplace\n• Lecture-Discussion\n• Demonstration\n• Interaction\n• Video presentation\n• Practical Exercises\n• Written\nExamination\n• Observation\n• Oral Questioning\n8 Hours\n\n1.2 Use protective\nclothing and\ndevices\n\n• Determine appropriate protective\nclothing and devices in accordance\nwith safety standards.\n• Select appropriate protective\nclothing and devices in accordance\nwith safety standards\n• Lecture-Discussion\n• Demonstration\n• Interaction\n• Video presentation\n• Practical Exercises\n• Written\nExamination\n• Observation\n• Oral Questioning\n\n1.3 Perform safe\nhandling of\ntools, equipment\nand materials\n•\nexplain the safety procedure of\ntools and equipment\n•\nDescribe safety handling of tools,\nequipment and materials.\n• Lecture-Discussion\n• Demonstration\n• Interaction\n• Video presentation\n• Practical Exercises\n• Written\nExamination\n• Observation\n\n• Oral Questioning\n\n1.4 Perform first aid\n\n•\nDetermine possible injuries in the\nwork place.\n•\nDescribe recommended first aid\ntreatment according to injury\n• Lecture-Discussion\n• Demonstration\n• Interaction\n• Video presentation\n• Practical Exercises\n• Written\nExamination\n• Observation\n\n• Oral Questioning\n\n1.5 Use fire\nextinguisher\n\n•\nSelect fire extinguisher according\nto type of fire.\n• Lecture-Discussion\n• Demonstration\n• Interaction\n• Video presentation\n• Practical Exercises\n• Written\nExamination\n• Observation\n\n• Oral Questioning\n\n2. Interpret\nworking\ndrawings and\nsketches\n2.1 Interpret technical\ndrawing\n\n•\nDetermine components,\nassemblies according to drawing.\n•\nExplain critical dimension,\ntolerances, and instruction\naccording to drawing.\n• Lecture-Discussion\n• Practical exercise\n• Interaction\n• Demonstration\n\n• Written\nExamination\n• Oral Questioning\n16 Hours\n\n--- PDF PAGE 116 ---\nDie Designing NC IV Revision 00 Promulgated (05/21/2019)\n\n112\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n2.2 Prepare freehand\nsketch of parts\n•\nDescribe the sketch drawing of a\npart\n•\nDetermine critical dimension,\ndatum points on the sketch\n•\nExpla