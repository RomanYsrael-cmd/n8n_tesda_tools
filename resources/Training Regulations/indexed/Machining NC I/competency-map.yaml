  "source_text": "SECTION 1 MACHINING NC I QUALIFICATION\n\nThe Machining NC I Qualification consists of competencies that a person must\nachieve to perform basic set up and operate a variety of machine tools to perform\nprecision machining operations.\n\nSpecifically, this Training Regulations in Machining covers turning, milling, precision\ngrinding, bench work, shape workpiece, and perform basic welding.\n\nThe Units of Competency comprising this qualification include the following:\n\nCode No.\nBASIC COMPETENCIES\n400311101\nReceive and respond to workplace communication\n400311102\nWork with others\n400311103\nSolve/address routine problems\n400311104\nEnhance self-management skills\n400311105\nSupport innovation\n400311106\nAccess and maintain information\n400311107\nFollow occupational safety and health policies and procedures\n400311108\nApply environmental work standards\n400311109\nAdopt entrepreneurial mindset in the workplace\n\nCode No.\nCOMMON COMPETENCIES\nMEE722201\nApply safety practices\nMEE722202\nInterpret working drawings and sketches\nMEE722203\nSelect and cut workshop materials\nMEE722204\nPerform shop computations (Basic)\nMEE722205\nMeasure workpiece (Basic)\nMEE722206\nPerform routine housekeeping\nMEE722211\nPerform preventive and corrective maintenance\nCode No.\nCORE COMPETENCIES\nMEE722311\nPerform bench work (Basic)\nMEE722312\nTurn workpiece\nMEE722313\nMill workpiece\nMEE722314\nGrind workpiece\nMEE722315\nShape workpiece\nMEE722316\nRepair workpiece\n\n--- PDF PAGE 6 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 2\n\nA person who has achieved this qualification is competent to be:\n-\nMachinist\n-\nMachinist helper\n-\nBench worker/fitter\n-\nLathe machine operator\n-\nMilling machine operator\n-\nGrinding machine operator\n-\nShaper machine operator\n\n--- PDF PAGE 7 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 3"
