      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence on all units of competency in a qualification with a promulgated Training Regulations. 4.1.2 A Certificate of Competency (CoC) is issued by the Authority to individuals who were assessed as competent in a single unit or cluster of related units of competency. COC1 Perform Turning Operation • Perform bench work • Turn workpiece • Repair workpiece COC2 Perform Milling Operation • Perform bench work • Mill workpiece • Repair workpiece COC3 Perform Surface Grinding Operation • Perform bench work • Grind workpiece • Repair workpiece COC4 Perform Shaping Operation • Perform bench work • Shape workpiece • Repair workpiece 4.1.3 Upon accumulation of the COCs acquired, an individual shall be issued the corresponding National Certificate for the Qualification. 4.1.4 Individuals wanting to be certified will have to be assessed in accordance with the requirements identified in the relevant unit/s of competency. Machining NC I Revision 01 Promulgated (01/11/2019) 164 4.1.5 The industry shall determine assessment and certification requirements for each qualification with promulgated Training Regulations. It includes the following: a. Entry requirements for candidates b. Evidence gathering methods c. Qualification requirements of competency assessors d. Specific assessment and certification arrangements as identified by industry 4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained competencies through informal training, previous work or life experiences may apply for recognition in a particular qualification through a recognition/ assessment process."
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre- assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. Machining NC I Revision 01 Promulgated (01/11/2019) 165"
    }
  ],
  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence on all units of competency in a qualification with a promulgated\nTraining Regulations.\n\n4.1.2 A Certificate of Competency (CoC) is issued by the Authority to individuals\nwho were assessed as competent in a single unit or cluster of related units of\ncompetency.\n\nCOC1 Perform Turning Operation\n• Perform bench work\n• Turn workpiece\n• Repair workpiece\n\nCOC2 Perform Milling Operation\n• Perform bench work\n• Mill workpiece\n• Repair workpiece\n\nCOC3 Perform Surface Grinding Operation\n• Perform bench work\n• Grind workpiece\n• Repair workpiece\n\nCOC4 Perform Shaping Operation\n• Perform bench work\n• Shape workpiece\n• Repair workpiece\n\n4.1.3 Upon accumulation of the COCs acquired, an individual shall be issued the\ncorresponding National Certificate for the Qualification.\n\n4.1.4 Individuals wanting to be certified will have to be assessed in accordance with\nthe requirements identified in the relevant unit/s of competency.\n\n--- PDF PAGE 168 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 164\n4.1.5 The industry shall determine assessment and certification requirements for\neach qualification with promulgated Training Regulations. It includes the\nfollowing:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\nindustry\n4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences may\napply for recognition in a particular qualification through a recognition/\nassessment process.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence that need\nto be presented\nd) Assist the candidate to identify key areas in which practice is needed or additional\ninformation or skills that should be gained prior\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA\nis authorized to conduct competency assessment. Assessment centers undergo a\nquality assured procedure for accreditation before they are authorized by TESDA\nto manage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 169 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 165\n\n"
