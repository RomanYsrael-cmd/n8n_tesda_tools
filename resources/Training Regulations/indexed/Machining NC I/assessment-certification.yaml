    {
      "number": "4.2",
      "text": "1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre- assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior"
    },
    {
      "number": "4.2",
      "text": "2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification."
    },
    {
      "number": "4.2",
      "text": "3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. --- PDF PAGE 169 --- Machining NC I Revision 01 Promulgated (01/11/2019) 165 For Metals and Engineering Sector Perform bench work (Basic) Turn workpiece Mill workpiece Grind workpiece Shape workpiece Perform bench work (Complex) Turn workpiece (Intermediate) Mill workpiece (Intermediate) Grind workpiece (Complex) Mill workpiece (Advanced) Apply safety practices Select and cut workshop materials Measure workpiece (Basic) Perform preventive and corrective maintenance Interpret working drawings and sketches Perform shop computations (Basic) Perform routine housekeeping Receive and respond to workplace communication Enhance self- management skills Follow occupational safety and health policies and procedures Work with others Support innovation Apply environmental work standards Solve/address routine problems Access and maintain information Adopt entrepreneurial mindset in the workplace Turn workpiece (Advanced) Repair workpiece --- PDF PAGE 170 --- Machining NC I Revision 01 Promulgated (01/11/2019) 166 Glossary of Terms 5S Refers to 5S of Good Housekeeping ( Seiri-Sort, Seiton- Segregate, Seiso-Sanitize, Seiketsu-Standardize, Shitsuke- Self Discipline) 3Rs Refers to Reuse, Reduce, Recycle Bench work the operations incident to the process of laying out, fitting, assembling, etc… when the work is placed on the bench or in a bench vise Boring is the operation of enlarging a hole by means of an adjustable cutting tool with only one cutting edge Chipping is the operation of removing/cutting metal using hammer and chisel Counter boring is the operation of enlarging the end of a hole cylindrically Grinding dresser or wheel dresser is a tool to dress the surface of a grinding wheel. Grinding dressers are used for making different profile on grinding wheel. The dressing of a wheel in order to return the wheel to its original shape. Truing is also a method of wheel balancing. Drilling is the operation of producing a circular hole by removing solid metal Facing the lathe operation of finishing the ends of the work, to make the piece the right length. Also known as squaring Grinding refers to the removal of material from a workpiece with grinding wheel Laying out term used to include the marking or scribing of center points, circles, arcs, or straight lines upon metal surfaces, either curved or flat, for the guidance of the worker Milling refers to removal of metal by feeding a workpiece through the periphery of rotating circular cutter Reaming is an operation of sizing and finishing a hole by means of a cutting tool having several cutting edges. Reaming serves to make the hole smoother, straighter, and more accurate Spot-facing is the operation of smoothing and squaring the surface around a hole Tapping is the operation of forming internal threads by means of a tool called tap --- PDF PAGE 171 --- Machining NC I Revision 01 Promulgated (01/11/2019) 167 Turning refers to shaping a workpiece by gripping it in a work holding device and rotating it under power against a suitable cutting tool Trepanning the lathe operation of removing a disc or cylindrical core from a metal plate Welding the process of joining surfaces of metals by heating up to a plastic or fluid state and then allowing the metals to flow together with or without the addition of other molten metal Workpiece raw material or partially finished piece that is shaped by performing various operations. --- PDF PAGE 172 --- Machining NC I Revision 01 Promulgated (01/11/2019) 168 TRAINING REGULATIONS (TR) Qualification Title : Machining NC I Qualification Code: MEEMCG119 Revision No. Document Description Types* Replaces Version (TESDA Board Resolution No./ Date) New Vers