  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to a full qualification or\nemployable unit(s) of competency in partial fulfillment of the requirements of the national\nqualification.\n\n4.1\nNATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence on all units of competency in a qualification with a promulgated\nTraining Regulations.\n\n4.1.2 A Certificate of Competency (CoC) is issued by the Authority to individuals\nwho were assessed as competent in a single unit or cluster of related units of\ncompetency.\n\nCOC1 Perform Turning Operation\n• Perform bench work\n• Turn workpiece\n• Repair workpiece\n\nCOC2 Perform Milling Operation\n• Perform bench work\n• Mill workpiece\n• Repair workpiece\n\nCOC3 Perform Surface Grinding Operation\n• Perform bench work\n• Grind workpiece\n• Repair workpiece\n\nCOC4 Perform Shaping Operation\n• Perform bench work\n• Shape workpiece\n• Repair workpiece\n\n4.1.3 Upon accumulation of the COCs acquired, an individual shall be issued the\ncorresponding National Certificate for the Qualification.\n\n4.1.4 Individuals wanting to be certified will have to be assessed in accordance with\nthe requirements identified in the relevant unit/s of competency.\n\n--- PDF PAGE 168 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 164\n4.1.5 The industry shall determine assessment and certification requirements for\neach qualification with promulgated Training Regulations. It includes the\nfollowing:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\nindustry\n4.1.6 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work or life experiences may\napply for recognition in a particular qualification through a recognition/\nassessment process.\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\n\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence that need\nto be presented\nd) Assist the candidate to identify key areas in which practice is needed or additional\ninformation or skills that should be gained prior\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA\nis authorized to conduct competency assessment. Assessment centers undergo a\nquality assured procedure for accreditation before they are authorized by TESDA\nto manage the assessment for National Certification.\n\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n\n--- PDF PAGE 169 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 165\n\nCOMPETENCY MAP\nFor Metals and Engineering Sector\nMACHINING NC I\nPerform bench\nwork (Basic)\nTurn workpiece\nMill workpiece\nGrind workpiece\nShape workpiece\nPerform bench\nwork (Complex)\nTurn workpiece\n(Intermediate)\nMill workpiece\n(Intermediate)\nGrind workpiece\n(Complex)\nMill workpiece\n(Advanced)\nCORE\nCOMPETENCIES\nApply safety\npractices\nSelect and cut\nworkshop\nmaterials\nMeasure\nworkpiece\n(Basic)\nPerform preventive and\ncorrective maintenance\nInterpret working\ndrawings and\nsketches\nPerform shop\ncomputations\n(Basic)\nPerform routine\nhousekeeping\nCOMMON\nCOMPETENCIES\nReceive and respond\nto workplace\ncommunication\nEnhance self-\nmanagement skills\nFollow occupational\nsafety and health\npolicies and procedures\nWork with others\nSupport\ninnovation\nApply environmental\nwork standards\nBASIC\nCOMPETENCIES\nSolve/address\nroutine problems\nAccess and\nmaintain\ninformation\nAdopt entrepreneurial\nmindset in the\nworkplace\nTurn workpiece\n(Advanced)\nRepair\nworkpiece\n\n--- PDF PAGE 170 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 166\nGlossary of Terms\n\n5S\nRefers to 5S of Good Housekeeping ( Seiri-Sort, Seiton-\nSegregate, Seiso-Sanitize, Seiketsu-Standardize, Shitsuke-\nSelf Discipline)\n\n3Rs\nRefers to Reuse, Reduce, Recycle\n\nBench work\nthe operations incident to the process of laying out, fitting,\nassembling, etc… when the work is placed on the bench or in\na bench vise\n\nBoring\nis the operation of enlarging a hole by means of an adjustable\ncutting tool with only one cutting edge\n\nChipping\nis the operation of removing/cutting metal using hammer and\nchisel\n\nCounter boring\nis the operation of enlarging the end of a hole cylindrically\n\nGrinding dresser\nor wheel dresser\nis a tool to dress the surface of a grinding wheel. Grinding\ndressers are used for making different profile on grinding\nwheel. The dressing of a wheel in order to return the wheel to\nits original shape. Truing is also a method of wheel balancing.\n\nDrilling\nis the operation of producing a circular hole by removing solid\nmetal\n\nFacing\nthe lathe operation of finishing the ends of the work, to make\nthe piece the right length. Also known as squaring\n\nGrinding\nrefers to the removal of material from a workpiece with\ngrinding wheel\n\nLaying out\nterm used to include the marking or scribing of center points,\ncircles, arcs, or straight lines upon metal surfaces, either\ncurved or flat, for the guidance of the worker\n\nMilling\nrefers to removal of metal by feeding a workpiece through the\nperiphery of rotating circular cutter\n\nReaming\nis an operation of sizing and finishing a hole by means of a\ncutting tool having several cutting edges. Reaming serves to\nmake the hole smoother, straighter, and more accurate\n\nSpot-facing\nis the operation of smoothing and squaring the surface\naround a hole\n\nTapping\nis the operation of forming internal threads by means of a tool\ncalled tap\n\n--- PDF PAGE 171 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 167\n\nTurning\n\nrefers to shaping a workpiece by gripping it in a work holding\ndevice and rotating it under power against a suitable cutting\ntool\n\nTrepanning\nthe lathe operation of removing a disc or cylindrical core from\n\na metal plate\n\nWelding\nthe process of joining surfaces of metals by heating up to a\nplastic or fluid state and then allowing the metals to flow\ntogether with or without the addition of other molten metal\n\nWorkpiece\nraw material or partially finished piece that is shaped by\nperforming various operations.\n\n--- PDF PAGE 172 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 168\n\n TRAINING REGULATIONS (TR)\n DOCUMENT REVISION HISTORY\n\nQualification Title : Machining NC I\nQualification Code: MEEMCG119\n\nRevision\nNo.\n\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\n\nDeployment\nCircular\n00\nDocument Created –\nMachining NC I\nNot Applicable\nTB No. 2006-09\nApril 20, 2006\nNot Applicable\n01\nDocument Amended –\nMachining NC I\nTB No. 2006-09\n