  "source_text": "5S\nRefers to 5S of Good Housekeeping ( Seiri-Sort, Seiton-\nSegregate, Seiso-Sanitize, Seiketsu-Standardize, Shitsuke-\nSelf Discipline)\n\n3Rs\nRefers to Reuse, Reduce, Recycle\n\nBench work\nthe operations incident to the process of laying out, fitting,\nassembling, etc… when the work is placed on the bench or in\na bench vise\n\nBoring\nis the operation of enlarging a hole by means of an adjustable\ncutting tool with only one cutting edge\n\nChipping\nis the operation of removing/cutting metal using hammer and\nchisel\n\nCounter boring\nis the operation of enlarging the end of a hole cylindrically\n\nGrinding dresser\nor wheel dresser\nis a tool to dress the surface of a grinding wheel. Grinding\ndressers are used for making different profile on grinding\nwheel. The dressing of a wheel in order to return the wheel to\nits original shape. Truing is also a method of wheel balancing.\n\nDrilling\nis the operation of producing a circular hole by removing solid\nmetal\n\nFacing\nthe lathe operation of finishing the ends of the work, to make\nthe piece the right length. Also known as squaring\n\nGrinding\nrefers to the removal of material from a workpiece with\ngrinding wheel\n\nLaying out\nterm used to include the marking or scribing of center points,\ncircles, arcs, or straight lines upon metal surfaces, either\ncurved or flat, for the guidance of the worker\n\nMilling\nrefers to removal of metal by feeding a workpiece through the\nperiphery of rotating circular cutter\n\nReaming\nis an operation of sizing and finishing a hole by means of a\ncutting tool having several cutting edges. Reaming serves to\nmake the hole smoother, straighter, and more accurate\n\nSpot-facing\nis the operation of smoothing and squaring the surface\naround a hole\n\nTapping\nis the operation of forming internal threads by means of a tool\ncalled tap\n\n--- PDF PAGE 171 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 167\n\nTurning\n\nrefers to shaping a workpiece by gripping it in a work holding\ndevice and rotating it under power against a suitable cutting\ntool\n\nTrepanning\nthe lathe operation of removing a disc or cylindrical core from\n\na metal plate\n\nWelding\nthe process of joining surfaces of metals by heating up to a\nplastic or fluid state and then allowing the metals to flow\ntogether with or without the addition of other molten metal\n\nWorkpiece\nraw material or partially finished piece that is shaped by\nperforming various operations.\n\n--- PDF PAGE 172 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 168",
