s\nSafety goggles\n25 pairs\nSafety shoes\n25 pcs\nWelder’s helmet\n25 pcs\nWelder’s mask\n\n TRAINING FACILITIES\n\nMACHINING NC I\n\nThe machining workshop must be of concrete structure. Based on class size of 25\nstudents/trainees the space requirements for the teaching/learning and circulation areas\nare as follows:\n\nSPACE\nREQUIREMENT\nSIZE IN\nMETERS\nAREA IN\nSQ.\nMETERS\nTOTAL\nAREA IN\nSQ.\nMETERS\nGRAND\nTOTAL\nAREA IN\nSQ.\nMETERS\nA. Building\n(permanent)\n\n253\n• Student/Trainee\nWorking Space\n2.00 x 1.00 per\nstudent/trainee\n\n2.00 per\nstudent\n\n50.00\n\n• Learning\nResource Center\n3.00 x 5.00\n15.00\n15.00\n\n• Activity Room\no Facilities\no Wash room &\nlocker room\no Store room\no Dining/mess\nroom\no Lecture room\n\n10.00 x 8.00\n4.00 x 4.00\n\n5.00 x 5.00\n3.00 x 4.00\n\n5.00 x 10.00\n7.50 per\nstudent\n188.00\n\n--- PDF PAGE 166 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 162\n\n3.4\nTRAINER’S QUALIFICATIONS FOR METALS AND ENGINEERING SECTOR\n\nMACHINING NC I\n\n•\nMust be a holder of NTTC in Machining NC II or higher level\n•\nMust be physically fit\n•\nMust have at least two (2) years job/industry experience within the last 5 years\n\n3.5\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of\ncompetency.\n\n--- PDF PAGE 167 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 163"
