      "source_text": "Course Title: MACHINING NC Level: NC I\n\nNominal Training Duration:\n 47 Hours (Basic Competencies)\n\n 60 Hours (Common Competencies)\n\n859 Hours (Core Competencies)\n\n624 Hours (SIT)\n\n-------------\n\n 1,590 Hours\n\nNominal Training Duration : 1,590 Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical\nskills and attitude, applicable in performing work activities involve in performing\nbench work (basic), turning workpiece, milling workpiece, grinding workpiece,\nshaping workpiece and repairing workpiece. This include classroom learning\nactivities and practical work in actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate\nthe above-mentioned competencies to be employed. To obtain this, all units\nprescribed for this qualification must be achieve.\n\n--- PDF PAGE 107 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 103\nBASIC COMPETENCIES\n(47 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow routine\nspoken\nmessages\n• Exercise Conciseness in receiving\nand clarifying messages/\ninformation/ communication\n• Group discussion\n• Interaction\n• Reportorial\n• Modular\n• Interviews/\n• Questioning\n• Practical/\n• Performance Test\n• Observation\n4 Hours\n1.2 Perform\nworkplace\nduties following\nwritten notices\n• Practice Accuracy in following\nwritten/ oral instruction/ information\n• Practice written and oral\ncommunication skills\n• Case Study in handling written\ncommunication\n• Practice relaying/ disseminating\nmessages/ information\n• Analyze different messages\n• Lecture/\n• Discussion\n• Demonstration\n• Case Study\n• Written\n• Practical\n• Written\n• Demonstration\n4 Hours\n2. Work with others\n2.1 Develop\neffective\nworkplace\nrelationships\n• Read job description and