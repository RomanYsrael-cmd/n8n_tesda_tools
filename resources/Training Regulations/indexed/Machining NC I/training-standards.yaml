      "source_text": "SECTION 3. TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for MACHINING NC I.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: MACHINING NC Level: NC I\n\nNominal Training Duration:\n 47 Hours (Basic Competencies)\n\n 60 Hours (Common Competencies)\n\n859 Hours (Core Competencies)\n\n624 Hours (SIT)\n\n-------------\n\n 1,590 Hours\n\nNominal Training Duration : 1,590 Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical\nskills and attitude, applicable in performing work activities involve in performing\nbench work (basic), turning workpiece, milling workpiece, grinding workpiece,\nshaping workpiece and repairing workpiece. This include classroom learning\nactivities and practical work in actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate\nthe above-mentioned competencies to be employed. To obtain this, all units\nprescribed for this qualification must be achieve.\n\n--- PDF PAGE 107 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 103\nBASIC COMPETENCIES\n(47 HOURS)\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow routine\nspoken\nmessages\n• Exercise Conciseness in receiving\nand clarifying messages/\ninformation/ communication\n• Group discussion\n• Interaction\n• Reportorial\n• Modular\n• Interviews/\n• Questioning\n• Practical/\n• Performance Test\n• Observation\n4 Hours\n1.2 Perform\nworkplace\nduties following\nwritten notices\n• Practice Accuracy in following\nwritten/ oral instruction/ information\n• Practice written and oral\ncommunication skills\n• Case Study in handling written\ncommunication\n• Practice relaying/ disseminating\nmessages/ information\n• Analyze different messages\n• Lecture/\n• Discussion\n• Demonstration\n• Case Study\n• Written\n• Practical\n• Written\n• Demonstration\n4 Hours\n2. Work with others\n2.1 Develop\neffective\nworkplace\nrelationships\n• Read job description and\norganizations policies relevant to\nwork role\n• Read personnel code of conduct\nand discipline\n• Role play on cooperation and good\nrelationship\n• Study table of organization and\nidentify team members\n• Role play on team work.\n• Role play on receiving feedback\nfrom supervisor\n• Role play on providing feedback.\n• Listen to lecture on Valuing and\n• Individual Work\n• Discussion\n• Role Play\n• Lecture\n• Role Play\n• Structured activity\n• Written Test\n2 hours\n\n--- PDF PAGE 108 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 104\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\nexemplifying respect and empathy\nin the workplace\n2.2 Contribute to\nwork\ngroup activities\n•\nDiscussion on creative\ncollaboration, social\nperceptiveness and problem\nsensitivity\n•\nRole play on creative\ncollaboration, social\nperceptiveness and problem\nsensitivity.\n•\nParticipate in a goal setting\nactivity\n•\nParticipate in planning and\nimplementation of a group activity.\n•\nParticipate in evaluation of the\ngroup activity\n• Lecture/\nDiscussion\n• Role Play\n• Group Work\n• Role Play\n• Structured activity\n• Written Test\n1 hour\n3. Solve/address\nroutine problems\n3.1 Identify the\nproblem\n•\nShow mastery of the current\nindustry hardware and software\nproducts and services\no Show mastery of knowledge\nand understanding of the\nprocess, normal operating\nparameters, and product\nquality to recognize non-\nstandard situations\no Relevant equipment and\noperational processes\no Enterprise goals, targets and\nmeasures\no Enterprise quality OHS and\nenvironmental requirement\no Enterprise information system