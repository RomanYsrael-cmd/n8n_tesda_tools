      "source_text": "3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery\nshall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies\nwritten to industry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized\nand self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work\nto the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as\nthe primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery\nmodes, both on-and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nand their variations/ components may be adopted singly or in combination with\nother modalities when designing and delivering training programs:\n\n2.1.\nInstitution- Based:\n\nClassroom-based or school-based training conducted entirely within the\nschool or center, with classroom and/or laboratory components.\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain\nboth\nin-school\nand\nin-industry\ntraining\nor\nfieldwork\ncomponents. Details can be referred to the Implementing Rules and\nRegulations of the DTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio,\nvideo, computer technologies or other modern technology that can be\nused to facilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA Secretariat.\n\n--- PDF PAGE 149 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 145\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of\nthe trainee through actual experience in the workplace to acquire\nspecific competencies as prescribed in the training regulations. It is\nimperative that the deployment of trainees in the workplace is adhered\nto training programs agreed by the institution and enterprise and status\nand progress of trainees are closely monitored by the training\ninstitutions to prevent opportunity for work exploitation.\n\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n 2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an approved\napprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson wherein\nthe agreement may be written or oral and the master craftsperson\ncommits to training the apprentice in all the skills relevant to his or her\ntrade over a significant period of time, usually between one and four\nyears, while the apprentice commits to contributing productively to the\nwork of the business. Training is integrated into the production process\nand apprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3 Community-Based\n\nRefers to a short program conducted or coordinated by NGOs, LGUs, training\ncenters and other TVET providers which are intended to address the specific\nneeds of a community. Such programs are usually conducted in informal\nsettings such as barangay hall, basketball courts and other available venues\nin a community.\n\n3.2\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational experience.\nOther requirements like health and physical requirements are also stated.\n\n• Able to read and write\n• Can perform basic mathematical computation\n• Ability to communicate (non-verbal and verbal)\n• Physically fit (health condition)\n\n--- PDF PAGE 150 ---\nMachining NC I Revision 01 Promulgated (01/11/2019) 146\n\n3.3\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nMACHINING NC I\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nMachining NC I.\n\nUp-to-date tools, materials, and equipment of equivalent functions can be used as\nalternatives.\n\nA.\nList of tools, equipment and materials for FULL QUALIFICATION\n\nTOOLS\nQTY\nDESCRIPTION\n2pcs\nAluminum Silicate Grinding Wheel, dia 8” x dia 1” x 1” for Carbide diamond\nCBN\n1pc\nAngle Plate 150mmx150mm\n4pcs\nAngle square, 150mm size\n1set\nAngle wheel dresser and attachment\n1pc\nAngular Milling Cutter, dia 100mm\n2pcs\nBall End-mill dia, 6mm\n2pcs\nBall End-mill, dia 10mm\n5pcs\nBall peen hammer, 200g\n5pcs\nBall peen hammer, 250g\n5pcs\nCenter drill, #3\n2pcs\nCenter gauge, standard size\n5pcs\nCenter punch, 150mm long\n1pc\nCombination square, 200mm size\n1set\nConcave Radius Gauge, 1mm to 14mm\n1set\nConvex Radius Gauge, 1mm to 14mm\n2pcs\nCountersink, dia 25mm\n2sets\nCylindrical grinding attachment\n2pcs\nDial indicator on Magnetic Stand\n1pc\nDiamond Wheel Dresser and holder\n2p