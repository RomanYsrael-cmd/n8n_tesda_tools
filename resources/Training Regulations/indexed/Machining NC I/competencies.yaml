 – Personal Protective Equipment & Devices \n12.4 OSH Rule No. 1150 – Materials Handling & Storage \n12.5 OSH Rule No. 1200 – Machine Guarding \n12.6 OSH Rule No. 1210 – Electrical Safety \n12.7 RA 6969-Toxic Substances and Hazardous and Nuclear Wastes \nControl Act of 1990 \n12.8 RA 9003-Ecological Solid Waste Management Act of 2000\n\n--- PDF PAGE 82 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          78 \n  \n  \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate:   \n1.1   Confirmed job requirements \n1.2   Set up workpiece \n1.3   Set up cutting tools \n1.4   Performed turning operations \n1.5   Checked workpiece \n1.6   Performed post-turning operations \n1.7   Applied safety practices \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Tools, equipment and facilities appropriate to processes or \nactivities \n2.2   Materials relevant to the proposed activity \n2.3   Drawings, sketches or blueprint \n3.  Method of \nassessment \nCompetency may be assessed through: \n3.1   Direct observation \n3.2   Written exam \n3.3   Oral questioning \n3.4   Demonstration \n3.5   Third party report \n3.6   Portfolio \n3.7   Interview \n4.  Context for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
