PAGE 104 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          100 \n  \n  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Tools and materials \nIncludes: \n \n1.1   Tools: \n1.1.1   Slag hammer \n1.1.2   Steel brush \n1.1.3   Ballpeen hammer \n1.1.4   Portable grinder \n1.1.5   Flat file \n1.1.6   Half round file \n1.1.7   Adjustable wrench \n \n1.2   Material: \n1.2.1   Low carbon steel welding rod \n1.2.2   High carbon steel welding rod \n2.  PPEs \nMay include: \n2.1   Welder’s helmet \n2.2   Apron, leather \n2.3   Safety shoes \n2.4   Safety gloves, leather \n2.5   Welder’s mask \n3.  Setting-up of welding \nmachine \nIncludes: \n3.1   Connecting to an independent power supply \n3.2   Adjustment or fine-tuning of current and voltage \n4.  Holding devices \nMay include: \n4.1   Braces \n4.2   Stiffeners \n4.3   Rails \n4.4   Other jigs \n5.  Tack welding \nIncludes: \n5.1   Bridge tacking \n5.2   Permanent tacking \n5.3   Temporary tacking \n6.  Industry guidelines \nMay include: \n6.1   OSH Rule No. 1070 – Occupational Health and \nEnvironmental Control \n6.2   OSH Rule No. 1080 – Personal Protective \nEquipment and Devices \n6.3   OSH Rule No. 1100 – Gas and Electric Welding and \nCutting Operations \n6.4   OSH Rule No. 1150 – Materials Handling and \nStorage \n6.5   OSH Rule No. 1200 – Machine Guarding \n6.6   OSH Rule No. 1210 – Electrical Safety \n6.7   OSH Rule on 1940 – Fire Protection and Control \n6.8   RA 9003-Ecological Solid Waste Management Act \nof 2000\n\n--- PDF PAGE 105 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          101 \n  \n  \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate:   \n1.1   Conducted preparatory activities \n1.2   Efficiently set up the welding machine and holding devices \n1.3   Applied weld and visually checked the work piece \n1.4   Performed post-welding operations \n1.5   Applied safety practices \n2.  Resource \nimplications \nThe following resources MUST be provided \n2.1   Tools, equipment and facilities appropriate to processes or \nactivities \n2.2   Materials relevant to the proposed activity \n2.3   Drawings, sketches or blueprint \n3.  Method of \nassessment \nCompetency may be assessed through: \n3.1   Direct observation of welding activities \n3.2   Written or oral short answer questions \n3.3   Practical exercises \n3.4   Identify colleagues/clients who can be approached for the \ncollection of competency evidence, where appropriate \n4.  Context for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
