        "source_text": "--- PDF PAGE 63 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          59 \n  \n  \nUNIT OF COMPETENCY \n: \nPERFORM ROUTINE HOUSEKEEPING \n \nUNIT CODE \n: \nMEE722206 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competencies required to \nmaintain an organized and clean work area. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Organize work \narea \n1.1  Work area \nmaintained in a \nsafe, uncluttered \nand organized \nmanner according \nto workshop \npolicy. \n1.2  All tasks carried out \nsafely, effectively \nand efficiently with \nminimum \ninconvenience \naccording to \nworkshop policy. \n1.3  Workshop policies \nand procedures for \ntidying work areas \nand placing items in \ndesignated areas \napplied. \n1.1  Principles of 5S \n1.2  Work policies and \nprocedures \n1.3  Safety signs and \nsymbols \n1.4  General OSH \nprinciples and \nlegislation \n1.5  Environmental \nrequirements \nrelative to work \nsafety \n1.1  Basic \ncommunication \nskills \n1.2  Area \nmanagement \nskills like tagging \nand separation \nof hazardous \nsubstances, \nflammable \nliquids and \nnoxious \nchemicals \n2.  Clean work area \n2.1  Shop policies and \nprocedures applied \nfor cleaning work \narea. \n2.2  Wastes promptly \nremoved and \ndisposed of \naccording to shop \npolicies and \nenvironmental \nrequirements. \n2.3  Spills, wastes and \nother potential \nhazards reported to \nappropriate \npersonnel and \nremoved according \nto shop policies and \nenvironmental \nrequirements. \n2.4  Signage promptly \ndisplayed in regard \nto unsafe areas. \n2.5  Consumable \n2.1  Principles of 5S \n2.2  Work policies and \nprocedures \n2.3  Safety signs and \nsymbols \n2.4  General OSH \nprinciples and \nlegislation \n2.5  Environmental \nrequirements \nrelative to work \nsafety \n2.6  Safe keeping of \nleft-over \nconsumable \nmaterials \n2.1  Basic \ncommunication \nskills \n2.2  Reading skills \nrequired to \ninterpret \ninstructions \n2.3  Literacy and \ncalculation skills \nin reading and \ncomprehending \nlabel and \ninstructions for \nthe handling and \nuse of chemicals \nand hazardous \nsubstances  \n2.4  Reporting/ \nrecording \naccidents and \npotential hazards\n\n--- PDF PAGE 64 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          60 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nmaterials \nmaintained and \nstored correctly \nafter use. \n2.6  Tools and \nequipment \n(including guards) \ncleaned and used \nin accordance with \nmanufacturer’s \ninstructions.\n\n--- PDF PAGE 65 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          61 \n  \n  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Workshop policy \nShop policy and procedure in regard to: \n1.1   Housekeeping practices \n1.2   Maintenance and storage of cleaning equipment \n1.3   Use and storage of cleaning chemicals \n2.  Work area \nWork area may include \n2.1   Work benches \n2.2   Walkways and aisles \n2.3   Fixtures and other working surfaces \n3.  Tools and Equipment \nEquipment and tools may include \n3.1   Drill Press \n3.2   Pedestal Grinder \n3.3   Surface plate \n3.4   Layout and marking tools \n3.5   Cutting tools (hacksaw, chisel, files) \n3.6   Inspection and measuring tools (templates, Vernier \ncaliper, micrometer, straight edge, gages, etc…)\n\n--- PDF PAGE 66 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          62 \n  \n  \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate organized \nand cleaned work area according shop policies and \nenvironmental requirements. \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Tools, equipment and facilities appropriate to processes or \nactivity \n2.2   Materials and documentation relevant to the proposed \nactivity \n2.3   Shop policy and/or procedures manual on housekeeping, \ncleaning and occupational health and safety \n3.  Method of \nassessment \nCompetency may be assessed through: \n3.1   Direct observation  \n3.2   Demonstration or role play \n3.3   Written or oral short answer questions \n3.4   Identify colleagues/clients who can be approached for the \ncollection of competency evidence, where appropriate \n4.  Context for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
