 Industry guidelines \nMay include: \n8.1   OSH Rule No. 1070 – Occupational Health & \nEnvironmental Control \n8.2   OSH Rule No. 1080 – Personal Protective \nEquipment & Devices \n8.3   OSH Rule No. 1150 – Materials Handling & Storage \n8.4   OSH Rule No. 1200 – Machine Guarding \n8.5   OSH Rule No. 1210 – Electrical Safety \n8.6   RA 6969-Toxic Substances and Hazardous and \nNuclear Wastes Control Act of 1990 \n8.7   RA 9003-Ecological Solid Waste Management Act \nof 2000\n\n--- PDF PAGE 90 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          86 \n  \n  \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate:   \n1.1   Confirmed job requirements \n1.2   Set up machine vice \n1.3   Set up Workpiece \n1.4   Set up cutting tools \n1.5   Checked workpiece \n1.6   Performed milling operations \n1.7   Performed post-milling operations \n1.8   Applied safety practices \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Tools, equipment and facilities appropriate to processes or \nactivities \n2.2   Materials relevant to the proposed activity \n2.3   Drawings, sketches or blueprint \n3. Method of \nassessment \nCompetency may be assessed through: \n3.1   Direct observation \n3.2   Written exam \n3.3   Oral questioning \n3.4   Demonstration \n3.5   Third party report \n3.6   Portfolio \n3.7   Interview \n4.  Context for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
