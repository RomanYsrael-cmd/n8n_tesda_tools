        "source_title": "ENHANCE SELF-MANAGEMENT SKILLS",
        "source_text": "--- PDF PAGE 20 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          16 \n  \n  \nUNIT OF COMPETENCY \n: \nENHANCE SELF-MANAGEMENT SKILLS \n \nUNIT CODE \n: \n400311104 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills, and attitudes in  \napplying the ability to regulate actions, make good \ndecisions, and show appropriate behavior based on self-\nawareness. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Set personal and \ncareer goals \n1.1  The difference \nbetween personal \nand career goals \nare described. \n1.2  Clear and concise \npersonal and career \ngoals are \ndeveloped. \n1.3  Characteristics of \nmotivational goals \naccording to Locke \n&Latham are \nidentified. \n1.1  Definition of \npersonal goals \nand career goals \n1.2  SMART Model for \ngoal setting \n1.3  Five principle of \ngoal setting \naccording to \nLocke & Latham \n(Clarity, \nChallenge, \nCommitment, \nFeedback, and \nTask complexity) \n1.1  Setting of \npersonal and \ncareer goals \n1.2  Defining, \ncreating, and \nmapping \npersonal and \ncareer goals \nusing SMART \nModel for goal \nsetting \n1.3  Applying goal \nsetting principles \nto personal and \ncareer goals \n2.  Recognize \nemotions \n2.1  Influence that \npeople, situations \nand events have on \nemotions are \ndescribed. \n2.2  Importance of \nresponding with \nappropriate \nemotions are \nexplained. \n2.3  Influences on and \nconsequences of \nemotional \nresponses in a \nsocial and work-\nrelated contexts \nare examined. \n2.1  Common positive \nand negative \nemotions \nmanifested in the \nworkplace \n2.2  Professional and \nnon-professional \nbehaviors in the \nworkplace \n2.3  Triggers and \nimplications of \npositive and \nnegative \nemotions in the \nworkplace \n2.1  Identifying \nsensitively the \npositive and \nnegative \nemotions in the \nworkplace \n2.2  Responding with \nappropriate \nemotions in the \nworkplace \n2.3  Identifying \npossible \nconsequences of \ninappropriate \nemotional \nresponses in a \nsocial and work-\nrelated context \n3.  Describe oneself \nas a learner \n3.1  Factors and \nstrategies that \nassist learning are \nidentified and \ndescribed. \n3.2  Preferred learning \nstyles according to \nVAK Learning Style \nModel and Kolb’s \n3.1  Kolb’s Theory of \nLearning Styles \n(Converger, \nDiverger, \nAssimilator, \nAccommodator) \n3.2  VAK Learning \nStyle Model \n(Visual, Auditory, \n3.1  Identifying \nfactors and \nstrategies that \nassist learning \n3.2  Applying learning \nstyles to \npositively \ninfluence \nschool/work\n\n--- PDF PAGE 21 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          17 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nTheory of Learning \nStyles are \nidentified. \n3.3  Range of learning \nstrategies \nappropriate to \nspecific tasks and \ndescribe work \npractices that assist \ntheir learning are \nidentified and \nchosen. \nKinesthetic) \n3.3  Range of learning \nstrategies \nappropriate to \nspecific tasks and \ndescribe work \npractices that \nassist their \nlearning \nperformance \n3.3  Using \nappropriate \nlearning \nstrategies to \nimprove study \nhabits and \nlearning\n\n--- PDF PAGE 22 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          18 \n  \n  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Personal goals \nMay include but not limited to:  \n1.1   Graduate from Tech-Voc training \n1.2   Buy a car \n1.3   Travel around the world \n2.  Career goals \nMay include but not limited to:  \n2.1   Graduate from Tech-Voc training \n2.2   Graduate from college \n2.3   Buy a car \n2.4   Retire at 50 years old \n3.  Emotions \nPositive emotions may include but not limited to:  \n3.1   Joy \n3.2   Gratitude \n3.3   Hope \n3.4   Serenity \n \nNegative emotions may include but not limited to:  \n3.5   Anger \n3.6   Fear \n3.7   Disgust \n3.8   Sadness \n4.  Social and work-related \ncontexts \nMay include professional behavior such as–  \n4.1   Committed to developing and improving their skills \n4.2   Professionals get the job done \n4.3   They keep their word and deliver what they \npromise. \n \nMay include non-professional behavior such as–  \n4.4   They engage in office politics \n4.5   Bluffing and misrepresenting their skills \n4.6   Blaming a colleague \n5.  Learning styles \nMay include but not limited to:  \n5.1   Visual \n5.2   Auditory \n5.3   Kinesthetic \n5.4   Converger \n5.5   Diverger \n5.6   Assimilator \n5.7  Accommodator \n6.  Learning strategies \nMay include but not limited to:  \n6.1   Explain and describe ideas with many details \n6.2   Switch between ideas while studying \n6.3   Use specific examples to understand abstract ideas\n\n--- PDF PAGE 23 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          19 \n  \n  \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Identified the problem. \n1.2   Determined the fundamental causes of the problem. \n1.3   Determined the correct / preventive action. \n1.4   Developed action plans in managing routine problems. \n \nThese aspects may be best assessed using project-based \nlearning mode of assessment and case formulation.  \n1.  Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1   Developed SMART personal and career goals \n1.2   Applied goal setting principles \n1.3   Identified sensitively the positive and negative emotions in \nthe workplace \n1.4   Responded with appropriate emotions in the workplace \n1.5   Identified possible consequences of inappropriate \nemotional responses in a social and work-related context \n1.6   Applied learning styles to positively influence school/work \nperformance \n1.7   Developed reflective practice through realization of  \nlimitations, likes/ dislikes; through showing of self-\nconfidence \n2.  Resource \nImplications \nThe following resources for should be provided: \n2.1   Access to workplace and resources \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration or simulation with oral questioning (ex. how \nto recognize emotions) \n3.2   Case problems involving workplace diversity issues \n3.3   Third-party report \n4.  Context for \nAssessment \n4.1   Competency assessment may occur in workplace or any \nappropriately simulated environment\n",
