        "source_text": "--- PDF PAGE 42 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          38 \n  \n  \nUNIT OF COMPETENCY \n: \nADOPT ENTREPRENEURIAL MINDSET IN THE \nWORKPLACE \n \nUNIT CODE \n: \n400311109 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the outcomes required to support and  \ninternalize an entrepreneurial mindset and observe  \nbasic entrepreneurial practices in the workplace. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Determine \nentrepreneurial \nmindset \n1.1  Entrepreneurial \nmindset in the \nworkplace is \ndetermined from \nenterprise practices \nand policies. \n1.2  Entrepreneurial \nmindset in the \nworkplace is \nstudied and \naffirmed based on \ncurrent enterprise \npractices. \n1.3  Clarification from \nreliable sources is \nsought regarding \nentrepreneurial \nmindset and \ncorporate culture. \n1.1  Workplace \npolicies and \npractices relating \nto \nentrepreneurship \n1.2  Elements of \ncorporate culture \n1.3  Entrepreneurial \nmindset \n1.4  Entrepreneurial \npractices in the \nworkplace \n1.5  Desirable \nattitudes: \nPatience \n1.5.1 Willingness \nto learn \n1.5.2 Attention to \ndetails \n1.1  Identifying \nentrepreneurial \nmindset \n1.2  Studying and \naffirming \nentrepreneurial \nmindset \n1.3  Selecting and \nemulating \ndesirable \nentrepreneurial \npractices \n1.4  Communication \nskills \n2.  Identify \nentrepreneurial \npractices \n2.1  Entrepreneurial \npractices are \ndetermined based \non enterprise \nrequirements. \n2.2  Entrepreneurial \npractices is \nperformed following \nworkplace and \nclient requirements. \n2.3  Cost-effective \nmeasures are \ncomplied with \nreference to \nworkplace best \npractices. \n2.1  Quality assurance \npractices \n2.2  Workplace and \nclient \nrequirements \n2.3  Types of cost-\neffective \nmeasures \n2.4  Workplace quality \npolicy \n2.5  Attitude: \n2.5.1 Patience \n2.5.2 Attention to \ndetails \n2.1  Performing \nquality \nassurance \npractices \n2.2  Complying \nquality \nassurance \nrequirements \n2.3  Complying to \ncost-effective \nmeasures \n2.4  Communication \nskills\n\n--- PDF PAGE 43 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          39 \n  \n  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Entrepreneurial mindset \nMay include (but not limited to) workplace thinking \nrelating to: \n1.1   Economy in the use of resources \n1.2   Waste management \n1.3   Quality-consciousness \n1.4   Cost-consciousness \n1.5   Safety- and health- consciousness \n2.  Quality assurance \npractices \nMay include but not limited to: \n2.1   Use of quality procedures manual  \n2.2   Quality policy \n2.3   Best/Good practices \n2.4   Continuous improvement program \n3.  Reliable sources \nMay include but not limited to: \n3.1   Supervisors \n3.2   Colleagues \n3.3   Clients/Partners\n\n--- PDF PAGE 44 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          40 \n  \n  \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1   Demonstrated affirmation of entrepreneurial mindset \n1.2   Observed entrepreneurial practices \n1.3   Complied with cost effective measures \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1   Simulated or actual workplace \n2.2   Tools, materials and supplies needed to demonstrate the \nrequired tasks  \n2.3   References and manuals \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through : \n3.1   Written examination \n3.2   Demonstration/observation with oral questioning \n3.3   Third-party report \n4.  Context of \nAssessment \n4.1   Competency may be assessed in workplace or in a \nsimulated workplace setting \n4.2   Assessment shall be observed while tasks are being \nundertaken whether individually or in-group\n",
