        "source_text": "--- PDF PAGE 76 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          72 \n  \n  \nUNIT OF COMPETENCY \n: \nTURN WORKPIECE \n \nUNIT CODE \n: \nMEE722312 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills required to set-up and turn  \nworkpiece to drawing specifications. It details the  \nrequirements for performing lathe operations such as  \nfacing and straight turning; cutting grooves, drilling and  \nboring, knurling; cutting single start external V-threads;  \nand cutting tapers using compound slide. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Confirm job \nrequirements \n1.1  Drawing is \ninterpreted and \nconfirmed with the \nsupervisor. \n1.2  Sequence of \noperation is \ndetermined to \nproduce component \nspecifications. \n1.3  Materials, hand \ntools and supplies \nare prepared and \ninspected based on \nthe drawing with \ninstruction of \nimmediate \nsupervisor and \nindustry \nguidelines. \n1.4  Machine condition \nis verified for \nserviceability and \nindustry \nguidelines. \n1.5  Cutting tools and \nmeasuring tools \nare prepared \naccording to the \nrequirements of the \noperation and \nindustry \nguidelines. \n1.6  Defective materials \nand tools are \nreported to \nimmediate \nsupervisor following \nindustry standards. \n1.7 Materials’ \ndimensions are \n1.1  Drafting/drawing \nskills to include \nability to apply \nknowledge in \nlimits, fits, \ntolerances and \nsurface texture of \nworkpiece \n1.2  Determination of \nsequence of \noperation \n1.3  Different forms of \ncutting tools \n1.4  Preparation of \ncutting tools \n1.5  Different types of \nmaterials, \nsupplies and tools \n1.6  Measuring of \ndimensions \n1.7  English to metric \nconversion \n1.8  OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n1.9  OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n1.10 OSH Rule No. \n1150 – Materials \nHandling & \nStorage \n1.11 OSH Rule No. \n1200 – Machine \nGuarding \n1.1  Interpreting \ndrawing \n1.2  Determining the \nsequence of \noperation \n1.3  Obtaining \nmaterials \n1.4  Preparing and \nchecking \nmaterial and \ntools \n1.5  Preparing and \nchecking cutting \ntools \n1.6  Measuring \nworkpiece \n1.7  Conducting \nmachine dry run \n1.8  Performing off-\nhand grinding of \ncutting tools\n\n--- PDF PAGE 77 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          73 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nchecked using \nmeasuring tools to \nmaximize materials’ \nusage and industry \nguidelines. \n1.12 OSH Rule No. \n1210 – Electrical \nSafety \n1.13 Noise pollution \n1.14 Air pollution \n2.  Set up workpiece \n2.1  Workpiece is \nmatched with the \nmachine following \nwork requirements. \n2.2  Workpiece is \nmounted and \ncentered on chuck \naccording to \nindustry standards \nand work \nrequirements and \nindustry \nguidelines. \n2.3  Centering \ninstruments are \nused according to \nwork requirements \nand industry \nguidelines. \n2.1  Use and types of \ncentering \ninstruments \n2.2  Setting-up work \npiece and \nmachine safely \n2.3  Types of \nmaterials, \nsupplies and tools \n2.4  Measuring of \ndimensions \n2.5  English to metric \nconversion \n2.6  OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n2.7  OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n2.8  OSH Rule No. \n1150 – Materials \nHandling & \nStorage \n2.9  Noise pollution \n2.10 Air pollution \n2.1  Mounting and \ncentering \nworkpiece \n2.2  Setting-up \nworkpiece and \nmachine \n2.3  Measuring \nworkpiece \n2.4  Applying safety \nprocedures \n3.  Set up cutting tools \n3.1  Cutting tools and \ncutting holders are \nselected according \nto job requirements \nand industry \nguidelines. \n3.2  Cutting tools are \nmounted to the \nholder following \nindustry standards \nand industry \nguidelines. \n3.3  Tool holder is \nmounted on the tool \npost following \nestablished industry \npractices. \n3.1  Mounting \nprocedure \n3.2  Centering \nprocedure \n3.3  Centering tools \n3.4  OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n3.5  OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n3.1  Mounting cutting \ntools and tool \nholder \n3.2  Centering cutting \ntools \n3.3  Applying safety \nprocedures\n\n--- PDF PAGE 78 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          74 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.4  Cutting tool is \naligned to the tail \nstock with \ncentering tools \nfollowing \nestablished industry \npractices. \n4.  Perform turning \noperations \n4.1  Speeds and feeds \nare calculated \nbased on job \nrequirements. \n4.2  Lathe is set-up \naccording to \ncalculated speeds \nand feeds and \nindustry \nguidelines. \n4.3  Lathe accessories \nare used according \nto job requirements \nand industry \nguidelines. \n4.4  Turning is \nconducted \naccording to work \nrequirements and \nindustry \nguidelines. \n4.5  Performance of \nthe machine and \ncutting tools are \nmonitored based on \nthe manufacturer’s \nmanual and \nindustry \nguidelines. \n4.6  Workpiece is \nchecked and \nmeasured during \nand after turning \noperations following \nwork specifications \nand industry \nguidelines. \n4.7  Irregularities are \nreported to \nimmediate \nsupervisor following \nindustry standards. \n4.1  Selection of lathe \naccessories \n4.2  Operation of lathe \n4.3  Use of water-\nbased coolant \n4.4  Types of \nmaterials, \nsupplies and tools \n4.5  English to metric \nconversion \n4.6  Computation \nspeeds, feeds \nand spindle \nrevolution \n4.7  Interpretation of \ndrawing and \nalphabet of lines \n4.8  Set-up cutting \nspeed and feeds, \n& depth of cut \n4.9  Cutting speed and \nfeeds reference \nchart \n4.10 Procedures in \nreporting \nirregularities \n4.11 OSH Rule No. \n1060 – Premises \nof Establishments \n4.12 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n4.13 OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n4.14 OSH Rule No. \n1200 – Machine \nGuarding \n4.15 Noise pollution \n4.16 Air pollution \n4.1  Computing \nspeeds, feeds \nand spindle \nrevolution \n4.2  using \nappropriate lathe \naccessories  \n4.3  Conducting lathe \noperation \n4.4  Applying safety \nprocedures \n4.5  Wearing PPEs \n4.6  Checking \nworkpiece\n\n--- PDF PAGE 79 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          75 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n5.  Perform post-\nturning operations \n5.1  Finished workpiece \nis checked and \nsubmitted to \nimmediate \nsupervisor following \nindustry procedure \nand industry \nguidelines. \n5.2  Accomplishment \nreport is prepared \nfollowing workplace \nprocedures. \n5.3  Lathe is shutdown \naccording to \nmanufacturer’s \nmanual and \nindustry \nguidelines. \n5.4  Tools are \nmaintained and \nstored based on \nestablished \nprocedures and \nindustry \nguidelines. \n5.5  Defective tools and \nmachines are \ntagged and \nreported according \nto workplace \nprocedures. \n5.6  Good \nhousekeeping is \nperformed following \n5S. \n5.7  Wastes are \nmanaged according \nto Ecological Solid \nWaste \nManagement Act of \n2000. \n5.1  Checking of \nfinished \nworkpiece \n5.2 