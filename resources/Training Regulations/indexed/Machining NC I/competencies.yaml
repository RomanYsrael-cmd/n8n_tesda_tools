          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Confirm job \nrequirements \n1.1  Drawing is \ninterpreted and \nconfirmed with the \nsupervisor. \n1.2  Material is matched \nwith the vertical \nmilling machine \nfollowing work \nrequirements and \nindustry \nguidelines. \n1.3  Sequence of \noperation is \ndetermined to \nproduce component \nto specifications. \n1.4  Material is prepared \nand inspected \nbased on the \ndrawing and \nindustry \nguidelines. \n1.5  Machine condition \nis verified for \nserviceability and \nindustry \nguidelines. \n1.6  Cutting tools and \nmeasuring tools \nare prepared \naccording to the \nrequirements of the \noperation and \nindustry \nguidelines.  \n1.7  Defective materials \nand tools are \nreported to \nimmediate \nsupervisor following \nindustry standards \n1.1  Drafting/ drawing \nskills to include \nability to apply \nknowledge in \nlimits, fits, \ntolerances and \nsurface texture of \nworkpiece \n1.2  Determination of \nsequence of \noperation \n1.3  Different forms of \ncutting tools \n1.4  Preparation of \ncutting tools \n1.5  Different types of \nmaterials, and \ntools \n1.6  Measuring of \ndimensions \n1.7  English to metric \nconversion \n1.8  OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n1.9  OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n1.10 OSH Rule No. \n1200 – Machine \nGuarding \n1.11 OSH Rule No. \n1210 – Electrical \nSafety \n1.12 Noise pollution \n1.13 Air pollution \n1.1  Interpreting \ndrawing \n1.2  Determining the \nsequence of \noperation \n1.3  Obtaining \nmaterials \n1.4  Preparing and \nchecking \nmaterial and \ntools \n1.5  Preparing and \nchecking cutting \ntools \n1.6  Measuring \nworkpiece \n1.7  Conducting \nmachine dry run\n\n--- PDF PAGE 84 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          80 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \