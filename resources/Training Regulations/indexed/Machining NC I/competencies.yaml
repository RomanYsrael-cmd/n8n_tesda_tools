        "source_title": "APPLY SAFETY PRACTICES",
        "source_text": "--- PDF PAGE 45 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          41 \n  \n  \nCOMMON COMPETENCIES \n \nUNIT OF COMPETENCY \n: \nAPPLY SAFETY PRACTICES  \n \nUNIT CODE \n: \nMEE722201 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competencies required to apply  \nsafety practices in the workplace. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Identify hazards \n1.1  Hazards are \nidentified correctly \nin accordance with \nOHS principles. \n1.2  Safety signs and \nsymbols are \nidentified and \nadhered to. \n1.1  Shop safety \nsigns, symbols \nand alarms \n1.1  Basic \ncommunication \nskills \n1.2  Interpersonal \nskills \n1.3  Reading skills \nrequired to \nunderstand \nsafety signs and \nsymbols \n1.4  Reporting / \nrecording \naccidents and \npotential hazards \n2.  Use protective \nclothing and \ndevices \n2.1  Appropriate \nprotective clothing \nand devices \ncorrectly selected \nand used in \naccordance with \nOHS requirements \nor industry/ \ncompany policy. \n2.1  Safety \nprecautionary \nmeasures \n2.2  General OSH \nprinciples and \nlegislation \n2.1  Basic \ncommunication \nskills \n2.2  Interpersonal \nskills \n2.3  Reading skills \nrequired to \nunderstand use \nof protective \nclothing and \ndevices \n3.  Perform safe \nhandling of tools, \nequipment and \nmaterials \n3.1  Safety procedures \nfor pre-use check \nand operation of \ntools and \nequipment followed \nin accordance with \nindustry/ company \npolicies. \n3.2  Tools, equipment \nand materials \nhandled safely in \naccordance with \nOHS requirements \nand industry/ \ncompany policies. \n3.1  Operating of \nmachine tools \n3.2  Handling tools \nand materials \n3.3  Environmental \nrequirements \nrelative to work \nsafety \n3.1  Basic \ncommunication \nskills \n3.2  Interpersonal \nskills \n3.3  Reading skills \nrequired to \ninterpret \ninstructions \n3.4  Communicating \nwith superiors \nand co-workers \n4.  Perform first aid \n4.1  First aid treatment \nof injuries are \n4.1  Types of injuries \n4.1  Basic \ncommunication\n\n--- PDF PAGE 46 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          42 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \ncarried out \naccording to \nrecommended \nprocedures. \nskills \n4.2  Interpersonal \nskills \n4.3  Reading skills \nrequired to \ninterpret \ninstructions \n4.4  Basic First Aid \napplication skills \n5.  Use fire \nextinguisher \n5.1  Fire extinguisher \nselected and \noperated correctly \naccording to the \ntype of fire. \n5.1  Identification of \ntypes of fire \n5.1  Basic \ncommunication \nskills \n5.2  Interpersonal \nskills \n5.3  Reading skills \nrequired to \ninterpret \ninstructions \n5.4  Proper handling \nof Fire \nExtinguisher\n\n--- PDF PAGE 47 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          43 \n  \n  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Hazards \nCluttered tools and materials \n1.1   Slippery floors (caused by oil, grease or any liquid) \n1.2   Exposed electrical wires  \n1.3   Sharp edges \n1.4   Machine without guards or with exposed moving \nparts \n1.5   Uncollected chips or other wastes, etc. \n2.  Protective clothing and \ndevices \nProtective clothing and devices may include but is not \nlimited to: \n2.1   Safety glasses/goggles \n2.2   Safety shoes \n2.3   Overalls \n2.4   Cap \n3.  Injuries \nInjuries may include: \n3.1   Burns/scalds \n3.2   Fractures \n3.3   Cuts and abrasions \n3.4   Poisoning \n3.5   Foreign bodies in the eye \n3.6   Concussion \n3.7   Shock \n4.  Type of fires \nFires involving or caused by: \n4.1   Common combustibles (wood, cloth, paper, rubber \nand plastic) \n4.2   Flammable liquids (gasoline, oil, solvents, paints, \netc.) \n4.3   Energized electrical equipment (wiring, fuse boxes, \ncircuit breakers, appliances, etc. \n4.4   Combustible metals (magnesium, sodium, etc.)\n\n--- PDF PAGE 48 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          44 \n  \n  \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Identified hazardous area \n1.2   Used protective clothing and devices \n1.3   Handled tools, equipment and materials properly \n1.4   Performed first aid \n1.5   Used fire extinguisher \n2.  Resource \nimplications \nThe following resources MUST be provided \n2.1   Tools, equipment and facilities appropriate to processes or \nactivity \n2.2   Materials relevant to the proposed activity \n3.  Method of \nassessment \nCompetency may be assessed through: \n3.1   Demonstration \n3.2   Written or oral short answer questions \n3.3   Practical exercises \n4.  Context for \nassessment \nCompetency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions\n",
