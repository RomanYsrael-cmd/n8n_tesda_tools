        "source_text": "--- PDF PAGE 83 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          79 \n  \n  \nUNIT OF COMPETENCY \n: \nMILL WORKPIECE \n \nUNIT CODE \n: \nMEE722313 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills required to set up and mill  \nwork piece to drawing specifications. It details the  \nrequirements for performing vertical milling operations  \nsuch as drilling, countersinking, boring, milling blocks,  \nshoulder, parallel faces; milling slots and keyways. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Confirm job \nrequirements \n1.1  Drawing is \ninterpreted and \nconfirmed with the \nsupervisor. \n1.2  Material is matched \nwith the vertical \nmilling machine \nfollowing work \nrequirements and \nindustry \nguidelines. \n1.3  Sequence of \noperation is \ndetermined to \nproduce component \nto specifications. \n1.4  Material is prepared \nand inspected \nbased on the \ndrawing and \nindustry \nguidelines. \n1.5  Machine condition \nis verified for \nserviceability and \nindustry \nguidelines. \n1.6  Cutting tools and \nmeasuring tools \nare prepared \naccording to the \nrequirements of the \noperation and \nindustry \nguidelines.  \n1.7  Defective materials \nand tools are \nreported to \nimmediate \nsupervisor following \nindustry standards \n1.1  Drafting/ drawing \nskills to include \nability to apply \nknowledge in \nlimits, fits, \ntolerances and \nsurface texture of \nworkpiece \n1.2  Determination of \nsequence of \noperation \n1.3  Different forms of \ncutting tools \n1.4  Preparation of \ncutting tools \n1.5  Different types of \nmaterials, and \ntools \n1.6  Measuring of \ndimensions \n1.7  English to metric \nconversion \n1.8  OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n1.9  OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n1.10 OSH Rule No. \n1200 – Machine \nGuarding \n1.11 OSH Rule No. \n1210 – Electrical \nSafety \n1.12 Noise pollution \n1.13 Air pollution \n1.1  Interpreting \ndrawing \n1.2  Determining the \nsequence of \noperation \n1.3  Obtaining \nmaterials \n1.4  Preparing and \nchecking \nmaterial and \ntools \n1.5  Preparing and \nchecking cutting \ntools \n1.6  Measuring \nworkpiece \n1.7  Conducting \nmachine dry run\n\n--- PDF PAGE 84 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          80 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nand industry \nguidelines. \n1.8  Materials’ \ndimensions are \nchecked using \nmeasuring tools to \nmaximize materials’ \nusage and industry \nguidelines. \n2.  Set up machine \nvice \n2.1  Machine vice is \nmounted on milling \nmachine table \nbased on industry \nstandards and \nindustry \nguidelines. \n2.2  Machine vice is \naligned on machine \nx-axis according to \noperations’ manual \nand industry \nguidelines. \n2.3  Machine vice is \nclamped on \nmachine table \nfollowing \nestablished \nprocedure and \nindustry \nguidelines. \n2.1  Procedure in \nmounting, \naligning and \nclamping of \nmachine vice \n2.2  Sizes of machine \nvice \n2.3  Operations \nmanual \n2.4  OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n2.5  OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n2.6  OSH Rule No. \n1150 – Materials \nHandling & \nStorage \n2.1  Mounting \nmachine vice \n2.2  Aligning machine \nvice \n2.3  Clamping \nmachine vice \n2.4  Applying safety \npractices \n2.5  Wearing of PPEs \n3.  Set up workpiece \n3.1  Workpiece is \nmatched with the \nmachine following \nwork requirements \nand industry \nguidelines. \n3.2  Workpiece is \nmounted and \ncentered on \nmachine vice \naccording to \nindustry standards \nand work \nrequirements and \nindustry \nguidelines. \n3.1  Setting up \nworkpiece and \nmachine \n3.2  Computation of \ncutting speed, \nfeed and spindle \nspeed \n3.3  Types of \nmaterials, \nsupplies and tools \n3.4  Measuring of \ndimensions \n3.5  English to metric \nconversion \n3.6  Interpretation of \ndrawing and \nalphabet of lines \n3.7  OSH Rule No. \n1070 – \n3.1  Mounting and \ncentering \nworkpiece \n3.2  Setting up \nworkpiece and \nmachine \n3.3  Measuring \nworkpiece \n3.4  Applying safety \nprocedures\n\n--- PDF PAGE 85 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          81 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nOccupational \nHealth & \nEnvironmental \nControl \n3.8  OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n3.9  OSH Rule No. \n1150 – Materials \nHandling & \nStorage \n3.10 Noise pollution \n3.11 Air pollution \n4.  Set up cutting tools \n4.1  Cutting tools and \ncutting holders are \nselected according \nto job requirements \nand industry \nguidelines. \n4.2  Cutting holder with \ntool is mounted on \nthe spindle \nfollowing \nestablished industry \npractices and \nindustry \nguidelines. \n4.1  Types of cutting \ntools  \n4.2  Types of holder \n4.3  Measuring of \ndimensions  \n4.4  English to metric \nconversion \n4.5  OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n4.6  Noise pollution \n4.7  Air pollution \n4.8  Mounting \nprocedure \n4.9  Hierarchy of \nhazard control \nmeasures \n4.1  Selecting of \ncutting tools \n4.2  Mounting cutting \ntools and tool \nholder \n4.3  Applying safety \npractices \n5.  Perform milling \noperations \n5.1  Speeds and feeds \nare calculated \nbased on job \nrequirements. \n5.2  Milling machine is \nset-up according to \ncalculated speeds \nand feeds and \nindustry \nguidelines. \n5.3  Milling machine \naccessories are \nused according to \njob requirements \nand industry \nguidelines. \n5.4  Milling is conducted \naccording to job \n5.1  Selection of \nmilling machine \naccessories  \n5.2  Procedure in \noperating milling \nmachine  \n5.3  Use of PPEs \n5.4  Procedure in \nchecking \nworkpiece \n5.5  English to metric \nconversion \n5.6  Computation \nspeeds, feeds \nand spindle \nrevolution \n5.7  Interpretation of \ndrawing and \n5.1  Computing \nspeeds, feeds \nand spindle \nrevolution \n5.2  Procedure in \nusing \nappropriate \nmilling \naccessories  \n5.3  Conducting \nmilling operation \n5.4  Applying safety \nprocedures \n5.5  Checking \nworkpiece \n5.6  Wearing of PPEs\n\n--- PDF PAGE 86 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          82 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nrequirements \nfollowing \nmanufacturer’s \nmanual and \nindustry \nguidelines. \n5.5  Performance of \nthe machine and \ncutting tools are \nmonitored based on \nthe accepted \nindustry standards \nand industry \nguidelines. \n5.6  Workpiece is \nchecked and \nmeasured during \nand after milling \noperations following \nwork specification \nand industry \nguidelines. \n5.7  Irregularities are \nreported to \nimmediate \nsupervisor following \nindustry standards. \nalphabet of lines \n5.8  Set-up cutting \nspeed and feeds, \n& depth of cut \n5.9  Cutting speed and \nfeeds reference \nchart \n5.10 Procedures in \nreporting \nirregularities \n5.11 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n5.12 OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n5.13 OSH Rule No. \n1150 – Materials \nHandling & \nStorage \n5.14 Noise pollution \n5.15 Air pollution \n6.  Perform post-\nmilling operations \n6.1  Finished workpiece \nis checked and \nsubmitted to \nimmediate \nsupervisor following \nindustry procedure \nand industry \nguidelines. \n6.2  Accomplishment \nreport is prepared \nfollowing workplace \nprocedures. \n6.3  Milling is shutdown \naccording to \nmanufacturer’s \nmanual and \nindustry \nguidelines. \n6.4  Tools are \nmaintained and \nstored based on \nestablished \nprocedures and \nindustry \nguidelines. \n6.1  Checking of \nfinished \nworkpiece \n6.2  Preparation of \nreport \n6.3  Procedure of \nshutting down of \nmilling \n6.4  Storage of tools \nand materials \n6.5  Tagging of \ndefective tools \nand machine \n6.6  5S of good \nhousekeeping \n6.7  3Rs \n6.8  Waste \nmanagement \n6.9  Application of \nanti-corrosion \nagents \n6.10 OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \n6.1  Shutting down \nmilling \n6.2  Cleaning and \nstoring tools and \nmaterials \n6.3  Performing good \nhousekeeping \n6.4  Preparing \naccomplishment \nreport \n6.5  Tagging \ndefective tools \nand machine \n6.6  Managing \nwastes \n6.7  Applying safety \npractices\n\n--- PDF PAGE 87 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          83 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n6.5  Defective tools and \nmachines are \ntagged and \nreported according \nto workplace \nprocedures. \n6.6  Good \nhousekeeping is \nperformed following \n5S. \n6.7  Waste \nmanagement is \npracticed according \nto industry \nguidelines. \nDevices \n6.11 OSH Rule No. \n1210 – Electrical \nSafety \n6.12 RA 6969-Toxic \nSubstances and \nHazardous and \nNuclear Wastes \nControl Act of \n1990 \n6.13 RA 9003-\nEcological Solid \nWaste \nManagement Act \nof 2000\n\n--- PDF PAGE 88 ---\nMachining NC I                                  Revision 01                     Promulgated (01/