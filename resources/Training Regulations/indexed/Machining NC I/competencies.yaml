        "source_text": "--- PDF PAGE 24 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          20 \n  \n  \nUNIT OF COMPETENCY \n: \nSUPPORT INNOVATION \n \nUNIT CODE \n: \n400311105 \n \nUNIT DESCRIPTOR \n: \nThis unit of covers the knowledge, skills and attitudes  \nrequired to identify, recognize and support innovation. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Identify the need \nfor innovation in \none’s area of work \n1.1  The value of \ninnovative practices \nin the workplace is \nrecognized. \n1.2  Creativity in \ninnovation in one’s \nscope of work is \napplied. \n1.3  The need for \ninnovation in own \nscope of work is \nrecognized. \n1.1  Clear-cut \ndefinition of \ninnovation \n1.2  Current practice \nin own scope of \nwork \n1.3  Workplace \nprocedures \n1.1  Contributing in \nbrainstorming \nsession \n1.2  Examining \ncurrent practice \nin one’s scope of \nwork \n1.3  Identifying issues \nand concerns of \none’s scope of \nwork \n2.  Recognize \ninnovative and \ncreative ideas \n2.1  Opportunities within \nthe team are \nidentified to develop \ninnovation. \n2.2  Creative ideas of \ncoworkers pertaining \nto work practices are \nanalyzed. \n2.3  Environment \nconducive for \nlearning and \ninnovating is \nmaintained. \n2.1  Support required \nto generate \ncreative ideas \n2.2  Difference \nbetween \ninnovation and \ncreativity \n2.3  Innovative climate \nin one’s scope of \nwork \n2.1  Identifying \nresources \nrequired for \ncreativity and \ninnovation  \n2.2  Examining \npotential \nobstacles to and \nopportunities for \ncreativity and \ninnovation  \n2.3  Communicating \ncreative ideas of \nco-workers \n3.  Support individuals’ \naccess to flexible \nand innovative \nways of working \n3.1  Individuals and key \npeople are reinforced \nto identify innovative \nideas to achieve \noutcomes. \n3.2  Sharing of best \npractices using \nflexible and \ninnovative ways of \nworking is \naccomplished. \n3.3  Obstacles to progress \nin implementing \nflexible and \ninnovative ways of \nworking are \nrecognized. \n3.1  The role of \nemployees/worke\nrs in the \nimprovement of \npractices in the \norganization \n3.2  Best practices \nusing flexible and \ninnovative ways \nof working \n3.3  Obstacles in \nimplementing \ninnovation in \none’s scope of \nwork \n3.1  Encouraging co-\nworkers to \ngenerate and \ndevelop ideas \n3.2  Evaluating \npotential \nobstacles to and \nopportunities for \ncreativity and \ninnovation  \n3.3  Sharing of best \npractices related \nto innovation and \ncreativity\n\n--- PDF PAGE 25 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          21 \n  \n  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Innovative practices \nMay include but not : \n1.1   Self-directed support \n1.2   Community based services \n1.3   Working within a collaborative arrangement \n1.4   Making scope of work more efficient \n2.  Innovation \nMay include: \n2.1   New ideas \n2.2   Original ideas \n2.3   Different ideas \n2.4   Methods or tools\n\n--- PDF PAGE 26 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          22 \n  \n  \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Identified need for innovation in the area of work  \n1.2   Recognized innovative and creative ideas \n1.3   Pursed agreement for flexible and innovative ways of \nworking \n1.4   Supported individuals and people to access flexible and \ninnovative ways of working \n2.  Resource \nImplications \nSpecific resources for assessment \n2.1   Evidence of competent performance should be obtained \nby observing an individual in an information management \nrole within the workplace or operational or simulated \nenvironment. \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Written Test \n3.2   Interview \n \nThe unit will be assessed in a holistic manner as is practical and \nmay be integrated with the assessment of other relevant units of \ncompetency. Assessment will occur over a range of situations, \nwhich will include disruptions to normal, smooth operation. \nSimulation may be required to allow for timely assessment of \nparts of this unit of competency. Simulation should be based on \nthe actual workplace and will include walk through of the \nrelevant competency components.  \n4.  Context for \nAssessment \n4.1   Competency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions\n",
