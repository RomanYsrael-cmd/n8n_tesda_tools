        "source_title": "PERFORM BENCH WORK (BASIC)",
        "source_text": "--- PDF PAGE 71 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          67 \n  \n  \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n: \nPERFORM BENCH WORK (BASIC) \n \nUNIT CODE \n: \nMEE722311 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competencies required to determine  \njob requirements, perform basic bench work operations  \n(i.e. layout; cutting with hacksaw and chisel; filing;  \ndrilling; tapping etc.) and check the components for  \nconformance to specifications. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Conduct pre-bench \nwork operation \n1.1  Drawing is interpreted \nand confirmed with the \nsupervisor. \n1.2  Sequence of operation \nis determined to \nproduce component to \nspecifications. \n1.3  Tools, materials and \nsupplies are obtained \nand checked \naccording to drawing \nspecifications with \ninstruction of \nimmediate supervisor. \n1.4  Cutting tools and \nmarking tools are \nsharpened following \nindustry procedure \nand industry \nguidelines. \n1.5  Materials’ dimensions \nare checked using \nmeasuring tools to \nmaximize material’s \nusage and industry \nguidelines. \n1.6  Checklist is \naccomplished \naccording to company \nprocedures. \n1.1  Kinds of Bench \nwork materials, \ntools and supplies  \n1.2  Sequence of \nOperation \n1.3  Procedures in \nchecking tools \nand materials \n1.4  Procedure of Off-\nhand grinding of \ncutting and \nmarking tools \n1.5  Measurement of \ndimensions \n1.6  English to metric \nconversion \n1.7  Interpretation of \ndrawing and \nalphabet of lines \n1.8  OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n1.9  OSH Rule No. \n1150 – Materials \nHandling & \nStorage \n1.10 Air pollution \n1.11 Noise pollution \n1.12 Quality control \n1.1  Obtaining \nmaterials \n1.2  Interpreting \ndrawing \n1.3  Applying safety \nprocedures \n1.4  Checking \nworkpiece \n1.5  Sharpening of \ncutting and \nmarking tools \n1.6  Identifying and \nsegregating \ndefective cutting \ntools and \nmaterials \n2.  Conduct bench \nwork operations \n2.1  Bench work \noperations are \nperformed according \nto industry standards \nand industry \nguidelines. \n2.2  Workpiece is \nchecked/measured in \n2.1  ISO Metal \nManufacturing \nstandards \n2.2  Procedures in \nchipping \nworkpiece to its \nsquareness \n2.3  Procedures in \n2.1  Using bench \nwork tools \n2.2  Using clamping \ndevice \n2.3  Cutting, chipping \nand filing flat \nrectangular or \nround bar\n\n--- PDF PAGE 72 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          68 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nconformance to \ndrawing specification \nand industry \nguidelines. \n2.3  Rejected workpiece is \nreported following \nindustry procedures. \nfiling of workpiece \n2.4  Procedures in \ncutting of \nworkpiece using \nhacksaw \n2.5  Procedures in \nreplacing a dull \nhacksaw blade  \n2.6  Procedures in \nchecking \nworkpiece \n2.7  Classification of \nfile \n2.8  Classification of \nhacksaw blade \n2.9  Measurement of \ndimensions  \n2.10 English to metric \nconversion \n2.11 OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n2.12 OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n2.13 Air pollution \n2.14 Noise pollution \n2.4  Applying safety \nprocedures \n2.5  Checking \nworkpiece \n3.  Conduct post \nbench work \noperations \n3.1  Report of \naccomplishment is \nprepared and \nsubmitted to \nimmediate supervisor \nfollowing industry \nstandards \n3.2  Good housekeeping is \nperformed following \n5S \n3.3  Wastes are managed \naccording to \nEcological Solid \nWaste Management \nAct of 2000. \n3.4  Safety practices are \napplied following \nOSHS \n3.1  ISO Metal \nManufacturing \nstandards \n3.2  5S \n3.3  3Rs \n3.4  OSHS \n3.5  RA 9003-\nEcological Solid \nWaste \nManagement Act \nof 2000 \n3.6  Preparation of \nreport \n3.1  Managing \nwastes \n3.2  Reporting skills \n3.3  Applying OSHS\n\n--- PDF PAGE 73 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          69 \n  \n  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Materials \nIncludes: \n1.1   Ferrous \n1.2   Non-ferrous \n2.  Layout tools and supplies \nMay include: \n \n2.1   Bench work tools: \n2.1.1   V-block \n2.1.2   Angle plates \n2.1.3   Surface plate \n2.1.4   Scriber \n2.1.5   Center punch \n2.1.6   Ball peen hammer \n2.1.7   Angle square \n2.1.8   Spot facing tool \n2.1.9   Thread pitch gauge \n2.1.10 Tap wrench \n2.1.11 Drill point sharpening gauge \n2.1.12 Set of combination wrench \n \n2.2   Supplies: \n2.2.1   Dyes \n2.2.2   Sand paper \n2.2.3   Rags \n2.2.4   Safety glasses \n2.2.5   Gloves \n2.2.6   Dust mask \n2.2.7   Ear plugs \n2.2.8   Lubricants/cutting oil \n2.2.9   Paint brushes, 1” \n2.2.10 File card \n2.2.11 Steel brush \n2.2.12 Bench work table, 3’x6’ \n2.2.13 Bench work chair \n2.2.14 Grinding Wheel \n2.2.15 Grinding wheel dresser \n3.  Measuring tools \nMay include: \n3.1   Steel rule, 300mm \n3.2   Vernier Caliper, 150mm \n3.3   Vernier Caliper, 300mm \n3.4   Combination square, 12” (300mm) \n3.5   Micrometers, 0-25mm, 25-50mm \n3.6   Protractor, 100mm \n4.  Bench work operations \nInclude: \n4.1   Laying - out \n4.2   Cutting/hacksaw \n4.3   Chipping \n4.4   Filing \n4.5   Drilling \n4.6   Counter boring \n4.7   Counter sinking\n\n--- PDF PAGE 74 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          70 \n  \n  \nVARIABLE \nRANGE \n4.8   Reaming \n4.9   Manual threading using Tap and/or Stock and Die \n4.10 Spot-facing \n4.11 Off-Hand grinding \n5.  Cutting tools \nMay include: \n5.1   File \n5.2   Chisel \n5.3   Set of twist drill, dia 1-14mm \n5.4   Hacksaw \n5.5   #3 Center drill \n5.6   Spot facing tool \n5.7   Set of stock and dies, M4-M14 \n5.8   Grinding Wheel \n5.9   Countersink \n5.10 Counter bore drill, dia 20mm \n5.11 Set of hand taps, M4-M14 \n5.12 Set of fixed reamers, dia 4-14mm \n6.  Industry guidelines \nMay include: \n6.1   OSH Rule No. 1070 – Occupational Health & \nEnvironmental Control \n6.2   OSH Rule No. 1080 – Personal Protective \nEquipment & Devices \n6.3   OSH Rule No. 1150 – Materials Handling & Storage\n\n--- PDF PAGE 75 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          71 \n  \n  \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Conducted pre-bench work operations \n1.2   Conducted bench work operations \n1.3   Conducted post bench work operations \n1.4   Applied safety practices \n2.  Resource \nimplications \nThe following resources MUST be provided: \n2.1   Tools, equipment and facilities appropriate to processes or \nactivity \n2.2   Materials relevant to the proposed activity \n2.3   Drawings, sketches or blueprint \n3.  Method of \nassessment \nCompetency may be assessed through: \n3.1   Direct observation \n3.2   Written exam \n3.3   Oral questioning \n3.4   Demonstration \n3.5   Third party report \n3.6   Portfolio \n3.7   Interview \n4.  Context for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
