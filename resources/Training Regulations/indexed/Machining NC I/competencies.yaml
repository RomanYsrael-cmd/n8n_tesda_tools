        "source_title": "MEASURE WORKPIECE (BASIC)",
        "source_text": "--- PDF PAGE 60 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          56 \n  \n  \nUNIT OF COMPETENCY \n: \nMEASURE WORKPIECE (BASIC) \n \nUNIT CODE \n: \nMEE722205 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competencies required to measure  \nworkpieces using measuring instruments such as steel  \nrule, Vernier caliper, micrometer, etc. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Select and use \nmeasuring tools \n1.1  Measuring tools \nare selected and \nused according to \nthe level of \naccuracy required. \n1.2  Measurements \ntaken are accurate \nto the finest \ngraduation of the \nselected measuring \ninstrument. \n1.3  Measuring \ntechnique used is \ncorrect and \nappropriate to the \ndevice used. \n1.1  Shop safety \npractices \n1.2  Safe working \nhabits \n1.3  Safe handling of \nmeasuring tools \n1.4  Measurement \n1.5  Linear measuring \ntools \n1.6  Angle measuring \ntools \n1.7  Bore measuring \ntools \n1.1  Ability to use \nmeasuring tools \nsafely \n1.2  Ability to handle \nmeasuring tools \nsafely  \n1.3  Reading skills to \ninterpret \nmanufacturer’s \ninstructions \n2.  Clean and store \nmeasuring tools \n2.1  Care and storage of \ndevices undertaken \nto manufacturer’s \nspecifications or \nstandard operating \nprocedures. \n2.1  Safe handling and \nstorage of \nmeasuring tools \n2.1  Ability to handle \nmeasuring tools \nsafely  \n2.2  Reading skills to \ninterpret \nmanufacturer’s \ninstructions\n\n--- PDF PAGE 61 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          57 \n  \n  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Measuring tools \nMeasuring tools include: \n1.1   Steel tape \n1.2   Steel rule \n1.3   Straight edge \n1.4   Combination square \n1.5   Steel square \n1.6   Divider or trammel \n1.7   Caliper \n1.8   Protractor \n1.9   Vernier caliper \n1.10 Micrometer \n2.  Measurements \n2.1   Length \n2.2   Diameter \n2.3   Depth \n2.4   Flatness \n2.5   Straightness \n2.6   Squareness\n\n--- PDF PAGE 62 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          58 \n  \n  \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate:   \n1.1   Selected and used measuring instruments \n1.2   Cleaned and stored measuring instruments \n2.  Resource \nimplications \nThe following resources MUST be provided \n2.1   Tools, equipment and facilities appropriate to the activity \n2.2   Specimen component or part to the proposed activity \n3.  Method of \nassessment \nCompetency may be assessed through: \n3.1   Direct observation  \n3.2   Demonstration  \n3.3   Written or oral short answer questions \n3.4   Portfolio \n4.  Context for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
