          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Confirm job \nrequirements \n1.1  Drawing is \ninterpreted and \nconfirmed with the \nsupervisor. \n1.2  Sequence of \noperation is \ndetermined to \nproduce component \nspecifications. \n1.3  Materials, hand \ntools and supplies \nare prepared and \ninspected based on \nthe drawing with \ninstruction of \nimmediate \nsupervisor and \nindustry \nguidelines. \n1.4  Machine condition \nis verified for \nserviceability and \nindustry \nguidelines. \n1.5  Cutting tools and \nmeasuring tools \nare prepared \naccording to the \nrequirements of the \noperation and \nindustry \nguidelines. \n1.6  Defective materials \nand tools are \nreported to \nimmediate \nsupervisor following \nindustry standards. \n1.7 Materials’ \ndimensions are \n1.1  Drafting/drawing \nskills to include \nability to apply \nknowledge in \nlimits, fits, \ntolerances and \nsurface texture of \nworkpiece \n1.2  Determination of \nsequence of \noperation \n1.3  Different forms of \ncutting tools \n1.4  Preparation of \ncutting tools \n1.5  Different types of \nmaterials, \nsupplies and tools \n1.6  Measuring of \ndimensions \n1.7  English to metric \nconversion \n1.8  OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n1.9  OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n1.10 OSH Rule No. \n1150 – Materials \nHandling & \nStorage \n1.11 OSH Rule No. \n1200 – Machine \nGuarding \n1.1  Interpreting \ndrawing \n1.2  Determining the \nsequence of \noperation \n1.3  Obtaining \nmaterials \n1.4  Preparing and \nchecking \nmaterial and \ntools \n1.5  Preparing and \nchecking cutting \ntools \n1.6  Measuring \nworkpiece \n1.7  Conducting \nmachine dry run \n1.8  Performing off-\nhand grinding of \ncutting tools\n\n--- PDF PAGE 77 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          73 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nchecked using \nmeasuring tools to \nmaximize materials’ \nusage and industry \nguidelines. \n1.12 OSH Rule No. \n1210 – Electrical \nSafety \n1.13 Noise pollution \n1.14 Air pollution \n2.  Set up workpiece \n2.1  Workpiece is \nmatched with the \nmachine following \nwork requirements. \n2.2  Workpiece is \nmounted and \ncentered on chuck \naccording to \nindustry standards \nand work \nrequirements and \nindustry \nguidelines. \n2.3  Centering \ninstruments are \nused according to \nwork requirements \nand industry \nguidelines. \n2.1  Use and types of \ncentering \ninstruments \n2.2  Setting-up work \npiece and \nmachine safely \n2.3  Types of \nmaterials, \nsupplies and tools \n2.4  Measuring of \ndimensions \n2.5  English to metric \nconversion \n2.6  OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n2.7  OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n2.8  OSH Rule No. \n1150 – Materials \nHandling & \nStorage \n2.9  Noise pollution \n2.10 Air pollution \n2.1  Mounting and \ncentering \nworkpiece \n2.2  Setting-up \nworkpiece and \nmachine \n2.3  Measuring \nworkpiece \n2.4  Applying safety \nprocedures \n3.  Set up cutting tools \n3.1  Cutting tools and \ncutting holders are \nselected according \nto job requirements \nand industry \nguidelines. \n3.2  Cutting tools are \nmounted to the \nholder following \nindustry standards \nand industry \nguidelines. \n3.3  Tool holder is \nmounted on the tool \npost following \nestablished industry \npractices. \n3.1  Mounting \nprocedure \n3.2  Centering \nprocedure \n3.3  Centering tools \n3.4  OSH Rule No. \n1070 – \nOccupational \nHealth & \nEnvironmental \nControl \n3.5  OSH Rule No. \n1080 – Personal \nProtective \nEquipment & \nDevices \n3.1  Mounting cutting \ntools and tool \nholder \n3.2  Centering cutting \ntools \n3.3  Applying safety \nproc