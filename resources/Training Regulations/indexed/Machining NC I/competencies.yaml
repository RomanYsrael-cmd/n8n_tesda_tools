        "source_text": "--- PDF PAGE 91 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          87 \n  \n  \nUNIT OF COMPETENCY \n: \nGRIND WORKPIECE \n \nUNIT CODE \n: \nMEE722314 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills required to set up and surface  \ngrind pre-milled work piece to drawing specifications. It  \ndetails the requirements for grinding parallel surfaces  \nand square surfaces. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Confirm job \nrequirements \n1.1  Drawing is interpreted \nand confirmed with \nthe supervisor. \n1.2  Sequence of \noperation is \ndetermined to \nproduce component \nto specifications. \n1.3  Workpiece is \nprepared and \ninspected based on \nthe drawing and \nindustry guidelines. \n1.4  Grinding wheel and \nmeasuring tools are \nprepared according to \nthe requirements of \nthe operation and \nindustry guidelines. \n1.5  Machine condition \nis verified for \nserviceability and \nindustry guidelines. \n1.6  Defective workpiece \nand grinding wheel \nare reported to \nimmediate supervisor \nfollowing industry \nstandards and \nindustry guidelines. \n1.1  Drafting/ drawing \nskills to include \nability to apply \nknowledge in fits, \ntolerances and \nsurface texture of \nworkpiece \n1.2  Determination of \nsequence of \noperation \n1.3  Types of grinding \nwheels \n1.4  Types of \nmaterials and \nsupplies \n1.5  Measuring of \ndimensions \n1.6  English to metric \nconversion \n1.7  Hot work permit \nsystem \n1.8  OSH Rule No. \n1070 – \nOccupational \nHealth and \nEnvironmental \nControl \n1.9  OSH Rule No. \n1080 – Personal \nProtective \nEquipment and \nDevices \n1.10 OSH Rule No. \n1150 – Materials \nHandling and \nStorage \n1.11 Noise pollution \n1.12 Air pollution \n1.1  Interpreting \ndrawing \n1.2  Selecting of \nmaterials \n1.3  Determining the \nsequence of \noperation \n1.4  Selecting \ngrinding wheels \n1.5  Measuring \nworkpiece \n1.6  Conducting \nmachine dry run \n2.  Set up workpiece \n2.1  Workpiece is \nmatched to grinding \nmachine following \nwork requirements \n2.1  Setting up work \npiece and \nmachine \n2.2  Use of magnetic \n2.1  Setting up \nworkpiece \napplying OSH\n\n--- PDF PAGE 92 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          88 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nand industry \nguidelines. \n2.2  Workpiece is \nmounted on work \nholding devices \naccording to industry \nstandards and \nindustry guidelines. \n2.3  Precision vice is used \nto hold workpiece \nfollowing industry \nstandards and \nindustry guidelines. \nplate \n2.3  Use of precision \nvice \n2.4  OSH Rule No. \n1080 – Personal \nProtective \nEquipment and \nDevices \n2.5  OSH Rule No. \n1150 – Materials \nHandling and \nStorage \n3.  Set up surface \ngrinding machine \n3.1  Grinding wheel is \nselected based on job \nrequirements and \nindustry guidelines. \n3.2  Grinding wheel is \nmounted based on \njob requirements and \nindustry guidelines.  \n3.3  Grinding wheel is \ndressed based on \nestablished industry \npractices and \nindustry guidelines. \n3.1  Types of grinding \nwheel \n3.2  Procedure in \nmounting grinding \nwheel \n3.3  Types of dressing \nwheel \n3.4  OSH Rule No. \n1070 – \nOccupational \nHealth and \nEnvironmental \nControl \n3.5  OSH Rule No. \n1080 – Personal \nProtective \nEquipment and \nDevices \n3.1  Selecting, \nmounting, and \ndressing grinding \nwheel \n4.  Perform grinding \noperations \n4.1  Grinding machine \naccessories are \nused according to job \nrequirements and \nindustry guidelines. \n4.2  Surface grinding is \nconducted according \nto job requirements \nand industry \nguidelines. \n4.3  Performance of \ngrinding wheel is \nmonitored based on \nindustry standards \nand industry \nguidelines. \n4.4  Workpiece is checked \nand measured during \nand after grinding \noperation following \nwork specification \n4.1  Appropriate use \nof grinding \nmachine \naccessories  \n4.2  Procedure in \noperating grinding \nmachine \n4.3  Procedure in \nchecking \nworkpiece \n4.4  Safety practices \nusing PPEs \n4.5  Procedures in \nreporting \nirregularities \n4.6  OSH Rule No. \n1070 – \nOccupational \nHealth and \nEnvironmental \nControl \n4.1  Using grinding \nmachine \naccessories  \n4.2  Operating \ngrinding machine \n4.3  Applying safety \npractices \n4.4  Checking \nworkpiece \n4.5  Reporting \nirregularities\n\n--- PDF PAGE 93 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          89 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nand industry \nguidelines. \n4.5  Irregularities are \nreported to immediate \nsupervisor following \nindustry standards. \n4.7  OSH Rule No. \n1080 – Personal \nProtective \nEquipment and \nDevices \n4.8  OSH Rule No. \n1090 – \nHazardous \nMaterials \n4.9  OSH Rule No. \n1150 – Materials \nHandling and \nStorage \n4.10 OSH Rule No. \n1200 – Machine \nGuarding \n5.  Perform post-\ngrinding operations \n5.1  Finished workpiece is \nchecked and \nsubmitted to \nimmediate supervisor \nfollowing industry \nprocedure and \nindustry guidelines. \n5.2  Accomplishment \nreport is prepared \nfollowing workplace \nprocedures. \n5.3  Grinding machine is \nshutdown according \nto manufacturer’s \nmanual and industry \nguidelines. \n5.4  Tools are maintained \nand stored based on \nestablished \nprocedures and \nindustry guidelines. \n5.5  Defective tools and \nmachines are tagged \nand reported \naccording to \nworkplace \nprocedures. \n5.6  Good housekeeping \nis performed following \n5S. \n5.7  Solid waste \nmanagement is \npracticed according \nto Ecological Solid \nWaste Management \nAct of 2000. \n5.1  Checking of \nfinished \nworkpiece \n5.2  Preparation of \nreport \n5.3  Procedure of \nshutting down of \ngrinding machine \n5.4  Storage of tools \nand materials \n5.5  Tagging of \ndefective tools \nand lathe \n5.6  5S of good \nhousekeeping \n5.7  3Rs \n5.8  Application of \nanti-corrosion \nagents \n5.9  OSH Rule No. \n1080 – Personal \nProtective \nEquipment and \nDevices \n5.10 OSH Rule No. \n1150 – Materials \nHandling and \nStorage \n5.11 RA 9003-\nEcological Solid \nWaste \nManagement Act \nof 2000 \n5.1  Shutting down \ngrinding machine \n5.2  Cleaning and \nstoring tools and \nmaterials \n5.3  Performing good \nhousekeeping \n5.4  Preparing \naccomplishment \nreport \n5.5  Tagging \ndefective tools \nand equipment \n5.6  Managing \nwastes \n5.7  Applying safety \npractices\n\n--- PDF PAGE 94 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          90 \n  \n  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Sequence of operation \nMay include: \n1.1   Surfaces to flatness \n1.2   Sides to squareness \n1.3   Angular cuts \n1.4   Undercuts or slots \n1.5   Shoulders \n2.  Work holding devices \nMay include: \n2.1   Magnetic Plate \n2.2   Magnetic V-block \n2.3   Parallel Bars \n2.4   Precision vise  \n2.5   Magnetic sine chuck \n2.6   Cylindrical grinding attachment \n3.  Grinding machine \naccessories \nMay include: \n3.1   Precision Vise \n3.2   Magnetic Plate \n3.3   Parallel bars \n3.4   Grinding Wheel Dresser \n3.5   Grinding wheel hub \n4.  Measuring tools \nIncludes: \n4.1   Micrometers, 0-25mm,25-50mm \n4.2   Vernier Caliper, 150mm \n4.3   Dial indicator \n4.4   Depth micrometers, 0-25mm,25-50mm \n5.  Workpiece \nIncludes: \n5.1   Pre-milled Steel Plate \n5.2   Pre-milled Steel Bars \n6.  Machine condition \nMay include: \n6.1   Electrical \n6.1.1   Switches \n \n6.2   Mechanical \n6.2.1   Table travel (horizontal and transversal) \n6.2.2   Spindle rotation \n6.2.3   Spindle travel (vertical) \n \n6.3   Dust collector \n6.3.1   Motor pump \n6.3.2   Vacuum filter \n \n6.4 Coolant System \n6.4.1 Motor Pump \n6.4.2 Coolant Circulation \n6.4.3 Coolant water level \n7.  Industry guidelines \nMay include: \n7.1   OSH Rule No. 1070 – Occupational Health and \nEnvironmental Control \n7.2   OSH Rule No. 1080 – Personal Protective\n\n--- PDF PAGE 95 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          91 \n  \n  \nVARIABLE \nRANGE \nEquipment and Devices \n7.3   OSH Rule No. 1090 – Hazardous Materials \n7.4   OSH Rule No. 1150 – Materials Handling and \nStorage \n7.5   OSH Rule No. 1200 – Machine Guarding \n7.6   RA 9003-Ecological Solid Waste Management Act \nof 2000 \n \n \n \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate:   \n1.1   Confirmed job requirements \n1.2   Set up workpiece \n1.3   Set up surface grinding machine \n1.4   Performed grinding operations \n1.5   Checked workpiece \n1.6   Performed post-grinding operations \n1.7   Applied safety practices \n2.  Resource \nimplications \nThe following resources MUST be provided \n2.1   Tools, equipment and facilities appropriate to processes or \nactivities \n2.2   Materials relevant to the proposed activity \n2.3   Drawings, sketches or blueprint \n3.  Method of \nassessment \nCompetency may be assessed through: \n3.1   Direct observation \n3.2   Written exam \n3.3   Oral questioning \n3.4   Demonstration \n3.5   Third party report \n3.6   Portfolio \n3.7   Interview \n4.  Context for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
