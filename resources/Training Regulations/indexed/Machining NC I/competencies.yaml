        "source_title": "INTERPRET WORKING DRAWINGS And SKETCHES",
        "source_text": "--- PDF PAGE 49 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          45 \n  \n  \nUNIT OF COMPETENCY \n: \nINTERPRET WORKING DRAWINGS And \nSKETCHES \n \nUNIT CODE \n: \nMEE722202 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the competencies required to read and  \ninterpret drawings and sketches. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Interpret \ntechnical drawing \n1.1  Components, \nassemblies or \nobjects \nrecognized as \nrequired. \n1.2  Dimensions \nidentified as \nappropriate. \n1.3  Instructions \nidentified and \nfollowed as \nrequired. \n1.4  Material \nrequirements \nidentified as \nrequired. \n1.5  Symbols \nrecognized as \nappropriate in the \ndrawing. \n1.6  Tolerance, limits \nand fits identified \nin the drawing. \n1.1  Alphabet of \nlines \n1.2  Projections \n1.3  Drawing \nsymbols \n1.4  Dimensioning \ntechniques \n1.5  Tolerance, \nlimits and fits \n1.6  Engineering \nmaterials \n1.7  Drawing tools \nand supplies \n1.1  Basic \ncommunication \nskills \n1.2  Reading skills \nrequired to \ninterpret \ntechnical \ndrawing \n1.3  Reading skills \nrequired to \ninterpret \ninstructions \n1.4  Ability to \nidentify kinds of \nmaterial \n2.  Prepare freehand \nsketch of parts \n2.1  Sketch drawn \ncorrectly and \nappropriately. \n2.2  Sketch depicted \nobjects or part \nappropriately. \n2.3  Dimensions \nindicated in \nsketch are clear \nand correct. \n2.4  Instructions \nincluded in sketch \nare clear and \ncorrect. \n2.5  Base line or \ndatum points \nindicated as \n2.1  Alphabet of \nlines \n2.2  Projections \n2.3  Drawing \nsymbols \n2.4  Dimensioning \ntechniques \n2.5  Drawing tools \nand supplies \n2.1  Basic \ncommunication \nskills \n2.2  Reading skills \nrequired to \ninterpret \ntechnical \ndrawing \n2.3  Reading skills \nrequired to \ninterpret \ninstructions \n2.4  Basic skills in \nfreehand \ndrawing\n\n--- PDF PAGE 50 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          46 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nrequired. \n3.  Interpret details \nfrom freehand \nsketch \n3.1  Components, \nassemblies or \nobjects \nrecognized as \nrequired. \n3.2  Dimensions \nidentified as \nappropriate. \n3.3  Instructions \nidentified and \nfollowed as \nrequired. \n3.4  Material \nrequirements \nidentified as \nrequired. \n3.5  Symbols \nrecognized as \nappropriate in the \ndrawing. \n3.1  Alphabet of \nlines \n3.2  Projections \n3.3  Drawing \nsymbols \n3.4  Dimensioning \ntechniques \n3.5  Tolerance, \nlimits and fits \n3.6  Engineering \nmaterials \n3.7  Drawing tools \nand supplies \n3.1  Basic \ncommunication \nskills \n3.2  Reading skills \nrequired to \ninterpret \ntechnical \ndrawing \n3.3  Reading skills \nrequired to \ninterpret \ninstructions \n3.4  Ability to \nidentify kinds of \nmaterial\n\n--- PDF PAGE 51 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          47 \n  \n  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Drawing \n1.1   Drawing technique include \n1.1.1   Perspective \n1.1.2   Exploded view \n1.1.3   Hidden view technique \n1.2   Projections \n1.2.1   First angle projections \n1.2.2   Third angle projections \n2.  Tolerance \nMay include: \n2.1   General tolerance \n2.2   Angular tolerance \n2.3   Geometric tolerance\n\n--- PDF PAGE 52 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          48 \n  \n  \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate:   \n1.1   Interpreted technical drawing \n1.2   Prepared sketches \n1.3   Interpreted sketches \n2.  Resource \nimplications \nThe following resources MUST be provided \n2.1   Drafting room/facilities and drafting instruments and \nsupplies appropriate to the activity \n2.2   Measuring tools \n2.3   Drawings, sketches or blueprint \n2.4   Specimen parts/components \n3.  Method of \nassessment \nCompetency may be assessed through: \n3.1   Direct observation  \n3.2   Written or oral short answer questions \n3.3   Demonstration \n3.4   Project/work sample \n3.5   Portfolio \n4.  Context for \nassessment \nCompetency may be assessed individually in the actual \nworkplace or simulation environment in TESDA accredited \ninstitutions\n",
