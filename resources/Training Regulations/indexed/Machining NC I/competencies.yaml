        "source_title": "SHAPE WORKPIECE",
        "source_text": "--- PDF PAGE 96 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          92 \n  \n  \nUNIT OF COMPETENCY \n: \nSHAPE WORKPIECE \n \nUNIT CODE \n: \nMEE722315 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the skills required to set-up and shape  \nworkpiece to drawing specifications. It details the  \nrequirements for performing shaping operations such as  \nfacing, squaring, grooving and making keyways. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Confirm job \nrequirements \n1.1  Drawing is interpreted \nand confirmed with the \nsupervisor. \n1.2  Sequence of \noperation is \ndetermined to produce \ncomponent to \nspecifications. \n1.3  Material is prepared \nand inspected based \non the drawing and \nindustry guidelines. \n1.4  Machine condition is \nverified for \nserviceability. \n1.5  Tool bits and \nmeasuring tools are \nprepared according to \nthe requirements of the \noperation and industry \nguidelines. \n1.6  Defective workpiece \nand tools are reported \nto immediate \nsupervisor following \nindustry standards. \n1.7  Materials’ dimensions \nare checked using \nmeasuring tools to \nmaximize materials’ \nusage and according to \nindustry guidelines. \n1.1  Determination of \nsequence of \noperation \n1.2  Types of \nmaterials \n1.3  Preparation of \ntool bit and \nmeasuring tools \n1.4  Measuring of \ndimensions \n1.5  English to metric \nconversion \n1.6  Interpretation of \ndrawing and \nalphabet of lines \n1.7  OSH Rule No. \n1070 – \nOccupational \nHealth and \nEnvironmental \nControl \n1.8  OSH Rule No. \n1080 – Personal \nProtective \nEquipment and \nDevices \n1.9  OSH Rule No. \n1150 – Materials \nHandling and \nStorage \n1.10 OSH Rule No. \n1210 – Electrical \nSafety \n1.11 Noise pollution \n1.12 Air pollution \n1.1  Interpreting \ndrawing \n1.2  Selecting of \nworkpiece \n1.3  Determining the \nsequence of \noperation \n1.4  Preparing tool bit \nand measuring \ntools \n1.5  Measuring \nworkpiece \n1.6  Using measuring \ntools \n2.  Setup workpiece \nand machine \n2.1  Workpiece is matched \nwith the shaper \nmachine following work \nrequirements and \nindustry guidelines. \n2.2  Workpiece is mounted \nand centered on vice \n2.1  Setting-up work \npiece and \nmachine \n2.2  Types of \nmaterials, \nsupplies and \ncutting tools \n2.1  Matching \nworkpiece to \nshaper machine \n2.2  Mounting and \ncentering \nworkpiece \n2.3  Setting-up\n\n--- PDF PAGE 97 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          93 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \naccording to industry \nstandards and \nindustry guidelines. \n2.3  Machine length of \nstroke, cutting speed \nand feed are set based \non workpiece \ndimension and \naccording to industry \nguidelines. \n2.3  Measuring of \ndimensions \n2.4  English to metric \nconversion \n2.5  Setting cutting \nspeed, feed rate \n2.6  Interpretation of \ndrawing and \nalphabet of lines \n2.7  OSH Rule No. \n1070 – \nOccupational \nHealth and \nEnvironmental \nControl \n2.8  OSH Rule No. \n1080 – Personal \nProtective \nEquipment and \nDevices \n2.9  OSH Rule No. \n1150 – Materials \nHandling and \nStorage \n2.10 Noise pollution \n2.11 Air pollution \nworkpiece and \nequipment \n2.4  Measuring \nworkpiece \n3.  Set up tool bit \n3.1  Tool bit is selected \naccording to size of tool \nbit holder and job \nrequirements, and \nfollowing industry \nguidelines. \n3.2  Tool bit is attached to \ntool bit holder following \nindustry guidelines. \n3.3  Holder with tool bit is \nmounted to tool post \naccording to job \nrequirement and \nindustry guidelines. \n3.1  Safe handling of \ntools, equipment \nand materials \n3.2  Shaper cutters \nand holders \n3.3  OSH Rule No. \n1080 – Personal \nProtective \nEquipment and \nDevices \n3.1  Mounting tool bit \nto tool holder to \ntool post \n3.2  Applying safety \npractices \n3.3  Wearing PPEs \n4.  Perform shaping \noperations \n4.1  Shaping operation is \nconducted according to \njob requirements and \nindustry guidelines. \n4.2  Performance of the \nmachine and tool bit \nare monitored based \non the accepted \nindustry standards and \nindustry guidelines. \n4.3  Workpiece is checked \nand measured during \n4.1  Procedure in \noperating shaper \nmachine  \n4.2  Types of \nmaterials and \ncutting tools \n4.3  English to metric \nconversion \n4.4  Interpretation of \ndrawing and \nalphabet of lines \n4.5  OSH Rule No. \n4.1  Operating \nshaper \n4.2  Applying safety \nprocedures \n4.3  Checking \nworkpiece\n\n--- PDF PAGE 98 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          94 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nand after shaping \noperation following \nwork specification and \nindustry guidelines. \n4.4  Irregularities are \nreported to immediate \nsupervisor following \nindustry standards. \n1070 – \nOccupational \nHealth and \nEnvironmental \nControl \n4.6  OSH Rule No. \n1080 – Personal \nProtective \nEquipment and \nDevices \n4.7  OSH Rule No. \n1200 – Machine \nGuarding \n4.8  Noise pollution \n4.9  Air pollution \n5.  Perform post-\nshaping operations \n5.1  Finished workpiece is \nchecked and submitted \nto immediate \nsupervisor following \nindustry procedure and \nindustry guidelines. \n5.2  Accomplishment report \nis prepared following \nworkplace procedures. \n5.3  Shaper is shutdown \naccording to \nmanufacturer’s manual \nand industry \nguidelines. \n5.4  Tools are maintained \nand stored based on \nestablished procedures \nand industry \nguidelines. \n5.5  Defective tools and \nmachines are tagged \nand reported according \nto workplace \nprocedures. \n5.6  Good housekeeping is \nperformed following 5S. \n5.7  Solid waste \nmanagement is \npracticed according to \nEcological Solid Waste \nManagement Act of \n2000. \n5.1  Checking of \nfinished \nworkpiece \n5.2  Preparation of \nreport \n5.3  Procedure of \nshutting down of \nshaper \n5.4  Storage of tools \nand materials \n5.5  Tagging of \ndefective tools \nand shaper \n5.6  5S of good \nhousekeeping \n5.7  3Rs \n5.8  OSH Rule No. \n1070 – \nOccupational \nHealth and \nEnvironmental \nControl \n5.9  OSH Rule No. \n1080 – Personal \nProtective \nEquipment and \nDevices \n5.10 OSH Rule No. \n1210 – Electrical \nSafety \n5.11 RA 9003-\nEcological Solid \nWaste \nManagement Act \nof 2000 \n5.1  Shutting down \nshaper \n5.2  Cleaning and \nstoring tools and \nmaterials \n5.3  Performing good \nhousekeeping \n5.4  Preparing \naccomplishment \nreport \n5.5  Tagging \ndefective tools \nand machine \n5.6  Managing \nwastes \n5.7  Applying safety \npractices\n\n--- PDF PAGE 99 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          95 \n  \n  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Sequence of operation \nMay include: \n1.1   Facing \n1.2   Squaring \n1.3   Grooving \n1.4   Machining keyways \n2.  Materials \nIncludes: \n2.1   Ferrous \n2.2   Non-ferrous \n3.  Shape accessories \nMay include: \n3.1   Machine Vice \n3.2   Parallel bars \n3.3   V-blocks \n3.4   Clamps \n3.5   T-bolts and nuts \n3.6   Rubber mallet  \n4.  Mounting of workpiece \nMay include: \n4.1   Using machine vice  \n4.2   Using three-jaw chuck (universal) \n5.  Measuring tools \nMay include: \n5.1   Steel Rule, 300mm \n5.2   Vernier Caliper, 150mm \n6.  Machine condition \nMay include: \n6.1   Electrical \n6.1.1   Switches \n \n6.2   Mechanical \n6.2.1   Table travel (horizontal) \n6.2.2   Tool post travel (vertical) \n6.2.3   Ram travel (transversal) \n7.  Performance of machine \nand tool bit \nMay include: \n7.1   Appearance of workpiece \n7.2   Sound of shaper with and without load \n7.3   Vibration of shaper \n7.4   Dullness of tool bit \n8.  Industry guidelines \nMay include: \n8.1   OSH Rule No. 1070 – Occupational Health and \nEnvironmental Control \n8.2   OSH Rule No. 1080 – Personal Protective \nEquipment and Devices \n8.3   OSH Rule No. 1150 – Materials Handling and \nStorage \n8.4   OSH Rule No. 1200 – Machine Guarding \n8.5   OSH Rule No. 1210 – Electrical Safety \n8.6   RA 9003-Ecological Solid Waste Management Act \nof 2000\n\n--- PDF PAGE 100 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          96 \n  \n  \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency  \nAssessment requires evidence that the candidate: \n1.1   Confirmed job requirements \n1.2   Set up workpiece and machine \n1.3   Set up tool bit \n1.4   Performed shaping operations \n1.5   Performed post-shaping operations   \n1.6   Applied safety practices \n2.  Resource \nimplications \nThe following resources MUST be provided \n2.1   Tools, equipment and facilities appropriate to processes or \nactivities \n2.2   Materials relevant to the proposed activity \n2.3   Drawings, sketches or blueprint \n3.  Method of \nassessment \nCompetency may be assessed through: \n3.1   Direct observation \n3.2   Written exam \n3.3   Oral questioning \n3.4   Demonstration \n3.5   Third party report \n3.6   Portfolio \n3.7   Interview \n4.  Context for \nassessment \nCompetency may be assessed in the workplace or in simulated \nworkplace environment.\n",
