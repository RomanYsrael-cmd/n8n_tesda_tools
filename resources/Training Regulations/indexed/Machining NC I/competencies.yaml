        "source_text": "--- PDF PAGE 37 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          33 \n  \n  \nUNIT OF COMPETENCY \n: \nAPPLY ENVIRONMENTAL WORK STANDARDS \n \nUNIT CODE \n: \n400311108 \n \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude to  \nidentify environmental work hazards, follow environment  \nwork procedures and comply with environmental  \nrequirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Identify \nenvironmental \nwork hazards \n1.1  Related \nenvironmental \nhazards are \nrecognized based \non environmental \nwork standards. \n1.3  Environmental work \nstandards are \ninterpreted in \naccordance to \nrelevant policies. \n1.3  Required \nresources to \nminimize effect of \nenvironmental \nhazards are \nprepared based on \nrelevant \nenvironmental work \nstandards. \n1.1  Environmental \nHazards \n1.2  Environmental \nWork Standards \n1.3  Required \nResources \n1.4  OSH Standards \n1.5  Fight against \npoverty rights \n1.6  Environmental \nProtection \n1.7  Respect of \nHuman Rights \n1.1  Critical thinking \n1.2  Problem solving \n1.3  Observation \nSkills \n2.  Follow \nenvironmental \nwork procedures \n2.1  Environmental \nprotection pre-\ncautionary activities \nare practiced based \non environmental \nwork procedures. \n2.2  Work activities are \nexecuted in \naccordance with \nEnvironmental \nWork Procedures. \n2.3  Environmental \nProtection Post-\nActivities are \naccomplished \nbased on \nenvironmental work \nprocedures. \n2.1  Environmental \nProtection \n2.2  Environmental \nWork Procedures \n2.3  Renewable \nEnergies \n2.1  Critical thinking \n2.2  Problem solving \n2.3  Observation \nSkills \n3.  Comply with \nenvironmental \nwork requirements \n3.1  Required resources \nare utilized in \naccordance with \nworkplace \n3.1  Environmental \nWork Procedures \n3.2  Environmental \nLaws \n3.1  Critical thinking \n3.2  Problem solving \n3.3  Observation \nSkills\n\n--- PDF PAGE 38 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          34 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nenvironmental \npolicies. \n3.2  Environmental \nhazardous and \nnon-hazardous \nmaterials are stored \nin accordance with \nenvironmental \nregulations. \n3.3  Hazardous and \nNon-hazardous \nWastes  disposed \naccording to \nenvironmental \nregulations. \n3.2  Environmental \nHazardous and \nNon-Hazardous \nMaterials\n\n--- PDF PAGE 39 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          35 \n  \n  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Environmental Hazards \nMay include but not limited: \n1.1   Tobacco Smoke \n1.2   Asbestos \n1.3   Lead \n1.4   Combustion Gases \n1.5   Chemicals \n1.6   Pesticides \n1.7   Pollutants \n1.8   Contaminated Drinking Water \n1.9   Noise \n1.10 Dust \n2.  Environmental Work \nStandards \nMay include but not limited: \n2.1   Air Quality Standards \n2.2   Emission Standards \n2.3   ISO 14001: Environmental Management System \n2.4   Environmental Statements \n2.5   Environmental Quality Standards \n2.6   Work Environment Measurement Standard \n3.  Required Resources \nMay include but not limited: \n3.1   Electric \n3.2   Water \n3.3   Fuel \n3.4   Telecommunications \n3.5   Supplies and Materials \n3.6   Trash Cans \n3.7   Relevant Data Sheets \n3.8   Barriers or Barricades \n4.  Environmental Protection \nMay include (but not limited to) protection against \n4.1   Overconsumption of Resources \n4.2   Destruction of Ecosystems \n4.3   Habitat Destructions \n4.4   Extinction of Wildlife \n4.5   Pollutions \n4.6   Water Degradation \n5.  Environmental Work \nProcedures \nMay include but not limited: \n5.1   Environmental pollution control measures \n5.2   Oil and Fuel use \n5.3   Disposal and Reuse \n5.4   Herbicide applications \n5.5   Breed Bird Mitigation \n5.6   Tree Removal Works \n5.7   Erosion Protection \n5.8   Scrub Clearance \n5.9   Bankside sediment clearance \n6.  Environmental Hazardous \nand Non-Hazardous \nMaterials \nMay include but not limited: \n6.1   Acids \n6.2   Adhesives \n6.3   Aerosols \n6.4   Asbestos \n6.5   Batteries\n\n--- PDF PAGE 40 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          36 \n  \n  \nVARIABLE \nRANGE \n6.6   Chemicals \n6.7   Compact fluorescent lamps \n6.8   Drugs \n6.9   Dyes \n6.10 E-Waste \n6.11 Gasoline \n6.12 Grease \n6.13 Lead \n6.14 Motor Oil \n6.15 Solvents \n6.16 Weed Killers \n7.  Environmental \nRegulations \nMay include but not limited: \n7.1   Clean Air Act \n7.2   Clean Water Act \n7.3   Endangered Species Act \n7.4   Resource Conservation and Recovery Act \n7.5   Cave Resources and Management Act \n7.6   Fisheries Code \n7.7   Forestry Code \n7.8   Mining Act\n\n--- PDF PAGE 41 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          37 \n  \n  \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Interpreted the Environmental Work Standards in \naccordance to relevant policies \n1.2   Prepared required resources to minimize effects of \nenvironmental hazards based on relevant environmental \nwork standards \n1.3   Practiced environmental protection pre-cautionary \nactivities based on environmental work procedures \n1.4   Executed work activities in accordance with environmental \nwork procedures \n1.5   Accomplished environmental protection post-activities \nbased on environmental work procedures \n1.6   Stored environmental hazardous and non-hazardous \nmaterials in accordance with environmental regulations \n1.7   Disposed hazardous and non-hazardous wastes according \nto environmental regulations  \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1   Workplace with storage facilities \n2.2   Tools, materials and equipment relevant to the tasks (ex. \nCleaning tools, cleaning materials, trash bags, etc.) \n2.3   PPE \n2.4   Manuals and references \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1   Demonstration  \n3.2   Oral questioning \n3.3   Written examination \n4.  Context for \nAssessment \n4.1   Competency assessment may occur in workplace or any \nappropriately simulated environment \n4.2   Assessment shall be observed while task are being \nundertaken whether individually or in-group\n",
