lity to identify \nkinds of material  \n2.4  Ability to select \nmaterial  \n2.5  Ability to use \nmeasuring tools\n\n--- PDF PAGE 54 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          50 \n  \n  \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nrelated science \n2.4.1 Classifica-\ntion and \nmechanical \nproperties of \nengineering \nmaterials \n3.  Cut materials \n3.1  Materials are cut \naccording to \nplans/drawing \ninstruction. \n3.2  Cutting tools/ \nequipment are \nused based on \nmanufacturers \nspecification, \nappropriate \ntechniques or the \nsafety procedure. \n3.1  Hacksaw blade \nteeth \nconfiguration \n3.2  Shop safety \npractices \n3.3  Safe working \nhabits \n3.4  Safe handling of \ntools, equipment \nand materials \n3.1  Reading skills \nrequired to \ninterpret \ninstructions in \nusing equipment \nand cutting tools \n3.2  Reading skills \nrequired to \ninterpret \ntechnical \ndrawing \n3.3  Ability to use \nHand hacksaw \n3.4  Ability to operate \nPower hacksaw\n\n--- PDF PAGE 55 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          51 \n  \n  \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Plan/drawings \nMay include: \n1.1  Dimensions \n1.2  Tolerance \n2.  Materials \nMay include: \n2.1  Ferrous \n2.2  Non-ferrous \n3.  Measuring tools \nMay include: \n3.1  Steel rule \n3.2  Steel tape measure \n4.  Cutting tools/equipment \nMay include: \n4.1   Hand hacksaw \n4.2  Power hacksaw \n5.  Safety procedure \nSafety involves the handling of: \n5.1  Equipment \n5.2  Tools \n5.3  Materials\n\n--- PDF PAGE 56 ---\nMachining NC I                                  Revision 01                     Promulgated (01/11/2019)                          52 \n  \n  \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1   Interpreted plans/drawings \n1.2   Selected natural according to the requirement \n1.3   Performed cutting operation \n1.4   Cutting tools/equipment used safely \n2.  Resource \nimplications \nThe following resources MUST be provided \n2.1   Tools, equipment and facilities appropriate processes of an \nactivity \n2.2   Materials relevant to the proposal activity \n2.3   Drawings/plans \n3.  Method \nAssessment \nCompetency may be assessed through: \n5.1   Direct observation \n5.2   Oral short answer question \n5.3   Practical exercises \n4.  Context for \nassessment \nCompetency may be assessed in the workplace or in simulated \nwork environment\n",
