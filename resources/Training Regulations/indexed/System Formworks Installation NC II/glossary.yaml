  "source_text": "DEFINITION OF TERMS\n\n1. Certification\nRefers to the process of verifying and validating competencies of a\nperson through assessment.\n2. Competency\nIs the application of knowledge, skills and attitudes to perform work\nactivities to the standard expected in the workplace.\n3. Element\nRefers to the building blocks of a unit of competency. It describes\nin outcome terms the functions that a person who works in a\nparticular area of work is able to perform\n4. Evidence Guide\nIt is a guide for assessment that provides information on critical\naspects of competency, underpinning knowledge, underpinning\nskills,\nresource\nimplications,\ncontext\nof\nassessment\nand\nassessment method.\n5. Level\nRefers to the category following the level of difficulty and\ncomplexity of skills and knowledge required to do the job.\n6. Philippine TVET\nQualification\nFramework\nRefers to a comprehensive, nationally consistent framework for\nqualifications in the TVET sector. It also provides the parameter for\nthe integration of learning and assessment in the middle skills\ndevelopment.\n7. Qualification\nRefers to the national certificate issued by the TESDA or its\naccredited industry organizations in recognition that a person has\nachieved competencies relevant to a trade or industry\n8. Range of\nVariable\nIt describes the circumstances or context in which the work is to be\nperformed.\n9. Unit of\nCompetency\nRefers to a discrete aspect of work, which would normally be\nperformed by only one person.\n10. Shoring\nRefers to the provision of temporary support with shores to a\nbuilding or an excavation.\n11. Formworks\n\n12. Scaffolds\nRefers to boarding used to contain wet concrete as it sets. The\nformworks is a temporary structure and can be made of wood or\nsteel. Once the concrete has hardened, the formworks boarding is\nremoved.\n\nRefers to the temporary elevated structure that is used as a\nplatform for supporting workers and equipment.\n\n--- PDF PAGE 50 ---\nTR System Formworks Installation NC II\n\n48\n\n13. Braces\n\nRefers to a device that holds or fastens two or more parts together\nor in place.\n14. Form oil\n\n15. Panels\n\n16. Joist\n\n17. Sheathing\n\n18. Studs\n\n19. Formties/\nwalers\n\n20. Squareness\n\nRefers to the oil applied to the interior surface of formworks to\npromote easy release from the concrete when forms are removed.\n\nRefers to a section of form sheathing, constructed from boards,\nplywood, metal sheets, etc., that can be erected and stripped as a\nunit.\n\nRefers to a steel or wood beam providing direct support for a floor.\n\nProtective covering consisting, for example, of a layer of boards\napplied to the studs and joists of a building to strengthen it and\nserve as a foundation for a weatherproof exterior.\n\nA vertical member of appropriate size (2\" x 4\" to 4\" x 10\") (or 50\nmm x 100 mm to 100 mm x 250 mm) and spacing (16\" to 30\") (or\n400 mm to 750 mm) to support sheathing or concrete forms.\n\nA tensile unit adapted to prevent concrete forms from spreading\ndue to the fluid pressure of freshly placed, unhardened concrete.\n\nThe quality or characteristic of being square or rectangular in\nshape; also refers to corners being at exactly or near right angles\n(90˚).\n21. Plumbness\nThe quality of being exactly vertical or perpendicular.\n\n--- PDF PAGE 51 ---\nTR System Formworks Installation NC II\n\n49"
