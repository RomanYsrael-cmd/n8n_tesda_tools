          "source_text": "1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrates ability to verify and comply OSHS  \n      requirements to erect and dismantle shoring / \nscaffolding. \n1.2 Demonstrates ability to identify site access.  \n1.3 Demonstrates ability to follow work instruction . \n1.4 Demonstrates ability to assess shoring / scaffold load \ncapacity. \n1.5 Demonstrates ability to erect and dismantle shoring / \nscaffolding following established / recommended \nstandard procedures. \n2. Required  \nKnowledge and \nattitude  \n2.1 OSHS and other relevant regulatory requirements \n(DOLE DO 13)  \n2.2  Quality procedures, e.g., 5S \n2.3 Environmental-conservation procedures,  \ne.g., 3R (reduce, reuse, recycle) \n2.4 Established / recommended standard procedure in the \nerection and dismantling of shoring / scaffolding. \n2.5  Ability to test and determine the required load. \n2.6 Familiarity on the types and uses of shoring / scaffolding.\n3. Required Skills \n3.1  Following OSHS and other relevant regulatory  \n       requirements for erecting and dismantling shoring /  \n       scaffolding. \n3.2  Following established / recommended standard  \n       procedures for erecting and dismantling shoring / \n       scaffolding. \n3.3  Complying ancillary requirements in the erection of  \n       advanced shoring / scaffolding. \n3.4 Identifying and avoiding hazards. \n3.5 Using hand tools. \n4. Resource Implications The following resources MUST be provided: \n \n4.1 Tools and equipment relevant to the activity \n4.2 Specifications or work instruction \n4.3 Workplace or simulated venue \n5.  Methods of \nAssessment \nCompetency may be assessed through: \n \n5.1 Direct observation / Demonstration of practical skills \n5.2 Oral questioning \n6.  Context  for \nAssessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated work environment.",
