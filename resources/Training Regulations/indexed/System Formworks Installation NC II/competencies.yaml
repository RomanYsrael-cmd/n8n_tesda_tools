        "source_title": "INSTALL SYSTEM FORMWORKS",
        "source_text": "--- PDF PAGE 35 ---\nTR System Formworks Installation NC II  \n \n33\n \nUNIT OF COMPETENCY:\nINSTALL SYSTEM FORMWORKS\nUNIT CODE\nCON712322\nUNIT DESCRIPTOR        :\nThis unit covers the knowledge, skills and attitudes \nin installation of system formworks for concrete \nwork.  It includes preparing materials, perform \nsetting out, fabricate and set/fix form system of \nstructure components and double-check installed \nformworks systems.\n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare materials, \ntools and \nequipment for \ninstalling formworks \n1.1 Approved type of PPE is selected and used according \nto job requirements and OSHS specifications.  \n1.2 Formworks components, power and hand tools \nand equipment are selected and prepared consistent \nwith job requirements. \n1.3 Materials and other semi-consumables are re-\nchecked and properly staged according to job \nrequirements. Damaged materials are reported to \nimmediate superior. \n1.4 Unexpected situations are responded to in line with \ncompany rules and regulations. \n1.5 Housekeeping is performed according to safety \nregulations. \n1.6 OSH orientation, toolbox meetings and specialized \ninstructions are participated in accordance with \norganization guidelines and procedures\n2. Perform setting out\n2.1 Base line is established/ Identified/according to the site \nlayout. \n2.2 Center line/location of columns/walls are established. \n2.3 Dimension of footing (columns & walls) are \nestablished.  \n2.4 Defined locations are marked-out using marking gauge \nor paints (columns/walls). \n2.5 Squareness of markings are checked. \n2.6 Offset lines for checking purposes are set-up.\n3. Set/fix form system \nof structure \ncomponents  \n3.1 Appropriate PPE is selected and used according to job \nrequirements and OSHS specifications. \n3.2 Form oil is applied to form panels or sheathing in \naccordance with specifications. \n3.3 Formworks components are fabricated and set to the \nrequired alignment, squareness, levelness, plumbness. \n3.4 Connectors, braces and locks are properly secured \naccording to job requirements. \n3.5 Unexpected situations are responded to in line with \ncompany rules and regulations. \n3.6 Housekeeping is performed according to safety \nregulations. \n3.7 Formworks components are set to the required output \nat the given time. \n3.8 Debris are removed in accordance to standard \nprocedure. \n4. Double-check \ninstalled formworks \nsystems \n4.1 Installed formworks are double checked in accordance \nto job instruction. \n4.2  Appropriate remedies/ adjustments are made \n to rectify non conformance to standards.  \n4.3  Appropriate personnel are notified of the accomplished \ntask.\n\n--- PDF PAGE 36 ---\nTR System Formworks Installation NC II  \n \n34\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nPersonal protective \nequipment (PPE) \nMay include: \n1.1 Gloves \n1.2 Safety shoes \n1.3 Hard hat / Helmet \n1.4 Safety/ Body harness  \n1.5 Safety goggles \n1.6 Respirator/dust mask  \n1.7 Ear muffs/ear plugs \n1.8 Face mask/shield \n2. \nFormworks components\nMay include: \n2.1 Sheathing (metal, laminated plastic) assembly \n2.2 Shoring and accessories \n2.3 Scaffolds and accessories \n3. \nPower and hand tools \nand equipment \n \nMay include: \n3.1 Compressor \n3.2 Saw(hand,circular) \n3.3 Hammer \n3.4 Meter tape \n3.5 Pencil \n3.6 Plumb bob \n3.7 Level hose \n3.8 Spirit level \n3.9 Tri-square \n4. \nMaterials and other \nsemi- consumables \nMay include: \n4.1 Lumbers/ Plywood \n4.2 Nails \n4.3 Form ties/ walers \n4.4 Form oil\n\n--- PDF PAGE 37 ---\nTR System Formworks Installation NC II  \n \n35\nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nCompetency assessment requires evidence that the candidate:\n \n1.1 Prepared materials, tools and equipment for installing \nformworks Selected and prepared materials, power and \nhand tools, equipment and PPE are consistent with job \nrequirements. \n1.2 Assembled scaffolds/shoring and braces. \n1.3 Set/fixed form system of structure components. \n1.4 Double checked installed formworks systems.\n2. Required   \nknowledge and \nattitude  \n2.1 Types and uses of PPE \n2.2 Types of formworks system \n2.3 Formworks tagging and coding systems \n2.4 Mensuration \n2.5 Materials, power and hand tools and equipment and \nspecifications \n2.6 Safe and effective use of power and hand tools  \n2.7 Fabrication, assembling and fixing procedures \n2.8 5-S  \n2.9 Environmental-conservation procedures,  \ne.g., 3R (reduce, reuse, recycle) \n2.10 Company rules and regulations \n2.11 Relevant sections of DOLE DO 13 Guidelines governing \noccupational safety and health in the construction industry.\n3. Required skills \n3.1 Using PPE \n3.2 Applying mensuration \n3.3 Preparing materials, power and hand tools and equipment \n3.4 Following safe fabricating, assembling and fixing \nprocedures  \n3.5 Following safe and effective use of power and hand tools \nand equipment. \n3.6 Communicating effectively\n4. Resource \nimplications \nThe following resources must be provided: \n4.1 Work place location \n4.2 Hand and power tools and equipment appropriate for \ninstallation of formworks components \n4.3 Materials relevant to the proposed activity \n4.4 Appropriate PPE \n5. Methods of \nassessment \nCompetency must be assessed through: \n5.1 Observation with questioning \n5.2 Demonstration with questioning \n5.3 Portfolio\n6. Context for \nassessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting.\n",
