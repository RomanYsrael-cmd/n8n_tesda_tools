        "source_title": "ASSEMBLE AND DISMANTLE SCAFFOLDS/ SHORING AND BRACES",
        "source_text": "--- PDF PAGE 30 ---\nTR System Formworks Installation NC II  \n \n28\nCORE COMPETENCIES \n \n \nUNIT OF COMPETENCY  : \nASSEMBLE AND DISMANTLE SCAFFOLDS/ \nSHORING AND BRACES \nUNIT CODE                       : \nCON 713341 \nUNIT DESCRIPTOR          : \nThis unit covers the outcomes in the erection, checking \nand dismantling of limited-height temporary structures, \nparticularly scaffolding, shoring and braces. \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the Range of \nVariables \n1.  Plan and prepare for \noperation \n1.1 Occupational Safety and Health Standards (OSHS)  \n       requirements consistent to erect and dismantle. \n       shoring / scaffolding are verified and complied with \n1.2 Site access and emergency routes are identified and  \nconfirmed. \n1.3 Work instruction is reviewed, clarified and confirmed  \n       with authorized personnel. \n1.4 Operation to erect and dismantle shoring / scaffolding \nis determined and planned in line with job and site  \nrequirements. \n1.5 Purpose of shoring / scaffolding is confirmed and \nassociated activities are identified. \n1.6 Equipment are selected in accordance with work \nrequirements. \n1.7 OSH orientation, toolbox meetings and specialized \ninstructions are participated in accordance with \norganization guidelines and procedures \n \n2.   Erect shoring / \nscaffolding \n2.1 Shoring / scaffolding and components are inspected \nwith damaged components are isolated, labeled, \ntagged and rejected. \n2.2 Footings are prepared in accordance with OSHS \nrequirements, codes of practice, manufacturer \nspecifications and engineer's instructions. \n2.3 Shoring / scaffolding is set out and erected in \naccordance with OSHS requirements and \nmanufacturer specifications. \n2.4 Fall protection devices are installed in  \n      accordance with job specification and OSHS  \n      requirements.\n\n--- PDF PAGE 31 ---\nTR System Formworks Installation NC II  \n \n29\n \nELEMENT \nPERFORMANCE CRITERIA \nBold and Italicized terms are elaborated in the Range of \nVariables\n3.  Inspect and  \n    replace defective \nshoring / scaffolding \ncomponent \n3.1 Defective components are reported to appropriate  \n      personnel in line with company safe operating  \n      procedure.  \n3.2 Shoring / scaffolding instability is reported to \nappropriate personnel in line with company safe \noperating procedure. \n3.3 Replacement of defective components are carried \nout. \n3.4 Shoring / scaffolding checklist report is accomplished \nand submitted to appropriate personnel following  \n      work procedures. \n \n4.  Dismantle shoring / \nscaffolding and clean \nup \n4.1 Dismantling area is isolated with safety signs and \nbarricades are put in place. \n4.2 Shorings / scaffolding are dismantled in accordance \nwith safe principles. \n4.3 Work area is cleared and materials disposed of, re- \n      used or recycled in accordance with OSHS  \n      requirements, codes of practice and job \nspecifications. \n4.4 Tools and equipment are cleaned, checked,  \n      maintained and stored in accordance with  \n      manufacturer recommendations and standard work  \n      practices. \n4.5 Work completion procedures are applied and  \n      appropriate personnel notified of work completion. \n4.6 Advanced shoring / scaffolding operations and faults \nare recorded and reported to the appropriate \npersonnel.\n\n--- PDF PAGE 32 ---\nTR System Formworks Installation NC II  \n \n30\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Shoring / Scaffolding  \n \nIncludes: \n \n1.1  Jack base/ base plates \n1.2  U-heads \n1.3  Cross brace \n1.4  Frames (Vertical frames, A-frames, H-frames,  \n       Ladder type, Adjusting frames) \n1.5  G.I. pipes  \n1.6  Handrails \n1.7  Cantilever brackets \n1.8  Fixed/ swivel clamps \n1.9  Arm lock \n1.10 Ties (wall/ column ties) \n1.11 Joint pin \n1.12 Monkey ladder. \n1.13 Catwalk (with and without opening) \n1.14 U-clip \n1.15 Lock pin \n1.16 Sleeve coupler \n1.17 Vertical props \n1.18 Horizontal shores \n1.19 Scaffolds shores \n1.20 Free-standing pre-fabricated scaffolds \n1.21 Cantilevered hoists with loads not exceeding \n        500kgs. \n1.22 Ropes \n \nExcludes: \n Scaffolds more than 3 meters in height \n Crane loading platforms \n Cantilevered scaffolds \n Sloping platforms \n Wire ropes and chains \n2. Authorized personnel \nMay include: \n \n2.1 Leadman / Foreman \n2.2 Supervisor \n2.3 Engineer \n2.4 Safety officer\n\n--- PDF PAGE 33 ---\nTR System Formworks Installation NC II  \n \n31\n \nVARIABLE \nRANGE \n3. Associated activities \nMay include: \n \n3.1  Work platform \n3.2  Edge protection \n3.3  Access ways  \n         3.3.1 Falsework \n         3.3.2 Stages \n         3.3.3 Covered walkways      \n3.4  Debris net  \n3.5  Debris guard \n4. Equipment \nMay include: \n \n4.1 Frame type \n4.2 Tubular type \n4.3 Tubes/ Pipes and fittings \n5. Footings \nMay include: \n \n5.1 Sole boards \n5.2 Base plate \n5.3 Adjustable base jack \n6. Erection \nMay include: \n \n6.1 Placement \n6.2 Sequencing \n6.3 Squaring \n6.4 Leveling \n6.5 Anchoring to structure \n7. Fall protection devices \nMay include: \n \n7.1 Full body harness \n7.2 Working platform edge protection \n8. Tools \nMay include: \n \n8.1 Cantilevered hoist \n8.2 Fiber ropes \n8.3 Static lines \n8.4 Hammer \n8.5 Spirit level\n\n--- PDF PAGE 34 ---\nTR System Formworks Installation NC II  \n \n32\nEVIDENCE GUIDE \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 Demonstrates ability to verify and comply OSHS  \n      requirements to erect and dismantle shoring / \nscaffolding. \n1.2 Demonstrates ability to identify site access.  \n1.3 Demonstrates ability to follow work instruction . \n1.4 Demonstrates ability to assess shoring / scaffold load \ncapacity. \n1.5 Demonstrates ability to erect and dismantle shoring / \nscaffolding following established / recommended \nstandard procedures. \n2. Required  \nKnowledge and \nattitude  \n2.1 OSHS and other relevant regulatory requirements \n(DOLE DO 13)  \n2.2  Quality procedures, e.g., 5S \n2.3 Environmental-conservation procedures,  \ne.g., 3R (reduce, reuse, recycle) \n2.4 Established / recommended standard procedure in the \nerection and dismantling of shoring / scaffolding. \n2.5  Ability to test and determine the required load. \n2.6 Familiarity on the types and uses of shoring / scaffolding.\n3. Required Skills \n3.1  Following OSHS and other relevant regulatory  \n       requirements for erecting and dismantling shoring /  \n       scaffolding. \n3.2  Following established / recommended standard  \n       procedures for erecting and dismantling shoring / \n       scaffolding. \n3.3  Complying ancillary requirements in the erection of  \n       advanced shoring / scaffolding. \n3.4 Identifying and avoiding hazards. \n3.5 Using hand tools. \n4. Resource Implications The following resources MUST be provided: \n \n4.1 Tools and equipment relevant to the activity \n4.2 Specifications or work instruction \n4.3 Workplace or simulated venue \n5.  Methods of \nAssessment \nCompetency may be assessed through: \n \n5.1 Direct observation / Demonstration of practical skills \n5.2 Oral questioning \n6.  Context  for \nAssessment \n6.1 Competency may be assessed in the workplace or in a \nsimulated work environment.\n",
