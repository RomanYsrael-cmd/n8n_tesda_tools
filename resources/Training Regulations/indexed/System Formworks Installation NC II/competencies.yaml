  "source_section_text": "Section 1. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.3 The following are qualified to apply for assessment and certification:\n\n 4.3.1 Graduates of formal, non-formal and informal including enterprise-\nbased training programs\n\n 4.3.2 Experienced workers (wage employed or self employed)\n\n4.4 The guidelines on assessment and certification are discussed in detail in the\n\"Procedures Manual on Assessment and Certification\" and \"Guidelines on the\nImplementation of the Philippine TVET Qualification and Certification System\n(PTQCS)\"\n\n--- PDF PAGE 48 ---\nTR System Formworks Installation NC II\n\n46\n\n--- PDF PAGE 49 ---\nTR System Formworks Installation NC II\n\n47\nDEFINITION OF TERMS\n\n1. Certification\nRefers to the process of verifying and validating competencies of a\nperson through assessment.\n2. Competency\nIs the application of knowledge, skills and attitudes to perform work\nactivities to the standard expected in the workplace.\n3. Element\nRefers to the building blocks of a unit of competency. It describes\nin outcome terms the functions that a person who works in a\nparticular area of work is able to perform\n4. Evidence Guide\nIt is a guide for assessment that provides information on critical\naspects of competency, underpinning knowledge, underpinning\nskills,\nresource\nimplications,\ncontext\nof\nassessment\nand\nassessment method.\n5. Level\nRefers to the category following the level of difficulty and\ncomplexity of skills and knowledge required to do the job.\n6. Philippine TVET\nQualification\nFramework\nRefers to a comprehensive, nationally consistent framework for\nqualifications in the TVET sector. It also provides the parameter for\nthe integration of learning and assessment in the middle skills\ndevelopment.\n7. Qualification\nRefers to the national certificate issued by the TESDA or its\naccredited industry organizations in recognition that a person has\nachieved competencies relevant to a trade or industry\n8. Range of\nVariable\nIt describes the circumstances or context in which the work is to be\nperformed.\n9. Unit of\nCompetency\nRefers to a discrete aspect of work, which would normally be\nperformed by only one person.\n10. Shoring\nRefers to the provision of temporary support with shores to a\nbuilding or an excavation.\n11. Formworks\n\n12. Scaffolds\nRefers to boarding used to contain wet concrete as it sets. The\nformworks is a temporary structure and can be made of wood or\nsteel. Once the concrete has hardened, the formworks boarding is\nremoved.\n\nRefers to the temporary elevated structure that is used as a\nplatform for supporting workers and equipment.\n\n--- PDF PAGE 50 ---\nTR System Formworks Installation NC II\n\n48\n\n13. Braces\n\nRefers to a device that holds or fastens two or more parts together\nor in place.\n14. Form oil\n\n15. Panels\n\n16. Joist\n\n17. Sheathing\n\n18. Studs\n\n19. Formties/\nwalers\n\n20. Squareness\n\nRefers to the oil applied to the interior surface of formworks to\npromote easy release from the concrete when forms are removed.\n\nRefers to a section of form sheathing, constructed from boards,\nplywood, metal sheets, etc., that can be erected and stripped as a\nunit.\n\nRefers to a steel or wood beam providing direct support for a floor.\n\nProtective covering consisting, for example, of a layer of boards\napplied to the studs and joists of a building to strengthen it and\nserve as a foundation for a weatherproof exterior.\n\nA vertical member of appropriate size (2\" x 4\" to 4\" x 10\") (or 50\nmm x 100 mm to 100 mm x 250 mm) and spacing (16\" to 30\") (or\n400 mm to 750 mm) to support sheathing or concrete forms.\n\nA tensile unit adapted to prevent concrete forms from spreading\ndue to the fluid pressure of freshly placed, unhardened concrete.\n\nThe quality or characteristic of being square or rectangular in\nshape; also refers to corners being at exactly or near right angles\n(90˚).\n21. Plumbness\nThe quality of being exactly vertical or perpendicular.\n\n--- PDF PAGE 51 ---\nTR System Formworks Installation NC II\n\n49\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes\nto extend thanks and appreciation to the many representatives of business, industry,\nacademe and government agencies and who contributed their time and expertise to\nthe development and validation of this Training Regulations.\n\n•\nTHE TECHNICAL/INDUSTRY EXPERTS\n\nLITO G. GARCIA\nDirector\nPhilippine Constructors, Association, Inc.\nMARCELO R. ABAD\nDM Consunji Inc., Consultant\n\nDr. PETER M. URETA\nCHED Technical Expert Panel\n\nEngr. GERARDO J. SULIT\nProject Manager\nDATEM Incorporated\n\nEngr. ARNEL J. BOSTON\nConstruction Manpower Development\nFoundation\n\nEngr.JOHN S. JUAN\nConstruction Manpower Development\nFoundation\n\nEngr. IGMIDIO J. AQUINO, JR.\nSenior Trade & Industry Dev’t. Specialist\nConstruction Manpower Development\nFoundation\n\n•\nThe PARTICIPANTS in the Validation of these Training Regulations\n\nENGR. DWIGHT TA-ALA\nManager\nInfra D.M. Consunji Inc. Homes\nENGR. RICHARD LORICA\nDatem, Inc.\n\nENGR. CERELITO ROSARIO\nD.M. Consunji Inc.\nENGR. MAR RESUMADERO\nDatem, Inc.\nENGR. JOHN ANDREW ESPORLAS\nDM Consunji Inc.\nENGR. CRIS PATRICK CALALANG\nDatem, Inc.\nENGR. SALVADOR OLIVAR\nD.M. Consunji Inc.\n\nMembers of the TESDA Board\n\nTESDA EXCOM\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\n•\nQualification and Standards Office (QSO)\n\n•\nThe Management and Staff of the Philippine Constructors Association (PCA)\n\n•\nThese Training Regulations were reviewed by the Occupational Safety\n and Health Center"
