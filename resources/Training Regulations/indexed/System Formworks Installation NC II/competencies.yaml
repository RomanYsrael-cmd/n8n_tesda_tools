        "source_title": "STRIP SYSTEM FORMWORKS",
        "source_text": "--- PDF PAGE 38 ---\nTR System Formworks Installation NC II  \n \n36\n \nUNIT OF COMPETENCY:\nSTRIP SYSTEM FORMWORKS\nUNIT CODE \nCON712323 \nUNIT DESCRIPTOR        : \nThis unit covers the knowledge, skills and attitudes \nin stripping formworks components and \naccessories for concrete work.  It includes \npreparing tools, equipment and staging of \nmaterials and re-shoring operations.\n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. \nPrepare staging area, \ntools and equipment \n1.1 Work instruction is secured from immediate \nsuperior.  \n1.2 Approved type of PPE is selected and used \naccording to job requirements and OSHS \nspecifications.  \n1.3 Staging area is identified and prepared based \non job requirements. \n1.4 Tools are selected and prepared consistent \nwith job requirements. \n1.5 Unexpected situations are responded to in line \nwith company rules and regulations. \n1.6 Housekeeping is performed according to \nsafety regulations. \n1.7 OSH orientation, toolbox meetings and \nspecialized instructions are participated in \naccordance with organization guidelines and \nprocedures\n2. \nStrip formworks of \nstructure components  \n2.1 Stripping permit is secured from immediate \nsupervisor. \n2.2 Formworks components and accessories \nare stripped carefully, safely and sequentially. \n2.3 Formworks components and accessories are \nsorted, arranged and properly staged.  \n2.4 Formworks components and accessories are \ncleaned, refurbished, inventoried and stored.  \n2.5 Formworks components and accessories \nwhich are beyond repair are discarded for \nproper disposal.  \n2.6 Unexpected situations are responded to \nHousekeeping is performed according to safety \nregulations.\n3. \nRe-shore and remove \nprops \n3.1 Appropriate PPE is selected and used \naccording to job requirements and OSHS. \n3.2  Formworks structure components are re-\nshored where applicable. \n3.3 Shores are removed in accordance with \nstandard procedures. \n3.4 Shores, tools and equipment are cleaned, \nmaintained, inventoried and stored properly.  \n3.5 Unexpected situations are responded to. \n3.6  Housekeeping is performed according to \nsafety regulations.\n\n--- PDF PAGE 39 ---\nTR System Formworks Installation NC II  \n \n37\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. \nPersonal protective \nequipment (PPE) \nMay include: \n1.1 Gloves \n1.2 Safety shoes \n1.3 Hard hat / Helmet \n1.4 Safety/ Body harness  \n1.5 Safety goggles \n1.6 Respirator/dust mask  \n1.7 Ear muffs/ear plugs \n1.8 Face mask/shield \n2. \nTools  \nMay include: \n \n2.1 Hammer \n2.2 Open end wrench \n2.3 Steel brush \n3. \nFormworks components \nand accessories \nMay include: \n \n3.1 Form panels \n3.2 Scaffolds \n3.3 Props\n\n--- PDF PAGE 40 ---\nTR System Formworks Installation NC II  \n \n38\nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \nCompetency assessment requires evidence that the candidate:\n \n1.1 Prepared staging area, tools and equipment.  \n1.2 Stripped formworks of structure components. \n1.3 Re-shored and removed props. \n2. Required  \nknowledge and \nattitude   \n2.1 Types and uses of PPE \n2.2 Tools used in stripping \n2.3 Safety rules and regulations  \n2.4 5-S  \n2.5 Environmental-conservation procedures,  \ne.g., 3R (reduce, reuse, recycle) \n2.6 Safe and effective use of tools \n2.7 Formworks components and accessories  \n2.8 Inventory of metal formworks components and accessories \n2.9 Proper storing and maintenance of formworks components \nand accessories \n2.10 Stripping and re-shoring procedures \n2.11 Relevant sections of DOLE DO 13 Guidelines governing \noccupational safety and health in the construction industry.\n3. Required skills \n3.1 Using PPE \n3.2 Following safety rules and regulations  \n3.3 Preparing formworks components  \n3.4 Stripping,  and removal of  shores/ props \n3.5 Practicing 5-S \n3.6 Following safe and effective use of tools \n3.7 Demonstrate proper storing and maintenance of formworks \ncomponents and accessories.  \n4. Resource \nimplications \nThe following resources must be provided: \n4.1 Work place location \n4.2 Access to formworks components \n4.3 Tools for stripping of formworks components \n4.4 Appropriate PPE \n5. Methods of \nassessment \nCompetency must be assessed through: \n5.1 Observation with questioning \n5.2 Demonstration with questioning \n5.3 Portfolio \n6. Context for \nassessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting\n",
