    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: SYSTEM FORMWORKS INSTALLATION\n NC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic)\n\n18 Hours (Common)\n80 Hours (Core)\n40 Hours (OJT)\n156 Hours\n\nCourse Description:\nThis course is designed to develop knowledge, skills and desirable work\nattitude along System Formworks Installation. It covers the basic, common and core\ncompetencies.\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify hazards and risks\n4.2 Evaluate hazard and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 42 ---\nTR System Formworks Installation NC II\n\n40\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment Approach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\nand tools\n1.2 Requisition,\nequipment,\nmaterials and tools\n1.3 Receive and inspect\nmaterials\nAudio Visual\n Simulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect observation\nQues