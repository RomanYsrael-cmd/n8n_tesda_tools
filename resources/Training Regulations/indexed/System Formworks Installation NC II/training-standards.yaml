 by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy\nin which students plan, implement and evaluate projects that have real\nworld applications.\n\n--- PDF PAGE 45 ---\nTR System Formworks Installation NC II\n\n43\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n• Can communicate both orally and written\n• Physically fit and mentally healthy\n• With good moral character\n• Can perform basic mathematical computation and mensuration.\n• Legal age with NSO Birth Certificate\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS FOR\nSYSTEM FORMWORKS INSTALLATION NC II\n\nBased on a class size of 25 students/trainees\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n5 pcs\nClaw hammer\n\n1 unit\nAir/ Water\nPressure washer\n2 sets\nSheathing (metal,\nlaminated\nplastic,plywood)\nassembly\n5 pcs\nSpirit level\n1 unit\nCircular saw\n2 sets\nShoring and\naccessories\n5 pcs\nPull-push rule\n25\nsets\nPersonal protective\nEquipment\n(Gloves, Safety\nshoes,Hard hat/\nHelmet, Safety/\nBody harness,\n Safety goggles,\nRespirator/ dust\nmask, ear muffs/\near plugs, Face\nmask/ shield)\n2 sets\nScaffolds and\naccessories\n5 pcs\nPlumb bob\n2 units\nPower drill\n25 pcs\nPencil\n5 pcs\nSteel square\n1 unit\nPortable grinder\n5 sets\n• Form system\naccessories\n3 pcs.\neach\nAdjustable wrench\n(6”, 10”, 12”)\n1 unit\nLifting equipment\n\n• Release agent\n5 pcs.\nCross cut saw\n\nLEARNING MATERIALS\n5 pcs.\nChisels\n\nReference books,\n25\npcs.\n Steel brush\n\nModules, hands out,\nmultimedia materials.\n5 pcs.\n Crow bar\n\nPlan and working drawings\n5 pcs.\n Level hose (10\nmeters)\n\n Audio- video equipment\n\nNOTE: Considering the possible prohibitive cost of the formworks and related equipment and materials to be\n used during the training, the TVET provider may choose to provide access to such equipment and\n materials through tie-up or on the job training arrangements with construction firms.\n\n--- PDF PAGE 46 ---\nTR System Formworks Installation NC II\n\n44\n3.5\nTRAINING FACILITIES FOR SYSTEM FORMWORKS INSTALLATION\nNC II\n\nBased on a class size of 25 students/trainees\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nTotal Area in\nSq. Meters\nStudent/Trainee Working\nSpace\n3 x 4 per\nstudent/trainee\n12\n300\nContextual Learning\nLaboratory / Lecture Room\n6 x 7\n42\n42\nLearning Resource\nCenter\n4 x 5\n20\n20\nTool Room/Storage\n4 x 8\n32\n32\nWash room\n2.5 x 4\n10\n10\nCirculation area\n10 x 6\n60\n60\nTOTAL AREA\n\n464\n\n3.6 TRAINER’S QUALIFICATION FOR SYSTEM FORMWORKS\nINSTALLATION NC II\n\n•\nMust be a holder of National TVET Trainers Certificate level I\n(NC + TM ) or at least bachelor’s degree or college level with 2 years\nrelevant industry experience.\n•\nMust be physically and mentally fit\n•\nHolder of Basic Occupational Safety and Health (BOSH) Certificate or\nConstruction Occupational Safety and Health\n•\nGood moral character\n•\nMust be computer literate\n•\n1 year teaching experience\n\n*Optional. Only when required by the hiring institution\nReference: TESDA Board Resolution No. 2004-03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued\nfor each unit of competency.\n\n--- PDF PAGE 47 ---\nTR System Formworks Installation NC II\n\n45"
