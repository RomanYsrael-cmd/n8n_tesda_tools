    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for System Formworks Installation NC II.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: SYSTEM FORMWORKS INSTALLATION\n NC Level: NC II\n\nNominal Training Duration:\n18 Hours (Basic)\n\n18 Hours (Common)\n80 Hours (Core)\n40 Hours (OJT)\n156 Hours\n\nCourse Description:\nThis course is designed to develop knowledge, skills and desirable work\nattitude along System Formworks Installation. It covers the basic, common and core\ncompetencies.\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team\nrole and responsibility in a\nteam.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Identify hazards and risks\n4.2 Evaluate hazard and risks\n4.3 Control hazards and risks\n4.4 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 42 ---\nTR System Formworks Installation NC II\n\n40\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment Approach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\nand tools\n1.2 Requisition,\nequipment,\nmaterials and tools\n1.3 Receive and inspect\nmaterials\nAudio Visual\n Simulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect observation\nQuestions or interview\nPortfolio (credentials)\nWritten / Oral Test\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals\nof\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\n2.2 Interpret manuals\n2.3 Apply information\nin manual\n2.4 Store manuals\n\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation\nOral questioning\nWritten test or examination\nThird party report\nDemonstration (able to\nimpart knowledge and\nskills)\n3. Perform\nmensurations\nand\ncalculations\n3.1 Select measuring\ninstruments\n3.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation\nOral questioning\nWritten test or examination\nThird party report\nDemonstration (able to\nimpart knowledge and\nskills)\n4. Maintain tools\nand\nequipment\n4.1 Check condition of\ntools and\nequipment\n4.2 Perform basic\npreventive\nmaintenance\n4.3 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation of\napplication of tasks.\nOral questioning\nWritten test or examination\nThird party report\nDemonstration\n5. Interpret\n technical\n drawings and\n plans\n\n5.1 Analyze signs,\n symbols and data\n5.2 Interpret technical\n drawings and plans\n5.3 Apply freehand\n sketching\nLecture\nDemonstration\nPractical\nexercises\nDemonstration and oral\nquestioning\nWritten test\n\n--- PDF PAGE 43 ---\nTR System Formworks Installation NC II\n\n41\nCORE COMPETENCIES\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Assemble and\ndismantle\nscaffolds/ shoring\nand braces\n\n1.1 Plan and prepare for\noperation\n1.2 Erect shoring/\nscaffolding\n1.3 Inspect and replace\ndefective shoring/\nscaffolding component\n1.4 Dismantle shoring/\nscaffolding and clean up\nLecture/\ndiscussion\nDemonstration\n\nObservation\nQuestioning\nWritten Test\nDemonstration\n2 Install System\nFormworks\n2.1 Prepare materials, tools\nand equipment for\ninstalling formworks\n2.2 Perform setting out\n2.3 Set/fix form system of\nstructure components\n2.4 Double check installed\nformworks system\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nObservation\nQuestioning\nWritten Test\nDemonstration\n3 Strip System\nFormworks\n3.1 Prepare staging area,\ntools and equipment\n3.2 Strip formworks of\nstructure components\n3.3 Re-shore and remove\nprops\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nObservation\nQuestioning\nWritten Test\nDemonstration\n\n--- PDF PAGE 44 ---\nTR System Formworks Installation NC II\n\n42\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery\nshould be guided by the 10 basic principles of competency-based TVET:\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and\nthe curriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Training programs are registered with the UTPRAS.\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy\nin which students plan, implement and evaluate projects that have real\nworld applications.\n\n--- PDF PAGE 45 ---\nTR System Formworks Installation NC II\n\n43\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n• Can communicate both orally and written\n• Physically fit and mentally healthy\n• With good moral character\n• Can perform basic mathematical computation and mensuration.\n• Legal age with NSO Birth Certificate\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS FOR\nSYSTEM FORMWORKS INSTALLATION NC II\n\nBased on a class size of 25 students/trainees\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n5 pcs\nClaw hammer\n\n1 unit\nAir/ Water\nPressure washer\n2 sets\nSheathing (metal,\nlaminated\nplastic,plywood)\nassembly\n5 pcs\nSpirit level\n1 unit\nCircular saw\n2 sets\nShoring and\naccessories\n5 pcs\nPull-push rule\n25\nsets\nPersonal protective\nEquipment\n(Gloves, Safety\nshoes,Hard hat/\nHelmet, Safety/\nBody harness,\n Safety goggles,\nRespirator/ dust\nmask, ear muffs/\near plugs, Face\nmask/ shield)\n2 sets\nScaffolds and\naccessories\n5 pcs\nPlumb bob\n2 units\nPower drill\n25 pcs\nPencil\n5 pcs\nSteel square\n1 unit\nPortable grinder\n5 sets\n• Form system\naccessories\n3 pcs.\neach\nAdjustable wrench\n(6”, 10”, 12”)\n1 unit\nLifting equipment\n\n• Release agent\n5 pcs.\nCross cut saw\n\nLEARNING MATERIALS\n5 pcs.\nChisels\n\nReference books,\n25\npcs.\n Steel brush\n\nModules, hands out,\nmultimedia materials.\n5 pcs.\n Crow bar\n\nPlan and working drawings\n5 pcs.\n Level hose (10\nmeters)\n\n Audio- video equipment\n\nNOTE: Considering the possible prohibitive cost of the formworks and related equipment and materials to be\n used during the training, the TVET provider may choose to provide access to such equipment and\n materials through tie-up or on the job training arrangements with construction firms.\n\n--- PDF PAGE 46 ---\nTR System Formworks Installation NC II\n\n44\n3.5\nTRAINING FACILITIES FOR SYSTEM FORMWORKS INSTALLATION\nNC II\n\nBased on a class size of 25 students/trainees\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nTotal Area in\nSq. Meters\nStudent/Trainee Working\nSpace\n3 x 4 per\nstudent/trainee\n12\n300\nContextual Learning\nLaboratory / Lecture Room\n6 x 7\n42\n42\nLearning Resource\nCenter\n4 x 5\n20\n20\nTool Room/Storage\n4 x 8\n32\n32\nWash room\n2.5 x 4\n10\n10\nCirculation area\n10 x 6\n60\n60\nTOTAL AREA\n\n464\n\n3.6 TRAINER’S QUALIFICATION FOR SYSTEM FORMWORKS\nINSTALLATION NC II\n\n•\nMust be a holder of National TVET Trainers Certificate level I\n(NC + TM ) or at least bachelor’s degree or college level with 2 years\nrelevant industry experience.\n•\nMust be physically and mentally fit\n•\nHolder of Basic Occupational Safety and Health (BOSH) Certificate or\nConstruction Occupational Safety and Health\n•\nGood moral character\n•\nMust be computer literate\n•\n1 year teaching experience\n\n*Optional. Only when required by the hiring institution\nReference: TESDA Board Resolution No. 2004-03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued\nfor each unit of competency.\n\n--- PDF PAGE 47 ---\nTR System Formworks Installation NC II\n\n45"
