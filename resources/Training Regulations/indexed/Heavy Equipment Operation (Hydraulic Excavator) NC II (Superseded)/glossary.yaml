      "definition": "Refers to private or government entity employing Hydraulic Excavator operator. 2. Daily Equipment Time Report (DETR) Refers to excavator operating or working Hours. 3. Engine RPM Refers to revolution per minute of crank shaft/flywheel of engine. 4. Excavation Work Refers to scooping of materials during trenching and digging. 5. Hydraulic Excavator Refers to earthmoving equipment used to excavate, load and transfer earth and similar materials 6. Operator-Serviceable (OS) parts Refer to any part of the equipment that can be serviced by the operator, e. g., air cleaner, fuel filter, battery clamp, fan belt, etc. 7. Portfolio A tool containing pieces of evidence demonstrating work outputs that have been collected by the candidate. The items are usually produced over a period of time and come from different sources. 8. Site inspection Refers to a work activity in determining the actual condition of the project site to include location, transport route, site terrain, work area, hazards, type of material, etc. 9. Type (Excavator) Refers to either crawler or wheel. 10. Tipping load Refers to a load producing tipping condition at specified radius. 11. Work equipment Refers to the excavator upper structure such as boom, arm, bucket, or blade."
