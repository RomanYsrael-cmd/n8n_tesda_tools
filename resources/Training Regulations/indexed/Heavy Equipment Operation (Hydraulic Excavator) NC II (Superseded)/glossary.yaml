  "source_text": "Definition of Terms\n\nFor the purpose of this Competency Standard, the words\n\n1. Company\nRefers to private or government entity employing Hydraulic\nExcavator operator.\n2. Daily Equipment Time\nReport (DETR)\nRefers to excavator operating or working\nHours.\n3. Engine RPM\nRefers to revolution per minute of crank shaft/flywheel of\nengine.\n4. Excavation Work\nRefers to scooping of materials during trenching and\ndigging.\n5. Hydraulic Excavator\nRefers to earthmoving equipment used to excavate, load\nand transfer earth and similar materials\n6. Operator-Serviceable\n(OS) parts\nRefer to any part of the equipment that can be\nserviced by the operator, e. g., air cleaner, fuel\nfilter, battery clamp, fan belt, etc.\n7. Portfolio\nA tool containing pieces of evidence demonstrating work\noutputs that have been collected by the candidate. The\nitems are usually produced over a period of time and come\nfrom different sources.\n8. Site inspection\nRefers to a work activity in determining the actual condition\nof the project site to include location, transport route, site\nterrain, work area, hazards, type of material, etc.\n9. Type (Excavator)\nRefers to either crawler or wheel.\n10. Tipping load\nRefers to a load producing tipping condition at specified\nradius.\n11. Work equipment\nRefers to the excavator upper structure such as boom,\narm, bucket, or blade.\n\n--- PDF PAGE 84 ---\nTR HEAVY-EQUIPMENT OPERATION (Hydraulic Excavator) NC II\nPromulgated July 2007\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA)\nwishes to extend thanks and appreciation to the many representatives of\nbusiness, industry, academe and government agencies who contributed their\ntime and expertise to the development and validation of these Training\nRegulations.\n\n•\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nFlorello P. Quianzon\nConsultant, Equipment Concrete Product Division\n(Equipment Management)\nMakati Development Corporation\nAyala-