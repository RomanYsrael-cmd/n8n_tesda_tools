        "evidence_guide": {
          "source_text": "1. Critical aspects\nof evidence to\nbe considered\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to observe safety precautions\n1.2 Demonstrates ability to identify minor defects using checklist\nand in accordance with company rules and regulations.\n1.3 Demonstrates ability to identify major defects using check\nlist and report them to appropriate personnel\n1.4 Demonstrates ability to identify OS parts/standards from\nmanufacturer’s reference books/manuals\n1.5 Demonstrates knowledge of recommended fluids and\n lubricants\n1.6 Demonstrates ability to use appropriate basic hand tools\n and equipment\n1.7 Demonstrates ability to accomplish and submit daily\nchecklist forms and reports in accordance with company\nprocedures\n2. Underpinning\n(related)\nknowledge\n\n2.1 Company rules and regulations\n2.2 Basic unit specifications (BUS)\n2.3 Safety (PPE, machine and environmental) prevention\n2.4 Controls and gauges\n2.6 Components, systems and functions\n2.7 Comprehension of operation and maintenance manual\n3. Underpinning\nskills\n\n3.1 Using personal protective equipment (PPE)\n3.2 Accomplishing daily checklist forms\n3.3 Performing basic preventive maintenance\n3.4 Using basic hand tools and equipment\n3.5 Reporting minor and major defects\n4. Resource\nimplications\n\nThings necessary for the conduct of assessment\n4.1 Access to earth-moving equipment specifications and\nmanuals as required\n4.2 Appropriate earth-moving equipment\n4.3 Basic hand tools and equipment\n4.4 Fluids and lubricants\n4.5 PPE\n4.6 Safety signages/barricades\n5. Method of\nassessment\n\nCompetency in this unit must be assessed through\n5.1 Written and/or oral questioning\n5.2 Direct observation/Practical demonstration\n5.3 Work record and documents\n\n--- PDF PAGE 58 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\n6. Context for\nassessment\n\n6.1 Competency shall be assessed in a normal or simulated\nworkplace environment and in accordance with safe work\n procedures\n6.2 Competency shall be assessed while work is being\nundertaken independently\n\n--- PDF PAGE 59 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nUNIT OF COMPETENCY:\nPERFORM PRODUCTIVE OPERATION FOR\nHYDRAULIC EXCAVATOR\nUNIT CODE:"
        },
        "source_text": "CON833302\nUNIT DESCRIPTOR:\nThis unit describes the outcomes required in the\nroutine preventive maintenance of earth-moving\nequipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Perform adjustments/\nreplacements\n\n1.1 Minor defects are identified and remedied in\naccordance with company/manufacturer’s\nprocedures.\n1.2 Correct/proper tools are selected based on job\nrequirements.\n1.3 Major defects are identified with checklist and\n referred to appropriate personnel.\n2. Perform basic preventive\nmaintenance servicing\n(PMS)\n\n2.1 OS parts/standards are identified and\nserviced according to manufacturer’s\nrecommendations.\n2.2 Fluids and lubricants are used based on\nmanufacturer’s manual.\n2.3 Appropriate basic hand tools and equipment\nare identified and used in accordance with site\nrequirements.\n2.4 Basic preventive maintenance servicing\n(PMS) is carried out in accordance with\nmanufacturer’s and/or site\nconditions/requirements.\n3. Prepare equipment reports\n\n3.1 Daily checklist form is properly accomplished in\naccordance with manufacturer’s/company\nrequirements.\n3.2 Minor/major equipment defects are reported to\nconcerned personnel.\n\n--- PDF PAGE 51 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Minor defects\n\nMay include but not limited to:\n1.1 Weak battery\n1.2 Improper belt tension\n1.3 Clogged air filter/cleaner\n1.4 Loose clamps\n\nHydraulic Excavator, Wheel Loader and Motor Grader, Road\nRoller and Backhoe Loader\n1.5 Incorrect tire inflation\n\nHydraulic Excavator and Bulldozer\n1.6 Incorrect/insufficient track tension\n\nBackhoe Loader\n1.7 Busted bulbs\n\n--- PDF PAGE 52 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\n2. Major defects\n\nMay include but not limited to:\n2.1 Busted hydraulic hose\n2.2 Defective electrical system/electro-mechanical system\n 2.2.1 Lighting\n 2.2.2 Starting\n 2.2.3 Monitoring gauge\n\n Hydraulic Excavator, Wheel Loader and Motor Grader,\nRoad Roller and Backhoe Loader\n 2.2.4 Charging\n\n2.3 Abnormal tire condition\n\n Hydraulic Excavator, Wheel Loader, and Motor Grade,\nRoad Roller and Backhoe Loader\n 2.3.1 Worn-out tires\n\n Wheel Loader, road Roller and Motor Grader\n 2.3.2 Flat tires\n\nHydraulic Excavator, Wheel Loader and Motor Grader, Road\nRoller and Backhoe Loader\n2.4 Excessive engine oil consumption\n2.5 Leakage in\n\n Hydraulic Excavator, Wheel Loader, Road Roller and\nMotor Grader and Backhoe Loader\n 2.5.1 Air\n 2.5.2 Fuel\n 2.5.3 Cooling\n 2.5.4 Hydraulic system\n\n Wheel Loader, road Roller and Motor Grader\n 2.5.5 Lube\n\nHydraulic Excavator and Backhoe Loader\n2.6 Hard starting engine\n2.7 Faulty gauges\n\nBulldozer\n2.8 Worn-out undercarriage parts\n 2.8.1 Rollers\n 2.8.2 Track link\n 2.8.3 Bushing\n 2.8.4 Pins\n 2.8.5 Pads\n\n--- PDF PAGE 53 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nVARIABLE\nRANGE\nContinuation\n2.9 Worn-out ground engaging tool\n 2.9.1 Cutting edge\n 2.9.2 End bit\n 2.9.3 Shank tooth\n2.10 Frayed wire rope\n\nBackhoe Loader\n2.11 Worn-out ground engaging\n\nBackhoe Loader and Road Roller\n2.12 Abnormal sounds\n\nRoad Roller\n2.13 Worn-out drums (padded and smooth)\n2.14 Excessive vibrations of drums\n2.15 Worn-out rubber absorber\n3. Appropriate\npersonnel\n\nMay include but not limited to:\n3.1 Chief Mechanic\n3.2 Equipment Maintenance Supervisor\n3.3 Maintenance Personnel\n4. Operator-\nServiceable\n(OS) parts\n\n4.1 Air cleaner\n4.2 Battery terminals/connections/clamps\n4.3 Belt\n4.4 All grease/lube points\n4.5 All fluid caps\n4.5 Filters\n 4.6.1 Air cleaner\n\n Hydraulic Excavator\n 4.6.2 Water separator\n\nWheel Loader, Road Roller and Motor Grader\n4.6 Tire inflation\n\nHydraulic Excavator\n4.7 Wire rope grease\n\nBackhoe Loader\n4.8 Bulbs\n\n--- PDF PAGE 54 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 