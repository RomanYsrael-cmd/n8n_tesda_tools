        "evidence_guide": {
          "source_text": "1. Critical aspects\nof evidence to\nbe considered\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to select earthmoving equipment\nbased on the job requirements\n1.2 Demonstrates ability to check and service operator-\nserviceable (OS) parts\n1.3 Demonstrates ability to perform walk-around and\n“BLOWAF” inspection following equipment checklist and\nwith engine stopped/not running.\n1.4 Demonstrates ability to perform walk-around check while\nengine is running.\n1.5 Demonstrates ability to follow risk-control/safe procedures\n1.6 Demonstrates ability to perform post-operation checking\nprocedures\n1.7 Demonstrates ability to accomplished daily equipment time\nrecord/report (DETR)\n2. Underpinning\n(related)\nknowledge and\nattitude\n\n2.1 Types and uses of personal protective equipment (PPE)\n2.2 Controls, instruments, indicators and their usage\n2.3 Start-up and shutdown procedures\n2.4 Familiarity with manufacturer’s operation manual\n2.5 Familiarity with job site and work conditions\n2.6 Familiarity with pre- and post-operation checklist\n2.7 Positive work values (cost-, time-, and quality-\nconsciousness, etc.)\n3. Underpinning\nskills\n\n3.1 Performing pre- and post-operation procedures of\nequipment using standard or special attachments\n3.2 Using personal protective equipment\n3.3 Maintaining equipment records\n3.4 Communicating with work site personnel and clients\n3.5 Complying with the manufacturer’s operation manual\n3.6 Accomplishing pre- and post-operation checklist\n4. Resource\nimplications\n\nThings necessary for the conduct of assessment include\n4.1 Appropriate work area for earthmoving operation\n4.2 Access to earthmoving equipment and corresponding\nmanuals.\n\n--- PDF PAGE 49 ---\nTR HEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nPromulgated July 2007\n\n5. Method of\nassessment\n\nCompetency in this unit must be assessed through\n5.1 Written/oral questioning\n5.2 Direct observation/practical demonstration\n5.3 Work record and documents\n6. Context for\nassessment\n\n6.1 Competency shall be assessed in a normal or a simulated\nwork place environment and in accordance with safe work\nprocedures.\n6.2 Competency shall be assessed while work is being\nundertaken independently.\n\n--- PDF PAGE 50 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nUNIT OF COMPETENCY:\nPERFORM BASIC PREVENTIVE-MAINTENANCE\nSERVICING FOR EARTH-MOVING EQUIPMENT\nUNIT CODE:"
        },
        "source_text": "CON833301\nUNIT DESCRIPTOR:\nThis unit describes the outcomes required in\nperforming procedures before and after productive\noperation of earth-moving equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Perform visual check of\nequipment\n\n1.1 Earth-moving equipment is selected based\non job requirements.\n1.2 Operator serviceable (OS) parts are\nchecked in accordance with equipment\nchecklist and manufacturer’s procedures.\n1.3 Walk-around check is performed with\nequipment checklist and with engine\nstopped/not running.\n2. Perform “B L O W A F”\ncheck\n\n2.1 “BLOWAF” check is performed with\nchecklist form and with engine stopped/not\nrunning.\n2.2 Deficiencies in fluid levels are identified and\nif below normal level are refilled/topped up in\naccordance with equipment maintenance\nmanual.\n2.3 Abnormal conditions are noted in checklist\nand reported to authorized person.\n\n--- PDF PAGE 40 ---\nTR HEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nPromulgated July 2007\n\nELEMENT\nPERFORMANCE CRITERIA\n3. Perform operation check\n\n3.1 Starting/running check is performed with\nchecklist and in accordance with\nmanufacturer’s recommendations.\n3.2 Brake, steering and controls are checked for\nnormal functioning\n3.3 Walk-around check is performed with\nequipment checklist and with engine running.\n3.4 Safety devices and accessories are\nchecked for proper functions in accordance\nwith safe operating procedures.\n4. Perform post-operation\nprocedures\n4.1 Earth moving equipment is parked and turned\noff after productive operation in accordance\nwith company rules and regulations.\n4.2 Equipment controls are set into neutral\nposition and parking brakes are engaged\naccording to manufacturer’s operations\nmanual.\n4.3 Safety locks and brakes are all set/engaged\nin accordance with operator’s manual.\n4.4 Walk-around inspection check is re-\nconducted while doing engine cool down\n4.5 Daily equipment time record/report (DETR) is\naccomplished/submitted according to\ncompany rules and regulations\n\n--- PDF PAGE 41 ---\nTR HEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nPromulgated July 2007\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Earth-moving\nequipment\n\n1.1 Hydraulic Excavator\n 1.1.1 Crawler type\n 1.1.2 Wheel type\n1.2 Wheel Loader\n1.3 Bulldozer\n1.4 Motor Grader\n1.5 Backhoe Loader\n1.6 Road Roller\n1.6.1 Static roller\n 1.6.1.1 Pneumatic roller\n 1.6.1.2 Drum roller\n 1.6.1.2.1 Single drum\n 1.6.1.2.2 Double drum\n1.6.2 Vibratory roller\n 1.6.2.1 Single drum\n 1.6.2.2 Double drum\n2. Operator-\nserviceable\n(OS) parts\n\n2.1 Air cleaner\n2.2 Battery terminals/Connection\n2.3 Belt\n2.4 Tire inflation\n2.5 Grease/lube points\n\nHydraulic Excavator and Backhoe Loader\n2.6 Fuel water separator\n\nBulldozer\n2.7 Track tension\n\n--- PDF PAGE 42 ---\nTR HEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nPromulgated July 2007\n\nVARIABLE\nRANGE\n3. Walk-around\ncheck\n\n3.1 Engine off\n\nHydraulic Excavator, Wheel Loader, and Bulldozer\nBackhoe Loader and Road Roller\n 3.1.1 Leaks\n 3.1.2 Worn out/damaged parts\n 3.1.3 Fluid levels\n 3.1.4 Loose parts/connections\n 3.1.5 Missing parts\n\n Hydraulic Excavator\n 3.1.6 Hook block\n 3.1.7 Wire rope cable\n 3.1.8 Pulleys\n\n Backhoe Loader\n 3.1.9 Tire condition\n\n3.2 Engine on\n\n Hydraulic Excavator and Backhoe Loader\n 3.2.1 Gauges and controls\n 3.2.2 Oil and air leaks\n 3.2.3 Safety devices\n 3.2.4 Working equipment function e.g. outriggers,\n boom, hoist\n\n Motor Grader and Road Roller\n 3.2.5 Unusual sounds\n\nRoad Roller\n3.2.6 Unusual emission of smoke (blue, black and\nwhite)\n4. B L O W A F\ncheck\n\n4.1 Battery (starting and charging system)\n4.2 Light (lighting system)\n4.3 Oil (lubricating system)\n4.4 Water (cooling system)\n4.5 Air (intake and exhaust system)\n4.6 Fuel (fuel system)\n\n--- PDF PAGE 43 ---\nTR HEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nPromulgated July 2007\n\nVARIABLE\nRANGE\n5. Fluid levels\n\n5.1 Battery electrolyte (maintenance type)\n5.2 Engine oil\n5.3 Hydraulic oil\n5.4 Radiator coolant\n\nHydraulic Excavator, Wheel Loader, Motor Grader, Bulldozer,\nBackhoe Loader\n5.5 Transmission\n\nBulldozer, and Motor Grader\n5.6 Fuel\n\nHydraulic Excavator\n5.7 Gear Oil\n6. Authorized\nperson\n6.1 Equipment supervisor\n6.2 Equipment dispatcher/Foreman\n6.3 Maintenance personnel\n\n--- PDF PAGE 44 ---\nTR HEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nPromulgated July 2007\n\nVARIABLE\nRANGE\n7. Starting/\n Running check\n\nMay include but not limited to:\n7.1 Controls\n 7.1.1 Travel\n\n Wheel Loader, Bulldozer, and Motor Grader Backhoe\nLoader and Road Roller\n 7.1.2 Steering/articulation\n\n Hydraulic Excavator, and Wheel Loader and Backhoe\nLoader\n 7.1.3 Boom\n\n Bulldozer, Motor Grader and Road Roller\n 7.1.4 Blade\n\nBulldozer and Motor Grader\n 7.1.5 Ripper\n 7.1.6 Attachment\n\n Bulldozer\n 7.1.6.1 Drawbar\n 7.1.6.2 Disc plow\n 7.1.6.3 Bedder\n\n Motor Grader\n 7.1.6.4 Ripper\n 7.1.6.5 Scarifier\n\n Bulldozer\n 7.1.7 Winch\n 7.1.8 Tilt/Lift\n\n Motor Grader\n 7.1.9 Lean\n\n Wheel Loader and Backhoe Loader\n 7.1.10 Bucket\n\n Hydraulic Excavator and Backhoe Loader\n 7.1.11 Out rigger\n 7.1.12 Arm\n 7.1.13 Swing\n\n--- PDF PAGE 45 ---\nTR HEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nPromulgated July 2007\n\nVARIABLE\nRANGE\ncontinuation\nHydraulic Excavator\n 7.1.14 Arm\n\n Road Roller\n 7.1.15 Drum\n 7.1.16 Vibratory\n\n7.2 Gauges\n 7.2.1 Battery charging\n 7.2.2 Pressure\n 7.2.3 Temperature\n\n Motor Grader and Road Roller\n 7.2.4 Hour meter\n 7.2.5 RPM\n 7.3.6 Speedometer\n\n7.3 Leaks in\n 7.3.1 Lubricating oil\n 7.3.2 Cooling\n 7.3.3 Air\n 7.3.4 Fuel\n\nHydraulic Excavator, Wheel Loader, and Bulldozer and\nBackhoe Loader\n 7.35 Hydraulic systems\n\n7.4 Electrical switches/devices\n 7.4.1 Lights\n 7.4.2 Horn/alarm\n\n Hydraulic Excavator, Wheel Loader, and Bulldozer and\nBackhoe Loader\n 7.4.3 Safety devices\n Motor Grader\n 7.4.4 Wiper blade\n\n7.5 Steering and brake\nBackhoe Loader\n7.6 Tire condition\n\nRoad Roller\n7.7 Wiper\n\n--- PDF PAGE 46 ---\nTR HEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nPromulgated July 2007\n\nVARIABLE\nRANGE\n8. Safety devices\nand accessories\n8.1 Back up alarm\n8.2 Roll Over Protective Structures\n8.3 Blinkers\n8.4 Safety belt\n8.5 Windshield guard\n\nBackhoe Loader\n8.6 Back-up alarm\n\nRoad Roller\n8.7 Safety pin and locks\n8.8 Parking brake\n8.9 Side mirrors\n8.10 Fire extinguisher\n8.11 Battery disconnect switch\n8.12 Steering\n\n--- PDF PAGE 47 ---\nTR HEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nPromulgated July 2007\n\nVARIABLE\nRANGE\n9. Safety locks\n9.1 Control lever lock\n9.2 Door lock\n\nWheel Loader and Motor Grader\n9.3 Neutralizer lock switch\n\nWheel Loader, Bulldozer and Road Roller\n9.4 Steering lock\n\nMotor Grader and Road Roller\n9.5 Implement lock switch\n9.6 Engine gull wing\n\nHydraulic Excavator and Backhoe Loader\n9.7 Swing lock\n\nHydraulic Excavator\n9.8 House lock\n\nBackhoe Loader\n9.9 Outrigger lock\n9.10 Bucket lever lock\n\n--- PDF PAGE 48 ---\nTR HEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nPromulgated July 2007\n\nEVIDENCE GUIDE\n1. Critical aspects\nof evidence to\nbe considered\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to select earthmoving equipment\nbased on the job requirements\n1.2 Demonstrates ability to check and service operator-\nserviceable (OS) parts\n1.3 Demonstrates ability to perform walk-around and\n“BLOWAF” inspection following equipment checklist and\nwith engine stopped/not running.\n1.4 Demonstrates ability to perform walk-around check while\nengine is running.\n1.5 Demonstrates ability to follow risk-control/safe procedures\n1.6 Demonstrates ability to perform post-operation checking\nprocedures\n1.7 Demonstrates ability to accomplished daily equipment time\nrecord/report (DETR)\n2. Underpinning\n(related)\nknowledge and\nattitude\n\n2.1 Types and uses of personal protective equipment (PPE)\n2.2 Controls, instruments, indicators and their usage\n2.3 Start-up and shutdown procedures\n2.4 Familiarity with manufacturer’s operation manual\n2.5 Familiarity with job site and work conditions\n2.6 Familiarity with pre- and post-operation checklist\n2.7 Positive work values (cost-, time-, and quality-\nconsciousness, etc.)\n3. Underpinning\nskills\n\n3.1 Performing pre- and post-operation procedures of\nequipment using standard or special attachments\n3.2 Using personal protective equipment\n3.3 Maintaining equipment records\n3.4 Communicating with work site personnel and clients\n3.5 Complying with the manufacturer’s operation manual\n3.6 Accomplishing pre- and post-operation checklist\n4. Resource\nimplications\n\nThings necessary for the conduct of assessment include\n4.1 Appropriate work area for earthmoving operation\n4.2 Access to earthmoving equipment and corresponding\nmanuals.\n\n--- PDF PAGE 49 ---\nTR HEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nPromulgated July 2007\n\n5. Method of\nassessment\n\nCompetency in this unit must be assessed through\n5.1 Written/oral questioning\n5.2 Direct observation/practical demonstration\n5.3 Work record and documents\n6. Context for\nassessment\n\n6.1 Competency shall be assessed in a normal or a simulated\nwork place environment and in accordance with safe work\nprocedures.\n6.2 Competency shall be assessed while work is being\nundertaken independently.\n\n--- PDF PAGE 50 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nUNIT OF COMPETENCY:\nPERFORM BASIC PREVENTIVE-MAINTENANCE\nSERVICING FOR EARTH-MOVING EQUIPMENT\nUNIT CODE:"
