              {
                "number": "2.2",
                "text": "Effects of the hazards are determined"
              },
              {
                "number": "2.3",
                "text": "OHS issues and/or concerns and identified safety hazards are reported to designated personnel in accordance with workplace requirements and relevant workplace OHS legislation"
