        "source_text": "500311105\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Obtain and convey\nworkplace\ninformation\n1.1 Specific and relevant information is accessed from\nappropriate sources\n1.2 Effective questioning , active listening and speaking skills are\nused to gather and convey information\n1.3 Appropriate medium is used to transfer information and ideas\n1.4 Appropriate non- verbal communication is used\n1.5 Appropriate lines of communication with supervisors and\ncolleagues are identified and followed\n1.6 Defined workplace procedures for the location and storage of\ninformation are used\n1.7 Personal interaction is carried out clearly and concisely\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings are attended on time\n2.2 Own opinions are clearly expressed and those of others are\nlistened to without interruption\n2.3 Meeting inputs are consistent with the meeting purpose and\nestablished protocols\n2.4 Workplace interactions are conducted in a courteous\nmanner\n2.5 Questions about simple routine workplace procedures and\nmaters concerning working conditions of employment are\nasked and responded to\n2.6 Meetings outcomes are interpreted and implemented\n\n--- PDF PAGE 6 ---\nTR HEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nPromulgated July 2007\n\n3. Complete relevant\nwork related\ndocuments\n3.1 Range of forms relating to conditions of employment are\ncompleted accurately and legibly\n3.2 Workplace data is recorded on standard workplace forms and\ndocuments\n3.3 Basic mathematical processes are used for routine\ncalculations\n3.4 Errors in recording information on forms/ documents are\nidentified and properly acted upon\n3.5 Reporting requirements to supervisor are completed\naccording to organizational guidelines\n\n--- PDF PAGE 7 ---\nTR HEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nPromulgated July 2007\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1. Team members\n1.2. Suppliers\n1.3. Trade personnel\n1.4. Local government\n1.5. Industry bodies\n2. Medium\n2.1. Memorandum\n2.2. Circular\n2.3. Notice\n2.4. Information discussion\n2.5. Follow-up or verbal instructions\n2.6. Face to face communication\n3. Storage\n3.1. Manual filing system\n3.2. Computer-based filing system\n4. Forms\n4.1. Personnel forms, telephone message forms, safety\nreports\n5. Workplace interactions\n5.1. Face to face\n5.2. Telephone\n5.3. Electronic and two way radio\n5.4. Written including electronic, memos, instruction and\nforms, non-verbal including gestures, signals, signs\nand diagrams\n6. Protocols\n6.1. Observing meeting\n6.2. Compliance with meeting decisions\n6.3. Obeying meeting instructions\n\n--- PDF PAGE 8 ---\nTR HEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nPromulgated July 2007\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared written communication following standard\nformat of the organization\n1.2. Accessed information using communication equipment\n1.3. Made use of relevant terms as an aid to transfer\ninformation effectively\n1.4. Conveyed information effectively adopting the formal\nor informal communication\n2. Underpinning\nKnowledge and Attitudes\n\n2.1. Effective communication\n2.2. Different modes of communication\n2.3. Written communication\n2.4. Organizational policies\n2.5. Communication procedures and systems\n2.6. Technology relevant to the enterprise and the\nindividual’s work responsibilities\n3. Underpinning Skills\n3.1. Follow simple spoken language\n3.2. Perform routine workplace duties following simple\nwritten notices\n3.3. Participate in workplace meetings and discussions\n3.4. Complete work related documents\n3.5. Estimate, calculate and record routine workplace\nmeasures\n3.6. Basic mathematical processes of addition, subtraction,\ndivision and multiplication\n3.7. Ability to relate to people of social range in the\nworkplace\n3.8. Gather and provide information in response to\nworkplace Requirements\n4. Resource Implications\n4.1. Fax machine\n4.2. Telephone\n4.3. Writing materials\n4.4. Internet\n5. Methods of Assessment\n5.1. Direct Observation\n5.2. Oral interview and written test\n6. Context of Assessment\n6.1. Competency may be assessed individually in the\nactual workplace or through accredited institution\n\n--- PDF PAGE 9 ---\nTR HEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nPromulgated July 2007\n\nUNIT TITLE\nWORK IN A TEAM ENVIRONMENT\nUNIT"
