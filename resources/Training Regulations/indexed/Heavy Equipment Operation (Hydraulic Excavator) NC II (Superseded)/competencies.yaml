r earthmoving operation\n4.2 Access to earthmoving equipment and corresponding\nmanuals.\n\n--- PDF PAGE 49 ---\nTR HEAVY-EQUIPMENT OPERATION (FORKLIFT) NC II\n\nPromulgated July 2007\n\n5. Method of\nassessment\n\nCompetency in this unit must be assessed through\n5.1 Written/oral questioning\n5.2 Direct observation/practical demonstration\n5.3 Work record and documents\n6. Context for\nassessment\n\n6.1 Competency shall be assessed in a normal or a simulated\nwork place environment and in accordance with safe work\nprocedures.\n6.2 Competency shall be assessed while work is being\nundertaken independently.\n\n--- PDF PAGE 50 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nUNIT OF COMPETENCY:\nPERFORM BASIC PREVENTIVE-MAINTENANCE\nSERVICING FOR EARTH-MOVING EQUIPMENT\nUNIT CODE:\nCON833302\nUNIT DESCRIPTOR:\nThis unit describes the outcomes required in the\nroutine preventive maintenance of earth-moving\nequipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold and Italicized terms are elaborated in the\nRange of Variables\n1. Perform adjustments/\nreplacements\n\n1.1 Minor defects are identified and remedied in\naccordance with company/manufacturer’s\nprocedures.\n1.2 Correct/proper tools are selected based on job\nrequirements.\n1.3 Major defects are identified with checklist and\n referred to appropriate personnel.\n2. Perform basic preventive\nmaintenance servicing\n(PMS)\n\n2.1 OS parts/standards are identified and\nserviced according to manufacturer’s\nrecommendations.\n2.2 Fluids and lubricants are used based on\nmanufacturer’s manual.\n2.3 Appropriate basic hand tools and equipment\nare identified and used in accordance with site\nrequirements.\n2.4 Basic preventive maintenance servicing\n(PMS) is carried out in accordance with\nmanufacturer’s and/or site\nconditions/requirements.\n3. Prepare equipment reports\n\n3.1 Daily checklist form is properly accomplished in\naccordance with manufacturer’s/company\nrequirements.\n3.2 Minor/major equipment defects are reported to\nconcerned personnel.\n\n--- PDF PAGE 51 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Minor defects\n\nMay include but not limited to:\n1.1 Weak battery\n1.2 Improper belt tension\n1.3 Clogged air filter/cleaner\n1.4 Loose clamps\n\nHydraulic Excavator, Wheel Loader and Motor Grader, Road\nRoller and Backhoe Loader\n1.5 Incorrect tire inflation\n\nHydraulic Excavator and Bulldozer\n1.6 Incorrect/insufficient track tension\n\nBackhoe Loader\n1.7 Busted bulbs\n\n--- PDF PAGE 52 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\n2. Major defects\n\nMay include but not limited to:\n2.1 Busted hydraulic hose\n2.2 Defective electrical system/electro-mechanical system\n 2.2.1 Lighting\n 2.2.2 Starting\n 2.2.3 Monitoring gauge\n\n Hydraulic Excavator, Wheel Loader and Motor Grader,\nRoad Roller and Backhoe Loader\n 2.2.4 Charging\n\n2.3 Abnormal tire condition\n\n Hydraulic Excavator, Wheel Loader, and Motor Grade,\nRoad Roller and Backhoe Loader\n 2.3.1 Worn-out tires\n\n Wheel Loader, road Roller and Motor Grader\n 2.3.2 Flat tires\n\nHydraulic Excavator, Wheel Loader and Motor Grader, Road\nRoller and Backhoe Loader\n2.4 Excessive engine oil consumption\n2.5 Leakage in\n\n Hydraulic Excavator, Wheel Loader, Road Roller and\nMotor Grader and Backhoe Loader\n 2.5.1 Air\n 2.5.2 Fuel\n 2.5.3 Cooling\n 2.5.4 Hydraulic system\n\n Wheel Loader, road Roller and Motor Grader\n 2.5.5 Lube\n\nHydraulic Excavator and Backhoe Loader\n2.6 Hard starting engine\n2.7 Faulty gauges\n\nBulldozer\n2.8 Worn-out undercarriage parts\n 2.8.1 Rollers\n 2.8.2 Track link\n 2.8.3 Bushing\n 2.8.4 Pins\n 2.8.5 Pads\n\n--- PDF PAGE 53 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nVARIABLE\nRANGE\nContinuation\n2.9 Worn-out ground engaging tool\n 2.9.1 Cutting edge\n 2.9.2 End bit\n 2.9.3 Shank tooth\n2.10 Frayed wire rope\n\nBackhoe Loader\n2.11 Worn-out gro