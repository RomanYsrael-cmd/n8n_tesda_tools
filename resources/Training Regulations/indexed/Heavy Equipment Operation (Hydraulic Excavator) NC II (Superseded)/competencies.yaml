avator, Wheel Loader, Motor Grader,\nBulldozer and Backhoe Loader\n 7.1.4 Hammer\n 7.1.5 Vice grip\n\n Bulldozer and Backhoe Loader\n 7.1.6 Grease gun\n\nHydraulic Excavator, Wheel Loader and Motor Grader,\nRoad Roller and Backhoe Loader\n 7.1.7 Tire gauge (instrument)\n\n Hydraulic Excavator and Backhoe Loader\n 7.1.8 Paint brush\n 7.1.9 Steel brush\n\n Hydraulic Excavator\n 7.1.9 Measuring tape\n\n Bulldozer\n 7.1.11 Mud remover\n\n7.2 Equipment\n 7.2.1 High pressure washer\n 7.2.2 Air compressor\n\n--- PDF PAGE 56 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nVARIABLE\nRANGE\n8. Basic preventive\nmaintenance\nservicing (PMS)\nMay include but not limited to:\n8.1 Check battery clamps\n8.2 Check fan belt conditions (cracked or worn-out)\n8.3 Adjust track/belt tensions (if necessary)\n8.4 Clean/Replace filters\n 8.4.1 Air cleaner\n 8.4.2 Water separator\n8.5 Replace defective fluid caps\n8.6 Grease all fittings on lube points\n\nHydraulic Excavator\n8.7 Grease wire ropes\n9. Site conditions/\n requirements\n9.1 Instructions\n9.2 Signages\n9.3 Work schedules\n9.4 Work bulletin boards\n9.5 Map (vicinity)\n9.6 Dusty\n9.7 Windy\n9.8 Terrain\n 9.8.1 Muddy\n 9.8.2 Slippery\n\nWheel Loader, Hydraulic Excavator and Motor Grader and\nBackhoe Loader\n9.5 Charts\n9.6 Memos\n\n--- PDF PAGE 57 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nEVIDENCE GUIDE\n1. Critical aspects\nof evidence to\nbe considered\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrates ability to observe safety precautions\n1.2 Demonstrates ability to identify minor defects using checklist\nand in accordance with company rules and regulations.\n1.3 Demonstrates ability to identify major defects using check\nlist and report them to appropriate personnel\n1.4 Demonstrates ability to identify OS parts/standards from\nmanufacturer’s reference books/manuals\n1.5 Demonstrates knowledge of recommended fluids and\n lubricants\n1.6 Demonstrates ability to use appropriate basic hand tools\n and equipment\n1.7 Demonstrates ability to accomplish and submit daily\nchecklist forms and reports in accordance with company\nprocedures\n2. Underpinning\n(related)\nknowledge\n\n2.1 Company rules and regulations\n2.2 Basic unit specifications (BUS)\n2.3 Safety (PPE, machine and environmental) prevention\n2.4 Controls and gauges\n2.6 Components, systems and functions\n2.7 Comprehension of operation and maintenance manual\n3. Underpinning\nskills\n\n3.1 Using personal protective equipment (PPE)\n3.2 Accomplishing daily checklist forms\n3.3 Performing basic preventive maintenance\n3.4 Using basic hand tools and equipment\n3.5 Reporting minor and major defects\n4. Resource\nimplications\n\nThings necessary for the conduct of assessment\n4.1 Access to earth-moving equipment specifications and\nmanuals as required\n4.2 Appropriate earth-moving equipment\n4.3 Basic hand tools and equipment\n4.4 Fluids and lubricants\n4.5 PPE\n4.6 Safety signages/barricades\n5. Method of\nassessment\n\nCompetency in this unit must be assessed through\n5.1 Written and/or oral questioning\n5.2 Direct observation/Practical demonstration\n5.3 Work record and documents\n\n--- PDF PAGE 58 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\n6. Context for\nassessment\n\n6.1 Competency shall be assessed in a normal or simulated\nworkplace environment and in accordance with safe work\n procedures\n6.2 Competency shall be assessed while work is being\nundertaken independently\n\n--- PDF PAGE 59 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nUNIT OF COMPETENCY:\nPERFORM PRODUCTIVE OPERATION FOR\nHYDRAULIC EXCAVATOR\nUNIT CODE:\nCON833303\nUNIT DESCRIPTOR:\nThis unit describes the outcomes required in\nexcavation and earth-moving operations using a\nHydraulic Excavator.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\n1. Load excavator to\nTruck/Trailer (Low)\n1.1 Appropriate and suitable trailer for transporting\nthe Hydraulic Excavator is considered\naccording to requirements.\n1.2 Coordination and communication with\nauthorized signalman maintained during\nloading.\n1.3 Excavator is loaded in correct position using\nadequate ramp based on safe operating\nprocedure.\n1.4 Proper positioning of sprocket/wheels are\nobserved according to safe working procedure\n1.5 Arm is properly positioned while Hydraulic\nExcavator is being loaded on a truck trailer\nbed.\n1.6 All safety locks and controls are properly\nsecured.\n1.7 Bucket is properly rested based on safe work\nprocedure.\n1.8 Tracks (UC) or wheels are secured with\nstopper blocks and binders.\n1.9 Control and brakes are checked in line with\nsafety procedure and prior to starting/moving\nthe machine.\n1.10 Unexpected situations are responded to in\nline with company rules and regulations in a\nmanner that minimizes risk to personnel and\nequipment.\n2. Unload equipment from\nTruck/Trailer (Low)\n\n2.1 Coordination and communication with\nauthorized signalman is maintained during\nunloading.\n2.2 Arm is properly positioned while Hydraulic\nExcavator is being unloaded from truck/trailer\nbed.\n2.3 All safety locks and controls are set at required\nposition.\n2.4 Hydraulic Excavator is unloaded in correct\n\n--- PDF PAGE 60 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nposition using adequate ramp based on safe\noperating procedure.\n2.5 Binders and stopper blocks are removed prior\nto unloading operation.\n2.6 Controls and brakes are checked in line with\nsafety procedure and prior to starting/moving\nthe machine.\n2.7 Unexpected situations are responded to in line\n with company rules and regulations in a\n manner that minimizes risk to personnel and\n equipment.\n3. Travel the Excavator\n\n3.1 Work area is surveyed for safe accessibility or\npotential hazards in accordance with safe\noperating procedures.\n3.2 Correct boom/arm angle position is\nmaintained.\n3.3 Sprocket/wheels are positioned according to\ncorrect travelling posture.\n3.4 Bucket to ground clearance is maintained in\naccordance with safety standards.\n3.5 Appropriate travel speed is observed with or\nwithout load and according to safety standards\n3.6 Unexpected situations are responded to in line\nwith company rules and regulations in a\nmanner that minimizes risk to personnel and\nequipment.\n4. Perform excavation work\n\n4.1 Work site inspection is performed in\naccordance with safety requirements.\n4.2 Engine RPM is set at desired operating\ncondition.\n4.3 Work equipment is properly positioned\naccording to correct operating procedure.\n4.4 Bucket penetration angle position is observed.\n4.5 Correct operation of arm and boom is observed\nduring scooping of excavated materials.\n4.6 Required excavation dimensions are\nobserved according to work specifications.\n4.7 Unexpected situations are responded to in line\nwith company rules and regulations in a\nmanner that minimizes risk to personnel and\nequipment.\n\n--- PDF PAGE 61 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\n5. Perform loading operation\n\n5.1 Hydraulic Excavator is properly positioned\naccording to ground condition.\n5.2 Engine RPM is set at desired operating\ncondition.\n5.3 Swing angle is maintained according to the\nrequired distance and position of mobile/\nstationary equipment.\n5.4 Proper loading sequence is observed based on\nstandard operating procedure.\n5.5 Unexpected situations are responded to in line\n with company rules and regulations in a\n manner that minimizes risk to personnel and\n equipment.\n6. Perform lifting operation\n6.1 Engine RPM is set at desired operating\ncondition.\n6.2 Correct rigging of load is observed in\naccordance with safe lifting procedure.\n6.3 Tipping radius is checked and confirmed\naccording to lifting capacity of the machine.\n6.4 Proper placing of load is observed when\nperforming lifting with the load over the front.\n6.5 Unexpected situations are responded to in line\nwith company rules and regulations in a\nmanner that minimizes risk to personnel and\nequipment.\n\n--- PDF PAGE 62 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Safety locks and\ncontrols\n\n1.1 Controls\n1.2 Travel\n1.3 Swing lock\n1.4 Bucket\n1.5 Boom\n1.6 Arm\n1.7 Swing\n2. Stopper blocks\n\n2.1 Wood/lumber\n2.2 Metal\n3. Binders\n3.1 Turnbuckles\n3.2 Shackle\n3.3 Wire rope sling\n3.4 Chain sling\n4. Unexpected\nsituations\nMay include but are not limited to:\n4.1 Collapse of unstable terrain\n4.2 Busted hoses (hydraulic & air)\n4.3 Natural calamities e.g., flashfloods\n4.4 Situations arising from poor peace and order conditions\n5. Potential\nhazards\nMay include but are not limited to:\n5.1 Other equipment\n5.2 Building\n5.3 Deep excavation\n5.4 Fog\n5.5 Electric wires/high tension wires\n5.6 Protruding nails/steel bars (Wheel type)\n5.7 Boulders and rocks\n5.8 Muddy roads or unstable terrain\n5.9 Ravine\n5.10 Landslide\n6. Angle\n6.1 90 degree - 110 degree\n7. Ground\nclearance\n7.1 30 cm – 40 cm\n\n--- PDF PAGE 63 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nVARIABLE\nRANGE\n8. Travel speed\n8.1 Crawler type\n8.1.1 1 - 3 km/hr.\n8.2 Wheel type\n8.2.1 5 – 30 km/hr\n9. Safety\nrequirements\n9.1 Barricades\n9.2 Caution tape\n9.3 Blinkers\n9.4 Signages\n9.5 Horns\n9.6 Reflector\n9.7 Fire extinguisher\n9.8 Safety belts\n9.9 PPE\n9.10 Decals/labels\n10. Engine RPM\n10.1 Low (700 – 900)\n10.2 Medium (900 – 1300)\n10.3 High (1400 – 2200)\n11. Work equipment\n11.1 Boom\n11.2 Arm\n11.3 Bucket\n11.4 Blade (small and medium size unit)\n12. Correct\noperating\nprocedure\n12.1 Required angle of 45 – 90 degrees between boom and\n arm.\n12.2 Sprocket is positioned at the rear.\n12.3 Stabilizer pad and blade are properly positioned.\n12.4 Tracks and boom are aligned with the digging trench.\n12.5 Tracks are positioned on stable and level ground.\n12.6 Required penetration angle of 45 – 120 degrees of bucket\n and arm from vertical axis.\n\n--- PDF PAGE 64 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\n13. Excavated\nmaterials\nMay include but are not limited to:\n13.1 Boulders\n13.2 Soil\n13.3 Sand\n13.4 Limestone\n13.5 Debris\n13.6 Coal\n13.7 Landfill\n13.8 Ore\n13.9 Silt\n\n--- PDF PAGE 65 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nVARIABLE\nRANGE\n14. Excavation\ndimensions\n14.1 Depth\n14.2 Reach\n14.3 Width\n14.4 Height\n15. Ground\ncondition\n15.1 Soft\n15.2 Hard\n15.3 Muddy\n15.4 Rocky\n15.5 Loose\n16. Mobile/\n stationary\n equipment\n16.1 Rigid and articulated hauler truck\n16.2 Dump truck\n16.3 Hopper\n16.4 Conveyor\n16.5 Bottom dump trailer\n\n--- PDF PAGE 66 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nEVIDENCE GUIDE\n1. Critical aspects\nof evidence to\n be considered\n\nAssessment requires evidence that the candidate:\n1.1 Demonstrates understanding of Hydraulic Excavator\noperating procedures\n1.2 Demonstrates ability to carry-out safe work practices\n1.3 Demonstrates understanding of controls, gauges and alert\nindicators or functions\n1.4 Demonstrates understanding of the company rules and\nregulations\n2. Underpinning\n (related)\n knowledge\n\n2.1 Types and uses of PPE\n2.2 Use of operation and maintenance manual\n2.3 System operation and component functions\n2.4 Controls, gauges and indicators\n2.5 Mensuration\n2.6 Basic arithmetic\n2.7 Excavator safety procedures and practices\n2.8 Company rules and regulations\n3. Underpinning\nskills\n\n3.1 Using appropriate PPE\n3.2 Interpreting operation and maintenance manual\n3.3 Identifying system operation and component functions\n3.4 Interpreting controls, gauges and indicators\n3.5 Calculations\n3.6 Following safety procedures and practices\n4. Resource\nimplications\n\nThe following resources must be provided:\n4.1 Access to appropriate Hydraulic Excavator and\n jobsite/terrain\n4.2 Ramp\n4.3 Dump truck\n4.4 Rigid and articulated haulers and trucks\n4.5 Trailer and prime mover\n4.6 Materials\n4.6.1 Bank\n4.6.2 Stockpile\n4.6.3 Excavated\n4.6.4 Loose\n4.7 Barricades and informative signages\n4.8 Signalman\n\n--- PDF PAGE 67 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\n5. Method of\nassessment\n\nCompetency must be assessed through:\n5.1 Oral/written questioning\n5.2 Direct observation/practical demonstration\n5.3 Work record and documents\n6. Context for\nassessment\n6.1 Assessment may be conducted in the work site or in a\n simulated venue.\n\n--- PDF PAGE 68 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007"
