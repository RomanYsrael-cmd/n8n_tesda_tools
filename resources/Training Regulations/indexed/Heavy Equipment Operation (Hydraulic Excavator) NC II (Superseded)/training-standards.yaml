      "source_text": "3.5\nTRAINING FACILITIES\n\nThe hydraulic excavator operation workshop must be made of reinforced\nconcrete or steel structure. The size must be suited on the requirements of the\ncompetencies. The class size of 25 students/trainees is reserved for the lecture\nroom and the practical demonstration area for carrying out minor Hydraulic\nExcavator parts maintenance. Most of the learning activities are performed\nindividually in the students/trainees work area.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA\nIN SQ.\nMETERS\n• Student/Trainee’s Working\nSpace\n 2.0 x 2.0 m.\n4 sq.m per\nstudent\n100.0 sq.m.\n•\nLecture Room\n8.00 x 6.00\n48.00\n48.0\n•\nLearning Resource Center\n4.00 x 6.00\n24.00\n24.0\n172\n• Facilities/Equipment/\nCirculation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n224\nWorking field\n 200 Sq. m. (MOA/Rental)\n\n--- PDF PAGE 79 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\n 3.6\n TRAINERS’ QUALIFICATION\nHEAVY EQUIPMENT OPERATION (EARTH MOVING)\n\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of Heavy-Equipment Operation (Hydraulic\nExcavator) NC-II or equivalent qualification\n• Must have undergone training on Training Methodology II (TM II)\nor equivalent training/experience\n• Must be computer literate\n• Must be physically and mentally fit\n• Must have had at least 5 years job/industry experience*\n• Must be a civil-service eligible (for government position or\nappropriate professional license issued by the Professional\nRegulatory Commission)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004-03\n\n--- PDF PAGE 80 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007"
