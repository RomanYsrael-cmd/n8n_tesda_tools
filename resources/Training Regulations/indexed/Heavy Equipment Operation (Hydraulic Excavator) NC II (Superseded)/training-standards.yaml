    "source_text": "3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY EQUIPMENT OPERATION - HYDRAULIC\n EXCAVATOR\nNC Level:\n\nBASIC COMPETENCIES\nNominal Training Hours:\n18 Hours (Basic) + 18 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individual with the basic, common and\ncore competencies in Construction Sector particularly in Heavy Equipment\nOperation.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\n related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 69 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 70 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n1.2 Requisition\nMaterials\n1.3 Receive and inspect\nmaterials\nAudio Visual\nsimulation\nDiscussion\nPractical\nexercise\nDemonstration\n• Direct observation\n• Questions or\ninterview\n• Portfolio\n(credentials)\n• Written / Oral Test\n•\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n3. Interpret\nTechnical\nDrawing\n3.1 Analyze sign,\nsymbols and data\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand\nsketching\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 71 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nUnit of\ncompetency\nLearning outcomes\nMethodology\nAssessment\napproach\n5. Maintain tools\nand\nequipment\n5.1 Check condition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge and\ntooth cutting tools\n5.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation of\napplication of tasks\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n\n--- PDF PAGE 72 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY- EQUIPMENT OPERATION Level: NC II\n\n HYDRAULIC EXCAVATOR (BACKHOE)\n\nNominal Training Hours:\n120 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes\nand skills in the use of hydraulic excavator (backhoe) in accordance with industry\nstandards. It covers core competencies such as: performing pre- and post-\noperation procedures, performing productive operation, and performing basic\npreventive-maintenance servicing on a given backhoe.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\nUnit of\nCompetency\n\nLearning Outcome\n\nMethodology\nAssessment\nApproach\n1. Perform pre- and\npost-operation\nprocedures for\nHydraulic Excavator\n(backhoe)\n\n1.1 Explain the\n importance and\n procedure in\n performing\n visual check of\n equipment.\n\n1.2 Identify the different\n component and\n parts of hydraulic\n excavator.\n\n1.3 Observe rules and\n regulations, safety\n in operation of\n hydraulic excavator\n\n1.4 Perform “BLOWAF”\n check on hydraulic\n excavator\n\n1.5 Perform pre & post -\n operation procedure.\nDiscussion\nDemonstration\n\n• Observation and\noral questioning\n• Demonstration\n• Written Test\n\n--- PDF PAGE 73 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007\n\nUnit of\nCompetency\nLearning Outcome\nMethodology\nAssessment\nApproach\n2. Perform productive\noperation for\nHydraulic\nExcavator\n(backhoe)\n\n3. Perform preventive\nmaintenance\nservicing for\nhydraulic excavator\n(backhoe)\n\n2.1 Observe rules and\n regulations safety\n procedure in loading\n excavator equipment\n to Truck/Trailer (Low\nbed).\n2.2 Load excavator\n equipment to\n Truck/Trailer (Low\nbed).\n2.3 Unload equipment\n from Truck/Trailer\n (Low bed).\n2.4 Move the excavator\n equipment to the\n worksite.\n2.5 Perform excavation\n work.\n2.6 Perform loading\n operation.\n2.7 Perform lifting and\n dumping operation.\n\n3.1 Explain the\n principles and\n procedures of\n hydraulic excavator\n equipment\n preventive\n maintenance.\n3.2 Perform\n adjustments/\n replacements on\n hydraulic excavator.\n3.3 Perform basic\n preventive\n maintenance\n servicing (PMS) on\n Hydraulic Excavator\n3.4 Prepare hydraulic\n excavator equipment\n operation reports.\n\nDiscussion\nDemonstration\n\nDiscussion\nDemonstration\n\n• Observation and\noral questioning\n• Demonstration\n• Written Test\n\n• Observation and\noral questioning\n• Demonstration\n• Written Test\n\n--- PDF PAGE 74 ---\nTR HEAVY EQUIPMENT OPERATION Promulgated December 2004/July 2007"
