  "source_text": "COMPETENCY MAP –BAMBOO PEODUCTION NC II\n\nBASIC COMPETENCIES\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with others\nDemonstrate\nwork values\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nPractice career\nprofessionalism\nPractice\noccupational health\nand safety\nprocedures\nLead workplace\ncommunication\nLead small team\nDevelop and\npractice\nnegotiation skills\nSolve problems\nrelated to work\nactivities\nUse mathematical\nconcepts and\ntechniques\nPractice\noccupational\nhealth and safety\nprocedures\nUtilize specialized\ncommunication skills\nDevelop teams\nand individuals\nApply problem\nsolving\ntechniques in\nthe workplace\nCollect, analyze\nand organize\ninformation\nPlan and organize\nwork\nPromote\nenvironmental\nprotection\nUse relevant\ntechnologies\n\nCOMMON COMPETENCIES\n\nApply Safety Measures in Farm\nOperations\nUse Farm Tools and Equipment\nPerform Estimation and Basic\nCalculation\n\nCORE COMPETENCIES\nOperate bamboo nursery\nEstablish bamboo farm\nConduct bamboo clump\nrehabilitation\nConduct harvesting and post-\nharvesting operations\n\n--- PDF PAGE 97 ---\nTR- Bamboo Production NC II\n December 2015\n\n 93\nGLOSSARY OF TERMS\n\n1. Branch cutting\n\nSegment of a branch with nodal rhizomatous bud used\nfor propagations\n2. Bud\nPotential shoot\n3. Clump\nCluster of bamboo stems growing from underground\nrhizome system\n4. Culm\nAbove ground stem which grows from the\nunderground rhizomes\n5. Culm cutting\nSegments of a culm having one or more buds used for\npropagations\n6. Early tending operations\nPreliminary activities(Initial fertilizer application,\nmulching, weeding and replacement of dead planting\nmaterials) for the first three years of plantation\n7. Hardening off\nPreparing the planting stocks for out planting\n8. Heeling – in\nThumping the soil around the planting stock\n9. Inorganic Fertilizer\nChemical or synthetic based fertilizers\n10. Kiln drying\nMethod of removing moisture from the culm using a\ndry kiln\n11.Manual Harvesting\nCutting of bamboo culms using simple tools\n12. Mechanical harvesting\n\nCutting of bamboo culms using equipment\n13.Mist propagation chamber\nControlled delivery of water in mist form\n14.Mounding\nPiling up of soils and organic debris around the clump\n15. Mulching\n\nProtective covering usually of organic matter to\nprevent moisture loss and growth of weeds\n16. Nursery bed\nLoosened soil where cuttings are rooted\n17.Nursery stocks\nbamboo propagules under nursery condition\n18.Organic Fertilizer\nNatural fertilizer\n19. OSHS\nOccupational Safety and Health Standards\n20.Planting stocks\nPropagules ready for out planting\n21. Pole\nCut culm\n22. PPE\nPersonal protective equipment\n23. Potting medium\nMixes of materials(soil plus saw dust, rice hull, etc.)\nused for growing plants in pots\n24.Propagules\nPlanting materials (stocks)\n25. Prophylactic\napplication of preservatives to the culm immediately\nafter harvesting\n26.Pruning\nCutting of unwanted branches\n27. Rhizome\nThick, horizontal bamboo stem\n28.Rooting facilities\nArea where propagules are rooted\n29. Rooting hormones\nChemicals that induce rooting\n30. Sap replacement\nMethod of applying preservatives by dipping the butt\nend of the freshly cut culms while the branches and\nleaves are intact\n31.Shoots\nYoung culm less than 30 days old\n32. Species-site matching\nCompatibility of species to a specific site\n33. Staking\nPutting stake as a guide in laying out of planting holes\n34.Weeding\nRemoval of unwanted vegetation\n35. 3Rs\nReduce, Reuse and Recycle\n\n--- PDF PAGE 98 ---\nTR- Bamboo Production NC II December 18, 2017 94\n\n TRAINING REGULATIONS (TR)\n DOCUMENT REVISION HISTORY\n\nQualification Title : Bamboo Production NC II\nQualification Code: __AFFBPN217______\n\nRevision\nNo.\n\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\n\nDeployment\nCircular\n00\nDocument Created –\nBamboo Production NCII\n\nNot Applicable\n\nTB No. 2017-52/\nDecember 18,\n2017\nTESDA Circular\nNo. __ s.___\n Legend: *Description Types\n-\nDocument Created\nDocument Amended\n\n--- PDF PAGE 99 ---\nTR- Bamboo Production NC II December 18, 2017 94",
