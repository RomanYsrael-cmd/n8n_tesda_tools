  "source_text": "1. Branch cutting\n\nSegment of a branch with nodal rhizomatous bud used\nfor propagations\n2. Bud\nPotential shoot\n3. Clump\nCluster of bamboo stems growing from underground\nrhizome system\n4. Culm\nAbove ground stem which grows from the\nunderground rhizomes\n5. Culm cutting\nSegments of a culm having one or more buds used for\npropagations\n6. Early tending operations\nPreliminary activities(Initial fertilizer application,\nmulching, weeding and replacement of dead planting\nmaterials) for the first three years of plantation\n7. Hardening off\nPreparing the planting stocks for out planting\n8. Heeling – in\nThumping the soil around the planting stock\n9. Inorganic Fertilizer\nChemical or synthetic based fertilizers\n10. Kiln drying\nMethod of removing moisture from the culm using a\ndry kiln\n11.Manual Harvesting\nCutting of bamboo culms using simple tools\n12. Mechanical harvesting\n\nCutting of bamboo culms using equipment\n13.Mist propagation chamber\nControlled delivery of water in mist form\n14.Mounding\nPiling up of soils and organic debris around the clump\n15. Mulching\n\nProtective covering usually of organic matter to\nprevent moisture loss and growth of weeds\n16. Nursery bed\nLoosened soil where cuttings are rooted\n17.Nursery stocks\nbamboo propagules under nursery condition\n18.Organic Fertilizer\nNatural fertilizer\n19. OSHS\nOccupational Safety and Health Standards\n20.Planting stocks\nPropagules ready for out planting\n21. Pole\nCut culm\n22. PPE\nPersonal protective equipment\n23. Potting medium\nMixes of materials(soil plus saw dust, rice hull, etc.)\nused for growing plants in pots\n24.Propagules\nPlanting materials (stocks)\n25. Prophylactic\napplication of preservatives to the culm immediately\nafter harvesting\n26.Pruning\nCutting of unwanted branches\n27. Rhizome\nThick, horizontal bamboo stem\n28.Rooting facilities\nArea where propagules are rooted\n29. Rooting hormones\nChemicals that induce rooting\n30. Sap replacement\nMethod of applying preservatives by dipping the butt\nend of the freshly cut culms while the branches and\nleaves are intact\n31.Shoots\nYoung culm less than 30 days old\n32. Species-site matching\nCompatibility of species to a specific site\n33. Staking\nPutting stake as a guide in laying out of planting holes\n34.Weeding\nRemoval of unwanted vegetation\n35. 3Rs\nReduce, Reuse and Recycle\n\n--- PDF PAGE 98 ---\nTR- Bamboo Production NC II December 18, 2017 94",
