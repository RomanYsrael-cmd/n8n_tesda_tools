        "source_text": "AFF611312\nUNIT DESCRIPTOR\n: This unit covers the knowledge and skill required to conduct\nclump pre- rehabilitation activities, perform clump rehabilitation\noperation and perform clump post- rehabilitation\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized term are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.Conduct pre-clump\nrehabilitation activities\n1.1Clump conditions\nare assessed\nbased on\nestablished\ncriteria\n1.2 Rehabilitation plan\nis followed\naccording to\ncultural practices\n1.3 Equipment, Tools,\nsupplies and\nmaterials are\nprepared\naccording to work\nrequirements\n1.4 Safety measures\nare applied\naccording to OSHS\n• Different clump\nconditions\n• Assessment\nprocedures\n• Established criteria\n• Cultural practices\n• Bamboo clump\nrehabilitation plan\n• Defective culms\no broken\no dead and dying\no crooked\no stunted\no diseased\n• Proper tools and\nequipment to be\nused\n• Equipment, tools,\nsupplies and\nmaterials\n• OSHS\n• Assessing clump\nconditions\n• Interpreting and\nfollowing\nrehabilitation plan\n• Preparing tools,\nsupplies and\nmaterials\n• Observing safety\nmeasures\n2.Perform clump\nrehabilitation\nactivities\n2.1 Clump\nrehabilitation\nprocedures are\napplied according\nto farm practice\n2.2 Maintain the\nrehabilitated\nclumps based on\nstandard cultural\npractices\n2.3 Monitoring culm\nage is performed\nbased on\nestablished farm\npractices\n2.3 Safety measures\nare applied\naccording to OSHS\n• Thickets and\nunnecessary\nbranches\n• Cultural practices\n• Handling and\noperation of mini-\nchain saw\n• Safety practices in\nclump rehabilitation\n\n• Applying clump\nrehabilitation\nprocedures\n• Pruning of thickets\nand unnecessary\nbranches\n• Thinning of\ndefective culms\n• Performing culm\nage monitoring\n• Handling and\noperating mini-\nchain saw\n• Practicing OSHS\n\n--- PDF PAGE 42 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 38\n\nand industry\nprocedures\n2.4 Mini – chain saw is\nhandled and\noperated following\nmanufacturer’s\nmanual\n3. Perform post-\nrehabilitation activities\n3.1 Tools and\nequipment are\nmaintained and\nstored according to\nmanufacturer’s\nmanual\n3.2 Excess supplies\nand materials are\ninventoried and\nstored based on\nstandard\nprocedures\n3.3 Wastes are\nmanaged following\nenvironmental\nregulations\n3.4 Work activities and\noutputs are\nrecorded and\nreported to\nimmediate\nsupervisor\n• Proper tools and\nequipment to be\nused\n• Maintenance and\nstorage procedure\nof tools and\nequipment\n• Inventory and\nstorage of excess\nsupplies and\nmaterials\nprocedures\n• Waste\nmanagement\n• 3Rs\n• Record keeping\nand preparation of\nreport\n• Maintaining and\nstoring tools and\nequipment\n• Inventorying and\nstoring excess\nsupplies and\nmaterials\n• Managing wastes\n• Keeping record\n• Preparing report\n• Written and oral\nreporting\n\n--- PDF PAGE 43 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 39\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Established criteria\nEstablished criteria may include:\n1.1 Dense thickets around the clump\n1.2 Presence of defective and dead culms and\nstumps\n1.3 Difficult to penetrate during harvesting\n2. Equipment, tools supplies and materials\nEquipment, tools supplies and materials may\ninclude:\n2.1 Equipment\n2.1.1 Mini-chain saw\n2.2 Tools\n2.2.1 shovel\n2.2.2 digging bar\n2.2.3 wheel barrow\n2.2.4 Pruning shears\n2.2.5 sickle\n2.2.6 bolo\n2.2.7 Pruning saw\n2.2.8 Lopping shears\n2.3 Supplies and materials\n2.3.1 PPE\n2.3.2 Insecticide\n2.3.3 fertilizers\n2.3.4 fuel\n2.3.5 lubricants\n3. Rehabilitation procedures\nRehabilitation procedures may include but not\nlimited to:\n3.1 Pruning of thickets and unnecessary basal\nbranches\n3.2 Removal of defective culms\n3.3 Cutting of over-matured culms\n3.4 Soil cultivation and mounding\n3.5 Application of fertilizer\n3.6 Mulching\n4. Standard cultural practices\nStandard cultural practices may include but not\nlimited to:\n4.1 Weeding\n4.2 Soil cultivation and mounding\n4.3 Fertilizer application\n4.4 Pruning of thickets\n4.5 Thinning of unhealthy culms\n5. Farm practices\nFarming practices may include:\n5.1Visual\n5.1.1 Color\n5.1.2 presence of lichens\n\n--- PDF PAGE 44 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 40\n\n5.2 Sound\n5.2.1 dull\n5.2.2 ringing\n6. Mulch\nMulch may include:\n3.1 Leaf litter\n3.2 Rice hull\n3.3 Coco coir\n3.4 Cut grass\n3.5 Saw dust\n\nEVIDENCE GUIDE\n\n1. Critical aspects of Competency\nAssessment requires evidence that the\ncandidate:\n1.1 Conducted clump pre- rehabilitation\nactivities\n1.2 Performed clump rehabilitation operation\n1.3 Performed clump post- rehabilitation\n\n2. Resource Implications\nThe following resources should be provided:\n2.1\nBamboo clump rehabilitation site or\nsimulated workplace\n2.2\nEquipment, tools, materials and supplies\nfor bamboo clump rehabilitation operation\n2.3 Protective Personal Equipment\n3. Methods of Assessment\nCompetency in this unit may be assessed\nthrough:\n3.1\nInterview\n3.2\nDemonstration with questioning\n3.3\nWritten examination\n\n4. Context for Assessment\n4.1 Competency may be assessed in the work\n\n--- PDF PAGE 45 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 41\n\nplace or in a simulated work place setting\n\n--- PDF PAGE 46 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 42\n\nUNIT OF COMPETENCY\n: CONDUCT HARVESTING AND POST-HARVESTING\nOPERATION\nUNIT CODE\n:"
