rting on defective\nfarm equipment\n• Operating farm\nequipment\n• Following safety\nprocedures.\n\n--- PDF PAGE 27 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 23\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n• Safety and keeping\nof equipment every\nafter use\n•\nSafety measures\n3.\nPerform\npreventive\nmaintenance\n3.1 Tools and\nequipment are\ncleaned\nimmediately after\nuse in line with\nfarm procedures\n3.2 Routine check-up\nand maintenance\nare performed\n3.3 Tools and\nequipment are\nstored in\ndesignated areas\nin line with farm\nprocedures\n• Cleaning procedures\nof tools and\nequipment\n• Maintenance\nprocedures of farm\nequipment\n• Storage of tools and\nequipment\n• Designated storage\nareas\n\n• Cleaning tools and\nequipment\n• Performing routinely\ncheck-up of tools and\nequipment\n• Maintaining farm\nequipment\n• Storing tools and\nequipment\n\n--- PDF PAGE 28 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 24\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nFarm equipment\n\n1.1 Engine\n1.2 Pumps\n1.3 Generators\n1.4 Sprayers\n2.\nFarm tools\n2.1 Sickle\n2.2 Cutters\n2.3 Weighing scales\n2.4 Hand tools\n2.5 Measuring tools\n2.6 Garden tools\n3.\nPre-operation check-up\n3.1 Tires\n3.2 Brake fluid\n3.3 Fuel\n3.4 Water\n3.5 Oil\n3.6 Lubricants\n3.7 Battery\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nCorrectly identified appropriate farm tools and equipment\n1.2\nOperated farm equipment according to manual specification\n1.3\nPerformed preventive maintenance\n2.\nMethod of\nAssessment\n\nCompetency in this unit must be assessed through:\n2.1\nDirect observation\n2.2\nPractical demonstration\n2.3\nThird Party Report\n3.\nResource\nImplications\n3.1\nService/operational manual of farm tools and equipment\n3.2\nTools and equipment\n3.3\nFarm implements\n\n4.\nContext