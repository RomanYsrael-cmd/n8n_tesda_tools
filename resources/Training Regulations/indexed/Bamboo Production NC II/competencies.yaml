        "source_text": "--- PDF PAGE 10 ---\nTR Bamboo Production NC II  \n Promulgated December 18, 2017   \n 6\n \n \n \n \n \n \nUNIT OF COMPETENCY: \nWORK IN A TEAM ENVIRONMENT \nUNIT CODE: \n500311106 \nUNIT DESCRIPTOR: \nThis unit covers the skills, knowledge and attitudes to identify \nrole and responsibility as a member of a team \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Describe team \nrole and scope \n1.1 The role and objective \nof the team is \nidentified from available \nsources of \ninformation. \n1.2 Team parameters, \nreporting relationships \nand responsibilities are \nidentified from team \ndiscussions and \nappropriate external \nsources. \n Company \nvision/mission \nstatements \n Company policies \nand employee code \nof conduct  \n Communication \nprocess \n Team structure \n Team roles \n Group planning and \ndecision making \n Communicating \nskills appropriately \nand  consistent with \nthe culture of the \nworkplace \n Adopting skills to \nteam role and scope \nof responsibilities \n2. Identify own \nrole and \nresponsibility \nwithin team \n2.1 Individual role and \nresponsibilities within \nthe team environment \nare identified. \n2.2 Roles and \nresponsibility of other \nteam members are \nidentified and \nrecognized. \n2.3 Reporting relationships \nwithin team and \nexternal to team are \nidentified. \n Company \nvision/mission \nstatements \n Company policies \nand employee code \nof conduct  \n Communication \nprocess \n Team structure \n Team roles \n Group planning and \ndecision making \n Methods and \ntechniques of role \nand responsibility \nidentification with a \nteam\n Communicating \nskills appropriately \nand  consistent with \nthe culture of the \nworkplace \n Role and \nresponsibility \nidentification skills \n \n3. Work as a team \nmember \n3.1 Effective and \nappropriate forms of \ncommunications used \nand interactions \nundertaken with team \nmembers who \ncontribute to known \nteam activities and \nobjectives. \n3.2 Effective and \nappropriate \ncontributions made to \ncomplement team \nactivities and \n Approaches of \ninteracting with team \nmembers \n Types of \ncommunications \nused in effective \ninteraction with team \nmembers \n Methods of working \nas a team \n Techniques in \nworking as a team \n \n Team working skills \n Communicating \nskills appropriately \nand  consistent with \nthe culture of the \nworkplace \n Skills in observing \nprotocols when \nmaking reports \n Using standard \nprocedures when \nmaking reports \n Developing \nteamwork plans\n\n--- PDF PAGE 11 ---\nTR Bamboo Production NC II  \n Promulgated December 18, 2017   \n 7\n \n \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \nobjectives, based on \nindividual skills and \ncompetencies and \nworkplace context. \n3.3 Observed protocols in \nreporting using \nstandard operating \nprocedures. \n3.4 Contribute to the \ndevelopment of team \nwork plans based on \nan understanding of \nteam’s role and \nobjectives and \nindividual \ncompetencies of the \nmembers. \nbased on team’s role \nand objectives\n\n--- PDF PAGE 12 ---\nTR Bamboo Production NC II  \n Promulgated December 18, 2017   \n 8\n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Role and objective of \nteam  \n1.1 \nWork activities in a team environment with enterprise or \nspecific sector \n1.2 \nLimited discretion, initiative and judgment maybe demonstrated \non the job, either individually or in a team environment \n2. Sources of information \n2.1 \nStandard operating and/or other workplace procedures \n2.2 \nJob procedures \n2.3 \nMachine/equipment manufacturer’s specifications and \ninstructions \n2.4 \nOrganizational or external personnel \n2.5 \nClient/supplier instructions \n2.6 \nQuality standards \n2.7\nOHS and environmental standards \n3. Workplace context \n3.1 \nWork procedures and practices \n3.2 \nConditions of work environments \n3.3 \nLegislation and industrial agreements \n3.4 \nStandard work practice including the storage, safe handling \nand disposal of chemicals \n3.5\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 13 ---\nTR Bamboo Production NC II  \n Promulgated December 18, 2017   \n 9\n \n \n \n \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1 \nOperated in a team to complete workplace activity \n1.2 \nWorked effectively with others \n1.3 \nConveyed information in written or oral form \n1.4 \nSelected and used appropriate workplace language \n1.5 \nFollowed designated work plan for the job \n1.6\nReported outcomes  \n2. Resource implications \nThe following resources MUST be provided: \n2.1 \nAccess to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2\nMaterials relevant to the proposed activity or tasks\n3. Method of assessment \nCompetency in this unit may be assessed through: \n3.1 \nObservation   of the individual member in relation to the work \nactivities of the group \n3.2 \nObservation of simulation and or role play involving the \nparticipation of individual member to the attainment of \norganizational goal \n3.3 \nCase studies and scenarios as a basis for discussion of    issues \nand strategies in teamwork\n4. Context of assessment \n4.1 \nCompetency may be assessed in workplace or in a simulated \nworkplace setting \n4.2 \nAssessment shall be observed while task are being undertaken \nwhether individually or in group\n",
