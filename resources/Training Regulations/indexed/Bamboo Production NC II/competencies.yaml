        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nConducted pre-nursery operation\n1.2\nPerform nursery operation\n1.3\nMaintained nursery stocks\n1.4\nConducted post nursery operations\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Nursery site or simulated workplace\n2.2 Equipment, tools, materials and supplies for nursery\noperation\n2.3 Protective Personal Equipment\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Interview\n3.2 Demonstration with questioning\n3.3 Written examination\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 37 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 33\n\nUNIT OF COMPETENCY\n: ESTABLISH BAMBOO FARM\nUNIT CODE\n:"
        },
        "source_text": "AFF611310\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitude required to conduc\npre-nursery operation, perform nursery operation, care and maintain\nnursery stocks and conduct post-nursery operations\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Conduct pre-\nnursery operation\n1.1 Site is selected based\non established\ncriteria.\n1.2 Nursery plan is\nfollowed according to\nprescribed procedures.\n1.3 Rooting facilities and\nnursery beds are\nprepared according to\nestablished farm\nprocedures.\n1.4Tools, equipment,\nsupplies and\nmaterials are prepared\naccording to work\nrequirements.\n1.5 Site selected is\nsecured from stray\nanimals and\nunauthorized persons.\n1.6 Work output is reported\nto concerned authority\naccording to industry\npractices.\n• Established criteria\nfor site selection\n• Prescribed\nprocedures in\ninterpreting plan\n• Nursery plan\ncomponents\n• Different tools,\nequipment, supplies\nand materials\n• Preparation of tools\nand equipment\no Inspection and\nsegregation of\ndefective tools\nand equipment\no Assembly and\nadjustment of\nequipment\n• Preparation of report\n\n• Selecting site for\nnursery operation\n• Interpreting nursery\nplan\n• Preparing rooting\nfacilities and nursery\nbeds\n• Preparing different\ntools, equipment,\nsupplies and\nmaterial\n• Securing selected\nsite\n• Written and oral\nreporting\n\n2. Perform nursery\noperation\n2.1 Culms as source of\npropagules are\nselected from the\nclump based on the\nestablished criteria\n2.2 Propagules of required\nbamboo species are\ncollected and prepared\nbased on prescribed\ncriteria.\n2.3 Storage of\npropagules is done\nbased on established\nfarm practices.\n2.4 Rooting hormones are\napplied to propagules\nfollowing prescribed\ndosages.\n• Rooting facilities and\nnursery beds\n• Procedures in the\npreparation of rooting\nfacilities and nursery\nbed\n• Types and dosage\npreparation of rooting\nhormones\n• Computation for\nconcentration of\nrooting hormones\n• Application\nprocedures of rooting\nhormones\n• Different containers\nand potting media\n• Selecting culms as\nsource of\npropagules\n• Collecting and\npreparing\npropagules\n• Storing of\npropagules\n• Computing for\nrooting hormones\nconcentration\n• Applying rooting\nhormones to\npropagules\n• Rooting of\npropagules\n\n--- PDF PAGE 32 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 28\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2.5 Hormone treated\npropagules are rooted\nin pots and in rooting\nbed\n2.6 Propagules rooted in\nbed are potted in\ncontainers using\nrecommended potting\nmedia and placed in\nshaded nursery bed\n2.7 Nursery area is\nmaintained as clean\nand safe following\nworkplace procedures.\n2.8Safety measures are\npracticed according to\nOccupational Safety\nand Health Standard\n• Potting procedures\n• Maintenance of clean\nand safe area\no Unwanted\nvegetation\no Waste disposal\no Environmental\nregulations\n• OSHS\n• Source of propagules\n• Different types of soil\nand hull\n• Physical and\nchemical components\nof potting media;\nnutrient requirements\n• Potting of rooted\npropagules\n• Mixing of potting\nmedia\n• Maintaining clean\nand safe nursery\narea\n• Practicing OSHS\n• Selecting source of\npropagules\n3. Maintain nursery\nstocks\n3.1 Watering of nursery\nstocks is done\naccording to species\nrequirement\n3.2 Weeding is done\naccording to cultural\nprocedures\n3.3 Pests and diseases\nare prevented and\ncontrolled using\nindustry standard\n3.4Fertilizers are applied\nbased on soil nutrient\nstatus and plant’s\nnutritional\nrequirements\n3.5 Hardening of nursery\nstocks is undertaken\naccording to\nprescribed procedures\n3.6 Safety measures are\npracticed according to\nindustry procedures.\n• Moisture requirement\nof species\n• Watering procedures\n• Shading procedures\n• Weed species\n• Weeding procedures\n• Different pest and\ndiseases\n• Prevention and\ncontrol procedures\n• Types and\nspecifications of\nfertilizers\n• Fertilizer application\nprocedures\n• Hardening\nprocedures\n• OSHS\n• Watering of nursery\nstocks\n• Weeding nursery\narea\n• Monitoring,\npreventing and\ncontrolling pests\nand diseases\n• Applying fertilizers\n• Hardening nursery\nstocks\n• Practicing OSHS\n4.Conduct post\nnursery operations\n4.1Planting stocks are\ngraded according to\nstandards\n4.2Quality planting\nmaterials are\npackaged, dispatched\nand sold according to\nmarketing procedures\n4.3Sub-standard planting\nstocks are improved\n• Grading standards for\nplanting stocks\n• Different packaging\nmaterials\n• Packaging and\ndispatching\nprocedures\n• Marketing procedures\n• Grading of planting\nstocks\n• Packaging and\ndispatching nursery\nstocks\n• Selling quality\nplanting materials\n• Marketing skills\n\n--- PDF PAGE 33 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 29\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nfollowing farm\nprocedures\n4.4Maintenance of safe\nand clean area is\nundertaken throughout\nthe completion of\nnursery operations\nfollowing environmental\nregulations\n4.5Tools and equipment\nare maintained and\nstored according to\nmanufacturer’s manual\n4.6Excess supplies and\nmaterials are\ninventoried and stored\nbased on standard\nprocedure\n4.7Work activities and\noutputs are recorded\nand reported to\nconcerned authority\n• Procedures in\nmaintaining nursery\narea\n• Maintenance and\nstorage procedure of\ntools and equipment\n• Inventory and storage\nof excess supplies\nand materials\nprocedures\n• Record keeping and\nreporting\n•\n• Improving sub-\nstandard planting\nstocks\n• Maintaining nursery\narea\n• Maintaining and\nstoring tools and\nequipment\n• Conducting\ninventory and\nstoring of excess\nsupplies and\nmaterials\n• Oral and written\nreporting\n\n--- PDF PAGE 34 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 30\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Established criteria\nEstablished criteria includes:\n 1.1 Water source\n 1.2 Accessibility and visibility to buyers\n 1.3 Labour/Propagator\n 1.4 Topography\n 1.5 Distance to the proposed plantation/ demonstration farm\n 1.6 Demand of planting materials\n1.7 Security, Peace and order\n1.8 Source of potting media\n1.9 Light conditions\n1.10 Vegetation\n1.11 Source of propagules\n2. Equipment, tools,\nsupplies and materials\nEquipment, tools, supplies and materials may include:\n2.1Equipment\n2.1.1 Grass Cutter\n2.2 Tools\n2.2.1 Pruning Shears\n2.2.2 Pruning Saw\n2.2.3 Lopping Shears\n2.2.4 Shovel\n2.2.5 Pick Mattock or Grab Hoe\n2.2.6 Digging Bar\n2.2.7 Wheel Barrow\n2.2.8 Hack Saw\n2.2.9 Sickle\n2.2.10 Bolo\n2.2.11 Animal\n2.2.12Animal Sled\n2.3 Supplies and Materials\n2.3.1 PPE\n2.3.2 Office materials\n2.3.3 Poly bags\n2.3.4Pesticide\n2.3.5 Fertilizers\n2.3.6 Fuel\n2.3.7 Lubricants\n3. Storage of\npropagules\nStorage of propagules may include:\n3.1 Heeling – in\n\n--- PDF PAGE 35 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 31\n\n3.2 Soaking\n4 Propagules\nPropagules may include:\n4.1 Culm cutting\n4.2 Branch cutting\n5 Prescribed criteria\nPrescribed criteria may include:\n5.1 Age of culms\n5.2 Portion of culms\n5.3 Size of propagules\n5.4 Season of collection\n5.5 Presence of plump buds\n6 Potting media\nPotting media includes ordinary garden soil mixed with any of the\nfollowing:\n6.1 Rice hull\n6.2 Saw dust\n6.3 Compost\n6.4 coco coir\n6.5 sand\n7 Safety measures\n\nSafety measures may include:\n7.1 Wearing appropriate personal protective equipment\n7.2 Handling tools\n7.3 Following instructions of manuals in equipment operation\n7.4 Awareness and control of various hazards of the operations\n8 Pests and diseases\nPests and diseases may include:\n8.1 Pests\n8.1.1 Mealy bugs\n8.1.2 Mites\n8.1.3 Aphids\n8.2 Diseases\n8.2.1 Leaf rust\n8.2.2 Leaf spot\n8.2.3 Tip blight\n9 Fertilizers\nFertilizers may include:\n9.1. Organic Fertilizer\n9.2. Inorganic Fertilizer\n10 Grading standards\n\nGrading standards may include:\n10.1 Health\n10.2 Clump size (number of shoots) of stocks\n10.3 Presence of sprouts\n10.4 Developed root system\n11 Improvement of sub-\nstandard planting\nstocks\nImprovement of quality of sub-standard planting stocks may\ninclude but not limited to:\n11.1 Fertilizer application (Organic or inorganic)\n11.2 Watering\n11.3 Weeding\n\n--- PDF PAGE 36 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 32\n\n11.4 Control of pests and diseases\n11.5 Hardening-off\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nConducted pre-nursery operation\n1.2\nPerform nursery operation\n1.3\nMaintained nursery stocks\n1.4\nConducted post nursery operations\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Nursery site or simulated workplace\n2.2 Equipment, tools, materials and supplies for nursery\noperation\n2.3 Protective Personal Equipment\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Interview\n3.2 Demonstration with questioning\n3.3 Written examination\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 37 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 33\n\nUNIT OF COMPETENCY\n: ESTABLISH BAMBOO FARM\nUNIT CODE\n:"
