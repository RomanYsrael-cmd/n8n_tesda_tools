        "source_text": "--- PDF PAGE 22 ---\nTR Bamboo Production NC II  \n Promulgated December 18, 2017   \n 18\n \n \n \n \n \n \nCOMMON COMPETENCIES \n \n \nUNIT OF COMPETENCY : \nAPPLY SAFETY MEASURES IN FARM OPERATIONS \nUNIT CODE \n: \nAGR 321201 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required \nto perform safety measures effectively and efficiently. It \nincludes identifying areas, tools, materials, time and place in \nperforming safety measures. \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. \nDetermine \nareas of \nconcern for \nsafety \nmeasures  \n1.1 Work tasks are identified \nin line with farm \noperations \n1.2 Place for safety \nmeasures are determined \nin line with farm \noperations \n1.3 Time for safety measures \nare determined in line \nwith farm operations \n1.4 Appropriate tools, \nmaterials and outfits \nare prepared in line with \njob requirements \n Different work tasks \nin farm operations \n Place and time for \nimplementation of \nsafety measures \n Different hazards in \nthe workplace \n Types of tools, \nmaterials and outfits  \n Preparation of tools, \nmaterials and outfits \n \n \n Identifying work \ntasks in farm \noperations \n Determining \nplace and time \nfor \nimplementation \nof safety \nmeasures \n Reading labels, \nmanuals and \nother basic \nsafety \ninformation \n Identifying \neffective/ \nfunctional tools, \nmaterials and \noutfit \n Preparing \ntools, materials \nand outfits \n Discarding \ndefective tools, \nand materials\n\n--- PDF PAGE 23 ---\nTR Bamboo Production NC II  \n Promulgated December 18, 2017   \n 19\n \n \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2. Apply \nappropriate \nsafety \nmeasures \n2.1 Tools and materials are \nused according to \nspecifications and \nprocedures \n2.2 Outfits are worn according \nto farm requirements \n2.3 Effectivity/shelf \nlife/expiration of materials \nare strictly observed \n2.4 Emergency procedures \nare known and followed to \nensure a safework \nrequirement \n2.5 Hazards in the workplace \nare identified and reported \nin line with farm \nguidelines \n Uses and functions \nof tools  \n Outfits and how to \nwear it. \n Expiration/shelf life \nof materials \n Proper disposal of \nexpired materials \n Environmental rules \nand regulations \n Emergency \nprocedures \n Hazards \nidentification and \nreporting \n Communication skills\n OSHS \n \n \n Using tools \nand materials \nin the \nworkplace \n Wearing of \noutfits \n Observing \nexpiration/shelf \nlife of materials \n Disposing of \nexpired \nmaterials \n Following \nemergency \nprocedures \n Identifying and \nreporting of \nhazards in \nworkplace \narea. \n3. Safekeep \n/dispose \ntools, \nmaterials \nand outfit \n3.1 Used tools and outfit are \ncleaned after use and \nstored in designated \nareas. \n3.2 Unused materials are \nproperly labeled and \nstored according to \nmanufacturer’s \nrecommendation and farm \nrequirements. \n3.3 Waste materials are \ndisposed according to \nmanufacturers, \ngovernment and farm \nrequirements. \n Procedures of \ncleaning used tools \nand outfits \n Label and storage \nunused materials \n Disposal of wastes \nmaterials \n Manufacturers’ \nrecommendation on \nkeeping materials   \n Environmental rules \nand regulations \n Cleaning used \ntools and outfit  \n Labelling and \nstoring unused \nmaterials  \n Disposing \nwaste \nmaterials\n\n--- PDF PAGE 24 ---\nTR Bamboo Production NC II  \n Promulgated December 18, 2017   \n 20\n \n \n \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Work tasks \nWork task may be selected from any of the subsectors: \n1.1 \nCrop Production \n1.2 \nPost-harvest \n1.3 \nAgri-marketing \n1.4 \nFarm Equipment \n2. Place \n2.1 \nStock room/storage areas/warehouse \n2.2 \nField/farm/orchard \n3. Time \n3.1 \nFertilizer and pesticides application \n3.2 \nFeed mixing and feeding \n3.3\nHarvesting and hauling\n4. \nTools, materials and \noutfits \n4.1 \nTools \n4.1.1 Wrenches \n4.1.2 Screw driver \n4.1.3 Pliers \n4.2 \nOutfit \n4.2.1 Masks \n4.2.2 Gloves \n4.2.3 Boots \n4.2.4 Overall coats \n4.2.5 Hat \n4.2.6 Eye goggles\n5. Emergency \nprocedures \n5.1 \nLocation of first aid kit \n5.2 \nEvacuation \n5.3 \nAgencies contract \n5.4 \nFarm emergency procedures \n6. Hazards \n6.1 \nChemical \n6.2 \nElectrical \n6.3 \nFalls\n\n--- PDF PAGE 25 ---\nTR Bamboo Production NC II  \n Promulgated December 18, 2017   \n 21\n \n \n \n \n \n \nEVIDENCE GUIDE \n \n1. \nCritical Aspects of  \nCompetency \nAssessment requires evidence that the candidate: \n1.1  Determined areas of concern for safety measures \n1.2 Applied appropriate safety measures according to industry \nrequirements \n1.3  Prepared tools, materials and outfit needed \n1.4  Performed proper disposal of used materials \n1.5  Cleaned and stored tools, materials and outfit in designated \nfacilities  \n2.    Method of \nAssessment \nCompetency in this unit must be assessed through: \n2.1 Practical demonstration  \n2.2\nThird Party Report\n3.    Resource \nImplications \n3.1  Farm location \n3.2 Tools, equipment and outfits appropriate in applying safety \nmeasures \n \n4.    Context of \nAssessment \n4.1 Assessment may occur in the workplace or in a simulated \nworkplace or as part of a team under limited supervision\n",
