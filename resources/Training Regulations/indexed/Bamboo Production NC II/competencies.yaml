          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nConduct pre-establishment activities\n1.2\nPlant bamboo stocks\n1.3\nMaintain bamboo farm\n1.4\nConduct post-establishment operation\n2. Resource Implications\nThe following resources should be provided:\n2.1 Bamboo farm/plantation site or simulated\nworkplace\n2.2 Equipment, tools, materials and supplies for\nbamboo farm establishment operation\n2.3 Protective Personal Equipment\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration with questioning\n3.2\nWritten examination\n4. Context for Assessment\n4.1 Competency may be assessed in the work place\nor in a simulated work place setting\n\n--- PDF PAGE 41 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 37\n\nUNIT OF COMPETENCY\n: CONDUCT BAMBOO CLUMP REHABILITATION\nUNIT CODE\n:"
        },
        "source_text": "AFF611311\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitude required to\nconduct pre-establishment activities, plant bamboo stocks,\nmaintain bamboo farm and conduct post-establishment\noperation.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nItalicized term are elaborated in\nthe Range of Variables\n1.Conduct pre-\nestablishment\nactivities\n1.1Species-site matching\nis carried out following\nestablished\nprocedures\n1.2 Plantation plan is\nfollowed according to\nprescribed procedures\n1.3Equipment, tools,\nsupplies and\nmaterials are\nprepared according to\nwork requirements\n1.4 Boundaries are laid-\nout and marked\nthrough reference\npoints\n1.5Site is prepared in\naccordance with\nestablished farm\npractices\n\n• Site\ncharacterization\n• Criteria for site\nselection\no physiography\no climate\no soil\no existing biotic\nvegetation\no water source/\nsupply\n• Species selection\n• Procedures in site\nselection\n• Species-site\nmatching\n• Procedures of\nspecies-site\nmatching\n• Prescribed\nprocedures in\ninterpreting plan\n• Plantation plan\ncomponents\n• Different types and\nuses of tools,\nequipment, supplies\nand materials\n• Preparation of tools\n• Procedures in\nmarking boundaries\n• Laying out and\nstaking procedures\n• Planting system\n• Digging procedure\n• Farm practices for\nbamboo production\nsite preparation\n• Performing\nspecies-site\nmatching\n• Performing site\ncharacterization for\nplantation operation\n• Interpreting\nplantation plan\n• Obtaining local\nweather information\n• Preparing different\ntools, equipment,\nsupplies and\nmaterial\n• Marking the\nboundary\n• Laying out and\nstaking required\nnumber of\npropagules of\nplanting area\n• Preparing site\n• Digging of planting\nholes\n\n--- PDF PAGE 38 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 34\n\n2. Plant bamboo\nstocks\n2.1 Planting is carried\nout according to\nprescribed farm\npractices\n2.2 Early tending\noperations are\nperformed based on\ncultural practices\n2.3 Safety measures are\npracticed following\nOSHS\n• Bamboo planting\nprocedures and\nstandards\n• Early tending\noperations\n• Cultural Practices\n• OSHS\n• Planting bamboo\n• Applying early\ntending operations\n• Practicing OSHS\ni.e. PPE\n3. Maintain and\nprotect bamboo\nfarm\n3.1 Schedule of\nmaintenance and\nprotection activities is\nfollowed according to\nwork requirement\n3.2 Maintenance activities\nare performed\naccording to\nestablished farm\npractices\n3.3 Monitoring checklist is\naccomplished based\non instructions of\nimmediate supervisor\n3.4 Remedial action is\nperformed based on\nthe instructions of\nimmediate supervisor\n3.5 Safety measures are\napplied following\nOSHS\n• Schedule of\nmaintenance\nactivity\n• Maintenance\nactivities\n• Monitoring checklist\n• Remedial actions\n• Safety measures in\nbamboo\nmaintenance and\nprotection farm\n• OSHS\n\n• Following schedule\nof maintenance\nactivities\n• Maintaining\nplantation\n• Accomplishing\nchecklist\n• Performing\nremedial action\n• Practicing OSHS\n\n4. Conduct post\nestablishment\noperation\n\n4.1 Maintenance of safe\nworking area is\nundertaken\nthroughout the\ncompletion of\nplantation operations\nfollowing\nenvironmental\nregulations\n4.2 Tools and equipment\nare maintained and\nstored according to\nmanufacturer’s\nmanual\n4.3 Excess supplies and\nmaterials are\ninventoried and\nstored based on\nstandard procedures\n4.4 Work activities and\noutputs are recorded\n• Procedures in\nmaintaining a safe\nplantation area\n• Environmental\nregulations\n• Proper tools and\nequipment to be\nused\n• Maintenance and\nstorage procedure\nof tools and\nequipment\n• Inventory and\nstorage of excess\nsupplies and\nmaterials\nprocedures\n• Record keeping\nand preparation of\nreport\n• Maintaining safe\nand clean area\n• Maintaining and\nstoring tools and\nequipment\n• Inventorying and\nstoring excess\nsupplies and\nmaterials\n• Keeping records\n• Preparing reports\n• Written and oral\nreporting\n\n--- PDF PAGE 39 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 35\n\nand reported to\nimmediate supervisor\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Equipment, tools, supplies and\nmaterials\nEquipment, tools, supplies and materials\nmay include:\n1.1 Equipment\n1.1.1 Mini-chain saw\n1.2 Tools\n1.2.1 Shovel\n1.2.2Digging bar\n1.2.3 Wheel barrow\n1.2.4 Post hole digger\n1.2.5 Sickle\n1.2.6 Bolo\n1.3 Supplies and materials\n1.3.1 PPE\n1.3.2 Office materials\n1.3.3 Insecticide\n1.3.4 Fertilizers\n1.3.5 Fuel\n1.3.6 Lubricants\n1.3.7 Stakes\n2. Site preparation\nSite preparation may include:\n2.1 Lay- outing of planting plan\n2.2 Staking\n2.3 Clearing\n3. Early tending operations\nEarly tending operations may include:\n3.1 Initial fertilizer application\n3.2 Mulching\n3.3 weeding\n3.4 replacement of dead planting materials\n4. Maintenance and protection activities\n\nMaintenance and protection activities may\ninclude:\n4.1 Removal of dead plants and replanting\n4.2 Weeding\n4.3 Soil cultivation and mounding\n4.4 Fertilizer application\n\n--- PDF PAGE 40 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 36\n\n4.5 Pruning of thickets\n4.6 Thinning of unhealthy culms\n4.7 protection from astray animals , fire, pest\nand diseases\n5. Record\nRecord includes:\n5.1 Work activities\n5.2 Work outputs\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nConduct pre-establishment activities\n1.2\nPlant bamboo stocks\n1.3\nMaintain bamboo farm\n1.4\nConduct post-establishment operation\n2. Resource Implications\nThe following resources should be provided:\n2.1 Bamboo farm/plantation site or simulated\nworkplace\n2.2 Equipment, tools, materials and supplies for\nbamboo farm establishment operation\n2.3 Protective Personal Equipment\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1\nDemonstration with questioning\n3.2\nWritten examination\n4. Context for Assessment\n4.1 Competency may be assessed in the work place\nor in a simulated work place setting\n\n--- PDF PAGE 41 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 37\n\nUNIT OF COMPETENCY\n: CONDUCT BAMBOO CLUMP REHABILITATION\nUNIT CODE\n:"
