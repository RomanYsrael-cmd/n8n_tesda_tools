ropagules may include: \n4.1 Culm cutting \n4.2 Branch cutting \n5 Prescribed criteria \nPrescribed criteria may include: \n5.1 Age of culms \n5.2 Portion of culms \n5.3 Size of propagules \n5.4 Season of collection \n5.5 Presence of plump buds \n6 Potting media \nPotting media includes ordinary garden soil mixed with any of the \nfollowing: \n6.1 Rice hull \n6.2 Saw dust \n6.3 Compost  \n6.4 coco coir  \n6.5 sand  \n7 Safety measures \n \nSafety measures may include: \n7.1 Wearing appropriate personal protective equipment   \n7.2 Handling tools \n7.3 Following instructions of manuals in equipment operation \n7.4 Awareness and control of various hazards of the operations      \n8 Pests and diseases \nPests and diseases may include: \n8.1 Pests \n8.1.1 Mealy bugs \n8.1.2 Mites \n8.1.3 Aphids \n8.2 Diseases \n8.2.1 Leaf rust  \n8.2.2 Leaf spot  \n8.2.3 Tip blight \n9 Fertilizers \nFertilizers may include: \n9.1. Organic Fertilizer \n9.2. Inorganic Fertilizer \n10 Grading standards \n \nGrading standards may include: \n10.1 Health \n10.2 Clump size (number of shoots) of stocks \n10.3 Presence of sprouts \n10.4 Developed root system \n11 Improvement of sub-\nstandard planting \nstocks \nImprovement of quality of sub-standard planting stocks may \ninclude but not limited to: \n11.1 Fertilizer application (Organic or inorganic) \n11.2 Watering \n11.3 Weeding\n\n--- PDF PAGE 36 ---\nTR Bamboo Production NC II  \n Promulgated December 18, 2017   \n 32\n \n \n \n \n \n \n11.4 Control of pests and diseases \n11.5 Hardening-off \n \n \n \n \n \nEVIDENCE GUIDE \n \n1.  Critical aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nConducted pre-nursery operation \n1.2 \nPerform nursery operation  \n1.3 \nMaintained nursery stocks  \n1.4 \nConducted post nursery operations \n2.  Resource \nImplications \nThe following resources should be provided: \n2.1  Nursery site or simulated workplace \n2.2  Equipment, tools, materials and supplies for nursery \