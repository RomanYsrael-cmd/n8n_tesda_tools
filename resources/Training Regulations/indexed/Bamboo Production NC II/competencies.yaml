al\ngrowth and\ndevelopment\n3.1\nTrainings and\ncareer opportunities\nare identified and\navailed of based on\njob requirements.\n3.2\nRecognitions are\nsought/received and\n• Ways of identifying\ntrainings and career\nopportunities\n• Techniques of\nseeking and receiving\nrecognitions\n• Identifying trainings\nand career\nopportunities\n• Seeking recognitions\nare sought/received\nand demonstrated as\n\n--- PDF PAGE 15 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 11\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ndemonstrated as\nproof of career\nadvancement.\n3.3\nLicenses and/or\ncertifications\nrelevant to job and\ncareer are obtained\nand renewed.\n• Procedures of\nobtaining licenses\nand/or certifications\nrelevant to the job\n\nproof of career\nadvancement\n• Obtaining and\nrenewing Licenses\nand/or certifications\nrelevant to job and\ncareer\n\n--- PDF PAGE 16 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 12\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and workshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 17 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 13\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n