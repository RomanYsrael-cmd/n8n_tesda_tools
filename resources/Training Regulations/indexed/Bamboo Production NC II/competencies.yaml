  "source_section_text": "SECTION 2.\nCOMPETENCY STANDARDS\n\nThis section gives the details of the contents of the basic, common and core units of\ncompetency required in BAMBOO PRODUCTION NC II.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY:\nPARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE:\n500311105\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is accessed\nfrom appropriate\nsources.\n1.2 Effective questioning,\nactive listening and\nspeaking skills are\nused to gather and\nconvey information.\n1.3 Appropriate medium is\nused to transfer\ninformation and ideas\n1.4 Appropriate non- verbal\ncommunication is used.\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and followed.\n1.6 Defined workplace\nprocedures for the\nlocation and storage of\ninformation are used.\n1.7 Personal interaction is\ncarried out clearly and\nconcisely.\n• Procedure of\ngathering workplace\ninformation\n• Techniques in\ngathering\ninformation\n• Effective methods of\nconveying\ninformation\n• Written\ncommunication\nmethods\n• Techniques in\nconveying\ncommunication\n• Different modes of\ncommunication\n• Organizational\npolicies\n• Communication\nprocedures and\nsystems\n• Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n• Gathering of\nworkplace\ninformation skills\n• Sourcing of\ninformation skills\n• Sorting of\ninformation skills\n• Obtaining workplace\ninformation skills\n• Conveying\nworkplace\ninformation skills\n• Gathering and\nproviding information\nin response to\nworkplace\nrequirements\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings are\nattended on time.\n2.2 Own opinions are\nclearly expressed and\nthose of others are\nlistened to without\ninterruption.\n2.3 Meeting inputs are\nconsistent with the\n• Effective\ncommunication\n• Different modes of\ncommunication\n• Written\ncommunication\n• Organizational\npolicies\n• Participating skills in\nworkplace meetings\nand discussions\n• Following simple\nspoken language\n• Completing work\nrelated documents\n• Estimating,\ncalculating and\n\n--- PDF PAGE 7 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 3\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nmeeting purpose and\nestablished protocols.\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner.\n2.5 Questions about simple\nroutine workplace\nprocedures and maters\nconcerning working\nconditions of\nemployment are asked\nand responded to.\n2.6 Meetings outcomes are\ninterpreted and\nimplemented.\n• Communication\nprocedures and\nsystems\n• Decorum in\nparticipating\nworkplace meetings\nand discussions\nrecording routine\nworkplace measures\n• Relating to people of\nsocial range in the\nworkplace\n• Gathering and\nproviding information\nin response to\nworkplace\nRequirements\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms\nrelating to conditions of\nemployment is\ncompleted accurately\nand legibly.\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments.\n3.3 Basic mathematical\nprocesses are used for\nroutine calculations.\n3.4 Errors in recording\ninformation on forms/\ndocuments are\nidentified and properly\nacted upon.\n3.5 Reporting requirements\nto supervisor are\ncompleted according to\norganizational\nguidelines.\n• Methods of\nmaking/completing\nwork related\ndocuments\n• Company standards\nand procedures in\nmaking work related\ndocuments\n• Effective\ncommunication\n• Different modes of\ncommunication\n• Written\ncommunication\n• Organizational\npolicies\n• Communication\nprocedures and\nsystems\n• Technology relevant\nto the enterprise and\nthe individual’s work\nresponsibilities\n• Documenting skills\n• Report writing skills\n• Making/developing\nwork related\ndocuments\n• Perform routine\nworkplace duties\nfollowing simple\nwritten notices\n• Completing work\nrelated documents\n• Estimating,\ncalculating and\nrecording routine\nworkplace measures\n• Ability to relate to\npeople of social\nrange in the\nworkplace\n\n--- PDF PAGE 8 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 4\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Appropriate sources\n1.1\nTeam members\n1.2\nSuppliers\n1.3\nTrade personnel\n1.4\nLocal government\n1.5\nIndustry bodies\n2. Medium\n2.1\nMemorandum\n2.2\nCircular\n2.3\nNotice\n2.4\nInformation discussion\n2.5\nFollow-up or verbal instructions\n2.6\nFace to face communication\n3. Storage\n3.1\nManual filing system\n3.2\nComputer-based filing system\n4. Forms\n4.1\nPersonnel forms, telephone message forms, safety reports\n5. Workplace interactions\n5.1\nFace to face\n5.2\nTelephone\n5.3\nElectronic and two way radio\n5.4\nWritten including electronic, memos, instruction and forms,\nnon-verbal including gestures, signals, signs and diagrams\n6. Protocols\n6.1\nObserving meeting\n6.2\nCompliance with meeting decisions\n6.3\nObeying meeting instructions\n\n--- PDF PAGE 9 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 5\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared written communication following standard format of\nthe organization\n1.2\nAccessed information using communication equipment\n1.3\nMade use of relevant terms as an aid to transfer information\neffectively\n1.4\nConveyed information effectively adopting the formal or\ninformal communication\n2. Resource Implications\nThe following resources MUST be provided:\n2.1\nFax machine\n2.2\nTelephone\n2.3\nWriting materials\n2.4\nInternet\n3. Methods of Assessment\nCompetency in this unit must be assessed through:\n3.1\nDirect Observation\n3.2\nOral interview and written test\n4. Context for Assessment\n4.1\nCompetency may be assessed individually in the actual\nworkplace or through accredited institution\n\n--- PDF PAGE 10 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 6\n\nUNIT OF COMPETENCY:\nWORK IN A TEAM ENVIRONMENT\nUNIT CODE:\n500311106\nUNIT DESCRIPTOR:\nThis unit covers the skills, knowledge and attitudes to identify\nrole and responsibility as a member of a team\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Describe team\nrole and scope\n1.1 The role and objective\nof the team is\nidentified from available\nsources of\ninformation.\n1.2 Team parameters,\nreporting relationships\nand responsibilities are\nidentified from team\ndiscussions and\nappropriate external\nsources.\n• Company\nvision/mission\nstatements\n• Company policies\nand employee code\nof conduct\n• Communication\nprocess\n• Team structure\n• Team roles\n• Group planning and\ndecision making\n• Communicating\nskills appropriately\nand consistent with\nthe culture of the\nworkplace\n• Adopting skills to\nteam role and scope\nof responsibilities\n2. Identify own\nrole and\nresponsibility\nwithin team\n2.1 Individual role and\nresponsibilities within\nthe team environment\nare identified.\n2.2 Roles and\nresponsibility of other\nteam members are\nidentified and\nrecognized.\n2.3 Reporting relationships\nwithin team and\nexternal to team are\nidentified.\n• Company\nvision/mission\nstatements\n• Company policies\nand employee code\nof conduct\n• Communication\nprocess\n• Team structure\n• Team roles\n• Group planning and\ndecision making\n• Methods and\ntechniques of role\nand responsibility\nidentification with a\nteam\n• Communicating\nskills appropriately\nand consistent with\nthe culture of the\nworkplace\n• Role and\nresponsibility\nidentification skills\n\n3. Work as a team\nmember\n3.1 Effective and\nappropriate forms of\ncommunications used\nand interactions\nundertaken with team\nmembers who\ncontribute to known\nteam activities and\nobjectives.\n3.2 Effective and\nappropriate\ncontributions made to\ncomplement team\nactivities and\n• Approaches of\ninteracting with team\nmembers\n• Types of\ncommunications\nused in effective\ninteraction with team\nmembers\n• Methods of working\nas a team\n• Techniques in\nworking as a team\n\n• Team working skills\n• Communicating\nskills appropriately\nand consistent with\nthe culture of the\nworkplace\n• Skills in observing\nprotocols when\nmaking reports\n• Using standard\nprocedures when\nmaking reports\n• Developing\nteamwork plans\n\n--- PDF PAGE 11 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 7\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\nobjectives, based on\nindividual skills and\ncompetencies and\nworkplace context.\n3.3 Observed protocols in\nreporting using\nstandard operating\nprocedures.\n3.4 Contribute to the\ndevelopment of team\nwork plans based on\nan understanding of\nteam’s role and\nobjectives and\nindividual\ncompetencies of the\nmembers.\nbased on team’s role\nand objectives\n\n--- PDF PAGE 12 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 8\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\n1.1\nWork activities in a team environment with enterprise or\nspecific sector\n1.2\nLimited discretion, initiative and judgment maybe demonstrated\non the job, either individually or in a team environment\n2. Sources of information\n2.1\nStandard operating and/or other workplace procedures\n2.2\nJob procedures\n2.3\nMachine/equipment manufacturer’s specifications and\ninstructions\n2.4\nOrganizational or external personnel\n2.5\nClient/supplier instructions\n2.6\nQuality standards\n2.7\nOHS and environmental standards\n3. Workplace context\n3.1\nWork procedures and practices\n3.2\nConditions of work environments\n3.3\nLegislation and industrial agreements\n3.4\nStandard work practice including the storage, safe handling\nand disposal of chemicals\n3.5\nSafety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 13 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 9\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nOperated in a team to complete workplace activity\n1.2\nWorked effectively with others\n1.3\nConveyed information in written or oral form\n1.4\nSelected and used appropriate workplace language\n1.5\nFollowed designated work plan for the job\n1.6\nReported outcomes\n2. Resource implications\nThe following resources MUST be provided:\n2.1\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2\nMaterials relevant to the proposed activity or tasks\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1\nObservation of the individual member in relation to the work\nactivities of the group\n3.2\nObservation of simulation and or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3\nCase studies and scenarios as a basis for discussion of issues\nand strategies in teamwork\n4. Context of assessment\n4.1\nCompetency may be assessed in workplace or in a simulated\nworkplace setting\n4.2\nAssessment shall be observed while task are being undertaken\nwhether individually or in group\n\n--- PDF PAGE 14 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 10\n\nUNIT OF COMPETENCY:\nPRACTICE CAREER PROFESSIONALISM\nUNIT CODE:\n500311107\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in promoting\ncareer growth and advancement\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2\nIntegrate\npersonal\nobjectives\nwith\norganization\nal goals\n1.1\nPersonal growth and\nwork plans are\npursued towards\nimproving the\nqualifications set for\nthe profession.\n1.2\nIntra and\ninterpersonal\nrelationships are\nmaintained in the\ncourse of managing\noneself based on\nperformance\nevaluation.\n1.3\nCommitment to the\norganization and its\ngoal is demonstrated\nin the performance of\nduties.\n• Work values and\nethics (Code of\nConduct, Code of\nEthics, etc.)\n• Company policies\n• Company operations,\nprocedures and\nstandards\n• Company\nmission/vision\nstatements\n• Ways of integrating\npersonal objectives\nwith organizational\ngoals\n\n• Integrating skills of\npersonal objectives\nwith organizational\ngoals\n• Pursuing personal\ngrowth and work\nplans\n• Demonstrating\ncommitment to the\norganization and its\ngoals\n• Intra and\nInterpersonal skills\n\n3\nSet and\nmeet work\npriorities\n2.1\nCompeting demands\nare prioritized to\nachieve personal,\nteam and\norganizational goals\nand objectives.\n2.2\nResources are\nutilized efficiently and\neffectively to manage\nwork priorities and\ncommitments.\n2.3\nPractices along\neconomic use and\nmaintenance of\nequipment and\nfacilities are followed\nas per established\nprocedures.\n• Company policies\n• procedures and\nstandards\n• Company and\ndepartmental goals\nand priorities\n• Managing priorities\nand commitments\n• Economic use and\nmaintenance of\nequipment and\nfacilities\n• Ways and means of\npracticing economic\nuse and maintenance\nof equipment and\nfacilities\n• Setting skills of work\npriorities\n• Meeting with work\npriorities\n• Intra and\nInterpersonal skills\n• Communication skills\n4\nMaintain\nprofessional\ngrowth and\ndevelopment\n3.1\nTrainings and\ncareer opportunities\nare identified and\navailed of based on\njob requirements.\n3.2\nRecognitions are\nsought/received and\n• Ways of identifying\ntrainings and career\nopportunities\n• Techniques of\nseeking and receiving\nrecognitions\n• Identifying trainings\nand career\nopportunities\n• Seeking recognitions\nare sought/received\nand demonstrated as\n\n--- PDF PAGE 15 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 11\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\ndemonstrated as\nproof of career\nadvancement.\n3.3\nLicenses and/or\ncertifications\nrelevant to job and\ncareer are obtained\nand renewed.\n• Procedures of\nobtaining licenses\nand/or certifications\nrelevant to the job\n\nproof of career\nadvancement\n• Obtaining and\nrenewing Licenses\nand/or certifications\nrelevant to job and\ncareer\n\n--- PDF PAGE 16 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 12\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Evaluation\n1.1 Performance Appraisal\n1.2 Psychological Profile\n1.3 Aptitude Tests\n2. Resources\n2.1 Human\n2.2 Financial\n2.3 Technology\n2.3.1 Hardware\n2.3.2 Software\n3. Trainings and career\nopportunities\n3.1 Participation in training programs\n3.1.1 Technical\n3.1.2 Supervisory\n3.1.3 Managerial\n3.1.4 Continuing Education\n3.2 Serving as Resource Persons in conferences and workshops\n4. Recognitions\n4.1 Recommendations\n4.2 Citations\n4.3 Certificate of Appreciations\n4.4 Commendations\n4.5 Awards\n4.6 Tangible and Intangible Rewards\n5. Licenses and/or\ncertifications\n5.1 National Certificates\n5.2 Certificate of Competency\n5.3 Support Level Licenses\n5.4\nProfessional Licenses\n\n--- PDF PAGE 17 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 13\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nAttained job targets within key result areas (KRAs)\n1.2\nMaintained intra - and interpersonal relationship in the course\nof managing oneself based on performance evaluation\n1.3\n