        "source_text": "500311108\nUNIT DESCRIPTOR:\nThis unit covers the outcomes required to comply with regulatory\nand organizational requirements for occupational health and\nsafety\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.\nIdentify\nhazards and\nrisks\n1.1 Safety regulations\nand workplace safety\nand hazard control\npractices and\nprocedures are clarified\nand explained based\non organization\nprocedures.\n1.2 Hazards/risks in the\nworkplace and their\ncorresponding\nindicators are identified\nto minimize or eliminate\nrisk to co-workers,\nworkplace and\nenvironment in\naccordance with\norganization\nprocedures.\n1.3 Contingency\nmeasures during\nworkplace accidents,\nfire and other\nemergencies are\nrecognized and\nestablished in\naccordance with\norganization\nprocedures.\n• Company workplace\nsafety regulations\n• Industry hazard\ncontrol practices and\nprocedures\n• Internationally\nrecognized OHS\nprocedures and\npractices and\nregulations\n• PPE types and uses\n• Personal hygiene\npractices\n• Hazards/risks\nidentification and\ncontrol\n• Threshold Limit Value\n- TLV\n• OHS indicators\n• Organization safety\nand health protocol\n• Safety consciousness\n• Health\nconsciousness\n• Clarifying and\nexplaining safety\nregulations and\nworkplace safety and\nhazard control\n• Identifying\nhazards/risks in the\nworkplace and their\ncorresponding\nindicators\n• Recognizing\ncontingency\nmeasures during\nworkplace accidents,\nfire and other\nemergencies\n• Practice of personal\nhygiene\n• Interpersonal skills\n• Communication skills\n2.\nEvaluate\nhazards\nand\nrisks\n2.1 Terms of maximum\ntolerable limits which\nwhen exceeded will\nresult in harm or\ndamage are identified\nbased on threshold\nlimit values (TLV).\n2.2 Effects of the hazards\nare determined.\n2.3 OHS issues and/or\nconcerns and identified\nsafety hazards are\nreported to designated\n• Methods of\nidentifying terms of\nmaximum tolerable\nlimits\n• Hazard effects\n• Reporting methods\non OHS\nissues/concerns\n• OHS procedures and\npractices and\nregulations\n• PPE types and uses\n• Identifying terms of\nmaximum tolerable\nlimits\n• Determining effects\nof hazards and risks\n• Reporting OHS\nissues and/or\nconcerns\n• Identifying safety\nhazards\n• Hazards/risks\nidentification and\ncontrol skills\n\n--- PDF PAGE 19 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 15\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\npersonnel in\naccordance with\nworkplace\nrequirements and\nrelevant workplace\nOHS legislation.\n• Hazards/risks\nidentification and\ncontrol\n• Threshold Limit Value\n-TLV\n• OHS indicators\n• Organization safety\nand health protocol\n• Safety consciousness\n• Health\nconsciousness\n• Interpersonal skills\n• Communication skills\n3.\nControl\nhazards and\nrisks\n3.1 Occupational Health\nand Safety (OHS)\nprocedures for\ncontrolling\nhazards/risks in\nworkplace are\nconsistently followed.\n3.2 Procedures for dealing\nwith workplace\naccidents, fire and\nemergencies are\nfollowed in accordance\nwith organization OHS\npolicies.\n3.3 Personal protective\nequipment (PPE) is\ncorrectly used in\naccordance with\norganization OHS\nprocedures and\npractices.\n3.4 Appropriate assistance\nis provided in the event\nof a workplace\nemergency in\naccordance with\nestablished\norganization protocol.\n• Ways of following\nOccupational Health\nand Safety (OHS)\nprocedures for\ncontrolling\nhazards/risks in\nworkplace\n• Ways of following\nprocedures for\ndealing with\nworkplace accidents,\nfire and emergencies\n• Types and use of\npersonal protective\nequipment (PPE)\n• OHS procedures and\npractices and\nregulations\n\n• Methods and\ntechniques in\nproviding appropriate\nassistance in the\nevent of a workplace\nemergency\n• Hazards/risks\nidentification and\ncontrol\n• Following\noccupational health\nand safety (OHS)\nprocedures for\ncontrolling\nhazards/risks in\nworkplace\n• Following procedures\nfor dealing with\nworkplace accidents,\nfire and emergencies\n• Using correctly\npersonal protective\nequipment (PPE)\n• Providing assistance\nin the event of a\nworkplace\nemergency in\naccordance with\nestablished\norganization protocol\n4.\nMaintain OHS\nawareness\n4.1 Emergency-related\ndrills and trainings\nare participated in as\nper established\norganization guidelines\nand procedures.\n4.2 OHS personal\nrecords are completed\nand updated in\naccordance with\nworkplace\nrequirements.\n• Participation\nprocedures in\nemergency-related\ndrills and trainings\n• Ways of completing\nand updating OHS\npersonal records\n• OHS procedures and\npractices and\nregulations\n• OHS indicators\n• Participating in\nemergency-related\ndrills and trainings\n• Completing and\nupdating OHS\npersonal records\n\n--- PDF PAGE 20 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 16\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nSafety regulations\nMay include but are not limited to:\n1.1\nClean Air Act\n1.2\nBuilding code\n1.3\nNational Electrical and Fire Safety Codes\n1.4\nWaste management statutes and rules\n1.5\nPhilippine Occupational Safety and Health Standards\n1.6\nDOLE regulations on safety legal requirements\n1.7\nECC regulations\n2. Hazards/risks\nMay include but are not limited to:\n2.1\nPhysical hazards – impact, illumination, pressure, noise,\nvibration, temperature, radiation\n2.2\nBiological hazards- bacteria, viruses, plants, parasites, mites,\nmolds, fungi, insects\n2.3\nChemical hazards – dusts, fibers, mists, fumes, smoke,\ngasses, vapors\n2.4\nErgonomics\n•\nPsychological factors – over exertion/ excessive force,\nawkward/static positions, fatigue, direct pressure, varying\nmetabolic cycles\n•\nPhysiological factors – monotony, personal relationship,\nwork out cycle\n3.\nContingency\nmeasures\nMay include but are not limited to:\n3.1\nEvacuation\n3.2\nIsolation\n3.3\nDecontamination\n3.4\n(Calling designed) emergency personnel\n4.\nPPE\nMay include but are not limited to:\n4.1\nMask\n4.2\nGloves\n4.3\nGoggles\n4.4\nHair Net/cap/bonnet\n4.5\nFace mask/shield\n4.6\nEar muffs\n4.7\nApron/Gown/coverall/jump suit\n4.8\nAnti-static suits\n5.\nEmergency-related\ndrills and training\n5.1\nFire drill\n5.2\nEarthquake drill\n5.3\nBasic life support/CPR\n5.4\nFirst aid\n5.5\nSpillage control\n5.6\nDecontamination of chemical and toxic\n5.7\nDisaster preparedness/management\n6.\nOHS personal\nrecords\n6.1\nMedical/Health records\n6.2\nIncident reports\n6.3\nAccident reports\n6.4\nOHS-related training completed\n\n--- PDF PAGE 21 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 17\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nExplained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2\nIdentified hazards/risks in the workplace and its corresponding\nindicators in accordance with company procedures\n1.3\nRecognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4\nIdentified terms of maximum tolerable limits based on threshold\nlimit value- TLV.\n1.5\nFollowed Occupational Health and Safety (OHS) procedures\nfor controlling hazards/risks in workplace\n1.6\nUsed Personal Protective Equipment (PPE) in accordance with\ncompany OHS procedures and practices\n1.7\nCompleted and updated OHS personal records in accordance\nwith workplace requirements\n2. Resource implications\nThe following resources MUST be provided:\n2.1\nWorkplace or assessment location\n2.2\nOHS personal records\n2.3\nPPE\n2.4\nHealth records\n3. Method of assessment\nCompetency in this unit may be assessed through:\n3.1\nPortfolio Assessment\n3.2\nInterview\n3.3\nCase Study/Situation\n4. Context of assessment\n4.1\nCompetency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 22 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 18\n\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nAPPLY SAFETY MEASURES IN FARM OPERATIONS\nUNIT CODE\n:"
