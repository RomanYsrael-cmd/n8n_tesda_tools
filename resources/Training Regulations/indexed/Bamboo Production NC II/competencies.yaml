        "source_text": "AFF611313\n\nUNIT DESCRIPTION\n: This unit covers the knowledge and skill required to undertake\npre-harvesting operations, perform harvesting operations and\ncarry-out post harvesting activities for poles and shoots.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized term are\nelaborated in the Range\nof Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1.Undertake pre-\nharvesting activities\n1.1Market transactions\nare performed\nfollowing common\nbusiness practices\nand market\ndemand\n1.2 Harvestable culms\nare selected based\non maturity\nindicators\n1.3Harvesting\nequipment, tools,\nsupplies and\nmaterials are\nprepared based on\nwork requirement\n1.4 Harvesting plan is\nprepared based on\nfarm records\n• Market transactions\n• Market demand\n• Computation of\nculm sizes using\nmetric system\n• Harvestable culms\n• Maturity indicators\n• Equipment, tools,\nsupplies and\nmaterials for\nharvesting\n• Harvesting plan\nand farm records\n\n• Negotiation skills\n• Performing market\ntransactions\n• Computing culm\nsizes\n• Selecting\nharvestable culms\n• Preparing\nequipment, tools,\nsupplies and\nmaterials\n• Preparing\nharvesting plan\n\n2.Perform harvesting\noperations\n2.1 Harvestable\nculms and shoots\nare cut using\nstandard\nharvesting\nprocedures\n2.2 Safety measures\nare observed\naccording to OSHS\n2.3 Harvested culms\nare prepared\nbased on farm\npractices\n\n• Harvesting\ntechniques\n• Standard\nharvesting\nprocedures\n• Proper tools and\nequipment to be\nused\n• Proper handling of\nequipment and\ntools\n• Characteristics of\nharvestable culms\nand shoots\n• Harvesting period:\no dry season for\nculms\n• Performing\nharvesting\noperations\n• Handling\nequipment and\ntools\n• Preparing\nharvested culms\n\n--- PDF PAGE 47 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 43\n\no toward the end\nof wet season\nfor shoots\no Preparation of\nharvested\nculms\n• OSHS\n3. Carry-out post\nharvesting activities\n3.1 Harvested culms\nare cut into desired\nsizes and quality\nbased on market\nrequirements\n3.2 Prophylactic\ntreatment is\napplied to prevent\ndiscoloration and\nother defects\nbased on buyer’s\nspecification\n3.3 Safety measures\nare observed\naccording to OSHS\n3.4 Harvested culms\nand shoots are\nhandled following\nfarm practices\n3.5 Poles are dried\naccording to\nproduct\nrequirement.\n3.6 Market transactions\nare completed\nbased on contract\n• Cutting techniques\n• Product\nrequirements\n• Prophylactic\ntreatment\n• Procedure and\nproper application\nof prophylactic\ntreatment\n• OSHS\n• Handling\nprocedures for\nharvested culms\nand shoots\n• Drying of poles\n• Basic computation\n• Marketing Contract\n• Cost of production\n\n• Cutting harvested\nculms into desired\nsizes and quality\n• Applying\nprophylactic\ntreatment\n• Observing safety\nMeasures\n• Computation Skills\n• Completing\nmarketing\ntransactions\n• Communication\nskills\n• Handling harvested\nculms and shoots\n• Computation of\nproduction cost\n\n--- PDF PAGE 48 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 44\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Market demand\nMarket demand may include:\n1.1 species\n1.2. culm age\n1.3 thickness of culm wall\n1.3. size (diameter and length)\n1.4 shoots\n2. Harvesting equipment, tools, supplies\nand materials\nHarvesting equipment, tools, supplies and materials\nmay include:\n2.1 Equipment\n2.1.1 Mini-chain saw\n2.2 Tools\n2.2.1 Pruning saw\n2.2.2 Pruning shears\n2.2.3 Lopping shears\n2.2.4 Bolo\n2.3 Supplies and materials\n2.3.1 PPE\n2.3.2 lubricants\n2.3.3 fuel\n2.3.4 rope\n\n3. Standard harvesting procedures\nStandard harvesting procedures includes:\n3.1 Manual Harvesting\n3.2 Mechanical harvesting\n4. Harvestable culms and shoots\nHarvestable culms and shoots may include but not\nlimited to:\n4.1 Culms\n4.1.1 Pale green to yellowish culm\n4.1.2 Absence of culm sheath\n4.1.3. Merchantable size\n4.2 Shoots\n4.2.1 Age\n4.2.2 Size\n4.2.3Species\n5. Preparation of harvested culms\nPreparation of harvested culms may include:\n5.1Letting the cut culm stand for 2 days to drain sap\n5.2Removal of branch\n5.3Removal of tops\n6. Prophylactic treatment\nProphylactic treatment includes:\n6.1 Spraying\n6.2 Dipping\n6.3 Soaking\n6.4 Sap replacement\n7. Drying of poles\nDrying of poles include:\n7.1 air and sun- drying\n7.2 kiln drying\n\n--- PDF PAGE 49 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 45\n\nEVIDENCE GUIDE\n\n1. Critical aspects of Competency\nAssessment evidence that the candidate:\n1.1 Undertook pre-harvesting operations\n1.2 Performed harvesting operations\n1.3 Carried-out post harvesting activities\n\n2. Resource Implications\nThe following resources should be provided:\n2.1 Bamboo harvesting and post-harvesting sites or\nsimulated workplaces\n2.2 Equipment, tools, materials and supplies for harvesting\nand post-harvesting operations.\n2.3 Protective Personal Equipment\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration with questioning\n3.2 Written examination\n\n4. Context for Assessment\n4.1 Competency may be assessed in the work place or in\na simulated work place setting\n\n--- PDF PAGE 50 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 46"
