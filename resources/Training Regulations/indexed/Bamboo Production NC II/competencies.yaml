          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Conduct pre-\nnursery operation  \n1.1 Site is selected based \non established \ncriteria. \n1.2 Nursery plan is \nfollowed according to \nprescribed procedures. \n1.3 Rooting facilities and \nnursery beds are \nprepared according to \nestablished farm \nprocedures. \n1.4Tools, equipment, \nsupplies and \nmaterials are prepared \naccording to work \nrequirements.  \n1.5 Site selected is \nsecured from stray \nanimals and \nunauthorized persons. \n1.6 Work output is reported \nto concerned authority \naccording to industry \npractices. \n Established criteria \nfor site selection \n Prescribed \nprocedures in \ninterpreting plan \n Nursery plan \ncomponents \n Different tools, \nequipment, supplies \nand materials \n Preparation of tools \nand equipment \no Inspection and \nsegregation of \ndefective tools \nand equipment \no Assembly and \nadjustment of \nequipment \n Preparation of report  \n \n Selecting site for \nnursery operation \n Interpreting nursery \nplan \n Preparing rooting \nfacilities and nursery \nbeds \n Preparing different \ntools, equipment, \nsupplies and \nmaterial \n Securing selected \nsite \n Written and oral \nreporting \n \n2. Perform nursery \noperation  \n2.1 Culms as source of \npropagules are \nselected from the \nclump based on the \nestablished criteria \n2.2 Propagules of required \nbamboo species are \ncollected and prepared \nbased on prescribed \ncriteria. \n2.3 Storage of \npropagules is done \nbased on established \nfarm practices. \n2.4 Rooting hormones are \napplied to propagules \nfollowing prescribed \ndosages.\n Rooting facilities and \nnursery beds \n Procedures in the \npreparation of rooting \nfacilities and nursery \nbed  \n Types and dosage \npreparation of rooting \nhormones \n Computation for \nconcentration of \nrooting hormones \n Application \nprocedures of rooting \nhormones \n Different containers \nand potting media \n Selecting culms as \nsource of \npropagules \n Collecting and \npreparing \npropagules \n Storing of \npropagules \n Computing for \nrooting hormones \nconcentration  \n Applying rooting \nhormones to \npropagules \n Rooting of \npropagules\n\n--- PDF PAGE 32 ---\nTR Bamboo Production NC II  \n Promulgated December 18, 2017   \n 28\n \n \n \n \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.5 Hormone treated \npropagules are rooted \nin pots and in rooting \nbed \n2.6 Propagules rooted in \nbed are potted in \ncontainers using \nrecommended potting \nmedia and placed in \nshaded nursery bed \n2.7 Nursery area is \nmaintained as clean \nand safe following \nworkplace procedures. \n2.8Safety measures are \npracticed according to \nOccupational Safety \nand Health Standard \n Potting procedures \n Maintenance of clean \nand safe area \no Unwanted \nvegetation  \no Waste disposal \no Environmental \nregulations \n OSHS \n Source of propagules \n Different types of soil \nand hull \n Physical and \nchemical components \nof potting media; \nnutrient requirements \n Potting of rooted \npropagules \n Mixing of potting \nmedia \n Maintaining clean \nand safe nursery \narea \n Practicing OSHS \n Selecting source of \npropagules \n3. Maintain nursery \nstocks \n3.1 Watering of nursery \nstocks is done \naccording to species \nrequirement   \n3.2 Weeding is done \naccording to cultural \nprocedures \n3.3 Pests and diseases \nare prevented and \ncontrolled using \nindustry standard \n3.4Fertilizers are applied \nbased on soil nutrient \nstatus and plant’s \nnutritional \nrequirements \n3.5 Hardening of nursery \nstocks is undertaken \naccording to \nprescribed procedures \n3.6 Safety measures are \npracticed according to \nindustry procedures. \n Moisture requirement \nof species \n Watering procedures \n Shading procedures \n Weed species \n Weeding procedures \