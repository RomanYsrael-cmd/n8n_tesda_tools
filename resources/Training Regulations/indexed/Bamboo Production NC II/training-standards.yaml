  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for BAMBOO PRODUCTION NC II\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools, materials and equipment; training facilities; and trainer’s qualification.\n\n3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of competency\nspecifically in the areas of mathematics, science/technology, communication/language\nand other academic subjects shall be contextualized. To this end, TVET providers shall\ndevelop a Contextual Learning Matrix (CLM) to accompany their curricula.\n\nCourse Title: BAMBOO PRODUCTION\nNC Level: NC II\n\nNominal Training Duration:\n20\nHours\nBasic Competencies\n65\nHours\nCommon Competencies\n110\nHours\nCore Competencies\nTotal:\n195\nHours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, skills and attitude on\nBamboo Production NC II in accordance with industry standards. This covers competencies\nthat a person must achieve in operatingbamboo nursery, establishing bamboo farm,\nconducting bamboo clump rehabilitation and conducting harvesting and post-harvesting\noperations.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 51 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 48\n\nBASIC COMPETENCIES\n(20 Hrs.)\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\ninformation\n• Describe Organizational policies\n\n• Group discussion\n• Oral evaluation\n• 4 Hours\n\n• Read:\n• Effective communication\n•\nLecture\n\n•\nWritten\nexamination\n\n• Written communication\n\n• Communication procedures and\nsystems\n\n• Identify:\n• Different modes of communication\n\n• Medium of communication\n\n• Flow of communication\n\n• Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n\n• Prepare different Types of question\n•\nDemonstration\n• Observation\n\n• Gather different sources of information\n\n• Apply storage system in establishing\nworkplace information\n\n--- PDF PAGE 52 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 49\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n• Demonstrate Telephone courtesy\n\n1.2 Complete relevant\nwork related documents\n• Describe Communication procedures\nand systems\n•\nGroup discussion\n• Oral evaluation\n\n• Read:\n• Meeting protocols\n•\nLecture\n• Written\nexamination\n\n• Nature of workplace meetings\n•\nLecture\n• Written\nexamination\n\n• Workplace interactions\n\n• Barriers of communication\n\n• Complete work related documents\n•\nDemonstration\n• Observation\n\n• Read instructions on work related\nforms/documents\n•\nLecture\n• Written\nexamination\n\n• Practice:\n•\nDemonstration\n• Observation\n\n• Estimate, calculate and record\nroutine workplace measures\n\n• Basic mathematical processes of\naddition, subtraction, division and\nmultiplication\n\n• Demonstrate office activities in:\n• workplace meetings and\ndiscussions scenario\n•\nRole play\n• Oral evaluation\n• Observation\n\n--- PDF PAGE 53 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 50\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n• Perform workplace duties scenario\nfollowing simple written notices\n•\nRole play\n• Oral evaluation\n• Observation\n\n• Follow simple spoken language\n•\nDemonstration\n• Observation\n\n• Identify the different Non-verbal\ncommunication\n•\nLecture\n• Written\nexamination\n\n• Demonstrate ability to relate to people\nof social range in the workplace\n•\nDemonstration\n• Observation\n\n• Gather and provide information in\nresponse to workplace requirements\n\n1.3 Participate in\nworkplace meeting\nand discussion\n• Identify:\no types of workplace documents and\nforms\n•\nLecture\n• Written\nexamination\n\no kinds of workplace report\n\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n\n• Read and follow instructions in applying\nbasic mathematical concepts\n\n• Follow simple spoken language\n•\nDemonstration\n• Observation\n\n• Demonstrate ability to relate to people\nof social range in the workplace\n•\nDemonstration\n• Observation\n\n• Gather and provide information in\nresponse to workplace requirements\n\n--- PDF PAGE 54 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 51\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a\nteam.\n• Describe the team role and scope\n•\nGroup discussion\n• Oral evaluation\n4 Hours\n\n• Read\no Definition of Team\n•\nLecture\n• Written\nexamination\n\no Difference between team and group\n\no Objectives and goals of team\n\n• Identify different sources of information\n\n2.2 Describe work as a\nteam\n• Describe team goals and objectives\n•\nGroup discussion\n• Oral evaluation\n\n• Perform in setting team goals and\nexpectations scenario\n•\nRole play\n• Oral evaluation\n• Observation\n\n• Identify\no individual role and responsibility\n•\nLecture\n• Written\nexamination\n\n• Practice Interacting effectively with\nothers\n•\nGroup discussion\n• Oral evaluation\n\n• Read:\n•\nLecture\n• Written\nexamination\n\no Fu