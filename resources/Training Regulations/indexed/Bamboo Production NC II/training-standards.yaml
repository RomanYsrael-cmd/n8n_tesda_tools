e\n• Discussion\n• Presentation\n• Demonstration\n• Hands-on\n• Written exam\n• Oral\nquestioning\n• Demonstration\n0.5 Hour\n\n--- PDF PAGE 87 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 84\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Role playing\n\n• Apply safety measures\n• Lecture\n• Practical\ndemonstration\n• Discussion\n• Oral\nquestioning\n• Written exam\n• Demonstration\n0.5 Hour\n\n--- PDF PAGE 88 ---\nTR- Bamboo Production NC II\nDecember 18, 2017\n84\n3.2 TRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be\nguided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written to\nindustry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities and their variations/\ncomponents may be adopted singly or in combination with other modalities when\ndesigning and delivering training programs:\n\n2.1.\nInstitution- Based:\n\nClassroom-based or school-based training conducted entirely within the school\nor center, with classroom and/or laboratory components.\n\n• Dual Training System (DTS)/Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\nDetails can be referred to the Implementing Rules and Regulations of the\nDTS Law and the TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, audio, video,\ncomputer technologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific guidelines on\nthis mode shall be issued by the TESDA Secretariat.\n\n--- PDF PAGE 89 ---\nTR- Bamboo Production NC II\nDecember 18, 2017\n85\n• Supervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\nthe deployment of trainees in the workplace is adhered to training programs\nagreed by the institution and enterprise and status and progress of trainees\nare closely monitored by the training institutions to prevent opportunity for\nwork exploitation.\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n 2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticeable\noccupation.\n\n• Informal Apprenticeship - is based on a training (and working) agreement\nbetween an apprentice and a master craftsperson wherein the agreement\nmay be written or oral and the master craftsperson commits to training the\napprentice in all the skills relevant to his or her trade over a significant\nperiod of time, usually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business. Training\nis integrated into the production process and apprentices learn by working\nalongside the experienced craftsperson.\n\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA Secretariat.\n\n2.3 Community-Based\n\nRefers to a short program conducted or coordinated by NGOs, LGUs,\ntraining centers and other TVET providers which are intended to address the\nspecific needs of a community. Such programs are usually conducted in informal\nsettings such as barangay hall, basketball courts and other available venues in a\ncommunity.\nPeer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n\n--- PDF PAGE 90 ---\nTR- Bamboo Production NC II\nDecember 18, 2017\n86\n3.3 TRAINEE ENTRY REQUIREMENTS:\n\nTrainees or students wishing to gain entry into this course should possess the\nfollowing requirements:\n\n• Able to read and write;\n• Able to communicate, both orally and in writing; and\n• Basic mathematical skills\n\n3.4 TOOLS, MATERIALS AND EQUIPMENT\n\nRecommended list of tools, equipment and materials for the training of 25 trainees for\nBAMBOO PRODUCTION NC II are as follows.\nUp-to-date tools, materials and equipment of equivalent functions can be used as\nalternatives.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\nOperate Bamboo Nursery\n12 pcs\nPruning shears\n2 units\nGrass cutter\n 25 sets\nPPE\n-hard hat\n-goggles\n-gloves\n-rubber boots\n-mask\n-farmer shirt\n\n25 pcs\nRain coats\n12 pcs