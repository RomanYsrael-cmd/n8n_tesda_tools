    "source_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThese standards are set to provide Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when designing\ntraining programs for BAMBOO PRODUCTION NC II\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools, materials and equipment; training facilities; and trainer’s qualification.\n\n3.1 CURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of competency\nspecifically in the areas of mathematics, science/technology, communication/language\nand other academic subjects shall be contextualized. To this end, TVET providers shall\ndevelop a Contextual Learning Matrix (CLM) to accompany their curricula.\n\nCourse Title: BAMBOO PRODUCTION\nNC Level: NC II\n\nNominal Training Duration:\n20\nHours\nBasic Competencies\n65\nHours\nCommon Competencies\n110\nHours\nCore Competencies\nTotal:\n195\nHours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, skills and attitude on\nBamboo Production NC II in accordance with industry standards. This covers competencies\nthat a person must achieve in operatingbamboo nursery, establishing bamboo farm,\nconducting bamboo clump rehabilitation and conducting harvesting and post-harvesting\noperations.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 51 ---\nTR Bamboo Production NC II\n Promulgated December 18, 2017\n 48\n\nBASIC COMPETENCIES\n(20 Hrs.)\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace\ninformation\n• Describe 