  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making judgments\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform to the standards expected at the workplace as expressed in relevant\ncompetency standards.\n\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1. NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n4.1.1 To attain the National Qualification of BAMBOO PEODUCTION NC II the\ncandidate must demonstrate competence through a project-type\nassessment covering in all units listed in Section 1. Successful candidates\nshall be awarded a National Certificate signed by the TESDA Director\nGeneral.\n4.1.2 The qualification of Bamboo Production NC II may be attained through\naccumulation of Certificates of Competency (COCs) in the following clusters of\ncompetencies:\n\nCOC 1:\nOperate bamboo nursery\nCOC 2:\nEstablish bamboo farm\nCOC 3:\nConduct bamboo clump rehabilitation\nCOC 4:\nConduct harvesting and post-harvesting operations\n\nUpon accumulation and submission of all COCs acquired, an individual shall\nbe issued the corresponding National Certificate\n\n4.1.3 Assessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n4.1.4 The following are qualified to apply for assessment and certification:\n4.1.4.1\nGraduating students/trainees of WTR-registered programs,\ngraduates of NTR programs or graduates of formal/non-\nformal/informal including enterprise-based trainings related to\nbamboo production.\n4.1.4.2 Experienced workers in bamboo industry\n4.1.5 Reassessment is allowed only after one month from the date of\nassessment. Reassessment for a National Certificate shall be done only on\nthe task/s that the candidate did not successfully achieve.\n4.1.6 A candidate who fails the assessment for two (2) consecutive times will be\nrequired to go through a refresher course before taking another\nassessment.\n4.1.7 Only certified individuals in this Qualification may be nominated by the\nindustry sector for accreditation as competency assessor.\n\n--- PDF PAGE 95 ---\nTR- Bamboo Production NC II\nDecember 18, 2017\n91\n\n4.2. . COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished\nby the candidate prior to actual competency assessment. SAG is a pre-\nassessment tool to help the candidate and the assessor determine what\nevidence is available, where gaps exist, including readiness for assessment.\nThis document can:\na) Identify the candidate’s skills and knowledge\nb) Highlight gaps in candidate’s skills and knowledge\nc) Provide critical guidance to the assessor and candidate on the evidence\nthat need to be presented\nd) Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Center accredited by\nTESDA is authorized to conduct competency assessment. Assessment\ncenters undergo a quality assured procedure for accreditation before they are\nauthorized by TESDA to manage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessor is\nauthorized to conduct assessment of competence. Competency assessors\nundergo a quality assured system of accreditation procedure before they are\nauthorized by TESDA to assess the competencies of candidates for National\nCertification.\n4.2.3.1\nQualification of Competency Assessors\n\nFor Trainer-Assessor\n• Holder of National TVET Trainer Certificate Level I (NTTC) in Bamboo\nProduction NC II with at least 2 years relevant industry experience for\nthe last five (5) years\nFor Industry-Assessor\n• Holder of National Certificate in Bamboo Production NCII\n• Holder of Certificate of Competency (COC) in Conduct Competency\nunder the Trainers Methodology Level I (TM I)\n• Must have at least 2 years relevant industry experience for the last\nfive (5) years\n\n--- PDF PAGE 96 ---\nTR- Bamboo Production NC II\n\nDecember 18, 2017\n92\n\nCOMPETENCY MAP –BAMBOO PEODUCTION NC II\n\nBASIC COMPETENCIES\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with others\nDemonstrate\nwork values\nPractice basic\nhousekeeping\nprocedures\nParticipate in\nworkplace\ncommunication\nWork in team\nenvironment\nPractice career\nprofessionalism\nPractice\noccupational health\nand safety\nprocedures\nLead workplace\ncommunication\nLead small team\nDevelop and\npractice\nnegotiation skills\nSolve problems\nrelated to work\nactivities\nUse mathematical\nconcepts and\ntechniques\nPractice\noccupational\nhealth and safety\nprocedures\nUtilize specialized\ncommunication skills\nDevelop teams\nand individuals\nApply problem\nsolving\ntechniques in\nthe workplace\nCollect, analyze\nand organize\ninformation\nPlan and organize\nwork\nPromote\nenvironmental\nprotection\nUse relevant\ntechnologies\n\nCOMMON COMPETENCIES\n\nApply Safety Measures in Farm\nOperations\nUse Farm Tools and Equipment\nPerform Estimation and Basic\nCalculation\n\nCORE COMPETENCIES\nOperate bamboo nursery\nEstablish bamboo farm\nConduct bamboo clump\nrehabilitation\nConduct harvesting and post-\nharvesting operations\n\n--- PDF PAGE 97 ---\nTR- Bamboo Production NC II\n December 2015\n\n 93\nGLOSSARY OF TERMS\n\n1. Branch cutting\n\nSegment of a branch with nodal rhizomatous bud used\nfor propagations\n2. Bud\nPotential shoot\n3. Clump\nCluster of bamboo stems growing from underground\nrhizome system\n4. Culm\nAbove ground stem which grows from the\nunderground rhizomes\n5. Culm cutting\nSegments of a culm having one or more buds used for\npropagations\n6. Early tending operations\nPreliminary activities(Initial fertilizer application,\nmulching, weeding and replacement of dead planting\nmaterials) for the first three years of plantation\n7. Hardening off\nPreparing the planting stocks for out planting\n8. Heeling – in\nThumping the soil around the planting stock\n9. Inorganic Fertilizer\nChemical or synthetic based fertilizers\n10. Kiln drying\nMethod of removing moisture from the culm using a\ndry kiln\n11.Manual Harvesting\nCutting of bamboo culms using simple tools\n12. Mechanical harvesting\n\nCutting of bamboo culms using equipment\n13.Mist propagation chamber\nControlled delivery of water in mist form\n14.Mounding\nPiling up of soils and organic debris around the clump\n15. Mulching\n\nProtective covering usually of organic matter to\nprevent moisture loss and growth of weeds\n16. Nursery bed\nLoosened soil where cuttings are rooted\n17.Nursery stocks\nbamboo propagules under nursery condition\n18.Organic Fertilizer\nNatural fertilizer\n19. OSHS\nOccupational Safety and Health Standards\n20.Planting stocks\nPropagules ready for out planting\n21. Pole\nCut culm\n22. PPE\nPersonal protective equipment\n23. Potting medium\nMixes of materials(soil plus saw dust, rice hull, etc.)\nused for growing plants in pots\n24.Propagules\nPlanting materials (stocks)\n25. Prophylactic\napplication of preservatives to the culm immediately\nafter harvesting\n26.Pruning\nCutting of unwanted branches\n27. Rhizome\nThick, horizontal bamboo stem\n28.Rooting facilities\nArea where propagules are rooted\n29. Rooting hormones\nChemicals that induce rooting\n30. Sap replacement\nMethod of applying preservatives by dipping the butt\nend of the freshly cut culms while the branches and\nleaves are intact\n31.Shoots\nYoung culm less than 30 days old\n32. Species-site matching\nCompatibility of species to a specific site\n33. Staking\nPutting stake as a guide in laying out of planting holes\n34.Weeding\nRemoval of unwanted vegetation\n35. 3Rs\nReduce, Reuse and Recycle\n\n--- PDF PAGE 98 ---\nTR- Bamboo Production NC II December 18, 2017 94\n\n TRAINING REGULATIONS (TR)\n DOCUMENT REVISION HISTORY\n\nQualification Title : Bamboo Production NC II\nQualification Code: __AFFBPN217______\n\nRevision\nNo.\n\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\n\nDeployment\nCircular\n00\nDocument Created –\nBamboo Production NCII\n\nNot Applicable\n\nTB No. 2017-52/\nDecember 18,\n2017\nTESDA Circular\nNo. __ s.___\n Legend: *Description Types\n-\nDocument Created\nDocument Amended\n\n--- PDF PAGE 99 ---\nTR- Bamboo Production NC II December 18, 2017 94\n\nACKNOWLEDGEMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies, non-government organizations including professional associations who\ndonated their time and expertise to the development and validation of these Training\nRegulations.\n\nTHE TECHNICAL EXPERT PANEL (TEP)\n\nMR. TYSON P. ESTANGKI\nTechnical Expert\nPhilippine Bamboo Foundation, Inc\nMakati City\nMR. ARMANDO M. PALIJON\nTechnical Expert\nPhilippine Bamboo Foundation, Inc\nMakati City\nMR. MICHAEL S. GOMEZ\nTechnical Expert\nPhilippine Bamboo Foundation, Inc\nMakati City\nMR. PRUDENCIO D. TEODORO\nTechnical Expert\nPhilippine Bamboo Foundation, Inc\nMakati City\nMS. AIDA B. LAPIS\nTechnical Expert\nPhilippine Bamboo Foundation, Inc\nMakati City\nMR. FLORENTINO O. TESORO\nTechnical Expert\nPhilippine Bamboo Foundation, Inc\nMakati City\nMR. EDGARDO C. MANDA\nTechnical Expert\nPhilippine Bamboo Foundation, Inc\nMakati City\nMR. FELIZARDO D. VIRTUCIO\nTechnical Expert\nPhilippine Bamboo Foundation, Inc\nMakati City\n\nTHE PARTICIPANTS OF NATIONAL VALIDATION\n\nLubao, Pampanga\nMr. MARIANO Y. GALARRITA\nLubao Bamboo Hub\nLubao, Pampanga\nMr