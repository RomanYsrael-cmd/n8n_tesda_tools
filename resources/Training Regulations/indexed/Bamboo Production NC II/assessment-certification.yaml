      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 To attain the National Qualification of BAMBOO PEODUCTION NC II the candidate must demonstrate competence through a project-type assessment covering in all units listed in Section 1. Successful candidates shall be awarded a National Certificate signed by the TESDA Director General. 4.1.2 The qualification of Bamboo Production NC II may be attained through accumulation of Certificates of Competency (COCs) in the following clusters of competencies: COC 1: Operate bamboo nursery COC 2: Establish bamboo farm COC 3: Conduct bamboo clump rehabilitation COC 4: Conduct harvesting and post-harvesting operations Upon accumulation and submission of all COCs acquired, an individual shall be issued the corresponding National Certificate 4.1.3 Assessment shall focus on the core units of competency. The basic and common units shall be integrated or assessed concurrently with the core units. 4.1.4 The following are qualified to apply for assessment and certification: 4.1.4.1 Graduating students/trainees of WTR-registered programs, graduates of NTR programs or graduates of formal/non- formal/informal including enterprise-based trainings related to bamboo production. 4.1.4.2 Experienced workers in bamboo industry 4.1.5 Reassessment is allowed only after one month from the date of assessment. Reassessment for a National Certificate shall be done only on the task/s that the candidate did not successfully achieve. 4.1.6 A candidate who fails the assessment for two (2) consecutive times will be required to go through a refresher course before taking another assessment. 4.1.7 Only certified individuals in this Qualification may be nominated by the industry sector for accreditation as competency assessor. TR- Bamboo Production NC II December 18, 2017"
    },
    {
      "number": "4.2",
      "text": ". COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre- assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior ` 4.2.2 Accredited Assessment Center. Only Assessment Center accredited by TESDA is authorized to conduct competency assessment. Assessment centers undergo a quality assured procedure for accreditation before they are authorized by TESDA to manage the assessment for National Certification. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. 4.2.3.1 Qualification of Competency Assessors For Trainer-Assessor • Holder of National TVET Trainer Certificate Level I (NTTC) in Bamboo Production NC II with at least 2 years relevant industry experience for the last five (5) years For Industry-Assessor • Holder of National Certificate in Bamboo Production NCII • Holder of Certificate of Competency (COC) in Conduct Competency under the Trainers Methodology Level I (TM I) • Must have at least 2 years relevant industry experience for the last five (5) years TR- Bamboo Production NC II December 18, 2017"
    }
