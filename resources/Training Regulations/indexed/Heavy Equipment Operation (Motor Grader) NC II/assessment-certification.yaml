  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1\nTo attain the National Qualification of HEAVY-EQUIPMENT OPERATION\n(Motor Grader) NC II, the candidate must demonstrate competence in all\nthe units of competency in Section 1. Successful candidates shall be\nawarded National Certificates signed by the TESDA Director General.\n\n4.2\nThe qualification of HEAVY EQUIPMENT OPERATION (Bulldozer) NC II\nmaybe attained through demonstration of competence in a project-type\nassessment covering the following core units. Candidates may apply for\nassessment in any accredited assessment center.\n\n4.2.1 Motor Grader operation\n\nPerform\npre-\nand\npost-operation\nfor\nearthmoving\nequipment\n\nPerform productive operation for motor grader\n\nPerform basic preventive-maintenance servicing for earth-\nmoving equipment\n\n4.3\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core\nunits.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and/or informal training including\nenterprise-based training programs\n\n4.4.2 Experienced Workers (wage-employed or self-employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in detail in\nthe Procedures Manual on Assessment and Certification and the\nGuidelines on the Implementation of the Philippine TVET Qualification and\nCertification System (PTQCS).\n\n--- PDF PAGE 79 ---\n\n--- PDF PAGE 80 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II Promulgated July 2007\nPage 79 of 83\n\n"
}
