        "source_title": "PERFORM PRODUCTIVE OPERATION FOR MOTOR GRADER",
        "source_text": "--- PDF PAGE 60 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II    Promulgated  December 2004/July 2007 \nPage 59 of 83  \n \nUNIT TITLE: \nPERFORM PRODUCTIVE OPERATION FOR \nMOTOR GRADER \nUNIT CODE:\nCON833306\nUNIT DESCRIPTOR: \nThis unit covers the outcomes required in clearing \ntopsoil, leveling, spreading, blue-tapping and similar \ngrading operations using Motor Grader equipment. \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  \nRange of Variables \n1. Perform loading of Motor \nGrader to low-bed trailer  \n \n \n \n \n \n1.1 Safe work practices are observed. \n1.2 Proper positioning of Motor Grader on the ramp \n      is observed.  \n1.3 Operator properly responding to the directions of \n      authorized signalman. \n1.4 Appropriate blade/attachment height is observed \n      prior to ramping of Motor Grader. \n1.5 Blade/attachment properly rested on trailer bed  \n      is observed. \n1.6 All safety locks, articulation pins and control  \n      levers are secured and set at required position  \n      before the trailer travels. \n1.7 Wheels and chassis/frame are secured with  \n      appropriate stopper blocks and binders. \n1.8 Unexpected situations are responded to in line  \n      with company rules and regulations in a manner  \n      that minimizes risk to personnel and equipment. \n2. Perform unloading equipment \nfrom trailer \n2.1 Binders, safety locks, pins and stopper blocks  \n      are fully dismantled and removed prior to  \n      unloading operation. \n2.2 Control and brakes are checked in line with  \n      safety procedure and prior to starting/moving the  \n      machine. \n2.3 Proper engine warm-up is observed in  \n      accordance with the manufacturer’s standards. \n2.4 Blade and attachments are properly raised  \n      before unloading from the trailer. \n2.5 Operator properly responding to the directions of \n      authorized signalman. \n2.6 Unexpected situations are responded to in line  \n      with company rules and regulations in a manner  \n      that minimizes risk to personnel and equipment.\n\n--- PDF PAGE 61 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II    Promulgated  December 2004/July 2007 \nPage 60 of 83  \n \n \nELEMENT \nPERFORMANCE CRITERIA \n3. Travel Motor Grader  \n3.1 Work area is surveyed for safe accessibility or  \n      presence of any potential hazards. \n3.2 Blade/attachment clearance is maintained at  \n      recommended height above ground during  \n      travel. \n3.3 Propulsion angle of 60 degrees of blade is \nobserved. \n3.4 Equipment is traveled in accordance with traffic  \n      rules and regulations.  \n3.5 Unexpected situations are responded to in line \nwith company rules and regulations in a manner \nthat minimizes risk to personnel and equipment. \n4. Perform grading operation \n4.1 Top soil is cleared or stripped in accordance to    \n       job requirements. \n4.2 Speed and blade propulsion angle are  \n      adjusted based on the type of earth materials. \n4.3 Leveling, spreading, side cutting, ditching, hi-    \n      bank cutting, ripping, scarifying are carried out  \n      according to job specifications. \n4.4 Blue-tapping operation is carried out according to  \n      job specifications. \n4.5 Mixing operation of earth materials is performed \n      in accordance to job specifications. \n4.6 Unexpected situations are responded to in line  \n      with company rules and regulations in a manner  \n      that minimizes risk to personnel and equipment.\n\n--- PDF PAGE 62 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II    Promulgated  December 2004/July 2007 \nPage 61 of 83  \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. Safe work \npractices \n1.1 Observed 3-point system in embarking on and alighting from  \n      equipment \n1.2 Safety awareness at all times \n1.3 Wear minimum PPE \n1.4 Housekeeping \n1.5 All controls must be set in neutral position and parking brake  \n      applied before alighting from Motor Grader  \n1.6 All implements/attachments are properly rested  \n2. Safety lock, \narticulation pins \nand control \nlevers \n \n2.1 Controls \n2.2 Travel \n2.3 Blade \n2.4 Attachment (ripper/scarifier) \n2.5 Steering \n3. Stopper block \nand binders \n3.1 Wood/lumber \n3.2 Metal \n3.3 Turnbuckles \n3.4 Shackle \n3.5 Chain sling \n4. Unexpected \nsituations \nMay include but not limited to: \n4.1 Collapse of unstable terrain \n4.2 Collapse of ramps/bridge \n4.3 Uneven surface e.g., manhole  \n4.4 Busted tires \n4.5 Busted hydraulic hose \n4.6 Engine breakdown \n4.7 Natural calamities e.g., flashfloods, landslide \n4.8 Situations arising from poor peace and order conditions\n\n--- PDF PAGE 63 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II    Promulgated  December 2004/July 2007 \nPage 62 of 83  \n \n \nVARIABLE \nRANGE \n5. Potential \nhazards \nMay include but not limited to: \n5.1 Other equipment \n5.2 Building \n5.3 Deep excavation \n5.4 Fog \n5.5 Electric wires/hi-tension wires \n5.6 Protruding nails/steel bars \n5.7 Boulders and rocks \n5.8 Muddy roads or unstable terrain \n5.9 Ravine \n5.10 Landslide  \n6. Recommended \nheight above \nground\n6.1 Maximum 30 cm for flat surface ground \n6.2 More than 30 cm depending on ground condition \n7. Speed \n7.1 Leveling and spreading operations (2nd – 3rd gear) \n7.2 Ditching and side cutting operations (1st – 2nd gear) \n8. Blade \npropulsion angle\n8.1 Loose earth materials – 90 degree \n8.2 Soft earth material – 60 degree \n8.3 Hard earth material – 45 degree \n9. Earth materials \nMay include but not limited to: \n9.1 Hard rock \n9.2 Clay \n9.3 Gravel \n9.4 Sand \n9.5 Lime \n9.6 Top soil \n9.7 Volcanic cinders \n9.8 Bituminous mixes\n\n--- PDF PAGE 64 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II    Promulgated  December 2004/July 2007 \nPage 63 of 83  \n \nEVIDENCE GUIDE \n1. Critical aspects \nof competency \nAssessment must confirm evidence that the candidate:  \n1.1 Demonstrates ability to operate Motor Grader  \n1.2 Demonstrates understanding of functions of gauges, controls  \n      and alert indicators \n1.3 Demonstrates ability to carry out safe work practices defined in \nrange of variables \n2. Underpinning \nknowledge and \nattitudes  \n \n2.1  Familiarity with basic road structures  \n2.2  Familiarity with soil and rock types and characteristics \n2.3  Familiarity with road construction stages/procedures \n2.4  Operating procedures and techniques \n2.5  Safety procedures and regulations  \n2.6  Controls, instruments, indicators and their uses \n2.7  Basic components, systems and functions  \n2.8  Comprehension of equipment operation and maintenance   \n       manual \n2.9  Company rules and regulations relevant to Motor Grader  \n       operation \n2.10 Defensive-driving and hazard-avoidance techniques \n2.11 Familiarity with site/terrain layout and obstacles \n2.12 Positive work values (time- and cost-conscious, etc.)  \n3. Underpinning \nskills \n3.1 Performing standard operating procedure of equipment  \n3.2 Reading and interpreting operation and maintenance manual \n3.3 Performing safety practices and safe operation \n3.4 Applying eye and hand coordination \n3.5 Following company rules and regulations relevant to Motor  \n      Grader operation \n3.6 Applying defensive-driving and hazard-avoidance techniques \n4.  Resource \nimplications \nThe following resources must be provided: \n4.1 Access to Motor Grader and work site/terrain \n4.2 Earth materials  \n4.3 Prime mover and trailer with ramp  \n4.4 Signal man \n4.5 Barricades and informative/safety signages\n\n--- PDF PAGE 65 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II    Promulgated  December 2004/July 2007 \nPage 64 of 83  \n \n \n5.  Method of \nassessment \nCompetency in this unit must be assessed through: \n5.1  Oral/written questioning \n5.2  Direct observation/ practical demonstration \n5.3  Work record and documents \n6.  Context for \nassessment \n6.1 Assessment may be conducted in the work site or in a  \n      simulated venue and in accordance with safe work practices.\n",
