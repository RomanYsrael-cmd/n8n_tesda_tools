      "definition": "1. Motor Grader Refers to an earthmoving equipment used to level, spread and scarify earth materials. 2. Blue-tapping Refers to precise and final grading of deep path holes. 3. Grading operation Refers to a process of leveling, spreading and scarifying/ripping of earth materials. 4. Scarifying and ripping operation Refers to a process of loosening hard earth materials. 5. Implement switch lock Refers to safety locking of all hydraulic implements. TR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II Promulgated July 2007"
