  "source_text": "Definition of Terms\n\nFor the purpose of this Competency Standard, the words\n\n1. Motor Grader\nRefers to an earthmoving equipment used to level, spread\nand scarify earth materials.\n2. Blue-tapping\nRefers to precise and final grading of deep path holes.\n3. Grading operation\nRefers to a process of leveling, spreading and\nscarifying/ripping of earth materials.\n4. Scarifying and ripping\noperation\nRefers to a process of loosening hard earth materials.\n5. Implement switch lock\nRefers to safety locking of all hydraulic implements.\n\n--- PDF PAGE 82 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II Promulgated July 2007\nPage 81 of 83"
