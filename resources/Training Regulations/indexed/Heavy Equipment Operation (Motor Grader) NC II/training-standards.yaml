    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational\nEducation and Training (TVET) providers with information and other important\nrequirements to consider when designing training programs for HEAVY-\nEQUIPMENT OPERATION (Motor Grader) NC II.\n\n 3.1 CURRICULUM DESIGN\n\nCourse Title : HEAVY-EQUIPMENT OPERATION - MOTOR GRADER\nNC Level:\nII\n\nBASIC COMPETENCIES\nNominal Training Hours:\n18 Hours (Basic) + 18 Hours (Common)\nCourse Description:\n\nThis course is designed to equip individual with the basic, common and\ncore competencies in Construction Sector particularly in Heavy-Equipment\nOperation – Motor Grader.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\n related documents\n1.3 Participate in\nworkplace meeting and\ndiscussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\n environment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a team\nmember.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 67 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II Promulgated December 2004/July 2007\nPage 66 of 83\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and safety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and risks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 68 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II Promulgated December 2004/July 2007\nPage 67 of 83\n\nCOMMON COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n1.2 Requisition\nMaterials\n1.3 Receive and inspect\nmaterials\nAudio Visual\nsimulation\nDiscussion\nPractical\nexercise\nDemonstration\n• Direct observation\n• Questions or\ninterview\n• Portfolio\n(credentials)\n• Written / Oral Test\n•\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals of\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n3. Interpret\nTechnical\nDrawing\n3.1 Analyze sign,\nsymbols and data\n3.2 Interpret technical\ndrawing and plans\n3.3 Apply freehand\nsketching\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n4. Perform\nmensurations\nand calculation\n4.1 Select measuring\ninstruments\n4.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n(able to impart\nknowledge and\nskills)\n\n--- PDF PAGE 69 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II Promulgated December 2004/July 2007\nPage 68 of 83\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Maintain tools\nand\nequipment\n5.1 Check condition of\ntools and\nequipment\n5.2 Perform basic\npreventive\nmaintenance\n5.3 Sharpen edge and\ntooth cutting tools\n5.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\n• Direct observation\nof application of\ntasks\n• Oral questioning\n• Written test or\nexamination\n• Third party report\n• Demonstration\n\n--- PDF PAGE 70 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II Promulgated December 2004/July 2007\nPage 69 of 83\n\nCORE COMPETENCIES\n\nCourse Title\n: HEAVY EQUIPMENT OPERATION Level: NC II\n\n MOTOR GRADER\n\nNominal Training Hours:\n120 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable attitudes\nand skills in the use of motor grader in accordance with industry standards. It\ncovers core competencies such as: performing pre- and post-operation\nprocedures, performing productive operation, and performing basic preventive-\nmaintenance servicing on a given motor grader.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform pre- and\n post-operation\n procedure for Motor\n Grader\n1.1 Identify motor grader\ntypes/components\nparts\n1.2 Perform visual check\nof equipment\n1.3 Check BLOWAF of\nMotor Grader\n1.3.1 Battery\n1.3.2 Light\n1.3.3 Oil\n1.3.4 Water\n1.3.5 Air\n1.3.6 Fuel\n1.4 Check motor grader\nsystems operation\n1.5 Check safety\ndevices &\naccessories\n1.6 Perform post\noperation check\nLecture\nPractical /\nDemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 71 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II Promulgated December 2004/July 2007\nPage 70 of 83\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Perform productive\noperation for Motor\nGrader\n2.1 Perform loading\n and unloading\n motor grader to\n and from trailer (low\n bed)\n\n2.2 Travel motor grader\n\n2.3 Perform grading\n operation\nLecture\nPractical /\nDemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n3. Perform basic\n preventive main -\n tenance servicing\n for Motor Grader\n3.1 Perform safety\npractices, and\nhousekeeping\n\n3.2 Perform preventive\nmaintenance and\nservicing\nLecture\nPractical /\nDemonstration\n\n• Observation /\nDemonstration\nand interview\n• Written test\n\n--- PDF PAGE 72 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II Promulgated December 2004/July 2007\nPage 71 of 83\n\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency\nstandards and the curriculum modules;\n• Assessment is based in the collection of evidence of the\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current\ncompetencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training modalities\nmay be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-school\nand in-industry training or fieldwork components. Details can be\nreferred to the Dual Training System (DTS) Implementing Rules\nand Regulations.\n• Modular/self-paced learning is a competency-based training\nmodality wherein the trainee is allowed to progress at his own\npace. The trainer facilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an\napproach in training designed to enhance the knowledge and\nskills of the trainee through actual experience in the workplace\n\n--- PDF PAGE 73 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II Promulgated December 2004/July 2007\nPage 72 of 83\n\nto acquire specific competencies prescribed in the training\nregulations.\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy correspondence study, or audio, video or computer\ntechnologies.\n\n3.3\n TRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements may also\nbe stated. Passing written entrance examinations may also be indicated if\nnecessary.\n\n• Can communicate both orally and in writing\n\n• Physically and mentally fit\n\n• With good moral character\n\n• Can perform basic mathematical computations.\n\n--- PDF PAGE 74 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II Promulgated December 2004/July 2007\nPage 73 of 83\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of 25\ntrainees for the operation of motor grader.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n1 set\n• Wrenches (box\nand open-end 8-\n24 mm- metric &\n7/16 –1” -English )\n1 unit\n• Motor\ngrader(MOA\n/rental)\n5 kls.\n• Multi- purpose\ngrease\n1 set\n• Hammer ballpeen\n(3-4 lbs)\n1 unit\n• Low bed trailer\nwith tractor head\n& operator\n(MOA/rental)\n4 liters • Engine oil (\nSAE 15w40)\n1 set\n• Pliers( mechanical\n10 “)\n1 unit\n• Vacuum cleaner\n20\nliters\n• Hydraulic /\nsteering fluid\n(TELLUS\n68/10W)\n1 pc\n\n• Adjustable wrench\n(18 “)\n1 unit\n• Portable electric\nair compressor\n10\nliters\n• Final drive/\ndifferential\n(gear oil\nGP90/ 140)\n1 pc\n• Grease gun\n\n10\nliters\n• Transmission\noil (ATF)\n\n10\nliters\n• Tandem oil\nGP90/140\n1 set\n• Screw driver ( 10 “\nflat & Philips)\n\n4 liters • Water coolant\n1 pc\n• Putty knife\n\n200\nliters\n• Diesel fuel\n1 pc\n• Pry bar (heavy\nduty)\n\n5 pcs\n• Battery\ndistilled water\n1 pc\n• Pipe wrench (12”)\n\n1 set\n• Primary &\nsecondary air\nfilter,\n1 pc\n• Vise grip (12 “)\n\n1 set\n• Primary\n&secondary\nfuel filter\n1 pc\n• Tire gauge\n\n1 pc\n• Water\nseparator\n\n--- PDF PAGE 75 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II Promulgated December 2004/July 2007\nPage 74 of 83\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nQTY\nQTY\n\n1 set\n• Belts (air-con,\nwater pump\nand alternator)\n\n2 cans\n• Penetrating oil\n(250 ml)\n\n2 kilos\n•Cotton rugs\n\n5 liters • Cleaning\nsolvent\n\n1 set\n• Cleaning\ntool(one each\nkind)\n\n1 pair\n• Working\nclothes\n\n10\npairs\n• Safety shoes\n\n10\npairs\n• Gloves\n\n10 pcs •Goggles\n\n10 pcs •Dust Mask\n\n10 pcs •Hard hats\n\n1 pc\n• Operator’s\n manual\n\n--- PDF PAGE 76 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II Promulgated December 2004/July 2007\nPage 75 of 83\n\n3.5\nTRAINING FACILITIES\n\nThe motor grader operation workshop must be made of reinforced\nconcrete or steel structure. The size must be suited on the requirements of the\ncompetencies. The class size of 25 students/trainees is reserved for the lecture\nroom and the practical demonstration area for carrying out minor motor grader\nparts maintenance. Most of the learning activities are performed individually in\nthe students/trainees’ work area.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\n• Student/Trainee’s Working\nSpace\n 2.0 x 2.0 m.\n4 sq.m per\nstudent\n100.0 sq.m.\n•\nLecture Room\n8.00 x 6.00\n48.00\n48.0\n•\nLearning Resource Center\n4.00 x 6.00\n24.00\n24.0\n172\n• Facilities/Equipment/\nCirculation Area\n-\n-\n52\nTOTAL WORK AREA\n-\n224\nWorking field\n0.5 hectare (MOA/Rental)\n\n--- PDF PAGE 77 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II Promulgated December 2004/July 2007\nPage 76 of 83\n\n 3.6 TRAINERS’ QUALIFICATION\n\nHEAVY-EQUIPMENT OPERATION (Motor Grader) NC II\n\nTRAINER QUALIFICATION (TQ II)\n• Must be a holder of Heavy-Equipment Operation (Motor Grader)\nNC-II or equivalent qualification\n• Must have undergone training on Training Methodology II (TM II)\nor equivalent training/experience\n• Must be computer-literate\n• Must be physically and mentally fit\n• Must have had at least 5 years job/industry experience*\n• Must be a civil-service eligible or holder of appropriate\nprofessional license issued by the Professional Regulatory\nCommission (for government position)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004-03\n\n--- PDF PAGE 78 ---\nTR HEAVY-EQUIPMENT OPERATION (Motor Grader) NC II Promulgated December 2004/July 2007\nPage 77 of 83"
