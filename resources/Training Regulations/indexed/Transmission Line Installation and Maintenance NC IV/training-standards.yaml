owledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2. The competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities and their\nvariations/components may be adopted singly or in combination with other\nmodalities when designing and delivering training programs:\n\n2.1.\nInstitution- Based:\n\n• Dual Training System (DTS)/ Dualized Training Program (DTP) which contain\nboth in-school and in-industry training or fieldwork components. Details can\nbe referred to the Implementing Rules and Regulations of the DTS Law and\nthe TESDA Guidelines on the DTP;\n\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same place.\nDistance learning may employ correspondence study, audio, video, computer\ntechnologies or other modern technology that can be used to facilitate\nlearning and formal and non-formal training. Specific guidelines on this mode\nshall be issued by the TESDA Secretariat.\n\n• The traditional classroom-based or in-center instruction may be enhanced\nthrough use of learner-centered methods as well as laboratory or field-work\ncomponents.\n\n--- PDF PAGE 82 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 78\n\n2.2.\nEnterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved\napprenticeable occupation.\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson wherein\nthe agreement may be written or oral and the master craftsperson\ncommits to training the apprentice in all the skills relevant to his or her\ntrade over a significant period of time, usually between one and four\nyears, while the apprentice commits to contributing productively to the\nwork of the business. Training is integrated into the production process\nand apprentices learn by working alongside the experienced\ncraftsperson.\n• Enterprise-based Training- where training is implemented within the\ncompany in accordance with the requirements of the specific company.\nSpecific guidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n2.3.\nCommunity-Based:\n\n• Community-Based – short term programs conducted by non-\ngovernment organizations (NGOs), LGUs, training centers and other\nTVET providers which are intended to address the specific needs of a\ncommunity. Such programs can be conducted in informal settings such\nas barangay hall, basketball courts, etc. These programs can also be\nmobile training program (MTP).\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThe trainees who wish to enter the course should possess the following\nrequirements:\n\n• A holder of Transmission Line Installation and Maintenance NC III\n• At least 3-yrs of relevant experience in transmission line installation,\nconstruction and maintenance\n• Able to communicate both oral and/or written (either in English or local\ndialect)\n• Must be physically fit\n\nThis list does not include specific institutional requirements, such as height\nand age requirements, educational attainment, appropriate work experience and\nothers that may be required from the trainees by the school or training center\ndelivering the TVET program.\n\n--- PDF PAGE 83 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 79\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nRecommended list of tools, equipment and materials for the training of\n\n20 trainees for Transmission Line Installation and Maintenance NC IV:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nITEM\nQTY\nITEM\nQTY\nITEM\n4\nMeasuring tape,\nopen reel, 150ft.\n1\nRange finder\n1\nream\nBond paper, A4\n4\nSteel tape, 5m\n2\nLaptop/desktop PC\n1\nStapler\n2\nCamera, 16Mpix, 50x\noptical zoom\n1\nPortable printer,\nLaserjet\n5\nWhiteboard marker,\nblack/blue\n1\nWhite board\n2\nWhiteboard eraser\n1\nmultimedia projector\n5\nPermanent marker\n20\nBallpen\n5\nmasking tape\n20\nPencil\n1\nPuncher\n\n5\nHighlighter/Marker,\nassorted color\n\nPPE\n20\nSample Maintenance\nOrder form\n\n20\nHard hat\n20\nSample toolbox\nmeeting form\n\n20\nSafety shoes\n20\nSample inspection\nchecklist\n20\nSafety goggles\n20\nWorking gloves\n20\nWorking clothes\n1\nFirst-aid kit set\n\n3.5\nTRAINING FACILITIES\n\nBased on class size of 20 students/trainees the space requirements for\n\nthe teaching/learning and circulation areas are as follows:\n\nTEACHING/LEARNING\nAREAS\nSIZE IN\nMETERS\nAREA IN SQ.\nMETERS\nQTY\nTOTAL AREA IN\nSQ. METERS\nLecture Area\n5 x 8\n40\n1\n40\nTraining Area\n10 x 12\n120\n1\n120\nLearning Resource Area\n4 x 5\n20\n1\n20\nTool Room / Storage Area\n4 x 5\n20\n1\n20\nWash ,Toilet & Locker\nRoom\n1 x 2\n2\n1\n2\n Total\n202\nFacilities / Equipment /\nCirculation**\n\n60\n Total Area\n\n262\n\n--- PDF PAGE 84 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 80\n\n** Area requirement is equivalent to 30% of the total teaching/learning areas\n\n3.6\nTRAINERS QUALIFICATIONS\n\n•\nHolder of National TVET Trainer’s Certificate (NTTC) Level 1 in\nTransmission Line Installation and Maintenance NC IV;\n•\nMinimum of five (5) years of work experience on transmission line\ninstallation, construction and maintenance within the last 10 years;\n•\nMust have completed the 40 hours Construction Occupational Safety\nand Health (COSH) Course per Department Order No. 13 s. 1998,\nGuidelines Governing Occupational Safety and Health in the\nConstruction Industry conducted by OSHC and DOLE accredited Safety\nTraining Organizations; and\n•\nMust be computer literate;\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued for each\nunit of competency. The institutional assessment is administered by the\ntrainer/assessor.\n\nThe result of the institutional assessment may be considered as evidence\nfor the assessment for national certification.\n\n--- PDF PAGE 85 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 81"
