  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n\nThis set of standards provides Technical and Vocational Education and Training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for Transmission Line Installation and Maintenance NC IV.\n\nThis includes information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification and\ninstitutional assessment.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula\nto enable training providers develop their own curricula with the components mentioned\nbelow.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title: Transmission Line Installation and Maintenance\nNC Level: NC IV\n\nNominal Training Duration:\n30 hrs – Basic Competencies\n\n60 hrs – Common Competencies\n\n 64 hrs – Core Competencies\n\n ------------\n\n 154 hrs - Total\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of a\ntransmission line foreman, in accordance with industry standards. It covers the basic and\ncommon competencies in addition to the core competencies such as planning of assigned\ntransmission line maintenance work, supervising transmission line maintenance works and\nconducting initial root cause analysis.\n\nTo obtain this, all units prescribed for this qualification must be achieved:\n\n--- PDF PAGE 61 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 57\n\nBASIC COMPETENCIES\n30 hrs\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1. Utilize\nspecialized\ncommunication\nskills\n\n1.1. Meet common and\nspecific\ncommunication\nneeds of clients\nand colleagues\n\n1.1.1. Read\n1.1.1.1. Communication process\n1.1.1.2. Dynamics of groups and\ndifferent styles of group\nleadership\n1.1.2. Identify different approaches to meet\nthe needs of clients and colleagues\n1.1.1. Lecture\n1.1.1. Written\nexamination\n1 hr.\n1.2. Contribute to the\ndevelopment of\ncommunication\nstrategies\n1.2.1. Apply communication skills to fulfill\njob roles as specified by the\norganization\n1.2.2. Apply communication techniques in\ncommunicating with clients and\ncolleagues\n1.2.2.1. Active listening\n1.2.2.2. Feedback\n1.2.2.3. Interpretation\n1.2.2.4. Role boundaries setting\n1.2.2.5. Negotiation\n1.2.2.6. Establishing empathy\n1.2.3. Describe strategies for internal and\nexternal dissemination of information\n1.2.1. Demonstration\n1.2.2. Group\ndiscussion\n1.2.1. Observation\n1.2.2. Oral\nevaluation\n1 hr.\n\n1.3. Represent the\norganization\n\n1.3.1. Describe criteria for a good\npresentation\n1.3.2. Prepare presentation material for\ninternal or external forums to promote\nthe organization\n1.3.3. Use appropriate media to enhance\nthe presentation\n1.3.1. Demonstration\n1.3.1. Observation\n1 hr.\n1.4. Facilitate group\ndiscussion\n1.4.1. Gather relevant information\n1.4.2. Apply values in facilitating differences\nin views\n1.4.1. Demonstration\n1.4.1. Observation\n1 hr.\n\n--- PDF PAGE 62 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 58\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n1.5. Conduct interview\n1.5.1. Describe communication strategies\nemployed in interview situations\n1.5.2. Conduct interview\n1.5.3. Apply organizations procedure in\nmaintaining records of interviews\n1.5.4. Use questioning, listening and\nnonverbal communication techniques\nto client groups\n1.5.1. Group\ndiscussion\n1.5.2. Demonstration\n1.5.1. Oral\nevaluation\n1.5.2. Observation\n1 hr.\n2. Develop teams\nand individuals\n2.1. Provide team\nleadership\n\n2.1.1. Lecture and discussion on:\n2.1.1.1. Coaching and mentoring\nprinciples\n2.1.1.2. working effectively with team\nmembers who have diverse\nwork styles, aspirations,\ncultures and perspective\n2.1.1.3. facilitating team development\nand improvement\n2.1.2. Read\n2.1.2.1. methods for identifying and\nprioritizing personal\ndevelopment opportunities\nand options\n2.1.2.2. methods and techniques for\neliciting and interpreting\nfeedback\n2.1.3. Apply communication skills in\nreceiving feedback and reporting,\nmaintaining effective relationships\nand conflict management\n2.1.1. Group\ndiscussion\n2.1.2. Lecture\n2.1.1. Oral\nevaluation\n2.1.2. Written\nexamination\n1 hr.\n\n2.1.4. Apply team leadership skills to\nsupport colleagues:\n2.1.4.1. Planning skills\n2.1.4.2. Coaching and mentoring skills\n2.1.4.3. Reporting skills\n2.1.4.4. Facilitation skills\n2.1.3. Group\ndiscussion\n2.1.3. Oral\nevaluation\n\n--- PDF PAGE 63 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 59\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n2.2. Foster individual\nand organizational\ngrowth\n2.2.1. Describe Learning and development\nprogram goals and objectives\n2.2.2. Apply learning delivery methods in\npreparing learning and program goals\nand objectives\n2.2.3. Identify and prioritize personal\ndevelopment opportunities and\noptions for career paths and\ncompetency standards in the industry\n2.2.1. Group\ndiscussion\n2.2.2. Demonstration\n2.2.3. Lecture\n2.2.1. Oral\nevaluation\n2.2.2. Observation\n2.2.3. Written\nexamination\n1 hr.\n2.3. Monitor and\nevaluate\nworkplace learning\n2.3.1. Use feedback system to identify and\nimplement future learning\narrangements improvements\n2.3.2. Assess and record outcomes and\nperformance of individuals/teams\n2.3.3. Negotiate learning plan modifications\nfor learning efficiency and\neffectiveness\n2.3.4. Maintain records and reports of\ncompetency\n2.3.1. Demonstration\n\n2.3.1. Observation\n\n1 hr.\n\n2.4. Develop team\ncommitment and\ncooperation\n2.4.1. Use open communication processes\nto obtain and share information by\nteam\n2.4.2. Apply decisions making skills in team\nagreed roles and responsibilities\n2.4.3. Demonstrate mutual concern and\ncamaraderie in the team\n2.4.1. Demonstration\n2.4.1. Observation\n1 hr.\n\n2.5. Facilitate\naccomplishment of\norganizational\ngoals\n2.5.1. Describe team activities and\ncommunication processes\n2.5.2. Apply individual and joint\nresponsibility with team members\n2.5.3. Prepare organizational goals in\ncollaboration with team members\n2.5.1. Group\ndiscussion\n2.5.2. Demonstration\n2.5.1. Oral\nevaluation\n2.5.2. Observation\n1 hr.\n\n--- PDF PAGE 64 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 60\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n3. Apply problem\nsolving\ntechniques in\nthe workplace\n(Critical\nthinking and\nproblem\nsolving\ntechniques)\n3.1. Analyze the\nproblem (Use\nsystem thinking)\n\n3.1.1. Describe\n3.1.1.1. organizational systems and\nfunctions\n3.1.1.2. help desk and maintenance\npractices\n3.1.2. Read\n3.1.2.1. hardware and software\nproducts\n3.1.2.2. operating system\n3.1.2.3. client business domain\n3.1.2.4. industry practices on\nescalation procedures\n3.1.2.5. diagnostic tools\n3.1.3. Video presentation on applying\nproblem solving techniques in the\nworkplace\n3.1.4. Apply in problem solving:\n3.1.4.1. Decision making skills\n3.1.4.2. Communication skills\n3.1.4.3. Teamwork\n3.1.4.4. Time management\n3.1.4.5. General customer service\nskills\n3.1.4.6. Questioning and active\nlistening\n3.1.5. Gather data for evaluated\nIssues/concerns\n3.1.1. Group\ndiscussion\n3.1.2. Lecture\n3.1.3. Video viewing\n3.1.4. Demonstration\n3.1.1. Written\nexamination\n3.1.2. Oral\nevaluation\n3.1.3. Observation\n2 hrs.\n3.1.6. Use problem solving tools/analytical\ntechniques to identify possible causes\nof problem\n\n--- PDF PAGE 65 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 61\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n3.2. Identify possible\nsolutions\n3.2.1. Apply possible options to consider in\npreparing:\n3.2.1.1. Resolution of the problem\n3.2.1.2. Strengths and weaknesses\n3.2.1.3. Corrective action\n3.2.1. Demonstration\n3.2.1. Observation\n1 hr.\n3.3. Recommend\nsolution to higher\nmanagement\n(Make judgment\nand decisions/\nSolve problems )\n3.3.1. Prepare documentation to\nappropriate personnel:\n3.3.1.1. communication or\ndocumentation Report\n3.3.1.2. Recommendations\n3.3.2. Coordinate follow-up if required\n3.3.1. Demonstration\n3.3.1. Observation\n1 hr.\n3.4. Implement solution\n3.4.1. Identify\n3.4.1.1. Measurable objectives\n3.4.1.2. Resource needs\n3.4.1.3. Timelines\n3.4.1. Lecture\n3.4.1. Written\nexamination\n1 hr.\n3.5. Evaluate/ Monitor\nresults and\noutcome\n3.5.1. Read evaluative assessment of\nproblem\n3.5.1. Evaluate results and outcome of\nproblem\n3.5.2. Prepare and submit\nrecommendations to superiors\n3.5.1. Demonstration\n3.5.3. Observation\n1 hr.\n4. Collect,\nAnalyze and\nOrganize\nInformation\n(access and\nevaluate\ninformation)\n4.1. Study information\nrequirements\n\n4.1.1. Describe\n4.1.1.1. Data processing, Information\nanalysis and interpretation\n4.1.2. Read\n4.1.2.1. Research methods:\n Qualitative\n Quantitative\n Statistical\n\n4.1.1. Group\ndiscussion\n4.1.2. Lecture\n4.1.3. Demonstration\n4.1.1. Oral\nevaluation\n4.1.2. Written\nexamination\n4.1.3. Observation\n1 hr.\n\n--- PDF PAGE 66 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 62\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nMethod\nNominal\nDuration\n\n4.1.2.2. Report writing\n4.1.2.3. Use of relevant software\n Spreadsheets\n Presentation graphics\n Work processor\n Statistical package\n4.1.3. Identify research procedures\n4.1.4. Use relevant forms and recording\nsystems to gather information\n4.1.5. Conduct survey / research to\nselected respondents based on\nestablished procedures\n\n4.2. Process data\n4.2.1. Use prescribed researched\nmethod in:\n4.2.1.1. Collecting data\n4.2.1.2. Referencing relevant data\n4.2.1.3. Compiling information in\nrequired form\n4.2.1. Demonstration\n4.2.1. Observation\n1 hr.\n4.3. Analyze, interpret\nand organize\n4.3.1. Prepare analysis of data using:\n4.3.1.1. relevant methodologies\n