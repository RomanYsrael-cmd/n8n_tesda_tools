  "source_text": "Section 1. Successful candidates shall be awarded a\nNational Certificate IV signed by the TESDA Director General.\n\n4.1.2. The Qualification of Transmission Line Installation and Maintenance NC\nIV may be attained through demonstration of competence through project-\ntype assessment covering all the units required.\n\n4.1.3. Assessment shall cover all competencies, with basic and common integrated\nor assessed concurrently with the core units of competency.\n\n4.1.4. Any of the following are qualified to apply for assessment and certification:\n\n4.1.4.1 Holder of national certificate for Transmission Line Installation and\nMaintenance NC III with at least 5 yrs. work experience in\ntransmission line installation, construction and maintenance.\n\n4.1.4.2 Graduate of formal training on Transmission Line Installation and\nMaintenance NC IV.\n\n4.1.4.3 Graduate of similar trainings provided by enterprise/s with at least 5\nyrs work experience in transmission line installation, construction\nand maintenance. He/she must have experience working in tasks\nrelated to “Emergency Restoration Structure (ERS)”.\n\n4.1.5 A person may also opt for Portfolio assessment with Interview if he/she\nhas at least 8 years of relevant work experience (within the last 10 years) in\ntransmission line installation, construction and maintenance. He/she must\nhave experience working in tasks related to “Emergency Restoration\nStructure (ERS)”.\n\nThe candidate must show sufficient evidences on the above requirements\nin his/her portfolio. Necessary documents to be submitted are: Certificate\nof Employment (indicating position, nature of work and period), Training\nCertificate/s (local or international) on transmission line installation,\n\n--- PDF PAGE 86 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 82\n\nconstruction and maintenance, line ranger program and other relevant\ntrainings.\n\n4.1.5. The guidelines on assessment and certification are discussed in detail in the\n\"Operating Procedures on Assessment and Certification\" and \"Guidelines\non the Implementation of the Philippine TVET Competency Assessment and\nCertification System (PTCACS)\".\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nSelf-Assessment\nGuide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\n\na.\nIdentify the candidate’s skills and knowledge\nb.\nHighlight gaps in candidate’s skills and knowledge\nc.\nProvide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd.\nAssist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior `\n\n4.2.2 Accredited Assessment Center. Only assessment center accredited by\nTESDA is authorized to manage the assessment activities of candidates\nfor national certification.\n\n4.2.3 Accredited Competency Assessor. Only competency assessor accredited\nby TESDA is authorized to assess the competencies of candidates for\nnational certification.\n\n--- PDF PAGE 87 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 83\n\nDEFINITION OF TERMS\n\nGENERAL\n\n1) Certification - is the process of verifying and validating the competencies of a\nperson through assessment\n\n2) Certificate of Competency (COC) – is a certification issued to individuals who\npass the assessment for a single unit or cluster of units of competency\n\n3) Common Competencies - are the skills and knowledge needed by all people\nworking in a particular industry\n\n4) Competency - is the possession and application of knowledge, skills and\nattitudes to perform work activities to the standard expected in the workplace\n\n5) Competency Assessment - is the process of collecting evidence and making\njudgments on whether competency has been achieved\n\n6) Competency Standard (CS) - is the industry-determined specification of\ncompetencies required for effective work performance\n\n7) Context of Assessment - refers to the place where assessment is to be\nconducted or carried out\n\n8) Core Competencies - are the specific skills and knowledge needed in a\nparticular area of work - industry sector/occupation/job role\n\n9) Critical aspects of competency - refers to the evidence that is essential for\nsuccessful performance of the unit of competency\n\n10) Elective Competencies - are the additional skills and knowledge required by\nthe individual or enterprise for work\n\n11) Elements - are the building blocks of a unit of competency. They describe in\noutcome terms the functions that a person performs in the workplace.\n\n12) Evidence Guide - is a component of the unit of competency that defines or\nidentifies the evidences required to determine the competence of the individual.\nIt provides information on critical aspects of competency, underpinning\nknowledge, underpinning skills, resource implications, assessment method and\ncontext of assessment\n\n13) Level - refers to the category of skills and knowledge required to do a job\n\n14) Method of Assessment - refers to the ways of collecting evidence and when,\nevidence should be collected\n\n--- PDF PAGE 88 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 84\n\n15) National Certificate (NC) – is a certification issued to individuals who achieve all\nthe required units of competency for a national qualification defined under the\nTraining Regulations. NCs are aligned to specific levels within the PTQF\n\n16) Performance Criteria - are evaluative statements that specify what is to be\nassessed and the required level of performance\n\n17) Qualification - is a cluster of units of competencies that meets job roles and is\nsignificant in the workplace. It is also a certification awarded to a person on\nsuccessful completion of a course in recognition of having demonstrated\ncompetencies in an industry sector\n\n18) Range of Variables - describes the circumstances or context in which the work\nis to be performed\n\n19) Recognition of Prior Learning (RPL) – is the acknowledgement of an individual’s\nskills, knowledge and attitudes gained from life and work experiences outside\nregistered training programs\n\n19) Resource Implication - refer to the resources needed for the successful\nperformance of the work activity described in the unit of competency. It includes\nwork environment and conditions, materials, tools and equipment\n\n20) Basic Competencies - are the skills and knowledge that everyone needs for work\n\n21) Training Regulations (TR) – refers to the document promulgated and issued by\nTESDA consisting of competency standards, national qualifications and training\nguidelines for specific sectors/occupations. The TR serves as basis for\nestablishment of qualification and certification under the PTQF. It also serves as\nguide for development of competency-based curricula and instructional materials\nincluding registration of TVET programs offered by TVET providers\n\n22) Underpinning Knowledge - refers to the competency that involves in applying\nknowledge to perform work activities. It includes specific knowledge that is\nessential to the performance of the competency\n\n23) Underpinning Skills - refers to the list of the skills needed to achieve the\nelements and performance criteria in the unit of competency. It includes generic\nand industry specific skills\n\n24) Unit of Competency – is a component of the competency standards stating a\nspecific key function or role in a particular job or occupation; it is the smallest\ncomponent of achievement that can be assessed and certified under the PTQF\n\n--- PDF PAGE 89 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 85\n\nSECTOR SPECIFIC\n\n1.\nACSR - abbreviation of Aluminum Cable Steel Reinforced, a cable type having\naluminum strands and a core of one or more steel strands. ACSR are primarily\nused for medium and high voltage lines and may also be used for overhead\nservices to individual customers.\n2.\nAnchor Rod – used for securing a machine, structure or part to masonry or other\nmaterial.\n3.\nBlock and Tackle - is a combination or set of single or several sheaved blocks\nused to obtain a mechanical advantage in handling heavy loads.\n4.\nCable Height Meter - to determine the height of overhead cables\n5.\nConductor – is a conductive material usually made of aluminum or copper used to\ncarry current along the overhead transmission line\n6.\nExtra High Voltage (Transmission) – over 230 kV, up to about 800 kV, used for\nlong distance, very high power transmission.\n7.\nFull Body Harness - form of protective equipment designed to protect a person\nfrom injury due to falling\n8.\nGrounding Cluster – used to protect personnel working in de-energized lines,\nfrom induced voltage, fault current feed, lightning strikes, erroneous switching &\naccidental contact with adjacent lines\n9.\nGround line maintenance work – refers to activities in the ground done by\ntransmission line personnel which do not require climbing activity\n10. Groundworks - a person working at ground level in support of a lineman working\noverhead.\n11. Guy Wire. The wire or cable normally used in a down guy is seven-strand\ngalvanized steel wire or seven-strand aluminum clad wire. Alum weld wire consists\nof steel wire strands coated with a layer of aluminum to prevent corrosion. Guy\nwire is used in various sizes with diameters from ¼ to 1 ¼ in.\n12. Guy-wire assembly -is a tensioned cable designed to add stability to structures\n(frequently ship masts, radio masts, wind turbines, utility poles, and tents). One\nend of the cable is attached to the structure, and the other is anchored to the\nground at a distance from the structure's base.\n13. Handline - used for lifting or lowering small objects and also for holding equipment\naway from the pole as it is being raised\n14. Hazard - a dangerous condition, potential or inherent, that can bring about an\ninterruption or interfere with the expected orderly progress of an activity. It is any\nwork materials, equipment, methods or practices that have the potential to cause\nharm to life, health, property or environment.\n15. Hazardous - an atmosphere that may expose employees to the risk of death,\natmosphere incapacitation, impaired ability to self-rescue unaided, injury, or acute\nillness.\n16. Hazardous atmospheres - include flammable gas, vapor, or mist, airborne\ncombustible dust, oxygen concentration below 19.5 percent or above 23.5 percent,\n\n--- PDF PAGE 90 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 86\n\nconcentrations of substances that exceed dose or permissible exposure limits, or\nother atmospheric condition immediately dangerous to life or health.\n17. High Voltage (Sub-transmission if 33-115kV and transmission if 115kV+) –\nbetween 33 kV and about 230 kV, used for sub-transmission and transmission of\nbulk quantities of electric power and connection to very large consumers.\n18. Hot Line Order - a statement with documentation from the Operations Supervisor\nto the Job Supervisor that specific work may be done on or near a line or other\nequipment without requiring that it be disconnected from all sources of energy. The\nequipment is to be considered energized or “hot.”\n19. Hotstick - an insulated stick, usually made of fiberglass, that is used to work\nenergized overhead conductors and operate electrical equipment that is overhead,\nunderground and pad mounted.\n20. Insulator - a device that is used to electrically isolate a conductor or electrical\ndevice from ground or a different electrical potential. Insulators must support the\nconductors and withstand both the normal operating voltage and surges due to\nswitching and lightning. Insulators are broadly classified as either pin-type, which\nsupport the conductor above the structure, or suspension type, where the\nconductor hangs below the structure. Up to about 33 kV (69 kV in North America)\nboth types are commonly used. At higher voltages only suspension-type insulators\nare common for overhead conductors. Insulators are usually made of wet-process\nporcelain or toughened glass, with increasing use of glass-reinforced polymer\ninsulators.\n21. Line to line clearance – refers to the distance of live conductors to another live\nconductor.\n22. Line to ground clearance - refers to the distance of live conductors to the ground\n23. Lineman - a payroll classification or title given a craftsperson whose duties include\nclimbing wood poles or steel structures to perform work on electric power\ntransmission and distribution circuits.\n24. Low voltage – less than 1000 volts, used for connection between a residential or\nsmall commercial customer and the utility.\n25. Medium Voltage (Distribution) – between 1000 volts (1 kV) and to about 33 kV,\nused for distribution in urban and rural areas.\n26. OHSAS 18001 – is a framework for an Occupational Health and Safety (OHS)\nManagement Systems and is part of the OHSAS 18000 series of standards, along\nwith OHSAS 18002.\n27. Overhead ground wire (OHGW) – is an electrical conductor which provides\nprotection to transmission lines against direct lightning strokes.\n28. Overhead power line - is an electric power transmission line suspended by towers\nor poles. Since most of the insulation is provided by air, overhead power lines are\ngenerally the lowest-cost method of transmission for large quantities of electric\npower. Towers for support of the lines are made of wood (as-grown or laminated),\nsteel (either lattice structures or tubular poles), concrete, aluminum, and\noccasionally reinforced plastics. The bare wire conductors on the line are generally\nmade of aluminum (either plain or reinforced with steel or sometimes composite\nmaterials), though some copper wires are used in medium-voltage distribution and\nlow-voltage connections to customer premises.\n\n--- PDF PAGE 91 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 87\n\n29. Personal Protective Equipment (PPE) - refers to protective clothing, helmets,\ngoggles, or other garment or equipment designed to protect line personnel from\njob-related occupational hazards\n30. Personal Protective Equipment (PPE) - the term shall include, but is not limited\nto, devices designed to be worn by workers for eye, face, head, respiratory, hand,\narm, body, leg, foot, and fall protection.\n31. Philippine Grid Code - establishes and documents the basic rules, requirements,\nprocedures and standards that govern the operation, maintenance and\ndevelopment of the high-voltage backbone transmission system in the Philippines\n(Republic Act No. 9136, also known as the “Electric Power Industry Reform Act of\n2001)\n32. Pole Dressing – refers to installation of structure components, such as cross\narms, insulators and etc.\n33. Pole Setting – refers to pole positioning, pole erection and pole facing.\n34. Pre-formed Armor Rod - a spiral-formed aluminum rod, a group of which is\nplaced around a conductor at the point of suspension to minimize vibration and to\nprotect the conductor from burning in case of a flashover.\n35. Reeving - The operation of passing the rope around the sheaves of blocks.\n36. Rigging – is the term used to described the process of moving/lifting both heavy\nand light loads using rope, blocks, and other special equipment.\n37. Right of way (ROW) – the legal right, established by usage or grant, to pass along\na specific route through grounds or property belonging to another.\n38. Risks - a probability or threat of damage, injury, liability, loss or any other negative\noccurrence that is caused by external or internal vulnerabilities, and that may be\navoided through preemptive action.\n39. Slings - provide a method of attaching rigging tools to structures or equipment.\nThey can be made of rope, webbing or steel. Some slings are made with a\ncontinuous loop while others are made with an eye on each end.\n40. Slope Protection – The protection of an embankment slope against wave action\nor erosion.\n41. Tag Line - A rope used to control the position of equipment being lifted. This is not\nto be confused with the rope used to actually lift the equipment.\n42. Transmission line - is the material medium or structure that forms all or part of a\npath from one place to another for directing the transmission of energy, such as\nelectromagnetic waves or acoustic waves, as well as electric power transmission.\nComponents of transmission lines include wires, coaxial cables, dielectric slabs,\noptical fibers, electric power lines, and waveguides.\n43. Ultra High Voltage – higher than 800 kV.\n44. Vibration Damper - a device used to dissipate the vibration of conductors on a\ntransmission line.\n45. Voltage Detector- is a sensor used to detect presence of electricity in a wire.\n\n--- PDF PAGE 92 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 88\n\nANNEX A - COMPETENCY MAP\n\nTRANSMISSION LINE INSTALLATION & MAINTENANCE NC IV COMPETENCY MAP\n\nBASIC COMPETENCIES\n\nReceive and Respond to\nWorkplace\nCommunication\nWork with Others\nDemonstrate work\nvalues\nPractice basic\nhousekeeping\nprocedures\nParticipate in Workplace\nCommunication\nWork in a Team Environment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nLead Workplace\nCommunication\nLead Small Working\nTeams\nDevelop and Practice\nNegotiating Skills With\nTeam Members\nGuide Effective Solutions to\nProblems Arising from Work\nActivities\nCheck and Develop the Use of\nMathematical Concepts &\nTechniques\nUse Relevant Technologies\nApplicable to Assigned\nWork\nLead in Utilizing\nSpecialized\nCommunication Skills\nAssist in Developing\nTeam and\nIndividuals\nApply Problem\nSolving Techniques\nin the Workplace\nCollect, analyze and\norganize\ninformation\nPlan and Organize\nWork for Several\nWorking Teams\nPromote Environmental\nProtection\n\nCOMMON COMPETENCIES\n\nApply quality standards\nComply with\nenvironmental protection\nprocedures\nObserve procedures,\nspecifications and manual\nof instruction\nOperate and Maintain T/L\ntools and equipment\nOperate a personal\ncomputer\n\nCORE COMPETENCIES\n\nTender Diesel Engine\nOperate Diesel Power\nplant\nMaintain and Repair Diesel\nEngine Systems and\nAlternator\nService Alternator/\nGenerator\nDiagnose and Repair\nDiesel Engine\nDiagnose and Repair\nElectrical System\nOverhaul Diesel Engine\nPerform transmission line pole\nerection\nPerform overhead\ntransmission line work\nPerform cold-line\nmaintenance work\nPerform live-line\nmaintenance work\nPerform ground line\nmaintenance work\nPlan transmission line\nmaintenance job\nInstall emergency\nrestoration structure\n(ERS)\nInspect/Assess transmission\nline components’ conditions\nImplement transmission\nline maintenance works\nInspect transmission line,\npoles, towers and\nappurtenances\nErect distribution line\npoles\nClimb pole and install\npole assembly/conductors\nInstall distribution line\nequipment and devices\nInstall consumer service\nconnection facility\nConduct initial root cause\nanalysis\nPerform ground\ntransmission line works\nPerform overhead\nmaintenance works\nInstall/construct new\ntransmission line\nstructures\nPerform overhead\ntransmission line works\n\nInstall emergency\nrestoration structure (ERS)\nPerform earth/ground\nresistance testing\n\nPlan assigned\nmaintenance work\nSupervise\ntransmission line\nmaintenance work\n\n--- PDF PAGE 93 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 89\n\n TRAINING REGULATIONS (TR)\n DOCUMENT REVISION HISTORY\n\nQualification Title : Transmission Line Installation and Maintenance NC IV\nQualification Code: UTLTXL417\n\nRevision\nNo.\n\nDocument\nDescription Types*\nReplaces Version\n(TESDA Board\nResolution No./\nDate)\nNew Version\n(TESDA Board\nResolution No./\nDate)\n\nDeployment\nCircular\n00\nDocument Created –\nTransmission Line\nInstallation and\nMaintenance NC III\n\nNot Applicable\nTB No. 2008-35/\nDecember 18, 200