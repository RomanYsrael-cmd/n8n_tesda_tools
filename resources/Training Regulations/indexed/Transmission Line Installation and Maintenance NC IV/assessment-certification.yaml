  "source_text": "SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment is to\nconfirm that an individual can perform to the standards expected at the workplace as\nexpressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to an employable unit(s)\nof competency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1. To attain the National Qualification of the Transmission Line Installation\nand Maintenance NC IV, the candidate must demonstrate competence in\nall the units listed in Section 1. Successful candidates shall be awarded a\nNational Certificate IV signed by the TESDA Director General.\n\n4.1.2. The Qualification of Transmission Line Installation and Maintenance NC\nIV may be attained through demonstration of competence through project-\ntype assessment covering all the units required.\n\n4.1.3. Assessment shall cover all competencies, with basic and common integrated\nor assessed concurrently with the core units of competency.\n\n4.1.4. Any of the following are qualified to apply for assessment and certification:\n\n4.1.4.1 Holder of national certificate for Transmission Line Installation and\nMaintenance NC III with at least 5 yrs. work experience in\ntransmission line installation, construction and maintenance.\n\n4.1.4.2 Graduate of formal training on Transmission Line Installation and\nMaintenance NC IV.\n\n4.1.4.3 Graduate of similar trainings provided by enterprise/s with at least 5\nyrs work experience in transmission line installation, construction\nand maintenance. He/she must have experience working in tasks\nrelated to “Emergency Restoration Structure (ERS)”.\n\n4.1.5 A person may also opt for Portfolio assessment with Interview if he/she\nhas at least 8 years of relevant work experience (within the last 10 years) in\ntransmission line installation, construction and maintenance. He/she must\nhave experience working in tasks related to “Emergency Restoration\nStructure (ERS)”.\n\nThe candidate must show sufficient evidences on the above requirements\nin his/her portfolio. Necessary documents to be submitted are: Certificate\nof Employment (indicating position, nature of work and period), Training\nCertificate/s (local or international) on transmission line installation,\n\n--- PDF PAGE 86 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 82\n\nconstruction and maintenance, line ranger program and other relevant\ntrainings.\n\n4.1.5. The guidelines on assessment and certification are discussed in detail in the\n\"Operating Procedures on Assessment and Certification\" and \"Guidelines\non the Implementation of the Philippine TVET Competency Assessment and\nCertification System (PTCACS)\".\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n\n4.2.1 Self-Assessment\nGuide.\nThe\nSelf-Assessment\nGuide\n(SAG)\nis\naccomplished by the candidate prior to actual competency assessment.\nSAG is a pre-assessment tool to help the candidate and the assessor\ndetermine what evidence is available, where gaps exist, including\nreadiness for assessment.\n\nThis document can:\n\na.\nIdentify the candidate’s skills and knowledge\nb.\nHighlight gaps in candidate’s skills and knowledge\nc.\nProvide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd.\nAssist the candidate to identify key areas in which practice is needed\nor additional information or skills that should be gained prior `\n\n4.2.2 Accredited Assessment Center. Only assessment center accredited by\nTESDA is authorized to manage the assessment activities of candidates\nfor national certification.\n\n4.2.3 Accredited Competency Assessor. Only competency assessor accredited\nby TESDA is authorized to assess the competencies of candidates for\nnational certification.\n\n--- PDF PAGE 87 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 83\n\n"
