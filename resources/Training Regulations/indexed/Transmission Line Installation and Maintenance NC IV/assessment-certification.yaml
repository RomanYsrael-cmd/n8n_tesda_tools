      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1. To attain the National Qualification of the Transmission Line Installation and Maintenance NC IV, the candidate must demonstrate competence in all the units listed in Section 1. Successful candidates shall be awarded a National Certificate IV signed by the TESDA Director General. 4.1.2. The Qualification of Transmission Line Installation and Maintenance NC IV may be attained through demonstration of competence through project- type assessment covering all the units required. 4.1.3. Assessment shall cover all competencies, with basic and common integrated or assessed concurrently with the core units of competency. 4.1.4. Any of the following are qualified to apply for assessment and certification: 4.1.4.1 Holder of national certificate for Transmission Line Installation and Maintenance NC III with at least 5 yrs. work experience in transmission line installation, construction and maintenance. 4.1.4.2 Graduate of formal training on Transmission Line Installation and Maintenance NC IV. 4.1.4.3 Graduate of similar trainings provided by enterprise/s with at least 5 yrs work experience in transmission line installation, construction and maintenance. He/she must have experience working in tasks related to “Emergency Restoration Structure (ERS)”. 4.1.5 A person may also opt for Portfolio assessment with Interview if he/she has at least 8 years of relevant work experience (within the last 10 years) in transmission line installation, construction and maintenance. He/she must have experience working in tasks related to “Emergency Restoration Structure (ERS)”. The candidate must show sufficient evidences on the above requirements in his/her portfolio. Necessary documents to be submitted are: Certificate of Employment (indicating position, nature of work and period), Training Certificate/s (local or international) on transmission line installation, construction and maintenance, line ranger program and other relevant trainings. 4.1.5. The guidelines on assessment and certification are discussed in detail in the \"Operating Procedures on Assessment and Certification\" and \"Guidelines on the Implementation of the Philippine TVET Competency Assessment and Certification System (PTCACS)\"."
    },
    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE 4.2.1 Self-Assessment Guide. The Self-Assessment Guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre-assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a. Identify the candidate’s skills and knowledge b. Highlight gaps in candidate’s skills and knowledge c. Provide critical guidance to the assessor and candidate on the evidence that need to be presented d. Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior ` 4.2.2 Accredited Assessment Center. Only assessment center accredited by TESDA is authorized to manage the assessment activities of candidates for national certification. 4.2.3 Accredited Competency Assessor. Only competency assessor accredited by TESDA is authorized to assess the competencies of candidates for national certification."
    }
