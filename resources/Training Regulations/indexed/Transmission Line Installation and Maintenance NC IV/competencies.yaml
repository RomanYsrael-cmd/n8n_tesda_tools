        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Analyzed the problem\n1.2. Identified possible solutions\n1.3. Implemented solutions\n1.4. Recommended solutions to higher management\n1.5. Outcome evaluated/monitored\nEvidence of satisfactory performance in this unit can be\nobtained by observation of performance and questioning\nto indicate knowledge and understanding of the elements\nof the competency and performance criteria.\n2. Resource\nImplications\nAssessment will require access to an operating plant\nover an extended period of time, or a suitable method of\ngathering evidence of operating ability over a range of\nsituations. A bank of scenarios/case studies/what ifs will\nbe required as well as bank of questions which will be\nused to probe the reasoning behind the observable\nactions.\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\nThrough direct observation of application to tasks and\nquestions related to underpinning knowledge\nUnder general guidance, checking various stages of\noperation and at the completion of the activity against\nperformance criteria and specifications\n\n4. Context for\nAssessment\n4.1. Competency may be assessed in the work place or\nin a simulated work place setting\n4.2. Assessment shall be carried out through TESDA’s\nAccredited Assessment Centers/Venues while\ntasks are undertaken either individually or as part\nof a team under limited supervision\n\n--- PDF PAGE 19 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 15\n\nUNIT OF COMPETENCY : COLLECT, ANALYZE AND ORGANIZE INFORMATION\n(Access and evaluate information)\n\nUNIT CODE :"
        },
