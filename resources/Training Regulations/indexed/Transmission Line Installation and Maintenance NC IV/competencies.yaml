antitative \n2.2.3. Statistical \n2.3. Report writing \n \n2.1. Communicating \neffectively \n2.2. Performing \nresearch \n2.3. Reading / \ninterpreting data \nand information \n2.4. Problem solving \n3. Analyze, interpret \nand organize \ninformation \ngathered \n3.1. Data are analyzed using \nrelevant   methodologies \n3.2. Where applicable, \nstatistical analysis/ \nmethods are employed  \naccording to the objectives \nof the program \n3.3. Graphs and other visual \npresentations are prepared \nto facilitate analysis / \ninterpretation of information \n3.1. Data processing, \nInformation analysis \nand interpretation \n3.2. Research methods  \n3.2.1. Qualitative \n3.2.2. Quantitative \n3.2.3. Statistical \n3.3. Report writing \n3.4. Use of relevant \nsoftware \n3.4.1. Spreadsheets \n3.4.2. Presentation \ngraphics \n3.4.3. Work processor \n3.4.4. Statistical \npackage \n3.1. Communicating \neffectively \n3.2. Performing \nresearch \n3.3. Reading / \ninterpreting data \nand information \n3.4. Problem solving\n\n--- PDF PAGE 20 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC IV                       Promulgated    December 18, 2017                          Page 16  \n \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4. Present findings/ \nrecommendations  \n4.1. Findings/ recommendations \nsummarized and \npresented/packaged in user-\nfriendly manner \n4.2. Relevant inputs gathered to \nfinalize report  \n4.3. Draft report prepared based \non standard format. \n4.4. Technical reports are \nsubmitted and disseminated \nto concerned offices.               \n \n4.1. Data processing, \nInformation analysis \nand interpretation \n4.2. Research methods  \n4.2.1. Qualitative \n4.2.2. Quan