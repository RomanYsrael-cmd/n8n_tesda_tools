        "source_text": "500311119\nUNIT DESCRIPTOR :\nThis unit covers the outcomes required in planning and\norganizing work. It may be applied to a small independent\noperation or to a section of a large organization.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1 Set objectives\n1.1 Objectives are consistent\nwith and linked to work\nactivities in accordance with\norganizational aims\n1.2 Objectives are stated as\nmeasurable targets with\nclear time frames\n1.3 Support and commitment of\nteam members are reflected\nin the objectives\n1.4 Realistic and attainable\nobjectives are identified\n1.1 Organization’s\nstrategic plan, policies\nrules and regulations,\nlaws and objectives\nfor work unit activities\nand priorities\n1.2 Organizations\npolicies, strategic\nplans, guidelines\nrelated to the role of\nthe work unit\n1.3 Team work and\nconsultation\nstrategies\n1.1 Planning\n1.2 Leading\n1.3 Organizing\n1.4 Coordinating\n1.5 Communication\nSkills\n1.6 Inter-and intra-\nperson/\nmotivation skills\n\n2 Plan and\nschedule work\nactivities\n2.1 Tasks/work activities to be\ncompleted are identified and\nprioritized as directed\n2.2 Tasks/work activities are\nbroken down into steps in\naccordance with set time\nframes achievable\ncomponents in accordance\nwith set time frames\n2.3 Resources are allocated as\nper requirements of the\nactivity\n2.4 Schedule of work activities\nis coordinated with\npersonnel concerned\n2.1 Organization’s\nstrategic plan, policies\nrules and regulations,\nlaws and objectives\nfor work unit activities\nand priorities\n2.2 Organizations\npolicies, strategic\nplans, guidelines\nrelated to the role of\nthe work unit\n2.3 Team work and\nconsultation\nstrategies\n2.1 Planning\n2.2 Leading\n2.3 Organizing\n2.4 Coordinating\n2.5 Communication\nSkills\n2.6 Inter-and intra-\nperson/\nmotivation skills\n3 Implement\nwork plans\n3.1 Work methods and\npractices are identified in\nconsultation with personnel\nconcerned\n3.2 Work plans are\nimplemented in accordance\nwith set time frames,\nresources and standards\n3.1 Organization’s\nstrategic plan, policies\nrules and regulations,\nlaws and objectives\nfor work unit activities\nand priorities\n3.2 Organizations\npolicies, strategic\nplans, guidelines\nrelated to the role of\nthe work unit\n3.3 Team work and\nconsultation\nstrategies\n3.1 Planning\n3.2 Leading\n3.3 Organizing\n3.4 Coordinating\n3.5 Communication\nSkills\n3.6 Inter-and intra-\nperson/\nmotivation skills\n\n--- PDF PAGE 24 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 20\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4 Monitor work\nactivities\n4.1 Work activities are monitored\nand compared with set\nobjectives\n4.2 Work performance is\nmonitored\n4.3 Deviations from work\nactivities are reported and\nrecommendations are\ncoordinated with appropriate\npersonnel and in accordance\nwith set standards\n4.4 Reporting requirements are\ncomplied with in accordance\nwith recommended format\n4.5 Observe timeliness of report\n4.6 Files are established and\nmaintained in accordance\nwith standard operating\nprocedures\n4.1 Organization’s\nstrategic plan,\npolicies rules and\nregulations, laws and\nobjectives for work\nunit activities and\npriorities\n4.2 Organizations\npolicies, strategic\nplans, guidelines\nrelated to the role of\nthe work unit\n4.3 Team work and\nconsultation\nstrategies\n4.1 Planning\n4.2 Leading\n4.3 Organizing\n4.4 Coordinating\n4.5 Communicatio\nn Skills\n4.6 Inter-and intra-\nperson/\nmotivation\nskills\n\n5 Review and\nevaluate work\nplans and\nactivities\n5.1. Work plans, strategies and\nimplementation are reviewed\nbased on accurate, relevant\nand current information\n5.2. Review is based on\ncomprehensive consultation\nwith appropriate personnel\non outcomes of work plans\nand reliable feedback\n5.3. Results of review are\nprovided to concerned\nparties and formed as the\nbasis for\nadjustments/simplifications\nto be made to policies,\nprocesses and activities\n5.4. Performance appraisal is\nconducted in accordance\nwith organization rules and\nregulations\n5.5. Performance appraisal report\nis prepared and documented\nregularly as per organization\nrequirements.\n5.6. Recommendations are\nprepared and presented to\nappropriate\npersonnel/authorities\n5.7. Feedback mechanisms are\nimplemented in line with\norganization policies\n5.1. Organization’s\nstrategic plan,\npolicies rules and\nregulations, laws and\nobjectives for work\nunit activities and\npriorities\n5.2. Organizations\npolicies, strategic\nplans, guidelines\nrelated to the role of\nthe work unit\n5.3. Team work and\nconsultation\nstrategies\n5.1. Planning\n5.2. Leading\n5.3. Organizing\n5.4. Coordinating\n5.5. Communicatio\nn Skills\n5.6. Inter-and intra-\nperson/\nmotivation\nskills\n\n--- PDF PAGE 25 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 21\n\nRANGE OF VARIABLES\n\nVARIABLES\nRANGE\n1. Objectives\n1.1. Specific\n1.2. General\n2. Resources\n2.1. Personnel\n2.2. Equipment and technology\n2.3. Services\n2.4. Supplies and materials\n2.5. Sources for accessing specialist advice\n2.6.\nBudget\n3. Schedule of work\nactivities\n3.1. Daily\n3.2. Work-based\n3.3. Contractual\n3.4. Regular\n3.5. Confidential\n3.6. Disclosure\n3.7.\nNon-disclosure\n4. Work methods and\npractices\nWork methods and practices may include but not limited to:\n4.1. Legislated regulations and codes of practice\n4.2. Industry regulations and codes of practice\n4.3.\nOccupational health and safety practices\n5. Work plans\n5.1. Daily work plans\n5.2. Project plans\n5.3. Program plans\n5.4. Organization strategic and restructuring plans\n5.5. Resource plans\n5.6. Skills development plans\n5.7.\nManagement strategies and objectives\n6. Standards\n6.1. Performance targets\n6.2. Performance management and appraisal systems\n6.3. National competency standards\n6.4. Employment contracts\n6.5. Client contracts\n6.6. Discipline procedures\n6.7. Workplace assessment guidelines\n6.8. Internal quality assurance\n6.9. Internal and external accountability and auditing\nrequirements\n6.10. Training Regulation Standards\n6.11. Safety Standards\n7. Appropriate\npersonnel/authorities\n7.1. Appropriate personnel include:\n7.2. Management\n7.3.\nLine Staff\n8. Feedback mechanisms\n8.1. Feedback mechanisms include:\n8.2. Verbal feedback\n8.3. Informal feedback\n8.4. Formal feedback\n8.5. Questionnaire\n8.6. Survey\n8.7.\nGroup discussion\n\n--- PDF PAGE 26 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 22\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Set objectives\n1.2. Planned and scheduled work activities\n1.3. Implemented work plans\n1.4. Monitored work activities\n1.5. Reviewed and evaluated work plans and activities\n2. Resource Implications\nThe following resources should be provided:\n2.1. Tools, equipment and facilities appropriate to the\nproposed activities\n2.2. Materials relevant to the proposed activities\n2.3. Work plan schedules\n2.4. Drawings, sketches or blueprint\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Direct observation/questioning\n3.2. Practical exercises on Planning and Scheduling\nWork Activities\n3.3. Third Party Report (collection of competency\nevidence)\n4. Context for Assessment\n4.1. Competency may be assessed in the workplace or\nin simulated work\n\n--- PDF PAGE 27 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 23\n\n UNIT OF COMPETENCY : PROMOTE ENVIRONMENTAL PROTECTION\n\n UNIT CODE :"
