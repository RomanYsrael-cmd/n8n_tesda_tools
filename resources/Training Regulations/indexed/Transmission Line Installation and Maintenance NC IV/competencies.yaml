        "source_title": "CONDUCT INITIAL ROOT CAUSE ANALYSIS",
        "source_text": "--- PDF PAGE 57 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC IV                       Promulgated    December 18, 2017                          Page 53  \n \nUNIT OF COMPETENCY :  CONDUCT INITIAL ROOT CAUSE ANALYSIS  \n \nUNIT CODE  \n \n:  UTL741311 \n \nUNIT DESCRIPTOR          :  This unit describes the knowledge, skills and attitudes, \nrequired to gather, interpret, convey information to determine \ninitial root cause of problem encountered in transmission line \noperation and maintenance.  \n \nELEMENTS \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Identify \nproblems \n1.1. Information is gathered \nregarding reported \nproblem/fault  \n1.2. The gathered information \nis analyzed based on \navailable records \n1.3. Structures and Right-Of-\nWay (ROW) conditions \nindicative of a problem are \nidentified based on \nInspection Report \n1.4. Identified problems are \nreported to immediate \nsupervisor based on \ncompany protocol \n \n1.1. Indicators of \ntransmission line  \noperation and \nmaintenance \nproblem \n1.2. Principles of the \nprocess sufficient \nto undertake an \ninitial RCA  \n1.3. Structures \nconditions \n1.4. Conductor \nclearance to \nstructure and \nvegetation \n1.5. Structural science \n(steel, wood, \nconcrete) \n1.6. Basic Mathematics \n(MDAS) \n1.7. Written and oral \ncommunication \n1.1. Analyzing Skills\n1.2. Problem \nsolving \n1.3. Communication \nSkills \n1.4. Documentation \nSkills \n \n2. Apply \nimmediate \ncorrection \n2.1. Immediate correction \nwithin the scope of \ncompetency and authority \nis recommended and \napplied based  on \ncompany policy \n2.2. Ongoing  solution to the \nproblem is reported to \nimmediate supervisor \n2.3. Correction methods for \nimmediate solution to the \nproblem are implemented \nbased on job requirements  \n2.4. Completion of work is \nconfirmed to appropriate \npersonnel based on \ncompany protocol \n \n2.1. Usage of PPE’s \n2.2.  Usage of \nTransmission Line \nTools and \nequipment \n2.3. OSH requirements \n2.4. Quick Fix on \ncommon problems \nin transmission line \noperation and \nmaintenance \n2.5. DOLE-OSHS Rule \n1210 – Electrical \nSafety \n2.6. Good \nhousekeeping \n2.7. Basic Mathematics \n(MDAS) \n2.8. Hand signal, \nwritten and oral \ncommunication\n2.1. Analytical Skills \n2.2. Problem \nsolving \n2.3. Communication \nSkills \n2.4. Interpretative \nSkills \n2.5. Manipulative \nSkills \n2.6. Housekeeping \nskills\n\n--- PDF PAGE 58 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC IV                       Promulgated    December 18, 2017                          Page 54  \n \nELEMENTS \nPERFORMANCE CRITERIA\nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Determine \ninitial root \ncause \n3.1. Possible range of causes \nare enumerated based on \nidentified problem \n3.2. Possible causes are \nidentified based on \ninformation gathered \n3.3. Initial root cause analysis is \nrelayed to supervisor \nbased on job requirements \n3.4. Initial root cause \ndocumentation is submitted \nto immediate supervisor \nbased on company policy \n3.1. Proper operation of \nhigh-resolution \ncamera. \n3.2. Indicators of \ntransmission line \nproblem \n3.3. Principles of the \nprocess sufficient \nto undertake an \nInitial Root Cause \nAnalysis (RCA)  \n3.4. Preparation of \nRCA report \n3.5. Written and oral \ncommunication \n \n3.1. Analytical Skills \n3.2. Problem \nsolving \n3.3. Communication \nSkills \n3.4. Interpretative \nSkills \n3.5. Manipulative \nSkills\n\n--- PDF PAGE 59 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC IV                       Promulgated    December 18, 2017                          Page 55  \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Information \nMay include but not limited to: \n1.1. Relay Indications \n1.2. Fault Indicators \n1.3.\nStructure list\n2. Structures  \nMay include but not limited to: \n2.1. Wood pole \n2.2. Steel pole \n2.3. Concrete pole \n2.4.\nTower structure\n3. Right Of Way  \nMay include but not limited to: \n3.1. Trees \n3.2. Bamboo \n3.3. Buildings \n3.4. Houses \n3.5. Billboards \n3.6.\nUnderbuilt/ Overbuilt Lines\n4. Identified problems \nMay include but not limited to: \n4.1. Man-made \n4.2. Force Majeure \n4.3. Structural \n4.4.\nVegetation\n5. Immediate correction \nMay include but not limited to: \n5.1. ROW clearing \n5.2. Reinforcement of structures and appurtenances \n5.3.\nReplacement of components\n \n \nEVIDENCE GUIDE \n1. Critical aspects of \ncompetency \nAssessment requires evidence that the candidate: \n1.1. Identified problems/fault  \n1.2. Applied immediate solution  \n1.3. Determined root cause  \n \n2. Resource Implications \nThe following resources must be available: \n2.1. Materials relevant to the activity \n2.2. Assessment area  \n3. Methods of \nassessment \nCompetency  may be assessed through \n3.1. Demonstration with oral questioning \n3.2. Written Exams \n3.3.\nPortfolio assessment with interview\n4. Context of \nassessment \n4.1. Competency may be assessed in the workplace or in a  \nsimulated workplace setting\n",
