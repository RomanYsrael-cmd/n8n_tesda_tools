        "source_text": "UTL311206\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes required\nto implement and monitor environmental protection policies\nand procedures including accessing relevant information\nconcerning environmental protection regulations and\nprocedures, and implementing and monitoring procedures\nconcerning environmental hazards, related control\nprocedures, environmental training arrangements, and\nrequired records and documentation\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Access\ninformation\nconcerning\nenvironmental\nprotection\nregulations and\nprocedures\n\n1.1. Relevant provisions of\nenvironmental legislation\nand codes of practice are\naccurately followed\n1.2. Information on workplace\nenvironmental policies,\nprocedures and programs\nis stored in a readily\naccessible location and\nmanner\n1.3. Information is accurately\nand clearly explained to\nthe work team and\nupdated according to\nchange in workplace\npolicy\n1.4. Information about the\noutcomes of\nenvironmental risk\nidentification and control\nprocedures is provided to\nthe appropriate personnel\n1.1. Relevant\nenvironmental\nprotection\nregulations &\ncodes of\npractice\n1.2. Environmental\nrisks associated\nwith workplace\noperations and\nrelated\nprecautions to\ncontrol the risk\n1.3. Environmental\nprotection\nstandards\nrequired in the\nworkplace\n\n1.1. Workplace\nreporting and\nrecording\nprocesses and\nprocedures\n1.2. Communication\nskills\n1.3. Accessing\ninformation and\ndata\n1.4. Ability to recognize\npotential\nenvironmental\nrisks and ways of\nminimizing them\n\n2. Implement and\nmonitor\nprocedures\nconcerning\nenvironmental\nhazards\n2.1 Existing and potential\nenvironmental hazards\nin the workplace are\nidentified and reported\n2.2 Identified hazards are\nassessed in relation to\nrelevant environmental\nprotection policies\n2.3 Workplace procedures\nfor dealing with\nhazardous events are\nimplemented wherever\nnecessary to ensure that\nprompt control action is\ntaken\n2.4 Personal protective\nequipment (PPE) are\nobtained and used in\n2.1. Relevant\nenvironmental\nprotection\nregulations &\ncodes of practice\n2.2. Workplace\nprocedures and\nguidelines for\nimplementing\nand monitoring\nprocedures\nconcerning\nenvironmental\nhazards\n2.3. Workplace\nenvironmental\nhazards and\n2.1. Workplace\nreporting and\nrecording\nprocesses and\nprocedures\n2.2. Communication\nskills\n2.3. Problem solving\nskills\n2.4. Ability to:\n2.4.1. recognize\npotential\nenvironmental\nhazards and\nways of\nminimizing\nthem\n\n--- PDF PAGE 36 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 32\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\naccordance with job\nrequirements\n2.5 Hazardous events are\ninvestigated to identify\ncauses, and control\nmeasures are\nimplemented to prevent\nrecurrence and minimize\nrisks of such events\nrelated hazard\ncontrol measures\n2.4. Equipment and\nresources\nrequired when\nimplementing\nand monitoring\nenvironmental\nprotection\nprocedures\n2.5. Organizational\nstructure and site\nlayout\n2.4.2. counsel,\nadvise and\ninform others\non\nenvironmental\nprotection\nmatters\n2.4.3. identify and\ncorrectly use\nequipment\nand vehicles\nin accordance\nwith\nenvironmental\nprotection\nregulations\nand guidelines\n3. Implement and\nmonitor\nenvironmental\ncontrol\nprocedures\n3.1 Existing environmental\nprotection measures are\nimplemented, monitored\nand reviewed\n3.2 Work procedures to\nprotect environment are\nimplemented and\nadherence to them by the\nwork group is monitored\n3.3 Requi