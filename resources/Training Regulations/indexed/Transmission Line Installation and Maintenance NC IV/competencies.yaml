        "source_text": "UTL741310\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nsupervising/directing field work for corrective and preventive\nmaintenance of overhead transmission lines.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare job\nsite and haul\nresources\n\n1.1 Job site is prepared for\nmaintenance work in\naccordance with job\nrequirements\n1.2 Safety is stressed and\nenforced in accordance\nwith job requirements\n1.3 Hauling of tools, equipment\nand materials to job site is\ncoordinated with\nconcerned personnel\n\n1.1 OSH requirements\n1.2 Structural design\nand specification\n1.3 Rigging/ reeving\nmethods\n1.4 Usage of tools,\nequipment and\nmaterials\n1.5 Soil bearing\ncapacity\n1.6 DOLE-OSHS Rule\n1150 – Materials\nHandling and\nStorage\n1.7 Basic Math\n(MDAS)\n1.8 Oral and hand\nsignal\ncommunication\n\n1.1 Communication\nskills\n1.2 Mathematical\nskills\n1.3 Analytical skills\n1.4 Interpretation\nskills\n1.5 Hand signal\nskills\n1.6 Rigging skills\n\n2. Conduct\ntoolbox\nmeeting with\nteam members\n2.1 Responsibilities of team\nmembers are discussed\nand confirmed in job site\n2.2 Team members’ queries\nand concerns are\nrecognized, discussed and\naddressed based on\nworking environment.\n2.3 Safety procedures are\ndiscussed with team\nmembers based on\nworking environment\n2.4 Job hazards and controls\nare discussed with team\nmembers.\n\n2.1 OSH requirements\n2.2 Structural design\nand specification\n2.3 Usage of tools,\nequipment and\nmaterials\n2.4 IMS requirements\n2.5 Written and oral\ncommunication\n2.6 Clean Air Act\n\n2.1 Communication\nskills\n2.2 Interpretation\nskills\n2.3 Analytic skills\n\n--- PDF PAGE 54 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 50\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Oversee\nmaintenance\nwork\n\n3.1 Safety procedures are\nenforced during actual\nwork.\n3.2 Guidance/Assistance is\nprovided to newly hired\nand OJTs ensure work\nquality and safety\n3.3 Rigging of heavy loads and\ncomponents are performed\nbased on company policies\nand standards\n3.4 Communication with\nappropriate personnel is\nmaintained to ensure quick\nresponse in case of\nproblems or emergencies\n3.5 Unforeseen events are\nresponded in accordance\nwith company procedures\nto ensure work quality and\nsafety\n3.6 Work completion is\nconfirmed and reported to\nimmediate supervisor.\n3.7 Documentation is done\nand submitted to\nimmediate supervisor.\n3.1 OSH requirements\n3.2 Structural design\nand specification\n3.3 Safe rigging/\nreeving methods\n3.4 Usage of tools,\nequipment and\nmaterials\n3.5 Safety procedures\n3.6 Decision making\nprinciples\n3.7 Supervisory\nprinciples\n3.8 DOLE-OSHS Rule\n1210 – Electrical\nSafety\n3.9 DOLE-OSHS Rule\n1410 –\nConstruction\nSafety\n3.10 DOLE-OSHS\nRule 1428 -\nLines, Blocks,\nRigging\n3.11 Basic\nmath(MDAS)\n3.12 Oral and hand\nsignal\ncommunication\n\n3.1 Communication\nskills\n3.2 Mathematical\nskills\n3.3 Analytical skills\n3.4 Interpretation\nskills\n3.5 Hand signal\nskills\n3.6 Rigging skills\n3.7 Decision making\nskills\n3.8 Supervisory\nskills\n\n4. Administer\ngood\nhousekeeping\n4.1. Work site is cleared and\nkept in safe state in\naccordance with\nestablished housekeeping\nprocedures.\n4.2. Tools, equipment and\nretrieved excess materials\nare accounted and\nreturned according to\ncompany procedures\n4.3. Tools and equipment are\nchecked based on normal\noperational condition\n4.1. OSH requirements\n4.2. Integrated\nManagement\nSystem (IMS)\nrequirements\n4.3. Oral and hand\nsignal\ncommunication\n4.4. 5S and 3Rs\nprinciples\n4.5. DOLE-OSHS Rule\n1150 – Materials\nHandling and\nStorage\n\n4.1. Communication\nskills\n4.2. Hand signal\nskills\n4.3. Mathematical\nskills\n4.4. Analytical skills\n4.5. Interpretation\nskills\n4.6. housekeeping\nskills\n4.7. Documentation\nskills\n\n--- PDF PAGE 55 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 51\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Job Requirements\nMay include but not limited to:\n1.1. ERS erection\n1.2. Hotline maintenance work\n1.3. ROW vegetation clearing\n1.4. Earth ground resistance testing\n1.5. Replacement of missing tower parts\n1.6. Overhead line works\n1.7. Ground line works\n2. Safety\nMay include but not limited to:\n2.1. Proper Lifting\n2.2. Reeving\n2.3. Proper Rigging\n2.4. Knots and hitches\n2.5. Use of PPE’s\n2.6. Use of early warning device (traffic cone, traffic vest,\ncaution tape\n3. Concerned\nPersonnel\nMay include but not limited to :\n3.1. Lineman\n3.2. Line Engineer\n3.3. Driver Mechanic\n3.4. Heavy Equipment Operator\n4. Job Hazard\nMay include but not limited to:\n4.1. Climbing hazards\n4.2. Electrical hazards\n4.3.\nStructural hazards\n5. safety procedures\nMay include but not limited to:\n5.1 Use of PPE’s\n5.2 Use of voltage detector\n5.3 Installation of grounding cluster\n5.4 Use of tagging system\n5.5 Use of early warning device (traffic cone, traffic vest,\ncaution tape)\n6. appropriate\npersonnel\nMay include but not limited to:\n6.1. Lineman\n6.2. Line engineer\n6.3. ROW officer\n6.4. Driver\n6.5. Heavy Equipment\nOperator\n6.6. Security officer\n7. Unforeseen events\nMay include but not limited to:\n7.1. ROW problems\n7.2. Security problems\n7.3. Structural problems\n7.4. Safety related problems\n7.5. Problems in terrain and weather condition\n8. Documentation\nMay include:\n8.1. Toolbox meeting form\n8.2. Maintenance Order form\n8.3. Photo’s of works before, during and after\n\n--- PDF PAGE 56 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 52\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Prepared job site and hauled resources\n1.2. Conduct toolbox meeting with team members\n1.3. Monitored/Supervised maintenance work\n1.4. Administered good housekeeping\n2. Resource Implications The following resources must be available:\n2.1. Materials relevant to the activity\n2.2. Sample maintenance Order\n2.3. Sample toolbox meeting form\n2.4. Assessment area\n3. Methods of\nassessment\nCompetency may be assessed through\n3.1. Demonstration with oral questioning\n3.2. Written exam and oral questioning\n3.3. Portfolio assessment with interview\n4. Context of\nassessment\n4.1. Competency may be assessed in the workplace or in\na simulated workplace setting\n\n--- PDF PAGE 57 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 53\n\nUNIT OF COMPETENCY : CONDUCT INITIAL ROOT CAUSE ANALYSIS\n\nUNIT CODE\n\n:"
