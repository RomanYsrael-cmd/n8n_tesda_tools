        "source_text": "UTL311205\nDESCRIPTOR : This unit covers the knowledge, skills and attitude to operate and\nmaintain transmission line tools and equipment. This unit will\ninvolve working in a team environment.\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are\nelaborated in the range of variables)\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Plan and\nprepare for\nwork\n1.1 Work instruction is secured\nand interpreted according to\njob requirements\n1.2 Relevant occupational\nhealth and safety\nrequirements are identified\nfollowing job specifications\n1.3 Relevant transmission line\ntools, equipment and\nhardware are identified and\nrequested in accordance with\njob specifications\n1.1 Relevant\noccupational\nhealth and safety\nstandards\n1.2 Types and usage\nof transmission\nline tools and\nequipment\n1.3 Basic preventive\nmaintenance\nservicing for\ntransmission line\nequipment\n\n1.1 Following and\ncomplying\noccupational health\nand safety standards\n1.2 Following\nprocedures for the\nsafe use of\ntransmission line\ntools and equipment\n1.3 Performing basic\npreventive\nmaintenance\nservicing for\ntransmission line\nequipment\n2. Prepare\ntransmission\nline tools and\nequipment\n\n2.1 Personal protective\nequipment (PPE) are\nobtained following job\nrequirements\n2.2 Transmission line tools,\nequipment and hardware are\nacquired and secured in line\nwith job requirements\n2.3 Transmission hot line tools\nare tested/set following\nmanufacturer’s standards or\nrecommendation\n2.1 Types and\nfunctions of\nPPEs\n2.2 Types and usage\nof transmission\nline tools and\nequipment\n2.3 Basic preventive\nmaintenance\nservicing for\ntransmission line\nequipment\n2.4 Proper testing of\ntransmission hot\nline tools\n\n2.1 Following and\ncomplying\noccupational health\nand safety\nstandards\n2.2 Following\nprocedures for the\nsafe use of\ntransmission line\ntools and equipment\n2.3 Performing basic\npreventive\nmaintenance\nservicing for\ntransmission line\nequipment\n2.4 Testing skills\n3. Operate\ntransmission\nline tools and\nequipment\n3.1 PPE are used in line with job\nrequirements\n3.2 Transmission line tools and\nequipment are used in line\nwith job requirements\n3.1 Proper usage of\nPPEs\n3.2 Proper\nprocedure for the\nuse of\ntransmission line\ntools and\nequipment\n3.3 Basic preventive\nmaintenance\nservicing for\ntransmission line\nequipment\n3.1 Using PPEs\n3.2 Following\nprocedures for the\nsafe use of\ntransmission line\ntools and equipment\n3.3 Performing basic\npreventive\nmaintenance\nservicing for\ntransmission line\nequipment\n\n--- PDF PAGE 43 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 39\n\nELEMENT\nPERFORMANCE CRITERIA\n(Italicized Bold terms are\nelaborated in the range of variables)\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Check\ncondition of\ntransmission\nline tools and\nequipment\n\n4.1 Transmission line tools and\nequipment are identified\naccording to classification\nand job requirements\n4.2 Non-functional transmission\nline tools and equipment are\nsegregated and labeled\naccording to classification\n4.3 Safety of transmission line\ntools and equipment are\nobserved in accordance with\nmanufacturer's instructions\n4.4 Condition of PPE are\nchecked in accordance with\nmanufacturer's instructions\n4.1 Classification of\ntransmission line\ntools and\nequipment\n4.2 Proper safety\nprocedure for the\nuse of\ntransmission line\ntools and\nequipment\n4.3 Basic preventive\nmaintenance\nservicing for\ntransmission line\nequipment\n\n4.1 Classifying\ntransmission line\ntools and equipment\n4.2 Following and\ncomplying\noccupational health\nand safety\nstandards\n4.3 Following\nprocedures for the\nsafe use of\ntransmission line\ntools and equipment\n4.4 Performing basic\npreventive\nmaintenance\nservicing for\ntransmission line\nequipment\n5. Perform\nbasic\npreventive\nmaintenance\n5.1 Appropriate lubricants are\nidentified according to\ntypes of equipment\n5.2 Equipment are lubricated\naccording to preventive\nmaintenance schedule or\nmanufacturer's specifications\n5.3 Transmission line tools are\ncleaned and tested\naccording to standard\nprocedures\n5.4 Transmission line tools and\nequipment are inspected,\nand repaired and replaced, if\nnecessary, after use\n5.5 Work place is cleaned and\nkept in safe state in line with\nOHSA regulations\n5.1 Types and usage\nof lubricants for\ntransmission line\nequipment\n5.2 Proper\nprocedure for the\nuse and\nmaintenance of\ntransmission line\ntools and\nequipment\n5.3 Basic preventive\nmaintenance\nservicing for\ntransmission line\nequipment\n5.4 Applicable\nOHSA\nregulations in\npreventive\nmaintenance\n5.1 Identifying types and\nusage of lubricants\n5.2 Following\nprocedures for the\nsafe use and\nmaintenance of\ntransmission line\ntools and equipment\n5.3 Performing basic\npreventive\nmaintenance\nservicing for\ntransmission line\nequipment\n5.4 Following OHSA\nregulations\n\n6. Store tools\nand\nequipment\n\n6.1 Inventory of transmission line\ntools and equipment are\nconducted and recorded as\nper company practices\n6.2 Transmission line tools and\nequipment are stored safely\nin appropriate locations in\naccordance with\nmanufacturer's\nspecifications or company\nprocedures\n6.1 Proper\nprocedure for the\ninventory and\nstorage of\ntransmission line\ntools and\nequipment\n6.1 Following\nprocedures for the\ninventory and\nstorage of\ntransmission line\ntools and equipment\n6.2 Inventory skills\n6.3 Proper storage and\nhandling skills\n\n--- PDF PAGE 44 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 40\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Job requirements\n1.1 Perform overhead transmission line work\n1.2 Erect pole\n1.3 Perform live-line maintenance work\n1.4 Perform cold-line maintenance work\n1.5 Perform ground line maintenance work\n1.6 Perform emergency restoration structure\n2. Occupational health\n and safety\n requirements\nMay include but not limited to:\n2.1 Personal protective equipment (PPE)\n2.1.1 Safety hat\n2.1.2 Safety goggles\n2.1.3 Safety gloves\n2.1.4 Safety shoes\n2.1.5 Safety harness/strap\n2.2 Installation of grounding cluster\n3. Transmission line\n tools, equipment and\n hardware\nMay include but not limited to:\n3.1 Hand tools\n3.1.1 Pliers\n3.1.2 Screwdrivers\n3.1.3 Adjustable wrenches\n3.1.4 Ball peen hammer\n3.1.5 Auger bit\n3.1.6 Hacksaw/cutting tools\n3.1.7 Steel tape\n3.2 Equipment\n3.2.1 Motorized capstan\n3.2.2 Climbing gears\n3.2.3 Line truck/Boom truck\n3.3 Set of hot line trailer\n3.4 Hardware\n3.4.1 Insulator\n3.4.2 Machine bolts\n3.4.3 Suspension clamp assembly (ACSR/OHGW)\n3.4.4 Strain clamp assembly(ACSR/OHGW)\n3.4.5 Overhead ground wires\n3.4.6 Cross-arms and braces\n3.4.7 Conductors and accessories\n\n--- PDF PAGE 45 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 41\n\nEVIDENCE GUIDE\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrates ability to identify and comply with\noccupational health and safety standards in operating\nand maintaining transmission line tools and equipment\n1.2. Demonstrates ability to identify and safely use\ntransmission tools and equipment\n1.3. Demonstrates ability to perform basic preventive\nmaintenance servicing for transmission line equipment\n2. Resource Implications The following resources should be provided:\n2.1. Transmission line tools, equipment and PPE\n2.2. Work area\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1. Observation and Oral questioning\n3.2. Demonstration with oral questioning\n3.3. Written test\n\n4. Context of\n assessment\n4.1. Competency may be assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or\npart of team under limited supervision\n\n--- PDF PAGE 46 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 42\n\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\nUNIT CODE\n:"
