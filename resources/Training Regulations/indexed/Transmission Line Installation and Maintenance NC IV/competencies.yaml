        "evidence_guide": {
          "source_text": "1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nEvaluated job site\n1.2.\nPrepared list of T/L tools, equipment and hardware.\n1.3.\nPresented maintenance work preparation\n2. Resource implication\nThe following resources must be available:\n2.1.\nMaterials relevant to the activity\n2.2.\nSample maintenance Order\n2.3.\nSample Pole/Tower Inspection checklist\n2.4.\nAssessment area\n3. Method of assessment\nCompetency may be assessed through\n3.1.\nDemonstration with oral questioning\n3.2.\nWritten Exam\n3.3.\nPortfolio assessment with interview\n4. Context of Assessment\n4.1. Competency may be assessed in the workplace or in\na simulated workplace setting\n\n--- PDF PAGE 53 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 49\n\nUNIT OF COMPETENCY : SUPERVISE TRANSMISSION LINE MAINTENANCE WORK\n\nUNIT CODE\n\n:"
        },
        "source_text": "UTL741309\n\nUNIT DESCRIPTOR : This unit describes the knowledge, skills and attitudes in\nplanning assigned transmission line maintenance work. This\ninclude competency in evaluating job site, preparing list of\ntools, equipment and hardware and discussing assigned\nmaintenance work preparation.\n\nELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Evaluate job\nsite\n\n1.1 Maintenance orders (MO) are\nreceived and interpreted based\non job requirements.\n1.2 Job site inspection is performed\nin accordance to company\nprocedures\n1.3 Potential problems in job site\nare determined and referred to\nappropriate personnel.\n1.4 Job hazards are determined\nand referred to concerned\npersonnel.\n1.1 Structural design\nand specification\n1.2 Usage and\nfunction of tools,\nmaterials\n1.3 OSH requirement\n1.4 DOLE-OSHS\nRule 1212 -\nElectrical Safety\nInspection\n1.5 Natural and\nmanmade threats.\n1.6 Written and oral\ncommunication\n(written and\ncomprehension)\n1.1 Communication\nskills\n1.2 Inspection skills\n1.3 Analytic skills\n1.4 Interpretation\nskills\n\n2. Prepare list\nof tools,\nequipment\nand\nhardware\n2.1 Tools, equipment and materials\nare identified based on job\nrequirements.\n2.2 List of equipment and materials\nto be obtained is submitted to\nappropriate personnel.\n2.3 Condition and quantity of\nequipment, instruments, and\nmaterials are ensured/\nconfirmed prior to maintenance\nwork.\n2.1 Structure design\nspecification\n2.2 Usage and\nfunction of tools\nand equipment\n2.3 Basic math\n(MDAS)\n2.4 Written and oral\ncommunication\n\n2.1 Communication\nskills\n2.2 Interpretative\nskills\n2.3 Mathematical\nskills\n2.4 Analytic skills\n\n3. Discuss\nassigned\nmaintenance\nwork\npreparation\n\n3.1 Maintenance work\nrequirements are presented\nduring pre-maintenance\nmeeting.\n3.2 Supplement requirements are\ncomplied based on the pre-\nmaintenance meeting\nagreement.\n3.3 Pre-maintenance meeting\nagreement is relayed with team\nmembers in accordance with\ncompany standards and\nprocedures.\n3.1 Structure design\nspecification\n3.2 IMS procedures\n3.3 Basic\nmath(MDAS)\n3.4 Written and oral\ncommunication\n\n3.1 Communication\nskills\n3.2 Interpretation\nskills\n3.3 Mathematical\nskills\n3.4 Analytical skills\n\n--- PDF PAGE 51 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 47\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Job requirements\nMaintenance orders include:\n1.1. Corrective maintenance\n1.2.\nPreventive maintenance\n2. Potential problems\nMay include but not limited to:\n2.1. Right-of-way problems\n2.2.\nSecurity problems\n3. Appropriate personnel\nMay include but not limited to:\n3.1. Lineman\n3.2. Line engineer\n3.3. ROW officer\n3.4. Driver\n3.5. Heavy Equipment Operator\n3.6.\nSecurity officer\n4. Job Hazards\nMay include but not limited to :\n4.1. Terrain\n4.2. Sabotage and pilferage\n4.3.\nEnergized under built, parallel or lateral lines\n5. Concerned personnel\nMay include but not limited to :\n5.1. Lineman\n5.2. Line Engineer\n5.3. Driver Mechanic\n5.4.\nHEO\n6. Work assignments\nMay include but not limited to:\n6.1. Overhead works assignment\n6.2.\nGround works assignment\n7. Safety precautions\nMay include but not limited to:\n7.1. Use of PPE’s\n7.2. Use of voltage detector\n7.3. Installation of grounding cluster\n7.4. Use of tagging system\n7.5. Use of early warning device (traffic cone, traffic\nvest, caution tape)\n8. Team members\nMay include but not limited to:\n8.1. heavy equipment operator\n8.2. driver-mechanic\n8.3.\nLineman\n9. Maintenance work\nrequirements\nMay include but not limited to:\n9.1. Job site evaluation\n9.2. Materials\n9.3. Tools and equipment\n9.4.\nManpower\n\n--- PDF PAGE 52 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 48\n\nEVIDENCE GUIDE\n\n1. Critical aspect of\ncompetency\nAssessment requires evidence that the candidate:\n1.1.\nEvaluated job site\n1.2.\nPrepared list of T/L tools, equipment and hardware.\n1.3.\nPresented maintenance work preparation\n2. Resource implication\nThe following resources must be available:\n2.1.\nMaterials relevant to the activity\n2.2.\nSample maintenance Order\n2.3.\nSample Pole/Tower Inspection checklist\n2.4.\nAssessment area\n3. Method of assessment\nCompetency may be assessed through\n3.1.\nDemonstration with oral questioning\n3.2.\nWritten Exam\n3.3.\nPortfolio assessment with interview\n4. Context of Assessment\n4.1. Competency may be assessed in the workplace or in\na simulated workplace setting\n\n--- PDF PAGE 53 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 49\n\nUNIT OF COMPETENCY : SUPERVISE TRANSMISSION LINE MAINTENANCE WORK\n\nUNIT CODE\n\n:"
