          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrates ability to identify and comply with\noccupational health and safety standards in operating\nand maintaining transmission line tools and equipment\n1.2. Demonstrates ability to identify and safely use\ntransmission tools and equipment\n1.3. Demonstrates ability to perform basic preventive\nmaintenance servicing for transmission line equipment\n2. Resource Implications The following resources should be provided:\n2.1. Transmission line tools, equipment and PPE\n2.2. Work area\n3. Method of\nassessment\nCompetency in this unit may be assessed through:\n3.1. Observation and Oral questioning\n3.2. Demonstration with oral questioning\n3.3. Written test\n\n4. Context of\n assessment\n4.1. Competency may be assessed in the workplace or in a\nsimulated workplace setting\n4.2. Assessment shall be undertaken either individually or\npart of team under limited supervision\n\n--- PDF PAGE 46 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 42\n\nUNIT TITLE\n:\nPERFORM COMPUTER OPERATIONS\nUNIT CODE\n:"
