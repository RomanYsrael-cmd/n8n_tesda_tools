dance \nwith recommended format \n4.5 Observe timeliness of report \n4.6 Files are established and \nmaintained in accordance \nwith standard operating \nprocedures \n4.1 Organization’s \nstrategic plan, \npolicies rules and \nregulations, laws and \nobjectives for work \nunit activities and \npriorities \n4.2 Organizations \npolicies, strategic \nplans, guidelines \nrelated to the role of \nthe work unit \n4.3 Team work and \nconsultation \nstrategies \n4.1 Planning  \n4.2 Leading \n4.3 Organizing \n4.4 Coordinating \n4.5 Communicatio\nn Skills \n4.6 Inter-and intra-\nperson/ \nmotivation \nskills \n \n5 Review and \nevaluate work \nplans and \nactivities \n5.1. Work plans, strategies and \nimplementation are reviewed  \nbased on accurate, relevant \nand current information \n5.2. Review is based on \ncomprehensive consultation \nwith appropriate personnel \non outcomes of work plans \nand reliable feedback \n5.3. Results of review are \nprovided to concerned \nparties and formed as the \nbasis for \nadjustments/simplifications \nto be made to policies, \nprocesses and activities \n5.4. Performance appraisal is \nconducted in accordance \nwith organization rules and \nregulations \n5.5. Performance appraisal report \nis prepared and documented \nregularly as per organization \nrequirements. \n5.6. Recommendations are \nprepared and presented to \nappropriate \npersonnel/authorities \n5.7. Feedback mechanisms are \nimplemented in line with \norganization policies\n5.1. Organization’s \nstrategic plan, \npolicies rules and \nregulations, laws and \nobjectives for work \nunit activities and \npriorities \n5.2. Organizations \npolicies, strategic \nplans, guidelines \nrelated to the role of \nthe work unit \n5.3. Team work and \nconsultation \nstrategies \n5.1. Planning  \n5.2. Leading \n5.3. Organizing \n5.4. Coordinating \n5.5. Communicatio\nn Skills \n5.6. Inter-and intra-\nperson/ \nmotivation \nskills\n\n--- PDF PAGE 25 ---\n---------------------------------------