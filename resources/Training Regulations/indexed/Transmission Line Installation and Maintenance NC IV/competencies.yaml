          "source_text": "1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Set objectives\n1.2. Planned and scheduled work activities\n1.3. Implemented work plans\n1.4. Monitored work activities\n1.5. Reviewed and evaluated work plans and activities\n2. Resource Implications\nThe following resources should be provided:\n2.1. Tools, equipment and facilities appropriate to the\nproposed activities\n2.2. Materials relevant to the proposed activities\n2.3. Work plan schedules\n2.4. Drawings, sketches or blueprint\n3. Methods of Assessment\nCompetency in this unit may be assessed through:\n3.1. Direct observation/questioning\n3.2. Practical exercises on Planning and Scheduling\nWork Activities\n3.3. Third Party Report (collection of competency\nevidence)\n4. Context for Assessment\n4.1. Competency may be assessed in the workplace or\nin simulated work\n\n--- PDF PAGE 27 ---\n-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nTR – Transmission Line Installation and Maintenance NC IV Promulgated December 18, 2017 Page 23\n\n UNIT OF COMPETENCY : PROMOTE ENVIRONMENTAL PROTECTION\n\n UNIT CODE :"
