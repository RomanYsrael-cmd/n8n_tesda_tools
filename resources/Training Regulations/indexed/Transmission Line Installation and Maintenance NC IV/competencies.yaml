formed based on the \nactivities identified. \n2.3 Problems/ constraints \nencountered are resolved \nin accordance with \norganizations’ policies and \nguidelines  \n2.4 Stakeholders are \nconsulted based on \ncompany guidelines   \n2.1. Features of an \nenvironmental \nmanagement strategy \n2.2. Waste minimization \nhierarchy \n2.3. Environmental \nplanning/ management \n2.4. Community needs and \nexpectations \n2.5. Resource availability \n2.6. Environment-friendly/ \nenvironmental \nadvocates \n2.7. 5S of Good \nHousekeeping \n2.8. 3Rs – Reduce, Reuse \n& Recycle \n2.1. Communicating \neffectively \n2.2. Performing \nresearch and \nanalysis \n2.3. Reading / \ninterpreting data \nand information \n2.4. Problem solving \n3. Monitor \nactivities on \nenvironmental   \nprotection/ \nprograms\n3.1 Activities are periodically \nmonitored and evaluated \naccording to the objectives \nof the environmental \nprogram \n3.1. Features of an \nenvironmental \nmanagement strategy \n3.2. Environmental \nissues/concerns\n3.1. Communicating \neffectively \n3.2. Performing \nresearch and \nanalysis\n\n--- PDF PAGE 28 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC IV                       Promulgated    December 18, 2017                          Page 24  \n \nELEMENTS \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3.2 Feedback from \nstakeholders are gathered \nand considered in \nproposing enhancements \nto the program based on \nconsultations \n3.3 Data gathered are \nanalyzed based on \nevaluation requirements \n3.4 Recommendations are \nsubmitted based on the \nfindings \n3.5 Management support \nsystems are set/ \nestablished to sustain and \nenhance the program \n3.6 Environmental incidents \nare monitored and reported \nto concerned/proper \nauthorities \n \n3.3. International \nEnvironmental \nProtocols (Montreal, \nKyoto)  \n3.4. Waste minimization \nhierarchy \n3.5. Environmental \nplanning/ management \n3.6. Community needs and \nexpectations \n3.7. Resource availability \n3.8. Environment-friendly/ \nenvironmental \nadvocates \n3.9. 5S of Good \nHousekeeping \n3.10. 3Rs – Reduce, Reuse \n& Recycle \n3.11. Sanitary Code \n3.12. Environmental Code \nof practice \n3.3. Reading / \ninterpreting data \nand information \n3.4. Problem solving\n\n--- PDF PAGE 29 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC IV                       Promulgated    December 18, 2017                          Page 25  \n \n \nRANGE OF VARIABLES \n \nVARIABLES \nR A N G E \n  1.  Legislations/Conventions   May include: \n 1.1  Clean Air act  \n 1.2  Clean Water Act  \n1.3 Solid Waste Management \n1.4 Montreal Protocol \n1.5 Kyoto Protocol \n  2.  Environmental  \naspects/impacts  \n2.1 Air pollution \n2.2 Water pollution \n2.3 Noise pollution \n2.4 Solid waste  \n2.5  Flood control \n2.6 Deforestation/Denudation  \n2.7 Radiation/Nuclear /Radio Frequency/ Microwaves \n2.8 Situation  \n2.9 Soil erosion (e.g. Quarrying, Mining, etc.) \n2.10 Coral reef/marine life protection \n  3.  Industrial standards/ \nEnvironmental practices \n3.1  ECC standards \n3.2 ISO standards  \n3.3  company environmental management    systems \n(EMS) \n 4.  Periodic \n4.1 hourly \n4.2 daily \n4.3 weekly \n4.4 monthly \n4.5 quarterly \n4.6 yearly \n  5.  Programs/Activities \n5.1 Waste disposal (on-site and off-site) \n5.2  Repair and maintenance of equipment \n5.3  Treatment and disposal operations \n5.4  Clean-up activities \n5.5  Laboratory and analytical test \n5.6   Monitoring and evaluation \n  5.7  Environmental advocacy programs\n\n--- PDF PAGE 30 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC IV                       Promulgated    December 18, 2017                          Page 26  \n \nEVIDENCE GUIDE \n \n1. Critical aspects of  \n       Competency  \n Assessment requires evidence that the candidate: \n1.1 Demonstrated knowledge of environmental legislations and \nlocal ordinances according to the different environmental \nissues/concerns. \n1.2 Described industrial standard environmental practices \naccording to the different environmental issues/concerns. \n1.3  Resolved problems/ constraints encountered based on \nmanagement  standard procedures \n1.4  Implemented and monitored environmental practices on a \nperiodic basis as per company guidelines \n1.5  Recommended solutions for the improvement of the   \nprogram \n  1.6  Monitored and reported to proper authorities any \nenvironmental incidents  \n 2.  Resource   Implications  The following resources should  be provided: \n2.1  Workplace/Assessment location \n2.2  Legislation, policies, procedures, protocols and local \nordinances relating to environmental protection \n2.3  Case studies/scenarios relating to environmental protection\n \n 3.  Methods of Assessment \nCompetency in this unit may  be assessed through: \n3.1  Written/ Oral Examination \n3.2  Interview/Third Party Reports \n3.3  Portfolio (citations/awards from GOs and NGOs, certificate \nof  training – local and abroad) \n 3.4  Simulations and role-plays\n 4.  Context for Assessment   4.1  Competency may be assessed in actual workplace or at the \ndesignated TESDA center.\n",
