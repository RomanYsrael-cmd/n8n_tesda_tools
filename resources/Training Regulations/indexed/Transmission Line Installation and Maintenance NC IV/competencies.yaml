        "source_text": "--- PDF PAGE 15 ---\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- \nTR – Transmission Line Installation and Maintenance NC IV                       Promulgated    December 18, 2017                          Page 11  \n \nUNIT OF COMPETENCY : APPLY PROBLEM SOLVING TECHNIQUES IN THE \nWORKPLACE  (Critical thinking and problem solving \ntechniques) \nUNIT CODE                      : 500311117 \nUNIT DESCRIPTOR         : This competency covers the knowledge, skills and attitudes \nrequired to apply the process of problem solving and other \nproblems beyond those associated directly with the process \nunit.  It includes the application of structured processes and \nimprovement tools.  This competency is typically performed by \nan experienced technician, team leader or supervisor. \n \n \nELEMENTS \nPERFORMANCE CRITERIA\nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Analyze the \nproblem \n   (Use system \nthinking) \n1.1. Issues/concerns are \nevaluated based on data \ngathered \n1.2. Possible causes of \nproblem are identified \nwithin the area of \nresponsibility  as \nbased on experience \nand the use of problem \nsolving tools/analytical \ntechniques \n1.3. Possible cause \nstatements are \ndeveloped based on \nfindings \n1.1. Broad understanding of \nsystems, organizational \nsystems and functions \n1.2. Broad knowledge of \nhelp desk and \nmaintenance practices \n1.3. Broad knowledge of the \nclient business domain \n1.4. Broad knowledge based \nof diagnostic tools \n1.5. General principles of \nOHS \n1.6. Divisional/unit \nresponsibilities \n1.1. Decision making \nwithin a limited range \nof options. \n1.2. Communication is \nclear, precise and \nvaries according to \nthe type of audience \n1.3. Time management \nas applied to self-\nmanagement. 