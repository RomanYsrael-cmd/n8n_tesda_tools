  "source_text": "SECTION 4\nNATIONAL ASSESSMENT AND CERTIFICATION\nARRANGEMENTS\n\n4.1\nTo attain the National Qualification of RAC Servicing NC II, the\ncandidate must demonstrate competence in all the units listed in\nSection 1. Successful candidates shall be awarded a National\nCertificate signed by the TESDA Director General.\n\n4.2\nThe qualification of RAC Servicing NC II may be attained through:\n\n4.2.1 Demonstration of competence through project-type\nassessment covering all required units of the qualification.\n\n4.2.2 For individuals, who are holders of National Certificate of RAC\nServicing NC I shall be converted to RAC Servicing NC II.\nHolders of Certificate of Competency (COC) along RAC\nServicing NC I will be required to undertake the required\ncompetencies through training or assessment for RAC\nServicing NC II.\n\n4.3\nAssessment shall focus on the core units of competency. The basic\nand common units shall be integrated or assessed concurrently with\nthe core units.\n\nOne or two additional evidences in the form of Portfolio, Third Party\nReport, Written Test and Demonstration with Questioning may be\nrequired by the assessor in addition to those specified in the Methods\nof Assessment in the Competency Standards, depending on the\nneed for supplementary evidences.\n\n4.4\nThe following are qualified to apply for assessment and certification:\n\n4.4.1 Graduates of formal, non-formal and informal including\n enterprise-based training programs\n\n4.4.2 Experienced Workers (wage employed or self-employed)\n\n4.5\nThe guidelines on assessment and certification are discussed in\ndetail in the \"Procedures Manual on Assessment and Certification\"\nand \"Guidelines on the Implementation of the Philippine TVET\nQualification and Certification System (PTQCS)\".\n\n--- PDF PAGE 77 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n75\n\nBASIC\n COMPETENCIES\n"
}
