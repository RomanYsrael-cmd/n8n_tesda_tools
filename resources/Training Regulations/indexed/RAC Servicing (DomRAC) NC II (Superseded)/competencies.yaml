ngles\n5.5 Drawing tables\n5.6 Computer\n\n--- PDF PAGE 24 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n22\n\nEVIDENCE GUIDE\n1. Critical aspects\nof Competency\nAssessment requires that the candidate:\n1.1 Identified and determined signs, symbols and data according\nto work plan, job requirements and classifications\n1.2 Identified tools and equipment in accordance with job\nrequirements\n1.3 Listed supplies and materials according to blueprint\nspecifications\n1.4 Drawn workplan following specifications\n1.5 Demonstrated ability to determine job specifications based on\nworking/technical drawing\n2. Required\nKnowledge and\nAttitude\n\n2.1 TRADE MATHEMATICS\n• Linear measurement\n• Dimension\n• Unit conversion\n2.2 BLUEPRINT READING AND PLAN SPECIFICATION\n• Electrical, mechanical plan, symbols and abbreviations\n• Drawing standard symbols\n2.3 TRADE THEORY\n• Basic Technical Drawing\n• Types Technical Plans\n• Various Types of Drawings\n•\nNotes and Specifications\n3. Required skills\n3.1 Interpreting drawing/orthographic drawing\n3.2 Interpreting technical plans\n3.3 Matching specification details with existing resources\n3.4 Following instructions\n3.5 Handling of drawing instruments\n4. Resource\nimplications\nThe following resources should be provided:\n4.1 Workplace\n4.2 Drawings and specification relevant to task\n4.3 Materials and instrument relevant to proposed activity\n5. Methods of\nassessment\nCompetency should be assessed through:\n5.1 Direct Observation\n5.2 Questions/Interview\n5.3 Written test related to required knowledge\n6. Context of\nassessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being undertaken\nwhether individually or in group\n6.3 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 25 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n23\n\n UNIT OF COMPETENCY: OBSERVE PROCEDURES, SPECIFICATIONS\n AND MANUALS OF INSTRUCTION\n\nUNIT CODE\n\n : HVC311201\n\n UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nidentifying, interpreting, applying services to\nspecifications and manuals, and storing manuals.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the Range of Variables\n\n1. Identify and access\nspecification/manuals\n\n1.1 Appropriate manuals are identified and accessed as per\njob requirements\n1.2 Version and date of manual is checked to ensure\ncorrect specification and procedure are identified\n\n2. Interpret manuals\n\n2.1 Relevant sections, chapters of specifications/ manuals\nare located in relations to the work to be conducted\n2.2 Information and procedure in the manual are interpreted\nin accordance to industry practices\n\n3. Apply information in\nmanual\n\n3.1 Manual is interpreted according to job requirements\n3.2 Work steps are correctly identified in accordance with\nmanufacturer's specification\n3.3 Manual data is applied according to the given task\n3.4 All correct sequencing and adjustments are interpreted\nin accordance with information contained on the manual\nor specifications\n4. Store manuals\n4.1 Manual or specification are stored appropriately to\nensure prevention of damage, ready access and\nupdating of information when required in accordance\nwith company requirements\n\n--- PDF PAGE 26 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n24\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Procedures, specifications and\nmanuals of instructions\n\nKinds of Manuals:\n1.1 Manufacturer's Specification Manual\n1.2 Repair Manual\n1.3 Maintenance Procedure Manual\n1.4 Periodic Maintenance Manual\n\n--- PDF PAGE 27 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n25\n\nEVIDENCE GUIDE\n1. Critical aspects\n of Competency\nAssessment requires that the candidate:\n1.1 Identified and accessed specification/manuals as per job\nrequirements\n1.2 Interpreted manuals in accordance to industry practices\n1.3 Applied information in manuals according to the given task\n1.4 Stored manuals in accordance with company requirements\n2. Required\nKnowledge and\nAttitude\n\n2.1 Types of manuals used in HVAC/R sector\n2.2 Identification of symbols used in the manuals\n2.3 Identification of units of measurements\n2.4 Unit conversion\n3. Required Skills\n3.1 Reading and comprehension skills required to identify and\ninterpret construction manuals and specifications\n3.2 Accessing information and data\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 All manuals/catalogues relative to HVAC/R sector\n5. Methods of\nAssessment\nCompetency should be assessed through:\n5.1 Direct Observation\n5.2 Questions/Interview\n\nAssessment of required knowledge and practical skills may be\ncombined\n6. Context for\nAssessment\n6.1 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n6.2 Assessment may be conducted in the workplace or a simulated\nenvironment\n\n--- PDF PAGE 28 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n26\n\nUNIT OF COMPETENCY: PERFORM MENSURATIONS AND CALCULATIONS\n\nUNIT CODE\n : HVC311203\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\n in identifying and measuring objects based on the\nrequired performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the Range of Variables\n1. Select measuring\ninstruments\n\n1.1 Object or component to be measured is identified,\nclassified and interpreted to the appropriate regular\ngeometric shape\n1.2 Measuring tools are selected/identified as per object to\nbe measured or job requirements\n1.3 Correct specifications are obtained from relevant sources\n1.4 Appropriate measuring instruments are selected\naccording to job requirements\n1.5 Alternative measuring tools are used without sacrificing\ncost and quality of work\n2. Carry out\nmeasurements and\ncalculations\n\n2.1 Accurate measurements and calculations are\nobtained to job requirements\n2.2 Alternative measuring tools are used\n without sacrificing cost and quality of work\n2.3 Calculation needed to complete work tasks are\nperformed using the four basic process of addition (+),\nsubtraction (-), multiplication (x) and division (/) including\nbut not limited to: trigonometric functions, algebraic\ncomputations\n2.4 Calculations involving fractions, percentages and mixed\nnumbers are used to complete workplace tasks\n2.5 Numerical computation is self-checked and corrected\nfor accuracy\n2.6 Instruments are read to the limit of accuracy of the tool\n2.7 Systems of measurement identified and converted\naccording to job requirements/ISO\n2.8 Workpieces are measured according to job\nrequirements\n\n--- PDF PAGE 29 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n27\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Geometric Shape\n\nIncluding but I not limited to:\n1.1 Round\n1.2 Square\n1.3 Rectangular\n1.4 Triangle\n1.5 Sphere\n1.6 Conical\n2. Measuring instruments\nIncluding but not limited to:\n2.1 Micrometer (In-out, depth)\n2.2 Vernier caliper (out, inside)\n2.3 Dial gauge with mag, std.\n2.4 Straight edge\n2.5 Thickness gauge\n2.6 Torque gauge\n2.7 Small hole gauge\n2.8 Telescopic gauge\n2.9 Try-square\n2.10 Protractor\n2.11 Combination gauge\n2.12 Steel rule\n2.13 Voltmeter\n2.14 Ammeter\n2.15 Mega-ohmeter\n2.16 KWH meter\n2.17 Gauges\n2.18 Thermometers\n\n3. Measurements and\ncalculations\n\n3.1 Linear\n3.2 Volume\n3.3 Area\n3.4 Wattage\n3.5 Voltage\n3.6 Resistance\n3.7 Amperage\n3.8 Frequency\n3.9 Impedance\n\n--- PDF PAGE 30 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n28\n\nVARIABLE\nRANGE\n\n3.10 Conductance\n3.11 Capacitance\n3.12 Displacement\n3.13 Inside diameter\n3.14 Circumference\n3.15 Length\n3.16 Thickness\n3.17 Outside diameter\n3.18 Taper\n3.19 Out of roundness\n3.20 Oil clearance\n3.21 End play/thrust clearance\n\n--- PDF PAGE 31 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n29\n\nEVIDENCE GUIDE\n1. Critical aspects\n of Competency\nAssessment requires that the candidate:\n1.1 Selected and prepared appropriate measuring instruments\nin accordance with job requirements\n1.2 Performed measurements and calculations according to job\nrequirements/ ISO\n2. Required\nKnowledge and\nAttitude\n\n2.1 TRADE MATHEMATICS/MENSURATION\n• Four fundamental operation\n• Linear measurement\n• Dimensions\n• Unit conversion\n• Ratio and proportion\n• Trigonometric functions\n• Algebraic equations\n3. Required Skills\n3.1 Performing calculation by addition, subtraction, multiplication\nand division: trigonometric functions and algebraic equations\n3.2 Visualizing objects and shapes\n3.3 Interpreting formulas for volume, areas, perimeters of plane\nand geometric figures\n3.4 Proper handling of measuring instruments\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Problems to solve\n4.3 Measuring instrument appropriate to carry out tasks\n4.4 Instructional materials relevant to the propose activity\n\nAssessment of required knowledge and practical skills may be\ncombined\n5. Methods of\nAssessment\nCompetency should be assessed through:\n5.1 Actual demonstration\n5.2 Direct observation\n5.3 Written test/questioning related to required knowledge\n6. Context for\nAssessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group\n6.3 Competency assessment must be undertaken in accordance\nwith the TESDA assessment guidelines\n\n--- PDF PAGE 32 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n30\nUNIT OF COMPETENCY: PERFORM BASIC BENCHWORKS\n\nUNIT CODE\n\n : HVC713202\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\n preparing materials, tools and equipment, lay-outing\n dimensions and performing basic benchwork based\n on the required performance standards.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the Range of Variables\n\n1. Prepare materials,\ntools and equipment\n\n1.1 Work plan is interpreted to determine job requirements\n1.2 Materials, tools and equipment are identified and\nprepared according to job requirements\n1.3 Materials are checked according to the required\nspecifications\n1.4 Tools and equipment conditions are checked following\nthe standard operating procedures (SOPs)\n\n2. Lay-out and mark\ndimensions/features on\nworkplace\n\n2.1 Metallic and non-metallic materials are selected\naccording to the requirements specified in the blueprint\n2.2 Dimensions/features are laid-out/marked according\nto job specifications/blueprint and within the required\ntolerance\n2.3 Dimensions are checked against the actual work plan\n\n--- PDF PAGE 33 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n31\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the Range of Variables\n\n3. Perform required\nbasic metal works\n\n3.1 Work instructions are followed to ensure work safety\n3.2 Basic metal works are performed applying knowledge\non safety procedures and according to job requirements\n3.3 Workpieces are clamped in workholding device to avoid\ndamage and accidents\n3.4 Work pieces are cut, chipped or filed according to\nrequired measurements, tolerance specified in the\nblueprint and free from burrs and sharp edges\n3.5 Drilling is performed according to recommended\nsequence and specifications\n3.6 Proper usage of materials, tools and equipment is\nobserved\n3.7 Appropriate PPE and safety procedures are applied\n3.8 Worksite is cleaned and cleared of all debris and left in\nsafe state in accordance with OHS regulations\n\n--- PDF PAGE 34 ---\nTR RAC SERVICING (DomRAC) NC II\n\n