        "evidence_guide": {
          "source_text": "1. Critical aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Listed materials and tools according to quantity and job\nrequirements\n1.2 Requested materials and tools according to the list\nprepared and as per company standard operating\nprocedures\n1.3 Inspected issued materials and tools as per quantity and\njob specifications\n1.4 Tools provided with appropriate safety devices\n2. Required\nKnowledge\nand Attitude\n\n2.1 Types and uses of HVAC/R materials and tools\n2.2 Different forms\n2.3 Requisition procedures\n\n3. Required Skills\n\n3.1 Preparing materials and tools\n3.2 Proper handling of tools and equipment\n3.3 Following Instructions\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Materials relevant to the unit of competency\n4.3 Technical plans, drawings and specifications relevant\nto the activities\n5. Methods of\nAssessment\n\nCompetency in this unit must be assessed through:\n5.1 Direct observation and oral questioning\n6. Context for\nAssessment\n\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace\n6.2 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 22 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n20\n\n UNIT OF COMPETENCY: INTERPRET TECHNICAL DRAWINGS AND\n PLANS\n\nUNIT CODE\n\n :"
        },
        "source_text": "HVC713201\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nidentifying, requesting and receiving construction\nmaterials and tools based on the required performance\nstandards.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the Range of Variables\n\n1. Identify materials\n\n1.1 Materials are listed as per job requirements\n1.2 Quantity and description of materials conformed to\nthe job requirements\n1.3 Tools and accessories are identified according to job\nrequirements\n\n2. Requisition materials\n\n2.1 Materials and tools needed are requested according to\nthe list prepared\n2.2 Request is done as per company standard operating\nprocedures\n2.3 Substitute materials and tools are provided without\nsacrificing cost and quality of the work\n\n3. Receive and inspect\n materials\n\n3.1 Materials and tools issued are inspected as per\nquantity and specification\n3.2 Tools, accessories and materials checked for\ndamages according to enterprise procedures\n3.3 Materials and tools are set aside to appropriate\nlocation nearest to the workplace\n\n--- PDF PAGE 20 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n18\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Materials and tools\n\n1.1 Air-conditioning\n1.2 Refrigeration\n\n2. Description of materials and\ntools\n\n2.1 Brand name\n2.2 Size\n2.3 Capacity\n2.4 Kind of application\n\n3. Company standard\nprocedures\n\n3.1 Job Order\n3.2 Requisition Slip\n3.3 Borrower Slip\n\n--- PDF PAGE 21 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n19\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof Competency\n\nAssessment requires evidence that the candidate:\n1.1 Listed materials and tools according to quantity and job\nrequirements\n1.2 Requested materials and tools according to the list\nprepared and as per company standard operating\nprocedures\n1.3 Inspected issued materials and tools as per quantity and\njob specifications\n1.4 Tools provided with appropriate safety devices\n2. Required\nKnowledge\nand Attitude\n\n2.1 Types and uses of HVAC/R materials and tools\n2.2 Different forms\n2.3 Requisition procedures\n\n3. Required Skills\n\n3.1 Preparing materials and tools\n3.2 Proper handling of tools and equipment\n3.3 Following Instructions\n4. Resource\nImplications\n\nThe following resources should be provided:\n4.1 Workplace location\n4.2 Materials relevant to the unit of competency\n4.3 Technical plans, drawings and specifications relevant\nto the activities\n5. Methods of\nAssessment\n\nCompetency in this unit must be assessed through:\n5.1 Direct observation and oral questioning\n6. Context for\nAssessment\n\n6.1 Competency may be assessed in the workplace or in a\nsimulated workplace\n6.2 Competency assessment must be undertaken in\naccordance with the endorsed TESDA assessment\nguidelines\n\n--- PDF PAGE 22 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n20\n\n UNIT OF COMPETENCY: INTERPRET TECHNICAL DRAWINGS AND\n PLANS\n\nUNIT CODE\n\n :"
