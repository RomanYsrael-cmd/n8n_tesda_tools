ntory Form Slip\n4.7 Inspection Form Slip\n4.8 Procedures\n\n--- PDF PAGE 42 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n40\nEVIDENCE GUIDE\n1. Critical aspects\n of Competency\nAssessment requires that the candidate:\n1.1 Selected and used appropriate processes, tools and\nequipment to carry out task\n1.2 Identified functional and non-functional tools and equipment\n1.3 Checked, lubricated and calibrated tools, equipment and\n instruments according to manufacturer’s specifications\n1.4 Replaced defective tools, equipment and its accessories\n1.5 Observed and applied safe handling of tools and equipment\nand safety work practices\n1.6 Prepared and submitted inventory report, where applicable\n1.7 Maintained work place in accordance with OHSA regulations\n1.8 Stored tools and equipment safely in appropriate locations\nand in accordance with company practices\n2. Required\nKnowledge\n\n2.1 SAFETY PRACTICES\n• Use of PPE\n• Handling of tools and equipment\n• Good housekeeping\n2.2 MATERIALS, TOOLS AND EQUIPMENT\n• Types and Uses of lubricants\n• Types and Uses of cleaning materials\n• Types and Uses of measuring instruments and equipment\n2.3 PREVENTIVE MAINTENANCE\n• Methods and techniques\n• Procedures\n3. Required\nSkills\n3.1 Preparing maintenance materials, tools and equipment\n3.2 Proper handling of tools and equipment\n3.3 Performing preventive maintenance\n3.4 Following instructions\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Work place\n4.2 Maintenance Schedule\n4.3 Maintenance materials, tools and equipment relevant to the\nproposed activity/task\n5. Methods of\nAssessment\nCompetency should be assessed through:\n5.1 Direct observation\n5.2 Written test/questioning relevant to required knowledge\n6. Context for\nAssessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 43 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n41\n\nUNIT OF COMPETENCY : PERFORM HOUSEKEEPING AND SAFETY\n PRACTICES FOR RAC SERVICING\n\n UNIT CODE\n : HVC7315201\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nneeded to work safely in the workplace including\nsorting, cleaning and dispensing materials, tools and\nequipment, identifying and minimizing hazards,\nresponding and recording accidents and following basic\nsecurity.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the Range of Variables\n\n1. Sort materials, tools\nand equipment\n\n1.1 Materials, tools and equipment are classified\naccording to its kinds\n1.2 Appropriate areas for materials, tools and equipment\nare designated\n\n2. Clean workplace\narea, materials, tools\nand equipment\n\n2.1 Cleaning materials are identified and used\n as per procedure\n2.2 Workplace areas, materials, tools and equipment are\ncleaned as per company practices\n2.3 Workplace are in safe state in accordance with safety\nregulations/company practices\n\n3. Systematize\ndispensing and\nretrieval of materials,\ntools and equipment\n\n3.1 Systems for requesting, borrowing and\n returning of materials, tools and equipment\n is in-place and implemented\n3.2 Forms used are completely filled-up and\n filed\n3.3 Borrowed tools, and equipment are\n returned to designated area\n3.4 Consumable materials are requested in\n exact quantity\n\n--- PDF PAGE 44 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n42\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n4. Identify and\nminimize/ eliminate\nhazards\n\n4.1 Hazards in the work area are recognized and\n reported to designated personnel and\n appropriate control actions are taken\n4.2 Workplace policies and procedures for controlling\nrisks are established and followed accurately\n4.3 Workplace procedures for dealing with emergencies\nare followed whenever necessary within the scope of\nresponsibilities and competencies\n4.4 Safety signs and hazard warnings are displayed\nand observed at all times in line with workplace health\nand safety regulations\n4.5 Equipment and safety devices/PPE are used/handled\naccording to company or manufacturer's procedures\nand guidelines\n4.6 Work areas are kept clean, free from obstacles and\nemergency exits are know and kept clear at all times\n4.7 Safe manual handling/fighting techniques and safe\nequipment operation techniques are employed at all\ntimes\n5. Respond and record\naccidents\n5.1 Workplace accidents are identified\n5.2 Workplace emergency first-aid procedures/\ntreatment are followed/carried out correctly in\naccordance with standards/regulations and\nenterprise procedures/policies\n5.3 Medical assistance/rescue is coordinated with\nconcerned personnel in line with organizational\npolicies\n5.4 Accident/incident records maintained in accordance\nwith standard operating procedures\n6. Follow basic security\n6.1 Security policies/procedures are followed according\nto enterprise practices and appropriate legislation\n6.2 Security related events are recorded/reported on the\nrelevant forms\n6.3 Staff are advised of enterprise security procedures\nand correct methods of implementation\n\n--- PDF PAGE 45 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n43\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Hazards\n\nHazards that may be present in the workplace\ninclude but not limited to:\n1.1 Flammable materials\n1.2 Running machinery/equipment\n1.3 Toxic substances\n1.4 Debris\n1.5 Open flames\n1.6 Loose objects/fixtures\n1.7 Chemicals\n1.8 Electrical faults\n1.9 Hot metals\n\n2. Emergencies\n\nEmergencies may include but not limited to:\n4.9 Fire\n4.10 Explosion\n4.11 Spills\n4.12 Falls\n4.13 Electrocution\n4.14 Injuries caused by falling objects\n4.15 Injuries caused by sharp objects\n4.16 Injuries caused by wrong usage of tools\n\n3. Safety signs, symbols and\nhazard warnings\n\nSafety signs and symbols include but not limited to:\n3.1 Industry recognized hazard warning signs and\nsafety symbols\n-\nDanger-High Voltage\n-\nUnauthorized Persons Keep Out\n-\nNo Smoking\n-\nPoisonous Gases\n-\nCaution - Men working on line wires\n3.2 Internationally recognized hazard warning signs\nand safety symbols\n\n--- PDF PAGE 46 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n44\n\nVARIABLE\nRANGE\n\n4. Personal Protective\nEquipment (PPE)\n\nPPE may include but not limited to:\n\n4.17 Goggles\n4.18 Gas mask\n4.19 Working gloves\n4.20 Safety shoes\n4.21 Face shield\n4.22 Insulating mat\n4.23 Over-all apron\n4.24 Hard hat\n4.25 Safety belt\n4.26 Protective eyewear\n\n5. First-aid Treatment\n\nFirst-aid treatment includes but is not limited to:\n5.1 CPR\n5.2 Mouth to mouth resuscitation\n5.3 Application of tourniquet\n5.4 Application of pressure to bleeding wounds or\ncuts\n5.5 First-aid treatment for burned victims\n6. Standards and Regulations\n6.1 Philippine Electrical Code\n6.2 Philippine OH&S Standards\n6.3 Building Code\n6.4 Philippine Environmental Standards\n6.5 Welding Procedures Specifications\n6.6 Clean Air Act\n\n7. Security policies\n\n7.1 Wearing of ID\n7.2 Logging-in and out\n7.3 Wearing of uniform\n7.4 Observance of safety/security signs and\nsymbols\n\n--- PDF PAGE 47 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n45\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires that the candidate:\n1.1 Classified materials, tools and equipment according to kind\n1.2 Cleaned workplace areas, materials, tools and equipment\nas per standard procedures\n1.3 Implemented systematize dispensing and retrieval of\nmaterials, tools and equipment\n1.4 Identified and described safety working practices relating to\nall tasks undertaken in the workplace\n1.5 Identified and selected appropriate equipment and safety\ndevices for particular workplace tasks and activities\n1.6 Interpreted hazard warnings and safety signs correctly and\ndescribed the application of these warnings and signs in the\nwork activities\n1.7 Workplace emergency first-aid procedures/treatment are\ncarried out in accordance with OHSA standards/legislation\nand enterprise procedures\n1.8 Responded/maintained accidents/incidents records in\naccordance with SOPs\n1.9 Followed security procedures/policies in accordance with\nenterprise practices and legislation\n1.10 Workplace kept in safe state in accordance with safety\n regulations\n2. Required\nKnowledge and\nAttitude\n\n2.1 Kinds and Uses of PPE\n2.2 Identification of Safety Signs and Symbols\n2.3 5S of Good Housekeeping\n2.4 General OH&S principles, responsibilities and legislations\n2.5 OH&S requirements in relations to work safety\n2.6 Environmental requirements relative to work safety\n2.7 Hazard identification and avoidance in the workplace\n2.8 First-aid treatment procedures\n2.9 Kinds of emergency situations – causes and how to deal\nwith different situations\n2.10 Kinds of injuries and effects\n2.11 Accident/hazard reporting\n2.12 Basic security procedures\n2.13 Uses of Manuals\n3. Required Skills\n3.1 Wearing the appropriate PPE\n3.2 Reading skills required to interpret work instruction\n3.3 Identifying safety signs and symbols\n3.4 Practice of CPR, Mouth to Mouth Resuscitation and other\nFirst-Aid Treatment\n3.5 Problem solving in emergency situation\n3.6 Handling injured worker\n3.7 Coordination of work in times of emergency\n3.8 Fire fighting procedures and techniques\n3.9 Reporting/recording accidents and potential hazards\n\n--- PDF PAGE 48 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n46\n\n4. Resource\nImplications\nThe following resources should be provided:\n4.1 Work place\n4.2 Materials, tools and equipment relevant to the proposed\nactivity/task\n4.3 Safety signs\n4.4 Safety devices\n4.5 Accident reporting procedures\n4.6 First-aid materials and guidelines\n5. Methods of\nAssessment\nCompetency should be assessed through:\n5.1 Direct observation while task is being undertaken\n5.2 Written test/questioning relevant to required knowledge\n\nAssessment of required knowledge and practical skills may be\ncombined\n6. Context for\nAssessment\n6.1 Competency assessment may occur in workplace or any\nappropriate simulated environment\n6.2 Assessment shall be observed while task are being\nundertaken whether individually or in group in accordance\nwith the approved industry OHSA regulations\n6.3 Competency assessment must be undertaken in accordance\nwith the endorsed TESDA assessment guidelines\n\n--- PDF PAGE 49 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n47\n\nUNIT OF COMPETENCY: DOCUMENT WORK ACCOMPLISHED\n\nUNIT CODE\n\n : HVC311205\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\ndocumenting work accomplished.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the Range of Variables\n1. Identify forms and\ndata\n1.1 Forms are selected based on the reports to be\nprepared\n1.2 Data are collected based on the reports to be prepared\n\n2. Prepare reports\n\n2.1 Reports are completed using standard form as per\ncompany procedures\n2.2 Reports provide details of work completed, further\naction to be taken and other details as per company\nprocedures\n2.3 Reports are completed and submitted within specified\ntime to the concerned personnel/supervisor\n\n--- PDF PAGE 50 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n48\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Forms\n\n1.1 Warranty Paper Request\n1.2 Operating Log Sheet\n1.3 Requisition Forms\n\n2. Data\n\n2.1 Current draw\n2.2 Operating\n2.3 Unit specifications\n2.4 Records of work accomplished\n2.5 Further work required\n2.6 Spare parts used\n\n3. Reports\n\n3.1 Start-up commissioning Report\n3.2 Warranty Paper Request\n3.3 Turn-over Report\n3.4 Operating Log Sheet\n3.5 Service Report\n3.6 Trouble Call Report\n3.7 Requisition\n\n--- PDF PAGE 51 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n49\n\nEVIDENCE GUIDE\n1. Critical aspects\nof Competency\nCompetency requires evidence that the candidate:\n1.1 Prepared reports used terminology and language\nappropriate to all users\n1.2 Prepared reports to include alternatives, views, approaches\nand other findings and recommendations for consideration\nby the supervisor\n1.3 Prepared reports are coherent and based on actual\nfindings/analysis/results\n1.4 Prepared reports are accomplished, completed as per\nstandard format and submitted within specified time to the\nconcerned supervisor\n2. Required\nKnowledge\n2.1 SOURCES OF INFORMATION\n• Service manual\n• Parts catalogue\n• Service report\n• Price estimates/quotation\n• Warranty card\n• Types and Uses of Forms\n•Parts and Accessories\n3. Required Skills\n3.1 Writing skills needed to complete prepared report forms\n3.2 Reading skills used to read manuals and specifications\n4. Resource\nImplications\nThings necessary to conduct method of assessment:\n4.1 Work place location\n4.2 Materials relevant to the proposed activity\n5. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n5.1 Direct observation\n5.2 Questions related to required knowledge\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 52 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n50\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY: INSTALL DOMESTIC REFRIGERATION AND AIR-\nCONDITIONING (DomRAC) UNITS\n\nUNIT CODE : HVC723337\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes\nrequired to safely install and test domestic refrigeration\nand air-conditioning (DomRAC) units. It includes\nconducting survey for installation, installing DomRAC\nunit and its electrical circuit as well as conducting\nperformance testing.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the Range of Variables\n1. Conduct survey\n1.1. Site conditions and installation requirements are\nassessed according to manufacturer’s specification\nand prevailing codes and ordinances.\n1.2. Tools, equipment and materials needed for\ninstallation are determined according to site\nconditions and site installation requirements.\n1.3. Survey result is reported in accordance with\nenterprise policies and procedures\n\n2. Install DomRAC\nelectrical circuit\n2.1. Roughing-in activities are performed in accordance with\nthe applicable Philippine Electrical Code (PEC) provisions\n2.2. Electrical cabling and wiring devices of correct load\ncarrying capacity are selected and safely installed in line\nwith manufacturer's instructions\n2.3. Power wiring is installed in accordance with applicable\nPEC provisions\n2.4. Electrical circuit is tested in accordance with applicable\nPEC provisions\n\n3. Install DomRAC\nunit\n3.1. Unit and equipment/components are prepared based on\nwork procedures\n3.2. Bracket, hangers and frames are installed in accordance\nwith manufacturer’s recommendation and/or RAC Code of\nPractice\n3.3. Unit is positioned and leveled in line with manufacturer's\ninstructions and/or RAC Code of Practice\n3.4. Sealing materials are installed to ensure an air tight seal\naround the unit in line with manufacturer's instructions\nand/or RAC Code of Practice\n3.5. Condensate drain is installed in accordance with\nmanufacturer’s recommendation and/or RAC Code of\nPractice\n3.6. Safe manual handling techniques are employed in line with\nenterprise OH&S procedures\n3.7. 5’s is exercised in line with enterprise policy\n\n--- PDF PAGE 53 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n51\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the Range of Variables\n4. Conduct\nperformance test\n4.1. Voltage and current are measured according to unit\npower requirements.\n4.2. Air temperature and velocity are measured based on\nunit specifications.\n4.3. Sounds and vibration are checked based on unit\nspecifications\n4.4. Service report is accomplished in line with enterprise\npolicies and procedures.\n\n--- PDF PAGE 54 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n52\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. site conditions\n\nSite conditions may include:\n1.1. assessment of structural and architectural\ninstallation provisions\n1.2. assessment of availability of power source and\nunit’s electrical provisions\n1.3. assessment of wall finishing provisions\n1.4. assessment of drainage provisions\n1.5. assessment of air circulation/ ventilation\nprovision\n2. installation requirements\nInstallation requirements may include:\n2.1. installation location requirements\n2.2. wall finishing requirements\n2.3. Electrical requirements\n• A/C plug and outlet\n• Wire size\n• Protection devices\n• Grounding\n3. Tools and equipment\nTools and equipment may include:\n3.1. Measuring tools\n3.2. Spirit level\n3.3. Plumb bob\n3.4. Clear/Transparent water hose\n3.5. Screw driver, flat and philip\n3.6. Chisel\n3.7. Hammer (claw and ballpeen)\n3.8. Hacksaw\n3.9. Electric drill\n3.10. Drill bits\n3.11. Cross cut/Rip saw\n3.12. Welding equipment\n3.13. Masonry tools (e.g. trowel, spade, level, etc.)\n4. Materials\nMaterials includes:\n4.1. Expansion bolt\n4.2. Welding electrode (rod)\n4.3. Sealant\n4.4. Electrical cable/conduction\n4.5. Convenience outlet\n4.6. Electrical railways\n4.7. Circuit breaker/switch\n4.8. Masonry materials (e.g. cement, sand, etc.)\n\n--- PDF PAGE 55 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n53\n\n5. Wiring devices\nMay include:\n5.1. Service grounding\n5.2. Service outlet\n5.3. Service plug\n6. Unit\nUnit includes:\n6.1. Window type air-conditioner\n6.2. Domestic Refrigeration unit (e.g. refrigerator,\nwater cooler, household freezer, etc.)\n7. Sealing materials\nMay include:\n7.1. Rubber gasket\n7.2. Foam\n7.3. Plastic\n7.4. Silicone\n8. Condensate drain\nMay include:\n8.1. PVC pipe/clamp\n8.2. Plastic tubing/clamp\n8.3. G.I. or metal tubing/clamp\n9. OH&S procedures\nMay include:\n• Wearing of PPE\n• Lifting procedures\n• Ladder safety\n• Housekeeping\n10. Service report\nMay include:\n• Installation report\n• Testing report\n• Commissioning report\n\n--- PDF PAGE 56 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n54\n\n EVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Assessed site conditions for DomRAC installation\n1.2. Installed electrical circuit\n1.3. Installed unit\n1.4. Tested unit\n1.5. Performed housekeeping\n2. Required\nKnowledge and\nAttitude\n\n2.1 SAFETY PRACTICES\n•\nProtective personal\nequipment/safety gears\n•\nHandling of tools, equipment\nand accessories\n•\nSafety signs and symbols\n•\nGood housekeeping\n2.2 TRADE MATHEMATICS/\nMENSURATION\n•\nLinear measurements\n•\nRatio and proportion\n•\nUnit conversion\n2.3 BLUEPRINT READING AND\nPLAN SPECIFICATION\n•\nElectrical plans, symbols and\nabbreviations\n\n2.4 MATERIALS, TOOLS:\nUSES AND\nSPECIFICATIONS\n•\nTypes of sealant\n•\nTypes of insulation\n•\nTypes of wires, conduits\nand fittings\n•\nTypes of wiring device\n2.5 TRADE THEORY\n•\nBasic refrigeration cycle\n•\nBasic electricity\n•\nBasic masonry\n•\nBasic carpentry\n•\nBasic plumbing\n•\nBasic arc welding\n2.6 MAINTENANCE\n•\nPreventive Maintenance\n2.7 LEGISLATION\n•\nRAC Code of Practice\n•\nPhilippine Electrical Code\n3. Required Skills\n\n3.1 Interpreting plans and details\n3.2 Preparing materials\n3.3 Proper handling of tools and equipment\n3.4 Working safely\n3.5 Installing window-type air-conditioning and domestic\nrefrigeration unit\n3.6 Testing power supply\n3.7 Connecting power circuit\n3.8 Operating window-type air-conditioning unit and domestic\nrefrigeration unit\n3.9 Communicating effectively\n4. Resource\nImplications\nThe following resources must be provided:\n4.1 Access to work place location/installation area\n4.2 Tools and equipment appropriate to installation\n4.3 Materials relevant to the proposed activity/task\n4.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Demonstration/Direct observation with oral questioning\n5.2 Portfolio\n5.3 Third party report\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 57 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n55\n\nUNIT OF COMPETENCY: SERVICE AND MAINTAIN DOMESTIC\nREFRIGERATION AND AIR-CONDITIONING\n(DomRAC) UNITS\n\nUNIT CODE : HVC723338\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes in\nservicing and maintaining domestic refrigeration and\nair-conditioning units. Specifically it includes cleaning\nand replacing air filters, servicing evaporator/\ncondenser, maintaining fan motor assembly, servicing\nelectrical power and control circuits as well as\naccomplishing service and maintenance report.\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the Range of Variables\n1. Clean and replace\nair filter\n1.1 Air filter is identified and removed following standard\nprocedures\n1.2 Filter is checked for damage and replaced if required\nin line with SOPs\n1.3 Air filter is cleaned using the correct tools and\ncleaning procedures\n1.4 Filter is replaced in accordance with filter\nspecifications\n\n2. Service evaporator/\ncondenser\n2.1 Tools are selected in dismantling the evaporator/\ncondensing unit as per standard operating\nprocedures (SOPs)\n2.2 High pressure washer is used in cleaning evaporator/\ncondensing coil based on established procedures\n2.3 Evaporator/condenser coil fins are straightened in\naccordance with service procedure\n2.4 Cleaning agent or non-corrosive chemical is used in\ncleaning and maintaining evaporator/ condensing coil,\nfins and other body accessories as per standard\noperating procedures (SOPs)\n3. Maintain fan motor\nassembly\n3.1 Fan motor is maintained in line with manufacturer’s\ninstructions.\n3.2 Fan blades and blower are serviced and maintained\nin line with manufacturer’s instructions.\n3.3 Fan motor terminals are checked and serviced in line\nwith manufacturer’s instructions.\n3.4 Fan motor mounting is checked and serviced in line\nwith manufacturer’s instructions.\n\n--- PDF PAGE 58 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n56\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the Range of Variables\n4. Service electrical\npower and control\ncircuits\n4.1 Proper instrument is used in checking power supply\nand diagnosing electrical control\n4.2 Loose connections/wirings are repaired and reported\nin line with SOP\n4.3 Plugs and outlets are checked in line with SOP\n4.4 Grounding is checked in line with SOP\n5. Accomplish service\nand maintenance\nreport\n5.1 All defects and problems encountered are reported in\nline with enterprise policies and procedures.\n5.2 Observation and recommendation are properly\nreported in line with enterprise policies and\nprocedures.\n\n--- PDF PAGE 59 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n57\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Air filter\n\n1.1. Disposable\n1.2. Reusable\n\n2. Cleaning agent\n\n2.1. Soap powder\n2.2. Liquid soap\n\n3. Other body accessories\n\n3.1. base pan\n3.2. drip tray\n3.3. shroud\n3.4. face cover\n3.5. housing\n3.6. propeller blade\n3.7. centrifugal fan (blower)\n4. proper instrument\nMay include:\n• clamp meter\n• VOM multi-tester\n\n--- PDF PAGE 60 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n58\n\nEVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n1.1. Cleaned and/or replaced air filter parts/components\n1.2. Cleaned evaporator/condensing coil\n1.3. Maintained fan motor assembly\n1.4. Serviced electrical power and control circuits\n1.5. Accomplished service report.\n\n2. Required\nKnowledge\n\n2.1 SAFETY PRACTICES\n• Protective personal\nequipment/safety gears\n• Handling of tools,\nequipment and accessories\n• Safety signs and symbols\n• Good housekeeping\n2.2 MATERIALS AND\nTOOLS: USES AND\nSPECIFICATIONS\n• Types of lubricants\n• Parts of refrigerant circuit\n• Cleaning agents\n\n2.3 EQUIPMENT\n• Pressure washer\n• Clamp meter\n• VOM multi-tester\n\n2.4 TRADE THEORY\n• Electrical/electric controls\n• Basic\nelectricity/electronics\n• Fundamentals of\nrefrigeration cycle\n• Fan motors\n• Motor compressor\n• Refrigeration system\n2.5 PROCESSES\n• Cleaning procedures\n• Servicing and\nmaintenance procedures\n2.6 LEGISLATION\n• RAC Code of Practice\n• PEC\n3. Required\nSkills\n3.1 Interpreting diagrams\n3.2 Preparing materials\n3.3 Proper handling of tools and equipment\n3.4 Testing electrical system\n3.5 assembling and disassembling\n3.6 inter-personal skills\n\n4. Resource\n Implications\nThe following resources must be provided:\n4.1 Access to work place location\n4.2 Tools and equipment\n4.3 Materials relevant to the proposed activity\n4.4 service manual\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation/demonstration with oral questioning\n5.2 Portfolio\n5.3 Third party results\n\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 61 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n59\n\nUNIT OF COMPETENCY: TROUBLESHOOT AND REPAIR DOMESTIC\nREFRIGERATION AND AIR-CONDITIONING\n(DomRAC) SYSTEMS\n\nUNIT CODE\n : HVC723339\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to\nidentify and analyze faults and troubles found in\nDomRAC systems. It also covers identifying and\nrepairing faults/troubles, performing refrigerant\nrecovery/ recycling and retrofitting on domestic\nrefrigeration and air-conditioning unit as well as\nperforming test-run on repaired DomRAC units. .\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the Range of Variables\n1. Plan and prepare\nfor troubleshooting\nand repair\n1.1 Appropriate wiring diagrams, charts and manuals are\ninterpreted in line with the job requirements\n1.2 Appropriate materials, tools and equipment are\nselected based on job requirements\n1.3 Power supply is checked to ensure compliance with\nnameplate rating and/or manufacturer’s specifications\n\n2. Identify and repair\nfaults/troubles\n\n2.1. Appropriate PPE are selected and used in line with job\nrequirements\n2.2. Components are tested following manufacturer’s\nmanual, RAC Code of Practice and/or enterprise\ntroubleshooting policy\n2.3. Faults/problems with components are diagnosed in line\nwith manufacturer’s manual, RAC Code of Practice\nand/or enterprise troubleshooting policy\n2.4. Remedial action is taken to overcome faults/problems\nin line manufacturer’s manual, RAC Code of Practice\nand/or enterprise troubleshooting policy\n2.5. Work is completed safely in line with workplace safety\nguidelines\n2.6. Report on testing procedure, including faults and minor\nrepair, is completed in line with manufacturer’s manual,\nRAC Code of Practice and/or enterprise\ntroubleshooting policy\n\n--- PDF PAGE 62 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n60\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the Range of Variables\n\n3. Perform refrigerant\nrecovery/recycling\nand retrofitting/\nconversion on\ndomestic\nrefrigeration and air-\nconditioning unit\n3.1 Safe working practices are observed throughout the\ntask as per enterprise procedure\n3.2 Suitable tools and equipment are selected and used\nbased on job requirement\n3.3 Optimum recovery of refrigerant is performed in line\nwith RAC Code of Practice\n3.4 Refrigerants recovery/recycling is performed according\nto manufacturer's recommendations and RAC Code of\nPractice\n3.5 Retrofitting is performed based on RAC Code of\nPractice\n3.6 Conversion is performed based on UN Conversion\nManual.\n\n4. Test-run repaired\nunit\n\n2.7. Unit is tested in line with troubleshooting procedures\n2.8. Report on repair and testing of unit is prepared in line\nwith enterprise procedures\n\n--- PDF PAGE 63 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n61\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Components\nMay include but not limited to:\n1.1. Electrical controls\n- Thermostat\n- Defrost timer\n- Relay\n- Thermo disc/Defrost thermostat\n- Switches\n- Overload protector\n1.2. Compressor motor\n1.3. Fan motors\n1.4. Refrigerator defrost heater\n1.5. Capacitor\n2. PPE\nIncludes but not limited to:\n2.1. Mask\n2.2. Safety shoes\n2.3. Safety goggles\n2.4. Apron\n2.5. Gloves\n3. Test\nMay include:\n3.1. Insulation\n3.2. Resistance\n3.3. Mechanical\n3.4. Continuity\n3.5. Timing Sequence\n3.6. Leak\n\n--- PDF PAGE 64 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n62\n\n EVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n\n1.1\nDiagnosed DomRAC faults/problems\n1.2\nRecover/Recycle refrigerants\n1.3\nRepaired and Retrofitted DomRAC\n1.4\nTested Unit\n1.5\nAccomplished Service Report\n2. Required\nKnowledge\n\n2.1 SAFETY PRACTICES\n•\nProtective personal\nequipment/safety gears\n•\nHandling of tools,\nequipment and accessories\n•\nSafety signs and symbols\n•\nGood housekeeping\n2.2 BLUEPRINT READING\nAND PLAN\nSPECIFICATION\n• Schematic diagrams\n2.3 MATERIALS AND\nTOOLS: USES AND\nSPECIFICATIONS\n• Piercing valve\n• Refrigerants\n• Refrigeration oil\n• Refrigeration accessories\n\nEquipment\n• Recovery machine\n• Gauge manifold\n• Vacuum pump\n• Refractometer\n• Weighing Scale\n• Vacuumeter\n• Refrigerant identifier\n• Thermometer\n• Leak detector\n• Clamp meter\n\n2.4 TRADE THEORY\n• Basic Electricity\n• Basic electronics\n• Refrigeration principles\n• Instrumentation\n\n2.5 PROCESSES/\nPROCEDURES\n• Recovery/Recycling\n• Retrofitting\n• Conversion\n• Motor insulation testing\nprocedure\n• Wiring resistance testing\nprocedure\n• Mechanical testing\nprocedure\n• Compressor construction\n• Electrical system analysis\n• Mechanical system analysis\n2.6 LEGISLATION\n•\nEnvironmental Protection\nAgency (EPA) Section 608\n•\nDENR-EMB DAO No. 2004-08\n•\n19th MOP decision XIX/6 of the\nMontreal Protocol on\nSubstances that Depletes the\nOzone Layer\n•\nKyoto Protocol\n•\nRAC Code of Practice\n•\nUN Climate Change\nFramework\n•\nRepublic Act 9729 sec\n3.k,3.l,3.m,3.n,3.0\n• UN Conversion Manual\n\n--- PDF PAGE 65 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n63\n3. Required Skills 3.1 Interpreting schematic diagram\n3.2 Preparing materials\n3.3 Proper handling of electrical tools/equipment\n3.4 Testing electrical system\n3.5 Testing mechanical system\n3.6 Tube processing\n3.7 Proper handling of refrigerant and refrigeration oil\n3.8 Recovery/recycling refrigerants\n3.9 Retrofitting\n3.10 System reprocess\n4. Resource\nImplications\n\nThe following resources must be provided:\n4.1 access to work place location and mockup unit\n4.2 Tools and equipment appropriate to troubleshooting and\nrepair\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Demonstration/Direct observation with oral questioning\n5.2 Portfolio\n5.3 Third party report\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 66 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n64"
