vation and recommendation are properly \nreported in line with enterprise policies and \nprocedures.\n\n--- PDF PAGE 59 ---\nTR RAC SERVICING (DomRAC)  NC II \n \nRevised  October 2011 \n57\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1. Air filter \n \n1.1. Disposable \n1.2. Reusable \n \n2. Cleaning agent \n \n2.1. Soap powder \n2.2. Liquid soap \n \n3. Other body accessories \n \n3.1. base pan \n3.2. drip tray  \n3.3. shroud \n3.4. face cover \n3.5. housing \n3.6. propeller blade \n3.7. centrifugal fan (blower) \n4. proper instrument \nMay include: \n clamp meter \n VOM multi-tester\n\n--- PDF PAGE 60 ---\nTR RAC SERVICING (DomRAC)  NC II \n \nRevised  October 2011 \n58"
