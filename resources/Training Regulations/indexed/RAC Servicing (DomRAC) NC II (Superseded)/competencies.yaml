        "source_title": "PERFORM HOUSEKEEPING AND SAFETY PRACTICES FOR RAC SERVICING",
        "source_text": "--- PDF PAGE 43 ---\nTR RAC SERVICING (DomRAC)  NC II \n \nRevised  October 2011 \n41\n \n \nUNIT OF COMPETENCY  :  PERFORM HOUSEKEEPING AND SAFETY   \n                                              PRACTICES FOR RAC SERVICING \n \n UNIT CODE  \n        :   HVC7315201 \n \nUNIT DESCRIPTOR        :  This unit covers the knowledge, skills and attitudes \nneeded to work safely in the workplace including  \nsorting, cleaning and dispensing materials, tools and \nequipment, identifying and minimizing hazards, \nresponding and recording accidents and following basic \nsecurity. \n \nELEMENT \nPERFORMANCE CRITERIA \nBold & Italicized fonts are elaborated in the Range of Variables\n \n1.   Sort materials, tools \nand equipment \n \n \n \n1.1  Materials, tools and equipment are    classified \naccording to its kinds \n1.2  Appropriate areas for materials, tools and equipment \nare designated \n \n2.  Clean workplace \narea, materials, tools \nand equipment \n \n \n2.1 Cleaning materials are identified and used  \n       as per procedure \n2.2 Workplace areas, materials, tools and equipment are \ncleaned as per company practices \n2.3  Workplace are in safe state in accordance with safety \nregulations/company practices \n \n3.  Systematize \ndispensing and      \nretrieval of materials, \ntools and equipment \n \n3.1 Systems for requesting, borrowing and  \n       returning of materials, tools and equipment  \n       is in-place and implemented \n3.2 Forms used are completely filled-up and  \n       filed \n3.3  Borrowed tools, and equipment are  \n       returned to designated area \n3.4  Consumable materials are requested in  \n       exact quantity\n\n--- PDF PAGE 44 ---\nTR RAC SERVICING (DomRAC)  NC II \n \nRevised  October 2011 \n42\nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the  Range of Variables\n4.  Identify and \nminimize/ eliminate \nhazards \n \n4.1 Hazards in the work area are recognized and  \n       reported to designated personnel and   \n       appropriate control actions are taken \n4.2  Workplace policies and procedures for controlling \nrisks are established and followed accurately \n4.3   Workplace procedures for dealing with emergencies \nare followed whenever necessary within the scope of \nresponsibilities and competencies \n4.4  Safety signs and hazard warnings are displayed \nand observed at all times in line with workplace health \nand safety regulations  \n4.5  Equipment and safety devices/PPE  are used/handled \naccording to company or manufacturer's procedures \nand guidelines \n4.6  Work areas are kept clean, free from obstacles and \nemergency exits are know and kept clear at all times \n4.7  Safe manual handling/fighting techniques and safe \nequipment operation techniques are employed at all \ntimes\n5.  Respond and record \naccidents \n5.1 Workplace accidents are identified \n5.2  Workplace emergency first-aid procedures/ \ntreatment are followed/carried out correctly in \naccordance with standards/regulations and \nenterprise procedures/policies \n5.3  Medical assistance/rescue is coordinated with \nconcerned personnel in line with organizational \npolicies \n5.4  Accident/incident records maintained in accordance \nwith standard operating procedures\n6.  Follow basic security\n6.1  Security policies/procedures are followed  according \nto enterprise practices and appropriate legislation \n6.2  Security related events are recorded/reported on the \nrelevant forms \n6.3  Staff are advised of enterprise security procedures \nand correct methods of implementation\n\n--- PDF PAGE 45 ---\nTR RAC SERVICING (DomRAC)  NC II \n \nRevised  October 2011 \n43\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n \n1.  Hazards \n \nHazards that may be present in the workplace \ninclude but not limited to: \n1.1 Flammable materials \n1.2 Running machinery/equipment \n1.3 Toxic substances  \n1.4 Debris \n1.5 Open flames \n1.6 Loose objects/fixtures \n1.7 Chemicals \n1.8 Electrical faults \n1.9 Hot metals \n \n2.  Emergencies \n \nEmergencies may include but  not limited to: \n4.9 Fire \n4.10 Explosion \n4.11 Spills \n4.12 Falls \n4.13 Electrocution \n4.14 Injuries caused by falling objects \n4.15 Injuries caused by sharp objects \n4.16 Injuries caused by wrong usage of tools \n \n3.  Safety signs, symbols  and \nhazard warnings \n \nSafety signs and symbols include but  not limited to: \n3.1 Industry recognized hazard warning signs and \nsafety symbols \n- \nDanger-High Voltage \n- \nUnauthorized Persons Keep Out \n- \nNo Smoking \n- \nPoisonous Gases \n- \nCaution - Men working on line wires \n3.2 Internationally recognized hazard warning signs \nand safety symbols\n\n--- PDF PAGE 46 ---\nTR RAC SERVICING (DomRAC)  NC II \n \nRevised  October 2011 \n44\n \n \n \nVARIABLE \nRANGE \n \n4.  Personal Protective \nEquipment (PPE) \n \nPPE may include but not limited to: \n \n4.17 Goggles \n4.18 Gas mask \n4.19 Working gloves \n4.20 Safety shoes \n4.21 Face shield \n4.22 Insulating mat \n4.23 Over-all apron \n4.24 Hard hat \n4.25 Safety belt \n4.26 Protective eyewear \n \n5.  First-aid Treatment \n \nFirst-aid treatment includes but is not limited to: \n5.1 CPR \n5.2 Mouth to mouth resuscitation \n5.3 Application of tourniquet \n5.4 Application of pressure to bleeding wounds or \ncuts \n5.5 First-aid treatment for burned victims \n6.  Standards and Regulations \n6.1 Philippine Electrical Code \n6.2 Philippine OH&S Standards \n6.3 Building Code \n6.4 Philippine Environmental Standards \n6.5 Welding Procedures Specifications \n6.6 Clean Air Act \n \n7.  Security policies \n \n7.1 Wearing of ID \n7.2 Logging-in and out \n7.3 Wearing of uniform \n7.4 Observance of safety/security signs and \nsymbols\n\n--- PDF PAGE 47 ---\nTR RAC SERVICING (DomRAC)  NC II \n \nRevised  October 2011 \n45\nEVIDENCE GUIDE \n1. Critical aspects of \nCompetency \nAssessment requires that the candidate: \n1.1 Classified materials, tools and equipment according to kind \n1.2 Cleaned workplace areas, materials, tools and equipment \nas per standard procedures \n1.3 Implemented systematize dispensing and retrieval of \nmaterials, tools and equipment \n1.4 Identified and described safety working practices relating to \nall tasks undertaken in the workplace \n1.5 Identified and selected appropriate equipment and safety \ndevices for particular workplace tasks and activities \n1.6 Interpreted hazard warnings and safety signs correctly and \ndescribed the application of these warnings and signs in the \nwork activities \n1.7 Workplace emergency first-aid procedures/treatment are \ncarried out in accordance with OHSA standards/legislation \nand enterprise procedures \n1.8 Responded/maintained accidents/incidents records in \naccordance with SOPs \n1.9 Followed security procedures/policies in accordance with \nenterprise practices and legislation \n1.10 Workplace kept in safe state in accordance with safety  \n        regulations\n2. Required \nKnowledge and \nAttitude \n \n \n \n \n \n \n \n2.1 Kinds and Uses of PPE  \n2.2 Identification of  Safety Signs and Symbols \n2.3 5S of Good Housekeeping \n2.4 General OH&S principles, responsibilities and legislations \n2.5 OH&S requirements in relations to work safety \n2.6 Environmental requirements relative to work safety \n2.7 Hazard identification and avoidance in the workplace \n2.8 First-aid treatment procedures \n2.9 Kinds of emergency situations – causes and how to deal \nwith different situations \n2.10  Kinds of injuries and effects \n2.11 Accident/hazard reporting \n2.12 Basic security procedures \n2.13  Uses of Manuals\n3.  Required Skills \n3.1 Wearing the appropriate PPE \n3.2 Reading skills required to interpret work instruction \n3.3 Identifying safety signs and symbols \n3.4 Practice of CPR, Mouth to Mouth Resuscitation and other \nFirst-Aid Treatment \n3.5 Problem solving in emergency situation \n3.6 Handling injured worker \n3.7 Coordination of work in times of emergency \n3.8 Fire fighting procedures and techniques \n3.9  Reporting/recording accidents and potential hazards\n\n--- PDF PAGE 48 ---\nTR RAC SERVICING (DomRAC)  NC II \n \nRevised  October 2011 \n46\n \n \n \n \n4.  Resource  \nImplications \nThe following resources should be provided: \n4.1  Work place \n4.2 Materials, tools and equipment relevant to the proposed \nactivity/task \n4.3 Safety signs \n4.4 Safety devices \n4.5 Accident reporting procedures \n4.6 First-aid materials and guidelines \n5.  Methods of \nAssessment \nCompetency should be assessed through: \n5.1  Direct observation while task is being undertaken \n5.2  Written test/questioning relevant to required knowledge \n \nAssessment of required knowledge and practical skills may be \ncombined \n6.  Context for \nAssessment \n6.1 Competency assessment may occur in workplace or any \nappropriate  simulated environment \n6.2  Assessment shall be observed while task are being \nundertaken whether individually or in group in accordance \nwith the approved industry OHSA regulations \n6.3  Competency assessment must be undertaken in accordance \nwith the endorsed TESDA assessment guidelines\n",
