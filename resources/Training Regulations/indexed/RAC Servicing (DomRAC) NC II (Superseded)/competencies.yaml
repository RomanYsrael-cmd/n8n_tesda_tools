        "evidence_guide": {
          "source_text": "1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n\n1.1\nDiagnosed DomRAC faults/problems\n1.2\nRecover/Recycle refrigerants\n1.3\nRepaired and Retrofitted DomRAC\n1.4\nTested Unit\n1.5\nAccomplished Service Report\n2. Required\nKnowledge\n\n2.1 SAFETY PRACTICES\n•\nProtective personal\nequipment/safety gears\n•\nHandling of tools,\nequipment and accessories\n•\nSafety signs and symbols\n•\nGood housekeeping\n2.2 BLUEPRINT READING\nAND PLAN\nSPECIFICATION\n• Schematic diagrams\n2.3 MATERIALS AND\nTOOLS: USES AND\nSPECIFICATIONS\n• Piercing valve\n• Refrigerants\n• Refrigeration oil\n• Refrigeration accessories\n\nEquipment\n• Recovery machine\n• Gauge manifold\n• Vacuum pump\n• Refractometer\n• Weighing Scale\n• Vacuumeter\n• Refrigerant identifier\n• Thermometer\n• Leak detector\n• Clamp meter\n\n2.4 TRADE THEORY\n• Basic Electricity\n• Basic electronics\n• Refrigeration principles\n• Instrumentation\n\n2.5 PROCESSES/\nPROCEDURES\n• Recovery/Recycling\n• Retrofitting\n• Conversion\n• Motor insulation testing\nprocedure\n• Wiring resistance testing\nprocedure\n• Mechanical testing\nprocedure\n• Compressor construction\n• Electrical system analysis\n• Mechanical system analysis\n2.6 LEGISLATION\n•\nEnvironmental Protection\nAgency (EPA) Section 608\n•\nDENR-EMB DAO No. 2004-08\n•\n19th MOP decision XIX/6 of the\nMontreal Protocol on\nSubstances that Depletes the\nOzone Layer\n•\nKyoto Protocol\n•\nRAC Code of Practice\n•\nUN Climate Change\nFramework\n•\nRepublic Act 9729 sec\n3.k,3.l,3.m,3.n,3.0\n• UN Conversion Manual\n\n--- PDF PAGE 65 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n63\n3. Required Skills 3.1 Interpreting schematic diagram\n3.2 Preparing materials\n3.3 Proper handling of electrical tools/equipment\n3.4 Testing electrical system\n3.5 Testing mechanical system\n3.6 Tube processing\n3.7 Proper handling of refrigerant and refrigeration oil\n3.8 Recovery/recycling refrigerants\n3.9 Retrofitting\n3.10 System reprocess\n4. Resource\nImplications\n\nThe following resources must be provided:\n4.1 access to work place location and mockup unit\n4.2 Tools and equipment appropriate to troubleshooting and\nrepair\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Demonstration/Direct observation with oral questioning\n5.2 Portfolio\n5.3 Third party report\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 66 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n64"
        },
        "source_text": "HVC723339\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to\nidentify and analyze faults and troubles found in\nDomRAC systems. It also covers identifying and\nrepairing faults/troubles, performing refrigerant\nrecovery/ recycling and retrofitting on domestic\nrefrigeration and air-conditioning unit as well as\nperforming test-run on repaired DomRAC units. .\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the Range of Variables\n1. Plan and prepare\nfor troubleshooting\nand repair\n1.1 Appropriate wiring diagrams, charts and manuals are\ninterpreted in line with the job requirements\n1.2 Appropriate materials, tools and equipment are\nselected based on job requirements\n1.3 Power supply is checked to ensure compliance with\nnameplate rating and/or manufacturer’s specifications\n\n2. Identify and repair\nfaults/troubles\n\n2.1. Appropriate PPE are selected and used in line with job\nrequirements\n2.2. Components are tested following manufacturer’s\nmanual, RAC Code of Practice and/or enterprise\ntroubleshooting policy\n2.3. Faults/problems with components are diagnosed in line\nwith manufacturer’s manual, RAC Code of Practice\nand/or enterprise troubleshooting policy\n2.4. Remedial action is taken to overcome faults/problems\nin line manufacturer’s manual, RAC Code of Practice\nand/or enterprise troubleshooting policy\n2.5. Work is completed safely in line with workplace safety\nguidelines\n2.6. Report on testing procedure, including faults and minor\nrepair, is completed in line with manufacturer’s manual,\nRAC Code of Practice and/or enterprise\ntroubleshooting policy\n\n--- PDF PAGE 62 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n60\n\nELEMENT\nPERFORMANCE CRITERIA\nBold & Italicized fonts are elaborated in the Range of Variables\n\n3. Perform refrigerant\nrecovery/recycling\nand retrofitting/\nconversion on\ndomestic\nrefrigeration and air-\nconditioning unit\n3.1 Safe working practices are observed throughout the\ntask as per enterprise procedure\n3.2 Suitable tools and equipment are selected and used\nbased on job requirement\n3.3 Optimum recovery of refrigerant is performed in line\nwith RAC Code of Practice\n3.4 Refrigerants recovery/recycling is performed according\nto manufacturer's recommendations and RAC Code of\nPractice\n3.5 Retrofitting is performed based on RAC Code of\nPractice\n3.6 Conversion is performed based on UN Conversion\nManual.\n\n4. Test-run repaired\nunit\n\n2.7. Unit is tested in line with troubleshooting procedures\n2.8. Report on repair and testing of unit is prepared in line\nwith enterprise procedures\n\n--- PDF PAGE 63 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n61\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Components\nMay include but not limited to:\n1.1. Electrical controls\n- Thermostat\n- Defrost timer\n- Relay\n- Thermo disc/Defrost thermostat\n- Switches\n- Overload protector\n1.2. Compressor motor\n1.3. Fan motors\n1.4. Refrigerator defrost heater\n1.5. Capacitor\n2. PPE\nIncludes but not limited to:\n2.1. Mask\n2.2. Safety shoes\n2.3. Safety goggles\n2.4. Apron\n2.5. Gloves\n3. Test\nMay include:\n3.1. Insulation\n3.2. Resistance\n3.3. Mechanical\n3.4. Continuity\n3.5. Timing Sequence\n3.6. Leak\n\n--- PDF PAGE 64 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n62\n\n EVIDENCE GUIDE\n1. Critical aspects\nof competency\nAssessment requires evidence that the candidate:\n\n1.1\nDiagnosed DomRAC faults/problems\n1.2\nRecover/Recycle refrigerants\n1.3\nRepaired and Retrofitted DomRAC\n1.4\nTested Unit\n1.5\nAccomplished Service Report\n2. Required\nKnowledge\n\n2.1 SAFETY PRACTICES\n•\nProtective personal\nequipment/safety gears\n•\nHandling of tools,\nequipment and accessories\n•\nSafety signs and symbols\n•\nGood housekeeping\n2.2 BLUEPRINT READING\nAND PLAN\nSPECIFICATION\n• Schematic diagrams\n2.3 MATERIALS AND\nTOOLS: USES AND\nSPECIFICATIONS\n• Piercing valve\n• Refrigerants\n• Refrigeration oil\n• Refrigeration accessories\n\nEquipment\n• Recovery machine\n• Gauge manifold\n• Vacuum pump\n• Refractometer\n• Weighing Scale\n• Vacuumeter\n• Refrigerant identifier\n• Thermometer\n• Leak detector\n• Clamp meter\n\n2.4 TRADE THEORY\n• Basic Electricity\n• Basic electronics\n• Refrigeration principles\n• Instrumentation\n\n2.5 PROCESSES/\nPROCEDURES\n• Recovery/Recycling\n• Retrofitting\n• Conversion\n• Motor insulation testing\nprocedure\n• Wiring resistance testing\nprocedure\n• Mechanical testing\nprocedure\n• Compressor construction\n• Electrical system analysis\n• Mechanical system analysis\n2.6 LEGISLATION\n•\nEnvironmental Protection\nAgency (EPA) Section 608\n•\nDENR-EMB DAO No. 2004-08\n•\n19th MOP decision XIX/6 of the\nMontreal Protocol on\nSubstances that Depletes the\nOzone Layer\n•\nKyoto Protocol\n•\nRAC Code of Practice\n•\nUN Climate Change\nFramework\n•\nRepublic Act 9729 sec\n3.k,3.l,3.m,3.n,3.0\n• UN Conversion Manual\n\n--- PDF PAGE 65 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n63\n3. Required Skills 3.1 Interpreting schematic diagram\n3.2 Preparing materials\n3.3 Proper handling of electrical tools/equipment\n3.4 Testing electrical system\n3.5 Testing mechanical system\n3.6 Tube processing\n3.7 Proper handling of refrigerant and refrigeration oil\n3.8 Recovery/recycling refrigerants\n3.9 Retrofitting\n3.10 System reprocess\n4. Resource\nImplications\n\nThe following resources must be provided:\n4.1 access to work place location and mockup unit\n4.2 Tools and equipment appropriate to troubleshooting and\nrepair\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Demonstration/Direct observation with oral questioning\n5.2 Portfolio\n5.3 Third party report\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 66 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n64"
      }
