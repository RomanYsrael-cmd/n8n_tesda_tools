    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: RAC SERVICING (DomRAC)\nNC Level: NC II\n\nNominal Training Duration: 18 Hours (Basic)\n\n 42 Hours (Common)\n 420 Hours (Core)\n\n 180 Hours - in-school +\n 240 Hours - supervised-industry training (SIT)\n\n ------------------------ In actual work environment\n\n480 Hour - Total training duration\n\nCourse Description:\n\nThis course is designed to equip individual with operational skills in\nRAC Servicing which installs, services and maintains, troubleshoots and\nrepairs Domestic Refrigeration and Air-conditioning (Dom/RAC) units. It\ncovers the basic, common and core competencies.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved:\n\nBASIC COMPETENCIES\n18 Hours\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\nGroup discussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\n\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 67 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n65\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n3. Practice\ncareer\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and\ndevelopment\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n42 Hours\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n\n1. Prepare\nmaterials and\ntools\n\n1.1 Identify materials and tools\n1.2 Request materials and\ntools\n1.3 Receive and inspect\nmaterials and tools\n\nSelf-paced/ Modular\nDemonstration\nSmall Group\nDiscussion\nDistance Education\n\nWritten\nPractical /\nPerformance Test\n\n2. Interpret\ntechnical\ndrawings\n\n2.1. Analyze symbols and data\n2.2. Interpret work plans\n\nDiscussion\nLecture\nModular\n\nWritten\nPractical /\nPerformance Test\n\n3. Observe\nprocedures,\nspecifications\nand manuals\nof instructions\n\n2.1 Identify and access\nspecifications and manuals\n2.2 Interpret manuals\n2.3 Apply information in\nmanuals\n\nDiscussion\nLecture\nModular\n\nWritten\nPractical /\nPerformance Test\n\n--- PDF PAGE 68 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n66\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n\n4. Perform\nmensuration\nand calculation\n\n4.1 Select measuring\ninstruments\n4.2 Carry-out measurements\nand calculations\n\nSelf-paced/ Modular\nDemonstration\nSmall Group\nDiscussion\nDistance Education\n\nWritten/Oral\nExamination\nPractical\nDemonstration\n\n5. Perform basic\nbench work\n\n5.1 Prepare materials, tools\nand equipment for layout\n5.2 Layout features in\nworkplace\n5.3 Cut sheets, plates and\nbars\n5.4 Smooth sheets plates\nand bars\n5.5 Drill holes in sheets,\nplates and bars\n5.6 Bore holes in sheet\nplates and bars\n5.7 Bend sheets, plates and\nbars\n5.8 Join sheets, plates and\nbars\n\nModular\nFilm Showing\nDemonstration\nOn-the-job training\n\nInterview\nDemonstration\nDirect Observation\n\n6. Perform basic\nelectrical works\n\n6.1 Measure and analyze\ncircuit and load\nresistance in electrical\nsystem\n6.2 Measure and analyze\nvoltage in electrical\nsystem\n6.3 Measure and analyze\ncurrent in electrical\nsystem\n6.4 Test simple electrical\ncomponents and\nconnections\n6.5 Repair minor electrical\nsystem troubles\n\nModular\nComputer-based\ntraining\n(Simulation)\nDemonstration\nOn- the-job training\n\nInterview\nComputer-based\nassessment\n(Simulation)\nDemonstration\nDirect Observation\n\n--- PDF PAGE 69 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n67\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n\n7. Maintain tools\nand equipment\n\n7.1 Check the conditions of\ntools and equipment;\n7.2 Perform basic preventive\nmaintenance\n7.3 Store tools and\nequipment\n\nSmall Group\nDiscussion\nDemonstration of\nPractical Skills\nModular\n\nObservation and Oral\nquestioning\nDemonstration and\nOral questioning\nWritten test\n\n8. Perform\nhousekeeping\nand safety\npractices\n\n8.1 Sort materials, tools and\nequipment\n8.2 Clean workplace area,\nmaterials, tools and\nequipment\n8.3 Systematize dispensing\nand retrieval of\nmaterials, tools and\nequipment\n8.4 Identify and minimize/\neliminate hazards\n8.5 Respond and record\naccidents\n8.6 Follow basic securities\n\nSmall Group\nDiscussion\nDemonstration of\nPractical Skills\nModular\n\nObservation and\nOral questioning\nDemonstration and\nOral questioning\nWritten test\n\n9. Document\nwork\naccomplished\n\n9.1 Identify forms and data\n9.2 Prepare reports\n\nSmall Group\nDiscussion\nDemonstration of\nPractical Skills\nModular\n\nDemonstration and\nOral questioning\nWritten Test\n\n--- PDF PAGE 70 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n68\n\nCORE COMPETENCIES\n420 Hours (180 Hours in-school + 240 Hours SFT) *\n\nUnit of\nCompetency\n\nLearning Outcome\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n\n1. Install domestic\nrefrigeration and\nair-conditioning\n(DomRAC) units\n\n1.1 Conduct survey\n1.2 Install DomRAC\nelectrical circuit\n1.3 Install DomRAC unit\n1.4 Conduct performance\ntest\n\nLecture\nDemonstration\nTrainee Hands-on\nSFT\n\nDirect\nObservation\nQuestion\nDemonstration\n\n2. Service and\nmaintain\ndomestic\nrefrigeration and\nair-conditioning\n(DomRAC) units\n\n2.1 Clean and replace air\nfilter\n2.2 Service evaporator/\ncondenser\n2.3 Maintain fan motor\nassembly\n2.4 Service electrical power\nand control circuits\n2.5 Accomplish service and\nmaintenance report\n\nLecture\nDemonstration\nTrainee Hands-on\nSFT\n\nDirect\nObservation\nQuestioning\nDemonstration\n\n3. Trouble shoot\ndomestic\nrefrigeration and\nair-conditioning\n(DomRAC) units\n\n3.1. Plan and prepare for\ntroubleshooting and\nrepair\n3.2. Identify and repair\nfaults/troubles\n3.3. Perform refrigerant\nrecovery/ recycling and\nretrofitting/ conversion\non domestic refrigeration\nand air-conditioning unit\n3.4. Test-run repaired unit\n\nLecture\nDemonstration\nTrainee Hands-on\nSFT\n\nDirect\nObservation\nQuestioning\nDemonstration\n\n*Note: SFT – supervised-field training/exposure in actual work environment is\nincluded in the nominal training duration\n\n--- PDF PAGE 71 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n69"
  },
