.8 Join sheets, plates and\nbars\n\nModular\nFilm Showing\nDemonstration\nOn-the-job training\n\nInterview\nDemonstration\nDirect Observation\n\n6. Perform basic\nelectrical works\n\n6.1 Measure and analyze\ncircuit and load\nresistance in electrical\nsystem\n6.2 Measure and analyze\nvoltage in electrical\nsystem\n6.3 Measure and analyze\ncurrent in electrical\nsystem\n6.4 Test simple electrical\ncomponents and\nconnections\n6.5 Repair minor electrical\nsystem troubles\n\nModular\nComputer-based\ntraining\n(Simulation)\nDemonstration\nOn- the-job training\n\nInterview\nComputer-based\nassessment\n(Simulation)\nDemonstration\nDirect Observation\n\n--- PDF PAGE 69 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n67\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n\n7. Maintain tools\nand equipment\n\n7.1 Check the conditions of\ntools and equipment;\n7.2 Perform basic preventive\nmaintenance\n7.3 Store tools and\nequipment\n\nSmall Group\nDiscussion\nDemonstration of\nPractical Skills\nModular\n\nObservation and Oral\nquestioning\nDemonstration and\nOral questioning\nWritten test\n\n8. Perform\nhousekeeping\nand safety\npractices\n\n8.1 Sort materials, tools and\nequipment\n8.2 Clean workplace area,\nmaterials, tools and\nequipment\n8.3 Systematize dispensing\nand retrieval of\nmaterials, tools and\nequipment\n8.4 Identify and minimize/\neliminate hazards\n8.5 Respond and record\naccidents\n8.6 Follow basic securities\n\nSmall Group\nDiscussion\nDemonstration of\nPractical Skills\nModular\n\nObservation and\nOral questioning\nDemonstration and\nOral questioning\nWritten test\n\n9. Document\nwork\naccomplished\n\n9.1 Identify forms and data\n9.2 Prepare reports\n\nSmall Group\nDiscussion\nDemonstration of\nPractical Skills\nModular\n\nDemonstration and\nOral questioning\nWritten Test\n\n--- PDF PAGE 70 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n68\n\nCORE COMPETENCIES\n420 Hours (180 