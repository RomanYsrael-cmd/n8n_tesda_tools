    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for RAC Servicing NC II [Domestic\nRefrigeration and Air-Conditioning (DomRAC)].\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: RAC SERVICING (DomRAC)\nNC Level: NC II\n\nNominal Training Duration: 18 Hours (Basic)\n\n 42 Hours (Common)\n 420 Hours (Core)\n\n 180 Hours - in-school +\n 240 Hours - supervised-industry training (SIT)\n\n ------------------------ In actual work environment\n\n480 Hour - Total training duration\n\nCourse Description:\n\nThis course is designed to equip individual with operational skills in\nRAC Servicing which installs, services and maintains, troubleshoots and\nrepairs Domestic Refrigeration and Air-conditioning (Dom/RAC) units. It\ncovers the basic, common and core competencies.\n\nTo obtain this, all units prescribed for this qualification must be\nachieved:\n\nBASIC COMPETENCIES\n18 Hours\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information\n1.2 Complete relevant work\nrelated documents\n1.3 Participate in workplace\nmeeting and discussion\nGroup discussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team\n2.2 Describe work as a team\nmember\n\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 67 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n65\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n3. Practice\ncareer\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities\n3.3 Maintain professional\ngrowth and\ndevelopment\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\nCOMMON COMPETENCIES\n42 Hours\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n\n1. Prepare\nmaterials and\ntools\n\n1.1 Identify materials and tools\n1.2 Request materials and\ntools\n1.3 Receive and inspect\nmaterials and tools\n\nSelf-paced/ Modular\nDemonstration\nSmall Group\nDiscussion\nDistance Education\n\nWritten\nPractical /\nPerformance Test\n\n2. Interpret\ntechnical\ndrawings\n\n2.1. Analyze symbols and data\n2.2. Interpret work plans\n\nDiscussion\nLecture\nModular\n\nWritten\nPractical /\nPerformance Test\n\n3. Observe\nprocedures,\nspecifications\nand manuals\nof instructions\n\n2.1 Identify and access\nspecifications and manuals\n2.2 Interpret manuals\n2.3 Apply information in\nmanuals\n\nDiscussion\nLecture\nModular\n\nWritten\nPractical /\nPerformance Test\n\n--- PDF PAGE 68 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n66\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n\n4. Perform\nmensuration\nand calculation\n\n4.1 Select measuring\ninstruments\n4.2 Carry-out measurements\nand calculations\n\nSelf-paced/ Modular\nDemonstration\nSmall Group\nDiscussion\nDistance Education\n\nWritten/Oral\nExamination\nPractical\nDemonstration\n\n5. Perform basic\nbench work\n\n5.1 Prepare materials, tools\nand equipment for layout\n5.2 Layout features in\nworkplace\n5.3 Cut sheets, plates and\nbars\n5.4 Smooth sheets plates\nand bars\n5.5 Drill holes in sheets,\nplates and bars\n5.6 Bore holes in sheet\nplates and bars\n5.7 Bend sheets, plates and\nbars\n5.8 Join sheets, plates and\nbars\n\nModular\nFilm Showing\nDemonstration\nOn-the-job training\n\nInterview\nDemonstration\nDirect Observation\n\n6. Perform basic\nelectrical works\n\n6.1 Measure and analyze\ncircuit and load\nresistance in electrical\nsystem\n6.2 Measure and analyze\nvoltage in electrical\nsystem\n6.3 Measure and analyze\ncurrent in electrical\nsystem\n6.4 Test simple electrical\ncomponents and\nconnections\n6.5 Repair minor electrical\nsystem troubles\n\nModular\nComputer-based\ntraining\n(Simulation)\nDemonstration\nOn- the-job training\n\nInterview\nComputer-based\nassessment\n(Simulation)\nDemonstration\nDirect Observation\n\n--- PDF PAGE 69 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n67\n\nUnit of\nCompetency\nLearning Outcomes\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n\n7. Maintain tools\nand equipment\n\n7.1 Check the conditions of\ntools and equipment;\n7.2 Perform basic preventive\nmaintenance\n7.3 Store tools and\nequipment\n\nSmall Group\nDiscussion\nDemonstration of\nPractical Skills\nModular\n\nObservation and Oral\nquestioning\nDemonstration and\nOral questioning\nWritten test\n\n8. Perform\nhousekeeping\nand safety\npractices\n\n8.1 Sort materials, tools and\nequipment\n8.2 Clean workplace area,\nmaterials, tools and\nequipment\n8.3 Systematize dispensing\nand retrieval of\nmaterials, tools and\nequipment\n8.4 Identify and minimize/\neliminate hazards\n8.5 Respond and record\naccidents\n8.6 Follow basic securities\n\nSmall Group\nDiscussion\nDemonstration of\nPractical Skills\nModular\n\nObservation and\nOral questioning\nDemonstration and\nOral questioning\nWritten test\n\n9. Document\nwork\naccomplished\n\n9.1 Identify forms and data\n9.2 Prepare reports\n\nSmall Group\nDiscussion\nDemonstration of\nPractical Skills\nModular\n\nDemonstration and\nOral questioning\nWritten Test\n\n--- PDF PAGE 70 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n68\n\nCORE COMPETENCIES\n420 Hours (180 Hours in-school + 240 Hours SFT) *\n\nUnit of\nCompetency\n\nLearning Outcome\nTraining\nMethodology\nInstitutional\nAssessment\nApproach\n\n1. Install domestic\nrefrigeration and\nair-conditioning\n(DomRAC) units\n\n1.1 Conduct survey\n1.2 Install DomRAC\nelectrical circuit\n1.3 Install DomRAC unit\n1.4 Conduct performance\ntest\n\nLecture\nDemonstration\nTrainee Hands-on\nSFT\n\nDirect\nObservation\nQuestion\nDemonstration\n\n2. Service and\nmaintain\ndomestic\nrefrigeration and\nair-conditioning\n(DomRAC) units\n\n2.1 Clean and replace air\nfilter\n2.2 Service evaporator/\ncondenser\n2.3 Maintain fan motor\nassembly\n2.4 Service electrical power\nand control circuits\n2.5 Accomplish service and\nmaintenance report\n\nLecture\nDemonstration\nTrainee Hands-on\nSFT\n\nDirect\nObservation\nQuestioning\nDemonstration\n\n3. Trouble shoot\ndomestic\nrefrigeration and\nair-conditioning\n(DomRAC) units\n\n3.1. Plan and prepare for\ntroubleshooting and\nrepair\n3.2. Identify and repair\nfaults/troubles\n3.3. Perform refrigerant\nrecovery/ recycling and\nretrofitting/ conversion\non domestic refrigeration\nand air-conditioning unit\n3.4. Test-run repaired unit\n\nLecture\nDemonstration\nTrainee Hands-on\nSFT\n\nDirect\nObservation\nQuestioning\nDemonstration\n\n*Note: SFT – supervised-field training/exposure in actual work environment is\nincluded in the nominal training duration\n\n--- PDF PAGE 71 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n69\n\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the\ncurriculum. Delivery shall be guided by the 10 basic principles of\ncompetency-based TVET:\n\n• The training is based on curriculum developed from the\n\ncompetency standards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should\n accommodate individualized and self-paced learning\n strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency\n\nstandards and the curriculum modules;\n• Assessment is based in the collection of evidence of the\n\nperformance of work to the industry required standard;\n• Training is based both on and off-the-job components;\n• Training program allows for recognition of prior learning\n\n(RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Training programs are registered with the UTPRAS.\n\nThe competency-based TVET system recognizes various\ntypes of delivery modes, both on and off-the-job as long as the\nlearning is driven by the competency standards specified by the\nindustry. The following training modalities may be adopted when\ndesigning training programs:\n\n• The dualized mode of training delivery is preferred and\nrecommended. Thus programs would contain both in-\nschool and in-industry training or fieldwork components.\nDetails can be referred to the Dual Training System (DTS)\nImplementing Rules and Regulations.\n\n• Modular/self-paced\nis\na\ncompetency-based\ntraining\nmodality wherein the trainee is allowed to progress at his\nown pace. The trainer facilitates the training delivery.\n\n• Peer teaching/mentoring is a training modality wherein fast\nlearners are given the opportunity to assist the slow\nlearners.\n\n• Supervised Industry Training or On-the-Job Training is an\napproach in training designed to enhance the knowledge\nand skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in\nthe training regulations.\n\n--- PDF PAGE 72 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n70\n\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning\nmay employ correspondence study, or audio, video or\ncomputer technologies.\n\n• Project-based instruction is an authentic instructional\nmodel or strategy in which students plan, implement and\nevaluate projects that have real world applications.\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and\neducational experience. Other requirements like health and physical\nrequirements are also stated. Passing entry written examinations\nmay also be indicated if necessary.\n\n• Can communicate both oral and written\n• Good moral character\n• Can perform basic mathematical computation\n• Physically and mentally fit\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS\nRAC SERVICING NC II\n\nRecommended list of tools, equipment and materials for the\ntraining of 25 trainees for RAC Servicing NC II.\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nDescription\nQTY\nDescription\nQty.\nDescription\n10\npcs\nFlaring tool\n\n3\nunits\nVacuum pump motor, high\nstage, 1/2 HP , 220 volts\n1 roll\nCopper tube1/4 “,\n3/8”, 5/16”, ½,1/8,\n3/16, “OD, 50 ft. per\nroll\n10\npcs.\nSwaging tool\n2\nunits\nRecovery/ Recycling unit ,\nportable type, 220 volts\n1 roll\nAluminum tube, 3/8\n“OD, 100 ft. per roll\n5 pcs\nTube cutter\n2\nunits\nOxy- Acetylene welding\nmachine w/ complete outfit\n1 roll\nCapillary tube 1/16,\nOD, 100 ft. per roll\n5 pcs\nTube bender\n3\nunits\nReusable Service Cylinder\n13.5kg\n50\npcs.\nSilver rod\n4 pcs.\nSevice cylinder 2.5\nkg.,10 kg. Capacity\n1\nunit\nRefrigerator , single door 5\ncu. Ft. 220 volts\n50\npcs.\nAluminum rod\n10\npcs\nElectrical pliers\n1\nunit\nRefrigerator, two door\ntop mount freezer, 6 cu.\nFt. 220 volts\n10\npcs.\nSilver flux\n\n--- PDF PAGE 73 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n71\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nDescription\nQTY\nDescription\nQty.\nDescription\n10\npcs.\nPliers, long nose\n1 unit\nRefrigerator , two door\nno frost, 6 cu. Ft. 220\nvolts\n15\npcs.\nFilter drier , ¼ “OD\nflared connection\n10\npcs.\nScrew driver, flat\n1 unit\nFreezer chest type, 10\ncu Ft. 220 volts\n15\npcs.\n Filter drier , ¼ “\nOD solder\nconnection\n10\npcs.\nScrew driver\nPhilips\n1 unit\nFreezer, upright 6 cu.\nFt. 220 volts\n25\npcs.\nFlare cap , ¼\n” OD\n10\npcs.\nFiles\n1 unit\nWater dispenser 220\nvolts\n25\npcs.\nFlare union, ¼ “ OD\n5\nsets.\nAllen wrench\n3\nunits\nAnalog Clampmeter\n25\npcs.\nFlare plug, ¼\nOD\n5\npcs.\nAdjustable\nwrench 8”, 10”\n3\nunits\nDigital Clampmeter\n13.6\nkg.\nRefrigerant 134a\n5\nsets\nOpen wrench\n2\nunits\nWindow type aircon 2\nhp 220 volts\n13.6\nkg.\nRefrigerant 22\n5\nsets\nBox wrench\n1 unit\nAir compressor,\ncomplete w/\naccessories 220 volts\n13.6\nkgs\nR 290\n5\npcs.\nPipe wrench\n5\nunits\nCompressor motor 100\nw , 220 volts\n1 cyl.\nNitrogen gas\n 5\npcs.\nVise grip , 6 , “8 “ 2\nunits\nElectric drill portable,\n3/8 ½ ,\nChuck, 220 volts\n2 cyl.\nOxygen\n5\npcs.\nThinners snip,\n8’’12”\n1 set\nPedestal grinding\nmachine, 6” grinding\nwheel ¾ “ hp. 220 volts\n2 cyl.\nAcetylene gas\n10\npcs.\nBullpen hammer,\n12 oz\n1 unit\nArc welding machine,\nAc max. 250 amps. 220\nV, 60 hz. Heavy duty\n10\npcs.\nDual capacitor 25,\n30, 35 mfd 370 vac\n5\npcs.\nRubber mallet\n,oz\n10\nsets\nGauge manifold w/\nhoses\n10\npcs.\nFan capacitor ,3, 4,\n5, 6, 7, mfd 220 vac\n10\npcs.\n Hack saw\n5\nsets\nDigital Volt ohm mili-\nammeter\n10\npcs.\nStarting capacitor\n60, 80, 100-105 mfd\n220 volts\n5\npcs.\nSpray gun\n5\nsets\nAnalog VOM\n10\npcs.\nPotential relay 1,\n1.5 2 hp 220 volts\n10\npcs.\nSteel rule , metric\n& english\n1 set\nElectronic leak detector\n(Fluorine based)\n10\npcs.\nOverload protector\n1/6 ,1/8, 1/10 , 1/5,\n1.5 2hp 220 volts\n10\npcs.\nPush rule\n1 set\nElectronic leak detector\n(Hydrocarbon based)\n10\npcs.\nCurrent relay 1/5,\n1/6, 1/8 , 1/10, hp\n220 volts\n5\npcs.\nTri- square\n5\nsets\nThermometer, dial type\n10\npcs.\nEvaporator coil\n\n--- PDF PAGE 74 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n72\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY.\nDescription\nQTY\nDescription\nQty.\nDescription\n8\npcs.\nPinch off tool\n5\nsets\nDigital Thermometer\n10\npcs.\nCondenser\n5\npcs.\nSoldering iron,\n100w , 220 volts\n1 set\nNitrogen regulator\n5\npcs,\nSoldering lead\n\n2\nunits\nRefractometer\n5\npcs.\nSoldering paste\n\n2\nunits\nVacuumeter\nTools/equipment for\nConversion\n\n1 unit\nRefrigerant identifier\n1 set\nInsulated terminal\nconnectors/rings\n\n2\nunits\nWeighing scale\n5 pcs\nSealed terminal box\n\nPersonal Protective\nEquipment\n5\nsets\nScrewed cable glands\n(various sizes)\n\n15\npairs\nSafety gloves\n2\nrolls\nFlexible electric cable\n(# 12 & # 14)\n\n15\npairs\nSafety shoes\n2\nsets\nCable strap for wiring\nharness\n\n15\npcs\nSafety\ngoggles/spectacles\n5\nrolls\nRubber electrical tape\n\n15\npcs\nFace mask\n1\nbooklet\nLabel and warning\nsign sticker\n\n3.5\nTRAINING FACILITIES\nRAC SERVICING NC II\n\nBased on a class intake of 25 students/trainees.\n\nSPACE REQUIREMENTS\n\nSpace (m)\n\nArea in\nSq. Meters\nTotal Area\nin\nSq. Meters\nA. LECTURE AREA*\n4.00 x 8.00\n32.00\n32.00\nB. LEARNING RESOURCE AREA\n4.00 x 6.00\n24.00\n24.00\nC. WORKSHOP\n6x10\n60.00\n60.00\nD. TOOL/STORAGE AREA*\n4.00 x 4.00\n16.00\n16.00\nE. WASH, TOILET AND LOCKER ROOM*\n\n3.00 x 4.00\n\n12.00\n\n12.00\nTOTAL\n144\nF. FACILITIES/EQUIPMENT/\n CIRCULATION\n\n44\n\nTOTAL AREA\n\n188\n *Common facilities for all HVAC/R Courses\n\n--- PDF PAGE 75 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n73\n\n3.6\nTRAINER’S QUALIFICATION FOR HVAC/R SECTOR\n\nRAC SERVICING NC II\n\n• Holder of National TVET Trainers Certificate Level I\n• He must be a holder of RAC Servicing, NC II\n• Good moral character\n• Must be physically and mentally fit\n• Must be computer literate\n• *Must have at least two (2) years job/industry experience\n\n*Optional: Only when required by the hiring institution\n\n Reference: TESDA Board Resolution No. 2004-03\n\n3.2\nASSESSMENT\n\nInstitutional assessment is undertaken by trainees to\ndetermine their achievement of units of competency. A certificate of\nachievement is issued for each unit of competency.\n\nAs a matter of policy, graduates of programs registered with\nTESDA under these training regulations are required to undergo\nmandatory national competency assessment upon completion of the\nprogram.\n\n--- PDF PAGE 76 ---\nTR RAC SERVICING (DomRAC) NC II\n\nRevised October 2011\n74"
