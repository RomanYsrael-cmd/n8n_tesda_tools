  "source_text": "SECTION 4 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Fish Capture NC I, the\ncandidate must demonstrate competence through project type assessment\ncovering all the units listed in Section 1. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2 The qualification of Fish Capture NC I may be attained through:\n\n4.2.1 Accumulation of Certificates of Competency (COCs) in the\nfollowing areas:\n\n4.2.1.1 Apply deckhand skills aboard a fishing vessel\n4.2.1.2 Load and unload goods / cargo\n4.2.1.3 Assemble and repair damaged netting\n\nSuccessful candidates shall be awarded Certificates of Competency\n(COCs)\n\n4.3\nAccumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.4\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.5\nThe following are qualified to apply for assessment and certification:\n\n 4.4.1 Graduates of formal, non formal and informal including enterprise-\nbased training programs.\n\n4.4.2 Experienced workers ( wage employed or self-employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\nProcedures manual on Assessment and Certification and Guidelines on\nthe implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS).\n\n--- PDF PAGE 86 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n84\n\n--- PDF PAGE 87 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n85\n"
}
