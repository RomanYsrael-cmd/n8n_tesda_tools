  "source_text": "Section 1. Successful candidates shall be\nawarded a National Certificate signed by the TESDA Director General.\n\n4.2 The qualification of Fish Capture NC I may be attained through:\n\n4.2.1 Accumulation of Certificates of Competency (COCs) in the\nfollowing areas:\n\n4.2.1.1 Apply deckhand skills aboard a fishing vessel\n4.2.1.2 Load and unload goods / cargo\n4.2.1.3 Assemble and repair damaged netting\n\nSuccessful candidates shall be awarded Certificates of Competency\n(COCs)\n\n4.3\nAccumulation and submission of all COCs acquired for the relevant units of\ncompetency comprising a qualification, an individual shall be issued the\ncorresponding National Certificate.\n\n4.4\nAssessment shall focus on the core units of competency. The basic and\ncommon units shall be integrated or assessed concurrently with the core units.\n\n4.5\nThe following are qualified to apply for assessment and certification:\n\n 4.4.1 Graduates of formal, non formal and informal including enterprise-\nbased training programs.\n\n4.4.2 Experienced workers ( wage employed or self-employed)\n\n4.6\nThe guidelines on assessment and certification are discussed in detail in the\nProcedures manual on Assessment and Certification and Guidelines on\nthe implementation of the Philippine TVET Qualification and Certification\nSystem (PTQCS).\n\n--- PDF PAGE 86 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n84\n\n--- PDF PAGE 87 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n85\nCOMPETENCY MAP FOR AGRI-FISHERY SECTOR\n\nFISH CAPTURE SUB-SECTOR\n\nCORE UNITS OF COMPETENCY\nMaintain the temperature\nof seafood\n\nMaintain , prepare, deploy\nand retrieve purse seines to\nland catch\n\n Assemble and repair damaged\nnetting\n\nMaintain, prepare, deploy and\nretrieve hand operated lines to\nland catch\n\n Manage and control fishing\noperations\nImplement the food safety\nprogram and procedures\n\n Shift a load using manually\noperated equipment\n\nClean work area\n\nRecord information about the\ncountry\n\nConstruct nets and\ncustomize design\n\nLoad and unload goods\nand cargo goods\n\nAdjust and position purse\nseines\n\n Maintain the temperature of\nseafood\n\nContribute to at sea processing\nof seafood\n\nLocate fishing grounds and\nstocks of fish\n\nAssemble and repair\ndamaged netting\n\n Assemble and load\nrefrigerated product\n\n Adjust & position drop lines and\nlong lines\n\n Maintain, prepare, deploy and\nretrieve mesh nets or gill nets to\nland catch\n\nMonitor the implementation\nof quality and food safety\nprograms\n\nApply deckhand skills\naboard a fishing vessel\n\n Implement the food safety\nprogram and procedures\n\nMaintain, prepare, deploy and\nretrieve drop lines and long lines\nto land catch\n\n Perform routine housekeeping\nduties on board a vessel\n\n Implement quality systems\nand procedures\n\nApply basic first aid\n\n Maintain, prepare, deploy\nand retrieve pots and traps\nto land catch\n\nPerform breath hold diving\noperations\n\nAdjust and position purse\nseines\n\nKeep records for a municipal\nfishing business\n Adjust and position pots\nand traps\n\nWork with temperature\ncontrolled stock\n\nAdjust and position hand\noperated lines\n\nCook on board a vessel\n\nOperate machinery in\nadverse conditions\n\nApply deckhand skills\naboard a fishing vessel\n\nAdjust and position beach\nseines, mesh nets or grill\nnets\n\nConduct field operations\n\n Analyze and report on board\nobservation\n\nOperate refrigerated\nstorerooms\n\n--- PDF PAGE 88 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n86\n\nContinuation ….. Competency Map for Agri- Fishery Sector ( Fish Capture Sub-Sector)\n\nCORE UNITS OF COMPETENCY\nCollect reliable scientific data\nand samples\n\nPerform diving operations using\nself contained underwater\nbreathing apparatus\n\nTransport, handle and store\nchemicals\n\nEstablish and manage effective\nexternal relationships\n\nWholesale product\nImplement OHS policies and\nguidelines\n\nPerform breath hold diving\noperations\n\n Scuba dive in open water to a\nmaximum dept of 18 meters\n\n Manage and control fishing\noperations\n\nConduct food safety audits\n\nMaintain the temperature of\nseafood\n\nPerform compressions chamber\ndiving operations\n\n Undertake emergency procedures in\ndiving operations using surface\nsupplied breathing apparatus\n\n Oversee the implementation of a\nfood safety program in the\nworkplace\n\nFollow basic food safety\npractices\nOversee and undertake\neffluent and waste treatment\nand disposal\n\n Perform diving operations using\nsurface supplied breathing\napparatus\n\n Work effectively as a diver in the\nseafood industry\n\n Evaluate a batch of seafood\n\n Develop food safety programs\n\nCollect routine fishery\nmanagement data\n\n Apply and prepare chemicals\n\nEstablish and maintain the enterprise\nOHS programs\n\n Monitor the implementation of\nquality and food safety programs\n\n Locate fishing ground and\nstocks of fish\n\nImplement environmental\npolicies and procedures\n\n Provide support for diving\noperations\n\n Manage environmental performance\n\n Prepare work instructions for new\ntasks\n\nProvide practical and / or\ncommercial advice to seafood\nusers\n\nMonitor and record fishing\noperations\n\n Work with temperature\ncontrolled stock\n\n Supervise maintenance of\nmachinery and equipment\n\n Export product\n\nParticipate in a HACCP Team\n\n Undertake emergency\nprocedures in diving operations\nusing self contained underwater\nbreathing apparatus\n\n Apply and monitor food safety\nrequirements\n\nOperate a small vessel\n\n--- PDF PAGE 89 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n87\nContinuation ….. Competency Map for Agri Fishery Sector ( Fish Capture Sub-Sector)\n\nCOMMON UNITS OF COMPETENCY\n\nApply safety measures\n\nUse farm tools and\nequipment\n\nPerform estimation and\ncalculation\n\nApply Food Safety and\nSanitation\n\n Comply with emergency\nprocedures\n\nPrevent and fight fire\n\nProtect marine environment\n\nPerform first aid treatment on\nboard\n\nPerform survival techniques\nduring ship abandonment\n Launch survival craft\n and techniques\n\nConduct shipboard security\nchecks\n\nBASIC UNITS OF COMPETENCY\n\nReceive and Respond to\nWorkplace\nCommunication\n\nParticipate in Workplace\nCommunication\n\nLead Workplace Communication\n\nUtilize specialist communication\n\nDevelop Team and\nIndividual\nWork With Others\n\nWork in a Team\nEnvironment\n\nLead Small Team\n\nSolve Workplace Problems\nRelated to Work Activities\n\nApply Problem Solving\nTechniques in the Workplace\n\nDemonstrate work values\n\nPractice housekeeping\nprocedures\n\nPlan and Organize Work\n\n Fish Capture NC I\n\n--- PDF PAGE 90 ---\n________________________________________________\nTR – Fish Capture NC I\n87\nDEFINITION OF TERMS\n\nFor the purpose of this standard, the word\n\n• Accident – unwanted incidents involving injury or damage to life, the\nenvironment, the ship or cargo\n\n• Anchor– a heavy forging or casting comprising a shank with shackles or ring at\none end and two arms with palms at the other, so shaped as to grip the sea\nbottom, by means of cable or rope hold a boat / ship regardless of wind and\ncurrent\n\n• Ballast – a quantity of iron, stone, gravel or other weighty substance like (water,\noil, etc) placed in the lower hold of the boat/ship to increase stability by lowering\nthe center of gravity.\n\n• Bend – a knot by which one rope is fastened to another to some object.\n\n• Bilge – a place in the lower part of the boat / ship where waste water collects\nand which bilge suctions are placed for pumping out\n\n• Boat – a small open craft propelled by oars sails, or some form of engine. This\nterm also applied to a larger boats built to navigate rivers and inland waters.\n\n• Capstan – a machine for moving or raising heavy weights and consist of a\nvertical drum that can be rotated and around which cable is turned\n\n• Deck – a platform in a ship that is structural element and forming the floor for its\ncompartment\n\n• Deckhand– a seaman who perform manual and other duties on board a vessel\n\n• Fish capture – the taking of fishery species by passive or active gear for trade,\nbusiness or profit beyond subsistence or sport fishing and classified further as\nfollows:\no Small scale commercial fishing – fishing utilizing fishing vessels of\n3.1 gross tons (GT) up to 20 GT\no Medium scale commercial fishing – fishing utilizing fishing vessels of\n20.1 GT up to 150 GT; and\no Large scale commercial fishing – fishing utilizing fishing vessel of\nmore than 150 GT\n\n• Fishing gear – fishing equipment and paraphernalia\n\n--- PDF PAGE 91 ---\n________________________________________________\nTR – Fish Capture NC I\n88\n• Fish fighting equipment – equipment use to extinguish fire as per type.\n\n• Hitch– any of various knots used to form a temporary noose in a line or to secure\na line temporarily to an object\n\n• Knot – the interlacement of the parts of one or more flexible bodies forming a\nump or knob\n\n• Life saving appliances – are outfits designed for life preservation\n\n• Mooring – a act of making fast a boat with lines or anchor\n\n• Netting – fishing gear component made of open meshed fabric\n\n• Seaworthiness – refers to the ability of a boat / ship to withstand the action of\nthe sea, wind and weather\n\n• Winch – any of various machines or instruments for pulling or hauling, with one\nor more drums on which to coil a rope, cable or chain.\n\n• Windlass - a steam or electric winch with horizontal or vertical shaft and two\ndrums used to raise a ship’s anchor.\n\n--- PDF PAGE 92 ---\n________________________________________________\nTR – Fish Capture NC I\n89\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend gratitude and appreciation to the many representatives of business, industry,\nacademe and government agencies who donated their time and expertise to the\ndevelopment and validation of these Training Regulations.\n\n• THE TECHNICAL ADVISORY PANEL (TAP)\n\nDr. RODOLFO P. ESTIGOY\nMr. ALEJANDRO T. ESCANO\nChief\nPresident\nBureau of Post Harvest Research and\nExtension\nCentral Luzon State University, Science\nCity of Muñoz, Nueva Ecija\nPhilippine Chamber of Agriculture and\nFood (PCAFI)\nMFI Bldg. Otigas Avenue Extension,\nPasig City\nMr. EDWIN ANDOT\nDr. ALMA M. DELA CRUZ\nPresident\nChamber of Agriculture, Fisheries and\nFood in Northern Mindanao\n2nd floor, United Way Bldg.\nCapitol Cmpd., Cagayan de Oro City\nProfessor\nCentral Luzon State University\nMuñoz, Nueva Ecija\n\n• THE TECHNICAL EXPERT PANEL (TEP)\n\nMs. FELY LIM\nMr. JAIME S. NAVARRO, JR.\nSOCSKSARGEN Federation of\nRD Tuna Ventures, Inc.\nFishing and Allied Industries, Inc.\n(SFFAII) / SECAFF\n\nMR. ROGELIO NODORA\nMr. ROGELIO C. GENSAVA\nPort Captain\nDamalerio Group of Companies\nTalisay, Tambler, Gen. Santos City\nLiason Officer\nAmadeo Fishing Corp.\nMarang St., Calumpang, Gen. Santos\nEngr. ROMAN CASTRO\nMr. EDWIN G. FORONES\nMaritime Industry Authority\nSan Andres Fishing Industry\nMARINA – Region XII\nMr. ELIAS RODRIGO SR.\nMr. ABEL ALINO\nPort Captain\nRD Fishing Industry, Inc.\nMaterial Coordintor\nRD Fishing Industry, Inc.\n\n--- PDF PAGE 93 ---\n________________________________________________\nTR – Fish Capture NC I\n90\n\n The Participants in the national validation of this Training Regulation\n\nNational Capital Region\nRegion VIII\nRegion XII\n\nThe Management and Staff of the TESDA Secretariat\n•\nSSCO\n•\nNITVET"
