    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for Fish Capture NC I (Ultimo).\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: FISH CAPTURE (ULTIMO) Level: NC I\n\nNominal Training Duration : 352 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, desirable skills and attitudes of\nFish Capture NC I (Ultimo) in accordance with industry standards. It covers Basic,\nCommon and Core Competencies such as:\n\nBASIC COMPETENCIES\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Receive and\nrespond to\nworkplace\ncommunication\n• Explain routinary\nspeaking & messages in\na workplace.\n• Follow routinary speaking\n& message\n• Perform work duties\nfollowing written notices.\n• Group\ndiscussion\n• Interaction\n\n• Interviews/\nquestioning\n• Observation\n2. Work with others\n• Develop effective\nworkplace relationship.\n• Contribute to work group\nactivities.\n• Group\ndiscussion\n• Interaction\n• Interviews/\nquestioning\n• Demonstration\n• Observation\n3. Demonstrate work\nvalues\n\n• Define the purpose of\nwork\n• Apply work values/ethics\n• Deal with ethical\nproblems\n• Maintain integrity of\nconduct in the workplace\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\nhousekeeping\nprocedures\n• Sort and remove\nunnecessary items\n• Arrange items\n• Maintain work areas, tools\nand equipment\n• Follow standardize work\nprocess and procedures\n• Perform work\nspontaneously\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n\n--- PDF PAGE 77 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n75\n\nCOMMON COMPETENCIES FOR AGRI-FISHERY\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply safety\nmeasures\n1.1 Determine areas of concern\nfor safety measures\n1.2 Apply appropriate safety\nmeasures\n1.3 Safekeep and maintain\nmaterials, tools and\nequipment.\n1.4 Dispose waste materials and\noutfit\n• Self-paced/\nmodular\n• Lecture\n/Discussion\n• Practical\ndemonstration\n• Visit/tour\n• Visual aids\n• Oral/written\nexamination\n• Interviews\n• Direct\nobservation\n• Practical\ndemonstration\n2. Use of farm\ntools and\nequipment\n2.1 Prepare and use farm tools\n2.2 Prepare and operate farm\nequipment\n2.3 Observe safety precautions\nin handling farm tools and\nequipment.\n2.4 Carry out routine\nmaintenance and storage of\ntools and equipment\n• Self-paced/\nmodular\n• Lecture\n/Discussion\n• Practical\ndemonstration\n• Visit/tour\n• Visual aids\n• Oral/written\nexamination\n• Interviews\n• Direct\nobservation\n• Practical\ndemonstration\n3. Perform\nestimation\nand basic\ncalculation\n3.1 Perform estimation activities\n3.2 Perform basic workplace\ncalculation\n3.3 Apply corrective measures\nas necessary\n• Self-paced/\nmodular\n• Lecture\n/Discussion\n• Practical\ndemonstration\n• Interaction\n• Practical\nexercise\n•Visual aids\n• Oral/written\nexamination\n• Interviews\n• Direct\nobservation\n• Practical\ndemonstration\n• Practical\nexercise\n4. Apply food\nsafety and\nsanitation\n4.1 Wear personal protective\nequipment\n4.2 Observe personal hygiene\nand good grooming\n4.3 Implement food sanitation\npractices\n4.4 Render safety measures and\nfirst aid procedures\n4.5 Implement housekeeping\nactivities\n• Demonstration\n• Dual training\n• Individual Self-\npaced learning\n• Lecture\n\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 78 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n76\n\nCOMMON COMPETENCIES FOR MARITIME\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prevent and\nfight fire\n1.1 Implement fire prevention\nmeasures and procedures on\nboard a vessel.\n1.2 Check the capability of fire\ndetection and fire fighting\nequipment and system.\n1.3 Initiate any required\nmaintenance\n1.4 Simulate on board fire fighting\nand search and rescue\nactivities\n1.5 Implement OHS principles and\npolicies when carrying out fire\nfighting duties\n1.6 Communicate effectively with\nothers during fire emergencies\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n• Observation\n• Demonstration\n• Practical\nperformance\n\n2. Provide first\naid treatment\non board\n2.1 Simulate immediate life-saving\nfirst aid\n2.2 Simulate action on recognized\nsymptoms and acute illness /\ninjury\n2.3 Simulate action on wounds,\nbleeding, burns, bone, joint and\nmuscle injuries\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\nperformance\n3. Protect marine\nenvironment\n3.1 Simulate garbage disposal\nprocedures\n3.2 Simulate garbage segregation\n3.3\n\nRecord\ngarbage\nsegregation and disposal\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\n performance\n4. Comply with\nemergency\nprocedures\n4.1 Simulate correct action on\nbecoming aware of an\nemergency in accordance with\nvessel procedures\n4.2 Simulate emergency\nprocedures and contingency\nplans\n4.3 Simulate procedures for the\nuse of various survival\nequipment\n\n• Discussion\n• Lecture\n• Demonstration\n• Simulation\n\n• Observation\n• Demonstration\n• Practical\n performance\n\n--- PDF PAGE 79 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n77\n\nCORE COMPETENCIES\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Apply\ndeckhand\nskills aboard\na fishing\nvessel\n\n1.1 Observe safety rules and\nregulations\n1.2 Use, maintain and repair ropes\nand lines\n1.3 Perform knots, bends, hitches,\nsplicing and whipping\n1.4 Prepare winches and capstans\nassociated with fishing, for use\nand control during operation\n1.5 Prepare anchor equipment, for\nuse and control during\noperation\n1.6 Use power-operated\nequipment\n1.7 Secure the vessel at anchor\n1.8 Secure and adjust the vessel’s\nposition during mooring\noperations.\n1.9 Identify malfunction or possible\nproblems and implement\ncontingency plans\n1.10 Perform routine checks and\ninspections of vessel\n1.11 Monitor and control access\n1.12 Secure the vessel for and at\nsea\n1.13 Report on conditions\n\n• Demonstration\n• Dual training\n• Individual Self-\npaced Learning\n• Lecture\n\n• Written\nexamination\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n2. Load and\nunload\ngoods/cargo.\n2.1 Identify class and subsidiary\nrisk labels for dangerous goods\nand take appropriate action\n2.2 Follow ADG code where\napplicable\n2.3 Safely load and unload goods\nfollowing workplace procedures\n2.4 Distribute and secure load for\nsafe transport in accordance\nwith regulations\n2.5 Locate, interpret and apply\nrelevant information\n2.6 Provide customer/client service\nand work effectively with others\n2.7 Pack and unpacked loads\naccording to relevant\n• Audio Visual\n• Practical Lab\n• Lecture/\nDiscussion\n• Demonstration\n• Direct\nobservation\n• Written test or\nexamination\n• Questioning\n• Third party\nreport (to\ninclude report\non work\nattitude)\n• Demonstration/\nSimulation\n\n--- PDF PAGE 80 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n78\nrequirements/regulations\n2.8 Secure and protect load using\ncorrect load restraint and\nprotection equipment for\ndifferent loads, carrying and\nstorage conditions\n2.9 Protect load according to legal\nand workplace safety\nrequirements\n3. Assemble\nand repair\ndamaged\nnetting\n\n3.1. Prepare netting materials and\ntools for repair\n3.2. Name, identify and understand\ndifferent netting terms\n3.3. Calculate joining ratios\n3.4. Interpret signage on gear plan\n3.5. Measure different types of\nnetting\n3.6. Use a taper table to design\nnetting panels of a required\ndepth, width or taper\n3.7. Mend rips and holes\n3.8. Repair large scale damage\n3.9. Carry out routine maintenance\nand storage of materials, tools\nand equipment\n3.10. Carry out routine maintenance\nof workplace\n3.11. Recognize and report a\nproblem\n• Demonstration\n• Dual training\n• Individual Self-\npaced learning\n• Lecture\n\n• Written test\n• Demonstration\nof practical\nskills\n• Direct\nobservation\n• Interview\n\n--- PDF PAGE 81 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n79\n\n3.1 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the\ncurriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are nationally accredited.\n\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the\ncompetency standards specified by the industry. The following training\nmodalities may be adopted when designing training programs:\n\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training System\n(DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training\ndesigned to enhance the knowledge and skills of the trainee through actual\nexperience in the workplace to acquire specific competencies prescribed in\nthe training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n\n--- PDF PAGE 82 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n80\n• Project-Based Instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n3.2 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course should possess the\nfollowing requirements.\n\n•\nAble to read and write;\n•\nWith good moral character;\n•\nAbility to communicate, both oral and written\n•\nPhysically fit and mentally healthy as certified by a Public Health Officer\n\n3.4 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nFISH CAPTURE NCI (Ultimo)\n\nRecommended list of tools, equipment and materials for the training of 25 trainees\nfor Fish Capture NC I (Ultimo).\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDescription\nQTY\nDescription\nQTY\nDescription\n25\n• netting needles:\nbone\n1\n• Fishing vessel\n5\n• wire rope\n25\n• netting needles:\nflat\n2\n• Flags\n1\n• powered winch\n25\n•\nknives\n5\n•\nFlares\n5\n•\ncapstan\n25\n•\nscissors\n5\n•\nlights\n5\n•\nwindlass\n25\n• marked rod\n5\n• Two-way radio\n1\n• cable and rope\nwinches\n25\n• mesh gauge\n2\n• Electronic\nequipment\n25\n• three, four or\neight-strand rope\n25\n• ruler\n1\n• net haulers\n25\n• strengthening\nropes.\n25\n• stands\n1\n• pot or trap\nhaulers\n25\n• gill netting:\n•\nmonofilament\n25\n• tensioning\ndevices\n1\n• anchor winches\n25\n• gill netting: multi-\nmonofilament\n1\n• hot and cold\nhoses\n\n25\n• trawl and purse\nseine netting:\n•\nknotted\n25\n• brooms, mops\nand shovels\n\n25\n• trawl and purse\nseine netting:\nknotless\n25\n• cleaning cloths\n\n25\n• trawl and purse\nseine netting:\nbraided twine\n\n--- PDF PAGE 83 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n81\n25\n• bins and tubs\n\n25\n• trawl and purse\nseine netting:\ntwisted twine\n25\n• brushes\n\n25\n• trawl and purse\nseine netting:\npolyethylene\n(PE)\n25\n• cleaning\nbuckets\n\n25\n• trawl and purse\nseine netting:\npolyamide\n(nylon) (PA)\n\n25\n• Thermal and\nwaterproof\nclothing\n\n25\n• Thermal and\nprotective hand\ncovering\n\n25\n• Thermal and\nprotective hair or\nbeard cover\n\n25\n• Thermal and\nprotective\nwaterproof\nfootwear\n\n25\n•\neye protection.\n\n25\n• cleaning and\nsanitizing\nchemicals and\nagents.\n\n25\n• Food Safety\nProgram\n\n25\n• Material Safety\nData Sheet\n\n25\n• OHS\nRequirements\n\n25\n•\nfish boxes\n\n--- PDF PAGE 84 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n82\n\n3.5 TRAINING FACILITIES\n\nFISH CAPTURE NC I\n\nBased on a class size of 25 students/trainees.\n\nSPACE REQUIREMENT\nSIZE IN METERS\nAREA IN SQ.\nMETERS\nTOTAL AREA IN\nSQ. METERS\nA. Building (permanent)\n170.30\n• Student/Trainee\nWorking Space\n2.00 x 2.00 per\nstudent/trainee\n4.00 per student\n100.00\n• Learning Resource\nCenter\n3.00 x 5.00\n15.00\n15.00\n• Facilities/Equipment/Circ\nulation (30% of teaching\naccommodation)\n\n39.30\n• Store Room\n4.00 x 4.00\n16.00\n16.00\nB. Experimental Deck\nArea\n\n90\nTotal Area\n430.60\nNote: Experimental area will change according to availability of land.\n\n3.6 TRAINER’S QUALIFICATIONS FOR AGRI-FISHERY SECTOR\n\nFISH CAPTURE NC I\n\nTRAINER QUALIFICATION (TQ I)\n•\nMust be a holder of Fish Capture NC II or its equivalent\n•\nMust have undergone training on Training Methodology I (TM I)\n•\nMust be computer literate\n•\nMust be physically and mentally fit\n•\n*Must have at least 2 years job/industry experience\n•\nMust be a civil service eligible (for government position or appropriate\nprofessional license issued by the Professional Regulatory Commission)\n\n* Optional. Only when required by the hiring institution.\n\nReference: TESDA Board Resolution No. 2004 03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\n--- PDF PAGE 85 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n83\nInstitutional Assessment is to be undertaken by the learner who enrolled\nin a structured learning program to determine the achievement of competencies.\nIt is administered by the trainer/assessor at end of each learning module."
