  "source_text": "DEFINITION OF TERMS\n\nFor the purpose of this standard, the word\n\n• Accident – unwanted incidents involving injury or damage to life, the\nenvironment, the ship or cargo\n\n• Anchor– a heavy forging or casting comprising a shank with shackles or ring at\none end and two arms with palms at the other, so shaped as to grip the sea\nbottom, by means of cable or rope hold a boat / ship regardless of wind and\ncurrent\n\n• Ballast – a quantity of iron, stone, gravel or other weighty substance like (water,\noil, etc) placed in the lower hold of the boat/ship to increase stability by lowering\nthe center of gravity.\n\n• Bend – a knot by which one rope is fastened to another to some object.\n\n• Bilge – a place in the lower part of the boat / ship where waste water collects\nand which bilge suctions are placed for pumping out\n\n• Boat – a small open craft propelled by oars sails, or some form of engine. This\nterm also applied to a larger boats built to navigate rivers and inland waters.\n\n• Capstan – a machine for moving or raising heavy weights and consist of a\nvertical drum that can be rotated and around which cable is turned\n\n• Deck – a platform in a ship that is structural element and forming the floor for its\ncompartment\n\n• Deckhand– a seaman who perform manual and other duties on board a vessel\n\n• Fish capture – the taking of fishery species by passive or active gear for trade,\nbusiness or profit beyond subsistence or sport fishing and classified further as\nfollows:\no Small scale commercial fishing – fishing utilizing fishing vessels of\n3.1 gross tons (GT) up to 20 GT\no Medium scale commercial fishing – fishing utilizing fishing vessels of\n20.1 GT up to 150 GT; and\no Large scale commercial fishing – fishing utilizing fishing vessel of\nmore than 150 GT\n\n• Fishing gear – fishing equipment and paraphernalia\n\n--- PDF PAGE 91 ---\n________________________________________________\nTR – Fish Capture NC I\n88\n• Fish fighting equipment – equipment use to extinguish fire as per type.\n\n• Hitch– any of various knots used to form a temporary noose in a line or to secure\na line temporarily to an object\n\n• Knot – the interlacement of the parts of one or more flexible bodies forming a\nump or knob\n\n• Life saving appliances – are outfits designed for life preservation\n\n• Mooring – a act of making fast a boat with lines or anchor\n\n• Netting – fishing gear component made of open meshed fabric\n\n• Seaworthiness – refers to the ability of a boat / ship to withstand the action of\nthe sea, wind and weather\n\n• Winch – any of various machines or instruments for pulling or hauling, with one\nor more drums on which to coil a rope, cable or chain.\n\n• Windlass - a steam or electric winch with horizontal or vertical shaft and two\ndrums used to raise a ship’s anchor.\n\n--- PDF PAGE 92 ---\n________________________________________________\nTR – Fish Capture NC I\n89"
