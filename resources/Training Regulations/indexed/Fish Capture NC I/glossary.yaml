      "definition": "• Accident – unwanted incidents involving injury or damage to life, the environment, the ship or cargo • Anchor– a heavy forging or casting comprising a shank with shackles or ring at one end and two arms with palms at the other, so shaped as to grip the sea bottom, by means of cable or rope hold a boat / ship regardless of wind and current • Ballast – a quantity of iron, stone, gravel or other weighty substance like (water, oil, etc) placed in the lower hold of the boat/ship to increase stability by lowering the center of gravity. • Bend – a knot by which one rope is fastened to another to some object. • Bilge – a place in the lower part of the boat / ship where waste water collects and which bilge suctions are placed for pumping out • Boat – a small open craft propelled by oars sails, or some form of engine. This term also applied to a larger boats built to navigate rivers and inland waters. • Capstan – a machine for moving or raising heavy weights and consist of a vertical drum that can be rotated and around which cable is turned • Deck – a platform in a ship that is structural element and forming the floor for its compartment • Deckhand– a seaman who perform manual and other duties on board a vessel • Fish capture – the taking of fishery species by passive or active gear for trade, business or profit beyond subsistence or sport fishing and classified further as follows: o Small scale commercial fishing – fishing utilizing fishing vessels of 3.1 gross tons (GT) up to 20 GT o Medium scale commercial fishing – fishing utilizing fishing vessels of 20.1 GT up to 150 GT; and o Large scale commercial fishing – fishing utilizing fishing vessel of more than 150 GT • Fishing gear – fishing equipment and paraphernalia • Fish fighting equipment – equipment use to extinguish fire as per type. • Hitch– any of various knots used to form a temporary noose in a line or to secure a line temporarily to an object • Knot – the interlacement of the parts of one or more flexible bodies forming a ump or knob • Life saving appliances – are outfits designed for life preservation • Mooring – a act of making fast a boat with lines or anchor • Netting – fishing gear component made of open meshed fabric • Seaworthiness – refers to the ability of a boat / ship to withstand the action of the sea, wind and weather • Winch – any of various machines or instruments for pulling or hauling, with one or more drums on which to coil a rope, cable or chain. • Windlass - a steam or electric winch with horizontal or vertical shaft and two drums used to raise a ship’s anchor."
