        "descriptor": "This unit covers the skills and knowledge required to carry out basic deckhand duties aboard a fishing vessel including rope work, assisting in anchoring, mooring, operating winches and windlasses and preparing a fishing vessel for sea.",
        "elements": [
          {
            "number": 1,
            "title": "Operate winches, capstans and windlasses",
            "performance_criteria": [
              {
                "number": "1.1",
                "text": "Rope materials, methods of construction, measurement methods, physical characteristics and common areas of use are correctly identified.",
                "source_number": "1.2"
              },
              {
                "number": "1.2",
                "text": "Ropes are checked for wear, maintained in accordance with enterprise procedures and manufacturers’ guidelines, and coiled and stowed correctly.",
                "source_number": "1.3"
              },
              {
                "number": "1.3",
                "text": "Knots, bends and hitches are tied neatly and securely and are used according to their correct application.",
                "source_number": "1.4"
              },
              {
                "number": "1.4",
                "text": "Ropes are spliced neatly and securely according to their correct application and rope ends are whipped, where appropriate, to maintain good condition.",
                "source_number": "1.5"
              },
              {
                "number": "1.5",
                "text": "Operations are carried out according to established safety rules and regulations.",
                "source_number": "2.1"
              },
              {
                "number": "1.6",
                "text": "Winches, capstans and windlasses are selected, as appropriate, checked and prepared for the operation prior to use.",
                "source_number": "2.2"
              },
              {
                "number": "1.7",
                "text": "Winches, capstans and windlasses are safely operated to carry out fishing vessel deck operations in accordance with operational requirements and manufacturers’ instructions, where appropriate.",
                "source_number": "2.3"
              }
            ],
            "source_number": 2
          },
          {
            "number": 2,
            "title": "Secure the vessel at anchor TR- Fish Capture NC I",
            "performance_criteria": [
              {
                "number": "2.1",
                "text": "Securing of the vessel is carried out according to established safety rules and regulations.",
                "source_number": "3.1"
              },
              {
                "number": "2.2",
                "text": "Preparation of the anchor and equipment prior to letting go is appropriate to the depth of water, weather and sea conditions, and tidal range in area of operation. 51",
                "source_number": "3.2"
              }
            ],
            "source_number": 3
          },
          {
            "number": 3,
            "title": "Secure and adjust the vessel’s position during mooring operations",
            "performance_criteria": [
              {
                "number": "3.1",
                "text": "Quantity of anchor cable run out or recovered complies with orders provided.",
                "source_number": "3.3"
              },
              {
                "number": "3.2",
                "text": "Control of the cable is maintained within safe operating limits during normal operation.",
                "source_number": "3.4"
              },
              {
                "number": "3.3",
                "text": "Degree to which the anchor and equipment is secured on completion of anchoring operations is appropriate to forecast conditions and complies with orders provided.",
                "source_number": "3.5"
              },
              {
                "number": "3.4",
                "text": "Manufacturers’ recommendations and anchoring requirements are followed during anchor winch operations.",
                "source_number": "3.6"
              },
              {
                "number": "3.5",
                "text": "Anchoring area is kept free of loose ropes, wires and debris throughout all operations.",
                "source_number": "3.7"
              },
              {
                "number": "3.6",
                "text": "Mooring of the vessel is carried out according to established safety rules and regulations.",
                "source_number": "4.1"
              },
              {
                "number": "3.7",
                "text": "Mooring lines and associated equipment are handled safely and efficiently at all times.",
                "source_number": "4.2"
              },
              {
                "number": "3.8",
                "text": "Mooring area is kept free of loose ropes, wires and debris throughout all operations.",
                "source_number": "4.3"
              },
              {
                "number": "3.9",
                "text": "Tension on mooring lines is maintained at a level appropriate to the stage and nature of the operation when warping the vessel or maintaining position.",
                "source_number": "4.4"
              },
              {
                "number": "3.10",
                "text": "Reports of incidents made to supervisory personnel are complete and at a time designed to maximize the mooring security of the vessel.",
                "source_number": "4.5"
              },
              {
                "number": "3.11",
                "text": "Mooring lines are secured in accordance with orders provided, forecast tidal conditions and planned vessel operations.",
                "source_number": "4.6"
              },
              {
                "number": "3.12",
                "text": "Equipment malfunction or problems during operations are promptly recognized and appropriate corrective action is taken.",
                "source_number": "4.7"
              },
              {
                "number": "3.13",
                "text": "Communication is clear and concise at all times.",
                "source_number": "4.8"
              }
            ],
            "source_number": 4
          },
          {
            "number": 4,
            "title": "Monitor the situation of the vessel when moored or anchored TR- Fish Capture NC I",
            "performance_criteria": [
              {
                "number": "4.1",
                "text": "Monitoring operations are planned and carried out in accordance with established safety rules and regulations.",
                "source_number": "5.1"
              },
              {
                "number": "4.2",
                "text": "Frequency, timing and coverage of scheduled checks and inspections comply with watch- keeping instructions.",
                "source_number": "5.2"
              },
              {
                "number": "4.3",
                "text": "Action taken in the event of irregularities or abnormal conditions is appropriate to their significance and within the job holder’s responsibility to implement.",
                "source_number": "5.3"
              },
              {
                "number": "4.4",
                "text": "Reports of incidents made to supervisory personnel are complete and at a time designed to maximize the safety and integrity of the vessel.",
                "source_number": "5.4"
              },
              {
                "number": "4.5",
                "text": "Restrictions on access to the vessel by visitors are in accordance with watch-keeping instructions. 52",
                "source_number": "5.5"
              }
            ],
            "source_number": 5
          },
          {
            "number": 5,
            "title": "Secure the vessel for and at sea TR- Fish Capture NC I",
            "performance_criteria": [
              {
                "number": "5.1",
                "text": "Checks on vessel security are planned and carried out in accordance with established safety and security rules and regulations.",
                "source_number": "6.1"
              },
              {
                "number": "5.2",
                "text": "Coverage and frequency of checks and inspections on the vessel’s seaworthiness comply with orders received.",
                "source_number": "6.2"
              },
              {
                "number": "5.3",
                "text": "Watertight integrity is checked and appropriate action is taken to prepare for prevailing and forecast weather and sea conditions.",
                "source_number": "6.3"
              },
              {
                "number": "5.4",
                "text": "Degree to which the vessel is secured is appropriate to prevailing and forecast conditions and complies with orders received.",
                "source_number": "6.4"
              },
              {
                "number": "5.5",
                "text": "Action taken in the event of irregularities is appropriate to their significance and within the job holder’s responsibility to implement.",
                "source_number": "6.5"
              },
              {
                "number": "5.6",
                "text": "Reports of conditions made to supervisory personnel are complete, accurate and completed in accordance with enterprise procedures and regulatory requirements.",
                "source_number": "6.6"
              },
              {
                "number": "5.7",
                "text": "Reports to supervisory personnel on irregularities beyond the job holder’s ability to rectify are made in time to enable remedial action to be taken. 53",
                "source_number": "6.7"
              }
            ],
            "source_number": 6
          }
        ],
