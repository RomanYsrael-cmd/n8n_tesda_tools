  "source_section_text": "SECTION 2\n\nCOMPETENCY STANDARDS\n\nThese guidelines are set to provide the Technical Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider\nwhen designing training programs for Fish Capture NC I. These units of competency\nare categorized into basic, common and core competencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY: RECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION\nUNIT CODE : 500311101\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto receive, respond and act on verbal and written\ncommunication.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Follow routine spoken\nmessages\n1.1.\nRequired information is gathered by listening\nattentively and correctly interpreting or\nunderstanding information/instructions\n1.2.\nInstructions/information are properly recorded\n1.3.\nInstructions are acted upon immediately in\naccordance with information received\n1.4.\nClarification is sought from workplace supervisor\non all occasions when any instruction/information\nis not clear\n2. Perform workplace\nduties following written\nnotices\n2.1 Written notices and instructions are read and\ninterpreted correctly in accordance with\norganizational guidelines\n2.2 Routine written instruction are followed in\nsequence\n2.3 Feedback is given to workplace supervisor based\non the instructions/information received\n\n--- PDF PAGE 5 ---\n________________________________________________________________\nTR- Fish Capture NC I\n3\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nIt refers to :\n1.1. Handwritten and printed material\n1.2. Internal memos\n1.3. External communications\n1.4. Electronic mail\n1.5. Briefing notes\n1.6. General correspondence\n1.7. Marketing materials\n1.8. Journal articles\n2. Organizational Guidelines\nIt may include:\n2.1. Information documentation procedures\n2.2. Company policies and procedures\n2.3. Organization manuals\n2.4. Service manual\n\n--- PDF PAGE 6 ---\n________________________________________________________________\nTR- Fish Capture NC I\n4\n\nEVIDENCE GUIDE\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Demonstrated knowledge of organizational procedures\nfor handling verbal and written communications\n1.2. Received and acted on verbal messages and\ninstructions\n1.3. Demonstrated competency in recording\ninstructions/information\n\n2. Underpinning\nKnowledge and\nAttitudes\n2.1. Knowledge of organizational policies/guidelines in\nregard to processing internal/external information\n2.2. Ethical work practices in handling communications\n2.3. Communication process\n3. Underpinning\nSkills\n3.1. Conciseness in receiving and clarifying\nmessages/information/communication\n3.2. Accuracy in recording messages/information\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1. Pens\n4.2. Note pads\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1. Direct Observation\n5.2. Oral interview\n5.3. Written Evaluation\n5.4. Third Party Report\n\n6. Context of\nAssessment\n6.1. Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA\naccredited institutions\n\n--- PDF PAGE 7 ---\n________________________________________________________________\nTR- Fish Capture NC I\n5\n\nUNIT OF COMPETENCY : WORK WITH OTHERS\n\nUNIT CODE\n:\n500311102\n\nUNIT DESCRIPTOR\n:\nThis unit cover the skills, knowledge and attitudes\nrequired to develop workplace relationship and contribute\nin workplace activities.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1. Develop effective\nworkplace relationship\n1.1 Duties and responsibilities are done in a positive\nmanner to promote cooperation and good relationship\n1.2 Assistance is sought from workgroup when\ndifficulties arise and addressed through discussions\n1.3 Feedback provided by others in the team is\nencouraged, acknowledged and acted upon\n1.4 Differences in personal values and beliefs are\nrespected and acknowledged in the development\n2. Contribute to work\ngroup activities\n2.1 Support is provided to team members to ensure\nworkgroup goals are met\n2.2 Constructive contributions to workgroup goals and\ntasks are made according to organizational\nrequirements\n2.3 Information relevant to work is shared with team\nmembers to ensure designated goals are met\n\n--- PDF PAGE 8 ---\n________________________________________________________________\nTR- Fish Capture NC I\n6\n\nRANGE OF VARIABLES\nVARIABLE\n RANGE\n1. Duties and\nresponsibilities\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements including OHS\n1.5 Code of conduct\n2. Work group\n2.1 Supervisor or manager\n2.2 Peers/work colleagues\n2.3 Other members of the organization\n3. Feedback on\nperformance\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues and\nclients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring service\ndelivery\n4. Providing\nsupport to team\nmembers\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n5. Organizational\nrequirements\n\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes and\nstandards\n\n--- PDF PAGE 9 ---\n________________________________________________________________\nTR- Fish Capture NC I\n7\n\n EVIDENCE GUIDE\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1.\nProvided support to team members to ensure goals\nare met\n1.2.\nActed on feedback from clients and colleagues\n1.3.\nAccessed learning opportunities to extend own\npersonal work competencies to enhance team goals\nand outcomes\n2. Underpinning\nKnowledge\n2.1.\nThe relevant legislation that affects operations,\nespecially with regards to safety\n2.2.\nReasons why cooperation and good relationships are\nimportant\n2.3.\nKnowledge of the organization’s policies, plans and\nprocedures\n2.4.\nUnderstanding how to elicit and interpret feedback\n2.5.\nKnowledge of workgroup member’s responsibilities\nand duties\n2.6.\nImportance of demonstrating respect and empathy in\ndealings with colleagues\n2.7.\nUnderstanding of how to identify and prioritize\npersonal development opportunities and options\n3. Underpinning Skills\n3.1.\nAbility to read and understand the organization’s\npolicies and work procedures\n3.2.\nWrite simple instructions for particular routine tasks\n3.3.\nInterpret information gained from correspondence\n3.4.\nCommunication skills to request advice, receive\nfeedback and work with a team\n3.5.\nPlanning skills to organized work priorities and\narrangement\n3.6.\nTechnology skills including the ability to select and\nuse technology appropriate to a task\n3.7.\nAbility to relate to people from a range of social,\ncultural and ethnic backgrounds.\n\n--- PDF PAGE 10 ---\n________________________________________________________________\nTR- Fish Capture NC I\n8\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1.\nAccess to relevant workplace or appropriately\nsimulated environment where assessment can take\nplace\n4.2.\nMaterials relevant to the proposed activity or task\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1.\nDirect observations of work activities of the\nindividual member in relation to the work activities of\nthe group\n5.2.\nObservation of simulation and/or role play involving\nthe participation of individual member to the\nattainment of organizational goal\n5.3.\nCase studies and scenarios as a basis for\ndiscussion of issues and strategies\n6. Context for\nAssessment\n6.1.\nCompetency assessment may occur in workplace or\nany appropriately simulated environment\n6.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 11 ---\n________________________________________________________________\nTR- Fish Capture NC I\n9\nUNIT OF COMPETENCY: DEMONSTRATE WORK VALUES\nUNIT CODE\n 500311103\n\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, and attitude in\ndemonstrating proper work values.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Define the purpose\nof work\n\n1.1 One’s unique sense of purpose for working and the\nwhy’s of work are identified, reflected on and clearly\ndefined for one’s development as a person and as a\nmember of society.\n1.2 Personal mission is in harmony with company’s values\n\n2. Apply work\nvalues/ethics\n2.1 Work values/ethics/concepts are classified and\nreaffirmed in accordance with the transparent company\nethical standards, policies and guidelines.\n2.2 Work practices are undertaken in compliance with\nindustry work ethical standards, organizational policy\nand guidelines\n2.3 Personal behavior and relationships with co-workers\nand/or clients are conducted in accordance with ethical\nstandards, policy and guidelines.\n2.4 Company resources are used in accordance with\ntransparent company ethical standard, policies and\nguidelines.\n3. Deal with ethical\nproblems\n3.1 Company ethical standards, organizational policy and\nguidelines on the prevention and reporting of unethical\nconduct are accessed and applied in accordance with\ntransparent company ethical standard, policies and\nguidelines.\n3.2 Work incidents/situations are reported and/or\nresolved in accordance with company\nprotocol/guidelines.\n3.3 Resolution and/or referral of ethical problems identified\nare used as learning opportunities.\n4. Maintain integrity of\nconduct in the\nworkplace\n4.1 Personal work practices and values are demonstrated\nconsistently with acceptable ethical conduct and\ncompany’s core values.\n4.2 Instructions to co-workers are provided based on\nethical, lawful and reasonable directives.\n4.3 Company values/practices are shared with co-workers\nusing appropriate behavior and language.\n\n--- PDF PAGE 12 ---\n________________________________________________________________\nTR- Fish Capture NC I\n10\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work values/ethics/ concepts\nMay include but are not limited to:\n1.1 Commitment/ Dedication\n1.2 Sense of urgency\n1.3 Sense of purpose\n1.4 Love for work\n1.5 High motivation\n1.6 Orderliness\n1.7 Reliability\n1.8 Competence\n1.9 Dependability\n1.10 Goal-oriented\n1.11 Sense of responsibility\n1.12 Being knowledgeable\n1.13 Loyalty to work/company\n1.14 Sensitivity to others\n1.15 Compassion/Caring attitude\n1.16 Balancing between family and work\n1.17 Pakikisama\n1.18 Bayanihan spirit/teamwork\n1.19 Sense of nationalism\n2. Work practices\n2.1 Quality of work\n2.2 Punctuality\n2.3 Efficiency\n2.4 Effectiveness\n2.5 Productivity\n2.6 Resourcefulness\n2.7 Innovativeness/Creativity\n2.8 Cost conciousness\n2.9 5S\n2.10 Attention to details\n3. Incidents/situations\n3.1 Violent/intensed dispute or argument\n3.2 Gambling\n3.3 Use of prohibited substances\n3.4 Pilferages\n3.5 Damage to person or property\n3.6 Vandalism\n3.7 Falsification\n3.8 Bribery\n3.9 Sexual Harassment\n3.10 Blackmail\n\n--- PDF PAGE 13 ---\n________________________________________________________________\nTR- Fish Capture NC I\n11\n\nVARIABLE\nRANGE\n\n4. Company resources\n\n4.1 Consumable materials\n4.2 Equipment/Machineries\n4.3 Human\n4.4 Time\n4.5 Financial resources\n\n5. Instructions\n\n5.1 Verbal\n5.2 Written\n\n--- PDF PAGE 14 ---\n________________________________________________________________\nTR- Fish Capture NC I\n12\n\nEVIDENCE GUIDE\n1. Critical Aspects\n of Competency\nAssessment requires evidence that the candidate:\n1.1 Defined one’s unique sense of purpose for working\n1.2 Clarified and affirmed work values/ethics/concepts\nconsistently in the workplace\n1.3 Demonstrated work practices satisfactorily and consistently\nin compliance with industry work ethical standards,\norganizational policy and guidelines\n1.4 Demonstrated personal behavior and relationships with co-\nworkers and/or clients consistent with ethical standards,\npolicy and guidelines\n1.5 Used company resources in accordance with company\nethical standard, policies and guidelines.\n1.6 Followed company ethical standards, organizational policy\nand guidelines on the prevention and reporting of unethical\nconduct/behavior\n2. Underpinning\nKnowledge\n2.1 Occupational health and safety\n2.2 Work values and ethics\n2.3 Company performance and ethical standards\n2.4 Company policies and guidelines\n2.5 Fundamental rights at work including gender sensitivity\n2.6 Work responsibilities/job functions\n2.7 Corporate social responsibilities\n2.8 Company code of conduct/values\n2.9 Balancing work and family responsibilities\n3. Underpinning\nSkills\n3.1 Interpersonal skills\n3.2 Communication skills\n3.3 Self awareness, understanding and acceptance\n3.4 Application of good manners and right conduct\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Workplace or assessment location\n4.2 Case studies/Scenarios\n5. Methods of\nAssessment\nCompetency may be assessed through:\n5.1 Portfolio Assessment\n5.2 Interview\n5.3 Third Party Reports\n6. Context of\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 15 ---\n________________________________________________________________\nTR- Fish Capture NC I\n13\n\nUNIT OF COMPETENCY: PRACTICE HOUSEKEEPING PROCEDURES\n\nUNIT CODE : 500311104\n\nUNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes required\nto apply the basic housekeeping procedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Sort and remove\nunnecessary items\n1.1 Reusable, recyclable materials are sorted in\naccordance with company/office procedures\n1.2 Unnecessary items are removed and disposed of\nin accordance with company or office procedures\n2. Arrange items\n2.1 Items are arranged in accordance with\ncompany/office housekeeping procedures\n2.2 Work area is arranged according to job\nrequirements\n2.3 Activities are prioritized based on instructions.\n2.4 Items are provided with clear and visible\nidentification marks based on procedure\n2.5 Safety equipment and evacuation passages are\nkept clear and accessible based on instructions\n3. Maintain work area, tools\nand equipment\n3.1 Cleanliness and orderliness of work area is\nmaintained in accordance with company/office\nprocedures\n3.2 Tools and equipment are cleaned in accordance\nwith manufacturer’s instructions/manual\n3.3 Minor repairs are performed on tools and\nequipment in accordance with manufacturer’s\ninstruction/manual\n3.4 Defective tools and equipment are reported to\nimmediate supervisor\n4. Follow standardized work\nprocess and procedures\n4.1 Materials for common use are maintained in\ndesignated area based on procedures\n4.2 Work is performed according to standard work\nprocedures\n4.3 Abnormal incidents are reported to immediate\nsupervisor\n5. Perform work\nspontaneously\n5.1 Work is performed as per instruction\n5.2 Company and office decorum are followed and\ncomplied with\n5.3 Work is performed in accordance with\noccupational health and safety (OHS)\nrequirements\n\n--- PDF PAGE 16 ---\n________________________________________________________________\nTR- Fish Capture NC I\n14\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Unnecessary items\nMay include but are not limited to:\n1.1 Non-recyclable materials\n1.2 Unserviceable tools and equipment\n1.3 Pictures, posters and other materials not\n related to work activity\n1.4 Waste materials\n2. Identification marks\n2.1 Labels\n2.2 Tags\n2.3 Color coding\n3. Decorum\n3.1 Company/ office rules and regulations\n3.2 Company/ office uniform\n3.3 Behavior\n4. Minor repair\nMinor repair include but not limited to:\n4.1 Replacement of parts\n4.2 Application of lubricants\n4.3 Sharpening of tools\n4.4 Tightening of nuts, bolts and screws\n\n--- PDF PAGE 17 ---\n________________________________________________________________\nTR- Fish Capture NC I\n15\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Practiced the basic procedures of 5S\n\n2. Underpinning\nKnowledge and\nAttitudes\n2.1 Principles of 5S\n2.2 Work process and procedures\n2.3 Safety signs and symbols\n2.4 General OH&S principles and legislation\n2.5 Environmental requirements relative to work safety\n2.6 Accident/Hazard reporting procedures\n3. Underpinning\nSkills\n3.1 Basic communication skills\n3.2 Interpersonal skills\n3.3 Reading skills required to interpret instructions\n3.4 Reporting/recording accidents and potential hazards\n\n4. Resource\nImplications\nThe following resources MUST be provided:\n4.1 Facilities, materials tools and equipment necessary for\nthe activity\n5. Methods of\nAssessment\nCompetency must be assessed through:\n5.1 Third party report\n5.2 Interview\n5.3 Demonstration with questioning\n6. Context for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n\n--- PDF PAGE 18 ---\n________________________________________________________________\nTR- Fish Capture NC I\n16\nCOMMON COMPETENCIES\nFor Agri-Fishery Sector\n\nUNIT TITLE\n : APPLY SAFETY MEASURES IN FARM OPERATIONS\n\nUNIT CODE\n : AGR321201\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes required to\nperform safety measures effectively and efficiently. It includes\nidentifying areas, tools, materials, time and place in performing\nsafety measures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nDetermine areas of\nconcern for safety\nmeasures\n1.1\nWork tasks are identified in line with farm\noperations\n1.2\nPlace for safety measures are determined in\nline with farm operations\n1.3\nTime for safety measures are determined in line\nwith farm operations\n1.4\nAppropriate tools, materials and outfits are\nprepared in line with job requirements\n2.\nApply appropriate safety\nmeasures\n2.1\nTools and materials are used according to\nspecifications and procedures\n2.2\nOutfits are worn according to farm requirements\n2.3\nEffectivity/shelf life/expiration of materials are\nstrictly observed\n2.4\nEmergency procedures are known and\nfollowed to ensure a safework requirement\n2.5\nHazards in the workplace are identified and\nreported in line with farm guidelines\n3.\nSafekeep/dispose tools,\nmaterials and outfit\n3.1\nUsed tools and outfit are cleaned after use and\nstored in designated areas\n3.2\nUnused materials are properly labeled and\nstored according to manufacturers\nrecommendation and farm requirements\n3.3\nWaste materials are disposed according to\nmanufacturers, government and farm\nrequirements\n\n--- PDF PAGE 19 ---\n________________________________________________________________\nTR- Fish Capture NC I\n17\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1. Work tasks\nWork task may be selected from any of the following\nsectors:\n1.1 Aquaculture\n1.2 Animal Production\n1.3 Crop Production\n1.4 Post-harvest\n1.5 Agri-marketing\n1.6\nFarm Equipment\n2. Place\n2.1 Animal pens, cages, barns\n2.2 Fish ponds, cages\n2.3 Stock room/storage areas/warehouse\n2.4 Field/farm/orchard\n3. Time\n3.1 Vaccination and medication period\n3.2 Fertilizer and pesticides application\n3.3 Feed mixing and feeding\n3.4 Harvesting and hauling\n4. Tools, materials and outfits\n4.1 Tools\n4.1.1\nWrenches\n4.1.2\nScrew driver\n4.1.3\nPliers\n4.2 Materials\n4.2.1\nBottles\n4.2.2\nPlastic\n4.2.3\nBags\n4.2.4\nSyringe\n4.3 Outfit\n4.3.1\nMasks\n4.3.2\nGloves\n4.3.3\nBoots\n4.3.4\nOverall coats\n4.3.5\nHat\n4.3.6\nEye goggles\n5. Emergency procedures\n5.1 Location of first aid kit\n5.2 Evacuation\n5.3 Agencies contract\n5.4\nFarm emergency procedures\n\n--- PDF PAGE 20 ---\n________________________________________________________________\nTR- Fish Capture NC I\n18\n\n6. Waste materials\n6.1 Animal manure\n6.2 Waste water\n6.3 Syringes\n6.4 Unused farm chemicals e.g. pesticides,\nchemicals, fertilizers\n6.5 Expired reagents\n6.6\nDead animals\n7. Hazards\n7.1 Chemical\n7.2 Electrical\n7.3\nFalls\n\n--- PDF PAGE 21 ---\n________________________________________________________________\nTR- Fish Capture NC I\n19\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Determined areas of concern for safety measures\n1.2 Applied appropriate safety measures according to industry\nrequirements\n1.3 Prepared tools, materials and outfit needed\n1.4 Performed proper disposal of used materials\n1.5 Safekeep/cleaned tools, materials and outfit in designated\nfacilities\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1 Safety Practices\n2.1.1 Implementation of regulatory controls and policies\nrelative to treatment of area and application of\nchemicals\n2.1.2 Proper disposal of waste materials\n2.2 Codes and Regulations\n2.2.1 Compliance to health program of DOH and DENR\n2.2.2 Hazard identification\n2.2.3 Emergency procedures\n\n2.3 Tools & Equipment: Uses and Specification\n2.3.1 Masks, gloves, boots, overall coats for health\nprotection\n\n2.4 Maintenance\n2.4.1\nRegular check-up and repair of tools, materials\nand outfit before and after use\n3. Underpinning\nSkills\n3.1\nAbility to recognize effective tools, materials and outfit\n3.2\nReady skills required to read labels, manuals and other\nbasic safety information\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nPractical demonstration\n4.2\nThird Party Report\n5. Resource\nImplications\n5.1 Farm location\n5.2 Tools, equipment and outfits appropriate in applying safety\nmeasures\n6. Context of\nAssessment\n6.1\nAssessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 22 ---\n________________________________________________________________\nTR- Fish Capture NC I\n20\n\nUNIT TITLE: USE FARM TOOLS AND EQUIPMENT\n\nUNIT CODE: AGR321202\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes required to use\nfarm tools and equipment. It includes selection, operation and\npreventive maintenance of farm tools and equipment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1.\nSelect and use farm tools\n\n1.1\nIdentified appropriate farm tools according to\nrequirement/use\n1.2\nFarm tools are checked for faults and defective\ntools reported in accordance with farm\nprocedures\n1.3\nAppropriate tools and equipment are safely\nused according to job requirements and\nmanufacturers conditions\n2.\nSelect and operate farm\nequipment\n2.1\nIdentify appropriate farm equipment\n2.2\nInstructional manual of the farm tools and\nequipment are carefully read prior to operation\n2.3\nPre-operation check-up is conducted in line\nwith manufacturers manual\n2.4\nFaults in farm equipment are identified and\nreported in line with farm procedures\n2.5\nFarm equipment used according to its function\n2.6\nFollowed safety procedures\n3.\nPerform preventive\nmaintenance\n3.1\nTools and equipment are cleaned immediately\nafter use in line with farm procedures\n3.2\nRoutine check-up and maintenance are\nperformed\n3.3\nTools and equipment are stored in designated\nareas in line with farm procedures\n\n--- PDF PAGE 23 ---\n________________________________________________________________\nTR- Fish Capture NC I\n21\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Farm equipment\n\n1.1 Engine\n1.2 Pumps\n1.3 Generators\n1.4 Sprayers\n2. Farm tools\n2.1 Sickle\n2.2 Cutters\n2.3 Weighing scales\n2.4 Hand tools\n2.5 Measuring tools\n2.6 Garden tools\n3. Pre-operation check-up\n3.1 Tires\n3.2 Brake fluid\n3.3 Fuel\n3.4 Water\n3.5 Oil\n3.6 Lubricants\n3.7 Battery\n\n--- PDF PAGE 24 ---\n________________________________________________________________\nTR- Fish Capture NC I\n22\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nCorrectly identified appropriate farm tools and equipment\n1.2\nOperated farm equipments according to manual\nspecification\n1.3\nPerformed preventive maintenance\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1\nSafety Practices\n2.1.1 Ideal good work habits to demonstrate to workers\neasy and safety standards during operation of\nfarm equipment\n2.2\nCodes and Regulations\n2.2.1 Environmental Compliance Certificate (ECG)\n2.2.2 Effective work supervision in the operations of\nfarm equipment\n\n2.3\nTools & Equipment: Uses and Specification\n2.3.1 Knowledge in calibrating and use of equipment\n2.3.2 Safety keeping of equipments every after use\n\n2.4\nMaintenance\n2.4.1 Regular upkeep of equipments\n2.4.2 Preventive maintenance skills\n\n2.5\nValues\n2.5.1 Positive outlook towards work\n2.5.2\nPossesses pre-emptive/anticipatory skills\n3.\nUnderpinning\nSkills\n3.1\nAbility to recognized defective farm equipment\n3.2\nPerform proper management practices of safety\nmeasures\n4.\nMethod of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nDirect observation\n4.2\nPractical demonstration\n4.3\nThird Party Report\n5.\nResource\nImplications\n5.1\nService/operational manual of farm tools and equipment\n5.2 Tools and equipment\n5.3 Farm implements\n6.\nContext of\nAssessment\n6.1\nAssessment may occur in the workplace or in a\nsimulated workplace or as part of a team under limited\nsupervision\n\n--- PDF PAGE 25 ---\n________________________________________________________________\nTR- Fish Capture NC I\n23\n\nUNIT TITLE:\nPERFORM ESTIMATION AND BASIC CALCULATION\n\nUNIT CODE:\nAGR321203\n\nUNIT DESCRIPTOR: This unit covers the knowledge, skills and attitudes required to\nperform basic workplace calculations.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n\n1.\nPerform estimation\n1.1 Job requirements are identified from written or\noral communications\n1.2 Quantities of materials and resources required to\ncomplete a work task are estimated\n1.3 The time needed to complete a work activity is\nestimated\n1.4 Accurate estimate for work completion are made\n1.5 Estimate of materials and resources are reported\nto appropriate person\n2.\nPerform basic workplace\ncalculation\n2.1 Calculations to be made are identified according\nto job requirements\n2.2 Correct method of calculation identified\n2.3 System and units of measurement to be\nfollowed are ascertained\n2.4 Calculation needed to complete work tasks are\nperformed using the four basic process of\naddition, division, multiplication and subtraction\n2.5 Calculate whole fraction, percentage and mixed\nwhen are used to complete the instructions\n2.6 Number computed in self checked and completed\nfor alignment\n\n--- PDF PAGE 26 ---\n________________________________________________________________\nTR- Fish Capture NC I\n24\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1.\nCalculations\n\n1.1\nQuantity of feeds\n1.2\nAmount of fertilizer\n1.3\nAmount of medicines\n2.\nMethod of calculation\n\n2.1\nAddition\n2.2\nSubtraction\n2.3\nMultiplication\n2.4\nDivision\n2.5\nRatio and proportion\n3.\nSystem of measurement\n3.1\nEnglish\n3.2\nMetric\n4.\nUnits of measurement\n4.1\nArea\n4.2\nVolume\n4.3\nWeight\n\n--- PDF PAGE 27 ---\n________________________________________________________________\nTR- Fish Capture NC I\n25\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nPerformed estimation\n1.2\nPerformed basic workplace calculation\n1.3\nApplied corrective measures as maybe necessary\n2. Underpinning\nKnowledge and\nAttitudes\n\n2.1\nMathematics\n2.1.1\nBasic mathematical operations\n2.1.2\nPercentage and ratios\n2.1.3\nUnit Conversion\n2.1.4\nBasic accounting principles and procedures\n2.1.4.1 Production cost\n2.1.4.2 Sales\n2.1.4.3 Accounts receivables/payables\n\n2.2\nSystems, Processes and Operations\n2.2.1 Knowledge in different management practices and\noperational procedures\n\n2.3\nValues\n2.3.1 Safety consciousness\n2.3.2 Time consciousness and management\n2.3.3 Cost consciousness\n2.3.4 Precision\n3. Underpinning\nSkills\n3.1\nAbility to perform basic calculation\n3.2\nCommunicate effectively\n4. Method of\nAssessment\n\nCompetency in this unit must be assessed through:\n4.1\nPractical demonstration\n4.2\nWritten examination\n\n5. Resource\nImplications\n5.1\nRelevant tools and equipment for basic calculation\n5.2\nRecommended data\n6. Context of\nAssessment\n6.1 Assessment may occur in the workplace or in a simulated\nworkplace or as part of a team under limited supervision\n\n--- PDF PAGE 28 ---\n________________________________________________________________\nTR- Fish Capture NC I\n26\n\nUNIT OF COMPETENCY: APPLY FOOD SAFETY AND SANITATION\n\nUNIT CODE\n : AGR741201\n\nUNIT DESCRIPTOR: This unit deals with the skills, knowledge and attitudes required to\napply food safety and sanitation in the workplace\n\n ELEMENTS\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n11. Wear Personal\nProtective Equipment\n1.1 Personal protective equipment are checked\naccording to manufacturer’s specifications\n\n1.2 Personal protective equipment are worn\naccording to the job requirement\n2. Observe Personal\nHygiene and Good\nGrooming\n2.1 Personal hygiene and good grooming is practiced in\nline with workplace health and safety\nrequirements\n3. Implement Food\nSanitation Practices\n\n3.1 Sanitary food handling practices are implemented\nin line with workplace sanitation regulations\n\n3.2 Safety measures are observed in line with\nworkplace safety practices.\n4. Render Safety\nMeasures and First Aid\nProcedures\n\n4.1 Safety measures are applied according to\nworkplace rules and regulations\n\n4.2 First aid procedures are applied and coordinated\nwith concerned personnel according to workplace\nstandard operating procedures.\n5. Implement\nhousekeeping activities\n5.1 Work area and surroundings are cleaned in\naccordance with workplace health and safety\nregulations\n\n5.2 Waste is disposed according to organization’s\nwaste disposal system\n\n 5.3 Hazards in the work area are recognized and\nreported to designated personnel according to\nworkplace procedures\n\n--- PDF PAGE 29 ---\n________________________________________________________________\nTR- Fish Capture NC I\n27\nRANGE OF VARIABLES\n VARIABLES\n RANGE\n1. Manufacturer’s\nSpecifications\nManufacturer’s specifications may include but not\nlimited to:\n\n1.1 Handling\n1.2 Operating\n1.3 Discharge Label\n1.4 Reporting\n1.5 Testing\n1.6 Positioning\n1.7 Refilling\n2. Personal Protective\nEquipment\nPersonal Protective Equipment may include but not\nlimited to:\n\n2.1 Apron/laboratory gown\n2.2 Mouth masks\n2.3 Gloves\n2.4 Rubber boots/safety shoes\n2.5 Head gears such as caps, hair nets, earl plug\n3. Workplace Health and\nSafety Requirements\nWorkplace and Safety Requirements may include:\n\n3.1 Health/Medical Certificate\n3.2 DOLE requirements\n3.3 BFAD requirements\n3.4 Personal Hygiene and good grooming\n3.5 Plant Sanitation and waste management\n4. Safety Measures\nSafety measures may include but not limited to:\n\n4.1 Labeling of chemicals and other sanitizing agents\n4.2 Installation of fire fighting equipment in the work\narea\n4.3 Installation of safety signages and symbols\n4.4 Implementation of 5S in the work area\n4.5 Removal of combustible material in the work area\n\n--- PDF PAGE 30 ---\n________________________________________________________________\nTR- Fish Capture NC I\n28\n\n5. First Aid Procedures\nFirst Aid Procedures may include but not limited to:\n\n5.1 Mouth to mouth resuscitation\n5.2 CPR\n5.3 Application of tourniquet\n5.4 Applying pressure to bleeding wounds or cuts\n5.5 First aid treatment for burned victims\n\n6. Hazards\nHazards in the workplace may include but not limited\nto:\n\n6.1 Physical\n6.2 Biological\n6.3 Chemical\n\n--- PDF PAGE 31 ---\n________________________________________________________________\nTR- Fish Capture NC I\n29\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n\n1.1 Cleaned, checked and sanitized personal protective\nequipment\n1.2 Practiced proper personal hygiene and good\ngrooming\n1.3 Implemented workplace food safety practices\n1.4 Applied first aid measures to victims\n1.5 Implemented good housekeeping activities in the\nwork area\n2. Underpinning\nKnowledge\n 2.1 Safety Practices\n2.1.1 Proper waste disposal\n2.1.2 Environmental protection and concerns\n2.1.3 Food safety principles and practices\n2.1.4 Good grooming and personal hygiene\n 2.2 Codes and Regulations\n 2.2.1 TQM and other food quality system\nprinciples\n 2.2.2 ISO, HACCP, EMS, 5S\n 2.2.3 Good Food Manufacturing Practices\n 2.3 Equipment: Uses and Specifications\n2.3 1 Parts and functions of personal\nprotective equipment\n2.3.2 First Aid Kit\n2.3.3 Sanitizing equipment\n3. Underpinning Skills\n3.1 Sanitary food handling practices\n3.2 Implementing housekeeping activities\n3.3 Applying first aid treatment\n3.4 Coordination skills\n4. Methods of\nAssessment\nCompetency in this unit must be assessed through:\n4.1 A combination of direct observation and questioning\nof a candidate processing foods.\n5. Resource Implications\n\nThe following resources must be provided:\n5.1 Work area/station\n5.2 First Aid kit\n5.3 PPE relevant to the activities\n5.4 Fire extinguisher\n5.5 Stretcher\n5.6 Materials, tools and equipment relevant to the unit of\ncompetency\n6. Context of Assessment 6.1 Assessment should occur on the job or in a simulated\nworkplace\n\n--- PDF PAGE 32 ---\n________________________________________________________________\nTR- Fish Capture NC I\n30\nCOMMON COMPETENCIES FOR\nMARITIME SECTOR\n\nUNIT OF COMPETENCY: PREVENT AND FIGHT FIRE\n\nUNIT CODE : MTM834202\n\nUNIT DESCRIPTOR : This unit identifies the competence required to prevent and\nfight fires on board a vessel, including management of fire\nprevention measures, initiation and management of evacuation,\nemergency shutdown and isolation procedures and the\nexecution and coordination of fire-fighting operations\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Manage fire prevention\nprocedures\n1.1. Fire hazards on board a vessel are identified and\naction is taken to eliminate or minimize them\n1.2. Fire detection and fire fighting equipment and\nsystems are regularly checked and appropriate\naction is taken to ensure that they are operational\n1.3. Appropriate educational activities are organized\nto ensure on-board personnel are aware of the\ndangers of fire, how to prevent it and what to do if\na fire is detected\n1.4. Personnel on board a vessel are made aware of\nemergency procedures to be followed in the event\nof fire\n2. Operate portable fire-\nfighting equipment\n2.1. Classes of fires are correctly identified in\naccordance with accepted fire-fighting practice\n2.2. Correct portable fire-fighting equipment is\nselected and used to fight specific classes of fires\n2.3. Class F fires are correctly extinguished with a fire\nblanket in accordance with accepted fire-fighting\npractice\n2.4. Methods of extinguishing fire on board a vessel\nare correctly applied\n2.5. Correct techniques are applied for the setting up\nof foam making equipment to extinguish B Class\nfires on board vessel\n2.6. Where applicable, correct techniques are used to\nrecharge the various types of portable fire\nextinguisher\n2.7. Where applicable, portable fire-fighting equipment\nis confirmed as operational following recharging\n\n3. Conduct interior search\nand rescue and fire-\nfighting operations\n(where applicable)\n3.1. Procedures for donning and starting up SCBA /\nCABA are correctly applied\n3.2. Procedures for the logging of SCBA / CABA\noperations on a BA Control Board is correctly\n\n--- PDF PAGE 33 ---\n________________________________________________________________\nTR- Fish Capture NC I\n31\nfollowed in accordance with vessel’s procedures\nand accepted fire-fighting practice\n3.3. Search and rescue operations in a smoke filled\nenvironment are correctly conducted as a\nmember of a fire-fighting team in accordance\nwith accepted fire-fighting practice\n3.4. Interior fires are extinguished using appropriate\nfire fighting equipment and procedures as a\nmember of a fire fighting team in accordance\nwith accepted fire-fighting practice\n3.5. Lifeline signals are correctly used during interior\nfire fighting operations\n3.6. A compartment filled with high expansion foam\nis correctly entered as per accepted fire-fighting\npractice\n\n--- PDF PAGE 34 ---\n________________________________________________________________\nTR- Fish Capture NC I\n32\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Classes of Fire\nClass A\n1.1. All solid materials, usually organic origin in\nnature (contains compounds of carbon) and\ngenerally produce glowing embers – i.e.,\nwood, textiles, curtains, furniture and plastics.\nClass B\n1.2. All flammable liquids and solids, which can\nalso be sub-divided into :\n1.3. Miscible with water (i.e., petrol, oils,\nlubricants, paints and waxes)\n1.4. Non-miscible with water ( e.g., alcohol)\nClass C\n1.5. Fires involving domestic main gas, cylinder\ngases (e.g., Acetylene) or Liquid Petroleum\nGases (LPG) such as Butane or Propane)\nClass D\n1.6. Fires involving metals (where water is\ngenerally ineffective and dangerous) i.e.,\nmetal powders such as magnesium, titanium,\nand alloys, etc.\nClass F\n1.7. New class specifically dealing with high\ntemperature\n1.8. ( 360 degrees centigrade) cooking oils in\nlarge industrial catering kitchens, restaurants\nand takeaway establishments, etc.\n1.9. Electrical\n1.10.\nElectrical fires are not considered to\nconstitute a fire class on their own, as\nelectricity is a source of ignition that will\nfeed the fire until removed. When the\nelectrical supply has been isolated. The\nfire can be treated (generally) as Class A\nfor extinguishing purposes. However, you\nshould use a non-conducting agent on all\npossible occasions.\nFire detection and fire\nfighting equipment and\nsystem\n2.1. Portable fire extinguisher including foam,\nwater, CO2, dry chemical and wet foam\n2.2. Fire blankets\n2.3. C02 fixed system\n2.4. Foam installation including semi-portable and\nfixed system\n\n--- PDF PAGE 35 ---\n________________________________________________________________\nTR- Fish Capture NC I\n33\n2.5. Sprinkler system\n2.6. Fire pumps (main and emergency fire pump\n2.7. Fire hoses, hydrants, branches and\ninternational shore connection\n3. Methods of\nExtinguishing fire\n3.1. Cooling\n3.2. Reducing the ignition temperature by taking\nthe heat out of the fire – using water (limiting\nthe temperature)\n3.3. Smothering\n3.4. Limiting the oxygen available by smothering\nand preventing the mixture of oxygen and\nflammable vapour – by use of foam or a fire\nblanket\n3.5. Starving\n3.6. Limiting the fuel supply – by removing the\nsource of fuel ; by switching off electrical\npower, isolating the flow of flammable liquids\nor pulling away burning wood or straw, etc.\n3.7. Chemical Reaction\n3.8. By interrupting the chain of combustion and\ncombining the hydrogen atoms with chlorine\natoms in the hydrocarbon chain, e.g. Halons\nextinguisher (NB: Halons have now generally\nbeen withdrawn under the Montreal Protocol\nof 1990, as ozone depleting agents)\n\n--- PDF PAGE 36 ---\n________________________________________________________________\nTR- Fish Capture NC I\n34\n\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1. Managed\nand\nimplemented\nfire\nprevention\nmeasures and procedures on board a vessel\n1.2. Assessed the operational capability of fire detection\nand fire fighting equipment and systems and initiate\nany required maintenance or replenishment action\n1.3. Participated in simulated on board fire fighting\nactivities\n1.4. Participated in search and rescue and fire fighting\nteams\n1.5. Implemented OHS principles and policies when\ncarrying out fire fighting duties\n1.6. Communicated effectively with others as required\nduring fire emergencies\n2.\nUnderpinning\nknowledge and\nattitude\n2.1. Chemistry of fire and its relationship to materials\ntypically carried on vessels\n2.2. Types of fire detection, fire fighting, life saving and\nsafety equipment and systems used on board\nvessels and the procedures for their use\n2.3. Relevant regulations, code of practice, policies and\nprocedures related to the maintenance of fire\ndetection, fire fighting, life saving and safety\nequipment and system\n2.4. Faults that can occur with shipboard fire detection,\nfire fighting, life saving and safety equipment and\nappropriate remedial action and solutions\n2.5. Statutory and typical company requirements for the\ndocumentation of maintenance procedures and\noutcomes for fire detection, fire fighting, life saving\nand safety equipment and systems used on board\nvessels.\n\n3.\nUnderpinning skills\n3.1. Procedures in checking and replacing consumable\nmaterials in typical ship board fire detection, fire-\nfighting and safety equipment and system\n3.2. Procedures in identifying and evaluating operational\nand maintenance problems with fire-detection, fire\nfighting, life saving and safety equipment and\nsystems and determining appropriate courses of\naction\n3.3. Procedures\nin\nidentifying\nand\nimplementing\nimprovements to maintenance for fire-detection and\nfire-fighting.\n3.4. Procedures on onboard housekeeping processes.\n\n--- PDF PAGE 37 ---\n________________________________________________________________\nTR- Fish Capture NC I\n35\n4.\nResource\nimplications\nThe following resources must be provided:\n4.2. Work place location\n4.3. Tools and equipment appropriate to schedule\nhousekeeping activities and to monitor and maintain\nworking condition\n4.4. Material relevant to the proposed activity and tasks\n5.\nMethod of\nassessment\nCompetency must be assessed through :\n5.1. Demonstration and questioning of related\nunderpinning knowledge\n5.2. Written Examination\n5.3. Portfolio\n6.\nContext for\nassessment\n6.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 38 ---\n________________________________________________________________\nTR- Fish Capture NC I\n36\n\nUNIT OF COMPETENCY: PERFORM FIRST AID TREATMENT ON BOARD\n\nUNIT CODE : MTM834204\n\nUNIT DESCRIPTOR : This unit identifies the competence required to perform first\naid treatment to crew and / or passengers during a medical\nemergency on board a vessel, including the performance of\nimmediate life saving first aid until qualified medical assistance is\navailable, the recognition of symptoms and signs of acute illness\nand or injury and the taking of appropriate action.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Perform immediate life\nsaving first aid pending\nthe arrival of medical\nassistance\n\n1.1. The priorities of First Aid Care are correctly\napplied in real or simulated first aid situation\n1.2. The DRABC Action plan is correctly used to\nidentify and control danger, loss of\nconsciousness, loss of airway, breathing and\ncirculation\n1.3. An unconscious casualty is correctly placed in\nstable side position and the steps in clearing\nthe airways to promote breathing in accordance\nwith established first aid procedures\n1.4. The correct method of Expired Air Resuscitation\n(EAR), External Cardiac Compression (ECC)\nand Cardio Pulmonary Resuscitation (CPR) is\napplied in real life resuscitation situation or in a\nsimulated exercise using a mannequin\n\n2. Recognize the\nsymptoms and acute\nillness and or injury and\ntake appropriate action\n2.1. The conditions requiring special first aid\nprocedures are correctly identified\n2.2. A real or simulated unconscious casualty is\ncared for in accordance with established first\naid procedures\n2.3. Causes of respiratory failure and breathing\ndifficulty are correctly identified and appropriate\ncare is provided for a real or simulated casualty\nwith obstructed breathing\n2.4. The symptoms and signs of casualty with\nangina pain, heart attack and heart failure are\ncorrectly identified\n2.5. The symptoms and signs of poisoning, bites\nand stings are correctly identified and\nappropriate immediate management of thee\nconditions is provided in real or simulated\nsituation\n\n--- PDF PAGE 39 ---\n________________________________________________________________\nTR- Fish Capture NC I\n37\n2.6. A real or simulated conscious casualty with an\nacute illness and or injury is cared for in\naccordance with established first aid\nprocedures\n3. Manage wounds and\nbleeding\n3.1. Severe external bleeding is correctly controlled\nin a real or simulated situation\n3.2. The symptoms and signs of severe internal\nbleeding are correctly identified and appropriate\nimmediate management of these conditions is\nprovided in a real or simulated situation\n3.3. A real or simulated laceration, abrasion and a\ndeep puncture wound is correctly manage in\naccordance with established first aid\nprocedures\n3.4. The signs of wound infections are correctly\nidentified and a real or simulated wound\ninfection is correctly managed in accordance\nwith established procedures\n4. Manage burns\n4.1. Immediate rescue procedures are correctly\nused in real or simulated first aid situations\ninvolving a burned casualty\n4.2. The severity of burn is correctly assessed in\nterms of depth, position and size in accordance\nwith established procedures\n4.3. The correct method of treatment for burns and\nassociated shock is correctly applied in real or\nsimulated first aid situations involving a burned\ncasualty\n5. Manage bone, joint and\nmuscle injuries\n5.1. Symptoms and signs of fractures (simple and\ncomplicated) are correctly recognized in\naccordance with established first aid\nprocedures\n5.2. Problems and treatment associated with\ndislocated joints are correctly managed in\naccordance with established procedures\n5.3. First aid treatment of pelvic and chest injuries\nand fractures of limbs, including immobilization\ntechniques is correctly performed in accordance\nwith established procedures\n5.4. The symptoms and signs of sprains and strains\nare correctly identified in accordance with\nestablished procedure\n\n--- PDF PAGE 40 ---\n________________________________________________________________\nTR- Fish Capture NC I\n38\n6. Adapt first aid\nprocedures for remote\nsituations\n6.1. Safety precautions needed to prevent\naccidents, illness and injuries and infection in\nremote areas situations are correctly applied in\nreal or simulated situations\n6.2. Identify and discuss the factors involved in the\nprevention of heat and cold exposure\n6.3. The symptoms and signs of real or simulated\ncasualty exposed to heat or cold are correctly\nidentified including hyperthermia and\nhypothermia and appropriate management of\nthe casualty carried out in accordance with\nestablished procedures\n6.4. A real or simulated ill or injured person in\nremote conditions is correctly, cared for unit\nhelp arrives, including the monitoring of airway,\nbreathing and heart beat, the control of pain,\nhydration and maintenance of body\ntemperature\n6.5. A real or simulated casualty with severe injuries\nin a remote situation is correctly cared for,\nincluding the preparation for transport\n6.6. First aid resources and emergency\nequipment required for remote area situations\nis correctly identified and used in real or\nsimulated situations in accordance with\nestablished first aid procedures\n\n--- PDF PAGE 41 ---\n________________________________________________________________\nTR- Fish Capture NC I\n39\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. First aid Care on board a\nvessel may need to be\nprovided in situation\ninvolving :\n1.1. Acute illness or injury\n1.2. Laceration, abrasion and a deep puncture\nwounds\n1.3. Respiratory failure and breathing difficulty\n1.4. Shock as a result of severe injury\n1.5. Abdominal, pelvic and chest injuries\n1.6. Fractures of limbs\n1.7. Poisoning, bites and stings\n1.8. Sprains, strains and dislocations\n1.9. Facial, ear and eye injuries\n1.10.\nSuspected head, neck and back injuries\n2. Conditions requiring\nspecial first aid\nprocedures include\n2.1. Explosion injuries\n2.2. Burns\n2.3. Poisons and envenomation\n2.4.Hypothermia and hyperthemia\n3. First aid resources and\nequipment include\n3.1. Vessels/ medicine cabinet\n3.2. First aid boxes\n3.3. Emergency first aid carry bags\n3.4. Specific first aid resources\n3.5. Roller bandages\n3.6. Triangular bandages\n3.7. Face masks\n3.8. Cleaning swabs\n3.9. Cleaning brush\n3.10.\nCleaning materials\n3.11.\nMedicines\n3.12.\nVessel’s Medicine Cabinet\n3.13.\nFirst Aid Boxes\n3.14.\nEmergency first aid carry bags\n\n--- PDF PAGE 42 ---\n________________________________________________________________\nTR- Fish Capture NC I\n40\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate :\n1.1. Performed immediate life saving first aid\n1.2. Recognized the symptoms and signs of\nacute illness and or injury and take\nappropriate action\n1.3. Managed wounds and bleeding\n1.4. Managed burns\n1.5. Managed bone, joints and muscle injuries\n1.6. Adapted first aid procedures for remote\nsituation\n1.7. Communicated effectively with others during\nprovision of first aid.\n1.8. Prepared report on first aid situations and\nactivities in accordance with company and\nregulatory requirements\n2. Underpinning knowledge\nand attitude\n2.1. Duties and responsibilities of the designated\nfirst aid officer on board a vessel\n2.2. Knowledge on ways in which disease can\nspread on board a vessel and ways of\npreventing the spread\n2.3. Legal issues related to administration of\ndrugs and medicines on board a vessel\n2.4. Knowledge of body structures and functions\nrelevant to possible injury, illnesses and\ndisease that may be encountered on board\na vessel\n2.5. Maritime communication techniques related\nto health care and receiving radio medical\nadvice form shore based advisers\n2.6. Marine publications containing information\non first aid and medical treatment on board\na vessel\n3. Underpinning skills\n3.1. Medical first aid procedures\n3.2. Procedures for conducting an initial patient\nfirst aid treatment\n3.3. Managing injuries and medical emergencies\n3.4. Managing medicine resources\n3.5. Techniques for care of wounds\n3.6. Correct\nmethods\nof\nExpired\nAir\nResuscitation\n(EAR),\nExternal\nCardiac\nCompression (ECC) and Cardio Pulmonary\nResuscitation (CPR)\n\n--- PDF PAGE 43 ---\n________________________________________________________________\nTR- Fish Capture NC I\n41\n4. Resource implications\nThe following resources must be provided:\n4.1. Work place location\n4.2. Tools and equipment appropriate to\nschedule housekeeping activities and to\nmonitor and maintain working condition\n4.3. Material relevant to the proposed activity\nand tasks\n5. Method of assessment\nCompetency must be assessed through :\n5.1. Demonstration and questioning of related\nunderpinning knowledge\n5.2. Written Examination\n5.3. Portfolio\n6. Context for assessment\n6.1. Competency may be assessed in workplace\nor in a simulated workplace setting\n6.2. Assessment shall be observed while task\nare being undertaken whether individually or\nin-group\n\n--- PDF PAGE 44 ---\n________________________________________________________________\nTR- Fish Capture NC I\n42\n\nUNIT OF COMPETENCY: PROTECT MARINE ENVIRONMENT\n\nUNIT CODE : MTM834205\n\nUNIT DESCRIPTOR : This unit identifies the competence required to protect marine\nenvironment. It involves the development of awareness to\npreserve and protect marine environment.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of\nVariables\n1. Identify garbage\ndisposal procedures\n\n1.1. Relevant guidelines for the implementation\nof garbage disposal onboard are identified\nand applied to ensure protection of marine\nenvironment\n1.2. Relevant company requirements on marine\nenvironmental protection is followed as per\nestablished practice\n1.3. Appropriate measures to prevent\noperational pollution are observed and\napplied to prevent pollution of the marine\nenvironment in accordance with regulations\nand procedures\n1.4. Compliance on state / territory garbage\ndisposal procedures for the protection of the\nmarine environment is monitored and required\naction is taken where incidences of non-\ncompliance are identified\n2. Perform garbage\nsegregation\n2.1. MARPOL Regulations and procedures\nconcerning protection of marine environment\nare adequately followed regarding\nsegregation of garbage\n2.2. Marine environment protection programs on\nboard are applied as per established practice\n2.3. Any breach of regulations and procedures\nconcerning protection of the marine\nenvironment are identified and associated\nactions are taken in accordance with\nregulatory requirement and procedures\n2.4. Deck rating are provided with necessary\ninformation and training to ensure compliance\nwith regulations and procedures for the\nprotection of marine environment\n\n--- PDF PAGE 45 ---\n________________________________________________________________\nTR- Fish Capture NC I\n43\n3. Record garbage\nsegregation\n3.1. Others are assisted and encouraged to\nobserve the garbage segregation policies\n3.2. Social responsibilities in garbage disposal are\nobserved and performed to ensure protection\nof marine environment\n3.3. Contents of report on garbage segregation\nand disposal are adequately filled-up as per\nestablished procedures\n\n--- PDF PAGE 46 ---\n________________________________________________________________\nTR- Fish Capture NC I\n44\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Guidelines for the\nimplementation of\ngarbage disposal\nonboard\n1.1. Incineration option for shipboard generated\ngarbage\n1.2. All kinds of victual, domestic and operational\nwaste excluding fresh fish and parts thereof\n1.3. Garbage for which there is a total prohibition\non discharge into the sea\n2. Measures to prevent\noperational pollution by\ngarbage\n2.1. All plastic including but not limited to synthetic\nropes, synthetic fishing nets and plastic\ngarbage bags\n2.2. Disposal of any materials regulated by Annex\nV (Garbage)\n2.3. Fixed floating flat form engaged in exploration\nand associated offshore processing of seabed\nmineral resources\n2.4. Disposal into the sea of food wastes may be\npermitted when they have been passed\nthrough comminuter or grinder for such fixed\nor floating plat forms\n3. Contents of the report on\ngarbage segregation\nand disposal include\n3.1. Report must be sent to the nearest coastal\nstate\n3.2. Contents of report must include\n3.2.1. Name of Ship, call sign and flag\n3.2.2. Type of Ship and Tonnage\n3.2.3. Cargo carried\n3.2.4. Date in Time\n3.2.5. Position, Course, Speed at time of\nincident\n3.2.6. Radio Channel Guarded\n\n--- PDF PAGE 47 ---\n________________________________________________________________\nTR- Fish Capture NC I\n45\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment\nrequires\nevidence\nthat\nthe\ncandidate :\n1.1. Exhibited all required safety environmental\nand garbage control procedures\n1.2. Performed garbage segregation and proper\ndisposal\n1.3. Complied with existing company regulations\nand relevant MARPOL regulation\n1.4. Assisted in incineration procedures\n1.5. Communicated\neffectively\nwith\nother\nconcerning measures to protect the marine\nenvironment\n2. Underpinning knowledge\nand attitude\n2.1. Knowledge of sections of relevant regulation\non garbage segregation and disposal\n2.2. Safety, environmental and hazard control\nprecautions and procedures relevant to\nMARPOL regulations\n2.3. Storage of non-bio-degradable materials\nonboard\n2.4. Relevant ISM regulations\n3. Underpinning skills\n3.1. Procedures for checking garbage coding on\ngarbage segregation\n3.2. Procedures for the disposal of food waste\nbased on relevant MARPOL regulation\n3.3. Procedures on ship-generated waste on non\nbio-degradable materials\n4. Resource implications\nThe following resources must be provided:\n4.1. Work place location\n4.2. Tools and equipment appropriate in\nprotecting marine environment\n4.3. Material relevant to the proposed activity\nand tasks\n5. Method of assessment\nCompetency must be assessed through :\n5.1. Demonstration and questioning of related\nunderpinning knowledge\n5.2. Written Examination\n5.3.Portfolio\n6. Context for assessment\n6.1. Competency may be assessed in workplace\nor in a simulated workplace setting\n6.2. Assessment shall be observed while task\nare being undertaken whether individually or\nin-group\n\n--- PDF PAGE 48 ---\n________________________________________________________________\nTR- Fish Capture NC I\n46\n\nUNIT OF COMPETENCY: COMPLY WITH EMERGENCY PROCEDURES\n\nUNIT CODE : MTM834206\n\nUNIT DESCRIPTOR : This unit involves the knowledge, skills and attitude to take\nappropriate initial action on becoming aware of an emergency on\nboard a vessel and to follow established emergency response\nprocedures.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range Statement\n1. Take action on\nbecoming aware of an\nemergency\n1.1. Emergencies are correctly recognized and\nidentified\n1.2. Response to an emergency situation follows\nestablished vessel’s emergency response\nprocedures\n1.3. Correct action is taken on discovery of an\nactual or potential emergency in accordance\nwith established vessel procedures\n1.4. Information given on raising alarm is prompt,\naccurate, complete and clear\n2. Follow established\nemergency procedures\n2.1. Vessel’s contingency plans for emergency\nresponse are known and are implemented in\nreal and simulated emergency situations\n2.2. Escape routes and internal and external\ncommunications and alarm systems are\ncorrectly\nused\nin\nreal\nand\nsimulated\nemergency situations in accordance with\nregulatory\nrequirements\nand\nestablished\nprocedures\n2.3. Emergency\ncommunications\nand\nalarm\nsignals and systems are understood and\nrequired action implemented in accordance\nwith emergency procedures and regulatory\nrequirements\n2.4. Planned damage controls procedures for\ndealing with damage to the vessel and its hull\nare implemented in accordance with company\nprocedures and regulatory requirements\n\n--- PDF PAGE 49 ---\n________________________________________________________________\nTR- Fish Capture NC I\n47\n3. Follow procedures for\nthe use of various life\nsaving appliances\n3.1. Participation in life saving drills confirms\nreadiness to correctly carry out life saving\nprocedures and use life saving appliances\n3.2. Survival equipment are correctly used in the\nevent of emergencies\n3.3. Procedures for the use of various shipboard\nlife\nsaving\nappliances\nare\nfollowed\nin\naccordance with regulatory requirements,\nmanufacturers\ninstruction\nand\ncompany\nprocedures\n\n--- PDF PAGE 50 ---\n________________________________________________________________\nTR- Fish Capture NC I\n48\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Emergencies\n1.1. Collision with another vessel\n1.2. Explosion on board vessel\n1.3. Impairment of integrity of hull and ingress of\nwater\n1.4. Loss of steering control\n1.5. Loss of motive power\n1.6. Foundering\n1.7. Grounding\n1.8. Beaching a vessel\n1.9. Person overboard\n1.10. Rescue and evacuation of injured\npersonnel\n2. Survival equipment\n2.1. Life jackets\n2.2. Exposure and immersion suits\n2.3.Survival crafts\n3. Contingency Plans\n3.1. Contingency Plan in controlling fire or explosion\nemergency\n3.2. Use of appropriate fire fighting equipment and\ntechniques such as various types of fire\nextinguishers, fire blankets, fire hoses and\nnozzles and foam applicators\n3.3. Activation of fixed fire fighting sprinklers and\nsystems\n3.4. Removal of fuel or heat source\n3.5. Boundary cooling techniques\n3.6. Contingency Plan in controlling flooding\nemergency\n3.7. Use of softwood wedges and plugs to reduce\nwater ingress\n3.8. Erection and application of vertical shoring\n3.9. Construction and fitting of a leak-stopping mat\n3.10. Temporary repair of a ruptured pressurized\npipe\n3.11. Operation of a portable salvage pump\n\n--- PDF PAGE 51 ---\n________________________________________________________________\nTR- Fish Capture NC I\n49\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate\n:\n1.1. Took appropriate action in the event of\ndiscovering a shipboard emergency\n1.2. Followed vessel’s contingency plans for\nemergency response\n1.3. Followed procedures for the use of various\nlife-saving appliances\n1.4. Implemented damage control following a\nshipboard emergency in accordance with\ninstructions\n1.5. Identified typical problems that may occur\nduring a shipboard emergency and take\nappropriate action\n1.6. Communicated effectively with others during\nshipboard emergencies\n1.7. Participated in drills to prepare shipboard\npersonnel to implement emergency response\n2. Underpinning knowledge\nand attitude\n2.1. Knowledge of relevant maritime regulations\n2.2. Navigational emergencies for vessels and\nappropriate action and solutions\n2.3. Indications of various types of emergency\nsituations and the action to be followed when\nvarious types of actual or potential emergency\nsituations are identified\n2.4. Emergency alarm signals and systems in use\non vessels and procedures to be followed\nwhen an emergency alarm is raised\n2.5. Escape routes and internal and external\ncommunications systems and alarms on\nboard a vessel\n2.6. General principles of damage and control and\nthe manner in which watertight integrity of hull\nis maintained on a vessel, including the\nimportance of preparation, control and repair\n2.7. Ways of controlling damage during a flooding\nemergency, including the use of various\nshipboard items that can be used for damage\ncontrol purposes such as mattresses, canvas\nand clothing\n2.8. Maritime communication techniques used\nduring navigational emergencies\n\n--- PDF PAGE 52 ---\n________________________________________________________________\nTR- Fish Capture NC I\n50\n3. Underpinning skills\n3.1. Taking initial action during real and simulated\nemergency situation\n3.2. Implementing emergency during a real and\nsimulated emergency situations\n3.3. Identifying and evaluating problems that may\noccur during a shipboard emergency and\ndetermining appropriate courses of action\n3.4. Applying safety and life saving precautions\nand procedures during emergency situations\non board vessel\n3.5. Participating in drills aimed at preparing\nshipboard personnel to implement emergency\nresponse plans\n4. Resource implications\nThe following resources must be provided:\n4.1. Work place location\n4.2. Tools and equipment appropriate to schedule\nhousekeeping activities and to monitor and\nmaintain working condition\n4.3. Material relevant to the proposed activity and\ntasks\n5. Method of assessment\nCompetency must be assessed through :\n5.1. Demonstration and questioning of related\nunderpinning knowledge\n5.2. Written Examination\n5.3. Portfolio\n6. Context for assessment\n6.1. Competency may be assessed in workplace\nor in a simulated workplace setting\n6.2. Assessment shall be observed while task are\nbeing undertaken whether individually or in-\ngroup\n\n--- PDF PAGE 53 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n51\n\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY:\nAPPLY DECKHAND SKILLS ABOARD A FISHING\nVESSEL\nUNIT CODE:\nAGR642301\nUNIT DESCRIPTOR :\nThis unit covers the skills and knowledge required to\ncarry out basic deckhand duties aboard a fishing vessel\nincluding rope work, assisting in anchoring, mooring,\noperating winches and windlasses and preparing a\nfishing vessel for sea.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Use and maintain\nropes and perform\nbasic knots, bends,\nhitches, splices and\ncommon whipping\n1.1\nOperations are carried out according to\nestablished safety rules and regulations.\n1.2\nRope materials, methods of construction,\nmeasurement methods, physical characteristics\nand common areas of use are correctly identified.\n1.3\nRopes are checked for wear, maintained in\naccordance with enterprise procedures and\nmanufacturers’ guidelines, and coiled and stowed\ncorrectly.\n1.4\nKnots, bends and hitches are tied neatly and\nsecurely and are used according to their correct\napplication.\n1.5\nRopes are spliced neatly and securely according\nto their correct application and rope ends are\nwhipped, where appropriate, to maintain good\ncondition.\n2. Operate winches,\ncapstans and\nwindlasses\n2.1\nOperations are carried out according to\nestablished safety rules and regulations.\n2.2\nWinches, capstans and windlasses are selected,\nas appropriate, checked and prepared for the\noperation prior to use.\n2.3\nWinches, capstans and windlasses are safely\noperated to carry out fishing vessel deck\noperations in accordance with operational\nrequirements and manufacturers’ instructions,\nwhere appropriate.\n3. Secure the vessel at\nanchor\n3.1\nSecuring of the vessel is carried out according to\nestablished safety rules and regulations.\n3.2\nPreparation of the anchor and equipment prior to\nletting go is appropriate to the depth of water,\nweather and sea conditions, and tidal range in\narea of operation.\n\n--- PDF PAGE 54 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n52\n3.3\nQuantity of anchor cable run out or recovered\ncomplies with orders provided.\n3.4 Control of the cable is maintained within safe\noperating limits during normal operation.\n3.5\nDegree to which the anchor and equipment is\nsecured on completion of anchoring operations is\nappropriate to forecast conditions and complies\nwith orders provided.\n3.6\nManufacturers’ recommendations and anchoring\nrequirements are followed during anchor winch\noperations.\n3.7\nAnchoring area is kept free of loose ropes, wires\nand debris throughout all operations.\n4. Secure and adjust\nthe vessel’s position\nduring mooring\noperations\n4.1\nMooring of the vessel is carried out according to\nestablished safety rules and regulations.\n4.2\nMooring lines and associated equipment are\nhandled safely and efficiently at all times.\n4.3\nMooring area is kept free of loose ropes, wires\nand debris throughout all operations.\n4.4\nTension on mooring lines is maintained at a level\nappropriate to the stage and nature of the\noperation when warping the vessel or maintaining\nposition.\n4.5\nReports of incidents made to supervisory\npersonnel are complete and at a time designed to\nmaximize the mooring security of the vessel.\n4.6\nMooring lines are secured in accordance with\norders provided, forecast tidal conditions and\nplanned vessel operations.\n4.7\nEquipment malfunction or problems during\noperations are promptly recognized and\nappropriate corrective action is taken.\n4.8\nCommunication is clear and concise at all times.\n5. Monitor the situation\nof the vessel when\nmoored or anchored\n5.1\nMonitoring operations are planned and carried\nout in accordance with established safety rules\nand regulations.\n5.2\nFrequency, timing and coverage of scheduled\nchecks and inspections comply with watch-\nkeeping instructions.\n5.3\nAction taken in the event of irregularities or\nabnormal conditions is appropriate to their\nsignificance and within the job holder’s\nresponsibility to implement.\n5.4\nReports of incidents made to supervisory\npersonnel are complete and at a time designed to\nmaximize the safety and integrity of the vessel.\n5.5\nRestrictions on access to the vessel by visitors are\nin accordance with watch-keeping instructions.\n\n--- PDF PAGE 55 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n53\n6. Secure the vessel\nfor and at sea\n6.1\nChecks on vessel security are planned and carried\nout in accordance with established safety and\nsecurity rules and regulations.\n6.2\nCoverage and frequency of checks and\ninspections on the vessel’s seaworthiness comply\nwith orders received.\n6.3\nWatertight integrity is checked and appropriate\naction is taken to prepare for prevailing and\nforecast weather and sea conditions.\n6.4\nDegree to which the vessel is secured is\nappropriate to prevailing and forecast conditions\nand complies with orders received.\n6.5\nAction taken in the event of irregularities is\nappropriate to their significance and within the job\nholder’s responsibility to implement.\n6.6\nReports of conditions made to supervisory\npersonnel are complete, accurate and completed\nin accordance with enterprise procedures and\nregulatory requirements.\n6.7\nReports to supervisory personnel on irregularities\nbeyond the job holder’s ability to rectify are made\nin time to enable remedial action to be taken.\n\n--- PDF PAGE 56 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n54\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1 Operations:\n1.1.\nmanual handling of equipment\n1.2.\ncommunications and signalling\n1.3.\nrope work\n1.4.\nat sea and ashore\n1.5.\nvarying weather conditions\n1.6.\nthree, four or eight-strand rope\n1.7.\nwire rope\n1.8.\npowered winch, capstan and windlass\n1.9.\nhydraulic, electric and mechanical\n1.10. cable and rope winches\n1.11. net haulers\n1.12. pot or trap haulers\n1.13. anchor winches\n1.14. anchoring:\n1.14.1 routine\n1.14.2 emergency\n1.14.3 letting go and recovery\n1.15. mooring:\n1.15.1 mooring and unmooring to a single point\n1.15.2 berthing and unberthing to a wharf\n1.15.3 adjustment from both fore and aft\nmooring positions\n1.15.4 rigging and recovering means of access\nto the vessel\n1.16.monitoring:\n1.16.1 routine fire and security rounds and\ninspections\n1.16.2 display of signals, flags, lights and\nshapes\n1.16.3 mooring integrity during tidal movements\n1.16.4 safe access to and about the vessel\n1.16.5 visitors to the vessel\n1.16.6 environmental impact\n1.16.7 departure\n1.17. securing:\n1.17.1 prior to departure\n1.17.2 long or short voyages\n1.17.3 completion of operations and\nmaintenance\n1.17.4 heavy weather\n1.17.5 routine situations.\n\n--- PDF PAGE 57 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n55\n2 Safety rules and\nregulations:\n2.1. codes of safe work practice:\n2.2 industry\n2.3 enterprise\n2.4 International Labour Organization (ILO)\n2.5 Dept. of Labor and Employment (DOLE)\n2.6 legislation.\n3 Mooring:\n3. 1. single point\n3.2. berthed alongside a wharf.\n4 Corrective action:\n4.1.\nadjustment\n4.2.\ntemporary line repair\n4.3.\ncommunication.\n5. Carried out:\n5.1.\nby day\n5.2.\nby night\n5.3.\nadverse weather conditions.\n6. Irregularities or\nabnormal conditions:\n6.1.\naffecting the safety and integrity of:\n6.2.\nvessel\n6.3.\ncrew\n6.4.\nequipment\n6.5.\nmaterials, such as cargo.\n7. Coverage:\n7.1.\naccommodation spaces\n7.2.\npersonal facilities\n7.3.\ngalley\n7.4.\ndeck area\n7.5.\nstorage / cargo spaces\n7.6.\nengine room\n7.7.\nwheelhouse\n7.8.\nprocessing area.\n8. Secured:\n8.1.\nopenings\n8.2.\nanchors\n8.3.\nlifting appliances and associated equipment\n8.4.\ngalley, stores and equipment\n8.5.\naccommodation and storage / cargo spaces\n8.6.\nmaterial on deck and below, such as cargo\n8.7.\nlarge objects likely to move in a sea way\n8.8.\nslack tanks pressed up.\n\n--- PDF PAGE 58 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n56\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1.\nused, maintained and repaired ropes and\nlines\n1.2.\nperformed knots, bends, hitches, splicing\nand whipping\n1.3.\nprepared winches and capstans associated\nwith fishing, for use and control during\noperation\n1.4.\nprepared anchor equipment, for use and\ncontrol during operation\n1.5.\nsecured anchoring equipment, winches and\ncapstans on completion of operations\n1.6.\nperformed mooring operations to completion\n1.7.\nsecured mooring area on completion of\noperations\n1.8.\nidentified malfunction or possible problems\nand implement contingency plans\n1.9.\nperformed routine checks and inspections of\nvessel:\n1.19.1\nwatch-keeping duties\n1.19.2\nsecurity\n1.19.3\nseaworthiness\n1.10. secured the vessel\n1.11. dealt with security contingencies\n1.12. reported on conditions\n1.13. monitored and controlled access.\n\nAssessment must confirm knowledge of:\n1.14. safety rules and regulations during operation\nprocedures for entering dangerous and\nenclosed spaces.\n\n--- PDF PAGE 59 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n57\n2. Underpinning\nKnowledge and\nAttitudes\nThe essential knowledge and understanding a person\nneeds to perform work to the required standard\ninclude:\n2.1 Procedures relating to:\n2.1.1 splicing rope and tying common knots, bends\nand hitches\n2.1.2 maintenance of different types of rope\n2.1.3 routine and emergency operation of anchors\n2.1.4 use of winches, capstans and windlasses\n2.1.5 preparing deck machinery for use in ambient\nconditions\n2.1.6 securing all areas and equipment for sea prior\nto departure\n2.1.7 effect of the rise and fall of tide when berthed\n2.1.8 warping a vessel to various configurations at a\nwharf\n2.1.9 maintaining a deck watch in port\n2.1.10 displaying signals, flags, lights and shapes\n2.1.11 operating powered equipment in all modes,\nincluding emergency operation\n2.1.12 checking and inspecting the seaworthiness of\nthe vessel\n\n2.2 Principles relating to:\n2.2.1 the correct application of common knots, bends\nand hitches\n2.2.2 how a vessel is made fast to the wharf\n2.2.3 how vessel displacement or profile, and\nprevailing wind or current affect anchoring\noperations\n2.2.4 how a vessel normally lies to an anchor and\ncable\n2.2.5 mooring systems, including the specific\nfunctions of the mooring leads\n2.2.6 effects of unequal tension on mooring lines and\nthe use of fixed mooring lines\n2.3 information relating to:\n2.3.1 codes of safe work practice and safety rules\nand regulation\n2.3.2 different configurations of mooring lines for\nvarious parts of a vessel\n2.3.3 knots, bends and hitches and their applications\n2.3.4 anchor cable markings\n2.3.5 different types of anchor\n2.3.6 anchor, cable and equipment on a specific\nvessel\n\n--- PDF PAGE 60 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n58\n\n2.3.7 characteristics of different types of mooring\n2.3.8 ropes\n2.3.9 hazards that could occur if the operation is not\ncontrolled properly\n2.3.10 indications of, and hazards associated with,\nbreaking mooring lines\n2.3.11 requirements for access equipment\n2.3.12 means of access\n2.3.13 securing the vessel for sea\n2.3.14 appropriate health and hygiene practices\n2.3.15 status of safety equipment\n2.3.16 construction of the vessel sufficient to\nunderstand which areas need to be made\nwatertight\n2.3.17 the method of operation of cargo-lifting and\nsecuring equipment on how to make the vessel\nwatertight.\n3 Underpinning Skills\nThe essential skills a person needs to perform work to\nthe required standard include:\n3.1.\nhandling ropes and wires:\n3.1.1. identifying different rope material and\nconstruction\n3.1.2. using knots, bends and hitches and securing\narrangements\n3.1.3. preparing and throwing a heaving line\n3.1.4. tying an overhand knot, figure-eight knot, reef\nknot, bowline and cod-end knot\n3.1.5. tying a half hitch, clove hitch, round turn and\ntwo half hitches, rolling hitch and timber hitch\n3.1.6. tying a sheet bend and a double-sheet bend\n3.1.7. performing an eye splice, back splice and a\nshort splice\n3.1.8. performing common whipping on ropes and line\n3.1.9. coiling and stowing ropes\n3.1.10.\nusing stoppers\n\n3.2.\nLetting go and weighing anchor:\n3.2.1. single and twin anchor (such as running moor)\noperations\n3.2.2. recovering a foul hawse\n3.2.3. removing debris from an anchor\n3.2.4. handling anchor-securing arrangements\n3.2.5. displaying signals\n3.2.6. preparing an anchor buoy\n3.2.7. communicating with controller\n\n3.3.\nUsing and identifying synthetic rope and wire\nmooring lines:\n3.3.1. fore and aft springs\n\n--- PDF PAGE 61 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n59\n3.3.2. back springs\n3.3.3. bow and stern ropes\n\n3.4.\nBreast lines\n3.5.\nAssisting in different types of mooring\noperations:\n3.5.1. making fast and letting go fore and aft to a\nwharf\n3.5.2. making fast and letting go to a single-point\nmooring\n3.5.3. preparing area for operation\n3.5.4. using springs that manoeuvre a vessel to and\nfrom a wharf\n3.5.5. adjusting mooring during a port stay\n3.5.6. rigging safe access to a vessel\n\n3.6.\nTaking contingency actions when encountering\na malfunction or problem caused by:\n3.6.1. failure of moorings and equipment\n3.6.2. damage to moorings\n3.6.3. insufficient mooring length or strength\n3.6.4. poor leads\n3.6.5. inability to maintain vessel in position\n3.6.6. adverse weather\n3.6.7. cargo or cargo-securing arrangements\n\n3.7.\nUsing different anchoring and mooring winches:\n3.7.1. tension winches operated in manual or self-\ntensioning modes\n3.7.2. stand-alone winches\n3.7.3. windlasses and capstans with drum ends\n\n3.8.\nUsing power-operated equipment:\n3.8.1. cranes and derricks\n3.8.2. capstans\n3.8.3. winches associated with fishing\n\n3.9.\nSecuring equipment and objects for sea\npassage, transit in port or ready for use,\nincluding:\n3.9.1. containers\n3.9.2. machinery spares\n3.9.3. large pieces of vessel equipment such as\ngangways, spare fishing gear and anchors\n3.9.4. cargo\n3.9.5. galley utensils and stores\n3.9.6. personal items\n3.9.7. drawers and cupboard doors in accommodation\nand storage spaces\n\n--- PDF PAGE 62 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n60\n\n3.10. Using securing arrangements such as:\n3.10.1. lashing\n3.10.2. impounding\n3.10.3. patent securing arrangements\n3.10.4. checking cargo condition such as catch\ntemperature.\n3.11 Literacy skills used for:\n3.12 reading safety rules and regulations.\n3.13 Numeracy skills used for:\n3.13 reading levels of tanks and void spaces\n3.14 reading temperature-monitoring devices\n3.15 estimating safe working loads of ropes and\nwires.\n4. Resource Implication\n\nResources may include:\n4.1 operational vessel with the range of equipment\ndescribed above\n4.2 facilities for negotiating buoyage systems and\ntraffic.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1.\nthrough direct observation / demonstration\n5.2.\nportfolio\n6. Context of\nAssessment\n6.1 Assessment should be in a workplace.\n6.2 Demonstration of competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 63 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n61\n\nUNIT OF COMPETENCY: LOAD AND UNLOAD GOODS/CARGO\n\nUNIT CODE: AGR642302\n\nUNIT DESCRIPTOR\nThis unit covers the skills and knowledge required to load\nand unload goods and cargo, including loading and\nunloading goods, securing and protecting the load and\ncompleting all required documentation\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nLoad and unload\ngoods/cargo\n1.1 Load characteristics are identified and taken into\naccount when determining appropriate loading and\nunloading procedures\n1.2 Dangerous or hazardous goods are identified and\nhandled in accordance with relevant\nregulations/permit requirements\n1.3 Load is packed/unpacked to make safe and\neffective use of available spaces\n1.4 Goods/cargo are loaded in accordance with\nrelevant mass and loading regulations and\nworkplace procedures\n1.5 Lifting aids and appliances are selected and used\nto aid loading procedures in compliance with\nworkplace procedures and safety legislation\n1.6 Unloading activities are conducted in a safe and\nefficient manner taking into account suitable\nlocations, stowage, safe use of equipment and the\nbalance of the remaining load\n1.7 Goods requiring special handling and/or\ndocumentation are identified and appropriate\nprocedures followed\n1.8 Relocated material is restacked appropriate for the\ntransport method, safe height, weight loading, size\nand crushability of the goods\n\n--- PDF PAGE 64 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n62\n2.\n Secure and protect\nload\n2.1 The distribution of the load is checked to ensure\nthat it is even, legal and within safe working\ncapacity\n2.2 Load is checked to ensure that dangerous goods\nand hazardous substances are appropriately\nsegregated in accordance with relevant regulations\n2.3 Load is secured using the correct load restraint\nand protection equipment for different loads,\ncarrying and storage conditions\n2.4 The load is protected in accordance with legal and\nworkplace safety requirements\n3.\n Complete\ndocumentation\n3.1 The load is inspected and checked for security to\ntravel in accordance with relevant\nregulations/permit requirements\n3.2 All required documentation for the goods is\ncompleted in accordance with workplace\nrequirements\n\n--- PDF PAGE 65 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n63\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1 OH&S requirements\nmay include:\n1.1 OH&S legal requirements\n1.2 Enterprise OH&S policies, procedures and\nprograms\n2 Work in carried out in\naccordance with\nregulations.\nRegulatory\nrequirements may\ninclude:\n2.1 Relevant regulations regarding food processing and\nfood safety regulations\n2.2 Department of Health – Food Establishments –\nCode of Sanitation of the Philippines (P.D.856)\n2.3 Environment Management Bureau regulations\nregarding emissions, waste treatment, noise and\neffluent treatment and control\n3 Hygiene and\nsanitation\nrequirements may\ninclude:\n3.1 Department of Health – Food Establishments –\nCode of Sanitation of the Philippines (P.D.856)\n3.2 Requirements set out by Bureau of Food and Drugs\n3.3 Workplace requirements\n4 Workplace\nrequirements may\ninclude:\n4.1 Work instructions\n4.2 Standard operating procedures\n4.3 OH&S requirements\n4.4 Quality assurance requirements\n4.5 Equipment manufacturers’ advice\n4.6 Material Safety Data Sheets\n4.7 Codes of Practice and related advice\n5 General Context:\n5.1 Work must be carried out in compliance with the\nrelevant regulations/permit requirements\nincluding those of the relevant roads and traffic\nauthority concerning the loading of goods/cargo\n5.2 Work is performed under some supervision\ngenerally within a team environment\n5.3 Work involves the application of the basic\nprinciples, routine procedures and\nregulatory/permit requirements to the loading and\nunloading of goods/cargo\n6 Worksite environment\n6.1 Operations may be conducted in a range of work\nenvironments by day or night\n6.2 Customers may be internal or external\n6.3 Workplaces may comprise large, medium or small\nworksites\n6.4 Work may be conducted in:\n6.4.1. restricted spaces\n6.4.2. exposed conditions\n6.4.3. controlled or open environments\n6.5 Goods/cargo to be loaded or unloaded may require\nspecial precautions\n\n--- PDF PAGE 66 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n64\n6.6 Loads to be shifted may be:\n\n6.6.1. irregularly shaped\n\n6.6.2. packaged or unpackaged\n6.6.3. labelled or unlabelled\n6.6.4. palleted or unpalleted\n6.7 Hazards in the work area may include exposure to:\n\n6.7.1. chemicals\n\n6.7.2. dangerous or hazardous substances\n\n6.7.3. movements of equipment, goods and\nmaterials\n6.8 Personnel in the work area may include:\n\n6.8.1. workplace personnel\n\n6.8.2. site visitors\n\n6.8.3. contractors\n\n6.8.4. official representatives\n6.9 Communication in the work area may include:\n\n6.9.1. phone\n\n6.9.2. electronic data interchange\n\n6.9.3. fax\n\n6.9.4. e-mail\n\n6.9.5. Internet\n\n6.9.6. radio\n\n6.9.10 oral, aural or signed communications\n6.10\nLoading operations may be carried out both\nmanually and with the aid of lifting equipment\nand/or appliances\n6.11\nDepending on the type of organisation\nconcerned and the local terminology used,\nworkplace procedures may include:\n6.11.1. company procedures\n\n6.11.2. enterprise procedures\n\n6.11.3. organisational procedures\n\n6.11.4. established procedures\n6.12\nPersonal protection equipment may include:\n\n6.12.1. gloves\n\n6.12.2. safety headwear and footwear\n\n6.12.3. safety glasses\n\n6.12.4. two-way radios\n6.13\nhigh visibility clothing\n\n--- PDF PAGE 67 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n65\n7 Sources of\ninformation/document\nation:\n7.1 Information/documents may include:\n7.1.1. goods identification numbers and codes,\n7.1.2. manifests, bar codes, goods and container\nidentification\n7.1.3.manufacturer’s specifications for equipment/tools\n7.1.4.workplace procedures and policies for the loading\nand unloading of goods/cargo\n7.1.5. supplier and/or client instructions\n7.1.6.material safety data sheets\n7.1.7.EPGs and Initial Response Guide (HB76:1998 or\nequivalent)\n7.1.8.codes of practice including the manual handling\n7.2 award, enterprise bargaining agreement, other\nindustrial arrangements\n7.3 quality assurance procedures\n7.4 emergency procedures\n7.5 Load Restraint Guidelines\n8 Applicable regulations\nand legislation:\n8.1 Applicable regulations and legislation may include\n relevant standards and regulations including\nmass and loading regulations\n8.2. Philippine and international regulations and\ncodes of practice for the handling and transport of\ndangerous goods and hazardous substances.\n8.3. Relevant environmental protection legislation\n8.4. Relevant OHS legislation\n\n--- PDF PAGE 68 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n66\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidences that the candidate :\n1.1.identified load characteristics, dangerous or\nhazardous goods, loading equipment and\nrelated practices and take appropriate action\n1.2. identified class and subsidiary risk labels for\ndangerous goods and take appropriate action\n1.3. followed applicable codes\n1.4. safely loaded and unloaded goods following\nworkplace procedures\n1.5. distributed and secured load for safe transport\nin accordance with regulations\n1.6. located, interpreted and applied relevant\ninformation\n1.7. provided customer/client service and work\neffectively with others\n1.8. conveyed information in written and oral form\nwhen loading/unloading\n1.9. maintained workplace loading/unloading\nrecords\n1.10.selected and used appropriate workplace\ncolloquial and technical language and\ncommunication technologies in the workplace\ncontext\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge of:\n2.1. Loading regulations\n2.2. Philippine and international regulations and\ncodes of practice for the handling and transport of\ndangerous goods and hazardous substances\n2.3. OHS and procedures and guidelines concerning\nthe lifting and movement of loads\n2.4. Risks when loading and unloading goods/cargo\nand related precautions to control the risk\n2.5. Workplace procedures and policies for the\nloading and unloading of goods/cargo\n2.6. Housekeeping standards procedures required in\nthe workplace\n2.7. Methods of securing a load\n2.8. Site layout and obstacles\n2.9. Ability to identify and correctly use equipment\nrequired to load and unload goods/cargo\n2.10 Ability to modify activities depending on\ndiffering workplace contexts, risk situations\nand environments\n2.11. Ability to read and comprehend simple\nstatements\n\n--- PDF PAGE 69 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n67\n2.12 Ability to identify containers and goods coding,\nmarkings and, where applicable, emergency\ninformation panels and take appropriate action\n2.13. Ability to estimate the size shape and special\nrequirements of loads and take appropriate\naction\n2.14. Ability to safely use manual handling\ntechniques and to operate manually-operated\nload shifting equipment\n3. Underpinning Skills\n3.1.\nPlanning and organizing work (time\nmanagement)\n3.2.\nWorking with others and in teams\n4. Resource Implication\nThe following resources should be provided:\n4.1.\nWorkplace location and access to workplace\npolicies\n4.2.\nMaterials relevant to the proposed activity and\ntasks\n5 Methods of Assessment\nCompetency should be assessed:\n5.1. Through direct observation / demonstration\n5.2. Portfolio\n6. Context of Assessment\nAssessment must occur in a real or simulated\nworkplace where the assessee has access to:\n6.1.\nparticipate in a range of exercises, case studies\nand other real and simulated practical and\nknowledge assessments that demonstrate the\nskills and knowledge to load and unload\ngoods/cargo, and/or\n6.2.\nload and unload goods/cargo in an appropriate\nrange of operational situations\n\n--- PDF PAGE 70 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n68\n\nUNIT OF COMPETENCY:\nASSEMBLE AND REPAIR DAMAGED NETTING\nUNIT CODE:\nAGR642303\n\nUNIT DESCRIPTOR :\nThis unit covers the skills and knowledge required to\nrepair various types of damage that occurs to the netting\nmaterial used for fish or prawn trawls, purse seines,\nbeach seines or gill nets.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare netting\nmaterial for repair\n\n1.1\nNetting material is arranged and repair tools\norganized to maximize job efficiency and safety.\n1.2\nMaterial required for the repair operation is\nidentified by measuring existing material or by\nreference to a gear plan.\n1.3\nDamaged netting is removed using net work\ntools and disposed of to eliminate environmental\nimpact according to enterprise procedures.\n1.4\nRetained netting is prepared ready to accept\nreplacement.\n1.5\nReplacement netting is shaped with net repair\ntools.\n1.6\nReplacement netting is strengthened according\nto the gear plan or supervisor’s instructions\nbefore being added to the net.\n2. Mend holes and rips\nusing twine\n2.1\nStarting points are identified and twine is\nsecured to the netting according to supervisor’s\ninstructions.\n2.2\nTwine is used to tie knots that make meshes to\nresemble original netting.\n2.3\nTwine is secured at the end of the repair\naccording to supervisor’s instructions.\n3. Mend large scale\ndamage using netting\nmaterial\n3.1\nStarting points are identified and twine is\nsecured to the netting according to supervisor’s\ninstructions.\n3.2\nExisting and replacement material is joined\nusing twine and knots to resemble original\nnetting.\n3.3\nExisting and replacement material is joined using\ntwine and lacing to resemble original netting.\n\n--- PDF PAGE 71 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n69\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Material:\n1.1 gill netting:\n1.1.1 monofilament\n1.1.2 multi-monofilament\n2.1.\npurse seine netting:\n1.1.3 knotted and knotless netting\n1.1.4 braided twine\n1.1.5 twisted twine\n1.1.6 polyethylene (PE)\n1.1.7 polyamide (nylon) (PA)\n1.1.8 strengthening ropes.\n2. Tools:\n2.1 netting needles:\n2.1.1 bone\n2.1.2 flat\n2.2 knives\n2.3 scissors\n2.4 measuring devices:\n2.4.1 marked rod\n2.4.2 mesh gauge\n2.4.3 ruler\n2.5 stands\n2.6 tensioning devices.\n3. Efficiency:\n3.1 posture of workers\n3.2 safety of working area\n3.3 proximity to resources\n3.4 worker comfort\n3.5 speed of work.\n4. Repair operation:\n4.1 holes\n4.2 rips\n4.3 patches\n4.4 joining two panels with:\n4.4.1 sewing\n4.4.2 lacing\n4.4.3 additional strengthening ropes\n4.4.4 different sized meshes\n4.5 patching.\n5. Measuring:\n5.1.\ntwine:\n5.1.1. ply\n5.1.2. diameter\n5.1.3. tex, Rtex\n\n--- PDF PAGE 72 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n70\n\n5.2.\nmaterial type:\n5.2.1. PE\n5.2.2. PA\n5.2.3. monofilament\n5.2.4. braided\n5.2.5. twisted\n5.3.\nmesh size for mending purposes\n5.4.\nmesh size for fisheries regulation purposes.\n6. Prepared:\n6.1.\nknots:\n6.1.1. cleaned off\n6.1.2. remaining\n6.2.\nstarting point\n6.3.\nend point\n6.4.\nall other meshes either:\n6.4.1. points or\n6.4.2. meshes.\n7. Shaped:\n7.1 all meshes\n7.2 all points\n7.3 all bars\n7.4 combinations of above to form tapers.\n8. Strengthened:\n8.1 selvedge\n8.2 bordered with stronger netting\n8.3 double twine\n8.4 gathering meshes\n8.5 strengthening ropes.\n9. Secured:\n9.1 double sheet bend\n9.2 sheet bend with overhand knot.\n10. Knots:\n10.1 double sheet bend\n10.2 sheet bend tied horizontally and vertically\n10.3 side knot:\n10.3.1 net maker’s\n10.3.2 half hitches\n10.4 rolling hitch or hanging knots\n10.5 baiting\n10.6 joining (fisherman’s) knot\n10.7 sewn with meshes horizontal\n10.8 sewn with meshes vertical.\n11. Netting:\n11.1 regular meshes of netting\n11.2 meshes running through a join in two panels\n11.3 meshes along the side of a panel:\n11.3.1 all bar taper decreasing along a hung edge\n11.3.2 all bar taper increasing along a hung edge\n11.3.3 combinations of points, meshes and bars to\nform a taper.\n\n--- PDF PAGE 73 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n71\n12. Joined:\n12.1 mesh to mesh\n12.2 point to point\n12.3 paper to taper\n12.4 gathering meshes together.\n13. Lacing:\n13.1. emporary mending\n13.2. in seine netting\n13.3. two panels together\n13.4. including strengthening ropes.\n\n--- PDF PAGE 74 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n72\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 repaired various types of damage that occurs to\nthe netting material used for fish or prawn trawls,\npurse seines, beach seines or gill nets\n1.2 mended damage to hung areas of netting\n1.3 repaired large scale damage to netting material by\nsewing in patches and panels\n1.4 mended rips in netting.\nAssessment must confirm knowledge of:\n1.5 how a gear plan describes a net.\n2. Underpinning\nKnowledge and Attitudes\nThe essential knowledge and understanding a person\nneeds to perform work to the required standard\ninclude:\n2.1 factors which contribute to an efficient, fast and\nsafe net mending job\n2.2 naming, identifying and understanding different\nnetting terms\n2.3 order in which knots are tied to form netting\nmaterial\n2.4 recognizing polyethylene and polyamide netting\n2.5 measuring different types of netting\n2.6 using a taper table to design netting panels of a\nrequired depth, width or taper\n2.7 how a gear plan describes a net.\n3. Underpinning Skills\nThe essential skills a person needs to perform work to\nthe required standards include:\n1.2 using the net mending tools listed in the range of\nvariables\n1.3 preparing repair jobs by establishing start and end\npoints and either meshes or points in between\n1.4 cutting tapers into netting material\n1.5 strengthening netting material\n1.6 mending rips and holes by sewing twine and knots\nlisted\n1.7 repairing large scale damage to netting material\nby sewing in patches and panels\n1.8 mending damage to hung areas of netting\n1.9 joining panels of netting of different sized meshes.\nLiteracy skills used for:\n1.10 reading tables describing the effect of tapers\non panel shape\n1.11 interpreting the abbreviations on a gear plan.\n\n--- PDF PAGE 75 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n73\nNumeracy skills used for:\n3.11. counting the ply of twine\n3.12. measuring the diameter of twine\n3.13. counting meshes\n3.14. calculating joining ratios.\n4. Resource Implication\n\nResources may include:\n4.1 different types of netting requiring repair\n4.2 fully operational net repair area.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1 through direct observation / demonstration\n5.2 portfolio\n6. Context of\nAssessment\n6.1Assessment should be in a workplace.\n6.2 Demonstration of competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 76 ---\n___________________________________________