ic main gas, cylinder \ngases (e.g., Acetylene) or Liquid Petroleum \nGases (LPG) such as Butane or Propane) \nClass D \n1.6. Fires involving metals (where water is \ngenerally ineffective and dangerous) i.e., \nmetal powders such as magnesium, titanium, \nand alloys, etc. \nClass F \n1.7. New class specifically dealing with high \ntemperature  \n1.8. ( 360 degrees centigrade) cooking oils in \nlarge industrial catering kitchens, restaurants \nand takeaway establishments, etc. \n1.9. Electrical \n1.10. \nElectrical fires are not considered to \nconstitute a fire class on their own, as \nelectricity is a source of ignition that will \nfeed the fire until removed.  When the \nelectrical supply has been isolated.  The \nfire can be treated (generally) as Class A \nfor extinguishing purposes.  However, you \nshould use a non-conducting agent on all \npossible occasions.\nFire detection and fire \nfighting equipment and \nsystem \n2.1. Portable fire extinguisher including foam, \nwater, CO2, dry chemical and wet foam \n2.2. Fire blankets \n2.3. C02 fixed system \n2.4. Foam installation including semi-portable and \nfixed system\n\n--- PDF PAGE 35 ---\n________________________________________________________________ \nTR- Fish Capture  NC I                                                           \n33\n2.5. Sprinkler system \n2.6. Fire pumps (main and emergency fire pump \n2.7. Fire hoses, hydrants, branches and \ninternational shore connection  \n3. Methods of \nExtinguishing   fire \n3.1. Cooling \n3.2. Reducing the ignition temperature by taking \nthe heat out of the fire – using water (limiting \nthe temperature) \n3.3. Smothering  \n3.4. Limiting the oxygen available by smothering \nand preventing the mixture of oxygen and \nflammable vapour – by use of foam or a fire \nblanket \n3.5. Starving \n3.6. Limiting the fuel supply – by removing the \nsource of fuel ; by switching off electrical \npower, isolating the flow of flammable liquids \nor pulling away burning wood or straw, etc. \n3.7. Chemical Reaction  \n3.8. By interrupting the chain of combustion and \ncombining the hydrogen atoms with chlorine \natoms in the hydrocarbon chain, e.g. Halons \nextinguisher  (NB: Halons have now generally \nbeen withdrawn under the Montreal Protocol \nof 1990, as ozone depleting agents)\n\n--- PDF PAGE 36 ---\n________________________________________________________________ \nTR- Fish Capture  NC I                                                           \n34\n                                                                                                                 \nEVIDENCE GUIDE \n \n1. \nCritical aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1. Managed \nand \nimplemented \nfire \nprevention \nmeasures and procedures on board a vessel \n1.2. Assessed the operational capability of fire detection \nand fire fighting equipment and systems and initiate \nany required maintenance or replenishment action \n1.3. Participated in simulated on board fire fighting \nactivities \n1.4. Participated in search and rescue and fire fighting \nteams \n1.5. Implemented OHS principles and policies when \ncarrying out fire fighting duties \n1.6. Communicated effectively with others as required \nduring fire emergencies \n2. \nUnderpinning \nknowledge and  \nattitude \n2.1. Chemistry of fire and its relationship to materials \ntypically carried on vessels \n2.2. Types of fire detection, fire fighting, life saving and \nsafety equipment and systems used on board \nvessels and the procedures for their use \n2.3. Relevant regulations, code of practice, policies and \nprocedures related to the maintenance of fire \ndetection, fire fighting, life saving and safety \nequipment and system \n2.4. Faults that can occur with shipboard fire detection, \nfire fighting, life saving and safety equipment  and \nappropriate remedial action and solutions \n2.5. Statutory and typical company requirements for the \ndocumentation of maintenance procedures and \noutcomes for fire detection, fire fighting, life saving \nand safety equipment and systems used on board \nvessels. \n \n3. \nUnderpinning skills \n3.1. Procedures in checking and replacing consumable \nmaterials in typical ship board fire detection, fire-\nfighting and safety equipment and system \n3.2. Procedures in identifying and evaluating operational \nand maintenance problems with fire-detection, fire \nfighting, life saving and safety equipment and \nsystems and determining appropriate courses of \naction \n3.3. Procedures \nin \nidentifying \nand \nimplementing \nimprovements to maintenance for fire-detection and \nfire-fighting. \n3.4. Procedures on onboard housekeeping processes.\n\n--- PDF PAGE 37 ---\n________________________________________________________________ \nTR- Fish Capture  NC I                                                           \n35\n4. \nResource \nimplications \nThe following resources must be provided: \n4.2. Work place location \n4.3. Tools and equipment appropriate to schedule \nhousekeeping activities and to monitor and maintain \nworking condition \n4.4. Material relevant to the proposed activity and tasks \n5. \nMethod of \nassessment \nCompetency must be assessed through : \n5.1. Demonstration and questioning of related \nunderpinning knowledge \n5.2. Written Examination \n5.3. Portfolio \n6. \nContext for \nassessment \n6.1. Competency may be assessed in workplace or in a \nsimulated workplace setting \n6.2. Assessment shall be observed while task are being \nundertaken whether individually or in-group\n",
