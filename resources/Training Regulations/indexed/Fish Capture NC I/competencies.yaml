ents 3.2.5. displaying signals 3.2.6. preparing an anchor buoy 3.2.7. communicating with controller 3.3. Using and identifying synthetic rope and wire mooring lines: 3.3.1. fore and aft springs --- PDF PAGE 61 --- ___________________________________________________________ TR- Fish Capture NC I 59 3.3.2. back springs 3.3.3. bow and stern ropes 3.4. Breast lines 3.5. Assisting in different types of mooring operations: 3.5.1. making fast and letting go fore and aft to a wharf 3.5.2. making fast and letting go to a single-point mooring 3.5.3. preparing area for operation 3.5.4. using springs that manoeuvre a vessel to and from a wharf 3.5.5. adjusting mooring during a port stay 3.5.6. rigging safe access to a vessel 3.6. Taking contingency actions when encountering a malfunction or problem caused by: 3.6.1. failure of moorings and equipment 3.6.2. damage to moorings 3.6.3. insufficient mooring length or strength 3.6.4. poor leads 3.6.5. inability to maintain vessel in position 3.6.6. adverse weather 3.6.7. cargo or cargo-securing arrangements 3.7. Using different anchoring and mooring winches: 3.7.1. tension winches operated in manual or self- tensioning modes 3.7.2. stand-alone winches 3.7.3. windlasses and capstans with drum ends 3.8. Using power-operated equipment: 3.8.1. cranes and derricks 3.8.2. capstans 3.8.3. winches associated with fishing 3.9. Securing equipment and objects for sea passage, transit in port or ready for use, including: 3.9.1. containers 3.9.2. machinery spares 3.9.3. large pieces of vessel equipment such as gangways, spare fishing gear and anchors 3.9.4. cargo 3.9.5. galley utensils and stores 3.9.6. personal items 3.9.7. drawers and cupboard doors in accommodation and storage spaces --- PDF PAGE 62 --- ___________________________________________________________ TR- Fish Capture NC I 60"
