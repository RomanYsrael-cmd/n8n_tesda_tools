        "evidence_guide": {
          "source_text": "1. Critical aspects of\nCompetency\n\nAssessment requires evidences that the candidate :\n1.1.identified load characteristics, dangerous or\nhazardous goods, loading equipment and\nrelated practices and take appropriate action\n1.2. identified class and subsidiary risk labels for\ndangerous goods and take appropriate action\n1.3. followed applicable codes\n1.4. safely loaded and unloaded goods following\nworkplace procedures\n1.5. distributed and secured load for safe transport\nin accordance with regulations\n1.6. located, interpreted and applied relevant\ninformation\n1.7. provided customer/client service and work\neffectively with others\n1.8. conveyed information in written and oral form\nwhen loading/unloading\n1.9. maintained workplace loading/unloading\nrecords\n1.10.selected and used appropriate workplace\ncolloquial and technical language and\ncommunication technologies in the workplace\ncontext\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge of:\n2.1. Loading regulations\n2.2. Philippine and international regulations and\ncodes of practice for the handling and transport of\ndangerous goods and hazardous substances\n2.3. OHS and procedures and guidelines concerning\nthe lifting and movement of loads\n2.4. Risks when loading and unloading goods/cargo\nand related precautions to control the risk\n2.5. Workplace procedures and policies for the\nloading and unloading of goods/cargo\n2.6. Housekeeping standards procedures required in\nthe workplace\n2.7. Methods of securing a load\n2.8. Site layout and obstacles\n2.9. Ability to identify and correctly use equipment\nrequired to load and unload goods/cargo\n2.10 Ability to modify activities depending on\ndiffering workplace contexts, risk situations\nand environments\n2.11. Ability to read and comprehend simple\nstatements\n\n--- PDF PAGE 69 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n67\n2.12 Ability to identify containers and goods coding,\nmarkings and, where applicable, emergency\ninformation panels and take appropriate action\n2.13. Ability to estimate the size shape and special\nrequirements of loads and take appropriate\naction\n2.14. Ability to safely use manual handling\ntechniques and to operate manually-operated\nload shifting equipment\n3. Underpinning Skills\n3.1.\nPlanning and organizing work (time\nmanagement)\n3.2.\nWorking with others and in teams\n4. Resource Implication\nThe following resources should be provided:\n4.1.\nWorkplace location and access to workplace\npolicies\n4.2.\nMaterials relevant to the proposed activity and\ntasks\n5 Methods of Assessment\nCompetency should be assessed:\n5.1. Through direct observation / demonstration\n5.2. Portfolio\n6. Context of Assessment\nAssessment must occur in a real or simulated\nworkplace where the assessee has access to:\n6.1.\nparticipate in a range of exercises, case studies\nand other real and simulated practical and\nknowledge assessments that demonstrate the\nskills and knowledge to load and unload\ngoods/cargo, and/or\n6.2.\nload and unload goods/cargo in an appropriate\nrange of operational situations\n\n--- PDF PAGE 70 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n68\n\nUNIT OF COMPETENCY:\nASSEMBLE AND REPAIR DAMAGED NETTING\nUNIT CODE:"
        },
        "source_text": "AGR642302\n\nUNIT DESCRIPTOR\nThis unit covers the skills and knowledge required to load\nand unload goods and cargo, including loading and\nunloading goods, securing and protecting the load and\ncompleting all required documentation\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nLoad and unload\ngoods/cargo\n1.1 Load characteristics are identified and taken into\naccount when determining appropriate loading and\nunloading procedures\n1.2 Dangerous or hazardous goods are identified and\nhandled in accordance with relevant\nregulations/permit requirements\n1.3 Load is packed/unpacked to make safe and\neffective use of available spaces\n1.4 Goods/cargo are loaded in accordance with\nrelevant mass and loading regulations and\nworkplace procedures\n1.5 Lifting aids and appliances are selected and used\nto aid loading procedures in compliance with\nworkplace procedures and safety legislation\n1.6 Unloading activities are conducted in a safe and\nefficient manner taking into account suitable\nlocations, stowage, safe use of equipment and the\nbalance of the remaining load\n1.7 Goods requiring special handling and/or\ndocumentation are identified and appropriate\nprocedures followed\n1.8 Relocated material is restacked appropriate for the\ntransport method, safe height, weight loading, size\nand crushability of the goods\n\n--- PDF PAGE 64 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n62\n2.\n Secure and protect\nload\n2.1 The distribution of the load is checked to ensure\nthat it is even, legal and within safe working\ncapacity\n2.2 Load is checked to ensure that dangerous goods\nand hazardous substances are appropriately\nsegregated in accordance with relevant regulations\n2.3 Load is secured using the correct load restraint\nand protection equipment for different loads,\ncarrying and storage conditions\n2.4 The load is protected in accordance with legal and\nworkplace safety requirements\n3.\n Complete\ndocumentation\n3.1 The load is inspected and checked for security to\ntravel in accordance with relevant\nregulations/permit requirements\n3.2 All required documentation for the goods is\ncompleted in accordance with workplace\nrequirements\n\n--- PDF PAGE 65 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n63\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1 OH&S requirements\nmay include:\n1.1 OH&S legal requirements\n1.2 Enterprise OH&S policies, procedures and\nprograms\n2 Work in carried out in\naccordance with\nregulations.\nRegulatory\nrequirements may\ninclude:\n2.1 Relevant regulations regarding food processing and\nfood safety regulations\n2.2 Department of Health – Food Establishments –\nCode of Sanitation of the Philippines (P.D.856)\n2.3 Environment Management Bureau regulations\nregarding emissions, waste treatment, noise and\neffluent treatment and control\n3 Hygiene and\nsanitation\nrequirements may\ninclude:\n3.1 Department of Health – Food Establishments –\nCode of Sanitation of the Philippines (P.D.856)\n3.2 Requirements set out by Bureau of Food and Drugs\n3.3 Workplace requirements\n4 Workplace\nrequirements may\ninclude:\n4.1 Work instructions\n4.2 Standard operating procedures\n4.3 OH&S requirements\n4.4 Quality assurance requirements\n4.5 Equipment manufacturers’ advice\n4.6 Material Safety Data Sheets\n4.7 Codes of Practice and related advice\n5 General Context:\n5.1 Work must be carried out in compliance with the\nrelevant regulations/permit requirements\nincluding those of the relevant roads and traffic\nauthority concerning the loading of goods/cargo\n5.2 Work is performed under some supervision\ngenerally within a team environment\n5.3 Work involves the application of the basic\nprinciples, routine procedures and\nregulatory/permit requirements to the loading and\nunloading of goods/cargo\n6 Worksite environment\n6.1 Operations may be conducted in a range of work\nenvironments by day or night\n6.2 Customers may be internal or external\n6.3 Workplaces may comprise large, medium or small\nworksites\n6.4 Work may be conducted in:\n6.4.1. restricted spaces\n6.4.2. exposed conditions\n6.4.3. controlled or open environments\n6.5 Goods/cargo to be loaded or unloaded may require\nspecial precautions\n\n--- PDF PAGE 66 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n64\n6.6 Loads to be shifted may be:\n\n6.6.1. irregularly shaped\n\n6.6.2. packaged or unpackaged\n6.6.3. labelled or unlabelled\n6.6.4. palleted or unpalleted\n6.7 Hazards in the work area may include exposure to:\n\n6.7.1. chemicals\n\n6.7.2. dangerous or hazardous substances\n\n6.7.3. movements of equipment, goods and\nmaterials\n6.8 Personnel in the work area may include:\n\n6.8.1. workplace personnel\n\n6.8.2. site visitors\n\n6.8.3. contractors\n\n6.8.4. official representatives\n6.9 Communication in the work area may include:\n\n6.9.1. phone\n\n6.9.2. electronic data interchange\n\n6.9.3. fax\n\n6.9.4. e-mail\n\n6.9.5. Internet\n\n6.9.6. radio\n\n6.9.10 oral, aural or signed communications\n6.10\nLoading operations may be carried out both\nmanually and with the aid of lifting equipment\nand/or appliances\n6.11\nDepending on the type of organisation\nconcerned and the local terminology used,\nworkplace procedures may include:\n6.11.1. company procedures\n\n6.11.2. enterprise procedures\n\n6.11.3. organisational procedures\n\n6.11.4. established procedures\n6.12\nPersonal protection equipment may include:\n\n6.12.1. gloves\n\n6.12.2. safety headwear and footwear\n\n6.12.3. safety glasses\n\n6.12.4. two-way radios\n6.13\nhigh visibility clothing\n\n--- PDF PAGE 67 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n65\n7 Sources of\ninformation/document\nation:\n7.1 Information/documents may include:\n7.1.1. goods identification numbers and codes,\n7.1.2. manifests, bar codes, goods and container\nidentification\n7.1.3.manufacturer’s specifications for equipment/tools\n7.1.4.workplace procedures and policies for the loading\nand unloading of goods/cargo\n7.1.5. supplier and/or client instructions\n7.1.6.material safety data sheets\n7.1.7.EPGs and Initial Response Guide (HB76:1998 or\nequivalent)\n7.1.8.codes of practice including the manual handling\n7.2 award, enterprise bargaining agreement, other\nindustrial arrangements\n7.3 quality assurance procedures\n7.4 emergency procedures\n7.5 Load Restraint Guidelines\n8 Applicable regulations\nand legislation:\n8.1 Applicable regulations and legislation may include\n relevant standards and regulations including\nmass and loading regulations\n8.2. Philippine and international regulations and\ncodes of practice for the handling and transport of\ndangerous goods and hazardous substances.\n8.3. Relevant environmental protection legislation\n8.4. Relevant OHS legislation\n\n--- PDF PAGE 68 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n66\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\n\nAssessment requires evidences that the candidate :\n1.1.identified load characteristics, dangerous or\nhazardous goods, loading equipment and\nrelated practices and take appropriate action\n1.2. identified class and subsidiary risk labels for\ndangerous goods and take appropriate action\n1.3. followed applicable codes\n1.4. safely loaded and unloaded goods following\nworkplace procedures\n1.5. distributed and secured load for safe transport\nin accordance with regulations\n1.6. located, interpreted and applied relevant\ninformation\n1.7. provided customer/client service and work\neffectively with others\n1.8. conveyed information in written and oral form\nwhen loading/unloading\n1.9. maintained workplace loading/unloading\nrecords\n1.10.selected and used appropriate workplace\ncolloquial and technical language and\ncommunication technologies in the workplace\ncontext\n2. Underpinning\nKnowledge and\nAttitudes\nKnowledge of:\n2.1. Loading regulations\n2.2. Philippine and international regulations and\ncodes of practice for the handling and transport of\ndangerous goods and hazardous substances\n2.3. OHS and procedures and guidelines concerning\nthe lifting and movement of loads\n2.4. Risks when loading and unloading goods/cargo\nand related precautions to control the risk\n2.5. Workplace procedures and policies for the\nloading and unloading of goods/cargo\n2.6. Housekeeping standards procedures required in\nthe workplace\n2.7. Methods of securing a load\n2.8. Site layout and obstacles\n2.9. Ability to identify and correctly use equipment\nrequired to load and unload goods/cargo\n2.10 Ability to modify activities depending on\ndiffering workplace contexts, risk situations\nand environments\n2.11. Ability to read and comprehend simple\nstatements\n\n--- PDF PAGE 69 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n67\n2.12 Ability to identify containers and goods coding,\nmarkings and, where applicable, emergency\ninformation panels and take appropriate action\n2.13. Ability to estimate the size shape and special\nrequirements of loads and take appropriate\naction\n2.14. Ability to safely use manual handling\ntechniques and to operate manually-operated\nload shifting equipment\n3. Underpinning Skills\n3.1.\nPlanning and organizing work (time\nmanagement)\n3.2.\nWorking with others and in teams\n4. Resource Implication\nThe following resources should be provided:\n4.1.\nWorkplace location and access to workplace\npolicies\n4.2.\nMaterials relevant to the proposed activity and\ntasks\n5 Methods of Assessment\nCompetency should be assessed:\n5.1. Through direct observation / demonstration\n5.2. Portfolio\n6. Context of Assessment\nAssessment must occur in a real or simulated\nworkplace where the assessee has access to:\n6.1.\nparticipate in a range of exercises, case studies\nand other real and simulated practical and\nknowledge assessments that demonstrate the\nskills and knowledge to load and unload\ngoods/cargo, and/or\n6.2.\nload and unload goods/cargo in an appropriate\nrange of operational situations\n\n--- PDF PAGE 70 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n68\n\nUNIT OF COMPETENCY:\nASSEMBLE AND REPAIR DAMAGED NETTING\nUNIT CODE:"
