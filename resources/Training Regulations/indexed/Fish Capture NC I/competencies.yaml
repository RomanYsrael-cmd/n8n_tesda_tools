        "source_text": "MTM834202\n\nUNIT DESCRIPTOR : This unit identifies the competence required to prevent and\nfight fires on board a vessel, including management of fire\nprevention measures, initiation and management of evacuation,\nemergency shutdown and isolation procedures and the\nexecution and coordination of fire-fighting operations\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Manage fire prevention\nprocedures\n1.1. Fire hazards on board a vessel are identified and\naction is taken to eliminate or minimize them\n1.2. Fire detection and fire fighting equipment and\nsystems are regularly checked and appropriate\naction is taken to ensure that they are operational\n1.3. Appropriate educational activities are organized\nto ensure on-board personnel are aware of the\ndangers of fire, how to prevent it and what to do if\na fire is detected\n1.4. Personnel on board a vessel are made aware of\nemergency procedures to be followed in the event\nof fire\n2. Operate portable fire-\nfighting equipment\n2.1. Classes of fires are correctly identified in\naccordance with accepted fire-fighting practice\n2.2. Correct portable fire-fighting equipment is\nselected and used to fight specific classes of fires\n2.3. Class F fires are correctly extinguished with a fire\nblanket in accordance with accepted fire-fighting\npractice\n2.4. Methods of extinguishing fire on board a vessel\nare correctly applied\n2.5. Correct techniques are applied for the setting up\nof foam making equipment to extinguish B Class\nfires on board vessel\n2.6. Where applicable, correct techniques are used to\nrecharge the various types of portable fire\nextinguisher\n2.7. Where applicable, portable fire-fighting equipment\nis confirmed as operational following recharging\n\n3. Conduct interior search\nand rescue and fire-\nfighting operations\n(where applicable)\n3.1. Procedures for donning and starting up SCBA /\nCABA are correctly applied\n3.2. Procedures for the logging of SCBA / CABA\noperations on a BA Control Board is correctly\n\n--- PDF PAGE 33 ---\n________________________________________________________________\nTR- Fish Capture NC I\n31\nfollowed in accordance with vessel’s procedures\nand accepted fire-fighting practice\n3.3. Search and rescue operations in a smoke filled\nenvironment are correctly conducted as a\nmember of a fire-fighting team in accordance\nwith accepted fire-fighting practice\n3.4. Interior fires are extinguished using appropriate\nfire fighting equipment and procedures as a\nmember of a fire fighting team in accordance\nwith accepted fire-fighting practice\n3.5. Lifeline signals are correctly used during interior\nfire fighting operations\n3.6. A compartment filled with high expansion foam\nis correctly entered as per accepted fire-fighting\npractice\n\n--- PDF PAGE 34 ---\n________________________________________________________________\nTR- Fish Capture NC I\n32\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n\n1. Classes of Fire\nClass A\n1.1. All solid materials, usually organic origin in\nnature (contains compounds of carbon) and\ngenerally produce glowing embers – i.e.,\nwood, textiles, curtains, furniture and plastics.\nClass B\n1.2. All flammable liquids and solids, which can\nalso be sub-divided into :\n1.3. Miscible with water (i.e., petrol, oils,\nlubricants, paints and waxes)\n1.4. Non-miscible with water ( e.g., alcohol)\nClass C\n1.5. Fires involving domestic main gas, cylinder\ngases (e.g., Acetylene) or Liquid Petroleum\nGases (LPG) such as Butane or Propane)\nClass D\n1.6. Fires involving metals (where water is\ngenerally ineffective and dangerous) i.e.,\nmetal powders such as magnesium, titanium,\nand alloys, etc.\nClass F\n1.7. New class specifically dealing with high\ntemperature\n1.8. ( 360 degrees centigrade) cooking oils in\nlarge industrial catering kitchens, restaurants\nand takeaway establishments, etc.\n1.9. Electrical\n1.10.\nElectrical fires are not considered to\nconstitute a fire class on their own, as\nelectricity is a source of ignition that will\nfeed the fire until removed. When the\nelectrical supply has been isolated. The\nfire can be treated (generally) as Class A\nfor extinguishing purposes. However, you\nshould use a non-conducting agent on all\npossible occasions.\nFire detection and fire\nfighting equipment and\nsystem\n2.1. Portable fire extinguisher including foam,\nwater, CO2, dry chemical and wet foam\n2.2. Fire blankets\n2.3. C02 fixed system\n2.4. Foam installation including semi-portable and\nfixed system\n\n--- PDF PAGE 35 ---\n________________________________________________________________\nTR- Fish Capture NC I\n33\n2.5. Sprinkler system\n2.6. Fire pumps (main and emergency fire pump\n2.7. Fire hoses, hydrants, branches and\ninternational shore connection\n3. Methods of\nExtinguishing fire\n3.1. Cooling\n3.2. Reducing the ignition temperature by taking\nthe heat out of the fire – using water (limiting\nthe temperature)\n3.3. Smothering\n3.4. Limiting the oxygen available by smothering\nand preventing the mixture of oxygen and\nflammable vapour – by use of foam or a fire\nblanket\n3.5. Starving\n3.6. Limiting the fuel supply – by removing the\nsource of fuel ; by switching off electrical\npower, isolating the flow of flammable liquids\nor pulling away burning wood or straw, etc.\n3.7. Chemical Reaction\n3.8. By interrupting the chain of combustion and\ncombining the hydrogen atoms with chlorine\natoms in the hydrocarbon chain, e.g. Halons\nextinguisher (NB: Halons have now generally\nbeen withdrawn under the Montreal Protocol\nof 1990, as ozone depleting agents)\n\n--- PDF PAGE 36 ---\n________________________________________________________________\nTR- Fish Capture NC I\n34\n\nEVIDENCE GUIDE\n\n1.\nCritical aspects of\nCompetency\nAssessment requires evidence that the candidate :\n1.1. Managed\nand\nimplemented\nfire\nprevention\nmeasures and procedures on board a vessel\n1.2. Assessed the operational capability of fire detection\nand fire fighting equipment and systems and initiate\nany required maintenance or replenishment action\n1.3. Participated in simulated on board fire fighting\nactivities\n1.4. Participated in search and rescue and fire fighting\nteams\n1.5. Implemented OHS principles and policies when\ncarrying out fire fighting duties\n1.6. Communicated effectively with others as required\nduring fire emergencies\n2.\nUnderpinning\nknowledge and\nattitude\n2.1. Chemistry of fire and its relationship to materials\ntypically carried on vessels\n2.2. Types of fire detection, fire fighting, life saving and\nsafety equipment and systems used on board\nvessels and the procedures for their use\n2.3. Relevant regulations, code of practice, policies and\nprocedures related to the maintenance of fire\ndetection, fire fighting, life saving and safety\nequipment and system\n2.4. Faults that can occur with shipboard fire detection,\nfire fighting, life saving and safety equipment and\nappropriate remedial action and solutions\n2.5. Statutory and typical company requirements for the\ndocumentation of maintenance procedures and\noutcomes for fire detection, fire fighting, life saving\nand safety equipment and systems used on board\nvessels.\n\n3.\nUnderpinning skills\n3.1. Procedures in checking and replacing consumable\nmaterials in typical ship board fire detection, fire-\nfighting and safety equipment and system\n3.2. Procedures in identifying and evaluating operational\nand maintenance problems with fire-detection, fire\nfighting, life saving and safety equipment and\nsystems and determining appropriate courses of\naction\n3.3. Procedures\nin\nidentifying\nand\nimplementing\nimprovements to maintenance for fire-detection and\nfire-fighting.\n3.4. Procedures on onboard housekeeping processes.\n\n--- PDF PAGE 37 ---\n________________________________________________________________\nTR- Fish Capture NC I\n35\n4.\nResource\nimplications\nThe following resources must be provided:\n4.2. Work place location\n4.3. Tools and equipment appropriate to schedule\nhousekeeping activities and to monitor and maintain\nworking condition\n4.4. Material relevant to the proposed activity and tasks\n5.\nMethod of\nassessment\nCompetency must be assessed through :\n5.1. Demonstration and questioning of related\nunderpinning knowledge\n5.2. Written Examination\n5.3. Portfolio\n6.\nContext for\nassessment\n6.1. Competency may be assessed in workplace or in a\nsimulated workplace setting\n6.2. Assessment shall be observed while task are being\nundertaken whether individually or in-group\n\n--- PDF PAGE 38 ---\n________________________________________________________________\nTR- Fish Capture NC I\n36\n\nUNIT OF COMPETENCY: PERFORM FIRST AID TREATMENT ON BOARD\n\nUNIT CODE :"
