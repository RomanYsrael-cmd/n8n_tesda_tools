        "source_title": "PERFORM FIRST AID TREATMENT ON BOARD",
        "source_text": "--- PDF PAGE 38 ---\n________________________________________________________________ \nTR- Fish Capture  NC I                                                           \n36\n \n \nUNIT OF COMPETENCY:  PERFORM FIRST AID TREATMENT ON BOARD \n \nUNIT CODE                    :  MTM834204 \n \nUNIT DESCRIPTOR :   This  unit  identifies  the  competence  required to perform first \naid treatment to crew and / or passengers during a medical \nemergency on board a vessel, including the performance of \nimmediate life saving first aid until qualified medical assistance is \navailable, the recognition of symptoms and signs of acute illness \nand or injury and the taking of appropriate action. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1.   Perform immediate life \nsaving first aid pending \nthe arrival of medical \nassistance \n \n1.1. The priorities of First Aid Care are correctly \napplied in real or simulated first aid situation \n1.2. The DRABC Action plan is correctly used to \nidentify and control danger, loss of \nconsciousness, loss of airway, breathing and \ncirculation \n1.3. An unconscious casualty is correctly placed in \nstable side position and the steps in clearing \nthe airways to promote breathing in accordance \nwith established first aid procedures \n1.4. The correct method of Expired Air Resuscitation \n(EAR), External Cardiac Compression (ECC) \nand Cardio Pulmonary Resuscitation (CPR) is \napplied in real life resuscitation situation or in a \nsimulated exercise using a mannequin \n \n2. Recognize the \nsymptoms and acute \nillness and or injury and \ntake appropriate action \n2.1. The conditions requiring special first aid \nprocedures are correctly identified \n2.2. A real or simulated unconscious casualty is \ncared for in accordance with established first \naid procedures \n2.3. Causes of respiratory failure and breathing \ndifficulty are correctly identified and appropriate \ncare is provided for a real or simulated casualty \nwith obstructed breathing \n2.4. The symptoms and signs of casualty with \nangina pain, heart attack and heart failure are \ncorrectly identified \n2.5. The symptoms and signs of poisoning, bites \nand stings are correctly identified and \nappropriate immediate management of thee \nconditions is provided in real or simulated \nsituation\n\n--- PDF PAGE 39 ---\n________________________________________________________________ \nTR- Fish Capture  NC I                                                           \n37\n2.6. A real or simulated conscious casualty with an \nacute illness and or injury is cared for in \naccordance with established first aid \nprocedures \n3. Manage wounds and \nbleeding \n3.1. Severe external bleeding is correctly controlled \nin a real or simulated situation \n3.2. The symptoms and signs of severe internal \nbleeding are correctly identified and appropriate \nimmediate management of these conditions is \nprovided in a real or simulated situation \n3.3. A real or simulated laceration, abrasion and a \ndeep puncture wound is correctly manage in \naccordance with established first aid \nprocedures \n3.4. The signs of wound infections are correctly \nidentified and a real or simulated wound \ninfection is correctly managed in accordance \nwith established procedures \n4. Manage burns \n4.1. Immediate rescue procedures are correctly \nused in real or simulated first aid situations \ninvolving a burned casualty \n4.2. The severity of burn is correctly assessed in \nterms of depth, position and size in accordance \nwith established procedures \n4.3. The correct method of treatment for burns and \nassociated shock is correctly applied in real or \nsimulated first aid situations involving a burned \ncasualty \n5. Manage bone, joint and \nmuscle injuries \n5.1. Symptoms and signs of fractures (simple and \ncomplicated) are correctly recognized in \naccordance with established first aid \nprocedures \n5.2. Problems and treatment associated with \ndislocated joints are correctly managed in \naccordance with established procedures \n5.3. First aid treatment of pelvic and chest injuries \nand fractures of limbs, including immobilization \ntechniques is correctly performed in accordance \nwith established procedures \n5.4. The symptoms and signs of sprains and strains \nare correctly identified in accordance with \nestablished procedure\n\n--- PDF PAGE 40 ---\n________________________________________________________________ \nTR- Fish Capture  NC I                                                           \n38\n6. Adapt first aid \nprocedures for remote \nsituations \n6.1. Safety precautions needed to prevent \naccidents, illness and injuries and infection in \nremote areas situations are correctly applied in \nreal or simulated situations \n6.2. Identify and discuss the factors involved in the \nprevention of heat and cold exposure \n6.3. The symptoms and signs of real or simulated \ncasualty exposed to heat or cold are correctly \nidentified including hyperthermia and \nhypothermia and appropriate management of \nthe casualty carried out in accordance with \nestablished procedures \n6.4. A real or simulated ill or injured person in \nremote conditions is correctly, cared for unit \nhelp arrives, including the monitoring of airway, \nbreathing and heart beat, the control of pain, \nhydration and maintenance of body \ntemperature \n6.5. A real or simulated casualty with severe injuries \nin a remote situation is correctly cared for, \nincluding the preparation for transport \n6.6. First aid resources and emergency \nequipment required for remote area situations \nis correctly identified and used in real or \nsimulated situations in accordance with \nestablished first aid procedures\n\n--- PDF PAGE 41 ---\n________________________________________________________________ \nTR- Fish Capture  NC I                                                           \n39\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. First aid Care on board a \nvessel may need to be \nprovided in situation \ninvolving : \n1.1. Acute illness or injury \n1.2. Laceration, abrasion and a deep puncture \nwounds \n1.3. Respiratory failure and breathing difficulty \n1.4. Shock as a result of severe injury \n1.5. Abdominal, pelvic and chest injuries \n1.6. Fractures of limbs \n1.7. Poisoning, bites and stings \n1.8. Sprains, strains and dislocations \n1.9. Facial, ear and eye injuries \n1.10.\nSuspected head, neck and back injuries \n2. Conditions requiring \nspecial first aid \nprocedures include \n2.1. Explosion injuries \n2.2. Burns \n2.3. Poisons and envenomation \n2.4.Hypothermia and hyperthemia\n3. First aid resources and \nequipment include \n3.1. Vessels/ medicine cabinet \n3.2. First aid boxes \n3.3. Emergency first aid carry bags \n3.4. Specific first aid resources  \n3.5. Roller bandages \n3.6. Triangular bandages \n3.7. Face masks \n3.8. Cleaning swabs \n3.9. Cleaning brush \n3.10. \nCleaning materials \n3.11. \nMedicines  \n3.12. \nVessel’s Medicine Cabinet \n3.13. \nFirst Aid Boxes \n3.14.\nEmergency first aid carry bags\n\n--- PDF PAGE 42 ---\n________________________________________________________________ \nTR- Fish Capture  NC I                                                           \n40\nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency  \nAssessment \nrequires \nevidence \nthat \nthe \ncandidate : \n1.1. Performed immediate life saving first aid \n1.2. Recognized the symptoms and signs of \nacute illness and or injury and take \nappropriate action \n1.3. Managed wounds and bleeding \n1.4. Managed burns \n1.5. Managed bone, joints and muscle injuries \n1.6. Adapted first aid procedures for remote \nsituation \n1.7. Communicated effectively with others during \nprovision of first aid. \n1.8. Prepared report on first aid situations and \nactivities in accordance with company and \nregulatory requirements \n2. Underpinning knowledge \nand  attitude \n2.1. Duties and responsibilities of the designated \nfirst aid officer on board a vessel \n2.2. Knowledge on ways in which disease can \nspread on board a vessel and ways of \npreventing the spread \n2.3. Legal issues related to administration of \ndrugs and medicines on board a vessel \n2.4. Knowledge of body structures and functions \nrelevant to possible injury, illnesses and \ndisease that may be encountered on board \na vessel \n2.5. Maritime communication techniques related \nto health care and receiving radio medical \nadvice form shore based advisers \n2.6. Marine publications containing information \non first aid and medical treatment on board \na vessel\n3. Underpinning skills \n3.1. Medical  first aid procedures \n3.2. Procedures for conducting an initial patient \nfirst aid treatment \n3.3. Managing injuries and medical emergencies \n3.4. Managing medicine resources \n3.5. Techniques for care of wounds \n3.6. Correct \nmethods \nof \nExpired \nAir \nResuscitation \n(EAR), \nExternal \nCardiac \nCompression (ECC) and Cardio Pulmonary \nResuscitation (CPR)\n\n--- PDF PAGE 43 ---\n________________________________________________________________ \nTR- Fish Capture  NC I                                                           \n41\n4. Resource implications \nThe following resources must  be provided: \n4.1. Work place location \n4.2. Tools and equipment appropriate to \nschedule housekeeping activities and to \nmonitor and maintain working condition \n4.3. Material relevant to the proposed activity \nand tasks \n5. Method of assessment \nCompetency must be assessed through : \n5.1. Demonstration and questioning of related \nunderpinning knowledge \n5.2. Written Examination \n5.3. Portfolio \n6. Context for assessment \n6.1. Competency may be assessed in workplace \nor in a simulated workplace setting \n6.2. Assessment shall be observed while task \nare being undertaken whether individually or \nin-group\n",
