        "evidence_guide": {
          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 repaired various types of damage that occurs to\nthe netting material used for fish or prawn trawls,\npurse seines, beach seines or gill nets\n1.2 mended damage to hung areas of netting\n1.3 repaired large scale damage to netting material by\nsewing in patches and panels\n1.4 mended rips in netting.\nAssessment must confirm knowledge of:\n1.5 how a gear plan describes a net.\n2. Underpinning\nKnowledge and Attitudes\nThe essential knowledge and understanding a person\nneeds to perform work to the required standard\ninclude:\n2.1 factors which contribute to an efficient, fast and\nsafe net mending job\n2.2 naming, identifying and understanding different\nnetting terms\n2.3 order in which knots are tied to form netting\nmaterial\n2.4 recognizing polyethylene and polyamide netting\n2.5 measuring different types of netting\n2.6 using a taper table to design netting panels of a\nrequired depth, width or taper\n2.7 how a gear plan describes a net.\n3. Underpinning Skills\nThe essential skills a person needs to perform work to\nthe required standards include:\n1.2 using the net mending tools listed in the range of\nvariables\n1.3 preparing repair jobs by establishing start and end\npoints and either meshes or points in between\n1.4 cutting tapers into netting material\n1.5 strengthening netting material\n1.6 mending rips and holes by sewing twine and knots\nlisted\n1.7 repairing large scale damage to netting material\nby sewing in patches and panels\n1.8 mending damage to hung areas of netting\n1.9 joining panels of netting of different sized meshes.\nLiteracy skills used for:\n1.10 reading tables describing the effect of tapers\non panel shape\n1.11 interpreting the abbreviations on a gear plan.\n\n--- PDF PAGE 75 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n73\nNumeracy skills used for:\n3.11. counting the ply of twine\n3.12. measuring the diameter of twine\n3.13. counting meshes\n3.14. calculating joining ratios.\n4. Resource Implication\n\nResources may include:\n4.1 different types of netting requiring repair\n4.2 fully operational net repair area.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1 through direct observation / demonstration\n5.2 portfolio\n6. Context of\nAssessment\n6.1Assessment should be in a workplace.\n6.2 Demonstration of competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 76 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n74"
        },
        "source_text": "AGR642303\n\nUNIT DESCRIPTOR :\nThis unit covers the skills and knowledge required to\nrepair various types of damage that occurs to the netting\nmaterial used for fish or prawn trawls, purse seines,\nbeach seines or gill nets.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare netting\nmaterial for repair\n\n1.1\nNetting material is arranged and repair tools\norganized to maximize job efficiency and safety.\n1.2\nMaterial required for the repair operation is\nidentified by measuring existing material or by\nreference to a gear plan.\n1.3\nDamaged netting is removed using net work\ntools and disposed of to eliminate environmental\nimpact according to enterprise procedures.\n1.4\nRetained netting is prepared ready to accept\nreplacement.\n1.5\nReplacement netting is shaped with net repair\ntools.\n1.6\nReplacement netting is strengthened according\nto the gear plan or supervisor’s instructions\nbefore being added to the net.\n2. Mend holes and rips\nusing twine\n2.1\nStarting points are identified and twine is\nsecured to the netting according to supervisor’s\ninstructions.\n2.2\nTwine is used to tie knots that make meshes to\nresemble original netting.\n2.3\nTwine is secured at the end of the repair\naccording to supervisor’s instructions.\n3. Mend large scale\ndamage using netting\nmaterial\n3.1\nStarting points are identified and twine is\nsecured to the netting according to supervisor’s\ninstructions.\n3.2\nExisting and replacement material is joined\nusing twine and knots to resemble original\nnetting.\n3.3\nExisting and replacement material is joined using\ntwine and lacing to resemble original netting.\n\n--- PDF PAGE 71 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n69\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Material:\n1.1 gill netting:\n1.1.1 monofilament\n1.1.2 multi-monofilament\n2.1.\npurse seine netting:\n1.1.3 knotted and knotless netting\n1.1.4 braided twine\n1.1.5 twisted twine\n1.1.6 polyethylene (PE)\n1.1.7 polyamide (nylon) (PA)\n1.1.8 strengthening ropes.\n2. Tools:\n2.1 netting needles:\n2.1.1 bone\n2.1.2 flat\n2.2 knives\n2.3 scissors\n2.4 measuring devices:\n2.4.1 marked rod\n2.4.2 mesh gauge\n2.4.3 ruler\n2.5 stands\n2.6 tensioning devices.\n3. Efficiency:\n3.1 posture of workers\n3.2 safety of working area\n3.3 proximity to resources\n3.4 worker comfort\n3.5 speed of work.\n4. Repair operation:\n4.1 holes\n4.2 rips\n4.3 patches\n4.4 joining two panels with:\n4.4.1 sewing\n4.4.2 lacing\n4.4.3 additional strengthening ropes\n4.4.4 different sized meshes\n4.5 patching.\n5. Measuring:\n5.1.\ntwine:\n5.1.1. ply\n5.1.2. diameter\n5.1.3. tex, Rtex\n\n--- PDF PAGE 72 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n70\n\n5.2.\nmaterial type:\n5.2.1. PE\n5.2.2. PA\n5.2.3. monofilament\n5.2.4. braided\n5.2.5. twisted\n5.3.\nmesh size for mending purposes\n5.4.\nmesh size for fisheries regulation purposes.\n6. Prepared:\n6.1.\nknots:\n6.1.1. cleaned off\n6.1.2. remaining\n6.2.\nstarting point\n6.3.\nend point\n6.4.\nall other meshes either:\n6.4.1. points or\n6.4.2. meshes.\n7. Shaped:\n7.1 all meshes\n7.2 all points\n7.3 all bars\n7.4 combinations of above to form tapers.\n8. Strengthened:\n8.1 selvedge\n8.2 bordered with stronger netting\n8.3 double twine\n8.4 gathering meshes\n8.5 strengthening ropes.\n9. Secured:\n9.1 double sheet bend\n9.2 sheet bend with overhand knot.\n10. Knots:\n10.1 double sheet bend\n10.2 sheet bend tied horizontally and vertically\n10.3 side knot:\n10.3.1 net maker’s\n10.3.2 half hitches\n10.4 rolling hitch or hanging knots\n10.5 baiting\n10.6 joining (fisherman’s) knot\n10.7 sewn with meshes horizontal\n10.8 sewn with meshes vertical.\n11. Netting:\n11.1 regular meshes of netting\n11.2 meshes running through a join in two panels\n11.3 meshes along the side of a panel:\n11.3.1 all bar taper decreasing along a hung edge\n11.3.2 all bar taper increasing along a hung edge\n11.3.3 combinations of points, meshes and bars to\nform a taper.\n\n--- PDF PAGE 73 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n71\n12. Joined:\n12.1 mesh to mesh\n12.2 point to point\n12.3 paper to taper\n12.4 gathering meshes together.\n13. Lacing:\n13.1. emporary mending\n13.2. in seine netting\n13.3. two panels together\n13.4. including strengthening ropes.\n\n--- PDF PAGE 74 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n72\n\nEVIDENCE GUIDE\n1. Critical Aspects of\nCompetency\nAssessment requires evidences that the candidate:\n1.1 repaired various types of damage that occurs to\nthe netting material used for fish or prawn trawls,\npurse seines, beach seines or gill nets\n1.2 mended damage to hung areas of netting\n1.3 repaired large scale damage to netting material by\nsewing in patches and panels\n1.4 mended rips in netting.\nAssessment must confirm knowledge of:\n1.5 how a gear plan describes a net.\n2. Underpinning\nKnowledge and Attitudes\nThe essential knowledge and understanding a person\nneeds to perform work to the required standard\ninclude:\n2.1 factors which contribute to an efficient, fast and\nsafe net mending job\n2.2 naming, identifying and understanding different\nnetting terms\n2.3 order in which knots are tied to form netting\nmaterial\n2.4 recognizing polyethylene and polyamide netting\n2.5 measuring different types of netting\n2.6 using a taper table to design netting panels of a\nrequired depth, width or taper\n2.7 how a gear plan describes a net.\n3. Underpinning Skills\nThe essential skills a person needs to perform work to\nthe required standards include:\n1.2 using the net mending tools listed in the range of\nvariables\n1.3 preparing repair jobs by establishing start and end\npoints and either meshes or points in between\n1.4 cutting tapers into netting material\n1.5 strengthening netting material\n1.6 mending rips and holes by sewing twine and knots\nlisted\n1.7 repairing large scale damage to netting material\nby sewing in patches and panels\n1.8 mending damage to hung areas of netting\n1.9 joining panels of netting of different sized meshes.\nLiteracy skills used for:\n1.10 reading tables describing the effect of tapers\non panel shape\n1.11 interpreting the abbreviations on a gear plan.\n\n--- PDF PAGE 75 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n73\nNumeracy skills used for:\n3.11. counting the ply of twine\n3.12. measuring the diameter of twine\n3.13. counting meshes\n3.14. calculating joining ratios.\n4. Resource Implication\n\nResources may include:\n4.1 different types of netting requiring repair\n4.2 fully operational net repair area.\n5. Methods of\nAssessment\nCompetency should be assessed:\n5.1 through direct observation / demonstration\n5.2 portfolio\n6. Context of\nAssessment\n6.1Assessment should be in a workplace.\n6.2 Demonstration of competency over time and on a\nnumber of occasions.\n\n--- PDF PAGE 76 ---\n___________________________________________________________\nTR- Fish Capture NC I\n\n74"
