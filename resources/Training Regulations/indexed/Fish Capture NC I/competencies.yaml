        "evidence_guide": {
          "source_text": "1. Critical aspects of \nCompetency \n \nAssessment requires evidences that the candidate : \n1.1.identified  load characteristics, dangerous or \nhazardous goods, loading equipment and \nrelated practices and take appropriate action \n1.2. identified class and subsidiary risk labels for \ndangerous goods and take appropriate action \n1.3. followed applicable codes  \n1.4. safely loaded and unloaded goods following \nworkplace procedures \n1.5. distributed and secured load for safe transport \nin accordance with regulations \n1.6. located, interpreted and applied relevant \ninformation \n1.7. provided customer/client service and work \neffectively with others \n1.8. conveyed information in written and oral form \nwhen loading/unloading \n1.9. maintained workplace loading/unloading \nrecords \n1.10.selected and used appropriate workplace \ncolloquial and technical language and \ncommunication technologies in the workplace \ncontext \n2. Underpinning \nKnowledge and \nAttitudes \nKnowledge of: \n2.1. Loading regulations \n2.2. Philippine and international regulations and \ncodes of practice for the handling and transport of \ndangerous goods and hazardous substances \n2.3.  OHS and procedures and guidelines concerning \nthe lifting and movement of loads \n2.4.  Risks when loading and unloading goods/cargo \nand related precautions to control the risk \n2.5.  Workplace procedures and policies for the \nloading and unloading of goods/cargo \n2.6. Housekeeping standards procedures required in \nthe workplace \n2.7.  Methods of securing a load \n2.8.   Site layout and obstacles \n2.9.   Ability to identify and correctly use equipment \nrequired to load and unload goods/cargo \n2.10    Ability to modify activities depending on \ndiffering  workplace contexts, risk situations \nand environments \n2.11.   Ability to read and comprehend simple \nstatements\n\n--- PDF PAGE 69 ---\n___________________________________________________________ \nTR- Fish Capture NC I \n  \n67\n2.12   Ability to identify containers and goods coding, \nmarkings and, where applicable, emergency \ninformation panels and take appropriate action \n2.13.  Ability to estimate the size shape and special \nrequirements of loads and take appropriate \naction \n2.14.  Ability to safely use manual handling \ntechniques and to operate manually-operated \nload shifting equipment \n3. Underpinning Skills \n3.1. \nPlanning and organizing work (time \nmanagement) \n3.2. \nWorking with others and in teams \n4. Resource Implication \nThe following resources should be provided: \n4.1. \nWorkplace location and access to workplace \npolicies  \n4.2. \nMaterials relevant to the proposed activity and \ntasks    \n5 Methods of Assessment \nCompetency should be assessed: \n5.1. Through direct observation / demonstration \n5.2.  Portfolio \n6. Context of Assessment \nAssessment must occur in a real or simulated \nworkplace where the assessee has access to: \n6.1. \nparticipate in a range of exercises, case studies \nand other real and simulated practical and \nknowledge assessments that demonstrate the \nskills and knowledge to load and unload \ngoods/cargo, and/or \n6.2. \nload and unload goods/cargo in an appropriate \nrange of operational situations",
