sing different anchoring and mooring winches: 3.7.1. tension winches operated in manual or self- tensioning modes 3.7.2. stand-alone winches 3.7.3. windlasses and capstans with drum ends 3.8. Using power-operated equipment: 3.8.1. cranes and derricks 3.8.2. capstans 3.8.3. winches associated with fishing 3.9. Securing equipment and objects for sea passage, transit in port or ready for use, including: 3.9.1. containers 3.9.2. machinery spares 3.9.3. large pieces of vessel equipment such as gangways, spare fishing gear and anchors 3.9.4. cargo 3.9.5. galley utensils and stores 3.9.6. personal items 3.9.7. drawers and cupboard doors in accommodation and storage spaces --- PDF PAGE 62 --- ___________________________________________________________ TR- Fish Capture NC I 60 3.10. Using securing arrangements such as: 3.10.1. lashing 3.10.2. impounding 3.10.3. patent securing arrangements 3.10.4. checking cargo condition such as catch temperature. 3.11 Literacy skills used for: 3.12 reading safety rules and regulations. 3.13 Numeracy skills used for: 3.13 reading levels of tanks and void spaces 3.14 reading temperature-monitoring devices 3.15 estimating safe working loads of ropes and wires"
