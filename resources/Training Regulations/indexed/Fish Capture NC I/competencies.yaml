        "source_title": "APPLY DECKHAND SKILLS ABOARD A FISHING VESSEL",
        "source_text": "--- PDF PAGE 53 ---\n___________________________________________________________ \nTR- Fish Capture NC I \n  \n51\n \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY: \nAPPLY DECKHAND SKILLS ABOARD A FISHING \nVESSEL \nUNIT CODE: \nAGR642301 \nUNIT DESCRIPTOR : \nThis unit covers the skills and knowledge required to \ncarry out basic deckhand duties aboard a fishing vessel \nincluding rope work, assisting in anchoring, mooring, \noperating winches and windlasses and preparing a \nfishing vessel for sea. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Use and maintain \nropes and perform \nbasic knots, bends, \nhitches, splices and \ncommon whipping \n1.1 \nOperations are carried out according to \nestablished safety rules and regulations. \n1.2 \nRope materials, methods of construction, \nmeasurement methods, physical characteristics \nand common areas of use are correctly identified. \n1.3 \nRopes are checked for wear, maintained in \naccordance with enterprise procedures and \nmanufacturers’ guidelines, and coiled and stowed \ncorrectly. \n1.4 \nKnots, bends and hitches are tied neatly and \nsecurely and are used according to their correct \napplication. \n1.5 \nRopes are spliced neatly and securely according \nto their correct application and rope ends are \nwhipped, where appropriate, to maintain good \ncondition.\n2. Operate winches, \ncapstans and \nwindlasses \n2.1 \nOperations are carried out according to \nestablished safety rules and regulations. \n2.2 \nWinches, capstans and windlasses are selected, \nas appropriate, checked and prepared for the \noperation prior to use. \n2.3 \nWinches, capstans and windlasses are safely \noperated to carry out fishing vessel deck \noperations in accordance with operational \nrequirements and manufacturers’ instructions, \nwhere appropriate.\n3. Secure the vessel at \nanchor \n3.1 \nSecuring of the vessel is carried out according to \nestablished safety rules and regulations. \n3.2 \nPreparation of the anchor and equipment prior to \nletting go is appropriate to the depth of water, \nweather and sea conditions, and tidal range in \narea of operation.\n\n--- PDF PAGE 54 ---\n___________________________________________________________ \nTR- Fish Capture NC I \n  \n52\n3.3 \nQuantity of anchor cable run out or recovered \ncomplies with orders provided. \n3.4  Control of the cable is maintained within safe \noperating limits during normal operation. \n3.5 \nDegree to which the anchor and equipment is \nsecured on completion of anchoring operations is \nappropriate to forecast conditions and complies \nwith orders provided. \n3.6 \nManufacturers’ recommendations and anchoring \nrequirements are followed during anchor winch \noperations. \n3.7 \nAnchoring area is kept free of loose ropes, wires \nand debris throughout all operations.\n4. Secure and adjust \nthe vessel’s position \nduring mooring \noperations \n4.1 \nMooring of the vessel is carried out according to \nestablished safety rules and regulations. \n4.2 \nMooring lines and associated equipment are \nhandled safely and efficiently at all times. \n4.3 \nMooring area is kept free of loose ropes, wires \nand debris throughout all operations. \n4.4 \nTension on mooring lines is maintained at a level \nappropriate to the stage and nature of the \noperation when warping the vessel or maintaining \nposition. \n4.5 \nReports of incidents made to supervisory \npersonnel are complete and at a time designed to \nmaximize the mooring security of the vessel. \n4.6 \nMooring lines are secured in accordance with \norders provided, forecast tidal conditions and \nplanned vessel operations. \n4.7 \nEquipment malfunction or problems during \noperations are promptly recognized and \nappropriate corrective action is taken. \n4.8\nCommunication is clear and concise at all times.\n5. Monitor the situation \nof the vessel when \nmoored or anchored \n5.1 \nMonitoring operations are planned and carried \nout in accordance with established safety rules \nand regulations. \n5.2 \nFrequency, timing and coverage of scheduled \nchecks and inspections comply with watch-\nkeeping instructions. \n5.3 \nAction taken in the event of irregularities or \nabnormal conditions is appropriate to their \nsignificance and within the job holder’s \nresponsibility to implement. \n5.4 \nReports of incidents made to supervisory \npersonnel are complete and at a time designed to \nmaximize the safety and integrity of the vessel. \n5.5 \nRestrictions on access to the vessel by visitors are \nin accordance with watch-keeping instructions.\n\n--- PDF PAGE 55 ---\n___________________________________________________________ \nTR- Fish Capture NC I \n  \n53\n6. Secure the vessel \nfor and at sea \n6.1 \nChecks on vessel security are planned and carried \nout in accordance with established safety and \nsecurity rules and regulations. \n6.2 \nCoverage and frequency of checks and \ninspections on the vessel’s seaworthiness comply \nwith orders received. \n6.3 \nWatertight integrity is checked and appropriate \naction is taken to prepare for prevailing and \nforecast weather and sea conditions. \n6.4 \nDegree to which the vessel is secured is \nappropriate to prevailing and forecast conditions \nand complies with orders received. \n6.5 \nAction taken in the event of irregularities is \nappropriate to their significance and within the job \nholder’s responsibility to implement. \n6.6 \nReports of conditions made to supervisory \npersonnel are complete, accurate and completed \nin accordance with enterprise procedures and \nregulatory requirements. \n6.7 \nReports to supervisory personnel on irregularities \nbeyond the job holder’s ability to rectify are made \nin time to enable remedial action to be taken.\n\n--- PDF PAGE 56 ---\n___________________________________________________________ \nTR- Fish Capture NC I \n  \n54\n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1 Operations: \n1.1. \nmanual handling of equipment \n1.2. \ncommunications and signalling \n1.3. \nrope work \n1.4. \nat sea and ashore \n1.5. \nvarying weather conditions \n1.6. \nthree, four or eight-strand rope \n1.7. \nwire rope \n1.8. \npowered winch, capstan and windlass \n1.9. \nhydraulic, electric and mechanical \n1.10. cable and rope winches \n1.11. net haulers \n1.12. pot or trap haulers \n1.13. anchor winches \n1.14. anchoring: \n1.14.1 routine \n1.14.2 emergency \n1.14.3 letting go and recovery \n1.15. mooring: \n1.15.1 mooring and unmooring to a single point \n1.15.2 berthing and unberthing to a wharf \n1.15.3 adjustment from both fore and aft \nmooring positions \n1.15.4 rigging and recovering means of access \nto the vessel \n1.16.monitoring: \n1.16.1 routine fire and security rounds and \ninspections \n1.16.2 display of signals, flags, lights and \nshapes \n1.16.3 mooring integrity during tidal movements \n1.16.4 safe access to and about the vessel \n1.16.5 visitors to the vessel \n1.16.6 environmental impact \n1.16.7 departure \n1.17. securing: \n1.17.1 prior to departure \n1.17.2 long or short voyages \n1.17.3 completion of operations and \nmaintenance \n1.17.4 heavy weather \n1.17.5 routine situations.\n\n--- PDF PAGE 57 ---\n___________________________________________________________ \nTR- Fish Capture NC I \n  \n55\n2 Safety rules and \nregulations: \n2.1. codes of safe work practice: \n2.2 industry \n2.3 enterprise \n2.4 International Labour Organization (ILO) \n2.5 Dept. of Labor and Employment (DOLE) \n2.6 legislation. \n3 Mooring: \n3. 1.   single point \n3.2. berthed alongside a wharf. \n4 Corrective action: \n4.1. \nadjustment \n4.2. \ntemporary line repair \n4.3. \ncommunication. \n5. Carried out: \n5.1. \nby day \n5.2. \nby night \n5.3. \nadverse weather conditions. \n6. Irregularities or \nabnormal conditions: \n6.1. \naffecting the safety and integrity of: \n6.2. \nvessel \n6.3. \ncrew \n6.4. \nequipment \n6.5. \nmaterials, such as cargo. \n7. Coverage: \n7.1. \naccommodation spaces \n7.2. \npersonal facilities \n7.3. \ngalley \n7.4. \ndeck area \n7.5. \nstorage / cargo spaces \n7.6. \nengine room \n7.7. \nwheelhouse \n7.8. \nprocessing area. \n8. Secured: \n8.1. \nopenings \n8.2. \nanchors \n8.3. \nlifting appliances and associated equipment \n8.4. \ngalley, stores and equipment \n8.5. \naccommodation and storage / cargo spaces \n8.6. \nmaterial on deck and below, such as cargo \n8.7. \nlarge objects likely to move in a sea way \n8.8. \nslack tanks pressed up.\n\n--- PDF PAGE 58 ---\n___________________________________________________________ \nTR- Fish Capture NC I \n  \n56\n \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate : \n1.1. \nused, maintained and repaired ropes and \nlines \n1.2. \nperformed knots, bends, hitches, splicing \nand whipping \n1.3. \nprepared winches and capstans associated \nwith fishing, for use and control during \noperation \n1.4. \nprepared anchor equipment, for use and \ncontrol during operation \n1.5. \nsecured anchoring equipment, winches and \ncapstans on completion of operations \n1.6. \nperformed mooring operations to completion \n1.7. \nsecured mooring area on completion of \noperations \n1.8. \nidentified malfunction or possible problems \nand implement contingency plans \n1.9. \nperformed routine checks and inspections of \nvessel: \n1.19.1 \nwatch-keeping duties \n1.19.2 \nsecurity \n1.19.3 \nseaworthiness \n1.10. secured the vessel \n1.11. dealt with security contingencies \n1.12. reported on conditions \n1.13. monitored and controlled access. \n \nAssessment must confirm knowledge of: \n1.14. safety rules and regulations during operation \nprocedures for entering dangerous and      \nenclosed spaces.\n\n--- PDF PAGE 59 ---\n___________________________________________________________ \nTR- Fish Capture NC I \n  \n57\n2. Underpinning \nKnowledge and \nAttitudes \nThe essential knowledge and understanding a person \nneeds to perform work to the required standard \ninclude: \n2.1 Procedures relating to: \n2.1.1 splicing rope and tying common knots, bends \nand hitches \n2.1.2 maintenance of different types of rope \n2.1.3 routine and emergency operation of anchors \n2.1.4 use of winches, capstans and windlasses \n2.1.5 preparing deck machinery for use in ambient \nconditions \n2.1.6 securing all areas and equipment for sea prior \nto departure \n2.1.7 effect of the rise and fall of tide when berthed \n2.1.8 warping a vessel to various configurations at a \nwharf \n2.1.9 maintaining a deck watch in port \n2.1.10 displaying signals, flags, lights and shapes \n2.1.11 operating powered equipment in all modes, \nincluding emergency operation \n2.1.12 checking and inspecting the seaworthiness of \nthe vessel \n \n2.2       Principles relating to: \n2.2.1 the correct application of common knots, bends \nand hitches \n2.2.2 how a vessel is made fast to the wharf \n2.2.3 how vessel displacement or profile, and \nprevailing wind or current affect anchoring \noperations \n2.2.4 how a vessel normally lies to an anchor and \ncable \n2.2.5 mooring systems, including the specific \nfunctions of the mooring leads \n2.2.6 effects of unequal tension on mooring lines and \nthe use of fixed mooring lines \n2.3       information relating to: \n2.3.1 codes of safe work practice and safety rules \nand regulation \n2.3.2 different configurations of mooring lines for \nvarious parts of a vessel \n2.3.3 knots, bends and hitches and their applications \n2.3.4 anchor cable markings \n2.3.5 different types of anchor \n2.3.6 anchor, cable and equipment on a specific \nvessel\n\n--- PDF PAGE 60 ---\n___________________________________________________________ \nTR- Fish Capture NC I \n  \n58\n \n2.3.7 characteristics of different types of mooring  \n2.3.8 ropes \n2.3.9 hazards that could occur if the operation is not \ncontrolled properly \n2.3.10 indications of, and hazards associated with, \nbreaking mooring lines \n2.3.11 requirements for access equipment \n2.3.12 means of access \n2.3.13 securing the vessel for sea \n2.3.14 appropriate health and hygiene practices \n2.3.15 status of safety equipment \n2.3.16 construction of the vessel sufficient to \nunderstand which areas need to be made \nwatertight \n2.3.17 the method of operation of cargo-lifting and \nsecuring equipment on how to make the vessel \nwatertight.\n3 Underpinning Skills \nThe essential skills a person needs to perform work to \nthe required standard include: \n3.1. \nhandling ropes and wires: \n3.1.1. identifying different rope material and \nconstruction \n3.1.2. using knots, bends and hitches and securing \narrangements \n3.1.3. preparing and throwing a heaving line \n3.1.4. tying an overhand knot, figure-eight knot, reef \nknot, bowline and cod-end knot \n3.1.5. tying a half hitch, clove hitch, round turn and \ntwo half hitches, rolling hitch and timber hitch \n3.1.6. tying a sheet bend and a double-sheet bend \n3.1.7. performing an eye splice, back splice and a \nshort splice \n3.1.8. performing common whipping on ropes and line \n3.1.9. coiling and stowing ropes \n3.1.10. \nusing stoppers \n \n3.2. \nLetting go and weighing anchor: \n3.2.1. single and twin anchor (such as running moor) \noperations \n3.2.2. recovering a foul hawse \n3.2.3. removing debris from an anchor \n3.2.4. handling anchor-securing arrangements \n3.2.5. displaying signals \n3.2.6. preparing an anchor buoy \n3.2.7. communicating with controller \n \n3.3. \nUsing and identifying synthetic rope and wire \nmooring lines: \n3.3.1. fore and aft springs\n\n--- PDF PAGE 61 ---\n___________________________________________________________ \nTR- Fish Capture NC I \n  \n59\n3.3.2. back springs \n3.3.3. bow and stern ropes \n \n3.4. \nBreast lines \n3.5. \nAssisting in different types of mooring \noperations: \n3.5.1. making fast and letting go fore and aft to a \nwharf \n3.5.2. making fast and letting go to a single-point \nmooring \n3.5.3. preparing area for operation \n3.5.4. using springs that manoeuvre a vessel to and \nfrom a wharf \n3.5.5. adjusting mooring during a port stay \n3.5.6. rigging safe access to a vessel \n \n3.6. \nTaking contingency actions when encountering \na malfunction or problem caused by: \n3.6.1. failure of moorings and equipment \n3.6.2. damage to moorings \n3.6.3. insufficient mooring length or strength \n3.6.4. poor leads \n3.6.5. inability to maintain vessel in position \n3.6.6. adverse weather \n3.6.7. cargo or cargo-securing arrangements \n \n3.7. \nUsing different anchoring and mooring winches:\n3.7.1. tension winches operated in manual or self-\ntensioning modes \n3.7.2. stand-alone winches  \n3.7.3. windlasses and capstans with drum ends \n \n3.8. \nUsing power-operated equipment: \n3.8.1. cranes and derricks \n3.8.2. capstans \n3.8.3. winches associated with fishing \n \n3.9. \nSecuring equipment and objects for sea \npassage, transit in port or ready for use, \nincluding: \n3.9.1. containers \n3.9.2. machinery spares \n3.9.3. large pieces of vessel equipment such as \ngangways, spare fishing gear and anchors \n3.9.4. cargo \n3.9.5. galley utensils and stores \n3.9.6. personal items \n3.9.7. drawers and cupboard doors in accommodation \nand storage spaces\n\n--- PDF PAGE 62 ---\n___________________________________________________________ \nTR- Fish Capture NC I \n  \n60\n \n3.10. Using securing arrangements such as: \n3.10.1. lashing \n3.10.2. impounding \n3.10.3. patent securing arrangements \n3.10.4. checking cargo condition such as catch \ntemperature. \n3.11   Literacy skills used for: \n3.12   reading safety rules and regulations. \n3.13   Numeracy skills used for: \n3.13   reading levels of tanks and void spaces \n3.14   reading temperature-monitoring devices \n3.15   estimating safe working loads of ropes and \nwires. \n4.  Resource Implication \n \nResources may include: \n4.1  operational vessel with the range of equipment \ndescribed above \n4.2  facilities for negotiating buoyage systems and \ntraffic. \n5.  Methods of \nAssessment \nCompetency should be assessed: \n5.1. \nthrough direct observation / demonstration \n5.2. \nportfolio \n6.  Context of \nAssessment \n6.1  Assessment should be in a workplace. \n6.2  Demonstration of competency over time and on a \nnumber of occasions.\n",
