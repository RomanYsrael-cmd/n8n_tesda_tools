        "source_text": "--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 14 \n \nUNIT OF COMPETENCY : \nPRACTICE HOUSEKEEPING PROCEDURES  \n \nUNIT CODE \n: \n500311104 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required in \napplying the basic housekeeping procedures. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Sort and \nremove \nunnecessary \nitems  \n1.1 Reusable, recyclable \nmaterials are sorted \nin accordance with \ncompany/office \nprocedures \n1.2 Unnecessary items \nare removed and \ndisposed of in \naccordance with \ncompany or office \nprocedures \n1.1 Principles of 5S \n1.2 Work process and \nprocedures \n1.3 Safety signs and \nsymbols \n1.4 General OSH \nprinciples and \nlegislation \n1.5 Environmental \nrequirements \nrelative to work \nsafety \n1.1 Basic \ncommunication \nskills \n1.2 Interpersonal  \nskills \n1.3 Reading skills \nrequired to \ninterpret \ninstructions \n \n2. Arrange items  1.4  Items are arranged in \naccordance with \ncompany/office \nhousekeeping \nprocedures \n1.5 Work area is \narranged according to \njob requirements \n1.6 Activities are \nprioritized based on \ninstructions. \n1.7 Items are provided \nwith clear and visible \nidentification marks  \nbased on procedure \n1.8 Safety equipment and \nevacuation passages \nare kept clear and \naccessible based on \ninstructions \n2.1 Principles of 5S \n2.2 Work process and \nprocedures \n2.3 Safety signs and \nsymbols \n2.4 General OSH \nprinciples and \nlegislation \n2.5 Environmental \nrequirements \nrelative to work \nsafety \n \n2.1  Basic \ncommunication \nskills \n2.2  Interpersonal \nskills \n2.3  Reading skills \nrequired to \ninterpret \ninstructions\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 15 \n \n3. Maintain work \narea, tools  \nand equipment \n3.1 Cleanliness and \norderliness of work \narea is maintained in \naccordance with \ncompany/office \nprocedures \n3.2 Tools and equipment \nare cleaned in \naccordance with \nmanufacturer’s \ninstructions/manual \n3.3 Minor repairs are \nperformed on tools \nand equipment in \naccordance with \nmanufacturer’s \ninstruction/manual \n3.4 Defective tools and \nequipment are \nreported to \nimmediate supervisor \n \n3.1 Principles of 5S \n3.2 Work process and \nprocedures \n3.3 Safety signs and \nsymbols \n3.4 General OSH \nprinciples and \nlegislation \n3.5 Environmental \nrequirements \nrelative to work \nsafety \n \n3.1 Basic \ncommunication \nskills \n3.2 Interpersonal \nskills \n3.3 Reading skills \nrequired to \ninterpret \ninstructions \n \n \n4. Follow \nstandardized \nwork process \nand \nprocedures  \n4.1 Materials for common \nuse are maintained in \ndesignated area \nbased on procedures \n4.2 Work is performed \naccording to standard \nwork procedures \n4.3 Abnormal incidents \nare reported to \nimmediate supervisor \n4.1 Principles of 5S \n4.2 Work process and \nprocedures \n4.3 Safety signs and \nsymbols \n4.4 General OSH \nprinciples and \nlegislation \n4.5 Environmental \nrequirements \nrelative to work \nsafety \n4.6 Accident/Hazard \nreporting \nprocedures  \n \n4.1 Basic \ncommunication \nskills \n4.2 Interpersonal \nskills \n4.3 Reading skills \nrequired to \ninterpret \ninstructions \n4.4 Reporting/recordi\nng accidents and \npotential hazards \n \n \n5. Perform work \nspontaneously \n5.1 Work is performed as \nper instruction \n5.2 Company and office \ndecorum are \nfollowed and \ncomplied with \n5.3 Work is performed in \naccordance with \nOccupational Safety \nand Health \nStandards (OSHS)  \n5.1 Principles of 5S \n5.2 Work process and \nprocedures \n5.3 Safety signs and \nsymbols \n5.4 General OSH \nprinciples and \nlegislation \n5.5 Environmental \nrequirements \nrelative to work \nsafety \n5.6 Accident/Hazard \nreporting \nprocedures  \n \n5.1. Basic \ncommunication \nskills \n5.2. Interpersonal \nskills \n5.3. Reading skills \nrequired to \ninterpret \ninstructions \n5.4. Reporting/ \nrecording \naccidents and \npotential hazards\n\n--- PDF PAGE 19 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 16 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Unnecessary items \nMay include: \n1.1 Non-recyclable materials \n1.2 Unserviceable tools and equipment \n1.3 Pictures, posters and other materials not related to work activity \n1.4 Waste materials \n \n2.  Identification marks\n2.1 Labels \n2.2 Tags \n2.3 Color coding \n \n3.  Decorum \n \n3.1 Company/ office rules and regulations  \n3.2 Company/ office uniform \n3.3 Behavior    \n \n4. Minor repair \nMay include: \n4.1 Replacement of parts \n4.2 Application of lubricants \n4.3 Sharpening of tools \n4.4 Tightening of nuts, bolts and screws \n \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \nCompetency \n \nAssessment requires evidence that the candidate: \n1.1 Practiced the basic procedures of 5S \n \n \n2. Resource \nImplications \nThe following resources should be provided: \n2.1 Facilities, materials tools and equipment necessary for the activity \n \n3. Methods of \nAssessment \nCompetency in this unit may  be assessed through: \n3.1 Third party report \n3.2 Interview \n3.3 Demonstration with questioning \n \n4. Context for \nAssessment \n4.1 Competency may be assessed in the work place or in a simulated    \nwork place setting\n",
