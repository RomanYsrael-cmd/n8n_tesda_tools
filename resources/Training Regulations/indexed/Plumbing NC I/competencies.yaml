        "source_text": "CON712347\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in the\ninstallation/assembling of a single plumbing unit.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare for\nplumbing\nworks\n1.1 Work\ninstructions/plans are\nread and interpreted\nin accordance with\nthe job requirements\n1.2 Materials, tools and\nequipment are\nselected and\nprepared according\nto job requirements\n1.3 Appropriate PPE are\nselected according to\njob requirements\n\n1.1 Blue print\nreading\n1.2 Materials\nspecification\n1.3 Types and uses\nof plumbing\ntools and\nequipment\n1.4 Materials take-\noff\n1.5 DOLE\nDepartment\nOrder No. 13 s.\n1998 (Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry)\n1.1 Interpreting plan\nand details\n1.2 Handling of\nmaterials, tools\nand equipment\n1.3 Communication\n(written and\nverbal)\n2. Install pipes\nand fittings\n2.1 Pipes and fittings\nare installed with a\nstandard slope in\naccordance with\nRevised National\nPlumbing Code of the\nPhilippines (RNPCP)\nand venting\nrequirements and\nprocedures\n2.2 Drainage/sewer/vent\npiping system are\naligned with water\nsupply and provided\nwith clean-outs in the\nrequired locations\nprescribed in the\napproved work plan\n2.1 Linear\nmeasurement\n2.2 Blue print\nreading\n2.3 Materials\nspecification\n2.4 Methods and\ntechniques in\nvarious type of\npipe\nconnections\n2.5 Plumbing codes\n2.6 Types and uses\nof plumbing\ntools and\nequipment\n2.7 Materials take-\noff\n2.8 Environmental-\nconservation\nprocedures, e.g.\n3R (reduce,\nreuse, recycle)\n2.1 Interpreting plans\nand details\n2.2 Handling of\nmaterials, tools\nand equipment\n2.3 Communication\n(written and\nverbal)\n2.4 Applying methods\nand techniques in\nvarious type of\npipe connections\n2.5 Cutting and\nthreading pipes\n2.6 Applying linear\nmeasurement\n\n--- PDF PAGE