        "source_text": "--- PDF PAGE 24 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 21 \n \nUNIT OF COMPETENCY : \nPERFORM MENSURATION AND CALCULATIONS \n \nUNIT CODE \n: \nCON311203 \n \nUNIT DESCRIPTOR  \n:  This unit covers the knowledge, skills and attitudes on \nidentifying and measuring objects based on the required \nperformance standards. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variable\n \nREQUIRED \nKNOWLEDGE  \n \nREQUIRED \nSKILLS \n1. Select \nmeasuring \ninstruments \n \n \n1.1 Object or component \nto be measured is  \nidentified, classified \nand interpreted \naccording to the \nappropriate regular \ngeometric shape  \n1.2 Measuring tools are \nselected/identified as \nper object to be \nmeasured or job \nrequirements \n1.3 Correct specifications \nare obtained from \nrelevant sources \n1.4 Appropriate \nmeasuring \ninstruments are \nselected according to \njob requirements  \n1.5 Alternative measuring \ntools are used without \nsacrificing cost and \nquality of work \n \n1.1 Types of measuring \ntools and its uses \n \n1.1 Selecting \nmeasuring \ninstruments\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 22 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated \nin the Range of Variable \n \nREQUIRED \nKNOWLEDGE  \n \nREQUIRED \nSKILLS \n2. Carry out \nmeasurements \nand calculations \n \n \n2.1 Accurate \nmeasurements are \nobtained according \nto job requirements \n2.2 Alternative \nmeasuring tools are \nused without \nsacrificing cost and \nquality of work \n2.3 Calculation needed \nto complete work \ntasks are performed \nusing the four basic \nprocess of addition \n(+), subtraction (-), \nmultiplication (x) and \ndivision (/)  \n2.4 Calculations \ninvolving fractions, \npercentages and \nmixed numbers are \nused to complete \nworkplace tasks \n2.5 Numerical \ncomputation is self-\nchecked and \ncorrected for \naccuracy \n2.6 Instruments are read \nto the limit of \naccuracy of the tool \n2.7 Systems of \nmeasurement \nidentified and \nconverted according \nto job requirements/ \nISO \n2.8 Workpieces are \nmeasured according \nto job requirements \n \n2.1 Measurements  \n Linear \nmeasurement \n Geometrical \nmeasurement \n2.2 Trade Mathematics \n Unit conversion \n Ratio and \nproportion \n Area \n \n \n2.1 Interpreting \nformulas for \nvolume, areas, \nperimeters of \nplane and \ngeometric figures \n2.2  Handling of \nmeasuring \ninstruments\n\n--- PDF PAGE 26 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 23 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Geometric shape \n \n \n \n \n \n May include: \n1.1 \nRound \n1.2 \nSquare \n1.3 \nRectangular \n1.4 \nTriangle \n1.5 \nSphere \n1.6 \nConical\n2. Measuring \ninstruments \nMay include: \n2.1 \nMicrometer (In-out, depth) \n2.2 \nVernier caliper (out, inside) \n2.3 \nDial gauge with mag, std. \n2.4 \nStraight edge \n2.5 \nThickness gauge \n2.6 \nTorque gauge \n2.7 \nSmall hole gauge \n2.8 \nTelescopic gauge \n2.9 \nTry-square \n2.10 Protractor \n2.11 Combination gauge \n2.12 Steel rule \n2.13 Voltmeter \n2.14 Ammeter \n2.15 Mega ohmmeter \n2.16 Kilowatt hour meter \n2.17 Gauges \n2.18 Thermometers \n3. Measurements \nand calculations \n \nMay include: \n3.1 \nLinear \n3.2 \nVolume \n3.3 \nArea \n3.4 \nWattage \n3.5 \nVoltage \n3.6 \nResistance \n3.7 \nAmperage \n3.8 \nFrequency \n3.9 \nImpedance \n3.10 Conductance \n3.11 Capacitance \n3.12 Displacement \n3.13 Inside diameter \n3.14 Circumference \n3.15 Length \n3.16 Thickness \n3.17 Outside diameter  \n3.18 Taper \n3.19 Out of roundness \n3.20 Oil clearance \n3.21 End play/Thrust clearance\n\n--- PDF PAGE 27 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 24 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires that the candidate: \n1.1 Selected and prepared appropriate measuring instruments in \naccordance with job requirements \n1.2 Performed measurements and calculations according to job \nrequirements/ ISO \n \n2. Resource implications \nThe following resources should be provided: \n2.1 Workplace location \n2.2 Problems to solve \n2.3 Measuring instrument appropriate to carry out tasks \n2.4 Instructional materials relevant to the propose activity \n \nAssessment of underpinning knowledge and practical skills may be \ncombined \n \n4. Methods of assessment \nCompetency should be assessed through: \n3.1 Actual demonstration \n3.2 Direct observation \n3.3 Written test/questioning related to underpinning knowledge \n \n5. Context of assessment \n4.1 Competency assessment may occur in workplace or any    \nappropriate simulated environment \n4.2 Assessment shall be observed while task are being \nundertaken whether individually or in group \n4.3 Competency assessment must be undertaken in accordance \nwith the TESDA assessment guidelines\n",
