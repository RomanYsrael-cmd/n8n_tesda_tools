\naccording to job\nrequirements.\n2.5 Appropriate Personal\nProtective Equipment\n(PPE) is used\naccording to safety\nstandards.\n2.6 Pipe stub-out /\nroughing-in plumbness\nand alignment are\nchecked prior to\nconcrete pouring.\n2.7 Housekeeping is\nperformed according\nto Occupational\nSafety and Health\nStandards (OSHS)\n2.6 Piping system\n2.7 Plumbing\nterminologies\n2.8 Use of tools and\nmaintenance\n2.9 Plumbing codes\n2.10 Plumbing legends\nand symbols\n2.11 Reading and\nidentifying basic\ndrawings and\nplans\n2.12 DOLE\nDepartment Order\nNo. 13 s. 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n\n3\nClean up\nwork area\nand maintain\ntools\n3.1 Reusable Materials\nare collected and\nstored based on\nspecific industry\nstandards.\n3.2 Waste and scrap\nmaterials are\ndisposed following\nenvironmental\nprocedure.\n3.3 Tools are maintained\nin accordance with\nwork place\nprocedures.\n3.1 5S\n3.2 Environmental-\nconservation\nprocedures,\ne.g. 3R (reduce,\nreuse, recycle)\n3.3 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n3.4 Maintenance of\ntools\n3.1 Communication\n(written and\nverbal) skills\n3.2 Handling and\nmaintenance of\ntools\n3.3 Waste disposal\n3.4 Maintaining tools\n\n--- PDF PAGE 35 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 32\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools\nMay include:\n1.1\nHacksaw with blade\n1.2\nTape\n1.3\nBallpeen Hammer\n1.4\nPointed Chisel\n1.5\nPipe Wrench\n1.6\nPipe Cutter\n1.7\nShovel\n1.8\nPipe vise\n1.9\nCrow bar\n1.10 Pipe threader\n1.11 Cement Trowel\n1.12 Hose Level\n1.13 Spirit Level\n1.14 Adjustable Wrench\n1.15 Nylon line\n1.16 Paint Brush\n1.17 Plumb bob\n1.18 Side Cutting Pliers\n1.19 Flat Screw Driver\n1.20 Framing square\n2. Materials\n\nMay include:\n2.1 Rags\n2.2 Sand paper\n2.3 Solvent cement\n2.4 Tie wire / G.I. wire\n2.5 Teflon tape\n