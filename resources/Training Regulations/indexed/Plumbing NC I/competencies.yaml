        "source_text": "CON311203\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes on\nidentifying and measuring objects based on the required\nperformance standards.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variable\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Select\nmeasuring\ninstruments\n\n1.1 Object or component\nto be measured is\nidentified, classified\nand interpreted\naccording to the\nappropriate regular\ngeometric shape\n1.2 Measuring tools are\nselected/identified as\nper object to be\nmeasured or job\nrequirements\n1.3 Correct specifications\nare obtained from\nrelevant sources\n1.4 Appropriate\nmeasuring\ninstruments are\nselected according to\njob requirements\n1.5 Alternative measuring\ntools are used without\nsacrificing cost and\nquality of work\n\n1.1 Types of measuring\ntools and its uses\n\n1.1 Selecting\nmeasuring\ninstruments\n\n--- PDF PAGE 25 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 22\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variable\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n2. Carry out\nmeasurements\nand calculations\n\n2.1 Accurate\nmeasurements are\nobtained according\nto job requirements\n2.2 Alternative\nmeasuring tools are\nused without\nsacrificing cost and\nquality of work\n2.3 Calculation needed\nto complete work\ntasks are performed\nusing the four basic\nprocess of addition\n(+), subtraction (-),\nmultiplication (x) and\ndivision (/)\n2.4 Calculations\ninvolving fractions,\npercentages and\nmixed numbers are\nused to complete\nworkplace tasks\n2.5 Numerical\ncomputation is self-\nchecked and\ncorrected for\naccuracy\n2.6 Instruments are read\nto the limit of\naccuracy of the tool\n2.7 Systems of\nmeasurement\nidentified and\nconverted according\nto job requirements/\nISO\n2.8 Workpieces are\nmeasured according\nto job requirements\n\n2.1 Measurements\n• Linear\nmeasurement\