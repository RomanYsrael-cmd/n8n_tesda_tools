          "source_text": "1. Critical aspects\nof competency\nCompetency assessment requires evidence that the candidate:\n1.1 Read and interpreted work instructions according to job requirements\n1.2 Selected materials in accordance with specifications and job\nrequirements\n1.3 Performed pipe layout\n1.4 Cut pipes through walls and floors\n1.5 Demonstrated compliance with safety regulations applicable to work\nsite operations\n1.6 Accurately set out dimensions and alignment of work\n1.7 Identified faults and problems that occur and made necessary action to\nrectify\n1.8 Communicated interactively with others where applicable to ensure\nsafe and effective work operations\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Tools and equipment appropriate to the job\n2.2 Materials relevant to the proposed activity\n2.3 Drawings and specifications relevant to the task\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1 Direct observation on application of tasks\n3.2 Questions related to required knowledge\n3.3 Demonstration with oral questioning\n3.4 Written examination\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in the workplace or in a simulated\nworkplace setting\n\n--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 43\n\nUNIT OF COMPETENCY :\nINSTALL AND ASSEMBLE SINGLE PLUMBING UNIT\n\nUNIT CODE\n:"
        },
        "source_text": "CON712346\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in\nperforming minor construction work prior to and after the\ninstallation of pipes and fittings.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRE SKILLS\n1. Make piping\nLayouts\n1.1\nWork instructions\nare read and\ninterpreted\naccording to job\nrequirements\n1.2\nMaterials, tools\nand equipment are\nselected according\nto job requirements\n1.3\nLay-outs are made\naccording to\nspecified roughing-in\nmeasurements\n1.4\nWork dimension and\nalignment of work\nare in conformity\nwith\nspecification/plan\n\n1.1\nLinear\nmeasurement\n1.2\nBlue print\nreading\n1.3\nTypes and\nuses of\nplumbing tools\n1.4\nTypes and\nuses of\nplumbing\nmaterials\n1.5\nPlumbing\ncodes\n1.6\nBasic carpentry\nand masonry\nworks\nprocesses\n1.7\nEnvironmental-\nconservation\nprocedures,\ne.g. 3R\n(reduce, reuse,\nrecycle)\n1.8\nDOLE\nDepartment\nOrder No. 13\ns. 1998\nGuidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n1.1 Interpreting plan\nand details\n1.2 Handling\nmaterials, tools\nand equipment\n1.3 Performing basic\ncarpentry\nmasonry\nprocesses\n1.4 Communication\n(written and\nverbal)\n\n--- PDF PAGE 43 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 40\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRE SKILLS\n2. Cut pipes\nthrough walls\nand floors\n2.1 Cutting thru walls is\nperformed without\ncausing unnecessary\ndamage to floors/\nwalls and adjacent\nsystems/installations\n2.2 Correct usage of\ntools is observed\naccording to job\nrequirements\n2.3 Appropriate PPE is\nused according to job\nrequirements\n2.4 Cut walls and floor\nsurface are restored\nto original condition\n\n2.1 Linear\nmeasurement\n2.2 Blue print\nreading\n2.3 Materials\nspecification\n2.4 Types and uses\nof plumbing\ntools\n2.5 Plumbing codes\n2.6 Basic carpentry\nand masonry\nprocesses\n2.7 Environmental-\nconservation\nprocedures, e.g.\n3R (reduce,\nreuse, recycle)\n2.8 DOLE\nDepartment\nOrder No. 13\ns. 1998\n2.9 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n2.1 Interpreting plans\nand details\n2.2 Handling tools\nand materials\n2.3 Performing basic\ncarpentry and\nmasonry works\nprocesses\n2.4 Communication\n(written and\nverbal)\n2.5 Applying linear\nmeasurement\n\n--- PDF PAGE 44 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 41\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay include:\n1.1 Soapstone\n1.2 Marking tools\n1.3 Steel tape\n1.4 Leveling tools\n\n2. Tools and equipment\nMay include:\n2.1\nHammer\n2.2\nCold chisel\n2.3\nSaw\n2.4\nDrill\n2.5\nHacksaw\n2.6\nPush cart\n2.7\nSpirit level\n2.8\nShovel\n2.9\nPointing trowel\n2.10 Push pull rule\n2.11 Concrete cutter\n2.12 Rubber mallet\n\n3. Personal protective\nequipment (PPE)\nMay include:\n3.1\nGloves\n3.2\nHard hat\n3.3\nSafety shoes\n3.4\nGoggles\n3.5\nFace shield\n3.6\nDust mask\n\n--- PDF PAGE 45 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 42\n\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\nCompetency assessment requires evidence that the candidate:\n1.1 Read and interpreted work instructions according to job requirements\n1.2 Selected materials in accordance with specifications and job\nrequirements\n1.3 Performed pipe layout\n1.4 Cut pipes through walls and floors\n1.5 Demonstrated compliance with safety regulations applicable to work\nsite operations\n1.6 Accurately set out dimensions and alignment of work\n1.7 Identified faults and problems that occur and made necessary action to\nrectify\n1.8 Communicated interactively with others where applicable to ensure\nsafe and effective work operations\n\n2. Resource\nImplications\nThe following resource