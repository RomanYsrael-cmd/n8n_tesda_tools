        "source_text": "--- PDF PAGE 46 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 43 \n \nUNIT OF COMPETENCY : \nINSTALL AND ASSEMBLE SINGLE PLUMBING UNIT \n \nUNIT CODE \n: \nCON712347  \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in the \ninstallation/assembling of a single plumbing unit. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Prepare for \nplumbing \nworks \n1.1 Work \ninstructions/plans are \nread and interpreted \nin accordance with \nthe job requirements \n1.2 Materials, tools and \nequipment are \nselected and \nprepared according \nto job requirements \n1.3 Appropriate PPE are \nselected according to \njob  requirements \n \n1.1 Blue print \nreading \n1.2 Materials \nspecification \n1.3 Types and uses \nof plumbing \ntools and \nequipment \n1.4 Materials take-\noff \n1.5 DOLE \nDepartment \nOrder No.  13 s. \n1998 (Guidelines \nGoverning \nOccupational \nSafety and \nHealth in the \nConstruction \nIndustry) \n1.1 Interpreting plan \nand details \n1.2 Handling of \nmaterials, tools \nand equipment \n1.3 Communication \n(written and  \nverbal) \n2. Install pipes \nand fittings \n2.1 Pipes and fittings \nare installed with a \nstandard slope  in \naccordance with \nRevised National \nPlumbing Code of the \nPhilippines (RNPCP) \nand venting \nrequirements and \nprocedures \n2.2 Drainage/sewer/vent \npiping system are \naligned with water \nsupply and provided \nwith clean-outs in the \nrequired locations \nprescribed in the \napproved work plan \n2.1 Linear \nmeasurement  \n2.2 Blue print \nreading \n2.3 Materials \nspecification \n2.4 Methods and \ntechniques in \nvarious type of \npipe \nconnections \n2.5 Plumbing codes \n2.6 Types and uses \nof plumbing \ntools and \nequipment \n2.7 Materials take-\noff \n2.8 Environmental-\nconservation \nprocedures, e.g. \n3R (reduce, \nreuse, recycle) \n2.1 Interpreting plans \nand details \n2.2 Handling of \nmaterials, tools \nand equipment  \n2.3 Communication \n(written and  \nverbal) \n2.4 Applying methods \nand techniques in \nvarious type of \npipe connections \n2.5 Cutting and \nthreading pipes \n2.6 Applying linear \nmeasurement\n\n--- PDF PAGE 47 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 44 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n \n2.3 Approved fittings are \nused in installing \ndrainage/sewer pipes \n2.4 Correct usage of \ntools and equipment \nis observed according \nto manufacturer's \nspecifications \n2.5 Appropriate PPE are \nused in accordance \nwith the job \nrequirements \n2.9 DOLE \nDepartment \nOrder No.13 s. \n1998 Guidelines \nGoverning \nOccupational \nSafety and \nHealth in the \nConstruction \nIndustry \n \n \n3. Install hot- \nand cold- \nwater supply  \n3.1 Correct specifications \nof pipes and joints \nare used in \naccordance with the \njob requirements/ \nspecifications \n3.2 Hot and cold water \nsupply is installed \naccording  to the \napproved working \nplan and materials \nspecifications  \n3.3 Water supply   \nassembled  is leak \nfree/free from \ncontamination and  \naligned with \ndrainage/vent/  waste \npiping system \n3.4 Materials, tools and \nequipment are \nselected in \naccordance to job \nrequirements \n3.1 Linear \nmeasurements \nBlue print \nreading \n3.2 Materials \nspecification \n3.3 Types uses of \nplumbing \nmaterials, tools \nand equipment \n3.4 Materials take-off\n3.5 Methods and \ntechniques in \nvarious type of \npipe connections \n3.6 Plumbing codes \n3.7 Environmental-\nconservation \nprocedures, e.g. \n3R (reduce, \nreuse, recycle) \n3.8 DOLE \nDepartment \nOrder No.  13 s. \n1998 \n3.9 Guidelines \nGoverning \nOccupational \nSafety and \nHealth in the \nConstruction \nIndustry.\n3.1 Interpreting plans \nand details \n3.2 Handling of \nmaterials, tools \nand equipment  \n3.3 Communication \n(written and  \nverbal) \n3.4 Applying methods \nand techniques in \nvarious type of \npipe connections \n3.5 Cutting and \nthreading pipes \n3.6 Applying linear \nmeasurement\n\n--- PDF PAGE 48 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 45 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n4. Install/ \nassemble \nplumbing \nfixtures \n4.1 Plumbing fixtures  \nare installed according  \nto specified rough-in \nmeasurements and/or \nmanufacturer's \ninstruction manual \n4.2 Plumbing fixtures are \nrigidly secured with \nstrict  adherence to \nperpendicularity and \nlevelness \n4.3 All assemblies are in \nconformity with the \nlisted standard \n4.4 Correct usage of tools \nand  equipment is \nobserved in \naccordance with \nmanufacturer's \nspecifications \n4.5 Appropriate PPE are \nused in accordance \nwith the job \nrequirements \n4.6 Work site is cleaned \nand kept in safe state \nand  in accordance \nwith Occupational \nSafety and Health \nStandards (OSHS)  \n \n4.1 \nLinear \nmeasurement  \n4.2 \nBlue print \nreading \n4.3 \nMaterials \nspecification \n4.4 \nTypes and \nuses of \nplumbing tools \nand equipment \n4.5 \nMethods and \ntechniques in \nvarious type of \npipe \nconnections \n4.6 \nPlumbing \ncodes \n4.7 \nPlumbing \nfixtures take-off \n4.8 \nEnvironmental-\nconservation \nprocedures, \ne.g. 3R \n(reduce, reuse, \nrecycle) \n4.9 \nDOLE \nDepartment \nOrder No.  13 \ns. 1998 \n4.10 Guidelines \nGoverning \nOccupational \nSafety and \nHealth in the \nConstruction \nIndustry \n4.1 Interpreting plans \nand details \n4.2 Handling of \nmaterials, tools \nand equipment \n4.3 Communication \n(written and \nverbal)  \n4.4 Applying methods \nand techniques in \nvarious type of \nplumbing fixtures\n\n--- PDF PAGE 49 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 46 \n \nRANGE OF VARIABLES \n   \nVARIABLE \nRANGE \n1. Tools and equipment \nMay include: \n1.1 Pipe threader \n1.2 Monkey wrench \n1.3 Push – pull rule/steel tape \n1.4 Reamer \n1.5 Blow torch \n1.6 Flaring/Swaging tools \n1.7 Pipe cutter/hacksaw \n1.8 Hammer \n1.9 Leveling tools \n1.10 Rubber mallet \n \n2. Personal Protective \nEquipment (PPE) \nMay include: \n2.1 Gloves \n2.2 Hard hat \n2.3 Safety Shoes \n2.4 Face shield \n2.5 Dust mask \n2.6 Goggles \n \n3. Pipes and fittings \nMay include: \n3.1 PVC (DWV) Pipes and fittings series 1000 Sizes: 2” to \n4” \n3.2 PVC Blue Pipes and fittings sizes ½” to 2”  \n3.3 Polybutylene and Polyethylene pipes and fittings \n3.4 G.I. Pipes sched 40 standard \n3.5 Copper Pipes and fittings Type L \n3.6 C.I. Pipe – bell and spigot \n3.7 PPR Pipes and fittings (PN20) \n3.8 HDPE Pipes and fittings \n \n4. Plumbing fixtures \nMay include: \n4.1 Lavatory \n4.2 Kitchen sink \n4.3 Bathtub \n4.4 Flush valve  \n4.5 Faucets \n4.6 Shower accessories: \n \nShower valve \n \nShower head \n \nSpout \n4.7 Electronic flushing device (urinal, closet, faucet) \n4.8 Water closet \n4.9 Bidet \n4.10 Floor drain\n\n--- PDF PAGE 50 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 47 \n \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency  \nCompetency assessment requires evidence that the candidate: \n1.1 Read and interpreted work instructions according to job requirements \n1.2 Selected materials, tools and equipment in accordance with \nspecifications and job requirements \n1.3 Installed pipes and fittings in accordance with the required standards \nin the RNPCP  \n1.4 Installed/assembled plumbing fixtures according to specified rough-in \nmeasurements and/or  manufacturer's specifications and required \nstandard in the  RNPCP \n1.5 Demonstrated compliance with safety regulations applicable to work \nsite operations \n1.6 Identified faults and problems that occur and made necessary action \nto rectify \n1.7 Communicated interactively  with others where applicable to ensure \nsafe and effective work operations \n1.8 Completed performing single plumbing unit installation and assembly  \n2. Resource   \nImplications \nThe following resources should be provided: \n2.1 Tools and equipment appropriate to the job \n2.2 Materials relevant to the proposed activity \n2.3 Drawings and specifications relevant to the task \n3. Methods of \nAssessment \nCompetency should be assessed through: \n3.1 Direct observation on application of tasks  \n3.2 Questions related to required knowledge \n3.3 Demonstration with oral questioning \n3.4 Written examination \n \n4. Context for \nAssessment \n4.1 Competency may be assessed in the workplace or in a simulated \nworkplace setting\n",
