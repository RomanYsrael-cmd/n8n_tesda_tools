        "source_text": "CON712345\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in making\npipe joints for plumbing system except copper pipes and\nfittings.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n1. Fit-up joints\nand fittings\nfor PVC pipe\n\n1.1 All measurements are\nin accordance with\nthe piping lay-\nout/plans and\nspecifications\n1.2\nJoints are made with\nstrict adherence to\nperpendicularly and\nlevelness of\nalignment in\naccordance with\nlatest/revised\nplumbing code\nrequirements.\n1.3\nAppropriate pipe joint\nis selected in line with\njob requirements\n1.4\nJoints are properly\nfitted-up with the\nrequired PVC/plastic\nsolvent/cement and\naccording to required\nalignments\n1.5\nPipe ends are\nproperly cleaned prior\nto fit-up according to\nstandard procedures\n1.6\nTrial fitting is\nperformed prior to\nfinal fit-up /\nconnection and\nbefore applications of\nsolvent cement or\nother types and\njointing materials\n1.7\nMaterials, Tools and\nequipment are\nselected according to\njob requirements\n1.1\nDifferent work\nrequirement\n1.2\nTypes and uses\nof plumbing\ntools and\nequipment\n1.3\nTypes and uses\nof plumbing\nmaterials\n1.4\nLinear\nmeasurement\n1.5\nPlumbing codes\n1.6\nMethods and\ntechniques in\nvarious type of\npipe\nconnections\n1.7\nBlue print\nreading\n1.8\nMaterials\nspecification\n1.9\nUnderstand\neconomic use of\nmaterial\n1.10 Environmental-\nconservation\nprocedures, e.g.\n3R (reduce,\nreuse, recycle)\n1.11 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n1.1 Interpreting\nplans and details\n1.2 Handling of\nmaterials, tools\nand equipment\n1.3 Communication\n(written and\nverbal)\n1.4 Applying\nmethods and\ntechniques in\nvarious type of\npipe connections\n1.5 Cutting and\nthreading pipes\n1.6 Applying linear\nmeasurement\n\n--- PDF PAGE 38 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 35\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n2. Perform pipe\njoints and\nconnections\n2.1 Materials, tools and\nequipment are selected\naccording to job\nrequirements\n2.2 All measurements are\nin accordance with the\npiping lay-out/plans\nand specifications\n2.3 Joints and connections\nare done in accordance\nwith piping table,\nspecifications and\napproved standard\nprocedures\n2.4 Teflon tape or other\nrelated jointing materials\nare applied to ensure\nleak free joints and\nconnections.\n\n2.1 Linear\nmeasurement\n\n2.2 Blue print\nreading\n\n2.3 Materials\nspecification\n\n2.4 Methods and\ntechniques in\nvarious type of\npipe joints and\nconnections\n\n2.5 Plumbing codes\n2.6 Types and uses\nof plumbing tools\nand equipment\n\n2.7 Environmental-\nconservation\nprocedures, e.g.\n3R (reduce,\nreuse, recycle)\n\n2.8 DOLE\nDepartment Order\nNo. 13 s. 1998\nGuidelines\nGoverning\nOccupational\nSafety and Health\nin the\nConstruction\nIndustry\n2.1 Interpreting\nplans and details\nHandling of\nmaterials, tools\nand equipment\n2.2 Communication\n(written and\nverbal)\n2.3 Applying\nmethods and\ntechniques in\nvarious type of\npipe connections\n2.4 Cutting and\nthreading pipes\n2.5 Applying linear\nmeasurement\n3. Caulk cast\niron (CI)\npipes and\nfittings\n3.1 Joints are firmly\npacked and fitted to a\ndepth of not less than\n25.4 mm and are\naligned with each\nother\n3.2 Adhesives are glued\nthoroughly at the\ninside and outside\nedges of the joint\n3.3 Caulked joint is\nextended to not more\nthan 3.2 mm below the\nrim of the hubless\n3.4 Couplers are used to\nconnect pipes and\n3.1 Linear\nmeasurement\n\n3.2 Blue print\nreading\n\n3.3 Materials\nspecification\n\n3.4 Types and uses\nof plumbing hand\ntools\n\n3.5 Plumbing codes\n3.6 Environmental-\nconservation\n3.1 Interpreting\nplans and details\n3.2 Handling of\nmaterials, tools\nand equipment\n3.3 Communication\n(written and\nverbal)\n3.4 Applying\nmethods and\ntechniques in\nvarious type of\npipe connections\n3.5 Cutting pipes\n3.6 Applying linear\nmeasurement\n\n--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 36\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\nfittings to hubless\npipes\n3.5 Appropriate PPE is\nused according to job\nrequirements\nprocedures, e.g.\n3R (reduce,\nreuse, recycle)\n3.7 DOLE\nDepartment\nOrder No. 13 s.\n1998 Guidelines\nGoverning\nOccupational\nSafety and\nHealth in the\nConstruction\nIndustry\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 37\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. PVC pipe joint\n\nMay include:\n1.1 Right angle\n1.2 180°\n1.3 30° / 60°\n\n2. Tools and equipment\nMay include:\n2.1 Kettle\n2.2 Blow torch\n2.3 Pipe hangers and supports\n2.4 Chisel\n2.5 Pipe cutter\n2.6 Hacksaw with blade\n2.7 Hammer\n2.8 Pipe threader\n2.9 Pipe wrench\n2.10 Pipe vise\n2.11 Cutting outfit set\n2.12 Welding machine\n2.13 Threading machine\n\n3. Personal Protective\nEquipment (PPE)\n\nMust include:\n3.1 Gloves\n3.2 Hard hat\n3.3 Safety shoes\n3.4 Goggles\n3.5 Welding mask\n3.6 Face shield\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 38\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nCompetency assessment requires evidence that the candidate:\n1.1\nFitted-up joints and fittings according to job requirements/\nspecifications\n1.2\nPerformed threaded connections in accordance with piping\ntable/specifications and according to standard procedures\n1.3\nCaulked\njoints\nin\naccordance\nwith\njob\nrequirements/\nspecifications\n1.4\nDemonstrated compliance with safety regulations applicable to\nwork site operations\n1.5\nSelected materials in accordance with specifications and job\nrequirements\n1.6\nAccurately set out dimensions and alignment of work\n1.7\nIdentified defects and problems that occur and made\nnecessary action to rectify\n1.8\nInteractively communicated with others where applicable to\nensure safe and effective work operations\n2. Resource\nImplications\nThe following resources should be provided:\n2.1\nTools and equipment appropriate to joint and connections\nprocess\n2.2\nMaterials relevant to the proposed activity\n2.3\nDrawings and specifications relevant to the task\n\n3. Methods of\nAssessment\nCompetency may be assessed through:\n3.1\n Direct observation on application of tasks\n3.2\n Questions related to required knowledge\n3.3\n Demonstration with oral questioning\n3.4\n Written examination\n\n4. Context for\nAssessment\n4.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting\n\n--- PDF PAGE 42 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 39\n\nUNIT OF COMPETENCY :\nPERFORM MINOR CONSTRUCTION WORK\n\nUNIT CODE\n:"
