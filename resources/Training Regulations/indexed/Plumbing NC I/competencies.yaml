cedures\n2.5 Defective instruments\nequipment and\naccessories are\ninspected and\nreplaced according to\nmanufacturer’s\nspecifications\n2.6 Tools are inspected,\nrepaired and replaced\nafter use\n2.7 Work place is\ncleaned and kept in\nsafe state in line with\nOccupational Safety\nand Health Standards\n(OSHS)\n\n2.1 SAFETY\nPRACTICES\n2.1.1 Use of PPE\n2.1.2 Handling of\ntools and\nequipment\n2.1.3 Good\nhousekeeping\n\n2.2 MATERIALS,\nTOOLS AND\nEQUIPMENT\n2.2.1 Types and\nuses of\nlubricants\n2.2.2 Types and\nuses of\ncleaning\nmaterials\n\n2.3 PREVENTIVE\nMAINTENANCE\n2.3.1 Methods and\ntechniques\n2.3.2 Procedures\n\n2.1 Handling of tools\nand equipment\n2.2 Performing\npreventive\nmaintenance\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 27\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated in\nthe Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED SKILLS\n3. Store tools\nand\nequipment\n\n3.1 Inventory of tools,\ninstruments and\nequipment are\nconducted and\nrecorded as per\ncompany practices\n\n3.2 Tools and equipment\nare stored safely in\nappropriate locations\nin accordance with\nmanufacturer's\nspecifications or\ncompany procedures\n\n3.1 SAFETY\nPRACTICES\n3.1.1 Use of PPE\n3.1.2 Handling of\ntools and\nequipment\nstoring\nprocedures\nand\ntechniques\n3.1.3 Storage\nconditions/\nlocations\n3.1 Storing tools and\nequipment\n3.2 Handling of tools\nand equipment\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 28\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials\nMay include:\n1.1 Lubricants\n1.2 Cleaning materials\n1.3 Rust remover\n1.4 Rugs\n1.5 Spare parts\n2. Tools and equipment\n\nMay include:\n2.1 Tools\nCutting tools - hacksaw, crosscut saw, rip saw\nBoring tools - auger, brace, grinlet, hand drill\nHolding tools - vise grip, C-clamp, bench vise\nThreading tools - die and stock, taps\n2.2 Measuring instruments/equipment\n3