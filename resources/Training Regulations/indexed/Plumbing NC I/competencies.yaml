        "source_text": "CON931201\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes on\nidentifying, requesting and receiving construction (plumbing)\nmaterials and tools in various workplace settings.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variable\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1.\nIdentify\nmaterials\n\n1.1 Materials are\nidentified as per job\nrequirements\n1.2 Quantity and\ndescription of\nmaterials conform\nwith the job\nrequirements\n1.3 Tools and\naccessories are\nidentified according to\njob requirements\n\n1.1 Different work\nspecifications\n1.2 Types and uses\nof plumbing\nmaterials and\naccessories\n1.3 Types and uses of\nplumbing tools\n\n1.1 Identifying tools\naccording to the\njob requirements\n1.2 Identifying\nmaterials and\naccessories\naccording to the\njob requirements\n\n2.\nPrepare\nrequisition\nof\nmaterials\n\n2.1 Materials and tools\nneeded are\nrequested according\nto the identified\nrequirements\n2.2 Request is done as\nper company\nstandard operating\nprocedures (SOP)\n2.3 Substitute materials\nand tools are\nprovided without\nsacrificing cost and\nquality of work\n\n2.1 Work requirements\n2.2 Types and uses of\nplumbing materials\nand tools\n2.3 Material take-off\n2.4 Requisition\nprocedures\n\n2.1 Preparing\nmaterial take-off\n2.2 Requesting\nmaterials and\ntools\n\n3.\nReceive\nand\ninspect\nmaterials\n3.1 Materials and tools\nissued are inspected\nas per quantity and\nspecification\n3.2 Tools, accessories\nand materials are\nchecked\n3.3 Materials and tools\nare set aside to\nappropriate location\n3.1 Policy on receiving\nmaterial deliveries\n3.2 Material and tools\nquality and defects\n3.3 Material handling\n\n3.1 Checking and\ninspecting\nmaterials and\ntools\n3.2 Storing/ stacking\nof tool and\nmaterials\n\n--- PDF PAGE 21 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 18\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Materials and\nTools\n\nMay include:\n1.1 Electrical supplies\n1.2 Structural\n1.3 Plumbing\n1.4 Welding/pipefitting\n1.5 Carpentry\n1.6 Masonry\n2. Description of\nMaterials and\nTools\n\nMay include:\n2.1 Brand name\n2.2 Size\n2.3 Capacity\n2.4 Kind of application\n\n3. Company standard\nprocedures\nMay include:\n3.1 Job order\n3.2 Requisition slip\n3.3 Borrower slip\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1 Listed materials and tools according to quantity and job requirements\n1.2 Requested materials and tools according to the list prepared and as\nper company SOP\n1.3 Inspected issued materials and tools as per quantity and job\nspecifications\n1.4 Tools provided with appropriate safety devices\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Workplace location\n2.2 Materials relevant to the unit of competency\n2.3 Technical plans, drawings and specifications relevant to the activities\n3. Methods of\nassessment\nCompetency in this unit must be assessed through:\n3.1 Direct observation and oral questioning\n4. Context of\nassessment\n\n4.1 Competency may be assessed in the workplace or in a simulated\nworkplace\n4.2 Competency assessment must be undertaken in accordance with the\nendorsed TESDA assessment guidelines\n\n--- PDF PAGE 22 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 19\n\nUNIT OF COMPETENCY :\nOBSERVE PROCEDURES, SPECIFICATIONS AND\nMANUALS OF INSTRUCTION\n\nUNIT CODE\n:"
