        "source_text": "500311102\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required\nto develop workplace relationship and contribute in\nworkplace activities.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop\neffective\nworkplace\nrelationship\n1.1 Duties and\nresponsibilities are\ndone in a positive\nmanner to promote\ncooperation and good\nrelationship\n1.2 Assistance is sought\nfrom workgroup\nwhen difficulties arise\nand addressed\nthrough discussions\n1.3 Feedback provided\nby others in the team\nis encouraged,\nacknowledged and\nacted upon\n1.4 Differences in\npersonal values and\nbeliefs are respected\nand acknowledged in\nthe development\n1.1 Reasons why\ncooperation and\ngood relationships\nare important\n1.2 Knowledge of the\norganization’s\npolicies, plans and\nprocedures\n1.3 Understanding how\nto elicit and\ninterpret feedback\n1.4 Knowledge of\nworkgroup\nmember’s\nresponsibilities and\nduties\n1.5 Importance of\ndemonstrating\nrespect and\nempathy in dealings\nwith colleagues\n1.6 Understanding of\nhow to identify and\nprioritize personal\ndevelopment\nopportunities and\noptions\n1.1 Ability to read\nand understand\nthe\norganization’s\npolicies and work\nprocedures\n1.2 Write simple\ninstructions for\nparticular routine\ntasks\n1.3 Interpret\ninformation\ngained from\ncorrespondence\n1.4 Communication\nskills to request\nadvice, receive\nfeedback and\nwork with a team\n1.5 Planning skills to\norganized work\npriorities and\narrangement\n1.6 Technology skills\nincluding the\nability to select\nand use\ntechnology\nappropriate to a\ntask\n1.7 Ability to relate to\npeople from a\nrange of social,\ncultural and\nethnic\nbackgrounds.\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 6\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Contribute to\nwork group\nactivities\n2.1 Support is provided\nto team members to\nensure workgroup\ngoals are met\n2.2 Constructive\ncontributions to\nworkgroup goals and\ntasks are made\naccording to\norganizational\nrequirements\n2.3 Information relevant\nto work is shared with\nteam members to\nensure designated\ngoals are met\n2.1 Reasons why\ncooperation and\ngood relationships\nare important\n2.2 Knowledge of the\norganization’s\npolicies, plans and\nprocedures\n2.3 Understanding how\nto elicit and\ninterpret feedback\n2.4 Knowledge of\nworkgroup\nmember’s\nresponsibilities and\nduties\n2.5 Importance of\ndemonstrating\nrespect and\nempathy in\ndealings with\ncolleagues\n2.6 Understanding of\nhow to identify and\nprioritize personal\ndevelopment\nopportunities and\noptions\n2.1 Ability to read\nand understand\nthe\norganization’s\npolicies and\nwork procedures\n2.2 Write simple\ninstructions for\nparticular routine\ntasks\n2.3 Interpret\ninformation\ngained from\ncorrespondence\n2.4 Communication\nskills to request\nadvice, receive\nfeedback and\nwork with a team\n2.5 Planning skills to\norganized work\npriorities and\narrangement\n2.6 Technology\nskills including\nthe ability to\nselect and use\ntechnology\nappropriate to a\ntask\n2.7 Ability to relate\nto people from a\nrange of social,\ncultural and\nethnic\nbackgrounds.\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 7\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements including OHS\n1.5 Code of conduct\n\n2. Work group\n2.1 Supervisor or manager\n2.2 Peers/work colleagues\n2.3 Other members of the organization\n\n3. Feedback on\nperformance\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues and clients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring service delivery\n\n4. Providing support\nto team members\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n\n5. Organizational\nrequirements\n\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes and standards\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 8\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1.\nProvided support to team members to ensure goals are met\n1.2.\nActed on feedback from clients and colleagues\n1.3.\nAccessed learning opportunities to extend own personal work\ncompetencies to enhance team goals and outcomes\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2.\nMaterials relevant to the proposed activity or task\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1.\nDirect observations of work activities of the individual member in\nrelation to the work activities of the group\n3.2.\nObservation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3.\nCase studies and scenarios as a basis for discussion of issues and\nstrategies\n\n4. Context for\nAssessment\n4.1.\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n4.2.\nAssessment shall be observed while task are being undertaken\nwhether individually or in group\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 9\n\nUNIT OF COMPETENCY :\nDEMONSTRATE WORK VALUES\nUNIT CODE\n:"
