          "source_text": "1. Critical aspects\nof competency\nCompetency assessment requires evidence that the candidate:\n1.1 Read and interpreted work instructions according to job requirements\n1.2 Selected materials, tools and equipment in accordance with\nspecifications and job requirements\n1.3 Installed pipes and fittings in accordance with the required standards\nin the RNPCP\n1.4 Installed/assembled plumbing fixtures according to specified rough-in\nmeasurements and/or manufacturer's specifications and required\nstandard in the RNPCP\n1.5 Demonstrated compliance with safety regulations applicable to work\nsite operations\n1.6 Identified faults and problems that occur and made necessary action\nto rectify\n1.7 Communicated interactively with others where applicable to ensure\nsafe and effective work operations\n1.8 Completed performing single plumbing unit installation and assembly\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Tools and equipment appropriate to the job\n2.2 Materials relevant to the proposed activity\n2.3 Drawings and specifications relevant to the task\n3. Methods of\nAssessment\nCompetency should be assessed through:\n3.1 Direct observation on application of tasks\n3.2 Questions related to required knowledge\n3.3 Demonstration with oral questioning\n3.4 Written examination\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in the workplace or in a simulated\nworkplace setting\n\n--- PDF PAGE 51 ---\nTR- Plumbing NC I (Amended) Promulgated October 2014\nPage 48\n3\nTRAINING ARRANGEMENTS\n\nThese standards are developed to give technical and vocational education and\ntraining (TVET) provides information and guidance on important requirements needed when\ndesigning training programs for certain qualifications.\n\nThese include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to training providers. This will equip them with needed knowledge and skill\nin developing their own curricula based on the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency specifically in the areas of mathematics, science/technology,\ncommunication/language and other academic subjects shall be contextualized. To\nthis end, TVET providers shall develop a Contextual Learning Matrix (CLM) to\naccompany their curricula.\n\nCourse Title:\n\n PLUMBING\n\nNC Level: I\n\nNominal Training Duration :\n28 Hrs. (Basic)\n\n20 Hrs. (Common)\n\n120 Hrs. (Core)\n\n168 Hrs.\nCourse Description:\n\nThis course is designed to equip individual with operational skills in Plumbing,\nsuch as prepare plumbing layout, make piping joints and connections, perform minor\nconstruction works and install and assemble single plumbing unit.\n\nTo complete the course, all units prescribed for this qualification must be\nachieved.\n\n--- PDF PAGE 52 ---\nTR- Plumbing NC I (Amended) Promulgated October 2014\nPage 49\nBASIC COMPETENCIES\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\nPractical Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Receive and\nrespond to\nworkplace\ncommunication\n1.1 Follow\nroutinary\nspeaking &\nmessage\n•\nParts of a speech\n•\nParts of a sentence\n•\nKinds of sentence\n\n•\nExercise Conciseness in\nreceiving and clarifying\nmessages/ information/\ncommunication\n• Group\ndiscussion\n\n• Interaction\n• Reportorial\n• Modular\n• Interviews/\n• Questioning\n• Practical/\n• Performance Test\n• Observation\n4 Hours\n\n1.2 Perform\nwork duties\nfollowing\nwritten\nnotices\n•\nKnowledge of organizational\npolicies/guidelines in regard\nto processing\ninternal/external information.\n\n•\nWork practices in handling\ncommunications\n\n•\nCommunication processes\n\n•\nReceiving and clarifying\ncommunications, messages\nand information.\n\n•\nRecording messages\n•\nPractice Accuracy in following\nwritten/ oral instruction/\ninformation\n•\nPractice written and oral\ncommunication skills\n•\nCase Study in handling\nwritten communication\n•\nPractice relaying/\ndisseminating messages/\ninformation\n•\nAnalyze different messages\n• Lecture/\n• Discussion\n• Demonstration\n• Case Study\n• Written\n• Practical\n• Writing\n• Demonstration\n4 Hours\n\n--- PDF PAGE 53 ---\nTR- Plumbing NC I (Amended) Promulgated October 2014\nPage 50\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\nPractical Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n2. Work with\nothers\n2.1 Develop\neffective\nworkplace\nrelationship\n\n•\nJob description and\nemployment arrangement.\n•\nOrganization’s policy\nrelevant to work role\n•\nTeam structure\n•\nSupervision and\naccountability requirements\nincluding OHS\n•\nCode of conduct\n•\nAssisting a colleagues\n•\nOpen communication\nchannels\n•\nAcknowledging\nsatisfactory/unsatisfactory\nperformance\n•\nFormal/informal\nperformance appraisal\n•\nObtaining feedback from\nsupervisor and colleagues\nand clients\n•\nPersonal reflective behavior\nstrategies\n•\nRoutine organization\nmethods for monitoring\nservice delivery\n•\nEthical sentences\n•\nPractice cooperation and\ngood relationship\n•\nTeam structuring\n•\nPractice OHS Code\n•\nRoutine task analysis\n•\nPractice communication\nskills in requesting advice,\nreceiving feedback\n•\nWork effectively with team\n•\nApply personal decision and\norganized work priorities\n•\nApply appropriate technology\nfor a given task.\n•\nPractice monitoring of\nservice delivery\n•\nGroup\ndiscussion\n•\n Role play\n•\nInteraction\n\n•\nInterviews/\n•\nOral Questioning\n•\nWritten Test\n•\nDemonstration\n•\nObservation\n4 Hours\n\n--- PDF PAGE 54 ---\nTR- Plumbing NC I (Amended) Promulgated October 2014\nPage 51\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Content\nPra