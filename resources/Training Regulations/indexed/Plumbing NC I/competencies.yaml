        "source_text": "500311103\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitude in\ndemonstrating proper work values.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Define the\npurpose of\nwork\n1.1 One’s unique sense of\npurpose for working\nand the why’s of work\nare identified, reflected\non and clearly defined\nfor one’s development\nas a person and as a\nmember of society\n1.2 Personal mission is in\nharmony with\ncompany’s values\n\n1.1 Work values and\nethics\n1.2 Company\nperformance and\nethical standards\n1.3 Company policies\nand guidelines\n1.4 Fundamental rights\nat work including\ngender sensitivity\n1.5 Work\nresponsibilities/job\nfunctions\n1.6 Corporate social\nresponsibilities\n1.7 Company code of\nconduct/values\n1.8 Balancing work and\nfamily\nresponsibilities\n\n1.1 Interpersonal\nskills\n1.2 Communication\nskills\n1.3 Self awareness,\nunderstanding\nand acceptance\n1.4 Application of\ngood manners\nand right conduct\n\n2. Apply work\nvalues/ethics\n2.1 Work values/ethics/\nconcepts are\nclassified and\nreaffirmed in\naccordance with the\ntransparent company\nethical standards,\npolicies and\nguidelines.\n\n2.1 Work values and\nethics\n2.2 Company\nperformance and\nethical standards\n2.3 Company policies\nand guidelines\n\n2.1 Interpersonal\nskills\n2.2 Communication\nskills\n2.3 Self- awareness,\nunderstanding\nand acceptance\n2.4 Application of\ngood manners\nand right conduct\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 10\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n2.2 Work practices are\nundertaken in\ncompliance with\nindustry work ethical\nstandards,\norganizational policy\nand guidelines\n2.3 Personal behavior and\nrelationships with co-\nworkers and/or clients\nare conducted in\naccordance with\nethical standards,\npolicy and guidelines.\n2.4 Company resources\nare used in\naccordance with\ntransparent company\nethical standard,\npolicies and guidelines\n2.4 Fundamental rights\nat work including\ngender sensitivity\n2.5 Work\nresponsibilities/job\nfunctions\n2.6 Corporate social\nresponsibilities\n2.7 Company code of\nconduct/values\n2.8 Balancing work and\nfamily\nresponsibilities\n\n3. Deal with\nethical\nproblems\n3.1 Company ethical\nstandards,\norganizational policy\nand guidelines on the\nprevention and\nreporting of unethical\nconduct are accessed\nand applied in\naccordance with\ntransparent company\nethical standard,\npolicies and\nguidelines.\n3.2 Work incidents/\nsituations are\nreported and/or\nresolved in\naccordance with\ncompany\nprotocol/guidelines.\n3.3 Resolution and/or\nreferral of ethical\nproblems identified are\nused as learning\nopportunities.\n3.1 Work values and\nethics\n3.2 Company\nperformance and\nethical standards\n3.3 Company policies\nand guidelines\n3.4 Fundamental rights\nat work including\ngender sensitivity\n3.5 Work\nresponsibilities/job\nfunctions\n3.6 Corporate social\nresponsibilities\n3.7 Company code of\nconduct/values\n3.8 Balancing work\nand family\nresponsibilities\n\n3.1 Interpersonal\nskills\n3.2 Communication\nskills\n3.3 Self- awareness,\nunderstanding\nand acceptance\n3.4 Application of\ngood manners\nand right\nconduct\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 11\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Maintain\nintegrity of\nconduct in the\nworkplace\n4.1 Personal work\npractices and values\nare demonstrated\nconsistently with\nacceptable ethical\nconduct and\ncompany’s core\nvalues.\n4.2 Instructions to co-\nworkers are provided\nbased on ethical,\nlawful and reasonable\ndirectives.\n4.3 Company\nvalues/practices are\nshared with co-\nworkers using\nappropriate behavior\nand language.\n\n4.1 Work values and\nethics\n4.2 Company\nperformance and\nethical standards\n4.3 Company policies\nand guidelines\n4.4 Fundamental rights\nat work including\ngender sensitivity\n4.5 Work\nresponsibilities/job\nfunctions\n4.6 Corporate social\nresponsibilities\n4.7 Company code of\nconduct/values\n4.8 Balancing work and\nfamily\nresponsibilities\n\n4.1 Interpersonal\nskills\n4.2 Communication\nskills\n4.3 Self- awareness,\nunderstanding\nand acceptance\n4.4 Application of\ngood manners\nand right conduct\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 12\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work\nvalues/ethics/\nconcepts\nMay include:\n1.1\nCommitment/ Dedication\n1.2\nSense of urgency\n1.3\nSense of purpose\n1.4\nLove for work\n1.5\nHigh motivation\n1.6\nOrderliness\n1.7\nReliability\n1.8\nCompetence\n1.9\nDependability\n1.10 Goal-oriented\n1.11 Sense of responsibility\n1.12 Being knowledgeable\n1.13 Loyalty to work/company\n1.14 Sensitivity to others\n1.15 Compassion/Caring attitude\n1.16 Balancing between family and work\n1.17 Pakikisama\n1.18 Bayanihan spirit/teamwork\n1.19 Sense of nationalism\n2. Work practices\n2.1 Quality of work\n2.2 Punctuality\n2.3 Efficiency\n2.4 Effectiveness\n2.5 Productivity\n2.6 Resourcefulness\n2.7 Innovativeness/Creativity\n2.8 Cost conciousness\n2.9 5S\n2.10 Attention to details\n3. Incidents/situations\n3.1 Violent/intensed dispute or argument\n3.2 Gambling\n3.3 Use of prohibited substances\n3.4 Pilferages\n3.5 Damage to person or property\n3.6 Vandalism\n3.7 Falsification\n3.8 Bribery\n3.9 Sexual Harassment\n3.10 Blackmail\n4. 4. Company\nresources\n4.1 Consumable materials\n4.2 Equipment/Machineries\n4.3 Human\n4.4 Time\n4.5\nFinancial resources\n5. Instructions\n5.1 Verbal\n5.2 Written\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 13\n\nEVIDENCE GUIDE\n\n1.