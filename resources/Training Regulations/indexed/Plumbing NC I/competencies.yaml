        "source_title": "MAINTAIN TOOLS AND EQUIPMENT",
        "source_text": "--- PDF PAGE 28 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 25 \n \nUNIT OF COMPETENCY : \nMAINTAIN TOOLS AND EQUIPMENT \n \nUNIT CODE \n: \nCON311204 \n \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes on \nchecking condition, performing preventive maintenance and \nstoring of plumbing tools and equipment. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Check \ncondition of \ntools and \nequipment \n \n1.1 \nMaterials, tools and \nequipment are \nidentified according to \nclassification and job \nrequirements \n1.2 \nNon-functional tools \nand equipment are     \nsegregated and \nlabeled according to \nclassification \n1.3 \nSafety of tools and \nequipment are \nobserved in \naccordance with \nmanufacturer's \ninstructions \n1.4 \nCondition of PPE are \nchecked in \naccordance with \nmanufacturer's \ninstructions \n \n1.1 SAFETY \nPRACTICES \n1.1.1 Use of PPE \n1.1.2 Handling of \ntools and \nequipment \n1.1.3 Good \nhousekeeping \n1.2 MATERIALS, \nTOOLS AND \nEQUIPMENT \n1.2.1 Types and \nuses of \nlubricants \n1.2.2 Types and \nuses of \ncleaning \nmaterials \n1.2.3 Types and \nuses of \nplumbing \ntools  \n1.2.4 Types and \nuses of \nplumbing \nequipment \n1.2.5 Operational \nconditions of \nplumbing \ntools and \nequipment \n1.2.6 Plumbing \ntools and \nequipment \ndefects \n1.1  Maintaining tools \nand equipment \n1.2  Handling of tools \nand equipment \n1.3  Identifying tools \nand equipment \ndefects\n\n--- PDF PAGE 29 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 26 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Perform basic \npreventive \nmaintenance \n2.1 Appropriate lubricants \nare identified \naccording to types of \nequipment \n2.2 Tools and equipment \nare lubricated \naccording to   \npreventive \nmaintenance \nschedule or \nmanufacturer's \nspecifications \n2.3 Measuring \ninstruments are \nchecked and \ncalibrated in \naccordance with \nmanufacturer’s \ninstructions \n2.4 Tools are cleaned \nand lubricated \naccording to  \nstandard procedures \n2.5 Defective instruments \nequipment and \naccessories are \ninspected and \nreplaced according to \nmanufacturer’s \nspecifications \n2.6 Tools are inspected, \nrepaired and replaced \nafter use \n2.7 Work place is \ncleaned and kept in \nsafe state in line with \nOccupational Safety \nand Health Standards \n(OSHS) \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n2.1 SAFETY \nPRACTICES \n2.1.1 Use of PPE \n2.1.2 Handling of \ntools and \nequipment \n2.1.3 Good \nhousekeeping \n \n2.2 MATERIALS, \nTOOLS AND \nEQUIPMENT \n2.2.1 Types and \nuses of \nlubricants \n2.2.2 Types and \nuses of \ncleaning \nmaterials \n \n2.3 PREVENTIVE \nMAINTENANCE \n2.3.1 Methods and \ntechniques \n2.3.2 Procedures \n \n2.1 Handling of tools \nand equipment \n2.2 Performing \npreventive \nmaintenance\n\n--- PDF PAGE 30 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 27 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3.  Store tools \nand \nequipment \n \n3.1 Inventory of tools, \ninstruments and \nequipment are \nconducted and \nrecorded as per \ncompany practices \n \n3.2 Tools and equipment \nare stored safely in \nappropriate locations \nin accordance with \nmanufacturer's \nspecifications or \ncompany procedures \n \n3.1 SAFETY \nPRACTICES \n3.1.1 Use of PPE \n3.1.2 Handling of \ntools and \nequipment \nstoring \nprocedures \nand \ntechniques \n3.1.3 Storage \nconditions/ \nlocations \n3.1 Storing  tools and \nequipment \n3.2 Handling of tools \nand equipment\n\n--- PDF PAGE 31 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 28 \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Materials \nMay include: \n1.1 Lubricants \n1.2 Cleaning materials \n1.3 Rust remover \n1.4 Rugs \n1.5 Spare parts \n2. Tools and equipment \n \nMay include: \n2.1 Tools \nCutting tools - hacksaw, crosscut saw, rip saw \nBoring tools - auger, brace, grinlet, hand drill \nHolding tools - vise grip, C-clamp, bench vise \nThreading tools - die and stock, taps \n2.2 Measuring instruments/equipment \n3. PPE \nMay include: \n3.1 Goggles \n3.2 Gloves \n3.3 Safety shoes \n3.4 Aprons/Coveralls \n \n4. Forms \nMay include: \n4.1 Maintenance schedule forms \n4.2 Requisition slip \n4.3 Inventory Form  \n4.4 Inspection Form  \n4.5 Procedures\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08 \nTR- Plumbing NC I (Amended)                                   Promulgated  October 2014 \n 29 \n \nEVIDENCE GUIDE \n \n1. Critical aspects of \ncompetency \nAssessment requires that the candidate: \n1.1 Selected and used appropriate processes, tools and  \nequipment to carry out task \n1.2 Identified \nfunctional \nand \nnon-functional \ntools \nand \nequipment  \n1.3 Checked, lubricated and calibrated tools, equipment and  \ninstruments according to manufacturer’s specifications \n1.4 Replaced defective tools, equipment and their accessories \n1.5 Observed and applied safe handling of tools and \nequipment and safety work practices \n1.6 Prepared and submitted inventory report,  where \napplicable \n1.7 Maintained \nworkplace \nin \naccordance \nwith \nOHSA \nregulations \n1.8 Stored tools and equipment safely in appropriate locations \nand in accordance with company practices \n \n2. Resource implications \nThe following resources should be provided: \n2.1 Workplace \n2.2 Maintenance schedule \n2.3 Maintenance materials, tools and equipment relevant to \nthe  proposed activity/task \n3. Methods of assessment \nCompetency should be assessed through: \n3.1 Direct observation \n3.2 Written \ntest/questioning \nrelevant \nto \nUnderpinning \nknowledge \n4. Context of assessment \n4.1 Competency assessment may occur in workplace or any \nappropriate  simulated environment \n4.2 Competency \nassessment \nmust \nbe \nundertaken \nin \naccordance with the endorsed TESDA  assessment \nguidelines\n",
