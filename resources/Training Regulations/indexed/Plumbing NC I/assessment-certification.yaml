  "source_text": "SECTION 4\nASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\nCompetency Assessment is the process of collecting evidence and making judgments on\nwhether competency has been achieved. The purpose of assessment is to confirm that an\nindividual can perform according to the standards expected at the workplace as expressed in\nthe relevant competency standards.\nThe assessment process is based on evidence or information gathered to prove\nachievement of competencies. The process may be applied to employable unit(s) of\ncompetency in partial fulfillment of the requirements of the national qualification.\n\n4.1 NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated\ncompetence through project-type assessment covering all the units of competency\nthat comprise the Training Regulations for Plumbing NC I as follows:\n\nBASIC COMPETENCIES\nReceive and respond to workplace communication\nWork with others\nDemonstrate work values\nPractice housekeeping procedures\nCOMMON COMPETENCIES\nPrepare construction materials and tools\nObserve procedures, specifications and manuals of instruction\nPerform mensuration and calculations\nMaintain tools and equipment\nCORE COMPETENCIES\nPrepare Plumbing Layout\nMake Piping Joints and Connections\nPerform Minor Construction Works\nInstall and Assemble Single Plumbing Unit\n4.1.2 Candidates aiming to be certified will have to be assessed in accordance with the\nrequirements identified in the evidence guide of the relevant unit/s of competency.\n4.1.3 Candidates applying for competency assessment and certification for Plumbing NC I\nshould be:\n4.1.3.1 Graduates of formal, non-formal and informal institutions including\nenterprise-based training programs,\n4.1.3.2 Experienced workers (wage-employed or self-employed)\n4.1.4 Conduct of assessment and issuance of certificates shall adhere to the procedures\nmanual and implementing guidelines developed for this purpose.\n\n4.2 COMPETENCY ASSESSMENT REQUISITES\n\n--- PDF PAGE 75 ---\nTR- Plumbing NC I (Amended) Promulgated October 2014\nPage 72\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the\ncandidate prior to actual competency assessment. SAG is a pre-assessment tool to\nhelp both the candidate and the assessor determine what evidence is available,\nwhere gaps exist, including readiness for assessment. This document can:\n\na. Identify the candidate’s skills and knowledge\nb. Highlight gaps in candidate’s skills and knowledge\nc. Provide critical guidance to the assessor and candidate on the evidence that\nneed to be presented\nd. Assist the candidate to identify key areas in which practice is needed or\nadditional information or skills that should be gained prior `\n4.2.2 Accredited Assessment Center. Only Assessment Centers accredited by TESDA\nare authorized to conduct competency assessment. Assessment centers undergo a\nquality assured procedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency assessors are\nauthorized to conduct assessment of competence. Competency assessors undergo\na quality-assured accreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 76 ---\nTR- Plumbing NC I (Amended) Promulgated\nPage 73\n\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nANNEX A\nPLUMBING NC I\n\nCOMPETENCY MAP\nCONSTRUCTION\nPLUMBING SUB-SECTOR\nPrepare\nestimation of\nmaterials for\nsingle plumbing\nunit\nPerform\nComplex\nPlumbing\nInstallation and\nAssemblies\nInstall hot, chilled and\n/ or potable water\npiping system\nPerform plumbing\nrepair and\nmaintenance\nworks\nConduct pipe\nleak testing\nInstall riser/ down\nfeed and\ndistribution water\nsupply system\nDraft plumbing\ndesign\nPrepare\nconstruction\nmaterials and\ntools\nObserve\nprocedures,\nspecifications and\nmanuals of\ninstructions\nMaintain tools\nand equipment\nPerform\nmensurations\nand\ncalculations\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nDemonstrate\nwork values\nPractice\nhousekeeping\nprocedures\nParticipate in\nworkplace\ncommunication\nWork in a team\nenvironment\nPractice career\nprofessionalism\nPractice\noccupational health\nand safety\nprocedures\nLead workplace\ncommunication\nLead small\nteams\nDevelop and\npractice\nnegotiation skills\nSolve problems\nrelated to work\nactivities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nBASIC\nCOMPETENCIES\nInstall and\nAssemble\nSingle\nPlumbing Unit\nPerform\nMinor\nConstruction\nWorks\nMake Piping\nJoints and\nConnections\nPrepare\nPlumbing\nLayout\nInstall\nand connect\npumps to\nplumbing system\nPerform finishing\nand trimming of\nplumbing fixtures\nand accessories\n\n--- PDF PAGE 77 ---\nTR- Plumbing NC I (Amended) Promulgated\nPage 74\n\nDEFINITION OF TERMS\n\n1. Certification\nRefers to the process of verifying and validating competencies of\na person through assessment.\n2. Competency\nIs the application of knowledge, skills and attitudes to perform\nwork activities to the standard expected in the workplace.\n3. Element\nRefers to the building blocks of a unit of competency. It\ndescribes in outcome terms the functions that a person who\nworks in a particular area of work is able to perform.\n4. Evidence\nGuide\nIt is a guide for assessment that provides information on critical\naspects of competency, underpinning knowledge, underpinning\nskills, resource implications, context of assessment and\nassessment method.\n5. Level\nRefers to the category following the level of difficulty and\ncomplexity of skills and knowledge required to do the job.\n6. Performance\nCriteria\nIs an evaluative statement that specifies what is to be assessed\nand the required level of performance.\n\n7. Philippine\nQualifi-\ncations\nFramework\nA quality-assured national system for the development,\nrecognition and award of qualifications based on standards of\nknowledge, skills and values acquired in different ways and\nmethods by learners and workers in of a certain country\n\n10. Plumbing\nappurt-\nenance\nIt is a manufactured device or a prefabricated assembly or an\non-the-job assembly of component parts, and serve as adjunct\nto the basic piping system and plumbing fixtures. An\nappurtenance demands no additional water supply nor does it\nadd any discharge load to fixture or the drainage system. It\nperforms some useful functions in the operation, maintenance,\nservicing, economy or safety of the plumbing system.\n8. Pipe\nRefers to a cylindrical conduit or conductor conforming to the\nparticular dimensions commonly known as “pipe size” and is\ndenoted by its interior diameter or I.D.\n9. Plumbing\nappliance\nRefers to any one of a special class of device or equipment\nintended to perform a special plumbing function. Its operation\nand/or control may be dependent upon one or more energized\ncomponents, such as motors, controls, heating elements and\npressure-temperature-sensing elements. Such device or\nequipment may operate automatically through one or more of\nthe following actions; a time cycle, a temperature range, a\npressure range, a measured volume or weight; or the device or\nequipment may be manually adjusted or controlled by the user\nor operator.\n\n--- PDF PAGE 78 ---\nTR- Plumbing NC I (Amended) Promulgated\nPage 75\n\n11. Plumbing\nIt is the art and technique of installing pipes, fixtures and other\napparatuses in buildings for bringing in the supply, liquids,\nsubstances and/or ingredients and removing them; and such\nwater, liquid and other carried-wastes hazardous to health,\nsanitation, life, property; also the pipes and fixtures after\ninstallation i.e., the plumbing system.\n12. Plumbing\nfixtures\nAre approved-type installed receptacles, devices or appliances\nsupplied with water or receive liquid or liquid-borne wastes and\ndischarge such wastes into the drainage system to which they\nmay be directly or indirectly connected. Industrial or commercial\ntanks, vats and similar processing equipment are not plumbing\nsystem fixtures, but may be connected to or discharged into\napproved traps or plumbing fixtures as provided for in this Code.\n13. Plumbing\nsystem\nRefers to all potable water supply and distribution pipes, all\nplumbing fixtures and traps, all sanitary and storm drainage\nsystems; vent pipes, roof drains, leaders and downspouts; and\nall building drains and sewers, including their respective joints\nand connections; devices, receptacles, and appurtenances\nwithin the property; water lines in the premises; potable , tap, hot\nand chilled water pipings; potable water treating or using\nequipment; fuel gas piping; water heaters and vents for same.\n14. Plumbing\nunit\nRefers to a minimum standard quantity of plumbing fixtures that\ndischarge wastes into a plumbing installation including; one (1)\nwater meter, one (1) water closet, one (1) lavatory, one (1)\nshower head and drain for a bathtub or shower stall, one (1)\nkitchen sink, one (1) laundry tray and three (3) floor drains and\nfour (4) faucets/hose bibb.\n15. Potable\nwater\nIs a water satisfactory for drinking, culinary and domestic\npurposes and meets the requirements of the Philippine National\nStandards for Drinking Water.\n16. Pressure\nIs a normal force exerted by a homogenous liquid or gas, per\nunit of area on the wall of the container.\n17. Qualification\nRefers to the national certificate issued by the TESDA or its\naccredited industry organizations in recognition that a person\nhas achieved competencies relevant to a trade or industry.\n18. Range of\nVariables\nIt describes the circumstances or context in which the work is to\nbe performed.\n\n19. Unit of\nCompetency\n\nRefers to a discrete aspect of work, which would normally be\nperformed by only one person.\n20. Unplasti-\ncized\nPolyvinyl\nChloride\nConduit\n(UPVC)\nRefers to a non-metallic conduit into which electrical wire may be\ndrawn and with an outside diameter sufficiently different from\nthat of metallic conduit.\n\n--- PDF PAGE 79 ---\nTR- Plumbing NC I (Amended) Promulgated\nPage 76\n\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to thank the\nfollowing persons from Philippine Society of Plumbing Engineers Inc. (PSPE), industry,\nacademe and government agencies for sacrificing their time and sharing expertise in the\ndevelopment and validation of these Training Regulations.\n\nTHE TECHNICAL EXPERTS PANEL (TEP) – REVIEW PANEL\n\nMR. ALBERTO T. CABAEL\nAAA Plumbing Services Inc.\nNo. 446 –A Kennedy 1 Bldg. F.\nBlumentritt St., Kabayanan\nSan Juan City\nTel. Nos.: 655-9633; 664-5033\nFax No.: 726-9145\nMR. JASON MAGOS\nGreen Line Construction Works, Inc.\n6B Rodriguez Drive, Jordan Valley\nSubd., Baesa, Quezon City\nTelefax. No.: 361-5179\nemail add.: jasonmagos @yahoo.com\n\nMR. IGNACIO M. AGUITO\nJourneymen and Skilled Plumbers\nAssociation(JASPA)\nemail Add: mkigna@yahoo.com\n\nMR. RICARDO D. TAYTAY\nSea Wave Pools\nUnit 2-E, Glorious Aqua Building\n116 P. Santos St., Malibay, Pasay City\nTelefax No.: 852-2271\nemail add.: ric_taytay@yahoo.com\n\nMR. VIRGILIO D. SIMBULAN\nProfessional Regulation Commission\nTel. No.: 927-5942\nMR. CRISANTO S. LIM\nHomeworld Engineering\nTelefax: 412-8744\nANTONIO C. PADRINAO\nPhilippine Society of Plumbing Engineers,\nInc. (PSPE)\nTel. No. 332-8713\n\nThe PARTICIPANTS in the Validation of these Training Regulations\n\nMR. KIN IERREO D. VEGA\nMS. CARMELYN O. DE SAGON\nAAA PLUMBING (Plumber)\nNo. 446-AF Kennedy St., Barangay\nKabayanan, San Juan City\nAAA PLUMBING (Plumber)\nNo. 446-AF Kennedy St., Barangay\nKabayanan, San Juan City\n\nMR. WILFREDO C. EDLOY, JR.\n\nPIPE SYSTEM (Plumber)\n389 Old Sta Mesa, Manila\n\n--- PDF PAGE 80 ---\nTR- Plumbing NC I (Amended) Promulgated\nPage 77\n\nMR. JOSEPH ALISON D. DELA TORRE\nGlacier North Refrigeration\nCell. No. (0915) 3720246\n\nMR. MARCO F. BILDAN\nTarlac State University\nCell. No. (0920) 9290420\nMR. EDGARDO P. PEÑA\nSolid Homes Realty Engineering Services\nand Construction\nTel. No.: (044) 288-2795\nMP. ALVIN R. MAHAYAG\nCitiaire Industrial Services Corporation\nTel. No. 351-6723\n\nMR. EDWIN B. BARAL\nPhysical Plant Site Development Services\nNueva Vizcaya State University\nTel. No. (078) 805-3273\n\nMR. CARLITO K. DESPI\nInstructor\nEscuela Taller\nTel. No. 525-1986\n\nMembers of the TESDA Board\n\nTESDA EXCOM\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\nTESDA - Qualifications and Standards Office (QSO)"
