      "number": "4.1",
      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 A National Certificate (NC) is issued when a candidate has demonstrated competence through project-type assessment covering all the units of competency that comprise the Training Regulations for Plumbing NC I as follows: BASIC COMPETENCIES Receive and respond to workplace communication Work with others Demonstrate work values Practice housekeeping procedures COMMON COMPETENCIES Prepare construction materials and tools Observe procedures, specifications and manuals of instruction Perform mensuration and calculations Maintain tools and equipment CORE COMPETENCIES Prepare Plumbing Layout Make Piping Joints and Connections Perform Minor Construction Works Install and Assemble Single Plumbing Unit 4.1.2 Candidates aiming to be certified will have to be assessed in accordance with the requirements identified in the evidence guide of the relevant unit/s of competency. 4.1.3 Candidates applying for competency assessment and certification for Plumbing NC I should be: 4.1.3.1 Graduates of formal, non-formal and informal institutions including enterprise-based training programs, 4.1.3.2 Experienced workers (wage-employed or self-employed) 4.1.4 Conduct of assessment and issuance of certificates shall adhere to the procedures manual and implementing guidelines developed for this purpose."
