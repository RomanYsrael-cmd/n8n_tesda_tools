e removed and\ndisposed of in\naccordance with\ncompany or office\nprocedures\n1.1 Principles of 5S\n1.2 Work process and\nprocedures\n1.3 Safety signs and\nsymbols\n1.4 General OSH\nprinciples and\nlegislation\n1.5 Environmental\nrequirements\nrelative to work\nsafety\n1.1 Basic\ncommunication\nskills\n1.2 Interpersonal\nskills\n1.3 Reading skills\nrequired to\ninterpret\ninstructions\n\n2. Arrange items 1.4 Items are arranged in\naccordance with\ncompany/office\nhousekeeping\nprocedures\n1.5 Work area is\narranged according to\njob requirements\n1.6 Activities are\nprioritized based on\ninstructions.\n1.7 Items are provided\nwith clear and visible\nidentification marks\nbased on procedure\n1.8 Safety equipment and\nevacuation passages\nare kept clear and\naccessible based on\ninstructions\n2.1 Principles of 5S\n2.2 Work process and\nprocedures\n2.3 Safety signs and\nsymbols\n2.4 General OSH\nprinciples and\nlegislation\n2.5 Environmental\nrequirements\nrelative to work\nsafety\n\n2.1 Basic\ncommunication\nskills\n2.2 Interpersonal\nskills\n2.3 Reading skills\nrequired to\ninterpret\ninstructions\n\n--- PDF PAGE 18 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 15\n\n3. Maintain work\narea, tools\nand equipment\n3.1 Cleanliness and\norderliness of work\narea is maintained in\naccordance with\ncompany/office\nprocedures\n3.2 Tools and equipment\nare cleaned in\naccordance with\nmanufacturer’s\ninstructions/manual\n3.3 Minor repairs are\nperformed on tools\nand equipment in\naccordance with\nmanufacturer’s\ninstruction/manual\n3.4 Defective tools and\nequipment are\nreported to\nimmediate supervisor\n\n3.1 Principles of 5S\n3.2 Work process and\nprocedures\n3.3 Safety signs and\nsymbols\n3.4 General OSH\nprinciples and\nlegislation\n3.5 Environmental\nrequirements\nrelative to work\nsafety\n\n3.1 Basic\ncommunication\nskills\n3.2 Interpersonal\nskills\n3.3 Reading skills\nrequired to\ninterpret\ninstructions\n\n4. Follow\nstandardiz