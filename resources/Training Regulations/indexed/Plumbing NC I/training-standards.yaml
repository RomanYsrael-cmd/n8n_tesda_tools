  "source_section_text": "SECTION 3 TRAINING ARRANGEMENTS\n46 - 62\n3.1 Curriculum Design\n-\nBasic Competencies\n-\nCommon Competencies\n-\nCore Competencies\n46\n47 - 52\n53 - 56\n57 - 62\n3.2 Training Delivery\n63 - 64\n3.3 Trainee Entry Requirements\n71\n3.4 List of Tools, Equipment and Materials\n66 - 67\n3.5 Training Facilities\n68\n3.6 Trainers’ Qualifications\n68\n3.7 Institutional Assessment\n68\nSECTION 4 ASSESSMENT AND\n CERTIFICATION ARRANGEMENTS\n69 - 70\n\nCOMPETENCY MAP\n71\nDEFINITION OF TERMS\n\nACKNOWLEDGEMENTS\n72 - 73\n\n74 - 75\n\n--- PDF PAGE 3 ---\n\n--- PDF PAGE 4 ---\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 1\n\nTRAINING REGULATIONS FOR PLUMBING NC I\n\nSECTION 1 PLUMBING NC I QUALIFICATION\n\nThe PLUMBING NC I Qualification consists of competencies that a person must\nachieve in installing a single plumbing unit which includes one unit each of water meter,\nwater closet, lavatory, shower with single point water heater and kitchen sink. It also\nincludes installing floor drains and faucets.\n\nThis Qualification is packaged from the competency map of Construction – Civil\nWorks sub-sector as shown in Annex A.\n\nThe Units of Competency comprising this Qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n\nUnits of Competency\n500311101\nReceive and respond to workplace communication\n500311102\nWork with others\n500311103\nDemonstrate work values\n500311104\nPractice housekeeping procedures\n\nCODE NO.\nCOMMON COMPETENCIES\n\nUnits of Competency\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of instruction\nCON311203\nPerform mensuration and calculations\nCON311204\nMaintain tools and equipment\n\nCODE NO.\nCORE COMPETENCIES\n\nUnits of Competency\nCON712344\nPrepare Plumbing Layout\nCON712345\nMake Piping Joints and Connections\nCON712346\nCON712347\nPerform Minor Construction Work\nInstall and Assemble Single Plumbing Unit\n\nA person who has achieved this Qualification is competent to be a:\n\n Plumber I\n\n--- PDF PAGE 5 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 2\n\nSECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details of the contents of the core units of competency required in\nPLUMBING NC I. These units of competency are categorized into basic, common and\ncore competencies.\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nRECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION (Communicate clearly)\nUNIT CODE\n:\n500311101\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required\nto receive, respond and act on verbal and written\ncommunication.\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Follow routine\nspoken\nmessages\n1.1 Required information\nis gathered by\nlistening attentively\nand correctly\ninterpreting or\nunderstanding\ninformation/\ninstructions\n1.2 Instructions/\ninformation are\nproperly recorded\n1.3 Instructions are acted\nupon immediately in\naccordance with\ninformation received\n1.4 Clarification is sought\nfrom workplace\nsupervisor on all\noccasions when any\ninstruction/information\nis not clear\n1.1 Knowledge of\norganizational\npolicies/guidelines\nin regard to\nprocessing\ninternal/external\ninformation\n1.2 Ethical work\npractices in\nhandling\ncommunications\n1.3 Communication\nprocess\n1.1 Conciseness in\nreceiving and\nclarifying\nmessages/inform\nation/communica\ntion\n1.2 Accuracy in\nrecording\nmessages/inform\nation\n1.3 Communication\nskills\n2. Perform\nworkplace\nduties\nfollowing\nwritten notices\n2.1 Written notices and\ninstructions are\nread and interpreted\ncorrectly in\naccordance with\norganizational\nguidelines\n2.2 Routine written\ninstruction are\nfollowed in sequence\n2.3 Feedback is given to\nworkplace supervisor\nbased on the\ninstructions/informati\non received\n2.1 Knowledge of\norganizational\npolicies/guidelines\nin regard to\nprocessing\ninternal/external\ninformation\n2.2 Ethical work\npractices in\nhandling\ncommunications\n2.3 Communication\nprocess\n2.1 Conciseness in\nreceiving and\nclarifying\nmessages/infor\nmation/communi\ncation\n2.2 Accuracy in\nrecording\nmessages/\ninformation\n\n--- PDF PAGE 6 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 3\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nMay include :\n1.1. Handwritten and printed material\n1.2. Internal memos\n1.3. External communications\n1.4. Electronic mail\n1.5. Briefing notes\n1.6. General correspondence\n1.7. Marketing materials\n1.8. Journal articles\n\n2. Organizational\nGuidelines\nMay include:\n2.1. Information documentation procedures\n2.2. Company policies and procedures\n2.3. Organization manuals\n2.4. Service manual\n\n--- PDF PAGE 7 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 4\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1\nDemonstrated knowledge of organizational procedures for\nhandling verbal and written communications\n1.2\nReceived and acted on verbal messages and instructions\n1.3\nDemonstrated competency in recording instructions/information\n2. Resource Implications\nThe following resources should be provided:\n2.1 Pens\n2.2 Note pads\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Direct Observation\n3.2 Oral interview\n3.3 Written Evaluation\n3.4 Third Party Report\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the actual\nworkplace or simulation environment in TESDA accredited\ninstitutions\n\n--- PDF PAGE 8 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 5\n\nUNIT OF COMPETENCY :\nWORK WITH OTHERS (Collaborate with others in work\ngroup activities)\nUNIT CODE\n:\n500311102\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required\nto develop workplace relationship and contribute in\nworkplace activities.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop\neffective\nworkplace\nrelationship\n1.1 Duties and\nresponsibilities are\ndone in a positive\nmanner to promote\ncooperation and good\nrelationship\n1.2 Assistance is sought\nfrom workgroup\nwhen difficulties arise\nand addressed\nthrough discussions\n1.3 Feedback provided\nby others in the team\nis encouraged,\nacknowledged and\nacted upon\n1.4 Differences in\npersonal values and\nbeliefs are respected\nand acknowledged in\nthe development\n1.1 Reasons why\ncooperation and\ngood relationships\nare important\n1.2 Knowledge of the\norganization’s\npolicies, plans and\nprocedures\n1.3 Understanding how\nto elicit and\ninterpret feedback\n1.4 Knowledge of\nworkgroup\nmember’s\nresponsibilities and\nduties\n1.5 Importance of\ndemonstrating\nrespect and\nempathy in dealings\nwith colleagues\n1.6 Understanding of\nhow to identify and\nprioritize personal\ndevelopment\nopportunities and\noptions\n1.1 Ability to read\nand understand\nthe\norganization’s\npolicies and work\nprocedures\n1.2 Write simple\ninstructions for\nparticular routine\ntasks\n1.3 Interpret\ninformation\ngained from\ncorrespondence\n1.4 Communication\nskills to request\nadvice, receive\nfeedback and\nwork with a team\n1.5 Planning skills to\norganized work\npriorities and\narrangement\n1.6 Technology skills\nincluding the\nability to select\nand use\ntechnology\nappropriate to a\ntask\n1.7 Ability to relate to\npeople from a\nrange of social,\ncultural and\nethnic\nbackgrounds.\n\n--- PDF PAGE 9 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 6\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Contribute to\nwork group\nactivities\n2.1 Support is provided\nto team members to\nensure workgroup\ngoals are met\n2.2 Constructive\ncontributions to\nworkgroup goals and\ntasks are made\naccording to\norganizational\nrequirements\n2.3 Information relevant\nto work is shared with\nteam members to\nensure designated\ngoals are met\n2.1 Reasons why\ncooperation and\ngood relationships\nare important\n2.2 Knowledge of the\norganization’s\npolicies, plans and\nprocedures\n2.3 Understanding how\nto elicit and\ninterpret feedback\n2.4 Knowledge of\nworkgroup\nmember’s\nresponsibilities and\nduties\n2.5 Importance of\ndemonstrating\nrespect and\nempathy in\ndealings with\ncolleagues\n2.6 Understanding of\nhow to identify and\nprioritize personal\ndevelopment\nopportunities and\noptions\n2.1 Ability to read\nand understand\nthe\norganization’s\npolicies and\nwork procedures\n2.2 Write simple\ninstructions for\nparticular routine\ntasks\n2.3 Interpret\ninformation\ngained from\ncorrespondence\n2.4 Communication\nskills to request\nadvice, receive\nfeedback and\nwork with a team\n2.5 Planning skills to\norganized work\npriorities and\narrangement\n2.6 Technology\nskills including\nthe ability to\nselect and use\ntechnology\nappropriate to a\ntask\n2.7 Ability to relate\nto people from a\nrange of social,\ncultural and\nethnic\nbackgrounds.\n\n--- PDF PAGE 10 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 7\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements including OHS\n1.5 Code of conduct\n\n2. Work group\n2.1 Supervisor or manager\n2.2 Peers/work colleagues\n2.3 Other members of the organization\n\n3. Feedback on\nperformance\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues and clients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring service delivery\n\n4. Providing support\nto team members\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n\n5. Organizational\nrequirements\n\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes and standards\n\n--- PDF PAGE 11 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 8\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\n\nAssessment requires evidence that the candidate:\n1.1.\nProvided support to team members to ensure goals are met\n1.2.\nActed on feedback from clients and colleagues\n1.3.\nAccessed learning opportunities to extend own personal work\ncompetencies to enhance team goals and outcomes\n\n2. Resource\nImplications\nThe following resources should be provided:\n2.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2.\nMaterials relevant to the proposed activity or task\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1.\nDirect observations of work activities of the individual member in\nrelation to the work activities of the group\n3.2.\nObservation of simulation and/or role play involving the\nparticipation of individual member to the attainment of\norganizational goal\n3.3.\nCase studies and scenarios as a basis for discussion of issues and\nstrategies\n\n4. Context for\nAssessment\n4.1.\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n4.2.\nAssessment shall be observed while task are being undertaken\nwhether individually or in group\n\n--- PDF PAGE 12 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 9\n\nUNIT OF COMPETENCY :\nDEMONSTRATE WORK VALUES\nUNIT CODE\n:\n500311103\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills, and attitude in\ndemonstrating proper work values.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Define the\npurpose of\nwork\n1.1 One’s unique sense of\npurpose for working\nand the why’s of work\nare identified, reflected\non and clearly defined\nfor one’s development\nas a person and as a\nmember of society\n1.2 Personal mission is in\nharmony with\ncompany’s values\n\n1.1 Work values and\nethics\n1.2 Company\nperformance and\nethical standards\n1.3 Company policies\nand guidelines\n1.4 Fundamental rights\nat work including\ngender sensitivity\n1.5 Work\nresponsibilities/job\nfunctions\n1.6 Corporate social\nresponsibilities\n1.7 Company code of\nconduct/values\n1.8 Balancing work and\nfamily\nresponsibilities\n\n1.1 Interpersonal\nskills\n1.2 Communication\nskills\n1.3 Self awareness,\nunderstanding\nand acceptance\n1.4 Application of\ngood manners\nand right conduct\n\n2. Apply work\nvalues/ethics\n2.1 Work values/ethics/\nconcepts are\nclassified and\nreaffirmed in\naccordance with the\ntransparent company\nethical standards,\npolicies and\nguidelines.\n\n2.1 Work values and\nethics\n2.2 Company\nperformance and\nethical standards\n2.3 Company policies\nand guidelines\n\n2.1 Interpersonal\nskills\n2.2 Communication\nskills\n2.3 Self- awareness,\nunderstanding\nand acceptance\n2.4 Application of\ngood manners\nand right conduct\n\n--- PDF PAGE 13 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 10\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n\n2.2 Work practices are\nundertaken in\ncompliance with\nindustry work ethical\nstandards,\norganizational policy\nand guidelines\n2.3 Personal behavior and\nrelationships with co-\nworkers and/or clients\nare conducted in\naccordance with\nethical standards,\npolicy and guidelines.\n2.4 Company resources\nare used in\naccordance with\ntransparent company\nethical standard,\npolicies and guidelines\n2.4 Fundamental rights\nat work including\ngender sensitivity\n2.5 Work\nresponsibilities/job\nfunctions\n2.6 Corporate social\nresponsibilities\n2.7 Company code of\nconduct/values\n2.8 Balancing work and\nfamily\nresponsibilities\n\n3. Deal with\nethical\nproblems\n3.1 Company ethical\nstandards,\norganizational policy\nand guidelines on the\nprevention and\nreporting of unethical\nconduct are accessed\nand applied in\naccordance with\ntransparent company\nethical standard,\npolicies and\nguidelines.\n3.2 Work incidents/\nsituations are\nreported and/or\nresolved in\naccordance with\ncompany\nprotocol/guidelines.\n3.3 Resolution and/or\nreferral of ethical\nproblems identified are\nused as learning\nopportunities.\n3.1 Work values and\nethics\n3.2 Company\nperformance and\nethical standards\n3.3 Company policies\nand guidelines\n3.4 Fundamental rights\nat work including\ngender sensitivity\n3.5 Work\nresponsibilities/job\nfunctions\n3.6 Corporate social\nresponsibilities\n3.7 Company code of\nconduct/values\n3.8 Balancing work\nand family\nresponsibilities\n\n3.1 Interpersonal\nskills\n3.2 Communication\nskills\n3.3 Self- awareness,\nunderstanding\nand acceptance\n3.4 Application of\ngood manners\nand right\nconduct\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 11\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4. Maintain\nintegrity of\nconduct in the\nworkplace\n4.1 Personal work\npractices and values\nare demonstrated\nconsistently with\nacceptable ethical\nconduct and\ncompany’s core\nvalues.\n4.2 Instructions to co-\nworkers are provided\nbased on ethical,\nlawful and reasonable\ndirectives.\n4.3 Company\nvalues/practices are\nshared with co-\nworkers using\nappropriate behavior\nand language.\n\n4.1 Work values and\nethics\n4.2 Company\nperformance and\nethical standards\n4.3 Company policies\nand guidelines\n4.4 Fundamental rights\nat work including\ngender sensitivity\n4.5 Work\nresponsibilities/job\nfunctions\n4.6 Corporate social\nresponsibilities\n4.7 Company code of\nconduct/values\n4.8 Balancing work and\nfamily\nresponsibilities\n\n4.1 Interpersonal\nskills\n4.2 Communication\nskills\n4.3 Self- awareness,\nunderstanding\nand acceptance\n4.4 Application of\ngood manners\nand right conduct\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 12\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work\nvalues/ethics/\nconcepts\nMay include:\n1.1\nCommitment/ Dedication\n1.2\nSense of urgency\n1.3\nSense of purpose\n1.4\nLove for work\n1.5\nHigh motivation\n1.6\nOrderliness\n1.7\nReliability\n1.8\nCompetence\n1.9\nDependability\n1.10 Goal-oriented\n1.11 Sense of responsibility\n1.12 Being knowledgeable\n1.13 Loyalty to work/company\n1.14 Sensitivity to others\n1.15 Compassion/Caring attitude\n1.16 Balancing between family and work\n1.17 Pakikisama\n1.18 Bayanihan spirit/teamwork\n1.19 Sense of nationalism\n2. Work practices\n2.1 Quality of work\n2.2 Punctuality\n2.3 Efficiency\n2.4 Effectiveness\n2.5 Productivity\n2.6 Resourcefulness\n2.7 Innovativeness/Creativity\n2.8 Cost conciousness\n2.9 5S\n2.10 Attention to details\n3. Incidents/situations\n3.1 Violent/intensed dispute or argument\n3.2 Gambling\n3.3 Use of prohibited substances\n3.4 Pilferages\n3.5 Damage to person or property\n3.6 Vandalism\n3.7 Falsification\n3.8 Bribery\n3.9 Sexual Harassment\n3.10 Blackmail\n4. 4. Company\nresources\n4.1 Consumable materials\n4.2 Equipment/Machineries\n4.3 Human\n4.4 Time\n4.5\nFinancial resources\n5. Instructions\n5.1 Verbal\n5.2 Written\n\n--- PDF PAGE 16 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 13\n\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Defined one’s unique sense of purpose for working\n1.2 Clarified and affirmed work values/ethics/concepts consistently in the\nworkplace\n1.3 Demonstrated work practices satisfactorily and consistently in\ncompliance with industry work ethical standards, organizational policy\nand guidelines\n1.4 Demonstrated personal behavior and relationships with co-workers\nand/or clients consistent with ethical standards, policy and guidelines\n1.5 Used company resources in accordance with company ethical\nstandard, policies and guidelines.\n1.6 Followed company ethical standards, organizational policy and\nguidelines on the prevention and reporting of unethical\nconduct/behavior\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Workplace or assessment location\n2.2 Case studies/Scenarios\n\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Portfolio Assessment\n3.2 Interview\n3.3 Third Party Reports\n\n4. Context for\nAssessment\n4.1 Competency may be assessed in the work place or in a simulated\nwork place setting\n\n--- PDF PAGE 17 ---\nTESDA-SOP-QSO-01-F08\nTR- Plumbing NC I (Amended) Promulgated October 2014\n 14\n\nUNIT OF COMPETENCY :\nPRACTICE HOUSEKEEPING PROCEDURES\n\nUNIT CODE\n:\n500311104\n\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required in\napplying the basic housekeeping procedures.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are elaborated\nin the Range of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Sort and\nremove\nunnecessary\nitems\n1.1 Reusable, recyclable\nmaterials are sorted\nin accordance with\ncompany/office\nprocedures\n1.2 Unnecessary items\nare removed and\ndisposed of in\naccordance with\ncompany or office\nprocedures\n1.1 Principles of 5S\n1.2 Work process and\nprocedur