      "definition": "refers to materials used to decrease the body temperature or keep the body warm. 10. Holistic – refers to integrated wholes or complete systems (of the physical, mental, emotional and spiritual aspects of the individual). 11. Framework – refers to the basic supporting idea/concept/theory. 12. Theoretical Framework – refers to the synthesis of several theories and principles which serve as basis and structure to concepts and practice. 13. Massage Therapy – refers to techniques designed to enhance overall body awareness, stretch and relax muscles, relieve muscle pain and spasms, improve range of motion, improve circulation and relax the body and mind."
