      "text": "NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS 4.1.1 The attain the National Qualification of MASSAGE THERAPY NC II the candidate must demonstrate competence covering all the units of competency listed in Section 1. A successful candidate shall be awarded a National Certificate by the TESDA Director General 4.1.2 Assessment shall focus on the core units of competency. The basic and common units are assessed concurrently with the core units. 4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, and work or life experience may apply for recognition in a particular qualification through competency assessment. 4.1.4 The following are qualified to apply for assessment: 4.1.4.1 Graduating students/trainees of WTR-registered programs, graduates of NTR programs or graduates of formal/non-formal/informal including enterprise-based training programs related to massage therapy. 4.1.4.2 Experienced workers in healthcare service industry 4.1.5 Holders of National Certificate (NC) for the abovementioned qualifications are required to undergo re-assessment under the amended Training Regulations (TR) upon expiration of their NC or COC. 4.1.6 Conduct of assessment and issuance of certificates shall follow the procedures manual and implementing guidelines developed for the purpose. 4.1.7 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the “Philippine TVET Competency Assessment and Certification System (PTCACS)”."
