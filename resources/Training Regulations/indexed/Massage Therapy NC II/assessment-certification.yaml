    {
      "number": "4.2",
      "text": "COMPETENCY ASSESSMENT REQUISITE Promulgated February 2017 - 154 - 4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre- assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment. This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment 4.2.2 Accredited Assessment Center. Only a TESDA-accredited assessment center is authorized to conduct competency assessment. The center has to undergo a quality assured procedure for accreditation before it is authorized by TESDA to manage the assessment for National Certification. The Accredited Assessment Center may partner with a Healthcare Facility and enter into a Memorandum of Agreement for venue use. 4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification. 4.2.3.1 Qualification of Competency Assessors For Trainer-Assessor • Holder of National TVET Trainer Certificate Level I (NTTC) on Massage Therapy NC II with at least three (3) years work experience in the health care industry For Industry-Assessor • Holder of National Certificate in Massage Therapy NC II • Holder of Certificate of Competency (COC) in Conduct Competency under the Trainers Methodology Level I (TM I) or completed TOT from DOH • Must have at least three (3) years work experience in the health care industry Promulgated February 2017 - 155 -"
