e Therapy NC II(Amended) Promulgated February 2017 - 156 - Provide care and support to infants and toddlers Provide care and support to children Foster social, intellectual, creative and emotional development of children Foster the physical development of children Provide care and support to elderly Provide care and support to people with special needs Maintain a healthy and safe environment Respond to emergency Clean living room, dining room, bedrooms, toilet and bathroom Wash and iron clothes, linen and fabric Prepare hot and cold meals/food Prepare and maintain beds Collect and maintain linen stocks at end- users location Assist in patient mobility Assist in transporting patients Assist in bio- psychosocial support care of patients Handle waste in a health care environment Install biomedical equipment Perform corrective maintenance on biomedical equipment Perform preventive maintenance on biomedical equipment Repair biomedical equipment Assess and refer biomedical equipment Perform basic life support Maintain life support equipment and resources Implement safe access and extrication procedures in an emergency Manage request for an ambulance service Allocate ambulance service resources Coordinate emergency resources Deliver basic ambulance communication skills Supervise on-road operations Manage the scene of an emergency Manage the scene of a special event Manage routine scene Deliver pre-hospital patient care Deliver intensive pre- hospital patient care Manage ambulance operations Transport emergency patients Transport non- emergency patients Drive vehicles under operational conditions Develop massage practice Perform client consultation Perform body massage Maintain and organize tools, equipment, supplies and work area Work within a community development framework Prepare for work in the community service industry Support community resources Provide primary/residential care Support community participation Recruit and coordinate volunteers Respond holistically to client issues Develop and provide health education program in the community Implement health promotion and community interventions --- PDF PAGE 159 --- TR Massage Therapy NC II(Amended) Promulgated February 2017 - 157 - 1. Body Mechanics – refers to using the body in an efficient and careful way 2. Hazardous waste – refers to the items contaminated with blood, body fluids or body substances that may be harmful to others 3. Infection control - is the discipline concerned with preventing nosocomial or healthcare- associated infection, a practical (rather than academic) sub-discipline of epidemiology. It is an essential, though often underrecognized and under supported, part of the infrastructure of health care. Infection control and hospital epidemiology are akin to public health practice, practiced within the confines of a particular health-care delivery system rather than directed at society as a whole. Anti-infective agents include antibiotics, antibacterials, antifungals, antivirals and antiprotozoals.[1] Infection control addresses factors related to the spread of infections within the healthcare setting (whether patient-to-patient, from patients to staff and from staff to patients, or among-staff), including prevention (via hand hygiene/hand washing, cleaning/disinfection/sterilization, vaccination, surveillance), monitoring/investigation of demonstrated or suspected spread of infection within a particular health-care setting (surveillance and outbreak investigation), and management (interruption of outbreaks). It is on this basis that the common title being adopted within health care is \"infection prevention and control.\" 4. OSH – refers to Occupational Safety and Health 5. First Aid Kit – refers to emergency tools used to administer treatment to injured or sick person 6. Linen – refers to material used in draping 7. Trolley – refers to device used to transport materials 8. PPE - refers to Personal Protective Equipment 9. Thermal blanket – refers to materials used to decrease the body temperature or keep the body warm."
