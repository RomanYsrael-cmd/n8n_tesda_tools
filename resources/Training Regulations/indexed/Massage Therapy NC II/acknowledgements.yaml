    {
      "source_text": "70 - EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical Aspects of Competency"
    },
    {
      "source_text": "Assessment requires evidence that the candidate: 1.1 Obtained and recorded the necessary client information. 1.2 Determined and assessed the client’s physical condition using standard tools and equipment for the required massage treatment. 1.3Conducted accurate analysis and communication of results. 2. Resource Implications The following resources must be provided: 2.1 Relevant reference or health journals 2.2 Materials, supplies, tools and equipment relevant to the proposed activity or task 2.3 Appropriate assessment venue and environment 2.4 Skilled assessors 3 Methods of Assessment Competency may be assessed through: 3.1 Written examinations 3.2 Demonstration with oral questioning 3.3 Observation and return demonstration 3.4 Interview 4 Context of Assessment 4.1 Competency may be assessed in actual workplace or at designated TESDA Accredited Assessment Center."
    },
