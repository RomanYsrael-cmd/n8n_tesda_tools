      "source_text": "EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical Aspects of Competency"
    },
    {
      "source_text": "Assessment requires evidence that the candidate: 1. Planned massage program of the client. 2. Prepared work area and massage implements. 3. Identified and demonstrated standard massage manipulations/strokes. 4. Performed proper body mechanics. 5. Performed proper draping techniques. 6. Performed aftercare activities. 7. Provided aftercare advices. 2. Resource Implications The following resources must be provided: 2.1. An appropriately stocked and equipped clinic or simulated massage environment 2.2. Relevant text or manuals 2.3. Relevant paper-based assessment instruments 2.4. Appropriate assessment venue 2.5. Skilled assessors 3. Methods of Assessment Competency may be assessed through: 3.1. Written examinations 3.2. Demonstration with questioning (written assignment with practical demonstration) 3.3. Observation with questioning (impression from assessment notes or simulated assessments) 3.4. Interview/oral questioning 4. Context of Assessment 4.1 Competency may be assessed in actual workplace or at the designated TESDA Accredited Assessment Center."
