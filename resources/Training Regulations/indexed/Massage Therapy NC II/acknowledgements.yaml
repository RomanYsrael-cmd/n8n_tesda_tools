      "source_text": "25 - EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical Aspects of competency Assessment requires evidence that the candidate: 1.1 Maintained a professional image. 1.2 Interpreted client requirements from information contained in the client brief and/or assignment instructions. 1.3 Dealt successfully with a variety of client interactions. 1.4 Monitored and acted on varying client or customer needs. 1.5 Met client requirements. 1.6 Built credibility with customers/clients. 2. Resource Implications The following resources should be provided: 2.1 Assessment centers/venues 2.2 Accredited assessors 2.3 Evaluation reports 2.4 Access to a relevant venue, equipment and materials 2.5 Assignment instructions 2.6 Logbooks 2.7 Operational manuals and makers’/customers’ instructions (if relevant) 2.8 Assessment Instruments, including personal planner and assessment record book 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Written Test/Examination 3.2 Demonstration with questioning 3.3 Observation 4. Context of Assessment 4.1 Competency may be assessed in the actual workplace or at the designated TESDA Accredited Assessment Center."
