  "source_text": "ACKNOWLEDGEMENTS\n158\n\n--- PDF PAGE 5 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 1 -\nTRAINING REGULATIONS FOR\nMASSAGE THERAPY NC II\n\nSECTION 1 MASSAGE THERAPY NC II QUALIFICATION\n\nThe MASSAGE THERAPY NC II Qualification consists of competencies that a person\nmust achieve to work develop massage practice, perform client consultation, perform body\nmassage and maintain and organize tools, equipment, supplies and work area.\n\nThis Qualification is packaged from the competency map of the Human Health/Health Care\nSector as shown in Annex A.\n\nUNIT CODE\nBASIC COMPETENCIES\n500311105\nParticipate in workplace communication\n500311106\nWork in a team environment\n500311107\nPractice career professionalism\n500311108\nPractice occupational health and safety procedures\n\nUNIT CODE\nCOMMON COMPETENCIES\nHHC323201\nMaintain effective relationship with clients\nHCS323202\nImplement and monitor infection control policies and procedures\nHCS323203\nRespond effectively to difficult/challenging behavior\nHCS323204\nApply basic first aid\nHCS323205\nMaintain high standard of client services\n\nUNIT CODE\nCORE COMPETENCIES\nHHC322301\nDevelop massage practice\nHHC322302\nPerform client consultation\nHHC322303\nPerform body massage\nHHC322304\nMaintain and organize tools, equipment, supplies and work area\n\nA person who has achieved this Qualification is competent to be:\n\n Massage Therapist\n\n--- PDF PAGE 6 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 2 -\nSECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details and contents of the units of competency required in\nMASSAGE THERAPY NC II. These units of competency are categorized into basic, common\nand core competencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nPARTICIPATE IN WORKPLACE COMMUNICATION\nUNIT CODE\n:\n500311105\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\ngather, interpret and convey information in response to\nworkplace requirements.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Obtain and\nconvey\nworkplace\ninformation\n1.1 Specific and relevant\ninformation is accessed\nfrom appropriate\nsources\n1.2 Effective questioning,\nactive listening and\nspeaking skills are\nused to gather and\nconvey information\n1.3 Appropriate medium\nis used to transfer\ninformation and ideas\n1.4 Appropriate non-\nverbal communication\nis used\n1.5 Appropriate lines of\ncommunication with\nsupervisors and\ncolleagues are\nidentified and followed\n1.6 Defined workplace\nprocedures for the\nlocation and storage\nof information are\nused\n1.7 Personal interaction is\ncarried out clearly and\nconcisely\n• Procedure of gathering\nworkplace information\n• Techniques in\ngathering information\n• Effective methods of\nconveying information\n• Written communication\nmethods\n• Techniques in\nconveying\ncommunication\n• Different modes of\ncommunication\n• Organizational policies\n• Communication\nprocedures and\nsystems\n• Technology relevant to\nthe enterprise and the\nindividual’s work\nresponsibilities\n• Gathering of\nworkplace\ninformation skills\n• Sourcing of\ninformation skills\n• Sorting of\ninformation skills\n• Obtaining\nworkplace\ninformation skills\n• Conveying\nworkplace\ninformation skills\n• Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nRequirements\n\n--- PDF PAGE 7 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 3 -\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Participate in\nworkplace\nmeetings and\ndiscussions\n2.1 Team meetings are\nattended on time\n2.2 Own opinions are\nclearly expressed and\nthose of others are\nlistened to without\ninterruption\n2.3 Meeting inputs are\nconsistent with the\nmeeting purpose and\nestablished protocols\n2.4 Workplace\ninteractions are\nconducted in a\ncourteous manner\n2.5 Questions about simple\nroutine workplace\nprocedures and\nmatters concerning\nworking conditions of\nemployment are asked\nand responded to\n2.6 Meetings outcomes are\ninterpreted and\nimplemented\n• Effective\ncommunication\n• Different modes of\ncommunication\n• Written communication\n• Organizational policies\n• Communication\nprocedures and\nsystems\n• Decorum in\nparticipating workplace\nmeetings and\ndiscussions\n• Participating skills\nin workplace\nmeetings and\ndiscussions\n• Following simple\nspoken language\n• Completing work\nrelated documents\n• Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n• Relating to people\nof social range in\nthe workplace\n• Gathering and\nproviding\ninformation in\nresponse to\nworkplace\nRequirements\n3. Complete\nrelevant work\nrelated\ndocuments\n3.1 Range of forms\nrelating to conditions of\nemployment are\ncompleted accurately\nand legibly\n3.2 Workplace data is\nrecorded on standard\nworkplace forms and\ndocuments\n3.3 Basic mathematical\nprocesses are used for\nroutine calculations\n3.4 Errors in recording\ninformation on forms/\ndocuments are\nidentified and properly\nacted upon\n3.5 Reporting requirements\nto supervisor are\ncompleted according to\norganizational\nguidelines\n• Methods of\nmaking/completing\nwork related\ndocuments\n• Company standards\nand procedures in\nmaking work related\ndocuments\n• Effective\ncommunication\n• Different modes of\ncommunication\n• Written communication\n• Organizational policies\n• Communication\nprocedures and\nsystems\n• Technology relevant to\nthe enterprise and the\nindividual’s work\nresponsibilities\n• Documenting skills\n• Report writing skills\n• Making/developing\nwork related\ndocuments\n• Perform routine\nworkplace duties\nfollowing simple\nwritten notices\n• Completing work\nrelated documents\n• Estimating,\ncalculating and\nrecording routine\nworkplace\nmeasures\n• 