      "source_text": "40 - EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical Aspects of Competency Assessment requires evidence that the candidate: 1.1. Identified specific manifestations of difficult or challenging behavior and strategies are planned, selected and applied as required 1.2. Maintained personal safety and the safety of others 1.3. Reported incidents, reviewed and responded quickly and effectively to contingencies 1.4. Debriefing mechanisms are used 2. Resource Implications The following resources should be provided: 2.1. Access to relevant workplace or appropriately simulated environment where assessment can take place 2.2. Relevant institutional policy, guidelines, procedures and protocols 2.3. Emergency response procedures and employee support arrangements 3. Methods of Assessment Competency must be assessed through: 3.1. Observation with questioning 3.2. Demonstration with questioning 4. Context of Assessment 4.1. Competency may be assessed in actual workplace or at the designated TESDA Accredited Assessment Center."
