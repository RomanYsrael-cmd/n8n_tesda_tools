      "source_text": "3.6 TRAINER QUALIFICATIONS FOR HUMAN HEALTH/HEALTH CARE SECTOR"
    },
    {
      "source_text": "Trainers who will deliver the training on Massage Therapy NC II should possess the following Qualifications:"
    },
    {
      "source_text": "-- PDF PAGE 154 --- TR Massage Therapy NC II(Amended) Promulgated February 2017"
    },
    {
      "source_text": "150 -  Must be a holder of National TVET Trainers Certificate Level I (NTTC) in Massage Therapy NC II; those who will be delivering programs for the visually impaired must have appropriate training methodology for such kind of client  Must have at least three (3) years work experience in the health service industry"
    },
    {
      "source_text": "3.7 INSTITUTIONAL ASSESSMENT"
    },
    {
      "source_text": "Institutional Assessment is undertaken by trainees in to determine their achievement of units of competency. A certificate of achievement is issued for each unit of competency."
    },
    {
      "source_text": "-- PDF PAGE 155 --- TR Massage Therapy NC II(Amended) Promulgated February 2017"
    },
    {
      "source_text": "153 - SECTION 4 ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": ". Competency Assessment is the process of collecting evidence and making judgments whether competency has been achieved. The purpose of assessment is to confirm that an individual can perform to the standards expected at the workplace as expressed in relevant competency standards."
    },
    {
      "source_text": "The assessment process is based on evidence or information gathered to prove achievement of competencies. The process may be applied to an employable unit(s) of competency in partial fulfillment of the requirements of the national qualification."
    },
    {
      "source_text": "4.1. NATIONAL ASSESSMENT AND CERTIFICATION ARRANGEMENTS"
    },
    {
      "source_text": "4.1.1 The attain the National Qualification of MASSAGE THERAPY NC II the candidate must demonstrate competence covering all the units of competency listed in Section 1. A successful candidate shall be awarded a National Certificate by the TESDA Director General"
    },
    {
      "source_text": "4.1.2 Assessment shall focus on the core units of competency. The basic and common units are assessed concurrently with the core units."
    },
    {
      "source_text": "4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained competencies through education, informal training, and work or life experience may apply for recognition in a particular qualification through competency assessment."
    },
    {
      "source_text": "4.1.4 The following are qualified to apply for assessment: 4.1.4.1 Graduating students/trainees of WTR-registered programs, graduates of NTR programs or graduates of formal/non-formal/informal including enterprise-based training programs related to massage therapy."
    },
    {
      "source_text": "4.1.4.2 Experienced workers in healthcare service industry"
    },
    {
      "source_text": "4.1.5 Holders of National Certificate (NC) for the abovementioned qualifications are required to undergo re-assessment under the amended Training Regulations (TR) upon expiration of their NC or COC. 4.1.6 Conduct of assessment and issuance of certificates shall follow the procedures manual and implementing guidelines developed for the purpose. 4.1.7 The guidelines on assessment and certification are discussed in detail in the “Procedures Manual on Assessment and Certification” and “Guidelines on the Implementation of the “Philippine TVET Competency Assessment and Certification System (PTCACS)”."
    },
    {
      "source_text": "4.2. COMPETENCY ASSESSMENT REQUISITE"
    },
    {
      "source_text": "-- PDF PAGE 156 --- TR Massage Therapy NC II(Amended) Promulgated February 2017"
    },
    {
      "source_text": "154 -"
    },
    {
      "source_text": "4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is accomplished by the candidate prior to actual competency assessment. SAG is a pre- assessment tool to help the candidate and the assessor determine what evidence is available, where gaps exist, including readiness for assessment."
    },
    {
      "source_text": "This document can: a) Identify the candidate’s skills and knowledge b) Highlight gaps in candidate’s skills and knowledge c) Provide critical guidance to the assessor and candidate on the evidence that need to be presented d) Assist the candidate to identify key areas in which practice is needed or additional information or skills that should be gained prior to assessment"
    },
    {
      "source_text": "4.2.2 Accredited Assessment Center. Only a TESDA-accredited assessment center is authorized to conduct competency assessment. The center has to undergo a quality assured procedure for accreditation before it is authorized by TESDA to manage the assessment for National Certification. The Accredited Assessment Center may partner with a Healthcare Facility and enter into a Memorandum of Agreement for venue use."
    },
    {
      "source_text": "4.2.3 Accredited Competency Assessor. Only accredited competency assessor is authorized to conduct assessment of competence. Competency assessors undergo a quality assured system of accreditation procedure before they are authorized by TESDA to assess the competencies of candidates for National Certification."
    },
