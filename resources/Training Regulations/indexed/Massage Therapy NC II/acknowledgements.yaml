      "source_text": "Holder of National Certificate in Massage Therapy NC II"
    },
    {
      "source_text": "Holder of Certificate of Competency (COC) in Conduct Competency under the Trainers Methodology Level I (TM I) or completed TOT from DOH"
    },
    {
      "source_text": "Must have at least three (3) years work experience in the health care industry"
