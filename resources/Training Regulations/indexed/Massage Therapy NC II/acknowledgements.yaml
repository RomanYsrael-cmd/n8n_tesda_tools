      "source_text": "85 - SECTION 3 TRAINING ARRANGEMENTSS"
    },
    {
      "source_text": "These standards are set to provide Technical and Vocational Education and Training (TVET) providers with information and other important requirements to consider when designing and delivering inclusive training programs for MASSAGE THERAPY NC II."
    },
    {
      "source_text": "They include information on curriculum design; training delivery; trainee entry requirements; tools and equipment; training facilities; and trainer’s qualification and trainer’s qualification."
    },
    {
      "source_text": "RA 7277 An act providing for the rehabilitation, self-development and self-reliance of disabled person and their integration into the mainstream of society and for other purposes."
    },
    {
      "source_text": "As provided in this act under Chapter 2 Education Section 12. Access to Quality Education. The State shall ensure that disabled persons are provided with adequate access to quality education and ample opportunities to develop their skills. It shall take appropriate steps to make such education accessible to all disabled persons. It shall be unlawful for any learning institutions to deny a disabled person admission to any course it offers by reason of handicap or disability. The State shall take into consideration the special requirements of disabled persons in the formulation of education policies and program. It shall encourage learning institutions to take into account the special needs of disabled persons with respect to the use of school facilities, class schedules, physical education requirements and other pertinent consideration. The State shall also promote the provision by learning institutions, of auxiliary services that will facilitate the learning process for disabled persons."
    },
    {
      "source_text": "Section 13. Assistance to Disabled Students. The State shall provide financial assistance to economically marginalized but deserving disabled students pursuing post- secondary or tertiary education. Such assistance may be in the form of scholarship grants, student loan programs, subsidies and other incentives to qualified disabled students in both public and private schools. At least five percent (5%) of the allocation for the Private Education Student Financial Assistance Program created by virtue of R.A. 6725 shall be set aside for disabled students pursuing vocational or technical and degree courses."
    },
    {
      "source_text": "3.1 CURRRICULUM DESIGN"
    },
    {
      "source_text": "TESDA shall provide training on the development of competency-based curricula to enable training providers develop their own curricula with the components mentioned below."
    },
    {
      "source_text": "Delivery of knowledge requirements for the basic, common and core units of competency specifically in the areas of mathematics, science/technology, communication/language and other academic subjects shall be contextualized. To this end, TVET providers shall develop a Contextual Learning Matrix (CLM) to include Technology, Science, Math, English/Communication, Safety and Environment concerns. Also included would be green technology, issues on health and drugs and catering to persons with disabilities (PWD’s)."
    },
