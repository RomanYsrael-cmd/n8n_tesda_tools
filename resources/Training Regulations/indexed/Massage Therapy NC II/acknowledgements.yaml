torage of tools, equipment and supplies\nin the workplace\n• Demonstration\nRole play\n• Video review\n• OJT/SIT\n• Observation\n• Oral\nexamination\n• Evaluation\n• Return demo\n\n• Discuss and explain waste segregation\nand disposal\n• Demonstrate waste segregation and\ndisposal\n• Demonstration\nRole play\n• Video review\n• Observation\n• Oral\nexamination\n• Return demo\n\n1.3 Maintain\ntools and\nequipment\n• Discuss and explain procedures in\nmaintenance of tools, equipment and\nsupplies\n• Discuss and explain inventory and records\nmanagement\n• Demonstrate proper procedure in the\nmaintenance of tools, equipment and\nsupplies and perform inventory and\nrecords management\n• Demonstration\nRole play\n• Video review\n•\n• Observation\n• Oral\nexamination\n• Evaluation\n• Return demo\n\n--- PDF PAGE 150 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 146 -\n3.2 TRAINING DELIVERY\n\n1.\nThe delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written to\nindustry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology (Video Conferencing, Webinar,\netc).\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2.\nThe competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities and their variations/\ncomponents may be adopted singly or in combination with other modalities when\ndesigning and delivering training programs:\n\n2.1. Institution- Based:\n\nClassroom-based or school-based training conducted entirely within the school\nor center, with classroom and/or laboratory components.\n•\nDual Training System (DTS) / Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\n•\nSupervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\nthe deployment of trainees in the workplace is adhered to training programs\nagreed by the institution and enterprise and status and progress of trainees\nare closely monitored by the training institutions to prevent opportunity for\nwork exploitation.\n•\nProject-based instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 151 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 147 -\n\n2.2. Enterprise-Based:\n\nEnterprise-based training may also be taken to mean a school or training center\nwith one or more partner enterprise or an enterprise or group of enterprises\nsetting up a common training facility or partnering with a school or training\ncenter.\n\n•\nEnterprise-based Training - where training is implemented within the\ncompany in accordance with the requirements of the specific company.\n•\nApprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticesable\noccupation\n\n2.3. Community-Based –refers to a short program conducted or coordinated by\nNGOs, LGUs, training centers and other TVET providers which are intended to\naddress the specific needs of a community. Such programs are usually\nconducted in informal settings such as barangay hall, basketball courts and\nother available venues in a community. These programs can also be mobile\ntraining programs (MTP).\n\n3.2 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who want to enroll in this course should possess the following\nrequirements:\n\n Must have finished 10 years of basic education or Alternative Learning System (ALS)\nequivalent\n Must be able to communicate both orally and in writing\n Can perform basic mathematical computations\n\n--- PDF PAGE 152 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 148 -\n3.3 TOOLS, MATERIALS AND EQUIPMENT\nMASSAGE THERAPY NC II\n\nRecommended list of tools, equipment and materials for the training of a maximum of 15\ntrainees for the MASSAGE THERAPY NC II are as follows:\n\n3.4 TOOLS, MATERIALS AND EQUIPMENT\n\nRecommended list of tools, equipment and materials for the training of a minimum of 15\ntrainees are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\n5 pcs\nAneroid\nSphygmomanometer\n5 pcs.\nMassage Table (L-\n1.83 cm, W- 0.75\ncm, H- 0.60 cm)\n5 pcs.\nFitted sheets (white)\n5 pcs\nStethoscope\n1 pc.\nMassage chair\n30 pcs.\nLarge bath towels\n(white)\n5 pcs\nDigital Thermometer\n1 pc.\nLCD projector\n30 pcs.\nFace towels (white)\n1 pc.\n*Anatomical dummy\n1 pc.\nWhiteboard/\nBlackboard\n30 pcs.\nFoot towel (white)\n1 pc.\n*Talking\nsphygmomanometer\n1 unit\nMusic/DVD player\nand portable PA\nsystem\n30 pcs.\nHand towels (white)\n2 pcs.\n*Talking thermometer\n\n5 pcs.\ncylindrical bolster\npillow with case\n(white)\n1\nream\n*Braille labeling