      "source_text": "May include: 1.1 Stance 1.2 Posture 1.3 Body Language 1.4 Demeanor 1.5 Grooming 2. Employer standards May include: 2.1 Standing Orders 2.2 Efficiency 2.3 Client turn-around time 3. Client requirements May include: 3.1 Assignment instructions (e.g. right products) 3.2 Post Orders 3.3 Scope to modify instructions/orders in light of changed situations 4. Assignment instructions May include: 4.1 Writing 4.2 Verbally 4.3 Electronically 5. Client’s needs and requirements May include: 5.1 Review of the client brief and/or assignment instructions 5.2 Discussion with the client/customer 6. Appropriate action May include: 6.1 Implementing required changes 6.2 Referral to appropriate employer personnel 6.3 Clarification of client needs and instructions 7. Clients May include: All members of the public"
