    },
    {
      "source_text": "May include: 3.1 Code of Ethics for Massage Therapists 3.2 Children in the workplace 3.3 Codes of conduct 3.4 Continuing professional education 3.5 Discrimination 3.6 Dignity of risk 3.7 Duty of care 3.8 Human rights 3.9 Informed consent 3.10 Insurance requirements 3.11 Mandatory reporting 3.12 Practitioner/client boundaries 3.13 Privacy, confidentiality and disclosure 3.14 Records management 3.15 Work role boundaries – responsibilities and limitations 3.16 Work health and safety 4. Sciences relevant to massage"
