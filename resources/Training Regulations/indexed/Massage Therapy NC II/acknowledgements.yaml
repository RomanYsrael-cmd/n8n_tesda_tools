      "source_text": "66 - RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Assessment procedures May include: 1.1 Personal Information 1.2 Client Self Evaluation 1.3 Health Records 1.4 Vital Signs 1.5 Visual Assessment 1.6 Palpation 1.7 Sensory Assessment 1.8 Range of Motion 2. Ethical and legal norms May include: 2.1 Philippine Laws Governing Massage Therapy 2.2 Code of Ethics for Massage Therapy in the Philippines 2.3 International Codes on Massage Practice 2.4 Company Ethical Standards 3. Client personal information May include: 3.1 Age 3.2 Gender 3.3 Biometrics 3.4 Constitution/health status 3.5 Religion 3.6 Lifestyle 3.7 Occupation 3.8 Personal history 3.9 Diet 3.10 Values and attitudes 3.11 Balance of rest and activity 3.12 Physical environment 3.13 Social environment 3.14 Client expectations 4. Documentation forms May include: 4.1 Client Intake Form 4.2 Subjective, Objective, Assessment, Plan (SOAP) Form 4.3 Client Data Base 4.4 Client Approval or Waiver 4.5 Massage Session Summary Form Note: Special devices for therapists with disability 5. Documentation tools May include: 5.1 writing instruments 5.2 recording instruments 5.3 mobile phone application 5.4 electronic tablet 5.5 computer Note: special devices for therapists with disability"
    },
    {
      "source_text": "-- PDF PAGE 71 --- TR Massage Therapy NC II(Amended) Promulgated February 2017"
    },
    {
      "source_text": "67 - VARIABLE RANGE 6. Client visual assessment May include: 6.1 Skin Color 6.2 Nail Beds 6.3 Skin Condition 6.4 Bone Structure 6.5 Breathing 6.6 Gait Note: Special assistance for therapists with disability 7. Client health history May include: 7.1 Past and present illness 7.2 Compliance to on-going treatment 7.3 Current medications 7.4 Medical Certificate/Referrals 7.5 Substance abuse 7.6 Allergies 7.7 Clinical records 8. Vital signs and appropriate instruments May include: 8.1 Temperature 8.1.1 Digital thermometer 8.2 Blood Pressure 8.2.1 Aneroid Sphygmomanometer 8.2.2 Stethoscope 8.2.3 Analog wristwatch 8.3 Heart Rate 8.3.1 Analog wristwatch 8.4 Respiratory Rate 8.4.1 Analog wristwatch 8.5 Range of Motion 8.5.1 Goniometer Note: Special assistance and devices for therapists with visual impairment 9. Palpation of affected areas May include: 9.1 Body Regions 9.1.1 Head and Neck 9.1.2 Trunk 9.1.3 Upper Extremities 9.1.4 Lower Extremities 9.2 Histology (subcutaneous) 9.2.1 Temperature (warm or cold) 9.2.2 Tenderness 9.2.3 Pain (Myofascial Pain Syndrome, Knots, Nodules) 9.2.4 Spasms 9.2.5 Soreness 9.2.6 Swelling"
    },
    {
      "source_text": "-- PDF PAGE 72 --- TR Massage Therapy NC II(Amended) Promulgated February 2017"
    },
    {
      "source_text": "68 - VARIABLE RANGE 10. Range of motion of selected joints May include: 10.1 Neck 10.2 Shoulder 10.3 Elbow 10.4 Wrists 10.5 Fingers 10.6 Vertebral Column 10.7 Hips 10.8 Knees 10.9 Ankles 10.10 Toes Note: Special assistance and devices for therapists with visual impairment 11. Massage indications and/or contraindications to pathologies May include: 11.1 Absolute/Systemic Contraindications o Hives o Chickenpox o German Measles o Lice and Mites o Hypertension with medications o Thrombi & Emboli o Thrombophlebitis o Deep Vein Thrombosis o Heart Attack o Headaches due to infection or Central Nervous System disturbance o Seizure Disorders/Epilepsy o Influenza o Pneumonia o Mumps o Urinary Tract Infection o Kidney Stones (with Renal Colic) o Renal Failure o Alcoholism (under the influence) o Protracted pain or pain which is non-reproducible or neural in origin 11.2 Local Contraindications o Cramps or muscle spasms o Dislocations o Fracture o Sprain o Herniated Disc o Osteoarthritis o Tendinitis o Tenosynovitis o Acne o Folliculitis o Boils"
    },
    {
      "source_text": "-- PDF PAGE 73 --- TR Massage Therapy NC II(Amended) Promulgated February 2017"
    },
    {
      "source_text": "69 - VARIABLE RANGE o Warts o Dermatitis/Eczema o Shingles o Athlete’s Foot o Blisters o Psoriasis o Burns o Open Wounds & Sores o Decubitus Ulcers o Herpes Simplex o Lice and Mites o Edema o Thrombi & Emboli o Thrombophlebitis o Deep Vein Thrombosis o Bruise/Hematoma o Inflammation o Lumps and tissue changes o Rashes and changes in the skin 12. Massage goals May include: 12.1 Relaxation or non- therapeutic Goals (relief of common stress) 12.1.1 Reduction or removal of common pains 12.1.2 Peace of mind 12.2 Therapeutic Goals (relief of pathology) 12.2.1 Improved circulation 12.2.2 Improved lymphatic drainage 12.2.3 Improved range of motion 12.2.4 Improved functions 12.2.5 Improved sleep 12.2.6 Improved disposition towards stress 13. Massage plan May include: 13.1 Target Locations 13.2 Appropriate Manipulation 13.3 Massage Pressure 13.4 Massage Segment Time Duration 13.5 Massage Sequence 14. Allied health professionals May include: 14.1 Medical Doctors 14.2 Physical Therapists 14.3 Nurses 14.4 Psychologists 14.5 Alternative Health Practitioners 14.6 Registered Social Workers"
    },
    {
      "source_text": "-- PDF PAGE 74 --- TR Massage Therapy NC II(Amended) Promulgated February 2017"
