      "source_text": "VARIABLE RANGE 1. Applicable laws and government regulations May include: 1.1 Chapter XII of the Code of Sanitation of the Philippines (PD 856) and Implementing Rules and Regulations (IRR) 1.2 TESDA Act of 1994 (RA 7796) 1.3 Traditional & Alternative Medicine Act of 1997 (Republic Act 8423) 2. History and development of massage"
