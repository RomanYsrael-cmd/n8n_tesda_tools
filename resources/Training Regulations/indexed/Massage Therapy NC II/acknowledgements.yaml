    },
    {
      "source_text": "VARIABLE RANGE 1. Safety regulations May include: 1.1 Clean Air Act 1.2 Building code 1.3 National Electrical and Fire Safety Codes 1.4 Waste management statutes and rules 1.5 Philippine Occupational Safety and Health Standards 1.6 DOLE regulations on safety legal requirements 1.7 ECC regulations 2. Hazards/Risks May include: 2.1 Physical hazards – impact, illumination, pressure, noise, vibration, temperature, radiation 2.2 Biological hazards - bacteria, viruses, plants, parasites, mites, molds, fungi, insects 2.3 Chemical hazards – dusts, fibers, mists, fumes, smoke, gasses, vapors 2.4 Ergonomics 2.4.1 Psychological factors – over exertion/ excessive force, awkward/static positions, fatigue, direct pressure, varying metabolic cycles 2.4.2 Physiological factors – monotony, personal relationship, work out cycle 3. Contingency measures May include: 3.1 Evacuation 3.2 Isolation 3.3 Decontamination 3.4 (Calling designed) emergency personnel 4. PPE May include: 4.1 Mask 4.2 Gloves 4.3 Goggles 4.4 Hair Net/cap/bonnet 4.5 Face mask/shield 4.6 Ear muffs 4.7 Apron/Gown/coverall/jump suit 4.8 Anti-static suits 5. Emergency-related drills and training May include: 5.1 Fire drill 5.2 Earthquake drill 5.3 Basic life support/CPR 5.4 First aid 5.5 Spillage control 5.6 Decontamination of chemical and toxic 5.7 Disaster preparedness/management"
    },
    {
      "source_text": "-- PDF PAGE 22 --- TR Massage Therapy NC II(Amended) Promulgated February 2017"
    },
    {
      "source_text": "18 - VARIABLE RANGE 6. OSH personal records May include: 6.1 Medical/Health records 6.2 Incident reports 6.3 Accident reports 6.4 OSH -related training completed"
    },
