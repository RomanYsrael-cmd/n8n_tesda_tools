    {
      "source_text": "19 - EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical Aspects of Competency Assessment requires evidence that the candidate: 1.1 Explained clearly established workplace safety and hazard control practices and procedures 1.2 Identified hazards/risks in the workplace and its corresponding indicators in accordance with company procedures 1.3 Recognized contingency measures during workplace accidents, fire and other emergencies 1.4 Identified terms of maximum tolerable limits based on threshold limit value- TLV. 1.5 Followed Occupational Health and Safety (OSH) procedures for controlling hazards/risks in workplace 1.6 Used Personal Protective Equipment (PPE) in accordance with company OSH procedures and practices 1.7 Completed and updated OSH personal records in accordance with workplace requirements 2. Resource Implications The following resources should be provided: 2.1 Workplace or assessment location 2.2 OSH personal records 2.3 Personal Protective Equipment 2.4 Health records 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Portfolio Assessment 3.2 Interview 3.3 Case Study/Situation 4. Context of Assessment 4.1 Competency may be assessed in the actual workplace or at the designated TESDA Accredited Assessment Center."
