    },
    {
      "source_text": "1. Critical Aspects of Competency Assessment requires evidence that the candidate: 1.1. Communicated appropriately with patients 1.2. Handled complaints and resolved conflict, or referred matters to supervisors when required 1.3. Complied with relevant policies, protocols, guidelines and procedures of the organization 1.4. Established and maintained good interpersonal relationship with patients 1.5. Demonstrated courtesy in all interactions with patients, their visitors, and family 2. Resource Implications The following resources MUST be provided: 2.1. Access to relevant workplace or appropriately simulated environment where assessment can take place 2.2. Relevant government and organizational policy, guidelines, procedures and protocols 2.3. Any relevant legislation in relation to service delivery 3. Method of Assessment Competency may be accessed through: 3.1. Demonstration with questioning 3.2. Interview 3.3. Third party report 4. Context of assessment 4.1. Competency maybe assessed in actual workplace or at the designated TESDA Accredited Assessment Center."
