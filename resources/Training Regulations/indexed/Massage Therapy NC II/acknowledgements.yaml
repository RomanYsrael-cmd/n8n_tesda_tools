    {
      "source_text": "146 - 3.2 TRAINING DELIVERY"
    },
    {
      "source_text": "1. The delivery of training shall adhere to the design of the curriculum. Delivery shall be guided by the principles of competency-based TVET."
    },
    {
      "source_text": "a. Course design is based on competency standards set by the industry or recognized industry sector; (Learning system is driven by competencies written to industry standards)"
    },
    {
      "source_text": "b. Training delivery is learner-centered and should accommodate individualized and self-paced learning strategies;"
    },
    {
      "source_text": "c. Training can be done on an actual workplace setting, simulation of a workplace and/or through adoption of modern technology (Video Conferencing, Webinar, etc)."
    },
    {
      "source_text": "d. Assessment is based in the collection of evidence of the performance of work to the industry required standards;"
    },
    {
      "source_text": "e. Assessment of competency takes the trainee’s knowledge and attitude into account but requires evidence of actual performance of the competency as the primary source of evidence."
    },
    {
      "source_text": "f. Training program allows for recognition of prior learning (RPL) or current competencies;"
    },
    {
      "source_text": "g. Training completion is based on satisfactory performance of all specified competencies."
    },
    {
      "source_text": "2. The competency-based TVET system recognizes various types of delivery modes, both on-and off-the-job as long as the learning is driven by the competency standards specified by the industry. The following training modalities and their variations/ components may be adopted singly or in combination with other modalities when designing and delivering training programs:"
    },
    {
      "source_text": "2.1. Institution- Based:"
    },
    {
      "source_text": "Classroom-based or school-based training conducted entirely within the school or center, with classroom and/or laboratory components."
    },
    {
      "source_text": "Dual Training System (DTS) / Dualized Training Program (DTP) which contain both in-school and in-industry training or fieldwork components."
    },
    {
      "source_text": "Supervised Industry Training (SIT) or on-the-job training (OJT) is an approach in training designed to enhance the knowledge and skills of the trainee through actual experience in the workplace to acquire specific competencies as prescribed in the training regulations. It is imperative that the deployment of trainees in the workplace is adhered to training programs agreed by the institution and enterprise and status and progress of trainees are closely monitored by the training institutions to prevent opportunity for work exploitation."
    },
    {
      "source_text": "Project-based instruction is an authentic instructional model or strategy in which students plan, implement and evaluate projects that have real world applications."
    },
    {
      "source_text": "-- PDF PAGE 151 --- TR Massage Therapy NC II(Amended) Promulgated February 2017"
    },
    {
      "source_text": "147 -"
    },
    {
      "source_text": "2.2. Enterprise-Based:"
    },
    {
      "source_text": "Enterprise-based training may also be taken to mean a school or training center with one or more partner enterprise or an enterprise or group of enterprises setting up a common training facility or partnering with a school or training center."
    },
    {
      "source_text": "Enterprise-based Training - where training is implemented within the company in accordance with the requirements of the specific company."
    },
    {
      "source_text": "Apprenticeship – Training within employment involving a contract between an apprentice and an enterprise on an approved apprenticesable occupation"
    },
    {
      "source_text": "2.3. Community-Based –refers to a short program conducted or coordinated by NGOs, LGUs, training centers and other TVET providers which are intended to address the specific needs of a community. Such programs are usually conducted in informal settings such as barangay hall, basketball courts and other available venues in a community. These programs can also be mobile training programs (MTP)."
    },
    {
      "source_text": "3.2 TRAINEE ENTRY REQUIREMENTS"
    },
    {
      "source_text": "Trainees or students who want to enroll in this course should possess the following requirements:"
    },
    {
      "source_text": " Must have finished 10 years of basic education or Alternative Learning System (ALS) equivalent  Must be able to communicate both orally and in writing  Can perform basic mathematical computations"
    },
    {
      "source_text": "-- PDF PAGE 152 --- TR Massage Therapy NC II(Amended) Promulgated February 2017"
    },
    {
      "source_text": "148 - 3.3 TOOLS, MATERIALS AND EQUIPMENT MASSAGE THERAPY NC II"
    },
    {
      "source_text": "Recommended list of tools, equipment and materials for the training of a maximum of 15 trainees for the MASSAGE THERAPY NC II are as follows:"
    },
    {
      "source_text": "3.4 TOOLS, MATERIALS AND EQUIPMENT"
    },
    {
      "source_text": "Recommended list of tools, equipment and materials for the training of a minimum of 15 trainees are as follows:"
    },
