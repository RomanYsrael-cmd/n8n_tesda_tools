      "source_text": "157 - GLOSSARY OF TERMS"
    },
    {
      "source_text": "1. Body Mechanics – refers to using the body in an efficient and careful way 2. Hazardous waste – refers to the items contaminated with blood, body fluids or body substances that may be harmful to others 3. Infection control - is the discipline concerned with preventing nosocomial or healthcare- associated infection, a practical (rather than academic) sub-discipline of epidemiology. It is an essential, though often underrecognized and under supported, part of the infrastructure of health care. Infection control and hospital epidemiology are akin to public health practice, practiced within the confines of a particular health-care delivery system rather than directed at society as a whole. Anti-infective agents include antibiotics, antibacterials, antifungals, antivirals and antiprotozoals.[1] Infection control addresses factors related to the spread of infections within the healthcare setting (whether patient-to-patient, from patients to staff and from staff to patients, or among-staff), including prevention (via hand hygiene/hand washing, cleaning/disinfection/sterilization, vaccination, surveillance), monitoring/investigation of demonstrated or suspected spread of infection within a particular health-care setting (surveillance and outbreak investigation), and management (interruption of outbreaks). It is on this basis that the common title being adopted within health care is \"infection prevention and control.\" 4. OSH – refers to Occupational Safety and Health 5. First Aid Kit – refers to emergency tools used to administer treatment to injured or sick person 6. Linen – refers to material used in draping 7. Trolley – refers to device used to transport materials 8. PPE - refers to Personal Protective Equipment 9. Thermal blanket – refers to materials used to decrease the body temperature or keep the body warm. 10. Holistic – refers to integrated wholes or complete systems (of the physical, mental, emotional and spiritual aspects of the individual). 11. Framework – refers to the basic supporting idea/concept/theory. 12. Theoretical Framework – refers to the synthesis of several theories and principles which serve as basis and structure to concepts and practice. 13. Massage Therapy – refers to techniques designed to enhance overall body awareness, stretch and relax muscles, relieve muscle pain and spasms, improve range of motion, improve circulation and relax the body and mind."
