      "source_text": "VARIABLE RANGE 1. Infection control policies and procedures May include: 1.1 Cleaning procedures and schedules 1.2 Cleaning agents 1.3 Cleaning equipment 1.4 Handling, storage and disposal of all types of waste 1.5 Food handling and food safety 1.6 Hygiene procedures 1.7 Infection control risk management 1.8 Infection control incident and hazard reporting 1.9 Sterilizing 1.10 Linen production and handling 1.11 Maintenance procedures 1.12 Storage requirements 1.13 Personal protective clothing 1.14 Work flows 1.15 Management of blood and body fluid spills 1.16 Single use of disposable 1.17 Aseptic techniques 1.18 Skin preparation procedures 1.19 Immunization 1.20 Needle stick injuries 1.21 Personal contact with infectious patients 1.22 Standard and additional precautions 1.23 Confidentiality 1.24 Employee training 1.25 Contractors"
    },
    {
      "source_text": "2. Industry codes of practice May include: 2.1 National Health and Medical Research Council Guidelines for infection control 2.2 Local & National Government Guidelines and Standards 2.3 Manufacturer's recommendations and operating manuals"
    },
    {
      "source_text": "3. Identified hazards and the outcomes of infection risk assessments May include: 3.1 Sharps 3.2 Glass 3.3 Waste 3.4 Human waste and human tissues 3.5 Personal contact with infectious patients 3.6 Animals, insects and vermin 3.7 Stock, including food, which has passed \"used-by\" dates. 3.8 Incorrect concentration of disinfectants and chemicals"
