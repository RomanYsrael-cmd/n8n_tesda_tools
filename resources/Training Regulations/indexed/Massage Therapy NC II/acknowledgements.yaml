    {
      "source_text": "1. Critical Aspects of Competency Assessment requires evidence that the candidate 1.1. Communicated with team and individuals on organizational policy and procedures for infection control 1.2. Applied infection control policies and procedures which impact on work processes of the specific work unit 1.3. Applied procedures for adopting appropriate infection practices within work unit 1.4. Provided appropriate supervision of work group"
    },
    {
