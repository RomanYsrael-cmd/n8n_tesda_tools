      "source_text": "84 - EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical Aspects of Competency"
    },
    {
      "source_text": "Assessment requires evidence that the candidate: 1.1 Consistently applied relevant health regulations and standard massage establishment policies. 1.2 Consistently applied standard massage establishment procedures for cleaning, disinfection and safe storage of linen, tools and equipment used in massage services 1.3 Checked and maintained a range of tools and equipment in safe working order 1.4 Regularly applied massage establishment housekeeping programs and routines, including reporting faults and problems to relevant persons, and checking and referring tools and equipment for repair as required 1.5Completed tasks in set time frames 2. Resource Implications The following resources must be provided: 2.1 a massage establishment or a simulated massage establishment environment that includes a range of work situations such as client interruptions and involvement in other related activities normally expected in the spa 2.2 a fully equipped spa which includes as a minimum: o a fully functional client reception area o massage rooms/cubicles 2.3 equipment and work stations suitable for services, including: o a supply of clean linen and massage lubricants o a supply of clean client robes and shorts o cleaning products and equipment 2.4 relevant documentations, such as: o health regulations o massage establishment policies and procedures o instructions and safety data for disinfectant and cleaning chemicals 3. Methods of Assessment Competency in this unit may be assessed through: 3.1direct observation of the candidate: o cleaning and preparing work areas for specific services o performing routine housekeeping o maintaining a point of sale area o using and maintaining cleaning equipment 3.2 written or verbal questions appropriate to the language and literacy level of the learner to test knowledge which may include: o relevant health regulations o massage establishment policies and procedures o review of portfolios of evidence and third-party reports of on-the-job performance 4. Context of Assessment 4.1 Competency may be assessed in actual workplace or at the designated TESDA Accredited Assessment Center."
    },
