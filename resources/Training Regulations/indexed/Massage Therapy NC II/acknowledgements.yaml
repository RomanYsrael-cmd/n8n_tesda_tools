      "source_text": "1 - TRAINING REGULATIONS FOR MASSAGE THERAPY NC II"
    },
    {
      "source_text": "SECTION 1 MASSAGE THERAPY NC II QUALIFICATION"
    },
    {
      "source_text": "The MASSAGE THERAPY NC II Qualification consists of competencies that a person must achieve to work develop massage practice, perform client consultation, perform body massage and maintain and organize tools, equipment, supplies and work area."
    },
    {
      "source_text": "This Qualification is packaged from the competency map of the Human Health/Health Care Sector as shown in Annex A."
    },
    {
      "source_text": "UNIT CODE BASIC COMPETENCIES 500311105 Participate in workplace communication 500311106 Work in a team environment 500311107 Practice career professionalism 500311108 Practice occupational health and safety procedures"
    },
    {
      "source_text": "UNIT CODE COMMON COMPETENCIES HHC323201 Maintain effective relationship with clients HCS323202 Implement and monitor infection control policies and procedures HCS323203 Respond effectively to difficult/challenging behavior HCS323204 Apply basic first aid HCS323205 Maintain high standard of client services"
    },
    {
      "source_text": "UNIT CODE CORE COMPETENCIES HHC322301 Develop massage practice HHC322302 Perform client consultation HHC322303 Perform body massage HHC322304 Maintain and organize tools, equipment, supplies and work area"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be:"
    },
    {
      "source_text": " Massage Therapist"
    },
    {
      "source_text": "-- PDF PAGE 6 --- TR Massage Therapy NC II(Amended) Promulgated February 2017"
    },
