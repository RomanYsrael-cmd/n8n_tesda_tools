s and \ngovernment \nregulations \nMay include: \n1.1 Chapter XII of the Code of Sanitation of the Philippines (PD \n856) and Implementing Rules and Regulations (IRR) \n1.2 TESDA Act of 1994 (RA 7796) \n1.3  Traditional & Alternative Medicine Act of 1997 (Republic Act \n8423) \n2. History and \ndevelopment of \nmassage \n \nMay include: \n2.1  History \n2.2  Ancient \n2.3  Modern \n2.4  Filipino \n2.5  Continuum of Wellness \n2.6  Continuing professional education \n2.7  Massage modalities \n2.8 Complementary therapies\n3. Legal and ethical \nnorms \n \nMay include: \n3.1  Code of Ethics for Massage Therapists \n3.2  Children in the workplace \n3.3  Codes of conduct \n3.4  Continuing professional education \n3.5  Discrimination \n3.6  Dignity of risk \n3.7  Duty of care \n3.8  Human rights \n3.9  Informed consent \n3.10  Insurance requirements \n3.11  Mandatory reporting \n3.12  Practitioner/client boundaries \n3.13  Privacy, confidentiality and disclosure \n3.14  Records management \n3.15  Work role boundaries – responsibilities and limitations \n3.16  Work health and safety \n4. Sciences relevant to \nmassage \n \nMay include: \n4.1 \nAnatomy  \n4.2 \nPhysiology  \n4.3 \nMicrobiology  \n4.4 \nPathology  \n4.5 \nKinesiology \n4.6 \nPrecautions, Indications and Contraindications (local and \nabsolute) \n4.7 \nEndangerment Sites \n4.8 \nPhysiology of Pain \n4.9 \nAccepted theories \no Gate control theory \no\nEndorphin theory \n5. Recommended \nmassage therapy \nMay include: \n5.1 DOH Reference Manual for Licensed Massage Therapists  \n5.2Anatomy and Physiology Books\n\n--- PDF PAGE 63 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 59 - \nmanuals and \nreferences \n5.3 Pathology for Massage Therapists Books \n5.4 Chapter XII of the Code of Sanitation of the Philippines (PD \n856) and Implementing Rules and Regulations (IRR)\n6. Infection control, \nsafety and sanitation \npractices \nMay include: \n6.1 Traditional hand washing and hand asepsis \n6.2 Disinfection and sterilization \n6.3 Waste segregation and disposal \n6.4 Handling of soiled linens \n6.5 Use of personal protective devices \n6.6 Personal hygiene\n7. Standard massage \nmanipulations/strokes\n \nMay include: \n7.1 Effleurage/Gliding/Stroking \n7.2 Petrissage/Kneading \n7.3 Friction/Rubbing \n7.4 Tapotement/Percussion \n7.5Vibration/Shaking\n8. Massage modalities \nand complementary \ntherapies  \n \nMay include: \n8.1 Swedish Massage  \n8.2 Reflexology  \n8.3 Shiatsu \n8.4 Thai Massage  \n8.5 Balinese Massage \n8.6 Hot Stone Massage \n8.7 Hawaiian Lomi-lomi \n8.8 Medical Massage  \n8.9 Orthopedic massage  \n8.10 Obstetric Massage \n8.11 Pediatric Massage  \n8.12 Geriatric Massage  \n8.13 Tui–Na \n8.14 Sports Massage \n8.15 Hilot  \n8.16 Ayurveda"
