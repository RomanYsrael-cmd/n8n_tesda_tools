        "source_title": "MAINTAIN AND ORGANIZE TOOLS, EQUIPMENT, SUPPLIES AND WORKPLACE AREA",
        "source_text": "--- PDF PAGE 81 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 77 - \nUNIT OF COMPETENCY : \nMAINTAIN AND ORGANIZE TOOLS, EQUIPMENT, \nSUPPLIES AND WORKPLACE AREA \nUNIT CODE \n: \nHHC322304 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitude required to \nmaintain and organize tools, equipment, supplies and workplace \nareas in massage therapy service environments. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. Perform stock \ncontrol and \ninventory \nprocedures. \n1.1. Incoming stocks are \nchecked, validated, \nrecorded, appropriately \nlabeled and rotated in \naccordance with first in-first \nout (FIFO) principle, \nmassage establishments \npolicies and relevant \ngovernment requirements. \n1.2. Products are displayed to \ngive a balanced and fully \nstocked appearance to \npromote sales following \nmassage establishment \npolicy. \n1.3. Stocks are carefully \ninspected if damaged or \nexpired, and when found \ndamaged or expired, \nstocks are disposed of in \naccordance with applicable \nlaws. \nCOMMUNICATION \n \nMassage \nestablishment \npolicies and \nprocedures.  \n \nMethods of \nidentifying \nstocks/goods. \n \nDocumentation \nand records  \n \nRelevant \nlegislation and \nstatutory \nrequirements in \nregard to stock \ncontrol \n \nENVIRONMENT \n \n Occupational \nHealth and \nEnvironmental \nControl (DOLE \nRule 1070) \n Use of personal \nprotective \nequipment (PPE) \n Massage \nestablishment \npolicies and \nprocedures in \nregard to: \no waste disposal \nmethods of \nstorage \nMATH \n \n Arithmetic \noperations \n Basic mensuration \n \nTECHNOLOGY \n \nRelevant industry \ncodes of practice \n \nFollowing set \nroutines and \nprocedures \n \nUsing \nelectronic \nlabelling and \nticketing \nequipment \n \nStock/good \nrecords \ndocumentation \n \nReporting \nproblems \n \nReceiving and \nprocessing \nincoming \ngoods \n \nclarifying and \nexplaining \npolicy and \nprocedures  \n \nFollowing \noccupational \nhealth and \nsafety (OSH) \nprocedures \n \nLiteracy and \nnumeracy \nskills: \no \nfollowing \nset \nroutines \nand \nprocedures \no \nusing \nelectronic \nlabelling \nand \nticketing \nequipment \no \nstocking \nrecords \nand \ndelivery\n\n--- PDF PAGE 82 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 78 - \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated \nin the Range of Variables \n \nREQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n Massage policies \nand procedures in \nregard to: \no stock control \no labeling policy \no product quality \nstandards \no correct unpacking \nof goods \no out-of-date, \nmissing or \ndamaged stock \nequipment used \no stock location \no waste disposal \nmethods of \nstorage \no delivery \ndocumentation \no stock record \ndocumentation \no dispatch \ndocumentation \no reporting faults \nand problems \no relevant \ngovernment \nrequirements in \nregard to stock \ncontrol, including \nOSH relevant \nindustry codes of \npractice \n \ndocumenta\ntion \no \nreporting \nproblems \n \nCarrying stock \nrotation \nprocedure \n \nClarifying and \nexplaining \npolicy and \nprocedures  \n \nFollowing set \nroutines and \nprocedures \n \nLiteracy and \nnumeracy \nskills: \no \nfollowing \nset \nroutines \nand \nprocedures \no \nusing \nelectronic \nlabelling \nand \nticketing \nequipment \no \nstocking \nrecords \nand \ndelivery \ndocumenta\ntion \no \nreporting \nproblems \n \n2. Clean and \norganize work \narea \n2.1. Work area is cleaned and \norganized according to \nmassage establishment \npolicies and applicable \nlaws. \n2.2. Wastes are promptly \nremoved and disposed of \naccording to massage \nestablishment policies \nand applicable laws. \n \n2.3. Work area is set up \naccording to the service to \nbe provided. \n \n2.4. Work area is maintaine