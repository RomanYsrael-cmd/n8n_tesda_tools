pment and \nfacilities \n Ways and means of \npracticing economic \nuse and \nmaintenance of \nequipment and \nfacilities \n Setting skills of \nwork priorities \n Meeting with work \npriorities \n Intra and \nInterpersonal skills \n Communication \nskills\n\n--- PDF PAGE 15 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 11 - \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Maintain \nprofessional \ngrowth and \ndevelopment \n3.1 Trainings and career \nopportunities are \nidentified and availed \nof based on job \nrequirements \n3.2 Recognitions are \nsought/received and \ndemonstrated as proof \nof career \nadvancement \n3.3 Licenses and/or \ncertifications relevant \nto job and career are \nobtained and renewed \n \n Ways of identifying \ntrainings and \ncareer \nopportunities \n Techniques of \nseeking and \nreceiving \nrecognitions \n Procedures of \nobtaining licenses \nand/or \ncertifications \nrelevant to the job \n \n \n Identifying \ntrainings and \ncareer \nopportunities \n Seeking  \nrecognitions are  \nsought/received \nand demonstrated \nas proof of career \nadvancement \n Obtaining and \nrenewing Licenses \nand/or \ncertifications \nrelevant to job and \ncareer\n\n--- PDF PAGE 16 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 12 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Evaluation \nMay include: \n1.2 \nPerformance Appraisal \n1.2  Psychological Profile \n1,3 \nAptitude Tests \n2.  Resources \nMay include: \n2.1 \nHuman \n2.2  Financial \n2.3  Technology \n2.3.1  Hardware \n2.3.2 Software \n3.  Trainings and career \nopportunities \nMay include: \n3.1  Participation in training programs \n      3.1.1 Technical \n      3.1.2  Supervisory \n      3.1.3  Managerial \n      3.1.4  Continuing Education \n3.2   Serving as Resource Persons in conferences and \nworkshops \n4.  Recognitions \nMay include: \n4.1  Recommendations \n4.2  Citations \n4.3  Certificate of Appreciations \n \nCommendations \n4.6 \nAwards \n4.7 \nTangible and Intangible Rewards \n5.  Licenses and/or \ncertifications \nMay include: \n5.1 \nNational Certificates \n5.2 \nCertificate of Competency \n5.3 \nSupport Level Licenses \n5.4 \nProfessional Licenses\n\n--- PDF PAGE 17 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 13 - \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nAttained job targets within key result areas (KRAs) \n1.2 \nMaintained intra - and interpersonal relationship in the \ncourse of managing oneself based on performance \nevaluation \n1.3 \nCompleted trainings and career opportunities which are \nbased on the requirements of the industries \n1.4 \nAcquired and maintained licenses and/or certifications \naccording to the requirement of the qualification \n2.  Resource Implications \nThe following resources should be provided: \n2.1  Workplace or assessment location \n2.2  Case studies/scenarios \n3.  Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1  Portfolio Assessment \n3.2  Interview \n3.3   Simulation/Role-plays \n3.4   Observation \n3.5   Third Party Reports \n3.6   Exams and Tests \n4.  Context of \nAssessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n",
