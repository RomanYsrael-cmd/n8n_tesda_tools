          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILL \n1. Provide \ninformation to \nthe work group \nabout the \norganization's \ninfection control \npolicies and \nprocedures. \n1.1 Relevant information about \nthe organization's infection \ncontrol policy and \nprocedures, and applicable \nindustry codes of practice \nare accurately and clearly \nexplained to the work group \n \n1.2 Information about identified \nhazards and the outcomes \nof infection risk \nassessments is regularly \nprovided to the work group \n \n1.3 Opportunity is provided for \nthe work group to seek \nfurther information on \nworkplace infection control \nissues and practices \nCOMMUNICATION \n \nWorking \nknowledge, \nconsistent with \nthe elements of \ncompetence, of \nthe organization's \napplicable \ninfection control \npolicy and \nprocedures and \nrelevant industry \ncodes of practice \n \n \nThe significance \nof patient \nconfidentiality in \nrelation to \ninfection control \n \n \nLiteracy levels \nand \ncommunication \nskills of work \ngroup members \nand consequent \nsuitable \ncommunication \ntechniques \n \n \n \nOrganizational \nprocedures for \n \nEffective \ncommunicating \nand \ninterpersonal \nskills including: \no language \ncompetence \n \no literacy and \nreading \ncompetence \n \n \nNegotiating \nSkills \n \n \nWork planning \nand \nmanagement \n \n \nManaging \nchange of work \nprocesses \n \n \nMonitoring \ncompliance with \npolicy and \nprocedures \n \n \nMaintaining and \ninterpreting \ninfection control \nrecords\n\n--- PDF PAGE 31 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 27 - \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILL \nmonitoring, \ntraining \n \nENVIRONMENT   \n \nAble to \nacknowledge \nimportance of \ninfection control \n \nThe hierarchy risk \ncontrol measures \nfrom most to least \npreferred, that is, \nelim