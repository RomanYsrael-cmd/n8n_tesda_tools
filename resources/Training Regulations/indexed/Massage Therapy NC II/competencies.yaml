          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1. Prepare the \nmassage \nwork area. \n1.1 Work area is \norganized \naccording to \nmassage plan \nand massage \nestablishment \npolicies. \n1.2 Massage \nimplements and \nsupplies are \nprepared \naccording to \nmassage plan \nand massage \nestablishment \npolicies. \n1.3 Client is guided to \nthe massage area \nand prepared \naccording to \nmassage \nestablishment \nprocedures. \nCOMMUNICATION \n \nOffice/Clinical Protocols  \nApplicable laws and \ngovernment regulations \n \nClient consultation and \nassessment results \n \nDocumentation forms \n \nENVIRONMENT \n \nRelevant health \nregulations \n \nEnvironmental protection \npractices (e.g. waste \nminimization, recycling, \nre-use, energy efficiency, \nwaste disposal, water \nefficiency) \n \nMATH \n \nBasic Mensuration  \n \nSCIENCE \n \nTransmission routes of \ninfectious conditions  \nStandard infection control \nprecautions \n \nTECHNOLOGY \n \nFacility requirements \n \nCleaning maintenance \nand storage of linen, tools \nand equipment \n \nHousekeeping \n \nIdentifying \nappropriate \nmassage goal/s \n \nPlanning \nmassage \nsession \n \nIdentifying \nrequired \nmassage \nimplements \n \nOrganizing \nworkplace \n \n2. Perform \nbody \nmassage. \n2.4. Massage is \nperformed \naccording to \nstandard \nmassage \nmanipulations / \nstrokes guided \nby applicable \nlaws and \ngovernment \nregulations, \nCOMMUNICATION \n \nProfessional Barriers \n \nOffice/Clinical Protocols  \n \nChapter XII of the Code \nof Sanitation of the \nPhilippines (PD 856) and \nImplementing Rules and \nRegulations (IRR) \n \nCode of Ethics for \nMassage Therapists \n \nDocumentation Forms \n \nIdentifying \nappropriate \nmassage \nmanipulations \n/strokes \naccording to \nmassage plan \n \nPerforming \nstandard \nmassage\n\n--- PDF PAGE 76 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 72 - \nestablished \nethical standards, \nand company \npolicy. \n2.5. Massage \nmanipulations / \nstrokes that will \nspecifically \naddress client \ncomplaints and \nconditions are \nidentified and \nperformed \naccording to \nmassage plan \nand massage \ngoal/s. \n2.6. Body mechanics \nof the practitioner \nand proper \npositioning of \nthe client are \napplied during \nmassage to \nminimize fatigue \nand risks of \ninjury. \n \nClient Consultation and \nAssessment Results \n \n \nENVIRONMENT \n \nCompany Safety and \nSanitation Policies \n \nOffice/Clinical Protocols  \n \nApplicable laws and \ngovernment regulations \n \nMATH \n \nBasic Mensuration  \n \n \nSCIENCE \n \nStandard Massage \nManipulations/Strokes: \n \nEffleurage \n \nPetrissage \n \nFriction \n \nTapotement \n \nVibration \n \nProper Body Mechanics \n \nProper Client Positions \n \nRisks of Injury for the \npractitioners \n \nHuman Anatomy and \nPhysiology \n \nMicrobiology and \nPathology \n \nPrecautions, Indications \nand Contraindications \n(local and absolute) \n \nEndangerment Sites \n \nPhysiology of Pain \n \nAccepted theories \n \nGate control theory \n \nEndorphin theory  \n \nOutcomes of previous \ntreatments \n \nPhysical attributes \n \nEffects, benefits and \napplication of each type \nof massage movement \nand technique \n \nEffects and benefits of \nmassage on body \nsystems \n \nAnatomical position \nterminology in relation to \nbody massage \n \nTECHNOLOGY \n \nFacility Requirements \n \nPersonal Protective \nEquipment (PPE) \nmanipulations \n/strokes \n \nApplying proper \nbody mechanics \n \nPositioning the \nclient \n \nPerforming \nproper draping\n\n--- PDF PAGE 77 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 73 - \n3. Perform \npost–\nmassage \nactivities \n3.1. Effects of \nmassage and \nprogress of the \nclient based on \nmassage plan \nand massage \ngoals are \nevaluated and \ndocumented. \n3.2. Aftercare \nactivities are \nperformed \naccording to client \nneeds. \n3.3. Aftercare \nadvices are \nprovided to \nmaximize results \nand promote \nclient wellbeing. \n3.4. Knowledge of \nproducts and \nservices and \ntheir use are \nrecommended to \nthe client in \ncompliance with \nmanufacturer’s \nsafety guidelines. \n3.5. Patronage is \nmaintained by \nproviding quality \nservices to meet \nclient wellness \nexpectations \nfollowing \nmassage \nestablishment \npolicies. \nCOMMUNICATION \n \nProfessional Barriers \n \nOffice/Clinical Protocols  \n \nCode of Ethics for \nMassage Therapists \n \nDocumentation Forms \n \nAftercare advices \no Physiological \no Psychological \no Lifestyle \nApplicable laws and \ngovernment regulations, \nincluding regulations \nrelating to the retail \nindustry \n Spa products and services \n Specialized product \nknowledge that includes: \nspa and wellness industry \nmanuals and \ndocumentations \n \nENVIRONMENT \n \nConduciveness \n Sanitation laws and \ncompany rules \n Occupational Safety and \nHealth Laws  \n ASEAN Trends and \nIndustry Updates \n \nMATH \n \nBasic Mensuration  \n \nSCIENCE \n Health and Safety \nPractices \n Precautions and \nContraindications to \nMassage \n Effects and Benefits of \nMassage \n Specialized product \nknowledge that includes: \no brand options \no benefits and features \no shelf life, expiration \ndate and warranties \no ingredients or materials \ncontained in product \no product and ingredient \norigins \no corresponding or \ncomplementary \nproducts and services \n \nTECHNOLOGY \n \nEvaluating \nhealth progress \nof the client \n \nIdentifying \neffects of \nmassage \n \nCommunicating \nproficiently and \neffectively \n \nManaging \nrecords \n \nIdentifying and \nproviding \nappropriate \naftercare \nadvices and \nactivities \n Sharing product \nknowledge to \ncolleagues and \nclients \n Asking questions \nto identify and \nconfirm \nrequirements \n Applying \nknowledge to \nprovide advice on \nproducts and \nservice