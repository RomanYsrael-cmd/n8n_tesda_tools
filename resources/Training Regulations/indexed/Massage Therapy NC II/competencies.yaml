        "source_text": "--- PDF PAGE 39 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 35 - \nUNIT OF COMPETENCY : \nRESPOND EFFECTIVELY TO DIFFICULT/ CHALLENGING \nBEHAVIOR \nUNIT CODE \n: \nHCS323202 \nUNIT DESCRIPTOR \n: \nThis unit of competency covers the knowledge, skills and \nattitudes to effectively respond to difficult or challenging \nbehaviour of client. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILL \n1. Plan responses \n \n1.1 Responses are \nplanned to instances of \ndifficult or challenging \nbehavior to maximize \nthe availability of other \nappropriate staff and \nresources  \n \n1.2 Specific manifestations \nof difficult or \nchallenging behavior \nare identified and \nstrategies appropriate \nto these behaviors are \nplanned as required. \n \n1.3 Safety of self and others \nis given priority in \nresponding to difficult or \nchallenging behavior \naccording to institutional \npolicies and procedures. \nCOMMUNICATION \n \nOffice protocols \n \nClient handling \n \nENVIRONMENT \n \nCapacity to \nmaintain safety of \nself and others \neven in extreme \ncircumstances \n \n \nOSH and issues \nrelating to difficult \nand challenging \nbehavior \n \n \nPatient issues \nwhich need to be \nreferred to an \nappropriate health \nprofessional \n \n \nAbility to interpret \nand follow the \ninstructions and \nguidance of health \nprofessionals \ninvolved with the \ncare of \npatient/client \n \nSCIENCE \n \nAbility to identify \nappropriate \nresponses to \ndifficult situations \n \nEffectively using \ntechniques for \nmonitoring own \nservice area \nincluding client \nsatisfaction \n \n \nSpeaking in a firm, \ndiplomatic and \nculturally \nappropriate manner \n \n \nRemaining calm \nand positive in \nadversity \n \n \nThinking and \nresponding quickly \nand strategically \n \n \nRemaining alert to \npotential incidents \nof difficult or \nchallenging \nbehavior \n \n \nMonitoring and/or \nmaintaining security \nequipment \n \n \n \nWorking with others \nand display \nempathy with \npatient and \nrelatives\n\n--- PDF PAGE 40 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 36 - \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILL \n \nTypes of \nchallenging \nbehaviors \n \nCauses of \nchallenging \nbehaviors \n \nBehavior response \ncycle \n \nConduct disorder \n \nOperant \nconditioning \n \nOppositional \ndefiant disorder \n \nPositive behavior \nsupport \n \nAppropriate \nstrategies \n \n2. Apply response \n1.4 Difficult or challenging \nbehavior is dealt with \npromptly, firmly and \ndiplomatically in \naccordance with \ninstitutional policy and \nprocedures. \n1.5 Communication is used \neffectively to achieve the \ndesired outcomes in \nresponding to difficult or \nchallenging behavior \n \n1.6 Appropriate strategies \nare selected to suit \nparticular instances of \ndifficult or challenging \nbehavior \n \nCOMMUNICATION \n \nOffice protocols \n \nClient handling \n \nENVIRONMENT \n \nCapacity to \nmaintain safety of \nself and others \neven in extreme \ncircumstances \n \n \nOSH and issues \nrelating to difficult \nand challenging \nbehavior \n \n \nPatient issues \nwhich need to be \nreferred to an \nappropriate health \nprofessional \n \n \nAbility to interpret \nand follow the \ninstructions and \n \nEffectively using \ntechniques for \nmonitoring own \nservice area \nincluding client \nsatisfaction \n \n \nSpeaking in a firm, \ndiplomatic and \nculturally \nappropriate manner \n \n \nRemaining calm \nand positive in \nadversity \n \n \nThinking and \nresponding quickly \nand strategically \n \n \nRemaining alert to \npotential incidents \nof difficult or \nchallenging \nbehavior\n\n--- PDF PAGE 41 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 37 - \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILL \nguidance of health \nprofessionals \ninvolved with the \ncare of \npatient/client \n \nSCIENCE \n \nAbility to identify \nappropriate \nresponses to \ndifficult situations \n \nTypes of \nchallenging \nbehaviors \n \nCauses of \nchallenging \nbehaviors \n \nBehavior response \ncycle \n \nConduct disorder \n \nOperant \nconditioning \n \nOppositional \ndefiant disorder \n \nPositive behavior \nsupport \n \nAppropriate \nstrategies \n \n \nMonitoring and/or \nmaintaining security \nequipment \n \n \nWorking with others \nand display \nempathy with \npatient and \nrelatives \n3. Report and \nreview incidents \n3.1 Incidents are reported \naccording to institutional \npolicies and procedures \n \n3.2 Incidents are reviewed \nwith appropriate staff and \nsuggestions appropriate \nto area of responsibility \nare made. \n \n3.3 Debriefing mechanisms \nand other activities are \nused and participated in \n \nCOMMUNICATION \n \nOffice protocols \n \nClient handling \n \nDebriefing process \nand mechanisms \n \nIncident reporting \nprocedures \n \nENVIRONMENT \n \nCapacity to \nmaintain safety of \nself and others \neven in extreme \ncircumstances \n \nEffectively using \ntechniques for \nmonitoring own \nservice area \nincluding client \nsatisfaction \n \n \nSpeaking in a firm, \ndiplomatic and \nculturally \nappropriate manner \n \n \nRemaining calm \nand positive in \nadversity\n\n--- PDF PAGE 42 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 38 - \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILL \n3.4 Advice and assistance is \nsought from legitimate \nsources when \nappropriate. \n \n \n \n \nOSH and issues \nrelating to difficult \nand challenging \nbehavior \n \n \nPatient issues \nwhich need to be \nreferred to an \nappropriate health \nprofessional \n \n \nAbility to interpret \nand follow the \ninstructions and \nguidance of health \nprofessionals \ninvolved with the \ncare of \npatient/client \n \nSCIENCE \n \nAbility to identify \nappropriate \nresponses to \ndifficult situations \n \nTypes of \nchallenging \nbehaviors \n \nCauses of \nchallenging \nbehaviors \n \nBehavior response \ncycle \n \nConduct disorder \n \nOperant \nconditioning \n \nOppositional \ndefiant disorder \n \nPositive behavior \nsupport \n \nAppropriate \nstrategies \n \n \n \nThinking and \nresponding quickly \nand strategically \n \n \nRemaining alert to \npotential incidents \nof difficult or \nchallenging \nbehavior \n \n \nMonitoring and/or \nmaintaining security \nequipment \n \n \n \nWorking with others \nand display \nempathy with \npatient and \nrelatives\n\n--- PDF PAGE 43 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 39 - \n \n \n \nRANGE OF VARIALES \n \nVARIABLE \nRANGE \n1. Planned responses  \nMay include: \n1.1 Own ability and experience \n1.2 Established institutional procedures \n1.3 Knowledge of individual persons and underlying causes \n2. Difficult or challenging \nbehaviors  \nMay include: \n2.1 Aggression/Assaultive behavior \n2.2 Confusion or other cognitive impairment \n2.3 Noisiness \n2.4 Manipulative \n2.5 Wandering  \n2.6 Self-destructive  \n2.7 Intoxication \n2.8 Withdrawn/depressed \n2.9 Negativistic \n2.10 Intrusive behavior \n2.11 Verbal offensiveness \n3. Strategies for dealing \nwith challenging \nbehaviors  \nMay include: \n3.1 Diversional activities \n3.2 Referring to appropriate personnel e.g. supervisor, security \nofficer \n3.3 Following established emergency response procedures \n4. Selection of strategies \nfor dealing with \nchallenging behaviors  \nMay include: \n4.1 The nature of the incident \n4.2 Potential effect on different parties, patient, staff and others\n4.3 Established procedures and guidelines \n5. Institutional policies and \nprocedures \nMay include: \n5.1 Incident reporting and documentation \n5.2 Operational guidelines for handling incidents and/or cases \ninvolving difficult and challenging behavior \n5.3 Debriefing of staff involved in the incident\n\n--- PDF PAGE 44 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 40 - \nEVIDENCE GUIDE \n \n1.  Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1. Identified specific manifestations of difficult or challenging \nbehavior and strategies are planned, selected and applied \nas required \n1.2. Maintained personal safety and the safety of others \n1.3. Reported incidents, reviewed and responded quickly and \neffectively to contingencies \n1.4. Debriefing mechanisms are used  \n2.  Resource Implications \nThe following resources should be provided: \n2.1. Access to relevant workplace or appropriately simulated \nenvironment where assessment can take place \n2.2. Relevant institutional policy, guidelines, procedures and \nprotocols \n2.3. Emergency response procedures and employee support \narrangements \n3. Methods of  \nAssessment \nCompetency must be assessed through: \n3.1. Observation with questioning \n3.2. Demonstration with questioning \n4. Context of Assessment \n4.1. Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center.\n",
