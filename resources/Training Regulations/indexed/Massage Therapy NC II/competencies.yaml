tic positions, fatigue, direct pressure,\nvarying metabolic cycles\n2.4.2 Physiological factors – monotony, personal\nrelationship, work out cycle\n3. Contingency\nmeasures\nMay include:\n3.1 Evacuation\n3.2 Isolation\n3.3 Decontamination\n3.4 (Calling designed) emergency personnel\n4. PPE\nMay include:\n4.1 Mask\n4.2 Gloves\n4.3 Goggles\n4.4 Hair Net/cap/bonnet\n4.5 Face mask/shield\n4.6 Ear muffs\n4.7 Apron/Gown/coverall/jump suit\n4.8 Anti-static suits\n5. Emergency-related\ndrills and training\nMay include:\n5.1 Fire drill\n5.2 Earthquake drill\n5.3 Basic life support/CPR\n5.4 First aid\n5.5 Spillage control\n5.6 Decontamination of chemical and toxic\n5.7 Disaster preparedness/management\n\n--- PDF PAGE 22 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 18 -\nVARIABLE\nRANGE\n6. OSH personal records May include:\n6.1 Medical/Health records\n6.2 Incident reports\n6.3 Accident reports\n6.4 OSH -related training completed\n\n--- PDF PAGE 23 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 19 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained clearly established workplace safety and hazard\ncontrol practices and procedures\n1.2 Identified hazards/risks in the workplace and its\ncorresponding indicators in accordance with company\nprocedures\n1.3 Recognized contingency measures during workplace\naccidents, fire and other emergencies\n1.4 Identified terms of maximum tolerable limits based on\nthreshold limit value- TLV.\n1.5 Followed Occupational Health and Safety (OSH) procedures\nfor controlling hazards/risks in workplace\n1.6 Used Personal Protective Equipment (PPE) in accordance\nwith company OSH procedures and practices\n1.7 Completed and updated OSH personal records in\naccordance with workplace requirements\n2. Resource\nImplications\nThe following resources should be provided:\n 2.1 Workplace or assessment location\n 2.2 OSH personal records\n 2.3 Personal Protective Equipment\n 2.4 Health records\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n 3.1 Portfolio Assessment\n 3.2 Interview\n 3.3 Case Study/Situation\n4. Context of\nAssessment\n4.1 Competency may be assessed in the actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 24 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 20 -\nCOMMON COMPETENCIES\n\nUNIT OF COMPETENCY :\nMAINTAIN AN EFFECTIVE RELATIONSHIP WITH CLIENTS\n\nUNIT CODE\n:"
