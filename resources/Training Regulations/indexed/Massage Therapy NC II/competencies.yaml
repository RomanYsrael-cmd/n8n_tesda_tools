1.7 \nSensory Assessment \n1.8\nRange of Motion\n2. Ethical and legal \nnorms \nMay include: \n2.1 \nPhilippine Laws Governing Massage Therapy \n2.2 \nCode of Ethics for Massage Therapy in the Philippines \n2.3 \nInternational Codes on Massage Practice \n2.4\nCompany Ethical Standards\n3. Client personal \ninformation \nMay include: \n3.1 \nAge \n3.2 \nGender \n3.3 \nBiometrics \n3.4 \nConstitution/health status \n3.5 \nReligion \n3.6 \nLifestyle \n3.7 \nOccupation \n3.8 \nPersonal history \n3.9 \nDiet \n3.10 Values and attitudes \n3.11 Balance of rest and activity \n3.12 Physical environment \n3.13 Social environment \n3.14 Client expectations \n4. Documentation \nforms \nMay include: \n4.1 \nClient Intake Form \n4.2 \nSubjective, Objective, Assessment, Plan (SOAP) Form \n4.3 \nClient Data Base \n4.4 \nClient Approval or Waiver \n4.5 \nMassage Session Summary Form \nNote: Special devices for therapists with disability \n5. Documentation \ntools \nMay include: \n5.1 \nwriting instruments \n5.2 \nrecording instruments \n5.3 \nmobile phone application \n5.4 \nelectronic tablet \n5.5 \ncomputer  \nNote: special devices for therapists with disability\n\n--- PDF PAGE 71 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 67 - \nVARIABLE \nRANGE \n6. Client visual \nassessment \nMay include: \n6.1 \nSkin Color \n6.2 \nNail Beds \n6.3 \nSkin Condition \n6.4 \nBone Structure \n6.5 \nBreathing \n6.6 \nGait  \nNote: Special assistance for therapists with disability\n7. Client \nhealth history \nMay include: \n7.1 \nPast and present illness \n7.2 \nCompliance to on-going treatment  \n7.3 \nCurrent medications \n7.4 \nMedical Certificate/Referrals \n7.5 \nSubstance abuse \n7.6 \nAllergies  \n7.7\nClinical records\n8. Vital signs and \nappropriate \ninstruments \nMay include: \n8.1 \nTemperature \n8.1.1 Digital thermometer \n8.2 \nBlood Pressure \n8.2.1 Aneroid Sphygmomanometer \n8.2.2 Stethoscope \n8.2.3 Analog wristwatch \n8.3 \nHeart Rate \n8.3.1 Analog wristwatch \n8.4 \nRespiratory Rate \n8.4.1 Analog wristwatch \n8.5 \nRange of Motion  \n8.5.1 Goniometer \nNote: Special assistance and devices for therapists with visual \nimpairment\n9. Palpation of \naffected areas  \nMay include: \n9.1 \nBody Regions \n9.1.1 Head and Neck \n9.1.2 Trunk \n9.1.3 Upper Extremities \n9.1.4 Lower Extremities \n9.2 \nHistology (subcutaneous) \n9.2.1 Temperature (warm or cold) \n9.2.2 Tenderness \n9.2.3 Pain (Myofascial Pain Syndrome, Knots, Nodules) \n9.2.4 Spasms \n9.2.5 Soreness \n9.2.6 Swelling\n\n--- PDF PAGE 72 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 68 - \nVARIABLE \nRANGE \n10. Range of motion \nof selected joints\nMay include: \n10.1 Neck \n10.2 Shoulder \n10.3 Elbow \n10.4 Wrists \n10.5 Fingers \n10.6 Vertebral Column \n10.7 Hips \n10.8 Knees \n10.9 Ankles \n10.10 Toes \nNote: Special assistance and devices for therapists with visual \nimpairment\n11. Massage \nindications \nand/or \ncontraindications \nto pathologies \nMay include: \n11.1 Absolute/Systemic Contraindications \no Hives \no Chickenpox \no German Measles \no Lice and Mites \no Hypertension with medications \no Thrombi & Emboli \no Thrombophlebitis \no Deep Vein Thrombosis \no Heart Attack \no Headaches due to infection or Central Nervous System \ndisturbance \no Seizure Disorders/Epilepsy \no Influenza \no Pneumonia \no Mumps \no Urinary Tract Infection \no Kidney Stones (with Renal Colic) \no Renal Failure  \no Alcoholism (under the influence) \no Protracted pain or pain which is non-reproducible or neural \nin origin \n11.2 Local Contraindications \no Cramps or muscle spasms \no Dislocations \no Fracture \no Sprain \no Herniated Disc \no Osteoarthritis \no Tendinitis \no Tenosynovitis \no Acne \no Folliculitis \no\nBoils\n\n--- PDF PAGE 73 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 69 - \nVARIABLE \nRANGE \no Warts \no Dermatitis/Eczema \no Shingles \no Athlete’s Foot \no Blisters \no Psoriasis \no Burns \no Open Wounds & Sores \no Decubitus Ulcers \no Herpes Simplex \no Lice and Mites \no Edema \no Thrombi & Emboli \no Thrombophlebitis \no Deep Vein Thrombosis \no Bruise/Hematoma \no Inflammation \no Lumps and tissue changes \no\nRashes and changes in the skin\n12. Massage goals \nMay include: \n12.1 Relaxation or non- therapeutic Goals (relief of common stress) \n12.1.1 Reduction or removal of common pains \n12.1.2 Peace of mind \n12.2 Therapeutic Goals (relief of pathology) \n12.2.1 Improved circulation \n12.2.2 Improved lymphatic drainage \n12.2.3 Improved range of motion \n12.2.4 Improved functions \n12.2.5 Improved sleep \n12.2.6 Improved disposition towards stress\n13. Massage plan \nMay include: \n13.1 Target Locations \n13.2 Appropriate Manipulation \n13.3 Massage Pressure \n13.4 Massage Segment Time Duration \n13.5 Massage Sequence\n14. Allied health \nprofessionals \nMay include: \n14.1 Medical Doctors \n14.2 Physical Therapists \n14.3 Nurses \n14.4 Psychologists \n14.5 Alternative Health Practitioners \n14.6 Registered Social Workers\n\n--- PDF PAGE 74 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 70 - \nEVIDENCE GUIDE \n \n1. Critical Aspects \nof Competency \n \nAssessment requires evidence that the candidate: \n1.1 Obtained and recorded the necessary client information. \n1.2 Determined and assessed the client’s physical condition using \nstandard tools and equipment for the required massage treatment. \n1.3Conducted accurate analysis and communication of results.\n2. Resource \nImplications \nThe following resources must be provided: \n2.1 Relevant reference or health journals \n2.2 Materials, supplies, tools and equipment relevant to the proposed \nactivity or task \n2.3  Appropriate assessment venue and environment \n2.4 Skilled assessors \n3 \nMethods of \nAssessment \nCompetency may be assessed through: \n3.1 Written examinations \n3.2 Demonstration with oral questioning \n3.3 Observation and return demonstration \n3.4 Interview \n4 \nContext of \nAssessment\n4.1 Competency may be assessed in actual workplace or at \ndesignated TESDA Accredited Assessment Center.\n",
