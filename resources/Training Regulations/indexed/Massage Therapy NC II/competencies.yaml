        "source_text": "HHC 322303\n\nUNIT DESCRIPTOR\n:\nThis unit of competency describes the knowledge, skills and\nperformance outcomes required to provide whole body massage.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Prepare the\nmassage\nwork area.\n1.1 Work area is\norganized\naccording to\nmassage plan\nand massage\nestablishment\npolicies.\n1.2 Massage\nimplements and\nsupplies are\nprepared\naccording to\nmassage plan\nand massage\nestablishment\npolicies.\n1.3 Client is guided to\nthe massage area\nand prepared\naccording to\nmassage\nestablishment\nprocedures.\nCOMMUNICATION\n•\nOffice/Clinical Protocols\nApplicable laws and\ngovernment regulations\n•\nClient consultation and\nassessment results\n•\nDocumentation forms\n\nENVIRONMENT\n•\nRelevant health\nregulations\n•\nEnvironmental protection\npractices (e.g. waste\nminimization, recycling,\nre-use, energy efficiency,\nwaste disposal, water\nefficiency)\n\nMATH\n•\nBasic Mensuration\n\nSCIENCE\n•\nTransmission routes of\ninfectious conditions\nStandard infection control\nprecautions\n\nTECHNOLOGY\n•\nFacility requirements\n•\nCleaning maintenance\nand storage of linen, tools\nand equipment\n•\nHousekeeping\n•\nIdentifying\nappropriate\nmassage goal/s\n•\nPlanning\nmassage\nsession\n•\nIdentifying\nrequired\nmassage\nimplements\n•\nOrganizing\nworkplace\n\n2. Perform\nbody\nmassage.\n2.4. Massage is\nperformed\naccording to\nstandard\nmassage\nmanipulations /\nstrokes guided\nby applicable\nlaws and\ngovernment\nregulations,\nCOMMUNICATION\n•\nProfessional Barriers\n•\nOffice/Clinical Protocols\n•\nChapter XII of the Code\nof Sanitation of the\nPhilippines (PD 856) and\nImplementing Rules and\nRegulations (IRR)\n•\nCode of Ethics for\nMassage Therapists\n•\nDocumentation Forms\n•\nIdentifying\nappropriate\nmassage\nmanipulations\n/strokes\naccording to\nmassage plan\n•\nPerforming\nstandard\nmassage\n\n--- PDF PAGE 76 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 72 -\nestablished\nethical standards,\nand company\npolicy.\n2.5. Massage\nmanipulations /\nstrokes that will\nspecifically\naddress client\ncomplaints and\nconditions are\nidentified and\nperformed\naccording to\nmassage plan\nand massage\ngoal/s.\n2.6. Body mechanics\nof the practitioner\nand proper\npositioning of\nthe client are\napplied during\nmassage to\nminimize fatigue\nand risks of\ninjury.\n•\nClient Consultation and\nAssessment Results\n•\n\nENVIRONMENT\n•\nCompany Safety and\nSanitation Policies\n•\nOffice/Clinical Protocols\n•\nApplicable laws and\ngovernment regulations\n\nMATH\n•\nBasic Mensuration\n\n•\nSCIENCE\n•\nStandard Massage\nManipulations/Strokes:\n•\nEffleurage\n•\nPetrissage\n•\nFriction\n•\nTapotement\n•\nVibration\n•\nProper Body Mechanics\n•\nProper Client Positions\n•\nRisks of Injury for the\npractitioners\n•\nHuman Anatomy and\nPhysiology\n•\nMicrobiology and\nPathology\n•\nPrecautions, Indications\nand Contraindications\n(local and absolute)\n•\nEndangerment Sites\n•\nPhysiology of Pain\n•\nAccepted theories\n•\nGate control theory\n•\nEndorphin theory\n•\nOutcomes of previous\ntreatments\n•\nPhysical attributes\n•\nEffects, benefits and\napplication of each type\nof massage movement\nand technique\n•\nEffects and benefits of\nmassage on body\nsystems\n•\nAnatomical position\nterminology in relation to\nbody massage\n\nTECHNOLOGY\n•\nFacility Requirements\n•\nPersonal Protective\nEquipment (PPE)\nmanipulations\n/strokes\n•\nApplying proper\nbody mechanics\n•\nPositioning the\nclient\n•\nPerforming\nproper draping\n\n--- PDF PAGE 77 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 73 -\n3. Perform\npost–\nmassage\nactivities\n3.1. Effects of\nmassage and\nprogress of the\nclient based on\nmassage plan\nand massage\ngoals are\nevaluated and\ndocumented.\n3.2. Aftercare\nactivities are\nperformed\naccording to client\nneeds.\n3.3. Aftercare\nadvices are\nprovided to\nmaximize results\nand promote\nclient wellbeing.\n3.4. Knowledge of\nproducts and\nservices and\ntheir use are\nrecommended to\nthe client in\ncompliance with\nmanufacturer’s\nsafety guidelines.\n3.5. Patronage is\nmaintained by\nproviding quality\nservices to meet\nclient wellness\nexpectations\nfollowing\nmassage\nestablishment\npolicies.\nCOMMUNICATION\n•\nProfessional Barriers\n•\nOffice/Clinical Protocols\n•\nCode of Ethics for\nMassage Therapists\n•\nDocumentation Forms\n•\nAftercare advices\no Physiological\no Psychological\no Lifestyle\nApplicable laws and\ngovernment regulations,\nincluding regulations\nrelating to the retail\nindustry\n• Spa products and services\n• Specialized product\nknowledge that includes:\nspa and wellness industry\nmanuals and\ndocumentations\n\nENVIRONMENT\n•\nConduciveness\n• Sanitation laws and\ncompany rules\n• Occupational Safety and\nHealth Laws\n• ASEAN Trends and\nIndustry Updates\n\nMATH\n•\nBasic Mensuration\n\nSCIENCE\n• Health and Safety\nPractices\n• Precautions and\nContraindications to\nMassage\n• Effects and Benefits of\nMassage\n• Specialized product\nknowledge that includes:\no brand options\no benefits and features\no shelf life, expiration\ndate and warranties\no ingredients or materials\ncontained in product\no product and ingredient\norigins\no corresponding or\ncomplementary\nproducts and services\n\nTECHNOLOGY\n•\nEvaluating\nhealth progress\nof the client\n•\nIdentifying\neffects of\nmassage\n•\nCommunicating\nproficiently and\neffectively\n•\nManaging\nrecords\n•\nIdentifying and\nproviding\nappropriate\naftercare\nadvices and\nactivities\n• Sharing product\nknowledge to\ncolleagues and\nclients\n• Asking questions\nto identify and\nconfirm\nrequirements\n• Applying\nknowledge to\nprovide advice on\nproducts and\nservices\n• Handling different\ntypes of clients\n•\n• Using language\nand concepts\nappropriate to\ncultural\ndifferences\n• Using and\ninterpreting non-\nverbal\ncommunication\n• Using applicable\ncommunication\nand electronic\nequipment\n• Assessing\nrelevant product\nand service\ninformation\n• Interpreting spa\npolicies and\nprocedures\n• Recording of\ninformation\n\n--- PDF PAGE 78 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 74 -\n• Facility requirements\n• Application of products\n• Specialized product\nknowledge that includes:\no storage requirements\no care and handling of\nproducts\no stock availability\no stock and merchandise\nrange\n\n•\nPricing of\nproducts and\nservices\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Work area\n\nMay include:\n1.1 Front desk\n1.2 Waiting lounge\n1.3 Contextual learning/distance learning\n1.4 Support service area\n1.5 Institutional assessment area\n1.6 Trainers’ resource center\n1.7 Learning laboratory area\n1.8 other work areas\n2.Massage implements\n\n May include:\n2.1 Consumable supplies\n2.1.1 Oils\n2.1.2 Lotions\n2.1.3 Powders\n2.1.4 Creams\n2.1.5 Liniments\n 2.1.6 Aromatic herbs\n2.2 .Linens\n2.2.1 Bed sheet\n2.2.2 Towels\n2.2.3 Robes\n2.3 Equipment\no Massage bed\no\nMassage chair\n3. Massage plan\nMay include:\n3.1\nDuration of massage session\n3.2\nFrequency of treatment\n3.3\nTechniques and manipulations to\nbe applied\n3.4\nBody region/s to be treated\n3.5\nMassage implements to be used\n4.Standard massage manipulations/strokes\n\nMay include:\n4.1.\nEffleurage/Gliding/Stroking\n4.2.\nPetrissage/Kneading\n4.3.\nFriction/Rubbing\n4.4.\nTapotement/Percussion\n4.5.\nVibration/Shaking\n5. Client complaints and conditions\n\nMay include:\n5.1 Pain\n5.2 Numbness\n5.3 Muscle tension\n5.4 Joint tightness\n\n--- PDF PAGE 79 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 75 -\n5.5 Paralysis/muscle weakness\n5.6 Lack of sleep\n5.7 Body malaise\n6. Body mechanics\n\nMay include:\n6.1 Archer/bow stance\n6.2 Warriors stance\n7. Proper positioning of the client\n\nMay include:\n7.1 Supine\n7.2 Prone\n7.3 Side lying\n7.4 Sitting\n8. Risks of injury\n\nMay include:\n8.1 Low Back Pain\n8.2 Carpal Tunnel Syndrome\n8.3 Bunions\n8.4 Strain\n8.5 Sprain\n9. Effects of Massage\nMay include:\n9.1 Benefits\n9.1.1 Physiological / Direct\n9.1.2 Psychological / Indirect\n9.2 After effects\n9.3 Allergic Reactions\n9.3.1 Bruising\n9.3.2 Dehydration\n9.3.3 Discomfort\n9.3.4 Drowsiness\n9.3.5 Postural Hypotension\n9.3.6 Temporary pain\n9.3.7 Temporary Soreness\n10. Aftercare Activities\n\nMay include:\n10.1 Immediate post-massage activities\n10.1.1 Provision of healthy beverages\n 10.1.2 Schedule of next massage\nsession\n 10.1.3 Client aftercare\n 10.1.4 Workplace aftercare\n10.2Evaluation of massage effects\n11. Aftercare Advices\nMay include:\n11.1\nPhysiological\n 11.1.1 Rehydration\n 11.1.2 Rest period\n 11.1.3Bathing restriction\n 11.1.4 Alcohol prohibition\n 11.1.5 Food and drink restrictions\n11.2\n Psychological\n11.2.1 Mental relaxation\n11.2.2 Positive disposition\n 11.2.3 Improved sleep\n11.3 Lifestyle\n11.3.1 Regular massage\n11.3.2 Diet\n11.3.3 Sleep\n11.3.4 Virtuous living\n11.3.5 Physical exercise\n 11.3.6 Spiritual exercise\n\n--- PDF PAGE 80 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 76 -\n12. Knowledge of Products\nMay include:\n8.3 Benefits and indications\n8.4 Precautions and contraindications\n8.5 Brand options\n8.6 Product and ingredients components and\norigins\n8.7 Shelf life, expiration and warranties\n8.8 Handling and storage requirements\n8.9 Stock availability\n8.10 Price\n9\nKnowledge of Services\nMay include:\n9.1 Protocols and procedures\n9.2 Service rates and duration\n9.3 Benefits and indications\n9.4 Precautions and contraindications\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1. Planned massage program of the client.\n2. Prepared work area and massage implements.\n3. Identified\nand\ndemonstrated\nstandard\nmassage\nmanipulations/strokes.\n4. Performed proper body mechanics.\n5. Performed proper draping techniques.\n6. Performed aftercare activities.\n7. Provided aftercare advices.\n2. Resource Implications\nThe following resources must be provided:\n2.1.\nAn appropriately stocked and equipped clinic or\nsimulated massage environment\n2.2.\nRelevant text or manuals\n2.3.\nRelevant paper-based assessment instruments\n2.4.\nAppropriate assessment venue\n2.5.\nSkilled assessors\n3. Methods of Assessment Competency may be assessed through:\n3.1.\nWritten examinations\n3.2.\nDemonstration with questioning (written\nassignment with practical demonstration)\n3.3.\nObservation with questioning (impression from\nassessment notes or simulated assessments)\n3.4.\nInterview/oral questioning\n4. Context of Assessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 81 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 77 -\nUNIT OF COMPETENCY :\nMAINTAIN AND ORGANIZE TOOLS, EQUIPMENT,\nSUPPLIES AND WORKPLACE AREA\nUNIT CODE\n:"
