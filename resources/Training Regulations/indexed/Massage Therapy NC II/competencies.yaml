        "source_title": "IMPLEMENT AND MONITOR INFECTION CONTROL POLICIES AND PROCEDURES",
        "source_text": "--- PDF PAGE 30 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 26 - \nUNIT OF COMPETENCY : \nIMPLEMENT AND MONITOR INFECTION CONTROL \nPOLICIES AND PROCEDURES \nUNIT CODE \n: \nHCS323201 \nUNIT DESCRIPTOR \n: \nThis unit is concerned with infection control responsibilities of \nemployees with supervisory accountability to implement and \nmonitor infection control policy and procedures in a specific \nwork unit or team within an organization. This unit does not \napply to a role with organization-wide responsibilities for \ninfection control policy and procedure development, \nimplementation or monitoring \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILL \n1. Provide \ninformation to \nthe work group \nabout the \norganization's \ninfection control \npolicies and \nprocedures. \n1.1 Relevant information about \nthe organization's infection \ncontrol policy and \nprocedures, and applicable \nindustry codes of practice \nare accurately and clearly \nexplained to the work group \n \n1.2 Information about identified \nhazards and the outcomes \nof infection risk \nassessments is regularly \nprovided to the work group \n \n1.3 Opportunity is provided for \nthe work group to seek \nfurther information on \nworkplace infection control \nissues and practices \nCOMMUNICATION \n \nWorking \nknowledge, \nconsistent with \nthe elements of \ncompetence, of \nthe organization's \napplicable \ninfection control \npolicy and \nprocedures and \nrelevant industry \ncodes of practice \n \n \nThe significance \nof patient \nconfidentiality in \nrelation to \ninfection control \n \n \nLiteracy levels \nand \ncommunication \nskills of work \ngroup members \nand consequent \nsuitable \ncommunication \ntechniques \n \n \n \nOrganizational \nprocedures for \n \nEffective \ncommunicating \nand \ninterpersonal \nskills including: \no language \ncompetence \n \no literacy and \nreading \ncompetence \n \n \nNegotiating \nSkills \n \n \nWork planning \nand \nmanagement \n \n \nManaging \nchange of work \nprocesses \n \n \nMonitoring \ncompliance with \npolicy and \nprocedures \n \n \nMaintaining and \ninterpreting \ninfection control \nrecords\n\n--- PDF PAGE 31 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 27 - \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILL \nmonitoring, \ntraining \n \nENVIRONMENT   \n \nAble to \nacknowledge \nimportance of \ninfection control \n \nThe hierarchy risk \ncontrol measures \nfrom most to least \npreferred, that is, \nelimination, \nengineering \ncontrols, \nadministrative \ncontrol, and \nlastly, personal \nprotective \nequipment \n \nKnowledge of \ninfection risks and \ncontrol measures \nin specific work \nunit and related \nwork processes \n \nThe significance \nof other \nmanagement \nsystems and \nprocedures for \ninfection control \n \nBasic \nunderstanding of \ncommunicable \ndisease \ntransmission \nSCIENCE  \n \nable to \nunderstand the \nimportance of \nhealth safety \n2. Integrate the \norganization's \ninfection control \n2.1 Infection control policy \nand procedures are \nimplemented by supervisor \nCOMMUNICATION \n \nWorking \nknowledge, \n \nEffective \ncommunicating \nand\n\n--- PDF PAGE 32 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 28 - \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILL \npolicy and \nprocedure into \nwork practices \nand members of the work \ngroup. \n \n2.2 Liaison is maintained with \nperson responsible for \norganization-wide infection \ncontrol. \n \n2.3 The Supervisor's coaching \nsupport ensures that \nindividuals/teams are able \nto implement infection \ncontrol practices \n \n2.4 Work procedures are \nadopted to reflect \nappropriate infection control \npractice \n \n2.5 Issues raised through \nconsultation are dealt with \nand resolved promptly or \nreferred to the appropriate \npersonnel for resolution \n \n2.6 Workplace procedures for \ndealing with infection control \nrisks and hazardous events \nare implemented whenever \nnecessary \n \n2.7 Employees are encouraged \nto report infection risks and \nto improve infection control \nprocedures \n \n \n \nconsistent with \nthe elements of \ncompetence, of \nthe organization's \napplicable \ninfection control \npolicy and \nprocedures and \nrelevant industry \ncodes of practice \n \n \nThe significance \nof patient \nconfidentiality in \nrelation to \ninfection control \n \n \nLiteracy levels \nand \ncommunication \nskills of work \ngroup members \nand consequent \nsuitable \ncommunication \ntechniques \n \n \n \nOrganizational \nprocedures for \nmonitoring, \ntraining \n \nENVIRONMENT   \n \nAble to \nacknowledge \nimportance of \ninfection control \n \nThe hierarchy risk \ncontrol measures \nfrom most to least \npreferred, that is, \nelimination, \nengineering \ncontrols, \ninterpersonal \nskills including: \no language \ncompetence \n \no literacy and \nreading \ncompetence \n \n \nNegotiating \nSkills \n \n \nWork planning \nand \nmanagement \n \n \nManaging \nchange of work \nprocesses \n \n \nMonitoring \ncompliance with \npolicy and \nprocedures \n \n \nMaintaining and \ninterpreting \ninfection control \nrecords\n\n--- PDF PAGE 33 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 29 - \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILL \nadministrative \ncontrol, and \nlastly, personal \nprotective \nequipment \n \nKnowledge of \ninfection risks and \ncontrol measures \nin specific work \nunit and related \nwork processes \n \nThe significance \nof other \nmanagement \nsystems and \nprocedures for \ninfection control \n \nBasic \nunderstanding of \ncommunicable \ndisease \ntransmission \nSCIENCE  \n \nable to \nunderstand the \nimportance of \nhealth safety \n3. Monitor \ninfection control \nperformance \nand implement \nimprovements \nin practices \n3.1 Infection control hazardous \nevents are investigated \npromptly to identify their \ncause in accordance with \norganization policy and \nprocedures \n \n3.2 Work procedures to control \ninfection risks are monitored \nto ensure compliance \n \n3.3 Work procedures are \nregularly reviewed and \nadjusted to ensure \nimprovements in infection \ncontrol practice \n \nCOMMUNICATION \n \nWorking \nknowledge, \nconsistent with \nthe elements of \ncompetence, of \nthe organization's \napplicable \ninfection control \npolicy and \nprocedures and \nrelevant industry \ncodes of practice \n \n \nThe significance \nof patient \nconfidentiality in \n \nEffective \ncommunicating \nand \ninterpersonal \nskills including: \no language \ncompetence \n \no literacy and \nreading \ncompetence \n \n \nNegotiating \nSkills \n \n \nWork planning \nand \nmanagement\n\n--- PDF PAGE 34 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 30 - \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILL \n3.4 Supervisor provides \nfeedback to team and \nindividuals on compliance \nissues, changes in work \nprocedures and infection \ncontrol outcomes \n \n3.5 Training in work procedures \nis provided as required to \nensure maintenance of \ninfection control \nstandards \n \n3.6 Inadequacies in work \nprocedures and infection \ncontrol measures are \nidentified, corrected or \nreported to designated \npersonnel \n \n3.7 Records of infection control \nrisks and incidents are \naccurately maintained as \nrequired \n \n3.8 Aggregate infection \ncontrol information reports \nare used to identify hazards, \nto monitor and improve risk \ncontrol Method and to \nindicate training needs \n \n \nrelation to \ninfection control \n \n \nLiteracy levels \nand \ncommunication \nskills of work \ngroup members \nand consequent \nsuitable \ncommunication \ntechniques \n \n \n \nOrganizational \nprocedures for \nmonitoring, \ntraining \n \nENVIRONMENT   \n \nAble to \nacknowledge \nimportance of \ninfection control \n \nThe hierarchy risk \ncontrol measures \nfrom most to least \npreferred, that is, \nelimination, \nengineering \ncontrols, \nadministrative \ncontrol, and \nlastly, personal \nprotective \nequipment \n \nKnowledge of \ninfection risks and \ncontrol measures \nin specific work \nunit and related \nwork processes \n \nThe significance \nof other \nmanagement \n \n \nManaging \nchange of work \nprocesses \n \n \nMonitoring \ncompliance with \npolicy and \nprocedures \n \n \nMaintaining and \ninterpreting \ninfection control \nrecords\n\n--- PDF PAGE 35 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 31 - \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILL \nsystems and \nprocedures for \ninfection control \n \nBasic \nunderstanding of \ncommunicable \ndisease \ntransmission \nSCIENCE  \nable to understand \nthe importance of \nhealth safety\n\n--- PDF PAGE 36 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 32 - \nRANGE OF VARIALES \n \nVARIABLE \nRANGE \n1. Infection control policies \nand procedures  \nMay include: \n1.1 Cleaning procedures and schedules \n1.2 Cleaning agents \n1.3 Cleaning equipment \n1.4 Handling, storage and disposal of all types of waste \n1.5 Food handling and food safety \n1.6 Hygiene procedures \n1.7 Infection control risk management \n1.8 Infection control incident and hazard reporting \n1.9 Sterilizing \n1.10 Linen production and handling \n1.11 Maintenance procedures \n1.12 Storage requirements \n1.13 Personal protective clothing \n1.14 Work flows \n1.15 Management of blood and body fluid spills \n1.16 Single use of disposable \n1.17 Aseptic techniques \n1.18 Skin preparation procedures \n1.19 Immunization \n1.20 Needle stick injuries \n1.21 Personal contact with infectious patients \n1.22 Standard and additional precautions \n1.23 Confidentiality \n1.24 Employee training \n1.25 Contractors \n \n2. Industry codes of \npractice \nMay include: \n2.1 National Health and Medical Research Council Guidelines for \ninfection control \n2.2 Local & National Government Guidelines and Standards \n2.3 Manufacturer's recommendations and operating manuals \n \n3. Identified hazards and \nthe outcomes of \ninfection risk \nassessments  \nMay include: \n3.1 Sharps \n3.2 Glass \n3.3 Waste \n3.4 Human waste and human tissues \n3.5 Personal contact with infectious patients \n3.6 Animals, insects and vermin \n3.7 Stock, including food, which has passed \"used-by\" dates. \n3.8 Incorrect concentration of disinfectants and chemicals\n\n--- PDF PAGE 37 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 33 - \nVARIABLE \nRANGE \n3.9 Cleaning procedures \n3.10 Linen handling procedures \n3.11 Work flows \n3.12 Use of personal protective clothing \n3.13 Food safety \n3.14 Personal hygiene \n4. Infection control \nmonitoring procedures  \nMay include: \n4.1 Observations \n4.2 Interviews \n4.3 Surveys and inspections \n4.4 Quality assurance activities \n4.5 Review of outcomes \n4.6 Data analysis \n5. Designated personnel  \nMay include: \n5.1 Manager \n5.2 Infection Control Coordinator \n5.3 Quality Improvement Coordinator \n5.4 Infection Control Committee \n5.5 Occupational Health and Safety Committee \n6. Aggregate infection \ncontrol information  \nMay include: \n6.1 Records of needle stick injuries \n6.2 Hospital-acquired infection rates \n6.3 DOH healthcare standards clinical indicators \n6.4 HACCP records \n6.5 Hazard reports\n\n--- PDF PAGE 38 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 34 - \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate  \n1.1. Communicated with team and individuals on organizational \npolicy and procedures for infection control \n1.2. Applied infection control policies and procedures which \nimpact on work processes of the specific work unit \n1.3. Applied procedures for adopting appropriate infection \npractices within work unit \n1.4. Provided appropriate supervision of work group \n \n2. Resource Implications \nThe following resources should be provided: \n1.1 \nWorkplace infection control and health and safety policies \nand procedures \n1.2 \nWaste management procedures \n1.3 \nFood safety procedures \n1.4 \nOther organizational policies and procedures  \n1.5 \nDuties statements and/or job descriptions \n \n3. Methods of \nAssessment \nCompetency may be assessed through: \n3.1. Observation  \n3.2. Interview \n3.3. Portfolio \n3.4. Demonstration with questioning \n \n4. Context of Assessment 4.1. Competency may be assessed in the workplace or at the \ndesignated TESDA Accredited Assessment Center.\n",
