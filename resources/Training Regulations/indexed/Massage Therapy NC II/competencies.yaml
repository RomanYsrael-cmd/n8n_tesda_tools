        "source_title": "PARTICIPATE IN WORKPLACE COMMUNICATION",
        "source_text": "--- PDF PAGE 6 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 2 - \nSECTION 2 COMPETENCY STANDARDS \n \nThis section gives the details and contents of the units of competency required in \nMASSAGE THERAPY NC II. These units of competency are categorized into basic, common \nand core competencies. \n \n \nBASIC COMPETENCIES \n \nUNIT OF COMPETENCY : \nPARTICIPATE IN WORKPLACE COMMUNICATION \nUNIT CODE \n: \n500311105 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes   required to \ngather, interpret and convey information in response to \nworkplace requirements. \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Obtain and \nconvey \nworkplace \ninformation \n1.1 Specific and  relevant \ninformation is accessed \nfrom appropriate \nsources  \n1.2 Effective questioning,  \nactive listening and \nspeaking skills are \nused to gather and \nconvey information \n1.3 Appropriate medium \nis used to transfer \ninformation and ideas \n1.4 Appropriate non- \nverbal communication \nis used \n1.5 Appropriate lines of \ncommunication with \nsupervisors and \ncolleagues are \nidentified and followed \n1.6 Defined workplace \nprocedures for the \nlocation and storage \nof information are \nused \n1.7 Personal interaction is \ncarried out clearly and \nconcisely\n Procedure of gathering \nworkplace information \n Techniques in \ngathering information \n Effective methods of \nconveying information \n Written communication \nmethods \n Techniques in \nconveying \ncommunication \n Different modes of \ncommunication  \n Organizational policies \n Communication \nprocedures and \nsystems \n Technology relevant to \nthe enterprise and the \nindividual’s work \nresponsibilities \n Gathering of \nworkplace \ninformation skills \n Sourcing of \ninformation skills \n Sorting of \ninformation skills \n Obtaining \nworkplace \ninformation skills \n Conveying \nworkplace \ninformation skills \n Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nRequirements\n\n--- PDF PAGE 7 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 3 - \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range of \nVariables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.  Participate in \nworkplace \nmeetings and \ndiscussions \n2.1 Team meetings are \nattended on time \n2.2 Own opinions are \nclearly expressed and \nthose of others are \nlistened to without \ninterruption \n2.3 Meeting inputs are \nconsistent with the \nmeeting purpose and \nestablished protocols \n2.4 Workplace \ninteractions are \nconducted in a \ncourteous manner  \n2.5 Questions about simple \nroutine workplace \nprocedures and \nmatters concerning \nworking conditions of \nemployment are asked \nand responded to \n2.6 Meetings outcomes are \ninterpreted and \nimplemented\n Effective \ncommunication \n Different modes of \ncommunication  \n Written communication \n Organizational policies \n Communication \nprocedures and \nsystems \n Decorum in \nparticipating workplace \nmeetings and \ndiscussions \n Participating skills \nin workplace \nmeetings and \ndiscussions \n Following simple \nspoken language \n Completing work \nrelated documents \n Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n Relating to people \nof social range in \nthe workplace \n Gathering and \nproviding \ninformation in \nresponse to \nworkplace \nRequirements \n3.  Complete \nrelevant work \nrelated \ndocuments \n3.1 Range of forms \nrelating to conditions of \nemployment are \ncompleted accurately \nand legibly \n3.2 Workplace data is \nrecorded on standard \nworkplace forms and \ndocuments \n3.3 Basic mathematical \nprocesses are used for \nroutine calculations \n3.4 Errors in recording \ninformation on forms/ \ndocuments are \nidentified and properly \nacted upon \n3.5 Reporting requirements \nto supervisor are \ncompleted according to \norganizational \nguidelines\n Methods of \nmaking/completing \nwork related \ndocuments \n Company standards \nand procedures in \nmaking work related \ndocuments \n Effective \ncommunication \n Different modes of \ncommunication  \n Written communication \n Organizational policies \n Communication \nprocedures and \nsystems \n Technology relevant to \nthe enterprise and the \nindividual’s work \nresponsibilities \n Documenting skills  \n Report writing skills \n Making/developing \nwork related \ndocuments \n Perform routine \nworkplace duties \nfollowing simple \nwritten notices \n Completing work \nrelated documents \n Estimating, \ncalculating and \nrecording routine \nworkplace \nmeasures \n Ability to relate to \npeople of social \nrange in the \nworkplace\n\n--- PDF PAGE 8 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 4 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Appropriate sources \nMay include: \n1.1 \nTeam members \n1.2 \nSuppliers \n1.3 \nTrade personnel \n1.4 \nLocal government \n1.5 \nIndustry bodies \n2. Medium \nMay include: \n2.1 \nMemorandum \n2.2 \nCircular \n2.3 \nNotice \n2.4 \nInformation discussion \n2.5 \nFollow-up or verbal instructions \n2.6 \nFace to face communication \n3. Storage \nMay include: \n3.1 \nManual filing system \n3.2 \nComputer-based filing system \n4. Forms \n4.1 \nPersonnel forms, telephone message forms, safety reports \nNote: Provided that forms are accessible and comprehensible \n5. Workplace \ninteractions \nMay include: \n5.1 \nFace to face \n5.2 \nTelephone \n5.3 \nElectronic and two way radio \n5.4 \nWritten including electronic, memos, instruction and forms, \nnon-verbal including gestures, signals, signs and diagrams \n6. Protocols \nMay include: \n6.1 \nObserving meeting \n6.2 \nCompliance with meeting decisions \n6.3 \nObeying meeting instructions\n\n--- PDF PAGE 9 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 5 - \nEVIDENCE GUIDE \n \n1. Critical Aspects of \nCompetency \nAssessment requires evidence that the candidate: \n1.1 \nPrepared written communication following standard format of \nthe organization \n1.2 \nAccessed information using communication equipment \n1.3 \nMade use of relevant terms as an aid to transfer information \neffectively \n1.4 \nConveyed information effectively adopting the formal or \ninformal communication \n2. Resource Implications The following resources should be provided: \n2.1 \nFax machine \n2.2 \nTelephone \n2.3 \nWriting materials \n2.4 \nInternet \n \n3. Methods of \nAssessment \nCompetency in this unit MUST be assessed through: \n3.1 \nDirect Observation \n3.2 \nOral interview and written test \n \n4. Context for \nAssessment \n4.1 \nCompetency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n",
