          "source_text": "1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1. Communicated appropriately with patients\n1.2. Handled complaints and resolved conflict, or referred matters\nto supervisors when required\n1.3. Complied with relevant policies, protocols, guidelines and\nprocedures of the organization\n1.4. Established and maintained good interpersonal relationship\nwith patients\n1.5. Demonstrated courtesy in all interactions with patients, their\nvisitors, and family\n2. Resource Implications\nThe following resources MUST be provided:\n2.1. Access to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2. Relevant government and organizational policy, guidelines,\nprocedures and protocols\n2.3. Any relevant legislation in relation to service delivery\n3. Method of Assessment\nCompetency may be accessed through:\n3.1. Demonstration with questioning\n3.2. Interview\n3.3. Third party report\n4. Context of assessment\n4.1. Competency maybe assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 59 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 55 -\nCORE COMPETENCIES\n\nUNIT OF COMPETENCY\n:\nDEVELOP MASSAGE PRACTICE\nUNIT CODE\n:"
