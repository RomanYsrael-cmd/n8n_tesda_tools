        "source_text": "--- PDF PAGE 45 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 41 - \nUNIT OF COMPETENCY : \nAPPLY BASIC FIRST AID \nUNIT CODE \n: \nHCS323203 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes required to \nprovide an initial response where First Aid is required. In this \nunit it is assumed that the First Aider is working under \nsupervision and / or according to established workplace First \nAid procedures and policies \n \n \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILL \n1. Assess the \nsituation \n1.1 Physical hazards to self \nand casualty’s health and \nsafety are identified \n \n1.2 Immediate risks to self \nand casualty’s \noccupational health and \nsafety (OSH) are \nminimized by controlling \nthe hazard in accordance \nwith OSH requirements \n \n1.3 Casualty’s vital signs and \nphysical condition are \nassessed in accordance \nwith workplace \nprocedures \nCOMMUNICATION \n \nCompany \nstandard \noperating \nprocedures  \n \n \nDealing with \nconfidentiality \n \n \nOffice protocols \n \n \nForms use \n \nENVIRONMENT \n \nMaintain and \npractice safety \n \n \nKnowledge of the \nFirst Aiders’ skills \nlimitations \n \n \nOSH legislation \nand regulations \n \n \nHow to gain \naccess to and \ninterpret material \nsafety data sheet \n \nSCIENCE   \n \nKnowledge on the \nnormal and \nabnormal values \nof vital signs \n \nBasic anatomy \nand physiology \n \n \nResuscitating \nSkills \n \n \nSafe manual \nhandling of \ncasualty \n \n \nConsideration \nof the welfare of \nthe casualty \n \n \nPreparing \nReport \n \n \nCommunicating \nskills \n \n \nInterpreting and \nUsing listed \ndocuments\n\n--- PDF PAGE 46 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 42 - \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILL \nTECHNOLOGY  \n \nKnowledge on the \nuse of equipment \nfor taking vital \nsigns \n2. Apply basic first \naid techniques \n2.1 First Aid management is \nprovided in accordance \nwith established First Aid \nprocedures \n \n2.2 Casualty is reassured in a \ncaring and calm manner \nand made comfortable \nusing available resources \n \n2.3 First Aid assistance is \nsought from others in a \ntimely manner and as \nappropriate \n \n2.4 Casualty’s condition is \nmonitored and responded \nto in accordance with \neffective First Aid \nprinciples and workplace \nprocedures \n \n2.5 Details of casualty’s \nphysical condition, \nchanges in conditions, \nmanagement and response \nare accurately recorded in \nline with organizational \nprocedures \n \n2.6 Casualty management is \nfinalized according to \nhis/her needs and First Aid \nprinciples \nCOMMUNICATION\n Office protocols \n Form design and \nuse \nENVIRONMENT \n \nAble to identify \nand assess \nconditions \nneeding first aid \n \nOccupational \nSafety and Health \nPolicies and \nGuidelines \n \nSCIENCE \n \nKnowledge and \ntraining on \napplication of first \naid \n \nFirst Aid \nPrinciples \n \nCasualty \nmanagement \n \nHistory of First \nAid \n \nAims of First Aid \n \nKey skills \n(preserving life \nand promoting \nrecovery) \n \nTypes of First Aid \n \nFirst Aid Service \n \nSymbols \n \nConditions that \noften require first \naid \n \n \n \n \nResuscitating \nSkills \n \n \nSafe manual \nhandling of \ncasualty \n \n \nConsideration \nof the welfare of \nthe casualty \n \n \nPreparing \nReport \n \n \nCommunicating \nskills \n \n \nInterpreting and \nUsing listed \ndocuments\n\n--- PDF PAGE 47 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 43 - \nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED  \nSKILL \nTECHNOLOGY \n \nAbility to operate \nequipment used \nfor first aid \nresponse \n \n3. Communicate \ndetails of the \nincident \n3.1 Appropriate medical \nassistance is requested \nusing relevant \ncommunication media \nand equipment \n \n3.2 Details of casualty’s \ncondition and management \nactivities are accurately \nconveyed to emergency \nservices/relieving \npersonnel \n \n3.3 Reports to supervisors are \nprepared in a timely \nmanner, presenting all \nrelevant facts according to \nestablished company \nprocedures \nCOMMUNICATION\n Office protocols \n Form design and \nuse \n Communication \nmedia \nand \nequipment \n Reporting \nprocess \n Incident \nmanagement \nprocess \n Incident \nmanagement \nsoftware \nsystems \n Human factors \n Physical incident \nmanagement \n \n \nCommunication \nskills \n \n \nPreparing \nReport \n \n \nInterpreting and \nusing listed \ndocuments \n \nFollowing office \nprotocols \n \nUsing \nappropriate \nforms in \nreporting\n\n--- PDF PAGE 48 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 44 - \nRANGE OF VARIALES \n \nVARIABLE \nRANGE \n1 First Aid management \nMay include: \n1.1 \nWorkplace policies and procedures \n1.2 \nIndustry/site specific regulations, codes \n1.3 \nOSH \n1.4 \nState and territory workplace health and safety \nrequirements \n1.5 \nAllergies the casualty may have \n \n2 Physical hazards \nMay include: \n2.1 \nWorkplace hazards \n2.2 \nEnvironmental hazards \n2.3 \nProximity of other people \n2.4 \nHazards associated with casualty management processes\n \n3 Risks \nMay include: \n3.1 \nWorksite equipment, machinery and substances \n3.2 \nEnvironmental risks \n3.3 \nBodily fluids \n3.4 \nRisk of further injury to the casualty \n3.5 \nRisk associated with the proximity of the others and \nbystanders \n4 Casualty’s condition \nMay include: \n4.1 \nAbdominal injuries \n4.2 \nAllergic reactions \n4.3 \nBleeding \n4.4 \nBurns-thermal, chemical, friction, electrical \n4.5 \nCardiac conditions \n4.6 \nChemical contamination \n4.7 \nCod injuries \n4.8 \nCrush injuries \n4.9 \nDislocations \n4.10 Drowning \n4.11 Eye injuries \n4.12 Fractures \n4.13 Head injuries \n4.14 Epilepsy \n4.15 Minor skin injuries \n4.16 Neck and spinal injuries \n4.17 Needle stick injuries \n4.18 Poisoning and toxic substances \n4.19 Shock \n4.20 Smoke inhalation\n\n--- PDF PAGE 49 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 45 - \nVARIABLE \nRANGE \n \n \n5. Equipment and \nresources \nMay include: \n5.1 Defibrillation units \n5.2 Pressure bandages \n5.3 Thermometers \n5.4 First Aid kit \n5.5 Eyewash \n5.6 Thermal blankets \n5.7 Pocket face masks \n5.8 \nRubber gloves \n5.9 \nDressing \n5.10 Space device \n5.11 Cervical collars \n6. Communication system \nMay include: \n6.1 \nMobile phone \n6.2 \nSatellite phones \n6.3 \nHF/VHF radio \n6.4 \nFlags \n6.5 \nFlares \n6.6 \nTwo - way radio \n6.7 \nEmail \n6.8 \nElectronic equipment \n7. Vital signs \nMay include: \n7.1 \nBreathing \n7.2 \nCirculation \n7.3 \nConsciousness \n8. First aid principles \nMay include: \n8.1 \nChecking the site for danger to self, casualty’ and others \nand minimizing the danger \n8.2 \nChecking and maintaining the casualty’s airways, \nbreathing and circulation\n\n--- PDF PAGE 50 ---\nTR Massage Therapy NC II(Amended) \nPromulgated February 2017 \n- 46 - \nEVIDENCE GUIDE \n \n \n1. Critical Aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 \nComplied with institutional requirements, OSH laws infections \ncontrol and manual handling procedures and relevant health \nregulations \n1.2 \nIdentified physical hazards of the casualty and minimized \nimmediate risks \n1.3 \nAssessed and monitored the physical condition of the casualty \n1.4 \nResponded to emergency using basic life support measures. \n1.5 \nProvided initial response where First Aid is required \n1.6 \nDealt with complex casualties or incident \n1.7 \nPrepared reports to concerned personnel in a timely manner  \n2. Resource \nImplications \nThe following resources should be provided: \n4.1 \nAccess to relevant work station \n4.2 \nRelevant institutional policies, guidelines procedure and protocol \n4.3 \nEquipment and materials relevant to the proposed activities \n3. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nInterview \n5.3 \nThird Party report \n5.4 \nPortfolio \n4. Context of \nAssessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n",
