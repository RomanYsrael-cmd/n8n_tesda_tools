        "source_text": "HHC322301\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes required to\nestablish the foundations of massage practice.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1.\nApply\nprinciples of\nmassage\npractice\n1.1. Compliance to legal\nstandards is ensured\nbased on applicable laws\nand government\nregulations.\n1.2. History and development\nof massage derived from\nrecommended massage\ntherapy manuals and\nreferences is discussed.\n1.3. Practice of massage is\nreviewed guided by legal\nand ethical norms.\n\nCOMMUNICATION\n•\nApplicable laws and\ngovernment\nregulations\n•\nCode of Ethics for\nmassage therapists\nENVIRONMENT\n•\nOccupational\nSafety and Health\nLaws\nMATH\n•\nArithmetic\nOperations\n•\nBasic Mensuration\nSCIENCE\n•\nDefinition of\nmassage and\nterminologies\nrelated to massage\ntherapy\n•\nHistorical\ndevelopment of\nmassage\n•\nContinuum of\nWellness\n•\nDifferent types of\nmassage\ntreatments and\ntheir key features\nand purpose,\nincluding the\ndifference between\nrelaxation and\nremedial massage\n•\nReviewing and\nreflecting on\ninformation from\na range of\nsources about\nmassage practice\n•\nEvaluating and\narticulating\nrequirements for\nsustainable\nmassage practice\n•\nDeveloping goals\nfor practice that\nreflect the values\nand philosophies\nof massage\ntherapy\n•\nCommunicating\nkey messages\nabout massage\ntherapy to\npromote the\npractice\n2. Acquire\nknowledge of\nthe basic\ntheoretical\nand practical\nfoundations\nof massage\ntherapy\n2.1. Sciences relevant to\nmassage based on\nrecommended massage\ntherapy manuals and\nreferences are identified.\n2.2. Infection control, safety\nand sanitation practices\nare implemented guided by\nknowledge of relevant\nCOMMUNICATION\n•\nApplicable laws and\ngovernment\nregulations\n•\nCode of Ethics for\nMassage\nTherapists\nENVIRONMENTAL\n•\nOccupational\nSafety and Health\n• Identifying &\nanalyzing\nmanipulations in\nmassage.\n• Identifying and\ninterpreting the\ndifferent modalities\nand complimentary\ntherapies in\nmassage.\n\n--- PDF PAGE 60 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 56 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\nsciences and company\npolicies.\n2.3. Application of theoretical\nknowledge within the\nscope of massage practice\nis emphasized following\nthe accepted framework of\nhealth and wellness\nconcepts.\nLaws\n•\nUse of Personal\nProtective\nEquipment\nMATH\n•\nArithmetic\nOperations\n•\nBasic Mensuration\nSCIENCE\n•\nHuman Anatomy\nand Physiology\n•\nMicrobiology and\nPathology\n•\nPrecautions,\nIndications and\nContraindications\n(local and absolute)\n•\nEndangerment\nSites\n•\nPhysiology of Pain\n•\nAccepted theories\no Gate control\ntheory\no Endorphin\ntheory\n•\nMassage\nmanipulations /\nstrokes\nTECHNOLOGY\n•\nFacility\nRequirements\n•\nPersonal Protective\nEquipment (PPE)\n•\nReviewing and\nreflecting on\ninformation from\na range of\nsources about\nmassage practice\n•\nEvaluating and\narticulating\nrequirements for\nsustainable\nmassage practice\n•\nDeveloping goals\nfor practice that\nreflect the values\nand philosophies\nof massage\ntherapy\n•\nCommunicating\nkey messages\nabout massage\ntherapy to\npromote the\npractice\n•\nTranslating\nconcepts and\ntheoretical\ninformation into\nmassage practice\n3. Implement\nfundamental\ns of massage\npractices\n3.1. Standard massage\nmanipulations /strokes\nand its application based\non recommended massage\ntherapy manuals and\nreferences are identified.\n3.2. Appropriate massage\nmanipulation / strokes and\npractices are applied to\nclients with disabilities and\nvarious medical and non-\nmedical conditions.\n3.3. Massage modalities and\ncomplementary therapies\nbased on recommended\nmassage therapy manuals\nand references are\nexplained.\nCOMMUNICATION\n•\nApplicable laws and\ngovernment\nregulations\n•\nDefinition of\nmassage and\nterminologies\nrelated to massage\ntherapy\n•\nHistory of massage\n(ancient, modern,\nFilipino)\n•\nContinuum of\nWellness\n•\nContinuing\nprofessional\neducation\n•\nMassage modalities\n• Identifying &\nanalyzing\nmanipulations in\nmassage.\n• Identifying and\ninterpreting the\ndifferent modalities\nand complimentary\ntherapies in\nmassage.\n•\nReviewing and\nreflecting on\ninformation from\na range of\nsources about\nmassage practice\n•\nEvaluating and\narticulating\nrequirements for\n\n--- PDF PAGE 61 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 57 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n•\nComplementary\ntherapies\nENVIRONMENT\n•\nOccupational\nSafety and Health\nLaws\n•\nUse of Personal\nProtective\nEquipment\nMATH\n•\nArithmetic\nOperations\n•\nBasic Mensuration\nSCIENCE\n•\nHuman Anatomy\nand Physiology\n•\nMicrobiology and\nPathology\n•\nPrecautions,\nIndications and\nContraindications\n(local and absolute)\n•\nEndangerment\nSites\n•\nPhysiology of Pain\n•\nAccepted theories\no Gate control\ntheory\no Endorphin\ntheory\n•\nMassage\nmanipulations /\nstrokes\nTECHNOLOGY\n•\nFacility\nRequirements\n•\nPersonal Protective\nEquipment (PPE)\n\nsustainable\nmassage practice\n•\nDeveloping goals\nfor practice that\nreflect the values\nand philosophies\nof massage\ntherapy\n•\nCommunicating\nkey messages\nabout massage\ntherapy to\npromote the\npractice\n•\nTranslating\nconcepts and\ntheoretical\ninformation into\nmassage practice\n\n--- PDF PAGE 62 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 58 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Applicable laws and\ngovernment\nregulations\nMay include:\n1.1 Chapter XII of the Code of Sanitation of the Philippines (PD\n856) and Implementing Rules and Regulations (IRR)\n1.2 TESDA Act of 1994 (RA 7796)\n1.3 Traditional & Alternative Medicine Act of 1997 (Republic Act\n8423)\n2. History and\ndevelopment of\nmassage\n\nMay include:\n2.1 History\n2.2 Ancient\n2.3 Modern\n2.4 Filipino\n2.5 Continuum of Wellness\n2.6 Continuing professional education\n2.7 Massage modalities\n2.8 Complementary therapies\n3. Legal and ethical\nnorms\n\nMay include:\n3.1 Code of Ethics for Massage Therapists\n3.2 Children in the workplace\n3.3 Codes of conduct\n3.4 Continuing professional education\n3.5 Discrimination\n3.6 Dignity of risk\n3.7 Duty of care\n3.8 Human rights\n3.9 Informed consent\n3.10 Insurance requirements\n3.11 Mandatory reporting\n3.12 Practitioner/client boundaries\n3.13 Privacy, confidentiality and disclosure\n3.14 Records management\n3.15 Work role boundaries – responsibilities and limitations\n3.16 Work health and safety\n4. Sciences relevant to\nmassage\n\nMay include:\n4.1\nAnatomy\n4.2\nPhysiology\n4.3\nMicrobiology\n4.4\nPathology\n4.5\nKinesiology\n4.6\nPrecautions, Indications and Contraindications (local and\nabsolute)\n4.7\nEndangerment Sites\n4.8\nPhysiology of Pain\n4.9\nAccepted theories\no Gate control theory\no\nEndorphin theory\n5. Recommended\nmassage therapy\nMay include:\n5.1 DOH Reference Manual for Licensed Massage Therapists\n5.2Anatomy and Physiology Books\n\n--- PDF PAGE 63 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 59 -\nmanuals and\nreferences\n5.3 Pathology for Massage Therapists Books\n5.4 Chapter XII of the Code of Sanitation of the Philippines (PD\n856) and Implementing Rules and Regulations (IRR)\n6. Infection control,\nsafety and sanitation\npractices\nMay include:\n6.1 Traditional hand washing and hand asepsis\n6.2 Disinfection and sterilization\n6.3 Waste segregation and disposal\n6.4 Handling of soiled linens\n6.5 Use of personal protective devices\n6.6 Personal hygiene\n7. Standard massage\nmanipulations/strokes\n\nMay include:\n7.1 Effleurage/Gliding/Stroking\n7.2 Petrissage/Kneading\n7.3 Friction/Rubbing\n7.4 Tapotement/Percussion\n7.5Vibration/Shaking\n8. Massage modalities\nand complementary\ntherapies\n\nMay include:\n8.1 Swedish Massage\n8.2 Reflexology\n8.3 Shiatsu\n8.4 Thai Massage\n8.5 Balinese Massage\n8.6 Hot Stone Massage\n8.7 Hawaiian Lomi-lomi\n8.8 Medical Massage\n8.9 Orthopedic massage\n8.10 Obstetric Massage\n8.11 Pediatric Massage\n8.12 Geriatric Massage\n8.13 Tui–Na\n8.14 Sports Massage\n8.15 Hilot\n8.16 Ayurveda\n\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Explained safety, sanitation & hygiene at the\nworkplace.\n1.2 Identified, accessed and interpreted the principles of\nmassage practice\n1.3 Discussed history and development of massage\n1.4 Explained the significance of anatomy & physiology\nin the practice of massage.\n1.5 Explained the importance of the microbiology and\npathology in the practice of massage.\n1.6 Identified the indications & contraindications.\n1.7 Explained physical assessment\n1.8 Identified and discussed endangerment sites\n1.9 Explained the different massage modalities and\ncomplementary therapies.\n\n--- PDF PAGE 64 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 60 -\n1.10 Explained the Standard Manipulations/ Strokes in\nmassage\n1.11 Planned the massage program\n2. Resource Implications\nThe following resources should be provided:\n2.1 An appropriately stocked and equipped clinic or\nsimulated clinic environment\n2.2 Relevant text or manuals\n2.3 Relevant paper-based assessment instruments\n2.4 Appropriate assessment venue\n2.5 Skilled assessors\n3. Methods of Assessment\nCompetency may be assessed through:\n3.1 Written examinations\n3.2 Demonstration with questioning (Written assignment\nwith practical demonstration)\n3.3 Observation with questioning (impression from\nassessment notes or simulated assessments)\n3.4 Interview / oral questioning\n4. Context of Assessment\n4.1 Competency may be assessed in actual workplace\nor at the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 65 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 61 -\nUNIT OF COMPETENCY :\n PERFORM CLIENT CONSULTATION\nUNIT CODE\n:"
