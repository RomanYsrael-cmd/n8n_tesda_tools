        "source_text": "500311106\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes to identify role\nand responsibility as a member of a team.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Describe\nteam role and\nscope\n1.1 The role and\nobjective of the team\nis identified from\navailable sources of\ninformation\n1.2 Team parameters,\nreporting relationships\nand responsibilities\nare identified from\nteam discussions and\nappropriate external\nsources\n• Company\nvision/mission\nstatements\n• Company policies\nand employee\ncode of conduct\n• Communication\nprocess\n• Team structure\n• Team roles\n• Group planning\nand decision\nmaking\n• Communicating\nskills appropriately\nand consistent\nwith the culture of\nthe workplace\n• Adopting skills to\nteam role and\nscope of\nresponsibilities\n2. Identify own\nrole and\nresponsibility\nwithin team\n2.1 Individual role and\nresponsibilities within\nthe team environment\nare identified\n2.2 Roles and\nresponsibility of other\nteam members are\nidentified and\nrecognized\n2.3 Reporting\nrelationships within\nteam and external to\nteam are identified\n• Company\nvision/mission\nstatements\n• Company policies\nand employee\ncode of conduct\n• Communication\nprocess\n• Team structure\n• Team roles\n• Group planning\nand decision\nmaking\n• Methods and\ntechniques of role\nand responsibility\nidentification with a\nteam\n• Communicating\nskills appropriately\nand consistent\nwith the culture of\nthe workplace\n• Role and\nresponsibility\nidentification skills\n\n3. Work as a\nteam member\n3.1 Effective and\nappropriate forms of\ncommunications are\nused and interactions\nundertaken with team\nmembers who\ncontribute to known\nteam activities and\nobjectives\n• Approaches of\ninteracting with\nteam members\n• Types of\ncommunications\nused in effective\ninteraction with\nteam members\n• Team working\nskills\n• Communicating\nskills appropriately\nand consistent\nwith the culture of\nthe workplace\n\n--- PDF PAGE 11 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 7 -\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3.2 Effective and\nappropriate\ncontributions are\nmade to complement\nteam activities and\nobjectives, based on\nindividual skills and\ncompetencies and\nworkplace context\n\n3.3 SOP/Protocols in\nreporting are\nobserved\n\n3.4 Contribute to the\ndevelopment of team\nwork plans based on\nan understanding of\nteam’s role and\nobjectives and\nindividual\ncompetencies of the\nmembers\n• Methods of\nworking as a team\n• Techniques in\nworking as a team\n\n• Skills in observing\nprotocols when\nmaking reports\n• Using standard\nprocedures when\nmaking reports\n• Developing\nteamwork plans\nbased on team’s\nrole and objectives\n\n--- PDF PAGE 12 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 8 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Role and objective of\nteam\nMay include:\n1.1 Work activities in a team environment with enterprise or\nspecific sector\n1.2 Limited discretion, initiative and judgment maybe\ndemonstrated on the job, either individually or in a team\nenvironment\n\n2. Sources of\ninformation\nMay include:\n2.1 Standard operating and/or other workplace procedures\n2.2 Job procedures\n2.3 Machine/equipment manufacturer’s specifications and\ninstructions\n2.4 Organizational or external personnel\n2.5 Client/supplier instructions\n2.6 Quality standards\n2.7 OSH and environmental standards\n\n3. Workplace context\nMay include:\n3.1 Work procedures and practices\n3.2 Conditions of work environments\n3.3 Legislation and industrial agreements\n3.4 Standard work practice including the storage, safe handling\nand disposal of chemicals\n3.5 Safety, environmental, housekeeping and quality guidelines\n\n--- PDF PAGE 13 ---\nTR Massage 