          "source_text": "REQUIRED \nKNOWLEDGE \n \nREQUIRED \nSKILLS \n1. \nApply \nprinciples of \nmassage \npractice \n1.1. Compliance to legal \nstandards is ensured \nbased on applicable laws \nand government \nregulations. \n1.2. History and development \nof massage derived from \nrecommended massage \ntherapy manuals and \nreferences is discussed. \n1.3. Practice of massage is \nreviewed guided by legal \nand ethical norms. \n \nCOMMUNICATION \n \nApplicable laws and \ngovernment \nregulations \n \nCode of Ethics for \nmassage therapists \nENVIRONMENT  \n \nOccupational \nSafety and Health \nLaws \nMATH \n \nArithmetic \nOperations \n \nBasic Mensuration \nSCIENCE \n \nDefinition of \nmassage and \nterminologies \nrelated to massage \ntherapy  \n \nHistorical \ndevelopment of \nmassage   \n \nContinuum of \nWellness \n \nDifferent types of \nmassage \ntreatments and \ntheir key features \nand purpose, \nincluding the \ndifference between \nrelaxation and \nremedial massage \n \nReviewing and \nreflecting on \ninformation from \na range of \nsources about \nmassage practice \n \nEvaluating and \narticulating \nrequirements for \nsustainable \nmassage practice \n \nDeveloping goals \nfor practice that \nreflect the values \nand philosophies \nof massage \ntherapy \n \nCommunicating \nkey messages \nabout massage \ntherapy to \npromote the \npractice \n2. Acquire \nknowledge of \nthe basic \ntheoretical \nand practical \nfoundations \nof massage \ntherapy \n2.1. Sciences relevant to \nmassage based on \nrecommended massage \ntherapy manuals and \nreferences are identified.  \n2.2. Infection control, safety \nand sanitation practices \nare implemented guided by \nknowledge of relevant \nCOMMUNICATION \n \nApplicable laws and \ngovernment \nregulations  \n \nCode of Ethics for \nMassage \nTherapists \nENVIRONMENTAL  \n \nOccupational \nSafety and Health \n Identifying & \nanalyzing \nmanipulations in \nmassage. \n Identifying and \ninterpreting t