        "source_text": "HHC322304\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitude required to\nmaintain and organize tools, equipment, supplies and workplace\nareas in massage therapy service environments.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n1. Perform stock\ncontrol and\ninventory\nprocedures.\n1.1. Incoming stocks are\nchecked, validated,\nrecorded, appropriately\nlabeled and rotated in\naccordance with first in-first\nout (FIFO) principle,\nmassage establishments\npolicies and relevant\ngovernment requirements.\n1.2. Products are displayed to\ngive a balanced and fully\nstocked appearance to\npromote sales following\nmassage establishment\npolicy.\n1.3. Stocks are carefully\ninspected if damaged or\nexpired, and when found\ndamaged or expired,\nstocks are disposed of in\naccordance with applicable\nlaws.\nCOMMUNICATION\n•\nMassage\nestablishment\npolicies and\nprocedures.\n•\nMethods of\nidentifying\nstocks/goods.\n•\nDocumentation\nand records\n•\nRelevant\nlegislation and\nstatutory\nrequirements in\nregard to stock\ncontrol\n\nENVIRONMENT\n\n• Occupational\nHealth and\nEnvironmental\nControl (DOLE\nRule 1070)\n• Use of personal\nprotective\nequipment (PPE)\n• Massage\nestablishment\npolicies and\nprocedures in\nregard to:\no waste disposal\nmethods of\nstorage\nMATH\n\n• Arithmetic\noperations\n• Basic mensuration\n\nTECHNOLOGY\n•\nRelevant industry\ncodes of practice\n•\nFollowing set\nroutines and\nprocedures\n•\nUsing\nelectronic\nlabelling and\nticketing\nequipment\n•\nStock/good\nrecords\ndocumentation\n•\nReporting\nproblems\n•\nReceiving and\nprocessing\nincoming\ngoods\n•\nclarifying and\nexplaining\npolicy and\nprocedures\n•\nFollowing\noccupational\nhealth and\nsafety (OSH)\nprocedures\n•\nLiteracy and\nnumeracy\nskills:\no\nfollowing\nset\nroutines\nand\nprocedures\no\nusing\nelectronic\nlabelling\nand\nticketing\nequipment\n