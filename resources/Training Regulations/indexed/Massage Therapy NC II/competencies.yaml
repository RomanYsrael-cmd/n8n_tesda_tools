          "source_text": "1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1. Planned massage program of the client.\n2. Prepared work area and massage implements.\n3. Identified\nand\ndemonstrated\nstandard\nmassage\nmanipulations/strokes.\n4. Performed proper body mechanics.\n5. Performed proper draping techniques.\n6. Performed aftercare activities.\n7. Provided aftercare advices.\n2. Resource Implications\nThe following resources must be provided:\n2.1.\nAn appropriately stocked and equipped clinic or\nsimulated massage environment\n2.2.\nRelevant text or manuals\n2.3.\nRelevant paper-based assessment instruments\n2.4.\nAppropriate assessment venue\n2.5.\nSkilled assessors\n3. Methods of Assessment Competency may be assessed through:\n3.1.\nWritten examinations\n3.2.\nDemonstration with questioning (written\nassignment with practical demonstration)\n3.3.\nObservation with questioning (impression from\nassessment notes or simulated assessments)\n3.4.\nInterview/oral questioning\n4. Context of Assessment\n4.1 Competency may be assessed in actual workplace or\nat the designated TESDA Accredited Assessment\nCenter.\n\n--- PDF PAGE 81 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 77 -\nUNIT OF COMPETENCY :\nMAINTAIN AND ORGANIZE TOOLS, EQUIPMENT,\nSUPPLIES AND WORKPLACE AREA\nUNIT CODE\n:"
