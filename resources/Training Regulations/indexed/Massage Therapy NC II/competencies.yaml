        "evidence_guide": {
          "source_text": "1. Critical Aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 \nComplied with institutional requirements, OSH laws infections \ncontrol and manual handling procedures and relevant health \nregulations \n1.2 \nIdentified physical hazards of the casualty and minimized \nimmediate risks \n1.3 \nAssessed and monitored the physical condition of the casualty \n1.4 \nResponded to emergency using basic life support measures. \n1.5 \nProvided initial response where First Aid is required \n1.6 \nDealt with complex casualties or incident \n1.7 \nPrepared reports to concerned personnel in a timely manner  \n2. Resource \nImplications \nThe following resources should be provided: \n4.1 \nAccess to relevant work station \n4.2 \nRelevant institutional policies, guidelines procedure and protocol \n4.3 \nEquipment and materials relevant to the proposed activities \n3. Methods of \nAssessment \nCompetency may be assessed through: \n5.1 \nDemonstration with questioning \n5.2 \nInterview \n5.3 \nThird Party report \n5.4 \nPortfolio \n4. Context of \nAssessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.",
