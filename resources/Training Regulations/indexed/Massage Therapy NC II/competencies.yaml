leaning\nchemicals\n3.\nHandle tools\nand\nequipment.\n3.1. Product residues\nfrom tools, equipment\nand supplies are removed\nand disposed of according\nto standard clinical and\nsanitation\npractices, massage\nestablishment policies,\noccupational health and\nsafety procedures.\n3.2. Tools and equipment are\nchecked for possible\ndamage and referred for\nmaintenance repair or\nreplacement, as required.\n3.3. Tools, equipment and\nsupplies are properly\nhandled and stored in\ntheir respective stock\ncontrol areas according to\nmassage establishment\npolicies, sanitation,\noccupational health, and\nsafety procedures.\nCOMMUNICATION\n•\nCode of Ethics for\nMassage\nTherapists\n•\nApplicable Laws\nand Government\nRegulations\n•\nMassage\nestablishment\npolicies and\nprocedures\nrelating to:\no personal\nhygiene\no compliance\nwith\ngovernment\nhealth\nregulations\nrelevant to\nvarious\nmassage\nservice areas,\nparaphernalia\nand equipment\n\nENVIRONMENT\n•\nreporting of\nspills, waste\nand other\npotential\nhazards to\nappropriate\npersonnel and\nseeking\ndirection on\naction\n•\nusing and\nmaintaining\ncleaning\nequipment\n•\ninterpreting\nmassage\nestablishment\npolicies and\nprocedures\nfollowing a\nregular routine\nthat complies\nwith\ngovernment\nregulations for\nthe cleaning,\nstorage and\nmaintenance\n\n--- PDF PAGE 85 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 81 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\n•\nOccupational\nHealth and\nEnvironmental\nControl (DOLE\nRule 1070)\n•\nPersonal\nProtective\nEquipment and\nDevices (DOLE\nRule 1080)\n•\nHazardous\nMaterials (DOLE\nRule 1090)\n•\nFire Protection and\nControl (DOLE\nRule 1940)\n•\nTechnical\nGuidelines for\nClassifying\nHazardous and\nNon-Hazardous\nEstablishments,\nWorkplaces and\nWork Processes\n(MC No. 02 series\nof 1998)\n\nMATH\n•\nArithmetic\noperations\n•\nBasic mensuration\n\nSCIENCE\n•\nTransmission\nRoutes of\nInfectious\nConditions\n•\nStandard Infection\nControl\nPrecautions\n\nTECHNOLOGY\n•\nMassage\nestablishment\npolicies and\nprocedures\nrelating to:\no cleaning,\nmaintenance\nand storage of\ntools,\nequipment and\nsupplies\nof tools,\nequipment and\nsupplies used\nin massage\nservices\n•\nmeasuring,\nmixing and\napplying\nchemicals in\ncorrect\nproportions\n•\nminimizing\nproduct waste\n\n--- PDF PAGE 86 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 82 -\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated\nin the Range of Variables\n\nREQUIRED\nKNOWLEDGE\n\nREQUIRED\nSKILLS\no tagging and\nrepair of\nelectrical\nequipment\no housekeeping\n(5S)\no maintenance\nand storage of\ncleaning\nequipment\no use and\nstorage of\ncleaning\nchemicals\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Tools, Equipment And\nSupplies\nMay include:\n1.1 Tools\n1.1.1\nHot stones/river stones\n1.1.2\nHot/cold packs\n1.1.3\nDagdagay sticks\n1.2 Equipment\n1.2.1\nMassage table\n1.2.2\nMassage chair\n1.2.3\nSauna heater\n1.2.4\nSteam boiler/generator\n1.2.5\nHot cabinet\n1.2.6\nMicrowave\n1.2.7\nRefrigerators\n1.2.8\nHot tub/Jacuzzi\n1.2.9\nAromatherapy diffuser\n1.2.10\nHot stone heater\n1.2.11\nBurners\n1.2.12\nMats\n1.2.13\nCCTV\n1.2.14\nSecurity and alarm systems\n1.2.15\nFire extinguishers\n1.2.16\nEmergency light\n\n--- PDF PAGE 87 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 83 -\nVARIABLE\nRANGE\n1.2.17\nBolsters and pillows\n1.2.18\nSupplies\n1.2.19\nOils\n1.2.20\nAlcohol/Sanitizer\n1.2.21\nLinens and towels\n1.2.22\nLotion\n1.2.23\nCreams\nNote: Supplies should be labeled appropriately (braille for\nthe blind and large print for the low vision\n2. Occupational Health\nand Safety Procedures\nMay include:\n2.1 manual handling\n2.2 procedures for care and protection of the operator\nwhen using cleaning products\n2.3 workplace hazards\n2.4 use of personal protective equipment\n2.5 waste minimization, segregation and disposal\n2.6 energy efficiency, e.g. electricity saving devices and\npractices\n2.7 water efficiency\n2.8 manufacturer instructions for the use of cleaning\nequipment\n3. Wastes\nMay include:\n3.1 Product residues\no Oils\no Lotion\no Creams\no Powder\no Liniment\no Herbs\no soap\n3.2 Disposable items or supplies\no cotton balls\no wipes\no ear tips\no underwear\no gloves\no\nface masks\n\n--- PDF PAGE 88 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 84 -\nEVIDENCE GUIDE\n\n1. Critical Aspects of\nCompetency\n\nAssessment requires evidence that the candidate:\n1.1 Consistently applied relevant health regulations and\nstandard massage establishment policies.\n1.2 Consistently applied standard massage establishment\nprocedures for cleaning, disinfection and safe storage of\nlinen, tools and equipment used in massage services\n1.3 Checked and maintained a range of tools and equipment in\nsafe working order\n1.4 Regularly applied massage establishment housekeeping\nprograms and routines, including reporting faults and\nproblems to relevant persons, and checking and referring\ntools and equipment for repair as required\n1.5Completed tasks in set time frames\n2. Resource\nImplications\nThe following resources must be provided:\n2.1 a massage establishment or a simulated massage\nestablishment environment that includes a range of work\nsituations such as client interruptions and involvement in\nother related activities normally expected in the spa\n2.2 a fully equipped spa which includes as a minimum:\no a fully functional client reception area\no massage rooms/cubicles\n2.3 equipment and work stations suitable for services,\nincluding:\no a supply of clean linen and massage lubricants\no a supply of clean client robes and shorts\no cleaning products and equipment\n2.4 relevant documentations, such as:\no health regulations\no massage establishment policies and procedures\no instructions and safety data for disinfectant and cleaning\nchemicals\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1direct observation of the candidate:\no cleaning and preparing work areas for specific services\no performing routine housekeeping\no maintaining a point of sale area\no using and maintaining cleaning equipment\n3.2 written or verbal questions appropriate to the language and\nliteracy level of the learner to test knowledge which may\ninclude:\no relevant health regulations\no massage establishment policies and procedures\no review of portfolios of evidence and third-party reports of\non-the-job performance\n4. Context of\nAssessment\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 89 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 85 -"
