    "source_text": "Section 3.4 of this TR.\n\n3.5 TRAINING FACILITIES\nMASSAGE THERAPY NC II\n\nThe Massage Therapist Learning Facility must be of concrete structure. Based on class\nsize of 15 students/trainees, the space requirements for the teaching/learning and curriculum\nareas are as follows:\n\n3.5 TRAINING FACILITIES\n\nThe Massage Therapist Learning Facility must be of concrete structure. Based on\nclass size of 15 students/trainees, the minimum space requirements for the\nteaching/learning and curriculum areas are as follows:\n\nTEACHING/LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN\nSQ. M.\nQTY\nTOTAL AREA\n(SQ. M.)\nLaboratory Area\n5 x 7\n35\n1\n35\nTool Room\n3 x 5\n15\n1\n15\nLearning Resources Area\n4 x 5\n20\n1\n20\nLecture/Training Room\n5 x 6\n30\n1\n30\nWash Area/Comfort Room (M/F)\n2.5 x 4\n10\n1\n10\nAdmin/Staff Room\n5 x 5\n25\n1\n25\nCirculation Area\n\n1\n45\nChange Room\n5 x 5\n25\n1\n25\nTOTAL WORKSHOP AREA\n\n205\n\n3.6 TRAINER QUALIFICATIONS FOR HUMAN HEALTH/HEALTH CARE SECTOR\n\nTrainers who will deliver the training on Massage Therapy NC II should possess\nthe following Qualifications:\n\n--- PDF PAGE 154 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 150 -\n Must be a holder of National TVET Trainers Certificate Level I (NTTC) in Massage\nTherapy NC II; those who will be delivering programs for the visually impaired must have\nappropriate training methodology for such kind of client\n Must have at least three (3) years work experience in the health service industry\n\n3.7 INSTITUTIONAL ASSESSMENT\n\n Institutional Assessment is undertaken by trainees in to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 155 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 153 -"
  },
