mpetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n• Apply DOLE Rule 1090 regarding Fire\nProtection and Control\n• Table\nResearch\n\n• Read DOLE MC No. 02 series of 1998\nregarding Technical Guidelines for\nClassifying Hazardous and Non-\nHazardous Establishments,\n• Lecture\n• Discussion\n\n• Written\nexamination\n\nWorkplaces and Work Processes\n•\nApply Read DOLE MC No. 02 series of\n1998 regarding Technical Guidelines for\nClassifying Hazardous and Non-\nHazardous Establishments,\nWorkplaces and Work Processes\n• Table\nResearch\n\n• Oral\nexamination\n\n• Discuss Transmission Routes of Infectious\nDisease\n• Demonstrate knowledge and skills in\napplying principles in the transmission\nroutes of infectious diseases\n• Lecture\n• Discussion\n• Table\nResearch\n• Written\nexamination\n• Oral\nexamination\n• Demonstration\n\n• Discuss Standard Infection Control\nPrecautions\n• Apply principles of standards in infection\ncontrol precautions\n• Lecture\n• Discussion\n• Table\nResearch\n\n• Written\nexamination\n• Oral\nexamination\n• Demonstration\n\n• Discuss 5S\n• Apply principles of 5S\n• Discuss and explain the use of cleaning\nequipment and chemicals\n• Lecture\n• Discussion\n• Use of visual\naids\n• Written\nexamination\n• Oral\nexamination\n\n--- PDF PAGE 149 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 145 -\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\n• Demonstration\nRole play\n• Video review\n• Observation\n• Oral\nexamination\n•\nReturn demo\n\n1.2 Clean and\norganize\nwork area\n• Discuss and explain organization, set-up\nof storage of tools, equipment and\nsupplies in the workplace\n• Demonstrate organization, set-up of and\nstorage of tools, equipment and supplies\nin the workplace\n• Demonstration\nRole play\n• Video review\n• OJT/SIT\n• Observation\n• Oral\nexamination\n• Evaluation\n• Return demo\n\n• Discuss and explain waste segregation\nand disposal\n• Demonstrate waste segregation and\ndisposal\n• Demonstration\nRole play\n• Video review\n• Observation\n• Oral\nexamination\n• Return demo\n\n1.3 Maintain\ntools and\nequipment\n• Discuss and explain procedures in\nmaintenance of tools, equipment and\nsupplies\n• Discuss and explain inventory and records\nmanagement\n• Demonstrate proper procedure in the\nmaintenance of tools, equipment and\nsupplies and perform inventory and\nrecords management\n• Demonstration\nRole play\n• Video review\n•\n• Observation\n• Oral\nexamination\n• Evaluation\n• Return demo\n\n--- PDF PAGE 150 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 146 -\n3.2 TRAINING DELIVERY\n\n1.\nThe delivery of training shall adhere to the design of the curriculum. Delivery shall\nbe guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry or\nrecognized industry sector; (Learning system is driven by competencies written to\nindustry standards)\n\nb. Training delivery is learner-centered and should accommodate individualized and\nself-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a workplace\nand/or through adoption of modern technology (Video Conferencing, Webinar,\netc).\n\nd. Assessment is based in the collection of evidence of the performance of work to\nthe industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and attitude into\naccount but requires evidence of actual performance of the competency as the\nprimary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or current\ncompetencies;\n\ng. Training completion is based on satisfactory performance of all specified\ncompetencies.\n\n2.\nThe competency-based TVET system recognizes various types of delivery modes,\nboth on-and off-the-job as long as the learning is driven by the competency standards\nspecified by the industry. The following training modalities and their variations/\ncomponents may be adopted singly or in combination with other modalities when\ndesigning and delivering training programs:\n\n2.1. Institution- Based:\n\nClassroom-based or school-based training conducted entirely within the school\nor center, with classroom and/or laboratory components.\n•\nDual Training System (DTS) / Dualized Training Program (DTP) which\ncontain both in-school and in-industry training or fieldwork components.\n•\nSupervised Industry Training (SIT) or on-the-job training (OJT) is an\napproach in training designed to enhance the knowledge and skills of the\ntrainee through actual experience in the workplace to acquire specific\ncompetencies as prescribed in the training regulations. It is imperative that\nthe deployment of trainees in the workplace is adhered to training programs\nagreed by the institution and enterprise and status and progress of trainees\nare closely monitored by the training institutions to prevent opportunity for\nwork exploitation.\n•\nProject-based instruction is an authentic instructional model or strategy in\nwhich students plan, implement and evaluate projects that have real world\napplications.\n\n--- PDF PAGE 151 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 147 -\n\n2.2. Enterprise-Based:\n\nEnterprise-based training may also be taken to mean a school or training center\nwith one or more partner enterprise or an enterprise or group of enterprises\nsetting up a common training facility or partnering with a school or training\ncenter.\n\n•\nEnterprise-based Training - where training is implemented within the\ncompany in accordance with the requirements of the specific company.\n•\nApprenticeship – Training within employment involving a contract\nbetween an apprentice and an enterprise on an approved apprenticesable\noccupation\n\n2.3. Community-Based –refers to a short program conducted or coordinated by\nNGOs, LGUs, training centers and other TVET providers which are intended to\naddress the specific needs of a community. Such programs are usually\nconducted in informal settings such as barangay hall, basketball courts and\nother available venues in a community. These programs can also be mobile\ntraining programs (MTP).\n\n3.2 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who want to enroll in this course should possess the following\nrequirements:\n\n Must have finished 10 years of basic education or Alternative Learning System (ALS)\nequivalent\n Must be able to communicate both orally and in writing\n Can perform basic mathematical computations\n\n--- PDF PAGE 152 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 148 -\n3.3 TOOLS, MATERIALS AND EQUIPMENT\nMASSAGE THERAPY NC II\n\nRecommended list of tools, equipment and materials for the training of a maximum of 15\ntrainees for the MASSAGE THERAPY NC II are as follows:\n\n3.4 TOOLS, MATERIALS AND EQUIPMENT\n\nRecommended list of tools, equipment and materials for the training of a minimum of 15\ntrainees are as follows:\n\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\n5 pcs\nAneroid\nSphygmomanometer\n5 pcs.\nMassage Table (L-\n1.83 cm, W- 0.75\ncm, H- 0.60 cm)\n5 pcs.\nFitted sheets (white)\n5 pcs\nStethoscope\n1 pc.\nMassage chair\n30 pcs.\nLarge bath towels\n(white)\n5 pcs\nDigital Thermometer\n1 pc.\nLCD projector\n30 pcs.\nFace towels (white)\n1 pc.\n*Anatomical dummy\n1 pc.\nWhiteboard/\nBlackboard\n30 pcs.\nFoot towel (white)\n1 pc.\n*Talking\nsphygmomanometer\n1 unit\nMusic/DVD player\nand portable PA\nsystem\n30 pcs.\nHand towels (white)\n2 pcs.\n*Talking thermometer\n\n5 pcs.\ncylindrical bolster\npillow with case\n(white)\n1\nream\n*Braille labeling\npaper\n1 unit\n*Computer with\nscreen reader\n5 pcs\nPillow\n\nInternet connection\n5 pcs.\nPillow case\n\n1 pc.\nPrinter\n5 pcs.\nBathrobe\n\n1 pc.\nReception counter/\noffice table\n15 pcs.\nCotton, 12 grams\n\n1 pc.\nLecture table\n3 pcs.\nWhiteboard marker\nand eraser\n\n15 pcs.\nStudent chairs\n15 pcs.\nScrub suits\n\n1 pc.\nCabinet / Display\nrack\n1\nbottle\nLotion, 150 ml.\n\n1 unit\nLocker\n30\nbottles\nAlcohol, 70% 150\nml.\n\n1 unit\nBook shelf\n15 pcs.\nFace masks\n\n15\nbottles\n\nNon- Mineral\nMassage Oil, 120\nml. portion plastic\nbottle)\n\n--- PDF PAGE 153 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 149 -\nTOOLS\nEQUIPMENT\nMATERIALS\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\nQTY\nDESCRIPTION\n\n1unit\nDrinking water\nsupply\n\n* For use of PWD trainee/students\n\nTVI’s must enter into a Memorandum of Agreement with an enterprise which has the facilities\nthat provides the needs for PWD students/trainees including tools, equipment and materials\nlisted in Section 3.4 of this TR.\n\n3.5 TRAINING FACILITIES\nMASSAGE THERAPY NC II\n\nThe Massage Therapist Learning Facility must be of concrete structure. Based on class\nsize of 15 students/trainees, the space requirements for the teaching/learning and curriculum\nareas are as follows:\n\n3.5 TRAINING FACILITIES\n\nThe Massage Therapist Learning Facility must be of concrete structure. Based on\nclass size of 15 students/trainees, the minimum space requirements for the\nteaching/learning and curriculum areas are as follows:\n\nTEACHING/LEARNING AREAS\nSIZE IN\nMETERS\nAREA IN\nSQ. M.\nQTY\nTOTAL AREA\n(SQ. M.)\nLaboratory Area\n5 x 7\n35\n1\n35\nTool Room\n3 x 5\n15\n1\n15\nLearning Resources Area\n4 x 5\n20\n1\n20\nLecture/Training Room\n5 x 6\n30\n1\n30\nWash Area/Comfort Room (M/F)\n2.5 x 4\n10\n1\n10\nAdmin/Staff Room\n5 x 5\n25\n1\n25\nCirculation Area\n\n1\n45\nChange Room\n5 x 5\n25\n1\n25\nTOTAL WORKSHOP AREA\n\n205\n\n3.6 TRAINER QUALIFICATIONS FOR HUMAN HEALTH/HEALTH CARE SECTOR\n\nTrainers who will deliver the training on Massage Therapy NC II should possess\nthe following Qualifications:\n\n--- PDF PAGE 154 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 150 -\n Must be a holder of National TVET Trainers Certificate Level I (NTTC) in Massage\nTherapy NC II; those who will be delivering programs for the visually impaired must have\nappropriate training methodology for such kind of client\n Must have at least three (3) years work experience in the health service industry\n\n3.7 INSTITUTIONAL ASSESSMENT\n\n Institutional Assessment is undertaken by trainees in to determine their achievement\nof units of competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 155 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 153 -"
