  "source_text": "COMPETENCY MAP – HUMAN HEALTH/HEALTH CARE SECTOR\n-\n(MASSAGE THERAPY NC II)\n\nBASIC COMPETENCIES\n\nReceive and respond to\nworkplace communication\nWork with others\nDemonstrate work\nvalues\nParticipate in\nworkplace\ncommunication\nWork in a team\nenvironment\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nPractice housekeeping\nprocedures (5S)\nLead workplace\ncommunication\nLead small team\nDevelop and practice\nnegotiation skills\nSolve problems related\nto work activities\nUse mathematical\nconcepts and\ntechniques\nUse relevant\ntechnologies\nUtilize specialized\ncommunication skills\nDevelop team and\nindividual\nApply problem solving\ntechniques in the\nworkplace\nCollect, analyze and\norganize information\nPlan and organize work\nPromote environmental\nprotection\n\nCOMMON COMPETENCIES\n\nMaintain effective\nrelationship with clients\nImplement and monitor\ninfection control policies\nand procedures\nMaintain a safe, clean\nand efficient work\nenvironment\nApply basic first aid\nRespond effectively to\ndifficult/challenging\nbehavior\nApply quality standards\nAssist in dental\nlaboratory procedures\nManage own performance\nMaintain instruments\nand equipment in work\narea\nFollow occupational\nhealth and safety\npolicies in dental\nlaboratory facilities\nMaintain infection\ncontrol in dental\npractice\nOperate a personal\ncomputer\nAssist with\nadministration in dental\nlaboratory practice\n\n--- PDF PAGE 158 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 156 -\nCORE COMPETENCIES\n\nProvide care and support to\ninfants and toddlers\nProvide care and\nsupport to children\nFoster social,\nintellectual, creative and\nemotional development\nof children\nFoster the physical\ndevelopment of\nchildren\nProvide care and\nsupport to elderly\nProvide care and\nsupport to people with\nspecial needs\nMaintain a healthy and\nsafe environment\nRespond to emergency\nClean living room,\ndining room, bedrooms,\ntoilet and bathroom\nWash and iron clothes,\nlinen and fabric\nPrepare hot and cold\nmeals/food\nPrepare and maintain\nbeds\nCollect and maintain\nlinen stocks at end-\nusers location\nAssist in patient\nmobility\nAssist in transporting\npatients\nAssist in bio-\npsychosocial support\ncare of patients\nHandle waste in a health\ncare environment\nInstall biomedical\nequipment\nPerform corrective\nmaintenance on\nbiomedical equipment\nPerform preventive\nmaintenance on\nbiomedical equipment\nRepair biomedical\nequipment\nAssess and refer\nbiomedical equipment\nPerform basic life\nsupport\nMaintain life support\nequipment and\nresources\nImplement safe\naccess and extrication\nprocedures in an\nemergency\nManage request for an\nambulance service\nAllocate ambulance\nservice resources\nCoordinate emergency\nresources\nDeliver basic ambulance\ncommunication skills\nSupervise on-road\noperations\nManage the scene of an\nemergency\nManage the scene of\na special event\nManage routine scene\nDeliver pre-hospital\npatient care\nDeliver intensive pre-\nhospital patient care\nManage ambulance\noperations\nTransport emergency\npatients\nTransport non-\nemergency patients\nDrive vehicles under\noperational conditions\nDevelop massage\npractice\nPerform client\nconsultation\nPerform body\nmassage\nMaintain and organize\ntools, equipment, supplies\nand work area\nWork within a\ncommunity\ndevelopment framework\nPrepare for work in the\ncommunity service\nindustry\nSupport community\nresources\nProvide\nprimary/residential care\nSupport community\nparticipation\nRecruit and coordinate\nvolunteers\nRespond holistically to\nclient issues\nDevelop and provide\nhealth education\nprogram in the\ncommunity\nImplement health\npromotion and\ncommunity interventions\n\n--- PDF PAGE 159 ---\nTR Massage Therapy NC II(Amended)\nPromulgated February 2017\n- 157 -\nGLOSSARY OF TERMS\n\n1.\nBody Mechanics – refers to using the body in an efficient and careful way\n2.\nHazardous waste – refers to the items contaminated with blood, body fluids or body\nsubstances that may be harmful to others\n3.\nInfection control - is the discipline concerned with preventing nosocomial or healthcare-\nassociated infection, a practical (rather than academic) sub-discipline of epidemiology. It\nis an essential, though often underrecognized and under supported, part of the\ninfrastructure of health care. Infection control and hospital epidemiology are akin to public\nhealth practice, practiced within the confines of a particular health-care delivery system\nrather than directed at society as a whole. Anti-infective agents\ninclude antibiotics, antibacterials, antifungals, antivirals and antiprotozoals.[1]\nInfection control addresses factors related to the spread of infections within the\nhealthcare setting (whether patient-to-patient, from patients to staff and from staff to\npatients, or among-staff), including prevention (via hand hygiene/hand washing,\ncleaning/disinfection/sterilization, vaccination, surveillance), monitoring/investigation of\ndemonstrated or suspected spread of infection within a particular health-care setting\n(surveillance and outbreak investigation), and management (interruption of outbreaks). It\nis on this basis that the common title being adopted within health care is \"infection\nprevention and control.\"\n4.\nOSH – refers to Occupational Safety and Health\n5.\nFirst Aid Kit – refers to emergency tools used to administer treatment to injured or sick\nperson\n6.\nLinen – refers to material used in draping\n7.\nTrolley – refers to device used to transport materials\n8.\nPPE - refers to Personal Protective Equipment\n9.\nThermal blanket – refers to materials used to decrease the body temperature or keep the\nbody warm.\n10. Holistic – refers to integrated wholes or complete systems (of the physical, mental,\nemotional and spiritual aspects of the individual).\n11. Framework – refers to the basic supporting idea/concept/theory.\n12. Theoretical Framework – refers to the synthesis of several theories and principles which\nserve as basis and structure to concepts and practice.\n13. Massage Therapy – refers to techniques designed to enhance overall body awareness,\nstretch and relax muscles, relieve muscle pain and spasms, improve range of motion,\nimprove circulation and relax the body and mind.\n\n--- PDF PAGE 160 ---\nACKNOWLEDGMENT\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend thanks and\nappreciation to the many representatives of business, industry, academe and government agencies,\nnon-government organizations including professional associations who donated their time and expertise\nto the development and validation of this Training Regulations.\n\n• THE TECHNICAL EXPERT PANEL (TEP)\n\n•\nMs. Marilyn B. Basilio, Micable Salon ‘N\nSpa Training and Assessment Center and\nServices Corporation\n•\nMs. Clarinna A. Cabayan, Team\nPilipinas\n•\nMs. Digna G. Kahulugan, Bulacan\nInstitute of Massage Therapy\n•\nMs. Liberty A. Lucero, Micable Salon ‘N\nSpa Training and Assessment Center and\nServices Corporation\n•\nMs. Marilyn V. Pinon, Philippine\nAssociation of Licensed Massage\nTherapists\n•\nDr. Harris E. Acero, Remnant Institute of\nAlternative Medicine, Inc.\n•\nDr. Kenneth G. Ronquillo, Department\nof Health\n•\nMs. Carmen R. Zubiaga, National\nCouncil on Disability Affairs\n• Mr. Delfin Paulino S. Felipe, Hilot at Hilom\nPilipinas Wellness Learning & Resource\nCenter\n•\nMr. Danilo S. Garin, Philippine Association\nof Licensed Massage Therapists\n• Mr. Ronnel A. Del Rio, Philippine Chamber\nof Massage Industry for Visually Impaired\n•\nMr. Christopher Francis R. Santos,\nPhilippine Association of Licensed Massage\nTherapists\n•\nMr. Richmond E. Suizo, Bulacan Institute of\nMassage Therapy\n•\nMr. Pedro C. Vasquez, , Philippine\nAssociation of Licensed Massage Therapists\n•\nDr. Pretchell P. Tolentino, Department of\nHealth\n\n• The Participants in the National Validation of this Training Regulations\n\n•\nMs. Maricel Manalo, Philippine Chamber\nof Massage Industry for Visually Impaired\n•\nMs. Juna Marie N. Anecio, E.M.Z.\nMassage Training Center\n•\nMs. Marites V. Aringo, E.M.Z. Massage\nTraining Center\n•\nMs. Emily Christie C. Belgira, E.M.Z.\nMassage Training Center\n•\nMs. Segundina S. Dela Cruz,\nTrainer/Assessor TESDA\n•\nMs. Teresita E. Mendoza, National\nVocational Rehabilitation Center (NVRC)\n•\nMs. Jeilyn O. Savellano, Philippine\nAssociation of Licensed Massage\nTherapists\n\n•\nMs. Lucita D. Ruiz, Heavenworks Healing\nPlace\n•\nMr. Samuel Q. Bernesto, Asian Alternative\nand Wellness Development Center\n•\nMr. Benjamin B. Eugenio Jr. , Federation\nof Institutes Massage Therapy in the\nPhilippines\n•\nMr. Felipe Rommel D. Martinez, Philippine\nAssociation of Licensed Massage Therapists\n•\nMr. Lazaro B. Pe, Philippine Chamber of\nMassage Industry for Visually Impaired\n•\nMr. Jerwin T. See, Bulacan Institute of\nMassage Therapy\nThe Management and Staff of the TESDA and DOH\n•\nMr. Edwin G. Maglalang, Technical Education and Skills Development Authority\n•\nMs. Julie Ann Q. Gan, Department of Health\n•\nMs. Anna Leah D. Dipatuan, Department of Health\n•\nMs. Carina Ruth R. Violan, Department of Health\n\n--- PDF PAGE 161 ---\nThese materials are available in both printed and electronic copies.\nFor more information please contact:\nTechnical Education and Skills Development Authority (TESDA)\nTelephone Nos.: 818-7728\nor visit our website: www.tesda.gov.ph",
