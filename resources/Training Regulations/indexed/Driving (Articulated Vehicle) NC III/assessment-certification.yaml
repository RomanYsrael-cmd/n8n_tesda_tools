n skills Use mathematical concepts and techniques Use relevant technologies Solve problems related to work activities Receive and respond to workplace communication Develop teams and individuals Utilize specialized communication skills Practice occupational health and safety procedures Lead workplace communication Collect, analyze and organize information Plan and organize work Apply problem- solving techniques in the workplace Lead small teams Promote environmental protection Perform Mensuration and Calculation Move and Position Vehicle Apply Appropriate Sealant/ Adhesive Use and Apply Lubricant/ Coolant Read, Interpret and Apply Specifications and Manuals Carry Out Vehicle Maintenance and Servicing Drive Light Vehicles Implement and Coordinate Accident- Emergency Procedures Obey and Observe Traffic Rules and Regulations Perform Pre-and Post Operation Procedures on Vehicles Classified Under LTO Restriction Codes 6-8 Drive Passenger Bus Drive Straight Truck Perform Minor Maintenance and Servicing on Vehicles Classified Under LTO Restriction Code 6-8 Use and Apply Lubricant/ Coolant Interpret/Draw Technical Drawing Perform Job Estimate Legend: (Articulated Vehicle) Drive Articulated Vehicles Observe Road Health and Safety Practices --- PDF PAGE 68 --- TR – DRIVING (Articulated Vehicle) NC III Promulgated January 14, 2011 64 1. Absolute speed limit - The maximum or minimum legal speed at which one may drive. This speed limit may or may not be posted. 2. Accident, motor vehicle - Any mishap involving a moving vehicle and resulting in death, injury or property damage. 3. Articulated vehicle - Any motor vehicle with a trailer having no front axle and so attached that part of the trailer rests upon the motor vehicle and a substantial part of the weight of the trailer and of its load is borne by the motor vehicle. 4. Basic speed limit - Any speed below the absolute limit that is safe for existing road, weather or traffic conditions. 5. Collision - Any crash between motor vehicles or between a motor vehicle and another object. 6. Driving license - A legal document in the form of plastic identification card and official receipt issued by LTO authorizing a person to drive and operate a specified type of motor vehicle after satisfactorily completing and passing the standard requirement as categorized either non-professional or professional proficiency level. 7. Defensive driving - Being prepared to handle through any hazardous situation caused by other users of the road. 8. Directional signals - Lights on motor vehicle or hand signals used to indicate left and right turns and stops. 9. Driver - Person with appropriate license to drive or operate motor vehicle and transport passengers and loads over specified routes or destination. 10. Professional driver - A person with appropriate driving license restriction code who is hired or paid for driving or operating a motor vehicle, whether for private use or for hire to the public. 11. Fare - Refers to the price charged to transport a passenger 12. Franchised route - Refers to the designated travel route assigned by LTFRB (DOTC) to a specific public passenger motor vehicle indicating the particular main streets, roads and avenues to ply including its limitations and boundaries. 13. Gross weight - The measured weight of a motor vehicle plus the maximum allowable carrying capacity in merchandise, freight and/or passengers, as determined by the Commission of Land Transportation 14. Highways - Every public thoroughfare, public boulevard, driveway, avenue, park, alley and callejon, but does not include roadway upon grounds owned by private persons, colleges, universities, or other similar institutions. --- PDF PAGE 69 --- TR – DRIVING (Articulated Vehicle) NC III Promulgated January 14, 2011 65 15. Motor vehicle - Any vehicle propelled by any power other than muscular power using the public highways, but excepting road rollers, trolley cars, street sweepers, sprinklers, lawn mowers, bulldozers, graders, fork lifts, amphibian trucks and cranes if not used on public highways and vehicles run only on rails or tracks and tractors, trailers and traction engines of all kinds used exclusively for agricultural purposes. 16. Passenger bus - A public utility vehicle driven on highways that carry/transport passengers (usually from 30 above) and its cargoes. 17. Periodic Maintenance Service - The regular servicing prescribed by manufacturer to maintain the vehicle’s top performance. 18. Regulatory signs - Traffic signs that tell what a driver must or must not do under penalty of the law. 19. Restriction Codes 1 and 2 - Driving license restriction set by LTO for driving/operating of the following classification of motor vehicles: 20. Restriction Codes 1 and 2 - Motorcycle, motorized tricycles and vehicles up to 4,500 kgs.GVW 21. Restriction Code 3 - Vehicles above 4,500 kgs GVW"
