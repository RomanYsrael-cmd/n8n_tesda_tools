  "source_text": "SECTION 4 NATIONAL ASSESSSMENT AND CERTIFICATION ARRANGEMENTS\n\n4.1\nTo attain the National Qualification of Driving (Articulated Vehicle) NC III, the candidate\nmust demonstrate competence through project-type assessment covering all the units listed\nin Section 1. Successful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2\nAssessment shall focus on the core units of competency. The basic and common units\nshall be integrated or assessed concurrently with the core units.\n\n4.3\nThe following are qualified to apply for assessment and certification:\n\n4.3.1\nGraduates of formal, non-formal and informal including enterprise-\nbased training programs.\n4.3.2\nExperienced workers (wage employed or self-employed)\n\n4.4\nThe guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification and Guidelines on the Implementation of the\nPhilippine TVET Qualification and Certification System (PTQCS).\n\n--- PDF PAGE 67 ---\nTR – DRIVING (Articulated Vehicle) NC III\nPromulgated January 14, 2011\n63\n\nBASIC\nCOMPETENCIES\nDemonstrate\nwork values\nPractice\nhousekeeping\nprocedures\nParticipate\nin workplace\ncommunication\nWork\nin team\nenvironment\nPractice\ncareer\nprofessionalism\nWork\nwith others\nDevelop and\npractice\nnegotiation\nskills\nUse\nmathematical\nconcepts and\ntechniques\nUse\nrelevant\ntechnologies\nSolve problems\nrelated to work\nactivities\nReceive and\nrespond to\nworkplace\ncommunication\nDevelop\nteams and\nindividuals\nUtilize\nspecialized\ncommunication\nskills\nPractice\noccupational\nhealth and\nsafety procedures\nLead\nworkplace\ncommunication\nCollect,\nanalyze and\norganize\ninformation\nPlan\nand organize\nwork\nApply\nproblem-\nsolving\ntechniques in\nthe workplace\nLead\nsmall teams\nPromote\nenvironmental\nprotection\nCORE\nCOMPETENCIES\nCOMMON\nCOMPETENCIES\n"
}
