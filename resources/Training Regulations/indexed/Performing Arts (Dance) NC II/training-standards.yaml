    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThis set of standards provides Technical and Vocational Education and Training (TVET)\nproviders with information and other important requirements to consider when designing training\nprograms for the PERFORMING ARTS (DANCE) NC II qualification.\n\nThis includes information on curriculum design; training delivery; trainee entry requirements;\ntools and equipment; training facilities; trainer’s qualification and institutional assessment\n\n3.1 CURRICULUM DESIGN\n\nCourse Title: PERFORMING ARTS (DANCE)\nNC Level: NC II\n\nNominal Training Duration: 271 Hours\n\nCourse Description:\n\nThis course is designed to enhance the knowledge, skills and attitudes of dancers in\nperforming the dance syllabus and choreographed dance in accordance with industry standards. It\ncovers the basic, common and core competencies in NC II.\n\nBASIC COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey workplace\ninformation.\n1.2 Complete relevant work related\ndocuments.\n1.3 Participate in workplace meeting\nand discussion.\n• Group\ndiscussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify team role\nand responsibility in a team.\n2.2 Describe work as a team\nmember.\n• Discussion\n• Interaction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal objectives with\norganizational goals.\n3.2 Set and meet work priorities.\n3.3 Maintain professional growth and\ndevelopment.\n• Discussion\n• Interaction\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and risks\n4.2 Control hazards and risks\n4.3 Maintain occupational health and\nsafety awareness\n• Discussion\n• Plant tour\n• Symposium\n• Observation\n• Interview\n\n--- PDF PAGE 40 ---\nTR Performing Arts (Dance) NC II\n\n- 20 -\nCOMMON COMPETENCIES\n(18 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Maintain an\neffective\nrelationship with\nclients/customers\n1.1\nMaintain a professional image\n1.2\nMeet client/customer\nrequirements\n1.3\nBuild credibility with\ncustomers/clients\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n•Interview\n2. Manage own\nperformance\n2.1\nIdentify tasks accurately\n2.2\nAllocate priority to each task\n2.3\nAllocate time lines to each\ntask\n2.4\nMeet and comply deadlines\n2.5\nKnow and comply deadlines\n2.6\nDevelop work plans\n2.7\nMonitor personal\nperformance\n2.8\nGet advice and guidance\n2.9\nApply guidance from\nmanagement\n2.10\nClarify standard of work\n• Group\nDiscussion\n• Interaction\n• Written Test\n• Practical/\nPerformance\nTest\n• Interview\n\n--- PDF PAGE 41 ---\nTR Performing Arts (Dance) NC II\n\n- 21 -\nCORE COMPETENCIES\n(235 Hours)\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Perform ballet\nmovements and\nroutines\n1.1\nCheck tapes, CDs, uniform,\nballet shoes\n1.2\nCheck completeness and\ncorrectness of performance\nroutine\n1.3\nCheck completeness of\nphysical preparations\n1.4\nReview recorded rehearsals\n1.5\nPrepare for performance\n1.6\nPerform ballet warm-up\nroutine\n1.7\nExecute plie\n1.8\nExecute battement tendu\n1.9\nExecute battement glisse\n1.10 Execute frappes\n1.11 Execute ronde de jambe a\nterre\n1.12 Execute passé\n1.13 Execute fondu\n1.14 Execute grande battement\n1.15 Perform barre exercises\n1.16 Execute adagio\n1.17 Execute sautés\n1.18 Execute balance\n1.19 Execute connecting steps\n1.20 Execute pique turns\n1.21 Execute reverence\n1.22 Perform ballet exercise\n1.23 Maintain ballet kit, costumes,\nfootwear, supplies and\nmaterials\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n2. Perform jazz\nmovements and\nroutines\n2.1\nCheck tapes/CDs, uniform,\njazz shoes\n2.2\nCheck completeness and\ncorrectness of performance\nroutine\n2.3\nCheck completeness of\nphysical preparations\n2.4\nReview recorded rehearsals\n2.5\nPrepare for performance\n2.6\nPerform jazz warm-up\nroutine\n2.7\nExecute turns\n2.8\nExecute traveling steps\n2.9\nExecute adagio\n2.10 Execute allegro\n2.11 Perform jazz exercises\n2.12 Maintain jazz kit, costumes,\nsupplies and materials\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 42 ---\nTR Performing Arts (Dance) NC II\n\n- 22 -\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Perform\nfundamentals of\nPhilippine Folk\ndances\n3.1\nCheck tapes/CDs, costumes,\nfootwear and other\naccessories\n3.2\nCheck completeness and\ncorrectness of performance\nroutine\n3.3\nCheck completeness of\nphysical preparations\n3.4\nReview recorded rehearsals\n3.5\nPrepare for performance\n3.6\nPerform warm-up exercises\n3.7\nExecute five (5) fundamental\narms and feet positions\n3.8\nExecute basic dance steps\nand patterns in ¾ time\nsignatures (waltz, waltz turn,\nnative waltz, sway balance\nseries [point, brush, waltz,\nraise, hop], mazurka and\nredoba)\n3.9\nExecute basic dance steps\nand patterns in 2/4 time\nsignatures (contraganza,\nchange step, polka series,\n[plain polka, slide polka, hop\npolka, heel and toe polka])\n3.10 Perform dance routine\n3.11 Maintain dance kit,\ncostumes, footwear and\nother dance paraphernalia\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\n• Observation\n4. Perform in\nproduction\n shows\n4.1\nCheck tapes, CDs, uniform,\nballet shoes\n4.2\nCheck completeness and\ncorrectness of performance\nroutine\n4.3\nCheck completeness of\nphysical preparations\n4.4\nReview recorded rehearsals\n4.5\nPrepare for performance\n4.6\nPerform warm-up routine\n4.7\nPerform lyrical adagio dance\n4.8\nExecute jazz allegro dance\n4.9\nPerform choreographic work\n4.10 Perform pre-set\ncombinations of skills jazz\n4.11 Maintain kit, costumes\nfootwear and other dance\nparaphernalia\n• Discussion/\nDemonstration\n\n• Written\nExamination\n• Demonstration\n• Observation\n\n--- PDF PAGE 43 ---\nTR Performing Arts (Dance) NC II\n\n- 23 -\n3.2 TRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum. Delivery should be\nguided by the 10 basic principles of competency-based TVET.\n\n• The training is based on curriculum developed from the competency standards;\n• Learning is modular in its structure;\n• Training delivery is individualized and self-paced;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and the curriculum\nmodules;\n• Assessment is based in the collection of evidence of the performance of work to the\nindustry required standard;\n• Training is based both on and off-the-job components;\n• Allows for recognition of prior learning (RPL) or current competencies;\n• Training allows for multiple entry and exit; and\n• Approved training programs are Nationally Accredited\n\nThe competency-based TVET system recognizes various types of delivery modes, both\non and off-the-job as long as the learning is driven by the competency standards specified by\nthe industry. The following training modalities may be adopted when designing training\nprograms:\n\n• The dualized mode of training delivery is preferred and recommended. Thus programs\nwould contain both in-school and in-industry training or fieldwork components. Details can\nbe referred to the Dual Training System (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality wherein the trainee\nis allowed to progress at his own pace. The trainer just facilitates the training delivery.\n• Peer teaching/mentoring is a training modality wherein fast learners are given the\nopportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in training designed to\nenhance the knowledge and skills of the trainee through actual experience in the\nworkplace to acquire specific competencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the instruction occurs\nwhen the students and instructor are not in the same place. Distance learning may\nemploy correspondence study, audio, video or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy in which students\nplan, implement and evaluate projects that have real world applicants.\n\n--- PDF PAGE 44 ---\nTR Performing Arts (Dance) NC II\n\n- 24 -\n3.3 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students wishing to enroll in this course qualifications should possess the\nfollowing requirements:\n\n• Must be literate (knows how to read and write)\n• Must be physically and mentally healthy\n• Must be at least 18 years of age*\n\n* for trainees wishing to work overseas\n\n3.4 TOOLS, EQUIPMENT AND MATERIALS\nPERFORMING ARTS (DANCE) NC II\n\nRecommended list of tools, equipment and materials for the training of a maximum of 25\ntrainees for Performing Arts (Dance) NC II are as follows:\n\nQTY.\nTOOLS\nQTY.\nEQUIPMENT\nQTY.\nMATERIALS\n1 unit\nExecutive Table\n1 unit\nAV Equipment\n5 units Make-up Kit\n25 pcs.\nArmed Chairs\n1 unit\nSound System\n1 box\nCD/VCD\n1 unit\nClerical Table\n1 unit\nCassette Player\n1 box\nCassette Tapes\n 1 pc.\nWhiteboard\n1 unit\nComputer with\nPrinter\n25 pcs.\nNumber\n1 pc.\nBlackboard\n\nAirconditioning\nUnits\n\nStage Props\n1 pc.\nMicrophone\n1 unit\nMonitor/Television\nSet\n*1 set\nUniform (Ladies) Black\nLeotards & Light Pink\ntights\n2 pcs.\nSpeakers\n\n*1 set\nRehearsal Uniform\n(Ladies) Peplum or Skirt\non top of tights or\nleggings for Folk Dance\npractice\n\n*1 set\nUniform (Men) White T-\nShirt, Black Tights and\nWhite Socks\n\n*1 set\nRehearsal Uniform (Men)\nLeggings and Fitted Shirt\n\n*1 pair Ladies – White or Light\nPink Ballet Shoes\n\n*1 pair Men – White Ballet\nShoes\n\n*1 pair Any flat shoes w/o heels\n\n*Note: For demo purposes only\n\n--- PDF PAGE 45 ---\nTR Performing Arts (Dance) NC II\n\n- 25 -\n3.5 TRAINING FACILITIES\n\nBased on a class intake of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in Sq. Meters\n\nStudent/Trainee Performance Space\n(S/TPS)\n\n5 x 8 m.\n\n40 sq. m.\n\nLearning Resource Center (LRC)\n\n1 x 5 m.\n\n5 sq. m.\n\nCirculation Area\n\n(S/TPS+LRC+SDR+CR) X 30%\n(40+5+15+10) X 30%=21 sq.m.)\n\n21 sq. m.\n\nSeparate Dressing Rooms for Male and\nFemale Trainees/ Students (SDR)\n\n3 x 5 m.\n\n15 sq. m.\n\nSeparate Restrooms for Male and Female\nTrainees/ Students (CR)\n\n2 x 5 m.\n\n10 sq. m.\n\nTotal Workshop Area\n\n91 sq. m.\n\n3.6 TRAINER’S QUALIFICATIONS FOR SERVICES SECTOR\n\nPERFORMING ARTS (DANCE) NC II\nTRAINER QUALIFICATION (TQ II)\n\n• Must be TESDA accredited/certified trainer\n• Must be a member of a reputable/recognized dance company/organization\n• Must be physically and mentally fit\n• Must have at least three (3) years teaching experience*\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional Assessment is undertaken by trainees to determine their achievement of units\nof competency. A certificate of achievement is issued for each unit of competency.\n\n--- PDF PAGE 46 ---\nTR Performing Arts (Dance) NC II\n\n- 26 -"
