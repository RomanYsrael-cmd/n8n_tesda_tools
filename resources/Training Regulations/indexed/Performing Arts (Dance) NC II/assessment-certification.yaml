n front of the head with the fingertips slightly apart. 3. Audition – a test demonstrating the skills of a performer for a specific undertaking in the performing arts. 4. Balance - waltz step; a coordinated step that shifts weight from one foot to the other foot on two levels, with accompanying arms. 5. Ballet – the most basic of all dance forms and/or a theatrical work or entertainment in which a choreographer expresses his ideas in dance movement using musical accompaniment, costumes, scenery and lighting. 6. Barre - the horizontal bar which the dancer holds for support. Every ballet class begins with exercises at the bar. 7. Battement Tendu - a slow lengthening of the legs and feet to strengthen and develop the leg muscles and insteps. 8. Chaines - chains, links; a series of rapid turns on the points or demi-pointes done in a straight line or in a circle. 9. Chasse - chased; a step in which one foot literally chases the other foot out of its position."
