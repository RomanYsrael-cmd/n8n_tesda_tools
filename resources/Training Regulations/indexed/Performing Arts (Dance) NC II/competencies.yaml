        "evidence_guide": {
          "source_text": "1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared for performance.\n1.2\nPerformed warm-up routine.\n1.3\nPerformed dance exercises.\n1.4\nMaintained kit, costumes, footwear, supplies and materials.\n2. Underpinning\nknowledge\n and attitudes\n2.1\nClassical Jazz\n2.2\nDance execution/interpretation\n2.3\nUniform\n2.4\nMusic\n2.5\nCode of Ethics\n2.6\nDesirable Attitudes:\n-\nArtistry\n-\nHonesty\n-\nCourtesy\n-\nFriendliness\n-\nPunctuality\n-\nDiscipline\n-\nAlertness\n3. Underpinning skills\n3.1\nObserving code of ethics\n3.2\nPerforming choreographed dance steps\n3.3\nUse and care of the uniform, costumes and props\n3.4\nFollowing instructions\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nDance facilities and equipment\n4.2\nDancers where practical ensemble work is being assessed\n4.3\nAppropriate venue with adequate space and required\nparaphernalia\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservance of performance\n5.2\nOral questioning on performance\n5.3\nAuthenticated details of relevant courses or training sessions\n5.4\nAuthenticated details of relevant artistic and/or commercial\nachievements\n5.5\nRelevant portfolio kit, videos, VCDs, biographies\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n6.2\nAssessment shall be while tasks are undertaken either\nindividually or as part of a team under limited supervision.\n6.3\nAssessment activities are carried out through TESDA and\nother accredited assessment center/venues by using closely\nsimulated workplace environment.\n\n--- PDF PAGE 39 ---\nTR Performing Arts (Dance) NC II\n\n- 19 -"
