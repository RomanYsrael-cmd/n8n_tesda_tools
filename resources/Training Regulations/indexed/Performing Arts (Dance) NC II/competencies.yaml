        "source_text": "--- PDF PAGE 28 ---\nTR Performing Arts (Dance) NC II \n \n- 8 - \nUNIT OF COMPETENCY:  PERFORM JAZZ MOVEMENTS AND ROUTINES \nUNIT CODE:                       HCS245302 \nUNIT DESCRIPTOR:   \nThis unit covers the knowledge, skills and attitudes in performing jazz \ncenter movements and routines such as floor warm-up routines, turns \nand adagio. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare for \nperformance \n1.1 \nTapes/CDs, uniform, jazz shoes for performance routine \nchecked as per SOP. \n1.2 \nCompleteness of performance routine checked as per SOP. \n1.3 \nPhysical preparations prior to performance routine checked as \nper SOP. \n1.4 \nRecorded rehearsals reviewed as per SOP. \n2. Perform warm-up \nroutine \n2.1 \nJazz warm-up exercises executed as per standard jazz \nwarm-up procedure. \n3. Perform jazz \nexercises \n3.1 \nTurns executed as per standard jazz exercises procedure. \n3.2 \nTravelling steps executed as per standard jazz exercises \nprocedure. \n3.3 \nAdagio (slow combination) executed as per standard jazz \nexercises procedure. \n3.4 \nAllegro (fast combination) executed as per standard jazz \nexercises procedure. \n4. Maintain jazz kit, \ncostumes, supplies \nand materials \n4.1 \nThe principles of 5S are applied in the management of jazz kit, \ncostumes, footwear supplies and materials. \n4.2 \nThe costumes and supplies are checked as per SOP at least \none (1) hour before the show. \n4.3 \nThe necessary remedial repair of damaged costumes during \nthe show and the proper reporting after the show are \nundertaken. \n4.4 \nThe proper SOPs in the care of costumes and supplies are \nfollowed during changes of costumes during the show. \n4.5 \nThe necessary stewardship for costumes of other talents who \nare currently performing in the same show is applied. \n4.6 \nThe necessary SOPs in turning over costumes and kits for \nboth day and evening shows are applied. 