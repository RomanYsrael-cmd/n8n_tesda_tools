        "source_text": "HCS245301\nUNIT DESCRIPTOR\n:\nThis unit covers the knowledge, skills and attitudes in performing\nbasic ballet movements and routines such as floor, warm-up\nexercises, barre, adagio and sautes.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for\nperformance\n\n1.1\nTapes/CDs, uniform, ballet soft shoes for performance routine\nchecked as per standard operating procedure.\n1.2\nCompleteness of performance routine checked as per\nstandard operating procedure.\n1.3\nPhysical preparations prior to performance routine checked as\nper standard operating procedure.\n1.4\nRecorded rehearsals reviewed as per standard operating\nprocedure.\n2. Perform warm-up\nroutine\n2.1\nBallet warm-up exercises performed as per standard\nprocedure.\n3. Perform barre\nexercises\n3.1\nBarre exercises are performed based on standard\nprocedures.\n3.2\nBarre exercises are performed based on musicality.\n4. Perform ballet\nmovement\n4.1\nBallet movements are performed based on standard\nprocedures.\n5. Maintain ballet kit,\ncostumes, supplies\nand materials\n5.1\nThe principles of 5S are applied in the management of ballet\nkit, costumes, footwear, supplies and materials.\n5.2\nCostumes and supplies are checked one (1) hour before the\nshow.\n5.3\nThe necessary remedial repair of damaged costumes during\nthe show and the proper reporting after the show are\nundertaken.\n5.4\nThe proper SOPs in the care of costumes and supplies are\nfollowed during changes of costumes during the show.\n5.5\nThe necessary stewardship for costumes of other talents who\nare currently performing in the same show are applied.\n5.6\nThe necessary SOPs in turning over costumes and kits for\nboth day and evening shows are applied.\n5.7\nMake-up supplies to supplement the basic make-up provided\nare sourced.\n\n--- PDF PAGE 26 ---\nTR Performing Arts (Dance) NC II\n\n- 6 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Warm-up Exercises\n1.1\nFloor Exercises\n1.2\nStanding Exercises\n2. Barre Exercises\n2.1\nPlie\n2.2\nBattement Tendu\n2.3\nBattement Glisse\n2.4\nFrappe\n2.5\nRon de Jambe a Terre\n2.6\nPasse\n2.7\nFondu\n2.8\nGrande Battement\n3. Ballet Movement\n3.1\nAdagio\n3.2\nSautes\n3.3\nBalance\n3.4\nConnecting Steps\n3.5\nPique Turns\n3.6\nReverence\n\n--- PDF PAGE 27 ---\nTR Performing Arts (Dance) NC II\n\n- 7 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\ncompetency\nAssessment requires evidence that the candidate:\n1.1\nPrepared for performance.\n1.2\nPerformed warm-up routine.\n1.3\nPerformed barre movements and routines.\n1.4\nPerformed ballet center movements and routines.\n1.5 Maintained ballet kit, costumes, footwear, supplies and\nmaterials.\n2. Underpinning\nknowledge and\nattitudes\n2.1\nClassical Ballet\n2.2\nDance Execution/Interpretation\n2.3\nUniform\n2.4 Music\n2.5\nCode of Ethics\n2.6\nDesirable Attitudes and Attributes\n-\nSafety Consciousness\n-\nIntelligence\n-\nHonesty\n-\nArtistry\n-\nPunctuality\n-\nDiscipline\n-\nAlertness\n3. Underpinning skills\n3.1\nObserving Code of Ethics\n3.2\nExecuting dance steps\n3.3\nDonning the dance uniform\n3.4\nAbility to follow instructions\n4. Resource\nimplications\nThe following resources MUST be provided:\n4.1\nDance facilities and equipment\n4.2\nOther relevant participants where practical ensemble work is\nbeing assessed\n4.3\nAppropriate venue with adequate space and required\nparaphernalia\n5. Method of\nassessment\nCompetency may be assessed through:\n5.1\nObservation of performance\n5.2\nOral questioning on performance\n5.3\nAuthenticated details of relevant courses or training sessions\nattended/participated in`\n5.4\nAuthenticated details of relevant artistic and/or commercial\nachievements\n5.5\nRelevant portfolio kit, videos, VCDs, biographies\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n6.2\nAssessment shall be while tasks are undertaken either\nindividually or as part of a team under limited supervision\nindividual.\n6.3\nAssessment are carried out through TESDA and other\naccredited assessment centers/venues by using closely\nsimulated workplace environment.\n\n--- PDF PAGE 28 ---\nTR Performing Arts (Dance) NC II\n\n- 8 -\nUNIT OF COMPETENCY: PERFORM JAZZ MOVEMENTS AND ROUTINES\nUNIT CODE:"
