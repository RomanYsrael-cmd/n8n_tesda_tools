        "source_title": "PERFORM FUNDAMENTALS OF PHILIPPINE FOLK DANCES",
        "source_text": "--- PDF PAGE 32 ---\nTR Performing Arts (Dance) NC II \n \n- 12 - \nUNIT OF COMPETENCY : \nPERFORM FUNDAMENTALS OF PHILIPPINE FOLK DANCES \nUNIT CODE \n: \nHCS245303 \nUNIT DESCRIPTOR \n: \nThis unit covers the knowledge, skills and attitudes in performing \nfundamentals of Philippine folk dances such as warm-up exercises \nand fundamental arm routines. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare for \nperformance \n1.1   Tapes/CDs, uniforms, shoes for performance routine are \nchecked as per SOP. \n1.2 \nCompleteness of performance routine is checked as per SOP. \n1.3 \nPhysical preparations prior to performance routine are \nchecked as per SOP. \n1.4\nRecorded rehearsals are reviewed as per SOP.\n2. Perform warm-up \nroutine \n2.1 \nWarm-up exercises executed as per standard dance \nprocedure. \n3. Perform dance \nexercises \n3.1 \nFive (5) fundamental arms and feet positions are executed as \nper standard dance procedure. \n3.2 \nBasic dance steps and patterns are executed as per \nstandard dance procedure. \n3.3 \nDance steps and exercises performed with grace and \nmusicality.\n4. Maintain kit, \ncostumes, supplies \nand materials \n4.1 \nThe principles of 5S are applied in the management of kit, \ncostumes, footwear, supplies and materials. \n4.2 \nThe costumes and supplies are checked as per SOP at least \none (1) hour before the show. \n4.3 \nThe necessary remedial repair of damaged costumes during \nthe show and the proper reporting after the show are \nundertaken. \n4.4 \nThe proper SOPs in the care of costumes and supplies are \nfollowed during changes of costumes during the show. \n4.5 \nStewardship for costumes of other talents who are currently \nperforming in the same show is observed. \n4.6 \nSOPs in turning over costumes and kits for both day and \nevening shows are applied. \n4.7 \nMake-up supplies to supplement the basic make-up provided \nare sourced.\n\n--- PDF PAGE 33 ---\nTR Performing Arts (Dance) NC II \n \n- 13 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Warm-up Routine  \n1.1 \nFloor Exercises \n1.2 \n  Standing Exercises \n2. Basic Dance Steps \nand Patterns \n2.1 \n2/4 time signature \n2.2 \n¾ time signature\n\n--- PDF PAGE 34 ---\nTR Performing Arts (Dance) NC II \n \n- 14 - \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency      \nAssessment requires evidence that the candidate: \n1.1   Prepared for performance. \n1.2   Performed warm-up routine. \n1.3   Performed dance exercises. \n1.4   Maintained kit, costumes, supplies and materials.\n2.  Underpinning \nknowledge \n      and attitudes \n2.1   Classical Ballet \n2.2   Modern Jazz \n2.3   Philippine Folk Dance \n2.4   Specialized Dances, Commercial, Int’l \n2.5   Dance Execution/Interpretation \n2.6   Costumes \n2.7   Music \n2.8   Props \n2.9   Code of Ethics \n2.10 Desirable Attitudes \n         - Safety Consciousness \n         - Artistry \n         - Courtesy \n         - Honesty \n         - Punctuality \n         - Discipline \n         - Alertness \n         - Obedience \n         - Loyalty \n         - Fairness \n         - Patience \n         - Courage \n         - Compassion \n         - Godliness \n         - Creativity \n         - Team Orientation \n         - Ethical Behavior \n         - Tactfulness \n         - Professionalism \n         - Friendliness \n         - Positive Thinking \n         - Flexibility \n         - Calmness under pressure \n         - Dependability \n         - Imaginativeness \n        - Trustworthiness\n3.  Underpinning skills  \n3.1 \nObserving code of ethics \n3.2 \nPerforming choreographed dance steps \n3.3 \nUse and care of the uniform, costumes footwear and props \n3.4\nFollowing instructions\n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nDance facilities and equipment \n4.2 \nOther relevant dancers where practical ensemble work is \nbeing assessed \n4.3 \nAppropriate venue with adequate space and required \nparaphernalia\n\n--- PDF PAGE 35 ---\nTR Performing Arts (Dance) NC II \n \n- 15 - \n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1 \nDirect observation of application to tasks and questions \nrelated to underpinning knowledge (interview) \n5.2 \nUnder general guidance, checking various stages of the \nprocesses and at the completion of the activity against \nperformance criteria and specifications while tasks are being \nundertaken \n5.3\nPortfolio Assessment\n6.  Context of \nassessment \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated workplace setting. \n6.2 \nAssessment shall be done while tasks are being undertaken \neither individually or as part of a team under limited \nsupervision. \n6.3 \nAssessment activities are carried out through TESDA and \nother accredited assessment center/venues by using closely \nsimulated workplace environment.\n",
