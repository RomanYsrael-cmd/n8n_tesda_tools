        "source_text": "HCS245302\nUNIT DESCRIPTOR:\nThis unit covers the knowledge, skills and attitudes in performing jazz\ncenter movements and routines such as floor warm-up routines, turns\nand adagio.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1. Prepare for\nperformance\n1.1\nTapes/CDs, uniform, jazz shoes for performance routine\nchecked as per SOP.\n1.2\nCompleteness of performance routine checked as per SOP.\n1.3\nPhysical preparations prior to performance routine checked as\nper SOP.\n1.4\nRecorded rehearsals reviewed as per SOP.\n2. Perform warm-up\nroutine\n2.1\nJazz warm-up exercises executed as per standard jazz\nwarm-up procedure.\n3. Perform jazz\nexercises\n3.1\nTurns executed as per standard jazz exercises procedure.\n3.2\nTravelling steps executed as per standard jazz exercises\nprocedure.\n3.3\nAdagio (slow combination) executed as per standard jazz\nexercises procedure.\n3.4\nAllegro (fast combination) executed as per standard jazz\nexercises procedure.\n4. Maintain jazz kit,\ncostumes, supplies\nand materials\n4.1\nThe principles of 5S are applied in the management of jazz kit,\ncostumes, footwear supplies and materials.\n4.2\nThe costumes and supplies are checked as per SOP at least\none (1) hour before the show.\n4.3\nThe necessary remedial repair of damaged costumes during\nthe show and the proper reporting after the show are\nundertaken.\n4.4\nThe proper SOPs in the care of costumes and supplies are\nfollowed during changes of costumes during the show.\n4.5\nThe necessary stewardship for costumes of other talents who\nare currently performing in the same show is applied.\n4.6\nThe necessary SOPs in turning over costumes and kits for\nboth day and evening shows are applied.\n4.7\nMake-up supplies to supplement the basic make-up provided\nare sourced.\n\n--- PDF PAGE 29 ---\nTR Performing Arts (Dance) NC II\n\n- 9 -\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Jazz Warm-Up\nExercises\n1.1\nFloor Exercises\n1.2\nStanding Exercises\n2. Jazz Exercises\n2.1\nTurns\n2.2\nTraveling Steps\n2.3\nAdagio\n2.4\nAllegro\n\n--- PDF PAGE 30 ---\nTR Performing Arts (Dance) NC II\n\n- 10 -\nEVIDENCE GUIDE\n\n1. Critical aspects of\n competency\nAssessment requires evidence that the candidate:\n1.1\nPrepared for performance.\n1.2\nPerformed warm-up routine.\n1.3\nPerformed jazz movements and routines.\n1.4\nMaintained jazz kit, costumes, supplies and other materials.\n2. Underpinning\nknowledge\n and attitudes\n2.1\nClassical Ballet\n2.2\nModern Jazz\n2.3\nProper Use and Care of Uniform\n2.4\nMusic\n2.5\nCode of Ethics\n2.6\nDesirable Attitudes:\n-\nSafety Consciousness\n-\nArtistry\n-\nCourtesy\n-\nHonesty\n-\nPunctuality\n-\nDiscipline\n-\nAlertness\n-\nObedience\n-\nLoyalty\n-\nFairness\n-\nPatient\n-\nCourage\n-\nCompassion\n-\nGodliness\n-\nCreativity\n -\nTeam-Orientation\n-\nEthical Behavior\n-\nTactfulness\n-\nProfessionalism\n-\nFriendliness\n-\nPositive Thinking\n-\nFlexibility\n-\nCalmness under pressure\n-\nDependability\n-\nImaginativeness\n-\nTrustworthiness\n3. Underpinning skills\n3.1\nObserving code of ethics\n3.2\nExecuting dance steps\n3.3\nDonning the dance uniform\n3.4\nAbility to follow instructions and implement corrections.\n\n--- PDF PAGE 31 ---\nTR Performing Arts (Dance) NC II\n\n- 11 -\n4. Resource\nimplications\nThe following resources MUST be provided\n4.1\nDance Facilities and Equipment\n4.2\nDance Uniform\n5. Method of\nassessment\nCompetency MUST be assessed through:\n5.1\nThrough direct observation of application to tasks and\nquestions related to underpinning knowledge.\n5.2\nUnder general guidance, checking various stages of the\nprocesses and at the completion of the activity against\nperformance criteria and specifications while tasks are being\nundertaken.\n6. Context of\nassessment\n6.1\nCompetency may be assessed in the workplace or in a\nsimulated workplace setting.\n6.2\nAssessment shall be done while tasks are undertaken either\