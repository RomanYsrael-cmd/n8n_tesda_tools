        "source_text": "--- PDF PAGE 36 ---\nTR Performing Arts (Dance) NC II \n \n- 16 - \nUNIT OF COMPETENCY : \nPERFORM IN PRODUCTION SHOWS \nUNIT CODE \n: \nHCS245304                         \nUNIT DESCRIPTION \n: \nThis unit covers the knowledge, skills and attitudes required in \nperforming as member of a dance troupe or production show. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the Range of Variables \n1. Prepare for \nperformance \n \n1.1 \nTapes/CDs, uniforms, shoes for performance routine are \nchecked as per SOP. \n1.2 \nCompleteness of performance routine is checked as per SOP. \n1.3 \nPhysical preparations prior to performance routine is checked \nas per SOP. \n1.4 \nRecorded rehearsals are reviewed as per SOP. \n2. Perform warm-up \nroutine \n2.1 \nWarm-up exercises executed as per standard dance \nprocedure. \n3. Perform dance \nexercises \n3.1 \nDance exercises are performed based on procedure. \n3.2 \nDance exercises are performed based on musicality. \n4. Maintain kit, \ncostumes, footwear \nsupplies and \nmaterials \n4.1 \nThe principles of 5S are applied in the management of kit, \ncostumes, footwear, supplies and materials. \n4.2 \nThe costumes, footwear and supplies are checked as per \nSOP at least one (1) hour before the show. \n4.3 \nThe necessary remedial repair of damaged costumes during \nthe show and the proper reporting after the show are \nundertaken. \n4.4 \nThe proper SOPs in the care of costumes, footwear and \nsupplies are followed during changes of costumes during the \nshow. \n4.5 \nThe necessary stewardship for costumes, footwear of other \ntalents who are currently performing in the same show are \napplied. \n4.6 \nThe necessary SOPs in turning over costumes, footwear and \nkits for both day and evening shows are applied. \n4.7 \nMake-up supplies to supplement the basic make-up provided \nare sourced.\n\n--- PDF PAGE 37 ---\nTR Performing Arts (Dance) NC II \n \n- 17 - \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Warm-up Routine  \n1.1 \n Floor Exercises \n1.2 \n Standing Exercises \n2. Dance Exercises  \n \n2.1 \n  Lyrical Jazz Adagio \n2.2 \n  Jazz Allegro \n2.3 \n  Choreographic Work \n2.4 \n  Pre-set Combinations of Skills Jazz\n\n--- PDF PAGE 38 ---\nTR Performing Arts (Dance) NC II \n \n- 18 - \nEVIDENCE GUIDE \n \n1.  Critical aspects of \ncompetency      \nAssessment requires evidence that the candidate: \n1.1 \nPrepared for performance. \n1.2 \nPerformed warm-up routine. \n1.3 \nPerformed dance exercises. \n1.4\nMaintained kit, costumes, footwear, supplies and materials.\n2.  Underpinning \nknowledge \n     and attitudes \n2.1 \nClassical Jazz \n2.2 \nDance execution/interpretation \n2.3 \nUniform \n2.4 \nMusic \n2.5 \nCode of Ethics \n2.6 \nDesirable Attitudes: \n- \nArtistry \n- \nHonesty \n- \nCourtesy \n- \nFriendliness \n- \nPunctuality \n- \nDiscipline \n-\nAlertness\n3.  Underpinning skills  \n3.1 \nObserving code of ethics \n3.2 \nPerforming choreographed dance steps \n3.3 \nUse and care of the uniform, costumes and props \n3.4\nFollowing instructions\n4.  Resource \nimplications \nThe following resources MUST be provided: \n4.1 \nDance facilities and equipment \n4.2 \nDancers where practical ensemble work is being assessed \n4.3 \nAppropriate venue with adequate space and required \nparaphernalia\n5.  Method of \nassessment \nCompetency may be assessed through: \n5.1 \nObservance of performance \n5.2 \nOral questioning on performance \n5.3 \nAuthenticated details of relevant courses or training sessions \n5.4 \nAuthenticated details of relevant artistic and/or commercial \nachievements \n5.5\nRelevant portfolio kit, videos, VCDs, biographies\n6.  Context of \nassessment \n6.1 \nCompetency may be assessed in the workplace or in a \nsimulated workplace setting. \n6.2 \nAssessment shall be while tasks are undertaken either \nindividually or as part of a team under limited supervision. \n6.3 \nAssessment activities are carried out through TESDA and \nother accredited assessment center/venues by using closely \nsimulated workplace environment.\n",
        "required_knowledge": null,
        "required_skills": null
      }
