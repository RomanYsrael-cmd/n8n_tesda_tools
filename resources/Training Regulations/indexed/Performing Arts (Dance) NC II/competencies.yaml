  "source_section_text": "Section 1. Successful candidates shall be awarded a National Certificate signed by the\nTESDA Director General.\n\n4.2 The following are qualified to apply for assessment and certification:\n\n4.2.1 Graduates of formal, non-formal and informal including enterprise-based\n\ntraining programs\n\n4.2.2 Experienced Workers (wage employed or self-employed)\n\n4.3 Reassessment is allowed only after one month from the date of assessment. Reassessment\nfor a National Certificate shall be done only on the task/s that the candidate did not\nsuccessfully achieve.\n\n4.4 A candidate who fails the assessment for two (2) consecutive times will be required to go\nthrough a refresher course before taking another assessment.\n\n4.5 Only certified individuals in this Qualification may be nominated by the industry for\naccreditation as competency assessor.\n\n4.6 Only accredited competency assessors are allowed to conduct competency assessment,\nhowever, trainers who are accredited competency assessors are not allowed to assess their\ntrainees.\n\n4.7 Assessment of competence must be undertaken only in the TESDA accredited assessment\ncenter. The performance assessment (demonstration of competence), however, may be done\nin any venue or workplace duly designated by an accredited assessment center.\n\n4.8 The guidelines on assessment and certification are discussed in detail in the Procedures\nManual on Assessment and Certification.\n\n--- PDF PAGE 47 ---\nTR Performing Arts (Dance) NC II\n\n- 27 -\nANNEX A\n\nPE\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nPerform ballet\nmovements\nand routines\nPerform fundamentals\nof Philippine folk\ndances\nMaintain an effective\nrelationship with\nclients/customers\nPerform jazz\nmovements\nand routines\nPerform in production\nshows\nBASIC\nCOMPETENCIES\nParticipate in\nworkplace\ncommunication\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nWork in a team\nenvironment\nManage own\nperformance\nCOMMON\nCOMPETENCIES\nCORE\nCOMPETENCIES\nCOMPETENCY MAP\nPERFORMING ARTS (DANCE) NC II\nPerform ballet\nmovements\nand routines\nPerform fundamentals\nof Philippine folk\ndances\nMaintain an effective\nrelationship with\nclients/customers\nPerform jazz\nmovements\nand routines\nPerform in production\nshows\nBASIC\nCOMPETENCIES\nParticipate in\nworkplace\ncommunication\nPractice career\nprofessionalism\nPractice occupational\nhealth and safety\nprocedures\nWork in a team\nenvironment\nManage own\nperformance\n\n--- PDF PAGE 48 ---\nTR Performing Arts (Dance) NC II\n\n- 28 -\nDEFINITION OF TERMS\n\n1.\nAdage/Adagio – a series of exercises consisting of a succession of slow movements\nperformed with grace, fluidity and ease.\n2.\nArm Positions\nBras Bas -\nthe arms are in a long curve and held at the sides with the little fingers\ntouching the middle of the thighs.\nFirst Position - the arms form a circle in front of the body in line with the diaphragm, with\nthe fingertips about 1 inch apart and the palms facing the body.\nSecond Position - the arms are held out to the sides slightly in front of the body in a long,\ncurved line so that the elbow is slightly lower than the shoulder, the wrist\nslightly lower than the elbow and the palms facing slightly forward and\ndownward.\nThird Position - one arm is in long curve above the head while the other is held in the 2nd\nposition.\nFourth Position - one arm is in a long curve above the head while the other is in first\nposition.\nFifth Position -\nboth arms are in a long curve above and slightly in front of the head with\nthe fingertips slightly apart.\n3.\nAudition – a test demonstrating the skills of a performer for a specific undertaking in the\nperforming arts.\n4.\nBalance - waltz step; a coordinated step that shifts weight from one foot to the other foot on\ntwo levels, with accompanying arms.\n5.\nBallet – the most basic of all dance forms and/or a theatrical work or entertainment in which\na choreographer expresses his ideas in dance movement using musical accompaniment,\ncostumes, scenery and lighting.\n6.\nBarre - the horizontal bar which the dancer holds for support. Every ballet class begins with\nexercises at the bar.\n7.\nBattement Tendu - a slow lengthening of the legs and feet to strengthen and develop the\nleg muscles and insteps.\n8.\nChaines - chains, links; a series of rapid turns on the points or demi-pointes done in a\nstraight line or in a circle.\n9.\nChasse - chased; a step in which one foot literally chases the other foot out of its position.\n10. Choreographer – one who conceptualizes and creates a series of movements to represent a\ntheme or idea.\n11. Combination - a series of steps and movements together and done in different tempos.\n12. Coordination – the ability to make use of the different parts of the body and make them act\nor move in a harmonious manner.\n13. Coupe – cut, cutting; a small intermediary step done as a preparation or impetus for some\nother steps.\n14. Dance Form – refers to a particular style or discipline of dance.\n15. Dance Master – one who has studied and mastered the skills and technique of dance and is\ntherefore eligible to teach and conduct dance courses in his/her specialized field.\n16. Dance Style – refers to a distinct manner of movement that identifies a particular dance form,\nperformer, choreographer or a period.\n17. Dance Syllabus - a compilation of dance exercises containing the curriculum of a dance\nform in various levels.\n\n--- PDF PAGE 49 ---\nTR Performing Arts (Dance) NC II\n\n- 29 -\n18. Demi-Plie – half bend of the knees.\n19. Demi-Pointes – on the half-point indicating that the dancer is to stand on the balls of the feet\nand under part of the toes.\n20. En l’air - in the air; off the floor movements done with jumps or extensions.\n21. Fondu - sinking down; a lowering of the body by bending the knee of the supporting leg.\n22. Foot Positions - all movements begin, end or pass through one of these positions. In all\npositions the knees are straight and the legs are turned out form the hip. The weight is evenly\nplaced on each foot.\nFirst Position - the aim is to make a straight line with the feet, which may not be possible at\nfirst.\nSecond Position - heels about 12 inches apart.\nThird Position - heel of one foot close to the instep of the other foot.\nFourth Position - right foot about 10 inches in front of the left foot with heel in line of the arch\nof the left foot (and vice versa).\nFifth Position - feet touching. The aim is for the heel of the right foot to be placed in front of\nthe left toe, although this may not be possible at first.\n23. Frappe – struck (to strike); the brushing of the foot against the floor in a slow or fast tempo to\ndevelop strength and speed in footwork.\n23. Glissade – glide; a traveling step executed by gliding the working foot from the fifth position\nin the required direction, and the other foot closing to it.\n24. Glisse – glided or gliding; the foot sliding against the floor.\n25. Grande Battement – an exercise in which the working leg is raised from the hip into the air\nand brought down again, with both knees straight.\n26. Grande Jetes – large jete; in this step the legs are thrown to 90 degrees with a\ncorresponding high jump.\n27. Isolation – to move a particular section of the body set apart from the rest of the anatomy.\n28. Jazz Runs/Walks – a walk or run in a rhythmic pattern based on the jazz form.\n29. Jete – a leap from one foot to the other in which the working leg is brushed onto the air.\n30. Passe – passed; a movement in which the foot of the working leg is picked up and passes in\nback or in front of the knee of the supporting leg.\n31. Pas De Bourree – three-step movement, i.e. the feet going back side, front.\n32. Pique – pricked, pricking; executed by stepping directly on the pointe or demi-pointe of the\nworking foot in any desired position, with the other foot raised in the air.\n33. Pique Turn – a stepping on demi-pointe and turning with the working leg in passe’ position.\n34. Piroette - whirl or spin; a complete turn of the body on one foot, on pointe or demi-pointe.\n35. Placement – placing; well aligned head, neck, shoulders, hips, spine and proper turn out\nwhile executing movements or poses.\n36. Plie’ – a slow, continuous bending of the knees downward and rising upward with\ncoordinated movement of the arms and the legs.\n37. Pointe – on the points; rising of the body on the tips of the toes.\n38. Porte De Bras – carriage of the arms; the arms passing through various positions in a\nflowing and continuous way to develop grace and coordination in the entire body.\n\n--- PDF PAGE 50 ---\nTR Performing Arts (Dance) NC II\n\n- 30 -\n39. Projection – the ability to communicate to an audience a dramatic role, idea, personality,\nfeelings, etc. in an effective way.\n40. Releve – a smooth, continuous rising of the feet on pointe or demi-pointe to strengthen the\nAchilles tendon, insteps and thighs.\n41. Repertoire – an index of dance numbers that a performer or a group of performers are\nprepared to present before an audience.\n42. Reverence – a courtesy performed by the artist to acknowledge the applause of the\naudience and/or show respect to the dance master at the end of a dance class.\n43. Ronde De Jambe A Terre – an exercise at the barre or in the center in which one leg is\nmade to describe a series of circular movements on the ground. There are 2 kinds of ronde\nde jambe a terre: those done an dedans (inward) and those done an dehors (outward).\n44. Saute’ In All Positions – series of jumps; springing and landing on one or both feet, various\npositions.\n45. Soutenu – sustained; a turn held in place.\n46. Spotting – a term given to the movement of the head and focusing of the eyes in pirouettes\nand other turns. In these turns, the dancer chooses a spot in front and as the turn is made\naway from the spot, the head is the last to leave and the first to arrive as the body completes\nthe turn. This rapid movement or snap of the head gives the impression that the face is\nalways turned forward and prevents the dancer from becoming dizzy.\n47. Style – a dancer’s or choreographer’s artistic interpretation of movement.\n48. Technique – skilled and disciplined execution of movement required in the different forms of\ndance (i.e. Ballet Technique or Jazz Technique); it is the correct posture and placement of\nbody and the correct direction and movement of the feet, hands, head, shoulders, and arms.\nIt is also the correct turnout, balance, extension of legs, execution of jumps, turns, etc.\n49. Timing – adherence to tempo of the music according to the instructions of a choreographer,\ndance master or a written syllabus. It is also referred to as MUSICALITY.\n50. Turn-Out – the ability of the dancer to turn his or her feet and legs out from the hip joints to a\n90-degree position.\n\n--- PDF PAGE 51 ---\nACKNOWLEDGEMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to extend\nthanks and appreciation to the many representatives of business, industry, academe and\ngovernment agencies who rendered their time and expertise to the development and validation of\nthese Training Regulations.\n\nMS. CORAZON INIGO\nProfessor\n70 7th Ave., Cubao\nQuezon City\n\nMR. GENER CARINGAL\nHead\nNational Dance Committee\nNational Committee for Culture and Arts (NCCA)\n\nMS. SHIRLEY HALILI CRUZ\nDirector\nHalili Cruz School of Ballet\n1227 Quezon Avenue\nQuezon City\n\nMS. PRISCILLA S. CARO\n\nPresident\n\nConfederation of Artists, Managers and\nDevelopment and Association (CAMDA)\n\n#2 Senatorial Drive\nCor. March St. Congressional Village 3 Project 8\nQuezon City\n\nMR. LITO G. SESE\nPresident\nAssociation of Accredited Training Centers in\nPerforming Arts (AATCIPA)\n108 A. Rodriguez Avenue\n\nMembers of the TESDA Board\n\nTESDA EXCOM\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n\n--- PDF PAGE 