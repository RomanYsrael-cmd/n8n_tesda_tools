    {
      "term": "- 30 -",
      "definition": "39. Projection – the ability to communicate to an audience a dramatic role, idea, personality, feelings, etc. in an effective way. 40. Releve – a smooth, continuous rising of the feet on pointe or demi-pointe to strengthen the Achilles tendon, insteps and thighs. 41. Repertoire – an index of dance numbers that a performer or a group of performers are prepared to present before an audience. 42. Reverence – a courtesy performed by the artist to acknowledge the applause of the audience and/or show respect to the dance master at the end of a dance class. 43. Ronde De Jambe A Terre – an exercise at the barre or in the center in which one leg is made to describe a series of circular movements on the ground. There are 2 kinds of ronde de jambe a terre: those done an dedans (inward) and those done an dehors (outward). 44. Saute’ In All Positions – series of jumps; springing and landing on one or both feet, various positions. 45. Soutenu – sustained; a turn held in place. 46. Spotting – a term given to the movement of the head and focusing of the eyes in pirouettes and other turns. In these turns, the dancer chooses a spot in front and as the turn is made away from the spot, the head is the last to leave and the first to arrive as the body completes the turn. This rapid movement or snap of the head gives the impression that the face is always turned forward and prevents the dancer from becoming dizzy. 47. Style – a dancer’s or choreographer’s artistic interpretation of movement. 48. Technique – skilled and disciplined execution of movement required in the different forms of dance (i.e. Ballet Technique or Jazz Technique); it is the correct posture and placement of body and the correct direction and movement of the feet, hands, head, shoulders, and arms. It is also the correct turnout, balance, extension of legs, execution of jumps, turns, etc. 49. Timing – adherence to tempo of the music according to the instructions of a choreographer, dance master or a written syllabus. It is also referred to as MUSICALITY. 50. Turn-Out – the ability of the dancer to turn his or her feet and legs out from the hip joints to a 90-degree position."
