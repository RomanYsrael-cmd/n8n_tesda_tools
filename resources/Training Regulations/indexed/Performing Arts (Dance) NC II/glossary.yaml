      "definition": "Adage/Adagio – a series of exercises consisting of a succession of slow movements performed with grace, fluidity and ease. 2. Arm Positions Bras Bas - the arms are in a long curve and held at the sides with the little fingers touching the middle of the thighs. First Position - the arms form a circle in front of the body in line with the diaphragm, with the fingertips about 1 inch apart and the palms facing the body. Second Position - the arms are held out to the sides slightly in front of the body in a long, curved line so that the elbow is slightly lower than the shoulder, the wrist slightly lower than the elbow and the palms facing slightly forward and downward. Third Position - one arm is in long curve above the head while the other is held in the 2nd position. Fourth Position - one arm is in a long curve above the head while the other is in first position. Fifth Position - both arms are in a long curve above and slightly in front of the head with the fingertips slightly apart. 3. Audition – a test demonstrating the skills of a performer for a specific undertaking in the performing arts. 4. Balance - waltz step; a coordinated step that shifts weight from one foot to the other foot on two levels, with accompanying arms. 5. Ballet – the most basic of all dance forms and/or a theatrical work or entertainment in which a choreographer expresses his ideas in dance movement using musical accompaniment, costumes, scenery and lighting. 6. Barre - the horizontal bar which the dancer holds for support. Every ballet class begins with exercises at the bar. 7. Battement Tendu - a slow lengthening of the legs and feet to strengthen and develop the leg muscles and insteps. 8. Chaines - chains, links; a series of rapid turns on the points or demi-pointes done in a straight line or in a circle. 9. Chasse - chased; a step in which one foot literally chases the other foot out of its position. 10. Choreographer – one who conceptualizes and creates a series of movements to represent a theme or idea. 11. Combination - a series of steps and movements together and done in different tempos. 12. Coordination – the ability to make use of the different parts of the body and make them act or move in a harmonious manner. 13. Coupe – cut, cutting; a small intermediary step done as a preparation or impetus for some other steps. 14. Dance Form – refers to a particular style or discipline of dance. 15. Dance Master – one who has studied and mastered the skills and technique of dance and is therefore eligible to teach and conduct dance courses in his/her specialized field. 16. Dance Style – refers to a distinct manner of movement that identifies a particular dance form, performer, choreographer or a period. 17. Dance Syllabus - a compilation of dance exercises containing the curriculum of a dance form in various levels."
