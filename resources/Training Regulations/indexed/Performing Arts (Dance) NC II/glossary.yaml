    {
      "term": "- 29 -",
      "definition": "18. Demi-Plie – half bend of the knees. 19. Demi-Pointes – on the half-point indicating that the dancer is to stand on the balls of the feet and under part of the toes. 20. En l’air - in the air; off the floor movements done with jumps or extensions. 21. Fondu - sinking down; a lowering of the body by bending the knee of the supporting leg. 22. Foot Positions - all movements begin, end or pass through one of these positions. In all positions the knees are straight and the legs are turned out form the hip. The weight is evenly placed on each foot. First Position - the aim is to make a straight line with the feet, which may not be possible at first. Second Position - heels about 12 inches apart. Third Position - heel of one foot close to the instep of the other foot. Fourth Position - right foot about 10 inches in front of the left foot with heel in line of the arch of the left foot (and vice versa). Fifth Position - feet touching. The aim is for the heel of the right foot to be placed in front of the left toe, although this may not be possible at first. 23. Frappe – struck (to strike); the brushing of the foot against the floor in a slow or fast tempo to develop strength and speed in footwork. 23. Glissade – glide; a traveling step executed by gliding the working foot from the fifth position in the required direction, and the other foot closing to it. 24. Glisse – glided or gliding; the foot sliding against the floor. 25. Grande Battement – an exercise in which the working leg is raised from the hip into the air and brought down again, with both knees straight. 26. Grande Jetes – large jete; in this step the legs are thrown to 90 degrees with a corresponding high jump. 27. Isolation – to move a particular section of the body set apart from the rest of the anatomy. 28. Jazz Runs/Walks – a walk or run in a rhythmic pattern based on the jazz form. 29. Jete – a leap from one foot to the other in which the working leg is brushed onto the air. 30. Passe – passed; a movement in which the foot of the working leg is picked up and passes in back or in front of the knee of the supporting leg. 31. Pas De Bourree – three-step movement, i.e. the feet going back side, front. 32. Pique – pricked, pricking; executed by stepping directly on the pointe or demi-pointe of the working foot in any desired position, with the other foot raised in the air. 33. Pique Turn – a stepping on demi-pointe and turning with the working leg in passe’ position. 34. Piroette - whirl or spin; a complete turn of the body on one foot, on pointe or demi-pointe. 35. Placement – placing; well aligned head, neck, shoulders, hips, spine and proper turn out while executing movements or poses. 36. Plie’ – a slow, continuous bending of the knees downward and rising upward with coordinated movement of the arms and the legs. 37. Pointe – on the points; rising of the body on the tips of the toes. 38. Porte De Bras – carriage of the arms; the arms passing through various positions in a flowing and continuous way to develop grace and coordination in the entire body."
