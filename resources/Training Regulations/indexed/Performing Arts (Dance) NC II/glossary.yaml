 foot to be placed in front of\nthe left toe, although this may not be possible at first.\n23. Frappe – struck (to strike); the brushing of the foot against the floor in a slow or fast tempo to\ndevelop strength and speed in footwork.\n23. Glissade – glide; a traveling step executed by gliding the working foot from the fifth position\nin the required direction, and the other foot closing to it.\n24. Glisse – glided or gliding; the foot sliding against the floor.\n25. Grande Battement – an exercise in which the working leg is raised from the hip into the air\nand brought down again, with both knees straight.\n26. Grande Jetes – large jete; in this step the legs are thrown to 90 degrees with a\ncorresponding high jump.\n27. Isolation – to move a particular section of the body set apart from the rest of the anatomy.\n28. Jazz Runs/Walks – a walk or run in a rhythmic pattern based on the jazz form.\n29. Jete – a leap from one foot to the other in which the working leg is brushed onto the air.\n30. Passe – passed; a movement in which the foot of the working leg is picked up and passes in\nback or in front of the knee of the supporting leg.\n31. Pas De Bourree – three-step movement, i.e. the feet going back side, front.\n32. Pique – pricked, pricking; executed by stepping directly on the pointe or demi-pointe of the\nworking foot in any desired position, with the other foot raised in the air.\n33. Pique Turn – a stepping on demi-pointe and turning with the working leg in passe’ position.\n34. Piroette - whirl or spin; a complete turn of the body on one foot, on pointe or demi-pointe.\n35. Placement – placing; well aligned head, neck, shoulders, hips, spine and proper turn out\nwhile executing movements or poses.\n36. Plie’ – a slow, continuous bending of the knees downward and rising upward with\ncoordinated movement of the arms and the legs.\n37. Pointe – on the points; rising of the body on the tips of the toes.\n38. Porte De Bras – carriage of the arms; the arms passing through various positions in a\nflowing and continuous way to develop grace and coordination in the entire body.\n\n--- PDF PAGE 50 ---\nTR Performing Arts (Dance) NC II\n\n- 30 -\n39. Projection – the ability to communicate to an audience a dramatic role, idea, personality,\nfeelings, etc. in an effective way.\n40. Releve – a smooth, continuous rising of the feet on pointe or demi-pointe to strengthen the\nAchilles tendon, insteps and thighs.\n41. Repertoire – an index of dance numbers that a performer or a group of performers are\nprepared to present before an audience.\n42. Reverence – a courtesy performed by the artist to acknowledge the applause of the\naudience and/or show respect to the dance master at the end of a dance class.\n43. Ronde De Jambe A Terre – an exercise at the barre or in the center in which one leg is\nmade to describe a series of circular movements on the ground. There are 2 kinds of ronde\nde jambe a terre: those done an dedans (inward) and those done an dehors (outward).\n44. Saute’ In All Positions – series of jumps; springing and landing on one or both feet, various\npositions.\n45. Soutenu – sustained; a turn held in place.\n46. Spotting – a term given to the movement of the head and focusing of the eyes in pirouettes\nand other turns. In these turns, the dancer chooses a spot in front and as the turn is made\naway from the spot, the head is the last to leave and the first to arrive as the body completes\nthe turn. This rapid movement or snap of the head gives the impression that the face is\nalways turned forward and prevents the dancer from becoming dizzy.\n47. Style – a dancer’s or choreographer’s artistic interpretation of movement.\n48. Technique – skilled and disciplined execution of movement required in the different forms of\ndance (i.e. Ballet Technique or Jazz Technique); it is the correct posture and placement of\nbody and the correct direction and movement of the feet, hands, head, shoulders, and arms.\nIt is also the correct turnout, balance, extension of legs, execution of jumps, turns, etc.\n49. Timing – adherence to tempo of the music according to the instructions of a choreographer,\ndance master or a written syllabus. It is also referred to as MUSICALITY.\n50. Turn-Out – the ability of the dancer to turn his or her feet and legs out from the hip joints to a\n90-degree position.\n\n--- PDF PAGE 51 ---"
