  "source_section_text": "SECTION 3. TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider when\ndesigning training programs for Electronics Back-end Operations NC II.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title: Electronics Production Line Back-end Operations NC Level: NC II\n\nNominal Training Duration:\n 16 hrs – Basic Competencies\n\n 16 hrs – Common Competencies\n\n 48 hrs – Core Competencies\n ----------\n\n 80 hrs – Total\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of an\nElectronics Back-end Operator, in accordance with industry standards. It covers the basic and\ncommon competencies in addition to the core competencies such as preparing workplace,\nanalyzing, carrying-out and monitoring back-end machine/equipment operation and checking\nquality compliance for electronics production line back-end operations.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 43 ---\nTR-Electronic Back-End Operations NC II (NEW) Promulgated Dec. 16, 2015\n39\nBASIC COMPETENCIES\n(16 HRS.)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and\nconvey workplace\ninformation\n• Describe Organizational policies\n• Group\ndiscussion\n• Oral evaluation\n4 Hours\n• Read:\no Effective communication\n• Lecture\n• Written\nexamination\n\no Written communication\n\no Communication procedures and\nsystems\n\n• Identify:\no Different modes of communication\n\no Medium of communication\no Flow of communication\n\no Available technology relevant to the\nenterprise and the individual’s work\nresponsibilities\n\n• Prepare different Types of question\n• Demonstration\n• Observation\n\n• Gather different sources of information\n\n• Apply storage system in establishing\nworkplace information\n\n• Demonstrate Telephone courtesy\n\n1.2 Complete relevant\nwork related\ndocuments\n• Describe Communication procedures and\nsystems\n• Group\ndiscussion\n• Oral evaluation\n\n• Read:\no Meeting protocols\n• Lecture\n• Written\nexamination\n\no Nature of workplace meetings\n• Lecture\n• Written\n\n--- PDF PAGE 44 ---\nTR-Electronic Back-End Operations NC II (NEW) Promulgated Dec. 16, 2015\n40\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDuration\n\no Workplace interactions\nexamination\n\no Barriers of communication\n\n• Complete work related documents\n\n• Demonstration\n• Observation\n\n• Read instructions on work related\nforms/documents\n• Lecture\n• Written\nexamination\n\n• Practice:\n\no Estimate, calculate and record routine\nworkplace measures\n• Demonstration\n• Observation\n\no Basic mathematical processes of\naddition, subtraction, division and\nmultiplication\n\n• Demonstrate office activities in:\no workplace meetings and discussions\nscenario\n• Role play\n• Oral evaluation\n• Observation\n\n• Perform workplace duties scenario following\nsimple written notices\n• Role play\n• Oral evaluation\n• Observation\n\n• Follow simple spoken language\n• Demon