\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n2.3 Load electronics\nback-end\nproduction units\n•\nIdentify/Determine electronics back-end operations\nprocess controls\n•\nStudy and learn product orientation and specifications\n•\nIdentify usage of appropriate PPE and ESD apparels\n•\nUse appropriate tools\n•\nPerform procedures in loading and processing\nproduction units based on product orientation and\nspecifications\n•\nCheck production output based on product criteria\n•\nPractice manual electronics back-end process based\non instruction and company procedures\n•\nDetermine machines alarms/errors\n•\nDetermine applicable out-of-control action\nplan(OCAP) on electronics back-end operations\n•\nVerify product criteria\n•\nPerform visual/ mechanical inspection\n•\nAccomplish electronics back-end production line\ndocuments\n•\nLecture\n•\nDiscussion\n•\nHands-on\n•\nViewing\nmultimedia\n\n•\nWritten exam\n•\nPractical\nexam\n\n4 hrs\n3. Check quality\ncompliance of\nback-end\noperation for\nelectronics\nproduction line\n\n16 hrs\n3.1 Monitor electronics\nback-end\noperation\n•\nCheck output and yield requirements\n•\nDetermine machine capacity\n•\nLearn and apply Basic Statistical Process Control\n(SPC) rules / applicable out-of-control action\nplan(OCAP)\n•\nVerify product criteria\n•\nPerform visual/ mechanical inspection\n•\nDetermine abnormality or non-conformance or\ndeviation to the process\n•\nAccomplish required production forms\n•\nCheck completeness and accuracy of information on\nelectronics back-end production form for unusual\nmachine operation\n•\nLecture\n•\nDiscussion\n•\nHands-on\n\n• Written exam\n•\nOral\nquestioning\n\n4 hrs\n\n--- PDF PAGE 57 ---\nTR-Electronic Back-End Operations NC II (NEW) Promulgated Dec. 16, 2015\n53\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodologies\nAssessment\nApproach\nNominal\nDuration\n\n3.2 Perform visual\ninspection\n•\nUse inspection tool