      "source_text": "SECTION 3. TRAINING ARRANGEMENTS\n\nThese guidelines are set to provide the Technical and Vocational Education and\nTraining (TVET) providers with information and other important requirements to consider when\ndesigning training programs for Electronics Back-end Operations NC II.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based curricula to\nenable training providers develop their own curricula with the components mentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this end,\nTVET providers shall develop a Contextual Learning Matrix (CLM) to accompany their\ncurricula.\n\nCourse Title: Electronics Production Line Back-end Operations NC Level: NC II\n\nNominal Training Duration:\n 16 hrs – Basic Competencies\n\n 16 hrs – Common Competencies\n\n 48 hrs – Core Competencies\n ----------\n\n 80 hrs – Total\n\nCourse Description:\n\nThis course is designed to develop & enhance the knowledge, skills, & attitudes of an\nElectronics Back-end Operator, in accordance with industry standards. It covers the basic and\ncommon competencies in addition to the core competencies such as preparing workplace,\nanalyzing, carrying-out and monitoring back-end machine/equipment operation and checking\nquality compliance for electronics production line back-end operations.\n\nTo obtain this, all units prescribed for this qualification must be achieved.\n\n--- PDF PAGE 43 ---\nTR-Electronic Back-End Operations NC II (NEW) Promulgated Dec. 16, 2015\n39\nBASIC COMPETENCIES\n(16 HRS.)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodo