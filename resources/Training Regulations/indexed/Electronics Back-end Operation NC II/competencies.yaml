          "source_text": "REQUIRED KNOWLEDGE\nREQUIRED \nSKILLS \n1. Gather tools \nand materials  \nfor \nelectronics \nproduction \nline back-end \nprocess \n \n1.1. Process requirements are \ndetermined according to \nproduction specifications \n1.2. Appropriate tools and \nmaterials are selected and \ncompleted according to \nprocess requirements and \nrequired time \n1.3. Quantity and quality of \nmaterials are checked in \naccordance with \nproduction specifications\n1.4. Completeness and \naccuracy of documents are \nchecked in accordance \nwith production \nspecifications \n \n Awareness of electronics \nproduction line systems and \nprocesses \n Familiarity with electronics \nproduction line back-end \nmaterials  \n Understanding bill of \nmaterials, travelers, check \nlist and other applicable \nelectronics production line \nbackend documents/ \nspecifications. \n Awareness of safe handling \nof tools and materials i.e. 5S \nprinciples, Material Safety \nData Sheet (MSDS), \nPersonal Protective \nEquipment (PPE), Electro \nStatic Discharge (ESD), \nEnvironmental Health \nSystems (EHS), \nOccupational Health and \nSafety (OHS), Cleanroom \nrequirements and \ncontamination control  \n Understanding of IPC \nstandards \n Awareness  of international \nquality standards \no Quality Management \nSystem \no Environmental \nManagement System \n Familiarity with visual \ncriteria \n Familiarity with electronics \nproduction line back-end \ntools \n Reading skills \n Basic \nmathematical \nskills \n Communication \nskills \n Computer skills \n Detecting \nabnormality or \nnon-\nconformance \n Writing skills\n\n--- PDF PAGE 32 ---\nTESDA-SOP-QSO-01-F08 \nTR-Electronic Back-End Operations NC II (NEW)        Promulgated Dec. 16, 2015 \n28\nELEMENT \nPERFORMANCE CRITERIA\nItalicized terms are elaborated \nin the Range of Variables \nREQUIRED KNOWLEDGE\nREQUIRED \nSKILLS \n Time consciousness on \nsetup time \n \n2. Set up \nelectronics \nback-end \nmachin