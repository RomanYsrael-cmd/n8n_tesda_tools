orities \n Practice time \nmanagement \n3. Maintain \nprofessional \ngrowth and \ndevelopment \n4.1  Trainings and career \nopportunities are \nidentified and availed of  \nbased on job \nrequirements \n4.2  Recognitions are \nsought/received and \ndemonstrated as proof of \ncareer advancement \n4.3  Licenses and/or \ncertifications relevant to \njob and career are \nobtained and renewed \n Career development \nopportunities \n Company \nrecognition and \nincentives \n Information on \nrelevant licenses and \nor certifications \n Determining \npersonal career \ndevelopment \nneeds \n Identifying career \nopportunities\n\n--- PDF PAGE 14 ---\nTESDA-SOP-QSO-01-F08 \nTR-Electronic Back-End Operations NC II (NEW)        Promulgated Dec. 16, 2015 \n10\n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Evaluation \n1.1  Performance Appraisal \n1.2  Psychological Profile \n1.3 Aptitude Tests \n2.  Resources \n2.1  Human \n2.2  Financial \n2.3  Technology \n2.3.1  Hardware \n2.3.2 Software \n3.  Trainings and career \nopportunities \n3.1 Participation in training programs \n      3.1.1 Technical \n      3.1.2  Supervisory \n      3.1.3  Managerial \n      3.1.4  Continuing Education \n3.2  Serving as Resource Persons in conferences \nand workshops \n4.  Recognitions \n4.1  Recommendations \n4.2  Citations \n4.3  Certificate of Appreciations \n4.4  Commendations \n4.5  Awards \n4.6 Tangible and Intangible Rewards \n5.  Licenses and/or \ncertifications \n5.1  National Certificates \n5.2  Certificate of Competency \n5.3 Support Level Licenses \n5.4  Professional Licenses\n\n--- PDF PAGE 15 ---\nTESDA-SOP-QSO-01-F08 \nTR-Electronic Back-End Operations NC II (NEW)        Promulgated Dec. 16, 2015 \n11\nEVIDENCE GUIDE \n \n1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 Attained job targets within key result areas (KRAs) \n1.2 Maintained intra - and interpersonal relationship in the \ncourse of managing oneself based on performan