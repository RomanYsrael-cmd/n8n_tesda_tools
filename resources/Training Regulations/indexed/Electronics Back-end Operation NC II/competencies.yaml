place organization \n(layout/arrangement of \nworkplace) \n Understanding the \napplicable daily PM \nchecklist \n Electronics back-end \nmachine basic physical \nconditions  \n Time consciousness \n Awareness of applicable out \nof control action plan \n(OCAP)  \n 5S principles \n Checking of \nmachine basic \nphysical \nconditions  \n Detecting \nabnormality or \nnon-\nconformance \n Writing skills \n Skills in \nhousekeeping\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \nTR-Electronic Back-End Operations NC II (NEW)        Promulgated Dec. 16, 2015 \n29\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Production \nspecifications \nMay include: \n1.1 \nMachine specifications \n1.2 \nSet-up checklist \n1.3 \nWork Instructions (WI)/Job order \n1.4 \nProduction procedures \n1.5 \nOut of Control Action Plan (OCAP) procedures \n1.6 \nControl Plan procedures \n1.7 \nStatistical Process Control (SPC) procedures \n1.8 \nWork Manuals \n1.9 \nProduction Process and Flow Diagrams \n2. Tools \nTools may include: \n2.1 \nTweezers  \n2.2 \nVacuum Pen \n2.3 \nMetric Allen Keys \n2.4 \n12 Digit Calculator \n2.5 \nTorque driver \n3. Processes \nElectronics back-end processes may include but not be \nlimited to: \n3.1 \nSingulation  \n3.2 \nSoldering \n3.3 \nTesting \n3.4 \nFinal Assembly \n3.5 \nMarking \n3.6 \nPackaging \n3.7 \nFinal Visual Inspection \n \n4. Required time \nRequired time may include: \n4.1 \nProduction cycle time \n4.2 \nProcess cycle time \n4.3 \nMachine operation cycle time \n5. Machine parameters \nMachine parameters may include: \n5.1 \nMachine type \n5.2 \nMachine model \n5.3 \nMachine settings \n5.4 \nMaterial/ Product type \n5.5 \nMaterial/ Product model  \n6. peripherals \nPeripherals may include: \n6.1 \nJigs \n6.2 \nFixtures \n6.3 \nBoards\n\n--- PDF PAGE 34 ---\nTESDA-SOP-QSO-01-F08 \nTR-Electronic Back-End Operations NC II (NEW)        Promulgated Dec. 16, 2015 \n30\n \nVARIABLE \nRANGE \n7. Appropriate personnel \nAppropriate personnel may in