        "source_text": "--- PDF PAGE 39 ---\nTESDA-SOP-QSO-01-F08 \nTR-Electronic Back-End Operations NC II (NEW)        Promulgated Dec. 16, 2015 \n35\nUNIT OF COMPETENCY:   CHECK QUALITY COMPLIANCE OF BACK-END \nOPERATIONS FOR ELECTRONICS PRODUCTION LINE  \n \nUNIT CODE                     :    ELC313303 \n \nUNIT DESCRIPTOR        :   This unit covers the knowledge, skills and attitudes needed in \nchecking quality compliance of back-end operations for electronics \nproduction line. This includes monitoring back-end \nmachine/equipment operation, completing lot traceability and \nperforming visual machine inspection in electronics production \nline. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in \nthe Range of Variables\nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Monitor \nelectronics \nproduction \nline back-end \noperation \n \n1.1 Output and yield are \nchecked in accordance \nwith production \nrequirements \n1.2 Out of control action plan \n(OCAP) is followed in case \nof any non-conformance or \ndeviation to the process  \n1.3 Electronics production \nline forms are \naccomplished in \naccordance with process \nrequirements\n Yield requirement \n Machine capacity \n Understanding of OCAP \non machine/ equipment \noperation \n Basic Statistical Process \nControl (SPC) \n Completeness and \naccuracy of information \non electronics production \nline form for unusual \nmachine operation \n Reading skills \n Communication \nskills \n Monitoring skills \n Detecting \nabnormality or \nnon-conformance \n Writing skills \n \n2. Perform visual \ninspection \n \n2.1 Finished products are \nchecked/ inspected using \nappropriate \ninstruments/tools. \n2.2 Physical defects are \nidentified based on product \nspecifications \n2.3 Conforming and non-\nconforming products are \nidentified and segregated \nin accordance with \nproduction line procedures \n2.4 Housekeeping procedures \nare observed in \naccordance with 5S \ndiscipline and established \nprocedures \n Finished products \njudgment criteria on \nelectronics production \nline back-end processes \n Uses of appropriate \ninstruments/tools \n Procedures on \nidentification and \nsegregation of non-\nconforming products in \nelectronics production \nline back-end operations  \n 5S principles \n Reading skills \n Communication \nskills \n Computer skills \n Observation Skills \n Detecting \nabnormality or \nnon-conformance \n Writing skills \n \n3. Complete \nelectronics \nproduction \nline back-end \nlot traceability \n \n3.1 Lot traceability are \ntransacted in accordance \nwith production procedures \n3.2 Conforming and non-\nconforming products are \nidentified and segregated \nin accordance with \nproduction line procedures \n3.3 Disposition of lots is \ndetermined in accordance \nwith product criteria \n Lot traceability   \n Types of electronics \nproduction line back-end \nproduct defects \n Process controls on lots \ntransaction \n Communication \nskills \n Computer skills \n Observation Skills \n Detecting \nabnormality or \nnon-conformance \n Writing skills\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08 \nTR-Electronic Back-End Operations NC II (NEW)        Promulgated Dec. 16, 2015 \n36\nRANGE OF VARIABLES \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n             \nVARIABLE \nRANGE \n1. Production line forms \nProduction forms may include: \n1.1 Lot summary \n1.2 SPC checklist \n1.3 Monitoring checklist \n2. Lot traceability \ntransaction \nTransaction may include: \n2.1 Manual \n2.2 Automated \n3. Disposition of lots \nDisposition of lots may include: \n3.1 Pass  \n3.2 Failed \n3.3 Hold \n3.4 Scrap \n3.5 Re-screen/ Re-work/Re-test \n4. Appropriate \ninstruments/tools \nAppropriate instruments/tools may include: \n4.1 Stereoscopic microscope  \n4.2 magnifying lens  \n4.3 profile projector/ comparator \n5. Physical defects \nPhysical defects may include: \n5.1 lead defects  \n5.2 marking defects  \n5.3 mold defects\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08 \nTR-Electronic Back-End Operations NC II (NEW)        Promulgated Dec. 16, 2015 \n37\n \n     EVIDENCE GUIDE \n       \n1.  Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 \nMonitored electronics production line back-end machine/ \nequipment operation based on product requirements \n1.2 \nPerformed visual inspection in accordance to electronics \nproduction line standards \n1.3 \nCompleted electronics production line back-end lot \ntransaction in accordance with production procedures \n \n \n2.  Resource \nImplications \nThe following resources MUST be provided: \n2.1 \nAppropriate electronics back-end machine and equipment \n2.2 \nTools (as indicated in the Range Of Variables) \n2.3 \nAppropriate production units and materials  \n2.4 \nWork instructions assessment rating sheet \n2.5 \nSample production checklist \n2.6 \nApplicable forms for specific equipment or machines \n2.7 \nProcedure and quality manuals \n2.8 \nPersonal computer \n2.9 \nPrinter \n2.10 Reporting forms \n3.  Methods of \nAssessment \nCompetency may be assessed through: \n3.1 \nDemonstration with oral questioning \n3.2 \nDirect Observation with oral questioning \n3.3 \nWritten examination \n \n4.  Context for \nAssessment \nCompetency may be assessed in the work place or in a simulated \nwork place setting\n",
