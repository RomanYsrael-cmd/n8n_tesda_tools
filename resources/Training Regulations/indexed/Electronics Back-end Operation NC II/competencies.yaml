nce with \nproduction line procedures \n3.3 Disposition of lots is \ndetermined in accordance \nwith product criteria \n Lot traceability   \n Types of electronics \nproduction line back-end \nproduct defects \n Process controls on lots \ntransaction \n Communication \nskills \n Computer skills \n Observation Skills \n Detecting \nabnormality or \nnon-conformance \n Writing skills\n\n--- PDF PAGE 40 ---\nTESDA-SOP-QSO-01-F08 \nTR-Electronic Back-End Operations NC II (NEW)        Promulgated Dec. 16, 2015 \n36\nRANGE OF VARIABLES \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n             \nVARIABLE \nRANGE \n1. Production line forms \nProduction forms may include: \n1.1 Lot summary \n1.2 SPC checklist \n1.3 Monitoring checklist \n2. Lot traceability \ntransaction \nTransaction may include: \n2.1 Manual \n2.2 Automated \n3. Disposition of lots \nDisposition of lots may include: \n3.1 Pass  \n3.2 Failed \n3.3 Hold \n3.4 Scrap \n3.5 Re-screen/ Re-work/Re-test \n4. Appropriate \ninstruments/tools \nAppropriate instruments/tools may include: \n4.1 Stereoscopic microscope  \n4.2 magnifying lens  \n4.3 profile projector/ comparator \n5. Physical defects \nPhysical defects may include: \n5.1 lead defects  \n5.2 marking defects  \n5.3 mold defects\n\n--- PDF PAGE 41 ---\nTESDA-SOP-QSO-01-F08 \nTR-Electronic Back-End Operations NC II (NEW)        Promulgated Dec. 16, 2015 \n37"
