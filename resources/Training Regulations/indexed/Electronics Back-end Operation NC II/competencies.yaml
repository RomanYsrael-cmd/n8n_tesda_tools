ired time \n3.4 Work turnover procedure is \nperformed for next work \nshift \n \n \n Completeness and accuracy \nof information on production \nline checklist \n Work values and ethics \no Attentiveness  \no Time consciousness \no Cost-consciousness \no Quality-consciousness \n \n \n Filling up \nappropriate \ninformation on \nchecklist/ lot \ntravelers \n \n4. Perform daily \nmaintenance \nactivity \n \n \n4.1 Electronics back-end \nmachine basic physical \ncondition are checked \naccording to specifications \n4.2 If necessary, daily \nmaintenance activity is \nperformed based on \nrequired time \n \n4.3 Any non-conformance to \nspecifications are reported \nto appropriate personnel \n4.4 Housekeeping procedures \nare observed in accordance \nwith 5S discipline and \nestablished procedures \n Workplace organization \n(layout/arrangement of \nworkplace) \n Understanding the \napplicable daily PM \nchecklist \n Electronics back-end \nmachine basic physical \nconditions  \n Time consciousness \n Awareness of applicable out \nof control action plan \n(OCAP)  \n 5S principles \n Checking of \nmachine basic \nphysical \nconditions  \n Detecting \nabnormality or \nnon-\nconformance \n Writing skills \n Skills in \nhousekeeping\n\n--- PDF PAGE 33 ---\nTESDA-SOP-QSO-01-F08 \nTR-Electronic Back-End Operations NC II (NEW)        Promulgated Dec. 16, 2015 \n29\nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Production \nspecifications \nMay include: \n1.1 \nMachine specifications \n1.2 \nSet-up checklist \n1.3 \nWork Instructions (WI)/Job order \n1.4 \nProduction procedures \n1.5 \nOut of Control Action Plan (OCAP) procedures \n1.6 \nControl Plan procedures \n1.7 \nStatistical Process Control (SPC) procedures \n1.8 \nWork Manuals \n1.9 \nProduction Process and Flow Diagrams \n2. Tools \nTools may include: \n2.1 \nTweezers  \n2.2 \nVacuum Pen \n2.3 \nMetric Allen Keys \n2.4 \n12 Digit Calculator \n2.5 \nTorque driver \n3. Processes \nElectronics back-end processes 