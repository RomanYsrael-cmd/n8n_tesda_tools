d equipment \n2.2 Tools (as indicated in the Range Of Variables) \n2.3 Materials  \n2.4 Work Instructions assessment rating sheet \n2.5 Sample production checklist \n2.6 Applicable forms for specific equipment or machines \n2.7 Procedure and quality manuals \n2.8 Personal computer \n2.9 Printer \n2.10 Reporting forms\n3.  Methods of \nAssessment \nCompetency may be assessed through: \n3.1 Demonstration with oral questioning \n3.2 Direct observation with oral questioning \n3.3 Examinations and tests \n \n4.  Context for \nAssessment \nCompetency may be assessed in the work place or in a simulated \nwork place setting\n",
