        "source_text": "CON712317\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills, and attitude\nfor preparing stake-out materials and fixing stake-\nout building lines.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the Range of Variables\n1.\nPrepare materials\nfor stake-out\nbuilding lines\n1.1 Appropriate PPE is selected and used according to\njob requirements and OSHC standards.\n1.2 Related plans and details are correctly interpreted\naccording to job requirements.\n1.3 Materials, hand tools and equipment is prepared\nconsistent with job requirements.\n1.4 Materials are properly staged and freed from defects.\n1.5 Unexpected situations are responded to in line with\ncompany rules and regulations.\n1.6 Housekeeping is performed according to safety\nregulations.\n\n2.\nSet batterboards\n2.1 Batterboards are set away from the building line\nexcavation.\n2.2 Batterboards are properly secured with tolerances for\ndimensions at  5 mm, and levelness of  3 mm.\n2.3 Unexpected situations are responded to in line with\ncompany rules and regulations.\n2.4 Housekeeping is performed according to safety\nregulations.\n\n3.\nFix stake-out\nbuilding lines\n3.1 Stake-out building lines are properly secured for\nreference in excavating building foundation.\n3.2 Marking lines are squared and plumbed from the\nbatterboard lines with tolerance of  3 mm on all\nmeasurement, plumbness, squareness and rigid.\n3.3 Worksite is cleaned and kept in safe state according\nto OSHC regulations.\n3.4 Daily work report is accomplished in accordance with\ncompany rules and regulations.\n\n--- PDF PAGE 32 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 30\n\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1.\nPPE\nMay include but are not limited to:\n1.1 Hard hat\n1.2 Safety shoes\n1.3 Gloves\n1.4 Working clothes\n\n2.\nPlans and details\n2.1 Exact location\n2.2 Dimensions\n2.3 Symbols and abbreviations\n2.4 Elevations\n2.5 Quality and quantity of materials\n\n3.\nMaterials, hand tools and\nequipment\nMay include but are not limited to:\n3.1 Lumber\n3.2 Nails\n3.3 G.I. Wires\n\n3.4 Saw\n3.5 Claw/Hammer\n3.6 Chalk line\n3.7 Pencil\n3.8 Fishing line/nylon cord\n3.9 Plumb bob\n3.10 3-4-5 square/plywood/transit\n3.11 Sledge hammer\n3.12 Pull-push tape/zigzag rule\n3.13\nCrew bar\n3.14\nPickmatch/pickmatok\n3.15\nBolo\n3.16\nFraming square\n3.17\nTry-square\n3.18\nLevel hose\n\n4. Unexpected situations\nMay include but not limited to:\n4.1 Injury to personnel\n4.2 Damage to materials\n\n--- PDF PAGE 33 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 31\n\n EVIDENCE GUIDE\n1.\nCritical\naspects of\ncompetency\nCompetency assessment requires evidence that the\ncandidate:\n1.1\nInterpreted related plans and details according to job\nrequirements.\n1.2\nSelected and prepared materials, hand tools and\nequipment, and PPE according to specifications and job\nrequirements.\n1.3\nSet and aligned dimension of work accurately\naccording to job requirements.\n1.4\nApplied organizational quality procedures and\nprocesses in staking-out building lines\n1.5\nComplied with safety regulations for worksite\noperation.\n1.6\nIdentified faults and problems and reported to\nimmediate supervisor/foreman for necessary action.\n\n2.\nUnderpinning\nKnowledge\n2.1\nTypes and uses of PPE\n2.2\nMensuration\n2.3\nRelated plans and details interpretation\n2.4\nMaterials, hand tools and equipment uses and\nspecifications\n2.5\n5-S\n2.6\nKnowledge of building layouts\n2.7\nCompany rules and regulations\n\n3.\nUnderpinning\nSkills\n3.1 Using PPE\n3.2 Interpreting related plans and details\n3.3 Preparing stake materials\n3.4 Cutting/setting batter boards\n3.5 Aligning stake-out of building lines and excavation\n3.6 Metering tape reading\n3.7 Communicating effectively\n3.8 Following company rules and regulations\n\n4.\nResource\nimplications\nThe following resources must be provided:\n4.1 Work place location\n4.2 Plans and details relevant to the task\n4.3 Hand tools and equipment appropriate for preparing\n building lines\n4.4 Materials relevant to the proposed activity\n4.5 Appropriate PPE\n\n--- PDF PAGE 34 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 32\n5.\nMethods of\nAssessment\nCompetency must be assessed through:\n5.1 Direct observation/practical demonstration of application\nto tasks\n5.2 Questioning related to underpinning knowledge\n\n6.\nContext for\nAssessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting\n6.2 Assessment shall be done while tasks are undertaken\nindividually under limited supervision\n\n--- PDF PAGE 35 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 33\nUNIT OF COMPETENCY:\nFABRICATE FORMWORKS\nUNIT CODE"
