          "source_text": "1. \nPrepare materials \nfor stake-out \nbuilding lines \n1.1 Appropriate PPE is selected and used according to \njob requirements and OSHC standards. \n1.2 Related plans and details are correctly interpreted \naccording to job requirements. \n1.3 Materials, hand tools and equipment is prepared \nconsistent with job requirements. \n1.4 Materials are properly staged and freed from defects. \n1.5 Unexpected situations are responded to in line with \ncompany rules and regulations. \n1.6 Housekeeping is performed according to safety \nregulations. \n \n2. \nSet batterboards \n2.1 Batterboards are set away from the building line \nexcavation. \n2.2 Batterboards are properly secured with tolerances for \ndimensions at   5 mm, and levelness of   3 mm. \n2.3 Unexpected situations are responded to in line with \ncompany rules and regulations. \n2.4 Housekeeping is performed according to safety \nregulations. \n \n3. \nFix stake-out \nbuilding lines \n3.1 Stake-out building lines are properly secured for \nreference in excavating building foundation. \n3.2 Marking lines are squared and plumbed from the \nbatterboard lines with tolerance of  3 mm on all \nmeasurement, plumbness, squareness and rigid. \n3.3 Worksite is cleaned and kept in safe state according \nto OSHC regulations. \n3.4 Daily work report is accomplished in accordance with \ncompany rules and regulations.\n\n--- PDF PAGE 32 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          30 \n \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. \nPPE \nMay include but are not limited to: \n1.1 Hard hat \n1.2 Safety shoes \n1.3 Gloves \n1.4 Working clothes \n \n2. \nPlans and details \n2.1 Exact location \n2.2 Dimensions \n2.3 Symbols and abbreviations \n2.4 Elevations \n2.5 Quality and quantity of materials \n \n3. \nMaterials, hand tools and \nequipment \nMay include but are not limited to: \n3.1  Lumber \n3.2  Nails \n3.3  G.I. Wires \n \n3.4  Saw \n3.5  Claw/Hammer \n3.6  Chalk line \n3.7  Pencil \n3.8  Fishing line/nylon cord  \n3.9  Plumb bob \n3.10 3-4-5 square/plywood/transit \n3.11 Sledge hammer \n3.12 Pull-push tape/zigzag rule \n3.13 \nCrew bar \n3.14 \nPickmatch/pickmatok \n3.15 \nBolo \n3.16 \nFraming square \n3.17 \nTry-square  \n3.18 \nLevel hose \n \n4. Unexpected situations \nMay include but not limited to: \n4.1 Injury to personnel \n4.2 Damage to materials\n\n--- PDF PAGE 33 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          31"
