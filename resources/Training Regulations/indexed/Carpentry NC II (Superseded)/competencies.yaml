        "source_title": "FABRICATE FORMWORKS",
        "source_text": "--- PDF PAGE 35 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          33 \nUNIT OF COMPETENCY: \nFABRICATE FORMWORKS \nUNIT CODE \nCON712318 \nUNIT DESCRIPTOR        : \nThis unit covers the knowledge, skills and attitudes \nin fabricating formworks. It includes preparing \nmaterials, lay-outing, fabricating and assembling \nformworks. \n \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables \n1. Prepare materials for \nfabricating formworks \n1.1 Appropriate PPE is selected and used \naccording to job requirements and OSHC \nspecifications. \n1.2 Related plans and details are interpreted \naccording to job requirements. \n1.3 Materials, hand and power tools and \nequipment are selected and prepared \nconsistent with job requirements. \n1.4 Materials are re-checked and properly staged \naccording to job requirements otherwise \ndefective materials or not in specifications are \nreported to immediate superior. \n1.5 Unexpected situations are responded to in \nline with company rules and regulations. \n1.6 Housekeeping is performed according to \nsafety regulations. \n \n2. Lay-out dimension of \nform sheating and \nstiffeners \n2.1 Form sheating and stiffeners are measured \nand marked according to job specifications. \n2.2 Form sheating and stiffeners are laid out and \ncut with tolerances of 3 mm for all \nmeasurements and squareness. \n2.3 Form sheating and stiffeners for column, \nbeam, wall, slab and stairs are consistent with \nstandard spacing for studs or nailer with \ntolerance of + 10 mm. O.C. \n2.4 Unexpected situations are responded to in line \n        with company rules and regulations. \n2.5 Housekeeping is performed according to \nsafety regulations.\n\n--- PDF PAGE 36 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          34 \n \n3. Assemble form panels \n3.1 Materials and/or fabricated form sheating and \nstiffeners are correctly positioned for \nassembly. \n3.2 Assembled form panels are checked for \nsquareness, levelness and alignment to \nspecified tolerance \n3.3 Temporary fixing and/or permanent assembly \ntechniques are applied to hold form panels \ntogether as per job requirements. \n3.4 Assembled form panels are checked for \ncompliance with job requirements. \n3.5 Unexpected situations are responded to in line \nwith company rules and regulations. \n3.6 Clean up worksite according to safety \nregulations and OSHC specifications. \n3.7 Daily work report is accomplished in \naccordance with company rules and \nregulations.\n\n--- PDF PAGE 37 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          35 \n \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. \nPersonal protective \nequipment (PPE) \nMay include but are not limited to:  \n1.1  Goggles \n1.2  Dust mask \n1.3  Gloves \n1.4  Safety shoes \n1.5  Working clothes \n1.6  Hard hats \n \n2. \nPlans and details \n2.1  Exact location \n2.2  Dimensions \n2.3  Symbols and abbreviations \n2.4  Elevations \n2.5  Sections and details \n2.6  Quality and quantity of materials \n \n3. \nMaterials \nMay include but not limited to: \n3.1 Plywood \n3.2 Lumber \n3.3 Nails \n3.4 Tie-rods \n3.5 Tubular scaffolds \n3.6 H-frame scaffold  \n3.7 Formwork braces\n\n--- PDF PAGE 38 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          36 \n4. \nPower and hand tools and \nequipment  \nMay include but are not limited to:  \n4.1  Power tool/equipment  \n4.1.1 \nCircular saw \n4.1.2 \nElectric drill \n4.1.3 \nTable saw \n4.1.4 \nHole saw \n4.1.5 \nJig saw \n \n4.2  Hand tools \n         4.2.1  Hammer \n         4.2.2  Chalk lines \n         4.2.3  Pencil \n         4.2.4  Push-pull/zigzag rule \n         4.2.5  Chisel \n         4.2.6  Steel square \n         4.2.7  Hand saw \n         4.2.8  Plumb bob \n         4.2.9  Level hose \n         4.2.10  Spirit level \n         4.2.11  Adjustable wrench  \n         4.2.12  Try square \n         4.2.13  Marking gauge \n         4.2.14  Crew bar \n \n5. \nUnexpected situations  \n \nMay include but not limited to: \n5.1  Injury to personnel \n5.2  Damage to materials \n \n6. \nFormworks \nMay include but not limited to: \n6.1  Plate \n6.2  Pipe \n6.3  Section \n6.4  Sheet \n6.5  By panel \n6.6  Steel form\n\n--- PDF PAGE 39 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          37 \n \nEVIDENCE GUIDE \n1. Critical aspects  \nof competency \nCompetency assessment requires evidence that the \ncandidate: \n1.1 Interpreted related plans and details \n1.2 Selected and prepared materials, power and hand \ntools, equipment and PPE consistent with job \nrequirements \n1.3 Used safe and effective power and hand tools. \n1.4 Laid out and cut form sheating and stiffeners according \nto specified tolerances \n1.5 Assembled form panels are checked for compliance \nwith the job requirements and specified tolerances \n1.6 Applied organizational quality procedures and \nprocesses \n1.7 Completed work without damage to materials or injury \nto personnel.  \n \n2. Underpinning \nknowledge \n2.1 Types and uses of PPE \n2.2 Mensuration \n2.3 Related plans and details interpretation \n2.4 Materials, power and hand tools and equipment uses \nand specifications \n2.5 \n5-S  \n2.6 Knowledge of formworks fabrication procedures \n2.7 Economic use of material \n2.8 Safe and effective use of power and hand tools \n2.9 Company rules and regulations \n \n3. Underpinning \nskills \n3.1 Using PPE \n3.2 Applying mensuration \n3.3 Interpreting related plans and details \n3.4 Following fabrication procedures \n3.5 Following safe and effective use of power and hand \ntools \n3.6 Following 5-S \n3.7 Using materials economically \n3.8 \nCommunicating effectively \n3.9 \nFollowing company rules and regulations\n\n--- PDF PAGE 40 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          38 \n4. Resource \nimplications \nThe following resources must be provided: \n4.1   Work place location \n4.2 Materials, power and hand tools and equipment \nappropriate for formworks fabrication \n4.3   Plans and details and specifications relevant to the task \n4.4   Appropriate PPE \n \n5. Methods of \nassessment \nCompetency must be assessed through: \n5.1  Direct observation of application to tasks  \n5.2  Questions related to underpinning knowledge \n5.3  Demonstration \n \n6. Context for \nassessment \n6.1  Competency may be assessed in the work place or in a  \n       simulated work place setting \n6.2  Assessment shall be done while tasks are undertaken  \n       individually under limited supervision\n",
