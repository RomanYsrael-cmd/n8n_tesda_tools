        "source_text": "CON712321\nUNIT DESCRIPTOR :\nThis unit covers the knowledge, skills and attitudes\nin installing framing works. It includes preparing\nmaterials,\nlay-outing/erecting\nand\nassembling\nsupports.\n\nELEMENT\nPERFORMANCE CRITERIA\nItalicized terms are elaborated in the\n Range of Variables\n1. Prepare materials for\nframing works\n1.1 Appropriate PPE is selected and used\naccording to job requirements OSHC\nspecifications.\n1.2 Related plans and details are correctly\ninterpreted according to job requirements.\n1.3 Materials, power and hand tools and\nequipment are selected and prepared\nconsistent with job requirements.\n1.4 Materials are re-checked and properly staged\naccording to job requirements.\n1.5 Defective materials are reported to\nimmediate supervisor following standard\noperating procedures.\n1.6 Unexpected situations are dealt with\naccording to company rules and regulations.\n1.7 Housekeeping is performed according to\nsafety regulations.\n\n2. Lay-out/erect and\nassemble post, girts and\nsupports\n2.1 Appropriate PPE is used according to job\nrequirements and OSHC specifications.\n2.2 Posts and girts are laid-out according to\nworking drawings and specifications with\ntolerance of  3mm on all measurements,\nplumbness and levelness.\n2.3 Post, girts and support are erected/assembled\nbased on plans and specifications.\n2.4 Unexpected situations are dealt with\naccording to company rules and regulations.\n2.5 Housekeeping is performed according to\nsafety regulations.\n\n--- PDF PAGE 53 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 51\n\n3. Lay-out/install floor joists\n3.1 Appropriate PPE is used according to job\nrequirements and safety regulations.\n3.2 Floor joists are set out, cut and fixed, and\nlaterally supported in accordance with working\ndrawings and specifications.\n3.3 Floor joists are trimmed for floor openings and\nfixed with fastenings according to working\ndrawings and specifications.\n3.4 Floor joists are laid-out/installed with tolerance\nof  3mm on all measurements and levelness.\n3.5 Unexpected situations are dealt with according\nto company rules and regulations.\n3.6 Housekeeping is performed according to safety\nregulations.\n\n4. Lay-out/install wall studs\n\n4.1 Appropriate PPE is used according to job\nrequirements and safety regulations.\n4.2 Wall studs are identified and installed based on\nworking drawings and specifications with\ntolerance of  3mm on all measurements,\nplumbness, levelness and squareness.\n4.3 Unexpected situations are dealt with according\nto company rules and regulations.\n4.4 Housekeeping is performed according to safety\nregulations.\n\n5. Lay-out/fabricate/install\nroof frames\n5.1 Appropriate PPE is used according to job\nrequirements and safety regulations.\n5.2 Types of roofs and other components are\nfabricated, laid out and installed according to\nworking drawings and specifications with\ntolerance of  3mm maximum on all\ndimensions, plumbness, levelness and\nsquareness.\n5.3 Roof components are installed according to\nworking drawings and specifications.\n5.4 Unexpected situations are dealt with according\nto company rules and regulations.\n5.5 Housekeeping is performed according to safety\nregulations.\n\n--- PDF PAGE 54 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 52\n\n6. Lay-out/install ceiling\njoists/frames\n6.1 Appropriate PPE is used according to job\nrequirements and safety regulations\n6.2 Ceiling joists/frames are laid out/installed\naccording to working drawings and\nspecifications with  3 mm tolerance on all\ndimensions, levelness and squareness.\n6.3 Unexpected situations are dealt with according\nto company rules and regulations.\n6.4 Daily report is accomplished according to\ncompany rules and regulations.\n6.5 Housekeeping is performed according to safety\nregulations.\n\n--- PDF PAGE 55 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 53\nRANGE OF VARIABLES\nVARIABLE\nRANGE\n1.\nPPE\nMay include but not limited to:\n1.1 Gloves\n1.2 Safety shoes\n1.3 Safety hat\n1.4 Safety belt\n1.5 Dust mashesk\n1.6 Working clot\n\n2.\nPlans and details\n2.1 Exact location\n2.2 Dimensions\n2.3 Symbols and abbreviations\n2.4 Elevations\n2.5 Sections and details\n2.6 Quality and quantity of materials\n\n3.\nMaterials\n3.1 Lumber\n3.2 Nails\n3.3 Bolts and nuts\n3.4 Hanger ceiling (expansion bolts)\n3.5 Metal bracket\n\n4.\nPower and hand tools and\nequipment\nMay include but not limited to:\n4.1 Saw\n4.2 Hammer\n4.3 Chalk line\n4.4 Pencil\n4.5 Plumb bob\n4.6 Level hose\n4.7 Push-pull/ zigzag rule\n4.8 Fishing line\n4.9 Spirit level\n4.10 Crow bar\n4.11 Chisel\n4.12 Try square\n4.13 Framing square\n\n--- PDF PAGE 56 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 54\n\nVARIABLE\nRANGE\n5.\nDefective materials\n5.1 Natural\n5.2 Manufacturer\n\n6.\nUnexpected situations\nMay include but not limited to:\n6.1 Damage to materials, tools or equipment\n6.2 Injury to personnel\n\n7.\nTypes of roofs\nMay include but not limited to:\n7.1 Flat roof\n7.2 Shed or lean-to\n7.3 Gable roof\n7.4 Hip roof\n7.5 Gable roof and dormer\n7.6 Gable and valley roof\n7.7 Hip and valley roof\n\n8.\nOther components\nMay include but not limited to:\n8.1 Trusses\n8.2 Brace\n8.3 Cleat\n8.4 Rafter\n8.5 Purlins\n8.6 Fascia board\n\n--- PDF PAGE 57 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 55\n\n EVIDENCE GUIDE\n1. Critical aspects\nof competency\nCompetency assessment requires evidence that the\ncandidate:\n1.1 Interpreted related plans and details according to job\nrequirements.\n1.2 Selected and prepared materials, hand and power tools,\nequipment and PPE are consistent with job\nrequirements\n1.3 Performed installing framing works procedures\n1.4 Complied safety regulations for worksite operations.\n1.5 Followed safe and effective operational use of tools and\nequipment.\n1.6 Completed work operations without injury to personnel\nand damage to materials.\n1.7 Communicated interactively with others to ensure safe\nand effective workplace operations.\n\n2. Underpinning\nknowledge\n2.1 Types and uses of PPE\n2.2 Mensuration\n2.3 Working drawings and specifications interpretation\n2.4 Materials, power and hand tools, equipment use and\nspecification\n2.5 5-S\n2.6 Principles of framing\n2.5 Procedures for installing framing works\n2.6 Safe and effective use of power and hand tools\n2.7 Economic use of material\n2.8 Staging and storing procedure of materials\n2.9 Company rules and regulations\n\n3. Underpinning\nskills\n3.1 Using PPE\n3.2 Applying mensuration\n3.3 Interpreting working drawings and specifications\n3.4 Using materials economically\n3.5 Following 5S\n3.6 Following procedures for installing framing works\n3.7 Following safe and effective use of power and hand\ntools\n3.8 Following staging and storing procedure\n3.9 Following company rules and regulations\n\n--- PDF PAGE 58 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 56\n4. Resource\nimplications\nThe following resources must be provided:\n4.1 Work place location\n4.2 Power and hand tools and equipment appropriate to\ninstallation of frames\n4.3 Materials relevant to the proposed activity\n4.4 Drawings and specifications relevant to the task\n4.5 Appropriate PPE\n\n5. Methods of\nassessment\nCompetency must be assessed through:\n5.1 Direct observation of application to tasks\n5.2 Questions related to underpinning knowledge\n\n6. Context for\nassessment\n6.1 Competency may be assessed in the work place or in a\nsimulated work place setting.\n\n--- PDF PAGE 59 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 57"
