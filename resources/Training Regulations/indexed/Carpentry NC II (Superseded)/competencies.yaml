        "source_text": "--- PDF PAGE 47 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          45 \nUNIT OF COMPETENCY: \nSTRIP FORMWORKS COMPONENTS \nUNIT CODE \nCON712320 \nUNIT DESCRIPTOR        : \nThis unit covers the knowledge, skills and attitudes \nin \nstripping \nformworks \ncomponents \nand \naccessories for concrete work.  It includes \npreparing \ntools, \nequipment \nand \nstaging \nof \nmaterials and shoring and re-shoring operations. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables \n1. \nPrepare staging area, \ntools and equipment \n1.1 Work instruction is secured from immediate \nsuperior according to company rules and \nregulations. \n1.2 Appropriate PPE is selected and used \naccording to job requirements and OSHC \nspecifications.  \n1.3 Formwork components and accessories \nstaging area is identified and prepared based \non job requirements. \n1.4 Formwork components power, hand tools \nand equipment are selected and prepared \nconsistent with job requirements. \n1.5 Unexpected situations are responded to in \nline with company rules and regulations. \n1.6 Housekeeping is performed according to \nsafety regulations. \n \n2. \nStrip formworks of \nbuilding components \n2.1 Formwork components and accessories are \nremoved carefully, safely and sequentially. \n2.2 Formwork components and accessories are \nsorted, arranged and properly staged \naccording to company rules and \nregulations/manufacturer's recommendations.  \n2.3 Formwork components and accessories are \ncleaned, oiled and stored according to \ncompany rules and regulations/manufacturer's \nrecommendations. \n2.4 Formwork components and accessories, which \nare beyond repair, are discarded otherwise \nrepaired in accordance with company rules \nand regulations. \n2.5 Unexpected situations are responded to in line \nwith company rules and regulations. \n2.6 Housekeeping is performed according to safety \nregulations.\n\n--- PDF PAGE 48 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          46 \n3. \nShore or/and re-shore \nand removal \n3.1 Appropriate PPE is selected and used \naccording to job requirements and OHSA \nspecifications. \n3.2 Formworks components are shored and re-\nshored in accordance with stripping \nprocedures. \n3.3 Shores are removed in accordance with \nstandard dismantling procedures. \n3.4 Shores, tools and equipment are cleaned, \nmaintained and stored properly according to \ncompany rules and regulations. \n3.5 Unexpected situations are responded to in line \nwith company rules and regulations. \n3.6 Daily report is accomplished according to \ncompany rules and regulations. \n3.7 Housekeeping is performed according to safety \nregulations.\n\n--- PDF PAGE 49 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          47 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. \nPersonal protective \nequipment (PPE) \nMay include but are not limited to: \n1.1 Gloves \n1.2 Safety shoes \n1.3 Dust mask \n1.4 Safety hat \n1.5 Safety belt \n1.6 Overalls/working clothes \n \n2. \nPower and hand tools and \nequipment  \nMay include but are not limited to: \n2.1 Hammer \n2.2 Tool holster  \n2.3 Spanners \n2.4 Brooms \n2.5 Crow bar \n \n3. \nUnexpected situations \nMay include but not limited to: \n3.1 Damage to formwork components  \n3.2 Injury to personnel \n \n4. \nFormwork components \nand accessories \n4.1 Form panels \n4.1.1 \nBeams \n4.1.2 \nColumns \n4.1.3 \nSlabs \n4.1.4 \nWalls \n4.1.5 \nStairs \n4.2 Scaffolds \n4.2.1 \nFrame  \n4.2.2 \nTubular\n\n--- PDF PAGE 50 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          48 \n      EVIDENCE GUIDE \n1. Critical aspects \nof competency \nCompetency assessment requires evidence that the \ncandidate: \n1.1 Followed work instructions. \n1.2 Selected and prepared power and hand tools, \nequipment and PPE are consistent with job \nrequirements \n1.3 Performed stripping, shoring and removal of shoring \nprocedures  \n1.4 Complied with safety regulations for worksite operations. \n1.5 Followed safe and effective operational use of power \nand hand tools and equipment. \n1.6 Communicated interactively with others to ensure safe \nand effective workplace operations. \n1.7 Completed work without injury to personnel or damage \nto materials. \n \n2. Underpinning  \nknowledge   \n2.1 Types and uses of PPE \n2.2 Formwork components power and hand tools and \nequipment use and specification \n2.3 Interpretation of instruction,  \n2.4 Safety rules and regulations  \n2.5 5-S  \n2.6 Safe and effective use of power and hand tools  \n2.7 Proper storing and maintenance of formwork \ncomponents  \n2.8 Knowledge of stripping, shoring and removal of shoring  \nprocedures \n2.9 Company rules and regulations \n \n3. Underpinning \nskills \n3.1 Using PPE \n3.2 Interpreting instructions \n3.3 Following safety rules and regulations  \n3.4 Preparing formwork components  \n3.5 Following stripping, shoring and removal of shoring  \nprocedures  \n3.6 Following 5-S \n3.7 Following safe and effective use of power and hand \ntools \n3.8 Following proper storing and maintenance of formwork \ncomponents and accessories  \n3.9 Communicating effectively \n3.10 Following company rules and regulations\n\n--- PDF PAGE 51 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          49 \n4. Resource \nimplications \nThe following resources must be provided: \n4.1 \nWork place location \n4.2 Hand and power tools and equipment appropriate for \nstripping of formwork components \n4.3 Appropriate PPE \n \n5. Methods of \nassessment \nCompetency must be assessed through: \n5.1 Direct observation of application to tasks  \n5.2 Questions related to underpinning knowledge \n5.3 Demonstration \n \n6. Context for \nassessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting \n6.2 Assessment shall be done while tasks are undertaken \nindividually under limited supervision\n",
        "required_knowledge": null,
        "required_skills": null
      },
