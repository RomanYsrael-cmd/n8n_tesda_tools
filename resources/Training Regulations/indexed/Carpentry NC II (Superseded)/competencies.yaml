        "source_title": "INSTALL FORMWORKS COMPONENTS",
        "source_text": "--- PDF PAGE 41 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          39 \n \nUNIT OF COMPETENCY: \nINSTALL FORMWORKS COMPONENTS \nUNIT CODE \nCON712319 \nUNIT DESCRIPTOR        : \nThis unit covers the knowledge, skills and attitudes \nin installing/stripping formworks components for \nconcrete work.  It includes preparing materials, lay-\nouting/assembling \nscaffolds \nand \nbraces \nand \nremoving of shoring. \n \nELEMENT \nPERFORMANCE CRITERIA \nItalicized terms are elaborated in the \nRange of Variables \n1. Prepare materials, tools \nand equipment for \ninstalling formworks \n1.1 Appropriate PPE is selected and used \naccording to job requirements and OSHC \nspecifications.  \n1.2 Related plans and details are correctly \ninterpreted according to job requirements. \n1.3 Formworks components/materials, power \nand hand tools and equipment are selected \nand prepared consistent with job requirements. \n1.4 Materials are re-checked and properly staged \naccording to job requirements otherwise \ndamaged materials are reported to immediate \nsuperior. \n1.6 Unexpected situations are responded to in \nline with company rules and regulations. \n1.7 Housekeeping is performed according to safety \nregulations. \n \n2. Lay-out/assemble \nscaffolds and braces \n2.1 Appropriate PPE is selected and used \naccording to job requirements and OSHC \nspecifications. \n2.2 Work area is cleared for safe lay-outing and \nassembling of scaffolds and braces. \n2.3 Scaffolds and braces are laid-out and \nassembled with tolerance of + 3mm for all \nmeasurements and squareness. \n2.4 Connectors, braces, locks and screws are \nproperly secured according to job \nrequirements. \n2.5 Unexpected situations are responded to in line \nwith company rules and regulations. \n2.6 Housekeeping is performed according to safety \nregulations.\n\n--- PDF PAGE 42 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          40 \n \n3. Set/fix form panels of \nbuilding components  \n3.1 Appropriate PPE is selected and used \naccording to job requirements and OHSA \nspecifications. \n3.2 Formworks components are laid-out with \ntolerance of  3 mm for measurement, \nalignment, squareness, levelness, plumbness \nand with form oil.  \n3.3 Form panels are set/fixed for components with \ntolerance to reference structure of  + 3mm  \n3.4 Connectors, braces, locks and screws are \nproperly secured according to job \nrequirements. \n3.5 Unexpected situations are responded to in line \nwith company rules and regulations. \n3.6  Daily report is accomplished according to  \n       company rules and regulations. \n3.7 Housekeeping is performed according to safety \nregulations.\n\n--- PDF PAGE 43 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          41 \nRANGE OF VARIABLES \nVARIABLE \nRANGE \n1. \nPersonal protective \nequipment (PPE) \nMay include but are not limited to: \n1.1 Gloves \n1.2 Safety shoes \n1.3 Dust mask \n1.4 Safety hat \n1.5 Safety belt \n1.6 Overalls/working clothes \n \n2. \nPlans and details \n2.1 Exact location \n2.2 Dimensions \n2.3 Symbols and abbreviations \n2.4 Elevations \n2.5 Sections and details \n2.6 Quality and quantity of materials \n \n3. \nFormwork components \n3.1 Stiffener/frame \n3.2 Steel \n3.3 Composite construction \n3.4 Polyvinyl/plastic \n \n4. \nMaterials \nMay include but are not limited to: \n4.1 Form panels \n4.2 Lumbers \n4.3 Scaffolds \n4.4 Shoring \n4.5 Nails \n4.6 Plywood \n4.7 Steel channel\n\n--- PDF PAGE 44 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          42 \n5. \nPower and hand tools and \nequipment  \nMay include but are not limited to: \n5.1 Saw \n5.2 Hammer \n5.3 Tool holster  \n5.4 Spanners \n5.5 Measuring tool \n5.6 Impact gun \n5.7 Brooms \n5.8 Chalk line \n5.9 Pencil \n5.10 Plumb bob \n5.11 Level hose \n5.12 Fishing line \n5.13 Spirit level \n5.14 Crow bar \n5.15 Try-square \n \n6. \nUnexpected situations \nMay include but not limited to: \n6.1 Damage to materials \n6.2 Injury to personnel\n\n--- PDF PAGE 45 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          43 \n      EVIDENCE GUIDE \n1. Critical aspects \nof competency \nCompetency assessment requires evidence that the \ncandidate: \n1.1 Interpreted related plans and details according to job \nrequirements. \n1.2 Selected and prepared materials, power and hand tools, \nequipment and PPE are consistent with job \nrequirements. \n1.3 Laid-out/assembled scaffolds/braces and form \ncomponents/panels according to job requirements and \nspecified tolerances. \n1.4 Complied with safety regulations for worksite operations \n1.5 Followed safe and effective operational use of power \nand hand tools and equipment \n1.6 Communicated interactively with others to ensure safe \nand effective workplace operations \n1.7 Completed work without injury to personnel or damage \nto equipment. \n \n2. Underpinning  \nknowledge   \n2.1 Types and uses of PPE \n2.2 Mensuration \n2.3 Materials, power and hand tools and equipment uses \nand specifications \n2.4 Interpretation of related plans and details \n2.5 5-S  \n2.6 Safe and effective use of power and hand tools  \n2.7 Economic use of material \n2.8 Knowledge of assembling and fixing procedures \n2.9 Company rules and regulations \n \n3. Underpinning \nskills \n3.1 Using PPE \n3.2 Applying mensuration \n3.3 Interpreting plan and details \n3.4 Preparing materials, power and hand tools and \nequipment \n3.5 Following assembling and fixing procedures  \n3.6 Following 5-S \n3.7 Following safe and effective use of power and hand \ntools \n3.8 Using materials economically \n3.9 Communicating effectively \n3.10 Following company rules and regulations\n\n--- PDF PAGE 46 ---\n__________________________________________________________________________________________ \nTR CARPENTRY  NC II                                                                                                                                                          44 \n4. Resource \nimplications \nThe following resources must be provided: \n4.1 Work place location \n4.2 Hand and power tools and equipment appropriate for \ninstallation of formwork components \n4.3 Materials relevant to the proposed activity \n4.4 Plans and details relevant to the task \n4.5 Appropriate PPE \n \n5. Methods of \nassessment \nCompetency must be assessed through: \n5.1 Direct observation of application to tasks  \n5.2 Questions related to underpinning knowledge \n5.3 Demonstration \n \n6. Context for \nassessment \n6.1 Competency may be assessed in the work place or in a \nsimulated work place setting. \n6.2 Assessment shall be done while tasks are undertaken \nindividually under limited supervision.\n",
