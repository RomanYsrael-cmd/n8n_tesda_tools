    "source_text": "3.1\nCURRICULUM DESIGN\n\nCourse Title: CARPENTRY\n\nNC Level: NC II\nNominal Training Duration:\n18 Hours (Basic)\n\n24 Hours (Common)\nCourse Description:\nThis course is designed to enhance the knowledge, skills and desirable\nwork attitude in Carpentry NC II. It covers the basic, common and core\ncompetencies.\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a\nteam member.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 60 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 58\n\nCOMMON COMPETENCIES\n\nSECTOR : CONSTRUCTION\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment Approach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n1.2 Requisition\nMaterials\n1.3 Receive and inspect\nmaterials\nAudio Visual\n Simulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect observation\nQuestions or interview\nPortfolio (credentials)\nWritten / Oral Test\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals\nof\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation\nOral questioning\nWritten test or examination\nThird party report\nDemonstration (able to\nimpart knowledge and\nskills)\n3. Perform\nmensurations\nand\ncalculation\n3.1 Select measuring\ninstruments\n3.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation\nOral questioning\nWritten test or examination\nThird party report\nDemonstration (able to\nimpart knowledge and\nskills)\n4. Maintain tools\nand\nequipment\n4.1 Check condition of\ntools and\nequipment\n4.2 Perform basic\npreventive\nmaintenance\n4.3 Sharpen edge and\ntooth cutting tools\n4.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation of\napplication of tasks.\nOral questioning\nWritten test or examination\nThird party report\nDemonstration\n\n--- PDF PAGE 61 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 59\n\nCourse Title: CARPENTRY\n\nNC Level: NC II\n\nNominal Training Duration: 120 Hours\n\nCourse Description:\nThe core competencies covers the competency on stake-out building lines,\nfabricate formworks, install/strip form works, install framing works, install\narchitectural ceiling/wall sheats/panels and floor finishes and fabricate/install\ndoor/window jambs and panels.\n\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare / Stake-\nout building lines.\n1.1 Use appropriate PPE.\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nObservation\nQuestioning\nWritten Test\nDemonstration\n\n1.2 Interpret construction\nplans and details.\n\n1.3 Identify construction\nsymbols\n\n1.4 Prepare construction\ntools, equipment and\nmaterials.\n\n1.5 Mark-out location of\nbatterboard in\naccordance with plans\nand details\n\n1.6 Set-up batterboard\nsecurely.\n\n1.7 Mark and set building\nlines securely\n\n1.8 Observe safety\npractices in staking-out\nbuilding lines.\n\n1.9 Unexpected situations\nare responded\naccordingly\n\n--- PDF PAGE 62 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 60\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Fabricate\nformworks\n2.1\nUse appropriate PPE\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nObservation\nQuestioning\nWritten Test\nDemonstration\n\n2.2\nInterpret construction\nplans and details.\n\n2.3\nIdentify construction\nsymbols\n\n2.4\nPrepare construction\ntools, equipment and\nmaterials.\n\n2.5\nLay-out and cut\nformworks according\nto plans and details.\n\n2.6\nFabricate formworks\nin accordance with\nplans and details.\n\n2.7\nCheck and fix\nfabricated formworks\nfor levelness,\nalignment,\nsquareness and\ncontrol dimension to\nspecified tolerance.\n\n2.8\nObserve safety\npractices in\nfabricating formworks.\n\n2.9\nUnexpected situations\nare responded\naccordingly\n\n--- PDF PAGE 63 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 61\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Install formworks\ncomponents\n3.1\nUse appropriate\nPPE.\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nObservation\nQuestioning\nWritten Test\nDemonstration\n\n3.2\nSelect and prepare\ntools and equipment\nfor installing\nformworks\ncomponents.\n\n3.3\nApply proper\nprocedures in laying-\nout scaffolds. (e.g.\nheight and span\nrequirements)\n\n3.4\nLay-out scaffolds\nand braces\naccording to job\nrequirements.\n\n3.5\nErect shores, braces\nprior to installation of\nform panels.\n\n3.6\nSet, fix