ration\n2. Observe\nprocedures,\nSpecifications\nand Manuals\nof\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation\nOral questioning\nWritten test or examination\nThird party report\nDemonstration (able to\nimpart knowledge and\nskills)\n3. Perform\nmensurations\nand\ncalculation\n3.1 Select measuring\ninstruments\n3.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation\nOral questioning\nWritten test or examination\nThird party report\nDemonstration (able to\nimpart knowledge and\nskills)\n4. Maintain tools\nand\nequipment\n4.1 Check condition of\ntools and\nequipment\n4.2 Perform basic\npreventive\nmaintenance\n4.3 Sharpen edge and\ntooth cutting tools\n4.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation of\napplication of tasks.\nOral questioning\nWritten test or examination\nThird party report\nDemonstration\n\n--- PDF PAGE 61 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 59\n\nCourse Title: CARPENTRY\n\nNC Level: NC II\n\nNominal Training Duration: 120 Hours\n\nCourse Description:\nThe core competencies covers the competency on stake-out building lines,\nfabricate formworks, install/strip form works, install framing works, install\narchitectural ceiling/wall sheats/panels and floor finishes and fabricate/install\ndoor/window jambs and panels.\n\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare / Stake-\nout building lines.\n1.1 Use appropriate PPE.\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nObservation\nQuestioning\nWritten Test\nDemonstration\n\n1.2 Interpret construction\nplans and details.\n\n1.3 Identify construction\nsymbols\n\n1.4 Prepare construction\ntools, equ