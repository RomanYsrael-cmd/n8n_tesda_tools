    "source_text": "SECTION 3 TRAINING STANDARDS\n\nThese standards are set to provide technical and vocational education and\ntraining (TVET) providers with information and other important requirements to\nconsider when designing training programs for Carpentry NC II.\n\n3.1\nCURRICULUM DESIGN\n\nCourse Title: CARPENTRY\n\nNC Level: NC II\nNominal Training Duration:\n18 Hours (Basic)\n\n24 Hours (Common)\nCourse Description:\nThis course is designed to enhance the knowledge, skills and desirable\nwork attitude in Carpentry NC II. It covers the basic, common and core\ncompetencies.\nBASIC COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Participate in\nworkplace\ncommunication\n1.1 Obtain and convey\nworkplace information.\n1.2 Complete relevant work\nrelated documents.\n1.3 Participate in workplace\nmeeting and discussion.\nGroup\ndiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n2. Work in a team\nenvironment\n2.1 Describe and identify\nteam role and\nresponsibility in a team.\n2.2 Describe work as a\nteam member.\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n3. Practice career\nprofessionalism\n3.1 Integrate personal\nobjectives with\norganizational goals.\n3.2 Set and meet work\npriorities.\n3.3 Maintain professional\ngrowth and development\nDiscussion\nInteraction\n\n• Demonstration\n• Observation\n• Interviews/\nquestioning\n4. Practice\noccupational\nhealth and\nsafety\n4.1 Evaluate hazard and\nrisks\n4.2 Control hazards and\nrisks\n4.3 Maintain occupational\nhealth and safety\nawareness\nDiscussion\nPlant tour\nSymposium\n• Observation\n• Interview\n\n--- PDF PAGE 60 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 58\n\nCOMMON COMPETENCIES\n\nSECTOR : CONSTRUCTION\n\nUnit of\nCompetency\nLearning Outcomes\nMethodology\nAssessment Approach\n1. Prepare\nconstruction\nmaterials and\ntools\n1.1 Identify Materials\n1.2 Requisition\nMaterials\n1.3 Receive and inspect\nmaterials\nAudio Visual\n Simulation\nDiscussion\nPractical\nExercise\nDemonstration\nDirect observation\nQuestions or interview\nPortfolio (credentials)\nWritten / Oral Test\nDemonstration\n2. Observe\nprocedures,\nSpecifications\nand Manuals\nof\nInstructions\n2.1 Identify and access\nspecification/\nmanuals\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation\nOral questioning\nWritten test or examination\nThird party report\nDemonstration (able to\nimpart knowledge and\nskills)\n3. Perform\nmensurations\nand\ncalculation\n3.1 Select measuring\ninstruments\n3.2 Carry out\nmeasurements\nand calculations\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation\nOral questioning\nWritten test or examination\nThird party report\nDemonstration (able to\nimpart knowledge and\nskills)\n4. Maintain tools\nand\nequipment\n4.1 Check condition of\ntools and\nequipment\n4.2 Perform basic\npreventive\nmaintenance\n4.3 Sharpen edge and\ntooth cutting tools\n4.4 Store tools and\nequipment\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nDirect observation of\napplication of tasks.\nOral questioning\nWritten test or examination\nThird party report\nDemonstration\n\n--- PDF PAGE 61 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 59\n\nCourse Title: CARPENTRY\n\nNC Level: NC II\n\nNominal Training Duration: 120 Hours\n\nCourse Description:\nThe core competencies covers the competency on stake-out building lines,\nfabricate formworks, install/strip form works, install framing works, install\narchitectural ceiling/wall sheats/panels and floor finishes and fabricate/install\ndoor/window jambs and panels.\n\nCORE COMPETENCIES\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n1. Prepare / Stake-\nout building lines.\n1.1 Use appropriate PPE.\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nObservation\nQuestioning\nWritten Test\nDemonstration\n\n1.2 Interpret construction\nplans and details.\n\n1.3 Identify construction\nsymbols\n\n1.4 Prepare construction\ntools, equipment and\nmaterials.\n\n1.5 Mark-out location of\nbatterboard in\naccordance with plans\nand details\n\n1.6 Set-up batterboard\nsecurely.\n\n1.7 Mark and set building\nlines securely\n\n1.8 Observe safety\npractices in staking-out\nbuilding lines.\n\n1.9 Unexpected situations\nare responded\naccordingly\n\n--- PDF PAGE 62 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 60\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n2. Fabricate\nformworks\n2.1\nUse appropriate PPE\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nObservation\nQuestioning\nWritten Test\nDemonstration\n\n2.2\nInterpret construction\nplans and details.\n\n2.3\nIdentify construction\nsymbols\n\n2.4\nPrepare construction\ntools, equipment and\nmaterials.\n\n2.5\nLay-out and cut\nformworks according\nto plans and details.\n\n2.6\nFabricate formworks\nin accordance with\nplans and details.\n\n2.7\nCheck and fix\nfabricated formworks\nfor levelness,\nalignment,\nsquareness and\ncontrol dimension to\nspecified tolerance.\n\n2.8\nObserve safety\npractices in\nfabricating formworks.\n\n2.9\nUnexpected situations\nare responded\naccordingly\n\n--- PDF PAGE 63 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 61\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n3. Install formworks\ncomponents\n3.1\nUse appropriate\nPPE.\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nObservation\nQuestioning\nWritten Test\nDemonstration\n\n3.2\nSelect and prepare\ntools and equipment\nfor installing\nformworks\ncomponents.\n\n3.3\nApply proper\nprocedures in laying-\nout scaffolds. (e.g.\nheight and span\nrequirements)\n\n3.4\nLay-out scaffolds\nand braces\naccording to job\nrequirements.\n\n3.5\nErect shores, braces\nprior to installation of\nform panels.\n\n3.6\nSet, fix and erect\nform panels of\nbuilding components\naccording job\nrequirements.\n\n3.7\nRemoved waste\nmaterials, used form\npanels and scaffolds\naccording to\nestablished\noperating standards.\n\n3.8\nClean/maintain/store\ntools and\nequipments as\nrequired.\n\n3.9\nUnexpected\nsituations are\nresponded\naccordingly\n\n--- PDF PAGE 64 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 62\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n4. Strip formworks\ncomponents\n4.1\nUse appropriate\nPPE.\nAudio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nObservation\nQuestioning\nWritten Test\nDemonstration\n\n4.2\nSelect and prepare\ntools and equipment\nfor stripling\nformworks\ncomponents.\n\n4.3\nStrip form panels\nfollowing standard\nstripping procedures\nin line with the job\nrequirements.\n\n4.4\nApply proper\nprocedures in\ndismantling\nscaffolds.\n\n4.5\nErect shores, braces\nprior to installation of\nform panels.\n\n4.6\nRemoved waste\nmaterials, used form\npanels and scaffolds\naccording to\nestablished\noperating standards.\n\n4.7\nClean/maintain/store\ntools and\nequipments as\nrequired.\n\n4.8\nUnexpected\nsituations are\nresponded\naccordingly.\n\n--- PDF PAGE 65 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 63\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n5. Installing framing\nworks\n5.1\nUse appropriate PPE. Audio Visual\nSimulation\nDiscussion\nPractical Lab\nDemonstration\nObservation\nQuestioning\nWritten Test\nDemonstration\n\n5.2\nSelect and prepare\ntools, materials and\nequipment for framing\nworks.\n\n5.3\nIdentify standard floor\njoist on-center\nspacing.\n\n5.4\nDemonstrate proper\nprocedures in\ninstalling floor joist.\n\n5.5\nLay-out and mark\nposition of floor joist\non the girders in line\nwith plans and details.\n\n5.6\nLay-out floor joist and\nnail into position\naccording to job\nrequirements.\n\n5.7\nBridge floor joist\nperpendicularly in\naccordance with\nworking drawings and\nspecifications.\n\n5.8\nCut floor joist\naccording to job\nrequirements.\n\n5.9\nIdentify wall\nrequirements\naccording to working\ndrawings and details.\n\n5.10 Lay-out and install\nsole plate and top\nplate according to job\nrequirements.\n\n5.11 Lay-out and install\nwall studs according\nto working drawings\nand specifications.\n\n5.12 Fabricate trusses\naccording to job\nrequirements.\n\n--- PDF PAGE 66 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 64\n\nUnit of Competency\nLearning Outcomes\nMethodology\nAssessment\nApproach\n\n5.13 Lay-out and install\ntrusses according\nplans and\nspecifications.\n\n5.14 Install purlins\naccording to wording\ndrawing and details.\n\n5.15 Lay-out and install\nfascia board\naccording to job\nrequirements.\n\n5.16 Identify ceiling\nrequirements such as\nmanhole, electrical\noutlets, ventilations,\netc. according to job\nrequirements.\n\n5.17 Install ceiling joist\naccording to working\ndrawings and\nspecifications.\n\n5.18 Demonstrate safe and\neffective operational\nuse of tools and\nequipment.\n\n5.19 Unexpected situations\nare responded\naccordingly\n\n--- PDF PAGE 67 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 65\n3.2\nTRAINING DELIVERY\n\nThe delivery of training should adhere to the design of the curriculum.\nDelivery should be guided by the 10 basic principles of competency-based TVET:\n\n• The training is based on curriculum developed from the competency\nstandards;\n• Learning is modular in its structure;\n• Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n• Training is based on work that must be performed;\n• Training materials are directly related to the competency standards and\nthe curriculum modules;\n• Assessment is based in the collection of evidence of the performance of\nwork to the industry required standard;\n• Training is based both on and off-the-job components;\n• Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n• Training allows for multiple entry and exit; and\n• Training programs are registered with the UTPRAS.\nThe competency-based TVET system recognizes various types of delivery\nmodes, both on and off-the-job as long as the learning is driven by the competency\nstandards specified by the industry. The following training modalities may be\nadopted when designing training programs:\n• The dualized mode of training delivery is preferred and recommended.\nThus programs would contain both in-school and in-industry training or\nfieldwork components. Details can be referred to the Dual Training\nSystem (DTS) Implementing Rules and Regulations.\n• Modular/self-paced learning is a competency-based training modality\nwherein the trainee is allowed to progress at his own pace. The trainer\nfacilitates the training delivery\n• Peer teaching/mentoring is a training modality wherein fast learners are\ngiven the opportunity to assist the slow learners.\n• Supervised industry training or on-the-job training is an approach in\ntraining designed to enhance the knowledge and skills of the trainee\nthrough actual experience in the workplace to acquire specific\ncompetencies prescribed in the training regulations.\n• Distance learning is a formal education process in which majority of the\ninstruction occurs when the students and instructor are not in the same\nplace. Distance learning may employ correspondence study, or audio,\nvideo or computer technologies.\n• Project-Based Instruction is an authentic instructional model or strategy\nin which students plan, implement and evaluate projects that have real\nworld applications.\n\n--- PDF PAGE 68 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 66\n\n3.3\nTRAINEE ENTRY REQUIREMENTS\n\nThis section specifies the qualifications of trainees and educational\nexperience. Other requirements like health and physical requirements are also\nstated. Passing entry written examinations may also be indicated if necessary.\n\n• A holder of National Certificate Level I\n• Good Moral Character\n• Ability to communicate\n• Physically fit and mentally healthy\n• Can perform basic mathematical computation and mensuration.\n\n3.4\nLIST OF TOOLS, EQUIPMENT AND MATERIALS FOR CARPENTRY NC II\n\n TOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n25 pcs Cross cut saw\n5 sets\nH-frame scaffolds,\n25 pcs\nLumber, 2”x6”x8’, kiln\ndried, tangile\n25 pcs Claw hammer 8 oz\n2 unit\nPortable electric drill\n25 pcs\nLumber, 2”x6”x12’, kiln\ndried, tangile\n25 pcs Claw hammer 16 oz\n2 unit\nPortable planer\n50 pcs\nLumber, 2”x2”x12’, kiln\ndried, tangile\n25 pcs Chalk line reel\n2 unit\nPortable cirular saw\n25 pcs\nWood moulding,\n1”x4”x8’, ogee\n25 pcs Pencil\n\n25 pcs\nWood moulding,\n1”x1”x8’, quarter round\n25\nsets\nNylon string\n\n25 pcs\nWood moulding,\n1”x1”x8’, cove\n25 pcs Pull-push rule, 15\nmeters\n\n50 pcs\nrough lumber 2”x2”x12’\n5 pcs\nCrow bar\n\n50 pcs\nLoose pin hinges, 4”\n25 pcs Framing square\n\n2 kg\nFinishing wire nail, 1”\n25 pcs Try square\n\n2 kg\nFinishing wire nail, 1½\ninches\n5 pcs\nSpirit level, 36 in.\n\n2 kg\nFinishing wire nail, 2\ninches\n1 pcs\nAutomatic level\n\n2 kg\nFinishing wire nail, 3\ninches\n25 pcs Nail pouch\n\n2 kg\nCommon wire nail, 1”\n25 set\nNail set\n\n2 kg\nCommon wire nail, 1½\ninches\n12 pcs Chisel, ¼”\n\n4 kg\nCommon wire nail, 2\ninches\n\n--- PDF PAGE 69 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 67\n\n TOOLS\nEQUIPMENT\nMATERIALS\nQTY\n\nQTY\n\nQTY\n\n12 pcs\nChisel, ½ ”\n\n4 kg\nCommon wire nail, 3\ninches\n12 pcs\nChisel, ¾ ”\n\n25 pcs\nPlywood,1/4”x4’x8’\n12 pcs\nChisel, 2”\n\n5 liters\nWhite glue\n6 pcs\nAdjustable wrench, 8\ninches\n\n10 pcs.\nPiano hinge\n6 pcs\nAdjustable wrench, 12\ninches\n\n100pcs. Butt hinge assorted\nsizes\n\n1 set\nCombination spanner,\n8mm to 24mm\n\n25 pcs.\nConcealed hinge\n\n12 m\ntransparent hose,\nwhite, 3/8 in diameter\n\n25 pcs.\nDouble-action hinge\n12 m\nTransparent hose,\nwhite, ¼ in.\n\n1 pcs\nHard hat, white, (for\ntrainer)\n\n25 pcs Hard hat, yellow (for\ntrainees)\n\nLEARNING MATERIALS\n25\npairs\nGloves, knitted\n\nInteractive instructional\nmodules\n25\npairs\nSafety shoes\n\nBooks in carpentry\n25 pcs Goggle\n\n--- PDF PAGE 70 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 68\n\n3.5\nTRAINING FACILITIES FOR CARPENTRY NC II\n\nBased on a class size of 25 students/trainees\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nTotal Area in\nSq. Meters\nStudent/Trainee Working\nSpace\n2 x 3 per\nstudent/trainee\n6\n150\nContextual Learning\nLaboratory / Lecture Room\n4 x 5\n20\n20\nLearning Resource\nCenter\n4 x 5\n20\n20\nTool Room/Storage\n2 x 5\n10\n10\nWash room\n2.5 x 4\n10\n10\nCirculation area\n10 x 6\n60\n60\nTOTAL AREA\n\n270\n\n3.6\nTRAINER’S QUALIFICATION FOR CARPENTRY NC II\n\n•\nMust have undergone training on Training Methodology II (TM II)\n•\nMust be a holder of National Certificate Level III or its equivalent\n•\nGood moral character\n•\nMust be a holder of professional license issued by PRC or\nequivalent\n•\nMust be computer literate\n•\nMust be physically and mentally fit\n•\n*Must have 1 year industry experience and/or teaching experience\n\n*Optional. Only when required by the hiring institution\nReference: TESDA Board Resolution No. 2004-03\n\n3.7\nINSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is issued\nfor each unit of competency.\n\n--- PDF PAGE 71 ---\n__________________________________________________________________________________________\nTR CARPENTRY NC II 69"
