    },
    {
      "source_text": "1. Critical aspects of competency"
    },
    {
      "source_text": "Assessment requires evidence that the candidate: 1.1 Performed excavation and backfilling/compaction based on job specifications 1.2 Performed basic rebar fabrication 1.3 Erected and dismantled working platform in accordance with safety practices 1.4 Fabricated and stripped basic formworks following established procedures 1.5 Mixed mortar according to the requirements 1.6 Mixed concrete according to the instructions 1.7 Performed concreting work based on job requirements 1.8 Performed basic block laying according to job requirements 1.9 Performed housekeeping 1.10 Observed and complied with safety and environmental regulations 1.11 Communicated with others to ensure effective work operation 1.12 Observed and complied with the productivity requirements 1.13 Complied with attitudinal work requirements"
    },
    {
      "source_text": "2. Resource implications"
    },
    {
      "source_text": "The following resources should be provided: 2.1 Actual or simulated workplace 2.2 Tools, materials and equipment needed to perform the required tasks 2.3 References and manuals 2.4 PPE 2.5 First Aid Kit 3. Method of assessment"
    },
    {
      "source_text": "Competency in this unit may be assessed through: 3.1 Demonstration/Observation with Oral Questioning"
    },
    {
      "source_text": "4. Context for assessment"
    },
    {
      "source_text": "4.1 Competency may be assessed in actual workplace or at the designated TESDA Accredited Assessment Center."
