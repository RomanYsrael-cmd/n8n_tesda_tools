      "source_text": "2.1 Communication skills 2.2 Knowledge management 2.3 Organizing skills 2.4 Observation skills"
    },
    {
      "source_text": "3. Comply with relevant occupational safety and health policies and standards 3.1 Preventive Control Measures are identified in accordance with OSH work standards 3.2 OSH requirements are obeyed in accordance with workplace policies and procedures 3.3 Incident/ Emergency procedures are executed based on OSH Procedures"
    },
    {
      "source_text": "3.1 OSH Preventive Control Measures 3.2 Principles of 5S 3.3 Environmental requirements relative to industrial wastes disposal 3.4 OSH requirements relative to safe handling and disposal of materials 3.5 Personal hygiene practices"
    },
    {
      "source_text": "3.1 Communication skills 3.2 Knowledge management 3.3 Organizing skills 3.4 Critical thinking skills 3.5 Observation skills"
    },
    {
      "source_text": "-- PDF PAGE 31 --- MASONRY NC I Revision 01 Promulgated (10/29/2018) 27 RANGE OF VARIABLES"
    },
    {
      "source_text": "VARIABLE RANGE 1. Occupational Safety and Health Risks and Hazards May include: 1.1 Physical hazards – impact, illumination, pressure, noise, vibration, extreme temperature, radiation 1.2 Biological hazards- bacteria, viruses, plants, parasites, mites, molds, fungi, insects 1.3 Chemical hazards – dusts, fibers, mists, fumes, smoke, gasses, vapors 1.4 Ergonomics 1.5 Psychological factors – over exertion/ excessive force, awkward/static positions, fatigue, direct pressure, varying metabolic cycles 1.6 Physiological factors – monotony, personal relationship, work out cycle 1.7 Safety hazards (unsafe workplace condition) – confined space, excavations, falling objects, gas leaks, electrical, poor storage of materials and waste, spillage, waste and debris 1.8 Unsafe workers’ act (Smoking in off-limited areas, Substance and alcohol abuse at work) 2. OSH Work Standards May include: 2.1 OSHS Rule 1090 Hazardous Materials 2.2 OSHS Rule Gas & Electric Welding and Cutting Operations 2.3 OSHS Rule 1120 Hazardous Work Processes 2.4 OSHS Rule 1150 Materials Handling & Storage 2.5 OSHS Rule 1180 Internal Combustion Engine 2.6 OSHS Rule 1210 Electrical Safety 2.7 OSHS Rule 1420 Logging 2.8 OSHS Rule 1410 Construction Safety 2.9 OSHS Rule 1950 Pesticides & Fertilizers 3. OSH Requirements/ Regulations May include: 3.1 Clean Air Act 3.2 Building code 3.3 National Electrical and Fire Safety Codes 3.4 Waste management statutes and rules 3.5 Permit to Operate 3.6 Philippine Occupational Safety and Health Standards 3.7 Department Order No. 13 (Construction Safety and Health) 3.8 ECC regulations 3.9 Republic Act No. 11058 – An Strengthening Compliance with Occupational Safety and Health 4. Incident and Emergency Procedures May include: 4.1 Chemical spills 4.2 Equipment/vehicle accidents 4.3 Explosion 4.4 Fire Drill 4.5 Gas leak 4.6 Injury to personnel"
    },
    {
      "source_text": "-- PDF PAGE 32 --- MASONRY NC I Revision 01 Promulgated (10/29/2018) 28 4.7 Structural collapse 4.8 Earthquake drill 4.9 Toxic and/or flammable vapors emission 4.10 Evacuation 4.11 Isolation 4.12 Basic life support/CPR 4.13 Decontamination 4.14 Calling designed emergency personnel 5. OSH Work Instructions May include: 5.1 Worker’s Participation Policies 5.2 Company Environment Safety and Health Policies 5.3 Continual OSH Improvement Instructions 5.4 Education and Training 5.5 Safety and Health Policy Statements 5.6 Mission and Vision Statements 5.7 Operating Instructions and Policies 6. Personal Protective Equipment May include: 6.1 Arm/Hand guard, gloves 6.2 Eye protection (goggles, shield) 6.3 Hearing protection (ear muffs, ear plugs) 6.4 Hair Net/cap/bonnet 6.5 Hard hat 6.6 Face protection (mask, shield) 6.7 Apron/Gown/coverall/jump suit 6.8 Anti-static suits 6.9 High-visibility reflective vest 7. Preventive Control Measures May include: 7.1 Eliminate the hazard (i.e., get rid of the dangerous machine 7.2 Isolate the hazard (i.e. keep the machine in a closed room and operate it remotely; barricade an unsafe area off) 7.3 Substitute the hazard with a safer alternative (i.e., replace the machine with a safer one) 7.4 Use administrative controls to reduce the risk (i.e. give trainings on how to use equipment safely; OSH-related topics, issue warning signages, rotation/shifting work schedule) 7.5 Use engineering controls to reduce the risk (i.e. use safety guards to machine) 7.6 Use personal protective equipment 7.7 Safety, Health and Work Environment Evaluation 7.8 Periodic and/or special medical examinations of workers"
    },
    {
      "source_text": "-- PDF PAGE 33 --- MASONRY NC I Revision 01 Promulgated (10/29/2018) 29 EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of Competency"
    },
    {
      "source_text": "Assessment requires evidence that the candidate: 1.1. Recognize related occupational safety and health risks and hazards based on OSH work standards 1.2. Identify incident/emergency procedures relevant to workplace based on relevant OSH work standards 1.3. Follow the OSH work instructions in accordance with workplace policies and procedures 1.4. Utilize personal protective equipment, materials, tools, machinery, and equipment according to OSH work standards 1.5. Obey OSH requirements in accordance with workplace policies and procedures 1.6. Executed incident/ emergency procedures based on OSH Procedures 2. Resource Implications The following resources should be provided: 2.1 Facilities, materials tools and equipment necessary for the activity 3. Methods of Assessment Competency in this unit may be assessed through: 3.1 Observation/Demonstration with oral questioning 3.2 Third party report 4. Context for Assessment 4.1 Competency may be assessed in the work place or in a simulated work place setting"
    },
