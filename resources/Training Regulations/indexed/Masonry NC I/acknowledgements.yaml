TVET.\n\na. Course design is based on competency standards set by the industry\nor recognized industry sector; (Learning system is driven by\ncompetencies written to industry standards)\n\nb. Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance\nof work to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and\nattitude into account but requires evidence of actual performance of\nthe competency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n\ng. Training completion is based on satisfactory completion of all\nspecified competencies not on the specified nominal duration of\nlearning.\n\n2. The competency-based TVET system recognizes various types of\ndelivery modes, both on-and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities and their variations/components may be adopted\nsingly or in combination with other modalities when designing and\ndelivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP)\nwhich contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules\nand Regulations of the DTS Law and the TESDA Guidelines on\nthe DTP;\n\n--- PDF PAGE 102 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 98\n\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy\ncorrespondence\nstudy,\naudio,\nvideo,\ncomputer\ntechnologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an\napproved apprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time,\nusually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business.\nTraining is integrated into the production process and\napprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training- where training is implemented within\nthe company in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by\nthe TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs\nconducted by non-government organizations (NGOs), LGUs,\ntraining centers and other TVET providers which are intended to\naddress the specific needs of a community. Such programs can be\nconducted in informal settings such as barangay hall, basketball\ncourts, etc. These programs can also be mobile training program\n(MTP).\n\n--- PDF PAGE 103 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 99\n\n3.1 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the\nfollowing requirements:\n\n• Can communicate both orally and in writing\n• Can perform basic arithmetic operation\n• Physically fit\n\n--- PDF PAGE 104 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 100\n\n3.2 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25\ntrainees for MASONRY NC I are as follows:\n\nA. (Full Qualification)\n\nTOOLS\nQTY\nDESCRIPTION\n10 pcs.\nBucket / Pail\n1 pc.\nMixing board\n(4x8 feet)\n12 pcs.\nShovel, flat\n25 pcs.\nSteel trowel\n(8 inches straight-edged pointed)\n25 pcs.\nWooden float\n25 pcs.\nSteel tape (5 meters)\n5 pcs.\nPlumb bob\n2 sets\nScaffolding\n(2 layers, 1.2 meters)\n5 pcs.\nChalk line\n5 pcs.\nCross-cut saw (18 inches)\n2 pcs.\nBar cutter\n2 pcs.\nBar bender\n5 pcs.\nSteel square\n5 pcs.\nCold chisel\n5 pcs.\nHacksaw\n5 pcs.\nLevel hose\n(5 meters)\n25 pcs.\nClaw hammer\n5 pcs.\nMeasuring box\n\n--- PDF PAGE 105 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 101\nTOOLS\nQTY\nDESCRIPTION\n5 pcs.\nHack saw blade\n5 pcs.\nSteel brush\n5 pcs.\nWheelbarrow\n5 pcs.\nCrow bar, 18 inches\n5 pcs.\nManual tampering tool\n1 pc.\nConcrete vibrator\n5 pcs.\nLevel bar\n\nEQUIPMENT\nQTY\nDESCRIPTION\n1 unit\nOne bagger mixer (gas operated)\n2 pcs.\nBlock cutter (7 inches blade diameter)\n\nMATERIAL\nQTY\nDESCRIPTION\n250 pcs.\nConcrete Hollow blocks ( 4 inches)\n10 bags\nCement\n25 pcs.\nReinforcing bars (10 mm diameter)\n3 m3\nSand\nVar\nWater\n5 kls.\nGI wire, #20\n10 kls.\nCommon wire Nails (assorted sizes)\n30 pcs.\nLumber (2” x 2” x 10’)\n\n--- PDF PAGE 106 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 102\nMATERIAL\nQTY\nDESCRIPTION\n2.5 kls.\nConcrete nails\n(1 1/2 inch)\n5 bags\nLime\n25 pcs.\nPencil\n5 rolls\nNylon string (5 meter length)\n2.5 m3\nGravel (¾ inch)\n5 m\nSand Screen (100mm)\n10 pcs\nPlywood\n(½” X 4’ X 8’)\n\nPERSONAL PROTECTIVE EQUIPMENT (PPE)\nQTY\nDESCRIPTION\nOne per trainee\nSafety shoes/ rubber boots (Trainee to provide)\nOne per trainee\nProper uniform/clothing (Trainee to provide)\nOne per trainee\nGloves (cotton) (Trainee to provide)\nOne per trainee\nSafety goggles (Trainee to provide)\n25 pcs.\nReflectorized vest\n\n--- PDF PAGE 107 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 103\n\n3.5 TRAINING FACILITIES\n\nThe masonry workshop must be of concrete structure. Based on class size\nof 25 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nPractical Training Area\n20 x 25\n500\nLibrary\n4 x 5\n20\nLecture Room\n8 x 6\n\n48\nTool Room/Storage\n4 x 5\n20\nWash room/Toilet\n4 x 5\n\n20\nCirculation area\n10 x 6\n\n60\nTOTAL AREA\n\n668\n\n--- PDF PAGE 108 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 104\n\n3.6 TRAINERS’ QUALIFICATION\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in\nMASONRY NC II\n• Must have completed the 40-Hour Construction Occupational Safety\nand Health (COSH) per Department Order No. 13 s. 1998, Guidelines\nGoverning Occupational Safety and Health in the Construction\nIndustry conducted by OSHC and DOLE accredited Safety Training\nOrganizations\n• Must have had at least 2-years job/industry experience in Masonry\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is\nissued for each unit of Competency.\n\n--- PDF PAGE 109 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 105\n\nSECTION 4 ASSESSSMENT AND CERTIFICATION ARRANGEMENT\n\nCompetency Assessment is the process of collecting evidence and making\njudgments whether competency has been achieved. The purpose of assessment\nis to confirm that an individual can perform to the standards expected at the\nworkplace as expressed in relevant competency standards.\nThe assessment process is based on evidence or information gathered to\nprove achievement of competencies. The process may be applied to an\nemployable unit(s) of competency in partial fulfillment of the requirements of the\nnational qualification.\n\n4.1 NATIONAL ASSESSMENTAND CERTIFICATION ARRANGEMENTS\n\n4.1.1 A National Certificate (NC) is issued when a candidate has\ndemonstrated competence in all unit/s of competency of a\nqualification with a promulgated Training Regulations.\n\n4.1.2 Individuals wanting to be certified will have to be assessed in\naccordance with the requirements identified in the evidence guide of\nthe relevant unit/s of competency.\n\n4.1.3 Recognition of Prior Learning (RPL). Candidates who have gained\ncompetencies through informal training, previous work and/or life\nexperiences may apply for recognition in a particular qualification\nthrough competency assessment:\n\n4.1.4 Existing National Certificate in Masonry NC I will be renewed and\nconverted to the amended Training Regulations for Masonry NC I.\n\n4.1.5 The\nindustry\nshall\ndetermine\nassessment\nand\ncertification\nrequirements for each qualification with promulgated Training\nRegulations: It includes the following:\n\na. Entry requirements for candidates\nb. Evidence gathering methods\nc. Qualification requirements of competency assessors\nd. Specific assessment and certification arrangements as identified by\nindustry\n\n--- PDF PAGE 110 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 106\n\n4.2 COMPETENCY ASSESSMENT REQUISITE\n4.2.1 Self-Assessment Guide. The self-assessment guide (SAG) is\naccomplished by the candidate prior to actual competency\nassessment. SAG is a pre-assessment tool to help the candidate\nand the assessor determine what evidence is available, where gaps\nexist, including readiness for assessment.\n\nThis document can:\na.\nIdentify the candidate’s skills and knowledge\nb.\nHighlight gaps in candidate’s skills and knowledge\nc.\nProvide critical guidance to the assessor and candidate on the\nevidence that need to be presented\nd.\nAssist the candidate to identify key areas in which practice is\nneeded or additional information or skills that should be gained\nprior `\n4.2.2 Accredited\nAssessment\nCenter.\nOnly Assessment\nCenter\naccredited by TESDA is authorized to conduct competency\nassessment. Assessment centers undergo a quality assured\nprocedure for accreditation before they are authorized by TESDA to\nmanage the assessment for National Certification.\n4.2.3 Accredited Competency Assessor. Only accredited competency\nassessor is authorized to conduct assessment of competence.\nCompetency assessors undergo a quality assured system of\naccreditation procedure before they are authorized by TESDA to\nassess the competencies of candidates for National Certification.\n\n--- PDF PAGE 111 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 107\n\nANNEX A\n\nReceive and\nrespond to\nworkplace\ncommunication\nWork with\nothers\nSolve/address\nroutine\nproblems\nEnhance\nself-\nmanagement\nskills\nSupport\nInnovation\nAccess and\nmaintain\ninformation\nFollow\noccupational\nsafety and\nhealth\npolicies and\nprocedures\nApply\nenvironmental\nwork\nstandards\nAdopt\nentrepreneurial\nmindset in the\nworkplace\nParticipate in\nworkplace\ncommunication\nWork in\nTeam\nEnvironment\nSolve/address\ngeneral\nworkplace\nproblems\nDevelop\ncareer and\nlife decisions\nContribute to\nworkplace\ninnovation\nPresent\nrelevant\ninformation\nPractice\noccupational\nsafety and\nhealth policies\nand\nprocedures\nExercise\nefficient and\neffective\nsustainable\npractices in the\nworkplace\nPractice\nentrepreneurial\nskills in the\nworkplace\nLead workplace\ncommunication\nLead small\nteams\nApply critical\nthinking and\nproblem-\nsolving\ntechniques in\nthe workplace\n\nWork in a\ndiverse\nenvironment\nPropose\nmethods of\napplying\nlearning and\ninnovation in\nthe\norganization\nUse\ninformation\nsystematically\nEvaluate\noccupational\nsafety and\nhealth work\npractices\n\nEvaluate\nenvironmental\nwork practices\n\nFacilitate\nentrepreneurial\nskills for micro-\nsmall-medium\nenterprises\n(MSMEs)\n\nCOMPETENCY MAP - CONSTRUCTION SECTOR\n(Civil Works)\n MASONRY NC I\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 112 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 108\n\nUtilize\nspecialize\nspecialized\ncommunication\nskill\nDevelop\nand lead\nteams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage\nand sustain\nhigh\nperforming\nteams\nEvaluate higher\norder thinking\nskills and adjust\nproblem solving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nimplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nPrepare\nconstruction\nmaterials and\ntools\n\nObserve\nprocedures,\nspecifications\nand manual of\ninstructions\n\nInterpret\ntechnical\ndrawings and\nplans\n\nPerform\nmensurations\nand\ncalculations\n\nMaintain tools\nand\nequipment\n\nCOMMON COMPETENCIES\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 113 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 109\n\nPrepare masonry\nmaterials\n\nPerform masonry tools and\nequipment\n\nPerform basic masonry\nworks\n\nLay concrete hollow block for\nstructure\nPlaster wall surface\nPerform basic tile\nsetting\nPerform straight-to-finish floor\nconcreting\nRectify non-conforming\nconcrete and masonry\nsurfaces\nLay tiles on plain and curved\nsurfaces for walls, floors and\nother application\nRepair of tiles on plain\nand curved surfaces\nLayout reference lines\n\nFabricate, install and remove\nwooden formworks\n\nInstall wooden door jamb,\nwindow frame and panels\n\nInstall ceiling and wall frames\nand panels\n\nFabricate and install\nwooden stairs\n\nInstall wooden floor\nsupports and panels\n\nFabricate and install roofing\nsystem\n\nFabricate and install wooden\ncabinet\n\nInstall decorative moldings\n\nInstall ceiling frames\nand panels or\nacoustical ceiling\n\nInstall eaves or soffits\nframes and panels and\nvents assembly\nInstall partition wall and/or\ncladding frames and boards\n\nInstall laminate floors\n\nInstall parquet floors\n\nErect and dismantle\nsupport type scaffold\n\nHandle, segregate and\nstack scaffolding\ncomponents\nPrepare pipefitting materials,\ntools and equipment for spool\npipe connection\nInstall above ground piping\nsystem\n\nInstall overhead piping\nsystem\nInstall underground\npiping system\nLay tiles on plain and\ncurved surfaces for\nwalls, floors and other\napplication\nRepair of tiles on plain and\ncurved surfaces\n\nCORE COMPETENCIES\n\n--- PDF PAGE 114 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n110\n\nGLOSSARY OF TERMS\n\n1. DOWEL\n\nA headless, cylindrical pin which, is sunk into corresponding\nholes\n\n2. LINTEL\nRefers to the horizontal member over an opening such as door\nor window, usually carrying the load\n\n3. MORTAR\nRefers to a mixture of cement, sand and water used for laying\nbricks or masonry units\n\n4. REBAR\nRefers to the reinforcing bars that are embedded in building\ncomponents such as concrete, masonry walls, columns, beams\nand other structural parts\n\n4. SCAFFOLD\nRefers to a temporary or movable platform supported on the\nground or suspended, used for working at considerable heights\nabove the ground.\n\n5. FORMWORKS\n\n6. CURING\n\n7. 5S\n\n8. 3R\n\nReduce\n\n Reuse\n\n Recycling\nA set of wood or steel forms in place to hold wet concrete until it\nhardens\n\nIs defined as providing adequate moisture, temperature, and\ntime to allow the concrete to achieve the desired properties for\nits intended use.\n\nThe five in a 5S workplace organizational and housekeeping\nmethodology refers to five steps – sort, set in order, shine,\nstandardize and sustain.\n\nThe principle of reducing waste, reusing and recycling resources\nand products\n\nThe waste management concept of reducing what is produced\nand what is consumed\n\nThe waste management concept of reusing items, or re-\npurposing them for a use different than what they are intended\nfor\n\nThe waste management concept of transforming again into a\nraw material that can be shaped into a new item\n\n--- PDF PAGE 115 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n\n111\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nMasonry NC I\nQualification Code: CONMAS118\n\nRevision\nNo.\nDocument\nTypes*\nQualification\nTitle\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nMasonry NC I\n2006-09 /\n04/20/06\nN/A\n01\nDocument Amended\n\nMasonry NC I\n\n2018-31 /\n10/29/18\nNo. 011 series\nof 2019\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 116 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n\n112\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry, academe\nand government agencies who donated their time and expertise to the development and\nvalidation of these Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\nMARCELO R. ABAD\nConsultant/ Industry Expert\nQuezon City\nRIZALDY E. ANGELES\nConstruction Manager - Industry Expert\nEEI Corporation\nQuezon City\nROLANDO C. BADILLA\nTechnical Specialist – Industry Expert\nJames Hardie Philippines, Inc.\nCabuyao, Laguna\nJOHN S. JUAN\nSTIDS\nConstruction Industry Authority of the\nPhils. (CIAP) - CMDF\nMakati City\nALIPIO M. PANGANIBAN\nDepartment Head - Industry Expert\nDatem Construction\nQuezon City\nANGELITO V. ZULUETA\nConsultant/ Industry Expert\nAVZ Management & Consulting Services\nSingalong, Manila\n\nJELUZ B. CORRO\nDepartment Head - Industry Expert\nDatem Construction\nQuezon City\n\nPHILIPPINE CONSTRUCTORS ASSOCIATION, INC. (PCA)\n\n--- PDF PAGE 117 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n\n113\nThe PARTICIPANTS in the Validation of this Training Regulations\n\nVISAYAS REGION\n\n• Daleon Construction\n• Holcim - Galing Mason\n• Makati Development Corporation (MDC)\n• Philippine Macro Development Corporation\n• School for Knowledge Industrial Labor Leadership Service (SKILLS)\n• TESDA Regional Office - Cebu\n• TESDA Provincial Office - Cebu\n• TESDA Regional Training Center - Cebu\n\nMINDANAO REGION\n\n• Allado Construction\n• Association of Construction and Informal Workers (ACIW) - Davao\n• Assumption College of Nabunturan\n• Carmelo Delo Cientos National Trade Schools, (CCNTS)\n• David M. Consunji, Inc. (DMCI) - Davao\n• Makati Development Corporation (MDC) - Davao\n• Tagum City Trade School (TCTS)\n• PTC-San Isidro Manpower Training Center (SIMTRAC)\n• RTC-Korea Phils. Vocational Training Center (KPCTC)\n\nLUZON REGION\n\n• Association of Construction and Informal Workers (ACIW)\n• Construction Industry Authority of the Philippines (CIAP) -CMDF\n• Construction Industry Workers Council (CIWC)\n• Construction Industry Workers Council (CIWC) -NACMADECO\n• Datem Construction\n• D. M. Consunji, Inc\n• EEI Corporation\n• James Hardie Philippines, Inc.\n• Makati Development Corporation\n• TESDA PTC - Tarlac\n• Saint Peregrine Institute\n• Vision Properties Development Corporation\n\n--- PDF PAGE 118 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n\n114\n\nThe MEMBERS of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n• Qualifications and Standards Office (QSO)\n• TR Development Team/Fa