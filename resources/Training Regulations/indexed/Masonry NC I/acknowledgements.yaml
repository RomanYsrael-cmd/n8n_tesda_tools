  "source_text": "ACKNOWLEDGEMENTS 112-114\n\n--- PDF PAGE 5 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n1\n\nTRAINING REGULATIONS FOR\n\nMASONRY NC I\n\nSECTION 1 MASONRY NC I QUALIFICATION\n\nThe MASONRY NC I qualification consists of competencies that a person must achieve\nthat will enable him/her to prepare masonry materials, tools and equipment and perform basic\nmasonry works.\n\nThis Qualification is packaged from the competency map of Construction – Civil Works\nsub-sector as shown in Annex A.\n\nThe units of competency comprising this qualification include the following:\n\nCODE NO.\nBASIC COMPETENCIES\n400311101\nReceive and respond to workplace communication\n400311102\nWork with others\n400311103\nSolve/address routine problems\n400311104\n400311105\n400311106\n400311107\n\n400311108\n400311109\n\nEnhance self-management skills\n Support innovation\nAccess and maintain information\nFollow occupational safety and health policies and\nprocedures\nApply environmental work standards\nAdopt entrepreneurial mindset in the workplace\nCODE NO.\nCOMMON COMPETENCIES\nCON931201\nPrepare construction materials and tools\nCON311201\nObserve procedures, specifications and manuals of\ninstruction\nCON311203\nPerform mensurations and calculations\nCON311204\nMaintain tools and equipment\n\nCODE NO.\nCORE COMPETENCIES\nCON711315\nCON711316\nPrepare masonry materials\nPrepare masonry tools and equipment\nCON711317\n\nPerform basic masonry works\n\nA person who has achieved this Qualification is competent to be a –\n\n❑ Helper Mason\n❑ Construction Helper\n\n--- PDF PAGE 6 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n2\nSECTION 2 COMPETENCY STANDARDS\n\nThis section gives the details and contents of the units of competency required in\nMASONRY NC I. These units of competency are categorized into basic, common and core\ncompetencies.\n\nBASIC COMPETENCIES\n\nUNIT OF COMPETENCY :\nRECEIVE AND RESPOND TO WORKPLACE\nCOMMUNICATION\n\nUNIT CODE\n:\n400311101\n\nUNIT DESCRIPTOR\n: This unit covers the knowledge, skills and attitudes required to\nreceive, respond and act on verbal and written communication.\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Follow routine\n spoken\n messages\n1.1 Required information is\ngathered by listening\nattentively and correctly\ninterpreting or\nunderstanding\ninformation/ instructions\n1.2 Instructions/ information\nare recorded in\naccordance with\nworkplace requirements\n1.3 Instructions are acted\nupon immediately in\naccordance with\ninformation received\n1.4 Clarification is sought\nfrom workplace\nsupervisor on all\noccasions when any\ninstruction/ information\nis not clear\n1.1 Organizational\npolicies/ guidelines\nin regard to\nprocessing\ninternal/external\ninformation\n1.2 Ethical work\npractices in\nhandling\ncommunications\n1.3 Overview of the\nCommunication\nprocess\n1.4 Effective note-\ntaking and\nquestioning\ntechniques\n1.1 Conciseness in\nreceiving and\nclarifying\nmessages/\ninformation/\ncommunication\n1.2 Accuracy in\nrecording\nmessages/\ninformation\n1.3 Basic\ncommunication\nskills\n1.4 Active-listening\nSkills\n1.5 Note-taking skills\n1.6 Clarifying and\nprobing\nquestions\n(questioning\nskills)\n2. Perform\nworkplace\nduties\nfollowing\nwritten notices\n2.1 Written notices and\ninstructions are read\nand interpreted\ncorrectly in accordance\nwith organizational\nguidelines\n2.2 Routine written\ninstructions are\nfollowed in sequence\n2.3 Feedback is given to\nworkplace supervisor\nbased on the\ninstructions/\ninformation received\n2.1 Organizational\nguidelines in\nregard to\nprocessing\ninternal/ external\ninformation\n2.2 Ethical work\npractices in\nhandling\ncommunications\n2.3 Overview of the\nCommunication\nprocess\n2.4 Effective\n2.1 Conciseness in\nreceiving and\nclarifying\nmessages/\ninformation/\ncommunication\n2.2 Accuracy in\nrecording\nmessages/\ninformation\n2.3 Clarifying and\nprobing\nquestions\n(Questioning\n\n--- PDF PAGE 7 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n3\nquestioning\ntechniques\n(clarifying and\nprobing)\n\nSkills)\n2.4 Skills in reading\nand recording\nand labeling data\n2.5 Skills in locating\ninformation\n\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Written notices and\ninstructions\nMay include:\n1.1. Written work instructions\n1.2. Internal memos/memorandum\n1.3. Business letters\n1.4. External communications\n1.5. Electronic mail\n1.6. Briefing notes\n1.7. General correspondence\n1.8. Marketing materials\n1.9. Guidelines/Circulars\n2. Organizational\nguidelines\nMay include:\n2.1. Information documentation procedures\n2.2. Company guidelines and procedures\n2.3. Standard Operating Procedure (SOPs)\n2.4. Organization manuals\n2.5. Departmental Policies and Procedures Manual\n2.6. Service manual\n\n--- PDF PAGE 8 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n4\nEVIDENCE GUIDE\n\n1. Critical aspects of\nCompetency\nAssessment requires evidence that the candidate:\n1.1 Demonstrated knowledge and understanding of\norganizational procedures in handling verbal and\nwritten communications\n1.2 Received and acted on verbal messages and\ninstructions correctly and efficiently\n1.3 Demonstrated ability in recording\ninstructions/information\n1.4 Utilized effective clarifying and probing techniques\nwhere necessary\n2. Resource\nImplications\nThe following resources should be provided:\n2.1 Pens\n2.2 Note pads\n2.3 Computer (if applicable)\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1 Demonstration on communication skills (e. g., role-\nplaying)\n3.3 Oral questioning/Interview\n3.3 Written Test\n4. Context for\nAssessment\n4.1 Competency may be assessed individually in the\nactual workplace or in a simulated environment in\nTESDA-accredited institutions\n\n--- PDF PAGE 9 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n5\nUNIT OF COMPETENCY :\nWORK WITH OTHERS\n\nUNIT CODE\n:\n400311102\n\nUNIT DESCRIPTOR\n:\nThis unit covers the skills, knowledge and attitudes required in\nworking as member of a team, interacting with co-members\nand performing one’s role in the team.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Develop\neffective\nworkplace\nrelationships\n1.1 Duties and\nresponsibilities are\ndone in a positive\nmanner to promote\ncooperation and good\nrelationship\n1.2 Assistance is sought\nfrom workgroup\nwhen difficulties arise\nand addressed\nthrough discussions\n1.3 Feedback provided\nby others in the team\nis encouraged,\nacknowledged and\nacted upon\n1.4 Differences in\npersonal values and\nbeliefs are respected\nand acknowledged\nduring interaction\n1.1 One’s role, duties\nand responsibilities\nin the workplace\n1.2 Acknowledging/\nreceiving and\ngiving feedback\n1.3 Valuing respect\nand empathy in the\nworkplace\n1.4 Workplace\ncommunication\nprotocols\n1.5 Teamwork\n1.6 Collaboration and\nteambuilding within\nthe enterprise\n1.1 Communication\nskills – oral and\nwritten\n(e. g., requesting\nadvice, receiving\nfeedback)\n1.2 Ability to relate\nto/interact with\npeople from a\nrange of social\nand cultural\nbackgrounds\n\n2. Contribute to\nwork group\nactivities\n2.1 Support is provided\nto team members to\nensure workgroup\ngoals are met\n2.2 Constructive\ncontributions to\nworkgroup goals and\ntasks are made\naccording to\norganizational\nrequirements\n2.3 Information relevant\nto work is shared with\nteam members to\nensure designated\ngoals are met\n2.1 Importance of\ncreative\ncollaboration,\nsocial\nperceptiveness and\nproblem sensitivity\nin the workplace\n2.2 Organizational\nRequirements\n2.3 importance of\ninitiative and\ndedication in group\nprocess\n2.4 Office and\nworkplace\ntechnologies and\nautomation\n(hardware,\nsoftware systems)\n\n2.1 Communication\nskills – oral and\nwritten (e. g.,\nrequesting advice,\nreceiving\nfeedback)\n2.2 Organizing work\npriorities and\narrangements\n2.3 Team player\nskills\n\n2.4 Technology skills\nincluding the\nability to select\nand use\ntechnology\nappropriate to a\ntask\n\n--- PDF PAGE 10 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n6\nRANGE OF VARIABLES\n\nVARIABLE\nRANGE\n1. Duties and\nresponsibilities\nMay include:\n1.1 Job description and employment arrangements\n1.2 Organization’s policy relevant to work role\n1.3 Organizational structures\n1.4 Supervision and accountability requirements including OHS\n1.5 Enterprise code of conduct\n2. Work group\nMay include:\n2.1 Supervisor or manager\n2.2 Peers/work colleagues and clients\n2.3 Other members of the organization\n3. Feedback\nMay include:\n3.1 Formal/Informal performance appraisal\n3.2 Obtaining feedback from supervisors and colleagues and clients\n3.3 Personal, reflective behavior strategies\n3.4 Routine organizational methods for monitoring service delivery\n4. Providing\nsupport to team\nmembers\nMay include:\n4.1 Explaining/clarifying\n4.2 Helping colleagues\n4.3 Providing encouragement\n4.4 Providing feedback to another team member\n4.5 Undertaking extra tasks if necessary\n5. Organizational\nrequirements\n\nMay include:\n5.1 Goals, objectives, plans, system and processes\n5.2 Legal and organization policy/guidelines\n5.3 OHS policies, procedures and programs\n5.4 Ethical standards\n5.5 Defined resources parameters\n5.6 Quality and continuous improvement processes and standards\n\n--- PDF PAGE 11 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n7\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1.\nProvided support to team members to ensure goals are met\n1.2.\nActed on feedback from clients and colleagues\n1.3.\nDemonstrated quality/active participation in team meetings\nand activities\n2. Resource\nImplications\nThe following resources should be provided:\n2.1.\nAccess to relevant workplace or appropriately simulated\nenvironment where assessment can take place\n2.2.\nMaterials relevant to the proposed activity or task\n3. Methods of\nAssessment\nCompetency in this unit may be assessed through:\n3.1\nWritten Test\n3.2\nRole play\n3.3\nInterview/Oral questioning\n3.4\nStructured and unstructured activity\n4. Context for\nAssessment\n4.1.\nCompetency assessment may occur in workplace or any\nappropriately simulated environment\n4.2.\nAssessment shall be observed while task are being\nundertaken whether individually or in group\n\n--- PDF PAGE 12 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n8\nUNIT OF COMPETENCY :\nSOLVE/ADDRESS ROUTINE PROBLEMS\n\nUNIT CODE\n:\n400311103\n\nUNIT DESCRIPTOR\n:\nThis unit of covers the knowledge, skills and attitudes required\nto solve problems in the workplace including the application of\nproblem solving techniques and to determine and resolve the\nroot cause of routine problems.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Identify the\nproblem\n1.1 Desired\noperating/output\nparameters and\nexpected quality of\nproducts/services are\nidentified.\n1.2 The nature of the\nproblem by observation\non routines are\ndefined.\n1.3 Problems are stated\nand specified clearly.\n1.1 Competence\nincludes mastery of\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations\n1.2 Competence to\ninclude the ability\nto apply and\nexplain\nfundamental\ncauses of problems\nroutine problems\nand to determine\nthe corrective\nactions.\n1.3 Relevant\nequipment and\noperational\nprocesses\n1.4 Enterprise goals,\ntargets and\nmeasures\n1.5 Enterprise quality\nOHS and\nenvironmental\nrequirement\n1.6 Enterprise\ninformation\nsystems and data\ncollation\n1.7 Industry codes and\nstandards\n1.1 Using range of\nformal problem-\nsolving\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous and\nsuccessive\nprocessing of\ninformation).\n1.2 Identifying and\nclarifying the\nnature of the\nproblem.\n\n--- PDF PAGE 13 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n9\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n2. Assess\nfundamental\ncauses of the\nproblem\n2.1 Problem-solving tool\nappropriate to the\nproblem and the\ncontext is selected\n2.2 Possible causes\nbased on experience\nand the use of\nproblem-solving\ntools/basic analytical\ntechniques are\nidentified\n2.3 Possible fundamental\ncauses of problems\nare specified.\n\n2.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations\n2.2 Competence to\ninclude the ability\nto apply and\nexplain\nfundamental\ncauses of\nproblems routine\nproblems and to\ndetermine the\ncorrective actions.\n2.3 Relevant\nequipment and\noperational\nprocesses\n2.4 Enterprise goals,\ntargets and\nmeasures\n2.5 Enterprise quality\nOHS and\nenvironmental\nrequirement\n2.6 Enterprise\ninformation\nsystems and data\ncollation\n2.7 Industry codes and\nstandards\n2.1 Using range of\nformal problem-\nsolving\ntechniques (e.g.,\nplanning,\nattention,\nsimultaneous\nand successive\nprocessing of\ninformation).\n2.2 Identifying extent\nand causes of\nprocedural\nproblems.\n\n--- PDF PAGE 14 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 10\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n3. Determine\ncorrective\naction\n3.1 All possible options are\nconsidered for\nresolution of the routine\nproblem.\n3.2 Corrective actions are\ndetermined to resolve\nthe problem and\npossible future causes\n3.3 Action plans are\ndeveloped identifying\nmeasurable objectives,\nresource needs and\ntimelines in accordance\nwith safety and\noperating procedures\n\n3.1 Competence\nincludes a thorough\nknowledge and\nunderstanding of\nthe process, normal\noperating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations\n3.2 Competence to\ninclude the ability to\napply and explain,\nsufficient for the\nidentification of\nfundamental cause,\ndetermining the\ncorrective action\nand provision of\nrecommendations\n3.3 Relevant\nequipment and\noperational\nprocesses\n3.4 Enterprise goals,\ntargets and\nmeasures\n3.5 Enterprise quality\nOHS and\nenvironmental\nrequirement\n3.6 Principles of\ndecision making\nstrategies and\ntechniques\n3.7 Enterprise\ninformation\nsystems and data\ncollation\n3.8 Industry codes and\nstandards\n3.1 Using range of\nformal problem-\nsolving\ntechniques.\n3.2 Identifying and\nclarifying the\nnature of the\nproblem.\n3.3 Devising and\napplying the\nbest possible\nsolution to a\nproblem.\n3.4 Evaluating the\nsolution\n\n4. Communicate\naction plans and\nrecommendations\nto routine\nproblems\n4.1 Report on\nrecommendations are\nprepared\n4.2 Recommendations are\npresented to\nappropriate person.\n4.3 Recommendations are\nfollowed-up, if required\n4.1 Competence\nincludes a\nthorough\nknowledge and\nunderstanding of\nthe process,\nnormal operating\nparameters, and\nproduct quality to\nrecognize non-\nstandard situations\n4.1 Using range of\nformal problem\nsolving\ntechniques\n4.2 Identifying and\nclarifying the\nnature of the\nproblem\n4.3 Devising the\nbest possible\nsolution to a\n\n--- PDF PAGE 15 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 11\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the Range of\nVariables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n4.2 Competence to\ninclude the ability\nto apply and\nexplain, sufficient\nfor the identification\nof fundamental\ncause, determining\nthe corrective\naction and\nprovision of\nrecommendations\n4.3 Relevant\nequipment and\noperational\nprocesse