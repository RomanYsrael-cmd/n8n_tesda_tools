      "source_text": "REQUIRED KNOWLEDGE"
    },
    {
      "source_text": "REQUIRED SKILLS 2. Perform relevant occupational safety and health procedures 2.1 Safety devices are checked in accordance with workplace OSH work standards 2.2 OSH Work instructions are followed in accordance with workplace policies and procedures* 2.3 Personal protective equipment, materials, tools, machinery, and equipment are utilized according to OSH work standards 2.1 OSH Work instructions Personal protective equipment 2.2 Safe handling procedures of tools, equipment and materials 2.3 Standard emergency plan and procedures 2.4 Different OSH control measures 2.5 Standard accident and illness reporting procedures"
    },
