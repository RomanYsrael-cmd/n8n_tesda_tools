      "source_text": "-- PDF PAGE 29 --- MASONRY NC I Revision 01 Promulgated (10/29/2018) 25 UNIT OF COMPETENCY : FOLLOW OCCUPATIONAL SAFETY AND HEALTH POLICIES AND PROCEDURES UNIT CODE : 400311107"
    },
    {
      "source_text": "UNIT DESCRIPTOR : This unit covers the knowledge, skills and attitudes to identify relevant occupational safety and health policies and procedures, perform relevant occupational safety and health procedures, and comply with relevant occupational safety and health policies and standards"
