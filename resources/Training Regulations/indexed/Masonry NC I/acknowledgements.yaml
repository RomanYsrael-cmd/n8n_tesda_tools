      "source_text": "REQUIRED SKILLS 1. Identify the need for innovation in one’s area of work 1.1 The value of innovative practices in the workplace is recognized 1.2 Creativity in innovation in one’s scope of work is applied 1.3 The need for innovation in own scope of work is recognized 1.1 Clear-cut definition of innovation 1.2 Current practice in own scope of work 1.3 Workplace procedures 1.1 Contributing in brainstorming session 1.2 Examining current practice in one’s scope of work 1.3 Identifying issues and concerns of one’s scope of work 2. Recognize innovative and creative ideas 2.1 Opportunities within the team are identified to develop innovation 2.2 Creative ideas of coworkers pertaining to work practices are analyzed 2.3 Environment conducive for learning and innovating is maintained 2.1 Support required to generate creative ideas 2.2 Difference between innovation and creativity 2.3 Innovative climate in one’s scope of work 2.1 Identifying resources required for creativity and innovation 2.2 Examining potential obstacles to and opportunities for creativity and innovation 2.3 Communicating creative ideas of co-workers 3. Support individuals’ access to flexible and innovative ways of working 3.1 Individuals and key people are reinforced to identify innovative ideas to achieve outcomes 3.2 Sharing of best practices using flexible and innovative ways of working is accomplished 3.3 Obstacles to progress in implementing flexible and innovative ways of working are recognized 3.1 The role of employees/work ers in the improvement of practices in the organization 3.2 Best practices using flexible and innovative ways of working 3.3 Obstacles in implementing innovation in one’s scope of work 3.1 Encouraging co- workers to generate and develop ideas 3.2 Evaluating potential obstacles to and opportunities for creativity and innovation 3.3 Sharing of best practices related to innovation and creativity"
    },
    {
      "source_text": "-- PDF PAGE 23 --- MASONRY NC I Revision 01 Promulgated (10/29/2018) 19"
