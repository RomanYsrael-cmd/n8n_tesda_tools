      "source_text": "SECTION 1 MASONRY NC I QUALIFICATION"
    },
    {
      "source_text": "The MASONRY NC I qualification consists of competencies that a person must achieve that will enable him/her to prepare masonry materials, tools and equipment and perform basic masonry works."
    },
    {
      "source_text": "This Qualification is packaged from the competency map of Construction – Civil Works sub-sector as shown in Annex A."
    },
    {
      "source_text": "The units of competency comprising this qualification include the following:"
    },
    {
      "source_text": "CODE NO. BASIC COMPETENCIES 400311101 Receive and respond to workplace communication 400311102 Work with others 400311103 Solve/address routine problems 400311104 400311105 400311106 400311107"
    },
    {
      "source_text": "400311108 400311109"
    },
    {
      "source_text": "Enhance self-management skills Support innovation Access and maintain information Follow occupational safety and health policies and procedures Apply environmental work standards Adopt entrepreneurial mindset in the workplace CODE NO. COMMON COMPETENCIES CON931201 Prepare construction materials and tools CON311201 Observe procedures, specifications and manuals of instruction CON311203 Perform mensurations and calculations CON311204 Maintain tools and equipment"
    },
    {
      "source_text": "CODE NO. CORE COMPETENCIES CON711315 CON711316 Prepare masonry materials Prepare masonry tools and equipment CON711317"
    },
    {
      "source_text": "Perform basic masonry works"
    },
    {
      "source_text": "A person who has achieved this Qualification is competent to be a –"
    },
    {
      "source_text": "❑ Helper Mason ❑ Construction Helper"
    },
