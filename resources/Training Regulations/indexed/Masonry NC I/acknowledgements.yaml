RY NC I Revision 01 Promulgated (10/29/2018) 70\nVARIABLE\nRANGE\n6. Formworks\nmaterials\nMay include:\n6.1 Plywood\n6.2 Rough lumber\n6.3 Nails\n6.4 Tie wire\n6.5 Form oil\n6.6 Tie rod / form tie\n\n7. Mixing tools and\nequipment\n\nMay include:\n7.1 One bagger mixer\n7.1.1 Mortar Mixer\n7.1.2 Concrete Mixer\n7.2 Mixing board\n7.3 Shovel\n7.4 Pails\n7.5 Screen wire (2-3mm mesh)\n7.6 Mixing box\n7.7 Bucket\n\n8. Appropriate\npersonnel\nMay include:\n8.1 Plasterer\n8.2 Block layer\n8.3 Tile Setter\n\n--- PDF PAGE 75 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 71\nEVIDENCE GUIDE\n\n1. Critical aspects\nof competency\n\nAssessment requires evidence that the candidate:\n1.1\nPerformed excavation and backfilling/compaction\nbased on job specifications\n1.2\nPerformed basic rebar fabrication\n1.3\nErected and dismantled working platform in accordance\nwith safety practices\n1.4\nFabricated and stripped basic formworks following\nestablished procedures\n1.5\nMixed mortar according to the requirements\n1.6\nMixed concrete according to the instructions\n1.7\nPerformed concreting work based on job requirements\n1.8\nPerformed basic block laying according to job\nrequirements\n1.9\nPerformed housekeeping\n1.10 Observed and complied with safety and environmental\nregulations\n1.11 Communicated with others to ensure effective work\noperation\n1.12 Observed and complied with the productivity\nrequirements\n1.13 Complied with attitudinal work requirements\n\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1 Actual or simulated workplace\n2.2 Tools, materials and equipment needed to perform the\nrequired tasks\n2.3 References and manuals\n2.4 PPE\n2.5 First Aid Kit\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1 Demonstration/Observation with Oral Questioning\n\n4. Context for\nassessment\n\n4.1 Competency may be assessed in actual workplace or at\nthe designated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 76 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 72\nSECTION 3\nTRAINING ARRANGEMENTS\n\nThese standards are set to provide technical and vocational education and training\n(TVET) providers with information and other important requirements to consider when\ndesigning training programs for MASONRY NC I.\n\nThey include information on curriculum design; training delivery; trainee entry\nrequirements; tools and equipment; training facilities; and trainer’s qualification.\n\n3.1\nCURRICULUM DESIGN\n\nTESDA shall provide the training on the development of competency-based\ncurricula to enable training providers develop their own curricula with the components\nmentioned below.\n\nDelivery of knowledge requirements for the basic, common and core units of\ncompetency\nspecifically\nin\nthe\nareas\nof\nmathematics,\nscience/technology,\ncommunication/language and other academic subjects shall be contextualized. To this\nend, TVET providers shall develop a Contextual Learning Matrix (CLM) to accompany\ntheir curricula.\n\nCourse Title: MASONRY NC I\n\nNominal Training Duration:\n47 Hours Basic Competencies\n20 Hours Common Competencies\n\n56 Hours Core Competencies\n\n Total 123 Hours\n\nCourse Description:\n\nThis course is designed to provide the learner with knowledge, practical skills and\nattitude, applicable in performing work activities involve in preparing masonry materials, tools\nand equipment and preparing basic masonry works. This includes classroom learning\nactivities and practical work in actual work site or simulation area.\n\nUpon completion of the course, the learners are expected to demonstrate the above-\nmentioned competencies to be employed. To obtain this, all units prescribed for this\nqualification must be achieved.\n\n--- PDF PAGE 77 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 73\nBASIC COMPETENCIES\n(47 HOURS)\n\nUnit of\nCompetency\nLearning Outcomes\nLearning Activities\nMethodology\nAssessment\nApproach\nNominal\nDurati