ed with safety and environmental\nregulations\n1.5 Communicated with others to ensure effective work\noperation\n1.6 Observed and complied with the productivity requirements\n1.7 Complied with attitudinal work requirements\n\n2. Resource\nimplications\n\nThe following resources should be provided:\n2.1\nActual or simulated workplace\n2.2\nTools, materials and equipment needed to perform the\nrequired tasks\n2.3\nReferences and manuals\n2.4\nPPE\n2.5\nFirst Aid Kit\n3. Method of\nassessment\n\nCompetency in this unit may be assessed through:\n3.1\nDemonstration/Observation with Oral Questioning\n\n4. Context for\nassessment\n4.1 Competency may be assessed in actual workplace or at the\ndesignated TESDA Accredited Assessment Center.\n\n--- PDF PAGE 60 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 56\n\nUNIT OF COMPETENCY\n:\nPREPARE MASONRY TOOLS AND EQUIPMENT\n\nUNIT CODE\n\n:\nCON711316\n\nUNIT DESCRIPTOR\n\n:\nThis unit covers the knowledge, skills, and attitude\n\nrequired to productively prepare masonry tools and\nequipment.\n\nELEMENT\nPERFORMANCE\nCRITERIA\nItalicized terms are\nelaborated in the\nRange of Variables\nREQUIRED\nKNOWLEDGE\nREQUIRED\nSKILLS\n1. Select tools\nand\nequipment\n\n1.1 Personal protective\nequipment (PPE) is\nused in accordance\nwith Rule 1080 of\nOccupational Safety\nand Health Standards\n1.2 Instruction is secured\nfrom immediate\nsuperior\n1.3 Masonry tools and\nequipment are\nchecked based on job\nrequirements\n1.4 Work area is cleaned\naccording to safety\nand environmental\nregulations (e.g. PD\n1152 Section 6, 8 &\n42)\n1.5 Required output is\ncompleted as\nspecified by the\nimmediate supervisor\nbased on work\nschedule.\n\n1.1 DOLE Department\nOrder No. 13 series\n1998 Guidelines\nGoverning\nOccupational Safety\nand Health in the\nConstruction\nIndustry\n1.2 Green Building\nConcept relative to\nConstruction (5S)\n1.3 Communication\n1.4 Tools and\nequipment\npreparation\ninstructions\n1.5 Terminologies and\ntypes of tool