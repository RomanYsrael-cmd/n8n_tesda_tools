      "source_text": "GLOSSARY OF TERMS"
    },
    {
      "source_text": "1. DOWEL"
    },
    {
      "source_text": "A headless, cylindrical pin which, is sunk into corresponding holes"
    },
    {
      "source_text": "2. LINTEL Refers to the horizontal member over an opening such as door or window, usually carrying the load"
    },
    {
      "source_text": "3. MORTAR Refers to a mixture of cement, sand and water used for laying bricks or masonry units"
    },
    {
      "source_text": "4. REBAR Refers to the reinforcing bars that are embedded in building components such as concrete, masonry walls, columns, beams and other structural parts"
    },
    {
      "source_text": "4. SCAFFOLD Refers to a temporary or movable platform supported on the ground or suspended, used for working at considerable heights above the ground."
    },
    {
      "source_text": "5. FORMWORKS"
    },
    {
      "source_text": "6. CURING"
    },
    {
      "source_text": "7. 5S"
    },
    {
      "source_text": "8. 3R"
    },
    {
      "source_text": "Reduce"
    },
    {
      "source_text": "Reuse"
    },
    {
      "source_text": "Recycling A set of wood or steel forms in place to hold wet concrete until it hardens"
    },
    {
      "source_text": "Is defined as providing adequate moisture, temperature, and time to allow the concrete to achieve the desired properties for its intended use."
    },
    {
      "source_text": "The five in a 5S workplace organizational and housekeeping methodology refers to five steps – sort, set in order, shine, standardize and sustain."
    },
    {
      "source_text": "The principle of reducing waste, reusing and recycling resources and products"
    },
    {
      "source_text": "The waste management concept of reducing what is produced and what is consumed"
    },
    {
      "source_text": "The waste management concept of reusing items, or re- purposing them for a use different than what they are intended for"
    },
    {
      "source_text": "The waste management concept of transforming again into a raw material that can be shaped into a new item"
    },
