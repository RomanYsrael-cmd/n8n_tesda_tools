e\npractice\n•\n Practicing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 98 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 94\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n3. Perform basic\nmasonry works\n3.1 Perform\nexcavation and\nback filling /\ncompaction\n•\nSelect and use appropriate\nPPE to specific tasks\n•\nExplain excavation\nprocedures based on\nexisting conditions\n•\nExplain\nbackfilling/compaction\nprocedures based on\nexisting conditions\n•\nPerform safe work\npractices and respond to\n emergency situations\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n40 Hours\n3.2 Perform basic\nrebar\nfabrication\n\n•\nIdentify re-bar sizes\n•\nExplain cutting, bending and\ntagging procedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.3 Erect and\ndismantle working\nplatform\n•\nIdentify scaffolds\nparts/components\n•\nExplain scaffold erection and\ndismantle procedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 99 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 95\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n3.4 Fabricate and\nstrip basic\nformworks\n•\nIdentify formworks\nparts/components\n•\nExplain fabrication,\ninstallation and stripping\nprocedures\n•\nMeasuring work productivity\n•\nUtilizing most productive