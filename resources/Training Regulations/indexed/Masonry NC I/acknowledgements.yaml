    {
      "source_text": "-- PDF PAGE 55 --- MASONRY NC I Revision 01 Promulgated (10/29/2018) 51 EVIDENCE GUIDE"
    },
    {
      "source_text": "1. Critical aspects of competency Assessment requires that the candidate: 1.1 Selected and used appropriate processes, tools and equipment to carry out task 1.2 Identified functional and non-functional tools and equipment 1.3 Checked, lubricated and calibrated tools, equipment and instruments according to manufacturer’s specifications 1.4 Replaced defective tools, equipment and their accessories 1.5 Observed and applied safe handling of tools and equipment and safety work practices 1.6 Prepared and submitted inventory report, where applicable 1.7 Maintained workplace in accordance with OSHA regulations 1.8 Stored tools and equipment safely in appropriate locations and in accordance with company practices 2. Resource implications The following resources should be provided: 2.1 Workplace 2.2 Maintenance schedule 2.3 Maintenance materials, tools and equipment relevant to the proposed activity/task 3. Methods of assessment Competency in this unit may be assessed through: 3.1 Direct observation/Demonstration with Oral Questioning 3.2 Written Examination 4. Context of assessment 4.1 Competency may be assessed in actual workplace or at the designated TESDA Accredited Assessment Center."
