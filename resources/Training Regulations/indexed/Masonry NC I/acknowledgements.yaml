      "source_text": "REQUIRED SKILLS 1. Identify relevant occupational safety and health policies and procedures 1.1 Related occupational safety and health risks and hazards are recognized based on OSH work standards 1.2 OSH requirements/ regulations towards work are determined in accordance to workplace policies and procedures 1.3 Incident/ Emergency procedures relevant to workplace are identified based on relevant OSH work standards 1.1. Occupational safety and health risks and hazards 1.2. OSH work standards 1.3. Government approved Occupational Safety and Health Policies and regulations 1.4. Terms related to occupational safety and health 1.5. Workplace process and procedures 1.6. Standard emergency plan and procedures 1.1 Observation skills 1.2 Critical thinking skills 1.3 Communication skills"
    },
