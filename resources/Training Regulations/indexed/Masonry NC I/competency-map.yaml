  "source_text": "COMPETENCY MAP - CONSTRUCTION SECTOR\n(Civil Works)\n MASONRY NC I\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 112 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 108\n\nUtilize\nspecialize\nspecialized\ncommunication\nskill\nDevelop\nand lead\nteams\nPerform higher\norder thinking\nprocesses and\napply\ntechniques in\nthe workplace\nContribute\nto the\npractice of\nsocial\njustice in the\nworkplace\nManage\ninnovative\nwork\ninstructions\nManage and\nevaluate\nusage of\ninformation\nLead in\nimprovement of\nOccupational\nSafety and Health\nProgram, Policies\nand Procedures\nLead towards\nimprovement of\nenvironmental\nwork programs,\npolicies and\nprocedures\nSustain\nentrepreneurial\nskills\nManage and\nsustain\neffective\ncommunication\nstrategies\nManage\nand sustain\nhigh\nperforming\nteams\nEvaluate higher\norder thinking\nskills and adjust\nproblem solving\ntechniques\nAdvocate\nstrategic\nthinking for\nglobal\ncitizenship\nIncorporate\ninnovation\ninto work\nprocedures\nDevelop\nsystems in\nmanaging,\nand\nmaintaining\ninformation\nManage\nimplementation of\nOSH programs in\nthe workplace\nManage\nimplementation\nof\nenvironmental\nprogram in the\nworkplace\nDevelop and\nsustain a high-\nperforming\nenterprise\nPrepare\nconstruction\nmaterials and\ntools\n\nObserve\nprocedures,\nspecifications\nand manual of\ninstructions\n\nInterpret\ntechnical\ndrawings and\nplans\n\nPerform\nmensurations\nand\ncalculations\n\nMaintain tools\nand\nequipment\n\nCOMMON COMPETENCIES\n\nBASIC COMPETENCIES\n\n--- PDF PAGE 113 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 109\n\nPrepare masonry\nmaterials\n\nPerform masonry tools and\nequipment\n\nPerform basic masonry\nworks\n\nLay concrete hollow block for\nstructure\nPlaster wall surface\nPerform basic tile\nsetting\nPerform straight-to-finish floor\nconcreting\nRectify non-conforming\nconcrete and masonry\nsurfaces\nLay tiles on plain and curved\nsurfaces for walls, floors and\nother application\nRepair of tiles on plain\nand curved surfaces\nLayout reference lines\n\nFabricate, install and remove\nwooden formworks\n\nInstall wooden door jamb,\nwindow frame and panels\n\nInstall ceiling and wall frames\nand panels\n\nFabricate and install\nwooden stairs\n\nInstall wooden floor\nsupports and panels\n\nFabricate and install roofing\nsystem\n\nFabricate and install wooden\ncabinet\n\nInstall decorative moldings\n\nInstall ceiling frames\nand panels or\nacoustical ceiling\n\nInstall eaves or soffits\nframes and panels and\nvents assembly\nInstall partition wall and/or\ncladding frames and boards\n\nInstall laminate floors\n\nInstall parquet floors\n\nErect and dismantle\nsupport type scaffold\n\nHandle, segregate and\nstack scaffolding\ncomponents\nPrepare pipefitting materials,\ntools and equipment for spool\npipe connection\nInstall above ground piping\nsystem\n\nInstall overhead piping\nsystem\nInstall underground\npiping system\nLay tiles on plain and\ncurved surfaces for\nwalls, floors and other\napplication\nRepair of tiles on plain and\ncurved surfaces\n\nCORE COMPETENCIES\n\n--- PDF PAGE 114 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n110\n\nGLOSSARY OF TERMS\n\n1. DOWEL\n\nA headless, cylindrical pin which, is sunk into corresponding\nholes\n\n2. LINTEL\nRefers to the horizontal member over an opening such as door\nor window, usually carrying the load\n\n3. MORTAR\nRefers to a mixture of cement, sand and water used for laying\nbricks or masonry units\n\n4. REBAR\nRefers to the reinforcing bars that are embedded in building\ncomponents such as concrete, masonry walls, columns, beams\nand other structural parts\n\n4. SCAFFOLD\nRefers to a temporary or movable platform supported on the\nground or suspended, used for working at considerable heights\nabove the ground.\n\n5. FORMWORKS\n\n6. CURING\n\n7. 5S\n\n8. 3R\n\nReduce\n\n Reuse\n\n Recycling\nA set of wood or steel forms in place to hold wet concrete until it\nhardens\n\nIs defined as providing adequate moisture, temperature, and\ntime to allow the concrete to achieve the desired properties for\nits intended use.\n\nThe five in a 5S workplace organizational and housekeeping\nmethodology refers to five steps – sort, set in order, shine,\nstandardize and sustain.\n\nThe principle of reducing waste, reusing and recycling resources\nand products\n\nThe waste management concept of reducing what is produced\nand what is consumed\n\nThe waste management concept of reusing items, or re-\npurposing them for a use different than what they are intended\nfor\n\nThe waste management concept of transforming again into a\nraw material that can be shaped into a new item\n\n--- PDF PAGE 115 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n\n111\n\nTRAINING REGULATIONS (TR)\nDOCUMENT REVISION HISTORY\n\nQualification Title:\nMasonry NC I\nQualification Code: CONMAS118\n\nRevision\nNo.\nDocument\nTypes*\nQualification\nTitle\nTESDA Board\nResolution No./\nDate\nDeployment\n(TESDA\nCircular/\nImplementing\nGuidelines)\n00\nDocument Created\n\nMasonry NC I\n2006-09 /\n04/20/06\nN/A\n01\nDocument Amended\n\nMasonry NC I\n\n2018-31 /\n10/29/18\nNo. 011 series\nof 2019\n Legend: *Description Types\n- Document Created\n- Document Amended\n\n--- PDF PAGE 116 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n\n112\n\nACKNOWLEDGMENTS\n\nThe Technical Education and Skills Development Authority (TESDA) wishes to\nextend thanks and appreciation to the many representatives of business, industry, academe\nand government agencies who donated their time and expertise to the development and\nvalidation of these Training Regulations.\n\nTECHNICAL EXPERTS REVIEW PANEL\n\nMARCELO R. ABAD\nConsultant/ Industry Expert\nQuezon City\nRIZALDY E. ANGELES\nConstruction Manager - Industry Expert\nEEI Corporation\nQuezon City\nROLANDO C. BADILLA\nTechnical Specialist – Industry Expert\nJames Hardie Philippines, Inc.\nCabuyao, Laguna\nJOHN S. JUAN\nSTIDS\nConstruction Industry Authority of the\nPhils. (CIAP) - CMDF\nMakati City\nALIPIO M. PANGANIBAN\nDepartment Head - Industry Expert\nDatem Construction\nQuezon City\nANGELITO V. ZULUETA\nConsultant/ Industry Expert\nAVZ Management & Consulting Services\nSingalong, Manila\n\nJELUZ B. CORRO\nDepartment Head - Industry Expert\nDatem Construction\nQuezon City\n\nPHILIPPINE CONSTRUCTORS ASSOCIATION, INC. (PCA)\n\n--- PDF PAGE 117 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n\n113\nThe PARTICIPANTS in the Validation of this Training Regulations\n\nVISAYAS REGION\n\n• Daleon Construction\n• Holcim - Galing Mason\n• Makati Development Corporation (MDC)\n• Philippine Macro Development Corporation\n• School for Knowledge Industrial Labor Leadership Service (SKILLS)\n• TESDA Regional Office - Cebu\n• TESDA Provincial Office - Cebu\n• TESDA Regional Training Center - Cebu\n\nMINDANAO REGION\n\n• Allado Construction\n• Association of Construction and Informal Workers (ACIW) - Davao\n• Assumption College of Nabunturan\n• Carmelo Delo Cientos National Trade Schools, (CCNTS)\n• David M. Consunji, Inc. (DMCI) - Davao\n• Makati Development Corporation (MDC) - Davao\n• Tagum City Trade School (TCTS)\n• PTC-San Isidro Manpower Training Center (SIMTRAC)\n• RTC-Korea Phils. Vocational Training Center (KPCTC)\n\nLUZON REGION\n\n• Association of Construction and Informal Workers (ACIW)\n• Construction Industry Authority of the Philippines (CIAP) -CMDF\n• Construction Industry Workers Council (CIWC)\n• Construction Industry Workers Council (CIWC) -NACMADECO\n• Datem Construction\n• D. M. Consunji, Inc\n• EEI Corporation\n• James Hardie Philippines, Inc.\n• Makati Development Corporation\n• TESDA PTC - Tarlac\n• Saint Peregrine Institute\n• Vision Properties Development Corporation\n\n--- PDF PAGE 118 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n\n114\n\nThe MEMBERS of the TESDA Board and Secretariat\n\nThe MANAGEMENT and STAFF of the TESDA Secretariat\n• Qualifications and Standards Office (QSO)\n• T