        "source_title": "PREPARE MASONRY TOOLS AND EQUIPMENT",
        "source_text": "--- PDF PAGE 60 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         56 \n \nUNIT OF COMPETENCY \n:  \nPREPARE MASONRY TOOLS AND EQUIPMENT \n \nUNIT CODE  \n \n \n: \nCON711316 \n \nUNIT DESCRIPTOR \n \n:  \nThis unit covers the knowledge, skills, and attitude  \n \nrequired to productively prepare masonry tools and \nequipment. \n \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n1.  Select tools \nand \nequipment \n \n1.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health Standards \n1.2 Instruction is secured \nfrom immediate \nsuperior \n1.3 Masonry tools and \nequipment are \nchecked based on job \nrequirements \n1.4 Work area is cleaned \naccording to safety \nand environmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n1.5 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n \n1.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n1.2 Green Building \nConcept relative to \nConstruction (5S) \n1.3 Communication  \n1.4 Tools and \nequipment \npreparation \ninstructions  \n1.5 Terminologies and \ntypes of tools and \nequipment \n1.6 Factors affecting \nproductivity \n1.7 Productivity work \nmeasurements \n1.8 Ways of improving \nproductivity \n1.9 Adherence to work \nrequirements \n \n \n1.1 Listening skills \n1.2 Communication \nskills \n1.3 Organizing tools \nand equipment to \nbe used  \n1.4 Handling of tools \nand equipment \n1.5 Implementing 5S\n\n--- PDF PAGE 61 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         57 \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2.  Transfer tools \nand \nequipment  \n \n2.1 Personal protective \nequipment (PPE is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health \nStandards \n2.2 Tools and equipment \nare transferred based \non quantity and work \nschedule as specified \n2.3 Work area is cleaned \naccording to safety \nand environmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n2.4 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n \n \n2.1 DOLE Department \nOrder No. 13 \nseries 1998 \nGuidelines \nGoverning \nOccupational \nSafety and Health \nin the Construction \nIndustry \n5.1 Green Building \nConcept relative to \nConstruction (5S) \n2.2 Transferring \nprocedures and \ninstructions  \n2.3 Safe handling of \ntools and \nequipment \n2.4 Terminologies and \ntypes of tools and \nequipment \n2.5 Factors affecting \nproductivity \n2.6 Productivity work \nmeasurements \n2.7 Ways of improving \nproductivity \n2.8 Adherence to work \nrequirements \n \n2.1 Listening skills \n2.2 Communication \nskills \n2.3 Handling of tools \nand equipment  \n2.4 Applying productive \nmethods and \ntechniques in \ntransferring of tools \nand equipment \n2.5 Implementing 5S\n\n--- PDF PAGE 62 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         58 \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Personal  \n    Protective   \n    Equipment (PPE) \nInclude: \n1.1 Hard hat \n1.2  Safety shoes/ rubber boots \n1.3  Proper uniform \n1.4  Gloves (cotton) \n1.1  Dust mask  \n1.2 Safety goggles \n1.3 Reflectorized vest \n \n2 Masonry tools    \n     and equipment  \n  \n \n \n \n \nMay include: \nTools \n2.1 Trowel \n2.2 Float \n2.3 Measuring Steel Tape  \n2.4 Block Cutter \n2.5 Shovel \n2.6 Hammer \n2.7 “Haka” (wire twister) \n \n \nEquipment \n2.8 One-Bagger Mixer \n2.9 Wheel Barrow\n\n--- PDF PAGE 63 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         59 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof Competency \nAssessment requires evidence that the candidate: \n1.1 Selected tools and equipment based on job requirements \n1.2 Transferred tools and equipment based on quantity and \nwork schedule as specified \n1.3 Observed and complied with safety and environmental \nregulations  \n1.4 Communicated with others to ensure effective work \noperation \n1.5 Observed and complied with the productivity \nrequirements \n1.6 Complied with attitudinal work requirements \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1   Actual or simulated workplace \n2.2   Tools, materials and equipment needed to perform the   \n  required tasks \n2.3   References and manuals \n2.4   PPE \n2.5   First Aid Kit \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1   Demonstration/Observation with Oral Questioning \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center\n",
