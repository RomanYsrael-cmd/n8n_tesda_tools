        "source_text": "--- PDF PAGE 56 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         52 \nCORE COMPETENCIES \n \nUNIT OF COMPETENCY \n:      PREPARE MASONRY MATERIALS \n \nUNIT CODE  \n \n \n:      CON711315 \n \nUNIT DESCRIPTOR \n \n:      This unit covers the knowledge, skills, and attitudes    \n        to productively prepare masonry materials. \n \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1. Gather \nmaterials to \nbe hauled \n \n1.1 Personal \nProtective \nEquipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health \nStandards \n1.2 Instruction is \nsecured from \nimmediate superior  \n1.3 Quantity and quality \nof masonry \nmaterials to be \nhauled is determined  \nin accordance with \ninstruction of \nimmediate superior  \n1.4 Work area is \ncleaned according to \nsafety and \nenvironmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n1.5 Required output is \ncompleted as \nspecified by the \nimmediate supervisor \nbased on work \nschedule. \n1.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n1.2 Green Building \nConcept relative to \nConstruction (3R, \n5S) \n1.3 Material preparation \ninstructions  \n1.4 Basic linear and \nvolume \nmeasurement  \n1.5 Basic mathematical \noperations    \n1.6 Safe handling of \nmaterials \n1.7 Terminologies and \ntypes of concrete \nblocks, cement and \naggregates \n1.8 Terminologies and \ntypes of masonry \nanchors, ties and \nreinforcements \n1.9 Distinction of \ndefective and non-\ndefective materials \n1.10 \nFactors affecting \nproductivity \n1.11 \nProductivity work \nmeasurements \n1.12 \nWays of \nimproving \nproductivity \n1.13 \nAdherence to \nwork requirements \n \n1.1 Listening skills \n1.2 Communication \nskills \n1.3 Organizing \nmaterials to be \nused  \n1.4 Applying basic \nmathematical \noperations  \n1.5 Applying basic \nlinear and volume \nmeasurement  \n1.6 Applying \nproductive \nmethods and \ntechniques in \ngathering of \nmaterials  \n1.7 Handling of \nmaterials  \n1.8 Implementing 3R \nand 5S\n\n--- PDF PAGE 57 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         53 \nELEMENT \nPERFORMANCE \nCRITERIA  \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n2.  Haul/ \ntransport \nmaterials  \n \n2.1 Personal Protective \nEquipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational \nSafety and Health \nStandards \n2.2 Serviceability of \nappropriate hauling/ \ntransporting tools \nand equipment are \nchecked as specified \nby the immediate \nsuperior  \n2.3 Materials are \nhauled based on \nquality, quantity \nand work schedule  \n2.4 Work area is \ncleaned according \nto safety and \nenvironmental \nregulations (e.g. \nPD 1152 Section 6, \n8 & 42) \n2.5 Required output is \ncompleted as \nspecified by the \nimmediate \nsupervisor based \non work schedule. \n2.1 DOLE Department Order \nNo. 13 series 1998 \nGuidelines Governing \nOccupational Safety and \nHealth in the Construction \nIndustry \n2.2 Green Building Concept \nrelative to Construction \n(3R, 5S) \n2.3 Hauling and transporting \nprocedures  \n2.4 Safe handling of materials \n2.5 Terminologies and types \nof concrete hollow blocks,  \ncement and aggregates \nand others \n2.6 Distinction of defective \nand non-defective \nmaterials \n2.7 Factors affecting \nproductivity \n2.8 Productivity work \nmeasurements \n2.9 Ways of improving \nproductivity \n2.10 \nAdherence to work \nrequirements \n2.1 Listening skills \n2.2 Communication \nskills \n2.3 Organizing \nmaterials to be \nhauled/ \ntransported \n2.4 Handling and \nusing of hauling \ntools and \nequipment \n2.5 Applying \nproductive \nmethods and \ntechniques in \nhauling / \ntransporting of \nmaterials \n2.6 Implementing 3R \nand 5S       \n \n \n3. Stockpile \nhauled \nmaterials \n3.1 Personal Protective \nEquipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational \nSafety and Health \nStandards \n3.2 Identified location is \nprepared in \naccordance with \ninstructions \n3.3 Materials are \nsorted according to \nclassification \n3.4 Work area is \ncleaned according to \nsafety and \nenvironmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n3.1 DOLE Department Order \nNo. 13 series 1998 \nGuidelines Governing \nOccupational Safety and \nHealth in the Construction \nIndustry \n3.2 Green Building Concept \nrelative to Construction \n(3R, 5S) \n3.3 Safe handling of materials \n3.4 Terminology and types of \nconcrete hollow blocks,   \ncement and aggregates \nand others \n3.5 Distinction of defective \nand non-defective \nmaterials \n3.6 Factors affecting \nproductivity \n3.7 Productivity work \nmeasurements \n3.1 Listening skills \n3.2 Communication \nskills \n3.3 Handling of \nmaterials \n3.4 Applying \nproductive \nmethods and \ntechniques in \nstockpiling  \nof materials \n3.5 Implementing 3R \nand 5S\n\n--- PDF PAGE 58 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         54 \n3.5 Required output is \ncompleted as \nspecified by the \nimmediate \nsupervisor based \non work schedule. \n3.8 Ways of improving \nproductivity \n3.9 Adherence to work \nrequirements \n \n \n \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1.  Personal  \n      Protective  \n      Equipment  \n      (PPE) \nInclude: \n1.1 Hard hat \n1.2 Safety shoes/ rubber boots \n1.3 Proper uniform/clothing \n1.4 Gloves (cotton) \n1.5 Dust mask  \n1.6 Safety goggles \n1.7 Reflectorized vest \n \n2.  Masonry  \nMaterials  \n \n \n \n \nMay include: \n2.1 Concrete hollow blocks  \n2.2 Cement  \n2.3 Sand \n2.4 Water \n2.5 Reinforcing bars / GI wires \n2.6 Concrete nails/ Common wire nails \n2.7 Lumber \n2.8 Baluster \n2.9 Other types of block \n \n3.   Hauling / \ntransporting tools \nand equipment  \n \n \nMay include:  \n3.1 Skid loader  \n3.2 Dumper \n3.3 Material hoist \n3.4 Pallet  \n3.5 Wheelbarrow \n3.6 Buggy\n\n--- PDF PAGE 59 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         55 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \n \nAssessment requires evidence that the candidate: \n1.1 Gathered materials to be hauled \n1.2 Hauled/ transported materials \n1.3 Stockpiled hauled materials  \n1.4 Observed and complied with safety and environmental \nregulations  \n1.5 Communicated with others to ensure effective work \noperation  \n1.6 Observed and complied with the productivity requirements \n1.7 Complied with attitudinal work requirements \n \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 \nActual or simulated workplace \n2.2 \nTools, materials and equipment needed to perform the \nrequired tasks \n2.3 \nReferences and manuals \n2.4 \nPPE \n2.5 \nFirst Aid Kit \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration/Observation with Oral Questioning \n \n4. Context for \nassessment \n4.1 Competency may be assessed in actual workplace or at the \ndesignated TESDA Accredited Assessment Center.\n",
