 \nworkplace \n2.2. Responding with \nappropriate \nemotions in the \nworkplace \n2.3Identifying possible \nconsequences of \ninappropriate \nemotional \nresponses in a \nsocial and work-\nrelated context\n\n--- PDF PAGE 19 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         15 \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the Range \nof Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED \nSKILLS \n3. Describe \noneself as a \nlearner \n3.1 Factors and strategies \nthat assist learning \nare identified and \ndescribed \n3.2 Preferred learning \nstyles according to \nVAK Learning Style \nModel and Kolb’s \nTheory of Learning \nStyles are identified \n3.3 Range of learning \nstrategies \nappropriate to \nspecific tasks and \ndescribe work \npractices that assist \ntheir learning are \nidentified and chosen \n3.1 Kolb’s Theory of \nLearning Styles \n(Converger, \nDiverger, \nAssimilator, \nAccommodator) \n3.2VAK Learning Style \nModel (Visual, \nAuditory, \nKinesthetic) \n3.3 Range of learning \nstrategies \nappropriate to \nspecific tasks and \ndescribe work \npractices that assist \ntheir learning \n \n3.1 Identifying factors \nand strategies \nthat assist \nlearning \n3.2 Applying learning \nstyles to positively \ninfluence \nschool/work \nperformance \n3.3Using appropriate \nlearning \nstrategies to \nimprove study \nhabits and \nlearning\n\n--- PDF PAGE 20 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         16 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Personal goals \nMay include:  \n1.1 \nGraduate from Tech-Voc training \n1.2 \nBuy a car \n1.3 \nTravel around the world \n2. Career goals \nMay include but not limited to:  \n2.1 \nGraduate from Tech-Voc training \n2.2 \nGraduate from college \n2.3 \nBuy a car \n2.4 \nRetire at 50 years old \n3. Emotions \nPositive emotions may include:  \n3.1 \nJoy \n3.2 \nGratitude \n3.3 \nHope \n3.4 \nSerenity \n \nNegative emotions may include:  \n3.5 \nAnger \n3.6 \nFear \n3.7 \nDisgust \n3.8 \nSadness \n4. Social and work-\nrelated contexts \nMay include professional behavior such as:  \n4.1 Committed to developing and improving their skills \n4.2  Professionals get the job done \n4.3 They keep their word and deliver what they promise. \n \nMay include non-professional behavior such as–  \n4.4 They engage in office politics \n4.5  Bluffing and misrepresenting their skills \n4.6  Blaming a colleague \n5. Learning styles \nMay include:  \n5.1 Visual \n5.2 Auditory \n5.3 Kinesthetic \n5.4 Converger \n5.5 Diverger \n5.6 Assimilator \n5.7 Accommodator  \n6. Learning strategies \nMay include:  \n6.1 \nExplain and describe ideas with many details \n6.2 \n Switch between ideas while studying \n6.3 \nUse specific examples to understand abstract ideas\n\n--- PDF PAGE 21 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         17 \n \n \nEVIDENCE GUIDE \n1. Critical aspects of \nCompetency  \nAssessment requires evidence that the candidate: \n1.1 \nDeveloped SMART personal and career goals \n1.2 \nApplied goal setting principles \n1.3 \nIdentified sensitively the positive and negative emotions \nin the workplace \n1.4 \nResponded with appropriate emotions in the workplace \n1.5 \nIdentified possible consequences of inappropriate \nemotional responses in a social and work-related \ncontext \n1.6 \nApplied learning styles to positively influence \nschool/work performance \n1.7 \nDeveloped reflective practice through realization of  \nlimitations,  likes/ dislikes;  through showing of self-\nconfidence   \n2. Resource \nImplications \nThe following resources for should be provided: \n2.1 \n   Access to workplace and resources \n \n3. Methods of \nAssessment \nCompetency in this unit may be assessed through: \n3.1 \nDemonstration or simulation with oral questioning (ex. \nhow to recognize emotions) \n3.2 \nCase problems involving workplace diversity issues \n3.3 \nThird-party report \n4. Context for \nAssessment \n3.1 \nCompetency assessment may occur in workplace or \nany appropriately simulated environment\n",
