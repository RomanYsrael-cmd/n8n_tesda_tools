        "source_title": "PERFORM BASIC MASONRY WORKS",
        "source_text": "--- PDF PAGE 64 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         60 \n \nUNIT OF COMPETENCY \n:  \nPERFORM BASIC MASONRY WORKS  \n \nUNIT CODE  \n \n \n: \nCON711317 \n \nUNIT DESCRIPTOR                  :  \n This unit deals with the outcomes required to \nproductively perform basic masonry work under \nsupervision by a higher-level mason. It covers the \nskills required to perform basic re-bar fabrication, \nerecting and dismantling scaffolds (1.8m and below); \nperform formworks fabrication and stripping; \nexcavating, backfilling and compacting. \n \nELEMENT \nPERFORMANCE \nCRITERIA \n Italicized terms \nare elaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1.   Perform \nexcavation \nand backfilling \n/ compaction \n1.1 Personal \nprotective \nequipment (PPE) \nis used in \naccordance with \nRule 1080 of \nOccupational \nSafety and Health \nStandards \n1.2 Excavation work \nis accomplished \nbased on job \nspecifications  \n1.3 Back filling and \ncompaction are \naccomplished \nbased on job \nspecifications \n1.4 Work area is \ncleaned according \nto safety and \nenvironmental \nregulations (e.g. \nPD 1152 Section \n6, 8 & 42) \n1.5 Required output \nis completed as \nspecified by the \nimmediate \nsupervisor based \non work schedule. \n \n \n \n1.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n1.2 Green Building \nConcept relative to \nConstruction (3R, \n5S) \n1.3 Basic mathematical \noperations    \n1.4 Excavation and \nback filling \nprocedures \n1.5 Safe handling of \nmaterials, tools and \nequipment \n1.6 Safety signs and \nsymbols \n1.7 Factors affecting \nproductivity \n1.8 Productivity work \nmeasurements \n1.9 Ways of improving \nproductivity \n1.10 Adherence to work \nrequirements \n \n1.1 Working safely \n1.2 Organizing \nmaterials to be \nused  \n1.3 Handling and use \nof tools and \nequipment \n1.4 Communicating \neffectively \n1.5  Using PPE \n1.6 Applying basic \nmathematical \noperations \n1.7 Applying productive \nmethods and \ntechniques in \nexcavating and \nbackfilling/ \ncompacting  \n1.8 Implementing 3R \nand 5S\n\n--- PDF PAGE 65 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         61 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Perform basic \nrebar \nfabrication  \n \n2.1 Personal \nprotective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational \nSafety and Health \nStandards \n2.2 Reinforcing steel \nbars (RSB) are \nidentified, \nmeasured, cut and \nbent according to \ninstructions \n2.3 Cut and bent \nreinforcing steel \nbars (RSB) are \nbundled according \nto shape and size  \n2.4 Fabricated \nreinforcing steel bar \n(RSB) is tagged \naccording to cutting \nlist \n2.5 Work area is \ncleaned according \nto safety and \nenvironmental \nregulations (e.g. \nPD 1152 Section 6, \n8 & 42) \n2.6 Required output is \ncompleted as \nspecified by the \nimmediate \nsupervisor based \non work schedule. \n \n2.1 DOLE Department \nOrder No. 13 \nseries 1998 \nGuidelines \nGoverning \nOccupational \nSafety and Health \nin the Construction \nIndustry \n2.2 Green Building \nConcept relative to \nConstruction (3R, \n5S) \n2.3 Basic mathematics \n2.4 Interpret and follow \ninstructions  \n2.5 Safe handling of \nmaterials, tools \nand equipment \n2.6 Safety signs and \nsymbols \n2.7 Factors affecting \nproductivity \n2.8 Productivity work \nmeasurements \n2.9 Ways of improving \nproductivity \n2.10 Adherence to work \nrequirements \n \n2.1 Working safely \n2.2 Organizing \nmaterials to be \nused  \n2.3 Handling and use \nof tools and \nequipment \n2.4 Communicating \neffectively \n2.5 Applying basic \nmathematics \n2.6 Using PPE \n2.7 Applying productive \nmethods and \ntechniques in rebar \nfabrication \n2.8 Implementing 3R \nand 5S\n\n--- PDF PAGE 66 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         62 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n3. Erect and \ndismantle \nworking \nplatform \n3.1 Personal \nprotective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational \nSafety and Health \nStandards \n3.2 Components of \nworking platform \nare checked based \non job \nrequirements \n3.2 Working platform is \nerected in \naccordance with \nsafety practices  \n3.3 Working platform is \ndismantled in \naccordance with \nsafety practices \n3.3 Components are \ninventoried and \nreturned to \nstockpile area \nbased on company \nrules and \nprocedures \n3.4 Work area is \ncleaned according \nto safety and \nenvironmental \nregulations (e.g. \nPD 1152 Section 6, \n8 & 42) \n3.5 Required output is \ncompleted as \nspecified by the \nimmediate \nsupervisor based \non work schedule. \n \n \n3.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n3.2 Green Building \nConcept relative to \nConstruction (3R, \n5S) \n3.3 Basic linear \nmeasurement    \n3.4 Safe handling of \nmaterials, tools and \nequipment \n3.5 Safety signs and \nsymbols \n3.6 Rules on safe \nerection, use and \ndismantling of \nscaffolds (1.8 m \nand below) \n3.7 Scaffoldings \nconstruction \nelements and \nmaterials \n3.8 Factors affecting \nproductivity \n3.9 Productivity work \nmeasurements \n3.10 Ways of improving \nproductivity \n3.11 Adherence to work \nrequirements \n \n3.1 Working safely \n3.2 Organizing \nmaterials to be \nused  \n3.3 Handling and use \nof tools and \nequipment \n3.4 Communicating \neffectively \n(Interpreting and \nfollow instructions) \n3.5 Applying basic \nmathematics \n3.6 Using PPE \n3.7 Applying productive \nmethods and \ntechniques in \nerecting and \ndismantling of \nscaffold  \n3.8 Implementing 3R \nand 5S\n\n--- PDF PAGE 67 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         63 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n4.  Fabricate and \nstrip basic \nformworks  \n4.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational \nSafety and Health \nStandards \n4.2 Formworks \nmaterials are \nidentified and cut \nas required \n4.3 Fabrication of \nmaterials into basic \nforms is performed \nfollowing \ninstructions \n4.4 Formworks are \nstripped following \nestablished \nprocedures \n3.6 Work area is \ncleaned according \nto safety and \nenvironmental \nregulations (e.g. \nPD 1152 Section 6, \n8 & 42) \n5.1  \n4.5  Required output is \ncompleted as \nspecified by the \nimmediate \nsupervisor based \non work schedule. \n \n \n4.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n4.2 Green Building \nConcept relative to \nConstruction (3R, \n5S) \n4.3 Basic linear \nmeasurement and \nbasic mathematics \n4.4 Fabrication and \ndismantling \nprocedures \n4.5  Safe handling of \nmaterials, tools and \nequipment \n4.6 Safety signs and \nsymbols \n4.7 Basic stripping \nschedule \n4.8 Factors affecting \nproductivity \n4.9 Productivity work \nmeasurements \n4.10 Ways of improving \nproductivity \n4.11 Adherence to work \nrequirements \n \n4.1 Working safely \n4.2 Organizing \nmaterials to be \nused  \n4.3 Handling and use of \ntools and \nequipment \n4.4 Communicating \neffectively \n4.5 Applying basic \nmathematics \n4.6 Using PPE \n4.7 Applying productive \nmethods and \ntechniques in \nfabrication, \ninstallation and \ndismantling of \nformworks \n4.8 Implementing 3R \nand 5S\n\n--- PDF PAGE 68 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         64 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n5.  Mix mortar \n5.1 Personal \nprotective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational \nSafety and Health \nStandards \n5.2 Mixing tools and \nequipment to be \nused are selected \nand checked \naccording to job \nrequirements \n5.3 Mortar is mixed \naccording to the \nrequirements  \n5.4 Mixed mortar is \nsupplied to the \nappropriate \npersonnel based \non job \nrequirements \n5.5 Work area is \ncleaned according \nto safety and \nenvironmental \nregulations (e.g. \nPD 1152 Section 6, \n8 & 42) \n5.6 Required output is \ncompleted as \nspecified by the \nimmediate \nsupervisor based \non work schedule. \n \n5.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n5.2 Green Building \nConcept relative to \nConstruction (3R, \n5S) \n5.2 Volume \nmeasurement  \n5.3 Basic mathematical \noperations   \n5.4 Safe handling of \nmaterials, tools and \nequipment \n5.5 Terminologies and \ntypes of cement \nand sand \n5.6 Distinction of \nconforming and \nnon-conforming \nmaterials  \n5.7 Types and uses of \nmortar materials  \n5.8 Basic mortar \nproportion \n5.9 Factors affecting \nproductivity \n5.10 Productivity work \nmeasurements \n5.11 Ways of improving \nproductivity \n5.12 Adherence to work \nrequirements \n \n5.1 Listening skills \n5.2 Communication \nskills \n5.3 Organizing \nmaterials to be \nused  \n5.4 Applying basic \nmathematical \noperations  \n5.5 Applying volume \nmeasurement  \n5.6 Handling and use \nof tools and \nequipment \n5.7 Applying productive \nmethods and \ntechniques in \nmixing of mortar  \n5.1 Implementing 3R \nand 5S\n\n--- PDF PAGE 69 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         65 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n6.  Mix concrete \n6.1 Personal \nprotective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational \nSafety and Health \nStandards \n6.2 Mixing tools and \nequipment to be \nused are checked \naccording to job \nrequirements \n6.3 Concrete is mixed \naccording to the \ninstructions  \n6.4 Mixed concrete is \nsupplied to the \nappropriate \npersonnel based on \njob requirements  \n6.5 Work area is \ncleaned according \nto safety and \nenvironmental \nregulations (e.g. \nPD 1152 Section 6, \n8 & 42) \n6.6 Required output is \ncompleted as \nspecified by the \nimmediate \nsupervisor based \non work schedule. \n \n \n6.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n6.2 Green Building \nConcept relative to \nConstruction (3R, \n5S) \n6.3 Volume \nmeasurement   \n6.4 Ratio and \nproportion \n6.5 Safe handling of \nmaterials, tools and \nequipment \n6.6 Terminologies and \ntypes of   cement \nand aggregates \n6.7 materials \n6.8 Distinction of \nconforming and \nnon-conforming  \nmaterials  \n6.9 Types and uses of \nconcrete materials  \n6.10 Basic concrete \nproportion \n6.11 Factors affecting \nproductivity \n6.12 Productivity work \nmeasurements \n6.13 Ways of improving \nproductivity \n6.14 Adherence to work \nrequirements \n \n6.1 Listening skills \n6.2 Communication \nskills \n6.3 Organizing \nmaterials to be \nused  \n6.4 Applying basic \nmathematical \noperations  \n6.5 Applying volume \nmeasurement  \n6.6 Sorting of \nconforming and \nnon-conforming \nmaterials. \n6.7 Handling and use \nof tools and \nequipment \n6.8 Applying productive \nmethods and \ntechniques in \nmixing of concrete \n6.9 Implementing 3R \nand 5S\n\n--- PDF PAGE 70 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         66 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n7.   Perform \nconcreting \nwork  \n7.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health \nStandards \n7.2 Gravel bed is placed \nand compacted \nbased on job \nrequirements  \n7.3 Fresh concrete is \nplaced on wall \nfootings, columns \nand lintel beams \nbased on job \nrequirements \n7.4 Consolidation of \nfresh concrete by \nvibration is \nperformed (use of \nvibrator, optional) \n7.5 Curing of concrete is \nperformed based on \njob requirements \n7.6 Work area is \ncleaned according to \nsafety and \nenvironmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n7.7 Required output is \ncompleted as \nspecified by the \nimmediate \nsupervisor based on \nwork schedule. \n \n \n7.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction Industry \n7.2 Green Building \nConcept relative to \nConstruction (3R, 5S) \n7.3 Safety signs and \nsymbols \n7.4 Concreting work \nprocedures \n7.5 Safe handling of \nmaterials, tools and \nequipment \n7.6 Factors affecting \nproductivity \n7.7 Productivity work \nmeasurements \n7.8 Ways of improving \nproductivity \n7.9 Adherence to work \nrequirements \n \n7.1 Working safely \n7.2 Organizing \nmaterials to be \nused  \n7.3 Handling and use \nof tools and \nequipment \n7.4 Communicating \neffectively \n7.5 Applying basic \nmathematics \n7.6 Using PPE \n7.7 Applying productive \nmethods and \ntechniques in \nconcreting \nprocesses \n7.8 Implementing 3R \nand 5S\n\n--- PDF PAGE 71 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         67 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n8.   Perform \nbasic block \nlaying  \n8.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health \nStandards \n8.2 Starter blocks are \npre- laid on the \nguide line according \nto job requirements \n8.3 Reinforcing steel \nbars are installed \naccording to job \nrequirements \n8.4 Mortar is spread on \nthe base of blocks \naccording to job \nrequirements \n8.5 Blocks are \npositioned / laid \naccording to job \nrequirements \n8.6 Periodic checking of \nplumbness is done \nduring block laying \n8.7 Work area is \ncleaned according to \nsafety and \nenvironmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n8.8 Required output is \ncompleted as \nspecified by the \nimmediate \nsupervisor based on \nwork schedule. \n \n8.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction Industry \n5.3 Green Building \nConcept relative to \nConstruction (3R, \n5S) \n8.2 Safety signs and \nsymbols \n8.3 Block laying \nprocedures \n8.4 Safe handling of \nmaterials, tools and \nequipment \n8.5 Factors affecting \nproductivity \n8.6 Productivity work \nmeasurements \n8.7 Ways of improving \nproductivity \n8.8 Adherence to work \nrequirements \n \n \n8.1 Organizing \nmaterials to be \nused  \n8.2 Handling and use \nof tools and \nequipment \n8.3 Communicating \neffectively \n8.4 Applying productive \nmethods and \ntechniques in laying \nof blocks \n8.5 Implementing 3R \nand 5S\n\n--- PDF PAGE 72 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         68 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n9. Perform \nhousekeeping \n9.1 Personal protective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOccupational Safety \nand Health \nStandards. \n9.2  Excess/un-used \nmaterials are \nrecovered and \nstockpiled according \nto company rules \nand procedures \n9.3 Work area is \ncleaned according to \nsafety and \nenvironmental \nregulations (e.g. PD \n1152 Section 6, 8 & \n42) \n9.4 Tools and other \nmaterials are       \ncleaned after use. \n9.5 Required output is \ncompleted as \nspecified by the \nimmediate \nsupervisor based on \nwork schedule. \n9.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n9.2 Green Building \nConcept relative to \nConstruction (3R, \n5S \n9.3 Safe handling and \nstandard \nspecification of \nmaterials and tools  \n9.4 Safety signs and \nsymbols \n9.5 Adherence to work \nrequirements \n \n9.1 Working safely \n9.2 Organizing \nmaterials to be \nstored \n9.3 Handling and use \nof materials and \ntools  \n9.4 Communicating \neffectively \n9.5 Using PPE \n9.6 Implementing 3R \nand 5S\n\n--- PDF PAGE 73 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         69 \nRANGE OF VARIABLES \n \nVARIABLE \nRANGE \n1. Personal  \nProtective   \nEquipment \n(PPE) \nInclude: \n1.1 Hard hat \n1.2 Safety shoes/ rubber boots \n1.3 Proper uniform/clothing \n1.4 Gloves (cotton) \n1.5  Dust mask  \n1.6 Safety goggles \n1.7 Reflectorized vest \n \n2. Job \nspecifications \nMay include: \n2.1 Established lay-out \n2.2 Soil condition \n2.3 Required depth and width \n \n3. Shape and size \nMay include: \n3.1 Bar diameter (10, 12, 16 mm) \n3.2 Grade of re-bar (40) \n3.3 Type of bend \n \n4. Components of \nworking platform \n \nMay include: \n4.1 Steel \n4.1.1 A/H frame \n4.1.2 Cross brace \n4.1.3 Base jack \n4.1.4  Walking board \n4.1.5  Toe board \n4.1.6  Railing \n4.1.7  Tubular pipe  \n4.1.8  Arm lock  \n4.2  Wood \n4.2.1  2 x 4 rough lumber \n4.2.2  2 x 2 rough lumber \n4.2.3  Wood planks \n4.2.4  Nails \n \n5. Safety practices \nMay include: \n5.1    Standard PPE \n5.2 Check the condition of the working platform \n5.3 Provision of appropriate safety signs  \n5.4 Sufficient lighting for the workplace \n5.5 Good housekeeping\n\n--- PDF PAGE 74 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         70 \nVARIABLE \nRANGE \n6. Formworks \nmaterials \nMay include: \n6.1 Plywood  \n6.2 Rough lumber \n6.3 Nails \n6.4 Tie wire  \n6.5 Form oil  \n6.6 Tie rod / form tie  \n \n7. Mixing tools and \nequipment \n \nMay include: \n7.1 One bagger mixer \n7.1.1 Mortar Mixer \n7.1.2 Concrete Mixer \n7.2  Mixing board  \n7.3  Shovel \n7.4  Pails \n7.5  Screen wire (2-3mm mesh) \n7.6  Mixing box \n7.7  Bucket  \n \n8.  Appropriate \npersonnel \nMay include: \n8.1 Plasterer \n8.2  Block layer \n8.3 Tile Setter\n\n--- PDF PAGE 75 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         71 \nEVIDENCE GUIDE \n \n1. Critical aspects \nof competency \n \nAssessment requires evidence that the candidate: \n1.1 \nPerformed excavation and backfilling/compaction \nbased on job specifications \n1.2 \nPerformed basic rebar fabrication  \n1.3 \nErected and dismantled working platform in accordance \nwith safety practices \n1.4 \nFabricated and stripped basic formworks following \nestablished procedures \n1.5 \nMixed mortar according to the requirements  \n1.6 \nMixed concrete according to the instructions  \n1.7 \nPerformed concreting work based on job requirements \n1.8 \nPerformed basic block laying according to job \nrequirements \n1.9 \nPerformed housekeeping  \n1.10 Observed and complied with safety and environmental \nregulations  \n1.11 Communicated with others to ensure effective work \noperation \n1.12 Observed and complied with the productivity \nrequirements \n1.13 Complied with attitudinal work requirements \n \n2. Resource \nimplications \n \nThe following resources should be provided: \n2.1 Actual or simulated workplace \n2.2 Tools, materials and equipment needed to perform the \nrequired tasks \n2.3 References and manuals \n2.4 PPE \n2.5 First Aid Kit \n3. Method of \nassessment \n \nCompetency in this unit may be assessed through: \n3.1 Demonstration/Observation with Oral Questioning \n \n4. Context for \nassessment \n \n4.1   Competency may be assessed in actual workplace or at \nthe designated TESDA Accredited Assessment Center.\n",
