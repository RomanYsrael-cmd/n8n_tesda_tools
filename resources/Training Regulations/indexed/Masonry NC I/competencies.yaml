          "source_text": "REQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n1.   Perform \nexcavation \nand backfilling \n/ compaction \n1.1 Personal \nprotective \nequipment (PPE) \nis used in \naccordance with \nRule 1080 of \nOccupational \nSafety and Health \nStandards \n1.2 Excavation work \nis accomplished \nbased on job \nspecifications  \n1.3 Back filling and \ncompaction are \naccomplished \nbased on job \nspecifications \n1.4 Work area is \ncleaned according \nto safety and \nenvironmental \nregulations (e.g. \nPD 1152 Section \n6, 8 & 42) \n1.5 Required output \nis completed as \nspecified by the \nimmediate \nsupervisor based \non work schedule. \n \n \n \n1.1 DOLE Department \nOrder No. 13 series \n1998 Guidelines \nGoverning \nOccupational Safety \nand Health in the \nConstruction \nIndustry \n1.2 Green Building \nConcept relative to \nConstruction (3R, \n5S) \n1.3 Basic mathematical \noperations    \n1.4 Excavation and \nback filling \nprocedures \n1.5 Safe handling of \nmaterials, tools and \nequipment \n1.6 Safety signs and \nsymbols \n1.7 Factors affecting \nproductivity \n1.8 Productivity work \nmeasurements \n1.9 Ways of improving \nproductivity \n1.10 Adherence to work \nrequirements \n \n1.1 Working safely \n1.2 Organizing \nmaterials to be \nused  \n1.3 Handling and use \nof tools and \nequipment \n1.4 Communicating \neffectively \n1.5  Using PPE \n1.6 Applying basic \nmathematical \noperations \n1.7 Applying productive \nmethods and \ntechniques in \nexcavating and \nbackfilling/ \ncompacting  \n1.8 Implementing 3R \nand 5S\n\n--- PDF PAGE 65 ---\nMASONRY NC I   Revision 01                                                  Promulgated  (10/29/2018)                         61 \n \nELEMENT \nPERFORMANCE \nCRITERIA \nItalicized terms are \nelaborated in the \nRange of Variables \nREQUIRED \nKNOWLEDGE \nREQUIRED SKILLS \n2. Perform basic \nrebar \nfabrication  \n \n2.1 Personal \nprotective \nequipment (PPE) is \nused in accordance \nwith Rule 1080 of \nOc