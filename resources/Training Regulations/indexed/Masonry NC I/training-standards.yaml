\n1.2 Haul/transport\nmaterials\n\n• Identify hauling equipment\nfor specific material\n• Enumerate and explain\nthe basic methods and\nprocesses in\nhauling/transporting\nmaterials\n• Select and use\nappropriate PPE to\nspecific tasks\n• Identify and describe safe\nwork practices and first aid\nregulations\n• Practicing 3R and 5S\n• Perform safe work\npractices and respond to\nemergency situations.\n• Measuring work productivity\n• Utilizing most productive\npractice\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 97 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 93\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n1.3 Stockpile hauled\nmaterials\n\n• Identify location of\nstockpiling for specific\nmaterials\n• Enumerate and explain the\nbasic methods and\nprocesses in stockpiling\n• Select and use appropriate\nPPE to specific tasks\n• Identify and describe safe\nwork practices and first aid\nregulations\n• Perform safe work practices\nand respond to emergency\nsituations\n• Practicing 3R and 5S\n• Measuring work productivity\n• Utilizing most productive\npractice\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n2. Prepare\nmasonry tools\nand equipment\n2.1 Select tools and\nequipment\n• Identify and explain the uses\nof tools and equipment in\nbasic masonry works\n• Identify and describe safety\npractices in operating tools\nand equipment\n• Select and use appropriate\nPPE to specific tasks\n• Practicing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n8 Hours\n2.2 Transfer tools and\nequipment\n•\nExplain safe handling and\ntransferring procedures of\ntools and equipment\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\n Practicing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 98 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 94\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n3. Perform basic\nmasonry works\n3.1 Perform\nexcavation and\nback filling /\ncompaction\n•\nSelect and use appropriate\nPPE to specific tasks\n•\nExplain excavation\nprocedures based on\nexisting conditions\n•\nExplain\nbackfilling/compaction\nprocedures based on\nexisting conditions\n•\nPerform safe work\npractices and respond to\n emergency situations\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n40 Hours\n3.2 Perform basic\nrebar\nfabrication\n\n•\nIdentify re-bar sizes\n•\nExplain cutting, bending and\ntagging procedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.3 Erect and\ndismantle working\nplatform\n•\nIdentify scaffolds\nparts/components\n•\nExplain scaffold erection and\ndismantle procedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 99 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 95\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n3.4 Fabricate and\nstrip basic\nformworks\n•\nIdentify formworks\nparts/components\n•\nExplain fabrication,\ninstallation and stripping\nprocedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.5 Mix mortar\n•\nDetermine quantity of mortar\nmaterials\n•\nExplain mixing procedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.6 Mix concrete\n•\nDetermine quantity of\nconcrete materials\n•\nExplain mixing procedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n3.7 Perform\nconcreting work\n•\nExplain conveying,\ndepositing, consolidation,\nfinishing and curing\nprocedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 100 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 96\n\nUnit of\nCompetency\nLearning\nOutcomes\nLearning Activities\nMethodologies\nAssessment\nMethods\nNominal\nDuration\n\n3.8 Perform basic\nblock laying\n•\nIdentify and explain methods\nof laying blocks\n•\nEnumerate block laying\nprocedures\n•\nMeasuring work productivity\n•\nUtilizing most productive\npractice\n•\nPracticing 3R and 5S\n\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n3.9 Perform\nhousekeeping\n•\nExplain 3R and 5S\n• Lecture\n• Practical /\nDemonstration\n\n• Written\nexamination\n• Demonstration\nwith oral\nquestioning\n\n--- PDF PAGE 101 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018)\n97\n\n3.2\nTRAINING DELIVERY\n\n1. The delivery of training shall adhere to the design of the curriculum.\nDelivery shall be guided by the principles of competency-based TVET.\n\na. Course design is based on competency standards set by the industry\nor recognized industry sector; (Learning system is driven by\ncompetencies written to industry standards)\n\nb. Training delivery is learner-centered and should accommodate\nindividualized and self-paced learning strategies;\n\nc. Training can be done on an actual workplace setting, simulation of a\nworkplace and/or through adoption of modern technology.\n\nd. Assessment is based in the collection of evidence of the performance\nof work to the industry required standards;\n\ne. Assessment of competency takes the trainee’s knowledge and\nattitude into account but requires evidence of actual performance of\nthe competency as the primary source of evidence.\n\nf. Training program allows for recognition of prior learning (RPL) or\ncurrent competencies;\n\ng. Training completion is based on satisfactory completion of all\nspecified competencies not on the specified nominal duration of\nlearning.\n\n2. The competency-based TVET system recognizes various types of\ndelivery modes, both on-and off-the-job as long as the learning is driven\nby the competency standards specified by the industry. The following\ntraining modalities and their variations/components may be adopted\nsingly or in combination with other modalities when designing and\ndelivering training programs:\n\n2.1 Institution- Based:\n\n• Dual Training System (DTS)/Dualized Training Program (DTP)\nwhich contain both in-school and in-industry training or fieldwork\ncomponents. Details can be referred to the Implementing Rules\nand Regulations of the DTS Law and the TESDA Guidelines on\nthe DTP;\n\n--- PDF PAGE 102 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 98\n\n• Distance learning is a formal education process in which\nmajority of the instruction occurs when the students and\ninstructor are not in the same place. Distance learning may\nemploy\ncorrespondence\nstudy,\naudio,\nvideo,\ncomputer\ntechnologies or other modern technology that can be used to\nfacilitate learning and formal and non-formal training. Specific\nguidelines on this mode shall be issued by the TESDA\nSecretariat.\n\n• The traditional classroom-based or in-center instruction may be\nenhanced through use of learner-centered methods as well as\nlaboratory or field-work components.\n\n2.2 Enterprise-Based:\n\n• Formal Apprenticeship – Training within employment involving a\ncontract between an apprentice and an enterprise on an\napproved apprenticeable occupation.\n\n• Informal Apprenticeship - is based on a training (and working)\nagreement between an apprentice and a master craftsperson\nwherein the agreement may be written or oral and the master\ncraftsperson commits to training the apprentice in all the skills\nrelevant to his or her trade over a significant period of time,\nusually between one and four years, while the apprentice\ncommits to contributing productively to the work of the business.\nTraining is integrated into the production process and\napprentices learn by working alongside the experienced\ncraftsperson.\n\n• Enterprise-based Training- where training is implemented within\nthe company in accordance with the requirements of the specific\ncompany. Specific guidelines on this mode shall be issued by\nthe TESDA Secretariat.\n\n2.3 Community-Based – Community-Based – short term programs\nconducted by non-government organizations (NGOs), LGUs,\ntraining centers and other TVET providers which are intended to\naddress the specific needs of a community. Such programs can be\nconducted in informal settings such as barangay hall, basketball\ncourts, etc. These programs can also be mobile training program\n(MTP).\n\n--- PDF PAGE 103 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 99\n\n3.1 TRAINEE ENTRY REQUIREMENTS\n\nTrainees or students who wish to enter this training should possess the\nfollowing requirements:\n\n• Can communicate both orally and in writing\n• Can perform basic arithmetic operation\n• Physically fit\n\n--- PDF PAGE 104 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 100\n\n3.2 LIST OF TOOLS, EQUIPMENT AND MATERIALS\n\nList of tools, equipment and materials for the training of a maximum of 25\ntrainees for MASONRY NC I are as follows:\n\nA. (Full Qualification)\n\nTOOLS\nQTY\nDESCRIPTION\n10 pcs.\nBucket / Pail\n1 pc.\nMixing board\n(4x8 feet)\n12 pcs.\nShovel, flat\n25 pcs.\nSteel trowel\n(8 inches straight-edged pointed)\n25 pcs.\nWooden float\n25 pcs.\nSteel tape (5 meters)\n5 pcs.\nPlumb bob\n2 sets\nScaffolding\n(2 layers, 1.2 meters)\n5 pcs.\nChalk line\n5 pcs.\nCross-cut saw (18 inches)\n2 pcs.\nBar cutter\n2 pcs.\nBar bender\n5 pcs.\nSteel square\n5 pcs.\nCold chisel\n5 pcs.\nHacksaw\n5 pcs.\nLevel hose\n(5 meters)\n25 pcs.\nClaw hammer\n5 pcs.\nMeasuring box\n\n--- PDF PAGE 105 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 101\nTOOLS\nQTY\nDESCRIPTION\n5 pcs.\nHack saw blade\n5 pcs.\nSteel brush\n5 pcs.\nWheelbarrow\n5 pcs.\nCrow bar, 18 inches\n5 pcs.\nManual tampering tool\n1 pc.\nConcrete vibrator\n5 pcs.\nLevel bar\n\nEQUIPMENT\nQTY\nDESCRIPTION\n1 unit\nOne bagger mixer (gas operated)\n2 pcs.\nBlock cutter (7 inches blade diameter)\n\nMATERIAL\nQTY\nDESCRIPTION\n250 pcs.\nConcrete Hollow blocks ( 4 inches)\n10 bags\nCement\n25 pcs.\nReinforcing bars (10 mm diameter)\n3 m3\nSand\nVar\nWater\n5 kls.\nGI wire, #20\n10 kls.\nCommon wire Nails (assorted sizes)\n30 pcs.\nLumber (2” x 2” x 10’)\n\n--- PDF PAGE 106 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 102\nMATERIAL\nQTY\nDESCRIPTION\n2.5 kls.\nConcrete nails\n(1 1/2 inch)\n5 bags\nLime\n25 pcs.\nPencil\n5 rolls\nNylon string (5 meter length)\n2.5 m3\nGravel (¾ inch)\n5 m\nSand Screen (100mm)\n10 pcs\nPlywood\n(½” X 4’ X 8’)\n\nPERSONAL PROTECTIVE EQUIPMENT (PPE)\nQTY\nDESCRIPTION\nOne per trainee\nSafety shoes/ rubber boots (Trainee to provide)\nOne per trainee\nProper uniform/clothing (Trainee to provide)\nOne per trainee\nGloves (cotton) (Trainee to provide)\nOne per trainee\nSafety goggles (Trainee to provide)\n25 pcs.\nReflectorized vest\n\n--- PDF PAGE 107 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 103\n\n3.5 TRAINING FACILITIES\n\nThe masonry workshop must be of concrete structure. Based on class size\nof 25 students/trainees the space requirements for the teaching/learning and\ncirculation areas are as follows:\n\nSpace Requirement\nSize in Meters\nArea in\nSq. Meters\nPractical Training Area\n20 x 25\n500\nLibrary\n4 x 5\n20\nLecture Room\n8 x 6\n\n48\nTool Room/Storage\n4 x 5\n20\nWash room/Toilet\n4 x 5\n\n20\nCirculation area\n10 x 6\n\n60\nTOTAL AREA\n\n668\n\n--- PDF PAGE 108 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 104\n\n3.6 TRAINERS’ QUALIFICATION\n\n• Holder of National TVET Trainer Certificate Level I (NTTC Level I) in\nMASONRY NC II\n• Must have completed the 40-Hour Construction Occupational Safety\nand Health (COSH) per Department Order No. 13 s. 1998, Guidelines\nGoverning Occupational Safety and Health in the Construction\nIndustry conducted by OSHC and DOLE accredited Safety Training\nOrganizations\n• Must have had at least 2-years job/industry experience in Masonry\n\n3.7 INSTITUTIONAL ASSESSMENT\n\nInstitutional assessment is undertaken by trainees to determine their\nachievement of units of competency. A certificate of achievement is\nissued for each unit of Competency.\n\n--- PDF PAGE 109 ---\nMASONRY NC I Revision 01 Promulgated (10/29/2018) 105"
